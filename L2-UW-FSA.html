<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

const DATA = [{"n":1,"q":"Which of the following best describes a difference between Plan A and Plan B?","opts":["Plan B is typically pre-funded.","Thaitronics bears the risk if Plan B is underfunded.","Plan B is classified as a defined benefit plan under IFRS and US GAAP."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a001.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a001.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Malee Sangthong, CEO of Thai Electronics Public Company Limited (Thaitronics), is preparing a presentation on two of the company&#x27;s post-employment retirement benefits plans to be included in the upcoming board meeting. Plan A provides life and health care insurance, and Plan B promises yearly payments for life. Sangthong calls Somchai Nguyen, an investment analyst, and requests additional information about Plan B.<\/p><p>Nguyen explains the following:<\/p><p>The present value (PV) of Plan B obligations is THB 20 billion, the fair value (FV) of assets is THB 25 billion, and the PV of future economic benefits is THB 3.5 billion.<\/p><p>Plan B&#x27;s yearly payments to retirees are based on this formula: 1.5% × Years of service × Final salary.<\/p><p>Thaitronics measures its pension obligations using the projected unit credit method since the company reports under IFRS.<\/p><p>Sangthong asks Nguyen to provide an example of how the method works. In Exhibit 1, Nguyen presents information gathered from both a participant and the plan assumptions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex001.webp\" style=\"max-width:min(100%,423px)\" alt=\"Exhibit\"><p>Nguyen then demonstrates the calculation of the annual unit credit.<\/p><p>In the current period, Thaitronics reported an operating income of THB 1.5 billion and profit before taxes of THB 1.2 billion. Sangthong is concerned about Thaitronics&#x27;s operating performance and asks Nguyen how benefits expenses are reported in the profit and loss (P&amp;L) statement. Nguyen presents the components of post-retirement benefits expenses in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex002.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit\"><p>Nguyen explains that all benefits are classified as operating expenses, but he could make adjustments to address that concern. Nguyen then reclassifies benefits as operating and non-operating expenses to recalculate profit before taxation.<\/p><p>Thaitronics also grants options in the company&#x27;s stock to its managers as part of their compensation. Sangthong is concerned about the negative effect of the stock option plan on the company&#x27;s net income. Although the number of stock options granted to Thaitronics&#x27;s managers did not change materially in recent years, reported compensation expense increased significantly in the current year. Nguyen explains that these variations may be due to assumptions on which the FV of options is based, including volatility, dividend yield, and estimated life. He adds that using share-based compensation—such as stock options, stock grants, and stock appreciation rights (SAR)—has the following disadvantages:<\/p><p><b>Disadvantage 1:<\/b> Stock options may lead managers to seek higher returns and undertake riskier projects.<\/p><p><b>Disadvantage 2:<\/b> Stock grants and SAR increase the number of outstanding shares and dilute shareholders&#x27; ownership.<\/p><p><b>Disadvantage 3:<\/b> Share-based compensation is less efficient than cash bonuses for aligning the interests of managers and shareholders.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes a difference between Plan A and Plan B?<\/p><\/div><details clas ollowing disadvantages:<\/p><p><b>Disadvantage 1:<\/b> Stock options may lead managers to seek higher returns and undertake riskier projects.<\/p><p><b>Disadvantage 2:<\/b> Stock grants and SAR increase the number of outstanding shares and dilute shareholders&#x27; ownership.<\/p><p><b>Disadvantage 3:<\/b> Share-based compensation is less efficient than cash bonuses for aligning the interests of managers and shareholders.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the share-based compensation, a decrease in which of the following assumptions most likely resulted in a decrease in Thaitronics&#x27;s net income?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q005.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":6,"q":"Which of the following is correctly identified by Nguyen as a disadvantage of share-based compensation?","opts":["Disadvantage 1","Disadvantage 2","Disadvantage 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a006.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a006.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Malee Sangthong, CEO of Thai Electronics Public Company Limited (Thaitronics), is preparing a presentation on two of the company&#x27;s post-employment retirement benefits plans to be included in the upcoming board meeting. Plan A provides life and health care insurance, and Plan B promises yearly payments for life. Sangthong calls Somchai Nguyen, an investment analyst, and requests additional information about Plan B.<\/p><p>Nguyen explains the following:<\/p><p>The present value (PV) of Plan B obligations is THB 20 billion, the fair value (FV) of assets is THB 25 billion, and the PV of future economic benefits is THB 3.5 billion.<\/p><p>Plan B&#x27;s yearly payments to retirees are based on this formula: 1.5% × Years of service × Final salary.<\/p><p>Thaitronics measures its pension obligations using the projected unit credit method since the company reports under IFRS.<\/p><p>Sangthong asks Nguyen to provide an example of how the method works. In Exhibit 1, Nguyen presents information gathered from both a participant and the plan assumptions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex001.webp\" style=\"max-width:min(100%,423px)\" alt=\"Exhibit\"><p>Nguyen then demonstrates the calculation of the annual unit credit.<\/p><p>In the current period, Thaitronics reported an operating income of THB 1.5 billion and profit before taxes of THB 1.2 billion. Sangthong is concerned about Thaitronics&#x27;s operating performance and asks Nguyen how benefits expenses are reported in the profit and loss (P&amp;L) statement. Nguyen presents the components of post-retirement benefits expenses in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex002.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit\"><p>Nguyen explains that all benefits are classified as operating expenses, but he could make adjustments to address that concern. Nguyen then reclassifies benefits as operating and non-operating expenses to recalculate profit before taxation.<\/p><p>Thaitronics also grants options in the company&#x27;s stock to its managers as part of their compensation. Sangthong is concerned about the negative effect of the stock option plan on the company&#x27;s net income. Although the number of stock options granted to Thaitronics&#x27;s managers did not change materially in recent years, reported compensation expense increased significantly in the current year. Nguyen explains that these variations may be due to assumptions on which the FV of options is based, including volatility, dividend yield, and estimated life. He adds that using share-based compensation—such as stock options, stock grants, and stock appreciation rights (SAR)—has the following disadvantages:<\/p><p><b>Disadvantage 1:<\/b> Stock options may lead managers to seek higher returns and undertake riskier projects.<\/p><p><b>Disadvantage 2:<\/b> Stock grants and SAR increase the number of outstanding shares and dilute shareholders&#x27; ownership.<\/p><p><b>Disadvantage 3:<\/b> Share-based compensation is less efficient than cash bonuses for aligning the interests of managers and shareholders.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is correctly identified by Nguyen as a disadvantage of share-based compensation?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":7,"q":"Which of Sicherheit's investments is eligible to be reclassified?","opts":["Investment 1","Investment 2","Investment 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Sicherheit Insurance Group is a German property and casualty insurance company. Otto Krause, CFO of Sicherheit, is reviewing the company&#x27;s investments and acquisitions. He first meets with Rebekka Boesch, portfolio manager at Sicherheit. Boesch explains that there have been significant changes to three of the company&#x27;s investments:<\/p><p>Investment 1: A debt instrument was purchased to generate cash flows through the receipt of interest payments, but Boesch decided to realize profit through a sale.<\/p><p>Investment 2: A debt instrument was purchased to realize profit through a sale, but after the issuer missed an interest payment, Boesch is holding the asset to minimize realized losses.<\/p><p>Investment 3: An equity investment was purchased to realize profit through trading, but after dividends were initiated, Boesch decided to hold the asset to collect dividends.<\/p><p>Krause asks about the equity investment in Hamburg Bank&#x27;s stock; Sicherheit owns 5% of the stock. For reporting purposes, Sicherheit had classified the investment as fair value through other comprehensive income (FVOCI). Boesch provides Krause data on the investment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex003.webp\" style=\"max-width:min(100%,600px)\" alt=\"Exhibit\"><p>Boesch notes that companies Sicherheit invests in are often acquirers themselves. However, since some report under IFRS but others use US GAAP, their financials are not always comparable.<\/p><p>Krause then reviews Sicherheit&#x27;s recent acquisitions. Sicherheit plans to close its purchase of 80% of Rhine Reinsurance stock for €56 million in the coming days. Sicherheit agreed to purchase Rhine using 1 million shares of its €1 par stock, priced at €56 to fund the purchase. The companies&#x27; financials are provided in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex004.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit\"><p>Krause also reviews Westen Insurers, a company that Sicherheit acquired three years ago. During the most recent review, it was determined that Westen has: a carrying value of €76 million,<\/p><p>recoverable amount of €70 million,<\/p><p>identifiable net assets of €69.5 million, and<\/p><p>a fair value of €69 million.<\/p><p>Sicherheit carries €2 million of goodwill from this acquisition.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Sicherheit&#x27;s investments is eligible to be reclassified?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":8,"q":"Based on Exhibit 1, if Sicherheit had classified the investment in Hamburg Bank as fair value through profit or loss (FVPL) instead of FVOCI, the amount it would have recorded on its 20X8 income statement would have been:","opts":["the same.","greater by €15,000.","greater by €27,000."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sicherheit Insurance Group is a German property and casualty insurance company. Otto Krause, CFO of Sicherheit, is reviewing the company&#x27;s investments and acquisitions. He first meets with Rebekka Boesch, portfolio manager at Sicherheit. Boesch explains that there have been significant changes to three of the company&#x27;s investments:<\/p><p>Investment 1: A debt instrument was purchased to generate cash flows through the receipt of interest payments, but Boesch decided to realize profit through a sale.<\/p><p>Investment 2: A debt instrument was purchased to realize profit through a sale, but after the issuer missed an interest payment, Boesch is holding the asset to minimize realized losses.<\/p><p>Investment 3: An equity investment was purchased to realize profit through trading, but after dividends were initiated, Boesch decided to hold the asset to collect dividends.<\/p><p>Krause asks about the equity investment in Hamburg Bank&#x27;s stock; Sicherheit owns 5% of the stock. For reporting purposes, Sicherheit had classified the investment a ased to generate cash flows through the receipt of interest payments, but Boesch decided to realize profit through a sale.<\/p><p>Investment 2: A debt instrument was purchased to realize profit through a sale, but after the issuer missed an interest payment, Boesch is holding the asset to minimize realized losses.<\/p><p>Investment 3: An equity investment was purchased to realize profit through trading, but after dividends were initiated, Boesch decided to hold the asset to collect dividends.<\/p><p>Krause asks about the equity investment in Hamburg Bank&#x27;s stock; Sicherheit owns 5% of the stock. For reporting purposes, Sicherheit had classified the investment as fair value through other comprehensive income (FVOCI). Boesch provides Krause data on the investment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex003.webp\" style=\"max-width:min(100%,600px)\" alt=\"Exhibit\"><p>Boesch notes that companies Sicherheit invests in are often acquirers themselves. However, since some report under IFRS but others use US GAAP, their financials are not always comparable.<\/p><p>Krause then reviews Sicherheit&#x27;s recent acquisitions. Sicherheit plans to close its purchase of 80% of Rhine Reinsurance stock for €56 million in the coming days. Sicherheit agreed to purchase Rhine using 1 million shares of its €1 par stock, priced at €56 to fund the purchase. The companies&#x27; financials are provided in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex004.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit\"><p>Krause also reviews Westen Insurers, a company that Sicherheit acquired three years ago. During the most recent review, it was determined that Westen has: a carrying value of €76 million,<\/p><p>recoverable amount of €70 million,<\/p><p>identifiable net assets of €69.5 million, and<\/p><p>a fair value of €69 million.<\/p><p>Sicherheit carries €2 million of goodwill from this acquisition.<\/p><\/div><\/details><div class=\"qte s stock; Sicherheit owns 5% of the stock. For reporting purposes, Sicherheit had classified the investment as fair value through other comprehensive income (FVOCI). Boesch provides Krause data on the investment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex003.webp\" style=\"max-width:min(100%,600px)\" alt=\"Exhibit\"><p>Boesch notes that companies Sicherheit invests in are often acquirers themselves. However, since some report under IFRS but others use US GAAP, their financials are not always comparable.<\/p><p>Krause then reviews Sicherheit&#x27;s recent acquisitions. Sicherheit plans to close its purchase of 80% of Rhine Reinsurance stock for €56 million in the coming days. Sicherheit agreed to purchase Rhine using 1 million shares of its €1 par stock, priced at €56 to fund the purchase. The companies&#x27; financials are provided in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex004.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit\"><p>Krause also reviews Westen Insurers, a company that Sicherheit acquired three years ago. During the most recent review, it was determined that Westen has: a carrying value of €76 million,<\/p><p>recoverable amount of €70 million,<\/p><p>identifiable net assets of €69.5 million, and<\/p><p>a fair value of €69 million.<\/p><p>Sicherheit carries €2 million of goodwill from this acquisition.<\/p><\/div><\/details><div class=\"qtext\"><p>If Sicherheit reported under US GAAP instead of FRS, the total impairment charge on Westen (in €) when goodwill is tested would be:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":13,"q":"Which of Kalela's observations regarding the combined ratio are correct?","opts":["None of the observations","Only Observations 1 and 3","All of the observations"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Leilani Kalela, CFA, is a recently hired junior equity analyst at Corona Investment Management, a buy-side firm. Kalela has been tasked with becoming a subject matter expert on companies and stocks in the financial sector. Her coverage universe consists mostly of banks and insurance companies.<\/p><p>Kalela reports to Kai Oshiro, lead financial sector analyst at Corona. To test Kalela&#x27;s knowledge of the insurance industry, Oshiro asks Kalela to describe the combined ratio.<\/p><p>Kalela makes three observations about the combined ratio:<\/p><p>Observation 1:It represents underwriting profitability adjusted for global risk-based capital requirements.<\/p><p>Observation 2:It includes investment returns.<\/p><p>Observation 3:A combined ratio greater than 100% is desirable.<\/p><p>Oshiro then asks Kalela to compare property and casualty insurers (P&amp;C) to life and health insurers (L&amp;H). Kalela notes the following differences:<\/p><p><b>Difference 1:<\/b> L&amp;H insurers generally have higher capital requirements.<\/p><p><b>Difference 2:<\/b> L&amp;H insurers&#x27; claims are less predictable.<\/p><p><b>Difference 3:<\/b> The combined ratio is more appropriate for P&amp;C insurers than for life insurers.<\/p><p>Oshiro then shifts the discussion to the banking sector and provides Kalela with an earnings breakdown for three banks, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex005.webp\" style=\"max-width:min(100%,455px)\" alt=\"Exhibit\"><p>Oshiro notes that Bank C&#x27;s net interest income has been unusually volatile over the past few years, as shown in Exhibi itle=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Leilani Kalela, CFA, is a recently hired junior equity analyst at Corona Investment Management, a buy-side firm. Kalela has been tasked with becoming a subject matter expert on companies and stocks in the financial sector. Her coverage universe consists mostly of banks and insurance companies.<\/p><p>Kalela reports to Kai Oshiro, lead financial sector analyst at Corona. To test Kalela&#x27;s knowledge of the insurance industry, Oshiro asks Kalela to describe the combined ratio.<\/p><p>Kalela makes three observations about the combined ratio:<\/p><p>Observation 1:It represents underwriting profitability adjusted for global risk-based capital requirements.<\/p><p>Observation 2:It includes investment returns.<\/p><p>Observation 3:A combined ratio greater than 100% is desirable.<\/p><p>Oshiro then asks Kalela to compare property and casualty insurers (P&amp;C) to life and health insurers (L&amp;H). Kalela notes the following differences:<\/p><p><b>Difference 1:<\/b> L&amp;H insurers generally have higher capital requirements.<\/p><p><b>Difference 2:<\/b> L&amp;H insurers&#x27; claims are less predictable.<\/p><p><b>Difference 3:<\/b> The combined ratio is more appropriate for P&amp;C insurers than for life insurers.<\/p><p>Oshiro then shifts the discussion to the banking sector and provides Kalela with an earnings breakdown for three banks, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex005.webp\" style=\"max-width:min(100%,455px)\" alt=\"Exhibit\"><p>Oshiro notes that Bank C&#x27;s net interest income has been unusually volatile over the past few years, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex006.webp\" style=\"max-width:min(100%,566px)\" alt=\"Exhibit\"><p>In a final note, Oshiro observes that the central bank is expected to cut its policy rate by 25 basis points at the beginning of the next quarter. In anticipation of this change, Bank A has exactly matched its assets and liabilities in terms of interest rates, maturities, and repricing frequencies, and its Level 3 assets have increased significantly over the past six months.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Oshiro&#x27;s observation of the Level 3 assets, the most appropriate conclusion is that Bank A&#x27;s investment portfolio has increased its exposure to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q018.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":19,"q":"Based on Exhibit 1, PSE's pension expense (in USD millions) for 20X4 is closest to:","opts":["200.","215.","240."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a019.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a019.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 19–24 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Miguel Reyes, a senior portfolio manager, is considering adding two stocks—Platinum Solar Energy (PSE) and Hill Brothers Stores (HBS)—to the mutual fund he manages. Both companies report under US GAAP and have considerable pension obligations. Reyes is concerned about how these pension plans may affect the companies&#x27; financial statements and asks Patricia Stewart, a senior analyst, to provide a deeper analysis.<\/p><p>Stewart gathers information from PSE&#x27;s financial statements in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex007.webp\" style=\"max-width:min(100%,510px)\" alt=\"Exhibit\"><p>Stewart explains that part of periodic pension costs is recognized in the profit and loss statement (P&amp;L) and classified as pension expenses, while the other part is reported in other comprehensive income (OCI.) She also reminds Reyes that PSE recently disclosed that the company will launch a share-based compensation program. PSE is currently analyzing three alternatives: stock appreciation rights (SAR), performance shares, and stock options. Stewart explains the alternatives and makes the following statements:<\/p><p>Statement 1: Stock appreciation rights do not dilute the ownership interests of the company&#x27;s shareholders since they are based on the performance of hypothetical stock. Statement 2: Performance shares must be returned to the company if the employee resigns or does not achieve certain performance goals.<\/p><p>Statement 3: In a stock option plan, compensation expense is typically measured on the date options are granted and recognized over the service period.<\/p><p>Stewart then gathers information from HBS&#x27;s financial statements in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex008.webp\" style=\"max-width:min(100%,488px)\" alt=\"Exhibit\"><p>Stewart explains that HBS pension plan&#x27;s net unrecognized losses reported in OCI at the beginning of the year are amortized to the P&amp;L under the corridor approach. She also explains that, under US GAAP, all pension contributions are treated as operating activities in the cash flow statement. However, since the difference between contributions and pension cost could be interpreted as a source of financing, she proposes an adjustment to HBS&#x27;s operating cash flow in her analysis.<\/p><p>Reyes believes that the expected return on plan assets is high given the current market scenario. Stewart says that this is the company&#x27;s assumption and explains how changes in that assumption would affect HBS&#x27;s financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, PSE&#x27;s pension expense (in USD millions) for 20X4 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":20,"q":"Based on Exhibit 1, the amount of periodic pension cost PSE reports in OCI (in USD millions) is closest to:","opts":["85.","115.","125."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Miguel Reyes, a senior portfolio manager, is considering adding two stocks—Platinum Solar Energy (PSE) and Hill Brothers Stores (HBS)—to the mutual fund he manages. Both companies report under US GAAP and have considerable pension obligations. Reyes is concerned about how these pension plans may affect the companies&#x27; financial statements and asks Patricia Stewart, a senior analyst, to provide a deeper analysis.<\/p><p>Stewart gathers information from PSE&#x27;s financial statements in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex007.webp\" style=\"max-width:min(100%,510px)\" alt=\"Exhibit\"><p>Stewart explains that part of periodic pension costs is recognized in the profit and loss statement (P&amp;L) and classified as pension expenses, while the other part is reported in other comprehensive income (OCI.) She also reminds Reyes that PSE recently disclosed that the company will launch a share-based compensation program. PSE is currently analyzing three alternatives: stoc alendar year as their fiscal year.<\/p><p>Impala reports financial results under IFRS and is required to use the Peruvian sol (PEN) as its reporting currency. Additional information on Impala is: 50% of its sales are to companies in Argentina.<\/p><p>Approximately 30% of its sales in Argentina are denominated in Argentine pesos (ARS), with the remainder denominated in PEN.<\/p><p>All sales are fulfilled from inventory in Peru.<\/p><p>Impala&#x27;s board of directors has 15 members; Lightspeed can appoint three members to the board.<\/p><p>Sarallen is in Argentina and uses ARS as its reporting currency. It hires its own employees without input from Lightspeed, maintains its own sales force, and most of its sales are denominated in ARS. On January 1, 20X1, it purchased undeveloped land in Argentina for ARS 4 million to build a factory/warehouse facility. Exhibit 2 contains information concerning exchange rates and economic information for Sarallen:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex010.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><p>Exhibit 3 shows data from Sarallen&#x27;s 20X2 income statement and balance sheet:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex011.webp\" style=\"max-width:min(100%,378px)\" alt=\"Exhibit\"><p>Sarallen&#x27;s common stock was issued when the Argentinean price index was 100; its long-term debt is denominated in ARS.<\/p><p>Jarvis Fung, CFA, is a junior financial analyst with Lightspeed who has been assigned to analyze several aspects of Sarallen&#x27;s results to determine their impact on Lightspeed&#x27;s consolidated financial statements. Specifically, Fung&#x27;s supervisor wants him to answer three questions:<\/p><p>What value should Lightspeed report on its 20X2 consolidated financial statements for the land purchased by Sarallen?<\/p><p>Assuming that the ARS is expected to continue to weaken against the GBP, how could Sarallen increase its purchasing power?<\/p><p>On its consolidated statements, where does Lightspeed report Sarallen&#x27;s purchasing power gain or loss?<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information from Exhibit 1, the amount that Lightspeed reports in 20X2 as a transaction gain or loss for Transactions 1 and 2 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":26,"q":"With respect to the inventory purchased from the German supplier, the amount (in GBP) that Lightspeed reports as inventory in its 20X2 consolidated balance sheet is closest to:","opts":["1,368,000","1,420,000","1,444,000"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a026.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a026.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 25–30 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lightspeed Industries is a British company that manufactures specialty computer hardware which it sells globally. It reports financial results under IFRS and uses GBP as its functional and reporting currency. On October 15, 20X2, Lightspeed made two transactions:<\/p><p>Transaction 1: Sold goods to an American company for USD 2 million and will receive this amount on January 20, 20X3.<\/p><p>Transaction 2: Purchased inventory from a German supplier for EUR 1.6 million and will pay this amount on January 20, 20X3.<\/p><p>Exhibit 1 shows the relevant exchange rates for these transactions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex009.webp\" style=\"max-width:min(100%,617px)\" alt=\"Exhibit\"><p>Lightspeed has two wholly owned subsidiaries, Impala Semiconductors, which it created ns information concerning exchange rates and economic information for Sarallen:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex010.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><p>Exhibit 3 shows data from Sarallen&#x27;s 20X2 income statement and balance sheet:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex011.webp\" style=\"max-width:min(100%,378px)\" alt=\"Exhibit\"><p>Sarallen&#x27;s common stock was issued when the Argentinean price index was 100; its long-term debt is denominated in ARS.<\/p><p>Jarvis Fung, CFA, is a junior financial analyst with Lightspeed who has been assigned to analyze several aspects of Sarallen&#x27;s results to determine their impact on Lightspeed&#x27;s consolidated financial statements. Specifically, Fung&#x27;s supervisor wants him to answer three questions:<\/p><p>What value should Lightspeed report on its 20X2 consolidated financial statements for the land purchased by Sarallen?<\/p><p>Assuming that the ARS is expected to continue to weaken against the GBP, how could Sarallen increase its purchasing power?<\/p><p>On its consolidated statements, where does Lightspeed report Sarallen&#x27;s purchasing power gain or loss?<\/p><\/div><\/details><div class=\"qtext\"><p>Lightspeed would most appropriately include Sarallen&#x27;s purchasing power gain or loss in its consolidated financial statements as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q030.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":31,"q":"Based on only Exhibit 1, which company's ROE is expected to decline to the industry average at the fastest rate?","opts":["Caph Corp","Enif Group","Rigel Industries"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a031.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a031.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Edvin Sundberg, head of research at Kalix Brokers, meets with Mona Lundin, the firm&#x27;s analyst covering the machinery manufacturing industry. Sundberg wants to discuss Lundin&#x27;s findings about three companies that she has been researching: Caph Corporation, Enif Group, and Rigel Industries, all reporting under IFRS.<\/p><p>Lundin tells Sundberg that, in an initial analysis, she noted that the ROE of the three companies are similar and above industry average. She applied the mean reversion principle in her forecast of each company&#x27;s future ROE, breaking earnings down into a cash flow component, expressed by operating cash flow (OCF), and an accruals component. Lundin&#x27;s forecasts are based on the companies&#x27; 20X2 net income and OCF, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex012.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit\"><p>Lundin also assessed the likelihood of misreporting. She used a quantitative tool, the Beneish model, to calculate the probability of manipulation, expressed by the M-scores in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex013.webp\" style=\"max-width:min(100%,369px)\" alt=\"Exhibit\"><p>Sundberg asks Lundin if she noticed any warning signs of deterioration in Caph&#x27;s OCF. Lundin explains that, in the last month of 20X2, Caph:<\/p><p>Sold products on credit in a one-off transaction to a special purpose entity<\/p><p>Received an early payment discount to pay a supplier 90 days before maturity<\/p><p>Started to capitalize certain costs that are typically treated as expenses by the industry<\/p><p>Sundberg says that Enif&#x27;s long-term contracts to purchase components have been structured as take-or-pay agreements. These obligations are normally recorded on Enif&#x27;s financial statements only when the purchase takes place and the components are received. Sundberg is concerned that this may affect the quality of Enif&#x27;s balance sheet and asks Lundin to estimate the present value of the obligations and related assets.<\/p><p>Lundin tells Sundberg that she completed the risk evaluation of Rigel, using three main sources of information in her analysis:<\/p><p>news about Rigel in the financial press,<\/p><p>Rigel&#x27;s management commentary (ie, management discussion and analysis [MD&amp;A]), and<\/p><p>the auditor&#x27;s opinion on Rigel&#x27;s financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on only Exhibit 1, which company&#x27;s ROE is expected to decline to the industry average at the fastest rate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":32,"q":"Based on only Exhibit 2, which company is most likely an earnings manipulator?","opts":["Caph Corp","Enif Group","Rigel Industries"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a032.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a032.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Edvin Sundberg, head of research at Kalix Brokers, meets with Mona Lundin, the firm&#x27;s analyst covering the machinery manufacturing industry. Sundberg wants to discuss Lundin&#x27;s findings about three companies that she has been researching: Caph Corporation, Enif Group, and Rigel Industries, all reporting under IFRS.<\/p><p>Lundin tells Sundberg that, in an initial analysis, she noted th tement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Edvin Sundberg, head of research at Kalix Brokers, meets with Mona Lundin, the firm&#x27;s analyst covering the machinery manufacturing industry. Sundberg wants to discuss Lundin&#x27;s findings about three companies that she has been researching: Caph Corporation, Enif Group, and Rigel Industries, all reporting under IFRS.<\/p><p>Lundin tells Sundberg that, in an initial analysis, she noted that the ROE of the three companies are similar and above industry average. She applied the mean reversion principle in her forecast of each company&#x27;s future ROE, breaking earnings down into a cash flow component, expressed by operating cash flow (OCF), and an accruals component. Lundin&#x27;s forecasts are based on the companies&#x27; 20X2 net income and OCF, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex012.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit\"><p>Lundin also assessed the likelihood of misreporting. She used a quantitative tool, the Beneish model, to calculate the probability of manipulation, expressed by the M-scores in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex013.webp\" style=\"max-width:min(100%,369px)\" alt=\"Exhibit\"><p>Sundberg asks Lundin if she noticed any warning signs of deterioration in Caph&#x27;s OCF. Lundin explains that, in the last month of 20X2, Caph:<\/p><p>Sold products on credit in a one-off transaction to a special purpose entity<\/p><p>Received an early payment discount to pay a supplier 90 days before maturity<\/p><p>Started to capitalize certain costs that are typically treated as expenses by the industry<\/p><p>Sundberg says that Enif&#x27;s long-term contracts to purchase components have been structured as take-or-pay agreements. These obligations are normally recorded on Enif&#x27;s financial statements only when the purchase takes place and the components are received. Sundberg is concerned that this may affect the quality of Enif&#x27;s balance sheet and asks Lundin to estimate the present value of the obligations and related assets.<\/p><p>Lundin tells Sundberg that she completed the risk evaluation of Rigel, using three main sources of information in her analysis:<\/p><p>news about Rigel in the financial press,<\/p><p>Rigel&#x27;s management commentary (ie, management discussion and analysis [MD&amp;A]), and<\/p><p>the auditor&#x27;s opinion on Rigel&#x27;s financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following sources is the least valuable source of information about Rigel&#x27;s risk?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":36,"q":"Which of the following describes a risk that Rigel is required to disclose?","opts":["Unfavorable economic conditions","Hiring and retention of key executives and qualified employees","Exposure to changes in interest rates and foreign exchange rates"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a036.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a036.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Edvin Sundberg, head of research at Kalix Brokers, meets with Mona Lundin, the firm&#x27;s analyst covering the machinery manufacturing industry. Sundberg wants to discuss Lundin&#x27;s findings about three companies that she has been researching: Caph Corporation, Enif Group, and Rigel Industries, all reporting under IFRS.<\/p><p>Lundin tells Sundberg that, in an initial analysis, she noted that the ROE of the three companies are similar and above industry average. She applied the mean reversion principle in her forecast of each company&#x27;s future ROE, breaking earnings down into a cash flow component, expressed by operating cash flow (OCF), and an accruals component. Lundin&#x27;s forecasts are based on the companies&#x27; 20X2 net income and OCF, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex012.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit\"><p>Lundin also assessed the likelihood of misreporting. She used a quantitative tool, the Beneish model, to calculate the probability of manipulation, expressed by the M-scores in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex013.webp\" style=\"max-width:min(100%,369px)\" alt=\"Exhibit\"><p>Sundberg asks Lundin if she noticed any warning signs of deterioration in Caph&#x27;s OCF. Lundin explains that, in the last month of 20X2, Caph:<\/p><p>Sold products on credit in a one-off transaction to a special purpose entity<\/p><p>Received an early payment discount to pay a supplier 90 days before maturity<\/p><p>Started to capitalize certain costs that are typically treated as expenses by the industry<\/p><p>Sundberg says that Enif&#x27;s long-term contracts to purchase components have been structured as take-or-pay agreements. These obligations are normally recorded on Enif&#x27;s financial statements only when the purchase takes place and the components are received. Sundberg is concerned that this may affect the quality of Enif&#x27;s balance sheet and asks Lundin to estimate the present value of the obligations and related assets.<\/p><p>Lundin tells Sundberg that she completed the risk evaluation of Rigel, using three main sources of information in her analysis:<\/p><p>news about Rigel in the financial press,<\/p><p>Rigel&#x27;s management commentary (ie, management discussion and analysis [MD&amp;A]), and<\/p><p>the auditor&#x27;s opinion on Rigel&#x27;s financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following describes a risk that Rigel is required to disclose?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q036.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":37,"q":"With regard to Xia's statement, an important factor in the analysis of Bank HIJ that the CAMELS approach fails to consider is:","opts":["mission of the bank.","solvency of the bank.","sensitivity to market risk."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a037.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a037.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Xia Munashe, a bank examiner, and Terry Meztli, an analyst, are assigned to review Bank HIJ. They incorporate the CAMELS rating system in their evaluation. Bank HIJ is a community bank with investments heavily allocated in the farming industry, specifically real estate financing. Xia tells Terry: &quot;The CAMELS rating system is not a thorough approach to assessing banks and should be combined with a separate analysis of factors that CAMELS does not consider.&quot;<\/p><p>Xia explains how the bank&#x27;s capital is categorized in different tiers under the CAMELS rating system. Terry notes that the bank has changed its capital structure and issued noncumulative perpetual preferred stock to pay down subordinated debt maturing in 7 years.<\/p><p>Terry then analyzes the second component of the CAMELS rating system, asset quality, and states that Bank HIJ has not recorded adequate provisioning for expected loan losses in the coming year. Terry gathers information, shown in Exhibits 1 and 2, to evaluate the bank.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex014.webp\" style=\"max-width:min(100%,537px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex015.webp\" style=\"max-width:min(100%,536px)\" alt=\"Exhibit\"><p>Xia then makes the following comments:<\/p><p>Comment 1: The CAMELS approach uses the net stable funding ratio (NSFR) when assessing the liquidity of a bank.<\/p><p>Comment 2: All else equal, increasing the maturity of loans versus deposits will improve both the NSFR and liquidity coverage ratio (LCR).<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to Xia&#x27;s statement, an important factor in the analysis of Bank HIJ that the CAMELS approach fails to consider is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":38,"q":"The change to Bank HIJ's capital structure most likely increased its:","opts":["Total capital ratio.","Tier 1 capital ratio.","Tier 2 capital ratio."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Xia Munashe, a bank examiner, and Terry Meztli, an analyst, are assigned to review Bank HIJ. They incorporate the CAMELS rating system in their evaluation. Bank HIJ is a community bank with investments heavily allocated in the farming industry, specifically real estate financing. Xia tells Terry: &quot;The CAMELS rating system is not a thorough approach to assessing banks and should be combined with a separate analysis of factors that CAMELS does not consider.&quot;<\/p><p>Xia explains how the bank&#x27;s capital is categorized in different tiers under the CAMELS rating system. Terry notes that the bank has changed its capital structure and issued noncumulative perpetual preferred stock to pay down subordinated debt maturing in 7 years.<\/p><p>Terry then analyzes the second component of the CAMELS rating system, asset quality, and states that Bank HIJ has not recorded adequate provisioning for expected loan losses in the coming year. Terry gathers information, shown in Exhibits 1 and 2, to evaluate the bank.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex014.webp\" style=\"max-width:min(100%,537px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex015.webp\" style=\"max-width:min(100%,536px)\" alt=\"Exhibit\"><p>Xia then makes the following comments:<\/p><p>Comment 1: The CAMELS approach uses the net stable funding ratio (NSFR) when assessing the liquidity of a bank.<\/p><p>Comment 2: All else equal, increasing the maturity of loans versus deposits will improve both the NSFR and liquidity coverage ratio (LCR).<\/p><\/div><\/details><div class=\"qtext\"><p>The change to Bank HIJ&#x27;s capital structure most likely increased its:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q038.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":39,"q":"Based on Terry's comment on asset quality and Exhibit 1, from 20X7 to 20X9, the earnings quality of Bank HIJ most likely:","opts":["worsened.","remained unchanged.","improved."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a039.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a039.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignett ry><div class=\"vig-body\"><p>Xia Munashe, a bank examiner, and Terry Meztli, an analyst, are assigned to review Bank HIJ. They incorporate the CAMELS rating system in their evaluation. Bank HIJ is a community bank with investments heavily allocated in the farming industry, specifically real estate financing. Xia tells Terry: &quot;The CAMELS rating system is not a thorough approach to assessing banks and should be combined with a separate analysis of factors that CAMELS does not consider.&quot;<\/p><p>Xia explains how the bank&#x27;s capital is categorized in different tiers under the CAMELS rating system. Terry notes that the bank has changed its capital structure and issued noncumulative perpetual preferred stock to pay down subordinated debt maturing in 7 years.<\/p><p>Terry then analyzes the second component of the CAMELS rating system, asset quality, and states that Bank HIJ has not recorded adequate provisioning for expected loan losses in the coming year. Terry gathers information, shown in Exhibits 1 and 2, to evaluate the bank.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex014.webp\" style=\"max-width:min(100%,537px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex015.webp\" style=\"max-width:min(100%,536px)\" alt=\"Exhibit\"><p>Xia then makes the following comments:<\/p><p>Comment 1: The CAMELS approach uses the net stable funding ratio (NSFR) when assessing the liquidity of a bank.<\/p><p>Comment 2: All else equal, increasing the maturity of loans versus deposits will improve both the NSFR and liquidity coverage ratio (LCR).<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Xia&#x27;s comments on liquidity assessment using the CAMELS approach is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q042.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":43,"q":"According to Gibson's analysis, the most appropriate conclusion about the quality of Woodroffe Industries' financial reports is that:","opts":["only earnings quality is low.","only reporting quality is low.","both earnings quality and reporting quality are low."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a043.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a043.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Emily Gibson is a senior analyst covering the manufacturing sector for an Australian asset manager. She has been directed by her supervisor, Noah Murphy, to assess the quality of the financial reports of three companies: Woodroffe Industries, Brumlow Group, and Meharry Manufacturing.<\/p><p>After analyzing Woodroffe Industries&#x27; financial reports, Gibson noted that:<\/p><p>the reports comply with IFRS;<\/p><p>earnings derive primarily from recurring activities and returns are greater than the cost of capital; and<\/p><p>management uses reserves and allowances to reduce earnings variation and to increase predictability.<\/p><p>Gibson learned that Woodroffe acquired a manufacturing plant on the last day of 20X6, generating a substantial amount of goodwill. After a detailed analysis, Gibson concluded that Woodroffe&#x27;s management likely overstated goodwill by understating the fair value of intangible assets at the time of the acquisition. The company did not report any goodwill impairment charges in 20X7.<\/p><p>Afterward, Gibson tells Murphy that she has arrived at two conclusions about Brumlow Group:<\/p><p>Conclusion 1: The CEO and CFO reported fictitious transactions with service providers and misappropriated the funds paid by Brumlow.<\/p><p>Conclusion 2: Brumlow sold a manufacturing plant at a gain but did not deduct this gain from net income when constructing the indirect cash flow statement.<\/p><p>Murphy asks Gibson about Meharry Manufacturing. He is concerned that Meharry may have been overstating its revenues, and he gives Gibson two suggestions: Suggestion 1: Calculate revenue metrics, like revenue per output or area, and compare those metrics with peers.<\/p><p>Suggestion 2: Find out if Meharry&#x27;s officers or shareholders own companies that are also Meharry&#x27;s clients.<\/p><p>Gibson adds that Meharry&#x27;s cost capitalization policies are significantly more aggressive than those of its competitors. She believes that the company is improperly capitalizing costs that should have been expensed. She has analyzed Meharry&#x27;s financial statements, investigating trends that could indicate an improper capitalization of costs.<\/p><\/div><\/details><div class=\"qtext\"><p>According to Gibson&#x27;s analysis, the most appropriate conclusion about the quality of Woodroffe Industries&#x27; financial reports is that:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q043.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":44,"q":"All else equal, if goodwill was overstated in 20X6, the effect on Woodroffe's financial statements in 20X6 and 20X7 is most likely that:","opts":["total assets in 20X6 are overstated.","total assets in 20X7 are understated.","amortization expenses in 20X7 are understated."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a044.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a044.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily Gibson is a senior anal px)\" alt=\"Exhibit\"><p>Sleepwell&#x27;s PPE, patents, and trademarks have a remaining useful life of 20 years. Manor uses the straight-line method to depreciate noncurrent assets.<\/p><p>Exhibit 2 shows each company&#x27;s abbreviated income statement for the year ending December 31, 20X0, and its projected income statement for the period ending December 31, 20X1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex017.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>In 20x1, Sleepwell is sued for GBP 1.0 million in damages. Sleepwell&#x27;s attorneys believe that the fair value of the claim is at most GBP 500,000 and that there is a low probability that Sleepwell will have to pay any amount on this claim. The most appropriate amount for Manor to include on its consolidated balance sheet (in GBP millions) with respect to the legal claim is:<\/p><\/div><details class=\"qorig\" open><summary>Ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q054.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":55,"q":"Based on Exhibit 1, compared with 20X5, Mill can most appropriately conclude that in 20X6 the:","opts":["LCR increased by 0.83.","amount of high-quality liquid assets declined by AUD 0.38 billion.","bank can better cover its monthly expected cash outflows under normal circumstances."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a055.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a055.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–58 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Mallory Mill is an accredited investor who focuses on investing in financial stocks. Mill is currently reviewing the financial performance of her holdings with her
