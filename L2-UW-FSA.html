s=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex039.webp\" style=\"max-width:min(100%,533px)\" alt=\"Exhibit\"><p>Cardona then explains to Olmedo how to calculate two important measures of defined benefit pension plans: funded status and periodic pension cost. Cardona adds that Jarama is planning to introduce a defined contribution pension plan for new hires. Olmedo asks Cardona about the differences between defined contribution and defined benefit plans, and she lists the following advantages of defined contribution plans:<\/p><p>Advantage 1: The accounting treatment for the employer is much simpler.<\/p><p>Advantage 2: Employees do not bear risks if the invested assets underperform.<\/p><p>Advantage 3: The company recognizes only a small amount of future obligations as a liability.<\/p><p>Olmedo then asks about Tiendas Henares. Cardona presents information about changes to the defined benefit plan&#x27;s obligation and assets and explains the calculation of the fund&#x27;s periodic pension cost based on information from Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex040.webp\" style=\"max-width:min(100%,479px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the advantages of a defined contribution plan over a defined benefit plan is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q113.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":114,"q":"Based only on Exhibit 2, Tiendas Henares's pension plan's periodic pension cost (in EUR millions) during 20X1 is closest to:","opts":["1,190","1,310","1,470"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a114.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a114.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 111–114 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Baltasar Olmedo, a portfolio manager at an asset management firm, is considering stocks of two retail companies: Jarama Stores and Tiendas Henares. Both report under IFRS and have defined benefit pension plans. Olmedo is concerned about the companies&#x27; pension obligations and asks Piedad Cardona, the firm&#x27;s analyst specializing in the retail industry, to provide more details.<\/p><p>Cardona notes that she assumes a discount rate of 6% and expects a return on assets of 7% for Jarama&#x27;s pension plan. She presents additional information about Jarama&#x27;s pension plan, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex039.webp\" style=\"max-width:min(100%,533px)\" alt=\"Exhibit\"><p>Cardona then explains to Olmedo how to calculate two important measures of defined benefit pension plans: funded status and periodic pension cost. Cardona adds that Jarama is planning to introduce a defined contribution pension plan for new hires. Olmedo asks Cardona about the differences between defined contribution and defined benefit plans, and she lists the following advantages of defined contribution plans:<\/p><p>Advantage 1: The accounting treatment for the employer is much simpler.<\/p><p>Advantage 2: Employees do not bear risks if the invested assets underperform.<\/p><p>Advantage 3: The company recognizes only a small amount of future obligations as a liability.<\/p><p>Olmedo then asks about Tiendas Henares. Cardona presents information about changes to the defined benefit plan&#x27;s obligation and assets and explains the calculation of the fund&#x27;s periodic pension cost based on information from Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex040.webp\" style=\"max-width:min(100%,479px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based only on Exhibit 2, Tiendas Henares&#x27;s pension plan&#x27;s periodic pension cost (in EUR millions) during 20X1 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q114.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":115,"q":"All else equal, in the short term, the technological advancement of smartwatches will most likely cause the traditional watch industry to experience:","opts":["only a supply curve shift to the right.","only a demand curve shift to the left","both a supply curve shift to the right and a demand curve shift to the left."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a115.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a115.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 115–120 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Rosa Perez, CFA, is a portfolio manager researching Challenger Watches (Challenger), a manufacturer of midrange watches. The industry has been coming under pressure from the advent of smartwatches. On its latest earnings call, Challenger&#x27;s CEO announced that the company will enter the smartwatch market. Perez believes this move will cannibalize some sales of its traditional watches.<\/p><p>Perez receives the following industry forecast from a third-party research firm. She believes that Challenger&#x27;s traditional watch and smartwatch breakdown matches that of the industry:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex041.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>In January 20X7, after her own analysis, Perez creates a pre-cannibalization forecast for Challenger (Exhibit 2), assuming that no cannibalization has occurred prior to 20X7. However, she believes 80,000 of the company&#x27;s smartwatch sales will cannibalize sales of its traditional watches. She expects forecasted variable costs to rise in line with revenue growth, while fixed costs will grow at 75% of the variable cost growth rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex042.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>Perez wants to know how well Challenger will be able to protect its profits as the industry transitions to smartwatches. She prepares an analysis based on Porter&#x27;s five forces:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex043.webp\" style=\"max-width:min(100%,632px)\" alt=\"Exhibit\"><p>When deciding on a time frame to construct the long-term cash flow model for her fund, Perez considers the following factors:<\/p><p>Factor 1: Challenger is one year into a 3-year restructuring project.<\/p><p>Factor 2: Based on the growth trajectories of past watch technologies, smartwatches are expected to grow at a rapid rate for 4 years, then normalize.<\/p><p>Factor 3: The average annual turnover for the stock portfolio managed by Perez is 16%.<\/p><p>Perez uses a discounted cash flow approach to estimate a terminal value for the model. She identifies three tasks to complete to ensure that the model&#x27;s terminal value is accurate:<\/p><p>Task A: Normalize the terminal cash flow by ensuring it accurately represents an average cash flow during the model period.<\/p><p>Task B: Ensure that the long-term growth rate used matches Challenger&#x27;s historical growth rate.<\/p><p>Task C: Identify the inflection points at which Challenger&#x27;s future will diverge significantly from its recent past.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, in the short term, the technological advancement of smartwatches will most likely cause the traditional watch industry to experience:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q1 lue-at-risk (VaR) measure is used to monitor the long-term effects of market shocks on a portfolio using simulations.<\/p><p>Comment 2: The VaR presented in a bank&#x27;s financial statements is typically used for intracompany trend analysis, not intercompany comparisons.<\/p><p>Stepan discusses the differences between banks and insurance firms, stating that unlike banks, insurance firms do not have an international standard on minimum risk-based capital requirements. Stepan analyzes the capital adequacy of two insurance firms, Firm X and Firm Y, and notes that Firm X factors in interest rate risk when calculating its risk-based capital, whereas Firm Y does not. Stepan then analyzes changes in the loss reserve balance for Firm Y and comments that the firm has been conservative in its historical claims estimates and will most likely have to make revisions for prior years.<\/p><p>Reima asks Stepan to assess the revenue sources and profitability of Firm Y and shares the data shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex047.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>Stepan analyzes the change in the combined ratio across the industry and states that Firm Y&#x27;s peers have experienced a similar trend.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Reima&#x27;s statement, which of the following is least likely a rationale behind the regulatory standards set by Basel III? Banks:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q131.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":132,"q":"Regarding Reima's comments on VaR, which of the following is (are) correct?","opts":["Comment 1 only","Comment 2 only","Both Comments 1 and 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a132.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loadin on plan using either approach would affect the company&#x27;s financial results. Franco replies:<\/p><p>Statement 1: Adding a stock option plan will have no impact on SolarWorks&#x27;s ROE.<\/p><p>Statement 2: All else equal, a higher assumed risk-free rate will increase stock option expense and therefore decrease net income.<\/p><p>Statement 3: Assuming equal market value, outright stock grants will result in greater net income than restricted stock.<\/p><p>SolarWorks extends an employment offer to a new controller, Marley Beezer. Her benefits include participation in the DB plan. The DB plan currently provides for a lump-sum retirement payout that is the product of:<\/p><p>2.0% of the participant&#x27;s final annual salary, and<\/p><p>the number of years the participant was employed by SolarWorks.<\/p><p>Exhibit 1 shows the assumptions relevant to calculating Beezer&#x27;s retirement payment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex048.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit\"><p>SolarWorks is considering an amendment to the plan that would provide annual payments for the greater of 20 years or the employee&#x27;s remaining lifetime.<\/p><\/div><\/details><div class=\"qtext\"><p>If SolarWorks amends its DB plan as described, the company&#x27;s pension obligation to Beezer would increase if there was an increase to which of the following?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q140.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":141,"q":"Based only on Woods' Dec 20X4 wine purchases and sales (in NZD), the transaction gain or loss (in AUD) that Uncorked will report on its quarterly Mar 31, 20X5 income statement is closest to:","opts":["-800","-200","100"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a141.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a141.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 141–146 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Uncorked Distribution is an Australian wine distributor that purchases and sells wine to several countries. Uncorked also has several European subsidiaries, including Verre Distribution, a recently established foreign subsidiary based in France. Shane Wood, the director of supply chain at Uncorked, recently made the following transactions on credit:<\/p><p>Purchased NZD 20,000 of wine from a New Zealand winery on Dec 1, 20X4<\/p><p>Sold NZD 10,000 of wine to a New Zealand grocery store chain on Dec 15, 20X4<\/p><p>Both transactions were paid in NZD on Jan 15, 20X5, and were the only purchases and sales in NZD for Dec 20X4. Wood observed the following exchange rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex049.webp\" style=\"max-width:min(100%,427px)\" alt=\"Exhibit\"><p>Grant Lewis, Uncorked&#x27;s head of accounting, notes that under both GAAP and IFRS, Uncorked must report its foreign currency transaction gains and losses on the income statement, but it can choose how to report them.<\/p><p>Katherine Bennett, CFO of Uncorked, is reviewing the company&#x27;s financial statements with Lewis. Bennett notes that Uncorked&#x27;s effective income tax rate has been below the statutory tax rate for the last few years and wants to know how the profits from foreign subsidiaries are contributing. Lewis presents the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex050.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Bennett also asks Lewis to review the financials for Verre. Verre was established on Jan 1, 20X4 and purchased all of its PPE on that date. Verre locally reports its financial statements in EUR; its most recent balance sheet is shown in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex051.webp\" style=\"max-width:min(100%,542px)\" alt=\"Exhibit\"><p>Verre currently uses AUD as its functional currency since it makes most of its purchases from Uncorked. Lewis believes that EUR would be a more appropriate functional currency since most of Verre&#x27;s customers are based in Europe and pay in EUR. Lewis also compiles the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex052.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based only on Woods&#x27; Dec 20X4 wine purchases and sales (in NZD), the transaction gain or loss (in AUD) that Uncorked will report on its quarterly Mar 31, 20X5 income statement is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q141.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":142,"q":"Uncorked's choice in reporting currency transaction adjustments resulting from its foreign transactions would affect which of the following ratios?","opts":["Net profit margin","Gross profit margin","Operating profit margin"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a142.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a142.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 141–146 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Uncorked Distribution is an Australian wine distributor that purchases and sells wine to several countries. Uncorked also has several European subsidiaries, including Verre Distribution, a recently established foreign subsidiary based in France. Shane Wood, the director of supply chain at Uncorked, recently ed. Lewis believes that EUR would be a more appropriate functional currency since most of Verre&#x27;s customers are based in Europe and pay in EUR. Lewis also compiles the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex052.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 3 and 4, if Uncorked uses the temporal method to translate Verre&#x27;s financial statements to AUD, its total assets (in AUD) would be closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q145.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":146,"q":"Based on Exhibits 3 and 4 and using the current method, if the EUR strengthens against the AUD, Uncorked would most appropriately report:","opts":["a negative translation adjustment.","no translation adjustment.","a positive translation adjustment."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a146.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a146.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 141–146 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Uncorked Distribution is an Australian wine distributor that purchases and sells wine to several countries. Uncorked also has several European subsidiaries, including Verre Distribution, a recently established foreign subsidiary based in France. Shane Wood, the director of supply chain at Uncorked, recently made the following transactions on credit:<\/p><p>Purchased NZD 20,000 of wine from a New Zealand winery on Dec 1, 20X4<\/p><p>Sold NZD 10,000 of wine to a New Zealand grocery store chain on Dec 15, 20X4<\/p><p>Both transactions were paid in NZD on Jan 15, 20X5, and were the only purchases and sales in NZD for Dec 20X4. Wood observed the following exchange rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex049.webp\" style=\"max-width:min(100%,427px)\" alt=\"Exhibit\"><p>Grant Lewis, Uncorked&#x27;s head of accounting, notes that under both GAAP and IFRS, Uncorked must report its foreign currency transaction gains and losses on the income statement, but it can choose how to report them.<\/p><p>Katherine Bennett, CFO of Uncorked, is reviewing the company&#x27;s financial statements with Lewis. Bennett notes that Uncorked&#x27;s effective income tax rate has been below the statutory tax rate for the last few years and wants to know how the profits from foreign subsidiaries are contributing. Lewis presents the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex050.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Bennett also asks Lewis to review the financials for Verre. Verre was established on Jan 1, 20X4 and purchased all of its PPE on that date. Verre locally reports its financial statements in EUR; its most recent balance sheet is shown in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex051.webp\" style=\"max-width:min(100%,542px)\" alt=\"Exhibit\"><p>Verre currently uses AUD as its functional currency since it makes most of its purchases from Uncorked. Lewis believes that EUR would be a more appropriate functional currency since most of Verre&#x27;s customers are based in Europe and pay in EUR. Lewis also compiles the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex052.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 3 and 4 and using the current method, if the EUR strengthens against the AUD, Uncorked would most appropriately report:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q146.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":147,"q":"Which of Ortiz's conclusions, based on her regression model, indicates that Legacy has low- quality earnings?","opts":["Conclusion 1","Conclusion 2","Neither Conclusion 1 nor Conclusion 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a147.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a147.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 147–152 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Ethan Reed is a portfolio manager at an asset management company. He directs Kayla Ortiz, a senior analyst covering the chemical industry, to analyze three companies reporting under US GAAP: Legacy Chem, Bayside Industries, and Atria Plastics.<\/p><p>Ortiz builds a regression model to assess Legacy&#x27;s earnings persistence. In this model, earnings are split into two components (cash flow and accruals), which are used to predict the next period&#x27;s earnings. After validating the model and reviewing Legacy&#x27;s financial statements, Ortiz reaches the following conclusions:<\/p><p>Conclusion 1: The cash component is larger than the accruals component.<\/p><p>Conclusion 2: A significant portion of the accruals component consists of discretionary accruals.<\/p><p>Reed asks Ortiz if she found any indication of manipulation in Legacy&#x27;s cash flow. Ortiz replies:<\/p><p>Statement 1: In the last few years, Legacy&#x27;s accounts receivable increased as a percentage of sales, while accounts payable decreased substantially.<\/p><p>Statement 2: In the previous year, Legacy acquired patents and capitalized their costs, which will be amortized over ten years.<\/p><p>Reed then asks about Bayside Industries, and Ortiz presents the selected financial information shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex053.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><p>Ortiz explains that she will compare Bayside&#x27;s operating cash flow with other profit and loss (P&amp;L) items to investigate potential reporting problems, and then she will apply the Beneish model. Reed requests more details about this model, and Ortiz tells him that:<\/p><p>The model is a quantitative tool that estimates the probability of earnings manipulation.<\/p><p>Financial statement items (eg, sales) are the variables used to calculate an M-score.<\/p><p>The higher the value of the M-score, the higher the probability of misreporting.<\/p><p>Reed tells Ortiz that Bayside is acquiring Atria Plastics, a smaller competitor in the chemical industry. The combination will be accounted for using the acquisition method and will be reported on a consolidated basis. Reed is concerned that Bayside&#x27;s management could take advantage of the acquisition to overstate earnings and asks Ortiz to investigate the impact of the transaction when Bayside releases its financial reports after consolidating with Atria.<\/p><p>Reed also requests Atria&#x27;s financial information, and Ortiz presents Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex054.webp\" style=\"max-width:min(100%,500px)\" alt=\"Exhibit\"><p>Reed wants to forecast Atria&#x27;s earnings in the next years but notices the pretax earnings in 20X8 appear to be influenced by nonrecurring items. He asks Ortiz to calculate the core pretax earnings in 20X8, excluding all one-time events.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Ortiz&#x27;s conclusions, based on her regression model, indicates that Legacy has low- quality earnings?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q147.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"f "lazy\" src=\"l2img/uw-fsa/ex053.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><p>Ortiz explains that she will compare Bayside&#x27;s operating cash flow with other profit and loss (P&amp;L) items to investigate potential reporting problems, and then she will apply the Beneish model. Reed requests more details about this model, and Ortiz tells him that:<\/p><p>The model is a quantitative tool that estimates the probability of earnings manipulation.<\/p><p>Financial statement items (eg, sales) are the variables used to calculate an M-score.<\/p><p>The higher the value of the M-score, the higher the probability of misreporting.<\/p><p>Reed tells Ortiz that Bayside is acquiring Atria Plastics, a smaller competitor in the chemical industry. The combination will be accounted for using the acquisition method and will be reported on a consolidated basis. Reed is concerned that Bayside&#x27;s management could take advantage of the acquisition to overstate earnings and asks Ortiz to investigate the impact of the transaction when Bayside releases its financial reports after consolidating with Atria.<\/p><p>Reed also requests Atria&#x27;s financial information, and Ortiz presents Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex054.webp\" style=\"max-width:min(100%,500px)\" alt=\"Exhibit\"><p>Reed wants to forecast Atria&#x27;s earnings in the next years but notices the pretax earnings in 20X8 appear to be influenced by nonrecurring items. He asks Ortiz to calculate the core pretax earnings in 20X8, excluding all one-time events.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and Reed&#x27;s request, Atria&#x27;s recurring or core pretax earnings (in USD million) in 20X8 are closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q152.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":153,"q":"Based on Exhibits 1 and 2 and according to the Basel III regulatory capital requirements, Zervos Bank is undercapitalized given its:","opts":["total capital ratio.","total Tier 1 capital ratio.","common equity Tier 1 capital ratio."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a153.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a153.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 153–158 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Bob Smith is an equity analyst who covers the banking sector at Excel Partners, a sell-side research firm. Smith is considering adding Zervos Bank to his coverage universe and is in the process of making a preliminary assessment.<\/p><p>Smith first looks at Zervos&#x27; capital adequacy, which is detailed in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex055.webp\" style=\"max-width:min(100%,510px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex056.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>While examining the bank&#x27;s balance sheet, Smith notices an asset line item for nontrading reverse repurchase agreements (ie, reverse repos). Smith is also aware that the bank is a very active participant in the 30-day reverse repo market.<\/p><p>Smith then reviews selected data from Zervos Bank&#x27;s corporate loan portfolio and asks fellow analyst Amita Suri for her observations.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex057.webp\" style=\"max-width:min(100%,487px)\" alt=\"Exhibit\"><p>Observation 1:The bank increased its general reserve against bad debts in 20X5.<\/p><p>Observation 2:Overall, credit quality of the loan portfolio improved in 20X5.<\/p><p>Observation 3:Fewer loan losses are expected in the future.<\/p><p>Suri continues by stating that a more complete credit analysis should also include an evaluation of the allowance for loan losses, the provision for loan losses, and net charge-offs.<\/p><p>Suri also suggests that Smith look at Zervos&#x27; off-balance-sheet exposure to better understand the bank&#x27;s market risk. Smith reviews Zervos&#x27; credit and interest rate derivative exposure and notes that freestanding derivatives increased substantially year over year in 20X5, while hedged derivative exposure decreased.<\/p><p>Finally, Suri says a market risk analysis would not be complete without evaluating Zervos&#x27; value at risk (VaR), and she provides Smith with the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex058.webp\" style=\"max-width:min(100%,594px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2 and according to the Basel III regulatory capital requirements, Zervos Bank is undercapitalized given its:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q153.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":154,"q":"Regarding the reverse repo line item on the bank's balance sheet, which of the following is (are) positively affected by the reverse repo position?","opts":["Only the liquidity coverage ratio","Only the net stable funding ratio","Both the net stable funding ratio and the liquidity coverage ratio"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a154.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a154.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 153–158 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bob Smith is an equity analyst who covers the banking sector at Excel Partners, a sell-side research firm. Smith is considering adding Zervos Bank to his coverage universe and is in the process of making a preliminary assessment.<\/p><p>Smith first looks at Zervos&#x27; capital adequacy, which is detailed in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex055.webp\" style=\"max-width:min(100%,510px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex056.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>While examining the bank&#x27;s balance sheet, Smith notices an asset line item for nontrading reverse repurchase agreements (ie, reverse repos). Smith is also aware that the bank is a very active participant in the 30-day reverse repo market.<\/p><p>Smith then reviews selected data from Zervos Bank&#x27;s corporate loan portfolio and asks fellow analyst Amita Suri for her observations.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex057.webp\" style=\"max-width:min(100%,487px)\" alt=\"Exhibit\"><p>Observation 1:The bank increased its general reserve against bad debts in 20X5.<\/p><p>Observation 2:Overall, credit quality of the loan portfolio improved in 20X5.<\/p><p>Observation 3:Fewer loan losses are expected in the future.<\/p><p>Suri continues by stating that a more complete credit analysis should also include an evaluation of the allowance for loan losses, the provision for loan losses, and net charge-offs.<\/p><p>Suri also suggests that Smith look at Zervos&#x27; off-balance-sheet exposure to better understand the bank&#x27;s market risk. Smith reviews Zervos&#x27; credit and interest rate derivative exposure and notes that freestanding derivatives increased substantially year over year in 20X5, while hedged derivative exposure decreased.<\/p><p>Finally, Suri says a market risk analysis would not be complete without evaluating Zervos&#x27; value at risk (VaR), and she provides Smith with the following information:<\/p><img class=\"pimg\ const CFG = {"title": "UWorld — Financial Statement Analysis", "subtitle": "CFA Level II · 158 câu · UWorld item sets", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");

    const card = $("q-"+i);

  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }

}

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

    background:var(--accent2,#0ea5e9);color:#fff;border:none;border-radius:999px;padding:11px 17px;font:600 14px inherit;
    cursor:pointer;box-shadow:0 8px 24px rgba(2,6,23,.35)}
  #baiiFab:hover{filter:brightness(1.06)}
  #baiiFab svg{width:17px;height:17px;flex:none}
  #baiiPanel{position:fixed;top:8vh;right:16px;width:min(410px,94vw);height:min(80vh,680px);z-index:72;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;
    overflow:hidden;opacity:0;pointer-events:none;transform:translateY(10px);
    transition:opacity .18s,transform .18s;box-shadow:0 18px 54px rgba(2,6,23,.5)}
  #baiiPanel.open{opacity:1;pointer-events:auto;transform:none}
  #baiiPanel .bp-head{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);
    flex:none;cursor:move;touch-action:none;user-select:none}
  #baiiPanel .bp-grip{color:var(--muted);font-size:15px;line-height:1;letter-spacing:-2px;flex:none}
  #baiiPanel .bp-head b{flex:1;font-size:14px;color:var(--txt)}
  #baiiPanel .bp-open{font-size:12.5px;font-weight:600;color:var(--accent2);text-decoration:none;white-space:nowrap}
  #baiiPanel .bp-open:hover{text-decoration:underline}
  #baiiPanel .bp-x{border:none;background:transparent;color:var(--muted);font-size:19px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:8px}
  #baiiPanel .bp-x:hover{color:var(--txt)}
  #baiiPanel.dragging{transition:none;box-shadow:0 26px 70px rgba(2,6,23,.62)}
  #baiiPanel.dragging #baiiFrame{pointer-events:none}
  #baiiFrame{flex:1;width:100%;border:0;background:#0f1a1d}
  #baiiOverlay{position:fixed;inset:0;background:transparent;z-index:67;display:none;pointer-events:none}

  @media(max-width:600px){#baiiFab span{display:none}#baiiFab{padding:12px;bottom:74px}}
</style>
<button id="baiiFab" type="button" onclick="baiiOpen()" title="Máy tính BA II Plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="19"/><line x1="8" y1="19" x2="12" y2="19"/></svg><span>Máy tính</span></button>
<div id="baiiOverlay" onclick="baiiClose()"></div>
<div id="baiiPanel" aria-hidden="true">
  <div class="bp-head" id="baiiHead"><span class="bp-grip" aria-hidden="true">⠿</span><b>Máy tính BA II Plus</b><a class="bp-open" href="baii-plus.html" target="_blank" rel="noopener">Mở trang ↗</a><button type="button" class="bp-x" onclick="baiiClose()" title="Đóng (Esc)">✕</button></div>
  <iframe id="baiiFrame" title="BA II Plus" loading="lazy"></iframe>
</div>
<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
