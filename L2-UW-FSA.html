enario, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex018.webp\" style=\"max-width:min(100%,475px)\" alt=\"Exhibit\"><p>Skinner mentions that, in addition to the liquidity coverage ratio (LCR), the net stable funds ratio (NSFR) is also a metric for analyzing liquidity. Treehouse&#x27;s NSFR ratio is low compared with the industry. Mill asks about changes in balance sheet items that can increase the NSFR.<\/p><p>They turn their attention to Springfeel Group, a property and casualty (P&amp;C) insurance company. Mill understands that managing loss reserves is critical to running a P&amp;C business and gathers the loss reserve information shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex019.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>Finally, they assess Shelbyhill Group, a life and health insurance company. Mill and Skinner analyze the sources of revenue information shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex020.webp\" style=\"max-width:min(100%,607px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, which of the following is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q058.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":59,"q":"When evaluating the quality of the financial reports, Richter should most appropriately assess Nordstern's:","opts":["accounting policies compared with its competitors.","notes containing disclosures about risks related to its operations.","exposure to potential regulatory changes in the automotive industry."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a059.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a059.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 59–64 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Ada Richter, an equity analyst for a European brokerage firm, is currently researching three companies in the automotive industry: Nordstern Auto, Horizont Industries, and Ausdauer Motors.<\/p><p>Initially, Richter applies a sequence of steps to evaluate the quality of Nordstern&#x27;s financial reports. After analyzing the company&#x27;s financial statements, she concludes that Nordstern complies with IFRS and provides decision-useful information. She determines with confidence that return on investment was consistently above the cost of capital during the previous five years. Richter believes that Nordstern&#x27;s current challenge is to find new sources of revenue since a substantial part of its earnings comes from a special project that is expected to end in the following year.<\/p><p>Richter receives a call from Gertrude Scholz, her supervisor, who asks if she has finished her analysis of Horizont Industries and Ausdauer Motors. Richter informs Scholz that she has reached the following conclusions about Horizont:<\/p><p>Conclusion 1: Horizont issues invoices to its clients and recognizes revenues for goods that remain on the company&#x27;s premises until a later date. These sales arrangements are unusual but allowed under specific conditions.<\/p><p>Conclusion 2: Horizont&#x27;s allowance for doubtful accounts, as a percentage of accounts receivable, is significantly lower than the allowance estimated by its main competitors.<\/p><p>Richter then presents to Scholz a table with information about Ausdauer&#x27;s revenues and accounts receivable for the last three years (Exhibit 1):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex021.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit\"><p>Richter also advises Scholz that, according to Note 6 of Ausdauer&#x27;s 20X5 financial statements:<\/p><p>In 20X5, the Company entered into an agreement to sell certain trade receivables to a third-party financial institution. On December 30, 20X5, the Company received €15.0 million from the sale of trade accounts receivables. These proceeds are included in cash from operating activities, and those receivables were not included in 20X5 balance sheet.<\/p><p>Scholz wants to better understand Ausdauer&#x27;s earnings quality and asks Richter to build a pro forma table excluding this transaction.<\/p><\/div><\/details><div class=\"qtext\"><p>When evaluating the quality of the financial reports, Richter should most appropriately assess Nordstern&#x27;s:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q059.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":60,"q":"Based on Richter's assessment, Nordstern most likely presents high-quality:","opts":["earnings.","financial reporting.","earnings and financial reporting."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a060.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a060.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 59–64 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ada Richter, an equity analyst for a European brokerage firm, is currently researching three companies in the automotive industry: Nordstern Auto, Horizont Industries, and Ausdauer Motors.<\/p><p>Initially, Richter applies a sequence of steps to evaluate the quality of Nordstern&#x27;s financial reports. After analyzing the company&#x27;s financial statements, she concludes that Nordstern complies with IFRS and provides decision-useful information. She determines with confidence that return on investment was consistently above the cost of capital during the previous five years. Richter believes that Nordstern&#x27;s current challenge is to find new sources of revenue since a substantial part of its earnings comes from a special project that is expected to end in the following year.<\/p><p>Richter receives a call from Gertrude Scholz, her supervisor, who asks if she has finished her analysis of Horizont Industries and Ausdauer Motors. Richter informs Scholz that she has reached the following conclusions about Horizont:<\/p><p>Conclusion 1: Horizont issues invoices to its clients and recognizes revenues for goods that remain on the company&#x27;s premises until a later date. These sales arrangements are unusual but allowed under specific conditions.<\/p><p>Conclusion 2: Horizont&#x27;s allowance for doubtful accounts, as a percentage of accounts receivable, is significantly lower than the allowance estimated by its main competitors.<\/p><p>Richter then presents to Scholz a table with information about Ausdauer&#x27;s revenues and accounts receivable for the last three years (Exhibit 1):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex021.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit\"><p>Richter also advises Scholz that, according to Note 6 of Ausdauer&#x27;s 20X5 financial statements:<\/p><p>In 20X5, the Company entered into an agreement to sell certain trade receivables to a third-party financial institution. On December 30, 20X5, the Company received €15.0 million from the sale of trade accounts receivables. These proceeds are included in cash from operating activities, and those receivables were not included in 20X5 balance sheet.<\/p><p>Scholz wants to better understand Ausdauer&#x27;s earnings quality and asks Richter to build a pro forma table excluding this transaction.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Richter&#x27;s assessment, Nordstern most likely presents high-quality:<\/p><\/div><details class=\"qorig\"><summary>Xe ents are unusual but allowed under specific conditions.<\/p><p>Conclusion 2: Horizont&#x27;s allowance for doubtful accounts, as a percentage of accounts receivable, is significantly lower than the allowance estimated by its main competitors.<\/p><p>Richter then presents to Scholz a table with information about Ausdauer&#x27;s revenues and accounts receivable for the last three years (Exhibit 1):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex021.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit\"><p>Richter also advises Scholz that, according to Note 6 of Ausdauer&#x27;s 20X5 financial statements:<\/p><p>In 20X5, the Company entered into an agreement to sell certain trade receivables to a third-party financial institution. On December 30, 20X5, the Company received €15.0 million from the sale of trade accounts receivables. These proceeds are included in cash from operating activities, and those receivables were not included in 20X5 balance sheet.<\/p><p>Scholz wants to better understand Ausdauer&#x27;s earnings quality and asks Richter to build a pro forma table excluding this transaction.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Conclusion 1, the practice adopted by Horizont is best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q061.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":62,"q":"Based on Conclusion 2, an understatement of Horizont's allowance for doubtful accounts would most likely decrease the company's:","opts":["current ratio.","current liabilities.","asset turnover ratio."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a062.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a062.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Cas ollowing conclusions about Horizont:<\/p><p>Conclusion 1: Horizont issues invoices to its clients and recognizes revenues for goods that remain on the company&#x27;s premises until a later date. These sales arrangements are unusual but allowed under specific conditions.<\/p><p>Conclusion 2: Horizont&#x27;s allowance for doubtful accounts, as a percentage of accounts receivable, is significantly lower than the allowance estimated by its main competitors.<\/p><p>Richter then presents to Scholz a table with information about Ausdauer&#x27;s revenues and accounts receivable for the last three years (Exhibit 1):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex021.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit\"><p>Richter also advises Scholz that, according to Note 6 of Ausdauer&#x27;s 20X5 financial statements:<\/p><p>In 20X5, the Company entered into an agreement to sell certain trade receivables to a third-party financial institution. On December 30, 20X5, the Company received €15.0 million from the sale of trade accounts receivables. These proceeds are included in cash from operating activities, and those receivables were not included in 20X5 balance sheet.<\/p><p>Scholz wants to better understand Ausdauer&#x27;s earnings quality and asks Richter to build a pro forma table excluding this transaction.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Note 6, if the accounts receivable had not been sold, Ausdauer&#x27;s days sales outstanding at the end of 20X5 (assuming end of period accounts receivable) would have been closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q064.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":65,"q":"Which of the following best describes a feature of LBG's defined contribution plan?","opts":["Contributions and payments are usually made through a pension trust.","The employer is not responsible for the investment risk of the plan assets.","An increase in compensation levels will increase the future plan obligation."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a065.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a065.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 65–70 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Lang &amp; Bauer Group (LBG) is a German company that reports using IFRS. LBG has two retirement benefit plans: a defined contribution plan, open to all employees, and a defined benefit plan, closed to new participants.<\/p><p>LBG&#x27;s chief executive officer, Emma Schuster, asks the chief financial officer, Jan Berger, to outline the current situation of the company&#x27;s retirement benefit plans. Berger explains that the plans have distinct features, and although the accounting treatment of the defined contribution plan is relatively simple, the defined benefit plan requires a more detailed analysis. Berger presents the following information from the defined benefit plan:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex022.webp\" style=\"max-width:min(100%,446px)\" alt=\"Exhibit\"><p>Berger warns Schuster that this information relies on some key assumptions, and that changes in these assumptions would have material effects on the estimates of benefit obligations and periodic pension costs. Berger lists the discount rate, the annual compensation growth, and life expectancy as some of these key assumptions.<\/p><p>Schuster asks Berger to prepare a comparison with defined benefit plans of LBG&#x27;s peers in Europe and in the United States. Berger explains that, since US companies comply with US GAAP, there are several differences in the way that pension costs are recognized in the profit and loss (P&amp;L) and other comprehensive income (OCI) statements. Schuster asks Berger to provide examples of how the accounting treatment under US GAAP differs from the treatment under IFRS. Berger states that under US GAAP:<\/p><p>Example 1: Actuarial losses (gains) recognized in OCI are not subsequently amortized to P&amp;L.<\/p><p>Example 2: The effects of plan amendments on obligations for prior services are recognized in P&amp;L.<\/p><p>Example 3: Differences between actual and expected return on assets result in an actuarial loss or gain.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes a feature of LBG&#x27;s defined contribution plan?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q065.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":66,"q":"Based on Exhibit 1, the defined benefit pension obligation (in EUR millions) at the end of the year is closest to:","opts":["13,950","14,150","15,950"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a066.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a066.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 65–70 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lang &amp; Bauer Group (LBG) is a German company that reports using IFRS. LBG has two retirement benefit plans: a defined contribution plan, open to all employees, and a defined benefit plan, closed to new participants.<\/p><p>LBG&#x27;s chief executive officer, Emma Schuster, asks the chief financial officer, Jan Berger, to outline the current situation of the company&#x27;s retirement benefit plans. Berger explains that the plans have distinct features, and although the accounting treatment of Schuster asks Berger to provide examples of how the accounting treatment under US GAAP differs from the treatment under IFRS. Berger states that under US GAAP:<\/p><p>Example 1: Actuarial losses (gains) recognized in OCI are not subsequently amortized to P&amp;L.<\/p><p>Example 2: The effects of plan amendments on obligations for prior services are recognized in P&amp;L.<\/p><p>Example 3: Differences between actual and expected return on assets result in an actuarial loss or gain.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on only the information provided, the actuarial loss of EUR 200 million most likely resulted from which single change in plan assumptions?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q069.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":70,"q":"Which of Berger's examples of differences in pension costs' recognition under US GAAP and IFRS is correct?","opts":["Example 1","Example 2","Example 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a070.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a070.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 65–70 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lang &amp; Bauer Group (LBG) is a German company that reports using IFRS. LBG has two retirement benefit plans: a defined contribution plan, open to all employees, and a defined benefit plan, closed to new participants.<\/p><p>LBG&#x27;s chief executive officer, Emma Schuster, asks the chief financial officer, Jan Berger, to outline the current situation of the company&#x27;s retirement benefit plans. Berger explains that the plans have distinct features, and although the accounting treatment of the defined contribution plan is relatively simple, the defined benefit plan requires a more detailed analysis. Berger presents the following information from the defined benefit plan:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex022.webp\" style=\"max-width:min(100%,446px)\" alt=\"Exhibit\"><p>Berger warns Schuster that this information relies on some key assumptions, and that changes in these assumptions would have material effects on the estimates of benefit obligations and periodic pension costs. Berger lists the discount rate, the annual compensation growth, and life expectancy as some of these key assumptions.<\/p><p>Schuster asks Berger to prepare a comparison with defined benefit plans of LBG&#x27;s peers in Europe and in the United States. Berger explains that, since US companies comply with US GAAP, there are several differences in the way that pension costs are recognized in the profit and loss (P&amp;L) and other comprehensive income (OCI) statements. Schuster asks Berger to provide examples of how the accounting treatment under US GAAP differs from the treatment under IFRS. Berger states that under US GAAP:<\/p><p>Example 1: Actuarial losses (gains) recognized in OCI are not subsequently amortized to P&amp;L.<\/p><p>Example 2: The effects of plan amendments on obligations for prior services are recognized in P&amp;L.<\/p><p>Example 3: Differences between actual and expected return on assets result in an actuarial loss or gain.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Berger&#x27;s examples of differences in pension costs&#x27; recognition under US GAAP and IFRS is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q070.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":71,"q":"Based on Exhibit 1, at the time the stake in Spire was purchased by Element in 20X3, the amount (in € millions) that Element would have allocated to goodwill from the purchase is closest to:","opts":["6","15","26"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a071.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a071.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 71–76 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Element Pharmaceuticals is a European-based biotech company. Management is analyzing its position in 20X9. At the end of 20X3, Element purchased a 40% stake in Spire Pharmaceuticals for €70 million. Element was deemed to have significant influence over Spire but not control. Exhibit 1 shows Spire&#x27;s balance sheet at the time of purchase:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex023.webp\" style=\"max-width:min(100%,488px)\" alt=\"Exhibit\"><p>Spire depreciates its laboratory equipment over 10 years and its office buildings over 20 years, using the straight-line method and assuming no salvage value.<\/p><p>Exhibit 2 shows Spire&#x27;s net income and dividends paid over the next five years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex024.webp\" style=\"max-width:min(100%,437px)\" alt=\"Exhibit\"><p>There were no related-party transactions between Element and Spire until 20X7. Then the following transactions occurred:<\/p><p>In 20X7, Spire sold goods with a carrying value of €3 million to Element and realized a €1 million profit on this transaction. Element sold these goods at cost in 20X9. In 20X8, Element sold goods with a carrying value of €6.5 million to Spire for €10 million. Spire sold €3 million of these goods in 20X8 and sold the remainder in 20X9.<\/p><p>Transcontinental, a US-based biotech company, is in talks with Element and Accord Bank, hoping they will provide Transcontinental with short-term capital. Transcontinental is considering two scenarios:<\/p><p><b>Scenario 1:<\/b> Transcontinental will create a variable interest entity (VIE). Element will invest $30 million in return for equity in the VIE. The VIE will then borrow $170 million from Accord Bank and purchase $200 million of Transcontinental&#x27;s accounts receivable. Element will receive the majority of the VIE&#x27;s residual returns; Transcontinental will absorb the majority of any losses.<\/p><p>Scenario 2: Transcontinental will borrow $200 million from Accord Bank, with the accounts receivable used as collateral.<\/p><p>Exhibit 3 shows items from Transcontinental&#x27;s balance sheet:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex025.webp\" style=\"max-width:min(100%,516px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, at the time the stake in Spire was purchased by Element in 20X3, the amount (in € millions) that Element would have allocated to goodwill from the purchase is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q071.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":72,"q":"Based on Exhibit 2, the carrying value of Spire at the end of 20X6 (in € millions) is closest to:","opts":["81.2","86.6","90.2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a072.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a072.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 71–76 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Element Pharmaceuticals is a European-based biotech company. Management is analyzing its position in 20X9. At the end of 20X3, Element purchased a 40% stake in Spire Pharmaceuticals for €70 million. E  in 20X9. At the end of 20X3, Element purchased a 40% stake in Spire Pharmaceuticals for €70 million. Element was deemed to have significant influence over Spire but not control. Exhibit 1 shows Spire&#x27;s balance sheet at the time of purchase:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex023.webp\" style=\"max-width:min(100%,488px)\" alt=\"Exhibit\"><p>Spire depreciates its laboratory equipment over 10 years and its office buildings over 20 years, using the straight-line method and assuming no salvage value.<\/p><p>Exhibit 2 shows Spire&#x27;s net income and dividends paid over the next five years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex024.webp\" style=\"max-width:min(100%,437px)\" alt=\"Exhibit\"><p>There were no related-party transactions between Element and Spire until 20X7. Then the following transactions occurred:<\/p><p>In 20X7, Spire sold goods with a carrying value of €3 million to Element and realized a €1 million profit on this transaction. Element sold these goods at cost in 20X9. In 20X8, Element sold goods with a carrying value of €6.5 million to Spire for €10 million. Spire sold €3 million of these goods in 20X8 and sold the remainder in 20X9.<\/p><p>Transcontinental, a US-based biotech company, is in talks with Element and Accord Bank, hoping they will provide Transcontinental with short-term capital. Transcontinental is considering two scenarios:<\/p><p><b>Scenario 1:<\/b> Transcontinental will create a variable interest entity (VIE). Element will invest $30 million in return for equity in the VIE. The VIE will then borrow $170 million from Accord Bank and purchase $200 million of Transcontinental&#x27;s accounts receivable. Element will receive the majority of the VIE&#x27;s residual returns; Transcontinental will absorb the majority of any losses.<\/p><p>Scenario 2: Transcontinental will borrow $200 million from Accord Bank, with the accounts receivable used as collateral.<\/p><p>Exhibit 3 shows items from Transcontinental&#x27;s balance sheet:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex025.webp\" style=\"max-width:min(100%,516px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>If Transcontinental creates the VIE, which entity should most appropriately consolidate it as a subsidiary?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q075.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":76,"q":"Based on Exhibit 3, which method of monetizing accounts receivable would create a greater value of accounts receivable on Transcontinental's balance sheet?","opts":["Scenario 1","Scenario 2","They result in the same value"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a076.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a076.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 71–76 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Element Pharmaceuticals is a European-based biotech company. Management is analyzing its position in 20X9. At the end of 20X3, Element purchased a 40% stake in Spire Pharmaceuticals for €70 million. Element was deemed to have significant influence over Spire but not control. Exhibit 1 shows Spire&#x27;s balance sheet at the time of purchase:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex023.webp\" style=\"max-width:min(100%,488px)\" alt=\"Exhibit\"><p>Spire depreciates its laboratory equipment over 10 years and its office buildings over 20 years, using the straight-line method and assuming no salvage value.<\/p><p>Exhibit 2 shows Spire&#x27;s net income and dividends paid over the next five years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex024.webp\" style=\"max-width:min(100%,437px)\" alt=\"Exhibit\"><p>There were no related-party transactions between Element and Spire until 20X7. Then the following transactions occurred:<\/p><p>In 20X7, Spire sold goods with a carrying value of €3 million to Element and realized a €1 million profit on this transaction. Element sold these goods at cost in 20X9. In 20X8, Element sold goods with a carrying value of €6.5 million to Spire for €10 million. Spire sold €3 million of these goods in 20X8 and sold the remainder in 20X9.<\/p><p>Transcontinental, a US-based biotech company, is in talks with Element and Accord Bank, hoping they will provide Transcontinental with short-term capital. Transcontinental is considering two scenarios:<\/p><p><b>Scenario 1:<\/b> Transcontinental will create a variable interest entity (VIE). Element will invest $30 million in return for equity in the VIE. The VIE will then borrow $170 million from Accord Bank and purchase $200 million of Transcontinental&#x27;s accounts receivable. Element will receive the majority of the VIE&#x27;s residual returns; Transcontinental will absorb the majority of any losses.<\/p><p>Scenario 2: Transcontinental will borrow $200 million from Accord Bank, with the accounts receivable used as collateral.<\/p><p>Exhibit 3 shows items from Transcontinental&#x27;s balance sheet:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex025.webp\" style=\"max-width:min(100%,516px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, which method of monetizing accounts receivable would create a greater value of accounts receivable on Transcontinental&#x27;s balance sheet?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q076.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":77,"q":"Which statement regarding the Basel III requirements is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a077.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a077.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 77–80 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Nishant Nayar is a senior financial sector analyst at an asset research firm. Nayar meets with Grish Gupta, a junior analyst at the firm, to review several banks. Nayar tells Gupta that the Basel Committee establishes the global banking regulatory framework and that the latest guidelines are provided under Basel III. Gupta asks Nayar to further elaborate on Basel III. Nayar responds by stating that Basel III requires banks to:<\/p><p>Statement 1: fund a minimum percentage of their total asset value with equity capital<\/p><p>Statement 2: hold enough highly liquid assets to cover their liquidity needs for 90 days in a stress test scenario<\/p><p>Statement 3: maintain a minimum level of stable funding relative to their liquidity needs over a 1-year horizon<\/p><p>Nayar then asks Gupta to research Samriddhi Bank and report back his findings. Gupta collects information related to capital adequacy, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex026.webp\" style=\"max-width:min(100%,561px)\" alt=\"Exhibit\"><p>Subsequently, Gupta gathers information related to the bank&#x27;s allowance for loan losses, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex027.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Gupta finishes the analysis and presents his findings to Nayar. Nayar asks whether, in addition to analyzing information from the bank&#x27;s financial statements, Gupta has assessed any off-balance-sheet considerations. Gupta confirms that he has done so and reports the following observations regarding off-balance-sheet activity:<\/p><p>Observation 1:The bank has experienced a significant decline in assets under management (AUM) year over year.<\/p><p>Observation 2:The bank has started consolidating assets and liabilities from variable interest entities (VIEs) that were previously unconsolidated.<\/p><p>Observation 3:Interest rate increases this year have changed the defined benefit plan&#x27;s funded status.<\/p><\/div><\/details><div class=\"qtext\"><p>Which statement regarding the Basel III requirements is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q077.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":78,"q":"Based on Exhibit 1, the metric that exceeds its Basel III capital adequacy requirement by the most basis points (bps) is the:","opts":["Al minimum total capital ratio.","minimum Tier 1 capital ratio.","minimum Tier 1 common equity ratio."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a078.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a078.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 77–80 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nishant Nayar is a senior financial sector analyst at an asset research firm. Nayar meets with Grish Gupta, a junior analyst at the firm, to review several banks. Nayar tells Gupta that the Basel Committee establishes the global banking regulatory framework and that the latest guidelines are provided under Basel III. Gupta asks Nayar to further elaborate on Basel III. Nayar responds by stating that Basel III requires banks to:<\/p><p>Statement 1: fund a minimum percentage of their total asset value with equity capital<\/p><p>Statement 2: hold enough highly liquid assets to cover their liquidity needs for 90 days in a stress test scenario<\/p><p>Statement 3: maintain a minimum level of stable funding relative to their liquidity needs over a 1-year horizon<\/p><p>Nayar then asks Gupta to research Samriddhi Bank and report back his findings. Gupta collects information related to capital adequacy, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex026.webp\" style=\"max-width:min(100%,561px)\" alt=\"Exhibit\"><p>Subsequently, Gupta gathers information related to the bank&#x27;s allowance for loan losses, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex027.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Gupta finishes the analysis and presents his findings to Nayar. Nayar asks whether, in addition to analyzing information from the bank&#x27;s financial statements, Gupta has assessed any off-balance-sheet considerations. Gupta confirms that he has done so and reports the following observations regarding off-balance-sheet activity:<\/p><p>Observation 1:The bank has experienced a significant decline in assets under management (AUM) year over year.<\/p><p>Observation 2:The bank has started consolidating assets and liabilities from variable interest entities (VIEs) that were previously unconsolidated.<\/p><p>Observation 3:Interest rate increases this year have changed the defined benefit plan&#x27;s funded status.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the metric that exceeds its Basel III capital adequacy requirement by the most basis points (bps) is the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q078.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":79,"q":"Based on Exhibit 2, Gupta's most appropriate conclusion is that the:","opts":["allowances have been growing at a faster rate than nonperforming loans.","correlation between provisions for loan losses and net charge-offs has weakened.","cushion between net loan charge-offs and loan loss allowances has been shrinking."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a079.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a079.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 77–80 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nishant Nayar is a senior financial sector analyst at an asset research firm. Nayar meets with Grish Gupta, a junior analyst at the firm, to review several banks. Nayar tells Gupta that the Basel Committee establishes the global banking regulatory framework and that the latest guidelines are provided under Basel III. Gupta asks Nayar to further elaborate on Basel III. Nayar responds by stating that Basel III requires banks to:<\/p><p>Statement 1: fund a minimum percentage of their total asset value with equity capital<\/p><p>Statement 2: hold enough highly liquid assets to cover their liquidity needs for 90 days in a stress test scenario<\/p><p>Statement 3: maintain a minimum level of stable funding relative to their liquidity needs over a 1-year horizon<\/p><p>Nayar then asks Gupta to research Samriddhi Bank and report back his findings. Gupta collects information related to capital adequacy, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex026.webp\" style=\"max-width:min(100%,561px)\" alt=\"Exhibit\"><p>Subsequently, Gupta gathers information related to the bank&#x27;s allowance for loan losses, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex027.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Gupta finishes the analysis and presents his findings to Nayar. Nayar asks whether, in addition to analyzing information from the bank&#x27;s financial statements, Gupta has assessed any off-balance-sheet considerations. Gupta confirms that he has done so and reports the following observations regarding off-balance-sheet activity:<\/p><p>Observation 1:The bank has experienced a significant decline in assets under management (AUM) year over year.<\/p><p>Observation 2:The bank has started consolidating assets and liabilities from variable interest entities (VIEs) that were previously unconsolidated.<\/p><p>Observation 3:Interest rate increases this year have changed the defined benefit plan&#x27;s funded status.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, Gupta&#x27;s most appropriate conclusion is that the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q079.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":80,"q":"All else equal, which of Gupta's observations indicates an increase in the bank's risk?","opts":["Observation 1","Observation 2","Observation 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a080.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a080.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 77–80 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nishant Nayar is a senior financial sector analyst at an asset research firm. Nayar meets with Grish Gupta, a junior analyst at the firm, to review several banks. Nayar tells Gupta that the Basel Committee establishes the global banking regulatory framework and that the latest guidelines are provided under Basel III. Gupta asks Nayar to further elaborate on Basel III. Nayar responds by stating that Basel III requires banks to:<\/p><p>Statement 1: fund a minimum percentage of their total asset value with equity capital<\/p><p>Statement 2: hold enough highly liquid assets to cover their liquidity needs for 90 days in a stress test scenario<\/p><p>Statement 3: maintain a minimum level of stable funding relative to their liquidity needs over a 1-year horizon<\/p><p>Nayar then asks Gupta to research Samriddhi Bank and report back his findings. Gupta collects information related to capital adequacy, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex026.webp\" style=\"max-width:min(100%,561px)\" alt=\"Exhibit\"><p>Subsequently, Gupta gathers information related to the bank&#x27;s allowance for loan losses, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex027.webp\" style=\"max-width:min(100%,640px)\" alt=\"Exhibit\"><p>Gupta finishes the analysis and presents his findings to Nayar. Nayar asks whether, in addition to analyzing information from the bank&#x27;s financial statements, Gupta has assessed any off-balance-sheet considerations. Gupta confirms that he has done so and reports the following observations regarding off-balance-sheet activity:<\/p><p>Observation 1:The bank has experienced a significant decline in assets under management (AUM) year over year.<\/p><p>Observation 2:The bank has started consolidating assets and liabilities from variable interest entities (VIEs) that were previously unconsolidated.<\/p><p>Observation 3:Interest rate increases this year have changed the defined benefit plan&#x27;s funded status.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, which of Gupta&#x27;s observations indicates an increase in the bank&#x27;s risk?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q080.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":81,"q":"Based on Exhibit 1, to best reflect Sycamore's ongoing operations, Carter should adjust the financial statements by removing:","opts":["only litigation expense.","only restructuring expense.","both litigation and restructuring expense."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a081.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a081.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 81–86 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Felipe Hernandez is a portfolio manager at Eclipsar Financiero. He recently read an article about Sycamore Therapeutics that indicates that the company&#x27;s stock is overvalued based on its elevated risk profile. Hernandez asks Jada Carter, an analyst at Eclipsar, to conduct additional research on the stock.<\/p><p>Carter compiles the following information on Sycamore:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex028.webp\" style=\"max-width:min(100%,601px)\" alt=\"Exhibit\"><p>Hernandez asks Carter to adjust Sycamore&#x27;s financials to best reflect the company&#x27;s ongoing operations. Carter plans to make the following modifications to calculate adjusted income:<\/p><p>Removing unusual items<\/p><p>Removing income from associates<\/p><p>Carter notes that removing financial information related to associates will not only change Sycamore&#x27;s financial profile but also affect its market metrics. Sycamore&#x27;s sole investment in associates is its noncontrolling ownership of 10 million shares of Acceleration Pharmaceuticals. Hernandez asks Carter to compare Sycamore with its peers without the contribution from Acceleration. Sycamore&#x27;s closest peers have an average trailing P/E ratio of 10.4 in 20X4. Carter observes that Sycamore&#x27;s stock price is $24 and Acceleration&#x27;s stock price is $150.<\/p><p>Hernandez is also concerned about Sycamore&#x27;s earnings quality. He asks Carter to:<\/p><p>Review Sycamore&#x27;s accruals, noting that anything more than a 10% increase in a given year or an increasing trend should be a cause of concern. Hernandez asks Carter to remove all unusual items for this exercise.<\/p><p>Measure Sycamore&#x27;s cash generation and measure whether select cash flow ratios are improving or deteriorating<\/p><p>Hernandez reviews all the data and concludes that the article&#x27;s report of Sycamore&#x27;s risk is exaggerated. Carter notes that there is a change in accounting standards planned to force companies to report more liabilities that are currently &quot;off balance sheet.&quot; Carter observes that Sycamore&#x27;s debt and assets would increase by $1 million under the new accounting standards, but nothing else would change.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, to best reflect Sycamore&#x27;s ongoing operations, Carter should adjust the financial statements by removing:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q081.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":82,"q":"Based on Exhibit 1, if Carter removes financial information related to Acceleration, Sycamore's ROA in 20X4 would most likely:","opts":["decrease.","stay the same.","increase."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a082.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a082.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 81–86 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Felipe Hernandez is a portfolio manager at Eclipsar Financiero. He recently read an article about Sycamore Therapeutics that indicates that the company&#x27;s stock is overvalued based on its elevated risk profile. Hernandez asks Jada Carter, an analyst at Eclipsar, to conduct additional research on the stock.<\/p><p>Carter compiles the following information on Sycamore:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex028.webp\" style=\"max-width:min(100%,601px)\" alt=\"Exhibit\"><p>Hernandez asks Carter to adjust Sycamore&#x27;s financials to best reflect the company&#x27;s ongoing operations. Carter plans to make the following modifications to calculate adjusted income:<\/p><p>Removing unusual items<\/p><p>Removing income from associates<\/p><p>Carter notes that removing financial information related to associates will not only change Sycamore&#x27;s financial profile but also affect its market metrics. Sycamore&#x27;s sole investment in associates is its noncontrolling ownership of 10 million shares of Acceleration Pharmaceuticals. Hernandez asks Carter to compare Sycamore with its peers without the contribution from Acceleration. Sycamore&#x27;s closest peers have an average trailing P/E ratio of 10.4 in 20X4. Carter observes that Sycamore&#x27;s stock price is $24 and Acceleration&#x27;s stock price is $150.<\/p><p>Hernandez is also concerned about Sycamore&#x27;s earnings quality. He asks Carter to:<\/p><p>Review Sycamore&#x27;s accruals, noting that anything more than a 10% increase in a given year or an increasing trend should be a cause of concern. Hernandez asks Carter to remove all unusual items for this exercise.<\/p><p>Measure Sycamore&#x27;s cash generation and measure whether select cash flow ratios are improving or deteriorating<\/p><p>Hernandez reviews all the data and concludes that the article&#x27;s report of Sycamore&#x27;s risk is exaggerated. Carter notes that there is a change in accounting standards planned to force companies to report more liabilities that are currently &quot;off balance sheet.&quot; Carter observes that Sycamore&#x27;s debt and assets would increase by $1 million under the new accounting standards, but nothing else would change.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, if Carter removes financial information related to Acceleration, Sycamore&#x27;s ROA in 20X4 would most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q082.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":83,"q":"Based solely on its standalone trailing P/E ratio in 20X4 and Exhibit 1, Sycamore is most appropriately considered:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a083.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a083.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 81–86 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Felipe Hernandez is a portfolio manager at Eclipsar Financiero. He recently read an article about Sycamore Therapeutics that indicates that the company&#x27;s stock is overvalued based on its elevated risk profile. Hernandez asks Jada Carter, an analyst at Eclipsar, to conduct additional research on the stock.<\/p><p>Carter compiles the following information on Sycamore:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex028.webp\" style=\"max-width:min(100%,601px)\" alt=\"Exhibit\"><p>Hernandez asks Carter to adjust Sycamore&#x27;s financials to best reflect the company&#x27;s ongoing operations. Carter plans to make the following modifications to calculate adjusted income:<\/p><p>Removing unusual items<\/p><p>Removing income from associates<\/p><p>Carter notes that removing financial information related to associates n Pharmaceuticals. Hernandez asks Carter to compare Sycamore with its peers without the contribution from Acceleration. Sycamore&#x27;s closest peers have an average trailing P/E ratio of 10.4 in 20X4. Carter observes that Sycamore&#x27;s stock price is $24 and Acceleration&#x27;s stock price is $150.<\/p><p>Hernandez is also concerned about Sycamore&#x27;s earnings quality. He asks Carter to:<\/p><p>Review Sycamore&#x27;s accruals, noting that anything more than a 10% increase in a given year or an increasing trend should be a cause of concern. Hernandez asks Carter to remove all unusual items for this exercise.<\/p><p>Measure Sycamore&#x27;s cash generation and measure whether select cash flow ratios are improving or deteriorating<\/p><p>Hernandez reviews all the data and concludes that the article&#x27;s report of Sycamore&#x27;s risk is exaggerated. Carter notes that there is a change in accounting standards planned to force companies to report more liabilities that are currently &quot;off balance sheet.&quot; Carter observes that Sycamore&#x27;s debt and assets would increase by $1 million under the new accounting standards, but nothing else would change.<\/p><\/div><\/details><div class=\"qtext\"><p>If the change in accounting standards described by Hernandez occurs, which of the following of Sycamore&#x27;s financial ratios would most likely increase?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q086.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":87,"q":"Sato's approach for revenue forecasting is best described as:","opts":["hybrid.","top down.","bottom up."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a087.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a087.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 87–92 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Tamiko Sato, Osamu Ishida, and Chiyo Harada, a team of analysts, are assigned to create a forecast model for Neutron Cable Corp. (NCC). Sato suggests forecasting revenue by estimating customer growth and price growth separately:<\/p><p>customer growth estimates would be based on expected market growth and market share, and<\/p><p>price growth would be estimated using a time series forecast based on the company&#x27;s historical price growth rates.<\/p><p>The portfolio manager asks the team to compare revenue forecasts using the &quot;market growth and market share&quot; and &quot;growth relative to GDP growth&quot; approaches. The team compiles the following data and assumptions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex029.webp\" style=\"max-width:min(100%,519px)\" alt=\"Exhibit\"><p>After discussion, the team settles on estimating NCC&#x27;s revenue growth at 3% per year and begins to model operating expenses. Ishida makes the following assumptions for NCC&#x27;s COGS:<\/p><p>Materials represent 40% of NCC&#x27;s current year COGS. Labor costs represent 60% of NCC&#x27;s current year COGS.<\/p><p>Material costs will increase 6% in Year 1 and 4% in Year 2.<\/p><p>Labor costs will decrease as a percentage of revenue by 100 bps each year.<\/p><p>Harada then creates the following assumptions for NCC&#x27;s selling, general, and administrative (SG&amp;A) expenses:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex030.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Based on the forecast, Harada states that NCC is demonstrating economies of scale, as indicated by three factors:<\/p><p>Factor 1: Increasing sales Factor 2: Expanding EBITDA margin<\/p><p>Factor 3: Expanding free cash flow margin<\/p><p>After finishing the model, the portfolio manager asks how it would be affected by expected inflation or deflation. The team gives the following responses:<\/p><p>Sato: &quot;Since NCC&#x27;s services are price inelastic, passing inflation costs on to customers through increased prices will likely result in lower revenue.&quot;<\/p><p>Ishida: &quot;In general, strong brand names allow companies to better maintain profitability during periods of inflationary cost pressures without a significant reduction in sales volumes.&quot;<\/p><p>Harada: &quot;Vertical integration would likely result in less stable margins during periods of input cost volatility.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Sato&#x27;s approach for revenue forecasting is best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q087.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":88,"q":"Based on Exhibit 1, compared to the \"market growth and market share\" approach, after 5 years, NCC's revenue (in · billions) using the \"growth relative to GDP growth\" approach would be greater by:","opts":["0.013","0.179","0.225"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a088.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a088.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 87–92 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tamiko Sato, Osamu Ishida, and Chiyo Harada, a team of analysts, are assigned to create a forecast model for Neutron Cable Corp. (NCC). Sato suggests forecasting revenue by estimating customer growth and price growth separately:<\/p><p>customer growth estimates would be based on expected market growth and market share, and<\/p><p>price growth would be estimated using a time series forecast based on the company&#x27;s historical price growth rates.<\/p><p>The portfolio manager asks the team to compare revenue forecasts using the &quot;market growth and market share&quot; and &quot;growth relative to GDP growth&quot; approaches. The team compiles the following data and assumptions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex029.webp\" style=\"max-width:min(100%,519px)\" alt=\"Exhibit\"><p>After discussion, the team settles on estimating NCC&#x27;s revenue growth at 3% per year and begins to model operating expenses. Ishida makes the following assumptions for NCC&#x27;s COGS:<\/p><p>Materials represent 40% of NCC&#x27;s current year COGS. Labor costs represent 60% of NCC&#x27;s current year COGS.<\/p><p>Material costs will increase 6% in Year 1 and 4% in Year 2.<\/p><p>Labor costs will decrease as a percentage of revenue by 100 bps each year.<\/p><p>Harada then creates the following assumptions for NCC&#x27;s selling, general, and administrative (SG&amp;A) expenses:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex030.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Based on the forecast, Harada states that NCC is demonstrating economies of scale, as indicated by three factors:<\/p><p>Factor 1: Increasing sales Factor 2: Expanding EBITDA margin<\/p><p>Factor 3: Expanding free cash flow margin<\/p><p>After finishing the model, the portfolio manager asks how it would be affected by expected inflation or deflation. The team gives the following responses:<\/p><p>Sato: &quot;Since NCC&#x27;s services are price inelastic, passing inflation costs on to customers through increased prices will likely result in lower revenue.&quot;<\/p><p>Ishida: &quot;In general, strong brand names allow companies to better maintain profitability during periods of inflationary cost pressures without a significant reduction in sales volumes.&quot;<\/p><p>Harada: &quot;Vertical integration would likely result in less stable margins during periods of input cost volatility.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, compared to the &quot;market growth and market share&quot; approach, after 5 years, NCC&#x27;s revenue (in · billions) using the &quot;growth relative to GDP growth&quot; approach would be greater by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q088.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":89,"q":"Based on Ishida's assumptions, in two years, NCC's gross margin will be closest to:","opts":["35.5%","35.7%","36.0%"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a089.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a089.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 87–92 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tamiko Sato, Osamu Ishida, and Chiyo Harada, a team of analysts, are assigned to create a forecast model for Neutron Cable Corp. (NCC). Sato suggests forecasting revenue by estimating customer growth and price growth separately:<\/p><p>customer growth estimates would be based on expected market growth and market share, and<\/p><p>price growth would be estimated using a time series forecast based on the company&#x27;s historical price growth rates.<\/p><p>The portfolio manager asks the team to compare revenue forecasts using the &quot;market growth and market share&quot; and &quot;growth relative to GDP growth&quot; approaches. The team compiles the following data and assumptions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex029.webp\" style=\"max-width:min(100%,519px)\" alt=\"Exhibit\"><p>After discussion, the team settles on estimating NCC&#x27;s revenue growth at 3% per year and begins to model operating expenses. Ishida makes the following assumptions for NCC&#x27;s COGS:<\/p><p>Materials represent 40% of NCC&#x27;s current year COGS. Labor costs represent 60% of NCC&#x27;s current year COGS.<\/p><p>Material costs will increase 6% in Year 1 and 4% in Year 2.<\/p><p>Labor costs will decrease as a percentage of revenue by 100 bps each year.<\/p><p>Harada then creates the following assumptions for NCC&#x27;s selling, general, and administrative (SG&amp;A) expenses:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex030.webp\" style=\"max-width:min(100%,638px)\" alt=\"Exhibit\"><p>Based on the forecast, Harada states that NCC is demonstrating economies of scale, as indicated by three factors:<\/p><p>Factor 1: Increasing sales Factor 2: Expanding EBITDA margin<\/p><p>Factor 3: Expanding free cash flow margin<\/p><p>After finishing the model, the portfolio manager asks how it would be affected by expected inflation or deflation. The team gives the following responses:<\/p><p>Sato: &quot;Since NCC&#x27;s services are price inelastic, passing inflation costs on to customers through increased prices will likely result in lower revenue.&quot;<\/p><p>Ishida: &quot;In general, strong brand names allow companies to better maintain profitability during periods of inflationary cost pressures without a significant reduction in sales volumes.&quot;<\/p><p>Harada: &quot;Vertical integration would likely result in less stable margins during periods of input cost volatility.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Ishida&#x27;s assumptions, in two years, NCC&#x27;s gross margin will be closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q089.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":90,"q":"Based on Exhibits 1 and 2, Harada's forecast for NCC's selling, general, and administrative expenses in Year 1 (in · millions) will be closest to:","opts":["1,006 best describes the effects of inflation or deflation on revenue and cost forecasting?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q092.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":93,"q":"Using the information from Exhibit 1 and Ellende's method of translation, Sable's total assets (in USD millions) is closest to:","opts":["300","302","306"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a093.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a093.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 93–98 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Ellende Enterprises (&quot;Ellende&quot;) is a publicly traded multinational entity based in the United States that reports its financial results under US GAAP. On January 1, 20X1, it established a wholly owned subsidiary, Sable Leisure Goods (&quot;Sable&quot;), in the country of Slandsden.<\/p><p>Sable operates primarily as a sales arm for Ellende. Ellende establishes the sales prices for Sable&#x27;s finished goods, and Sable is required to purchase most of its inventory from Ellende. Ellende also funds Sable&#x27;s payroll and other operating expenses and will provide additional capital to Sable if needed. Ellende uses the temporal method to translate Sable’s financial results.<\/p><p>Exhibit 1 shows Sable&#x27;s condensed income statement and balance sheet for 20X1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex031.webp\" style=\"max-width:min(100%,607px)\" alt=\"Exhibit\"><p>The accompanying notes to Sable&#x27;s financial statements provide the following information:<\/p><p>Sable uses FIFO as its inventory cost method.<\/p><p>Inventory was purchased and sold regularly throughout 20X1.<\/p><p>The long-term assets were all acquired on July 1, 20X1. They have no salvage value and are depreciated on a straight-line basis over 15 years.<\/p><p>The long-term debt is a 10-year, non-amortizing loan that carries a 4% annual coupon.<\/p><p>Ellende has determined that Sable&#x27;s results will be translated into USD using the temporal method. Exhibit 2 shows the relevant exchange rates between USD and SLK throughout 20X1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex032.webp\" style=\"max-width:min(100%,385px)\" alt=\"Exhibit\"><p>Garson Landers, Ellende&#x27;s chief financial officer, presents Ellende&#x27;s consolidated results at a board of directors meeting. In the presentation, Landers makes the following remarks about possibly changing from the temporal method to the current rate method for translating Sable&#x27;s results:<\/p><p>&quot;While we presently use the temporal method, I am concerned that Slandsden will become a hyperinflationary economy soon, perhaps as early as next year. Also, we anticipate that Sable will become more independent from Ellende, including having the ability to establish its own sales prices.&quot;<\/p><p>At the conclusion of the meeting, the directors asked Landers three questions:<\/p><p><b>Question 1:<\/b> What, if any, is the translation adjustment that Ellende reports on its consolidated financial statements from Sable&#x27;s results?<\/p><p><b>Question 2:<\/b> What would the impact on Ellende&#x27;s consolidated results have been if the SLK had been stronger against the USD on December 31, 20X1, than shown by the rate in Exhibit 2?<\/p><p><b>Question 3:<\/b> How would Ellende&#x27;s consolidated results have been affected if Ellende used the SLK as Sable&#x27;s functional currency?<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information from Exhibit 1 and Ellende&#x27;s method of translation, Sable&#x27;s total assets (in USD millions) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q093.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":94,"q":"Based on Landers's remarks to the board, should Ellende change to the current rate method to translate Sable's results?","opts":["No.","Yes, if Sable becomes more autonomous from Ellende.","Yes, if Slandsden's economy is properly classified as hyperinflationary."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a094.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a094.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 93–98 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ellende Enterprises (&quot;Ellende&quot;) is a publicly traded multinational entity based in the United States that reports its financial results under US GAAP. On January 1, 20X1, it established a wholly owned subsidiary, Sable Leisure Goods (&quot;Sable&quot;), in the country of Slandsden.<\/p><p>Sable operates primarily as a sales arm for Ellende. Ellende establishes the sales prices for Sable&#x27;s finished goods, and Sable is required to purchase most of its inventory from Ellende. Ellende also funds Sable&#x27;s payroll and other operating expenses and will provide additional capital to Sable if needed. Ellende uses the temporal method to translate Sable’s financial results.<\/p><p>Exhibit 1 shows Sable&#x27;s condensed income statement and balance sheet for 20X1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex031.webp\" style=\"max-width:min(100%,607px)\" alt=\"Exhibit\"><p>The accompanying notes to Sable&#x27;s financial statements provide the following information:<\/p><p>Sable uses FIFO as its inventory cost method.<\/p><p>Inventory was purchased and sold /p><p>The long-term assets were all acquired on July 1, 20X1. They have no salvage value and are depreciated on a straight-line basis over 15 years.<\/p><p>The long-term debt is a 10-year, non-amortizing loan that carries a 4% annual coupon.<\/p><p>Ellende has determined that Sable&#x27;s results will be translated into USD using the temporal method. Exhibit 2 shows the relevant exchange rates between USD and SLK throughout 20X1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex032.webp\" style=\"max-width:min(100%,385px)\" alt=\"Exhibit\"><p>Garson Landers, Ellende&#x27;s chief financial officer, presents Ellende&#x27;s consolidated results at a board of directors meeting. In the presentation, Landers makes the following remarks about possibly changing from the temporal method to the current rate method for translating Sable&#x27;s results:<\/p><p>&quot;While we presently use the temporal method, I am concerned that Slandsden will become a hyperinflationary economy soon, perhaps as early as next year. Also, we anticipate that Sable will become more independent from Ellende, including having the ability to establish its own sales prices.&quot;<\/p><p>At the conclusion of the meeting, the directors asked Landers three questions:<\/p><p><b>Question 1:<\/b> What, if any, is the translation adjustment that Ellende reports on its consolidated financial statements from Sable&#x27;s results?<\/p><p><b>Question 2:<\/b> What would the impact on Ellende&#x27;s consolidated results have been if the SLK had been stronger against the USD on December 31, 20X1, than shown by the rate in Exhibit 2?<\/p><p><b>Question 3:<\/b> How would Ellende&#x27;s consolidated results have been affected if Ellende used the SLK as Sable&#x27;s functional currency?<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, if results were translated using the current rate method instead of the temporal method, which of Sable&#x27;s ratios would most likely be different?<\/p><\/d t could convert at any time into 15% of Europacar&#x27;s common stock. Ace&#x27;s chief financial officer (CFO) made the following statements concerning this potential investment to a member of Ace&#x27;s board of directors:<\/p><p>Statement 1: If Ace makes this investment, we will account for it as an investment in a financial asset and not as an investment in an associate, so we would not be required to use the equity accounting method.<\/p><p>Statement 2: IFRS permit debt to be classified either as measured at amortized cost or at fair value.<\/p><p><b>Statement 3<\/b> Once we classify the debt, it cannot be reclassified.<\/p><p>Ultimately, Ace chose not to make this additional investment.<\/p><p>On January 1, 20X2, Ace paid EUR 700,000 for 30% equity interest in Vintage Wheels, PLC, a privately held company that refurbishes sports cars. Ace received two seats on Vintage Wheels&#x27; board and began to integrate the company&#x27;s systems and technology into its operations. Selected financial information for Vintage Wheels is shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex034.webp\" style=\"max-width:min(100%,468px)\" alt=\"Exhibit\"><p>In 20X2, Vintage Wheels had EUR 325,000 in net income and paid dividends of EUR 200,000.<\/p><p>The PPE and the intangible assets have a useful life of 10 years and Vintage Wheels uses straight-line depreciation for all noncurrent assets.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 1, the effect of the Europacar investment on Ace&#x27;s pretax income (in EUR) for 20X1 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q099.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":100,"q":"Which of the CFO's statements is most likely correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2  class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex037.webp\" style=\"max-width:min(100%,410px)\" alt=\"Exhibit\"><p>They then discuss the potential for CCC exiting its foreign subsidiary in Brazil, Brazisub. CCC started Brazisub three years ago with an equity investment. Brazisub took out a loan from a local bank and purchased inventory, but the subsidiary never began operations. Bouchard compiles the following information on Brazisub:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex038.webp\" style=\"max-width:min(100%,406px)\" alt=\"Exhibit\"><p>Bouchard suggests exiting the Brazisub business by liquidating the inventory and:<\/p><p>using its cash on hand to pay its liabilities.<\/p><p>having CCC send enough CAD to cover any remaining liabilities.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which South American subsidiary had the highest organic sales growth?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q105.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":106,"q":"Which of the following currencies should USsub most appropriately use as the functional currency for its purchases of Indian supplies?","opts":["INR","CAD","USD"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fsa/a106.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fsa/a106.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 105–110 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Common Cotton Corporation (CCC) is a Canadian-based textile manufacturer that operates throughout the Americas through foreign subsidiaries. Noah Wilson and Anna Bouchard, two of CCC&#x27;s board members, are discussing the growth prospects of e firm&#x27;s analyst specializing in the retail industry, to provide more details.<\/p><p>Cardona notes that she assumes a discount rate of 6% and expects a return on assets of 7% for Jarama&#x27;s pension plan. She presents additional information about Jarama&#x27;s pension plan, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex039.webp\" style=\"max-width:min(100%,533px)\" alt=\"Exhibit\"><p>Cardona then explains to Olmedo how to calculate two important measures of defined benefit pension plans: funded status and periodic pension cost. Cardona adds that Jarama is planning to introduce a defined contribution pension plan for new hires. Olmedo asks Cardona about the differences between defined contribution and defined benefit plans, and she lists the following advantages of defined contribution plans:<\/p><p>Advantage 1: The accounting treatment for the employer is much simpler.<\/p><p>Advantage 2: Employees do not bear risks if the invested assets underperform.<\/p><p>Advantage 3: The company recognizes only a small amount of future obligations as a liability.<\/p><p>Olmedo then asks about Tiendas Henares. Cardona presents information about changes to the defined benefit plan&#x27;s obligation and assets and explains the calculation of the fund&#x27;s periodic pension cost based on information from Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fsa/ex040.webp\" style=\"max-width:min(100%,479px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based only on Cardona&#x27;s assumptions and Exhibit 1, Jarama&#x27;s pension plan&#x27;s funded status (in EUR millions) at the end of 20X1 is a net pension liability of:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fsa/q111.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":112,"q":"Based only on Cardona's assumptions and Exhibit 1, Jarama's pension plan's periodic pension cost (in EUR m
