<script>
const DATA = [{"n":1,"q":"How will a firm's operating cash flow be affected by a decrease in accounts receivable and by\nan increase in accounts payable?","opts":["One will increase operating cash flow and one will decrease operating cash flow.","Both will increase operating cash flow.","Both will decrease operating cash flow."],"ans":"B","expl":"Số tiền phải thu trên bảng cân đối kế toán giảm cho thấy rằng số tiền thu được\nvượt quá doanh thu (doanh thu). Điều này làm tăng dòng tiền hoạt động vì\ncác khoản phải thu đang được thu thập. Việc tăng số tiền phải trả trong tài khoản trên bảng cân đối\ncho thấy rằng việc mua hàng từ nhà cung cấp vượt quá thanh toán bằng tiền mặt. Điều này\nlàm tăng dòng tiền hoạt động vì tiền mặt không được sử dụng để thanh toán cho nhà cung cấp.\n(Mô-đun 30.1, LOS 30.b)"},{"n":2,"q":"What is the impact on accounts receivable if sales exceed cash collections and what is the\nimpact on accounts payable if cash paid to suppliers exceeds purchases?","opts":["Only accounts receivable will increase.","Both accounts payable and accounts receivable will increase.","Only accounts payable will increase."],"ans":"A","expl":"Nếu một công ty bán nhiều hơn số tiền thu được, các khoản phải thu sẽ tăng lên. Nếu một công ty thanh toán\ncho nhà cung cấp nhiều hơn số tiền mua thì khoản phải trả sẽ giảm.\n(Module 30.1, LOS 30.b)"},{"n":3,"q":"Convenience Travel Corp.'s financial information for the year ended December 31, 20X4\nincluded the following:\nProperty Plant & Equipment$15,000,000\nAccumulated Depreciation9,000,000\nThe only asset owned by Convenience Travel in 20X5 was a corporate jet airplane. The\nairplane was being depreciated over a 15-year period on a straight-line basis at a rate of\n$1,000,000 per year. On December 31, 20X5 Convenience Travel sold the airplane for\n$10,000,000 cash. Net income for the year ended December 31, 20X5 was $12,000,000.\nBased on the above information, and ignoring taxes, what is cash flow from operations (CFO)\nfor Convenience Travel for the year ended December 31, 20X5?","opts":["$8,000,000.","$11,000,000.","$13,000,000."],"ans":"A","expl":"Sử dụng phương pháp gián tiếp, CFO là thu nhập ròng tăng khấu hao 20X5 ($1.000.000)\nvà giảm theo lợi nhuận được ghi nhận khi bán máy bay [Giá bán $10.000.000 −\n($15.000.000 giá gốc − $10.000.000 khấu hao lũy kế bao gồm 20X5) =\n$5.000.000]. 12.000.000 USD + 1.000.000 USD − 5.000.000 USD = 8.000.000 USD.\n(Mô-đun 30.2, LOS 30.b)","qhtml":"<p>Convenience Travel Corp.'s financial information for the year ended December 31, 20X4 included the following:</p><table class=\"qtable\"><tbody><tr><td>Property Plant &amp; Equipment</td><td>$15,000,000</td></tr><tr><td>Accumulated Depreciation</td><td>9,000,000</td></tr></tbody></table><p>The only asset owned by Convenience Travel in 20X5 was a corporate jet airplane. The airplane was being depreciated over a 15-year period on a straight-line basis at a rate of $1,000,000 per year. On December 31, 20X5 Convenience Travel sold the airplane for $10,000,000 cash. Net income for the year ended December 31, 20X5 was $12,000,000.</p><p>Based on the above information, and ignoring taxes, what is cash flow from operations (CFO) for Convenience Travel for the year ended December 31, 20X5?</p>"},{"n":4,"q":"Which of the following is most accurate about the consideration of depreciation in the\noperations section of a cash flow statement?","opts":["Considers | Considers","Does not consider | Considers","Does not consider | Does not consider"],"ans":"B","expl":"Phương pháp gián tiếp phải cộng lại chi phí khấu hao vì điểm bắt đầu là thu nhập thuần\n. Vì phương pháp trực tiếp không bắt đầu bằng thu nhập ròng nên không cần\nxem xét các chi phí không dùng tiền mặt như khấu hao.\n(Mô-đun 30.2, LOS 30.b)","cols":["Direct Method","Indirect Method"]},{"n":5,"q":"Murray Company reported the following revenues and expenses for the year ended 2007:\nSales revenue$200,000\nWage expense89,000\nInsurance expense17,000\nInterest expense10,400\nDepreciation expense50,000\nFollowing are the related balance sheet accounts:\n20072006\nUnearned revenue$15,600$13,200\nWages payable5,4006,600\nPrepaid insurance1,2000\nInterest payable5001,600\nAccumulated depreciation95,00045,000\nCalculate cash collections and cash expenses.","opts":["$202,400 | $119,900","$197,600 | $119,900","$202,400 | $58,100"],"ans":"A","expl":"Thu tiền mặt là $202.400 ($200.000 doanh thu + $2.400 tăng doanh thu chưa kiếm được).\nChi phí tiền mặt là $119.900 (–$89.000 chi phí tiền lương – $1.200 giảm tiền lương phải trả\n– $17.000 chi phí bảo hiểm – tăng $1.200 tiền bảo hiểm trả trước – $10.400 tiền lãi\nchi phí – giảm $1.100 tiền lãi phải trả). Chi phí khấu hao là một khoản chi phí\nkhông dùng tiền mặt.\n(Mô-đun 30.1, LOS 30.b)","qhtml":"<p>Murray Company reported the following revenues and expenses for the year ended 2007:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Amount</th></tr></thead><tbody><tr><td>Sales revenue</td><td>$200,000</td></tr><tr><td>Wage expense</td><td>$89,000</td></tr><tr><td>Insurance expense</td><td>$17,000</td></tr><tr><td>Interest expense</td><td>$10,400</td></tr><tr><td>Depreciation expense</td><td>$50,000</td></tr></tbody></table><p>Following are the related balance sheet accounts:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>2007</th><th>2006</th></tr></thead><tbody><tr><td>Unearned revenue</td><td>$15,600</td><td>$13,200</td></tr><tr><td>Wages payable</td><td>$5,400</td><td>$6,600</td></tr><tr><td>Prepaid insurance</td><td>$1,200</td><td>$0</td></tr><tr><td>Interest payable</td><td>$500</td><td>$1,600</td></tr><tr><td>Accumulated depreciation</td><td>$95,000</td><td>$45,000</td></tr></tbody></table><p>Calculate cash collections and cash expenses.</p><p><em>Options show → <strong>Cash Collections</strong> | <strong>Cash Expenses</strong></em></p>"},{"n":6,"q":"To convert an indirect statement of cash flows to a direct basis, the analyst would:","opts":["increase cost of goods sold by any depreciation that was included.","reduce cost of goods sold by any decreases in accounts payable.","reduce cost of goods sold by any decreases in inventory."],"ans":"C","expl":"Số lượng hàng tồn kho giảm thể hiện một nguồn tiền mặt nên số tiền này sẽ được trừ vào giá vốn\ncủa hàng hóa bán ra. Bất kỳ khoản khấu hao và/hoặc khấu hao nào được bao gồm trong giá vốn hàng bán\nkhông thể hiện việc sử dụng tiền mặt thực tế, vì vậy số tiền này phải được trừ vào giá vốn\ncủa hàng hóa đã bán. Khoản phải trả giảm thể hiện việc sử dụng tiền mặt, do đó, những khoản này phải được\nđược thêm vào giá vốn hàng bán.\n(Mô-đun 30.3, LOS 30.c)"},{"n":7,"q":"Assuming, US GAAP is applied, determine the cash flow from financing given the following\ntable.\nItemAmount\nCash payment of dividends$30\nSale of equipment$10\nNet income$25\nPurchase of land$15\nIncrease in accounts payable$20\nSale of preferred stock$25\nIncrease in deferred taxes$5\nProfit on sale of equipment$4","opts":["-$5.","$15.","$20."],"ans":"A","expl":"CFF = 25(Bán hàng tồn kho) − 30(Đã trả phí) = -$5\n(Mô-đun 30.3, LOS 30.b)","qhtml":"<p>Assuming, US GAAP is applied, determine the cash flow from financing given the following</p><p>table.</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Amount</th></tr></thead><tbody><tr><td>Cash payment of dividends</td><td>$30</td></tr><tr><td>Sale of equipment</td><td>$10</td></tr><tr><td>Net income</td><td>$25</td></tr><tr><td>Purchase of land</td><td>$15</td></tr><tr><td>Increase in accounts payable</td><td>$20</td></tr><tr><td>Sale of preferred stock</td><td>$25</td></tr><tr><td>Increase in deferred taxes</td><td>$5</td></tr><tr><td>Profit on sale of equipment</td><td>$4</td></tr></tbody></table>"},{"n":8,"q":"Darth Corporation's net income was $1,200 in the most recent period. Its depreciation\nexpense was $800 and its accounts receivable increased by $1,000. Based only on this\ninformation, cash flow from operating activities reported by Darth should be:","opts":["$1,200.","$1,000.","$2,200."],"ans":"B","expl":"Các điều chỉnh để điều chỉnh thu nhập ròng với dòng tiền từ hoạt động kinh doanh sẽ yêu cầu cộng lại\nkhấu hao ($800) và tăng các khoản phải thu ($1.000) được\ntrừ đi: $1.200 + 800 – 1.000 = $1.000.\n(Mô-đun 30.2, LOS 30.b)"},{"n":9,"q":"Pacific, Inc.'s financial information includes the following, with \"change\" referring to the\ndifference from the prior year (in $ millions):\nNet Income27\nChange in Accounts Receivable+4\nChange in Accounts Payable+1\nChange in Inventory+5\nLoss on sale of equipment-8\nGain on sale of real estate+4\nChange in Retained Earnings+21\nDividends declared and paid+4\nPacific, Inc.'s cash flow from operations (CFO) in millions was:","opts":["$15.","$23.","$27."],"ans":"B","expl":"Sử dụng phương pháp gián tiếp, dòng tiền từ hoạt động là thu nhập ròng ít tăng trong\ncác khoản phải thu, cộng với tăng các khoản phải trả, ít tăng hàng tồn kho, cộng với lỗ\non bán thiết bị, trừ đi lãi bán bất động sản. 27 – 4 + 1 – 5 + 8 – 4 = 23 triệu USD.\n(Mô-đun 30.2, LOS 30.b)"},{"n":10,"q":"An analyst contemplates using the indirect method to create the projected statement of cash\nflows. She decides to research the differences between the direct and indirect methods.\nWhich of the following is least likely a component of the statement of cash flows under the\ndirect method?","opts":["Net income.","Payment of dividends.","Investment in Property, Plant, & Equipment."],"ans":"A","expl":"Tài sản, Nhà xưởng & Thiết bị và thanh toán cổ tức là các thành phần của báo cáo\ncủa dòng tiền theo cả phương pháp trực tiếp và gián tiếp. Thu nhập ròng là số liệu đầu tiên\ntheo phương pháp gián tiếp, nhưng nó không phải là một phần của báo cáo lưu chuyển tiền tệ theo\nphương pháp trực tiếp. Câu trả lời đúng là thu nhập ròng.\n(Mô-đun 30.1, LOS 30.b)"},{"n":11,"q":"Which balance sheet accounts are most closely related to the operating activities on a firm's\ncash flow statement?","opts":["Equity and non-current liabilities.","Non-current assets.","Working capital."],"ans":"C","expl":"Thông thường, các hoạt động kinh doanh trên báo cáo lưu chuyển tiền tệ là nhiều nhất liên quan chặt chẽ đến\ntài khoản vốn lưu động (tài sản lưu động và nợ ngắn hạn) trên bảng cân đối kế toán.\nHoạt động đầu tư thường liên quan đến tài sản dài hạn. Hoạt động tài chính\nthường liên quan đến nợ dài hạn đối với các giao dịch với chủ nợ hoặc vốn chủ sở hữu đối với\ngiao dịch với các cổ đông.\n(Mô-đun 30.1, LOS 30.a)"},{"n":12,"q":"To convert an indirect statement of cash flows to a direct basis, the analyst would:","opts":["add decreases in accounts receivables to net sales.","subtract increases in inventory from cost of goods sold.","add increases in accounts payable to cost of goods sold."],"ans":"A","expl":"Các khoản phải thu giảm thể hiện sự gia tăng tiền mặt nên điều này cần được thêm vào\nvào doanh số bán hàng. Sự gia tăng các khoản phải trả thể hiện sự gia tăng tiền mặt nên những khoản này phải được\ntrừ khỏi giá vốn hàng bán. Lượng hàng tồn kho tăng thể hiện việc sử dụng tiền mặt nên\nnhững khoản này sẽ được cộng vào giá vốn hàng bán.\n(Mô-đun 30.3, LOS 30.c)"},{"n":13,"q":"A firm has net sales of $3,500, earnings after taxes (EAT) of $1,000, depreciation expense of\n$500, cost of goods sold (COGS) of $1,500, and cash taxes of $500. Also, inventory decreased\nby $100, and accounts receivable increased by $300. What is the firm's cash flow from\noperations?","opts":["$1,200.","$1,300.","$1,800."],"ans":"B","expl":"Phương pháp gián tiếp\nEAT+1.000\nKhấu hao+500\nThay đổi trong Inv.+ 100 một nguồn\nThay đổi tài khoản. Rec.(300) a use\nCFO1.300\nPhương pháp trực tiếp\nDoanh thu ròng+3.500\nThay đổi trong tài khoản. Rec.(300) a use\nCOGS(1.500)\nThuế tiền mặt(500)\nThay đổi trong Inv.+100 a nguồn\nCFO1.300\n(Module 30.1, LOS 30.b)"},{"n":14,"q":"What is the difference between the direct and the indirect method of calculating cash flow\nfrom operations?","opts":["Balance sheet items are not included in the cash flow from operations for the direct method, while they are included for the indirect method.","The direct method starts with sales and follows cash as it flows through the income statement, while the indirect method starts with net income and adjusts for non- cash charges and other items.","The indirect method starts with gross income and adjusts to cash flow from operations, while the direct method starts with gross profit and flows through the income statement to calculate cash flows from operations."],"ans":"B","expl":"Sự khác biệt chính giữa phương pháp tính toán dòng tiền trực tiếp và gián tiếp là\ncách tính toán dòng tiền từ hoạt động kinh doanh. Phương pháp trực tiếp bắt đầu bằng doanh số\nvà theo dõi tiền mặt khi nó chảy qua báo cáo kết quả hoạt động kinh doanh, trong khi phương pháp gián tiếp\nbắt đầu bằng thu nhập sau thuế và điều chỉnh ngược lại đối với các mặt hàng không dùng tiền mặt và các mặt hàng khác. Cả hai phương pháp\nsẽ có cùng kết quả đối với dòng tiền hoạt động. Phương pháp trực tiếp và gián tiếp\ntính toán dòng tiền tài trợ và đầu tư theo cùng một cách và cả hai phương pháp\nsẽ mang lại cùng một con số về dòng tiền.\n(Mô-đun 30.3, LOS 30.d)"},{"n":15,"q":"Determine the cash flow from investing given the following table:\nItemAmount\nCash payment of dividends$30\nSale of equipment$25\nNet income$25\nPurchase of land$15\nIncrease in accounts payable$20\nSale of preferred stock$25\nIncrease in deferred taxes$5","opts":["-$5.","$10.","-$10."],"ans":"B","expl":"ItemAmount\nThanh toán cổ tức bằng tiền mặtCFF-$30\nBán thiết bịCFI+$25\nThu nhập ròngCFO+$25\nMua đấtCFI-$15\nTăng tài khoản phải trảCFO+$20\nBán cổ phiếu ưu đãiCFF+$25\nTăng thuế thu nhập hoãn lạiCFO+$5\nCFI = Bán thiết bị (+25) + Mua đất (–15) = $10.\n(Module 30.3, LOS 30.b)","qhtml":"<p>Determine the cash flow from investing given the following table:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Amount</th></tr></thead><tbody><tr><td>Cash payment of dividends</td><td>$30</td></tr><tr><td>Sale of equipment</td><td>$25</td></tr><tr><td>Net income</td><td>$25</td></tr><tr><td>Purchase of land</td><td>$15</td></tr><tr><td>Increase in accounts payable</td><td>$20</td></tr><tr><td>Sale of preferred stock</td><td>$25</td></tr><tr><td>Increase in deferred taxes</td><td>$5</td></tr></tbody></table>"},{"n":16,"q":"Favor, Inc.'s capital and related transactions during 20X5 were as follows:\nOn January 1, $1,000,000 of 5-year 10% annual interest bonds were issued to Cover\nIndustries in exchange for old equipment owned by Cover.\nOn June 30, Favor paid $50,000 of interest to Cover.\nOn July 1, Cover returned the bonds to Favor in exchange for $1,500,000 par value 6%\npreferred stock.\nOn December 31, Favor paid preferred stock dividends of $45,000 to Cover.\nFavor, Inc.'s cash flow from financing (CFF) for 20X5 (assume U.S. GAAP) is:","opts":["–$1,045,000.","–$45,000.","–$95,000."],"ans":"B","expl":"Chỉ trả cổ tức bằng cổ phiếu ưu đãi mới được trả coi là CFF. Phát hành trái phiếu\ntrao đổi lấy thiết bị và trao đổi trái phiếu lấy cổ phiếu đều là những giao dịch không dùng tiền mặt\ncần được trình bày trong chú thích cuối trang của Báo cáo Lưu chuyển tiền tệ. Tiền lãi được trả là một\ndòng tiền hoạt động theo GAAP của Hoa Kỳ.\n(Mô-đun 30.3, LOS 30.b)"},{"n":17,"q":"The following information is from the balance sheet of Silverstone Company:\nNet Income for 5/1/20X5 to 5/31/20X5: $8,000\nBalance 5/01/20X5AccountBalance 5/31/20X5\n$2,000Inventory$1,750\n$1,200Prepaid exp.$1,700\n$800Accum. Depr.$975\n$425Accounts payable$625\n$650Bonds payable$550\nUsing the indirect method, calculate the cash flow from operations for Silverstone Company\nas of 5/31/20X5:","opts":["Increase in cash of $7,725.","Increase in cash of $8,125.","Increase in cash of $8,025."],"ans":"B","expl":"Dòng tiền từ hoạt động của Công ty Silverstone sẽ được tính là +Thu nhập ròng\n$8.000 + Hàng tồn kho $250 - Chi phí trả trước. $500 + Khấu hao $175 + A/P $200 = $8.125.\nTrái phiếu phải trả là một hoạt động tài chính và sẽ không được đưa vào dòng tiền từ\nhoạt động. Phương pháp gián tiếp thực hiện sự thay đổi trong các tài khoản không dùng tiền mặt và giảm\nhoặc tăng thu nhập ròng để đạt được sự thay đổi trong dòng tiền.\n(Mô-đun 30.2, LOS 30.b)","qhtml":"<p>The following information is from the balance sheet of Silverstone Company:</p><p>Net Income for 5/1/20X5 to 5/31/20X5: $8,000</p><table class=\"qtable\"><thead><tr><th>Account</th><th>Balance 5/01/20X5</th><th>Balance 5/31/20X5</th></tr></thead><tbody><tr><td>Inventory</td><td>$2,000</td><td>$1,750</td></tr><tr><td>Prepaid exp.</td><td>$1,200</td><td>$1,700</td></tr><tr><td>Accum. Depr.</td><td>$800</td><td>$975</td></tr><tr><td>Accounts payable</td><td>$425</td><td>$625</td></tr><tr><td>Bonds payable</td><td>$650</td><td>$550</td></tr></tbody></table><p>Using the indirect method, calculate the cash flow from operations for Silverstone Company as of 5/31/20X5:</p>"},{"n":18,"q":"An analyst contemplates using the indirect methods to create the projected statement of\ncash flows. She decides to research the differences between the direct and indirect\nmethods. Which of the following statements is most accurate? Under the:","opts":["direct method, depreciation must be added to cash collections because it is a non- cash expense.","indirect method, changes in accounts receivable are already included in the net income figure.","indirect method, depreciation must be added to net income, because it is a non- cash expense."],"ans":"C","expl":"Phương pháp gián tiếp bắt đầu bằng thu nhập ròng, đã bao gồm tất cả các chi phí bằng tiền mặt và phi tiền mặt\n. Do đó, theo phương pháp gián tiếp, khấu hao phải được cộng vào\nthu nhập ròng vì đây là chi phí không dùng tiền mặt.\n(Module 30.2, LOS 30.b)"},{"n":19,"q":"Use the following information to calculate cash flows from operations using the indirect\nmethod.\nNet Income: $12,000\nDepreciation Expense: $1,000\nLoss on sale of machinery: $500\nIncrease in Accounts Receivable: $2,000\nDecrease in Accounts Payable: $1,500\nIncrease in Income taxes payable: $500\nRepayment of Bonds: $3,000","opts":["Increase in cash of $10,500.","Increase in cash of $7,500.","Increase in cash of $9,500."],"ans":"A","expl":"Dòng tiền từ hoạt động sẽ được tính là +Thu nhập ròng $12.000 + Khấu hao\n$1.000 + Lỗ bán máy móc $500 − A/R $2.000 − A/P $1.500 + Thuế thu nhập phải trả\n$500 = $10.500.\nTrả nợ trái phiếu là một hoạt động tài chính và sẽ không được bao gồm trong các hoạt động\nđiều hành. Khấu hao không phải là một hoạt động của dòng tiền và do đó luôn được cộng lại vào thu nhập\nròng để tính CFO. Lỗ bán máy móc không phải là dòng tiền ra nên\ncũng được cộng lại để tính CFO. Các khoản phải thu sẽ bị trừ đi khi có\ntăng vì điều này làm tăng thu nhập ròng nhưng không ảnh hưởng đến tiền mặt.\n(Mô-đun 30.2, LOS 30.b)"},{"n":20,"q":"Juniper Corp. has the following transactions in 20X5.\nJuniper's equipment with a book value of $55,000 was sold for $85,000 cash.\nA parcel of land was purchased for $100,000 worth of Juniper common stock.\nABC company paid Juniper preferred dividends of $40,000.\nJuniper declared and paid a $100,000 cash dividend.\nUnder U.S. GAAP, what is cash flow from financing (CFF) for Juniper for 20X5?","opts":["–$100,000.","–$115,000.","–$60,000."],"ans":"A","expl":"Mục duy nhất liên quan đến dòng tiền từ tài chính (CFF) là việc trả cổ tức bằng tiền mặt\ncủa Juniper. Việc bán thiết bị ảnh hưởng đến dòng tiền từ hoạt động đầu tư (CFI), việc mua\nđất không ảnh hưởng đến tiền mặt và cổ tức ưu đãi nhận được là dòng tiền từ\nhoạt động theo GAAP của Hoa Kỳ.\n(Mô-đun 30.3, LOS 30.b)"},{"n":21,"q":"To compute cash collections from customers when converting a statement of cash flows\nfrom the indirect to the direct method, an analyst begins with:","opts":["net income and adds back non-cash expenses.","sales, subtracts any increase in accounts receivable, and adds any increase in unearned revenue.","cost of goods sold, subtracts any increase in accounts payable, adds any increase in inventory, and subtracts any inventory write-offs."],"ans":"B","expl":"Để tính toán số tiền thu được từ khách hàng, hãy bắt đầu bằng doanh thu thuần từ bảng kê thu nhập\n, trừ (cộng) mọi khoản tăng (giảm) trong các khoản phải thu và cộng\n(trừ) mọi sự tăng (giảm) trong doanh thu chưa thực hiện. (Mô-đun 30.3, LOS 30.c)"},{"n":22,"q":"Which set of accounting standards allows a firm to classify interest received as a financing\ncash flow and interest paid as an investing cash flow on its cash flow statement?","opts":["Neither the IFRS nor U.S. GAAP.","The IFRS only.","U.S. GAAP only."],"ans":"A","expl":"IFRS cho phép công ty phân loại lãi nhận được thành dòng tiền hoạt động hoặc đầu tư\nvà phân loại tiền lãi phải trả là dòng tiền hoạt động hoặc dòng tiền tài trợ. GAAP của Hoa Kỳ\nyêu cầu cả tiền lãi nhận được và tiền lãi phải trả đều phải được phân loại là dòng tiền hoạt động.\n(Mô-đun 30.3, LOS 30.d)"},{"n":23,"q":"In converting a statement of cash flows from the indirect to the direct method, which of the\nfollowing adjustments should be made for a decrease in unearned revenue when calculating\ncash collected from customers, and for an inventory writedown (when market value is less\nthan cost) when calculating cash payments to suppliers?","opts":["Add decrease in unearned revenue | Subtract an inventory writedown","Subtract decrease in unearned revenue | Add an inventory writedown","Subtract decrease in unearned revenue | Subtract an inventory writedown"],"ans":"C","expl":"Bắt đầu từ doanh thu thuần, việc tính toán tiền mặt thu được từ khách hàng yêu cầu cộng\n(trừ) bất kỳ mức tăng (giảm) nào trong doanh thu chưa thực hiện. Tiền mặt ứng trước từ\nkhách hàng thể hiện doanh thu chưa thực hiện và không được tính vào doanh thu thuần, do đó, bất kỳ khoản tạm ứng nào\nphải được thêm vào doanh thu thuần để tính toán tiền mặt thu được.\nViệc ghi giảm hàng tồn kho, do áp dụng chi phí thấp hơn hoặc quy tắc thị trường, sẽ\ngiảm hàng tồn kho cuối kỳ và tăng giá vốn hàng bán trong kỳ. Tuy nhiên, không có dòng tiền nào\nliên quan đến việc ghi giảm, do đó giá vốn hàng bán giảm theo số tiền ghi giảm trong\ntính tiền mặt trả cho nhà cung cấp.\n(Mô-đun 30.3, LOS 30.c)"},{"n":24,"q":"A company's financial statement data for the most recent year include the following:\nNet income $100\nDepreciation expense 25\nPurchase of machine 50\nSale of company trucks 30\nSale of common stock 45\nDecrease in accounts receivable 10\nIncrease in inventory 20\nIssuance of bonds 25\nIncrease in accounts payable 15\nIncrease in wages payable 10\nBased only on these items, cash flow from financing activities is closest to:","opts":["$140.","$85.","$70."],"ans":"C","expl":"Bán cổ phiếu phổ thông45\nPhát hành trái phiếu25\nDòng tiền tài chính$70\n(Module 30.3, LOS 30.b)"},{"n":25,"q":"Selected information from Rockway, Inc.'s U.S. GAAP financial statements for the year ended\nDecember 31, included the following (in $):\n20042005\nSales17,000,00021,000,000\nCost of Goods Sold11,000,00015,000,000\nInterest Paid800,0001,000,000\nCurrent Income Taxes Paid700,0001,000,000\nAccounts Receivable3,000,0002,500,000\nInventory2,400,0003,000,000\nProperty, Plant & Equip.2,000,00016,000,000\nAccounts Payable1,000,0001,400,000\nLong-term Debt8,000,0009,000,000\nCommon Stock4,000,0005,000,000\nUsing the direct method, cash provided or used by operating activities(CFO) in the year 2005\nwas:","opts":["$5,300,000.","$6,300,000.","$4,300,000."],"ans":"C","expl":"Tiền được cung cấp hoặc sử dụng từ hoạt động kinh doanh theo phương pháp trực tiếp được tính bằng\ncộng dòng tiền vào và trừ đi dòng tiền đầu vào và dòng tiền ra. Tiền mặt hoạt động\nDòng vốn vào Rockway Inc. trong năm 2005 đến từ doanh số bán hàng ($21.000.000) và sự sụt giảm trong tài khoản\nphải thu ($3.000.000 − $2.500.000 = $500.000) đối với dòng tiền ròng vào là ($21.000.000 +\n500.000 USD =) 21.500.000 USD. Tiền đầu vào từ hoạt động kinh doanh là giá vốn hàng bán ($15.000.000),\ncộng với mức tăng hàng tồn kho ($3.000.000 - $2.400.000 = $600.000) trừ đi mức tăng về\ncác khoản phải trả, (là nguồn tiền) ($1.000.000 − $1.400.000 = -$400.000) cho\nđầu vào tiền mặt ròng ($15.000.000 + $600.000 - $400.000 =) $15.200.000. Hoạt động khác\nDòng tiền ra đã được trả lãi ($1.000.000) và thuế thu nhập hiện tại đã trả ($1.000.000)\ntổng cộng ($2.000.000). Tiền mặt do hoạt động cung cấp là ($21.500.000 − $15.200.000 −\n2.000.000 USD =) 4.300.000 USD. Những thay đổi về tài sản, nhà xưởng và thiết bị, nợ dài hạn và\ncổ phiếu phổ thông không ảnh hưởng đến tiền từ hoạt động kinh doanh.\n(Học ​​phần 30.1, LOS 30.b)"},{"n":26,"q":"When calculating cash flow from operations (CFO) using the indirect method which of the\nfollowing is most accurate?","opts":["The indirect method requires an additional schedule to reconcile net income to cash flow.","When recognizing a gain on the sale of fixed assets, the amount is a deduction to operating cash flows.","In using the indirect method, each item on the income statement is converted to its cash equivalent."],"ans":"B","expl":"Khi ghi nhận lãi từ việc bán tài sản cố định, số tiền này được khấu trừ vào\ndòng tiền hoạt động. Điều này là do lợi nhuận sẽ được tính gấp đôi trong phần\nđầu tư và thu nhập ròng. Vì vậy, lợi nhuận phải được loại bỏ khỏi thu nhập ròng. Phương pháp\ntrực tiếp để tính toán dòng tiền sẽ chuyển đổi các mục trong báo cáo thu nhập thành số tiền tương đương\n, chứ không phải phương pháp gián tiếp. Ngoài ra, khấu hao được cộng vào thu nhập ròng để\ntính toán CFO bằng phương pháp gián tiếp.\n(Mô-đun 30.2, LOS 30.b)"},{"n":27,"q":"Noncurrent assets on the balance sheet are most closely linked to which part of the cash\nflow statement?","opts":["Financing cash flows.","Investing cash flows.","Operating cash flows."],"ans":"B","expl":"Dòng tiền đầu tư có mối liên hệ chặt chẽ nhất với tài sản dài hạn của công ty. Ví dụ:\ncác hoạt động mua bán bất động sản, nhà máy và thiết bị được phân loại là dòng tiền đầu tư\n.\n(Mô-đun 30.1, LOS 30.a)"},{"n":28,"q":"Given the following information, what is the adjustment to net income when calculating cash\nflow from operations using the indirect method?\nIncrease in accounts payable of $25.\nSold one share of stock for $15.\nPaid dividends of $10 to shareholders.\nDepreciation expense of $100.\nIncrease in inventory of $20.","opts":["-$50.","+$105.","-$95."],"ans":"B","expl":"Sử dụng phương pháp gián tiếp, việc tăng tài khoản phải trả là nguồn tiền từ\nhoạt động (+25), chi phí khấu hao là chi phí không dùng tiền mặt được cộng lại trong tính toán\ntiền từ hoạt động (+100) và tăng hàng tồn kho là việc sử dụng tiền mặt từ hoạt động\n(-20) = 25 + 100 - 20 = 105. Việc bán cổ phiếu và trả cổ tức đang tài trợ cho các luồng tiền\nkhông được tính vào thu nhập ròng nên không cần điều chỉnh khi\ntính CFO.\n(Module 30.2, LOS 30.b)"},{"n":29,"q":"The Beeline Company has the following balance sheet and income statement.\nBeeline Company Balance Sheet\nAs of December 31, 20X4\n2003200420032004\nCash$50$60Accounts payable$100$150\nAccounts receivable100110Long-term debt400300\nInventory200180Common stock5050\nRetained earnings400500\nFixed assets (gross)800900Total liabilities and equity$950$1,000\nLess: Accumulated depreciation200250\nFixed assets (net)600650\nTotal assets$950$1,000\nBeeline Company Income Statement\nFor year ended December 31, 20X4\nSales$1,000\nLess:\nCOGS600\nDepreciation50\nSelling, general, and administrative expenses160\nInterest expense23\nIncome before taxes$167\nLess tax67\nNet income$100\nThe cash flow from operations for 2004 is:","opts":["$150.","$260.","$210."],"ans":"C","expl":"Dòng tiền từ hoạt động (CFO) được tính bằng phương pháp gián tiếp là: thu nhập ròng (100)\n+ khấu hao (50) – tăng các khoản phải thu (10) + giảm trong kho (20) +\ntăng tài khoản phải trả (50) = $210.\n(Mô-đun 30.2, LOS 30.b)","qhtml":"<p>The Beeline Company has the following balance sheet and income statement.</p><p><strong>Beeline Company Balance Sheet — As of December 31, 20X4</strong></p><table class=\"qtable\"><thead><tr><th></th><th>2003</th><th>2004</th></tr></thead><tbody><tr><td>Cash</td><td>$50</td><td>$60</td></tr><tr><td>Accounts receivable</td><td>100</td><td>110</td></tr><tr><td>Inventory</td><td>200</td><td>180</td></tr><tr><td>Fixed assets (gross)</td><td>800</td><td>900</td></tr><tr><td>Less: Accumulated depreciation</td><td>200</td><td>250</td></tr><tr><td>Fixed assets (net)</td><td>600</td><td>650</td></tr><tr><td>Total assets</td><td>$950</td><td>$1,000</td></tr><tr><td>Accounts payable</td><td>$100</td><td>$150</td></tr><tr><td>Long-term debt</td><td>400</td><td>300</td></tr><tr><td>Common stock</td><td>50</td><td>50</td></tr><tr><td>Retained earnings</td><td>400</td><td>500</td></tr><tr><td>Total liabilities and equity</td><td>$950</td><td>$1,000</td></tr></tbody></table><p><strong>Beeline Company Income Statement — For year ended December 31, 20X4</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>$1,000</td></tr><tr><td>COGS</td><td>600</td></tr><tr><td>Depreciation</td><td>50</td></tr><tr><td>Selling, general, and administrative expenses</td><td>160</td></tr><tr><td>Interest expense</td><td>23</td></tr><tr><td>Income before taxes</td><td>$167</td></tr><tr><td>Less tax</td><td>67</td></tr><tr><td>Net income</td><td>$100</td></tr></tbody></table><p>The cash flow from operations for 2004 is:</p>"},{"n":30,"q":"An analyst compiled the following information for Universe, Inc. for the year ended\nDecember 31, 20X4:\nNet income was $850,000.\nDepreciation expense was $200,000.\nCommon stock was sold for $100,000.\nPreferred stock (eight percent annual dividend) was sold at par value of $125,000.\nCommon stock dividends of $25,000 were paid.\nPreferred stock dividends of $10,000 were paid.\nEquipment with a book value of $50,000 was sold for $100,000.\nUsing the indirect method and assuming U.S. GAAP, what was Universe Inc.'s cash flow from\noperations (CFO) for the year ended December 31, 20X4?","opts":["$1,000,000.","$1,015,000.","$1,050,000."],"ans":"A","expl":"Dòng tiền từ hoạt động (CFO) sử dụng phương pháp gián tiếp được tính bằng cách lấy\nthu nhập ròng cộng với các chi phí không dùng tiền mặt (tức là khấu hao) trừ đi lợi nhuận từ việc bán thiết bị.\nLưu ý rằng dòng tiền từ hoạt động phải được điều chỉnh giảm xuống theo mức\nthu được từ việc bán thiết bị. Dòng tiền từ hoạt động là ($850.000 + $200.000 –\n($100.000 – $50.000)) = $1.000.000. Thông tin khác liên quan đến dòng tiền tài trợ.\n(Mô-đun 30.2, LOS 30.b)"},{"n":31,"q":"An analyst has gathered the following information about a company:\nIncome Statement for the Year 20X4\nSales$1,500\nExpenses\nCOGS$1,300\nDepreciation30\nInt. Expenses40\nTotal expenses1,370\nIncome from cont. op.130\nGain on sale30\nIncome before tax160\nIncome tax64\nNet Income$96\nAdditional Information:\nDividends paid$30\nCommon stock sold20\nEquipment purchased50\nBonds issued80\nFixed asset sold for (original cost of $100 with accumulated depreciation of $70)60\nAccounts receivable decreased by30\nInventory decreased by20\nAccounts payable increased by20\nWages payable decreased by10\nWhat is the cash flow from operations?","opts":["$156.","$150.","$170."],"ans":"A","expl":"Thu nhập ròng+$96\nKhấu hao+30\nLợi nhuận bán tài sản-30\nAccts. Ghi+30\nKho lưu trữ+20\nTài khoản. Phải trả+20\nTiền lương phải trả-10\nCFO+$156\n(Mô-đun 30.2, LOS 30.b)","qhtml":"<p>An analyst has gathered the following information about a company:</p><p><strong>Income Statement for the Year 20X4</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>$1,500</td></tr><tr><td>Expenses</td><td></td></tr><tr><td>&nbsp;&nbsp;COGS</td><td>$1,300</td></tr><tr><td>&nbsp;&nbsp;Depreciation</td><td>30</td></tr><tr><td>&nbsp;&nbsp;Int. Expenses</td><td>40</td></tr><tr><td>&nbsp;&nbsp;Total expenses</td><td>1,370</td></tr><tr><td>Income from cont. op.</td><td>130</td></tr><tr><td>Gain on sale</td><td>30</td></tr><tr><td>Income before tax</td><td>160</td></tr><tr><td>Income tax</td><td>64</td></tr><tr><td>Net Income</td><td>$96</td></tr></tbody></table><p><strong>Additional Information:</strong></p><ul><li>Dividends paid: $30</li><li>Common stock sold: 20</li><li>Equipment purchased: 50</li><li>Bonds issued: 80</li><li>Fixed asset sold for 60 (original cost of $100 with accumulated depreciation of $70)</li><li>Accounts receivable decreased by 30</li><li>Inventory decreased by 20</li><li>Accounts payable increased by 20</li><li>Wages payable decreased by 10</li></ul><p>What is the cash flow from operations?</p>"},{"n":32,"q":"Financial information for Jefferson Corp. for the year ended December 31st, was as follows:\nSales$3,000,000\nPurchases1,800,000\nInventory at Beginning500,000\nInventory at Ending800,000\nAccounts Receivable at Beginning300,000\nAccounts Receivable at Ending200,000\nAccounts Payable at Beginning100,000\nAccounts Payable at Ending100,000\nOther Operating Expenses Paid400,000\nBased upon this data and using the direct method, what was Jefferson Corp.'s cash flow\nfrom operations (CFO) for the year ended December 31st?","opts":["$800,000.","$1,200,000.","$900,000."],"ans":"C","expl":"CFO = doanh thu $3.000.000 – thay đổi các khoản phải thu ($200.000 – $300.000) – mua hàng\n$1.800.000 – chi phí hoạt động bằng tiền mặt khác $400.000 = $900.000.\nLưu ý rằng không cần điều chỉnh hàng tồn kho vì đã mua hàng. Từ\nphương trình tồn kho, P = COGS + EI - BI.\n(Mô-đun 30.1, LOS 30.b)","qhtml":"<p>Financial information for Jefferson Corp. for the year ended December 31st, was as follows:</p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>$3,000,000</td></tr><tr><td>Purchases</td><td>1,800,000</td></tr><tr><td>Inventory at Beginning</td><td>500,000</td></tr><tr><td>Inventory at Ending</td><td>800,000</td></tr><tr><td>Accounts Receivable at Beginning</td><td>300,000</td></tr><tr><td>Accounts Receivable at Ending</td><td>200,000</td></tr><tr><td>Accounts Payable at Beginning</td><td>100,000</td></tr><tr><td>Accounts Payable at Ending</td><td>100,000</td></tr><tr><td>Other Operating Expenses Paid</td><td>400,000</td></tr></tbody></table><p>Based upon this data and using the direct method, what was Jefferson Corp.'s cash flow from operations (CFO) for the year ended December 31st?</p>"},{"n":33,"q":"Under IFRS, which cash flow statement classifications for dividends paid and interest\nreceived, respectively, are least likely permitted?","opts":["Operating activity | Investing activity","Financing activity | Operating activity","Investing activity | Financing activity"],"ans":"C","expl":"Theo IFRS, tiền lãi nhận được có thể được phân loại là CFO hoặc CFI, trong khi cổ tức được trả có thể được\nphân loại là CFO hoặc CFF. (Mô-đun 30.3, LOS 30.d)","cols":["Dividends paid","Interest received"]},{"n":34,"q":"A U.S. GAAP reporting company has the following changes in its balance sheet accounts:\nNet Sales$500\nAn increase in accounts receivable20\nA decrease in accounts payable40\nAn increase in inventory30\nSale of common stock100\nRepayment of debt10\nDepreciation2\nNet Income100\nInterest expense on debt5\nThe company's cash flow from financing is:","opts":["-$10.","$90.","$100."],"ans":"B","expl":"Bán cổ phiếu phổ thông$100\nTrả nợ(10)\nDòng tiền tài chính$ 90\n(Mô-đun 30.3, LOS 30.b)","qhtml":"<p>A U.S. GAAP reporting company has the following changes in its balance sheet accounts:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Net Sales</td><td>$500</td></tr><tr><td>An increase in accounts receivable</td><td>20</td></tr><tr><td>A decrease in accounts payable</td><td>40</td></tr><tr><td>An increase in inventory</td><td>30</td></tr><tr><td>Sale of common stock</td><td>100</td></tr><tr><td>Repayment of debt</td><td>10</td></tr><tr><td>Depreciation</td><td>2</td></tr><tr><td>Net Income</td><td>100</td></tr><tr><td>Interest expense on debt</td><td>5</td></tr></tbody></table><p>The company's cash flow from financing is:</p>"},{"n":35,"q":"Which of the following statements regarding depreciation expense in the cash flow\nstatements is most accurate? Depreciation is added back to net income when determining\nCFO using:","opts":["either the direct or indirect methods.","the direct method.","the indirect method."],"ans":"C","expl":"Khấu hao không phải là tiền mặt chi phí. Chỉ trong phương pháp gián tiếp, khấu hao mới được cộng\nvào thu nhập ròng khi xác định CFO vì thu nhập ròng chỉ được sử dụng trong phương pháp\ngián tiếp chứ không phải phương pháp trực tiếp. Thay vào đó, phương pháp trực tiếp bắt đầu bằng việc bán tiền mặt và\nxử lý báo cáo thu nhập.\n(Mô-đun 30.2, LOS 30.b)"},{"n":36,"q":"The net income for Miller Bat Company was $3 million for the year ended December 31,\n20X4. Additional information is as follows:\nDepreciation on fixed assets: $1,500,000\nGain from cash sales of land: 200,000\nIncrease in accounts payable: 300,000\nDividends paid on preferred stock: 400,000\nUnder U.S. GAAP, the net cash provided by operating activities in the statement of cash flows\nfor the year ended December 31, 20X4 is:","opts":["$4,200,000.","$4,500,000.","$4,600,000."],"ans":"C","expl":"$3.000.000 + $1.500.000 – $200.000 + $300.000 = $4.600.000.\n(Mô-đun 30.2, LOS 30.b)"},{"n":37,"q":"Impala Corporation reported the following financial information:\n20062007\nBalance sheet values as of December 31:\nPrepaid insurance$650,000$475,000\nInterest payable250,000300,000\nCash flows for the year ended December 31:\nInsurance premiums paid$845,000$750,000\nInterest paid900,000900,000\nCalculate Impala's insurance expense and interest expense for the year ended December 31,\n2007.","opts":["$925,000 | $850,000","$925,000 | $950,000","$1,020,000 | $950,000"],"ans":"B","expl":"Tiền mặt trả cho bảo hiểm = chi phí bảo hiểm + thay đổi trong bảo hiểm trả trước, do đó bảo hiểm\nexpense = tiền mặt trả cho bảo hiểm – thay đổi bảo hiểm trả trước. Chi phí bảo hiểm cho\n2007 tương đương với 925.000 USD [($750.000 tiền mặt trả cho bảo hiểm – (–$175.000)]. Lãi\nchi phí cho năm 2007 bằng 950.000 USD (900.000 USD tiền lãi được trả + 50.000 USD tăng\nlãi suất phải trả).\n(Mô-đun 30.1, LOS 30.b)","qhtml":"<p>Impala Corporation reported the following financial information:</p><table class=\"qtable\"><thead><tr><th></th><th>2006</th><th>2007</th></tr></thead><tbody><tr><td><strong>Balance sheet values as of December 31:</strong></td><td></td><td></td></tr><tr><td>Prepaid insurance</td><td>$650,000</td><td>$475,000</td></tr><tr><td>Interest payable</td><td>$250,000</td><td>$300,000</td></tr><tr><td><strong>Cash flows for the year ended December 31:</strong></td><td></td><td></td></tr><tr><td>Insurance premiums paid</td><td>$845,000</td><td>$750,000</td></tr><tr><td>Interest paid</td><td>$900,000</td><td>$900,000</td></tr></tbody></table><p>Calculate Impala's insurance expense and interest expense for the year ended December 31, 2007.</p><p><em>Options show → <strong>Insurance Expense</strong> | <strong>Interest Expense</strong></em></p>"},{"n":38,"q":"Use the following financial data for Moose Printing Corporation, a U.S. GAAP reporting firm,\nto calculate the cash flow from operations (CFO) using the indirect method.\nNet income: $225\nIncrease in accounts receivable: $55\nDecrease in inventory: $33\nDepreciation: $65\nDecrease in accounts payable: $25\nIncrease in wages payable: $15\nDecrease in deferred taxes: $10\nPurchase of new equipment: $65\nDividends paid: $75","opts":["Increase in cash of $248.","Increase in cash of $183.","Increase in cash of $173."],"ans":"A","expl":"CFO của Moose Printing Corporation được tính như sau:\n+Thu nhập ròng $225 − A/R $55 + Hàng tồn kho $33 + Khấu hao $65 − A/P $25 +\nTiền lương phải trả $15 − Thuế hoãn lại $10 = $248.\nViệc mua thiết bị mới là một hoạt động đầu tư và do đó không được bao gồm trong\nCFO Cổ tức được trả là một hoạt động tài chính. không được bao gồm trong CFO.\n(Mô-đun 30.2, LOS 30.b)"},{"n":39,"q":"To calculate cash received from customers, an analyst would most appropriately:","opts":["add the change in accounts receivable to credit sales.","subtract accounts receivable from gross sales.","subtract the change in accounts receivable from net sales."],"ans":"C","expl":"Tiền mặt nhận được từ khách hàng được tính toán hợp lý nhất bằng cách trừ đi thay đổi\ntrong các tài khoản phải thu từ doanh thu thuần.\n(Mô-đun 30.1, LOS 30.a)"},{"n":40,"q":"Maverick Company reported the following financial information for 2007:\nin millions\nBeginning accounts receivable$180\nEnding accounts receivable225\nSales11,000\nBeginning inventory2,000\nEnding inventory2,300\nPurchases8,100\nBeginning accounts payable1,600\nEnding accounts payable1,200\nCalculate Maverick's cost of goods sold and cash paid to suppliers for 2007.","opts":["$7,800 million | $8,500 million","$7,800 million | $7,100 million","$3,800 million | $8,500 million"],"ans":"A","expl":"Giá vốn hàng bán bằng 7.800 triệu USD (2.000 triệu USD hàng tồn kho đầu kỳ + 8.100 USD\ntriệu lượt mua hàng – 2.300 USD triệu hàng tồn kho cuối kỳ). Tiền mặt trả cho nhà cung cấp bằng\n$8.500 triệu (–$7.800 COGS – $300 triệu hàng tồn kho tăng – $400 triệu giảm\ntrong tài khoản phải trả). Giải pháp thay thế: Tiền mặt trả cho nhà cung cấp tương đương 8.500 triệu USD (–\n8.100 triệu USD mua hàng – giảm 400 USD trong tài khoản phải trả).\n(Mô-đun 30.1, LOS 30.b)","qhtml":"<p>Maverick Company reported the following financial information for 2007:</p><p>in millions</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Beginning accounts receivable</td><td>$180</td></tr><tr><td>Ending accounts receivable</td><td>225</td></tr><tr><td>Sales</td><td>11,000</td></tr><tr><td>Beginning inventory</td><td>2,000</td></tr><tr><td>Ending inventory</td><td>2,300</td></tr><tr><td>Purchases</td><td>8,100</td></tr><tr><td>Beginning accounts payable</td><td>1,600</td></tr><tr><td>Ending accounts payable</td><td>1,200</td></tr></tbody></table><p>Calculate Maverick's cost of goods sold and cash paid to suppliers for 2007.</p><p><em>Options show → <strong>Cost of goods sold</strong> | <strong>Cash paid to suppliers</strong></em></p>"},{"n":41,"q":"Galaxy, Inc.'s U.S. GAAP balance sheet as of December 31, 20X4 included the following\ninformation (in $):\n12-31-X312-31-X4\nAccounts Payable300,000500,000\nDividends Payable200,000300,000\nCommon Stock1,000,0001,000,000\nRetained Earnings700,0001,000,000\nGalaxy's net income in 20X4 was $800,000. What was Galaxy's cash flow from financing (CFF)\nin 20X4?","opts":["–$400,000.","–$500,000.","–$300,000."],"ans":"A","expl":"Cổ tức được công bố là thu nhập ròng trừ đi phần tăng trong thu nhập giữ lại ($800.000 -\n$300.000 = $500.000). Cổ tức được công bố trừ đi mức tăng cổ tức phải trả là\ncổ tức được trả ($500.000 – ($300.000 - $200.000) = $400.000). Đây là dòng tiền ra nên\nlà số âm. Cổ tức được trả luôn là dòng tiền từ hoạt động tài trợ theo GAAP của Hoa Kỳ.\nLưu ý rằng những thay đổi về khoản phải trả được bao gồm trong dòng tiền từ hoạt động (CFO).\n(Module 30.3, LOS 30.b)"},{"n":42,"q":"An analyst has gathered the following information about a company:\nIncome Statement for the Year 20X5\nSales$1,500\nExpenses\nCOGS$1,300\nDepreciation20\nGoodwill10\nInt. Expenses40\nTotal expenses1,370\nIncome from cont. op.130\nGain on sale30\nIncome before tax160\nIncome tax64\nNet Income$96\nAdditional Information:\nDividends paid30\nCommon stock sold20\nEquipment purchased50\nBonds issued80\nFixed asset sold for (original cost of $100 with accumulated depreciation of $70)60\nAccounts receivable decreased by30\nInventory decreased by20\nAccounts payable increased by20\nWages payable decreased by10\nWhat is the cash flow from investing?","opts":["$130.","$10.","$110."],"ans":"B","expl":"Mua thiết bị-$50\nTài sản cố định đã bán$60\nCFI$10\n(Mô-đun 30.3, LOS 30.b)","qhtml":"<p>An analyst has gathered the following information about a company:</p><p><strong>Income Statement for the Year 20X5</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>$1,500</td></tr><tr><td>Expenses</td><td></td></tr><tr><td>&nbsp;&nbsp;COGS</td><td>$1,300</td></tr><tr><td>&nbsp;&nbsp;Depreciation</td><td>20</td></tr><tr><td>&nbsp;&nbsp;Goodwill</td><td>10</td></tr><tr><td>&nbsp;&nbsp;Int. Expenses</td><td>40</td></tr><tr><td>&nbsp;&nbsp;Total expenses</td><td>1,370</td></tr><tr><td>Income from cont. op.</td><td>130</td></tr><tr><td>Gain on sale</td><td>30</td></tr><tr><td>Income before tax</td><td>160</td></tr><tr><td>Income tax</td><td>64</td></tr><tr><td>Net Income</td><td>$96</td></tr></tbody></table><p><strong>Additional Information:</strong></p><ul><li>Dividends paid: 30</li><li>Common stock sold: 20</li><li>Equipment purchased: 50</li><li>Bonds issued: 80</li><li>Fixed asset sold for 60 (original cost of $100 with accumulated depreciation of $70)</li><li>Accounts receivable decreased by 30</li><li>Inventory decreased by 20</li><li>Accounts payable increased by 20</li><li>Wages payable decreased by 10</li></ul><p>What is the cash flow from investing?</p>"},{"n":43,"q":"Independence, Inc. reports interest received and dividends paid as part of its cash flow from\noperations. This treatment is acceptable under:","opts":["either IFRS or U.S. GAAP.","IFRS but not under U.S. GAAP.","U.S. GAAP but not under IFRS."],"ans":"B","expl":"IFRS cho phép tiền lãi nhận được được báo cáo dưới dạng dòng tiền từ hoạt động hoặc tiền mặt\nluồng từ hoạt động đầu tư và cho phép cổ tức được trả được báo cáo dưới dạng dòng tiền từ\nhoạt động hoặc dòng tiền từ hoạt động tài chính. GAAP của Hoa Kỳ yêu cầu lãi suất nhận được phải được\nbáo cáo dưới dạng dòng tiền từ hoạt động, nhưng yêu cầu cổ tức đã trả phải được báo cáo dưới dạng tiền\ndòng tiền từ hoạt động tài chính.\n(Mô-đun 30.3, LOS 30.d)"},{"n":44,"q":"Determine the cash flow from operations given the following table.\nItemAmount\nCash payment of dividends$30\nSale of equipment$25\nNet income$25\nPurchase of land$15\nIncrease in accounts payable$20\nSale of preferred stock$25\nIncrease in deferred taxes$5\nProfit on sale of equipment$15","opts":["$45.","$20.","$35."],"ans":"C","expl":"Sử dụng phương pháp gián tiếp, CFO = Thu nhập ròng 25 + tăng tài khoản phải trả 20 +\ntăng thuế hoãn lại 5 – lợi nhuận bán thiết bị 15 = $35.\nSự gia tăng trong các khoản phải trả và thuế hoãn lại là nguồn tiền mặt từ hoạt động kinh doanh\nkhông được tính vào thu nhập ròng và phải được thêm vào. Lợi nhuận từ việc bán thiết bị là một khoản mục CFI\nphải được loại bỏ khỏi thu nhập ròng.\nKhông cần thực hiện điều chỉnh đối với việc thanh toán cổ tức bằng tiền mặt (CFF), bán cổ phiếu ưu đãi\n(CFF) hoặc mua đất (CFI) vì chúng không được tính vào thu nhập ròng. Chỉ\nlợi nhuận từ việc bán thiết bị chứ không phải toàn bộ số tiền thu được từ việc bán thiết bị mới được tính vào thu nhập ròng.\n(Mô-đun 30.2, LOS 30.b)","qhtml":"<p>Determine the cash flow from operations given the following table.</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Amount</th></tr></thead><tbody><tr><td>Cash payment of dividends</td><td>$30</td></tr><tr><td>Sale of equipment</td><td>$25</td></tr><tr><td>Net income</td><td>$25</td></tr><tr><td>Purchase of land</td><td>$15</td></tr><tr><td>Increase in accounts payable</td><td>$20</td></tr><tr><td>Sale of preferred stock</td><td>$25</td></tr><tr><td>Increase in deferred taxes</td><td>$5</td></tr><tr><td>Profit on sale of equipment</td><td>$15</td></tr></tbody></table>"},{"n":45,"q":"The correct set of cash flow treatments as they relate to interest paid according to U.S.\ngenerally accepted accounting principles (GAAP) and International Accounting Standards\n(IAS) GAAP is:\nU.S. GAAPIAS GAAP","opts":["CFO or CFFCFO","CFOCFO or CFF","CFFCFF"],"ans":"B","expl":"GAAP của Hoa Kỳ coi tiền lãi được trả là CFO trong khi IAS GAAP coi tiền lãi được trả là CFO\nhoặc CFF.\n(Mô-đun 30.3, LOS 30.d)"},{"n":46,"q":"A company prepares its financial statements under International Financial Reporting\nStandards. The company's cash flow statement will classify interest paid as either an:","opts":["operating or financing cash flow.","investing or financing cash flow.","operating or investing cash flow."],"ans":"A","expl":"IFRS cho phép báo cáo tiền lãi đã trả trong phần hoạt động hoặc phần tài chính của\nbáo cáo lưu chuyển tiền tệ. GAAP của Hoa Kỳ yêu cầu phải báo cáo tiền lãi đã trả trong phần\nhoạt động của báo cáo lưu chuyển tiền tệ.\n(Mô-đun 30.3, LOS 30.d)"},{"n":47,"q":"According to U.S. Generally Accepted Accounting Principles (GAAP) and International\nAccounting Standards (IAS) GAAP, should dividends paid be treated as a cash flow from\nfinancing (CFF) or as a cash flow from operations (CFO)?\nU.S. GAAPIAS GAAP","opts":["CFF or CFOCFO","CFOCFF","CFFCFF or CFO"],"ans":"C","expl":"Hoa Kỳ GAAP coi cổ tức được trả là CFF trong khi IAS GAAP coi cổ tức được trả là\nCFO hoặc CFF.\n(Mô-đun 30.3, LOS 30.d)"},{"n":48,"q":"An analyst has gathered the following information about a company that reports under U.S.\nGAAP:\nIncome Statement for the Year\nSales$1,500\nExpenses\nCOGS$1,300\nDepreciation20\nGoodwill10\nInt. Expenses40\nTotal expenses1,370\nIncome from cont. op.130\nGain on sale30\nIncome before tax160\nIncome tax64\nNet Income$96\nAdditional Information:\nDividends paid$30\nCommon stock issued20\nEquipment purchased50\nBonds issued80\nFixed asset sold for(original cost of $100 with accumulated depreciation of $70)60\nAccounts receivable decreased by30\nInventory decreased by20\nAccounts payable increased by20\nWages payable decreased by10\nWhat is the cash flow from financing?","opts":["$110.","$130.","$70."],"ans":"C","expl":"Cổ tức được trả-$30\nCổ phiếu phát hành20\nTrái phiếu phát hành80\nCFF$70\n(Mô-đun 30.3, LOS 30.b)","qhtml":"<p>An analyst has gathered the following information about a company that reports under U.S. GAAP:</p><p><strong>Income Statement for the Year</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>$1,500</td></tr><tr><td>Expenses</td><td></td></tr><tr><td>&nbsp;&nbsp;COGS</td><td>$1,300</td></tr><tr><td>&nbsp;&nbsp;Depreciation</td><td>20</td></tr><tr><td>&nbsp;&nbsp;Goodwill</td><td>10</td></tr><tr><td>&nbsp;&nbsp;Int. Expenses</td><td>40</td></tr><tr><td>&nbsp;&nbsp;Total expenses</td><td>1,370</td></tr><tr><td>Income from cont. op.</td><td>130</td></tr><tr><td>Gain on sale</td><td>30</td></tr><tr><td>Income before tax</td><td>160</td></tr><tr><td>Income tax</td><td>64</td></tr><tr><td>Net Income</td><td>$96</td></tr></tbody></table><p><strong>Additional Information:</strong></p><ul><li>Dividends paid: $30</li><li>Common stock issued: 20</li><li>Equipment purchased: 50</li><li>Bonds issued: 80</li><li>Fixed asset sold for 60 (original cost of $100 with accumulated depreciation of $70)</li><li>Accounts receivable decreased by 30</li><li>Inventory decreased by 20</li><li>Accounts payable increased by 20</li><li>Wages payable decreased by 10</li></ul><p>What is the cash flow from financing?</p>"},{"n":49,"q":"Fricks Ltd. is a gold mining company headquartered in Indonesia with operations throughout\nthe world. Fricks reports under IFRS. When subsidiaries located in the United States and\nCanada pay dividends to the Indonesian parent company, Fricks may classify the dividends\nas:","opts":["cash flow from either investing or operations.","cash flow from financing only.","cash flow from investing only."],"ans":"A","expl":"Theo IFRS, tiền lãi và cổ tức nhận được có thể được hiển thị dưới dạng dòng tiền từ\nhoạt động hoặc dòng tiền từ đầu tư.\n(Module 30.3, LOS 30.d)"},{"n":50,"q":"When using the indirect method for computing cash flow from operating activities, a change\nin accounts payable will require which of the following?","opts":["A negative (positive) adjustment to net income when accounts payable increases (decreases).","A negative adjustment to net income regardless of whether accounts payable increases or decreases.","A positive (negative) adjustment to net income when accounts payable increases (decreases)."],"ans":"C","expl":"Việc giảm các khoản phải trả thể hiện dòng tiền chi ra. Do đó, cần phải điều chỉnh âm\n. Ngược lại, mức tăng thể hiện dòng tiền vào và sự điều chỉnh tích cực.\n(Mô-đun 30.2, LOS 30.b)"},{"n":51,"q":"Mark Industries' income statement and related notes for the year ended December 31 are as\nfollows (in $):\nSales42,000,000\nCost of Goods Sold(32,000,000)\nWages Expense(1,500,000)\nDepreciation Expense(2,500,000)\nInterest Expense(1,000,000)\nIncome Tax Expense(2,000,000)\nNet Income3,000,000\nDuring the year:\nWages Payable increased $100,000.\nAccumulated Depreciation increased $2,500,000.\nInterest Payable decreased $200,000.\nIncome Taxes Payable increased $500,000.\nDividends of $100,000 were declared and paid.\nUnder U.S. GAAP, Mark Industries' cash flow from operations (CFO) for the year ended\nDecember 31 was:","opts":["$4,800,000.","$4,400,000.","$5,900,000."],"ans":"C","expl":"Sử dụng phương pháp gián tiếp, thu nhập ròng được điều chỉnh bằng cách cộng lại khấu hao (chi phí\nkhông dùng tiền mặt) và thay đổi vốn lưu động: tăng tiền lương phải trả và tăng\nthuế thu nhập phải nộp là nguồn tiền mặt và việc giảm lãi phải trả là việc sử dụng\ntiền mặt. Cổ tức được trả là nguồn tài trợ cho dòng tiền theo US GAAP.\nCFO = 3.000.000 USD + 2.500.000 USD + 100.000 USD + 500.000 USD - 200.000 USD = 5.900.000 USD.\n(Học phần 30.2, LOS 30.b)"},{"n":52,"q":"Capital Corp.'s activities in the year 20X5 included the following:\nAt the beginning of the year, Capital purchased a cargo plane from Aviation Partners\nfor $10 million in exchange for $2 million cash, $3 million in Capital Corp. bonds and\n$5 million in Capital Corp. preferred stock.\nInterest of $150,000 was paid on the bonds, and dividends of $250,000 were paid on\nthe preferred stock.\nAt the end of the year, the cargo plane was sold for $12,000,000 cash to Standard\nCompany. Proceeds from the sale were used to pay off the $3 million in bonds held by\nAviation Partners.\nOn Capital Corp.'s U.S. GAAP statement of cash flows for the year ended December 31, 20X5,\ncash flow from investments (CFI) related to the above activities is:","opts":["$6,750,000.","$9,750,000.","$10,000,000."],"ans":"C","expl":"Đầu tư 2 triệu USD tiền mặt được dùng để mua máy bay chở hàng. Tiền thu được từ việc bán\nmáy bay là nguồn tiền mặt đầu tư trị giá 12 triệu USD. CFI ròng là 12 triệu USD − 2\nmillion = 10 triệu USD. Theo GAAP của Hoa Kỳ, khoản thanh toán lãi được bao gồm bằng tiền mặt từ\nhoạt động (CFO) và thanh toán cổ tức bằng tiền mặt từ hoạt động tài chính (CFF). Việc mua lại\ntrái phiếu là việc sử dụng tiền mặt từ hoạt động tài chính (CFF).\n(Mô-đun 30.3, LOS 30.b)"},{"n":53,"q":"Eagle Company's financial statements for the year ended December 31, 20X5 were as follows\n(in $ millions):\nIncome Statement\nSales150\nCost of Goods Sold(48)\nWages Expense(56)\nInterest Expense(12)\nDepreciation(22)\nGain on Sale of Equipment6\nIncome Tax Expense( 8)\nNet Income10\nBalance Sheet\n12-31-X412-31-X5\nCash3252\nAccounts Receivable1822\nInventory4644\nProperty, Plant & Equip. (net)182160\nTotal Assets278278\nAccounts Payable2833\nLong-term Debt145135\nCommon Stock7070\nRetained Earnings3540\nTotal Liabilities & Equity278278\nCash flow from operations (CFO) for Eagle Company for the year ended December 31, 20X5\nwas (in $ millions).","opts":["$29.","$37.","$41."],"ans":"A","expl":"Sử dụng phương pháp gián tiếp:\nThêm: Thu nhập ròng$10\nThêm: Chi phí khấu hao22\nÍt hơn: Lợi nhuận từ việc bán thiết bị.(6)\nÍt: Tăng các khoản phải thu(4)\nThêm: Giảm hàng tồn kho2\nThêm: Tăng các tài khoản phải trả5\nDòng tiền từ hoạt động (CFO)29\n(Module 30.2, LOS 30.b)","qhtml":"<p>Eagle Company's financial statements for the year ended December 31, 20X5 were as follows (in $ millions):</p><p><strong>Income Statement</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>150</td></tr><tr><td>Cost of Goods Sold</td><td>(48)</td></tr><tr><td>Wages Expense</td><td>(56)</td></tr><tr><td>Interest Expense</td><td>(12)</td></tr><tr><td>Depreciation</td><td>(22)</td></tr><tr><td>Gain on Sale of Equipment</td><td>6</td></tr><tr><td>Income Tax Expense</td><td>(8)</td></tr><tr><td>Net Income</td><td>10</td></tr></tbody></table><p><strong>Balance Sheet</strong></p><table class=\"qtable\"><thead><tr><th></th><th>12-31-X4</th><th>12-31-X5</th></tr></thead><tbody><tr><td>Cash</td><td>32</td><td>52</td></tr><tr><td>Accounts Receivable</td><td>18</td><td>22</td></tr><tr><td>Inventory</td><td>46</td><td>44</td></tr><tr><td>Property, Plant &amp; Equip. (net)</td><td>182</td><td>160</td></tr><tr><td>Total Assets</td><td>278</td><td>278</td></tr><tr><td>Accounts Payable</td><td>28</td><td>33</td></tr><tr><td>Long-term Debt</td><td>145</td><td>135</td></tr><tr><td>Common Stock</td><td>70</td><td>70</td></tr><tr><td>Retained Earnings</td><td>35</td><td>40</td></tr><tr><td>Total Liabilities &amp; Equity</td><td>278</td><td>278</td></tr></tbody></table><p>Cash flow from operations (CFO) for Eagle Company for the year ended December 31, 20X5 was (in $ millions).</p>"}];
const CFG = {"title": "Analyzing Statements of Cash Flows I", "subtitle": "CFA · Financial Statement Analysis · Reading 30 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    if(q.cols){
      const ch = document.createElement("div");
      ch.className = "q-cols-header";
      q.cols.forEach(h=>{
        const sp = document.createElement("span"); sp.textContent = h;
        ch.appendChild(sp);
      });
      card.appendChild(ch);
    }

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      if(q.cols && t.includes(" | ")){
        b.dataset.cols = "2";
        t.split(" | ").forEach(p=>{
          const sp = document.createElement("span"); sp.className = "opt-col"; sp.textContent = p;
          b.appendChild(sp);
        });
      } else {
        b.appendChild(document.createTextNode(t));
      }
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
