<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
</style>
</head>
<body>
<header>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "How will a firm's operating cash flow be affected by a decrease in accounts receivable and by\nan increase in accounts payable?", "opts": ["One will increase operating cash flow and one will decrease operating cash flow.", "Both will increase operating cash flow.", "Both will decrease operating cash flow."], "ans": "B", "expl": "A decrease in the accounts receivable amount on the balance sheet indicates that cash\ncollections exceed revenues (sales). This increases operating cash flow because\nreceivables are being collected. An increase in the accounts payable amount on the\nbalance sheet indicates that purchases from suppliers exceed cash payments. This\nincreases operating cash flow because the cash was not used to pay the suppliers.\n(Module 30.1, LOS 30.b)"}, {"n": 2, "q": "What is the impact on accounts receivable if sales exceed cash collections and what is the\nimpact on accounts payable if cash paid to suppliers exceeds purchases?", "opts": ["Only accounts receivable will increase.", "Both accounts payable and accounts receivable will increase.", "Only accounts payable will increase."], "ans": "A", "expl": "If a firm sells more than it collects, accounts receivable will increase. If a firm pays\nsuppliers more than it purchases, accounts payable will decrease.\n(Module 30.1, LOS 30.b)"}, {"n": 3, "q": "Convenience Travel Corp.'s financial information for the year ended December 31, 20X4\nincluded the following:\nProperty Plant & Equipment$15,000,000\nAccumulated Depreciation9,000,000\nThe only asset owned by Convenience Travel in 20X5 was a corporate jet airplane. The\nairplane was being depreciated over a 15-year period on a straight-line basis at a rate of\n$1,000,000 per year. On December 31, 20X5 Convenience Travel sold the airplane for\n$10,000,000 cash. Net income for the year ended December 31, 20X5 was $12,000,000.\nBased on the above information, and ignoring taxes, what is cash flow from operations (CFO)\nfor Convenience Travel for the year ended December 31, 20X5?", "opts": ["$8,000,000.", "$11,000,000.", "$13,000,000."], "ans": "A", "expl": "Using the indirect method, CFO is net income increased by 20X5 depreciation ($1,000,000)\nand decreased by the gain recognized on the sale of the plane [$10,000,000 sale price −\n($15,000,000 original cost − $10,000,000 accumulated depreciation including 20X5) =\n$5,000,000]. $12,000,000 + $1,000,000 − $5,000,000 = $8,000,000.\n(Module 30.2, LOS 30.b)"}, {"n": 4, "q": "Which of the following is most accurate about the consideration of depreciation in the\noperations section of a cash flow statement?", "opts": ["Direct Method: Considers  |  Indirect Method: Considers", "Direct Method: Does not consider  |  Indirect Method: Considers", "Direct Method: Does not consider  |  Indirect Method: Does not consider"], "ans": "B", "expl": "The indirect method must add back depreciation expense because the starting point is net\nincome. Since the direct method does not begin with net income it does not need to\nconsider non-cash expenses such as depreciation.\n(Module 30.2, LOS 30.b)"}, {"n": 5, "q": "Murray Company reported the following revenues and expenses for the year ended 2007:\nSales revenue$200,000\nWage expense89,000\nInsurance expense17,000\nInterest expense10,400\nDepreciation expense50,000\nFollowing are the related balance sheet accounts:\n20072006\nUnearned revenue$15,600$13,200\nWages payable5,4006,600\nPrepaid insurance1,2000\nInterest payable5001,600\nAccumulated depreciation95,00045,000\nCalculate cash collections and cash expenses.\nCash collectionsCash expenses", "opts": ["$202,400$119,900", "$197,600$119,900", "$202,400$58,100"], "ans": "A", "expl": "Cash collections are $202,400 ($200,000 sales + $2,400 increase in unearned revenue).\nCash expenses are $119,900 (–$89,000 wages expense – $1,200 decrease in wages payable\n– $17,000 insurance expense – $1,200 increase in prepaid insurance – $10,400 interest\nexpense – $1,100 decrease in interest payable). Depreciation expense is a non-cash\nexpense.\n(Module 30.1, LOS 30.b)"}, {"n": 6, "q": "To convert an indirect statement of cash flows to a direct basis, the analyst would:", "opts": ["increase cost of goods sold by any depreciation that was included.", "reduce cost of goods sold by any decreases in accounts payable.", "reduce cost of goods sold by any decreases in inventory."], "ans": "C", "expl": "Decreases in inventory represent a source of cash so these would be subtracted from cost\nof goods sold. Any depreciation and/or amortization included in the cost of goods sold\ndoes not represent an actual use of cash, so this amount should be subtracted from cost\nof goods sold. Decreases in accounts payable represent a use of cash so these should be\nadded to cost of goods sold.\n(Module 30.3, LOS 30.c)"}, {"n": 7, "q": "Assuming, US GAAP is applied, determine the cash flow from financing given the following\ntable.\nItemAmount\nCash payment of dividends$30\nSale of equipment$10\nNet income$25\nPurchase of land$15\nIncrease in accounts payable$20\nSale of preferred stock$25\nIncrease in deferred taxes$5\nProfit on sale of equipment$4", "opts": ["-$5.", "$15.", "$20."], "ans": "A", "expl": "CFF = 25(Sale of Stock) − 30(Div Paid) = -$5\n(Module 30.3, LOS 30.b)"}, {"n": 8, "q": "Darth Corporation's net income was $1,200 in the most recent period. Its depreciation\nexpense was $800 and its accounts receivable increased by $1,000. Based only on this\ninformation, cash flow from operating activities reported by Darth should be:", "opts": ["$1,200.", "$1,000.", "$2,200."], "ans": "B", "expl": "Adjustments to reconcile net income to cash flow from operating activities will require that\ndepreciation ($800) be added back, and the increase in accounts receivable ($1,000) be\nsubtracted: $1,200 + 800 – 1,000 = $1,000.\n(Module 30.2, LOS 30.b)"}, {"n": 9, "q": "Pacific, Inc.'s financial information includes the following, with \"change\" referring to the\ndifference from the prior year (in $ millions):\nNet Income27\nChange in Accounts Receivable+4\nChange in Accounts Payable+1\nChange in Inventory+5\nLoss on sale of equipment-8\nGain on sale of real estate+4\nChange in Retained Earnings+21\nDividends declared and paid+4\nPacific, Inc.'s cash flow from operations (CFO) in millions was:", "opts": ["$15.", "$23.", "$27."], "ans": "B", "expl": "Using the indirect method, cash flow from operations is net income less increase in\naccounts receivable, plus increase in accounts payable, less increase in inventory, plus loss\non sale of equipment, less gain on sale of real estate. 27 – 4 + 1 – 5 + 8 – 4 = $23 million.\n(Module 30.2, LOS 30.b)"}, {"n": 10, "q": "An analyst contemplates using the indirect method to create the projected statement of cash\nflows. She decides to research the differences between the direct and indirect methods.\nWhich of the following is least likely a component of the statement of cash flows under the\ndirect method?", "opts": ["Net income.", "Payment of dividends.", "Investment in Property, Plant, & Equipment."], "ans": "A", "expl": "Property, Plant, & Equipment and payment of dividends are components of the statement\nof cash flows under both the direct and indirect methods. Net income is the first figure\nunder the indirect method, but it is not a part of the statement of cash flows under the\ndirect method. The correct response is net income.\n(Module 30.1, LOS 30.b)"}, {"n": 11, "q": "Which balance sheet accounts are most closely related to the operating activities on a firm's\ncash flow statement?", "opts": ["Equity and non-current liabilities.", "Non-current assets.", "Working capital."], "ans": "C", "expl": "Typically, operating activities on the cash flow statement are most closely related to the\nworking capital accounts (current assets and current liabilities) on the balance sheet.\nInvesting activities are typically related to non-current assets. Financing activities are\ntypically related to non-current liabilities for transactions with creditors, or equity for\ntransactions with shareholders.\n(Module 30.1, LOS 30.a)"}, {"n": 12, "q": "To convert an indirect statement of cash flows to a direct basis, the analyst would:", "opts": ["add decreases in accounts receivables to net sales.", "subtract increases in inventory from cost of goods sold.", "add increases in accounts payable to cost of goods sold."], "ans": "A", "expl": "A decrease in accounts receivable represents an increase in cash so this should be added\nto sales. Increases in accounts payable represent an increase in cash so these should be\nsubtracted from cost of goods sold. Increases in inventory represent a use of cash so\nthese would be added to cost of goods sold.\n(Module 30.3, LOS 30.c)"}, {"n": 13, "q": "A firm has net sales of $3,500, earnings after taxes (EAT) of $1,000, depreciation expense of\n$500, cost of goods sold (COGS) of $1,500, and cash taxes of $500. Also, inventory decreased\nby $100, and accounts receivable increased by $300. What is the firm's cash flow from\noperations?", "opts": ["$1,200.", "$1,300.", "$1,800."], "ans": "B", "expl": "Indirect Method\nEAT+1,000\nDepreciation+500\nChange in Inv.+ 100 a source\nChange in Accts. Rec.(300) a use\nCFO1,300\nDirect Method\nNet Sales+3,500\nChange in Accts. Rec.(300) a use\nCOGS(1,500)\nCash Taxes(500)\nChange in Inv.+100 a source\nCFO1,300\n(Module 30.1, LOS 30.b)"}, {"n": 14, "q": "What is the difference between the direct and the indirect method of calculating cash flow\nfrom operations?", "opts": ["Balance sheet items are not included in the cash flow from operations for the direct method, while they are included for the indirect method.", "The direct method starts with sales and follows cash as it flows through the income statement, while the indirect method starts with net income and adjusts for non- cash charges and other items.", "The indirect method starts with gross income and adjusts to cash flow from operations, while the direct method starts with gross profit and flows through the income statement to calculate cash flows from operations."], "ans": "B", "expl": "The main difference between the direct and indirect methods of calculating cash flows is\nthe way that cash flow from operations is calculated. The direct method starts with sales\nand follows cash as it flows through the income statement, while the indirect method\nstarts with income after taxes and adjusts backwards for non-cash and other items. Both\nmethods will have the same result for operating cash flows. The direct and indirect\nmethod calculates the financing and investing cash flows the same way and both methods\nwill result in the same cash flow figure.\n(Module 30.3, LOS 30.d)"}, {"n": 15, "q": "Determine the cash flow from investing given the following table:\nItemAmount\nCash payment of dividends$30\nSale of equipment$25\nNet income$25\nPurchase of land$15\nIncrease in accounts payable$20\nSale of preferred stock$25\nIncrease in deferred taxes$5", "opts": ["-$5.", "$10.", "-$10."], "ans": "B", "expl": "ItemAmount\nCash payment of dividendsCFF-$30\nSale of equipmentCFI+$25\nNet incomeCFO+$25\nPurchase of landCFI-$15\nIncrease in accounts payableCFO+$20\nSale of preferred stockCFF+$25\nIncrease in deferred taxesCFO+$5\nCFI = Sale of Equipment (+25) + Purchase of Land (–15) = $10.\n(Module 30.3, LOS 30.b)"}, {"n": 16, "q": "Favor, Inc.'s capital and related transactions during 20X5 were as follows:\nOn January 1, $1,000,000 of 5-year 10% annual interest bonds were issued to Cover\nIndustries in exchange for old equipment owned by Cover.\nOn June 30, Favor paid $50,000 of interest to Cover.\nOn July 1, Cover returned the bonds to Favor in exchange for $1,500,000 par value 6%\npreferred stock.\nOn December 31, Favor paid preferred stock dividends of $45,000 to Cover.\nFavor, Inc.'s cash flow from financing (CFF) for 20X5 (assume U.S. GAAP) is:", "opts": ["–$1,045,000.", "–$45,000.", "–$95,000."], "ans": "B", "expl": "Only the preferred stock dividends paid would be considered CFF. Issuing bonds in\nexchange for equipment and exchanging bonds for stock are both noncash transactions\nthat should be disclosed in a footnote to the Statement of Cash Flows. Interest paid is an\noperating cash flow under U.S. GAAP.\n(Module 30.3, LOS 30.b)"}, {"n": 17, "q": "The following information is from the balance sheet of Silverstone Company:\nNet Income for 5/1/20X5 to 5/31/20X5: $8,000\nBalance 5/01/20X5AccountBalance 5/31/20X5\n$2,000Inventory$1,750\n$1,200Prepaid exp.$1,700\n$800Accum. Depr.$975\n$425Accounts payable$625\n$650Bonds payable$550\nUsing the indirect method, calculate the cash flow from operations for Silverstone Company\nas of 5/31/20X5:", "opts": ["Increase in cash of $7,725.", "Increase in cash of $8,125.", "Increase in cash of $8,025."], "ans": "B", "expl": "Silverstone Company's cash flow from operations would be calculated as +Net Income\n$8,000 + Inventory $250 - Prepaid exp. $500 + Depreciation $175 + A/P $200 = $8,125.\nBonds payable is a financing activity and would not be included in the cash flow from\noperations. The indirect method takes the change in the non-cash accounts and decreases\nor increases net income to get to the change in cash flow.\n(Module 30.2, LOS 30.b)"}, {"n": 18, "q": "An analyst contemplates using the indirect methods to create the projected statement of\ncash flows. She decides to research the differences between the direct and indirect\nmethods. Which of the following statements is most accurate? Under the:", "opts": ["direct method, depreciation must be added to cash collections because it is a non- cash expense.", "indirect method, changes in accounts receivable are already included in the net income figure.", "indirect method, depreciation must be added to net income, because it is a non- cash expense."], "ans": "C", "expl": "The indirect method begins with net income, which has already included all cash and non-\ncash expenses. Therefore, under the indirect method, depreciation must be added to net\nincome, because it is a non-cash expense.\n(Module 30.2, LOS 30.b)"}, {"n": 19, "q": "Use the following information to calculate cash flows from operations using the indirect\nmethod.\nNet Income: $12,000\nDepreciation Expense: $1,000\nLoss on sale of machinery: $500\nIncrease in Accounts Receivable: $2,000\nDecrease in Accounts Payable: $1,500\nIncrease in Income taxes payable: $500\nRepayment of Bonds: $3,000", "opts": ["Increase in cash of $10,500.", "Increase in cash of $7,500.", "Increase in cash of $9,500."], "ans": "A", "expl": "Cash flow from operations would be calculated as +Net Income $12,000 + Depreciation\n$1,000 + Loss on sale of machinery $500 − A/R $2,000 − A/P $1,500 + Income taxes payable\n$500 = $10,500.\nRepayment of Bonds is a financing activity and would not be included with operating\nactivities. Depreciation is not a cash flow activity and is therefore always added back to net\nincome to calculate CFO. The loss on the sale of machinery is not a cash outflow so it is\nalso added back to calculate CFO. Accounts receivable is subtracted when there is an\nincrease as this increases net income but does not affect cash.\n(Module 30.2, LOS 30.b)"}, {"n": 20, "q": "Juniper Corp. has the following transactions in 20X5.\nJuniper's equipment with a book value of $55,000 was sold for $85,000 cash.\nA parcel of land was purchased for $100,000 worth of Juniper common stock.\nABC company paid Juniper preferred dividends of $40,000.\nJuniper declared and paid a $100,000 cash dividend.\nUnder U.S. GAAP, what is cash flow from financing (CFF) for Juniper for 20X5?", "opts": ["–$100,000.", "–$115,000.", "–$60,000."], "ans": "A", "expl": "The only item involving cash flow from financing (CFF) was the payment of a cash dividend\nby Juniper. The sale of equipment affects cash flow from investing (CFI), the purchase of\nland has no effect on cash, and the preferred dividends received are cash flow from\noperations under U.S. GAAP.\n(Module 30.3, LOS 30.b)"}, {"n": 21, "q": "To compute cash collections from customers when converting a statement of cash flows\nfrom the indirect to the direct method, an analyst begins with:", "opts": ["net income and adds back non-cash expenses.", "sales, subtracts any increase in accounts receivable, and adds any increase in unearned revenue.", "cost of goods sold, subtracts any increase in accounts payable, adds any increase in inventory, and subtracts any inventory write-offs."], "ans": "B", "expl": "To compute cash collections from customers, begin with net sales from the income\nstatement, subtract (add) any increase (decrease) in accounts receivable, and add\n(subtract) any increase (decrease) in unearned revenue. (Module 30.3, LOS 30.c)"}, {"n": 22, "q": "Which set of accounting standards allows a firm to classify interest received as a financing\ncash flow and interest paid as an investing cash flow on its cash flow statement?", "opts": ["Neither the IFRS nor U.S. GAAP.", "The IFRS only.", "U.S. GAAP only."], "ans": "A", "expl": "The IFRS allows a firm to classify interest received as either operating or investing cash\nflow and to classify interest paid as either operating or financing cash flow. U.S. GAAP\nrequires that interest received and paid both be classified as operating cash flows.\n(Module 30.3, LOS 30.d)"}, {"n": 23, "q": "In converting a statement of cash flows from the indirect to the direct method, which of the\nfollowing adjustments should be made for a decrease in unearned revenue when calculating\ncash collected from customers, and for an inventory writedown (when market value is less\nthan cost) when calculating cash payments to suppliers?", "opts": ["Cash collections from customers: Add decrease in unearned revenue  |  Cash payments to suppliers: Subtract an inventory writedown", "Cash collections from customers: Subtract decrease in unearned revenue  |  Cash payments to suppliers: Add an inventory writedown", "Cash collections from customers: Subtract decrease in unearned revenue  |  Cash payments to suppliers: Subtract an inventory writedown"], "ans": "C", "expl": "Beginning with net sales, calculating cash collected from customers requires the addition\n(subtraction) of any increase (decrease) in unearned revenue. Cash advances from\ncustomers represent unearned revenue and are not included in net sales, so any advances\nmust be added to net sales in order to calculate cash collected.\nAn inventory writedown, as a result of applying the lower of cost or market rule, will\nreduce ending inventory and increase COGS for the period. However, no cash flow is\nassociated with the writedown, so COGS is reduced by the amount of the writedown in\ncalculating cash paid to suppliers.\n(Module 30.3, LOS 30.c)"}, {"n": 24, "q": "A company's financial statement data for the most recent year include the following:\nNet income $100\nDepreciation expense 25\nPurchase of machine 50\nSale of company trucks 30\nSale of common stock 45\nDecrease in accounts receivable 10\nIncrease in inventory 20\nIssuance of bonds 25\nIncrease in accounts payable 15\nIncrease in wages payable 10\nBased only on these items, cash flow from financing activities is closest to:", "opts": ["$140.", "$85.", "$70."], "ans": "C", "expl": "Sale of common stock45\nIssuance of bonds25\nFinancing cash flows$70\n(Module 30.3, LOS 30.b)"}, {"n": 25, "q": "Selected information from Rockway, Inc.'s U.S. GAAP financial statements for the year ended\nDecember 31, included the following (in $):\n20042005\nSales17,000,00021,000,000\nCost of Goods Sold11,000,00015,000,000\nInterest Paid800,0001,000,000\nCurrent Income Taxes Paid700,0001,000,000\nAccounts Receivable3,000,0002,500,000\nInventory2,400,0003,000,000\nProperty, Plant & Equip.2,000,00016,000,000\nAccounts Payable1,000,0001,400,000\nLong-term Debt8,000,0009,000,000\nCommon Stock4,000,0005,000,000\nUsing the direct method, cash provided or used by operating activities(CFO) in the year 2005\nwas:", "opts": ["$5,300,000.", "$6,300,000.", "$4,300,000."], "ans": "C", "expl": "Cash provided or used by operating activities under the direct method is computed by\nadding cash inflows and subtracting cash inputs and cash outflows. Operating Cash\ninflows for Rockway Inc. for 2005 came from sales ($21,000,000) and decrease in accounts\nreceivable ($3,000,000 − $2,500,000 = $500,000) for net cash inflows of ($21,000,000 +\n$500,000 =) $21,500,000. Operating cash inputs were cost of goods sold ($15,000,000),\nplus the increase in inventory ($3,000,000 − $2,400,000 = $600,000) less the increase in\naccounts payable, (which is a source of funds) ($1,000,000 − $1,400,000 = -$400,000) for\nnet cash inputs of ($15,000,000 + $600,000 - $400,000 =) $15,200,000. Other operating\ncash outflows were interest paid ($1,000,000) and current income taxes paid ($1,000,000)\ntotaling ($2,000,000). Cash provided by operations was ($21,500,000 − $15,200,000 −\n$2,000,000 =) $4,300,000. Changes in property, plant and equipment, long-term debt and\ncommon stock do not affect cash from operations.\n(Module 30.1, LOS 30.b)"}, {"n": 26, "q": "When calculating cash flow from operations (CFO) using the indirect method which of the\nfollowing is most accurate?", "opts": ["The indirect method requires an additional schedule to reconcile net income to cash flow.", "When recognizing a gain on the sale of fixed assets, the amount is a deduction to operating cash flows.", "In using the indirect method, each item on the income statement is converted to its cash equivalent."], "ans": "B", "expl": "When recognizing a gain on the sale of fixed assets, the amount is a deduction to\noperating cash flows. This is because the gain would be double counted in the investing\nsection and in net income. Therefore, the gain must be removed from net income. The\ndirect method of cash flow calculation converts the income statement items to their cash\nequivalents, not the indirect method. Also, depreciation is added to net income in order to\ncalculate CFO using the indirect method.\n(Module 30.2, LOS 30.b)"}, {"n": 27, "q": "Noncurrent assets on the balance sheet are most closely linked to which part of the cash\nflow statement?", "opts": ["Financing cash flows.", "Investing cash flows.", "Operating cash flows."], "ans": "B", "expl": "Investing cash flows are most closely linked with a firm's noncurrent assets. For example,\npurchases and sales of property, plant, and equipment are classified as investing cash\nflows.\n(Module 30.1, LOS 30.a)"}, {"n": 28, "q": "Given the following information, what is the adjustment to net income when calculating cash\nflow from operations using the indirect method?\nIncrease in accounts payable of $25.\nSold one share of stock for $15.\nPaid dividends of $10 to shareholders.\nDepreciation expense of $100.\nIncrease in inventory of $20.", "opts": ["-$50.", "+$105.", "-$95."], "ans": "B", "expl": "Using the indirect method, the increase in accounts payable is a source of cash from\noperations (+25), depreciation expense is a non-cash expense added back in computing\ncash from operations (+100), and increase in inventory is a use of cash from operations\n(-20) = 25 + 100 - 20 = 105. The sale of stock and the dividends paid are financing cash\nflows that are not included in net income, so they do not require adjustment when\ncalculating CFO.\n(Module 30.2, LOS 30.b)"}, {"n": 29, "q": "The Beeline Company has the following balance sheet and income statement.\nBeeline Company Balance Sheet\nAs of December 31, 20X4\n2003200420032004\nCash$50$60Accounts payable$100$150\nAccounts receivable100110Long-term debt400300\nInventory200180Common stock5050\nRetained earnings400500\nFixed assets (gross)800900Total liabilities and equity$950$1,000\nLess: Accumulated depreciation200250\nFixed assets (net)600650\nTotal assets$950$1,000\nBeeline Company Income Statement\nFor year ended December 31, 20X4\nSales$1,000\nLess:\nCOGS600\nDepreciation50\nSelling, general, and administrative expenses160\nInterest expense23\nIncome before taxes$167\nLess tax67\nNet income$100\nThe cash flow from operations for 2004 is:", "opts": ["$150.", "$260.", "$210."], "ans": "C", "expl": "Cash flow from operations (CFO) calculated using the indirect method is: net income (100)\n+ depreciation (50) – increase in accounts receivable (10) + decrease in inventory (20) +\nincrease in accounts payable (50) = $210.\n(Module 30.2, LOS 30.b)"}, {"n": 30, "q": "An analyst compiled the following information for Universe, Inc. for the year ended\nDecember 31, 20X4:\nNet income was $850,000.\nDepreciation expense was $200,000.\nCommon stock was sold for $100,000.\nPreferred stock (eight percent annual dividend) was sold at par value of $125,000.\nCommon stock dividends of $25,000 were paid.\nPreferred stock dividends of $10,000 were paid.\nEquipment with a book value of $50,000 was sold for $100,000.\nUsing the indirect method and assuming U.S. GAAP, what was Universe Inc.'s cash flow from\noperations (CFO) for the year ended December 31, 20X4?", "opts": ["$1,000,000.", "$1,015,000.", "$1,050,000."], "ans": "A", "expl": "Cash flow from operations (CFO) using the indirect method is computed by taking net\nincome plus non-cash expenses (i.e. depreciation) less gains from the equipment sale.\nNote that cash flow from operations must be adjusted downward for the amount of the\ngain on the sale of the equipment. Cash flow from operations is ($850,000 + $200,000 –\n($100,000 – $50,000)) = $1,000,000. The other information relates to financing cash flows.\n(Module 30.2, LOS 30.b)"}, {"n": 31, "q": "An analyst has gathered the following information about a company:\nIncome Statement for the Year 20X4\nSales$1,500\nExpenses\nCOGS$1,300\nDepreciation30\nInt. Expenses40\nTotal expenses1,370\nIncome from cont. op.130\nGain on sale30\nIncome before tax160\nIncome tax64\nNet Income$96\nAdditional Information:\nDividends paid$30\nCommon stock sold20\nEquipment purchased50\nBonds issued80\nFixed asset sold for (original cost of $100 with accumulated depreciation of $70)60\nAccounts receivable decreased by30\nInventory decreased by20\nAccounts payable increased by20\nWages payable decreased by10\nWhat is the cash flow from operations?", "opts": ["$156.", "$150.", "$170."], "ans": "A", "expl": "Net Income+$96\nDepreciation+30\nGain on sale of asset-30\nAccts. Rec.+30\nInventory+20\nAccts. Payable+20\nWages Payable-10\n CFO+$156\n(Module 30.2, LOS 30.b)"}, {"n": 32, "q": "Financial information for Jefferson Corp. for the year ended December 31st, was as follows:\nSales$3,000,000\nPurchases1,800,000\nInventory at Beginning500,000\nInventory at Ending800,000\nAccounts Receivable at Beginning300,000\nAccounts Receivable at Ending200,000\nAccounts Payable at Beginning100,000\nAccounts Payable at Ending100,000\nOther Operating Expenses Paid400,000\nBased upon this data and using the direct method, what was Jefferson Corp.'s cash flow\nfrom operations (CFO) for the year ended December 31st?", "opts": ["$800,000.", "$1,200,000.", "$900,000."], "ans": "C", "expl": "CFO = sales $3,000,000 – change in accounts receivable ($200,000 – $300,000) – purchases\n$1,800,000 – other cash operating expenses $400,000 = $900,000.\nNote that no adjustment for inventories is necessary because purchases are given. From\nthe inventory equation, P = COGS + EI - BI.\n(Module 30.1, LOS 30.b)"}, {"n": 33, "q": "Under IFRS, which cash flow statement classifications for dividends paid and interest\nreceived, respectively, are least likely permitted?", "opts": ["Dividends paid: Operating activity  |  Interest received: Investing activity", "Dividends paid: Financing activity  |  Interest received: Operating activity", "Dividends paid: Investing activity  |  Interest received: Financing activity"], "ans": "C", "expl": "Under IFRS, interest received may be classified as CFO or CFI, while dividends paid may be\nclassified as CFO or CFF. (Module 30.3, LOS 30.d)"}, {"n": 34, "q": "A U.S. GAAP reporting company has the following changes in its balance sheet accounts:\nNet Sales$500\nAn increase in accounts receivable20\nA decrease in accounts payable40\nAn increase in inventory30\nSale of common stock100\nRepayment of debt10\nDepreciation2\nNet Income100\nInterest expense on debt5\nThe company's cash flow from financing is:", "opts": ["-$10.", "$90.", "$100."], "ans": "B", "expl": "Sale of common stock$100\nRepayment of debt(10)\nFinancing cash flows$ 90\n(Module 30.3, LOS 30.b)"}, {"n": 35, "q": "Which of the following statements regarding depreciation expense in the cash flow\nstatements is most accurate? Depreciation is added back to net income when determining\nCFO using:", "opts": ["either the direct or indirect methods.", "the direct method.", "the indirect method."], "ans": "C", "expl": "Depreciation is a non-cash expense. Only in the indirect method is depreciation added\nback to net income when determining CFO because net income is only used in the indirect\nmethod and not the direct method. The direct method instead starts with cash sales and\nworks down the income statement.\n(Module 30.2, LOS 30.b)"}, {"n": 36, "q": "The net income for Miller Bat Company was $3 million for the year ended December 31,\n20X4. Additional information is as follows:\nDepreciation on fixed assets: $1,500,000\nGain from cash sales of land: 200,000\nIncrease in accounts payable: 300,000\nDividends paid on preferred stock: 400,000\nUnder U.S. GAAP, the net cash provided by operating activities in the statement of cash flows\nfor the year ended December 31, 20X4 is:", "opts": ["$4,200,000.", "$4,500,000.", "$4,600,000."], "ans": "C", "expl": "$3,000,000 + $1,500,000 – $200,000 + $300,000 = $4,600,000.\n(Module 30.2, LOS 30.b)"}, {"n": 37, "q": "Impala Corporation reported the following financial information:\n20062007\nBalance sheet values as of December 31:\nPrepaid insurance$650,000$475,000\nInterest payable250,000300,000\nCash flows for the year ended December 31:\nInsurance premiums paid$845,000$750,000\nInterest paid900,000900,000\nCalculate Impala's insurance expense and interest expense for the year ended December 31,\n2007.\nInsurance expenseInterest expense", "opts": ["$925,000$850,000", "$925,000$950,000", "$1,020,000$950,000"], "ans": "B", "expl": "Cash paid for insurance = insurance expense + change in prepaid insurance, so insurance\nexpense = cash paid for insurance – change in prepaid insurance. Insurance expense for\n2007 is equal to $925,000 [($750,000 cash paid for insurance – (–$175,000)]. Interest\nexpense for 2007 is equal to $950,000 ($900,000 cash interest paid + $50,000 increase in\ninterest payable).\n(Module 30.1, LOS 30.b)"}, {"n": 38, "q": "Use the following financial data for Moose Printing Corporation, a U.S. GAAP reporting firm,\nto calculate the cash flow from operations (CFO) using the indirect method.\nNet income: $225\nIncrease in accounts receivable: $55\nDecrease in inventory: $33\nDepreciation: $65\nDecrease in accounts payable: $25\nIncrease in wages payable: $15\nDecrease in deferred taxes: $10\nPurchase of new equipment: $65\nDividends paid: $75", "opts": ["Increase in cash of $248.", "Increase in cash of $183.", "Increase in cash of $173."], "ans": "A", "expl": "CFO for Moose Printing Corporation is calculated as follows:\n+Net Income $225 − A/R $55 + Inventory $33 + Depreciation $65 − A/P $25 +\nWages Payable $15 − Deferred taxes $10 = $248.\nThe purchase of new equipment is an investing activity and therefore is not included in\nCFO. Dividends paid is a financing activity and is not included in CFO.\n(Module 30.2, LOS 30.b)"}, {"n": 39, "q": "To calculate cash received from customers, an analyst would most appropriately:", "opts": ["add the change in accounts receivable to credit sales.", "subtract accounts receivable from gross sales.", "subtract the change in accounts receivable from net sales."], "ans": "C", "expl": "Cash received from customers is most appropriately calculated by subtracting the change\nin accounts receivable from net sales.\n(Module 30.1, LOS 30.a)"}, {"n": 40, "q": "Maverick Company reported the following financial information for 2007:\nin millions\nBeginning accounts receivable$180\nEnding accounts receivable225\nSales11,000\nBeginning inventory2,000\nEnding inventory2,300\nPurchases8,100\nBeginning accounts payable1,600\nEnding accounts payable1,200\nCalculate Maverick's cost of goods sold and cash paid to suppliers for 2007.\nCost of goods soldCash paid to suppliers", "opts": ["$7,800 million$8,500 million", "$7,800 million$7,100 million", "$3,800 million$8,500 million"], "ans": "A", "expl": "Cost of goods sold is equal to $7,800 million ($2,000 million beginning inventory + $8,100\nmillion purchases – $2,300 million ending inventory). Cash paid to suppliers is equal to\n$8,500 million (–$7,800 COGS – $300 million increase in inventory – $400 million decrease\nin accounts payable). Alternate solution: Cash paid to suppliers is equal to $8,500 million (–\n$8,100 million purchases – $400 decrease in accounts payable).\n(Module 30.1, LOS 30.b)"}, {"n": 41, "q": "Galaxy, Inc.'s U.S. GAAP balance sheet as of December 31, 20X4 included the following\ninformation (in $):\n12-31-X312-31-X4\nAccounts Payable300,000500,000\nDividends Payable200,000300,000\nCommon Stock1,000,0001,000,000\nRetained Earnings700,0001,000,000\nGalaxy's net income in 20X4 was $800,000. What was Galaxy's cash flow from financing (CFF)\nin 20X4?", "opts": ["–$400,000.", "–$500,000.", "–$300,000."], "ans": "A", "expl": "Dividends declared are net income less the increase in retained earnings ($800,000 -\n$300,000 = $500,000). Dividends declared less the increase in dividends payable is\ndividends paid ($500,000 – ($300,000 - $200,000) = $400,000). This is a cash outflow so it is\na negative number. Dividends paid are always cash flow from financing under U.S. GAAP.\nNote that accounts payable changes are included in cash flow from operations (CFO).\n(Module 30.3, LOS 30.b)"}, {"n": 42, "q": "An analyst has gathered the following information about a company:\nIncome Statement for the Year 20X5\nSales$1,500\nExpenses\nCOGS$1,300\nDepreciation20\nGoodwill10\nInt. Expenses40\nTotal expenses1,370\nIncome from cont. op.130\nGain on sale30\nIncome before tax160\nIncome tax64\nNet Income$96\nAdditional Information:\nDividends paid30\nCommon stock sold20\nEquipment purchased50\nBonds issued80\nFixed asset sold for (original cost of $100 with accumulated depreciation of $70)60\nAccounts receivable decreased by30\nInventory decreased by20\nAccounts payable increased by20\nWages payable decreased by10\nWhat is the cash flow from investing?", "opts": ["$130.", "$10.", "$110."], "ans": "B", "expl": "Purchase of equipment-$50\nFixed asset sold$60\n CFI$10\n(Module 30.3, LOS 30.b)"}, {"n": 43, "q": "Independence, Inc. reports interest received and dividends paid as part of its cash flow from\noperations. This treatment is acceptable under:", "opts": ["either IFRS or U.S. GAAP.", "IFRS but not under U.S. GAAP.", "U.S. GAAP but not under IFRS."], "ans": "B", "expl": "IFRS permits interest received to be reported as either cash flow from operations or cash\nflow from investing, and permits dividends paid to be reported as either cash flow from\noperations or cash flow from financing. U.S. GAAP requires interest received to be\nreported as cash flow from operations, but requires dividends paid to be reported as cash\nflow from financing.\n(Module 30.3, LOS 30.d)"}, {"n": 44, "q": "Determine the cash flow from operations given the following table.\nItemAmount\nCash payment of dividends$30\nSale of equipment$25\nNet income$25\nPurchase of land$15\nIncrease in accounts payable$20\nSale of preferred stock$25\nIncrease in deferred taxes$5\nProfit on sale of equipment$15", "opts": ["$45.", "$20.", "$35."], "ans": "C", "expl": "Using the indirect method, CFO = Net income 25 + increase in accounts payable 20 +\nincrease in deferred taxes 5 – profit on sale of equipment 15 = $35.\nIncreases in accounts payable and deferred taxes are sources of operating cash that are\nnot included in net income and must be added. Profit on sale of equipment is a CFI item\nthat must be removed from net income.\nNo adjustment needs to be made for cash payment of dividends (CFF), sale of preferred\nstock (CFF), or purchase of land (CFI) because they are not included in net income. Only the\nprofit on sale of equipment, not the full proceeds from sale, is included in net income.\n(Module 30.2, LOS 30.b)"}, {"n": 45, "q": "The correct set of cash flow treatments as they relate to interest paid according to U.S.\ngenerally accepted accounting principles (GAAP) and International Accounting Standards\n(IAS) GAAP is:\nU.S. GAAPIAS GAAP", "opts": ["CFO or CFFCFO", "CFOCFO or CFF", "CFFCFF"], "ans": "B", "expl": "U.S. GAAP treats interest paid as CFO whereas IAS GAAP treats interest paid as either CFO\nor CFF.\n(Module 30.3, LOS 30.d)"}, {"n": 46, "q": "A company prepares its financial statements under International Financial Reporting\nStandards. The company's cash flow statement will classify interest paid as either an:", "opts": ["operating or financing cash flow.", "investing or financing cash flow.", "operating or investing cash flow."], "ans": "A", "expl": "IFRS allows interest paid to be reported in either the operating or financing section of the\ncash flow statement. U.S. GAAP requires interest paid to be reported in the operating\nsection of the cash flow statement.\n(Module 30.3, LOS 30.d)"}, {"n": 47, "q": "According to U.S. Generally Accepted Accounting Principles (GAAP) and International\nAccounting Standards (IAS) GAAP, should dividends paid be treated as a cash flow from\nfinancing (CFF) or as a cash flow from operations (CFO)?\nU.S. GAAPIAS GAAP", "opts": ["CFF or CFOCFO", "CFOCFF", "CFFCFF or CFO"], "ans": "C", "expl": "U.S. GAAP treats dividends paid as CFF whereas IAS GAAP treats dividends paid as either\nCFO or CFF.\n(Module 30.3, LOS 30.d)"}, {"n": 48, "q": "An analyst has gathered the following information about a company that reports under U.S.\nGAAP:\nIncome Statement for the Year\nSales$1,500\nExpenses\nCOGS$1,300\nDepreciation20\nGoodwill10\nInt. Expenses40\nTotal expenses1,370\nIncome from cont. op.130\nGain on sale30\nIncome before tax160\nIncome tax64\nNet Income$96\nAdditional Information:\nDividends paid$30\nCommon stock issued20\nEquipment purchased50\nBonds issued80\nFixed asset sold for(original cost of $100 with accumulated depreciation of $70)60\nAccounts receivable decreased by30\nInventory decreased by20\nAccounts payable increased by20\nWages payable decreased by10\nWhat is the cash flow from financing?", "opts": ["$110.", "$130.", "$70."], "ans": "C", "expl": "Dividends paid-$30\nStock issued20\nBonds issued80\n CFF$70\n(Module 30.3, LOS 30.b)"}, {"n": 49, "q": "Fricks Ltd. is a gold mining company headquartered in Indonesia with operations throughout\nthe world. Fricks reports under IFRS. When subsidiaries located in the United States and\nCanada pay dividends to the Indonesian parent company, Fricks may classify the dividends\nas:", "opts": ["cash flow from either investing or operations.", "cash flow from financing only.", "cash flow from investing only."], "ans": "A", "expl": "Under IFRS, interest and dividends received may be shown as either cash flow from\noperations or cash flow from investing.\n(Module 30.3, LOS 30.d)"}, {"n": 50, "q": "When using the indirect method for computing cash flow from operating activities, a change\nin accounts payable will require which of the following?", "opts": ["A negative (positive) adjustment to net income when accounts payable increases (decreases).", "A negative adjustment to net income regardless of whether accounts payable increases or decreases.", "A positive (negative) adjustment to net income when accounts payable increases (decreases)."], "ans": "C", "expl": "A decrease in accounts payable represents an outflow. Hence, a negative adjustment will\nbe required. Conversely, an increase represents an inflow and a positive adjustment.\n(Module 30.2, LOS 30.b)"}, {"n": 51, "q": "Mark Industries' income statement and related notes for the year ended December 31 are as\nfollows (in $):\nSales42,000,000\nCost of Goods Sold(32,000,000)\nWages Expense(1,500,000)\nDepreciation Expense(2,500,000)\nInterest Expense(1,000,000)\nIncome Tax Expense(2,000,000)\nNet Income3,000,000\nDuring the year:\nWages Payable increased $100,000.\nAccumulated Depreciation increased $2,500,000.\nInterest Payable decreased $200,000.\nIncome Taxes Payable increased $500,000.\nDividends of $100,000 were declared and paid.\nUnder U.S. GAAP, Mark Industries' cash flow from operations (CFO) for the year ended\nDecember 31 was:", "opts": ["$4,800,000.", "$4,400,000.", "$5,900,000."], "ans": "C", "expl": "Using the indirect method, net income is adjusted by adding back depreciation (a non-cash\nexpense) and changes in working capital: the increase in wages payable and the increase\nin income taxes payable are sources of cash, and the decrease in interest payable is a use\nof cash. Dividends paid are financing cash flows under U.S. GAAP.\nCFO = $3,000,000 + $2,500,000 + $100,000 + $500,000 - $200,000 = $5,900,000.\n(Module 30.2, LOS 30.b)"}, {"n": 52, "q": "Capital Corp.'s activities in the year 20X5 included the following:\nAt the beginning of the year, Capital purchased a cargo plane from Aviation Partners\nfor $10 million in exchange for $2 million cash, $3 million in Capital Corp. bonds and\n$5 million in Capital Corp. preferred stock.\nInterest of $150,000 was paid on the bonds, and dividends of $250,000 were paid on\nthe preferred stock.\nAt the end of the year, the cargo plane was sold for $12,000,000 cash to Standard\nCompany. Proceeds from the sale were used to pay off the $3 million in bonds held by\nAviation Partners.\nOn Capital Corp.'s U.S. GAAP statement of cash flows for the year ended December 31, 20X5,\ncash flow from investments (CFI) related to the above activities is:", "opts": ["$6,750,000.", "$9,750,000.", "$10,000,000."], "ans": "C", "expl": "Investing cash of $2 million was used to purchase the cargo plane. Proceeds from the sale\nof the plane were a source of $12 million of investing cash. Net CFI is $12 million − $2\nmillion = $10 million. Under U.S. GAAP, the interest payment is included in cash from\noperations (CFO) and the dividend payment in cash from financing (CFF). Redemption of\nthe bonds is a use of cash from financing (CFF).\n(Module 30.3, LOS 30.b)"}, {"n": 53, "q": "Eagle Company's financial statements for the year ended December 31, 20X5 were as follows\n(in $ millions):\nIncome Statement\nSales150\nCost of Goods Sold(48)\nWages Expense(56)\nInterest Expense(12)\nDepreciation(22)\nGain on Sale of Equipment6\nIncome Tax Expense( 8)\nNet Income10\nBalance Sheet\n12-31-X412-31-X5\nCash3252\nAccounts Receivable1822\nInventory4644\nProperty, Plant & Equip. (net)182160\nTotal Assets278278\nAccounts Payable2833\nLong-term Debt145135\nCommon Stock7070\nRetained Earnings3540\nTotal Liabilities & Equity278278\nCash flow from operations (CFO) for Eagle Company for the year ended December 31, 20X5\nwas (in $ millions).", "opts": ["$29.", "$37.", "$41."], "ans": "A", "expl": "Using the indirect method:\nAdd: Net Income$10\nAdd: Depreciation Expense22\nLess: Gain from Sale of Equip.(6)\nLess: Increase in Accounts Receivable(4)\nAdd: Decrease in Inventory2\nAdd: Increase in Accounts Payable5\nCash flow from operations (CFO)29\n(Module 30.2, LOS 30.b)"}];
const CFG = {"title": "Analyzing Statements of Cash Flows I", "subtitle": "CFA · Financial Statement Analysis · Reading 30 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + (location.pathname.split("/").pop() || CFG.title || "quiz");
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  answers[i] = L;
  const card = $("q-"+i);
  card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
  $("opt-"+i+"-"+L).classList.add("sel");
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
