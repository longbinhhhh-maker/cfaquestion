<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 41.1 — Guidance for Standards I(A) and I(B) · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));

  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));

  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Ken James has been an independent financial advisor for 15 years. He received his CFA Charter in 2013, but did not feel it helped his business, so he let his dues lapse this year. He still has several hundred business cards with the CFA designation printed on them. His promotional materials state that he received his CFA designation in 2013. James:", "opts": ["must cease distributing the cards with the CFA designation and the existing promotional materials.", "may continue to use the existing promotional materials, and may use the cards until his supply runs out—his new cards cannot have the designation.", "must cease distributing the cards with the CFA designation, but may continue to use the existing promotional materials."], "ans": "C", "expl": "Because he is not currently a dues-paying member, James must stop using the CFA designation immediately. However, the year he was awarded the Charter is a fact.", "explhtml": "<p>Because he is not currently a dues-paying member, James must stop using the CFA designation immediately. However, the year he was awarded the Charter is a fact.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.b<\/div><div class=\"qtext\"><p>Ken James has been an independent financial advisor for 15 years. He received his CFA Charter in 2013, but did not feel it helped his business, so he let his dues lapse this year. He still has several hundred business cards with the CFA designation printed on them. His promotional materials state that he received his CFA designation in 2013. James:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "If a CFA Institute member knows that a fellow member has violated the Code and Standards, according to Standard I(A) the member is:", "opts": ["required to dissociate from the activity and strongly encouraged to report it.", "required to report the activity.", "strongly encouraged to dissociate from the activity."], "ans": "A", "expl": "Standard I(A) does not require a CFA Institute member to report potential violations by others, but \"strongly encourages members and candidates to report potential violations of the Code and Standards committed by fellow members and candidates.\"", "explhtml": "<p>Standard I(A) does not require a CFA Institute member to report potential violations by others, but &quot;strongly encourages members and candidates to report potential violations of the Code and Standards committed by fellow members and candidates.&quot;<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>If a CFA Institute member knows that a fellow member has violated the Code and Standards, according to Standard I(A) the member is:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Bob Blanford, CFA, is an investment analyst for a large global brokerage firm. He recently moved to Ragatan, a developing country. As part of conducting a company analysis, Blanford interviews Ravi Shanti, vice president of finance at Starr Industries. Starr is a major industrial firm in Ragatan and a client at Blanford's firm. Based on his analysis, Blanford suspects that Shanti may have deliberately overstated Starr's current earnings and its earnings for the past several quarters. Blanford suspects that Shanti may have violated Ragatan's securities laws. To comply with the Code and Standards, Blanford should least likely:", "opts": ["take no action.", "disassociate himself from the client, if the activity is illegal or unethical.", "determine the legality of the activity, possibly by consulting counsel."], "ans": "A", "expl": "Because Blanford suspects Shanti of engaging in ongoing illegal activities, Blanford should take action by determining the legality of the suspected action, disassociating from any illegal activity, and urging his firm to attempt to persuade Shanti to cease such conduct if such an activity is illegal or unethical.", "explhtml": "<p>Because Blanford suspects Shanti of engaging in ongoing illegal activities, Blanford should take action by determining the legality of the suspected action, disassociating from any illegal activity, and urging his firm to attempt to persuade Shanti to cease such conduct if such an activity is illegal or unethical.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Bob Blanford, CFA, is an investment analyst for a large global brokerage firm. He recently moved to Ragatan, a developing country. As part of conducting a company analysis, Blanford interviews Ravi Shanti, vice president of finance at Starr Industries. Starr is a major industrial firm in Ragatan and a client at Blanford&#x27;s firm. Based on his analysis, Blanford suspects that Shanti may have deliberately overstated Starr&#x27;s current earnings and its earnings for the past several quarters. Blanford suspects that Shanti may have violated Ragatan&#x27;s securities laws. To comply with the Code and Standards, Blanford should least likely:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Shortly after becoming employed by Valco & Co., an investment banking firm, Stan McDowell, CFA, learns that most of Valco's initial public offerings (IPO) are really put in place to profit management via price manipulation of the shares. McDowell observes an illegal act, sanctioned by senior management, in progress and refuses to sign off on his responsibility. Instead, McDowell takes the documentation to his supervisor and tells him he should sign it in his place. This action is:", "opts": ["a suitable reaction, and he is in compliance with the Code and Standards.", "an overreaction. Senior management's sanctioning of the act absolves McDowell from his ordinary responsibility as a CFA Institute member.", "a violation of the Code and Standards since he is required not to knowingly participate or assist in such an act."], "ans": "C", "expl": "McDowell, by his action in taking the documentation to his supervisor, is knowingly participating in and/or assisting in an illegal act. This is clearly prohibited under Standard I(A), and he is in violation of the Standard.", "explhtml": "<p>McDowell, by his action in taking the documentation to his supervisor, is knowingly participating in and/or assisting in an illegal act. This is clearly prohibited under Standard I(A), and he is in violation of the Standard.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Shortly after becoming employed by Valco &amp; Co., an investment banking firm, Stan McDowell, CFA, learns that most of Valco&#x27;s initial public offerings (IPO) are really put in place to profit management via price manipulation of the shares. McDowell observes an illegal act, sanctioned by senior management, in progress and refuses to sign off on his responsibility. Instead, McDowell takes the documentation to his supervisor and tells him he should sign it in his place. This action is:<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Harold Klein, CFA, is an expert on ethical conduct in the investment banking industry and has been asked by an association of investment bankers to give a presentation on interpreting codes of ethics and standards of practice such as the CFA Institute Code of Ethics and Standards of Professional Conduct. In his presentation, Klein makes two key points: 1. Sound ethical judgment requires careful and thoughtful application of ethical standards which are precise and exacting in nature 2. An ethical professional must begin the ethical decision making process by determining the applicable code and standards that govern the situation. Determine whether Klein's statements are correct or incorrect and state your conclusion. Statement 1  Statement 2", "opts": ["Incorrect Incorrect", "Incorrect Correct", "Correct Correct"], "ans": "B", "expl": "Statement 1 is incorrect. Ethical standards and codes of conduct are not mathematically precise and exacting but are ambiguous and open to interpretation. This characteristic requires wisdom and a mature approach on the part of the professional. Statement 2 is correct. In deciding what course of action is ethically sound, a professional must first determine the applicable code and standards and assess their requirements in light of the circumstances.", "explhtml": "<p>Statement 1 is incorrect. Ethical standards and codes of conduct are not mathematically precise and exacting but are ambiguous and open to interpretation. This characteristic requires wisdom and a mature approach on the part of the professional. Statement 2 is correct. In deciding what course of action is ethically sound, a professional must first determine the applicable code and standards and assess their requirements in light of the circumstances.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.a<\/div><div class=\"qtext\"><p>Harold Klein, CFA, is an expert on ethical conduct in the investment banking industry and has been asked by an association of investment bankers to give a presentation on interpreting codes of ethics and standards of practice such as the CFA Institute Code of Ethics and Standards of Professional Conduct. In his presentation, Klein makes two key points:<\/p><p>1. Sound ethical judgment requires careful and thoughtful application of ethical standards which are precise and exacting in nature 2. An ethical professional must begin the ethical decision making process by determining the applicable code and standards that govern the situation.<\/p><p>Determine whether Klein&#x27;s statements are correct or incorrect and state your conclusion. Statement 1 &nbsp; Statement 2<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "The CFA Institute Standards of Practice Handbook requires CFA Institute members to do all the following EXCEPT:", "opts": ["receive written permission from both their employer and outside clients to engage in investment consulting outside the firm.", "to inform employer, clients, and potential clients of benefits received for recommending products or services.", "to disclose in writing to the proper regulatory authority all observed violations of the securities laws and regulations."], "ans": "C", "expl": "Members are not required to report violations of others to regulatory authorities, either verbally or in writing, but such reporting may be prudent.", "explhtml": "<p>Members are not required to report violations of others to regulatory authorities, either verbally or in writing, but such reporting may be prudent.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>The CFA Institute Standards of Practice Handbook requires CFA Institute members to do all the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "A government committee has concluded that investment company fees should be disclosed to clients each quarter and has proposed new legislation to require this. Currently, the legal requirement is to report such data annually. In compliance with current legal requirements, Dolphin Investments discloses its fees annually. Eugene Shin, CFA, Dolphin's compliance officer, learns of the proposed changes but does not convert Dolphin's reporting to a quarterly basis. Shin's decision not to act:", "opts": ["constitutes professional misconduct as defined in the Code and Standards.", "is a violation of his duty to employer as defined in the Code and Standards.", "is not a violation of the Code and Standards."], "ans": "C", "expl": "The potential change in the law is only a proposal at this stage. There is no violation as long as Dolphin is following the regulations currently in force.", "explhtml": "<p>The potential change in the law is only a proposal at this stage. There is no violation as long as Dolphin is following the regulations currently in force.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>A government committee has concluded that investment company fees should be disclosed to clients each quarter and has proposed new legislation to require this. Currently, the legal requirement is to report such data annually. In compliance with current legal requirements, Dolphin Investments discloses its fees annually. Eugene Shin, CFA, Dolphin&#x27;s compliance officer, learns of the proposed changes but does not convert Dolphin&#x27;s reporting to a quarterly basis. Shin&#x27;s decision not to act:<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "To comply with the Standard on independence and objectivity, an analyst making investment recommendations:", "opts": ["must use only his own or his company's research.", "may use outside research only after verifying its accuracy.", "must use only his own research."], "ans": "B", "expl": "Standard I(B), Independence and Objectivity: the analyst is allowed to use outside research only after an insightful review. There are no restrictions regarding the exclusive use of in-house information.", "explhtml": "<p>Standard I(B), Independence and Objectivity: the analyst is allowed to use outside research only after an insightful review. There are no restrictions regarding the exclusive use of in-house information.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(B)<\/div><div class=\"qtext\"><p>To comply with the Standard on independence and objectivity, an analyst making investment recommendations:<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "Allen Parsons, a CFA candidate, suspects a colleague at his firm of engaging in an illegal activity. Which of the following statements about procedures for compliance involving Standard I(A), Knowledge of the law is NOT correct? Parsons:", "opts": ["should urge his firm to attempt to persuade the perpetrator to cease such conduct.", "is required to report this legal violation to the appropriate governmental or regulatory organizations.", "should consult counsel to determine whether the conduct is, in fact, illegal."], "ans": "B", "expl": "Standard I(A), Knowledge of the law, does not require that Parsons report legal violations to the appropriate governmental or regulatory organizations, but such disclosures may be appropriate under certain circumstances.", "explhtml": "<p>Standard I(A), Knowledge of the law, does not require that Parsons report legal violations to the appropriate governmental or regulatory organizations, but such disclosures may be appropriate under certain circumstances.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Allen Parsons, a CFA candidate, suspects a colleague at his firm of engaging in an illegal activity. Which of the following statements about procedures for compliance involving Standard I(A), Knowledge of the law is NOT correct? Parsons:<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "Member compliance on issues relating to corporate governance or to soft dollars is primarily addressed by the Standard:", "opts": ["Referral Fees.", "Loyalty, Prudence, and Care.", "Avoid or Disclose Conflicts."], "ans": "B", "expl": "Fiduciary duty on issues relating to corporate governance or to soft dollars is primarily addressed by Standard III(A), Loyalty, Prudence, and Care. ", "explhtml": "<p>Fiduciary duty on issues relating to corporate governance or to soft dollars is primarily addressed by Standard III(A), Loyalty, Prudence, and Care. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.b<\/div><div class=\"qtext\"><p>Member compliance on issues relating to corporate governance or to soft dollars is primarily addressed by the Standard:<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "CFA Institute believes:", "opts": ["that a minimum level of professional responsibility and conduct dictates that members be aware of and comply with laws, rules, and regulations governing their conduct.", "that firms should comply with all domestic laws and regulations and that these laws also govern behavior in foreign markets, regardless of foreign laws and requirements.", "that a maximum level of professional responsibility and conduct dictates that members be aware of and comply with laws, rules, and regulations governing their conduct."], "ans": "A", "expl": "CFA Institute's Code and Standards dictate a minimum level of conduct. Standards should not be based on ethics of upper management and the board of directors of a company. Firms must comply with the strictest applicable standards, whether they be foreign or domestic laws and regulations.", "explhtml": "<p>CFA Institute&#x27;s Code and Standards dictate a minimum level of conduct. Standards should not be based on ethics of upper management and the board of directors of a company. Firms must comply with the strictest applicable standards, whether they be foreign or domestic laws and regulations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>CFA Institute believes:<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "Maria Valdes, CFA, is an analyst for Venture Investments in the country of Newamerica, which has laws prohibiting the acceptance of any gift from a vendor if the gift exceeds US $250. Valdes has evidence that her Venture Investments colleague, Ernesto Martinez, CFA, has been receiving gifts from vendors in excess of US $250. Valdes is obligated to:", "opts": ["disassociate herself from the activity, urge Venture to persuade Martinez to cease the activity, and inform CFA Institute of the violation.", "disassociate herself from the activity, urge Venture to persuade Martinez to cease the activity, and inform CFA Institute and regulatory authorities of the violation.", "disassociate herself from the activity, and urge Venture to persuade Martinez to cease the activity."], "ans": "C", "expl": "Standard I(A), Knowledge of the Law requires members who have knowledge of colleagues engaging in illegal activities to disassociate from the activity and urge their firms to persuade the individual to cease such activity. Reporting to regulatory authorities may be prudent in certain circumstances, but is not required. Reporting to CFA Institute is not required.", "explhtml": "<p>Standard I(A), Knowledge of the Law requires members who have knowledge of colleagues engaging in illegal activities to disassociate from the activity and urge their firms to persuade the individual to cease such activity. Reporting to regulatory authorities may be prudent in certain circumstances, but is not required. Reporting to CFA Institute is not required.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Maria Valdes, CFA, is an analyst for Venture Investments in the country of Newamerica, which has laws prohibiting the acceptance of any gift from a vendor if the gift exceeds US $250. Valdes has evidence that her Venture Investments colleague, Ernesto Martinez, CFA, has been receiving gifts from vendors in excess of US $250.<\/p><p>Valdes is obligated to:<\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "Michael Bellow, CFA, CAIA, is an investment banker who is involved with an initial public offering (IPO) of NewCo. Because this is Bellow's first involvement in an IPO, he reports to an experienced supervisor. While reviewing past financial statements provided by NewCo, Bellow suspects that NewCo deliberately overstated its earnings for the past several quarters. Bellow seeks the advice of his firm's highly competent general counsel and follows the advice given without deviation. Based on the general counsel's advice, Bellow consults his immediate supervisor about the suspected overstatement of earnings. After reviewing the situation, Bellow's supervisor explains why NewCo's calculations of its earnings are correct. Bellow realizes that his inexperience and exuberance initially led him to an incorrect conclusion about NewCo's earnings. Which of the following statements about Bellow's actions involving Standard I(A), Knowledge of the law, and Standard I(C), Misrepresentation, is CORRECT? Bellow:", "opts": ["violated both Standard I(A) and Standard I(C).", "violated Standard I(A) but did not violate Standard I(C).", "did not violate either Standard I(A) or Standard I(C)."], "ans": "C", "expl": "Bellow did not violate Standard I(A), Knowledge of the law, because he sought advice of counsel and followed that advice. Bellow did not violate Standard I(C), Misrepresentation, because he made reasonable and diligent efforts to ensure the accuracy of the information and to avoid any material representation.", "explhtml": "<p>Bellow did not violate Standard I(A), Knowledge of the law, because he sought advice of counsel and followed that advice. Bellow did not violate Standard I(C), Misrepresentation, because he made reasonable and diligent efforts to ensure the accuracy of the information and to avoid any material representation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Michael Bellow, CFA, CAIA, is an investment banker who is involved with an initial public offering (IPO) of NewCo. Because this is Bellow&#x27;s first involvement in an IPO, he reports to an experienced supervisor. While reviewing past financial statements provided by NewCo, Bellow suspects that NewCo deliberately overstated its earnings for the past several quarters. Bellow seeks the advice of his firm&#x27;s highly competent general counsel and follows the advice given without deviation. Based on the general counsel&#x27;s advice, Bellow consults his immediate supervisor about the suspected overstatement of earnings. After reviewing the situation, Bellow&#x27;s supervisor explains why NewCo&#x27;s calculations of its earnings are correct. Bellow realizes that his inexperience and exuberance initially led him to an incorrect conclusion about NewCo&#x27;s earnings.<\/p><p>Which of the following statements about Bellow&#x27;s actions involving Standard I(A), Knowledge of the law, and Standard I(C), Misrepresentation, is CORRECT? Bellow:<\/p><\/div>", "subj": "ethics"}, {"n": 14, "q": "Janet Green, CFA, provides investment advice and other services to clients in several countries. She resides in Country A whose securities laws and regulations are less strict than the Code and Standards. She also conducts business with clients in Country B, which has no securities laws or regulations, and in Country C, which has securities laws and regulations that are stricter than the Code and Standards. Which of the following statements is CORRECT? According to CFA Institute Standards of Professional Conduct, Green must adhere to the Code and Standards in:", "opts": ["Country A but the law in Country B and Country C.", "Country A and Country B but the law in Country C.", "Country A, Country B, and Country C."], "ans": "B", "expl": "Green needs to follow Standard I(A) -- Knowledge of the law. In Country A, Green must adhere to the Code and Standards because Country A's laws are less strict. In Country B, Green must also adheres to the Code and Standards because Country B has no securities laws. Because Country C's applicable law is stricter than the requirements of the Code and Standards, Green must adhere to the laws of Country C.", "explhtml": "<p>Green needs to follow Standard I(A) -- Knowledge of the law. In Country A, Green must adhere to the Code and Standards because Country A&#x27;s laws are less strict. In Country B, Green must also adheres to the Code and Standards because Country B has no securities laws. Because Country C&#x27;s applicable law is stricter than the requirements of the Code and Standards, Green must adhere to the laws of Country C.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Janet Green, CFA, provides investment advice and other services to clients in several countries. She resides in Country A whose securities laws and regulations are less strict than the Code and Standards. She also conducts business with clients in Country B, which has no securities laws or regulations, and in Country C, which has securities laws and regulations that are stricter than the Code and Standards. Which of the following statements is CORRECT? According to CFA Institute Standards of Professional Conduct, Green must adhere to the Code and Standards in:<\/p><\/div>", "subj": "ethics"}, {"n": 15, "q": "The Securities and Exchange Board of India (SEBI) has just enacted a new stock-trading rule. SEBI will give brokers a 10-day grace period, during which violators of the rule will be immediately notified and given a chance to remedy their situation to comply with the new rule. If a CFA Institute member located in India or doing business in India unknowingly violates the rule and then remedies the situation within the 10-day grace period, has the member violated Standard I(A)?", "opts": ["Yes, because the member did not maintain knowledge and know of the rule.", "No, because the member unknowingly broke the rule.", "No, because the member remedied the situation."], "ans": "A", "expl": "Standard I(A) explicitly says that a member shall maintain knowledge and comply with laws, rules, and regulations. By not knowing of the rule, the member broke the standard.", "explhtml": "<p>Standard I(A) explicitly says that a member shall maintain knowledge and comply with laws, rules, and regulations. By not knowing of the rule, the member broke the standard.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>The Securities and Exchange Board of India (SEBI) has just enacted a new stock-trading rule. SEBI will give brokers a 10-day grace period, during which violators of the rule will be immediately notified and given a chance to remedy their situation to comply with the new rule. If a CFA Institute member located in India or doing business in India unknowingly violates the rule and then remedies the situation within the 10-day grace period, has the member violated Standard I(A)?<\/p><\/div>", "subj": "ethics"}, {"n": 16, "q": "After a very successful quarter of high investment returns, Judy O'Berry, CFA, receives several gifts from grateful clients. O'Berry considers the gifts to be of novelty or sentimental value only, but she hears rumors that several junior employees are jealous of the attention she received for the group's efforts. She decides to consult the company's compliance rules on gifts and is surprised to learn her firm has no established rules. She consults the Standards of Practice Handbook, and then submits proposed rules on gifts to her company's compliance department. These rules should contain all of the following EXCEPT:", "opts": ["a formal value limit based on local customs.", "a requirement to disclose the gift.", "restrictions on all types business entertainment."], "ans": "C", "expl": "The rules should contain a formal value limit based on local customs. Not all types of business entertainment are forbidden. Only business entertainment which is intended to influence or reward members and candidates should be avoided.", "explhtml": "<p>The rules should contain a formal value limit based on local customs. Not all types of business entertainment are forbidden. Only business entertainment which is intended to influence or reward members and candidates should be avoided.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.b<\/div><div class=\"qtext\"><p>After a very successful quarter of high investment returns, Judy O&#x27;Berry, CFA, receives several gifts from grateful clients. O&#x27;Berry considers the gifts to be of novelty or sentimental value only, but she hears rumors that several junior employees are jealous of the attention she received for the group&#x27;s efforts. She decides to consult the company&#x27;s compliance rules on gifts and is surprised to learn her firm has no established rules. She consults the Standards of Practice Handbook, and then submits proposed rules on gifts to her company&#x27;s compliance department. These rules should contain all of the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 17, "q": "A CFA Institute member is also a member and the portfolio manager of an environmentalist group. In its charter, the environmentalist group lists a group of companies its members should boycott. The CFA Institute member would violate Standard I(A) concerning obeying all rules and regulations if the member:", "opts": ["performs either of the activities listed here.", "purchases stock of a boycotted firm for the group's portfolio.", "actively protests against a publicly traded firm boycotted by the group."], "ans": "B", "expl": "Standard I(A) says the member must be guided by all applicable rules and regulations of professional associations governing the member's professional activities. Purchasing the stock for the firm would be a violation because it involves the member's professional activities and the rules of a group to which the member belongs and works for. Actively protesting would not be covered by that standard.", "explhtml": "<p>Standard I(A) says the member must be guided by all applicable rules and regulations of professional associations governing the member&#x27;s professional activities. Purchasing the stock for the firm would be a violation because it involves the member&#x27;s professional activities and the rules of a group to which the member belongs and works for. Actively protesting would not be covered by that standard.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>A CFA Institute member is also a member and the portfolio manager of an environmentalist group. In its charter, the environmentalist group lists a group of companies its members should boycott. The CFA Institute member would violate Standard I(A) concerning obeying all rules and regulations if the member:<\/p><\/div>", "subj": "ethics"}, {"n": 18, "q": "Georgia Jones, CFA, is an analyst for Johnson, Thomas & Co. She also serves as an outside director for Dewey Manufacturing, Inc. In the course of her duties, she begins to believe that Dewey's income statement for the most recent period may have been misstated. Georgia should do all of the following EXCEPT:", "opts": ["consult with Johnson, Thomas' legal counsel.", "consult with Dewey Manufacturing's legal counsel.", "inform the Securities and Exchange Commission."], "ans": "C", "expl": "Jones must pursue her concerns about a possible misstatement, because, if material, it may be misleading to investors. Consistent with Standard I(A), Jones must not knowingly participate or assist in a regulatory violation. As long as her concerns exist, she must not validate any financial statements by voting to approve them. In addition she should seek competent legal counsel both at her own firm and at Dewey Manufacturing. She should not go to regulatory bodies until she has more certainty about the possible misstatement and has received counsel that she should proceed.", "explhtml": "<p>Jones must pursue her concerns about a possible misstatement, because, if material, it may be misleading to investors. Consistent with Standard I(A), Jones must not knowingly participate or assist in a regulatory violation. As long as her concerns exist, she must not validate any financial statements by voting to approve them. In addition she should seek competent legal counsel both at her own firm and at Dewey Manufacturing. She should not go to regulatory bodies until she has more certainty about the possible misstatement and has received counsel that she should proceed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Georgia Jones, CFA, is an analyst for Johnson, Thomas &amp; Co. She also serves as an outside director for Dewey Manufacturing, Inc. In the course of her duties, she begins to believe that Dewey&#x27;s income statement for the most recent period may have been misstated. Georgia should do all of the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 19, "q": "Preston Partners is an investment management firm that adopted the Code and Standards as part of its policy manual. Gerald Smithson, CFA, has recently added the stock of Utah Biochemical Company and Norgood PLC to all his client's investment portfolios. Shortly afterwards Utah Biochemical and Norgood announced a merger that increased the share price of both companies. Smithson contends he saw the president of Utah Biochemical dining with the chairman of Norgood, but did not overhear their conversation. Smithson researched both companies extensively and determined that each company was a good investment. He put in a block trade for shares in each company. Preston's policies were not clear in this area as he allocated the shares by starting with his largest client accounts and working down to the small accounts. Some of Smithson's clients were very conservative personal trust accounts, others were pension funds who had aggressive investment objectives. Which standard was NOT broken?", "opts": ["Standard IV(C)—Responsibilities of Supervisors.", "Standard III(C)—Suitability.", "Standard V(A)—Diligence and Reasonable Basis."], "ans": "C", "expl": "Standard V(A)—Diligence and Reasonable Basis was not broken because Smithson conducted thorough and diligent research. Standard III(C)—Suitability, Smithson failed to consider the needs of his conservative and aggressive clients. Standard IV(C)—Responsibilities of Supervisors, Preston Partners didn't have policies explaining how to allocate shares among clients.", "explhtml": "<p>Standard V(A)—Diligence and Reasonable Basis was not broken because Smithson conducted thorough and diligent research. Standard III(C)—Suitability, Smithson failed to consider the needs of his conservative and aggressive clients. Standard IV(C)—Responsibilities of Supervisors, Preston Partners didn&#x27;t have policies explaining how to allocate shares among clients.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.b<\/div><div class=\"qtext\"><p>Preston Partners is an investment management firm that adopted the Code and Standards as part of its policy manual. Gerald Smithson, CFA, has recently added the stock of Utah Biochemical Company and Norgood PLC to all his client&#x27;s investment portfolios. Shortly afterwards Utah Biochemical and Norgood announced a merger that increased the share price of both companies. Smithson contends he saw the president of Utah Biochemical dining with the chairman of Norgood, but did not overhear their conversation. Smithson researched both companies extensively and determined that each company was a good investment. He put in a block trade for shares in each company. Preston&#x27;s policies were not clear in this area as he allocated the shares by starting with his largest client accounts and working down to the small accounts. Some of Smithson&#x27;s clients were very conservative personal trust accounts, others were pension funds who had aggressive investment objectives. Which standard was NOT broken?<\/p><\/div>", "subj": "ethics"}, {"n": 20, "q": "Kenny Barrett, CFA, is working in the Australian office of American Investments Co. From an informal conversation, Barrett learns that the company's most recent investment report was based on misappropriated information. No one at the Australian office expresses concern, however, because there has been no breach of Australian law. Barrett should:", "opts": ["do nothing because the branch is outside of U.S. jurisdiction.", "seek advice from company counsel to determine appropriate action.", "disassociate himself from the case with a written report to his supervisor."], "ans": "B", "expl": "Kenny's best choice is to seek the company counsel's advice. If Kenny does nothing, he is breaching Standard I(A) Knowledge of the Law. Disassociation is not enough.", "explhtml": "<p>Kenny&#x27;s best choice is to seek the company counsel&#x27;s advice. If Kenny does nothing, he is breaching Standard I(A) Knowledge of the Law. Disassociation is not enough.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Kenny Barrett, CFA, is working in the Australian office of American Investments Co. From an informal conversation, Barrett learns that the company&#x27;s most recent investment report was based on misappropriated information. No one at the Australian office expresses concern, however, because there has been no breach of Australian law. Barrett should:<\/p><\/div>", "subj": "ethics"}, {"n": 21, "q": "Under Standard IV(A) Loyalty (to employers):", "opts": ["it is recommended that members deliver a copy of the Code and Standards to their employer.", "members are encouraged to leave an employer that does not adopt the Code and Standards as part of its policies and procedures.", "members are required to deliver a copy of the Code and Standards to their employer."], "ans": "A", "expl": "Standard IV(A) Loyalty recommends (not requires) that members and candidates provide their employer with a copy of the Code and Standards and notify their employer that they are required to follow the Code and Standards. There is no recommendation to leave a firm simply because the Code and Standards have not been adopted by the firm in its policies and procedures.", "explhtml": "<p>Standard IV(A) Loyalty recommends (not requires) that members and candidates provide their employer with a copy of the Code and Standards and notify their employer that they are required to follow the Code and Standards. There is no recommendation to leave a firm simply because the Code and Standards have not been adopted by the firm in its policies and procedures.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Under Standard IV(A) Loyalty (to employers):<\/p><\/div>", "subj": "ethics"}, {"n": 22, "q": "An analyst has been writing research reports on a company for many years. As part of the analyst's continuing research efforts, the analyst allows the firm to fly him to the firm's headquarters and put him up in the guest quarters the company has for all corporate visitors. According to Standard I(B), Independence and Objectivity, this is:", "opts": ["not a violation under any circumstances.", "a violation if the headquarters are within reasonable driving distance from the analyst's home.", "a violation no matter what the circumstances."], "ans": "B", "expl": "If such a trip is \"out-of-the-way\", payment by the company for the trip is acceptable. If the headquarters are within reasonable driving distance, the analyst should drive there.", "explhtml": "<p>If such a trip is &quot;out-of-the-way&quot;, payment by the company for the trip is acceptable. If the headquarters are within reasonable driving distance, the analyst should drive there.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(B)<\/div><div class=\"qtext\"><p>An analyst has been writing research reports on a company for many years. As part of the analyst&#x27;s continuing research efforts, the analyst allows the firm to fly him to the firm&#x27;s headquarters and put him up in the guest quarters the company has for all corporate visitors. According to Standard I(B), Independence and Objectivity, this is:<\/p><\/div>", "subj": "ethics"}, {"n": 23, "q": "Jane Dawson, CFA, an analyst at a New York brokerage firm, suspects that Bob Boatman, CFA, another analyst at the same firm, has violated a state securities law. According to the CFA Institute Standards of Professional Conduct, Dawson is:", "opts": ["required to report the suspected violation to the appropriate state regulatory agency.", "NOT required to report the violation to the appropriate governmental or regulatory organizations.", "required to report the suspected violation to CFA Institute."], "ans": "B", "expl": "The Code and Standards do not require that members report legal violations to the appropriate governmental or regulatory organizations, but such disclosure may be prudent in certain circumstances. Dawson should consult legal counsel and disassociate from the activity.", "explhtml": "<p>The Code and Standards do not require that members report legal violations to the appropriate governmental or regulatory organizations, but such disclosure may be prudent in certain circumstances. Dawson should consult legal counsel and disassociate from the activity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Jane Dawson, CFA, an analyst at a New York brokerage firm, suspects that Bob Boatman, CFA, another analyst at the same firm, has violated a state securities law. According to the CFA Institute Standards of Professional Conduct, Dawson is:<\/p><\/div>", "subj": "ethics"}, {"n": 24, "q": "According to CFA Institute Standards of Professional Conduct, which of the following is least likely a compliance procedure for maintaining independence and objectivity in making investment recommendations or taking investment action?", "opts": ["Maintain files to support investment recommendations.", "Restrict special cost arrangements related to travel.", "Create a restricted list so that the firm disseminates only factual information about a controversial company."], "ans": "A", "expl": "Maintaining files to support investment recommendations is not a compliance procedure for Standard I(B): Independence and Objectivity, but it is a compliance procedure for Standard V(C): Record Retention.", "explhtml": "<p>Maintaining files to support investment recommendations is not a compliance procedure for Standard I(B): Independence and Objectivity, but it is a compliance procedure for Standard V(C): Record Retention.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(B)<\/div><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following is least likely a compliance procedure for maintaining independence and objectivity in making investment recommendations or taking investment action?<\/p><\/div>", "subj": "ethics"}, {"n": 25, "q": "Marc Feldman, CFA, is manager of corporate investor relations for a high-tech startup, zippy.com, in Boise, Idaho. Feldman learns that Larry Smith, controller, is altering the accounting records. He decides that any ramifications from such activity is Smith's problem and does not report this fact. According to the CFA Institute Code and Standards he should or is required to do all of the following EXCEPT:", "opts": ["report the activity to the FASB or other relevant regulatory body.", "urge Smith to cease altering the accounting records.", "determine legality, consulting counsel if necessary."], "ans": "A", "expl": "As per the Standards of Practice Handbook \"The Code and Standards do not require that members report legal violations to the appropriate governmental or regulatory organizations, but such disclosure may be prudent in certain circumstances.\" In this instance, he would likely be better off discussing the matter with the firm's legal counsel and Smith's superiors.", "explhtml": "<p>As per the Standards of Practice Handbook &quot;The Code and Standards do not require that members report legal violations to the appropriate governmental or regulatory organizations, but such disclosure may be prudent in certain circumstances.&quot; In this instance, he would likely be better off discussing the matter with the firm&#x27;s legal counsel and Smith&#x27;s superiors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.a<\/div><div class=\"qtext\"><p>Marc Feldman, CFA, is manager of corporate investor relations for a high-tech startup, zippy.com, in Boise, Idaho. Feldman learns that Larry Smith, controller, is altering the accounting records. He decides that any ramifications from such activity is Smith&#x27;s problem and does not report this fact. According to the CFA Institute Code and Standards he should or is required to do all of the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 26, "q": "Judy Gonzales is a portfolio manager with Brenly Capital and works on Johnson Company's account. Brenly has a policy against accepting gifts over $25 from clients. The Johnson portfolio has a fantastic year, and in appreciation, the pension fund manager sent Gonzales a rare bottle of wine. Gonzales should:", "opts": ["present the bottle of wine to her supervisor.", "return the bottle to the client explaining Brenly's policy.", "inform her supervisor in writing that she received additional compensation in the form of the wine."], "ans": "B", "expl": "By not returning the bottle she would be violating the Standard on avoiding or disclosing conflicts to the employer, which states that employees must comply with prohibitions imposed by their employer. ", "explhtml": "<p>By not returning the bottle she would be violating the Standard on avoiding or disclosing conflicts to the employer, which states that employees must comply with prohibitions imposed by their employer. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.b<\/div><div class=\"qtext\"><p>Judy Gonzales is a portfolio manager with Brenly Capital and works on Johnson Company&#x27;s account. Brenly has a policy against accepting gifts over $25 from clients. The Johnson portfolio has a fantastic year, and in appreciation, the pension fund manager sent Gonzales a rare bottle of wine. Gonzales should:<\/p><\/div>", "subj": "ethics"}, {"n": 27, "q": "A CFA Institute member works for Secure Securities, Inc., and plays rugby on the firm's rugby team. Secure Securities' team recently played the team of a rival firm. During the game, a fight broke out and the CFA Institute member was the instigator, but no one was seriously hurt. Is this a violation of I(A) concerning maintaining knowledge and complying with laws, rules, and regulations?", "opts": ["No, because a fight at a rugby game is not a professional activity.", "Yes, because the member is bound by the Code of Ethics.", "Yes, because the member could have hurt someone in the fight."], "ans": "A", "expl": "Standard I(A) covers members' professional activity only. Violations outside professional activity that involve fraud, theft or deceit would potentially be violations.", "explhtml": "<p>Standard I(A) covers members&#x27; professional activity only. Violations outside professional activity that involve fraud, theft or deceit would potentially be violations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>A CFA Institute member works for Secure Securities, Inc., and plays rugby on the firm&#x27;s rugby team. Secure Securities&#x27; team recently played the team of a rival firm. During the game, a fight broke out and the CFA Institute member was the instigator, but no one was seriously hurt. Is this a violation of I(A) concerning maintaining knowledge and complying with laws, rules, and regulations?<\/p><\/div>", "subj": "ethics"}, {"n": 28, "q": "If an analyst suspects a client or a colleague of planning or engaging in ongoing illegal activities, which of the statements about the actions that the analyst should take is most correct? According to the CFA Institute Standards of Professional Conduct, the analyst should:", "opts": ["consult counsel to determine the legality of the activity.", "disassociate from any illegal or unethical activity if the member has reasonable grounds to believe that the activity is illegal or unethical.", "consult counsel to determine the legality of the activity and disassociate from any illegal or unethical activity if the member has reasonable grounds to believe that the activity is illegal or unethical."], "ans": "C", "expl": "According to the procedures for compliance involving Standard I(A), CFA Institute members should determine legality and disassociate from any illegal or unethical activity.", "explhtml": "<p>According to the procedures for compliance involving Standard I(A), CFA Institute members should determine legality and disassociate from any illegal or unethical activity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>If an analyst suspects a client or a colleague of planning or engaging in ongoing illegal activities, which of the statements about the actions that the analyst should take is most correct? According to the CFA Institute Standards of Professional Conduct, the analyst should:<\/p><\/div>", "subj": "ethics"}, {"n": 29, "q": "Nicholas Brynne, CFA, is a fixed-income analyst who trades in mortgage-backed securities (MBS). The MBS industry has seen sweeping regulatory changes since Brynne took his current position, and he now feels his understanding of applicable laws and regulatory standards is dated. To comply with the Code and Standards, Brynne is required to:", "opts": ["have all trades reviewed by his compliance department until he has obtained an expert level of knowledge in compliance.", "rely on his firm’s policies and procedures for guidance on legal and regulatory standards.", "update his understanding of applicable laws and regulatory standards relating to his position."], "ans": "C", "expl": "To comply with Standard I(A) Knowledge of the Law, Brynne should update his understanding of applicable laws and regulatory standards relating to his position, although he is not required to be an expert in compliance. Relying only on firm policies and procedures is not sufficient.", "explhtml": "<p>To comply with Standard I(A) Knowledge of the Law, Brynne should update his understanding of applicable laws and regulatory standards relating to his position, although he is not required to be an expert in compliance. Relying only on firm policies and procedures is not sufficient.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Nicholas Brynne, CFA, is a fixed-income analyst who trades in mortgage-backed securities (MBS). The MBS industry has seen sweeping regulatory changes since Brynne took his current position, and he now feels his understanding of applicable laws and regulatory standards is dated. To comply with the Code and Standards, Brynne is required to:<\/p><\/div>", "subj": "ethics"}, {"n": 30, "q": "Denise Weaver, CFA, manages a mutual fund and several pension plans. When Weaver receives a proxy for stock held by the mutual fund, she gives it to Susan Griffith, her administrative assistant, to vote according to the recommendations of the company's management. When the proxy is for a stock held by one of the pension plans, she asks Griffith to send the proxy on to the pension fund's sponsor to vote. Weaver has:", "opts": ["not violated the Standards with her policies on voting proxies.", "violated the Standards by her policy on mutual fund and pension fund proxies.", "violated the Standards by her policy on mutual fund proxies, but not her policy on pension fund proxies."], "ans": "B", "expl": "Guidance for Standard III(A) Loyalty, Prudence, and Care states that informed and responsible voting of proxies is a responsibility of members and candidates. Neither of Weaver's proxy voting policies meets this Standard. Proxies should not be voted blindly in agreement with company management. Proxies for a pension plan should be voted in the best interests of the beneficiaries, not the plan sponsor. The sponsor's interests will not always be the same as the beneficiaries' interests.", "explhtml": "<p>Guidance for Standard III(A) Loyalty, Prudence, and Care states that informed and responsible voting of proxies is a responsibility of members and candidates. Neither of Weaver&#x27;s proxy voting policies meets this Standard. Proxies should not be voted blindly in agreement with company management. Proxies for a pension plan should be voted in the best interests of the beneficiaries, not the plan sponsor. The sponsor&#x27;s interests will not always be the same as the beneficiaries&#x27; interests.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.b<\/div><div class=\"qtext\"><p>Denise Weaver, CFA, manages a mutual fund and several pension plans. When Weaver receives a proxy for stock held by the mutual fund, she gives it to Susan Griffith, her administrative assistant, to vote according to the recommendations of the company&#x27;s management. When the proxy is for a stock held by one of the pension plans, she asks Griffith to send the proxy on to the pension fund&#x27;s sponsor to vote. Weaver has:<\/p><\/div>", "subj": "ethics"}, {"n": 31, "q": "Mary White, CFA, sits on the board of directors of XYZ Manufacturing, Inc. She discovers that management has knowingly participated in an activity she knows is illegal. According to the CFA Institute Standards of Professional Conduct, White is least likely to be required to:", "opts": ["report the violation to the CFA Institute Professional Conduct Program.", "seek legal advice to determine what actions should be taken.", "disassociate herself from the activity."], "ans": "A", "expl": "Members are encouraged -- but not required -- to report violations of others. Standard I(A), Knowledge of the Law. Prohibition against knowingly practicing or assisting in violation of laws, rules, and regulations. If White knows that someone has engaged in a possible illegal activity, she should: (1) report the finding to the appropriate supervisory person at her firm, (2) if the situation is not remedied, disassociate herself from the situation, and (3) seek legal advice to see what other actions, such as notifying the proper regulatory agency, should be taken.", "explhtml": "<p>Members are encouraged -- but not required -- to report violations of others. Standard I(A), Knowledge of the Law. Prohibition against knowingly practicing or assisting in violation of laws, rules, and regulations. If White knows that someone has engaged in a possible illegal activity, she should: (1) report the finding to the appropriate supervisory person at her firm, (2) if the situation is not remedied, disassociate herself from the situation, and (3) seek legal advice to see what other actions, such as notifying the proper regulatory agency, should be taken.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>Mary White, CFA, sits on the board of directors of XYZ Manufacturing, Inc. She discovers that management has knowingly participated in an activity she knows is illegal. According to the CFA Institute Standards of Professional Conduct, White is least likely to be required to:<\/p><\/div>", "subj": "ethics"}, {"n": 32, "q": "A CFA Institute member conscientiously maintains records of changes in security regulations. The member notices that his colleagues do not, and does NOT say anything. Is this a violation of Standard I(A)?", "opts": ["Yes, because the member is bound by the Code of Ethics.", "Yes, and the member should disassociate from these colleagues.", "No, as long as the colleagues do not violate the new rules."], "ans": "A", "expl": "The last bullet point of the Code says that a member shall \"Maintain and improve their professional competence and strive to maintain and improve the competence of other investment professionals.\" Ignoring the neglect of rule changes of others would clearly be incongruent with this component. As long as the colleagues do not violate the laws, the member does not have to disassociate himself from the colleagues.", "explhtml": "<p>The last bullet point of the Code says that a member shall &quot;Maintain and improve their professional competence and strive to maintain and improve the competence of other investment professionals.&quot; Ignoring the neglect of rule changes of others would clearly be incongruent with this component. As long as the colleagues do not violate the laws, the member does not have to disassociate himself from the colleagues.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>A CFA Institute member conscientiously maintains records of changes in security regulations. The member notices that his colleagues do not, and does NOT say anything. Is this a violation of Standard I(A)?<\/p><\/div>", "subj": "ethics"}, {"n": 33, "q": "Joshua Rosenberg, CFA, is an equity analyst who covers Northwest Implements, a farm implement manufacturer. Northwest's main factory is located in a sparsely inhabited region six hours by automobile from the nearest airport. Northwest has its own corporate jet and a landing strip near its facility. When Rosenberg contacts Northwest's management to arrange a visit for a report he is preparing on the company, Northwest's chief financial officer offers to send Northwest's corporate jet to pick up Rosenberg from an airport near his home and return him home the same evening. Rosenberg estimates that it would require three days for him to make the visit using commercial travel. If Rosenberg makes the trip to Northwest's headquarters on the corporate jet, the Standard concerning independence and objectivity:", "opts": ["permits him to do so.", "requires him or his employer to reimburse Northwest for the cost of the trip.", "requires him to disclose in his report on Northwest the company's payment of his travel expenses."], "ans": "A", "expl": "According to Standard I(B) Independence and Objectivity, a visit by an analyst to an out-of-the-way site may be provided by a company host if commercial transportation is unavailable or inefficient. If the use of such transportation creates the appearance of a conflict of interest or interferes with an analyst's ability to provide unbiased opinions, Standard VI(A) Avoid or Disclose Conflicts would require the analyst to disclose it to his employer and clients.", "explhtml": "<p>According to Standard I(B) Independence and Objectivity, a visit by an analyst to an out-of-the-way site may be provided by a company host if commercial transportation is unavailable or inefficient. If the use of such transportation creates the appearance of a conflict of interest or interferes with an analyst&#x27;s ability to provide unbiased opinions, Standard VI(A) Avoid or Disclose Conflicts would require the analyst to disclose it to his employer and clients.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(B)<\/div><div class=\"qtext\"><p>Joshua Rosenberg, CFA, is an equity analyst who covers Northwest Implements, a farm implement manufacturer. Northwest&#x27;s main factory is located in a sparsely inhabited region six hours by automobile from the nearest airport. Northwest has its own corporate jet and a landing strip near its facility. When Rosenberg contacts Northwest&#x27;s management to arrange a visit for a report he is preparing on the company, Northwest&#x27;s chief financial officer offers to send Northwest&#x27;s corporate jet to pick up Rosenberg from an airport near his home and return him home the same evening. Rosenberg estimates that it would require three days for him to make the visit using commercial travel. If Rosenberg makes the trip to Northwest&#x27;s headquarters on the corporate jet, the Standard concerning independence and objectivity:<\/p><\/div>", "subj": "ethics"}, {"n": 34, "q": "Marc Feldman, CFA, is manager of corporate investor relations for a high-tech startup, zippy.com, in Boise, Idaho. Feldman learns that Larry Smith, controller, is altering the accounting records. Knowing the data is incorrect, Feldman releases Smith's financial data to investors. This action:", "opts": ["constitutes a violation of Standard III(D) concerning performance presentation.", "constitutes a violation of his fundamental responsibilities under the Code and Standards.", "constitutes a violation of the Standard concerning duty to employer."], "ans": "B", "expl": "As a CFA Institute member, Feldman is bound, eone is planning or engaging in illegal activities, you should: 1. Determine the legality of the activities. Consult your supervisor and legal counsel. 2. Take appropriate action. Disassociate, attempt to persuade the perpetrator to stop. CFA Institute does not require you to report them to the authorities, but the law might.", "explhtml": "<p>If you suspect someone is planning or engaging in illegal activities, you should:<\/p><p>1. Determine the legality of the activities. Consult your supervisor and legal counsel. 2. Take appropriate action. Disassociate, attempt to persuade the perpetrator to stop. CFA Institute does not require you to report them to the authorities, but the law might.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41: I(A)<\/div><div class=\"qtext\"><p>According to the CFA Institute Standards of Professional Conduct, Standard I(A), Knowledge of the Law, members shall not knowingly participate or assist in any violations of laws, rules, or regulations. An analyst:<\/p><\/div>", "subj": "ethics"}, {"n": 37, "q": "WEB, an investment-banking firm, is the principal underwriter for MTEX's upcoming debenture issue. Wendy Berry, CFA, an analyst with WEB, has found out from an employee in MTEX's programming department that a serious glitch was recently discovered in the software program of their major new product line. In fact, the glitch is so bad that most of their orders have been canceled. Berry checked the debenture's prospectus and found no mention of this development. The red herring prospectus has already been distributed. Berry's best course of action is to:", "opts": ["notify potential investors of the omission on a fair and equitable basis.", "take no action because this is material non-public information.", "inform her immediate supervisor at WEB of her discovery."], "ans": "C", "expl": "Berry should report this information only to her immediate supervisor. Subsequently, she and her supervisor may consult with legal counsel concer
