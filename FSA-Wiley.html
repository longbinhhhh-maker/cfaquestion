oice A) $32,000 is the change in working capital in Year 2.\n(Choice B) $50,000 is the ending balance of cash in Year 1.\nThings to remember:\nBusinesses often rely on key assumptions to forecast long-term financial performance. This change in cash is forecast using assumptions about\nsales growth, profit margin, and working capital investments.\nDescribe how ratio analysis and other techniques can be used to model and forecast earnings", "qhtml": null}, {"n": 242, "q": "Which of the following is the best use of ratio analysis for a company?", "opts": ["Analyzing historical profitability ratios to make credit decisions", "Analyzing current-year liquidity ratios to confirm the company's stock performance", "Analyzing historical cross-sectional ratio trends to gain insights on the company's relative valuation"], "ans": "C", "expl": "Insights gained from financial ratio analysis\nComprehension of: Helps in assessing:\nInternal economic relationships Projected free cash flow\nCurrent financial status Ability to expand and pay debts\nManagement's strategy execution Reliance on management's claims\nPeer and time-series analysis Absolute and relative performance\nRatio analysis entails reviewing a company's activity, leverage, profitability, and valuation ratios. Detecting important economic connections\nbetween different ratios is crucial in making economic decisions; the ratios alone are just statistics regarding a company's performance.\nAnalysts seek connections between ratios from time-series or cross-sectional analyses. A company's efficiency may impact its profitability, which\nin turn affects its valuation. Analysts must use inferences from ratio analyses to form independent judgments. They then use these judgments to\narrive at economic conclusions (eg, creditworthiness, stock price).\n(Choice A) Historical profitability ratios show the company's ability to generate profit, but since profit is different from cash flow, these ratios are\nnot useful in determining the company's creditworthiness.\n(Choice B) The current year's liquidity ratios are data that may indicate the company's ability to pay short-term debts. Only a comprehensive\nevaluation of all ratios over time can provide an understanding of the company's overall performance, not just its liquidity.\nThings to remember:\nRatio analysis entails reviewing a company's activity, leverage, profitability, and valuation ratios. Detecting important economic connections\nbetween different ratios is crucial in making economic decisions; the ratios alone are just statistics regarding a company's performance. Analysts\nseek connections between ratios from time-series or cross-sectional analyses.\nDescribe tools and techniques used in financial analysis, including their uses and limitations", "qhtml": null}, {"n": 243, "q": "A manager prepares the following data based on a company's financial statements: Which of the following best describes why the return on equity remained constant at 16.8%?", "opts": ["The company's efficiency and profitability both improved.", "The improvement in efficiency is offset by a decline in profitability.", "Improved profitability matches the decline in the company's efficiency."], "ans": "B", "expl": "ROE measures the profits a company creates from using its equity (eg, capital). DuPont analysis entails decomposing ROE into five\ncomponents. Each component gauges a different aspect of the company's performance and provides insight into the company's strengths and\nweaknesses.\nHere, ROE remained constant since a more efficient asset turnover (increased from 0.75 to 1.20) is offset by worsening profitability (the EBIT\nmargin decreased from 0.16 to 0.10). Efficiency is measured by asset turnover or the amount of revenue produced using the firm's assets; when\nmore revenue can be produced using less asset value, the company is more efficient. Profitability is the level of profits before interest and taxes\nrelative to revenue and is considered a profit (ie, EBIT) margin.\n(Choice A) For a company to improve its profitability, the EBIT margin must increase, not decrease.\n(Choice C) The company improved its efficiency with a higher, not lower, asset turnover.\nThings to remember:\nROE measures the profits a company creates from using its equity (eg, capital). DuPont analysis decomposes ROE into five factors: tax burden,\ninterest burden, profitability, efficiency, and leverage.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 244, "q": "An analyst collects the following annual data for a company: Which of the following best describes how the company's efficiency compares with the industry?", "opts": ["The company has a receivable turnover that is better.", "The company has more effective inventory management.", "The company produces less revenue for a given asset level."], "ans": "B", "expl": "Activity ratios measure how efficient a company is and indicate its operational performance. Days of inventory on hand (DOH), an activity ratio,\nindicates management's effectiveness in overseeing its inventory. DOH is the average number of days it takes a company to convert inventory\n(eg, current assets) into revenue.\nThe ratio is calculated as the number of days in the period divided by the company's inventory turnover (COGS/average inventory). Lower DOH\nsuggests that management has a lower drain on company assets and generates revenue more quickly. Here, it has more effective inventory\nmanagement than its peers since its DOH is less than the industry average (25.42 < 29.77).\n(Choice A) Using the days of sales outstanding formula, the company's receivable turnover of 8.09 (45.10 = 365 / receivable turnover) is lower\nthan the industry's of 12.13 (30.09 = 365/receivable turnover). Its receivable turnover is worse, not better than the industry average. If the days of\nsales outstanding (DSO) is lower than the industry average, so is the receivable turnover since they are effectively the same; DSO converts\nturnover into a time measurement.\n(Choice C) Total asset turnover is a ratio that measures a company's overall efficiency; a higher ratio means the company is more efficient at\ngenerating revenue for a given level of assets. The company produces more revenue for a given asset level than its peers since its total asset\nturnover is greater (1.20 > 1.15) than the industry average.\nThings to remember:\nDays of inventory on hand (DOH) indicates management's effectiveness in overseeing its inventory. It is the average number of days it takes a\ncompany to convert inventory (eg, current assets) into revenue. Lower DOH suggests that management has a lower drain on company assets\nand generates revenue more quickly.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 245, "q": "Using DuPont analysis, an analyst compiles the following data for a company: 20X7 20X6 20X5 Return on equity 16.7% 16.5% 15.9% Return on assets 6.0% 6.2% 6.4% Based only on this information, and assuming revenue and net income were unchanged during this period, the most appropriate conclusion is that the company's: ", "opts": ["leverage increased.", "total asset turnover increased.", "average shareholders' equity increased."], "ans": "A", "expl": "Return on equity (ROE) measures the profitability generated per unit of equity invested. Simply defined, ROE is the ratio of net income to average\nshareholders' equity. DuPont analysis subdivides ROE into five underlying components: tax burden, interest burden, profitability, efficiency, and\nleverage. ROE can be expressed as the product of the company's return on assets (ROA) and leverage since profitability can be enhanced by\nusing leverage.\nROE can be further subdivided using the components of ROA, the product of net profit margin and total asset turnover. This form of ROE\ncalculation is often referred to as the three-factor model.\nIn this instance, ROE increased during the period 20X5 to 20X7. Since ROE is the product of ROA and leverage, and ROA decreased, leverage\nmust have increased to result in an increase of ROE.\nThings to remember:\nReturn on equity (ROE) measures the profitability generated per unit of equity invested. Simply defined, ROE is the ratio of net income to average\nshareholders' equity. DuPont analysis subdivides ROE into five underlying components: tax burden, interest burden, profitability, efficiency, and\nleverage. ROE can be expressed as the product of the company's return on assets and leverage.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 246, "q": "An analyst gathers the following information on two companies: ($ millions) Company A Company B Cash 100 120 Short-term marketable investments 40 25 Accounts receivable 40 55 Inventory 100 120 Current liabilities 255 275 Based on this information, compared to Company B, Company A most likely has a higher: ", "opts": ["cash ratio.", "quick ratio.", "current ratio."], "ans": "A", "expl": "Analysts use liquidity ratios to assess a company's ability to meet short-term obligations, based on some measure of current assets available\nto fund current liabilities. Three common liquidity ratios are the current ratio, quick ratio, and cash ratio, which differ in how they measure available\ncurrent assets. The denominator of each ratio is current liabilities, but their numerators are as follows:\nCurrent ratio: cash, short-term investments, accounts receivable, inventory, and prepaid expenses\nQuick ratio: assets that can be \"quickly\" liquidated (ie, cash, short-term investments, accounts receivable)\nInventory is excluded since it typically takes longer to convert to cash.\nPrepaid expenses are also excluded since typically they cannot be converted to cash.\nCash ratio: only cash and short-term investments, the most liquid of current assets\nThis makes the cash ratio the most conservative of the three measures with respect to a company's ability to satisfy its current liabilities. In this\nscenario, Company A has a higher cash ratio than Company B since Company A has more cash and short-term marketable investments relative to\nits short-term obligations.\nThings to remember:\nThe current ratio, quick ratio, and cash ratio are common liquidity ratios. All three use current liabilities as the denominator, but each has a\ndifferent numerator: all current assets in the current ratio; cash, short-term marketable investments, and receivables in the quick ratio; and cash\nand short-term marketable investments in the cash ratio. The cash ratio is the most conservative of the three measures since its current assets\nhave the highest liquidity.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 247, "q": "Company A's management wishes to increase working capital by lowering the company's average receivable collection period to the industry average. Data for Company A is below: (EUR millions) Company A Days sales outstanding (DSO) 23 days 20X7 credit sales 100 20X8 estimated credit sales 125 To match the industry average days sales outstanding (DSO) of 17 days, the change (in €) in the average daily accounts receivable (AR) balance from 20X7 to 20X8 is closest to:", "opts": ["−1,534,527", "−479,452", "1,918,159"], "ans": "B", "expl": "Days sales outstanding and accounts receivable turnover are activity ratios used to measure operational efficiency. The relationship between\ndays sales outstanding (DSO) and accounts receivable (AR) turnover can serve as an important tool for forecasting what is needed to\nreach a company's working capital goals.\nA higher DSO indicates that customers are taking longer to pay, which results in lower liquidity. A lower DSO is preferable since it means the\ncompany is collecting receivables faster, thus improving liquidity. AR turnover indicates management's effectiveness in managing the credit given\nto customers. Higher AR turnover implies greater efficiency in converting receivables to cash.\nTo solve for the change in the average daily AR:\nThings to remember:\nThe relationship between days sales outstanding (DSO) and accounts receivable (AR) turnover can serve as an important tool for forecasting what\nis needed to reach a company's working capital goals. DSO is the ratio of the average AR to the credit sales per day, and AR turnover is the ratio\nof the credit sales for the period to the average AR.\nDescribe how ratio analysis and other techniques can be used to model and forecast earnings", "qhtml": null}, {"n": 248, "q": "An analyst obtains the following information for three companies: Which of the three companies is most likely to meet its daily cash expenditures? ", "opts": ["Company A", "Company B", "Company C"], "ans": "A", "expl": "Liquidity ratios measure a firm's ability to pay its short-term liabilities. A company's defensive interval ratio (DIR) measures the time (eg, days) it\nwould take for the company to exhaust its quick assets (eg, cash + short-term marketable investments + receivables) when paying for its\nongoing expenses. If its DIR is low, the company may not be able to pay its bills.\nSome may understand this ratio as a burn rate (ie, how long it will take the company to burn through its cash and quick assets). To find the\ncompany most likely to meet its daily cash expenditure, first use the quick ratio to find the quick assets; use the quick assets to determine the DIR.\nIn this scenario, since all three companies have the same daily cash expenditures of $50,000 and the same current liabilities of $1,500,000, the\ncompany with the highest quick ratio, Company A, will have the largest amount of quick assets and the largest DIR.\nCompany A is most likely to meet is daily cash expenditures, since it has the highest DIR of 36.\n(Choice B) This choice results from incorrectly using the cash ratio to determine the assets included in the DIR. Doing so excludes accounts\nreceivable, a quick asset, and understates the DIR.\n(Choice C) This choice results from incorrectly using the current ratio to determine assets included in the DIR. This includes inventory, which is\nharder to convert to cash than quick assets and results in an overstatement of the DIR.\nThings to remember:\nA company's defensive interval ratio measures the time it would take for the company to exhaust its quick assets (eg, cash + short-term\nmarketable investments + receivables) when paying for its ongoing expenses (ie, burn through its quick assets).\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 249, "q": "An analyst calculates the following ratios for a company to assess performance over time: Ratio 20X4 20X5 20X6 Debt-to-equity 0.42 0.35 0.33 Debt-to-EBITDA 4.12 3.18 3.04 Working-capital turnover 0.64 0.59 0.54 Fixed-asset turnover 0.25 0.18 0.16 Price-to-book 8.41 8.05 7.85 Price-to-earnings 12.52 11.12 10.79 Based on this information only, the analyst can most appropriately conclude that the company's: ", "opts": ["solvency position has improved.", "operation has increased efficiency.", "stock is more expensive relative to fundamentals."], "ans": "A", "expl": "Analysts can use integrated financial ratio analysis to gauge a company's performance over time in terms of its activity or efficiency, liquidity,\nsolvency, profitability, and valuation.\nActivity ratios measure how efficiently a company uses its assets.\nLiquidity ratios measure how well a company can cover its short-term obligations with cash or assets that are easily converted to cash.\nSolvency ratios measure a company's ability to satisfy its long-term obligations.\nProfitability ratios measure a company's return on sales and return on investments.\nValuation ratios measures a company's stock price relative to its fundamentals.\nIn this scenario, solvency, as measured by debt-to-equity (Debt / Equity) and debt-to-EBITDA (Debt / EBITDA), has been improving. The\ndownward trend in both ratios indicates that the company has lowered its outstanding debt relative to its equity and EBITDA.\n(Choice B) Efficiency (ie, activity), as measured by working-capital turnover (Sales / Net working capital) and fixed asset turnover (Sales / Fixed\nassets), has worsened. Both ratios are trending down over time, indicating that the company has become less efficient at using its assets to\ngenerate sales.\n(Choice C) The stock price has become less expensive over time relative to company fundamentals, as indicated by the decreasing price-to-book\n(P/B) and price-to-earnings (P/E) ratios here. This suggests that the investors pay less for the stock relative to the company's earnings and book\nvalue.\nThings to remember:\nActivity ratios measure how effectively a company uses its assets to generate sales. Liquidity ratios measure how well a company can cover its\nshort-term obligations with liquid assets. Solvency ratios measure a company's ability to satisfy its long-term obligations. Profitability ratios\nmeasure a company's return on sales and return on investments. Valuation ratios measures stock price levels relative to the company's\nfundamentals.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 250, "q": "An analyst calculates the following ratios using a company's financial statements: Which of the following best describes the change in the company's solvency? ", "opts": ["Relative debt levels and the ability to pay interest improved.", "Relative debt levels and the ability to pay interest deteriorated.", "Relative debt levels deteriorated and the ability to pay interest improved."], "ans": "A", "expl": "Solvency is a company's capability to meet its long-term debt obligations (eg, interest and principal). In evaluating a company's debt, there are\ntwo types of solvency ratios:\nDebt ratios gauge a company's relative debt levels, based on balance sheet accounts. Lower relative debt ratios decrease financial risk\n(eg, result in less asset value financed by debt); this leads to stronger solvency.\nCoverage ratios assess a company's ability to pay (cover) its interest payments, based on income statement accounts. Higher coverage\nratios mean the company's solvency is stronger since it has relatively more earnings to pay interest.\nThe company's debt-to-asset and debt-to-equity ratios decreased from 0.50 to 0.40 and from 1.10 to 0.90, respectively, showing that relative debt\nlevels decreased. The company's fixed charge and interest coverage ratios increased from 2.0 to 2.5 and from 2.40 to 3.10, respectively, showing\nthat the company's ability to pay interest also improved. The company's solvency is stronger due to lower financial risk and a better ability to pay\nits obligations (Choices B and C).\nThings to remember:\nSolvency is a company's capability to meet its long-term debt obligations. Debt ratios help explain a company's relative debt level: the lower the\nnumber, the stronger the company's solvency. Coverage ratios evaluate a company's ability to pay (cover) its interest payments. The company\nimproves its solvency as coverage ratios increase.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 251, "q": "An analyst gathers the following data to compare two companies' performance. Company Company ($ millions) A B Revenue 1,000 800 EBITDA 200 250 Net income 150 188 Long-term debt 700 800 Total assets 1,200 1,600 The analyst calculates only three ratios: Debt-to-EBITDA, net profit margin, and total asset turnover. Based only on these three ratios, the analyst can most appropriately conclude that Company A has better:", "opts": ["solvency.", "efficiency.", "profitability."], "ans": "B", "expl": "Analysts use integrated financial ratio analysis to gauge a company's performance in terms of its activity or efficiency, liquidity, solvency, and\nprofitability.\nActivity ratios measure how efficiently a company utilizes its assets.\nLiquidity ratios measure how well a company can cover its short-term obligations with cash or with assets that are easily converted to cash.\nSolvency ratios measure a company's ability to satisfy its long-term obligations.\nProfitability ratios measure a company's return on sales and return on investments. Return on sales measures the margin earned from\nsales. Return on investment measures the profit from invested capital (eg, equity).\nFrom the information provided in the question, solvency is measured by Debt-to-EBITDA ratio, efficiency is measured by total asset turnover,\nand profitability is measured by net profit margin. After calculating the three ratios, the analyst can most appropriately conclude that Company\nA has better efficiency (0.83 vs. 0.50) since it is better at utilizing its assets to generate sales.\n(Choice A) Company B has better solvency as measured by a lower Debt-to-EBITDA ratio.\n(Choice C) Company B has better profitability as measured by net profit margin.\nThings to remember:\nActivity ratios measure how efficiently a company utilizes its assets to generate sales. Liquidity ratios measure how well a company can cover its\nshort-term obligations with liquid assets. Solvency ratios measure a company's ability to satisfy its long-term obligations. Profitability ratios\nmeasure a company's return on sales and return on investments.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 252, "q": "A credit card provider conducts a consumer preference survey, which reveals that \"Clients are likely to replace their credit cards with digital wallets or cryptocurrencies, which are more versatile and affordable.\" Based only on this survey result, which of Porter's five forces is most likely to weaken the company's pricing power?", "opts": ["Threat of substitutes", "Threat of new entrants", "Bargaining power of customers"], "ans": "A", "expl": "Porter's five forces:\nEffects on prices, costs, and profitability\nPricing power is limited when…\nSubstitutes exist\nThreat of substitutes\nSwitching costs are low\nIndustries are fragmented and have\nLimited growth\nRivalry among incumbents High exit barriers\nHigh fixed costs\nIdentical products\nSupplier is greater in size than buyer\nBargaining power of suppliers* Demand is relatively inelastic\nNo alternatives are available\nThe market is fragmented\nBargaining power of customers Products are nonstandardized\nSwitching costs are low\nThreat of new entrants The threat of new entrants is high (eg, low barriers to entry)\n*Bargaining power of suppliers affects the prices of input costs.\nPorter's five forces framework is commonly used to assess and forecast how the competitive environment of an industry affects prices and costs.\nThe threat of substitutes measures how easily a customer can switch to an existing substitute product, considering factors such as:\nswitching costs (eg, whether a service can be canceled without significant losses),\ncustomer loyalty, and\ncharacteristics of the substitute product(s), such as functionality, performance, and price.\nIn this situation, the survey reveals that clients are likely to switch to digital wallets or cryptocurrencies and that they consider such products more\nversatile and affordable. This leads to the conclusion that the threat of substitutes is high, which restricts the credit card provider's ability to\nraise fees without a negative impact on sales volume (ie, its pricing power).\n(Choice B) Digital wallets and digital assets like cryptocurrencies are examples of substitutes, not new entrants in the credit card industry. The\nthreat of new entrants is driven by low barriers to entry and low switching costs, which were not mentioned in the stem.\n(Choice C) Customers have a positive perception of digital wallets and cryptocurrencies. This increases the threat of substitutes but does not\nincrease customers' bargaining power, which is affected by factors like buyer concentration and volume.\nThings to remember:\nPorter's five forces framework gives analysts valuable insights when forecasting prices and costs. The threat of substitutes measures how easily a\ncustomer can switch to an existing substitute product and considers factors such as switching costs, customer loyalty, and characteristics of the\nsubstitute product(s).\nExplain how the competitive position of a company based on a Porter’s five forces analysis affects prices and costs", "qhtml": null}, {"n": 253, "q": "Three manufacturers dominate the canned fruit market and buy fruits from a fragmented market of many farmers. However, a large agricultural distributor enters the fruit market, sourcing the fruits from the farmers, which forces the manufacturers to buy directly from the distributor. Based only on this information and on Porter's framework, which of the following forces is most likely weakening the manufacturers' competitive position?", "opts": ["Threat of new entrants", "Rivalry among incumbents", "Bargaining power of suppliers"], "ans": "C", "expl": "Porter's five forces:\nEffects on prices, costs, and profitability\nPricing power is limited when…\nSubstitutes exist\nThreat of substitutes\nSwitching costs are low\nIndustries are fragmented and have\nLimited growth\nRivalry among incumbents High exit barriers\nHigh fixed costs\nIdentical products\nSupplier is greater in size than buyer\nBargaining power of suppliers* Demand is relatively inelastic\nNo alternatives are available\nThe market is fragmented\nBargaining power of customers Products are nonstandardized\nSwitching costs are low\nThreat of new entrants The threat of new entrants is high (eg, low barriers to entry)\n*Bargaining power of suppliers affects the prices of input costs.\nPorter's five forces framework is commonly used to assess how the competitive environment of an industry can affect prices and costs. This\nmethodology gives analysts valuable insights when forecasting revenues and margins.\nThe bargaining power of suppliers denotes the level of influence or leverage that suppliers have when negotiating prices, terms, and\nconditions. Suppliers may have stronger bargaining power in an industry when, for example:\nThere are few suppliers, and each is greater in size than the firms in the industry\nSuppliers offer differentiated or specialized products or services\nThere are no readily available substitutes and/or the costs to switch suppliers are high\nIn this situation, the entrance of a large agricultural distributor, an intermediary that consolidates the manufacturers' supply sources, increases\nthe bargaining power of suppliers and weakens the manufacturers' leverage when buying inputs (ie, fruits).\n(Choice A) The threat of new entrants refers to new competitors entering the canned fruit market and directly competing with the food\nmanufacturers. However, the agricultural distributor is a supplier, not a competitor.\n(Choice B) Rivalry among incumbents relates to the competitive landscape (eg, price competition, number and size of competitors, and product\ndifferentiation) in the food manufacturers' market of canned fruits. There is no change in the intensity of competition between the three food\nmanufacturers.\nThings to remember:\nPorter's five forces framework gives analysts valuable insights into prices and costs when forecasting revenues and margins. The bargaining\npower of suppliers denotes the level of influence or leverage that suppliers have when negotiating prices, terms, and conditions with buyers.\nExplain how the competitive position of a company based on a Porter’s five forces analysis affects prices and costs", "qhtml": null}, {"n": 254, "q": "At the beginning of the fiscal year, a CEO provides optimistic annual EPS guidance, citing strong government-sector demand. Throughout the year, unforeseen tariffs significantly increase raw material costs. The CEO declines to revise forecasts, stating that the company's solid fundamentals should be able to offset gross margin compression. Based only on this information, which of the following biases does the CEO least likely exhibit?", "opts": ["Conservatism bias", "Illusion of control bias", "Representativeness bias"], "ans": "C", "expl": "Behavioral biases affecting analyst forecasts and their remedies\nBias Description Remedy\nHaving unjustified faith in own capacity Review past forecasts, assess relative accuracy\nOverconfidence\nand abilities Apply scenario analysis\nOverestimating own ability to control forecast Restrict number of model variables and expert\nIllusion of control\naccuracy opinions\nBeing reluctant to incorporate new information (eg, Regular review of models by an investment team\nConservatism\nanchoring) Flexible models, fewer variables\nClassifying new data based on past For base-rate neglect, consider both outside and\nRepresentativeness\nviews or experience (eg, base-rate neglect) inside information\nSelecting data that confirm beliefs and discarding Seek different perspectives (eg, neutral or negative\nConfirmation\nconflicting data opinions)\nBehavioral biases often lead to forecasting errors. Analysts should recognize that biases exist and account for these biases in their analyses.\nConservatism bias (eg, anchoring) occurs when individuals are reluctant to update a prior forecast to reflect new information.\nIllusion of control bias occurs when individuals overestimate their ability to control an outcome.\nRepresentativeness bias occurs when individuals form opinions based on past experiences or known classifications, dismissing the\nspecifics of the current situation.\nIn this scenario, the CEO exhibits conservatism in upholding the optimistic prior forecast in spite of contradictory evidence of rising costs (Choice\nA). The CEO also exhibits illusion of control by thinking the company can maintain its EPS through its solid fundamentals (Choice B). However,\nthese actions are insufficient to clearly indicate representativeness since there is no indication of the CEO applying past beliefs or known\nclassifications to conclude that the tariffs will not affect EPS.\nThings to remember:\nConservatism bias occurs when individuals are reluctant to update a prior forecast after receiving new information. Illusion of control bias occurs\nwhen individuals overestimate their ability to control an outcome. Representativeness bias occurs when individuals form opinions based on past\nexperiences or known classifications.\nExplain how behavioral factors affect analyst forecasts and recommend remedial actions for analyst biases", "qhtml": null}, {"n": 255, "q": "A surge in the price of cotton and labor costs is increasing input costs in the apparel industry. While most competitors decide to adjust their prices by the full increase in costs, one company decides to pass on only a portion of that increase. As a result, the company would most likely incur a decrease to its:", "opts": ["revenues.", "sales volume.", "gross margin percentage."], "ans": "C", "expl": "Effects of pricing strategy in inflationary and deflationary environments\nInflation Deflation\nPricing strategy Gross margin % Sales volume Gross margin % Sales volume\nAdjust faster than competitors ⇧ ⇩ ⇩ ⇧\nAdjust slower than competitors or partially ⇩ ⇧ ⇧ ⇩\nUnderstanding a company's pricing strategy (eg, preserving margins or increasing market share) is especially critical to forecasting during\nsignificant inflationary or deflationary conditions. Companies can decide whether to pass the total cost variation, or only a portion of it, to prices\nand have the flexibility to adjust prices more rapidly or slowly than their competitors. Analysts need to anticipate companies' reactions to\ncompetitors' strategies and to the economic environment and understand the factors driving those reactions.\nIn this instance, most companies in the apparel industry are raising their prices by the full increase in input costs. However, one company decides\nto pass on only a portion of the increase. This strategy will likely result in a(n):\nincrease in sales volume since the company will be selling its products at a relatively lower price than its competitors. Except in the rare\nsituation where demand is perfectly inelastic, some consumers will likely switch from more expensive to less expensive products (Choice\nB).\nincrease in revenues since both sales volume and prices are increasing (Choice A).\ndecrease in gross margin percentage since input costs are increasing by a higher percentage than prices. Note, however, that the\namount of gross margin (ie, revenues less COGS) may increase if a greater sales volume leads revenue to increase more than COGS.\nThings to remember:\nWhen inflationary or deflationary conditions are present, companies may adjust prices more rapidly or slowly than their competitors and will decide\nthe percentage of cost variations they pass on to prices. These decisions depend on a company's strategic objectives and have distinct impacts\non revenues and margins.\nExplain how to forecast industry and company sales and costs when they are subject to price inflation or deflation", "qhtml": null}, {"n": 256, "q": "Country A is currently in an inflationary environment. A multinational corporation that sources most of its inputs from Country A increases its global prices based on the change in Country A's general consumer price index (CPI). All else equal, this strategy will most likely reduce:", "opts": ["revenues if demand is highly price inelastic.", "market share if competitors in other countries raise prices by a higher rate.", "gross margin percentage if input costs increase more than Country A's CPI."], "ans": "C", "expl": "Factors influencing revenue forecasts with inflation\nInelastic: raising prices increases revenues\nPrice elasticity of demand\nElastic: raising prices may decrease revenues\nGeographic mix of revenues must be considered\nInflation rates in different countries\nDifferences in inflation rates usually affect exchange rates\nInflation does not affect all input costs equally\nChanges in relevant costs\nProper identification of affected relevant costs is essential\nPassing full costs to customers preserves margins\nPricing strategy\nPartial increase in prices may increase market share\nTo forecast revenues and costs, analysts need to understand the following:\nproduct price sensitivity, or the price elasticity of demand,\ndifferences in inflation rates across countries,\nvariation in the company's relevant costs, and\npricing strategies.\nUnderstanding how a company's significant input costs (eg, raw material, products for reselling) are affected by inflation can give the analyst\ninsights into how different strategies of price adjustment may affect margins.\nIn this situation, the company increases its prices in line with the change in Country A's CPI (ie, general inflation), most likely to preserve margins.\nThe final effect of this increase depends on the characteristics of the industry and the company. For example, if the increase in the company's\ncosts exceeds the CPI rate, and therefore exceeds the rate of increase in the company's global prices, then gross margin percentage will most\nlikely decrease.\n(Choice A) If demand for the company's products is highly price inelastic, an increase in price will have little effect on quantity demanded and will\nlikely increase revenues. Therefore, the analyst should predict an increase in revenues in the financial model.\n(Choice B) If competitors in other countries are increasing their prices by more than the inflation in Country A, the company's global prices will be\nrelatively lower than competitors', despite the increase based on the CPI rate. This will likely result in an increase in market share, not a reduction.\nThings to remember:\nTo forecast revenues and costs, analysts need to understand price elasticity of demand, differences in international inflation, and pricing strategy.\nUnderstanding how input costs vary compared with inflation is critical; for example, if input costs increase by more than the change in CPI,\nadjusting prices by the CPI rate will most likely decrease gross margin percentage.\nExplain how to forecast industry and company sales and costs when they are subject to price inflation or deflation", "qhtml": null}, {"n": 257, "q": "A buy-side analyst of a large-cap mutual fund is evaluating an apparel company's stock as a possible addition to the fund. The analyst decides to create a valuation model with a five-year forecast horizon. Which of the following factors would best justify the analyst's decision?", "opts": ["The horizon is greater than the industry's business cycle.", "The average annual portfolio turnover of the large-cap fund is 20%.", "The apparel company expects to make a major acquisition in the next five years."], "ans": "B", "expl": "Forecasting investment performance: factors influencing the forecast horizon\nPortfolio holding period (HP)\nInvestment strategy\nHP ≈ 1 / Portfolio turnover\nLonger cycles → longer horizons\nCyclicality\nExpected mid-cycle levels of sales and profitability\nAcquisitions and restructurings\nCompany-specific factors\nPeriod during which effects impact financials\nEmployer's preferences Parameters established by analyst's employer\nSeveral factors may influence the investment analyst when selecting the forecast time horizon. These include the investment strategy associated\nwith the security, the cyclical nature of the industry, company-specific considerations, and the preferences of the analyst's employer.\nIn keeping with the investment strategy, one approach is to determine the forecast horizon as the reciprocal of the average portfolio turnover.\nFor instance, if a fund has an annual turnover of 10%, it implies that the assets within the portfolio are expected to be sold or replaced every 10 (=\n1 / 0.10) years on average; consequently, a 10-year forecast horizon would be well-suited for this fund. For the apparel company, the analyst uses\na forecast horizon of five years, implying an average annual portfolio turnover of 20% (= 1 / 5).\n(Choice A) The length of the forecast horizon should be sufficient for the company to achieve its mid-cycle level of sales and earnings. The\nforecast horizon does not need to be greater than the business cycle for the industry.\n(Choice C) If the company is planning a major acquisition, the forecast horizon should cover the period during which the effects and benefits of\nthe acquisition will reflect in the company's financial statements. Consequently, if the acquisition is projected to occur within the next five years,\nthe analyst should use a forecast horizon greater than this five-year time frame.\nThings to remember:\nWhen forecasting an investment's performance, an analyst may determine the forecast horizon as the reciprocal of the average portfolio turnover.\nOther factors affecting forecast horizon include the cyclical nature of the industry, company-specific considerations, and the preferences of the\nanalyst's employer.\nExplain considerations in the choice of an explicit forecast horizon and an analyst’s choices in developing projections beyond the short-term\nforecast horizon", "qhtml": null}, {"n": 258, "q": "A financial controller believes that the firm will have poor cash flow performance next year and asks an analyst to forecast free cash flows. While reviewing the analyst's underlying assumptions, the controller focuses on unfavorable factors such as large replacement capital expenditure requirements while ignoring favorable factors such as high sales growth and improved working capital management. This financial controller's behavior when reviewing the analyst's forecast is most accurately described as: ", "opts": ["confirmation bias.", "overconfidence bias.", "representativeness bias."], "ans": "A", "expl": "Behavioral biases affecting analyst forecasts and their remedies\nBias Description Remedy\nHaving unjustified faith in own capacity Review past forecasts, assess relative accuracy\nOverconfidence\nand abilities Apply scenario analysis\nOverestimating own ability to control forecast Restrict number of model variables and expert\nIllusion of control\naccuracy opinions\nBeing reluctant to incorporate new information (eg, Regular review of models by an investment team\nConservatism\nanchoring) Flexible models, fewer variables\nClassifying new data based on past For base-rate neglect, consider both outside and\nRepresentativeness\nviews or experience (eg, base-rate neglect) inside information\nSelecting data that confirm beliefs and discarding Seek different perspectives (eg, neutral or negative\nConfirmation\nconflicting data opinions)\nBehavioral biases often impact decision making and lead to forecasting errors. Confirmation bias arises when individuals selectively accept\ninformation that confirms their existing beliefs and reject information that contradicts these beliefs.\nIn this scenario, the controller believes that the firm will have poor cash flow performance next year. When the analyst presents forecast\nassumptions, the controller actively notices unfavorable factors that support poor cash flow performance. Simultaneously, the controller ignores\nfavorable factors, such as high sales growth and improved working capital management, that contradict expectations of poor cash flow\nperformance.\n(Choice B) Overconfidence bias occurs when individuals are overly confident in their forecasting precision. Although the manager may exhibit\nsome level of overconfidence, selective filtering of new information is best described as confirmation bias.\n(Choice C) Representativeness bias occurs when people make assessments based on views formed from past experiences while ignoring the\nspecifics of the current situation. This question does not explicitly mention any views from past experience.\nThings to remember:\nBehavioral biases often impact decision making and lead to forecasting errors. Confirmation bias occurs when individuals selectively accept\ninformation that confirms their existing beliefs and reject information that contradicts these beliefs.\nExplain how behavioral factors affect analyst forecasts and recommend remedial actions for analyst biases", "qhtml": null}, {"n": 259, "q": "A global clothing company reports the following 20X1 financial results for one of its business units: in € millions 20X1 Revenue 100.00 COGS 30.00 Gross profit 70.00 SG&A 50.00 EBIT 20.00 A forecast of 20X3 operating profits (EBIT) for this business unit assumes that: Volume will contribute 7% to annual sales growth each year. Price/mix will contribute 3% to annual sales growth each year. Net foreign currency fluctuation is expected to reduce annual sales growth by 1% each year. COGS is expected to be 30% of revenue each year. SG&A is expected to be 50% of revenue each year. Sales growth is calculated geometrically. Using these assumptions, the 20X3 EBIT forecast (in € millions) for the business unit is closest to:", "opts": ["21.82", "23.76", "23.81"], "ans": "C", "expl": "The first step when building a sale-based pro forma financial model is to forecast revenue. Revenue growth is typically based on volume\ngrowth, price growth, changes to the product mix, foreign currency fluctuations, and acquisitions. After projected revenues are modeled, analysts\noften determine expenses (eg, COGS, SG&A) based on a percent of revenue. The expense percentages are frequently based on a combination\nof historical average and management guidance.\nCalculate Annual revenue growth\nannual = (1 + Volume growth %)(1 + Price/mix growth %)(1 + Foreign currency change %) − 1\ngrowth = (1 + 0.07)(1 + 0.03)(1 + −0.01) − 1\nrate* = 0.0911 or 9.11%\nCalculate\nRevenue = Revenue × (1 + Growth rate)2\n20X3 20X1\n20X3\n= 100 × (1 + 0.0911)2 = 119.05\nrevenue\n*Revenue growth is calculated geometrically in this scenario\nThen apply COGS and SG&A percentages to 20X3 revenue to determine expenses and operating profit (EBIT):\nin € millions 20X1 20X3\nRevenue 100.00 119.05\nCOGS 30.00 35.71 ← 119.05 × 30%\nGross profit 70.00 83.33\nSG&A 50.00 59.52 ← 119.05 × 50%\nEBIT 20.00 23.81\nThings to remember:\nA sales-based pro forma model is built by first forecasting sales and then determining expenses as a percent of sales. Sales growth is based on\nvolume, price, mix, foreign exchange fluctuations, and acquisitions. Expenses are often calculated by applying a historical percentage to sales.\nDemonstrate the development of a sales-based pro forma company model\n9.A company has annual revenues of $1.5 billion. An analyst forecasting next year's revenues expects volume growth of 6%, a positive forex\nimpact of $90 million, and a positive impact of $111 million from an acquisition. If the analyst expects total revenue growth of 30%, organic growth\nis closest to:\nA. 10.0%\n\nB. 16.6%\nC. 22.6%\nExplanation\nForecasting revenues is the first step of the income statement forecast process. Analysts want to predict a company's organic growth, which is\ndefined as the change in revenue driven by changes in volume (ie, quantity of units sold, or services rendered) and price. Price changes can be\ndriven by variations in prices of individual products or changes to the product mix.\nBesides organic growth, revenue is also affected by changes in foreign exchange (forex) rates (for multinational corporations), and by scope\nchanges (eg, acquisitions or divestitures). In this situation, the company has annual revenue of $1.5 billion, and the analyst expects next year's\ntotal revenues to increase by $450 million (= 1.5 billion × 30%).\nThis projected $450 million increase includes the forex impact ($90 million) and scope change ($111 million), so organic growth can be calculated\nas:\nOrganic growth = Total revenue growth − Forex impact − Scope change = 450 − 90 − 111 = 249\nOrganic growth (%) = 249 / 1,500 = 0.166 ≈ 16.6%\nTherefore, the analyst estimates an organic growth rate of 16.6%. Given that the expected volume growth is 6%, the effect of price changes on\ntotal revenue can be estimated as 10% [= (1.166 / 1.06) − 1] (Choice A).\n(Choice C) 22.6% [= (450 − 111) / 1,500] results from excluding only the scope change from total revenue growth. Therefore, this rate is not the\norganic growth since it includes the forex impact.\nThings to remember:\nOrganic growth is defined as the change in revenue driven by changes in volume and price, including product mix. Total revenue growth is\nestimated as the sum of organic growth, forex impact, and scope changes, such as acquisitions or divestitures.\nDemonstrate the development of a sales-based pro forma company model", "qhtml": null}, {"n": 260, "q": "A company has annual revenues of $1.5 billion. An analyst forecasting next year's revenues expects volume growth of 6%, a positive forex impact of $90 million, and a positive impact of $111 million from an acquisition. If the analyst expects total revenue growth of 30%, organic growth is closest to:", "opts": ["10.0%", "16.6%", "22.6%"], "ans": "B", "expl": "Forecasting revenues is the first step of the income statement forecast process. Analysts want to predict a company's organic growth, which is\ndefined as the change in revenue driven by changes in volume (ie, quantity of units sold, or services rendered) and price. Price changes can be\ndriven by variations in prices of individual products or changes to the product mix.\nBesides organic growth, revenue is also affected by changes in foreign exchange (forex) rates (for multinational corporations), and by scope\nchanges (eg, acquisitions or divestitures). In this situation, the company has annual revenue of $1.5 billion, and the analyst expects next year's\ntotal revenues to increase by $450 million (= 1.5 billion × 30%).\nThis projected $450 million increase includes the forex impact ($90 million) and scope change ($111 million), so organic growth can be calculated\nas:\nOrganic growth = Total revenue growth − Forex impact − Scope change = 450 − 90 − 111 = 249\nOrganic growth (%) = 249 / 1,500 = 0.166 ≈ 16.6%\nTherefore, the analyst estimates an organic growth rate of 16.6%. Given that the expected volume growth is 6%, the effect of price changes on\ntotal revenue can be estimated as 10% [= (1.166 / 1.06) − 1] (Choice A).\n(Choice C) 22.6% [= (450 − 111) / 1,500] results from excluding only the scope change from total revenue growth. Therefore, this rate is not the\norganic growth since it includes the forex impact.\nThings to remember:\nOrganic growth is defined as the change in revenue driven by changes in volume and price, including product mix. Total revenue growth is\nestimated as the sum of organic growth, forex impact, and scope changes, such as acquisitions or divestitures.\nDemonstrate the development of a sales-based pro forma company model", "qhtml": null}, {"n": 261, "q": "Due to a deflationary environment, a company is benefitting from a reduction in the cost of its main inputs. Since the company is in a competitive industry, which of the following strategies would most likely increase sales volume in the short run?", "opts": ["Keeping prices unchanged", "Reducing prices by a smaller percentage than industry rivals", "Passing cost variation to customers faster than its competitors"], "ans": "C", "expl": "Effects of pricing strategy in inflationary and deflationary environments\nInflation Deflation\nPricing strategy Gross margin % Sales volume Gross margin % Sales volume\nAdjust faster than competitors ⇧ ⇩ ⇩ ⇧\nAdjust slower than competitors or partially ⇩ ⇧ ⇧ ⇩\nCompanies may adopt different pricing strategies depending on their strategic objectives, such as preserving margins or increasing market share.\nAnalysts must understand and predict such strategic effects when forecasting revenues, especially in inflationary or deflationary conditions.\nWhen companies face changes in input costs, pricing strategies may differ. A company typically focuses on:\nThe pace at which it changes its prices: faster or slower than competitors\nThe percentage of cost variation transferred to prices: passing on total or partial variation\nIn this situation, a deflationary environment has resulted in a decline in input costs for the company. If the company reduces prices faster than its\ncompetitors, it will be offering its products at a relatively lower price, increasing sales volume in the short run. Note that this benefit is usually\ntemporary since competitors often react quickly, making it difficult for analysts to accurately predict the price-volume trade-off.\n(Choices A and B) The company operates in a competitive market and faces a deflationary environment (ie, prices are falling). Keeping prices\nunchanged or decreasing them less than competitors would make the company's prices higher relative to competitors', resulting in a decrease in\nsales volume and market share.\nThings to remember:\nPricing strategies typically focus on the pace at which a company changes its prices (ie, faster or slower than competitors) and the percentage of\ncost variation transferred to prices (ie, partial or full variation). In a deflationary environment, companies that reduce prices faster than competitors\ntypically increase sales volume in the short run.\nExplain how to forecast industry and company sales and costs when they are subject to price inflation or deflation", "qhtml": null}, {"n": 262, "q": "A company had revenues of €500 million and a gross profit margin of 40% in Year 1. An analyst forecasting revenues for Year 2 estimates an increase of 7% in the average price and sales volume growth of 10%. The analyst also assumes that the company will experience a 2% inflation rate on COGS. The forecasted gross profit (€ million) in Year 2 is closest to:", "opts": ["249.0", "251.9", "282.5"], "ans": "B", "expl": "Forecasting gross profit\nOrganic (revenue) growth = (1 + Volume growth) × (1 + Average price increase) − 1\nCOGS increase = (1 + Volume growth) × (1 + Inflation on costs) − 1\nForecasting revenues is the first step of the income statement forecast process. Revenue forecasts are typically determined by estimates of\nchanges in:\nvolume (ie, quantity of units sold or services rendered),\naverage price, which also accounts for changes in mix (of products), and\nforeign exchange (forex) rates.\nRevenue may also be affected by scope changes, such as acquisitions or divestitures. In this situation, the analyst does not assume any scope\nchange or forex impact, so revenue is calculated as:\nYear 2 revenue = Year 1 revenue × (1 + Organic growth) = 500 × {1 + [(1.10 × 1.07) − 1]} = 588.50\nSince the gross profit margin in Year 1 was 40%, COGS was 300 [= (1 − 0.40) × 500]. COGS grows according to changes in volume and the\ninflation rate. So:\nYear 2 COGS = Year 1 COGS × (1 + COGS increase) = 300 × {1 + [(1.10 × 1.02) −1]} = 336.60\nTherefore, the forecasted gross profit in Year 2 is €251.9 million (= 588.50 − 336.60), a gross profit margin of 42.8%.\n(Choice A) €249.0 million results from calculating organic growth as 17% and COGS increase as 12%, that is, adding the rates instead of\nmultiplying the factors (ie, 1 + Δ%).\n(Choice C) €282.5 million results from increasing COGS only by inflation, which is the average increase in the cost of each unit sold. The 10%\nvolume growth should also be included in the calculation.\nThings to remember:\nRevenue forecasts are typically determined by estimates of changes in volume and average price (ie, organic growth). Revenue may also be\naffected by foreign exchange rates and scope changes, such as acquisitions or divestitures. COGS grows according to changes in volume and\nthe inflation rate.\nDemonstrate the development of a sales-based pro forma company model", "qhtml": null}, {"n": 263, "q": "A supervisor revises the forecasts of her team of analysts. She notices that one of the analysts builds excessively complex financial models, relying on numerous specific assumptions, and seeks the opinions of an uncommonly large number of experts. The analyst most likely displays which of the following behavioral biases?", "opts": ["Confirmation", "Illusion of control", "Representativeness"], "ans": "B", "expl": "Behavioral biases affecting analyst forecasts and their remedies\nBias Description Remedy\nHaving unjustified faith in own capacity Review past forecasts, assess relative accuracy\nOverconfidence\nand abilities Apply scenario analysis\nOverestimating own ability to control forecast Restrict number of model variables and expert\nIllusion of control\naccuracy opinions\nBeing reluctant to incorporate new information (eg, Regular review of models by an investment team\nConservatism\nanchoring) Flexible models, fewer variables\nClassifying new data based on past For base-rate neglect, consider both outside and\nRepresentativeness\nviews or experience (eg, base-rate neglect) inside information\nSelecting data that confirm beliefs and discarding Seek different perspectives (eg, neutral or negative\nConfirmation\nconflicting data opinions)\nAnalysts are vulnerable to behavioral biases that may result in forecasting errors. Analysts should recognize that biases exist and perform\nanalyses that account for these biases. One such bias is known as illusion of control, in which analysts tend to overestimate their own ability to\ncontrol the accuracy of their financial forecasts and, as a result, create unduly complex models compiled with excessive and often immaterial\ninformation.\nIn this situation, the supervisor notices that one analyst builds overly complex financial models. It can be time-consuming and difficult to update\nintricate models, and such models are often overfitted. The analyst also seeks opinions of an unusually large number of experts.\nConstructing models with an excessive number of variables is usually less effective and may lead to misleading results. These are typical\nmanifestations of illusion of control.\n(Choice A) Confirmation bias leads analysts to select data that confirm their beliefs and to discard or overlook conflicting data. In this situation,\nthe analyst is not selecting data but gathering excessive information.\n(Choice C) Representativeness bias leads analysts to classify new data based on past views or experiences. The supervisor does not note this\nin the analyst's behavior.\nThings to remember:\nAnalysts are vulnerable to behavioral biases that may result in forecasting errors. Illusion of control leads analysts to overestimate their own ability\nto control their forecasting accuracy, resulting in building very complex financial models and obtaining excessive information.\nExplain how behavioral factors affect analyst forecasts and recommend remedial actions for analyst biases", "qhtml": null}];
const CFG = {"title": "Financial Statement Analysis — Wiley/UWorld Q-bank", "subtitle": "CFA Level I · Wiley 2024 · 263 câu · không giới hạn giờ", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
