?", "opts": ["Interest received on city and state government bonds", "Compensation paid in the future with shares of company stock", "Fines paid to a government agency to settle violations of security laws"], "ans": "B", "expl": "Deferred tax assets (DTA) and deferred tax liabilities (DTL) arise from temporary differences between pretax income and taxable income.\nCompensation in stock is a deductible expense, and for financial reporting, the company deducts the market value of the shares in the period that\nit accrues the expense. The company will deduct the value of the shares for tax purposes in the future period when it delivers the shares.\nThe lack of tax deductibility in the current period means that the company pays more taxes than it reports as tax expenses. This is a temporary\ndifference since the company will pay less tax in the period of delivery than it pays in the current period. To account for the difference, the\ncompany creates a DTA. This advises investors and analysts that the discrepancy between what the company pays in tax currently and what it\nreports as tax expense will reverse in a future period.\nWhen the discrepancy is permanent (ie, will never reverse), no deferred tax item is created. The chart below shows items that lead to\npermanent differences:\nMajor areas resulting in permanent differences between pretax and taxable income\nItem Impact Reason\nInterest on state and local Pretax income > taxable\nInterest is tax-free\ngovernment bonds income\nFines and penalties Fines are tax-deductible\nTaxable income > pretax\nCertain entertainment expenses Not all are fully tax-deductible\nincome\nCertain benefits for senior Some benefits, such as company-paid premiums on life insurance,\nmanagement are not tax-deductible\nCompanies include interest on municipal (state and local) bonds as revenue for financial reporting, but municipal bond interest is never taxable to\nthe recipient (Choice A). Similarly, fines imposed by a government agency are deducted as an operating expense for financial reporting, but fines\ncannot be deducted when calculating taxable income (Choice C).\nThings to remember:\nCompensation paid in company stock is tax-deductible in the period of delivery. If that period is later than the period that it accrues the expense, it\ncreates a deferred tax asset to account for the difference between its tax expense and taxes payable. Only temporary differences give rise to\ndeferred tax assets and liabilities.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 170, "q": "A company has a tax rate of 25% and reports an income tax expense of CAD 100 million and taxes payable of CAD 75 million for the current year. If this difference is due solely to using different depreciation methods for financial reporting and tax purposes, the company most likely has a:", "opts": ["CAD 25 million deferred tax asset.", "CAD 25 million deferred tax liability.", "CAD 18.75 million deferred tax liability."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred tax assets and liabilities arise from the difference between income tax expense and taxes payable for a period. Income tax expense is\nbased on pretax income from the income statement and is shown for financial reporting (accounting) purposes. Taxes payable is based on\ntaxable income on the tax return and is the actual amount owed to the government.\nA deferred tax liability occurs when income tax expense is more than taxes payable. This means that the company pays less taxes for the current\nyear than what it reports as income tax expense (on the income statement), thereby generating a liability.\nIn this case, a temporary difference in depreciation for the current year caused income tax expense (CAD 100 million) to be more than income tax\npayable (CAD 75 million), resulting in a CAD 25 million deferred tax liability.\n(Choice A) A deferred tax asset is created when income tax expense is less than taxes payable, not more.\n(Choice C) CAD 18.75 million results from incorrectly multiplying the deferred tax liability by (1 − tax rate).\nThings to remember:\nDeferred tax liabilities occur when income tax expense is more than taxes payable. This means that the company underpays taxes for the current\nyear, thereby producing a deferred tax liability that is likely to be paid in the future. Differences in depreciation methods used for accounting\nversus tax purposes frequently lead to deferred tax liabilities.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 171, "q": "A mining company reports financial results under IFRS. It reports the following information for 20X8 and 20X9: (ZAR thousands) 20X9 20X8 Deferred tax assets 15 18 Deferred tax liabilities 21 14 Taxes payable 35 29 Based on this information, the income tax expense that this company reports in 20X9 is closest to:", "opts": ["ZAR 25,000", "ZAR 41,000", "ZAR 45,000"], "ans": "C", "expl": "Tax expense and taxes payable both relate to a company's income taxes for the year. The table below shows the relationship:\nTax expense and taxes payable differ for two primary reasons: whether the company has recorded deferred tax assets (DTA) and/or deferred tax\nliabilities (DTL), and the changes in those deferred items from the previous year. DTL arise when a company reports lower revenues or higher\nexpenses for tax purposes than for financial accounting. DTA arise in the reverse situation.\nDTL signal that the company will owe more taxes in the future than it paid this period. DTA signal the opposite. The company's DTL increased by\nZAR 7,000 from 20X8 to 20X9, indicating that the company owes an additional ZAR 7,000 in the future. However, the company's decrease in\nDTA also increases its future tax obligations, so the change in DTA is added to the 20X9 taxes payable (subtracting a negative number adds it to\nthe total).\nThe net change in the company's deferred tax items is ZAR 7,000 − (− ZAR 3,000), or an increase of ZAR 10,000. Adding this amount to the\ncompany's taxes payable (ZAR 35,000) results in tax expense of ZAR 45,000.\n(Choice A) This subtracts the net change from taxes payable instead of adding it.\n(Choice B) This uses the net ending balance of deferred tax items instead of the net change in those items.\nThings to remember:\nThe difference in the change (ie, the ending balance minus the beginning balance) in DTL minus the change in DTA is added to taxes payable\nwhen calculating the income statement tax expense.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 172, "q": "A company recognizes all anticipated payments from an installment sale as revenue in the current period for accounting purposes. The tax code only taxes payments that the company receives. In the current period, for the installment sale revenue, the company most appropriately records:", "opts": ["a deferred tax asset.", "a deferred tax liability.", "neither a deferred tax asset nor a deferred tax liability."], "ans": "B", "expl": "A deferred tax liability (DTL) is created when a company owes less in taxes (ie, taxes payable) for a given period than it reports as tax expense on\nits income statement for the same period. Often, these differences arise when the tax code and accounting standards disagree on how and when\ncompanies should recognize revenues and expenses. A DTL is temporary; in future periods, total tax expense and total taxes payable will be\nequal.\nA common DTL example involves installment sales. Under accrual accounting (other than for long-term construction contracts), a company\nrecognizes revenues when earned, even if payments extend over several years. Tax laws often impose tax only on payments received, so\nannual tax expense exceeds taxes payable. The DTL signals investors that the company will owe more taxes as it receives future payments from\nthe sale.\n(Choice A) A deferred tax asset is created when the amount of taxes payable is greater than the tax expense that the company reports on its\nincome statement.\n(Choice C) When the amount of taxes payable differs from tax expense, the company creates a deferred tax item (either an asset or a liability) on\nits balance sheet.\nThings to remember:\nDifferences in tax reporting that cause accounting income to exceed taxable income result in the creation of a deferred tax liability.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 173, "q": "In the third quarter of this year, a company that reports under US GAAP prepays a vendor $25,000 for software subscription services that will not begin until next year. The company will not recognize any expense for financial reporting purposes until the software service starts. However, the tax laws allow the company to deduct the full amount this year on their tax return. If the company's tax rate is 20%, the gross impact of this transaction in this year is most likely a $5,000 increase to:", "opts": ["deferred tax assets.", "valuation allowances.", "deferred tax liabilities."], "ans": "C", "expl": "Deferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) arise from differences between income tax expense and taxes payable for a period.\nIncome tax expense is based on pretax income shown on the income statement for financial reporting (ie, accounting) purposes. Taxes payable\nare based on taxable income according to the tax code and reported on the tax return as the actual amount owed to the government.\nA DTL is incurred when income tax expense is greater than taxes payable, so the company pays less in taxes for the current year than it reports\nas income tax expense. This temporary \"underpayment\" generates a DTL that is expected to reverse later.\nIn this question, assume revenue this year is $100,000. The $25,000 paid to the vendor (ie, prepaid expense) is recognized for tax purposes as a\ncash expense this year. However, for accounting purposes, the expense will not be reported until next year. This temporarily causes pretax\nincome to be $25,000 more than taxable income, which creates a DTL of $5,000.\n(Choice A) A DTA is created when tax expense is less than tax payable.\n(Choice B) A valuation allowance account is a contra account to DTAs. It is recorded when certain amounts of DTAs are unlikely to be recovered\nin the future.\nThings to remember:\nA deferred liability is incurred when income tax expense is more than taxes payable, so that the company pays less for taxes for the current year\nthan it reports as income tax expense (on the income statement). This temporary \"underpayment\" generates a deferred tax liability now that is\nexpected to reverse later.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 174, "q": "Which of the following most likely indicates use of a deferred tax liability?", "opts": ["An equity's carrying value is less than its tax base.", "An asset's carrying value is greater than its tax base.", "A liability's carrying value is greater than its tax base."], "ans": "B", "expl": "Tax laws allow companies to use different methods to report balance sheet items (eg, assets or liabilities) for tax purposes and financial reporting.\nDifferent reporting methods create temporary differences between an item's carrying value and its tax base. The tax base is the value of the asset\nfor tax purposes. For financial reporting purposes, carrying value is the same as the asset's net book value.\nWhen an asset's carrying value exceeds its tax base, it indicates that reporting differences have resulted in a deferred tax liability (DTL). For\nexample, if a company chooses to depreciate assets more rapidly for tax purposes than for financial reporting, then for tax reporting:\ndepreciation expense is higher,\ntaxable income is lower,\ntax expense is lower,\ntaxes payable is lower, and\ntax base is lower than carrying value.\nDTL is temporary since under either method an asset's net cost fully depreciates over time. Due to the difference in depreciation methods, the\ncompany pays less now but owes future taxes; this debt is recorded as a DTL.\n(Choices A) Changes in equity valuation have no impact on deferred tax assets or liabilities.\n(Choices C) If a liability's carrying value is less than its tax base, it indicates use of a DTL.\nThings to remember:\nTax laws allow companies to use different methods to report balance sheet items for tax purposes and financial reporting. Different reporting\nmethods create temporary differences between an item's carrying value and its tax base. When an asset's carrying value exceeds its tax base, it\nindicates use of a deferred tax liability.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 175, "q": "A company has available-for-sale securities on its balance sheet. If the market value of those securities increases by $100,000, the company will most appropriately record:", "opts": ["a deferred tax asset.", "a deferred tax liability.", "neither a deferred tax liability nor a deferred tax asset."], "ans": "C", "expl": "Both IFRS and GAAP require companies to hold available-for-sale securities at their market values. Unrealized gains or losses from changes in\nmarket value are not included when calculating net income. Instead, they are carried in shareholders' equity as a component of other\ncomprehensive income (OCI). Any tax implications from accumulated gains or losses are deferred until the company sells the securities.\nIn this case, the company discloses the deferred tax impact in the footnotes to its entries for OCI. When it sells the securities, any realized gain or\nloss is removed from OCI and included with retained earnings:\n(Choices A and B) Deferred tax assets and liabilities arise only when the company's taxable income differs from its pretax income. Unrealized\ngains or losses from available-for-sale securities are not recognized either for financial accounting or for tax purposes. Pretax income and taxable\nincome are the same, so no deferred tax item is created.\nThings to remember:\nDeferred tax assets or liabilities are created when the accounting standards cause temporary differences between accounting income and taxable\nincome. Items that bypass the income statement and are taken directly to equity have no impact on either accounting or taxable income and do\nnot require a deferred tax item to be created.\nAnalyze disclosures relating to deferred tax items and the effective tax rate reconciliation and explain how information included in these\ndisclosures affects a company’s financial statements and financial ratios", "qhtml": null}, {"n": 176, "q": "On the last day of this fiscal year, a company receives cash from a customer for a service that it will not provide until the next fiscal year. The company does not recognize any revenue until the service is delivered, but the applicable tax code recognizes revenue when the cash is received. If this transaction creates the only difference between the company's accounting profit and its taxable income, then for this year it will most likely increase the company's:", "opts": ["tax base.", "deferred tax assets.", "deferred tax liabilities."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nA deferred tax asset is created when income tax expense is less than taxes payable. This means that the company pays more taxes for the\ncurrent year (as shown on its tax return) than it reports as income tax expense (on its income statement). This temporary overpayment generates\na future tax benefit (ie, deferred tax asset) since this difference is expected to reverse.\nFor example, if the company receives $50,000 in cash before delivering services and the company's tax rate is 20%, then the result is as follows:\nSince the cash received from the customer (ie, unearned revenue) is recognized as revenue for tax purposes but not for accounting purposes,\ntaxable income is greater than pretax income (ie, accounting profit) and taxes payable is greater than tax expense, which generates a deferred tax\nasset.\n(Choice A) Tax base refers to the value of an asset or liability for tax purposes.\n(Choice C) A deferred tax liability is created when deferred tax expense is more than taxes payable.\nThings to remember:\nA deferred tax asset is created when income tax expense is less than taxes payable. This occurs when the company pays more taxes for the\ncurrent year (as shown on its tax return) than it reports as income tax expense (on its income statement). This temporary overpayment generates\na future tax benefit (ie, deferred tax asset) since this difference is expected to reverse.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 177, "q": "When a deferred tax liability is no longer expected to reverse, which of the following is the most appropriate financial adjustment? The company should:", "opts": ["increase total assets.", "decrease taxable income.", "increase shareholders' equity."], "ans": "C", "expl": "A deferred tax liability (DTL) is created when income tax expense (for financial reporting) temporarily exceeds taxes payable (for tax reporting) in a\nreporting period. This means that the company pays less taxes in the current period than it reports on its income statement. Therefore, this\ntemporary \"underpayment\" generates a DTL that is expected to reverse in a future period.\nFor example, a company may generate a DTL by\nreporting unrealized gains from holding certain securities on the income statement, but\ndelaying recognition of gains for tax purposes until the securities are sold in a future period.\nWhen the securities are sold in the future, the company will report the realized gain as taxable income and reverse the liability.\nSometimes a DTL is no longer expected to reverse in the future. For example, the company may decide to not sell the security and instead own\nit indefinitely. When this happens, the company should write off the DTL and increase shareholders' equity by the same amount.\n(Choice A) There is no change in total assets. Total assets equal liabilities plus equity. In this scenario, the decrease in the DTL is fully offset by\nthe increase in shareholders' equity.\n(Choice B) Taxable income is determined by taxable revenues and allowed expenses. It is not determined by changes to DTL.\nThings to remember:\nWhen a deferred tax liability (DTL) is no longer expected to reverse, the appropriate financial adjustment is to write off the DTL and increase\nshareholders' equity.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 178, "q": "Three companies present the disclosure requirements for income taxes in the notes of their financial statements: Which company most likely has the lowest effective tax rate?", "opts": ["Company A", "Company B", "Company C"], "ans": "C", "expl": "Total income tax expense is the sum of the current taxes and the net deferred taxes. Current taxes refers to taxes payable in the current\nperiod. Deferred tax assets or liabilities arise from differences between tax reporting and financial reporting. The effective tax rate is the\npercentage calculated when income tax expense is divided by pretax income:\nTotal pretax income is earnings before tax for both domestic and foreign operations. Adding total current income taxes to the change in total\ndeferred taxes results in a company's total income tax expense on both domestic and foreign income. In this scenario, Company C's effective tax\nrate is the lowest at 23.4%:\n20.Tax loss carryforwards are best described as losses in the current year that:\nA. create a deferred tax liability.\n\nB. reduce future taxable income.\nC. lower prior-year tax obligations.\nExplanation\nDeferred tax assets (DTAs) and liabilities (DTLs) are created to help reconcile temporary differences between tax expense and taxes payable.\nDifferences can occur because:\ntax expense is derived from net income based on accounting standards, whereas\ntaxes payable is derived from taxable income based on the tax code.\nA DTA is created when a company reports higher revenues or lower expenses for tax purposes than it reports on its financial statements. When\nthis happens, taxes payable are greater than tax expenses for the period (ie, the company pays more tax earlier and less later). A DTL occurs in\nthe reverse situation.\nTax loss carryforwards, a type of DTA, occur when the absolute value of accounting losses is greater than the current year's taxable income.\nSubject to local tax laws, accounting losses offset taxable income. Since the tax benefit (lowering taxable income and, thus, taxes payable) from\nlosses is allowed only to the extent of the current year's taxable income, losses exceeding that amount are carried forward to offset future taxable\nincome. This excess portion of the loss, which will provide a future tax benefit, is a DTA since the company may reduce taxes payable in the\nfuture.\n(Choice A) Carryforwards create DTAs, not DTLs, since the company gets the benefit of lower taxes in the future.\n(Choice C) Carryforwards create DTAs that can offset future, not past, tax obligations.\nThings to remember:\nTax loss carryforwards create a deferred tax asset when losses exceed the current year's taxable income, and the excess losses are carried\nforward to offset future taxable income.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 179, "q": "Tax loss carryforwards are best described as losses in the current year that:", "opts": ["create a deferred tax liability.", "reduce future taxable income.", "lower prior-year tax obligations."], "ans": "B", "expl": "Deferred tax assets (DTAs) and liabilities (DTLs) are created to help reconcile temporary differences between tax expense and taxes payable.\nDifferences can occur because:\ntax expense is derived from net income based on accounting standards, whereas\ntaxes payable is derived from taxable income based on the tax code.\nA DTA is created when a company reports higher revenues or lower expenses for tax purposes than it reports on its financial statements. When\nthis happens, taxes payable are greater than tax expenses for the period (ie, the company pays more tax earlier and less later). A DTL occurs in\nthe reverse situation.\nTax loss carryforwards, a type of DTA, occur when the absolute value of accounting losses is greater than the current year's taxable income.\nSubject to local tax laws, accounting losses offset taxable income. Since the tax benefit (lowering taxable income and, thus, taxes payable) from\nlosses is allowed only to the extent of the current year's taxable income, losses exceeding that amount are carried forward to offset future taxable\nincome. This excess portion of the loss, which will provide a future tax benefit, is a DTA since the company may reduce taxes payable in the\nfuture.\n(Choice A) Carryforwards create DTAs, not DTLs, since the company gets the benefit of lower taxes in the future.\n(Choice C) Carryforwards create DTAs that can offset future, not past, tax obligations.\nThings to remember:\nTax loss carryforwards create a deferred tax asset when losses exceed the current year's taxable income, and the excess losses are carried\nforward to offset future taxable income.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 180, "q": "An analyst collects the following information (in € millions) on a company: Income tax expense 500 Deferred tax assets (DTAs) 40 Deferred tax liabilities (DTLs) 80 Prior year DTA 50 Prior year DTL 60 Based on only this data, the company's income taxes payable (in € millions) is closest to: ", "opts": ["470", "490", "510"], "ans": "A", "expl": "Deferred tax assets (DTAs) and liabilities (DTLs) reflect temporary differences between income tax expense and taxes payable, created by\ndifferences between accounting standards and tax laws. Income tax expense is reported on the income statement according to accounting\nstandards, whereas taxes payable is the actual amount owed to the government based on applicable tax laws.\nWhen tax expense is less than taxes payable, DTA is created since the company:\npays more in taxes in the current period and\nwill owe less in taxes in the future.\nWhen tax expense is greater than taxes payable, DTL is created since the company:\npays less in taxes in the current period and\nwill owe more in taxes in the future.\nThe equation above shows how changes in DTL and DTA are related to tax expense and taxes payable. To calculate taxes payable, substitute\nvalues for all the other variables.\n(Choice B) 490 results from reversing the sign when treating the change in DTA.\n(Choice C) 510 results from reversing the sign when treating the change in DTL.\nThings to remember:\nDeferred tax assets (DTAs) and liabilities (DTLs) reflect temporary differences between income tax expense and taxes payable for a period. Tax\nexpense = Taxes payable + ΔDTL − ΔDTA.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 181, "q": "An analyst gathers the following information about a company that reports under US GAAP: (USD thousands) Year 2 Year 1 Net deferred tax assets 6,400 7,600 Accounting profit 2,300 2,100 Taxable income 3,300 1,900 In Year 2, the decrease in net deferred tax assets most likely results from an increase in:", "opts": ["statutory tax rates.", "valuation allowance.", "deferred tax liabilities."], "ans": "B", "expl": "Deferred tax assets (DTA) and liabilities (DTL) result from temporary differences between taxable income (based on tax reporting) and\naccounting profit (based on financial reporting).\nDTA are created when companies pay higher current taxes since taxable income is greater than accounting profit. This creates future tax\nbenefits, as in this scenario.\nDTL are created when companies pay lower current taxes since taxable income is less than accounting profit. This creates future tax\nliabilities.\nThe carrying amount of DTA represents the recoverable tax benefit, so if a company does not expect to generate enough taxable income to fully\nrecover the DTA, it must reduce the carrying amount. In that case, under US GAAP a company would create or increase a valuation allowance,\nwhich is a contra account that decreases DTA. Under IFRS, the company reduces DTA directly and does not use a valuation allowance.\nDTL and DTA (net of the valuation allowance) are combined and presented as net DTA (DTL) on the balance sheet. Therefore, an increase in the\nvaluation allowance would result in a decrease in the net DTA reported.\n(Choice A) An increase in statutory tax rates would increase net DTA.\n(Choice C) Since taxable income exceeds accounting profit in Year 2, there is an increase in DTA, not DTL.\nThings to remember:\nDeferred tax assets (DTA) are created when companies pay higher current taxes due to temporary differences, creating future tax benefits. If a\ncompany does not expect to generate enough future taxable income to fully recover the carrying amount of the DTA, it must be decreased. Under\nUS GAAP, the company adjusts the carrying value using a valuation allowance.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 182, "q": "The value of deferred tax liabilities is most likely based on tax rates:", "opts": ["as of the balance sheet date.", "averaged over the current fiscal year.", "expected to apply when the liability is satisfied."], "ans": "C", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred taxes account for temporary differences between income tax expense and taxes payable. Such differences occur due to differences\nbetween tax reporting and financial reporting. A deferred tax liability (DTL) is created when a company pays less tax (tax reporting) than it reports\non its income statement (financial reporting); the DTL represents future taxes payable.\nWhile current taxes payable are based on the tax rates that apply on the balance sheet date, a DTL is measured by tax rates that are expected\nto be in place at the time of the liability's settlement. If expected rates are higher or lower than existing rates, that will be reflected in the value of\nthe DTL. This provides a more realistic measure of value since it is based on future rates, not historical ones (eg, balance sheet date, average\nover the fiscal year) (Choices A and B).\nThings to remember:\nA deferred tax liability (DTL) is created when a company pays less tax (tax reporting) than it reports on its income statement (financial reporting);\nthe DTL represents future taxes payable. While current taxes payable are based on the tax rates that apply on the balance sheet date, a DTL is\nmeasured by tax rates that are expected to be in place at the time of the liability's settlement (ie, estimated future tax rates). This provides a more\nrealistic measure of value for the DTL.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 183, "q": "In 2X10, a company reports income tax expense of ¥230 million and taxes payable of ¥223 million. If deferred tax assets increases by ¥3 million, then deferred tax liabilities would most likely:", "opts": ["increase by ¥4 million.", "increase by ¥10 million.", "decrease by ¥10 million."], "ans": "B", "expl": "Deferred tax assets (DTAs) and deferred tax liabilities (DTLs) reflect temporary differences between income tax expense and taxes payable for\na period. Such differences are created by differences between accounting standards and tax laws. Income tax expense is reported on the income\nstatement according to accounting standards, whereas taxes payable is the actual amount owed to the government (based on applicable tax\nlaws).\nWhen tax expense is greater than taxes payable, a DTL is created since the company pays less in taxes in the current period but will owe\nmore in taxes in the future.\nWhen tax expense is less than taxes payable, a DTA is created since the company pays more in taxes in the current period and will owe\nless in taxes in the future.\nThe equation above shows how the changes in DTL and DTA are related to tax expense and taxes payable. To calculate the change in DTL in this\nscenario, substitute values for all the other variables.\n(Choice A) A ¥4 million increase results from placing the incorrect sign in front of ΔDTA.\n(Choice C) A ¥10 million decrease results from placing the incorrect sign in front of ΔDTL.\nThings to remember:\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) reflect temporary differences between income tax expense and taxes payable for a\nperiod. Such differences are created by differences between accounting standards and tax laws. Tax expense equals taxes payable plus\nchanges to DTL less changes to DTA.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 184, "q": "This year, a pharmaceutical company: capitalizes €20 million in drug development costs at the beginning of the year. For accounting purposes, 25% of the cost is amortized this year. For tax purposes, 30% of the cost is amortized this year. spends €5 million on research over the year. The entire amount is expensed for accounting purposes. For tax purposes, the full amount is amortized at 20% annually, starting this year. The statutory tax rate is 30%. Based on only this information, this year the company will most likely report a:", "opts": ["deferred tax asset of €3 million.", "deferred tax asset of €0.9 million.", "deferred tax liability of €0.9 million."], "ans": "B", "expl": "An asset's carrying amount reflects its book value on the balance sheet for accounting purposes. An asset's tax base reflects the value that is\ndeductible for tax purposes over the asset's useful life. Differences between accounting rules and tax rules can cause carrying amounts to differ\nfrom tax bases. These temporary differences are reflected in deferred tax assets and deferred tax liabilities.\nIn this scenario, calculate each asset's carrying amount and tax base :\nFor the €20 million of capitalized development costs, 25% is amortized for accounting purposes, so the carrying amount is €15 million [(1 −\n0.25) × €20 million]. In comparison, 30% is amortized for tax purposes, so the tax base is €14 million [1 − 0.3) × €20 million].\nFor the €5 million of research costs, the full amount is expensed on the income statement for accounting purposes, so the carrying amount\non the balance sheet is 0. In contrast, 20% is amortized for tax purposes this year, so the tax base is €4 million [or (1 − 0.2) × €5 million].\nIn total, the carrying amount of assets is €3 million less than the tax base, creating a deferred tax asset of €0.9 million (€3 million difference × 30%\ntax rate) (Choice C).\n(Choice A) €3 million is the difference between the carrying amount and the tax base; apply the tax rate to the difference to determine the amount\nof the deferred tax asset.\nThings to remember:\nA deferred tax asset is created when the carrying amount is less than the tax base. A deferred tax liability is created when the carrying amount is\ngreater than the tax base. The amount of the deferred tax item equals the difference between the carrying amount and the tax base times the tax\nrate.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 185, "q": "Which of the following most likely creates a deferred tax asset?", "opts": ["Carryforward of prior years' gains, offset by current losses", "Greater expenses for financial reporting than for tax reporting", "Foreign currency received for income earned during the same period"], "ans": "B", "expl": "Comparison of deferred tax assets (DTA) and liabilities (DTL)\nDTA DTL\nTemporary\nTaxable income > accounting income Taxable income < accounting income\ndifferences\nFuture tax\nDecrease Increase\nobligations\nRevaluation Change value if future earnings are at risk None\nAccelerated for financial reporting; straight-line for tax Straight-line for financial reporting; accelerated for tax\nDepreciation\nreporting reporting\nExpenses Expenses recorded before cash is paid Expenses recorded after cash is paid\nCarryforwards Prior years' losses None\nRevenue Cash received before revenue is earned Cash received after revenue is earned\nA deferred tax asset (DTA) is created when a company's accounting income is less than its taxable income. In that case, according to the tax\ncode, the tax expense that the company must pay is greater than its income tax expense based on financial reporting. Often, these differences\narise when the tax code and accounting standards differ on how and when companies should recognize revenues and expenses. A DTA is\ntemporary since its benefit is expected to offset future taxes.\nFor example, accounting income is less than taxable income when a company elects accelerated depreciation for financial reporting and straight-\nline depreciation for tax reporting. Using straight-line depreciation for tax reporting results in lower depreciation expense and higher taxable\nincome than when it is used for financial reporting. Higher taxable income increases tax expense and taxes payable. Overpayment of tax today\nresults in a DTA since the company will pay less tax in the future.\n(Choice A) Carryforwards of prior years' losses, not gains, may be used against future gains and are recorded as DTAs. Under most tax laws,\ngains are immediately taxable and are usually disallowed as carryforwards.\n(Choice C) Foreign or domestic currency received for revenue earned during the same period creates neither a DTA nor a deferred tax liability\nsince accounting standards and the tax code recognize the currency as income.\nThings to remember:\nA deferred tax asset (DTA) is created when a company's accounting income is less than its taxable income. Often, these differences arise when\nthe tax code and accounting standards disagree on how and when companies should recognize revenues and expenses. A DTA is temporary\nsince its benefit is expected to offset future taxes.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 186, "q": "A company reports the following information in its first year of operations: Taxable profit €155,000 Accounting profit €140,000 Tax rate 20% All else equal, if the tax rate had been 25% instead of 20%, then most likely the company's:", "opts": ["deferred tax assets would have been €750 lower.", "deferred tax assets would have been €750 higher.", "deferred tax liabilities would have been €750 higher."], "ans": "B", "expl": "Deferred tax assets (DTA) and liabilities arise from temporary differences between income tax expense and taxes payable for a period. These\ndifferences are expected to reverse over time and offset previous deferred tax items. Income tax expense is based on reported accounting\nincome from the income statement. Taxes payable is based on taxable income on the tax return and is the actual amount owed to the\ngovernment.\nDTA arise when:\nTaxable income > Accounting income and\nTaxes payable > Tax expense.\nDeferred tax liabilities (DTL) arise when:\nTaxable income < Accounting income and\nTaxes payable < Tax expense.\nIn this scenario, a DTA is created since taxable income is greater than accounting income (Choice C).\nThe deferred tax amount can be calculated as the product of the absolute difference between the taxable income and accounting income and the\ntax rate. Therefore, the size of the deferred tax item is directly correlated to the tax rate. If the tax rate were higher, the amount of the DTA\nincrease would be higher as well (Choice A).\nThings to remember:\nA deferred tax item amount can be calculated as the product of the absolute difference between the taxable profit and accounting profit and the tax\nrate. The size of the deferred tax item is directly correlated to the tax rate.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 187, "q": "Deferred taxes most likely result from:", "opts": ["only temporary tax differences.", "only permanent tax differences.", "both temporary and permanent tax differences."], "ans": "A", "expl": "Major areas resulting in permanent differences between pretax and taxable income\nItem Impact Reason\nInterest on state and local Pretax income > taxable\nInterest is tax-free\ngovernment bonds income\nFines and penalties Fines are tax-deductible\nTaxable income > pretax\nCertain entertainment expenses Not all are fully tax-deductible\nincome\nCertain benefits for senior Some benefits, such as company-paid premiums on life insurance,\nmanagement are not tax-deductible\nTax laws allow companies to report balance sheet and income statement items differently for tax and financial reporting purposes. These\ndifferences cause pretax income and taxable income to diverge. The differences are classified as either temporary or permanent.\nDeferred taxes arise only from temporary differences in pretax income and taxable income. For example, a company may choose to\ndepreciate assets more rapidly for tax purposes than for financial reporting. When this happens, compared to the financial reports, in tax\nreporting:\ndepreciation is higher,\ntaxable income is lower,\ntax obligation is lower, and\ntaxes payable is lower.\nThe difference is temporary since an asset will be depreciated by the same amount over its useful life, regardless of the depreciation methods.\nWhen the discrepancy is permanent (ie, never to be reversed), no deferred tax item is created (Choices B and C). For example, companies\ninclude interest on municipal (state and local) bonds as revenue for financial reporting, but municipal bond interest is never taxable to the\nrecipient. Similarly, fines imposed by a government agency are deducted as an operating expense for financial reporting, but fines cannot be\ndeducted when calculating taxable income.\nThings to remember:\nCompanies can report figures differently for tax purposes and for financial reporting. These differences cause pretax income and taxable income\nto diverge. Deferred taxes arise only from temporary differences in pretax income and taxable income. When the discrepancy is permanent, no\ndeferred tax item is created.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 188, "q": "A company that reports under US GAAP has recognized a change in both deferred tax assets and deferred tax liabilities from the previous year. This year its taxes payable decreases and it reports a higher tax expense. The most likely reason this occurred is that: ", "opts": ["valuation allowance has increased.", "deferred tax assets have increased.", "the company uses straight-line depreciation for financial and tax reporting."], "ans": "A", "expl": "The equation above demonstrates the relationship between taxes payable, tax expense, deferred tax liabilities (DTL) and deferred tax assets\n(DTA). Here, tax expense increases, but taxes payable decreases. Rearranging the equation produces:\nHigher tax expense and lower taxes payable make the left side of the equation larger. To maintain equality, the right side must increase as well,\nwhich occurs when deferred tax liabilities (DTL) increase from the previous year (ie, the change in DTL is positive) and/or deferred tax assets\n(DTA) decrease from the previous year (ie, the change in DTA is negative).\nDTA offset future taxes, but the company must reasonably expect to generate future taxes that the DTA can offset. If that is not the case and the\nDTA is less likely to be used, then:\nunder US GAAP, a valuation allowance is established to show the reduced value of the DTA.\nunder IFRS, the DTA is reduced directly so a valuation allowance is not used.\nA decrease in DTA makes the right side of the rearranged equation larger by subtracting a negative number. An increase in the valuation\nallowance is the only answer choice that can produce that result.\n(Choice B) Increasing DTA makes the right side of the equation smaller, not larger.\n(Choice C) Deferred tax items usually result when a company uses accelerated depreciation for tax purposes and straight-line depreciation for\nfinancial reporting. Using straight-line depreciation for both financial and tax reporting has no impact on either DTL or DTA.\nThings to remember:\nDeferred tax assets (DTA) can reduce a company's future tax obligations. However, the company must have future income, and income taxes,\nagainst which the DTA will apply. A valuation allowance reduces the value of DTA if it is less likely that the company will generate future income\ntaxes that the DTA can offset.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 189, "q": "On March 1, 20X7, a company purchased securities of a publicly traded company for €1 million. At the end of 20X7, the securities were worth €800,000. If the company treats the securities as trading securities, then for these securities, at the end of 20X7, the company will most appropriately record:", "opts": ["a deferred tax asset.", "a deferred tax liability.", "neither a deferred tax asset nor a deferred tax liability."], "ans": "A", "expl": "Deferred tax assets (DTA) and deferred tax liabilities (DTL) arise from temporary differences between taxable income and pretax income. These\ndifferences can result when the tax code and financial standards diverge in recognizing revenues and expenses. When an item is treated the\nsame for tax purposes and financial reporting purposes, no deferred tax item is created.\nTrading securities are held on the balance sheet at their market value. Unrealized gains and losses in market value are included in the income\nstatement and affect pretax income. However, the €200,000 loss is not tax-deductible until the company sells the securities and realizes the loss,\nso its taxable income, which does not include the loss, is €200,000 higher than its pretax income, which does include the loss. Its taxes payable is\nthus greater than its tax expense, creating a DTA, not a DTL (Choice B).\nThe correct answer can also be inferred from the difference between the securities' carrying value and tax base\nThe carrying value is the value shown on the balance sheet and applies to financial reporting.\nThe tax base is the equivalent of the carrying value for tax purposes.\nThe unrealized loss reduces the carrying value but not the tax base, and resulting in a DTA.\n(Choice C) The change in value of an available-for-sale security would not lead to a deferred tax item since changes in value of those securities\nbypass the income statement. The result is that gains or losses for available-for-sale securities produce identical taxable income and pretax\nincome.\nThings to remember:\nGains and losses on trading securities cause temporary differences between taxable income and pretax income. The gain or loss is recognized\ncurrently in the income statement but is not recognized for tax purposes until the securities are sold. These temporary differences result in the\ncreation of deferred tax assets, if there is an unrealized loss, and liabilities, if there is an unrealized gain.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 190, "q": "A company reports the following information: (€ millions) 20X8 20X7 Deferred tax assets 15 17 Deferred tax liabilities 29 24 Tax expense 19 - Based on this information, the company's taxes payable for 20X8 are closest to: ", "opts": ["€12 million", "€22 million", "€26 million"], "ans": "A", "expl": "Tax expense appears on a company's income statement. It demonstrates what a company owes in taxes based on applicable accounting\nstandards. For some items, the tax laws mandate treatment different from accounting standards. This difference means that the taxes that the\ncompany pays (or owes) are not the same as it reports as tax expense.\nIf the disparity between tax expense and taxes payable is expected to reverse in the future, the company creates a deferred tax asset (DTA) or a\ndeferred tax liability (DTL). A DTA signals investors that the company will pay less tax in the future than it pays in the current period; a DTL signals\nthe opposite.\nTax expense relates to taxes payable by adding the difference between the change in DTL and DTA for a given period. As a simple example, if a\ncompany reports a tax expense of $20 and taxes payable of $12, it creates a DTL of $20 − 12 = $8 to account for the difference. If the company\nhad no previous DTL, its DTL increased by $8, and the above equality holds (ie, $20 = $12 + 8).\nRearrange the formula above to solve for taxes payable:\n(Choice B) This choice incorrectly adds both the change in DTL and DTA.\n(Choice C) This choice incorrectly adds the change in DTL and subtracts the change in DTA.\nThings to remember:\nTaxes payable for a period equals the tax expense shown on the income statement plus the change in deferred tax assets and minus the change\nin deferred tax liabilities.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 191, "q": "An analyst gathers the following information about a company reporting under US GAAP: ($ millions) Fiscal Year End 20X1 Total deferred tax assets 1,100 Valuation allowance (700) Total deferred tax assets after valuation allowance 400 Total deferred tax liabilities (1,500) Net deferred tax liabilities (1,100) All else being equal, an increase in the statutory tax rate from 20% to 25% would most likely increase:", "opts": ["total assets.", "total liabilities.", "taxable income."], "ans": "B", "expl": "Deferred tax assets (DTA) and deferred tax liabilities (DTL) result from temporary differences between taxable income (based on tax reporting)\nand accounting profit (based on financial reporting). These differences create future tax benefits (ie, DTA) or obligations (ie, DTL).\nDTA and DTL are reassessed at the end of each fiscal year, based on the tax rates that will be applied in the future when the temporary\ndifferences reverse, and DTA is recovered, or DTL is settled. If future income is taxed at higher (lower) rates:\nthe company's tax obligations increase (decrease), resulting in an increased (decreased) DTL, and\nthe benefit of future deductions increases (decreases), resulting in an increased (decreased) DTA.\nDTA and DTL are netted and reported as a single item on the balance sheet. In this case, since DTL > DTA, there are no deferred taxes reported\nas an asset on the balance sheet.\nDeferred taxes and statutory tax rates\n20% rate 25% rate Difference\nTotal DTA 1,100 1,375 275\nTotal DTL (1,500) (1,875) (375)\nNet effect (400) (500) (100)\nAn increase in the statutory tax rate increases both DTL and DTA, so in this scenario the net effect is an increase in net DTL. Therefore, total\nliabilities will increase and the tax rate change will not affect total assets.\nNote: No calculation is necessary to answer this question.\nThings to remember:\nDeferred tax assets (DTA) and deferred tax liabilities (DTL) are created by temporary differences and must be reassessed every year for any\nchanges in the applicable tax rate. An increase in the statutory tax rate increases both DTA and DTL since both future tax benefits (ie, DTA) and\nobligations (ie, DTL) will increase. DTA and DTL are netted and reported as a single item on the balance sheet.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 192, "q": "In the fiscal year ending 31 December 20X4, a company: received a payment of £50,000 on 30 December 20X4 from a tenant for January 20X5's rent. This amount is taxable in 20X4. purchased equipment on 1 January 20X4 for £200,000. The equipment has no salvage value. In 20X4, depreciation expense was calculated as: 20% of the equipment's cost for accounting purposes and 40% of the equipment's cost for tax purposes. prepaid £12,000 on 12 December 20X4 for a software subscription to be consumed in 20X5. This amount is tax deductible in 20X4. Using only the information provided, which of the following most likely resulted in a deferred tax asset in 20X4?", "opts": ["The prepaid software subscription", "The rent amount received in advance", "The different depreciation methods on the equipment"], "ans": "B", "expl": "Creation of deferred tax assets (DTA) and liabilities (DTL)\nBalance sheet item Scenario\nCarrying amount > Tax base → DTL\nAsset\nCarrying amount < Tax base → DTA\nCarrying amount > Tax base → DTA\nLiability\nCarrying amount < Tax base → DTL\nThe carrying amount of an asset or liability reflects the book value on the balance sheet, reported according to the applicable accounting\nstandards. In contrast, the tax base of an asset or liability reflects the carrying value for tax purposes, according to the applicable tax code.\nDifferences between accounting standards and tax codes may cause the carrying amount to differ from the tax base, resulting in deferred tax\nassets (DTA) and deferred tax liabilities (DTL).\nIn this scenario, the firm cannot recognize the £50,000 rent payment as revenue for accounting purposes until it is fully earned in January 20X5.\nInstead, it records £50,000 as unearned revenue, a liability, on 30 December 20X4. For tax purposes, the firm recognizes the £50,000 as taxable\ncash revenue in 20X4. Since the liability's carrying value (£50,000) is greater than its tax base (£0), this creates a DTA.\n(Choice A) The £12,000 for the prepaid software subscription is recorded as an asset (prepaid expenses), but for tax purposes it is recognized as\na cash expense in 20X4. Since the asset's carrying amount (£12,000) is greater than its tax base (£0), a DTL is created.\n(Choice C) For the £200,000 equipment, which is an asset, 20% of the historical cost is depreciated for accounting purposes in 20X4, so the\nremaining carrying amount is £160,000 or [(1 − 0.2) × 200,000]. In contrast, 40% is depreciated for tax purposes, so the remaining tax base is\n£120,000 or [1 − 0.4) × 200,000]. Since the asset's carrying amount (£160,000) is greater than its tax base (£120,000), a DTL is created.\nThings to remember:\nThe carrying amount of an asset or liability reflects the book value on the balance sheet, reported according to the applicable accounting\nstandards. The tax base of an asset or liability reflects its value for tax purposes, based on the applicable tax code. Differences between\naccounting standards and tax codes may cause the carrying amount to differ from the tax base.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 193, "q": "In 20X0, a company's deferred tax liabilities increased by €3 million and its deferred tax assets decreased by €2 million. If the company reports €80 million in taxes payable, then its income tax expense (in € millions) is closest to:", "opts": ["79", "81", "85"], "ans": "C", "expl": "Deferred tax assets (DTA) and deferred tax liabilities (DTL) reflect temporary differences between income tax expense and taxes payable for a\nperiod. Such differences are created by differences between accounting standards and tax laws. Income tax expense is reported on the income\nstatement according to accounting standards, whereas taxes payable is the actual amount owed to the government based on applicable tax laws.\nWhen tax expense is greater than taxes payable, a DTL is created since the company pays less in taxes in the current period but will owe\nmore in taxes in the future.\nWhen tax expense is less than taxes payable, a DTA is created since the company pays more in taxes in the current period and will owe\nless in taxes in the future.\nThe equation above shows how changes in DTL and DTA are related to tax expense and taxes payable. To calculate tax expense in this scenario,\nsubstitute the values for all of the other variables.\nTax expense = Taxes payable + ΔDTL – ΔDTA = 80 + 3 – (-2) = 85\n(Choice A) 79 results from incorrectly subtracting the change in DTL and adding the change in DTA to taxes payable.\n(Choice B) 81 results from incorrectly adding the change in DTA.\nThings to remember:\nDeferred tax assets (DTA) and deferred tax liabilities (DTL) reflect temporary differences between income tax expense and taxes payable for a\nperiod. Such differences are created by differences between accounting standards and tax laws. Tax expense equals taxes payable plus the\nchange in DTL less the change in DTA.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 194, "q": "For a company reporting under US GAAP, nontaxable income generated from holding municipal bonds most likely causes:", "opts": ["a valuation allowance created for certain deferred tax assets.", "a temporary difference between taxable profit and accounting profit.", "a permanent difference between taxable profit and accounting profit."], "ans": "C", "expl": "Major areas resulting in permanent differences between pretax and taxable income\nItem Impact Reason\nInterest on state and local Pretax income > taxable\nInterest is tax-free\ngovernment bonds income\nFines and penalties Fines are tax-deductible\nTaxable income > pretax\nCertain entertainment expenses Not all are fully tax-deductible\nincome\nCertain benefits for senior Some benefits, such as company-paid premiums on life insurance,\nmanagement are not tax-deductible\nPermanent differences between accounting profit (ie, pretax income) and taxable profit (ie, taxable income) arise due to the tax deductibility of\ncertain items. For example, tax-exempt income from municipal bonds is included in accounting profit and excluded from taxable profit. Since this\ndifference is not expected to reverse in the future, it is considered permanent.\nIn contrast, temporary differences between accounting profit and taxable profit arise from the timing of recognizing certain revenues and\nexpenses. These differences are reflected in deferred tax assets (DTAs) and deferred tax liabilities (DTLs). Since the differences will be reversed\nin the future, they are considered temporary (Choice B).\n(Choice A) A valuation allowance account is a reserve created to offset deferred tax assets, which capture temporary differences, in the event\nthat future economic benefits are not realized. In this scenario, the differences between taxable profit and accounting profit are permanent.\nThings to remember:\nPermanent differences between accounting profit and taxable profit arise due to the tax deductibility of certain items. Such differences will not be\nreversed and therefore are permanent. In contrast, temporary differences between accounting profit and taxable profit arise from timing\ndifferences in recognizing certain revenues and expenses.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 195, "q": "A company reporting under US GAAP has deferred tax assets that exceed deferred tax liabilities. All else equal, a reduction in the tax rate will most likely increase the company's:", "opts": ["operating profit.", "debt-to-asset ratio.", "shareholders' equity."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nDeferred tax items (ie, deferred tax assets and liabilities) arise from the difference between income tax expense (for accounting purposes) and\ntaxes payable (for tax reporting) for a period. Differences can occur as tax expense is calculated according to accounting standards whereas\ntaxes payable are calculated according to the tax code.\nDeferred tax assets (DTA) arise when taxable profit is greater than accounting profit and taxes payable are greater than tax expense.\nDeferred tax liabilities (DTL) arise when taxable profit is less than accounting profit and taxes payable are less than tax expense.\nIn this scenario, the value of deferred tax items is directly correlated with the tax rate. All else equal, when the tax rate decreases (as is the\ncase in this scenario), DTA and DTL decrease. Since the company's DTA exceeds its DTL, it has a net DTA balance, which is reported as a net\nlong-term asset under US GAAP. Therefore, a decrease in the tax rate ultimately reduces total assets, which increases the debt-to-asset\n(debt/asset) ratio.\n(Choice A) Operating profit is pre-tax, so a decrease in tax expense will not affect operating profit.\n(Choice C) Since the company has a net DTA, decreasing the tax rate also reduces the DTA. From the accounting equation assets = liabilities +\nequity, equity would have to decrease, not increase, to maintain the balance.\nThings to remember:\nThe value of deferred tax items is directly correlated with the tax rate. When there is a net deferred tax asset balance, a decrease in the tax rate\ndecreases that balance and thus total assets, increasing the debt-to-asset ratio and decreasing shareholders' equity.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 196, "q": "In 20X7, a firm: receives $10 million of payments in advance from a customer for goods to be delivered in 20X8. Assume the firm pays taxes on this amount in 20X7. is fined $5 million by the government. The firm pays the fine at the end of 20X7 and expenses it for accounting purposes. The fine is not deductible for tax purposes under the jurisdiction. Based on this information, in 20X7, the carrying amount of liabilities is most likely:", "opts": ["equal to its tax base.", "$5 million more than its tax base.", "$10 million more than its tax base."], "ans": "C", "expl": "The carrying amount of a liability reflects the reported book value on the balance sheet according to the applicable accounting standards. The\ntax base of a liability reflects its value for tax purposes. Differences between accounting standards and tax codes may cause the carrying\namount to differ from the tax base. These temporary differences are reflected in deferred tax assets and deferred tax liabilities.\nIn this scenario, the carrying amount and tax base of each liability is calculated to determine the total difference in 20X7.\nFor accounting purposes, the firm cannot recognize the $10 million of customer advances as revenue until the goods are delivered in 20X8.\nTherefore, it records $10 million as unearned revenue, a liability, in 20X7. In contrast, for tax purposes, the firm recognizes the $10 million\nas taxable cash revenue in 20X7 and does not record a liability.\nThe firm pays the government fine in 20X7; therefore, the carrying amount is zero for accounting purposes. The fine is not tax deductible,\nso the tax base is also zero.\nIn aggregate, the carrying amount of liabilities is $10 million more than the tax base.\n(Choice A) The carrying amount would be equal to the tax base if the $10 million liability for unearned revenue were included in the tax base.\n(Choice B) A carrying amount of $5 million more than the tax base results from incorrectly reporting a $5 million liability for fines in the tax base.\nThings to remember:\nThe carrying amount of a liability reflects the reported book value on the balance sheet according to the applicable accounting standards. The tax\nbase of a liability reflects its value for tax purposes. Differences between accounting standards and tax codes may cause the carrying amount to\ndiffer from the tax base.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 197, "q": "A company that reports under US GAAP presents its 20X3 deferred tax assets valuation allowance at $10,000. In 20X4, it is reported at $0. All else equal, the reduction in the valuation allowance most likely signals that the company expects: ", "opts": ["higher taxes payable.", "lower taxable income.", "lower statutory tax rates."], "ans": "A", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred taxes account for temporary differences between income tax expense and taxes payable. Such differences occur due to differences\nbetween tax calculations and financial statement reporting. A deferred tax asset (DTA) is created when a company pays more taxes (ie, tax\nreporting) than it reports (ie, financial reporting). The DTA can offset (ie, be applied to) future taxes owed.\nHowever, the company must expect the future taxes that the DTA will offset. To generate future taxes, the company must have taxable income.\nIf lower taxes are expected, the use of DTA is less likely, so its value is less likely to be realized. Under US GAAP, the company then decreases\nthe net DTA by increasing the valuation allowance (ie, contra account).\nIf taxable income and taxes payable are expected to increase, the DTA becomes more valuable. The company then lowers the valuation\nallowance, which increases the net value of the DTA. In this scenario, the company reduces the valuation allowance to zero. This indicates that\nthe company's taxable income and taxes payable increased so much that the value of its DTA will be fully realized.\n(Choices B and C) If taxable income or statutory tax rates are expected to be lower, the company can anticipate lower taxes payable and the\nprobability that it will use less, not more, of the DTA. To reflect decreased net DTA value, the valuation allowance is increased.\nThings to remember:\nA deferred tax asset (DTA) can offset a company's future taxes if the taxes are expected. Under US GAAP, if the probability of higher taxable\nincome and taxes payable increases, the valuation allowance is reduced, which increases the DTA's net value.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 198, "q": "A company reports financial results using IFRS. Which of the following most likely represents a conservative accounting choice?", "opts": ["Assuming longer useful lives for noncurrent assets", "Increasing life expectancies for retired pension recipients", "Reducing the allowance for uncollectible accounts receivable"], "ans": "B", "expl": "Comparison of common accounting choices\nAggressive accounting Conservative accounting\nRecognizing revenue upon sale rather than when completely earned Not recognizing revenue while seller retains any risk\nMaintaining reserves so earnings can be \"smoothed\" across periods Electing shorter useful lives for noncurrent assets\nUsing straight-line depreciation Using higher estimates for bad debt and warranty expense\nConservative accounting is an important characteristic of high-quality financial reporting. Conservative choices represent the managerial\nphilosophy that presenting financial results in a \"worst-case\" light minimizes the chances of future negative surprises.\nA defined benefit plan often represents a significant long-term liability based on projections that may never be realized. When a company\nassumes its employees will live longer in retirement, it acknowledges that it will likely owe them more money than originally anticipated. Increasing\nthe liability signals that the company is making appropriate provisions today to cover higher obligations in the future. This is an example of a\nconservative accounting choice.\nBy contrast, assuming longer useful lives for noncurrent assets or reducing the allowance for uncollectible accounts receivable decreases the\ncurrent period's expenses and increases earnings (Choices A and C). Accounting choices that increase the current period's earnings are\nconsidered more aggressive.\nThings to remember:\nConservative accounting choices often reduce the current period's earnings, either by increasing reported expenses or decreasing revenues.\nHowever, they are intended to minimize the chances of future negative surprises, which enhances investor confidence in the long-term\nsustainability of company reporting.\nExplain the difference between conservative and aggressive accounting", "qhtml": null}, {"n": 199, "q": "Which of the following best describes the relationship between the quality of financial reports and the quality of earnings?", "opts": ["High quality of earnings indicates a high quality of financial reporting.", "Low quality of earnings prevents analysts from determining the quality of reporting.", "High quality of financial reporting allows analysts to determine the quality of earnings."], "ans": "C", "expl": "The overall quality of financial statements varies widely (ie, exists on a spectrum) since it is a combination of earnings quality and reporting\nquality. Earnings quality is based on the sustainability and amount of earnings. Reporting quality is based on the usefulness of the financial\ninformation, as defined by its relevance and faithful representation.\nIf a company complies with US GAAP or IFRS and follows the International Accounting Standards Board's Conceptual Framework, the quality of\nfinancial reporting should be high. High-quality reporting allows analysts to determine earnings quality. However, if management\naggressively manipulates the rules (ie, earnings management), then reporting quality declines. At a certain point, the quality of reporting can be so\nlow that assessing the quality of earnings is impossible: The report does not represent the company's performance and may be fraudulent.\n(Choice A) High earnings quality indicates that earnings are high and sustainable. Reporting quality is based on the information's usefulness.\nHigh or low earnings quality does not directly impact the reporting quality.\n(Choice B) Low earnings quality does not prevent analysts from determining the reporting quality. Management's compliance with accounting\nstandards and the guidelines for preparing useful information determines the reporting quality.\nThings to remember:\nThe overall quality of financial statements is a combination of the financial reporting's usefulness and the company's earnings performance. High\nreporting quality enables analysts to evaluate the company's earnings quality. If reporting quality is too low, analysts cannot assess the earnings\nquality.\nDescribe a spectrum for assessing financial reporting quality", "qhtml": null}, {"n": 200, "q": "An analyst suspects a company of manipulating its financials. A trend that could most likely be a warning sign is:", "opts": ["declining inventory turnover over multiple periods.", "receivables decreasing as a percentage of total revenue.", "a net-income-to-cash-from-operating-activities ratio consistently below 1."], "ans": "A", "expl": "Common warning signs of accounting manipulation\nFrequent reporting \"surprises\"\n\"Nonrecurring\" items that consistently appear in multiple periods\nUnusual levels of receivables, payables, inventory turnover, operating cash flow, net income, profit margins\nUnderestimating warranty expenses that are \"restated\" in subsequent periods\nUseful lives for long-term assets that are different than industry average\nRelated-party transactions\nHeavy emphasis on pro forma (non-GAAP, non-IFRS) earnings\nFinancial reporting standards (eg, IFRS, US GAAP) give companies discretion and flexibility over the financial information they present, which can\nresult in companies manipulating their financials. Analysts must stay alert for warning signs of manipulation, which should be analyzed further.\nOne potential warning sign is a declining inventory turnover ratio over multiple periods. The inventory turnover ratio provides an indication on\nhow efficiently a company is managing its inventory. Although a declining ratio may simply be due to poor inventory management, it may also\nsignal that the company is purposefully not recognizing obsolescence to avoid write-downs in the current period. However, this could result in\ninventory write-downs in future periods.\n(Choice B) Receivables that are increasing as a percentage of total revenue may result from poor credit management or indicate aggressive\naccounting policies to recognize revenue early, such as \"channel stuffing\" (ie, delivering product to distributors ahead of customer demand).\n(Choice C) A net-income-to-cash-from-operating-activities ratio consistently above 1 may be a warning sign of lower quality financials or\nmanipulation. While this trend may be due to the cyclicality of the business, it could also indicate that the company is using aggressive accounting\npolicies to recognize revenue early or defer expense recognition.\nThings to remember:\nFinancial reporting standards allow companies discretion over the financial information they present to investors and flexibility over how it's\npresented, allowing for potential manipulation. One potential warning sign is a declining inventory turnover ratio, which may signal that the\ncompany is purposefully not recognizing inventory obsolescence to avoid write-downs.\ndescribe accounting warning signs and methods for detecting manipulation of information in financial reports", "qhtml": null}, {"n": 201, "q": "Which of the following circumstances would least likely result in a company issuing financial reports considered to be of low quality?", "opts": ["The company is experiencing an exceptionally strong period.", "Earnings are volatile from period to period due to a competitive industry.", "The CEO wants to sell the company at a large premium to its current stock price."], "ans": "A", "expl": "Low-quality financial statements refer to statements that may be incomplete, biased and/or contain errors. The CFA Institute identifies three\nconditions that often lead to low-quality statements: motivation, opportunity, and rationalization. Both incorrect answers illustrate situations in\nwhich a company's decision makers could be motivated to present their company's financial situation in a way that distorts the true picture.\nManagement can be motivated by career or compensation concerns to reduce earnings volatility (Choice B). One way to manage earnings\nvolatility is to create reserves that management can draw on when needed to \"smooth\" earnings from period to period. A company with less\nvolatile earnings in a volatile environment could be perceived as a superior investment, which in turn could lead to management having better job\nsecurity and compensation.\nSimilarly, a CEO's motivation for wanting to sell the company (Choice C) could be related to compensation. Many senior executives receive some\nof their compensation in company stock. Selling the company at a substantial premium directly benefits them, and companies with high earnings\ntend to command a higher price in takeovers. This could lead to choices that boost current earnings but prove to be unsustainable in the long\nterm.\nBy contrast, a company having a strong period has no need to further enhance earnings. It would want to issue high quality statements so that\nusers would trust that the earnings are \"real.\"\nThings to remember:\nLow-quality financial statements can result when career or compensation issues motivate managers to present potentially misleading—or even\nfraudulent—reports. Smoothing earnings to make them appear more consistent from period to period can result in increased job security or higher\ncompensation.\nDescribe motivations that might cause management to issue financial reports that are not high quality and conditions that are conducive to issuing\nlow-quality, or even fraudulent, financial reports", "qhtml": null}, {"n": 202, "q": "Adjusted EBITDA most accurately:", "opts": ["may exclude the impact of equity-based compensation.", "may be impacted by the choice of depreciation method.", "is commonly prepared under the same methodology across firms."], "ans": "A", "expl": "Management often presents pro forma (non-GAAP) financial measures, alongside US GAAP (or IFRS) measures, to convey its own\ninterpretation of company performance. Certain non-GAAP measures, such as adjusted EBITDA, may exclude the impact of noncash (eg, equity-\nbased compensation) or transitory (eg, litigation charges) items.\nAdjusted EBITDA varies across companies and often excludes the impact of equity-based compensation, acquisition-related charges, impairment,\nlawsuits, and gain or loss on disposal of assets or extinguishment of debt.\nThese management adjustments (ie, addbacks) are meant to normalize reported earnings (eg, net income) by eliminating the impact from\nnonrecurring items. However, management often justifies weak reported earnings by showing a reconciled schedule to a higher adjusted\nEBITDA. Therefore, analysts should apply some scrutiny to these measures.\n(Choice B) Depreciation method does not impact adjusted EBITDA since EBITDA measures earnings before depreciation.\n(Choice C) The method for calculating adjusted EBITDA is unique to every firm and subject to management discretion.\nThings to remember:\nManagement often presents pro forma (non-GAAP) financial measures, alongside reported US GAAP (or IFRS) measures, to convey its own\ninterpretation of company performance. Certain non-GAAP measures, such as adjusted EBITDA, may exclude the impact of noncash (eg, stock-\nbased compensation) or transitory (eg, litigation charges) items.\nDescribe presentation choices, including non-GAAP measures, that could be used to influence an analyst’s opinion", "qhtml": null}, {"n": 203, "q": "An analyst gathers the following information on two competitors, concerning their differences in accounting methods. Company 1 Company 2 Classification of investments Availa
