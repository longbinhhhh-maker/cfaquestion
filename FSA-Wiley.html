ble-for-sale Trading securities held indefinitely Majority consists Composition of intangible assets No goodwill of goodwill Depreciation method on fixed assets Straight line Accelerated To facilitate proper financial comparison, the analyst should most appropriately:", "opts": ["adjust Company 2's gross book value of fixed assets.", "reduce Company 1's net income for fair value investment gains.", "reduce Company 1's amount of intangible assets by its goodwill balance."], "ans": "C", "expl": "Common analyst adjustments\nCategory Issue Adjustment\nAdjust net income and/or other comprehensive\nInvestments Available-for-sale vs. trading securities classification\nincome\nComparing different cost methods (FIFO, LIFO, weighted average,\nInventory Adjust COGS and inventory balance\nspecific ID)\nFixed Adjust depreciation expense and fixed assets' net\nStraight-line vs. accelerated depreciation methods\nassets book value\nGoodwill Significant M&A growth vs. internal organic growth Adjust book value of intangible assets for goodwill\nM&A = mergers and acquisitions.\nAnalysts often compare companies that use different accounting methods and/or rely on distinct assumptions and estimates when preparing\nfinancial results. Differences between IFRS and US GAAP may also distort comparison. Analysts often adjust financial statements for such\ndifferences and/or requirements to facilitate \"apples-to-apples\" comparisons.\nIn this scenario, Company 1's intangible assets include significant goodwill, while Company 2 has no goodwill. Goodwill results purely from\nmergers and acquisitions activities and represents the purchase premium over an acquired company's fair value of net identifiable assets.\nAlthough goodwill is periodically tested for impairment, its value is subjective (ie, based on what the acquirer paid) and may overstate the\nacquirer's assets. Therefore, an analyst should adjust Company 1's book value of intangible assets for better comparison with Company 2.\n(Choice A) Net book value, not gross book value of fixed assets, should be adjusted when comparing companies that use different depreciation\nmethods. Gross book value represents the historical purchase price and remains constant. Net book value is gross book value adjusted for\naccumulated depreciation.\n(Choice B) Company 1 appropriately classifies investments that are held indefinitely as available-for-sale. Fair value gains bypass net income\nand flow directly into other comprehensive income. Thus, no adjustment to Company 1's net income is necessary.\nThings to remember:\nDifferent companies often use different accounting methods and rely on distinct assumptions and estimates when preparing financial results.\nDifferences between IFRS and US GAAP may also distort comparison. Analysts often adjust financial statements for such differences and/or\nrequirements to facilitate comparisons.\nDescribe accounting methods (choices and estimates) that could be used to manage earnings, cash flow, and balance sheet items", "qhtml": null}, {"n": 204, "q": "Which of the following reporting practices is most likely considered aggressive accounting?", "opts": ["Presenting pro forma earnings per share (EPS) that are lower than reported EPS.", "Capitalizing, instead of expensing, in-process research and development (R&D) costs.", "Using the criteria of available-for-sale securities, rather than trading securities, to treat bond investment gains."], "ans": "B", "expl": "Aggressive accounting vs. conservative accounting\nAggressive Conservative\nCapitalizing costs Expensing costs\nClassifying investments as trading Classifying investments as available-\nsecurities for-sale securities\nPresenting better pro forma results Presenting pro forma results close to\nthan IFRS or GAAP results IFRS or GAAP results\nAccounting choices affect the quality of a company's financial results. Aggressive accounting choices tend to inflate financial performance (eg,\nearnings, cash flow) in the current period but may understate performance in future periods. Conservative choices typically understate\nperformance in the current period but may enhance future performance.\nCapitalizing (instead of expensing) in-process research and development (R&D) costs in a reporting period assigns those costs to an asset on the\nbalance sheet. They are then amortized periodically as an expense on the income statement. The capitalization of a cost will produce:\nhigher net income in the current period since the entire cost is not expensed immediately, but\nlower net income in future periods since the remaining cost is expensed over time.\nTherefore, capitalization is an aggressive accounting choice. R&D costs should be capitalized only when the product is reasonably certain to\ngenerate future revenue and is no longer considered to be in process.\n(Choice A) Pro forma earnings typically include numerous management adjustments (ie, add-backs) that cause them to differ from reported\nearnings (ie, those under GAAP or IFRS). In general, management presents pro forma earnings that are higher than reported earnings and\ntherefore considered aggressive.\n(Choice C) When bond investments are treated as available-for-sale securities, any gains in fair value are included in other comprehensive\nincome on the balance sheet instead of going directly to net income (earnings). Therefore, this treatment is a conservative choice.\nThings to remember:\nAggressive accounting choices tend to inflate financial performance (eg, earnings, cash flow) in the current period but may understate\nperformance in future periods. Conservative accounting choices typically understate performance in the current period but may enhance future\nperformance. Capitalizing in-process research and development costs is considered an aggressive accounting choice.\nExplain the difference between conservative and aggressive accounting", "qhtml": null}, {"n": 205, "q": "Which of the following is least likely to increase financial reporting discipline?", "opts": ["Auditor reports included as part of the auditing company's consulting services", "Debt covenants that require the current ratio to be at or above a minimum figure", "Regulations that enforce disclosure but do not require management to certify financial statements"], "ans": "A", "expl": "Primary mechanisms that enhance financial reporting discipline\nRegulators Recognize and enforce disclosure standards applicable to all companies\nOpinions that statements comply with standards and fairly present the\nAuditors\ncompany's finanical condition\nFeatures such as debt covenants create special financial reporting\nInvestors\nrequirements to aid creditors\nMany jurisdictions require a company's statements to be audited by an independent auditor. An unqualified (ie, \"clean\") auditor's opinion does\nnot guarantee the statements' accuracy, but it certifies that the statements comply with accounting standards and present the company's results\nfairly. The prospect of a poor auditor's opinion can induce a company to produce high-quality statements since market repercussions from a poor\nreport are severe.\nThe company being audited pays the auditor's fee. By itself, that does not impugn an auditor's independence and objectivity. However, an auditor\nthat bundles auditing with other services as part of overall engagement is not \"independent.\" Earning compensation from other services may\ncause an auditor to provide a lenient audit opinion to preserve those additional compensation sources.\n(Choice B) Investors or creditors may have legally enforceable rights against a company that violates the terms of an investment contract. An\nexample is a lender that can accelerate payment of the loan if the borrower violates a debt covenant.\n(Choice C) Regulations often impose penalties on a company if its financial statements contain material misstatements or omit certain\ninformation. The possibility of penalties tends to enhance reporting discipline, regardless of whether the regulations require management to attest\nto the information's accuracy.\nThings to remember:\nMarket regulators, auditors, and investors are all groups that can enhance discipline on companies' financial reporting. However, for auditors to\nfulfill the role as a disciplinary mechanism, they must be independent of the company they are auditing. Auditors who \"bundle\" an audit with other\nservices such as consulting cannot be considered independent.\nDescribe mechanisms that discipline financial reporting quality and the potential limitations of those mechanisms", "qhtml": null}, {"n": 206, "q": "A company reports a significant increase in earnings per share (EPS) for fiscal year 20X8. An analyst examining the annual financial statements determines that the increase arises mostly from sales of noncore fixed assets. The statements are GAAP-compliant in all respects, and the footnotes provide significant details about the sales. The financial statements most likely represent:", "opts": ["high-quality financial reporting and financial earnings.", "high-quality financial reporting but low-quality financial earnings.", "low-quality financial reporting but high-quality financial earnings."], "ans": "B", "expl": "Financial reporting can be evaluated from two perspectives. The first is the quality of the reporting itself. High-quality reporting is characterized\nby providing enough information to allow a user to make an informed decision about a company's valuation and desirability as an investment.\nHigh-quality reports consistently comply with accounting standards, provide more (rather than less) information, and use conservative\naccounting choices.\nThe second perspective is the quality of the earnings the company reports. A high-quality report does not necessarily mean that the earnings are\nalso of high quality. High-quality earnings result from activities that produce sustainable and recurring earnings. Earnings that result from\nasset sales are unsustainable.\nThe company in this question produces reports that appear to be of high quality (ie, complying with applicable accounting standards, detailed\nfootnotes). However, the reported earnings are not of high quality due to unsustainable earnings from asset sales.\n(Choices A and C) The reporting quality is high, but the earnings quality is low.\nThings to remember:\nFinancial reporting quality does not always equate to financial earnings quality. Reporting can be compliant, conservative, and sufficiently detailed\nto allow users to make useful decisions despite a low quality of earnings.\nCompare financial reporting quality with the quality of reported results (including quality of earnings, cash flow, and balance sheet items)", "qhtml": null}, {"n": 207, "q": "High-quality financial earnings are least likely characterized by:", "opts": ["detailed pro forma financial statements.", "sustainable and robust sources of revenue.", "conservative estimates of useful lives for noncurrent assets."], "ans": "A", "expl": "High-quality financial earnings are characterized by sustainability over future periods. The quality of reported earnings tends to be positively\ncorrelated to the quality of the financial statements that chronicle those earnings. Companies with conservative accounting policies tend to\ngenerate high-quality earnings more often than companies with more aggressive reporting methods. The same applies for companies that make\nunbiased accounting choices.\nPro forma statements are one characteristic of aggressive reporting. They selectively present limited information that makes current earnings\nappear stronger than might otherwise be justified. The selective nature of the information calls into question whether the earnings are\nsustainable. Pro forma presentations do not comply with either US GAAP or IFRS.\nChoosing shorter useful lives for noncurrent assets represents a conservative accounting choice (Choice C). The shorter lives result in higher\ndepreciation expense each year. The increased expense means lower earnings. Also, shorter useful lives implicitly signal the company's intent to\ninvest in its infrastructure to foster future earnings growth.\n(Choice B) Revenue is the primary driver of earnings. Robust and sustainable revenues tend to result in consistent, high-quality earnings.\nThings to remember:\nHigh-quality earnings are characterized by sustainability and robustness. Earnings that result from pro forma financial statements tend to be less\nsustainable since they are based on reporting that does not comply with GAAP.\nCompare financial reporting quality with the quality of reported results (including quality of earnings, cash flow, and balance sheet items)", "qhtml": null}, {"n": 208, "q": "Which of the following accounting choices would most likely artificially enhance reported results in the current period?", "opts": ["Expensing, rather than capitalizing, long-term asset purchases", "Decreasing future benefit projections for a goodwill impairment assessment", "Changing revenue recognition criteria from Free on Board (FOB) destination to FOB shipping"], "ans": "C", "expl": "Under both IFRS and US GAAP, revenue can be recognized when the risks and rewards of ownership have been transferred to the buyer. When\ngoods are in transit:\nunder Free on Board (FOB) destination, ownership transfers to the buyer when the shipped goods are received. Therefore, the seller can\nrecognize revenue only when the goods arrive at the customer's destination.\nunder FOB shipping point, ownership transfers to the buyer upon shipment. Therefore, the seller can recognize revenue when the goods\nare shipped.\nFor a seller, switching shipping terms from FOB destination to FOB shipping will change the timing of when the goods' ownership is transferred,\nthus changing when revenue can be recognized. It effectively allows a seller to recognize revenue earlier, which results in more reported revenue\nfor the current period. Therefore, management sometimes uses this tactic to enhance reported revenue for a period.\n(Choice A) Expensing, rather than capitalizing, an asset purchase will increase operating expenses for the current period, thus lowering profits.\nExpensing an asset purchase is a conservative choice.\n(Choice B) Decreasing future cash benefit projections in a goodwill impairment test will more likely lead to a write-down; therefore, it is a\nconservative choice.\nThings to remember:\nFor a seller, switching shipping terms from Free on Board (FOB) destination to FOB shipping will change the timing of when title is transferred,\nthus changing when revenue is recognized. Under FOB destination, the seller recognizes revenue only when the goods arrive at the customer's\ndestination. Under FOB shipping point, the seller can recognize revenue when the goods are shipped.\nDescribe accounting methods (choices and estimates) that could be used to manage earnings, cash flow, and balance sheet items", "qhtml": null}, {"n": 209, "q": "A company sells a homogeneous product and many of its sales are on credit. An analyst is reviewing the company's financial statements for the past three years. Which of the following would an analyst least appropriately consider to be a warning sign concerning the company's financial reporting?", "opts": ["Inventory turnover has declined each year over the period.", "The company routinely recognizes revenue using bill-and-hold arrangements.", "The ratio of cash flow from operations to net income is consistently more than 1.0."], "ans": "C", "expl": "Common warning signs of accounting manipulation\nFrequent reporting \"surprises\"\n\"Nonrecurring\" items that consistently appear in multiple periods\nUnusual levels of receivables, payables, inventory turnover, operating cash flow, net income, profit margins\nUnderestimating warranty expenses that are \"restated\" in subsequent periods\nUseful lives for long-term assets that are different than industry average\nRelated-party transactions\nHeavy emphasis on pro forma (non-GAAP, non-IFRS) earnings\nBoth GAAP and IFRS allow managers discretion over the financial information they are required to present and over how it is presented. Analysts\nmust be vigilant to detect managers' manipulation of financial statements which may reduce the quality of the financial statements and/or the\ncompany's earnings, even if such manipulation is not so extreme as to be criminal conduct.\nAnalysts should pay close attention to the ratio of cash from operations (CFO) to net income. Sales on credit (ie, new accounts receivable)\nare included in a company's net income. Receivables must be converted to cash to pay expenses. Not converting receivables to cash may\nindicate that the company is recognizing \"sales\" that are illusory (and thus cannot be converted to cash), which is an accounting impropriety. A\nratio of at least 1.0 indicates that CFO is keeping pace with net income; a ratio of consistently less than 1.0 likely constitutes a warning sign.\n(Choice A) Inventory turnover (ie, the ratio of COGS to average inventory) measures how quickly a company sells its inventory. If this ratio is\ndecreasing, it may signal that the company has poor inventory management or that its inventory is becoming obsolete. Declining inventory\nturnover is a warning sign.\n(Choice B) A bill-and-hold arrangement is an agreement for a sale today with delivery deferred to a subsequent period. The seller improperly\nrecognizes the revenue today despite not delivering the goods. Consistently using bill-and-hold transactions to recognize revenue is a warning\nsign.\nThings to remember:\nCompanies have discretion over what they present in financial statements and how they present it. Analysts must be mindful of warning signs in\naccounting that indicate possible low-quality statements and/or earnings. Two common signs are reduced inventory turnover ratios and consistent\nuse of bill-and-hold transactions to recognize revenue.\ndescribe accounting warning signs and methods for detecting manipulation of information in financial reports", "qhtml": null}, {"n": 210, "q": "Which of the following is least likely considered a warning sign for financial manipulation?", "opts": ["A gain from sale of assets reported in operating income", "A loss from a rare lawsuit reported as a nonoperating loss", "Receivables are increasing much faster than reported revenue"], "ans": "B", "expl": "Common warning signs of management manipulation\nTiming of revenue, vague service contracts, quarterly reporting surprises\nMisclassification of recurring and nonrecurring items\nUnusual levels of working capital, operating cash flow, profit margins\nUnderestimation of rebates and warranty expenses or uncollectible accounts\nDepreciation choices (eg, modified useful lives, capitalizing instead of expensing)\nRelated party transactions\nLack of financial disclosure\nHeavy emphasis on pro forma (ie, non-GAAP, non-IFRS) earnings\nManagement can intentionally misclassify recurring and/or nonrecurring items to manipulate financial results. This leads to poor reporting quality\nsince the reported levels of operating performance are unlikely to be sustainable. Common manipulative practices include misclassifying:\nnonrecurring income as recurring (eg, reporting gains from asset disposals under operating income) (Choice A) and\nrecurring expenses as nonrecurring (eg, reporting recurring restructuring charges as nonrecurring or unusual).\nIn this question, classifying a loss from a rare lawsuit as nonoperating income is reasonable since a rare lawsuit is unlikely to recur. Therefore,\nsuch reporting would not be considered an attempt at manipulation.\n(Choice C) Receivables increasing at a much faster rate than revenues suggests less efficient receivables collection but may also signal\naggressive \"channel stuffing,\" which is a form of manipulation.\nThings to remember:\nManagement can intentionally misclassify recurring and/or nonrecurring items to manipulate financial results. This includes misclassifying\nnonrecurring income as recurring and recurring expenses as nonrecurring.\ndescribe accounting warning signs and methods for detecting manipulation of information in financial reports", "qhtml": null}, {"n": 211, "q": "Which of the following is most likely to be considered an aggressive accounting choice?", "opts": ["Increasing the estimate for bad debt expense", "Using the percentage-of-completion instead of completed contract method", "Raising post-retirement life expectancy assumptions for a defined benefit plan"], "ans": "B", "expl": "Comparison of common accounting choices\nAggressive accounting Conservative accounting\nRecognizing revenue upon sale rather than when completely earned Not recognizing revenue while seller retains any risk\nMaintaining reserves so earnings can be \"smoothed\" across periods Electing shorter useful lives for noncurrent assets\nUsing straight-line depreciation Using higher estimates for bad debt and warranty expense\nAggressive accounting choices tend to enhance current earnings or a company's financial position but decrease future earnings. In many\ncases, accounting standards and/or regulations present several options from which companies may select for a given situation. Aggressive\naccounting selects the choice that makes the company look best in the current period.\nConservative accounting choices focus on the company's long-term outlook. When presented with viable options, managers that adhere to\nconservative accounting practices choose the one it believes best reflects the company's long-term earnings or financial position. A conservative\nchoice can also represent what management determines is the more objective result.\nThe percentage-of-completion method recognizes revenue proportionately to the expenses incurred each period for a multi-period construction\ncontract. It assumes both that the company will likely be paid AND that expenses will not change materially during the contract. By contrast, the\ncompleted contract method is more conservative since no revenue, expenses, or earnings are recognized until the contract is completed.\n(Choices A and C) Increasing an estimate for bad debt expense is considered a conservative choice since it reduces earnings in the period of\nincrease. Similarly, it is conservative to assume increases in compensation when determining a company's liability for a defined benefit plan since\nhigher compensation causes the future liability to increase.\nThings to remember:\nIn general, aggressive accounting choices are those that enhance a current period's earnings, potentially to the detriment of future earnings.\nConservative accounting choices are considered more objective and foster greater confidence that the company's results are sustainable for future\nperiods.\nExplain the difference between conservative and aggressive accounting", "qhtml": null}, {"n": 212, "q": "A manager collects the following information (in USD) on a company that reports under US GAAP: The company has no inventory at the beginning of the year and 100 units in inventory at the end of the year. Management is under pressure to meet its year-end earnings target and is considering changing its accounting methods. Which change in inventory costing method is most likely to increase earnings? ", "opts": ["LIFO to FIFO", "Periodic weighted average to LIFO", "FIFO to periodic weighted average"], "ans": "A", "expl": "LIFO vs. FIFO: impact on financial statements\nInventory costs COGS Profit\nIncreasing Higher Lower\nLIFO\nDecreasing Lower Higher\nIncreasing Lower Higher\nFIFO\nDecreasing Higher Lower\nAnalysts should be aware of how a change in accounting methods or estimates can be used to manage or manipulate earnings. Even when\npermitted by accounting standards, such a change should be interpreted in the context of the company's performance.\nWhen inventory costs are rising, changing inventory valuations to FIFO lowers COGS and increases earnings, since, under FIFO, the first\n(lowest cost) purchases flow into COGS. LIFO, however, uses the last purchases (highest cost) to value COGS, and under the periodic weighted\naverage (PWA) method, the average purchase cost flows into COGS.\nUsing the COGS formula, there are 100 units sold (0 + 200 − 100 = 100) during the period; the value of the units sold depends on the inventory\ncosting method used. To determine which change in accounting method increases earnings the most, first find COGS using each method.\nThen find the difference in inventory costing methods; a decrease in COGS increases earnings.\nSwitching from LIFO to FIFO saves the company USD 29,000 in reported expenses and increases earnings, whereas the other changes increase\nCOGS and decrease earnings (Choices B and C).\nThings to remember:\nAccounting methods or estimates can be used to manage or manipulate earnings. When inventory costs are rising, changing to the FIFO\ninventory valuation method decreases COGS and increases earnings since the cheapest purchases are used to value COGS.\nDescribe accounting methods (choices and estimates) that could be used to manage earnings, cash flow, and balance sheet items", "qhtml": null}, {"n": 213, "q": "Which of the following is most likely considered a warning sign in a company's financial reporting?", "opts": ["Classification of substantial expenses as recurring", "Substantially exceeding fourth-quarter earnings guidance regularly", "Increasing trend in levels of operating cash flow relative to net income"], "ans": "B", "expl": "Common warning signs of management manipulation\nTiming of revenue, vague service contracts, quarterly reporting surprises\nMisclassification of recurring and nonrecurring items\nUnusual levels of receivables, payables, inventory turnover, operating cash flow, net income, profit margins\nUnderestimation of rebates and warranty expenses or uncollectible accounts\nDepreciation issues (eg, modified useful lives, capitalizing instead of expensing)\nRelated party transactions\nLack of financial disclosure\nHeavy emphasis on pro forma (non-GAAP, non-IFRS) earnings\nFrequent fourth-quarter positive earnings surprises (ie, when earnings exceed guidance or estimates) may indicate that management is\nmanipulating profits or purposely providing unrealistic guidance. In essence, management may manipulate the timing of recognizing certain\nrevenues and expenses to achieve the desired outcome.\n(Choice A) Classifying substantial expenses as recurring indicates conservatism in management's choice of reporting since it lowers profits.\nManagement typically manipulates reporting to show higher profits.\n(Choice C) Increasing levels of operating cash flow to net income indicate high-quality net income since there are high levels of cash that support\nincome that is accrued.\nThings to remember:\nFrequent fourth-quarter earnings surprises may indicate that management is purposely over- or under-reporting results in selective quarters.\ndescribe accounting warning signs and methods for detecting manipulation of information in financial reports", "qhtml": null}, {"n": 214, "q": "Which of the following actions taken by management can most likely mislead investors by improving the appearance of net cash from operating activities? ", "opts": ["Delaying payment to suppliers", "Expensing instead of capitalizing asset costs", "Disposing of outdated capital equipment at a gain"], "ans": "A", "expl": "Analysts and investors often pay close attention to net cash from operating activities (CFO) on the cash flow statement. The CFO section explains\nhow cash is generated from core business activities by listing the sources and uses (ie, inflows and outflows) of cash. Management can\nmanipulate CFO by delaying payment to suppliers, a tactic known as stretching payables. This makes CFO temporarily appear higher on a\nreporting date.\nFor example, a EUR 10,000 invoice is due on December 31 of this year. A company can postpone payment by one day, to January 1 of next year,\nso that CFO appears to be EUR 10,000 higher on the year-end cash flow statement for this year. Trends such as decreasing accounts payable\nturnover ratios and an increasing number of days of payables outstanding may indicate the stretching of payables.\n(Choice B) Expensing, instead of capitalizing, asset costs decreases CFO since total asset costs are expensed on the income statement and are\ntherefore captured in CFO. Conversely, capitalizing an asset moves asset costs to the balance sheet and decreases cash from investing\nactivities.\n(Choice C) Proceeds from disposing capital assets are recognized as cash from investing activities. Gains from the disposal of assets do not\nincrease CFO.\nThings to remember:\nOne way that management can manipulate CFO is by delaying payment to suppliers, which makes CFO appear higher on a reporting date.\nDescribe accounting methods (choices and estimates) that could be used to manage earnings, cash flow, and balance sheet items", "qhtml": null}, {"n": 215, "q": "A company's chief financial officer accelerated revenue recognition during the last month of the year to earn a sizable personal bonus. Which of the following conditions conducive to issuing low-quality financial reports best explains this action?", "opts": ["Opportunity", "Motivation", "Rationalization"], "ans": "B", "expl": "According to the curriculum, there are three conditions that lead companies to publish low-quality financial reports: opportunity, motivation,\nand rationalization. Opportunity results from poor internal or external conditions, motivation results from pressure to meet targets, and\nrationalization results from the need to justify one's choices.\nIn this scenario, personal motivation (ie, a bonus) encourages the CFO to manipulate revenue through early recognition.\nThings to remember:\nAccording to the curriculum, there are three conditions that lead companies to publish low-quality financial reports: opportunity, motivation, and\nrationalization. Opportunity results from poor internal or external conditions, motivation results from pressure to meet targets, and rationalization\nresults from the need to justify one's choices.\nDescribe motivations that might cause management to issue financial reports that are not high quality and conditions that are conducive to issuing\nlow-quality, or even fraudulent, financial reports", "qhtml": null}, {"n": 216, "q": "An analyst calculates the following data: Which of the three companies most likely has the highest return on equity?", "opts": ["Company A", "Company B", "Company C"], "ans": "C", "expl": "ROE measures the profit a company creates from using its equity. DuPont analysis entails decomposing ROE into different components:\nprofitability, efficiency, and leverage. By understanding the components of ROE, a company can determine more particularly how it can\nimprove its ROE.\nROE is the product of the company's return on assets (ROA) and the amount of leverage it uses. ROA (ie, the ratio of net income to asset value)\ncan also be expressed as the product of profit margin and asset turnover. The more profit the company produces and the more efficiently it uses\nits assets, the higher its ROE. A company can also increase ROE by borrowing, which increases its leverage.\nUsing DuPont analysis, ROE is the product of the net profit margin, total asset turnover, and leverage. Company C has the highest ROE, 27.0%\nsince its low efficiency is offset by a high profit margin (Choices A and B).\nThings to remember:\nReturn on equity (ROE) measures the profit a company creates from using its equity (eg, capital). DuPont analysis decomposes ROE into\ndifferent components: profitability, efficiency, and leverage.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 217, "q": "An analyst has gathered the following information: € millions 20X5 20X6 20X7 Average assets 117.0 116.0 115.0 Average liabilities 96.0 98.0 100.0 Revenues 40.0 42.5 45.0 Net profit margin 8.6% 8.7% 8.8% Using only this information, the most appropriate conclusion is that over the three-year period:", "opts": ["return on assets has declined.", "return on equity has increased.", "total asset turnover has declined."], "ans": "B", "expl": "Return on equity (ROE) is the ratio of net income to average shareholders' equity. It measures earnings for every dollar of shareholder\ninvestment. Analysts carefully track changes in ROE to determine the growth rate of shareholder return as well as the sources of that growth.\nThe company's net income and average equity can be derived from the information given. Net profit margin is equal to net income divided by\nrevenue; rearranging this equation makes it possible to solve for net income (net income = net profit margin × revenue).\nUsing this formula, the table below demonstrates that the company's net income has increased each year:\nSimilarly, equity equals assets minus liabilities, and the company's equity has declined each year, as shown in the table below:\nROE uses average equity as the denominator. A mathematical rule is that dividing a larger number (in this question, net margin) by a smaller\nnumber always produces a larger number. This means that the company's ROE has increased each year:\nThings to remember:\nReturn on equity equals net income divided by average shareholders' equity. Net income equals net profit margin multiplied by revenue. Average\nequity is the difference between average assets and average liabilities. With any ratio, a higher numerator and/or a lower denominator produces a\nlarger number.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 218, "q": "The 20X9 financial information for a company is shown below: (In $ Millions) Assets 500 Common stock 280 Retained earnings (cumulative) 100 Treasury stock 60 The company's debt to total capital ratio is closest to:", "opts": ["0.24", "0.36", "0.56"], "ans": "B", "expl": "The debt-to-capital ratio is a solvency ratio. Solvency ratios assess a company's ability to pay its long-term debt obligations. The debt-to-capital\nratio shows the amount of a company's debt relative to its overall capital structure (ie, debt plus equity). A lower ratio indicates lower financial\nrisk and greater solvency.\nOn the exam, questions may not be framed in a straightforward manner. In this question, total debt is not provided although it is necessary for the\nanswer. However, debt can be derived from the information given by rearranging the accounting equation:\nAssets = Liabilities + Equity → Liabilities = Assets − Equity\nThe calculations for obtaining each company's debt-to-capital ratio are shown below:\nThe company's debt-to-capital ratio is 0.36.\n(Choice A) 0.24 results from not subtracting Treasury stock when determining the amount of equity. This causes equity to be incorrectly\ncalculated as 280 + 100 = 380, so liabilities would be 500 − 380 = 120.\n(Choice C) 0.56 is approximately the company's debt-to-equity ratio. Remember that the debt-to-capital ratio measures the amount of debt\nrelative to the company's combined debt plus equity.\nThings to remember:\nThe debt-to-capital ratio measures the amount of a company's debt as a percentage of its capital (ie, debt plus equity). Solvency ratios assess a\ncompany's ability to pay its long-term debt obligations.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 219, "q": "A company uses LIFO to determine the valuation for inventory and reports the following under US GAAP: The company discloses that its LIFO reserve in 20X7 was $277 and in 20X6 was $450. If the company used FIFO instead of LIFO for its inventory valuation, then over the last year, the company's current ratio most likely:", "opts": ["decreased.", "remained the same.", "increased."], "ans": "A", "expl": "Companies that use LIFO (last-in, first-out) to value inventory often report lower inventory and higher expense than companies that use FIFO (first-\nin, first-out). Under US GAAP, companies that use LIFO must report the difference between inventory under LIFO and FIFO as the LIFO reserve.\nWhen preparing comparisons between companies that differ in their use of LIFO and FIFO inventory valuation, add back the LIFO reserve to\nconvert LIFO inventory to FIFO.\nIn this case, to find the company's current ratio as it would be under the FIFO method, add the LIFO reserve to current assets (inventory is a part\nof current assets).\nThe current ratio is current assets divided by current liabilities. Using current assets adjusted for FIFO, the current ratio decreases year over year\nfrom 5.33 to 5.04.\n(Choice B) The current ratio would have remained the same with no adjustment for differences in the accounting method.\n(Choice C) The current ratio would have increased by subtracting the LIFO reserve from current assets. To adjust for differences between LIFO\nand FIFO, add the LIFO reserves to inventory. This increases current assets.\nThings to remember:\nWhen comparing companies, some of which use LIFO and some of which use FIFO for inventory reporting, make their inventory values\ncomparable by adding the LIFO reserve to the LIFO inventory valuation.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 220, "q": "A company reports the following information: Selected Data (¥ billions) Item 20X5 20X6 Revenue 3.4 3.7 Current assets 5.0 5.2 Current liabilities 4.0 4.4 Based on this data, working capital turnover for 20X6 is closest to:", "opts": ["3.94", "4.11", "4.63"], "ans": "B", "expl": "Activity ratios measure how efficiently a company utilizes its assets. The numerator is commonly an income statement item (eg revenue, COGS);\nthe denominator is commonly a balance sheet item (eg, inventory, accounts payable).\nWorking capital (WC) turnover measures how efficiently a company generates sales (revenue) from its current working capital. Working capital is\ndefined as current assets (eg, accounts receivable, inventory) less current liabilities (eg, accounts payable). A high WC turnover suggests that the\ncompany is more efficient at using its short-term assets and liabilities to support sales. In this question, divide 20X6 revenue by the average\nworking capital values to calculate working capital turnover:\nIt is important to note that income statement items (ie, revenue) reflect what happens throughout a period, whereas balance sheet items\n(inventory) reflect the balance at the end of the period. Therefore, in most ratios that mix income statement with balance sheet items, the\nbalance sheet item is averaged to better capture asset levels throughout the period.\n(Choice A) 3.94 results from incorrectly averaging both years' revenue in the numerator.\n(Choice C) 4.63 results from including only 20X6's working capital in the denominator.\nThings to remember:\nA high working capital turnover ratio suggests that the company is efficiently using its short-term assets and liabilities to support sales. When\ncalculating a financial ratio that includes both an income statement and balance sheet items, it is conventional to take the average of the balance\nsheet item.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 221, "q": "An analyst gathers the following information (in INR billions) for a company, selected from its financial statements: INR billions Current Year Prior Year EBIT 204 197 Net income 150 143 Short-term debt 106 110 Long-term debt 434 451 Shareholders' equity 1,509 1,447 Total assets 2,249 2,183 Based on this data, the current year's return on total capital is closest to:", "opts": ["7.39%", "9.21%", "10.06%"], "ans": "C", "expl": "The return on total capital ratio measures the operating profits generated from a company's invested capital. Higher ratios indicate that capital is\nused more effectively.\nThe numerator is EBIT (earnings before interest and taxes), a proxy for operating profit, which represents profits before accounting for\nnonoperating items such as interest and tax.\nThe denominator is average total capital provided by creditors and shareholders, which includes short-term debt, long-term debt, and\nequity.\nIn this scenario, return on total capital is:\n(Choice A) 7.39% results from using net income instead of EBIT in the numerator. Net income is profits after interest and taxes; it represents\nonly profits available for distribution to shareholders.\n(Choice B) 9.21% results from using total assets instead of total capital. Total assets include items not financed by capital provided from lenders\nand shareholders, such as accounts receivable.\nThings to remember:\nReturn on total capital measures the profits produced from a company's invested capital. The numerator is EBIT (earnings before interest and\ntaxes), which represents profits before accounting for nonoperating items such as interest and tax. The denominator represents total capital\nprovided by creditors and shareholders, which includes short-term debt, long-term debt, and equity.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 222, "q": "An analyst calculates the following data for the year ending 20X9. Using DuPont analysis, the firm's return on equity (ROE) is closest to:", "opts": ["15.1%", "18.9%", "25.2%"], "ans": "B", "expl": "Return on equity (ROE) measures the profitability generated per unit of equity invested. Simply defined, ROE is the ratio of net income to average\nshareholders' equity. DuPont analysis subdivides ROE into five underlying components: tax burden, interest burden, profitability,\nefficiency, and leverage. Each component gauges a different aspect of financial performance that contributes to ROE; that detail helps the\ncompany focus efforts at improvement.\nROE can be calculated as the product of the company's return on assets (ROA) and leverage since profitability can be enhanced through\nleverage. ROA, the ratio of net income to assets, can be expressed as the product of net profit margin, a measure of profitability, and asset\nturnover, a measure of efficiency.\n(Choice A) 15.1% is the product of net profit margin and average total assets less the tax rate. The tax burden has already been factored into the\nnet profit margin, so it is inappropriate to deduct it again.\n(Choice C) 25.2% occurs by inappropriately dividing ROA by the debt-to-equity ratio.\nThings to remember:\nReturn on equity (ROE) measures the profitability generated per unit of equity invested. DuPont analysis subdivides ROE into five underlying\ncomponents: tax burden, interest burden, profitability, efficiency, and leverage. ROE can also be calculated as the product of the company's return\non assets (ROA) and leverage.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 223, "q": "An analyst prepares the following set of assumptions for a company: The initial forecasted revenue is €1 million. In subsequent years, it is estimated to grow at 5%. The company's forecasted initial net income is closest to:", "opts": ["€200,000.", "€320,000.", "€336,000."], "ans": "B", "expl": "A forecast is a projection of how a company will perform in the future. Analysts often develop forecasts from historical information. Forecasts\nhelp analysts evaluate a company's current valuation or creditworthiness.\nHere, forecasted net income is determined using the forecasted revenue. Calculate COGS and operating expenses as a percent of projected\nrevenue. Find earnings before tax (EBT) as projected revenue less COGS and operating expenses. The amount of taxes is the product of the\nEBT and the tax rate. Net income is the difference between EBT and taxes.\n(Choice A) €200,000 is found by calculating taxes as a percent of projected revenue and not a percent of EBT.\n(Choice C) €336,000 is found by calculating revenue as the product of the revenue growth rate and projected revenue. The projection for\nrevenue is the initial revenue amount. A projection includes a growth rate only after the first year.\nThings to remember:\nForecasts are projections of a company's future performance. Analysts develop forecasts from historical information to evaluate a company's\ncurrent valuation or creditworthiness.\nDescribe how ratio analysis and other techniques can be used to model and forecast earnings", "qhtml": null}, {"n": 224, "q": "An analyst collects the following information on a company: Current Prior Year Year Current ratio 2.00 2.00 Quick ratio 1.58 1.63 The company has no prepaid expenses and current liabilities have a year-end balance of $190,000 for each year. Based on this information, which of the following most likely increased during the current year? ", "opts": ["Inventory", "Quick assets", "Current assets"], "ans": "A", "expl": "The current ratio and the quick ratio are both liquidity metrics for a company's ability to meet short-term obligations (ie, those due within a\nyear). Both ratios express the relationship between current assets (eg, cash, short-term marketable investments, receivables, inventory, prepaid\nexpenses) and current liabilities (eg, accounts payable, accrued liabilities, short-term debt). A higher ratio indicates better liquidity.\nThe quick ratio is the more conservative liquidity measure because it most commonly excludes inventory and prepaid expenses in the\nnumerator. Inventory is the least liquid current asset since it takes longest to convert to cash. Prepaid expenses are frequently not convertible to\ncash.\nIn this scenario, first multiply the current liabilities by the current and quick ratios to determine the current and quick assets. Since there are no\nprepaid expenses, the difference between the quick and current assets is the amount of inventory only.\nCurrent assets remained the same but quick assets decreased by $10,000, so inventory must have increased by $10,000 to account for that\ndifference.\n(Choice B) Quick assets decreased due to the same level of current liabilities but a smaller quick ratio.\n(Choice C) Current assets remained the same due to the same level of current liabilities and the same current ratio.\nThings to remember:\nThe current ratio and the quick ratio express the relationship between current assets (eg, cash, short-term marketable investments, receivables,\ninventory, prepaid expenses) and current liabilities (eg, accounts payable, accrued liabilities, short-term debt). The quick ratio is the more\nconservative liquidity measure because it most commonly excludes inventory and prepaid expenses in the numerator.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 225, "q": "Which of the following is a limitation of ratio analysis?", "opts": ["Different assumptions result in different forecasts.", "Performance from different divisions are consolidated for reporting.", "Adjustments to reconcile results from different accounting standards distort comparisons."], "ans": "B", "expl": "Ratio analysis limitations\nHeterogeneous operations\nInconsistent results\nRatios alone are incomplete\nAccounting differences\nAnalysts often using ratio analysis to assess a company's financial performance or position. Although ratio analysis may provide useful insight, it\nalso comes with limitations:\nHeterogeneity in operation: If the company's divisions individually operate in distinct industries, then combining performance may\noversimplify data at an aggregate level and not provide insight into divisional performance.\nInconsistent interpretation of results: Different ratios may provide conflicting interpretations of performance for the same company. For\nexample, one ratio can suggest improving liquidity whereas another ratio can suggest worsening liquidity.\nThe need for judgment: Analysts must determine whether ratios are reliable in the context of industry and company history. Ratios are\nstatistical measures with no inherent value and alone are incomplete; it is the analyst's interpretation that creates insight.\nDifferent accounting standards: Differences in accounting methods limit the comparability of ratios across companies. For example, one\ncompany may use FIFO inventory reporting whereas another company uses LIFO inventory reporting. Analysts must adjust company\ninformation to ensure a meaningful comparison.\n(Choice A) Interpretations that vary among analysts are a benefit, not a limitation, of ratio analysis. Multiple forecasts and scenarios capture a\nbroader range of expectations.\n(Choice C) Adjusting results to reconcile differences in accounting standards allows for a more valid comparisons.\nThings to remember:\nLimitations of ratio analysis include heterogeneity of operations, inconsistent results, analyst's judgment, and accounting differences. Analysts\nmust anticipate and prepare for these limitations.\nDescribe tools and techniques used in financial analysis, including their uses and limitations", "qhtml": null}, {"n": 226, "q": "An analyst wants to know if a company has decreased its risk of defaulting on its long-term obligations. An increase in which of the following measures is the most appropriate indicator?", "opts": ["Cash ratio", "Interest coverage ratio", "Financial leverage ratio"], "ans": "B", "expl": "Solvency ratios—both coverage and debt ratios—are used by analysts along with other metrics to identify the risk of companies defaulting on\nlong-term obligations. These ratios typically serve to compare a company to its peers or observe the company's trends over time.\nAn interest coverage ratio measures a company's ability to cover its recurring interest payments with income generated from operations.\nSince EBIT is the numerator, a higher ratio indicates that a company has more operating income to cover the payments and therefore a\ndecreased risk of defaulting on its long-term obligations.\n(Choice A) The cash ratio is a liquidity ratio, which measures a company's ability to cover its short-term, not long-term, obligations.\n(Choice C) The financial leverage ratio, a debt ratio, measures the amount of a company's assets relative to its equity. A higher ratio of assets to\nequity indicates that more of a company's assets are funded by debt, so an increase would indicate a greater risk of default.\nThings to remember:\nSolvency ratios are used by analysts to identify a company's risk of defaulting on long-term obligations. The interest coverage ratio measures a\ncompany's ability to cover its recurring interest payments with income generated from operations. A higher ratio indicates a reduced risk of default.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 227, "q": "An analyst compiles the following data from a company's financial statements: SAR millions 20X6 20X5 20X4 Revenue 1,600 1,400 1,300 Net income 200 100 100 Current assets 550 500 500 Total assets 2,150 1,700 1,600 Current liabilities 350 300 300 Total debt 1,100 800 800 Total liabilities 1,350 1,000 900 Based on only this information, the change in which of the following ratios from 20X5 to 20X6 most likely would be considered an improvement to profitability or solvency?", "opts": ["Debt-to-equity ratio", "Return on equity ratio", "Financial leverage ratio"], "ans": "B", "expl": "Financial ratios can be useful indicators of a company's health and performance and therefore are used extensively in financial analysis. Ratios\ntypically require context, either comparing them to other companies or to the same ratio in prior periods.\nIn this scenario, the level of debt affects all three ratios. The debt-to-equity ratio and financial leverage ratio both measure a company's leverage.\nGreater proportions of debt increase a company's leverage, causing both ratios to increase. Debt also increases a company's interest expense,\ncausing its net income and return on equity (ROE) to be more sensitive to changes in operating income.\nROE is a profitability ratio that measures the return (ie, net income) earned by a company's equity shareholders. Higher ROE ratios indicate a\nhigher rate of return for each dollar of equity invested. In this scenario, equity must be calculated before calculating ROE. Liabilities are used to\ncalculate equity since a company's shareholders have claims on its assets only after all obligations (eg, debt, accounts payable) have been paid.\nSteps 20X6 20X5\nEquity = Equity =\n20X6 20X5\nCalculate year-end equity: 2,150 − 1,350 = 800 1,700 − 1,000 = 700\nAssets − Liabilities Equity = Equity =\n20X5 20X4\n1,700 − 1,000 = 700 1,600 − 900 = 700\nEquity = Equity =\nAvg Avg\nCalculate average equity\n(800 + 700) / 2 = 750 (700 + 700) / 2 = 700\nCalculate ROE: ROE = ROE =\nNet income / Average equity 200 / 750 = 26.7% 100 / 700 = 14.3%\nThe company's ROE increased from 14.3% in 20X5 to 26.7% in 20X6, indicating an improvement of profitability.\n(Choice A) The company's debt-to-equity ratio increased from 1.14 in 20X5 to 1.38 in 20X6, indicating a decline in solvency.\n(Choice C) The company's financial leverage ratio increased from 2.43 in 20X5 to 2.69 in 20X6, indicating a decline in solvency.\nThings to remember:\nReturn on equity is a profitability ratio that measures the return earned by a company's equity shareholders.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 228, "q": "A company reports the following information (in HKD thousands): Based on this data, the company's defensive interval ratio is closest to:", "opts": ["59 days.", "60 days.", "62 days."], "ans": "B", "expl": "A defensive interval ratio calculates the number of days that a company can cover its expenses with only its existing liquid assets. The\nnumerator consists of quick assets that are readily convertible into cash, which excludes inventory, prepaid assets, and deferred taxes. The\ndenominator includes all daily expenses except noncash items (eg, depreciation, stock-based compensation).\n(Choice A) 59 days results from including stock-based compensation and depreciation, which are both noncash items, in the denominator.\n(Choice C) 62 days results from including inventory in the numerator. Inventory is typically less liquid than other current assets.\nThings to remember:\nA defensive interval ratio calculates the number of days that a company can cover its expenses with only its existing liquid assets. The numerator\nconsists of quick assets that are readily convertible into cash, which excludes inventory, prepaid assets, and deferred taxes. The denominator\nincludes all daily expenses except noncash items (eg, depreciation, stock-based compensation).\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 229, "q": "An analyst collects the following information on three companies: Which company has the highest price-to-book ratio?", "opts": ["Company A", "Company B", "Company C"], "ans": "C", "expl": "Valuation ratios compare a stock price to a value measure, such as book value (BV), earnings, cash flow, or sales. A price-to-book (P/B) ratio\nindicates the price of a company's stock as a multiple of the company's BV of net assets (ie, assets minus liabilities). The price per share is the\nquoted market price.\nThe P/B ratio can be calculated using per-share or total values:\nMarket price per share divided by BV of net assets per share\nTotal market capitalization divided by total BV of net assets\nThe per-share calculation is more common since the market price is quoted on a per-share basis. In this scenario, Company C has a higher P/B\nratio (1.71) than the other two companies (Choices A and B).\nThings to remember:\nA price-to-book (P/B) ratio indicates a company's market value as a multiple of its book value (BV) of net assets. The P/B ratio can be calculated\nusing per-share or total values. The most common approach is to divide the market price per share by the BV of net assets per share.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 230, "q": "Which of the following factors is most likely to cause a low fixed-asset turnover ratio? A company:", "opts": ["has newer fixed assets.", "is a labor-intensive business.", "has a high amount of working capital."], "ans": "A", "expl": "Summary of fixed-asset turnover ratio\nActivity ratio\nRatio = Revenue / Average fixed assets\nHigher ratio is desirable\nIndicates more efficient use of fixed assets\nLower ratio does not always indicate inefficiency\nCompany may have newer fixed assets\nCompany may be capital-intensive\nActivity ratios measure the revenue a company generates relative to its assets. The fixed-asset turnover ratio analyzes revenue relative to the\nbook value of a company's long-term assets (ie, PPE). A high ratio suggests that the company is efficient in using its fixed assets to generate\nrevenue.\nSince assets are the ratio's denominator, a greater amount of PPE results in a lower ratio than a smaller amount of PPE. In general, newer assets\nhave a greater book value due to lower depreciation, which results in a lower fixed-asset turnover ratio.\n(Choice B) A labor-intensive business uses proportionally fewer fixed assets than a capital-intensive business and is more likely to have a\nrelatively high fixed-asset turnover ratio.\n(Choice C) Working capital is the difference between current assets and current liabilities. Since working capital does not impact fixed assets, the\namount of a company's working capital has no bearing on the company's fixed-asset turnover ratio.\nThings to remember:\nThe fixed-asset turnover ratio analyzes revenue relative to the book value of a company's average fixed assets. A high ratio suggests that the\ncompany is efficient in using its fixed assets to generate revenue. Newer fixed assets have a greater book value, which results in a lower fixed-\nasset turnover ratio.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 231, "q": "A consultant gathers the following profitability ratios for a company: Based on this information, over this period the company most likely improved its ability to cover: ", "opts": ["raw material costs.", "operating expenses.", "nonoperating expenses."], "ans": "A", "expl": "Profit margins (profit / revenue) indicate a company's ability to generate adequate sales to cover various costs:\nGross margin measures ability to cover COGS, which are costs directly attributable to producing the goods and services sold (eg, raw\nmaterial costs, production wages, distribution costs).\nOperating margin measures ability to further cover operating expenses such as marketing or research and development.\nPretax margin measures ability to further cover certain nonoperating expenses such as financing costs (eg, interest).\nNet margin measures ability to further cover taxes.\nIn this scenario, gross margin increased over time, which means the company improved its ability to cover COGS, including raw material costs.\n(Choice B) Operating margin decreased over time, which suggests a worsened ability to cover operating expenses.\n(Choice C) Pretax margin remained unchanged, which suggests deterioration or no improvement in the company's ability to cover nonoperating\nexpenses (before taxes).\nThings to remember:\nProfit margin percentages (profit / revenue) indicate a company's ability to generate adequate sales to cover various costs. Gross margin\nmeasures ability to cover COGS; operating margin measures ability to cover operating expenses; pretax margin measures ability to cover\nnonoperating expenses (before taxes); and net margin measures ability to cover taxes.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios\n17.A company's manager collects the following data:\nBased on only this data, the company's interest coverage ratio is closest to:\nA. 2.50\nB. 3.50\n\nC. 4.75\nExplanation\nSolvency ratios convey a company's ability to meet its long-term debt obligations. There are two types of solvency ratios:\nDebt ratios measure a company's debt levels relative to its assets or equity. Declining debt ratios indicate that less asset value is financed\nby debt and, therefore, there is less financial risk and stronger solvency.\nCoverage ratios measure a company's ability to pay its required interest payments, based on income and expenses. Rising coverage\nratios mean the company's solvency is stronger since it has relatively more earnings available to pay interest.\nIn this scenario, the focus is on calculating the interest coverage ratio, defined as EBIT divided by interest payments. Interest payments and taxes\nare added back to net income to w EBIT.\nApplying the interest coverage ratio, the company has interest payments covered 4.75 times by EBIT. Put another way, EBIT is 4.75 times larger\nthan the company's interest obligations.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 232, "q": "A company's manager collects the following data: Based on only this data, the company's interest coverage ratio is closest to:", "opts": ["2.50", "3.50", "4.75"], "ans": "C", "expl": "Solvency ratios convey a company's ability to meet its long-term debt obligations. There are two types of solvency ratios:\nDebt ratios measure a company's debt levels relative to its assets or equity. Declining debt ratios indicate that less asset value is financed\nby debt and, therefore, there is less financial risk and stronger solvency.\nCoverage ratios measure a company's ability to pay its required interest payments, based on income and expenses. Rising coverage\nratios mean the company's solvency is stronger since it has relatively more earnings available to pay interest.\nIn this scenario, the focus is on calculating the interest coverage ratio, defined as EBIT divided by interest payments. Interest payments and taxes\nare added back to net income to w EBIT.\nApplying the interest coverage ratio, the company has interest payments covered 4.75 times by EBIT. Put another way, EBIT is 4.75 times larger\nthan the company's interest obligations.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 233, "q": "An analyst calculates the following from a company's financial statements: Which of the following best describes the change in the company's relative valuation?", "opts": ["It is lower since return on assets decreased.", "It is higher since price to earnings increased.", "It is unchanged since debt-to-equity is constant."], "ans": "B", "expl": "Valuation ratios compare a stock price to a per-share value measure. Value measures include the company's earnings, cash flow, sales, or book\nvalue. The P/E ratio indicates the price an investor pays for one share of the company's earnings. The price per share is the quoted market\nprice. The company's earnings per share is its net income divided by outstanding shares. Here, the P/E ratio increased from 13.3 to 16.9, so\nthe company's value relative to earnings increased.\nHowever, a P/E ratio should be interpreted with caution since net income may distort the P/E ratio. Earnings may be distorted since\nmanagement can manipulate earnings by choosing self-serving accounting methods and accounting conventions require that management\ninclude one-time transactions in net income. Where earnings are subject to such influences, reported net income should be adjusted or\nalternative valuation ratios should be used (eg, price to cash flow).\n(Choice A) Return on assets is a ratio of net income to average total assets. It is a measure of a company's profitability, not its valuation.\n(Choice C) The debt-to-equity ratio gauges a company's relative debt level and is a measure of the company's solvency (eg, leverage), not its\nvaluation.\nThings to remember:\nThe P/E ratio indicates the price an investor pays for a share of the company's profits. The price per share is the quoted market price. The\ncompany's earnings per share is its net income divided by outstanding shares. Net income can be distorted by one-time transactions or\nmanipulated by management.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 234, "q": "An analyst collects the following information about a company: For the year ended 20X5, the company's total asset turnover (TAT) is closest to:", "opts": ["6", "7", "8"], "ans": "C", "expl": "Total asset turnover (TAT) is an activity ratio that measures a company's overall efficiency in using its assets to create revenue. TAT is\ncalculated by dividing current-period revenue by the average amount of total assets over the current period. All else equal, a higher ratio is\npreferred since it indicates that the company can generate more revenue from a relatively small amount of assets.\nIn this scenario, average total assets for 20X5 is CNY 175 million and TAT is 8. This means that the company produces, on average, CNY 8.0 of\nrevenue for each CNY 1.0 of asset values. Put another way, the company's assets generate eight times their value in revenue.\n(Choice A) A TAT of 6 is the result of inappropriately using an average revenue instead of total revenue for 20X5. TAT uses average assets, not\naverage revenue.\n(Choice B) A TAT of 7 is found by using total assets for 20X5 instead of average total assets over the current period.\nThings to remember:\nActivity ratios measure a company's efficiency and indicate its operational performance. Total is a measure of the company's overall efficiency. It\nis calculated by dividing revenue by total average assets.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 235, "q": "A company reports the following information: Based only on this information, which of the following best describes the change in the company's profitability?", "opts": ["Operating profit margin and net profit margin both increased.", "Operating profit margin and net profit margin both decreased.", "Operating profit margin decreased and net profit margin increased."], "ans": "C", "expl": "A company's profit margin, a type of profitability ratio, measures a company's profit relative to its revenue. Different types of profit margins\nincorporate different expenses to determine a company's profitability.\nHere, find the changes in operating profit margin and net profit margin to determine how the company's profitability changed:\nDetermine the operating profit margin by calculating operating income and comparing it to revenue. Operating income is earnings that\nremain after subtracting COGS and operating expenses from revenue.\nDetermine the net profit margin by calculating net income and comparing it to revenue. To calculate net income, subtract all expenses\n(ie, including interest and taxes) from revenue.\nCalculate the two profit margins as follows:\nThe operating profit margin declined from 53.33% to 50.00%. The net profit margin increased from 36.30% to 43.33%.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 236, "q": "An analyst compiles the following information about a company: 20X2 20X3 ROE 16.7% 17.2% Total asset turnover 1.06 1.07 Leverage 1.53 1.61 Based on only this information, the most appropriate conclusion is that:", "opts": ["return on assets increased and net profit margin increased.", "return on assets decreased and net profit margin increased.", "return on assets decreased and net profit margin decreased."], "ans": "C", "expl": "A company's ROE measures the level of profit, as measured by net income, the company can generate with the equity invested by shareholders.\nDuPont analysis breaks down ROE into its component factors to understand which elements are driving the company's returns.\nThe first level of DuPont analysis separates ROE into the return on assets ratio (ROA) and the leverage ratio. ROA is then broken down into the\nnet profit margin and total asset turnover ratios. This process separates ROE into three elements:\nProfitability, measured by the net profit margin ratio\nEfficiency, measured by the asset turnover ratio\nLeverage, measured by the leverage ratio\nThose elements can be broken down by additional levels of DuPont analysis.\nIn this scenario, the company's ROA is determined from the ROE and leverage ratios as follows:\nROE = ROA × Leverage\nROA = ROE / Leverage\nROA = 0.167 / 1.53 ≈ 10.9%\n20X2\nROA = 0.172 / 1.61 ≈ 10.7%\n20X3\nBetween 20X2 and 20X3, the company's ROA declined from 10.9% to 10.7% (Choice A). The calculated ROA can be used to determine the\ncompany's net profit margin as follows:\nROA = Net profit margin × Total asset turnover\nNet profit margin = ROA / Total asset turnover\nNet profit margin = 0.109 / 1.06 ≈ 10.3%\n20X2\nNet profit margin = 0.107 / 1.07 = 10.0%\n20X3\nBetween 20X2 and 20X3, the company's net profit margin declined from 10.3% to 10.0% (Choice B).\nThings to remember:\nDuPont analysis breaks down a company's ROE to identify which of its component factors are driving returns. The first level of DuPont analysis\nseparates ROE into the return on assets ratio (ROA) and the leverage ratio. ROA can then be broken down into the net profit margin and total\nasset turnover ratios.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 237, "q": "A company reports the following information: ¥ billions 20X8 20X9 Revenue 8.5 9.3 Net income 3.1 3.3 Gross fixed assets 19.5 22.0 Accumulated depreciation (3.0) (3.0) Net fixed assets 16.5 18.5 Based on this data, fixed asset turnover in 20X9 is closest to:", "opts": ["0.19", "0.45", "0.53"], "ans": "C", "expl": "Fixed asset (FA) turnover measures how efficiently a company generates revenue with its net FAs (ie, gross FAs less accumulated\ndepreciation). FAs are used over the long term and typically consist of property, plant & equipment (PPE) and intangible assets.\nHigh FA turnover may indicate that a company is using its FAs efficiently to generate sales (eg, operating machines near capacity).\nLow FA turnover may indicate that a company is not using its FAs efficiently (eg, there is excess capacity) or that the assets are relatively\nnew, and therefore net FA is high due to little depreciation.\nIn this question, divide 20X9 revenue by the average net FA to calculate FA turnover.\nIt should be noted that income statement items (eg, revenue) reflect what happens throughout a period, whereas balance sheet items (eg, net\nFAs) reflect the balance at the end of the period. In most ratios that mix an income statement item with a balance sheet item, the balance sheet\nitem is averaged to better capture changes throughout the period. Therefore, FAs are averaged to better reflect the level of FAs throughout the\nyear.\n(Choice A) 0.19 results from using 20X9 net income instead of revenue in the numerator.\n(Choice B) 0.45 results from using gross FAs instead of net FAs in the denominator. Gross FAs represent the assets' historical cost and do not\ncapture estimated wear and tear on the equipment (ie, depreciation).\nThings to remember:\nFixed asset (FA) turnover measures how efficiently a company generates revenue with its net FAs. High FA turnover may indicate that the\ncompany is efficiently operating near capacity. Low FA turnover may indicate that the company is not using its FAs efficiently or that the assets are\nrelatively new.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 238, "q": "A firm reports the following information (in RUB millions): RUB Millions Current Year Prior Year EBIT 232 216 Net income 186 173 Preferred dividends 10 10 Common equity 3,720 3,460 Based on this data, the current year's return on common equity is closest to: ", "opts": ["4.90%", "5.18%", "6.18%"], "ans": "A", "expl": "Return on common equity (ROCE) gauges the amount of residual net income (after accounting for preferred dividends) generated relative to\ncommon equity. Preferred dividends are subtracted from net income since common shareholders receive distributions only after preferred\nshareholders receive their dividends. Greater ROCE ratios suggest that a company is more effective in using common equity to generate a return\nfor common shareholders.\nROCE should not be confused with ROE (return on equity). ROE measures the return for all equity investors (preferred and common) and is\ncalculated as net income / average total equity.\n(Choice B) 5.18% results from failing to subtract preferred dividends from net income. ROCE measures return for common shareholders only, so\ndistributions to preferred shareholders (ie, preferred dividends) should be taken out.\n(Choice C) 6.18% results from incorrectly using EBIT, instead of net income, in the calculation. EBIT measures profits before interest and taxes,\nwhich reduce income available to common shareholders.\nThings to remember:\nReturn on common equity (ROCE) measures the amount of residual net income (after accounting for preferred dividends) generated relative to\ncommon equity. Greater ROCE ratios suggest that a company is effective in using common equity to generate a return for common shareholders.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 239, "q": "An analyst completes the following DuPont analysis on two companies: Compared with Company Y, Company X mostly likely has a:", "opts": ["lower ROE and is more efficient.", "higher ROE and has a higher profit margin.", "higher ROE and a higher proportion of debt."], "ans": "C", "expl": "DuPont analysis entails decomposing ROE into five components. In this case, multiply the five components together to find the ROE of\nCompanies X and Y, which are 16.20% and 15.55%, respectively. Company X has a higher ROE despite its lower profitability (0.10 vs. 0.18) and\nefficiency (0.90 vs. 1.20) compared with Company Y's. Company X has greater leverage (ie, proportion of debt) than Company Y (3.00 vs 1.20),\nwhich is why Company X's ROE is greater than Company Y's (Choices A and B).\nLeverage is a gauge of solvency as measured by the company's assets relative to its average total equity. The higher the ratio, the more the\ncompany finances its assets with debt.\nThings to remember:\nROE measures the profits a company creates from using its equity (eg, capital). DuPont analysis decomposes ROE into five components: tax\nburden, interest burden, profitability, efficiency, and leverage. It is helpful to identify which specific components contribute to changes in ROE.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 240, "q": "An analyst gathers the following data for a company: Prior Current (¥ billions) Year Year Sales 540 500 Net income 120 100 Average total assets 2,200 2,100 If return on equity (ROE) was 0.12 in the prior year and 0.14 in the current year, then the increase in ROE is most appropriately attributed to increased: ", "opts": ["leverage.", "efficiency.", "profitability."], "ans": "A", "expl": "Return on equity (ROE) measures the level of net income generated by a company's use of equity. Classic DuPont analysis decomposes ROE\ninto three distinct components: profitability, efficiency, and leverage.\nProfitability, measured by net profit margin, gauges the level of profit from sales.\nEfficiency, measured by total asset turnover, gauges the ability to generate sales by using assets.\nFinancial leverage is the ratio of total assets to equity capital. Firms with higher leverage have a greater percentage of assets financed with\ndebt.\nAn increase to any one component, all else equal, will positively impact ROE.\nIn this scenario, ROE increased from 0.12 to 0.14. To determine the cause of the increase, first calculate the net profit margin and total asset\nturnover, and then plug those values into the overall ROE equation to solve for leverage. Finally, compare the current component values to the\nprior year values. In this case, the increase in ROE is driven by increased leverage.\nNote: Leverage can also be determined based on its relationship to ROE and return on assets (ROA): ROE = ROA × Leverage.\n26.An entrepreneur starts a company by investing $300,000 of equity to fund working capital. The entrepreneur makes the following forecast\nassumptions:\nFirst-year sales $500,000\nAnnual sales growth 8%\nNet profit margin 30%\nWorking capital / Sales 80%\nBased only on this information, the company's cash balance at the end of the second year is closest to:\nA. $32,000\nB. $50,000\n\nC. $180,000\nExplanation\nBusinesses often rely on key assumptions to forecast long-term financial performance. The forecast assumptions often rely on:\nA growth rate to forecast sales\nCost or profit margin as a percent of sales to forecast cost or margin in currency terms\nWorking capital investments\nFixed capital investments\nFinancing from external sources (eg, issuing debt or equity)\nAs shown, at the end of Year 2, the company's net income (at 30% of sales) is $162,000. Working capital investments are $32,000, as reflected in\nthe change in working capital levels from $400,000 to $432,000. Netting Year 2's net income with investments in working capital results in\n$130,000 cash inflow. Since Year 2's beginning cash balance is $50,000, this $130,000 increase in cash results in an ending cash balance of\n$180,000.\n(Choice A) $32,000 is the change in working capital in Year 2.\n(Choice B) $50,000 is the ending balance of cash in Year 1.\nThings to remember:\nBusinesses often rely on key assumptions to forecast long-term financial performance. This change in cash is forecast using assumptions about\nsales growth, profit margin, and working capital investments.\nDescribe how ratio analysis and other techniques can be used to model and forecast earnings", "qhtml": null}, {"n": 241, "q": "An entrepreneur starts a company by investing $300,000 of equity to fund working capital. The entrepreneur makes the following forecast assumptions: First-year sales $500,000 Annual sales growth 8% Net profit margin 30% Working capital / Sales 80% Based only on this information, the company's cash balance at the end of the second year is closest to:", "opts": ["$32,000", "$50,000", "$180,000"], "ans": "C", "expl": "Businesses often rely on key assumptions to forecast long-term financial performance. The forecast assumptions often rely on:\nA growth rate to forecast sales\nCost or profit margin as a percent of sales to forecast cost or margin in currency terms\nWorking capital investments\nFixed capital investments\nFinancing from external sources (eg, issuing debt or equity)\nAs shown, at the end of Year 2, the company's net income (at 30% of sales) is $162,000. Working capital investments are $32,000, as reflected in\nthe change in working capital levels from $400,000 to $432,000. Netting Year 2's net income with investments in working capital results in\n$130,000 cash inflow. Since Year 2's beginning cash balance is $50,000, this $130,000 increase in cash results in an ending cash balance of\n$180,000.\n(Ch
