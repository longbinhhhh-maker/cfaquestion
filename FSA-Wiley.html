 of rising inventory costs, since a lower COGS results in a\nhigher gross profit and revenue remains unchanged.\nThings to remember:\nSince a company using FIFO calculates its COGS with the oldest units purchased, during periods of rising inventory costs, the least expensive\nunits are used in COGS. This results in a lower COGS and a higher average inventory and, therefore, a lower inventory turnover ratio.\nCalculate and explain how inflation and deflation of inventory costs affect the financial statements and ratios of companies that use different\ninventory valuation methods", "qhtml": null}, {"n": 103, "q": "An analyst gathers the following data on two companies: Selected financial information In EUR (millions) Company A Company B Inventory valuation method LIFO FIFO Revenue (20X9) 1,300 2,200 COGS (20X9) 800 1,500 Gross profit (20X9) 500 700 Inventory (20X9) 145 280 Inventory (20X8) 115 265 LIFO reserve (20X9) 20 LIFO reserve (20X8) 35 Neither company has reported inventory shortages or write-downs. After the appropriate adjustments are made to compare the companies' financial data, Company A's inventory turnover is most likely: ", "opts": ["less than Company B's.", "the same as Company B's.", "greater than Company B's."], "ans": "A", "expl": "Two steps are required to allow for a comparison between Company A and Company B:\nConvert Company A's financial information from LIFO to FIFO, and then\ncalculate the inventory turnover of both companies.\nSince the two companies use different inventory valuation methods, Company A's inventory and COGS must be converted from LIFO to FIFO.\nThis is achieved with the LIFO reserve, a required disclosure for a company using LIFO. To convert Company A's ending inventory for a given\nperiod to FIFO, add the LIFO reserve for the same period to the inventory balance. To convert COGS, add the amount of decrease in the LIFO\nreserve over the period to the reported COGS.\nThe change in the LIFO reserve is calculated from a period's beginning and ending LIFO reserve. The adjustments to Company A's financial data\nare as follows:\nAfter Company A's data is converted to FIFO, the inventory turnover for both companies can be calculated and compared. Inventory turnover is\nthe ratio of COGS to average inventory (ie, the average number of times that the company sells and replenishes its inventory during a period).\nAdjusted financials (FIFO) Company A Company B\nRevenue 1,300 2,200\nCOGS 815 1,500\nGross profit 485 700\nInventory (20X9) 165 280\nInventory (20X8) 150 265\n815 / [(165 + 150) / 2] 1,500 / [(280 + 265) / 2]\nInventory turnover\n= 5.2 = 5.5\nConverting Company A's inventory and COGS to FIFO shows that the company has a lower inventory turnover than Company B (Choices B and\nC).\nThings to remember:\nTo convert a company's inventory balance from LIFO to FIFO, the LIFO reserve is added to the ending inventory balance. To convert the\ncompany's reported COGS from LIFO to FIFO, the decrease (increase) in the LIFO reserve is added to (subtracted from) COGS. After these\nadjustments are made, the company's inventory turnover is calculated as the ratio of COGS to average inventory.\nDescribe the presentation and disclosures relating to inventories and explain issues that analysts should consider when examining a company’s\ninventory disclosures and other sources of information", "qhtml": null}, {"n": 104, "q": "A clothing retailer reporting under IFRS purchased merchandise for £500,000 at the beginning of the year. Normally, the retailer could sell this inventory for £700,000, but now the estimated selling price is £510,000. The cost of selling the inventory is £15,000. Based on this information, the retailer's reported carrying value of inventory (in £ thousands) is closest to:", "opts": ["485", "495", "500"], "ans": "B", "expl": "Inventory may lose value due to spoilage, obsolescence, or declines in selling prices. Companies update their inventory values on the balance\nsheet to account for such events. IFRS require companies to report the carrying value of inventory at the lower of historic cost and net\nrealizable value (NRV). The NRV equals the estimated selling price minus the cost of completing and selling the inventory.\nIn this scenario, the estimated selling price is now 510 (in £ thousands). The selling cost is 15, so the NRV is 495 (510 − 15). Since the NRV is\nlower than the historical cost of 500, this inventory should be written down to the NRV of 495 on the balance sheet.\n(Choice A) 485 is the carrying value, not the selling price, less the selling cost.\n(Choice C) 500 is the historical cost of the inventory, but it is lower only if incorrectly compared to the selling price instead of the NRV.\nThings to remember:\nIFRS require companies to report the carrying value of inventory at the lower of historic cost and net realizable value (NRV). The NRV equals the\nestimated selling price minus the cost of completing and selling the inventory.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 105, "q": "A company reporting under US GAAP and using FIFO assesses its inventory's net realizable value as being €200,000 less than its carrying value. The company records a write-down and increases COGS by €200,000. In the subsequent period, a new assessment of the inventory's net realizable value is €250,000 higher than its revised carrying value. The company's most appropriate action is to reduce COGS by:", "opts": ["€0", "€200,000", "€250,000"], "ans": "A", "expl": "Inventory write-downs and reversals\nWhen to When to reverse Maximum\nwrite down a write-down reversal\nUS GAAP Net realizable value Reversals\nN/A\n(FIFO, weighted average) < cost prohibited\nUS GAAP\nMarket value Reversals\n(LIFO, retail N/A\n< cost prohibited\ninventory)\nNet realizable value Net realizable value Amount of\nIFRS\n< cost > carrying value write-down\nInventory costs may decline due to spoilage, obsolescence, or reduced selling prices. Companies reporting under IFRS and US GAAP using any\ninventory valuation method other than the LIFO and retail inventory methods must value their inventory at the lower of cost and net realizable\nvalue. Net realizable value is the estimated selling price in the normal course of business less the costs to complete the sales of inventory.\nIf the net realizable value of a company's inventory becomes lower than its cost, the company must write down the inventory to its net\nrealizable value. At the same time, the company must increase COGS by the same amount. This becomes the inventory's new carrying value.\nUnder US GAAP, reversals of write-downs are prohibited. Therefore, in this scenario, the company should do nothing even though the net\nrealizable value of its inventory rose above its carrying cost following the write-down. It should not reduce COGS.\nUnder IFRS, write-downs can be reversed in subsequent periods if net realizable value rises above the new carrying value. However, a reversal\ncannot exceed the value of the write-down (Choices B and C).\nThings to remember:\nIf the net realizable value of a company's inventory becomes lower than its cost, the company must report a write-down and increase COGS by\nthe amount of the write-down. Under US GAAP, reversals of write-downs are prohibited.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 106, "q": "A company that reports under US GAAP decides to change its inventory accounting from FIFO to LIFO. The change on its financial statements is most appropriately disclosed:", "opts": ["retroactively, including a restatement of prior years' financial statements.", "retroactively, without restating prior financial statements but disclosing the impact of the change to prior years' statements in footnotes.", "prospectively, without restating prior financial statements but disclosing the impact of the change to prior years' statements in footnotes."], "ans": "C", "expl": "Disclosure requirements: change in inventory costing methods\nChange reporting method to: US GAAP IFRS\nExplain why LIFO is superior\nLIFO Apply prospectively Not permitted\nNo restatement of prior statements\nExplain why new method is superior Must justify change\nAny other method Apply retrospectively Apply retrospectively\nRestatement of prior financials Restatement of prior financials\nOnly US GAAP permit companies to use LIFO. Switching from LIFO to any other method requires the company to explain why the new method\nis better than LIFO, and it must also restate prior financial statements as though it had used the new method in prior years (Choices A and B).\nOne reasonable explanation for switching from LIFO to FIFO is that it improves comparability between IFRS and GAAP reporting companies.\nWhen switching to LIFO from another method, US GAAP require the company to treat the change prospectively. It must disclose the reasons\nfor the change but is not required to restate prior financial statements. Although the CFA materials do not explain why no restatement is\nnecessary, there is no need to retroactively adjust comparisons since IFRS companies cannot use LIFO.\nThings to remember:\nUS GAAP impose more reporting requirements for companies that switch from LIFO to a different method. Switching to LIFO requires only\ndisclosure of the rationale for the change without restatement of prior financial statements.\nDescribe the presentation and disclosures relating to inventories and explain issues that analysts should consider when examining a company’s\ninventory disclosures and other sources of information", "qhtml": null}, {"n": 107, "q": "A manager collects information on a company's inventory for a period: Per-Unit Inventory USD Original cost 105 Selling price 140 Selling cost 10 Completion cost 30 Replacement cost 96 Normal profit margin 7 The company uses LIFO to calculate COGS. Based on only this information, under US GAAP, the per-unit value (in USD) for the existing inventory is closest to: ", "opts": ["96", "100", "105"], "ans": "A", "expl": "Inventory may lose value due to spoilage, obsolescence, or declines in selling prices. Companies often update their inventory values on the\nbalance sheet to account for such events. US GAAP require companies to report inventory at the lower of historical cost or market value (MV).\nWhen a company reports under US GAAP and uses LIFO as its inventory costing method, MV is the current replacement cost subject to an\nupper and lower limit.\nThe upper limit is the net realizable value (NRV), which is the selling price net of the costs to complete and sell the inventory. In this\nscenario, NRV = Selling price − Selling cost − Completion cost, so NRV = 140 − 10 − 30 = 100.\nThe lower limit is the NRV minus a normal profit margin. In this scenario, the lower limit is NRV − Normal profit margin = 100 − 7 = 93.\nMV is always the middle number of the replacement cost (RC), upper limit, and lower limit when ranked in order:\nIf RC > Upper > Lower, MV is the upper limit.\nIf Upper > RC > Lower, MV is the RC.\nIf Upper > Lower > RC, MV is the lower limit.\nIn this case, the MV is the RC of $96 per unit since it is within the upper and lower limits and is lower than the historical cost of the inventory.\n(Choice B) $100 is the upper limit for MV, which is capped at the upper limit only when RC exceeds the upper limit.\n(Choice C) $105 is the company's historical cost. The inventory's NRV is lower than its historical cost, so the NRV should be reported.\nThings to remember:\nCompanies that report under US GAAP should report inventory at the lower of historical cost or market value. When a company uses LIFO,\nmarket value is the lower of net realizable value, which is the sales price net of the costs to complete and sell the inventory, and net realizable\nvalue minus a normal profit margin.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 108, "q": "In 20X7, a company wrote down its inventory from £30 million to £28.7 million. In 20X8, a global shortage of this product results in the inventory having a net realizable value of £35 million. Under IFRS, the company's revaluation of inventory to reflect its increased value is closest to:", "opts": ["£0", "£1.3 million", "£6.3 million"], "ans": "B", "expl": "Inventory write-downs and revaluations\nUS GAAP IFRS\nLower of cost or net realizable value (FIFO) Lower of cost or net realizable value (LIFO not permitted\nLower of cost or market value (LIFO) under IFRS)\nMarket value equals replacement cost but with an upper and lower limit Revaluations in future periods permitted\nUpper limit: net realizable value Revaluations limited to amount of all previous write-\nLower limit: net realizable value less normal profit margin downs (except for agricultural, forest, and mineral\nRevaluations generally NOT permitted products)\nIFRS, unlike GAAP, permit upward revaluation of inventory if the net realizable value increases. With very few exceptions, upward revaluation\nis limited to the amount of all previous write-downs. Further, the maximum value for the inventory is its original cost.\nThis company wrote down its inventory by £1.3 million to reflect its reduced value. Although the value has sharply increased, the amount of\nrevaluation is limited to the previous £1.3 million reduction. This brings the inventory's value back to its original cost of £30 million.\n(Choice A) This would be the case under US GAAP, which do not permit upward revaluations to previously written-down inventory except for\nagricultural, forest, and mineral products.\n(Choice C) IFRS limit revaluation of inventory to the original cost, even if the future net realizable value exceeds the original cost. For\nagricultural, forest, and mineral products, revaluations can exceed the original cost.\nThings to remember:\nIFRS require inventory to be carried at the lower of cost or net realizable value. Revaluations are permitted if net realizable value increases in\nfuture periods but are generally limited to the amount of all previous write-downs.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 109, "q": "When inventory costs are declining, a company using FIFO will most likely experience:", "opts": ["a lower current ratio.", "a higher gross profit margin.", "an increase in working capital."], "ans": "A", "expl": "FIFO (first-in, first-out) inventory costing means that a company is deemed to have sold its older inventory first. When inventory costs fall, older\ninventory is valued higher than more recently purchased inventory. The older inventory is included in the cost of goods sold (COGS), so a higher-\nvalued inventory equals higher COGS. Gross profit is the difference between revenues and COGS, so a higher COGS translates to lower profits.\nWhen older inventory is sold first, ending inventory consists of the more recent purchases. With falling inventory costs, more recent purchases are\nless costly than the older ones, so ending inventory is worth less than beginning inventory. Inventory is a current asset, and the current ratio is\ncalculated as current assets divided by current liabilities. A lower ending inventory value means a lower value for both current assets and the\ncurrent ratio.\n(Choice B) Since COGS is higher when inventory costs fall (using FIFO), gross profit is lower, not higher. The gross profit margin is equal to\ngross profit divided by revenues, so the gross profit margin is also less.\n(Choice C) Working capital is the difference between current assets and current liabilities. A lower inventory value results in lower working\ncapital.\nThings to remember:\nWhen inventory costs fall, a company using FIFO experiences lower profits due to the higher cost of goods sold. Ending inventory has less value\nthan beginning inventory under FIFO, since ending inventory consists of more recent purchases that cost less than older purchases.\nCalculate and explain how inflation and deflation of inventory costs affect the financial statements and ratios of companies that use different\ninventory valuation methods", "qhtml": null}, {"n": 110, "q": "An engineering company manufactures high-end automotive accessories. It reports under US GAAP and uses LIFO. The company is replacing its inventory for the coming year and has determined that its existing inventory has become obsolete. An analyst gathers the following information: Per-Unit Inventory USD Original cost 105 Selling price 150 Replacement cost 96 Net realizable value 100 Normal profit margin 7 The per-unit value that the company reports for the existing inventory is closest to: ", "opts": ["$96", "$100", "$110"], "ans": "A", "expl": "US GAAP require companies using LIFO to report inventory at the lower of historic cost or market value. US GAAP define market value as\nreplacement cost (subject to upper and lower limits). The upper limit is net realizable value, which equals the selling price minus costs to\ncomplete and sell the inventory. The lower limit is net realizable value minus a normal profit margin.\nWhen the replacement cost falls between the two limits, as is the case here, then it is used as the market value, which is then compared to the\nhistoric cost. The diagram below illustrates this concept:\n(Choice B) $100 represents the upper bound for market value. This would be the correct answer if the replacement cost were higher than the\ninventory's net realizable value.\n11.A company that reports under IFRS is valuing its year-end inventory. It has collected the following information (in CHF millions):\nHistoric cost 175\nReplacement cost 165\nSelling price 240\nCost to sell inventory 60\nBased on this data, the inventory value (in CHF millions) reported on its balance sheet is closest to:\nA. 165\n\nB. 175\nC. 180\nExplanation\nInventory is initially recorded on a company's balance sheet at historic cost. However, companies are required to regularly reassess this value. If\nthe inventory's value falls below its cost (eg, spoils, becomes obsolete, declines in selling price), the company must write down the inventory to\nreflect the new, lower value, which becomes the carrying value.\nIFRS require companies to report the carrying value of inventory at the lower of cost or net realizable value (NRV). The NRV is the estimated\nselling price less the cost of completing and selling the inventory.\nIn this scenario, the NRV of the inventory is CHF 180 million (240 − 60). This is higher than the cost of 175, so no write down is taken and the\ninventory remains at 175.\n(Choice A) 165 is the replacement value, which is not used by IFRS in valuing inventory. The replacement value is used by companies reporting\nunder US GAAP and using LIFO or retail inventory methods when valuing inventory.\n(Choice C) 180 is the NRV, which is greater than the historical cost. Since inventory is required to be valued at the lower of cost and NRV, the\ncompany would not be permitted to increase the value of its inventory above 175.\nThings to remember:\nIFRS require companies to report the carrying value of inventory at the lower of cost or net realizable value (NRV). The NRV is the estimated\nselling price less the costs of completing and selling the inventory.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 111, "q": "A company that reports under IFRS is valuing its year-end inventory. It has collected the following information (in CHF millions): Historic cost 175 Replacement cost 165 Selling price 240 Cost to sell inventory 60 Based on this data, the inventory value (in CHF millions) reported on its balance sheet is closest to:", "opts": ["165", "175", "180"], "ans": "B", "expl": "Inventory is initially recorded on a company's balance sheet at historic cost. However, companies are required to regularly reassess this value. If\nthe inventory's value falls below its cost (eg, spoils, becomes obsolete, declines in selling price), the company must write down the inventory to\nreflect the new, lower value, which becomes the carrying value.\nIFRS require companies to report the carrying value of inventory at the lower of cost or net realizable value (NRV). The NRV is the estimated\nselling price less the cost of completing and selling the inventory.\nIn this scenario, the NRV of the inventory is CHF 180 million (240 − 60). This is higher than the cost of 175, so no write down is taken and the\ninventory remains at 175.\n(Choice A) 165 is the replacement value, which is not used by IFRS in valuing inventory. The replacement value is used by companies reporting\nunder US GAAP and using LIFO or retail inventory methods when valuing inventory.\n(Choice C) 180 is the NRV, which is greater than the historical cost. Since inventory is required to be valued at the lower of cost and NRV, the\ncompany would not be permitted to increase the value of its inventory above 175.\nThings to remember:\nIFRS require companies to report the carrying value of inventory at the lower of cost or net realizable value (NRV). The NRV is the estimated\nselling price less the costs of completing and selling the inventory.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 112, "q": "Which of the following types of ratio will most likely be positively affected by an inventory write-down?", "opts": ["Activity", "Liquidity", "Profitability"], "ans": "A", "expl": "Companies write down the carrying value of inventory on the books due to spoilage, obsolescence, or reductions in selling prices. When a\nwrite-down occurs, the company decreases inventory on the balance sheet and increases COGS on the income statement, both by the amount of\nthe write-down. These adjustments have a negative impact on liquidity and profitability ratios and an artificially positive impact on activity ratios.\nActivity ratios measure efficiency. One common example is inventory turnover (or COGS / Inventory), which measures the average number of\ntimes a company sells its average inventory over a period. After a write-down, the ratio becomes higher since an inventory write-down increases\nCOGS (numerator) and decreases inventory (denominator). This makes a company appear to be more efficient at turning its inventory into sales.\nAnalysts should be aware of the impact of such practices and make appropriate adjustments when analyzing financial reports.\n(Choice B) Liquidity ratios measure a company's ability to cover short-term obligations. They commonly consist of current assets (including\ninventory) in the numerator and current liabilities in the denominator. Decreasing inventory value reduces the numerator, which worsens the ratio.\n(Choice C) Profitability ratios measure a type of profit as a fraction of revenue. Write-downs increase COGS, an expense, thereby decreasing all\ntypes of profitability.\nThings to remember:\nWhen a company writes down inventory, it decreases inventory on the balance sheet and increases COGS on the income statement, both by the\namount of the write-down. These adjustments have a negative impact on liquidity and profitability ratios and an artificially positive impact on\nactivity ratios.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 113, "q": "A manufacturing company that uses LIFO under US GAAP shows the following inventory-related information at the end of 20X8: Based on this data, the inventory amount reported on the balance sheet (in $ millions) is closest to:", "opts": ["70", "75", "95"], "ans": "B", "expl": "Inventory may lose value due to spoilage, obsolescence, or declines in selling prices. Companies often update their inventory values on the\nbalance sheet to account for such events. US GAAP require companies using LIFO to report inventory at the lower of historic cost or market\nvalue (MV).\nMV is defined as the current replacement cost (RC) subject to an upper and lower limit.\nThe upper limit is the net realizable value (NRV), which equals the selling price minus costs to complete and sell the inventory. In this\nscenario, the upper limit (NRV) equals the selling price (110) minus the completion cost (15), or 95.\nThe lower limit is the NRV minus a normal profit margin. In this scenario, the lower limit equals NRV (95) minus a normal profit margin (20),\nor 75.\nThe MV is 75 since the RC of 70 is subject to a lower limit of 75 (ie, cannot fall below 75). Since the company must record inventory at the lower\nof cost or market, it must update its inventory amount on the balance sheet to 75.\nNote: MV is always the middle number of the RC, upper limit, and lower limit, when ranked in order:\nIf RC > Upper > Lower, MV is the upper limit.\nIf Upper > RC > Lower, MV is the RC.\nIf Upper > Lower > RC, MV is the lower limit.\n(Choice A) 70 results from not imposing a lower limit of 75 on the RC.\n(Choice C) 95 is the NRV, which is the upper limit.\nThings to remember:\nUS GAAP require companies using LIFO to report inventory at the lower of historic cost or market value (MV). MV is defined as the replacement\ncost subject to an upper and lower limit. The upper limit is the net realizable value (NRV), which equals the selling price minus completion and\nselling costs. The lower limit is NRV minus a normal profit margin.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 114, "q": "Unlike companies that comply with US GAAP, a company reporting under IFRS can disclose in its financial statements the amount of:", "opts": ["LIFO reserves.", "an inventory write-down.", "a reversal of an inventory write-down."], "ans": "C", "expl": "Inventory constitutes a large percentage of total assets for many companies and can significantly impact revenue, expenses (ie, cost of sales),\nand liquidity. As such, companies provide inventory-related disclosures in financial statements to better explain reporting methods and trends.\nOne important category of disclosure relates to reversals of previously written down inventory, which is permitted under IFRS only. In general,\na write-down occurs when an inventory item's market value falls below its carrying value on the balance sheet. A write-down increases expenses\n(cost of sales) and lowers profits. Any subsequent reversals of write-downs will allow companies to recapture these lost profits.\n(Choice A) LIFO reporting is allowed under US GAAP, not IFRS. LIFO reserves measure the difference between ending inventory value\nmeasured under FIFO and LIFO and are reported only for US GAAP companies.\n(Choice B) Companies using both US GAAP and IFRS disclose information related to inventory write-downs.\nThings to remember:\nReversals of inventory write-downs are permitted under IFRS only. These reversals allow companies to recapture lost profits from previous write-\ndowns.\nDescribe the presentation and disclosures relating to inventories and explain issues that analysts should consider when examining a company’s\ninventory disclosures and other sources of information", "qhtml": null}, {"n": 115, "q": "A company reporting under US GAAP has both increasing inventory levels and increasing inventory unit costs. Which inventory valuation method most likely results in the lowest days of inventory on hand? ", "opts": ["LIFO", "FIFO", "Weighted average cost"], "ans": "A", "expl": "Rising and falling inventory unit costs will have different effects on a company's reported financials depending on its inventory valuation method.\nWith the LIFO method, during periods of rising costs and steady-to-increasing inventory quantities, the most expensive inventory is included in a\ncompany's COGS, resulting in a higher COGS when compared to other inventory methods. In addition, ending inventory is lower since the least\nexpensive units remain in inventory.\nA company's days of inventory on hand is equal to 365 days in a year divided by the company's inventory turnover ratio. The more frequently a\ncompany turns over its inventory, the fewer days it remains on hand.\nSince a company using LIFO has a higher COGS and lower inventory, its inventory turnover is higher. Days of inventory are inversely affected\nsince inventory turnover is the denominator. Therefore, days of inventory on hand are lower for a company using LIFO compared to a company\nusing FIFO during a period of rising inventory costs (Choice B).\n(Choice C) Using the weighted average cost method results in an amount of COGS between LIFO and FIFO. Therefore, using this method, days\nof inventory on hand are not the lowest of the given methods.\nThings to remember:\nIn periods of rising costs and steady-to-increasing inventory, LIFO results in a higher COGS, lower ending inventory, and lower days of inventory\non hand compared to other inventory valuation methods.\nCalculate and explain how inflation and deflation of inventory costs affect the financial statements and ratios of companies that use different\ninventory valuation methods", "qhtml": null}, {"n": 116, "q": "Which of the following statements best describes the revaluation model and cost model for valuing long-lived tangible assets?", "opts": ["Both models compare historical costs to fair value.", "Only the revaluation model uses the lower of historical cost or fair value.", "Under the cost model, carrying values are always less than or equal to historical costs."], "ans": "C", "expl": "Long-lived asset valuations\nRevaluation model Cost model\nBeginning carrying value Historical cost\nDepreciation for all years Accumulated depreciation\nFair value adjustment Revaluation =\nNot applicable\nCurrent fair value − carrying value\nEnding carrying value Historical cost Historical cost\n−Accumulated depreciation −Accumulated depreciation\n± Revaluation\nIFRS, but not US GAAP, allow companies to choose between the cost model or the revaluation model for valuing long-lived assets. Using the\ncost model, an asset's carrying value is its historical cost less accumulated depreciation. The cost model only allows decreases in the carrying\nvalue of a long-lived asset, which could result from depreciation or impairment. Therefore, the cost model always reports an asset's carrying\nvalue below its historical cost.\nUsing the revaluation model, the asset's carrying value changes based on its fair value. Revaluations adjust an asset's carrying value upward or\ndownward. An initial upward revaluation suggests that a company reports the asset on the balance sheet at a higher value than its original cost.\n(Choice A) The revaluation model, unlike the cost model, compares an asset's historical cost to its fair value to make adjustments to the asset's\ncarrying value.\n(Choice B) Under the revaluation model, an asset's carrying value is based on its fair value. This can be higher or lower than the asset's\nhistorical cost.\nThings to remember:\nUsing the cost model, an asset's carrying value is its historical cost less accumulated depreciation. The cost model only allows decreases in the\nvalue of a long-lived asset below its historical cost, which could result from depreciation or impairment. Therefore, the cost model always reports\nan asset's carrying value below its historical cost.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 117, "q": "At the beginning of 20X7, a company purchased production equipment for EUR 50 million with a 10-year useful life. At the end of 20X7, management estimates that the equipment is worth EUR 60 million. The company reports under IFRS and uses the revaluation model for valuing its production equipment. If the company has no previous revaluations, the impact on net income due to the increase in the equipment's value (in EUR) is closest to: ", "opts": ["0", "1,000,000", "10,000,000"], "ans": "A", "expl": "Financial statement treatment of revaluation of noncurrent assets—IFRS only\nUpward revaluation Downward revaluation\nGain recognized in other comprehensive income (OCI) as\nInitial Loss recognized on income statement\nrevaluation surplus\nRecognized on income statement to the extent of previous\nReduces revaluation surplus\nrecognized losses\nSubsequent If revaluation surplus = 0, recognized on income\nGain in excess of previous losses recognized as revaluation\nstatement as loss\nsurplus\nCompanies that use IFRS may elect to use the revaluation method to account for changes in long-lived assets' values. The accounting treatment\nof a revaluation depends on whether the asset's value increases or decreases and whether the valuation is initial or subsequent. An asset's initial\nrevaluation gain, as is the case here, is reported in shareholders' equity as an increase to other comprehensive income (OCI) and does not\nimpact net income.\nAn asset's value initial revaluation loss is recognized on the income statement. Subsequent revaluation gains are also recognized in income, but\nonly to the extent that they reverse previously recognized losses. Gains that exceed previously recognized losses (ie, revaluation surplus) are\nreported in other comprehensive income. In this case, none of the increase in value represents a recovery of previously recognized losses since\nthe company has never revalued its long-lived assets.\n(Choice B) EUR 1,000,000 is the result of recognizing a gain that represents 1/10 (ie, one year's worth) of the EUR 10 million increase in value\nbased on its 10-year useful life.\n(Choice C) EUR 10,000,000 is the result of recognizing the entire gain as an increase in net income. Initial gains in value under the revaluation\nmethod do not impact net income; they are accounted for in OCI.\nThings to remember:\nUnder the revaluation method, an asset's initial revaluation gain is reported in shareholder's equity as an increase to other comprehensive\nincome. An asset's value initial revaluation loss is recognized in the income statement. Subsequent revaluation gains are also recognized in\nincome, but only to the extent that they reverse previously recognized losses.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 118, "q": "If the value of a patent has been impaired, the impairment is most appropriately accounted for:", "opts": ["only on the balance sheet.", "only in the footnotes to the financials.", "on both the balance sheet and income statement."], "ans": "C", "expl": "Impairment of intangible assets with a finite life\nImpairment test done only when significant events warrant analysis\nAccounting treatment essentially the same as for tangible assets\nImpairment reduces the value of the asset on the balance sheet\nImpairment flows through the income statement and into net income\nIntangible assets with a finite life (eg, patents) are amortized over time and can become impaired under certain circumstances. Testing for\nimpairment occurs irregularly and only when significant events warrant additional scrutiny.\nIf an asset is deemed impaired, it is written down using an impairment charge that flows through the income statement, reducing net income in that\nperiod (Choice A). The write-down also reduces the asset's carrying value (ie, historical cost minus accumulated amortization) on the balance\nsheet.\n(Choice B) The footnotes are likely to include additional information regarding an impairment charge, but the impairment will definitely be\nreflected in the balance sheet and income statement.\nThings to remember:\nIntangible assets with a finite life can become impaired. If an asset is deemed impaired, it is written down by the amount of the impairment,\nreducing the carrying value on the balance sheet. The impairment charge also flows through the income statement, reducing net income in that\nperiod.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 119, "q": "A company capitalized a ¥120 million equipment purchase at the beginning of this year and will use straight-line depreciation with zero salvage value and a three-year useful life. The company generates ¥200 million in revenue every year, and the tax rate is 25%. If depreciation and taxes are the only expenses, and based only on this information, the second year's ending financial results most likely show:", "opts": ["¥40 million in taxes.", "¥80 million in net PPE.", "¥120 million in cash from operations."], "ans": "A", "expl": "Capitalizing an asset purchase initially reports the full asset cost on the balance sheet and subsequently allocates that cost to the income\nstatement as depreciation expense over the asset's useful life. This allows the income statement to reflect the cost of using the asset more\naccurately in each period of its use.\nWhen the company capitalizes a purchase, the purchase price is reported on the balance sheet upon initial recognition. In this situation, each\nyear's depreciation expense of ¥40 million, or (¥120 million purchase price − 0 salvage value) / 3 years, is reported on the income statement.\nSince revenue is ¥200 million for Year 2 and ¥40 million in depreciation is the only expense, pretax income equals ¥160, and 25% of pretax\nincome equals ¥40 million.\n(Choice B) ¥80 million is the net PPE at the end of the first year. Since historical cost (ie, gross PPE) is ¥120 million, and accumulated\ndepreciation after two years is ¥80 million, net PPE equals ¥40 million at the end of the second year.\n(Choice C) ¥120 million is the net income for the second year, not cash from operating activities. To derive cash from operations for the second\nyear, ¥40 million of depreciation (ie, noncash charge) is added back to net income.\nThings to remember:\nCapitalizing an asset purchase initially reports the full asset cost on the balance sheet and subsequently allocates that cost to the income\nstatement as depreciation expense over the asset's useful life. This allows the income statement to reflect the cost of using the asset more\naccurately in each period of its use.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 120, "q": "An analyst has collected the following information on a technology company that reports financial results using US GAAP: 20X7 $ thousands Gross profit 25,000 Research and development expenses (5,000) Depreciation and amortization expenses (4,000) Total equity (beginning of year) 100,000 Total equity (end of year) 120,000 Tax rate 25% The company amortizes intangible assets over a five-year period using straight-line depreciation. Assume that the company can elect to either expense or capitalize its research and development costs. If it had capitalized all research and development costs in 20X7, its return on equity for 20X7 would be closest to:", "opts": ["10.9%", "13.4 %", "14.1%"], "ans": "B", "expl": "A company that expenses research and development (R&D) costs shows higher expenses and lower taxes and net income than a company\nthat capitalizes those costs. Capitalizing R&D expenses means that the company removes $5 million in expenses from its income statement.\nEarnings before interest, taxes, depreciation and amortization (EBITDA) rises from $20 million to $25 million.\nHowever, capitalization also increases the company's noncurrent intangible assets by $5 million. The company amortizes its intangible assets\nover five years, so amortization expense rises by $1 million in 20X7. The overall result is an increase in both pretax income (from $16 million to\n$20 million), and after-tax (net) income (from $12 million to $15 million).\nReturn on equity (ROE) = net income ÷ average equity. The table below shows the adjustments to net income and equity from the company's\ncapitalization of its R&D costs ($ thousands):\n(Choice A) 10.9% is the company's original ROE (ie, expensing rather capitalizing R&D costs).\n(Choice C) 14.1% results from correctly removing the R&D expense from the income statement but neglecting to account for the additional\namortization expense.\nThings to remember:\nCapitalizing research and development costs instead of expensing them causes a company to report higher earnings and higher return on equity\nin the period that the costs were capitalized. However, these increases are partially offset by a higher amortization expense since capitalization\nincreases the company's intangible assets. ROE is net income as a percentage of average equity.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 121, "q": "A manufacturer purchases equipment at the beginning of 20X2 for AUD 17 million. At the end of 20X4, the accumulated depreciation is AUD 9 million, including the 20X4 depreciation expense of AUD 2 million. At the beginning of 20X5, management sells the equipment and receives AUD 3 million on the sale. The reported loss (in AUD millions) from the equipment's derecognition is closest to:", "opts": ["3", "5", "8"], "ans": "B", "expl": ".\nWhen a long-lived asset has no more economic benefit, its owner disposes of the asset by selling, exchanging, or abandoning it and derecognizes\nthe asset. If the asset is sold and there is a difference between the sales price and the asset's net book value, the company records a gain or\nloss on the sale in the amount of that difference.\nNet book value is the difference between the equipment's historical cost and its accumulated depreciation. To find the gain or loss from this sale,\nsubtract the equipment's historical cost from the sales price and add back its accumulated depreciation. In this scenario, the result is a loss of\nAUD 5 million.\n(Choice A) AUD 3 million is the result of adjusting the gain or loss by the current 20X4 depreciation expense. The 20X4 depreciation expense is\nincluded in the company's 20X4 accumulated depreciation.\n(Choice C) AUD 8 million is the asset's net book value (ie, equipment's historical cost less its accumulated depreciation).\nThings to remember:\nA company disposes of and derecognizes a long-lived asset when it provides no more economic benefit. If the equipment is sold and there is a\ndifference between its book value and the sales price, then the company records a gain or loss on the sale in the amount of that difference.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 122, "q": "At the beginning of 20X3, a company purchases a patent for CHF 100 million and expenses it over its 10-year useful life. The patent has an estimated residual value of CHF 10 million. At the end of 20X7, the company sells and derecognizes the patent, recording a loss of CHF 40 million. If the company uses the straight-line amortization method, the patent's sales price (in CHF millions) is closest to:", "opts": ["5", "10", "15"], "ans": "C", "expl": "When an intangible asset has no more economic benefit, the owner disposes of (ie, sells, exchanges, or abandons) the asset and derecognizes\nit. If the asset is sold and there is a difference between the sales price and the asset's book value, the company records a gain or loss in the\namount of that difference.\nBook value is the difference between the asset's historical cost (ie, purchase price) and its accumulated amortization. In this scenario, to find\nthe accumulated amortization using the straight-line method, calculate annual amortization expense and multiply it by the 5-year period.\nRearranging the gain or loss formula, the sales price is CHF 15 million.\n(Choice A) A sales price of CHF 5 million results from reducing the patent's original purchase price by its residual value. This accounts for the\nasset's residual value twice and understates the sales price.\n(Choice B) A sales price of CHF 10 million results from excluding the patent's residual value when determining amortization expense and\naccumulated amortization.\nThings to remember:\nA company derecognizes intangible assets when the assets have no more economic benefit. If an intangible asset is sold and there is a difference\nbetween the sales price and the asset's book value, the company records a gain or loss on the sale in the amount of that difference.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 123, "q": "A company buys a patent from a technology firm. If the patent purchase is not a part of a business combination, then the total cost of acquiring the patent is most likely: ", "opts": ["recorded at fair value on the balance sheet.", "expensed immediately on the income statement.", "allocated to fair value and goodwill on the balance sheet."], "ans": "A", "expl": "Treatment for intangible assets\nAcquisition method Treatment of costs\nPurchased on a stand-alone basis Fair value of assets capitalized on balance sheet\nResearch costs expensed immediately on income statement\nDeveloped internally through research\nDevelopment costs capitalized on balance sheet if product is developed for internal use (US\nand development\nGAAP) or has demonstrated technical feasibility (IFRS)\nAcquired through a business Fair value of assets capitalized on balance sheet\ncombination (eg, merger) Additional goodwill created on balance sheet\nIntangible assets (eg, patents, trademarks, software) lack physical form and grant the holder exclusive rights to future benefits. These assets can\nbe obtained through a standalone purchase, the acquisition of another company, or internal development.\nThe means of acquiring an intangible asset determines whether its costs are capitalized or expensed. If capitalized, the total purchase cost of the\nasset appears on the balance sheet and is subsequently amortized on the income statement over its useful life. If expensed, the entire purchase\ncost immediately reduces net income for the period on the income statement.\nIn this scenario, the patent is a standalone purchase (ie, without a business combination), so the total purchase costs are capitalized on the\nbalance sheet at fair value. Alternatively, acquiring the patent through a business combination (eg, merger) would create goodwill\n(Choice B) If the patent is developed internally, research costs are expensed.\n(Choice C) There is no goodwill in this scenario since goodwill results only from business combinations.\nThings to remember:\nIntangible assets can be obtained through a standalone purchase, the acquisition of another company, or internal development. If an intangible\nasset is acquired through a standalone purchase or business combination, it is capitalized. Acquiring an asset through a business combination\nmay create goodwill.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 124, "q": "A company decides to revalue a noncurrent asset upward to reflect its current fair value. The company had issued a bond to pay for this asset. If the asset has not been previously revalued, either upward or downward, the most likely impact of the company's decision is a: ", "opts": ["lower leverage ratio and lower return on equity.", "higher leverage ratio and lower return on assets.", "higher leverage ratio and higher return on assets."], "ans": "A", "expl": "Financial statement treatment of revaluation of noncurrent assets—IFRS only\nUpward revaluation Downward revaluation\nGain recognized in other comprehensive income (OCI) as\nInitial Loss recognized on income statement\nrevaluation surplus\nRecognized on income statement to the extent of previous\nReduces revaluation surplus\nrecognized losses\nSubsequent If revaluation surplus = 0, recognized on income\nGain in excess of previous losses recognized as revaluation\nstatement as loss\nsurplus\nIFRS, but not US GAAP, permit companies to revalue noncurrent assets to reflect their fair value. Revaluations can be up or down, and impact\nboth the income statement and the balance sheet. An upward revaluation means that the company reports the asset on the balance sheet at a\nhigher value than its original cost. This increase in the asset's carrying value results in a corresponding increase in shareholders' equity.\nFor initial upward revaluations, the increase in value bypasses the income statement and is reported in other comprehensive income (OCI);\nit has no impact on net income. Both return on assets (ROA) and return on equity (ROE) use net income as the numerator. Neither ratio's\nnumerator changes, so both will be lower, not higher (Choice C).\nThe leverage ratio is calculated as average total assets divided by average shareholders' equity. Unless a company has zero liabilities,\naverage assets is always greater than average equity. When a ratio is greater than one, adding the same amount to both the numerator and\ndenominator causes that ratio to decrease, not increase (Choice B).\nThings to remember:\nRevaluation of noncurrent assets is permitted under IFRS, but not US GAAP. Upward revaluation results in a lower leverage ratio, and because\nthe increase in value is initially recognized in other comprehensive income rather than the income statement, both return on assets and return on\nequity will also be lower.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 125, "q": "All else being equal, which of the following patent acquisition methods will most likely result in a company reporting the smallest amortization expense during the initial year of the patent?", "opts": ["Purchase a patent", "Develop a patent internally", "Obtain a patent through a merger"], "ans": "B", "expl": "Treatment for intangible assets\nAcquisition method Treatment of costs\nPurchased on a stand-alone basis Fair value of assets capitalized on balance sheet\nResearch costs expensed immediately on income statement\nDeveloped internally through research\nDevelopment costs capitalized on balance sheet if product is developed for internal use (US\nand development\nGAAP) or has demonstrated technical feasibility (IFRS)\nAcquired through a business Fair value of assets capitalized on balance sheet\ncombination (eg, merger) Additional goodwill created on balance sheet\nIntangible assets (eg, patents, trademarks, or software) lack physical form and grant the holder exclusive rights to future benefits. Management\nmay obtain these assets by purchasing them, internally developing them, or merging with a company that already owns them. Valuation of an\nintangible asset depends on the method of acquisition.\nAmortization expenses the capitalized value of an asset over its useful life. When a company develops a patent internally, it must expense\nresearch costs as incurred. Since there are no further development costs for a patent, no costs are capitalized and no amortization expense is\nreported over the patent's useful life.\n(Choices A and C) Purchasing a patent or merging with a company that has a patent both involve capitalizing the fair value of the patent; both\nresult in amortization expense over the patent's useful life.\nThings to remember:\nIf an intangible asset is acquired through a purchase or merger, the costs are capitalized and subsequently amortized. If the asset is developed\ninternally, amortization is minimized since research costs are expensed as incurred and not capitalized or amortized.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 126, "q": "Which of the following actions creates costs that are most likely expensed as incurred?", "opts": ["A company develops a patent internally.", "A firm purchases a trademark with cash.", "A corporation acquires copyrights through a merger."], "ans": "A", "expl": "Treatment for intangible assets\nAcquisition method Treatment of costs\nPurchased on a stand-alone basis Fair value of assets capitalized on balance sheet\nResearch costs expensed immediately on income statement\nDeveloped internally through research\nDevelopment costs capitalized on balance sheet if product is developed for internal use (US\nand development\nGAAP) or has demonstrated technical feasibility (IFRS)\nAcquired through a business Fair value of assets capitalized on balance sheet\ncombination (eg, merger) Additional goodwill created on balance sheet\nLong-lived assets that lack physical substance and are nonfinancial in nature are called intangible assets. Patents, trademarks, and copyrights\nare examples of intangible assets. Companies can buy intangible assets, develop them internally, or acquire them as part of a business\ncombination (ie, merger with another company).\nIf a trademark is developed internally (ie, within the company), its cost is expensed in the period incurred. In contrast, if a company obtains an\nintangible asset by purchasing it or acquiring it through a business combination, then its cost is capitalized and amortized over the asset's useful\nlife (Choices B and C).\nThings to remember:\nCompanies can buy intangible assets, develop them internally, or acquire them as part of a business combination. If an intangible asset is\ndeveloped internally, at least some of its costs are expensed as incurred.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 127, "q": "A company purchases a piece of capital equipment at the beginning of the year. The equipment has a useful life of three years and zero salvage value. All else being equal, compared to capitalizing the expenditure, if the company expenses the purchase, it would most appropriately report:", "opts": ["lower total cash after three years.", "the same cumulative net income over three years.", "lower cash flow from investing over the three years."], "ans": "B", "expl": "Expensing an asset purchase initially reports the amount of the expenditure on the income statement whereas capitalizing an asset\npurchase initially reports the amount of the expenditure on the balance sheet. Each method initially impacts the company's financial results\ndifferently, but the cumulative impact to net income and total cash flow under both methods is the same over time.\nThe example below shows this application for a ¥90 million asset purchase. This example assumes straight-line depreciation but would be true of\nany depreciation method:\nIf the company expenses the asset, the cost of ¥90 million is recorded one time on the income statement that year. As a result, net income and\noperating cash flow are initially low but subsequently recover in future years.\nIf the company capitalizes the asset, the cost of ¥90 million is instead reported on the balance sheet as a long-term asset upon initial recognition\nand subsequently spread to the income statement as a depreciation expense over the asset's useful life (ie, ¥30 million annually). Therefore, the\nimpact to net income and operating cash flow is reflected each year. However, at the end of three years, the cumulative impact to net income and\ntotal cash flow is the same.\n13.An investment firm recently sold some old office furniture with a historical cost of €100,000. Upon completing the sale, the company\nrecognized a gain of €5,000. If the accumulated depreciation on the furniture was €70,000, then the furniture was sold for a price (in €) closest to:\n\nA. 35,000\nB. 75,000\nC. 105,000\nExplanation\nCompanies often dispose of assets (eg, equipment, furniture) by selling to another party. The gain or loss on the sale is the sales amount\nminus the carrying value of the asset at the time of the sale. Carrying value (ie, net book value) is the gross book value (ie, historical cost)\nminus accumulated depreciation.\nIn this scenario, rearrange the equation to calculate the sales price. The company recorded a €5,000 gain on the sale of furniture with a carrying\nvalue of €30,000, so the sales price must have been closest to €35,000.\n(Choice B) €75,000 results from adding a gain of €5,000 to an accumulated depreciation of €70,000.\n(Choice C) €105,000 results from adding a gain of €5,000 to a historical cost of €100,000.\nThings to remember:\nThe gain or loss on the sale of a long-lived asset is the sales amount minus the carrying value of the asset at the time of the sale. Carrying value\n(ie, net book value) is the gross book value (ie, historical cost) minus accumulated depreciation.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 128, "q": "An investment firm recently sold some old office furniture with a historical cost of €100,000. Upon completing the sale, the company recognized a gain of €5,000. If the accumulated depreciation on the furniture was €70,000, then the furniture was sold for a price (in €) closest to: ", "opts": ["35,000", "75,000", "105,000"], "ans": "A", "expl": "Companies often dispose of assets (eg, equipment, furniture) by selling to another party. The gain or loss on the sale is the sales amount\nminus the carrying value of the asset at the time of the sale. Carrying value (ie, net book value) is the gross book value (ie, historical cost)\nminus accumulated depreciation.\nIn this scenario, rearrange the equation to calculate the sales price. The company recorded a €5,000 gain on the sale of furniture with a carrying\nvalue of €30,000, so the sales price must have been closest to €35,000.\n(Choice B) €75,000 results from adding a gain of €5,000 to an accumulated depreciation of €70,000.\n(Choice C) €105,000 results from adding a gain of €5,000 to a historical cost of €100,000.\nThings to remember:\nThe gain or loss on the sale of a long-lived asset is the sales amount minus the carrying value of the asset at the time of the sale. Carrying value\n(ie, net book value) is the gross book value (ie, historical cost) minus accumulated depreciation.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 129, "q": "A company acquires manufacturing equipment for $200,000. The equipment has 10 years of useful life left with an estimated salvage value of $10,000. The company depreciates the equipment using straight-line depreciation. If the company sells the equipment for $30,000 after 8 years, the loss recorded on the equipment sale is closest to:", "opts": ["-$8,000", "-$10,000", "-$18,000"], "ans": "C", "expl": "Companies often dispose of assets (eg, used equipment, furniture) by selling to another party. The gain or loss on the sale equals the sales\namount minus the carrying amount of the asset at the time of the sale. The carrying amount (ie, net book value) equals the gross book value\n(ie, historical cost) minus accumulated depreciation.\nTo solve for the loss on the equipment sale:\nThings to remember:\nThe gain or loss on the sale is the sales amount minus the carrying amount of the asset at the time of the sale. The carrying amount equals the\nhistorical cost minus accumulated depreciation.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios LOS\n15.A company is currently developing a new software product for potential introduction to the market. If the company has demonstrated the\ntechnical feasibility of the software, then future development costs should most appropriately:\nA. be expensed.\n B. be capitalized as a long-term asset.\nC. reduce cash flow from operating activities.\nExplanation\nTreatment of research and development (R&D) costs\nIFRS US GAAP\nR&D costs: generally expensed\nResearch costs: Software exceptions\nexpensed R&D costs expensed prior to establishment of\nDevelopment technical feasibility\ncosts: capitalized R&D costs capitalized once technical feasibility\nis established\nIntangible assets (eg, patents, trademarks, software) lack physical form and can be obtained through standalone purchases, mergers and\nacquisitions (ie, business combinations), or internal development. When an intangible asset is acquired:\nexternally, costs are capitalized.\ninternally, certain research and development (R&D) costs may be expensed or capitalized.\nIFRS and US GAAP differ in some areas on the treatment of internal R&D costs:\nIFRS require companies to expense research costs when incurred and to capitalize development costs. Under IFRS, development costs\nare incurred once a product has proven technical feasibility.\nUS GAAP consider R&D costs together and typically require companies to expense those costs. However, for software, R&D costs are\ncapitalized once technical feasibility has been demonstrated.\nIn this scenario, the software product is being developed internally and has demonstrated technical feasibility. Therefore, the development costs\nsatisfy the capitalization criteria under both IFRS and US GAAP (Choice A).\n(Choice C) Since the development costs are capitalized, they represent a cash outflow under investing activities, not operating activities. Cash\nflow from operating activities captures costs that are expensed on the income statement.\nThings to remember:\nIFRS require companies to expense research costs when incurred and to capitalize development costs. Development costs are incurred once a\nproduct has proven technical feasibility. US GAAP typically require companies to expense research and development costs but capitalize costs for\nsoftware products once technical feasibility has been demonstrated.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 130, "q": "A company is currently developing a new software product for potential introduction to the market. If the company has demonstrated the technical feasibility of the software, then future development costs should most appropriately:", "opts": ["be expensed.", "be capitalized as a long-term asset.", "reduce cash flow from operating activities."], "ans": "B", "expl": "Treatment of research and development (R&D) costs\nIFRS US GAAP\nR&D costs: generally expensed\nResearch costs: Software exceptions\nexpensed R&D costs expensed prior to establishment of\nDevelopment technical feasibility\ncosts: capitalized R&D costs capitalized once technical feasibility\nis established\nIntangible assets (eg, patents, trademarks, software) lack physical form and can be obtained through standalone purchases, mergers and\nacquisitions (ie, business combinations), or internal development. When an intangible asset is acquired:\nexternally, costs are capitalized.\ninternally, certain research and development (R&D) costs may be expensed or capitalized.\nIFRS and US GAAP differ in some areas on the treatment of internal R&D costs:\nIFRS require companies to expense research costs when incurred and to capitalize development costs. Under IFRS, development costs\nare incurred once a product has proven technical feasibility.\nUS GAAP consider R&D costs together and typically require companies to expense those costs. However, for software, R&D costs are\ncapitalized once technical feasibility has been demonstrated.\nIn this scenario, the software product is being developed internally and has demonstrated technical feasibility. Therefore, the development costs\nsatisfy the capitalization criteria under both IFRS and US GAAP (Choice A).\n(Choice C) Since the development costs are capitalized, they represent a cash outflow under investing activities, not operating activities. Cash\nflow from operating activities captures costs that are expensed on the income statement.\nThings to remember:\nIFRS require companies to expense research costs when incurred and to capitalize development costs. Development costs are incurred once a\nproduct has proven technical feasibility. US GAAP typically require companies to expense research and development costs but capitalize costs for\nsoftware products once technical feasibility has been demonstrated.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 131, "q": "A company has equipment with a carrying value of USD 2 million. If the company reclassifies the equipment as held for use until disposal, the company most likely: ", "opts": ["continues to report depreciation and impairment charges.", "no longer reports impairment charges but continues reporting depreciation.", "no longer reports depreciation but continues reporting impairment charges."], "ans": "A", "expl": "A company may dispose of an asset by selling, exchanging, distributing, or abandoning it. If a noncurrent asset is considered held for sale (ie,\nwill be sold), the company no longer records depreciation expense or impairment charges.\nIf the asset is to be abandoned, exchanged, or distributed, it is classified as held for use until disposal. In this scenario, management will\ncontinue to report depreciation expenses and test the asset for impairment since the asset's carrying value is greater than zero (USD 2\nmillion). This lasts from the initial classification until the asset's disposal or until management reclassifies the asset (Choices B and C).\nThings to remember:\nA company may dispose of an asset by selling, exchanging, distributing, or abandoning it. If the company intends to abandon an asset, the asset\nis classified as held for use until disposal. If the asset's carrying value is greater than zero, the company continues to report depreciation and test\nfor impairment charges.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 132, "q": "A construction firm reports financial results under US GAAP. In 20X8, the firm borrowed $10 million for five years at 6% interest to construct its new headquarters building, which will have a useful life of 50 years and will be depreciated using the straight-line method. Construction will take three years to complete, and during that period the firm will earn $40,000 interest per year by temporarily investing the loan proceeds that it does not currently require for construction. If the firm has no other long-term assets and the loan requires only interest to be paid each year (ie, no amortization of principal), the amount of interest that the firm will capitalize is closest to:", "opts": ["$1.68 million", "$1.80 million", "$3.00 million"], "ans": "B", "expl": "Capitalized interest arises when a firm borrows to create a long-term asset (eg, a factory). The interest expense from the loan is added to the\ncost of the asset and increases the carrying value of the asset on the balance sheet. Instead of being included as interest expense, the\ncapitalized interest increases depreciation expense each year.\nThe firm incurs interest expense of $600,000 ($10 million × 6%) per year on the loan. Both IFRS and GAAP specify that interest is capitalized\nduring the construction period only. Interest is treated as a cost of acquisition. When the construction is finished, the asset has been \"acquired\"\nand requires no further acquisition expenditures. The firm's construction lasts three years, so the total capitalized interest is $1.80 million.\nIFRS and US GAAP treat capitalized interest similarly; the main difference concerns income received from temporarily investing loan proceeds\nduring construction. IFRS require firms to offset the amount of capitalized interest by the income, but GAAP do not allow this. The firm reports\nunder US GAAP, so it cannot offset the $120,000 income received ($40,000 per year for three years) against the $1.80 million capitalized interest\n(Choice A).\n(Choice C) The firm will treat the final two years of interest costs as ordinary interest expenses on the income statement. $3 million results from\ncapitalizing interest for the entire five-year loan period.\nThings to remember:\nCapitalized interest is the interest expense incurred from loans used to build long-term assets while the asset is being built. Capitalized interest is\nadded to the cost of the long-term asset and will be expensed over the asset's useful life through increased depreciation expense. Unlike US\nGAAP, IFRS require capitalized interest to be reduced by any income received from investing unneeded loan proceeds.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 133, "q": "A company reports its financial results under IFRS and provides the following information on a machine that it owns: £ Asset's historical cost 35,000 Accumulated depreciation 19,000 Undiscounted future cash flows from asset 20,000 Discounted future cash flows from asset 14,000 Fair value 17,500 Cost to sell asset 3,000 This year, the allowable impairment charge (£) that the company can take for the machine is closest to:", "opts": ["0", "1,500", "2,000"], "ans": "B", "expl": "Impairment is an unanticipated decline in an asset's value, such as a decline in demand for the good that the asset produces. The amount of\nimpairment under IFRS and US GAAP is the difference between the asset's carrying value (ie, net book value) and its \"recoverable amount,\" but\nUS GAAP and IFRS differ in how each defines \"recoverable.\"\nIFRS define \"recoverable amount\" as the greater of the asset's fair value less costs to sell the asset and the discounted future cash flows (ie,\nvalue in use) that the asset is expected to generate. By contrast, US GAAP define recoverable amount as the undiscounted cash flows. Under\nIFRS, if the carrying value (ie, historical cost less accumulated depreciation) exceeds the recoverable amount, then the impairment charge equals\nthe difference between them.\nThis company uses IFRS, so the machine's recoverable amount is the higher of its net fair value (£17,500 − 3,000 = £14,500) or its discounted\ncash flows (£14,000). The impairment charge calculation is shown in the table below:\n(Choice A) £0 results from applying the US GAAP standards of comparing undiscounted future cash flows (£20,000) to the asset's net book value\n(£16,000). Undiscounted future cash flows exceed the net book value, so there is no impairment under US GAAP.\n(Choice C) £2,000 results from incorrectly subtracting the discounted cash flows, rather than the net fair value, from the carrying value.\nThings to remember:\nIFRS and US GAAP require companies to determine whether noncurrent assets are impaired. IFRS uses the difference between the carrying\nvalue and the recoverable amount to determine whether, and by how much, an asset is impaired. IFRS define \"recoverable amount\" as the\ngreater of the net fair value and the discounted future cash flows from the asset.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 134, "q": "A company acquires the assets of another company in a business combination and records goodwill. Under US GAAP, which of the following is most likely included in goodwill?", "opts": ["Separable patents", "The fair market value of PPE", "Nonidentifiable intangible assets"], "ans": "C", "expl": "In a business combination, the difference between the purchase price and fair market value of net assets (ie, assets − liabilities) is goodwill. At\nthe time of the merger, long-lived tangible assets and identifiable intangibles are not reported as goodwill; instead, they are revalued to their fair\nmarket value. Intangible assets are identifiable and are included in the fair market value of net assets if:\nUnder US GAAP, they:\nOriginate as a legal claim (eg, patents, trademarks)\nAre separable (ie, can be sold separately) from the acquired company\nUnder IFRS, they:\nOriginate as a legal claim (eg, patents, trademarks)\nAre separable (ie, can be sold separately) from the acquired company\nAre controlled by the acquiring company\nCan create measurable economic benefits\nHave reliably measured costs\nIf intangible assets do not meet these criteria, they are not included in the fair market value of net assets and are accounted for as goodwill.\n(Choice A) Under US GAAP, if an intangible asset originates as a legal claim or is separable (eg, a patent), it is considered an identifiable\nintangible asset and is not included in goodwill.\n(Choice B) Tangible assets are revalued to their fair market value in a business combination. By definition, a tangible asset's (eg, PPE's) fair\nmarket value is identifiable and is not part of goodwill.\nThings to remember:\nIn a business combination, long-lived tangible assets and identifiable intangible assets are revalued to fair market value and are not included in\ngoodwill. Under US GAAP, intangible assets must be 1) identifiable (ie, originate as a legal claim), and 2) separable (ie, can be sold separately\nfrom the acquired company). Under IFRS, intangible assets must be identifiable, controllable, and have measurable economic costs and benefits.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 135, "q": "Under US GAAP, an impairment of property, plant, and equipment (PPE) most likely occurs when the carrying amount is:", "opts": ["more than the sum of the asset's discounted future cash flows.", "less than the sum of the asset's undiscounted future cash flows.", "more than the sum of the asset's undiscounted future cash flows."], "ans": "C", "expl": "Impairment typically arises from an unanticipated decline in an asset's value. An asset is impaired when its carrying amount (ie, its book value)\nis greater than its recoverable amount. Under US GAAP, the recoverable amount is measured as the sum of the asset's undiscounted future\ncash flows, which represents total future economic benefits. Simply stated, an asset is impaired if its expected future benefits are below its current\nbook value.\nWhen impairment occurs, the value of the asset is reduced on the balance sheet and an impairment charge is simultaneously reported on the\nincome statement. According to US GAAP, impairment charges may never be reversed, even if the asset's value increases in the future.\n(Choices A and B) Under US GAAP, impairment occurs when the carrying value is more than the sum of the undiscounted future cash flows.\nThings to remember:\nImpairment typically arises from an unanticipated decline in an asset's value. An asset is impaired when its carrying amount is greater than its\nrecoverable amount. Under US GAAP, recoverable amount is measured as the sum of the asset's undiscounted future cash flows.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 136, "q": "At the beginning of 20X2, a company reporting under US GAAP purchases a patent for USD 20 million with no residual value and a useful life of 10 years. At the end of 20X3, the company determines that the patent's expected cash generation is lower due to changes in the law. It estimates the following: If the company uses straight-line amortization, the 20X3 impairment charge the company records is closest to:", "opts": ["USD 6 million.", "USD 7 million.", "USD 8 million."], "ans": "B", "expl": "Impairment is recognized when an asset's carrying value (ie, historical cost less accumulated amortization) is greater than its undiscounted\nfuture cash flows (ie, recoverable amount). The actual impairment loss is the difference between the asset's carrying value and its fair\nmarket value.\nIn this scenario, determine the carrying value at the end of 20X3. Using the straight-line method, the amortization expense is USD 2 million per\nyear. The carrying value at the end of 20X3 is found by subtracting two years (20X2 and 20X3) of amortization from its historical cost.\nSince the carrying value is greater than the undiscounted cash flow, the company records an impairment loss. The amount of the loss (USD 7\nmillion) is the difference between the carrying value (USD 16 million) and the fair market value (USD 9 million).\n(Choice A) USD 6 million is found by using the undiscounted future cash flow, not the fair market value when calculating the impairment charge.\n(Choice C) USD 8 million is found by subtracting the net fair market value from the asset's carrying value since that is greater than its value in\nuse. Under IFRS, the recoverable amount is the greater of the fair market value net of selling costs or its value in use.\nThings to remember:\nUnder US GAAP, impairment is calculated if the carrying value is greater than its undiscounted cash flows (ie, impairment test). The actual\nimpairment loss is the difference between the asset's carrying value and its fair market value.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 137, "q": "A company reports under US GAAP and provides the following information on its equipment: Metric $ Carrying amount 31,000 Expected future cash flows Undiscounted 28,000 Present value 26,500 Fair value if sold 22,000 Cost to sell 2,500 Due to an impairment charge, the carrying value of the machine is closest to:", "opts": ["19,500", "22,000", "26,500"], "ans": "B", "expl": "Impairment charges are recognized when an asset's carrying amount, measured as historical cost minus accumulated depreciation, is greater\nthan its recoverable value. US GAAP defines the recoverable amount as simply the undiscounted expected future cash flows. In this case,\nthe carrying amount ($31,000) exceeds the recoverable amount ($28,000).\nThe impaired asset is written down to a new carrying value with a new depreciation schedule. Under US GAAP, the asset would be written down\nto fair value (ie, value if sold [$22,000]). This fair value estimate becomes the new carrying amount.\nIn contrast, IFRS defines the recoverable amount and the new carrying value as the greater of the asset's fair value less costs to sell the asset\n($22,000 − $2,500) or the discounted future cash flows ($26,500) that the asset is expected to ge
