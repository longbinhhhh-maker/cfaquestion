nerate (Choices A and C).\nThings to remember:\nOnce an asset is deemed impaired, it is written down to a new carrying value. Under US GAAP, that value is the fair value of the asset if sold.\nUnder IFRS, the new carrying value is the greater of the discounted future cash flows or the net fair value.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 138, "q": "In 20X7, a firm reported earnings before interest and taxes (EBIT) of €32.2 million, interest expense of €3.5 million on its income statement, and interest paid of €3.1 million on its cash flow statement. The footnotes also revealed that if the firm had no capitalized interest in 20X7, depreciation expense would change by €450,000. After factoring in all effects of capitalized interest, the analyst recalculated the interest coverage ratio to be 7.5 times. The amount of capitalized interest reported by the firm in 20X7 is closest to:", "opts": ["€850,000", "€1,133,000", "€1,250,000"], "ans": "C", "expl": "Firms that report capitalized interest usually have an overstated interest coverage ratio. Capitalized interest is included with noncurrent (ie,\nlong-term) assets and not as an expense on the income statement, so interest expense is less for firms that capitalize, resulting in a larger ratio.\nThe firm pays the interest each year, so from an analytical perspective, it is irrelevant whether the firm records the interest as an expense or an\nasset. Analysts routinely adjust the interest coverage ratio to add the capitalized interest to the interest paid.\nAnother adjustment must be made for depreciation. When a noncurrent asset includes capitalized interest, it is expenses as incrementally higher\ndepreciation expense. For example, if a noncurrent asset includes $100 of capitalized interest, and the asset is depreciated straight-line over ten\nyears, then depreciation expense increases by $10 each year (= 100/10). This additional depreciation is added to earnings before interest and\ntaxes (EBIT).\nSo, the total adjustment requires two steps:\nadjust for the capitalized interest (in the denominator) to reflect the firm's \"true\" interest cost.\nadjust for additional depreciation expense (in the numerator).\nThe adjustments to the firm's interest coverage ratio are shown below:\n(Choice A) 850,000 results from incorrectly using interest expense rather than interest paid in the interest coverage ratio.\n(Choice B) 1,133,333 results from an incorrect numerator caused by subtracting the incremental depreciation from EBIT instead of adding it to\nEBIT.\nThings to remember:\nCapitalized interest can cause the interest coverage ratio to be overstated. Adjust the denominator by adding the capitalized interest to interest\npaid. Adjust the ratio's numerator by adding incremental depreciation resulting from the capitalized interest to earnings before interest and taxes.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets\n24.A company acquires an asset that has a cost of ¥90 million, a useful life of 3 years, and zero salvage value. The asset will be abandoned at\nthe end of 3 years. The company does not pay dividends. All else being equal, expensing the cost of this asset, instead of capitalizing it, will most\nlikely result in:\nA. higher return on equity at the end of the first year.\nB. lower cash from investing activities in the first year.\n C. the same retained earnings at the end of the asset's useful life.\nExplanation\nExpensing an asset captures its full cost on the income statement when the asset is purchased. In contrast, capitalizing an asset initially captures\nits full cost as a long-term asset on the balance sheet and subsequently spreads its depreciation expense to the income statement over the asset's\nuseful life.\nDue to this timing difference, expensing results in lower net income initially and higher net income in subsequent years. In contrast, net income\nis more even each year during the asset's useful life when its cost is capitalized. However, the total net income over the asset's life is the same\nunder both methods. Since retained earnings are the accumulation of net income, net of any dividends paid (which in this case is zero), retained\nearnings at the end of the asset's life are identical whether the asset is capitalized or expensed.\nFor example, assume this company begins operations in Year 0 with ¥200 million in cash and purchases the asset in Year 1. Furthermore,\nassume the asset generates annual revenue of ¥100 million, as shown:\nIf expensed, the full ¥90 million cost is captured as net income in Year 1. If capitalized, the ¥90 million appears on the balance sheet under Gross\nPPE in Year 1 and subsequently reduces each year's income by ¥30 million (before tax) in depreciation (assuming the straight-line method is\nused). At the end of 3 years, retained earnings under both scenarios equal ¥168 million.\n(Choice A) Expensing (compared to capitalizing) an asset results in lower ROE (= net income / average shareholders' equity) during the first year\nsince Year 1's net income is proportionally reduced more than average shareholders' equity.\n(Choice B) Expensing an asset results in greater cash flow from investing activities since the full cost, which is a negative cash flow, is reflected\nin cash from operating activities.\nThings to remember:\nExpensing or capitalizing an asset purchase initially affects the company's financial results differently, but the cumulative impact to retained\nearnings under both methods is the same over time.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 139, "q": "A company acquires an asset that has a cost of ¥90 million, a useful life of 3 years, and zero salvage value. The asset will be abandoned at the end of 3 years. The company does not pay dividends. All else being equal, expensing the cost of this asset, instead of capitalizing it, will most likely result in:", "opts": ["higher return on equity at the end of the first year.", "lower cash from investing activities in the first year.", "the same retained earnings at the end of the asset's useful life."], "ans": "C", "expl": "Expensing an asset captures its full cost on the income statement when the asset is purchased. In contrast, capitalizing an asset initially captures\nits full cost as a long-term asset on the balance sheet and subsequently spreads its depreciation expense to the income statement over the asset's\nuseful life.\nDue to this timing difference, expensing results in lower net income initially and higher net income in subsequent years. In contrast, net income\nis more even each year during the asset's useful life when its cost is capitalized. However, the total net income over the asset's life is the same\nunder both methods. Since retained earnings are the accumulation of net income, net of any dividends paid (which in this case is zero), retained\nearnings at the end of the asset's life are identical whether the asset is capitalized or expensed.\nFor example, assume this company begins operations in Year 0 with ¥200 million in cash and purchases the asset in Year 1. Furthermore,\nassume the asset generates annual revenue of ¥100 million, as shown:\nIf expensed, the full ¥90 million cost is captured as net income in Year 1. If capitalized, the ¥90 million appears on the balance sheet under Gross\nPPE in Year 1 and subsequently reduces each year's income by ¥30 million (before tax) in depreciation (assuming the straight-line method is\nused). At the end of 3 years, retained earnings under both scenarios equal ¥168 million.\n(Choice A) Expensing (compared to capitalizing) an asset results in lower ROE (= net income / average shareholders' equity) during the first year\nsince Year 1's net income is proportionally reduced more than average shareholders' equity.\n(Choice B) Expensing an asset results in greater cash flow from investing activities since the full cost, which is a negative cash flow, is reflected\nin cash from operating activities.\nThings to remember:\nExpensing or capitalizing an asset purchase initially affects the company's financial results differently, but the cumulative impact to retained\nearnings under both methods is the same over time.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 140, "q": "At the beginning of this year, a company purchased electronic goods that cost €120,000 and chose to expense the purchase instead of capitalizing it. The electronics have a useful life of 3 years with zero salvage value, and the company uses straight-line depreciation. The company reports €300,000 in revenue each year and is taxed at 25%. There are no other expenses aside from the purchase cost and corporate tax. Based only on this information and compared to capitalizing the asset, expensing the asset most likely results in:", "opts": ["net PPE that is €120,000 lower in the current year.", "net income that is €60,000 lower in the current year.", "cash from operations that is €100,000 higher in the current year."], "ans": "B", "expl": "Expensing or capitalizing an asset purchase impacts the company's financial results differently each year, but the cumulative impact to net income\nand total cash flow under both methods is the same over time. In this scenario, when the company expenses the asset, the full cost of €120,000\nis reported on the income statement this year. Subtracting €120,000 from revenue of €300,000 results in pretax income of €180,000, which yields\n€135,000 of net income after deducting €45,000 of taxes.\nHad the company capitalized the asset, at initial recognition €120,000 would be reported on the balance sheet as a long-term asset. At year-end,\n€40,000 of depreciation (ie, €120,000 purchase price less 0 salvage value over 3 years) is reported as depreciation expense on the income\nstatement and reduces pretax income to €260,000, which yields €195,000 in net income after subtracting €65,000 in taxes. Therefore, expensing\nthe asset would result in net income that is 135,000 − 195,000 = €60,000 lower in the first year.\n(Choice A) €120,000 lower net PPE results from not subtracting depreciation of €40,000. Net PPE at year-end is €80,000.\n(Choice C) Cash from operations (CFO) is actually €100,000 lower when the asset is expensed. This is because expensing the entire purchase\ncost reduces net income in the first year, which also reduces CFO.\nThings to remember:\nExpensing an asset results in lower net income and cash from operations in the first year compared to capitalizing it because the full equipment\ncost is absorbed upon initial recognition.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 141, "q": "A company purchased equipment at the beginning of 20X2. At the end of 20X2, the fair value of the equipment fell to €10,000 below its book value. Using the revaluation model and ignoring tax effects, on the 20X2 financial reports, this most likely results in a €10,000 reduction in: ", "opts": ["net income.", "accumulated depreciation.", "other comprehensive income."], "ans": "A", "expl": "Financial statement treatment of revaluation of noncurrent assets—IFRS only\nUpward revaluation Downward revaluation\nGain recognized in other comprehensive income (OCI) as\nInitial Loss recognized on income statement\nrevaluation surplus\nRecognized on income statement to the extent of previous\nReduces revaluation surplus\nrecognized losses\nSubsequent If revaluation surplus = 0, recognized on income\nGain in excess of previous losses recognized as revaluation\nstatement as loss\nsurplus\nCompanies that report under IFRS are permitted to revalue long-term assets to their current fair value. An upward revaluation occurs when an\nasset's fair value exceeds its carrying amount (ie, net book value). A downward revaluation occurs when an asset's fair value falls below its\ncarrying amount.\nThe accounting treatment for each case is:\nFor an initial upward revaluation, the initial gain from the asset mark-up bypasses the income statement and directly increases other\ncomprehensive income, reported as a component of shareholders' equity on the balance sheet.\nFor an initial downward adjustment, the initial loss from the asset mark-down appears on the income statement and reduces net income,\nwhich then flows to shareholders' equity on the balance sheet.\nThe different treatments of the upward and downward revaluations reflect accounting standards' conservative bias: the company must \"own\" the\ndownward revaluation and report it as directly affecting net income, and thus earnings performance, but cannot similarly \"take credit\" for an\nupward revaluation.\nIn this scenario, the fair value of the asset drops below its balance sheet book value, so a downward revaluation occurs. This directly reduces net\nincome by €10,000.\n(Choice B) Since the downward revaluation occurs at the end of 20X2, the depreciation expense will be adjusted going forward. Therefore, there\nis no change to accumulated depreciation in 20X2.\n(Choice C) Only upward revaluations impact other comprehensive income on the balance sheet.\nThings to remember:\nCompanies reporting under IFRS are allowed to use the revaluation model. For an initial upward revaluation, the initial gain from the asset mark-\nup bypasses the income statement and directly increases other comprehensive income on the balance sheet. For an initial downward adjustment,\nthe initial loss from the asset mark-down appears on the income statement and reduces net income.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 142, "q": "A company sells a noncurrent asset for $3 million. It originally paid $4 million for the asset and reported a loss of $900,000 on the sale. At the time of the sale, the accumulated depreciation for the asset was closest to: ", "opts": ["$100,000", "$1,000,000", "$1,900,000"], "ans": "A", "expl": "A gain or loss from the sale of a noncurrent asset is reported on the income statement. The gain or loss is calculated as the difference between\nthe sales price and the asset's book value at the time of sale. As the figure above demonstrates, book value is the difference between the\nhistorical cost of the asset and the asset's accumulated depreciation.\nInserting the variables for book value into the equation for gain or loss on sale results in the relationship on the right in the figure. All variables to\ncalculate the gain or loss are known except for the accumulated depreciation.\nRearranging the equation on the right results in:\n(Choice B) $1,000,000 is the difference between the sales price and the historical cost. It does not account for any depreciation that would\nreduce the historical cost to the current book value.\n(Choice C) $1,900,000 results from mistaking the $900,000 loss as a gain and adding it to the difference between the historic cost and the sales\nprice.\nThings to remember:\nA gain or loss on the sale of an asset is the sales price minus the book value. Book value is calculated as the historical cost minus accumulated\ndepreciation.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 143, "q": "A company reporting under IFRS elects to use the revaluation model for its equipment. The company purchases equipment for €10 million during 20X3. At the end of 20X3, the fair value of the equipment is €11 million. The company most likely records a €1 million: ", "opts": ["increase in equity.", "gain on the income statement.", "decrease in depreciation expense."], "ans": "A", "expl": "Financial statement treatment of revaluation of noncurrent assets—IFRS only\nUpward revaluation Downward revaluation\nGain recognized in other comprehensive income (OCI) as\nInitial Loss recognized on income statement\nrevaluation surplus\nRecognized on income statement to the extent of previous\nReduces revaluation surplus\nrecognized losses\nSubsequent If revaluation surplus = 0, recognized on income\nGain in excess of previous losses recognized as revaluation\nstatement as loss\nsurplus\nIFRS, but not US GAAP, allow companies to choose between the cost model and the revaluation model for valuing long-lived assets. Using the\nrevaluation model, an asset's carrying value is adjusted based on the asset's fair value. Revaluations adjust an asset's carrying value upward\nor downward. These adjustments may be made during the initial year of ownership and/or subsequently over the equipment's useful life.\nAn initial upward revaluation means that the company reports the asset at a higher value than its original cost. For an initial upward revaluation,\nthe increase in value bypasses the income statement and is reported as part of other comprehensive income; it is not recorded as a gain and\nhas no impact on expenses or net income (Choices B and C). The revaluation bypasses the income statement since the higher valuation is\noutside of management's control and so the company should not report increased profits from it.\nThe company may record an increase in profits only if there is a subsequent increase in fair value following previous reductions in value. Then the\nincrease in fair value—and profit—is limited to previous decreases in value. Any increase in value above previous losses is also recorded in other\ncomprehensive income.\nThings to remember:\nRevaluation of noncurrent assets is permitted under IFRS but not under US GAAP. Initial upward revaluations are recorded in other\ncomprehensive income; they bypass the income statement and do not impact expense or profit.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 144, "q": "A decision to capitalize the purchase of a long-lived asset instead of expensing it will most likely result in a company reporting:", "opts": ["less net income in the first year.", "greater cash flow from investing activities in the first year.", "greater cash flow from operating activities in the first year."], "ans": "C", "expl": "Each method of recording an asset purchase (ie, capitalizing or expensing) initially impacts the company's reported financial results differently, but\nthe cumulative impact under either method is the same over the course of time. A comparison of capitalization versus expensing is shown:\nWhen a buyer capitalizes an expenditure, long-term assets increase by the amount capitalized on the balance sheet; that amount will then be\ndepreciated over the asset's useful life. Since the initial expenditure bypasses the income statement, net income will be greater initially compared\nwith expensing an asset, but will be less in future periods due to depreciation. Furthermore, capitalizing produces greater cash from operating\nactivities since the initial cash expenditure is classified as a cash outflow under investing activities (Choice B).\nWhen a company expenses an asset, the initial expenditure appears as an operating expense on the income statement, which produces a lower\nnet income initially and less cash from operating activities compared with capitalizing the asset (Choice A). However, since no long-term asset is\nrecognized on the balance sheet, there is no periodic depreciation, which leads to higher net income in future periods.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets\n30. Company A purchases a patent from Company B and acquires Company C along with its customer list. The most appropriate way for\nCompany A to account for these purchases would be to:\n\nA. capitalize both the patent and the customer list.\nB. capitalize the patent and expense the customer list.\nC. expense the patent and capitalize the customer list.\nExplanation\nTreatment for intangible assets\nAcquisition method Treatment of costs\nPurchased on a stand-alone basis Fair value of assets capitalized on balance sheet\nResearch costs expensed immediately on income statement\nDeveloped internally through research\nDevelopment costs capitalized on balance sheet if product is developed for internal use (US\nand development\nGAAP) or has demonstrated technical feasibility (IFRS)\nAcquired through a business Fair value of assets capitalized on balance sheet\ncombination (eg, merger) Additional goodwill created on balance sheet\nIntangible assets (eg, patents, customer lists) lack physical form but are still expected to grant the holder future economic benefit. These assets\ncan be obtained through a stand-alone purchase, the acquisition of another company, or internal development.\nCompanies are required to account for these assets in different ways, depending on the means of acquisition. If intangible assets are acquired\nthrough a stand-alone purchase or as part of a larger business combination (eg, acquisition), both IFRS and US GAAP require capitalizing\nthe asset: recognizing its fair value on the company's balance sheet and subsequently amortizing that value over the asset's useful life. Note that\ngoodwill, although considered an intangible asset, is not identifiable and therefore not amortized but rather periodically tested for impairment.\nIn this scenario, one company acquires a customer list as a part of its acquisition of another company and also purchases a stand-alone patent.\nUnder IFRS and US GAAP, both intangible assets should be capitalized (Choices B and C).\nThings to remember:\nA company can obtain intangible assets through stand-alone purchases, the acquisition of other companies, or internal development. Under both\nIFRS and US GAAP, if an intangible asset is acquired through a stand-alone purchase or business combination (eg, acquisition), it is capitalized.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 145, "q": "Company A purchases a patent from Company B and acquires Company C along with its customer list. The most appropriate way for Company A to account for these purchases would be to: ", "opts": ["capitalize both the patent and the customer list.", "capitalize the patent and expense the customer list.", "expense the patent and capitalize the customer list."], "ans": "A", "expl": "Treatment for intangible assets\nAcquisition method Treatment of costs\nPurchased on a stand-alone basis Fair value of assets capitalized on balance sheet\nResearch costs expensed immediately on income statement\nDeveloped internally through research\nDevelopment costs capitalized on balance sheet if product is developed for internal use (US\nand development\nGAAP) or has demonstrated technical feasibility (IFRS)\nAcquired through a business Fair value of assets capitalized on balance sheet\ncombination (eg, merger) Additional goodwill created on balance sheet\nIntangible assets (eg, patents, customer lists) lack physical form but are still expected to grant the holder future economic benefit. These assets\ncan be obtained through a stand-alone purchase, the acquisition of another company, or internal development.\nCompanies are required to account for these assets in different ways, depending on the means of acquisition. If intangible assets are acquired\nthrough a stand-alone purchase or as part of a larger business combination (eg, acquisition), both IFRS and US GAAP require capitalizing\nthe asset: recognizing its fair value on the company's balance sheet and subsequently amortizing that value over the asset's useful life. Note that\ngoodwill, although considered an intangible asset, is not identifiable and therefore not amortized but rather periodically tested for impairment.\nIn this scenario, one company acquires a customer list as a part of its acquisition of another company and also purchases a stand-alone patent.\nUnder IFRS and US GAAP, both intangible assets should be capitalized (Choices B and C).\nThings to remember:\nA company can obtain intangible assets through stand-alone purchases, the acquisition of other companies, or internal development. Under both\nIFRS and US GAAP, if an intangible asset is acquired through a stand-alone purchase or business combination (eg, acquisition), it is capitalized.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 146, "q": "At the beginning of 20X7, a company acquires a trademark for $85 million; the trademark is considered held for use. At the end of 20X7, the company records an impairment charge of $20 million due to a pending lawsuit. In 20X8, the company receives a favorable ruling, and the trademark is fairly valued at $185 million at year end. If the company reports under US GAAP, the reported increase in the trademark's value for 20X8 is closest to: ", "opts": ["$0", "$20 million", "$100 million"], "ans": "A", "expl": "An impairment is an unanticipated decline in an asset's value. An asset is impaired when its carrying amount is greater than its recoverable\namount. Under US GAAP, the recoverable amount is the sum of the asset's undiscounted future cash flows (ie, total future economic benefit).\nAn asset is impaired if its expected future benefit is below its current book value.\nAfter its initial impairment, the asset's value may increase. However, under US GAAP, if the asset is considered held for use (ie, PPE), a\nreversal of the impairment is not allowed (Choices B and C). If the asset is considered held for sale, the company may record an increase in\nthe asset's carrying value limited to the amount of the initial impairment.\nUnder IFRS, there is no distinction between held for use and held for sale; all assets may increase in value after an initial impairment charge.\nHowever, the increase is limited to the original impairment, even if the recoverable amount is greater than the asset's carrying value before the\ninitial impairment.\nThings to remember:\nAfter an asset's initial impairment, the recoverable value may increase. Under US GAAP, if the asset is considered held for use, a reversal of the\nimpairment is not allowed. If an asset is deemed held for sale, the company may record an increase in the asset's carrying value limited to the\namount of the initial impairment.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 147, "q": "With respect to impairment losses, the recoverable amount under IFRS is most likely defined as the greater of the asset's value in use or:", "opts": ["fair value minus selling cost.", "fair value.", "gross book value minus selling cost."], "ans": "A", "expl": "An asset is impaired when its carrying amount (book value) exceeds its recoverable amount. Under IFRS, the recoverable amount is the greater\nof the fair value minus selling costs (ie, net fair value) or the sum of the asset's discounted future cash flows (value in use). An impairment loss\nunder IFRS equals the difference between the carrying amount and the recoverable amount. Here is an example of the impairment loss\ncalculation under IFRS, using the appropriate recoverable amount:\nIn this example, the company reduces the asset by EUR 15,000 on the balance sheet and simultaneously records an impairment loss of EUR\n15,000 on the income statement. According to IFRS (unlike US GAAP), impairment charges can be reversed in the future if the recoverable\namount increases above the carrying value.\nThings to remember:\nAn asset is impaired when the carrying amount (book value) exceeds the recoverable amount. Under IFRS, the recoverable amount is the greater\nof the fair value minus selling costs or the sum of the asset's discounted future cash flows (value in use).\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements\nand ratios", "qhtml": null}, {"n": 148, "q": "Which of the following items is most likely to appear on a company's balance sheet?", "opts": ["Weighted average coupon rate for long-term debt", "Specific details for leases treated as finance leases", "Separate carrying values for short- and long-term debt"], "ans": "C", "expl": "Presentation of liabilities\nShown on balance sheet Shown on footnotes\nDetails on each bond issue (ie, maturity, stated\nTotal carrying value of noncurrent\nrate, effective rate) and finance leases\ndebt\nRequired payments for the next five years\nTotal carrying value of current debt\n(including leases)\n(ie, due within 12 months)\nCollateral pledged\nTotal carrying value of leases\nLines of credit and other contingent financing\npayable for finance leases\nsources\nA company normally presents a single line on its balance sheet for the total carrying value of its long-term debt and includes a similar line under\ncurrent liabilities for its short-term debt. The footnotes to the financial statements contain (for each liability) details such as maturity, coupon rate,\nand effective interest rate (Choice A). The footnotes also provide detailed information on leases that the company treats as finance leases\n(Choice B).\nCFA Institute curriculum does not address whether IFRS or US GAAP specify mandatory disclosures for noncurrent liabilities. Instead, it presents\na general \"best practices\" guide to what analysts can expect to see in a company's financial statements concerning those liabilities.\nThings to remember:\nCompanies normally present minimal information concerning their noncurrent liabilities on their balance sheets; in general, there is one line each\nfor long- and short-term debt. Detailed information regarding a company's liabilities is contained in the footnotes to its financial statements.\nDescribe the financial statement presentation of and disclosures relating to long-term liabilities and share-based compensation", "qhtml": null}, {"n": 149, "q": "Which of the following is most likely a reason for a company to lease, rather than purchase, an asset? The company does not have to:", "opts": ["report a lease liability on the balance sheet.", "report a leased asset on the balance sheet.", "risk disposing of the asset at a below-market residual value."], "ans": "C", "expl": "Leasing an asset gives the lessee the right to use the asset for a fixed time in exchange for periodic payments to the lessor (ie, owner of the\nasset). There are several motivations for a company to lease an asset instead or purchasing it.\nLess costly upfront: Leasing, unlike buying, typically does not require an up-front down payment.\nLooser restrictions: Leasing an asset circumvents the need to finance an expensive purchase with borrowed funds, which typically include\nstrict covenants.\nLess asset disposal risk: The lessee does not have to worry about disposing of the assets at below-market salvage (ie, residual) values.\nAccounting rules require lessees to record the fair value of a lease as an asset and liability at the inception of the lease (Choices A and B).\nThings to remember:\nMotivations for leasing instead of purchasing an asset include less up-front costs, more flexible terms, and reduced exposure to a decline in the\nleased asset's value.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null}, {"n": 150, "q": "Under IFRS, at the inception of a lease, a lessee would most appropriately record a(n):", "opts": ["expense equal to the average periodic lease payment.", "long-term asset equal to the present value of lease payments.", "long-term liability equal to the total amount of future lease payments."], "ans": "B", "expl": "Financial statement impact to the lessee\nGoverning standard Balance sheet Income statement Cash flow statement\nReduction of lease liability: CFF\nIFRS: all leases Asset Depreciation Interest payments:\nUS GAAP: finance lease Liability Interest IFRS: CFF or CFO\nUS GAAP: CFO\nAsset\nUS GAAP: operating lease Single expense item Entire lease payment: CFO\nLiability\nIn a lease contract, the lessee makes periodic payments to the lessor for the right to use an asset for a specified period. Under IFRS, all leases\nare treated like asset purchases financed with borrowed funds (similar to the treatment of finance leases under US GAAP). At inception, the\nlessee records on its balance sheet a long-term asset and liability equal to the present value of the future lease payments (Choice C). The\nlessee depreciates the asset during the term of the lease.\nThe periodic lease payments are apportioned toward interest payments and liability reduction each period. In this respect, a lease is conceptually\nvery similar to amortizing a long-term loan.\n(Choice A) Under US GAAP, the amount of the average periodic lease payment in an operating lease is recorded as an expense each period on\nthe income statement. Operating leases are treated like rental agreements.\nThings to remember:\nUnder IFRS, all leases are treated like asset purchases financed with borrowed funds. At inception, the lessee records a long-term asset and\nliability equal to the present value of the future lease payments. The asset is depreciated periodically throughout the term of the lease, and\nperiodic lease payments are apportioned toward interest payments and liability reduction each period.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null}, {"n": 151, "q": "A company maintains a defined benefit plan for its employees. It recently determined that its employees' life expectancy has increased, which will increase the company's pension liability. The amount of the increased liability can only be estimated. Under US GAAP, the company most appropriately reports the increased liability on its financial statements:", "opts": ["in the footnotes only, since it cannot determine the amount of increase.", "as part of other comprehensive income and amortizes the increase over time.", "as part of other comprehensive income but does not amortize the increase over time."], "ans": "B", "expl": "Treatment of defined benefit (DB) plan items for IFRS and US GAAP\nIFRS US GAAP\nIncrease in service costs\nIncrease in service costs\nPension liability – interest\nIncome statement Pension liability – interest expense\nexpense\nPension surplus – interest income\nExpected return on plan assets\nActuarial gains/losses (not amortized over time) Actuarial gains/losses (amortized\nOther comprehensive\nDifference between actual return on plan assets and return over time)\nincome (OCI)\nincluded in net income Past service costs\nDetermining the amount of a company's future defined benefit (DB) plan obligation involves making estimates based on actuarial assumptions for\ncost variables such as life expectancy during retirement. Changes to these assumptions cause the company to increase or decrease its future\nobligation. These changes translate into gains or losses in the period when the change occurs.\nIFRS and US GAAP both require the company to recognize the gain or loss in other comprehensive income (OCI), but they differ in how the\ncompany treats the OCI item in subsequent years. US GAAP require the company to amortize the gain or loss ratably over time. The effect of\namortization is that reported pension expense is more consistent from year to year. IFRS do not permit this \"smoothing\" technique.\n(Choice A) Estimates of pension liability based on variables such as life expectancy are examples of actuarial assumptions. Both IFRS and US\nGAAP permit use of actuarial assumptions to determine the amount of pension expense that companies can recognize.\n(Choice C) IFRS do not permit amortization of pension items included in OCI. Those items remain in OCI until the company recognizes the gain\nor loss. This typically causes a company reporting under IFRS to show more variability in year-to-year pension expense.\nThings to remember:\nCompanies use actuarial assumptions to calculate pension expense and liabilities. IFRS and US GAAP differ in how they require companies to\ntreat changes in pension liability due to actuarial gains and losses. For items included in OCI, US GAAP require companies to amortize the gains\nand losses ratably to \"smooth\" pension expense each year, while IFRS prohibit such amortization.\nExplain the financial reporting of defined contribution, defined benefit, and stock-based compensation plans", "qhtml": null}, {"n": 152, "q": "The impact on a lessor's financial statements in the first year of a lease that was newly classified as a sales-type lease rather than a direct- financing lease is most likely higher:", "opts": ["leverage.", "return on equity.", "depreciation expense."], "ans": "B", "expl": "A finance lease removes the leased asset from the lessor's balance sheet and treats the lessee as the owner. This means that the lessee, not\nthe lessor, depreciates the asset; therefore, the lessor's depreciation expense decreases rather than increases (Choice C).\nA finance lease also assumes that the lessee \"purchased\" the asset with funds borrowed from the lessor. The purchase \"price\" is the present\nvalue of the lease payments. For the lessor, this creates an asset (eg, lease receivable) that replaces the leased item; therefore, the lessor's total\nassets are unchanged. Leverage is defined as assets divided by owners' equity, and since the numerator does not increase, leverage does not\nincrease (Choice A).\nUS GAAP (but not IFRS) further classify a finance lease as either a direct-finance or a sales-type lease. When the present value of all lease\npayments equals the asset's carrying value at the beginning of the lease, the lease is a direct-finance lease. When the payments' present value\nexceeds the lessor's carrying value at commencement, the lease is a sales-type lease.\nWith a sales-type lease, the lessor recognizes the difference between the present value and carrying value as a gain in the first year of the\nlease. This gain increases the lessor's net income. Return on equity (ROE) equals net income divided by owners' equity, so ROE is higher with a\nsales-type lease than with a direct-finance lease.\nThings to remember:\nUS GAAP classify a finance lease as either a direct-finance or sales-type lease. A sales-type lease requires the lessor to recognize as gain the\ndifference between the present value of the lease payments and the leased asset's carrying value. This gain increases the lessor's net income, as\nwell as ratios in which net income is the numerator.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null}, {"n": 153, "q": "IFRS most likely permit lessees to report the:", "opts": ["entire lease payment as a cash outflow under operating activities.", "reduction of lease liabilities as a cash outflow under investing activities.", "interest portion of the lease payment as cash outflow under financing activities."], "ans": "C", "expl": "Financial statement impact to the lessee\nGoverning standard Balance sheet Income statement Cash flow statement\nReduction of lease liability: CFF\nIFRS: all leases Asset Depreciation Interest payments:\nUS GAAP: finance lease Liability Interest IFRS: CFF or CFO\nUS GAAP: CFO\nAsset\nUS GAAP: operating lease Single expense item Entire lease payment: CFO\nLiability\nIn a lease contract, the lessee makes periodic payments to the lessor for the right to use an asset for a specified amount of time. Under IFRS, all\nleases are treated like asset purchases financed with borrowed funds. At inception, the lessee records a right-of-use asset and a lease liability\nequal to the present value of the future lease payments.\nAfter inception, periodic payments are separated into two categories:\nA portion is applied toward reducing the lease liability principal and is recorded as a cash outflow under financing activities.\nThe rest of the monthly payment counts as interest and is recorded as a cash outflow under financing activities or operating activities.\nNote that the interest portion of the lease payments is classified under financing or operating activities under IFRS but is strictly classified as\noperating activities under US GAAP.\n(Choice A) Under IFRS, the principal portion of the lease payment cannot be classified as an operating activity.\n(Choice B) Under IFRS, the reduction of the lease liability is treated as a cash outflow from financing, not investing.\nThings to remember:\nUnder IFRS, the principal portion of the periodic lease payment is classified as a cash outflow under financing activities. The interest portion of\nperiodic lease payments can be classified as a financing activity or operating activity. In contrast, US GAAP strictly classified the interest portion\nas an operating activity.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null}, {"n": 154, "q": "A company reporting under US GAAP leases a factory building under a long-term operating lease contract. On the income statement, the ongoing expenses pertaining to the lease should most appropriately be reported: ", "opts": ["in equal amounts each period, under a single line item.", "in different amounts each period, under a single line item.", "in different amounts each period, under depreciation expense and interest expense."], "ans": "A", "expl": "Financial statement impact to the lessee\nGoverning standard Balance sheet Income statement Cash flow statement\nReduction of lease liability: CFF\nIFRS: all leases Asset Depreciation Interest payments:\nUS GAAP: finance lease Liability Interest IFRS: CFF or CFO\nUS GAAP: CFO\nAsset\nUS GAAP: operating lease Single expense item Entire lease payment: CFO\nLiability\nIn a lease contract, the lessee makes periodic payments to the lessor for the right to use an asset for a specified amount of time. Under US\nGAAP, long-term leases can be classified as finance or operating.\nOperating leases are treated like a rental agreement. Each period, the lessee records on the income statement a single expense, which is\nequal to the average periodic lease payment. For example, if a 10-year operating lease's total contractual amount is CAD 120 million, then the\nmonthly income statement expense will be CAD 1 million (or CAD 120 million / 120 months), regardless of the actual lease payments each month\n(Choice B).\nFinance leases are treated liked an asset purchase financed with borrowed funds. Each period, the lessee records on the income statement the\ndepreciation expense from the leased asset and the interest expense from the \"debt.\"\n(Choice C) In a finance lease, not an operating lease, the expense can be separated into depreciation expense and interest expense on the\nincome statement. Furthermore, interest expense is different each period.\nThings to remember:\nFinance leases are treated like an asset purchase financed with borrowed funds. Each period, the lessee records depreciation expense from the\nleased asset and interest expense from the \"debt\" on the income statement. Operating leases are treated like a rental agreement. Each period,\nthe lessee records on the income statement a single expense, which is equal to the average periodic lease payment.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null}, {"n": 155, "q": "A manufacturing company maintains a defined benefit plan for its employees who are directly involved in the manufacturing process. The company most appropriately recognizes contributions made for those employees:", "opts": ["immediately as a separate operating expense.", "as a separate operating expense only when the employees retire.", "as cost of goods sold when it sells goods that those employees made."], "ans": "C", "expl": "Defined contribution plans (DC) Defined benefit plans (DB)\nNo future benefit guaranteed Employer promises future benefits\nEmployee bears responsibility for performance Employer bears responsibility for performance\nFinancial impact limited to expensing contributions made to Performance of plan assets can significantly impact\nparticipants' accounts financial reporting\nAccounting is straightforward and simple Accounting is complicated\nNo significant differences between US GAAP and IFRS Significant differences between US GAAP and IFRS\nA defined benefit (DB) plan is a pension plan that guarantees employees income when they retire. The benefit for each employee is formula-\ndriven and can be based on several variables, including years of service and average compensation. To provide this benefit, employers contribute\nan amount each year into one separate investment account that is maintained for the benefit of all employees.\nDB plan contributions are deductible expenses, but IFRS and US GAAP treat pension contributions as a type of wage expense. Wage expenses\nfor employees in a direct production capacity, such as this company's manufacturing employees, are included as a cost of inventory.\nInventory costs are not expensed immediately. Instead, they are included in cost of goods sold (COGS) when the company sells the inventory.\n(Choice A) Contributions to a DB plan are deductible when made. The company does not wait until the employee begins receiving pension\nbenefits to deduct prior contributions.\n(Choice B) For a manufacturing company, pension contributions are included as wage expenses. Wage expenses for manufacturing employees\nare included as part of inventory and expensed as COGS. Wage expenses for nonmanufacturing employees are part of selling, general and\nadministrative expenses. The company's footnotes to its financial statements provide more detail on the different components of wage expenses.\nThings to remember:\nFor a manufacturing company, contributions to a defined benefit plan are usually deductible when made. However, they do not appear as a\nseparate expense; instead, they are a component of wage expenses. Both IFRS and US GAAP provide that wage expenses for manufacturing\nemployees are included in inventory costs and are recognized as cost of goods sold.\nExplain the financial reporting of defined contribution, defined benefit, and stock-based compensation plans", "qhtml": null}, {"n": 156, "q": "Under US GAAP, a lessee reports periodic payments for the second year of a finance lease. Compared to using an operating lease, the lessee will most likely report: ", "opts": ["less cash flow from financing activities.", "less cash flow from operating activities.", "more cash flow from investing activities."], "ans": "A", "expl": "Long-term leases under US GAAP: lessee's perspective\nType Balance sheet Income statement Cash flow statement\nReduction of lease liability:\nAsset Depreciation\nFinance lease ↓ CFF\nLiability Interest\nInterest payments: ↓ CFO\nAsset\nOperating lease Single expense Entire lease payment: ↓ CFO\nLiability\nIn a long-term lease contract, the lessee makes periodic payments to the lessor for the right to use an asset (ie, right of use [ROU]) for a specified\nperiod. Under US GAAP, long-term leases can be classified as finance or operating.\nFinance leases are treated like asset purchases financed with borrowed funds (from the lessor). At inception, the lessee simultaneously records\nan ROU asset and a lease liability, both equal to the present value of the future lease payments. After inception, a portion of each periodic\npayment is applied toward reducing the liability (ie, principal reduction), which reduces cash from financing activities. Therefore, cash flow\nfrom financing (CFF) is less under a finance lease. The rest of the monthly payment counts as interest and reduces cash from operating\nactivities (CFO).\nOperating leases are treated like rental agreements. In each period, the entire periodic payment is treated like rent expense and reduces cash\nfrom operating activities on the cash flow statement. Therefore, CFO under an operating lease is less than CFO under a finance lease (Choice\nB).\n(Choice C) After inception, periodic payments do not affect cash flows from investing activities regardless of lease type.\nThings to remember:\nUnder US GAAP, a finance lease results in more cash from operating activities and less cash from financing activities compared to an operating\nlease. Under a finance lease, the portion of the periodic payment that reduces the lease liability is considered a cash outflow from financing\nactivities; the portion applied toward the interest payment is considered a cash outflow from operating activities.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null}, {"n": 157, "q": "A company issued coupon-paying bonds with a face value of £5 million. It used the proceeds to purchase one of its suppliers. The company uses IFRS for financial reporting. In its statement of cash flows, it can report its coupon payments on the bonds as:", "opts": ["cash from financing (CFF) or cash from investing (CFI).", "cash from investing (CFI) or cash from operations (CFO).", "cash from financing (CFF) or cash from operations (CFO)."], "ans": "C", "expl": "Cash flows consist of both outflows and inflows. From an issuer's (ie, borrower's) perspective, the proceeds from issuing a bond are a cash inflow,\nwhereas interest and principal payments on the bond are outflows. Both GAAP and IFRS classify receipt and payment of bond principal as cash\nfrom financing (CFF). US GAAP classify all interest payments (ie, outflows) as cash from operations (CFO), but IFRS permit companies to\nclassify those payments as either CFO or CFF.\nOwning another company's bonds is an investment. Interest received on those bonds is directly linked to that investment, so IFRS allow interest\nreceived to be classified as cash from investing (CFI). However, this does not apply to interest paid on debt, even if the borrower uses the\nproceeds from the bond for an investment, as in this case. Interest paid is either CFO or CFF, but never CFI, so (Choices A and B) are incorrect.\nThings to remember:\nUS GAAP classify all interest payments as CFO, regardless of how the borrower used the proceeds of the debt on which it paid the interest. IFRS\npermit companies to classify interest payments as either CFO or CFF, but not as CFI.\nDescribe the financial statement presentation of and disclosures relating to long-term liabilities and share-based compensation", "qhtml": null}, {"n": 158, "q": "A company has a defined contribution pension plan and reports under IFRS. Which of the following items relating to the plan's participant accounts are most likely to be disclosed on the company's income statement?", "opts": ["Gains or losses on plan investments", "Company contributions made to participants' accounts", "Interest and dividends earned and paid on plan investments"], "ans": "B", "expl": "Defined contribution plans (DC) Defined benefit plans (DB)\nNo future benefit guaranteed Employer promises future benefits\nEmployee bears responsibility for performance Employer bears responsibility for performance\nFinancial impact limited to expensing contributions made to Performance of plan assets can significantly impact\nparticipants' accounts financial reporting\nAccounting is straightforward and simple Accounting is complicated\nNo significant differences between US GAAP and IFRS Significant differences between US GAAP and IFRS\nA defined contribution (DC) plan is a type of employee retirement plan. Unlike a defined benefit (DB) plan, a DC plan does not guarantee the\nemployee any benefit at retirement. Instead, the employer establishes the plan and selects diverse investments that participants (ie, employees)\ncan invest in, allocating their account balance based on their individual risk and return preferences.\nThe funding in a DC plan can be contributions from the employer, the participant's own contributions (ie, salary deferrals), or a combination of\nthese. In all cases, the participant, not the employer, is responsible for the account's performance. All investment gains or losses, as well as\ndividend or interest income generated by those investments, benefit the participant, not the employer (Choices A and C).\nAn employer receives a tax deduction for any contributions that it makes to participants' accounts. Deductibility applies whether the contributions\nare contractually required (eg, collective bargaining agreements) or voluntary (eg, profit-sharing plans).\nThings to remember:\nA defined contribution plan imposes no responsibility on the employer for investment performance. Employers do not share in participant\naccounts' gains or losses. The only financial impact on employers is the tax deduction for any contributions that it makes to participant accounts.\nExplain the financial reporting of defined contribution, defined benefit, and stock-based compensation plans", "qhtml": null}, {"n": 159, "q": "After entering a finance lease agreement, the lessor most appropriately records periodic:", "opts": ["lease income.", "interest revenue.", "depreciation expense."], "ans": "B", "expl": "Financial statement impact on the lessor\nBalance sheet Income statement Cash flow statement\nRemove leased asset Record interest revenue Lease payments received: CFO\nFinance lease Recognize lease receivable\nRecord gain or loss\nRetains leased asset Record lease income Lease payments received: CFO\nOperating lease\nRecord depreciation\nCFO = cash flow from operating activities, CFI = cash flow from financing activities\nIn a lease contract, the lessor grants the lessee the right to use an asset over a specific period of time in exchange for scheduled regular\npayments. For accounting purposes, most leases are classified as finance leases, although some exceptions (eg, airport terminals) are treated as\noperating leases.\nFrom a lessor's perspective, a finance lease is economically equivalent to financing an asset sale to the lessee (customer). At inception of the\nlease, the lessor removes the leased asset from its balance sheet and simultaneously records a receivable. Subsequently, the lessor reports\ninterest revenue earned from the financing provided to the customer.\nIn contrast, operating leases are treated like rental agreements. The lessor retains the asset at inception and subsequently records rental (ie,\nlease) income and depreciation (Choices A and C).\nThings to remember:\nFrom a lessor's perspective, a finance lease is economically equivalent to financing an asset sale to the lessee. At inception of the lease, the\nlessor removes the leased asset from its balance sheet and simultaneously records a receivable. Subsequently, the lessor reports interest\nrevenue earned from the financing provided to the customer.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null}, {"n": 160, "q": "This fiscal year, a company: received in advance from a customer $60,000 for goods to be delivered next year. This amount is recognized as revenue for tax purposes this year but cannot be recognized as accounting revenue until next year. prepaid a vendor $12,000 for monthly office cleaning services that will begin next year. This amount cannot be recognized as an accounting expense until next year but is deductible for tax purposes this year. Based on only this information, if the company is subject to a 25% tax rate, then this year it most likely will experience a: ", "opts": ["$12,000 increase in deferred tax assets.", "$12,000 increase in deferred tax liabilities.", "$48,000 increase in deferred tax assets."], "ans": "A", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred tax assets (DTA) and liabilities (DTL) arise from temporary differences between income tax expense and taxes payable for a period.\nIncome tax expense is based on pretax income from the income statement and is reported for financial reporting (accounting) purposes. Taxes\npayable is based on taxable income on the tax return and is the actual amount owed to the government.\nIn this scenario, the company has greater taxes payable ($12,000) than income tax expense ($0) for the period. This temporary \"overpayment\"\nleads to a $12,000 increase in DTA, which is expected to reverse in a future period when the respective revenues and expenses are recognized\nfor accounting purposes (Choice B).\n(Choice C) A $48,000 increase in DTA results from incorrectly taking the difference between taxable income and pretax income.\nThings to remember:\nIncome tax expense is based on pretax income from the income statement and is reported for financial reporting (accounting) purposes. Taxes\npayable is based on taxable income on the tax return and is the actual amount owed to the government. Deferred tax assets occur when income\ntax expense is less than taxes payable, whereas deferred tax liabilities occur when income tax expense is greater than taxes payable.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 161, "q": "In 20X8, a security company received payment of £20,000 for services that it will not perform until 20X9. If the statutory tax rate increases from 25% to 30% in 20X9, the effect of this advance payment in 20X9 most likely causes an increase in:", "opts": ["tax expense of £1,000.", "taxes payable of £1,000.", "deferred tax assets of £1,000."], "ans": "C", "expl": "Deferred tax assets (DTA) arise when a company's taxable income temporarily exceeds its pretax income. The imbalance causes the company\nto pay more in taxes than it reports as tax expense on its income statement. This occurs when the company pays tax on cash it receives in the\ncurrent period but for which it will not earn and recognize as revenue until a future period.\nThe carrying value and tax base of an item are similar concepts. Carrying value refers to an item's value that the company reports in its financial\nreporting. The tax base is the value that the company uses for the same item when it calculates its tax obligations.\nThe company pays tax on the advance payment in 20X8, even though it does not recognize the cash as revenue in 20X8 since it has not\nperformed the agreed-upon services. It creates a liability (eg, deferred revenue) of £20,000 to account for the cash, and the liability's 20X8\ncarrying value is £20,000. The cash's 20X8 tax base equals zero since it was taxed when received in 20X8. This difference results in a DTA.\nA DTA is the difference between the item's carrying value and its tax base, multiplied by the tax rate: (20,000 − 0) × 25% = £5,000. When the\ntax rate increases to 30% in 20X9, the DTA also increases: (20,000 − 0) × 30% = £6,000, an increase of £1,000.\n(Choice A) The increase in DTA from £5,000 to £6,000 causes tax expense to decline, not increase, by £1,000.\n(Choice B) The company paid the tax on the customer advance in 20X8, so that has no impact on its tax obligations for 20X9.\nThings to remember:\nA deferred tax asset (DTA) arises when a company pays more taxes now than it will pay in the future due to differences between accounting\nstandards and tax laws. A deferred tax liability (DTL) arises when the company pays less tax now than it will in the future. When tax rates change,\ndeferred tax items are adjusted accordingly. Increases in tax rates cause increases in the value of both DTL and DTA. Decreases in tax rates\nhave the opposite effect.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 162, "q": "An appliance manufacturing company depreciates its noncurrent assets for financial reporting using straight-line depreciation, but the tax code permits the company to use accelerated depreciation for tax purposes. If this company acquired an asset this year that cost €3 million, has a three-year useful life, and has zero salvage value, the most likely impact on the company's financial statements at the end of this year will be that the tax base of the asset is: ", "opts": ["less than the carrying value.", "equal to the carrying value.", "greater than the carrying value."], "ans": "A", "expl": "The tax base of an asset is the total amount that the applicable tax laws allow a company to deduct for tax purposes over the asset's future life.\nThe carrying amount of the same asset is its book value for financial reporting. If a company uses different depreciation methods for financial\nreporting and tax reporting, in most cases the carrying amount and tax base will differ.\nHere, the company uses accelerated depreciation for tax purposes. This results in higher depreciation than straight-line depreciation (€1.5\nmillion vs. €1.0 million in Year 1 is assumed in this question), so the asset's ending value is lower for tax reporting. Note, however, that the\ndifference between the tax base and carrying value is temporary since it is caused by the timing difference in depreciation expense. Any\ndifferences will reverse over the asset's useful life.\n(Choice B) Using different depreciation methods causes a difference between an asset's carrying value and its tax base.\n(Choice C) This is correct only if the company used straight-line depreciation for tax purposes and accelerated depreciation for financial\npurposes.\nThings to remember:\nStraight-line depreciation and accelerated depreciation result in different depreciation expense. If the tax code permits accelerated depreciation\nfor tax purposes, the tax base of the asset is usually less than its financial statement carrying value at the beginning of the asset's useful life. At\nthe conclusion of its useful life, the asset's tax base and carrying value are identical.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 163, "q": "A company has a deferred tax asset (DTA) and a deferred tax liability (DTL). If tax rates fall during the next year, holding all else equal, it is most likely that the company's deferred tax:", "opts": ["asset will increase.", "liability will decrease.", "liability will remain constant."], "ans": "B", "expl": "Deferred tax liabilities (DTLs) arise when a company's pretax income temporarily exceeds its taxable income. For example, when a company\nuses accelerated depreciation for taxes and straight-line depreciation for financial reporting in the early years of the life of the deferred tax asset\n(DTA), taxable income is lower than pretax income due to the higher depreciation expense. The difference between pretax income and taxable\nincome is temporary and reverses as the asset is fully depreciated.\nA DTL represents future taxes. When the statutory tax rate decreases, the DTL decreases since the delayed taxable event will now be taxed at\nthe lower rate and the company will owe less tax in the future (Choice C).\n(Choice A) The DTA will also decrease if tax rates decrease, since it becomes less valuable as an offset for future taxes when those taxes are\nless.\nThings to remember:\nDeferred tax liabilities (DTL) arise when a company's pretax income temporarily exceeds its taxable income. The difference causes the company\nto pay less in taxes than it reports as tax expense on its income statement. When statutory tax rates decrease, both the DTL and the deferred tax\nasset will also decrease.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 164, "q": "A company purchases a service on credit for TRY 10,000 in 20X8. The company recognizes the expense on its income statement that year but will not pay cash until 20X9. Tax laws require that the company recognize the expense when cash is paid. If the company's tax rate is 30%, in 20X8 the company would most appropriately record a:", "opts": ["deferred tax asset of TRY 3,000.", "deferred tax asset of TRY 7,000.", "deferred tax liability of TRY 3,000."], "ans": "A", "expl": "Deferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) arise when a company records a tax expense for financial reporting purposes (ie,\nincome tax expense different from the amount it owes in taxes (ie, taxes payable) for that period, and the difference is expected to reverse. A\ncompany incurs a DTA when its taxes payable are greater than its income tax expense.\nIn this scenario, the company recognizes an expense of TRY 10,000 on its income statement in 20X8. However, the company will not pay cash\nfor the expense nor record it on the tax return until 20X9. In 20X8, the company's:\npretax profit will be 10,000 less than its taxable income, and its\nincome tax expense will be 3,000 (10,000 × 30%) less than its taxes payable.\nSince these differences will reverse in 20X9 when the company pays cash for the expense, a DTA of TRY 3,000 is created in 20X8.\nAssuming the company had revenue of TRY 15,000, the accounting difference would be as follows:\n(Choice B) A DTA of 7,000 is the difference between the portions of the expense that affect net income and taxable income, not the difference\nbetween tax expense and taxes payable.\n(Choice C) A DTL of 3,000 is calculated by incorrectly reversing the tax expense and taxes payable.\nThings to remember:\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) arise when a company records an income tax expense different from its taxes\npayable, and that difference is expected to reverse. A DTA is incurred if the company's taxes payable are greater than its tax expense.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 165, "q": "A French catering firm prepares and supplies in-flight meals and snacks to airlines at various airports in Europe and reports its financial results under IFRS. Its tax rate is 25%. On January 1, 20X8, the firm incurred €800,000 in research costs to improve the efficiency of its operations. It expensed the entire amount on its income statement but recorded it as an asset for tax purposes. It will amortize this amount equally over four years. Which of the following is the most likely impact of the research costs on the firm's 20X8 financial results?", "opts": ["The research costs' carrying value equals €600,000.", "The firm's taxable income is less than its pretax income.", "The firm reports a deferred tax asset (DTA) of €150,000."], "ans": "C", "expl": "An asset's tax base is the amount that a company can deduct for tax purposes during the asset's useful life. Carrying value refers to the asset's\nbalance sheet book value. Differences between tax base and carrying value cause the company's taxable income to differ from its pretax\nincome.\nThese differences mean that the company's taxes payable and tax expense are not the same. When these differences are temporary (ie, they\nwill reverse in the future), the company creates deferred tax assets (DTA) and deferred tax liabilities (DTL).\nIf a company expenses an item completely, then it has zero carrying value (Choice A) since there is no asset to record. The firm treated the entire\n€800,000 research costs as an expense on its income statement. However, the tax code permitted the firm to capitalize the research and\ndevelopment expense, so that expense is an asset for tax purposes. The costs have an initial tax base of €800,000; the 20X8 amortization of\n€200,000 reduces the tax base to €600,000 at the end of 20X8.\nThe carrying value (€0) minus the tax base (€600,000) is less than zero. This means that at the end of 20X8, the firm creates a DTA equal to\n(€600,000 − 0) × 25% = €150,000.\n(Choice B) The firm's expenses for tax purposes (€200,000) are less than the expenses it reports on its income statement (€800,000). This\nmeans that its taxable income is greater (by €600,000) than its reported pretax income.\nThings to remember:\nWhen the tax base and carrying value of an item differ, a deferred tax item is created to reconcile the difference between taxes payable and tax\nexpense. If the underlying item causing the deferred tax item is a balance sheet asset and the item's carrying value is less than the tax base, then\nthe deferred item is a deferred tax asset.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 166, "q": "An increase in the statutory tax rate will most likely:", "opts": ["increase both deferred tax assets and deferred tax liabilities.", "increase deferred tax assets and decrease deferred tax liabilities.", "decrease deferred tax assets and increase deferred tax liabilities."], "ans": "A", "expl": "Deferred tax items (ie, deferred tax assets and liabilities) arise from the difference between income tax expense (for accounting purposes) and\ntaxes payable (for tax reporting) for a period. Differences can occur as tax expense is calculated according to accounting standards and taxes\npayable are calculated according to the tax code.\nDeferred tax assets (DTA) arise when taxable profit is greater than accounting profit and taxes payable are greater than tax expense.\nDeferred tax liabilities (DTL) arise when taxable profit is less than accounting profits and taxes payable are less than tax expense.\nAs illustrated above, at any given tax rate, deferred tax items can be calculated as the absolute difference between taxable profit and accounting\nprofit, multiplied by the tax rate. Therefore, the sizes of DTA and DTL are directly related to the tax rate. As the tax rate increases, the value of\ndeferred tax items also increase (Choices B and C).\nThings to remember:\nDeferred tax items can be calculated by multiplying the absolute difference between taxable profit and accounting profit by the applicable tax rate.\nTherefore, the sizes of deferred tax assets and deferred tax liabilities are directly related to the tax rate. As the tax rate increases, the value of\ndeferred tax items also increases.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 167, "q": "A deferred tax asset most likely results when:", "opts": ["taxable income is less than pretax income.", "income tax expense is less than taxes payable.", "income tax expense is greater than taxes payable."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred tax assets and liabilities result from differences between income tax expense and taxes payable. Income tax expense is based on\npretax income from the income statement and is shown for financial reporting (accounting) purposes. Taxes payable is based on taxable\nincome on the tax return and is the actual amount owed to the government for tax purposes.\nDifferences in revenues (eg, customer advances) and expenses (eg, depreciation) that are recognized for accounting purposes but not tax\npurposes can cause pretax income to differ from taxable income. These differences require companies to create tax assets or liabilities to\nreconcile the differences.\nWhen income tax expense (on the income statement) is less than taxes payable (amount due to government), the company overpays taxes for\nthe current year, thereby producing a deferred tax asset equal to the excess amount. This deferred tax asset provides a future benefit since the\ntemporary overpayment is expected to be recovered in the future.\n(Choice A) When taxable income is less than pretax income, it results in a deferred tax liability. The liability signals that the company expects to\npay higher taxes in the future.\n(Choice C) A deferred tax liability occurs when income tax expense is more than taxes payable. This means that the company underpays taxes\nfor the current year, thereby producing a deferred tax liability.\nThings to remember:\nA deferred tax asset is created when income tax expense on the income statement is less than taxes payable on the tax return. A deferred tax\nasset provides a future benefit since the temporary overpayment is expected to be recovered in the future.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 168, "q": "In 20X5, a company reports different asset amounts for accounting purposes and tax purposes: The company reports investment securities at fair value at €200,000 on the balance sheet. For tax purposes, the investments are valued at the original cost of €190,000. The company capitalizes €1 million in software development costs. For accounting purposes, 20% of the costs are amortized in 20X5. For tax purposes, 25% of the costs are amortized in 20X5. The company reports net accounts receivable (AR) of €480,000 after subtracting €20,000 in allowance for doubtful accounts. For tax purposes, the allowance for doubtful accounts is determined to be 10% of gross AR. The statutory tax rate is 30%. Based on this information, in 20X5 the carrying amount for assets exceeds the tax base by:", "opts": ["€27,000", "€90,000", "€108,000"], "ans": "B", "expl": "An asset's carrying amount reflects the reported book value on the balance sheet (per accounting standards). An asset's tax base reflects the\nvalue that remains as a deductible expense (per the tax code) over the asset's useful life. Differences between accounting standards and tax\ncodes may cause carrying amounts and tax bases to differ, which may lead to deferred tax assets and deferred tax liabilities.\nIn this scenario, calculate each asset's amount and tax base to determine the total difference in 20X5:\nInvestment securities are valued at €200,000 for accounting purposes and €190,000 for tax purposes.\nFor the €1 million of capitalized software development costs, 20% is amortized for accounting purposes, so the carrying amount is €800,000\n[(1 − 0.2) × 1 million]. In comparison, 25% is amortized for tax purposes, so the tax base is €750,000 [(1 − 0.25) × 1 million].\nFor (net) accounts receivable (AR), €480,000 is recorded on the balance sheet based on an accounting estimate of €20,000 for allowance\nfor doubtful accounts. Therefore, the gross AR must be €500,000. For tax purposes, the allowance for doubtful accounts is calculated as\n10% of €500,000 in gross AR, or €50,000. Therefore, the tax base for net AR is €450,000 (500,000 − 50,000).\nIn aggregate, the carrying amount of assets is €90,000 more than the tax base.\n(Choice A) €27,000 is the deferred tax liability, which is the product of €90,000 and the 30% tax rate.\n(Choice C) €108,000 results from misapplying the 10% to the carrying amount of net AR (€480,000), when it should be applied to the gross AR\namount of €500,000.\nThings to remember:\nAn asset's carrying amount reflects its book value on the balance sheet (per accounting standards). An asset's tax base reflects the value that\nremains tax deductible over the asset's useful life. Differences between accounting rules and tax rules often cause carrying amounts and tax\nbases to differ.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate\n10. Which of the following items is most likely to result in the creation of a deferred tax item?\nA. Interest received on city and state government bonds\n\nB. Compensation paid in the future with shares of company stock\nC. Fines paid to a government agency to settle violations of security laws\nExplanation\nDeferred tax assets (DTA) and deferred tax liabilities (DTL) arise from temporary differences between pretax income and taxable income.\nCompensation in stock is a deductible expense, and for financial reporting, the company deducts the market value of the shares in the period that\nit accrues the expense. The company will deduct the value of the shares for tax purposes in the future period when it delivers the shares.\nThe lack of tax deductibility in the current period means that the company pays more taxes than it reports as tax expenses. This is a temporary\ndifference since the company will pay less tax in the period of delivery than it pays in the current period. To account for the difference, the\ncompany creates a DTA. This advises investors and analysts that the discrepancy between what the company pays in tax currently and what it\nreports as tax expense will reverse in a future period.\nWhen the discrepancy is permanent (ie, will never reverse), no deferred tax item is created. The chart below shows items that lead to\npermanent differences:\nMajor areas resulting in permanent differences between pretax and taxable income\nItem Impact Reason\nInterest on state and local Pretax income > taxable\nInterest is tax-free\ngovernment bonds income\nFines and penalties Fines are tax-deductible\nTaxable income > pretax\nCertain entertainment expenses Not all are fully tax-deductible\nincome\nCertain benefits for senior Some benefits, such as company-paid premiums on life insurance,\nmanagement are not tax-deductible\nCompanies include interest on municipal (state and local) bonds as revenue for financial reporting, but municipal bond interest is never taxable to\nthe recipient (Choice A). Similarly, fines imposed by a government agency are deducted as an operating expense for financial reporting, but fines\ncannot be deducted when calculating taxable income (Choice C).\nThings to remember:\nCompensation paid in company stock is tax-deductible in the period of delivery. If that period is later than the period that it accrues the expense, it\ncreates a deferred tax asset to account for the difference between its tax expense and taxes payable. Only temporary differences give rise to\ndeferred tax assets and liabilities.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 169, "q": "Which of the following items is most likely to result in the creation of a deferred tax item
