<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "If a company pays a cash dividend to its shareholders, the effect of this payment on the company's retained earnings is best reflected in the:", "opts": ["income statement.", "statement of changes in equity.", "statement of comprehensive income."], "ans": "B", "expl": "Equity is the owners' investment in a company; the statement of changes in equity details the changes in shareholders' equity from the\ncompany's transactions with its owners. It reports differences that occur between two reporting periods, including information about issuances\nof new equity, dividend payments, and stock repurchases, and shows how these events affect retained earnings, paid-in capital, and other\nitems of shareholders' equity.\n(Choice A) Dividends are not considered expenses since they are distributions of previous periods' profits, not costs of generating current net\nincome; therefore, they are not reported in the income statement.\n(Choice C) The statement of comprehensive income, which includes the income statement, explains changes in equity other than transactions\nwith owners and is a tool to evaluate a company's profitability.\nThings to remember:\nThe statement of changes in equity presents a company's transactions with its owners, including information about issuances of new equity,\ndividend payments, and stock repurchases, and shows how these events affect retained earnings, paid-in capital, and other items of shareholders'\nequity.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 2, "q": "An auditor for a US publicly traded company most likely expresses an opinion on a company's:", "opts": ["strategy execution.", "internal control system.", "pro forma financial statements."], "ans": "B", "expl": "Management's internal control (IC) regulatory requirements\nAssess IC's effectiveness using appropriate measures\nUphold IC's assessment with adequate proof\nWrite testimony stating IC's condition\nHire auditor to give opinion on company's IC\nUS law requires US public companies to have their annual financial statements and internal control systems audited. Management is fully\naccountable for the company's internal controls; to meet regulatory requirements, management must perform an assessment, substantiate the\nassessment, and provide a report. In addition, an independent auditor must provide an opinion on the effectiveness of the company's internal\ncontrol system.\n(Choice A) A company communicates the execution of its strategy in the management discussion and analysis section of its annual report. It is\nnot a part of the annual report that is audited, and auditors do not issue an opinion on it.\n(Choice C) Management may present pro forma financial statements to show core results. They are not audited since they are presented without\nadhering to US GAAP or IFRS. Since management may present results in the best light, some consider pro forma statements as examples of\naggressive accounting.\nThings to remember:\nUS law requires US public companies to be fully accountable for their internal control systems. One part of satisfying this requirement is to have\nan independent auditor express an opinion on the effectiveness of the internal control system.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 3, "q": "Which of the following best describes the objective of financial statement audits?", "opts": ["Prevent management from engaging in fraud", "Guarantee that statements are true and presented fairly", "Evaluate the probability that statements are free of material errors"], "ans": "C", "expl": "Objective of audits\nReasonable assurance that statements are:\nPresented fairly\nFree from material misstatements, including:\nErrors\nFraud\nIllegal acts\nPrepared in accordance with US GAAP/IFRS\nThe objective of audits is to determine the likelihood that management's financial statements are free of material errors and prepared in\naccordance with local accounting standards (eg, IFRS). Auditors examine samples of a company's transactions and review its financial reporting\nprocess.\nBased on that evidence, auditors form a subjective opinion, deciding whether there is a reasonable assurance that the company recorded its\ntransactions and presented its financial statements fairly. Auditors express their opinions in a written auditor's report. Although investors prefer\nunqualified opinions, analysts must retain a degree of skepticism since auditor's reports are opinions, not facts.\n(Choice A) Preventing fraud is not the objective of audits since not every transaction is audited; however, auditors should obtain a reasonable\nassurance that financial statements are presented fairly.\n(Choice B) Auditors form an opinion as to whether financial statements are true and fairly presented. They cannot guarantee that a company's\nfinancial statements are true and fair.\nThings to remember:\nThe objective of audits is to obtain a reasonable assurance that a company's financial statements are free of material errors and prepared in\naccordance with local accounting standards (ie, presented fairly). Analysts must retain a degree of skepticism since auditor's reports are opinions,\nnot facts.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 4, "q": "Which of the following best describes an activity involved in the process data step of the financial statement analysis framework?", "opts": ["Prepare a five-year forecast", "Collect five years of financial statements", "Explain insights from adjusted financial statements"], "ans": "A", "expl": "Financial statement analysis framework\nPhase Action Result\nArticulate purpose of analysis Written objective of analyses\nArticulate purpose\nDetermine the audience Nature of reporting\nObtain financial data Organized financial statements\nCollect data\nVisit company Insight to goals and operations\nAdjusted financial statements\nAdjust numbers\nProcess data Common-sized statements\nCalculate data\nFinancial ratios and forecasts\nAnalyze/interpret data Understand the processed data Analyst's report\nDevelop recommendation Plot course of action Recommendation report\nFollow-up Repeat analysis as data changes Reissue analyses and reports\nThe financial statement analysis framework is a series of six phases describing how financial statement analysis is accomplished. During the\ndata processing phase, analysts adjust the raw financial data obtained during the data collection phase. This may include making changes to\nreported financial statements to improve the comparability among companies due to accounting differences. It also may include preparing\nfinancial ratios or developing a forecast.\n(Choice B) Organizing multiple years of a company's financial statements is part of the data collection phase. During this phase, analysts collect\nand organize data (eg, reported financial statements) including management information, industry data, and economic statistics.\n(Choice C) Explaining insights from data that has been processed is part of the data interpretation phase. Interpreting data most often includes\nusing multiple pieces of adjusted data and formulating an opinion.\nThings to remember:\nThe financial statement analysis framework is a series of six phases describing the process of financial analysis. During the data processing\nphase, analysts may adjust the raw financial data to make financial statements, ratios, and forecasts more comparable.\nDescribe the steps in the financial statement analysis framework", "qhtml": null}, {"n": 5, "q": "An independent auditor determines that a company's financial statements are fairly presented except that the company's records regarding accounts payable are materially incomplete. The auditor will most appropriately give an opinion that is:", "opts": ["adverse.", "qualified.", "unqualified."], "ans": "B", "expl": "Regulatory agencies usually require that publicly traded companies have their annual financial reports audited by an independent accounting firm.\nAuditors use sampling techniques with an overall goal to:\nprovide reasonable assurance that the financial statements are free from material errors or misstatements and\ndetermine whether the financial statements have been prepared in accordance with the applicable accounting standards (eg, US GAAP,\nIFRS).\nThe auditor then gives an opinion based on what is sampled. A qualified opinion is used when financial statements are largely presented fairly\nbut:\nthe audit is limited in scope (eg, incomplete records) or\nthere is an exception from the applicable accounting standards.\nA qualified audit opinion suggests that a company's financial statements are less reliable than statements with an unqualified, or \"clean,\" opinion.\nIn this situation, the auditor appends the opinion with additional details explaining the exception so users of the financial statements can decide\nwhether the exception is important.\n(Choice A) An adverse opinion is given when an auditor determines that a company's financial statements differ materially from applicable\naccounting standards in a way that would affect investors' decision-making.\n(Choice C) An unqualified opinion is given when an auditor deems that the financial reports are fairly presented in all respects and in accordance\nwith applicable accounting standards.\nThings to remember:\nAn audit concludes with the auditor's assignment of an unqualified, qualified, or adverse opinion to financial reports, which depends on the reports'\nscope, quality, and adherence to accounting standards. A qualified audit opinion implies that the audit was limited in scope (eg, incomplete\nrecords) or there was an exception from the applicable accounting standards. Companies prefer to receive an unqualified audit opinion.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 6, "q": "The role of a balance sheet is best described as a way to convey information about a company's:", "opts": ["cash inflows and outflows.", "performance and profitability.", "resources and claims on resources."], "ans": "C", "expl": "The role of a company's financial statements is to provide decision-makers (eg, investors, lenders) with economic information about a company. A\ncompany's balance sheet is a snapshot of the company's assets and liabilities on a specific date (eg, year-end). One-way analysts evaluate a\ncompany's financial position is by assessing the company's resources (ie, assets) and the claims on those resources (ie, liabilities and equities).\n(Choice A) Cash flow statements, not balance sheets, show cash collections (ie, inflows) and cash payments (ie, outflows) during a period. Cash\nflow statements show a company's ability to generate cash; investors prefer companies with consistent cash generation since this can fund future\ngrowth opportunities.\n(Choice B) Both a company's income statement and its cash flow statement, not its balance sheet, convey a measure of a company's\nperformance. The income statement shows how profitable the company is over a period; a cash flow statement presents the company's change in\ncash during a period.\nThings to remember:\nThe role of a company's balance sheet is to show its assets, liabilities, and equity at a point in time. Income statements reveal profitability. Cash\nflow statements offer insight into a company's ability to generate cash.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 7, "q": "An analyst is responsible for monitoring developments in financial reporting standards. Which of the following is least likely to help the analyst?", "opts": ["Examining standard setters' exposure drafts.", "Monitoring changes in standards from a preparer's perspective.", "Checking companies' disclosures regarding their new accounting policies."], "ans": "B", "expl": "As financial reporting standards evolve, analysts must monitor ongoing developments since new and changing standards can impact financial\nanalyses. Since they are not accountants, analysts should monitor standards from a user's, not a preparer's, perspective. They can accomplish\nthis by staying aware of new products and transactions, reviewing the actions of standard setters, and identifying new critical accounting\npolicies from company disclosures.\nIt is important to stay current on new financial businesses, such as fintech companies, by reviewing business journals. Reading exposure drafts\nfrom the International Accounting Standards Board, Financial Accounting Standards Board, and CFA Institute websites increases awareness of\nupcoming changes in financial reporting. However, analysts should expect a lag between a new accounting transaction and its eventual reporting\nstandard. Reviewing a company's annual report provides information about new accounting policies (Choices A and C).\nThings to remember:\nAnalysts should monitor evolving financial reporting standards from a user's perspective. They can accomplish this by staying aware of new\nproducts and transactions, reviewing the actions of standard setters, and identifying new critical accounting policies from company disclosures.\nDescribe implications for financial analysis of alternative financial reporting systems and the importance of monitoring developments in financial\nreporting standards", "qhtml": null}, {"n": 8, "q": "Based on the financial statement analysis framework, which of the following is least likely a source of information when collecting input data?", "opts": ["Industry and economic data", "Financial statement forecasts", "Discussions with management"], "ans": "B", "expl": "Financial statement analysis framework\nPhase Action Result\nArticulate purpose of analysis Written objective of analysis\nArticulate purpose\nDetermine the audience Nature of reporting\nObtain financial data Organized financial statements\nCollect data\nVisit company Insight into goals and operations\nAdjusted financial statements\nAdjust numbers\nProcess data Common-sized statements\nCalculate data\nFinancial ratios and forecasts\nAnalyze/interpret data Understand the processed data Analyst's report\nDevelop recommendation Plot course of action Recommendation report\nFollow-up Repeat analysis as data changes Reissue analyses and reports\nThe financial statement analysis framework is a series of six phases that describe how financial statement analysis is accomplished when\nevaluating investments in a company's securities. In each phase, the analyst acts on information and turns it into a result that can be used to\ncomplete the next phase. In the data collection phase, an analyst collects all pertinent data after articulating the purpose(s) of the analysis. Data\ncollected can be quantitative and qualitative items pertaining to:\nMacroeconomic data (eg, GDP, inflation)\nThe prospects of the industry in which the company operates (Choice A)\nThe prospects of the company within the industry (eg, historical financial data, discussions with management) (Choice C)\nThe result of this phase is a collection of data that can be processed in the data processing phase. The results of processing the data include:\nFinancial statement forecasts\nRatios and common-sized financial statements\nCharts and graphs\nThis data can then be used to analyze the company as an investment.\nThings to remember:\nThe financial statement analysis framework describes how financial statement analysis is accomplished when evaluating investments in a\ncompany's securities. The data collection phase results in a collection of data that can be processed in the data processing phase. The results of\nprocessing the data include financial statement forecasts, which can be used to analyze the company as an investment.\nDescribe the steps in the financial statement analysis framework", "qhtml": null}, {"n": 9, "q": "Which of the following is most likely an external source of information that analysts use?", "opts": ["Peer analysis", "Proxy statement", "Earnings conference call"], "ans": "A", "expl": "Analysts use both external and internal information when researching companies; it is critical for insightful financial statement analysis. External\ninformation refers to information not published by the company. Internal information refers to information produced by the company. Examples\nof external data include information from central banks, industry associations (eg, peer analysis), and the press.\n(Choice B) A proxy statement is prepared by the company when it seeks shareholder votes (eg, for board member selection). It includes voting\ninstructions, executive pay structure, and auditor compensation.\n(Choice C) Earnings conference calls are discussions between management and the investing public. Management explains results and\nsometimes provides guidance on forward-looking issues. Most often, a company holds its earnings calls immediately after announcing its\nearnings.\nThings to remember:\nExternal information refers to information not published by the company. Internal information refers to information produced by the company.\nAnalysts use both external and internal information.\nDescribe information sources that analysts use in financial statement analysis besides annual and interim financial reports", "qhtml": null}, {"n": 10, "q": "An analyst examines the last five years of a company's financial statements. Which of the following would be best to use to analyze the company's ability to fund growth opportunities?", "opts": ["Income statement", "Cash flow statement", "Statement of changes in equity"], "ans": "B", "expl": "Cash flow statements show how a company collects cash (ie, cash inflows) and spends cash (ie, cash outflows). Cash flows are classified as\noperating, investing, or financing activities based on their source or use. Cash from operations (CFO) shows how the company generated cash\nfrom its core business.\nCFO is typically a cheaper and more sustainable source of cash than investing or financing activities; a company that reliably generates CFO is in\na better position to fund growth opportunities than one that does not. Analysts can examine multiple years of CFO to determine whether the\ncompany consistently generates cash from its core business; this gives investors confidence that the company can continue to fund growth\nopportunities.\n(Choice A) An income statement exhibits a company's profitability (ie, revenue minus expenses). In this case, it is not the best statement to use\nsince accrual accounting aligns revenues with expenses during a period, regardless of whether cash was exchanged. Although profitability is\nimportant, it does not reflect cash generation.\n(Choice C) A statement of changes in equity presents the increases (eg, issuances of capital) and decreases (eg, dividend payments) to the\nvalue of owners' investment in the firm. Analyzing a statement of changes in equity does not explain how the company could fund new projects.\nThings to remember:\nThe role of cash flow statements is to present information regarding cash inflows (cash collected) and outflows (cash used) during a period.\nConsistent cash generation from its core business gives investors confidence that the company can continue funding growth opportunities.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 11, "q": "The purpose of management's commentary in the annual report is most likely to:", "opts": ["illustrate the compensation structure of senior executives and directors.", "explain the company's goals and risks associated with not reaching them.", "provide reasonable assurance that the financial statements are fairly presented."], "ans": "B", "expl": "Management's commentary, also known as management's discussion and analysis (MD&A), is a section of a company's annual report. It\nexplains current results and highlights significant events. Suggested elements of the MD&A include the company's goals, financial results, and\nstock performance. Most regulatory agencies require publicly traded companies to publish the MD&A.\nThe MD&A is a summary of how the company did in the past year and provides information on its achievements and setbacks. Topics\nmanagement may cover in the MD&A include how the general economy impacted results, sales performance, and profitability. The MD&A may\nalso provide investors with updates on its competition and specific obstacles the company is facing.\n(Choice A) The proxy statement, not management's commentary, illustrates the compensation structure of senior executives and directors.\n(Choice C) The auditor's report, not the MD&A, states that the auditors, not management, provide reasonable assurance that the financial\nstatements are fairly presented.\nThings to remember:\nManagement's commentary, also known as management's discussion and analysis (MD&A), is a section of a company's annual report. It explains\ncurrent results and highlights significant events. Elements of the MD&A include descriptions of the company's operations, current goals, financial\nresults, and stock performance.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 12, "q": "The notes to a company's financial statements most likely contain:", "opts": ["details on the company's strategic objectives.", "accounting estimates used in the statements' preparation.", "an evaluation of the appropriateness of the statements' presentation."], "ans": "B", "expl": "The notes (ie, footnotes) are an essential part of a complete set of annual financial statements. They offer explanatory calculations (ie,\nestimates) and detailed accounting information that analysts read to improve their comprehension of the financial statements. Since it is\nconsidered a part of the financial statements, footnote information is audited.\nAnalysts use the footnotes to understand reporting differences (eg, FIFO versus LIFO) since US GAAP and IFRS allow companies flexibility in\npreparing financial statements. Using the footnotes, analysts can adjust the financials to make them comparable to other companies' statements.\n(Choice A) The details on a company's strategic objectives and risks are written in the management's discussion and analysis, a supplemental\ndisclosure that is not considered part of the footnotes.\n(Choice C) An evaluation of the appropriateness of the statements' presentation describes the auditor's report. The auditor's report supplements\na company's annual report; it is not contained in the footnotes. The auditor's report is an independent opinion regarding whether the company\nfairly presented its financials and abided by local accounting standards.\nThings to remember:\nThe notes (ie, footnotes), an essential part of a complete set of annual financial statements, describe the calculations, accounting policies, and\nestimates used to prepare the statements. The footnotes are an excellent source of information for adjusting company reports for accounting\ndifferences.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 13, "q": "Which of the following least likely describes the role of financial statement analysis?", "opts": ["Supply information about a company's financial position to market participants", "Evaluate the intrinsic value of a stock based on data from a company and the market", "Develop guidance about a company's future operations based on its past performance"], "ans": "A", "expl": "The role of financial reporting, not financial statement analysis, is to disseminate data about a company's business and financial situation to the\nmarketplace. Companies summarize data to show how they have performed and explain the results. Accounting standards (eg, IFRS and US\nGAAP) set the rules for how companies record the data and produce summaries.\nFinancial statement analysis uses these financial reports to appraise a company's past, present, and future execution of its goals and economic\nfitness. The role of financial statement analysis is to make investment decisions (eg, buy or sell) using these reports. Types of decisions\nanalysts make include merger and acquisition evaluations, conclusions of creditworthiness, forecasts of future earnings, and security selections\n(Choices B and C).\nThings to remember:\nThe role of financial statement analysis is to make investment decisions using companies' financial reports. Types of decisions analysts make\ninclude merger and acquisition evaluations, conclusions of creditworthiness, and stock selections. The role of financial reporting, not financial\nstatement analysis, is to disseminate data about a company's business and financial situation to the marketplace.\nDescribe the roles of financial statement analysis", "qhtml": null}, {"n": 14, "q": "Income statement elements most likely reflect:", "opts": ["values at a point in time.", "performance over a certain period.", "inflows and outflows of cash transactions."], "ans": "B", "expl": "An income statement shows the results of a firm's business activity over a specific period (eg, fiscal year, quarter). It displays how much\nexpense the firm took to produce the revenue generated during the period.\n(Choice A) Balance sheet elements (ie, assets, liabilities, equity), not income statement elements, are reported as a snapshot in time.\n(Choice C) Inflows and outflows of cash transactions are reported in the statement of cash flows, not the income statement.\nThings to remember:\nThe income statement shows the results of a firm's business activity and displays how much expense the firm took to produce the revenue\ngenerated over a specific period.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 15, "q": "If a company receives a qualified audit opinion, its financial statements are most likely:", "opts": ["prepared with incomplete records.", "accurate and presented fairly in all material respects.", "unreliable due to intentional accounting misstatements by management."], "ans": "A", "expl": "Regulatory agencies require that publicly traded companies have their financial statements audited by an independent accounting firm. The\nauditor samples transactions to determine whether there is reasonable assurance that the financial statements are free from material\nmisstatements and presented fairly. Subsequently, the auditor issues an opinion on whether the financial statements were prepared in accordance\nwith the applicable accounting standards (eg, US GAAP, IFRS).\nA qualified audit opinion implies that the audit was limited in scope (eg, incomplete records) or there was an exception from the applicable\naccounting standards. Companies strongly prefer not to have a qualified opinion since it reflects poorly on management. Qualified audit\nopinions suggest that the company's financial statements are less reliable than statements with an unqualified opinion.\n(Choice B) If the company's financial statements are accurate and presented fairly in all material respects, the most likely audit opinion is\nunqualified, not qualified.\n(Choice C) If the company's financial statements are unreliable due to management's intentional accounting misstatements, the most likely audit\nopinion is adverse, not qualified.\nThings to remember:\nA qualified audit opinion implies that the audit was limited in scope (eg, incomplete records) or there was an exception from the applicable\naccounting standards. Companies prefer to receive an unqualified audit opinion.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 16, "q": "A company reports net income of CNY 250 million and weighted average shares outstanding of 100 million for its fiscal year. The company also has convertible bonds outstanding with a par value of CNY 120 million. The bonds pay a 10% coupon and are convertible into a total of 10 million shares of common stock. If the company's tax rate is 25%, then its diluted earnings per share (in CNY) are closest to:", "opts": ["2.27", "2.30", "2.35"], "ans": "C", "expl": "Companies report diluted earnings per share (EPS) to show the potential effect of dilutive securities on share value. Diluted EPS indicate what a\ncompany's EPS would have been had all the company's potentially dilutive securities been converted into common stock.\nThe if-converted method assumes that conversion occurred at the beginning of the year. When potentially dilutive securities are converted to\ncalculate diluted EPS, the company's number of common shares outstanding is increased, and the costs related to those now-converted\nsecurities (eg, preferred dividends, bond interest) are added back to net income available to common shareholders.\nIn this scenario, if the company had converted its convertible bonds to common shares at the beginning of the period , its EPS would have been\nCNY 2.35. Since the company would not have paid after-tax interest expense of CNY 9 million, this is added back to net income in the numerator.\nIt also would have issued 10 million new common shares, which increases the weighted average shares outstanding in the denominator.\nFigures in millions of CNY (except EPS) Basic EPS Diluted EPS\nNet Income 250 250\n+After-tax interest expense (convertible bonds) - 9\nNumerator 250 259\nWeighted common shares outstanding 100 100\n+ New shares from debt conversion - 10\nDenominator 100 110\nEPS 250 / 100 = 2.50 259 / 110 = 2.35\nNote: After-tax interest expense = 120 convertible debt × 10% interest rate × (1 − 25% tax rate) = 9.\n(Choice A) A calculated EPS of 2.27 would result from adding the 10 million convertible bond shares to the company's total shares outstanding\nbut failing to add the interest paid on the convertible bonds to net income.\n(Choice B) A calculated EPS of 2.30 would result from adding the tax paid on the convertible bond interest (ie, CNY 3 million) to net income\ninstead of the after-tax amount.\nThings to remember:\nUsing the if-converted method, diluted earnings per share (EPS) are calculated assuming that the conversion of potentially dilutive securities\noccurred at the beginning of the year. For companies with convertible debt, diluted EPS are calculated by adding back after-tax interest cost to net\nincome and adding new common shares from conversion to weighted average shares outstanding.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 17, "q": "An air services company entered into a contract with a city to build a new runway at an airport. The contract price is €100 million, and the company estimated its total project costs to be €80 million. The contract calls for construction to take place over four years, and the company does not anticipate any material changes to its costs nor any uncertainty about receiving payment. Each year's costs are listed in the following table: Year 1 2 3 4 Total Costs (€ millions) 35 15 13 17 80 The company reports under IFRS standards. The amount of revenue that this company will recognize cumulatively at the end of Year 2 is closest to:", "opts": ["€0", "€50.0 million", "€62.5 million"], "ans": "C", "expl": "A tenet of accrual accounting is that revenue is recognized when it is earned. Revenue is earned when the seller has delivered goods or\nfurnished services. When a contract calls for delivery of goods or services over multiple periods (eg, airport construction), two special\naccounting methods exist to determine when and how much revenue must be recognized.\nThe two methods are the percentage-of-completion method and the completed contract method. The method to be used depends on whether the\ncontract's outcome is reasonably certain. \"Reasonable certainty\" focuses on the probability that the seller will be paid and the probability that the\nseller's estimated costs to complete the project will not change materially before completion. Both IFRS and GAAP require the percentage-of-\ncompletion method if these conditions are satisfied.\nThe company anticipates that it will receive the contract price and it expects that its project costs will not change, so it will use the percentage-of-\ncompletion method. The table below shows how the company will calculate its revenue:\nThings to remember:\nIf there is no uncertainty about the outcome of the contract, use the percentage-of-completion method for both GAAP and IFRS reporters.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for\nfinancial analysis", "qhtml": null}, {"n": 18, "q": "An analyst gathers information about a company's outstanding common shares (in millions) for fiscal year 20X7. The company reported annual net income of CHF 500 million, paid CHF 40 million in preferred dividends, and paid CHF 30 million in common dividends. For 20X7, the company's basic earnings per share is closest to: ", "opts": ["0.21", "0.23", "0.24"], "ans": "A", "expl": "Basic earnings per share (EPS) measures the net income available to common shareholders on a per-share basis. The numerator reflects\nthe remaining net income available to common shareholders after preferred dividends are paid. The denominator is the weighted average\nnumber of shares outstanding to account for intra-year fluctuations arising from new issues and repurchases.\nTo calculate basic EPS:\n1. Calculate net income available to common shareholders:\n2. Determine weighted average shares outstanding:\n3. Divide results from above:\n(Choice B) 0.23 results from subtracting common dividends from net income. Common shareholders are entitled to common dividends;\ntherefore, the dividends should not be taken out of the numerator.\n(Choice C) 0.24 results from using the ending share balance on Dec 31 as the denominator. The denominator should be a time-weighted\naverage figure.\nThings to remember:\nBasic earnings per share (EPS) measures the net income available to common shareholders on a per-share basis. The numerator reflects the\nremaining net income available to common shareholders after preferred dividends are paid; the denominator is the time-weighted average of\nshares outstanding over the period.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities LOS\n4.A company reported earnings per share (EPS) of £1.35 on net income of £2,200,000 for the most recent year. It had issued new common\nshares during the year, and its weighted average number of shares for the year was 1 million. At the end of the year, there were 1.5 million\ncommon shares outstanding. The company has no dilutive securities in its capital structure. The amount of preferred dividends paid last year, if\nany, is closest to:\nA. £0\nB. £180,000\n\nC. £850,000\nExplanation\nBasic earnings per share (EPS) is a measure of a corporation's net income that is attributed to the common shareholders as owners of the\ncorporation. Scaling net income on a per-share basis provides a better means to compare net income across time periods.\nPreferred shareholders are not owners of the company and have no rights against the company's net income, except for the preferred stock's\ndividend. Dividends paid on preferred stock are a claim against net income and must be paid, just as interest must be paid on debt; therefore,\npreferred dividends are subtracted from net income to accurately reflect only the net income that is available to common shareholders.\nThe question provides the EPS; the unknown variable is the value of preferred dividends.\nRearrange the equation to solve for preferred dividends:\nInsert the known values and solve:\n(Choice A) From the rearranged equation for basic EPS, it is apparent that if preferred dividends equal zero, then net income would equal the\nproduct of EPS and weighted average number of common shares, but £2.20 million does not equal £1.35 million. In this example, preferred\ndividends cannot be equal to zero.\n(Choice B) £180,000 results from calculating basic EPS using the year-end number of shares rather than the weighted average throughout the\nyear. Net income is deemed to be earned constantly throughout the year rather than at one fixed point in time, so accounting for changes in\nshares outstanding throughout the year provides a better picture of EPS.\nThings to remember:\nSubtract any preferred dividends from net income before calculating basic earnings per share (EPS). In the formula for basic EPS, the\ndenominator is the weighted average number of common shares, not the number of shares at the end of the year.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 19, "q": "A company reported earnings per share (EPS) of £1.35 on net income of £2,200,000 for the most recent year. It had issued new common shares during the year, and its weighted average number of shares for the year was 1 million. At the end of the year, there were 1.5 million common shares outstanding. The company has no dilutive securities in its capital structure. The amount of preferred dividends paid last year, if any, is closest to:", "opts": ["£0", "£180,000", "£850,000"], "ans": "C", "expl": "Basic earnings per share (EPS) is a measure of a corporation's net income that is attributed to the common shareholders as owners of the\ncorporation. Scaling net income on a per-share basis provides a better means to compare net income across time periods.\nPreferred shareholders are not owners of the company and have no rights against the company's net income, except for the preferred stock's\ndividend. Dividends paid on preferred stock are a claim against net income and must be paid, just as interest must be paid on debt; therefore,\npreferred dividends are subtracted from net income to accurately reflect only the net income that is available to common shareholders.\nThe question provides the EPS; the unknown variable is the value of preferred dividends.\nRearrange the equation to solve for preferred dividends:\nInsert the known values and solve:\n(Choice A) From the rearranged equation for basic EPS, it is apparent that if preferred dividends equal zero, then net income would equal the\nproduct of EPS and weighted average number of common shares, but £2.20 million does not equal £1.35 million. In this example, preferred\ndividends cannot be equal to zero.\n(Choice B) £180,000 results from calculating basic EPS using the year-end number of shares rather than the weighted average throughout the\nyear. Net income is deemed to be earned constantly throughout the year rather than at one fixed point in time, so accounting for changes in\nshares outstanding throughout the year provides a better picture of EPS.\nThings to remember:\nSubtract any preferred dividends from net income before calculating basic earnings per share (EPS). In the formula for basic EPS, the\ndenominator is the weighted average number of common shares, not the number of shares at the end of the year.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 20, "q": "A construction company is hired to construct a building for a total contracted value of €10 million. The estimated cost of the building is €8 million. At the end of Year 1, the company has spent €3 million. At this time, the contract is modified to include an extension. The total contracted price is changed to €12 million and the new expected cost is €9 million. The amount of catch-up revenue that the company should immediately recognize (in € millions) is closest to: ", "opts": ["0.25", "0.67", "1.00"], "ans": "A", "expl": "Decisions regarding how and when to recognize and report revenue from long-term contracts on a company's income statement are based on\neach specific contract. Typically, revenue is reported over the life of a contract based on the percentage of costs incurred compared to the total\nestimated costs.\nUnder converged accounting standards, when a contract is changed, it is considered a new contract for purposes of revenue recognition if the\nchange relates to goods and services distinct from the goods and services already transferred. Otherwise, the change is considered a\nmodification. In this scenario, since the change involves an extension to the ongoing building construction, it is a modification.\nSince revenue earned under the modified contract is greater than under the original contract, the company must record catch-up revenue\nimmediately so that its cumulative revenue recognized equals the amount of revenue under the modified contract. The catch-up revenue (in\n€ millions) is calculated as follows:\nThe amount of catch-up revenue is €0.25 million, which is the difference in revenue that would be recognized between the two contracts (€4\nmillion − €3.75 million).\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement", "qhtml": null}, {"n": 21, "q": "On January 1, a company has 50 million ordinary shares outstanding. During the year, the company pays INR 20 million in preferred dividends. On October 1, the company issues 30 million new ordinary shares. If the company reports INR 100 million of net income, then the company's basic earnings per share for the year is closest to:", "opts": ["INR 1.00", "INR 1.39", "INR 1.74"], "ans": "B", "expl": "A company's basic earnings per share (EPS) equals the income that is available to ordinary (common) shareholders divided by the weighted\naverage ordinary shares outstanding during the year. Net income must be reduced by preferred dividends since ordinary shareholders get paid\nafter preferred shareholders. Here, INR 80 million is available to ordinary shareholders since INR 100 million is reduced by the INR 20 million\npreferred dividend payment.\nTo calculate the weighted average number of shares outstanding, determine if the company changed the number of shares outstanding during\nthe year. Here, the company added 30 million shares on October 1. The company has 50 million shares outstanding from January 1 to\nSeptember 30. From October 1 to December 31, the company has 80 million shares outstanding. Weight each period's total number of\noutstanding shares by the fraction of the year for which they were outstanding.\nThe company's basic EPS of INR 1.39 is found by dividing INR 80 million by 57.5 million shares (INR 80 million / 57.5 million shares = INR 1.39\nper share).\n(Choice A) INR 1.00 results from dividing income available to ordinary shareholders by the number of ending shares outstanding, not by the\nweighted average number of ordinary shares outstanding.\n(Choice C) INR 1.74 results from using net income, not net income available to ordinary shareholders, in the calculation.\nThings to remember:\nA company's basic earnings per share (EPS) is found by dividing the income available to ordinary shareholders by its weighted average shares\noutstanding. To find the earnings available to ordinary shareholders, reduce net income by preferred dividend payments. Determine the weighted\naverage number of shares outstanding using the fraction of the year for which shares were outstanding.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 22, "q": "An analyst collects the following year-end data on a company: The company's operating profit margin is closest to:", "opts": ["9.0%", "11.5%", "16.0%"], "ans": "B", "expl": "Operating profit margin is a profitability ratio that explains how effectively a company manages its operational and production costs.\nOperating profit is revenue minus the sum of COGS and operating expenses. Operating expenses include expenses required to conduct normal\nbusiness operations. Here, operating expenses include administrative expenses and depreciation.\nOther examples of operating expenses include employee compensation, marketing, and research and development costs. Operating expenses\nexclude interest and tax expense since these are not considered part of normal operations. A higher operating profit margin suggests that a\ncompany is more effective in controlling operating and production costs.\nHere, find the operating profit margin by dividing operating income by revenue. Calculate operating income by subtracting COGS, administrative\nexpenses, and depreciation from revenue.\n(Choice A) 9.0% is a result of including interest expense as an operating expense. This understates the operating profit margin. Interest and tax\nexpense are not deducted from revenue when operating income is calculated.\n(Choice C) 16.0% is a result of excluding depreciation from operating expenses. This overstates the operating profit margin. Depreciation is\ndeducted from revenue when operating income is calculated.\nThings to remember:\nOperating profit margin is a profitability ratio that measures a company's ability to manage its operating costs. It is found by dividing its operating\nincome by revenue. Operating expenses include administration, depreciation, employee compensation, marketing, and research and\ndevelopment costs. Interest and tax expense are not deducted from revenue when operating income is calculated.\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement", "qhtml": null}, {"n": 23, "q": "An analyst reviews a company's fiscal year-end common-size income statement: There are no other operating costs. If the annual research and development expense is ¥150 billion, then the company's operating profit is closest to:", "opts": ["¥1,829 billion", "¥1,899 billion", "¥1,979 billion"], "ans": "A", "expl": "Common-size income statements present each income statement account as a percentage of revenue. To find the operating profit, first find\nthe revenue using the amount of research and development (R&D) costs. Rearrange the common-size income statement formula to find each\nyear's revenue.\nOperating profit margin is determined from the common-size income statement by subtracting all operating expenses from the revenue. On a\ncommon-size income statement, revenue is expressed as 100% since all items are expressed in terms of revenue.\nHere, operating expenses are COGS, marketing, R&D, and depreciation. Operating profit is equal to the product of the operating profit margin\nand revenue: 0.4816 × 3,797 = ¥1,829 billion.\n(Choice B) ¥1,899 billion is the result of excluding depreciation expense from operating profit margin. This overstates operating profit.\nDeprecation, while a non-cash expense, is included in operating profit margin.\n(Choice C) ¥1,979 billion is the result of excluding R&D from the operating growth margin; this answer overstates operating profit.\nThings to remember:\nCommon-size income statements present income statement accounts as a percentage of revenue (eg, cost of goods sold / revenue), and\noperating profit is shown as operating profit margin.\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement", "qhtml": null}, {"n": 24, "q": "A company has the following capital structure, which has been in effect for the entire year: Common shares outstanding, January 1 3,000,000 Convertible debt, 6% coupon, presently convertible $5,000,000 into 1,000,000 common shares (at par value) Preferred stock, 8% dividend, $50 par value $5,000,000 Net income $5,000,000 Corporate tax rate 30% The diluted earnings per share (EPS) that the company will report for the year is closest to: ", "opts": ["$1.20", "$1.23", "$1.53"], "ans": "A", "expl": "Convertible securities may reduce earnings per share (EPS), if converted, by increasing the number of common shares in the denominator. Such\nsecurities are dilutive; both GAAP and IFRS require companies to report basic EPS (ie, EPS without impact from conversion) and diluted EPS.\nThe deemed conversion increases the weighted average of the number of common shares outstanding. For calculating diluted EPS, treat\nconvertible securities as having been converted at the beginning of the period.\nWhen the convertible security is debt, the numerator for the equation must be adjusted to add back the interest expense since converting the\ndebt means that the interest will no longer be paid. This increases the net income that is available to common shareholders. Companies receive\na tax deduction for interest paid, which effectively reduces their actual interest expense, so the interest that is added back to net income is\ncalculated on an after-tax basis to reflect the true cost.\nThe calculations for the company's basic and diluted EPS are shown below:\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 25, "q": "An analyst gathers the following information about a company's most recent fiscal year: Net income: $50 million Weighted average common shares outstanding: 100 million Preferred shares outstanding: 2 million (each share paid an annual dividend of $1 and is convertible into 5 common shares) The company's diluted earnings per share (in $) is closest to:", "opts": ["0.45", "0.48", "0.49"], "ans": "A", "expl": "Companies with complex capital structures (ie, potentially dilutive securities) may report a diluted earnings per share (EPS) that is different\nfrom its basic EPS. Dilutive securities (eg, convertible preferred stock, convertible debt, employee stock options) are convertible into shares of\ncommon stock. Companies issue additional common shares upon conversion, creating more outstanding shares and thus diluting EPS. Using\nthe if-converted method, diluted EPS is calculated assuming that conversion occurred at the beginning of the period.\nAssuming the company in this scenario converted its preferred shares to common shares at the beginning of the period, it would not have paid\npreferred dividends of $2 million. Therefore, the diluted EPS numerator includes only net income. Furthermore, the company would have issued\n10 million additional common shares, increasing the denominator and reducing the EPS to $0.45.\n(Choice B) 0.48 is the basic EPS.\n(Choice C) 0.49 results from not applying the 5-to-1 conversion ratio to each preferred share.\nThings to remember:\nDilutive securities are convertible into shares of common stock. Companies issue additional common shares upon conversion, thus diluting\nearnings per share (EPS). Using the if-converted method, diluted EPS is calculated assuming that conversion occurred at the beginning of the\nperiod. When calculating diluted EPS for preferred stock conversion, exclude preferred dividends from the numerator and include the new\ncommon shares in the denominator.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 26, "q": "When analyzing income statements using common-size analysis, an analyst should most appropriately show:", "opts": ["tax expense as a percentage of pre-tax income.", "bad-debt expense as a percentage of net income.", "interest expense as a percentage of operating income."], "ans": "A", "expl": "Common-size income statements allow easy comparison of a company's performance over multiple periods (ie, time series analysis), or of the\nrelative performance of two or more companies (ie, cross-sectional analysis), by showing income statement entries as a percentage rather than as\nan absolute number. In general, this standardization involves converting all lines to a percentage of revenue.\nOne exception to this general rule applies to income tax expense. Analysts often refer to a company's effective tax rate, which is calculated by\ndividing income tax expense for the period by pretax income. The effective tax rate shows how the company is managing its tax exposure, and\nsince it will often be different from the statutory tax rate, the effective rate is a more important metric.\n(Choice B) For common-size statements, bad debt expense follows the general rule that all items are converted and shown as a percentage of\nrevenue.\n(Choice C) For common-size statements, interest expense follows the general rule that all items are converted and shown as a percentage of\nrevenue.\nThings to remember:\nIn creating a common-size income statement, all items except for income tax expense are presented as a percentage of revenue. Income tax\nexpense is presented as a percentage of pre-tax income.\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement", "qhtml": null}, {"n": 27, "q": "An analyst gathers the following data on a company at year end: If the number of stock options outstanding remained constant throughout the year and the average stock price was 25, then the company's diluted EPS (in €) is closest to:", "opts": ["0.71", "0.78", "0.80"], "ans": "B", "expl": "The method used to calculate diluted EPS for a company with outstanding options assumes that\nthe options will be converted into common shares (ie, exercised) if the average stock price is greater than the exercise price, and\nthe company will use all cash proceeds from the exercised options to repurchase shares at the average market price to mitigate dilution.\nAs such, the net share increase equals new common shares issued net of repurchases.\nSince the average stock price (25) is greater than the exercise price (20), all 2 million options are assumed to be converted into common shares.\nThe company would have used all options proceeds (2 million × 20, or 40 million) to repurchase 1.6 million shares (40 million/25), thus increasing\nnet new shares by 0.4 million.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 28, "q": "A company receives CHF 500 today from a customer for a product that it will deliver two weeks from now. The company should most appropriately recognize CHF 500 of:", "opts": ["revenue today.", "unearned revenue today.", "cash two weeks from today."], "ans": "B", "expl": "Under accrual accounting, revenue is recognized when it is earned, independent of when the seller receives cash. The seller earns revenue upon\ndelivery of goods or services to the buyer, effectively transferring ownership. The timing of delivery relative to the timing of the buyer's payment\nmay vary by transaction.\nWhen the seller receives cash in advance of delivery, as is this case, the seller should initially record cash and unearned revenue (a liability\naccount) equal to the sales amount of 500 (Choice C). Upon subsequent delivery two weeks later, the seller should record revenue and reduce\nunearned revenue since the seller has fulfilled the delivery obligation, thus earning the revenue (Choice A).\nWhen a seller delivers on credit (ie, before receiving payment), the seller should initially record revenue and accounts receivable equal to the sales\namount at the time of delivery. Subsequently, when cash is received, the seller should record the cash receipt and reduce accounts receivable by\nthe amount of cash received.\nThings to remember:\nRevenue is recognized when it is earned, independent of when the seller receives cash. If the seller receives cash in advance of delivery, cash\nand unearned revenue are initially recorded. If the seller receives cash after delivery, then revenue and accounts receivable should be initially\nrecorded.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for\nfinancial analysis", "qhtml": null}, {"n": 29, "q": "An analyst gathers the following information about a company for its fiscal year: The weighted average number of common shares outstanding is 20 million, with 750,000 options outstanding at the beginning of the year. There are no other dilutive securities. If the options' exercise price is CAD 15 per share and the average market price of the stock is CAD 20 per share, then the company's diluted earnings per share is closest to:", "opts": ["CAD 2.77", "CAD 2.89", "CAD 2.97"], "ans": "C", "expl": "The treasury stock method is used to calculate diluted earnings per share (EPS) when a company has issued options. If the average stock\nprice is greater than the exercise price, the method assumes that all the company's options are exercised. This increases the weighted average\nnumber of common shares outstanding.\nThe treasury stock method also assumes that the proceeds from exercise are used to buy back the maximum number of shares possible to\nminimize the increase in the number of shares considered outstanding and diminish EPS dilution.\nHere, the number of options equals the number of common shares that would be outstanding as a result of option exercise Multiply that number\nof common shares by the exercise price to determine the proceeds from exercise. Divide the proceeds from exercise by the average stock price\nto determine the number of shares considered repurchased.\nUsing the adjusted weighted average shares outstanding, diluted EPS is CAD 2.97.\n15.A company has agreed to build a multistory residential building for a contract sales price of $10 million, with delivery in four years. To complete\nthe project, the company has contracted with a real estate developer, who estimates the total costs will be $5 million, although changes in\nconstruction methods may result in higher total costs. The company prepares its financial statements under US GAAP. If the company spends $1\nmillion in costs on this project in Year 1, its reported revenue for Year 1 is closest to:\n\nA. $0\nB. $1 million\nC. $2 million\nExplanation\nAccrual accounting requires that revenue be recognized when it is earned. Revenue is earned when the seller delivers goods or furnishes\nservices. When a contract is completed over multiple periods (eg, airport construction), either the percentage-of-completion or the completed\ncontract accounting method determines when and how much revenue is recognized.\nThe reasonable certainty of the contract's outcome determines which method is used. Reasonable certainty identifies the probability that the\nseller will be paid and the probability that the seller's estimated costs to complete the project will not change materially during construction. If one\nor both criteria are not satisfied, US GAAP standards require the use of the completed contract method.\nIn this scenario, the company believes its costs may change during construction, so it must use the completed contract method. Under this\nmethod, the company recognizes zero revenues, costs, profits, and losses until completion.\n(Choice B) $1 million is the revenue recognized if the company reports under IFRS. Since the contract's outcome is uncertain, IFRS standards\nrequire the use of the modified percentage-of-completion method.\n(Choice C) $2 million results from using the percentage-of-completion method under US GAAP. Since the contract's outcome is uncertain, the\ncompany cannot use the percentage-of-completion method.\nThings to remember:\nUnder US GAAP accounting standards, use the completed contract method if the contract's outcome is uncertain, and recognize neither revenues\nnor costs until the period of completion.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for\nfinancial analysis", "qhtml": null}, {"n": 30, "q": "A company has agreed to build a multistory residential building for a contract sales price of $10 million, with delivery in four years. To complete the project, the company has contracted with a real estate developer, who estimates the total costs will be $5 million, although changes in construction methods may result in higher total costs. The company prepares its financial statements under US GAAP. If the company spends $1 million in costs on this project in Year 1, its reported revenue for Year 1 is closest to: ", "opts": ["$0", "$1 million", "$2 million"], "ans": "A", "expl": "Accrual accounting requires that revenue be recognized when it is earned. Revenue is earned when the seller delivers goods or furnishes\nservices. When a contract is completed over multiple periods (eg, airport construction), either the percentage-of-completion or the completed\ncontract accounting method determines when and how much revenue is recognized.\nThe reasonable certainty of the contract's outcome determines which method is used. Reasonable certainty identifies the probability that the\nseller will be paid and the probability that the seller's estimated costs to complete the project will not change materially during construction. If one\nor both criteria are not satisfied, US GAAP standards require the use of the completed contract method.\nIn this scenario, the company believes its costs may change during construction, so it must use the completed contract method. Under this\nmethod, the company recognizes zero revenues, costs, profits, and losses until completion.\n(Choice B) $1 million is the revenue recognized if the company reports under IFRS. Since the contract's outcome is uncertain, IFRS standards\nrequire the use of the modified percentage-of-completion method.\n(Choice C) $2 million results from using the percentage-of-completion method under US GAAP. Since the contract's outcome is uncertain, the\ncompany cannot use the percentage-of-completion method.\nThings to remember:\nUnder US GAAP accounting standards, use the completed contract method if the contract's outcome is uncertain, and recognize neither revenues\nnor costs until the period of completion.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for\nfinancial analysis", "qhtml": null}, {"n": 31, "q": "A company has 500,000 preferred shares that pay a dividend of $4 per share and 1 million common shares that pay a dividend of $1 per share. All shares are outstanding over the current year . If net income is $10 million, then the company's basic earnings per share for the current year is closest to:", "opts": ["$7", "$8", "$9"], "ans": "B", "expl": "A company's basic earnings per share (EPS) equals the income that is available to common shareholders divided by the weighted average\ncommon shares outstanding during the year. Dividends on all classes of stock are paid from net income. For basic EPS, net income must be\nreduced by the amount of dividends paid on preferred shares to accurately reflect the portion of earnings available to the common shareholders.\nIn this example, the company's preferred dividends totaled $2 million (500,000 shares × $4/share).\n(Choice A) Basic EPS of $7 would be the result of incorrectly subtracting both the preferred and common dividends from net income. Only\npreferred dividends are subtracted from net income to determine basic EPS since common dividends are available to common shareholders.\n(Choice C) Basic EPS of $9 would be the result of subtracting only common, not preferred, dividends from net income.\nThings to remember:\nA company's basic earnings per share (EPS) equals the earnings available to common shareholders divided by the weighted average number of\ncommon shares outstanding during the year. Net income must be adjusted by subtracting dividends paid to preferred shareholders. Basic EPS\nignores any potentially dilutive securities.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilut
