ive securities", "qhtml": null}, {"n": 32, "q": "A manufacturer operates two production plants: Plant 1 and Plant 2. After ten years, management restructures the company by closing Plant 2 and shifting its entire operations to Plant 1. All expenses, as well as any gains or losses, from the closure of Plant 2 are most appropriately be reported under:", "opts": ["extraordinary items.", "discontinued operations.", "unusual or infrequent items."], "ans": "C", "expl": "Most income statement information focuses on results from normal operations, since earnings and growth forecasts arise from how companies\nperform their usual activities. A company may also have gains or losses from transactions falling outside its normal operations, such as unusual\nor infrequent items or the discontinuation of a component of its business. Both GAAP and IFRS require special reporting treatment for such\nitems.\nUS GAAP and IFRS consider closing one of several production facilities (ie, restructuring) to be an unusual or infrequent item, reported as a part\nof operating income. The company reports the unusual or infrequent item separately from other operating revenues and expenses on the income\nstatement.\nThe company is not discontinuing its operations entirely, but instead is closing one facility (Plant 2) and shifting all operations to the other facility\n(Plant 1) (Choice B). Therefore any costs and gains (or losses) are considered restructuring costs captured under unusual or infrequent items,\nrather than activities relating to discontinued operations.\n(Choice A) After 2015, neither US GAAP nor IFRS recognize extraordinary items. Before then, an extraordinary item was defined as both\nunusual and infrequent and was treated the same as discontinued operations.\nThings to remember:\nBoth IFRS and GAAP require gains and losses from discontinued operations and unusual or infrequent items to be reported separately.\nDiscontinued operations involve the discontinuation of an entire line of business; closing only part of a business, or one of several manufacturing\nlocations, is an unusual or infrequent item. Gains and losses from unusual or infrequent items are shown before tax and are included as operating\nearnings.\nDescribe the financial reporting treatment and analysis of non-recurring items (including discontinued operations, unusual or infrequent items) and\nchanges in accounting policies", "qhtml": null}, {"n": 33, "q": "A company has 10 million shares of common stock outstanding and has not issued or repurchased common stock this year. It issued 300,000 employee stock options several years ago, which are presently exercisable at $40 per share. The average market price per share for the company's stock this year is $30. It also paid dividends of $1 million on its nonconvertible preferred stock. If the company has a net income of $11 million this year, the company's reported EPS will be closest to: ", "opts": ["$1.00", "$1.01", "$1.10"], "ans": "A", "expl": "Employee stock options, if exercised, will increase the number of shares outstanding. This causes earnings per share (EPS) to decrease since\nnet income is divided by a larger number of shares. Employee stock options are dilutive securities. The general rule is that all dilutive securities\nare converted to common stock or, in the case of options, exercised at the beginning of the period.\nFor employee stock options, this presumption of exercise is valid only if the stock's average market price exceeds the option's exercise price.\nExercising an option must make economic sense, which is not the case by paying $40 for a share worth $30. The options will not be exercised in\nthis case, so the weighted average number of shares will not change. Basic EPS is calculated as follows:\n(Choice B) Under these assumptions, the options would not be exercised since it would be economically unsound to do so. If they were, the\ntreasury stock method would result in the company having 100,000 fewer shares outstanding, or 9.9 million weighted average number of shares\nfor the period. Dividing $10 million ($11 million net income − $1 million preferred dividend) by 9.9 million shares results in an EPS of $1.01.\n(Choice C) Preferred dividends are paid from net income, so they are not available to the common shareholders. The EPS of $1.10 results from\nneglecting to first subtract the preferred dividends from net income before dividing by the weighted average number of common shares.\nThings to remember:\nEmployee stock options may not always be dilutive. If the exercise of the option is not economically warranted, do not presume exercise.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 34, "q": "At the end of its fiscal year, a company has net income of $8,750,000 and 1,000,000 weighted average common shares outstanding. It also has 200,000 shares of convertible preferred shares. Each preferred share pays a dividend of $15 per share and is convertible into two shares of the company's common stock. There are no other potentially dilutive securities. The company would most appropriately report diluted earnings per share of:", "opts": ["$4.11", "$5.75", "$6.25"], "ans": "B", "expl": "Diluted EPS is calculated using the if-converted method if a company issues convertible preferred shares. This method assumes the\nconvertible preferred shares are converted into common shares at the beginning of the period.\nHere, preferred dividends are $3,000,000 (200,000 shares × $15 per share dividend). Earnings available to common shareholders are lower in\nthe basic EPS ($5.75 million) than the if-converted method ($8.75 million). The additional number of shares considered outstanding using the if-\nconverted method is 400,000 (2 common shares per preferred share × 200,000 preferred shares).\nCalculated diluted EPS using the if-converted method is greater than basic EPS ($6.25 vs. $5.75). This means the convertible security is\nantidilutive. Under IFRS and GAAP, antidilutive securities are excluded from the diluted EPS calculation since it must reflect the maximum\npotential dilution from potentially dilutive securities. When a company has antidilutive securities, reported diluted EPS is equal to basic EPS\n($5.75).\nThings to remember:\nThe if-converted method is used to calculate diluted earnings per share (EPS) if a company issues convertible preferred shares. It assumes the\npreferred shares are converted, its dividends are not paid, and new common shares are created. If diluted EPS is greater than basic EPS, the\nsecurities are considered antidilutive and reported diluted EPS equals basic EPS.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 35, "q": "Under IFRS, a company reporting bad debt expense should most appropriately:", "opts": ["write off the receivable when the customer fails to pay and recognize the write-off as a bad debt expense.", "multiply the company's credit sales by its historical percentage of uncollectible receivables, and report that result as an operating expense.", "multiply the company's average accounts receivable by the historical percentage of delinquent receivables, and deduct that amount from revenues to calculate gross profit."], "ans": "B", "expl": "In general, an expense should be recognized in the same period in which the revenue associated with the expense was earned (ie, matching\nprinciple). Sales on credit are reported as revenue in the period they were made. If the company has a history of being unable to collect all its\ncredit sales, then both IFRS and US GAAP require it to report a bad debt expense as an operating expense for that period.\nNeither IFRS nor US GAAP mandate a specific methodology that a company must employ to estimate its bad debt expense. Several methods are\nacceptable, such as a percentage of uncollectible accounts that is based on overall sales, overall credit sales, or delinquent credit sales. The\nonly requirements are that:\nthe company use the method consistently; and\nthe method fairly reflects a reasonable assessment of the company's bad debt history.\n(Choice A) This is known as the direct write-off method. It violates the matching principle and neither IFRS nor US GAAP permit it to be used.\n(Choice C) An operating expense is deducted from gross profit to calculate earnings before interest and taxes. Deducting it from revenues to\ncalculate gross profit will distort gross profit margins.\nThings to remember:\nBad debt expenses are a deduction against gross profit and are used to calculate operating earnings. Neither IFRS nor US GAAP permit bad debt\nexpenses to be an offset against revenues.\nDescribe general principles of expense recognition, specific expense recognition applications, implications of expense recognition choices for\nfinancial analysis and contrast costs that are capitalized versus those that are expensed in the period in which they are incurred", "qhtml": null}, {"n": 36, "q": "XYZ Corporation has 10 million shares of common stock outstanding and has not issued or repurchased common stock this year. Several years ago, it issued $10 million in bonds with 1,000,000 warrants attached. Each warrant allows the holder to purchase one share of XYZ common stock for $30. The average market price per share for XYZ stock this year is $40. It also paid dividends of $1 million on its nonconvertible preferred stock. If XYZ has a net income of $16 million this year, the diluted earnings per share that XYZ will report is closest to:", "opts": ["$1.36", "$1.46", "$1.56"], "ans": "B", "expl": "A warrant is essentially an option allowing the holder of the warrant the right to purchase shares of common stock at a predetermined price.\nExercising a warrant causes the number of common shares outstanding to increase. This increase usually causes the company's earnings-per-\nshare (EPS) to decrease, so warrants are dilutive securities.\nWhen calculating EPS, warrants are treated as having been exercised at the earlier of the beginning of the accounting period, if the warrants\nwere then outstanding, or the date of issuance. Both IFRS and GAAP require companies to use the treasury stock method for calculating the\neffect of warrants on EPS. An example of XYZ's use of the treasury stock method is shown below.\nA key assumption underlying the treasury stock method is that the average market price of the stock is more than the exercise price, so the\nproceeds will purchase fewer shares than were issued from the warrants' exercise. The resulting weighted average is then used to calculate\ndiluted EPS. An example of XYZ's use of the treasury stock method is shown below.\n(Choice A) $1.36 is obtained when the denominator is increased by the total number of shares issued from the warrants' exercise (1,000,000)\ninstead of the net shares added (250,000).\n(Choice C) $1.56 results from neglecting to subtract the preferred dividend from net income in the numerator.\nThings to remember:\nWhen warrants (or employee stock options) are part of a company's capital structure, they are treated as dilutive securities. IFRS and GAAP both\nrequire the company to use the treasury stock method for calculating diluted earnings per share.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 37, "q": "In 20X9 a publicly traded corporation reported $10 million in net income. The information concerning its common shares outstanding is shown below: Change in Shares Date (20X9) Action Shares Outstanding 1/1 Beginning balance 3,000 3/1 Shares issued 9,000 12,000 6/1 Shares repurchased (3,000) 9,000 11/1 Shares issued 6,000 15,000 12/31 Ending balance 15,000 All shares in thousands The company also has 500,000 shares of nonconvertible preferred stock, which have been outstanding the entire year. The annual dividend for each share of preferred stock is $5.00, which has been paid. The basic earnings per share (EPS) for this company in 20X9 is closest to:", "opts": ["$0.50", "$0.77", "$1.03"], "ans": "B", "expl": "Basic earnings per share (EPS) divides a company's net income by the number of shares of common stock outstanding. Scaling net income on a\nper-share basis provides a better means to compare net income across time periods. Basic EPS assumes that the company has not issued other\nsecurities, such as convertible debt, that can be converted into common stock.\nDividends on all classes of stock are paid from net income but since EPS applies only to common shares, net income must be adjusted by\nsubtracting dividends paid to preferred shareholders. Adjusting for preferred dividends accurately reflects the portion of income that is available to\ncommon shareholders. In this question, the company's preferred dividends totaled $2.5 million (500,000 shares × $5 / share), so the EPS\nnumerator becomes $10 million − $2.5 million = $7.5 million.\nA company that issues or repurchases common shares throughout the year will show different amounts of common shares outstanding at different\ntimes. Companies use a time-weighted average to show the relative time period for which different amounts have been outstanding. The table\nbelow demonstrates how the company calculates its weighted average:\nThings to remember:\nTo calculate earnings per share, adjust net income by subtracting any preferred dividends paid, then divide net income by the number of\noutstanding shares. Calculate the weighted average of shares outstanding by multiplying the number of outstanding shares by the portion of the\nyear covering that amount. Repeat for varying amounts of shares, then total the shares for all portions.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 38, "q": "A manufacturer will voluntarily increase the useful lives of several different types of equipment it uses in its manufacturing process. The change will be effective for the current year. To account for this change in its financial statements, the company is most likely required to:", "opts": ["restate net income reported in all prior financial statements.", "explain the change in the footnotes but not restate prior earnings.", "restate net income for prior periods if it determines that the change is material."], "ans": "B", "expl": "Treatment of accounting changes\n(identical under US GAAP and IFRS)\nChanges in accounting policies Changes in accounting estimates\nImposed on companies by accounting bodies Apply mostly to changes in useful lives\nRequire retroactive earnings restatement Voluntary by companies\nApplicable to all firms No retroactive restatement\nAn accounting change is a type of nonrecurring or nonoperating item that may require special treatment on a company's income statement.\nChanges in accounting policies occur when IFRS or US GAAP make changes to their standards. Policy changes affect all companies that must\nadhere to the standards and require that they retroactively apply the changes by restating prior earnings from prior periods.\nBy contrast, changes in accounting estimates are voluntarily undertaken by individual companies. These mostly apply to changes in the\nestimated useful lives of long-term assets and result from a company's determination that prior estimates of useful life are no longer valid due to\nchanged circumstances. Companies apply these changes prospectively; they disclose the change in the footnotes to their financial statements,\nbut no restatement is required.\nNeither IFRS nor US GAAP required the company in this question to change their useful life estimates by changing the relevant accounting\nstandards. The company's changes are properly classified as changes in estimates rather than changes in policy. The company will apply the\nnew depreciation expenses going forward and disclose the changes in the footnotes to its financial statements.\n(Choices A) Restatement is required only when the change results from a change in accounting policy rather than a change in accounting\nestimates.\n(Choice C) When accounting standards change, companies must change their accounting policies to comply with the updated standards.\nCompanies are not allowed to decide for themselves whether to comply by determining whether the change is \"material.\"\nThings to remember:\nChanges in accounting policies are applied retroactively and require restatement of prior earnings. Changes in accounting estimates apply\nprospectively, do not require restatement, and are disclosed in the footnotes to financial statements.\nDescribe the financial reporting treatment and analysis of non-recurring items (including discontinued operations, unusual or infrequent items) and\nchanges in accounting policies", "qhtml": null}, {"n": 39, "q": "A company sells cloud-based accounting software. A 12-month subscription costs $3,000 payable in advance. If this company reports under IFRS standards, how much revenue will it recognize for the 4th month of each subscription?", "opts": ["$0", "$250", "$1,000"], "ans": "B", "expl": "Accrual accounting Cash accounting\nRevenue is earned\nSeller substantially completes all of its obligations\nGoods delivered\nRevenue recognition Cash is received\nServices provided\nSeller (usually) completes obligations before receiving payment\nExample: Payment is due 30 days after invoice\nExpense is incurred\nMirror image of revenue recognition\nExpense recognition Cash is paid\nGoods received\nServices accepted or consumed\nA key concept of accrual accounting is that revenue is recognized when it is earned. The seller earns revenue from a sale when it has\nsubstantially fulfilled all its obligations under the terms of the sale. The seller then reports the earned revenue. Under accrual accounting, revenue\nrecognition does not depend on whether the seller receives payment.\nThe company in this question provides its subscribers with access for one year following the subscriber's payment, so it has received payment\nbefore it has completed its obligation. However, accounting standards require that it recognize a prorated amount of the subscription price as\nrevenue each month during the subscription period. Accordingly, the company will recognize 1/12th of the total subscription price each month, or\n$3,000 / 12 = $250.\nNote that the answer is the same whether the seller reports under IFRS or US GAAP accounting standards.\n(Choice A) The company's obligation can be viewed as 12 separate monthly contracts. At the end of every month, it will have earned the\nprorated share of the subscription price and will recognize the revenue associated with that month. Accounting standards do not permit the\ncompany to delay any revenue recognition until the end of the entire subscription period. Such a delay would distort its financial picture.\n(Choice C) $1,000 is the cumulative amount of income earned by the end of Month 4, not the amount earned solely for Month 4.\nThings to remember:\nRevenue can be recognized ratably over the life of a contract. For subscription contracts that involve periodic sales of goods or services, the\nseller earns a pro rata amount of the subscription price each time it delivers the good or performs the required service.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for\nfinancial analysis", "qhtml": null}, {"n": 40, "q": "A company finalizes a contract to sell a product that will be delivered to the customer 2 months from today. The customer will pay the full amount of the contract next month. If the company expects no problems in delivering the product or receiving payments, then it will most appropriately recognize revenue:", "opts": ["immediately.", "when cash is received.", "when the product is delivered."], "ans": "C", "expl": "Accrual accounting Cash accounting\nRevenue is earned\nSeller substantially completes all of its obligations\nGoods delivered\nRevenue recognition Cash is received\nServices provided\nSeller (usually) completes obligations before receiving payment\nExample: Payment is due 30 days after invoice\nExpense is incurred\nMirror image of revenue recognition\nExpense recognition Cash is paid\nGoods received\nServices accepted or consumed\nUnder both IFRS and US GAAP, revenue is recognized when it is earned, independent of when cash is received, as under accrual accounting.\nThe seller earns revenue from a sale when it has satisfied its performance obligations, effectively transferring the risk and rewards of\nownership. This typically occurs when a good or service is delivered to the buyer.\nUnder accrual accounting, the recognition of revenue occurs independently of when the seller receives cash for the sale, which is when the\nrevenue is recognized in cash basis accounting (Choice B). In accrual accounting, when a company delivers goods or services at a different time\nfrom when it receives cash, it creates an asset or liability on its balance sheet to account for the different events of recognizing revenue and\nreceiving cash.\nIn this scenario, the company finalized a contract to deliver a product 2 months from today. Therefore, no revenue is recognized immediately\nsince no product is delivered immediately (Choice A). Revenue will be recognized on the income statement when the delivery is made in 2\nmonths since that is when the risk and rewards of ownership are transferred.\nThings to remember:\nUnder accrual accounting, which is typically used for income statements, revenue is recognized when it is earned; this occurs when the seller\nsatisfies its performance obligations by transferring the risk and rewards of ownership. This recognition of revenue occurs independently of when\nthe seller receives cash for the sale.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for\nfinancial analysis", "qhtml": null}, {"n": 41, "q": "An analyst compiles the following information on a company: ¥ millions 20X1 20X2 Revenue 1,500 2,000 COGS 500 650 Selling, general, and administrative expenses 450 550 Depreciation and amortization 100 150 Operating income 450 650 Interest expense 80 90 Pretax profit 370 560 Income tax expense 111 140 Net income 259 420 The analyst decides to use a common-size income statement to evaluate the company. After the necessary adjustments are made, which of the following was the greatest contributor to the company's net profit margin expansion in 20X2?", "opts": ["Greater gross margin percentage", "Smaller proportion of interest expenses", "Smaller proportion of selling, general, and administrative expenses"], "ans": "C", "expl": "Common-size income statements present each statement item as a percentage of total revenue. This allows analysts to compare companies\nof different sizes, view performance trends over time, and identify differences or changes in the companies' strategies.\nIn this scenario, the common-size income statement is calculated as follows:\nReported (¥) Common size (%)\nIncome statement 20X1 20X2 20X1 20X2\nRevenue 1,500 2,000 100.0 100.0\nCOGS 500 650 33.3 32.5\nGross profit (margin) (calculated) 1,000 1,350 66.7 67.5\nSelling, general, and administrative expenses 450 550 30.0 27.5\nDepreciation and amortization 100 150 6.7 7.5\nOperating income (margin) 450 650 30.0 32.5\nInterest expense 80 90 5.3 4.5\nPretax profit (margin) 370 560 24.7 28.0\nIncome tax expense 111 140 7.4 7.0\nNet income (margin) 259 420 17.3 21.0\nThe greatest contributing factor to the company's net profit margin expansion is a decline in the proportion of selling, general, and\nadministrative (SG&A) expenses, which fell 2.5% from 30.0% of revenue in 20X1 to 27.5% in 20X2.\nThings to remember:\nCommon-size income statements present each statement item as a percentage of total revenue. This allows analysts to compare companies of\ndifferent sizes, view performance trends over time, and identify differences or changes in the companies' strategies.\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement\n27.An analyst collects the following information on two companies:\nCompanies A and B paid common dividends of €200,000 and €250,000, respectively. Company A's net profit margin is most likely:\nA. less than Company B's.\n B. equal to Company B's.\nC. greater than Company B's.\nExplanation\nNet profit margin reveals how effective management is in managing all expenses and converting revenue to profit. It is used to measure the\namount of net income (ie, based on accounting standards) that the company creates per unit (€) of revenue. A larger net profit margin signals that\nthe company is more efficient at generating a profit.\nHere, divide each company's net income by its revenue to compare the two companies' net profit margins. Both companies have the same net\nprofit margin of 17.2%.\n(Choice A) This choice is correct if the companies' operating profit margin, not net profit margin, is used in the evaluation.\n(Choice C) This answer results if common dividend payments are subtracted from the net income in calculating the net profit margin. Its\ncalculation does not include dividend payments since they are not expenses but instead are a distribution of capital from the company to\nshareholders. This is also true if gross margin, not net profit margin, is used in the evaluation.\nThings to remember:\nNet profit margin is the ratio of net income to revenue. The greater a company's net profit margin, the greater its ability to produce profits.\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement", "qhtml": null}, {"n": 42, "q": "An analyst collects the following information on two companies: Companies A and B paid common dividends of €200,000 and €250,000, respectively. Company A's net profit margin is most likely:", "opts": ["less than Company B's.", "equal to Company B's.", "greater than Company B's."], "ans": "B", "expl": "Net profit margin reveals how effective management is in managing all expenses and converting revenue to profit. It is used to measure the\namount of net income (ie, based on accounting standards) that the company creates per unit (€) of revenue. A larger net profit margin signals that\nthe company is more efficient at generating a profit.\nHere, divide each company's net income by its revenue to compare the two companies' net profit margins. Both companies have the same net\nprofit margin of 17.2%.\n(Choice A) This choice is correct if the companies' operating profit margin, not net profit margin, is used in the evaluation.\n(Choice C) This answer results if common dividend payments are subtracted from the net income in calculating the net profit margin. Its\ncalculation does not include dividend payments since they are not expenses but instead are a distribution of capital from the company to\nshareholders. This is also true if gross margin, not net profit margin, is used in the evaluation.\nThings to remember:\nNet profit margin is the ratio of net income to revenue. The greater a company's net profit margin, the greater its ability to produce profits.\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement", "qhtml": null}, {"n": 43, "q": "On January 1, 20X8, Company Z issued convertible preferred stock that pays a dividend. Other than common stock, Company Z has issued no other securities. When an analyst calculated its basic and diluted earnings per share (EPS) for the year, the analyst found that basic EPS was $0.50 and diluted EPS was $0.55. Company Z should treat the convertible stock as:", "opts": ["dilutive and report only diluted EPS.", "antidilutive and report only basic EPS.", "dilutive and report both diluted EPS and basic EPS."], "ans": "B", "expl": "Both US GAAP and IFRS require companies that have convertible securities in their capital structure (ie, complex structure) to calculate and\nreport both basic earnings per share (EPS) and diluted EPS. Diluted EPS assumes that all convertible securities were converted to common stock\nat the beginning of the period. Conversion usually causes EPS to be lower due to the increased number of shares over which net income is\napportioned.\nWhen diluted EPS is greater than basic EPS, the convertible securities are described as antidilutive. Both GAAP and IFRS require a company to\nexclude antidilutive securities from EPS calculations and report only the lower EPS figure (ie, basic EPS). Company Z has both convertible\npreferred and common stock, but since its diluted EPS is $0.05 greater than basic EPS, the convertible preferred stock is antidilutive. Therefore,\nCompany Z will report only the basic EPS of $0.50 for the year.\n(Choice A) The convertible preferred stock is antidilutive, so Company Z will report only basic EPS.\n(Choice C) The convertible preferred stock is antidilutive, but GAAP and IFRS both require Company Z to report basic, not diluted, EPS.\nThings to remember:\nEven if a security is convertible, if its conversion to common stock causes earnings per share (EPS) to increase, then the security is antidilutive\nand is treated as nonconvertible when calculating EPS. If diluted EPS is higher than basic EPS, both IFRS and US GAAP require the company to\nreport only basic EPS.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 44, "q": "A company has issued convertible bonds and has no other dilutive securities outstanding. If the convertible bonds are antidilutive, the impact on reported basic and diluted earnings per share (EPS) is most likely that:", "opts": ["basic EPS increases.", "neither earnings measure changes.", "both basic and diluted EPS are impacted."], "ans": "B", "expl": "IFRS and US GAAP require companies to report basic and diluted earnings per share (EPS). Basic EPS is calculated by dividing the firm's\nincome available to common shareholders (ie, net income less preferred dividends) by its weighted average number of common shares. Basic\nEPS ignores any impact from potentially dilutive convertible securities. If the company has a simple capital structure with no convertible\nsecurities, then diluted EPS is equal to basic EPS.\nIf the company has a complex capital structure, and if its convertible securities are dilutive, then diluted EPS is less than basic EPS. Accounting\nstandards treat all dilutive convertible securities as if they are converted to common stock at the beginning of the year. In general, this\nhypothetical conversion increases the number of shares outstanding, which makes diluted EPS less than basic EPS.\nIn some cases, conversion results in fewer common shares outstanding and/or in more earnings available to common shareholders, which causes\ncalculated diluted EPS to be greater than basic EPS. In such cases, the securities are antidilutive. Since companies should report the most\nconservative (ie, lowest) figure for EPS, if basic EPS is lower than calculated diluted EPS, then reported diluted EPS is equal to basic EPS. Both\nbasic and diluted EPS effectively ignore any impact from antidilutive securities (Choices A and C).\nThings to remember:\nAntidilutive convertible securities indicate that were the securities converted, there would be fewer shares outstanding and/or more earnings\navailable to common shareholders, which causes calculated diluted earnings per share (EPS) to be greater than basic EPS. In that case, reported\ndiluted EPS is equal to basic EPS since it is the more conservative measure.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 45, "q": "A company will report net income of €30 million this fiscal year ending 31 December. It began the year with 40 million common shares and neither issued nor repurchased common shares during the year. On July 1, the firm sold 100,000 shares of convertible preferred stock for €50 per share. The shares carry a 5% dividend and are immediately convertible into 20 shares of common stock. The effective tax rate is 40%. The company's diluted EPS for the year is closest to: ", "opts": ["€0.71", "€0.73", "€0.74"], "ans": "A", "expl": "A corporation must report basic earnings per share (EPS) as well as diluted EPS if its capital structure includes securities that can be\nconverted into common shares. If converted, such securities increase the number of shares outstanding, so net income is divided by more\nshares, resulting in a lower per-share figure.\nFor calculating diluted EPS, convertible preferred stock is assumed to have been converted to common stock (ie, if-converted method) at the\nbeginning of the period.\nThe if-converted method treats the preferred stock as though it never existed, so the company will not have to pay dividends on it. For diluted\nEPS, the dividends that would have been paid are added back to net income, which increases the numerator. Firm B's adjustments from basic to\ndiluted EPS are shown below:\n(Choice B) The preferred dividends were added back to net income, so the numerator is correct, but the weighted average number of shares was\ncalculated as if the preferred stock had been converted as of the date it was issued (July 1), rather than the beginning of the period (January 1).\nThis would cause the additional shares to be 1,000,000 instead of 2,000,000, and the diluted EPS to be approximately 0.73.\n(Choice C) 0.74 is closest to the company's basic EPS, not its diluted EPS.\nThings to remember:\nConversion of convertible securities is assumed to be at the beginning of the period if the securities were outstanding at the beginning of the\nperiod. If the securities were issued during the period, conversion is assumed to have occurred at as of the date of issuance.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 46, "q": "A company just sold a warehouse that it no longer uses. The sale price was $4 million payable in equal installments over four years. The buyer has paid the first installment of $1 million and is expected to make the remaining payments on time. The company carried the warehouse on its balance sheet at its net book value of $6 million. This year, the company will most appropriately recognize a loss of:", "opts": ["$0", "$500,000", "$2,000,000"], "ans": "C", "expl": "Under the accrual accounting method, revenues are generally recognized in the accounting period they are earned, and any associated gains or\nlosses are also recognized in the same period. A seller earns the revenue by performing all its requirements under a contract. One exception to\nthe general rule is for installment sales, in which the seller receives payments over more than one accounting period.\nWith installments, the seller recognizes a prorated amount of the total profit from the sale each year. However, the installment sales exception\napplies only when the seller has a gain from the sale. If the sale is made at a loss, then the entire loss is realized immediately and recognized\nin the period of the sale.\n(Choice A) Although the company's loss may exceed $2 million if the buyer defaults on payments, the firm at this point has no reason to assume\nthat the buyer will default. There is no uncertainty surrounding the current amount of the company's loss of $2 million; therefore, the firm must\nimmediately realize and recognize the loss.\n(Choice B) The installment sales exception does not apply to sales made at a loss, and the seller cannot prorate the loss over the installment\nperiod.\nThings to remember:\nDeferring realization and recognition of revenues through use of the installment sales method applies only when the transaction would result in a\ngain at the time of sale. When the sale is made at a loss, the entire loss must be realized and recognized in the period of the sale.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for\nfinancial analysis", "qhtml": null}, {"n": 47, "q": "An analyst gathers the following information about a company for the most recent fiscal year: annual net income: HKD 500 million weighted average common shares outstanding: 250 million convertible debt outstanding: HKD 100 million at 9% interest, convertible into 10 million common shares tax rate: 33.33% If there are no other dilutive securities, then diluted EPS (in HKD) is closest to: ", "opts": ["1.95", "2.00", "2.11"], "ans": "A", "expl": "Companies with complex capital structures (ie, potentially dilutive securities) may report a diluted EPS that is different from its basic EPS.\nDilutive securities, such as convertible debt, are convertible into shares of common stock. Companies issue additional common shares upon\nconversion, thus increasing the number of shares outstanding and reducing EPS. Under the if-converted method, diluted EPS is calculated\nassuming that conversion occurred at the beginning of the year.\nIf the company had converted its convertible bonds at the beginning of the period to common shares, it would not have paid after-tax interest\nexpense of HKD 6 million for the year. Therefore, it is added back to net income in the diluted EPS numerator. Furthermore, the company would\nhave issued 10 million additional common shares, which increases the denominator and dilutes the EPS to HKD 1.95.\n(Choice B) 2.00 is the basic EPS.\n(Choice C) 2.11 results from subtracting the new common shares in the denominator, instead of adding.\nThings to remember:\nUnder the if-converted method, diluted EPS is calculated assuming that conversion occurred at the beginning of the year. For companies with\nconvertible debt in their capital structure, add back after-tax interest cost to net income in the numerator and add additional common shares issued\nto the denominator.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 48, "q": "Which of the following best describes a conservative approach for managing expenses?", "opts": ["Using estimates that maximize periodic expenses", "Expensing the cost of warranties when they occur", "Decreasing receivables when an account is deemed uncollectible"], "ans": "A", "expl": "Conservative accounting policies\nUnderstate net income\nOverstate expenses\nUse estimates to recognize expenses\nOne aspect of a company's reporting is how conservative its accounting policies are. Companies using highly conservative accounting policies\nensure that operational uncertainties are adequately considered and disclosed in their financial statements. The use of estimates that produce\nhigher expenses (ie, lower net income) is considered conservative.\nThe cost of warranties is unknown since the future claims are uncertain. To be conservative, a company should record estimated warranty\nexpenses immediately and in each period. This is preferable to waiting until the actual warranty expenses occur (Choice B).\nSimilarly, when a company has credit sales, customer defaults are uncertain at the time of purchase. The company should estimate defaults and\nrecord an expense in each period. It would be less conservative to wait and decrease accounts receivable as incurred since this would delay\nrecognition of the bad debt expense (Choice C).\nThings to remember:\nCompanies may use conservative accounting policies to ensure that operational uncertainties are adequately considered and disclosed in their\nfinancial statements. The use of estimates to calculate expenses is considered more conservative than waiting for actual events to occur since it\nallows companies to recognize a greater expense (eg, more than zero) earlier.\nDescribe general principles of expense recognition, specific expense recognition applications, implications of expense recognition choices for\nfinancial analysis and contrast costs that are capitalized versus those that are expensed in the period in which they are incurred", "qhtml": null}, {"n": 49, "q": "An analyst collects the following information on a company for the most recent reporting period: Net income €100 million Preferred dividends €5 million Weighted average common shares outstanding 150 million Stock options 20 million Exercise price €30 Average stock price €40 Based on this information, if the number of stock options is constant during the period, then the company's diluted EPS (in €) is closest to:", "opts": ["0.56", "0.61", "0.63"], "ans": "B", "expl": "The method used to calculate diluted EPS for a company with outstanding options assumes that:\nthe options will be converted into common shares (ie, exercised) if the average stock price is greater than the exercise price, and\nthe company will use all cash proceeds from the exercised options to repurchase shares at the average market price to mitigate EPS\ndilution.\nThus, the net share increase equals new common shares issued, net of repurchases.\nNote that since the average stock price (€40) is greater than the exercise price (€30), all 20 million options are assumed to be converted into\ncommon shares. The company would have used all options proceeds (20 million × €30, or €600 million) to repurchase 15 million shares (€600\nmillion / €40), thus increasing net new shares by 5 million.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 50, "q": "A company's 20X6 income statement is: On the company's 20X6 common-size income statement, rent expense is closest to: ", "opts": ["5%", "10%", "33%"], "ans": "A", "expl": "A common-size income statement shows each income statement figure as a percentage of revenue. Since this method evaluates all\nexpenses and overall profitability in proportion to revenue, not as absolute numbers, it allows for more useful reviews of a company's performance\nover multiple periods or comparisons between two companies. In this scenario, rent expense, expressed as a percentage of revenue, is 5%\n(10,000 ÷ 200,000):\nOne exception is made for tax expense, which is expressed as a percentage of pretax income, not revenue. That percentage is the company's\neffective tax rate. Although tax expense and the effective tax rate are related to revenue, they also reflect a company's management of tax\nobligations, so the effective tax rate is the preferred metric for comparisons. This metric also allows analysts to project net income based on\nhistorical effective tax rates.\nThings to remember:\nPreparing a common-size income statement requires converting each income statement figure to a percentage of revenue. The one exception is\ntax expense, which is expressed as a percentage of pretax income, not revenue.\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement", "qhtml": null}, {"n": 51, "q": "A company reported a goodwill impairment of USD 800 million for the first quarter ending 20X2. Based on only this information, it is most likely that:", "opts": ["net income was unaffected by the impairment.", "investing cash flow was reduced by the amount of impairment.", "management overpaid for one or more acquisitions in the past."], "ans": "C", "expl": "Goodwill is the difference between the price an acquiring company pays for a target company and the fair market value of the target company's\nidentifiable net assets (ie, fair value of assets minus fair value of liabilities). Goodwill impairments result from the loss of value of those assets,\nwhich ultimately did not live up to initial expectations and must be written down. There may be many reasons (eg, a decline in competitiveness,\npolitical instability) why the acquisition, and thus the goodwill it generated, has not maintained its value. In hindsight, the assets have proven to be\nless valuable than expected, and it is likely that management overpaid for them.\nGoodwill is capitalized on the acquiring company's balance sheet as a noncurrent intangible asset. Since it has no finite life, it is not amortized;\ninstead, it is evaluated annually for possible impairment. If an impairment is deemed appropriate, an impairment loss affects the financial\nstatements in the period when it is identified, reducing total assets and flowing through the income statement, impacting earnings as a noncash\ncharge.\n(Choice A) Net income is directly affected by goodwill impairment since a charge must be taken against income in the current period.\n(Choice B) Goodwill impairment is a noncash charge and therefore does not impact the cash flow statement.\nThings to remember:\nGoodwill impairments may result from overpaying for assets that do not live up to initial expectations and must be written down.\nExplain the financial reporting and disclosures related to goodwill", "qhtml": null}, {"n": 52, "q": "An analyst compiles the following common-size balance sheet items for a company: 20X9 20X8 Cash and cash equivalents 4 5 Accounts receivable 15 14 Inventory 28 25 Total current assets 47 44 Property, plant & equipment 50 56 Goodwill 3 0 Total assets 100 100 Accounts payable 12 9 Short-term debt 8 10 Total current liabilities 20 19 Long-term debt 57 59 Total liabilities 77 78 Total shareholders' equity 23 22 Total liabilities and shareholders' equity 100 100 Based only on the data above, the most appropriate conclusion the analyst can draw is that compared to 20X8, in 20X9 the company has:", "opts": ["increasing solvency risk.", "a more liquid asset base.", "not made any acquisitions."], "ans": "B", "expl": "A common-size balance sheet shows all a company's assets and liabilities as a percentage of its total assets. Converting to a common-size\nbalance sheet can be useful for analyzing trends for a single company over time, as well as comparing companies of different sizes to each other.\nSince common-size balance sheet items are proportional to a company's asset value, an analyst could determine whether the company is shifting\nits asset base to become more liquid. In this scenario, the company's current assets have increased from 44% of the company's asset base to\n47%, indicating that it may be shifting to a greater proportion of more liquid assets.\n(Choice A) Based on the company's common-size balance sheet, its solvency risk measures are declining, suggesting decreasing solvency risk.\n(Choice C) The company has goodwill on its balance sheet in 20X9 and none in 20X8, suggesting that it made an acquisition during 20X9.\nThings to remember:\nCommon-size balance sheets show a company's assets and liabilities as a percentage of its total assets. This can be useful for analyzing trends\nfor a single company over time or comparing companies to each other at a specific point in time.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 53, "q": "An analyst gathers the following data: Which of the following companies most likely has the greatest ability to pay its current liabilities based on the quick ratio?", "opts": ["Company A", "Company B", "Company C"], "ans": "C", "expl": "The quick ratio is a liquidity ratio that measures a company's ability to meet its short-term obligations (ie, due within a year). It is a conservative\nliquidity measure because it includes only cash, marketable securities, and accounts receivable.\nIn the context of calculating the quick ratio, marketable securities are considered short-term. Inventory, excluded from the quick ratio, is a less\nliquid current asset as it takes longer to convert to cash. Prepaid expenses are not included in the quick ratio since they are rarely converted to\ncash.\nHere, add the quick assets and divide this sum by total current liabilities. Company C has the greatest ability to pay with a quick ratio of 0.778.\nThings to remember:\nThe quick ratio is equal to the sum of cash, marketable securities, and accounts receivable divided by the current liabilities (ie, due within a year).\nInventory is excluded from the quick ratio since it takes longer to convert to cash than other current assets (eg, lower liquidity). A company that\nhas a greater quick ratio has a greater ability to meet its short-term obligations.\nCalculate and interpret common-size balance sheets and related financial ratios\n4.An analyst forecasts the upcoming year's fixed charge coverage ratio (FCCR) to be 2. Within the forecast:\nEBIT is AUD 10 million,\ntax expense is AUD 1.5 million, and\ninterest expense is AUD 4 million.\nThe forecasted lease amount (in AUD millions) is closest to:\nA. 1.0\n\nB. 2.0\nC. 3.5\nExplanation\nA fixed charge coverage ratio (FCCR) is a coverage ratio that measures a company's ability to cover its interest and lease (ie, rent) obligations\nwith its profits. In the numerator, EBIT (earnings before interest and taxes) is sometimes called EBITDAR (earnings before interest, taxes,\ndepreciation, amortization, and rent), since it captures profits before interest and lease amounts. Lease amounts are added to EBIT in the\nnumerator, and the denominator contains both the interest and lease amounts.\n(Choice A) 1.0 results from not including the lease variable in the numerator.\n(Choice C) 3.5 results from including taxes in the numerator.\nThings to remember:\nA fixed charge coverage ratio (FCCR) measures a company's ability to cover its interest and lease (ie, rent) obligations with its profits. The\nnumerator equals EBIT (earnings before interest and taxes) plus the lease amounts. The denominator equals interest plus the lease amounts.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 54, "q": "An analyst forecasts the upcoming year's fixed charge coverage ratio (FCCR) to be 2. Within the forecast: EBIT is AUD 10 million, tax expense is AUD 1.5 million, and interest expense is AUD 4 million. The forecasted lease amount (in AUD millions) is closest to:", "opts": ["1.0", "2.0", "3.5"], "ans": "B", "expl": "A fixed charge coverage ratio (FCCR) is a coverage ratio that measures a company's ability to cover its interest and lease (ie, rent) obligations\nwith its profits. In the numerator, EBIT (earnings before interest and taxes) is sometimes called EBITDAR (earnings before interest, taxes,\ndepreciation, amortization, and rent), since it captures profits before interest and lease amounts. Lease amounts are added to EBIT in the\nnumerator, and the denominator contains both the interest and lease amounts.\n(Choice A) 1.0 results from not including the lease variable in the numerator.\n(Choice C) 3.5 results from including taxes in the numerator.\nThings to remember:\nA fixed charge coverage ratio (FCCR) measures a company's ability to cover its interest and lease (ie, rent) obligations with its profits. The\nnumerator equals EBIT (earnings before interest and taxes) plus the lease amounts. The denominator equals interest plus the lease amounts.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 55, "q": "An analyst collects the following year-end information on three companies: On its common-size balance sheet, which company most likely reports the highest percentage of inventory?", "opts": ["Company X", "Company Y", "Company Z"], "ans": "C", "expl": "A common-size balance sheet reports accounts (ie, assets and liabilities) on the balance sheet as a percentage of total assets. It is a useful\ntool for comparing companies of various sizes at the same point in time. To convert a balance sheet to a common-size balance sheet, divide each\nasset account balance by the company's total assets.\nHere, divide each company's inventory by its total assets to determine which company has the highest percentage of inventory on its common-size\nbalance sheet. Company Z's inventory as a percentage of total assets is 38.1%, the greatest of the three companies.\n(Choice A) Company X would have the highest percentage of inventory if common-size balance sheets were based on current assets, not total\nassets.\n(Choice B) Company Y has the highest amount of inventory in currency terms, but not as a percentage of total assets.\nThings to remember:\nA common-size balance sheet reports each asset as a percentage of total assets. To convert a balance sheet to a common-size balance sheet,\ndivide each account balance by the total assets.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 56, "q": "Which of the following is most likely a disclosure for PPE that is required under IFRS but not under US GAAP?", "opts": ["Useful lives", "Gross carrying amounts", "Estimated depreciation over the next five years"], "ans": "A", "expl": "Required disclosures of property, plant, and equipment (PPE) vary between IFRS and US GAAP. Under US GAAP, required disclosures are\nmuch less detailed as compared to IFRS. PPE includes tangible assets with useful lives of greater than one year. The costs (ie, measurement\nbase) to obtain them are capitalized. Each year, part of the PPE cost is expensed as depreciation. Disclosures help analysts identify how different\ncompanies determine original costs and calculate depreciation expenses.\nThe disclosure of assets' useful lives is required exclusively under IFRS. Useful life is an estimate of the time remaining in which an asset\ncontinues to provide economic benefit (eg, generate revenue).\n(Choice B) Both IFRS and US GAAP require the disclosure of the gross carrying amount. The gross carrying amount is the value of an asset\nprior to accounting for deprecation.\n(Choice C) The disclosure of estimated depreciation over the next five years is required under US GAAP, not IFRS.\nThings to remember:\nRequired disclosures of PPE vary between IFRS and US GAAP. The disclosure of assets' useful lives is required exclusively under IFRS. Useful\nlife is the time remaining in which an asset continues to provide economic benefit.\nExplain the financial reporting and disclosures related to intangible assets", "qhtml": null}, {"n": 57, "q": "An airline company reports the following information for 20X8: £ thousands Gross profit 2,900 Finance lease payments (900) Other operating expenses (500) Interest payments (800) Earnings before tax (EBT) 700 Tax (30%) (210) Net income 490 The fixed charge coverage ratio for 20X8 is closest to:", "opts": ["1.29", "1.41", "1.88"], "ans": "B", "expl": "Solvency ratios evaluate a company's ability to satisfy its long-term debt obligations. Coverage ratios such as the fixed charge coverage ratio\nare one category of solvency ratios. Coverage ratios focus on income statement items and cash from operations (CFO) and illustrate a company's\nability to satisfy periodic payments related to debt and debt-like obligations such as leases.\nLease payments and interest on debt are two common types of fixed charges. The fixed charge coverage ratio measures the company's ability to\nsatisfy its fixed obligations from operating earnings. The company's fixed charge coverage ratio is shown below:\n(Choice A) 1.29 results from using net income instead of EBIT to calculate the fixed charge coverage ratio.\n(Choice C) 1.88 is the interest coverage ratio, which does not include lease payments.\nThings to remember:\nThe fixed charge coverage ratio is a solvency ratio that measures a company's ability to pay interest and lease payments from operating earnings.\nIt is a more conservative measure than the interest coverage ratio when the company acquires operating assets through leases.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 58, "q": "An analyst compiles the following financial data for two companies: Selected Financial Data Company A ($ millions) Cash and cash equivalents 300 Accounts payable 140 Marketable securities 60 Taxes payable 40 Accounts receivable 90 Short-term debt 420 Inventories 240 Company B Cash ratio 0.56 Quick ratio 0.85 Current ratio 1.09 Based only on this data, which ratio indicates that Company A has a greater risk of being unable to meet its short-term obligations than Company B?", "opts": ["Cash ratio", "Quick ratio", "Current ratio"], "ans": "B", "expl": "Balance sheet ratios such as liquidity ratios can provide some insights into a company's short-term and long-term financial health. Liquidity\nratios address a company's ability to meet its short-term liabilities using its short-term assets.\nIn this scenario, two companies' liquidity ratios are being compared. Lower ratios indicate greater risk that a company may struggle to meet its\nshort-term obligations (ie, the company has more liquidity risk since it has fewer assets available to \"cover\" its liabilities). Company A's ratios can\nbe calculated as:\nCompany A's quick ratio of 0.75 is less than Company B's quick ratio of 0.85. This suggests Company A has less short-term asset value relative to\nits short-term obligations and greater risk of being unable to meet its short-term obligations than Company B.\nCalculate and interpret common-size balance sheets and related financial ratios\n9. Over multiple fiscal years, a company's historical common-size balance sheets most likely reflect a change in:\n A. financial leverage.\nB. operating cash flow.\nC. cross-sectional profitability.\nExplanation\nA time series of data based on common-size balance sheets shows changes in the composition of all balance sheet items over time. Since a\nbalance sheet reports assets, liabilities (ie, debt), and equity, it is a useful tool for analyzing how a company's leverage changes over time.\nLeverage is the amount of debt the company uses to obtain assets. By examining total debt as a percentage of total assets, analysts can\nidentify changes in leverage over many periods.\n(Choice B) While a common-size balance sheet does show cash as a percentage of total assets, that amount is the company's total cash from\noperating, investing, and financing activities. A common-size cash flow statement, not a balance sheet, discloses information regarding historical\noperating cash flow.\n(Choice C) Cross-sectional analysis is a comparison of one company against many of its competitors. Comparisons of profitability can be made\nwhen examining historical common-size income statements from a company and its competitors.\nThings to remember:\nA common-size balance sheet reports all balance sheet items as a percentage of total assets. Since a balance sheet reports assets, liabilities (ie,\ndebt), and equity, it is a useful tool for analyzing how a company's leverage changes over time.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 59, "q": "Over multiple fiscal years, a company's historical common-size balance sheets most likely reflect a change in:", "opts": ["financial leverage.", "operating cash flow.", "cross-sectional profitability."], "ans": "A", "expl": "A time series of data based on common-size balance sheets shows changes in the composition of all balance sheet items over time. Since a\nbalance sheet reports assets, liabilities (ie, debt), and equity, it is a useful tool for analyzing how a company's leverage changes over time.\nLeverage is the amount of debt the company uses to obtain assets. By examining total debt as a percentage of total assets, analysts can\nidentify changes in leverage over many periods.\n(Choice B) While a common-size balance sheet does show cash as a percentage of total assets, that amount is the company's total cash from\noperating, investing, and financing activities. A common-size cash flow statement, not a balance sheet, discloses information regarding historical\noperating cash flow.\n(Choice C) Cross-sectional analysis is a comparison of one company against many of its competitors. Comparisons of profitability can be made\nwhen examining historical common-size income statements from a company and its competitors.\nThings to remember:\nA common-size balance sheet reports all balance sheet items as a percentage of total assets. Since a balance sheet reports assets, liabilities (ie,\ndebt), and equity, it is a useful tool for analyzing how a company's leverage changes over time.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 60, "q": "A portfolio manager gathers the following data: If the company has no other long-term debts, its long-term debt-to-equity ratio is closest to: ", "opts": ["0.38", "0.48", "1.08"], "ans": "A", "expl": "Long-term-debt to equity is a solvency ratio that measures a company's ability to pay its long-term obligations and helps gauge a company's\nfinancial risk. The long-term debt-to-equity ratio signifies the level of long-term, interest-bearing debt relative to the amount of equity. The greater\na company's ratio, the weaker the company's solvency. In this scenario:\nLong-term debt includes bonds payable but does not include noncurrent deferred revenue. Bonds payable is considered long-term since payment\nis due in more than 12 months. Some analysts include all long-term liabilities, which would include noncurrent deferred revenue, but CFAI limits\n\"liabilities\" to those that are interest-bearing. In this case, noncurrent deferred revenue is not included since it is not interest-bearing.\nEquity includes common stock and retained earnings. Retained earnings represents the accumulated portion of net income (after paying for\ndividends) that is reinvested back into the company each year.\n(Choice B) 0.48 results from including the noncurrent deferred revenue as part of long-term debt.\n(Choice C) 0.68 results from incorrectly including interest payable as part of long-term debt. Interest payable is a current liability that is due in\nless than 12 months and is not included in long-term debt.\nThings to remember:\nLong-term debt to equity measures a company's ability to pay its long-term obligations. The greater the company's ratio, the more leverage it has\nand the weaker the company's solvency.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 61, "q": "An acquiring company purchases a target company. The goodwill created from the transaction is best described as the difference between the acquirer's purchase price and the target company's:", "opts": ["book value of equity.", "fair value of net assets.", "market value of common stock."], "ans": "B", "expl": "Goodwill is the difference between the price the acquiring company pays for the target company and the fair value of identifiable (eg, tangible,\nintangible) net assets of the target company (ie, fair value of assets minus fair value of liabilities). It is recorded on the acquiring company's\nbalance sheet as a long-term intangible asset. Goodwill represents the additional value management believes it can generate in the future by\npurchasing the target company now.\nEstimates of fair value are based on management's judgment. Corroborating the fair value of some assets may prove to be difficult. Management\nbases the purchase price on its expectations and estimates, but the value of goodwill may or may not be realized in the future. Each year\nsubsequent to the acquisition, management reassesses the current value of goodwill.\n(Choices A and C) The initial value of goodwill is the difference between the price paid by the acquiring company and the fair value of the target\ncompany's net assets, not the book or market value of the target company's common stock (equity).\nThings to remember:\nGoodwill is the difference between the price paid by the acquiring company and the fair value of identifiable net assets of the target company. It\nrepresents the additional value the company believes it can generate.\nExplain the financial reporting and disclosures related to goodwill", "qhtml": null}, {"n": 62, "q": "An analyst gathers the following information for a company: 20X8 (€ thousands) Assets 5,000 Short-term debt 500 Long-term debt 2,000 Deferred tax liabilities 300 Deferred revenue 100 Accounts payable 100 Based on this information, the company's debt-to-capital ratio for 20X8 is closest to:", "opts": ["0.50", "0.56", "0.60"], "ans": "B", "expl": "Solvency ratios evaluate a company's ability to satisfy its long-term debt obligations. Leverage ratios are one category of solvency ratios and\nshow how much debt a company uses to finance its assets. Analysts use these ratios for side-by-side comparisons among companies, as well\nas changes in a company's ability to pay debt over time.\nThe debt-to-capital ratio is a leverage ratio that shows the percentage of a company's debt relative to all its capital sources. \"Debt\" includes both\nshort- and long-term debt obligations but excludes liabilities such as accounts payable, deferred tax liabilities, and deferred revenue, which are not\ninterest-bearing. The calculation is shown below:\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 63, "q": "A company provides the following balance sheet information: Compared to the prior year, a current year common-size balance sheet would most likely show a(n):", "opts": ["increase in current assets.", "increase in common stock.", "decrease in current liabilities."], "ans": "C", "expl": "Common-size balance sheets display each line item as a percentage of total assets. Analysts often construct common-size balance sheets to\ncompare the composition of items over time or across companies.\nIn this question, the respective percentages are determined by dividing the items by total assets. The output shows that current liabilities\ndecreased from the prior year as a percentage of total assets from 13.8% to 12.5% despite increasing in amount. Similarly, current assets and\ncommon stock increased from the prior year on an absolute basis but decreased as a percentage of total assets (Choices A and B).\nThings to remember:\nCommon-size balance sheets display each item as a percentage of total assets. Analysts often construct common-size balance sheets to\ncompare the composition of items over time or across companies.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 64, "q": "An analyst collects the following information (in ¥ millions) for a company: Cash 1,900 Marketable securities 500 Accounts receivable 200 Accounts payable 6,000 If there are no other current liabilities, compared with the industry average cash ratio of 0.4, the company's cash ratio is most likely:", "opts": ["less than the industry average.", "equal to the industry average.", "greater than the industry average."], "ans": "B", "expl": "Liquidity refers to how quickly and easily an asset can be converted to cash at its current value. Liquidity ratios assess a company's ability to\nsatisfy its current liabilities. The cash ratio is the most conservative liquidity ratio since it includes only the most liquid assets.\nThe cash ratio is the sum of cash (including cash equivalents) and marketable securities as a percentage of the company's current liabilities.\nCurrent liabilities are debts due within 12 months. A higher cash ratio suggests better liquidity. In this scenario, the cash ratio is calculated as\nfollows:\n(Choice A) The cash ratio is less than the industry average when it excludes marketable securities from the numerator.\n(Choice C) The cash ratio is greater than the industry average when it erroneously includes accounts receivable in the numerator. Accounts\nreceivable is not considered as liquid as cash or marketable securities.\nThings to remember:\nThe cash ratio is the most conservative liquidity ratio since it includes only the most liquid current assets. The cash ratio is cash (including cash\nequivalents) plus marketable securities as a percentage of current liabilities.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 65, "q": "An analyst collects the following selected financial statement items for a company: Based on this information, and assuming straight-line depreciation, the estimated remaining useful life of the company's noncurrent assets is closest to:", "opts": ["3 years.", "13 years.", "16 years."], "ans": "B", "expl": "From a company's age of noncurrent assets, analysts can determine if, and by how much, the company is reinvesting in noncurrent assets.\nAlthough neither US GAAP nor IFRS require that companies disclose the age of their noncurrent assets, the diagram allows analysts to estimate it\nbased on income statement and balance sheet entries. The one caveat is that the equation can only be used for straight-line depreciation.\nThe variables used to calculate the remaining useful life are as follows:\nHistoric cost is the amount paid for an asset, shown above as the gross amount for property, plant, and equipment. Accumulated depreciation is\nthe total depreciation expense since the asset was acquired, and the net book value is the difference between the historic cost and accumulated\ndepreciation. The steps for calculating the total asset life, current age, and remaining asset life are as follows:\nExplain the financial reporting and disclosures related to intangible assets\n16.An analyst gathers the following information about a company:\nIn 20X1, the company borrowed using a 20-year mortgage.\nIn May 20X3, the company received cash for services to be delivered in 20X5.\nIn November 20X3, the company purchased inventory and will pay suppliers in February 20X4.\nIn 20X3, which of the following is most likely classified as a long-term liability?\n A. The unearned revenue\nB. The current portion of long-term debt\nC. The debt payable from the inventory purchase\nExplanation\nLiabilities are debts that a company owes to others. Noncurrent liabilities are debts due in more than 12 months. If a debt is due to be paid in\n12 months or less, it is classified as a current liability.\nUnearned revenue is a liability recorded when a company receives cash in advance of the delivery of goods or services; only when the company\ndelivers the goods can it consider the revenue earned. In this scenario, since the company received cash in 20X3 and will not deliver the goods\nuntil 20X5, the time elapsed between cash received and delivery is greater than 12 months.\n(Choice B) The current portion of long-term debt represents the amount of repayment due (in less than 12 months) in the current period, so it is a\ncurrent, not a noncurrent, liability.\n(Choice C) If a company buys inventory in the second half of the year and repays it in the first half of the following year, the debt is considered\ncurrent, not noncurrent, since it is paid within 12 months.\nThings to remember:\nLiabilities are debts that a company owes to others. Noncurrent liabilities are debts due in more than 12 months. Current liabilities are debts due\nin 12 months or less.\nExplain the financial reporting and disclosures related to non-current liabilities", "qhtml": null}, {"n": 66, "q": "An analyst gathers the following information about a company: In 20X1, the company borrowed using a 20-year mortgage. In May 20X3, the company received cash for services to be delivered in 20X5. In November 20X3, the company purchased inventory and will pay suppliers in February 20X4. In 20X3, which of the following is most likely classified as a long-term liability?", "opts": ["The unearned revenue", "The current portion of long-term debt", "The debt payable from the inventory purchase"], "ans": "A", "expl": "Liabilities are debts that a company owes to others. Noncurrent liabilities are debts due in more than 12 months. If a debt is due to be paid in\n12 months or less, it is classified as a current liability.\nUnearned revenue is a liability recorded when a company receives cash in advance of the delivery of goods or services; only when the company\ndelivers the goods can it consider the revenue earned. In this scenario, since the company received cash in 20X3 and will not deliver the goods\nuntil 20X5, the time elapsed between cash received and delivery is greater than 12 months.\n(Choice B) The current portion of long-term debt represents the amount of repayment due (in less than 12 months) in the current period, so it is a\ncurrent, not a noncurrent, liability.\n(Choice C) If a company buys inventory in the second half of the year and repays it in the first half of the following year, the debt is considered\ncurrent, not noncurrent, since it is paid within 12 months.\nThings to remember:\nLiabilities are debts that a company owes to others. Noncurrent liabilities are debts due in more than 12 months. Current liabilities are debts due\nin 12 months or less.\nExplain the financial reporting and disclosures related to non-current liabilities", "qhtml": null}, {"n": 67, "q": "An analyst evaluates the solvency of three companies and gathers the following information: Company X Company Y Company Z Total assets 6,340 3,460 7,030 Common stock 750 140 470 Additional paid-in capital 2,800 1,890 3,900 Retained earnings 900 310 110 Treasury stock (50) (100) (110) Based on the companies' financial leverage ratios, which company has the greatest ability to meet long-term obligations? ", "opts": ["Company X", "Company Y", "Company Z"], "ans": "A", "expl": "The financial leverage ratio (ie, total assets to total equity) is one of several solvency ratios analysts use to measure a company's ability to\nmeet its long-term obligations and understand its financial risk. The greater the ratio, the more the company uses debt to finance its assets.\nTherefore, a lower financial ratio implies greater solvency, and vice versa.\nIn this scenario, calculate the financial leverage ratios of each company as follows:\nCompany X has the lowest financial leverage ratio and therefore the greatest ability to meet long-term obligations.\n(Choice B) Company Y has the least amount of total assets. However, compared with Company X, its total equity is lower in relation to its total\nassets; therefore, Company Y has a higher financial leverage ratio than Company X.\n(Choice C) Company Z has the highest financial leverage ratio; therefore, of the three companies, it is least able to meet its long-term obligations.\nThings to remember:\nThe financial leverage ratio (ie, total assets to total equity) is a solvency ratio that analysts use to measure a company's ability to meet its long-\nterm obligations. The greater the ratio, the more the company uses debt to finance its assets. Therefore, a lower financial ratio implies greater\nsolvency and ability to meet obligations.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 68, "q": "A bank examiner collects the following data: Which company has the greatest value of assets?", "opts": ["Company X", "Company Y", "Company Z"], "ans": "C", "expl": "Solvency ratios, such as the long-term debt-to-equity and financial leverage ratios, assess a company's ability to pay its long-term obligations and\ngauge financial risk. The long-term debt-to-equity ratio measures long-term debt with respect to equity. The financial leverage ratio\nindicates the relationship of assets to owner's equity. For both ratios, the greater the ratio, the more debt the company used to acquire its assets.\nTo determine which of the given companies has the greatest value of assets, first find the equity from the given long-term debts and long-term\ndebt-to-equity ratios. Rearrange the long-term debt-to-equity ratios to solve for equity. Then, find the assets using the companies' equity and\nfinancial leverage ratios, rearranging the ratios to solve for assets. Company Z has the greatest value of assets, with €11,000.\n(Choice A) Company X has the greatest value of assets if the assets are incorrectly calculated using the inverse of the financial leverage ratio\n(eg, total equity ÷ total assets).\n(Choice B) Company Y has the greatest value of assets if the equity is incorrectly calculated using the inverse of the long-term debt-to-equity\nratio (eg, total equity ÷ long-term debt).\nThings to remember:\nThe long-term debt-to-equity ratio (long-term debt ÷ total equity) measures long-term debt with respect to equity. The financial leverage ratio (total\nassets ÷ total equity) indicates the relationship of assets to owner's equity.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 69, "q": "An analyst gathers the following information: Selected Financial Statement Items Company Accounts X Y Z Cash 50 50 20 Marketable securities 20 100 120 Accounts receivable 80 40 50 Inventory 60 20 430 Unearned revenue 790 850 930 Accounts payable 220 350 130 Dividends payable 210 320 450 Taxes payable 110 250 540 Based on the cash ratio, the company least able to meet its short-term obligations is: ", "opts": ["Company X", "Company Y", "Company Z"], "ans": "A", "expl": "Liquidity ratios measure a company's ability to pay its short-term obligations. Among liquidity ratios, the cash ratio is considered the most\nconservative since it includes only items that are cash equivalents or marketable securities, which can both be quickly converted to cash. The\ncash ratio is the ratio of a company's total cash equivalents and marketable securities to its current liabilities.\nIn this scenario, the cash ratio of each company can be calculated as:\nCompany X Company Y Company Z\nCash 50 + 20 50 + 100 20 + 120\n+ Marketable securities = 70 = 150 = 140\nUnearned revenue\n+Accounts payable 790 + 220 + 850 + 350 + 930 + 130 +\n+ Dividends payable 210 + 110 320 + 250 450 + 540\n+Taxes payable = 1,330 = 1,770 = 2,050\n= Current liabilities\nCash ratio 70 / 1,330 ≈ 0.05 150 / 1,770 ≈ 0.08 140 / 2,050 ≈ 0.07\nCompany X has the lowest cash ratio. Therefore, of the three companies, Company X is least able to pay its short-term obligations.\nThings to remember:\nLiquidity ratios measure a company's ability to pay its short-term obligations. The cash ratio is the ratio of a company's total cash equivalents and\nmarketable securities to its
