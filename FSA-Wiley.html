current liabilities. It is considered the most conservative liquidity ratio since it includes only items that can be quickly\nconverted to cash.\nCalculate and interpret common-size balance sheets and related financial ratios\nCopyright©UWorld.CopyrightCFAInstitute.Allrightsreserved.\n20.A company reports under US GAAP. The company's common-size balance sheet for 20X6 and 20X5 is listed below:\nAssuming total assets remained the same from 20X5 to 20X6, which statement most accurately describes what occurred during 20X6?\nA. Working capital increased\n B. The company made an acquisition\nC. The financial leverage ratio decreased\nExplanation\nA common-size balance sheet reports all items on the balance sheet as a percentage of total assets. It is a useful tool for comparing\ncompanies of different sizes at a specific point in time.\nIn this instance, goodwill increased 5.3% on a year-over-year basis as a percentage of total assets. The only scenario for goodwill to increase\nwould be if the company had made an acquisition because goodwill revaluation or impairment reversals are not allowed under US GAAP.\n(Choice A) Working capital is the amount needed to support day-to-day business operations and is the difference between current assets and\ncurrent liabilities. The company's 20X6 working capital decreased to 28.4% (eg, 56.3 – 27.9) from 35.5% (eg, 59.4 – 23.9) in 20X5. Since the\namount of total assets remained constant and working capital as a percentage of assets decreased, the amount of working capital decreased.\n(Choice C) The financial leverage ratio increased in 20X6 to 1.92 (eg, 100 ÷ 52.1) from 1.85 in 20X5 (eg, 100 ÷ 54).\nThings to remember:\nA common-size approach is useful when comparing similar companies and can quickly identify material changes to a company's balance sheet\nwhen conducting company-specific, time-series analysis. In addition, acquisitions will be recorded in goodwill when the transaction is done above\nthe fair value of net assets.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 70, "q": "A company reports under US GAAP. The company's common-size balance sheet for 20X6 and 20X5 is listed below: Assuming total assets remained the same from 20X5 to 20X6, which statement most accurately describes what occurred during 20X6?", "opts": ["Working capital increased", "The company made an acquisition", "The financial leverage ratio decreased"], "ans": "B", "expl": "A common-size balance sheet reports all items on the balance sheet as a percentage of total assets. It is a useful tool for comparing\ncompanies of different sizes at a specific point in time.\nIn this instance, goodwill increased 5.3% on a year-over-year basis as a percentage of total assets. The only scenario for goodwill to increase\nwould be if the company had made an acquisition because goodwill revaluation or impairment reversals are not allowed under US GAAP.\n(Choice A) Working capital is the amount needed to support day-to-day business operations and is the difference between current assets and\ncurrent liabilities. The company's 20X6 working capital decreased to 28.4% (eg, 56.3 – 27.9) from 35.5% (eg, 59.4 – 23.9) in 20X5. Since the\namount of total assets remained constant and working capital as a percentage of assets decreased, the amount of working capital decreased.\n(Choice C) The financial leverage ratio increased in 20X6 to 1.92 (eg, 100 ÷ 52.1) from 1.85 in 20X5 (eg, 100 ÷ 54).\nThings to remember:\nA common-size approach is useful when comparing similar companies and can quickly identify material changes to a company's balance sheet\nwhen conducting company-specific, time-series analysis. In addition, acquisitions will be recorded in goodwill when the transaction is done above\nthe fair value of net assets.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 71, "q": "A company discloses its required depreciation expense for five years: 20X3–20X7 depreciation expense (in USD) 20X3 52,000 20X4 60,000 20X5 75,000 20X6 87,000 20X7 101,000 The company uses units of production to calculate depreciation expense. Based only on this data, the company most likely expects an increase in:", "opts": ["unit cost.", "net margin.", "units produced."], "ans": "C", "expl": "The units-of-production depreciation method expenses an asset's cost based on its use during each period. Depreciation expense is\ncalculated by multiplying the units produced each year by the depreciable unit cost, which is calculated as the asset's depreciable value (ie, initial\ncost less salvage value) divided by the total number of units expected to be produced over the asset's life.\nThe depreciable unit cost is constant since the asset's cost is known, and the salvage value and the total number of units expected to be produced\nare estimated at the beginning of the asset's life (Choice C). Therefore, the only variable that can change the depreciation expense will be the\nactual number of units produced. Using the units-of-production method, if the depreciation expense increases each year, the number of units\nproduced is also expected to grow.\n(Choice B) Net margin (ie, net profit margin) is a measure of profitability, and it increases only if profit increases or revenue decreases. In this\nscenario, although production and COGS are expected to grow, that does not suggest the net margin will increase.\nThings to remember:\nThe units-of-production depreciation method expenses an asset's cost based on its use during each period, measured by the number of units\nproduced. Depreciation expense is calculated by multiplying the units produced each year by the depreciable unit cost, which is constant. If\ndepreciation expense is expected to increase each year, the number of units produced is also expected to increase.\nExplain the financial reporting and disclosures related to intangible assets", "qhtml": null}, {"n": 72, "q": "An analyst gathers the following selected information for a company: (€ millions) 20X5 20X4 Cash 380 410 Marketable securities 210 230 Accounts receivable 490 205 Inventory 1,010 540 Total assets 5,300 4,450 Current liabilities 1,750 1,410 Common stock 420 140 Additional paid-in capital 1,760 1,700 Retained earnings 280 310 Treasury stock (50) (90) Based on only this information, which of the following ratios most likely suggests decreased financial risk in 20X5?", "opts": ["Cash ratio", "Current ratio", "Financial leverage ratio"], "ans": "B", "expl": "Balance sheet ratios include solvency and liquidity ratios. Liquidity ratios (eg, cash ratio, current ratio) measure a company's ability to meet short-\nterm obligations, and solvency ratios (eg, financial leverage ratio) measure a company's ability to meet long-term obligations. Both indicate a\ncompany's financial risk.\nIn this scenario:\nCurrent assets = Cash + Marketable securities + Accounts receivable + Inventory\nTotal equity = Common stock + Additional paid-in capital + Retained earnings + Treasury stock\nNote: Treasury stock is always presented as a negative number since it is a contra-equity account on the balance sheet.\nTherefore, the ratios for Years 20X4 and 20X5 are calculated as follows:\nSince a current ratio higher than the prior year's indicates the company is better able to meet its short-term obligations, the current ratio\nindicates lower financial risk in 20X5.\n(Choice A) A decrease in the cash ratio indicates increased financial risk since it suggests less ability to meet short-term obligations.\n(Choice C) An increase in the financial leverage ratio indicates increased financial risk since it suggests less ability to meet long-term obligations.\nThings to remember:\nBalance sheet ratios include solvency and liquidity ratios. Liquidity ratios (eg, cash ratio, current ratio) measure a company's ability to meet short-\nterm obligations, and solvency ratios (eg, financial leverage ratio) measure a company's ability to meet long-term obligations. Both indicate a\ncompany's financial risk.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 73, "q": "An analyst gathers the following information: Based on this information, and assuming there are no other current assets, the company with the largest quick ratio is most likely: ", "opts": ["Company X", "Company Y", "Company Z"], "ans": "A", "expl": "The quick ratio is a liquidity ratio that indicates a company's ability to pay its short-term obligations using its most liquid assets. It is the ratio of a\ncompany's current assets less inventory to its current liabilities. The items in the numerator are the current assets that can be quickly\nconverted to cash; therefore, inventory is excluded:\nCurrent assets − Inventory = Cash + Marketable securities + Accounts receivable\nIn this scenario, Company X has the largest quick ratio:\n(Choice B) Company Y has the largest current ratio [ie, (Current assets ÷ Current liabilities)].\n(Choice C) Company Z has the largest cash ratio [ie, (Cash + Marketable securities) ÷ Current liabilities].\nThings to remember:\nThe quick ratio is the ratio of a company's current assets less inventory to its current liabilities. It is a liquidity ratio that indicates a company's\nability to pay its short-term obligations using its most liquid assets; therefore, inventory is excluded.\nCalculate and interpret common-size balance sheets and related financial ratios", "qhtml": null}, {"n": 74, "q": "For the current year, a company reports the following information: £ millions Revenues 25 Cost of goods sold (COGS) 10 Beginning accounts receivable 30 Ending accounts receivable 18 The company had no investing or financing activities during this time. The amount of cash that it collected from customers is closest to:", "opts": ["£13 million", "£27 million", "£37 million"], "ans": "C", "expl": "Cash collected from customers in each accounting period is classified as cash from operations (CFO). Collections are calculated using\nrevenues (found on the income statement) and the change in accounts receivable (found on the balance sheet). When a company makes a\ncredit sale, accounts receivable increases by the amount of the sale. When customers pay, accounts receivable decreases, and cash increases,\nby the amount of payment.\nIf cash collected equals revenues, then the beginning and ending accounts receivable are identical. Any difference between beginning and\nending receivables results when cash collected differs from revenues. If cash collected exceeds revenues, then beginning accounts receivable is\ngreater than ending accounts receivable. The reverse is true if revenues are greater than cash collected.\nIn this question, revenues, beginning accounts receivable, and ending accounts receivable are all known. The calculations shown in the left table\nabove can be rearranged in the right table to solve for the unknown variable (cash collected).\n(Choice A) £13 million results from subtracting the change in accounts receivable from revenue rather than adding it.\n(Choice B) £27 million results from subtracting cost of goods sold from total revenues. Cost of goods sold impacts inventory, not changes in\naccounts receivable.\nThings to remember:\nCash from operations (CFO) can be derived from a company's revenue and the changes in its accounts receivable. There are two balance-sheet\nvariables (beginning and ending accounts receivable), one income-statement variable (revenues), and one cash-flow variable (CFO). Knowing\nany three allows the fourth to be derived by rearranging the calculations.\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 75, "q": "An accountant gathers the following information (in $ millions) from a company's financial statements. If all sales and purchases were made on credit, then based on this information, which of the following is the accountant's most appropriate conclusion?", "opts": ["Cash paid to suppliers is $41 million.", "Cash paid for employee wages is $67 million.", "Cash collected from customers is $152 million."], "ans": "B", "expl": "Cash flow from operating activities (CFO) can be presented using the indirect method (as shown in the question) or the direct method. The\nindirect method reconciles an accrual-based net income to CFO by adjusting net income for:\nnoncash items (eg, depreciation)\nnonoperating items (eg, gain/loss on sale of assets)\nchanges in working capital (eg, accounts receivable)\nIn contrast, the direct method (see example) groups types of cash transactions (eg, cash received from customers, cash paid to suppliers) with\neach line item representing an actual cash receipt or payment.\nTo derive the amounts on the direct statement, the accountant can adjust certain income statement items for changes in working capital.\nChanges in working capital can be derived from the information provided on the indirect statement.\nIn this scenario, wages payable (WP) provided a $3 million \"source\" of funds on the indirect statement, which implies that WP (a liability) increased\nby $3 million on the balance sheet. The company accrued a wage expense of $70 million for the period but WP increased by $3 million, so only\n$67 million in wages were paid for the period.\nThings to remember:\nThe direct method for presenting cash from operating activities groups cash transactions by source, with each line item representing an actual\ncash receipt or payment. To derive direct method cash flows from an indirect cash flow statement, income statement items are adjusted for the\nchanges to working capital shown on the indirect statement.\nDemonstrate the conversion of cash flows from the indirect to direct method", "qhtml": null}, {"n": 76, "q": "Assume an analyst knows only a company's earnings before interest and taxes. If the company reports under US GAAP and the analyst wanted to derive the company's cash from operations, which of the following would the analyst least likely need to consider?", "opts": ["Interest expense incurred during the period", "Temporary additions to cash from bank overdrafts", "Changes in accounts receivable realized for the period"], "ans": "B", "expl": "Examples of cash flow statement components\nCash from operations Cash generated from company's core operations\n(CFO) Interest paid on debt (US GAAP)\nPurchases and sales of PPE\nCash from investing\nPurchases and sales of other company's equity\n(CFI)\nand/or debt\nIssuance/repurchase of company's own equity and\nCash from financing\ndebt\n(CFF)\nDividends paid (US GAAP)\nCash from operations (CFO) refers to cash inflows or outflows related to day-to-day activities that create revenues for the company. These\nactivities include receiving cash from sales, as well as cash payments for items such as inventory, salaries, insurance, and rent. However, under\nUS GAAP, short-term bank loans that cover overdrafts on checking accounts are classified as cash from financing (CFF) rather than CFO.\nSales revenue comprises both cash and noncash (ie, credit) transactions. Credit sales reduce the amount of cash collected in a period, so the\nanalyst needs to know the change in accounts receivable for a period to derive CFO (Choice C).\nSimilarly, interest paid is a component of CFO. Since interest expense can consist of cash and accrual items, adjustments to interest expense are\nrequired to calculate both cash interest paid and CFO (Choice A).\nThings to remember:\nCash from operations includes inflows and outflows related to a company's generation of revenues. However, under US GAAP, short-term bank\nloans used to cover overdrafts are considered cash from financing rather than cash from operations.\nDescribe the steps in the preparation of direct and indirect cash flow statements, including how cash flows can be computed using income\nstatement and balance sheet data", "qhtml": null}, {"n": 77, "q": "A company reports the following data (in millions): Income statement Indirect cash flow statement Net sales $1,500 Net income $200 Cost of goods sold 800 Depreciation and amortization 150 Adjustments for changes to net working capital: Gross profit 700 Increase in inventory −10 Sales and wage expenses 250 Decrease in accounts receivable 20 Depreciation and amortization 150 Decrease in wages payable −15 Operating income 300 Decrease in accounts payable −5 Interest expense 50 Increase in interest payable 0 Tax expense 50 Increase in taxes payable 5 Net income 200 Cash from operating activities 345 Based on only this information, the cash paid to suppliers (in $ millions) reported on the company's cash flow statement in the direct format would be closest to:", "opts": ["785", "805", "815"], "ans": "C", "expl": "Components of direct cash flow statement\nCash received from customers Revenue − Δ accounts receivable\nCash paid to suppliers COGS + Δ inventory − Δ accounts payable\nCash paid to employees Wage expense − Δ wages payable\nCash paid for interest Interest expense − Δ interest payable\nCash paid for taxes Tax expense − Δ taxes payable\nNote: Δ reflects changes to balances, so signs may differ from indirect cash flow statement.\nCash flow from operating activities can be presented in a company's cash flow statement using either the direct or indirect method. The direct\nmethod displays cash inflows (eg, cash received from customers) and cash outflows (eg, cash paid to suppliers). An indirect cash flow\nstatement can be converted to the direct format by adjusting for the changes in working capital items found on the statement.\nTo solve this question, the sources and uses of cash on the indirect cash flow statement must be converted to changes of balances on the balance\nsheet, which are then used in the equations in the main image. On the indirect cash flow statement:\nA net negative cash flow from inventory indicates an increase (ie, a positive change) in inventory as purchases (ie, a use of cash)\nexceeded COGS. In this case, the change in inventory of −10 on the indirect cash flow statement indicates an increase in the inventory\nbalance on the balance sheet. This results in an increase to cash paid to suppliers of 10.\nA net negative cash flow from accounts payable indicates a decrease (ie, a negative change) in accounts payable as the company paid\nmore to suppliers (ie, a use of cash) than it purchased on credit (ie, a source of cash). In this case, a change of accounts payable of −5 is a\ndecrease in the accounts payable balance. This results in an increase to cash paid to suppliers of 5.\nNote: since inventories are an asset while accounts payable are a liability, their signs on the cash flow statement indicate different directions for\nthe change in cash.\nCash paid to suppliers = COGS + Δ inventory − Δ accounts payable\nCash paid to suppliers = 800 + 10 − (−5) = 815\nDemonstrate the conversion of cash flows from the indirect to direct method\n5. For the current year, a company recorded a RUB 2 million gain on sale of equipment and RUB 20 million in depreciation expense. The\ncompany also purchased new equipment for RUB 50 million that will not begin depreciating until next year. Additional information is provided:\nGiven the information above, and assuming that no other assets were sold, the cash received from the sale of equipment (in RUB millions) is\nclosest to:\n A. 12\nB. 22\nC. 32\nExplanation\nInvesting activities on the cash flow statement involve the purchase and sale of long-term assets (eg, equipment) and securities (other companies'\nstocks). When a company sells (disposes of) equipment, the cash received (ie, sales proceeds) is recorded as an inflow for investing activities.\nThe disposal may result in a gain or loss, which is the difference between the cash received and the equipment's net book value (historical book\nvalue less accumulated depreciation).\nIn this scenario, the company recorded a gain, meaning that the sales proceeds exceeded net book value. To calculate the sales proceeds, follow\nthe steps below:\nLong-term capital assets are presented on the balance sheet at net book value (gross value less accumulated depreciation). Understanding the\nrelationship between beginning net PPE and ending net PPE allows one to determine the amount of equipment disposed.\n(Choice B) 22 results from applying gross equipment amounts instead of net equipment amounts in the formula.\n(Choice C) 32 results from leaving out depreciation in the equation.\nThings to remember:\nWhen a company sells (disposes of) equipment, the sales proceeds are recorded as a cash inflow under investing activities. The disposal may\nresult in a gain or loss, which equals the difference between the cash received and the equipment's net book value (historical book value less\naccumulated depreciation).\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 78, "q": "For the current year, a company recorded a RUB 2 million gain on sale of equipment and RUB 20 million in depreciation expense. The company also purchased new equipment for RUB 50 million that will not begin depreciating until next year. Additional information is provided: Given the information above, and assuming that no other assets were sold, the cash received from the sale of equipment (in RUB millions) is closest to:", "opts": ["12", "22", "32"], "ans": "A", "expl": "Investing activities on the cash flow statement involve the purchase and sale of long-term assets (eg, equipment) and securities (other companies'\nstocks). When a company sells (disposes of) equipment, the cash received (ie, sales proceeds) is recorded as an inflow for investing activities.\nThe disposal may result in a gain or loss, which is the difference between the cash received and the equipment's net book value (historical book\nvalue less accumulated depreciation).\nIn this scenario, the company recorded a gain, meaning that the sales proceeds exceeded net book value. To calculate the sales proceeds, follow\nthe steps below:\nLong-term capital assets are presented on the balance sheet at net book value (gross value less accumulated depreciation). Understanding the\nrelationship between beginning net PPE and ending net PPE allows one to determine the amount of equipment disposed.\n(Choice B) 22 results from applying gross equipment amounts instead of net equipment amounts in the formula.\n(Choice C) 32 results from leaving out depreciation in the equation.\nThings to remember:\nWhen a company sells (disposes of) equipment, the sales proceeds are recorded as a cash inflow under investing activities. The disposal may\nresult in a gain or loss, which equals the difference between the cash received and the equipment's net book value (historical book value less\naccumulated depreciation).\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 79, "q": "A company receives cash of €55 million from the sale of equipment in 20X7. During that year, the company had depreciation expenses of €20 million and capital expenditures of €65 million; the capital expenditures were all used to purchase new equipment. The company reported the following balance sheet data: € millions 20X7 20X6 Gross cost of equipment 800 760 Accumulated depreciation (150) (140) Based on only this information, the gain on the sale of the equipment (in € millions) is closest to:", "opts": ["10", "30", "40"], "ans": "C", "expl": "When companies sell equipment, they report a noncash gain (loss) equal to the difference between the cash received from the sale and\ncurrent net book value (BV) of the equipment. When the net BV of the equipment sold is not provided, financial statement items can be used to\nestimate the cost.\nIn this scenario, to calculate the BV of the disposed equipment, use the relationship between the change in the equipment's net BV and factors\nthat account for that change: capital expenditures (ie, increases to BV) and depreciation expense and disposals of equipment (ie, decreases to\nBV). The net BV of the disposed equipment can be derived as follows:\nSince the cash received from the sale is 55, the gain from the sale is 40 (55 − 15).\nDescribe the steps in the preparation of direct and indirect cash flow statements, including how cash flows can be computed using income\nstatement and balance sheet data\n7. Using IFRS, a company reports the following in its year-end financial data:\nThe company sells its products and purchases its supplies only on credit. In 20X3, it paid, in cash, taxes of €350,000 and interest of €165,000,\nreported as an operating cash flow. There are no other cash receipts or expenditures. Using the direct method to determine operating cash flows,\nthe company's net cash flow provided by operating activities for 20X3 is closest to:\nA. €0\nB. €200,000\n\nC. €600,000\nExplanation\nNet cash provided by operating activities is the net amount of cash received from customers and paid to suppliers, lenders (ie, interest),\nemployees, and governments (ie, taxes). It is part of a company's cash flow statement and uses the direct method of reporting cash flow.\nCash received from customers is derived from credit sales and changes in accounts receivable (AR). All revenue is generated by extending credit\nto customers. During 20X3 the company received more cash from customers than it recorded as credit sales, since AR decreased by 200, from\n650 to 450. Cash received from customers is 1,000 + 650 - 450 = 1,200.\nCash paid to suppliers is calculated using cost of goods sold (COGS) and the changes in accounts payable (AP) and inventory (INV). AP\nincreased by 165, from 435 to 600, and INV declined by 300, from 800 to 500. Since AP increased, the company made more credit purchases\nthan it paid to its suppliers. A decline in INV implies that the company's credit purchases are less than its COGS. Cash paid to suppliers is 550 –\n(500 – 800) – (600 – 435) = 85.\nUsing the given cash payments for taxes (350) and interest (165), respectively, net cash provided by operating activities is €600,000.\nNote that under IFRS, cash paid for interest can be reported as a cash flow from either operations or financing.\n(Choice A) €0 is the result of mistakenly increasing the cash paid to suppliers since AP increased, not decreased.\n(Choice B) €200,000 is the result of incorrectly decreasing, not increasing, cash received from customers due to a decrease in accounts\nreceivable.\nThings to remember:\nNet cash provided by operating activities is the net amount of cash received from customers and paid to suppliers, lenders (ie, interest),\nemployees, and governments (ie, taxes). It is part of a company's cash flow statement and uses the direct method of reporting cash flow.\nDescribe the steps in the preparation of direct and indirect cash flow statements, including how cash flows can be computed using income\nstatement and balance sheet data\n8.A company reports the following information under US GAAP:\nIn 20X2, all dividends declared were paid to shareholders. Based on only the data above, if net income for 20X2 is USD 55 million, 20X2 cash\nflow from financing activities (in USD millions) is closest to:\nA. 60\n\nB. 65\nC. 85\nExplanation\nA company's cash flows from financing activities are related to obtaining or repaying capital. Such activities may include issuing or repurchasing\ncommon stock, paying dividends to shareholders, and borrowing or repaying debt. In this question, the net cash from financing activities\nincludes the proceeds from issuing common stock (a cash inflow) and the payment of dividends (a cash outflow).\nAs in most cases, the proceeds from issuing common stock are the total changes in common stock and additional paid-in capital. Dividend\npayments can be determined from the change to retained earnings, after accounting for net income.\nCash flow from financing activities is USD 65 million, including total proceeds from issuing common stock of 75 million less dividends paid of 10\nmillion.\n(Choice A) 60 million results from subtracting the increase in accumulated other comprehensive income (AOCI). AOCI mainly includes\nunrealized gains and losses from securities, which do not represent actual cash flows. Since cash flow from financing activities is prepared under\nthe direct method, only actual cash flows are included.\n(Choice C) 85 million results from incorrectly adding, instead of subtracting, dividends.\nThings to remember:\nA company's cash flows from financing activities are related to obtaining or repaying capital. Such activities may include issuing or repurchasing\ncommon stock, paying dividends to shareholders, and borrowing or repaying debt. In most cases, the proceeds from issuing common stock are\nthe total change in common stock and additional paid-in capital. Dividend payments can be determined from the change to retained earnings,\nafter accounting for net income.\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 80, "q": "Using IFRS, a company reports the following in its year-end financial data: The company sells its products and purchases its supplies only on credit. In 20X3, it paid, in cash, taxes of €350,000 and interest of €165,000, reported as an operating cash flow. There are no other cash receipts or expenditures. Using the direct method to determine operating cash flows, the company's net cash flow provided by operating activities for 20X3 is closest to:", "opts": ["€0", "€200,000", "€600,000"], "ans": "C", "expl": "Net cash provided by operating activities is the net amount of cash received from customers and paid to suppliers, lenders (ie, interest),\nemployees, and governments (ie, taxes). It is part of a company's cash flow statement and uses the direct method of reporting cash flow.\nCash received from customers is derived from credit sales and changes in accounts receivable (AR). All revenue is generated by extending credit\nto customers. During 20X3 the company received more cash from customers than it recorded as credit sales, since AR decreased by 200, from\n650 to 450. Cash received from customers is 1,000 + 650 - 450 = 1,200.\nCash paid to suppliers is calculated using cost of goods sold (COGS) and the changes in accounts payable (AP) and inventory (INV). AP\nincreased by 165, from 435 to 600, and INV declined by 300, from 800 to 500. Since AP increased, the company made more credit purchases\nthan it paid to its suppliers. A decline in INV implies that the company's credit purchases are less than its COGS. Cash paid to suppliers is 550 –\n(500 – 800) – (600 – 435) = 85.\nUsing the given cash payments for taxes (350) and interest (165), respectively, net cash provided by operating activities is €600,000.\nNote that under IFRS, cash paid for interest can be reported as a cash flow from either operations or financing.\n(Choice A) €0 is the result of mistakenly increasing the cash paid to suppliers since AP increased, not decreased.\n(Choice B) €200,000 is the result of incorrectly decreasing, not increasing, cash received from customers due to a decrease in accounts\nreceivable.\nThings to remember:\nNet cash provided by operating activities is the net amount of cash received from customers and paid to suppliers, lenders (ie, interest),\nemployees, and governments (ie, taxes). It is part of a company's cash flow statement and uses the direct method of reporting cash flow.\nDescribe the steps in the preparation of direct and indirect cash flow statements, including how cash flows can be computed using income\nstatement and balance sheet data\n8.A company reports the following information under US GAAP:\nIn 20X2, all dividends declared were paid to shareholders. Based on only the data above, if net income for 20X2 is USD 55 million, 20X2 cash\nflow from financing activities (in USD millions) is closest to:\nA. 60\n\nB. 65\nC. 85\nExplanation\nA company's cash flows from financing activities are related to obtaining or repaying capital. Such activities may include issuing or repurchasing\ncommon stock, paying dividends to shareholders, and borrowing or repaying debt. In this question, the net cash from financing activities\nincludes the proceeds from issuing common stock (a cash inflow) and the payment of dividends (a cash outflow).\nAs in most cases, the proceeds from issuing common stock are the total changes in common stock and additional paid-in capital. Dividend\npayments can be determined from the change to retained earnings, after accounting for net income.\nCash flow from financing activities is USD 65 million, including total proceeds from issuing common stock of 75 million less dividends paid of 10\nmillion.\n(Choice A) 60 million results from subtracting the increase in accumulated other comprehensive income (AOCI). AOCI mainly includes\nunrealized gains and losses from securities, which do not represent actual cash flows. Since cash flow from financing activities is prepared under\nthe direct method, only actual cash flows are included.\n(Choice C) 85 million results from incorrectly adding, instead of subtracting, dividends.\nThings to remember:\nA company's cash flows from financing activities are related to obtaining or repaying capital. Such activities may include issuing or repurchasing\ncommon stock, paying dividends to shareholders, and borrowing or repaying debt. In most cases, the proceeds from issuing common stock are\nthe total change in common stock and additional paid-in capital. Dividend payments can be determined from the change to retained earnings,\nafter accounting for net income.\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 81, "q": "A company reports the following information under US GAAP: In 20X2, all dividends declared were paid to shareholders. Based on only the data above, if net income for 20X2 is USD 55 million, 20X2 cash flow from financing activities (in USD millions) is closest to:", "opts": ["60", "65", "85"], "ans": "B", "expl": "A company's cash flows from financing activities are related to obtaining or repaying capital. Such activities may include issuing or repurchasing\ncommon stock, paying dividends to shareholders, and borrowing or repaying debt. In this question, the net cash from financing activities\nincludes the proceeds from issuing common stock (a cash inflow) and the payment of dividends (a cash outflow).\nAs in most cases, the proceeds from issuing common stock are the total changes in common stock and additional paid-in capital. Dividend\npayments can be determined from the change to retained earnings, after accounting for net income.\nCash flow from financing activities is USD 65 million, including total proceeds from issuing common stock of 75 million less dividends paid of 10\nmillion.\n(Choice A) 60 million results from subtracting the increase in accumulated other comprehensive income (AOCI). AOCI mainly includes\nunrealized gains and losses from securities, which do not represent actual cash flows. Since cash flow from financing activities is prepared under\nthe direct method, only actual cash flows are included.\n(Choice C) 85 million results from incorrectly adding, instead of subtracting, dividends.\nThings to remember:\nA company's cash flows from financing activities are related to obtaining or repaying capital. Such activities may include issuing or repurchasing\ncommon stock, paying dividends to shareholders, and borrowing or repaying debt. In most cases, the proceeds from issuing common stock are\nthe total change in common stock and additional paid-in capital. Dividend payments can be determined from the change to retained earnings,\nafter accounting for net income.\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 82, "q": "For the current period, a company reported SGD 5 million in interest expense and paid SGD 5.5 million of interest in cash. If the beginning interest payable balance was SGD 4.5 million, the ending interest payable balance for the current period is closest to: ", "opts": ["SGD 4 million.", "SGD 5 million.", "SGD 6 million."], "ans": "A", "expl": "Under accrual basis accounting, for any period, the recorded interest expense may differ from actual interest payments: Interest expense can\nbe fully recorded in one period while portions of it may be payable in a future period. Interest paid for a period is equal to the interest expense\nadjusted for the changes in interest payable, a current liability.\nIn this question, the company must have reduced its outstanding interest payable balance by 0.5 million for the period since it made interest\npayments of 5.5 million while incurring interest expense of only 5.0 million. Reducing the beginning interest payable balance of 4.5 million by 0.5\nmillion results in an ending interest payable balance of 4.0 million.\n(Choice B) SGD 5 million results from adding the 0.5 million to the beginning interest payable balance instead of subtracting it.\n(Choice C) SGD 6 million results from adding 0.5 million to interest payments of 5.5 million.\nThings to remember:\nUnder accrual basis accounting, for any period, the recorded interest expense may differ from actual interest payments. Interest paid for a period\nis equal to the interest expense adjusted for the changes in interest payable, a current liability.\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 83, "q": "Interest received may be classified as cash flow from investing under:", "opts": ["IFRS only.", "US GAAP only.", "both IFRS and US GAAP."], "ans": "A", "expl": "Differences between US GAAP and IFRS for cash flow statement items\nUS GAAP IFRS\nInterest received Operating Operating or investing\nInterest paid Operating Operating or financing\nDividend received Operating Operating or investing\nDividend paid Financing Operating or financing\nTaxes paid Operating Typically operating, but specific portions can be classified as financing or investing\nUS GAAP and IFRS have different rules for how interest received and interest paid are reported on a company's statement of cash flows.\nFor interest received by the company:\nUS GAAP classify it as an operating cash flow.\nIFRS classify it as either an operating or investing cash flow.\nFor interest paid by the company:\nUS GAAP classify it as an operating cash flow.\nIFRS classify it as an operating or financing cash flow.\nIFRS usually grant companies more flexibility in the classification of certain activities. In this scenario, IFRS allows the company to treat interest\nreceived as a cash flow from investing activities.\n(Choices B and C) US GAAP classify interest received as operating cash flow only.\nThings to remember:\nUS GAAP and IFRS have different rules for how interest received and interest paid are reported on a company's statement of cash flows. US\nGAAP classify interest received as an operating cash flow, whereas IFRS classify it as an operating or investing cash flow. US GAAP classify\ninterest paid as an operating cash flow, whereas IFRS classify it as an operating or financing cash flow.\nContrast cash flow statements prepared under International Financial Reporting Standards (IFRS) and US generally accepted accounting\nprinciples (US GAAP)", "qhtml": null}, {"n": 84, "q": "In addition to and separate from its core operations, a global food distributor rents out office complexes that it owns. Last year the company paid total taxes of €15 million, including €3 million in taxes on income from the rentals. Under IFRS, the company's income tax payments would most likely be classified on the company's statement of cash flows as cash flows from:", "opts": ["investing (CFI) and financing (CFF).", "operations (CFO) and investing (CFI).", "operations (CFO) and financing (CFF)."], "ans": "B", "expl": "Cash flow treatment of investment income taxes paid\nUS GAAP IFRS\nInvestment\nCFO CFO or CFI\nincome\nIncome CFO, but can treat taxes paid\nCFO\ntaxes on CFI income as CFI\nCash flow statements divide cash inflows and outflows into three categories: cash from operations (CFO), cash from investing (CFI), and cash\nfrom financing (CFF). CFO encompasses cash inflows and outflows related to a company's daily activities. In contrast, CFI refers to inflows and\noutflows from noncore activities, such as passive investments in other companies. There are no income tax implications for CFF.\nIn most cases, IFRS classify all taxes paid as CFO regardless of the underlying source of income. However, when a portion of the taxes can be\nspecifically identified as paid on investment income, IFRS permit (but do not require) the company to classify that portion of the taxes as CFI.\nThis company attributes €3 million of its total taxes paid to the rental income, which is not part of its core operations. The rents received constitute\nCFI, and the company may classify the taxes associated with those rents as CFI. The balance of the tax payment is classified as CFO.\n(Choices A and C) Financing activities that give rise to CFF entries include borrowing or repaying debt, issuing stock, and paying dividends.\nNone of the taxes paid relate to any type of financing activity, so none can be classified as CFF.\nThings to remember:\nIn most cases, all taxes paid are classified as CFO under IFRS. If the company can identify a portion of taxes as attributable to income that would\nbe classified as CFI, IFRS permit the company to classify those taxes as CFO or CFI.\nContrast cash flow statements prepared under International Financial Reporting Standards (IFRS) and US generally accepted accounting\nprinciples (US GAAP)", "qhtml": null}, {"n": 85, "q": "With respect to the cash flow statement, dividends paid can be most appropriately classified as an:", "opts": ["investing activity under IFRS.", "operating activity under IFRS.", "operating activity under US GAAP."], "ans": "B", "expl": "Difference between US GAAP and IFRS for cash flow statement items\nStatement item US GAAP IFRS\nInterest received Operating Operating or investing\nInterest paid Operating Operating or financing\nDividends received Operating Operating or investing\nDividends paid Financing Operating or financing\nTaxes paid Operating Typically operating (specific portions can be classified as financing or investing)\nUS GAAP and IFRS have different guidelines for how dividend receipts and dividend payments are reported on a company's statement of cash\nflows:\nDividends received by the company are classified as operating cash flows under US GAAP but as operating or investing cash flows\nunder IFRS.\nDividends paid by the company are classified as financing activities under US GAAP but as financing or operating cash flows under\nIFRS.\nIFRS commonly grant companies more reporting flexibility in the classification of certain activities. In this scenario, a company can report\ndividends paid under operating activities or financing activities under IFRS.\n(Choice A) Neither IFRS nor US GAAP allow companies to report dividends paid under investing activities.\n(Choice C) Under US GAAP, companies may report dividends paid only under financing activities.\nThings to remember:\nUS GAAP and IFRS have different rules for how dividend payments may be classified on the cash flow statement. US GAAP consider dividends\npaid as financing cash flows, whereas IFRS consider them financing or operating cash flows. IFRS commonly grant companies more reporting\nflexibility in the classification of certain activities.\nContrast cash flow statements prepared under International Financial Reporting Standards (IFRS) and US generally accepted accounting\nprinciples (US GAAP)", "qhtml": null}, {"n": 86, "q": "On its cash flow statement, a company classified its interest paid and interest received as operating activities and classified its dividends paid to shareholders as a financing activity. These classifications are most appropriate under which accounting standard?", "opts": ["Only IFRS", "Only US GAAP", "Either IFRS or US GAAP"], "ans": "C", "expl": "Differences between US GAAP and IFRS for cash flow statement items\nUS GAAP IFRS\nInterest received Operating Operating or investing\nInterest paid Operating Operating or financing\nDividend received Operating Operating or investing\nDividend paid Financing Operating or financing\nTaxes paid Operating Typically operating, but specific portions can be classified as financing or investing\nUS GAAP and IFRS have different rules for how certain financial items are classified on a company's statement of cash flows. In general, US\nGAAP has more stringent rules and IFRS allows more flexibility. For example, IFRS allows a choice of classification for interest and dividends\n(paid or received) and for taxes paid.\nIn this scenario, the company has classified its interest paid and interest received as operating activities and its dividends paid to shareholders as\na financing activity. These classifications are allowed under both US GAAP and IFRS (Choices A and B).\nThings to remember:\nUS GAAP and IFRS have different rules for how certain financial items are reported on a company's statement of cash flows. In general, US\nGAAP has more stringent rules and IFRS allows more flexibility.\nContrast cash flow statements prepared under International Financial Reporting Standards (IFRS) and US generally accepted accounting\nprinciples (US GAAP)", "qhtml": null}, {"n": 87, "q": "An accountant wants to report cash from operating activities by using the data below: If the accountant accurately prepares the cash flow statement under the direct format, then it most likely reports:", "opts": ["cash paid to employees 71; cash paid for interest 5.", "cash paid to suppliers 82; cash paid to employees 69.", "cash received from customers 198; cash paid for taxes 9."], "ans": "C", "expl": "Cash flow from operating activities (CFO) can be presented using either the direct or indirect method. The direct format displays various\ncategories of cash transactions (eg, cash received from customers, cash paid to suppliers). To create a direct presentation, the accountant\nshould:\n1. Remove noncash items from the income statement.\n2. Convert the remaining income statement revenue and expense items to cash amounts (from accrual amounts) by adjusting for the change\nin working capital.\n3. Itemize the components of cash from operating activities with the amounts calculated in step 2.\nCash received from customers (198) equals revenue (200) minus the change in accounts receivable (2). Accounts receivable increased by 2\nmillion, so revenue exceeded cash receipts by that amount. Cash paid for taxes (9) equals tax expense (10) minus the change in taxes payable\n(1). Taxes payable increased by 1 million, so tax expense exceeded taxes paid by that amount.\n(Choice A) Cash paid to employees should be USD 69 million, not USD 71 million. USD 71 million results from incorrectly adding the increase in\nwages payable, instead of subtracting, to wage expense.\n(Choice B) Cash paid to suppliers should be USD 83 million, not USD 82 million. USD 82 million results from ignoring the increase in inventory,\nwhich understates the amount of purchases. Purchases equals COGS plus the change in inventory.\nThings to remember:\nTo derive the direct presentation format for cash from operating activities: (1) Remove non-cash items from the income statement, (2) convert the\nremaining income statement to a cash basis by adjusting for changes in working capital amounts, and (3) display the itemized individual\ncomponents in the operating cash flow section.\nDemonstrate the conversion of cash flows from the indirect to direct method", "qhtml": null}, {"n": 88, "q": "An analyst has obtained the following information for a company: Year-end December 31 € millions Revenues 41.8 Cost of goods sold (COGS) 36.5 Beginning inventory 31.2 Ending inventory 38.6 Beginning accounts payable 15.7 Cash paid to suppliers 16.1 The amount of the company's ending accounts payable is closest to:", "opts": ["€28.7 million", "€43.5 million", "€48.8 million"], "ans": "B", "expl": "The amount of cash payments to suppliers is a function of the company's cost of goods sold (COGS), the change in its inventories, and the\nchange in its accounts payable.\nInventory is a current asset, so purchasing inventory increases assets. If the company buys the inventory on credit instead of paying cash, an\naccount payable equal to the purchase price is created. The increase in liabilities exactly offsets the increase in assets, so the company has\nobtained inventory with no cash outlay.\nIn this question, the unknown variable is the ending accounts payable, which is solved by rearranging the above equation:\n(Choice A) This incorrect answer is obtained by subtracting, rather than adding, the change in inventory to COGS.\n(Choice C) This incorrect answer is found by using revenue instead of COGS as the first element of the equation. This is an easy mistake to\nmake since the formula for calculating cash received (rather than paid) in CFO uses revenue.\nThings to remember:\nCash paid to suppliers is a function of cost of goods sold, changes in inventory, and changes in accounts payable for the accounting period. The\nbasic formula to calculate cash payments can be rearranged to derive any variable in the equation.\nDescribe the steps in the preparation of direct and indirect cash flow statements, including how cash flows can be computed using income\nstatement and balance sheet data", "qhtml": null}, {"n": 89, "q": "A company reports the following information in its year-end financial statements: If all company purchases are made on credit, the cash paid to suppliers in 20X3 is closest to:", "opts": ["$540,000", "$660,000", "$1,260,000"], "ans": "B", "expl": "Cash paid to suppliers is one element of operating cash flow using the direct method. Companies track credit purchases and cash payments\nto vendors in accounts payable (AP). AP increases when credit purchases are recorded and decreases when the company pays its bills.\nPayments to suppliers during a period can be calculated if the change in AP, the change in inventory (INV), and COGS are known.\nHere, the increase in inventory (325 − 250 = 75) means purchases were greater than COGS. An increase (150 − 135 = 15) in AP indicates that\nthe company purchased more inventory on credit than it paid cash to suppliers during the same period. Cash paid to suppliers is $660,000.\n(Choice A) $540,000 results from decreasing, not increasing, cash paid to suppliers for the change in inventory and adding, not subtracting, it for\nthe increase in AP.\n(Choice C) $1,260,000 is found by using revenue, not COGS, in the cash paid to suppliers formula.\nThings to remember:\nCash paid to suppliers is one element of operating cash flow using the direct method. It is calculated from the change in accounts payable, the\nchange in inventory, and cost of goods sold.\nDescribe the steps in the preparation of direct and indirect cash flow statements, including how cash flows can be computed using income\nstatement and balance sheet data", "qhtml": null}, {"n": 90, "q": "For the most recent period, a company generated a net income of HKD 75 million and increased its dividends payable balance by HKD 5 million. Retained earnings showed a beginning balance of HKD 700 and an ending balance of HKD 755. If no other activities had an impact on retained earnings, the total of dividends paid during the period (in HKD millions) is closest to:", "opts": ["15", "20", "25"], "ans": "A", "expl": "Under accrual basis accounting, a company records all the dividends declared on its balance sheet for the current period, regardless of when all\nthe dividends will be paid. If a portion of the dividends is to be paid during a future period, that amount is recorded as dividends payable,\nwhich is a current liability.\nIn this question, HKD 20 million in dividends declared is derived from retained earnings and net income. Dividends payable increased by HKD 5\nmillion, indicating the company deferred HKD 5 million in dividend payments to a future period. Therefore, only HKD 15 million in dividends was\npaid out during the current period.\n(Choice B) 20 is the total for dividends declared, not dividends paid.\n(Choice C) 25 results from incorrectly adding, instead of subtracting, the increase in dividends payable.\nThings to remember:\nUnder accrual basis accounting, a company records all the dividends declared on its balance sheet for the current period, regardless of when all\nthe dividends will be paid. If a portion of the dividends is to be paid during a future period, that amount is recorded as dividends payable, which is\na current liability.\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 91, "q": "In its 20X8 balance sheet, a South African gold mining company reported beginning wages payable of ZAR 5.1 million and ending wages payable of ZAR 3.6 million. If its cash flow statement for the same period indicated cash wages paid of ZAR 25.6 million, the company's reported wage expense is closest to:", "opts": ["ZAR 24.1 million", "ZAR 25.6 million", "ZAR 27.1 million"], "ans": "A", "expl": "Under accrual accounting, a company incurs wage expense each period regardless of when wages are actually paid. If actual payment will occur\nin a later period, the obligation is entered as wages payable—a current liability—on the balance sheet. Wages paid are a component of cash flow\nfrom operations (CFO). Calculating CFO using the direct method requires analysis of both the expense and the current liability.\nCash paid to employees in any period is a function of wage expense and the change in wages payable for that period. Increasing wages payable\nmeans that the company is deferring cash payments until a later period, so the amount of cash paid in the current period decreases.\nSubtracting this increase from the reported wage expense results in cash paid for wages that is less than the wage expense.\nThis equation has four variables. When three of the four variables are known, the equation can be rearranged algebraically to solve for the\nunknown:\n(Choice B) ZAR 25.6 million uses only the wage expense without considering the change in wages payable.\n(Choice C) ZAR 27.1 million is the result of the change in wages payable being subtracted from—instead of added to—cash wages in the\nrearranged formula.\nThings to remember:\nCash wages paid equals the wage expense shown on the income statement minus the change in wages payable for the period.\nDescribe how the cash flow statement is linked to the income statement and the balance sheet", "qhtml": null}, {"n": 92, "q": "An analyst compiles the following common-sized cash flow statements as a percentage of revenue for a company: 20X4 20X5 Net income 9.0% 11.1% Depreciation and amortization 5.0% 6.7% Changes in operating assets and liabilities −5.5% −7.2% Cash flow from operations 8.5% 10.6% Purchase of equipment −5.0% −6.7% Cash flow from investing −5.0% −6.7% Issuance of debt 6.0% 2.2% Repayment of debt −6.0% −1.7% Dividend payments −1.5% −1.7% Cash flow from financing −1.5% −1.1% Net change in cash 2.0% 2.8% Cash paid for interest 2.5% 2.2% The company had total revenue of MXN 1,000 million in 20X4, MXN 900 million in 20X5, and a tax rate of 20% for both years. The analyst's most appropriate conclusion is that the company is:", "opts": ["increasing its free cash flow to equity.", "growing its dividend in line with net income.", "expanding its net investments in equipment."], "ans": "A", "expl": "Common-size cash flow statements display each statement item either as a percentage of revenue or as a percentage of the company's total\ncash inflows or outflows. This allows analysts to compare the receipts and expenditures for companies of different sizes or for one company\nover time.\nIn this scenario, the common-size cash flow statement indicates that the company's free cash flow to equity (FCFE) as a percentage of revenue\nincreased between 20X4 and 20X5:\nfrom 3.5% (= 9% + 5% − 5.5% − 5% + 6% − 6%) in 20X4\nto 4.4% (= 11.1% + 6.7% −7.2% − 6.7% + 2.2% − 1.7%) in 20X5.\nThis equates to FCFE of MXN 35 million in 20X4 (= 1,000 × 0.035) and MXN 40 million in 20X5 (= 900 × 0.044).\nNote: After-tax cash paid for interest is used in the calculation of free cash flow to the firm (FCFF), not FCFE.\nThings to remember:\nCommon-size cash flow statements can present each item on the cash flow statement as a percentage of revenue. They allow analysts to\ncompare the receipts and expenditures that contribute to cash generation for companies of different sizes or for one company over time.\nAnalyze and interpret both reported and common-size cash flow statements", "qhtml": null}, {"n": 93, "q": "A company reports the following information: Cash flow item KRW millions Net income 660 Depreciation and amortization expense −260 Interest expense −40 Working capital expenditures −120 Capital expenditures −200 Proceeds from long-term debt 535 Repayments of long-term debt −500 If the company has a 25% tax rate, which of the following cash flow measures is greatest?", "opts": ["Free cash flow", "Free cash flow to equity", "Free cash flow to the firm"], "ans": "B", "expl": "Free cash flow (FCF) determines how much excess cash a company generates from its operations after covering its capital expenditures.\nFCF may be used in various ways (eg, reinvesting in the company's business, paying dividends, repaying debt). An analyst can calculate this\ncash flow's value to the company's suppliers of debt and equity capital (ie, free cash flow to the firm [FCFF]) or to only equity shareholders (ie, free\ncash flow to equity [FCFE]) by adjusting for cash items available to those groups.\nFCFF adds back after-tax interest payments since it includes suppliers of debt capital, and interest payments are paid to the company's\ndebtholders. Since FCFE is available to a company's equity shareholders, it adds back the net borrowing (ie. net change in debt). Companies\nmay use any additions to debt for the benefit of equity shareholders through dividend payments or share repurchases.\nFCF = NI + NCC − ΔWC − ΔFC\n= 660 + 260 − 120 − 200 = 600\nFCFE = NI + NCC − ΔWC − ΔFC + Net borrowing\n= FCF + Net borrowing\n= 600 + (535 − 500) = 635\nFCFF = NI + NCC − ΔWC − ΔFC + Int (1 − t)\n= FCF + Int (1 − t)\n= 600 + 40 (1 − 0.25) = 630\nIn this scenario, the largest measure of FCF is the company's FCFE, which is supported by KRW 40 million in net borrowing (Choices A and C).\nThings to remember:\nFree cash flow determines how much excess cash a company generates after covering its capital expenditures. An analyst can calculate this\ncash flow's value to the company's suppliers of debt and equity capital or to only equity shareholders by adjusting for cash items available to those\ngroups.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios\n3.An analyst gathers the following data on a company:\nThe company's tax rate is 25% and current year's free cash flow to the firm (FCFF) is SGD 196 million. Based only on this information, free cash\nflow to equity (FCFE) for the current year is closest to:\n A. SGD 176 million.\nB. SGD 181 million.\nC. SGD 191 million.\nExplanation\nFree cash flow metrics are commonly used in asset valuation and financial analysis. Free cash flow to the firm (FCFF) is the cash flow available\nto debt and equity providers after subtracting operating expenses and investments in fixed and working capital. Free cash flow to equity (FCFE) is\nthe cash flow available to equity providers (shareholders), which is FCFF adjusted for interest payments and any changes in debt from principal\nreduction and/or new borrowing.\nSince FCFF (196) is given in this question, start with FCFF, subtract the after-tax cost of interest, and then subtract the reduction in debt principal\nto obtain FCFE.\n(Choice B) SGD 181 million results from not including change in debt in the equation.\n(Choice C) SGD 191 million results from not subtracting the after-tax interest expense.\nThings to remember:\nFree cash flow to equity (FCFE) is the cash flow available to equity providers (shareholders), which is the free cash flow to the firm (FCFF)\nadjusted for interest payments and any changes in debt from principal reduction and/or new borrowing.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 94, "q": "An analyst gathers the following data on a company: The company's tax rate is 25% and current year's free cash flow to the firm (FCFF) is SGD 196 million. Based only on this information, free cash flow to equity (FCFE) for the current year is closest to:", "opts": ["SGD 176 million.", "SGD 181 million.", "SGD 191 million."], "ans": "A", "expl": "Free cash flow metrics are commonly used in asset valuation and financial analysis. Free cash flow to the firm (FCFF) is the cash flow available\nto debt and equity providers after subtracting operating expenses and investments in fixed and working capital. Free cash flow to equity (FCFE) is\nthe cash flow available to equity providers (shareholders), which is FCFF adjusted for interest payments and any changes in debt from principal\nreduction and/or new borrowing.\nSince FCFF (196) is given in this question, start with FCFF, subtract the after-tax cost of interest, and then subtract the reduction in debt principal\nto obtain FCFE.\n(Choice B) SGD 181 million results from not including change in debt in the equation.\n(Choice C) SGD 191 million results from not subtracting the after-tax interest expense.\nThings to remember:\nFree cash flow to equity (FCFE) is the cash flow available to equity providers (shareholders), which is the free cash flow to the firm (FCFF)\nadjusted for interest payments and any changes in debt from principal reduction and/or new borrowing.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 95, "q": "An analyst has compiled the following information for a company's latest fiscal year: $ millions Net income 39.0 Depreciation 15.0 Interest expense 6.0 Tax expense 13.0 Pretax income 52.0 In the same period, the company also purchased machinery for $10 million. Cash from operations (CFO) for the period was $14.5 million. If the company reports under US GAAP, the free cash flow to the firm (FCFF) is closest to:", "opts": ["$4.5 million", "$9.0 million", "$29.0 million"], "ans": "B", "expl": "Free cash flow to the firm (FCFF) measures the cash available for the company's lenders and shareholders after the company has paid its\noperating expenses and made necessary investments in both long-term assets and working capital. The table below shows how to calculate\nFCFF:\nNot all variables are given in this question, so it is important to know how to use what is given to calculate the unknown quantities. For example,\ninterest expense is calculated on an after-tax basis, but when the tax rate is not provided it must be derived from dividing tax expense by pre-tax\nincome.\nAlso, the question provides no information on changes in short-term assets or short-term liabilities. However, such information is unnecessary if\ncash from operations (CFO) is known since changes in short-term assets and liabilities are used to calculate CFO. Similarly, noncash expenses\nare added back to net income to derive CFO, so the depreciation expense is irrelevant when CFO is known.\nWhen CFO is known, the above table simplifies to:\nInserting numbers results in:\n(Choice A) Although CFO encompasses interest expense, FCFF represents cash that is potentially available to lenders and shareholders. One\nassumption of FCFF is that neither lenders nor shareholders have priority in receiving available cash, so after-tax interest must be added back to\nCFO.\n(Choice C) This answer adds the long-term asset investment instead of subtracting it. FCFF is not the total cash that is available to the lenders\nand shareholders. Returning all its cash without making investments in machinery will eventually result in the firm's closure.\n5.This year, a company has\n£30 million in cash from operations (CFO),\n£6 million in after-tax interest expense that it treats as cash from financing (CFF),\n£2 million in interest received from other companies' bonds that it previously purchased, which it treats as cash from investing (CFI), and\n£15 million in capital expenditures.\nUnder IFRS, the company's free cash flow to the firm (FCFF) is closest to:\nA. £15 million\n\nB. £17 million\nC. £19 million\nExplanation\nFree cash flow to the firm (FCFF) is the cash available to a firm's providers of capital (eg, lenders and shareholders) after the firm has invested\nin long-term assets and working capital. When cash from operations (CFO) is known, the general formula for FCFF simplifies to the column on\nthe right in the above table.\nThis question presents an exception to the general rule concerning classification of interest and its impact on FCFF. Interest received or paid is\nnormally included as CFO. Firms reporting under IFRS may elect to treat interest paid as cash from financing (CFF). If the firm makes this\nelection, then after-tax interest expense is not added back to CFO, the after-tax interest expense of £6 million is not included in FCFF.\nFirms using IFRS may also elect to classify interest received as cash from investing (CFI). Cash interest received is available to the firm's\nlenders and shareholders and is added back to CFO if the firm elected to classify it as CFI. The £2 million interest received is included in FCFF,\nand the company's FCFF is £17 million as shown below:\n(Choice A) £15 million results from correctly omitting the interest paid from the FCFF calculation but fails to add the interest received.\n(Choice C) £19 million results comes from adding the after-tax interest expense to CFO. If the company elects to classify interest paid as CFF,\nthen after-tax interest is not added to CFO.\nThings to remember:\nA company reporting under IFRS may elect to classify interest paid as cash from financing (CFF) and interest received as cash from investing\n(CFI). For calculating free cash flow to the firm (FCFF), do not add interest expense if the company has elected to classify it as CFF. Add interest\nreceived if the company has elected to classify it as CFI.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 96, "q": "This year, a company has £30 million in cash from operations (CFO), £6 million in after-tax interest expense that it treats as cash from financing (CFF), £2 million in interest received from other companies' bonds that it previously purchased, which it treats as cash from investing (CFI), and £15 million in capital expenditures. Under IFRS, the company's free cash flow to the firm (FCFF) is closest to:", "opts": ["£15 million", "£17 million", "£19 million"], "ans": "B", "expl": "Free cash flow to the firm (FCFF) is the cash available to a firm's providers of capital (eg, lenders and shareholders) after the firm has invested\nin long-term assets and working capital. When cash from operations (CFO) is known, the general formula for FCFF simplifies to the column on\nthe right in the above table.\nThis question presents an exception to the general rule concerning classification of interest and its impact on FCFF. Interest received or paid is\nnormally included as CFO. Firms reporting under IFRS may elect to treat interest paid as cash from financing (CFF). If the firm makes this\nelection, then after-tax interest expense is not added back to CFO, the after-tax interest expense of £6 million is not included in FCFF.\nFirms using IFRS may also elect to classify interest received as cash from investing (CFI). Cash interest received is available to the firm's\nlenders and shareholders and is added back to CFO if the firm elected to classify it as CFI. The £2 million interest received is included in FCFF,\nand the company's FCFF is £17 million as shown below:\n(Choice A) £15 million results from correctly omitting the interest paid from the FCFF calculation but fails to add the interest received.\n(Choice C) £19 million results comes from adding the after-tax interest expense to CFO. If the company elects to classify interest paid as CFF,\nthen after-tax interest is not added to CFO.\nThings to remember:\nA company reporting under IFRS may elect to classify interest paid as cash from financing (CFF) and interest received as cash from investing\n(CFI). For calculating free cash flow to the firm (FCFF), do not add interest expense if the company has elected to classify it as CFF. Add interest\nreceived if the company has elected to classify it as CFI.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 97, "q": "A company reports the following information: MXN millions Prior Year Current Year Net income 550 600 Depreciation 75 90 Interest expense 100 100 Net working capital 200 220 Long-term debt 750 780 The company's tax rate is 30%. If capital expenditures for the year are MXN 300 million, then free cash flow to equity for the current year (in MXN millions) is closest to:", "opts": ["370", "400", "440"], "ans": "B", "expl": "Free cash flow to equity (FCFE) represents the remaining cash available to shareholders after making investments in working capital, fixed\ncapital (ie, property plant and equipment), and servicing debt. Companies may use FCFE to pay dividends to shareholders or buy back shares.\nIn this scenario, take the following steps:\nBegin with net income (600 million), an accrued figure that includes noncash components\nAdd back depreciation (90 million) since it is a noncash expense\nSubtract the investments in net working capital (20 million) (eg, accounts receivable, accounts payable, inventory) and fixed capital (300\nmillion) that are required to sustain operations\nAdd the change in net debt (an increase of 30 million) to reflect additional cash from net borrowing\nThis results in FCFE of MXN 400 million, which may be used to pay dividends to shareholders or to buy back shares.\n(Choice A) MXN 370 million results from failing to include changes to debt.\n(Choice C) MXN 440 million is the free cash flow to the firm (FCFF). The calculation for FCFF involves adding back after-tax interest expense\nand excluding changes to debt.\nThings to remember:\nFree cash flow to equity is the cash flow available to equity providers (ie, shareholders) after accounting for investments in fixed capital, working\ncapital, and changes in debt.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 98, "q": "An analyst has gathered the following information for a company's fiscal year 20X9: Based only on this information, under US GAAP, the company's interest coverage ratio is closest to:", "opts": ["3.6", "5.6", "5.9"], "ans": "B", "expl": "The interest coverage ratio, one of the tools used to determine a company's ability to service its debt, is a measure of firm solvency. It is\nusually calculated (using the income statement) as the ratio of EBIT to interest expense.\nWhen using a cash flow statement prepared under US GAAP, the interest coverage ratio is CFO plus back interest and taxes paid (similar to EBIT)\ndivided by interest paid. Adding back interest and taxes paid is necessary since net income (ie, net of interest and tax expense) is the starting\npoint for operating cash flow.\nUnder IFRS, if interest paid is classified as a financing activity, that portion of interest paid should not be added back to the numerator to determine\ninterest coverage.\n(Choice A) 3.6 times coverage is the result if interest paid is subtracted from the numerator.\n(Choice C) 5.9 times coverage is the result if all cash flow metrics (ie, CFO, cash flow from investing [CFI], cash flow from financing [CFF]) are\nincluded in the numerator.\nThings to remember:\nThe interest coverage ratio is calculated using the income or cash flow statement. When using a cash flow statement prepared under US GAAP,\nthe interest coverage ratio is CFO plus back interest and taxes paid divided by interest paid.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 99, "q": "A consultant gathers the following data on a company: If the company's tax rate is 20% and current year capital expenditures were BRL 60 million, then free cash flow to the firm (in BRL millions) for the current year is closest to:", "opts": ["540", "550", "560"], "ans": "B", "expl": "Free cash flow to the firm (FCFF) is the cash flow available to capital providers (ie, lenders and shareholders) after subtracting operating expenses\nand investments in fixed and working capital. FCFF is commonly used in asset valuation and financial analysis.\nTo calculate FCFF, start with net income, add depreciation and after-tax interest expense, and then subtract capital expenditures and investments\nin working capital.\n(Choice A) 540 is free cash flow to equity (FCFE). FCFE equals FCFF minus after-tax interest expense and change in debt.\n(Choice C) 560 results from not tax-adjusting the interest expense by one minus the tax rate. For FCFF purposes, the after-tax interest expense\nis added back to net income since borrowers benefit from a tax-shield.\nThings to remember:\nFree cash flow to the firm (FCFF) is the cash flow available to capital providers (lenders and shareholders) after subtracting operating expenses\nand investments in fixed and working capital. To calculate FCFF, start with net income, add depreciation and after-tax interest expense, and then\nsubtract capital expenditures and investments in working capital.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 100, "q": "An analyst reviews the following common-sized cash flow statement: Which of the following best describes the impact on net cash provided by operating activities? ", "opts": ["The increase in inventory decreases cash flow", "The decrease in accounts payable increases cash flow", "The decrease in accounts receivable decreases cash flow"], "ans": "A", "expl": "Common-sized cash flow statements may be reported as a percentage of net revenue. Increases in assets indicate a use of cash and are\nshown as negative numbers on a common-sized cash flow statement; decreases are shown as positive figures. In this question, inventory is\nincreasing, so it decreases cash flow and is shown as a negative percentage of net revenue. Increases in liabilities suggest a source of cash.\nIncreases in liabilities are shown as positive figures and decreases as negative figures on common-sized statements of cash flow.\n(Choice B) Accounts payable increases when a company purchases assets on credit and decreases as the company pays off those assets. It is\nthe increase, not the decrease, in accounts payable that increases cash flow.\n(Choice C) Accounts receivable increases when a company extends credit to customers and decreases when the company collects cash from\nthem. It is the increase, not the decrease, in accounts receivable that decreases cash flow.\nThings to remember:\nCommon-sized cash flow statements may be expressed as a percentage of net revenue. Increases in assets indicate a use of cash and are\npresented as negative figures. Increases in liabilities suggest a source of cash and are shown as positive figures.\nAnalyze and interpret both reported and common-size cash flow statements", "qhtml": null}, {"n": 101, "q": "An automotive parts company manufactures specialty engine pistons and presents its financial statements using US GAAP. Due to manufacturing improvements, it estimates that its inventory is worth less than its carrying value. The relevant per-unit information for 20X8 is shown below: If this company uses LIFO, the per-unit cost for its 20X8 ending inventory is closest to:", "opts": ["$90", "$93", "$100"], "ans": "B", "expl": "US GAAP require companies using LIFO to report inventory at the lower of cost or market value. US GAAP define market value as\nreplacement cost, subject to upper and lower limits. The upper limit is net realizable value (ie, the selling price less costs to complete and sell\nthe inventory). The lower limit is net realizable value minus a normal profit margin.\nThe company's original cost is $105 per unit, which is higher than the $90 replacement cost, so this company must write down its inventory to\nmarket value. \"Market value\" is a range defined by the upper limit of net realizable value ($100) (Choice C) and the lower limit of net realizable\nvalue minus a normal profit margin ($100 - $7 = $93). The actual replacement cost ($90) is less than the lower limit ($93), so the company can\nwrite down its inventory to only $93 per unit.\n(Choice A) This is the company's actual replacement cost, but since it is less than the GAAP-specified lower limit of net realizable value minus a\nprofit margin, the company cannot reduce the inventory value below the lower limit of $93 per unit.\nThings to remember:\nCompanies using LIFO must carry inventory at the lower of cost or market value. Market value equals replacement cost but is subject to an upper\nand lower limit defined as net realizable value and net realizable value minus a normal profit margin.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 102, "q": "In a period of increasing inventory costs, a company using FIFO instead of LIFO will most likely experience a lower:", "opts": ["current ratio.", "gross profit margin.", "inventory turnover ratio."], "ans": "C", "expl": "Changing inventory unit costs have different effects on a company's reported financials, depending on its inventory valuation method. With the\nFIFO method, the oldest units purchased are used in the calculation of cost of goods sold (COGS) whereas the most recent additions are used to\nvalue inventory. During periods of rising inventory costs, the most expensive units \"remain\" in inventory whereas the least expensive units are\nused for COGS. In comparison, a company using LIFO experiences a larger COGS and smaller inventory.\nA company's inventory turnover ratio measures its efficiency in managing its inventories. In periods of rising inventory costs, a company\nreporting with the FIFO method instead of LIFO will report lower COGS, which is the numerator of the inventory turnover ratio, and higher\ninventory, which is the denominator. Therefore, the company's inventory ratio will be lower using FIFO compared to LIFO.\n(Choice A) Current ratios are higher for companies reporting in FIFO during periods of rising inventory costs, since inventories are larger and\ncurrent liabilities are unchanged.\n(Choice B) Gross profit margins are higher for companies using FIFO during periods
