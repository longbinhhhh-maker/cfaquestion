<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Chester's new compensation plan for awarding bonuses to individual portfolio managers is consistent with CFA Institute Standards:", "opts": ["and does not require disclosure.", "only if fully disclosed to clients.", "but any bonuses awarded under the plan must be fully disclosed to clients."], "ans": "B", "expl": "Standard VI(A). The compensation plan is acceptable under Standard VI(A) Conflicts of Interest – Disclosure of Conflicts, but Chester must disclose the plan to clients. The firm's equity strategy is described as \"large cap core.\" The S&P 500 Index is an appropriate benchmark for such a strategy, but the incentive for portfolio managers is to invest outside the index in order to achieve excess returns. Managers may be motivated to invest in securities that would not be consistent with client objectives or risk profiles. For Further Reference: (Study Session 1, Module 2.9, LOS 2.a)", "explhtml": "<p>Standard VI(A). The compensation plan is acceptable under Standard VI(A) Conflicts of Interest – Disclosure of Conflicts, but Chester must disclose the plan to clients. The firm&#x27;s equity strategy is described as &quot;large cap core.&quot; The S&amp;P 500 Index is an appropriate benchmark for such a strategy, but the incentive for portfolio managers is to invest outside the index in order to achieve excess returns. Managers may be motivated to invest in securities that would not be consistent with client objectives or risk profiles.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.9, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<\/summary><div class=\"vig-body\"><p>Chester Brothers, LLC, is an investment management firm with $200 million in assets under management. Chester&#x27;s equity style is described to clients as a large-cap core strategy. One year ago, Chester instituted a new compensation plan for its equity portfolio managers. Under this new plan, each portfolio manager receives an annual bonus based upon that manager&#x27;s quarterly performance relative to the S&amp;P 500 Index. For each quarter of out-performance, the manager receives a bonus in the amount of 20% of his regular annual compensation. Chester has not disclosed this new plan to clients. Portfolio managers at Chester are not bound by non-compete agreements.<\/p><p>James Rogers, CFA, and Karen Pierce, CFA, are both portfolio managers affected by the new policy. Rogers out- performed the S&amp;P 500 Index in each of the last three quarters, largely because he began investing his clients&#x27; funds in small-cap securities. Chester has recently been citing Rogers&#x27;s performance in local media advertising, including claims that &quot;Chester&#x27;s star manager, James Rogers, has outperformed the S&amp;P 500 Index in each of the last three quarters.&quot; The print advertising associated with the media campaign includes a photograph of Rogers, identifying him as James Rogers, CFA. Below his name is a quote apparently attributable to Rogers saying &quot;as a CFA charterholder, I am committed to the highest ethical standards.&quot;<\/p><p>A few weeks after the advertising campaign began, Rogers was approached by the Grumpp Foundation, a local charitable endowment with $3 billion in assets, about serving on its investment advisory committee. The committee meets weekly to review the portfolio and make adjustments as needed. The Grumpp trustees were impressed by the favorable mention of Rogers in the marketing campaign. In making their offer, they even suggested that Rogers could mention his position on the advisory committee in future Chester marketing material. Rogers has not informed Chester about the Grumpp offer, but he has not yet accepted the position.<\/p><p>Pierce has not fared as well as Rogers. She also shifted into smaller-cap securities, but due to two extremely poor performing large-cap stocks, her performance lagged the S&amp;P 500 Index for the first three quarters. After an angry confrontation with her supervisor, Pierce resigned. When she left, Pierce took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Pierce soon accepted a position at a competing firm, Cheeri Group. On her first day at Cheeri, she contacted each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Chester to Cheeri. During both telephone conversations and emails with her former clients, Pierce mentioned that Chester had a new compensation program that created incentives for managers to shift into smaller-cap securities.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Chester&#x27;s new compensation plan for awarding bonuses to individual portfolio managers is consistent with CFA Institute Standards:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Assuming Rogers would like to accept the offer to serve on the Grumpp investment advisory committee, Rogers's obligations under the CFA Institute Standards require that he:", "opts": ["refuse to serve on the Grumpp committee.", "accept the Grumpp committee position only after disclosing the offer to his supervisor.", "accept the Grumpp committee position and disclose his acceptance as soon as possible to his supervisor."], "ans": "B", "expl": "Standard VI(A). Rogers first day at Cheeri, she contacted each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Chester to Cheeri. During both telephone conversations and emails with her former clients, Pierce mentioned that Chester had a new compensation program that created incentives for managers to shift into smaller-cap securities.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Assuming Rogers would like to accept the offer to serve on the Grumpp investment advisory committee, Rogers&#x27;s obligations under the CFA Institute Standards require that he:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Chester's advertising campaign includes claims about Rogers's investment performance, as well as Rogers's use and reference to the CFA charter. Is Chester's advertising campaign consistent with the CFA Institute Standards?", "opts": ["Chester’s performance claims are inconsistent with CFA Institute Standards, but his use and reference to the CFA designation is appropriate.", "Both the performance claim and the reference to the CFA charter are violations.", "Neither the performance claims nor the use and reference to the CFA designation are violations."], "ans": "A", "expl": "Standard III(D). Chester has violated Standard III(D) Duties to Clients – Performance Presentation. The claim in itself is acceptable. Rogers's superior performance has lasted only a short time, and the advertising does not suggest otherwise. However, the superior performance has been n angry confrontation with her supervisor, Pierce resigned. When she left, Pierce took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Pierce soon accepted a position at a competing firm, Cheeri Group. On her first day at Cheeri, she contacted each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Chester to Cheeri. During both telephone conversations and emails with her former clients, Pierce mentioned that Chester had a new compensation program that created incentives for managers to shift into smaller-cap securities.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Chester&#x27;s advertising campaign includes claims about Rogers&#x27;s investment performance, as well as Rogers&#x27;s use and reference to the CFA charter. Is Chester&#x27;s advertising campaign consistent with the CFA Institute Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Under the CFA Institute Standards, Pierce taking the computer model when leaving her position at Chester would be best described as a violation:", "opts": ["because she should have obtained written permission from her co-worker.", "unless she obtained permission from both her co-worker as well as from Chester.", "unless she obtained permission from Chester Brothers, LLC."], "ans": "C", "expl": "Standard IV(A). Pierce should not have r, James Rogers, has outperformed the S&amp;P 500 Index in each of the last three quarters.&quot; The print advertising associated with the media campaign includes a photograph of Rogers, identifying him as James Rogers, CFA. Below his name is a quote apparently attributable to Rogers saying &quot;as a CFA charterholder, I am committed to the highest ethical standards.&quot;<\/p><p>A few weeks after the advertising campaign began, Rogers was approached by the Grumpp Foundation, a local charitable endowment with $3 billion in assets, about serving on its investment advisory committee. The committee meets weekly to review the portfolio and make adjustments as needed. The Grumpp trustees were impressed by the favorable mention of Rogers in the marketing campaign. In making their offer, they even suggested that Rogers could mention his position on the advisory committee in future Chester marketing material. Rogers has not informed Chester about the Grumpp offer, but he has not yet accepted the position.<\/p><p>Pierce has not fared as well as Rogers. She also shifted into smaller-cap securities, but due to two extremely poor performing large-cap stocks, her performance lagged the S&amp;P 500 Index for the first three quarters. After an angry confrontation with her supervisor, Pierce resigned. When she left, Pierce took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Pierce soon accepted a position at a competing firm, Cheeri Group. On her first day at Cheeri, she contacted each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Chester to Cheeri. During both telephone conversations and emails with her former clients, Pierce mentioned that Chester had a new compensation program that created incentives for managers to shift into smaller-cap securities.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Under the CFA Institute Standards, Pierce taking the computer model when leaving her position at Chester would be best described as a violation:<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Pierce's behavior upon assuming her new position at Cheeri can best be described as violating CFA Institute Standards because she:", "opts": ["encouraged her former clients to leave Chester.", "should not have contacted her former clients at all.", "disclosed Chester’s new compensation program."], "ans": "C", "expl": "Standard IV(A). Pierce took no client records with her from Chester. It is reasonable to assume that she is using publicly available information to contact her former clients. So long as Pierce did not have a non-compete agreement, the standards do not preclude her from contacting former clients or encouraging them to move their accounts. The violation in this case was disclosing the new compensation plan. This plan should be disclosed to Chester's clients by Chester. Pierce does not have whistleblower status in this case because she stands to receive a personal gain by bringing her former clients to Cheeri. By disclosing the plan, Pierce has violated Standard IV(A) Duties to Employers – Loyalty by attempting to injure her former employer. Note that the compensation plan is not illegal; it is only a policy that should be disclosed. Had there been an illegal activity, Pierce might have had more justification as a whistleblower. For Further Reference: (Study Session 1, Module 2.7, LOS 2.a)", "explhtml": "<p>Standard IV(A). Pierce took no client records with her from Chester. It is reasonable to assume that she is using publicly available information to contact her former clients. So long as Pierce did not have a non-compete agreement, the standards do not preclude her from contacting former clients or encouraging them to move their accounts. The violation in this case was disclosing the new compensation plan. This plan should be disclosed to Chester&#x27;s clients by Chester. Pierce does not have whistleblower status in this case because she stands to receive a personal gain by bringing her former clients to Cheeri. By disclosing the plan, Pierce has violated Standard IV(A) Duties to Employers – Loyalty by attempting to injure her former employer. Note that the compensation plan is not illegal; it is only a policy that should be disclosed. Had there been an illegal activity, Pierce might have had more justification as a whistleblower.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.7, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chester Brothers, LLC, is an investment management firm with $200 million in assets under management. Chester&#x27;s equity style is described to clients as a large-cap core strategy. One year ago, Chester instituted a new compensation plan for its equity portfolio managers. Under this new plan, each portfolio manager receives an annual bonus based upon that manager&#x27;s quarterly performance relative to the S&amp;P 500 Index. For each quarter of out-performance, the manager receives a bonus in the amount of 20% of his regular annual compensation. Chester has not disclosed this new plan to clients. Portfolio managers at Chester are not bound by non-compete agreements.<\/p><p>James Rogers, CFA, and Karen Pierce, CFA, are both portfolio managers affected by the new policy. Rogers out- performed the S&amp;P 500 Index in each of the last three quarters, largely because he began investing his clients&#x27; funds in small-cap securities. Chester has recently been citing Rogers&#x27;s performance in local media advertising, including claims that &quot;Chester&#x27;s star manager, James Rogers, has outperformed the S&amp;P 500 Index in each of the last three quarters.&quot; The print advertising associated with the media campaign includes a photograph of Rogers, identifying him as James Rogers, CFA. Below his name is a quote apparently attributable to Rogers saying &quot;as a CFA charterholder, I am committed to the highest ethical standards.&quot;<\/p><p>A few weeks after the advertising campaign began, Rogers was approached by the Grumpp Foundation, a local charitable endowment with $3 billion in assets, about serving on its investment advisory committee. The committee meets weekly to review the portfolio and make adjustments as needed. The Grumpp trustees were impressed by the favorable mention of Rogers in the marketing campaign. In making their offer, they even suggested that Rogers could mention his position on the advisory committee in future Chester marketing material. Rogers has not informed Chester about the Grumpp offer, but he has not yet accepted the position.<\/p><p>Pierce has not fared as well as Rogers. She also shifted into smaller-cap securities, but due to two extremely poor performing large-cap stocks, her performance lagged the S&amp;P 500 Index for the first three quarters. After an angry confrontation with her supervisor, Pierce resigned. When she left, Pierce took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Pierce soon accepted a position at a competing firm, Cheeri Group. On her first day at Cheeri, she contacted each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Chester to Cheeri. During both telephone conversations and emails with her former clients, Pierce mentioned that Chester had a new compensation program that created incentives for managers to shift into smaller-cap securities.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Pierce&#x27;s behavior upon assuming her new position at Cheeri can best be described as violating CFA Institute Standards because she:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Cheeri's presentation of Pierce's investment performance is inconsistent with CFA Institute Standards because:", "opts": ["the results were not calculated under GIPS.", "performance from a previous employer should not be included.", "the results misrepresent Pierce’s large cap performance."], "ans": "C", "expl": "Standard III (D). The problem is that Pierce's performance over the past three quarters arose from large cap securities, not small cap securities. Excluding these results misrepresents her ability as a large cap manager. The Standards do not require compliance with GIPS, nor do they require that previous employer results be excluded. Stating results of a specific style, such as large cap, is acceptable if it is accurate. For Further Reference: (Study Session 1, Module 2.6, LOS 2.a)", "explhtml": "<p>Standard III (D). The problem is that Pierce&#x27;s performance over the past three quarters arose from large cap securities, not small cap securities. Excluding these results misrepresents her ability as a large cap manager. The Standards do not require compliance with GIPS, nor do they require that previous employer results be excluded. Stating results of a specific style, such as large cap, is acceptable if it is accurate.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.6, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chester Brothers, LLC, is an investment management firm with $200 million in assets under management. Chester&#x27;s equity style is described to clients as a large-cap core strategy. One year ago, Chester instituted a new compensation plan for its equity portfolio managers. Under this new plan, each portfolio manager receives an annual bonus based upon that manager&#x27;s quarterly performance relative to the S&amp;P 500 Index. For each quarter of out-performance, the manager receives a bonus in the amount of 20% of his regular annual compensation. Chester has not disclosed this new plan to clients. Portfolio managers at Chester are not bound by non-compete agreements.<\/p><p>James Rogers, CFA, and Karen Pierce, CFA, are both portfolio managers affected by the new policy. Rogers out- performed the S&amp;P 500 Index in each of the last three quarters, largely because he began investing his clients&#x27; funds in small-cap securities. Chester has recently been citing Rogers&#x27;s performance in local media advertising, including claims that &quot;Chester&#x27;s star manager, James Rogers, has outperformed the S&amp;P 500 Index in each of the last three quarters.&quot; The print advertising associated with the media campaign includes a photograph of Rogers, identifying him as James Rogers, CFA. Below his name is a quote apparently attributable to Rogers saying &quot;as a CFA charterholder, I am committed to the highest ethical standards.&quot;<\/p><p>A few weeks after the advertising campaign began, Rogers was approached by the Grumpp Foundation, a local charitable endowment with $3 billion in assets, about serving on its investment advisory committee. The committee meets weekly to review the portfolio and make adjustments as needed. The Grumpp trustees were impressed by the favorable mention of Rogers in the marketing campaign. In making their offer, they even suggested that Rogers could mention his position on the advisory committee in future Chester marketing material. Rogers has not informed Chester about the Grumpp offer, but he has not yet accepted the position.<\/p><p>Pierce has not fared as well as Rogers. She also shifted into smaller-cap securities, but due to two extremely poor performing large-cap stocks, her performance lagged the S&amp;P 500 Index for the first three quarters. After an angry confrontation with her supervisor, Pierce resigned. When she left, Pierce took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Pierce soon accepted a position at a competing firm, Cheeri Group. On her first day at Cheeri, she contacted each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Chester to Cheeri. During both telephone conversations and emails with her former clients, Pierce mentioned that Chester had a new compensation program that created incentives for managers to shift into smaller-cap securities.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Cheeri&#x27;s presentation of Pierce&#x27;s investment performance is inconsistent with CFA Institute Standards because:<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Using his multiple linear regression, Clark's sales forecast for 2019 is closest to:", "opts": ["–$191,914.", "$180,502.", "$192,090."], "ans": "A", "expl": "2019 sales forecast = 20.1 + 0.001 × 8,000 + 1,000.6 × 0.05 + 0.1 × 97 − 3.2 × 60,000 − 40.3 × 0.055 = –$191,914 For Further Reference: (Study Session 2, Module 5.2, LOS 5.e)", "explhtml": "<p>2019 sales forecast = 20.1 + 0.001 × 8,000 + 1,000.6 × 0.05 + 0.1 × 97 − 3.2 × 60,000 − 40.3 × 0.055 = –$191,914<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.2, LOS 5.e)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Austin Clark, CFA, has been asked to analyze White Goods Corporation, a $9 billion company that owns a nationwide chain of stores selling appliances and other electronic goods. As part of his analysis of the White Goods Corporation, Clark&#x27;s supervisor, David Horvath, asks Clark to forecast White Goods&#x27;s 2019 sales using multiple regression analysis. The following model was developed:<\/p><div class=\"tbl\"><table><tr><td>sales<\/td><td>= 20.1<\/td><td>+ 0.001 GDP + 1,000.6 TR + 0.1 CC − 3.2 PC − 40.3 UR<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>t-values:<\/td><td>(1.1)<\/td><td>(2.3)<\/td><td>(1.75)<\/td><td>(3.2)<\/td><td>(–0.48)<\/td><td>(–0.9)<\/td><\/tr><\/table><\/div><p>Number of observations:<\/p><div class=\"tbl\"><table><tr><td>Standard error estimate:<\/td><td>15.67<\/td><td><\/td><\/tr><tr><td>Unadjusted R :<\/td><td>2<\/td><td>0.96<\/td><\/ alysis can be problematic if certain assumptions of the ordinary least squares framework are violated. The regression output for White Goods Corporation is unreliable for the following reasons:<\/p><p>Finding 1: The correlation between regression errors across time is very close to 1.<\/p><p>Finding 2: There is a strong relationship between the regression error variance and the regression independent variables.<\/p><\/div><\/details><div class=\"qtext\"><p>Using his multiple linear regression, Clark&#x27;s sales forecast for 2019 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "Is the regression coefficient of the 5-year U.S. Treasury interest rate statistically significantly different from zero at the 10% level of significance?", "opts": ["Yes, because 1.75 > 1.29.", "Yes, because 1.75 > 1.67.", "No, because 1.75 < 1.99."], "ans": "B", "expl": "Using a two-tail test at the 10% significance level, the critical value of the t-statistic equals 1.67 (degrees of freedom equal N − k − 1 = 76 − 5 − 1 = 70). The t-statistic (1.75) exceeds its critical value using a 10% significance level. For Further Reference: (Study Session 2, Module 5.2, LOS 5.c)", "explhtml": "<p>Using a two-tail test at the 10% significance level, the critical value of the t-statistic equals 1.67 (degrees of freedom equal N − k − 1 = 76 − 5 − 1 = 70). The t-statistic (1.75) exceeds its critical value using a 10% significance level.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.2, LOS 5.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Austin Clark, CFA, has been asked to analyze White Goods Corporation, a $9 billion company that owns a nationwide chain of stores selling appliances and other electronic goods. As part of his analysis of the White Goods Corporation, Clark&#x27;s supervisor, David Horvath, asks Clark to forecast White Goods&#x27;s 2019 sales using multiple regression analysis. The following model was developed:<\/p><div class=\"tbl\"><table><tr><td>sales<\/td><td>= 20.1<\/td><td>+ 0.001 GDP + 1,000.6 TR + 0.1 CC − 3.2 PC − 40.3 UR<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>t-values:<\/td><td>(1.1)<\/td><td>(2.3)<\/td><td>(1.75)<\/td><td>(3.2)<\/td><td>(–0.48)<\/td><td>(–0.9)<\/td><\/tr><\/table><\/div><p>Number of observations:<\/p><div class=\"tbl\"><table><tr><td>Standard error estimate:<\/td><td>15.67<\/td><td><\/td><\/tr><tr><td>Unadjusted R :<\/td><td>2<\/td><td>0.96<\/td><\/tr><\/table><\/div><p>Regression sum of squares: 412,522<\/p><div class=\"tbl\"><table><tr><td>Error sum of squares:<\/td><td>17,188<\/td><\/tr><\/table><\/div><p>Independent Variable Descriptions<\/p><p>GDP = gross domestic product<\/p><div class=\"tbl\"><table><tr><td>TR<\/td><td>= average rate on 5-year U.S. Treasury securities<\/td><\/tr><tr><td>CC<\/td><td>= most recent quarter end consumer confidence index value<\/td><\/tr><tr><td>PC<\/td><td>= previous year&#x27;s sales of personal computers<\/td><\/tr><tr><td>UR<\/td><td>= most recent quarter end unemployment rate<\/td><\/tr><\/table><\/div><p>Variable Estimates for 2019<\/p><p>GDP = 8,000<\/p><div class=\"tbl\"><table><tr><td>TR<\/td><td>= 0.05<\/td><\/tr><tr><td>CC<\/td><td>= 97<\/td><\/tr><tr><td>PC<\/td><td>= 60,000<\/td><\/tr><tr><td>UR<\/td><td>= 0.055<\/td><\/tr><\/table><\/div><p>Critical Values For Student&#x27;s t-Distribution<\/p><p>Level of Significance for One-Tailed Test<\/p><div class=\"tbl\"><table><tr><td>10%<\/td><td>5%<\/td><td>2.5%<\/td><td>1%<\/td><td><\/td><\/tr><tr><td>Level of Significance for Two-Tailed Test<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Degrees of Freedom<\/td><td>20%<\/td><td>10%<\/td><td>5%<\/td><td>2%<\/td><\/tr><tr><td>5<\/td><td>1.476<\/td><td>2.015<\/td><td>2.571<\/td><td>3.365<\/td><\/tr><tr><td>15<\/td><td>1.341<\/td><td>1.753<\/td><td>2.131<\/td><td>2.602<\/td><\/tr><tr><td>25<\/td><td>1.316<\/td><td>1.708<\/td><td>2.060<\/td><td>2.485<\/td><\/tr><tr><td>50<\/td><td>1.299<\/td><td>1.676<\/td><td>2.009<\/td><td>2.403<\/td><\/tr><tr><td>60<\/td><td>1.296<\/td><td>1.671<\/td><td>2.000<\/td><td>2.390<\/td><\/tr><tr><td>70<\/td><td>1.294<\/td><td>1.667<\/td><td>1.994<\/td><td>2.381<\/td><\/tr><\/table><\/div><p>Clark&#x27;s supervisor asks him to prepare a report explaining the implications of the regression analysis results. Clark writes the following conclusions concerning regression analysis in his report: Interpreting the results of regression analysis can be problematic if certain assumptions of the ordinary least squares framework are violated. The regression output for White Goods Corporation is unreliable for the following reasons:<\/p><p>Finding 1: The correlation between regression errors across time is very close to 1.<\/p><p>Finding 2: There is a strong relationship between the regression error variance and the regression independent variables.<\/p><\/div><\/details><div class=\"qtext\"><p>Is the regression coefficient of the 5-year U.S. Treasury interest rate statistically significantly different from zero at the 10% level of significance?<\/p><\/div>", "subj": "quant"}, {"n": 9, "q": "In this multiple regression equation, a potential statistical issue is:", "opts": ["the coefficient of determination indicates a weak model.", "that sales cannot be statistically modeled.", "the PC variable is not a statistically significant variable."], "ans": "C", "expl": "As a general rule, any independent variable must have a t-statistic of 2 or more to be statistically significant. There is no indication that sales cannot be modeled. The main weakness in this model is the lack of significance of the PC variable. For Further Reference: (Study Session 2, Module 5.1, LOS 5.a)", "explhtml": "<p>As a general rule, any independent variable must have a t-statistic of 2 or more to be statistically significant. 0% and 50% in an associate is handled using the equity method. Under the equity method, the initial investment is recorded at cost and reported on the balance sheet as a noncurrent asset. Because the acquisition in this case is fully funded by cash, there will be no change to total assets for Hope. For Further Reference: (Study Session 5, Module 13.3, LOS 13.a)", "explhtml": "<p>The accounting for an ownership interest of between 20% and 50% in an associate is handled using the equity method. Under the equity method, the initial investment is recorded at cost and reported on the balance sheet as a noncurrent asset. Because the acquisition in this case is fully funded by cash, there will be no change to total assets for Hope.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.3, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Curtis Fox, an equity analyst for Altex Investments, is reviewing financial statements for Hope Manufacturing and Levitt Industries. Hope Manufacturing has recently stated its intention to acquire a 20% stake in Levitt Industries for $185 million cash. Both companies are U.S. companies that follow U.S. GAAP.<\/p><p>Fox wants to consolidate his pro-forma financial statements for the two companies to see the effects of the proposed acquisition. Following are the most recent balance sheets and the pro-forma income statements developed by Fox before taking into account the acquisition.<\/p><p>Pre-Acquisition Balance Sheets (in million $) <\/p><div class=\"tbl\"><table><tr><td>December 31, 2010<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Current assets<\/td><td>13,900<\/td><td>716<\/td><\/tr><tr><td>PP&amp;E<\/td><td>26,977<\/td><td>108<\/td><\/tr><tr><td>Total assets<\/td><td>40,877<\/td><td>824<\/td><\/tr><tr><td>Current liabilities<\/td><td>10,363<\/td><td>220<\/td><\/tr><tr><td>Other liabilities<\/td><td>11,121<\/td><td>8<\/td><\/tr><tr><td>Common stock<\/td><td>6,127<\/td><td>108<\/td><\/tr><tr><td>Retained earnings<\/td><td>13,266<\/td><td>488<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>40,877<\/td><td>824<\/td><\/tr><\/table><\/div><p>Pro-Forma Income Statements (in million $) <\/p><div class=\"tbl\"><table><tr><td>for Year Ending December 31, 2011<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Revenue<\/td><td>66,176<\/td><td>2,176<\/td><\/tr><tr><td>Expenses<\/td><td>63,515<\/td><td>2,068<\/td><\/tr><tr><td>Net income<\/td><td>2,661<\/td><td>108<\/td><\/tr><tr><td>Dividends<\/td><td>1,525<\/td><td>0<\/td><\/tr><\/table><\/div><p>Fox is concerned about the effect that the choice of accounting method will have on the earnings and financial ratios of Hope. Fox consults with Jeffery Gordon, who tells him, &quot;Since Levitt is profitable and pays no dividends, the equity method will result in higher net income than the acquisition method. Additionally, the equity method will result in lower return on assets (ROA) than the acquisition method with partial goodwill.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming the acquisition goes through at the beginning of 2011, and that Hope will have a significant influence on Levitt, Hope&#x27;s total assets after acquisition would be closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 14, "q": "Fox estimates that the fair value of Levitt's PP&E is $250 million. The amount allocated to goodwill would be closest to:", "opts": ["$20.2 million.", "$37.4 million.", "$65.8 million."], "ans": "B", "expl": "Hope is acquiring a 20% stake in Levitt for $185 million. The pro-rata book value of Levitt's net assets is $119.20 million (= 0.2 × [$824 million − $220 million − $8 million]). The amount of excess purchase price that should be allocated to PP&E is $28.4 million (= 0.2 × [$250 million − $108 million]). Goodwill is then computed as: Purchase price: $185.0 million Less: pro-rata book value of net assets: $119.2 million Excess of purchase price: $65.8 million Less: excess allocated to PP&E: $28.4 million Goodwill: $37.4 million For Further Reference: (Study Session 5, Module 13.7, LOS 13.a)", "explhtml": "<p>Hope is acquiring a 20% stake in Levitt for $185 million. The pro-rata book value of Levitt&#x27;s net assets is $119.20 million (= 0.2 × [$824 million − $220 million − $8 million]). The amount of excess purchase price that should be allocated to PP&amp;E is $28.4 million (= 0.2 × [$250 million − $108 million]). Goodwill is then computed as:<\/p><div class=\"tbl\"><table><tr><td>Purchase price:<\/td><td>$185.0 million<\/td><\/tr><tr><td>Less: pro-rata book value of net assets:<\/td><td>$119.2 million<\/td><\/tr><tr><td>Excess of purchase price:<\/td><td>$65.8 million<\/td><\/tr><tr><td>Less: excess allocated to PP&amp;E:<\/td><td>$28.4 million<\/td><\/tr><tr><td>Goodwill:<\/td><td>$37.4 million<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.7, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Curtis Fox, an equity analyst for Altex Investments, is reviewing financial statements for Hope Manufacturing and Levitt Industries. Hope Manufacturing has recently stated its intention to acquire a 20% stake in Levitt Industries for $185 million cash. Both companies are U.S. companies that follow U.S. GAAP.<\/p><p>Fox wants to consolidate his pro-forma financial statements for the two companies to see the effects of the proposed acquisition. Following are the most recent balance sheets and the pro-forma income statements developed by Fox before taking into account the acquisition.<\/p><p>Pre-Acquisition Balance Sheets (in million $) <\/p><div class=\"tbl\"><table><tr><td>December 31, 2010<\/td><td>Hope<\/td><td>Levitt<\/td><\/ share of Levitt's net income is $21.6 million (= 0.2 × $108 million). Levitt's contribution to Hope's net income is then computed as: Hope's proportionate share of Levitt's net income: $21.6 million Less: additional depreciation expenses: $5.0 million Equity income: $16.6 million For Further Reference: (Study Session 5, Module 13.6, LOS 13.a)", "explhtml": "<p>Hope&#x27;s proportionate share of Levitt&#x27;s net income is $21.6 million (= 0.2 × $108 million). Levitt&#x27;s contribution to Hope&#x27;s net income is then computed as:<\/p><p>Hope&#x27;s proportionate share of Levitt&#x27;s net income: $21.6 million<\/p><div class=\"tbl\"><table><tr><td>Less: additional depreciation expenses:<\/td><td>$5.0 million<\/td><\/tr><tr><td>Equity income:<\/td><td>$16.6 million<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.6, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Curtis Fox, an equity analyst for Altex Investments, is reviewing financial statements for Hope Manufacturing and Levitt Industries. Hope Manufacturing has recently stated its intention to acquire a 20% stake in Levitt Industries for $185 million cash. Both companies are U.S. companies that follow U.S. GAAP.<\/p><p>Fox wants to consolidate his pro-forma financial statements for the two companies to see the effects of the proposed acquisition. Following are the most recent balance sheets and the pro-forma income statements developed by Fox before taking into account the acquisition.<\/p><p>Pre-Acquisition Balance Sheets (in million $) <\/p><div class=\"tbl\"><table><tr><td>December 31, 2010<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Current assets<\/td><td>13,900<\/td><td>716<\/td><\/tr><tr><td>PP&amp;E<\/td><td>26,977<\/td><td>108<\/td><\/tr><tr><td>Total assets<\/td><td>40,877<\/td><td>824<\/td><\/tr><tr><td>Current liabilities<\/td><td>10,363<\/td><td>220<\/td><\/tr><tr><td>Other liabilities<\/td><td>11,121<\/td><td>8<\/td><\/tr><tr><td>Common stock<\/td><td>6,127<\/td><td>108<\/td><\/tr><tr><td>Retained earnings<\/td><td>13,266<\/td><td>488<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>40,877<\/td><td>824<\/td><\/tr><\/table><\/div><p>Pro-Forma Income Statements (in million $) <\/p><div class=\"tbl\"><table><tr><td>for Year Ending December 31, 2011<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Revenue<\/td><td>66,176<\/td><td>2,176<\/td><\/tr><tr><td>Expenses<\/td><td>63,515<\/td><td>2,068<\/td><\/tr><tr><td>Net income<\/td><td>2,661<\/td><td>108<\/td><\/tr><tr><td>Dividends<\/td><td>1,525<\/td><td>0<\/td><\/tr><\/table><\/div><p>Fox is concerned about the effect that the choice of accounting method will have on the earnings and financial ratios of Hope. Fox consults with Jeffery Gordon, who tells him, &quot;Since Levitt is profitable and pays no dividends, the equity method will result in higher net income than the acquisition method. Additionally, the equity method will result in lower return on assets (ROA) than the acquisition method with partial goodwill.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that as a result of the acquisition, Hope must depreciate an additional $50 million (Hope&#x27;s share of the FMV adjustment) over a 10-year period to zero salvage value. Levitt&#x27;s contribution to Hope&#x27;s net income for 2011 is projected to be closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 16, "q": "For this question only, assume the acquisition occurs on December 31, 2010, and that there is no additional depreciation expense as a result of the acquisition. Compared to its beginning of year investment balance, the balance for Hope's investment in Levitt on December 31, 2011, will be:", "opts": ["lower.", "higher.", "unchanged."], "ans": "B", "expl": "No calculations are required to solve this problem. The increase/decrease to Hope's investment balance is equal to the investment balance at the beginning of year plus equity income less dividends paid. The equity income is positive because Levitt had positive net income, and there is no additional depreciation expense to subtract. Additionally, Levitt is not expected to make any dividend payments for 2011. Based on this, Hope's investment balance will increase. For Further Reference: (Study Session 5, Module 13.7, LOS 13.a)", "explhtml": "<p>No calculations are required to solve this problem. The increase/decrease to Hope&#x27;s investment balance is equal to the investment balance at the beginning of year plus equity income less dividends paid. The equity income is positive because Levitt had positive net income, and there is no additional depreciation expense to subtract. Additionally, Levitt is not expected to make any dividend payments for 2011. Based on this, Hope&#x27;s investment balance will increase.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.7, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Curtis Fox, an equity analyst for Altex Investments, is reviewing financial statements for Hope Manufacturing and Levitt Industries. Hope Manufacturing has recently stated its intention to acquire a 20% stake in Levitt Industries for $185 million cash. Both companies are U.S. companies that follow U.S. GAAP.<\/p><p>Fox wants to consolidate his pro-forma financial statements for the two companies to see the effects of the proposed acquisition. Following are the most recent balance sheets and the pro-forma income statements developed by Fox before taking into account the acquisition.<\/p><p>Pre-Acquisition Balance Sheets (in million $) <\/p><div class=\"tbl\"><table><tr><td>December 31, 2010<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Current assets<\/td><td>13,900<\/td><td>716<\/td><\/tr><tr><td>PP&amp;E<\/td><td>26,977<\/td><td>108<\/td><\/tr><tr><td>Total assets<\/td><td>40,877<\/td><td>824<\/td><\/tr><tr><td>Current liabilities<\/td><td>10,363<\/td><td>220<\/td><\/tr><tr><td>Other liabilities<\/td><td>11,121<\/td><td>8<\/td><\/tr><tr><td>Common stock<\/td><td>6,127<\/td><td>108<\/td><\/tr><tr><td>Retained earnings<\/td><td>13,266<\/td><td>488<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>40,877<\/td><td>824<\/td><\/tr><\/table><\/div><p>Pro-Forma Income Statements (in million $) <\/p><div class=\"tbl\"><table><tr><td>for Year Ending December 31, 2011<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Revenue<\/td><td>66,176<\/td><td>2,176<\/td><\/tr><tr><td>Expenses<\/td><td>63,515<\/td><td>2,068<\/td><\/tr><tr><td>Net income<\/td><td>2,661<\/td><td>108<\/td><\/tr><tr><td>Dividends<\/td><td>1,525<\/td><td>0<\/td><\/tr><\/table><\/div><p>Fox is concerned about the effect that the choice of accounting method will have on the earnings and financial ratios of Hope. Fox consults with Jeffery Gordon, who tells him, &quot;Since Levitt is profitable and pays no dividends, the equity method will result in higher net income than the acquisition method. Additionally, the equity method will result in lower return on assets (ROA) than the acquisition method with partial goodwill.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume the acquisition occurs on December 31, 2010, and that there is no additional depreciation expense as a result of the acquisition. Compared to its beginning of year investment balance, the balance for Hope&#x27;s investment in Levitt on December 31, 2011, will be:<\/p><\/div>", "subj": "fsa"}, {"n": 17, "q": "Is Gordon's statement regarding the effects of the choice of accounting method on net income and ROA correct?", "opts": ["Yes.", "No, he is incorrect regarding the effect on ROA.", "No, he is incorrect regarding the effect on net income and ROA."], "ans": "C", "expl": "Both the acquisition method and equity method will report the same net income. The acquisition method (under either partial or full goodwill) will report higher assets than the equity method and hence ROA would be lower under the acquisition method compared to under the equity method. For Further Reference: (Study Session 5, Module 13.9, LOS 13.c)", "explhtml": "<p>Both the acquisition method and equity method will report the same net income. The acquisition method (under either partial or full goodwill) will report higher assets than the equity method and hence ROA would be lower under the acquisition method compared to under the equity method.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.9, LOS 13.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Curtis Fox, an equity analyst for Altex Investments, is reviewing financial statements for Hope Manufacturing and Levitt Industries. Hope Manufacturing has recently stated its intention to acquire a 20% stake in Levitt Industries for $185 million cash. Both companies are U.S. companies that follow U.S. GAAP.<\/p><p>Fox wants to consolidate his pro-forma financial statements for the two companies to see the effects of the proposed acquisition. Following are the most recent balance sheets and the pro-forma income statements developed by Fox before taking into account the acquisition.<\/p><p>Pre-Acquisition Balance Sheets (in million $) <\/p><div class=\"tbl\"><table><tr><td>December 31, 2010<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Current assets<\/td><td>13,900<\/td><td>716<\/td><\/tr><tr><td>PP&amp;E<\/td><td>26,977<\/td><td>108<\/td><\/tr><tr><td>Total assets<\/td><td>40,877<\/td><td>824<\/td><\/tr><tr><td>Current liabilities<\/td><td>10,363<\/td><td>220<\/td><\/tr><tr><td>Other liabilities<\/td><td>11,121<\/td><td>8<\/td><\/tr><tr><td>Common stock<\/td><td>6,127<\/td><td>108<\/td><\/tr><tr><td>Retained earnings<\/td><td>13,266<\/td><td>488<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>40,877<\/td><td>824<\/td><\/tr><\/table><\/div><p>Pro-Forma Income Statements (in million $) <\/p><div class=\"tbl\"><table><tr><td>for Year Ending December 31, 2011<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Revenue<\/td><td>66,176<\/td><td>2,176<\/td><\/tr><tr><td>Expenses<\/td><td>63,515<\/td><td>2,068<\/td><\/tr><tr><td>Net income<\/td><td>2,661<\/td><td>108<\/td><\/tr><tr><td>Dividends<\/td><td>1,525<\/td><td>0<\/td><\/tr><\/table><\/div><p>Fox is concerned about the effect that the choice of accounting method will have on the earnings and financial ratios of Hope. Fox consults with Jeffery Gordon, who tells him, &quot;Since Levitt is profitable and pays no dividends, the equity method will result in higher net income than the acquisition method. Additionally, the equity method will result in lower return on assets (ROA) than the acquisition method with partial goodwill.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Is Gordon&#x27;s statement regarding the effects of the choice of accounting method on net income and ROA correct?<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "If Fox were to follow IFRS instead of U.S. GAAP, the accounting method prescribed for this type of investment would most likely be:", "opts": ["the equity method.", "the acquisition method.", "proportionate consolidation."], "ans": "A", "expl": "When the investment constitutes 20% to 50% of the associate, and the investor has significant influence on the associate, IFRS prescribes the equity method for accounting for the investment. For Further Reference: (Study Session 5, Module 13.1, LOS 13.b)", "explhtml": "<p>When the investment constitutes 20% to 50% of the associate, and the investor has significant influence on the associate, IFRS prescribes the equity method for accounting for the investment.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.1, LOS 13.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Curtis Fox, an equity analyst for Altex Investments, is reviewing financial statements for Hope Manufacturing and Levitt Industries. Hope Manufacturing has recently stated its intention to acquire a 20% stake in Levitt Industries for $185 million cash. Both companies are U.S. companies that follow U.S. GAAP.<\/p><p>Fox wants to consolidate his pro-forma financial statements for the two companies to see the effects of the proposed acquisition. Following are the most recent balance sheets and the pro-forma income statements developed by Fox before taking into account the acquisition.<\/p><p>Pre-Acquisition Balance Sheets (in million $) <\/p><div class=\"tbl\"><table><tr><td>December 31, 2010<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Current assets<\/td><td>13,900<\/td><td>716<\/td><\/tr><tr><td>PP&amp;E<\/td><td>26,977<\/td><td>108<\/td><\/tr><tr><td>Total assets<\/td><td>40,877<\/td><td>824<\/td><\/tr><tr><td>Current liabilities<\/td><td>10,363<\/td><td>220<\/td><\/tr><tr><td>Other liabilities<\/td><td>11,121<\/td><td>8<\/td><\/tr><tr><td>Common stock<\/td><td>6,127<\/td><td>108<\/td><\/tr><tr><td>Retained earnings<\/td><td>13,266<\/td><td>488<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>40,877<\/td><td>824<\/td><\/tr><\/table><\/div><p>Pro-Forma Income Statements (in million $) <\/p><div class=\"tbl\"><table><tr><td>for Year Ending December 31, 2011<\/td><td>Hope<\/td><td>Levitt<\/td><\/tr><tr><td>Revenue<\/td><td>66,176<\/td><td>2,176<\/td><\/tr><tr><td>Expenses<\/td><td>63,515<\/td><td>2,068<\/td><\/tr><tr><td>Net income<\/td><td>2,661<\/td><td>108<\/td><\/tr><tr><td>Dividends<\/td><td>1,525<\/td><td>0<\/td><\/tr><\/table><\/div><p>Fox is concerned about the effect that the choice of accounting method will have on the earnings and financial ratios of Hope. Fox consults with Jeffery Gordon, who tells him, &quot;Since Levitt is profitable and pays no dividends, the equity method will result in higher net income than the acquisition method. Additionally, the equity method will result in lower return on assets (ROA) than the acquisition method with partial goodwill.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>If Fox were to follow IFRS instead of U.S. GAAP, the accounting method prescribed for this type of investment would most likely be:<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "The strongest motivations for Fashion to acquire Flavoring would most likely be:", "opts": ["the potential to increase Fashion’s growth and market power.", "the potential to create synergies and increase market power.", "Fashion management’s incentives and diversification."], "ans": "C", "expl": "Management incentives are a key factor in light of Mr. Silver's desire to retire in three years and his interest in Flavoring management's capabilities to help guide the combined firm. Diversification is another key motivation because Flavoring's products are consumer based but serve a different market than Fashion's focus on consumer accessories. Because the companies have different product lines, synergies in the form of cost savings or revenue enhancement are unlikely to occur. In addition, the companies are in very different industries, making increased market power in either industry unlikely to occur as a result of the merger. For Further Reference: (Study Session 8, Module 23.1, LOS 23.b, 23.d)", "explhtml": "<p>Management incentives are a key factor in light of Mr. Silver&#x27;s desire to retire in three years and his interest in Flavoring management&#x27;s capabilities to help guide the combined firm. Diversification is another key motivation because Flavoring&#x27;s products are consumer based but serve a different market than Fashion&#x27;s focus on consumer accessories. Because the companies have different product lines, synergies in the form of cost savings or revenue enhancement are unlikely to occur. In addition, the companies are in very different industries, making increased market power in either industry unlikely to occur as a result of the merger.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.1, LOS 23.b, 23.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Fashion, Inc., is a major U.S. distributor of high-quality women&#x27;s jewelry and accessories. The company&#x27;s growth in recent years has been moderately above the industry average. However, competition is intensifying as a number of overseas competitors have entered this mature market. Although Fashion has been a publicly held company for many years, members of senior management and their families control 20% of the outstanding common stock. Martin Silver, the chief executive officer, has been under intense pressure from both internal and external large shareholders to find ways to increase the company&#x27;s future growth.<\/p><p>Silver has consulted with the company&#x27;s investment bankers concerning possible merger targets. The most promising merger target is Flavoring International, a distributor of a broad line of gourmet spices in the United States and numerous other countries. In recent years, Flavoring&#x27;s earnings growth rate has been above competitors&#x27; and also has exceeded Fashion&#x27;s experience. Superior income growth is projected to continue over at least the next five years. Silver is impressed with the appeal of the company&#x27;s products to upscale customers, its strong operating and financial performance, and Flavoring&#x27;s dynamic management team. He is contemplating retirement in three years and believes that Flavoring&#x27;s younger, more aggressive senior managers could boost the combined company&#x27;s growth through increasing Fashion&#x27;s operating efficiency and expanding Fashion&#x27;s product line in countries outside the United States. Alan Smith, who is Silver&#x27;s key contact at the investment banking firm, indicates that a key appeal of this merger to Flavoring would be Fashion&#x27;s greater financial flexibility and access to lower cost sources of financing for expansion of its products in new geographic areas. Fashion has a very attractive performance based stock option plan. Flavoring&#x27;s incentive plan is entirely based on cash compensation for achieving performance goals. Additionally, the 80% of Fashion&#x27;s stock not controlled by management interests is very widely held and trades actively. Flavoring became a publicly held company three years ago and doesn&#x27;t trade as actively.<\/p><p>Silver has asked Smith to prepare a report summarizing key points favoring the acquisition and an acceptable acquisition price. In preparing his report, Smith relies on the following financial data on Fashion, Flavoring, and four recently acquired food and beverage companies.<\/p><p><b>Exhibit 1: Financial and Market Data for Fashion, Inc., and Flavoring International<\/b><\/p><div class=\"tbl\"><table><tr><td>Financial/Price Data<\/td><td>Fashion<\/td><td>Flavoring<\/td><\/tr><tr><td>Sales<\/td><td>$400 million $105 million<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>$80 million<\/td><td>$22 million<\/td><\/tr><tr><td>Cash flow<\/td><td>$140 million<\/td><td>$42 million<\/td><\/tr><tr><td>Book value<\/td><td>$320 million<\/td><td>$72 million<\/td><\/tr><tr><td>Number of common shares outstanding<\/td><td>50 million<\/td><td>20 million<\/td><\/tr><tr><td>Current market price of common stock<\/td><td>$30.50<\/td><td>$20.00<\/td><\/tr><tr><td>Recent market price range<\/td><td>$34–26<\/td><td>$22–18<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Transaction Data for Food and Beverage Industry<\/b><\/p><div class=\"tbl\"><table><tr><td>Valuation Variables<\/td><td>Jones Foods Dale, Inc. Hill Brands Lane Co. Mean Multiple<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Acquisition stock price<\/td><td>$24<\/td><td>$32<\/td><td>$40<\/td><td>$46<\/td><td>—<\/td><\/tr><tr><td>Price/sales per share<\/td><td>5.0<\/td><td>3.7<\/td><td>4.0<\/td><td>3.8<\/td><td>4.13<\/td><\/tr><tr><td>Price/book value per share<\/td><td>6.9<\/td><td>5.5<\/td><td>5.8<\/td><td>5.6<\/td><td>5.95<\/td><\/tr><tr><td>Price/earnings per share<\/td><td>20.0<\/td><td>22.1<\/td><td>18.0<\/td><td>19.0<\/td><td>19.78<\/td><\/tr><tr><td>Price/cash flow per share<\/td><td>11.8<\/td><td>13.0<\/td><td>10.5<\/td><td>11.0<\/td><td>11.58<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The strongest motivations for Fashion to acquire Flavoring would most likely be:<\/p><\/div>", "subj": "corporate"}, {"n": 20, "q": "The least likely reason that Flavoring's management would favor an acquisition by Fashion would be:", "opts": ["Flavoring management’s incentives.", "opportunities to utilize Fashion’s larger financial resources to increase market share of both companies.", "opportunities to utilize Fashion’s financial resources to expand the combined company’s product line into the higher volume moderately priced market segment."], "ans": "C", "expl": "Opportunities to expand its products into different segments of the market for spices are not indicated in the vignette. Flavoring's management appears more interested in geographic expansion of its existing product line. For Further Reference: (Study Session 8, Module 23.1, LOS 23.b)", "explhtml": "<p>Opportunities to expand its products into different segments of the market for spices are not indicated in the vignette. Flavoring&#x27;s management appears more interested in geographic expansion of its existin
