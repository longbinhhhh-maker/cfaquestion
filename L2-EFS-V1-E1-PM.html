sulted with the company&#x27;s investment bankers concerning possible merger targets. The most promising merger target is Flavoring International, a distributor of a broad line of gourmet spices in the United States and numerous other countries. In recent years, Flavoring&#x27;s earnings growth rate has been above competitors&#x27; and also has exceeded Fashion&#x27;s experience. Superior income growth is projected to continue over at least the next five years. Silver is impressed with the appeal of the company&#x27;s products to upscale customers, its strong operating and financial performance, and Flavoring&#x27;s dynamic management team. He is contemplating retirement in three years and believes that Flavoring&#x27;s younger, more aggressive senior managers could boost the combined company&#x27;s growth through increasing Fashion&#x27;s operating efficiency and expanding Fashion&#x27;s product line in countries outside the United States. Alan Smith, who is Silver&#x27;s key contact at the investment banking firm, indicates that a key appeal of this merger to Flavoring would be Fashion&#x27;s greater financial flexibility and access to lower cost sources of financing for expansion of its products in new geographic areas. Fashion has a very attractive performance based stock option plan. Flavoring&#x27;s incentive plan is entirely based on cash compensation for achieving performance goals. Additionally, the 80% of Fashion&#x27;s stock not controlled by management interests is very widely held and trades actively. Flavoring became a publicly held company three years ago and doesn&#x27;t trade as actively.<\/p><p>Silver has asked Smith to prepare a report summarizing key points favoring the acquisition and an acceptable acquisition price. In preparing his report, Smith relies on the following financial data on Fashion, Flavoring, and four recently acquired food and beverage companies.<\/p><p><b>Exhibit 1: Financial and Market Data for Fashion, Inc., and Flavoring International<\/b><\/p><div class=\"tbl\"><table><tr><td>Financial/Price Data<\/td><td>Fashion<\/td><td>Flavoring<\/td><\/tr><tr><td>Sales<\/td><td>$400 million $105 million<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>$80 million<\/td><td>$22 million<\/td><\/tr><tr><td>Cash flow<\/td><td>$140 million<\/td><td>$42 million<\/td><\/tr><tr><td>Book value<\/td><td>$320 million<\/td><td>$72 million<\/td><\/tr><tr><td>Number of common shares outstanding<\/td><td>50 million<\/td><td>20 million<\/td><\/tr><tr><td>Current market price of common stock<\/td><td>$30.50<\/td><td>$20.00<\/td><\/tr><tr><td>Recent market price range<\/td><td>$34–26<\/td><td>$22–18<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Transaction Data for Food and Beverage Industry<\/b><\/p><div class=\"tbl\"><table><tr><td>Valuation Variables<\/td><td>Jones Foods Dale, Inc. Hill Brands Lane Co. Mean Multiple<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Acquisition stock price<\/td><td>$24<\/td><td>$32<\/td><td>$40<\/td><td>$46<\/td><td>—<\/td><\/tr><tr><td>Price/sales per share<\/td><td>5.0<\/td><td>3.7<\/td><td>4.0<\/td><td>3.8<\/td><td>4.13<\/td><\/tr><tr><td>Price/book value per share<\/td><td>6.9<\/td><td>5.5<\/td><td>5.8<\/td><td>5.6<\/td><td>5.95<\/td><\/tr><tr><td>Price/earnings per share<\/td><td>20.0<\/td><td>22.1<\/td><td>18.0<\/td><td>19.0<\/td><td>19.78<\/td><\/tr><tr><td>Price/cash flow per share<\/td><td>11.8<\/td><td>13.0<\/td><td>10.5<\/td><td>11.0<\/td><td>11.58<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on pre-acquisition prices of $20 for Jones Foods, $26 for Dale, Inc., $35 for Hill Brands, and $40 for Lane Co., the mean takeover premium for Flavoring would be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 24, "q": "To justify his use of the comparable transaction approach to establish a fair acquisition for Flavoring, Smith would like to conclude his report with the most important reason for choosing this approach. Which of the following rationales would Smith most likely use?", "opts": ["The fair acquisition price developed for Flavoring reflects a market based valuation approach, an advantage compared to discounted cash flow valuations, which are based on assumptions that do not incorporate market valuations.", "The acquisition prices for recently acquired companies provide a reasonable approximation of their realistic intrinsic values.", "The fair acquisition price developed for Flavoring is a realistic estimate of potential value to Fashion given that forecasts of future performance are unavailable."], "ans": "A", "expl": "This is a key reason to use the comparable value method, particularly when contrasted with the use of discounted cash flow valuations. Acquisition prices are not necessarily approximations of intrinsic values. A price developed based on comparable transactions does not always indicate the potential value of the acquisition to the purchaser. For Further Reference: (Study Session 8, Module 23.3, LOS 23.h)", "explhtml": "<p>This is a key reason to use the comparable value method, particularly when contrasted with the use of discounted cash flow valuations. Acquisition prices are not necessarily approximations of intrinsic values. A price developed based on comparable transactions does not always indicate the potential value of the acquisition to the purchaser.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.3, LOS 23.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Fashion, Inc., is a major U.S. distributor of high-quality women&#x27;s jewelry and accessories. The company&#x27;s growth in recent years has been moderately above the industry average. However, competition is intensifying as a number of overseas competitors have entered this mature market. Although Fashion has been a publicly held company for many years, members of senior management and their families control 20% of the outstanding common stock. Martin Silver, the chief executive officer, has been under intense pressure from both internal and external large shareholders to find ways to increase the company&#x27;s future growth.<\/p><p>Silver has consulted with the company&#x27;s investment bankers concerning possible merger targets. The most promising merger target is Flavoring International, a distributor of a broad line of gourmet spices in the United States and numerous other countries. In recent years, Flavoring&#x27;s earnings growth rate has been above competitors&#x27; and also has exceeded Fashion&#x27;s experience. Superior income growth is projected to continue over at least the next five years. Silver is impressed with the appeal of the company&#x27;s products to upscale customers, its strong operating and financial performance, and Flavoring&#x27;s dynamic management team. He is contemplating retirement in three years and believes that Flavoring&#x27;s younger, more aggressive senior managers could boost the combined company&#x27;s growth through increasing Fashion&#x27;s operating efficiency and expanding Fashion&#x27;s product line in countries outside the United States. Alan Smith, who is Silver&#x27;s key contact at the investment banking firm, indicates that a key appeal of this merger to Flavoring would be Fashion&#x27;s greater financial flexibility and access to lower cost sources of financing for expansion of its products in new geographic areas. Fashion has a very attractive performance based stock option plan. Flavoring&#x27;s incentive plan is entirely based on cash compensation for achieving performance goals. Additionally, the 80% of Fashion&#x27;s stock not controlled by management interests is very widely held and trades actively. Flavoring became a publicly held company three years ago and doesn&#x27;t trade as actively.<\/p><p>Silver has asked Smith to prepare a report summarizing key points favoring the acquisition and an acceptable acquisition price. In preparing his report, Smith relies on the following financial data on Fashion, Flavoring, and four recently acquired food and beverage companies.<\/p><p><b>Exhibit 1: Financial and Market Data for Fashion, Inc., and Flavoring International<\/b><\/p><div class=\"tbl\"><table><tr><td>Financial/Price Data<\/td><td>Fashion<\/td><td>Flavoring<\/td><\/tr><tr><td>Sales<\/td><td>$400 million $105 million<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>$80 million<\/td><td>$22 million<\/td><\/tr><tr><td>Cash flow<\/td><td>$140 million<\/td><td>$42 million<\/td><\/tr><tr><td>Book value<\/td><td>$320 million<\/td><td>$72 million<\/td><\/tr><tr><td>Number of common shares outstanding<\/td><td>50 million<\/td><td>20 million<\/td><\/tr><tr><td>Current market price of common stock<\/td><td>$30.50<\/td><td>$20.00<\/td><\/tr><tr><td>Recent market price range<\/td><td>$34–26<\/td><td>$22–18<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Transaction Data for Food and Beverage Industry<\/b><\/p><div class=\"tbl\"><table><tr><td>Valuation Variables<\/td><td>Jones Foods Dale, Inc. Hill Brands Lane Co. Mean Multiple<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Acquisition stock price<\/td><td>$24<\/td><td>$32<\/td><td>$40<\/td><td>$46<\/td><td>—<\/td><\/tr><tr><td>Price/sales per share<\/td><td>5.0<\/td><td>3.7<\/td><td>4.0<\/td><td>3.8<\/td><td>4.13<\/td><\/tr><tr><td>Price/book value per share<\/td><td>6.9<\/td><td>5.5<\/td><td>5.8<\/td><td>5.6<\/td><td>5.95<\/td><\/tr><tr><td>Price/earnings per share<\/td><td>20.0<\/td><td>22.1<\/td><td>18.0<\/td><td>19.0<\/td><td>19.78<\/td><\/tr><tr><td>Price/cash flow per share<\/td><td>11.8<\/td><td>13.0<\/td><td>10.5<\/td><td>11.0<\/td><td>11.58<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>To justify his use of the comparable transaction approach to establish a fair acquisition for Flavoring, Smith would like to conclude his report with the most important reason for choosing this approach. Which of the following rationales would Smith most likely use?<\/p><\/div>", "subj": "corporate"}, {"n": 25, "q": "Using the information in Exhibit 1, calculate X-Sport's weighted average cost of capital for the optimal capital structure.", "opts": ["7.46%.", "7.75%.", "8.76%."], "ans": "A", "expl": "Begin by calculating the capital structure of each plan and then multiply the percentage of debt and equity by their component costs and add the results to find the weighted average cost of capital (WACC). The plan with the lowest WACC maximizes the firm's stock price and thus reflects the optimal capital structure. In this case, Plan C meets all the criteria for optimizing X-Sport's capital structure. Plan C's debt-to-equity ratio is 1.22. Thus, there are 1.22 units of debt for every one unit of equity for a total of 2.22 units of capital. Therefore, the percentage of debt is 1.22 / 2.22 = 55%, leaving 45% equity. Thus, the WACC for Plan C is: (0.55 × 4.4%) + (0.45 × 11.2%) = 7.46%. Repeating these calculations for Plans A, B, and D, we find that the WACCs are 10.75%, 8.76%, and 7.75%, respectively. For Further Reference: (Study Session 7, Module 20.2, LOS 20.b)", "explhtml": "<p>Begin by calculating the capital structure of each plan and then multiply the percentage of debt and equity by their component costs and add the results to find the weighted average cost of capital (WACC). The plan with the lowest WACC maximizes the firm&#x27;s stock price and thus reflects the optimal capital structure. In this case, Plan C meets all the criteria for optimizing X-Sport&#x27;s capital structure. Plan C&#x27;s debt-to-equity ratio is 1.22. Thus, there are 1.22 units of debt for every one unit of equity for a total of 2.22 units of capital. Therefore, the percentage of debt is 1.22 / 2.22 = 55%, leaving 45% equity. Thus, the WACC for Plan C is: (0.55 × 4.4%) + (0.45 × 11.2%) = 7.46%.<\/p><p>Repeating these calculations for Plans A, B, and D, we find that the WACCs are 10.75%, 8.76%, and 7.75%, respectively.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 20.2, LOS 20.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>James Kelley is the CFO of X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Using both debt and equity, X-Sport has been acquiring small competitor companies rather rapidly over the past few years, leading Kelley to believe that the firm&#x27;s capital structure may have drifted from its optimal mix. Kelley has been asked by the board of directors to evaluate the situation and provide a presentation that includes details of the firm&#x27;s capital structure as well as a risk assessment. In order to assist with his analysis, Kelley has collected information on the current financial situation of X-Sport. He has also projected the financial information for alternative financing plans. This information is presented in Exhibit 1.<\/p><p><b>Exhibit 1: Selected X-Sport, Inc., Financing Plans<\/b><\/p><div class=\"tbl\"><table><tr><td>X-Sport, Inc.<\/td><td>Industry Average<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current Plan A Plan B Plan C Plan D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Debt/equity<\/td><td>1.50<\/td><td>2.33<\/td><td>1.86<\/td><td>1.22<\/td><td>0.82<\/td><td>1.27<\/td><\/tr><tr><td>K  (after-tax)<\/td><td>5.0%<\/td><td>8.5%<\/td><td>6.2%<\/td><td>4.4%<\/td><td>3.9%<\/td><td>5.9%<\/td><\/tr><\/table><\/div><p>d<\/p><div class=\"tbl\"><table><tr><td>K<\/td><td>12.0%<\/td><td>16.0%<\/td><td>13.5%<\/td><td>11.2%<\/td><td>10.9%<\/td><td>12.8%<\/td><\/tr><\/table><\/div><p>e<\/p><div class=\"tbl\"><table><tr><td>Expected EPS<\/td><td>$5.67<\/td><td>$6.00<\/td><td>$6.33<\/td><td>$5.47<\/td><td>$4.89<\/td><td>$6.31<\/td><\/tr><tr><td>Payout ratio<\/td><td>45%<\/td><td>42%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Growth rate<\/td><td>6.1%<\/td><td>5.9%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Stock price<\/td><td>$43<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>After carefully analyzing the data, Kelley writes his analysis and proposal and submits the report to Richard Haywood, the chairman and CEO of X-Sport. Excerpts from the analysis and proposal follow:<\/p><p>In selecting a refinancing plan, we must not push our leverage ratio too high. An overly aggressive leverage ratio will likely cause debt rating agencies to downgrade our debt rating from its current Baa rating, causing our cost of debt to rise dramatically. This effect is explained using the static trade-off capital structure theory, which states that if our debt usage becomes high enough, the marginal increase in the interest tax shield will be more than the marginal increase in the costs of financial distress. However, using some additional leverage will benefit the company by reducing the net agency costs of equity required to align the interests of X-Sport management with its shareholders. In the event that X-Sport decides to proceed with a recapitalization plan, I recommend Plan D because it is the most consistent with the shareholders&#x27; interests.<\/p><p>Haywood reviews the report and calls Kelley into his office to discuss the proposal. Haywood suggests that Plan B would be the most appropriate choice for adjusting X-Sport&#x27;s capital structure. Before Kelley can argue, however, the two are interrupted by a previously scheduled meeting with a supplier.<\/p><p>Haywood takes Kelley&#x27;s data and proposes to the board of directors that X-Sport pursue one of three alternatives to restructure the company. The first alternative is Plan B from Kelley&#x27;s analysis. The second alternative involves separating GearTech, one of the companies acquired over the last few years, from the rest of the company by issuing new GearTech shares to X-Sport common shareholders. The third alternative involves creating a new company, Euro-Sport, out of the firm&#x27;s European operations and selling 35% of the new Euro-Sport shares to the public while retaining 65% of the shares within X-Sport. After some persuading, Haywood convinces the 7-member board (two of whom were former executives at GearTech) to accept the second alternative, which he had favored from the beginning. The board puts together an announcement to its shareholders as well as the general public, detailing the terms and goals of the plan.<\/p><p>One of the board members, Michael Ponting, points out that there are several theories of optimal capital structure. Ponting makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Miller and Modigliani Proposition II (without taxes) states that cost of equity is not affected by<\/td><\/tr><tr><td>capital structure changes.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Pecking order theory states that debt financing is preferable to all equity financing.<\/td><\/tr><tr><td>Statement 3: <\/td><td>Static trade-off theory states that all firms have an optimal level of debt.<\/td><\/tr><\/table><\/div><p>A group of shareholders, upset about the board&#x27;s plan, submit a formal objection to X-Sport&#x27;s board as well as to the SEC. In the objection, the shareholders state that the independence of the board has been compromised to the detriment of the company and its shareholders. The objection also states that:<\/p><p>The value of X-Sport&#x27;s common stock has been impaired as a result of the poor corporate governance system. X-Sport&#x27;s management has violated stewardship codes. The executives in the supervisory board should ideally be the same as those in the management board.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1, calculate X-Sport&#x27;s weighted average cost of capital for the optimal capital structure.<\/p><\/div>", "subj": "corporate"}, {"n": 26, "q": "Determine whether Kelley's report is correct with regard to the statements made about the static trade-off theory of capital structure and the net agency costs of equity.", "opts": ["Kelley is only correct with respect to the static trade-off theory.", "Kelley is only correct with respect to the net agency cost of equity.", "Kelley is incorrect with respect to the static trade-off theory and the net agency cost of equity."], "ans": "B", "expl": "Kelley's report is incorrect regarding the static trade-off theory of capital structure, which states that a company should lever up to the point at which the additional increase in the costs of financial distress exceeds the additional increase in the tax shield from interest rate payments. Once this point is reached, adding more leverage to the company will decrease its value. Kelley's report is correct regarding the net agency costs of equity. Agency costs include equity holders' cost to monitor the firm's executives, management's bonding costs to assure owners that their best interests are guiding the company's actions, and residual losses that result even when sufficient monitoring and bonding exists. Adding additional debt reduces the agency costs to equity holders because less of their capital is at risk. The leverage effectively shifts some agency costs to bondholders. Additionally, managers have less cash to squander when higher leverage is employed because higher interest costs will restrict discretionary free cash flow. For Further Reference: (Study Session 7, Module 20.1, LOS 20.a)", "explhtml": "<p>Kelley&#x27;s report is incorrect regarding the static trade-off theory of capital structure, which states that a company should lever up to the point at which the additional increase in the costs of financial distress exceeds the additional increase in the tax shield from interest rate payments. Once this point is reached, adding more leverage to the company will decrease its value. Kelley&#x27;s report is correct regarding the net agency costs of equity. Agency costs include equity holders&#x27; cost to monitor the firm&#x27;s executives, management&#x27;s bonding costs to assure owners that their best interests are guiding the company&#x27;s actions, and residual losses that result even when sufficient monitoring and bonding exists. Adding additional debt reduces the agency costs to equity holders because less of their capital is at risk. The leverage effectively shifts some agency costs to bondholders. Additionally, managers have less cash to squander when higher leverage is employed because higher interest costs will restrict discretionary free cash flow.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 20.1, LOS 20.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Kelley is the CFO of X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Using both debt and equity, X-Sport has been acquiring small competitor companies rather rapidly over the past few years, leading Kelley to believe that the firm&#x27;s capital structure may have drifted from its optimal mix. Kelley has been asked by the board of directors to evaluate the situation and provide a presentation that includes details of the firm&#x27;s capital structure as well as a risk assessment. In order to assist with his analysis, Kelley has collected information on the current financial situation of X-Sport. He has also projected the financial information for alternative financing plans. This information is presented in Exhibit 1.<\/p><p><b>Exhibit 1: Selected X-Sport, Inc., Financing Plans<\/b><\/p><div class=\"tbl\"><table><tr><td>X-Sport, Inc.<\/td><td>Industry Average<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current Plan A Plan B Plan C Plan D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Debt/equity<\/td><td>1.50<\/td><td>2.33<\/td><td>1.86<\/td><td>1.22<\/td><td>0.82<\/td><td>1.27<\/td><\/tr><tr><td>K  (after-tax)<\/td><td>5.0%<\/td><td>8.5%<\/td><td>6.2%<\/td><td>4.4%<\/td><td>3.9%<\/td><td>5.9%<\/td><\/tr><\/table><\/div><p>d<\/p><div class=\"tbl\"><table><tr><td>K<\/td><td>12.0%<\/td><td>16.0%<\/td><td>13.5%<\/td><td>11.2%<\/td><td>10.9%<\/td><td>12.8%<\/td><\/tr><\/table><\/div><p>e<\/p><div class=\"tbl\"><table><tr><td>Expected EPS<\/td><td>$5.67<\/td><td>$6.00<\/td><td>$6.33<\/td><td>$5.47<\/td><td>$4.89<\/td><td>$6.31<\/td><\/tr><tr><td>Payout ratio<\/td><td>45%<\/td><td>42%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Growth rate<\/td><td>6.1%<\/td><td>5.9%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Stock price<\/td><td>$43<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>After carefully analyzing the data, Kelley writes his analysis and proposal and submits the report to Richard Haywood, the chairman and CEO of X-Sport. Excerpts from the analysis and proposal follow:<\/p><p>In selecting a refinancing plan, we must not push our leverage ratio too high. An overly aggressive leverage ratio will likely cause debt rating agencies to downgrade our debt rating from its current Baa rating, causing our cost of debt to rise dramatically. This effect is explained using the static trade-off capital structure theory, which states that if our debt usage becomes high enough, the marginal increase in the interest tax shield will be more than the marginal increase in the costs of financial distress. However, using some additional leverage will benefit the company by reducing the net agency costs of equity required to align the interests of X-Sport management with its shareholders. In the event that X-Sport decides to proceed with a recapitalization plan, I recommend Plan D because it is the most consistent with the shareholders&#x27; interests.<\/p><p>Haywood reviews the report and calls Kelley into his office to discuss the proposal. Haywood suggests that Plan B would be the most appropriate choice for adjusting X-Sport&#x27;s capital structure. Before Kelley can argue, however, the two are interrupted by a previously scheduled meeting with a supplier.<\/p><p>Haywood takes Kelley&#x27;s data and proposes to the board of directors that X-Sport pursue one of three alternatives to restructure the company. The first alternative is Plan B from Kelley&#x27;s analysis. The second alternative involves separating GearTech, one of the companies acquired over the last few years, from the rest of the company by issuing new GearTech shares to X-Sport common shareholders. The third alternative involves creating a new company, Euro-Sport, out of the firm&#x27;s European operations and selling 35% of the new Euro-Sport shares to the public while retaining 65% of the shares within X-Sport. After some persuading, Haywood convinces the 7-member board (two of whom were former executives at GearTech) to accept the second alternative, which he had favored from the beginning. The board puts together an announcement to its shareholders as well as the general public, detailing the terms and goals of the plan.<\/p><p>One of the board members, Michael Ponting, points out that there are several theories of optimal capital structure. Ponting makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Miller and Modigliani Proposition II (without taxes) states that cost of equity is not affected by<\/td><\/tr><tr><td>capital structure changes.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Pecking order theory states that debt financing is preferable to all equity financing.<\/td><\/tr><tr><td>Statement 3: <\/td><td>Static trade-off theory states that all firms have an optimal level of debt.<\/td><\/tr><\/table><\/div><p>A group of shareholders, upset about the board&#x27;s plan, submit a formal objection to X-Sport&#x27;s board as well as to the SEC. In the objection, the shareholders state that the independence of the board has been compromised to the detriment of the company and its shareholders. The objection also states that:<\/p><p>The value of X-Sport&#x27;s common stock has been impaired as a result of the poor corporate governance system. X-Sport&#x27;s management has violated stewardship codes. The executives in the supervisory board should ideally be the same as those in the management board.<\/p><\/div><\/details><div class=\"qtext\"><p>Determine whether Kelley&#x27;s report is correct with regard to the statements made about the static trade-off theory of capital structure and the net agency costs of equity.<\/p><\/div>", "subj": "corporate"}, {"n": 27, "q": "Which of the following best explains the difference between X-Sport's current cost of debt and the cost of debt associated with Plan A?", "opts": ["Decreased tax advantage with Plan A.", "Increased liquidity risk for Plan A bond purchasers.", "Increased probability of bankruptcy with Plan A."], "ans": "C", "expl": "The most likely difference in the cost of debt financing between the current level of 5.0% and the 8.5% for Plan A is that there is a greater probability of bankruptcy. Using the debt-to-equity ratio, we observe that Plan A calls for 2.33 / (2.33 + 1) = 70% debt financing, which is a very large proportion of the capital structure. The chances of bankruptcy are much greater with this heavy reliance on debt financing. For Further Reference: (Study Session 7, Module 20.2, LOS 20.a)", "explhtml": "<p>The most likely difference in the cost of debt financing between the current level of 5.0% and the 8.5% for Plan A is that there is a greater probability of bankruptcy. Using the debt-to-equity ratio, we observe that Plan A calls for 2.33 / (2.33 + 1) = 70% debt financing, which is a very large proportion of the capital structure. The chances of bankruptcy are much greater with this heavy reliance on debt financing.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 20.2, LOS 20.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Kelley is the CFO of X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Using both debt and equity, X-Sport has been acquiring small competitor companies rather rapidly over the past few years, leading Kelley to believe that the firm&#x27;s capital structure may have drifted from its optimal mix. Kelley has been asked by the board of directors to evaluate the situation and provide a presentation that includes details of the firm&#x27;s capital structure as well as a risk assessment. In order to assist with his analysis, Kelley has collected information on the current financial situation of X-Sport. He has also projected the financial information for alternative financing plans. This information is presented in Exhibit 1.<\/p><p><b>Exhibit 1: Selected X-Sport, Inc., Financing Plans<\/b><\/p><div class=\"tbl\"><table><tr><td>X-Sport, Inc.<\/td><td>Industry Average<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current Plan A Plan B Plan C Plan D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Debt/equity<\/td><td>1.50<\/td><td>2.33<\/td><td>1.86<\/td><td>1.22<\/td><td>0.82<\/td><td>1.27<\/td><\/tr><tr><td>K  (after-tax)<\/td><td>5.0%<\/td><td>8.5%<\/td><td>6.2%<\/td><td>4.4%<\/td><td>3.9%<\/td><td>5.9%<\/td><\/tr><\/table><\/div><p>d<\/p><div class=\"tbl\"><table><tr><td>K<\/td><td>12.0%<\/td><td>16.0%<\/td><td>13.5%<\/td><td>11.2%<\/td><td>10.9%<\/td><td>12.8%<\/td><\/tr><\/table><\/div><p>e<\/p><div class=\"tbl\"><table><tr><td>Expected EPS<\/td><td>$5.67<\/td><td>$6.00<\/td><td>$6.33<\/td><td>$5.47<\/td><td>$4.89<\/td><td>$6.31<\/td><\/tr><tr><td>Payout ratio<\/td><td>45%<\/td><td>42%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Growth rate<\/td><td>6.1%<\/td><td>5.9%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Stock price<\/td><td>$43<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>After carefully analyzing the data, Kelley writes his analysis and proposal and submits the report to Richard Haywood, the chairman and CEO of X-Sport. Excerpts from the analysis and proposal follow:<\/p><p>In selecting a refinancing plan, we must not push our leverage ratio too high. An overly aggressive leverage ratio will likely cause debt rating agencies to downgrade our debt rating from its current Baa rating, causing our cost of debt to rise dramatically. This effect is explained using the static trade-off capital structure theory, which states that if our debt usage becomes high enough, the marginal increase in the interest tax shield will be more than the marginal increase in the costs of financial distress. However, using some additional leverage will benefit the company by reducing the net agency costs of equity required to align the interests of X-Sport management with its shareholders. In the event that X-Sport decides to proceed with a recapitalization plan, I recommend Plan D because it is the most consistent with the shareholders&#x27; interests.<\/p><p>Haywood reviews the report and calls Kelley into his office to discuss the proposal. Haywood suggests that Plan B would be the most appropriate choice for adjusting X-Sport&#x27;s capital structure. Before Kelley can argue, however, the two are interrupted by a previously scheduled meeting with a supplier.<\/p><p>Haywood takes Kelley&#x27;s data and proposes to the board of directors that X-Sport pursue one of three alternatives to restructure the company. The first alternative is Plan B from Kelley&#x27;s analysis. The second alternative involves separating GearTech, one of the companies acquired over the last few years, from the rest of the company by issuing new GearTech shares to X-Sport common shareholders. The third alternative involves creating a new company, Euro-Sport, out of the firm&#x27;s European operations and selling 35% of the new Euro-Sport shares to the public while retaining 65% of the shares within X-Sport. After some persuading, Haywood convinces the 7-member board (two of whom were former executives at GearTech) to accept the second alternative, which he had favored from the beginning. The board puts together an announcement to its shareholders as well as the general public, detailing the terms and goals of the plan.<\/p><p>One of the board members, Michael Ponting, points out that there are several theories of optimal capital structure. Ponting makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Miller and Modigliani Proposition II (without taxes) states that cost of equity is not affected by<\/td><\/tr><tr><td>capital structure changes.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Pecking order theory states that debt financing is preferable to all equity financing.<\/td><\/tr><tr><td>Statement 3: <\/td><td>Static trade-off theory states that all firms have an optimal level of debt.<\/td><\/tr><\/table><\/div><p>A group of shareholders, upset about the board&#x27;s plan, submit a formal objection to X-Sport&#x27;s board as well as to the SEC. In the objection, the shareholders state that the independence of the board has been compromised to the detriment of the company and its shareholders. The objection also states that:<\/p><p>The value of X-Sport&#x27;s common stock has been impaired as a result of the poor corporate governance system. X-Sport&#x27;s management has violated stewardship codes. The executives in the supervisory board should ideally be the same as those in the management board.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best explains the difference between X-Sport&#x27;s current cost of debt and the cost of debt associated with Plan A?<\/p><\/div>", "subj": "corporate"}, {"n": 28, "q": "Which of the statements made by Ponting is correct?", "opts": ["Only Statement 1 is correct.", "Only Statement 2 is correct.", "Only Statement 3 is correct."], "ans": "C", "expl": "Miller and Modigliani Proposition II states that the cost of equity is a linear function of a company's debt/equity ratio. Pecking-order theory prefers internally generated equity (retained earnings) over new debt and new debt over new equity. Static trade-off theory states that the optimal level of debt is achieved when the extra cost of financial distress equals the tax benefit of debt. For Further Reference: (Study Session 7, Module 20.1, LOS 20.a)", "explhtml": "<p>Miller and Modigliani Proposition II states that the cost of equity is a linear function of a company&#x27;s debt/equity ratio. Pecking-order theory prefers internally generated equity (retained earnings) over new debt and new debt over new equity. Static trade-off theory states that the optimal level of debt is achieved when the extra cost of financial distress equals the tax benefit of debt.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 20.1, LOS 20.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Kelley is the CFO of X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Using both debt and equity, X-Sport has been acquiring small competitor companies rather rapidly over the past few years, leading Kelley to believe that the firm&#x27;s capital structure may have drifted from its optimal mix. Kelley has been asked by the board of directors to evaluate the situation and provide a pr ucture. Ponting makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Miller and Modigliani Proposition II (without taxes) states that cost of equity is not affected by<\/td><\/tr><tr><td>capital structure changes.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Pecking order theory states that debt financing is preferable to all equity financing.<\/td><\/tr><tr><td>Statement 3: <\/td><td>Static trade-off theory states that all firms have an optimal level of debt.<\/td><\/tr><\/table><\/div><p>A group of shareholders, upset about the board&#x27;s plan, submit a formal objection to X-Sport&#x27;s board as well as to the SEC. In the objection, the shareholders state that the independence of the board has been compromised to the detriment of the company and its shareholders. The objection also states that:<\/p><p>The value of X-Sport&#x27;s common stock has been impaired as a result of the poor corporate governance system. X-Sport&#x27;s management has violated stewardship codes. The executives in the supervisory board should ideally be the same as those in the management board.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements made by Ponting is correct?<\/p><\/div>", "subj": "corporate"}, {"n": 29, "q": "Which of the following statements with regard to the alternative plans proposed to X-Sport's board of directors by Haywood is correct?", "opts": ["The GearTech plan is an example of a spin-off transaction, while the Euro- Sport plan is an example of a carve-out transaction.", "The GearTech plan is an example of a carve-out transaction, while the Euro-Sport plan is an example of a spin-off transaction.", "Both the GearTech plan and the Euro-Sport plans are examples of spin-off transactions."], "ans": "A", "expl": "Spin-off transactions involve creating a new entity out of a company's business line or one of its subsidiaries and then granting shares in the new entity to the existing shareholders of the parent company. The shareholders are then free to sell their shares in the spin-off company in the marketplace. Spin-offs are generally viewed as a favorable sign in the market because they often result in greater efficiency for the spin-off company and the parent company. In a carve-out transaction, a new entity is created in a similar manner to the spin-off transaction. The main difference is that a minority of shares is sold to the public while the majority portion of the new shares are held by the parent company (they are not distributed to existing shareholders). For Further Reference: (Study Session 8, Module 23.4, LOS 23.n)", "explhtml": "<p>Spin-off transactions involve creating a new entity out of a company&#x27;s business line or one of its subsidiaries and then granting shares in the new entity to the existing shareholders of the parent company. The shareholders are then free to sell their shares in the spin-off company in the marketplace. Spin-offs are generally viewed as a favorable sign in the market because they often result in greater efficiency for the spin-off company and the parent company. In a carve-out transaction, a new entity is created in a similar manner to the spin-off transaction. The main difference is that a minority of shares is sold to the public while the majority portion of the new shares are held by the parent company (they are not distributed to existing shareholders).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.4, LOS 23.n)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Kelley is the CFO of X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Using both debt and equity, X-Sport has been acquiring small competitor companies rather rapidly over the past few years, leading Kelley to believe that the firm&#x27;s capital struc l likely cause debt rating agencies to downgrade our debt rating from its current Baa rating, causing our cost of debt to rise dramatically. This effect is explained using the static trade-off capital structure theory, which states that if our debt usage becomes high enough, the marginal increase in the interest tax shield will be more than the marginal increase in the costs of financial distress. However, using some additional leverage will benefit the company by reducing the net agency costs of equity required to align the interests of X-Sport management with its shareholders. In the event that X-Sport decides to proceed with a recapitalization plan, I recommend Plan D because it is the most consistent with the shareholders&#x27; interests.<\/p><p>Haywood reviews the report and calls Kelley into his office to discuss the proposal. Haywood suggests that Plan B would be the most appropriate choice for adjusting X-Sport&#x27;s capital structure. Before Kelley can argue, however, the two are interrupted by a previously scheduled meeting with a supplier.<\/p><p>Haywood takes Kelley&#x27;s data and proposes to the board of directors that X-Sport pursue one of three alternatives to restructure the company. The first alternative is Plan B from Kelley&#x27;s analysis. The second alternative involves separating GearTech, one of the companies acquired over the last few years, from the rest of the company by issuing new GearTech shares to X-Sport common shareholders. The third alternative involves creating a new company, Euro-Sport, out of the firm&#x27;s European operations and selling 35% of the new Euro-Sport shares to the public while retaining 65% of the shares within X-Sport. After some persuading, Haywood convinces the 7-member board (two of whom were former executives at GearTech) to accept the second alternative, which he had favored from the beginning. The board puts together an announcement to its shareholders as well as the general public, detailing the terms and goals of the plan.<\/p><p>One of the board members, Michael Ponting, points out that there are several theories of optimal capital structure. Ponting makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Miller and Modigliani Proposition II (without taxes) states that cost of equity is not affected by<\/td><\/tr><tr><td>capital structure changes.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Pecking order theory states that debt financing is preferable to all equity financing.<\/td><\/tr><tr><td>Statement 3: <\/td><td>Static trade-off theory states that all firms have an optimal level of debt.<\/td><\/tr><\/table><\/div><p>A group of shareholders, upset about the board&#x27;s plan, submit a formal objection to X-Sport&#x27;s board as well as to the SEC. In the objection, the shareholders state that the independence of the board has been compromised to the detriment of the company and its shareholders. The objection also states that:<\/p><p>The value of X-Sport&#x27;s common stock has been impaired as a result of the poor corporate governance system. X-Sport&#x27;s management has violated stewardship codes. The executives in the supervisory board should ideally be the same as those in the management board.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements with regard to the alternative plans proposed to X-Sport&#x27;s board of directors by Haywood is correct?<\/p><\/div>", "subj": "corporate"}, {"n": 30, "q": "Evaluate the three statements in the shareholders' formal objection submitted to X-Sport's board of directors. The objection is most likely to be correct with regard to:", "opts": ["the value impact.", "the stewardship codes.", "the supervisory and management board."], "ans": "C", "expl": "X-Sport's board of directors suffers from a lack of independence from management. The most pressing issue is that the CEO of the company, Richard Haywood, is also the chairman of the board. Judging by his ability to convince the board of his plan to spin off GearTech, Haywood exerts an excessive degree of influence over the board. This lack of independence could negatively impact the value of X-Sport common stock because investors will demand a higher risk premium for holding the stock because there is significant risk that management will not act in the shareholders' best interest. Specifically, there is a great risk (as evidenced by their quick decision to spin off GearTech) that management will enter into future transactions (such as mergers, acquisitions, and divestitures) and assume business risks that are in management's interest but not in the shareholders' best interest. Countries with stewardship code compel some investors, (e.g., institutional investors) to \"comply or explain\" investor corporate governance engagement with respect to the stewardship code. There is no clear evidence here of a violation of stewardship codes. Countries with dual tier boards have independent (non-executive) members on a supervisory board. For Further Reference: (Study Session 8, Module 22.1, LOS 22.a)", "explhtml": "<p>X-Sport&#x27;s board of directors suffers from a lack of independence from management. The most pressing issue is that the CEO of the company, Richard Haywood, is also the chairman of the board. Judging by his ability to convince the board of his plan to spin off GearTech, Haywood exerts an excessive degree of influence over the board. This lack of independence could negatively impact the value of X-Sport common stock because investors will demand a higher risk premium for holding the stock because there is significant risk that management will not act in the shareholders&#x27; best interest. Specifically, there is a great risk (as evidenced by their quick decision to spin off GearTech) that management will enter into future transactions (such as mergers, acquisitions, and divestitures) and assume business risks that are in management&#x27;s interest but not in the shareholders&#x27; best interest. Countries with stewardship code compel some investors, (e.g., institutional investors) to &quot;comply or explain&quot; investor corporate governance engagement with respect to the stewardship code. There is no clear evidence here of a violation of stewardship codes. Countries with dual tier boards have independent (non-executive) members on a supervisory board.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 22.1, LOS 22.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Kelley is the CFO of X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Using both debt and equity, X-Sport has been acquiring small competitor companies rather rapidly over the past few years, leading Kelley to believe that the firm&#x27;s capital structure may have drifted from its optimal mix. Kelley has been asked by the board of directors to evaluate the situation and provide a presentation that includes details of the firm&#x27;s capital structure as well as a risk assessment. In order to assist with his analysis, Kelley has collected information on the current financial situation of X-Sport. He has also projected the financial information for alternative financing plans. This information is presented in Exhibit 1.<\/p><p><b>Exhibit 1: Selected X-Sport, Inc., Financing Plans<\/b><\/p><div class=\"tbl\"><table><tr><td>X-Sport, Inc.<\/td><td>Industry Average<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current Plan A Plan B Plan C Plan D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Debt/equity<\/td><td>1.50<\/td><td>2.33<\/td><td>1.86<\/td><td>1.22<\/td><td>0.82<\/td><td>1.27<\/td><\/tr><tr><td>K  (after-tax)<\/td><td>5.0%<\/td><td>8.5%<\/td><td>6.2%<\/td><td>4.4%<\/td><td>3.9%<\/td><td>5.9%<\/td><\/tr><\/table><\/div><p>d<\/p><div class=\"tbl\"><table><tr><td>K<\/td><td>12.0%<\/td><td>16.0%<\/td><td>13.5%<\/td><td>11.2%<\/td><td>10.9%<\/td><td>12.8%<\/td><\/tr><\/table><\/div><p>e<\/p><div class=\"tbl\"><table><tr><td>Expected EPS<\/td><td>$5.67<\/td><td>$6.00<\/td><td>$6.33<\/td><td>$5.47<\/td><td>$4.89<\/td><td>$6.31<\/td><\/tr><tr><td>Payout ratio<\/td><td>45%<\/td><td>42%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Growth rate<\/td><td>6.1%<\/td><td>5.9%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Stock price<\/td><td>$43<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>After carefully analyzing the data, Kelley writes his analysis and proposal and submits the report to Richard Haywood, the chairman and CEO of X-Sport. Excerpts from the analysis and proposal follow:<\/p><p>In selecting a refinancing plan, we must not push our leverage ratio too high. An overly aggressive leverage ratio will likely cause debt rating agencies to downgrade our debt rating from its current Baa rating, causing our cost of debt to rise dramatically. This effect is explained using the static trade-off capital structure theory, which states that if our debt usage becomes high enough, the marginal increase in the interest tax shield will be more than the marginal increase in the costs of financial distress. However, using some additional leverage will benefit the company by reducing the net agency costs of equity required to align the interests of X-Sport management with its shareholders. In the event that X-Sport decides to proceed with a recapitalization plan, I recommend Plan D because it is the most consistent with the shareholders&#x27; interests.<\/p><p>Haywood reviews the report and calls Kelley into his office to discuss the proposal. Haywood suggests that Plan B would be the most appropriate choice for adjusting X-Sport&#x27;s capital structure. Before Kelley can argue, however, the two are interrupted by a previously scheduled meeting with a supplier.<\/p><p>Haywood takes Kelley&#x27;s data and proposes to the board of directors that X-Sport pursue one of three alternatives to restructure the company. The first alternative is Plan B from Kelley&#x27;s analysis. The second alternative involves separating GearTech, one of the companies acquired over the last few years, from the rest of the company by issuing new GearTech shares to X-Sport common shareholders. The third alternative involves creating a new company, Euro-Sport, out of the firm&#x27;s European operations and selling 35% of the new Euro-Sport shares to the public while retaining 65% of the shares within X-Sport. After some persuading, Haywood convinces the 7-member board (two of whom were former executives at GearTech) to accept the second alternative, which he had favored from the beginning. The board puts together an announcement to its shareholders as well as the general public, detailing the terms and goals of the plan.<\/p><p>One of the board members, Michael Ponting, points out that there are several theories of optimal capital structure. Ponting makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Miller and Modigliani Proposition II (without taxes) states that cost of equity is not affected by<\/td><\/tr><tr><td>capital structure changes.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Pecking order theory states that debt financing is preferable to all equity financing.<\/td><\/tr><tr><td>Statement 3: <\/td><td>Static trade-off theory states that all firms have an optimal level of debt.<\/td><\/tr><\/table><\/div><p>A group of shareholders, upset about the board&#x27;s plan, submit a formal objection to X-Sport&#x27;s board as well as to the SEC. In the objection, the shareholders state that the independence of the board has been compromised to the detriment of the company and its shareholders. The objection also states that:<\/p><p>The value of X-Sport&#x27;s common stock has been impaired as a result of the poor corporate governance system. X-Sport&#x27;s management has violated stewardship codes. The executives in the supervisory board should ideally be the same as those in the management board.<\/p><\/div><\/details><div class=\"qtext\"><p>Evaluate the three statements in the shareholders&#x27; formal objection submitted to X-Sport&#x27;s board of directors. The objection is most likely to be correct with regard to:<\/p><\/div>", "subj": "corporate"}, {"n": 31, "q": "Which of the following best describes the appropriate valuation models for the Henri presentation scenarios?", "opts": ["Firm A should be valued using a free cash flow model. Firm B should be valued using a free cash flow model.", "Firm A should be valued using a dividend discount model. Firm B should be valued using a residual income model.", "Firm A can be valued using either a free cash flow model or a dividend discount model. Firm B should be valued using a residual income model."], "ans": "B", "expl": "Firm A should be valued using the one-period dividend discount model. The firm has a history of dividend payments, the dividend policy is clear and related to the earnings of the firm, and (as stated in the presentation) the perspective is that of a minority shareholder. A free cash flow model is more appropriate when examining the perspective of a controlling shareholder. Firm B should be valued using a residual income model. The residual income approach is most appropriate for firms that do not have dividend histories, have transparent financial reporting, and have negative free cash flow for the foreseeable future (usually due to capital demands). For Further Reference: (Study Session 10, Module 27.1, LOS 27.a)", "explhtml": "<p>Firm A should be valued using the one-period dividend discount model. The firm has a history of dividend payments, the dividend policy is clear and related to the earnings of the firm, and (as stated in the presentation) the perspective is that of a minority shareholder. A free cash flow model is more appropriate when examining the perspective of a controlling shareholder.<\/p><p>Firm B should be valued using a residual income model. The residual income approach is most appropriate for firms that do not have dividend histories, have transparent financial reporting, and have negative free cash flow for the foreseeable future (usually due to capital demands).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 10, Module 27.1, LOS 27.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Marie Williams, CFA, and David Pacious, CFA, are portfolio managers for Stillwell Managers. Williams and Pacious are attending a conference held by Henri Financial Education on the fundamentals of valuation for common stock, preferred stock, and other assets.<\/p><p>During the conference, the presenter uses an example of four different companies to illustrate the valuation of common stock from the perspective of a minority shareholder.<\/p><p>Firm A is a noncyclical consumer products firm with a 50-year history. The firm pays a $1.80 dividend per share and attempts to increase dividends by 4% a year. Earnings and dividends have steadily increased for the past 20 years. Firm B is a technology firm. It has never paid a dividend and does not expect to in the near future. Furthermore, due to large investments in new factories and equipment, the firm is not expected to generate positive free cash flow in the foreseeable future. Firm C is an industrial firm with currently very little competition and a dividend growth rate of 9% a year. However, the profits in its product market have started to attract competitors and it is expected that Firm C&#x27;s profits will slowly decline such that the dividend growth steadily falls each year until it reaches a growth rate of 4% a year. Firm D is a pharmaceutical firm that is currently enjoying high profits and paying dividends. However, the firm&#x27;s strongest selling drug is coming off patent in three years. With no other drugs in the pipeline, the firm&#x27;s dividend growth rate is expected to drop abruptly in three years and settle at a lower growth rate.<\/p><p>The next day, Pacious decides to put what he learned into practice. The stock he is valuing, Maple Goods and Services, currently pays a dividend of $3.00. The dividend growth rate is 25% and is expected to steadily decline over the next eight years to a stable rate of 7% thereafter. Given its risk, Pacious estimates that the required return is 15%.<\/p><p>Williams analyzes the value of Mataka Plastics stock. Its dividend is expected to grow at a rate of 18% for the next four years, after which it will grow at 4%. This year&#x27;s dividend is $5.00 and Williams estimates the required return at 15%. From the seminar, Pacious learned that a firm&#x27;s health can be gauged by the present value of its future investment opportunities (PVGO). Tackling a calculation, he uses the following example for Wood Athletic Supplies:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$90.00<\/td><\/tr><tr><td>Current earnings<\/td><td>$5.50<\/td><\/tr><tr><td>Expected earnings<\/td><td>$6.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>15%<\/td><\/tr><\/table><\/div><p>Pacious and Williams discuss the characteristics of firms in various stages of growth, where firms experience an initial growth phase, a transitional phase, and a maturity phase in their life. They both agree that the Gordon Growth Model (GGM) is not always appropriate. Pacious makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>For firms in the initial growth phase, earnings are rapidly increasing, there are little or no<\/td><\/tr><tr><td>dividends, and there is heavy reinvestment. The return on equity is, however, higher than the<\/td><td><\/td><\/tr><tr><td>required return on the stock, the free cash flows to equity are positive, and the profit margin is<\/td><td><\/td><\/tr><tr><td>high.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>When estimating the terminal value in the 3-stage dividend growth model, it can be estimated<\/td><\/tr><tr><td>using the Gordon Growth Model or a price-multiple approach.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the appropriate valuation models for the Henri presentation scenarios?<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "Which of the following best describes the appropriate valuation techniques for the Henri presentation scenarios?", "opts": ["Firm C should be valued using a 2-stage dividend discount model. Firm D should be valued using an H dividend discount model.", "Firm C should be valued using an H dividend discount model. Firm D should be valued using a 2-stage dividend discount model.", "Both Firms C and D should be valued using the H dividend discount model."], "ans": "B", "expl": "Firm C should be valued using an H dividend discount model. A firm that has little competition now, but has competition that is expected to increase, is a candidate for the H-model. Growth can be expected to decline as competitors enter the market. Growth then stabilizes as the industry matures. Firm D should be valued using a two-stage dividend discount model. A firm that is expected to have a high rate of growth until patents expire, for example, should be modeled by the two-stage model, with one rate of growth before the patent expires and another rate thereafter. For Further Reference: (Study Session 10, Module 27.3, LOS 27.i)", "explhtml": "<p>Firm C should be valued using an H dividend discount model. A firm that has little competition now, but has competition that is expected to increase, is a candidate for the H-model. Growth can be expected to decline as competitors enter the market. Growth then stabilizes as the industry matures.<\/p><p>Firm D should be valued using a two-stage dividend discount model. A firm that is expected to have a high rate of growth until patents expire, for example, should be modeled by the two-stage model, with one rate of growth before the patent expires and another rate thereafter.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 10, Module 27.3, LOS 27.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie Williams, CFA, and David Pacious, CFA, are portfolio managers for Stillwell Managers. Williams and Pacious are attending a conference held by Henri Financial Education on the fundamentals of valuation for common stock, preferred stock, and other assets.<\/p><p>During the conference, the presenter uses an example of four different companies to illustrate the valuation of common stock from the perspective of a minority shareholder.<\/p><p>Firm A is a noncyclical consumer products firm with a 50-year history. The firm pays a $1.80 dividend per share and attempts to increase dividends by 4% a year. Earnings and dividends have steadily increased for the past 20 years. Firm B is a technology firm. It has never paid a dividend and does not expect to in the near future. Furthermore, due to large investments in new factories and equipment, the firm is not expected to generate positive free cash flow in the foreseeable future. Firm C is an industrial firm with currently very little competition and a dividend growth rate of 9% a year. However, the profits in its product market have started to attract competitors and it is expected that Firm C&#x27;s profits will slowly decline such that the dividend growth steadily falls each year until it reaches a growth rate of 4% a year. Firm D is a pharmaceutical firm that is currently enjoying high profits and paying dividends. However, the firm&#x27;s strongest selling drug is coming off patent in three years. With no other drugs in the pipeline, the firm&#x27;s dividend growth rate is expected to drop abruptly in three years and settle at a lower growth rate.<\/p><p>The next day, Pacious decides to put what he learned into practice. The stock he is valuing, Maple Goods and Services, currently pays a dividend of $3.00. The dividend growth rate is 25% and is expected to steadily decline over the next eight years to a stable rate of 7% thereafter. Given its risk, Pacious estimates that the required return is 15%.<\/p><p>Williams analyzes the value of Mataka Plastics stock. Its dividend is expected to grow at a rate of 18% for the next four years, after which it will grow at 4%. This year&#x27;s dividend is $5.00 and Williams estimates the required return at 15%. From the seminar, Pacious learned that a firm&#x27;s health can be gauged by the present value of its future investment opportunities (PVGO). Tackling a calculation, he uses the following example for Wood Athletic Supplies:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$90.00<\/td><\/tr><tr><td>Current earnings<\/td><td>$5.50<\/td><\/tr><tr><td>Expected earnings<\/td><td>$6.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>15%<\/td><\/tr><\/table><\/div><p>Pacious and Williams discuss the characteristics of firms in various stages of growth, where firms experience an initial growth phase, a transitional phase, and a maturity phase in their life. They both agree that the Gordon Growth Model (GGM) is not always appropriate. Pacious makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>For firms in the initial growth phase, earnings are rapidly increasing, there are little or no<\/td><\/tr><tr><td>dividends, and there is heavy reinvestment. The return on equity is, however, higher than the<\/td><td><\/td><\/tr><tr><td>required return on the stock, the free cash flows to equity are positive, and the profit margin is<\/td><td><\/td><\/tr><tr><td>high.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>When estimating the terminal value in the 3-stage dividend growth model, it can be estimated<\/td><\/tr><tr><td>using the Gordon Growth Model or a price-multiple approach.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the appropriate valuation techniques for the Henri presentation scenarios?<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "Which of the following is closest to the current value for Maple Goods and Services stock?", "opts": ["$15.90.", "$49.13.", "$67.13."], "ans": "C", "expl": "The firm should be valued using an H dividend discount model given that an initially high rate of growth declines linearly over a specified period. The formula is: where: where: t = length of high-growth period g = short-term growth rate S g = long-term growth rate L r = required return Using the figures for Maple: For Further Reference: (Study Session 10, Module 27.3, LOS 27.l)", "explhtml": "<p>The firm should be valued using an H dividend discount model given that an initially high rate of growth declines linearly over a specified period. The formula is:<\/p><p>where:<\/p><p>where:<\/p><p>t = length of high-growth period<\/p><p>g  = short-term growth rate S<\/p><p>g  = long-term growth rate L r = required return<\/p><p>Using the figures for Maple:<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 10, Module 27.3, LOS 27.l)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie Williams, CFA, and David Pacious, CFA, are portfolio managers for Stillwell Managers. Williams and Pacious are attending a conference held by Henri Financial Education on the fundamentals of valuation for common stock, preferred stock, and other assets.<\/p><p>During the conference, the presenter uses an example of four different companies to illustrate the valuation of common stock from the perspective of a minority shareholder.<\/p><p>Firm A is a noncyclical consumer products firm with a 50-year history. The firm pays a $1.80 dividend per share and attempts to increase dividends by 4% a year. Earnings and dividends have steadily increased for the past 20 years. Firm B is a technology firm. It has never paid a dividend and does not expect to in the near future. Furthermore, due to large investments in new factories and equipment, the firm is not expected to generate positive free cash flow in the foreseeable future. Firm C is an industrial firm with currently very little competition and a dividend growth rate of 9% a year. However, the profits in its product market have started to attract competitors and it is expected that Firm C&#x27;s profits will slowly decline such that the dividend growth steadily falls each year until it reaches a growth rate of 4% a year. Firm D is a pharmaceutical firm that is currently enjoying high profits and paying dividends. However, the firm&#x27;s strongest selling drug is coming off patent in three years. With no other drugs in the pipeline, the firm&#x27;s dividend growth rate is expected to drop abruptly in three years and settle at a lower growth rate.<\/p><p>The next day, Pacious decides to put what he learned into practice. The stock he is valuing, Maple Goods and Services, currently pays a dividend of $3.00. The dividend growth rate is 25% and is expected to steadily decline over the next eight years to a stable rate of 7% thereafter. Given its risk, Pacious estimates that the required return is 15%.<\/p><p>Williams analyzes the value of Mataka Plastics stock. Its dividend is expected to grow at a rate of 18% for the next four years, after which it will grow at 4%. This year&#x27;s dividend is $5.00 and Williams estimates the required return at 15%. From the seminar, Pacious learned that a firm&#x27;s health can be gauged by the present value of its future investment opportunities (PVGO). Tackling a calculation, he uses the following example for Wood Athletic Supplies:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$90.00<\/td><\/tr><tr><td>Current earnings<\/td><td>$5.50<\/td><\/tr><tr><td>Expected earnings<\/td><td>$6.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>15%<\/td><\/tr><\/table><\/div><p>Pacious and Williams discuss the characteristics of firms in various stages of growth, where firms experience an initial growth phase, a transitional phase, and a maturity phase in their life. They both agree that the Gordon Growth Model (GGM) is not always appropriate. Pacious makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>For firms in the initial growth phase, earnings are rapidly increasing, there are little or no<\/td><\/tr><tr><td>dividends, and there is heavy reinvestment. The return on equity is, however, higher than the<\/td><td><\/td><\/tr><tr><td>required return on the stock, the free cash flows to equity are positive, and the profit margin is<\/td><td><\/td><\/tr><tr><td>high.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>When estimating the terminal value in the 3-stage dividend growth model, it can be estimated<\/td><\/tr><tr><td>using the Gordon Growth Model or a price-multiple approach.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is closest to the current value for Maple Goods and Services stock?<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Which of the following is closest to the current value for Mataka Plastics stock?", "opts": ["$62.49.", "$73.73.", "$81.60."], "ans": "B", "expl": "If you grow the $5.00 dividend out for four years at 18%, the first four dividends are: D D D D 1 2 3 4 $5.90 $6.96 $8.22 $9.69 D is then D × 1.04 = $10.0816. Discounting the
