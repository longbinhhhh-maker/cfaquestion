s to a stable rate of 7% thereafter. Given its risk, Pacious estimates that the required return is 15%.<\/p><p>Williams analyzes the value of Mataka Plastics stock. Its dividend is expected to grow at a rate of 18% for the next four years, after which it will grow at 4%. This year&#x27;s dividend is $5.00 and Williams estimates the required return at 15%. From the seminar, Pacious learned that a firm&#x27;s health can be gauged by the present value of its future investment opportunities (PVGO). Tackling a calculation, he uses the following example for Wood Athletic Supplies:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$90.00<\/td><\/tr><tr><td>Current earnings<\/td><td>$5.50<\/td><\/tr><tr><td>Expected earnings<\/td><td>$6.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>15%<\/td><\/tr><\/table><\/div><p>Pacious and Williams discuss the characteristics of firms in various stages of growth, where firms experience an initial growth phase, a transitional phase, and a maturity phase in their life. They both agree that the Gordon Growth Model (GGM) is not always appropriate. Pacious makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>For firms in the initial growth phase, earnings are rapidly increasing, there are little or no<\/td><\/tr><tr><td>dividends, and there is heavy reinvestment. The return on equity is, however, higher than the<\/td><td><\/td><\/tr><tr><td>required return on the stock, the free cash flows to equity are positive, and the profit margin is<\/td><td><\/td><\/tr><tr><td>high.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>When estimating the terminal value in the 3-stage dividend growth model, it can be estimated<\/td><\/tr><tr><td>using the Gordon Growth Model or a price-multiple approach.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is closest to the current value for Mataka Plastics stock?<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Which of the following is closest to the percent of Wood Athletic Supplies leading P/E related to PVGO?", "opts": ["56%.", "59%.", "69%."], "ans": "A", "expl": "The stock price represents the present value of the future dividends (on a no-growth basis) and the present value of the growth opportunities (PVGO): Thus the value of a firm's equity has two components: the value of its assets in place (E /r) and the present value of its 1 future investment opportunities (PVGO). PVGO = 50 The P/E for the firm is 90 / 6 = 15.00. The P/E of the PVGO is 50 / 6 = 8.33. The percentage of Wood Athletic Supplies leading P/E related to PVGO is then 8.33 / 15.00 = 56%. For Further Reference: (Study Session 10, Module 27.2, LOS 27.e)", "explhtml": "<p>The stock price represents the present value of the future dividends (on a no-growth basis) and the present value of the growth opportunities (PVGO):<\/p><p>Thus the value of a firm&#x27;s equity has two components: the value of its assets in place (E /r) and the present value of its 1 future investment opportunities (PVGO).<\/p><p>PVGO = 50<\/p><p>The P/E for the firm is 90 / 6 = 15.00.<\/p><p>The P/E of the PVGO is 50 / 6 = 8.33.<\/p><p>The percentage of Wood Athletic Supplies leading P/E related to PVGO is then 8.33 / 15.00 = 56%.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 10, Module 27.2, LOS 27.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie Williams, CFA, and David Pacious, CFA, are portfolio managers for Stillwell Managers. Williams and Pacious are attending a conference held by Henri Financial Education on the fundamentals of valuation for common stock, preferred stock, and other assets.<\/p><p>During the conference, the presenter uses an example of four different companies to illustrate the valuation of common stock from the perspective of a minority shareholder.<\/p><p>Firm A is a noncyclical consumer products firm with a 50-year history. The firm pays a $1.80 dividend per share and attempts to increase dividends by 4% a year. Earnings and dividends have steadily increased for the past 20 years. Firm B is a technology firm. It has never paid a dividend and does not expect to in the near future. Furthermore, due to large investments in new factories and equipment, the firm is not expected to generate positive free cash flow in the foreseeable future. Firm C is an industrial firm with currently very little competition and a dividend growth rate of 9% a year. However, the profits in its product market have started to attract competitors and it is expected that Firm C&#x27;s profits will slowly decline such that the dividend growth steadily falls each year until it reaches a growth rate of 4% a year. Firm D is a pharmaceutical firm that is currently enjoying high profits and paying dividends. However, the firm&#x27;s strongest selling drug is coming off patent in three years. With no other drugs in the pipeline, the firm&#x27;s dividend growth rate is expected to drop abruptly in three years and settle at a lower growth rate.<\/p><p>The next day, Pacious decides to put what he learned into practice. The stock he is valuing, Maple Goods and Services, currently pays a dividend of $3.00. The dividend growth rate is 25% and is expected to steadily decline over the next eight years to a stable rate of 7% thereafter. Given its risk, Pacious estimates that the required return is 15%.<\/p><p>Williams analyzes the value of Mataka Plastics stock. Its dividend is expected to grow at a rate of 18% for the next four years, after which it will grow at 4%. This year&#x27;s dividend is $5.00 and Williams estimates the required return at 15%. From the seminar, Pacious learned that a firm&#x27;s health can be gauged by the present value of its future investment opportunities (PVGO). Tackling a calculation, he uses the following example for Wood Athletic Supplies:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$90.00<\/td><\/tr><tr><td>Current earnings<\/td><td>$5.50<\/td><\/tr><tr><td>Expected earnings<\/td><td>$6.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>15%<\/td><\/tr><\/table><\/div><p>Pacious and Williams discuss the characteristics of firms in various stages of growth, where firms experience an initial growth phase, a transitional phase, and a maturity phase in their life. They both agree that the Gordon Growth Model (GGM) is not always appropriate. Pacious makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>For firms in the initial growth phase, earnings are rapidly increasing, there are little or no<\/td><\/tr><tr><td>dividends, and there is heavy reinvestment. The return on equity is, however, higher than the<\/td><td><\/td><\/tr><tr><td>required return on the stock, the free cash flows to equity are positive, and the profit margin is<\/td><td><\/td><\/tr><tr><td>high.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>When estimating the terminal value in the 3-stage dividend growth model, it can be estimated<\/td><\/tr><tr><td>using the Gordon Growth Model or a price-multiple approach.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is closest to the percent of Wood Athletic Supplies leading P/E related to PVGO?<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "Regarding Pacious's statements on the stages of growth and the Gordon Growth Model, are both statements correct?", "opts": ["Yes.", "No, only Statement 2 is correct.", "No, both statements are incorrect."], "ans": "B", "expl": "Statement 1 is incorrect. All of Pacious's description of the initial growth phase is correct except that, in this stage, the free cash flows to equity are actually negative. This is due to the heavy capital investment. Statement 2 is correct. The terminal value in the three-stage dividend growth model can be estimated using either approach. For Further Reference: (Study Session 10, Module 27.3, LOS 27.j, 27.k)", "explhtml": "<p>Statement 1 is incorrect. All of Pacious&#x27;s description of the initial growth phase is correct except that, in this stage, the free cash flows to equity are actually negative. This is due to the heavy capital investment. Statement 2 is correct. The terminal value in the three-stage dividend growth model can be estimated using either approach.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 10, Module 27.3, LOS 27.j, 27.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie Williams, CFA, and David Pacious, CFA, are portfolio managers for Stillwell Managers. Williams and Pacious are attending a conference held by Henri Financial Education on the fundamentals of valuation for common stock, preferred stock, and other assets.<\/p><p>During the conference, the presenter uses an example of four different companies to illustrate the valuation of common stock from the perspective of a minority shareholder.<\/p><p>Firm A is a noncyclical consumer products firm with a 50-year history. The firm pays a $1.80 dividend per share and attempts to increase dividends by 4% a year. Earnings and dividends have steadily increased for the past 20 years. Firm B is a technology firm. It has never paid a dividend and does not expect to in the near future. Furthermore, due to large investments in new factories and equipment, the firm is not expected to generate positive free cash flow in the foreseeable future. Firm C is an industrial firm with currently very little competition and a dividend growth rate of 9% a year. However, the profits in its product market have started to attract competitors and it is expected that Firm C&#x27;s profits will slowly decline such that the dividend growth steadily falls each year until it reaches a growth rate of 4% a year. Firm D is a pharmaceutical firm that is currently enjoying high profits and paying dividends. However, the firm&#x27;s strongest selling drug is coming off patent in three years. With no other drugs in the pipeline, the firm&#x27;s dividend growth rate is expected to drop abruptly in three years and settle at a lower growth rate.<\/p><p>The next day, Pacious decides to put what he learned into practice. The stock he is valuing, Maple Goods and Services, currently pays a dividend of $3.00. The dividend growth rate is 25% and is expected to steadily decline over the next eight years to a stable rate of 7% thereafter. Given its risk, Pacious estimates that the required return is 15%.<\/p><p>Williams analyzes the value of Mataka Plastics stock. Its dividend is expected to grow at a rate of 18% for the next four years, after which it will grow at 4%. This year&#x27;s dividend is $5.00 and Williams estimates the required return at 15%. From the seminar, Pacious learned that a firm&#x27;s health can be gauged by the present value of its future investment opportunities (PVGO). Tackling a calculation, he uses the following example for Wood Athletic Supplies:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$90.00<\/td><\/tr><tr><td>Current earnings<\/td><td>$5.50<\/td><\/tr><tr><td>Expected earnings<\/td><td>$6.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>15%<\/td><\/tr><\/table><\/div><p>Pacious and Williams discuss the characteristics of firms in various stages of growth, where firms experience an initial growth phase, a transitional phase, and a maturity phase in their life. They both agree that the Gordon Growth Model (GGM) is not always appropriate. Pacious makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>For firms in the initial growth phase, earnings are rapidly increasing, there are little or no<\/td><\/tr><tr><td>dividends, and there is heavy reinvestment. The return on equity is, however, higher than the<\/td><td><\/td><\/tr><tr><td>required return on the stock, the free cash flows to equity are positive, and the profit margin is<\/td><td><\/td><\/tr><tr><td>high.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>When estimating the terminal value in the 3-stage dividend growth model, it can be estimated<\/td><\/tr><tr><td>using the Gordon Growth Model or a price-multiple approach.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Pacious&#x27;s statements on the stages of growth and the Gordon Growth Model, are both statements correct?<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "In computing EVA , which of the following adjustments made by an analyst would be least appropriate? ®", "opts": ["Add LIFO reserve to total capital.", "Expense R&D instead of capitalizing it.", "Eliminate deferred taxes and consider only cash taxes as an expense."], "ans": "B", "expl": "R&D should be capitalized and amortized rather than expensing when incurred. The other adjustments are appropriate. For Further Reference: (Study Session 11, Module 30.1, LOS 30.a)", "explhtml": "<p>R&amp;D should be capitalized and amortized rather than expensing when incurred. The other adjustments are appropriate.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 30.1, LOS 30.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Asante Bizou is an equity analyst for Alpha, Inc., a boutique consulting firm in San Jose, CA. Alpha is providing consulting services to Prizm&#x27;s board in evaluating the performance of Prizm&#x27;s management. Bizou reviews Prizm&#x27;s key financial data for the past three years. Selected information from Prizm&#x27;s financial statements is given in Exhibit 1.<\/p><p><b>Exhibit ter tax WACC: 12.5%. Tax rate: 45%.<\/p><p><b>Notes:<\/b><\/p><p>1. Depreciation included in cost of goods sold and administrative expenses is 12m, 10.5m, and 9.6m for 20X6, 20X5, and 20X4, respectively. 2. $8m of debt was redeemed at the end of 20X6. 3. Other than the debt redeemed in 20X6, Prizm&#x27;s liabilities consist mostly of long-term debt valued approximately at book value. 4. Replacement value of assets is roughly equal to book value minus 4%.<\/p><\/div><\/details><div class=\"qtext\"><p>Prizm&#x27;s free cash flow to equity (FCFE) for 20X6 is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 42, "q": "For this question only, assume that the chairman has drawn up budgetary forecasts for 20X7 that suggest that residual income will be $5m for the year ahead. You believe that this will increase by 5% per year for the foreseeable future. Using the residual income method, the value of Prizm's equity as of 31st December 20X6 is closest to:", "opts": ["$144.5 million.", "$147.0 million.", "$177.2 million."], "ans": "A", "expl": "Value of equity = book value of equity + PV of residual income Value as of 31 December 20X6: = 94.5 + [5 / (0.15 − 0.05)] = $144.5m For Further Reference: (Study Session 11, Module 30.1, LOS 30.a)", "explhtml": "<p>Value of equity = book value of equity + PV of residual income<\/p><p>Value as of 31 December 20X6:<\/p><p>= 94.5 + [5 / (0.15 − 0.05)]<\/p><p>= $144.5m<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 30.1, LOS 30.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Asante Bizou is an equity analyst for Alpha, Inc., a boutique consulting firm in San Jose, CA. Alpha is providing consulting services to Prizm&#x27;s board in evaluating the performance of Prizm&#x27;s management. Bizou reviews Prizm&#x27;s key financial data for the past three years. Selected information from Prizm&#x27;s financial statements is given in Exhibit 1.<\/p><p><b>Exhibit 1: Selected Prizm Financial Data<\/b><\/p><div class=\"tbl\"><table><tr><td>20X4<\/td><td>20X5<\/td><td>20X6<\/td><td><\/td><\/tr><tr><td>Income Statement<\/td><td>$m<\/td><td>$m<\/td><td>$m<\/td><\/tr><tr><td>Sales<\/td><td>40.2<\/td><td>42.3<\/td><td>43.9<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>(11.6) (12.3) (12.8)<\/td><td><\/td><td><\/td><\/tr><tr><td>Gross profit<\/td><td>28.6<\/td><td>30.0<\/td><td>31.1<\/td><\/tr><tr><td>Administrative expenses<\/td><td>(10.0) (10.0)<\/td><td>(3.0)<\/td><td><\/td><\/tr><tr><td>Earnings before interest and tax<\/td><td>18.6<\/td><td>20.0<\/td><td>28.1<\/td><\/tr><tr><td>Interest<\/td><td>(6.3)<\/td><td>(6.3)<\/td><td>(4.2)<\/td><\/tr><tr><td>Earnings before tax<\/td><td>12.3<\/td><td>13.7<\/td><td>23.9<\/td><\/tr><tr><td>Tax<\/td><td>(5.1)<\/td><td>(5.6)<\/td><td>(11.4)<\/td><\/tr><tr><td>Net income<\/td><td>7.2<\/td><td>8.1<\/td><td>12.5<\/td><\/tr><tr><td>Dividends<\/td><td>(3.0)<\/td><td>(3.1)<\/td><td>(3.2)<\/td><\/tr><tr><td>Retained income<\/td><td>4.2<\/td><td>5.0<\/td><td>9.3<\/td><\/tr><\/table><\/div><p><b>Exhibit 1: Selected Prizm Financial Data (continued)<\/b><\/p><div class=\"tbl\"><table><tr><td>20X3<\/td><td>20X4<\/td><td>20X5<\/td><td>20X6<\/td><td><\/td><\/tr><tr><td>Balance Sheet at 31 December<\/td><td>$m<\/td><td>$m<\/td><td>$m<\/td><td>$m<\/td><\/tr><tr><td>Working capital<\/td><td>24.0<\/td><td>25.6<\/td><td>27.2<\/td><td>32.4<\/td><\/tr><tr><td>Fixed assets<\/td><td>76.0<\/td><td>78.6<\/td><td>82.0<\/td><td>78.1<\/td><\/tr><tr><td>Total assets<\/td><td>100.0 104.2 109.2 110.5<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Liabilities<\/td><td>24.0<\/td><td>24.0<\/td><td>24.0<\/td><td>16.0<\/td><\/tr><tr><td>Common stock<\/td><td>20.0<\/td><td>20.0<\/td><td>20.0<\/td><td>20.0<\/td><\/tr><tr><td>Additional paid up capital<\/td><td>10.0<\/td><td>10.0<\/td><td>10.0<\/td><td>10.0<\/td><\/tr><tr><td>Retained income<\/td><td>46.0<\/td><td>50.2<\/td><td>55.2<\/td><td>64.5<\/td><\/tr><tr><td>100.0 104.2 109.2 110.5<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Market value of equity<\/p><div class=\"tbl\"><table><tr><td>167<\/td><td>203<\/td><td>199<\/td><td>145<\/td><\/tr><\/table><\/div><p>(31 December)<\/p><p><b>Other information:<\/b><\/p><p>Beta of firm = 1. Debtholders&#x27; required rate of return: 5%. Equity holders&#x27; required rate of return: 15%. After tax WACC: 12.5%. Tax rate: 45%.<\/p><p><b>Notes:<\/b><\/p><p>1. Depreciation included in cost of goods sold and administrative expenses is 12m, 10.5m, and 9.6m for 20X6, 20X5, and 20X4, respectively. 2. $8m of debt was redeemed at the end of 20X6. 3. Other than the debt redeemed in 20X6, Prizm&#x27;s liabilities consist mostly of long-term debt valued approximately at book value. 4. Replacement value of assets is roughly equal to book value minus 4%.<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that the chairman has drawn up budgetary forecasts for 20X7 that suggest that residual income will be $5m for the year ahead. You believe that this will increase by 5% per year for the foreseeable future.<\/p><p>Using the residual income method, the value of Prizm&#x27;s equity as of 31st December 20X6 is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 43, "q": "Using the information in Exhibit 1 and Exhibit 2, the value of bond A is closest to:", "opts": ["$98.96.", "$100.16.", "$101.39."], "ans": "C", "expl": "The completed binomial tree is as follows: For Further Reference: (Study Session 12, Module 33.1, LOS 33.d)", "explhtml": "<p>The completed binomial tree is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam1pm-002.webp\" style=\"max-width:min(100%,322px)\" alt=\"\"><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 33.1, LOS 33.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<\/summary><div class=\"vig-body\"><p>Juanita Joplin has just begun her summer internship in the bond trading department of Bearclaw Bank NA. Joplin is assigned to Suzanne Thomas who specializes in AA-rated corporate bonds. Thomas explains to Joplin that she relies on binomial interest rate trees to value bonds with embedded options. Thomas provides Joplin with a binomial interest rate tree derived from current swap rates using an interest rate volatility assumption of 10% as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Binomial Interest Rate Tree (σ = 10%, Annual Pay)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam1pm-001.webp\" style=\"max-width:min(100%,239px)\" alt=\"\"><p>Thomas then illustrates valuation of two bonds issued by Dxon Corp. Thomas states that the credit risk of the two bonds is similar to the credit risk premium embedded in the swap rate. Selected data for the two bonds is provided in Exhibit 2.<\/p><p><b>Exhibit 2: Selected Data on Two Dxon Bonds<\/b><\/p><div class=\"tbl\"><table><tr><td>Bond<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>Coupon<\/td><td>5%, annual pay 5% annual pay<\/td><td><\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><tr><td>Type<\/td><td>Option-Free<\/td><td>Extendible*<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><\/table><\/div><p>*Bond B has an investor option to extend its maturity for an additional year at the same coupon rate.<\/p><p>Thomas states that pathwise valuation can also be used for the bonds instead of the binomial tree approach. She highlights one of the interest rate paths (labeled Path X) as 2.50% in Year 1, 4.9445% in Year 2, and 6.6821% in Year 3.<\/p><p>Joplin feels that the default risk of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><p>Joplin read a report prepared by Thomas for the risk management department of the bank. She underlines the following statement in the report:<\/p><p>&quot;The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option would have a lower one- sided down duration as compared to the one-sided down duration for a comparable option-free bond.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1 and Exhibit 2, the value of bond A is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 44, "q": "The value of Bond A under path X is closest to:", "opts": ["$98.02.", "$99.63.", "$101.02."], "ans": "C", "expl": "The value of bond A under interest rate scenario of path X is determined as: For Further Reference: (Study Session 12, Module 33.2, LOS 33.g)", "explhtml": "<p>The value of bond A under interest rate scenario of path X is determined as:<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 33.2, LOS 33.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juanita Joplin has just begun her summer internship in the bond trading department of Bearclaw Bank NA. Joplin is assigned to Suzanne Thomas who specializes in AA-rated corporate bonds. Thomas explains to Joplin that she relies on binomial interest rate trees to value bonds with embedded options. Thomas provides Joplin with a binomial interest rate tree derived from current swap rates using an interest rate volatility assumption of 10% as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Binomial Interest Rate Tree (σ = 10%, Annual Pay)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam1pm-001.webp\" style=\"max-width:min(100%,239px)\" alt=\"\"><p>Thomas then illustrates valuation of two bonds issued by Dxon Corp. Thomas states that the credit risk of the two bonds is similar to the credit risk premium embedded in the swap rate. Selected data for the two bonds is provided in Exhibit 2.<\/p><p><b>Exhibit 2: Selected Data on Two Dxon Bonds<\/b><\/p><div class=\"tbl\"><table><tr><td>Bond<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>Coupon<\/td><td>5%, annual pay 5% annual pay<\/td><td><\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><tr><td>Type<\/td><td>Option-Free<\/td><td>Extendible*<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><\/table><\/div><p>*Bond B has an investor option to extend its maturity for an additional year at the same coupon rate.<\/p><p>Thomas states that pathwise valuation can also be used for the bonds instead of the binomial tree approach. She highlights one of the interest rate paths (labeled Path X) as 2.50% in Year 1, 4.9445% in Year 2, and 6.6821% in Year 3.<\/p><p>Joplin feels that the default risk of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><p>Joplin read a report prepared by Thomas for the risk management department of the bank. She underlines the following statement in the report:<\/p><p>&quot;The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option would have a lower one- sided down duration as compared to the one-sided down duration for a comparable option-free bond.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The value of Bond A under path X is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 45, "q": "Using the information in Exhibit 1 and Exhibit 2, the value of bond B is closest to:", "opts": ["$98.96.", "$101.16.", "$102.91."], "ans": "C", "expl": "An extendible bond is valued identically to a putable bond. Bond B would be identical to a 3-year putable bond where the underlying option is a European put option exercisable in 2 years at par. The completed binomial tree is given below. For Further Reference: (Study Session 13, Module 34.2, LOS 34.f)", "explhtml": "<p>An extendible bond is valued identically to a putable bond. Bond B would be identical to a 3-year putable bond where the underlying option is a European put option exercisable in 2 years at par. The completed binomial tree is given below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam1pm-003.webp\" style=\"max-width:min(100%,322px)\" alt=\"\"><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.2, LOS 34.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juanita Joplin has just begun her summer internship in the bond trading department of Bearclaw Bank NA. Joplin is assigned to Suzanne Thomas who specializes in AA-rated corporate bonds. Thomas explains to Joplin that she relies on binomial interest rate trees to value bonds with embedded options. Thomas provides Joplin with a binomial interest rate tree derived from current swap rates using an interest rate volatility assumption of 10% as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Binomial Interest Rate Tree (σ = 10%, Annual Pay)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam1pm-001.webp\" style=\"max-width:min(100%,239px)\" alt=\"\"><p>Thomas then illustrates valuation of two bonds issued by Dxon Corp. Thomas states that the credit risk of the two bonds is similar to the credit risk premium embedded in the swap rate. Selected data for the two bonds is provided in Exhibit 2.<\/p><p><b>Exhibit 2: Selected Data on Two Dxon Bonds<\/b><\/p><div class=\"tbl\"><table><tr><td>Bond<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>Coupon<\/td><td>5%, annual pay 5% annual pay<\/td><td><\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><tr><td>Type<\/td><td>Option-Free<\/td><td>Extendible*<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><\/table><\/div><p>*Bond B has an investor option to extend its maturity for an additional year at the same coupon rate.<\/p><p>Thomas states that pathwise valuation can also be used for the bonds instead of the binomial tree approach. She highlights one of the interest rate paths (labeled Path X) as 2.50% in Year 1, 4.9445% in Year 2, and 6.6821% in Year 3.<\/p><p>Joplin feels that the default risk of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><p>Joplin read a report prepared by Thomas for the risk management department of the bank. She underlines the following statement in the report:<\/p><p>&quot;The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option would have a lower one- sided down duration as compared to the one-sided down duration for a comparable option-free bond.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1 and Exhibit 2, the value of bond B is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 46, "q": "For this question only, assume that Joplin is right about the credit risk of Dxon bonds. If the volatility estimate used in generating the interest rate tree is less than the true volatility, which of the following choices most accurately describes the impact on the calculated value of bond B and the estimated OAS of bond B? Value of bond B Estimated OAS of bond B", "opts": ["Underestimated Too low", "Underestimated Too high", "Overestimated Too high"], "ans": "A", "expl": "Bond B is identical to a 3-year putable bond with the put option exercisable in Year 2. If the volatility estimate used to generate the interest rate tree is lower than the actual volatility, the value of the put option and, thus, the value of the putable bond would be underestimated. A lower volatility estimate would underestimate the OAS computed for the putable bond. When the assumed level of interest rate volatility is underestimated, the computed value of the bond using backward induction methodology will be too low; therefore, the OAS needed to force the model price to be equal to the market price will be lower as well. For Further Reference: (Study Session 13, Module 34.4, LOS 34.d, 34.h)", "explhtml": "<p>Bond B is identical to a 3-year putable bond with the put option exercisable in Year 2. If the volatility estimate used to generate the interest rate tree is lower than the actual volatility, the value of the put option and, thus, the value of the putable bond would be underestimated. A lower volatility estimate would underestimate the OAS computed for the putable bond. When the assumed level of interest rate volatility is underestimated, the computed value of the bond using backward induction methodology will be too low; therefore, the OAS needed to force the model price to be equal to the market price will be lower as well.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.4, LOS 34.d, 34.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juanita Joplin has just begun her summer internship in the bond trading department of Bearclaw Bank NA. Joplin is assigned to Suzanne Thomas who specializes in AA-rated corporate bonds. Thomas explains to Joplin that she relies on binomial interest rate trees to value bonds with embedded options. Thomas provides Joplin with a binomial interest rate tree derived from current swap rates using an interest rate volatility assumption of 10% as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Binomial Interest Rate Tree (σ = 10%, Annual Pay)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam1pm-001.webp\" style=\"max-width:min(100%,239px)\" alt=\"\"><p>Thomas then illustrates valuation of two bonds issued by Dxon Corp. Thomas states that the credit risk of the two bonds is similar to the credit risk premium embedded in the swap rate. Selected data for the two bonds is provided in Exhibit 2.<\/p><p><b>Exhibit 2: Selected Data on Two Dxon Bonds<\/b><\/p><div class=\"tbl\"><table><tr><td>Bond<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>Coupon<\/td><td>5%, annual pay 5% annual pay<\/td><td><\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><tr><td>Type<\/td><td>Option-Free<\/td><td>Extendible*<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><\/table><\/div><p>*Bond B has an investor option to extend its maturity for an additional year at the same coupon rate.<\/p><p>Thomas states that pathwise valuation can also be used for the bonds instead of the binomial tree approach. She highlights one of the interest rate paths (labeled Path X) as 2.50% in Year 1, 4.9445% in Year 2, and 6.6821% in Year 3.<\/p><p>Joplin feels that the default risk of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><p>Joplin read a report prepared by Thomas for the risk management department of the bank. She underlines the following statement in the report:<\/p><p>&quot;The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option would have a lower one- sided down duration as compared to the one-sided down duration for a comparable option-free bond.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that Joplin is right about the credit risk of Dxon bonds. If the volatility estimate used in generating the interest rate tree is less than the true volatility, which of the following choices most accurately describes the impact on the calculated value of bond B and the estimated OAS of bond B?<\/p><div class=\"tbl\"><table><tr><td>Value of bond B<\/td><td>Estimated OAS of bond B<\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 47, "q": "Relative to Bond B, the Geneva, Inc., bond is most likely to be:", "opts": ["underpriced.", "overpriced.", "correctly priced."], "ans": "B", "expl": "Bond B and Geneva, Inc., bonds are of the same credit quality, but Geneva Inc.'s bond offers a lower OAS and, hence, offers lower compensation for taking the same credit risk. Hence, the Geneva, Inc., bond is overpriced. The difference in option feature is not relevant, as OAS is computed after adjusting for option risk. For Further Reference: (Study Session 13, Module 34.4, LOS 34.g)", "explhtml": "<p>Bond B and Geneva, Inc., bonds are of the same credit quality, but Geneva Inc.&#x27;s bond offers a lower OAS and, hence, offers lower compensation for taking the same credit risk. Hence, the Geneva, Inc., bond is overpriced. The difference in option feature is not relevant, as OAS is computed after adjusting for option risk.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.4, LOS 34.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juanita Joplin has just begun her summer internship in the bond trading department of Bearclaw Bank NA. Joplin is assigned to Suzanne Thomas who specializes in AA-rated corporate bonds. Thomas explains to Joplin that she relies on binomial interest rate trees to value bonds with embedded options. Thomas provides Joplin with a binomial interest rate tree derived from current swap rates using an interest rate volatility assumption of 10% as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Binomial Interest Rate Tree (σ = 10%, Annual Pay)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam1pm-001.webp\" style=\"max-width:min(100%,239px)\" alt=\"\"><p>Thomas then illustrates valuation of two bonds issued by Dxon Corp. Thomas states that the credit risk of the two bonds is similar to the credit risk premium embedded in the swap rate. Selected data for the two bonds is provided in Exhibit 2.<\/p><p><b>Exhibit 2: Selected Data on Two Dxon Bonds<\/b><\/p><div class=\"tbl\"><table><tr><td>Bond<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>Coupon<\/td><td>5%, annual pay 5% annual pay<\/td><td><\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><tr><td>Type<\/td><td>Option-Free<\/td><td>Extendible*<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><\/table><\/div><p>*Bond B has an investor option to extend its maturity for an additional year at the same coupon rate.<\/p><p>Thomas states that pathwise valuation can also be used for the bonds instead of the binomial tree approach. She highlights one of the interest rate paths (labeled Path X) as 2.50% in Year 1, 4.9445% in Year 2, and 6.6821% in Year 3.<\/p><p>Joplin feels that the default risk of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><p>Joplin read a report prepared by Thomas for the risk management department of the bank. She underlines the following statement in the report:<\/p><p>&quot;The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option would have a lower one- sided down duration as compared to the one-sided down duration for a comparable option-free bond.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Relative to Bond B, the Geneva, Inc., bond is most likely to be:<\/p><\/div>", "subj": "fixed"}, {"n": 48, "q": "Thomas's statement in the report to the risk management department is most likely:", "opts": ["correct.", "incorrect about effective duration only.", "incorrect about effective duration and about one-sided duration."], "ans": "B", "expl": "Both callable and putable bonds have an effective duration that is less than or equal to the effective duration of an option- free bond. When the underlying call option is deep out of money, the effective duration of a callable bond and that of an option-free bond will be same. As a result, the statement about effective duration is incorrect. Thomas's statement about one-sided down duration is correct. Due to the limited upside for a callable bond, the change in price of a callable bond for a decrease in interest rates is lower than the change in price for an option-free bond. For Further Reference: (Study Session 13, Module 34.5, LOS 34.j, 34.k)", "explhtml": "<p>Both callable and putable bonds have an effective duration that is less than or equal to the effective duration of an option- free bond. When the underlying call option is deep out of money, the effective duration of a callable bond and that of an option-free bond will be same. As a result, the statement about effective duration is incorrect. Thomas&#x27;s statement about one-sided down duration is correct. Due to the limited upside for a callable bond, the change in price of a callable bond for a decrease in interest rates is lower than the change in price for an option-free bond.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.5, LOS 34.j, 34.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juanita Joplin has just begun her summer internship in the bond trading department of Bearclaw Bank NA. Joplin is assigned to Suzanne Thomas who specializes in AA-rated corporate bonds. Thomas explains to Joplin that she relies on binomial interest rate trees to value bonds with embedded options. Thomas provides Joplin with a binomial interest rate tree derived from current swap rates using an interest rate volatility assumption of 10% as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Binomial Interest Rate Tree (σ = 10%, Annual Pay)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam1pm-001.webp\" style=\"max-width:min(100%,239px)\" alt=\"\"><p>Thomas then illustrates valuation of two bonds issued by Dxon Corp. Thomas states that the credit risk of the two bonds is similar to the credit risk premium embedded in the swap rate. Selected data for the two bonds is provided in Exhibit 2.<\/p><p><b>Exhibit 2: Selected Data on Two Dxon Bonds<\/b><\/p><div class=\"tbl\"><table><tr><td>Bond<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>Coupon<\/td><td>5%, annual pay 5% annual pay<\/td><td><\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><tr><td>Type<\/td><td>Option-Free<\/td><td>Extendible*<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><\/table><\/div><p>*Bond B has an investor option to extend its maturity for an additional year at the same coupon rate.<\/p><p>Thomas states that pathwise valuation can also be used for the bonds instead of the binomial tree approach. She highlights one of the interest rate paths (labeled Path X) as 2.50% in Year 1, 4.9445% in Year 2, and 6.6821% in Year 3.<\/p><p>Joplin feels that the default risk of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><p>Joplin read a report prepared by Thomas for the risk management department of the bank. She underlines the following statement in the report:<\/p><p>&quot;The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option would have a lower one- sided down duration as compared to the one-sided down duration for a comparable option-free bond.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Thomas&#x27;s statement in the report to the risk management department is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 49, "q": "The price of the futures contract on the equity index as of the inception date, January 18, is closest to:", "opts": ["1,064.", "1,071.", "1,078."], "ans": "A", "expl": "The futures price can be calculated by growing the spot price at the difference between the continuously compounded risk-free rate and the dividend yield as a continuously compounded rate. The continuously compounded risk-free rate is ln(1.040811) = 4%, so the futures price for a 240-day future is: FP = S e (r-d)t = 1,050e (0.04-0.02)(240/365) = 1,064 0 For Further Reference: (Study Session 14, Module 37.2, LOS 37.a)", "explhtml": "<p>The futures price can be calculated by growing the spot price at the difference between the continuously compounded risk-free rate and the dividend yield as a continuously compounded rate. The continuously compounded risk-free rate is ln(1.040811) = 4%, so the futures price for a 240-day future is:<\/p><div class=\"tbl\"><table><tr><td>FP = S e<\/td><td>(r-d)t<\/td><td> = 1,050e<\/td><td>(0.04-0.02)(240/365)<\/td><td> = 1,064<\/td><\/tr><tr><td>0<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.2, LOS 37.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<\/summary><div class=\"vig-body\"><p>Michelle Norris, CFA, manages assets for individual investors in the United States as well as in other countries. Norris limits the scope of her practice to equity securities traded on U.S. stock exchanges. Her partner, John Witkowski, handles any requests for international securities. Recently, one of Norris&#x27;s wealthiest clients suffered a substantial decline in the value of his international portfolio. Worried that his U.S. allocation might suffer the same fate, he has asked Norris to implement a hedge on his portfolio. Norris has agreed to her client&#x27;s request and is currently in the process of evaluating several futures contracts. Her primary interest is in a futures contract on a broad equity index that will expire 240 days from today. The closing price as of yesterday, January 17, for the equity index was 1,050. The expected dividends from the index yield 2% (continuously compounded annual rate). The continuously compounded risk-free rate is 4%. Norris decides that this equity index futures contract is the appropriate hedge for her client&#x27;s portfolio and enters into the contract.<\/p><p>Sixty days after entering into the futures contract, the equity index reached a level of 1,015. The futures contract that Norris purchased is now trading on the Chicago Mercantile Exchange for a price of 1,035. Interest rates have not changed. After performing some calculations, Norris calls her client to let him know of an arbitrage opportunity related to his futures position. Over the phone, Norris makes the following comments to her client:<\/p><p>&quot;We have an excellent opportunity to earn a riskless profit by engaging in arbitrage using the equity index, risk-free assets, and futures contracts. My recommended strategy is as follows: We should sell the equity index short, buy the futures contract, and pay any dividends occurring over the life of the contract. By pursuing this strategy, we can generate profits for your portfolio without incurring any risk.&quot;<\/p><p>Sixty days ago when the Swiss franc/euro exchange rate was SF1.12 per euro, Witkowski entered into (on behalf of a client) a 1-year, quarterly settlement euro-Swiss franc swap paying €1 million at inception. The fixed-for-fixed swap had the franc fixed rate at 0.96% and the euro fixed rate at 0.78%. Currently, the euro position has a value of €1.0014 per €1 notional and the exchange rate is SF 1.10 per euro. Exhibit 1 provides information about Swiss interest rates.<\/p><p><b>Exhibit 1: Swiss Interest Rates<\/b><\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Rate<\/td><td>DF<\/td><\/tr><tr><td>30<\/td><td>0.50% 0.9996<\/td><td><\/td><\/tr><tr><td>60<\/td><td>0.54% 0.9991<\/td><td><\/td><\/tr><tr><td>90<\/td><td>0.48% 0.9988<\/td><td><\/td><\/tr><tr><td>120<\/td><td>0.65% 0.9978<\/td><td><\/td><\/tr><tr><td>180<\/td><td>0.77% 0.9962<\/td><td><\/td><\/tr><tr><td>210<\/td><td>0.67% 0.9961<\/td><td><\/td><\/tr><tr><td>300<\/td><td>0.82% 0.9932<\/td><td><\/td><\/tr><tr><td>360<\/td><td>1%<\/td><td>0.9901<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The price of the futures contract on the equity index as of the inception date, January 18, is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 50, "q": "Which of the following best describes the movement of the futures price on the 240-day equity index futures contract as the contract moves toward the expiration date?", "opts": ["The futures price will move toward zero as expiration nears.", "The futures price will move toward the (at inception) expected spot price as expiration nears.", "The futures price will move toward the spot price as expiration nears."], "ans": "C", "expl": "The futures price for a given contract maturity must converge to the spot price as the contract moves toward expiration. Otherwise, arbitrage opportunities would exist. For Further Reference: (Study Session 14, Module 37.2, LOS 37.a)", "explhtml": "<p>The futures price for a given contract maturity must converge to the spot price as the contract moves toward expiration. Otherwise, arbitrage opportunities would exist.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.2, LOS 37.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michelle Norris, CFA, manages assets for individual investors in the United States as well as in other countries. Norris limits the scope of her practice to equity securities traded on U.S. stock exchanges. Her partner, John Witkowski, handles any requests for international securities. Recently, one of Norris&#x27;s wealthiest clients suffered a substantial decline in the value of his international portfolio. Worried that his U.S. allocation might suffer the same fate, he has asked Norris to implement a hedge on his portfolio. Norris has agreed to her client&#x27;s request and is currently in the process of evaluating several futures contracts. Her primary interest is in a futures contract on a broad equity index that will expire 240 days from today. The closing price as of yesterday, January 17, for the equity index was 1,050. The expected dividends from the index yield 2% (continuously compounded annual rate). The continuously compounded risk-free rate is 4%. Norris decides that this equity index futures contract is the appropriate hedge for her client&#x27;s portfolio and enters into the contract.<\/p><p>Sixty days after entering into the futures contract, the equity index reached a level of 1,015. The futures contract that Norris purchased is now trading on the Chicago Mercantile Exchange for a price of 1,035. Interest rates have not changed. After performing some calculations, Norris calls her client to let him know of an arbitrage opportunity related to his futures position. Over the phone, Norris makes the following comments to her client:<\/p><p>&quot;We have an excellent opportunity to earn a riskless profit by engaging in arbitrage using the equity index, risk-free assets, and futures contracts. My recommended strategy is as follows: We should sell the equity index short, buy the futures contract, and pay any dividends occurring over the life of the contract. By pursuing this strategy, we can generate profits for your portfolio without incurring any risk.&quot;<\/p><p>Sixty days ago when the Swiss franc/euro exchange rate was SF1.12 per euro, Witkowski entered into (on behalf of a client) a 1-year, quarterly settlement euro-Swiss franc swap paying €1 million at inception. The fixed-for-fixed swap had the franc fixed rate at 0.96% and the euro fixed rate at 0.78%. Currently, the euro position has a value of €1.0014 per €1 notional and the exchange rate is SF 1.10 per euro. Exhibit 1 provides information about Swiss interest rates.<\/p><p><b>Exhibit 1: Swiss Interest Rates<\/b><\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Rate<\/td><td>DF<\/td><\/tr><tr><td>30<\/td><td>0.50% 0.9996<\/td><td><\/td><\/tr><tr><td>60<\/td><td>0.54% 0.9991<\/td><td><\/td><\/tr><tr><td>90<\/td><td>0.48% 0.9988<\/td><td><\/td><\/tr><tr><td>120<\/td><td>0.65% 0.9978<\/td><td><\/td><\/tr><tr><td>180<\/td><td>0.77% 0.9962<\/td><td><\/td><\/tr><tr><td>210<\/td><td>0.67% 0.9961<\/td><td><\/td><\/tr><tr><td>300<\/td><td>0.82% 0.9932<\/td><td><\/td><\/tr><tr><td>360<\/td><td>1%<\/td><td>0.9901<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the movement of the futures price on the 240-day equity index futures contract as the contract moves toward the expiration date?<\/p><\/div>", "subj": "derivatives"}, {"n": 51, "q": "Sixty d  Currently, the euro position has a value of €1.0014 per €1 notional and the exchange rate is SF 1.10 per euro. Exhibit 1 provides information about Swiss interest rates.<\/p><p><b>Exhibit 1: Swiss Interest Rates<\/b><\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Rate<\/td><td>DF<\/td><\/tr><tr><td>30<\/td><td>0.50% 0.9996<\/td><td><\/td><\/tr><tr><td>60<\/td><td>0.54% 0.9991<\/td><td><\/td><\/tr><tr><td>90<\/td><td>0.48% 0.9988<\/td><td><\/td><\/tr><tr><td>120<\/td><td>0.65% 0.9978<\/td><td><\/td><\/tr><tr><td>180<\/td><td>0.77% 0.9962<\/td><td><\/td><\/tr><tr><td>210<\/td><td>0.67% 0.9961<\/td><td><\/td><\/tr><tr><td>300<\/td><td>0.82% 0.9932<\/td><td><\/td><\/tr><tr><td>360<\/td><td>1%<\/td><td>0.9901<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Sixty days after entering into the equity index futures contract, the value to the short party under the futures contract as compared to the value under an otherwise identical forward contract would most likely be:<\/p><\/div>", "subj": "derivatives"}, {"n": 54, "q": "Sixty days after inception, the value of the currency swap to Witkowski's client is closest to:", "opts": ["–€19,633.", "–€141,584.", "–€1,021,033."], "ans": "A", "expl": "Based on the exchange rate at initiation, the notional principals were €1,000,000 and SF 1,120,000. Sixty days after initiation, the remaining settlement days are 30, 120, 210, and 300 days into the future. The value of the Swiss franc position (per 1 SF notional) is calculated as: (0.0096 / 4) × (0.9996 + 0.9978 + 0.9961 + 0.9932) + 1 × 0.9932 = SF 1.0028. For the notional principal of SF 1,120,000, the value is SF 1,123,136. Based on the current exchange rate, this translates into (1,123,136 / 1.10) euros or €1,021,033. The euro position value is given as €1.0014 per €1 notional. For €1 million notional, this translates into a value of €1,001,400. Because Witkowski's client paid the euro notional at initiation, they will receive the euros and have a value of €1,001,400 − €1,021,033 = –€19,633. For Further Reference: (Study Session 14, Module 37.8, LOS 37.d)", "explhtml": "<p>Based on the exchange rate at initiation, the notional principals were €1,000,000 and SF 1,120,000. Sixty days after initiation, the remaining settlement days are 30, 120, 210, and 300 days into the future. The value of the Swiss franc position (per 1 SF notional) is calculated as: (0.0096 / 4) × (0.9996 + 0.9978 + 0.9961 + 0.9932) + 1 × 0.9932 = SF 1.0028. For the notional principal of SF 1,120,000, the value is SF 1,123,136. Based on the current exchange rate, this translates into (1,123,136 / 1.10) euros or €1,021,033.<\/p><p>The euro position value is given as €1.0014 per €1 notional. For €1 million notional, this translates into a value of €1,001,400. Because Witkowski&#x27;s client paid the euro notional at initiation, they will receive the euros and have a value of €1,001,400 − €1,021,033 = –€19,633.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.8, LOS 37.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michelle Norris, CFA, manages assets for individual investors in the United States as well as in other countries. Norris limits the scope of her practice to equity securities traded on U.S. stock exchanges. Her partner, John Witkowski, handles any requests for international securities. Recently, one of Norris&#x27;s wealthiest clients suffered a substantial decline in the value of his international portfolio. Worried that his U.S. allocation might suffer the same fate, he has asked Norris to implement a hedge on his portfolio. Norris has agreed to her client&#x27;s request and is currently in the process of evaluating several futures contracts. Her primary interest is in a futures contract on a broad equity index that will expire 240 days from today. The closing price as of yesterday, January 17, for the equity index was 1,050. The expected dividends from the index yield 2% (continuously compounded annual rate). The continuously compounded risk-free rate is 4%. Norris decides that this equity index futures contract is the appropriate hedge for her client&#x27;s portfolio and enters into the contract.<\/p><p>Sixty days after entering into the futures contract, the equity index reached a level of 1,015. The futures contract that Norris purchased is now trading on the Chicago Mercantile Exchange for a price of 1,035. Interest rates have not changed. After performing some calculations, Norris calls her client to let him know of an arbitrage opportunity related to his futures position. Over the phone, Norris makes the following comments to her client:<\/p><p>&quot;We have an excellent opportunity to earn a riskless profit by engaging in arbitrage using the equity index, risk-free assets, and futures contracts. My recommended strategy is as follows: We should sell the equity index short, buy the futures contract, and pay any dividends occurring over the life of the contract. By pursuing this strategy, we can generate profits for your portfolio without incurring any risk.&quot;<\/p><p>Sixty days ago when the Swiss franc/euro exchange rate was SF1.12 per euro, Witkowski entered into (on behalf of a client) a 1-year, quarterly settlement euro-Swiss franc swap paying €1 million at inception. The fixed-for-fixed swap had the franc fixed rate at 0.96% and the euro fixed rate at 0.78%. Currently, the euro position has a value of €1.0014 per €1 notional and the exchange rate is SF 1.10 per euro. Exhibit 1 provides information about Swiss interest rates.<\/p><p><b>Exhibit 1: Swiss Interest Rates<\/b><\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Rate<\/td><td>DF<\/td><\/tr><tr><td>30<\/td><td>0.50% 0.9996<\/td><td><\/td><\/tr><tr><td>60<\/td><td>0.54% 0.9991<\/td><td><\/td><\/tr><tr><td>90<\/td><td>0.48% 0.9988<\/td><td><\/td><\ .25%<\/td><\/tr><tr><td>Z<\/td><td>45%<\/td><td>35%<\/td><td>14.00%<\/td><\/tr><tr><td>Total<\/td><td>100%<\/td><td>100%<\/td><td><\/td><\/tr><\/table><\/div><p>Ogle states that the information ratio for a manager is a good indicator of relative performance. Ogle also makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>&quot;Unlike the Sharpe ratio, the information ratio can be affected by the addition of cash or<\/td><\/tr><tr><td>leverage.&quot;<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>&quot;The information ratio of an unconstrained portfolio is unaffected by aggressiveness of the active<\/td><\/tr><tr><td>weights.&quot;<\/td><td><\/td><\/tr><tr><td>Statement 3: <\/td><td>&quot;Among active portfolios, the portfolio with the highest information ratio need not have the<\/td><\/tr><tr><td>highest Sharpe ratio.&quot;<\/td><td><\/td><\/tr><tr><td>Statement 4: <\/td><td>&quot;The optimal active risk for an unconstrained portfolio is less than the optimal active risk for a<\/td><\/tr><tr><td>constrained portfolio.&quot;<\/td><td><\/td><\/tr><\/table><\/div><p>Ogle then considers the Dena and Orient funds. Exhibit 2 shows selected data for the two funds.<\/p><p><b>Exhibit 2: Selected Information for Dena and Orient Funds<\/b><\/p><p>Dena Orient<\/p><div class=\"tbl\"><table><tr><td>Information coefficient<\/td><td>0.20<\/td><td>0.25<\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.99<\/td><td>0.80<\/td><\/tr><tr><td>Independent bets/year<\/td><td>12<\/td><td>X<\/td><\/tr><\/table><\/div><p>Segovia also considers three funds that specialize in market timing. Information about the funds is given in Exhibit 3.<\/p><p><b>Exhibit 3: Selected Fund Data<\/b><\/p><div class=\"tbl\"><table><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><\/td><\/tr><tr><td>Frequency of bets per year<\/td><td>12<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>Number of independent stocks followed<\/td><td>2<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>Probabilit  in Exhibit 2 must be closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 58, "q": "Based on the information in Exhibit 3, an investor that wishes to construct a portfolio with an active risk of 4% would most appropriately choose to combine the benchmark with:", "opts": ["fund A.", "fund B.", "fund C."], "ans": "B", "expl": "IC = 2(% correct) − 1 IC = 2(0.52) − 1 = 0.04 A IC = 2(0.58) − 1 = 0.16 B IC = 2(0.59) − 1 = 0.18 C Any investor should always choose the fund with the highest information ratio. The amount of active risk can then be adjusted by changing the allocation of portfolio to the benchmark versus the active fund. For Further Reference: (Study Session 17, Module 47.3, LOS 47.c, 47.d, 47.e)", "explhtml": "<p>IC = 2(% correct) − 1<\/p><p>IC  = 2(0.52) − 1 = 0.04 A<\/p><p>IC  = 2(0.58) − 1 = 0.16 B<\/p><p>IC  = 2(0.59) − 1 = 0.18 C Any investor should always choose the fund with the highest information ratio. The amount of active risk can then be adjusted by changing the allocation of portfolio to the benchmark versus the active fund.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 47.3, LOS 47.c, 47.d, 47.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tamara Ogle, CFA, and Isaac Segovia, CAIA, are portfolio managers for Lucas Investment Management (Lucas). Ogle and Segovia both manage large institutional investment portfolios and are working together to research portfolio optimization strategies. Ogle mentions the Premier fund. Exhibit 1 shows the Premier fund&#x27;s exposures and expected return, as well as benchmark specifications.<\/p><p><b>Exhibit 1: Premier Fund Characteristics<\/b><\/p><p>Security (i) Portfolio Weight (w ) Benchmark Weight (w ) Return E(R )<\/p><div class=\"tbl\"><table><tr><td>Pi<\/td><td>Bi<\/td><td>i<\/td><td><\/td><\/tr><tr><td>X<\/td><td io with the highest Sharpe ratio. The optimal active risk for a constrained portfolio = TC × optimal active risk for an unconstrained portfolio. Given that TC &lt; 1 for constrained portfolio, the optimal active risk for a constrained portfolio will be lower than the optimal active risk for an unconstrained portfolio.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 47.3, LOS 47.c, 47.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tamara Ogle, CFA, and Isaac Segovia, CAIA, are portfolio managers for Lucas Investment Management (Lucas). Ogle and Segovia both manage large institutional investment portfolios and are working together to research portfolio optimization strategies. Ogle mentions the Premier fund. Exhibit 1 shows the Premier fund&#x27;s exposures and expected return, as well as benchmark specifications.<\/p><p><b>Exhibit 1: Premier Fund Characteristics<\/b><\/p><p>Security (i) Portfolio Weight (w ) Benchmark Weight (w ) Return E(R )<\/p><div class=\"tbl\"><table><tr><td>Pi<\/td><td>Bi<\/td><td>i<\/td><td><\/td><\/tr><tr><td>X<\/td><td>35%<\/td><td>40%<\/td><td>11.20%<\/td><\/tr><tr><td>Y<\/td><td>20%<\/td><td>25%<\/td><td>4.25%<\/td><\/tr><tr><td>Z<\/td><td>45%<\/td><td>35%<\/td><td>14.00%<\/td><\/tr><tr><td>Total<\/td><td>100%<\/td><td>100%<\/td><td><\/td><\/tr><\/table><\/div><p>Ogle states that the information ratio for a manager is a good indicator of relative performance. Ogle also makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>&quot;Unlike the Sharpe ratio, the information ratio can be affected by the addition of cash or<\/td><\/tr><tr><td>leverage.&quot;<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>&quot;The information ratio of an unconstrained portfolio is unaffected by aggressiveness of the active<\/td><\/ // ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

function startTimer(){
  if(started || CFG.minutes<=0) return;

  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;

  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){

    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");

function refreshNav(){

    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");

    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;

}
