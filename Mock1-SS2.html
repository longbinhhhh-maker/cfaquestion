<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

    <!--subject-breakdown-panel-start-->
    <div id="subjectBreakdown" class="subject-breakdown" aria-live="polite"></div>
    <!--subject-breakdown-panel-end-->
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

o other market participants, therefore private information is not reflected in market prices in a\nsemi-strong-form market.\nMarket Efficiency\ncontrast weak-form, semi-strong-form, and strong-form market efficiency\nDiscuss ①\nFilter", "qhtml": null}, {"n": 15, "q": "With respect to securitization, time tranching is best described as the\nredistribution of:", "opts": ["default risk.", "inflation risk.", "prepayment risk."], "ans": "C", "expl": "A. Incorrect because as per the justification for the correct answer, time tranching refers to the redistribution of\ncascading flow of payments between bond classes in the event of default.\nB. Incorrect because as per the justification for the correct answer, time tranching refers to the redistribution of\nprepayment risk, not inflation risk.\nC. Correct because the structure of a securitization may also allow the redistribution of another type of risk, called\nfrom the scheduled cash flows as set forth in the loan agreement because of the borrowers' ability to alter\ndifferent expected maturities is referred to as time tranching.\nMortgage-Backed Security (MBS) Instrument and Market Features\n· define prepayment risk and describe time tranching structures in securitizations and their purpose\nDiscuss\nFilter\n1", "qhtml": null}, {"n": 16, "q": "The mental discomfort that occurs when new information conflicts with\npreviously held beliefs is best described as:", "opts": ["regret aversion.", "mental accounting.", "cognitive dissonance."], "ans": "C", "expl": "A. Incorrect because regret-aversion bias is an emotional bias in which people tend to avoid making decisions out of\nfear that the decision will turn out poorly. While regret may be described as a mental discomfort, regret-aversion\nB. Incorrect because mental accounting bias refers to mentally dividing money into 'accounts' that influence\ndecisions, even though money is fungible.\nC. Correct because belief perseverance biases result from the mental discomfort that occurs when new information\nconflicts with previously held beliefs or cognitions, known as cognitive dissonance.\nThe Behavioral Biases of Individuals\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 17, "q": "According to behavioral finance, observed overreaction in securities markets\nmost likely occurs because of:", "opts": ["loss aversion.", "disposition effect.", "gambler's fallacy."], "ans": "A", "expl": "A. Correct because according to loss aversion-related arguments in behavioral theories, investors dislike losses\nmore than they like comparable gains. Thus, such a behavioral bias can explain observed overreaction in markets.\nB. Incorrect because the disposition effect is a behavioral bias in which investors tend to avoid realizing losses but\nrather seek to realize gains.\nC. Incorrect because gambler's fallacy is a behavioral bias in which recent outcomes affect investors' estimates of\nfuture probabilities.\nMarket Efficiency\n· describe behavioral finance and its potential relevance to understanding market anomalies\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 18, "q": "If the risk-free rate is 3%, Jensen's alpha for the portfolio is:", "opts": ["-4.0%.", "-0.4%.", "0.4%."], "ans": "B", "expl": "A. Incorrect because the market return is used instead of the market risk premium and Jensen's alpha is incorrectly\ncalculated as:\nαp = Rp- [Rf+ βp(Rm)]\nα。= 11% - [3% + 1.2 × (10%)]\nα。 = 11% - 15% = -4%.\nB.Correct because Jensen's alpha is calculated as:\nα,= R,- [Rf + β,(Rm - R)]\nαp= 11% - [3% + 1.2 × (10% - 3%)]\nLevelICFAProgram-February2025\nQuestion 18 of 90\nαp = R,-[Rf + βp(Rm)]\nαp= 11% - [3% + 1.2 × (10%)]\nαp = 11% - 15% = -4%.\nB. Correct because Jensen's alpha is calculated as:\nαp = Rp-[Rf + βp(Rm - R)]\nαp = 11% - [3% + 1.2 × (10% - 3%)]\nαp= 11% - 11.4% = -0.4%.\nC. Incorrect because the portfolio's actual return and required return are reversed and Jensen's alpha is incorrectly\ncalculated as:\nαp = [Rf+β,(Rm - R)] - R,\nαp= [3% + 1.2 × (10% - 3%)] - 11%\nαp = 11.4% - 11% = 0.4%.\nPortfolio Risk and Return: Part Il\nDiscuss ①\nFilter", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAEaCAIAAACaVU1SAAB2q0lEQVR42u3dZ1wUV/s38DPbWXrvzYIFbKiosRfs2JLYu2JXYokajdHYYi+xYIuosVdiBTuIDVFBsQCKhd4Xll22z/Pi/J1nA2hM4h2j+X1f8FlmZ2dnz8zOXnPNdc4wCoWCAAAAAAD8l/DQBAAAAACAIBgAAAAAAEEwAAAAAACCYAAAAACATxrDsixaAQAAAAAIMsEAAAAAAAiCAQAAAAAQBAMAAAAAIAgGAAAAAEAQDAAAAACAIBgAAAAAAEHwu8nl8tu3b2MLAQAAAAAywQAAAAAACIIBAAAAABAEAwAAAAAgCAYAAAAAQBAMAAAAAP9tgg+4rKdPn06fPn3YsGF9+/b9uJ9KJpOtX7/+1atXhBBPT88JEybY29uTjzTGRXR0dE5OjqWlZfv27a2srP5Hb8SyrMFgMBgMAoGAYZhyz+bn55ubm4vF4r/5LikpKUlJSampqf7+/i1atKh0Hr1en5OT4+zsXHE1CCFKpVImk7m4uOC7BwAAAJ9JECyTyVJTUxcsWEAI+Yhx8IULFxYtWpSXl0f/vXnz5pkzZ77//vsePXr88yuTnZ29Y8eOpKQkFxcXHx+f/10Q/Pz58++++y45Obl///7fffcdN/3GjRuhoaH379/n8XhOTk7h4eFSqfQvv8tXX32l1WoJId27d680CB4zZkxiYmJxcTGfzz98+HCNGjW4ULi0tDQsLOyXX37R6XStW7fu379/y5Yt8Q0EAAAA8qmXQ7AsS//Onz9///79NFr6J6lUqk2bNk2ZMiUvL08ikbi5uXl4eJiYmMjl8lmzZn333Xd6vf5/vQ4PHz6sVatWrVq1Xr58SQhhGEbwBo/34YtPNBqNTCZLSkqaNGlSYmKiXq/X6XTkTUZ25cqVo0aNiouL0+v1Wq02LS2tYcOG3bp1+2vv9d1332k0GpZl/fz8qlatWu7ZmJiYdu3aXbt2raioyGAwaLXa3r17t27dmj47cuTIxo0bb968Wa1W6/X6y5cvjxkz5vDhw/gGAgAAAPnUM8HGNm/ezOPx+vfv/09+mPv373Nx1bRp0/z8/BiGSUlJ+eGHHwghZ8+ebdWqVZcuXf7JVXJ2dp4xY0ZxcbFUKvX09Pzgy1+7du39+/dLS0tp7Yex9PT0q1evEkKEQuH8+fNfvXp1+vTprKysjIyMv/ZeNLnOMMyyZcsqprSPHj2anZ1NCKlSpcrw4cOPHTuWkJDA5eMTEhLog+DgYE9Pz3nz5rEse/r06a5du5qZmeF7CAAAAJ9JEFxQULB06dJ/OAjet29fbm4uIcTKymrQoEE081q3bt01a9bIZDKNRrN8+fLOnTs/evTowYMHLMvWr1/f19eXEBIVFZWens7j8QIDA+3s7OjSLl68GBsbm5SU1KBBgzFjxhhXERgMhiVLljx79oxlWTc3t6CgoGbNmtFQLzExkc5z7969nJwcX1/fkpKSvLw8CwsLLg/Nsmx0dPSuXbsyMjJatmwZEBDQqVMnbsnHjx8nhLi6upqbmx88eDA/P9/Hx2fatGmVfuQnT55w8SWpUCBRUlJCCKlatWqfPn00Gg2fz9+yZYtGoyFvr2C+du3ar7/+WlBQ4OHhMWzYsBYtWjAMw7Ls7du3c3JyaBCcm5trMBhsbGyMXxsXF8eyrFgsXrhwob+/f9euXRs1akQIyc/Pt7OzU6lU9LUTJkwQi8W7du169u awn from a larger universe."], "ans": "A", "expl": "A. Correct because the constituents of equity indexes are more liquid than those of fixed-income indexes. The\nresponsible for creating liquid markets for those securities by purchasing and selling them from their inventory. In\nproviders must contact dealers to obtain current prices on constituent securities to update the index, or they must\ncharacteristics.\nB. Incorrect because fixed income markets are predominantly dealer markets. This means that dealers are assigned\nto update the index or they must estimate the prices of constituent securities using the prices of traded fixed-\nincome securities with similar characteristics.\nLevel I CFA Program—February 2025\nQuestion 20 of 90\n'ninhll aiol 'v\nB. harder to price.\nC. drawn from a larger universe.\nSolution\nA. Correct because the constituents of equity indexes are more liquid than those of fixed-income indexes. The\nnumber of fixed-income securities is many times larger than the number of equity securities. Fixed-income markets\naddition, many fixed-income securities do not trade frequently and are therefore relatively illiquid. As a result, index\nproviders must contact dealers to obtain current prices on constituent securities to update the index, or they must\ncharacteristics.\nB. Incorrect because fixed income markets are predominantly dealer markets. This means that dealers are assigned\ns e s  nb n u  sn   oe ui o  o\nrelatively illiquid. As a result, index providers must contact dealers to obtain current prices on constituent securities\nto update the index or they must estimate the prices of constituent securities using the prices of traded fixed-\nincome securities with similar characteristics.\nSecurityMarketIndexes\ncompare types of security market indexes\nDiscuss ①\nFilter", "qhtml": null}, {"n": 21, "q": "If the dividend payout ratio is 45%, the sustainable growth rate is closest to:", "opts": ["7%.", "9%.", "11%."], "ans": "C", "expl": "A. I ract."], "ans": "C", "expl": "A. Incorrect. This is only true at expiration.\nB. Incorrect. This is only true at initiation.\nC. Correct. The value of a forward contract is the spot price of the underlying minus the present value of the forward\ncontract. Calculating the present value requires adjusting the time period to account for the remaining term of the\ncontract.\nPricing and valuation of forward contracts and for an underlying with varying maturities\nexplain how the value and price of a forward contract are determined at initiation, during the life of the contract, and\nat expiration\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 26, "q": "All else being equal, a bond issuer is most likely to be evaluated as less\ncreditworthy than its peers if it has a:", "opts": ["lower debt/EBITDA and a lower EBITDA/interest expense.", "lower debt/EBITDA and a higher EBITDA/interest expense.", "higher debt/EBITDA and a lower EBITDA/interest expense."], "ans": "C", "expl": "A. Incorrect because lower debt/EBlTDA shows that the company has lower leverage in comparison to earnings and\nthus has a lower probability of default and higher creditworthiness (all else being equal).\nB. Incorrect because lower debt/EBlTDA shows a lower level of debt compared to adjusted earnings and due to\nleading to a lower probability of default and higher evaluation of creditworthiness (all else being equal).\nEBITDA interest coverage ratio shows that the company is more likely not to have earnings that are enough to pay\nthe interest (coupon) and thus has a higher probability of default and lower creditworthiness (all else being equal).\ncredit risk. Note that this ratio can be very volatile for companies with high cash flow variability, such as those in\nmeet——to'cover'—its interest payments. The two most common are the EBiTDA/interest expense and\nliberal than the one that uses EBlT because it does not subtract out the impact of (non-cash) depreciation and\namortization expense. A higher ratio indicates higher credit quality.\nCredit Analysis for Corporate Issuers\n· calculate and interpret financial ratios used in credit analysis", "qhtml": null}, {"n": 27, "q": "Which of the following is most likely considered an investor constraint in an\ninvestment policy statement?", "opts": ["Time horizon", "Risk tolerance", "Return requirement"], "ans": "A", "expl": "A. Correct because five major types of constraints on portfolio selection are liquidity, time horizon, tax concerns,\nlegal and regulatory factors, and unique circumstances.\nB. Incorrect because client's objectives are specified in terms of risk tolerance and return requirements. Risk and\nreturn objectives are, therefore, likely to be part of the investment objectives section of the investment policy\nstatement and not part of the constraints section focusing on liquidity, time horizon, tax concerns, legal and\nregulatory factors, and unique circumstances.\nC. Incorrect because client's objectives are specified in terms of risk tolerance and return requirements. Risk and\nreturn objectives are, therefore, likely to be part of the investment objectives section of the investment policy\nstatement and not part of the constraints section focusing on liquidity, time horizon, tax concerns, legal and\nregulatory factors, and unique circumstances.\nBasics of Portfolio Planning and Construction\n· describe the major components of an IPS\nDiscuss\nFilter\ni", "qhtml": null}, {"n": 28, "q": "A lifecycle fund will most likely:", "opts": ["maintain a fixed asset allocation of stocks and bonds.", "use tactical asset allocation to capture market opportunities.", "change the asset allocation as the fund nears its target date."], "ans": "C", "expl": "B. Incorrect because the asset allocation will change as described in the response rationale for the answer key, but\nwill change due to target date, not due to market opportunities. Tactical asset allocation is a short-term change in\nallocation to capture market opportunities.\nexample, a Target Date fund 40 years into the future might be 90 percent invested in equities and 10 percent in\nfixed income. As time passes, however, the fund would gradually change the mix of shares from equity to fixed\nincome.\nPortfolio Management: An Overview\n· describe mutual funds and compare them with other pooled investment products\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 29, "q": "Measuring the duration of a bond portfolio as a weighted average of the\nindividual bond durations:", "opts": ["is difficult to use as a measure of interest rate risk.", "assumes the yield curve shifts in a parallel manner.", "assumes the yield curve shifts in a non-parallel manner."], "ans": "B", "expl": "A. Incorrect because the weighted average of the individual bond durations that comprise the portfolio is easily used\nas a measure of interest rate risk.\nB. Correct because the weighted average of the individual bond durations that comprise the portfolio implicitly\namount in the same direction. In reality, interest rate changes frequently result in a steeper or flatter yield curve.\nC. Incorrect because the weighted average of the individual bond durations that comprise the portfolio implicitly\nassumes a parallel shift in the yield curve. A parallel yield curve shift implies that all rates change by the same\nYield-Based Bond Convexity and Portfolio Properties\ncalculate portfolio duration and convexity and explain the limitations of these measures\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 30, "q": "Analytical duration:", "opts": ["assumes that government bond yields and spreads are independent variables.", "is lower than empirical duration for high-yield bonds under market stress scenarios.", "uses statistical methods and historical bond prices to derive the price-yield relationship for bond portfolios."], "ans": "A", "expl": "A. Correct because the approach to estimate duration and convexity statistics using mathematical formulas is often\nreferred to as analytical duration. These estimates of the impact of benchmark yield changes on bond prices\none another.\ncredit spreads and benchmark yields are negatively correlated under this scenario, wider credit spreads will\nrelationship for specific bonds or bond portfolios.\nCurve-Based and Empirical Fixed-lncome Risk Measures\n· describe the difference between empirical duration and analytical duration\nDiscuss\nFilter", "qhtml": null}, {"n": 31, "q": "Which of the following best describes the process of changing the distribution of\nrisk outcomes by using derivatives?", "opts": ["Risk shifting", "Risk transfer", "Risk avoidance"], "ans": "A", "expl": "A. Correct because risk shifting refers to actions that change the distribution of risk outcomes. Risk transfer is often\nassociated with insurance, whereas risk shifting generally involves derivatives as the risk modification vehicle Risk\nintermediates that risk by moving it to yet another party.\nform of an insurance policy. Whereas risk transfer refers to actions taken that pass the risk on to other parties, risk\nshifting refers to actions that change the distribution of risk outcomes. Risk transfer is often associated with\ninsurance, whereas risk shifting generally involves derivatives as the risk modification vehicle.\nC. Incorrect because one method of managing risk is taking steps to avoid it altogether; however, avoiding risk may\nnot be as simple as it appears. It is difficult to completely avoid risk, but more importantly, it is unclear that every\nrisk should be completely avoided particularly if there are high costs associated with eliminating the risk. On the\nother hand, risk shifting refers to actions that change the distribution of risk outcomes.\nIntroduction to Risk Management\n· describe methods for measuring and modifying risk exposures and factors to consider in choosing among the\nmethods", "qhtml": null}, {"n": 32, "q": "All else being equal, for option-free bonds, the percentage price change for a\ngiven yield change is most likely greater for a bond:", "opts": ["with a high coupon than for a bond with a low coupon.", "with a short time-to-maturity than for a bond with a long time-to-maturity.", "when the market discount rate goes down than when the market discount rate goes up."], "ans": "C", "expl": "A. Incorrect because the coupon effect states that for the same time-to-maturity, a lower-coupon bond has a greater\namount.\nB. Incorrect because the maturity effect states that generally, for the same coupon rate, a longer-term bond has a\ngreater percentage price change than a shorter-term bond when their market discount rates change by the same\namount.\ndiscount rate goes down than when it goes up.\nFixed-lncome Bond Valuation: Prices and Yields\n· identify the relationships among a bond's price, coupon rate, maturity, and yield-to-maturity\nDiscuss\nFilter", "qhtml": null}, {"n": 33, "q": "A swap is similar to a series of implicit forward contracts with each contract\ncreated at a price that corresponds to the:", "opts": ["floating rate on the swap at each payment date.", "net cash flows on the swap at each payment date.", "fixed price of the swap with payments made at the same dates as the series of forward contracts."], "ans": "C", "expl": "A. Incorrect because, as described in the rationale for the correct answer, each forward contract is created at the\nfixed price that corresponds to the fixed price of a swap of the same maturity with payments made at the same\ndates as the series of forward contracts.\nB. Incorrect because, as described in the rationale for the correct answer, each forward contract is created at the\nfixed price that corresponds to the fixed price of a swap of the same maturity with payments made at the same\ndates as the series of forward contracts.\nof the same maturity with payments made at the same dates as the series of forward contracts.\nPricing and Valuation of Interest Rates and Other Swaps\ndescribe how swap contracts are similar to but different from a series of forward contracts\nDiscuss\nFilter\ni", "qhtml": null}, {"n": 34, "q": "The capital asset pricing model (CAPM) is based on the assumption that\ninvestors are risk:", "opts": ["averse.", "neutral.", "seeking."], "ans": "A", "expl": "A. Correct because the capital asset pricing model is based on the assumption that investors are risk-averse, utility-\nmaximizing, rational individuals.\nB. Incorrect because the capital asset pricing model is based on the assumption that investors are risk-averse, utility-\nmaximizing, rational individuals.\nC. Incorrect because the capital asset pricing model is based on the assumption that investors are risk-averse, utility-\nmaximizing, rational individuals.\nPortfolio Risk and Return: Part II\nexplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)\nDiscuss\nFilter\nDiscussion\nWhat do you want todiscuss...(required)", "qhtml": null}, {"n": 35, "q": "Based on put-call parity, an investor holding a long position in an underlying\nasset most likely creates a risk-free position by:", "opts": ["only selling a call.", "selling a put and buying a call.", "selling a call and buying a put."], "ans": "C", "expl": "A. Incorrect because selling a call would create the equivalent of holding a risk free bond and a short put position,\nwhich is not a risk-free position. So - Co = X/ (1+ r)T - po-\nB. Incorrect because selling a put and buying a call creates a synthetic long position, not a synthetic short position.\nHere, a synthetic short position needs to be created in conjunction with the existing long position to create a\nsynthetic risk-free position. In effect, selling a put and buying a call while already holding a long position in the\nunderlying creates a synthetic leveraged long position.\nC. Correct because the put-call parity relationship can be written as po - Co = X / (1+ r)T - So. where So represents\nthe price of the underlying asset, X represents the strike price, Po represents the price of a put with strike price X,\nand co represents the price of a call with strike price X. Thus, to convert an underlying position into a risk free\n1( + l) / X = o - od + os 'e! 'lieo e lles pue ynd e Ang o spaeu auo 'uosod\nOption Replication Using Put-Call Parity\nexplain put-call parity for European options\nDiscuss ①\nFilter", "qhtml": null}, {"n": 36, "q": "All else being equal, which of the following bonds most likely has the lowest\nprice?", "opts": ["Putable bond", "Callable bond", "Option-free bond"], "ans": "B", "expl": "A. Incorrect, as because a put provision has value to the bondholders, the price of a putable bond will be higher than\nthe price of an otherwise similar bond issued without the put provision. Similarly, the yield on a bond with a put\nprovision will be lower than the yield on an otherwise similar non-putable bond. The lower yield compensates the\nissuer for the value of the put option to the investor.\nB. Correct because callable bonds are advantageous to the issuer of the security. Put another way, the call option\nhas value to the issuer. For this reason, callable bonds have to offer a higher yield and sell at a lower price than\notherwise similar non-callable bonds.\nC. Incorrect callable bonds have to offer a higher yield and sell at a lower price than otherwise similar non-callable\nbonds.\nFixed-lncome Cash Flows and Types\n· describe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions\nthat benefit issuers and investors\nDiscuss\nFilter", "qhtml": null}, {"n": 37, "q": "If the portfolio's standard deviation of returns is 20.4%, the correlation between\nthe securities is closest to:", "opts": ["-1.", "0.", "1."], "ans": "C", "expl": "A. Incorrect because using a correlation of -1 to calculate standard deviation results in a standard deviation of 10.3%\nV0. and government agencies."], "ans": "C", "expl": "A. Incorrect because classification systems are developed and used by both commercial entities and various\ngovernmental agencies.\nB. Incorrect because classification systems are developed and used by both commercial entities and various\ngovernmental agencies.\nC. Correct because classification systems are developed and used by both commercial entities and various\ngovernmental agencies.\nIndustry and Competitive Analysis\n1 describe industry classification methods and compare methods by which companies can be grouped\nDiscuss\nFilter\ni\nDiscussion\nWhat do you want to discuss...(required)", "qhtml": null}, {"n": 39, "q": "Using the one-period binomial option pricing model, the value of an option will\nbe affected by:", "opts": ["the volatility of the underlying.", "a measure of investor risk aversion.", "the probabilities of up and down moves in the underlying."], "ans": "A", "expl": "A. Correct because the value of an option is determined by its risk-neutral expectation discounted at the risk-free\nrate. In a one-period binomial model, the risk-neutral probabilities are determined by the risk-free rate over the life\nof the option and the underlying asset's volatility (as measured by the up and down gross returns, Ru and Rd).\nTherefore, using the one-period binomial option pricing model, the value of an option will be affected by the\nvolatility of the underlying.\nB. Incorrect because an option's price is independent of investors' risk aversion and the probability of the underlying\nprice moving up (or down).\nC. Incorrect because an option's price is independent of investors' risk aversion and the probability of the underlying\nprice moving up (or down).\nValuing a derivative using a one-period binomial model\n· explain how to value a derivative using a one-period binomial model\nDiscuss\nFilter", "qhtml": null}, {"n": 40, "q": "An analyst uses a valuation model to estimate the value of an option-free bond at\ s... (required)", "qhtml": null}, {"n": 45, "q": "At initiation, the price of a forward contract is most likely:", "opts": ["less than the value of the forward contract.", "equal to the value of the forward contract.", "greater than the value of the forward contract."], "ans": "C", "expl": "A. Incorrect because, as described in the response rationale for the correct answer, the price of a forward contract at\ninitiation is not less than the value of the forward contract.\nB. Incorrect because, as described in the response rationale for the correct answer, the price of a forward contract at\ninitiation is not equal to the value of the forward contract.\nC. Correct because neither the long nor the short pays anything to the other at the initiation date of a forward\ncontract, the value of a forward contract when initiated is zero. On the other hand, The forward price that the\nparties agree to at the initiation date of the contract is a special price that results in the contract having zero value\nand prohibiting arbitrage. As this price agreed by the parties is a positive number, the price of a forward contract at\ninitiation is greater than the value of the contract, which is zero.\nPricing and Valuation of Futures Contracts\ncompare the value and price of forward and futures contracts\nDiscuss\nFilter", "qhtml": null}, {"n": 46, "q": "Which of the following statements about private debt is most accurate?\nMezzanine debt is:", "opts": ["funding provided to start-up or early-stage companies generating negative cash flow.", "subordinated to senior secured debt but senior to equity in the borrower's capital structure.", "a hybrid loan structure that combines different tranches of secured and unsecured debt into a single loan."], "ans": "B", "expl": "A. Incorrect as this describes venture debt rather than mezzanine debt. Venture debt is private debt funding that\ncash flow.\nB. Correct because mezzanine debt refers to private credit subordinated to senior secured debt but senior to equity\nin the borrower's capital structure.\nC. Incorrect as this describes unitranche debt rather than mezzanine debt. Unitranche debt consists of a hybrid or\nblended loan structure combining different tranches of secured and unsecured debt into a single loan with a single,\nblended interestrate.\nInvestments in Private Capital: Equity and Debt\n· explain features of private debt and its investment characteristics\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 47, "q": "Enterprise value is most useful when:", "opts": ["determining a measure of dividend-paying capacity.", "no market quotations for the company's debt are available.", "comparing companies with significant differences in capital structure."], "ans": "C", "expl": "A. Incorrect because it describes a FCFE valuation model not enterprise value. FCFE is a measure of dividend-\npaying capacity.\nB. Incorrect because in practice, analysts may have difficulty accurately assessing enterprise value if they do not\nwould not be most useful in this circumstance.\nC. Correct because enterprise value is most useful when comparing companies with significant differences in capital\nstructure. Since enterprise value is the sum of net debt and the market value of equity, it provides a more accurate\ncomparison of companies that are similar in terms of equity value but have significant differences in debt versus\ncash.\nEquity Valuation: Concepts and Basic Tools\n· describe enterprise value multiples and their use in estimating equity value\nDiscuss\nFilter\ni", "qhtml": null}, {"n": 48, "q": "Which real estate sector is the largest globally by market value?", "opts": ["Industrial", "Residential", "Commercial"], "ans": "B", "expl": "A. Incorrect because residential real estate is by far the largest market sector by value and size. Savills World\nvalues.\nB. Correct because residential real estate is by far the largest market sector by value and size.\nC. Incorrect because residential real estate is b "qhtml": null}, {"n": 52, "q": "Which of the following drivers of timberland returns is not applicable to\nfarmland?", "opts": ["Land prices", "Commodity prices", "Harvesting flexibility"], "ans": "C", "expl": "A. Incorrect because the value of the land may change over time for both farmland and timberland, and these land\nprice changes also contribute to the return on farmland and timberland investments.\nB. Incorrect because as part of the returns generated by selling the output from the land, both farmland and\ntimberland generate returns from price changes in their output. The market prices for agricultural products and\ntimber both of which are commodities may fluctuate considerably over time, and these prices combined with\nharvest quantities dictate the revenue generated by the sale of the land's output.\nC. Correct because farm products must be harvested when ripe, with little flexibility in production. By contrast,\ncharacteristic) and easily stored by simply not harvesting the trees (i.e., timberland's warehouse characteristic).\nNaturalResources\nexplain features of raw land, timberland, and farmland and their investment characteristics\nDiscuss θ\nFilter", "qhtml": null}, {"n": 53, "q": "An investor buys a stock for $108 on margin by posting 40% of the initial stock\nprice as equity. If the maintenance margin requirement for the position is 20%, a\nmargin call first occurs when the price falls below:", "opts": ["$64.80.", "$81.00.", "$86.40."], "ans": "B", "expl": "A. Incorrect because this is the stock price minus the initial margin requirement; $108 - ($108 x 40%) = $64.80.\n(Equity/share) / (Price/share) = ($43.20 + P - $108)/P = 20%, which can be solved for P = $81.00.\nC. Incorrect because this is the price 20% below the initial stock price ($108 x (1 - 20%) = $86.40) and not the level\nthat triggers the margin call.\nMarket Organization and Structure\nthe investor would receive a margin call\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 54, "q": "All else being equal, the bond with the greatest reinvestment risk is most likely:", "opts": ["Bond 1.", "Bond 2.", "Bond 3."], "ans": "A", "expl": "referred to as a bullet bond. The bond issuer receives the principal at settlement, makes periodic, fixed coupon\npayments, and repays the principal at maturity. Reinvestment risk and price risk are types of interest rate risk and\nhave an inverse relationship. Reinvestment risk is the risk of decreasing reinvestment returns on cash flows, which\noccurs when interest rates fall. Bond 1 amortizes principal on a monthly basis, which increases the reinvestment\nrisk relative to Bond 2 (which pays less frequently) or Bond 3 (which does not amortize at all).\nB. Incorrect because as Bond 2 has less reinvestment risk than Bond 1 because Bond 2 pays principal quarterly,\nrather than monthly.\nC. Incorrect because Bond 3 has less reinvestment risk than Bond 1 or Bond 2 since Bond 3 does not amortize\nprincipal.\nInterest Rate Risk and Return", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAEhCAIAAAD06Lo8AABv9ElEQVR42u3dZ1gUV9sH8DNbgaV3FgEFBAXsDTX2RcXee8FuNLEkihq7RmOPvWs0CWpi7w0bGhULFkAUUEF6b8uyfd4P53WufQAJ1pj4/33gWnZnZ2fOzOzec899zjA6nY4AAAAAAHxJGJZl0QoAAAAA8EXhoQkAAAAAAEEwAAAAAACCYAAAAAAABMEAAAAAAAiCAQAAAAAQBH8ILMtqNBpsIQAAAAD4goJguVweERGBLQQAAAAAKIcAAAAAAEAQDAAAAACAIBgAAAAAAEEwAAAAAMBHC4L1en1GRgbLsmhWAAAAAPicCT7gvO7evTtq1CgnJ6e5c+e2bNnyn1qlBw8e7Ny58969ewqFghBiYmLi5+c3ZswYf3//T78wCQkJS5cujY2NlUqlCxYs8PLy+uDzP3PmTGFhYann+/Xr5+7uzv379OnTbdu20cejRo3y8/N7t48bMGBAfn5+cXFxYGDgDz/8UHaCtWvXxsfH5+TkGBsbL1q0qEqVKtxLSqXywoULx44dKykpadasWdu2bX19fXEEAgAAwL8+CNbr9TqdLjk5ed68eVevXv1H1kej0YwdO7a4uJhLSBcWFt68efPJkyeXLl0yMTH52Avw9OnTIUOGEEKOHz/u7OysVqszMzMzMjJ4PJ5KpfrgHxcTE7N///68vLxSz9erV88wCJ47d250dDR9LJPJ3i0Ivn///qNHj+jjsp9ICLlz586uXbu0Wi399+uvv168eHHdunXpv0uXLj1+/LharSaEREVF7d+//+bNmzgCAQAA4F8fBHMyMjK6d+8+c+bMpk2bfsqVefr06cyZM+VyOSGkS5cuderU4fF4kZGRx44d ence via co-investing, where the investor invests in assets indirectly through the fund but also\nwhen an investor makes a direct investment in an asset without the use of an intermediary.\nfund and has rights to invest in the same assets directly without an intermediary. Many investors gain direct\ninvesting experience via co-investing, where the investor invests in assets indirectly through the fund but also\nwhen an investor makes a direct investment in an asset without the use of an intermediary.\nC. Correct because both statements are correct. In co-investing, an investor invests in assets indirectly through the\nfund and has rights to invest in the same assets directly without an intermediary. Many investors gain direct\ninvesting experience via co-investing, where the investor invests in assets indirectly through the fund but also\npossesses rights (known as co-investment rights) to invest directly in the same assets. Direct investing occurs\nwhen an investor makes a direct investment in an asset without the use of an intermediary.", "qhtml": null}, {"n": 56, "q": "A European call option has an exercise price of $80 and an option premium of\n$12. The price of the underlying is $75. The intrinsic value of the option is:", "opts": ["0", "5", "7"], "ans": "A", "expl": "A. Correct because the value of the option at expiration is the greater of either zero or the underlying price at\nexpiration minustheexerciseprice,which is typicallywritten as\nCT = Max(O,ST - X) This formula is also sometimes referred to as the exercise value or intrinsic value. Intrinsic\nvalue of call option = Max(0,$75 - $80) = $0.\nB. Incorrect because this would be the intrinsic value if it were a put option. The value of a European put at expiration\nis the exercise value, which is the greater of zero or the exercise price minus the value of the underlying. Intrinsic\nvalue of the hypothetical put option = Max(0,$80 - $75) = $5.\nC. Incorrect because this is the time value if it were a put option and not the intrinsic value of a call option. The time\nvalue of an option is the difference between the market price of the option and its intrinsic value. Time value of the\nput option = Market price -Intrinsic value = $12 - Max(0,$80 - $75) = $7.\nPricing and Valuation of Options\n·explain the exercise value, moneyness, and time value of an option\nDiscuss\nFilter", "qhtml": null}, {"n": 57, "q": "The free-cash-flow-to-equity model:", "opts": ["excludes net borrowings.", "can be used to value non-dividend paying stocks.", "requires an estimate of future dividend payments."], "ans": "B", "expl": "s  a n ss p sn u n o\ndistribution to common shareholders.\nB. Correct because analysts may also use FCFE valuation models for a non-dividend-paying stock.\nThese analysts assume that dividend-paying capacity should be reflected in the cash flow estimates rather than\nexpected dividends. FCFE is a mea- sure of dividend-paying capacity.\nEquity Valuation: Concepts and Basic Tools\ncash-flow-to-equity models\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 58, "q": "If an investor buys a 5-year, 8% annual-pay bond for 96.11, the bond's\nyield-to-maturity is closest to:", "opts": ["7.33%.", "8.32%.", "9.00%."], "ans": "C", "expl": "A. Incorrect because the yield-to-maturity is the discount rate, r, that equates the price of the bond to the present\n8/(1+r)² + 8/(1+r)3 + 8/(1+r)4 + (96.11+8)/(1+r)5 = 100, r = 7.33%. N=5, PV= -100, PMT=8, FV=96.11, I/Y = 7.33%.\nB. Incorrect because the yield-to-maturity is the discount rate, r, that equates the price of the bond to the present\nvalue of the coupon payments and par value. This answer computes the current yield instead of the yield to\nmaturity. The current yield is the sum of the coupon payments received over the year divided by the flat price.\n8/96.11~8.32%.\n%00:6 = 1 'LL'96 = g(4+L)/80l + ,(4+ L)/8 + g(4+L)/8 + z(4+ L)/8 + (4+ L)/8 :nje ued pue sjuaw<ed uodno au jo\nN=5,PV=-96.11PMT=8,FV=100,I/Y=9.00%.\nInterest Rate Riskand Return\n1calculate and interpret the sources of return from investing in a fixed-rate bond;\nDiscuss ①\nFilter", "qhtml": null}, {"n": 59, "q": "In an investment policy statement, which of the following investment constraints\nmost likely outlines a client's preference for environmentally sustainable investments?", "opts": ["Time horizon", "Unique circumstances", "Legal and regulatory factors"], "ans": "B", "expl": "A. Incorrect because the section about time horizon states the time horizon over which the investor is investing.\nB. Correct because the section on unique circumstances of the IPS should cover any other aspect of the client's\ncircumstances that is not covered by other sections and that is likely to have a material impact on the composition\nof the portfolio. ESG considerations - such as a preference for environmentally sustainable investments - fall into\nthis category.\nC. Incorrect because this section of the IPS should state any legal and regulatory restrictions that constrain how the\nregulatory factors.\nBasics of Portfolio Planning and Construction\nI describe the investment constraints of liquidity, time horizon, tax concerns, legal and regulatory factors, and unique\ncircumstances and their implications for the choice of portfolio assets\nDiscuss θ\nFilter", "qhtml": null}, {"n": 60, "q": "If the current share price is $60, a trader who wants to purchase the share at $58\nor less will most likely place a:", "opts": ["limit order.", "market order.", "stop-buy order."], "ans": "A", "expl": "A. Correct because a limit order conveys almost the same instruction as market order: Obtain the best price\nprice lower than a specified limit price when selling.\nB. Incorrect because a market order instructs the broker or exchange to obtain the best price immediately available\nwhen filling the order. The trader might purchase it at more than $58 by using market order.\nC. Incorrect because a stop-bu mited to a particular asset or industry that need not\naffect assets outside of that asset class. Examples of nonsystematic risk could include the failure of a drug trial,\nof avoiding nonsystematic risk through diversification by forming a portfolio of assets that are not highly correlated\nwith one another. A major auto producer failure will impact the auto industry but the impact can be mitigated\nthrough portfolio diversification.\nPortfolioRiskandReturn:Partll", "qhtml": null}, {"n": 63, "q": "Four years ago, a 5% coupon, annual-pay bond with a 10-year maturity was\nissued at par. If the current market discount rate is 7%, the price of the bond per 100 of\npar value is closest to:", "opts": ["90.34.", "90.47.", "93.23."], "ans": "B", "expl": "A. Incorrect because semi-annual coupons are used instead of annual coupons. Changing calculator inputs to N =\n12, PMT = 2.5, I = 3.5, the price is 90.3367 ~ 90.34.\nB. Correct because the price four years after issuance is 90.47:\nP。= PMT,/(1+r) +  + PMT,/(1+r) + FV/(1+r)\nwhere: PV.= the current market price or present value of the bond; PMTt = the coupon payment in period t; r = the\nyield to maturity per period; n = the number of periods remaining to maturity; FV = the maturity value of the bond.\nSo: P。 = 5/(1.07) + 5/(1.07)2 ++ 105/(1.07) = 90.4669 ~ 90.47\nUsing HP12C financial calculator for six years to maturity, FV = 100, N = 6, / = 7, PMT = 5, the PV or price =\n90.4669 ~ 90.47.\nC. Incorrect because the price is calculated for issuance six years ago (not four years), using annual coupons.\n' = ' =    s     =   p  s\n' = / '' =  ' =     s   sn  sono g  oi '\n93.1260 ~ 93.13 and is closest to the incorrect answer C.\nFixed-lncome Bond Valuation: Prices and Yields", "qhtml": null}, {"n": 64, "q": "The price of a fixed-rate corporate bond with an annual modified duration of\n7.15 increases from 92 to 97 per 100 of par value. If the government benchmark yield\nincreases by 5 bps, the estimated decline in the spread  a capital allocation line includes all possible combinations of the risk-free asset\nand an investor's optimal risky portfolio, not combinations of a risky asset and the minimum-variance portfolio.\nPortfolio Risk and Return: Part II\nexplain the capital allocation line (CAL) and the capital market line (CML)\nDiscuss ①\nFilter", "qhtml": null}, {"n": 68, "q": "Which of the following most likely provides the greatest redemption flexibility?", "opts": ["Hedge funds", "Private equity funds", "Funds of hedge funds"], "ans": "C", "expl": "A. Incorrect because alternative investments often have restrictions on redemptions (i.e., \"lockups\" and “gates\").\nperiod) before they are allowed to make withdrawals or redeem shares. Furthermore, investors may be required to\ngive notice of their intent to redeem; the notice period is typically 30-90 days. Therefore, a hedge fund does not\noffer the greatest redemption flexibility to an investor.\nB. Incorrect because private equity investments generally involve an initial capital commitment, but actual capital\nflows often lag that commitment because capital “calls\" are staggered over substantive periods of time. Private\nequity returns are frequently described in terms of the J-curve effect: a substantive initial capital commitment\npromise, followed by high initial fee drag, followed by the identification of longer-term growth or turnaround\nrealized. The component investments mature and are sold at various times, and the partnership finally closes—but\ngreatest redemption flexibility to an investor.\nmaintenance of added cash reserves, access to temporary bridge-loan financing, or the simple avoidance of less\nliquid hedge fund strategies.", "qhtml": null}, {"n": 69, "q": "The cumulative fee (in $ millions) earned by the hedge fund manager for the two\nyears is closest to:", "opts": ["5.2", "7.2", "9.2"], "ans": "C", "expl": "A. Incorrect because it assumes the management fee and performance fee accrued for the two-year cumulative\nreturn rather than on year-by-year basis:\nManagement fees for two years = 100 x 2% x 2 = 4.0\nPerformance fee for the two years = (110 - 4 - 100) x 20% = 1.2\nTotal fees to the hedge fund manager = 4.0+1.2 = 5.2.\nB. Incorrect because it includes a clawback of performance fee in Year 2:\nManagement fee for Year 1 = 125 x 2% = 2.5\nLevel I CFA Program—February 2025\nQuestion 69of 90\nTotal fees to the hedge fund manager = 4.0+1.2 = 5.2.\nB. Incorrect because it includes a clawback of performance fee in Year 2:\nManagement fee for Year 1 = 125 x 2% = 2.5\nPerformance fee for Year 1 = (125 - 2.5 - 100) x 20% = 4.5\nAssets under management (AUM) at beginning of Year 2 = 125 - 2.5 - 4.5 = 118 (high-water mark)\nManagement fee for Year 2 = 110 x 2% = 2.2\nTotal fees to the hedge fund manager = 2.5+4.5+2.2-2.0 ~ 7.2\nC. Correct because:\nManagement fee for Year 1 = 125 x 2% = 2.5\nPerformance fee for Year 1 = (125 - 2.5 - 100) x 20% = 4.5\nAssets under management (AUM) at beginning of Year 2 = 125 - 2.5 - 4.5 = 118 (high-water mark)\nManagement fee for Year 2 = 110 x 2% = 2.2\nAs the fund has a loss in Year 2 and the AUM falls below the high-water mark, there is no performance fee for Year\n2.\nTotal fees to the hedge fund manager = 2.5+4.5+2.2 = 9.2\nAlternative Investment Performance and Returns\ncalculate and interpret alternative investment returns both before and after fees", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAFcCAIAAABDVKQjAAEAAElEQVR42uydZ3hVVb7/9+m9n/RCCiSUhNAJLfQapCugjgVBHcEyCvYuFqQoCmNFZJAi0nsNkRIgEAghvfd6cnqv/xffv+s5N6B37txx1Ov6vMiTnOyz99qr/tavLVYgEGB+Z/j9/kAgwOFw8LvP5+PxeAyFQqFQKBQKhfJvgvU7FIKJKMwwDJvNpo1EoVAoFAqFQvn38nsUMX0+XyAQYLFYgUAAojCFQqFQKBQKhfJvhPs7LBMkYIZh4BFBoVAoFAqFQqEw/+c1wXCB8Pv9DoeDthCFQqFQKBQK5XcqBAcCgX+7b7HT6SwqKqLuEBQKhUKhUCiU36kQDO8FZHWgdUqhUCgUCoVC+RO5QwQCAZ/PR+uUQqFQKBQKhcL8nw+M8/l8HA6HxWLRODYKhUKhUCgUCvMn0QRTFwgKhUKhUCgUyp9OCIYCOBAI2Gw2g8FA65RCoVAoFAqF8n9fCPb7/V6vl8ViWa3WJ5988vr const CFG = {"title": "Mock Exam 1 — Session 2", "subtitle": "CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}
