<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "The stage at which a venture capital (VC) fund provides funding to a company immediately prior to the company's initial public offering (IPO) most likely occurs at the:", "opts": ["later stage.", "formative stage.", "mezzanine stage."], "ans": "C", "expl": "Venture capital financing\nFinancing Characteristics\nDivided into angel financing, seed stage, and early-stage financing\nAngel financing is from friends and family; venture capital (VC) funds begin to invest with seed stage\nFormative stage\nFinancing is through common and/or preferred stock\nCompany's management retains control but fund receives equity interest\nFinancing used to expand operations and/or marketing\nLater stage Management transfers control to VC\nVC finances company both by purchasing company's equity and by lending to it\nMezzanine stage Provides funding until the company completes an initial public offering\nVenture capital (VC) is a type of private equity investing that focuses on very young companies. VC funds provide financing at three general\nstages of the company's existence. Mezzanine stage financing is typically the final financing stage by a VC fund. It is a type of bridge financing\nthat permits the company to continue operations until it completes an initial public offering (IPO) of its stock.\n(Choice A) Later-stage financing is the second stage. CFA Institute identifies this as the stage where the VC fund purchases control of the\ncompany. Financing consists of debt and equity and is used to expand operations, but the VC fund still bears significant risk. The debt portion of\nthe financing provides a way for the VC fund to obtain priority for its investment if the company declares bankruptcy since debtholders' claims are\nsenior to equity owners' claims in bankruptcy.\n(Choice B) The first stage, which CFA Institute refers to as the formative stage, consists primarily of the VC purchasing a minority equity\ninvestment in the company. The financing permits the company to develop its product, and management (typically the company's founders)\nretains control.\nThings to remember:\nVenture capital (VC) investing focuses on very young companies (ie, start-ups). VC funds provide financing at three distinct stages of a company's\nexistence. Formative stage financing occurs while the company's existing management controls the company. Later-stage financing is marked by\nthe company transferring control of itself to the VC investors. Mezzanine financing provides interim support until the company completes its IPO.\nExplain features of private equity and its investment characteristics", "qhtml": null, "explfigs": null}, {"n": 2, "q": "Which of the following best describes an attractive feature of unitranche private debt?", "opts": ["Simplifies debt issuance for the borrower", "Conversion rights allow investors to convert into equity", "Investors get a blended range of risk exposures in a single investment"], "ans": "A", "expl": "Tighter lending standards and regulations have led to a rapidly expanding private debt market as private institutions (eg, private equity, venture\ncapital) step in and disintermediate (ie, reduce the role of) traditional bank lending and investment bank underwriting.\nUnitranche debt has become particularly attractive for individual small- to midsize borrowers since it simplifies and accelerates the private debt\nissuance process. Typically, a private debt firm will:\nbundle what would normally be a company's multiple debt issues of senior and subordinated debt into a single blended loan transaction\nwith a single offering document and a blended interest rate, and then\nrepackage and resell this loan to investors.\nThe unitranche structure is particularly attractive for firms that would otherwise be required to negotiate each tranche as a separate transaction\nwith separate offering documents, covenants, and debt service schedules. Instead, this is now undertaken by the private debt firm that structured\nthe loan.\n(Choice B) Conversion rights that allow investors to convert into equity are a common feature in leveraged buyout (LBO) and venture mezzanine\nfinancing but are not a feature of unitranche debt.\n(Choice C) The borrower (not the investors) benefits from a single loan structure. Investors must still choose the appropriate tranche and the\nassociated risk/reward associated with that portion of the deal.\nThings to remember:\nThe unitranche structure simplifies private debt issuance for a single borrower, as financing and debt service are bundled into a single loan. The\nloan comprises a blend of senior and subordinated debt, which the private debt firm then divides into various tranches to resell to investors.\nExplain features of private debt and its investment characteristics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6oAAAL8CAIAAABmvt8XAAC8W0lEQVR42uz9bWyj53nnDR9KPO3W3hnRaIEObE9E3bexRpzUwwEcxPHCEYlss04QW2ScYrJ1EJFpHBvwohSb2Auka1N0NgE2dkqxWANOnYyowt7toHFE2kHivgSkYqyTIl6IcmMXc+PeR1Ts9dM8G3gujdpk04w9z4e/dfSaiy+iNNLoZX6/D4J06bzOt+uFB//ncRzn0Llz5wwAAAAA4NLgbUwBAAAAAGD+AgAAAABg/gIAAAAAYP4CAAAAAGD+AgAAAABg/gIAAAAAYP4CAAAAAGD+AgAAAABg/gIAAAAAYP4CAAAAAGD+AgAAAABg/gIAAAAA5i8AAAAAAOYvAAAAAADmLwAAAAAA5i8AAAAAAOYvAAAAAADmLwAAAAAA5i8AAAAAAOYvAAAAAADmLwAAAAAA5i8AAAAAAOYvAAAAAGD+AgAAAABg/gIAAAAAYP4CAAAAAGD+AgAAAABg/gIAAAAAYP4CAAAAAGD+AgAAAABg/gIAAAAAYP4CAAAAAGD+AgAAAACcz2VMAewU7XbbzKrVqv5MJpP+s3+xzjIbbXfdRkUQBLFYbB9MdbPZbDab+j2bzZpZPB7fQ/3fKxciCAIz26P3zPT0dL1e1++6PSYmJi7wWdtVVKtVvUzMbGpq6hK8mX3U8Xhc74GdqmpPPylgqL8AAAAAAIb6C2ADq7+lUil8sJf6Gy524epvn0alkuZyOTObmZnZH+pXs9n0IWtEe0L9bbfbuhBjY2M7KNcNeCfncrmxsTHbUWVxcxQKBTObnp6OHB8fH99PL5zZ2VlfA7n41ygIAj2DrVar0WjsyAyEXwIXqP5uriqJvqVSqdVqmdlOzQOAof4CAAAAgKH+AuxjYrGYa7oREXR6elpKGOwsEoeOHTumP6Wq0k/bNq9ffzTMbGZmRr/sLQfxdUkkEjvY+ujoqLTP/eROvYlJMLMgCC7lSQDMX4Ad+xTsteimzyew3RFDRj93xEBMp9P78qYql8vcKjwvAIbzAwAAAAAY6i+A7amQHS1Am9nc3JwO1mo1MwuCQDpWsVgMr3u2Wi33cJiYmDCzbDarIzoxXL9WgcvlslqZnZ3Vv4r company being acquired, not the PE firm. The\ncompany's assets serve as collateral for the loan, and its cash flows pay the interest and principal on the debt.\nDue to the highly leveraged nature of the transaction, prudent company selection is critical to an LBO's success. Acquirers look for firms that can:\nservice the debt financing,\nimprove their performance, and\nincrease their value.\nPublic companies are often the target of an LBO. By targeting companies with a depressed stock price (ie, undervalued stock), the PE firm\ncan structure the deal at a premium to the current market price, thus enticing existing shareholders to sell while still paying less than intrinsic value\nfor the company. Once the company's performance improves and its value increases, the company is sold again in the public markets or to\nstrategic buyers.\n(Choice B) Intangible assets are difficult to appraise and use as collateral. Unencumbered physical assets (ie, not intangible assets) that can be\nused as loan collateral make a company more attractive as an LBO target.\n(Choice C) PE firms add value by improving the efficiency of inefficiently managed companies, thus raising their value.\nThings to remember:\nAn attractive target company in a leveraged buyout is one that can service the debt, improve its performance, and increase its value. Key\ncharacteristics are an undervalued stock price, agreeable management and shareholders, inefficient operations, robust and predictable cash flow,\nlow leverage, and unencumbered physical assets.\nExplain features of private equity and its investment characteristics", "qhtml": null, "explfigs": null}, {"n": 4, "q": "Which of the following best describes a characteristic of private equity? Private equity funds:", "opts": ["are typically passively managed.", "can invest in public or private companies.", "are more liquid than traditional investments."], "ans": "B", "expl": "Types of private equity (PE) strategies\nType Characteristics\nPublic company is converted to a private company\nPurchase price financed through debt and equity\nLeveraged buyout\nTarget’s assets collateralize the debt and its cash\nflows service the debt\nUsually invests in start-up companies with high growth\nVenture\npotential\ncapital\nInvestments can be equity, debt, or both\nDevelopment Typically involves mature companies\ncapital PE financing allows company to expand\nPE fund buys debt or companies in bankruptcy or in\nDistressed default on debt\ninvesting Assumes that company can be turned around with\nnew management\nPrivate equity is a type of alternative investment that encompasses both direct investment and indirect investment through private equity funds.\nInvestments may be made in:\nprivate companies, as in venture capital investing; or\npublic companies, with the goal of taking them private.\nInvestments in private companies range from seed capital for startups and other early-stage companies to mezzanine financing to prepare a\ncompany planning for its initial public offering. Investments in public companies typically entail leveraged buyouts to take large companies private.\n(Choice A) Private equity funds are typically actively managed. Funds are often actively involved with the companies they invest in, which can\ninclude replacing management, combining companies to realize synergies, or providing support functions. Managers' goals are to help small\ncompanies grow and help poorly managed companies improve their operations and strategy to grow their investments.\n(Choice C) Private equity investments are significantly less liquid than traditional investments (eg, stocks, bonds). For private equity funds,\ninvestments often take years to realize any gains. Investors in private equity funds often face lockup periods and redemption fees, making these\ninvestments illiquid.\nThings to remember:\nPrivate equity invests in private companies or in public companies with the intent of taking them private. Private company investments range from\nseed capital to mezzanine financing. Investments in public companies include leveraged buyouts of large companies.\nExplain features of private equity and its investment characteristics", "qhtml": null, "explfigs": null}, {"n": 5, "q": "Which of the following best describes a characteristic of an attractive leveraged buyout target company?", "opts": ["Cyclical profitability profile", "Unencumbered physical assets", "High level of operating efficiency"], "ans": "B", "expl": "A leveraged buyout (LBO) occurs when a private equity (PE) firm purchases effectively all the outstanding shares of a publicly traded company\nusing equity capital and a significant amount of debt (often 80% or more of the transaction value). PE firms raise money through investment funds\nwith the intention of completely acquiring businesses.\nDue to the highly levered nature of the transaction, selecting a company with the right attributes is critical to an LBO's success. One of an LBO's\ndefining characteristics is that the transaction is structured so that the borrower is the company being acquired. Therefore, having unencumbered\nphysical assets that can be used as loan collateral is one factor that makes a target more attractive. Other attractive characteristics include:\nan undervalued stock price,\nagreeable management and shareholders,\ninefficient operations,\nrobust and predictable cash flow, and\nlow leverage.\nOnce the restructuring is complete, the company is sold in public markets or to strategic buyers at a price that constitutes a substantial return on\nthe PE investors' original equity investment.\n(Choice A) A cyclical profitability profile presents the risk of being unable to service the considerable amount of debt used to fund the transaction.\n(Choice C) PE firms search for opportunities with the potential to cut costs or improve operating efficiency. Therefore, a company that is already\noperating at a high level of efficiency is not an ideal LBO target.\nThi  "Mezzanine financing\nUsed in Characteristics\nHybrid security structure issued in place of straight\nhigh-yield debt\nLeveraged\nEquity conversion optionality or attached warrants\nbuyout (LBO)\nSubordinate to all other forms of debt financing\nHigh coupon rate\nUsed as bridge financing to sustain a company\nVenture\nbacked by private venture capital until it receives\ncapital\nproceeds from an upcoming initial public offering\n\"Mezzanine\" commonly refers to an intermediate floor in a large building (eg, hotel), above the ground floor but below the second floor. The term\nmezzanine financing is figurative and refers to a hybrid type of financing within a company's capital structure, positioned between common\nequity and debt. Key characteristics of debt in mezzanine financing include:\nhigh coupon rates,\nthe most junior (ie, most subordinated) debt tranche, and\nhybrid securities that are convertible into common equity.\nA leveraged buyout (LBO) occurs when a private equity firm purchases the outstanding shares of a publicly traded company. Mezzanine debt is\nthe riskiest source of debt capital in these transactions, but it can provide a significant benefit to investors if the common equity increases in value.\nIn venture capital, mezzanine debt is used to bridge the target company's cash needs until proceeds from an initial public offering (IPO) are\nreceived. The ability to convert the debt into common equity once the IPO occurs is the primary attraction for investors.\n(Choice B) A payment-in-kind (PIK) bond allows the issuer to pay coupon interest in cash or in additional bonds (ie, in kind). PIK bonds are often\nused to fund LBOs but are not convertible into common equity.\n(Choice C) Contingent convertible bonds (CoCos) are not used in LBOs. Financial institutions issue CoCos since the bonds are classified\nfavorably for regulatory capital purposes (ie, as equity). Automatic conversion can occur when the issuer suffers losses that cause owner's equity\non the balance sheet to fall below minimum regulatory requirements.\nThings to remember:\nA mezzanine debt issue has a hybrid position within a company's capital structure since it is convertible into common equity. Mezzanine debt is\noften used in leveraged buyouts.\nExplain features of private debt and its investment characteristics", "qhtml": null, "explfigs": null}, {"n": 7, "q": "If venture capitalists are investing in a company by providing funds to initiate commercial production, which of the following best describes the company's financing stage?", "opts": ["Early", "Seed", "Angel"], "ans": "A", "expl": "Venture capital financing\nFinancing Characteristics\nDivided into angel financing, seed stage, and early-stage financing\nAngel financing is from friends and family; venture capital (VC) funds begin to invest with seed stage\nFormative stage\nFinancing is through common and/or preferred stock\nCompany's management retains control but fund receives equity interest\nFinancing used to expand operations and/or marketing\nLater stage Management transfers control to VC\nVC finances company both by purchasing company's equity and by lending to it\nMezzanine stage Provides funding until the company completes an initial public offering\nVenture capital (VC) is a type of private equity investing that focuses on very young companies. VC funds provide financing at three general\nstages of a company's existence: the formative stage, the later stage, and the mezzanine stage. The earliest investment in the company is done\nin the formative stage. The formative stage consists primarily of a minority equity investment in the company that helps it with product\ndevelopment and allows management (typically the company's founders) to retain control.\nFormative-stage financing can be subdivided into:\nAngel investing—Angel investors, who are usually friends and family of the company's founder(s), provide equity capital, rather than VC\nfunds. This is often done only in the beginning, idea stage of the business (Choice C).\nSeed-stage financing—Seed capital provides funds that take an idea to a new level by financing market research, product development,\nand marketing. This is typically the first stage when VC funds are invested in a company (Choice B).\nEarly-stage financing—An early-stage investment allows the company to begin commercial production by providing the necessary funds to\nbring the product to market. This is the last round of formative-stage financing.\nThings to remember:\nVenture capital funds provide financing at three general stages of a company's existence: the formative stage, the later stage, and the mezzanine\nstage. The formative stage can be subdivided into angel investing, seed-stage financing, and early-stage financing. Early-stage financing\nprovides the necessary capital to move the product from the development stage into commercial production and sales.\nExplain features of private equity and its investment characteristics", "qhtml": null, "explfigs": null}, {"n": 8, "q": "A feature of mezzanine debt is that it most likely:", "opts": ["offers conversion rights to investors.", "is used for funding early-stage companies.", "offers more stable returns than direct lending."], "ans": "A", "expl": "Private debt generally refers to nonbank entities (eg, a private debt fund, an investment firm's private debt arm) lending money to private\ninstitutions. It can be broadly classified into four categories.\nDirect lending: private firms raise capital to lend directly to borrowers\nMezzanine debt: subordinated debt typically used for acquisitions or buyouts\nVenture debt: lending for start-up companies that have low or negative cash flow\nDistressed debt: purchases of debt of mature companies facing financial problems\nMezzanine debt provides capital in the form of subordinated debt, which has higher risk. Investors are typically compensated for this risk\nthrough a combination of higher interest rates and features like conversion rights, in which investors have the right to convert the debt to equity\nunder specified conditions.\n(Choice B) Venture debt is generally used to fund start-ups and early-stage companies. Mezzanine debt typically is used for acquisitions and\nbuyouts.\n(Choice C) Direct lending is associated with relatively lower risk and more stable returns than mezzanine debt, which tends to be riskier with\nmore volatile returns.\nThings to remember:\nMezzanine debt is a form of subordinated debt that typically is used in acquisitions and buyouts. It is considered riskier than other forms of debt.\nIt is also associated with higher returns, as well as features such as conversion rights, to compensate investors for the higher risk.\nExplain features of private debt and its investment characteristics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2oAAALtCAIAAADWiwCIAACdVklEQVR42uz9f3SV1Z33/7+sKCgJiVGQIMI5YpCimESgTgXryWjtXYwfEpj2Xqa9JXGmIkxbk2orfmatO8lnrRmoxSZMHRxtx0TvGtfdDiZ8+TGr/pgcFbQWMIkIRQLmCJgAqSEhQQGxfv94k+3FOUlIchLIj+fjD9Y54Zx9rmtfVzib93u/977giy++EAAAANA9X6ELAAAAwPARAAAADB8BAADA8BEAAAAMHwEAAMDwEQAAAAwf6QIAAAAwfAQAAADDRwAAADB8BAAAAMNHAAAAMHwEAAAAw0e6AAAAAAwfAQAAwPARAAAADB8BAADA8BEAAAAMHwEAAMDwkS4AAAAAw0cAAAAwfAQAAADDRwAAADB8BAAAAMNHAAAAMHykCwAAAMDwEQAAAAwfAQAAwPARAAAADB8BAADA8BEAAADD3gi6AOi+YDDofRoIBOgTAICIPgIAAAAMH4HeaG5ubm5uzsnJueCCCy644IK0M11wwQU5OTk5OTnNzc1D43wLCwsv8AiLtg5thYWF3tOPPPdQKBQKhYqLi/uwk4PBYL92sh1w9Mes/o/rV1RUVFRU8G8OIJLXwGCXlpYmqbq6urMXlJaW2gsqKyslxcfH02lDdXBpg7CUlJTc3NxBccCSiouLU1JSJA3MY25ubs7Ly7Pfo4KCAkkZGRncbICIPgIAAEBEH4HhoKKiwsUdLShSVFTk8/kkhUIhSXl5eZZuq66utjDkoIhLoUOLFi2SdNttt9lTC9o5FhsbRAbFAbtfHAAi+ggAAAARfQSGm5qaGvf4wQcflGShR/egqKjITfZfu3atOoo+2gtcU3FxcbbcT1hwq7m52UU6rXGfz2eBmQ8//HDy5MmSsrOz3YsllZaWtrS0SEpOTu5wxpiryYiPj7ePCwaDr732miRrMCMjo6eTNZubm+2MPvzww7i4OBeXdT3To6bsCF3nzJ8/P7JnvKfsPtp+OHnyZOtM76fbK7vozOTk5G7OsQtrKuywXa+qvUjFDs8uil0XO7w+mRFrAe+KigrXfocf4b2RvGcRDAbtNSkpKd4bw3WRiwJmZ2fbW+wT3RXp8CNc93Z479nN1uEtao 4nsOzdA5dPM55F7eMQgnrNRVHc73czOxwOKkMu9tLK+rrobqsl7Ut95jfwWwIAALwnPl6vV0U6dZbbtp03r3POXdf9ZOmUkh6pqkofbreb4uMiC4YQttvt/JGcsx48Ho+6Z7/fL9av69o+3qr0HAkAAACjeQ0AAAD7tdVH7zirI+x9ZE3M9H2vTvS3yrIchsHMHo+HL6URGdUvi6LQmMvlctHiTdNodxUjq6rSUjlnPeid9HEcVad8Pp+6stls+DkBAADeEB89Jupr13WKdNM0mVkIoSzL+Q1fiTGqD75er30aerfb2Ud/fJom7fV6vTyk6oO3pG32MuUi4y7O7vnh0T8AAAAwmtcAAACwd1UfNbZS17UGor3KqMLh+XzWmYvDMOhgyBijqoPqLHuhMaXkY9Fa08zUg9ZQTkpJS43jqHrk6XTSdt+WEmOMWpzRGQAAgDfHR0W3pmkUBz2f6Xrbtp4yNRa9Wq08L85P4fErfd8vzvr5fF1vSeqVx/ku9vXZQNpIp4WHEDi7BwAAwGheAwAAwP7EnxYCAAAARvURAAAAxEcAAAAQHwEAAEB8BAAAAPERAAAAxEcAAACA+AgAAADiIwAAAP6Tf8JJTfzZG/ECAAAAAElFTkSuQmCC"]}, {"n": 9, "q": "Which of the following hedge fund strategies is best described as zero-beta?", "opts": ["Merger arbitrage", "Convertible arbitrage", "Distressed/restructuring"], "ans": "B", "expl": "Hedge fund strategy Key concepts\nBuys undervalued stocks; shorts overvalued stocks\nMarket-neutral Combines equity securities to create a zero-beta portfolio\nSeeks to eliminate market risk, focus on idiosyncratic factors\nExploits short-term pricing discrepancies between related securities\nRelative-value\nMost common example is convertible arbitrage\nAttempts to profit from corporate events\nEvent-driven\nExamples include merger arbitrage, distressed/restructuring\nHedge fund is a broad term used to describe numerous types of private investment partnerships that pursue high risk–adjusted returns by\nengaging in unconventional investing strategies, such as the use of leverage, short positions, and derivatives.\nMarket-neutral is a classic equity hedge fund strategy that consists of buying undervalued stocks and shorting overvalued stocks with\nsimilar fundamental (eg, products, industry) or quantitative (eg, value, growth) characteristics to create a portfolio that is immune from\nmarket-level risks and is theoretically zero-beta.\nA relative-value strategy seeks to exploit short-term pricing discrepancies between related securities.\nConvertible arbitrage combines characteristics of a market-neutral and a relative-value strategy. It attempts to profit from mispricing between the\nembedded equity option in a convertible bond and the underlying common stock. The strategy involves simultaneously buying a convertible\nbond and selling common stock of the same company to capture a profit spread. When investors \"go long\" the embedded equity option in the\nconvertible bond and short the common stock, the net effect is a zero-beta equity position.\n(Choice A) Merger arbitrage pairs merger partners in long and short positions. It is an event-driven, not a market-neutral, strategy.\n(Choice C) Distressed/restructuring strategies focus on buying debt or equity of companies in or near bankruptcy. These strategies are not\nmarket neutral.\nThings to remember:\nA market-neutral strategy consists of buying undervalued stocks and shorting overvalued stocks to create a portfolio that is immune from market-\nlevel risks and is zero-beta. A convertible arbitrage strategy combines characteristics of market-neutral and relative-value strategies. It involves\nsimultaneously buying a convertible bond and selling common stock of the same company.\nExplain features of private equity and its investment characteristics", "qhtml": null, "explfigs": null}, {"n": 10, "q": "A small private equity fund is looking to exit a large investment at the highest potential valuation while generating positive publicity. Which of the following exit strategies is most appropriate for the fund?", "opts": ["Trade sale", "Recapitalization", "Initial public offering"], "ans": "C", "expl": "Pros and cons of private equity exit strategies\nPros Cons\nFast, immediate cash exit Management and employee opposition due to\nPotentially high valuations due to corporate layoff concerns\nTrade sale (Corporate\nsynergies Few buyers\nbuyer)\nLow transaction costs and disclosure Valuation likely lower than with initial public\nrequirements offering\nSecondary sale Lower valuations\nRelatively fast exit\n(Investor group or private May be complex\nCapital can be redeployed in other opportunities\nequity firm) More disclosure requirements\nHighest valuation potential Longest lead times\nInitial public offering Management's preferred option High transaction costs\n(Sold to the public) Positive publicity for the private equity firm Potential lockup period\nPotential long-term equity upside High disclosure requirements\nA private equity fund will typically sell its investment by using one of several exit strategies. An initial public offering (IPO) is a strategy more\noften used for larger companies with attractive growth profiles. IPOs involve the portfolio company selling all or a portion of its equity shares\nto the general public, including some or all of the shares owned by the private equity fund.\nSince the sales price of an IPO is not negotiated but instead determined by auction in a public exchange, the shares have both unlimited upside\npotential and a larger pool of potential investors than a trade or secondary sale. Therefore, an IPO has the potential to realize the highest exit\nprice for the private equity fund. The high-profile nature of an IPO also can create the greatest amount of positive publicity for the fund.\n(Choice A) A trade sale is a private sale to a competitor and is not likely to generate the same level of publicity as an IPO. Publicity is also less\nlikely to be positive due to the potential for layoffs at the portfolio company.\n(Choice B) Recapitalization is not an exit from an investment but an increase in or introduction of debt at the portfolio company, allowing the\nprivate equity fund to pay itself a dividend.\nThings to remember:\nIPOs have the potential to realize the highest exit price for a private equity fund's investment. The sales price of an IPO is determined by auction\nin a public exchange, and thus the shares have both unlimited upside potential and a larger pool of potential investors than a trade or secondary\nsale. IPOs can also generate positive publicity for the fund.\nExplain features of private equity and its investment characteristics", "qhtml": null, "explfigs": null}, {"n": 11, "q": "Which of the following best describes a private equity recapitalization? A private equity firm:", "opts": ["sells a portfolio company to a strategic industry buyer.", "provides mezzanine financing to facilitate a leveraged buyout.", "pays itself a cash dividend by increasing leverage in a portfolio company."], "ans": "C", "expl": "Private equity exit strategies\nTrade sale\nInitial public offering\nSecondary sale\nWrite-off or liquidation\nRecapitalization\nA private equity firm will typically exit its investment in a portfolio company at a higher valuation after improving the company's operational and\nfinancial performance. The resulting gain is the basis for the private equity firm's return on its investment. Exits of successful investments can\noccur through sales to strategic industry buyers (trade sales) or other private equity firms (secondary sales) or through initial public offerings.\nA recapitalization transaction is not truly an exit since the private equity firm remains invested, but it provides a cash return to the private equity\nfirm and is often a precursor to an exit. In a recapitalization, a private equity fund increases the portfolio company's debt burden to finance a\ncash dividend payout to the private equity firm.\n(Choice A) In a trade sale, a portfolio company is sold to a strategic industry buyer.\n(Choice B) In a leveraged buyout, a private equity firm acquires another business using large amounts of debt, usually funded by the company\nbeing acquired. Mezzanine financing is the riskiest source of debt capital in these transactions.\nThings to remember:\nIn a recapitalization, a private equity fund seeks to maximize its return by increasing a portfolio company's debt burden specifically to pay the\nprivate equity firm a cash dividend. Although a recapitalization is not truly an exit since the private equity firm remains invested, it is often a\nprecursor to an exit.\nExplain features of private equity and its investment characteristics", "qhtml": null, "explfigs": null}, {"n": 12, "q": "After a successful turnaround, a private equity fund is structuring a transaction to exit from a portfolio company. After learning the proposal's details, company management and the employees are strongly opposed. Based only on this information, which exit strategy is most likely being planned?", "opts": ["Trade sale", "Secondary sale", "Initial public offering (IPO)"], "ans": "A", "expl": "Pros and cons of private equity exit strategies\nPros Cons\nFast, immediate cash exit Management and employee opposition due to\nPotentially high valuations due to corporate layoff concerns\nTrade sale (Corporate\nsynergies Few buyers\nbuyer)\nLow transaction costs and disclosure Valuation likely lower than with initial public\nrequirements offering\nSecondary sale Lower valuations\nRelatively fast exit\n(Investor group or private May be complex\nCapital can be redeployed in other opportunities\nequity firm) More disclosure requirements\nHighest valuation potential Longest lead times\nInitial public offering Management's preferred option High transaction costs\n(Sold to the public) Positive publicity for the private equity firm Potential lockup period\nPotential long-term equity upside High disclosure requirements\nPrivate equity (PE) funds generally invest in either early-stage start-up companies or underperforming businesses. The PE fund's management\nis actively involved in how the acquired business is run, and on average holds an investment for about five years. In a successful investment,\nthe fund realizes the value that has been created by exiting the investment through a trade sale, secondary sale, or initial public offering\n(IPO).\nA trade sale is typically the option least preferred by a company's management and employees due to concerns over job security. A trade sale\noccurs when a portfolio company is sold to a corporate buyer (ie, competitor), with the rationale that the buyer can gain market share and that\ncorporate synergies will be created by the acquisition. Cost-cutting often makes up the largest portion of these synergies, including reduction in\noverhead expenses through consolidating offices/facilities and firing duplicate staff from the acquired company.\n(Choice B) In a secondary sale, management and employees would likely be retained and their situation would remain largely unchanged.\n(Choice C) Management's preferred option is an IPO since their position would likely be maintained and they might benefit financially.\nThings to remember:\nA trade sale occurs when a portfolio company is sold to a corporate buyer. A trade sale is typically opposed by a company's management and\nemployees since layoffs are likely to occur.\nExplain features of private equity and its investment characteristics", "qhtml": null, "explfigs": null}];

const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<!--qnote-feature-start-->
<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
