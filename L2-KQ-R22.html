<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 22 — Private Company Valuation · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;

  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}

  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;

    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}

  }
</style>

<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}

  .qtext{font-size:16px;line-height:1.65}

  .pp-topic.set{color:#a855f7;background:color-mix(in srgb,#a855f7 12%,transparent)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;

}
</script>

<script>
const DATA = [{"n": 1, "q": "Compared to a public company, it is most likely that as a private company Timber Industries will have greater:", "opts": ["focus on the short-term.", "quality and depth of management.", "concerns related to taxes."], "ans": "C", "expl": "Private firms may be more concerned with taxes than public firms due to the impact of taxes on private equity owners/managers. Private firms are likely to have lower quality and depth of management, as private firms are likely to be smaller and thus may not be able to attract as many qualified applicants as public firms. Private firms are more likely to focus on the long-term than public companies, since in most private firms, external shareholders have less influence and the firm is able to take a longer-term perspective.", "explhtml": "<p>Private firms may be more concerned with taxes than public firms due to the impact of taxes on private equity owners/managers. Private firms are likely to have lower quality and depth of management, as private firms are likely to be smaller and thus may not be able to attract as many qualified applicants as public firms. Private firms are more likely to focus on the long-term than public companies, since in most private firms, external shareholders have less influence and the firm is able to take a longer-term perspective.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 1–4<\/summary><div class=\"vig-body\"><p>Paul Smith is an analyst performing valuations for Lumber Limited. Smith has been given a project to value Timber Industries, a firm that Lumber Limited is considering acquiring. Smith is aware that a number of characteristics distinguish private and public companies, and that these characteristics must be considered during his process of valuing Timber Industries. A number of issues complicate Smith's valuation: Timber Industries pays its CEO well below a market- based compensation figure, leases a warehouse at an above-market rate, and owns a vacant office building that is not needed for core operations. Smith is also aware that discounts and premiums based on control and marketability must be considered in his valuation of Timber Industries.<\/p><\/div><\/details><div class=\"pp-topic\">Module 22.1, LOS 22.a<\/div><div class=\"qtext\"><p>Compared to a public company, it is most likely that as a private company Timber Industries will have greater:<\/p><\/div>", "subj": "equity"}, {"n": 2, "q": "One valuation method that Smith is considering for Timber Industries involves using a growing perpetuity formula to estimate the value of intangible assets, and then adding this value to the values of working capital and fixed assets. This method is most accurately described as the:", "opts": ["free cash flow method.", "excess earnings method.", "capitalized cash flow method."], "ans": "B", "expl": "The excess earnings method values tangible and intangible assets separately; this method is useful for small firms and when there are intangible assets to value. In the free cash flow method, a firm is valued by discounting a series of discrete cash flows plus a terminal value. In the capitalized cash flow method, a firm is valued by discounting a single cash flow by the capitalization rate.", "explhtml": "<p>The excess earnings method values tangible and intangible assets separately; this method is useful for small firms and when there are intangible assets to value. In the free cash flow method, a firm is valued by discounting a series of discrete cash flows plus a terminal value. In the capitalized cash flow method, a firm is valued by discounting a single cash flow by the capitalization rate.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 1–4<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Smith is an analyst performing valuations for Lumber Limited. Smith has been given a project to value Timber Industries, a firm that Lumber Limited is considering acquiring. Smith is aware that a number of characteristics distinguish private and public companies, and that these characteristics must be considered during his process of valuing Timber Industries. A number of issues complicate Smith's valuation: Timber Industries pays its CEO well below a market- based compensation figure, leases a warehouse at an above-market rate, and owns a vacant office building that is not needed for core operations. Smith is also aware that discounts and premiums based on control and marketability must be considered in his valuation of Timber Industries.<\/p><\/div><\/details><div class=\"pp-topic\">Module 22.3, LOS 22.h<\/div><div class=\"qtext\"><p>One valuation method that Smith is considering for Timber Industries involves using a growing perpetuity formula to estimate the value of intangible assets, and then adding this value to the values of working capital and fixed assets. This method is most accurately described as the:<\/p><\/div>", "subj": "equity"}, {"n": 3, "q": "The asset-based approach to private company valuation that Smith is considering for Timber Industries is most likely to be appropriate in the case of a:", "opts": ["finance firm such as a bank.", "mature company with many intangible assets.", "firm with strong profits and growth potential."], "ans": "A", "expl": "The asset-based approach is usually not used for most going concerns, but is appropriate for troubled firms, finance firms, investment companies, firms with few intangible assets, and natural resource firms. It values equity as the asset value of a firm minus the debt value of the firm.", "explhtml": "<p>The asset-based approach is usually not used for most going concerns, but is appropriate for troubled firms, finance firms, investment companies, firms with few intangible assets, and natural resource firms. It values equity as the asset value of a firm minus the debt value of the firm.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 1–4<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Smith is an analyst performing valuations for Lumber Limited. Smith has been given a project to value Timber Industries, a firm that Lumber Limited is considering acquiring. Smith is aware that a number of characteristics distinguish private and public companies, and that these characteristics must be considered during his process of valuing Timber Industries. A number of issues complicate Smith's valuation: Timber Industries pays its CEO well below a market- based compensation figure, leases a warehouse at an above-market rate, and owns a vacant office building that is not needed for core operations. Smith is also aware that discounts and premiums based on control and marketability must be considered in his valuation of Timber Industries.<\/p><\/div><\/details><div class=\"pp-topic\">Module 22.3, LOS 22.g<\/div><div class=\"qtext\"><p>The asset-based approach to private company valuation that Smith is considering for Timber Industries is most likely to be appropriate in the case of a:<\/p><\/div>", "subj": "equity"}, {"n": 4, "q": "Which of the following statements related to discounts and premiums to benchmark for Smith's private company valuation of Timber Industries is most accurate?", "opts": ["A discount for lack of marketability should be applied when the comparables are based on public shares, and the interest in the target company is a minority interest in a private firm.", "A discount for lack of control should be applied when the comparable company values are for public shares, and the target company valuation is for a controlling interest.", "A control premium should be added when the comparable values are for the sale of an entire company, and the valuation is being done for a minority interest in the target company."], "ans": "A", "expl": "Discounts for lack of marketability are applied when the comparables are based on highly marketable securities, such as public shares, and the interest in the target company is less marketable, as in the case of a minority interest in a private firm. A discount for lack of control is applied when the comparable values are for the sale of an entire company, and the valuation is being done for a minority interest in the target company. A control premium is added when the comparable company values are for public shares or other minority interests, and the target company valuation is for a controlling interest.", "explhtml": "<p>Discounts for lack of marketability are applied when the comparables are based on highly marketable securities, such as public shares, and the interest in the target company is less marketable, as in the case of a minority interest in a private firm. A discount for lack of control is applied when the comparable values are for the sale of an entire company, and the valuation is being done for a minority interest in the target company. A control premium is added when the comparable company values are for public shares or other minority interests, and the target company valuation is for a controlling interest.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 1–4<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Smith is an analyst performing valuations for Lumber Limited. Smith has been given a project to value Timber Industries, a firm that Lumber Limited is considering acquiring. Smith is aware that a number of characteristics distinguish private and public companies, and that these characteristics must be considered during his process of valuing Timber Industries. A number of issues complicate Smith's valuation: Timber Industries pays its CEO well below a market- based compensation figure, leases a warehouse at an above-market rate, and owns a vacant office building that is not needed for core operations. Smith is also aware that discounts and premiums based on control and marketability must be considered in his valuation of Timber Industries.<\/p><\/div><\/details><div class=\"pp-topic\">Module 22.2, LOS 22.f<\/div><div class=\"qtext\"><p>Which of the following statements related to discounts and premiums to benchmark for Smith&#x27;s private company valuation of Timber Industries is most accurate?<\/p><\/div>", "subj": "equity"}, {"n": 5, "q": "An analyst is valuing a firm's equity using the price-to-book-value ratio of similar firms. Which of the following is the most likely valuation approach the analyst will use?", "opts": ["The income approach.", "The asset-based approach.", "The market approach."], "ans": "C", "expl": "The market approach values a firm using the price-multiples such as the price-to-book-value ratio and price-earnings ratio of comparable assets. The income approach values a firm as the present value of its future income. The asset-based approach values a firm as its assets minus liabilities.", "explhtml": "<p>The market approach values a firm using the price-multiples such as the price-to-book-value ratio and price-earnings ratio of comparable assets. The income approach values a firm as the present value of its future income. The asset-based approach values a firm as its assets minus liabilities.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.g<\/div><div class=\"qtext\"><p>An analyst is valuing a firm&#x27;s equity using the price-to-book-value ratio of similar firms. Which of the following is the most likely valuation approach the analyst will use?<\/p><\/div>", "subj": "equity"}, {"n": 6, "q": "Using the following figures, calculate the value of the firm using the excess earnings method (EEM). Working capital $600,000 Fixed assets $2,300,000 Normalized earnings $340,000 Required return for working\ncapital 5% Required return for fixed assets 13% Growth rate of residual income 4% Discount rate for intangible\nassets 18%", "opts": ["$3,073,199.", "$2,981,714.", "$3,027,111."], "ans": "B", "expl": "The answer is calculated using the following steps. Step 1: Calculate the required return for working capital and fixed assets. Given the required returns in percent, the monetary returns are: Working Capital: $600,000 × 5% = $30,000. Fixed Assets: $2,300,000 × 13% = $299,000. Step 2: Calculate the residual income. After the monetary returns to assets are calculated, the residual income is that which is left over in the normalized earnings: Residual Income = $340,000 − $30,000 − $299,000 = $11,000. Step 3: Value the intangible assets. Using the formula for a growing perpetuity, the discount rate for intangible assets, and the growth rate for residual income: Value of Intangible Assets = ($11,000 × 1.04) / (0.18 − 0.04) = $81,714. Step 4: Sum the asset values to arrive at the total firm value. Firm Value = $600,000 + $2,300,000 + $81,714 = $2,981,714.", "explhtml": "<p>The answer is calculated using the following steps.<\/p><p>Step 1: Calculate the required return for working capital and fixed assets.<\/p><p>Given the required returns in percent, the monetary returns are:<\/p><p>Working Capital: $600,000 × 5% = $30,000.<\/p><p>Fixed Assets: $2,300,000 × 13% = $299,000.<\/p><p>Step 2: Calculate the residual income.<\/p><p>After the monetary returns to assets are calculated, the residual income is that which is left over in the normalized earnings:<\/p><p>Residual Income = $340,000 − $30,000 − $299,000 = $11,000.<\/p><p>Step 3: Value the intangible assets.<\/p><p>Using the formula for a growing perpetuity, the discount rate for intangible assets, and the growth rate for residual income:<\/p><p>Value of Intangible Assets = ($11,000 × 1.04) / (0.18 − 0.04) = $81,714.<\/p><p>Step 4: Sum the asset values to arrive at the total firm value.<\/p><p>Firm Value = $600,000 + $2,300,000 + $81,714 = $2,981,714.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.h<\/div><div class=\"qtext\"><p>Using the following figures, calculate the value of the firm using the excess earnings method (EEM).<\/p><div class=\"tbl\"><table><tr><td>Working capital<\/td><td>$600,000<\/td><\/tr><tr><td>Fixed assets<\/td><td>$2,300,000<\/td><\/tr><tr><td>Normalized earnings<\/td><td>$340,000<\/td><\/tr><tr><td>Required return for working<br>capital<\/td><td>5%<\/td><\/tr><tr><td>Required return for fixed assets<\/td><td>13%<\/td><\/tr><tr><td>Growth rate of residual income<\/td><td>4%<\/td><\/tr><tr><td>Discount rate for intangible<br>assets<\/td><td>18%<\/td><\/tr><\/table><\/div><\/div>", "subj": "equity"}, {"n": 7, "q": "An analyst is examining the stock of three companies. Given the information below, which of them is most likely to be the stock of a private firm? Firm Restrictions on Sale\nof Stock? DLOM Stock Ownership of\n5 Largest Owners A Yes 0% 28% B No 5% 35% C Yes 15% 64%", "opts": ["Firm C.", "Firm A.", "Firm B."], "ans": "A", "expl": "The stock most likely to be that of a private firm is Firm C. Compared to public stock, private firm stock often has agreements that prevent shareholders from selling, is less liquid (discounts for lack of marketability (DLOM) of C is 15%), and control is usually concentrated in the hands of a few shareholders (stock ownership of largest owners of Firm C is 64%).", "explhtml": "<p>The stock most likely to be that of a private firm is Firm C. Compared to public stock, private firm stock often has agreements that prevent shareholders from selling, is less liquid (discounts for lack of marketability (DLOM) of C is 15%), and control is usually concentrated in the hands of a few shareholders (stock ownership of largest owners of Firm C is 64%).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.a<\/div><div class=\"qtext\"><p>An analyst is examining the stock of three companies. Given the information below, which of them is most likely to be the stock of a private firm?<\/p><div class=\"tbl\"><table><tr><td>Firm<\/td><td>Restrictions on Sale<br>of Stock?<\/td><td>DLOM<\/td><td>Stock Ownership of<br>5 Largest Owners<\/td><\/tr><tr><td>A<\/td><td>Yes<\/td><td>0%<\/td><td>28%<\/td><\/tr><tr><td>B<\/td><td>No<\/td><td>5%<\/td><td>35%<\/td><\/tr><tr><td>C<\/td><td>Yes<\/td><td>15%<\/td><td>64%<\/td><\/tr><\/table><\/div><\/div>", "subj": "equity"}, {"n": 8, "q": "Which of the following best describes the use of FCFF and FCFE when used in private firm valuation?", "opts": ["FCFF is usually favored if the firm is going to change its capital structure because the WACC is less sensitive to leverage changes than the cost of equity.", "FCFE is usually favored if the firm is going to change its capital structure because the equityholders are usually the investors requesting the valuation.", "FCFE is usually favored if the firm is going to change its capital structure because the cost of equity is less sensitive to leverage changes than the WACC."], "ans": "A", "expl": "Free cash flow to the firm (FCFF) can be used to value the firm as a whole and free cash flow to equity (FCFE) can be used for equity. FCFF is usually favored if the firm is going to significantly change its capital structure. The reason is that the discount rate used for FCFF valuation, the weighted average cost of capital (WACC), is less sensitive to leverage changes than the discount rate used for FCFE valuation, the cost of equity. Thus, the FCFF valuation will not vary as much as the FCFE valuation.", "explhtml": "<p>Free cash flow to the firm (FCFF) can be used to value the firm as a whole and free cash flow to equity (FCFE) can be used for equity. FCFF is usually favored if the firm is going to significantly change its capital structure. The reason is that the discount rate used for FCFF valuation, the weighted average cost of capital (WACC), is less sensitive to leverage changes than the discount rate used for FCFE valuation, the cost of equity. Thus, the FCFF valuation will not vary as much as the FCFE valuation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.c<\/div><div class=\"qtext\"><p>Which of the following best describes the use of FCFF and FCFE when used in private firm valuation?<\/p><\/div>", "subj": "equity"}, {"n": 9, "q": "Which of the following mentioned in Comment 1 is least likely to be a company specific characteristic of a private company?", "opts": ["Tax consideration.", "Quality and depth of management.", "Shareholders agreements that restrict liquidity."], "ans": "C", "expl": "Company specific characteristics include: Stage in life-cycle Size Overlap of shareholders and management Quality and depth of management Quality of financial and other information Less pressure from short-term investors Tax consideration", "explhtml": "<p>Company specific characteristics include:<\/p><p>Stage in life-cycle Size Overlap of shareholders and management Quality and depth of management Quality of financial and other information Less pressure from short-term investors Tax consideration<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 9–12<\/summary><div class=\"vig-body\"><p>Stan Bowles works for Marsh Inc. and has been tasked with the valuation of Park Limited, a small private footwear producer. Bowles prepares a valuation report on Park Limited and his report contains the following:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v001.webp\" style=\"max-width:min(100%,652px)\" alt=\"Company-specific characteristics such as the quality and depth of management,\"><p>Comment 1: tax considerations, and shareholders agreements that restrict liquidity mark the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v002.webp\" style=\"max-width:min(100%,652px)\" alt=\"main differences between a private and public company. The value of a private company depends on the investor&#x27;s expectations and\"><p>Comment 2: investment requirements and could differ from one buyer to the next due to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v003.webp\" style=\"max-width:min(100%,654px)\" alt=\"different perception of risk and future potential. To obtain an appropriate discount rate for Park, we have assumed the following: • Estimated beta of Park: 0.75 • Company specific risk premium: 1.2% Comment 3: • Small stock premium: 2.8% • Risk free rate: 3% • Equity risk premium: 4.5%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v004.webp\" style=\"max-width:min(100%,638px)\" alt=\"If we are valuing Park for non-controlling equity interest, a discount for lack of\"><p>Comment 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v005.webp\" style=\"max-width:min(100%,638px)\" alt=\"control might be required.\"><\/div><\/details><div class=\"pp-topic\">Module 22.1, LOS 22.a<\/div><div class=\"qtext\"><p>Which of the following mentioned in Comment 1 is least likely to be a company specific characteristic of a private company?<\/p><\/div>", "subj": "equity"}, {"n": 10, "q": "Comment 2 is describing:", "opts": ["fair value.", "investment value.", "fair market value."], "ans": "B", "expl": "Investment value is the value of a private company that depends on the investor's expectations and investment requirements. Investment value could differ from one buyer to the next due to different perception of risk and future potential.", "explhtml": "<p>Investment value is the value of a private company that depends on the investor&#x27;s expectations and investment requirements. Investment value could differ from one buyer to the next due to different perception of risk and future potential.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 9–12<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stan Bowles works for Marsh Inc. and has been tasked with the valuation of Park Limited, a small private footwear producer. Bowles prepares a valuation report on Park Limited and his report contains the following:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v001.webp\" style=\"max-width:min(100%,652px)\" alt=\"Company-specific characteristics such as the quality and depth of management,\"><p>Comment 1: tax considerations, and shareholders agreements that restrict liquidity mark the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v002.webp\" style=\"max-width:min(100%,652px)\" alt=\"main differences between a private and public company. The value of a private company depends on the investor&#x27;s expectations and\"><p>Comment 2: investment requirements and could differ from one buyer to the next due to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v003.webp\" style=\"max-width:min(100%,654px)\" alt=\"different perception of risk and future potential. To obtain an appropriate discount rate for Park, we have assumed the following: • Estimated beta of Park: 0.75 • Company specific risk premium: 1.2% Comment 3: • Small stock premium: 2.8% • Risk free rate: 3% • Equity risk premium: 4.5%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v004.webp\" style=\"max-width:min(100%,638px)\" alt=\"If we are valuing Park for non-controlling equity interest, a discount for lack of\"><p>Comment 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v005.webp\" style=\"max-width:min(100%,638px)\" alt=\"control might be required.\"><\/div><\/details><div class=\"pp-topic\">Module 22.2, LOS 22.f<\/div><div class=\"qtext\"><p>Comment 2 is describing:<\/p><\/div>", "subj": "equity"}, {"n": 11, "q": "Calculate Park's discount rate using the build-up method and the information in Comment 3.", "opts": ["9.375%.", "10.375%.", "11.5%."], "ans": "C", "expl": "Using the build-up method, there is no beta adjustment on the equity risk premium. The discount rate is calculated as follows: Risk free rate:  3% | Equity risk premium:  4.5% Company specific risk premium: 1.2% Small stock premium:  2.8% | Return on equity:  11.5%", "explhtml": "<p>Using the build-up method, there is no beta adjustment on the equity risk premium. The discount rate is calculated as follows:<\/p><div class=\"tbl\"><table><tr><td>Risk free rate:<\/td><td>3%<\/td><\/tr><tr><td>Equity risk premium:<\/td><td>4.5%<\/td><\/tr><\/table><\/div><p>Company specific risk premium: 1.2%<\/p><div class=\"tbl\"><table><tr><td>Small stock premium:<\/td><td>2.8%<\/td><\/tr><tr><td>Return on equity:<\/td><td>11.5%<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 9–12<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stan Bowles works for Marsh Inc. and has been tasked with the valuation of Park Limited, a small private footwear producer. Bowles prepares a valuation report on Park Limited and his report contains the following:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v001.webp\" style=\"max-width:min(100%,652px)\" alt=\"Company-specific characteristics such as the quality and depth of management,\"><p>Comment 1: tax considerations, and shareholders agreements that restrict liquidity mark the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v002.webp\" style=\"max-width:min(100%,652px)\" alt=\"main differences between a private and public company. The value of a private company depends on the investor&#x27;s expectations and\"><p>Comment 2: investment requirements and could differ from one buyer to the next due to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v003.webp\" style=\"max-width:min(100%,654px)\" alt=\"different perception of risk and future potential. To obtain an appropriate discount rate for Park, we have assumed the following: • Estimated beta of Park: 0.75 • Company specific risk premium: 1.2% Comment 3: • Small stock premium: 2.8% • Risk free rate: 3% • Equity risk premium: 4.5%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v004.webp\" style=\"max-width:min(100%,638px)\" alt=\"If we are valuing Park for non-controlling equity interest, a discount for lack of\"><p>Comment 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v005.webp\" style=\"max-width:min(100%,638px)\" alt=\"control might be required.\"><\/div><\/details><div class=\"pp-topic\">Module 22.2, LOS 22.e<\/div><div class=\"qtext\"><p>Calculate Park&#x27;s discount rate using the build-up method and the information in Comment 3.<\/p><\/div>", "subj": "equity"}, {"n": 12, "q": "Using Comment 4, which of the following method is least likely to require a discount for lack of control?", "opts": ["Guideline Transaction Method.", "Capitalized Cash Flow Method.", "Guideline Public Company Method."], "ans": "C", "expl": "Guideline Public Company Method uses the price multiples of comparable public companies as Park Limited. This method typically assumes minority control. Guideline Transaction Method uses the price multiples of acquisitions of the entire public or private companies, thus reflecting controlling interest. Depending on the cash flows and discount rate estimated, the capitalized cash flow method can be applied towards the valuation of minority or control interest.", "explhtml": "<p>Guideline Public Company Method uses the price multiples of comparable public companies as Park Limited. This method typically assumes minority control. Guideline Transaction Method uses the price multiples of acquisitions of the entire public or private companies, thus reflecting controlling interest. Depending on the cash flows and discount rate estimated, the capitalized cash flow method can be applied towards the valuation of minority or control interest.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 9–12<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stan Bowles works for Marsh Inc. and has been tasked with the valuation of Park Limited, a small private footwear producer. Bowles prepares a valuation report on Park Limited and his report contains the following:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v001.webp\" style=\"max-width:min(100%,652px)\" alt=\"Company-specific characteristics such as the quality and depth of management,\"><p>Comment 1: tax considerations, and shareholders agreements that restrict liquidity mark the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v002.webp\" style=\"max-width:min(100%,652px)\" alt=\"main differences between a private and public company. The value of a private company depends on the investor&#x27;s expectations and\"><p>Comment 2: investment requirements and could differ from one buyer to the next due to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v003.webp\" style=\"max-width:min(100%,654px)\" alt=\"different perception of risk and future potential. To obtain an appropriate discount rate for Park, we have assumed the following: • Estimated beta of Park: 0.75 • Company specific risk premium: 1.2% Comment 3: • Small stock premium: 2.8% • Risk free rate: 3% • Equity risk premium: 4.5%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v004.webp\" style=\"max-width:min(100%,638px)\" alt=\"If we are valuing Park for non-controlling equity interest, a discount for lack of\"><p>Comment 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v005.webp\" style=\"max-width:min(100%,638px)\" alt=\"control might be required.\"><\/div><\/details><div class=\"pp-topic\">Module 22.2, LOS 22.f<\/div><div class=\"qtext\"><p>Using Comment 4, which of the following method is least likely to require a discount for lack of control?<\/p><\/div>", "subj": "equity"}, {"n": 13, "q": "The asset-based approach values a firm based on:", "opts": ["book values.", "fair values.", "investment values."], "ans": "B", "expl": "The asset-based approach values firm equity as the fair value of its assets minus the fair value of its liabilities.", "explhtml": "<p>The asset-based approach values firm equity as the fair value of its assets minus the fair value of its liabilities.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.g<\/div><div class=\"qtext\"><p>The asset-based approach values a firm based on:<\/p><\/div>", "subj": "equity"}, {"n": 14, "q": "The capitalized cash flow method (CCM) used in private firm valuation is most appropriate when:", "opts": ["there are many intangible assets to value.", "earnings are growing quickly in an initial period.", "stable growth is expected."], "ans": "C", "expl": "The CCM is a growing perpetuity model that assumes stable growth and is in effect a single-stage free cash flow model. It may be suitable when no comparables or projections are available and when stable growth is expected. The excess earnings method (EEM) is useful when there are intangible assets to value. The free cash flow method assumes high growth in an initial period followed by constant growth thereafter.", "explhtml": "<p>The CCM is a growing perpetuity model that assumes stable growth and is in effect a single-stage free cash flow model. It may be suitable when no comparables or projections are available and when stable growth is expected. The excess earnings method (EEM) is useful when there are intangible assets to value. The free cash flow method assumes high growth in an initial period followed by constant growth thereafter.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.h<\/div><div class=\"qtext\"><p>The capitalized cash flow method (CCM) used in private firm valuation is most appropriate when:<\/p><\/div>", "subj": "equity"}, {"n": 15, "q": "Which of the following statements related to the market approaches to private company valuation is most accurate?", "opts": ["The guideline transactions method (GTM) is based on historical stock sales of the actual subject company.", "The prior transaction method (PTM) is based on price multiples from the sale of whole public and private companies.", "The guideline public company method (GPCM) is based on price multiples from comparable traded firms."], "ans": "C", "expl": "The guideline public company method (GPCM) approach to private company valuation uses price multiples from traded public companies with adjustments for risk differences. The guideline transactions method (GTM) uses the price multiples from the sale of whole public and private companies, again with adjustments for risk differences. The prior transaction method (PTM) uses historical stock sales of the subject company; it works best when using recent, arm's-length data of the same motivation.", "explhtml": "<p>The guideline public company method (GPCM) approach to private company valuation uses price multiples from traded public companies with adjustments for risk differences. The guideline transactions method (GTM) uses the price multiples from the sale of whole public and private companies, again with adjustments for risk differences. The prior transaction method (PTM) uses historical stock sales of the subject company; it works best when using recent, arm&#x27;s-length data of the same motivation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.i<\/div><div class=\"qtext\"><p>Which of the following statements related to the market approaches to private company valuation is most accurate?<\/p><\/div>", "subj": "equity"}, {"n": 16, "q": "Which of the following is least likely an example of a litigation-related valuation for a private company?", "opts": ["Bankruptcy proceeding.", "Divorce settlements.", "Lost profits claims."], "ans": "A", "expl": "Litigation-related valuations may be required for shareholder suits, damage claims, lost profits claims, or divorce settlements. A bankruptcy proceeding is an example of a transaction-related valuation for a private company.", "explhtml": "<p>Litigation-related valuations may be required for shareholder suits, damage claims, lost profits claims, or divorce settlements. A bankruptcy proceeding is an example of a transaction-related valuation for a private company.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.b<\/div><div class=\"qtext\"><p>Which of the following is least likely an example of a litigation-related valuation for a private company?<\/p><\/div>", "subj": "equity"}, {"n": 17, "q": "An analyst values a private company using a price multiple based on recent sales of comparable assets. This approach to private company valuation is best described as the:", "opts": ["income approach", "market approach", "asset-based approach"], "ans": "B", "expl": "Under the market approach, a firm is valued using price multiples based on recent sales of comparable assets. Under the income approach, a firm is valued according to the present value of its expected future income. Under the asset-based approach, the value of a firm is calculated as the firm's assets minus its liabilities.", "explhtml": "<p>Under the market approach, a firm is valued using price multiples based on recent sales of comparable assets. Under the income approach, a firm is valued according to the present value of its expected future income. Under the asset-based approach, the value of a firm is calculated as the firm&#x27;s assets minus its liabilities.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.g<\/div><div class=\"qtext\"><p>An analyst values a private company using a price multiple based on recent sales of comparable assets. This approach to private company valuation is best described as the:<\/p><\/div>", "subj": "equity"}, {"n": 18, "q": "Which of the following statements most accurately describes the difference between private and public firm managers?", "opts": ["Although managers in a public firm are often paid with incentive compensation, public managers may take a shorter term view than private managers because shareholders often focus on the short-term.", "Because managers in a public firm are often paid with incentive compensation, public managers may take a longer term view than private managers.", "Because managers in a private firm are concerned with having the firm go public, private managers may take a shorter term view than public managers."], "ans": "A", "expl": "Although managers in a public firm are often paid with incentive compensation such as options, shareholders often focus on short-term measures such as quarterly earnings and the consistency of such. Management may therefore take a shorter term view than they otherwise would. Private firms should be able to take a longer term view.", "explhtml": "<p>Although managers in a public firm are often paid with incentive compensation such as options, shareholders often focus on short-term measures such as quarterly earnings and the consistency of such. Management may therefore take a shorter term view than they otherwise would. Private firms should be able to take a longer term view.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.a<\/div><div class=\"qtext\"><p>Which of the following statements most accurately describes the difference between private and public firm managers?<\/p><\/div>", "subj": "equity"}, {"n": 19, "q": "An analyst is valuing a small private firm that is still developing and has yet to generate any earnings. Which of the following best describes the approach that should be used?", "opts": ["Nonoperating assets are not crucial to the firm and should be excluded in any valuation.", "A market approach based on public comparables would be utilized.", "An asset-based approach would be used."], "ans": "C", "expl": "The valuation approach used will depend on the firm's operations and its lifecycle stage. Early in its life, a firm's future cash flows may be so uncertain that an asset-based approach would be selected. The price multiples from large public firms should not be used for a small private firm when using the market approach. Although a firm's nonoperating assets are not crucial to the firm, they should be included in any valuation.", "explhtml": "<p>The valuation approach used will depend on the firm&#x27;s operations and its lifecycle stage. Early in its life, a firm&#x27;s future cash flows may be so uncertain that an asset-based approach would be selected. The price multiples from large public firms should not be used for a small private firm when using the market approach. Although a firm&#x27;s nonoperating assets are not crucial to the firm, they should be included in any valuation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.g<\/div><div class=\"qtext\"><p>An analyst is valuing a small private firm that is still developing and has yet to generate any earnings. Which of the following best describes the approach that should be used?<\/p><\/div>", "subj": "equity"}, {"n": 20, "q": "Which of the following best describes the use of size premiums when estimating the discount rate for private company valuations?", "opts": ["When using data from comparable public firms, a distress premium may be inadvertently added in.", "A size premium is subtracted when calculating the discount rate.", "The treatment is similar to that for public firms."], "ans": "A", "expl": "For private company valuations, a size premium is often added in when calculating the discount rate. This is not typically done for public firms. To get the size premium, the appraiser may use data from the smallest cap segment of public equity. This however may include a distress premium that is not applicable to the private firm.", "explhtml": "<p>For private company valuations, a size premium is often added in when calculating the discount rate. This is not typically done for public firms. To get the size premium, the appraiser may use data from the smallest cap segment of public equity. This however may include a distress premium that is not applicable to the private firm.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.d<\/div><div class=\"qtext\"><p>Which of the following best describes the use of size premiums when estimating the discount rate for private company valuations?<\/p><\/div>", "subj": "equity"}, {"n": 21, "q": "Using the following information, calculate the required return on equity using the expanded CAPM. Income return on bonds 6.0% Capital return on bonds 2.0% Long-term Treasury yield 3.5% Beta 1.4 Equity risk premium 6.0% Small stock premium 4.0% Company-specific risk premium 3.0% Industry risk-premium 2.0% Pretax cost of debt 11.0% Optimal Debt/Total Cap 16% Current Debt/Total 7% Debt/Total Cap for public firms in\nindustry 33% Tax Rate 30%", "opts": ["18.9%.", "11.9%.", "15.9%."], "ans": "A", "expl": "The required return on equity using the CAPM is: 3.5% + 1.4(6%) = 11.9%. Note that the risk-free rate is the Treasury yield, not the returns for bonds in general. Using the expanded CAPM, a small stock premium and company-specific risk premium are added: 11.9% + 4% + 3% = 18.9%.", "explhtml": "<p>The required return on equity using the CAPM is: 3.5% + 1.4(6%) = 11.9%.<\/p><p>Note that the risk-free rate is the Treasury yield, not the returns for bonds in general.<\/p><p>Using the expanded CAPM, a small stock premium and company-specific risk premium are added: 11.9% + 4% + 3% = 18.9%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.e<\/div><div class=\"qtext\"><p>Using the following information, calculate the required return on equity using the expanded CAPM.<\/p><div class=\"tbl\"><table><tr><td>Income return on bonds<\/td><td>6.0%<\/td><\/tr><tr><td>Capital return on bonds<\/td><td>2.0%<\/td><\/tr><tr><td>Long-term Treasury yield<\/td><td>3.5%<\/td><\/tr><tr><td>Beta<\/td><td>1.4<\/td><\/tr><tr><td>Equity risk premium<\/td><td>6.0%<\/td><\/tr><tr><td>Small stock premium<\/td><td>4.0%<\/td><\/tr><tr><td>Company-specific risk premium<\/td><td>3.0%<\/td><\/tr><tr><td>Industry risk-premium<\/td><td>2.0%<\/td><\/tr><tr><td>Pretax cost of debt<\/td><td>11.0%<\/td><\/tr><tr><td>Optimal Debt/Total Cap<\/td><td>16%<\/td><\/tr><tr><td>Current Debt/Total<\/td><td>7%<\/td><\/tr><tr><td>Debt/Total Cap for public firms in<br>industry<\/td><td>33%<\/td><\/tr><tr><td>Tax Rate<\/td><td>30%<\/td><\/tr><\/table><\/div><\/div>", "subj": "equity"}, {"n": 22, "q": "Which of the following best describes how debt is incorporated into the estimation of the discount rate for private company valuations, relative to that for public firms? In general, the cost of debt:", "opts": ["is higher for private firms and debt capacity is lower for private firms.", "and debt capacity is the same for both private and public firms.", "is higher for private firms and debt capacity is the same for both private and public firms."], "ans": "A", "expl": "A private firm may not be able to obtain as much debt financing as a public firm. The small size of private firms may result in higher operating risk and a higher cost of debt.", "explhtml": "<p>A private firm may not be able to obtain as much debt financing as a public firm. The small size of private firms may result in higher operating risk and a higher cost of debt.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.d<\/div><div class=\"qtext\"><p>Which of the following best describes how debt is incorporated into the estimation of the discount rate for private company valuations, relative to that for public firms? In general, the cost of debt:<\/p><\/div>", "subj": "equity"}, {"n": 23, "q": "Which of the following is least likely an example of a compliance-related valuation for a private company?", "opts": ["Bankruptcy proceeding.", "Tax purposes.", "Financial reporting."], "ans": "A", "expl": "A bankruptcy proceeding is an example of a transaction-related valuation for a private company.", "explhtml": "<p>A bankruptcy proceeding is an example of a transaction-related valuation for a private company.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.b<\/div><div class=\"qtext\"><p>Which of the following is least likely an example of a compliance-related valuation for a private company?<\/p><\/div>", "subj": "equity"}, {"n": 24, "q": "Which of the following best describes the estimation of discounts for lack of marketability (DLOM) in private company valuations? The primary advantage of using put prices to estimate the DLOM over the other two methods is:", "opts": ["exchange traded put prices are readily available.", "the Black-Scholes model has been shown to be valid for private firms.", "the volatility of the firm can be incorporated into the analysis."], "ans": "C", "expl": "If an interest in a firm cannot be easily sold, a DLOM is applied. The DLOM can be estimated using restricted share versus publicly traded share prices, pre-IPO versus post-IPO prices, and put prices. The advantage of using put prices over the other two DLOM estimation methods is that the estimated risk of the firm can be factored into the option price.", "explhtml": "<p>If an interest in a firm cannot be easily sold, a DLOM is applied. The DLOM can be estimated using restricted share versus publicly traded share prices, pre-IPO versus post-IPO prices, and put prices. The advantage of using put prices over the other two DLOM estimation methods is that the estimated risk of the firm can be factored into the option price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.f<\/div><div class=\"qtext\"><p>Which of the following best describes the estimation of discounts for lack of marketability (DLOM) in private company valuations? The primary advantage of using put prices to estimate the DLOM over the other two methods is:<\/p><\/div>", "subj": "equity"}, {"n": 25, "q": "Given the following figures, calculate the normalized EBITDA for a financial and strategic buyer. Reported EBITDA $4,500,000 Current Executive Compensation $700,000 Market-Based Executive\nCompensation $620,000 Current SG&A expenses $6,300,000 SG&A expenses after synergistic\nsavings $5,600,000 Current Lease Rate $300,000 Market-Based Lease Rate $390,000 The normalized EBITDA for each type of buyer is: Financial Buyer  Strategic Buyer", "opts": ["$4,670,000 $5,370,000", "$4,490,000 $5,190,000", "$4,190,000 $4,890,000"], "ans": "B", "expl": "Both strategic and financial buyers will attempt to reduce executive compensation to market levels by $80,000 ($700,000 − $620,000). They will also have to pay a higher lease rate of $90,000 ($390,000 − $300,000). So the adjustment for both buyers to generate normalized EBITDA is $4,500,000 + $80,000 − $90,000 = $4,490,000. However, only a strategic buyer will be able to realize synergistic savings of $700,000 ($6,300,000 − $5,600,000). So normalized EBITDA for a strategic buyer is $5,190,000 and for a financial buyer it is $4,490,000.", "explhtml": "<p>Both strategic and financial buyers will attempt to reduce executive compensation to market levels by $80,000 ($700,000 − $620,000). They will also have to pay a higher lease rate of $90,000 ($390,000 − $300,000). So the adjustment for both buyers to generate normalized EBITDA is $4,500,000 + $80,000 − $90,000 = $4,490,000.<\/p><p>However, only a strategic buyer will be able to realize synergistic savings of $700,000 ($6,300,000 − $5,600,000). So normalized EBITDA for a strategic buyer is $5,190,000 and for a financial buyer it is $4,490,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.c<\/div><div class=\"qtext\"><p>Given the following figures, calculate the normalized EBITDA for a financial and strategic buyer.<\/p><div class=\"tbl\"><table><tr><td>Reported EBITDA<\/td><td>$4,500,000<\/td><\/tr><tr><td>Current Executive Compensation<\/td><td>$700,000<\/td><\/tr><tr><td>Market-Based Executive<br>Compensation<\/td><td>$620,000<\/td><\/tr><tr><td>Current SG&amp;A expenses<\/td><td>$6,300,000<\/td><\/tr><tr><td>SG&amp;A expenses after synergistic<br>savings<\/td><td>$5,600,000<\/td><\/tr><tr><td>Current Lease Rate<\/td><td>$300,000<\/td><\/tr><tr><td>Market-Based Lease Rate<\/td><td>$390,000<\/td><\/tr><\/table><\/div><p>The normalized EBITDA for each type of buyer is: Financial Buyer &nbsp; Strategic Buyer<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "Using the following figures, calculate the value of the equity using the capitalized cash flow method (CCM), assuming the firm will be acquired. Normalized FCFE in current\nyear $3,000,000 Reported FCFE in current year $2,400,000 Growth rate of FCFE 7.0% Equity discount rate 16.0% WACC 13.0% Risk-free rate 3.5% Cost of debt 10.5% Market value of debt $3,000,000 The value of the equity is:", "opts": ["$32,666,667.", "$35,666,667.", "$28,533,333."], "ans": "B", "expl": "To arrive at the value of the equity using the CCM, it can be estimated using the free cash flows to equity and the required return on equity (r): FCFE₁ value of equity = r −g $3,000,000 × (1.07) value of equity =  = $35,666,667 0.16 −0.07 Note that we grow the FCFE at the growth rate because the current year FCFE is provided in the problem (not next year's FCFE). We use normalized earnings, not reported earnings, given that normalized earnings are most relevant for the acquirers of the firm. The relevant required return for FCFE is the equity discount rate, not the WACC. An alternative approach to calculate the value of the equity would be to subtract the market value of the firm's debt from total firm value. However, the FCFF are not provided so a total firm value cannot be calculated.", "explhtml": "<p>To arrive at the value of the equity using the CCM, it can be estimated using the free cash flows to equity and the required return on equity (r):<\/p><p>FCFE<sub>1<\/sub><\/p><p>value of equity =<\/p><p>r −g<\/p><p>$3,000,000 × (1.07) value of equity = &nbsp; = $35,666,667<\/p><p>0.16 −0.07<\/p><p>Note that we grow the FCFE at the growth rate because the current year FCFE is provided in the problem (not next year&#x27;s FCFE). We use normalized earnings, not reported earnings, given that normalized earnings are most relevant for the acquirers of the firm. The relevant required return for FCFE is the equity discount rate, not the WACC.<\/p><p>An alternative approach to calculate the value of the equity would be to subtract the market value of the firm&#x27;s debt from total firm value. However, the FCFF are not provided so a total firm value cannot be calculated.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.h<\/div><div class=\"qtext\"><p>Using the following figures, calculate the value of the equity using the capitalized cash flow method (CCM), assuming the firm will be acquired.<\/p><div class=\"tbl\"><table><tr><td>Normalized FCFE in current<br>year<\/td><td>$3,000,000<\/td><\/tr><tr><td>Reported FCFE in current year<\/td><td>$2,400,000<\/td><\/tr><tr><td>Growth rate of FCFE<\/td><td>7.0%<\/td><\/tr><tr><td>Equity discount rate<\/td><td>16.0%<\/td><\/tr><tr><td>WACC<\/td><td>13.0%<\/td><\/tr><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Cost of debt<\/td><td>10.5%<\/td><\/tr><tr><td>Market value of debt<\/td><td>$3,000,000<\/td><\/tr><\/table><\/div><p>The value of the equity is:<\/p><\/div>", "subj": "equity"}, {"n": 27, "q": "When would the asset-based approach result in a higher valuation than its going concern value, in the case of private company valuation?", "opts": ["When valuing biotech firms.", "When valuing pharmaceutical firms.", "If the firm has minimal profits and poor prospects."], "ans": "C", "expl": "If a firm has minimal profits and little hope for better prospects; it might be valued more highly for its liquidation value than as a going concern if another firm can put the assets to better use. Because the asset-based approach values firm equity as the fair value of its assets minus the fair value of its liabilities, it would capture this liquidation value. Pharmaceutical and biotech firms have a high degree of intangible assets. In these cases, the going concern value is likely to be higher than the value from the asset-based approach.", "explhtml": "<p>If a firm has minimal profits and little hope for better prospects; it might be valued more highly for its liquidation value than as a going concern if another firm can put the assets to better use. Because the asset-based approach values firm equity as the fair value of its assets minus the fair value of its liabilities, it would capture this liquidation value.<\/p><p>Pharmaceutical and biotech firms have a high degree of intangible assets. In these cases, the going concern value is likely to be higher than the value from the asset-based approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.g<\/div><div class=\"qtext\"><p>When would the asset-based approach result in a higher valuation than its going concern value, in the case of private company valuation?<\/p><\/div>", "subj": "equity"}, {"n": 28, "q": "An analyst is examining three companies. Given the information below, which of them is most likely to be a private firm? Firm Number of Years in\nOperation Market\nCapitalization Required Return for\nCommon Stock A 12 years $1,324.8 million 14.8% B 4 years $1,313.9 million 18.3% C 19 years $2,231.0 million 16.4%", "opts": ["Firm C.", "Firm A.", "Firm B."], "ans": "C", "expl": "The firm most likely to be a private firm is Firm B. Compared to public firms, private firms are less mature (4 years for Firm B), smaller (market cap of B is $1,313.9 million), and have higher required returns (required return for B is 18.3%).", "explhtml": "<p>The firm most likely to be a private firm is Firm B. Compared to public firms, private firms are less mature (4 years for Firm B), smaller (market cap of B is $1,313.9 million), and have higher required returns (required return for B is 18.3%).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.a<\/div><div class=\"qtext\"><p>An analyst is examining three companies. Given the information below, which of them is most likely to be a private firm?<\/p><div class=\"tbl\"><table><tr><td>Firm<\/td><td>Number of Years in<br>Operation<\/td><td>Market<br>Capitalization<\/td><td>Required Return for<br>Common Stock<\/td><\/tr><tr><td>A<\/td><td>12 years<\/td><td>$1,324.8 million<\/td><td>14.8%<\/td><\/tr><tr><td>B<\/td><td>4 years<\/td><td>$1,313.9 million<\/td><td>18.3%<\/td><\/tr><tr><td>C<\/td><td>19 years<\/td><td>$2,231.0 million<\/td><td>16.4%<\/td><\/tr><\/table><\/div><\/div>", "subj": "equity"}, {"n": 29, "q": "A private pharmaceutical firm is under consideration for acquisition where the financial buyer will pay with equity. Part of the payment to the sellers is based on FDA approval of the firm's drug. If the analyst uses a market approach and comparable data from public firms, which of the following would most likely result in a price-multiple that is too high? The comparable data is:", "opts": ["for transactions where the consideration was non-contingent.", "for strategic buyers.", "from transactions where the buyer used cash."], "ans": "B", "expl": "In market approaches, the analyst values the subject private firm using price multiples from previous public and private transactions. A strategic buyer is one who will have synergies with the target whereas a financial buyer does not. A financial transaction typically has a smaller price premium. So in this case, the comparable price-multiple will be too high. If the acquisition involves the acquirer's stock, the acquirer may be using overvalued shares to buy their target. Using comparables where cash is the consideration would result in lower price multiples. Contingent consideration is payment to the sellers based on the achievement of specific goals such as FDA approval. Contingent consideration increases the risk to the seller and ceteris paribus, they would demand a higher price. Using comparables where the consideration was non-contingent would result in lower price multiples.", "explhtml": "<p>In market approaches, the analyst values the subject private firm using price multiples from previous public and private transactions. A strategic buyer is one who will have synergies with the target whereas a financial buyer does not. A financial transaction typically has a smaller price premium. So in this case, the comparable price-multiple will be too high.<\/p><p>If the acquisition involves the acquirer&#x27;s stock, the acquirer may be using overvalued shares to buy their target. Using comparables where cash is the consideration would result in lower price multiples.<\/p><p>Contingent consideration is payment to the sellers based on the achievement of specific goals such as FDA approval. Contingent consideration increases the risk to the seller and ceteris paribus, they would demand a higher price. Using comparables where the consideration was non-contingent would result in lower price multiples.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.d<\/div><div class=\"qtext\"><p>A private pharmaceutical firm is under consideration for acquisition where the financial buyer will pay with equity. Part of the payment to the sellers is based on FDA approval of the firm&#x27;s drug. If the analyst uses a market approach and comparable data from public firms, which of the following would most likely result in a price-multiple that is too high? The comparable data is:<\/p><\/div>", "subj": "equity"}, {"n": 30, "q": "Which of the following is least likely an example of a transaction-related valuation for a private company?", "opts": ["Performance-based managerial compensation.", "Bankruptcy proceeding.", "Financial reporting."], "ans": "C", "expl": "Venture capital financing, initial public offering (IPO), bankruptcy proceeding, performance-based managerial compensation, and sale in an acquisition are all examples of transaction-related valuations for a private company.", "explhtml": "<p>Venture capital financing, initial public offering (IPO), bankruptcy proceeding, performance-based managerial compensation, and sale in an acquisition are all examples of transaction-related valuations for a private company.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.b<\/div><div class=\"qtext\"><p>Which of the following is least likely an example of a transaction-related valuation for a private company?<\/p><\/div>", "subj": "equity"}, {"n": 31, "q": "An analyst is valuing a private firm on the behalf of a strategic buyer and deflates the average public company multiple by 15% to account for the higher risk of the private firm. Given the following figures, calculate the value of firm equity using the guideline public company method (GPCM). Market value of debt  $4,100,000 | Normalized EBITDA  $42,800,000 | Average EV/EBITDA multiple  8.5 Control premium from past 25% transaction The equity value of the firm is closest to:", "opts": ["$386,484,000.", "$382,384,000.", "$304,060,000."], "ans": "B", "expl": "The adjustment to the EV/EBITDA multiple for the higher risk of the private firm is 8.5 × (1 − 0.15) = 7.225. Given that the buyer is a strategic buyer, a control premium adjustment should be made. Adjusted multiple = 7.225 × (1.25) = 9.03. EV = 9.03 × $42,800,000 = $386,484,000. Subtracting out the debt results in the equity value: $386,484,000 − $4,100,000 = $382,384,000", "explhtml": "<p>The adjustment to the EV/EBITDA multiple for the higher risk of the private firm is 8.5 × (1 − 0.15) = 7.225. Given that the buyer is a strategic buyer, a control premium adjustment should be made. Adjusted multiple = 7.225 × (1.25) = 9.03.<\/p><p>EV = 9.03 × $42,800,000 = $386,484,000.<\/p><p>Subtracting out the debt results in the equity value:<\/p><p>$386,484,000 − $4,100,000 = $382,384,000<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.i<\/div><div class=\"qtext\"><p>An analyst is valuing a private firm on the behalf of a strategic buyer and deflates the average public company multiple by 15% to account for the higher risk of the private firm. Given the following figures, calculate the value of firm equity using the guideline public company method (GPCM).<\/p><div class=\"tbl\"><table><tr><td>Market value of debt<\/td><td>$4,100,000<\/td><\/tr><tr><td>Normalized EBITDA<\/td><td>$42,800,000<\/td><\/tr><tr><td>Average EV/EBITDA multiple<\/td><td>8.5<\/td><\/tr><\/table><\/div><p>Control premium from past<\/p><p>25%<\/p><p>transaction<\/p><p>The equity value of the firm is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "Which of the following approaches to private company valuation uses discounted cash flow analysis?", "opts": ["The income approach.", "The market approach.", "The asset-based approach."], "ans": "A", "expl": "The income approach values a firm as the present value of its future income. The asset-based approach values a firm as its assets minus liabilities. The market approach values a firm using the price-multiples from the sales of comparable assets.", "explhtml": "<p>The income approach values a firm as the present value of its future income. The asset-based approach values a firm as its assets minus liabilities. The market approach values a firm using the price-multiples from the sales of comparable assets.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.g<\/div><div class=\"qtext\"><p>Which of the following approaches to private company valuation uses discounted cash flow analysis?<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "Using the following information, calculate the WACC using the build-up method, assuming the firm is being acquired. Income return on bonds 6.0% Capital return on bonds 2.0% Long-term Treasury yield 3.5% Beta 1.4 Equity risk premium 6.0% Small stock premium 4.0% Company-specific risk premium 3.0% Industry risk-premium 2.0% Pretax cost of debt 11.0% Optimal Debt/Total Cap 20% Current Debt/Total 7% Debt/Total Cap for public firms in\nindustry 33% Tax Rate 30%", "opts": ["16.3%.", "17.7%.", "18.5%."], "ans": "A", "expl": "Using the build-up method: the risk-free rate, the equity risk premium, the small stock premium, a company-specific risk premium, and an industry risk premium are added together: 3.5% + 6.0% + 4.0% + 3.0% + 2.0% = 18.5%. Note that the risk-free rate is the Treasury yield, not the returns for bonds in general. Because the firm is being acquired, we assume the new owners will utilize an optimal capital structure and weights in the WACC calculation. The capital structure for public firms should not be used because public firms have better access to debt financing. The WACC using the optimal capital structure factors in the debt to total cap, the cost of debt, the tax rate, and the given cost of equity: [20% × 11% × (1-30%)] + [(1-20%) × 18.5%] = 16.3%.", "explhtml": "<p>Using the build-up method: the risk-free rate, the equity risk premium, the small stock premium, a company-specific risk premium, and an industry risk premium are added together: 3.5% + 6.0% + 4.0% + 3.0% + 2.0% = 18.5%. Note that the risk-free rate is the Treasury yield, not the returns for bonds in general.<\/p><p>Because the firm is being acquired, we assume the new owners will utilize an optimal capital structure and weights in the WACC calculation. The capital structure for public firms should not be used because public firms have better access to debt financing.<\/p><p>The WACC using the optimal capital structure factors in the debt to total cap, the cost of debt, the tax rate, and the given cost of equity:<\/p><p>[20% × 11% × (1-30%)] + [(1-20%) × 18.5%] = 16.3%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.e<\/div><div class=\"qtext\"><p>Using the following information, calculate the WACC using the build-up method, assuming the firm is being acquired.<\/p><div class=\"tbl\"><table><tr><td>Income return on bonds<\/td><td>6.0%<\/td><\/tr><tr><td>Capital return on bonds<\/td><td>2.0%<\/td><\/tr><tr><td>Long-term Treasury yield<\/td><td>3.5%<\/td><\/tr><tr><td>Beta<\/td><td>1.4<\/td><\/tr><tr><td>Equity risk premium<\/td><td>6.0%<\/td><\/tr><tr><td>Sma
