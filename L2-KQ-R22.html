ll stock premium<\/td><td>4.0%<\/td><\/tr><tr><td>Company-specific risk premium<\/td><td>3.0%<\/td><\/tr><tr><td>Industry risk-premium<\/td><td>2.0%<\/td><\/tr><tr><td>Pretax cost of debt<\/td><td>11.0%<\/td><\/tr><tr><td>Optimal Debt/Total Cap<\/td><td>20%<\/td><\/tr><tr><td>Current Debt/Total<\/td><td>7%<\/td><\/tr><tr><td>Debt/Total Cap for public firms in<br>industry<\/td><td>33%<\/td><\/tr><tr><td>Tax Rate<\/td><td>30%<\/td><\/tr><\/table><\/div><\/div>", "subj": "equity"}, {"n": 34, "q": "An analyst calculates a control premium of 15% and discount for lack of marketability (DLOM) of 20%. Which of the following is closest to the total discount for valuing minority equity interests in the private firm?", "opts": ["35.0%.", "35.7%.", "30.4%."], "ans": "C", "expl": "The discount for lack of control (DLOC) can be backed out of the control premium. 1 DLOC = 1 -  [  ] 1 + Control Premium 1 DLOC = 1 -  [  ]  = 13.04% 1 + 0.15 The total discount also uses the DLOM. Total Discount = 1 − [(1 − DLOC)(1 − DLOM)] Total Discount = 1 − [(1 − 0.1304)(1 − 0.20)] = 30.4%", "explhtml": "<p>The discount for lack of control (DLOC) can be backed out of the control premium.<\/p><p>1 DLOC = 1 -  [ &nbsp; ]<\/p><p>1 + Control Premium<\/p><p>1 DLOC = 1 -  [ &nbsp; ]  = 13.04%<\/p><p>1 + 0.15<\/p><p>The total discount also uses the DLOM.<\/p><p>Total Discount = 1 − [(1 − DLOC)(1 − DLOM)]<\/p><p>Total Discount = 1 − [(1 − 0.1304)(1 − 0.20)] = 30.4%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.f<\/div><div class=\"qtext\"><p>An analyst calculates a control premium of 15% and discount for lack of marketability (DLOM) of 20%. Which of the following is closest to the total discount for valuing minority equity interests in the private firm?<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "An analyst values a private firm by using price multiples from the sale of whole companies, with adjustments for risk differences. Which of the following best describes the valuation method that the analyst is using?", "opts": ["The guideline public company method.", "The prior transaction method.", "The guideline transactions method."], "ans": "C", "expl": "The guideline transactions method (GTM) generates a value estimate based on pricing multiples associated with the acquisition of control of entire companies. The guideline public company method (GPCM) generates an estimate of value based on the multiples from trading activity in the shares of public companies that are similar to the private company in question. The prior transaction method (PTM) uses actual transactions in the stock of the subject private company.", "explhtml": "<p>The guideline transactions method (GTM) generates a value estimate based on pricing multiples associated with the acquisition of control of entire companies. The guideline public company method (GPCM) generates an estimate of value based on the multiples from trading activity in the shares of public companies that are similar to the private company in question. The prior transaction method (PTM) uses actual transactions in the stock of the subject private company.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.i<\/div><div class=\"qtext\"><p>An analyst values a private firm by using price multiples from the sale of whole companies, with adjustments for risk differences. Which of the following best describes the valuation method that the analyst is using?<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "Which of the following is most accurate regarding the asset-based approach? Of the three valuation methods for private firms, it usually:", "opts": ["is the most appropriate for going concerns.", "is not difficult to apply.", "results in the lowest valuation."], "ans": "C", "expl": "The asset-based approach is generally not used for going concerns. Because it is easier to find comparable data at the firm level compared to the asset level, the income and market approaches would be preferred to value going concerns. Because it is difficult to find data for individual intangible assets and specialized assets, the asset-based approach can be difficult to apply. It generally results in the lowest valuation because the use of a firm's assets in combination usually results in greater value creation than each of its parts individually.", "explhtml": "<p>The asset-based approach is generally not used for going concerns. Because it is easier to find comparable data at the firm level compared to the asset level, the income and market approaches would be preferred to value going concerns.<\/p><p>Because it is difficult to find data for individual intangible assets and specialized assets, the asset-based approach can be difficult to apply. It generally results in the lowest valuation because the use of a firm&#x27;s assets in combination usually results in greater value creation than each of its parts individually.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.3, LOS 22.g<\/div><div class=\"qtext\"><p>Which of the following is most accurate regarding the asset-based approach? Of the three valuation methods for private firms, it usually:<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Which of the following statements related to the models used to estimate the required rate of return to private company equity is most accurate:", "opts": ["The CAPM model uses betas estimated from firm returns of other private firms.", "The expanded CAPM model adds premiums for size and firm-specific risk.", "The build-up method begins with betas for comparable public firms and adds risk premiums."], "ans": "B", "expl": "Expanded CAPM adds premiums for size and firm-specific risk. CAPM may not be appropriate for private firms because beta is usually estimated from public firm returns. The build-up method adds an industry risk and other risk premiums to market rate of return; it is used when betas for comparable public firms are not available.", "explhtml": "<p>Expanded CAPM adds premiums for size and firm-specific risk. CAPM may not be appropriate for private firms because beta is usually estimated from public firm returns. The build-up method adds an industry risk and other risk premiums to market rate of return; it is used when betas for comparable public firms are not available.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.e<\/div><div class=\"qtext\"><p>Which of the following statements related to the models used to estimate the required rate of return to private company equity is most accurate:<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "Given the following figures, calculate the FCFF. Assume the earnings and expenses are normalized and that capital expenditures will cover depreciation plus 3 percent of the firm's incremental revenues. Current Revenues $30,000,000 Revenue growth 6% Gross profit margin 20% Depreciation expense as a percent of\nsales 1% Working capital as a percent of sales 15% SG&A expenses $3,800,000 Tax rate 30%", "opts": ["$927,400.", "$1,245,400.", "$1,785,400."], "ans": "B", "expl": "The answer is calculated as follows: Pro forma Income\nStatement  Revenues $31,800,000 Cost of Goods Sold $25,440,000 Gross Profit $6,360,000 SG&A Expenses $3,800,000 Pro forma EBITDA $2,560,000 Depreciation and\namortization $318,000 Pro forma EBIT $2,242,000 Pro forma taxes on EBIT $672,600 Operating income after tax $1,569,400   Adjustments to obtain FCFF  Plus: Depreciation and\namortization $318,000 Minus: Capital expenditures $372,000 Minus: Increase in working\ncapital $270,000 FCFF $1,245,400 The following provides a line by line explanation for the above calculations. Pro forma Income\nStatement Explanation Revenues Current revenues times the growth rate:\n$30,000,000 × (1.06) Cost of Goods Sold Revenues times one minus the gross profit margin:\n$31,800,000 × (1 − 0.20) Gross Profit Revenues times the gross profit margin: $31,800,000\n× 0.20 SG&A Expenses Given in the question Pro forma EBITDA Gross Profit minus SG&A expenses: $6,360,000 −\n$3,800,000 Depreciation and\namortization Revenues times the given depreciation expense:\n$31,800,000 × 0.01 Pro forma EBIT EBITDA minus depreciation and amortization:\n$2,560,000 − $318,000 Pro forma taxes on EBIT EBIT times tax rate: $2,242,000 × 0.30 Operating income after tax EBIT minus taxes: $2,242,000 − $672,600   Adjustments to obtain FCFF  Plus: Depreciation and\namort. Add back noncash charges from above Minus: Capital expenditures Expenditures cover depreciation and increase with\nrevenues: $318,000 + (0.03 × $31,800,000 −\n$30,000,000) Minus: Increase in working\ncapital The working capital will increase as revenues\nincrease: (0.15 × $31,800,000 − $30,000,000) FCFF Operating income net of the adjustments above", "explhtml": "<p>The answer is calculated as follows:<\/p><div class=\"tbl\"><table><tr><td>Pro forma Income<br>Statement<\/td><td><\/td><\/tr><tr><td>Revenues<\/td><td>$31,800,000<\/td><\/tr><tr><td>Cost of Goods Sold<\/td><td>$25,440,000<\/td><\/tr><tr><td>Gross Profit<\/td><td>$6,360,000<\/td><\/tr><tr><td>SG&amp;A Expenses<\/td><td>$3,800,000<\/td><\/tr><tr><td>Pro forma EBITDA<\/td><td>$2,560,000<\/td><\/tr><tr><td>Depreciation and<br>amortization<\/td><td>$318,000<\/td><\/tr><tr><td>Pro forma EBIT<\/td><td>$2,242,000<\/td><\/tr><tr><td>Pro forma taxes on EBIT<\/td><td>$672,600<\/td><\/tr><tr><td>Operating income after tax<\/td><td>$1,569,400<\/td><\/tr><tr><td>Adjustments to obtain FCFF<\/td><td><\/td><\/tr><tr><td>Plus: Depreciation and<br>amortization<\/td><td>$318,000<\/td><\/tr><tr><td>Minus: Capital expenditures<\/td><td>$372,000<\/td><\/tr><tr><td>Minus: Increase in working<br>capital<\/td><td>$270,000<\/td><\/tr><tr><td>FCFF<\/td><td>$1,245,400<\/td><\/tr><\/table><\/div><p>The following provides a line by line explanation for the above calculations.<\/p><div class=\"tbl\"><table><tr><td>Pro forma Income<br>Statement<\/td><td>Explanation<\/td><\/tr><tr><td>Revenues<\/td><td>Current revenues times the growth rate:<br>$30,000,000 × (1.06)<\/td><\/tr><tr><td>Cost of Goods Sold<\/td><td>Revenues times one minus the gross profit margin:<br>$31,800,000 × (1 − 0.20)<\/td><\/tr><tr><td>Gross Profit<\/td><td>Revenues times the gross profit margin: $31,800,000<br>× 0.20<\/td><\/tr><tr><td>SG&amp;A Expenses<\/td><td>Given in the question<\/td><\/tr><tr><td>Pro forma EBITDA<\/td><td>Gross Profit minus SG&amp;A expenses: $6,360,000 −<br>$3,800,000<\/td><\/tr><tr><td>Depreciation and<br>amortization<\/td><td>Revenues times the given depreciation expense:<br>$31,800,000 × 0.01<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Pro forma EBIT<\/td><td>EBITDA minus depreciation and amortization:<br>$2,560,000 − $318,000<\/td><\/tr><tr><td>Pro forma taxes on EBIT<\/td><td>EBIT times tax rate: $2,242,000 × 0.30<\/td><\/tr><tr><td>Operating income after tax<\/td><td>EBIT minus taxes: $2,242,000 − $672,600<\/td><\/tr><tr><td>Adjustments to obtain FCFF<\/td><td><\/td><\/tr><tr><td>Plus: Depreciation and<br>amort.<\/td><td>Add back noncash charges from above<\/td><\/tr><tr><td>Minus: Capital expenditures<\/td><td>Expenditures cover depreciation and increase with<br>revenues: $318,000 + (0.03 × $31,800,000 −<br>$30,000,000)<\/td><\/tr><tr><td>Minus: Increase in working<br>capital<\/td><td>The working capital will increase as revenues<br>increase: (0.15 × $31,800,000 − $30,000,000)<\/td><\/tr><tr><td>FCFF<\/td><td>Operating income net of the adjustments above<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.c<\/div><div class=\"qtext\"><p>Given the following figures, calculate the FCFF. Assume the earnings and expenses are normalized and that capital expenditures will cover depreciation plus 3 percent of the firm&#x27;s incremental revenues.<\/p><div class=\"tbl\"><table><tr><td>Current Revenues<\/td><td>$30,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>6%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>20%<\/td><\/tr><tr><td>Depreciation expense as a percent of<br>sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$3,800,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><\/div>", "subj": "equity"}, {"n": 39, "q": "Assuming Choo uses price multiples based on the four years of financial information from Bakan, ignoring his additional notes regarding 2x10, which of the following statements is least accurate?", "opts": ["Price to Earnings ratios would be meaningless.", "Price to Book ratios would be the most useful as they would take account of the human capital in a start-up business such as Bakan.", "Price to Cash Flow ratios are theoretically better if calculated using free cash flow to equity rather than CFO."], "ans": "B", "expl": "As Bakan has negative earnings over the period, a P/E ratio would be negative and hence meaningless, so A is correct. Book values do not take account of human capital, as it is not on the Balance Sheet within Net Assets. FCFE is preferable to CFO.", "explhtml": "<p>As Bakan has negative earnings over the period, a P/E ratio would be negative and hence meaningless, so A is correct. Book values do not take account of human capital, as it is not on the Balance Sheet within Net Assets. FCFE is preferable to CFO.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 39–44<\/summary><div class=\"vig-body\"><p>Jimmy Choo, CFA, works for Joel Constable, a high net worth investor who invests a large proportion of his portfolio speculatively in order to chase high returns. Choo is usually tasked with carrying out initial analysis on investment opportunities, which Constable has identified and may proceed further with.<\/p><p>Most of the opportunities identified by Constable are investments in private companies with little history of profits or dividends. Some, however, are more stable growth companies, which Constable still believes to be undervalued.<\/p><p>One opportunity recently identified by Constable is a private company, Bakan Fashion. Bakan is a fashion retailer, which started up recently with an online presence and a retail unit in a high- end location on a city high street. The company began trading four years ago and has published the following financial information for the benefit of its investors:<\/p><p>Bakan Fashion<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v006.webp\" style=\"max-width:min(100%,447px)\" alt=\"Income Statement ($m) (extracts) 2x07 2x08 2x09 2x10 1.9 Revenue 0.3 0.8 1.9 Net income (0.9) (0.9) (0.3) 0.1\"><p>Cash flow statement ($m) (extracts) 2x07 2x08 2x09 2x10<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v007.webp\" style=\"max-width:min(100%,658px)\" alt=\"CFO (0.6) (0.7) (0.3) 0.2 CFI (3.6) (3.2) (1.0) (0.4) CFF 5.6 0.4 1.0 0.4 Balance sheet ($m) (extracts) 2x07 2x08 2x09 2x10 2.9 3.0 2.6 3.2 Net assets\"><p>Choo has also made some additional notes regarding the 2x10 net income figure after meeting briefly with the finance director of Bakan.<\/p><p>Notes Re: 2x10 Net Income<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v008.webp\" style=\"max-width:min(100%,630px)\" alt=\"• CEO compensation package is $650,000 per annum • A leading fashion supplier provided the retail outlet at a rate of $120,000 per annum for the first four years • A friend of the CEO helped set up the online operations for a discounted cost of $20,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v009.webp\" style=\"max-width:min(100%,638px)\" alt=\"• The CEO agreed to the compensation package in a bid to help the company breakeven as quickly as possible. Choo estimates that a market based compensation figure would be $850,000 • The market lease rate for the retail unit is $170,000 • The set up cost for the online operation should have been $50,000\"><p>In addition to the financial information for Bakan, Choo has also identified the following specific factors, which he always takes into account in any analysis of private companies for Constable:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v010.webp\" style=\"max-width:min(100%,640px)\" alt=\"Private company equity typically has fewer potential owners and is less liquid than\"><p>Factor 1: publicly traded shares; hence a discount should be applied in any valuation of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v011.webp\" style=\"max-width:min(100%,640px)\" alt=\"Bakan. One key objective of the board of Bakan may be to limit exposure to taxes, as 75%\"><p>Factor 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v012.webp\" style=\"max-width:min(100%,653px)\" alt=\"of the board members also own substantial equity in the company. Due to the significant ownership of equity by the board of Bakan, management may\"><p>Factor 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v013.webp\" style=\"max-width:min(100%,653px)\" alt=\"be tempted to take a shorter-term view than that typically taken by public firms.\"><p>Constable always prefers to see a basic analysis of price multiples for companies before any valuation.<\/p><p>Choo produces this where possible, but usually follows it with a valuation of the private company-using price multiples based on recent sales of comparable assets. He calls this the \"Choo Comparison Method (CCM).\" The CCM valuation is then adjusted by Constable and Choo to take account of Constable's individual financing costs and any perceived synergies with his existing assets.<\/p><p>Choo refers to this final valuation after adjustments in his reports as the \"Intrinsic Value.\" Constable has recently taken him to task on this and suggested that as the valuation focuses on the value to him as a specific investor it should be called the \"Investment Value.\"<\/p><\/div><\/details><div class=\"pp-topic\">Module 22.3, LOS 22.i<\/div><div class=\"qtext\"><p>Assuming Choo uses price multiples based on the four years of financial information from Bakan, ignoring his additional notes regarding 2x10, which of the following statements is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 40, "q": "When valuing private companies, how would the factors described by Choo usually be classified?", "opts": ["Factor 1 Stock-specific, Factor 2 Stock-specific.", "Factor 1 Stock-specific, Factor 2 Company-specific.", "Factor 1 Company-specific, Factor 2 Company-specific."], "ans": "B", "expl": "Stock-specific factors are liquidity, restrictions on marketability, concentration of control. Company-specific are stage of lifecycle, size, quality and depth of management, management shareholder overlap, short-term investors, quality of information, taxes.", "explhtml": "<p>Stock-specific factors are liquidity, restrictions on marketability, concentration of control.<\/p><p>Company-specific are stage of lifecycle, size, quality and depth of management, management shareholder overlap, short-term investors, quality of information, taxes.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 39–44<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jimmy Choo, CFA, works for Joel Constable, a high net worth investor who invests a large proportion of his portfolio speculatively in order to chase high returns. Choo is usually tasked with carrying out initial analysis on investment opportunities, which Constable has identified and may proceed further with.<\/p><p>Most of the opportunities identified by Constable are investments in private companies with little history of profits or dividends. Some, however, are more stable growth companies, which Constable still believes to be undervalued.<\/p><p>One opportunity recently identified by Constable is a private company, Bakan Fashion. Bakan is a fashion retailer, which started up recently with an online presence and a retail unit in a hi 0px)\" alt=\"Private company equity typically has fewer potential owners and is less liquid than\"><p>Factor 1: publicly traded shares; hence a discount should be applied in any valuation of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v011.webp\" style=\"max-width:min(100%,640px)\" alt=\"Bakan. One key objective of the board of Bakan may be to limit exposure to taxes, as 75%\"><p>Factor 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v012.webp\" style=\"max-width:min(100%,653px)\" alt=\"of the board members also own substantial equity in the company. Due to the significant ownership of equity by the board of Bakan, management may\"><p>Factor 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v013.webp\" style=\"max-width:min(100%,653px)\" alt=\"be tempted to take a shorter-term view than that typically taken by public firms.\"><p>Constable always prefers to see a basic analysis of price multiples for companies before any valuation.<\/p><p>Choo produces this where possible, but usually follows it with a valuation of the private company-using price multiples based on recent sales of comparable assets. He calls this the \"Choo Comparison Method (CCM).\" The CCM valuation is then adjusted by Constable and Choo to take account of Constable's individual financing costs and any perceived synergies with his existing assets.<\/p><p>Choo refers to this final valuation after adjustments in his reports as the \"Intrinsic Value.\" Constable has recently taken him to task on this and suggested that as the valuation focuses on the value to him as a specific investor it should be called the \"Investment Value.\"<\/p><\/div><\/details><div class=\"pp-topic\">Module 22.1, LOS 22.a<\/div><div class=\"qtext\"><p>When valuing private companies, how would the factors described by Choo usually be classified?<\/p><\/div>", "subj": "equity"}, {"n": 41, "q": "Is Choo correct in his assessment of Factor 3?", "opts": ["Yes.", "No, it is rare for priva akan. One key objective of the board of Bakan may be to limit exposure to taxes, as 75%\"><p>Factor 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v012.webp\" style=\"max-width:min(100%,653px)\" alt=\"of the board members also own substantial equity in the company. Due to the significant ownership of equity by the board of Bakan, management may\"><p>Factor 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r22/v013.webp\" style=\"max-width:min(100%,653px)\" alt=\"be tempted to take a shorter-term view than that typically taken by public firms.\"><p>Constable always prefers to see a basic analysis of price multiples for companies before any valuation.<\/p><p>Choo produces this where possible, but usually follows it with a valuation of the private company-using price multiples based on recent sales of comparable assets. He calls this the \"Choo Comparison Method (CCM).\" The CCM valuation is then adjusted by Constable and Choo to take account of Constable's individual financing costs and any perceived synergies with his existing assets.<\/p><p>Choo refers to this final valuation after adjustments in his reports as the \"Intrinsic Value.\" Constable has recently taken him to task on this and suggested that as the valuation focuses on the value to him as a specific investor it should be called the \"Investment Value.\"<\/p><\/div><\/details><div class=\"pp-topic\">Module 22.1, LOS 22.c<\/div><div class=\"qtext\"><p>Using Choo&#x27;s additional notes on Bakan&#x27;s 2x10 Net Income, which of the following is the most accurate estimate of normalized earnings for 2x10?<\/p><\/div>", "subj": "equity"}, {"n": 45, "q": "Which of the following best describes projection risk in the estimation of the discount rate for private company valuations?", "opts": ["Projection risk results in higher discount rates.", "If the availability of information from private firms is poor, the uncertainty of projected cash flows may increase.", "Management will always be overly optimistic to increase the acquisition price."], "ans": "B", "expl": "Projection risk refers to the risk of misestimating future cash flows. Given the lower availability of information from private firms, the uncertainty of projected cash flows may increase. However, management may not be experienced with projections and may underestimate or overestimate future prospects. The discount rate would then be decreased or increased accordingly. So management is not always overly optimistic and projection risk does not always result in higher discount rates.", "explhtml": "<p>Projection risk refers to the risk of misestimating future cash flows. Given the lower availability of information from private firms, the uncertainty of projected cash flows may increase.<\/p><p>However, management may not be experienced with projections and may underestimate or overestimate future prospects. The discount rate would then be decreased or increased accordingly. So management is not always overly optimistic and projection risk does not always result in higher discount rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.d<\/div><div class=\"qtext\"><p>Which of the following best describes projection risk in the estimation of the discount rate for private company valuations?<\/p><\/div>", "subj": "equity"}, {"n": 46, "q": "Which of the following best describes the build-up method used for the estimation of the discount rate in private company valuations?", "opts": ["An industry risk premium is not included because it is captured in the equity risk premium.", "It is useful when there are no comparable public firms.", "Because it is not used in the calculation, beta is assumed to be zero."], "ans": "B", "expl": "If it is not possible to find comparable public firms with which to estimate beta by, the build-up method can be used for a private firm. It is similar to the expanded CAPM except that beta is not used. Implicitly, beta is assumed to be one. Both industry risk premiums and equity risk premiums are used. The risk-free rate, the equity risk premium, the small stock premium, a company-specific risk premium, and an industry risk premium are added together in the build-up method.", "explhtml": "<p>If it is not possible to find comparable public firms with which to estimate beta by, the build-up method can be used for a private firm. It is similar to the expanded CAPM except that beta is not used. Implicitly, beta is assumed to be one. Both industry risk premiums and equity risk premiums are used. The risk-free rate, the equity risk premium, the small stock premium, a company-specific risk premium, and an industry risk premium are added together in the build-up method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.e<\/div><div class=\"qtext\"><p>Which of the following best describes the build-up method used for the estimation of the discount rate in private company valuations?<\/p><\/div>", "subj": "equity"}, {"n": 47, "q": "Assume a minority shareholder holds 10% of a private firm's equity, with the CEO holding the other 90%. Using normalized earnings, the value of the firm's equity is estimated at $20 million. The CEO refuses to sell the firm and the minority shareholder cannot sell their interest easily. A discount for lack of marketability (DLOM) of 15% will be applied. A discount for lack of control (DLOC) will also be estimated. Using reported earnings instead of normalized earnings provides an estimated firm equity value of $19 million. Which of the following is closest to the value of the minority shareholder's equity interest?", "opts": ["$1,900,000.", "$1,615,000.", "$1,700,000."], "ans": "B", "expl": "Given these figures, the value of the minority shareholder's equity interest is: Firm's equity value $19,000,000 Minority interest 10% Value of minority interest without\ndiscounts $1,900,000 minus DLOC of 0% 0 Value of interest if marketable $1,900,000 minus DLOM of 15% $285,000 Value of minority interest $1,615,000", "explhtml": "<p>Given these figures, the value of the minority shareholder&#x27;s equity interest is:<\/p><div class=\"tbl\"><table><tr><td>Firm&#x27;s equity value<\/td><td>$19,000,000<\/td><\/tr><tr><td>Minority interest<\/td><td>10%<\/td><\/tr><tr><td>Value of minority interest without<br>discounts<\/td><td>$1,900,000<\/td><\/tr><tr><td>minus DLOC of 0%<\/td><td>0<\/td><\/tr><tr><td>Value of interest if marketable<\/td><td>$1,900,000<\/td><\/tr><tr><td>minus DLOM of 15%<\/td><td>$285,000<\/td><\/tr><tr><td>Value of minority interest<\/td><td>$1,615,000<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 22.2, LOS 22.f<\/div><div class=\"qtext\"><p>Assume a minority shareholder holds 10% of a private firm&#x27;s equity, with the CEO holding the other 90%. Using normalized earnings, the value of the firm&#x27;s equity is estimated at $20 million. The CEO refuses to sell the firm and the minority shareholder cannot sell their interest easily. A discount for lack of marketability (DLOM) of 15% will be applied. A discount for lack of control (DLOC) will also be estimated. Using reported earnings instead of normalized earnings provides an estimated firm equity value of $19 million. Which of the following is closest to the value of the minority shareholder&#x27;s equity interest?<\/p><\/div>", "subj": "equity"}, {"n": 48, "q": "A private business is being valued for the purpose of determining the appropriate level of performance-based managerial compensation. This private company valuation would be best described as a:", "opts": ["Transaction-related valuation", "Litigation-related valuation", "Compliance-related valuation"], "ans": "A", "expl": "Transaction-related valuations may be performed for reasons related to venture capital financing, an IPO, a sale of the firm, bankruptcy, or performance-based managerial compensation. Compliance-related valuations are performed for financial reporting and tax purposes. Litigation-related valuations may be required for shareholder suits, damage claims, lost profits, or divorces.", "explhtml": "<p>Transaction-related valuations may be performed for reasons related to venture capital financing, an IPO, a sale of the firm, bankruptcy, or performance-based managerial compensation. Compliance-related valuations are performed for financial reporting and tax purposes. Litigation-related valuations may be required for shareholder suits, damage claims, lost profits, or divorces.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 22.1, LOS 22.b<\/div><div class=\"qtext\"><p>A private business is being valued for the purpose of determining the appropriate level of performance-based managerial compensation. This private company valuation would be best described as a:<\/p><\/div>", "subj": "equity"}];
const CFG = {"title": "Reading 22 — Private Company Valuation", "subtitle": "CFA Level II · 48 câu · Kaplan Schweser QBank 2025 (34 câu đơn · 14 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";

    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

(function(){

    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
