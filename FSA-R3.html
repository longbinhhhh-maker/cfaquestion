<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "In Country Norlatia, revenue is recognized in the income statement when a sale is made.\nWhich of the following tax treatments would most likely result in a deferred tax liability?", "opts": ["Revenue is not taxable.", "Revenue is taxable when a sale is made.", "Revenue is taxable when the cash is received from the customer."], "ans": "C", "expl": "There may be a temporary timing difference between when a sale is made and when cash\nis received. If the customer does not pay immediately, the revenue has been recognized in\nthe income statement before it becomes taxable. This will be taxable at a later date and,\nas a result, a deferred tax liability will be created. If revenue was taxable when a sale is\nmade, there would be no difference between accounting and tax treatment. If revenue\nwas not taxable, this would be a permanent difference. Deferred taxes are only used for\ntemporary timing differences.\n(Module 29.1, LOS 29.d)"}, {"n": 2, "q": "Common size balance sheets express all balance sheet items as a percentage of:", "opts": ["sales.", "assets.", "equity."], "ans": "B", "expl": "Common size balance sheets express all balance sheet items as a percentage of assets.\nCommon size income statements express all income statement items as a percentage of\nsales.\n(Module 29.2, LOS 29.e)"}, {"n": 3, "q": "Heath Ltd., a pharmaceutical firm, has been working on a new vaccine. At the beginning of\nthe year, the firm incurred £780,000 in initial testing costs, which proved that the vaccine is\ntechnically feasible. The firm now plans to commence production and has secured a contract\nwith the government for sales. It expects to spend £95,000 in training costs, £530,000 in\nmaterials and direct labor, and £260,000 in production overhead. Under IFRS, how much\nshould be expensed?", "opts": ["£875,000.", "£780,000.", "£1,135,000."], "ans": "A", "expl": "Total expenses = £780,000 initial testing costs + £95,000 training costs = £875,000.\nUnder IFRS, any costs incurred during the research phase should be expensed (the initial\n£780,000). Costs incurred during development are capitalized. Heath Ltd. moved from\nresearch to development at the point where the vaccine was proven technically feasible, a\nmarket exists for the product (the contract with the government), and it has the intention\nand resources to complete and sell the vaccine. Training costs are always expensed,\nregardless of whether they are incurred during research or development. The\ndevelopment costs for materials, direct labor, and production overhead will be capitalized.\nNote that if the firm incurred any costs for administrative overhead, these would also be\nexpensed.\n(Module 29.1, LOS 29.a)"}, {"n": 4, "q": "When comparing firms, which of the following is the most accurate approach to adjusting\ngoodwill to enable analysis?", "opts": ["Remove goodwill from the balance sheet only, as goodwill does not impact the income statement.", "No adjustments should be made to either the balance sheet or income statement.", "Remove goodwill from the balance sheet and remove any income statement impact."], "ans": "C", "expl": "Goodwill is subjective and should be removed from the balance sheet for analytical\npurposes. Even though goodwill is not amortized, it can impact the income statement if it\nis impaired, or if a gain from a bargain purchase has occurred. Any income statement\nimpact should also be removed.\n(Module 29.1, LOS 29.b)"}, {"n": 5, "q": "Which of the following scenarios would most likely result in the greatest goodwill recognized\non the balance sheet?", "opts": ["Purchasing Company Z for $700,000, where the fair value of the net identifiable assets is $800,000.", "Acquiring Firm X for $500,000, with goodwill calculated at $90,000.", "Building up Brand Y internally, with estimated goodwill of $95,000."], "ans": "B", "expl": "Only acquiring Firm X will result in goodwill being recorded on the balance sheet. Internally\ngenerated goodwill is expensed on the income statement. The purchase of Company Z\nresulted in a gain from a bargain purchase of $100,000 as the amount paid was less than\nthe fair value of net identifiable assets. This gain will be recognized as income on the\nincome statement.\n(Module 29.1, LOS 29.b)"}, {"n": 6, "q": "Interest income from a financial asset is recorded on the income statement if the underlying\nfinancial asset is recognized as:", "opts": ["trading only.", "trading or available for sale.", "held to maturity, trading, or available for sale."], "ans": "C", "expl": "Interest/dividend income and realized gains/losses are recognized on the income\nstatement for all three classifications of financial assets. The different accounting\ntreatments relate to unrealized gains/losses and the value on the balance sheet (fair value\nfor trading and available for sale; amortized cost for held to maturity).\n(Module 29.1, LOS 29.c)"}, {"n": 7, "q": "James Alexander, Inc., paid par of $220,000 for 5% coupon bonds in Charles Michael, Inc. By\nthe end of the accounting period, the fair value of the bonds was $212,000. The firm plans to\nhold these bonds for a few years but sell them before maturity. What will be the most likely\nimpact on net income at the end of the first year?", "opts": ["Net income will increase.", "Net income will be unaffected.", "Net income will decrease."], "ans": "A", "expl": "These bonds will be classified as fair value through other comprehensive income, or\navailable-for-sale securities under U.S. GAAP. Any interest income will increase net income.\nThe bonds will be recognized at fair value ($212,000) at the end of the year, and the\nunrealized loss of $8,000 will be recognized in other comprehensive income.\n(Module 29.1, LOS 29.c)"}, {"n": 8, "q": "Under U.S. GAAP, the balance sheet value of a debt security classified as held-to-maturity is\nits:", "opts": ["amortized cost.", "historical cost.", "fair value."], "ans": "A", "expl": "Under U.S. GAAP, held-to-maturity securities are carried on the balance sheet at their\namortized cost.\n(Module 29.1, LOS 29.c)"}, {"n": 9, "q": "An analyst has gathered the following information about a company:\nBalance Sheet\nAssets\nCash100\nAccounts Receivable750\nMarketable Securities300\nInventory850\nProperty, Plant & Equip900\nAccumulated Depreciation(150)\nTotal Assets2750\nLiabilities and Equity\nAccounts Payable300\nShort-Term Debt130\nLong-Term Debt700\nCommon Stock1000\nRetained Earnings620\nTotal Liab. and Stockholder's equity2750\nIncome Statement\nSales1500\nCOGS1100\nGross Profit400\nSG&A150\nOperating Profit250\nInterest Expense25\nTaxes75\nNet Income150\nWhat is the quick ratio?", "opts": ["0.62.", "1.53.", "2.67."], "ans": "C", "expl": "Quick ratio = [100(cash) + 750(AR) + 300(marketable securities)] / [300(AP) + 130(short-term\ndebt)] = (1,150 / 430) = 2.67\n(Module 29.2, LOS 29.e)"}, {"n": 10, "q": "A U.S. GAAP reporting firm invests some of its cash in equity securities that have quoted\nmarket prices. The firm may classify these securities as:", "opts": ["available-for-sale securities only.", "trading securities only.", "trading securities, unless it elects at the time of purchase to classify them as available-for-sale."], "ans": "B", "expl": "U.S. GAAP requires equity securities to be classified as trading securities. IFRS offers firms\nan irrevocable choice at the time of purchase to account for equity securities as measured\nat fair value through other comprehensive income.\n(Module 29.1, LOS 29.c)"}, {"n": 11, "q": "Balance sheet data for two comparable firms are presented below:\nAmplus, Inc.Brevis, Inc.\nCash and equivalents3,800500\nAccounts receivable2,400700\nInventories5,8001,100\nCurrent assets12,0002,300\nLand400100\nProperty, plant and equipment24,6006,400\nNoncurrent assets25,0006,500\nTotal assets37,0008,800\nAccounts payable1,800400\nUnearned revenue600100\nCurrent liabilities2,400500\nLong-term borrowing9,6003,300\nTotal liabilities12,0003,800\nCommon stock1,500300\nRetained earnings23,5004,700\nTotal equity25,0005,000\nTotal liabilities and equity37,0008,800\nBased on common-size analysis of the two firms' balance sheets, Amplus Company:", "opts": ["has a greater investment in working capital than Brevis Company.", "is more financially leveraged than Brevis Company.", "uses relatively more fixed assets then Brevis Company."], "ans": "A", "expl": "Common-size balance sheets for the two firms are as follows:\nAmplus, Inc.Brevis, Inc.\nCash and equivalents10.3%5.7%\nAccounts receivable6.5%8.0%\nInventories15.7%12.5%\nCurrent assets32.4%26.1%\nLand1.1%1.1%\nProperty, plant and equipment66.5%72.7%\nNoncurrent assets67.6%73.9%\nTotal assets100.0%100.0%\nAccounts payable4.9%4.5%\nUnearned revenue1.6%1.1%\nCurrent liabilities6.5%5.7%\nLong-term borrowing25.9%37.5%\nTotal liabilities32.4%43.2%\nCommon stock4.1%3.4%\nRetained earnings63.5%53.4%\nTotal equity67.6%56.8%\nTotal liabilities and equity100.0%100.0%\nWorking capital (current assets minus current liabilities) is 32.4% – 6.5% = 25.9% of assets\nfor Amplus and 26.1% – 5.7% = 20.4% of assets for Brevis. Fixed assets (property, plant,\nand equipment) are relatively larger for Brevis than for Amplus. Based on long-term\nborrowing and total liabilities, Brevis is significantly more leveraged than Amplus.We can\nalso calculate the financial leverage ratios (assets / equity) as 1.48 for Amplus and 1.76 for\nBrevis. Note that these are the reciprocals of total equity as a percentage of assets from\nthe common-size balance sheet.\n(Module 29.2, LOS 29.e)"}, {"n": 12, "q": "Which of the following is classified as an identifiable intangible asset?", "opts": ["A security investment.", "A trademark.", "Goodwill."], "ans": "B", "expl": "Identifiable intangible assets are nonmonetary assets that lack physical substance, which\ncan be acquired separately. Goodwill cannot be acquired separately; therefore, it is an\nunidentifiable intangible asset. Securities are considered tangible rather than intangible\nassets.\n(Module 29.1, LOS 29.a)"}, {"n": 13, "q": "Balance sheet goodwill is most accurately described as the:", "opts": ["amount by which the purchase price of an acquired firm exceeds its identifiable net assets.", "value derived from the expected future performance of a firm.", "intangible value a firm creates in excess of its identifiable net assets."], "ans": "A", "expl": "Accounting goodwill is the amount by which the purchase price of an acquired firm is\ngreater than the fair value of its identifiable net assets. Internally generated goodwill is not\nrecognized on a firm's balance sheet. Value from the expected future performance of a\nfirm is referred to as \"economic goodwill\" to distinguish it from accounting goodwill.\n(Module 29.1, LOS 29.b)"}, {"n": 14, "q": "A segment of a common-size balance sheet for Olsen Company in its most recent year shows\nthe following data:\nCommon stock1%\nAdditional paid-in capital19%\nPreferred stock15%\nHow should an analyst most appropriately interpret these data?", "opts": ["Preferred stock is 15% of shareholders’ equity.", "Shareholders’ equity is 35% of total assets.", "Proceeds from the issuance of common stock are 20% of total assets."], "ans": "C", "expl": "Common-size balance sheets express each balance sheet item as a percentage of total\nassets. Contributed capital from issuing common shares may be included in common stock\n(at par value) or additional paid-in capital (for proceeds in excess of par value).\nShareholders' equity is unlikely to consist only of common and preferred stock, as it also\nincludes components such as retained earnings and accumulated other comprehensive\nincome.\n(Module 29.2, LOS 29.e)"}, {"n": 15, "q": "The following data is from Delta's common size financial statement:\nEarnings after taxes18%\nEquity40%\nCurrent assets60%\nCurrent liabilities30%\nSales$300\nTotal assets$1,400\nWhat is Delta's total-liabilities-to-equity ratio?", "opts": ["1.0.", "1.5.", "2.0."], "ans": "B", "expl": "If equity = 40% of assets, total liabilities = 60% of assets, thus 60 / 40 = 1.5.\n(Module 29.2, LOS 29.e)", "qhtml": "<p>The following data is from Delta's common size financial statement:</p><table class=\"qtable\"><tbody><tr><td>Earnings after taxes</td><td>18%</td></tr><tr><td>Equity</td><td>40%</td></tr><tr><td>Current assets</td><td>60%</td></tr><tr><td>Current liabilities</td><td>30%</td></tr><tr><td>Sales</td><td>$300</td></tr><tr><td>Total assets</td><td>$1,400</td></tr></tbody></table><p>What is Delta's total-liabilities-to-equity ratio?</p>"}, {"n": 16, "q": "Which of the following is most accurate regarding accounting goodwill?", "opts": ["The carrying value considers both the past acquisition cost and the future expected performance.", "The carrying value considers only the future expected performance.", "The carrying value considers only the past acquisition cost."], "ans": "A", "expl": "While the initial recognition of purchased goodwill is based on the acquisition cost\ncompared to the net identifiable assets obtained, goodwill must be tested for impairment\nat least annually. One key indicator of impairment would be where the expected future\nexcess returns to be earned from the acquired business have fallen compared to when\ninitially purchased. Therefore, the carrying value considers both the past and the future.\nEconomic goodwill only looks at the expected future performance of the firm and does not\nappear in the financial statements.\n(Module 29.1, LOS 29.b)"}, {"n": 17, "q": "Given the following income statement and balance sheet for a company:\nBalance Sheet\nAssetsYear 2003Year 2004\nCash500450\nAccounts Receivable600660\nInventory500550\nTotal CA16001660\nPlant, prop. equip10001250\nTotal Assets26002910\nLiabilities\nAccounts Payable500550\nLong term debt7001002\nTotal liabilities12001552\nEquity\nCommon Stock400538\nRetained Earnings1000820\nTotal Liabilities & Equity26002910\nIncome Statement\nSales3000\nCost of Goods Sold(1000)\nGross Profit2000\nSG&A(500)\nInterest Expense(151)\nEBT1349\nTaxes (30%)(405)\nNet Income944\nWhat is the current ratio for 2004?", "opts": ["0.331.", "2.018.", "3.018."], "ans": "C", "expl": "Current ratio = (CA / CL) = (1,660 / 550) = 3.018\n(Module 29.2, LOS 29.e)", "qhtml": "<p>Given the following income statement and balance sheet for a company:</p><p><strong>Balance Sheet</strong></p><table class=\"qtable\"><thead><tr><th></th><th>Year 2003</th><th>Year 2004</th></tr></thead><tbody><tr><td><strong>Assets</strong></td><td></td><td></td></tr><tr><td>Cash</td><td>500</td><td>450</td></tr><tr><td>Accounts Receivable</td><td>600</td><td>660</td></tr><tr><td>Inventory</td><td>500</td><td>550</td></tr><tr><td>Total CA</td><td>1,600</td><td>1,660</td></tr><tr><td>Plant, prop. equip</td><td>1,000</td><td>1,250</td></tr><tr><td>Total Assets</td><td>2,600</td><td>2,910</td></tr><tr><td><strong>Liabilities</strong></td><td></td><td></td></tr><tr><td>Accounts Payable</td><td>500</td><td>550</td></tr><tr><td>Long term debt</td><td>700</td><td>1,002</td></tr><tr><td>Total liabilities</td><td>1,200</td><td>1,552</td></tr><tr><td><strong>Equity</strong></td><td></td><td></td></tr><tr><td>Common Stock</td><td>400</td><td>538</td></tr><tr><td>Retained Earnings</td><td>1,000</td><td>820</td></tr><tr><td>Total Liabilities & Equity</td><td>2,600</td><td>2,910</td></tr></tbody></table><p><strong>Income Statement</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>3,000</td></tr><tr><td>Cost of Goods Sold</td><td>(1,000)</td></tr><tr><td>Gross Profit</td><td>2,000</td></tr><tr><td>SG&A</td><td>(500)</td></tr><tr><td>Interest Expense</td><td>(151)</td></tr><tr><td>EBT</td><td>1,349</td></tr><tr><td>Taxes (30%)</td><td>(405)</td></tr><tr><td>Net Income</td><td>944</td></tr></tbody></table><p>What is the current ratio for 2004?</p>"}, {"n": 18, "q": "A company purchases an intangible asset for which an active market exists. The company\nmay present the intangible asset's value using the revaluation model if it reports its financial\nstatements under:", "opts": ["IFRS, but not U.S. GAAP.", "neither IFRS nor U.S. GAAP.", "either IFRS or U.S. GAAP."], "ans": "A", "expl": "If an active market exists for a purchased intangible asset, IFRS permits companies to\nreport its value using the revaluation model. U.S. GAAP requires the cost model for\npurchased intangible assets.\n(Module 29.1, LOS 29.a)"}, {"n": 19, "q": "Anne is trying to classify some financial assets under IFRS and states the following:\nStatementUnlisted equity securities are always measured at amortized cost.\n1:\nStatementListed equity securities are always measured at fair value through profit and\n2:loss.\nWhich of these statements is most likely correct?", "opts": ["Neither Statement 1 nor Statement 2.", "Statement 1 only.", "Statement 2 only."], "ans": "A", "expl": "Unlisted equity securities are measured at amortized cost if the fair value cannot be\ndetermined reliably. The default classification for listed equity securities under IFRS is fair\nvalue through profit and loss, but the firm can choose at the time of purchase to measure\nat fair value through other comprehensive income.\n(Module 29.1, LOS 29.c)", "qhtml": "<p>Anne is trying to classify some financial assets under IFRS and states the following:</p><table class=\"qtable\"><thead><tr><th>Statement</th><th>Text</th></tr></thead><tbody><tr><td>1</td><td>Unlisted equity securities are always measured at amortized cost.</td></tr><tr><td>2</td><td>Listed equity securities are always measured at fair value through profit and loss.</td></tr></tbody></table><p>Which of these statements is most likely correct?</p>"}, {"n": 20, "q": "If a firm wishes to manipulate its net income upward in the year it purchases another\ncompany, which of the following would most likely make this possible?", "opts": ["Overvaluing goodwill and undervaluing the acquired identifiable assets.", "Overvaluing goodwill and overvaluing the acquired identifiable assets.", "Undervaluing goodwill and overvaluing the acquired identifiable assets."], "ans": "A", "expl": "Goodwill is not amortized, so it will not impact the income statement (unless subject to\nimpairment). By allocating more of the acquisition price to goodwill and less to the\nacquired identifiable assets, the firm will charge less depreciation on the identifiable\nassets—and, as a result, increase net income. In future years, overvaluing goodwill could\ncause a higher chance of impairment if revalued appropriately. Overvaluing the\nidentifiable assets will lead to higher depreciation and lower net income. Overvaluing both\nwill cause the balance sheet to no longer balance.\n(Module 29.1, LOS 29.b)"}, {"n": 21, "q": "A firm holds the following:\n1. Derivative assets\n2. Debt securities to be sold in the immediate future\n3. Debt securities to be held until maturity\nHow many of these can be measured at fair value through profit or loss (FVTPL)?", "opts": ["Two under IFRS, and all three under U.S. GAAP.", "Two under both U.S. GAAP and IFRS.", "Two under U.S. GAAP, and all three under IFRS."], "ans": "C", "expl": "The derivative assets and trading securities will be held at FVTPL under both IFRS and U.S.\nGAAP. The debt securities being held to maturity will be measured at amortized cost under\nU.S. GAAP. These will commonly be measured at amortized cost under IFRS, but firms can\nmake an irrevocable choice to carry any financial assets at FVTPL—and could, therefore,\nmeasure all three at FVTPL under IFRS.\n(Module 29.1, LOS 29.c)"}, {"n": 22, "q": "Under U.S. GAAP, unrealized gains and losses on available-for-sale securities are:", "opts": ["not recognized in the financial statements.", "recognized in other comprehensive income.", "recognized in the income statement."], "ans": "B", "expl": "Under U.S. GAAP, unrealized gains and losses on available-for-sale securities are\nrecognized in other comprehensive income.\n(Module 29.1, LOS 29.c)"}, {"n": 23, "q": "Selected balance sheet data for Parker Company are as follows:\nCurrent assets3,000\nLong-lived assets7,000\nTotal assets10,000\nCurrent liabilities2,000\nLong-term liabilities4,000\nTotal liabilities6,000\nShareholders' equity4,000\nOn a common-size balance sheet, Parker's current liabilities would be stated as:", "opts": ["20%.", "33%.", "67%."], "ans": "A", "expl": "On a common-size balance sheet, each line item is stated as a percentage of total assets:\n2,000 / 10,000 = 20%.\n(Module 29.2, LOS 29.e)"}, {"n": 24, "q": "Which of the following financial liabilities will most likely be held at fair value on the balance\nsheet?", "opts": ["Bank loans.", "Derivatives.", "Bonds."], "ans": "B", "expl": "Derivatives can be financial assets or liabilities and are recognized at fair value on the\nbalance sheet. Bank loans will most likely be issued at face value and reported on the\nbalance sheet at the same amount. If a bond is issued at a premium or discount to par, it\nwill be held at amortized cost.\n(Module 29.1, LOS 29.d)"}, {"n": 25, "q": "Typically, companies report non-current liabilities on the balance sheet at:", "opts": ["issuance price.", "fair value.", "amortized cost."], "ans": "C", "expl": "Non-current liabilities are usually carried at amortized cost, which is the issue price minus\nany principal payments, plus any amortized discount or minus any amortized premium.\n(Module 29.1, LOS 29.d)"}, {"n": 26, "q": "Under U.S. GAAP, unrealized gains and losses on trading securities are:", "opts": ["recognized in the income statement.", "not recognized in the financial statements.", "recognized in other comprehensive income."], "ans": "A", "expl": "Under U.S. GAAP, unrealized gains and losses on trading securities are recognized in the\nincome statement.\n(Module 29.1, LOS 29.c)"}, {"n": 27, "q": "The U.S. GAAP treatment of trading securities is the same as the IFRS treatment of securities\nmeasured at:", "opts": ["amortized cost.", "fair value through other comprehensive income.", "fair value through profit and loss."], "ans": "C", "expl": "Trading securities are measured at fair value through profit and loss under both U.S. GAAP\nand IFRS. Any unrealized gain/loss is recognized in the income statement, along with any\ninterest/dividend income and realized gains/losses.\n(Module 29.1, LOS 29.c)"}, {"n": 28, "q": "Adler, Inc., purchases an identifiable intangible asset on January 1, 20X7, for $100k. The\nfirm's policy is to amortize similar intangible assets on a straight-line basis over five years,\nbased on their useful life. The fair value of the intangible asset on December 31, 20X7, is\n$83,000. The asset will be recorded on the balance sheet at December 31, 20X7, under U.S.\nGAAP at:", "opts": ["$80,000.", "$100,000.", "$83,000."], "ans": "A", "expl": "Under U.S. GAAP, intangible assets must be held under the cost model. The revaluation\nmodel is not allowed; therefore, the asset cannot be revalued to $83,000, unlike under\nIFRS. Some intangibles that have indefinite lives, such as goodwill, are not amortized and\nremain at cost, with annual impairment reviews. This asset has a useful life of five years\nand will be amortized by $20,000 ($100,000 / 5) for the year, giving a balance sheet value\nof $80,000 at December 31, 20X7.\n(Module 29.1, LOS 29.a)"}, {"n": 29, "q": "Under IFRS, which types of financial assets may a firm elect to carry at fair value through\nprofit and loss?", "opts": ["Debt instruments only.", "Equity or debt securities, but not derivatives.", "Any financial asset."], "ans": "C", "expl": "Under IFRS, firms can make an irrevocable choice to carry any financial asset at fair value\nthrough profit and loss.\n(Module 29.1, LOS 29.c)"}];
const CFG = {"title": "Analyzing Balance Sheets", "subtitle": "CFA · Financial Statement Analysis · Reading 29 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const day = new Date().toISOString().slice(0,10);
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
