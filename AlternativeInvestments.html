à cơ bản để tập trung phần lớn\ndanh mục đầu tư của họ vào việc bán khống chứng khoán vốn được định giá quá cao. (chống lại sự tiếp xúc hạn chế hoặc không có\nlâu dài). Các nhà quản lý thường có tính pháp lý cao hơn trong phân tích cơ bản của họ và đôi khi là\nnhà hoạt động cố gắng vạch trần những sai sót trong kinh doanh hoặc kế toán chưa được nhận ra trước đây và cải thiện\ncơ hội kiếm lợi nhuận cho danh mục đầu tư của họ.\nB. Không chính xác vì các chiến lược theo hướng sự kiện tìm cách thu lợi nhuận từ các sự kiện xúc tác đã xác định, thường\nliên quan đến những thay đổi trong cơ cấu công ty, chẳng hạn như mua lại hoặc tái cơ cấu. Các phân mục tiếp theo\ncủa danh mục này theo HFR bao gồm những phần sau. Những tình huống đặc biệt. Các chiến lược này\ntập trung vào cơ hội mua cổ phần của các công ty tham gia vào các hoạt động tái cơ cấu ngoài\nsáp nhập, mua lại hoặc phá sản. Các hoạt động này bao gồm phát hành hoặc mua lại chứng khoán,\nphân phối vốn đặc biệt, tài trợ giải cứu và bán/spin-off tài sản.\nC. Đúng vì các quỹ có giá trị tương đối tìm cách kiếm lợi từ sự chênh lệch về giá giữa\ncác chứng khoán liên quan đến dựa trên mối quan hệ ngắn hạn bất thường. Kỳ vọng là\nsự khác biệt sẽ được giải quyết theo thời gian. Ví dụ về các chiến lược giá trị tương đối bao gồm\nsau: Kinh doanh chênh lệch giá trái phiếu chuyển đổi. Chiến lược đầu tư trung lập về mặt thị trường về mặt khái niệm này\ntìm cách khai thác sự định giá sai được cho là giữa trái phiếu chuyển đổi và các bộ phận cấu thành của nó-\ncụ thể là trái phiếu cơ bản và quyền chọn mua cổ phiếu gắn liền-liên quan đến việc định giá một\nvốn chủ sở hữu tham chiếu mà trái phiếu có thể chuyển đổi vào một ngày nào đó. Chiến lược này thường bao gồm\nmua chứng khoán nợ chuyển đổi và đồng thời bán một lượng nhất định\ncổ phiếu phổ thông của cùng một nhà phát hành. Vì loại chiến lược này tìm cách thu lợi từ sự chênh lệch về giá (một\nmối quan hệ ngắn hạn bất thường) giữa các chứng khoán liên quan, nên tốt nhất nên mô tả nó là chiến lược giá trị\ntương đối.\nĐầu tư thay thế: giải thích các đặc điểm đầu tư của các quỹ phòng hộ và đối chiếu chúng với\ncác loại tài sản khác","qhtml":null},{"n":43,"q":"Which of the following statements about real estate assets is most accurate?","opts":["Real estate assets are heterogeneous","Commercial property represents the majority of real estate assets by value","Private real estate has historically had high correlations with other asset classes"],"ans":"A","expl":"A. Đúng vì bất động sản có một số đặc điểm độc đáo, bao gồm tính không đồng nhất (không có\nhai thuộc tính giống hệt nhau) và vị trí cố định.\nB. Không chính xác vì bất động sản bao gồm hai lĩnh vực chính: nhà ở và thương mại.\nBất động sản nhà ở [không phải thương mại] là lĩnh vực lớn nhất, chiếm tổng cộng 75% thị trường toàn cầu.\nC. Không chính xác vì những lý do chính để đầu tư vào bất động sản bao gồm\nlợi ích tiềm năng sau:... Mối tương quan thấp [không cao] trong lịch sử với các loại tài sản khác.\nĐầu tư thay thế: giải thích các tính năng và đặc điểm của bất động sản","qhtml":null},{"n":44,"q":"Which of the following hedge funds most likely have a beta close to zero?","opts":["Short-biased funds","Market-neutral funds","Fundamental long/short growth funds"],"ans":"B","expl":"A. Không chính xác vì hệ số beta của các loại quỹ này thường âm nhất do thiên hướng bán.\nCác chiến lược này sử dụng phân tích cơ bản và định lượng (kỹ thuật) để tập trung phần lớn danh mục\nvào việc bán khống chứng khoán vốn được định giá quá cao (đối với các khoản đầu tư hạn chế hoặc không có rủi ro dài hạn).\nB. Đúng vì quỹ phòng hộ nắm giữ các vị thế mua đối với những chứng khoán được xác định là bị định giá thấp\nvà các vị thế bán đối với những chứng khoán được định giá quá cao. Quỹ phòng hộ cố gắng duy trì vị thế ròng\ntrung tính đối với rủi ro thị trường và các yếu tố rủi ro khác (quy mô, ngành, động lượng,\ngiá trị, v.v.). Lý tưởng nhất là danh mục đầu tư có hệ số beta tổng thể xấp xỉ bằng 0.\nC. Không chính xác vì bởi vì, mặc dù các quỹ này phòng hộ các vị thế mua bằng các vị thế bán, tính trung lập của thị trường\nkhông nhất thiết phải là mục tiêu. Quỹ phòng hộ nắm giữ các vị thế mua trong các công ty này\ntrong khi bán khống các công ty có mô hình kinh doanh đang bị gián đoạn hoặc đang chịu áp lực đi xuống\n-nơi được coi là khó có thể tiếp tục tăng trưởng doanh thu. Danh mục đầu tư có xu hướng kết thúc lâu dài\nsai lệch.\nĐầu tư thay thế: giải thích các đặc điểm đầu tư của các quỹ phòng hộ và đối chiếu chúng với\ncác loại tài sản khác","qhtml":null},{"n":45,"q":"A hedge fund has the following characteristics:\n• Assets under management, beginning of year: $100 million\n• Assets under management, end of year: $120 million\n• Management fee: 1% of year-end assets under management\n• Performance fee: 15% of the annual return above a 3% hurdle rate\nIf the performance fee is calculated net of the management fee and there were no capital\ncontributions or withdrawals, the net annual return to the investor is closest to:","opts":["16.3%.","16.4%.","16.5%."],"ans":"B","expl":"A. Không chính xác vì phí hiệu suất không được tính sau phí quản lý:\nPhí quản lý = 100 triệu USD × 120% × 1% = 1,200 triệu USD. Phí hiệu suất = [(100 triệu USD\n× 20%) - (100 triệu USD × 3%)] × 15% = 2,550 triệu USD. Tổng phí = 1,200 triệu USD + 2,550 triệu USD\n= 3,750 triệu USD. Lợi nhuận của nhà đầu tư = ($20-$3,750)/$100 = 16,250% 16,3%.\nB. Đúng vì tỷ lệ vượt rào là tỷ lệ lợi nhuận tối thiểu, thường là 8%, mà GP phải\nvượt quá để kiếm được phí thực hiện. GP thường nhận được 20% tổng lợi nhuận của\nquỹ cổ phần tư nhân không bao gồm bất kỳ tỷ lệ rào cản cứng nào, trong trường hợp đó GP kiếm được phí trên lợi nhuận\nhàng năm vượt quá tỷ lệ rào cản hoặc không tính tỷ lệ rào cản mềm, trong trường hợp đó phí được\ntính trên toàn bộ lợi nhuận gộp hàng năm miễn là vượt quá rào cản đã đặt\nPhí quản lý = 100 triệu USD × 120% × 1% = 1,200 triệu USD. Phí hiệu suất = [(100 triệu USD\n× 20%) - (100 triệu USD × 3%) - 1,200 triệu USD)] × 15% = 2,370 triệu USD. Tổng phí = 1,200 triệu USD\n+ 2,370 triệu USD = 3,570 triệu USD. Lợi nhuận của nhà đầu tư = ($20-$3,570)/$100 = 16,430% 16,4%.\nC. Không chính xác vì tỷ lệ vượt rào được khấu trừ khỏi tỷ lệ phí thực hiện thay vì tỷ lệ lợi nhuận\n: Phí quản lý = 100 triệu USD × 120% × 1% = 1,200 triệu USD. Phí hiệu suất =\n[($100 triệu × 20%) - 1,200 triệu USD)] x (15%-3%) = 2,256 triệu USD. Tổng phí = 1,200 triệu USD +\n2,256 triệu USD = 3,456 triệu USD. Lợi nhuận của nhà đầu tư = ($20-$3,456) / $100 = 16,544% ~~ 16,5%.\nĐầu tư thay thế: tính toán và giải thích lợi nhuận đầu tư thay thế cả trước và\nsau phí","qhtml":null},{"n":46,"q":"A hedge fund has the following characteristics:\n• Assets under management, beginning of year: $1.5 billion\n• Annual return: 20%\n• Management fee: 2%, based on year-end valuation\n• Incentive fee: 20%, calculated net of management fees\nIf the incentive fee is calculated on returns in excess of a 6% hurdle rate, total annual fees earned by the fund manager are closest to:","opts":["$34,800,000.","$70,800,000.","$78,000,000."],"ans":"B","expl":"AUM cuối năm = 1,5 tỷ USD × (1 + 20%) = 1,8 tỷ USD.\nPhí quản lý = 2% × 1,8 tỷ USD (định giá cuối năm) = 36,0 triệu USD.\nRào cản = 6% × 1,5 tỷ USD = 90,0 triệu USD.\nA. Không chính xác vì chỉ tính phí ưu đãi và bỏ qua phí quản lý. Phí khuyến khích = 20% × [(1,5 tỷ USD × 20%) − 90 triệu USD − 36 triệu USD] = 20% × 174 triệu USD = 34,8 triệu USD.\nB. Đúng vì phí khuyến khích được tính sau khi trừ phí quản lý và khi lợi nhuận vượt quá rào cản 6%: Phí khuyến khích = 20% × [300 triệu USD - 90 triệu USD - 36 triệu USD] = 20% × 174 triệu USD = 34,8 triệu USD. Tổng phí = phí quản lý 36,0 triệu USD + phí khuyến khích 34,8 triệu USD = 70,8 triệu USD.\nC. Không chính xác vì phí khuyến khích không được trừ vào phí quản lý: Phí khuyến khích = 20% × (300 triệu USD - 90 triệu USD) = 42,0 triệu USD; Tổng phí = 36,0 triệu USD + 42,0 triệu USD = 78,0 triệu USD.\nĐầu tư thay thế: tính toán và giải thích lợi nhuận đầu tư thay thế cả trước và sau phí","qhtml":null},{"n":47,"q":"What is the most likely effect of a redemption fee on the returns of the remaining\ninvestors in a hedge fund? A redemption fee:","opts":["reduces investor returns.","has no effect on investor returns.","enhances investor returns."],"ans":"C","expl":"A. Không chính xác vì phí tăng [không làm giảm] giá trị của quỹ phòng hộ theo số tiền phí\n. Phí hoàn lại có thể được tính, thường được trả cho chính quỹ đó (chứ không phải cho người quản lý\n). Điều này nhằm bảo vệ các nhà đầu tư còn lại trong quỹ, đặc biệt trong trường hợp\nviệc mua lại diễn ra trong thời gian khóa.\nB. Không chính xác vì phí làm tăng giá trị của quỹ phòng hộ bằng số tiền phí. A\nphí mua lại có thể được tính, thường phải trả cho chính quỹ (chứ không phải cho người quản lý).\nĐiều này nhằm bảo vệ các nhà đầu tư còn lại trong quỹ, đặc biệt trong trường hợp\nviệc mua lại diễn ra trong thời gian khóa.\nC. Đúng vì phí làm tăng giá trị của quỹ phòng hộ bằng số tiền phí. A\nphí mua lại có thể được tính, thường phải trả cho chính quỹ (chứ không phải cho người quản lý).\nĐiều này nhằm bảo vệ các nhà đầu tư còn lại trong quỹ, đặc biệt là trong trường hợp\nviệc mua lại diễn ra trong thời gian khóa. Đặc điểm này được gọi là khóa mềm và\nnó cung cấp một con đường (mặc dù đắt tiền) để rút sớm.\nĐầu tư thay thế: giải thích các đặc điểm đầu tư của các quỹ phòng hộ và đối chiếu chúng với\ncác loại tài sản khác","qhtml":null},{"n":48,"q":"If a commodity's storage cost is equal to its convenience yield, its futures prices will be\ngreater than its spot price if the risk-free rate is:","opts":["negative.","zero.","positive."],"ans":"C","expl":"A. Không chính xác vì giá tương lai có thể được chính thức hóa dưới dạng sau: Giá tương lai\nGiá giao ngay(1+r) + Chi phí lưu trữ - Lợi suất tiện lợi, trong đó lãi suất\nkhông rủi ro ngắn hạn trong kỳ. Do đó, nếu Chi phí lưu trữ = Lợi suất tiện lợi thì Giá tương lai Giá giao ngay (1+r). Nếu r\n< 0 thì giá Hợp đồng tương lai < Giá giao ngay, không phải giá Hợp đồng tương lai > Giá giao ngay.\nB. Không chính xác vì giá tương lai có thể được chính thức hóa dưới dạng sau: Giá tương lai\nGiá giao ngay(1 + r) + Chi phí lưu trữ - Lợi suất tiện lợi, trong đó r là lãi suất\nkhông rủi ro ngắn hạn trong kỳ. Do đó, nếu Chi phí lưu trữ = Lợi suất tiện lợi thì Giá tương lai Giá giao ngay(1+r). Nếu r =\n0 thì giá Hợp đồng tương lai Giá giao ngay, không phải Giá tương lai > Giá giao ngay.\nC. Đúng vì giá tương lai có thể được chính thức hóa dưới dạng sau: Giá tương lai\nprice(1 + r) + Chi phí lưu trữ - Lợi suất tiện lợi, lãi suất\nkhông rủi ro ngắn hạn trong kỳ. Do đó, nếu Chi phí lưu trữ = Lợi suất tiện lợi thì Giá tương lai Giá giao ngay(1+r), từ\nGiá tương lai > Giá giao ngay nếu r > 0.\nĐầu tư thay thế: mô tả các đặc điểm của hàng hóa và đặc điểm đầu tư của chúng","qhtml":null},{"n":49,"q":"An analyst gathers the following information about a hedge fund:\nBeginning-of-year assets under management (AUM) €200 million Management fee, based on\nend-of-year AUM before fees 1.5% Incentive fee 20% Hard hurdle rate 5% Annual return\nbefore fees 15%.\nIf the incentive fee is based on returns net of management fees, total fees for the year are\nclosest to","opts":["€6.8 million.","€7.5 million.","€8.8 million."],"ans":"A","expl":"A. Đúng vì thỏa thuận hợp tác thường quy định rằng phí thực hiện\nchỉ thu được sau khi quỹ đạt được lợi nhuận được gọi là tỷ lệ vượt ngưỡng. Tỷ lệ vượt rào là\ntỷ suất lợi nhuận tối thiểu, thường là 8%, mà GP phải vượt quá để nhận được phí\nhiệu suất. GP thường nhận được 20% tổng lợi nhuận của quỹ đầu tư tư nhân sau khi trừ đi bất kỳ tỷ lệ vượt rào cứng nào\n, trong trường hợp đó GP kiếm được phí trên lợi nhuận hàng năm vượt quá tỷ lệ vượt rào cản hoặc\nkhông tính tỷ lệ rào cản mềm, trong trường hợp đó phí được tính trên toàn bộ lợi nhuận gộp hàng năm\nmiễn là vượt quá rào cản đã đặt ra.\nB. Không chính xác vì nó tính tổng phí khuyến khích của phí quản lý. Tức là: AUM vào cuối năm-\n = 200 triệu euro x 115% = 230 triệu euro. Phí quản lý = 230 triệu euro x 1,5% = 3,45 euro\ntriệu. Phí khuyến khích = (€230 triệu €200 triệu - €10 triệu) x 20% = €20 triệu x 20% =\n€4,00 triệu, trong đó rào cản khó = €200 triệu x 5% = €10 triệu. Do đó, tổng phí = €3,45\ntriệu + €4,00 triệu = €7,45 triệu €7,5 triệu.\nC. Không chính xác vì nó loại trừ tỷ lệ vượt rào cứng trong việc tính phí khuyến khích. Nghĩa là:\nAUM vào cuối năm = 200 triệu euro x 115% = 230 triệu euro. Phí quản lý = 230 triệu euro x 1,5% =\n3,45 triệu euro. Phí khuyến khích = (230 triệu euro - 200 triệu euro - 3,45 triệu euro) x 20% = 26,55 triệu euro\nx 20% = 5,31 triệu euro. Do đó, tổng phí = 3,45 triệu euro + 5,31 triệu euro = 8,76 triệu euro 8,8\ntriệu.\nĐầu tư thay thế: tính toán và giải thích lợi nhuận đầu tư thay thế cả trước và\nsau phí","qhtml":null},{"n":50,"q":"In the private debt market, venture debt:","opts":["entails buying the debt of mature companies in financial difficulty.","provides capital to early-stage companies that may be generating little cash flow.","entails buying the debt of mature companies in financial difficulty and provides capital to early-stage companies that may be generating little cash flow."],"ans":"B","expl":"A. Không chính xác vì điều này đề cập đến khoản nợ khó khăn. Việc tham gia vào khoản nợ khó đòi thường\nđòi hỏi phải mua khoản nợ của\nB. Đúng vì đây là định nghĩa về các công ty mạo hiểm trưởng thành đang gặp khó khăn về tài chính.\nnợ. Nợ mạo hiểm là nguồn vốn nợ tư nhân cung cấp vốn mạo hiểm cho các công ty mới thành lập hoặc giai đoạn đầu\ncó thể tạo ra dòng tiền ít hoặc âm. hỗ trợ vốn vì phần đầu tiên\ncủa câu trả lời không chính xác, như được chỉ ra trong câu trả lời đúng, tài trợ nợ mạo hiểm cho\ncác công ty mới thành lập hoặc giai đoạn đầu chưa phải là công ty trưởng thành.\nC. Không chính xác vì phần đầu tiên của câu trả lời không đúng, như đã nêu trong câu trả lời\nđúng, nợ mạo hiểm cung cấp vốn cho các công ty mới thành lập hoặc các công ty đang ở giai đoạn đầu chưa trưởng thành\n.\nĐầu tư thay thế: giải thích các đặc điểm của nợ tư nhân và đặc điểm đầu tư của nó","qhtml":null},{"n":51,"q":"Timberland investments offer:","opts":["an income stream only.","the potential for capital gain only.","both an income stream and the potential for capital gain."],"ans":"C","expl":"A. Không chính xác vì đầu tư vào đất rừng bao gồm quyền sở hữu đất thô và khai thác\ncây để lấy gỗ, do đó tạo ra dòng thu nhập và khả năng thu được vốn.\nB. Không chính xác vì đầu tư vào đất rừng bao gồm quyền sở hữu đất thô và khai thác\ncây để lấy gỗ, do đó tạo ra dòng thu nhập và khả năng thu được vốn.\nC. Đúng vì đầu tư vào đất rừng bao gồm quyền sở hữu đất thô và khai thác\ncây để lấy gỗ, do đó tạo ra dòng thu nhập và tiềm năng tăng vốn.\nĐầu tư thay thế: giải thích các đặc điểm của đất thô, đất rừng và đất nông nghiệp cũng như\nđặc điểm đầu tư","qhtml":null},{"n":52,"q":"Which of the following real estate investing strategies is most likely to focus on modest\nredevelopment or upgrades, the leasing of vacant space, and the repositioning of underlying\nproperties to earn a higher return?","opts":["Core-plus","Value-add","Opportunistic"],"ans":"B","expl":"A. Không chính xác vì chiến lược cộng thêm cốt lõi cũng sẽ chấp nhận rủi ro cao hơn một chút bắt nguồn từ các thị trường và lĩnh vực hoặc tài sản không phải cốt lõi có rủi ro cho thuê cao hơn một chút. Tài sản không cốt lõi\nbao gồm các lĩnh vực lớn có mức độ rủi ro khác nhau, chẳng hạn như khách sạn và viện dưỡng lão. Tài sản trong\nthị trường cấp hai và cấp ba cũng như các phân khúc như nhà ở sinh viên, kho tự lưu trữ và trung tâm dữ liệu\ncũng được coi là không cốt lõi.\nB. Đúng vì các khoản đầu tư giá trị gia tăng có thể yêu cầu tái phát triển hoặc nâng cấp một cách khiêm tốn,\ncho thuê không gian trống hoặc tái định vị các tài sản cơ bản để kiếm được lợi nhuận cao hơn\ncác tài sản cốt lõi.\nC. Không chính xác vì đầu tư theo cơ hội chấp nhận rủi ro phát triển cao hơn nhiều,\ntái phát triển lớn, tái sử dụng tài sản, đảm nhận các vị trí tuyển dụng lớn và suy đoán về\nsự cải thiện đáng kể trong điều kiện thị trường.\nĐầu tư thay thế: giải thích các tính năng và đặc điểm của bất động sản","qhtml":null},{"n":53,"q":"All else being equal, when a commodity futures market is in contango, the forward curve\nis most likely:","opts":["downward sloping.","flat.","upward sloping."],"ans":"C","expl":"A. Không chính xác vì khi thị trường tương lai giao dịch theo hướng bù giá, giá tương lai\nthấp hơn giá giao ngay, [và] đường cong kỳ hạn hàng hóa dốc xuống. Thị trường trong\ncontango giả định giá tương lai cao hơn giá giao ngay.\nB. Không chính xác vì khi giá tương lai cao hơn giá giao ngay, đường cong kỳ hạn hàng hóa\ndốc lên và giá được coi là ở trạng thái contango. Đường cong kỳ hạn phẳng\nkhông thể liên kết với thị trường trong contango vì đường cong phẳng ngụ ý rằng tất cả giá\ntrong tương lai đều bằng giá giao ngay trong khi thị trường trong contango giả định giá tương lai cao hơn\nso với giá giao ngay.\nC. Đúng vì khi giá tương lai cao hơn giá giao ngay, đường cong kỳ hạn hàng hóa\ndốc lên và giá được coi là ở trạng thái bù hoãn mua. Thay thế\nĐầu tư mô tả đặc điểm của hàng hóa và đặc điểm đầu tư của chúng\nĐầu tư thay thế: mô tả đặc điểm của hàng hóa và đặc điểm đầu tư của chúng","qhtml":null},{"n":54,"q":"With respect to infrastructure investments, a take-or-pay arrangement is most likely used\nto mitigate:","opts":["demand risk.","operational risk.","construction risk."],"ans":"A","expl":"A. Đúng vì các thỏa thuận nhận hoặc thanh toán, trong đó thanh toán dựa trên tình trạng sẵn có\nchứ không phải việc sử dụng tài sản, được sử dụng để giảm thiểu rủi ro về nhu cầu/khối lượng.\nB. Không chính xác vì các thỏa thuận nhận hoặc thanh toán, trong đó các khoản thanh toán dựa trên tình trạng sẵn có\nchứ không phải việc sử dụng tài sản, được sử dụng để giảm thiểu rủi ro về nhu cầu/khối lượng chứ không phải rủi ro hoạt động.\nC. Không chính xác vì các thỏa thuận nhận hoặc thanh toán, trong đó các khoản thanh toán dựa trên tình trạng sẵn có\nchứ không phải tài sản sử dụng, được sử dụng để giảm thiểu rủi ro về nhu cầu/khối lượng chứ không phải rủi ro trong xây dựng. của an\nĐầu tư thay thế: giải thích đặc điểm đầu tư của đầu tư cơ sở hạ tầng","qhtml":null},{"n":55,"q":"Which of the following is most appropriately categorized as a traditional investment?","opts":["Gold","Cash","Real estate"],"ans":"B","expl":"A. Không chính xác vì các khoản đầu tư thay thế bao gồm các tài sản như bất động sản và hàng hóa\n(bao gồm cả vàng), được cho là hai trong số những loại hình đầu tư lâu đời nhất.\nB. Đúng vì các khoản đầu tư thay thế' là nhãn cho một nhóm đầu tư khác nhau\nđược phân biệt với các khoản đầu tư được giao dịch công khai, lâu dài vào cổ phiếu, trái phiếu và tiền mặt (thường\nđược gọi là đầu tư truyền thống)\nC. Không chính xác vì các khoản đầu tư thay thế bao gồm các tài sản như bất động sản và\nhàng hóa, được cho là hai trong số những loại hình đầu tư lâu đời nhất.\nĐầu tư thay thế: mô tả các đặc điểm và danh mục đầu tư thay thế","qhtml":null},{"n":56,"q":"Which of the following is most likely a characteristic of private real estate markets?","opts":["Transaction costs are high","Private market indexes are investable","It is easy for small investors to establish a diversified portfolio of wholly owned properties"],"ans":"A","expl":"A. Đúng vì đối với thị trường bất động sản tư nhân, chi phí giao dịch cao.\nB. Không chính xác vì các chỉ số thị trường tư nhân không thể đầu tư được và tài sản thường yêu cầu\nquản lý vận hành chuyên nghiệp.\nC. Không chính xác vì các nhà đầu tư nhỏ có thể gặp khó khăn trong việc thiết lập danh mục đầu tư đa dạng gồm\ntài sản thuộc sở hữu hoàn toàn.\nĐầu tư thay thế: giải thích các đặc điểm và đặc điểm của bất động sản","qhtml":null},{"n":57,"q":"Alternative investments:","opts":["include tangible assets only.","include intangible assets only.","may include both tangible and intangible assets."],"ans":"C","expl":"A. Không chính xác vì Đầu tư thay thế thành ba danh mục và một số danh mục phụ như\nsau: 1. Vốn tư nhân 2. Tài sản thực 3. Quỹ phòng hộ. Các khoản đầu tư 'tài sản thực tế' khác có thể\nbao gồm tài sản hữu hình, chẳng hạn như rượu vang hảo hạng, tác phẩm nghệ thuật, đồ cổ và ô tô, tem, tiền xu,\nvà các đồ sưu tầm khác, cũng như tài sản vô hình, chẳng hạn như bằng sáng chế và các vụ kiện tụng .\nB. Không chính xác vì Đầu tư thay thế thành ba danh mục và một số danh mục phụ như\nsau: 1. Vốn tư nhân 2. Tài sản thực 3. Các quỹ phòng hộ. Các khoản đầu tư \"tài sản thực\" khác có thể\nbao gồm tài sản hữu hình, chẳng hạn như rượu vang hảo hạng, tác phẩm nghệ thuật, đồ nội thất cổ và ô tô, tem, tiền xu,\nvà các đồ sưu tầm khác, cũng như tài sản vô hình, chẳng hạn như bằng sáng chế và các vụ kiện tụng.\nC. Đúng vì các khoản đầu tư thay thế thành ba danh mục và một số danh mục phụ như\nsau: 1. Vốn tư nhân 2. Tài sản thực 3. Các quỹ phòng hộ. Các khoản đầu tư \"tài sản thực\" khác có thể\nbao gồm tài sản hữu hình, chẳng hạn như rượu vang hảo hạng, tác phẩm nghệ thuật, đồ nội thất cổ và ô tô, tem, tiền xu,\nvà các đồ sưu tầm khác, cũng như tài sản vô hình, chẳng hạn như bằng sáng chế và các vụ kiện tụng.\nĐầu tư thay thế: mô tả các đặc điểm và danh mục đầu tư thay thế","qhtml":null},{"n":58,"q":"In alternative investments, a clawback provision represents the right of.","opts":["limited partners to reclaim performance losses.","the general partner to reclaim part of limited partners' distributions.","limited partners to reclaim part of the general partner's performance fee."],"ans":"C","expl":"A. Không chính xác vì điều khoản hoàn trả đề cập đến việc đòi lại phí hiệu suất chứ không phải\nbản thân tổn thất về hiệu suất Nếu một đối tác chung (GP) tích lũy phí khuyến khích đối với lợi nhuận không\nchưa được thực hiện đầy đủ và sau đó trả lại những lợi ích đó, đối tác hữu hạn (LP) có thể lấy lại\ncác khoản thanh toán phí khuyến khích trước đó. Điều khoản thu hồi lại phản ánh quyền của LP được đòi lại một phần\nphí hoạt động của GP.\nB. Không chính xác vì điều khoản thu hồi lại trao quyền cho các đối tác hữu hạn (LP), chứ không phải\nđối tác chung (GP). Điều khoản thu hồi lại phản ánh quyền của LP được đòi lại một phần phí hiệu suất của GP.\nC. Đúng vì nếu một đối tác chung (GP) tích lũy một khoản phí khuyến khích đối với các khoản lợi nhuận chưa được nhận đầy đủ\nvà sau đó trả lại những khoản lãi đó, một đối tác hữu hạn (LP) có thể thu hồi\ncác khoản thanh toán phí khuyến khích trước đó.\nPhí hiệu suất của GP.\nĐầu tư thay thế: mô tả quyền sở hữu đầu tư và cơ cấu bồi thường\nthường được sử dụng trong các khoản đầu tư thay thế","qhtml":null},{"n":59,"q":"Which of the following is the most conservative","opts":["Using bid prices for long approach to valuing a hedge fund's underlying positions? positions and ask prices for short positions","Using bid prices for short positions and ask prices for long positions","Using the average of the bid and ask prices for both long and short positions"],"ans":"A","expl":"A. Đúng vì khi giá thị trường hoặc báo giá được sử dụng để định giá, các quỹ có thể khác nhau về\ngiá hoặc báo giá mà họ sử dụng (giá dự thầu, giá chào bán, báo giá trung bình hoặc báo giá trung vị). Một\ncách tiếp cận thận trọng và chính xác hơn là sử dụng giá chào mua cho các vị thế mua và giá chào bán cho\ncác vị thế bán vì đây là những mức giá thực tế hơn mà tại đó các vị thế có thể bị đóng.\nTuy nhiên, một số nhà quản lý sử dụng một cách tiếp cận đơn giản hóa, theo đó họ lấy mức trung bình của giá thầu\nvà giá chào bán, cách tiếp cận này không chính xác và có thể gây hiểu nhầm.\nB. Không chính xác vì khi giá thị trường hoặc báo giá được sử dụng để định giá, các quỹ có thể khác nhau về\ngiá hoặc báo giá mà họ sử dụng (giá dự thầu, giá chào bán, báo giá trung bình hoặc báo giá trung bình). Một\ncách tiếp cận thận trọng và chính xác hơn là sử dụng giá chào mua cho các vị thế mua và giá chào bán cho\ncác vị thế bán vì đây là những mức giá thực tế hơn mà tại đó các vị thế có thể bị đóng.\nTuy nhiên, một số nhà quản lý sử dụng cách tiếp cận đơn giản hóa, theo đó họ lấy mức trung bình của giá thầu\nvà giá bán; cách tiếp cận này không chính xác và có thể gây hiểu nhầm.\nC. Không chính xác vì khi giá thị trường hoặc báo giá được sử dụng để định giá, các quỹ có thể khác nhau về\ngiá hoặc báo giá mà họ sử dụng (giá dự thầu, giá chào bán, báo giá trung bình hoặc báo giá trung bình). Một\ncách tiếp cận thận trọng và chính xác hơn là sử dụng giá chào mua cho các vị thế mua và giá chào bán cho\ncác vị thế bán vì đây là những mức giá thực tế hơn mà tại đó các vị thế có thể bị đóng.\nTuy nhiên, một số nhà quản lý sử dụng cách tiếp cận đơn giản hóa, theo đó họ lấy mức trung bình của giá thầu\nvà giá bán; Cách tiếp cận này không chính xác và có thể gây hiểu nhầm.\nĐầu tư thay thế: giải thích các đặc điểm của nợ tư nhân và đặc điểm đầu tư của nó","qhtml":null},{"n":60,"q":"All else being equal, which of the following types of private debt is most likely to have the\nlowest level of risk?","opts":["Mezzanine debt","Unitranche debt","Infrastructure debt"],"ans":"C","expl":"A. Không chính xác vì các khoản đầu tư nợ tư nhân có rủi ro và lợi nhuận khác nhau, trong đó nợ tư nhân cấp cao\nmang lại lợi suất ổn định hơn và rủi ro vừa phải còn nợ tư nhân cấp hai mang lại tiềm năng tăng trưởng cao hơn\n, tăng giá cổ phiếu và rủi ro cao hơn.\nB. Không chính xác vì nợ đơn vị là sự kết hợp giữa nợ có bảo đảm và không có bảo đảm. Khoản vay đơn vị\nthường sẽ được cấu trúc giữa nợ cấp cao và nợ thứ cấp trong xếp hạng ưu tiên. Vì\nnợ cấp hai đề cập đến tín dụng tư nhân phụ thuộc vào nợ có bảo đảm cao cấp nhưng cao hơn vốn chủ sở hữu\ntrong cơ cấu vốn của người đi vay, nợ cấp hai có nhiều rủi ro hơn nợ đơn vị.\nC. Đúng vì vì, là một dạng nợ cấp dưới, nợ tư nhân cấp hai mang lại tiềm năng tăng trưởng\ncao hơn, tăng giá cổ phiếu và rủi ro cao hơn, với lợi nhuận tương đối cao nhất.\nNợ cơ sở hạ tầng cấp cao và có rủi ro thấp nhất so với nợ đơn vị và\nnợ cấp hai.\nĐầu tư thay thế: giải thích các đặc điểm của nợ tư nhân và đặc điểm đầu tư của nó","qhtml":null},{"n":61,"q":"An analyst gathers the following information about a hedge fund:\n• Beginning-of-year assets under management (AUM) $50 million\n• Annual return before fees 20%\n• Management fee (based on end-of-year AUM before fees) 2%\n• Incentive fee (based on return net of management fees) 20%\nAn investor's net return is:","opts":["13.60%.","14.08%.","14.40%."],"ans":"B","expl":"A. Không chính xác vì không điều chỉnh được phí ưu đãi cho phí quản lý: 60 triệu USD x 2%\n= 1,2 triệu USD phí quản lý. ($60-$50) triệu x 20% = $2,0 triệu phí khuyến khích. Tổng phí =\n3,2 triệu USD. Lợi nhuận của nhà đầu tư = ($60-$50-$3,2)/50 triệu USD = 13,60%.\nB. Đúng vì vì: 60 triệu USD x 2% = 1,2 triệu USD phí quản lý. ($60-$50-$1,2) triệu x\n20% = 1,76 triệu USD phí khuyến khích. Tổng phí = 2,96 triệu USD. Lợi nhuận của nhà đầu tư = ($60-$50-\n$2,96)/50 triệu USD = 14,08%.\nC. Không chính xác vì nó tính phí quản lý dựa trên AUM đầu năm\ntrái ngược với AUM cuối năm: 50 triệu USD x 2% = 1,0 triệu USD phí quản lý. ($60-$50-$1)\ntriệu x 20% = 1,8 triệu USD phí khuyến khích. Tổng phí = 2,8 triệu USD. Lợi nhuận của nhà đầu tư = ($60-$50-\n$2,8)/$50 triệu = 14,40%.\nĐầu tư thay thế: tính toán và giải thích lợi nhuận đầu tư thay thế cả trước và\nsau phí","qhtml":null}];

    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');

    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);

    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnav-note-end-->

<button id="qnotesFab" type="button" onclick="qnotesOpen()" title="Ghi chú của tôi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 10h6M8 14h8M8 18h5"/></svg><span>Ghi chú</span></button>
<div id="qnotesOverlay" onclick="qnotesClose()"></div>
<div id="qnotesPanel" aria-hidden="true">
  <div class="qnp-head" id="qnotesHead"><span class="qnp-grip" aria-hidden="true">⠿</span><b>Ghi chú của tôi</b><a class="qnp-open" href="index.html?view=notes" target="_blank" rel="noopener">Mở trang ↗</a><button type="button" class="qnp-x" onclick="qnotesClose()" title="Đóng (Esc)">✕</button></div>
  <iframe id="qnotesFrame" title="Ghi chú của tôi" loading="lazy"></iframe>
</div>
<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--qnotes-panel-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
