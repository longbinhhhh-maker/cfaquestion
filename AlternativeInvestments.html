der to earn the performance\nfee. GPs typically receive 20% of the total profit of the private equity fund net of any hard\nhurdle rate, in which case the GP earns fees on annual returns in excess of the hurdle rate, or\nnet of the soft hurdle rate, in which case the fee is calculated on the entire annual gross return\nas long as the set hurdle is exceeded.\nB. Incorrect because it calculates incentive fees gross of management fees. That is: AUM at year-\nend = €200 million x 115% = €230 million. Management fee = €230 million x 1.5% = €3.45\nmillion. Incentive fee = (€230 million €200 million - €10 million) x 20% = €20 million x 20% =\n€4.00 million, where hard hurdle = €200 million x 5% = €10 million. Thus, total fees = €3.45\nmillion + €4.00 million = €7.45 million €7.5 million.\nC. Incorrect because it excludes the hard hurdle rate in the calculation of incentive fees. That is:\nAUM at year-end = €200 million x 115% = €230 million. Management fee = €230 million x 1.5% =\n€3.45 million. Incentive fee = (€230 million - €200 million - €3.45 million) x 20% = €26.55 million\nx 20% = €5.31 million. Thus, total fees = €3.45 million + €5.31 million = €8.76 million €8.8\nmillion.\nAlternative Investments: calculate and interpret alternative investment returns both before and\nafter fees", "qhtml": null}, {"n": 50, "q": "In the private debt market, venture debt:", "opts": ["entails buying the debt of mature companies in financial difficulty.", "provides capital to early-stage companies that may be generating little cash flow.", "entails buying the debt of mature companies in financial difficulty and provides capital to early-stage companies that may be generating little cash flow."], "ans": "B", "expl": "A. Incorrect because this refers to distressed debt. Involvement in distressed debt typically\nentails buying the debt of\nB. Correct because this is the definition of venture mature companies in financial difficulty.\ndebt. Venture debt is private debt funding that provides venture to start-up or early-stage\ncompanies that may be generating little or negative cash flow. capital backing because the first\npart of the answer is not correct, as indicated in the correct response, venture debt funding to\nstart-up or early-stage companies not mature companies.\nC. Incorrect because the first part of the answer is not correct, as indicated in the correct\nresponse, venture debt provides funding to start-up or early-stage companies not mature\ncompanies.\nAlternative Investments: explain features of private debt and its investment characteristics", "qhtml": null}, {"n": 51, "q": "Timberland investments offer:", "opts": ["an income stream only.", "the potential for capital gain only.", "both an income stream and the potential for capital gain."], "ans": "C", "expl": "A. Incorrect because timberland investment involves ownership of raw land and the harvesting\nof its trees for lumber, thus generating an income stream and the potential for capital gain.\nB. Incorrect because timberland investment involves ownership of raw land and the harvesting\nof its trees for lumber, thus generating an income stream and the potential for capital gain.\nC. Correct because timberland investment involves ownership of raw land and the harvesting of\nits trees for lumber, thus generating an income stream and the potential for capital gain.\nAlternative Investments: explain features of raw land, timberland, and farmland and their\ninvestment characteristics", "qhtml": null}, {"n": 52, "q": "Which of the following real estate investing strategies is most likely to focus on modest\nredevelopment or upgrades, the leasing of vacant space, and the repositioning of underlying\nproperties to earn a higher return?", "opts": ["Core-plus", "Value-add", "Opportunistic"], "ans": "B", "expl": "A. Incorrect because core-plus strategies will also accept slightly higher risks derived from non-\ncore markets and sectors or properties with slightly more leasing risk. Non-core properties\ninclude large sectors with different risk profiles, such as hotels and nursing homes. Assets in\nsecondary and tertiary markets and such niches as student housing, self-storage, and data\ncenters are also considered non-core.\nB. Correct because value-add investments may require modest redevelopment or upgrades, the\nleasing of vacant space, or repositioning the underlying properties to earn a higher return than\ncore properties.\nC. Incorrect because opportunistic investing accepts the much higher risks of development,\nmajor redevelopment, repurposing of assets, taking on large vacancies, and speculating on\nsignificant improvement in market conditions.\nAlternative Investments: explain features and characteristics of real estate", "qhtml": null}, {"n": 53, "q": "All else being equal, when a commodity futures market is in contango, the forward curve\nis most likely:", "opts": ["downward sloping.", "flat.", "upward sloping."], "ans": "C", "expl": "A. Incorrect because when the futures market is trading in backwardation, the futures prices are\nlower than the spot price, [and] the commodity forward curve is downward sloping. A market in\ncontango assumes futures prices are higher than the spot price.\nB. Incorrect because when futures prices are higher than the spot price, the commodity forward\ncurve is upward sloping, and the prices are referred to as being in contango. A flat forward\ncurve can't be associated with a market in contango because a flat curve implies that all future\nprices are equal to the spot price while a market in contango assumes futures prices are higher\nthan the spot price.\nC. Correct because when futures prices are higher than the spot price, the commodity forward\ncurve is upward sloping, and the prices are referred to as being in contango. Alternative\nInvestments describe features of commodities and their investment characteristics\nAlternative Investments: describe features of commodities and their investment characteristics", "qhtml": null}, {"n": 54, "q": "With respect to infrastructure investments, a take-or-pay arrangement is most likely used\nto mitigate:", "opts": ["demand risk.", "operational risk.", "construction risk."], "ans": "A", "expl": "A. Correct because take-or-pay arrangements, where payments are based upon the availability\nrather than the use of an asset, are used to mitigate demand/volume risk.\nB. Incorrect because take-or-pay arrangements, where payments are based upon the availability\nrather than the use of an asset, are used to mitigate demand/volume risk, not operational risk.\nC. Incorrect because take-or-pay arrangements, where payments are based upon the availability\nrather than the use asset, are used to mitigate demand/volume risk, not construction risk. of an\nAlternative Investments: explain the investment characteristics of infrastructure investments", "qhtml": null}, {"n": 55, "q": "Which of the following is most appropriately categorized as a traditional investment?", "opts": ["Gold", "Cash", "Real estate"], "ans": "B", "expl": "A. Incorrect because alternative investments include such assets as real estate and commodities\n(including gold), which are arguably two of the oldest types of investments.\nB. Correct because alternative investments' is a label for a disparate group of investments that\nare distinguished from long-only, publicly traded investments in stocks, bonds, and cash (often\nreferred to as traditional investments)\nC. Incorrect because alternative investments include such assets as real estate and\ncommodities, which are arguably two of the oldest types of investments.\nAlternative Investments: describe features and categories of alternative investments", "qhtml": null}, {"n": 56, "q": "Which of the following is most likely a characteristic of private real estate markets?", "opts": ["Transaction costs are high", "Private market indexes are investable", "It is easy for small investors to establish a diversified portfolio of wholly owned properties"], "ans": "A", "expl": "A. Correct because, for private real estate markets, transaction costs are high.\nB. Incorrect because private market indexes are not investable, and property typically requires\nprofessional operational management.\nC. Incorrect because it may be difficult for small investors to establish a diversified portfolio of\nwholly owned properties.\nAlternative Investments: explain features and characteristics of real estate", "qhtml": null}, {"n": 57, "q": "Alternative investments:", "opts": ["include tangible assets only.", "include intangible assets only.", "may include both tangible and intangible assets."], "ans": "C", "expl": "A. Incorrect because alternative Investments into three categories and several subcategories as\nfollows: 1. Private Capital 2. Real Assets 3. Hedge Funds. Other 'real asset\" investments may\ninclude tangible assets, such as fine wine, art, antique furniture and automobiles, stamps, coins,\nand other collectibles, and intangible assets, such as patents and litigation actions .\nB. Incorrect because alternative Investments into three categories and several subcategories as\nfollows: 1. Private Capital 2. Real Assets 3. Hedge Funds. Other \"real asset\" investments may\ninclude tangible assets, such as fine wine, art, antique furniture and automobiles, stamps, coins,\nand other collectibles, and intangible assets, such as patents and litigation actions.\nC. Correct because alternative Investments into three categories and several subcategories as\nfollows: 1. Private Capital 2. Real Assets 3. Hedge Funds. Other \"real asset\" investments may\ninclude tangible assets, such as fine wine, art, antique furniture and automobiles, stamps, coins,\nand other collectibles, and intangible assets, such as patents and litigation actions.\nAlternative Investments: describe features and categories of alternative investments", "qhtml": null}, {"n": 58, "q": "In alternative investments, a clawback provision represents the right of.", "opts": ["limited partners to reclaim performance losses.", "the general partner to reclaim part of limited partners' distributions.", "limited partners to reclaim part of the general partner's performance fee."], "ans": "C", "expl": "A. Incorrect because a clawback provision refers to reclaiming performance fees, not\nperformance losses themselves. If a general partner (GP) accrues an incentive fee on gains not\nyet fully realized and then subsequently gives back those gains, limited partner (LPs) may claw\nback prior incentive fee payments. A clawback provision reflects the right of LPs to reclaim part\nof the GP's performance fee.\nB. Incorrect because a clawback provision confers rights on the limited partners (LPs), not the\ngeneral partner (GP). A clawback provision reflects the right of LPs to reclaim part of the GP's\nperformance fee.\nC. Correct because if a general partner (GP) accrues an incentive fee on gains not yet fully\nrealized and then subsequently gives back those gains, a limited partner (LP) may claw back\nprior incentive fee payments. A clawback provision reflects the right of LPs to reclaim part of the\nGP's performance fee.\nAlternative Investments: describe investment ownership and compensation structures\ncommonly used in alternative investments", "qhtml": null}, {"n": 59, "q": "Which of the following is the most conservative", "opts": ["Using bid prices for long approach to valuing a hedge fund's underlying positions? positions and ask prices for short positions", "Using bid prices for short positions and ask prices for long positions", "Using the average of the bid and ask prices for both long and short positions"], "ans": "A", "expl": "A. Correct because, when market prices or quotes are used for valuation, funds may differ in\nwhich price or quote they use (bid price, ask price, average quote, or median quote). A more\nconservative and accurate approach is to use bid prices for long positions and ask prices for\nshort positions because these are more realistic prices at which the positions could be closed.\nHowever, some managers use a simplifying approach whereby they take the average of the bid\nand the ask, this approach is not as accurate and could be misleading.\nB. Incorrect because, when market prices or quotes are used for valuation, funds may differ in\nwhich price or quote they use (bid price, ask price, average quote, or median quote). A more\nconservative and accurate approach is to use bid prices for long positions and ask prices for\nshort positions because these are more realistic prices at which the positions could be closed.\nHowever, some managers use a simplifying approach whereby they take the average of the bid\nand the ask; this approach is not as accurate and could be misleading.\nC. Incorrect because, when market prices or quotes are used for valuation, funds may differ in\nwhich price or quote they use (bid price, ask price, average quote, or median quote). A more\nconservative and accurate approach is to use bid prices for long positions and ask prices for\nshort positions because these are more realistic prices at which the positions could be closed.\nHowever, some managers use a simplifying approach whereby they take the average of the bid\nand the ask; this approach is not as accurate and could be misleading.\nAlternative Investments: explain features of private debt and its investment characteristics", "qhtml": null}, {"n": 60, "q": "All else being equal, which of the following types of private debt is most likely to have the\nlowest level of risk?", "opts": ["Mezzanine debt", "Unitranche debt", "Infrastructure debt"], "ans": "C", "expl": "A. Incorrect because, private debt investments vary in risk and return, with senior private debt\nproviding a steadier yield and moderate risk and mezzanine private debt carrying higher growth\npotential, equity upside, and higher risk.\nB. Incorrect because, unitranche debt is a blend of secured and unsecured debt. The unitranche\nloan will usually be structured between senior and subordinated debt in priority ranking. As\nmezzanine debt refers to private credit subordinated to senior secured debt but senior to equity\nin the borrower's capital structure, mezzanine debt has more risk than unitranched debt.\nC. Correct because, as a junior form of subordinated debt, mezzanine private debt offers higher\ngrowth potential, equity upside, and higher risk, with the comparatively highest returns.\nInfrastructure debt is senior and poses the lowest risk, as compared to unitranche debt and\nmezzanine debt.\nAlternative Investments: explain features of private debt and its investment characteristics", "qhtml": null}, {"n": 61, "q": "An analyst gathers the following information about a hedge fund:\n• Beginning-of-year assets under management (AUM) $50 million\n• Annual return before fees 20%\n• Management fee (based on end-of-year AUM before fees) 2%\n• Incentive fee (based on return net of management fees) 20%\nAn investor's net return is:", "opts": ["13.60%.", "14.08%.", "14.40%."], "ans": "B", "expl": "A. Incorrect because it fails to adjust the incentive fee for the management fee: $60 million x 2%\n= $1.2 million management fee. ($60-$50) million x 20% = $2.0 million incentive fee. Total fees =\n$3.2 million. Investor return = ($60-$50-$3.2)/$50 million = 13.60%.\nB. Correct because: $60 million x 2% = $1.2 million management fee. ($60-$50-$1.2) million x\n20% = $1.76 million incentive fee. Total fees = $2.96 million. Investor return = ($60-$50-\n$2.96)/$50 million = 14.08%.\nC. Incorrect because it calculates the management fee based on beginning-of-year AUM as\nopposed to end-of-year AUM: $50 million x 2% = $1.0 million management fee. ($60-$50-$1)\nmillion x 20% = $1.8 million incentive fee. Total fees = $2.8 million. Investor return = ($60-$50-\n$2.8)/$50 million = 14.40%.\nAlternative Investments: calculate and interpret alternative investment returns both before and\nafter fees", "qhtml": null}];
const CFG = {"title": "Alternative Investments", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 120, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;

  function afterGrade(){

      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');

    ov.classList.add('show');

  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->
