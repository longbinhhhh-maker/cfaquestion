characterized by\nhigh return, high volatility, and low correlations with traditional asset classes. The fact that the\ncorrelation of cryptocurrencies with traditional assets is on the rise does not imply that the\ncorrelation of bitcoin and other cryptocurrencies has reached a high level yet, nor would a high\nlevel necessarily be a desirable feature.\nAlternative Investments: analyze sources of risk, return, and diversification among digital asset\ninvestments", "qhtml": null}, {"n": 5, "q": "Cryptocurrencies can be issued by:", "opts": ["individuals only.", "Corporations and organisations only.", "individuals, corporations and organisations."], "ans": "C", "expl": "A. Incorrect because cryptocurrencies are not only issued by individuals but also by\ncorporations and organizations. While there were around 70 cryptocurrencies recorded in 2013,\nby early 2022, there were close to 10,000 different cryptocurrencies issued by corporations,\norganizations, and in many cases, individuals.\nB. Incorrect because cryptocurrencies are not only issued by corporations and organizations but\nalso by individuals. While there were around 70 cryptocurrencies recorded in 2013, by early\n2022, there were close to 10,000 different cryptocurrencies issued by corporations,\norganizations, and in many cases, individuals.\nC. Correct because while there were around 70 cryptocurrencies recorded in 2013, by early\n2022, there were close to 10,000 different cryptocurrencies issued by corporations,\norganizations, and in many cases, individuals.\nAlternative Investments: explain investment features of digital assets and contrast them with\nother asset classes", "qhtml": null}, {"n": 6, "q": "Compared to traditional financial assets, digital assets:", "opts": ["can be invested in through indirect investment vehicles such as ETFs.", "are generally recorded in private ledgers maintained by central intermediaries.", "do not have an inherent value based on underlying assets or on potential cash flows."], "ans": "C", "expl": "A. Incorrect because the main similarity [not difference] between these asset types is the\nemergence of indirect investment vehicles such as exchange-traded funds [ETFS] and hedge\nfunds that invest both in traditional financial assets and in digital assets.\nB. Incorrect because one key dífference between digital assets and traditional financial\ninstruments is that traditional [not digital] assets are generally recorded in private ledgers\nmaintained by central intermediaries.\nC. Correct because, unlike financial assets, most digital assets do not have an inherent value\nbased on underlying assets or on the potential cash flow.\nAlternative Investments: explain investment features of digital assets and contrast them with\nother asset classes", "qhtml": null}, {"n": 7, "q": "A measure that restricts new investors in a hedge fund from redeeming their capital for a\nset amount of time in order to implement the fund's investment strategy is known as a:", "opts": ["gate.", "notice period.", "lockup period."], "ans": "C", "expl": "A. Incorrect because in addition, funds sometimes impose a gate, which limits or restricts\nredemptions for a period of time. A gate is imposed by the hedge fund manager independent of\nany lockup period that may apply. A gate therefore applies to all investors for a finite period of\ntime while a lockup period applies to new investors only.\nB. Incorrect because notice periods provide an opportunity for the hedge fund manager to\nliquidate a position in an orderly fashion without magnifying the losses. A notice period applies\nto all investors wanting to withdraw some or all of their capital from a hedge fund with the goal\nof providing the manager with advance warning of the withdrawal.\nC. Correct because lockup periods-time periods when investors cannot withdraw their capital-\nprovide the hedge fund manager the required time to implement and potentially realize a\nstrategy's expected results. LOckup periods apply to new investors in a hedge fund with the goal\nof allowing the hedge fund manager time to implement the fund's investment strategy.\nAlternative Investments: describe the performance appraisal of alternative investments", "qhtml": null}, {"n": 8, "q": "Venture capital is best classified as a sub-category of.", "opts": ["real estate.", "hedge funds.", "private equity."], "ans": "C", "expl": "A. Incorrect because real estate investments are made in buildings or land, either directly or\nindirectly. Although some venture capital investments may have a real estate component,\nventure capital is broadly considered a type of private equity investing, and is best classified as\nsuch.\nB. Incorrect because hedge funds are private investment vehicles that manage portfolios of\nsecurities and/or derivative positions using a variety of strategies. Although venture capital\ninvestments may be included in some hedge funds, venture capital is broadly considered a type\nof private equity investing, and is best classified as such.\nC. Correct because venture capital funds, a specialized form of private equity that typically\ninvolves investing in or providing financing to startup or early-stage companies with high growth\npotential, represent a small portion of the private equity market.\nAlternative Investments: describe features and categories of alternative investments", "qhtml": null}, {"n": 9, "q": "A leveraged loan is best defined as a loan:", "opts": ["that is itself levered.", "to mature companies in financial difficulty.", "that comes with warrants or conversion rights."], "ans": "A", "expl": "A. Correct because a leveraged loan is a loan that is itself levered. Private debt firms that invest\nin leveraged loans first borrOW money to finance the debt and then extend it to another\nborrower. By using leverage, a private debt firm can enhance the return on its loan portfolio.\nB. Incorrect because involvement in distressed debt typically entails buying the debt of mature\ncompanies in financial difficulty. These companies may be in bankruptcy, have defaulted on\ndebt, or seem likely to default on debt Some investors identify companies with a temporary\ncash-flow problem but a good business plan to help the company survive and ultimately\nflourish. These investors buy the company's debt, expecting both the company and its debt to\nincrease in value. Turnaround investors buy debt aiming to be more active in distressed\ncompany management and direction, seeking to restructure and revive them.\nC. Incorrect because mezzanine debt often comes with additional features, SUch as warrants or\nconversion rights. These provide equity participation to lenders/investors, conveying the option\nto convert their debt into equity or purchasing the equity of the underlying borrOwer under\ncertain circumstances.\nAlternative Investments: explain features of private debt and its investment characteristics", "qhtml": null}, {"n": 10, "q": "From the perspective of a private equity firm, an advantage of exiting a portfolio company\nthrough a special purpose acquisition company (SPAC) most likely include:", "opts": ["floating valuation.", "flexibility of the transaction structure.", "lower deal risk due to restrictions on redemptions."], "ans": "B", "expl": "A. Incorrect because advantages of a SPAC exit include fixed valuation with lower volatility of\nshare pricing.\nB. Correct because advantages of a SPAC exit include:\na. extended time for public disclosure on company prospects to build investor interest.\nb. fixed valuation with lower volatility of share pricing.\nc. flexibility of transaction structure to best suit the company's context, and\nd. association with potentially high-profile and seasoned sponsors and their extensive investor\nnetwork.\nC. Incorrect because redemptions are allowed and increase the deal risk. Also, disadvantages\ninclude\na. potential higher costs of capital from sponsor dilution, warrants, and other fees,\nb. spread between the announced and true equity value because of the dilution,\nc. deal and capital risk due to potential redemptions, and\nd. significant stockholder overhang and churn over the number of months after the merger.\nAlternative Investments: explain features of private equity and its investment characteristics", "qhtml": null}, {"n": 11, "q": "With respect to private equity, the growth capital strategy is also known as:", "opts": ["venture capital.", "recapitalization.", "minority equity investing."], "ans": "C", "expl": "A. Incorrect because venture capital is a different private equity strategy from growth capital.\nVenture capital (VC) entails investing in or providing financing to private companies with high\ngrowth potential. Typically these are start-ups or young companies, but venture capital can be\nprovided at a variety of stages, ranging from the inception of an idea for a company to the point\nwhen the company is about to launch an IPO (initial public offering) or be acquired. Growth\ncapital generally refers to minority equity investments, whereby the firm takes a less-than-\ncontrolling interest in more mature companies that are looking for capital to expand or\nrestructure operations, enter new markets, or finance major acquisitions.\nB. Incorrect because it is an exit strategy. Recapitalization in the context of private equity\ndescribes the steps a firm takes to increase or introduce leverage to its portfolio company and\npay itself a dividend out of the new capital structure.\nC. Correct because among several other specialties, some private equity firms specialize in\ngrowth capital, also known as growth equity or minority equity investing. Growth capital\ngenerally refers to minority equity investments, whereby the firm takes a less-than-controlling\ninterest in more mature companies that are looking for capital to expand or restructure\noperations, enter new markets, or finance major acquisitions.\nAlternative Investments: explain features of private equity and its investment characteristics", "qhtml": null}, {"n": 12, "q": "Which of the following hedge fund investments require the highest level of scrutiny and\ndue diligence?", "opts": ["Level 1 assets", "Level 2 assets", "Level 3 assets"], "ans": "C", "expl": "A. Incorrect because Level 1 assets have an exchange-traded, publicly traded price available that\nis mandated to be used for valuation purposes. The following is a methodology that involves the\ncategorization of investments into three buckets Level 1, 2, and 3 asset pricing... u Level 1 assets\nhave an exchange-traded, publicly traded price available that is mandated to be used for\nvaluation purposes.\nB. Incorrect because Level 2 asset values use outside quotes from brokers when publicly traded\n(Level 1) prices are not available The following is a methodology that involves the categorization\nof investments into three buckets: Level 1, 2, and 3 asset pricing. Level 2 asset values use\noutside quotes from brokers when publicly traded (Level 1) prices are not available.\nC. Correct because any investment vehicle that is heavily involved with Level 3-priced assets\ndeserves increased scrutiny and due diligence. The following is a methodology that involves the\ncategorization of investments into three buckets: Level 1, 2, and 3 asset pricing... Level 3 asset\nvalues are computed using only internal models when outsider broker (Level 2) quotes are not\navailable or not reliable.\nAlternative Investments: describe the performance appraisal of alternative investments", "qhtml": null}, {"n": 13, "q": "Hedge funds are most likely to place restrictions on:", "opts": ["redemptions.", "the use of leverage.", "the use of derivatives."], "ans": "A", "expl": "A. Correct because alternative investments often have many of the following characteristics.\nRestrictions on redemptions (.e., 'lockups' and 'gates'). As such, restrictions on redemptions are\ntypically imposed [by hedge funds]. Investors may be required to keep their money in the hedge\nfund for a minimum period (referred to as a lockup period) before they are allowed to make\nwithdrawals or redeem shares. Investors may be required to give notice of their intent to\nredeem, the notice period is typically 30-90 days. To redeem shares, investors may be charged a\nfee, typically payable to the fund itself (rather than the manager) so as not to disadvantage\nremaining investors in the fund, particularly in circumstances where the redemption takes place\nduring the lockup period.\nB. Incorrect because hedge funds are private investment vehicles that manage portfolios of\nsecurities and/or derivative positions using a variety of strategies. Although hedge funds may be\ninvested entirely in traditional assets, these vehicles are considered alternative because of their\nprivate nature. Hedge funds typically have more leeway to pursue investments and strategies\noffering the potential for higher returns, whether absolute or compared with a specific market\nbenchmark, but these strategies may increase the risk of investment loss. They may involve long\nand short positions and may be highly leveraged Some aim to deliver investment performance\nthat is independent of broader market performance.\nC. Incorrect because hedge funds are private investment vehicles that manage portfolios of\nsecurities and/or derivative positions using a variety of strategies. They may involve long and\nshort positions and may be highly leveraged. Some aim to deliver investment performance that\nis independent of broader market performance. A contemporary hedge fund generally has the\nfollowing characteristics: It is a creatively managed portfolio of investments involved in one or\nmore asset classes (equities, credit, fixed income, commodities, futures, foreign exchange, and\nsometimes even hard assets, such as real estate), sometimes trading in different geographic\nregions, that is often leveraged, generally takes both long and short positions (when possible),\nand quite often uses derivatives to express a view or establish a hedge.\nAlternative Investments: explain investment features of hedge funds and contrast them with\nother asset classes", "qhtml": null}, {"n": 14, "q": "Crude oil is categorized as:", "opts": ["a soft commodity.", "a hard commodity.", "neither a soft commodity nor a hard commodity."], "ans": "B", "expl": "A. Incorrect because oil is categorized as a hard, not a soft, commodity. Commodities are\nconsidered either 'hard' (those mined, such as copper, or extracted, such as oil) or 'soft (those\ngrown over a period of time, such as livestock, grains, and cash crops, such as coffee).\nB. Correct because commodities are considered either 'hard' (those mined, such as copper, or\nextracted, such as oil) or 'soft (those grown over a period of time, such as livestock, grains, and\ncash crops, such as coffee).\nC. Incorrect because oil is categorized as a hard, not a soft, commodity. Commodities are\nconsidered either 'hard (those mined, such as copper, or extracted, such as oil) or 'soft (those\ngrown over a period of time, such as livestock, grains, and cash crops, such as coffee).\nAlternative Investments: describe features of commodities and their investment characteristics", "qhtml": null}, {"n": 15, "q": "Compared with direct investing, co-investing in alternative investments most likely offers:", "opts": ["reduced control over the investment selection prOcess.", "the same level of control over the investment selection process.", "higher control over the investment selection process."], "ans": "A", "expl": "A. Correct because co-investing offers reduced control over the investment selection process\ncompared with direct investing.\nB. Incorrect because co-investing offers reduced control over the investment selection process\ncompared with direct investing.\nC. Incorrect because co-investing offers reduced control over the investment selection process\ncompared with direct investing.\nAlternative Investments: Compare direct investment, co-investment, and fund investment\nmethods for alternative investments", "qhtml": null}, {"n": 16, "q": "Which of the following methods of investing in alternative investments provides the most\nflexibility to the investor?", "opts": ["Co-investing", "Fund investing", "Direct investing"], "ans": "C", "expl": "A. Incorrect because direct investing provides the greatest amount of flexibility for the investor\nand grants the highest level of control over how the asset is managed.\nB. Incorrect because direct investing provides the greatest amount of flexibility for the investor\nand grants the highest level of control over how the asset is managed.\nC. Correct because direct investing allows the investor to build a portfolio of investments to her\nexact requirements. Direct investing provides the greatest amount of flexibility for the investor\nand grants the highest level of control over how the asset is managed.\nAlternative Investments: compare direct investment, co-investment, and fund investment\nmethods for alternative investments", "qhtml": null}, {"n": 17, "q": "Which of the following is best classified as a commodity?", "opts": ["Livestock", "Timberland", "Agricultural land"], "ans": "A", "expl": "A. Correct because commodity investments may involve investing in actual physical\ncommodities or in producers of commodities. Commodities are considered either 'hard' (those\nmined, such as copper, or extracted, such as oil) , such as livestock, grains, and cash crops, such\nas coffee). or 'soft' (those grown over a period of time\nB. Incorrect because timberland is a separate component of natural resources, not a\ncommodity. Natural resources include commodities (hard and soft), agricultural land (farmland),\nand timberland.\nC. Incorrect because resources include agricultural land is a separate component of natural\nresources, not a commodity. Natural commodities (hard and soft), agricultural land (farmland),\nand timberland.\nAlternative Investments: describe features of commodities and their investment characteristics", "qhtml": null}, {"n": 18, "q": "Investors in greenfield infrastructure projects typically:", "opts": ["rely on the assets' financial and operating history.", "invest alongside strategic investors or developers.", "have lower development risk than investors in brownfield projects."], "ans": "B", "expl": "A. Incorrect because it is for brownfield, not greenfield, typically invest alongside strategic\ninvestors or developers who specialize infrastructure assets that are to be constructed is\ngenerally referred to as higher development and construction risks compared to investors that,\ntypically, some of the assets' financial and greenfield investment. Thus, greenfield investors face\nbrownfield investors, and may expect capital appreciation to reflect the construction and\ncommissioning risk. operating history is available.\nB. Correct because greenfield investors in developing the underlying assets.\nC. Incorrect because investing in infrastructure assets that are to be constructed is generally\nreferred to as greenfield investment Thus, greenfield investors face higher development and\nconstruction risks compared to brownfield investors, and may expect capital appreciation to\nreflect the construction and commissioning risk\nAlternative Investments: explain features and characteristics of infrastructure", "qhtml": null}, {"n": 19, "q": "An analyst gathers the following information about a hedge fund:\nBeginning-of-year assets under management (AUM): $500 million\nAnnual return before fees: 22%\nManagement fee, based on end-of-year AUM before fees: 2%\nIncentive fee: 15%\nHard hurdle rate: 10%\nQ. The incentive fee (in $ millions) based on returns net of management fees is closest to:", "opts": ["7.2.", "13.0.", "14.7."], "ans": "A", "expl": "A. Correct because End-of-year AUM = $500 million x 22% = $610 million.\nManagement fee = $610 million x 2% = $12.2 million.\nThe hurdle rate is a minimum rate of return. typically 8%, that the GP must exceed in order to\nearn the performance fee. GPs typically receive 20% of the total profit of the private equity fund\nnet of any hard hurdle rate, in which case the GP earns fees on annual returns in excess of the\nhurdle rate, or net of the soft hurdle rate, in which case the fee is calculated on the entire\nannual gross return as long as the set hurdle is exceeded.\nHard hurdle = $500 million x 10% $50 million.\nIncentive fee (based on returns net of management fees) = ($610 million - $500 million - $50\nmillion - $12.2 million) x 15% = $47.8 million x 15% = $7.17 million $7.2 million\nB. Incorrect because it calculates the hurdle rate on the annual return before fees (instead of\nthe Beginning-of-year AUM).\nEnd-of-year AUM = $500 million x 22% = $610 million.\nManagement fee = $610 million x 2% = $12.2 million.\nHard hurdle = ($610 million - $500 million) x 10% = $110 million x 10% = $11.0 million.\nIncentive fee (calculated net of management fees) = ($610 million - $500 million - $11.0 million -\n$12.2 million) x\n15% $86.8 million x 15% = $13.02 million $13.0 million.\nC. Incorrect because it assumes a soft hurdle rate (instead of a hard hurdle rate) of 10%.\nEnd-of-year AUM = $500 million x 22% = $610 million.\nManagement fee = $610 million x 2% = $12.2 million.\nGross annual return> soft hurdle rate, hence the hurdle rate is not deducted from the\ncalculation of the incentive fee.\nIncentive fee (calculated net of management fees) = ($610 million - $500 million - $12.2 million)\nx 15% = $97.8 million * 15% = $14.67 million $14.7 million.\nAlternative Investments: calculate and interpret alternative investment returns both before and\nafter fees", "qhtml": null}, {"n": 20, "q": "A hedge fund strategy that seeks to influence a company's policies through the purchase\nof equity is best described as a(n):", "opts": ["activist strategy.", "market-neutral strategy.", "merger arbitrage strategy."], "ans": "A", "expl": "A. Correct because event-driven strategies seek to profit from defined catalyst events, typically\nthose that involve changes in corporate structure, such as an acquisition or restructuring.\nFurther subdivisions of this category by HFR include the following: Activist. The term \"activist\" is\nshort for \"activist shareholder.\" Here, managers secure sufficient equity holdings to allow them\nto influence a company's policies or direction. The hedge fund manager thus tries to create his\nor her own catalyst, influencing the investment's ultimate destiny by creating a desired\ncorporate outcome.\nB. Incorrect because equity hedge strategies are focused on public equity markets and take long\nand short positions in equity and equity derivative securities. Examples of equity hedge\nstrategies include the in equity and equity derivative securities. Examples of equity hedge\nstrategies include the following: Market neutral. These strategies use quantitative (technical)\nand fundamental analysis to identify under- and overvalued equity securities. The hedge fund\ntakes long positions in securities it has identified as undervalued and short positions in\nsecurities it has identified as overvalued. The hedge fund tries to maintain a net position that is\nneutral with respect to market risk and other risk factors (size, industry, momentum, value, etc.)\nideally, the portfolio has an overall beta of approximately zero.\nC. Incorrect because event-driven strategies seek to profit from defined catalyst events, typically\nthose that involve changes in corporate structure, such as an acquisition or restructuring\nFurther subdivisions of this category by HFR include the following. Merger arbitrage. Generally,\nthese strategies involve going long (buying) the stock of the company being acquired at a\ndiscount to its announced takeover price and going short (selling) the stock of the acquiring\ncompany when the merger or acquisition is announced. The manager may expect to profit once\nthe initial deal spread narrows to the closing value of the transaction after it is fully\nconsummated. The spread exists because there is always some uncertainty over whether the\ndeal will actually close in the face of legal and regulatory hurdles\nAlternative Investments: explain investment features of hedge funds and contrast them with\nother asset classes", "qhtml": null}, {"n": 21, "q": "Event-driven hedge fund strategies are most likely.", "opts": ["long biased.", "based on 'top-down' analysis.", "exploiting short-term pricing discrepancies between two related securities."], "ans": "A", "expl": "A. Correct because event-driven strategies tend to be long biased, with merger arbitrage having\nthe least bias.\nB. Incorrect because event-driven strategies seek to profit from defined catalyst events, typically\ninvolving changes in corporate structure, such as an acquisition or restructuring. They are\nconsidered to be based on bottom-up security-specific analysis, as opposed to top-down\nanalysis.\nC. Incorrect because event-driven strategies seek to profit from defined catalyst events, typically\ninvolving changes in corporate structure, such as an acquisition or restructuring. It is relative\nvalue funds that seek to profit from a pricing discrepancy between related securities based on\nan unusual short-term relationship.\nAlternative Investments: explain investment features of hedge funds and contrast them with\nother asset classes", "qhtml": null}, {"n": 22, "q": "Which of the following are best categorized as social infrastructure assets?", "opts": ["Airports", "Correctional facilities", "Telecommunication towers"], "ans": "B", "expl": "A. Incorrect because infrastructure investments are frequently categorized on the basis of the\nunderlying assets. The broadest categorization organizes investments into economic and social\ninfrastructure assets. Economic infrastructure assets support economic activity and include\nthree broad types of assets: transportation assets, information and communication technology\n(ICT) assets, and utility and energy assets. Transportation assets include roads, bridges, tunnels,\nairports, seaports, and heavy and light/urban railway systems.\nB. Correct because infrastructure investments are frequently categorized on the basis of the\nunderlying assets The broadest categorization organizes investments into economic and social\ninfrastructure assets.... Social Infrastructure assets are directed toward human activities and\ninclude such assets as educational, health care, social housing, and Correct ional facilities, with\nthe focus on providing, operating, and maintaining the asset infrastructure.\nC. Incorrect because infrastructure investments are frequently categorized on the basis of the\nunderlying assets. The broadest categorization organizes investments into economic and social\ninfrastructure assets. Economic infrastructure assets support economic activity and include\nthree broad types of assets: transportation assets, information and communication technology\n(ICT) assets, and utility and energy assets.... ICT assets include infrastructure that stores,\nbroadcasts, and transmits information or data, such as telecommunication towers and data\ncenters.\nAlternative Investments: explain features and characteristics of infrastructure", "qhtml": null}, {"n": 23, "q": "Which of the following statements is most accurate? Alternative investments:", "opts": ["tend to be more efficiently priced than traditional investments.", "fall outside of the definition of long-only positions in stocks, bonds, and cash.", "have relatively high correlation of returns with those of traditional investments."], "ans": "B", "expl": "A. Incorrect because alternative assets, by their very nature, tend to be less efficiently priced\nthan traditional marketable securities, providing an opportunity to exploit market inefficiencies\nthrough active management.\nB. Correct because investing in alternative assets can require handling illiquidity, transacting on\nprivate markets, operating sophisticated investment strategies, or risk-return profiles that are\nvery different from those of traditional long-only investments.\nC. Incorrect because alternative investments often have Relatively low correlation of returns\nwith those of traditional investments.\nAlternative Investments: describe features and categories of alternative investments", "qhtml": null}, {"n": 24, "q": "An analyst gathers the following information about a hedge fund:\n• $200 million in assets under management at the beginning of year\n• a 2% management fee based on year-end assets under management\n• a 20% incentive fee calculated net of the management fee\nQ. If the fund's gross return is 25% during the year, the total fees earned by the fund manager\nare:", "opts": ["$11 million.", "$14 million.", "$15 million."], "ans": "B", "expl": "A. Incorrect because it is the amount if the sum of the incentive and management fees based on\nthe dollar returns for the year ($250 million less $200 million). That is, the sum of the\nmanagement fee of $1 million ($50 million times 0.02) and the incentive fee of $10 million ($50\nmillion times 0.20), which is $11 million.\nB. Correct because it calculates the incentive fee net of the management fee. That is, the total\nfee is the sum of the management fee of $5 million ($250 million AUM times 0.02) and the\nincentive fee of $9 million ($250 million less $200 million less the $5 million incentive times\n0.20), which is $14 million.\nC. Incorrect because it is the amount if the incentive and management fees are calculated\nindependently (rather than if the incentive fee is calculated net of the management fee). That is,\nthe sum of the management fee of $5 million ($250 million AUM times 0.02) and the incentive\nfee of $10 million ($250 million less $200 million for at profit of $50 million times 0.20), which is\n$15 million.\nAlternative Investments: calculate and interpret alternative investment returns both before and\nafter fees", "qhtml": null}, {"n": 25, "q": "Management fees are most likely based on assets under management for:", "opts": ["hedge funds only.", "private equity funds only.", "both hedge funds and private equity funds."], "ans": "A", "expl": "A. Correct because funds are generally structured with a management fee typically ranging from\n1% to 2% of assets under management (e.g. for hedge funds) or committed capital (e.g. private\nequity funds), which is how much money in total that LP's have committed to the fund's future\ninvestments.\nB. Incorrect because funds are generally structured with a management fee typically ranging\nfrom 1% to 2% of assets under management (e.g. for hedge funds) or committed capital (e.g.\nprivate equity funds), which is how much money in total that LP's have committed to the fund's\nfuture investments.\nC. Incorrect because funds are generally structured with a management fee typically ranging\nfrom 1% to 2% of assets under management (e.g. for hedge funds) or committed capital (e.g.\nprivate equity funds), which is how much money in total that LP's have committed to the fund's\nfuture investments.\nAlternative Investments: describe investment ownership and compensation structures\ncommonly used in alternative investments", "qhtml": null}, {"n": 26, "q": "A leveraged private investment vehicle that employs both long and short positions is most\nlikely a:", "opts": ["hedge fund.", "private equity fund.", "venture capital fund."], "ans": "A", "expl": "A. Correct because hedge funds are private investment vehicles that manage portfolios of\nsecurities and/or derivative positions using a variety of strategies. Although hedge funds may be\ninvested entirely in traditional assets, these vehicles are considered alternative because of their\nprivate nature. Hedge funds typically have more leeway to pursue investments and strategies\noffering the potential for higher returns, whether absolute or compared with a specific market\nbenchmark, but these strategies may increase the risk of investment loss. They may involve long\nand short positions and may be highly leveraged. because private equity funds generally invest\nin companies, whether startups or established firms, that listed on a public exchange, or they\ninvest in public companies with the intent to take them private.\nB. Incorrect\nC. are not Incorrect because venture capital typically involves investing in or providing financing\nto startup or early-stage companies with high growth potential, represent a small portion of the\nprivate equity market.\nAlternative Investments: describe features and categories of alternative investments", "qhtml": null}, {"n": 27, "q": "A feature that protects hedge fund clients from paying twice for the same performance is\nmost likely a:", "opts": ["discount.", "hurdle rate.", "high-water mark"], "ans": "C", "expl": "A. Incorrect because hedge fund managers may discount their fees for larger investors or for\nplacement agents who introduced these investors. However, a rebate does not, in isolation,\nprotect clients from paying twice for the same performance.\nB. Incorrect because the partnership agreement usually specifies that the performance fee is\nearned only after the fund achieves a return known as a hurdle rate. The hurdle rate is a\nminimum rate of return, typically 8%, that the GP must exceed in order to earn the performance\nfee GPs typically receive 20% of the total profit of the private equity fund net of any hard hurdle\nrate, in which case the GP earns fees on annual returns in excess of the hurdle rate, or net of the\nsoft hurdle rate, in which case the fee is calculated on the entire annual gross return as long as\nthe set hurdle is exceeded.\nC. Correct because in hedge funds, fee calculations also take into account a high-water mark,\nwhich reflects the highest value used to calculate an incentive fee. A high-water mark is the\nhighest value of the fund investment ever achieved at a performance fee crystallization date,\nnet of fees, by the individual LP. A high-water mark clause states that a hedge fund manager\nmust recuperate declines in value from the high-water mark before performance fees can be\ncharged on newly generated profits. The use of high-water marks protects clients from paying\ntwice for the same performance.\nAlternative Investments: describe investment ownership and compensation structures\ncommonly used in alternative investments", "qhtml": null}, {"n": 28, "q": "A joint venture is an alternative investment structure that is most likely used for:", "opts": ["infrastructure investment.", "private equity investment.", "real estate direct investment"], "ans": "C", "expl": "A. Incorrect because for example, infrastructure investors frequently enter into public-private\npartnerships (PPP). which are agreements between the public sector and the private sector to\nfinance, build, and operate public Infrastructure, such as hospitals and toll roads.\nB. Incorrect because many alternative investments, such as hedge and private equity funds, use\na partnership structure with a general partner that manages the business and limited partners\n(investors) who own fractional Interests in the partnership. Correct because in real estate fund\ninvesting, investors may be classified as unitholders, and joint ventures are a partnership\nstructure common in real estate direct investing. Alternative Investments describe investment\nownership and compensation structures commonly used in alternative investments\nC. Correct because in real estate fund investing, investors may be classified as unitholders, and\njoint ventures are a partnership structure common in real estate\nAlternative Investments: describe investment ownership and direct investing. compensation\nstructures commonly used in alternative investments", "qhtml": null}, {"n": 29, "q": "Regarding distribution methods in alternative investments, which of the following is most\nadvantageous to the limited partners? A(n):", "opts": ["American waterfall.", "deal-by-deal waterfall.", "whole-of-fund waterfall."], "ans": "C", "expl": "A. Incorrect because there are two types of waterfalls: deal-by-deal (American) waterfalls and\nwhole-of-fund (European) waterfalls. Deal-by-deal waterfalls are more advantageous to the GP\nbecause performance fees are collected on a per-deat basis, allowing the GP to get paid before\nLPs receive both their initial investment and their preferred rate of return ( e, the hurdle rate)\non the entire fund\nB. Incorrect because there are two types of waterfalls deal-by-deal (American) waterfalls and\nwhere-of-fond (European) waterfalls. Deal-by-deal waterfalls are more advantageous to the GP\nbecause performance fees are collected on a per-deal basis, allowing the GP to get paid before\nLPs receive both their initial investment and their preferred rate ef return (ie, the hurdle rate)\non the entire fund\nC. Correct because in whole-of-fuhu (European) waterfalls, all distributions go to the LPs as\ndeals are exited and the GP does not participate in any profits until the LPs receive their initial\ninvestment and the hurdle rate has been met. In contrast to deal-by-deal (American) waterfalls,\nwhole-of-fund waterfalls occur at the aggregate fund level and are more advantageous to the\nLPS.\nAlternative Investments: describe investment ownership and compensation structures\ncommonly used in alternative investments", "qhtml": null}, {"n": 30, "q": "Which of the following hedge fund mechanisms is most likely used to impose a temporary\nrestriction on redemptions if needed?", "opts": ["Gate", "Notice period", "Lockup period"], "ans": "A", "expl": "A. Correct because in addition to lockup periods, funds sometimes impose a gate, which limits\nor restricts redemptions for a period of time.\nB. Incorrect because notice periods provide an opportunity for the hedge fund manager to\nliquidate a position in an orderly fashion without magnifying the losses.\nC. Incorrect because lockup periods-time periods when investors cannot withdraw their capital-\nprovide the hedge fund manager the required time to implement and potentially realize a\nstrategy's expected results. If the hedge fund receives a drawdown request shortly after a new\ninvestment, the lockup period forces the investors who made the request to stay in the fund for\na period of time rather than be allowed to immediately withdraw. Thus, a lockup period\nimposes restrictions on redemptions from the start of a new investment in the fund, and not\nlater on, e.g. some time after the new investment.\nAlternative Investments: describe the performance appraisal of alternative investments", "qhtml": null}, {"n": 31, "q": "Which of the following infrastructure investments most likely have the highest risk?", "opts": ["Brownfield investments with the majority of their return from current yield.", "Brownfield investments with the majority of their return from capital appreciation.", "Greenfield investments with the majority of their return from capital appreciation."], "ans": "C", "expl": "A. Incorrect because infrastructure funds with a lower-risk profile invest in Brownfield assets\nwith mitigated risks and with high weighting to current yield. Investing in existing infrastructure\nassets may be referred to as Incorrect because infrastructure funds with a medium-risk profile\ninvest in mostly brownfield assets (with some\nB. Incorrect because infrastructure funds with a medium-risk profile invest in mostly brownfield\nassets (with some capital expenditure requirements) and with a mix of yield and capital\nappreciation. Investing in existing infrastructure assets may be referred to as brownfield\ninvestment. Even if a brownfield investment had the majority of its return derived from capital\nappreciation, it would still be less risky than a greenfield investment. Brownfield investments\nare mid-stage or late-stage investments, still delivering prospects for return through capital gain\n& yield (albeit generally at relatively lower level than early stage investments).\nC. Correct because infrastructure funds with a higher-risk profile invest in Greenfield projects\nwithout guarantees of demand upon completion and with high weighting to capital\nappreciation. Investing in infrastructure assets that are to be constructed is generally referred to\nas greenfield investment. Greenfield investments are early-stage Investments with a higher-risk\nprofile.\nAlternative Investments: explain the investment characteristics of infrastructure investments", "qhtml": null}, {"n": 32, "q": "Which of the following methods of investing in alternative investments requires the least\namount of investment expertise?", "opts": ["Co-investing", "Fund investing", "Direct investing"], "ans": "B", "expl": "A. Incorrect because one of the advantages of fund investing is that it provides access to\nalternative investments without possessing a high degree of investment expertise. On the other\nhand, co-investing requires more active involvement compared with fund investing, which can\nbe challenging if resources and due diligence experience are limited. Co-investing requires more\nactive involvement from the investor, who must evaluate both investment opportunities and the\nfund manager, which demands more resources, concentration, and expertise.\nB. Correct because one of the advantages of fund investing is that it provides access to\nalternative investments without possessing a high degree of investment expertise.\nC. Incorrect because one of the advantages of fund investing is that it provides access to\nalternative investments without possessing a high degree of investment expertise, whereas\ndirect investing requires more investment expertise and a higher level of financial sophistication\ncompared with fund investing and co-investing.\nAlternative Investments: compare direct investment, co-investment, and fund investment\nmethods for alternative investments", "qhtml": null}, {"n": 33, "q": "The benefits of adding investments in infrastructure assets to a portfolio most likely\ninclude:", "opts": ["inflation protection only.", "low correlation with existing portfolio assets only.", "both inflation protection and low correlation with existing portfolio assets."], "ans": "C", "expl": "A. Incorrect because investing in infrastructure may add an income stream, increase portfolio\ndiversification by adding an asset class with typically low correlation with existing investments,\nand offer some protection against inflation. Low exposure to short-term GDP growth issues may\nalso be a factor.\nB. Incorrect because investing in infrastructure may add an income stream, increase portfolio\ndiversification by adding an asset class with typically low correlation with existing investments,\nand offer some protection against inflation. Low exposure to short-term GDP growth issues may\nalso be a factor.\nC. Correct because investing in infrastructure may add an income stream, increase portfolio\ndiversification by adding an asset class with typically low correlation with existing investments,\nand offer some protection against inflation. Low exposure to short-term GDP growth issues may\nalso be a factor.\nAlternative Investments: explain the investment characteristics of infrastructure investments", "qhtml": null}, {"n": 34, "q": "In co-investing, the investor invests in alternative assets indirectly through a fund but also\nhas the:", "opts": ["right to invest directly in the same assets alongside the fund.", "obligation to invest directly in the same assets alongside the fund.", "right to invest in the general partner's fund management company."], "ans": "A", "expl": "A. Correct because in co-investing, the investor invests in assets indirectly through the fund but\nalso possesses rights (known as co-investment rights) to invest directly in the same assets.\nThrough co-investing, an investor is able to make an investment alongside a fund when the fund\nidentifies deals; the investor is not limited to participating in the deal solely by investing in the\nfund.\nB. Incorrect because in co-investing, the investor invests in assets indirectly through the fund\nbut also possesses rights (known as co-investment rights) to invest directly in the same assets.\nHowever, there is no obligation to invest\nC. Incorrect because in co-investing, the investor invests in assets indirectly through the fund\nbut also possesses rights (known as co-investment rights) to invest directly in the same assets,\nnot in the general partner's fund management company.\nAlternative Investments: compare direct investment, co-investment, and fund investment\nmethods for alternative investments", "qhtml": null}, {"n": 35, "q": "A disadvantage of direct real estate investing is:", "opts": ["a lack of control.", "unfavorable tax rules.", "the time required to manage the property."], "ans": "C", "expl": "A. Incorrect because this is a benefit of direct investing. There are distinct benefits to owning\nreal estate directly. Control: Only the owner decides when to buy or sell, when and how much\nto spend on capital projects (subject to lease terms and regulatory requirements), whom to\nselect as tenants based on credit quality preference and tenant mix, and what types of lease\nterms to offer.\nB. Incorrect because this is a benefit of direct investing. Tax benefits: Property investors in many\ndeveloped markets can use non-cash property depreciation expenses and interest expense, with\nsome limitations, to reduce taxable income and lower their income tax bills.\nC. Correct because major disadvantages to investing directly [in real estate] include extensive\ntime required to manage the property. The owner may choose to handle all aspects of investing\nin and operating the property. including property selection, asset management, property\nmanagement, leasing, and administration.\nAlternative Investments: explain features and characteristics of real estate", "qhtml": null}, {"n": 36, "q": "Which of the following statements about private debt is most accurate? Mezzanine debt:\nstructure.", "opts": ["is subordinated to equity in a borrower's capital", "is less risky than senior secured debt issued by the same company.", "may include additional features such as warrants to provide equity participation to lenders."], "ans": "C", "expl": "A. Incorrect because in private debt, mezzanine debt refers to private credit that is subordinated\nto senior secured debt but is senior to equity in the borrower's capital structure.\nB. Incorrect because mezzanine debt is more risky, not less, than senior secured debt. Because\nof its typically Junior ranking and the fact that it is usually unsecured, mezzanine debt is riskier\nthan senior secured debt; to compensate investors for this heightened risk profile, investors\ncommonly demand higher interest rates and may require options for equity participation.\nC. Correct because mezzanine debt often comes with additional features, such as warrants or\nconversion rights, which provide equity participation to lenders/investors, meaning they have\nthe option of converting their debt into equity or purchasing the equity of the underlying\nborrower under certain circumstances.\nAlternative Investments: explain features of private debt and its investment characteristics", "qhtml": null}, {"n": 37, "q": "Which of the following statements about private equity performance evaluation is most\naccurate?", "opts": ["Private equity fund management fees are based on capital called.", "Cash flows are frequently described in terms of the J-curve effect.", "Managers have no discretion on the timing of the distribution of proceeds."], "ans": "B", "expl": "A. Incorrect because private equity includes a substantive initial capital commitment promise,\nfollowed by high initial fee drag (calculated on total committed capital, not the capital actually\ncalled), followed by the identification longer-term growth or turnaround opportunities, and an\neventual positive expected return when the staggered returns of the fund are realized. generally\ninvolve an initial capital commitment, but actual capital periods of time. Private of\nB. Correct because private equity investments flows often lag that commitment because capital\n'calls' are staggered over substantive equity returns are frequently described in terms of the J-\ncurve effect.\nC. Incorrect because in an independent, fixed-life private equity fund, the decisions to raise\nmoney, take money in the form of capital calls, and distribute proceeds are all at the discretion\nof the private equity manager. Timing of cash flows is an important part of the investment\ndecision process. The private equity manager should thus be rewarded or penalized for the\nresults of those timing decisions, and the calculation of an IRR is key for doing so.\nAlternative Investments: describe the performance appraisal of alternative investments", "qhtml": null}, {"n": 38, "q": "Which of the following is most likely a primary exit strategy for a company held by a\nprivate equity fund's portfolio?", "opts": ["IPO", "Management buy-in", "Management buyout"], "ans": "A", "expl": "A. Correct because key private equity investment strategies include leveraged buyouts (e.g.,\nMBOS and MBIS) and venture capital. Primary exit strategies include trade sale, IPO, and\nrecapitalization.\nB. Incorrect because key private equity investment strategies include leveraged buyouts (e.g.,\nMBOS and MBIS) and venture capital. Primary exit strategies include trade sale, IPO, and\nrecapitalization.\nC. Incorrect because key private equity investment strategies include leveraged buyouts (e.g.,\nMBOS and MBIS) and venture capital. Primary exit strategies include trade sale, IPO, and\nrecapitalization.\nAlternative Investments: explain features of private equity and its investment characteristics", "qhtml": null}, {"n": 39, "q": "A hedge fund that seeks to profit from a view on overall market direction as influenced by\neconomic trends best describes a:", "opts": ["macro hedge fund.", "multi-strategy hedge fund.", "market-neutral hedge fund."], "ans": "A", "expl": "A. Correct because macro hedge funds use long and short positions to profit from a view on the\noverall direction of the market as it is influenced by major economic trends and events.\nB. Incorrect because a multi-strategy hedge fund is an example of a relative value strategy,\nwhich seeks to profit from a pricing discrepancy, an unusual short-term relationship, between\nrelated securities. The expectation is that the pricing discrepancy will be resolved over time.\nStrategies of a multi-strategy hedge fund trade relative value within and across asset classes or\ninstruments. Rather than focusing on one type of trade (e.g.. convertible arbitrage), a single\nbasis for trade (e.g., volatility), or a particular asset class (e.g., fixed income), this strategy\ninstead looks for investment opportunities wherever they might exist, often with different pods\nof managers approaches.\nC. Incorrect because market-neutral hedge funds use quantitative (technical) and fundamental\nanalysis to identify under- and over-valued equity securities. The hedge fund takes long\npositions in securities it has identified as undervalued and short positions in securities it has\nidentified as overvalued. The hedge fund tries to maintain a net position that is neutral with\nrespect to market risk and other risk factors (size, industry, momentum, value, etc.). Ideally, the\nportfolio has an overall beta of approximately zero. The intent is to profit from the movements\nof individual securities while remaining largely indifferent to market risk.\nAlternative Investments: explain investment features of hedge funds and contrast them with\nother asset classes", "qhtml": null}, {"n": 40, "q": "Which of the following is best categorized as core real estate?", "opts": ["A high-quality office building in a rural area", "A low-quality office building in a major urban center", "A high-quality office building in a major urban center"], "ans": "C", "expl": "A. Incorrect because core real estate is characterized by well-leased, high-quality institutional\nreal estate in the best markets.\nB. Incorrect because core real estate is characterized by well-leased, high-quality institutional\nreal estate in the best markets.\nC. Correct because open-end funds generally offer exposure to core real estate, characterized by\nwell-leased, high- quality institutional real estate in the best markets. Investors expect core real\nestate to deliver stable returns, primarily from income.\nAlternative Investments: explain features and characteristics of real estate", "qhtml": null}, {"n": 41, "q": "Compared with fund investing in alternative investments, the co-investing method most\nlikely has:", "opts": ["lower management fees.", "the same level of management fees.", "higher management fees."], "ans": "A", "expl": "A. Correct because one of the advantages of co-investing is that it has reduced management\nfees. In co-investing. investors co-invest an additional amount into that same investment often\nwithout paying management fees on the capital they used for the direct investment (a co-\ninvestment, in this case).\nB. Incorrect because one of the advantages of co-investing is that it has reduced management\nfees compared with the fund investing method.\nC. Incorrect because one of the advantages of co-investing is that it has reduced management\nfees compared with the fund investing method.\nAlternative Investments: compare direct investment, co-investment, and fund investment\nmethods for alternative investments", "qhtml": null}, {"n": 42, "q": "Which of the following is best described as a relative value hedge fund strategy?", "opts": ["Short biased", "Special situations", "Convertible bond arbitrage"], "ans": "C", "expl": "A. Incorrect because equity hedge strategies can be considered the original hedge fund\ncategory. They focus on public equity markets and take long and short positions in equity and\nequity derivative securities. Examples of equity hedge strategies include the following Short\nbiased. These strategies use quantitative (technical) and fundamental analysis to focus the bulk\nof their portfolio on shorting overvalued equity securities. (against limited or no long-side\nexposures). Managers are often more forensic in their fundamental analysis and sometimes are\nactivist in trying to expose previously unrecognized accounting or business flaws and improve\ntheir portfolio's chance for profits.\nB. Incorrect because event-driven strategies seek to profit from defined catalyst events, typically\ninvolving changes in corporate structure, such as an acquisition or restructuring Further\nsubdivisions of this category by HFR include the following. Special situations. These strategies\nfocus on opportunities to buy equity of companies engaged in restructuring activities other than\nmergers, acquisitions or bankruptcy. These activities include security issuance or repurchase,\nspecial capital distributions, rescue finance, and asset sales/spin-offs.\nC. Correct because relative value funds seek to profit from a pricing discrepancy between\nrelated securities based on an unusual short-term relationship. The expectation is that the\ndiscrepancy will be resolved over time. Examples of relative value strategies include the\nfollowing: Convertible bond arbitrage. This conceptually market- neutral investment strategy\nseeks to exploit a perceived mispricing between a convertible bond and its component parts-\nnamely, the underlying bond and the embedded stock option-relative to the pricing of a\nreference equity into which the bond may someday convert. The strategy typically involves\nbuying convertible debt securities and simultaneously selling a certain amount of the same\nissuer's common stock. As this type of strategy seeks to profit from a pricing discrepancy (an\nunusual short-term relationship) between related securities, it is best described as a relative\nvalue strategy.\nAlternative Investments: explain investment features of hedge funds and contrast them with\nother asset classes", "qhtml": null}, {"n": 43, "q": "Which of the following statements about real estate assets is most accurate?", "opts": ["Real estate assets are heterogeneous", "Commercial property represents the majority of real estate assets by value", "Private real estate has historically had high correlations with other asset classes"], "ans": "A", "expl": "A. Correct because real estate property has some unique features, including heterogeneity (no\ntwo properties are identical) and fixed location.\nB. Incorrect because real estate includes two major sectors: residential and commercial.\nResidential [not commercial] real estate is the largest sector, totaling 75% of the global market.\nC. Incorrect because the key reasons for investing in real estate include the following potential\nbenefits:... Historically low [not high] correlations with other asset classes.\nAlternative Investments: explain features and characteristics of real estate", "qhtml": null}, {"n": 44, "q": "Which of the following hedge funds most likely have a beta close to zero?", "opts": ["Short-biased funds", "Market-neutral funds", "Fundamental long/short growth funds"], "ans": "B", "expl": "A. Incorrect because the beta in these types of funds is most often negative given the short bias.\nThese strategies use quantitative (technical) and fundamental analysis to focus the bulk of their\nportfolio on shorting overvalued equity securities (against limited or no long-side exposures).\nB. Correct because the hedge fund takes long positions in securities identified as undervalued\nand short positions in overvalued securities. The hedge fund tries to maintain a net position\nthat is neutral with respect to market risk and other risk factors (size, industry, momentum,\nvalue, etc.). Ideally, the portfolio has an overall beta of approximately zero.\nC. Incorrect because, although these funds do hedge long positions with short positions, market\nneutrality is not necessarily a goal. The hedge fund takes long positions in these companies\nwhile shorting companies with business models being disintermediated or under downward\npressure-where continued revenue growth is deemed unlikely. Portfolios tend to end up long\nbiased.\nAlternative Investments: explain investment features of hedge funds and contrast them with\nother asset classes", "qhtml": null}, {"n": 45, "q": "A hedge fund has the following characteristics:\n• Assets under management, beginning of year: $100 million\n• Assets under management, end of year: $120 million\n• Management fee: 1% of year-end assets under management\n• Performance fee: 15% of the annual return above a 3% hurdle rate\nIf the performance fee is calculated net of the management fee and there were no capital\ncontributions or withdrawals, the net annual return to the investor is closest to:", "opts": ["16.3%.", "16.4%.", "16.5%."], "ans": "B", "expl": "A. Incorrect because the performance fee is not calculated net of the management fee:\nManagement fee = $100 million × 120% × 1% = $1.200 million. Performance fee = [($100 million\n× 20%) - ($100 million × 3%)] × 15% = $2.550 million. Total fee = $1.200 million + $2.550 million\n= $3.750 million. Investor return = ($20-$3.750)/$100 = 16.250% 16.3%.\nB. Correct because the hurdle rate is a minimum rate of return, typically 8%, that the GP must\nexceed in order to earn the performance fee. GPs typically receive 20% of the total profit of the\nprivate equity fund net of any hard hurdle rate, in which case the GP earns fees on annual\nreturns in excess of the hurdle rate, or net of the soft hurdle rate, in which case the fee is\ncalculated on the entire annual gross return as long as the set hurdle is exceeded\nManagement fee = $100 million × 120% × 1% = $1.200 million. Performance fee = [($100 million\n× 20%) - ($100 million × 3%) - $1.200 million)] × 15% = $2.370 million. Total fee = $1.200 million\n+ $2.370 million = $3.570 million. Investor return = ($20-$3.570)/$100 = 16.430% 16.4%.\nC. Incorrect because the hurdle rate is deducted from the performance fee rate rather than the\nrate of return: Management fee = $100 million × 120% × 1% = $1.200 million. Performance fee =\n[($100 million × 20%) - $1.200 million)] x (15%-3%) = $2.256 million. Total fee = $1.200 million +\n$2.256 million = $3.456 million. Investor return = ($20-$3.456) / $100 = 16.544% ~~ 16.5%.\nAlternative Investments: calculate and interpret alternative investment returns both before and\nafter fees", "qhtml": null}, {"n": 46, "q": "A hedge fund has the following characteristics:\n• Assets under management, beginning of year: $1.5 billion\n• Annual return: 20%\n• Management fee: 2%, based on year-end valuation\n• Incentive fee: 20%, calculated net of management fees\nIf the incentive fee is calculated on returns in excess of a 6% hurdle rate, total annual fees earned by the fund manager are closest to:", "opts": ["$34,800,000.", "$70,800,000.", "$78,000,000."], "ans": "B", "expl": "Year-end AUM = $1.5 billion × (1 + 20%) = $1.8 billion.\nManagement fee = 2% × $1.8 billion (year-end valuation) = $36.0 million.\nHurdle = 6% × $1.5 billion = $90.0 million.\n\nA. Incorrect because it counts only the incentive fee and omits the management fee. Incentive fee = 20% × [($1.5 billion × 20%) − $90 million − $36 million] = 20% × $174 million = $34.8 million.\nB. Correct. Because the incentive fee is calculated net of management fees and on the return in excess of the 6% hurdle: Incentive fee = 20% × [$300 million − $90 million − $36 million] = 20% × $174 million = $34.8 million. Total fees = management fee $36.0 million + incentive fee $34.8 million = $70.8 million.\nC. Incorrect because the incentive fee is not netted of the management fee: Incentive fee = 20% × ($300 million − $90 million) = $42.0 million; Total fees = $36.0 million + $42.0 million = $78.0 million.\nAlternative Investments: calculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 47, "q": "What is the most likely effect of a redemption fee on the returns of the remaining\ninvestors in a hedge fund? A redemption fee:", "opts": ["reduces investor returns.", "has no effect on investor returns.", "enhances investor returns."], "ans": "C", "expl": "A. Incorrect because the fee increases [not decreases] the value of the hedge fund by the fee\namount. A redemption fee may be charged, typically payable to the fund itself (rather than the\nmanager). This is to protect remaining investors in the fund, particularly in circumstances where\nthe redemption takes place during the lockup period.\nB. Incorrect because the fee increases the value of the hedge fund by the fee amount. A\nredemption fee may be charged, typically payable to the fund itself (rather than the manager).\nThis is to protect remaining investors in the fund, particularly in circumstances where the\nredemption takes place during the lockup period.\nC. Correct because the fee increases the value of the hedge fund by the fee amount. A\nredemption fee may be charged, typically payable to the fund itself (rather than the manager).\nThis is to protect remaining investors in fund, particularly the in circumstances where the\nredemption takes place during the lockup period. This characteristic is called a soft lockup, and\nit offers a path (albeit an expensive one) to redeem early.\nAlternative Investments: explain investment features of hedge funds and contrast them with\nother asset classes", "qhtml": null}, {"n": 48, "q": "If a commodity's storage cost is equal to its convenience yield, its futures prices will be\ngreater than it
