<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Compared to centralized cryptocurrency exchanges, decentralized exchanges are:","opts":["Less likely to be regulated and less susceptible to attacks from hackers.","Less likely to be regulated and more susceptible to attacks from hackers.","More likely to be regulated and less susceptible to attacks from hackers."],"ans":"A","expl":"A. Đúng vì các sàn giao dịch phi tập trung thiếu cơ chế kiểm soát tập trung và\nhoạt động trên nền tảng phân tán mà không có sự điều phối hoặc kiểm soát trung tâm. Điều này đi kèm với\nlợi ích là nếu một trong các máy tính trên mạng bị tấn công, trao đổi\nvẫn hoạt động vì có nhiều máy tính khác tiếp tục hoạt động trên\nmạng. Đó là lý do tại sao việc tấn công các sàn giao dịch phi tập trung lại khó khăn hơn nhiều.\nkhiến các cuộc tấn công như vậy gần như chắc chắn sẽ thất bại. Tuy nhiên, đối với một sàn giao dịch tập trung, giao dịch\nđược lưu trữ trên các máy chủ riêng, khiến các sàn giao dịch tập trung và khách hàng của họ gặp các lỗ hổng bảo mật\nNếu máy chủ của sàn giao dịch bị xâm phạm, toàn bộ hệ thống có thể\nbị tê liệt, tạm dừng giao dịch và rò rỉ thông tin quan trọng của người dùng. Do đó, các sàn giao dịch\nphi tập trung ít bị tấn công từ tin tặc hơn.\nHơn nữa, các sàn giao dịch phi tập trung rất khó quản lý vì không một cá nhân,\ntổ chức hoặc nhóm nào kiểm soát hệ thống. Điều này có nghĩa là những người giao dịch trên các sàn giao dịch\nphi tập trung thường được tự do giao dịch mà không cần bất kỳ sự giám sát pháp lý nào. Tuy nhiên, một số\n[sàn giao dịch tập trung được quản lý và tùy thuộc vào khu vực pháp lý, các sàn giao dịch này có thể\nđược quy định là sàn giao dịch tài chính hoặc các loại trung gian tài chính khác. Do đó,\ncác sàn giao dịch phi tập trung ít có khả năng được quản lý hơn.\nB. Không chính xác vì các sàn giao dịch phi tập trung thiếu cơ chế kiểm soát tập trung và\nhoạt động trên nền tảng phân tán mà không có sự điều phối hoặc kiểm soát trung tâm. Điều này đi kèm với\nlợi ích là nếu một trong các máy tính trên mạng bị tấn công, trao đổi\nvẫn hoạt động vì có nhiều máy tính khác tiếp tục hoạt động trên\nmạng. Đó là lý do tại sao việc tấn công các sàn giao dịch phi tập trung lại khó khăn hơn nhiều.\nkhiến các cuộc tấn công như vậy gần như chắc chắn sẽ thất bại. Tuy nhiên, đối với một sàn giao dịch tập trung, giao dịch\nđược lưu trữ trên các máy chủ riêng, khiến các sàn giao dịch tập trung và khách hàng của họ gặp phải các lỗ hổng bảo mật\n. Nếu máy chủ của sàn giao dịch bị xâm phạm, toàn bộ hệ thống có thể\nbị tê liệt, tạm dừng giao dịch và rò rỉ thông tin quan trọng của người dùng. Do đó, các sàn giao dịch\nphi tập trung ít (không nhiều) dễ bị tấn công từ tin tặc.\nC. Không chính xác vì các sàn giao dịch phi tập trung rất khó quản lý vì không có cá nhân, tổ chức hoặc nhóm nào kiểm soát hệ thống. Điều này có nghĩa là những giao dịch trên\nsàn giao dịch phi tập trung thường được tự do giao dịch mà không có bất kỳ sự giám sát nào của cơ quan quản lý.\nTuy nhiên, một số sàn giao dịch [tập trung] được quản lý và tùy thuộc vào khu vực pháp lý, những\ncác sàn giao dịch này có thể được quản lý như các sàn giao dịch tài chính hoặc các loại trung gian tài chính khác.\nDo đó, các sàn giao dịch phi tập trung ít (không nhiều) có khả năng được quản lý.\nĐầu tư thay thế: mô tả các hình thức đầu tư và phương tiện được sử dụng trong các khoản đầu tư\ntài sản kỹ thuật số.","qhtml":null},{"n":2,"q":"Which of the following forms of digital asset investment most likely involves the use of a\ncryptocurrency wallet?","opts":["Direct investment","Indirect investment via ETFs","Indirect investment via coin trusts"],"ans":"A","expl":"A. Đúng vì đầu tư tài sản kỹ thuật số có thể dưới hình thức đầu tư trực tiếp vào\nblockchain hoặc đầu tư gián tiếp. Quyền sở hữu trực tiếp bitcoin và các loại tiền điện tử khác\nliên quan đến việc sử dụng ví tiền điện tử lưu trữ mã kỹ thuật số (công khai)\ncần thiết để truy cập trình xác nhận trên trang web máy tính hoặc ứng dụng thiết bị di động.\nB. Không chính xác vì ngày càng có nhiều sản phẩm giao dịch trao đổi, chẳng hạn như ETF, tìm cách\nnhân rộng lợi nhuận đầu tư của tài sản kỹ thuật số. Các ETFS này thường không đầu tư trực tiếp vào\ntiền điện tử và tiếp cận giá trị của tiền điện tử bằng cách sử dụng các công cụ phái sinh tiền mặt anacyptocurency\n, Vì đầu tư trực tiếp giống như một ví tiền điện tử Is.nol tsquused\nC. Không chính xác vì các quỹ tín thác tiền điện tử cho phép các nhà đầu tư giao dịch cổ phiếu trong các quỹ tín thác nắm giữ\ncác nhóm tiền điện tử lớn và giao dịch qua quầy (OTC) và hoạt động giống như các quỹ đóng\n. Đối với nhà đầu tư vào đồng tiền Inust, không cần phải tạo ví kỹ thuật số và sử dụng\nkhóa mã hóa để đầu tư vào tiền điện tử.\nĐầu tư thay thế: mô tả các hình thức đầu tư và phương tiện được sử dụng trong các khoản đầu tư\ntài sản kỹ thuật số.","qhtml":null},{"n":3,"q":"The correlation of cryptocurrencies with traditional assets has been:","opts":["Decreasing.","Steady.","Increasing."],"ans":"C","expl":"A. Không chính xác vì mối quan hệ giữa tiền điện tử với tài sản truyền thống đang gia tăng.\nB. Không chính xác vì mối quan hệ giữa tiền điện tử với tài sản truyền thống đang gia tăng.\nC. Đúng vì mối tương quan giữa tiền điện tử với tài sản truyền thống đang gia tăng.\nĐầu tư thay thế: phân tích các nguồn rủi ro, lợi nhuận và đa dạng hóa giữa các khoản đầu tư\ntài sản kỹ thuật số","qhtml":null},{"n":4,"q":"Which of the following is most likely a major driver of bitcoin returns?","opts":["Increased market adoption","The prospect of underlying cashflow generation","Consistently high correlation with traditional asset classes"],"ans":"A","expl":"A. Đúng vì trên thực tế, giá (hoặc lợi nhuận) của tiền điện tử được thúc đẩy nhiều hơn bởi\nsự tiếp nhận thị trường, hiệu ứng mạng, tiến bộ công nghệ, phát triển quy định và\nkhả năng chấp nhận rủi ro thị trường chung.\nB. Không chính xác vì bitcoin và các giá trị tiền điện tử khác chỉ dựa trên sự đánh giá tài sản\n, không có dòng tiền cơ bản.\nC. Không chính xác vì kể từ khi ra mắt vào năm 2009, hiệu suất của bitcoin đã được đặc trưng bởi\nlợi nhuận cao, độ biến động cao và mối tương quan thấp với các loại tài sản truyền thống. Thực tế là\nmối tương quan giữa tiền điện tử với tài sản truyền thống đang gia tăng không có nghĩa là mối tương quan\ncủa bitcoin và các loại tiền điện tử khác đã đạt đến mức cao, và\nmức cao cũng không nhất thiết phải là một tính năng mong muốn.\nĐầu tư thay thế: phân tích các nguồn rủi ro, lợi nhuận và đa dạng hóa giữa các khoản đầu tư","qhtml":null},{"n":5,"q":"Cryptocurrencies can be issued by:","opts":["individuals only.","Corporations and organisations only.","individuals, corporations and organisations."],"ans":"C","expl":"A. Không chính xác vì tiền điện tử không chỉ được phát hành bởi các cá nhân mà còn bởi\ncác tập đoàn và tổ chức. Mặc dù có khoảng 70 loại tiền điện tử được ghi nhận vào năm 2013,\nđến đầu năm 2022, đã có gần 10.000 loại tiền điện tử khác nhau do các tập đoàn,\ntổ chức và trong nhiều trường hợp là các cá nhân phát hành.\nB. Không chính xác vì tiền điện tử không chỉ được phát hành bởi các tập đoàn và tổ chức mà\ncũng được phát hành bởi các cá nhân. Mặc dù có khoảng 70 loại tiền điện tử được ghi nhận vào năm 2013, nhưng đến đầu\n2022, đã có gần 10.000 loại tiền điện tử khác nhau do các tập đoàn,\ntổ chức và trong nhiều trường hợp là các cá nhân phát hành.\nC. Đúng vì mặc dù có khoảng 70 loại tiền điện tử được ghi nhận vào năm 2013, nhưng đến đầu\n2022, đã có gần 10.000 loại tiền điện tử khác nhau do các tập đoàn,\ntổ chức và trong nhiều trường hợp là các cá nhân phát hành.\nĐầu tư thay thế: giải thích các đặc điểm đầu tư của tài sản kỹ thuật số và so sánh chúng với\ncác loại tài sản khác","qhtml":null},{"n":6,"q":"Compared to traditional financial assets, digital assets:","opts":["can be invested in through indirect investment vehicles such as ETFs.","are generally recorded in private ledgers maintained by central intermediaries.","do not have an inherent value based on underlying assets or on potential cash flows."],"ans":"C","expl":"A. Không chính xác vì điểm tương đồng chính [không phải sự khác biệt] giữa các loại tài sản này là sự xuất hiện\ncủa các phương tiện đầu tư gián tiếp như quỹ giao dịch trao đổi [ETFS] và quỹ phòng hộ\nđầu tư cả vào tài sản tài chính truyền thống và tài sản kỹ thuật số.\nB. Không chính xác vì một điểm khác biệt chính giữa tài sản kỹ thuật số và các công cụ\ntài chính truyền thống là tài sản [không phải kỹ thuật số] truyền thống thường được ghi lại trong sổ cái riêng\nđược duy trì bởi các trung gian trung tâm.\nC. Đúng vì vì, không giống như tài sản tài chính, hầu hết tài sản kỹ thuật số không có giá trị vốn có\ndựa trên tài sản cơ bản hoặc dòng tiền tiềm năng.\nĐầu tư thay thế: giải thích các tính năng đầu tư của tài sản kỹ thuật số và đối chiếu chúng với\ncác loại tài sản khác","qhtml":null},{"n":7,"q":"A measure that restricts new investors in a hedge fund from redeeming their capital for a\nset amount of time in order to implement the fund's investment strategy is known as a:","opts":["gate.","notice period.","lockup period."],"ans":"C","expl":"A. Không chính xác vì ngoài ra, quỹ đôi khi áp đặt một cổng giới hạn hoặc hạn chế\nviệc quy đổi trong một khoảng thời gian. Một cổng do người quản lý quỹ phòng hộ áp đặt độc lập với\nbất kỳ thời hạn khóa nào có thể áp dụng. Do đó, cổng sẽ áp dụng cho tất cả các nhà đầu tư trong một khoảng thời gian\nhữu hạn trong khi thời gian khóa chỉ áp dụng cho các nhà đầu tư mới.\nB. Không chính xác vì thời gian thông báo tạo cơ hội cho người quản lý quỹ phòng hộ\nthanh lý một vị thế một cách có trật tự mà không làm tăng thêm khoản lỗ. Khoảng thời gian thông báo áp dụng\ncho tất cả các nhà đầu tư muốn rút một phần hoặc toàn bộ vốn của họ khỏi quỹ phòng hộ với mục tiêu\ncung cấp cho người quản lý cảnh báo trước về việc rút tiền.\nC. Đúng vì khoảng thời gian khóa - khoảng thời gian khi các nhà đầu tư không thể rút vốn-\ncung cấp cho người quản lý quỹ phòng hộ thời gian cần thiết để thực hiện và có khả năng nhận ra kết quả mong đợi của chiến lược\n. Thời hạn khóa áp dụng cho các nhà đầu tư mới trong quỹ phòng hộ với mục tiêu\ncho phép người quản lý quỹ phòng hộ có thời gian thực hiện chiến lược đầu tư của quỹ.\nĐầu tư thay thế: mô tả việc đánh giá hiệu suất của các khoản đầu tư thay thế","qhtml":null},{"n":8,"q":"Venture capital is best classified as a sub-category of.","opts":["real estate.","hedge funds.","private equity."],"ans":"C","expl":"A. Không chính xác vì các khoản đầu tư bất động sản được thực hiện bằng các tòa nhà hoặc đất đai, trực tiếp hoặc\ngián tiếp. Mặc dù một số khoản đầu tư vốn mạo hiểm có thể có thành phần bất động sản,\nvốn mạo hiểm được coi rộng rãi là một loại hình đầu tư vốn cổ phần tư nhân và được phân loại tốt nhất là\nnhư vậy.\nB. Không chính xác vì các quỹ phòng hộ là phương tiện đầu tư tư nhân quản lý danh mục chứng khoán\nvà/hoặc các vị thế phái sinh bằng nhiều chiến lược khác nhau. Mặc dù các khoản đầu tư vốn mạo hiểm\ncó thể được đưa vào một số quỹ phòng hộ, nhưng vốn mạo hiểm được coi rộng rãi là một loại hình\ncủa đầu tư vốn cổ phần tư nhân và được phân loại tốt nhất như vậy.\nC. Đúng vì các quỹ đầu tư mạo hiểm, một dạng vốn cổ phần tư nhân chuyên biệt thường\nliên quan đến việc đầu tư hoặc cung cấp tài chính cho các công ty khởi nghiệp hoặc các công ty đang trong giai đoạn đầu có tiềm năng tăng trưởng cao\n, đại diện cho một phần nhỏ của thị trường vốn cổ phần tư nhân.\nĐầu tư thay thế: mô tả các đặc điểm và danh mục đầu tư thay thế","qhtml":null},{"n":9,"q":"A leveraged loan is best defined as a loan:","opts":["that is itself levered.","to mature companies in financial difficulty.","that comes with warrants or conversion rights."],"ans":"A","expl":"A. Đúng vì khoản vay có đòn bẩy là khoản vay có đòn bẩy. Các công ty nợ tư nhân đầu tư\nvào các khoản vay có đòn bẩy trước tiên sẽ vay tiền để tài trợ cho khoản nợ và sau đó mở rộng cho một người vay\nkhác. Bằng cách sử dụng đòn bẩy, một công ty nợ tư nhân có thể nâng cao lợi nhuận trên danh mục cho vay của mình.\nB. Không chính xác vì liên quan đến khoản nợ khó khăn thường đòi hỏi phải mua nợ của các công ty\nđã trưởng thành đang gặp khó khăn về tài chính. Các công ty này có thể phá sản, không trả được nợ\nhoặc dường như có khả năng vỡ nợ Một số nhà đầu tư xác định các công ty có vấn đề về dòng tiền\ntạm thời nhưng có một kế hoạch kinh doanh tốt sẽ giúp công ty tồn tại và cuối cùng\nphát triển. Những nhà đầu tư này mua nợ của công ty, kỳ vọng cả công ty và khoản nợ của công ty\nsẽ tăng giá trị. Các nhà đầu tư quay vòng mua nợ nhằm mục đích tích cực hơn trong việc quản lý và chỉ đạo công ty\nđang gặp khó khăn, tìm cách cơ cấu lại và hồi sinh chúng.\nC. Không chính xác vì nợ cấp hai thường đi kèm với các tính năng bổ sung, chẳng hạn như chứng quyền hoặc\nquyền chuyển đổi. Những điều này mang lại sự tham gia vốn cổ phần cho người cho vay/nhà đầu tư, truyền đạt tùy chọn\nđể chuyển nợ của họ thành vốn chủ sở hữu hoặc mua vốn cổ phần của người vay cơ bản trong\nnhững trường hợp nhất định.\nĐầu tư thay thế: giải thích các đặc điểm của nợ tư nhân và đặc điểm đầu tư của nó","qhtml":null},{"n":10,"q":"From the perspective of a private equity firm, an advantage of exiting a portfolio company\nthrough a special purpose acquisition company (SPAC) most likely include:","opts":["floating valuation.","flexibility of the transaction structure.","lower deal risk due to restrictions on redemptions."],"ans":"B","expl":"A. Không chính xác vì lợi ích của việc thoát khỏi SPAC bao gồm việc định giá cố định với độ biến động thấp hơn\nđịnh giá cổ phiếu.\nB. Đúng vì lợi ích của việc thoát SPAC bao gồm:\nmột. kéo dài thời gian công bố thông tin công khai về triển vọng của công ty để thu hút sự quan tâm của nhà đầu tư.\nb. định giá cố định với mức độ biến động giá cổ phiếu thấp hơn.\nc. tính linh hoạt của cấu trúc giao dịch để phù hợp nhất với bối cảnh của công ty và\nd. liên kết với các nhà tài trợ có uy tín và dày dạn kinh nghiệm cũng như nhà đầu tư rộng rãi của họ\nmạng.\nC. Không chính xác vì được phép quy đổi và làm tăng rủi ro giao dịch. Ngoài ra, nhược điểm\nbao gồm\nmột. chi phí vốn tiềm tàng cao hơn từ việc pha loãng tài trợ, chứng quyền và các khoản phí khác,\nb. chênh lệch giữa giá trị vốn chủ sở hữu được công bố và giá trị thực do pha loãng,\nc. rủi ro về giao dịch và vốn do các khoản hoàn lại tiềm năng, và\nd. cổ đông đáng kể treo cổ và rời bỏ trong số tháng sau khi sáp nhập.\nĐầu tư thay thế: giải thích các đặc điểm của vốn cổ phần tư nhân và đặc điểm đầu tư của nó","qhtml":null},{"n":11,"q":"With respect to private equity, the growth capital strategy is also known as:","opts":["venture capital.","recapitalization.","minority equity investing."],"ans":"C","expl":"A. Không chính xác vì vốn mạo hiểm là một chiến lược cổ phần tư nhân khác với vốn tăng trưởng.\nVốn mạo hiểm (VC) đòi hỏi phải đầu tư hoặc cung cấp tài chính cho các công ty tư nhân có tiềm năng tăng trưởng\ncao. Thông thường, đây là những công ty khởi nghiệp hoặc công ty trẻ, nhưng vốn mạo hiểm có thể được cung cấp\nở nhiều giai đoạn khác nhau, từ khi bắt đầu nảy sinh ý tưởng cho một công ty cho đến thời điểm\nkhi công ty sắp triển khai IPO (chào bán cổ phiếu lần đầu ra công chúng) hoặc được mua lại. Tăng trưởng\nvốn thường đề cập đến các khoản đầu tư vốn sở hữu thiểu số, theo đó công ty có quyền kiểm soát ít hơn\nở các công ty trưởng thành hơn đang tìm kiếm vốn để mở rộng hoặc\ntái cơ cấu hoạt động, thâm nhập thị trường mới hoặc cấp vốn cho các thương vụ mua lại lớn.\nB. Không chính xác vì đây là chiến lược rút lui. Tái cấp vốn trong bối cảnh vốn cổ phần tư nhân\nmô tả các bước mà một công ty thực hiện để tăng hoặc giới thiệu đòn bẩy cho công ty trong danh mục đầu tư của mình và\ntự trả cổ tức từ cơ cấu vốn mới.\nC. Đúng vì trong số một số chuyên ngành khác, một số công ty cổ phần tư nhân chuyên về\nvốn tăng trưởng, còn được gọi là vốn cổ phần tăng trưởng hoặc đầu tư vốn cổ phần thiểu số. Vốn tăng trưởng\nthường đề cập đến các khoản đầu tư vốn sở hữu thiểu số, theo đó công ty có lợi ích\nít kiểm soát hơn ở các công ty trưởng thành hơn đang tìm kiếm vốn để mở rộng hoặc tái cơ cấu hoạt động\n, thâm nhập thị trường mới hoặc tài trợ cho các thương vụ mua lại lớn.\nĐầu tư thay thế: giải thích các đặc điểm của vốn cổ phần tư nhân và đặc điểm đầu tư của nó","qhtml":null},{"n":12,"q":"Which of the following hedge fund investments require the highest level of scrutiny and\ndue diligence?","opts":["Level 1 assets","Level 2 assets","Level 3 assets"],"ans":"C","expl":"A. Không chính xác vì tài sản Cấp 1 có sẵn giá giao dịch trao đổi, giao dịch công khai mà\nbắt buộc phải được sử dụng cho mục đích định giá. Sau đây là một phương pháp liên quan đến việc\nphân loại các khoản đầu tư thành ba nhóm định giá tài sản Cấp 1, 2 và 3... u Tài sản cấp 1\ncó sẵn giá giao dịch trao đổi, giao dịch công khai được bắt buộc phải sử dụng cho\nmục đích định giá.\nB. Không chính xác vì giá trị tài sản Cấp 2 sử dụng báo giá bên ngoài từ nhà môi giới khi không có giá\n(Cấp 1) được giao dịch công khai Sau đây là phương pháp liên quan đến việc phân loại\ncác khoản đầu tư thành ba nhóm: Định giá tài sản Cấp 1, 2 và 3. Giá trị tài sản cấp 2 sử dụng\nbáo giá bên ngoài từ các nhà môi giới khi không có giá giao dịch công khai (Cấp 1).\nC. Đúng vì bất kỳ phương tiện đầu tư nào liên quan nhiều đến tài sản được định giá Cấp 3\nđều đáng được tăng cường giám sát và thẩm định. Sau đây là phương pháp liên quan đến việc\nphân loại các khoản đầu tư thành ba nhóm: Định giá tài sản cấp 1, 2 và 3... Giá trị tài sản cấp 3\nchỉ được tính toán bằng cách sử dụng các mô hình nội bộ khi báo giá của nhà môi giới bên ngoài (Cấp 2) không có\nhoặc không đáng tin cậy.\nĐầu tư thay thế: mô tả việc đánh giá hiệu suất của các khoản đầu tư thay thế","qhtml":null},{"n":13,"q":"Hedge funds are most likely to place restrictions on:","opts":["redemptions.","the use of leverage.","the use of derivatives."],"ans":"A","expl":"A. Đúng vì các khoản đầu tư thay thế thường có nhiều đặc điểm sau.\nHạn chế về việc mua lại (.e., 'khóa' và 'cổng'). Do đó, các hạn chế đối với việc rút lại\nthường được áp đặt [bởi các quỹ phòng hộ]. Các nhà đầu tư có thể được yêu cầu giữ tiền của họ trong quỹ phòng hộ\ntrong một khoảng thời gian tối thiểu (gọi là thời gian khóa) trước khi họ được phép thực hiện\nrút tiền hoặc mua lại cổ phiếu. Nhà đầu tư có thể được yêu cầu đưa ra thông báo về ý định\nđổi quà, thời gian thông báo thường là 30-90 ngày. Để mua lại cổ phiếu, nhà đầu tư có thể bị tính một\nphí, thường phải trả cho chính quỹ (chứ không phải cho người quản lý) để không gây bất lợi\ncác nhà đầu tư còn lại trong quỹ, đặc biệt trong trường hợp việc mua lại diễn ra\ntrong thời gian khóa.\nB. Không chính xác vì các quỹ phòng hộ là phương tiện đầu tư tư nhân quản lý danh mục chứng khoán\nvà/hoặc các vị thế phái sinh bằng nhiều chiến lược khác nhau. Mặc dù các quỹ phòng hộ có thể được\nđầu tư hoàn toàn vào các tài sản truyền thống, những phương tiện này được coi là lựa chọn thay thế vì\ntính chất riêng tư của chúng. Các quỹ phòng hộ thường có nhiều thời gian hơn để theo đuổi các khoản đầu tư và chiến lược\nmang lại tiềm năng lợi nhuận cao hơn, dù là tuyệt đối hay so với một tiêu chuẩn thị trường cụ thể\n, nhưng những chiến lược này có thể làm tăng nguy cơ thua lỗ đầu tư. Chúng có thể liên quan đến các vị thế mua\nvà bán và có thể có đòn bẩy cao. Một số nhằm mục đích mang lại hiệu suất đầu tư\nđộc lập với hiệu suất thị trường rộng hơn.\nC. Không chính xác vì các quỹ phòng hộ là phương tiện đầu tư tư nhân quản lý danh mục chứng khoán\nvà/hoặc các vị thế phái sinh bằng nhiều chiến lược khác nhau. Chúng có thể liên quan đến các vị thế mua và bán\nvà có thể có đòn bẩy cao. Một số nhằm mục đích mang lại hiệu suất đầu tư\nđộc lập với hiệu suất thị trường rộng hơn. Một quỹ phòng hộ hiện đại thường có\ncác đặc điểm sau: Đó là một danh mục đầu tư được quản lý sáng tạo liên quan đến một hoặc\nnhiều loại tài sản (cổ phiếu, tín dụng, thu nhập cố định, hàng hóa, hợp đồng tương lai, ngoại hối và\nđôi khi thậm chí cả tài sản cứng, chẳng hạn như bất động sản), đôi khi giao dịch ở các khu vực địa lý\nkhác nhau, thường sử dụng đòn bẩy, thường đảm nhận cả vị thế mua và vị thế bán (khi có thể),\nvà thường sử dụng các công cụ phái sinh để bày tỏ quan điểm hoặc thiết lập biện pháp phòng ngừa.\nĐầu tư thay thế: giải thích các đặc điểm đầu tư của các quỹ phòng hộ và đối chiếu chúng với\ncác loại tài sản khác","qhtml":null},{"n":14,"q":"Crude oil is categorized as:","opts":["a soft commodity.","a hard commodity.","neither a soft commodity nor a hard commodity."],"ans":"B","expl":"A. Không chính xác vì dầu được phân loại là hàng hóa cứng chứ không phải hàng hóa mềm. Hàng hóa\nđược coi là 'cứng' (những hàng hóa được khai thác, chẳng hạn như đồng hoặc chiết xuất, chẳng hạn như dầu) hoặc 'mềm (những\nđược trồng trong một khoảng thời gian, chẳng hạn như gia súc, ngũ cốc và cây trồng thương mại, chẳng hạn như cà phê).\nB. Đúng vì hàng hóa được coi là 'cứng' (những mặt hàng được khai thác, chẳng hạn như đồng, hoặc\nđược chiết xuất, chẳng hạn như dầu) hoặc 'mềm (những mặt hàng được trồng trong một khoảng thời gian, chẳng hạn như vật nuôi, ngũ cốc và\ncây trồng hàng hóa, chẳng hạn như cà phê).\nC. Không chính xác vì dầu được phân loại là hàng hóa cứng chứ không phải hàng hóa mềm. Hàng hóa\nđược coi là 'cứng (những sản phẩm được khai thác, chẳng hạn như đồng hoặc chiết xuất, chẳng hạn như dầu) hoặc 'mềm (những sản phẩm\nđược trồng trong một khoảng thời gian, chẳng hạn như vật nuôi, ngũ cốc và cây trồng thương mại, chẳng hạn như cà phê).\nĐầu tư thay thế: mô tả các đặc điểm của hàng hóa và đặc điểm đầu tư của chúng","qhtml":null},{"n":15,"q":"Compared with direct investing, co-investing in alternative investments most likely offers:","opts":["reduced control over the investment selection prOcess.","the same level of control over the investment selection process.","higher control over the investment selection process."],"ans":"A","expl":"A. Đúng vì đồng đầu tư làm giảm khả năng kiểm soát đối với quá trình lựa chọn đầu tư\nso với đầu tư trực tiếp.\nB. Không chính xác vì đồng đầu tư làm giảm khả năng kiểm soát đối với quá trình lựa chọn đầu tư\nso với đầu tư trực tiếp.\nC. Không chính xác vì đồng đầu tư làm giảm quyền kiểm soát đối với quá trình lựa chọn đầu tư\nso với đầu tư trực tiếp.\nĐầu tư thay thế: So sánh đầu tư trực tiếp, đồng đầu tư và đầu tư vào quỹ\ncác phương pháp đầu tư thay thế","qhtml":null},{"n":16,"q":"Which of the following methods of investing in alternative investments provides the most\nflexibility to the investor?","opts":["Co-investing","Fund investing","Direct investing"],"ans":"C","expl":"A. Không chính xác vì đầu tư trực tiếp mang lại mức độ linh hoạt cao nhất cho nhà đầu tư\nvà cấp quyền kiểm soát cao nhất đối với cách quản lý tài sản.\nB. Không chính xác vì đầu tư trực tiếp mang lại mức độ linh hoạt cao nhất cho nhà đầu tư\nvà cấp quyền kiểm soát cao nhất đối với cách quản lý tài sản.\nC. Đúng vì đầu tư trực tiếp cho phép nhà đầu tư xây dựng danh mục đầu tư theo yêu cầu chính xác của mình\n. Đầu tư trực tiếp mang lại mức độ linh hoạt cao nhất cho nhà đầu tư\nvà cấp quyền kiểm soát cao nhất đối với cách quản lý tài sản.\nĐầu tư thay thế: so sánh các phương pháp đầu tư trực tiếp, đồng đầu tư và đầu tư vào quỹ\ncho các khoản đầu tư thay thế","qhtml":null},{"n":17,"q":"Which of the following is best classified as a commodity?","opts":["Livestock","Timberland","Agricultural land"],"ans":"A","expl":"A. Đúng vì đầu tư hàng hóa có thể liên quan đến việc đầu tư vào hàng hóa thực tế\n hoặc vào nhà sản xuất hàng hóa. Hàng hóa được coi là 'cứng' (những\nđược khai thác, chẳng hạn như đồng hoặc được chiết xuất, chẳng hạn như dầu), chẳng hạn như gia súc, ngũ cốc và cây trồng thương mại, chẳng hạn như\nnhư cà phê). hoặc 'mềm' (được trồng trong một khoảng thời gian\nB. Không chính xác vì đất rừng là một thành phần riêng biệt của tài nguyên thiên nhiên, không phải là\nhàng hóa. Tài nguyên thiên nhiên bao gồm hàng hóa (cứng và mềm), đất nông nghiệp (đất nông nghiệp),\nvà đất rừng.\nC. Không chính xác vì tài nguyên bao gồm đất nông nghiệp là một thành phần riêng biệt của tự nhiên\ntài nguyên, không phải hàng hóa. Hàng hóa tự nhiên (cứng và mềm), đất nông nghiệp (đất nông nghiệp),\nvà đất rừng.\nĐầu tư thay thế: mô tả các đặc điểm của hàng hóa và đặc điểm đầu tư của chúng","qhtml":null},{"n":18,"q":"Investors in greenfield infrastructure projects typically:","opts":["rely on the assets' financial and operating history.","invest alongside strategic investors or developers.","have lower development risk than investors in brownfield projects."],"ans":"B","expl":"A. Không chính xác vì nó dành cho lĩnh vực nâu, không phải lĩnh vực xanh, thường đầu tư cùng với chiến lược\nnhà đầu tư hoặc nhà phát triển chuyên về tài sản cơ sở hạ tầng sẽ được xây dựng là\nthường được gọi là rủi ro xây dựng và phát triển cao hơn so với các nhà đầu tư,\nthông thường, một số khoản đầu tư tài chính và lĩnh vực xanh của tài sản. Vì vậy, các nhà đầu tư vào lĩnh vực xanh phải đối mặt\ncác nhà đầu tư lĩnh vực tiềm năng và có thể mong đợi sự tăng giá vốn để phản ánh việc xây dựng và\nrủi ro vận hành. lịch sử hoạt động có sẵn.\nB. Đúng vì các nhà đầu tư mới trong việc phát triển tài sản cơ bản.\nC. Không chính xác vì việc đầu tư vào các tài sản cơ sở hạ tầng sẽ được xây dựng nói chung là\nđược gọi là đầu tư vào lĩnh vực xanh Do đó, các nhà đầu tư vào lĩnh vực xanh phải đối mặt với sự phát triển và\nrủi ro xây dựng so với các nhà đầu tư ở mỏ nâu và có thể mong đợi sự tăng giá vốn\nphản ánh rủi ro xây dựng và vận hành\nĐầu tư thay thế: giải thích các tính năng và đặc điểm của cơ sở hạ tầng","qhtml":null},{"n":19,"q":"An analyst gathers the following information about a hedge fund:\nBeginning-of-year assets under management (AUM): $500 million\nAnnual return before fees: 22%\nManagement fee, based on end-of-year AUM before fees: 2%\nIncentive fee: 15%\nHard hurdle rate: 10%\nQ. The incentive fee (in $ millions) based on returns net of management fees is closest to:","opts":["7.2.","13.0.","14.7."],"ans":"A","expl":"A. Đúng vì AUM cuối năm = 500 triệu USD x 22% = 610 triệu USD.\nPhí quản lý = 610 triệu USD x 2% = 12,2 triệu USD.\nTỷ lệ vượt rào là tỷ suất lợi nhuận tối thiểu. thường là 8%, GP phải vượt quá để\nkiếm được phí hiệu suất. GP thường nhận được 20% tổng lợi nhuận của quỹ đầu tư tư nhân\nkhông bao gồm bất kỳ tỷ lệ rào cản cứng nào, trong trường hợp đó GP kiếm được phí trên lợi nhuận hàng năm vượt quá\ntỷ lệ vượt rào hoặc không tính tỷ lệ rào cản mềm, trong trường hợp đó phí được tính trên toàn bộ\nlợi nhuận gộp hàng năm miễn là vượt quá rào cản đã đặt.\nRào cản cứng = 500 triệu USD x 10% 50 triệu USD.\nPhí khuyến khích (dựa trên lợi nhuận ròng của phí quản lý) = ($610 triệu - 500 triệu USD - 50\ntriệu - 12,2 triệu USD) x 15% = 47,8 triệu USD x 15% = 7,17 triệu USD7,2 triệu\nB. Không chính xác vì nó tính tỷ lệ ngưỡng trên lợi nhuận hàng năm trước phí (thay vì\nAUM đầu năm).\nAUM cuối năm = 500 triệu USD x 22% = 610 triệu USD.\nPhí quản lý = 610 triệu USD x 2% = 12,2 triệu USD.\nRào cản khó khăn = (610 triệu USD - 500 triệu USD) x 10% = 110 triệu USD x 10% = 11,0 triệu USD.\nPhí khuyến khích (tính phí sau khi trừ phí quản lý) = (610 triệu USD - 500 triệu USD - 11,0 triệu USD -\n12,2 triệu USD) x\n15% 86,8 triệu USD x 15% = 13,02 triệu USD 13,0 triệu USD.\nC. Không chính xác vì nó giả định tỷ lệ rào cản mềm (thay vì tỷ lệ rào cản cứng) là 10%.\nAUM cuối năm = 500 triệu USD x 22% = 610 triệu USD.\nPhí quản lý = 610 triệu USD x 2% = 12,2 triệu USD.\nTổng lợi nhuận hàng năm> tỷ lệ rào cản mềm, do đó rào cản mềm không được khấu trừ khỏi\ncách tính phí khuyến khích.\nPhí khuyến khích (tính phí sau khi trừ phí quản lý) = ($610 triệu - 500 triệu USD - 12,2 triệu USD)\nx 15% = 97,8 triệu USD * 15% = 14,67 triệu USD 14,7 triệu USD.\nĐầu tư thay thế: tính toán và giải thích phương án thay thế lợi nhuận đầu tư cả trước và\nsau phí","qhtml":null},{"n":20,"q":"A hedge fund strategy that seeks to influence a company's policies through the purchase\nof equity is best described as a(n):","opts":["activist strategy.","market-neutral strategy.","merger arbitrage strategy."],"ans":"A","expl":"A. Đúng vì các chiến lược theo hướng sự kiện tìm cách kiếm lợi nhuận từ các sự kiện xúc tác đã xác định, thường\nnhững sự kiện liên quan đến thay đổi trong cấu trúc công ty, chẳng hạn như mua lại hoặc tái cơ cấu.\nCác phân chia tiếp theo của danh mục này theo HFR bao gồm: Nhà hoạt động. Thuật ngữ \"nhà hoạt động\" là\nviết tắt của \"cổ đông nhà hoạt động\". Ở đây, các nhà quản lý đảm bảo nắm giữ đủ vốn cổ phần để cho phép họ\ntác động đến các chính sách hoặc định hướng của công ty. Do đó, người quản lý quỹ phòng hộ cố gắng tạo ra\nhoặc chất xúc tác của riêng mình, tác động đến vận mệnh cuối cùng của khoản đầu tư bằng cách tạo ra\nkết quả công ty mong muốn.\nB. Không chính xác vì các chiến lược phòng ngừa rủi ro vốn chủ sở hữu tập trung vào thị trường vốn cổ phần đại chúng và nắm giữ các vị thế mua\nvà bán khống trong vốn cổ phần và chứng khoán phái sinh vốn cổ phần. Ví dụ về chiến lược phòng hộ vốn cổ phần\nbao gồm chứng khoán vốn cổ phần và chứng khoán phái sinh vốn cổ phần. Ví dụ về các chiến lược phòng hộ vốn chủ sở hữu\nbao gồm: Thị trường trung lập. Các chiến lược này sử dụng\nđịnh lượng (kỹ thuật) và phân tích cơ bản để xác định chứng khoán vốn được định giá thấp và quá cao. Quỹ phòng hộ\nchứa các vị thế mua đối với những chứng khoán được xác định là bị định giá thấp và các vị thế bán khống đối với những chứng khoán được xác định là được định giá quá cao. Quỹ phòng hộ cố gắng duy trì vị thế ròng\ntrung lập đối với rủi ro thị trường và các yếu tố rủi ro khác (quy mô, ngành, động lượng, giá trị, v.v.)\nlý tưởng nhất là danh mục đầu tư có hệ số beta tổng thể xấp xỉ bằng 0.\nC. Không chính xác vì các chiến lược theo hướng sự kiện tìm cách thu lợi từ các sự kiện xúc tác đã xác định, thường\nnhững sự kiện liên quan đến thay đổi trong cơ cấu công ty, chẳng hạn như mua lại hoặc tái cơ cấu\nCác phân mục tiếp theo của danh mục này theo HFR bao gồm những phân mục sau. Hợp nhất kinh doanh chênh lệch giá. Nói chung,\ncác chiến lược này liên quan đến việc mua (mua) cổ phiếu của công ty được mua với giá chiết khấu\nso với giá tiếp quản đã công bố và bán khống (bán) cổ phiếu của công ty mua lại\n khi việc sáp nhập hoặc mua lại được công bố. Người quản lý có thể mong đợi thu được lợi nhuận khi\nchênh lệch giao dịch ban đầu thu hẹp đến giá trị đóng của giao dịch sau khi nó hoàn thành\nhoàn thành. Sự chênh lệch tồn tại vì luôn có sự không chắc chắn về việc liệu thương vụ\ncó thực sự kết thúc khi đối mặt với các rào cản pháp lý và quy định\nĐầu tư thay thế: giải thích các đặc điểm đầu tư của các quỹ phòng hộ và đối chiếu chúng với\ncác loại tài sản khác","qhtml":null},{"n":21,"q":"Event-driven hedge fund strategies are most likely.","opts":["long biased.","based on 'top-down' analysis.","exploiting short-term pricing discrepancies between two related securities."],"ans":"A","expl":"A. Đúng vì các chiến lược theo hướng sự kiện có xu hướng thiên lệch lâu dài, trong đó kinh doanh chênh lệch giá sáp nhập có\nít sai lệch nhất.\nB. Không chính xác vì các chiến lược theo hướng sự kiện tìm cách thu lợi nhuận từ các sự kiện xúc tác đã xác định, thường\nliên quan đến những thay đổi trong cơ cấu công ty, chẳng hạn như mua lại hoặc tái cơ cấu. Chúng\nđược coi là dựa trên phân tích cụ thể về bảo mật từ dưới lên, trái ngược với phân tích\ntừ trên xuống.\nC. Không chính xác vì các chiến lược theo hướng sự kiện tìm cách thu lợi nhuận từ các sự kiện xúc tác đã xác định, thường\nliên quan đến những thay đổi trong cơ cấu công ty, chẳng hạn như mua lại hoặc tái cơ cấu. Các quỹ giá trị\ntương đối tìm cách kiếm lợi từ sự chênh lệch về giá giữa các chứng khoán liên quan dựa trên\nmột mối quan hệ ngắn hạn bất thường.\nĐầu tư thay thế: giải thích các đặc điểm đầu tư của các quỹ phòng hộ và đối chiếu chúng với\ncác loại tài sản khác","qhtml":null},{"n":22,"q":"Which of the following are best categorized as social infrastructure assets?","opts":["Airports","Correctional facilities","Telecommunication towers"],"ans":"B","expl":"A. Không chính xác vì đầu tư vào cơ sở hạ tầng thường được phân loại dựa trên\ntài sản cơ bản. Sự phân loại rộng nhất tổ chức đầu tư vào các lĩnh vực kinh tế và xã hội\ntài sản cơ sở hạ tầng. Tài sản cơ sở hạ tầng kinh tế hỗ trợ hoạt động kinh tế và bao gồm\nba loại tài sản chính: tài sản vận tải, công nghệ thông tin và truyền thông\n(ICT), tài sản tiện ích và năng lượng. Tài sản vận tải bao gồm đường, cầu, đường hầm,\nsân bay, cảng biển và hệ thống đường sắt hạng nặng, hạng nhẹ/đô thị.\nB. Đúng vì đầu tư vào cơ sở hạ tầng thường được phân loại dựa trên\ntài sản cơ bản Việc phân loại rộng nhất tổ chức đầu tư vào các lĩnh vực kinh tế và xã hội\ntài sản cơ sở hạ tầng.... Tài sản cơ sở hạ tầng xã hội hướng tới hoạt động của con người và\nbao gồm các tài sản như giáo dục, chăm sóc sức khỏe, nhà ở xã hội và các cơ sở vật chất phù hợp, với\ntập trung vào việc cung cấp, vận hành và duy trì cơ sở hạ tầng tài sản.\nC. Không chính xác vì đầu tư vào cơ sở hạ tầng thường được phân loại dựa trên\ntài sản cơ bản. Sự phân loại rộng nhất tổ chức đầu tư vào các lĩnh vực kinh tế và xã hội\ntài sản cơ sở hạ tầng. Tài sản cơ sở hạ tầng kinh tế hỗ trợ hoạt động kinh tế và bao gồm\nba loại tài sản chính: tài sản vận tải, công nghệ thông tin và truyền thông\n(ICT), tài sản tiện ích và năng lượng.... Tài sản CNTT bao gồm cơ sở hạ tầng lưu trữ,\nphát sóng và truyền thông tin hoặc dữ liệu, chẳng hạn như tháp viễn thông và dữ liệu\ncác trung tâm.\nĐầu tư thay thế: giải thích các tính năng và đặc điểm của cơ sở hạ tầng","qhtml":null},{"n":23,"q":"Which of the following statements is most accurate? Alternative investments:","opts":["tend to be more efficiently priced than traditional investments.","fall outside of the definition of long-only positions in stocks, bonds, and cash.","have relatively high correlation of returns with those of traditional investments."],"ans":"B","expl":"A. Không chính xác vì về bản chất, các tài sản thay thế có xu hướng được định giá kém hiệu quả\nso với các chứng khoán có thể bán trên thị trường truyền thống, tạo cơ hội khai thác sự thiếu hiệu quả của thị trường\nthông qua quản lý tích cực.\nB. Đúng vì đầu tư vào các tài sản thay thế có thể yêu cầu xử lý tính thanh khoản kém, giao dịch trên\nthị trường tư nhân, vận hành các chiến lược đầu tư phức tạp hoặc hồ sơ lợi nhuận rủi ro\nrất khác so với các hồ sơ đầu tư dài hạn truyền thống.\nC. Không chính xác vì các khoản đầu tư thay thế thường có mối tương quan lợi nhuận Tương đối thấp\nvới các khoản đầu tư truyền thống.\nĐầu tư thay thế: mô tả các tính năng và danh mục đầu tư thay thế","qhtml":null},{"n":24,"q":"An analyst gathers the following information about a hedge fund:\n• $200 million in assets under management at the beginning of year\n• a 2% management fee based on year-end assets under management\n• a 20% incentive fee calculated net of the management fee\nQ. If the fund's gross return is 25% during the year, the total fees earned by the fund manager\nare:","opts":["$11 million.","$14 million.","$15 million."],"ans":"B","expl":"A. Không chính xác vì đây là số tiền nếu tổng phí khuyến khích và phí quản lý dựa trên\nđồng đô la sinh lời trong năm ($250 triệu trừ đi $200 triệu). Nghĩa là, tổng phí quản lý\nlà 1 triệu USD (50 triệu USD nhân 0,02) và phí khuyến khích 10 triệu USD ($50\ntriệu nhân 0,20), là 11 triệu USD.\nB. Đúng vì nó tính phí ưu đãi trừ phí quản lý. Nghĩa là, tổng\nphí là tổng phí quản lý 5 triệu USD (250 triệu USD AUM nhân 0,02) và\nphí khuyến khích là 9 triệu USD (250 triệu USD trừ đi 200 triệu USD trừ đi 5 triệu USD nhân ưu đãi\n0,20), tức là 14 triệu USD.\nC. Không chính xác vì đây là số tiền nếu phí khuyến khích và phí quản lý được tính\nđộc lập (chứ không phải nếu phí khuyến khích được tính sau phí quản lý). Tức là\ntổng phí quản lý 5 triệu USD (250 triệu USD AUM nhân 0,02) và phí khuyến khích\n10 triệu USD (250 triệu USD trừ đi 200 triệu USD cho lợi nhuận 50 triệu USD nhân 0,20), tức là\n15 triệu USD.\nĐầu tư thay thế: tính toán và giải thích khoản đầu tư thay thế trả về cả trước và\nsau phí","qhtml":null},{"n":25,"q":"Management fees are most likely based on assets under management for:","opts":["hedge funds only.","private equity funds only.","both hedge funds and private equity funds."],"ans":"A","expl":"A. Đúng vì các quỹ thường được cấu trúc với phí quản lý thường dao động từ\n1% đến 2% tài sản được quản lý (ví dụ: đối với các quỹ phòng hộ) hoặc vốn cam kết (ví dụ: quỹ cổ phần tư nhân\n), là tổng số tiền mà LP đã cam kết cho các khoản đầu tư\ntrong tương lai của quỹ.\nB. Không chính xác vì các quỹ thường được cấu trúc với phí quản lý thường dao động\ntừ 1% đến 2% tài sản được quản lý (ví dụ: đối với quỹ phòng hộ) hoặc vốn cam kết (ví dụ:\nquỹ cổ phần tư nhân), là tổng số tiền mà LP đã cam kết cho các khoản đầu tư trong tương lai của quỹ.\nC. Không chính xác vì các quỹ thường được cấu trúc với phí quản lý thường dao động\ntừ 1% đến 2% tài sản được quản lý (ví dụ: đối với các quỹ phòng hộ) hoặc vốn cam kết (ví dụ:\nquỹ cổ phần tư nhân), là tổng số tiền mà LP đã cam kết cho các khoản đầu tư trong tương lai\ncủa quỹ.\nĐầu tư thay thế: mô tả quyền sở hữu đầu tư và khoản bồi thường cấu trúc\nthường được sử dụng trong các khoản đầu tư thay thế","qhtml":null},{"n":26,"q":"A leveraged private investment vehicle that employs both long and short positions is most\nlikely a:","opts":["hedge fund.","private equity fund.","venture capital fund."],"ans":"A","expl":"A. Đúng vì các quỹ phòng hộ là phương tiện đầu tư tư nhân quản lý danh mục chứng khoán\nvà/hoặc các vị thế phái sinh bằng nhiều chiến lược khác nhau. Mặc dù các quỹ phòng hộ có thể được\nđầu tư hoàn toàn vào các tài sản truyền thống, những phương tiện này được coi là lựa chọn thay thế vì\ntính chất riêng tư của chúng. Các quỹ phòng hộ thường có nhiều thời gian hơn để theo đuổi các khoản đầu tư và chiến lược\nmang lại tiềm năng lợi nhuận cao hơn, dù là tuyệt đối hay so với một tiêu chuẩn thị trường cụ thể\n, nhưng những chiến lược này có thể làm tăng nguy cơ thua lỗ đầu tư. Chúng có thể liên quan đến các vị thế mua\nvà bán và có thể có đòn bẩy cao. bởi vì các quỹ cổ phần tư nhân thường đầu tư\nvào các công ty, dù là công ty khởi nghiệp hay công ty đã thành lập, được niêm yết trên sàn giao dịch đại chúng, hoặc họ\nđầu tư vào các công ty đại chúng với mục đích biến chúng thành tư nhân.\nB. Không chính xác vì C. Không chính xác vì không sai vì vốn mạo hiểm thường liên quan đến việc đầu tư hoặc cung cấp tài chính\ncho các công ty khởi nghiệp hoặc giai đoạn đầu có tiềm năng tăng trưởng cao, chiếm một phần nhỏ trong\nthị trường vốn cổ phần tư nhân.\nĐầu tư thay thế: mô tả các đặc điểm và danh mục đầu tư thay thế","qhtml":null},{"n":27,"q":"A feature that protects hedge fund clients from paying twice for the same performance is\nmost likely a:","opts":["discount.","hurdle rate.","high-water mark"],"ans":"C","expl":"A. Không chính xác vì các nhà quản lý quỹ phòng hộ có thể giảm phí cho các nhà đầu tư lớn hơn hoặc cho\nđại lý sắp xếp đã giới thiệu những nhà đầu tư này. Tuy nhiên, việc giảm giá không\nbảo vệ khách hàng khỏi phải trả hai lần cho cùng một hiệu suất.\nB. Không chính xác vì thỏa thuận hợp tác thường quy định rằng phí thực hiện\nchỉ thu được sau khi quỹ đạt được lợi nhuận được gọi là tỷ lệ vượt rào. Tỷ lệ vượt rào là\ntỷ suất lợi nhuận tối thiểu, thường là 8%, mà GP phải vượt quá để đạt được hiệu suất\nphí GP thường nhận được 20% tổng lợi nhuận của quỹ đầu tư tư nhân sau khi trừ đi bất kỳ tỷ lệ vượt rào cứng nào\n, trong trường hợp đó GP kiếm được phí trên lợi nhuận hàng năm vượt quá tỷ lệ vượt ngưỡng hoặc không bao gồm\ntỷ lệ vượt rào mềm, trong trong trường hợp đó, phí được tính trên toàn bộ lợi nhuận gộp hàng năm miễn là\nvượt quá ngưỡng đã đặt.\nC. Đúng vì trong các quỹ phòng hộ, việc tính phí cũng tính đến mốc nước cao,\nphản ánh giá trị cao nhất được sử dụng để tính phí khuyến khích. Điểm cao nhất là\ngiá trị cao nhất mà khoản đầu tư quỹ từng đạt được vào ngày kết tinh phí hiệu suất,\nsau khi trừ phí, theo LP riêng lẻ. Điều khoản mức nước cao quy định rằng người quản lý quỹ phòng hộ\nphải phục hồi sự sụt giảm giá trị từ mức nước cao trước khi phí thực hiện có thể được tính\ntrên lợi nhuận mới tạo ra. Việc sử dụng nhãn hiệu cao sẽ bảo vệ khách hàng khỏi phải trả\nhai lần cho cùng một hiệu suất.\nĐầu tư thay thế: mô tả quyền sở hữu đầu tư và cơ cấu bồi thường\nthường được sử dụng trong các khoản đầu tư thay thế","qhtml":null},{"n":28,"q":"A joint venture is an alternative investment structure that is most likely used for:","opts":["infrastructure investment.","private equity investment.","real estate direct investment"],"ans":"C","expl":"A. Không chính xác vì ví dụ: các nhà đầu tư cơ sở hạ tầng thường xuyên tham gia vào các quan hệ đối tác công-tư\n(PPP). là các thỏa thuận giữa khu vực công và khu vực tư nhân để\ntài trợ, xây dựng và vận hành Cơ sở hạ tầng công cộng, chẳng hạn như bệnh viện và đường thu phí.\nB. Không chính xác vì nhiều khoản đầu tư thay thế, chẳng hạn như quỹ phòng hộ và quỹ cổ phần tư nhân, sử dụng\ncấu trúc hợp tác với một đối tác chung quản lý hoạt động kinh doanh và các đối tác hữu hạn\n(nhà đầu tư) sở hữu một phần lợi ích trong quan hệ đối tác. Đúng vì trong đầu tư quỹ bất động sản\n, các nhà đầu tư có thể được phân loại là chủ sở hữu đơn vị và liên doanh là một cấu trúc hợp tác\nphổ biến trong đầu tư trực tiếp vào bất động sản. Đầu tư thay thế mô tả cơ cấu đầu tư\nquyền sở hữu và bồi thường thường được sử dụng trong các khoản đầu tư thay thế\nC. Đúng vì trong đầu tư quỹ bất động sản, các nhà đầu tư có thể được phân loại là chủ sở hữu đơn vị và\nliên doanh là một cấu trúc hợp tác phổ biến trong bất động sản\nĐầu tư thay thế: mô tả quyền sở hữu đầu tư và đầu tư trực tiếp. đền bù\ncấu trúc thường được sử dụng trong các khoản đầu tư thay thế","qhtml":null},{"n":29,"q":"Regarding distribution methods in alternative investments, which of the following is most\nadvantageous to the limited partners? A(n):","opts":["American waterfall.","deal-by-deal waterfall.","whole-of-fund waterfall."],"ans":"C","expl":"A. Không chính xác vì có hai loại thác nước: thác nước theo thỏa thuận (Mỹ) và\nthác nước toàn quỹ (Châu Âu). Thác nước theo thỏa thuận có lợi hơn cho GP\nvì phí hiệu suất được thu trên cơ sở mỗi lần thực hiện, cho phép GP được thanh toán trước khi\nLP nhận được cả khoản đầu tư ban đầu và tỷ suất lợi nhuận ưa thích của họ ( e, tỷ lệ vượt rào)\ntrên toàn bộ quỹ\nB. Không chính xác vì có hai loại thác nước theo thỏa thuận (Mỹ) và\nthác nước ưa thích (Châu Âu). Thác nước theo thỏa thuận có lợi hơn cho GP\nvì phí hiệu suất được thu trên cơ sở mỗi giao dịch, cho phép GP được thanh toán trước khi\nLP nhận được cả khoản đầu tư ban đầu và tỷ lệ hoàn vốn thực tế ưu tiên của họ (tức là tỷ lệ vượt rào)\ntrên toàn bộ quỹ\nC. Đúng vì trong các thác nước toàn Fuhu (Châu Âu), tất cả phân phối đều chuyển đến LP khi các giao dịch\nđược thực hiện và GP không tham gia vào bất kỳ khoản lợi nhuận nào cho đến khi LP nhận được khoản đầu tư\nban đầu của họ và tỷ lệ vượt rào đã được đáp ứng. Ngược lại với thác nước theo thỏa thuận (Mỹ),\nthác nước toàn quỹ xảy ra ở cấp quỹ tổng hợp và có lợi hơn cho\nLPS.\nĐầu tư thay thế: mô tả quyền sở hữu đầu tư và cơ cấu bồi thường\nthường được sử dụng trong các khoản đầu tư thay thế","qhtml":null},{"n":30,"q":"Which of the following hedge fund mechanisms is most likely used to impose a temporary\nrestriction on redemptions if needed?","opts":["Gate","Notice period","Lockup period"],"ans":"A","expl":"A. Đúng vì ngoài thời gian khóa, quỹ đôi khi áp đặt một cổng giới hạn\nhoặc hạn chế việc quy đổi trong một khoảng thời gian.\nB. Không chính xác vì thời gian thông báo tạo cơ hội cho người quản lý quỹ phòng hộ\nthanh lý vị thế một cách có trật tự mà không làm tăng thêm khoản lỗ.\nC. Không chính xác vì khoảng thời gian khóa-khoảng thời gian khi các nhà đầu tư không thể rút vốn-\ncung cấp cho người quản lý quỹ phòng hộ thời gian cần thiết để thực hiện và có khả năng nhận ra kết quả mong đợi của chiến lược\n. Nếu quỹ phòng hộ nhận được yêu cầu rút vốn ngay sau khoản đầu tư\nmới, thời gian khóa sẽ buộc các nhà đầu tư đưa ra yêu cầu ở lại quỹ trong\nmột khoảng thời gian thay vì được phép rút tiền ngay lập tức. Do đó, thời gian khóa\náp đặt các hạn chế đối với việc rút lại từ khi bắt đầu khoản đầu tư mới vào quỹ chứ không phải\nsau này, ví dụ: một thời gian sau khoản đầu tư mới.\nĐầu tư thay thế: mô tả đánh giá hiệu quả của các khoản đầu tư thay thế","qhtml":null},{"n":31,"q":"Which of the following infrastructure investments most likely have the highest risk?","opts":["Brownfield investments with the majority of their return from current yield.","Brownfield investments with the majority of their return from capital appreciation.","Greenfield investments with the majority of their return from capital appreciation."],"ans":"C","expl":"A. Không chính xác vì các quỹ cơ sở hạ tầng có hồ sơ rủi ro thấp hơn đầu tư vào tài sản Brownfield\nvới rủi ro được giảm thiểu và có tỷ trọng cao đối với lợi nhuận hiện tại. Đầu tư vào tài sản cơ sở hạ tầng hiện có\ncó thể được coi là Không chính xác vì các quỹ cơ sở hạ tầng có hồ sơ rủi ro trung bình\nđầu tư vào hầu hết các tài sản ở lĩnh vực nâu (với một số\nB. Không chính xác vì các quỹ cơ sở hạ tầng có hồ sơ rủi ro trung bình đầu tư vào hầu hết các tài sản ở lĩnh vực nâu (với một số yêu cầu về chi tiêu vốn) và có sự kết hợp giữa lợi suất và mức tăng giá vốn\n. Đầu tư vào các tài sản cơ sở hạ tầng hiện có có thể được coi là khoản đầu tư vào lĩnh vực nâu\n. Ngay cả khi khoản đầu tư vào lĩnh vực nâu có phần lớn lợi nhuận thu được từ việc tăng giá vốn\n, thì khoản đầu tư này vẫn ít rủi ro hơn so với đầu tư vào lĩnh vực xanh. đầu tư).\nC. Đúng vì các quỹ cơ sở hạ tầng có hồ sơ rủi ro cao hơn đầu tư vào các dự án Greenfield\nkhông có đảm bảo về nhu cầu khi hoàn thành và có tỷ trọng vốn cao\nđược đánh giá cao. Việc đầu tư vào tài sản cơ sở hạ tầng sắp được xây dựng thường được gọi là\nvì đầu tư vào lĩnh vực xanh là khoản đầu tư ở giai đoạn đầu với hồ sơ\nrủi ro cao hơn.\nĐầu tư thay thế: giải thích đặc điểm đầu tư của đầu tư cơ sở hạ tầng","qhtml":null},{"n":32,"q":"Which of the following methods of investing in alternative investments requires the least\namount of investment expertise?","opts":["Co-investing","Fund investing","Direct investing"],"ans":"B","expl":"A. Không chính xác vì một trong những lợi ích của việc đầu tư vào quỹ là nó mang lại khả năng tiếp cận\nđầu tư thay thế mà không có trình độ chuyên môn đầu tư cao. Mặt khác\nMặt khác, hợp tác đầu tư đòi hỏi sự tham gia tích cực hơn so với đầu tư vào quỹ, có thể\nsẽ là thách thức nếu nguồn lực và kinh nghiệm thẩm định còn hạn chế. Hợp tác đầu tư đòi hỏi nhiều hơn\nsự tham gia tích cực của nhà đầu tư, người phải đánh giá cả cơ hội đầu tư và\nquản lý quỹ, đòi hỏi nhiều nguồn lực, sự tập trung và chuyên môn hơn.\nB. Đúng vì một trong những lợi ích của việc đầu tư vào quỹ là nó mang lại khả năng tiếp cận\nđầu tư thay thế mà không có trình độ chuyên môn đầu tư cao.\nC. Không chính xác vì một trong những lợi ích của việc đầu tư vào quỹ là nó mang lại khả năng tiếp cận\nđầu tư thay thế mà không có trình độ chuyên môn đầu tư cao, trong khi\nđầu tư trực tiếp đòi hỏi nhiều chuyên môn đầu tư hơn và mức độ hiểu biết tài chính cao hơn\nso với đầu tư bằng quỹ và hợp tác đầu tư.\nĐầu tư thay thế: so sánh đầu tư trực tiếp, đồng đầu tư và đầu tư quỹ\nphương pháp đầu tư thay thế","qhtml":null},{"n":33,"q":"The benefits of adding investments in infrastructure assets to a portfolio most likely\ninclude:","opts":["inflation protection only.","low correlation with existing portfolio assets only.","both inflation protection and low correlation with existing portfolio assets."],"ans":"C","expl":"A. Không chính xác vì đầu tư vào cơ sở hạ tầng có thể tạo thêm nguồn thu nhập, tăng tính đa dạng hóa danh mục đầu tư\nbằng cách thêm một loại tài sản có mối tương quan thường thấp với các khoản đầu tư hiện tại,\nvà cung cấp một số biện pháp bảo vệ chống lại lạm phát. Khả năng tiếp xúc thấp với các vấn đề tăng trưởng GDP ngắn hạn\ncũng có thể là một yếu tố.\nB. Không chính xác vì đầu tư vào cơ sở hạ tầng có thể tạo thêm nguồn thu nhập, tăng tính đa dạng hóa danh mục đầu tư\nbằng cách thêm một loại tài sản có mối tương quan thường thấp với các khoản đầu tư hiện tại,\nvà cung cấp một số biện pháp bảo vệ chống lại lạm phát. Khả năng tiếp xúc thấp với các vấn đề tăng trưởng GDP ngắn hạn có thể\ncũng có thể là một yếu tố.\nC. Đúng vì đầu tư vào cơ sở hạ tầng có thể tạo thêm nguồn thu nhập, tăng tính đa dạng hóa danh mục đầu tư\nbằng cách thêm một loại tài sản có mức tương quan thường thấp với các khoản đầu tư hiện tại,\nvà cung cấp một số biện pháp bảo vệ chống lại lạm phát. Mức độ ít gặp phải các vấn đề tăng trưởng GDP ngắn hạn cũng có thể\ncũng là một yếu tố.\nĐầu tư thay thế: giải thích đặc điểm đầu tư của đầu tư cơ sở hạ tầng","qhtml":null},{"n":34,"q":"In co-investing, the investor invests in alternative assets indirectly through a fund but also\nhas the:","opts":["right to invest directly in the same assets alongside the fund.","obligation to invest directly in the same assets alongside the fund.","right to invest in the general partner's fund management company."],"ans":"A","expl":"A. Đúng vì trong đồng đầu tư, nhà đầu tư đầu tư vào tài sản gián tiếp thông qua quỹ nhưng\ncũng có quyền (được gọi là quyền đồng đầu tư) để đầu tư trực tiếp vào cùng một tài sản.\nThông qua đồng đầu tư, nhà đầu tư có thể đầu tư cùng với quỹ khi quỹ\nxác định các giao dịch; nhà đầu tư không bị giới hạn trong việc tham gia giao dịch chỉ bằng cách đầu tư vào quỹ\n.\nB. Không chính xác vì trong đồng đầu tư, nhà đầu tư đầu tư vào tài sản gián tiếp thông qua quỹ\nnhưng cũng có quyền (được gọi là quyền đồng đầu tư) để đầu tư trực tiếp vào cùng một tài sản.\nTuy nhiên, không có nghĩa vụ phải đầu tư\nC. Không chính xác vì trong đồng đầu tư, nhà đầu tư đầu tư vào tài sản gián tiếp thông qua quỹ\nnhưng cũng có quyền (được gọi là quyền đồng đầu tư) để đầu tư trực tiếp vào cùng một tài sản,\nkhông phải vào công ty quản lý quỹ của đối tác chung.\nĐầu tư thay thế: so sánh đầu tư trực tiếp, đồng đầu tư và đầu tư quỹ\ncác phương pháp đầu tư thay thế","qhtml":null},{"n":35,"q":"A disadvantage of direct real estate investing is:","opts":["a lack of control.","unfavorable tax rules.","the time required to manage the property."],"ans":"C","expl":"A. Không chính xác vì đây là lợi ích của đầu tư trực tiếp. Có những lợi ích rõ ràng khi sở hữu trực tiếp\nbất động sản. Kiểm soát: Chỉ chủ sở hữu mới quyết định thời điểm mua hoặc bán, thời điểm và số tiền\nchi tiêu cho các dự án vốn (tuân theo các điều khoản cho thuê và yêu cầu quy định), ai sẽ\nchọn làm người thuê dựa trên ưu tiên về chất lượng tín dụng và sự kết hợp của người thuê cũng như loại điều khoản cho thuê\nđược cung cấp.\nB. Không chính xác vì đây là lợi ích của đầu tư trực tiếp. Lợi ích về thuế: Các nhà đầu tư bất động sản ở nhiều\nthị trường phát triển có thể sử dụng chi phí khấu hao tài sản không dùng tiền mặt và chi phí lãi vay, với\nmột số hạn chế, để giảm thu nhập chịu thuế và giảm hóa đơn thuế thu nhập của họ.\nC. Đúng vì những bất lợi lớn khi đầu tư trực tiếp [vào bất động sản] bao gồm\nthời gian cần thiết để quản lý tài sản. Chủ sở hữu có thể chọn xử lý tất cả các khía cạnh của việc đầu tư\nvào và vận hành tài sản. bao gồm lựa chọn tài sản, quản lý tài sản, quản lý, cho thuê và quản lý tài sản\n.\nĐầu tư thay thế: giải thích các tính năng và đặc điểm của bất động sản","qhtml":null},{"n":36,"q":"Which of the following statements about private debt is most accurate? Mezzanine debt:\nstructure.","opts":["is subordinated to equity in a borrower's capital","is less risky than senior secured debt issued by the same company.","may include additional features such as warrants to provide equity participation to lenders."],"ans":"C","expl":"A. Không chính xác vì trong nợ tư nhân, nợ cấp hai đề cập đến tín dụng tư nhân phụ thuộc\nnợ có bảo đảm cấp cao nhưng cao hơn vốn chủ sở hữu trong cơ cấu vốn của người đi vay.\nB. Không chính xác vì nợ cấp hai có nhiều rủi ro hơn, chứ không ít hơn, so với nợ có bảo đảm cấp cao. Bởi vì\nđược xếp hạng cấp thấp và thực tế là nó thường không có bảo đảm, nợ cấp hai rủi ro hơn\nso với nợ có bảo đảm cấp cao; Để bù đắp cho các nhà đầu tư về hồ sơ rủi ro gia tăng này, các nhà đầu tư\nthường yêu cầu lãi suất cao hơn và có thể yêu cầu các lựa chọn tham gia cổ phần.\nC. Đúng vì nợ cấp hai thường đi kèm với các tính năng bổ sung, chẳng hạn như chứng quyền hoặc\nquyền chuyển đổi, cung cấp quyền tham gia vốn cổ phần cho người cho vay/nhà đầu tư, nghĩa là họ có\ntùy chọn chuyển nợ thành vốn chủ sở hữu hoặc mua vốn chủ sở hữu của\nngười vay cơ bản trong một số trường hợp nhất định.\nĐầu tư thay thế: giải thích các đặc điểm của nợ tư nhân và đặc điểm đầu tư của nó","qhtml":null},{"n":37,"q":"Which of the following statements about private equity performance evaluation is most\naccurate?","opts":["Private equity fund management fees are based on capital called.","Cash flows are frequently described in terms of the J-curve effect.","Managers have no discretion on the timing of the distribution of proceeds."],"ans":"B","expl":"A. Không chính xác vì vốn cổ phần tư nhân bao gồm lời hứa cam kết vốn ban đầu đáng kể,\ntiếp theo là phí ban đầu cao (tính trên tổng vốn cam kết chứ không phải số vốn thực tế\nđược gọi), tiếp theo là xác định các cơ hội tăng trưởng dài hạn hoặc quay vòng và\nlợi nhuận kỳ vọng cuối cùng dương khi nhận ra lợi nhuận so le của quỹ được hiện thực hóa. nói chung\nliên quan đến cam kết vốn ban đầu nhưng khoảng thời gian vốn thực tế. Riêng tư của\nB. Đúng vì dòng đầu tư vốn cổ phần tư nhân thường tụt hậu so với cam kết đó vì 'các lệnh gọi' vốn\n bị so le so với lợi nhuận vốn cổ phần thực chất thường được mô tả dưới dạng hiệu ứng đường cong J-\n.\nC. Không chính xác vì trong một quỹ đầu tư vốn cổ phần tư nhân độc lập, có thời hạn cố định, các quyết định huy động\ntiền, nhận tiền dưới hình thức gọi vốn và phân phối số tiền thu được đều theo quyết định\ncủa người quản lý vốn cổ phần tư nhân. Thời điểm của dòng tiền là một phần quan trọng của quá trình ra quyết định\nđầu tư. Do đó, người quản lý vốn cổ phần tư nhân sẽ được khen thưởng hoặc bị phạt vì\nkết quả của những quyết định về thời điểm đó và việc tính toán IRR là chìa khóa để làm điều đó.\nĐầu tư thay thế: mô tả việc đánh giá hiệu suất của các khoản đầu tư thay thế","qhtml":null},{"n":38,"q":"Which of the following is most likely a primary exit strategy for a company held by a\nprivate equity fund's portfolio?","opts":["IPO","Management buy-in","Management buyout"],"ans":"A","expl":"A. Đúng vì các chiến lược đầu tư cổ phần tư nhân quan trọng bao gồm mua lại bằng đòn bẩy (ví dụ:\nMBOS và MBIS) và vốn mạo hiểm. Các chiến lược rút lui chính bao gồm bán giao dịch, IPO và\ntái cấp vốn.\nB. Không chính xác vì các chiến lược đầu tư cổ phần tư nhân quan trọng bao gồm mua lại bằng đòn bẩy (ví dụ:\nMBOS và MBIS) và vốn mạo hiểm. Các chiến lược rút lui chính bao gồm bán giao dịch, IPO và\ntái cấp vốn.\nC. Không chính xác vì các chiến lược đầu tư cổ phần tư nhân quan trọng bao gồm mua lại bằng đòn bẩy (ví dụ:\nMBOS và MBIS) và vốn mạo hiểm. Các chiến lược rút lui chính bao gồm bán thương mại, IPO và\ntái cấp vốn.\nĐầu tư thay thế: giải thích các đặc điểm của vốn cổ phần tư nhân và đặc điểm đầu tư của nó","qhtml":null},{"n":39,"q":"A hedge fund that seeks to profit from a view on overall market direction as influenced by\neconomic trends best describes a:","opts":["macro hedge fund.","multi-strategy hedge fund.","market-neutral hedge fund."],"ans":"A","expl":"A. Đúng vì các quỹ phòng hộ vĩ mô sử dụng các vị thế mua và bán để thu lợi từ quan điểm về\nhướng chung của thị trường vì nó bị ảnh hưởng bởi các xu hướng và sự kiện kinh tế lớn.\nB. Không chính xác vì quỹ phòng hộ đa chiến lược là ví dụ về chiến lược giá trị tương đối,\ntìm cách kiếm lợi từ sự chênh lệch về giá, mối quan hệ ngắn hạn bất thường, giữa\nchứng khoán liên quan. Kỳ vọng là sự chênh lệch về giá sẽ được giải quyết theo thời gian.\nChiến lược của quỹ phòng hộ đa chiến lược giao dịch giá trị tương đối trong và giữa các loại tài sản hoặc\ncông cụ. Thay vì tập trung vào một loại giao dịch (ví dụ: chênh lệch giá có thể chuyển đổi), một\ncơ sở duy nhất cho giao dịch (ví dụ: biến động) hoặc một loại tài sản cụ thể (ví dụ: thu nhập cố định), chiến lược này\nthay vào đó tìm kiếm các cơ hội đầu tư ở bất cứ nơi nào chúng có thể tồn tại, thường với các nhóm\ncách tiếp cận khác nhau của nhà quản lý.\nC. Không chính xác vì các quỹ phòng hộ trung lập với thị trường sử dụng phân tích định lượng (kỹ thuật) và cơ bản\n để xác định chứng khoán vốn có giá trị thấp và cao. Quỹ phòng hộ nắm giữ các vị thế mua\nđối với những chứng khoán được xác định là bị định giá thấp và các vị thế bán khống đối với những chứng khoán mà nó\nxác định là được định giá quá cao. Quỹ phòng hộ cố gắng duy trì vị thế ròng trung lập\nđối với rủi ro thị trường và các yếu tố rủi ro khác (quy mô, ngành, động lượng, giá trị, v.v.). Lý tưởng nhất là danh mục\ncó beta tổng thể xấp xỉ bằng 0. Mục đích là kiếm lợi từ những biến động\ncủa chứng khoán riêng lẻ trong khi vẫn thờ ơ với rủi ro thị trường.\nĐầu tư thay thế: giải thích các đặc điểm đầu tư của các quỹ phòng hộ và đối chiếu chúng với\ncác loại tài sản khác","qhtml":null},{"n":40,"q":"Which of the following is best categorized as core real estate?","opts":["A high-quality office building in a rural area","A low-quality office building in a major urban center","A high-quality office building in a major urban center"],"ans":"C","expl":"A. Không chính xác vì bất động sản cốt lõi được đặc trưng bởi bất động sản thể chế chất lượng cao, được cho thuê tốt ở những thị trường tốt nhất.\nB. Không chính xác vì bất động sản cốt lõi được đặc trưng bởi bất động sản thể chế chất lượng cao, được cho thuê tốt ở những thị trường tốt nhất.\nC. Đúng vì các quỹ mở thường cung cấp khả năng tiếp cận với bất động sản cốt lõi, đặc trưng bởi\nbất động sản thể chế chất lượng cao, được cho thuê tốt ở các thị trường tốt nhất. Các nhà đầu tư kỳ vọng bất động sản\nbất động sản cốt lõi sẽ mang lại lợi nhuận ổn định, chủ yếu từ thu nhập.\nĐầu tư thay thế: giải thích các tính năng và đặc điểm của bất động sản","qhtml":null},{"n":41,"q":"Compared with fund investing in alternative investments, the co-investing method most\nlikely has:","opts":["lower management fees.","the same level of management fees.","higher management fees."],"ans":"A","expl":"A. Đúng vì một trong những lợi thế của việc hợp tác đầu tư là nó đã giảm phí quản lý\n. Trong hợp tác đầu tư. các nhà đầu tư thường cùng đầu tư một số tiền bổ sung vào cùng một khoản đầu tư đó\nmà không phải trả phí quản lý đối với số vốn họ sử dụng để đầu tư trực tiếp (trong trường hợp này là khoản đầu tư đồng\n).\nB. Không chính xác vì một trong những lợi thế của việc đồng đầu tư là nó đã giảm phí quản lý\nso với phương thức đầu tư quỹ.\nC. Không chính xác vì một trong những lợi thế của việc đồng đầu tư là nó đã giảm\nphí quản lý so với phương pháp đầu tư vào quỹ.\nĐầu tư thay thế: so sánh đầu tư trực tiếp, đồng đầu tư và đầu tư vào quỹ\ncác phương pháp đầu tư thay thế","qhtml":null},{"n":42,"q":"Which of the following is best described as a relative value hedge fund strategy?","opts":["Short biased","Special situations","Convertible bond arbitrage"],"ans":"C","expl":"A. Không chính xác vì các chiến lược phòng ngừa rủi ro vốn cổ phần có thể được coi là danh mục quỹ phòng hộ ban đầu\n. Họ tập trung vào các thị trường vốn cổ phần đại chúng và nắm giữ các vị thế mua và bán cổ phiếu và\nchứng khoán phái sinh vốn chủ sở hữu. Ví dụ về các chiến lược phòng ngừa rủi ro vốn chủ sở hữu bao gồm các chiến lược thiên vị Short\n sau đây. Các chiến lược này sử dụng phân tích định lượng (kỹ thuật) v
