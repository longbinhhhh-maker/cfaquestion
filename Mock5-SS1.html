<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">

<script>
const DATA = [{"n":1,"q":"Regarding ethical standards, which of the following statements is least accurate?","opts":["Ethical conduct goes beyond what is legally required","Good ethical judgment requires minimizing risks, excluding reputational risk","To act ethically, individuals need to be able to think through the facts and make good\nchoices even in the absence of clear laws"],"qhtml":null,"ans":"B","expl":"Good ethical judgment requires minimizing risks, excluding reputational risk"},{"n":2,"q":"According to the recommended procedures for compliance with the Standard relating to additional\ncompensation arrangements, a member should make an immediate written report specifying the\nproposed compensation arrangements:","opts":["only to her supervisor.","only to her supervisor and to her firm's compliance officer.","to her supervisor, to her firm's compliance officer, and to her clients."],"qhtml":null,"ans":"B","expl":"only to her supervisor and to her firm's compliance officer."},{"n":3,"q":"According to the Standards, members are required to disclose conflicts of interest to:","opts":["clients only.","clients and employers only.","clients, employers, and prospective clients."],"qhtml":null,"ans":"C","expl":"clients, employers, and prospective clients."},{"n":4,"q":"A member is required to keep information confidential relating to which of the following?","opts":["Only prospective clients the member met within the last year","Only former clients who left the firm more than seven years ago","Both prospective clients the member met within the last year and former clients who left the\nfirm more than seven years ago"],"qhtml":null,"ans":"C","expl":"Both prospective clients the member met within the last year and former clients who\nleft the firm more than seven years ago"},{"n":5,"q":"Vanraj Shah has just finished taking the Level II CFA exam for the second time. To protect the\nintegrity of the exam, Shah is careful not to discuss the exam questions with other candidates. Shah\ncalls his friend, a member, and contrasts his two attempts by highlighting that there were many\ncalculation questions on derivatives in the first instance and none in the second. Later, in a public\nblog on investment education, Shah shares his strong disagreement regarding CFA Institute shifting\nto computer-based testing. Shah has violated the Standard(s) relating to:","opts":["conduct as participants in CFA Institute programs only.","reference to CFA Institute, the CFA designation, and the CFA program only.","both conduct as participants in CFA Institute programs and reference to CFA Institute, the\nCFA designation, and the CFA program."],"qhtml":null,"ans":"A","expl":"conduct as participants in CFA Institute programs only."},{"n":6,"q":"To be consistent with the Standard relating to communication with clients and prospective clients, a\nmember:","opts":["must share in written form investment recommendations with clients.","should notify clients that additional information is available if a recommendation is shared in\ncapsule form.","is permitted to share investment recommendations solely using a social media service to\nwhich most clients have access."],"qhtml":null,"ans":"B","expl":"should notify clients that additional information is available if a recommendation is\nshared in capsule form."},{"n":7,"q":"Michael Cane, CFA, is an investment manager. Cane's proxy voting policy includes a provision that\nvoting proxies may not be required in all instances if they do not benefit clients. The proxy voting\npolicy is disclosed to his clients only upon request. Has Cane most likely violated the Standard\nrelating to loyalty, prudence and care?","opts":["Yes, only because the voting of proxies is required in all instances","Yes, only because the proxy voting policy is disclosed to his clients only upon request","Yes, both because the voting of proxies is required in all instances and because the proxy\nvoting policy is disclosed to his clients only upon request"],"qhtml":null,"ans":"B","expl":"Yes, only because the proxy voting policy is disclosed to his clients only upon request"},{"n":8,"q":"Which of the following member actions violates the Standard relating to misconduct?\n• Action 1: Declaring personal bankruptcy because of a large loss from investing in a startup\ncompany.\n• Action 2: Allocating for her personal account shares from an oversubscribed IPO that is suitable\nfor her firm's clients","opts":["Action 1 only","Action 2 only","Both Action 1 and Action 2"],"qhtml":null,"ans":"B","expl":"Action 2 only"},{"n":9,"q":"Which of the following is a recommended procedure for compliance with the Standard relating to\nperformance presentation? When presenting their firm's investment performance, members should:","opts":["present the performance using a single representative account.","maintain the data and records used to calculate the performance being presented.","exclude terminated accounts as part of performance history with a clear indication of when\nthe accounts were terminated."],"qhtml":null,"ans":"B","expl":"maintain the data and records used to calculate the performance being presented."},{"n":10,"q":"Marcus Reid, CFA, uses the name \"CFA expert\" when posting comments on social media. During a\nconversation with a friend, Reid mentions, \"I passed all three CFA exams in three consecutive\nyears.\" Has Reid violated the Standards?","opts":["No","Yes, because he uses the name \"CFA expert\" when posting comments on social media","Yes, because he mentions, \"I passed all three CFA exams in three consecutive years\""],"qhtml":null,"ans":"B","expl":"Yes, because he uses the name \"CFA expert\" when posting comments on social\nmedia"},{"n":11,"q":"Firms that claim compliance with the GIPS standards are required to:","opts":["include all fee-paying discretionary accounts in at least one composite.","determine which portfolio to include in a composite immediately after the performance\nreporting period has ended.","exclude the best-performing accounts and the worst-performing accounts when representing\nthe performance of an investment strategy."],"qhtml":null,"ans":"A","expl":"include all fee-paying discretionary accounts in at least one composite."},{"n":12,"q":"Mabel Albright, CFA, resigns to work at a new firm. For her research report at the new firm, she re-creates the supporting records from her memory and uses the historical recommendations she\nmade at her previous firm. Albright violates the Standards:","opts":["only by re-creating the supporting records from her memory.","only by using the historical recommendations at her previous firm.","both by re-creating the supporting records from her memory and by using the historical\nrecommendations at her previous firm."],"qhtml":null,"ans":"C","expl":"both by re-creating the supporting records from her memory and by using the\nhistorical recommendations at her previous firm."},{"n":13,"q":"Cynthia Garcia, CFA, is an investment advisor for Synergy Investment Partners (SIP). Her new\nclient, John Hansen, has inherited a sizeable interest in his family's business. Before reviewing his\nfinancial situation, Garcia recommends Hansen diversify his portfolio by purchasing AAA-rated long-term corporate bonds, which Garcia has recommended to several other clients. She tells Hansen\n\"You have no downside if you hold these bonds to maturity, they are AAA-rated.\" Has Garcia\nviolated the Standards?","opts":["No","Yes, only the Standard relating to suitability","Yes, the Standard relating to suitability and the Standard relating to misrepresentation"],"qhtml":null,"ans":"C","expl":"Yes, the Standard relating to suitability and the Standard relating to\nmisrepresentation"},{"n":14,"q":"Thomas Turkman recently hired Georgia Viggen, CFA, as a portfolio manager for North South Bank.\nAlthough Viggen worked many years for a competitor, West Star Bank, the move was\nstraightforward since she did not have a non-compete agreement with her previous employer. Once\nViggen starts working for Turkman, the first thing she does is to bring a trading software package\nshe developed and used at West Star to her new employer. Using public information, Viggen\ncontacts all of her former clients to convince them to move with her to North South Bank. Viggen\nalso convinces one of the analysts she worked with at West Star to join her at her new employer.\nViggen most likely violated the CFA Institute Code of Ethics and Standards of Professional Conduct\nconcerning her actions involving:","opts":["clients.","the analyst.","trading software."],"qhtml":null,"ans":"C","expl":"trading software."},{"n":15,"q":"David Jacobs, CFA, and Megan Amari, CFA, work for Global Investment Inc. and receive fees for\nclient referrals. Prior to signing service agreements with clients, Jacobs informs his clients about the\nreferral fee arrangement without providing an estimated dollar value. Amari discloses all details of\nthe arrangement, including the estimated dollar value, to her clients only after the service\nagreements are signed. Who has violated the Standards?","opts":["Amari only","Jacobs only","Both Amari and Jacobs"],"qhtml":null,"ans":"C","expl":"Both Amari and Jacobs"},{"n":16,"q":"According to the GIPS standards, a firm must:","opts":["provide a GIPS composite report to all prospective clients.","include terminated composites on the firm's list of composite descriptions for at least seven\nyears after the composite termination date.","attain compliance for a minimum of three years or since firm inception if the firm has been in\nexistence for less than three years to initially claim compliance."],"qhtml":null,"ans":"A","expl":"provide a GIPS composite report to all prospective clients."},{"n":17,"q":"Which of the following actions violate the Standard relating to market manipulation?\n• Action 1: Entering large buy and sell trades between multiple proprietary accounts of the firm with\nthe intent to increase trading volume.\n• Action 2: Securing a dominant position in a financial instrument with an intent to influence the price\nof a related derivative.\n• Action 3: Exploiting perceived market inefficiencies through aggressive trading strategies.","opts":["Action 1 and Action 2 only","Action 1 and Action 3 only","Action 2 and Action 3 only"],"qhtml":null,"ans":"A","expl":"Action 1 and Action 2 only"},{"n":18,"q":"According to the Standards, if a member cannot discharge supervisory responsibilities due to an\ninadequate compliance system, the member is:","opts":["only required to decline in writing to accept supervisory responsibility.","only required to report the inadequate compliance system to CFA Institute.","both required to decline in writing to accept supervisory responsibility and to report the\ninadequate compliance system to CFA Institute."],"qhtml":null,"ans":"A","expl":"only required to decline in writing to accept supervisory responsibility."},{"n":19,"q":"Edo Ronde, CFA, an analyst for a hedge fund, One World Investments, is attending a key industry\nconference for the microelectronics industry. At lunch in a restaurant adjacent to the conference\nvenue, Ronde sits next to a table of conference attendees and is able to read their nametags.\nRonde realizes the group includes the president of a publicly traded company in the\nmicroelectronics industry, Fulda Manufacturing, a company Ronde follows. Ronde overhears the\npresident complain about a production delay problem Fulda's factories are experiencing. The\npresident mentions that the delay will reduce Fulda earnings more than 20% during the next year if\nnot solved. Ronde relays this information to the portfolio manager he reports to at One World\nexplaining that in a recent research report he recommended Fulda as a buy. The manager asks\nRonde to write up a negative report on Fulda so the fund can sell the stock. According to the CFA\nInstitute Code of Ethics and Standards of Professional Conduct, Ronde should least likely:","opts":["revise his research report.","leave his research report as it is.","request the portfolio manager not act on the information."],"qhtml":null,"ans":"A","expl":"revise his research report."},{"n":20,"q":"To be consistent with the Standard relating to diligence and reasonable basis, members who\ndevelop quantitative models should:","opts":["only understand the technical aspects of the products they provide to clients.","only ensure the models incorporate a wide range of possible input expectations.","both understand the technical aspects of the products they provide to clients and ensure the\nmodels incorporate a wide range of possible input expectations."],"qhtml":null,"ans":"C","expl":"both understand the technical aspects of the products they provide to clients and\nensure the models incorporate a wide range of possible input expectations."},{"n":21,"q":"According to the Standard relating to priority of transactions, members should:","opts":["preclear trades in fee-paying family accounts in which the member has no beneficial\nownership.","direct their brokers to supply duplicate copies for all their personal securities transactions to\ntheir employers.","allocate shares to other clients before allocating shares to fee-paying family accounts in\nwhich the members do not have beneficial ownership."],"qhtml":null,"ans":"B","expl":"direct their brokers to supply duplicate copies for all their personal securities\ntransactions to their employers."},{"n":22,"q":"Riti Malhotra, CFA, is a research analyst covering the oil and gas sector. Malhotra visits a covered\ncompany's new oil refining facility. The company arranges a chartered flight as there are no\ncommercial flights serving the location of the new refinery. Meals are also provided by the company\nat a nearby hotel. Malhotra lets the company pay for the expenses. Has Malhotra violated the\nStandards?","opts":["No","Yes, the Standard relating to loyalty, prudence, and care","Yes, the Standard relating to independence and objectivity"],"qhtml":null,"ans":"A","expl":"No"},{"n":23,"q":"Which of the following statements relating to the GIPS standards is accurate?\n• Statement 1: Verification improves the consistency of a firm's GIPS-compliant presentations.\n• Statement 2: Verification provides assurance to clients that specific composite presentations made\nby a firm are accurate.","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"qhtml":null,"ans":"A","expl":"Statement 1 only"},{"n":24,"q":"Tim Herndon, CFA, is a senior analyst working with Brad Welch, CFA, at a large brokerage firm.\nThe two co-author all their research reports. Herndon comes to the belief that Welch is in violation of\nthe Standard relating to diligence and reasonable basis. Herndon discusses his concerns with\nWelch, his supervisor, and the firm's compliance department. All three — Welch, his supervisor, and\nthe compliance department — dismiss his concerns. Which of the following actions should Herndon\nmost likely take to be consistent with the Standards?","opts":["Threaten to leave the firm","Continue discussing the matter with Welch","Have his name removed from further research reports"],"qhtml":null,"ans":"C","expl":"Have his name removed from further research reports"},{"n":25,"q":"According to the GIPS standards, all fee-paying discretionary accounts must be:","opts":["included in at least one composite.","aggregated into composites based on size.","assigned to composites on an ex-post basis."],"qhtml":null,"ans":"A","expl":"included in at least one composite."},{"n":26,"q":"James Fung, CFA, is the CEO of Wholecare Pharmaceutical (WPC). WPC is in its final stages of\nclinical trials for developing a medicine to treat heart disease. Fung posts on social media that WPC\nis launching a new medicine for heart disease, knowing that the news will have a positive impact on\nWPC's stock price. Fung has violated the Standard(s) relating:","opts":["only to misrepresentation.","only to market manipulation.","both to misrepresentation and to market manipulation."],"qhtml":null,"ans":"C","expl":"both to misrepresentation and to market manipulation."},{"n":27,"q":"Heidi Halvorson, CFA, is the Chief Investment Officer for Tukwila Investors, an asset management\nfirm specializing in fixed-income investments. Tukwila is in danger of losing one of its largest clients,\nQuinault Jewelers, which accounts for nearly one third of its revenues. Quinault recently told\nHalverson that Tukwila would be fired unless the performance of Quinault's portfolio improves\nsignificantly. Shortly after this conversation, Halvorson purchases two corporate bonds she believes\nare suitable for any of her clients based upon third party research from a reliable and diligent\nsource. Immediately after the purchase, one bond increases significantly in price while the other\nbond declines significantly. At the end of the day, Halvorson allocates the profitable bond trade to\nQuinault and the other bond to two of her largest institutional accounts. Halvorson most likely\nviolated the CFA Institute Standards of Professional with regards to:","opts":["client suitability.","trade allocations.","third party research."],"qhtml":null,"ans":"B","expl":"trade allocations."},{"n":28,"q":"If inventory is written down:","opts":["inventory turnover will be higher than if the write-down did not occur.","the net profit margin will be higher than if the write-down did not occur.","the interest coverage ratio will be higher than if the write-down did not occur."],"qhtml":null,"ans":"A","expl":"inventory turnover will be higher than if the write-down did not occur."},{"n":29,"q":"Which of the following ratios will most likely increase as a result of an inventory write-down?","opts":["Current ratio","Total asset turnover ratio","Receivables turnover ratio"],"qhtml":null,"ans":"B","expl":"Total asset turnover ratio"},{"n":30,"q":"Which of the following best describes a lin-log model?","opts":["Yi = b0 + b1 ln Xi","ln Yi = b0 + b1 Xi","ln Yi = b0 + b1 ln Xi"],"qhtml":null,"ans":"A","expl":"Yi = b0 + b1 ln Xi"},{"n":31,"q":"An analyst gathers the following information about a company:\nTarget D/E: 0.80 | Current D/E: 0.65 | Yield to maturity: 4% | Cost of equity: 9% | Tax rate: 30%\nThe WACC to be used in financial analysis is closest to:","opts":["6.24%.","6.56%.","6.78%."],"qhtml":null,"ans":"A","expl":"6.24%."},{"n":32,"q":"The returns of a fund are as follows:\nYear 1: −20.60% | Year 2: 15.00% | Year 3: 0.50% | Year 4: 9.80% | Year 5: 4.60%\nThe mean absolute deviation (MAD) of returns for the fund is closest to:","opts":["9.53%.","11.91%.","13.69%."],"qhtml":null,"ans":"A","expl":"9.53%."},{"n":33,"q":"Ignoring income taxes, the recognition of an impairment loss on long-lived assets most likely results\nin a:","opts":["lower quick ratio.","higher total asset turnover ratio.","lower cash flow from operations."],"qhtml":null,"ans":"B","expl":"higher total asset turnover ratio."},{"n":34,"q":"In jackknife resampling:","opts":["the results are similar for every resample.","the required number of repetitions is the same as in bootstrap resampling.","each subsequent resample has one less observation than the previous resample."],"qhtml":null,"ans":"A","expl":"the results are similar for every resample."},{"n":35,"q":"Which of the following methods results in samples that are most representative of desired\nsubgroups in a non-homogenous population?","opts":["Cluster sampling","Simple random sampling","Stratified random sampling"],"qhtml":null,"ans":"C","expl":"Stratified random sampling"},{"n":36,"q":"An analyst gathers the following information about three portfolios:\nPortfolio X: Expected annual return = 10%, Standard deviation = 12%Portfolio Y: Expected annual return = 12%, Standard deviation = 16%\nPortfolio Z: Expected annual return = 14%, Standard deviation = 20%\nIf the shortfall level is 5%, which portfolio has the largest safety-first ratio?","opts":["Portfolio X","Portfolio Y","Portfolio Z"],"qhtml":null,"ans":"C","expl":"Portfolio Z"},{"n":37,"q":"Which of the following ratios is most appropriate for evaluating a company's ability to meet short-term obligations?","opts":["Defensive interval","Financial leverage","Working capital turnover"],"qhtml":null,"ans":"A","expl":"Defensive interval"},{"n":38,"q":"Which of the following is a secondary source of liquidity for a company?","opts":["Trade credit","Bank line of credit","Bankruptcy protection and reorganization"],"qhtml":null,"ans":"C","expl":"Bankruptcy protection and reorganization"},{"n":39,"q":"An analyst gathers the following information about a company:\nCash flow from operating activities: €600,000\nPreferred dividends declared and paid: €30,000\nTotal dividends declared and paid: €120,000\nNumber of common shares outstanding: 100,000\nThe company did not issue or repurchase common shares during the year. If the company reports\ntotal dividends paid as cash flows used in operating activities, cash flow per share is:","opts":["€5.70.","€6.30.","€6.90."],"qhtml":null,"ans":"C","expl":"€6.90."},{"n":40,"q":"Which of the following methods is most appropriate to assess the impact of a geopolitical risk?","opts":["Groupthink","Scenario analysis","Linear quantitative modeling"],"qhtml":null,"ans":"B","expl":"Scenario analysis"},{"n":41,"q":"Credit cycles:","opts":["can amplify business cycles.","are defined as fluctuations in real GDP.","tend to be shorter than business cycles."],"qhtml":null,"ans":"A","expl":"can amplify business cycles."},{"n":42,"q":"An analyst gathers the following information about a company:\nROE: 12% | ROA: 8% | Total asset turnover: 2.0 | Tax burden: 0.4 | Interest burden: 0.8\nPretax margin is:","opts":["10.0%.","12.5%.","15.0%."],"qhtml":null,"ans":"A","expl":"10.0%."},{"n":43,"q":"An analyst gathers the following information about an investment:\nInitial investment amount: $100\nValue at the end of Year 1: $90\nAdditional amount invested at the beginning of Year 2: $10\nValue at the end of Year 2: $110\nThe annualized time-weighted rate of return over the 2-year period is closest to:","opts":["−0.5%.","0.0%.","4.9%."],"qhtml":null,"ans":"A","expl":"−0.5%."},{"n":44,"q":"If a paired comparison test of mean differences supports rejecting the null hypothesis, then the:","opts":["difference in means is not statistically significant.","independence of the samples is statistically significant.","standard error of the mean differences is low relative to the sample mean difference."],"qhtml":null,"ans":"C","expl":"standard error of the mean differences is low relative to the sample mean difference."},{"n":45,"q":"Which of the following statements is most accurate? According to Modigliani-Miller Proposition I\nwithout taxes:","opts":["firm value can be created by changing a company's capital structure.","any increase in the cost of equity must exactly offset the greater use of lower cost debt.","equity holders demand a higher return as leverage increases in order to offset increased\nrisk."],"qhtml":null,"ans":"C","expl":"equity holders demand a higher return as leverage increases in order to offset\nincreased risk."},{"n":46,"q":"In capital investment decisions, project sequencing is most likely a type of:","opts":["timing option.","flexibility option.","fundamental option."],"qhtml":null,"ans":"A","expl":"timing option."},{"n":47,"q":"Under IFRS, reversals of impairments of long-lived assets are allowed:","opts":["for previously recognized impairment losses only.","if the recoverable amount exceeds the previous carrying amount.","for assets held for sale only."],"qhtml":null,"ans":"A","expl":"for previously recognized impairment losses only."},{"n":48,"q":"For a manufacturing company reporting under US GAAP, which of the following is classified as an\noperating activity on the statement of cash flows?","opts":["Dividends paid","Purchase of treasury stock","Purchase of trading securities"],"qhtml":null,"ans":"C","expl":"Purchase of trading securities"},{"n":49,"q":"Which pricing model combines multiple products so that customers are incentivized to buy them\ntogether?","opts":["Bundling","Tiered pricing","Value-based pricing"],"qhtml":null,"ans":"A","expl":"Bundling"},{"n":50,"q":"Which of the following strategies is least likely to be used by shareholder activists?","opts":["Initiating a proxy battle","Implementing a poison pill","Filing a shareholder derivative lawsuit"],"qhtml":null,"ans":"B","expl":"Implementing a poison pill"},{"n":51,"q":"A well-defined supply function is most likely available to:","opts":["a monopolist.","a firm operating in perfect competition.","a firm operating in monopolistic competition."],"qhtml":null,"ans":"B","expl":"a firm operating in perfect competition."},{"n":52,"q":"An analyst gathers the following information about three companies in the same industry but at\ndifferent stages of their life cycles:\nCompany 1: Yr1 Rev=$10M, Yr2 Rev=$11M, Yr3 Rev=$9M, Yr3 Debt/Capital=0%\nCompany 2: Yr1 Rev=$30M, Yr2 Rev=$36M, Yr3 Rev=$44M, Yr3 Debt/Capital=8%\nCompany 3: Yr1 Rev=$100M, Yr2 Rev=$95M, Yr3 Rev=$97M, Yr3 Debt/Capital=25%\nBased only on this information, the company with the greatest capacity to absorb additional\nleverage in Year 4 is most likely:","opts":["Company 1.","Company 2.","Company 3."],"qhtml":null,"ans":"B","expl":"Company 2."},{"n":53,"q":"An analyst gathers the following exchange rate information:\nUSD/EUR spot rate: 1.0351 | 1-week USD/EUR forward points: −1.1\n(USD/EUR is the amount of USD per 1 EUR)The 1-week USD/EUR forward rate is closest to:","opts":["1.02410.","1.03400.","1.03499."],"qhtml":null,"ans":"C","expl":"1.03499."},{"n":54,"q":"A sign of expansionary fiscal policy is a(n):","opts":["increase in indirect taxes.","increase in the budget deficit.","reduction in reserve requirements for banks."],"qhtml":null,"ans":"B","expl":"increase in the budget deficit."},{"n":55,"q":"An investor requiring $10,000 in ten years' time has $7,500 to invest today and has access to the\nfollowing two accounts:\nAccount 1: Stated Annual Interest Rate = 3.0%, Compounding Frequency = Quarterly\nAccount 2: Stated Annual Interest Rate = 2.9%, Compounding Frequency = Daily\nWhich of the accounts will allow the investor to achieve their goal?","opts":["Account 1 only","Account 2 only","Both Account 1 and Account 2"],"qhtml":null,"ans":"C","expl":"Both Account 1 and Account 2"},{"n":56,"q":"Which of the following areas is most likely to apply natural language processing?","opts":["Data encryption","Compliance functions","Analysis of structured data"],"qhtml":null,"ans":"B","expl":"Compliance functions"},{"n":57,"q":"The following 10 observations are a sample drawn from a normal population: 25, 20, 18, −5, 35, 21,\n−11, 8, 20, and 9. The mean of the sample is closest to:","opts":["14.00.","15.56.","17.20."],"qhtml":null,"ans":"A","expl":"14.00."},{"n":58,"q":"The arithmetic and geometric mean are calculated for the same data. If there is variability in the\ndata, compared with the arithmetic mean, the geometric mean will most likely be:","opts":["smaller.","equal.","greater."],"qhtml":null,"ans":"A","expl":"smaller."},{"n":59,"q":"A company's interest payments are fully tax deductible. When tax rates increase, the company’s\ncost of debt:","opts":["decreases.","remains the same.","increases."],"qhtml":null,"ans":"A","expl":"decreases."},{"n":60,"q":"If a company's receivables turnover ratio is equal to its payables turnover ratio, the cash conversion\ncycle is equal to its number of days of:","opts":["payables.","sales outstanding.","inventory on hand."],"qhtml":null,"ans":"C","expl":"inventory on hand."},{"n":61,"q":"In a fixed parity currency regime, excess private demand for the domestic currency:","opts":["implies a depleting stock of foreign exchange reserves.","makes no implication about the country's foreign exchange reserves.","implies a growing stock of foreign exchange reserves."],"qhtml":null,"ans":"C","expl":"implies a growing stock of foreign exchange reserves."},{"n":62,"q":"In a period of rising prices and stable inventory quantities, the value of ending inventory will most\nclosely reflect current replacement value under which of the following inventory valuation methods?","opts":["FIFO","LIFO","Weighted average cost"],"qhtml":null,"ans":"A","expl":"FIFO"},{"n":63,"q":"An analyst gathers the following exchange rate information:\nAUD/USD spot rate: 1.3889 | AUD/USD forward rate: 1.3195\nAUD/EUR spot rate: 1.6393 | AUD/EUR forward rate: 1.4875\n(AUD/USD is the amount of AUD per 1 USD; AUD/EUR is the amount of AUD per 1 EUR)\nThe USD is expected to depreciate against:","opts":["the AUD only.","the EUR only.","both the AUD and the EUR."],"qhtml":null,"ans":"A","expl":"the AUD only."},{"n":64,"q":"All else being equal, an increase in the central bank's policy rate most likely puts downward\npressure on domestic inflation by:","opts":["increasing consumption growth.","improving investors' confidence.","strengthening the country's currency."],"qhtml":null,"ans":"C","expl":"strengthening the country's currency."},{"n":65,"q":"An analyst is reviewing the property, plant, and equipment disclosure related to a company's\nwarehouse. Under the revaluation model, the analyst would least likely be able to determine:","opts":["the original date of acquisition.","how the fair value was obtained.","the carrying amount under the cost model."],"qhtml":null,"ans":"A","expl":"the original date of acquisition."},{"n":66,"q":"A crucial requirement for a central bank to be effective is to:","opts":["maintain reasonable inflation targets.","maintain independence from the government.","preserve the confidentiality of its economic views."],"qhtml":null,"ans":"B","expl":"maintain independence from the government."},{"n":67,"q":"In ESG factor analysis, a company's ownership of stranded assets is most likely considered a(n):","opts":["environmental risk.","social risk.","governance risk."],"qhtml":null,"ans":"A","expl":"environmental risk."},{"n":68,"q":"A company's cash contribution to its defined contribution pension plan is recorded on the company's\nstatement of cash flows as a(n):","opts":["operating cash outflow.","investing cash outflow.","financing cash outflow."],"qhtml":null,"ans":"A","expl":"operating cash outflow."},{"n":69,"q":"An analyst gathers the following common-size income statements for three companies in the same\nindustry (as % of revenue):\nAdministrative expenses: X=20%, Y=20%, Z=20%\nResearch and development: X=0%, Y=5%, Z=30%\nAdvertising expenses: X=5%, Y=15%, Z=10%\nOperating profit: X=10%, Y=10%, Z=10%\nBased on this information, which company is most likely to have a technically superior product?","opts":["Company X","Company Y","Company Z"],"qhtml":null,"ans":"C","expl":"Company Z"},{"n":70,"q":"An analyst gathers the following information about a company's fiscal year beginning on 1st\nJanuary:\nNet income: £1,800,000\nPreferred dividends declared and paid: £600,000\nCommon shares outstanding on 31 December: 300,000Weighted average common shares outstanding during the year: 500,000\nConvertible preferred shares outstanding during the year: 25,000\nIf one preferred share can be converted into four common shares and there are no other potentially\ndilutive securities outstanding, reported diluted EPS should be:","opts":["£2.40.","£3.00.","£4.00."],"qhtml":null,"ans":"A","expl":"£2.40."},{"n":71,"q":"Which of the following best represents the potential for misaligned interests between shareholders\nand board directors when director tenures are excessively long?","opts":["Entrenchment","Empire building","Excessive risk taking"],"qhtml":null,"ans":"A","expl":"Entrenchment"},{"n":72,"q":"Accounts payable are:","opts":["financial liabilities owed by a company through a formal loan agreement.","amounts a company owes its vendors for purchase of goods and services.","reporte ":83,"q":"A company spends €10 million on start-up costs that are expensed for accounting purposes and\nfully amortized over five years using the straight-line method for tax purposes. If the start-up costs\nwill result in future economic benefits, the tax base at the end of Year 1 is:","opts":["€0 million.","€8 million.","€10 million."],"qhtml":null,"ans":"B","expl":"€8 million."},{"n":84,"q":"Which of the following lists of terms is ordered from thinner to fatter tails compared with a normal\ndistribution?","opts":["Mesokurtic, leptokurtic, platykurtic","Platykurtic, mesokurtic, leptokurtic","Leptokurtic, mesokurtic, platykurtic"],"qhtml":null,"ans":"B","expl":"Platykurtic, mesokurtic, leptokurtic"},{"n":85,"q":"The archetype of country behavior most likely characterized by globalization and cooperation is:","opts":["hegemony.","bilateralism.","multilateralism."],"qhtml":null,"ans":"C","expl":"multilateralism."},{"n":86,"q":"With respect to a Porter's five forces analysis, which of the following best describes government\npolicies?","opts":["They are viewed as a sixth force","They are ignored because they affect all companies in the industry","They are analyzed to understand how they affect the five competitive forces"],"qhtml":null,"ans":"C","expl":"They are analyzed to understand how they affect the five competitive forces"},{"n":87,"q":"An analyst gathers the following information (in $ millions) about a company:\nAverage total assets: 50\nAverage total liabilities: 30\nThe financial leverage ratio is:","opts":["0.6.","1.5.","2.5."],"qhtml":null,"ans":"C","expl":"2.5."},{"n":88,"q":"A primary aim of fiscal policy is to manage the economy through its influence on:","opts":["real GDP.","price stability.","interest rates."],"qhtml":null,"ans":"A","expl":"real GDP."},{"n":89,"q":"An analyst gathers the following information about a company:\nBefore-tax cost of debt: 5% | Marginal tax rate: 30% | Cost of equity: 8% | Target debt-to-equity\nratio: 50%\nThe company's WACC is equal to:","opts":["5.75%.","6.50%.","7.00%."],"qhtml":null,"ans":"B","expl":"6.50%."},{"n":90,"q":"If the relationship between the dependent variable and independent variable is linear, regression\nresiduals when plotted against the independent value should appear to:","opts":["be linear.","be random.","follow a pattern."],"qhtml":null,"ans":"B","expl":"be random."}];
const CFG = {"title":"Premium Mock 5 (2026) — Session 1","subtitle":"CFA Level I · Premium 2026 · 90 câu · 2h15p","minutes":135,"passMark":70,"hasAnswers":true,"hasExpl":true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}

  if(!CFG.hasAnswers){

    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;

  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;

    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));

    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
