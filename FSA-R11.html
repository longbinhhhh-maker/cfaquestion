<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
  /* two-column question table */
  .q-cols-header{display:flex;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .q-cols-header span{flex:1;text-align:center;padding:9px 14px;font-weight:700;
    color:var(--accent2);font-size:13.5px;background:var(--panel2)}
  .q-cols-header span+span{border-left:1px solid var(--line)}
  .opt[data-cols="2"]{display:flex;align-items:stretch;padding:0;overflow:hidden;gap:0}
  .opt[data-cols="2"] .lead{display:flex;align-items:center;padding:10px 12px;
    border-right:1px solid var(--line);white-space:nowrap}
  .opt[data-cols="2"] .opt-col{flex:1;padding:10px 14px;text-align:center;font-size:14.5px;line-height:1.4}
  .opt[data-cols="2"] .opt-col+.opt-col{border-left:1px solid var(--line)}
  html[data-theme="light"] .q-cols-header{border-color:var(--line)}
  html[data-theme="light"] .q-cols-header span{background:var(--panel2)}
  html[data-theme="light"] .opt[data-cols="2"] .lead,
  html[data-theme="light"] .opt[data-cols="2"] .opt-col{border-color:var(--line)}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

<script>
const DATA = [{"n":1,"q":"If the quick ratio is equal to 2.0, a decrease in inventory and an equal decrease in accounts\npayable will:","opts":["leave the quick ratio unchanged.","decrease the quick ratio.","increase the quick ratio."],"ans":"C","expl":"Tử số của hệ số thanh toán nhanh là tiền mặt cộng với chứng khoán có thể bán được cộng với các tài khoản phải thu và\nmẫu số là nợ ngắn hạn. Tử số không bị ảnh hưởng bởi sự thay đổi trong\nhàng tồn kho, trong khi mẫu số giảm khi số dư nợ phải trả giảm, do đó\ntỷ lệ nhanh sẽ tăng.\n(Mô-đun 37.2, LOS 37.b)"},{"n":2,"q":"Regarding the use of financial ratios in the analysis of a firm's financial statements, it is most\naccurate to say that:","opts":["variations in accounting treatments have little effect on financial ratios.","a range of target values for a ratio may be more appropriate than a single target value.","many financial ratios are useful in isolation."],"ans":"B","expl":"Một phạm vi giá trị mục tiêu cho một tỷ lệ tài chính có thể phù hợp hơn một mục tiêu số\nduy nhất. Các tỷ số tài chính không hữu ích khi xem xét một cách riêng lẻ và chỉ có giá trị\nkhi so sánh với các số liệu lịch sử hoặc các công ty ngang hàng. Việc so sánh tỷ lệ giữa các công ty có thể\nphức tạp do sự khác nhau trong cách xử lý kế toán được sử dụng ở mỗi công ty.\n(Mô-đun 37.1, LOS 37.a)"},{"n":3,"q":"With other variables remaining constant, if a firm's asset turnover increases, its return on\nequity:","opts":["may increase, decrease, or remain the same.","will increase.","will decrease."],"ans":"B","expl":"Phân tích DuPont (ROE = tỷ suất lợi nhuận ròng × vòng quay tài sản × tỷ lệ đòn bẩy)\ncho thấy ROE sẽ tăng nếu vòng quay tài sản tăng, giả định tỷ suất lợi nhuận ròng và\nđòn bẩy không thay đổi.\n(Học ​​phần 37.4, LOS 37.d)"},{"n":4,"q":"What type of ratio is revenue divided by average working capital and what type of ratio is\naverage total assets divided by average total equity?","opts":["Activity ratio | Liquidity ratio","Profitability ratio | Solvency ratio","Activity ratio | Solvency ratio"],"ans":"C","expl":"Doanh thu chia cho vốn lưu động trung bình, còn được gọi là tỷ lệ vòng quay vốn lưu động\n, là một tỷ lệ hoạt động. Tổng tài sản trung bình chia cho tổng vốn chủ sở hữu trung bình, còn được gọi là\nlà tỷ lệ đòn bẩy tài chính, là tỷ lệ khả năng thanh toán.\n(Mô-đun 37.2, LOS 37.b)","cols":["working capital","Average total equity"],"qhtml":"<p>What type of ratio is revenue divided by average working capital and what type of ratio is average total assets divided by average total equity?</p><p><em>Options show → <strong>Revenue / Average Working Capital</strong> | <strong>Average Total Assets / Average Total Equity</strong></em></p>"},{"n":5,"q":"In the year 20X4, a company had a net profit margin of 18%, total asset turnover of 1.75, and\na financial leverage multiplier of 1.5. If the company's net profit margin declines to 10% in\n20X5, what total asset turnover would be needed in order to maintain the same return on\nequity as in 20X4, assuming there is no change in the financial leverage multiplier?","opts":["1.85.","3.15.","2.50."],"ans":"B","expl":"ROE trong 20X4 là 0,18 × 1,75 × 1,5 = 0,4725.\nNếu ROE cho 20X5 không thay đổi so với 20X4 thì:\n0,10 × vòng quay tài sản × 1,5 = 0,4725\n Vòng quay tài sản = 3,15.\n(Mô-đun 37.4, LOS 37.d)"},{"n":6,"q":"Given the following income statement:\nNet Sales200\nCost of Goods Sold55\nGross Profit145\nOperating Expenses30\nOperating Profit (EBIT)115\nInterest15\nEarnings Before Taxes (EBT)100\nTaxes40\nEarnings After Taxes (EAT)60\nWhat are the interest coverage ratio and the net profit margin?","opts":["7.67 | 0.30","0.57 | 0.56","2.63 | 0.30"],"ans":"A","expl":"Tỷ lệ đảm bảo lãi vay = (EBIT / chi phí lãi vay) = (115 / 15) = 7,67\nBiên lợi nhuận ròng = (thu nhập ròng / doanh thu thuần) = (60 / 200) = 0,30\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>Given the following income statement:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Net Sales</td><td>200</td></tr><tr><td>Cost of Goods Sold</td><td>55</td></tr><tr><td>Gross Profit</td><td>145</td></tr><tr><td>Operating Expenses</td><td>30</td></tr><tr><td>Operating Profit (EBIT)</td><td>115</td></tr><tr><td>Interest</td><td>15</td></tr><tr><td>Earnings Before Taxes (EBT)</td><td>100</td></tr><tr><td>Taxes</td><td>40</td></tr><tr><td>Earnings After Taxes (EAT)</td><td>60</td></tr></tbody></table><p>What are the interest coverage ratio and the net profit margin?</p><p><em>Options show → <strong>Interest Coverage Ratio</strong> | <strong>Net Profit Margin</strong></em></p>"},{"n":7,"q":"The difference between the current ratio and the quick ratio is that the quick ratio excludes:","opts":["non-current assets.","inventory.","marketable securities."],"ans":"B","expl":"Tỷ lệ hiện tại = tài sản ngắn hạn / nợ ngắn hạn\nTỷ lệ nhanh = (tài sản lưu động – hàng tồn kho) / nợ ngắn hạn\nChứng khoán có thể bán được được bao gồm trong số tài sản lưu động ở cả hai tỷ lệ. Cả tỷ lệ\nđều không tính đến tài sản dài hạn.\n(Mô-đun 37.2, LOS 37.b)"},{"n":8,"q":"Calculating the coefficient of variation for operating income for two firms in the same\nindustry is most likely a helpful measure for an analyst trying to compare:","opts":["financial risk.","credit risk.","business risk."],"ans":"C","expl":"CV điều hành thu nhập = độ lệch chuẩn của thu nhập hoạt động / thu nhập hoạt động trung bình\n. Việc so sánh các hệ số biến thiên giữa các công ty cùng ngành có thể hỗ trợ nhà phân tích đánh giá\ncả mức độ tương đối và tuyệt đối của rủi ro kinh doanh mà một công ty phải đối mặt trong việc tạo ra thu nhập.\nRủi ro tín dụng là rủi ro liên quan đến tổn thất xuất phát từ việc người đi vay không thể\nthanh toán lãi hoặc gốc. Rủi ro tài chính xem xét cấu trúc vốn của một công ty\n, cấu trúc này không được tính vào thu nhập hoạt động.\n(Mô-đun 37.5, LOS 37.e)"},{"n":9,"q":"A firm has average days of receivables outstanding of 22 compared to an industry average of\n29 days. An analyst would most likely conclude that the firm:","opts":["has better credit controls than its peer companies.","has a lower cash conversion cycle than its peer companies.","may have credit policies that are too strict."],"ans":"C","expl":"Số ngày phải thu trung bình của công ty phải gần với mức trung bình của ngành.\nsố ngày phải thu trung bình thấp hơn đáng kể so với các công ty cùng ngành, là một\ndấu hiệu cho thấy chính sách tín dụng của công ty có thể quá nghiêm ngặt và doanh số bán hàng đang bị mất vào tay\ncác công ty cùng ngành vì điều này. Chúng tôi không thể cho rằng các biện pháp kiểm soát tín dụng chặt chẽ hơn mức trung bình của ngành\nlà \"tốt hơn\". Chúng tôi không thể kết luận rằng doanh số bán hàng tín dụng ít hơn, chúng có thể nhiều hơn,\nnhưng chỉ được thực hiện theo các điều khoản chặt chẽ hơn. Số ngày trung bình của các khoản phải thu chỉ là một thành phần\ncủa chu kỳ chuyển đổi tiền mặt.\n(Mô-đun 37.3, LOS 37.c)"},{"n":10,"q":"Selected financial information gathered from the Matador Corporation follows:\n200720062005\nAverage debt$792,000$800,000$820,000\nAverage equity$215,000$294,000$364,000\nReturn on assets5.9%6.6%7.2%\nQuick ratio0.30.50.6\nSales$1,650,000$1,452,000$1,304,000\nCost of goods sold$1,345,000$1,176,000$1,043,000\nUsing only the data presented, which of the following statements is most correct?","opts":["Gross profit margin has improved.","Leverage has declined.","Return on equity has improved."],"ans":"C","expl":"Đòn bẩy tăng khi được đo bằng tỷ lệ nợ trên vốn chủ sở hữu từ 2,25 năm 2005 lên 3,68 vào\n2007. Tỷ suất lợi nhuận gộp giảm từ 20,0% năm 2005 xuống 18,5% năm 2007. Tỷ suất lợi nhuận trên vốn chủ sở hữu\nđã được cải thiện kể từ năm 2005. Một thước đo ROE là ROA × đòn bẩy tài chính. Đòn bẩy tài chính\n(tài sản / vốn chủ sở hữu) có thể được tính bằng cách thêm 1 vào tỷ lệ nợ trên vốn chủ sở hữu. Năm 2005,\nROE là 23,4% [7,2% ROA × (1 + 2,25 nợ trên vốn chủ sở hữu)]. Năm 2007, ROE là 27,6% [5,9% ROA ×\n(1 + 3,68 nợ trên vốn chủ sở hữu)].\n(Module 37.3, LOS 37.c)","qhtml":"<p>Selected financial information gathered from the Matador Corporation follows:</p><table class=\"qtable\"><thead><tr><th></th><th>2007</th><th>2006</th><th>2005</th></tr></thead><tbody><tr><td>Average debt</td><td>$792,000</td><td>$800,000</td><td>$820,000</td></tr><tr><td>Average equity</td><td>$215,000</td><td>$294,000</td><td>$364,000</td></tr><tr><td>Return on assets</td><td>5.9%</td><td>6.6%</td><td>7.2%</td></tr><tr><td>Quick ratio</td><td>0.3</td><td>0.5</td><td>0.6</td></tr><tr><td>Sales</td><td>$1,650,000</td><td>$1,452,000</td><td>$1,304,000</td></tr><tr><td>Cost of goods sold</td><td>$1,345,000</td><td>$1,176,000</td><td>$1,043,000</td></tr></tbody></table><p>Using only the data presented, which of the following statements is most correct?</p>"},{"n":11,"q":"Wells Incorporated reported the following common size data for the year ended December\n31, 20X7:\nIncome Statement%\nSales100.0\nCost of goods sold58.2\nOperating expenses30.2\nInterest expense0.7\nIncome tax5.7\nNet income5.2\nBalance sheet%%\nCash4.8Accounts payable15.0\nAccounts receivable14.9Accrued liabilities13.8\nInventory49.4Long-term debt23.2\nNet fixed assets30.9Common equity48.0\nTotal assets100.00Total liabilities & equity100.0\nFor 20X6, Wells reported sales of $183,100,000 and for 20X7, sales of $215,600,000. At the\nend of 20X6, Wells' total assets were $75,900,000 and common equity was $37,800,000. At\nthe end of 20X7, total assets were $95,300,000. Calculate Wells' current ratio and return on\nequity ratio for 20X7.","opts":["2.4 | 24.5%","2.4 | 26.8%","4.6 | 25.2%"],"ans":"B","expl":"Tỷ lệ hiện tại bằng 2,4 [(4,8% tiền mặt + 14,9% tài khoản phải thu + 49,4%\nhàng tồn kho) / (15,0% tài khoản phải trả + 13,8% nợ phải trả)]. Tỷ lệ này có thể được\ntính toán từ bảng cân đối quy mô thông thường vì tỷ lệ phần trăm đều dựa trên\ncùng một số tiền cơ bản (tổng).\nLợi nhuận trên vốn chủ sở hữu bằng thu nhập ròng chia cho tổng vốn chủ sở hữu trung bình. Vì tỷ lệ này\nkết hợp một mục trong báo cáo thu nhập và một mục trong bảng cân đối kế toán, nên cần phải chuyển đổi\nđầu vào có quy mô chung sang đô la. Thu nhập ròng là $11.211.200 ($215.600.000 × 5,2%) và\nvốn chủ sở hữu trung bình là $41.772.000 [($95.300.000 × 48,0%) + $37.800.000] / 2. Do đó, ROE năm 2007 là\n26,8% ($11.211.200 thu nhập ròng / $41.772.000 vốn chủ sở hữu trung bình).\n(Học phần 37.2, LOS 37.b)","qhtml":"<p>Wells Incorporated reported the following common size data for the year ended December</p><p>31, 20X7:</p><p>Income Statement (%)</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Sales</td><td>100.0</td></tr><tr><td>Cost of goods sold</td><td>58.2</td></tr><tr><td>Operating expenses</td><td>30.2</td></tr><tr><td>Interest expense</td><td>0.7</td></tr><tr><td>Income tax</td><td>5.7</td></tr><tr><td>Net income</td><td>5.2</td></tr></tbody></table><p>Balance sheet (%)</p><table class=\"qtable\"><thead><tr><th>Assets</th><th>%</th><th>Liabilities &amp; Equity</th><th>%</th></tr></thead><tbody><tr><td>Cash</td><td>4.8</td><td>Accounts payable</td><td>15.0</td></tr><tr><td>Accounts receivable</td><td>14.9</td><td>Accrued liabilities</td><td>13.8</td></tr><tr><td>Inventory</td><td>49.4</td><td>Long-term debt</td><td>23.2</td></tr><tr><td>Net fixed assets</td><td>30.9</td><td>Common equity</td><td>48.0</td></tr><tr><td>Total assets</td><td>100.00</td><td>Total liabilities &amp; equity</td><td>100.0</td></tr></tbody></table><p>For 20X6, Wells reported sales of $183,100,000 and for 20X7, sales of $215,600,000. At the</p><p>end of 20X6, Wells' total assets were $75,900,000 and common equity was $37,800,000. At</p><p>the end of 20X7, total assets were $95,300,000. Calculate Wells' current ratio and return on</p><p>equity ratio for 20X7.</p><p><em>Options show → <strong>Current ratio</strong> | <strong>Return on equity</strong></em></p>"},{"n":12,"q":"Summit Co. has provided the following information for its most recent reporting period:\nBeginning FiguresEnding FiguresAverage Figures\nSales$ 5,000,000\nEBIT$ 800,000\nInterest Expense$ 160,000\nTaxes$ 256,000\nAssets$ 3,500,000$ 4,000,000$ 3,750,000\nEquity$ 1,700,000$ 2,000,000$ 1,850,000\nWhat is Summit Co.'s total asset turnover and return on equity?","opts":["1.25 | 20.8%","1.33 | 15.8%","1.33 | 20.8%"],"ans":"C","expl":"Tổng doanh thu tài sản = doanh thu / tài sản trung bình = 5.000.000 / 3.750.000 = 1,33\nLợi nhuận trên vốn chủ sở hữu = ròng thu nhập / vốn chủ sở hữu trung bình\nThu nhập ròng = EBIT – lãi – thuế = 800.000 – 160.000 – 256.000 = 384.000\nROE = 384.000 / 1.850.000 = 20,8%\n(Học phần 37.4, LOS 37.d)","qhtml":"<p>Summit Co. has provided the following information for its most recent reporting period:</p><table class=\"qtable\"><thead><tr><th></th><th>Beginning Figures</th><th>Ending Figures</th><th>Average Figures</th></tr></thead><tbody><tr><td>Sales</td><td>–</td><td>$5,000,000</td><td>–</td></tr><tr><td>EBIT</td><td>–</td><td>$800,000</td><td>–</td></tr><tr><td>Interest Expense</td><td>–</td><td>$160,000</td><td>–</td></tr><tr><td>Taxes</td><td>–</td><td>$256,000</td><td>–</td></tr><tr><td>Assets</td><td>$3,500,000</td><td>$4,000,000</td><td>$3,750,000</td></tr><tr><td>Equity</td><td>$1,700,000</td><td>$2,000,000</td><td>$1,850,000</td></tr></tbody></table><p>What is Summit Co.'s total asset turnover and return on equity?</p><p><em>Options show → <strong>Total Asset Turnover</strong> | <strong>Return on Equity</strong></em></p>"},{"n":13,"q":"To calculate the cash ratio, the total of cash and marketable securities is divided by:","opts":["total liabilities.","current liabilities.","total assets."],"ans":"B","expl":"Nợ ngắn hạn được sử dụng làm mẫu số cho: tỷ lệ hiện tại, tỷ lệ nhanh và tiền mặt.\n(Học phần 37.2, LOS 37.b)"},{"n":14,"q":"Which of the following reasons is least likely a valid limitation of ratio analysis?","opts":["It is difficult to find comparable industry ratios.","Determining the target or comparison value for a ratio is difficult.","Calculation of ratios involves a large degree of subjectivity."],"ans":"C","expl":"Không có nhiều tính chủ quan liên quan đến việc tính toán tỷ lệ. Ví dụ: các công thức\ncơ học để tính toán khá chuẩn và khách quan đối với hoạt động, tính thanh khoản,\nkhả năng thanh toán và tỷ lệ lợi nhuận. Mặt khác, việc xác định\nmục tiêu hoặc giá trị so sánh cho một tỷ lệ là rất khó vì nó yêu cầu một số phạm vi giá trị có thể chấp nhận được\nvà điều đó đưa ra yếu tố chủ quan. Không thể đưa ra kết luận từ việc xem\nmột tập hợp tỷ lệ vì tất cả các tỷ lệ phải được xem xét tương đối với nhau để đưa ra\nkết luận có ý nghĩa. Có thể khó tìm được các tỷ lệ ngành có thể so sánh được, đặc biệt là\nkhi phân tích các công ty hoạt động trong nhiều ngành.\n(Mô-đun 37.1, LOS 37.a)"},{"n":15,"q":"The following data pertains to a company's common-size financial statements.\nCurrent assets40%\nTotal debt40%\nNet income16%\nTotal assets$2,000\nSales$1,500\nTotal asset turnover ratio0.75\nThe firm has no preferred stock in its capital structure.\nThe company's after-tax return on common equity is closest to:","opts":["20%.","15%.","25%."],"ans":"A","expl":"0,16(1.500)\nthu nhập ròng\nROE===0,20 hoặc 20%\nvốn chủ sở hữu\n(1−0,40)(2.000)\nNếu tỷ lệ nợ (TD/TA) bằng 40% và công ty không có cổ phiếu ưu đãi thì\ntỷ lệ vốn chủ sở hữu là 1 − 0,40 hoặc 60%. (Mô-đun 37.2, LOS 37.b)","qhtml":"<p>The following data pertains to a company's common-size financial statements.</p><table class=\"qtable\"><tbody><tr><td>Current assets</td><td>40%</td></tr><tr><td>Total debt</td><td>40%</td></tr><tr><td>Net income</td><td>16%</td></tr><tr><td>Total assets</td><td>$2,000</td></tr><tr><td>Sales</td><td>$1,500</td></tr><tr><td>Total asset turnover ratio</td><td>0.75</td></tr></tbody></table><p>The firm has no preferred stock in its capital structure. The company's after-tax return on common equity is closest to:</p>"},{"n":16,"q":"As of December 31, 2007, Manhattan Corporation had a quick ratio of 2.0, current assets of\n$15 million, trade payables of $2.5 million, and receivables of $3 million, and inventory of $6\nmillion. How much were Manhattan's current liabilities?","opts":["$12.0 million.","$4.5 million.","$7.5 million."],"ans":"B","expl":"Tài sản ngắn hạn của Manhattan tương đương 9 triệu USD (15 triệu USD tài sản hiện tại – 6 triệu USD)\nhàng tồn kho). Với tỷ lệ thanh toán nhanh là 2,0, tài sản nhanh gấp đôi khoản nợ ngắn hạn. Như vậy,\nkhoản nợ hiện tại phải là 4,5 triệu USD (9 triệu USD tài sản nhanh / tỷ lệ thanh toán nhanh 2,0).\n(Học ​​phần 37.2, LOS 37.b)"},{"n":17,"q":"Given the following income statement and balance sheet for a company:\nBalance Sheet\nAssetsYear 2003Year 2004\nCash500450\nAccounts Receivable600660\nInventory500550\nTotal CA16001660\nPlant, prop. equip10001250\nTotal Assets26002910\nLiabilities\nAccounts Payable500550\nLong term debt7001102\nTotal liabilities12001652\nEquity\nCommon Stock400538\nRetained Earnings1000720\nTotal Liabilities & Equity26002910\nIncome Statement\nSales3000\nCost of Goods Sold(1000)\nGross Profit2000\nSG&A500\nInterest Expense151\nEBT1349\nTaxes (30%)405\nNet Income944\nWhat is the quick ratio for 2004?","opts":["0.331.","3.018.","2.018."],"ans":"C","expl":"Tỷ lệ nhanh = (tiền mặt + chứng khoán thị trường + các khoản phải thu) / CL = (450 + 0 + 660) / 550 =\n2.018\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>Given the following income statement and balance sheet for a company:</p><p><strong>Balance Sheet</strong></p><table class=\"qtable\"><thead><tr><th></th><th>Year 2003</th><th>Year 2004</th></tr></thead><tbody><tr><td><strong>Assets</strong></td><td></td><td></td></tr><tr><td>Cash</td><td>500</td><td>450</td></tr><tr><td>Accounts Receivable</td><td>600</td><td>660</td></tr><tr><td>Inventory</td><td>500</td><td>550</td></tr><tr><td>Total CA</td><td>1,600</td><td>1,660</td></tr><tr><td>Plant, prop. equip</td><td>1,000</td><td>1,250</td></tr><tr><td>Total Assets</td><td>2,600</td><td>2,910</td></tr><tr><td><strong>Liabilities</strong></td><td></td><td></td></tr><tr><td>Accounts Payable</td><td>500</td><td>550</td></tr><tr><td>Long term debt</td><td>700</td><td>1,102</td></tr><tr><td>Total liabilities</td><td>1,200</td><td>1,652</td></tr><tr><td><strong>Equity</strong></td><td></td><td></td></tr><tr><td>Common Stock</td><td>400</td><td>538</td></tr><tr><td>Retained Earnings</td><td>1,000</td><td>720</td></tr><tr><td>Total Liabilities & Equity</td><td>2,600</td><td>2,910</td></tr></tbody></table><p><strong>Income Statement</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>3,000</td></tr><tr><td>Cost of Goods Sold</td><td>(1,000)</td></tr><tr><td>Gross Profit</td><td>2,000</td></tr><tr><td>SG&A</td><td>500</td></tr><tr><td>Interest Expense</td><td>151</td></tr><tr><td>EBT</td><td>1,349</td></tr><tr><td>Taxes (30%)</td><td>405</td></tr><tr><td>Net Income</td><td>944</td></tr></tbody></table><p>What is the quick ratio for 2004?</p>"},{"n":18,"q":"An analyst has gathered the following information about a company:\nBalance Sheet\nAssets\nCash100\nAccounts Receivable750\nMarketable Securities300\nInventory850\nProperty, Plant & Equip900\nAccumulated Depreciation(150)\nTotal Assets2750\nLiabilities and Equity\nAccounts Payable300\nShort-Term Debt130\nLong-Term Debt700\nCommon Stock1000\nRetained Earnings620\nTotal Liab. and Stockholder's equity2750\nIncome Statement\nSales1500\nCOGS1100\nGross Profit400\nSG&A150\nOperating Profit250\nInterest Expense25\nTaxes75\nNet Income150\nDetermine the current ratio and the cash ratio.","opts":["2.67 | 1.07","1.98 | 1.86","4.65 | 0.93"],"ans":"C","expl":"Tỷ lệ hiện tại = [100(tiền mặt) + 750(tài khoản phải thu)+ 300(chứng khoán có thể bán được) +\n850(hàng tồn kho)] / [300(AP) + 130(nợ ngắn hạn)] = (2000 / 430) = 4,65\nTỷ lệ tiền mặt = [100(tiền mặt) + 300(chứng khoán có thể bán được)] / [300(AP) + 130(nợ ngắn hạn)] =\n(400 / 430) = 0,93\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>An analyst has gathered the following information about a company:</p><p><strong>Balance Sheet</strong></p><table class=\"qtable\"><thead><tr><th>Assets</th><th></th></tr></thead><tbody><tr><td>Cash</td><td>100</td></tr><tr><td>Accounts Receivable</td><td>750</td></tr><tr><td>Marketable Securities</td><td>300</td></tr><tr><td>Inventory</td><td>850</td></tr><tr><td>Property, Plant & Equip</td><td>900</td></tr><tr><td>Accumulated Depreciation</td><td>(150)</td></tr><tr><td><strong>Total Assets</strong></td><td><strong>2,750</strong></td></tr></tbody></table><table class=\"qtable\"><thead><tr><th>Liabilities and Equity</th><th></th></tr></thead><tbody><tr><td>Accounts Payable</td><td>300</td></tr><tr><td>Short-Term Debt</td><td>130</td></tr><tr><td>Long-Term Debt</td><td>700</td></tr><tr><td>Common Stock</td><td>1,000</td></tr><tr><td>Retained Earnings</td><td>620</td></tr><tr><td><strong>Total Liab. and Equity</strong></td><td><strong>2,750</strong></td></tr></tbody></table><p><strong>Income Statement</strong></p><table class=\"qtable\"><thead><tr><th>Item</th><th></th></tr></thead><tbody><tr><td>Sales</td><td>1,500</td></tr><tr><td>COGS</td><td>1,100</td></tr><tr><td>Gross Profit</td><td>400</td></tr><tr><td>SG&A</td><td>150</td></tr><tr><td>Operating Profit</td><td>250</td></tr><tr><td>Interest Expense</td><td>25</td></tr><tr><td>Taxes</td><td>75</td></tr><tr><td>Net Income</td><td>150</td></tr></tbody></table><p>Determine the current ratio and the cash ratio.</p><p><em>Options show → <strong>Current Ratio</strong> | <strong>Cash Ratio</strong></em></p>"},{"n":19,"q":"An analyst is comparing two firms and calculates several coefficients of variation (CVs). How\nshould these results be interpreted?\nFirm PFirm Q\nCV sales0.20.7\nCV operating income0.80.8\nCV net income0.40.8","opts":["Firm P has steadier sales than Firm Q.","Firm P’s and Firm Q’s operating costs have the same level of volatility.","Firm P has a lower net income than Firm Q."],"ans":"A","expl":"CV là thước đo tương đối về tính biến thiên hoặc rủi ro, dựa trên dựa trên độ lệch chuẩn, được tính\nlà độ lệch chuẩn của một mặt hàng/giá trị trung bình của một mặt hàng (ví dụ: độ lệch chuẩn của\ndoanh số/doanh số trung bình). Con số cao hơn cho thấy độ biến thiên cao hơn. CV không cung cấp\nthông tin về quy mô thực tế của một công ty; do đó, chúng tôi không thể kết luận liệu Công ty P\ncó thu nhập ròng thấp hơn Công ty Q. Vì Công ty P có doanh số CV thấp hơn, điều này cho thấy doanh số bán hàng\nổn định hơn. Hãng P và Q có cùng thu nhập hoạt động CV; tuy nhiên, do doanh số bán hàng của Công ty P\nổn định hơn, điều này cho thấy chi phí hoạt động của công ty này phải biến động nhiều hơn.\n(Module 37.5, LOS 37.e)"},{"n":20,"q":"An analyst has gathered the following information about a company:\nBalance Sheet\nAssets\nCash100\nAccounts Receivable750\nMarketable Securities300\nInventory850\nProperty, Plant & Equip900\nAccumulated Depreciation(150)\nTotal Assets2750\nLiabilities and Equity\nAccounts Payable300\nShort-Term Debt130\nLong-Term Debt700\nCommon Stock1000\nRetained Earnings620\nTotal Liab. and Stockholder's equity2750\nIncome Statement\nSales1500\nCOGS1100\nGross Profit400\nSG&A150\nOperating Profit250\nInterest Expense25\nTaxes75\nNet Income150\nWhat is the inventory turnover ratio?","opts":["0.77.","1.29.","1.59."],"ans":"B","expl":"Vòng quay hàng tồn kho = 1.100(COGS) / 850(hàng tồn kho) = 1,29\n(Mô-đun 37.2, LOS 37.b)"},{"n":21,"q":"Ratio analysis is most useful for comparing companies:","opts":["in different industries that use the same accounting standards.","of different size in the same industry.","that operate in multiple lines of business."],"ans":"B","expl":"Phân tích tỷ lệ là một cách hữu ích để so sánh các công ty có hoạt động tương tự nhưng\nkhác nhau về quy mô. Tỷ lệ của các công ty hoạt động trong các ngành khác nhau thường không thể so sánh trực tiếp\n. Đối với các công ty hoạt động trong một số ngành, việc phân tích tỷ lệ\nbị hạn chế do khó xác định điểm chuẩn phù hợp của ngành.\n(Mô-đun 37.1, LOS 37.a)"},{"n":22,"q":"The cash conversion cycle is the:","opts":["sum of the time it takes to sell inventory and collect on accounts receivable, less the time it takes to pay for credit purchases.","sum of the time it takes to sell inventory and the time it takes to collect accounts receivable.","length of time it takes to sell inventory."],"ans":"A","expl":"Chu kỳ chuyển đổi tiền mặt = (thời gian thu nợ trung bình) + (hàng tồn kho trung bình\nthời gian xử lý) – (thời gian thanh toán các khoản phải trả)\n(Mô-đun 37.2, LOS 37.b)"},{"n":23,"q":"Eagle Manufacturing Company reported the following selected financial information for\n2007:\nAccounts payable turnover5.0\nCost of goods sold$30 million\nAverage inventory$3 million\nAverage receivables$8 million\nTotal liabilities$35 million\nInterest expense$2 million\nCash conversion cycle13.5 days\nAssuming 365 days in the calendar year, calculate Eagle's sales for the year.","opts":["$52.3 million.","$58.4 million.","$57.8 million."],"ans":"B","expl":"Thiết lập công thức chu kỳ chuyển đổi tiền mặt và giải biến còn thiếu, doanh số. Số ngày trong\ncác khoản phải trả bằng 73 [365 / 5 vòng quay tài khoản phải trả]. Số ngày tồn kho bằng\n36,5 [365 / ($30 triệu COGS / $3 triệu khoảng không quảng cáo trung bình)]. Với chu kỳ chuyển đổi tiền mặt\n, số ngày tồn kho và số ngày phải trả, hãy tính số ngày phải thu là 50 [13,5 ngày\nchu kỳ chuyển đổi tiền mặt + 73 ngày phải trả – 36,5 ngày tồn kho]. Với số ngày trong\ncác khoản phải thu là 50 và các khoản phải thu trung bình là 8 triệu USD, doanh thu là 58,4 triệu USD [(8 triệu USD\ncác khoản phải thu trung bình / 50 ngày) × 365].\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>Eagle Manufacturing Company reported the following selected financial information for 2007:</p><table class=\"qtable\"><tbody><tr><td>Accounts payable turnover</td><td>5.0</td></tr><tr><td>Cost of goods sold</td><td>$30 million</td></tr><tr><td>Average inventory</td><td>$3 million</td></tr><tr><td>Average receivables</td><td>$8 million</td></tr><tr><td>Total liabilities</td><td>$35 million</td></tr><tr><td>Interest expense</td><td>$2 million</td></tr><tr><td>Cash conversion cycle</td><td>13.5 days</td></tr></tbody></table><p>Assuming 365 days in the calendar year, calculate Eagle's sales for the year.</p>"},{"n":24,"q":"A company has a cash conversion cycle of 80 days. If the company's average receivables\nturnover increases from 11 to 12, the company's cash conversion cycle:","opts":["decreases by approximately 1 day.","decreases by approximately 3 days.","increases by approximately 3 days."],"ans":"B","expl":"Chu kỳ chuyển đổi tiền mặt (CCC) = số ngày bán hàng + số ngày tồn kho –\nsố ngày phải trả. Số ngày bán hàng tồn đọng = 365 / vòng quay khoản phải thu = 365 /\n11 = 33,18; 365/12 = 30,42. Điều này có nghĩa là CCC giảm 2,76 ngày. (Mô-đun 37.2,\nLOS 37.b)"},{"n":25,"q":"What would be the impact on a firm's return on assets ratio (ROA) of the following\nindependent transactions, assuming ROA is less than one?\nTransaction #1 – A firm owned investment securities that were classified as available-for-sale\nand there was a recent decrease in the fair value of these securities.\nTransaction #2 – A firm owned investment securities that were classified as trading\nsecurities and there was recent increase in the fair value of the securities.","opts":["Higher | Higher","Higher | Lower","Lower | Higher"],"ans":"A","expl":"Chứng khoán sẵn sàng để bán được báo cáo trên bảng cân đối kế toán theo giá trị hợp lý và bất kỳ\nlãi và lỗ chưa thực hiện nào bỏ qua báo cáo thu nhập và được báo cáo dưới dạng\nđiều chỉnh theo vốn chủ sở hữu. Do đó, việc giảm giá trị hợp lý sẽ dẫn đến tỷ lệ ROA cao hơn (tài sản\nthấp hơn). Chứng khoán kinh doanh cũng được trình bày trên bảng cân đối kế toán theo giá trị hợp lý; tuy nhiên,\nlãi và lỗ chưa thực hiện được ghi nhận trong báo cáo kết quả hoạt động kinh doanh. Do đó, việc\ntăng giá trị hợp lý sẽ dẫn đến ROA cao hơn. Trong trường hợp này, cả tử số và\nmẫu số đều cao hơn; tuy nhiên, vì tỷ lệ nhỏ hơn một nên phần trăm thay đổi\ncủa tử số lớn hơn phần trăm thay đổi của mẫu số, do đó tỷ lệ\nsẽ tăng lên.\n(Mô-đun 37.2, LOS 37.b)","cols":["Transaction #1","Transaction #2"]},{"n":26,"q":"The traditional DuPont equation decomposes return on equity as:","opts":["net income/assets × sales/equity × assets/sales.","EBIT/sales × sales/assets × assets/equity × (1 – tax rate).","net income/sales × sales/assets × assets/equity."],"ans":"C","expl":"Phân tách ROE gồm ba phần truyền thống của DuPont là tỷ suất lợi nhuận × doanh thu tài sản\n× đòn bẩy tài chính. Mặc dù ROE cũng có thể được phân tách thành thu nhập ròng/tài sản ×\ndoanh thu/vốn chủ sở hữu × tài sản/doanh thu, nhưng đây không phải là phương trình DuPont.\n(Mô-đun 37.4, LOS 37.d)"},{"n":27,"q":"Which of the following ratios is most likely useful for an analyst comparing two retail\ncompanies?","opts":["Sales per square foot.","Sales per employee.","Growth in same-store sales."],"ans":"A","expl":"Doanh số trên mỗi foot vuông thường được sử dụng trong ngành bán lẻ và sẽ đóng vai trò là một phép so sánh\ntốt. Mặc dù mức tăng trưởng về doanh số bán hàng tại cùng một cửa hàng có thể hữu ích khi so sánh\ncác địa điểm khác nhau của một công ty qua từng năm (vì nó không bao gồm bất kỳ địa điểm mới nào), nhưng điều này sẽ không hữu ích\ncho các so sánh bên ngoài. Doanh số trên mỗi nhân viên thường được sử dụng trong các công ty dựa trên dịch vụ hoặc\ntư vấn thay vì bán lẻ.\n(Mô-đun 37.5, LOS 37.e)"},{"n":28,"q":"Goldstar Manufacturing has an accounts receivable turnover of 10.5 times, an inventory\nturnover of 4 times, and payables turnover of 8 times. What is Goldstar's cash conversion\ncycle?","opts":["171.64 days.","6.50 days.","80.38 days."],"ans":"C","expl":"Chu kỳ chuyển đổi tiền mặt = thời gian thu nợ trung bình + thời gian xử lý hàng tồn kho trung bình\n – thời gian thanh toán các khoản phải trả. Kỳ thu tiền bình quân =\n365 / vòng quay khoản phải thu bình quân hoặc 365 / 10,5 = 34,76. Khoảng thời gian xử lý hàng tồn kho trung bình\n = 365 / vòng quay hàng tồn kho hoặc 365/4 = 91,25. Kỳ thanh toán các khoản phải trả = 365 /\nTỷ lệ vòng quay các khoản phải trả = 365/8 = 45,63. Tổng hợp tất cả lại: chu kỳ chuyển đổi tiền mặt =\n34,76 + 91,25 – 45,63 = 80,38.\n(Mô-đun 37.2, LOS 37.b)"},{"n":29,"q":"A firm's financial statements reflect the following:\nCurrent liabilities$4,000,000\nCash$400,000\nInventory$1,200,000\nAccounts receivable$800,000\nShort-term investments$2,000,000\nLong-term investments$800,000\nAccounts payable$2,500,000\nWhat are the firm's current ratio, quick ratio, and cash ratio?","opts":["0.8 | 0.6 | 1.1","1.1 | 0.6 | 0.8","1.1 | 0.8 | 0.6"],"ans":"C","expl":"Tỷ lệ hiện tại = (0,4 + 2,0 + 0,8 + 1,2) / 4,0 = 1,1.\nTỷ lệ nhanh = (0,4 + 2,0 + 0,8) / 4,0 = 0,8.\nTỷ lệ tiền mặt = (0,4 + 2,0) / 4,0 = 0,6.\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>A firm's financial statements reflect the following:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Amount</th></tr></thead><tbody><tr><td>Current liabilities</td><td>$4,000,000</td></tr><tr><td>Cash</td><td>$400,000</td></tr><tr><td>Inventory</td><td>$1,200,000</td></tr><tr><td>Accounts receivable</td><td>$800,000</td></tr><tr><td>Short-term investments</td><td>$2,000,000</td></tr><tr><td>Long-term investments</td><td>$800,000</td></tr><tr><td>Accounts payable</td><td>$2,500,000</td></tr></tbody></table><p>What are the firm's current ratio, quick ratio, and cash ratio?</p><p><em>Options show → <strong>Current Ratio</strong> | <strong>Quick Ratio</strong> | <strong>Cash Ratio</strong></em></p>"},{"n":30,"q":"Comparative income statements for E Company and G Company for the year ended\nDecember 31 show the following (in $ millions):\nE CompanyG Company\nSales7090\nCost of Goods Sold(30)(40)\nGross Profit4050\nSales and Administration(5)(15)\nDepreciation(5)(10)\nOperating Profit3025\nInterest Expense(20)(5)\nEarnings Before Taxes1020\nIncome Taxes(4)(8)\nEarnings after Taxes612\nThe financial risk of E Company, as measured by the interest coverage ratio, is:","opts":["higher than G Company's because its interest coverage ratio is less than G Company's, but at least one-third of G Company's.","higher than G Company's because its interest coverage ratio is less than one-third of G Company's.","lower than G Company's because its interest coverage ratio is at least three times G Company's."],"ans":"B","expl":"Tỷ lệ thanh toán lãi vay của Công ty E (EBIT / chi phí lãi vay) là (30/20) = 1,5.\nTỷ lệ thanh toán lãi suất của Công ty G là (25/5) = 5.0. Bảo hiểm lãi suất cao hơn có nghĩa là\nkhả năng thanh toán lãi suất và tiền thuê bắt buộc cao hơn. Lưu ý rằng 1,5 / 5,0 = 0,30,\ncó nghĩa là mức bảo hiểm lãi suất của Công ty E nhỏ hơn 1/3 của Công ty G.\n(Module 37.3, LOS 37.c)"},{"n":31,"q":"How would the collection of accounts receivable most likely affect the current and cash\nratios?","opts":["Increase | Increase","No effect | Increase","No effect | No effect"],"ans":"B","expl":"Việc thu các khoản phải thu làm tăng tiền mặt và giảm các khoản phải thu. Do đó, tài sản\nhiện tại không thay đổi và tỷ lệ hiện tại không bị ảnh hưởng. Vì tử số của\ntỷ lệ tiền mặt chỉ bao gồm tiền mặt và chứng khoán có thể bán được nên việc thu các khoản phải thu\nlàm tăng tỷ lệ tiền mặt.\n(Mô-đun 37.2, LOS 37.b)","cols":["Current ratio","Cash ratio"]},{"n":32,"q":"Which of the following ratios is a component of the original (three-part) DuPont equation?","opts":["Debt-to-equity ratio.","Gross profit margin.","Asset turnover."],"ans":"C","expl":"Phương pháp tiếp cận ba phần của DuPont như sau: tỷ suất lợi nhuận ròng × doanh thu tài sản ×\ntỷ lệ đòn bẩy, trong đó tỷ lệ đòn bẩy là tài sản trên vốn chủ sở hữu. (Học ​​phần 37.4, LOS 37.d)"},{"n":33,"q":"A company has better liquidity than its peer group if its:","opts":["quick ratio is lower.","average trade payables are lower.","receivables turnover is higher."],"ans":"C","expl":"Vòng quay khoản phải thu cao hơn là một chỉ báo về tính thanh khoản của khoản phải thu tốt hơn vì khoản phải thu\nđược chuyển đổi thành tiền mặt nhanh hơn. Tỷ lệ thanh toán nhanh thấp hơn là dấu hiệu cho thấy tính thanh khoản kém hơn.\nCác khoản phải trả thương mại thấp hơn có thể liên quan đến tính thanh khoản tốt hơn, nhưng cũng có thể nhất quán với\nthanh khoản rất kém và yêu cầu thanh toán bằng tiền mặt từ các nhà cung cấp của nó.\n(Mô-đun 37.3, LOS 37.c)"},{"n":34,"q":"Given the following income statement and balance sheet for a company:\nBalance Sheet\nAssetsYear 2003Year 2004\nCash500450\nAccounts Receivable600660\nInventory500550\nTotal CA13001660\nPlant, prop. equip10001250\nTotal Assets26002910\nLiabilities\nAccounts Payable500550\nLong term debt700700\nTotal liabilities12001652\nEquity\nCommon Stock400400\nRetained Earnings12601260\nTotal Liabilities & Equity26002910\nIncome Statement\nSales3000\nCost of Goods Sold(1000)\nGross Profit2000\nSG&A500\nInterest Expense151\nEBT1349\nTaxes (30%)405\nNet Income944\nWhat is the operating profit margin?","opts":["0.50.","0.67.","0.45."],"ans":"A","expl":"Biên lợi nhuận hoạt động = (EBIT / doanh thu) = (1.500 / 3.000) = 0,5\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>Given the following income statement and balance sheet for a company:</p><p><strong>Balance Sheet</strong></p><table class=\"qtable\"><thead><tr><th></th><th>Year 2003</th><th>Year 2004</th></tr></thead><tbody><tr><td><strong>Assets</strong></td><td></td><td></td></tr><tr><td>Cash</td><td>500</td><td>450</td></tr><tr><td>Accounts Receivable</td><td>600</td><td>660</td></tr><tr><td>Inventory</td><td>500</td><td>550</td></tr><tr><td>Total CA</td><td>1,300</td><td>1,660</td></tr><tr><td>Plant, prop. equip</td><td>1,000</td><td>1,250</td></tr><tr><td>Total Assets</td><td>2,600</td><td>2,910</td></tr><tr><td><strong>Liabilities</strong></td><td></td><td></td></tr><tr><td>Accounts Payable</td><td>500</td><td>550</td></tr><tr><td>Long term debt</td><td>700</td><td>700</td></tr><tr><td>Total liabilities</td><td>1,200</td><td>1,652</td></tr><tr><td><strong>Equity</strong></td><td></td><td></td></tr><tr><td>Common Stock</td><td>400</td><td>400</td></tr><tr><td>Retained Earnings</td><td>1,260</td><td>1,260</td></tr><tr><td>Total Liabilities & Equity</td><td>2,600</td><td>2,910</td></tr></tbody></table><p><strong>Income Statement</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>3,000</td></tr><tr><td>Cost of Goods Sold</td><td>(1,000)</td></tr><tr><td>Gross Profit</td><td>2,000</td></tr><tr><td>SG&A</td><td>500</td></tr><tr><td>Interest Expense</td><td>151</td></tr><tr><td>EBT</td><td>1,349</td></tr><tr><td>Taxes (30%)</td><td>405</td></tr><tr><td>Net Income</td><td>944</td></tr></tbody></table><p>What is the operating profit margin?</p>"},{"n":35,"q":"Which ratio is used to measure a company's internal liquidity?","opts":["Interest coverage.","Current ratio.","Total asset turnover."],"ans":"B","expl":"Tổng vòng quay tài sản đo lường hiệu quả hoạt động và khả năng trả lãi vay đo lường\nrủi ro tài chính của công ty.\n(Module 37.2, LOS 37.b)"},{"n":36,"q":"Income Statements for Royal, Inc. for the years ended December 31, 20X0 and December 31,\n20X1 were as follows (in $ millions):\n20X020X1\nSales7882\nCost of Goods Sold(47)(48)\nGross Profit3134\nSales and Administration(13)(14)\nOperating Profit (EBIT)1820\nInterest Expense(6)(10)\nEarnings Before Taxes1210\nIncome Taxes(5)(4)\nEarnings after Taxes76\nAnalysis of these statements for trends in operating profitability reveals that, with respect to\nRoyal's gross profit margin and net profit margin:","opts":["gross profit margin increased in 20X1 but net profit margin decreased.","both gross profit margin and net profit margin increased in 20X1.","gross profit margin decreased but net profit margin increased in 20X1."],"ans":"A","expl":"Biên lợi nhuận gộp (lợi nhuận gộp / doanh thu) của Royal cao hơn trong năm 20X1 (34 / 82 = 41,5%) so với\ntrong 20X0 (31 / 78 = 39,7%), nhưng tỷ suất lợi nhuận ròng (thu nhập sau thuế / doanh thu) đã giảm từ\n7 / 78 = 9,0% trong 20X0 xuống 6 / 82 = 7,3% trong 20X1.\n(Học phần 37.3, LOS 37.c)","qhtml":"<p>Income Statements for Royal, Inc. for the years ended December 31, 20X0 and December 31, 20X1 were as follows (in $ millions):</p><table class=\"qtable\"><thead><tr><th></th><th>20X0</th><th>20X1</th></tr></thead><tbody><tr><td>Sales</td><td>78</td><td>82</td></tr><tr><td>Cost of Goods Sold</td><td>(47)</td><td>(48)</td></tr><tr><td>Gross Profit</td><td>31</td><td>34</td></tr><tr><td>Sales and Administration</td><td>(13)</td><td>(14)</td></tr><tr><td>Operating Profit (EBIT)</td><td>18</td><td>20</td></tr><tr><td>Interest Expense</td><td>(6)</td><td>(10)</td></tr><tr><td>Earnings Before Taxes</td><td>12</td><td>10</td></tr><tr><td>Income Taxes</td><td>(5)</td><td>(4)</td></tr><tr><td>Earnings after Taxes</td><td>7</td><td>6</td></tr></tbody></table><p>Analysis of these statements for trends in operating profitability reveals that, with respect to Royal's gross profit margin and net profit margin:</p>"},{"n":37,"q":"An analyst has gathered the following information about a firm:\nNet sales of $500,000.\nCost of goods sold = $250,000.\nEBIT of $150,000.\nEAT of $90,000.\nWhat is this firm's operating profit margin?","opts":["18%.","30%.","50%."],"ans":"B","expl":"Biên lợi nhuận hoạt động = (EBIT / doanh thu thuần) = ($150.000 / $500.000) = 30%\n(Mô-đun 37.2, LOS 37.b)"},{"n":38,"q":"Which of the following is a measure of a firm's liquidity?","opts":["Current Ratio.","Net Profit Margin.","Equity Turnover."],"ans":"A","expl":"Tỷ lệ hiện tại là thước đo tính thanh khoản. Vòng quay vốn chủ sở hữu và tỷ suất lợi nhuận ròng được sử dụng\nchủ yếu làm thước đo hiệu suất hoạt động của công ty.\n(Mô-đun 37.2, LOS 37.b)"},{"n":39,"q":"If a company has a net profit margin of 5%, an asset turnover ratio of 2.5 and a ROE of 18%,\nwhat is the equity multiplier?","opts":["0.69.","1.44.","2.25."],"ans":"B","expl":"Có nhiều cách khác nhau để minh họa ROE, một trong số đó là:\nROE = (biên lợi nhuận ròng)(doanh thu tài sản)(hệ số vốn chủ sở hữu)\n0,18 = (0,05)(2,5)(hệ số vốn chủ sở hữu)\n0,18 ÷ [(0,05)(2,5)] = hệ số nhân vốn chủ sở hữu\n0,18 0,125 = hệ số nhân vốn chủ sở hữu\n0,18 0,125 = 1,44\n(Mô-đun 37.4, LOS 37.d)"},{"n":40,"q":"Which of the following ratios is NOT part of the original DuPont system?","opts":["Asset turnover.","Debt to total capital.","Equity multiplier."],"ans":"B","expl":"Tỷ lệ nợ trên tổng vốn không phải là một phần của hệ thống DuPont ban đầu. Đòn bẩy của công ty\nđược tính thông qua hệ số nhân vốn chủ sở hữu.\n(Mô-đun 37.4, LOS 37.d)"},{"n":41,"q":"Paragon Company's operating profits are $100,000, interest expense is $25,000, and\nearnings before taxes are $75,000. What is Paragon's interest coverage ratio?","opts":["1 time.","3 times.","4 times."],"ans":"C","expl":"ICR = lợi nhuận hoạt động ` I = EBIT ` I = 100.000 ` 25000 = 4\n(Mô-đun 37.2, LOS 37.b)"},{"n":42,"q":"What is the net income of a firm that has a return on equity of 12%, a leverage ratio of 1.5,\nan asset turnover of 2, and revenue of $1 million?","opts":["$36,000.","$360,000.","$40,000."],"ans":"C","expl":"Hệ thống DuPont truyền thống được đưa ra dưới dạng:\nROE = (tỷ suất lợi nhuận ròng)(doanh thu tài sản)(đòn bẩy tỷ lệ)\nGiải tỷ suất lợi nhuận ròng mang lại:\n0,12 = (biên lợi nhuận ròng) × (2) × (1,5)\n0,04 = (biên lợi nhuận ròng)\nNhận thấy rằng tỷ suất lợi nhuận ròng bằng thu nhập ròng / doanh thu, chúng ta có thể thay thế\nmối quan hệ đó vào phương trình trên và giải ra giá trị ròng thu nhập:\n0,04 = thu nhập ròng / doanh thu = thu nhập ròng / 1.000.000 USD\n40.000 USD = thu nhập ròng.\n(Mô-đun 37.4, LOS 37.d)"},{"n":43,"q":"McQueen Corporation prepared the following common-size income statement for the year\nended December 31, 20X7:\nSales100%\nCost of goods sold60%\nGross profit40%\nFor 20X7, McQueen sold 250 million units at a sales price of $1 each. For 20X8, McQueen has\ndecided to reduce its sales price by 10%. McQueen believes the price cut will double unit\nsales. The cost of each unit sold is expected to remain the same. Calculate the change in\nMcQueen's expected gross profit for 20X8 assuming the price cut doubles sales.","opts":["$150 million increase.","$50 million increase.","$80 million increase."],"ans":"B","expl":"Lợi nhuận gộp 20X7 bằng 100 triệu USD (1 × 250 triệu USD bán được × 40% lợi nhuận gộp\nlợi nhuận). Việc giảm giá 10% xuống còn 0,90 USD sẽ làm tăng giá vốn hàng bán lên 67% doanh thu [COGS\n= 0,6($1) = 0,60 USD; 0,60 USD / 0,90 USD = 67%.]. Kết quả là lợi nhuận gộp sẽ giảm xuống còn 33% trên doanh thu\n. Nếu doanh số bán hàng tăng gấp đôi vào năm 20X8, lợi nhuận gộp sẽ bằng 150 triệu USD (0,90 × 500 triệu\nđơn vị × tỷ suất lợi nhuận gộp 33%). Do đó, lợi nhuận gộp sẽ tăng 50 triệu USD (150 triệu USD\ntriệu lợi nhuận gộp 20X8 – 100 triệu USD lợi nhuận gộp 20X7).\n(Mô-đun 37.5, LOS 37.f)","qhtml":"<p>McQueen Corporation prepared the following common-size income statement for the year ended December 31, 20X7:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>20X7</th></tr></thead><tbody><tr><td>Sales</td><td>100%</td></tr><tr><td>Cost of goods sold</td><td>60%</td></tr><tr><td>Gross profit</td><td>40%</td></tr></tbody></table><p>For 20X7, McQueen sold 250 million units at a sales price of $1 each. For 20X8, McQueen has decided to reduce its sales price by 10%. McQueen believes the price cut will double unit sales. The cost of each unit sold is expected to remain the same. Calculate the change in McQueen's expected gross profit for 20X8 assuming the price cut doubles sales.</p>"},{"n":44,"q":"Which of the following is least likely a routinely used operating profitability ratio?","opts":["Net income/net sales.","Gross profit/net sales.","Sales/Total Assets."],"ans":"C","expl":"Doanh số/Tổng tài sản hoặc Tổng doanh thu tài sản là thước đo hiệu quả hoạt động, không phải\nlợi nhuận hoạt động.\n(Module 37.2, LOS 37.b)"},{"n":45,"q":"An analyst has collected the following data about a firm:\nReceivables turnover = 10 times.\nInventory turnover = 8 times.\nPayables turnover = 12 times.\nThe firm's cash conversion cycle is closest to:","opts":["82 days.","134 days.","52 days."],"ans":"C","expl":"Số ngày bán hàng tồn đọng = 365 / 10 = 36,5 ngày\nSố ngày hàng tồn kho trong kho = 365 / 8 = 45,6 ngày\nSố ngày phải trả = 365 / 12 = 30,4 ngày\nChu kỳ chuyển đổi tiền mặt = 36,5 + 45,6 – 30,4 = 51,7 ngày\n(Mô-đun 37.2, LOS 37.b)"},{"n":46,"q":"An analyst is most likely to calculate companies' net interest margin when evaluating:","opts":["banks.","subscription services.","property and casualty insurance companies."],"ans":"A","expl":"Biên lãi ròng (thu nhập lãi / tài sản sinh lãi) là tỷ lệ thường được sử dụng để\nphân tích các tổ chức cho vay.\n(Module 37.5, LOS 37.e)"},{"n":47,"q":"In preparing a forecast of future financial performance, which of the following best describes\nsensitivity analysis and scenario analysis, respectively?\nDescription #1 – A computer generated analysis based on developing probability\ndistributions of key variables that are used to drive the potential outcomes.\nDescription #2 – The process of analyzing the impact of future events by considering\nmultiple key variables.\nDescription #3 – A technique whereby key financial variables are changed one at a time and\na range of possible outcomes are observed. Also known as \"what-if\" analysis.","opts":["Description #3 | Description #1","Description #2 | Description #3","Description #3 | Description #2"],"ans":"C","expl":"Phân tích độ nhạy phát triển nhiều kết quả có thể xảy ra khi các đầu vào cụ thể được thay đổi\nmỗi lần một. Phân tích độ nhạy còn được gọi là phân tích \"nếu-thì\". Phân tích kịch bản\ndựa trên một tập hợp kết quả cụ thể cho nhiều biến. Phân tích do máy tính tạo ra,\ndựa trên việc phát triển phân bố xác suất của các biến chính, được gọi là phân tích mô phỏng\n.\n(Mô-đun 37.5, LOS 37.f)","qhtml":"<p>In preparing a forecast of future financial performance, which of the following best describes sensitivity analysis and scenario analysis, respectively?</p><table class=\"qtable\"><thead><tr><th>#</th><th>Description</th></tr></thead><tbody><tr><td>1</td><td>A computer generated analysis based on developing probability distributions of key variables that are used to drive the potential outcomes.</td></tr><tr><td>2</td><td>The process of analyzing the impact of future events by considering multiple key variables.</td></tr><tr><td>3</td><td>A technique whereby key financial variables are changed one at a time and a range of possible outcomes are observed. Also known as \"what-if\" analysis.</td></tr></tbody></table><p><em>Options show → <strong>Sensitivity Analysis</strong> | <strong>Scenario Analysis</strong></em></p>"},{"n":48,"q":"Bentlom Company's common-size financial statements show the following information:\nCurrent liabilities 20%\nEquity 45%\nBentlom's long-term debt-to-equity ratio is closest to:","opts":["98%.","78%.","88%."],"ans":"B","expl":"Nếu vốn chủ sở hữu bằng 45% tài sản và nợ ngắn hạn bằng 20% tài sản thì nợ dài hạn\nphải là 100 − 45 − 20 = 35% tài sản.\nnợ dài hạn\n0,35\ntỷ lệ nợ dài hạn trên vốn chủ sở hữu===77,8%\n0,45\ntổng vốn chủ sở hữu\n(Mô-đun 37.2, LOS 37.b)"},{"n":49,"q":"The following data apply to the XTC Company:\nSales = $1,000,000.\nReceivables = $260,000.\nPayables = $600,000.\nPurchases = $800,000.\nCOGS = $800,000.\nInventory = $400,000.\nNet Income = $50,000.\nTotal Assets = $800,000.\nDebt/Equity = 200%.\nWhich of the following statements about the company's activity ratios is most accurate? The\ncompany has:","opts":["95 days of sales outstanding.","132 days of payables.","45 days of inventory on hand."],"ans":"A","expl":"Doanh thu khoản phải thu = 1.000.000 USD / 260.000 USD = 3,840\nSố ngày bán hàng tồn đọng = 365 / 3,840 = 95,05 ngày.\nVòng quay hàng tồn kho = 800.000 USD / 400.000 USD = 2\nSố ngày tồn kho = 365 / 2 = 182,5 ngày.\nTỷ lệ vòng quay các khoản phải trả = 800.000 USD / 600.000 USD = 1,333.\nSố ngày phải trả = 365 / 1,333 = 273,82 ngày.\n(Mô-đun 37.2, LOS 37.b)"},{"n":50,"q":"An analyst has collected the following data about a firm:\nReceivables turnover = 20 times.\nInventory turnover = 16 times.\nPayables turnover = 24 times.\nWhat is the cash conversion cycle?","opts":["Not enough information is given.","56 days.","26 days."],"ans":"C","expl":"Chu kỳ chuyển đổi tiền mặt = thời gian thu các khoản phải thu + thời gian xử lý hàng tồn kho –\nthời gian thanh toán các khoản phải trả.\nThời gian thu các khoản phải thu = (365 / 20) = 18\nThời gian xử lý hàng tồn kho = (365 / 16) = 23\nThời gian thanh toán các khoản phải trả = (365 / 24) = 15\nChu kỳ chuyển đổi tiền mặt = 18 + 23 – 15 = 26\n(Mô-đun 37.2, LOS 37.b)"},{"n":51,"q":"Given the following income statement and balance sheet for a company:\nBalance Sheet\nAssetsYear 2006Year 2007\nCash200450\nAccounts Receivable600660\nInventory500550\nTotal CA13001660\nPlant, prop. equip10001580\nTotal Assets26003240\nLiabilities\nAccounts Payable500550\nLong term debt7001052\nTotal liabilities12001602\nEquity\nCommon Stock400538\nRetained Earnings10001100\nTotal Liabilities & Equity26003240\nIncome Statement\nSales3000\nCost of Goods Sold(1000)\nGross Profit2000\nSG&A500\nInterest Expense151\nEBT1349\nTaxes (30%)405\nNet Income944\nWhich of the following is closest to the company's return on equity (ROE)?","opts":["0.62.","0.29.","1.83."],"ans":"A","expl":"Có một số cách để tiếp cận câu hỏi này nhưng cách dễ nhất là nhận ra rằng\nROE = NI / vốn chủ sở hữu trung bình do đó ROE = 944 / 1.519 = 0,622.\nNếu sử dụng DuPont truyền thống, ROE = (NI / Doanh số) × (Doanh số / Tài sản) × (Tài sản / Vốn chủ sở hữu):\nROE = (944 / 3.000) × (3.000 / 2.920) × (2.920 / 1.519) = 0,622\nCông thức Dupont gồm 5 phần cho kết quả tương tự:\nROE = (thu nhập ròng / EBT)(EBT / EBIT)(EBIT / doanh thu)(doanh thu / tổng tài sản)(tổng\ntài sản / tổng vốn chủ sở hữu)\nTrong đó EBIT = EBT + tiền lãi = 1.349 + 151 = 1.500\nROE 2007 = (944 / 1.349)(1.349 / 1.500)(1.500 / 3.000)(3.000 / 2.920)(2.920 / 1.519)\n= 0,622\n(Mô-đun 37.3, LOS 37.c)","qhtml":"<p>Given the following income statement and balance sheet for a company:</p><p><strong>Balance Sheet</strong></p><table class=\"qtable\"><thead><tr><th></th><th>Year 2006</th><th>Year 2007</th></tr></thead><tbody><tr><td><strong>Assets</strong></td><td></td><td></td></tr><tr><td>Cash</td><td>200</td><td>450</td></tr><tr><td>Accounts Receivable</td><td>600</td><td>660</td></tr><tr><td>Inventory</td><td>500</td><td>550</td></tr><tr><td>Total CA</td><td>1,300</td><td>1,660</td></tr><tr><td>Plant, prop. equip</td><td>1,000</td><td>1,580</td></tr><tr><td>Total Assets</td><td>2,600</td><td>3,240</td></tr><tr><td><strong>Liabilities</strong></td><td></td><td></td></tr><tr><td>Accounts Payable</td><td>500</td><td>550</td></tr><tr><td>Long term debt</td><td>700</td><td>1,052</td></tr><tr><td>Total liabilities</td><td>1,200</td><td>1,602</td></tr><tr><td><strong>Equity</strong></td><td></td><td></td></tr><tr><td>Common Stock</td><td>400</td><td>538</td></tr><tr><td>Retained Earnings</td><td>1,000</td><td>1,100</td></tr><tr><td>Total Liabilities & Equity</td><td>2,600</td><td>3,240</td></tr></tbody></table><p><strong>Income Statement</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>3,000</td></tr><tr><td>Cost of Goods Sold</td><td>(1,000)</td></tr><tr><td>Gross Profit</td><td>2,000</td></tr><tr><td>SG&A</td><td>500</td></tr><tr><td>Interest Expense</td><td>151</td></tr><tr><td>EBT</td><td>1,349</td></tr><tr><td>Taxes (30%)</td><td>405</td></tr><tr><td>Net Income</td><td>944</td></tr></tbody></table><p>Which of the following is closest to the company's return on equity (ROE)?</p>"},{"n":52,"q":"During 2007, Brownfield Incorporated purchased $140 million of inventory. For the year just\nended, Brownfield reported cost of goods sold of $130 million. Inventory at year-end was\n$45 million. Calculate inventory turnover for the year.","opts":["3.71.","3.25.","2.89."],"ans":"B","expl":"Trước tiên, hãy tính khoảng không quảng cáo đầu kỳ dựa trên giá vốn hàng bán, số lượt mua hàng và khoảng không quảng cáo cuối kỳ.\nHàng tồn kho ban đầu là 35 triệu đô la [130 triệu đô la giá vốn hàng bán + 45 triệu đô la hàng tồn kho cuối kỳ –\n140 triệu USD mua hàng]. Tiếp theo, tính toán hàng tồn kho trung bình là 40 triệu USD [($35 triệu\nhàng tồn kho đầu kỳ + 45 triệu USD hàng tồn kho cuối kỳ) / 2]. Cuối cùng, tính toán hàng tồn kho\ndoanh thu là 3,25 [130 triệu USD giá vốn hàng bán / 40 triệu USD hàng tồn kho trung bình].\n(Mô-đun 37.2, LOS 37.b)"},{"n":53,"q":"An analyst has gathered the following information about a firm:\nQuick ratio of 0.25.\nCash ratio of 0.20.\n$2 million in marketable securities.\n$10 million in cash.\nWhat is their receivables balance?","opts":["5 million.","2 million.","3 million."],"ans":"C","expl":"Tỷ lệ tiền mặt = (tiền mặt + chứng khoán có thể bán được) / nợ ngắn hạn\n0,20 = ($10.000.000 + $2.000.000) / nợ ngắn hạn\nnợ ngắn hạn = 12.000.000 USD / 0,2 = 60.000.000 USD\nTỷ lệ nhanh = [tiền mặt + chứng khoán có thể bán được + các khoản phải thu] / 60.000.000 USD\n0,25 = [$10.000.000 + 2.000.000 USD + các khoản phải thu] / 60.000.000 USD\n(60.000.000 USD)(0,25) = 12.000.000 USD + các khoản phải thu\n$15.000.000 = 12.000.000 USD + các khoản phải thu\n$15.000.000 – $12.000.000 = khoản phải thu\n$3.000.000 = khoản phải thu\n(Mô-đun 37.2, LOS 37.b)"},{"n":54,"q":"Which of the following ratios would NOT be used to evaluate how efficiently management is\nutilizing the firm's assets?","opts":["Fixed asset turnover.","Payables turnover.","Gross profit margin."],"ans":"C","expl":"Biên lợi nhuận gộp được sử dụng để đo lường lợi nhuận hoạt động của một công ty, không phải hiệu quả hoạt động\n.\n(Học phần 37.2, LOS 37.b)"},{"n":55,"q":"Given the following information about a firm:\nRevenues = $1,000.\nCost of Goods Sold = $600.\nOperating Expenses = $200.\nInterest Expenses = $50.\nTax Rate = 34%.\nThe operating profit margin is closest to:","opts":["40%.","20%.","10%."],"ans":"B","expl":"Biên lợi nhuận hoạt động = ($1.000 doanh thu – $600 COGS – $200 chi phí hoạt động) /\n$1.000 doanh thu = $200 / $1000 = 0,2\n(Mô-đun 37.2, LOS 37.b)"},{"n":56,"q":"If a firm has net annual sales of $250,000 and average receivables of $150,000, its average\ncollection period is closest to:","opts":["219.0 days.","46.5 days.","1.7 days."],"ans":"A","expl":"Vòng quay khoản phải thu = 250.000 USD / 150.000 USD = 1,66667\nThời gian thu thập = 365 / 1,66667 = 219 ngày\n(Mô-đun 37.2, LOS 37.b)"},{"n":57,"q":"Given the following income statement and balance sheet for a company:\nBalance Sheet\nAssetsYear 2003Year 2004\nCash500450\nAccounts Receivable600660\nInventory500550\nTotal CA13001660\nPlant, prop. equip10001250\nTotal Assets26002,910\nLiabilities\nAccounts Payable500550\nLong term debt7001102\nTotal liabilities12001652\nEquity\nCommon Stock400538\nRetained Earnings1000720\nTotal Liabilities & Equity26002,910\nIncome Statement\nSales3000\nCost of Goods Sold(1000)\nGross Profit2000\nSG&A500\nInterest Expense151\nEBT1349\nTaxes (30%)405\nNet Income944\nWhat is the average receivables collection period?","opts":["60.6 days.","76.7 days.","80.3 days."],"ans":"B","expl":"Kỳ thu tiền trung bình = 365 / vòng quay khoản phải thu\n Vòng quay khoản phải thu = doanh số / khoản phải thu trung bình = 3.000 / 630 = 4,76\nThời gian thu nợ trung bình = 365 / 4,76 = 76,65\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>Given the following income statement and balance sheet for a company:</p><p><strong>Balance Sheet</strong></p><table class=\"qtable\"><thead><tr><th></th><th>Year 2003</th><th>Year 2004</th></tr></thead><tbody><tr><td><strong>Assets</strong></td><td></td><td></td></tr><tr><td>Cash</td><td>500</td><td>450</td></tr><tr><td>Accounts Receivable</td><td>600</td><td>660</td></tr><tr><td>Inventory</td><td>500</td><td>550</td></tr><tr><td>Total CA</td><td>1,300</td><td>1,660</td></tr><tr><td>Plant, prop. equip</td><td>1,000</td><td>1,250</td></tr><tr><td>Total Assets</td><td>2,600</td><td>2,910</td></tr><tr><td><strong>Liabilities</strong></td><td></td><td></td></tr><tr><td>Accounts Payable</td><td>500</td><td>550</td></tr><tr><td>Long term debt</td><td>700</td><td>1,102</td></tr><tr><td>Total liabilities</td><td>1,200</td><td>1,652</td></tr><tr><td><strong>Equity</strong></td><td></td><td></td></tr><tr><td>Common Stock</td><td>400</td><td>538</td></tr><tr><td>Retained Earnings</td><td>1,000</td><td>720</td></tr><tr><td>Total Liabilities & Equity</td><td>2,600</td><td>2,910</td></tr></tbody></table><p><strong>Income Statement</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>3,000</td></tr><tr><td>Cost of Goods Sold</td><td>(1,000)</td></tr><tr><td>Gross Profit</td><td>2,000</td></tr><tr><td>SG&A</td><td>500</td></tr><tr><td>Interest Expense</td><td>151</td></tr><tr><td>EBT</td><td>1,349</td></tr><tr><td>Taxes (30%)</td><td>405</td></tr><tr><td>Net Income</td><td>944</td></tr></tbody></table><p>What is the average receivables collection period?</p>"},{"n":58,"q":"Comparing a company's ratios with those of its competitors is best described as:","opts":["common-size analysis.","longitudinal analysis.","cross-sectional analysis."],"ans":"C","expl":"So sánh các tỷ lệ của một công ty với các tỷ lệ của đối thủ cạnh tranh được gọi là phân tích cắt ngang\n.\n(Module 37.1, LOS 37.a)"},{"n":59,"q":"An analyst computes the following ratios for Iridescent Carpeting Inc. and compares the\nresults to the industry averages:\nFinancial RatioIridescent CarpetingIndustry Average\nCurrent Ratio2.31.8\nNet Profit Margin22%24%\nReturn on Equity17%20%\nTotal Debt / Total Capital35%56%\nInterest Coverage Ratio4.74.1\nBased on the above data, which of the following can the analyst conclude? Compared to its\ncompetitors, Iridescent Carpeting is more:","opts":["liquid.","profitable.","leveraged."],"ans":"A","expl":"Dựa trên dữ liệu được cung cấp, nhà phân tích có thể kết luận rằng công ty có tính thanh khoản ngắn hạn\ntốt hơn mức trung bình của ngành (tức là, đối thủ cạnh tranh) dựa trên tỷ lệ hiện tại.\nNhà phân tích có thể kết luận rằng Thảm ánh kim có khả năng sinh lời yếu hơn\nđối thủ cạnh tranh dựa trên tỷ suất lợi nhuận ròng và lợi nhuận trên vốn chủ sở hữu. Nhà phân tích cũng có thể\nkết luận rằng công ty có đòn bẩy tài chính (rủi ro) ít hơn mức trung bình của ngành\ndựa trên tỷ lệ tổng nợ/tổng vốn.\n(Học phần 37.3, LOS 37.c)","qhtml":"<p>An analyst computes the following ratios for Iridescent Carpeting Inc. and compares the results to the industry averages:</p><table class=\"qtable\"><thead><tr><th>Financial Ratio</th><th>Iridescent Carpeting</th><th>Industry Average</th></tr></thead><tbody><tr><td>Current Ratio</td><td>2.3</td><td>1.8</td></tr><tr><td>Net Profit Margin</td><td>22%</td><td>24%</td></tr><tr><td>Return on Equity</td><td>17%</td><td>20%</td></tr><tr><td>Total Debt / Total Capital</td><td>35%</td><td>56%</td></tr><tr><td>Interest Coverage Ratio</td><td>4.7</td><td>4.1</td></tr></tbody></table><p>Based on the above data, which of the following can the analyst conclude? Compared to its competitors, Iridescent Carpeting is more:</p>"},{"n":60,"q":"Which of the following items is NOT in the numerator of the quick ratio?","opts":["Cash.","Inventory.","Receivables."],"ans":"B","expl":"Tỷ lệ nhanh = (tiền mặt + chứng khoán thị trường + các khoản phải thu) / nợ ngắn hạn\nTỷ lệ hiện tại = (tiền mặt + chứng khoán thị trường + khoản phải thu + hàng tồn kho) / nợ ngắn hạn\n(Mô-đun 37.2, LOS 37.b)"},{"n":61,"q":"An analyst has gathered the following information about a company:\nBalance Sheet\nAssets\nCash100\nAccounts Receivable750\nMarketable Securities300\nInventory850\nProperty, Plant & Equip900\nAccumulated Depreciation(150)\nTotal Assets2750\nLiabilities and Equity\nAccounts Payable300\nShort-Term Debt130\nLong-Term Debt700\nCommon Equity1000\nRetain
