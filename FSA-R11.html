ed Earnings620\nTotal Liab. and Stockholder's equity2750\nIncome Statement\nSales1500\nCOGS1100\nGross Profit400\nSG&A150\nOperating Profit250\nInterest Expense25\nTaxes75\nNet Income150\nWhat is the ROE?","opts":["9.3%.","9.9%.","10.7%."],"ans":"A","expl":"ROE = 150(NI) / [1000(common) + 620(RE)] = 150 / 1620 = 0,0926 hoặc 9,3%\n(Mô-đun 37.4, LOS 37.d)"},{"n":62,"q":"How are the quick ratio and the debt-to-capital ratio typically used when assessing a\ncompany's ability to meet its debt obligations?","opts":["Both are used primarily to assess its ability to meet long-term obligations.","One is used primarily to assess its ability to meet short-term obligations, and the other is used primarily to assess its ability to meet long-term obligations.","Both are used primarily to assess its ability to meet short-term obligations."],"ans":"B","expl":"Tỷ lệ nhanh là tỷ lệ thanh khoản. Tỷ lệ thanh khoản được sử dụng để đo lường khả năng\nđáp ứng các nghĩa vụ ngắn hạn của một công ty. Tỷ lệ nợ trên vốn là tỷ lệ khả năng thanh toán. Tỷ lệ khả năng thanh toán\nđược sử dụng để đo lường khả năng đáp ứng các nghĩa vụ dài hạn của công ty.\n(Mô-đun 37.2, LOS 37.b)"},{"n":63,"q":"The latest balance sheet for XYZ, Inc. appears below:\n12/31/20X412/31/20X3\nAssets\nCash2,098410\nAccounts receivable4,5704,900\nInventory4,7524,500\nPrepaid SGA877908\nTotal current assets12,29710,718\nLand04,000\nProperty, Plant & Equipment11,00011,000\nAccumulated Depreciation(5,862)(5,200)\nTotal Assets17,43520,518\nLiabilities and Equity\nAccounts Payable4,6515,140\nWages Payable2,9842,890\nDividends Payable100100\nTotal current liabilities7,7358,130\nLong term Debt1,3467,388\nCommon Stock4,0004,000\nRetained Earnings4,3541,000\nTotal Liabilities and Equity17,43520,518\nAt the end of 20X4, what were XYZ's current and quick ratios?","opts":["1.48 | 0.86","1.59 | 0.86","1.59 | 1.59"],"ans":"B","expl":"Tỷ lệ hiện tại = tài sản ngắn hạn / nợ ngắn hạn = 12.297 / 7.735 = 1,59\nTỷ lệ nhanh = (tiền mặt + các khoản phải thu) / nợ ngắn hạn = 2.098 + 4.570 / 7.735 = 0,86\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>The latest balance sheet for XYZ, Inc. appears below:</p><table class=\"qtable\"><thead><tr><th></th><th>12/31/20X4</th><th>12/31/20X3</th></tr></thead><tbody><tr><td><strong>Assets</strong></td><td></td><td></td></tr><tr><td>Cash</td><td>2,098</td><td>410</td></tr><tr><td>Accounts receivable</td><td>4,570</td><td>4,900</td></tr><tr><td>Inventory</td><td>4,752</td><td>4,500</td></tr><tr><td>Prepaid SGA</td><td>877</td><td>908</td></tr><tr><td>Total current assets</td><td>12,297</td><td>10,718</td></tr><tr><td>Land</td><td>0</td><td>4,000</td></tr><tr><td>Property, Plant & Equipment</td><td>11,000</td><td>11,000</td></tr><tr><td>Accumulated Depreciation</td><td>(5,862)</td><td>(5,200)</td></tr><tr><td>Total Assets</td><td>17,435</td><td>20,518</td></tr><tr><td><strong>Liabilities and Equity</strong></td><td></td><td></td></tr><tr><td>Accounts Payable</td><td>4,651</td><td>5,140</td></tr><tr><td>Wages Payable</td><td>2,984</td><td>2,890</td></tr><tr><td>Dividends Payable</td><td>100</td><td>100</td></tr><tr><td>Total current liabilities</td><td>7,735</td><td>8,130</td></tr><tr><td>Long term Debt</td><td>1,346</td><td>7,388</td></tr><tr><td>Common Stock</td><td>4,000</td><td>4,000</td></tr><tr><td>Retained Earnings</td><td>4,354</td><td>1,000</td></tr><tr><td>Total Liabilities and Equity</td><td>17,435</td><td>20,518</td></tr></tbody></table><p>At the end of 20X4, what were XYZ's current and quick ratios?</p><p><em>Options show → <strong>Current Ratio</strong> | <strong>Quick Ratio</strong></em></p>"},{"n":64,"q":"An analyst has gathered the following information about a company:\nBalance Sheet\nAssets\nCash100\nAccounts Receivable750\nMarketable Securities300\nInventory850\nProperty, Plant & Equip900\nAccumulated Depreciation(150)\nTotal Assets2750\nLiabilities and Equity\nAccounts Payable300\nShort-Term Debt130\nLong-Term Debt700\nCommon Stock1000\nRetained Earnings620\nTotal Liab. and Stockholder's equity2750\nIncome Statement\nSales1500\nCOGS1100\nGross Profit400\nSG&A150\nOperating Profit250\nInterest Expense25\nTaxes75\nNet Income150\nWhat is the receivables turnover ratio?","opts":["2.0.","1.0.","0.5."],"ans":"A","expl":"Vòng quay các khoản phải thu = 1.500(doanh thu) / 750(các khoản phải thu) = 2,0\n(Mô-đun 37.2, LOS 37.b)"},{"n":65,"q":"A firm has a cash conversion cycle of 80 days. The firm's payables turnover goes from 11 to\n12, what happens to the firm's cash conversion cycle? It:","opts":["may shorten or lengthen.","shortens.","lengthens."],"ans":"C","expl":"CCC = kỳ thu tiền + Kỳ đầu vào – Kỳ thanh toán.\nKỳ thanh toán = (365 / doanh thu các khoản phải trả) = (365 / 11) = 33; (365 / 12) = 30. Điều này có nghĩa là\nCCC thực tế đã tăng lên 83.\n(Mô-đun 37.2, LOS 37.b)"},{"n":66,"q":"What is a company's equity if their return on equity (ROE) is 12%, and their net income is $10\nmillion?","opts":["$83,333,333.","$120,000,000.","$1,200,000."],"ans":"A","expl":"Một trong nhiều cách có thể biểu thị ROE là: ROE = thu nhập ròng / vốn chủ sở hữu\n0,12 = 10.000.000 USD / vốn chủ sở hữu\nVốn chủ sở hữu = 10.000.000 USD / 0,12 = 83.333.333 USD\n(Mô-đun 37.4, LOS 37.d)"},{"n":67,"q":"Use the following data from Delta's common size financial statement to answer the\nquestion:\nEarnings after taxes=18%\nEquity=40%\nCurrent assets=60%\nCurrent liabilities=30%\nSales=$300\nTotal assets=$1,400\nWhat is Delta's after-tax return on equity?","opts":["5.0%.","9.6%.","18.0%."],"ans":"B","expl":"Thu nhập ròng sau thuế = 300 × 0,18 = 54\nVốn chủ sở hữu = 1400 × 0,40 = 560\nROE = Thu nhập ròng / Vốn chủ sở hữu = 54 / 560 = 0,0964 = 9,6%\n(Học phần 37.2, LOS 37.b)"},{"n":68,"q":"An analyst has gathered the following data about a company:\nDays' sales outstanding of 37 days.\nDays' payables of 30 days.\nDays of inventory on hand of 46 days.\nWhat is their cash conversion cycle?","opts":["45 days.","53 days.","113 days."],"ans":"B","expl":"Chu kỳ chuyển đổi tiền mặt = số ngày bán hàng + số ngày tồn kho – số\nngày phải trả = 37 + 46 – 30 = 53 ngày.\n(Mô-đun 37.2, LOS 37.b)"},{"n":69,"q":"A company has a cash conversion cycle of 70 days. If the company's payables turnover\ndecreases from 11 to 10 and days of sales outstanding increase by 5, the company's cash\nconversion cycle will:","opts":["decrease by approximately 8 days.","increase by approximately 2 days.","decrease by approximately 3 days."],"ans":"B","expl":"chu kỳ chuyển đổi tiền mặt (CCC) = số ngày bán hàng tồn đọng + số ngày tồn kho trên\nhand − số ngày phải trả\n365365\nsố ngày phải trả===33,18 ngày;\n11\nvòng quay các khoản phải trả\n365\n=36,5 ngày\n10\nVì thời gian thanh toán các khoản phải trả tăng 3,32 ngày và số ngày phải thu tăng\nthêm 5 nên CCC tăng 1,68 ngày.\n(Mô-đun 37.2, LOS 37.b)"},{"n":70,"q":"Earnings before interest and taxes (EBIT) is also known as:","opts":["earnings before income taxes.","gross profit.","operating profit."],"ans":"C","expl":"Lợi nhuận hoạt động = thu nhập trước lãi vay và thuế (EBIT)\nLợi nhuận gộp = doanh thu thuần – COGS\nThu nhập ròng = thu nhập sau thuế = EAT\n(Mô-đun 37.2, LOS 37.b)"},{"n":71,"q":"An analyst gathered the following data about a company:\nCurrent liabilities are $300.\nTotal debt is $900.\nWorking capital is $200.\nCapital expenditures are $250.\nTotal assets are $2,000.\nCash flow from operations is $400.\nIf the company would like a current ratio of 2, they could:","opts":["increase current assets by 100 or decrease current liabilities by 50.","decrease current assets by 100 or increase current liabilities by 50.","increase current assets by 100 or increase current liabilities by 50."],"ans":"A","expl":"Để tỷ lệ hiện tại bằng 2,0, tài sản hiện tại sẽ cần phải chuyển sang 600 USD (hoặc cao hơn) by\n$100) nếu không nợ ngắn hạn sẽ cần giảm xuống $250 (hoặc giảm $50). Hãy nhớ\nrằng CA – CL = vốn lưu động (500 – 300 = 200).\n(Mô-đun 37.2, LOS 37.b)"},{"n":72,"q":"An analyst has gathered the following information about a company:\nBalance Sheet\nAssets\nCash100\nAccounts Receivable750\nMarketable Securities300\nInventory850\nProperty, Plant & Equip900\nAccumulated Depreciation(150)\nTotal Assets2750\nLiabilities and Equity\nAccounts Payable300\nShort-Term Debt130\nLong-Term Debt700\nCommon Stock1000\nRetained Earnings620\nTotal Liab. and Stockholder's equity2750\nIncome Statement\nSales1500\nCOGS1100\nGross Profit400\nSG&A150\nOperating Profit250\nInterest Expense25\nTaxes75\nNet Income150\nWhat is the current ratio?","opts":["4.65.","0.22.","2.67."],"ans":"A","expl":"Tỷ lệ hiện tại = [100(tiền mặt) + 750(AR) + 300(chứng khoán khả mại) + 850(hàng tồn kho)] /\n[300(AP) + 130(nợ ngắn hạn)] = (2.000 / 430) = 4,65\n(Mô-đun 37.2, LOS 37.b)"},{"n":73,"q":"Kellen Harris is a credit analyst with the First National Bank. Harris has been asked to\nevaluate Longhorn Supply Company's cash needs. Harris began by calculating Longhorn's\nturnover ratios for 2007. After a discussion with Longhorn's management, Harris decides to\nadjust the turnover ratios for 2008 as follows:\n2007 Actual TurnoverExpected Increase / (Decrease)\nAccounts receivable5.010%\nFixed asset3.07%\nAccounts payable6.0(20%)\nInventory4.0(5%)\nEquity5.5—\nTotal asset2.38%\nLonghorn's expected cash conversion cycle for 2008, based on the expected changes in\nturnover and assuming a 365 day year, is closest to:","opts":["46 days.","82 days.","86 days."],"ans":"C","expl":"Số ngày bán hàng dự kiến năm 2008 là 66 [365 / (5,0 × 1,1)], số ngày tồn kho năm 2008 trên\nlà 96 [365 / (4,0 × 0,95)], và số ngày phải trả năm 2008 là 76 [365 / (6,0 × 0,8)]. Chu kỳ chuyển đổi tiền mặt\ndự kiến ​​là 86 ngày [66 ngày doanh thu tồn đọng + 96 ngày tồn kho trong tay\n – 76 ngày phải trả).\n(Mô-đun 37.3, LOS 37.c)","qhtml":"<p>Kellen Harris is a credit analyst with the First National Bank. Harris has been asked to evaluate Longhorn Supply Company's cash needs. Harris began by calculating Longhorn's turnover ratios for 2007. After a discussion with Longhorn's management, Harris decides to adjust the turnover ratios for 2008 as follows:</p><table class=\"qtable\"><thead><tr><th></th><th>2007 Actual Turnover</th><th>Expected Increase / (Decrease)</th></tr></thead><tbody><tr><td>Accounts receivable</td><td>5.0</td><td>10%</td></tr><tr><td>Fixed asset</td><td>3.0</td><td>7%</td></tr><tr><td>Accounts payable</td><td>6.0</td><td>(20%)</td></tr><tr><td>Inventory</td><td>4.0</td><td>(5%)</td></tr><tr><td>Equity</td><td>5.5</td><td>—</td></tr><tr><td>Total asset</td><td>2.3</td><td>8%</td></tr></tbody></table><p>Longhorn's expected cash conversion cycle for 2008, based on the expected changes in turnover and assuming a 365 day year, is closest to:</p>"},{"n":74,"q":"Lightfoot Shoe Company reported sales of $100 million for the year ended 20X7. Lightfoot\nexpects sales to increase 10% in 20X8. Cost of goods sold is expected to remain constant at\n40% of sales and Lightfoot would like to have an average of 73 days of inventory on hand in\n20X8. Forecast Lightfoot's average inventory for 20X8 assuming a 365 day year.","opts":["$22.0 million.","$8.0 million.","$8.8 million."],"ans":"C","expl":"Doanh số 20X8 dự kiến là 110 triệu USD [$100 triệu × 1,1] và giá vốn hàng bán dự kiến là\n44 triệu USD [Doanh thu 110 triệu USD × 40%]. Với 73 ngày tồn kho trong kho, khoảng không quảng cáo\ntrung bình là 8,8 triệu USD [($44 triệu COGS / 365) × 73 ngày].\n(Module 37.5, LOS 37.f)"},{"n":75,"q":"From the extended (5-part) DuPont equation, which of the following components describes\nthe equation EBT / EBIT?","opts":["Tax burden.","Interest burden.","Financial leverage."],"ans":"B","expl":"EBT / EBIT là gánh nặng lãi suất, thành phần thứ hai trong phương trình DuPont\nmở rộng. Nó cho thấy rằng đòn bẩy nhiều hơn không phải lúc nào cũng dẫn đến ROE cao hơn. Khi đòn bẩy\ntăng lên thì gánh nặng lãi suất cũng tăng theo. Tác động tích cực của đòn bẩy có thể được bù đắp bằng\ncác khoản thanh toán lãi suất cao hơn đi kèm với mức nợ cao hơn. Thu nhập ròng / EBT được gọi là\ngánh nặng thuế và bằng (1 – thuế suất). Thuế suất càng cao thì mức ROE\n càng thấp. EBIT / doanh thu được gọi là tỷ suất lợi nhuận EBIT hoặc tỷ suất lợi nhuận hoạt động. (Mô-đun 37.4, LOS 37.d)"},{"n":76,"q":"Books Forever, Inc., uses short-term bank debt to buy inventory. Assuming an initial current\nratio that is greater than 1, and an initial quick (or acid test) ratio that is less than 1, what is\nthe effect of these transactions on the current ratio and the quick ratio?","opts":["Both ratios will decrease.","Neither ratio will decrease.","Only one ratio will decrease."],"ans":"A","expl":"Ví dụ: bắt đầu bằng CA = 2, CL = 1 và Inv = 1,2. Chúng tôi bắt đầu với tỷ lệ hiện tại là 2\nvà tỷ lệ thanh toán nhanh là 0,8. Nếu công ty tăng nợ ngân hàng ngắn hạn (nợ ngắn hạn) lên 1\nđể mua hàng tồn kho (tài sản hiện tại) lên 1, thì cả tử số và mẫu số đều tăng\n3−2.2\n3\n=1.5=0.4\n1, dẫn đến (tỷ lệ thanh toán hiện thời mới) và (tỷ lệ thanh toán nhanh mới). (Mô-đun\n22\n37.2, LOS 37.b)"},{"n":77,"q":"Value at risk, a common measure of capital risk, is most accurately defined as an estimate of\nthe size of the loss that a firm:","opts":["can survive incurring, over a specific period of time.","will not exceed, assuming it puts appropriate measures in place.","will exceed a portion of the time, over a specific period of time."],"ans":"C","expl":"Giá trị rủi ro là ước tính quy mô đô la về tổn thất mà một công ty sẽ vượt quá một số tỷ lệ phần trăm cụ thể\ntrong một khoảng thời gian cụ thể. Mặc dù một công ty có thể tồn tại\ngây ra một khoản lỗ lớn và có thể giảm khả năng xảy ra các khoản lỗ lớn bằng\ncác biện pháp thích hợp, nhưng đây không phải là những định nghĩa chính xác nhất.\n(Module 37.5, LOS 37.e)"},{"n":78,"q":"An analyst has gathered the following information about a company:\nCost of goods sold = 65% of sales.\nInventory of $450,000.\nSales of $1 million.\nWhat is the value of this firm's average inventory processing period using a 365-day year?","opts":["0.7 days.","1.4 days.","252.7 days."],"ans":"C","expl":"COGS = (0,65)(1.000.000 USD) = 650.000 USD\nVòng quay hàng tồn kho = giá vốn hàng bán / Hàng tồn kho = 650.000 USD / 450.000 USD = 1,4444\nThời gian xử lý khoảng không quảng cáo trung bình = 365 / 1,4444 = 252,7 ngày\n(Mô-đun 37.2, LOS 37.b)"},{"n":79,"q":"Which of the following statements about financial ratios is most accurate?","opts":["A company with a high debt-to-equity ratio will have a return on assets that is greater than its return on equity.","Any firm with a high net profit margin will have a high gross profit margin and vice versa.","A company that has an inventory turnover of 6 times, a receivables turnover of 9 times, and a payables turnover of 12 times will have a cash conversion cycle of approximately 71 days."],"ans":"C","expl":"Chu kỳ chuyển đổi tiền mặt là (365 / 6) + (365 / 9) − (365 / 12) = 60,8 + 40,6 − 30,4 = 71 ngày.\nROA nhỏ hơn ROE khi thu nhập ròng dương và có nợ. Việc một công ty\ncó tỷ suất lợi nhuận gộp cao không nhất thiết có nghĩa là công ty đó sẽ có tỷ suất lợi nhuận ròng\ncao. Một công ty có tỷ suất lợi nhuận gộp cao có thể có tỷ suất lợi nhuận ròng\nthấp (hoặc âm) nếu chi phí hoạt động của công ty đó cao. (Mô-đun 37.2, LOS 37.b)"},{"n":80,"q":"Assume that Q-Tell Incorporated is in the communications industry, which has an average\nreceivables turnover ratio of 16 times. If the Q-Tell's receivables turnover is less than that of\nthe industry, Q-Tell's average receivables collection period is most likely:","opts":["25 days.","20 days.","12 days."],"ans":"A","expl":"Thời gian thu nợ trung bình = 365 / vòng quay các khoản phải thu, tức là 22,81 ngày trong\nngành công nghiệp (= 365 / 16). Nếu vòng quay các khoản phải thu của Q-Tell nhỏ hơn 16 thì số ngày thu thập trung bình\ncủa Q-Tell phải lớn hơn 22,81 ngày.\n(Mô-đun 37.3, LOS 37.c)"},{"n":81,"q":"Which of the following statements best describes vertical common-size analysis and\nhorizontal common-size analysis?\nStatement #1 – Each line item is expressed as a percentage of its base-year amount.\nStatement #2 – Each line item of the income statement is expressed as a percentage of\nrevenue and each line item of the balance sheet is expressed as a percentage of ending total\nassets.\nStatement #3 – Each line item is expressed as a percentage of the prior year's amount.","opts":["Statement #1 | Statement #2","Statement #2 | Statement #1","Statement #2 | Statement #3"],"ans":"B","expl":"Phân tích theo kích thước chung theo chiều ngang bao gồm việc biểu thị từng mục hàng dưới dạng phần trăm của\nsố liệu của năm cơ sở. Phân tích theo kích thước chung theo chiều dọc bao gồm việc biểu thị từng mục hàng của\nbáo cáo thu nhập dưới dạng phần trăm doanh thu và từng mục hàng của bảng cân đối kế toán dưới dạng\nphần trăm tổng tài sản cuối kỳ.\n(Mô-đun 37.1, LOS 37.a)","qhtml":"<p>Which of the following statements best describes vertical common-size analysis and horizontal common-size analysis?</p><table class=\"qtable\"><thead><tr><th>#</th><th>Description</th></tr></thead><tbody><tr><td>1</td><td>Each line item is expressed as a percentage of its base-year amount.</td></tr><tr><td>2</td><td>Each line item of the income statement is expressed as a percentage of revenue and each line item of the balance sheet is expressed as a percentage of ending total assets.</td></tr><tr><td>3</td><td>Each line item is expressed as a percentage of the prior year's amount.</td></tr></tbody></table><p><em>Options show → <strong>Vertical Analysis</strong> | <strong>Horizontal Analysis</strong></em></p>"},{"n":82,"q":"Are the following ratios best classified as profitability ratios?\nRatio #1 – Cash plus short-term marketable investments plus receivables divided by average\ndaily cash expenditures.\nRatio #2 – Earnings before interest and taxes divided by average total assets.","opts":["Neither of the ratios is a profitability ratio.","Both of the ratios are profitability ratios.","Only one of the ratios is a profitability ratio."],"ans":"C","expl":"(Tiền mặt + các khoản đầu tư ngắn hạn có thể bán được + các khoản phải thu) chia cho tiền mặt trung bình hàng ngày\nchi tiêu được gọi là tỷ lệ khoảng thời gian phòng thủ. Tỷ lệ khoảng phòng thủ là tỷ lệ thanh khoản\nđo lường khả năng thanh toán chi tiêu bằng tiền mặt của công ty trong trường hợp không có\ndòng tiền bên ngoài, nhưng không đo lường trực tiếp khả năng sinh lời. EBIT / tổng tài sản trung bình\nlà một biến thể của tỷ lệ lợi nhuận trên tài sản. Tỷ suất sinh lời trên tài sản là tỷ lệ sinh lời\nđo lường hiệu quả quản lý tài sản và tạo ra lợi nhuận.\n(Mô-đun 37.2, LOS 37.b)"},{"n":83,"q":"When the return on equity equation (ROE) is decomposed using the original DuPont system,\nwhat three ratios comprise the components of ROE?","opts":["Net profit margin, asset turnover, asset multiplier.","Gross profit margin, asset turnover, equity multiplier.","Net profit margin, asset turnover, equity multiplier."],"ans":"C","expl":"Ba tỷ lệ có thể được phân tách sâu hơn như sau:\nBiên lợi nhuận ròng = thu nhập ròng/doanh thu\nVòng quay tài sản = doanh thu/tài sản\nHệ số vốn sở hữu = tài sản/vốn chủ sở hữu\n(Mô-đun 37.4, LOS 37.d)"},{"n":84,"q":"Given the following income statement and balance sheet for a company:\nBalance Sheet\nAssetsYear 2003Year 2004\nCash500450\nAccounts Receivable600660\nInventory500550\nTotal CA13001660\nPlant, prop. equip10001250\nTotal Assets26002910\nLiabilities\nAccounts Payable500550\nLong term debt7001102\nTotal liabilities12001652\nEquity\nCommon Stock400538\nRetained Earnings1000720\nTotal Liabilities & Equity26002,910\nIncome Statement\nSales3000\nCost of Goods Sold(1000)\nGross Profit2000\nSG&A500\nInterest Expense151\nEBT1349\nTaxes (30%)405\nNet Income944\nWhat is the gross profit margin?","opts":["0.333.","0.472.","0.666."],"ans":"C","expl":"Lợi nhuận gộp = (lợi nhuận gộp / doanh thu thuần) = (2.000 / 3.000) = 0,666\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>Given the following income statement and balance sheet for a company:</p><p><strong>Balance Sheet</strong></p><table class=\"qtable\"><thead><tr><th></th><th>Year 2003</th><th>Year 2004</th></tr></thead><tbody><tr><td><strong>Assets</strong></td><td></td><td></td></tr><tr><td>Cash</td><td>500</td><td>450</td></tr><tr><td>Accounts Receivable</td><td>600</td><td>660</td></tr><tr><td>Inventory</td><td>500</td><td>550</td></tr><tr><td>Total CA</td><td>1,600</td><td>1,660</td></tr><tr><td>Plant, prop. equip</td><td>1,000</td><td>1,250</td></tr><tr><td>Total Assets</td><td>2,600</td><td>2,910</td></tr><tr><td><strong>Liabilities</strong></td><td></td><td></td></tr><tr><td>Accounts Payable</td><td>500</td><td>550</td></tr><tr><td>Long term debt</td><td>700</td><td>1,102</td></tr><tr><td>Total liabilities</td><td>1,200</td><td>1,652</td></tr><tr><td><strong>Equity</strong></td><td></td><td></td></tr><tr><td>Common Stock</td><td>400</td><td>538</td></tr><tr><td>Retained Earnings</td><td>1,000</td><td>720</td></tr><tr><td>Total Liabilities & Equity</td><td>2,600</td><td>2,910</td></tr></tbody></table><p><strong>Income Statement</strong></p><table class=\"qtable\"><tbody><tr><td>Sales</td><td>3,000</td></tr><tr><td>Cost of Goods Sold</td><td>(1,000)</td></tr><tr><td>Gross Profit</td><td>2,000</td></tr><tr><td>SG&A</td><td>500</td></tr><tr><td>Interest Expense</td><td>151</td></tr><tr><td>EBT</td><td>1,349</td></tr><tr><td>Taxes (30%)</td><td>405</td></tr><tr><td>Net Income</td><td>944</td></tr></tbody></table><p>What is the gross profit margin?</p>"},{"n":85,"q":"A company has a receivables turnover of 10, an inventory turnover of 5, and a payables\nturnover of 12. The company's cash conversion cycle is closest to:","opts":["37 days.","79 days.","30 days."],"ans":"B","expl":"Chu kỳ chuyển đổi tiền mặt = ngày phải thu + ngày xử lý hàng tồn kho – khoản thanh toán phải trả\nthời gian.\nSố ngày phải thu = 365 / vòng quay khoản phải thu = 365 / 10 = 36,5 ngày.\nSố ngày xử lý hàng tồn kho = 365 / vòng quay hàng tồn kho = 365 / 5 = 73,0 ngày.\nKỳ thanh toán khoản phải trả = 365 / vòng quay khoản phải trả = 365 / 12 = 30,4 ngày.\nChu kỳ thu tiền mặt = 36,5 + 73,0 – 30,4 = 79,1 ngày.\n(Mô-đun 37.2, LOS 37.b)"},{"n":86,"q":"An analyst using vertical common-size analysis is most likely to express each item on an\nincome statement as a percentage of:","opts":["sales.","operating income.","its value in a base period."],"ans":"A","expl":"Phân tích kích thước chung theo chiều dọc của báo cáo thu nhập thường được thực hiện bằng cách nêu rõ từng mục\ndưới dạng phần trăm doanh số bán hàng. Việc nêu từng mục trên báo cáo tài chính dưới dạng phần trăm\ngiá trị của nó trong kỳ cơ sở được gọi là phân tích quy mô chung theo chiều ngang. (Mô-đun\n37.1, LOS 37.a)"},{"n":87,"q":"An analyst has gathered the following information about a company:\nBalance Sheet\nAssets\nCash100\nAccounts Receivable750\nMarketable Securities300\nInventory850\nProperty, Plant & Equip900\nAccumulated Depreciation(150)\nTotal Assets2750\nLiabilities and Equity\nAccounts Payable300\nShort-Term Debt130\nLong-Term Debt700\nCommon Stock1000\nRetained Earnings620\nTotal Liab. and Stockholder's equity2750\nIncome Statement\nSales1500\nCOGS1100\nGross Profit400\nSG&A150\nOperating Profit250\nInterest Expense25\nTaxes75\nNet Income150\nWhat is the receivables collection period?","opts":["183.","365.","243."],"ans":"A","expl":"Doanh thu các khoản phải thu = 1.500(doanh thu) / 750(các khoản phải thu) = 2,0\nKỳ thu hồi các khoản phải thu trung bình = 365 / 2 = 182,5 hoặc 183\n(Mô-đun 37.2, LOS 37.b)"},{"n":88,"q":"Johnson Corp. had the following financial results for the fiscal 2004 year:\nCurrent ratio2.00\nQuick ratio1.25\nCurrent liabilities$100,000\nInventory turnover12\nGross profit %25\nThe only current assets are cash, accounts receivable, and inventory. The balance in these\naccounts has remained constant throughout the year. Johnson's net sales for 2004 were:","opts":["$300,000.","$1,200,000.","$900,000."],"ans":"B","expl":"GP 25% cho thấy giá vốn hàng bán bằng 75% doanh thu. Khoảng không quảng cáo được lấy từ\ntừ sự khác biệt giữa tỷ lệ thanh toán hiện thời và tỷ lệ thanh toán nhanh. Tỷ lệ hiện tại cho biết\nrằng tài sản hiện tại là 200.000 USD và tài sản ngắn hạn là 125.000 USD. Sự khác biệt\nthể hiện khoảng không quảng cáo là 75.000 USD. Vòng quay hàng tồn kho được sử dụng để tính giá vốn của hàng hóa\nbán được là 900.000 USD. Giá vốn hàng bán chiếm 75% doanh thu, cho thấy doanh thu là\n$1.200.000.\n(Mô-đun 37.2, LOS 37.b)","qhtml":"<p>Johnson Corp. had the following financial results for the fiscal 2004 year:</p><table class=\"qtable\"><tbody><tr><td>Current ratio</td><td>2.00</td></tr><tr><td>Quick ratio</td><td>1.25</td></tr><tr><td>Current liabilities</td><td>$100,000</td></tr><tr><td>Inventory turnover</td><td>12</td></tr><tr><td>Gross profit %</td><td>25</td></tr></tbody></table><p>The only current assets are cash, accounts receivable, and inventory. The balance in these accounts has remained constant throughout the year. Johnson's net sales for 2004 were:</p>"},{"n":89,"q":"Are the following statements about common-size financial statements correct or incorrect?\nStatement #1 – Expressing financial information in a common-size format enables the\nanalyst to make better comparisons between two firms of similar size that operate in\ndifferent industries.\nStatement #2 – Common-size financial statements can be used to highlight the structural\nchanges in the firm's operating results and financial condition that have occurred over time.\nWith respect to these statements:","opts":["both are correct.","both are incorrect.","only one is correct."],"ans":"C","expl":"Các báo cáo về quy mô chung theo chiều dọc cho phép nhà phân tích so sánh tốt hơn hai\ncông ty có quy mô khác nhau hoạt động trong cùng một ngành. Báo cáo tài chính có kích thước chung theo chiều ngang\nthể hiện mỗi dòng dưới dạng phần trăm của số liệu năm cơ sở; do đó,\nbáo cáo theo chiều ngang có kích thước phổ biến có thể được sử dụng để xác định những thay đổi về cấu trúc trong\nkết quả hoạt động và điều kiện tài chính của một công ty theo thời gian.\n(Mô-đun 37.1, LOS 37.a)"},{"n":90,"q":"Adams Co.'s common sized balance sheet shows that:\nCurrent Liabilities = 20%\nEquity = 45%\nCurrent Assets = 45%\nTotal Assets = $2,000\nWhat are Adams' long-term debt to equity ratio and working capital?\nLong-Term Debt to\nWorking Capital\nEquity","opts":["0.78$250","0.78$500","1.22$500"],"ans":"B","expl":"Nếu vốn chủ sở hữu bằng 45% tài sản và nợ ngắn hạn bằng 20% thì nợ dài hạn\nphải là 35%.\nNợ dài hạn / Vốn chủ sở hữu = 0,35 / 0,45 = 0,78\nVốn lưu động = CA – CL = 45% - 20% = 25% tài sản\nWC = 2.000(0,25) = $500\n(Học phần 37.2, LOS 37.b)"}];
const CFG = {"title": "Financial Analysis Techniques", "subtitle": "CFA · Financial Statement Analysis · Reading 37 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");

    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    if(q.cols){
      const ch = document.createElement("div");
      ch.className = "q-cols-header";
      q.cols.forEach(h=>{
        const sp = document.createElement("span"); sp.textContent = h;
        ch.appendChild(sp);
      });
      card.appendChild(ch);
    }

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      if(q.cols && t.includes(" | ")){
        b.dataset.cols = "2";

          const sp = document.createElement("span"); sp.className = "opt-col"; sp.textContent = p;
          b.appendChild(sp);

    if(q.expl){

  });

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";

      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){

  function fetchEmoji(group, el){

      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){

    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }

      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

(function(){

    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }

    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");

    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;

})();

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
