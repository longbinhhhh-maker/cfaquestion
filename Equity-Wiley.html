d for a single country, a geographic region, or on a global basis.\nThe relative performance of different sectors of the economy differs during the course of the business cycle. Investment products that track sector\nindexes allow investors to overweight or underweight various sectors to outperform market averages.\n(Choice A) Style indexes consist of stocks of a single investment style (eg, growth, value), of similar size (eg, large cap, small cap), or a\ncombination of both factors (eg, small-cap growth). Style indexes can be regional or global.\n(Choice C) Multimarket indexes are composites that combine indexes from different countries (eg, Argentina, Brazil) or regions (eg, Europe, the\nMiddle East, Africa [EMEA]). Multimarket indexes may represent specific geographic zones, stages of economic development (eg, emerging\nmarket), or global financial markets.\nThings to remember:\nSector indexes include stocks from a single industry or a group of related industries. Since they are used to track the investment performance of a\ngiven sector, they are constructed without regard to company size or style. Sector funds may be structured for a country, a geographic region, or\non a global basis.\nDescribe types of equity indexes", "qhtml": null}, {"n": 72, "q": "The following securities make up a price-weighted index: Beginning Price Security price (€) return X 101 12% Y 62 20% Z 85 15% If the divisor is 2.5, the index value at the beginning of the period is closest to:", "opts": ["€82.67", "€85.76", "€99.20"], "ans": "C", "expl": "Price weighting is one of the simplest methods of index weighting. The value of a price-weighted index is found by dividing the sum of the\nindividual securities' prices by the divisor. In a price-weighted index, higher priced securities have a greater impact on the index's value than\nlower priced securities. Price return is not needed in the calculation of the value of a price weighted index; but it is necessary for the price return\nof an index. Only the price of each security and the divisor are needed.\nSubstitute values for the price of each security and the divisor:\nBecause the divisor changes over time, it is important to remember that the divisor is not usually the same as the number of securities in the\nindex. Corporate actions like stock splits change the prices of the securities in the index, and the divisor must be adjusted when such actions\noccur to keep the value of the index consistent.\n(Choice A) €82.67 is the result of incorrectly taking the average of the three securities' prices. This would be the result under an equal-weighted\nindex, not a price-weighted index.\n(Choice B) €85.76 is the result of incorrectly finding the sum of the products of each security's price and weight.\nThings to remember:\nThe value of a price weighted index is the sum of the prices of the index divided by the divisor. The value of the divisor is not normally the same\nas the number of securities in the index after inception.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 73, "q": "In managing a security market index, reconstitution most likely refers to changing:", "opts": ["the index's weighting method.", "the securities that make up the index.", "the weights of the securities in the index."], "ans": "B", "expl": "The reconstitution of an index is performed periodically by the index provider as part of the index's rebalancing cycle. The index provider reviews\nthe securities in the index, reapplies the criteria for inclusion in the index, decides which securities no longer meet the requirements, and replaces\nsecurities as appropriate.\nAfter reconstitution, the weighting method of the index is reapplied to determine the weight of each security in the index (ie, the index is\nrebalanced). Reconstitution and rebalancing typically take place on a quarterly basis.\n(Choice A) An index's weighting method is normally established during index construction and is not changed subsequently.\n(Choice C) Rebalancing, not reconstitution, is the process of changing the weights of the securities in the index.\nThings to remember:\nReconstitution means the index provider reviews the index securities, reapplies the criteria for inclusion in the index, and replaces securities as\nappropriate. Rebalancing means adjusting the weights of the securities in the index according to the index's weighting method.\nDescribe the choices and issues in index construction and management", "qhtml": null}, {"n": 74, "q": "Three equity indexes hold the same 30 securities, but they are weighted differently in each index. Over the past year, the total returns of the indexes were: Index Weighting Return % Fundamental 6 Equal 10 Market capitalization 2 The best explanation for this performance difference is:", "opts": ["large-cap and value outperformance.", "small-cap and value outperformance.", "large-cap and momentum outperformance."], "ans": "B", "expl": "Equity index weighting styles\nType of index Key performance drivers\nMarket capitalization Large-cap, momentum\nEqual Small-cap, value\nFundamental Value\nPrice High-priced stocks\nIndex weighting methodology can have a substantial impact on the underlying performance of an index. Understanding the underlying biases\npresent in each approach helps analyze index performance more effectively. Three key index weighting methods are:\nEqual: Equal weight is assigned to each asset.\nMarket capitalization: Weight is based on the market value of the asset as a percentage of the total market value of assets in the index.\nFundamental: Weight is based on a company metric (eg, revenues, book value, number of employees relative to the sum of the total for all\nconstituents, earnings yields ) to determine the weight in the index.\nCompared to a market capitalization approach, fundamentally and equally weighted indexes emphasize assets normally associated with a value\ntilt. In equally weighted indexes, small-capitalization stocks have an outsized effect on performance. In this scenario, the equal-weighted index\nwas the clear outperformer, indicating small-cap and value outperformance.\n(Choices A and C) Market capitalization-weighted index performance is heavily influenced by large-capitalization stocks and the momentum\neffect. Capitalization-weighted indexes are based on market value, so high-momentum stocks have increasing weight and performance impact.\nThings to remember:\nCompared to a market capitalization approach, equally weighted indexes give emphasis to small-capitalization stocks and assets normally\nassociated with a value tilt.\nCalculate and analyze the value and return of an index given its weighting method", "qhtml": null}, {"n": 75, "q": "Once a security market index has been established, rebalancing is most likely a concern for a(n):", "opts": ["price-weighted index.", "equal-weighted index.", "market-cap-weighted index."], "ans": "B", "expl": "In an equal-weighted index, the weight assigned to each asset at index construction is 1 / N, with N being the number of securities in the index.\nFor example, if an index contains four assets, it includes enough shares of each asset to equal 1/4 of the value of the index. Since price\nmovements cause the weights of the securities in an index to deviate from an equal weighting over time, the index must be rebalanced\nperiodically. Therefore, rebalancing is of greatest concern for an equal-weighted index.\n(Choice A) Since a price-weighted index is weighted based on each asset's price, its weighting changes proportionately when an asset's price\nchanges. Therefore, a price-weighted index is not rebalanced.\n(Choice C) In a market-capitalization-weighted index, the market capitalization changes daily based on the assets' prices; therefore, rebalancing\ndue to price changes is not needed. However, corporate actions such as liquidations, mergers, and acquisitions require rebalancing to maintain\nthe continuity of the index's price.\nThings to remember:\nSince price movements cause the weights of the assets in an index to deviate from an equal weighting over time, rebalancing is of greatest\nconcern for an equal-weighted index. Rebalancing is of less concern for price-weighted and market-cap-weighted indexes.\nDescribe the choices and issues in index construction and management", "qhtml": null}, {"n": 76, "q": "In comparison to equity indexes, fixed-income indexes are most likely harder to construct and replicate since fixed-income securities:", "opts": ["are less liquid than equity securities.", "need to be tracked with futures contracts.", "do not accurately track styles and sectors."], "ans": "A", "expl": "Challenges in fixed-income index construction\nVast number of bonds outstanding\nLack of market-derived pricing information\nGeneral illiquidity of many bonds\nEach bond issue, even from the same issuer, will have different characteristics (eg, maturity, seniority), resulting in thousands more bond\nsecurities outstanding than equity securities. For example, AT&T has one type of common stock and three series of preferred stock, but about 200\nbonds outstanding. The volume of bonds outstanding leads to each specific issue trading less frequently, reducing bond liquidity.\nThe absence of a central secondary market (eg, the New York Stock Exchange) also contributes to illiquidity of bonds compared to equity\ninvestments, since investors will often have to trade with dealers instead of trading directly with an exchange.\nThis illiquidity can easily become an issue for fixed-income index construction and replication, given the larger number of securities needed to\naccurately track the represented market. Illiquidity can also make it difficult and expensive to regularly update the price of bonds in an index since\ncurrent pricing may need to be ascertained from dealers or estimated from the prices of similar securities. Equity securities are more liquid and\nequity markets are typically more transparent, making index construction and replication easier and less costly.\n(Choice B) It is possible to price and track fixed-income securities for use in an index; futures contracts are not needed. Index creation with\nfutures contracts is a characteristic of commodity indexes.\n(Choice C) Accurately tracking styles and sectors with indexes is possible with fixed-income securities, though it may take a larger number of\nsecurities than for equity indexes due to the larger number of securities outstanding.\nThings to remember:\nFixed-income securities are typically less liquid than equity securities. This relative illiquidity is one reason that construction and replication are\nmore difficult and costly for fixed-income indexes than for equity indexes.\nCompare types of security market indexes", "qhtml": null}, {"n": 77, "q": "An analyst gathers the following information on the constituents of a price-weighted index: Beginning Ending Dividends Shares Stock price (¥) price (¥) per share (¥) outstanding A 150 180 12,000 B 250 270 10 10,000 C 200 180 5 14,000 Based on this information, the index's price return is closest to: ", "opts": ["5.0%", "6.3%", "7.5%"], "ans": "A", "expl": "The price return of an index is equal to the weighted average of the price returns of each constituent security in the index. The price return\nof each security is the change in price as a percentage of the beginning value; it excludes dividends, interest, and other distributions.\nIn a price-weighted index, each security's weighting is the ratio of its beginning price to the total beginning price of the index. For example,\nin this scenario Stock A's beginning price is ¥150. The total beginning price of all three stocks is ¥600, so Stock A's weight in the index is ¥150 /\n¥600, or 25%.\nThe price return of the index is calculated as follows:\nIt should be noted that since there were no stock splits during the period, the price return can also be calculated as (630 − 600) / 600 = 5.0%.\n(Choice B) 6.3% would be the price return of the index if it were market cap-weighted, instead of price-weighted.\n(Choice C) 7.5% is the total return of the index, which includes income from securities (eg, dividends, interest).\nThings to remember:\nThe price return of a security is the change in its price as a percentage of its beginning value. The price return of an index is the weighted average\nof the price returns of the individual assets in the index. Dividends, interest, and other distributions are excluded from price return.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 78, "q": "An analyst wants to calculate the total return of an index comprising the following assets: Beginning Ending Income Asset (€) Weight price (€) price (€) (€) X 101.00 109.00 1.00 10% Y 10.00 9.00 0.50 30% Z 6.00 7.00 0.10 60% The total return of the index is closest to:", "opts": ["7.4%", "8.6%", "10.4%"], "ans": "C", "expl": "Total return of an index is equal to the weighted average of the total returns of each asset in the index. The total return of each asset is the\nchange in overall investment value as a percentage of beginning value, accounting for both price changes and income. Depending on the index\ntype, the income component of total return may be dividends, interest, or another form of distribution.\nFind the total return:\nThe total return of an index reflects both the price change and the income of assets comprising the index. Note that the total return and the\nholding period return are the same concept.\n(Choice A) 7.4% is the result of incorrectly taking an equal-weighted return of the assets. This index is not equal-weighted.\n(Choice B) 8.6% is the result of incorrectly dividing by ending prices (P ) instead of by beginning prices (P ) to find the total return of each\niEnd iBeg\nasset.\nThings to remember:\nThe total return of an asset is found by subtracting beginning value from ending value, adding income, and then dividing that entire quantity by the\nbeginning value. Total return of an index is the weighted average of the total returns of the assets comprising the index.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 79, "q": "Value tilt is most likely to impact equity indexes that are:", "opts": ["price weighted.", "fundamentally weighted.", "market capitalization weighted."], "ans": "B", "expl": "Equity indexes are portfolios of stocks designed to represent an asset class, sector, or market. One of the choices in constructing an index is the\nweighting of its component securities. Fundamental indexes weight component stocks using measures of size distinct from market capitalization\n(market cap), such as sales, book value, and number of employees.\nFundamental weighting addresses an inherent skew in market cap–weighted indexes, which are subject to a momentum effect: securities with the\nlargest increases in market value have more weight in and more impact on the index. Therefore, in a cap-weighted index, growth stocks' weights\nare disproportionate to their current earnings or sales, compared with the index average, since their stock prices and market caps reflect the much\nhigher level of expected future earnings.\nValue stock prices are much lower relative to current earnings or sales (ie, lower P/E and price/sales ratios), reflecting their more modest growth\nexpectations. Inverting those valuation multiples, value stocks have much higher ratios of earnings or sales to their market values. Therefore,\nfundamental weighting using such metrics results in a value tilt: value stocks have higher weights in fundamental indexes than in indexes\nweighted by market cap.\n(Choice A) Price-weighted indexes have no inherent value or growth tilts. The highest price shares have the biggest impact on index\nperformance.\n(Choice C) Market cap-weighted indexes are subject to growth tilts, not value tilts. The outsized impact of growth stocks is due to high market\ncaps relative to current earnings.\nThings to remember:\nFundamental indexes weight component stocks using factors such as sales, book value, and number of employees. Value stocks have much\nhigher ratios of such factors to their market values compared with growth stocks. Therefore, fundamental weighting results in a value tilt: value\nstocks have higher weights in fundamental indexes.\nCompare the different weighting methods used in index construction", "qhtml": null}, {"n": 80, "q": "Assume that a capitalization-weighted (cap-weighted) equity index and an equal-weighted equity index have the same constituent stocks. All else being equal, if the cap-weighted index had a greater one-year price return, the most appropriate conclusion is that large-cap stocks: ", "opts": ["outperformed small-cap stocks.", "underperformed small-cap stocks only.", "underperformed small- and medium-cap stocks."], "ans": "A", "expl": "The effect of constituent returns on an index is determined by how the index is weighted:\nWeighted equally: Each constituent's return has an equal effect on the index.\nWeighted by size: Each constituent's return affects the index in proportion to the constituent's size.\nEqual-weighted indexes understate the impact of large companies' returns and overstate the impact of small companies' returns compared with a\ncapitalization-weighted (cap-weighted) index. In an equal-weighted index, small-cap stocks, which account for a relatively small portion of the total\nmarket value of all the constituent companies, are overrepresented (and large-cap stocks are underrepresented) compared with a cap-weighted\nindex.\nFor example, consider how two stocks affect the returns on equal- and value-weighted indexes constructed with the same constituent stocks.\nGiven no change in the other stocks, assume the largest-cap stock is up 1% and smallest-cap stock is down 1%.\nEqual-weighted index: No net change due to equal but opposite percentage changes in the two stocks since the stocks are equally\nweighted.\nCap-weighted index: The index would increase since the 1% loss of the small-cap stock offsets only a portion of the 1% gain of the large-\ncap stock due to the large-cap stock's greater weight.\n(Choices B and C) If small-cap stocks outperform large-cap stocks, an equal-weighted index should outperform a cap-weighted index. This is\ndue to the equal-weighting magnifying the impact of small-cap returns and reducing the impact of large-cap returns relative to the impact those\nsectors would have on a cap-weighted index. The same is generally true when both small- and mid-cap stocks outperform large-cap stocks.\nThings to remember:\nEqual-weighted indexes understate the impact of large companies and overstate the impact of small companies relative to the way their returns\naffect capitalization-weighted (cap-weighted) index performance. Cap-weighted index returns are directly related to constituents' size, so a cap-\nweighted index will outperform an equal-weighted index of the same stocks when large-cap stocks outperform small-cap stocks.\nCompare the different weighting methods used in index construction", "qhtml": null}, {"n": 81, "q": "All else being equal, a decrease in the value of a price-weighted stock index most likely results when the value of its constituent company shares decreases due to a:", "opts": ["reconstitution.", "constituent company's stock splits.", "constituent company decreasing its cash dividend."], "ans": "C", "expl": "The value of a price-weighted index equals the sum of the market prices of the constituent stocks divided by the index divisor. Price returns on\na portfolio of index shares match index returns only when price changes reflect changes in the fundamental values of the constituent\ncompanies.\nA share price decline due to fundamental factors such as cash dividend reductions or lower expected earnings decreases a company's market\nvaluation and causes a lower index value. This is illustrated by the decrease in Stock X from index inception until the split in Stock Z, leaving the\nother stock prices unchanged.\nEvents that cause a lower sum of the index share prices but do not reduce the index value include:\nStock splits\nStock dividends (not cash dividends)\nIndex reconstitutions when the share price of the stock newly included in the index is lower than the share price of the stock being removed\nThese events are not connected to a decrease in the fundamental value of constituent companies. The index value is kept constant by a\nproportional reduction in the index divisor as illustrated above for a 4-for-1 split. The same process is used for reconstitutions (Choices A and B).\nThings to remember:\nDecreases in price-weighted index values should reflect decreases in the fundamental values of constituent companies. Stock (not cash)\ndividends and splits do not affect those values. Share price declines due to reduced cash dividends or lower expected earnings imply lower\ncompany valuations and result in lower index values.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 82, "q": "An index starts with a value of 100 and has the following returns over 3 years: Price Appreciation Income Year 1 4.0% 2.0% Year 2 8.0% 1.5% Year 3 −4.0% 2.0% If the index value is based on its total return, then its value at the end of Year 3 is closest to:", "opts": ["113.50", "113.75", "113.87"], "ans": "B", "expl": "The initial value of an index is decided at the index's initiation. Over time, the index's value will change with its returns. The return on an index\ncan be calculated using its price return or total return.\nPrice return reflects the price change of each constituent security.\nTotal return reflects both the price change and dividend or interest income of each constituent security.\nThe value of an index following multiple periods of returns is calculated as the geometrically linked (ie, compounded) return, since its value in\neach period is dependent on its value and return in prior periods. When calculating total return, price appreciation and income are added (not\ncompounded) for a given period since they occur over the same period.\nIn this question, the value of the index at the end of Year 3 is 113.75: 100(1.06)(1.095)(0.98). The value over time is shown in the image below:\n(Choice A) 113.50 results from summing, instead of compounding, the annual returns.\n(Choice C) 113.87 results from compounding, instead of adding, the annual returns from price appreciation and income.\nThings to remember:\nThe value of an index following multiple periods of returns must be calculated as the geometrically linked (ie, compounded) return. A total return\nindex reflects both the returns from price appreciation and income. These are added, not compounded, for a given period since they occur over\nthe same period.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 83, "q": "A mutual fund whose holdings are selected from a wide range of small-cap stocks compares its performance each year with that of the Russell 2000 Index. This is most likely an example of using a market index as a: ", "opts": ["benchmark for an actively managed portfolio.", "proxy for the small-cap asset class in an asset allocation model.", "way to understand market sentiment regarding small-cap stocks."], "ans": "A", "expl": "A market index is a collection of assets drawn from and intended to represent a larger group of assets; for example, the Russell 2000 Index\nconsists of 2,000 small-cap stocks that represent the stock of US small-cap companies. Initially, market indexes served as indicators of market\nsentiment, but their uses have evolved over time. Currently, indexes are used in five ways, as shown in the image above.\nA market index can be used as a benchmark for an actively managed portfolio. The performance of the portfolio over time is compared to the\nbenchmark index. Using the correct benchmark index is important. In this scenario, the actively managed mutual fund invests broadly in small-\ncap US companies; therefore, the Russell 2000 Index, which represents all US small-cap stocks, is an appropriate benchmark.\n(Choice B) When a market index is used as a proxy for an asset class in an asset allocation model, the index's historical returns are compared to\nthe historical returns of other indexes to determine the overall portfolio risk of a given allocation model. Allocation models (ie, blueprints for actual\nportfolios) are tailored for clients with a particular risk tolerance. In contrast, a benchmark is used to judge the performance of a similar portfolio\nafter an investment period is completed and the results are known.\n(Choice C) Using a market index to gauge market sentiment involves interpreting the performance of an index as a reflection of how investors\nfeel about the market. The index in this scenario is not used for that purpose.\nThings to remember:\nMarket indexes are used in five ways, including being used as benchmarks for actively managed portfolios.\nDescribe uses of security market indexes", "qhtml": null}, {"n": 84, "q": "A style index would most likely contain which of the following constituents?", "opts": ["The smallest 200 stocks in a region", "All consumer goods companies within a country", "A representation of indexes from countries deemed emerging markets"], "ans": "A", "expl": "Categories of equity indexes\nMost securities of an entire equity Russell 3000, Wilshire 5000\nBroad market\nmarket (both cover US equities)\nBlends indexes from different countries MSCI All Country World Index\nMulti-market\nProxy for regional or global investing and MSCI EAFE Index\nBased on same sector (eg, finance,\nhealth care)\nCan be different sizes (eg, large cap,\nSector European energy index\nsmall cap) and different styles (ie, value\nvs. growth)\nCan be national, regional, or global\nCan be different sectors\nBased on same size (eg, large cap) or\nStyle Asian large-cap index\nstyle (ie, value vs. growth)\nCan be national, regional, or global\nAn equity index is a collection of stocks based on a common element such as their style, sector, or geographical location. Multimarket indexes\ncan also be based on other indexes. An index is intended to indicate the aggregate performance of the category that it benchmarks.\nStyle indexes contain stocks of a single investment factor (eg, growth, value), similar size (eg, large cap, small cap), or combination of the two\n(eg, small-cap growth). These indexes can be regional or global and are intended to replicate common investing styles.\nStyle indexes based on size can use either an absolute size (eg, less than €1 billion market cap) or relative size (eg, smallest 100 public\ncompanies in the eurozone). In this question, a style index would most appropriately contain the smallest 200 stocks in a region since that is the\nonly constituent based on size or investment factor.\n(Choice B) All consumer goods companies within a country would be in a sector index, which is composed of companies that operate or compete\nin the same general type of business.\n(Choice C) A representation of indexes from countries deemed emerging markets would be in a multimarket index. Indexes of this type can be\nbased on specific geographic zones, stages of economic development (eg, emerging market), or global financial markets.\nThings to remember:\nStyle indexes contain stocks of a single investment factor, similar size, or combination of the two. These indexes are intended to replicate\ncommon investing styles. Style indexes based on size can use either absolute or relative size.\nDescribe types of equity indexes", "qhtml": null}, {"n": 85, "q": "Which of the following best describes the difference between the returns of a commodity index based on futures prices and the returns of the same commodities based on spot prices? ", "opts": ["The difference can be substantial.", "The difference is the risk-free rate.", "There is no effective difference due to arbitrage."], "ans": "A", "expl": "Commodity indexes as barometers of price changes\nIndex returns ≠ returns based on spot price\nchanges\nFutures and spot prices differ by benefits and\nVersus underlying cost of holding commodity\nspot price Prices must converge by expiration (ie,\ndelivery)\nReturns over time diverge due to initial\ndifference\nDifferent commodity price changes implied by\ndifferent indexes\nVersus other index Each index uses a different group of\nvalues commodities\nIndexes do not use the same weighting\nmethods\nMost commodity indexes' values are based on futures prices, not spot prices. Futures contracts have a limited life since they expire. As futures\ncontracts approach expiration, they are removed from the index and replaced by contracts with later expirations. Since longer-lived contracts\ntrade at different prices than those approaching expiration, the shift (ie, rolling over) of index positions results in price gains or losses not incurred\non a position in the underlying commodity (Choice C).\nFutures prices for different expirations diverge by the costs (eg, storage) and benefits (eg, convenience yield) of holding a position in the\nunderlying commodity over the time between expirations. Indexes do not have uniform rules for when positions are rolled over or the length of\ncontracts that replace those being removed. This causes the returns on the index to differ from the return implied by the underlying spot price due\nto:\nfutures price changes,\nrisk-free interest rates, and\nroll yield (ie, impact of different prices when positions are rolled over).\n(Choice B) The risk-free interest rate is only one of the factors that lead to the difference between index performance and returns implied by spot\nprice changes.\nThings to remember:\nMost commodity indexes' values are based on futures prices, not spot prices. Index returns differ from returns implied by spot price changes due\nto futures price changes, risk-free interest rates, and the roll yield.\nDescribe indexes representing alternative investments", "qhtml": null}, {"n": 86, "q": "The divisor used to calculate the value of a price-weighted stock index is most appropriately adjusted if a constituent company's stock:", "opts": ["splits.", "appreciates.", "pays a cash dividend."], "ans": "A", "expl": "The value of a price-weighted index is the sum of the market prices of the constituent stocks divided by the index divisor. The initial divisor is\nusually either the number of stocks in the index or a divisor that results in a round number (eg, 1,000) as the initial index value. Use of a round\nnumber makes the index return since inception easier to quantify. In the example above, an initial divisor of 0.87 would cause the three-stock\nsample index to have an initial value of 100.\nPrice-weighted index divisors are adjusted to prevent the index value from being impacted by stock price changes that do not reflect changes\nin the fundamental values of the component companies. This makes an index's value over time more easily comparable. Divisors are adjusted\nfor:\nStock splits\nStock dividends\nIndex reconstitutions (ie, changes to constituent stocks).\nThe divisor adjustment for stock splits is illustrated above. A similar process is followed when adjusting for stock dividends and index\nreconstitutions.\n(Choice B) Price appreciation of a constituent stock increases the value of a price-weighted stock index but does not impact the index divisor.\n(Choice C) All else equal, stock prices fall by the amount of cash dividends paid; therefore, cash dividends impact the value of a price-weighted\nindex but do not affect the divisor.\nThings to remember:\nPrice-weighted index divisors are adjusted for stock splits, stock dividends, and index reconstitutions (ie, changes to constituent stocks). The\nadjustments prevent the index value from being impacted by stock price changes that do not reflect changes in the fundamental values of the\ncomponent companies, improving comparability over time.\nCompare the different weighting methods used in index construction", "qhtml": null}, {"n": 87, "q": "Which of the following best describes security market indexes? Security market indexes:", "opts": ["are valued no more often than daily.", "can only be valued using actual asset prices.", "represent a security market, market segment, or asset class."], "ans": "C", "expl": "Characteristics of security market indexes\nRepresent and track the value of a given security market, market\nsegment, or asset class\nTypically constructed as a portfolio of marketable securities\nValued on a regular basis using actual or estimated prices of\nconstituent securities\nA security market index (eg, S&P 500, Hang Seng) is a representation of specified security market, a market segment, or an asset class.\nIndexes can be designed to represent a broad universe of securities (eg, the equity market) or a narrow subsection of a specific security market\n(eg, U.S. mid-cap growth stocks).\nAn index is usually constructed and managed as a portfolio of individual marketable securities (ie, constituent securities). The value of an\nindex is the combination of the value of the constituent securities, weighted by the creator of the index. The securities may represent nearly all of\nthe index's universe or just a sample.\n(Choice A) Security market indexes are valued on a regular basis. Most high-profile indexes are updated in real time as the prices of the\nunderlying securities update.\n(Choice B) Security market indexes can be valued using constituent securities' estimated prices when actual prices are not available. Estimated\nprices are more likely to be used for assets that are not priced regularly or are illiquid (eg, bonds).\nThings to remember:\nA security market index is usually constructed as a portfolio of individual marketable securities to represent a security market, a market segment,\nor an asset class. It can represent a broad security market or a narrow subsection of a market.\nDescribe a security market index", "qhtml": null}, {"n": 88, "q": "An exchange-traded fund (ETF) has been created to replicate the performance of a broad market index. In the design of the ETF, the index was most likely used as a: ", "opts": ["model portfolio.", "asset class proxy.", "performance benchmark."], "ans": "A", "expl": "Investment management companies create index funds, including mutual funds and exchange-traded funds (ETFs), to track indexes. ETFs and\nmutual funds contain similar index-based portfolios, but ETFs are more liquid since they trade like equities.\nBy design, the ETF in this scenario uses the index as a model portfolio. It either holds all securities in proportion to their index weights or uses\nstatistical techniques to identify a subset of securities whose returns will replicate index returns. Once established, the ETF attempts to match the\nreturns on its model index.\n(Choice B) Indexes are used as asset class proxies in asset allocation models, providing historical data for model inputs.\n(Choice C) Indexes are used as performance benchmarks to assess actively managed portfolio returns. Index funds are passive investments;\nmanagers try to minimize any divergence between portfolio and model index returns (ie, tracking error).\nThings to remember:\nInvestment management companies create index funds, including mutual funds and exchange-traded funds (ETFs), to track indexes. By design,\nthe ETF in this scenario uses the index as a model portfolio. Once established, an ETF attempts to match the returns on its model index.\nDescribe uses of security market indexes", "qhtml": null}, {"n": 89, "q": "An analyst uses the return on the Tokyo Stock Price Index over the last 10 years as an input to the CAPM to determine the expected return of a stock. This is an example of using a securities market index as a(n):", "opts": ["indicator of market sentiment.", "model portfolio for investment products.", "proxy to model risk, return, or risk-adjusted performance."], "ans": "C", "expl": "A market index is a collection of assets intended to represent a larger group of assets. The Tokyo Stock Price Index (TOPIX) is a group of nearly\n2,000 stocks that represents the entire Japanese stock market. Initially, market indexes served as indicators of market sentiment, but their uses\nhave evolved over time. Currently, indexes are used in five different ways, listed above.\nOne such use is to model risk, return, or risk-adjusted performance. The CAPM is used to model the expected return of a stock based on its beta,\nthe market portfolio's expected return, and the risk-free rate. Since the market portfolio consists of every risky asset, measuring its return is not\npossible. The analyst in this scenario uses the return on the TOPIX as a proxy for the market portfolio return. This allows the analyst to model\nthe expected return of the stock.\n(Choice A) Market indexes are often used as indicators of market sentiment; analysts look at up or down trends to understand how most\ninvestors feel about the overall market or a particular asset class. However, in this scenario, the index return is used as a proxy for the return on\nthe market to calculate a stock's expected return using the CAPM.\n(Choice B) Some mutual funds and exchange-traded funds (ETFs) are designed to mimic the performance of indexes. For example, the iShares\nTOPIX ETF aims to track the performance of the TOPIX. However, in this scenario, there is no product being created to perform like the index.\nThings to remember:\nThere are five uses of market indexes. An analyst may use a broad market index as an input to a pricing model to calculate a stock's expected\nreturn. This scenario is an example of using a market index as a proxy to model risk, return, or risk-adjusted performance.\nDescribe uses of security market indexes", "qhtml": null}, {"n": 90, "q": "Two market-cap weighted indexes are created with the same stocks and stock weights, one as a total return index and one as a price return index. If the stocks repurchase shares instead of paying dividends, after 1 year, which index will most likely have the greater return?", "opts": ["The total return index", "The price return index", "The indexes will have the same return"], "ans": "C", "expl": "Return indexes\nPrice return Total return\nReflects only prices of securities Reflects both prices and income of securities\nEqual to total return if no securities Greater than price return if securities generate\ngenerate income income\nThe return on an index can be calculated as a price return index or a total return index.\nA price return index reflects the price change of each constituent security.\nA total return index reflects both the price change of each constituent security and any dividend and/or interest income from that security.\nThe difference between a total return index and a price return index is the return on dividend and/or interest income.\nThe value of share repurchases is reflected in a stock's price. Repurchases have the same effect on both types of return index since they both\ncapture price changes. In this scenario, the two indexes have the same constituent stocks held in the same proportions, and no dividends are\npaid; therefore, they will have the same return (Choices A and B).\nThings to remember:\nA price return index reflects the change in price of each constituent security, while a total return index also includes any income (eg, dividends,\ninterest) from the securities. Share repurchases are reflected in a stock's price and price changes are captured by both price return and total\nreturn, repurchases would have the same effect on both return measures.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 91, "q": "Changing the constituent stocks in a broad market index to reflect changes in the relative economic importance of different industry sectors is best described as a:", "opts": ["rebalancing.", "reconstitution.", "reorganization."], "ans": "B", "expl": "Index construction requires decisions regarding three characteristics: target market (eg, sector or asset class), security selection (eg,\nrepresentative stocks), and weighting (ie, portion of index in each security). Once created, the index must be managed over time to maintain\nconsistency with the characteristics established at index construction. Index management actions are categorized as:\nRebalancing: adjusting the weights of constituent securities to maintain consistency with index weighting methodology\nReconstitution: adding and/or removing securities to maintain consistency with the target market\nSecurities are added or removed for a variety of reasons: new exchange listings or delistings, whether securities newly meet or no longer meet\nindex criteria, or companies no longer existing due to acquisitions or bankruptcies. Some indexes (eg, S&P 500) are designed to reflect the\nrelative importance of different industry sectors. Selection committees sometimes alter index composition to reflect shifts in economic\nsignificance. Changes in the constituent stocks for these reasons are characterized as a reconstitution.\n(Choice A) Rebalancing refers to changes in the weights given to the constituent securities. Index reconstitution sometimes necessitates\nrebalancing, but the two are separate aspects of index management.\n(Choice C) Reorganization is not used to describe actions related to index management. It describes certain corporate restructurings related to\nbankruptcies.\nThings to remember:\nRebalancing and reconstitution are two aspects of index management. Rebalancing is adjusting the weights of constituent securities.\nReconstitution is adding and/or removing securities to maintain consistency with the target market.\nDescribe rebalancing and reconstitution of an index", "qhtml": null}, {"n": 92, "q": "An analyst designing a security market index who wants to minimize the need to actively rebalance the index would most appropriately choose: ", "opts": ["price weighting.", "equal weighting.", "float-adjusted market-capitalization weighting."], "ans": "A", "expl": "Security index rebalancing\nActive rebalancing\nIndex weighting method Rationale\nfrequency\nWeights adjust as asset prices\nPrice weighting Never\nchange\nAny price changes result in\nEqual weighing Periodically\nunequal weights\nFloat-adjusted market- Adjusted to reflect holdings of\nPeriodically\ncapitalization weighting controlling shareholders\nIndex design entails assigning weights to constituent securities. Price weighting, equal weighting, and float-adjusted market-capitalization\nweighing are the three most common methods. As index constituents and prices change over time, an index may need to be rebalanced to\nmaintain its weighting. Each weighting method has different rebalancing requirements to maintain consistency with the index's weighting.\nPrice-weighted indexes require no active rebalancing. The weight of each constituent security is based on its price, so weights automatically\nadjust as prices change. Ease of maintaining the index over time (ie, managing the index) is a major advantage of price weighting.\n(Choice B) Equal weighting assumes an equal value is invested in each constituent security at index inception. Any price changes result in the\nweights no longer being equal. Equal weighting generally requires the most frequent rebalancing.\n(Choice C) Float-adjusted market-capitalization weighting is based on the market value (ie, number of shares × market price per share) of the\nshares available to public investors. Those are the shares not held by controlling shareholders or other corporations. Periodic adjustments are\nmade to the number of shares to account for transactions by controlling shareholders.\nThings to remember:\nPrice weighting, equal weighting, and float-adjusted market-capitalization weighing are three common index weighting methods. Price-weighted\nindexes require no active rebalancing. The weight of each constituent security is based on its price, so weights automatically adjust as prices\nchange.\nDescribe the choices and issues in index construction and management", "qhtml": null}, {"n": 93, "q": "The weight of individual stocks in a float-adjusted market capitalization–weighted index is most likely based on:", "opts": ["shares sold to investors through public offerings.", "issued shares less shares repurchased by the company.", "outstanding shares less shares owned by controlling shareholders."], "ans": "C", "expl": "Market capitalization weighting accurately reflects the relative market values of an index's constituent stocks. It also accurately captures the\nchange in the market value of the entire index when constituent stock prices change. However, market capitalization–weighted indexes may not\nbe best for measuring changes in value of shares available for investors to trade. Float-adjusted market capitalization weighting attempts to\naddress this issue.\nControlling shareholders are individual or institutional investors with significant holdings of a company's stock. These are not passive investments\nbut are used to influence a company's strategic direction or to exercise outright control (eg, elect members of the board, select senior managers).\nConsequently, controlling shareholders are unlikely to sell their holdings. Float-adjusted market capitalization weighting uses the shares available\nto public investors (ie, outstanding shares less shares owned by controlling shareholders) to establish the weights of constituent stocks. Most\nmajor market capitalization–weighted indexes are float adjusted.\n(Choice A) Shares sold to investors through public offerings are only a portion of issued shares and are not the basis for float-adjusted market\ncapitalization weighting. Adjustments for other share distributions (eg, private placements), treasury stock, and controlling shares are used to\ndetermine the float-adjusted market capitalization.\n(Choice B) Issued shares less shares repurchased by the company (ie, treasury stock) equals the number of shares outstanding. The market\nvalue of the outstanding shares is a company's market capitalization and the basis for weighting market capitalization–weighted indexes, not float-\nadjusted market capitalization–weighted indexes.\nThings to remember:\nFloat-adjusted market capitalization weighting uses the shares available to public investors (ie, outstanding shares less shares owned by\ncontrolling shareholders) to establish the weights of constituent stocks in an index.\nCompare the different weighting methods used in index construction", "qhtml": null}, {"n": 94, "q": "The performance of which of the following indexes for alternative investments is most likely to reflect the spot prices of the asset class it represents?", "opts": ["Hedge fund index", "Commodities index", "Real estate investment trust index"], "ans": "C", "expl": "Although the larger category of real estate indexes (ie, indexes that include directly owned real estate) can suffer from pricing problems due to\ninfrequent transaction information and illiquid assets, real estate investment trust (REIT) indexes are based on publicly traded securities and\ntherefore reflect current prices.\n(Choice A) Since hedge funds are required to report performance only to their investors, funds that perform poorly or fail may not report results to\nthe index. This leads to survivorship bias. Moreover, differences in the composition of hedge fund indexes precludes their use as a representative\nof the hedge fund asset class.\n(Choice B) Commodities indexes are based on futures contracts, which differ from commodities' spot prices. The result is that index returns do\nnot reflect changes in commodity spot prices.\nThings to remember:\nReal estate investment trust (REIT) indexes reflect the prices of publicly traded REITs. Hedge fund indexes and commodities indexes may reflect\nperformance that diverges greatly from the prices of their represented asset classes.\nDescribe indexes representing alternative investments", "qhtml": null}, {"n": 95, "q": "Which of the following types of preferred stock is least likely to share in a company's operating performance?", "opts": ["Cumulative", "Convertible", "Participating"], "ans": "A", "expl": "Types of preference shares (preferred stock)\nCumulative Accrues for past dividends that are unpaid\nNoncumulative Does not accrue dividends that are undeclared and unpaid in past periods\nParticipating Allows for additional dividend payments if company profits exceed a certain threshold\nNonparticipating Fixed dividend; no additional payments based on company performance\nConvertible Can convert into a specified number of common shares\nCallable Allows issuer to buy back shares from investors for a specified price\nPutable Allows investors to sell shares back to issuer for a specified price\nCommon shareholders may participate in a company's operating performance by sharing in its increasing (decreasing) profits, either through:\nincreasing (decreasing) dividend payouts or\ncapital gains (losses) in the company's (and stock's) value.\nIn contrast, preferred shareholders normally do not participate directly in the company's operating performance since the preferred dividend\nis fixed at issuance, which in effect fixes the shares' value (based on discounted cash flows). Types of preferred shares include cumulative,\nconvertible, and participating.\nFor cumulative preferred shares, unpaid dividends accumulate and eventually must be paid. When the omitted dividends are paid, the \"catch-\nup\" payment(s) may be larger than the usual periodic payment based on the stated fixed rate. However, there is no change to the rate itself,\nwhich is fixed at issuance, so cumulative preferred shareholders do not share in the company's operating performance.\n(Choice B) Convertible preferred shares are convertible to the company's common shares. If the value of the common shares increases\n(decreases), based on company performance, the value of the preferred shares will also increase (decrease) as the option to convert to common\nshares becomes more (less) valuable. In that way, holders of convertible preferred shares also share in the company's performance.\n(Choice C) Participating preferred shares pay dividends that exceed the stated rate if the company's profits surpass levels specified at issuance,\nallowing shareholders to share in the company's operating performance.\nThings to remember:\nUnlike common shareholders, preferred shareholders normally do not participate directly in a company's operating performance since the\npreferred dividend (and thus share value) is fixed at issuance. Convertible and participating preferred stockholders share in a company's\noperating performance through the possibility of converting to common shares or through expanded dividends.\nDescribe market efficiency and related concepts, including their importance to investment practitioners", "qhtml": null}, {"n": 96, "q": "A stock exchange opens in a country that previously had only over-the-counter equity trading. All else being equal, stock market efficiency will most likely: ", "opts": ["increase.", "decrease.", "remain the same."], "ans": "A", "expl": "Factors that increase\nmarket efficiency\nFair and orderly markets\nLow cost of information gathering\nCompany financial disclosure\nInvestment by foreigners permitted\nArbitrage and short selling\nLow transaction costs\nAvailability of daily market data\nExistence and prevalence of exchanges\nLarge number of analysts and investors\nIn an efficient market, information is reflected quickly in asset prices. Factors that increase participants' speed and ease of access to information\nfacilitate faster price adjustments and increase market efficiency.\nIn over-the-counter (OTC) markets, dealers negotiate trades among themselves, and other market participants may not be informed of details.\nSome dealers may choose to withdraw from trading altogether. These factors may limit data availability, increasing information cost and\ndecreasing market efficiency (Choice B).\nMajor exchanges, having many investors and listed companies, also have greater analyst coverage than OTC markets. Trade data is\nimmediately reported and easily obtained. Adding an exchange to a market increases trading volume and lowers information cost. These\nchanges cause market efficiency to rise (Choice C). OTC markets are not exchanges.\nThings to remember:\nExchanges create greater market efficiency than over-the-counter markets. Efficient markets imply information quickly reflected in asset prices.\nData availability, the presence of many analysts and investors, low information-gathering cost, and exchanges tend to increase market efficiency.\nExplain factors that affect a market’s efficiency", "qhtml": null}, {"n": 97, "q": "The semi-strong form of the efficient market hypothesis assumes that security prices fully reflect:", "opts": ["only publicly available information.", "both public and private information.", "only historical price and volume information."], "ans": "A", "expl": "Market efficiency is determined based on how quickly and completely information is reflected in asset prices. The efficient market hypothesis\ndefines three forms of market efficiency:\nThe weak form assumes that asset prices reflect only historical market data (eg, price and volume data) (Choice C).\nThe semi-strong form assumes that asset prices reflect all historical market data plus all publicly available information (eg, financial\ndata). New public information is quickly assimilated into prices.\nThe strong form assumes that asset prices reflect all of the information assumed by the weak and semi-strong forms. In addition, it\nassumes that prices reflect material, nonpublic information (eg, information known to management or other insiders) (Choice B).\nIn a semi-strong market, it is difficult, if not impossible, for investors to consistently achieve abnormal returns without nonpublic information.\nThings to remember:\nMarket efficiency is determined based on how quickly and completely information is reflected in asset prices. The efficient market hypothesis\ndefines three forms of market efficiency: weak, semi-strong, and strong. The semi-strong form assumes that stock prices reflect all publicly\navailable information.\nContrast weak-form, semi-strong-form, and strong-form market efficiency", "qhtml": null}, {"n": 98, "q": "An investor pursues a strategy of: selling stocks whose total return over the past 3 years has outperformed the market and buying stocks whose total return has underperformed the market over the same period. This investor is most likely attempting to earn abnormal returns based which of the following market anomalies?", "opts": ["Value effect", "Earnings surprise", "Overreaction effect"], "ans": "C", "expl": "The overreaction effect is a type of momentum market anomaly. The premise of this anomaly is that investors overreact to the release of\nunexpected public information and that abnormal returns can be earned by a strategy contrary to the overreaction.\nFor example, investors may form a consensus about a company's expected earnings per share (EPS). However, if EPS is lower than expected,\nthe investors are likely to sell the stock and to buy it when EPS is higher than expected (ie, earnings surprise anomaly) (Choice B). Investing\nstrategies based on earnings surprises tend to be short term and trend following.\nThe overreaction effect occurs because investors tend to overreact to unexpected news, not only selling (or buying) stock with disappointing (or\nencouraging) earnings but also overselling (or overbuying) it.\nIn response, an investor could buy the stock that reported lower-than-expected EPS, which is now oversold and underpriced, and sell the stock of\nthe company that reported higher-than-expected EPS, which is now overbought and overpriced. This contrarian strategy, whereby investors buy\nstocks that have underperformed over a 3- to 5-year period and sell stocks that have outperformed during the same period, assumes the\nperformance is based on investor overreactions.\n(Choice A) The value effect anomaly refers to the concept that value stocks (eg, those with below-average P/E ratios and above-average\ndividend yields) outperform growth stocks over a long period. It is unrelated to investor reactions to unexpected information.\nThings to remember:\nThe overreaction effect is a market anomaly characterized by investor overreaction to the release of unexpected public information. The strategy\nin response is to buy stocks that have underperformed the market and sell stocks that have outperformed the market.\nDescribe market anomalies", "qhtml": null}, {"n": 99, "q": "If securities markets are semi-strong-form efficient, this most likely implies that:", "opts": ["they are not weak-form efficient.", "passive management will outperform active management.", "passive managers can beat the market on a consistent basis."], "ans": "B", "expl": "The efficient market hypothesis (EMH) sets forth three forms of market efficiency: weak, semi-strong, and strong. Under semi-strong-form EMH,\nall publicly available information is reflected in asset market prices. Empirical evidence suggests that developed financial markets are semi-\nstrong-form efficient. Since regulations prevent the use of nonpublic information that would influence stock prices, markets are not strong-form\nefficient.\nActive portfolio management normally uses fundamental analysis as the basis for decisions to buy or sell securities. However, semi-strong-form\nEMH implies active portfolio management would be futile since asset prices already reflect all publicly available information.\nActive portfolio management incurs higher transaction and information acquisition costs than passive management, which instead seeks to\nemulate the performance of an index. As a result, the semi-strong-form EMH implies that passive management will, on average, outperform\nactive portfolio management.\n(Choice A) If a market is semi-strong-form efficient, all publicly available information is reflected in prices, including historical market data. Thus,\nall markets that are semi-strong-form efficient are also said to be weak-form efficient.\n(Choice C) The implication of semi-strong-form efficiency for actual markets is that active portfolio managers cannot beat the market on a\nconsistent basis. Passive managers generally try to replicate market index returns, not beat them. This answer is not an implication of semi-\nstrong-form EMH.\nThings to remember:\nUnder the semi-strong-form efficient market hypothesis (EMH), all publicly available information is reflected in asset market prices. Active\nmanagement incurs higher transaction and information gathering costs than passive management. Semi-strong-form EMH implies that passive\nportfolio management will, on average, outperform active portfolio management.\nExplain the implications of each form of market efficiency for fundamental analysis, technical analysis, and the choice between active and passive\nportfolio management", "qhtml": null}, {"n": 100, "q": "A novice investor experienced poor returns with two small-cap stocks of companies that eventually went bankrupt. Recently, an investment professional recommended a new small-cap stock backed by strong financial results and growth projections. The investor immediately dismissed the recommendation, stating, \"Not another small-cap stock—it's going to make me lose money again!\" The investor's behavioral bias is best described as:", "opts": ["survivorship.", "mental accounting.", "representativeness."], "ans": "C", "expl": "Common behavioral finance biases\nLoss aversion Disliking losses more than one appreciates gains of equal magnitude\nMental accounting Separating wealth into different mental buckets with different risk and return expectations\nOverconfidence Being overconfident in one's ability to estimate prices and select stocks\nHerding Following and mimicking the decisions of the masses\nMaking oversimplified assessments on new information based on conclusions drawn from past experiences (eg,\nRepresentativeness\nstereotypes)\nConservatism Reluctance to accept new information and clinging to past views\nFocusing on issues in isolation instead of considering the broader context in conjunction with other interrelated\nNarrow framing\nfactors\nBehavioral finance is the study of how behavioral biases often lead to irrational decision making. In this question, the investor exhibits the bias of\nrepresentativeness, which is characterized by making overly simplified associations based on past experiences. Due to poor past returns on\ntwo small-cap stocks, the investor believes that small-cap stocks represent poor investment choices.\nWith investing, representativeness may lead to irrational decisions. Investors may apply quick judgments based on past associations instead of\nanalyzing information according to the proper context.\n(Choice A) Survivorship is a statistical sampling bias, not a behavioral bias. This bias stems from excluding the performance of failed companies\nin the calculation of fund returns. Survivorship often leads to overinflated reported fund performance.\n(Choice B) Mental accounting refers to separating wealth into different mental buckets with different goals. There is no indication that the\ninvestor is separating wealth into different buckets in this question.\nThings to remember:\nRepresentativeness is characterized by making overly simplistic associations based on past experience instead of analyzing situations according\nto the proper context.\nDescribe behavioral finance and its potential relevance to understanding market anomalies", "qhtml": null}, {"n": 101, "q": "Which of the following market anomalies is inconsistent with semi-strong form market efficiency?", "opts": ["Initial public offering", "Earnings surprise effect", "Closed-end fund discount"], "ans": "B", "expl": "The theory of semi-strong form market efficiency holds that market prices contain all publicly available information. One consequence of this\ntheory is that investors cannot achieve abnormal returns without using material, nonpublic information. Market anomalies are persistent market\nevents that are inconsistent with semi-strong form efficiency, that is, price changes that cannot be explained by available or newly released\npublic information.\nThe earnings surprise anomaly is due to the lack of a complete and immediate price adjustment to unexpected news from an earnings report.\nSince there is a lag between the release of the earnings report (which becomes public information) and the subsequent price adjustment, it is\npossible to generate abnormal returns for a short time. This is inconsistent with semi-strong form market efficiency.\n(Choice A) The initial public offering (IPO) anomaly indicates that, on average, investors purchasing shares through an IPO may be able to earn\nshort-term abnormal profits. IPOs are frequently underpriced, allowing investors to earn abnormal returns; however, market prices adjust quickly,\nsupporting semi-strong market efficiency.\n(Choice C) A closed-end fund discount is the persistent 4–10% discount to net asset value (NAV) observed in these funds' prices. The discount\ndoes not result in abnormal returns due to transaction costs, liquidity, and the potential for NAV miscalculations.\nThings to remember:\nA market anomaly is a market event that is inconsistent with efficient market theory. The earnings surprise anomaly is inconsistent with semi-\nstrong form market efficiency theory due to the short lag between the release of public information and the subsequent price adjustment.\nDescribe market anomalies", "qhtml": null}, {"n": 102, "q": "An investor holds a company's stock, believing its price will increase based on forecasts produced by a proprietary model. Following the latest earnings release, the investor updates the model and believes that the stock is overvalued and the price will decrease. However, the stock rises following earnings. Seeing this, the investor decides to hold the stock. The investor's behavior is best described as:", "opts": ["herding.", "loss aversion.", "conservatism."], "ans": "A", "expl": "Common behavioral finance biases\nPsychological impact of gains and losses is asymmetric\nLoss aversion Associated with market overreaction\nFear of continued losses compels investors to sell\nInvestors create separate psychological \"buckets\"\nMental accounting\nInvestors think and act differently within these buckets\nInvestors overestimate their own research, analysis, and stock\nOverconfidence selection abilities\nPrevalent with high-growth stocks\nBuying and selling decisions are based primarily on following the\nHerding crowd\nClustering behavior, not necessarily based on information\nBehavioral finance attempts to explain investment decision making by studying investors' behaviors. In part, it involves understanding various\nbiases that cause investors to act irrationally, which can lead to pricing anomalies. The herding bias suggests that investors may irrationally\nignore their own analysis and instead trade on the same side of the market and/or securities as other investors. This can lead to either\noverreaction or under-reaction in the market.\nIn this scenario, the investor exhibits the herding bias. Based on research, the investor begins to believe that an invested stock is overvalued and\nits price will decrease, and so intends to sell the stock. However, the investor instead decides to hold the stock after seeing that other investors\nare buying or holding it.\n(Choice B) Loss aversion refers to investors' tendencies to dislike losses more than they like gains of equal magnitude. Since this investor\nbelieves the stock is overvalued, loss aversion would most likely drive the investor to sell the stock.\n(Choice C) Conservatism refers to investors' tendencies to delay updating their views and forecasts based on new information and instead\nmaintain prior views and forecasts. This investor updated the proprietary model with new information, an action that does not exhibit\nconservatism.\nThings to remember:\nBehavioral finance studies how investors behave to better understand their decision making, including biases that cause them to act irrationally.\nThe herding bias suggests that investors may irrationally ignore their own analysis and instead trade on the same side of the market and/or\nsecurities as other investors.\nDescribe behavioral finance and its potential relevance to understanding market anomalies", "qhtml": null}, {"n": 103, "q": "Which of the following is most likely to decrease market efficiency?", "opts": ["Limiting arbitrage", "Enforcing fair markets", "Permitting foreign investment"], "ans": "A", "expl": "Factors that increase\nmarket efficiency\nFair and orderly markets\nLow cost of information gathering\nCompany financial disclosure\nInvestment by foreigners permitted\nArbitrage and short selling\nLow transaction costs\nAvailability of daily market data\nExistence and prevalence of exchanges\nLarge number of analysts and investors\nIn an efficient market, new information is reflected quickly in asset prices. Factors that are likely to increase market efficiency increase the speed\nat which participants receive new information, allow more rapid valuation and trading, and facilitate rapid price adjustments. Therefore arbitrage,\nwhich tends to increase the speed that prices adjust to new information, ensures market efficiency.\nArbitrage is the riskless, simultaneous buying and selling of the same or equivalent instruments in one or more markets to exploit mispricing. As\narbitrage occurs, prices of equivalent financial instruments move toward the same price. The speed at which this occurs depends on arbitrage in\nthe market, so if arbitrage is constrained, market efficiency is reduced.\n(Choice B) In fair and orderly markets, a greater number of participants have access to information used to perform valuations and make trades.\nMore trading means asset prices adjust to new information more quickly. As a result, promoting fair and orderly markets tends to increase, not\ndecrease, market efficiency.\n(Choice C) If the number of investors is restricted, there will be less trading. Therefore, if the number of investors—or the number of a certain\ntype of investors (eg, foreigners)—is limited, market efficiency will decrease. Inversely, permitting foreign investment (ie, allowing a greater\nnumber of investors) is likely to increase market efficiency.\nThings to remember:\nAn efficient market is one in which new information is reflected quickly in asset prices. Arbitrage facilitates rapid price adjustments that increase\nmarket efficiency. Enforcing fair and orderly markets, having many analysts and investors, and permitting investment by foreigners are factors that\ntend to increase market efficiency.\nExplain factors that affect a market’s efficiency", "qhtml": null}, {"n": 104, "q": "The semi-strong efficient market hypothesis implies abnormal returns may be consistently achieved by acting on:", "opts": ["inside information.", "publicly available information.", "nonmaterial nonpublic information."], "ans": "A", "expl": "The efficient market hypothesis (EMH) specifies three forms of market efficiency: weak, semi-strong, and strong. Under the weak-form efficient\nmarket hypothesis, only historical market data is reflected in prices. Under the semi-strong form, all publicly available information is reflected\nin prices, including both historical market data and other sources of publicly available information (eg, companies' financial statements). Strong-\nform EMH states that all information, public and private, is reflected in prices.\nInside information is another name for material nonpublic information. Semi-strong EMH holds that all public information is included in prices.\nHowever, because material, nonpublic information is not reflected in prices under this form, trading on it may in fact produce consistent, abnormal\nreturns. Trading on such information is illegal in most countries.\n(Choice B) If all publicly available information is reflected in prices, then it is not possible for an investor to benefit from a change in price due to\nthe new public information. According to semi-strong EMH, earning consistent, abnormal returns based on publicly available information is not\npossible.\n(Choice C) The semi-strong EMH does not imply anything about nonmaterial nonpublic information. In addition, nonmaterial information is\ndefined as information that does not affect asset prices, so acting on nonmaterial information would not benefit an investor because it would not\nchange an asset's price.\nThings to remember:\nThe efficient market hypothesis (EMH) specifies three forms of market efficiency: weak, semi-strong, and strong. Semi-strong EMH holds that\nconsistently earning abnormal returns based on publicly available information is not possible since asset prices in the market already reflect the\ninformation.\nContrast weak-form, semi-strong-form, and strong-form market efficiency", "qhtml": null}, {"n": 105, "q": "An analyst forecasts current year EPS of $0.21 for an equipment manufacturing company. During the middle of the year, the company announces that it is experiencing unforeseen supply chain issues that will severely reduce its earnings. The analyst re-issues the original EPS forecast of $0.21, citing that the company always had strong fundamentals. This behavior is best explained as:", "opts": ["conservatism.", "loss aversion.", "mental accounting."], "ans": "A", "expl": "Common behavioral finance biases\nLoss aversion Disliking losses more than one appreciates gains of equal magnitude\nMental accounting Separating wealth into different mental buckets with different risk and return expectations\nOverconfidence Being overconfident in one's ability to estimate prices and select stocks\nHerding Following and mimicking the decisions of the masses\nMaking oversimplified assessments on new information based on conclusions drawn from past experiences (eg,\nRepresentativeness\nstereotypes)\nConservatism Reluctance to accept new information and clinging to past views\nFocusing on issues in isolation instead of considering the broader context in conjunction with other interrelated\nNarrow framing\nfactors\nBehavioral finance is the area of study that examines how behavioral biases influence investment decisions. Often, biases lead to irrational\ndecision-making. Conservatism bias occurs when individuals are reluctant to accept new information and instead adhere strictly to past\ninformation. In this scenario, the analyst refuses to revise the previous EPS forecast of $0.21 despite receiving updated information on supply\nchain disruptions that will decrease earnings.\n(Choice B) Loss aversion refers to investors' tendency to dislike losses more than they like gains of equal magnitude.\n(Choice C) Mental accounting refers to investors separating wealth into different mental buckets to fulfill different goals.\nThings to remember:\nConservatism bias occurs when investors are reluctant to accept new information and instead adhere strictly to past information.\nDescribe behavioral finance and its potential relevance to understanding market anomalies", "qhtml": null}, {"n": 106, "q": "An investor observes that a portfolio manager with a proven record of profitable investing has reduced its holdings in a stock that the investor currently owns and for which the investor has a large unrealized gain. Many other investors sold the stock after the portfolio manager's sales. The investor believes that the stock's long-term prospects are still good but decides to sell the stock anyway. The investor's behavior is most likely the result of:", "opts": ["herding.", "risk aversion.", "information cascades."], "ans": "C", "expl": "Information cascades\nMostly associated with overreaction\nPremised on actions by informed participants that\ninfluence others' decisions\nGreater when information about a company is poor\nCan enhance market rationality when others imitate the\npreceding actions of knowledgeable participants\nBehavioral finance examines investor psychology to explain why and how investors do not always act rationally. Herding and information\ncascades are behavioral theories that explore why investors often imitate other investors. Both theories are characterized by investors trading on\nthe same side of the market and/or in the same securities, as well as investors ignoring their own beliefs to act in concert with others.\nWhile information cascades are premised on the initial actions of knowledgeable (ie, informed) participants, herding is not necessarily based on\ninformation. In an information cascade, the actions of informed participants influence the decisions of subsequent actors.\nIn this scenario, the investor's decision to sell is based on the prior action of a portfolio manager perceived to be more knowledgeable, despite the\ninvestor's belief in the stock's long-term prospects. The decision is also based on the imitating actions of others prior to the investor's decision.\nThese actions are more consistent with information cascades than with herding (Choice A).\n(Choice B) Risk aversion describes investors wanting higher expected returns to compensate for assuming more risk. Nothing in this question\naddresses the riskiness of the stock that the investor sells.\nThings to remember:\nBehavioral finance attempts to explain how and why investors do not always act rationally. Herding and information cascades are similar in that\ninvestors trade on the same side of the market and/or in the same securities. However, information cascades presume that the initial actions of\nknowledgeable participants influence the actions of others. Herding may or may not be based on information.\nDescribe behavioral finance and its potential relevance to understanding market anomalies", "qhtml": null}, {"n": 107, "q": "A high-growth stock soars 300% over a two-year period. After conducting due diligence, an investor buys the stock, which subsequently underperforms the market by 40% over a short period of time. The investor believes the market is pricing the stock irrationally and continues to hold it. Based on the information provided, which of the following biases is best exemplified by the investor's behavior?", "opts": ["Risk aversion", "Overconfidence", "Mental accounting"], "ans": "B", "expl": "Behavioral finance is based on the idea that mental biases cause individuals to make recurring suboptimal investing decisions, which lead to\nobserved pricing anomalies. Overconfidence bias is rooted in the idea that investors overestimate their own research, analytical, and\nselection abilities.\nIn this scenario, the investor is confident of a company's valuation and investment prospects and emotionally invested in an outcome that confirms\nthe original analysis. When confronted with new facts (ie, substantial stock price decline) that undermine this confidence, the investor dismisses\nthe new facts as market irrationality.\nHigh-growth stocks can encourage overconfidence bias since investors may become overly optimistic regarding a company's long-term\nprospects. As collective overconfidence peaks, investors often have difficulty believing the stock is overvalued.\n(Choice A) Risk aversion is not a specific behavioral finance bias; rather, it is an investor's general tendency to prefer less risk and require higher\nexpected returns to take on additional risk.\n(Choice C) Mental accounting is observed when investors segregate different investments into separate mental \"accounts,\" and treat them\ndifferently as a result.\nThings to remember:\nOverconfidence bias is rooted in the idea that investors overestimate their own research and stock selection abilities and is most common with\nhigh-growth stocks.\nDescribe behavioral finance and its potential relevance to understanding market anomalies", "qhtml": null}, {"n": 108, "q": "Unlike weak and semi-strong forms of the efficient market hypothesis, the strong form most likely holds that asset prices reflect information from:", "opts": ["historical market data.", "company financial reports.", "material nonpublic information."], "ans": "C", "expl": "The efficient market hypothesis (EMH) sets forth three forms of market efficiency: weak, semi-strong, and strong. Under weak-form EMH, only\nhistorical market data is reflected in prices. The semi-strong form of EMH extends that data reflection in prices to include all publicly available\ninformation. Under the strong-form EMH, all public and private information is reflected in market prices.\nSince all public and private information is accounted for in market prices, it is impossible to consistently earn abnormal returns if strong-form EMH\napplies. Abnormal returns are the portion of an asset's return that is not explained by the return of the market. If markets are strong-form efficient,\nthen they are also efficient in the semi-strong and weak forms. Likewise, if a market is efficient in the semi-strong form, then it is also weak-form\nefficient.\n(Choice A) All three forms (ie, weak, semi-strong, and strong) hold that historical market data is reflected in prices, so this statement is not unique\nto strong-form EMH.\n(Choice B) Under strong-form EMH, all public and private
