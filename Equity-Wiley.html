information is reflected in prices. This includes company financial reports. However,\nthis is also true under semi-strong-form EMH.\nThings to remember:\nUnder the strong form of efficient market hypothesis (EMH), all public and private information is reflected in market prices. If strong-form EMH\nholds, then it is not possible to obtain an abnormal return using either public or private information.\nContrast weak-form, semi-strong-form, and strong-form market efficiency", "qhtml": null}, {"n": 109, "q": "Which of the following best describes an asset's intrinsic value? Intrinsic value is:", "opts": ["lower than its market value for an undervalued asset.", "the price for which market participants can buy or sell the asset.", "generally accepted as accurately reflected by market value in an efficient market."], "ans": "C", "expl": "An asset's intrinsic value is the true value it would be given by market participants if they had complete information on and understanding of\nthe asset. An asset's market value is the price that market participants can readily purchase or sell it for. (Choice B).\nIn an efficient market, all new relevant information about an asset's intrinsic value is reflected quickly and rationally in its market value. If\ninvestors believe that a market is efficient, they will generally accept that an asset's market value correctly reflects its intrinsic value since all past\nand present information has been processed.\nIn practice, an asset's intrinsic value cannot be known for certain, so analysts and investors must develop their own estimates to find assets with\nmarket values that differ from the estimated intrinsic values.\n(Choice A) If the intrinsic value of an asset is higher than its market value, the asset can be purchased at a lower price than its true worth, in\nwhich case the asset is undervalued by the market.\nThings to remember:\nAn asset's intrinsic value is the true value it would be given by market participants if they had complete understanding of and information on the\nasset. An asset's market value is the price for which market participants currently buy and sell it. In an efficient market, all new information about\nan asset is reflected quickly and rationally in its market value, and investors generally accept that the asset's market value reflects its intrinsic\nvalue.\nContrast market value and intrinsic value", "qhtml": null}, {"n": 110, "q": "In security markets that are semi-strong-form efficient, passive investment strategies will most likely:", "opts": ["outperform active strategies.", "underperform active strategies.", "perform the same as active strategies."], "ans": "A", "expl": "Passive investment strategies attempt to match the returns on a benchmark index by holding all index securities or using statistical techniques\nto replicate index returns. Active investment strategies attempt to outperform a benchmark index by overweighting and underweighting index\nsecurities or by holding securities that are not in the index. Active strategies typically create more fees and expenses for the investor than\npassive strategies.\nSecurity prices in semi-strong-form efficient markets reflect all publicly available information. When this information is accurate, on average,\nsecurities trade at prices that match or are close to their intrinsic value. Based on net returns, when securities trade at intrinsic value, active\nstrategies should underperform the market due to their fees and expenses. Passive strategies outperform active strategies by avoiding those\ncosts in semi-strong-form efficient markets (Choices B and C).\nThings to remember:\nPassive investment strategies attempt to replicate returns on a benchmark index. In semi-strong-form efficient markets, prices reflect all publicly\navailable information and securities trade at levels that match or are close to their intrinsic value. Active strategies that buy and sell securities at\nintrinsic value will underperform the market due to the costs of this type of investing. Thus, passive strategies outperform active strategies if\nmarkets are semi-strong-form efficient.\nDescribe market efficiency and related concepts, including their importance to investment practitioners", "qhtml": null}, {"n": 111, "q": "Which of the following market anomalies is inconsistent with semi-strong form market efficiency?", "opts": ["The value effect", "The January effect", "Closed-end fund discount"], "ans": "A", "expl": "A market anomaly is a recurring market inefficiency that is inconsistent with efficient market theory. Semi-strong form market efficiency\ntheorizes that market prices contain all publicly available information. There are two well-known market anomalies that use publicly available\ninformation to generate abnormal returns and therefore contradict semi-strong form market efficiency: the value effect and earnings surprise.\nThe value effect is the outperformance of value stocks versus growth stocks over long periods of time. Value stocks are defined as\nhaving relatively low valuations (eg, price-to-earnings, price-to-book), or as stocks with relatively high dividend yields.\nThe earnings surprise anomaly is the lack of a complete and immediate price adjustment to the unexpected portion of reported earnings.\n(Choice B) The January effect is market outperformance during the first few trading days of the year. Recent evidence implies that many time-\nseries anomalies such as the January effect are not persistent and have largely been arbitraged away. If these anomalies exist, they appear\ninconsistently and are likely driven by seasonal factors such as tax-loss selling or window dressing, which both conclude by December 31.\n(Choice C) The closed-end fund discount is the persistent 4–10% discount to net asset value (NAV) observed in the trading of these funds. The\nefficacy of this anomaly is debated since transaction costs, liquidity, and the potential for NAV miscalculations make it unlikely that the discount\ncould be fully exploited.\nThings to remember:\nA market anomaly is a recurring market inefficiency that is inconsistent with efficient market theory. The value effect and earnings surprise are\ninconsistent with semi-strong form market efficiency theory.\nDescribe market anomalies", "qhtml": null}, {"n": 112, "q": "An overvalued asset most likely indicates that the asset's intrinsic value is less than its:", "opts": ["fair value.", "market value.", "present value of expected future cash flows."], "ans": "B", "expl": "An asset is overvalued when its intrinsic value is less than its market value. An asset's intrinsic value is its estimated fair value based on equity\nvaluation models. Market value is the price at which an asset can be traded in a public market. Intrinsic value and market value can differ in\nmarkets that are not fully efficient.\n(Choice A) An asset's intrinsic value cannot be less than its fair value since the values are the same.\n(Choice C) An asset's intrinsic value cannot be less than the present value of its expected future cash flows since the present value is an\nestimate.\nThings to remember:\nWhen an asset's intrinsic value is less than its market value, the asset is overvalued. This can occur in markets that are not fully efficient.\nContrast market value and intrinsic value", "qhtml": null}, {"n": 113, "q": "A market that is informationally efficient is most likely one where security prices:", "opts": ["accurately predict new information.", "reflect all public and private information.", "react quickly and rationally to new information."], "ans": "C", "expl": "Markets are informationally efficient if security prices adjust rapidly and rationally to the release of new information. Informational efficiency\nis fostered when information is widely available at low cost and there are numerous market participants adjusting their expectations of risk and\nreturn as new information is released.\nCFA Institute curriculum defines new information as the \"surprise\" or \"unexpected\" component of newly released information. For example, an\nearnings report in line with expected earnings is not considered new information. In an informationally efficient market, prices adjust only when\ninformation releases contain a surprise (ie, new information), such as when reported earnings fall short of expectations.\n(Choice A) Security prices cannot accurately anticipate new information, since new information is defined as being unexpected, that is,\ninformation that could not have been expected or anticipated.\n(Choice B) Since most markets restrict trading on the basis of nonpublic (ie, private) information, informational efficiency is indicated by prices'\nreaction to newly public information; it does not depend on security prices reflecting private information.\nThings to remember:\nMarkets are informationally efficient if security prices adjust rapidly and rationally to the release of unexpected information. Informational efficiency\nis fostered when information is widely available at low cost and there are numerous market participants adjusting their expectations of risk and\nreturn as unexpected information is released.\nDescribe market efficiency and related concepts, including their importance to investment practitioners", "qhtml": null}, {"n": 114, "q": "If a country's security markets are semi-strong form efficient, an investor would most likely be able to generate abnormal returns using:", "opts": ["only technical analysis.", "only fundamental analysis.", "neither technical nor fundamental analysis."], "ans": "C", "expl": "The efficient market hypothesis (EMH) stipulates that markets are efficient when asset prices fully reflect all relevant information. If a market is\nefficient, abnormal returns cannot be consistently achieved in that market with information obtained from sources specified by the EMH.\nIn the semi-strong form of market efficiency, asset prices are assumed to reflect all historical market data plus all publicly available\ninformation (eg, financial statements, earnings calls). Historical data and public information are both completely assimilated into prices, so an\ninvestor cannot achieve abnormal returns using those resources. An investor could achieve abnormal returns only by using insider information.\nTwo analytical methods are used to estimate the relative value of investments and develop investment decisions:\nTechnical analysis (eg, charting techniques) uses a market's historical trading and volume data.\nFundamental analysis (eg, free cash flow valuation) uses publicly available data to derive an asset's intrinsic value.\nTherefore, in a semi-strong form efficient market, neither technical nor fundamental analysis would be able to generate abnormal returns (Choices\nA and B).\nThings to remember:\nUnder the semi-strong form efficient market hypothesis, all historical market data and publicly available information are reflected in asset prices.\nTo develop investment decisions, technical analysis uses historical market data while fundamental analysis uses publicly available data.\nTherefore, in a market with semi-strong form efficiency, neither technical nor fundamental analysis would be able to generate abnormal returns.\nExplain the implications of each form of market efficiency for fundamental analysis, technical analysis, and the choice between active and passive\nportfolio management", "qhtml": null}, {"n": 115, "q": "After an election, new political leadership in a country allows more flexibility on the frequency of financial reporting. Consequently, many companies report financial results less often. Market efficiency will most likely: ", "opts": ["decrease.", "remain the same.", "increase."], "ans": "A", "expl": "Factors that increase\nmarket efficiency\nFair and orderly markets\nLow cost of information gathering\nCompany financial disclosure\nInvestment by foreigners permitted\nArbitrage and short selling\nLow transaction costs\nAvailability of daily market data\nExistence and prevalence of exchanges\nLarge number of analysts and investors\nAn efficient market is one in which new information is reflected quickly in asset prices. Market participants acquire market information from\ncompany reports and use that data to make investment decisions. Factors that increase the speed at which participants have access to\ninformation for valuation and trading facilitate faster price adjustments. This tends to increase market efficiency.\nLess frequent financial reporting impedes valuation and investing and increases the cost of gathering information. More financial disclosure\ncontributes to a fairer and more orderly market, as well as broader availability of information to analysts and investors, both of which tend to\nincrease market efficiency. As a result of these factors, less frequent financial disclosure by companies decreases market efficiency (Choices\nB and C).\nThings to remember:\nFactors that increase the speed at which participants receive new information tend to increase market efficiency. Company financial disclosure,\nfair and orderly markets, many analysts and investors, and low cost of information gathering all contribute to increased market efficiency.\nExplain factors that affect a market’s efficiency", "qhtml": null}, {"n": 116, "q": "Which of the following best describes the anomaly of earning abnormal profits by using only past market data?", "opts": ["The momentum anomaly", "The earnings surprise anomaly", "The initial public offering anomaly"], "ans": "A", "expl": "A market anomaly is a recurring market inefficiency that is inconsistent with efficient market theory. Weak-form market efficiency holds that stock\nprices contain all available past market data (ie, price and volume); therefore, an investor cannot earn abnormal profits by using only this\ninformation.\nHowever, considerable empirical evidence indicates that a momentum-based trading strategy using short-term historical stock price data can\nearn abnormal returns in subsequent periods, thus contradicting weak-form market efficiency.\n(Choice B) The earnings surprise anomaly is the lack of a complete and immediate price adjustment to the unexpected portion of reported\nearnings (eg, fundamental public data). Due to this gradual price adjustment, stocks with a positive (negative) earnings surprise subsequently\noutperform (underperform) without a release of new information, contradicting semi-strong form market efficiency.\n(Choice C) The initial public offering (IPO) anomaly indicates that, on average, investors purchasing shares through an IPO may be able to earn\nshort-term abnormal profits. IPOs are frequently underpriced, allowing investors to earn abnormal returns; however, the excess return is fleeting\nsince market prices adjust quickly, supporting semi-strong market efficiency.\nThings to remember:\nThe momentum anomaly contradicts weak-form market efficiency by earning abnormal returns using only historical price data.\nDescribe market anomalies", "qhtml": null}, {"n": 117, "q": "A country's financial markets are weak-form efficient. This implies that it is impossible to obtain consistent, abnormal returns in the country's markets using: ", "opts": ["technical analysis.", "insider information.", "fundamental analysis."], "ans": "A", "expl": "The efficient market hypothesis (EMH) specifies three forms of market efficiency: weak, semi-strong, and strong. Weak-form EMH holds that\nhistorical market data is reflected in market prices. Technical analysis involves using historical trading and volume data as the basis to buy and\nsell. If historical market data has already influenced prices, then it is not possible to produce consistent, abnormal returns (ie, returns better\nthan expected returns) using technical analysis.\n(Choices B and C) If markets are weak-form efficient, historical price and volume information are immediately reflected in market prices. Other\npublicly available information (eg, company financial reports) and material nonpublic (insider) information may not be reflected in prices under\nweak-form EMH. Therefore, it is possible for an investor to achieve consistent, abnormal returns by trading on publicly available information or\ninsider information.\nThings to remember:\nThe three forms of the efficient market hypothesis (EMH) are weak, semi-strong, and strong. Weak-form EMH holds that historical market data is\nreflected in asset market prices, implying that trading based on technical analysis will not produce consistent, abnormal returns.\nExplain the implications of each form of market efficiency for fundamental analysis, technical analysis, and the choice between active and passive\nportfolio management", "qhtml": null}, {"n": 118, "q": "All else equal, a company's book value of equity is most likely to decrease when the:", "opts": ["company stops paying common dividends.", "company reports a large accumulated loss.", "company's stock price falls below par value."], "ans": "B", "expl": "Book value of equity Market value of equity\n(Shareholders' equity) (Market cap)\nCommon stock* + Shares outstanding (current) ×\nRetained earnings (or accum. loss) Current stock price\n*Common stock = Shares issued × Issue price\nThe book value of equity is the amount of shareholders' equity reported on a company's balance sheet. It primarily consists of common stock\nand retained earnings. On the balance sheet:\ncommon stock reports the historical value of common equity issued, and\nretained earnings (accumulated loss) reports the cumulative net profit (loss) since a company's inception, net of dividends.\nAll else equal, accumulated losses will reduce the book value of equity by reducing retained earnings. The book value of equity is also the\ndifference between total assets and total liabilities.\nThe market value of equity is the current value of the shareholders' equity (Shares outstanding × Current stock price). A change in the current\nstock price will affect the equity's market value, not its book value (Choice C).\nSince the stock price is based on investors' expectations of a company's future earnings or cash flows, the market value of equity is forward-\nlooking, whereas the book value of equity (based on share value at issuance) is backward-looking.\n(Choice A) All else equal, halting dividends increases retained earnings and, thus, book value of equity since the company keeps more earnings,\ninstead of paying them as dividends.\nThings to remember:\nThe book value of equity is reported on a company's balance sheet as the historical value of common equity issued (ie, common stock) and\ncumulative net profit (loss) since a company's inception, net of dividends (ie, retained earnings). The equity's market value is based on current\nshare price, which is based on investors' current expectations of future earnings.\nDescribe behavioral finance and its potential relevance to understanding market anomalies", "qhtml": null}, {"n": 119, "q": "According to the Efficient Market Hypothesis, if a market is semi-strong form efficient, active management's net-of-fees returns to investors are most likely: ", "opts": ["less than passive management's.", "equivalent to passive management's.", "greater than passive management's."], "ans": "A", "expl": "The Efficient Market Hypothesis (EMH) specifies three forms of market efficiency: weak, semi-strong, and strong. Market efficiency is determined\nby how quickly and completely information is reflected in asset prices. If a market is truly efficient, abnormal returns cannot be achieved on a\nconsistent basis with the information available.\nThe semi-strong form of efficiency assumes that asset prices reflect all historical market data plus all publicly available information (eg,\nfinancial statement information). New public information is quickly assimilated into prices, so an investment manager cannot capitalize on events\nsuch as earnings surprises to achieve abnormal returns.\nActive portfolio management normally uses more frequent trading to exploit perceived inefficiencies. Active management therefore incurs higher\ntrading and information acquisition costs than passive management, which instead seeks to replicate the performance of the market or an index.\nAs a result, when a market is truly semi-strong form efficient, net-of-fees returns from passive management will, on average, outperform active\nportfolio management with its higher costs (Choices B and C).\nThings to remember:\nUnder the semi-strong form of the Efficient Market Hypothesis (EMH), all publicly available information is reflected in asset market prices. Semi-\nstrong form EMH implies that since active management incurs higher transaction costs, passive management will outperform net of fees.\nExplain the implications of each form of market efficiency for fundamental analysis, technical analysis, and the choice between active and passive\nportfolio management", "qhtml": null}, {"n": 120, "q": "A portfolio manager uses an active management strategy based on only historical and publicly available information and achieves abnormal returns. The manager is trading in a market best described as: ", "opts": ["weak form efficient.", "semi-strong form efficient.", "strong form efficient."], "ans": "A", "expl": "The efficient market hypothesis (EMH) defines market efficiency based on how quickly and completely information is reflected in asset prices. If\nmarkets are truly efficient, then abnormal returns cannot be achieved on a consistent basis. The EMH defines three forms of market efficiency:\nThe weak form assumes that asset prices reflect only historical market data (eg, price and volume data). In a weak form efficient market,\nthe market achieves only limited efficiency since it reflects limited information (ie, only historical data). An investment manager using active\nmanagement and all publicly available information could achieve abnormal returns to consistently outperform the market.\nThe semi-strong form assumes that asset prices reflect all historical market data plus all publicly available information (eg, financial\nstatement information). New public information is quickly assimilated into prices, so an investment manager cannot capitalize on events\nsuch as earnings surprises to achieve abnormal returns, making active management strategies ineffective, without using nonpublic\ninformation (Choice B).\nThe strong form assumes that asset prices reflect all public information as well as material, nonpublic information (ie, information known\nto management or other insiders). In this case, it is impossible for an investment manager to consistently outperform the market even on a\nshort-term basis since asset prices reflect all available information (Choice C).\nThings to remember:\nThe efficient market hypothesis (EMH) defines market efficiency based on how quickly and completely information is reflected in asset prices. The\nEMH defines three forms of market efficiency: weak, semi-strong, and strong. Only in a weak form efficient market can an investment manager\nuse active management to consistently outperform the market, since the market achieves only limited efficiency and reflects limited information.\nContrast weak-form, semi-strong-form, and strong-form market efficiency", "qhtml": null}, {"n": 121, "q": "Active management is most likely to outperform passive management on a risk-adjusted basis when markets are:", "opts": ["informationally and operationally efficient.", "informationally efficient and operationally inefficient.", "informationally inefficient and operationally efficient."], "ans": "C", "expl": "Passive investment strategies attempt to match the returns on a benchmark index. Active management strategies attempt to earn higher risk-\nadjusted returns by overweighting undervalued securities and underweighting overvalued securities. Successful active management\nrequires markets that are both:\nInformationally inefficient: new information is not rapidly reflected in market prices, enabling research to identify securities trading above\nor below intrinsic value, and\nOperationally efficient: trading-related costs are less than the additional returns earned by buying undervalued and selling overvalued\nsecurities\n(Choices A and B) If markets are informationally efficient, all publicly available information is reflected in security prices, so market prices are\nclose to intrinsic value. If securities always trade at intrinsic value, active strategies underperform passive strategies by the costs of trading. This\nis true in operationally efficient markets where trading costs are low. In operationally inefficient markets, active strategies are at an even greater\ndisadvantage.\nThings to remember:\nActive management strategies attempt to earn higher returns by overweighting undervalued securities and underweighting overvalued securities.\nSuccessful active management requires markets that are informationally inefficient so mispriced securities can be discovered through research.\nAdditionally, markets must be operationally efficient so that trading costs are less than the additional returns earned through trading mispriced\nsecurities.\nDescribe market efficiency and related concepts, including their importance to investment practitioners", "qhtml": null}, {"n": 122, "q": "Which of the following best describes a management buyout?", "opts": ["Management takes the company private", "Outside shareholders install new management", "Private equity investors buy out management's shares"], "ans": "A", "expl": "When investors (usually a group of investors) purchase a controlling share of a company and the company's shares are no longer publicly traded,\nthe company has been taken private. When investors finance that share buyout with a large proportion of debt, it is referred to as a leveraged\nbuyout (LBO).\nA management buyout (MBO) is a type of LBO in which members of a company's existing management team are part of the group buying out\nthe other shareholders (Choices B and C). The MBO is usually undertaken to restructure the company, increase its value, and eventually take it\npublic again.\nThings to remember:\nA company is taken private when a group of investors buys a controlling stake in the company and the company's shares are no longer publicly\ntraded. If investors use a large proportion of debt financing, the transaction is a leveraged buyout (LBO). If existing management participates in\nthe LBO, the transaction is referred to as a management buyout (MBO).\nCompare and contrast public and private equity securities", "qhtml": null}, {"n": 123, "q": "Which of the following best describes a characteristic of preference shares?", "opts": ["They cannot be callable or putable.", "Their regular dividends are fixed at issuance.", "They legally obligate the issuer to make regular dividend payments."], "ans": "B", "expl": "Characteristics of preference shares (preferred stock)\n• Rank above common shares in respect to\n◦ Dividend payments\n◦ Asset distribution during liquidation\n• Do not generally offer voting rights\n• Can be callable, putable, or convertible\n• Dividends are\n◦ Not contractual obligations\n◦ Generally fixed at issuance\nPreference shares are a type of equity security that provides financing for the issuing company. They share characteristics of both common\nshares and debt securities. Like debt securities, the regular dividends on preferred shares are generally fixed at issuance, similar to a bond's\ninterest payments.\nSince the regular dividends on preference shares are fixed, they will not increase during periods of strong operating performance by the company\nas common shares might do. Participating preference shares can entitle shareholders to an extra dividend in addition to the regular dividend if the\ncompany's profits exceed a predetermined threshold. However, the regular dividends will not change.\n(Choice A) Preference shares, like fixed-income securities, can be callable or putable. Call provisions give an issuer the right to buy back the\nshares, while put provisions give shareholders the right to sell the shares back to the issuer. These terms are disclosed by the company at\nissuance.\n(Choice C) Like common share dividends, the dividends on preference shares are not legal obligations. Missing a dividend payment will not send\na company into default—as would happen when a bond payment is missed—or have any other legally enforceable consequence.\nThings to remember:\nPreference shares are a type of equity financing with characteristics similar to common shares and debt securities. Like debt securities, their\nregular dividends are fixed at issuance and will not increase during periods of strong performance by the company.\nDescribe characteristics of types of equity securities", "qhtml": null}, {"n": 124, "q": "All else equal, a company's return on equity will most likely decrease if:", "opts": ["its stock price significantly decreases.", "it issues large amounts of new common shares.", "its net income increases at a faster rate than its book value of equity."], "ans": "B", "expl": "ROE is the rate of return that common shareholders receive on equity capital invested in a company. Issuing common shares increases the book\nvalue of equity, which leads to a decrease in ROE, all else equal.\nSince net income and book value of equity are accounting measures, ROE may sometimes be impacted by management's choice of a reporting\nmethod (eg, revenue recognition policies, depreciation assumptions). Analysts should consider differences in reporting methods when evaluating\nROE across multiple firms.\n(Choice A) A change in a company's stock price leads to a change in the market value of equity, which has no direct impact on ROE since ROE is\ncalculated using the book value, not the market value.\n(Choice C) Net income increasing faster than the book value of equity would lead to an increase, not a decrease, in ROE.\nThings to remember:\nROE is the rate of return that common shareholders receive on equity capital invested in a company and is found by dividing net income by\naverage book value of equity. Issuing common shares increases the book value of equity, which leads to a decrease in ROE, all else equal.\nCompare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return", "qhtml": null}, {"n": 125, "q": "Investors' required rate of return on common shares is most likely used to estimate a company's:", "opts": ["cost of equity.", "return on equity.", "book value of equity."], "ans": "A", "expl": "Investors must be compensated for bearing risk, so securities trade at prices such that expected returns reflect expected risks. Expected\nreturn is interpreted as the minimum return required by investors since a lower return would be less than fair compensation. This risk/return\nrelationship applies to new issues of common stock as well as to existing shares.\nInvestors' compensation for bearing risk is the issuer's cost of sharing that risk. Therefore, the investors' expected (ie, required) rate of return\ncan be used as a proxy for the company's cost of equity.\n(Choice B) Return on equity (ROE) is an accounting return calculated as the ratio of net income to book value of shareholders' equity. Required\nrates of return are not used to estimate ROE.\n(Choice C) The book value of a company's equity is the book value of assets less the book value of liabilities. Required rates of return are not\nused to estimate the book value of a company's equity.\nThings to remember:\nCompanies must issue shares at prices such that expected returns compensate investors for risk. These expected returns are the minimum\nreturns investors require for buying the securities. Investors' required rates of return are used as proxies for the issuing company's cost of equity.\nCompare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return", "qhtml": null}, {"n": 126, "q": "Voting rights attached to sponsored depository receipts most likely belong to:", "opts": ["the depository bank.", "the investor of the depository receipts.", "the company that the depository receipts were issued for."], "ans": "B", "expl": "Depository receipts (DRs) allow investors access to foreign securities without having to transact directly in the foreign market. A depository receipt\nis created when a company transfers shares of its own stock into a bank in another country. The depository bank then helps make the DRs\navailable to investors in the bank's country.\nDepository receipts can be sponsored or unsponsored. In the case of sponsored DRs, the company is directly involved in issuing its DRs.\nSponsored DR investors have the same voting rights as common shareholders of the company's stock. For unsponsored DRs, the company is\nnot involved in issuing the DRs. The depository bank retains the voting rights.\nThings to remember:\nDepository receipts (DRs) allow investors access to foreign securities without having to directly transact in the foreign market. For sponsored\nDRs, the DR investor receives the voting rights. For unsponsored DRs, the bank receives the voting rights.\nCompare and contrast public and private equity securities", "qhtml": null}, {"n": 127, "q": "The priorities that preferred shareholders have compared to common shareholders are least likely related to:", "opts": ["voting rights.", "payment of dividends.", "claim on assets upon liquidation."], "ans": "A", "expl": "Equity securities' characteristics\nCommon Preferred\nVoting rights Some corporate actions (eg, M&A) and board seats Usually none\nDividends Payable only after preferred Payable in full before common\nAssets Residual claim after all other obligations retired Priority claim over common for asset distributions\nThere are two types of equity securities: common stocks and preferred stocks (ie, preference shares). Corporations must have common shares\noutstanding, which represent the ownership interests in the company. As owners, common stockholders:\nshare in the company's operating performance,\nparticipate in its governance through voting rights, and\nhave a residual claim on the company's assets in the case of liquidation.\nCompanies may raise additional equity capital by issuing preferred stock. Unlike common stock, preferred shares normally carry no voting\nrights and do not participate in company operating performance. However, preferred shares rank ahead of (ie, have preference over) common\nshares, as preferred shareholders receive:\npreferred dividends, once declared, before any common stock dividends can be paid (Choice B), and\nshares' par value before common shareholders receive any distributions, upon liquidation (Choice C).\nThings to remember:\nThere are two types of equity securities: common stocks and preferred stocks. Corporations must have common shares outstanding and may\nissue preferred stocks to raise additional capital. Preferred shares have a priority claim on dividends and asset distributions in a company\nliquidation, but normally they have no voting rights.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null}, {"n": 128, "q": "A group of investors use a large amount of debt financing to purchase all the shares of a company's publicly traded stock. The investors are most likely executing a: ", "opts": ["leveraged buyout.", "venture capital transaction.", "private investment in public equity."], "ans": "A", "expl": "A leveraged buyout (LBO) occurs when a group of investors purchases all the outstanding shares of a publicly traded company using a\nsignificant amount of debt. The purchase is not entirely financed by debt, as the investors also use equity capital to finance the purchase. An\nLBO is known as \"taking the company private,\" since after the purchase, the investors have complete control over the company. Company\ninsiders, such as management, often execute the LBO, in which case it may be referred to as a management buyout (MBO).\nThe LBO is structured such that the funds are borrowed by the acquired company. Targets for LBOs often have high cash flow and/or undervalued\nassets, which can be used to pay down the transaction debt. The LBO investors often restructure the company, the goal being to sell the company\nin public markets at a price that constitutes a substantial annual return on the investors' original equity investment.\n(Choice B) Venture capital investment involves providing early-stage financing to companies with high growth potential that are in need of funds\nto expand the business.\n(Choice C) A private investment in public equity (PIPE) occurs when a publicly traded company has an urgent need for funds in a short time. The\ncompany sells its stock to a large, accredited investor at a discount to the stock's market value. The PIPE can be more efficient and less\nregulatorily burdensome than a public offering.\nThings to remember:\nA leveraged buyout (LBO) occurs when a group of investors arranges a large amount of debt financing and purchase all the outstanding shares of\na publicly traded company. Targets for LBOs often have high cash flow and/or undervalued assets, which can be used to pay down the debt from\nthe buyout.\nCompare and contrast public and private equity securities", "qhtml": null}, {"n": 129, "q": "When investing in nondomestic equities, an advantage of global registered shares over unsponsored depository receipts is most likely the:", "opts": ["retention of full voting rights.", "receipt of 100% of dividend payouts.", "reduced exposure to exchange rate risk."], "ans": "A", "expl": "Investing in nondomestic equities\nSecurity Issuer Quoted/traded\nIssuer's equity in Issuer's domestic\nCompany\ndomestic market currency\nDirect\nExchange's local\nGRS Company\ncurrency\nADR US depository USD\nExchange's local\nGDR Local depository\nIndirect currency\nBLDR ETF holding Exchange's local\n(ETF) ADRs/GDRs currency\nADR = American depository receipt GDR = Global depository receipt\nBLDR = Basket of listed depository receipts GRS = Global registered share\nETF = Exchange-traded fund\nInvestments in nondomestic equities can be made directly through global registered shares (GRSs) or indirectly through depository receipts\n(DRs). GRSs are identical shares issued in multiple countries; each share carries the same ownership interests (eg, dividends, voting rights) but\nis traded in a market's local currency. DRs, also traded in local currency, are interests in accounts at depositories that hold the foreign\ncompany shares.\nDRs may be sponsored or unsponsored. Returns on DRs match the performance of the shares in each account. However, the depository, not\nthe investor, is the legal owner of the foreign company shares. Whereas investors in GRSs retain full voting rights, holders of unsponsored\nDRs may lack voting rights if the depository chooses to retain them.\n(Choice B) Investors in both GRSs and DRs receive 100% of the dividends.\n(Choice C) GRSs and DRs expose investors to the same currency risk. Both are traded in the local currency, avoiding the need to trade\ncurrencies to invest in nondomestic equities. However, since the value of a company is usually determined by the share price in its domestic\nmarket, currency fluctuations can affect the price of a GRS or DR.\nThings to remember:\nGlobal registered share (GRS) holders retain all rights of ownership, including voting, since GRSs are the issuing companies' actual shares. In\ncontrast, depository receipts (DRs) are interests in accounts that hold foreign company shares. Since depositories legally own these shares,\nholders of unsponsored DRs may lack voting rights.\nDescribe methods for investing in non-domestic equity securities", "qhtml": null}, {"n": 130, "q": "If a company's cost of equity differs from an equity investor's required rate of return, which of the following best explains that difference?", "opts": ["A company's future cash flows are uncertain and unknown", "The company announces that it plans to undertake riskier projects", "Cost of equity is calculated after tax since dividends are tax deductible"], "ans": "A", "expl": "Investors must be compensated for bearing risk when providing capital to companies. Equity investors base their required rate of return on\nexpected future cash flows. Since these are uncertain and unknown, different investors will have different estimates of the company's future\ncash flows. This leads to different investors having different required rates of return.\nSince companies seek to issue capital at the lowest potential cost, a company will issue equity capital at the lowest rate that will allow it to raise\nsufficient capital, which becomes the company's cost of equity. Investors with required rates of return less than or equal to this rate will purchase\nthe company's securities; those that have higher required rates of return will not. For a given amount of equity issued, the company's cost of\nequity will be a single rate. Investors will have varied required rates of return, which often differ from a company's cost of equity.\n(Choice B) A company taking on riskier projects would most likely increase both its cost of equity and investors' required rate of return, assuming\nthe investors would be aware of the projects. This is not a reason for differences between the cost of equity and investors' required rates of return.\n(Choice C) The company's cost of debt, not its cost of equity, is calculated after tax. Interest expense is a tax-deductible expense for the\ncompany, but dividends are not.\nThings to remember:\nInvestors base their required rates of return for equity securities on their estimates of expected future cash flows, which leads to different required\nrates of return among investors. For a given amount of equity issued, the company's cost of equity will be a single rate; investors will have a range\nof required rates of return that often differ from the company's cost of equity.\nCompare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return", "qhtml": null}, {"n": 131, "q": "All else equal, if the actual return from investing in a company's stock is less than the investors' minimum required rate of return, which of the following is most likely to increase? The company's:", "opts": ["cost of debt.", "cost of equity.", "return on equity."], "ans": "B", "expl": "The investors' minimum required rate of return for providing equity capital to a company can be thought of as the company's cost of equity (r ). If a\ne\nstock's actual return is less than the investors' minimum required rate of return, then:\n1. investors will sell the stock and invest the proceeds elsewhere, thus decreasing the company's stock price.\n2. If company fundamentals do not change (eg, future earnings or cash flow expectations),\n3. the expected return from buying the stock increases as the baseline stock price decreases.\nThis causes an increase in the minimum required rate of return (ie, cost of equity).\n(Choice A) The cost of debt is based on the return expectations of creditors (ie, bondholders, lenders), not equity investors.\n(Choice C) ROE (ie, Net income / Average shareholders' equity) is an accounting measure based on a company's reported financial results and\nthus is backward looking. As such, ROE is not impacted by the actual stock returns, which are based on market values.\nThings to remember:\nIf a stock's return is not greater than r in the capital markets, then investors will sell the company's stock and invest the proceeds elsewhere, thus\ne\ndecreasing the company's stock price. Holding all else equal, as the stock price decreases, the expected return from buying the stock and,\nconsequently, the company's cost of equity increase.\nCompare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return", "qhtml": null}, {"n": 132, "q": "Participating preference shares allow preferred shareholders to:", "opts": ["vote in annual board of director elections.", "receive additional dividends if profits exceed a threshold.", "sell shares back to the company at a predetermined price."], "ans": "B", "expl": "Types of preference shares (preferred stock)\nCumulative Accrues for past dividends that are unpaid\nNoncumulative Does not accrue dividends that are undeclared and unpaid in past periods\nParticipating Allows for additional dividend payments if company profits exceed a certain threshold\nNonparticipating Fixed dividend; no additional payments based on company performance\nConvertible Can convert into a specified number of common shares\nCallable Allows issuer to buy back shares from investors for a specified price\nPutable Allows investors to sell shares back to issuer for a specified price\nPreference (preferred) shares ownership represents a form of equity investment in a company. Preference shares may grant certain benefits such\nas dividends and, in some cases, conversion to common stock. Participating preference shares provide additional dividend payments to\nshareholders if the company's profits exceed a certain benchmark. Unlike participating preferred shares, nonparticipating preference shares do\nnot provide such benefits.\n(Choice A) Voting is a right bestowed on common shareholders, not preferred shareholders.\n(Choice C) The provision to sell shares back to a company at a predetermined price is not a feature of participating preferred stock.\nThings to remember:\nParticipating preference (preferred) stock provides additional dividend payments to shareholders if the company's profits exceed a certain\nbenchmark.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null}, {"n": 133, "q": "A depository receipt allows a local investor to invest in:", "opts": ["local securities through a foreign exchange.", "foreign securities through a local exchange.", "foreign securities through a foreign exchange."], "ans": "B", "expl": "Investors can invest in foreign securities directly by transacting in foreign markets (ie, direct investing) or indirectly by owning depository receipts\n(DR). Sometimes, direct foreign investing can be difficult due to currency conversion, low liquidity, or lack of transparency. DR allow investors\naccess to foreign securities without having to transact directly in the foreign market.\nDR are created when foreign companies deposit their shares into another country's bank. The bank then issues DR that represent the deposited\nshares and helps list DR on an exchange in the bank's country (ie, a local exchange). This allows local investors (ie, investors in the bank's\ncountry) to purchase DR and effectively invest in shares of the foreign stock that can be publicly traded on the local exchange.\nThings to remember:\nDepository receipts (DR) allow investors access to foreign securities without trading in a foreign market. DR are created when foreign companies\ndeposit their shares into a local bank. The local bank then issues DR that represent the deposited shares and helps list DR on a local exchange.\nDescribe methods for investing in non-domestic equity securities", "qhtml": null}, {"n": 134, "q": "Which of the following statements best describes a feature of callable common shares? Callable common shares give:", "opts": ["investors the right to purchase shares of common stock.", "issuers the right to buy back shares of common stock from investors.", "investors the right to sell shares of common stock back to the issuer."], "ans": "B", "expl": "Companies often issue shares of common stock to raise capital. With callable (ie, redeemable) common shares, the issuing company (ie,\nissuer) reserves the right to buy back shares from investors at a predetermined call price. This call feature may limit potential upside on price\nappreciation for investors, so callable common shares offer high dividend payments in return to compensate for the risk.\n(Choice A) Call option allow investors to purchase shares of common stock at a predetermined price.\n(Choice C) Putable common shares allow investors to sell shares of common stock back to the issuer at a predetermined price.\nThings to remember:\nCallable common shares allow issuers to repurchase their stock from investors at a predetermined call price. Callable common shares typically\noffer high dividend payments.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null}, {"n": 135, "q": "A foreign company is considering listing its shares on a US exchange as an American depository receipt (ADR). The company wants to raise capital in the near future through a public offering of the ADR. Which of the following is the most appropriate type of ADR to meet this need?", "opts": ["Level I", "Level II", "Level III"], "ans": "C", "expl": "American depository receipt (ADR) overview\nRule 144A Level I Level II Level III\nYes, but only QIB private\nRaise new US capital No No Yes, public offering\nplacement\nYes, more robust filing\nSEC registration None Yes, basic Yes, basic\nrequired\nOver-the- NYSE, NASDAQ,\nTrading venues Unlisted NYSE, NASDAQ, AMEX\ncounter AMEX\nListing fees Low Low High High\nSize/earnings\nNone None Yes Yes\nrequirements\nQIB = Qualified institutional buyers\nForeign companies can access US investors and broaden their equity investor base by creating American depository receipts (ADRs). The foreign\ncompanies deposit shares of their stock with certain banks that then create dollar-denominated certificates (ie, ADRs), which will usually be listed\non an exchange. The ADR trades just like a stock and generally tracks the underlying value of the company's shares that trade on a foreign\nexchange.\nThere are four primary types of ADR listings, each with progressively more stringent listing and corporate governance requirements.\nRule 144A ADR: unregistered and privately sold only to qualified investors, with resale restrictions\nLevel I: SEC-registered and trades over-the-counter (OTC); basic access to US investors\nLevel II: SEC-registered and exchange-traded; better investor access but higher cost and more requirements\nLevel III: most stringent SEC registration requirements; can be used by foreign-listed firms to raise new equity capital and for acquisitions\n(Choice A) Level I ADRs give foreign-listed firms basic access to US markets and investors. However, these ADRs may not be sold to raise new\nequity capital.\n(Choice B) Level II ADRs give foreign-listed firms basic access to US markets and a mainstream exchange listing, but they still cannot be used\nfor raising new equity capital.\nThings to remember:\nLevel III ADRs require the most stringent SEC registration process and can be used to raise new equity capital and for acquisitions.\nDescribe methods for investing in non-domestic equity securities", "qhtml": null}, {"n": 136, "q": "Which of the following best describes a characteristic of common stock?", "opts": ["It gives the investor an ownership stake in the issuing company.", "It obligates the issuer to repay the amount received from shareholders.", "It does not allow shareholders to participate in the decision-making process."], "ans": "A", "expl": "Characteristics of common shares\n• Rank below preference shares in respect to\n◦ Dividend payments\n◦ Asset distribution during liquidation\n• Represent ownership stake in a company\n• Share in the operating performance of the company\n• Typically offer voting rights for shareholders to participate in\ndecision-making process\n• Companies can choose to pay all, some, or none of their profits in dividends\nCommon shares are a type of equity security that provides financing for the issuing company in exchange for a claim on the company's net\nassets. They are the predominant type of equity financing used by companies.\nCommon shares represent an equity ownership stake, allowing the investor to share in the company's operating performance, vote on certain\ncompany decisions, and make claims on the company's net assets in the event of bankruptcy. The claims of common shareholders rank below\ndebt holders and preference shareholders, adding to the risk of common shares.\n(Choice B) The proceeds from the sale of common shares are not loans, so there is no repayment obligation at maturity (ie, principal payment) as\nwould be the case for bonds. Since common shares have no maturity, they may remain outstanding in perpetuity or until the company\nrepurchases and retires them.\n(Choice C) Most common shares allow shareholders to participate in major corporate governance decisions (eg, mergers and acquisitions) by the\ncompany through voting. The company will specify how many votes each share receives.\nThings to remember:\nCommon shares are the predominant type of equity financing used by companies, representing an ownership stake in the issuing company. As\nsuch, they allow the investor to share in the company's operating performance, vote on certain company decisions, and make claims on the\ncompany's net assets in the event of bankruptcy. Common shareholders' claims are subordinated to those of debt holders and preference\nshareholders.\nDescribe characteristics of types of equity securities", "qhtml": null}, {"n": 137, "q": "A company uses the proceeds from newly issued bonds to buy back common shares. Holding all else constant, including the common dividend per share, if return on equity increases, the increase is most likely the result of: ", "opts": ["book value of equity declining proportionally more than net income.", "net income increasing due to the increase in tax-deductible interest expense.", "total dividend payments decreasing, resulting in an increase in shareholders' equity."], "ans": "A", "expl": "Issuing debt to fund share buybacks impacts both the balance sheet and the income statement. On the balance sheet, long-term debt will\nincrease and shareholders' equity will decrease. On the income statement, interest expense will increase while taxable income, tax expense,\nand net income will decrease. Holding operating profit constant, net income must decline since the increase in interest expense is greater than\nthe decrease in tax expense.\nIn this scenario, there has been an increase in ROE (given) and a decrease in net income. For ROE to increase while net income has decreased,\nthe decline in average shareholders' equity (ie, book value) must be proportionally greater than the decline in net income.\n(Choice B) Net income has decreased, rather than increased. The additional tax deduction is less than the increased interest expense, so the\nnet effect is a decrease in net income.\n(Choice C) Shareholders' equity decreased rather than increased. Dividend payments reduced the shareholders' equity, although the impact was\nlessened since the dividend was paid on the smaller number of outstanding shares (after the buyback). Shareholders' equity was further reduced\nby the market value of the repurchased shares.\nThings to remember:\nHolding all else constant, issuing bonds increases interest expense and decreases net income, and repurchasing shares reduces shareholders'\nequity. For ROE to increase while net income and book value of equity decrease, the decline in equity must be proportionally greater than the\ndecline in net income.\nContrast the market value and book value of equity securities", "qhtml": null}, {"n": 138, "q": "Level I sponsored ADRs are most likely:", "opts": ["to trade over-the-counter (OTC).", "used to raise new US equity capital.", "subject to the most stringent SEC filing requirements."], "ans": "A", "expl": "American depository receipt (ADR) overview\nRule 144A Level I Level II Level III\nYes, but only QIB private\nRaise new US capital No No Yes, public offering\nplacement\nYes, more robust filing\nSEC registration None Yes, basic Yes, basic\nrequired\nOver-the- NYSE, NASDAQ,\nTrading venues Unlisted NYSE, NASDAQ, AMEX\ncounter AMEX\nListing fees Low Low High High\nSize/earnings\nNone None Yes Yes\nrequirements\nQIB = Qualified institutional buyers\nForeign companies can access US investors and broaden their equity investor base by creating American depository receipts (ADR). In a\nsponsored ADR, a foreign company deposits shares of its stock with certain banks that create dollar-denominated certificates (ie, ADRs), which\nwill usually be listed on an exchange. An ADR trades just like a stock and generally tracks the underlying value of the company's shares that trade\non a foreign exchange.\nThere are four primary types of ADR listings, each with progressively more stringent listing and corporate governance requirements:\nRule 144A ADR: unregistered and privately sold only to qualified investors, with resale restrictions\nLevel I: SEC-registered and trades over-the-counter (OTC) with basic access to US investors\nLevel II: SEC-registered and exchange-traded with better investor access but higher cost and more requirements\nLevel III: most stringent SEC registration requirements; can be used by foreign-listed firms to raise new equity capital and for acquisitions\n(Choices B and C) Level I ADRs give foreign-listed firms the most basic access to US markets and investors. SEC filing requirements are less\nstringent, and these ADRs may not be sold to raise new equity capital in the US.\nThings to remember:\nLevel I American depository receipts (ADRs) give foreign-listed firms the most basic access to US markets and investors. Level I ADRs trade\nover-the-counter, have less stringent SEC filing requirements, and may not be sold to raise new equity capital in the US.\nDescribe methods for investing in non-domestic equity securities", "qhtml": null}, {"n": 139, "q": "Which of the following best describes a fundamental difference between preference shares and common shares?", "opts": ["Preference shares carry more voting rights than common shares.", "Common shares typically have larger dividends than preference shares.", "Preference shareholders receive dividends before common shareholders."], "ans": "C", "expl": "Characteristics of preference shares (preferred stock)\n• Rank above common shares in respect to\n◦ Dividend payments\n◦ Asset distribution during liquidation\n• Do not generally offer voting rights\n• Can be callable, putable, or convertible\n• Dividends are\n◦ Not contractual obligations\n◦ Generally fixed at issuance\nPreference shares are a type of equity security that provides financing for the issuing company. Preference shareholders receive a regular\ndividend payment from the company that is fixed at issuance. Like dividends on common shares, preferred dividends are not contractual\nobligations, and missing payments will not send a company into default.\nPreference shares rank above common shares when dividends and claims on a company's net assets are paid during liquidation. In that\nsituation, preference shareholders must receive their dividends before common shareholders can receive theirs.\nThis requirement is taken a step further in regard to cumulative preference shares: A company must pay any current and previously unpaid\ndividends to cumulative preference shareholders before common dividends can be paid.\n(Choice A) Unlike common shares, preference shares usually do not provide voting rights to the shareholders. When exceptions occur,\npreference shareholders are typically allowed to vote on only those matters relevant to their shares.\n(Choice B) Dividends on preference shares are fixed and generally larger than those on common shares. This helps to make preference shares\nmore attractive to potential investors, despite lacking the upside potential of common shares.\nThings to remember:\nPreference shareholders receive regular, fixed dividends from the issuing company. The payments are set at issuance. These dividends rank\nabove those of common shares, which means that preference shareholders must receive their dividends before common share dividends can be\npaid.\nDescribe characteristics of types of equity securities", "qhtml": null}, {"n": 140, "q": "Holding all other factors constant, an issuance of common stock is most likely to result in an increase to the company's:", "opts": ["total assets.", "return on equity.", "intrinsic value per share."], "ans": "A", "expl": "Companies can raise money to finance their operations by issuing debt or equity securities. Issuing equity securities gives firms more flexibility\nsince there is no legal obligation to retire equity or distribute dividends to shareholders.\nIssuing equity securities has several immediate impacts on a company's balance sheet. Common stock, a component of shareholders' equity,\nincreases to account for the value of shares issued. Since cash is an asset, the net proceeds from the offering (ie, the cash received in exchange\nfor the common shares issued) increase total assets.\n(Choice B) ROE is the ratio of net income to the average book value of common shareholders' equity. Since net income (numerator) is held\nconstant in this case and the issuance of common shares increases the average book value of common shareholders' equity (denominator), ROE\ndecreases.\n(Choice C) The intrinsic value of a company is the estimated present value of its future cash flows. In this scenario, since everything other than\nan issuance of common stock is held constant, projected future cash flows would be unchanged, leading to the same intrinsic value for the firm.\nSince there are more shares outstanding after the new issue, intrinsic value per share would decrease.\nThings to remember:\nIssuing equity securities impacts a company's balance sheet. Common stock, a component of shareholders' equity, increases to account for the\nvalue of shares issued. Since cash is an asset, the net proceeds from the offering (ie, the cash received in exchange for the common shares\nissued) increase total assets.\nExplain the role of equity securities in the financing of a company’s assets", "qhtml": null}, {"n": 141, "q": "A business student gathers the following information on a company: If return on equity (ROE) is calculated using average amounts from the balance sheet, then the ROE in 20X3 most accurately: ", "opts": ["improved from 20X2.", "did not change from 20X2.", "worsened from 20X2."], "ans": "A", "expl": "Return on equity (ROE) is the rate of return that shareholders receive on their equity capital. It is frequently calculated as the ratio of net\nincome to average shareholders' equity. The ROE in 20X3 is higher than in 20X2, meaning that the company generated more net income\nusing the equity invested. This indicates improvement in ROE and performance.\nNote that in some cases, the question may specify to calculate ROE using beginning book value of equity alone in the denominator (instead of\naverage book value). This may be a reasonable approach assuming there is little difference in the book value of equity at the beginning of the\nyear and at the end of the year.\nThings to remember:\nROE is the rate of return that shareholders receive on the equity capital. It is frequently calculated by dividing net income by average\nshareholders' equity.\nCompare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return", "qhtml": null}, {"n": 142, "q": "Which of the following is least likely a characteristic of a good candidate for a leveraged buyout?", "opts": ["High levels of cash flow", "Large amounts of undervalued assets", "High market value relative to book value"], "ans": "C", "expl": "When investors (usually a group of investors) purchase a controlling share of a company and the company's shares are no longer publicly traded,\nthe company has been taken private. When investors finance that share buyout with a large proportion of debt, it is referred to as a leveraged\nbuyout (LBO).\nThe most attractive candidates for LBOs are companies that have:\nlarge amounts of undervalued assets that can be sold to pay down debt and/or\nhigh levels of cash flow that can service (ie, pay interest and principal on) the debt (Choices A and B).\nA high market value relative to book value makes a company potentially less attractive as a buyout target. A high market-to-book (eg, price-to-\nbook value [P/B]) ratio implies that it would be relatively expensive to take a company private since its share price is relatively high, reducing\npotential returns to the buyout group. Also, a high P/B ratio indicates that the company's assets are less likely to be undervalued.\nThings to remember:\nA leveraged buyout (LBO) occurs when a group of investors takes a public company private, relying on debt to finance the transaction. Good\ncandidates for LBOs are companies with high levels of cash flow and/or large amounts of undervalued assets. A high market value compared to\nbook value implies that it would be relatively expensive to take the company private, reducing potential returns to the buyout group.\nCompare and contrast public and private equity securities", "qhtml": null}, {"n": 143, "q": "With respect to cumulative preference shares, dividends that were not paid in prior periods are most likely:", "opts": ["forfeited and not paid to cumulative preference shareholders in the future.", "accrued and paid to cumulative preference shareholders in the future before paying common shareholders.", "accrued and paid to cumulative preference shareholders in the future only after paying common shareholders."], "ans": "B", "expl": "Types of preference shares (preferred stock)\nCumulative Accrues for past dividends that are unpaid\nNoncumulative Does not accrue dividends that are undeclared and unpaid in past periods\nParticipating Allows for additional dividend payments if company profits exceed a certain threshold\nNonparticipating Fixed dividend; no additional payments based on company performance\nConvertible Can convert into a specified number of common shares\nCallable Allows issuer to buy back shares from investors for a specified price\nPutable Allows investors to sell shares back to issuer for a specified price\nPreferred (preference) shares ownership represents a form of equity investment in a company. Preference shares may grant certain benefits to\npreferred shareholders such as high dividend payments and in some cases conversion rights (to common stock). Furthermore, dividend\npayments to preferred shareholders take precedence over dividend payments to common shareholders. Preferred dividends can be cumulative\nor noncumulative.\nFor cumulative preference dividends, if a company does not pay a dividend (or dividends) in one period (or several periods), the unpaid dividend\naccrues and is owed in the future. Conversely, for noncumulative preference dividends, the company does not accrue (and does not owe payment\nfor) unpaid dividends from past periods.\n(Choice A) Unpaid dividends on cumulative preferred shares are accrued and owed to preferred shareholders.\n(Choice C) Payments of past unpaid dividends are due to preference shareholders before any dividends can be distributed to common\nshareholders.\nThings to remember:\nFor cumulative preference dividends, if a company does not pay a dividend, the unpaid dividend is accrued and paid in the future. Accrued\ndividends from cumulative preference shares must be paid before dividends can be paid to common shareholders. Conversely, for noncumulative\npreference dividends, the company neither accrues nor owes payment for unpaid dividends from past periods.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null}, {"n": 144, "q": "In contrast to statutory voting, cumulative voting allows common shareholders to cast:", "opts": ["more total votes.", "all votes for one candidate.", "one vote for multiple candidates."], "ans": "B", "expl": "Shareholders often vote in board of director elections, which are conducted via statutory voting or cumulative voting. Often, one vote is tied to\neach share.\nIn the case of statutory voting, shareholders must allocate their total votes, which are based on the number of open board seats, evenly among\nthe candidates. Under this system, larger shareholders have greater representation than smaller shareholders. In cumulative voting,\nshareholders can disproportionally allocate their votes to any one candidate (or any number of candidates), which can improve representation\nfor smaller shareholders.\nIn the example above, three board seats are open for election and there are five candidates. Suppose a particular shareholder has 300 votes.\nUnder statutory voting, the shareholder must pick three candidates and distribute 100 votes to each of the three. Under cumulative voting, the\nshareholder can apply all 300 votes to one candidate. This benefits the shareholder if this shareholder strongly prefers a specific candidate to win\na board seat.\n(Choice A) A cumulative voting system does not change the total number of votes granted to a shareholder.\n(Choice C) Each vote is cast for one candidate. A single vote cannot be split for multiple candidates.\nThings to remember:\nIn the case of statutory voting, shareholders must allocate their total votes evenly among candidates based on the number of open board seats. In\ncumulative voting, shareholders can disproportionally allocate their votes to any one candidate (or candidates), granting smaller shareholders\nbetter representation.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null}, {"n": 145, "q": "Which of the following is most likely a feature of preference shares?", "opts": ["Call features allow issuers the right to buy back shares from investors.", "Convertible shares allow shareholders to convert shares into subordinated debt.", "Participating shares provide shareholders the same voting rights as common shares."], "ans": "A", "expl": "Types of preference shares (preferred stock)\nCumulative Accrues for past dividends that are unpaid\nNoncumulative Does not accrue dividends that are undeclared and unpaid in past periods\nParticipating Allows for additional dividend payments if company profits exceed a certain threshold\nNonparticipating Fixed dividend; no additional payments based on company performance\nConvertible Can convert into a specified number of common shares\nCallable Allows issuer to buy back shares from investors for a specified price\nPutable Allows investors to sell shares back to issuer for a specified price\nPreference (ie, preferred) shares are a type of equity security. Compared to common shares, preference shares often have larger (but fixed)\ndividends, as well as higher priority over dividend payments and residual claims on a company's assets.\nThere are several types of preference shares (shown in the table above). If preference shares are callable, they have an embedded call option\nthat gives the issuing company (ie, issuer) the right to buy back shares from investors at a predetermined call price.\n(Choice B) Convertible shares allow shareholders to convert their shares into common stock, not subordinated debt.\n(Choice C) Participating shares provide shareholders the opportunity to earn additional dividend payments if a company's profits exceed a\npredetermined threshold. They do not provide voting rights.\nThings to remember:\nPreference (ie, preferred) shares are a type of equity security. Callable shares have an embedded call option that gives the issuing company the\nright to buy back shares from investors at a predetermined call price.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null}, {"n": 146, "q": "Compared with a company's common shares, its nonparticipating, nonconvertible preferred stock most likely has:", "opts": ["a greater dividend yield.", "a greater expected return.", "greater share price volatility."], "ans": "A", "expl": "Comparison of equity securities\nNonconvertible, nonparticipating preferred Common\nHigher dividend yield Fully participate in company upside\nGreater downside protection Dividends can increase along with earnings\nDividends cannot be increased Dividends cut if earnings fall\nLimited potential for appreciation Shares can fall to zero if company value declines\nAs owners of a company, common shareholders participate in its operating performance. The more (less) valuable the company becomes, the\ngreater (less) the value of its common shares. Also, common dividends can increase (decrease) with company earnings. Preferred stocks (ie,\npreference shares) offer advantages relative to common shares.\nDividend preference: Preferred dividends must be paid before any common stock dividends can be paid.\nAsset preference: If the company is liquidated, preferred shareholders must receive the par value of their shares before the common\nshareholders receive any distributions.\nHowever, balancing these preferences are factors that limit the upside for preferred shareholders. Nonparticipating, nonconvertible preferred\nstocks do not participate in increases in the company's value or in dividend increases due to company performance. To compensate for these\nlimits, preferred stocks usually have greater dividend yields than common stocks.\n(Choice B) Despite their larger dividend yields compared with common stocks, preferred shares have lower expected returns due to their\nexclusion from participation in company performance.\n(Choice C) Due to their seniority and more predictable dividend payments compared to common stock, preferred stocks exhibit lower price\nvolatility.\nThings to remember:\nIn contrast to common shares, nonparticipating, nonconvertible preferred stocks do not participate in increases in the company's value and cannot\nhave their dividends increased. In compensation for their limited returns, preferred stocks have higher dividend yields than common stocks.\nCompare the risk and return characteristics of different types of equity securities", "qhtml": null}, {"n": 147, "q": "A demand analysis of a company's product should most likely consider:", "opts": ["company capacity and cost structure.", "industry concentration in input markets.", "product differentiation among competitors."], "ans": "C", "expl": "Analysis of company products and services\nMarket size\nProduct differentiation\nDemand\nEconomic and demographic factors\nOpportunities\nInput sources\nCapacity\nSupply\nImport/export considerations\nProprietary products\nAn analysis of demand is conducted to estimate a firm's current and future revenue. Factors considered include the following:\nSize of the market: Potential unit sales and prices and forecasted rates of change\nIndustry product: Either differentiated (eg, make/model of automobiles) or homogeneous (eg, mobile phone service)\nExternal influences: Sensitivity of industry revenues to changes in the economy (eg, GDP growth), demographics (eg, age distribution of\npopulation), and social attitudes (eg, tobacco use, income inequality)\nBusiness opportunities: Revenue potential from introducing new products or entering new markets\nProduct differentiation among competitors relates to the analysis of demand. When competitors sell undifferentiated products, price competition\nis more intense. Firms operating in such commoditized markets have little pricing power. If products differ among competitors (ie, differentiated\nproducts), demand is more stable, and firms tend to have more pricing power. If products are not qualitatively different, firms attempt to achieve\ndifferentiation through advertising and trademarks to promote brand loyalty.\n(Choices A and B) Company capacity and cost structure and industry concentration are considered when analyzing supply.\nThings to remember:\nAn analysis of demand is conducted to estimate current and future revenue. Factors considered include the size of the market, product\ndifferentiation, external influences (eg, economic, demographic), and revenue potential for introducing new products or entering new markets.\nDescribe the elements that should be covered in a thorough company research report", "qhtml": null}, {"n": 148, "q": "A company is developing a product for planned launch in 20X8. An analyst collects the company's 20X7 actual financial data and creates 20X8 forecasts for two scenarios: 20X8 20X8 (in € millions) 20X7 Product launches Product does not launch Sales 1,000 1,500 1,200 Operating income 100 200 140 The company's degree of operating leverage in 20X8 will most likely be:", "opts": ["greater if the new product launches in 20X8.", "the same regardless of whether the new product launches.", "greater if the new product does not launch in 20X8."], "ans": "B", "expl": "Operating leverage refers to the level of fixed costs in a company's cost structure. Increasing fixed costs relative to variable costs increases\noperating leverage. The degree of operating leverage (DOL) measures the rate at which operating profit increases (decreases) relative to the\nrate at which sales increase (decrease). The greater (smaller) a company's operating leverage, the more (less) operating income will change\ngiven a change in sales.\nA company's DOL may differ from its peers' depending on its cost structure, and a single company's DOL can change over time. In this scenario,\nthe company's DOL must be calculated and compared for two separate scenarios:\nIf the company launches a new product\nIf the company does not launch a new product\nThe company's DOL under each scenario can be calculated as:\nIn both scenarios, the percentage change in operating income is twice the percentage change in sales, so the company's DOL is the same\n(Choices A and C). Note, however, that this may not always be the case, such as if the new product had a greater or lesser contribution margin\nor fixed cost requirements than the overall company, all else equal.\nThings to remember:\nMore fixed costs in a company's cost structure in relation to variable costs increases operating leverage. The degree of operating leverage (DOL)\nmeasures the rate that operating profit changes in relation to changes in sales. A company's DOL may differ from its peers' depending on its cost\nstructure, and a single company's DOL can change over time.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null}, {"n": 149, "q": "Which of the following metrics should most appropriately be considered in top-down revenue analysis for a restaurant company? The company's: ", "opts": ["market share.", "number of restaurants.", "average revenue per seat."], "ans": "A", "expl": "Forecasting a company's financials (eg, revenue, working capital) can be done using a top-down, bottom-up, or hybrid approach.\nA top-down approach starts by identifying factors that can affect growth in the overall economy, sector, or industry in which the\ncompany operates and then applies those factors to company-specific forecasts.\nA bottom-up approach starts with features of the company or a segment of the company (eg, product, geography) and uses company-\nspecific historical ratios or growth rates to construct forecasts by assuming a continuation of, or a change in, a trend.\nAnalysts will often use a combination of both approaches, which can be useful for uncovering biases or errors that may arise from using only one\napproach.\nCommon top-down approaches use GDP growth or market size and market share. Using market size and mar
