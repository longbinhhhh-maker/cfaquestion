scenario, the analyst has only one-year forecasts.\nThings to remember:\nMultiplier models estimate value using ratios that relate market value (eg, share price, enterprise value [EV]) to an accounting value (eg, earnings\nper share, sales). Valuation is assessed by comparing the chosen multiple (eg, P/E, EV/sales) for the company being evaluated to a comparable\ncompany's multiple or to a benchmark. Multiples can be computed using accounting measures from previous periods or forecasts for future\nperiods (ie, trailing or forward multiples).\nDescribe major categories of equity valuation models", "qhtml": null}, {"n": 262, "q": "A company declares a regular cash dividend. All else being equal, the stock's price will most likely fall by the amount of the dividend on the:", "opts": ["declaration date.", "ex-dividend date.", "holder-of-record date."], "ans": "B", "expl": "The ex-dividend date is the first day that a company's shares trade without rights to the dividend. The shares fall by the value of the dividend\nsince the cash value of the dividend is now pledged and transferred to shareholders and is no longer an asset of the company.\nThe ex-dividend date is directly tied to the settlement process (eg, T + 2) since shares purchased on or after the ex-dividend date settle after the\nholder-of-record date (eg, official ownership).\n(Choice A) The declaration date is the date the company announces the specifics of the dividend (eg, size, payment date). The share price does\nnot fall on this date since the shares could still be bought with rights to the dividend.\n(Choice C) The holder-of-record date is announced on the declaration date and is the day the company recognizes the legal owners of the\ndividend. If the holder-of-record date is known, the ex-dividend date can be determined based on the settlement process of the market in which\nthe shares trade.\nThings to remember:\nThe ex-dividend date is the first day that the shares trade without rights to the dividend. The share price falls by the value of the dividend since the\ncash value of the dividend is now pledged and transferred to shareholders and is no longer an asset of the company.\nDescribe dividend payment chronology", "qhtml": null}, {"n": 263, "q": "An analyst has gathered the following information: Using the two-stage dividend discount model, the long-term growth rate is closest to: ", "opts": ["5%", "6%", "11%"], "ans": "A", "expl": "The two-stage dividend discount model (DDM) is used to find the value of a company expected to have high growth (short term), followed by lower\nconstant growth (long term). The high-growth stage is assumed to last for a certain number of (n) years, followed by an infinite constant growth\nstage.\nIn the two-stage DDM, the Gordon growth model (GGM) is used to find the value of the second stage, which has long-term dividend growth. The\nvalue (V ) of the long-term growth stage dividends at the end of Year 3, €61.50, can be used to calculate the long-term growth rate using the\n3\nGGM. To derive the long-term growth rate, rearrange the GGM and substitute the values to calculate g :\nL\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate LOS\n67. Which of the following is least likely needed to value equity using a present value model?\n A. Dividends\nB. Time horizon\nC. Discount rate\nExplanation\nIn a present value model, the intrinsic value of a stock is determined by the present values of the stock's future cash flows. The present value of\neach cash flow is calculated by discounting it by an appropriate discount rate over a relevant time period (ie., discounting the cash flow). The sum\nof the discounted cash flows is the intrinsic value of the equity.\nA present value model uses cash flows to value equity. These cash flows may be dividends or free cash flows. If dividends are not available for\nuse, then free cash flows may be used instead. For an application of the present value model, see this present value example.\n(Choice B) Present value models are based on discounting cash flows over an appropriate time horizon. Thus, the time horizon of each cash\nflow is required to determine the intrinsic value of the asset. In some models, the time horizon may be infinity, in which case time is not a direct\ninput. However, in these cases the infinite time horizon is implicitly required to use the model.\n(Choice C) Present value models require an appropriate discount rate. Otherwise the present value cannot be obtained.\nThings to remember:\nThe rationale for using present value models to value equities is an asset's intrinsic value is equal to the sum of the present values of its future\ncash flows. Free cash flows may be used instead of dividends in present value models.\nExplain the rationale for using present value models to value equity and describe the dividend discount and free-cash-flow-to-equity models", "qhtml": null}, {"n": 264, "q": "Which of the following is least likely needed to value equity using a present value model?", "opts": ["Dividends", "Time horizon", "Discount rate"], "ans": "A", "expl": "In a present value model, the intrinsic value of a stock is determined by the present values of the stock's future cash flows. The present value of\neach cash flow is calculated by discounting it by an appropriate discount rate over a relevant time period (ie., discounting the cash flow). The sum\nof the discounted cash flows is the intrinsic value of the equity.\nA present value model uses cash flows to value equity. These cash flows may be dividends or free cash flows. If dividends are not available for\nuse, then free cash flows may be used instead. For an application of the present value model, see this present value example.\n(Choice B) Present value models are based on discounting cash flows over an appropriate time horizon. Thus, the time horizon of each cash\nflow is required to determine the intrinsic value of the asset. In some models, the time horizon may be infinity, in which case time is not a direct\ninput. However, in these cases the infinite time horizon is implicitly required to use the model.\n(Choice C) Present value models require an appropriate discount rate. Otherwise the present value cannot be obtained.\nThings to remember:\nThe rationale for using present value models to value equities is an asset's intrinsic value is equal to the sum of the present values of its future\ncash flows. Free cash flows may be used instead of dividends in present value models.\nExplain the rationale for using present value models to value equity and describe the dividend discount and free-cash-flow-to-equity models", "qhtml": null}, {"n": 265, "q": "An analyst compiles the following information to compare price-to-earnings ratios of stocks in the same industry: Using time-series analysis of the four years of data, as of 20X9, Company X was:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "C", "expl": "The method of comparables (comps) is the most common way to compare and report on price multiples. The analyst compares a price multiple\nof a company stock to that of a benchmark (ie, similar company stock, industry average).\nIf the price multiple of the stock is\nlower than the benchmark, then the stock is considered to be undervalued,\nthe same as the benchmark, then the stock is considered to be fairly valued,\nhigher than the benchmark, then the stock is considered to be overvalued.\nThe comparables method can be used in two ways. Time-series analysis involves comparing a price multiple of one asset with itself over multiple\ntime periods. Cross-sectional analysis involves comparing the price multiples of several different assets for a single time period.\nIn this scenario, Company X had a trailing price-to-earnings (P/E) ratio of 24.67 in 20X9, which is above its average trailing P/E of 21.42 for the\nperiod (20X6-20X9). Thus, based on time-series analysis, the stock of Company X is overvalued as of 20X9.\nAn analyst using cross-sectional analysis instead of time-series analysis would conclude that Company X is undervalued in 20X9, since its P/E\nratio of 24.67 is clearly lower than the average P/E ratio of all three companies. However, using time-series analysis, Company X is overvalued,\nnot undervalued or fairly valued (Choices A and B).\nThings to remember:\nThe method of comparables using time-series analysis compares a price multiple of a stock to the average price multiple of the same stock over\nmultiple time periods.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 266, "q": "A key assumption relating justified forward P/E ratio to company fundamentals using the Gordon growth model is that a stock's:", "opts": ["price is equal to its value.", "dividend payout ratio increases over time.", "dividend growth rate is greater than the required rate of return."], "ans": "A", "expl": "A price multiple is a ratio that compares a company's stock price to another fundamental value. One such multiple is the price-to-earnings ratio\n(P/E ratio), which equals the company's stock price divided by its earnings per share. Trailing P/E uses past earnings, whereas forward P/E is\nbased on future earnings. If the forward earnings estimate is based on a model used to estimate company fundamentals or cash flows, the ratio is\nreferred to as justified forward P/E.\nTo understand the relationship between justified forward P/E and company fundamentals, begin with the Gordon growth model (GGM):\nThis results in the formula for forward justified P/E ratio. Therefore, the assumption that price is equal to value is key to the relationship\nbetween justified forward P/E ratio and company fundamentals using the GGM.\nThings to remember:\nThe assumption that price is equal to value is key to the relationship between justified forward P/E ratio and company fundamentals using the\nGordon growth model. The P/E ratio equals a company's stock price divided by its earnings per share. Trailing P/E uses recent earnings,\nwhereas leading P/E uses future earnings.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 267, "q": "An analyst gathers the following information about a company: If the company has 50 million common and 160,000 preferred shares, the company's market price per common share is closest to:", "opts": ["CHF 21.32", "CHF 21.44", "CHF 21.61"], "ans": "B", "expl": "In this scenario, the analyst is estimating the company's market price per share based on its enterprise value (EV). This is accomplished by\nrearranging the formula for EV to solve for market capitalization (ie, the market value of common stock). Then substitute the values above:\nThe market capitalization of the company is CHF 1,072 million. Rearrange the formula for market capitalization to solve for market price per share\nas follows, and substitute values:\nThe estimated market price per share is CHF 21.44.\n(Choice A) 21.32 is the result of failing to add in the value of short-term investments when calculating market capitalization.\n(Choice C) 21.61 is the result of incorrectly including the market value of preferred shares in the calculation of market capitalization and including\nthe preferred shares in the number of shares used to find market price per share.\nThings to remember:\nEnterprise value (EV) is equal to the market capitalization (ie, the market value of common stock) plus the market value of preferred stock plus the\nmarket value of debt minus cash and short-term investments. The EV can be used to estimate the market value of a firm's common stock.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 268, "q": "The ex-dividend date is best described as the date when:", "opts": ["the company pays the dividend.", "the company declares the amount and timing of the dividend.", "the stock trades for the first time without the right to the dividend."], "ans": "C", "expl": "The ex-dividend date (ie, ex-date) is the first day that a company's shares trade without rights to the dividend. Since shares purchased on or\nafter the ex-date do not convey the right to receive the dividend, the share price typically falls by the amount of the dividend on the ex-date.\nThe ex-dividend date is directly tied to the settlement process (eg, T + 2) since shares purchased on or after the ex-dividend date settle after the\nholder-of-record date (ie, record date).\n(Choice A) The dividend payment date is announced when the company declares the dividend and is the day the company will actually transfer\nfunds to those entitled to the dividend.\n(Choice B) The declaration date is the date the company announces the specifics of the dividend (eg, size, payment date). Since the declaration\ndate is often weeks or months before the record date, the shares can still be bought with rights to the dividend.\nThings to remember:\nThe ex-dividend date is the first day that a company's shares trade without rights to the dividend. The ex-dividend date is directly tied to the\nsettlement process since shares purchased on or after the ex-dividend date settle after the holder-of-record date.\nDescribe dividend payment chronology", "qhtml": null}, {"n": 269, "q": "An asset-based valuation model is most appropriate for a company that:", "opts": ["is in financial distress and plans to liquidate.", "acquired a competitor three years ago for a significant premium.", "has accumulated a significant amount of property, plant & equipment."], "ans": "A", "expl": "Asset-based valuation models\nAre best for companies:\nAre difficult for companies:\nwith large proportions of current assets\nwith large proportions of fixed or\nand liabilities\nintangible assets\nwith assets and liabilities that are more\nwith off-the-books assets and liabilities\nliquid\nin hyperinflationary environments\nthat are being liquidated\nAn asset-based valuation model estimates the value of a company as the market value of its net assets available for common shareholders. It\nis calculated as:\nNet assets = Assets − (Liabilities + Preferred equity)\nSince companies report assets and liabilities at book value, asset-based valuation models are most appropriate for companies with assets and\nliabilities that are more current and/or have market values most readily available (ie, assets that are more liquid).\nAsset-based valuation models are also more appropriate than discounted cash flow models for companies that plan to liquidate since the\ncompanies' assets will no longer produce cash flows. In that case, the value of a company is solely the net assets remaining after the necessary\nasset sales to cover the company's liabilities. These values will likely be less than values for similar assets in going concerns because the\nliquidating company will sell its assets with more urgency.\n(Choice B) A company that acquired a competitor will have a significant portion of goodwill on its balance sheet. Market values of intangible\nassets such as goodwill often vary from book values and can be difficult to properly assess.\n(Choice C) Assessing the market value of property, plant & equipment (PPE) is more difficult because PPE is usually less liquid than other\nassets. As a result, applying an asset-based valuation is more difficult for a company with large amounts of PPE.\nThings to remember:\nAn asset-based valuation model estimates the value of a company as the market value of its net assets available to common shareholders. It is\ncalculated as\nNet assets = Assets − (Liabilities + Preferred equity)\nAsset-based valuation models, rather than discounted cash flow models, are more appropriate for companies that plan to liquidate since the\ncompanies' assets will no longer produce cash flows.\nDescribe asset-based valuation models and their use in estimating equity value", "qhtml": null}, {"n": 270, "q": "The EV/EBITDA ratio is sometimes used as an alternative to the P/E ratio since EBITDA is:", "opts": ["usually positive.", "equal to operating cash flow.", "earnings before adjusting for all noncash expenses and revenues."], "ans": "A", "expl": "For several reasons, the enterprise value (EV) to EBITDA (EV/EBITDA) ratio is sometimes used as an alternative to the P/E ratio to value a firm's\nequity. Since EV accounts for the market value of all types of capital whereas price refers only to the market value of common stock, the\nEV/EBITDA ratio is both more comprehensive than P/E and is also more useful for comparing companies with significant differences in capital\nstructure. The P/E ratio has the disadvantage that earnings may be negative. EBITDA is usually positive, even when earnings are negative.\nAlthough EBITDA is viewed by some as a proxy for operating cash flow (OCF), EBITDA and OCF are not the same thing (Choice B). EBITDA is\nnet income with interest, taxes, depreciation, and amortization added back in. OCF, by contrast, is cash flow from the business's normal\noperations, and is calculated by adjusting net income for noncash charges and working capital items like changes in accounts receivable and\ninventory. Therefore, EBITDA is not adjusted for all noncash expenses and revenues (Choice C).\nThings to remember:\nEnterprise value (EV) accounts for the market value of common and preferred equity and debt. Earnings may sometimes be negative, so the\nEV/EBITDA ratio may be used as an alternative to the P/E ratio to find the value of a company's common equity. The EV/EBITDA ratio is viewed\nas more comprehensive than P/E ratio.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 271, "q": "An analyst gathers the following information about the common stock of a mature company, with dividend growth expected to be constant for an indefinite period. Current market price $107.36 Long-term dividend growth rate 4.0% Industry dividend growth rate 3.6% Required rate of return 6.5% Assume the stock is fairly valued. Based on this information and the appropriate valuation model, the amount of the company's last dividend paid is closest to: ", "opts": ["$2.58", "$2.68", "$3.01"], "ans": "A", "expl": "The Gordon growth model (GGM) is commonly used to estimate the intrinsic value of a stock. Dividend discount models, such as the GGM,\nare present-value models that use future dividends as a stock's cash flows to determine the stock's value.\nThe GGM assumes a company has steady growth in earnings and a constant dividend payout ratio, resulting in a constant dividend growth rate\n(g). Modeling the stock as a perpetuity, the GGM states that stock's intrinsic value is calculated by discounting the next dividend by the\nrequired rate of return (r), adjusted for the constant dividend growth rate.\nIn this scenario, the company's dividend is expected to be constant for an indefinite period, so the GGM is the appropriate model to use. Since the\nstock is fairly valued, its market price is equal to its intrinsic value. The last dividend can be determined by rearranging the GGM and substituting\nas follows:\n(Choice B) $2.68 is the next dividend, which is the result of calculating the product in the numerator and failing to divide by (1 + g).\n(Choice C) $3.01 is the result of incorrectly using the industry's long-term dividend growth rate in place of the company's long-term dividend\ngrowth rate.\nThings to remember:\nThe Gordon growth model (GGM) assumes a company has steady growth in earnings and a constant dividend payout ratio, resulting in a constant\ndividend growth rate. The GGM states that stock's intrinsic value is calculated by discounting the next dividend by the required rate of return (r),\nadjusted for the constant dividend growth rate.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 272, "q": "Which of the following most likely combines an estimate based on a present value model with a fundamental variable?", "opts": ["Justified forward price-to-earnings ratio", "Trailing 12-month price-to-earnings ratio", "Cross-sectional comparison of price-to-earnings ratios"], "ans": "A", "expl": "Price-to-earnings (P/E) ratios\nTrailing P/E Forward P/E Justified forward P/E\nJustified by future flows\nNumerator Current price\n(free cash flow, dividends)\nDenominator Past earnings Future earnings Future earnings\nIn general, a price multiple is a ratio that expresses the relationship between a stock's price and a fundamental variable (eg, earnings). This form\nof relative valuation can help investors gauge whether the stock is fairly valued compared with similar stocks. The price-to-earnings (P/E) ratio is a\ncommon price multiple that relates stock price to earnings per share (EPS).\nWhen a price multiple is justified (eg, justified forward P/E ratio), the price in the numerator is typically based on a present value calculation\n(eg, discounted free cash flow, discounted dividends) and the denominator is based on a near-term estimate of the fundamental variable (eg,\nnext year's forecasted EPS). In this scenario, a justified forward P/E ratio combines a present value model with a fundamental variable.\n(Choice B) A trailing 12-month P/E ratio (Current stock price / Earnings of the previous 12 months) uses the current stock price (not the justified\nprice) in the numerator.\n(Choice C) The cross-sectional method of comparison involves comparing several price multiple values (eg, P/E ratios of several companies).\nThis method relies on the law of one price, not on justified values. The law of one price states that the stocks of similar companies should be\nsimilarly valued using current market prices and relative to their respective current fundamentals.\nThings to remember:\nWhen a price multiple is justified (eg, justified forward price-to-earnings ratio), the stock price (numerator) is typically based on a present value\ncalculation (eg, discounted cash flow model) and the fundamental variable (denominator) is based on a near-term estimate (eg, next year's\nforecasted earnings per share).\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 273, "q": "Regarding equity valuation, which of the following most likely relies on the law of one price?", "opts": ["A year-on-year comparison of a company's stock price.", "A cross-sectional comparison of P/E ratios across automobile manufacturers.", "A comparison between a justified P/E ratio and a trailing 12-month P/E ratio for a stock."], "ans": "B", "expl": "Price multiples, such as the P/E ratio, typically express the relationship between a company's stock price and a fundamental variable, such as\nearnings. The method of comparables commonly entails comparing price multiples across companies in the same industry (ie, cross-sectional\nanalysis) to gauge whether a company is fairly valued relative to its competitors based on the law of one price.\nIn theory, the law of one price implies that similar companies should be priced similarly relative to their fundamentals. For example, if the\nmedian P/E ratio in an industry is 10, then a fairly priced company would be priced at 10 times its EPS. If a company's stock price is more (less)\nthan 10 times its EPS, then it may be overvalued (undervalued) relative to its industry peers.\n(Choice A) A year-on-year comparison of stock price measures growth for shareholders. Unless the stock price is compared to a fundamental\nvariable, the law of one price does not apply.\n(Choice C) A trailing 12-month P/E ratio is based on current price and historical earnings, whereas a justified forward P/E ratio is based on\nforecasted stock price and earnings. Comparing the two P/E ratios (justified versus trailing) does not rely on the law of one price.\nThings to remember:\nThe method of comparables commonly entails comparing price multiples across companies in the same industry (ie, cross-sectional analysis) to\ngauge whether a company is fairly valued relative to its competitors based on the law of one price. In theory, the law of one price stipulates that\nsimilar companies should be priced similarly relative to their fundamentals.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 274, "q": "The two-stage dividend discount model is most appropriate for a company expecting:", "opts": ["high growth for a specified number of years, then higher growth.", "constant growth for a specified number of years, then high growth.", "high growth for a specified number of years, then lower, long-term growth."], "ans": "C", "expl": "The two-stage dividend discount model (two-stage DDM) is used to find the value of a company expected to have high growth (short-term\ngrowth) lasting n years, followed by lower, long-term growth for an infinite number of time periods. Each of the dividend discount models\ncorresponds to a certain company growth stage. Like all present value models, dividend discount models assume the value of an asset is equal to\nthe present value of its future cash flows.\nIn this scenario, the company's high growth stage is expected to last for a specified number of years, followed by a period of lower, long-term\ngrowth, so the two-stage DDM is appropriate for valuation. Slower company growth can happen for many reasons, including fewer product\ninnovations, increased competition, and maturing markets.\nThings to remember:\nThe two-stage dividend discount model is used to find the value of a company expected to experience high growth followed by lower, long-term\ngrowth.\nIdentify characteristics of companies for which the constant growth or a multistage dividend discount model is appropriate", "qhtml": null}, {"n": 275, "q": "An analyst expects a company to pay its first dividend of SGD 5 per share in 4 years and expects this dividend to grow at a rate of 4% thereafter. The required rate of return is 9% and the expected market return is 10%. If the stock is currently trading at SGD 73.68, then based on the dividend discount model, the analyst should most appropriately classify the stock as:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "A", "expl": "The Gordon growth model (GGM) is a dividend discount model that estimates a stock's intrinsic value as the present value of its future cash\nflows, a stream of dividends that grow at a constant rate. To calculate the present value of this perpetuity, discount the next dividend by the\nrequired rate of return (r) adjusted for the constant dividend growth rate (g).\nIn this scenario, the analyst expects the stock to begin paying a dividend of SGD 5 per share in Year 4. Therefore, using the GGM, the stock's\nintrinsic value at the end of Year 4 is calculated as the present value of the dividend in Year 5. The dividend in Year 4 is added separately as part\nof the company's future cash flows but not accounted for in the constant growth value.\nBased on the GGM, the stock's intrinsic value is SGD 77.22. Since the market price of SGD 73.68 is lower than the intrinsic value, the stock is\nundervalued.\n(Choice B) A conclusion that the stock is fairly valued results from omitting the Year 4 dividend to arrive at an intrinsic value of SGD 73.68, equal\nto the market price.\n(Choice C) A conclusion that the stock is overvalued results from using the expected market return (10%) instead of the required rate of return\n(9%) to arrive at an intrinsic value of SGD 62.68.\nThings to remember:\nThe Gordon growth model estimates a stock's intrinsic value as the present value of its future cash flows, a stream of dividends that grow at a\nconstant rate. To calculate the present value of this perpetuity, discount the next dividend by the required rate of return adjusted for the constant\ndividend growth rate.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 276, "q": "An analyst estimates the following information about a company's stock: According to the two-stage dividend discount model, the stock's current intrinsic value is closest to:", "opts": ["£55.34", "£58.48", "£60.59"], "ans": "B", "expl": "According to the two-stage dividend discount model (DDM), the intrinsic value of the asset (V ) is the present value of two streams of cash\n0\nflows: the dividends from the high-growth stage and the dividends from the long-term growth stage.\nDividends for the first three years (high-growth period), D D , and D , are obtained by multiplying £0.93 by (1 + 0.11), (1 + 0.11)2, and (1 + 0.11)3\n1, 2 3\nrespectively:\nThe Year n value of the 2nd stage dividends, V , is used as the terminal value input for the 1st stage. In this scenario, the value V is given as\n3 3\n£66.00. Substitute all values into the two-stage DDM:\n(Choice A) £55.34 is the result of incorrectly discounting the terminal value of £66.00 by the required rate of return for four years instead of three\nyears.\n(Choice C) £60.59 is the result of incorrectly adding in the dividend at the end of Year 4. According to the model, the Year 4 (Year n + 1) dividend\nand every other dividend in the long-term growth stage are discounted to calculate V (£66.00), so it is incorrect to add the discounted value of D\nn 4\ntwice.\nThings to remember:\nThe intrinsic value of the asset (V ) in the two-stage dividend discount model is the sum of the present values of the dividends from the high-\n0\ngrowth stage and the dividends from the long-term growth stage. The Year n value of the 2nd stage dividends is used as the terminal value input\nfor the 1st stage.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 277, "q": "Which of the following is the best reason for a firm to engage in a share repurchase?", "opts": ["Exert greater control in voting shares for proxy issues.", "Control the timing and size of shareholder distributions.", "Receive regularly scheduled cash dividends from repurchased shares."], "ans": "B", "expl": "Regarding shareholder wealth, all else being equal, repurchasing shares is comparable to paying cash dividends; both return cash to\nshareholders. A share repurchase allows the company greater control in the timing and size of shareholder distributions. Some companies prefer\nthis approach to avoid a regular cash dividend and all the market expectations that go along with paying it.\nBy controlling the timing and size of share repurchase, management can buy shares to support the share price and/or offset the exercise of\nemployee stock options. Share repurchase has also gained popularity since it is often a more tax-efficient means of returning cash to\nshareholders.\nRepurchased shares are excluded from the earnings per share (EPS) calculation. This has a positive impact on EPS growth and is also a reason\nwhy a company's management pursues share repurchase instead of a cash dividend.\n(Choices A and C) Shares that have been repurchased are not eligible to participate in cash dividends or shareholder voting.\nThings to remember:\nRegarding shareholder wealth, all else being equal, share repurchase is comparable to paying cash dividends. A share repurchase allows the\ncompany to control the timing and size of this shareholder distribution without affecting dividend expectations. Shares that have been repurchased\nare not eligible to participate in cash dividends or voting.\nDescribe regular cash dividends, extra dividends, stock dividends, stock splits, reverse stock splits, and share repurchases", "qhtml": null}, {"n": 278, "q": "An analyst estimates a company's ratio of enterprise value (EV) to EBITDA to be 10 based on peer analysis. The analyst gathers the following company information: INR millions Cash and cash equivalents 80 Book value of debt 800 Market value of debt 725 Short-term investments 25 If the company is expected to report EBITDA of INR 200 million this year, its market capitalization (in INR millions) is closest to:", "opts": ["1,305", "1,355", "1,380"], "ans": "C", "expl": "Enterprise value (EV) measures the total value of a firm (ie, common equity, net debt). EV is also considered the takeover value, the amount an\nacquirer would pay for a target firm less the target's cash (since cash can be used to pay down debt).\nEV multiples allow for evaluating a firm's relative value over time or compared with other firms. When combined with net debt, the estimate of EV\nderived from the EV multiple can also be used to estimate the firm's market capitalization (ie, equity value).\nIn this scenario, the analyst is estimating the market capitalization of the company based on its EV-to-EBITDA ratio. The formula for the EV-to-\nEBITDA ratio can be rearranged to solve for market capitalization as follows:\nMarket capitalization = (10 × 200) – 725 + (80 + 25) = 1,380\n(Choice A) Market capitalization of 1,305 results from using the book value of the company's debt instead of the market value. The book value of\na company's bonds on its balance sheet may differ from the bonds' market value, which is a more current valuation.\n(Choice B) Market capitalization of 1,355 results from not subtracting short-term investments.\nThings to remember:\nEnterprise value (EV) measures the total value of a firm. When combined with net debt, the estimate of EV derived from the EV multiple can also\nbe used to estimate the firm's market capitalization.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 279, "q": "Asset-based valuation models are most likely appropriate for which of the following public company types in estimating the company's intrinsic value? ", "opts": ["Financial", "Manufacturing", "Pharmaceutical"], "ans": "A", "expl": "Asset-based valuation models\nAn asset-based valuation model estimates value as the difference between the market (ie, fair) value of a company's assets and the market\nvalue of its liabilities. Valuing companies this way is appropriate if asset market values can be accurately estimated. This can be difficult in\npractice, since detailed information on individual assets is not available, and most fixed and intangible assets are hard to value accurately. For\npublic companies, the sheer volume of assets typically prohibits estimation of market values.\nHowever, asset-based valuation can be used if the market value of assets is readily attainable, as for financial companies when the company\nhas a relatively small proportion of intangible assets. Asset-based valuation is also employed jointly with other models to estimate minimum and\nliquidation values.\n(Choice B) A manufacturing company's fixed assets, such as its plant, property, and equipment, are difficult to value accurately. Book values\nreflect cost less accumulated depreciation, not fair value. Further, since most fixed assets trade infrequently, market values cannot be accurately\nestimated.\n(Choice C) The most valuable assets of pharmaceutical companies are patented drugs. The market values of these intangible assets are difficult\nto estimate as the drugs are usually developed internally.\nThings to remember:\nAn asset-based valuation model estimates value as the difference between the market value of a company's assets and the market value of its\nliabilities. Asset-based valuation can be used if the market value of assets is readily attainable and the company has a relatively small proportion\nof intangible assets. Asset-based valuation is also employed jointly with other models to estimate minimum and liquidation values.\nDescribe asset-based valuation models and their use in estimating equity value", "qhtml": null}, {"n": 280, "q": "An analyst uses the method of comparables to compare the price multiples of a company stock over multiple years. This is best described as:", "opts": ["regression analysis.", "time-series analysis.", "cross-sectional analysis."], "ans": "B", "expl": "The method of comparables is the most common way to compare and report on price multiples. The analyst compares a price multiple of a\ncompany stock to that of a benchmark (ie, similar company stock or industry average).\nIf the price multiple of the stock is\nlower than the benchmark, then the stock is considered to be undervalued,\nthe same as the benchmark, then the stock is considered to be fairly valued,\nhigher than the benchmark, then the stock is considered to be overvalued.\nThe comparables method can be used in two ways. In time-series analysis, the price multiples of one asset over different time periods are\ncompared. In cross-sectional analysis, the price multiples of several different assets are compared over the same time period (Choice C).\nUsing the data in the table above, an analyst using cross-sectional analysis could conclude that Company X, with a P/E ratio of 25.9, was\novervalued relative to the average P/E ratio of the three companies in 20X8. Using time-series analysis, one could say that Company X was\novervalued in 20X8 compared to its average P/E ratio over the six years.\n(Choice A) Regression analysis is a mathematical method using the least sum of squares to determine the degree of linearity in the relationship\nbetween two time series variables. There is no indication it is being used in this scenario.\nThings to remember:\nComparing a price multiple of one asset with its own performance over multiple time periods is called time-series analysis. Comparing the price\nmultiples of several different assets for a single time period is called cross-sectional analysis.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 281, "q": "An analyst gathers the following information about a company's stock: According to the two-stage dividend discount model, the intrinsic value of the stock in Year 0 is closest to:", "opts": ["valuation method approved by certain regulatory authorities.", "past prediction of a price multiple that has proven to be accurate.", "estimate based on predictions of future cash flows or fundamentals."], "ans": "C", "expl": "Price-to-earnings (P/E) ratios\nTrailing P/E Forward P/E Justified forward P/E\nJustified by future flows\nNumerator Current price\n(free cash flow, dividends)\nDenominator Past earnings Future earnings Future earnings\nA price multiple is the ratio of a company's stock price to another fundamental value or cash flow. One such multiple is the price-to-earnings (P/E)\nratio: the company's stock price divided by its earnings per share. For example, if a company's earnings per share is CNY 2 and the stock price is\nCNY 40, the P/E ratio is 40 / 2 = 20.\nThe P/E ratio is used in few different forms: trailing P/E, forward P/E (ie, prospective or leading P/E), and justified forward P/E. Trailing P/E uses\npast earnings, and forward P/E is based on future earnings. If the forward P/E ratio estimate is based on a model involving company\nfundamentals or cash flows, the ratio is referred to as justified forward P/E.\nAlthough the justified forward P/E ratio is based on a model, it is still only an estimate of future events. It may or may not be correct (Choice B).\nRegulatory concerns are irrelevant to whether a forward P/E ratio is considered justified or not (Choice A) \"Justified\" in this context refers to\nwhether it is based on a model estimating future company fundamentals.\nThings to remember:\nA price multiple is the ratio of a company's stock price to another fundamental value or cash flow. The P/E ratio is company's stock price divided\nby its earnings per share. The trailing P/E ratio uses recent dividends as an input; forward P/E ratio uses future dividends. The justified forward\nP/E ratio is an estimate based on a model of future company growth.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 282, "q": "An analyst considers using the P/E ratio to compare equity investments. In making the decision, the analyst should remember that the justified forward P/E ratio is most likely a(n):", "opts": ["valuation method approved by certain regulatory authorities.", "past prediction of a price multiple that has proven to be accurate.", "estimate based on predictions of future cash flows or fundamentals."], "ans": "C", "expl": "Price-to-earnings (P/E) ratios\nTrailing P/E Forward P/E Justified forward P/E\nJustified by future flows\nNumerator Current price\n(free cash flow, dividends)\nDenominator Past earnings Future earnings Future earnings\nA price multiple is the ratio of a company's stock price to another fundamental value or cash flow. One such multiple is the price-to-earnings (P/E)\nratio: the company's stock price divided by its earnings per share. For example, if a company's earnings per share is CNY 2 and the stock price is\nCNY 40, the P/E ratio is 40 / 2 = 20.\nThe P/E ratio is used in few different forms: trailing P/E, forward P/E (ie, prospective or leading P/E), and justified forward P/E. Trailing P/E uses\npast earnings, and forward P/E is based on future earnings. If the forward P/E ratio estimate is based on a model involving company\nfundamentals or cash flows, the ratio is referred to as justified forward P/E.\nAlthough the justified forward P/E ratio is based on a model, it is still only an estimate of future events. It may or may not be correct (Choice B).\nRegulatory concerns are irrelevant to whether a forward P/E ratio is considered justified or not (Choice A) \"Justified\" in this context refers to\nwhether it is based on a model estimating future company fundamentals.\nThings to remember:\nA price multiple is the ratio of a company's stock price to another fundamental value or cash flow. The P/E ratio is company's stock price divided\nby its earnings per share. The trailing P/E ratio uses recent dividends as an input; forward P/E ratio uses future dividends. The justified forward\nP/E ratio is an estimate based on a model of future company growth.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 283, "q": "An analyst has gathered the following information about a company stock: The company's justified forward price-to-earnings ratio using the Gordon growth model implies the long-term dividend growth rate of the company is closest to:", "opts": ["2.5%", "7.0%", "7.5%"], "ans": "C", "expl": "Price-to-earnings (P/E) ratios are used mainly in three different forms: the trailing P/E ratio, the forward P/E ratio (prospective or leading P/E), and\nthe justified forward P/E ratio. The trailing P/E ratio uses past earnings; the forward P/E ratio is based on future earnings. If the forward earnings\nestimate is based on a model used to estimate company fundamentals or cash flows, the ratio is referred to as the justified forward P/E ratio.\nAnalysts use the justified forward P/E ratio to compare companies sharing similar characteristics and draw conclusions about asset prices.\nIn this scenario, the required rate of return, justified forward P/E ratio, and earnings retention ratio are given. The dividend payout ratio (p) is equal\nto (1 − earnings retention ratio) = (1 − 0.55) = 0.45. Rearrange the formula for the justified forward P/E ratio and solve for the long-term\ndividend growth rate. Then substitute values to calculate the long-term dividend growth rate:\n(Choice A) 2.5% is the result of incorrectly using the long-term economic growth rate in place of the required rate of return.\n(Choice B) 7.0% is the result of incorrectly using the earnings retention ratio instead of the dividend payout ratio.\nThings to remember:\nThe long-term dividend growth rate can be calculated by rearranging the justified forward price-to-earnings (P/E) formula. The long-term dividend\ngrowth rate is calculated by dividing the dividend payout ratio by the P/E ratio and then subtracting that quantity from the required rate of return.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 284, "q": "An analyst compiles the following P/E ratios of comparable companies: Using time-series analysis for the period from 20X6 to 20X9, the analyst would most appropriately conclude that, as of the end of 20X9, which company is fairly valued?", "opts": ["Company X", "Company Y", "Company Z"], "ans": "A", "expl": "The method of comparables can be used in two ways. A time-series analysis is the comparison of the price multiple of one asset to its historical\naverage over multiple time periods. Comparing the price multiple of different assets over the same time period is known as cross-sectional\nanalysis.\nIn this scenario, the analyst is reviewing the  intrinsic equity value by the number of shares outstanding.\nDescribe asset-based valuation models and their use in estimating equity value", "qhtml": null}];
const CFG = {"title": "Equity Investments — Wiley/UWorld Q-bank", "subtitle": "CFA Level I · Wiley 2024 · 287 câu · không giới hạn giờ", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
