ket share, an analyst forecasts\nthe total size of the relevant market, then estimates the company's market share over time. Therefore, the restaurant company's market share\nwould be a relevant metric for a top-down analysis.\n(Choices B and C) The number of restaurants and average revenue per seat are company-specific metrics that would be more relevant for a\nbottom-up approach.\nThings to remember:\nWhen forecasting a company's financials, a top-down approach bases the forecast on factors that can affect growth in the overall economy, sector,\nor industry. Common top-down approaches are growth relative to GDP growth or market size and market share.\nEvaluate a company’s revenue and revenue drivers, including pricing power", "qhtml": null}, {"n": 150, "q": "Which of the following companies is most likely to have pricing power? A:", "opts": ["low-cost producer in the competitive textile market.", "consumer goods producer with a popular brand name.", "global manufacturer of low-cost personal computer accessories."], "ans": "B", "expl": "An analysis of a company's financials usually begins with revenue, and price is a key component of revenue. Pricing power is a company's\nability to increase prices without significantly affecting its unit volumes of sales. A company with greater pricing power can raise prices without\nsignificantly lowering sales volume (ie, demand is less elastic).\nPricing pressure is typically lower in perfectly competitive markets and higher in other industry structures. Industries in which companies have\npricing power are often marked by one or more of the following:\nProduct differentiation\nHigh barriers to entry\nFew economical substitutes\nHigh switching costs for customers\nHigh customer loyalty and retention\nCompanies with strong brand names typically have higher customer loyalty and can therefore increase prices without a significant impact on\nvolumes. Thus, a consumer goods producer with a popular brand name (eg, Coca-Cola) is most likely to have pricing power.\n(Choice A) A low-cost producer has lower costs than some competitors and therefore can earn an accounting profit even in a perfectly\ncompetitive market. Still, a company in such a market would not be able to increase prices without losing a significant portion of its customer\nbase. Therefore, a low-cost producer in the competitive textile market would not likely have pricing power.\n(Choice C) Commoditization occurs when an original product is no longer unique due to competitors entering the market with similar products.\nFor instance, the market for personal computer accessories is a commoditized market with many competitors and little product differentiation, so a\nlow-cost global producer in that market would not have pricing power.\nThings to remember:\nPricing power is a company's ability to set prices without significantly affecting its sales volume. Industries where companies have pricing power\nare often marked by product differentiation, high barriers to entry, few economical substitutes, high switching costs for customers, or high customer\nloyalty and retention.\nEvaluate a company’s revenue and revenue drivers, including pricing power", "qhtml": null}, {"n": 151, "q": "Which of the following statements best describes an aspect of spreadsheet modeling for company analysis?", "opts": ["A more complex model leads to more accurate analysis.", "A complex model can lead to a false sense of confidence.", "A standardized model should be applied to all companies."], "ans": "B", "expl": "Spreadsheet modeling has become a nearly universal tool in financial statement analysis. A complex model can lead to a false sense of\nconfidence in the precision of the model output.\nComplex spreadsheet models are highly dependent on numerous forecasts and assumptions. Therefore, the risk of error is high, and such errors\ncan quickly compound, creating increasingly inaccurate outputs. At the same time, the model's complexity can encourage overconfidence in its\nprecision. Once a model is complete, a reality check should be performed by testing for reasonableness. Only a handful of critical drivers should\nmaterially impact the bottom-line results.\n(Choice A) Increasingly complex models do not necessarily produce better outputs and often lead to a false sense of confidence in the precision\nof the model's output.\n(Choice C) Spreadsheet models should closely match the financial reporting and disclosures of the company being analyzed. This allows for\ndirect comparisons between the model and what was reported by the company. While a standardized model may have some benefits regarding\nconsistency, the comparability of forecasts and assumptions for each individual company could be negatively impacted.\nThings to remember:\nFinancial modeling outputs are highly dependent on numerous forecasts and assumptions. A complex model can lead to a false sense of\nconfidence in the precision of the model output.\nDescribe the elements that should be covered in a thorough company research report", "qhtml": null}, {"n": 152, "q": "Which of the following is most likely a source of capital for a company?", "opts": ["Asset disposal", "Cash and investments", "Positive net working capital"], "ans": "A", "expl": "Sources and uses of capital\nSources Uses\nCash flows from operations Cash and investments\nNet working capital (negative) Net working capital (positive)\nDebt issuance Capital expenditures\nEquity issuance Intangible asset purchases\nAsset disposal Acquisitions\nDebt paydown\nDividends\nShare repurchases\nCompany research typically involves identifying and analyzing sources and uses of capital. Evaluating trends over time and comparing company\ndata with peers can help analysts identify strengths and weaknesses or competitive advantages and disadvantages.\nSources of capital are any activities that generate capital to fund operating, investing, and financing activities.\nUses of capital are activities that invest in operations, including capital expenditures, or that return capital to stakeholders.\nA company's capital is commonly sourced from operations (ie, cash flow from operations) and from third parties (eg, issuance of equity or debt).\nHowever, sources of capital also include one-time infusions, such as asset disposals or sales.\n(Choices B and C) Cash and investments and positive net working capital are uses of capital. Cash and investments are used to maintain\nliquidity for business operations, interest payments, or other items. Positive net working capital is used to support operations.\nThings to remember:\nSources of capital are generally any activities that generate capital to fund a company's operations. Uses of capital are activities the company\nspends its capital on to operate its business or return capital to stakeholders. Sources of capital include one-time infusions such as asset sales.\nEvaluate a company’s capital investments and capital structure", "qhtml": null}, {"n": 153, "q": "A nonbank company increases the amount of debt in its capital structure. All else equal, this will most likely affect the company's:", "opts": ["contribution margin.", "degree of financial leverage.", "degree of operating leverage."], "ans": "B", "expl": "In addition to measuring operating risks, analysts typically evaluate a company's risks related to its capital structure (ie, financial risk). Larger\namounts of debt in a company's capital structure will increase the company's obligated principal and interest payments, and therefore its financial\nrisk. The degree of financial leverage (DFL), which is the rate of change in a company's net income compared with the change in its\noperating income, measures this risk.\nA company's DFL is directly affected by interest expense. Interest expense is a nonoperating cost and therefore affects net income, but not\noperating income. Larger interest payments result in a larger DFL, thus making net income more sensitive to changes in operating income since\nthe company has a riskier capital structure that relies more on debt financing. A DFL close to 1 indicates there is little interest expense as the\ncompany largely uses equity financing.\n(Choice A) Contribution margin is the difference between a product's unit price and unit variable costs. For a nonbank company, contribution\nmargin would be unaffected by increases in the amount of debt in a company's capital structure.\n(Choice C) Degree of operating leverage (DOL) measures the rate that operating profit increases (decreases) in relation to sales increases\n(decreases). For nonbank companies, DOL is affected by the company's operating cost structure (ie, fixed versus variable costs) but would not be\nimpacted by changes in interest rates.\nThings to remember:\nThe degree of financial leverage (DFL) measures the rate of change in a company's net income compared with the change in its operating\nincome. DFL is one option to evaluate financial risk and is directly affected by interest expense. A larger DFL suggests a company has significant\ninterest payments and a riskier capital structure with more reliance on debt financing.\nEvaluate a company’s capital investments and capital structure", "qhtml": null}, {"n": 154, "q": "Which of the following best demonstrates pricing power?", "opts": ["Gaining market share", "Expanding operating margin", "Consistently growing revenue"], "ans": "B", "expl": "Pricing power\nAttributes that affect pricing power Indicators of pricing power\nProduct differentiation\nBarriers to entry\nLack of substitutes Rising margins and profitability\nSwitching costs\nCustomer loyalty\nPrice is a key component of a company's revenue. Pricing power is a company's ability to increase prices without causing sales volume to\ndecline significantly. A company with greater (less) pricing power can (cannot) raise prices without meaningfully affecting demand. A company's\npricing power is largely determined by both the industry structure and the company's competitive positioning within the market.\nOne indicator of pricing power is the ability to pass on cost increases to customers by increasing price. Analysts can evaluate a company's\npricing power by comparing its pricing trends to its cost trends: if prices cannot keep pace with costs—in other words, if profit margins (eg,\noperating margin, net margin) are shrinking—then the company has little pricing power.\nExpanding profit margins indicate that a company has significant pricing power: it can raise prices faster than costs rise, without fear of\nsubstitutes or competitors taking market share with lower prices.\n(Choice A) Gaining market share does not demonstrate pricing power. For instance, the company could be lowering prices to increase volume,\nwhich is not an example of pricing power and may not be sustainable.\n(Choice C) Consistently growing revenue alone does not demonstrate pricing power since costs may be growing even faster than revenue.\nThings to remember:\nPricing power is determined by a company's ability to increase prices without causing sales volume to decline significantly. Analysts can evaluate\na company's pricing power by comparing its pricing trends to its costs or to the pricing trends of competitors. Expanding margins demonstrate\npricing power since the company can pass rising costs to customers, without the risk of substitutes or competitors taking market share with lower\nprices.\nDescribe the elements that should be covered in a thorough company research report", "qhtml": null}, {"n": 155, "q": "A consumer bank expands its offerings to include brokerage and asset management services. As these offerings expand, the bank's profit margin improves. This is best described as:", "opts": ["economies of scale.", "economies of scope.", "degrees of financial leverage."], "ans": "B", "expl": "Companies can often improve their cost structure over time by increasing the size of their business or adding related business lines.\nEconomies of scope occur when companies reduce their average cost per unit by increasing the number of business lines or\nproducts offered. Efficiencies typically result from cost-sharing between businesses (eg, financial service firms sharing back-office\nfunctions and cross-selling services) or an ability to use fixed costs for multiple functions (eg, passenger airplanes carrying freight cargo).\nEconomies of scale occur when companies reduce their average cost per unit by increasing the quantity produced. Some reasons why\ncompanies might experience economies of scale include:\nGreater bargaining power with suppliers\nAbility to spread fixed costs over more units\nAvailability of new efficiencies (eg, in marketing)\nLower cost of capital\nAs average cost per unit declines, profit margins typically expand, assuming prices remain stable. In this scenario, the bank's profit margins\nexpand as it adds new product offerings. This describes economies of scope.\n(Choice A) The bank's margins are expanding due to new business lines, not greater quantity (ie, scale of output) for its traditional products or\nservices.\n(Choice C) Degree of financial leverage (DFL) is the rate at which net income changes compared with changes in operating income. DFL is\ndirectly affected by interest expense and is not related to a company's expanding operating margins due to scale or scope.\nThings to remember:\nEconomies of scope occur when companies reduce their average cost per unit by increasing the number of business lines or products offered.\nEconomies of scale occur when companies reduce their average cost per unit by increasing the quantity produced.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null}, {"n": 156, "q": "An analyst collects the following data for a company: ($ millions) 20X3 20X4 Sales 600 900 COGS 350 600 Fixed operating costs 90 100 Interest expense 80 90 Tax expense 20 25 The company's degree of financial leverage is closest to:", "opts": ["0.50", "0.83", "1.67"], "ans": "C", "expl": "Risks related to a company's capital structure (ie, financial risk) can be measured using solvency ratios, third-party credit ratings, and the degree\nof financial leverage (DFL).\nA company's DFL measures the rate of change in its net income compared with a change in operating income. All else equal, increasing\ninterest expense, which is a nonoperating cost driven by debt, will reduce net income but not affect operating income. Therefore, when net income\nis positive, greater interest expense causes net income to change at a faster rate than operating income, causing the DFL to increase.\nIn this scenario, the company's operating income and net income in each period must be calculated before the DFL:\nThe company's DFL is approximately 1.67.\n(Choice A) 0.50 is the company's degree of operating leverage, which is driven by fixed operating costs.\n(Choice B) 0.83 is the company's degree of total leverage, which is driven by both fixed operating costs and financing costs.\nThings to remember:\nThe degree of financial leverage (DFL) measures the rate of change in a company's net income compared with its operating income. All else\nequal, increasing interest expense will reduce net income but not affect operating income, thus causing DFL to increase.\nEvaluate a company’s capital investments and capital structure", "qhtml": null}, {"n": 157, "q": "A firm has reported negative net working capital for each of the past four quarters. Based only on this, an analyst can most appropriately infer that the firm is:", "opts": ["not profiting from its marginal output.", "shortening its cash conversion cycle.", "relying on suppliers as a source of financing."], "ans": "C", "expl": "Working capital management\nNet working capital Sources of financing\nNegative Current liabilities > Current assets Assets plus external, including suppliers\nPositive Current liabilities < Current assets Assets\nAlong with fixed capital, working capitalrequirements determine the amount of investment a company requires to maintain its operations.\nGreater working capital requirements mean less funds are available for other uses, such as distributions to shareholders or debt retirement.\nIf working capital is positive, current assets exceed current liabilities, and the company can meet current obligations.\nIf working capital is negative, the company's current assets are less than (and therefore cannot support) its current liabilities; in essence,\nthe company is using its suppliers as a source of short-term financing.\n(Choice A) The profit or loss from marginal output is determined by its contribution margin (= Price – Variable cost) and is not directly affected by\nworking capital.\n(Choice B) A report of positive or negative working capital does not provide any detail as to whether a company is shortening or lengthening its\ncash conversion cycle, which is reflected in activity ratios.\nThings to remember:\nAlong with fixed capital, working capital requirements determine the amount of investment required to maintain operations. If working capital is\npositive, current assets exceed, and thus can support, current liabilities. If working capital is negative, the company must rely on alternative,\nexternal financing, often from its own suppliers.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null}, {"n": 158, "q": "When conducting a company analysis, which of the following factors is least useful for analyzing supply?", "opts": ["Product differentiation across the industry", "Anticipated expansion of industry capacity", "Price competition among resource providers"], "ans": "A", "expl": "Analysis of company products and services\nMarket size\nProduct differentiation\nDemand\nEconomic and demographic factors\nOpportunities\nInput sources\nCapacity\nSupply\nImport/export considerations\nProprietary products\nPart of a thorough company analysis is an analysis of the company's ability to supply product to customers. This ability is influenced by\ncompetition for resources and production capacity within the industry. Factors in supply analysis include:\nInput sources—Competition or concentration in industries that supply inputs, and availability of substitute resources\nIndustry capacity—Current capacity and anticipated expansions, and the ease or difficulty of adding capacity\nFirm capacity—Output potential and cost structure\nInternational factors—Potential impact of import competition on supply and prices in the product market; impact on input prices from exports\nto foreign competitors\nProprietary products and trademarks—Possibility of restraining output below capacity to maintain the value of products and trademarks\nProduct differentiation across the industry indicates the degree of competition for the company's product. It is a factor in analyzing demand for\nthe product, not supply.\n(Choice B) An anticipated expansion of industry capacity affects the industry's ability to offer products to customers and is a factor in analyzing\ncompany supply.\n(Choice C) Price competition between resource suppliers affects a company's cost structure and is a factor in analyzing company supply.\nThings to remember:\nPart of a thorough company analysis is an analysis of the company's ability to supply product to customers. This ability is influenced by\ncompetition for resources and production capacity within the industry. Factors to consider include sources of inputs, industry capacity and\nanticipated expansions, firm capacity and cost structure, international factors, and proprietary products and trademarks.\nDescribe the elements that should be covered in a thorough company research report", "qhtml": null}, {"n": 159, "q": "Which of the following best approximates contribution margin?", "opts": ["Gross margin", "EBITDA margin", "Operating margin"], "ans": "A", "expl": "A company's contribution margin is the difference between its unit price and unit variable costs and measures the approximate contribution to\nprofit from each incremental unit sold. When price exceeds variable costs, each marginal unit produced will create additional profit for the\ncompany. When the company produces a great enough quantity, the contribution profit will exceed fixed operating costs and operating profit will\nbecome positive.\nFor most companies, a significant portion of costs of goods sold (COGS) incurred during a period is variable (eg, material, freight, and storage\ncosts). A significant portion of total COGS varies with the number of units produced or sold. Therefore, COGS tends to be a suitable\napproximation of a company's total variable costs. Gross margin is the difference between revenue and COGS; therefore, it is a suitable\napproximation of contribution margin.\n(Choices B and C) Costs that go into a company's operating and EBITDA margins, but not in gross margin, include sales & marketing, general &\nadministrative (G&A), and research & development (R&D). These (eg, salaries, marketing, rent) tend to be more fixed in nature and therefore\noperating and EBITDA margins would not make good approximations for contribution margin.\nThings to remember:\nA company's contribution margin is the difference between its unit price and unit variable costs. For most companies, a significant portion of costs\nof goods sold (COGS) is variable while sales, G&A, and R&D costs are mostly fixed. This theoretically makes COGS a suitable measure of a\ncompany's variable costs and gross margin a suitable measure of contribution margin.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null}, {"n": 160, "q": "An analyst collects the following information on a company and its industry peers: Company Peer average Net margin 4% 6% Asset turnover 1.2 1.4 Equity multiplier 2.5 1.5 Degree of operating leverage 1.2 1.4 Degree of financial leverage 2 1.2 Required return on equity 9% 7% Cost of debt 6% 5% Based only on this information, the most appropriate conclusion is that the company:", "opts": ["has a better credit rating than peers.", "maintains a conservative capital structure.", "generates returns that exceed equity investors' requirements."], "ans": "C", "expl": "Return on equity (ROE) measures how much profit a company generates relative to its equity. ROE is often compared with investors' required\nrate of return (r) to determine whether the company is generating profit in excess of the return required by its equity investors. When ROE is\ngreater (less) than r, the company is generating a profit that exceeds (falls short of) what is required by investors.\nDuPont analysis decomposes ROE into measures of profitability, efficiency, and leverage. ROE is the product of the company's profit margin,\nasset turnover, and leverage ratio (ie, equity multiplier). In this scenario, using the three ratios, the company's ROE can be calculated as 0.04 ×\n1.2 × 2.5 = 0.12 = 12%, which exceeds the required return on equity of 9%.\n(Choice A) The company and its peers are in the same industry, yet its cost of debt (6%) exceeds the industry average of 5%. Although a credit\nrating is based on many factors, this greater cost of debt suggests that the company would have a worse credit rating than its industry peers.\n(Choice B) The company has an equity multiplier of 2.5 and degree of financial leverage of 2, suggesting a significant amount of debt in its capital\nstructure and therefore higher financial risk. It would not be appropriate to assume that the company has a conservative capital structure.\nThings to remember:\nROE measures how much profit a company generates relative to its equity. When ROE is greater than investors' required rate of return (r), the\ncompany is generating a profit that exceeds that rate. DuPont analysis decomposes ROE into profitability, efficiency, and leverage ratios.\nEvaluate a company’s capital investments and capital structure", "qhtml": null}, {"n": 161, "q": "A clothing manufacturer has two business segments: Its retail segment designs and manufactures clothes that it sells to retailers. Its merchant segment manufactures clothing for other designers and earns commissions when the designers sell to retailers. Which of the following best describes the customer base for the company's merchant segment? ", "opts": ["Designers", "Designers and retailers", "Designers, retailers, and clothing consumers"], "ans": "A", "expl": "The first step to analyze a company is to assess its business model. Business model analysis provides a basis for determining the drivers of\nthe company's financials and its opportunities and risks; this gives the analyst direction on where to focus additional research.\nElements of a business model analysis include identifying the customer and key customer groups. This identification will provide insight into\nthe addressable market and whether the customer base is large or small, diverse or homogeneous, and concentrated or fragmented.\nA company sells its products or services directly to customers, so customers are the party that directly purchases from the company. A\ncustomer can repackage or add additional value to a product or service, then resell it to its own customer. Companies may also have different\ncategories of customers. In this scenario, the company's retail segment manufactures and designs clothes that it sells directly to retailers, who\nresell the clothes to consumers. The company also has a merchant segment that manufactures clothes for designers in exchange for\ncommissions paid when the designers sell the clothes to retailers.\nFor the retail segment, the customers are retailers. For the merchant segment, the customers are designers, who receive the company's\nmanufacturing services and pay commissions when they sell the clothes to retailers; through the commissions, the designers purchase directly\nfrom the company.\n(Choice B) Retailers are the designers' customer base, not the merchant segment's.\n(Choice C) Clothing consumers are the retailers' customer base, not the merchant segment's.\nThings to remember:\nBusiness model analysis provides a basis for determining the drivers of a company's financials. Elements of a business model analysis include\nidentifying the customer and key customer groups. A company sells its products or services directly to its customers; thus, customers are the\nparty that directly purchases from the company.\nDetermine a company’s business model", "qhtml": null}, {"n": 162, "q": "A company purchases a piece of equipment that reduces its need for temporary labor, thus increasing its fixed costs as a percentage of total costs. All else equal, the company's degree of operating leverage will most likely:", "opts": ["decrease.", "remain the same.", "increase."], "ans": "C", "expl": "For a firm with fixed costs to be profitable, its contribution margin (= P − VC) must remain positive and greater than its fixed costs, so that\noperating profit (= Q(P − VC) − FC) is positive:\nIf FC > 0, then P − VC > 0 and P − VC > FC, and as a result, Q(P − VC) − FC > 0.\nP = Price per unit\nVC = Variable cost per unit\nFC = Fixed cost\nQ = Quantity sold\nOperating leverage refers to the proportion of fixed costs in a company's cost structure. Holding other factors constant, a company that\nincreases fixed costs as a percentage of total costs will increase the rate at which operating profit changes. When the proportion of fixed\ncosts increases and:\ncontribution margin is positive, operating income will increase (decrease) faster as quantity increases (decreases).\ncontribution margin is negative, operating income will decrease (increase) faster as quantity increases (decreases).\nThe degree of operating leverage (DOL) measures the rate that operating profit increases (decreases) relative to increases (decreases) in\nsales. Since a greater proportion of fixed costs will increase the rate that operating profit changes for a given change in quantity, it will also\nincrease the DOL, all else equal. Therefore, a firm that reduces a variable cost such as temporary labor while increasing a fixed cost such as\nequipment, all else equal, will report an increase to its DOL (Choices A and B).\nThings to remember:\nHolding other factors constant, a company that increases fixed costs as a percentage of total costs will increase its degree of operating leverage\n(DOL), that is, the rate at which operating profit changes given a change in sales quantity. Greater proportions of fixed costs will increase DOL, all\nelse equal.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null}, {"n": 163, "q": "Which of the following should most appropriately be included in a business model analysis?", "opts": ["The company's market share in the industry", "Potential losses from lawsuits against the company", "Demographic changes in the company's addressable market"], "ans": "C", "expl": "A research report often analyzes the company's business model. A business model assessment provides insight into the company's\noperational and financial drivers. The analysis typically focuses on high-level elements that pertain to the goods or services the company sells,\nwho the customers are, how the company acquires its inputs, and its go-to-market strategy.\nIdentifying the company's addressable or target market is an important part of the business model analysis since the proportion of that market\ncaptured by the company will determine its revenues. The analyst should consider potential changes to the target market based on factors such\nas:\ndemographics (eg, home builders monitoring changes in regional populations),\nconsumer behavior (eg, increase in online shopping), and\nthe emergence of substitute or competing products (eg, electric vehicles in competition with traditional cars).\nA growing or shrinking market can affect a company's future sales.\n(Choice A) How well the company implements its business model, compared with peers, determines its market share in the industry. However,\nmarket share itself is not part of the business model; rather, the model includes an operating strategy to help the company achieve or expand its\ntarget market share.\n(Choice B) Potential losses from lawsuits against the company are not included in the business model analysis as they are largely out of the\ncompany's control and therefore not generally planned for in its operating strategy.\nThings to remember:\nResearch reports often include an analysis of the company's business model. Determining the company's addressable or target market is an\nimportant part of the business model analysis. The analyst should consider potential changes to that market based on factors such as\ndemographics, consumer behavior, and the emergence of substitutes.\nDetermine a company’s business model", "qhtml": null}, {"n": 164, "q": "Which of the following best demonstrates pricing power?", "opts": ["Gaining market share", "Expanding operating margin", "Consistently growing revenue"], "ans": "B", "expl": "Pricing power\nAttributes that affect pricing power Indicators of pricing power\nProduct differentiation\nBarriers to entry\nLack of substitutes Rising margins and profitability\nSwitching costs\nCustomer loyalty\nPrice is a key component of a company's revenue. Pricing power is a company's ability to increase prices without causing sales volume to\ndecline significantly. A company with greater (less) pricing power can (cannot) raise prices without meaningfully affecting demand. A company's\npricing power is largely determined by both the industry structure and the company's competitive positioning within the market.\nOne indicator of pricing power is the ability to pass on cost increases to customers by increasing price. Analysts can evaluate a company's\npricing power by comparing its pricing trends to its cost trends: if prices cannot keep pace with costs—in other words, if profit margins (eg,\noperating margin, net margin) are shrinking—then the company has little pricing power.\nExpanding profit margins indicate that a company has significant pricing power: it can raise prices faster than costs rise, without fear of\nsubstitutes or competitors taking market share with lower prices.\n(Choice A) Gaining market share does not demonstrate pricing power. For instance, the company could be lowering prices to increase volume,\nwhich is not an example of pricing power and may not be sustainable.\n(Choice C) Consistently growing revenue alone does not demonstrate pricing power since costs may be growing even faster than revenue.\nThings to remember:\nPricing power is determined by a company's ability to increase prices without causing sales volume to decline significantly. Analysts can evaluate\na company's pricing power by comparing its pricing trends to its costs or to the pricing trends of competitors. Expanding margins demonstrate\npricing power since the company can pass along rising costs to customers by raising prices, without the risk of substitutes or competitors taking\nmarket share with lower prices.\nEvaluate a company’s revenue and revenue drivers, including pricing power", "qhtml": null}, {"n": 165, "q": "Within the context of strategic industry analysis, a global industry that is most likely benefiting from technological and demographic influences is:", "opts": ["gold mining.", "biotechnology.", "cargo shipping."], "ans": "B", "expl": "Within the context of strategic industry analysis, technological influences create new products or innovations that can disrupt an industry.\nDemographic influences such as aging populations can impact economic growth and the types of goods and services demanded by\nconsumers.\nWhen people live longer (ie, demographics), they tend to consume more medicinal drugs. Technological innovation and breakthroughs are\nessential in the development of new drug therapies and are a cornerstone of the success of the biotech industry.\n(Choice A) The gold mining industry does not directly benefit from demographic influences or technological development. In fact, the industry\nmay be negatively impacted by both demographics and technology. Technological advances have led a generation of younger individuals to digital\nalternatives to gold (eg, cryptocurrency).\n(Choice C) Although there may be some minor technological advances (eg, fuel efficiency) in the cargo shipping industry, the basics of the\nindustry have changed little in recent decades and the demographic influences are largely neutral. On the other hand, the industry has likely\nbenefitted from social, governmental, and macroeconomic influences that have propelled the globalization of trade.\nThings to remember:\nWithin the context of strategic industry analysis, technological influences create new products or innovations that can disrupt an industry.\nInnovations in computing, oil extraction, telecommunications, and drug development are recent examples. Demographic influences such as aging\npopulations can impact economic growth and the types of goods and services demanded by consumers.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 166, "q": "Which of the following is a limitation when applying business cycle sensitivity labels such as cyclical or noncyclical to global industry analysis?", "opts": ["Currency fluctuations make business cycle sensitivity difficult to predict.", "Industry classification labels are relative descriptors along a continuum.", "Different tax regimes among various countries make comparisons difficult."], "ans": "B", "expl": "Limitations of applying business cycle sensitivity analysis to global industries\nEconomic performance can vary significantly across countries and regions\nIndustry classification schemes are relative descriptions along a continuum\nCyclical, noncyclical, growth, and defensive are broad industry classification descriptors that convey certain attributes of business cycle sensitivity.\nThere are two primary limitations of applying business cycle sensitivity classification analysis to global industries.\nPhases of the business cycle occur at different times in different economies around the world. For example, a cyclical business in one\ncountry experiences weakening domestic demand, but operations in other countries remain robust (eg, unequal economic performance\nacross countries).\nBusiness cycle sensitivity classification (eg, cyclical versus noncyclical) runs along a continuum (eg, not black and white, but on a scale\nof economic sensitivity) and is a relative descriptor. For example, even noncyclical industries exhibit some cyclical variation during a\nrecession, but not as much as cyclical industries.\n(Choices A and C) Currency fluctuations are difficult to predict, and varying tax regimes around the world will impact businesses, but these are\nnot specifically considered limitations when applying business cycle sensitivity analysis to global industries.\nThings to remember:\nLimitations of applying business cycle analysis to global industries include differing stages of the business cycle in different economies around the\nworld and the continuous and relative nature of business cycle sensitivity descriptors.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 167, "q": "Which of the following would be the least appropriate data source for measuring the size of an industry by its total revenue?", "opts": ["Survey data from third-party consultants", "Investor presentations by publicly traded companies", "Reported total firm revenue from companies in the industry"], "ans": "C", "expl": "Sources of industry size estimates\nGovernment agencies\nThird-party consultants\nCompany presentations\nAs part of their research, analysts frequently estimate the size of an industry (eg, by revenue, units). This helps determine sales potential and\nmarket shares for companies within the industry. Size is often difficult to estimate accurately for industries since many companies are private\nand do not disclose sales. Given this limitation, analysts have optional data sources, including:\nGovernment agencies, which often collect data and make their own estimates\nThird-party consultants, which use surveys to collect data from private companies (Choice A)\nIn addition, many publicly traded companies disclose their own estimates in their investor presentations. Such estimates are often based on data\nfrom proprietary sources, which may be combined with third-party estimates (Choice B).\nWhen estimating industry size, analysts can sum the reported revenue from publicly traded companies to estimate part of the market. However,\ntotal revenue from the financial statements of public companies' filings (eg, annual reports, earnings presentations) should not be used for\ncompanies with multiple business lines; in those cases, only revenue from the segment(s) within that industry should be used in the estimate.\nUsing total revenue from all companies within an industry would likely overstate the size of that industry.\nThings to remember:\nIndustry size is often difficult to estimate accurately given that many companies are private. When estimating industry size, analysts can sum the\nrevenue from publicly traded companies in the industry to estimate part of the market. However, when a company has multiple business\nsegments, only revenue from the segment(s) within that industry—not total revenue—should be used.\nDetermine an industry’s size, growth characteristics, profitability, and market share trends", "qhtml": null}, {"n": 168, "q": "Which of the following is most likely a defining characteristic of a noncyclical industry?", "opts": ["High operating leverage.", "Inelastic demand for goods or services.", "Greater sensitivity to the business cycle."], "ans": "B", "expl": "Noncyclical industries tend to be unaffected by fluctuations in the business cycle. They are typically characterized by the following:\nInsensitivity to the business cycle: Stable demand that is not strongly correlated with the economy\nInelastic demand: Product offerings are often basic necessities (eg, food, health care, electricity)\nConsistent profitability: Predictable operating environment less subject to external shocks\n(Choices A and C) A cyclical industry is characterized by a heightened sensitivity to the business cycle, elastic demand for goods or services,\nand profit volatility. Cyclical industries often have heavy infrastructure investment requirements (eg, auto manufacturers), leading to higher fixed\ncosts and greater operating leverage.\nThings to remember:\nNoncyclical industries are generally unaffected by fluctuations in the business cycle. They typically offer basic consumable goods and services\n(eg, food, health care, electricity) that are necessary regardless of economic conditions.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 169, "q": "A pharmaceutical company's exclusive patent for a popular drug expires at the end of 20X1. All else equal, at the end of 20X2, the Herfindahl- Hirschman Index for the market for that drug will most likely be: ", "opts": ["smaller.", "unchanged.", "larger."], "ans": "A", "expl": "As part of an industry evaluation, analysts often examine the industry concentration and market shares of the largest competitors, which can\nindicate how competitive an industry is.\nHigh industry concentration usually indicates a smaller number of companies with greater market shares, suggesting less competition.\nLow industry concentration usually indicates a larger number of companies with smaller market shares and greater competition.\nExceptions are cases where companies do not compete with others, such as localized services (eg, hospitals) or differentiated products (eg,\nfood and beverage).\nIndustry concentration can be calculated in multiple ways. One common method is the Herfindahl-Hirschman Index (HHI), which sums the\nsquares of companies' market shares. Larger (smaller) HHI values indicate greater (lesser) industry concentration and less (more)\ncompetition. The largest HHI is 10,000 (= 1002) for a pure monopoly, as is the case in this scenario since a pharmaceutical company with a patent\nwould be the only producer of that drug. When the patent expires and new entrants enter the market, the HHI would be expected to shrink as\nindustry concentration declines (Choice B).\n(Choice C) The HHI for an industry typically increases when the biggest companies become even larger, such as through acquisitions.\nThings to remember:\nAs part of an industry or market evaluation, analysts often examine industry concentration, which can indicate how competitive an industry is. One\ncommon method to calculate industry concentration is the Herfindahl-Hirschman Index (HHI), which sums the squares of companies' market\nshares. Larger HHI values indicate higher industry concentration and less competition.\nDetermine an industry’s size, growth characteristics, profitability, and market share trends", "qhtml": null}, {"n": 170, "q": "Of the following, a defining characteristic of a cyclical industry is most likely?", "opts": ["High operating leverage", "Inelastic product demand", "Consistent profitability profile."], "ans": "A", "expl": "A cyclical industry is sensitive to fluctuations in the economic cycle. These companies are typically characterized by:\nhigh fixed costs: elevated costs due to heavy infrastructure investment\nelastic demand: sales dependent on the overall strength of the economy\nvolatile profitability: high operating leverage due to high fixed costs and economic sensitivity\nA noncyclical industry is characterized by reduced sensitivity to the economic cycle, more consistent profitability (Choice C) and inelastic demand\nfor its goods or services (Choice B). These industries tend to offer basic consumable goods and services that are needed regardless of economic\nconditions.\nThings to remember:\nA cyclical industry is sensitive to fluctuations in the economy. These industries are typically characterized by high fixed costs (ie, operating\nleverage), elastic demand for their goods and services, and a volatile profitability profile.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 171, "q": "Compared with noncyclical companies, cyclical companies most likely:", "opts": ["produce consumer staples.", "exhibit higher volatility in profits.", "have strong revenue during economic contractions."], "ans": "B", "expl": "Companies can be classified based on their sensitivities to the business cycle. Cyclical companies exhibit profits that strongly vary with the\nstate of the economy (ie, expansion or contraction). Whereas noncyclical companies exhibit stable profits independent of the state of the\neconomy.\nCyclical products (eg, high-end cars) tend to be expensive or discretionary, with demand directly tied to consumer disposable income. Since\ndisposable income is strongly correlated with the economy, product demand is high during economic expansion, which leads to higher sales and\nprofits. Product demand is low during economic contraction, which leads to lower sales and profits (Choice C). Furthermore, the generally\ncapital-intensive nature of cyclical companies (eg, manufacturing) translates to high fixed costs, which further amplifies profit fluctuation.\n(Choice A) Noncyclical products (eg, consumer staples such as food) exhibit relatively stable demand that is not strongly correlated with the\neconomy. These products are either inexpensive or necessities. Therefore, noncyclical companies have sales and profits that do not fluctuate\nsignificantly with periods of expansion or contraction.\nThings to remember:\nCyclical companies exhibit profits that are strongly linked to the state of the economy (ie, expansion or contraction), whereas noncyclical\ncompanies exhibit profits independent of the state of the economy.\nDescribe industry classification methods and compare methods by which companies can be grouped", "qhtml": null}, {"n": 172, "q": "Which of the following best describes a characteristic of industry life-cycle analysis?", "opts": ["The model is most useful when industries are in periods of rapid change.", "Companies in the same industry can be expected to exhibit similar performance.", "External factors can cause an industry to deviate from the expected progress of the cycle."], "ans": "C", "expl": "Industries usually evolve over time in a predictable pattern, allowing analysts to predict present and future expected performance based on the\nindustry life cycle. Each stage exhibits different characteristics that reflect the competitive dynamics (eg, product demand, intensity of competition)\nthat lead to varying levels of growth and profitability. Determining where an industry is in its life cycle can provide helpful context for analysis of a\ncompany in that industry as it almost certainly will affect investment returns.\nIndustry life-cycle analysis has limitations since it assumes all industries follow a predictable path. External factors (eg, technological,\nregulatory, social) can divert an industry's path along the cycle. For example, stages may become longer/shorter than expected and can be\nskipped or repeated. This makes industry life-cycle analysis most useful when an industry is relatively stable and less useful during periods of\nrapid change (Choice A).\n(Choice B) Not all companies in an industry will experience similar performance (eg, growth, profitability). Also, different companies, even within\nthe same industry, may be in various stages of the company life cycle.\nThings to remember:\nIndustry life-cycle analysis has limitations since it assumes all industries follow the same path. External factors can cause an industry to deviate\nfrom its expected path through the cycle. This makes industry life-cycle analysis most useful when an industry is relatively stable.\nDescribe industry classification methods and compare methods by which companies can be grouped", "qhtml": null}, {"n": 173, "q": "Over the last 20 years, a country's population has increased due to a sharp rise in its birth rate. Based only on this population growth, which industry is most likely experiencing the smallest increase in demand? ", "opts": ["Health care", "Food and beverage", "Personal care products"], "ans": "A", "expl": "External factors influencing industry/company sales and profits\nGDP growth trends\nMacroeconomic National/global business environment Stage of business cycle\nInflation and interest rates\nNew/improved products\nTechnological Product innovation New product categories\nImproved production methods\nCorrelation of population with demand\nDemographic Population size, growth, and age Age cohorts\nEducation and income levels\nRegulation/legal considerations\nGovernmental Policy impacts on industry Fiscal policy subsidies or taxes\nMonetary policy implementation\nDiscourage consumption\nSocial Attitudes toward business/consumption Encourage behavior\nEncourage production\nHealth-care spending is highly correlated with age. In general, health problems and susceptibility to disease increase with age. Consequently,\nolder people tend to consume proportionally more health-care products and services than people who are young or middle-aged.\nAn increase in the population tends to increase the demand for all goods and services. However, population growth due to an increase in the birth\nrate over the previous two decades would result in a lower average age. Thus, while there would likely be an increase in expenditures related\nto health care, it is most likely smaller than the increase in spending on consumer staples.\n(Choices B and C) Foods, beverages, and personal care products are consumer staples, which are goods used by all consumers. The demand\nfor consumer staples is highly correlated with the size of the population. The demand for foods, beverages, and personal care products usually\nexperiences strong increases during periods of rapid population growth.\nThings to remember:\nHealth-care spending is highly correlated with age, so older people tend to spend proportionally more on products and services related to health\ncare than people who are young or middle-aged. An increase in the population tends to increase the demand for all goods and services.\nHowever, a country where the average age is dropping due to a rise in the birth rate is likely to see a larger increase in demand for consumer\nstaples than for health-care products and services.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 174, "q": "Which of the following is least likely a characteristic of the shakeout stage in an industry's life cycle?", "opts": ["Slowing growth", "Moderate competition", "Frequent company restructuring"], "ans": "B", "expl": "Industries evolve over time and experience different levels of growth and profitability in each stage of their life cycle. Each stage exhibits different\ncharacteristics that affect the competitive dynamics of an industry, such as level of product demand, intensity of competition, and profitability. The\nshakeout stage is characterized by slowing growth, fierce competition, and diminishing profitability.\nIn the shakeout stage, growth in demand is slow since the overall industry can attract few new customers (Choice A). Companies are forced to\ntake existing market share away from competitors to grow, leading to fierce competition. The slowdown in demand also pressures many\ncompanies to reduce costs through restructuring (Choice C).\nThings to remember:\nIn the shakeout stage, growth in demand is slow since the overall industry can attract few new customers. Companies are forced to take existing\nmarket share away from competitors to grow, leading to fierce competition. The slowdown in demand also pressures many companies to reduce\ncosts through restructuring.\nDescribe industry classification methods and compare methods by which companies can be grouped", "qhtml": null}, {"n": 175, "q": "A company's equity securities are considered defensive stocks. The company most likely produces which of the following products?", "opts": ["Consumer staples", "Fashion accessories", "Manufacturing equipment"], "ans": "A", "expl": "Industry/company classifications\nDefining characteristic Nature of company/industry\nNew industry, growing product demand\nGrowth Rapid growth of sales\nProduct innovator in mature industry\nConsumer staples\nDefensive Demand for product stays strong in slowing economies\nGovernment regulated necessity (eg, utilities)\nDiscretionary consumer products\nCyclical Sales/profits very sensitive to business cycle Consumer durable products (eg, housing)\nBusinesses requiring large fixed investments\nGrowth industries less sensitive to cycles\nNoncyclical Sales/profits relatively insensitive to business cycle\nConsumer staples\nDefensive stocks are equities of individual companies or entire industries whose revenues are the least sensitive to business cycle downturns.\nThough not immune to recessions, their profits are not as adversely affected since the demand for their products holds up better. Products of\ncompanies in this category include:\nConsumer staples (eg, basic foodstuffs and beverages, household goods, hygiene products)\nBasic services (eg, food and drug retailing)\nGovernment regulated service providers (eg, electric power, water, sewage utilities)\nDue to the relatively better performance of defensive companies' sales and profits, defensive stocks hold their value better than cyclical stocks\nwhen the economy slows. In this way, defensive stocks protect (ie, defend) the value of investor portfolios.\n(Choices B and C) Fashion accessories (ie, consumer discretionary) and manufacturing equipment are cyclical businesses. Their revenues and\nprofits typically decline significantly during recessions. Consumer discretionary products are products consumers want but do not need.\nExpenditure for these products declines when incomes fall. Manufacturers buy equipment to expand output to meet demand. In recessions with\ndemand falling, manufacturers have little incentive to expand.\nThings to remember:\nDefensive stocks are equities of companies and industries whose revenues are the least sensitive to business cycle downturns. Since demand for\ntheir products holds up better during recessions, their profits are not as adversely affected. Revenue and profits of cyclical companies are very\nsensitive to the business cycle and typically decline significantly during recessions.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 176, "q": "Which of the following industries will most likely experience revenue declines in a recession?", "opts": ["Electric power generation", "Automobile manufacturing", "Pharmaceutical production"], "ans": "B", "expl": "External factors influencing industry/company sales and profits\nGDP growth trends\nMacroeconomic National/global business environment Stage of business cycle\nInflation and interest rates\nNew/improved products\nTechnological Product innovation New product categories\nImproved production methods\nCorrelation of population with demand\nDemographic Population size, growth, and age Age cohorts\nEducation and income levels\nRegulation/legal considerations\nGovernmental Policy impacts on industry Fiscal policy subsidies or taxes\nMonetary policy implementation\nDiscourage consumption\nSocial Attitudes toward business/consumption Encourage behavior\nEncourage production\nBusiness cycle impacts are among the macroeconomic factors considered in industry and company analysis. Cyclical products' sales are\nsensitive to fluctuations in the level of business activity; in general, such products are expensive, and their purchase can be deferred. Thus, as\nincome growth slows or income declines, revenues of cyclical companies decline more than the contraction of economic activity.\nAlthough spending on many consumer cyclical products is nondiscretionary (eg, automobiles for transportation), most individuals who can afford\nthe product already own one. Concerns about future income related to a weak economy cause many potential buyers to delay purchases, causing\nsales to decline.\n(Choice A) The cost per unit of electric power is low, and it is essential for many aspects of living. Electric power sales generally grow over the\nentire course of the business cycle.\n(Choice C) Pharmaceutical sales are driven by the introduction of new drugs and consumers' medical needs, so sales are influenced little by the\nstage of the business cycle. The cost of many drugs represents a small portion of most consumers' budgets.\nThings to remember:\nCyclical products' sales are sensitive to fluctuations in the level of business activity and usually experience large declines during recessions.\nAlthough spending on many consumer cyclical products such as automobiles is nondiscretionary, most individuals who can afford the product\nalready own one. Concerns about future income related to a weak economy causes many potential buyers to delay purchases, causing\nautomobile sales to decline.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 177, "q": "An industry is characterized by high bargaining power of suppliers and low barriers to entry. Based on strategic analysis from Porter's five forces, this industry most likely exhibits:", "opts": ["strong pricing power.", "stable market shares.", "small economic profits."], "ans": "C", "expl": "Porter's five forces is a framework for strategic analysis that examines an industry's competitive environment to assess whether the conditions\nfavor economic profits. An increase to any of the forces can potentially intensify competition within the industry and threaten economic profits.\nIn this scenario, the combination of high bargaining power of suppliers and low barriers to entry will most likely drive down the industry's economic\nprofits. High supplier power will drive up costs and shrink profit margins since suppliers are better able to maintain or increase the prices to their\ncustomers. Low barriers to entry allow new entrants easier access to the market, potentially luring customers from incumbent companies.\n(Choice A) Strong pricing power would more likely characterize an industry with high barriers to entry since the threat of new entrants would be\nlower.\n(Choice B) Stable market shares are more common in industries with less competition. Low barriers to entry would likely characterize a highly\ncompetitive industry.\nThings to remember:\nPorter's five forces is a framework for strategic analysis that assesses the threat of new entrants and substitutes, bargaining power of suppliers\nand buyers, and rivalry between competitors within an industry. A strengthening of any of these forces threatens the industry's potential economic\nprofits.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 178, "q": "A cost leadership strategy would best defend against which of the following competitive forces?", "opts": ["Threat of substitutes", "Bargaining power of suppliers", "Bargaining power of customers"], "ans": "C", "expl": "Popular operating strategies: defense against competitive forces\nCost leadership Differentiation Focus\nThreat of new entrants X X X\nThreat of substitutions X X\nBargaining power of suppliers X\nBargaining power of customers X X X\nIndustry rivalry X\nA company will typically use a certain strategy to grow the business and shield itself from specific competitive forces. A company that operates a\ncost leadership strategy aims to produce its product or service at a lower cost than competitors. Even if the price is set by the market, the\ncompany can usually generate economic returns since it will have lower costs. This strategy helps protect against:\nThreat of new entrants: Cost leaders typically create their advantage with scale, favorable supplier relationships, or cost management\nexpertise, which would be difficult for new entrants to duplicate.\nBargaining power of customers: Price-sensitive customers can reduce the amount they purchase. However, even at lower volumes,\ncompanies producing at a lower-than-average cost can still generate an economic profit while those with higher costs may not.\nIndustry rivalry: Price wars are less likely since cost leaders will have a lower average cost than competitors and therefore could\ntheoretically price their products or services lower while maintaining an economic profit.\nCost leadership does not, however, protect as well against the threat of substitutes and the bargaining power of suppliers. If substitutes emerge at\nlower prices than the company's goods or services, even a cost leader will not be able to compete on price. If a company relies too heavily on a\nparticular supplier, the supplier could increase the prices it charges for the company's inputs (Choices A and B).\nThings to remember:\nA company that operates a cost leadership strategy aims to produce its product or service at a lower cost than competitors. Cost leadership helps\nprotect against the threat of new entrants, bargaining power of customers, and industry rivalry. It is less effective against the threat of substitutes\nand the bargaining power of suppliers.\nEvaluate the competitive strategy and position of a company", "qhtml": null}, {"n": 179, "q": "When preparing a thorough industry life cycle stage analysis, the experience curve is most appropriate for which type of industries?", "opts": ["Service industries.", "High fixed cost industries.", "Embryonic-stage industries."], "ans": "B", "expl": "A key component of a comprehensive industry analysis, the experience curve displays the direct cost per unit of a good produced or service\ndelivered relative to the quantity produced. The curve declines with an increase in asset utilization as fixed overhead costs are spread over an\nincreasing number of units produced. The cost of production can also decline due to efficiency gains in labor, production, or design.\nThe experience curve is a particularly important concept for industries with high fixed costs or industries that can take advantage of\neconomies of scale. Examples include heavy machinery, auto, and aircraft manufacturing and could also include consumer electronics\nmanufacturers.\n(Choice A) Service industries tend to be asset-light businesses that do not have high fixed overhead infrastructure costs to overcome; therefore,\nthe cost of production does not change much with each unit or service produced.\n(Choice C) The experience curve is unlikely to be useful for an embryonic-stage (ie, early life cycle) industry that is just beginning to develop.\nMany companies in the industry are likely to be start-ups, which have significant investment needs and high failure rates.\nThings to remember:\nThe experience curve is a key component of a comprehensive industry analysis. The experience curve is particularly important for high fixed\noverhead industries and displays the direct cost per unit of a good produced or service delivered.\nDescribe the purposes of, and steps involved in, industry and competitive analysis", "qhtml": null}, {"n": 180, "q": "Highly fragmented industries most likely exhibit high price competition due to:", "opts": ["firms' desire to increase profit margins.", "the difficulty of firms coordinating strategically.", "firms viewing themselves as members of large group."], "ans": "B", "expl": "Industry concentration is a key component of strategic industry analysis and refers to the concentration of market share among firms in an\nindustry. Concentrated industries consist of a few big players with relatively large shares of the market whereas fragmented industries consist of\nmany small players with relatively small shares of the market. Fragmented industries often exhibit high price competition since:\nit is difficult for a large number of firms to coordinate on strategy effectively,\nsmall firms aim for market share gains by undercutting competitors' prices, and\nfirms tend to view themselves as individual companies rather than as members of a larger group.\nInvestors should pay close attention to industry concentration since it may ultimately affect an industry's economic profits.\n(Choice A) Firms aggressively compete to gain market share in highly fragmented industries by lowering prices (ie, price competition), which\ndecreases company profit margin. Small companies are often willing to sacrifice profit margins to gain market share.\n(Choice C) Firms tend to view themselves individualistically rather than as members of a group. This attitude will cause firms to adjust prices\nwithout thinking about how the collective industry will react.\nThings to remember:\nFragmented industries consist of many small players with relatively small market shares. Fragmented industries exhibit high price competition\nsince price coordination is difficult, undercutting prices for market share gains is common, and firms tend to view themselves individualistically.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 181, "q": "In an industry operating near capacity, which of the following types of companies is most likely to be able to rapidly increase capacity?", "opts": ["Reinsurance", "Pharmaceutical", "Dry-bulk shipping"], "ans": "A", "expl": "When an industry is at or near capacity, an increase in demand may create pricing power and enhance profitability for firms within that industry.\nThe duration of the pricing power depends on the ability of firms to increase capacity: The more rapidly capacity is added, the sooner price\ncompetition will return with a resulting loss of pricing power.\nThe lead time to add capacity depends on the industry's critical input. The critical input needed for providers of professional or financial\nservices to expand capacity is productive employees. In contrast, goods producers and manufacturing or transportation service providers\nneed to acquire fixed capital (Choices B and C). Reinsurers can hire and train employees more rapidly than companies can add fixed capital.\nThings to remember:\nThe lead time for industries to add capacity depends on the critical input. The critical input for providers of professional or financial services is\nproductive employees. Those companies can hire and train employees more rapidly than goods producers and manufacturing or transportation\nservice providers, which require fixed capital as the critical input.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 182, "q": "An industry experiencing the growth phase in the industry life cycle is most likely characterized by:", "opts": ["rising prices.", "low competition.", "falling economics of scale."], "ans": "B", "expl": "Industries evolve over time and experience different levels of growth and profitability in each stage of their life cycle. Each stage exhibits different\ncharacteristics that affect the competitive dynamics of an industry, such as the level of product demand and intensity of competition. The growth\nphase, which is the second stage, is characterized by rapidly growing demand, rising profitability, and limited competition.\nDuring the growth stage, customers become familiar with an industry's product. As such, the industry attracts new customers, which drives higher\nproduct demand. The growing market draws many new entrants (companies) while the barriers to entry are still low. Despite the influx of entrants,\ncompetition among companies is low (or limited) since the vast market allows companies to grow without having to take market share from\ncompetitors.\n(Choices A and C) In the growth stage, companies within the industry achieve economies of scale and better distribution channels, which allow\nthem to reduce prices to further increase product demand. The combination of increased sales volume and economies of scale results in higher\nindustry profitability.\nThings to remember:\nDuring the growth stage, companies within the industry benefit from rising demand with low levels of competition due to a rapidly growing\ncustomer base. In this stage, the industry achieves economies of scale and improves its distribution channels.\nDescribe industry classification methods and compare methods by which companies can be grouped", "qhtml": null}, {"n": 183, "q": "In equity analysis, market share instability is most likely linked with:", "opts": ["high entry barriers.", "rapid product innovation.", "high customer switching costs."], "ans": "B", "expl": "Market share instability is primarily determined by the degree of competition and the expense customers must incur to switch suppliers. Market\nshare instability is increased by:\nLow barriers to entry that allow new competitors to enter an industry and take market share from incumbents\nRapid rates of product innovation that make competition more intense and increase the likelihood of customers changing to suppliers whose\nproducts offer new features or higher quality\nLow switching costs that allow customers to shift their purchases to new suppliers without incurring significant extra expense\n(Choice A) High barriers to entry reduce the threat posed by firms entering an industry and upending the existing competitive balance, which\nresults in greater market share stability.\n(Choice C) High switching costs (eg, the cost of creating new supply chains, new software when a company upgrades its computer system)\nmean substantial additional expense for customers. The greater such costs are, the less likely customers will change to new suppliers, which\nleads to more market share stability.\nThings to remember:\nMarket share instability is primarily determined by the degree of competition and the costs for customers switching to new suppliers. Low entry\nbarriers and high rates of product innovation result in more intense competition between firms. Low switching costs increase market share\ninstability by reducing the expense incurred by customers in redirecting their purchases.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 184, "q": "Expecting a recession, a portfolio manager changes the allocation in a client's equity portfolio by overweighting consumer staples and utilities while underweighting industrials. The portfolio manager's action is best described as:", "opts": ["risk budgeting.", "sector rotation strategy.", "tactical asset allocation."], "ans": "B", "expl": "Sector rotation is a timing strategy used to reallocate a portfolio based on an investor's perception of the business cycle or other macro\nvariables (eg, oil prices, yield curve shifts). Sector rotation is a common technique used by practitioners in an attempt to outperform their\nbenchmarks and is a common application of industry analysis.\nA cyclical industry is highly correlated to the strength of the overall economy, while a noncyclical industry is more insulated from economic\nfluctuations. By shifting away from cyclical stocks (eg, industrials) and into noncyclical stocks (eg, consumer staples, utilities), the manager is\nattempting to reduce the negative effects of a recession on the portfolio.\n(Choice A) Risk budgeting measures and allocates risks by specific portfolio metrics (eg, beta), often limiting the total risk of the portfolio to a\npredetermined \"budget.\" Although the portfolio's overall risk was likely reduced by the sector shifts, it was done on an ad hoc basis and nothing in\nthe question implied that the portfolio was adhering to or constrained by a risk budget.\n(Choice C) Tactical asset allocation refers to tactical shifts among various asset classes (eg, equities, fixed income), not within an asset class.\nThings to remember:\nSector rotation is a timing strategy used to reallocate a portfolio based on an investor's perception of the business cycle or other macro variables.\nIt is a common application of industry analysis.\nDescribe the purposes of, and steps involved in, industry and competitive analysis", "qhtml": null}, {"n": 185, "q": "An industry has high barriers to exit. According to Porter's \"five forces\" framework, which of the following is most likely to be present in this industry? ", "opts": ["Threat of substitutes is high", "Threat of new entrants is high", "Bargaining power of buyers is low"], "ans": "A", "expl": "Porter's \"five forces\" analysis is a key strategic framework for assessing an industry's competitive environment. Structural attributes can vary\ndramatically between industries, generating vastly different economic return profiles. Some industries generate consistent profits throughout an\neconomic cycle, whereas other industries struggle even during a sustained economic expansion.\nPricing power is often a key aspect of generating economic profit. Pricing power is usually robust in an industry with high barriers to entry since\nthe threat of new entrants is low, but there are exceptions, such as auto manufacturers, oil refiners, and semiconductor memory manufacturers\n(eg, DRAM, flash), that also have high barriers to exit (Choice B).\nPricing power will be weak if the bargaining power of buyers is high. When industries produce products that are commodities (eg, DRAM,\ngasoline) or high priced and easily interchangeable (eg, autos), a high threat of substitutes exists, contributing to weak pricing power (Choice\nC).\nIndustries with these characteristics are said to have high barriers to exit. They are also characterized by large investment in fixed assets that\ncannot be easily converted to another purpose, making them prone to overcapacity.\nThings to remember:\nIndustries with high barriers to entry and weak pricing power also often have high barriers to exit. Within Porter's \"five forces\" framework,\nindustries with high barriers to entry and exit are characterized by a low threat of new entrants, high bargaining power of buyers, and high threat of\nsubstitutes.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 186, "q": "An analyst collects the following data on a company and its peers: Current Market Share 20X1 (20X4) Company 53% 50% Peer 1 14% 18% Peer 2 12% 15% Peer 3 13% 12% Peer 4 8% 5% If the company chooses to acquire its smallest peer, the analyst's most appropriate conclusion will be that: ", "opts": ["the Herfindahl-Hirschman Index will increase by more than 200.", "5% will be added to the company's organic market share growth.", "the company is acquiring a product that is superior to other competitors'."], "ans": "A", "expl": "Measures of industry concentration assess the number and relative sizes of companies competing within a market. Industry concentration can\nprovide insight into how competitive a market might be, with greater (lesser) concentrations typically associated with less (more) competition.\nRegulators often view less competition as unfavorable since companies can use pricing power to the detriment of consumers and to create higher\nbarriers to entry.\nOne common method of calculating industry concentration is the Herfindahl-Hirschman Index (HHI), which sums the squares of company\nmarket shares. Larger HHI values indicate greater industry concentration and less competition; the maximum HHI of 10,000 indicates a\nmonopoly with 100% market share. Regulators typically consider an industry highly concentrated if its HHI is above 2,500. When an industry is\nconcentrated, regulators will often challenge deals that increase the HHI by more than 200.\nIn this scenario, the HHI of the industry before and after the acquisition is:\nBefore acquisition After acquisition\n3,218 = 502 + 182 + 152 + 122 + 52 3,718 = 552 + 182 + 152 + 122\nThe acquisition would increase the industry's HHI by 500 (= 3,718 − 3,218).\n(Choice B) Organic growth and market share gains exclude the impact of acquisitions. Acquiring a company would not increase organic market\nshare growth.\n(Choice C) Market share gains are typically associated with customers believing that a company's products are superior. The company's\nsmallest competitor reported a smaller market share in 20X4 (5%) than 20X1 (8%), suggesting consumers do not believe it has a superior product.\nThings to remember:\nOne common method of calculating industry concentration is HHI, which sums the squares of company market shares. Larger HHI values indicate\nhigher industry concentration. Regulators typically consider an industry highly competitive when its HHI is above 2,500 and will often challenge\ndeals that increase the HHI by more than 200. Organic growth and market share gains exclude the impact of acquisitions.\nDetermine an industry’s size, growth characteristics, profitability, and market share trends", "qhtml": null}, {"n": 187, "q": "An industry with high barriers to entry and widespread consumer adoption is most likely characterized by:", "opts": ["high pricing power for new entrants.", "low pricing power for existing companies.", "high pricing power for existing companies."], "ans": "C", "expl": "The threat of entry is a key component of strategic industry analysis and refers to the ease with which new entrants can enter an existing\nindustry. In less competitive industries, high barriers to entry bar new entrants from challenging incumbent companies. This allows incumbent\ncompanies to maintain economic profits due to the greater pricing power that results from low competition. For example, massive infrastructure\nstartup costs prevent new entrants from challenging existing telecom giants, which allows the existing companies to dictate prices.\nIn contrast, an industry with low barriers to entry will attract an influx of new competitors, which raises competition and diminishes the pricing\npower of existing firms. For example, it is cheap to open a hot dog stand anywhere, so there are numerous hot dog stands throughout the city. An\nexisting hot dog stand cannot substantially raise its prices since doing so will drive consumers to buy from another competitor.\n(Choices A and B) High barriers to entry result in greater pricing power for existing companies (ie, incumbents).\nThings to remember:\nHigh barriers to entry bar new entrants from challenging incumbent companies. This allows incumbent companies to maintain economic profits\ndue to the greater pricing power that results from low competition.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 188, "q": "According to CFA Institute curriculum, Michael Porter's \"five forces\" framework forms the basis of strategic industry analysis. One purpose of this analysis is most likely to identify an industry's: ", "opts": ["ability to generate economic profits.", "diversification benefits for an investment portfolio.", "assignment to the appropriate sector classification."], "ans": "A", "expl": "Porter's five forces of strategic industry analysis provide an unde
