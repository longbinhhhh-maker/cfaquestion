<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A hedge fund will commit $15 million to a short sale of an exchange-listed stock. The fund sells short the maximum number of shares allowable when the margin requirement is 0.4. The relevant information is shown in the table below: Share price at initial sale $30 Share price at repurchase $28 Dividend (paid 8 months after short sale) $1/share Margin loan rate 9% Broker's deposit rate 4% No interest is paid for the borrowed shares, but there is a short rebate on the sales proceeds. If the fund closes out the position in exactly 1 year, the total percentage return is closest to:", "opts": ["8.3%", "18.3%", "26.7%"], "ans": "B", "expl": "A short sale of a stock happens when the short seller borrows shares, sells them, and subsequently repurchases and returns them to the\nlender. A short sale is profitable if the repurchase price is lower than the sales price (\"buy low, sell high\" = \"sell high, buy low\"). The profit depends\nlargely on the number of shares that are shorted.\nBorrowing shares represents leverage, so all short sales are margin transactions. The maximum number of shares that can be sold short is a\nfunction of the short seller's equity in the transaction. In addition to the difference between the sales and repurchase prices, the return on a short\nsale also depends on:\nthe short rebate: interest earned by the short seller on the short sales proceeds and calculated as a function of the investment value and the\nbroker’s deposit rate.\ndividends that are paid on the shares until they are repurchased, which the short seller must pay the lender.\ncommissions and other trading costs subtracted from the proceeds (not a factor in this question).\nThe calculations for all components of the short sale in this scenario are shown below:\n(Choice A) 8.3% would be the approximate return if the short rebate on the sales proceeds is not included.\n(Choice C) 26.7% would be the approximate return if the $1.25 million dividend is not subtracted from the fund's gains.\nThings to remember:\nThe profit from a short sale depends on the number of shares that are shorted, which is a function of the seller's equity in the transaction. The\ntotal return on the short sale is the gain/loss on the underlying transaction, plus any interest (\"short rebate\") earned by the seller, less the dividends\npaid on the shares while the short sale is in effect, and less commissions and other trading costs.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 2, "q": "Which of the following financial intermediaries is least likely to provide liquidity to the markets they operate in?", "opts": ["Dealers", "Brokers", "Mortgage banks"], "ans": "B", "expl": "Financial intermediaries offer various financial products and services that connect buyers and sellers in financial markets. Market participants\nwho want to buy or sell securities can use the services of a broker or a dealer:\nBrokers facilitate client trades but do not trade with clients.\nDealers serve as a counterparty and trade with clients.\nOne measure of market liquidity refers to the ability of participants to buy or sell when they want to trade with low transaction costs at market\nprices. By serving as counterparties to client trades, especially when market conditions make finding willing counterparties more difficult, dealers\nprovide liquidity to the market (Choice A). Brokers attempt only to find counterparties for client trades, which does not add liquidity to the market.\n(Choice C) Mortgage banks provide liquidity to the mortgage loan market by securitizing mortgage loans, which provides capital that mortgage\nbanks can lend to other real property purchasers at lower rates. The combined effects of both types of activity add liquidity to the mortgage loan\nmarket.\nThings to remember:\nBrokers and dealers are financial intermediaries who help market participants buy and sell securities. Dealers trade directly with participants, so\nthey provide liquidity to the market. Brokers attempt to find counterparties for their clients who want to trade; they do not act as counterparties, so\nthey do not provide market liquidity. Mortgage banks provide liquidity to mortgage markets through securitizations.\nDescribe types of financial intermediaries and services that they provide", "qhtml": null}, {"n": 3, "q": "When a retail investor transacts with a broker-dealer in a well-developed financial market, the investor would most appropriately be concerned with:", "opts": ["liquidity.", "conflicts of interest.", "regulatory oversight."], "ans": "B", "expl": "Brokers vs. dealers\nBrokers and dealers serve a similar function as intermediaries in the financial markets since they both facilitate trading. Brokers serve as\nmiddlemen who find counterparties for their clients to place trades, but they do not trade directly with the clients. Dealers trade for their own\naccounts, so they act as counterparties to their clients.\nHowever, brokers often serve as dealers, and dealers frequently act as brokers; entities that serve in either capacity are known as broker-dealers.\nClients who use a broker-dealer may be concerned with potential conflicts of interest posed by the dual role: Brokers have a responsibility to\ntry to obtain the best price for a client, and dealers profit by obtaining the best price for themselves. Often a client does not know whether a\nbroker-dealer is serving as a broker or as a dealer for a particular transaction.\n(Choice A) Since dealers act as counterparties, they provide liquidity for their clients to trade at low transaction costs. Liquidity is not an issue\nwhen transacting with a broker-dealer.\n(Choice C) One characteristic of a well-developed financial market is a regulatory structure that oversees and monitors the activities of\nparticipants, including brokers and dealers.\nThings to remember:\nConflicts of interest can be a concern for clients transacting with broker-dealers since brokers try to find the best price for a client and dealers\nbenefit from obtaining the best price for themselves. Often a client may not know whether a broker-dealer is acting as a broker or as a dealer.\nDescribe types of financial intermediaries and services that they provide", "qhtml": null}, {"n": 4, "q": "A broker concerned with executing a trade in a timely manner and with a high probability of execution would most appropriately use a(n):", "opts": ["limit order.", "market order.", "immediate or cancel order."], "ans": "B", "expl": "Market and limit orders are the two most common instructions for executing a trade.\nA market order instructs an intermediary (eg, broker, dealer) to immediately execute the trade on behalf of a client at the best market price\ncurrently available. This ensures the greatest probability of execution but may not result in the best price for the client (eg, highest price for\na seller, lowest price for a buyer).\nA limit order also instructs the intermediary to seek the best price currently available but requires that the limit price or better be achieved.\nIf the price of a limit buy (sell) order is above (below) the specified limit price, the order will remain open until the limit price is achieved. Therefore,\nlimit orders may not be executed right away or at all. Since market orders seek immediate execution, they often execute faster than limit\norders, making them more appropriate for a broker concerned with executing a trade in a timely manner and with a high probability of execution\n(Choice A).\n(Choice C) Immediate or cancel (IOC) orders are a type of validity instruction that refers to how long an intermediary has to fill an order rather\nthan the order's price. An IOC order must be filled upon receipt, in part or in whole, and the order is cancelled immediately if it cannot be filled.\nThis would make an IOC order inappropriate for a broker concerned with a high probability of execution.\nThings to remember:\nMarket orders seek immediate execution at the best price currently available; due to the lack of a specified trading price, there is a high probability\nof execution. In contrast, limit orders must be filled at the limit price or better, so they may not be executed right away or at all.\nCompare market orders with limit orders", "qhtml": null}, {"n": 5, "q": "An investor believes in the long-term prospects of a volatile growth stock and buys shares at USD 40. If the investor wants to protect against potential losses, which of the following is the most appropriate market order?", "opts": ["Good-till-canceled sell, limit USD 35", "Good-till-canceled sell, stop USD 35", "Good-till-canceled short sale, limit USD 35"], "ans": "B", "expl": "Execution instructions vs. validity instructions\nMarket order types Examples\nMarket: order is immediately filled at the best available price\nExecution instructions Limit: order is filled at a threshold price or better\nAll-or-none (AON): entire order is filled or canceled\nDay: expires at the end of the trading day\nStop: contingent on a specified price to trigger action\nValidity instructions\nGood-till-canceled (GTC): order is good until canceled\nMarket-on-close (MOC): order filled at the day's closing price\nValidity instructions state the time frame or conditions in which an order may be filled:\nDay orders are valid only for that trading day.\nGood-till-canceled (GTC) orders remain open until canceled.\nStop orders are contingent on the stock trading at a specified price to trigger action.\nA stop-sell order (ie, stop-loss order) is used to contain potential losses. Once the stock falls to the stop price or below it, the order is\ntriggered, becoming a market order that is immediately executed. A stop-loss order does not guarantee that the order will be filled at the stop price\nbut only that it will be immediately filled at the market price once triggered.\nIn this scenario, a \"GTC sell, stop USD 35\" order is the most appropriate course of action. This allows the long-term investor to participate in\npotential upside and limits potential losses to approximately USD 5.\n(Choice A) A limit order instructs the brokerage firm to execute the trade only at the limit price or better. With the stock trading at USD 40, a\n\"GTC sell, limit USD 35\" order would have immediately sold all the shares at any price above USD 35 (ie, better).\n(Choice C) In a \"GTC short sale, limit USD 35\" order, a short position would be immediately initiated at USD 40 (ie, 35 or better)—which is\neconomically equivalent to just selling the stock. A short sale profits from selling high and buying low, so initiating a short position at USD 40 is\nbetter than at USD 35.\nThings to remember:\nA stop-sell order (ie, stop-loss order) is used to contain potential losses. Once the stock falls to the stop price or below it, the order is triggered,\nbecoming a market order that is immediately executed.\nCompare execution, validity, and clearing instructions", "qhtml": null}, {"n": 6, "q": "A publicly listed company needs to raise equity capital. The company contacts existing institutional shareholders to gauge interest. Six mutual funds and two pension funds participate and buy all the shares offered. This offering is most likely a:", "opts": ["rights offering.", "private placement.", "secondary market transaction."], "ans": "B", "expl": "Private equity placements\nAdvantages Disadvantages\nInfluences the pricing of the transaction Restricted securities\nInvestor Typically priced at a discount to market price Limited secondary market liquidity\nSmall offering size\nReduced regulation and disclosure Relatively small offering size\nIssuer Can quickly come to market Limited number of investors\nShares sell at a lower valuation\nA private placement is a type of primary market transaction in which qualified investors purchase restricted shares (ie, shares that can be sold to\nonly those investors) through a negotiated transaction. Private placements contrast with initial or seasoned public offerings, which are offered to\nall investors.\nIn this scenario, numerous factors indicate a private placement:\nThe number of investors is limited (ie, eight).\nAll participants are qualified institutional investors (ie, mutual funds and pensions).\nAll participants have an existing relationship with the issuer (ie, current shareholders).\n(Choice A) A rights offering is a form of short-term warrant issued by a company in which all existing shareholders are entitled to purchase\nadditional shares in proportion to their holdings at a predetermined price. The transaction in this scenario is not a rights offering since it is offered\nto only a selected group of qualified investors, no rights are issued, and participation is not limited to proportional ownership.\n(Choice C) A secondary market transaction takes place when existing shares are traded between investors. However, this offering is a primary\nmarket transaction since new shares are being sold by the issuer to investors. A secondary market transaction should not be confused with a\nsecondary offering, which is a primary market transaction in which an already-public issuer publicly offers additional shares of stock.\nThings to remember:\nIn a private placement, shares are not offered to all investors as in a public offering. Instead, restricted shares are sold directly to a limited number\nof qualified investors.\nDefine primary and secondary markets and explain how secondary markets support primary markets", "qhtml": null}, {"n": 7, "q": "A trader buys a company's stock on margin and sells it after one year, with the following relevant information: Shares purchased 100 Purchase price $45 Sale price $60 Dividend $1 Commission (per share, on both purchases and sales) $0.05 Margin requirement 50% Ignoring interest costs, and assuming dividends were paid on the sale date, the return on the transaction is closest to:", "opts": ["36%", "67%", "71%"], "ans": "C", "expl": "Traders often borrow money (ie, buy on margin) to finance an asset purchase. The margin loan is the borrowed amount, which is combined\nwith the trader's own funds that provide equity. The position's leveraged return is the net profit (loss), expressed as a percentage of the initial\noutlay.\nNet profit (loss) is the change in price after accounting for dividends, interest, and transaction costs, including purchase commissions and\nsales commissions.\nThe initial outlay consists of the trader's equity investment in the leveraged position, plus transaction costs (eg, commissions on the\npurchase).\nIn this scenario, the margin is 50% since the trader pays half of the total investment. This results in a leverage ratio of 2, so the trader acquires a\nposition worth twice the invested equity. The gain in the stock, divided by the initial outlay, results in a 71% leveraged return. This illustrates the\npower of leverage: if the trader had contributed the entire cost of the investment, the return would have been only 1,590 / 4,500 ≈ 35.3% (Choice\nA).\n(Choice B) A return of 67% results from excluding the dividend and transaction costs from the calculation.\nThings to remember:\nAn investor's return on a margin trade is the net profit (loss), expressed as a percentage of the investor's own initial outlay. Net profit (loss) is the\ninvestor's profit (loss) after accounting for dividends, interest, and transaction costs. The initial outlay is the investor's equity investment plus any\ncommissions on the purchase.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 8, "q": "Investors participating in a rights offering most likely have the opportunity to:", "opts": ["purchase rights from the issuer.", "sell their shares back to the company.", "buy new shares below the market price."], "ans": "C", "expl": "A rights offering is a relatively easy way for companies to raise new equity capital: existing shareholders are awarded rights that entitle them to\npurchase additional shares at a predetermined price and in proportion to their existing holdings. The subscription price is almost always\nbelow the market price, resulting in potential for an immediate gain.\nFrom a shareholder's perspective, the advantages of a rights offering are that rights:\nare distributed to shareholders with no additional investment required,\nare often marketable to other investors as a form of short-term warrant, and\nprovide the opportunity to purchase new shares at below-market prices.\nThe most significant disadvantage is the dilutive effect of the offering, which forces shareholders to commit additional capital to maintain their\nproportional ownership.\n(Choice A) Rights are not purchased from the issuer. Rights are awarded proportionally based on existing holdings.\n(Choice B) Once awarded, rights can often be sold to other investors, but a rights offering does not afford the opportunity for investors to sell\nshares back to the company.\nThings to remember:\nIn a rights offering, existing shareholders are awarded rights that entitle them to purchase, at a predetermined price, additional shares proportional\nto their existing holdings. The subscription price in a rights offering is almost always below the market price, resulting in potential for an immediate\ngain for the investor.\nDefine primary and secondary markets and explain how secondary markets support primary markets", "qhtml": null}, {"n": 9, "q": "Which of the following statements concerning market orders is most accurate?", "opts": ["Market orders typically seek the best price throughout the day.", "Market orders typically have a lower chance of executing than limit orders.", "Market orders are more likely to cause price concessions than limit orders."], "ans": "C", "expl": "Market and limit orders specify how an order should be filled. A market order instructs the intermediary (eg, broker) to immediately execute the\ntrade at the current market price, while a limit order instructs the intermediary to obtain the most favorable price over time. Since market orders\nprioritize execution speed over price, they are likely to cause price concessions. Buyers typically buy at higher prices on buy market orders and\nsellers typically sell at lower prices on sell market orders as compared to limit orders.\n(Choice A) Market orders seek immediate execution, not the best price throughout the day.\n(Choice B) Market orders typically have a higher chance of executing than limit orders. The execution of limit orders hinges on the availability of\nsecurities that fit the investor's price specifications (eg, maximum buy price, minimum sell price).\nThings to remember:\nMarket orders prioritize execution speed over price, while limit orders prioritize execution price over speed.\nCompare market orders with limit orders", "qhtml": null}, {"n": 10, "q": "A bank allows employees to give investment advice without being registered. A market regulator investigating this matter is most likely concerned about:", "opts": ["preventing insider trading.", "setting and maintaining standards.", "ensuring compliance with employment laws."], "ans": "B", "expl": "Market regulation forms a critical part of the legal and economic framework in which well-functioning markets thrive. Setting mutually beneficial\nstandards for market participants is a goal of market regulation. This is meant to instill public confidence in markets and the investment\nprofession while protecting customers. One example of this standard is the requirement that bank employees who discuss investment products\nwith customers be registered.\nIn this scenario, the bank has failed to ensure its employees meet the standard and has subjected customers to the risk that unqualified\nemployees might give them investment advice. Regulators seek to prevent customer harm by setting and enforcing standards of examination and\nregistration.\n(Choice A) While preventing insider trading is an aim of regulation, it is not a concern in this scenario.\n(Choice C) Investment registration and licensing standards are not within the scope of employment laws. Instead, these regulations are\nmanaged and enforced by industry organizations and government agencies.\nThings to remember:\nSetting and maintaining mutually beneficial standards is a goal of market regulation. This is meant to instill public confidence in markets and\nprotect consumers.\nDescribe objectives of market regulation", "qhtml": null}, {"n": 11, "q": "An investor has $12,000 cash to invest and wants to establish a short position on stock valued at $50. If the initial margin requirement is 60%, the maximum number of shares the investor can sell short is closest to:", "opts": ["240", "400", "600"], "ans": "B", "expl": "An investor may sell short or buy stock in a margin account, depositing only part of the position's market value in cash or equity. The rest of the\ntransaction is financed using a margin loan extended by the broker-dealer. The maximum amount of leverage allowed is indicated by the initial\nmargin requirement, which is set by a government, exchange, or clearinghouse and may depend on the position's volatility or individual policies.\nA short sale is allowed only in a margin account, and the margin requirements are the same as for a purchase. This may seem counterintuitive\nsince the short sale generates cash proceeds, but the broker must ensure there is enough capital to buy the shares back (ie, return the borrowed\nshares) when the trade is closed out.\nThe maximum number of shares that can be sold short is determined by rearranging the initial margin requirement formula above to find the\ntotal investment value and then dividing by the share price:\n(Choice A) 240 shares results from not using the maximum available margin (12,000 / 50).\n(Choice C) 600 shares results from using 1 minus the initial margin requirement (ie, 1 − 60% = 40%) to determine a total investment value of\n$30,000, well above the maximum leverage allowed.\nThings to remember:\nMargin accounts have an initial margin requirement that determines the maximum amount of leverage allowed. The maximum number of shares\nthat can be sold short is determined by rearranging the initial margin requirement formula to find the total investment value and then dividing by\nthe share price.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 12, "q": "If a fund's investment policy statement limits the fund to investing only in securities, which of the following is least likely to be in the fund's portfolio? ", "opts": ["Bond futures contracts", "Gold exchange-traded funds (ETFs)", "Common stock trading over the counter"], "ans": "A", "expl": "There are three categories of securities: equities, fixed-income, and pooled investments. Since bond futures are derivatives and not securities,\nbond futures could not be in a securities-only portfolio. Such portfolio constraints are included in an investment policy statement to restrict the\nactions of asset managers.\n(Choices B and C) Gold exchange-traded funds (ETFs) are pooled investments enabling small money amounts to be invested in liquid\nsecurities. Common stocks are equity securities representing ownership in a company with a right to share in its profits.\nThings to remember:\nThere are three categories of securities: equities, fixed-income, and pooled investments. Since bond futures are derivatives and not securities,\nbond futures could not be in a securities-only portfolio.\nDescribe classifications of assets and markets", "qhtml": null}, {"n": 13, "q": "Which of the following is least likely considered a primary market transaction?", "opts": ["A company issues common stock via an IPO.", "A company issues common stock via a secondary offering.", "A company repurchases its own outstanding common stock."], "ans": "C", "expl": "Companies issue new shares or additional shares of securities in the primary markets. Primary market transactions typically include IPOs\n(Choice A), secondary offerings (Choice B), private placements, and shelf registrations for securities such as stocks or bonds.\nAfter issuance, these outstanding shares are traded in the secondary markets. In this instance, the company repurchasing its own existing,\noutstanding shares is a secondary market transaction, not a primary market transaction.\nThings to remember:\nCompanies issue new or additional shares of securities in the primary markets. Primary market transactions typically include IPOs, secondary\nofferings, private placements, and shelf registrations. After issuance, these outstanding shares are traded in the secondary markets.\nDefine primary and secondary markets and explain how secondary markets support primary markets", "qhtml": null}, {"n": 14, "q": "The financial markets of a country are characterized by easy access to market information, low transaction costs, and fewer financial products than in most countries. This country's financial markets are best described as:", "opts": ["operationally efficient, informationally efficient, and complete.", "operationally efficient, informationally efficient, but not complete.", "informationally efficient and complete, but not operationally efficient."], "ans": "B", "expl": "In a well-functioning financial system, markets are informationally efficient, operationally efficient, and complete. Informationally efficient\nmarkets are those in which participants receive all the information they need to value assets correctly and to make investment decisions. In\noperationally efficient markets, costs of participation (eg, trading) are low. Complete markets are those containing all the financial assets and\ncontracts (eg, stocks, options, forwards, futures, swaps) needed to invest, manage risk, or raise capital.\n(Choice A) Markets are incomplete if not all financial instruments are available to meet the market participants' needs.\n(Choice C) Markets like the one described in the question have low costs and thus are operationally efficient. Also, this question describes an\nincomplete market.\nThings to remember:\nIn a well-functioning financial system, markets are informationally efficient, operationally efficient, and complete. Informationally efficient markets\ntransmit information sufficient to value assets correctly. Costs are low in operationally efficient markets. Complete markets contain all assets and\ncontracts needed to meet market participants' financial needs.\nDescribe characteristics of a well-functioning financial system", "qhtml": null}, {"n": 15, "q": "A silver producer negotiates an agreement to deliver a specific amount of silver ore to a local ore processor for a specified price in six months. This arrangement is most appropriately done with which type of contract?", "opts": ["Futures", "Options", "Forward"], "ans": "C", "expl": "Forwards and futures are similar in that both are firm commitments: One party agrees to deliver (ie, sell) to another party (ie, the buyer) a specific\nquantity of an underlying asset or commodity, at a predetermined price and within a specified time frame.\nA forward contract is a negotiated (ie, non-standardized) over-the-counter derivative with settlement (ie, exchange of cash and assets upon\ndelivery) at contract expiration. Forwards carry significant counterparty risk as they are private agreements between two parties (ie, bilateral) and\nas such are illiquid, making it difficult for one of the parties to exit the agreement prior to expiration.\nFutures trade on an exchange with standardized contracts (eg, price, delivery dates/locations) brokered by a clearinghouse that guarantees both\nparties' performance with daily mark-to-market and settlement. Exchange-traded options are also standardized contracts that give owners the\nright but not the obligation to buy (call) or sell (put).\nIn this instance, a forward contract is most appropriate as the contract is bilateral and it is negotiated, which means the terms (eg, delivery\nlocation) are nonstandard. The miner does bear counterparty risk, and although the standardized features and clearinghouse oversight of futures\nand options could mitigate that risk, the quantity, price, or delivery location may not be optimal (Choices A and B).\nThings to remember:\nA forward contract is a negotiated (ie, non-standardized) over-the-counter derivative with settlement at contract expiration. Forwards carry\nsignificant counterparty risk as they are private agreements between two parties, making it difficult for one of the parties to exit the agreement prior\nto expiration.\nDescribe the major types of securities, currencies, contracts, commodities, and real assets that trade in organized markets, including their\ndistinguishing characteristics and major subtypes", "qhtml": null}, {"n": 16, "q": "A risk manager is considering the difference between futures and forward contracts. Compared with futures contracts, forward contracts most likely:", "opts": ["are standardized.", "use daily settlement.", "involve more counterparty risk."], "ans": "C", "expl": "Both futures contracts (\"futures\") and forward contracts (\"forwards\") are used to fix a price of an asset on a specific date. They have traditionally\nbeen risk-management tools for those who need price certainty of an asset in the future. Suppose a farmer would like to establish a selling price\nfor a crop to be harvested in November of next year. Another party wants price certainty to purchase the crop in the same month. The parties\nmay use a contract to agree to the transaction at a specified price and date, eliminating price uncertainty.\nFutures are standardized contracts. A clearinghouse guarantees both parties' performance and requires margin, with daily mark-to-market\nand settlement. The clearinghouse bears counterparty risk (the risk of either party not honoring the contract).\nForwards are private agreements between two parties. The terms of a forward are mutually agreed between the parties, and therefore are not\nstandardized. Since it can be difficult for one of the parties to exit the agreement prior to expiration, there is a lack of liquidity. Thus, futures have\ngreater liquidity and less counterparty risk than forwards.\n(Choice A) Forwards are not standardized contracts; they are negotiated contracts between two parties.\n(Choice B) Futures are settled daily; forward contracts are not.\nThings to remember:\nForwards and futures are contracts to purchase or sell at a future date and price. Futures are standardized, use daily settlement, and have less\ncounterparty risk and greater liquidity than forwards.\nDescribe the major types of securities, currencies, contracts, commodities, and real assets that trade in organized markets, including their\ndistinguishing characteristics and major subtypes", "qhtml": null}, {"n": 17, "q": "A company will receive Singaporean dollars (SGD) in 45 days and immediately convert it to Australian dollars (AUD) on receipt. To hedge the currency risk, which of the following positions is most appropriate for this company?", "opts": ["Sell SGD at the spot rate 45 days from today.", "Take a long position in the SGD forward today.", "Take a short position in the SGD forward today."], "ans": "C", "expl": "A forward contract is an agreement between two parties to exchange an underlying asset in the future at a predetermined price. The long party\n(ie, the buyer of the forward contract) is obligated to purchase the underlying asset at expiration. The short party (ie, the seller of the forward\ncontract) is obligated to deliver the underlying asset at expiration.\nIn this case, the company needs to convert Singaporean dollars (SGD) into Australian dollars (AUD) in 45 days. To do so, it can short (ie, sell) a\nforward contract today to deliver SGD, the underlying asset, to a counterparty in 45 days for AUD. The company effectively hedges itself against\npotential fluctuations in the AUD/SGD exchange rate within the period.\n(Choice A) Selling SGD at the spot rate in 45 days exposes the company to foreign exchange rate risk, since the exchange rate may fluctuate in\nthis time.\n(Choice B) Taking a long position in an SGD forward contract entails buying the SGD in 45 days. Here, the company wants to sell, not buy, SGD\nat expiration.\nThings to remember:\nA forward contract is an agreement between two parties to exchange an underlying asset in the future at a predetermined price. The long party\n(ie, the buyer of the forward contract) is obligated to purchase the underlying asset at expiration. The short party (ie, the seller of the forward\ncontract) is obligated to deliver the underlying asset at expiration.\nCompare positions an investor can take in an asset", "qhtml": null}, {"n": 18, "q": "Of the following, the most likely distinction between an open-end fund and a closed-end fund is:", "opts": ["closed-end funds can be redeemed by the fund.", "open-end funds are sold back to the fund by the investor.", "closed-end funds usually trade at the fund's net asset value."], "ans": "B", "expl": "A pooled investment vehicle (eg, a fund) contains a portfolio of securities and is owned by numerous investors. An investor benefits from the\nservices of the portfolio manager and can purchase shares issued by the fund. Pooled investment vehicles can be open-end or closed-end funds.\nIn an open-end fund (eg, a mutual fund), investors trade directly with the fund to buy or sell shares. Investors typically sell shares back to the\nfund at its net asset value (the fund's assets minus liabilities) per share. Funds typically issue and buy back shares daily.\nIn a closed-end fund, investors cannot sell shares back to the fund (Choice A). If an investor buys newly-issued shares from a closed-end fund,\nthe investor can sell these shares only to another investor in the secondary market. The investor typically sells these shares at a significant\ndifference from the fund's net asset value (Choice C). The differences typically reflect market sentiments.\nThings to remember:\nIn an open-end fund, investors can trade directly with the fund to buy or sell shares. In a closed-end fund, investors can sell their shares to other\ninvestors only on the secondary market.\nDescribe the major types of securities, currencies, contracts, commodities, and real assets that trade in organized markets, including their\ndistinguishing characteristics and major subtypes", "qhtml": null}, {"n": 19, "q": "A market's limit order book for a stock is listed below: If a buy limit order for 100 shares is entered and is said to \"make the market,\" its limit price is most likely: ", "opts": ["CNY 172.20", "CNY 172.30", "CNY 172.35"], "ans": "A", "expl": "The prices at which market participants are willing to buy (sell) are called bid (offer) prices. When a new limit order is entered that is at current\nmarket prices, the order is said to:\nMake the market if it matches the current best bid (buy) or offer (sell) price and is added to the order book, as is the case in this scenario.\nTake the market if it is immediately executed, since the order takes what the market is currently quoting. A buyer takes the lowest (best)\noffer and a seller takes the highest (best) bid (Choice C).\nWhen a new market order is entered that is between the current highest bid and lowest offer, it is said to make a new market (Choice B).\nThings to remember:\nWhen a new limit order matches the current best bid (buy) or offer (sell) price, the order makes the market. When a new limit order matches a\ncurrent market quote, it takes the market and is immediately executed. When a new market order is entered that is between the current highest\nbid and lowest offer, it makes a new market.\nCompare market orders with limit orders", "qhtml": null}, {"n": 20, "q": "A trader buys a European call option on a stock for €2, with a strike price of €60, when the stock is trading at €58. Assuming no transaction costs, the trader should exercise the option only if, on the day of expiry, the price of the underlying stock is:", "opts": ["below €60.", "above €60.", "above €62."], "ans": "B", "expl": "An owner of a European call option has a right, but not an obligation, to purchase the underlying security at the exercise (strike) price on the date\nof expiration. In contrast, American options can be exercised at any time up to and including their expiry date.\nAt expiration, if the market price is lower than the strike price (€60), the owner of the European call option does not exercise the option since the\nunderlying security is available in the market at a lower price. In this case, the option will expire as worthless (Choice A).\nIf the market price is above the strike price at expiry, the owner exercises the option to purchase the underlying security at €60 and can sell at the\nmarket price above €60. Therefore, the trader will exercise the option only if the market price of the underlying stock exceeds the strike price.\nThe price paid for the option is called the premium. The owner paid a €2 premium for the option, so if the underlying stock is bought at €60 and\nsold at €62 or above, the gain from the purchase and sale covers the cost of the option. Yet the option will be exercised on expiry at any\nunderlying market price above €60, since doing so at any price between €60 and €62 partially offsets the option premium. As a result, €62 is an\nincomplete—and therefore incorrect—answer (Choice C).\nThings to remember:\nA trader should exercise a call option only if the market price of the underlying security exceeds the strike price of the option. If the option is\nexercised when the market price of the underlying security is greater than or equal to strike price plus premium, the cost of the option (ie, option\npremium) is entirely offset.\nDescribe the major types of securities, currencies, contracts, commodities, and real assets that trade in organized markets, including their\ndistinguishing characteristics and major subtypes", "qhtml": null}, {"n": 21, "q": "An investor places a buy-stop, all-or-nothing order for a security. The type of instruction(s) relating to this order is (are) best described as:", "opts": ["validity instructions only.", "execution instructions only.", "both validity and execution instructions."], "ans": "C", "expl": "Execution instructions vs. validity instructions\nMarket order types Examples\nMarket: order is immediately filled at the best available price\nExecution instructions Limit: order is filled at a threshold price or better\nAll-or-none (AON): entire order is filled or canceled\nDay: expires at the end of the trading day\nStop: contingent on a specified price to trigger action\nValidity instructions\nGood-till-canceled (GTC): order is good until canceled\nMarket-on-close (MOC): order filled at the day's closing price\nOrders to buy or sell securities can include both execution and validity instructions. Execution instructions address how to fill an order with\nrespect to:\nThe price at which to buy or sell.\nThe size (ie, quantity) of the order.\nValidity instructions refer to when an order can be filled, as well as how long an unfilled order should remain open before it expires. A stop order\nis a type of validity instruction. A stop order does not become executable until the security has traded at a prespecified trigger price (ie, stop\nprice). A buy-stop order cannot be filled until the security has traded at a price equal to or higher than the stop price.\n\"All-or-nothing\" refers to the quantity of the security to be bought or sold; therefore, it is a type of execution instruction. The investor in this\nquestion would have indicated the number of shares that would be purchased in the buy-stop order. However, by adding the all-or-nothing\ninstruction, the intermediary cannot fill any of the order unless the entire order can be filled.\n(Choices A and B) A buy-stop, all-or-nothing order contains both execution and validity instructions.\nThings to remember:\nOrders to trade securities can have both execution and validity instructions. Execution instructions relate to the price to purchase or sell and the\nquantity of the order. Validity instructions relate to when the trade can occur. A stop order, which becomes executable only after a trade has\noccurred at a specified price, is a type of validity instruction.\nCompare execution, validity, and clearing instructions", "qhtml": null}, {"n": 22, "q": "A market's order book for a stock is listed below: Near the end of a trading day, an investor submits a day order to buy 1,000 shares, limit AUD 40.30. No new bids or offers are submitted before the market closes. Which of the following is most likely to occur?", "opts": ["The order is completely filled.", "The order expires after the investor buys 600 shares.", "The order expires without the investor buying any shares."], "ans": "B", "expl": "Execution instructions define how an order is filled. A market order instructs the brokerage firm to immediately execute the trade at the current\nmarket price, and a limit order instructs the brokerage firm to execute the trade only at the limit price or better. Validity instructions state the\ntime frame and conditions in which an order may be filled. A day order is valid for the same day it is issued and expires at the end of that day if\nnot filled.\nIn this scenario, an investor submits a limit order to buy 1,000 shares at AUD 40.30, which expires at the end of the day. The prices at which\nmarket participants are willing to buy (sell) are called bid (offer) prices. Therefore, the buyer will look to the offer side of the market to fill the order.\nThe investor sets a limit price of AUD 40.30, instructing the broker to buy up to 1,000 shares at this price or less. The 600 shares offered below\nthe limit price are immediately filled (like a market order). Since the market closes shortly afterward, the remaining order is not filled, and it is\ncanceled (Choices A and C).\nCompare market orders with limit orders", "qhtml": null}, {"n": 23, "q": "Which of the following is (are) most likely an example(s) of a primary market transaction?", "opts": ["Only a private placement", "Only a seasoned offering", "Both a private placement and a seasoned offering"], "ans": "C", "expl": "Primary market transactions occur when issuers sell securities directly to investors to raise capital. Primary market transactions typically\ninclude initial public offerings (IPOs), seasoned offerings, private placements, and shelf registrations for securities such as stocks or bonds.\nAfter issuance, the outstanding shares are traded in the secondary markets, where funds flow between traders and/or investors.\nIn a private placement, companies sell securities directly to a small group of qualified investors; there are often cheaper issuance costs as less\npublic disclosure is required. Seasoned offerings are sales of additional shares of a security that was previously issued. Although the company\nhas already \"gone public,\" these additional shares are new to the market. Therefore, this is a primary offering. Both a private placement and a\nseasoned offering are examples of primary market transactions (Choices A and B).\nThings to remember:\nPrimary market transactions involve issuers selling securities directly to investors to raise capital. Private placements and seasoned offerings are\nboth primary market transactions. In the secondary markets, funds flow between traders and/or investors.\nDescribe classifications of assets and markets", "qhtml": null}, {"n": 24, "q": "A client instructs a broker to submit a limit order to buy 10,000 shares of a stock at £15 a share. This is best described as a(n):", "opts": ["validity instruction.", "clearing instruction.", "execution instruction."], "ans": "C", "expl": "Traders send various order instructions to intermediaries (eg, brokers, dealers, exchanges) to place trades. Execution instructions define how\nan order is filled, commonly in the form of a market or limit order. A market order prioritizes the speed of execution, whereas a limit order\nprioritizes the price. Here, the client instructs the broker to execute the buy limit order only if the price is £15 or below.\n(Choice A) Validity instructions specify when an order is filled.\n(Choice B) Clearing instructions state how a trade is settled.\nThings to remember:\nExecution instructions define how an order is filled, usually in the form or a market or limit order. Validity instructions specify when an order is filled\n(ie, within the day or immediately). Clearing instructions indicate how a trade should be settled and cleared.\nCompare execution, validity, and clearing instructions", "qhtml": null}, {"n": 25, "q": "Which of the following best describes a quote-driven market?", "opts": ["Dealers and customers trade at dealer bid or ask prices", "Customer buy and sell orders are matched based on price and time precedence", "Brokers search for willing counterparties on behalf of customers seeking to buy or sell"], "ans": "A", "expl": "Quote-driven markets are also called dealer, price-driven, and over-the-counter (OTC) markets. In quote-driven markets, dealers provide\nliquidity (ie, make markets) by standing ready to trade at their quoted prices. Most trades are between customers and dealers. Buyers must pay\nthe price the dealer is willing to sell for (ie, ask or offer price), and sellers must accept the price the dealer is willing to buy at (ie, bid price). Almost\nall currency and bond trading as well as OTC stock trading occurs in quote-driven markets.\n(Choice B) In order-driven markets, customer buy and sell orders are matched based on price priority and time precedence. All automated\ntrading systems and nearly all exchanges use order-driven systems.\n(Choice C) Brokered markets are those in which brokers search for willing counterparties on behalf of customers. Assets traded in brokered\nmarkets typically share several or all the following characteristics: expensive, unique, trade infrequently, and/or difficult to hold in inventory (eg,\nlarge blocks of stock, fine art masterpieces, real estate).\nThings to remember:\nQuote-driven markets are also called dealer, price-driven, and over-the-counter (OTC) markets. Quote-driven markets are those in which dealers\nstand ready to trade at quoted prices. Most trades are between customers and dealers. Almost all currency and bond trading as well as OTC\nstock trading occurs in quote-driven markets.\nDescribe how securities, contracts, and currencies are traded in quote-driven, order-driven, and brokered markets", "qhtml": null}, {"n": 26, "q": "An investor buys 100 shares of stock at $78. To limit potential losses, the investor places a \"good-till-canceled, stop $72, limit $70\" sell order. Later that day, after the market closes, the company announces disappointing financial results. The next day, the stock opens at $69. At this point, the investor's loss is closest to:", "opts": ["$600", "$800", "$900"], "ans": "C", "expl": "Market orders determine how an order is completed. Execution instructions define how an order is filled, and validity instructions state the\ntime frame and conditions under which an order is filled. In this scenario, a combination of execution and validity instructions is used:\nThe instruction \"stop $72\" is a stop-loss order, used to contain potential losses. Once the stock falls to the stop price or below it, the\nexecution instructions are triggered.\nThe instruction \"limit $70\" links the stop-loss order with a limit order, executing the trade at a price of $70 or better. Since this is a sell order,\nthe price must be $70 or higher for the order to fill.\nIn this scenario, the immediate outcome is that no action is taken. The stop is triggered when the price falls below $72. However, the stock opens\n$1 below the $70 limit, preventing the order from being filled. As a result, no trade is executed, and the current unrealized loss stands at $900\n[(69 − 78) × 100]. The order remains valid (ie, good till canceled), so if the stock price rises to $70 (ie, lowest acceptable limit price), the trade will\nbe executed.\n(Choice A) A $600 loss incorrectly assumes the trade is executed at the stop price of $72.\n(Choice B) An $800 loss incorrectly assumes the trade is executed at the limit price of $70.\nThings to remember:\nExecution instructions define how an order is filled. Validity instructions state the time frame and conditions under which an order is filled. In this\nscenario, the order is not filled but remains valid and outstanding.\nCompare execution, validity, and clearing instructions", "qhtml": null}, {"n": 27, "q": "In an order-driven market system, the following buy limit orders for a stock are listed in the system's limit book: Time Number Limit Special Order Arrived of Shares Price ($) Instructions Iceberg order (total 1 10:05 100 15.10 order is for 200 shares) 2 10:07 200 15.10 3 10:08 200 15.11 Each order is listed for 200 shares. Based on the commonly used order precedence hierarchy, if the current market price is $15.10 and the exchange receives a market sell order for 500 shares, then the orders most likely to be fully executed are:", "opts": ["Orders 1 and 2.", "Orders 2 and 3.", "Orders 1, 2, and 3."], "ans": "B", "expl": "Order-driven system: priority rules for filling limit orders\nThe most aggressively priced orders (eg, highest-priced\nHighest priority:\nbuys, lowest-priced sells) filled first\nPrice\nPrice takes priority over time and visibility\nOrders of fully visible size have priority over those of partially\nNext priority:\nor fully hidden size\nVisibility\nVisibility takes priority over time\nNext priority: Same-price orders filled based on time of receipt\nTime received Earliest received = Higher priority\nAn order-driven system is used by nearly every stock exchange, with rules that match the buyers' and sellers' orders. Three basic rules\ndetermine how limit orders are executed (\"filled\").\nThe first rule is based on price. Orders with the most aggressive prices (eg, highest buy price, lowest sell price) receive the highest priority. If\nmore than one order has the same price, priority is given to orders that are fully visible, meaning that the entire number of shares covered by the\norder is known. Orders in which the size is hidden, either fully or partially (ie, iceberg orders, have lower priority than fully visible orders.\nFor orders with the same price and visibility, priority is based on when each order was received. The earliest-received order has the highest\npriority, followed by the second earliest, etc.\nIn this case, Order 3 has the highest price, so it will be filled first even though it arrived last at the exchange. Orders 1 and 2 have the same price.\nOrder 1 arrived first, but since it is an iceberg order, it drops behind Order 2 in priority. Order 1 receives only 100 shares; Orders 2 and 3 are filled\nentirely (Choices A and C).\nThings to remember:\nAn order-driven system has rules that govern priority when executing limit orders. Orders with the most aggressive prices receive the highest\npriority. When orders have the same price, those that are fully visible have priority over those that are not. When orders have the same price and\nvisibility, priority is given to orders based on when they were received, from earliest to latest.\nDescribe how securities, contracts, and currencies are traded in quote-driven, order-driven, and brokered markets", "qhtml": null}, {"n": 28, "q": "Which of the following is most likely a characteristic of an order-driven market?", "opts": ["Participants directly trade with dealers.", "Exchanges use trading rules to match buyers with sellers.", "Brokers arrange transactions between buyers and sellers."], "ans": "B", "expl": "Exchanges (and alternative trading systems) implement order-driven systems to match buy orders with sell orders based on price-related\nrules. As such, anonymous buyers and sellers provide liquidity to one another.\nIn a quote-driven (ie, price- or dealer-driven) market, market participants trade with dealers directly; therefore, dealers provide liquidity (Choice\nA). In a brokered market, brokers arrange trades between willing buyers and sellers for unique instruments (eg, real estate, rare art) or large\npositions (Choice C).\nThings to remember:\nMarket structure dictates how trading is conducted. In an order-driven market (eg, an electronic exchange), anonymous buy orders are matched\nto sell orders. In a quote-driven market, participants trade with dealers directly. In a brokered market, brokers connect buyers with sellers.\nDescribe how securities, contracts, and currencies are traded in quote-driven, order-driven, and brokered markets", "qhtml": null}, {"n": 29, "q": "The primary distinction between money markets and capital markets is most likely that:", "opts": ["money market securities have greater risk.", "capital market securities are all debt instruments.", "money market securities mature within a year or less."], "ans": "C", "expl": "Financial markets can be classified into money markets or capital markets. Money markets contain debt securities that mature in one year or\nless, whereas capital markets contain debt and equity securities that have longer (or indefinite) maturities.\nMany money market instruments (eg, T-bills) tend to be more liquid and less risky, so they offer lower returns. Capital market instruments (eg,\nstocks) are not as liquid and are riskier (ie, tied to underlying company performance) but may offer higher returns (Choices A and B).\nThings to remember:\nMoney markets contain debt securities that mature in one year or less, whereas capital markets contain debt and equity securities that have longer\n(or indefinite) maturities. Many money market instruments tend to be more liquid and less risky; however, they offer lower returns.\nDescribe classifications of assets and markets", "qhtml": null}, {"n": 30, "q": "An investor bought 100 shares of stock for $50 per share on 80% margin and paid a $20 commission. The call money rate on the margin loan is 10% per annum. The stock pays an annual dividend of $1 per share. The investor sells the shares a year later for $60 per share and pays a $20 commission. The investor's rate of return for the year is closest to:", "opts": ["23.88%", "24.00%", "24.12%"], "ans": "A", "expl": "Buying on margin allows investors to acquire a position that is greater than their own capital (ie, equity) since they can purchase an amount equal\nto the margin loan plus equity. Trading on margin magnifies both gains and losses.\nTo determine the investor's return, divide the net profit by the investor's initial outlay. Net profit in this instance equals the investor's profits\nafter interest and transaction costs (commissions). The investor's initial outlay equals the initial equity plus the commissions on the purchase.\nTherefore, the investor's return is 23.88%.\nNote that commissions must be accounted for in both the numerator and in the denominator when calculating net total rate of return:\nIn the numerator, both purchase and sales commissions must be subtracted to derive net profit\nIn the denominator, purchase commissions must be included as a real expenditure at Time 0, and therefore as part of the total initial outlay.\n(Choice B) 24% results from ignoring transaction costs in the denominator. Doing so understates the investor's initial outlay.\n(Choice C) 24.12% results from subtracting, instead of adding, the initial purchase transaction costs from the investor's equity in the\ndenominator. Doing so understates the investor's initial outlay.\nThings to remember:\nTrading on margin magnifies both gains and losses. To determine the investor's return, divide the net profit by the investor's initial outlay. Net\nprofit equals the investor's profit after interest and transaction costs. The investor's initial outlay equals the initial equity plus the commissions on\nthe purchase.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 31, "q": "A trader has BRL 20,000 and wants to buy on margin to obtain a large stock position. If the local brokerage firm has an initial margin requirement of 0.25, then the maximum total value of stocks that can be purchased is closest to:", "opts": ["BRL 26,667", "BRL 60,000", "BRL 80,000"], "ans": "C", "expl": "Traders often borrow money from brokerages to finance portions of a large purchase. The total funds available to purchase securities equal the\nborrowed amount (margin loan) and the trader's capital (equity). The maximum borrowing amount is determined by the initial margin\nrequirement, which is the minimum ratio of equity to total funds invested. The smaller the initial margin requirement, the more the trader can\nborrow.\nRearrange the equation to calculate the maximum amount of funds that can be invested. Note that questions may alternatively quote a leverage\nratio, which is the inverse of the initial margin requirement (eg, leverage ratio of 4 = 1 ÷ 0.25). Simply multiply the equity amount by the leverage\nratio to derive the total funds (ie, 20,000 × 4 = 80,000).\n(Choice A) BRL 26,667 results from dividing 20,000 by the fraction of debt (0.75), not equity (0.25).\n(Choice B) BRL 60,000 is the margin loan, not the total funds available to purchase stocks.\nThings to remember:\nThe maximum borrowing amount for a margin loan is determined by the initial margin requirement, which is the minimum ratio of equity to total\nfunds invested. The smaller the initial margin requirement, the more the trader can borrow.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 32, "q": "All else equal, if trading liquidity increases in a secondary market, then the effective cost of issuing capital in the primary market will most likely:", "opts": ["decrease.", "remain the same.", "increase."], "ans": "A", "expl": "Companies raise money by issuing securities (eg, stocks, bonds) in primary markets. After issuance, these securities trade on secondary\nmarkets. A highly liquid secondary market enables participants to trade securities quickly, which lowers trading costs and reduces investors'\nrisk. These factors mean that investors are more willing to pay higher prices in the primary markets if liquidity is high in secondary markets.\nThis in turn lowers a company's effective cost of issuing capital (issuance cost ÷ proceeds) since the company receives more proceeds from\ninvestors during issuance in the primary markets relative to issuance costs (eg, underwriting and legal fees).\nThings to remember:\nA highly liquid secondary market enables participants to exchange securities quickly, which results in reduced risk and lower trading costs. As\nsuch, investors are more willing to pay higher prices in the primary markets, which lowers a company's effective cost of issuing capital since the\ncompany receives more money from investors during issuance relative to issuance cost.\nDefine primary and secondary markets and explain how secondary markets support primary markets", "qhtml": null}, {"n": 33, "q": "A hedge fund manager conducts extensive fundamental analysis on a company. Based on this analysis, the manager believes an upcoming earnings report will disappoint market expectations. The manager plans to profit from this situation by taking a short position in the company's stock. In this decision, the manager is best described as a(n):", "opts": ["hedger.", "pure investor.", "information-motivated trader."], "ans": "C", "expl": "Market participants engage in the financial system to save, borrow, raise equity capital, manage risk, exchange assets, and trade based on\nsuperior information. The financial system best facilitates these uses when markets are liquid, financial services are provided at a low cost,\ninformation is readily available, and regulation is effective.\nThere are three fundamental types of participants in financial markets:\nPure investors, who use risky portfolios to save and increase wealth for future use (Choice B)\nHedgers, who primarily focus on mitigating potential financial loss (Choice A)\nInformation-motivated traders, who seek to profit beyond the expected return of holding risky assets by anticipating and reacting to\nmarket data.\nHowever, most participants use financial markets for multiple purposes. For example, active investment managers are often both pure investors\nand information-motivated traders. Many active managers construct portfolios that they believe will achieve greater risk-adjusted returns through a\ncombination of long-term investing and trading to profit from superior information.\nIn this scenario, the hedge fund manager is an information-motivated trader. By taking a short position in the stock, the manager is seeking to\nprofit from an event (the upcoming earnings report) in the belief that the firm's research provides an information edge over other market\nparticipants.\nThings to remember:\nThere are three fundamental types of participants in financial markets: pure investors, hedgers, and information-motivated traders. Information-\nmotivated traders seek to profit beyond the expected return of holding risky assets by anticipating and reacting to market data.\nExplain the main functions of the financial system", "qhtml": null}, {"n": 34, "q": "A leveraged security position is held with only the minimum required equity. If the minimum equity requirement is reduced, the most likely consequence is that the position's risk is:", "opts": ["increased since the securities are less valuable collateral for the margin loan.", "decreased since the maximum possible loss is reduced by having less equity in the position.", "increased since any security price changes will be a larger percentage of the position's equity."], "ans": "C", "expl": "In a leveraged position, a trader invests less equity than the security's market value (ie, buys on margin) and borrows the balance. For any\nposition, leveraged or unleveraged, gains or losses are the change in the position's value. For a leveraged position the equity is less than 100% of\nthe position's value, therefore any percentage change the position's value will produce a greater percentage change in the equity.\nLeveraged long positions exhibit a wider dispersion of returns than unleveraged long positions since the percentage gains (losses) are greater\nwhen prices rise (fall). Therefore, leveraged long positions are riskier. The difference in risk is related directly to the leverage ratio: if a position's\nequity is reduced in line with a reduction in the minimum margin requirement, risk increases since the leverage has increased.\n(Choice A) The collateral value of securities is based on market value and is not affected by the margin requirement.\n(Choice B) Losses are not limited to the trader's equity in the position. Holders of leveraged security positions incur losses equal to the full\namount of any loss on the entire position.\nThings to remember:\nThe risk of a leveraged position is related directly to the leverage ratio. If the equity committed to a position is reduced in line with a reduction in\nthe minimum margin requirement, both the leverage ratio and the position's risk increase.\nCompare positions an investor can take in an asset", "qhtml": null}, {"n": 35, "q": "An investor is able to subscribe for 100 shares of new-issue stock at a fixed price of $25 per share as a result of already owning 1,000 shares. This transaction is best described as a: ", "opts": ["rights offering.", "private placement.", "preferred stock offering."], "ans": "A", "expl": "Companies use several methods to issue securities when raising equity capital. A rights offering is a relatively easy way for companies to raise\nnew capital by tapping into their existing shareholder base.\nIn a rights offering, existing shareholders are entitled to purchase, at a predetermined price, additional shares proportional to their existing\nholdings. In this scenario, the investor has the right to buy 1 share for every 10 shares owned.\nFor shareholders, a disadvantage of a rights offering is that it is dilutive, forcing shareholders to commit additional capital to maintain their\nproportional ownership. However, there also are advantages for shareholders, including the following:\nRights come at no cost.\nRights are a form of short-term warrant that can often be sold to other investors.\nThe subscription price is almost always below the market price, resulting in an immediate gain.\n(Choice B) In a private placement, restricted shares (ie, shares that can be sold only to qualified investors) are sold directly to a limited number of\nqualified investors. Participation in a private placement is not dependent on existing ownership.\n(Choice C) A preferred stock offering is typically issued through traditional public offering methods and offers preferred stock, not additional\nshares of common stock.\nThings to remember:\nIn a rights offering, existing shareholders are entitled to purchase, at a predetermined price, additional shares proportional to their holdings.\nDefine primary and secondary markets and explain how secondary markets s
