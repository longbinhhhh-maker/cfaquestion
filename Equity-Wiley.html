upport primary markets", "qhtml": null}, {"n": 36, "q": "Which of the following is least likely a reason for a public company to issue securities through a private placement?", "opts": ["Lower issuance costs", "Higher offering prices", "Fewer disclosure requirements"], "ans": "B", "expl": "Companies use many methods to issue securities when raising capital. In a private placement, shares are not offered to all potential investors as\nin a public offering. Instead, they are sold directly to a limited number of qualified investors. Private placements have several features that make\nthem attractive to issuers, including reduced regulatory and disclosure requirements resulting in lower issuance costs than public offerings\n(Choices A and C).\nPrivately placed issues are potentially riskier than securities sold through public offerings. This is due in part to reduced disclosure, which makes\nthe securities more difficult to evaluate. Further, securities may be illiquid as they typically cannot be traded on organized exchanges until a\nspecified time has elapsed. Due to the increased risk, private placements can be sold only to a limited number of wealthy, knowledgeable (ie,\nqualified) investors. Investors are compensated with higher expected returns (ie, lower offering prices) relative to public offerings.\nThings to remember:\nPrivate placements are sold directly to a limited number of qualified investors. The reduced regulatory and disclosure requirements lower\nissuance costs. However, the securities may be riskier than securities sold through public offerings due to reduced disclosure and possible\nrestrictions on exchange trading. Investors are compensated with higher expected returns.\nDefine primary and secondary markets and explain how secondary markets support primary markets", "qhtml": null}, {"n": 37, "q": "A trader bought 1,000 shares of a non-dividend paying stock on margin for £100 per share. The trader sells the shares 3 months later for £110 per share. The leverage ratio at the time of the purchase was 3. Ignoring interest on the borrowed amount and transaction costs, the rate of return earned by the trader during this period is closest to:", "opts": ["10%", "14%", "30%"], "ans": "C", "expl": "Traders often borrow money to finance portions of a purchase, a technique that is frequently referred to as \"buying on margin.\" The margin\nloan is the borrowed amount, and equity is the trader's own funds. The leverage ratio is the amount of total funds invested (margin loan plus\nequity) compared with equity. The greater the leverage (due to the greater proportion of borrowing), the riskier the trader's position since leverage\nmagnifies both gains and losses.\nIn this case, the leverage ratio is 3, so the trader acquires an initial position that is 3 times the amount of equity. This also means that the trader's\nleveraged return is 3 times the unleveraged return. Had the trade been unleveraged, the return would have been 10%, or (110 – 100) ÷ 100.\nHowever, since the trader bought on margin, the unleveraged return (not considering interest and transaction costs) is multiplied by 3, which\nresults in a leveraged return of 30%.\n(Choice A) 10% is the unleveraged return. Since the trader purchased a position 3 times the initial equity (ie, supplied 33.33% of funds with own\nequity), 10% return is multiplied by 3.\n(Choice B) 14% results from dividing the unleveraged return by the proportion of margin borrowing, not the initial equity.\nThings to remember:\nTraders often borrow a portion of the funds that are required to purchase a security; this is known as buying on margin. Not considering interest or\ntransaction costs, the leveraged return equals the leverage ratio times the unleveraged return.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 38, "q": "A limit order book contains the following information for a stock: The market bid-ask quote is most likely:", "opts": ["15.20 bid, 15.27 ask", "15.20 bid, 15.33 ask", "15.25 bid, 15.27 ask"], "ans": "C", "expl": "Market makers (eg, dealers) provide liquidity in the marketplace by transacting with other buyers and sellers. Dealers are willing to buy at bid\nprices and sell at ask prices (offer prices) and profit from the difference (ie, bid-ask spread). The market bid-ask quote is the highest bid price\n(best bid) and lowest ask price (best ask).\nIn this instance, the highest bid is 15.25, and the lowest ask is 15.27. This means that 15.25 is the best (highest) price that a seller can sell to a\ndealer who is willing to buy, and 15.27 is the best (lowest) price that a buyer can buy from a dealer who is willing to sell.\nThings to remember:\nMarket makers (eg, dealers) are willing to buy securities at bid prices and sell at ask prices (offer prices). The market bid-ask quote contains the\nhighest bid price (best bid) and lowest ask price (best ask).\nCompare execution, validity, and clearing instructions", "qhtml": null}, {"n": 39, "q": "An investor bought 500 shares of stock on margin at the beginning of the year and sold them all at year-end: Assume that dividends and interest are paid at year-end. If the leverage ratio is 4 and the call money rate is 6%, then the investor's total rate of return over this period is closest to:", "opts": ["−42.09%", "−42.25%", "−42.32%"], "ans": "B", "expl": "Buying on margin allows investors to acquire a position that is greater than their own capital (equity) since they can purchase an amount equal to\nthe margin loan plus equity.\nTo determine an investor's return, divide the net profit or loss by the investor's own initial outlay. Net loss (−2,645) equals the investor's\nlosses after accounting for dividend income, commissions, and interest expense. The investor's own initial outlay (6,260) equals the initial equity\nplus the commissions on the purchase. Here, the investor's return is −42.25%.\nNote that commissions must be accounted for in both the numerator and in the denominator when calculating net total rate of return:\nIn the numerator, both purchase and sales commissions must be subtracted to exclude them from net profit\nIn the denominator, purchase commissions must be included as a real expenditure at Time 0, and therefore as part of the total initial outlay.\nTrading on margin amplifies risk by magnifying gains and losses. Here the stock price declined by 10%, from 50 to 45; however, financial leverage\n(from borrowing) magnified the loss by more than 4 times to 42.25%.\nThings to remember:\nTrading on margin magnifies gains and losses. To determine an investor's return, divide the net profit or loss by the investor's own initial outlay.\nNet profit or loss equals the investor's profit or loss after dividends, interest, and transaction costs. The investor's own initial outlay equals the\ninitial equity plus the commissions on the purchase.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call LOS\n40.A trader buys shares of a stock on margin:\nBased on this information, the margin call price is closest to:\n\nA. €233.33\nB. €350.00\nC. €420.00\nExplanation\nInvestors often borrow money from brokerages to finance portions of a stock purchase (ie, buying on margin). As time passes, the trader's equity\namounts to the value of the stock position net of the margin loan. Downward stock price movements decrease the trader's equity percentage\n(equity / value of total stock position), which increases risk to the lender for recovering principal.\nBrokerage lenders protect their loaned money by imposing a maintenance margin requirement, which specifies the trader's minimum equity\npercentage (40%). If the equity percentage drops below 40% (from stock price declines), then the investor must contribute additional equity.\nOtherwise, the brokerage will sell the entire stock position and recoup the loan. The margin call price (233.33) is the stock price that triggers a\nmargin call .\nTo conceptually grasp the calculation, understand that the investor initially contributed €560 (denoted E) per share in equity (80% of purchase\ni\nprice × €700 a share). If the stock price drops to €233.33, the trader's equity per share amounts to €93.33, or [560 + (233.33 − 700)]. This results\nin an equity percentage of 40% (or 93.33 / 233.33), which equals the maintenance margin. Effectively, if the stock price falls below 233.33, the\ninvestor will receive a margin call since the remaining equity percentage will be below the 40% maintenance margin.\n(Choice B) €350.00 results from incorrectly setting 60% (or 1 − 0.4) as the maintenance margin.\n(Choice C) €420.00 results from reducing the initial stock price of €700 by 40%.\nThings to remember:\nThe minimum margin requirement specifies the trader's minimum equity percentage. If the equity percentage drops below the minimum margin\nrequirement, then the investor must contribute additional equity. The margin call price is the stock price that triggers a margin call.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call LOS\n41.An individual financial adviser manages the discretionary account of a client who needs both long-term and short-term liquidity and has a low\nrisk tolerance. The advisor is authorized by the client to trade for the account and is paid on a commission basis. In this scenario, a regulatory\nagency charged with monitoring the activities of financial advisers is most likely concerned with:\nA. ensuring economic justice.\nB. guaranteeing client objectives.\n C. controlling an agency problem.\nExplanation\nMarket regulation forms a critical part of the legal and economic framework in which well-functioning markets thrive. Agency problems exist when\nthe interests of an agent acting on behalf of an owner come into conflict with the owner's interests. These problems can be compounded by the\ncomplexity of products and by information asymmetries between professionals and customers, creating opportunities for fraudulent activity. The\npotential for conflict of interest between customers and agents creates the need for regulators to control agency problems.\nIn this scenario, the interests of the financial adviser (ie, the agent) and the owner of the account (ie, the client) are not aligned since the adviser\ncan earn commissions from frequent trading whereas the owner benefits from less frequent trading and maintaining account liquidity. This is a\ncommon agency problem between advisor and client.\nWhether or not the adviser chooses to take advantage of the client for personal gain, the conflict of interest exists. Although conflicts cannot be\neliminated, market regulators try to control them by requiring disclosure of conflicts to clients, training of advisors, and enforcing existing\nstandards.\n(Choice A) Although ensuring economic fairness may be an objective of the political system, it is not a direct goal of market regulation.\n(Choice B) Regulators cannot guarantee that client objectives will be met.\nThings to remember:\nAgency problems exist when the interests of an agent acting on behalf of an owner come into conflict with the owner's interests. The potential for\nconflicts of interest between customers and agents creates the need for regulators to control agency problems.\nDescribe objectives of market regulation", "qhtml": null}, {"n": 40, "q": "A trader buys shares of a stock on margin: Based on this information, the margin call price is closest to: ", "opts": ["€233.33", "€350.00", "€420.00"], "ans": "A", "expl": "Investors often borrow money from brokerages to finance portions of a stock purchase (ie, buying on margin). As time passes, the trader's equity\namounts to the value of the stock position net of the margin loan. Downward stock price movements decrease the trader's equity percentage\n(equity / value of total stock position), which increases risk to the lender for recovering principal.\nBrokerage lenders protect their loaned money by imposing a maintenance margin requirement, which specifies the trader's minimum equity\npercentage (40%). If the equity percentage drops below 40% (from stock price declines), then the investor must contribute additional equity.\nOtherwise, the brokerage will sell the entire stock position and recoup the loan. The margin call price (233.33) is the stock price that triggers a\nmargin call .\nTo conceptually grasp the calculation, understand that the investor initially contributed €560 (denoted E) per share in equity (80% of purchase\ni\nprice × €700 a share). If the stock price drops to €233.33, the trader's equity per share amounts to €93.33, or [560 + (233.33 − 700)]. This results\nin an equity percentage of 40% (or 93.33 / 233.33), which equals the maintenance margin. Effectively, if the stock price falls below 233.33, the\ninvestor will receive a margin call since the remaining equity percentage will be below the 40% maintenance margin.\n(Choice B) €350.00 results from incorrectly setting 60% (or 1 − 0.4) as the maintenance margin.\n(Choice C) €420.00 results from reducing the initial stock price of €700 by 40%.\nThings to remember:\nThe minimum margin requirement specifies the trader's minimum equity percentage. If the equity percentage drops below the minimum margin\nrequirement, then the investor must contribute additional equity. The margin call price is the stock price that triggers a margin call.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call LOS\n41.An individual financial adviser manages the discretionary account of a client who needs both long-term and short-term liquidity and has a low\nrisk tolerance. The advisor is authorized by the client to trade for the account and is paid on a commission basis. In this scenario, a regulatory\nagency charged with monitoring the activities of financial advisers is most likely concerned with:\nA. ensuring economic justice.\nB. guaranteeing client objectives.\n C. controlling an agency problem.\nExplanation\nMarket regulation forms a critical part of the legal and economic framework in which well-functioning markets thrive. Agency problems exist when\nthe interests of an agent acting on behalf of an owner come into conflict with the owner's interests. These problems can be compounded by the\ncomplexity of products and by information asymmetries between professionals and customers, creating opportunities for fraudulent activity. The\npotential for conflict of interest between customers and agents creates the need for regulators to control agency problems.\nIn this scenario, the interests of the financial adviser (ie, the agent) and the owner of the account (ie, the client) are not aligned since the adviser\ncan earn commissions from frequent trading whereas the owner benefits from less frequent trading and maintaining account liquidity. This is a\ncommon agency problem between advisor and client.\nWhether or not the adviser chooses to take advantage of the client for personal gain, the conflict of interest exists. Although conflicts cannot be\neliminated, market regulators try to control them by requiring disclosure of conflicts to clients, training of advisors, and enforcing existing\nstandards.\n(Choice A) Although ensuring economic fairness may be an objective of the political system, it is not a direct goal of market regulation.\n(Choice B) Regulators cannot guarantee that client objectives will be met.\nThings to remember:\nAgency problems exist when the interests of an agent acting on behalf of an owner come into conflict with the owner's interests. The potential for\nconflicts of interest between customers and agents creates the need for regulators to control agency problems.\nDescribe objectives of market regulation", "qhtml": null}, {"n": 41, "q": "An individual financial adviser manages the discretionary account of a client who needs both long-term and short-term liquidity and has a low risk tolerance. The advisor is authorized by the client to trade for the account and is paid on a commission basis. In this scenario, a regulatory agency charged with monitoring the activities of financial advisers is most likely concerned with:", "opts": ["ensuring economic justice.", "guaranteeing client objectives.", "controlling an agency problem."], "ans": "C", "expl": "Market regulation forms a critical part of the legal and economic framework in which well-functioning markets thrive. Agency problems exist when\nthe interests of an agent acting on behalf of an owner come into conflict with the owner's interests. These problems can be compounded by the\ncomplexity of products and by information asymmetries between professionals and customers, creating opportunities for fraudulent activity. The\npotential for conflict of interest between customers and agents creates the need for regulators to control agency problems.\nIn this scenario, the interests of the financial adviser (ie, the agent) and the owner of the account (ie, the client) are not aligned since the adviser\ncan earn commissions from frequent trading whereas the owner benefits from less frequent trading and maintaining account liquidity. This is a\ncommon agency problem between advisor and client.\nWhether or not the adviser chooses to take advantage of the client for personal gain, the conflict of interest exists. Although conflicts cannot be\neliminated, market regulators try to control them by requiring disclosure of conflicts to clients, training of advisors, and enforcing existing\nstandards.\n(Choice A) Although ensuring economic fairness may be an objective of the political system, it is not a direct goal of market regulation.\n(Choice B) Regulators cannot guarantee that client objectives will be met.\nThings to remember:\nAgency problems exist when the interests of an agent acting on behalf of an owner come into conflict with the owner's interests. The potential for\nconflicts of interest between customers and agents creates the need for regulators to control agency problems.\nDescribe objectives of market regulation", "qhtml": null}, {"n": 42, "q": "An employee of a manufacturing firm is tasked with trading derivatives on behalf of the company. These transactions should limit loss due to price changes of raw materials used in the company's manufacturing process. As an ancillary result of this activity, the employee may occasionally make an unintended additional trading profit for the company. The employee is best described as a:", "opts": ["long-term investor.", "professional hedger.", "market data–driven trader."], "ans": "B", "expl": "Although the list is not exhaustive, CFA Institute identifies six main functions of the financial system. In this scenario, the employee's job is to\ncontrol risk resulting from price changes of raw materials used in manufacturing. Companies prefer predictable prices for raw materials so they\ncan focus on business operations. By using derivatives to fix a future price for materials, the company removes price uncertainty.\nThis employee is acting as a hedger (ie, risk manager), whose job is to mitigate loss on behalf of the company. To answer questions on this part\nof the CFA curriculum, note that most participants in the financial system use the system in more than one way. Therefore, it is important to\nconsider the primary use of the financial system by the participant.\n(Choice A) Investors use risky portfolios to save and grow funds for future use, whereas hedgers (ie, risk managers) attempt to mitigate financial\nloss. Although the employee buys and sells financial instruments on behalf of the company, the employee's goal is not to grow assets over time,\nbut to offset price changes, thereby limiting financial loss.\n(Choice C) Information-motivated traders have the goal of making money by reacting to market data. Although the employee uses information to\nbuy and sell derivatives, the focus is on mitigating loss, not generating trading profits.\nThings to remember:\nThe six functions of the financial system are saving, borrowing, raising capital using equity, managing risk, exchanging assets, and trading on\ninformation. Hedgers are primarily focused on mitigating financial loss.\nExplain the main functions of the financial system", "qhtml": null}, {"n": 43, "q": "A market's limit order book for a stock is listed below: Bid Size Price Offer Size (Shares) (EUR) (Shares) 500 102.60 300 102.80 200 103.00 103.05 150 103.10 300 103.20 600 A buy limit order for 200 shares makes a new market when it is priced at:", "opts": ["103.00", "103.03", "103.05"], "ans": "B", "expl": "A market order instructs a brokerage firm to immediately execute a trade at the current market price. A limit order instructs the firm to execute\nthe trade at only the limit price or better. When a new limit order is entered at the current market price, the order is said to:\nmake a new market if it is entered at a price between the current highest bid and lowest offer. In this scenario, the buy limit order of\nEUR 103.03 is between the existing best bid and best offer, so it makes a new market.\nmake the market if it matches the current best bid (buy limit order) or offer (sell limit order) price and is added to the order book. A price of\n103.00 matches the current best bid (Choice A).\ntake the market if a buy (sell) order is placed at the existing best offer (bid). A price of 103.05 matches the best offer and would be executed\nimmediately (Choice C).\nThings to remember:\nA new limit order entered between the current highest bid and lowest offer makes a new market. When a new limit order matches the current best\nbid (buy) or offer (sell) price, the order makes the market. A buy limit order placed at the existing best offer price takes the market.\nCompare market orders with limit orders", "qhtml": null}, {"n": 44, "q": "A trader buys 1,000 shares of a stock at $40 per share and deposits a 40% margin. The stock's price subsequently appreciates to $52 per share. The interest charged on the margin loan during the period is $442. Based on only this information, the position's leverage ratio after the price change is closest to:", "opts": ["1.85", "1.89", "3.25"], "ans": "B", "expl": "Traders often borrow money to finance portions of a purchase, a technique called buying on margin. The margin loan is the borrowed amount,\nand the equity is the trader's own capital. The leverage ratio measures the market value of the position relative to the trader's equity (ie,\nmarket value less any funds owed).\nIn this scenario, the initial margin was 40%, so the trader borrowed 60%, or $24,000 of the of the $40,000 initial purchase. Subsequently, the\nposition's market value increases to $52,000. After the trader repays the $24,000 loan plus $442 of interest, $27,558 of equity remains. This\nresults in a leverage ratio of 1.89 (or 52,000 / 27,558).\n(Choice A) 1.85 results from not accounting for the accrued interest on the margin loan.\n(Choice C) 3.25 results from dividing the value of the position after the change in stock price by the initial value of equity. The stock's\nappreciation after the initial purchase increases the amount of equity in the position, which decreases the leverage ratio.\nThings to remember:\nThe leverage ratio measures the market value of a position relative to the trader's equity. The value of equity in the position is its market value\nless any funds owed, including the loan principal and any accrued interest.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 45, "q": "If a broker receives a day order from a client, this instruction is best described as a(n):", "opts": ["validity instruction.", "clearing instruction.", "execution instruction."], "ans": "A", "expl": "Buyers and sellers send various order instructions to intermediaries (eg, brokers, exchanges) in connection with trades. Validity instructions state\nthe allotted time frame in which an order may be filled. A day order to make a purchase, as in this case, is valid for the same day it is issued and\nexpires at the end of that day if not filled. The client in this scenario does not specify any execution (ie, market or limit order) or clearing (ie,\nsettlement) instructions (Choices B and C).\nThings to remember:\nValidity instructions state the valid time frame in which an order may be filled. Day orders or immediate-or-cancel orders are examples of validity\ninstructions. Execution instructions state how to fill an order and clearing instructions state how trades are settled.\nCompare execution, validity, and clearing instructions", "qhtml": null}, {"n": 46, "q": "A company that mainly transacts in EUR will have to pay a supplier in USD in 30 days. To hedge currency risk, which of the following actions is most appropriate for this company? ", "opts": ["Take a long position in the USD futures today.", "Take a short position in the USD futures today.", "Buy the USD at the spot rate 30 days from today."], "ans": "A", "expl": "A futures contract is an agreement between two parties to exchange an underlying asset in the future at a predetermined price. The long party\n(ie, the buyer of the futures contract) is obligated to purchase the underlying asset at expiration. The short party (ie, the seller of the futures\ncontract) is obligated to deliver the underlying asset at expiration.\nIn this situation, the company needs USD at the end of 30 days to make a payment. Therefore, it can take a long position in a futures contract\ntoday to purchase USD (the underlying asset) from a counterparty in 30 days for EUR. The company effectively hedges itself against potential\nfluctuations in the EUR/USD exchange rate within the period by locking in a predetermined exchange rate today.\n(Choice B) The counterparty, not the company, takes a short position in the USD futures contract.\n(Choice C) Buying USD at the spot rate in 30 days exposes the company to exchange rate risk since the EUR/USD exchange rate may fluctuate\nin this time frame.\nThings to remember:\nA futures contract is an agreement between two parties to exchange an underlying asset in the future at a predetermined price. The long party to\nthe futures contract will buy the underlying asset at expiration. The short party will sell the underlying asset at expiration.\nCompare positions an investor can take in an asset", "qhtml": null}, {"n": 47, "q": "In contrast to brokers, dealers most likely:", "opts": ["match buyers to sellers.", "act as agents for clients.", "trade directly with clients."], "ans": "C", "expl": "Financial intermediaries such as brokers, dealers, banks, clearinghouses and exchanges help facilitate transactions that maintain a well-\nfunctioning financial system. The range of services may include connecting buyers with sellers, trading directly with clients, and providing facilities\nwhere transactions can take place.\nDealers help clients fulfill orders by trading (buying or selling) with them directly. As such, dealers are traders who help provide liquidity. The\nprofit that the dealer earns is the difference between the buying and selling price (ie, bid-ask spread). In contrast, brokers are agents who match\nbuyers to sellers, either personally or through an electronic system (Choices A and B). The broker earns a commission for this service.\nThings to remember:\nDealers help clients fulfill orders by trading (buying or selling) with them directly. In contrast, brokers are agents who match buyers to sellers,\neither personally or through an electronic system.\nDescribe types of financial intermediaries and services that they provide", "qhtml": null}, {"n": 48, "q": "An investor buys 5,000 shares of a stock for $25 per share, on 40% margin. If the maintenance margin requirement is 20%, then the investor will receive a margin call at a price closest to: ", "opts": ["$18.75", "$20.00", "$25.00"], "ans": "A", "expl": "Investors often borrow money from brokerages to finance portions of a stock purchase (ie, buying on margin). As time passes, the trader's equity\namounts to the value of the stock position minus the margin loan. Downward stock price movements decrease the trader's equity percentage\n(equity / value of total stock position), which increases risk to the lender for recovering principal.\nBrokerage lenders protect their loaned money by imposing a maintenance margin requirement, which specifies the trader's minimum equity\npercentage (20%). If the equity percentage drops below 20% then the investor must contribute additional equity. Otherwise, the brokerage will\nsell the entire stock position and recoup the loan. The margin call price (18.75) is the stock price that triggers a margin call .\nTo conceptually grasp the calculation, understand that the investor initially contributed $10 (E) per share in equity (40% of purchase price × $25 a\ni\nshare). If the stock price subsequently drops below 18.75, then the trader's equity per share amounts to $3.75, or [10 + (18.75 − 25)]. This results\nin an equity percentage of 20% (or 3.75 / 18.75), which equals the maintenance margin.\n(Choice B) $20 results from decreasing the initial stock price of $25 by 20%.\n(Choice C) $25 results from using the initial margin of 40% in place of the maintenance margin of 20%.\nThings to remember:\nThe minimum margin requirement specifies the trader's minimum equity percentage. If the equity percentage drops below the minimum margin\nrequirement, the investor must contribute additional equity. The margin call price is the stock price that triggers a margin call.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 49, "q": "A market's limit order book for a stock is listed below: If a sell limit order for 600 shares is entered and is \"inside the market,\" its limit price is most likely:", "opts": ["CNY 73.80", "CNY 73.90", "CNY 73.95"], "ans": "B", "expl": "The prices that market participants are willing to buy (sell) at are called bid (offer) prices. When a new limit order is entered that is between the\ncurrent best bid (highest) and offer (lowest), it is said to be inside the market, and it makes a new market. The offer to sell 600 shares at CNY\n73.90 came inside the market and made a new market.\nWhen a new limit order is entered that is at current market prices, the order is said to:\nTake the market if it is immediately executed, since the order takes what the market is currently quoting. A buyer takes the lowest (best)\noffer and a seller takes the highest (best) bid (Choice A).\nMake the market if it matches the current best bid (buy) or offer (sell) price and is added to the order book (Choice C).\nThings to remember:\nWhen a new limit order matches the current best bid (buy) or offer (sell) price, the order makes the market. When a new limit order matches a\ncurrent market quote, it takes the market and is immediately executed. When a new market order is entered that is between the current highest\nbid and lowest offer, it makes a new market.\nCompare market orders with limit orders", "qhtml": null}, {"n": 50, "q": "An investor uses ¥90,000 equity to purchase 100 shares of a stock at a leverage ratio of 2.5. If the maintenance margin is 25%, then the trigger price for a margin call (in ¥) is closest to:", "opts": ["800", "1,688", "1,800"], "ans": "C", "expl": "To finance part of a stock purchase, an investor may borrow money from a brokerage (ie, buy on margin). The investor's equity is the value of\nthe stock position net of the margin loan. When the stock price decreases, it reduces the investor's equity percentage (Equity / Value of total\nstock position).\nBrokers protect their loans by imposing a maintenance margin requirement on top of the initial margin requirement. If the stock price drops\nbelow the margin call price (P ), the equity percentage will drop below the maintenance requirement. The investor must then contribute\nT\nadditional equity.\nThe leverage ratio is the size of the investment expressed as a multiple of the initial equity contribution. The initial margin is the inverse of the\nleverage ratio. In this scenario, the price that triggers the margin call can be calculated (in ¥) as follows:\nAt a margin call price of ¥1,800, the value of the stock and the investor's equity has fallen by ¥450, leaving the investor's equity at ¥450 (¥900 −\n¥450). ¥450 is 25% of ¥1,800 (ie, the maintenance margin requirement). If the stock price drops below ¥1,800, then the investor's equity has\nfallen below the maintenance margin, triggering a margin call.\nThings to remember:\nIf shares of stock are bought on margin and the investor's equity percentage drops below the minimum margin requirement, the investor must\ncontribute additional equity. The margin call price is the stock price that triggers a margin call.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call\n51. If a firm provides market liquidity simultaneously to buyers and sellers of the same instrument in different markets, the firm is best described as\na(n):\nA. broker.\nB. dealer.\n\nC. arbitrageur.\nExplanation\nDealers vs. arbitrageurs\nProvide liquidity by connecting market participants\nDealers\nwho arrive at the same market but at different times\nProvide liquidity by connecting market participants\nArbitrageurs\nwho arrive at different markets at the same time\nDealers and arbitrageurs are financial intermediaries that often compete for trading opportunities since they both act as counterparties to buyers\nand sellers and provide market liquidity. Arbitrageurs provide market liquidity by simultaneously buying a security in one market (eg,\ndomestically listed foreign stock) and selling the same security in another market (eg, foreign stock in its local market).\n(Choice A) Brokers do not provide market liquidity. Acting only as agents, they attempt to find willing counterparties for client trades.\n(Choice B) Dealers act as counterparties for both buyers and sellers in the same market but at different times.\nThings to remember:\nDealers and arbitrageurs provide market liquidity by acting as counterparties to buyers and sellers. Arbitrageurs simultaneously buy a security in\none market and sell the same security in another market, while dealers buy and sell in the same market at different times.\nDescribe types of financial intermediaries and services that they provide", "qhtml": null}, {"n": 51, "q": "If a firm provides market liquidity simultaneously to buyers and sellers of the same instrument in different markets, the firm is best described as a(n):", "opts": ["broker.", "dealer.", "arbitrageur."], "ans": "C", "expl": "Dealers vs. arbitrageurs\nProvide liquidity by connecting market participants\nDealers\nwho arrive at the same market but at different times\nProvide liquidity by connecting market participants\nArbitrageurs\nwho arrive at different markets at the same time\nDealers and arbitrageurs are financial intermediaries that often compete for trading opportunities since they both act as counterparties to buyers\nand sellers and provide market liquidity. Arbitrageurs provide market liquidity by simultaneously buying a security in one market (eg,\ndomestically listed foreign stock) and selling the same security in another market (eg, foreign stock in its local market).\n(Choice A) Brokers do not provide market liquidity. Acting only as agents, they attempt to find willing counterparties for client trades.\n(Choice B) Dealers act as counterparties for both buyers and sellers in the same market but at different times.\nThings to remember:\nDealers and arbitrageurs provide market liquidity by acting as counterparties to buyers and sellers. Arbitrageurs simultaneously buy a security in\none market and sell the same security in another market, while dealers buy and sell in the same market at different times.\nDescribe types of financial intermediaries and services that they provide", "qhtml": null}, {"n": 52, "q": "For an investor wanting to make a long-term bullish bet on gold, which of the following is the best reason to go long on a futures contract rather than buying physical gold? ", "opts": ["Gold futures are more liquid than physical gold.", "Gold futures have less price risk than physical gold.", "The return on gold futures is not impacted by storage costs."], "ans": "A", "expl": "Gold is a commodity, and like other commodities, it can be purchased. A trader can create a long position by purchasing physical gold (eg, bullion)\nin the spot market, by buying a forward contract or by buying a standardized futures contract. As with most commodities, trading in the spot and\nforward markets entails costs and risks that are avoided by trading gold futures.\nStorage costs: Commodities are typically expensive to hold given the cost of storage and security, but futures positions can be offset by\ntaking an opposite position to avoid delivery and storage costs.\nTransaction costs and risks: The quality of a commodity (eg, the purity of gold) can vary, creating risk, but standardized futures contracts\nspecify such characteristics, removing those transaction risks.\nCounterparty risk: Buying the commodity or a forward contract is a bilateral trade that creates counterparty risk, but futures trade on an\nexchange with a clearinghouse that guarantees performance, resolving counterparty risk.\nSince futures contracts resolve these issues and minimize the costs of trading, they are more liquid than a long position in either the physical\ncommodity or a forward contract.\n(Choice B) The arbitrage-free pricing of commodities such as gold versus gold futures insures their prices must track one another over time.\nAdjusted tor the cost of carry, price changes in physical gold and gold futures must be almost the same.\n(Choice C) Commodities futures exceed the price of bullion by the cost of holding bullion (ie, cost of carry), and holding costs increase with the\nholding period. Consequently, returns on long futures positions will be less than returns from owning bullion. After adjusting for the cost of holding\nbullion, the return on both positions is the same.\nThings to remember:\nSome commodities, including gold, are expensive to hold and trade. Since commodity trades are bilateral, there is counterparty risk. Futures\ncontracts minimize the costs and remove the counterparty risk, making futures more liquid than the related commodity.\nDescribe the major types of securities, currencies, contracts, commodities, and real assets that trade in organized markets, including their\ndistinguishing characteristics and major subtypes", "qhtml": null}, {"n": 53, "q": "A market's limit order book for a stock is listed below: An investor submits a day order to sell 1,000 shares, limit NZD 15.40. No new bids or offers are submitted before the market closes. The average trade price is closest to:", "opts": ["15.40", "15.45", "15.49"], "ans": "B", "expl": "Execution instructions define how an order is filled. A limit order instructs the brokerage firm to execute the trade only at the limit price or\nbetter. Validity instructions state the time frame and conditions under which an order may be filled. A day order is valid for the same day it is\nissued and expires at the end of that day if not filled.\nIn this scenario, an investor has submitted a day order to sell 1,000 shares, limit NZD 15.40. The prices at which market participants are willing to\nbuy (sell) are called bid (offer) prices. Therefore, the sell order will be filled on the bid side (ie, buyers of stock) of the market.\nThe investor has set a limit price of NZD 15.40, instructing the broker to sell up to 1,000 shares at this price or higher. The 700 shares offered at\nor above the limit price are immediately filled with an average price of NZD 15.45. Since no new bids are submitted before the market closes, the\nunfilled portion of the order is canceled.\n(Choice A) A limit order does not automatically imply that the order will be filled at the limit price of NZD 15.40.\n(Choice C) The investor did sell 400 shares at a weighted average price of NZD 15.49 (ie, [(300 × 15.50) + (100 × 15.45)]/400), but also sold an\nadditional 300 shares at the limit price of NZD 15.40, for a total average trade price of NZD 15.45.\nThings to remember:\nA limit order instructs the brokerage firm to execute the trade only at the limit price or better. A day order is valid for the same day it is issued and\nexpires at the end of that day if not filled.\nCompare market orders with limit orders", "qhtml": null}, {"n": 54, "q": "An investor buys 2,000 shares of a stock at $21 per share and deposits an initial margin of 40% of the purchase. If the maintenance margin is 25%, the trigger price for a margin call is closest to:", "opts": ["$13.13", "$16.80", "$17.85"], "ans": "B", "expl": "A trader may buy stock in a margin account and pay for only part of the position's purchase price in cash. The rest of the purchase is financed\nusing a margin loan extended by the broker-dealer. This is referred to as \"buying on margin.\"\nMargin accounts have an initial margin requirement and a maintenance margin requirement. The initial margin requirement may be set by the\ngovernment, the exchange, or the clearinghouse. Broker-dealers who accept margin accounts typically set the minimum margin requirement at\n25%, but they may set it higher or lower depending on the position's volatility and their individual policies. The trader will get a margin call if the\nposition equity falls below the maintenance margin requirement, which happens when the stock price falls below the trigger price, P .\nT\nIn this scenario, the initial share price is $21. Since the initial margin requirement is 40%, the trader uses (21 × 0.40 =) $8.40 per share in cash to\nmake the purchase. Maintenance margin expressed as a decimal is 0.25. Substitute into the formula above to calculate the trigger price:\n(Choice B) $13.13 is the result of multiplying the purchase price by the ratio of the maintenance margin to the initial margin requirement.\n(Choice C) $17.85 is the result of calculating a share price 15% below the initial purchase price based on the 15% difference in the initial margin\nand maintenance margin requirements.\nThings to remember:\nA trader may buy stock in a margin account and pay for only part of the position's purchase price in cash. The rest of the purchase is financed\nusing a margin loan extended by the broker-dealer. The trader will get a margin call if the equity goes below the maintenance margin requirement,\nwhich occurs when the stock price falls below the trigger price.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which the investor would receive a\nmargin call", "qhtml": null}, {"n": 55, "q": "If dealers provide liquidity in a market, the market is most likely a(n):", "opts": ["brokered market.", "order-driven market.", "quote-driven market."], "ans": "C", "expl": "Quote-driven markets are over-the-counter (OTC) markets in which most trades occur between customers and dealers. In quote-driven markets,\ndealers provide liquidity (ie, make markets) by standing ready to trade at their quoted prices. Investors can buy or sell only at the price the\ndealer is willing to transact. Almost all currency and bond trading, as well as most spot commodity trading, occurs in quote-driven markets (ie,\nOTC).\n(Choice A) Brokered markets are those in which brokers search for willing counterparties on behalf of customers. Assets traded in brokered\nmarkets typically are expensive, unique, traded infrequently, and/or difficult to hold in inventory (eg, very large blocks of stock, fine art, real estate).\n(Choice B) In order-driven markets, buy and sell orders are matched based on price priority and time precedence. All automated trading systems\nand nearly all exchanges use order-driven systems.\nThings to remember:\nQuote-driven markets are over-the-counter markets in which most trades occur between customers and dealers. In quote-driven markets, dealers\nprovide liquidity by standing ready to trade at their quoted prices.\nDescribe how securities, contracts, and currencies are traded in quote-driven, order-driven, and brokered markets", "qhtml": null}, {"n": 56, "q": "The following price-weighted index data is for one year: Asset Beginning Price (€) Ending Price (€) Income (€) X 20 15 1 Y 40 50 3 Z 60 62 4 The total return of the index is closest to:", "opts": ["5.8%", "7.5%", "12.5%"], "ans": "C", "expl": "Total return of an index is the weighted average of the total returns of each asset in the index. The total return of each asset is the change in\noverall investment value as a percentage of beginning value, accounting for both price changes and income. The income component of total\nreturn may be dividends, interest, or another form of distribution.\nIn this scenario, the index is price-weighted. In a price-weighted index, the amount of each asset in the index is determined in proportion to\nits price. Thus, the initial percentages of each asset are:\nThe total return of the index is calculated using the initial weights of the assets as follows:\nCalculate and analyze the value and return of an index given its weighting method\n2.A fundamentally weighted index is constructed using the following data, with earnings yield as the weighting factor:\nBeginning Earnings per\nAsset\nprice (€) share (€)\nX 100.00 3.00\nY 48.00 4.80\nZ 80.00 4.00\nIf the initial value of the index is €1,000, the value of Asset Z in the index is closest to:\n\nA. €277\nB. €333\nC. €351\nExplanation\nFundamental weighting uses some fundamental measure of a company, such as earnings, to weight the assets in the index. Other usable\nmeasures include dividends, revenues, or book value.\nSince fundamental weighting uses these types of measures instead of market cap or share price, it tends to favor assets normally associated with\nvalue investing. To find the weight of an asset, divide the fundamental measure of the asset by the sum of the measures of every asset in the\nindex. In this example, the fundamental value is earnings yield, which is found by dividing earnings by share price.\nUse the price at the beginning of the period and the earnings per share to find the fundamental weight of Asset Z. Then multiply the weight of the\nasset by the initial value of the index to find the value of Asset Z in the index:\n(Choice B) €333 is the value of Asset Z in the index using equal weighting: €1,000 ÷ 3 = €333.\n(Choice C) €351 is the value in the index of Asset Z based on its price weight. The price weight of an asset is found by dividing the price of the\nasset by the sum of all the asset prices in the index.\nThings to remember:\nTo find the fundamental weight of an asset, divide the fundamental measure of the asset by the sum of the fundamental measures of all the assets\nin the index. Earnings yield is calculated as earnings per share divided by share price.\nCalculate and analyze the value and return of an index given its weighting method", "qhtml": null}, {"n": 57, "q": "A fundamentally weighted index is constructed using the following data, with earnings yield as the weighting factor: Beginning Earnings per Asset price (€) share (€) X 100.00 3.00 Y 48.00 4.80 Z 80.00 4.00 If the initial value of the index is €1,000, the value of Asset Z in the index is closest to: ", "opts": ["€277", "€333", "€351"], "ans": "A", "expl": "Fundamental weighting uses some fundamental measure of a company, such as earnings, to weight the assets in the index. Other usable\nmeasures include dividends, revenues, or book value.\nSince fundamental weighting uses these types of measures instead of market cap or share price, it tends to favor assets normally associated with\nvalue investing. To find the weight of an asset, divide the fundamental measure of the asset by the sum of the measures of every asset in the\nindex. In this example, the fundamental value is earnings yield, which is found by dividing earnings by share price.\nUse the price at the beginning of the period and the earnings per share to find the fundamental weight of Asset Z. Then multiply the weight of the\nasset by the initial value of the index to find the value of Asset Z in the index:\n(Choice B) €333 is the value of Asset Z in the index using equal weighting: €1,000 ÷ 3 = €333.\n(Choice C) €351 is the value in the index of Asset Z based on its price weight. The price weight of an asset is found by dividing the price of the\nasset by the sum of all the asset prices in the index.\nThings to remember:\nTo find the fundamental weight of an asset, divide the fundamental measure of the asset by the sum of the fundamental measures of all the assets\nin the index. Earnings yield is calculated as earnings per share divided by share price.\nCalculate and analyze the value and return of an index given its weighting method", "qhtml": null}, {"n": 58, "q": "An analyst compiles the following data about a market-capitalization-weighted index with a beginning index value of €1,000: Beginning Ending Dividends Outstanding Asset price (€) price (€) per share (€) shares X 100 112 3 100 Y 48 60 1 200 Z 80 92 2 300 The value of Asset X in the index at the beginning of the period is closest to: ", "opts": ["€230", "€333", "€439"], "ans": "A", "expl": "The weight of an asset in a market-capitalization-weighted (ie, market-cap-weighted) index is the market cap of the individual asset divided by\nthe sum of the market caps of all the assets in the index. The market cap of an asset is the product of the price of the asset and the number of\nshares outstanding. Dividends and end of period prices are not used in the calculation of an asset's weight in a market-cap-weighted index at the\nbeginning of the period.\nSubstituting the above values into the formula:\nThe value of Asset X in the index is the product of its weight in the index and the index value:\n(Choice B) €333 is the value of Asset X in an equal-weighted index.\n(Choice C) €439 is the value of Asset X in a price-weighted index: €100 ÷ (€100 + €48 + €80) × €1,000 = €439.\nThings to remember:\nIn a market-capitalization-weighted index, weight is apportioned to each asset based on market capitalization. Market cap is the product of shares\noutstanding and share price. The value of an asset in the index is the product of its weight in the index and the index value.\nCalculate and analyze the value and return of an index given its weighting method", "qhtml": null}, {"n": 59, "q": "Which of the following is most likely characteristic of fixed income index construction?", "opts": ["Fixed income indexes are more costly and difficult to replicate than equity indexes.", "A small number of securities can precisely replicate a given fixed income universe.", "Due to the size and liquidity of the bond market, there is ample price transparency."], "ans": "A", "expl": "Each bond issue has unique characteristics (eg, coupon, maturity, call features), resulting in thousands more individual securities than the equity\nmarkets. For example, the Bloomberg Barclays U.S. Aggregate Bond Index includes roughly 8,000 US-issued securities, combining various bond\ntypes and credit ratings that range from Treasury and agency debt to mortgage- and asset-backed securities and corporate bonds.\nThe lack of daily transactions and the general illiquidity for many of these bonds create a burdensome and expensive pricing process compared\nwith exchange-traded equities. These factors combine to make fixed income index construction more costly and difficult for an investor to replicate\nthan equity indexes.\n(Choice B) Due to the vast variety and characteristics of bonds outstanding, it is difficult for an index to precisely replicate the composition of a\nbond universe with a small sample of securities.\n(Choice C) Although the bond markets are much larger than equity markets and there are some issues that are very liquid and actively traded,\nthe vast majority of bond pricing occurs through dealer quotes or a matrix pricing process, making price transparency more burdensome and less\nclear.\nThings to remember:\nThe key challenges in fixed income index construction are the vast number of securities outstanding, limited availability of pricing data, and bond\nilliquidity. These factors combine to make fixed income index construction more costly and difficult for an investor to replicate than equity indexes.\nDescribe types of fixed-income indexes", "qhtml": null}, {"n": 60, "q": "An analyst gathers the following data about a value-weighted index: Selected Data (AUD) Asset Beginning Price Ending Price Dividend Shares Outstanding A 13.50 11.50 0.30 700,000 B 56.50 55.00 0.25 450,000 C 67.00 69.00 0.00 400,000 The price return of the index is closest to: ", "opts": ["−2.1%", "−1.5%", "−1.1%"], "ans": "A", "expl": "The price return of an index is the weighted average return of the asset prices of the index's constituents. An asset's price return is the\npercent change in its price over a given period. Unlike an index or asset's total return, the price return excludes any dividend or interest income\nfrom the assets since investors anticipate such income and adjust asset prices accordingly.\nTo find the price return of an index, multiply each asset's price return by its weighting in the index. The weighting depends on the type of index.\nFor a value-weighted (market cap–weighted) index, each asset's weight in the index is its beginning market capitalization as a percentage of the\ntotal beginning market cap in the index. This can be calculated as follows:\nWith the asset's weightings calculated, the index's price return can be calculated from the individual asset's price returns as follows:\nTherefore, the price return of the index is −2.1%.\n(Choice B) −1.5% results from weighting the assets by their prices, not their market caps.\n(Choice C) −1.1% results from including the asset's dividend income in the return calculation. Price returns exclude income from dividends.\nThings to remember:\nThe price return of an index is the weighted average return of the prices of the index's constituent assets. An asset's price return is the percent\nchange in its price over a certain period.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 61, "q": "An analyst has gathered the following information about a market-capitalization-weighted index: The price return of the index is closest to:", "opts": ["33%", "35%", "55%"], "ans": "B", "expl": "The weight of an asset in a market-capitalization-weighted (ie, market-cap-weighted) index is the market cap of the individual asset divided by\nthe sum of the market caps of all the assets in the index. The market cap of an asset is the product of the price of the asset and its number of\nshares outstanding.\nThe price return of an asset or index is found by subtracting the beginning price from the ending price, then dividing the quantity by the\nbeginning price. Dividends are not used in the calculation of price return.\nTo find the price return of the index, first find the market-cap weight of each asset in the index. Next, find the price return of each asset. Multiply\nthe weight of each asset by its price return. Finally, find the sum of the products of the weight of each asset and its price return. This is the price\nreturn of the index.\nThings to remember:\nThe market-cap weight of an asset in an index is the market cap of the individual asset divided by the sum of the market caps of all the index\nassets. The price return of an asset is found by subtracting the beginning price from the ending price and dividing that quantity by the beginning\nprice.\nCalculate and analyze the value and return of an index given its weighting method LOS\n7. Of the following, one disadvantage of price weighting a security index is that price weighting:\nA. leads to indexes with an inherent value tilt.\n\nB. does not reflect securities' market capitalization.\nC. is complex and difficult to apply to index creation.\nExplanation\nIn a price-weighted index, the weight of each constituent security is its price as a proportion of the sum of all the securities' prices in the index.\nOne advantage of this weighting method is the simplicity of its construction, since it requires only the price of each security (Choice C).\nOne disadvantage of a price-weighted index is that each company's weight may not correlate to the proportion of its total market value. This can\nresult in index returns that do not reflect the market since small companies with a high stock price but low market capitalization can have an\noversized impact on index returns compared to their impact in the market.\nIn addition, if a company splits its stock, the weighting of every security in the index must be revalued, although stock splits do not affect a\ncompany's total market value.\n(Choice A) Price-weighted indexes have no inherent value tilt. Value tilt is an issue for fundamentally weighted indexes since their weights are\nbased on fundamental factors (eg, sales, earnings). Compared to growth stocks, value stocks have higher ratios of such factors relative to their\nmarket values.\nThings to remember:\nOne disadvantage of a price-weighted index is that each company's weight may not correlate to the proportion of its total market value. In\naddition, if a company splits its stock, the weighting of every security in the index must be revalued, although stock splits do not affect a company's\ntotal market value.\nCompare the different weighting methods used in index construction", "qhtml": null}, {"n": 62, "q": "Of the following, one disadvantage of price weighting a security index is that price weighting:", "opts": ["leads to indexes with an inherent value tilt.", "does not reflect securities' market capitalization.", "is complex and difficult to apply to index creation."], "ans": "B", "expl": "In a price-weighted index, the weight of each constituent security is its price as a proportion of the sum of all the securities' prices in the index.\nOne advantage of this weighting method is the simplicity of its construction, since it requires only the price of each security (Choice C).\nOne disadvantage of a price-weighted index is that each company's weight may not correlate to the proportion of its total market value. This can\nresult in index returns that do not reflect the market since small companies with a high stock price but low market capitalization can have an\noversized impact on index returns compared to their impact in the market.\nIn addition, if a company splits its stock, the weighting of every security in the index must be revalued, although stock splits do not affect a\ncompany's total market value.\n(Choice A) Price-weighted indexes have no inherent value tilt. Value tilt is an issue for fundamentally weighted indexes since their weights are\nbased on fundamental factors (eg, sales, earnings). Compared to growth stocks, value stocks have higher ratios of such factors relative to their\nmarket values.\nThings to remember:\nOne disadvantage of a price-weighted index is that each company's weight may not correlate to the proportion of its total market value. In\naddition, if a company splits its stock, the weighting of every security in the index must be revalued, although stock splits do not affect a company's\ntotal market value.\nCompare the different weighting methods used in index construction", "qhtml": null}, {"n": 63, "q": "Reconstituting an index most likely causes the highest turnover of securities in a(n):", "opts": ["price-weighted index.", "equal-weighted index.", "market-cap-weighted index."], "ans": "C", "expl": "A securities index contains a variety of securities based on common criteria, such as asset class (eg, equity, fixed income), sector, or geographical\nlocation. However, securities may be added or deleted from an index, a process known as reconstitution. Reasons for reconstitution include:\nA security no longer exists due to merger or bankruptcy.\nThe index changes the criteria for inclusion, so certain securities no longer qualify (or newly qualify).\nA security no longer meets the criteria for inclusion (or newly meets it).\nThe weight of each security in a market-cap-weighted index is a percentage of the index's total market cap. Adding new securities or deleting\nexisting ones changes the total market cap, so each security has a new weight in the reconstituted index. After the index is reconstituted, the\nsecurities are rebalanced to achieve the correct weight.\nSince reconstitution causes turnover both for the added/deleted securities as well as the securities that remain after the reconstitution, market-cap\nweighted indexes tend to have the highest turnover. An equal-weighted index can experience high turnover, but usually securities are not added\nor deleted; instead they are bought or sold to maintain equal weighting (Choice B). A price-weighted index is not rebalanced since the weight of\neach security is determined by its price. A price-weighted index is only altered through reconstitution, so its turnover is less than that of a market-\ncap weighted index (Choice A).\nThings to remember:\nReconstitution alters an index by adding or deleting securities from it. Reconstitution can have the greatest impact on turnover for securities in\nmarket-cap-weighted indexes, compared with those of equal- and price-weighted indexes, since all securities in the index must be bought and sold\nto maintain each security's proper weight in the index.\nDescribe rebalancing and reconstitution of an index", "qhtml": null}, {"n": 64, "q": "An analyst has gathered the following data about the stocks included in an equal-weighted index with a beginning value of €1,200: Beginning Ending Dividends per Asset price (€) price (€) share (€) X 80 100 1 Y 40 44 2 Z 20 23 1 The price return for the equal-weighted index during the period is closest to: ", "opts": ["16.7%", "19.3%", "20.4%"], "ans": "A", "expl": "An equal-weighted index assigns the same weight to each asset. Since the beginning value of the index is €1,200 and there are three assets,\neach asset is weighted at 1/3 of the total index value: €1,200 ÷ 3 = €400.\nNext, use the asset prices to find the share amounts that equal €400. This is €400 divided by each share price; it is the number of shares that will\ngive each company equal weight in the index at the beginning of the period.\nFind the ending index value by multiplying the ending value of each asset by each asset's number of shares. Finally, calculate the price return of\nthe index by subtracting the beginning price of the index from the ending price, then dividing by the beginning price:\n(Choice B) 19.3% is the result of calculating the price return of the index as if it were price-weighted. However, this question asks for the price\nreturn of the equal-weighted index. If this index were price-weighted, then the initial number of shares of each asset would be the number needed\nto make each asset's weight the ratio of its price to the total prices of the assets in the index. For example, the price weighting of Asset X would\nbe 80/(80 + 40 + 20) = 0.5714, instead of 1/3, the equal weighting.\n(Choice C) 20.4% is the total return, not the price return, of the equal-weighted index. The dividends given in the table above are included in the\ncalculation of the total return of an index but not in its price return calculation.\nThings to remember:\nAn equal-weighted index allocates an equal amount of value to each asset. The price return of any asset is calculated by first subtracting the\nbeginning price from the ending price, then dividing the result by the beginning price. Total return also includes dividends.\nCalculate and analyze the value and return of an index given its weighting method", "qhtml": null}, {"n": 65, "q": "An analyst gathers the following data about an equal-weighted index: Beginning Ending Asset (€) Dividends price price X 10.00 11.00 0.50 Y 8.00 7.00 0.30 Z 5.00 7.00 0.20 The price return of the index is closest to:", "opts": ["7.8%", "12.5%", "16.8%"], "ans": "B", "expl": "Price return of an index is equal to the weighted average of the price returns of each asset in the index. The price return of each asset is the\nchange in price as a percentage of the beginning value; it excludes return from dividends, interest, and other distributions. A total return index\nincludes such income from the asset. To find the price return of any asset, first subtract the beginning price for a period from the ending price of\nthat period. Divide the result by the asset's beginning price. To find the price return of an index, take the weighted average of the price returns of\nthe individual assets in the index. In an equal-weighted index of three securities, the weight of each security is 1/3.\nFind the price return of the index:\nThe S&P 500 is a well-known price index of large capitalization US equities. Changes in its price level are reflective of changes in its component\nstock prices. Its counterpart is the S&P 500 Total Return Index (SPXT). The price level of SPXT indicates both changes in stock prices\ncomprising the index and reinvested income from dividends.\n(Choice A) 7.8% results from incorrectly dividing by P instead of P to find the price return of each asset before solving for the price\ni END i BEGIN\nreturn of the index.\n(Choice C) 16.8% results from incorrectly including income and thus finding the total return of the index. In finding price return, dividends are\nirrelevant.\nThings to remember:\nThe price return of any asset is found by subtracting a period's beginning price from its ending price and dividing that quantity by its beginning\nprice. The price return of an index is the weighted average of the price returns of the individual assets in the index. Dividends, interest, and other\nincome are excluded from price return.\nCalculate and interpret the value price return and total return of an index LOS\n11.A given equity index consists of stocks of consumer durable companies. The companies represented in this index are from different countries\nand include large-, mid-, and small-cap companies. This type of index is most appropriately categorized as a:\nA. style index.\n B. sector index.\nC. broad market index.\nExplanation\nCategories of equity indexes\nMost securities of an entire equity Russell 3000, Wilshire 5000\nBroad market\nmarket (both cover US equities)\nBlends indexes from different countries MSCI All Country World Index\nMulti-market\nProxy for regional or global investing and MSCI EAFE Index\nBased on same sector (eg, finance,\nhealth care)\nCan be different sizes (eg, large cap,\nSector European energy index\nsmall cap) and different styles (ie, value\nvs. growth)\nCan be national, regional, or global\nCan be different sectors\nBased on same size (eg, large cap) or\nStyle Asian large-cap index\nstyle (ie, value vs. growth)\nCan be national, regional, or global\nAn equity index is a collection of stocks based on common criteria such as sector or geographical location. It is intended to indicate the\nperformance of the wider market from which the index is constructed.\nA sector index is composed of companies that operate or compete in the same general type of business, regardless of the companies' size or\ngeographical location. For instance, a large-cap pharmaceutical company in Japan and a small-cap medical supply company in France could both\nbe included in a health care sector index. By contrast, a style index includes companies across sectors with common attributes such as size or\nclassification as a growth or value company. A mid-cap health care company and a mid-cap electricity utility could both be part of the same style\nindex, but not the same sector index (Choice A).\n(Choice C) A broad market index typically includes companies of different sizes and/or sectors. The common element is that the included\ncompanies are from a specific country or region.\nThings to remember:\nAn equity index groups stocks based on common criteria. A sector index consists of companies that operate or compete in the same business.\nThe companies included in a sector index can be different sizes (eg, large-cap vs. small-cap), styles, and/or from different countries or regions.\nDescribe types of equity indexes", "qhtml": null}, {"n": 66, "q": "A given equity index consists of stocks of consumer durable companies. The companies represented in this index are from different countries and include large-, mid-, and small-cap companies. This type of index is most appropriately categorized as a:", "opts": ["style index.", "sector index.", "broad market index."], "ans": "B", "expl": "Categories of equity indexes\nMost securities of an entire equity Russell 3000, Wilshire 5000\nBroad market\nmarket (both cover US equities)\nBlends indexes from different countries MSCI All Country World Index\nMulti-market\nProxy for regional or global investing and MSCI EAFE Index\nBased on same sector (eg, finance,\nhealth care)\nCan be different sizes (eg, large cap,\nSector European energy index\nsmall cap) and different styles (ie, value\nvs. growth)\nCan be national, regional, or global\nCan be different sectors\nBased on same size (eg, large cap) or\nStyle Asian large-cap index\nstyle (ie, value vs. growth)\nCan be national, regional, or global\nAn equity index is a collection of stocks based on common criteria such as sector or geographical location. It is intended to indicate the\nperformance of the wider market from which the index is constructed.\nA sector index is composed of companies that operate or compete in the same general type of business, regardless of the companies' size or\ngeographical location. For instance, a large-cap pharmaceutical company in Japan and a small-cap medical supply company in France could both\nbe included in a health care sector index. By contrast, a style index includes companies across sectors with common attributes such as size or\nclassification as a growth or value company. A mid-cap health care company and a mid-cap electricity utility could both be part of the same style\nindex, but not the same sector index (Choice A).\n(Choice C) A broad market index typically includes companies of different sizes and/or sectors. The common element is that the included\ncompanies are from a specific country or region.\nThings to remember:\nAn equity index groups stocks based on common criteria. A sector index consists of companies that operate or compete in the same business.\nThe companies included in a sector index can be different sizes (eg, large-cap vs. small-cap), styles, and/or from different countries or regions.\nDescribe types of equity indexes", "qhtml": null}, {"n": 67, "q": "Which of the following best describes an aggregate fixed-income index? The index includes:", "opts": ["all bonds outstanding regardless of type, maturity, or credit quality.", "only exchange-traded bonds regardless of type, maturity, or credit quality.", "a representative sample of bonds regardless of type, maturity, or credit quality."], "ans": "C", "expl": "An aggregate index combines securities with disparate characteristics. The index includes a representative market sample of bonds that\nhave a range of geographic focus, type, maturities, and credit ratings. Aggregate indexes can be further refined to create more specialized\nindexes that focus on a subset of the market, such as by type, maturity, or credit quality.\nThe Bloomberg Barclays US Aggregate Bond Index is a widely followed aggregate index that includes roughly 8,000 U.S. issued securities. It\ncombines various bond types and credit ratings that range from Treasury and agency debt to mortgage- and asset-backed securities and\ncorporate bonds.\n(Choice A) Index providers have minimum criteria for determining inclusion in an index and exclude issues that don't meet these requirements\n(eg, minimum issue size).\n(Choice B) The vast majority of bonds trade over the counter (OTC). Including only exchange-traded bonds would severely limit the ability of\nindex providers to accurately represent the selected fixed income universe.\nThings to remember:\nAn aggregate index combines various bond types that range from Treasury and agency debt to mortgage- and asset-backed securities and\ncorporate bonds. The index includes a representative market sample of bonds that have a range of geographic focus, type, maturities, and credit\nratings.\nDescribe types of fixed-income indexes", "qhtml": null}, {"n": 68, "q": "The following market-capitalization-weighted index data is for one year: Beginning Ending Dividends Shares Asset Price (£) Price (£) Per Share (£) Outstanding X 10 14 1 6,000 Y 18 20 2 7,500 Z 22 21 1 10,000 The index's total return for the year is closest to:", "opts": ["hedge funds.", "commodities.", "real estate investment trusts."], "ans": "A", "expl": "Analysts use alternative investment indexes to understand risk and return characteristics based on historical performance. If the assets in the\nindex do not include those that were originally in the index but which performed poorly or failed, the index will be inaccurate and upwardly biased.\nTherefore, the index will report better performance than the assets it represents. This is known as survivorship bias.\nSince hedge funds are only required to report performance to their investors and no one else (ie, they are not required to report to hedge fund\nindexes), funds that perform poorly or fail may not be reflected in index performance, thereby leading to survivorship bias in the index. An\nadditional problem stemming from lax reporting requirements is that differences in the composition of hedge fund indexes precludes their use as\nrepresentatives of the hedge fund asset class.\n(Choices B and C) Commodity indexes are based on publicly traded commodity futures contracts. Real estate investment trust (REIT) indexes\nare made up of publicly traded REIT shares. Since both instruments have reporting requirements, survivorship bias is less likely.\nThings to remember:\nSince hedge funds are required to report only performance to their investors, funds that perform poorly or fail may not report results to the index,\nthereby leading to survivorship bias.\nDescribe indexes representing alternative investments", "qhtml": null}, {"n": 69, "q": "Survivorship bias is most likely a concern when analyzing indexes of:", "opts": ["hedge funds.", "commodities.", "real estate investment trusts."], "ans": "A", "expl": "Analysts use alternative investment indexes to understand risk and return characteristics based on historical performance. If the assets in the\nindex do not include those that were originally in the index but which performed poorly or failed, the index will be inaccurate and upwardly biased.\nTherefore, the index will report better performance than the assets it represents. This is known as survivorship bias.\nSince hedge funds are only required to report performance to their investors and no one else (ie, they are not required to report to hedge fund\nindexes), funds that perform poorly or fail may not be reflected in index performance, thereby leading to survivorship bias in the index. An\nadditional problem stemming from lax reporting requirements is that differences in the composition of hedge fund indexes precludes their use as\nrepresentatives of the hedge fund asset class.\n(Choices B and C) Commodity indexes are based on publicly traded commodity futures contracts. Real estate investment trust (REIT) indexes\nare made up of publicly traded REIT shares. Since both instruments have reporting requirements, survivorship bias is less likely.\nThings to remember:\nSince hedge funds are required to report only performance to their investors, funds that perform poorly or fail may not report results to the index,\nthereby leading to survivorship bias.\nDescribe indexes representing alternative investments", "qhtml": null}, {"n": 70, "q": "An equal-weighted index is constructed using the following three assets: Beginning Ending Asset price (€) price (€) X 120 112 Y 80 86 Z 40 50 The initial value of the index is €1,200. The number of shares of Asset Z initially included in the index is closest to:", "opts": ["5 shares.", "8 shares.", "10 shares."], "ans": "C", "expl": "In an equal-weighted index, each asset is assigned an equal weight of 1/N, at the time of construction and periodically thereafter. N is the\nnumber of assets in the index. In this example, the weight of each asset is 1/3. Since the initial value of the index is €1,200, the value allocated to\neach asset is:\nDivide the value allocated to Asset Z by the price of Asset Z to find the number of shares of the asset in the index:\nAs asset prices change, an equal-weighted index becomes no longer equally weighted. Therefore, a disadvantage of this weighting method is the\nneed for periodic rebalancing. Also, companies with high stock prices may not be given appropriate importance within the index.\n(Choice A) Five shares is the result of finding the number of shares of Asset Z in the index using price weighting instead of equal weighting: €40 ÷\n(€120 + €80 + €40) = 0.1666 × €1,200 = €200 / 40 = 5 shares.\n(Choice B) Eight shares is the result of incorrectly using the ending price for the asset during the time period to determine the number of shares:\n€400 ÷ 50 = 8 shares.\nThings to remember:\nIn an equal weighted index, each asset is assigned an equal weight of 1/N, where N is the number of assets in the index.\nCalculate and interpret the value, price return, and total return of an index", "qhtml": null}, {"n": 71, "q": "A global index includes both growth and value technology stocks, with constituent companies that range in size from small to large cap. This index is best described as a:", "opts": ["style index.", "sector index.", "multimarket index."], "ans": "B", "expl": "Categories of equity indexes\nMost securities of an entire equity Russell 3000, Wilshire 5000\nBroad market\nmarket (both cover US equities)\nBlends indexes from different countries MSCI All Country World Index\nMulti-market\nProxy for regional or global investing and MSCI EAFE Index\nBased on same sector (eg, finance,\nhealth care)\nCan be different sizes (eg, large cap,\nSector European energy index\nsmall cap) and different styles (ie, value\nvs. growth)\nCan be national, regional, or global\nCan be different sectors\nBased on same size (eg, large cap) or\nStyle Asian large-cap index\nstyle (ie, value vs. growth)\nCan be national, regional, or global\nSector indexes are used to track the investment performance of a given sector and may include stocks from a single industry (eg,\nsemiconductors) or a group of related industries (eg, technology: software, hardware, internet). Consequently, sector indexes include all\ncompanies or a representative sample of companies in the sector without regard to size or style (eg, growth, value). Sector funds may be\nstructure
