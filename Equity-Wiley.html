rstanding of the underlying drivers and context that an industry operates\nin. The purpose of the analysis is not only to understand the competitive dynamics but also to recognize the fundamental investment merits of the\nindustry.\nStructural industry attributes can vary dramatically, generating vastly different economic return profiles. Some industries generate consistent\nprofits through an economic cycle whereas other industries struggle to generate economic profits, even during a sustained economic expansion.\nIndustries that are forecasted to generate above-average economic profits over an economic cycle are good candidates for additional investment\nresearch. Economic profit in this context is broadly defined as generating returns above the cost of capital.\n(Choice B) Porter's five forces of strategic industry analysis provide an understanding of the underlying drivers and context in which an industry\noperates and are not directly used in portfolio construction (ie, for their diversification benefits).\n(Choice C) Sector and industry classification schemes are generally a useful starting place for assessing industries, but strategic industry\nanalysis would include a much deeper and more thorough examination of the industry.\nThings to remember:\nStrategic industry analysis provides an understanding of the underlying drivers and context in which an industry operates. Industries that are\nforecasted to generate above average economic profits over an economic cycle are good candidates for additional investment research.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 189, "q": "According to Porter's \"five forces\" analysis, and all else being equal, high switching costs for goods and services are most likely to increase the:", "opts": ["threat of new entrants.", "bargaining power of buyers.", "bargaining power of suppliers."], "ans": "C", "expl": "Porter's Five Forces\nForce Description Factors\nEconomies of scale\nIncreased competition\nBrand loyalty\nThreat of new can lower profits, but\nSwitching costs\nentrants barriers to entry can\nFixed costs\nprotect them\nRegulation\nEase of product\nsubstitution\nBargaining power of Increased input costs Concentration of\nsuppliers lower profit margins suppliers\nCosts to switch\nsuppliers\nCustomer\nBargaining power of Limited prices lower concentration\nbuyers (customers) profit margins Switching costs\nVertical integration\nSimilarities in\nIncreased competition\nfunction\ncan lower sales\nThreat of substitutes Utility of\nquantities and/or\nsubstitutable\nprices\nproducts\nIndustry\nIncreased competition fragmentation\nRivalry among\nlowers prices and Degree of product\nexisting competitors\nprofit margins differentiation\nBarriers to exit\nPorter's \"five forces\" analysis is a key strategic framework for assessing an industry's competitive environment. Favorable competitive\nenvironments may allow existing companies to protect and grow economic profits. Investors can use strategic analysis to identify industries with\nhigh profit potential that might generate a positive return on investment.\nThe level of switching costs impacts several of the forces. High switching costs (eg, mobile phone plan cancellation fees) discourage customers\nfrom canceling existing services (Choice B). Therefore, these costs:\nincrease the bargaining power of suppliers and\ndecrease the bargaining power of buyers (ie, customers).\nIn addition, high switching costs lower the threat of new entrants by making it harder for new companies entering the market to successfully\ndraw existing customers away from competitors (Choice A).\nThings to remember:\nPorter's \"five forces\" analysis is a key strategic framework for assessing an industry's competitive environment. High switching costs impact\nseveral of the forces. Such costs increase the bargaining power of suppliers while decreasing the bargaining power of customers and the threat of\nnew entrants in a market.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 190, "q": "An industry is characterized by excess capacity, frequent price wars, and technological substitutions. This industry is most likely in which of the following life-cycle stages?", "opts": ["Mature", "Decline", "Shakeout"], "ans": "B", "expl": "Industries evolve over time and experience different levels of growth and profitability in each stage of their life cycle. Each stage exhibits different\ncharacteristics that affect the competitive dynamics of an industry, such as level of product demand, intensity of competition, and excess capacity.\nThe decline stage is the last phase in the life cycle and features negative growth, excess capacity, and frequent price wars.\nIn the decline stage, demand shrinks due to technological substitution (eg, consumers stream entertainment digitally instead of physically renting\nDVDs), global competition, and social changes. Lower demand results in excess capacity (ie, potential oversupply), which drives down prices.\nMany companies exit the industry or consolidate with others. The surviving companies wage fierce price wars to maintain market share with a\nshrinking customer base.\nInvestors should consider the relevant industry's life-cycle position prior to investing in a company since it may affect investment returns.\n(Choice A) Companies in a mature industry generally tend to avoid price wars given the oligopolistic nature of the industry. Any price cut from\none company will be met with prompt responses from its competitors, which will result in lower profits for all participants.\n(Choice C) Technological substitutions generally do not occur in the shakeout phase.\nThings to remember:\nThe decline stage is the last phase in the industry life cycle and features negative growth, excess capacity, and increased competition. The\nsurviving companies wage fierce price wars to maintain market share with a shrinking customer base.\nDescribe industry classification methods and compare methods by which companies can be grouped", "qhtml": null}, {"n": 191, "q": "Which of the following is most likely a limitation of grouping companies based on their sensitivity to the business cycle?", "opts": ["Some countries will be in recession while others are expanding", "Certain companies grow revenue during all phases of the business cycle", "Classifications run along a continuum although business cycle sensitivity is discrete"], "ans": "A", "expl": "Limitations of applying business cycle sensitivity analysis to global industries\nEconomic performance can vary significantly across countries and regions\nIndustry classification schemes are relative descriptions along a continuum\nInvestors sometimes group companies based on the relative sensitivity of their revenues and profits to the business cycle. However, such\ngroupings have limitations, especially for companies with operations in multiple countries or regions. Two of the primary limitations of business\ncycle sensitivity classification are:\nPhases of the business cycle occur at different times in different countries. Therefore, a multinational company may be exposed\nsimultaneously to different phases (eg, economic expansion in one country, recession in another). For that reason, creating an industry\nbenchmark of combined company financials to measure business cycle sensitivity would be misleading.\nThe classification labels are discrete (cyclical or noncyclical), but not all companies exhibit the same degree of revenue and profit fluctuation\nin response to business cycle changes. Instead, sensitivity runs along a continuum. For example, some cyclical industries may face larger\nrevenue and profit variations than others with the same label (Choice C).\n(Choice B) Although certain companies grow revenue during all phases of the business cycle, this is not a limitation of the groupings since it does\nnot affect the sensitivity of a company's revenue and profits to the cycle. For example, both cyclical and noncyclical companies can be considered\ngrowth companies.\nThings to remember:\nInvestors sometimes group companies based on the sensitivity of their revenues and profits to the business cycle. One factor limiting such\ngroupings is the exposure of multinational companies to different phases of the business cycle occurring simultaneously in countries where they\nhave operations (eg, economic expansion in one country, recession in another).\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 192, "q": "Which of the following is the most appropriate conclusion regarding industry growth categorization?", "opts": ["Defensive companies typically experience modest revenue growth even during recessions.", "Companies within the same industry may have differing growth and cyclicality characteristics.", "Investors that agree on a company's degree of cyclicality will typically have similar valuations."], "ans": "B", "expl": "One common approach to the categorization of industry growth is a matrix that identifies companies by their pace of growth and sensitivity to\nthe business cycle (ie, cyclicality).\nFor pace of growth, industries are broken into:\nGrowth industries, which have not fully penetrated their addressable market and therefore have growth factors specific to both the\nindustry and the overall market\nMature industries, which have saturated their market and are growing at the same pace as the economy or even declining (eg,\nwhen companies that have developed substitutes take market share)\nFor cyclicality, industries are broken into:\nCyclical industries, which are highly sensitive to the business cycle\nDefensive industries, which are less sensitive to the business cycle\nOne drawback of this categorization system is that a company operating within an industry may not be categorized the same as that industry or\nother companies within it. For instance, a new entrant into a mature, defensive industry may have faster growth and more cyclicality than its\nestablished competitors.\n(Choice A) Although defensive companies are less sensitive to business cycles, they are usually still affected by slowdowns in spending.\nTherefore, even defensive companies' revenues often decline during recessions.\n(Choice C) Investors who agree on a company's degree of cyclicality can still value the company differently if they have different expectations\nregarding the severity and length of the business cycle.\nThings to remember:\nOne common approach to the categorization of industry growth is a matrix that identifies companies by their pace of growth and sensitivity to the\nbusiness cycle. One drawback of this categorization system is that a company operating within an industry may not be categorized the same as\nthe industry or other companies operating within it.\nDetermine an industry’s size, growth characteristics, profitability, and market share trends", "qhtml": null}, {"n": 193, "q": "An industry that is in the mature life-cycle stage most likely exhibits:", "opts": ["low barriers to entry.", "interdependence among companies.", "growth rates significantly higher than GDP growth."], "ans": "B", "expl": "Industries evolve over time and experience different levels of growth and profitability in each stage of their life cycle. Each stage exhibits different\ncharacteristics that affect the competitive dynamics of an industry, such as level of product demand, intensity of competition, and excess capacity.\nThe mature phase is characterized by minimal growth, high barriers to entry, and interdependence among companies.\nA mature industry experiences very low growth due to market saturation. Any growth is attributed to population growth or product replacements.\nMany companies consolidate within the industry, which results in higher barriers to entry. The major industry players are aware of their\ninterdependence and avoid price wars since any price change may trigger a strong response from competitors.\n(Choice A) Barriers to entry are typically high during the mature life-cycle stage due to heavy industry concentration. The presence of dominating\nfirms makes entry difficult for new companies.\n(Choice C) There is little to no growth in a mature industry. Overall industry growth rate is driven by replacement demand or population growth\n(which is close to GDP growth rate).\nThings to remember:\nThe mature phase is characterized by minimal growth, high barriers to entry, and interdependence among companies. Many companies\nconsolidate within this phase, leading to oligopolies.\nDescribe industry classification methods and compare methods by which companies can be grouped", "qhtml": null}, {"n": 194, "q": "An incumbent company with strong pricing power is most likely to be in an industry that exhibits a:", "opts": ["low degree of industry concentration and stable market share.", "high degree of industry concentration and stable market share.", "high degree of industry concentration and unstable market share."], "ans": "B", "expl": "Investors use strategic industry analysis to understand and assess the competitiveness of an industry. Strategic industry analysis includes\nanalyzing the following:\nBarriers to entry: how easy it is for new competitors to enter the industry\nConcentration: number of players in an industry and their relative market shares\nCapacity: quantity of goods or services that can be delivered based on existing investment compared with industry demand\nMarket share stability: degree of fluctuation in competitors' market shares\nStrong pricing power for incumbents is most associated (with exceptions) with industries that exhibit greater barriers to entry, high industry\nconcentration, limited industry capacity, and stable market share distribution.\nIn highly concentrated industries (eg, soft drinks), competitors typically are better able to coordinate pricing movements and have more to lose\nthan gain from price competition. Stable market share distribution typically indicates that competitors have differentiated products or \"sticky\"\ncustomer bases due to brand loyalty or high customer switching costs (eg, wireless telecom carriers). This allows competitors to maintain prices.\n(Choice A) Industries with low degrees of industry concentration typically have fierce competition (especially among smaller firms looking to gain\nmarket shares), which weakens incumbents' pricing power.\n(Choice C) Unstable market shares typically indicate low customer switching costs, which force incumbents to match competitors' prices, or a\nhigh threat of new entrants with technological advantages. These qualities weaken incumbents' pricing power.\nThings to remember:\nInvestors use strategic industry analysis to understand and assess the competitiveness of an industry. Greater pricing power for incumbents is\nmost associated with industries with greater barriers to entry, high industry concentration, low industry capacity, and stable market shares.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE frameworks", "qhtml": null}, {"n": 195, "q": "Which of the following would most effectively support execution of a differentiation strategy?", "opts": ["Closer proximity to customers", "Using higher-quality materials", "Gaining cheaper access to raw materials"], "ans": "B", "expl": "Means of executing strategy\nCost leadership Differentiation Focus\nReducing costs below competitors' Making products stand out from competitors' Concentrating on a section of the market\nEconomies of scale Advertising, brand, customer service Proximity to customers\nEconomies of scope Trademarks, patents, copyrights Knowledge of customer needs\nCulture of cost control Superior quality Focus on market niche\nLow-cost supply chain Unique features or integration\nPremium pricing\nCustomer experience\nCompanies can utilize one, or several, strategies to grow their business and generate economic profit. Companies with successful strategies\ntend to outperform those without. Three common strategies, based on Michael Porter's research, are:\nCost leadership\nDifferentiation\nFocus\nThe differentiation strategy involves a company making its products or services stand out from those of its competitors in the broad market.\nThere are many ways for companies to accomplish this. One is investing more heavily into the product or service itself. A company that uses\nhigher-quality materials for its product will stand out from its peers in the market. The goal is for consumers to associate the company with\nsuperior products and unique features.\n(Choice A) Closer proximity to customers provides focus on a niche of customers, but this strategy would not necessarily differentiate the product\nor service at a broad level and is therefore more accurately associated with the focus strategy.\n(Choice C) Gaining access to cheaper raw materials would allow a company to reduce its costs, but this strategy would not necessarily\ndifferentiate the product or service and is therefore more accurately associated with the cost-leadership strategy.\nThings to remember:\nThe differentiation strategy involves a company making its products or services stand out from those of its competitors in the broad market. Using\nhigher-quality materials than peers is one method of differentiation that will help a company stand out from peers.\nEvaluate the competitive strategy and position of a company", "qhtml": null}, {"n": 196, "q": "With regard to forming an appropriate equity peer group, which of the following statements is most accurate?", "opts": ["Standard industry classification systems are adequate.", "Named competitors in an annual report are an important consideration.", "Total revenue, operating margins, and debt levels are the most important considerations."], "ans": "B", "expl": "A peer group is a collection of companies with similar business activities and economics, making their equity valuation comparable.\nIdeally, a company's peer group should consist only of companies with similar business models, who share similar customer demand drivers, cost\nstructures, and access to capital. Companies that share these attributes provide a good basis for comparing equity valuations of peer group\nmembers.\nAnalysts can find management's comments in the annual report. The commentary may provide valuable insight into the competitive environment\nor industry dynamics. It is an essential step in the process of constructing a peer group.\n(Choice A) A common starting place for peer group creation is the various standard industry classification systems (eg, GICS, RGS, ICB), but\nconstructing a well-defined peer group for equity valuation requires further analysis.\n(Choice C) Although total revenue, operating margins, and debt levels are important considerations, information regarding business models and\nthe drivers of economic performance is necessary for making an informed judgment on peer group inclusion.\nThings to remember:\nA peer group is a collection of companies with similar business activities and economics, making their equity valuation comparable. Companies\nthat share similar business characteristics provide a good basis for comparing equity valuations of peer group members.\nDescribe industry classification methods and compare methods by which companies can be grouped", "qhtml": null}, {"n": 197, "q": "Which of the following is least likely a major approach to industry classification?", "opts": ["Statistical similarities", "Geographical concentration", "Products and/or services supplied"], "ans": "B", "expl": "Industry classification approaches allow analysts to group companies based on similar factors. The three major classification methodologies are\ndescribed in the table below:\nGeographical concentration is not one of the three major approaches. Companies that operate within the same geographical area may sell very\ndifferent products and have different business cycle sensitivities. Therefore, grouping those companies together will not allow for appropriate\ncomparison.\nThings to remember:\nIndustry classification approaches allow analysts to group companies based on similar factors. The three major classification methodologies are\nproducts/services supplied, business cycle sensitivities, and statistical similarities.\nDescribe industry classification methods and compare methods by which companies can be grouped", "qhtml": null}, {"n": 198, "q": "A company declares a one-time 10% stock dividend to shareholders of record on a stock that trades at CHF 20. All else being equal, on the ex- dividend date the most likely impact of the dividend on the stock price is that it:", "opts": ["remains unchanged.", "decreases by CHF 2.", "decreases by CHF 1.82."], "ans": "C", "expl": "Stock dividends are more like stock splits than they are like traditional cash dividends. Stock dividends are paid to shareholders in the form of\nadditional shares and shares outstanding increase proportionally for all shareholders, just as in a stock split. The market value of the company\nremains the same while the number of shares increases; therefore, the share price drops to reflect the increased number of shares.\nFor example, a company has 100 shares outstanding and the stock trades at CHF 20, giving it a market value of CHF 2,000. A 10% stock\ndividend would increase shares outstanding to 110, while the total market value has not changed (eg, CHF 2,000). The stock is now valued at\n2,000 / 110 = 18.18, a decrease of CHF 1.82.\n(Choice A) The stock price must reflect the additional shares that have been issued and adjust accordingly.\n(Choice B) This answer would have been correct had it been a CHF 2 cash dividend. It might seem intuitive that a 10% stock dividend would\ncause the stock to decline by CHF 2 (eg, 10% of CHF 20), but the increase in shares outstanding needs to be accounted for to arrive at the correct\nmarket impact.\nThings to remember:\nStock dividends are more like stock splits than they are like traditional cash dividends. While the number of shares increases, the share price\ndrops to reflect the increased number of shares, therefore having no effect on overall market valuation.\nDescribe regular cash dividends, extra dividends, stock dividends, stock splits, reverse stock splits, and share repurchases", "qhtml": null}, {"n": 199, "q": "As a result of the relationship between the Gordon growth model and the justified forward price-to-earnings ratio, all else being equal, an increase in the justified forward P/E most likely indicates a(n): ", "opts": ["change in the dividend payout ratio.", "increase in the required rate of return.", "decrease in the long-term growth rate."], "ans": "A", "expl": "The price-to-earnings (P/E) ratio is equal to stock price divided by earnings per share. Trailing P/E uses past earnings, whereas forward P/E is\nbased on future earnings. Justified forward P/E uses earnings based on a predictive model such as the Gordon growth model (GGM). Analysts\nuse the justified forward P/E to compare companies and draw conclusions about stock prices.\nThe relationship between justified forward P/E and the GGM implies that an increase in the dividend payout ratio results in a higher forward P/E.\nHowever, a relationship also exists between the dividend payout ratio and the long-term dividend growth rate:\nThis indicates that the dividend payout ratio is also inversely related to the long-term growth rate, which is directly related to the forward justified\nP/E ratio. This reflects the fact that earnings paid out as dividends cannot be reinvested into the company to fuel future growth.\nAs a result, care must be taken when trying to understand the effect of a change in the dividend payout ratio on the P/E ratio. The dividend payout\nratio is both directly and inversely related to the P/E ratio. Either influence may predominate in a given situation. Therefore, if the dividend payout\nratio increases, then justified forward P/E may increase or decrease—depending on the scenario.\nThe relationship between justified forward P/E ratio and the Gordon growth model implies that if the growth rate increases, the P/E ratio increases\n(ie, they are directly related). An increase in the required rate of return implies a lower justified forward P/E (ie, they are inversely related)\n(Choices B and C).\n3.An analyst has gathered the following information about a company's stock:\nAccording to the two-stage dividend discount model, the amount of the dividend at the end of the first year of the long-term growth stage is closest\nto:\n A. €1.23\nB. €1.26\nC. €1.30\nExplanation\nThe two-stage dividend discount model is used to find the value of a company expected to have high growth (short-term) followed by lower growth\n(long-term). The high-growth stage is assumed to last for n years followed by an infinite long-term growth stage:\nThe dividend in the first year of the long-term growth stage, D = D , is a component in estimating the intrinsic value of the stock, since it is\nn+1 4\nused to calculate the terminal value of the first stage. D is found by first multiplying D (€1.00) by (1 + g )3 to account for three years of dividend\n4 0 S\ngrowth during the high-growth stage and then multiplying by (1 + g ) to account for one year of dividend growth during the long-term growth stage.\nL\nSubstitute values into the formula for D to calculate D :\nn+1 4\nThe required rate of return is used to calculate the present value of future dividends, not to calculate the dividends themselves.\n(Choice B) €1.26 results from multiplying D by (1 + g )4: €1 × (1.06)4 = €1.26. The dividend increases by the short-term growth rate (6%) only\n0 S\nduring the high-growth period (Years 1-3 on stock) is\ncalculated as follows:\nIn this example, the company's market capitalization (ie, its market value of common stock) is HKD 86,940 million. Therefore, given the EV of a\ncompany, calculate its market capitalization by subtracting the market value of preferred stock and debt, then adding the value of cash\nequivalents and short-term investments (Choices A and C).\nThings to remember:\nEnterprise value (EV) is the sum of the company's market capitalization, market value of preferred stock, and market value of debt, minus cash\nequivalents and short-term investments. Given the EV of a company, calculate the market value of its common stock by subtracting the market\nvalue of preferred stock and debt, then adding the value of cash equivalents and short-term investments.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 200, "q": "An analyst has gathered the following information about a company's stock: According to the two-stage dividend discount model, the amount of the dividend at the end of the first year of the long-term growth stage is closest to:", "opts": ["€1.23", "€1.26", "€1.30"], "ans": "A", "expl": "The two-stage dividend discount model is used to find the value of a company expected to have high growth (short-term) followed by lower growth\n(long-term). The high-growth stage is assumed to last for n years followed by an infinite long-term growth stage:\nThe dividend in the first year of the long-term growth stage, D = D , is a component in estimating the intrinsic value of the stock, since it is\nn+1 4\nused to calculate the terminal value of the first stage. D is found by first multiplying D (€1.00) by (1 + g )3 to account for three years of dividend\n4 0 S\ngrowth during the high-growth stage and then multiplying by (1 + g ) to account for one year of dividend growth during the long-term growth stage.\nL\nSubstitute values into the formula for D to calculate D :\nn+1 4\nThe required rate of return is used to calculate the present value of future dividends, not to calculate the dividends themselves.\n(Choice B) €1.26 results from multiplying D by (1 + g )4: €1 × (1.06)4 = €1.26. The dividend increases by the short-term growth rate (6%) only\n0 S\nduring the high-growth period (Years 1-3). In Year 4, the dividend grows at the long-term growth rate of 3%.\n(Choice C) €1.30 results from multiplying D by (1 + g )4(1 +g ): €1 × (1.06)4(1.03) = €1.30. The short-term growth rate applies for Years 1-3. In\n0 S L\nYear 4, the dividend grows at the long-term growth rate of 3%.\nThings to remember:\nIn the two-stage dividend discount model, the dividend at the end of the first year of the long-term growth stage (second stage) is D = D (1 +\nn+1 0\ng )n(1 + g ). The dividend D is a component in estimating the intrinsic value of the security, used in calculating the year n value of the long-term\nS L n+1\ngrowth stage.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model as appropriate LOS\n4.An analyst has estimated the enterprise value of a firm and wants to calculate the market value of its common equity. The analyst would most\nappropriately:\nA. add the market value of preferred stock and debt and subtract cash equivalents and short-term investments.\n B. subtract the market value of preferred stock and debt and add cash equivalents and short-term investments.\nC. subtract the market value of preferred stock and debt and subtract cash equivalents and short-term investments.\nExplanation\nEnterprise value (EV) is a way of viewing the total value of an enterprise, including debt and equity. EV can be used to value a firm's equity, by\nbeginning with the value of both debt and equity. EV is described as the total takeover cost of a company since it represents the total cost an\nacquirer would pay for the company's equity and debt, minus cash equivalents and short-term investments.\nSuppose a company's EV is HKD 101,000 million, its market value of debt is HKD 14,000 million, its market value of preferred stock is HKD 70\nmillion, and its cash and short-term investments are HKD 10 million. The market capitalization (ie, the market value of common stock) is\ncalculated as follows:\nIn this example, the company's market capitalization (ie, its market value of common stock) is HKD 86,940 million. Therefore, given the EV of a\ncompany, calculate its market capitalization by subtracting the market value of preferred stock and debt, then adding the value of cash\nequivalents and short-term investments (Choices A and C).\nThings to remember:\nEnterprise value (EV) is the sum of the company's market capitalization, market value of preferred stock, and market value of debt, minus cash\nequivalents and short-term investments. Given the EV of a company, calculate the market value of its common stock by subtracting the market\nvalue of preferred stock and debt, then adding the value of cash equivalents and short-term investments.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 201, "q": "An analyst has estimated the enterprise value of a firm and wants to calculate the market value of its common equity. The analyst would most appropriately:", "opts": ["add the market value of preferred stock and debt and subtract cash equivalents and short-term investments.", "subtract the market value of preferred stock and debt and add cash equivalents and short-term investments.", "subtract the market value of preferred stock and debt and subtract cash equivalents and short-term investments."], "ans": "B", "expl": "Enterprise value (EV) is a way of viewing the total value of an enterprise, including debt and equity. EV can be used to value a firm's equity, by\nbeginning with the value of both debt and equity. EV is described as the total takeover cost of a company since it represents the total cost an\nacquirer would pay for the company's equity and debt, minus cash equivalents and short-term investments.\nSuppose a company's EV is HKD 101,000 million, its market value of debt is HKD 14,000 million, its market value of preferred stock is HKD 70\nmillion, and its cash and short-term investments are HKD 10 million. The market capitalization (ie, the market value of common stock) is\ncalculated as follows:\nIn this example, the company's market capitalization (ie, its market value of common stock) is HKD 86,940 million. Therefore, given the EV of a\ncompany, calculate its market capitalization by subtracting the market value of preferred stock and debt, then adding the value of cash\nequivalents and short-term investments (Choices A and C).\nThings to remember:\nEnterprise value (EV) is the sum of the company's market capitalization, market value of preferred stock, and market value of debt, minus cash\nequivalents and short-term investments. Given the EV of a company, calculate the market value of its common stock by subtracting the market\nvalue of preferred stock and debt, then adding the value of cash equivalents and short-term investments.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 202, "q": "An analyst gathers the following information about the common stock of a mature company with a stable growth pattern. The company's dividend growth is expected to be constant for an indefinite time period. Most recent dividend €0.95 Required rate of return 9% Dividend payout ratio 53% Beta 1.10 Return on equity 7% The intrinsic value of the stock is closest to:", "opts": ["€16.64", "€17.18", "€18.62"], "ans": "B", "expl": "The Gordon growth model (GGM) is used to estimate the intrinsic value of a stock. The GGM assumes the company has steady growth in\nearnings, resulting in a constant dividend growth rate (g). Dividend discount models, such as the GGM, are present value models that use\nfuture dividends as inputs to determine a stock's current value.\nThe constant dividend growth rate can be estimated as the earnings retention ratio (b) multiplied by the return on equity (ROE):\nROE is a measure of return on shareholder equity. The earnings retention ratio, b, indicates how much of that return is reinvested in the\nbusiness. Thus, the constant dividend growth rate gives an estimate of future growth of earnings and dividends based on reinvested shareholder\nreturn. Substitute values to calculate stock intrinsic value (V ):\n0\nThings to remember:\nThe Gordon growth model is used for stock valuation when growth is constant. Intrinsic value is the next period dividend divided by the difference\nbetween the required return and the growth rate. The constant dividend growth rate is the product of the earnings retention rate and return on\nequity.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate\n6.A company's noncallable, nonconvertible preferred stock pays dividends of $5 per share and has a required rate of return of 8%. If the required\nrate of return decreases to 7.5%, then the value of the preferred stock would most likely:\n\nA. increase by $4.17 per share.\nB. decrease by $4.17 per share.\nC. change to $4.65 per share.\nExplanation\nat at\n(r = 8.0%) (r = 7.5%)\nDividend (D ) 5.00 5.00\n0\n÷ Discount rate (r) 0.08 0.075\n= Value (V ) 62.50 66.67\n0\nΔV = 66.67 − 62.50 = $4.17\n0\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash flows are forever the same, preferred stock is valued\nas a perpetuity and its present value is calculated using the perpetuity formula, that is, by dividing the dividend payment by the required rate of\nreturn.\n(Choice B) The value of the stock increased, not decreased, by $4.17.\n(Choice C) $4.65 results from dividing $5 by (1 + 7.5%).\nThings to remember:\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash flows are forever the same, preferred stock is valued\nas a perpetuity and its present value is calculated using the perpetuity formula, that is, by dividing the dividend payment by the required rate of\nreturn.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 203, "q": "A company's noncallable, nonconvertible preferred stock pays dividends of $5 per share and has a required rate of return of 8%. If the required rate of return decreases to 7.5%, then the value of the preferred stock would most likely: ", "opts": ["increase by $4.17 per share.", "decrease by $4.17 per share.", "change to $4.65 per share."], "ans": "A", "expl": "at at\n(r = 8.0%) (r = 7.5%)\nDividend (D ) 5.00 5.00\n0\n÷ Discount rate (r) 0.08 0.075\n= Value (V ) 62.50 66.67\n0\nΔV = 66.67 − 62.50 = $4.17\n0\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash flows are forever the same, preferred stock is valued\nas a perpetuity and its present value is calculated using the perpetuity formula, that is, by dividing the dividend payment by the required rate of\nreturn.\n(Choice B) The value of the stock increased, not decreased, by $4.17.\n(Choice C) $4.65 results from dividing $5 by (1 + 7.5%).\nThings to remember:\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash flows are forever the same, preferred stock is valued\nas a perpetuity and its present value is calculated using the perpetuity formula, that is, by dividing the dividend payment by the required rate of\nreturn.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 204, "q": "An analyst gathers the following data about two companies: Compared with Company X, Company Y most likely has a:", "opts": ["higher trailing P/E and justified forward P/E.", "higher trailing P/E and lower justified forward P/E.", "lower trailing P/E and higher justified forward P/E."], "ans": "B", "expl": "The P/E ratio has different forms: trailing P/E, forward P/E (prospective or leading P/E), and justified forward P/E. Trailing P/E is based on past\nearnings and forward P/E on future earnings. If the forward earnings estimate is based on a model used to estimate future company\nfundamentals or cash flows, the ratio is referred to as justified forward P/E.\nForward multiples allow analysts to predict and compare potential future prices of companies' stock. The justified forward P/E ratio, derived from\nthe Gordon growth model, allows analysts to do such comparisons based on a projected value of future earnings.\nValues should be substituted into the formulas for trailing P/E and justified forward P/E for each company:\nBased on these calculations, Company Y has a higher trailing P/E ratio and lower justified forward P/E ratio than Company X.\nThings to remember:\nThe trailing P/E ratio is calculated as the current market price divided by past earnings: P /E . The forward P/E ratio is the current market price\n0 0\ndivided by future earnings: P /E . The justified forward P/E ratio is the dividend payout ratio divided by the difference between the required rate of\n0 1\nreturn and the long-term dividend growth rate: P /E = p ÷ (r - g).\n0 1\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 205, "q": "An analyst gathers the following data on a company whose dividend growth rate is expected to be constant indefinitely: Current market price £61.03 Last dividend paid £2.74 Required rate of return 8.0% Weighted average cost of capital 7.6% Assuming the stock is fairly valued, its long-term growth rate is closest to:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "B", "expl": "Security's market price vs. intrinsic value\nOvervalued Market price >> intrinsic value\nFairly valued Market price ≈ intrinsic value\nUndervalued Market price << intrinsic value\nInvestors use equity valuation models to estimate a security's intrinsic (ie, fundamental) value and to identify market mispricing that can be used to\ngenerate enhanced returns. Greater returns may be achieved by buying undervalued securities and selling overvalued securities. Securities are\nundervalued when trading at market prices below their intrinsic value and vice versa.\nDefining under- and overvalued is straightforward. Unfortunately, accurately estimating intrinsic value is very difficult. Many valuation model\ninputs are difficult to estimate accurately (eg, growth rate of cash flow for present value models, next year's earnings for multiplier models).\nConsequently, equity prices need to differ substantially from intrinsic value estimates before concluding a stock is undervalued or\novervalued. It is difficult to conclude a security is mispriced if trading within 1–2% of intrinsic value estimates.\nIn this scenario, the stock's market price differs by less than 1% from the nearer end of the estimated range of values from each valuation model.\nSince the current price of the common stock is between the range of estimated intrinsic values from the two models, the most reasonable\nconclusion is that the security is fairly valued (Choices A and C).\nThings to remember:\nSecurities are undervalued when trading at market prices below their intrinsic value and overvalued when trading at prices above intrinsic value.\nWhen a stock's price does not differ substantially from estimates of intrinsic value and is between the estimates from different models, the most\nreasonable conclusion is that the security is fairly valued.\nEvaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or undervalued by the market", "qhtml": null}, {"n": 206, "q": "An investor evaluates a common stock using two valuation models: A free-cash-flow-to-equity model estimates the intrinsic value at 158–161. An earnings multiple model estimates intrinsic value at 163–167. If the stock is currently trading at 162, the investor's most appropriate conclusion is that the stock is:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "B", "expl": "Security's market price vs. intrinsic value\nOvervalued Market price >> intrinsic value\nFairly valued Market price ≈ intrinsic value\nUndervalued Market price << intrinsic value\nInvestors use equity valuation models to estimate a security's intrinsic (ie, fundamental) value and to identify market mispricing that can be used to\ngenerate enhanced returns. Greater returns may be achieved by buying undervalued securities and selling overvalued securities. Securities are\nundervalued when trading at market prices below their intrinsic value and vice versa.\nDefining under- and overvalued is straightforward. Unfortunately, accurately estimating intrinsic value is very difficult. Many valuation model\ninputs are difficult to estimate accurately (eg, growth rate of cash flow for present value models, next year's earnings for multiplier models).\nConsequently, equity prices need to differ substantially from intrinsic value estimates before concluding a stock is undervalued or\novervalued. It is difficult to conclude a security is mispriced if trading within 1–2% of intrinsic value estimates.\nIn this scenario, the stock's market price differs by less than 1% from the nearer end of the estimated range of values from each valuation model.\nSince the current price of the common stock is between the range of estimated intrinsic values from the two models, the most reasonable\nconclusion is that the security is fairly valued (Choices A and C).\nThings to remember:\nSecurities are undervalued when trading at market prices below their intrinsic value and overvalued when trading at prices above intrinsic value.\nWhen a stock's price does not differ substantially from estimates of intrinsic value and is between the estimates from different models, the most\nreasonable conclusion is that the security is fairly valued.\nEvaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or undervalued by the market", "qhtml": null}, {"n": 207, "q": "An analyst has gathered the following information about a company's stock: According to the Gordon growth model, the company's justified price-to-earnings ratio implies its stock's value is closest to:", "opts": ["SGD 10", "SGD 20", "SGD 30"], "ans": "B", "expl": "The price-to-earnings (P/E) ratio is used mainly in three different forms: trailing P/E, forward P/E ratio (prospective or leading P/E), and justified\nforward P/E ratio. Trailing P/E uses past earnings, whereas forward P/E is based on future earnings. If the forward earnings estimate is based on\nsome predictive model involving company fundamentals or cash flows, the ratio is referred to as justified forward P/E.\nIn this scenario, first calculate the dividend payout ratio p = (1 − earnings retention ratio) = (1 − 0.60) = 0.40. Substitute next year's earnings (E ),\n1\ndividend payout ratio (p), required rate of return (r), and the long-term growth rate (g), into the formula for the forward justified P/E ratio to\ncalculate the current value of the stock implied by the justified forward P/E:\nThe derivation of the justified forward P/E ratio from the Gordon growth model includes the assumption that the stock's price is assumed to be\nequal to its value in this model. The weighted average cost of capital is not used in this calculation.\n(Choice A) SGD 10 is incorrect. The forward justified P/E ratio of the stock is 10, and its price is SGD 20.\n(Choice C) SGD 30 results from using the earnings retention ratio instead of the dividend payout ratio in the numerator.\nThings to remember:\nThe justified forward price-to-earnings (P/E) ratio is equal to the dividend payout ratio divided by the difference between the required rate of return\nand the long-term growth rate. The dividend payout ratio divided by the difference between the required rate of return and the long-term growth\nrate and then multiplied by next year's earnings results in the stock's current price (and value).\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 208, "q": "An analyst determines that all companies in a universe of widely followed global large-cap stocks are significantly undervalued. The most appropriate next step would be to:", "opts": ["buy all these undervalued stocks in client portfolios.", "buy only the most undervalued stocks in client portfolios.", "review the forecasts and assumptions used in the models."], "ans": "C", "expl": "When faced with an intrinsic value estimate that is significantly different from the market price, the most appropriate next step is to reassess and\nconfirm confidence in the model's inputs before acting.\nComparing a model's valuation estimate with the market price to determine whether a stock is over- or undervalued seems straightforward, but\nthere are nuances to consider (eg, degree of confidence in the model's inputs and assumptions, whether the mispricing will converge over a\nsuitable investment horizon). In the quest to identify and exploit market mispricing, analysts can become overconfident in the output of their\nvaluation models (Choices A and B).\nIn this case, the facts strongly suggest a problem with the model's output. Stocks that are widely followed and well known to market participants\n(eg, large-cap stocks), and trade in different markets around the world (eg, global stocks), are unlikely to be simultaneously and universally\nundervalued.\nThings to remember:\nWhen faced with an intrinsic value estimate that is significantly different than the market price, the most appropriate next step is to reassess and\nconfirm confidence in the model's inputs before acting.\nEvaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or undervalued by the market", "qhtml": null}, {"n": 209, "q": "When using enterprise value to estimate a company's market value of common equity, an analyst has difficulty finding quotes for the market value of the company's long-term bonds. The market value of company debt is best estimated using the: ", "opts": ["market quotes of similar bonds.", "bonds' cash flows discounted by 3-month LIBOR.", "value of the bonds on the company's balance sheet."], "ans": "A", "expl": "Enterprise value (EV) can be used to estimate the value of a company's equity. A critical input for its use is the market value of the company's\ndebt, which is ideally calculated using market quotations for the company's bonds. If obtaining market quotes for the company's bonds is\nproblematic, the market value of debt is most appropriately estimated using available quotes for bonds with similar characteristics (eg,\ncredit, sector, maturity) that are currently trading in the market.\n(Choice B) Although the bonds' intrinsic value can be viewed as the present value of future cash flows, the 3-month LIBOR rate is a short-term\nrate and, therefore, would be inappropriate for such a calculation.\n(Choice C) Using the value of the bonds on a company's balance sheet (eg, book value of bonds) is an inaccurate way to estimate the market\nvalue of the company's debt. Over time, interest rates change and the market perception of the company's credit risk will also change. These two\nfactors may cause the book value of the bonds to differ significantly from their market value.\nThings to remember:\nEnterprise value can be used to estimate the market value of a company's common equity. If obtaining market quotes for a company's bonds is\nproblematic, the market value of company debt is most appropriately estimated using available quotes for bonds with similar characteristics that\nare currently trading in the market.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 210, "q": "Which of the following best describes the impacts of a reverse stock split on share prices and on the market value of a company's equity?", "opts": ["Higher price per share and greater market value of equity", "Lower price per share and unchanged market value of equity", "Higher price per share and unchanged market value of equity"], "ans": "C", "expl": "A reverse split is a corporate action in which a company cancels a portion of its outstanding shares. For example, in a 1-for-5 reverse split, 4/5\nof the outstanding shares are canceled: For every 5 shares outstanding before the split, only 1 share remains. All common equity holders\nexperience the same proportional reduction in the number of shares. A shareholder with 200 shares before the split has only 40 shares after the\nsplit.\nThe split has no impact on the metrics that affect company value (eg, expected earnings, forecasted free cash flow to equity), so the market\nvalue of the outstanding equity is unchanged. Since the reverse split results in a smaller number of shares representing the ownership of the\ncompany, the price per share must increase (Choices A and B).\nReverse splits are often used to address low share prices, which may have some negative impacts. Very low prices are often associated with\nspeculative companies, and many stock exchanges have listing requirements that specify a minimum share price.\nThings to remember:\nIn a reverse split, a company cancels a portion of its outstanding shares. However, the split has no impact on the metrics that affect company\nvalue such as expected earnings or cash flow, so the market value of the equity is unchanged. Since a smaller number of shares represent\nownership of the company, the price per share must increase.\nDescribe regular cash dividends, extra dividends, stock dividends, stock splits, reverse stock splits, and share repurchases", "qhtml": null}, {"n": 211, "q": "All else being equal, the impact of a share repurchase on shareholders' wealth is most likely similar to the impact of:", "opts": ["cash dividends.", "stock dividends.", "reverse stock splits."], "ans": "A", "expl": "Both cash dividends and share repurchases (ie, buybacks) entail money distributions to shareholders. Cash dividends are payments to every\nshareholder of an equal dividend for each share owned. Share repurchases are cash payments going only to those shareholders selling shares\nto the company.\nDespite the different patterns of cash distributions, the economic impact of cash dividends and share repurchases on shareholders' wealth is\nsimilar. In either case, the total market value of the outstanding shares (ie, market capitalization) should decline by the amount of cash\ndistributed. For cash dividends, that will result in a lower price per share. For stock repurchases, the result is an unchanged share price but a\nsmaller number of shares outstanding.\n(Choices B and C) Stock dividends and reverse splits leave a company's market capitalization unchanged. In either case, the number of shares\noutstanding changes but there is an offsetting proportional change in the share price, resulting in no change in market capitalization. This\ncontrasts with cash dividends and share repurchases, which reduce market capitalization by the amount of cash expended.\nThings to remember:\nThe economic impact of cash dividends and stock repurchases on shareholders' wealth is similar: The total market value of the outstanding shares\n(ie, market capitalization) should decline by the amount of cash distributed. In contrast, stock dividends and reverse splits leave a company's\nmarket capitalization unchanged.\nDescribe regular cash dividends, extra dividends, stock dividends, stock splits, reverse stock splits, and share repurchases", "qhtml": null}, {"n": 212, "q": "The long-term growth stage of the two-stage dividend discount model is most appropriately valued using the:", "opts": ["Gordon growth model.", "capital asset pricing model.", "free cash flow to equity model."], "ans": "A", "expl": "The two-stage dividend discount model (two-stage DDM) is used to find the value of a company expected to have high growth (short term),\nfollowed by lower constant growth (long term). The high growth stage is assumed to last for a certain number of (n) years, followed by an infinite\nlong-term growth stage.\nIn the two-stage DDM, the Gordon growth model (GGM) is used to find the value of the second stage, which has constant dividend growth. The\nGGM value of the long-term growth stage is used as the terminal value input for valuation of the high growth stage. The value is discounted\nback to the present using the required rate of return (r) and added to the present value of the first (high growth) stage to find the security's intrinsic\nvalue.\n(Choice B) The capital asset pricing model (CAPM) is not a dividend discount model and is used to find the expected return of a security, not its\ncurrent intrinsic value. The CAPM can be used to find the required rate of return, a variable of the two-stage DDM.\n(Choice C) The free cash flow to equity (FCFE) model is based on free cash flows and not dividends, so FCFE would not be used in the two\nstage dividend discount model.\nThings to remember:\nThe two-stage dividend discount model (two-stage DDM) is used to find the intrinsic value of a company expected to grow at a high rate, followed\nby a stage of constant, sustainable long-term growth. The Gordon growth model is used within the two-stage DDM to estimate the value, as of the\nend of the high growth stage, of dividends from the long-term growth stage.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 213, "q": "A company issued retractable term preferred shares on June 30, 20X1, with the following characteristics: Selected Data Par value, per share $25.00 Dividend yield at issuance 6.0% Dividend payments Annually on June 30 Retraction date June 30, 20X8 Maturity date June 30, 20X9 On July 1, 20X5, an analyst trying to value these shares assumes that the retraction feature will be exercised at par on June 30, 20X8, and that the required rate of return is 7.5%. The analyst's most appropriate conclusion is that the intrinsic value ($) per share is closest to:", "opts": ["23.74", "24.00", "25.00"], "ans": "B", "expl": "Retractable term preferred shares (RTPS) are a special type of preferred stock. Preferred stock is typically viewed and valued as a perpetuity.\nConversely, RTPS have a maturity date, are often callable, and always include a retraction provision (ie, put provision). The retraction provision\nallows the investor to \"put\" (ie, sell) the preferred shares back to the issuer at a predetermined price and time.\nThe intrinsic value of a RTPS is equal to the present value of its dividend stream plus the present value of the expected final principal payment,\nwhich could occur on a call date, a retraction date, or at maturity.\nTo determine the intrinsic value in this instance, the initial dividend yield must be converted into a cash value. The initial yield of 6% based on a\n$25 par value equals an annual dividend of $25 × 0.06 = $1.50. Therefore, intrinsic value is calculated using the dividends from 20X6 through\n20X8 and the par value at the retraction date (ie, 20X8), discounted by the required rate of return:\nBased on the intrinsic value calculation, the shares are fairly valued at approximately $24.00.\n(Choice A) $23.74 is the intrinsic value of the shares if valued to maturity, not to the retraction date.\n(Choice C) $25.00 is the undiscounted par value whether using either the retraction date or maturity date.\nThings to remember:\nRetractable term preferred shares are a special type of preferred stock that have an embedded put provision, allowing the investor to \"put\" the\nshares back to the issuer at a predetermined price and time.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 214, "q": "An analyst using the method of comparables is concerned about business cycle effects on price multiples. To address this concern, the analyst would most appropriately use the: ", "opts": ["price-to-sales ratio.", "earnings per share.", "price-to-earnings ratio."], "ans": "A", "expl": "The most common way that analysts compare and report on price multiples is the method of comparables. The analysts compare the price\nmultiple of a company stock with that of a benchmark (ie, a similar company stock or average). If the price multiple of the stock is\nlower than the benchmark, then the stock is considered to be undervalued,\nthe same as the benchmark, then the stock is considered to be fairly valued,\nhigher than the benchmark, then the stock is considered to be overvalued.\nThe price-to-earnings (P/E) ratio is commonly used for this type of comparison. However, in this scenario, the analyst is concerned that business\ncycle fluctuations might distort the comparison results. Since earnings are very sensitive to changes in the business cycle, the P/E ratio\nduring periods of high growth or economic downturn might take on extreme values that do not reflect the company's long-term value (Choice C).\nAn appropriate alternative to using P/E to make comparisons is to use the price-to-sales (P/S) ratio instead. Although the P/S ratio is affected by\neconomic boom and recession, the effect is not as pronounced as with the P/E ratio since earnings are more heavily influenced than sales by fixed\noperating and financial costs.\n(Choice B) The analyst wants to compare price multiples; earnings per share is not a price multiple. Earnings per share is also highly sensitive to\nchanges in the business cycle and therefore would not be a good alternative to the P/E ratio in this scenario.\nThings to remember:\nThe price-to-sales ratio can be used as an alternative to the price-to-earnings (P/E) ratio if there are concerns about earnings values caused by\nfluctuations in the business cycle and distorting P/E ratio comparisons.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 215, "q": "Which of the following statements is most accurate concerning an asset-based valuation model?", "opts": ["It derives a firm's equity value from the book value of assets and liabilities.", "It is appropriate for valuing firms with significant proportions of working capital.", "It is appropriate for valuing firms with significant proportions of intangible assets."], "ans": "B", "expl": "Equity represents the claim that shareholders have on a firm's net assets after accounting for liabilities. Companies report assets and liabilities at\nbook value, which may not always reflect current market conditions. Therefore, it is important for analysts to adjust book values to market (fair)\nvalues when valuing a company.\nThe short-term (one year or less) nature of current assets and liabilities (ie, working capital) makes them easy to value since market prices are\nlikely to be close to their book values. As such, it is often appropriate to apply asset-based valuation to a firm that holds a large percentage of\nworking capital (relative to total assets). Conversely, it is difficult to value firms with large proportions of noncurrent assets (eg, equipment), since\nbook values can differ drastically from market values.\n(Choice A) Under asset-based valuation, a firm's equity value is approximated from the market value, not the book value, of assets and liabilities.\n(Choice C) Intangible assets (eg, goodwill, patents) are usually hard to measure and company specific. Therefore, it is difficult to obtain market\nprices as proxies.\nThings to remember:\nAsset-based valuation models derive a firm's equity value by subtracting the market (fair) value of liabilities from the market value of assets.\nDescribe asset-based valuation models and their use in estimating equity value", "qhtml": null}, {"n": 216, "q": "The best rationale for matching EBITDA with enterprise value (EV) in the EV/EBITDA ratio is that EBITDA:", "opts": ["is a proxy for free cash flow to equity.", "indicates cash flow to pay all financial stakeholders.", "excludes all noncash expenses and noncash revenues."], "ans": "B", "expl": "EBITDA is considered a rough proxy for operating cash flow available to pay interest, dividends, and taxes. Thus, it is a measure of a company's\nability to support the claims of all financial stakeholders. Enterprise value (EV) is a comprehensive way of assessing the value of a company,\nby looking at the market value of the entire enterprise, including preferred stock, common stock, and debt.\nThe EV/EBITDA ratio of firms may be compared as an alternative to the more common practice of comparing firms' P/E ratios. The P/E ratio has\nthe disadvantage that earnings may be negative. EBITDA is usually positive.\nThe P/E ratio is used to compare the market value of the shareholder claim (the stock price) with the earnings that are generated for their benefit.\nSimilarly, EBITDA is used with EV since EV is a measure of the firm's entire debt and equity value and EBITDA is a rough measure of cash flow\navailable to all financial stakeholders. Therefore, EV aligns with EBITDA in the same way that price aligns with earnings.\n(Choice A) EBITDA is a measure of a firm's financial resources available for common equity, preferred equity, and debt holders, not a measure of\ncash flow exclusively available to equity.\n(Choice C) EBITDA is earnings before depreciation, amortization, or taxes but it does not exclude all noncash expenses and revenues.\nThings to remember:\nEBITDA is considered a rough proxy for operating cash flow available to pay interest, dividends, and taxes, and therefore is a measure of the\nresources available to financial stakeholders. The EV/EBITDA ratio of firms may be compared as an alternative to comparing firms' P/E ratios.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 217, "q": "An analyst gathers the following information about the common stock of a mature company for which dividend growth is expected to be constant for an indefinite period. Selected Data Current market price €48.53 Last dividend paid €1.65 Required rate of return 6.5% Long-term dividend growth rate 3.1% Long-term economic growth rate 2.9% Based on this information, the stock is most likely: ", "opts": ["Company X", "Company Y", "Company Z"], "ans": "B", "expl": "The method of comparables can be used in two ways. Comparing one asset's price multiple to its historical average (ie, benchmark) over multiple\nyears is called time-series analysis. Comparing the price multiples of several similar assets over the same time period is called cross-sectional\nanalysis. If the price multiple of the asset is\nless than the benchmark, it is considered undervalued\nnearly equal to the benchmark, it is considered fairly valued\ngreater than the benchmark, it is considered overvalued.\nIn this scenario, there are three price multiples under consideration: price-to-earnings (P/E), price-to-book (P/B), and price-to-sales (P/S). Since\nonly one year is given, time-series analysis is not an option; therefore, cross-sectional analysis is appropriate. Company Y's P/B is the same as\nthe average P/B for the three companies. However, Company Y's P/E and P/S are below the average P/E and P/S for all three companies.\nTherefore, Company Y is considered undervalued.\n(Choice A) Company X's P/B is virtually the same as the average of all three companies. Its P/E and P/S are well over the three companies'\naverage, so Company X would be considered overvalued.\n(Choice C) Company Z's P/E is above the companies' average, its P/S is the same as the average, and its P/B is below the average. Therefore,\nit would be inappropriate to conclude that Company Z is undervalued.\nThings to remember:\nIn cross-sectional analysis, an asset's price multiples are compared with the average multiples of other similar assets for the same time period. If\na price multiple is less than, greater than, or nearly equal to its benchmark, it is considered undervalued, overvalued, or fairly valued, respectively.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 218, "q": "An analyst gathered the following price multiples: The analyst will most appropriately conclude that which of the following companies is undervalued?", "opts": ["Company X", "Company Y", "Company Z"], "ans": "B", "expl": "The method of comparables can be used in two ways. Comparing one asset's price multiple to its historical average (ie, benchmark) over multiple\nyears is called time-series analysis. Comparing the price multiples of several similar assets over the same time period is called cross-sectional\nanalysis. If the price multiple of the asset is\nless than the benchmark, it is considered undervalued\nnearly equal to the benchmark, it is considered fairly valued\ngreater than the benchmark, it is considered overvalued.\nIn this scenario, there are three price multiples under consideration: price-to-earnings (P/E), price-to-book (P/B), and price-to-sales (P/S). Since\nonly one year is given, time-series analysis is not an option; therefore, cross-sectional analysis is appropriate. Company Y's P/B is the same as\nthe average P/B for the three companies. However, Company Y's P/E and P/S are below the average P/E and P/S for all three companies.\nTherefore, Company Y is considered undervalued.\n(Choice A) Company X's P/B is virtually the same as the average of all three companies. Its P/E and P/S are well over the three companies'\naverage, so Company X would be considered overvalued.\n(Choice C) Company Z's P/E is above the companies' average, its P/S is the same as the average, and its P/B is below the average. Therefore,\nit would be inappropriate to conclude that Company Z is undervalued.\nThings to remember:\nIn cross-sectional analysis, an asset's price multiples are compared with the average multiples of other similar assets for the same time period. If\na price multiple is less than, greater than, or nearly equal to its benchmark, it is considered undervalued, overvalued, or fairly valued, respectively.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 219, "q": "An analyst gathers the following information related to a company's stock: Current annual dividend per share €1.00 Annual dividend growth rate for Years 1–3 6% Annual dividend growth rate for Years 4+ 2% Required rate of return 10% If the stock is fairly valued, then the terminal value at the end of Year 3 using the two-stage dividend discount model is closest to:", "opts": ["€14.20", "€14.89", "€15.19"], "ans": "C", "expl": "The two-stage dividend growth model is used to determine the intrinsic value of the stock of a company that is expected to experience a period of\nhigh, short-term dividend growth followed by lower long-term growth. The stock's intrinsic value is the sum of the present values of dividends from\nboth stages.\nThe terminal value represents the stock's intrinsic value at the end of the short-term, high-growth stage. At that point, the dividend is expected\nto grow at a lower rate over a period expected to continue indefinitely. The terminal value can be calculated using the Gordon growth model since\nthat model is appropriate for a stock with expected constant dividend growth.\nIn this scenario, the terminal value is the value at the end of Year 3, when the long-term growth stage begins. First, calculate the dividend at the\nend of Year 3 using the short-term growth rate of 6% since the dividend grows at the higher rate up to that point. Then, the terminal value is\ncalculated using the lower, long-term growth rate of 2%:\nThings to remember:\nIn the two-stage dividend growth model, a stock's intrinsic value is the sum of the present values of dividends from both a short-term, high-growth\nstage and a subsequent, long-term stage of lower growth. The terminal value represents the intrinsic value at the beginning of the second stage,\nwhich is expected to continue indefinitely. The Gordon growth model, which is appropriate for a stock with an expected constant growth rate, can\nbe used to determine the terminal value.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate\n23.An analyst has collected the following data for a noncallable, nonconvertible preferred stock:\nSelected Data\nPar value SAR 25.00\nMarket value SAR 24.56\nPreferred stock dividend rate 5.6%\nRequired rate of return 5.7%\nBased on this information, the stock is most likely:\nA. undervalued.\n\nB. fairly valued.\nC. overvalued.\nExplanation\nLike other equities, the intrinsic value of a preferred stock is the present value of all its future dividends. The model for determining the\nintrinsic value of a preferred stock assumes that dividends remain the same and continue indefinitely. As a result, the value of a preferred stock is\ncalculated as the value of a perpetuity, where the perpetuity's future payments are the preferred stock's dividends:\nIntrinsic value is equal to the annual dividend divided by the required rate of return (ie, the prevailing market rate).\nThe dividend is the product of the preferred dividend rate and the par value.\nIn this scenario, the last preferred dividend is calculated by multiplying the par value by the preferred dividend rate (25 × 0.056 = 1.4). Substitute\nvalues into the preferred stock valuation model to calculate the intrinsic value:\nSince the intrinsic value is equal to the market value (after rounding to two decimal places), the preferred stock is considered fairly valued.\n(Choice A) Determining the stock is undervalued is the result of incorrectly reversing the required rate of return and the preferred stock dividend\nrate in the calculation.\n(Choice C) Concluding that the stock is overvalued results from using the market value, rather than the par value, to determine the dividend used\nto calculate intrinsic value.\nThings to remember:\nThe model for determining the intrinsic value of a preferred stock assumes that dividends remain the same and continue indefinitely. As a result,\nthe intrinsic value of a preferred stock is calculated as the value of a perpetuity, where the perpetuity's future payments are the preferred stock's\ndividends. If intrinsic value is equal to market value, the preferred stock is considered fairly valued.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 220, "q": "An analyst has collected the following data for a noncallable, nonconvertible preferred stock: Selected Data Par value SAR 25.00 Market value SAR 24.56 Preferred stock dividend rate 5.6% Required rate of return 5.7% Based on this information, the stock is most likely:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "B", "expl": "Like other equities, the intrinsic value of a preferred stock is the present value of all its future dividends. The model for determining the\nintrinsic value of a preferred stock assumes that dividends remain the same and continue indefinitely. As a result, the value of a preferred stock is\ncalculated as the value of a perpetuity, where the perpetuity's future payments are the preferred stock's dividends:\nIntrinsic value is equal to the annual dividend divided by the required rate of return (ie, the prevailing market rate).\nThe dividend is the product of the preferred dividend rate and the par value.\nIn this scenario, the last preferred dividend is calculated by multiplying the par value by the preferred dividend rate (25 × 0.056 = 1.4). Substitute\nvalues into the preferred stock valuation model to calculate the intrinsic value:\nSince the intrinsic value is equal to the market value (after rounding to two decimal places), the preferred stock is considered fairly valued.\n(Choice A) Determining the stock is undervalued is the result of incorrectly reversing the required rate of return and the preferred stock dividend\nrate in the calculation.\n(Choice C) Concluding that the stock is overvalued results from using the market value, rather than the par value, to determine the dividend used\nto calculate intrinsic value.\nThings to remember:\nThe model for determining the intrinsic value of a preferred stock assumes that dividends remain the same and continue indefinitely. As a result,\nthe intrinsic value of a preferred stock is calculated as the value of a perpetuity, where the perpetuity's future payments are the preferred stock's\ndividends. If intrinsic value is equal to market value, the preferred stock is considered fairly valued.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 221, "q": "In valuing equities, a disadvantage of using the method of comparables with price multiples is most likely that it:", "opts": ["may be unnecessarily complex.", "does not work well for industry analysis.", "is impacted by choice of accounting methods."], "ans": "C", "expl": "The comparables (comps) method is the most common way to compare and report on price multiples. The analyst compares a price multiple of a\ncompany stock to that of a benchmark (ie, similar company stock, industry average). If the price multiple of the stock is lower, higher, or the same\nas the benchmark, then the stock is considered undervalued, overvalued, or fairly valued, respectively.\nThere are disadvantages to the comps method. Results can be inconsistent with other types of models (eg, present value, asset-based). Also,\nfactors that decrease comparability, such as economic fluctuations and choice of accounting methods, may distort comparisons. For\nexample, companies have flexibility on the timing and amount of expenses they recognize, which can potentially impact income statement items\nand therefore price multiples.\nUsing comps to make valuation decisions also has advantages. The data needed to construct price multiples and make comparisons are publicly\navailable, and the method is easily used and widely understood. Compared with other valuation methods, use of comps is relatively simple and\nallows for relative comparisons between companies. It is particularly suited to comparing companies in the same industry (Choices A and B).\nThings to remember:\nDisadvantages of the comparables method include potential distortion by economic fluctuations, factors that diminish comparability, and results\nthat may be inconsistent with other types of models.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 222, "q": "An advantage of using the justified forward P/E ratio in valuation of a company's equity is that it most likely:", "opts": ["provides a way to compare companies in the future.", "does not require estimating future company values or cash flows.", "can be reliably compared to trailing price multiples of other companies."], "ans": "A", "expl": "Price-to-earnings (P/E) ratios\nTrailing P/E Forward P/E Justified forward P/E\nJustified by future flows\nNumerator Current price\n(free cash flow, dividends)\nDenominator Past earnings Future earnings Future earnings\nA price multiple is the ratio of a company's stock price to another fundamental value or cash flow. One such multiple is the price-to-earnings ratio\n(P/E ratio), which is equal to the company's stock price divided by its earnings per share. For example, if a company's earnings per share is CNY\n2 and the stock price is CNY 40, the P/E ratio is 40 / 2 = 20.\nThe P/E ratio is used in mainly three different forms: trailing P/E, forward P/E ratio (ie, prospective or leading P/E), and justified forward P/E.\nTrailing P/E uses past earnings. An obvious drawback of using trailing P/E is that it fails to consider a company's future earnings.\nForward P/E is based on future earnings. If the forward P/E ratio estimate is based on a model of future company fundamentals or cash flows, the\nratio is referred to as justified forward P/E. Using a justified forward multiple allows comparison of company price multiples in the future.\n(Choice B) Justified forward P/E requires estimating future earnings growth using a predictive model, such as the Gordon growth model.\n(Choice C) Justified forward P/E is based on an estimate of future earnings, whereas trailing P/E is based on past or recent earnings. For this\nreason, the leading P/E of one company should not be compared with the trailing P/E of another company, as this will produce misleading\nconclusions.\nThings to remember:\nThe P/E ratio is equal to a company's stock price divided by its earnings per share. The trailing P/E ratio uses recent earnings, and the forward\nP/E ratio uses future earnings. The trailing P/E of one company should not be compared with the forward P/E of another company. The justified\nforward P/E ratio is a way to compare companies in the future based
