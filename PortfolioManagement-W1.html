 null}, {"n": 2, "q": "An analyst researches a portfolio that holds two securities, Stock A and Stock B, and collects the following data: Expected Standard Asset Deviation (σ) Weights Stock A 0.17 0.25 Stock B 0.08 0.75 The analyst determines that the correlation coefficient (ρ) between Stock A and Stock B is 0.65. The expected variance of the portfolio is closest to: ", "opts": ["combines the risk-free asset and the optimal risky portfolio.", "lends the optimal risky portfolio and buys the risk-free asset.", "borrows the risk-free asset and buys the global minimum variance portfolio."], "ans": "A", "expl": "Portfolio C is the optimal investor portfolio with the same risk as the global minimum variance portfolio. The capital allocation line (CAL)\nrepresents risky portfolios constructed from buying the optimal risky portfolio and either lending or borrowing the risk-free asset. The\noptimal risky portfolio is on the efficient frontier at the tangency point where a straight line, originating from the risk-free rate, touches the efficient\nfrontier.\nPortfolio A has the same risk as Portfolio C but is suboptimal since its return is lower than Portfolio C's. This is true for all portfolios below the CAL\nline at each level of risk.\nTo create portfolios with lower risk than the optimal risk portfolio, buy the optimal risky portfolio and the risk-free asset. Buying the risk-free asset\nis equivalent to lending at the risk-free rate. To create portfolios with risk higher than the optimal risky portfolio, borrow (leverage) at the risk-free\nrate and invest more than 100% of the investment (original investment + proceeds from borrowing) in the optimal risky portfolio.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line\n5.An analyst calculates the following correlations among three stocks:\nStock Return (%) X Y Z\nX 3.50 1.00\nY 3.50 0.00 1.00\nZ 3.50 −0.20 0.33 1.00\nIf the stocks are paired to form equally weighted portfolios, which pair of stocks would most likely demonstrate the benefit from diversification?\nA. X and Y\nB. Y and Z\n\nC. X and Z\nExplanation\nFor a two-asset portfolio, the correlation between the returns of the two assets indicates the diversification benefit (ie, risk reduction) from\nholding the portfolio. If a two-stock portfolio holds assets that are not perfectly positive correlated (ie, ρ ≠ 1), the expected standard deviation of\nthe portfolio's return will be less than the expected standard deviation of the return for either stock. Since standard deviation measures risk,\nthe diversification provided by combining the two assets reduces risk.\nThat benefit increases as correlations decrease. Negative correlations provide the greatest benefit since prices are moving in opposite\ndirections. Positive correlations provide a smaller benefit since prices move together but to a lesser extent than when they are perfectly\ncorrelated (ie, ρ = 1).\nIn this case, Stocks X and Z have negative correlation. A portfolio consisting of these two stocks would have the greatest diversification benefit\nsince their prices would generally move in opposite directions.\n(Choice A) Stocks X and Y have a correlation of zero, so a price change in Stock X would not indicate how Stock Y is expected to move (or vice\nversa). Combining these two stocks provides a diversification benefit since their prices do not move together, but holding stocks with negative\ncorrelation in a portfolio provides greater diversification benefit and less risk.\n(Choice B) Stocks Y and Z have both the greatest and the only positive correlation among the three pairs. Therefore, a portfolio consisting of\nthese two stocks would result in less diversification benefit than a portfolio combining either stock with Stock X.\nThings to remember:\nA portfolio's diversification benefit can be measured using correlation. Holding assets with negative correlations results in a portfolio with greater\ndiversification benefit.\nCalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based on historical data", "qhtml": null}, {"n": 3, "q": "An analyst researches a portfolio that holds two stocks, Stock A and Stock B. The following data is collected: Expected Standard Asset Deviation (σ) Weights Stock A 0.25 0.80 Stock B 0.20 0.20 If the portfolio's expected standard deviation is 0.22, then the covariance between Stock A and Stock B is closest to: ", "opts": ["combines the risk-free asset and the optimal risky portfolio.", "lends the optimal risky portfolio and buys the risk-free asset.", "borrows the risk-free asset and buys the global minimum variance portfolio."], "ans": "A", "expl": "Portfolio C is the optimal investor portfolio with the same risk as the global minimum variance portfolio. The capital allocation line (CAL)\nrepresents risky portfolios constructed from buying the optimal risky portfolio and either lending or borrowing the risk-free asset. The\noptimal risky portfolio is on the efficient frontier at the tangency point where a straight line, originating from the risk-free rate, touches the efficient\nfrontier.\nPortfolio A has the same risk as Portfolio C but is suboptimal since its return is lower than Portfolio C's. This is true for all portfolios below the CAL\nline at each level of risk.\nTo create portfolios with lower risk than the optimal risk portfolio, buy the optimal risky portfolio and the risk-free asset. Buying the risk-free asset\nis equivalent to lending at the risk-free rate. To create portfolios with risk higher than the optimal risky portfolio, borrow (leverage) at the risk-free\nrate and invest more than 100% of the investment (original investment + proceeds from borrowing) in the optimal risky portfolio.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line\n5.An analyst calculates the following correlations among three stocks:\nStock Return (%) X Y Z\nX 3.50 1.00\nY 3.50 0.00 1.00\nZ 3.50 −0.20 0.33 1.00\nIf the stocks are paired to form equally weighted portfolios, which pair of stocks would most likely demonstrate the benefit from diversification?\nA. X and Y\nB. Y and Z\n\nC. X and Z\nExplanation\nFor a two-asset portfolio, the correlation between the returns of the two assets indicates the diversification benefit (ie, risk reduction) from\nholding the portfolio. If a two-stock portfolio holds assets that are not perfectly positive correlated (ie, ρ ≠ 1), the expected standard deviation of\nthe portfolio's return will be less than the expected standard deviation of the return for either stock. Since standard deviation measures risk,\nthe diversification provided by combining the two assets reduces risk.\nThat benefit increases as correlations decrease. Negative correlations provide the greatest benefit since prices are moving in opposite\ndirections. Positive correlations provide a smaller benefit since prices move together but to a lesser extent than when they are perfectly\ncorrelated (ie, ρ = 1).\nIn this case, Stocks X and Z have negative correlation. A portfolio consisting of these two stocks would have the greatest diversification benefit\nsince their prices would generally move in opposite directions.\n(Choice A) Stocks X and Y have a correlation of zero, so a price change in Stock X would not indicate how Stock Y is expected to move (or vice\nversa). Combining these two stocks provides a diversification benefit since their prices do not move together, but holding stocks with negative\ncorrelation in a portfolio provides greater diversification benefit and less risk.\n(Choice B) Stocks Y and Z have both the greatest and the only positive correlation among the three pairs. Therefore, a portfolio consisting of\nthese two stocks would result in less diversification benefit than a portfolio combining either stock with Stock X.\nThings to remember:\nA portfolio's diversification benefit can be measured using correlation. Holding assets with negative correlations results in a portfolio with greater\ndiversification benefit.\nCalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based on historical data", "qhtml": null}, {"n": 4, "q": "If an investor wants a portfolio with the highest return possible and the same risk as the global minimum variance portfolio, then the investor most appropriately: ", "opts": ["combines the risk-free asset and the optimal risky portfolio.", "lends the optimal risky portfolio and buys the risk-free asset.", "borrows the risk-free asset and buys the global minimum variance portfolio."], "ans": "A", "expl": "Portfolio C is the optimal investor portfolio with the same risk as the global minimum variance portfolio. The capital allocation line (CAL)\nrepresents risky portfolios constructed from buying the optimal risky portfolio and either lending or borrowing the risk-free asset. The\noptimal risky portfolio is on the efficient frontier at the tangency point where a straight line, originating from the risk-free rate, touches the efficient\nfrontier.\nPortfolio A has the same risk as Portfolio C but is suboptimal since its return is lower than Portfolio C's. This is true for all portfolios below the CAL\nline at each level of risk.\nTo create portfolios with lower risk than the optimal risk portfolio, buy the optimal risky portfolio and the risk-free asset. Buying the risk-free asset\nis equivalent to lending at the risk-free rate. To create portfolios with risk higher than the optimal risky portfolio, borrow (leverage) at the risk-free\nrate and invest more than 100% of the investment (original investment + proceeds from borrowing) in the optimal risky portfolio.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line\n5.An analyst calculates the following correlations among three stocks:\nStock Return (%) X Y Z\nX 3.50 1.00\nY 3.50 0.00 1.00\nZ 3.50 −0.20 0.33 1.00\nIf the stocks are paired to form equally weighted portfolios, which pair of stocks would most likely demonstrate the benefit from diversification?\nA. X and Y\nB. Y and Z\n\nC. X and Z\nExplanation\nFor a two-asset portfolio, the correlation between the returns of the two assets indicates the diversification benefit (ie, risk reduction) from\nholding the portfolio. If a two-stock portfolio holds assets that are not perfectly positive correlated (ie, ρ ≠ 1), the expected standard deviation of\nthe portfolio's return will be less than the expected standard deviation of the return for either stock. Since standard deviation measures risk,\nthe diversification provided by combining the two assets reduces risk.\nThat benefit increases as correlations decrease. Negative correlations provide the greatest benefit since prices are moving in opposite\ndirections. Positive correlations provide a smaller benefit since prices move together but to a lesser extent than when they are perfectly\ncorrelated (ie, ρ = 1).\nIn this case, Stocks X and Z have negative correlation. A portfolio consisting of these two stocks would have the greatest diversification benefit\nsince their prices would generally move in opposite directions.\n(Choice A) Stocks X and Y have a correlation of zero, so a price change in Stock X would not indicate how Stock Y is expected to move (or vice\nversa). Combining these two stocks provides a diversification benefit since their prices do not move together, but holding stocks with negative\ncorrelation in a portfolio provides greater diversification benefit and less risk.\n(Choice B) Stocks Y and Z have both the greatest and the only positive correlation among the three pairs. Therefore, a portfolio consisting of\nthese two stocks would result in less diversification benefit than a portfolio combining either stock with Stock X.\nThings to remember:\nA portfolio's diversification benefit can be measured using correlation. Holding assets with negative correlations results in a portfolio with greater\ndiversification benefit.\nCalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based on historical data", "qhtml": null}, {"n": 5, "q": "An analyst calculates the following correlations among three stocks: Stock Return (%) X Y Z X 3.50 1.00 Y 3.50 0.00 1.00 Z 3.50 −0.20 0.33 1.00 If the stocks are paired to form equally weighted portfolios, which pair of stocks would most likely demonstrate the benefit from diversification?", "opts": ["X and Y", "Y and Z", "X and Z"], "ans": "C", "expl": "For a two-asset portfolio, the correlation between the returns of the two assets indicates the diversification benefit (ie, risk reduction) from\nholding the portfolio. If a two-stock portfolio holds assets that are not perfectly positive correlated (ie, ρ ≠ 1), the expected standard deviation of\nthe portfolio's return will be less than the expected standard deviation of the return for either stock. Since standard deviation measures risk,\nthe diversification provided by combining the two assets reduces risk.\nThat benefit increases as correlations decrease. Negative correlations provide the greatest benefit since prices are moving in opposite\ndirections. Positive correlations provide a smaller benefit since prices move together but to a lesser extent than when they are perfectly\ncorrelated (ie, ρ = 1).\nIn this case, Stocks X and Z have negative correlation. A portfolio consisting of these two stocks would have the greatest diversification benefit\nsince their prices would generally move in opposite directions.\n(Choice A) Stocks X and Y have a correlation of zero, so a price change in Stock X would not indicate how Stock Y is expected to move (or vice\nversa). Combining these two stocks provides a diversification benefit since their prices do not move together, but holding stocks with negative\ncorrelation in a portfolio provides greater diversification benefit and less risk.\n(Choice B) Stocks Y and Z have both the greatest and the only positive correlation among the three pairs. Therefore, a portfolio consisting of\nthese two stocks would result in less diversification benefit than a portfolio combining either stock with Stock X.\nThings to remember:\nA portfolio's diversification benefit can be measured using correlation. Holding assets with negative correlations results in a portfolio with greater\ndiversification benefit.\nCalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based on historical data", "qhtml": null}, {"n": 6, "q": "A portfolio manager buys only two stocks, Stock X and Stock Y, for a new portfolio. The manager determines that the correlation coefficient between Stock X and Stock Y is 0.35. The manager also compiles the following investment statistics: Expected standard Asset deviation (σ) weights Stock X 0.25 0.60 Stock Y 0.15 0.40 The expected standard deviation of the portfolio is closest to: ", "opts": ["optimal risky portfolio with the lowest level of risk aversion.", "optimal investor portfolio with the highest level of risk aversion.", "global minimum variance portfolio with the highest level of risk aversion."], "ans": "B", "expl": "The dominant capital allocation line (CAL) represents portfolios that hold a combination of the optimal risky portfolio (ORP) and the risk-free\nasset. The ORP is the portfolio on the efficient frontier at the point of tangency where a straight line originating from the risk-free rate touches the\nefficient frontier. All portfolios on the CAL dominate all other attainable portfolios at the same level of risk.\nIndifference curves represent theoretical portfolios with different levels of risk and return but the same utility. Since the portfolios have the same\ninvestor utility, an investor would be indifferent to any portfolio on the indifference curve. For each level of risk aversion, there is a unique\nindifference curve. The only achievable portfolio is where the indifference curve meets the CAL.\nThe point of tangency of the investor's indifference curve and the CAL represents the optimal investor portfolio. Each investor's indifference\ncurve touches the CAL at different points. Each of these points is each investor's optimal portfolio. The investor with the highest level of risk\naversion has the portfolio with the lowest expected return.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line LOS\n8.The following diagram shows indifference curves for a single investor:\nIt is most likely that for this investor, Investment:\nA. Y has greater utility than Investment X.\nB. Z has greater utility than Investment X.\n\nC. Y has greater utility than Investment Z.\nExplanation\nUtility is the amount of satisfaction or happiness an investor derives from a combination of risk and return (ie, risk-return pair), represented in this\nscenario as an investment. An indifference curve represents all the investments that have the same amount of utility for a given investor; the\ninvestor is indifferent when choosing between them.\nThe investor's set of indifference curves includes plots of a utility function, in this case U = E(R) − ½ Aσ2, with different levels of utility (U)\ncorresponding to each curve; E(R) is expected return, A is risk aversion, and σ is standard deviation (ie, risk). A given investor has the:\nSame utility for points on the same curve\nDifferent utilities for points on different curves\nGreater utility for points on a higher curve\nA higher curve (ie, more to the \"northwest\" of the graph) represents greater utility than a lower curve (ie, more to the \"southeast\") since it\nrepresents more return for the same risk at a corresponding point on the lower curve. In this scenario, Investment Y has a greater utility for the\ninvestor than Investment Z since Investment Y is on a higher curve than Investment Z. This is described in detail here.\nExplain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 7, "q": "Two investors with different levels of risk aversion have different portfolios on the capital allocation line. Of these two portfolios, the portfolio with the lower expected return is most likely the:", "opts": ["optimal risky portfolio with the lowest level of risk aversion.", "optimal investor portfolio with the highest level of risk aversion.", "global minimum variance portfolio with the highest level of risk aversion."], "ans": "B", "expl": "The dominant capital allocation line (CAL) represents portfolios that hold a combination of the optimal risky portfolio (ORP) and the risk-free\nasset. The ORP is the portfolio on the efficient frontier at the point of tangency where a straight line originating from the risk-free rate touches the\nefficient frontier. All portfolios on the CAL dominate all other attainable portfolios at the same level of risk.\nIndifference curves represent theoretical portfolios with different levels of risk and return but the same utility. Since the portfolios have the same\ninvestor utility, an investor would be indifferent to any portfolio on the indifference curve. For each level of risk aversion, there is a unique\nindifference curve. The only achievable portfolio is where the indifference curve meets the CAL.\nThe point of tangency of the investor's indifference curve and the CAL represents the optimal investor portfolio. Each investor's indifference\ncurve touches the CAL at different points. Each of these points is each investor's optimal portfolio. The investor with the highest level of risk\naversion has the portfolio with the lowest expected return.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line LOS\n8.The following diagram shows indifference curves for a single investor:\nIt is most likely that for this investor, Investment:\nA. Y has greater utility than Investment X.\nB. Z has greater utility than Investment X.\n\nC. Y has greater utility than Investment Z.\nExplanation\nUtility is the amount of satisfaction or happiness an investor derives from a combination of risk and return (ie, risk-return pair), represented in this\nscenario as an investment. An indifference curve represents all the investments that have the same amount of utility for a given investor; the\ninvestor is indifferent when choosing between them.\nThe investor's set of indifference curves includes plots of a utility function, in this case U = E(R) − ½ Aσ2, with different levels of utility (U)\ncorresponding to each curve; E(R) is expected return, A is risk aversion, and σ is standard deviation (ie, risk). A given investor has the:\nSame utility for points on the same curve\nDifferent utilities for points on different curves\nGreater utility for points on a higher curve\nA higher curve (ie, more to the \"northwest\" of the graph) represents greater utility than a lower curve (ie, more to the \"southeast\") since it\nrepresents more return for the same risk at a corresponding point on the lower curve. In this scenario, Investment Y has a greater utility for the\ninvestor than Investment Z since Investment Y is on a higher curve than Investment Z. This is described in detail here.\nExplain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 8, "q": "The following diagram shows indifference curves for a single investor: It is most likely that for this investor, Investment:", "opts": ["Y has greater utility than Investment X.", "Z has greater utility than Investment X.", "Y has greater utility than Investment Z."], "ans": "C", "expl": "Utility is the amount of satisfaction or happiness an investor derives from a combination of risk and return (ie, risk-return pair), represented in this\nscenario as an investment. An indifference curve represents all the investments that have the same amount of utility for a given investor; the\ninvestor is indifferent when choosing between them.\nThe investor's set of indifference curves includes plots of a utility function, in this case U = E(R) − ½ Aσ2, with different levels of utility (U)\ncorresponding to each curve; E(R) is expected return, A is risk aversion, and σ is standard deviation (ie, risk). A given investor has the:\nSame utility for points on the same curve\nDifferent utilities for points on different curves\nGreater utility for points on a higher curve\nA higher curve (ie, more to the \"northwest\" of the graph) represents greater utility than a lower curve (ie, more to the \"southeast\") since it\nrepresents more return for the same risk at a corresponding point on the lower curve. In this scenario, Investment Y has a greater utility for the\ninvestor than Investment Z since Investment Y is on a higher curve than Investment Z. This is described in detail here.\nExplain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 9, "q": "A minimum variance portfolio is best described as the attainable portfolio that always has the:", "opts": ["least risk for a given level of return.", "least risk of any attainable portfolio.", "greatest possible return for a given level of risk."], "ans": "A", "expl": "A minimum variance portfolio is an attainable portfolio that carries the least amount of risk for a given level of return. All minimum variance\nportfolios can be plotted on a graph referred to as the minimum variance frontier, which is the blue and green curve shown in the diagram above.\nPortfolios that are to the right of the minimum variance frontier are attainable, while those that are left of and/or above the frontier are not.\nThe concept that the minimum variance portfolio offers the lowest risk for a given level of return can be demonstrated as follows. Portfolios A, B,\nC, and D all have the same return. Portfolios A, B, and C are all attainable portfolios, but a rational investor would invest in Portfolio C, rather than\nA or B, since it offers less risk for the same return (ie, it plots on the minimum variance frontier). Portfolio D, while theoretically offering even less\nrisk for the same return, is not an attainable portfolio.\n(Choice B) The global minimum variance portfolio (Portfolio F) is the portfolio on the minimum variance frontier that offers the lowest possible risk\nof all minimum variance portfolios.\n(Choice C) Two different minimum variance portfolios that have the same risk but different returns can both lie on the minimum variance frontier.\nIn this question, Portfolios E and G have the same risk, but E has a greater return.\nThings to remember:\nAmong attainable portfolios, a minimum variance portfolio will always carry the least amount of risk for a given level of return. The global minimum\nvariance portfolio has the least amount of risk among all attainable portfolios.\nDescribe and interpret the minimum-variance and efficient frontiers of risky assets and the global minimum-variance portfolio", "qhtml": null}, {"n": 10, "q": "The existence of a positive risk-return relationship is representative of what type of investor behavior?", "opts": ["Risk-averse", "Risk-neutral", "Risk-seeking"], "ans": "A", "expl": "The positive relationship between risk and return is that higher returns are achievable only if risk increases commensurately. This relationship is\nknown as the risk-return trade-off. A risk-averse investor wants either the least risk (given the same return) or the highest return (given the\nsame risk). The risk-return trade-off is evidence that higher risk requires higher returns.\n(Choice B) A risk-neutral investor is indifferent to risk. This usually means risk-neutral investors would not require higher returns when accepting\nhigher-risk investments. This is not an example of a positive risk-return relationship.\n(Choice C) A risk-seeking investor prefers risk. Risk-seeking investors wish to take on more risk even if the return is less. An example of this\ntype of behavior is gambling. This behavior is not shown in the positive risk-return relationship.\nThings to remember:\nThe risk-return trade-off captures investor behavior. A positive risk-return relationship indicates a risk-averse investor. A risk-seeking investor\nseeks risk regardless of the return, and a risk-neutral investor is indifferent to risk.\nExplain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 11, "q": "A manager, acting on a client's behalf, may choose from three investments: Expected Expected Standard Return Deviation (σ) Fund 1 0.08 0.08 Fund 2 0.07 0.07 Fund 3 0.08 0.07 Which investment is most appropriate for a risk-averse client?", "opts": ["Fund 1", "Fund 2", "Fund 3"], "ans": "C", "expl": "A risk-averse investor wants either the least risk given the same return, or the most return given the same risk. Here, determine the lowest-risk\ninvestment with the highest return.\nFund 2 and Fund 3 have the lowest risk. Fund 1 and Fund 3 have the highest return. Fund 3 has the best combination of risk and return.\nThings to remember:\nWhen evaluating investments for risk-averse investors, find investments with the right balance of risk and return. These investors prefer the\nhighest return per unit of risk.\nExplain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 12, "q": "A wealth advisor is looking for an investment from among the following portfolios: Expected Expected Standard Return Deviation (σ) Portfolio A 0.140 0.230 Portfolio B 0.135 0.220 Portfolio C 0.130 0.260 The most appropriate portfolio for a risk-neutral investor is: ", "opts": ["Portfolio A.", "Portfolio B.", "Portfolio C."], "ans": "A", "expl": "Investor utility measures an investor's degree of satisfaction with an investment; it is a function of the expected return, the investor's risk\naversion level, and the risk (expected variance). All investors seek to maximize their utility, and utility defines which investments are most\npreferable with respect to risk and return.\nInvestor behavior determines risk aversion. Risk-averse investors have positive risk aversion and prefer either less risk for a given return or more\nreturn for a given level of risk. Risk-neutral investors have a risk aversion of zero, meaning they are indifferent to risk. Risk-seeking\ninvestors have a negative risk aversion and derive pleasure from taking risk.\nSince the risk aversion of the risk-neutral investor (A) is equal to zero, the investor utility is equal to the expected return. Apply the investor utility\nformula to determine which investment has the highest utility. Risk-neutral investors will select the investment with the highest return regardless of\nrisk (ie, Portfolio A).\n(Choice B) Portfolio B does not have the highest return. Risk-neutral investors would not prefer this portfolio.\n(Choice C) Portfolio C has the highest risk. Risk-seeking, rather than risk-neutral, investors would prefer this portfolio since they seek the highest\nrisk regardless of return.\nThings to remember:\nRisk-neutral investors maximize utility to determine which investment is preferable and seek investments with the highest return without regard for\nrisk. Since their risk aversion is zero, their utility function is equal to the expected return.\nExplain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 13, "q": "The following diagram shows indifference curves for investors with different risk aversions: It is most likely that:", "opts": ["Investor W is less risk averse than Investor X.", "Investor Y is more risk averse than Investor X.", "Investor W is more risk averse than Investor Z."], "ans": "C", "expl": "Utility is the amount of satisfaction or happiness an investor derives from a combination of risk and expected return (ie a risk-return pair). An\nindifference curve represents all the risk-return pairs that offer the same amount of utility to an investor with a given risk tolerance. Therefore,\nan investor has no preference among (ie, is indifferent to) the combinations that lie on the same curve. Investors' risk aversions are reflected in\ntheir indifference curves:\nIn this scenario, Investor W, whose indifference curve slopes upward and has positive risk aversion, has greater risk aversion than Investor\nZ, whose curve slopes downward, indicating negative risk aversion. The indifference curve slopes upward for risk-averse investors (Investors W\nand X) because these investors require more return to take on more risk. Investor Z is a risk-seeking investor who will accept less return in order\nto take on more risk (ie, gambling mentality).\n(Choice A) The curves of Investors W and X are both upward-sloping. Although both are risk-averse investors, W has more risk aversion than X.\nFor any given amount of risk, W requires more return than X.\n(Choice B) The slope of Investor X's indifference curve is positive, indicating positive risk aversion. Investor Y's indifference curve is a horizontal\nline, indicating a risk aversion of zero.\nThings to remember:\nRisk aversion is indicated by the slope of the indifference curve, which is positive (ie, slopes upward) for a risk-averse investor; zero (ie, is flat) for\na risk-neutral investor; or negative (ie, slopes downward) for a risk-seeking investor. For two risk-averse investors, the one whose utility curve has\nthe greater slope for any given level of return has the greater risk aversion.\nExplain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 14, "q": "According to investor utility theory, if the risk-free rate is 2%, then all investors (regardless of risk aversion) most likely have:", "opts": ["zero utility for the risk-free asset.", "different utility for the risk-free asset.", "the same utility for the risk-free asset."], "ans": "C", "expl": "Investor utility (U) measures an investor's degree of satisfaction with an investment. It is most useful in ranking an investor's choices regarding\ni\nrisk and return. An investor's utility is a function of the investment's expected return and risk and of the investor's risk-aversion level. An investor\nuses utility to decide which investments are most preferred. All investors seek to maximize their utility.\nAn investor's level of risk aversion can be determined from the investor's type of behavior. Risk-averse investors prefer either less risk for a given\nreturn, or more return for a given level of risk. Risk-averse investors have positive risk aversion. Risk-neutral investors are indifferent to risk and\nhave a risk aversion of zero. Risk-seeking investors derive pleasure from taking risk and have negative risk aversion.\nσ2\nWith respect to risk, the utility among different investors is usually not the same. If the variance of a risk-free asset ( ) is zero, then the utility of\ni\nall investors is the risk-free rate. Here, this means that the risk-free rate of 2% equals investor utility regardless of risk aversion.\n(Choice A) Investors have utility for risk-free assets; however, their investment behavior or level of risk aversion will not affect the amount of their\nutility for risk-free assets.\n(Choice B) For the three types of investors, investor utility usually differs except when risk is zero.\nThings to remember:\nInvestor utility helps investors determine which investments are preferred. Risk-free investments have the same utility for all investors. This is\nonly possible when the risk is zero.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line", "qhtml": null}, {"n": 15, "q": "Information concerning two assets that compose a portfolio is shown below: Weight Standard deviation A 25% 25% B 75% 35% If the portfolio's variance is 0.07, the covariance between the two assets is best described as:", "opts": ["negative.", "zero.", "positive."], "ans": "A", "expl": "Covariance describes the linear relationship between returns of two assets relative to each other. If two assets' returns tend to move in the\nsame direction at the same time, the assets have positive covariance. If the returns tend to move in opposite directions, the assets have negative\ncovariance. Zero covariance means there is no linear relationship between the assets.\nCovariance is important in portfolio management since assets with negative covariance can be combined to create a lower-risk portfolio. In this\nquestion, each asset's weight and the portfolio's variance are given. Each asset's variance is the square of its standard deviation. Calculating\ncovariance is accomplished by rearranging the terms in the equation above:\nIn this scenario, the covariance is negative since the sum of the product of each asset's squared weight and its variance is greater than the\nportfolio's variance (Choices B and C). However, covariance indicates only the direction of each asset relative to the other; it does not provide\nany information about the strength of the linear relationship. The correlation coefficient provides information about both the direction and strength\nof the linear relationship.\nThings to remember:\nCovariance indicates the movement of two assets relative to each other. Positive covariance means that both assets tend to move in the same\ndirection at the same time, while negative covariance means that they tend to move in opposite directions. Although covariance indicates whether\na linear relationship between the assets exists, it does not provide any information concerning the strength of the relationship.\nCalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based on historical data", "qhtml": null}, {"n": 16, "q": "A manager may choose from the following investments: Expected Expected Standard Return Deviation (σ) Fund 1 0.10 0.10 Fund 2 0.12 0.13 Fund 3 0.14 0.12 Which investment would be the most appropriate choice for a risk-seeking client?", "opts": ["Fund 1", "Fund 2", "Fund 3"], "ans": "B", "expl": "Risk-seeking investors are different from risk-averse investors when ranking or comparing investments. Risk-seeking investors prefer the\ninvestment with the highest risk and do not include return in evaluating an investment. By contrast, risk-averse investors prefer either\ninvestments with the lowest risk given the same return or investments with the highest return given the same risk.\nRisk-averse investors, who are more common than risk-seeking investors, compare risk and return when evaluating investments. The expected\nstandard deviation of a portfolio's returns is a measure of total risk. The expected return is the percent growth of an asset that an investor\nanticipates receiving.\nFund 1 has the lowest risk so risk-seeking investors would not prefer it. Even though Fund 3 has a higher return and lower risk than Fund 2, risk-\nseeking investors find pleasure in higher risk and ignore expected return in choosing their investments. Risk-seeking investors prefer Fund 2\nsince it has the highest risk (expected standard deviation) (Choices A and C).\nThings to remember:\nTo choose investments for risk-seeking investors, select the investment with the highest risk. An example of a risk-seeking investor is a gambler.\nMost investors are not gamblers.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line", "qhtml": null}, {"n": 17, "q": "An analyst reviews the following information on equity classes: The analyst wishes to form a portfolio using only US equity and one of the other equity classes shown above. If the portfolio is equally weighted between the two classes, which would reduce the portfolio's risk the most if included in the portfolio?", "opts": ["Indian equity", "European equity", "Japanese equity"], "ans": "A", "expl": "σ\nThe expected standard deviation of a portfolio's return, p, is a measure of risk. It is a function of the weight and risk of the portfolio's assets\nand the correlation between the two assets. On a graph, it expresses the dispersion of portfolio returns around its mean return. The lower the\ndispersion, the lower the portfolio risk.\nCombining two assets whose returns are less than perfectly correlated (ie, correlation coefficient less than 1) with each other reduces\nportfolio risk. The lower the correlation is between the two assets, the greater the benefit from diversification and the lower the portfolio's\nexpected standard deviation. In this instance, the asset class that has the lowest correlation with the US equities is the Indian equity asset class,\nwith a correlation of 0.61. Therefore, it reduces portfolio risk the most if combined with the US equity asset class (Choices B and C).\nThings to remember:\nThe standard deviation of a portfolio's expected return is a measure of risk. It is a function of the weight and risk of the portfolio's assets and the\ncorrelation between assets. Combining assets whose returns are less than perfectly correlated with each other reduces portfolio risk. The lower\nthe correlation is between the two assets, the greater the benefit from diversification.\nDescribe the effect on a portfolio’s risk of investing in assets that are less than perfectly correlated", "qhtml": null}, {"n": 18, "q": "The average risk and covariance of assets are constant in an equally weighted portfolio. As the number of assets increases, the portfolio risk most likely: ", "opts": ["decreases.", "remains constant.", "increases ."], "ans": "A", "expl": "Portfolio standard deviation of an equally weighted portfolio is a function of the number of assets, the average variance of the assets, and\nthe average covariance. This concept assumes all assets have the same average variance and the same covariance.\nFor example, a portfolio of two assets with an average variance of 4.00% and an average covariance of 2.00% has a portfolio standard deviation\n(risk) of 17.32%. Portfolio standard deviation decreases to 14.21% when the number of assets increases from 2 to 100. As the number of\nsecurities increases from 2 to 5, portfolio risk decreases by 1.83%. But as the number of securities increases from 25 to 100, portfolio risk\ndecreases by only 0.21%.\nAs the number of portfolio assets increases, portfolio risk decreases. The decrease to portfolio risk that each additional asset in the portfolio\ncontributes then becomes less impactful. At some point, the reduction in portfolio risk achieved by adding one more asset becomes insignificant.\nThere is no consensus on the exact number of securities that an investor should have in a portfolio.\nThings to remember:\nAs the number of assets in the portfolio increases, portfolio risk decreases. The incremental risk reduction achieved by each additional asset\ndecreases and eventually becomes insignificant.\nCalculate and interpret portfolio standard deviation", "qhtml": null}, {"n": 19, "q": "A manager prepares risk and return information for three different funds: Expected Expected Standard Return Deviation (σ) Fund 1 0.15 0.17 Fund 2 0.20 0.20 Fund 3 0.25 0.23 If an investor's risk aversion is 8, then the fund with the highest utility for that investor is most likely?", "opts": ["Fund 1", "Fund 2", "Fund 3"], "ans": "B", "expl": "Investor utility (U) measures an investor's degree of satisfaction with an investment. It is most useful in ranking one investor's choices\ni\nregarding risk and return. An investor's utility is a function of the investment's expected return and risk and the investor's risk-aversion level. An\ninvestor uses utility to decide which investments are most preferred. All investors seek to maximize their utility.\nUse the information provided to determine the utility for each fund. The expected standard deviation squared is the fund's expected variance.\nAfter calculating the investor's utility for each fund, select the fund with the highest utility to determine a risk-averse investor's most preferred\ninvestment.\n(Choice B) Fund 1 has the lowest utility of all three choices. All investors seek to maximize, not minimize, their utility.\n(Choice C) A risk-seeking investor would choose Fund 3 over Fund 2 since it has greater risk despite having lower utility than Fund 2. Risk-\nseeking investors seek the highest risk regardless of returns.\nThings to remember:\nAll investors, including risk-averse investors, use utility to determine which investment is preferable. A level of utility is not comparable between\ntwo investors as it is a subjective preference of taking on risk. It provides information to one investor that higher utility levels are better than lower\nones, but not by how much.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line", "qhtml": null}, {"n": 20, "q": "Under modern portfolio theory, which of the following best describes the global minimum variance portfolio?", "opts": ["A portfolio on the efficient frontier", "An unachievable portfolio with the lowest risk", "The lowest risk portfolio on the capital allocation line"], "ans": "A", "expl": "The global minimum variance portfolio is the lowest risk portfolio on the efficient frontier. It is composed of only risky assets, so it excludes\nrisk-free assets. The efficient frontier represents all minimum variance portfolios within the investment opportunity set. Each portfolio along the\nefficient frontier has the highest expected return for a given level of risk. The global minimum variance portfolio (Portfolio A) is the lowest point on\nthe efficient frontier (the blue curved line).\nAlthough portfolios along the red curved line are also minimum variance portfolios, they are not part of the efficient frontier. Portfolios B and C\nhave the same risk, but Portfolio B is suboptimal since it has a lower expected return than Portfolio C. This holds true for all portfolios on the red\ncurved line.\n(Choice B) The global minimum variance portfolio is the lowest risk portfolio on the efficient frontier that is composed of only risky assets and is\nachievable. There are theoretical portfolios with certain combinations of risk and return that are not possible, but the global minimum variance\nportfolio is not one of them.\n(Choice C) The lowest-risk portfolio on the capital allocation line is the risk-free asset, not the global minimum variance portfolio. The capital\nallocation line combines a risky portfolio with a risk-free asset. Portfolios on the capital allocation line do not include the global minimum variance\nportfolio.\nThings to remember:\nThe global minimum variance portfolio is the lowest risk portfolio on the efficient frontier. The efficient frontier represents minimum variance\nportfolios constructed with risky assets that have the highest return for a given level of risk.\nDescribe and interpret the minimum-variance and efficient frontiers of risky assets and the global minimum-variance portfolio", "qhtml": null}, {"n": 21, "q": "Portfolios along the capital allocation line are most likely to:", "opts": ["include the optimal risky portfolio and the risk-free asset.", "include only risky assets below the optimal risky portfolio.", "be created by borrowing and lending the global minimum variance portfolio."], "ans": "A", "expl": "The capital allocation line (CAL) represents portfolios with the highest return for a given level of risk. Those portfolios contain a combination of\nthe optimal risky portfolio and the risk-free asset. The optimal risky portfolio lies on both the efficient frontier and the CAL.\nThe optimal risky portfolio is located at the point of tangency where a straight line originating from the risk-free rate touches the efficient frontier.\nThe risk-free rate is what an investor earns by taking no risk. If any other portfolio along the efficient frontier, such as the global minimum variance\nportfolio, is used to create an alternative CAL, then the resulting portfolios would be suboptimal to the dominant CAL using the optimal risky\nportfolio.\nIf the optimal risky portfolio has a risk of 20% but the investor prefers half that risk (10%), then the investor allocates 50% of the investment to the\noptimal risky portfolio and 50% to the risk-free asset. If another investor prefers 50% more risk than the optimal risky portfolio (30%), then this\ninvestor would borrow 50% at the risk-free rate and invest 150% in the optimal risky portfolio.\nDescribe and interpret the minimum variance and efficient frontiers of risky assets and the global minimum variance portfolio LOS\n22. If two risky assets that are less than perfectly correlated are combined to form a portfolio, then most likely the:\nA. portfolio's risk cannot be less than the risk of the least risky asset.\nB. assets must be negatively correlated to obtain the benefit of reduced risk.\n C. portfolio's risk is less than the weighted average risk of the assets for a given return.\nExplanation\nPortfolio managers seek to achieve the highest possible return while minimizing risk. This can be accomplished by combining assets whose\nreturns are less than perfectly correlated (ρ < 1).\nIf risky Assets A and B are perfectly correlated (ρ = 1), portfolios of different combinations of the assets plot along a continuum in a straight line\nbetween the assets (black line). For such two-asset portfolios, the standard deviation of the portfolio is a weighted average of the standard\ndeviations of each asset (Portfolio V).\nIn contrast, portfolios of two assets with less than perfect correlation (ρ < 1) fall along a continuum which is convex to the left in the direction of\nlower risk (eg, green (ρ = 0.5), blue (ρ = 0), and purple (ρ = −0.5) curves). Therefore, any portfolio whose two assets are less than perfectly\ncorrelated (Portfolios U, X, Y, and Z) always has less risk for the same return than the weighted average standard deviation of the assets\n(Portfolio V). If two assets are perfectly negatively correlated (ρ = −1, red curve), combining them can potentially reduce risk to zero (Portfolio Z).\n(Choice A) A portfolio combination of two assets may have lower risk than that of either asset. This is the case with Portfolios X, Y, and Z.\n(Choice B) A negative correlation between the two assets is not required to achieve risk reduction. The only requirement is that the correlation is\nless than 1.\nThings to remember:\nIf two assets that are less than perfectly correlated are combined to form a portfolio, then the portfolio risk is less than the weighted average of the\ntwo assets' risks for a given level of return. If the correlation is low enough, the portfolio risk may be lower than the risk of either asset.\nDescribe the effect on a portfolio’s risk of investing in assets that are less than perfectly correlated", "qhtml": null}, {"n": 22, "q": "If two risky assets that are less than perfectly correlated are combined to form a portfolio, then most likely the:", "opts": ["portfolio's risk cannot be less than the risk of the least risky asset.", "assets must be negatively correlated to obtain the benefit of reduced risk.", "portfolio's risk is less than the weighted average risk of the assets for a given return."], "ans": "C", "expl": "Portfolio managers seek to achieve the highest possible return while minimizing risk. This can be accomplished by combining assets whose\nreturns are less than perfectly correlated (ρ < 1).\nIf risky Assets A and B are perfectly correlated (ρ = 1), portfolios of different combinations of the assets plot along a continuum in a straight line\nbetween the assets (black line). For such two-asset portfolios, the standard deviation of the portfolio is a weighted average of the standard\ndeviations of each asset (Portfolio V).\nIn contrast, portfolios of two assets with less than perfect correlation (ρ < 1) fall along a continuum which is convex to the left in the direction of\nlower risk (eg, green (ρ = 0.5), blue (ρ = 0), and purple (ρ = −0.5) curves). Therefore, any portfolio whose two assets are less than perfectly\ncorrelated (Portfolios U, X, Y, and Z) always has less risk for the same return than the weighted average standard deviation of the assets\n(Portfolio V). If two assets are perfectly negatively correlated (ρ = −1, red curve), combining them can potentially reduce risk to zero (Portfolio Z).\n(Choice A) A portfolio combination of two assets may have lower risk than that of either asset. This is the case with Portfolios X, Y, and Z.\n(Choice B) A negative correlation between the two assets is not required to achieve risk reduction. The only requirement is that the correlation is\nless than 1.\nThings to remember:\nIf two assets that are less than perfectly correlated are combined to form a portfolio, then the portfolio risk is less than the weighted average of the\ntwo assets' risks for a given level of return. If the correlation is low enough, the portfolio risk may be lower than the risk of either asset.\nDescribe the effect on a portfolio’s risk of investing in assets that are less than perfectly correlated", "qhtml": null}, {"n": 23, "q": "A portfolio on the capital allocation line is most likely a combination of the risk-free asset and:", "opts": ["the optimal risky portfolio.", "the maximum return portfolio.", "the global minimum variance portfolio."], "ans": "A", "expl": "The dominant capital allocation line (CAL) represents portfolios that hold a combination of the optimal risky portfolio and the risk-free asset.\nThe optimal risky portfolio is the portfolio on the efficient frontier at the tangency point where a straight line, originating from the risk-free rate,\ntouches the efficient frontier. All portfolios on the CAL dominate all other attainable portfolios at the same level of risk.\nIf an investor combines any portfolio on the efficient frontier other than the optimal risky portfolio with the risk-free rate, then the resulting\ncombination will be suboptimal. Portfolio A dominates both Portfolio B and Portfolio C since they all have the same risk (30%), but Portfolio A's\nexpected return of 16% is higher than both Portfolio B's (12%) and Portfolio C's (8%) expected returns.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line LOS\n24.An analyst builds portfolios from only risky assets. If the analyst is interested in portfolios that have the highest expected return for a given\nlevel of risk, then the analyst would most appropriately consider portfolios on the:\n\nA. efficient frontier.\nB. security market line.\nC. capital allocation line.\nExplanation\nThe efficient frontier represents all portfolios of risky assets in the investment opportunity set with the highest expected return for a given level\nof risk. The efficient frontier is the blue curved line. The global minimum variance portfolio, Portfolio A, is the lowest risk portfolio on the efficient\nfrontier.\nThe optimal risky portfolio, Portfolio B, is a portfolio on the efficient frontier. All portfolios to the immediate right of Portfolio B, such as Portfolio D,\nhave the same return but higher portfolio risk than Portfolio B. These are suboptimal risky portfolios. All portfolios directly below Portfolio B, such\nas Portfolio C, have the same risk as, but a lower return than, Portfolio B.\nThe capital allocation line (CAL) represents risky portfolios that hold a combination of the optimal risky portfolio and the risk-free asset. The\nproportional mix between the optimal risky portfolio and the risk-free asset is determined by each investor's risk level. Portfolios on the CAL\ndominate all other risky portfolios on the efficient frontier in all combinations of risk and return, except at the optimal risky portfolio, in which risks\nand returns are the same.\n(Choice B) The security market line is a graph of the capital asset pricing model that provides the expected rate of return for an individual\nsecurity, not for portfolios.\n(Choice C) Portfolios on the CAL have combinations of the optimal risky portfolio and the risk-free asset. The analyst includes only risky assets\nin the analysis and could not have considered portfolios, except for the optimal risky portfolio, on the CAL.\nThings to remember:\nThe efficient frontier represents portfolios of risky assets with the highest expected return for a given level of risk. The capital allocation line\nincludes the optimal risky portfolio and the risk-free asset and dominates the efficient frontier—except at the optimal risky portfolio, where risks and\nreturns are equal.\nDescribe and interpret the minimum-variance and efficient frontiers of risky assets and the global minimum-variance portfolio", "qhtml": null}, {"n": 24, "q": "An analyst builds portfolios from only risky assets. If the analyst is interested in portfolios that have the highest expected return for a given level of risk, then the analyst would most appropriately consider portfolios on the: ", "opts": ["efficient frontier.", "security market line.", "capital allocation line."], "ans": "A", "expl": "The efficient frontier represents all portfolios of risky assets in the investment opportunity set with the highest expected return for a given level\nof risk. The efficient frontier is the blue curved line. The global minimum variance portfolio, Portfolio A, is the lowest risk portfolio on the efficient\nfrontier.\nThe optimal risky portfolio, Portfolio B, is a portfolio on the efficient frontier. All portfolios to the immediate right of Portfolio B, such as Portfolio D,\nhave the same return but higher portfolio risk than Portfolio B. These are suboptimal risky portfolios. All portfolios directly below Portfolio B, such\nas Portfolio C, have the same risk as, but a lower return than, Portfolio B.\nThe capital allocation line (CAL) represents risky portfolios that hold a combination of the optimal risky portfolio and the risk-free asset. The\nproportional mix between the optimal risky portfolio and the risk-free asset is determined by each investor's risk level. Portfolios on the CAL\ndominate all other risky portfolios on the efficient frontier in all combinations of risk and return, except at the optimal risky portfolio, in which risks\nand returns are the same.\n(Choice B) The security market line is a graph of the capital asset pricing model that provides the expected rate of return for an individual\nsecurity, not for portfolios.\n(Choice C) Portfolios on the CAL have combinations of the optimal risky portfolio and the risk-free asset. The analyst includes only risky assets\nin the analysis and could not have considered portfolios, except for the optimal risky portfolio, on the CAL.\nThings to remember:\nThe efficient frontier represents portfolios of risky assets with the highest expected return for a given level of risk. The capital allocation line\nincludes the optimal risky portfolio and the risk-free asset and dominates the efficient frontier—except at the optimal risky portfolio, where risks and\nreturns are equal.\nDescribe and interpret the minimum-variance and efficient frontiers of risky assets and the global minimum-variance portfolio", "qhtml": null}, {"n": 25, "q": "The global minimum-variance portfolio is best described as being:", "opts": ["unattainable without including a risk-free rate.", "the portfolio with the lowest return on the efficient frontier.", "the point of tangency between the efficient frontier and the capital allocation line."], "ans": "B", "expl": "The minimum-variance frontier is the line containing all minimum-variance portfolios, which are those with the lowest expected risk for a given\nlevel of expected return within the investment opportunity set. Portfolios on the minimum-variance frontier are composed of only risky assets. Of\nthese portfolios, the global minimum-variance portfolio has the lowest expected risk.\nThe efficient fronter (ie, Markowitz efficient frontier, blue line above) is composed of all portfolios on the minimum-variance frontier with returns\ngreater than or equal to the global minimum-variance portfolio. Each of those portfolios has the highest return for a given level of risk. All\nportfolios with lower returns are suboptimal (red line above), meaning that each has a lower return than an alternative portfolio with the same level\nof risk.\nNone of the suboptimal portfolios are part of the efficient frontier, so the global minimum-variance portfolio has the lowest return of any portfolio\non the efficient frontier.\n(Choice A) Since the global minimum-variance portfolio lies on the minimum-variance frontier, where all portfolios have only risky assets, it is\nattainable without the risk-free rate.\n(Choice C) The optimal risky portfolio is located at the point of tangency between the efficient frontier and the capital allocation line.\nThings to remember:\nAll portfolios on the minimum-variance frontier with returns greater than or equal to the global minimum-variance portfolio comprise the Markowitz\nefficient frontier. The global minimum-variance portfolio has the lowest return of any portfolio on the efficient frontier.\nDescribe and interpret the minimum-variance and efficient frontiers of risky assets and the global minimum-variance portfolio", "qhtml": null}, {"n": 26, "q": "A two-asset portfolio has the following characteristics: Expected Security's Security Standard Portfolio Weight Deviation Stock A 9% 80% Stock B 10% 20% If the correlation coefficient of returns between the two securities is 0.6, then the portfolio's expected variance is closest to: ", "opts": ["0.0073", "0.0085", "0.0855"], "ans": "A", "expl": "σ2\nThe variance of a portfolio's returns ( p) is a measure of risk. In a two-asset portfolio, the portfolio variance is a function of the weight (ie,\nσ2 (ρ)\nproportion of total capital) and the risk ( x) of each asset as well as the correlation coefficient\nab\n) between the assets' returns. Portfolio\nvariance expresses the degree of dispersion of a portfolio's returns around its mean. The greater the dispersion, the higher the portfolio risk.\nIn this example, the portfolio's variance is 0.0073.\n(Choice B) 0.0085 results from using the weighted average expected variance in the formula. This ignores the effect of the correlation between\nthe two assets' returns.\n(Choice C) 0.0855 is the portfolio's expected standard deviation (ie, the square root of its expected variance).\nThings to remember:\nThe variance of a portfolio's returns is a measure of risk. In a two-asset portfolio, the portfolio variance is a function of the weight and the risk of\neach asset and the correlation between the assets. The variance expresses the degree of dispersion of the portfolio's returns around its mean.\nCalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based on historical data", "qhtml": null}, {"n": 27, "q": "A portfolio consists of two assets: Expected standard Asset Asset weight (%) deviation (%) A 15 75 B 8 25 If the expected standard deviation of the portfolio is 10%, then the two assets can be best described as having:", "opts": ["no correlation.", "positive correlation.", "negative correlation."], "ans": "C", "expl": "The correlation coefficient evaluates how two assets' returns move or are expected to move in relation to each other. It measures both the\ndegree and the direction of the relationship between the two assets. Positively correlated asset returns generally move in the same way,\nwhile negatively correlated asset returns tend to move in opposite directions. The closer the correlation coefficient is to −1 or 1, the stronger the\nnegative or positive relationship, respectively.\nThe correlation coefficient is used to calculate the expected standard deviation of portfolio returns. The degree and the direction of the variance\nbetween asset returns affects the portfolio's overall risk. If two assets are less than perfectly correlated, combining them would produce a portfolio\nwith a lower standard deviation than the weighted average of the assets' standard deviations. The closer the correlation coefficient is to −1, the\nlower the portfolio risk.\nThe relationship between a two-asset portfolio's standard deviation and the weights, standard deviations, and correlation of its component assets\nis shown below.\nIn this case, since all the other information is provided, the relationships above can be used to solve for the assets' correlation as follows:\nThe correlation coefficient of assets A and B is −0.6792, so they are negatively correlated (Choices A and B).\nThings to remember\nThe correlation coefficient of two assets expresses how their returns are expected to move in relation to each other. The closer the coefficient is to\n1 or −1, the stronger the correlation. If two assets are less than perfectly correlated, combining them would reduce the standard deviation of the\nresulting portfolio, reflecting the lower risk of the assets in combination.\nCalculate and interpret the mean variance and covariance (or correlation) of asset returns based on historical data LOS\n28.A manager constructs a new portfolio using a treasury bond and a stock. The manager obtains the following information:\nExpected Annual Expected\nReturn Variance\nTreasury Bond 0.04 0.01\nStock 0.12 0.04\nThe expected correlation coefficient between the stock and treasury bond is 0.25. If the portfolio's expected return is 9%, its expected standard\ndeviation will be closest to:\nA. 5.4%\n\nB. 13.9%\nC. 17.6%\nExplanation HP 12c TI BA II Plus\nσ ,\nThe portfolio standard deviation, p is a measure of risk. For a standard deviation of a two-asset portfolio, the portfolio standard deviation is a\nfunction of the weight and risk of the portfolio's assets and the correlation between two assets. It expresses the degree of dispersion of how\nportfolio returns occur around its mean. The greater the dispersion, the higher the risk.\nThe data given in this question are all expected values; this does not change how the portfolio standard deviation is calculated. Both expected\nstandard deviation and standard deviation from historical data are calculated from the same equation.\nTo find portfolio standard deviation, input the weights, standard deviations, variances of the portfolio's assets, and the correlation coefficients\nbetween all pairs of assets. For this question, find the weights of treasury bond (T) and the stock (S) from the return requirement.\nIn a two-asset portfolio, restate the weight of one of the funds as the difference of the total portfolio minus the other fund's weight.\nOnce the weight of stock (w ) is found, solve for the weight of the treasury bond (w ):\nS T\nFor the expected standard deviations of T (treasury bond) and S (stock), calculate the values by taking the square root of the variance.\nNow that all the components have been calculated, input all values into the standard deviation of the two-asset portfolio equation and solve:\n(Choice A) This choice misapplies the variance of the assets and then squares them as if the variance were the standard deviation. This\nunderstates portfolio risk.\n(Choice C) This option does not square the weights of the assets and therefore overstates portfolio risk.\nThings to remember:\nStandard deviation of a portfolio is a measure of risk. It is the amount of dispersion of the portfolio's return around its mean. To solve for weight,\nremember that in a two-asset portfolio, the weight of one asset can be expressed in terms of the other.\nCalculate and interpret portfolio standard deviation", "qhtml": null}, {"n": 28, "q": "A manager constructs a new portfolio using a treasury bond and a stock. The manager obtains the following information: Expected Annual Expected Return Variance Treasury Bond 0.04 0.01 Stock 0.12 0.04 The expected correlation coefficient between the stock and treasury bond is 0.25. If the portfolio's expected return is 9%, its expected standard deviation will be closest to:", "opts": ["A negative risk-return relationship", "Decreasing marginal utility of return", "The convexity of the efficient frontier"], "ans": "B", "expl": "The steepness of the risk-averse investor's indifference curve indicates that if risk increases (portfolio standard deviation), then a risk-averse\ninvestor will need more return to keep the same level of investor utility. Further, the additional amount of return needed is greater than the\nincrease in risk.\nIn the example above, an investor has a risk aversion measure of 7, an expected return of 5%, and risk (standard deviation) of 10%. At a risk of\n20%, the slope of a risk-averse investor's indifference curve is steeper than when the risk is 10%.\nUsing the utility formula, if the investor's risk doubles from 10% to 20%, then the return must more than double. In this example, the return more\nthan triples (15.5% ÷ 5.0% = 3.1x). This illustrates the concept of diminishing marginal utility of return. As risk increases, return must\nincrease by more than risk to maintain the investor's utility.\n(Choice A) There is a positive risk-return relationship in this situation. Over long periods of time, data indicate that higher returns are associated\nwith higher risks.\n(Choice C) The convexity of the efficient frontier explains how the efficient frontier is shaped, but it does not impact how indifference curves\nbecome steeper as risk increases.\nThings to remember:\nRisk-averse investors need more return for an increase in risk because of the diminishing marginal utility of return. The greater the risk, the\nsteeper the indifference curve becomes.\nExplain the selection of an optimal portfolio, given an investor’s utility (or risk aversion) and the capital allocation line\n31. Under modern portfolio theory, the efficient frontier most accurately represents portfolios:\nA. of risk-free and risky assets with the lowest risk for a given expected return.\nB. preferred by risk-averse investors below the global minimum-variance portfolio.\n C. in the investment opportunity set with the highest expected return for a given level of risk.\nExplanation\nThe efficient frontier contains the best portfolios an investor can find using risky assets. The efficient frontier represents all portfolios of risky\nassets in the investment opportunity set with the highest expected return for a given level of risk. The efficient frontier is a continuum of optimal\nportfolios.\nPortfolio B is an optimal portfolio that has an expected return of 12% with a risk of 30%. All portfolios to the right of Portfolio B (where expected\nreturn is 12%) have risk greater than 30%; therefore, these portfolios are suboptimal to (ie, less efficient than) Portfolio B. Any point above or to\nthe left of Portfolio B is unattainable by any combination of risky assets since it is not part of the investment opportunity set.\nThe global minimum-variance portfolio, Portfolio A, is the portfolio with the lowest possible risk (15%) on the efficient frontier. While\nportfolios along the red curved line are minimum variance portfolios, they are not part of the efficient frontier. Portfolio C is suboptimal to Portfolio\nB since both have the same portfolio risk (30%), although Portfolio B has a higher expected return (12%). The efficient frontier is the blue curved\nline.\n(Choice A) The efficient frontier represents portfolios of only risky assets and does not include risk-free assets at any return level.\n(Choice B) Risk-averse investors would prefer any portfolio along the efficiency frontier above the global minimum-variance portfolio. Portfolios\nbelow this level have higher risk and lower return. Selecting these portfolios is not a behavior pattern of risk-averse investors.\nThings to remember:\nThe efficient frontier is a collection of portfolios of risky assets that have the most preferred (by risk-averse investors) combination of risk and\nreturn. The efficient frontier gives investors the optimal portfolio for their unique return and risk preferences. It can also provide insight into how\nmuch risk is required to achieve a certain expected return.\nDescribe and interpret the minimum-variance and efficient frontiers of risky assets and the global minimum-variance portfolio", "qhtml": null}, {"n": 29, "q": "An analyst researches a portfolio that holds two emerging market stocks, Stock A and Stock B. The following data are collected: Expected Standard Asset Deviation (σ) Weights Stock A 0.10 0.60 Stock B 0.20 0.40 If the expected portfolio standard deviation is 10%, then Stock A and Stock B can best be described as having: ", "opts": ["A negative risk-return relationship", "Decreasing marginal utility of return", "The convexity of the efficient frontier"], "ans": "B", "expl": "The steepness of the risk-averse investor's indifference curve indicates that if risk increases (portfolio standard deviation), then a risk-averse\ninvestor will need more return to keep the same level of investor utility. Further, the additional amount of return needed is greater than the\nincrease in risk.\nIn the example above, an investor has a risk aversion measure of 7, an expected return of 5%, and risk (standard deviation) of 10%. At a risk of\n20%, the slope of a risk-averse investor's indifference curve is steeper than when the risk is 10%.\nUsing the utility formula, if the investor's risk doubles from 10% to 20%, then the return must more than double. In this example, the return more\nthan triples (15.5% ÷ 5.0% = 3.1x). This illustrates the concept of diminishing marginal utility of return. As risk increases, return must\nincrease by more than risk to maintain the investor's utility.\n(Choice A) There is a positive risk-retur
