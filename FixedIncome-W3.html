<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A large corporate issuer issued $50 million to the general public in a new bond offering two years ago. Using the same offering circular, the company just issued an additional $30 million in new bonds, most likely due to a: ", "opts": ["shelf registration.", "private placement.", "best effort offering."], "ans": "A", "expl": "Shelf registration\nA single, all-encompassing offering circular\nCan last for years, covering multiple new issues\nSecurities can be issued with just a short document confirming details have not changed\nAllows issuer flexibility to quickly issue securities when conditions are favorable\nA shelf registration gives certain well-established issuers the ability to file a single, all-encompassing offering circular (ie, master prospectus)\nthat allows securities to be issued quickly in the future when capital is needed or when market conditions are favorable. The term comes from\nthe idea that the securities are \"sitting on a shelf,\" just waiting to be sold. Shelf registrations can last for years, and all that is required for a new\nissuance is a short document confirming that no material changes have occurred that require additional disclosure.\n(Choice B) A private placement is not sold to the general public, and the investors would most likely require a new prospectus.\n(Choice C) A best effort offering is a type in which the broker sells securities only on a \"best effort\" basis. It is typically used only for high-risk\nsecurities, not those from well-known, seasoned issuers.\nThings to remember:\nA shelf registration gives certain well-established issuers the ability to file a single, all-encompassing offering circular that allows securities to be\nissued quickly in the future when capital is needed or when market conditions are favorable.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 2, "q": "An analyst is classifying bonds within the global fixed income market. Which of the following is least likely a valid distinction for the analyst to use? ", "opts": ["Bilateral versus syndicated", "Fixed rate versus floating rate", "Corporate versus nonsovereign"], "ans": "A", "expl": "Fixed income securities can be classified in a number of different ways; the most common classifications are shown above. Bilateral and\nsyndicated are types of loans, not types of bonds, made by banks to corporations and other entities. A bilateral loan is made from a single\nlender to a single borrower who needs funding. A syndicated loan is made by a syndicate (ie, a group of lenders who share the credit risk of the\nloan). Note that although a bond issuance may, in some cases, be purchased by a single institutional investor, this bond is not called \"bilateral.\"\n(Choice B) Bonds may be classified by coupon type, so fixed versus floating is a valid distinction. The \"rate\" refers to the coupon rate paid by the\nissuer, so fixed-rate bonds maintain the same rate or coupon over time. Floating-rate bonds have a rate that varies based on a reference rate\nsuch as LIBOR.\n(Choice C) Bonds may be classified by issuer type, so corporate versus nonsovereign is a valid distinction. There are four broad bond sectors:\nfinancial institutions, nonfinancial corporates, governments, and households. Within the government sector, nonsovereign bonds are issued by\nauthorities (eg, municipal governments) subordinate to national governments.\nThings to remember:\nThe most common classifications of fixed income securities are issuer type, credit quality, maturity, currency denomination, type of coupon,\ngeography, inflation protection, and tax treatment.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 3, "q": "Typically, corporate bonds are most likely issued through a(n):", "opts": ["auction.", "best effort offering.", "underwritten offering."], "ans": "C", "expl": "Corporate bonds are most often issued in an underwritten offering; this is also known as a firm commitment offering. In an underwritten\noffering, the underwriter (eg, investment bank) guides the issuer through the issuance process (eg, size, structure, pricing) by conveying investors'\npreferences. The underwriter then buys the entire issue to resell to investors, thus guaranteeing that the issuance is successful for the issuer but\ntaking a financial risk if not all the bonds are sold.\n(Choice A) Auctions utilize a bidding process for price discovery and are more typical in the issuance of sovereign government debt. Sovereign\nbonds are well known to investors; combined with the standardized nature and regular issuance of these bonds, they enable the lowest cost\nissuance method, namely an auction.\n(Choice B) In a best effort offering, the investment bank is acting only as a broker and will sell the issue only on a \"best efforts\" basis for a\ncommission. Best effort offerings are not as common and usually reserved for high-risk issues.\nThings to remember:\nCorporate bonds are most often issued in an underwritten offering; this is also known as a firm commitment offering. The underwriter buys the\nentire issue to resell to investors, thus taking financial risk that the issuance is successful.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 4, "q": "The secondary market for a particular bond is most likely deemed liquid if the bond can be sold quickly:", "opts": ["to numerous bidders.", "for same-day settlement.", "at close to fair market value."], "ans": "C", "expl": "Secondary bond market liquidity\nNot simply about how quickly a bond can be bought or sold\nThe ability to buy and sell quickly at prices close to fair value\nThe secondary bond market is dominated by institutional investors and central banks, with only limited retail participation. Securities are most\noften traded through a broker-dealer in over-the-counter (OTC) transactions.\nOutside of a handful of very liquid bonds (eg, sovereigns) that can be traded on an electronic order execution system (ie, \"screen\"), the liquidity of\nbonds is largely dependent on getting manual quotes from brokerage firms. Secondary bond market liquidity is determined by both how fast a\nbond can be bought or sold and how closely the price approximates fair value.\nFor example, suppose an institutional investor is interested in selling a high-quality bond and, due to the decentralized nature of the OTC market,\nthe investor requests bids (ie, price the buyer is willing to pay) from numerous brokerage firms (ie, manual quotes). Depending on the bond and\nmarket conditions, the price dispersion may be quite wide. In this case, suppose the best bid received is 2% below what the investor believes is a\nfair market price. This bond would not be considered liquid in the sense that even though the bond can be sold quickly, the price is too far below\nfair market value.\n(Choice A) Numerous bidders alone do not constitute a liquid market, particularly if the bids are materially below fair value.\n(Choice B) The market convention for settling most corporate bonds is trade date plus two or three days (eg, t + 3). Same-day settlement is often\npossible, but it frequently comes at a price further from fair market value, indicating a less liquid market.\nThings to remember:\nSecondary bond market liquidity is determined by both how fast a bond can be bought or sold and how closely the price approximates fair value.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 5, "q": "Floating rate notes (FRNs) are most likely issued by banks to:", "opts": ["limit their interest rate risk.", "lower their interest expense.", "secure long-term funding needs."], "ans": "A", "expl": "Floating rate notes (FRNs) are most often issued by banks to align balance sheet interest rate risk. FRNs are generally issued with short-term\nmaturities and are frequently tied to the same reference rates as an institution's liabilities. By matching the interest rate risk of assets and\nliabilities, the bank diminishes earnings and net worth fluctuations, thus decreasing the probability of an adverse outcome on a financial\ninstitution's capital buffer.\n(Choice B) Banks and corporations issue FRNs for different purposes and needs. Corporate borrowers will issue FRNs as an alternative to bank\nlines of credit when financing is cheaper. Corporate issuers may also speculate on the direction of interest rates, issuing FRNs when they believe\ninterest rates will fall.\n(Choice C) FRNs are most often issued with short maturities to align interest rate risk at banks. Long-term funding is largely secured through\nother means (eg, fixed rate debt, preferred stock).\nThings to remember:\nFloating rate notes (FRNs) are most often issued by banks to align balance sheet interest rate risk. By matching the interest rate risk of assets\nand liabilities, the bank diminishes earnings and net worth fluctuations, thus decreasing the probability of an adverse outcome on a financial\ninstitution's capital buffer.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 6, "q": "A dealer places a noncompetitive bid in a single-price auction of government bonds for $1 million face value of bonds. Which of the following statements most accurately describes the amount of bonds the dealer will receive when the auction is concluded?", "opts": ["None, since the bid is noncompetitive", "$1 million face value of bonds at the issuer-accepted yield", "$1 million face value of bonds at the yield that the dealer bid"], "ans": "B", "expl": "Governments often issue bonds through an auction. Bidders submit bids that specify the lowest yield that they will accept for a specified\namount in bonds. For instance, a dealer may bid a yield of 3% for $10 million face value of two-year bonds. Bids are ranked from lowest to\nhighest in terms of yield, but the yield accepted by the issuer is usually some type of average from the bids submitted.\nA single-price auction means that all winning bidders pay the same price for the bonds (ie, they receive the same yield). Bids can be submitted\non a competitive or a noncompetitive basis. Competitive bidders may not receive bonds if their bids are higher than the lowest accepted yield.\n(Choice A) A noncompetitive bid means that the bidder simply wants bonds, regardless of price. Noncompetitive bidders agree to take bonds at\nthe issuer-accepted yield, so they always receive bonds from the issue.\n(Choice C) A single-price auction means that all winners receive bonds at the same price, regardless of the price that they submitted. In a multi-\nprice auction, winning bidders receive bonds at the yield that they bid, so winners pay different prices.\nThings to remember:\nGovernments often issue bonds through an auction and bidders can submit competitive or noncompetitive bids. A competitive bidder risks not\nreceiving bonds if its bid is not accepted, while a noncompetitive bidder wants a specified amount of bonds and agrees to accept them at the yield\naccepted by the issuer.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 7, "q": "With respect to the supply of fixed-rate and floating-rate debt, which of the following statements is most accurate?", "opts": ["Consumer banks prefer to make fixed-rate loans.", "Consumer finance companies prefer to issue floating-rate debt.", "Corporate borrowers expecting higher rates prefer to issue floating-rate bonds."], "ans": "B", "expl": "The supply of fixed-rate and floating-rate debt results from lenders attempting to match the type of interest rate they receive from assets to the\ntype of interest rate they pay for liabilities. In general, institutions seek to match fixed to fixed and floating to floating since doing so mitigates\ninterest rate risk.\nConsumer finance companies extend short-term loans, so the interest earned on their loan assets may vary greatly over time. Therefore,\nthese companies prefer to issue floating-rate debt to finance their own operations.\n(Choice A) Consumer banks are funded by accepting checking (ie, demand), savings, and money market deposits from customers and by selling\ncertificates of deposit. These short-term sources are liabilities for the bank, and their rates change frequently. To match their interest patterns,\nbanks prefer to make floating-rate loans.\n(Choice C) Corporations expecting lower interest rates prefer to issue floating-rate bonds so their future financing costs will be lower.\nThings to remember:\nFor interest rates paid on liabilities and received on assets, institutions seek to match fixed to fixed and floating to floating to mitigate interest rate\nrisk. Therefore, consumer finance companies and companies expecting lower rates prefer to issue floating-rate debt. Likewise, banks that have\nshort-term variable liabilities prefer to make floating-rate loans.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 8, "q": "A bond that trades in the secondary market is most likely transacted:", "opts": ["through an auction.", "on an organized exchange.", "in the over-the-counter markets."], "ans": "C", "expl": "While some government and very active corporate bonds do trade on an exchange (Choice B), the great majority of bonds are bought and sold\nin the over-the-counter (OTC) markets.\nAn exchange is a central location where all orders are processed, whereas the OTC markets have no specific location: buyers and sellers are\nconnected by various trading platforms that form a communications network.\n(Choice A) Auctions are primarily used with new-issue sovereign government bonds.\nThings to remember:\nWhile some government and very active corporate bonds do trade on an exchange, the great majority of bonds are bought and sold in the over-\nthe-counter markets.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 9, "q": "A Japanese corporation makes a public offering of EUR-denominated bonds in the French domestic bond market. From a French investor's perspective, these securities are most likely considered:", "opts": ["Eurobonds.", "foreign bonds.", "domestic bonds."], "ans": "B", "expl": "Geographic classification of bonds\nDomestic bonds Foreign bonds Eurobonds\nIssuer Same as country\nDifferent from country of issuance\ndomicile of issuance\nCurrency Domestic (local) currency Foreign currency\nJurisdiction Domestic legal, regulatory, and tax rules Numerous exemptions\nForeign bonds are debt securities issued in the domestic market by foreign-domiciled issuers. The securities are denominated in the local\ncurrency and are subject to local laws, regulations, and taxes. Foreign issuers issue such securities to reduce currency risk for earnings of\ndomestic subsidiaries and/or to gain access to capital at attractive interest rates.\nIn this scenario, the debt of the Japanese corporation issued in France and denominated in EUR, which is the local currency where the bond is\nissued, is considered a foreign bond in the French bond market.\n(Choice A) Eurobonds are debt securities issued outside of the issuer's domestic market; they are issued in one country and denominated in the\ncurrency of another. Eurobonds have numerous exemptions from local rules, regulations, and taxes that often result in lower capital costs relative\nto domestic bond issues. Most issuers raising capital outside of their own domestic markets do so in the Eurobond markets.\n(Choice C) Domestic bonds are debt securities issued within the country in which the issuer is domiciled and denominated in that country's\ncurrency. These issues are subject to local laws, regulations, and taxes. Most issued debt securities are domestic bonds.\nThings to remember:\nWhen classifying bonds by geography, there are three categories: domestic bonds, foreign bonds, and Eurobonds. Foreign bonds are debt\nsecurities issued in the domestic market by a foreign-domiciled issuer. The securities are denominated in the local currency of the country where\nthey are issued and are subject to its local laws, regulations, and taxes.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 10, "q": "Which of the following abilities is most likely an advantage for an institutional investor participating in a bond private placement?", "opts": ["Influencing the terms of the transaction", "Immediately reselling the bonds for a quick profit", "Conducting extensive due diligence to confidently take a large portfolio position"], "ans": "A", "expl": "Corporate bond private placements\nAdvantages Disadvantages\nInfluence the structure of the transaction Restricted/unregistered securities\nInfluence covenants, collateral, etc. Riskier than most alternatives\nInvestor Higher return potential Very limited secondary market liquidity\nResearch intensive\nSmall offering size limits attractiveness\nReduced regulation and disclosure Small offering size\nIssuer Low issuance cost Higher yields\nCan quickly come to market\nCompanies use many methods to issue securities when raising capital. In a private placement, bonds are sold directly to a limited number of\nqualified investors through a privately negotiated transaction. Common investors in private placements include pension funds and insurance\ncompanies.\nPrivate placements have several features that make them attractive to issuers, including reduced regulatory and disclosure requirements (eg, the\noffering is often unregistered). These features result in lower issuance costs and an ability to come to the market more quickly.\nInvestors are attracted to the higher return potential of private placements and the ability to exert considerable influence on bond structure,\ncollateral (ie, pledged assets), and covenants. Investors must balance these factors against the higher risks, research demands, limited liquidity,\nand relatively small portfolio impact of these deals.\n(Choice B) Since private placements are usually illiquid and come with resale restrictions, an investor is generally not able to sell immediately\nafter purchase for a quick profit.\n(Choice C) Even with extensive due diligence, the relatively small size of private placements limits an institutional investor's ability to take a large\nposition.\nThings to remember:\nIn a private placement, bonds are sold directly to a limited number of qualified investors through a privately negotiated transaction. Investors are\nprimarily attracted by the higher return potential and the ability to exert considerable influence on bond structure, collateral, and covenants.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 11, "q": "For floating-rate debt, the reference rate most likely:", "opts": ["defines the periodic reset of the spread.", "depends mainly on the issuer's creditworthiness.", "determines borrowing cost variation after issuance."], "ans": "C", "expl": "A floating-rate bond pays a coupon that is equal to a variable reference rate (eg, LIBOR) plus a constant spread over the reference rate. The\nspread is based on the issuer's creditworthiness, is set when the bond is created, and remains the same throughout the life of the bond. The\nhigher the spread, the lower the issuer's creditworthiness.\nIn contrast, the choice of reference rate reflects the relevant market interest rate but does not depend on the creditworthiness of the issuer\n(Choice B). The reference rate resets each period, which causes the coupon rate of the bond to \"float\" with the market rate. As a result, the\nreference rate determines the variation in the borrowing cost for the issuer after the bond has been issued, by defining the periodic reset of\nthe floating rate (not the spread) (Choice A).\nThings to remember:\nA floating-rate coupon is equal to a variable reference rate plus a constant spread, which is based on the issuer's creditworthiness. The spread is\nset at issuance and does not change or periodically reset. Variation in the issuer's borrowing cost is due to changes in the reference rate over\ntime.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 12, "q": "Compared with broad equity indexes (eg, STOXX Europe 600, S&P 500), broad fixed-income indexes covering the same geographic region most likely:", "opts": ["have fewer constituents.", "exhibit greater constituent turnover.", "are equally weighted rather than market-value-weighted."], "ans": "B", "expl": "Fixed-income indexes vs. equity indexes\nFixed income Equity\nNational governments\nRegional/local governments\nTypes of issuers Corporations\nGovernment agencies\nCorporations\nNumber of issues Multiple issues per issuer Usually only 1 class of common equity\nIssues mature\nConstituent turnover Securities last for life of issuer\nNew issues are more frequent\nWeighting Usually market value Usually market capitalization\nBroad fixed-income indexes perform the same functions for debt markets as broad equity indexes perform for stock markets. Both provide a\nmeans of tracking risk and return in different securities markets. Fixed-income indexes facilitate the evaluation of relative performance for\ndifferent markets and the sectors within those markets. Indexes also serve as benchmarks for assessing the performance of investment\nmanagers and implementing indexed investment strategies.\nBroad fixed-income indexes differ from broad equity indexes in several significant ways. Fixed-income indexes usually contain many more\nsecurities (ie, constituents) since there are more types of issuers for debt securities (eg, governments, agencies, corporations) compared with\nequities, which are issued only by corporations. Furthermore, most debt issuers have multiple issues outstanding, while most corporations have\nonly one class of common equity outstanding (Choice A).\nThere is also much greater turnover of constituent securities in fixed-income indexes. This is due to:\nthe more frequent issuance of new securities, which are added to the index, and\nthe finite life of most bonds, which results in issues being removed from the index.\nFixed-income indexes are usually market-value weighted, so the turnover of constituents results in these indexes reflecting changes in the\ncomposition over time (Choice C).\nThings to remember:\nBroad fixed-income indexes provide a means of tracking risk and return in different securities markets. Such indexes also serve as benchmarks\nfor assessing investment manager performance and implementing indexed investment strategies. Compared with equity indexes, fixed-income\nindexes have more constituent securities and greater constituent turnover.\nDescribe types of fixed-income indexes", "qhtml": null}];
const CFG = {"title": "Wiley · Fixed-Income Issuance and Trading", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 12 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
