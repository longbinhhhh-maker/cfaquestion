mpson has gained a reputation for offering unique products and services. Sampson&#x27;s market share has been increasing, and its net profit margin is among the highest in its industry.<\/p><p>Zone, Inc., (&quot;Zone&quot;) is a small privately held network solutions company in the southwestern United States. Zone is profitable, and almost entirely equity financed. Drew Smith, Sampson&#x27;s CFO, is evaluating a potential acquisition of Zone in a leveraged buyout. In his analysis, Smith makes several adjustments to Zone&#x27;s financial statements as detailed below:<\/p><p>Adjustment 1: Zone&#x27;s owner/CEO received a compensation package of $1.2 million including bonus. This is consistent with CEO compensation packages at other firms. Smith considers the current management team to be very competent and does not anticipate any major changes; however, he increases the estimate for compensation expense to $1.5 million.<\/p><p>Adjustment 2: Zone has long-term leases on all of its facilities. The lease rates were negotiated before the real estate market collapsed recently. Smith adjusts the leasing cost downward by $3 million.<\/p><p>Adjustment 3: Zone has purchased fractional ownership in a corporate jet for its CEO. The benefit, with an annual cost of $350,000, is deemed to be excessive by market standards and Smith adjusts the cost estimate by that amount.<\/p><p>Exhibit 1 shows projections of selected financial data for Zone for the next year.<\/p><p><b>Exhibit 1: Selected Financial Information (Estimates) for Zone, Inc.<\/b><\/p><div class=\"tbl\"><table><tr><td>Item<\/td><td>$ Millions<\/td><\/tr><tr><td>Normalized EBITDA<\/td><td>32<\/td><\/tr><tr><td>Depreciation<\/td><td>11<\/td><\/tr><tr><td>SG&amp;A expense<\/td><td>8<\/td><\/tr><\/table><\/div><p>Net income<\/p><p>Capital expenditure<\/p><div class=\"tbl\"><table><tr><td>Working capital expense<\/td><td>5<\/td><\/tr><tr><td>Interest expense<\/td><td>2<\/td><\/tr><\/table><\/div><p>Note: Zone&#x27;s tax rate is expected to be 25%.<\/p><p>Sampson Aerospace recently announced that it is reducing its investment return assumption on its pension assets from 6% to 5%, and that it has entered negotiations to possibly acquire controlling equity interests in communications software firms, NavTech and Aerospace Communications. NavTech recently has decided to capitalize a significant portion of its research and development expense, and Aerospace Communications has restructured and reclassified many of its leases from operating to financial leases. Smith recently announced that Sampson had dropped out of negotiations with Knowledge Technologies, claiming it was likely not a sustainable business model.<\/p><p>Consensus forecasts for NavTech and Aerospace Communications are presented in Exhibit 2.<\/p><p><b>Exhibit 2: Selected Financial Data for NavTech and Aerospace Communications<\/b><\/p><p>NavTech Aerospace Comm.<\/p><div class=\"tbl\"><table><tr><td>Expected year-end dividend per share<\/td><td>$1.07<\/td><td>$0.55<\/td><\/tr><tr><td>Expected year-end free cash flow to equity per share<\/td><td>$0.80<\/td><td>$1.25<\/td><\/tr><tr><td>Weighted average cost of capital<\/td><td>10%<\/td><td>9%<\/td><\/tr><tr><td>Required return on equity<\/td><td>12%<\/td><td>12%<\/td><\/tr><tr><td>Current stock price<\/td><td>$21.40<\/td><td>$25<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Assuming that NavTech is valued according to the constant growth dividend model, the market expectation of dividend growth implied by NavTech&#x27;s current stock price is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 31, "q": "Johnson prefers to use free cash flow analysis to value investments. Which of the following statements is least accurate in describing the advantages of free cash flow valuation models?", "opts": ["Accounting issues limit the usefulness of reported earnings, while free cash flow is adjusted for these issues.", "Determining free cash flow is easier than dividends.", "A company must generate free cash flow to grow in the long run."], "ans": "B", "expl": "An analyst must review the cash flows from a company's operating, investing, and financing activities to generate a useful free cash flow, while dividends are simply set by the board of directors. Analysts use free cash flow whenever an investor takes a control perspective, such as in the event of an acquisition. The P/E model is considered weak because accounting issues can impact earnings. Companies that do not generate free cash flow in the long run are in financial trouble. For Further Reference: (Study Session 11, Module 28.1, LOS 28.a)", "explhtml": "<p>An analyst must review the cash flows from a company&#x27;s operating, investing, and financing activities to generate a useful free cash flow, while dividends are simply set by the board of directors. Analysts use free cash flow whenever an investor takes a control perspective, such as in the event of an acquisition. The P/E model is considered weak because accounting issues can impact earnings. Companies that do not generate free cash flow in the long run are in financial trouble.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.1, LOS 28.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Ivan Johnson is reviewing the investment merits of BioTLab, a fast-growing biotechnology company. BioTLab has developed several drugs, which are being licensed to major drug companies. BioTLab also has several drugs in phase III trials (phase III trials are the last testing stage before FDA approval). Johnson notes that two drugs recently received approval which should provide BioTLab solid revenue growth and generate predictable cash flow well into the future. Based on the potential for the two drugs, BioTLab&#x27;s estimated annual cash flow growth rate for the next two years is 25%, and long-term growth is expected to be 12%. Because of BioTLab&#x27;s attractive investment opportunities, the company does not pay a dividend. BioTLab&#x27;s current weighted average cost of capital is 15% and its stock is currently trading at $50 per share. The following is financial information for BioTLab for the most recent 12 months:<\/p><p>Net working capital excluding cash increased from $7,460,000 to $9,985,000. Book value increased from $81,250,000 to $101,250,000. BioTLab currently has no debt. Research facilities and production equipment were purchased for $8,450,000. BioTLab held non-operating assets in the amount of $875,000. Net income for the 12 months was $20,000,000. BioTLab has a marginal tax rate of 40%. Noncash charges for depreciation and restructuring for the 12 months were $1,250,000.<\/p><p>BioTLab&#x27;s management has indicated an interest in establishing a dividend and will fund new drug research by issuing additional debt.<\/p><p>Johnson also reviews a competitor to BioTLab, Groh Group, which has a larger segment operating in a highly cyclical business. The Groh Group has a debt to equity ratio of 1.0 and pays no dividends. In addition, Groh Group plans to issue bonds in the coming year.<\/p><\/div><\/details><div class=\"qtext\"><p>Johnson prefers to use free cash flow analysis to value investments. Which of the following statements is least accurate in describing the advantages of free cash flow valuation models?<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "Using a two-stage, free cash flow to the firm model, determine which of the following is closest to the value of BioTLab.", "opts": ["$419 million.", "$436 million.", "$477 million."], "ans": "C", "expl": "Free cash flow to the firm (FCFF) can be calculated in many ways but in this question, you are given enough information to calculate the measure in the following way: FCFF = net income + non-cash charges + interest (1 − t) − fixed capital investment − working capital investment FCFF = 20,000,000 + 1,250,000 + 0 − 8,450,000 − (9,985,000 − 7,460,000) = 10,275,000 0 The next step is to forecast the future FCFFs and the terminal value: FCFF = 10,275,000(1.25) = 12,843,750 1 FCFF = 12,843,750(1.25) = 16,054,688 2 terminal value = 16,054,688(1.12) / (0.15 – 0.12) = 599,375,000 Next, calculate the present value of the FCFFs and the terminal value: If a firm has non-operating assets (e.g., land held for investment) on its balance sheet, the value of these assets must be added to the value of the operating assets (determined using the present value of the FCFFs and terminal value) to find the total firm value. total firm value = value of operating assets + value of non-operating assets total firm value = 476,521,739 + 875,000 = 477,396,739 For Further Reference: (Study Session 11, Module 28.5, LOS 28.j)", "explhtml": "<p>Free cash flow to the firm (FCFF) can be calculated in many ways but in this question, you are given enough information to calculate the measure in the following way:<\/p><p>FCFF = net income + non-cash charges + interest (1 − t) − fixed capital investment − working capital investment<\/p><p>FCFF  = 20,000,000 + 1,250,000 + 0 − 8,450,000 − (9,985,000 − 7,460,000) = 10,275,000 0<\/p><p>The next step is to forecast the future FCFFs and the terminal value:<\/p><p>FCFF  = 10,275,000(1.25) = 12,843,750 1<\/p><p>FCFF  = 12,843,750(1.25) = 16,054,688 2<\/p><p>terminal value = 16,054,688(1.12) / (0.15 – 0.12) = 599,375,000<\/p><p>Next, calculate the present value of the FCFFs and the terminal value:<\/p><p>If a firm has non-operating assets (e.g., land held for investment) on its balance sheet, the value of these assets must be added to the value of the operating assets (determined using the present value of the FCFFs and terminal value) to find the total firm value.<\/p><p>total firm value = value of operating assets + value of non-operating assets total firm value = 476,521,739 + 875,000 = 477,396,739<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.5, LOS 28.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ivan Johnson is reviewing the investment merits of BioTLab, a fast-growing biotechnology company. BioTLab has developed several drugs, which are being licensed to major drug companies. BioTLab also has several drugs in phase III trials (phase III trials are the last testing stage before FDA approval). Johnson notes that two drugs recently received approval which should provide BioTLab solid revenue growth and generate predictable cash flow well into the future. Based on the potential for the two drugs, BioTLab&#x27;s estimated annual cash flow growth rate for the next two years is 25%, and long-term growth is expected to be 12%. Because of BioTLab&#x27;s attractive investment opportunities, the company does not pay a dividend. BioTLab&#x27;s current weighted average cost of capital is 15% and its stock is currently trading at $50 per share. The following is financial information for BioTLab for the most recent 12 months:<\/p><p>Net working capital excluding cash increased from $7,460,000 to $9,985,000. Book value increased from $81,250,000 to $101,250,000. BioTLab currently has no debt. Research facilities and production equipment were purchased for $8,450,000. BioTLab held non-operating assets in the amount of $875,000. Net income for the 12 months was $20,000,000. BioTLab has a marginal tax rate of 40%. Noncash charges for depreciation and restructuring for the 12 months were $1,250,000.<\/p><p>BioTLab&#x27;s management has indicated an interest in establishing a dividend and will fund new drug research by issuing additional debt.<\/p><p>Johnson also reviews a competitor to BioTLab, Groh Group, which has a larger segment operating in a highly cyclical business. The Groh Group has a debt to equity ratio of 1.0 and pays no dividends. In addition, Groh Group plans to issue bonds in the coming year.<\/p><\/div><\/details><div class=\"qtext\"><p>Using a two-stage, free cash flow to the firm model, determine which of the following is closest to the value of BioTLab.<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "If BioTLab establishes a dividend and issues additional debt, the most likely effect on FCFF will be:", "opts": ["no effect.", "a decrease in FCFF.", "an increase in FCFF."], "ans": "A", "expl": "If BioTLab established a dividend there would be no impact on either FCFF or FCFE. Changing the company capital structure by increasing debt will not impact FCFF, although it will initially increase FCFE by the amount of debt issued and then reduce FCFE thereafter by the after-tax interest expense. For Further Reference: (Study Session 11, Module 28.5, LOS 28.g)", "explhtml": "<p>If BioTLab established a dividend there would be no impact on either FCFF or FCFE. Changing the company capital structure by increasing debt will not impact FCFF, although it will initially increase FCFE by the amount of debt issued and then reduce FCFE thereafter by the after-tax interest expense.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.5, LOS 28.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ivan Johnson is reviewing the investment merits of BioTLab, a fast-growing biotechnology company. BioTLab has developed several drugs, which are being licensed to major drug companies. BioTLab also has several drugs in phase III trials (phase III trials are the last testing stage before FDA approval). Johnson notes that two drugs recently received approval which should provide BioTLab solid revenue growth and generate predictable cash flow well into the future. Based on the potential for the two drugs, BioTLab&#x27;s estimated annual cash flow growth rate for the next two years is 25%, and long-term growth is expected to be 12%. Because of BioTLab&#x27;s attractive investment opportunities, the company does not pay a dividend. BioTLab&#x27;s current weighted average cost of capital is 15% and its stock is currently trading at $50 per share. The following is financial information for BioTLab for the most recent 12 months:<\/p><p>Net working capital excluding cash increased from $7,460,000 to $9,985,000. Book value increased from $81,250,000 to $101,250,000. BioTLab currently has no debt. Research facilities and production equipment were purchased for $8,450,000. BioTLab held non-operating assets in the amount of $875,000. Net income for the 12 months was $20,000,000. BioTLab has a marginal tax rate of 40%. Noncash charges for depreciation and restructuring for the 12 months were $1,250,000.<\/p><p>BioTLab&#x27;s management has indicated an interest in establishing a dividend and will fund new drug research by issuing additional debt.<\/p><p>Johnson also reviews a competitor to BioTLab, Groh Group, which has a larger segment operating in a highly cyclical business. The Groh Group has a debt to equity ratio of 1.0 and pays no dividends. In addition, Groh Group plans to issue bonds in the coming year.<\/p><\/div><\/details><div class=\"qtext\"><p>If BioTLab establishes a dividend and issues additional debt, the most likely effect on FCFF will be:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Which model would be most appropriate in valuing the Groh Group?", "opts": ["FCFF model.", "FCFE model.", "Dividend Discount model."], "ans": "A", "expl": "The FCFF model is better than the FCFE model in valuing debt laden, cyclical companies, and companies with a changing capital structure. Since Groh Group does not pay a dividend, the DDM model would be the least appropriate model to value the company. For Further Reference: (Study Session 11, Module 28.1, LOS 28.a, 28.g)", "explhtml": "<p>The FCFF model is better than the FCFE model in valuing debt laden, cyclical companies, and companies with a changing capital structure. Since Groh Group does not pay a dividend, the DDM model would be the least appropriate model to value the company.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.1, LOS 28.a, 28.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ivan Johnson is reviewing the investment merits of BioTLab, a fast-growing biotechnology company. BioTLab has developed several drugs, which are being licensed to major drug companies. BioTLab also has several drugs in phase III trials (phase III trials are the last testing stage before FDA approval). Johnson notes that two drugs recently received approval which should provide BioTLab solid revenue growth and generate predictable cash flow well into the future. Based on the potential for the two drugs, BioTLab&#x27;s estimated annual cash flow growth rate for the next two years is 25%, and long-term growth is expected to be 12%. Because of BioTLab&#x27;s attractive investment opportunities, the company does not pay a dividend. BioTLab&#x27;s current weighted average cost of capital is 15% and its stock is currently trading at $50 per share. The following is financial information for BioTLab for the most recent 12 months:<\/p><p>Net working capital excluding cash increased from $7,460,000 to $9,985,000. Book value increased from $81,250,000 to $101,250,000. BioTLab currently has no debt. Research facilities and production equipment were purchased for $8,450,000. BioTLab held non-operating assets in the amount of $875,000. Net income for the 12 months was $20,000,000. BioTLab has a marginal tax rate of 40%. Noncash charges for depreciation and restructuring for the 12 months were $1,250,000.<\/p><p>BioTLab&#x27;s management has indicated an interest in establishing a dividend and will fund new drug research by issuing additional debt.<\/p><p>Johnson also reviews a competitor to BioTLab, Groh Group, which has a larger segment operating in a highly cyclical business. The Groh Group has a debt to equity ratio of 1.0 and pays no dividends. In addition, Groh Group plans to issue bonds in the coming year.<\/p><\/div><\/details><div class=\"qtext\"><p>Which model would be most appropriate in valuing the Groh Group?<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Ten years have passed and BioTLab's drug pipeline has generated the expected growth. To support BioTLab's growth, the company levered its balance sheet to a debt-to-equity ratio of 35% by borrowing an additional $1.6 million during the last year, even as it paid total interest of $4 million. Still, the company generated $20 million in free cash flow to equity. The company's tax rate is 40% and pretax interest rate is 6%. The company's required rate of return on equity equals 13%. Using a single-stage FCFF model results in a value of $483,508,770. The expected growth rate in BioTLab's free cash flows is closest to:", "opts": ["6%.", "8%.", "10%."], "ans": "A", "expl": "WACC = (0.35 / 1.35)(0.06)(1 − 0.40) + (1 / 1.35)(0.13) = 10.56% g = 0.06 For Further Reference: (Study Session 11, Module 28.5, LOS 28.j)", "explhtml": "<p>WACC = (0.35 / 1.35)(0.06)(1 − 0.40) + (1 / 1.35)(0.13) = 10.56%<\/p><p>g = 0.06<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.5, LOS 28.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ivan Johnson is reviewing the investment merits of BioTLab, a fast-growing biotechnology company. BioTLab has developed several drugs, which are being licensed to major drug companies. BioTLab also has several drugs in phase III trials (phase III trials are the last testing stage before FDA approval). Johnson notes that two drugs recently received approval which should provide BioTLab solid revenue growth and generate predictable cash flow well into the future. Based on the potential for the two drugs, BioTLab&#x27;s estimated annual cash flow growth rate for the next two years is 25%, and long-term growth is expected to be 12%. Because of BioTLab&#x27;s attractive investment opportunities, the company does not pay a dividend. BioTLab&#x27;s current weighted average cost of capital is 15% and its stock is currently trading at $50 per share. The following is financial information for BioTLab for the most recent 12 months:<\/p><p>Net working capital excluding cash increased from $7,460,000 to $9,985,000. Book value increased from $81,250,000 to $101,250,000. BioTLab currently has no debt. Research facilities and production equipment were purchased for $8,450,000. BioTLab held non-operating assets in the amount of $875,000. Net income for the 12 months was $20,000,000. BioTLab has a marginal tax rate of 40%. Noncash charges for depreciation and restructuring for the 12 months were $1,250,000.<\/p><p>BioTLab&#x27;s management has indicated an interest in establishing a dividend and will fund new drug research by issuing additional debt.<\/p><p>Johnson also reviews a competitor to BioTLab, Groh Group, which has a larger segment operating in a highly cyclical business. The Groh Group has a debt to equity ratio of 1.0 and pays no dividends. In addition, Groh Group plans to issue bonds in the coming year.<\/p><\/div><\/details><div class=\"qtext\"><p>Ten years have passed and BioTLab&#x27;s drug pipeline has generated the expected growth. To support BioTLab&#x27;s growth, the company levered its balance sheet to a debt-to-equity ratio of 35% by borrowing an additional $1.6 million during the last year, even as it paid total interest of $4 million. Still, the company generated $20 million in free cash flow to equity. The company&#x27;s tax rate is 40% and pretax interest rate is 6%. The company&#x27;s required rate of return on equity equals 13%. Using a single-stage FCFF model results in a value of $483,508,770. The expected growth rate in BioTLab&#x27;s free cash flows is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "Which of the following statements regarding free cash flow models is least likely correct?", "opts": ["Sensitivity analysis indicates that the FCFE model’s valuation of BioTLab’s common stock is most sensitive to the company’s growth rate.", "FCFE is net income plus depreciation minus net capital expenditures minus the increase in working capital plus net new debt financing.", "FCFF can be inflated by increasing capital expenditures relative to depreciation."], "ans": "C", "expl": "FCFF can be inflated by decreasing capital expenditures relative to depreciation. All other statements are true. For Further Reference: (Study Session 11, Module 28.5, LOS 28.e, 28.g)", "explhtml": "<p>FCFF can be inflated by decreasing capital expenditures relative to depreciation. All other statements are true.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.5, LOS 28.e, 28.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ivan Johnson is reviewing the investment merits of BioTLab, a fast-growing biotechnology company. BioTLab has developed several drugs, which are being licensed to major drug companies. BioTLab also has several drugs in phase III trials (phase III trials are the last testing stage before FDA approval). Johnson notes that two drugs recently received approval which should provide BioTLab solid revenue growth and generate predictable cash flow well into the future. Based on the potential for the two drugs, BioTLab&#x27;s estimated annual cash flow growth rate for the next two years is 25%, and long-term growth is expected to be 12%. Because of BioTLab&#x27;s attractive investment opportunities, the company does not pay a dividend. BioTLab&#x27;s current weighted average cost of capital is 15% and its stock is currently trading at $50 per share. The following is financial information for BioTLab for the most recent 12 months:<\/p><p>Net working capital excluding cash increased from $7,460,000 to $9,985,000. Book value increased from $81,250,000 to $101,250,000. BioTLab currently has no debt. Research facilities and production equipment were purchased for $8,450,000. BioTLab held non-operating assets in the amount of $875,000. Net income for the 12 months was $20,000,000. BioTLab has a marginal tax rate of 40%. Noncash charges for depreciation and restructuring for the 12 months were $1,250,000.<\/p><p>BioTLab&#x27;s management has indicated an interest in establishing a dividend and will fund new drug research by issuing additional debt.<\/p><p>Johnson also reviews a competitor to BioTLab, Groh Group, which has a larger segment operating in a highly cyclical business. The Groh Group has a debt to equity ratio of 1.0 and pays no dividends. In addition, Groh Group plans to issue bonds in the coming year.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements regarding free cash flow models is least likely correct?<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Calculate the value of the Bratton bonds using the interest rate tree.", "opts": ["100.218.", "100.378.", "100.915."], "ans": "C", "expl": "Interest rate tree: Discount maturity value back one year at different 1-year forward rates, then take the equally weighted average of those values discounted back to today at today's 1-year rate: V = 0.5 × [(108 / 1.08530) + 8] / 1.0725 + 0.5 × [(108 / 1.06983) + 8] / 1.0725 V = 0.5 × (99.512 + 8) / 1.0725 + 0.5 × (100.951 + 8) / 1.0725 V = 50.122 + 50.793 = 100.915 Today Year 1 Year 2 108 107.512 100.915 108 108.951 108 For Further Reference: (Study Session 12, Module 33.1, LOS 33.d)", "explhtml": "<p>Interest rate tree: Discount maturity value back one year at different 1-year forward rates, then take the equally weighted average of those values discounted back to today at today&#x27;s 1-year rate:<\/p><p>V = 0.5 × [(108 / 1.08530) + 8] / 1.0725 + 0.5 × [(108 / 1.06983) + 8] / 1.0725<\/p><p>V = 0.5 × (99.512 + 8) / 1.0725 + 0.5 × (100.951 + 8) / 1.0725<\/p><p>V = 50.122 + 50.793 = 100.915<\/p><div class=\"tbl\"><table><tr><td>Today<\/td><td>Year 1<\/td><td>Year 2<\/td><\/tr><tr><td>108<\/td><td><\/td><td><\/td><\/tr><tr><td>107.512<\/td><td><\/td><td><\/td><\/tr><tr><td>100.915<\/td><td>108<\/td><td><\/td><\/tr><tr><td>108.951<\/td><td><\/td><td><\/td><\/tr><tr><td>108<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 33.1, LOS 33.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<\/summary><div class=\"vig-body\"><p>Mike Diffle has been asked to evaluate the bonds of Hardin, Inc. The specific issue Diffle is considering has an 8% annual coupon and matures in two years. The bonds are currently callable at 101, and beginning in six months, they are callable at par. Bratton Corporation, Hardin&#x27;s competitor, also has bonds outstanding which are identical to Hardin&#x27;s except that they are not callable. Diffle believes the AA rating of both bonds is an accurate reflection of their credit risk. Diffle is wondering if the Bratton bonds might be a better investment than the Hardin bonds. Assume that the following 1-year interest rate tree is used to value bonds with a maturity of up to three years (this tree assumes interest rate volatility of 10%).<\/p><div class=\"tbl\"><table><tr><td>Today<\/td><td>Year 1<\/td><td>Year 2<\/td><\/tr><tr><td>9.324%<\/td><td><\/td><td><\/td><\/tr><tr><td>8.530%<\/td><td><\/td><td><\/td><\/tr><tr><td>7.250%<\/td><td>7.634%<\/td><td><\/td><\/tr><tr><td>6.983%<\/td><td><\/td><td><\/td><\/tr><tr><td>6.250%<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Also, assume that the appropriate spot rates for securities maturing in one, two, and three years are 7.25%, 7.5%, and 7.80%, respectively.<\/p><p>Diffle believes he should begin his analysis with the option-free Bratton bonds. He decides to consider two different approaches to valuing the Bratton Bonds—one that uses the current spot rate curve and another that uses the interest rate tree given above.<\/p><p>For the next step in his analysis, Diffle has decided to calculate the value of the Hardin bonds using the interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Diffle summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo. In this memo, Diffle makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The value of the option embedded in the Hardin bonds can be derived by simply subtracting the<\/td><\/tr><tr><td>interest rate tree value of the Hardin bonds from the interest rate tree value of the Bratton bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>I am concerned that the 10% volatility assumption used to develop the interest rate tree might be<\/td><\/tr><tr><td>too low. A higher volatility assumption would result in a lower value for the Hardin bonds.<\/td><td><\/td><\/tr><\/table><\/div><p>After reviewing Diffle&#x27;s analysis, Puldo notes that Diffle has not included any information on the option adjusted spread (OAS) for the Hardin bonds. Puldo suggests that Diffle should evaluate the OAS in order to get an idea of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish the analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle starts out with the benchmark interest rate tree and estimated OAS for both bonds. Then he shocks interest rates up and down by 25 basis points throughout the tree and adds the OAS estimated earlier. Using the tree and standard backward induction process, Diffle calculates values for the bonds. He plans to use these values as inputs into the following formulas for duration and convexity: Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one.<\/p><\/div><\/details><div class=\"qtext\"><p>Calculate the value of the Bratton bonds using the interest rate tree.<\/p><\/div>", "subj": "fixed"}, {"n": 38, "q": "Using the interest rate tree, and assuming that the bonds will be called at any node of the tree where the calculated value exceeds the call price, which of the following is closest to the value of the Hardin bonds?", "opts": ["100.472.", "100.915.", "101.358."], "ans": "A", "expl": "Use the same method as in the previous problem, but remember that if the value at one node exceeds the call price, then the call price should be used for that node. In this case, the value at the lower node would be 108 / 1.06983 = 100.951. The assumption is that the bond would be called at the call price one year from now, or 100. V = 0.5 × (99.512 + 8) / 1.0725 + 0.5 × (100 + 8) / 1.0725 V = 50.122 + 50.350 = 100.472 For Further Reference: (Study Session 13, Module 34.2, LOS 34.f)", "explhtml": "<p>Use the same method as in the previous problem, but remember that if the value at one node exceeds the call price, then the call price should be used for that node. In this case, the value at the lower node would be 108 / 1.06983 = 100.951. The assumption is that the bond would be called at the call price one year from now, or 100.<\/p><p>V = 0.5 × (99.512 + 8) / 1.0725 + 0.5 × (100 + 8) / 1.0725<\/p><p>V = 50.122 + 50.350 = 100.472<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.2, LOS 34.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Diffle has been asked to evaluate the bonds of Hardin, Inc. The specific issue Diffle is considering has an 8% annual coupon and matures in two years. The bonds are currently callable at 101, and beginning in six months, they are callable at par. Bratton Corporation, Hardin&#x27;s competitor, also has bonds outstanding which are identical to Hardin&#x27;s except that they are not callable. Diffle believes the AA rating of both bonds is an accurate reflection of their credit risk. Diffle is wondering if the Bratton bonds might be a better investment than the Hardin bonds. Assume that the following 1-year interest rate tree is used to value bonds with a maturity of up to three years (this tree assumes interest rate volatility of 10%).<\/p><div class=\"tbl\"><table><tr><td>Today<\/td><td>Year 1<\/td><td>Year 2<\/td><\/tr><tr><td>9.324%<\/td><td><\/td><td><\/td><\/tr><tr><td>8.530%<\/td><td><\/td><td><\/td><\/tr><tr><td>7.250%<\/td><td>7.634%<\/td><td><\/td><\/tr><tr><td>6.983%<\/td><td><\/td><td><\/td><\/tr><tr><td>6.250%<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Also, assume that the appropriate spot rates for securities maturing in one, two, and three years are 7.25%, 7.5%, and 7.80%, respectively.<\/p><p>Diffle believes he should begin his analysis with the option-free Bratton bonds. He decides to consider two different approaches to valuing the Bratton Bonds—one that uses the current spot rate curve and another that uses the interest rate tree given above.<\/p><p>For the next step in his analysis, Diffle has decided to calculate the value of the Hardin bonds using the interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Diffle summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo. In this memo, Diffle makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The value of the option embedded in the Hardin bonds can be derived by simply subtracting the<\/td><\/tr><tr><td>interest rate tree value of the Hardin bonds from the interest rate tree value of the Bratton bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>I am concerned that the 10% volatility assumption used to develop the interest rate tree might be<\/td><\/tr><tr><td>too low. A higher volatility assumption would result in a lower value for the Hardin bonds.<\/td><td><\/td><\/tr><\/table><\/div><p>After reviewing Diffle&#x27;s analysis, Puldo notes that Diffle has not included any information on the option adjusted spread (OAS) for the Hardin bonds. Puldo suggests that Diffle should evaluate the OAS in order to get an idea of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish the analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle starts out with the benchmark interest rate tree and estimated OAS for both bonds. Then he shocks interest rates up and down by 25 basis points throughout the tree and adds the OAS estimated earlier. Using the tree and standard backward induction process, Diffle calculates values for the bonds. He plans to use these values as inputs into the following formulas for duration and convexity: Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the interest rate tree, and assuming that the bonds will be called at any node of the tree where the calculated value exceeds the call price, which of the following is closest to the value of the Hardin bonds?<\/p><\/div>", "subj": "fixed"}, {"n": 39, "q": "Indicate whether the statements made by Diffle in his memo regarding the value of the embedded option and the effect of the volatility assumption are correct.", "opts": ["Only the statement regarding the value of the embedded option is correct.", "Only the statement regarding the effect of the volatility assumption is correct.", "Both statements are correct."], "ans": "C", "expl": "Statement 1 is correct. The value of the option would be the difference between the value calculated with no call feature (the Bratton bonds) and the value calculated assuming the bond is callable (the Hardin bonds). Recall that the vignette stated the Bratton and Hardin bonds were identical except for the call feature in the Hardin bonds. The option value would therefore be: 100.915 − 100.472 = 0.443. Statement 2 is also correct. Increased volatility would increase the value of the option, thus lowering the value of the callable bond. For Further Reference: (Study Session 13, Module 34.1, LOS 34.b, 34.h)", "explhtml": "<p>Statement 1 is correct. The value of the option would be the difference between the value calculated with no call feature (the Bratton bonds) and the value calculated assuming the bond is callable (the Hardin bonds). Recall that the vignette stated the Bratton and Hardin bonds were identical except for the call feature in the Hardin bonds. The option value would therefore be: 100.915 − 100.472 = 0.443. Statement 2 is also correct. Increased volatility would increase the value of the option, thus lowering the value of the callable bond.<\/ re the calculated value exceeds the call price. Diffle summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo. In this memo, Diffle makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The value of the option embedded in the Hardin bonds can be derived by simply subtracting the<\/td><\/tr><tr><td>interest rate tree value of the Hardin bonds from the interest rate tree value of the Bratton bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>I am concerned that the 10% volatility assumption used to develop the interest rate tree might be<\/td><\/tr><tr><td>too low. A higher volatility assumption would result in a lower value for the Hardin bonds.<\/td><td><\/td><\/tr><\/table><\/div><p>After reviewing Diffle&#x27;s analysis, Puldo notes that Diffle has not included any information on the option adjusted spread (OAS) for the Hardin bonds. Puldo suggests that Diffle should evaluate the OAS in order to get an idea of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish the analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle starts out with the benchmark interest rate tree and estimated OAS for both bonds. Then he shocks interest rates up and down by 25 basis points throughout the tree and adds the OAS estimated earlier. Using the tree and standard backward induction process, Diffle calculates values for the bonds. He plans to use these values as inputs into the following formulas for duration and convexity: Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one.<\/p><\/div><\/details><div class=\"qtext\"><p>Indicate whether the statements made by Diffle in his memo regarding the value of the embedded option and the effect of the volatility assumption are correct.<\/p><\/div>", "subj": "fixed"}, {"n": 40, "q": "Which of the following most accurately critiques the OAS discussion between Diffle and Puldo? Puldo is:", "opts": ["correct that the OAS will provide insight into the liquidity risk of the Hardin bonds, and Diffle is correct that different volatility assumptions would change the OAS.", "correct that the OAS will provide insight into the liquidity risk of the Hardin Bonds, but Diffle is incorrect since OAS implicitly adjusts for the volatility of interest rates.", "incorrect that the OAS will provide insight into the liquidity risk of the Hardin Bonds, but Diffle is correct that different volatility assumptions would change the OAS."], "ans": "A", "expl": "The OAS accounts for compensation for credit and liquidity risk after the optionality has been removed (i.e., after cash flows have been adjusted). Since in this case the credit risk of the bonds is similar, the OAS could prove helpful in evaluating the relative liquidity risk. OAS will be affected by different assumptions regarding the volatility of interest rates. For Further Reference: (Study Session 13, Module 34.4, LOS 34.g)", "explhtml": "<p>The OAS accounts for compensation for credit and liquidity risk after the optionality has been removed (i.e., after cash flows have been adjusted). Since in this case the credit risk of the bonds is similar, the OAS could prove helpful in evaluating the relative liquidity risk. OAS will be affected by different assumptions regarding the volatility of interest rates.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.4, LOS 34.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vi of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish the analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle starts out with the benchmark interest rate tree and estimated OAS for both bonds. Then he shocks interest rates up and down by 25 basis points throughout the tree and adds the OAS estimated earlier. Using the tree and standard backward induction process, Diffle calculates values for the bonds. He plans to use these values as inputs into the following formulas for duration and convexity: Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one.<\/p><\/div><\/details><div class=\"qtext\"><p>With regards to Puldo&#x27;s statement about comparability of duration of the two bonds, which of the following statements is most accurate? Bratton bonds&#x27; duration would be:<\/p><\/div>", "subj": "fixed"}, {"n": 42, "q": "Which of the following statements is most accurate regarding Diffle's calculation of duration and convexity?", "opts": ["The duration estimate will be inaccurate since it does not account for any change in cash flows due to the call option embedded in the Hardin bond.", "The duration estimate for the Bratton bonds will reflect the projected percentage change in price for a 100-basis-point change in interest rates.", "The estimates for both duration and convexity will be inaccurate because the OAS was not estimated again after the rate shock."], "ans": "B", "expl": "The duration formula given will calculate the percentage change in price for a 100-basis-point change in yield, regardless of the actual change in rates used to derive BV and BV . The standard backward induction process would ensure that – + the derived values of BV and BV reflect any potential change in cash flows due to embedded options. – + For Further Reference: (Study Session 13, Module 34.5, LOS 34.i)", "explhtml": "<p>The duration formula given will calculate the percentage change in price for a 100-basis-point change in yield, regardless of the actual change in rates used to derive BV  and BV . The standard backward induction process would ensure that<\/p><div class=\"tbl\"><table><tr><td>–<\/td><td>+<\/td><\/tr><\/table><\/div><p>the derived values of BV  and BV  reflect any potential change in cash flows due to embedded options.<\/p><div class=\"tbl\"><table><tr><td>–<\/td><td>+<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.5, LOS 34.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Diffle has been asked to evaluate the bonds of Hardin, Inc. The specific issue Diffle is considering has an 8% annual coupon and matures in two years. The bonds are currently callable at 101, and beginning in six months, they are callable at par. Bratton Corporation, Hardin&#x27;s competitor, also has bonds outstanding which are identical to Hardin&#x27;s except that they are not callable. Diffle believes the AA rating of both bonds is an accurate reflection of their credit risk. Diffle is wondering if the Bratton bonds might be a better investment than the Hardin bonds. Assume that the following 1-year interest rate tree is used to value bonds with a maturity of up to three years (this tree assumes interest rate volatility of 10%).<\/p><div class=\"tbl\"><table><tr><td>Today<\/td><td>Year 1<\/td><td>Year 2<\/td><\/tr><tr><td>9.324%<\/td><td><\/td><td><\/td><\/tr><tr><td>8.530%<\/td><td><\/td><td><\/td><\/tr><tr><td>7.250%<\/td><td>7.634%<\/td><td><\/td><\/tr><tr><td>6.983%<\/td><td><\/td><td><\/td><\/tr><tr><td>6.250%<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Also, assume that the appropriate spot rates for securities maturing in one, two, and three years are 7.25%, 7.5%, and 7.80%, respectively.<\/p><p>Diffle believes he should begin his analysis with the option-free Bratton bonds. He decides to consider two different approaches to valuing the Bratton Bonds—one that uses the current spot rate curve and another that uses the interest rate tree given above.<\/p><p>For the next step in his analysis, Diffle has decided to calculate the value of the Hardin bonds using the interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Diffle summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo. In this memo, Diffle makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The value of the option embedded in the Hardin bonds can be derived by simply subtracting the<\/td><\/tr><tr><td>interest rate tree value of the Hardin bonds from the interest rate tree value of the Bratton bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>I am concerned that the 10% volatility assumption used to develop the interest rate tree might be<\/td><\/tr><tr><td>too low. A higher volatility assumption would result in a lower value for the Hardin bonds.<\/td><td><\/td><\/tr><\/table><\/div><p>After reviewing Diffle&#x27;s analysis, Puldo notes that Diffle has not included any information on the option adjusted spread (OAS) for the Hardin bonds. Puldo suggests that Diffle should evaluate the OAS in order to get an idea of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish the analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle starts out with the benchmark interest rate tree and estimated OAS for both bonds. Then he shocks interest rates up and down by 25 basis points throughout the tree and adds the OAS estimated earlier. Using the tree and standard backward induction process, Diffle calculates values for the bonds. He plans to use these values as inputs into the following formulas for duration and convexity: Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements is most accurate regarding Diffle&#x27;s calculation of duration and convexity?<\/p><\/div>", "subj": "fixed"}, {"n": 43, "q": "Which of the following statements regarding the delta of the BIC options is correct? (Assume that the largest delta is defined as the delta furthest from zero.)", "opts": ["Call C has the largest delta of all the BIC options.", "Put D has the smallest delta of all the BIC options.", "Put F has the largest delta of all the BIC options."], "ans": "C", "expl": "An option that is deep in-the-money will have the largest delta. Call options that are deep in-the-money will have a delta close to one, while put options that are deep in-the-money will have a delta close to –1. Options that are out-of-the-money will have deltas close to zero. Put F is the option that is deepest in-the-money, and therefore has the largest delta (even though it is negative, the change in the price of Put F given a change in the price of BIC stock will be larger than any of the other options). Call C is the deepest out-of-the-money option, and thus has the smallest delta. For Further Reference: (Study Session 14, Module 38.7, LOS 38.k)", "explhtml": "<p>An option that is deep in-the-money will have the largest delta. Call options that are deep in-the-money will have a delta close to one, while put options that are deep in-the-money will have a delta close to –1. Options that are out-of-the-money will have deltas close to zero. Put F is the option that is deepest in-the-money, and therefore has the largest delta (even though it is negative, the change in the price of Put F given a change in the price of BIC stock will be larger than any of the other options). Call C is the deepest out-of-the-money option, and thus has the smallest delta.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.7, LOS 38.k)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<\/summary><div class=\"vig-body\"><p>Charles Mabry manages a portfolio of equity investments heavily concentrated in the biotech industry. He just returned from an annual meeting among leading biotech analysts in San Francisco. Mabry and other industry experts agree that the latest industry volatility is a result of questionable product safety testing methodologies. While no firms in the industry have escaped the public attention brought on by the questionable safety testing, one company in particular is expected to receive further attention—Biological Instruments Corporation (BIC), one of several long biotech positions in Mabry&#x27;s portfolio. BIC is not expected to pay dividends in the foreseeable future. Several regulatory agencies as well as public interest groups have heavily criticized the rigor of BIC&#x27;s product safety testing.<\/p><p>In an effort to manage the risk associated with BIC, Mabry has decided to allocate a portion of his portfolio to options on BIC&#x27;s common stock. After surveying the derivatives market, Mabry has identified the following European options on BIC common stock:<\/p><div class=\"tbl\"><table><tr><td>BIC Call Options<\/td><td>BIC Put Options<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>40<\/td><td>October<\/td><td>3.51<\/td><td>30<\/td><td>November<\/td><td>2.31<\/td><\/tr><tr><td>A<\/td><td>D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>50<\/td><td>October<\/td><td>1.98<\/td><td>40<\/td><td>November<\/td><td>4.14<\/td><\/tr><tr><td>B<\/td><td>E<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>60<\/td><td>October<\/td><td>1.42<\/td><td>50<\/td><td>November<\/td><td>9.21<\/td><\/tr><tr><td>C<\/td><td>F<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Note: October options expire on the 21st of the month, while November options expire on the 18th.<\/p><p>Mabry wants to hedge the large BIC equity position in his portfolio, which closed yesterday (June 1) at $42 per share. Since Mabry is relatively inexperienced with utilizing derivatives in his portfolios, Mabry enlists the help of an analyst from another firm, James Grimell.<\/p><p>Mabry and Grimell arrange a meeting in Boston where Mabry discusses his expectations regarding the future returns of BIC&#x27;s equity. Mabry expects BIC equity to make a recovery from the intense market scrutiny but wants to provide his portfolio with a hedge in case BIC has a negative surprise. Grimell makes the following suggestion:<\/p><p>&quot;If you want to avoid selling the BIC position and are willing to earn only the risk-free rate of return, you should sell calls and buy puts on BIC stock with the same market premium. Alternatively, you could buy put options to manage the risk of your portfolio. I recommend waiting until the vega on the options rises, making them less attractive and cheaper to purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements regarding the delta of the BIC options is correct? (Assume that the largest delta is defined as the delta furthest from zero.)<\/p><\/div>", "subj": "derivatives"}, {"n": 44, "q": "If the gamma of Put E is equal to 0.081, which of the following correctly interprets the option's gamma?", "opts": ["The sensitivity of Put E’s price to changes in BIC’s stock price is very likely to change.", "A dynamic hedging strategy using Put E would require infrequent rebalancing.", "A $1.00 increase in BIC’s stock price will increase Put E’s premium by $0.081."], "ans": "A", "expl": "An option's gamma measures the change in the delta for a change in the price of the underlying asset. The gamma of an option is highest when an option is at-the-money since the probability of moving in or out of the money is high. Put E is close to being at-the-money and because it has a gamma of greater than zero, the sensitivity of Put E's price to changes in BIC's stock price (i.e., the delta) is likely to change. The higher the gamma, the greater the change in delta given a change in stock price. For Further Reference: (Study Session 14, Module 38.7, LOS 38.l)", "explhtml": "<p>An option&#x27;s gamma measures the change in the delta for a change in the price of the underlying asset. The gamma of an option is highest when an option is at-the-money since the probability of moving in or out of the money is high. Put E is close to being at-the-money and because it has a gamma of greater than zero, the sensitivity of Put E&#x27;s price to changes in BIC&#x27;s stock price (i.e., the delta) is likely to change. The higher the gamma, the greater the change in delta given a change in stock price.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.7, LOS 38.l)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Charles Mabry manages a portfolio of equity investments heavily concentrated in the biotech industry. He just returned from an annual meeting among leading biotech analysts in San Francisco. Mabry and other industry experts agree that the latest industry volatility is a result of questionable product safety testing methodologies. While no firms in the industry have escaped the public attention brought on by the questionable safety testing, one company in particular is expected to receive further attention—Biological Instruments Corporation (BIC), one of several long biotech positions in Mabry&#x27;s portfolio. BIC is not expected to pay dividends in the foreseeable future. Several regulatory agencies as well as public interest groups have heavily criticized the rigor of BIC&#x27;s product safety testing.<\/p><p>In an effort to manage the risk associated with BIC, Mabry has decided to allocate a portion of his portfolio to options on BIC&#x27;s common stock. After surveying the derivatives market, Mabry has identified the following European options on BIC common stock:<\/p><div class=\"tbl\"><table><tr><td>BIC Call Options<\/td><td>BIC Put Options<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>40<\/td><td>October<\/td><td>3.51<\/td><td>30<\/td><td>November<\/td><td>2.31<\/td><\/tr><tr><td>A<\/td><td>D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>50<\/td><td>October<\/td><td>1.98<\/td><td>40<\/td><td>November<\/td><td>4.14<\/td><\/tr><tr><td>B<\/td><td>E<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>60<\/td><td>October<\/td><td>1.42<\/td><td>50<\/td><td>November<\/td><td>9.21<\/td><\/tr><tr><td>C<\/td><td>F<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Note: October options expire on the 21st of the month, while November options expire on the 18th.<\/p><p>Mabry wants to hedge the large BIC equity position in his portfolio, which closed yesterday (June 1) at $42 per share. Since Mabry is relatively inexperienced with utilizing derivatives in his portfolios, Mabry enlists the help of an analyst from another firm, James Grimell.<\/p><p>Mabry and Grimell arrange a meeting in Boston where Mabry discusses his expectations regarding the future returns of BIC&#x27;s equity. Mabry expects BIC equity to make a recovery from the intense market scrutiny but wants to provide his portfolio with a hedge in case BIC has a negative surprise. Grimell makes the following suggestion:<\/p><p>&quot;If you want to avoid selling the BIC position and are willing to earn only the risk-free rate of return, you should sell calls and buy puts on BIC stock with the same market premium. Alternatively, you could buy put options to manage the risk of your portfolio. I recommend waiting until the vega on the options rises, making them less attractive and cheaper to purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>If the gamma of Put E is equal to 0.081, which of the following correctly interprets the option&#x27;s gamma?<\/p><\/div>", "subj": "derivatives"}, {"n": 45, "q": "Assuming that on October 15, the closing price of BIC common stock is $40 per share, how would the delta of Put F have changed from June 1?", "opts": ["The delta on Put F will move closer to –1.", "The delta on Put F will move closer to 0.", "The delta on Put F will move closer to 1."], "ans": "A", "expl": "As the option moves further into the money and as the expiration date approaches, the delta of a put option moves closer to –1. For Further Reference: (Study Session 14, Module 38.7, LOS 38.k)", "explhtml": "<p>As the option moves further into the money and as the expiration date approaches, the delta of a put option moves closer to –1.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.7, LOS 38.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Charles Mabry manages a portfolio of equity investments heavily concentrated in the biotech industry. He just returned from an annual meeting among leading biotech analysts in San Francisco. Mabry and other industry experts agree that the latest industry volatility is a result of questionable product safety testing methodologies. While no firms in the industry have escaped the public attention brought on by the questionable safety testing, one company in particular is expected to receive further attention—Biological Instruments Corporation (BIC), one of several long biotech positions in Mabry&#x27;s portfolio. BIC is not expected to pay dividends in the foreseeable future. Several regulatory agencies as well as public interest groups have heavily criticized the rigor of BIC&#x27;s product safety testing.<\/p><p>In an effort to manage the risk associated with BIC, Mabry has decided to allocate a portion of his portfolio to options on BIC&#x27;s common stock. After surveying the derivatives market, Mabry has identified the following European options on BIC common stock:<\/p><div class=\"tbl\"><table><tr><td>BIC Call Options<\/td><td>BIC Put Options<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>40<\/td><td>October<\/td><td>3.51<\/td><td>30<\/td><td>November<\/td><td>2.31<\/td><\/tr><tr><td>A<\/td><td>D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>50<\/td><td>October<\/td><td>1.98<\/td><td>40<\/td><td>November<\/td><td>4.14<\/td><\/tr><tr><td>B<\/td><td>E<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>60<\/td><td>October<\/td><td>1.42<\/td><td>50<\/td><td>November<\/td><td>9.21<\/td><\/tr><tr><td>C<\/td><td>F<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Note: October options expire on the 21st of the month, while November options expire on the 18th.<\/p><p>Mabry wants to hedge the large BIC equity position in his portfolio, which closed yesterday (June 1) at $42 per share. Since Mabry is relatively inexperienced with utilizing derivatives in his portfolios, Mabry enlists the help of an analyst from another firm, James Grimell.<\/p><p>Mabry and Grimell arrange a meeting in Boston where Mabry discusses his expectations regarding the future returns of BIC&#x27;s equity. Mabry expects BIC equity to make a recovery from the intense market scrutiny but wants to provide his portfolio with a hedge in case BIC has a negative surprise. Grimell makes the following suggestion:<\/p><p>&quot;If you want to avoid selling the BIC position and are willing to earn only the risk-free rate of return, you should sell calls and buy puts on BIC stock with the same market premium. Alternatively, you could buy put options to manage the risk of your portfolio. I recommend waiting until the vega on the options rises, making them less attractive and cheaper to purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming that on October 15, the closing price of BIC common stock is $40 per share, how would the delta of Put F have changed from June 1?<\/p><\/div>", "subj": "derivatives"}, {"n": 46, "q": "If the premium on Put D on November 1 is $3.18, which of the following has most likely occurred?", "opts": ["The price of BIC stock has decreased to $26.82.", "BIC had a negative earnings surprise.", "Volatility of BIC stock has decreased."], "ans": "B", "expl": "The premium on Put D has risen from $2.31 to $3.18 and there is still time left until expiration. Therefore, the increase in value must have come from either a decrease in stock price, an increase in volatility, or both of these events. Choice A would be correct if the option was at expiration and the $3.18 represented only intrinsic value. Since we are not yet at the expiration date, the stock price must be above $26.82. A negative earnings surprise would most likely cause a drop in the market price of the stock. Since there is no indication of the exact amount of the drop in price, the premium observed is a possibility. A decrease in BIC volatility would reduce the put premium, not increase it. For Further Reference: (Study Session 14, Module 38.7, LOS 38.k)", "explhtml": "<p>The premium on Put D has risen from $2.31 to $3.18 and there is still time left until expiration. Therefore, the increase in value must have come from either a decrease in stock price, an increase in volatility, or both of these events. Choice A would be correct if the option was at expiration and the $3.18 represented only intrinsic value. Since we are not yet at the expiration date, the stock price must be above $26.82. A negative earnings surprise would most likely cause a drop in the market price of the stock. Since there is no indication of the exact amount of the drop in price, the premium observed is a possibility. A decrease in BIC volatility would reduce the put premium, not increase it.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.7, LOS 38.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Charles Mabry manages a portfolio of equity investments heavily concentrated in the biotech industry. He just returned from an annual meeting among leading biotech analysts in San Francisco. Mabry and other industry experts agree that the latest industry volatility is a result of questionable product safety testing methodologies. While no firms in the industry have escaped the public attention brought on by the questionable safety testing, one company in particular is expected to receive further attention—Biological Instruments Corporation (BIC), one of several long biotech positions in Mabry&#x27;s portfolio. BIC is not expected to pay dividends in the foreseeable future. Several regulatory agencies as well as public interest groups have heavily criticized the rigor of BIC&#x27;s product safety testing.<\/p><p>In an effort to manage the risk associated with BIC, Mabry has decided to allocate a portion of his portfolio to options on BIC&#x27;s common stock. After surveying the derivatives market, Mabry has identified the following European options on BIC common stock:<\/p><div class=\"tbl\"><table><tr><td>BIC Call Options<\/td><td>BIC Put Options<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>40<\/td><td>October<\/td><td>3.51<\/td><td>30<\/td><td>November<\/td><td>2.31<\/td><\/tr><tr><td>A<\/td><td>D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>50<\/td><td>October<\/td><td>1.98<\/td><td>40<\/td><td>November<\/td><td>4.14<\/td><\/tr><tr><td>B<\/td><td>E<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>60<\/td><td>October<\/td><td>1.42<\/td><td>50<\/td><td>November<\/td><td>9.21<\/td><\/tr><tr><td>C<\/td><td>F<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Note: October options expire on the 21st of the month, while November options expire on the 18th.<\/p><p>Mabry wants to hedge the large BIC equity position in his portfolio, which closed yesterday (June 1) at $42 per share. Since Mabry is relatively inexperienced with utilizing derivatives in his portfolios, Mabry enlists the help of an analyst from another firm, James Grimell.<\/p><p>Mabry and Grimell arrange a meeting in Boston where Mabry discusses his expectations regarding the future returns of BIC&#x27;s equity. Mabry expects BIC equity to make a recovery from the intense market scrutiny but wants to provide his portfolio with a hedge in case BIC has a negative surprise. Grimell makes the following suggestion:<\/p><p>&quot;If you want to avoid selling the BIC position and are willing to earn only the risk-free rate of return, you should sell calls and buy puts on BIC stock with the same market premium. Alternatively, you could buy put options to manage the risk of your portfolio. I recommend waiting until the vega on the options rises, making them less attractive and cheaper to purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>If the premium on Put D on November 1 is $3.18, which of the following has most likely occurred?<\/p><\/div>", "subj": "derivatives"}, {"n": 47, "q": "Given Mabry's assessment of the risks associated with BIC, which option strategy would be the most effective in delta- neutral hedging the risk of BIC stock?", "opts": ["Add put options to the portfolio as the put option delta moves closer to zero.", "Add call options to the portfolio as the call option delta moves further away from zero.", "Add put options to the portfolio as the put option delta moves toward –1."], "ans": "A", "expl": "To protect a portfolio against an expected decrease in the value of a long equity position, put options can be purchased (i.e., a protective put strategy). The number of puts to purchase depends on the hedge ratio, which depends on the option's delta. As a put option's delta moves closer to zero, the put becomes a less-effective hedging instrument, so we need to use more of them. Thus, we must add additional put options to the portfolio as the put option delta moves closer to zero. For Further Reference: (Study Session 14, Module 38.7, LOS 38.l)", "explhtml": "<p>To protect a portfolio against an expected decrease in the value of a long equity position, put options can be purchased (i.e., a protective put strategy). The number of puts to purchase depends on the hedge ratio, which depends on the option&#x27;s delta. As a put option&#x27;s delta moves closer to zero, the put becomes a less-effective hedging instrument, so we need to use more of them. Thus, we must add additional put options to the portfolio as the put option delta moves closer to zero.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.7, LOS 38.l)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Charles Mabry manages a portfolio of equity investments heavily concentrated in the biotech industry. He just returned from an annual meeting among leading biotech analysts in San Francisco. Mabry and other industry experts agree that the latest industry volatility is a result of questionable product safety testing methodologies. While no firms in the industry have escaped the public attention brought on by the questionable safety testing, one company in particular is expected to receive further attention—Biological Instruments Corporation (BIC), one of several long biotech positions in Mabry&#x27;s portfolio. BIC is not expected to pay dividends in the foreseeable future. Several regulatory agencies as well as public interest groups have heavily criticized the rigor of BIC&#x27;s product safety testing.<\/p><p>In an effort to manage the risk associated with BIC, Mabry has decided to allocate a portion of his portfolio to options on BIC&#x27;s common stock. After surveying the derivatives market, Mabry has identified the following European options on BIC common stock:<\/p><div class=\"tbl\"><table><tr><td>BIC Call Options<\/td><td>BIC Put Options<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>40<\/td><td>October<\/td><td>3.51<\/td><td>30<\/td><td>November<\/td><td>2.31<\/td><\/tr><tr><td>A<\/td><td>D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>50<\/td><td>October<\/td><td>1.98<\/td><td>40<\/td><td>November<\/td><td>4.14<\/td><\/tr><tr><td>B<\/td><td>E<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>60<\/td><td>October<\/td><td>1.42<\/td><td>50<\/td><td>November<\/td><td>9.21<\/td><\/tr><tr><td>C<\/td><td>F<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Note: October options expire on the 21st of the month, while November options expire on the 18th.<\/p><p>Mabry wants to hedge the large BIC equity position in his portfolio, which closed yesterday (June 1) at $42 per share. Since Mabry is relatively inexperienced with utilizing derivatives in his portfolios, Mabry enlists the help of an analyst from another firm, James Grimell.<\/p><p>Mabry and Grimell arrange a meeting in Boston where Mabry discusses his expectations regarding the future returns of BIC&#x27;s equity. Mabry expects BIC equity to make a recovery from the intense market scrutiny but wants to provide his portfolio with a hedge in case BIC has a negative surprise. Grimell makes the following suggestion:<\/p><p>&quot;If you want to avoid selling the BIC position and are willing to earn only the risk-free rate of return, you should sell calls and buy puts on BIC stock with the same market premium. Alternatively, you could buy put options to manage the risk of your portfolio. I recommend waiting until the vega on the options rises, making them less attractive and cheaper to purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Given Mabry&#x27;s assessment of the risks associated with BIC, which option strategy would be the most effective in delta- neutral hedging the risk of BIC stock?<\/p><\/div>", "subj": "derivatives"}, {"n": 48, "q": "Which of the following correctly analyzes Grimell's comments regarding earning the risk-free rate by selling calls and buying puts, and regarding waiting for the option vegas to increase?", "opts": ["Only Grimell’s statement regarding earning the risk-free rate is correct.", "Only Grimell’s statement regarding waiting for vega to rise is correct.", "Neither of Grimell’s statements is correct."], "ans": "C", "expl": "Grimell is incorrect in both of his statements. Using put-call parity, Mabry could create a position in which he would earn the risk-free rate of return but he would need to sell calls and buy puts with the same strike price, not the same premium. As the vega (volatility relative to price) of an option increases, it would become more sensitive to changes in the volatility of the underlying asset. Therefore, the price would likely rise, not fall. For Further Reference: (Study Session 14, Module 38.7, LOS 38.k)", "explhtml": "<p>Grimell is incorrect in both of his statements. Using put-call parity, Mabry could create a position in which he would earn the risk-free rate of return but he would need to sell calls and buy puts with the same strike price, not the same premium. As the vega (volatility relative to price) of an option increases, it would become more sensitive to changes in the volatility of the underlying asset. Therefore, the price would likely rise, not fall.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.7, LOS 38.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Charles Mabry manages a portfolio of equity investments heavily concentrated in the biotech industry. He just returned from an annual meeting among leading biotech analysts in San Francisco. Mabry and other industry experts agree that the latest industry volatility is a result of questionable product safety testing methodologies. While no firms in the industry have escaped the public attention brought on by the questionable safety testing, one company in particular is expected to receive further attention—Biological Instruments Corporation (BIC), one of several long biotech positions in Mabry&#x27;s portfolio. BIC is not expected to pay dividends in the foreseeable future. Several regulatory agencies as well as public interest groups have heavily criticized the rigor of BIC&#x27;s product safety testing.<\/p><p>In an effort to manage the risk associated with BIC, Mabry has decided to allocate a portion of his portfolio to options on BIC&#x27;s common stock. After surveying the derivatives market, Mabry has identified the following European options on BIC common stock:<\/p><div class=\"tbl\"><table><tr><td>BIC Call Options<\/td><td>BIC Put Options<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><td>Strike<\/td><td>Maturity<\/td><td>Premium<\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>40<\/td><td>October<\/td><td>3.51<\/td><td>30<\/td><td>November<\/td><td>2.31<\/td><\/tr><tr><td>A<\/td><td>D<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>50<\/td><td>October<\/td><td>1.98<\/td><td>40<\/td><td>November<\/td><td>4.14<\/td><\/tr><tr><td>B<\/td><td>E<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Call<\/td><td>Put<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>60<\/td><td>October<\/td><td>1.42<\/td><td>50<\/td><td>November<\/td><td>9.21<\/td><\/tr><tr><td>C<\/td><td>F<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Note: October options expire on the 21st of the month, while November options expire on the 18th.<\/p><p>Mabry wants to hedge the large BIC equity position in his portfolio, which closed yesterday (June 1) at $42 per share. Since Mabry is relatively inexperienced with utilizing derivatives in his portfolios, Mabry enlists the help of an analyst from another firm, James Grimell.<\/p><p>Mabry and Grimell arrange a meeting in Boston where Mabry discusses his expectations regarding the future returns of BIC&#x27;s equity. Mabry expects BIC equity to make a recovery from the intense market scrutiny but wants to provide his portfolio with a hedge in case BIC has a negative surprise. Grimell makes the following suggestion:<\/p><p>&quot;If you want to avoid selling the BIC position and are willing to earn only the risk-free rate of return, you should sell calls and buy puts on BIC stock with the same market premium. Alternatively, you could buy put options to manage the risk of your portfolio. I recommend waiting until the vega on the options rises, making them less attractive and cheaper to purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following correctly analyzes Grimell&#x27;s comments regarding earning the risk-free rate by selling calls and buying puts, and regarding waiting for the option vegas to increase?<\/p><\/div>", "subj": "derivatives"}, {"n": 49, "q": "Which of the following statements regarding Statement 1 in Exhibit 1 is least accurate?", "opts": ["The monthly VaR of $225,000 indicates an annual VaR of $2.7 million.", "The fund will lose more than $225,000 in a month, 5% of th
