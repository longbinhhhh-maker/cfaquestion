the firm.<\/p><p>Rockway Stone has a strict policy of only investing in companies that demonstrate a high level of financial reporting quality. The firm has developed an internal scoring system to rank the quality of a target company&#x27;s financial statements. The scoring system awards points for each incident of low reporting quality; any company that reaches 40 points is not considered for potential investment. The scoring system is shown in Exhibit 1.<\/p><p><b>Exhibit 1: Rockway Stone FR Quality Score Sheet<\/b><\/p><div class=\"tbl\"><table><tr><td>1. Any instance of a change in policy year-to-year or reclassification of assets, liabilities, revenues,<\/td><td>5 points<\/td><\/tr><\/table><\/div><p>or expenses<\/p><div class=\"tbl\"><table><tr><td>2. Any instance from 1 that also results in an increase in total assets<\/td><td>Additional 5<\/td><\/tr><tr><td>points<\/td><td><\/td><\/tr><tr><td>3. Any instance from 1 that also results in an increase in revenue<\/td><td>Additional 10<\/td><\/tr><tr><td>points<\/td><td><\/td><\/tr><tr><td>4. Any indication that earnings are not persistent<\/td><td>5 points<\/td><\/tr><\/table><\/div><p>The first report Kreiger is reviewing is from Tolston Conductors, a firm providing highly polished metals to the technology industry. Kreiger&#x27;s supervisor has instructed Kreiger to focus on the inventory note shown in Exhibit 2.<\/p><p><b>Exhibit 2: Tolston Conductors Extract<\/b><\/p><p>Note 8 – Inventories<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td><\/td><\/tr><tr><td>Raw materials ($&#x27;000)<\/td><td>481<\/td><td>409<\/td><\/tr><tr><td>WIP ($&#x27;000)<\/td><td>1,392<\/td><td>894<\/td><\/tr><tr><td>Finished goods ($&#x27;000)<\/td><td>508<\/td><td>496<\/td><\/tr><\/table><\/div><p>Finished goods are classified as goods that are complete in all respects except packaging. Of the amount of inventory reported as work-in-progress in 2013, $342,000 has been reclassified as &quot;other current assets.&quot; This WIP consisted primarily of highly polished metals that are now to be further reworked and are not expected to be ready for sale for two years.<\/p><p>Kreiger is also reviewing financial statements from Resonator Wellness, a firm producing health and wellness products in the U.K. Extracts from the pro forma financial statement recently released, along with 2013 and 2012 comparables, is shown in Exhibit 3.<\/p><p><b>Exhibit 3: Resonator Wellness Financial Statement – (Extract)<\/b><\/p><p>Headline Operating Profit: Quarter Ending 31 December 2014 (£000)<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td>2012<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>8,380<\/td><td>7,980<\/td><td>7,450<\/td><\/tr><tr><td>Revenue retail outlet sales<\/td><td>1,402.2<\/td><td>3,543.9<\/td><td>3,501.6<\/td><\/tr><tr><td>Online sales<\/td><td>3,086.2<\/td><td>398.9<\/td><td>389.4<\/td><\/tr><tr><td>Headline net income (Note A)<\/td><td>1,262.7<\/td><td>1,104.4<\/td><td>1,086.0<\/td><\/tr><tr><td>Note A: Headline net income excludes settlement costs and network costs. Settlement costs are one-off<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>payments to settle legal procedures; these costs totaled (in £000) 20.0, 22.1, and 24.8 in 2012, 2013, and<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2014, respectively. Network costs related to running the online business totaled (in £000) 202.0, 325.0, and<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>885.5 in 2012, 2013, and 2014, respectively. The financial accounts submitted to our bank in accordance with<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>our loan covenants shows net income after charging both settlement and network costs in accordance with<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>local GAAP.<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Kreiger notes that the financial statements submitted to the firm&#x27;s bankers did indeed report net income correctly in accordance with local GAAP. However, this figure was much less prominent than headline net income, as the GAAP income was disclosed only in the footnotes rather than on the face of the income statement. Kreiger believes that the legal settlements are payments made to dissatisfied customers and are a normal part of business. Kreiger also believes that the increase in network cost is consistent with increased focus on online operations. Resonator&#x27;s required return on stockholders&#x27; equity is 5%.<\/p><p>Krieger&#x27;s final task is to analyze a set of financial statements for AltoJib Plc., a manufacturing and engineering company that is considering delisting. The company has a large number of investments in associates that Kreiger would like to isolate. Rockway Stone&#x27;s approach to isolating the impact of investment in associates is to perform some classic DuPont analysis to calculate ROE. In doing so, net margin and asset turnover (but not financial leverage) are adjusted for the impact of investment in associates.<\/p><p>The information Kreiger has to work with is shown in Exhibit 4 along with Rockway Stone&#x27;s method of isolating the impact of investment in associates on ROE using DuPont analysis.<\/p><p><b>Exhibit 4: AltoJib Plc. Financial Statements (Extracts)<\/b><\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td><\/td><\/tr><tr><td>(£000)<\/td><td>(£000)<\/td><td>(£000)<\/td><td>(£000)<\/td><td><\/td><\/tr><tr><td>Revenue<\/td><td>998.5<\/td><td>918.6<\/td><td>817.6<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>44.4<\/td><td>31.2<\/td><td>26.7<\/td><td><\/td><\/tr><tr><td>Income from associates<\/td><td>17.8<\/td><td>11.2<\/td><td>8.4<\/td><td><\/td><\/tr><tr><td>Total assets<\/td><td>1,260.8 1,166.6 1,043.2 1,012.1<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Investment in associates<\/td><td>101.6<\/td><td>83.8<\/td><td>72.6<\/td><td>64.2<\/td><\/tr><tr><td>Equity<\/td><td>638.4<\/td><td>569.8<\/td><td>542.5<\/td><td>524.2<\/td><\/tr><tr><td>Financial leverage<\/td><td>2.01<\/td><td>1.99<\/td><td>1.93<\/td><td><\/td><\/tr><\/table><\/div><p>Calculation of ROE excluding associates<\/p><p>Net margin is based on net income excluding income from associates. Asset turnover is calculated using average total assets excluding investments in associates. Financial leverage is calculated using average assets and average equity including investments in associates.<\/p><p>Calculation of total ROE<\/p><p>Net margin is based on net income including income from associates. Asset turnover is calculated using average total assets including investments in associates. Financial leverage is calculated using average assets and average equity including investments in associates.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the Rockway Stone approach to calculating ROE measures outlined in Exhibit 4, Kreiger is most likely to conclude that:<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "Assuming International Oilfield is a significantly integrated sales division and virtually all operating, investing, and financing decisions are made by Continental Supply, foreign currency gains and losses that arise from the consolidation of International Oilfield should be reported in:", "opts": ["shareholders’ equity.", "operating cash flow.", "net income."], "ans": "C", "expl": "Assuming International Oilfield is an integrated sales division and Continental Supply makes virtually all of the decisions, the functional currency is likely the presentation currency. Thus, the temporal method is used. Under the temporal method, remeasurement gains and losses are reported in the income statement. For Further Reference: (Study Session 5, Module 15.3, LOS 15.d)", "explhtml": "<p>Assuming International Oilfield is an integrated sales division and Continental Supply makes virtually all of the decisions, the functional currency is likely the presentation currency. Thus, the temporal method is used. Under the temporal method, remeasurement gains and losses are reported in the income statement.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.3, LOS 15.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>In 2009, Continental Supply Company was formed to provide drilling equipment and supplies to contractors and oilfield production companies located throughout the United States. At the end of 2013, Continental Supply created a wholly owned foreign subsidiary, International Oilfield Incorporated, to begin servicing customers located in the North Sea. International Oilfield maintains its financial statements in a currency known as the local currency unit (LCU). Continental Supply follows U.S. GAAP and its presentation currency is the U.S. dollar.<\/p><p>For the years 2013 through 2016, the weighted-average and year-end exchange rates, stated in terms of local currency per U.S. dollar, were as follows:<\/p><p>LCU/$US 2013 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average<\/td><td>0.90<\/td><td>1.05<\/td><td>1.05<\/td><td>1.25<\/td><\/tr><tr><td>Year-end<\/td><td>1.00<\/td><td>1.10<\/td><td>1.00<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>International Oilfield accounts for its inventory using the lower-of-cost-or- market valuation method in conjunction with the first-in, first-out, cost flow assumption. All of the inventory on hand at the beginning of the year was sold during 2016. Inventory remaining at the end of 2016 was acquired evenly throughout the year.<\/p><p>At the beginning of 2014, International Oilfield purchased equipment totaling LCU 975 million when the exchange rate was LCU 1.00 to $1. During 2015, equipment with an original cost of LCU 108 million was totally destroyed in a fire. At the end of 2015, International Oilfield received a LCU 92 million insurance settlement for the loss. On June 30, 2016, International Oilfield purchased equipment totaling LCU 225 million when the exchange rate was LCU 1.25 to $1.<\/p><p>For the years 2015 and 2016, Continental Supply reported International Oilfield revenues in its consolidated income statement of $375 million and $450 million, respectively. There were no inter-company transactions. Following are International Oilfield&#x27;s balance sheets at the end of 2015 and 2016:<\/p><div class=\"tbl\"><table><tr><td>LCU in millions<\/td><td>2016<\/td><td>2015<\/td><\/tr><tr><td>Cash and receivables<\/td><td>120.0 216.0<\/td><td><\/td><\/tr><tr><td>Inventory<\/td><td>631.3 650.4<\/td><td><\/td><\/tr><tr><td>Equipment<\/td><td>820.7 693.6<\/td><td><\/td><\/tr><tr><td>Liabilities (all monetary)<\/td><td>600.0 600.0<\/td><td><\/td><\/tr><tr><td>Capital stock<\/td><td>350.0 350.0<\/td><td><\/td><\/tr><tr><td>Retained earnings<\/td><td>622.0 610.0<\/td><td><\/td><\/tr><\/table><\/div><p>At the end of 2016, International Oilfield&#x27;s retained earnings account was equal to $525 million and, to date, no dividends have been paid. All of International Oilfield&#x27;s capital stock was issued at the end of 2013.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming International Oilfield is a significantly integrated sales division and virtually all operating, investing, and financing decisions are made by Continental Supply, foreign currency gains and losses that arise from the consolidation of International Oilfield should be reported in:<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "Assuming that International Oilfield's equipment is depreciated using the straight-line method over 10 years with no salvage value, calculate the subsidiary's 2016 depreciation expense under the temporal method.", "opts": ["$95.7 million.", "$104.7 million.", "$114.7 million."], "ans": "A", "expl": "International Oilfield is carrying 867 (i.e., 975 – 108) LCU original cost of equipment purchased in 2014 on their books. The 2015 losses due to fire and related insurance settlement do not affect depreciation in 2016 (other than depreciating fewer assets). The new equipment purchased during the year would be depreciated for a half year in 2016. Depreciation will be translated at the historical exchange rate under the temporal method. Equipment Calculation LCU Depreciation Historical Exchange Rate USD Depreciation Originally purchased in 2014 867 / 10 86.7 1 $86.70 Purchased in 2016 (1/2 year) 1/2 × (225 /10) 11.25 1.25 $9.00 Total $95.70 For Further Reference: (Study Session 5, Module 15.3, LOS 15.d)", "explhtml": "<p>International Oilfield is carrying 867 (i.e., 975 – 108) LCU original cost of equipment purchased in 2014 on their books. The 2015 losses due to fire and related insurance settlement do not affect depreciation in 2016 (other than depreciating fewer assets). The new equipment purchased during the year would be depreciated for a half year in 2016. Depreciation will be translated at the historical exchange rate under the temporal method.<\/p><div class=\"tbl\"><table><tr><td>Equipment<\/td><td>Calculation<\/td><td>LCU Depreciation Historical Exchange Rate USD Depreciation<\/td><td><\/td><td><\/td><\/tr><tr><td>Originally purchased in 2014<\/td><td>867 / 10<\/td><td>86.7<\/td><td>1<\/td><td>$86.70<\/td><\/tr><tr><td>Purchased in 2016 (1/2 year) 1/2 × (225 /10)<\/td><td>11.25<\/td><td>1.25<\/td><td>$9.00<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>$95.70<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.3, LOS 15.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In 2009, Continental Supply Company was formed to provide drilling equipment and supplies to contractors and oilfield production companies located throughout the United States. At the end of 2013, Continental Supply created a wholly owned foreign subsidiary, International Oilfield Incorporated, to begin servicing customers located in the North Sea. International Oilfield maintains its financial statements in a currency known as the local currency unit (LCU). Continental Supply follows U.S. GAAP and its presentation currency is the U.S. dollar.<\/p><p>For the years 2013 through 2016, the weighted-average and year-end exchange rates, stated in terms of local currency per U.S. dollar, were as follows:<\/p><p>LCU/$US 2013 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average<\/td><td>0.90<\/td><td>1.05<\/td><td>1.05<\/td><td>1.25<\/td><\/tr><tr><td>Year-end<\/td><td>1.00<\/td><td>1.10<\/td><td>1.00<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>International Oilfield accounts for its inventory using the lower-of-cost-or- market valuation method in conjunction with the first-in, first-out, cost flow assumption. All of the inventory on hand at the beginning of the year was sold during 2016. Inventory remaining at the end of 2016 was acquired evenly throughout the year.<\/p><p>At the beginning of 2014, International Oilfield purchased equipment totaling LCU 975 million when the exchange rate was LCU 1.00 to $1. During 2015, equipment with an original cost of LCU 108 million was totally destroyed in a fire. At the end of 2015, International Oilfield received a LCU 92 million insurance settlement for the loss. On June 30, 2016, International Oilfield purchased equipment totaling LCU 225 million when the exchange rate was LCU 1.25 to $1.<\/p><p>For the years 2015 and 2016, Continental Supply reported International Oilfield revenues in its consolidated income statement of $375 million and $450 million, respectively. There were no inter-company transactions. Following are International Oilfield&#x27;s balance sheets at the end of 2015 and 2016:<\/p><div class=\"tbl\"><table><tr><td>LCU in millions<\/td><td>2016<\/td><td>2015<\/td><\/tr><tr><td>Cash and receivables<\/td><td>120.0 216.0<\/td><td><\/td><\/tr><tr><td>Inventory<\/td><td>631.3 650.4<\/td><td><\/td><\/tr><tr><td>Equipment<\/td><td>820.7 693.6<\/td><td><\/td><\/tr><tr><td>Liabilities (all monetary)<\/td><td>600.0 600.0<\/td><td><\/td><\/tr><tr><td>Capital stock<\/td><td>350.0 350.0<\/td><td><\/td><\/tr><tr><td>Retained earnings<\/td><td>622.0 610.0<\/td><td><\/td><\/tr><\/table><\/div><p>At the end of 2016, International Oilfield&#x27;s retained earnings account was equal to $525 million and, to date, no dividends have been paid. All of International Oilfield&#x27;s capital stock was issued at the end of 2013.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming that International Oilfield&#x27;s equipment is depreciated using the straight-line method over 10 years with no salvage value, calculate the subsidiary&#x27;s 2016 depreciation expense under the temporal method.<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "Compute the cumulative translation adjustment reported on Continental Supply's consolidated balance sheet at the end of 2016, assuming International Oilfield is a relatively self-contained and independent operation of Continental Supply.", "opts": ["–$227 million.", "–$200 million.", "$298 million."], "ans": "A", "expl": "Under the current rate method, gains and losses that occur as a result of the translation process do not show up on the income statement but are instead accumulated in a balance sheet account called the cumulative translation adjustment account (CTA). The translation gain or loss in each year is calculated and added to the account, acting like a running total of translation gains and losses. The CTA is simply an equity account on the balance sheet. To compute the CTA for Continental's balance sheet, force the accounting equation (A = L + E) to balance with the CTA; [(120 million cash and receivables + 631.3 million inventory + 820.7 million equipment − 600 million liabilities) / 1.50] − $350 million capital stock − $525 retained earnings = –$227 million. The LCU 350 capital stock was issued at the end of 2013 at an exchange rate of LCU 1 = $1. The $525 retained earnings figure was given in the text. For Further Reference: (Study Session 5, Module 15.4, LOS 15.d)", "explhtml": "<p>Under the current rate method, gains and losses that occur as a result of the translation process do not show up on the income statement but are instead accumulated in a balance sheet account called the cumulative translation adjustment account (CTA). The translation gain or loss in each year is calculated and added to the account, acting like a running total of translation gains and losses. The CTA is simply an equity account on the balance sheet.<\/p><p>To compute the CTA for Continental&#x27;s balance sheet, force the accounting equation (A = L + E) to balance with the CTA; [(120 million cash and receivables + 631.3 million inventory + 820.7 million equipment − 600 million liabilities) / 1.50] − $350 million capital stock − $525 retained earnings = –$227 million. The LCU 350 capital stock was issued at the end of 2013 at an exchange rate of LCU 1 = $1. The $525 retained earnings figure was given in the text.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.4, LOS 15.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In 2009, Continental Supply Company was formed to provide drilling equipment and supplies to contractors and oilfield production companies located throughout the United States. At the end of 2013, Continental Supply created a wholly owned foreign subsidiary, International Oilfield Incorporated, to begin servicing customers located in the North Sea. International Oilfield maintains its financial statements in a currency known as the local currency unit (LCU). Continental Supply follows U.S. GAAP and its presentation currency is the U.S. dollar.<\/p><p>For the years 2013 through 2016, the weighted-average and year-end exchange rates, stated in terms of local currency per U.S. dollar, were as follows:<\/p><p>LCU/$US 2013 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average<\/td><td>0.90<\/td><td>1.05<\/td><td>1.05<\/td><td>1.25<\/td><\/tr><tr><td>Year-end<\/td><td>1.00<\/td><td>1.10<\/td><td>1.00<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>International Oilfield accounts for its inventory using the lower-of-cost-or- market valuation method in conjunction with the first-in, first-out, cost flow assumption. All of the inventory on hand at the beginning of the year was sold during 2016. Inventory remaining at the end of 2016 was acquired evenly throughout the year.<\/p><p>At the beginning of 2014, International Oilfield purchased equipment totaling LCU 975 million when the exchange rate was LCU 1.00 to $1. During 2015, equipment with an original cost of LCU 108 million was totally destroyed in a fire. At the end of 2015, International Oilfield received a LCU 92 million insurance settlement for the loss. On June 30, 2016, International Oilfield purchased equipment totaling LCU 225 million when the exchange rate was LCU 1.25 to $1.<\/p><p>For the years 2015 and 2016, Continental Supply reported International Oilfield revenues in its consolidated income statement of $375 million and $450 million, respectively. There were no inter-company transactions. Following are International Oilfield&#x27;s balance sheets at the end of 2015 and 2016:<\/p><div class=\"tbl\"><table><tr><td>LCU in millions<\/td><td>2016<\/td><td>2015<\/td><\/tr><tr><td>Cash and receivables<\/td><td>120.0 216.0<\/td><td><\/td><\/tr><tr><td>Inventory<\/td><td>631.3 650.4<\/td><td><\/td><\/tr><tr><td>Equipment<\/td><td>820.7 693.6<\/td><td><\/td><\/tr><tr><td>Liabilities (all monetary)<\/td><td>600.0 600.0<\/td><td><\/td><\/tr><tr><td>Capital stock<\/td><td>350.0 350.0<\/td><td><\/td><\/tr><tr><td>Retained earnings<\/td><td>622.0 610.0<\/td><td><\/td><\/tr><\/table><\/div><p>At the end of 2016, International Oilfield&#x27;s retained earnings account was equal to $525 million and, to date, no dividends have been paid. All of International Oilfield&#x27;s capital stock was issued at the end of 2013.<\/p><\/div><\/details><div class=\"qtext\"><p>Compute the cumulative translation adjustment reported on Continental Supply&#x27;s consolidated balance sheet at the end of 2016, assuming International Oilfield is a relatively self-contained and independent operation of Continental Supply.<\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "Compared to the temporal method, which of the following best describes the impact of the current rate method on International Oilfield's gross profit margin percentage for 2016 when stated in U.S. dollars? The gross profit margin would be:", "opts": ["lower.", "higher.", "the same."], "ans": "B", "expl": "Compared to the temporal method, the current rate method will result in a higher gross profit margin percentage (higher numerator) when the local currency is depreciating as is the case in this scenario (the exchange rate has risen from LCU 1 per $1 to LCU 1.25 per $1; thus, it costs more LCUs to buy $1 which is the result of a depreciating LCU). Under the temporal method, COGS is remeasured at the historic rate; thus, COGS is not impacted by the depreciating currency. Under the current rate method, COGS is translated at the average rate; thus, COGS is lower because of the depreciating currency. Lower COGS results in a higher gross profit margin percentage. For Further Reference: (Study Session 5, Module 15.4, LOS 15.e)", "explhtml": "<p>Compared to the temporal method, the current rate method will result in a higher gross profit margin percentage (higher numerator) when the local currency is depreciating as is the case in this scenario (the exchange rate has risen from LCU 1 per $1 to LCU 1.25 per $1; thus, it costs more LCUs to buy $1 which is the result of a depreciating LCU). Under the temporal method, COGS is remeasured at the historic rate; thus, COGS is not impacted by the depreciating currency. Under the current rate method, COGS is translated at the average rate; thus, COGS is lower because of the depreciating currency. Lower COGS results in a higher gross profit margin percentage.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.4, LOS 15.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In 2009, Continental Supply Company was formed to provide drilling equipment and supplies to contractors and oilfield production companies located throughout the United States. At the end of 2013, Continental Supply created a wholly owned foreign subsidiary, International Oilfield Incorporated, to begin servicing customers located in the North Sea. International Oilfield maintains its financial statements in a currency known as the local currency unit (LCU). Continental Supply follows U.S. GAAP and its presentation currency is the U.S. dollar.<\/p><p>For the years 2013 through 2016, the weighted-average and year-end exchange rates, stated in terms of local currency per U.S. dollar, were as follows:<\/p><p>LCU/$US 2013 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average<\/td><td>0.90<\/td><td>1.05<\/td><td>1.05<\/td><td>1.25<\/td><\/tr><tr><td>Year-end<\/td><td>1.00<\/td><td>1.10<\/td><td>1.00<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>International Oilfield accounts for its inventory using the lower-of-cost-or- market valuation method in conjunction with the first-in, first-out, cost flow assumption. All of the inventory on hand at the beginning of the year was sold during 2016. Inventory remaining at the end of 2016 was acquired evenly throughout the year.<\/p><p>At the beginning of 2014, International Oilfield purchased equipment totaling LCU 975 million when the exchange rate was LCU 1.00 to $1. During 2015, equipment with an original cost of LCU 108 million was totally destroyed in a fire. At the end of 2015, International Oilfield received a LCU 92 million insurance settlement for the loss. On June 30, 2016, International Oilfield purchased equipment totaling LCU 225 million when the exchange rate was LCU 1.25 to $1.<\/p><p>For the years 2015 and 2016, Continental Supply reported International Oilfield revenues in its consolidated income statement of $375 million and $450 million, respectively. There were no inter-company transactions. Following are International Oilfield&#x27;s balance sheets at the end of 2015 and 2016:<\/p><div class=\"tbl\"><table><tr><td>LCU in millions<\/td><td>2016<\/td><td>2015<\/td><\/tr><tr><td>Cash and receivables<\/td><td>120.0 216.0<\/td><td><\/td><\/tr><tr><td>Inventory<\/td><td>631.3 650.4<\/td><td><\/td><\/tr><tr><td>Equipment<\/td><td>820.7 693.6<\/td><td><\/td><\/tr><tr><td>Liabilities (all monetary)<\/td><td>600.0 600.0<\/td><td><\/td><\/tr><tr><td>Capital stock<\/td><td>350.0 350.0<\/td><td><\/td><\/tr><tr><td>Retained earnings<\/td><td>622.0 610.0<\/td><td><\/td><\/tr><\/table><\/div><p>At the end of 2016, International Oilfield&#x27;s retained earnings account was equal to $525 million and, to date, no dividends have been paid. All of International Oilfield&#x27;s capital stock was issued at the end of 2013.<\/p><\/div><\/details><div class=\"qtext\"><p>Compared to the temporal method, which of the following best describes the impact of the current rate method on International Oilfield&#x27;s gross profit margin percentage for 2016 when stated in U.S. dollars? The gross profit margin would be:<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "When remeasuring International Oilfield's 2016 financial statements into the presentation currency, which of the following ratios is not affected by changing exchange rates under the temporal method?", "opts": ["Current ratio.", "Total asset turnover.", "Quick ratio."], "ans": "C", "expl": "Both the numerator (cash + receivables) and denominator (current liabilities) of the quick ratio are remeasured at the current exchange rate under the temporal method. Inventories are ignored in the quick ratio. Since the same rate is used to remeasure both the numerator and denominator, the ratio does not change when stated in the presentation currency. For Further Reference: (Study Session 5, Module 15.3, LOS 15.e)", "explhtml": "<p>Both the numerator (cash + receivables) and denominator (current liabilities) of the quick ratio are remeasured at the current exchange rate under the temporal method. Inventories are ignored in the quick ratio. Since the same rate is used to remeasure both the numerator and denominator, the ratio does not change when stated in the presentation currency.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.3, LOS 15.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In 2009, Continental Supply Company was formed to provide drilling equipment and supplies to contractors and oilfield production companies located throughout the United States. At the end of 2013, Continental Supply created a wholly owned foreign subsidiary, International Oilfield Incorporated, to begin servicing customers located in the North Sea. International Oilfield maintains its financial statements in a currency known as the local currency unit (LCU). Continental Supply follows U.S. GAAP and its presentation currency is the U.S. dollar.<\/p><p>For the years 2013 through 2016, the weighted-average and year-end exchange rates, stated in terms of local currency per U.S. dollar, were as follows:<\/p><p>LCU/$US 2013 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average<\/td><td>0.90<\/td><td>1.05<\/td><td>1.05<\/td><td>1.25<\/td><\/tr><tr><td>Year-end<\/td><td>1.00<\/td><td>1.10<\/td><td>1.00<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>International Oilfield accounts for its inventory using the lower-of-cost-or- market valuation method in conjunction with the first-in, first-out, cost flow assumption. All of the inventory on hand at the beginning of the year was sold during 2016. Inventory remaining at the end of 2016 was acquired evenly throughout the year.<\/p><p>At the beginning of 2014, International Oilfield purchased equipment totaling LCU 975 million when the exchange rate was LCU 1.00 to $1. During 2015, equipment with an original cost of LCU 108 million was totally destroyed in a fire. At the end of 2015, International Oilfield received a LCU 92 million insurance settlement for the loss. On June 30, 2016, International Oilfield purchased equipment totaling LCU 225 million when the exchange rate was LCU 1.25 to $1.<\/p><p>For the years 2015 and 2016, Continental Supply reported International Oilfield revenues in its consolidated income statement of $375 million and $450 million, respectively. There were no inter-company transactions. Following are International Oilfield&#x27;s balance sheets at the end of 2015 and 2016:<\/p><div class=\"tbl\"><table><tr><td>LCU in millions<\/td><td>2016<\/td><td>2015<\/td><\/tr><tr><td>Cash and receivables<\/td><td>120.0 216.0<\/td><td><\/td><\/tr><tr><td>Inventory<\/td><td>631.3 650.4<\/td><td><\/td><\/tr><tr><td>Equipment<\/td><td>820.7 693.6<\/td><td><\/td><\/tr><tr><td>Liabilities (all monetary)<\/td><td>600.0 600.0<\/td><td><\/td><\/tr><tr><td>Capital stock<\/td><td>350.0 350.0<\/td><td><\/td><\/tr><tr><td>Retained earnings<\/td><td>622.0 610.0<\/td><td><\/td><\/tr><\/table><\/div><p>At the end of 2016, International Oilfield&#x27;s retained earnings account was equal to $525 million and, to date, no dividends have been paid. All of International Oilfield&#x27;s capital stock was issued at the end of 2013.<\/p><\/div><\/details><div class=\"qtext\"><p>When remeasuring International Oilfield&#x27;s 2016 financial statements into the presentation currency, which of the following ratios is not affected by changing exchange rates under the temporal method?<\/p><\/div>", "subj": "fsa"}, {"n": 24, "q": "Assume the country where International Oilfield is operating has been experiencing 30% annual inflation over the past three years. Which of the following best describes the effect on Continental's consolidated financial statements for the year ended 2016?", "opts": ["A gain is recognized in the income statement.", "A loss is recognized in the income statement.", "A gain is recognized as a direct adjustment to the balance sheet."], "ans": "A", "expl": "The temporal method is required if the foreign subsidiary is operating in a highly inflationary environment, defined as cumulative inflation of more than 100% in a 3-year period. Compounded inflation of 30% annually for three years is approximately 120% (1.30 − 1). Under the temporal method, remeasurement gains and losses are recognized in the 3 income statement. In this case, International Oilfield has a net monetary liability position (monetary liabilities of 600 million > monetary assets of 120 million). Holding net monetary liabilities denominated in a currency that is depreciating will result in a gain. For Further Reference: (Study Session 5, Module 15.7, LOS 15.g)", "explhtml": "<p>The temporal method is required if the foreign subsidiary is operating in a highly inflationary environment, defined as cumulative inflation of more than 100% in a 3-year period. Compounded inflation of 30% annually for three years is<\/p><div class=\"tbl\"><table><tr><td>approximately 120% (1.30  − 1). Under the temporal method, remeasurement gains and losses are recognized in the<\/td><td>3<\/td><\/tr><\/table><\/div><p>income statement. In this case, International Oilfield has a net monetary liability position (monetary liabilities of 600 million &gt; monetary assets of 120 million). Holding net monetary liabilities denominated in a currency that is depreciating will result in a gain.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.7, LOS 15.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In 2009, Continental Supply Company was formed to provide drilling equipment and supplies to contractors and oilfield production companies located throughout the United States. At the end of 2013, Continental Supply created a wholly owned foreign subsidiary, International Oilfield Incorporated, to begin servicing customers located in the North Sea. International Oilfield maintains its financial statements in a currency known as the local currency unit (LCU). Continental Supply follows U.S. GAAP and its presentation currency is the U.S. dollar.<\/p><p>For the years 2013 through 2016, the weighted-average and year-end exchange rates, stated in terms of local currency per U.S. dollar, were as follows:<\/p><p>LCU/$US 2013 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average<\/td><td>0.90<\/td><td>1.05<\/td><td>1.05<\/td><td>1.25<\/td><\/tr><tr><td>Year-end<\/td><td>1.00<\/td><td>1.10<\/td><td>1.00<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>International Oilfield accounts for its inventory using the lower-of-cost-or- market valuation method in conjunction with the first-in, first-out, cost flow assumption. All of the inventory on hand at the beginning of the year was sold during 2016. Inventory remaining at the end of 2016 was acquired evenly throughout the year.<\/p><p>At the beginning of 2014, International Oilfield purchased equipment totaling LCU 975 million when the exchange rate was LCU 1.00 to $1. During 2015, equipment with an original cost of LCU 108 million was totally destroyed in a fire. At the end of 2015, International Oilfield received a LCU 92 million insurance settlement for the loss. On June 30, 2016, International Oilfield purchased equipment totaling LCU 225 million when the exchange rate was LCU 1.25 to $1.<\/p><p>For the years 2015 and 2016, Continental Supply reported International Oilfield revenues in its consolidated income statement of $375 million and $450 million, respectively. There were no inter-company transactions. Following are International Oilfield&#x27;s balance sheets at the end of 2015 and 2016:<\/p><div class=\"tbl\"><table><tr><td>LCU in millions<\/td><td>2016<\/td><td>2015<\/td><\/tr><tr><td>Cash and receivables<\/td><td>120.0 216.0<\/td><td><\/td><\/tr><tr><td>Inventory<\/td><td>631.3 650.4<\/td><td><\/td><\/tr><tr><td>Equipment<\/td><td>820.7 693.6<\/td><td><\/td><\/tr><tr><td>Liabilities (all monetary)<\/td><td>600.0 600.0<\/td><td><\/td><\/tr><tr><td>Capital stock<\/td><td>350.0 350.0<\/td><td><\/td><\/tr><tr><td>Retained earnings<\/td><td>622.0 610.0<\/td><td><\/td><\/tr><\/table><\/div><p>At the end of 2016, International Oilfield&#x27;s retained earnings account was equal to $525 million and, to date, no dividends have been paid. All of International Oilfield&#x27;s capital stock was issued at the end of 2013.<\/p><\/div><\/details><div class=\"qtext\"><p>Assume the country where International Oilfield is operating has been experiencing 30% annual inflation over the past three years. Which of the following best describes the effect on Continental&#x27;s consolidated financial statements for the year ended 2016?<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "Regarding Smith's adjustments to Zone's financial statements, the most appropriate adjustment is:", "opts": ["Adjustment 1.", "Adjustment 2.", "Adjustment 3."], "ans": "C", "expl": "CEO compensation is consistent with market estimates, so no adjustment is necessary. Long-term leases on facilities are legally binding; hence, no adjustment is necessary until the lease comes up for renewal. Elimination of excessive perks is a valid adjustment. For Further Reference: (Study Session 11, Module 31.2, LOS 31.e)", "explhtml": "<p>CEO compensation is consistent with market estimates, so no adjustment is necessary. Long-term leases on facilities are legally binding; hence, no adjustment is necessary until the lease comes up for renewal. Elimination of excessive perks is a valid adjustment.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 31.2, LOS 31.e)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Sampson Aerospace is a publicly traded U.S. manufacturer. Sampson supplies communication and navigation control systems to manufacturers of airplanes for commercial and government use. The company operates two divisions: (1) Commercial Operations, and (2) Government Operations. Revenues from the Government Operations division comprise 80% of Sampson&#x27;s total company revenues. Revenues for other companies in the industry are also driven primarily by sales to the U.S. government.<\/p><p>Sampson has gained a reputation for offering unique products and services. Sampson&#x27;s market share has been increasing, and its net profit margin is among the highest in its industry.<\/p><p>Zone, Inc., (&quot;Zone&quot;) is a small privately held network solutions company in the southwestern United States. Zone is profitable, and almost entirely equity financed. Drew Smith, Sampson&#x27;s CFO, is evaluating a potential acquisition of Zone in a leveraged buyout. In his analysis, Smith makes several adjustments to Zone&#x27;s financial statements as detailed below:<\/p><p>Adjustment 1: Zone&#x27;s owner/CEO received a compensation package of $1.2 million including bonus. This is consistent with CEO compensation packages at other firms. Smith considers the current management team to be very competent and does not anticipate any major changes; however, he increases the estimate for compensation expense to $1.5 million.<\/p><p>Adjustment 2: Zone has long-term leases on all of its facilities. The lease rates were negotiated before the real estate market collapsed recently. Smith adjusts the leasing cost downward by $3 million.<\/p><p>Adjustment 3: Zone has purchased fractional ownership in a corporate jet for its CEO. The benefit, with an annual cost of $350,000, is deemed to be excessive by market standards and Smith adjusts the cost estimate by that amount.<\/p><p>Exhibit 1 shows projections of selected financial data for Zone for the next year.<\/p><p><b>Exhibit 1: Selected Financial Information (Estimates) for Zone, Inc.<\/b><\/p><div class=\"tbl\"><table><tr><td>Item<\/td><td>$ Millions<\/td><\/tr><tr><td>Normalized EBITDA<\/td><td>32<\/td><\/tr><tr><td>Depreciation<\/td><td>11<\/td><\/tr><tr><td>SG&amp;A expense<\/td><td>8<\/td><\/tr><\/table><\/div><p>Net income<\/p><p>Capital expenditure<\/p><div class=\"tbl\"><table><tr><td>Working capital expense<\/td><td>5<\/td><\/tr><tr><td>Interest expense<\/td><td>2<\/td><\/tr><\/table><\/div><p>Note: Zone&#x27;s tax rate is expected to be 25%.<\/p><p>Sampson Aerospace recently announced that it is reducing its investment return assumption on its pension assets from 6% to 5%, and that it has entered negotiations to possibly acquire controlling equity interests in communications software firms, NavTech and Aerospace Communications. NavTech recently has decided to capitalize a significant portion of its research and development expense, and Aerospace Communications has restructured and reclassified many of its leases from operating to financial leases. Smith recently announced that Sampson had dropped out of negotiations with Knowledge Technologies, claiming it was likely not a sustainable business model.<\/p><p>Consensus forecasts for NavTech and Aerospace Communications are presented in Exhibit 2.<\/p><p><b>Exhibit 2: Selected Financial Data for NavTech and Aerospace Communications<\/b><\/p><p>NavTech Aerospace Comm.<\/p><div class=\"tbl\"><table><tr><td>Expected year-end dividend per share<\/td><td>$1.07<\/td><td>$0.55<\/td><\/tr><tr><td>Expected year-end free cash flow to equity per share<\/td><td>$0.80<\/td><td>$1.25<\/td><\/tr><tr><td>Weighted average cost of capital<\/td><td>10%<\/td><td>9%<\/td><\/tr><tr><td>Required return on equity<\/td><td>12%<\/td><td>12%<\/td><\/tr><tr><td>Current stock price<\/td><td>$21.40<\/td><td>$25<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Smith&#x27;s adjustments to Zone&#x27;s financial statements, the most appropriate adjustment is:<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "For valuation purposes, Zone's expected (first year) FCFF is closest to:", "opts": ["$14 million.", "$15 million.", "$16 million."], "ans": "C", "expl": "Normalized EBITDA 32 (–) Depreciation 11 (=) EBIT 21 Taxes @ 25% 5.25 Operating income after tax 15.75 (+) Depreciation 11 (–) Capex 6 (–) WCInv 5 (=) FCFF 15.75 For Further Reference: (Study Session 11, Module 31.2, LOS 31.e)", "explhtml": "<div class=\"tbl\"><table><tr><td>Normalized EBITDA<\/td><td>32<\/td><\/tr><tr><td>(–) Depreciation<\/td><td>11<\/td><\/tr><tr><td>(=) EBIT<\/td><td>21<\/td><\/tr><tr><td>Taxes @ 25%<\/td><td>5.25<\/td><\/tr><\/table><\/div><p>Operating income after tax 15.75<\/p><div class=\"tbl\"><table><tr><td>(+) Depreciation<\/td><td>11<\/td><\/tr><tr><td>(–) Capex<\/td><td>6<\/td><\/tr><tr><td>(–) WCInv<\/td><td>5<\/td><\/tr><tr><td>(=) FCFF<\/td><td>15.75<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 31.2, LOS 31.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sampson Aerospace is a publicly traded U.S. manufacturer. Sampson supplies communication and navigation control systems to manufacturers of airplanes for commercial and government use. The company operates two divisions: (1) Commercial Operations, and (2) Government Operations. Revenues from the Government Operations division comprise 80% of Sampson&#x27;s total company revenues. Revenues for other companies in the industry are also driven primarily by sales to the U.S. government.<\/p><p>Sampson has gained a reputation for offering unique products and services. Sampson&#x27;s market share has been increasing, and its net profit margin is among the highest in its industry.<\/p><p>Zone, Inc., (&quot;Zone&quot;) is a small privately held network solutions company in the southwestern United States. Zone is profitable, and almost entirely equity financed. Drew Smith, Sampson&#x27;s CFO, is evaluating a potential acquisition of Zone in a leveraged buyout. In his analysis, Smith makes several adjustments to Zone&#x27;s financial statements as detailed below:<\/p><p>Adjustment 1: Zone&#x27;s owner/CEO received a compensation package of $1.2 million including bonus. This is consistent with CEO compensation packages at other firms. Smith considers the current management team to be very competent and does not anticipate any major changes; however, he increases the estimate for compensation expense to $1.5 million.<\/p><p>Adjustment 2: Zone has long-term leases on all of its facilities. The lease rates were negotiated before the real estate market collapsed recently. Smith adjusts the leasing cost downward by $3 million.<\/p><p>Adjustment 3: Zone has purchased fractional ownership in a corporate jet for its CEO. The benefit, with an annual cost of $350,000, is deemed to be excessive by market standards and Smith adjusts the cost estimate by that amount.<\/p><p>Exhibit 1 shows projections of selected financial data for Zone for the next year.<\/p><p><b>Exhibit 1: Selected Financial Information (Estimates) for Zone, Inc.<\/b><\/p><div class=\"tbl\"><table><tr><t
