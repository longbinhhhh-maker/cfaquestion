<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

tive instruments in his investment strategy. Connor frequently uses options to hedge his fund&#x27;s exposure as he builds or liquidates positions in his portfolio since Biogene&#x27;s large positions often take several weeks to acquire. For example, when he identifies a stock to buy, he often buys call options to gain exposure to the stock. As he buys the stock, he sells off the options or allows them to expire. Connor has noticed that the increased volume in the call options often drives the stock price higher for a few days. He has seen a similar negative effect on stock prices when he buys large amounts of put options.<\/p><p>The end of the quarter is just a few days away, and Connor is considering three transactions:<\/p><p>Transaction A: Buying Put Options on Stock A<\/p><p>The Biogene Fund owns 4.9% of the outstanding stock of Company A, but Connor believes the stock is fully valued and plans to sell the entire position. He anticipates that it will take approximately 45 trading days to liquidate the entire Biogene position in Stock A.<\/p><p>Transaction B: Buying Call Options on Stock B<\/p><p>The Biogene Fund owns 5% of the outstanding stock of Company B. Connor believes there is significant appreciation potential for Stock B, but the stock price has dropped in recent weeks. Connor is hoping that by taking an option position, there will be a carryover effect on the stock price before quarter end.<\/p><p>Transaction C: Selling the Biogene Fund&#x27;s Entire Position in Stock C<\/p><p>Connor believes that Stock C is still attractive, but he is selling the stock with the idea that he will repurchase the position next month. The motivation for the transaction is to capture a capital loss that will reduce the Biogene Fund&#x27;s tax expense for the year.<\/p><p>Apple has an investment banking department that is active in initial public offerings (IPOs). George Arnold, CFA, is the senior manager of the IPO department. Arnold approached Connor about Stock D, a new IPO being offered by Apple. Stock D will open trading in two days. Apple had offered the IPO to all of its clients, but approximately 20% of the deal remained unsold. Having read the prospectus, Connor thinks Stock D would be a good fit for his fund, and he expects Stock D to improve his performance in both the short and long term. Connor is not aware of any information related to Stock D beyond that provided in the prospectus. Connor asked to purchase 5% of the IPO, but Arnold limited Biogene&#x27;s share to 2%, explaining:<\/p><p>&quot;With Biogene&#x27;s reputation, any participation will make the unsold shares highly marketable. Further, we may need Biogene to acquire more Stock D shares at a later date if the price does not hold up.&quot;<\/p><p>Connor is disappointed in being limited to 2% of the offering and suggests to Arnold in an email that, given the 2% limitation, Biogene will not participate in the IPO. Arnold responded a few hours later with the following message:<\/p><p>&quot;I have just spoken with Ms. D, the CFO of Stock D. Although it is too late to alter the prospectus, management believes they will receive a large contract from a foreign government that will boost next year&#x27;s sales by 20% or more. I urge you to accept the 2%—you won&#x27;t be sorry!&quot;<\/p><p>After reviewing Arnold&#x27;s email, Connor agrees to the 2% offer.<\/p><\/div><\/details><div class=\"qtext\"><p>By executing Transaction A, Connor is:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "By executing Transaction B, Connor is:", "opts": ["violating the Standards because his option trading can be reasonably expected to affect his quarterly performance.", "not violating the Standards because the option position creates a profit opportunity consistent with Biogene’s clients’ interests.", "not violating the Standards because he believes there is significant appreciation potential in Stock B."], "ans": "A", "expl": "A critical factor in assessing any violation of Standard II( ce Biogene&#x27;s large positions often take several weeks to acquire. For example, when he identifies a stock to buy, he often buys call options to gain exposure to the stock. As he buys the stock, he sells off the options or allows them to expire. Connor has noticed that the increased volume in the call options often drives the stock price higher for a few days. He has seen a similar negative effect on stock prices when he buys large amounts of put options.<\/p><p>The end of the quarter is just a few days away, and Connor is considering three transactions:<\/p><p>Transaction A: Buying Put Options on Stock A<\/p><p>The Biogene Fund owns 4.9% of the outstanding stock of Company A, but Connor believes the stock is fully valued and plans to sell the entire position. He anticipates that it will take approximately 45 trading days to liquidate the entire Biogene position in Stock A.<\/p><p>Transaction B: Buying Call Options on Stock B<\/p><p>The Biogene Fund owns 5% of the outstanding stock of Company B. Connor believes there is significant appreciation potential for Stock B, but the stock price has dropped in recent weeks. Connor is hoping that by taking an option position, there will be a carryover effect on the stock price before quarter end.<\/p><p>Transaction C: Selling the Biogene Fund&#x27;s Entire Position in Stock C<\/p><p>Connor believes that Stock C is still attractive, but he is selling the stock with the idea that he will repurchase the position next month. The motivation for the transaction is to capture a capital loss that will reduce the Biogene Fund&#x27;s tax expense for the year.<\/p><p>Apple has an investment banking department that is active in initial public offerings (IPOs). George Arnold, CFA, is the senior manager of the IPO department. Arnold approached Connor about Stock D, a new IPO being offered by Apple. Stock D will open trading in two days. Apple had offered the IPO to all of its clients, but approximately 20% of the deal remained unsold. ene will not participate in the IPO. Arnold responded a few hours later with the following message:<\/p><p>&quot;I have just spoken with Ms. D, the CFO of Stock D. Although it is too late to alter the prospectus, management believes they will receive a large contract from a foreign government that will boost next year&#x27;s sales by 20% or more. I urge you to accept the 2%—you won&#x27;t be sorry!&quot;<\/p><p>After reviewing Arnold&#x27;s email, Connor agrees to the 2% offer.<\/p><\/div><\/details><div class=\"qtext\"><p>By executing Transaction C, Connor is:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "By offering Biogene the opportunity to participate in the IPO of Stock D, Apple Investments has violated CFA Institute Standards relating to:", "opts": ["priority of transactions but not independence and objectivity.", "independence and objectivity but not priority of transactions.", "neither priority of transactions nor independence and objectivity."], "ans": "C", "expl": "Connor was not pressured to take the IPO, and he believed it was a good investment. Connor received no confidential information. The IPO had been made available to all Apple clients prior to Biogene. There is no evidence of a violation of either of these Standards. For Further Reference: (Study Session 1, Module 2.5, LOS 2.a, 2.b)", "explhtml": "<p>Connor was not pressured to take the IPO, and he believed it was a good investment. Connor received no confidential information. The IPO had been made available to all Apple clients prior to Biogene. There is no evidence of a violation of either of these Standards.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.5, LOS 2.a, 2.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Charles Connor, CFA, is a portfolio manager at Apple Investments, LLC. Apple is a U.S.-based firm offer cializing in small capitalization growth stocks. The Biogene Fund generally takes significant positions in stocks, commonly owning 4.5–5% of the outstanding shares. The fund&#x27;s prospectus limits positions to a maximum of 5% of the shares outstanding. The performance of the Biogene Fund has been superior over the last few years, but for the last two quarters the fund has underperformed its benchmark by a wide margin. Connor is determined to improve his performance numbers going forward.<\/p><p>The Biogene prospectus allows Connor to use derivative instruments in his investment strategy. Connor frequently uses options to hedge his fund&#x27;s exposure as he builds or liquidates positions in his portfolio since Biogene&#x27;s large positions often take several weeks to acquire. For example, when he identifies a stock to buy, he often buys call options to gain exposure to the stock. As he buys the stock, he sells off the options or allows them to expire. Connor has noticed that the increased volume in the call options often drives the stock price higher for a few days. He has seen a similar negative effect on stock prices when he buys large amounts of put options.<\/p><p>The end of the quarter is just a few days away, and Connor is considering three transactions:<\/p><p>Transaction A: Buying Put Options on Stock A<\/p><p>The Biogene Fund owns 4.9% of the outstanding stock of Company A, but Connor believes the stock is fully valued and plans to sell the entire position. He anticipates that it will take approximately 45 trading days to liquidate the entire Biogene position in Stock A.<\/p><p>Transaction B: Buying Call Options on Stock B<\/p><p>The Biogene Fund owns 5% of the outstanding stock of Company B. Connor believes there is significant appreciation potential for Stock B, but the stock price has dropped in recent weeks. Connor is hoping that by taking an option position, there will be a carryover effect on the stock price before quarter end.<\/p><p>Transaction C: Selling the Biogene Fund&#x27;s Entire Position in Stock C<\/p><p>Connor believes that Stock C is still attractive, but he is selling the stock with the idea that he will repurchase the position next month. The motivation for the transaction is to capture a capital loss that will reduce the Biogene Fund&#x27;s tax expense for the year.<\/p><p>Apple has an investment banking department that is active in initial public offerings (IPOs). George Arnold, CFA, is the senior manager of the IPO department. Arnold approached Connor about Stock D, a new IPO being offered by Apple. Stock D will open trading in two days. Apple had offered the IPO to all of its clients, but approximately 20% of the deal remained unsold. Having read the prospectus, Connor thinks Stock D would be a good fit for his fund, and he expects Stock D to improve his performance in both the short and long term. Connor is not aware of any information related to Stock D beyond that provided in the prospectus. Connor asked to purchase 5% of the IPO, but Arnold limited Biogene&#x27;s share to 2%, explaining:<\/p><p>&quot;With Biogene&#x27;s reputation, any participation will make the unsold shares highly marketable. Further, we may need Biogene to acquire more Stock D shares at a later date if the price does not hold up.&quot;<\/p><p>Connor is disappointed in being limited to 2% of the offering and suggests to Arnold in an email that, given the 2% limitation, Biogene will not participate in the IPO. Arnold responded a few hours later with the following message:<\/p><p>&quot;I have just spoken with Ms. D, the CFO of Stock D. Although it is too late to alter the prospectus, management believes they will receive a large contract from a foreign government that will boost next year&#x27;s sales by 20% or more. I urge you to accept the 2%—you won&#x27;t be sorry!&quot;<\/p><p>After reviewing Arnold&#x27;s email, Connor agrees to the 2% offer.<\/p><\/div><\/details><div class=\"qtext\"><p>Arnold&#x27;s arguments for limiting Biogene&#x27;s share to 2% suggest that Apple:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Based upon Connor's acceptance of the 2% limitation after receiving the email from Arnold:", "opts": ["Connor has violated Standards relating to material nonpublic information, and Arnold has violated Standards relating to preservation of confidentiality.", "Connor has not violated Standards relating to material nonpublic information, but Arnold has violated Standards relating to preservation of confidentiality.", "Connor has not violated Standards relating to material nonpublic information, but Arnold has violated Standards relating to preservation of confidentiality and material nonpublic information."], "ans": "A", "expl": "By changing his previous decision and accepting the 2% based on Arnold's email, Connor has violated the Standards related to material nonpublic information. He has acted based upon the receipt of inside information. Arnold has violated the Standards related to both material nonpublic information and preservation of confidentiality. Arnold violated Standard III(E) – Duties to Clients – Preservation of Confidentiality by revealing information he received based upon a special relationship with Stock D. By passing that information to another area of Apple, Arnold has violated Standard II(A) Integrity of Capital Markets – Material Nonpublic Information as well. For Further Reference: (Study Session 1, Module 2.6, LOS 2.a, 2.b)", "explhtml": "<p>By changing his previous decision and accepting the 2% based on Arnold&#x27;s email, Connor has violated the Standards related to material nonpublic information. He has acted based upon the receipt of inside information. Arnold has violated the Standards related to both material nonpublic information and preservation of confidentiality. Arnold violated Standard III(E) – Duties to Clients – Preservation of Confidentiality by revealing information he received based upon a special relationship with Stock D. By passing that information to another area of Apple, Arnold has violated Standard II(A) Integrity of Capital Markets – Material Nonpublic Information as well.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.6, LOS 2.a, 2.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Charles Connor, CFA, is a portfolio manager at Apple Investments, LLC. Apple is a U.S.-based firm offering a wide spectrum of investment products and services. Connor manages the Biogene Fund, a domestic equity fund specializing in small capitalization growth stocks. The Biogene Fund generally takes significant positions in stocks, commonly owning 4.5–5% of the outstanding shares. The fund&#x27;s prospectus limits positions to a maximum of 5% of the shares outstanding. The performance of the Biogene Fund has been superior over the last few years, but for the last two quarters the fund has underperformed its benchmark by a wide margin. Connor is determined to improve his performance numbers going forward.<\/p><p>The Biogene prospectus allows Connor to use derivative instruments in his investment strategy. Connor frequently uses options to hedge his fund&#x27;s exposure as he builds or liquidates positions in his portfolio since Biogene&#x27;s large positions often take several weeks to acquire. For example, when he identifies a stock to buy, he often buys call options to gain exposure to the stock. As he buys the stock, he sells off the options or allows them to expire. Connor has noticed that the increased volume in the call options often drives the stock price higher for a few days. He has seen a similar negative effect on stock prices when he buys large amounts of put options.<\/p><p>The end of the quarter is just a few days away, and Connor is considering three transactions:<\/p><p>Transaction A: Buying Put Options on Stock A<\/p><p>The Biogene Fund owns 4.9% of the outstanding stock of Company A, but Connor believes the stock is fully valued and plans to sell the entire position. He anticipates that it will take approximately 45 trading days to liquidate the entire Biogene position in Stock A.<\/p><p>Transaction B: Buying Call Options on Stock B<\/p><p>The Biogene Fund owns 5% of the outstanding stock of Company B. Connor believes there is significant appreciation potential for Stock B, but the stock price has dropped in recent weeks. Connor is hoping that by taking an option position, there will be a carryover effect on the stock price before quarter end.<\/p><p>Transaction C: Selling the Biogene Fund&#x27;s Entire Position in Stock C<\/p><p>Connor believes that Stock C is still attractive, but he is selling the stock with the idea that he will repurchase the position next month. The motivation for the transaction is to capture a capital loss that will reduce the Biogene Fund&#x27;s tax expense for the year.<\/p><p>Apple has an investment banking department that is active in initial public offerings (IPOs). George Arnold, CFA, is the senior manager of the IPO department. Arnold approached Connor about Stock D, a new IPO being offered by Apple. Stock D will open trading in two days. Apple had offered the IPO to all of its clients, but approximately 20% of the deal remained unsold. Having read the prospectus, Connor thinks Stock D would be a good fit for his fund, and he expects Stock D to improve his performance in both the short and long term. Connor is not aware of any information related to Stock D beyond that provided in the prospectus. Connor asked to purchase 5% of the IPO, but Arnold limited Biogene&#x27;s share to 2%, explaining:<\/p><p>&quot;With Biogene&#x27;s reputation, any participation will make the unsold shares highly marketable. Further, we may need Biogene to acquire more Stock D shares at a later date if the price does not hold up.&quot;<\/p><p>Connor is disappointed in being limited to 2% of the offering and suggests to Arnold in an email that, given the 2% limitation, Biogene will not participate in the IPO. Arnold responded a few hours later with the following message:<\/p><p>&quot;I have just spoken with Ms. D, the CFO of Stock D. Although it is too late to alter the prospectus, management believes they will receive a large contract from a foreign government that will boost next year&#x27;s sales by 20% or more. I urge you to accept the 2%—you won&#x27;t be sorry!&quot;<\/p><p>After reviewing Arnold&#x27;s email, Connor agrees to the 2% offer.<\/p><\/div><\/details><div class=\"qtext\"><p>Based upon Connor&#x27;s acceptance of the 2% limitation after receiving the email from Arnold:<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Which country is most likely to benefit from capital deepening?", "opts": ["Weira.", "Krosse.", "Procken."], "ans": "B", "expl": "Krosse is a developing nation with the highest α (share of capital in GDP) among all the countries. A high value of α indicates that the next unit of capital added will increase output almost as much as the previous unit of capital. Developing nations with a high α are more likely to benefit from capital deepening, which should result in an increase in productivity (at least in the short term). For Further Reference: (Study Session 4, Module 11.1, LOS 11.d)", "explhtml": "<p>Krosse is a developing nation with the highest α (share of capital in GDP) among all the countries. A high value of α indicates that the next unit of capital added will increase output almost as much as the previous unit of capital. Developing nations with a high α are more likely to benefit from capital deepening, which should result in an increase in productivity (at least in the short term).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.1, LOS 11.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<\/summary><div class=\"vig-body\"><p>Alfred Farias, fixed income analyst for BNF, Inc., is analyzing the economic prospects of Procken, Krosse, Weira, and Toban, four countries in the same region. He collects the following economic and demographic statistics for the countries:<\/p><div class=\"tbl\"><table><tr><td>Procken<\/td><td>Krosse<\/td><td>Weira<\/td><td>Toban<\/td><\/tr><tr><td>Current real GDP (in $ billions)<\/td><td>$250.00<\/td><td>$250.00 $4,500.00 $4,800.00<\/td><td><\/td><\/tr><\/table><\/div><p>Projected real GDP in 5 years (in $ billions) based on potential GDP growth<\/p><div class=\"tbl\"><table><tr><td>$306.00<\/td><td>$315.00 $5,262.00 $5,778.00<\/td><\/tr><\/table><\/div><p>rate<\/p><div class=\"tbl\"><table><tr><td>Long-term growth rate of capital<\/td><td>4.0%<\/td><td>4.2%<\/td><td>3.2%<\/td><td>3.8%<\/td><\/tr><tr><td>Current capital base ($ billions)<\/td><td>$782.9<\/td><td>$699.2<\/td><td>$18,750<\/td><td>$19,750<\/td><\/tr><tr><td>Imports (in $ billions)<\/td><td>$30.00<\/td><td>$60.00<\/td><td>$1,500.00<\/td><td>$900.00<\/td><\/tr><tr><td>Exports (in $ billions)<\/td><td>$32.00<\/td><td>$80.00<\/td><td>$1,000.00<\/td><td>$900.00<\/td><\/tr><tr><td>Population (in $ millions)<\/td><td>20.4<\/td><td>20.0<\/td><td>101.0<\/td><td>100.0<\/td><\/tr><tr><td>Labor growth rate<\/td><td>1.9%<\/td><td>2.9%<\/td><td>0.4%<\/td><td>0.8%<\/td><\/tr><tr><td>Cost of capital relative to total factor cost<\/td><td>32.5%<\/td><td>35.0%<\/td><td>25.0%<\/td><td>22.5%<\/td><\/tr><tr><td>Average real annual appreciation in equities (past five years)<\/td><td>4.0%<\/td><td>4.7%<\/td><td>4.5%<\/td><td>3.8%<\/td><\/tr><\/table><\/div><p>A GDP per capita below $25,000 is considered a developing country, and a GDP per capita greater than $25,000 is considered a developed country.<\/p><p>Farias concludes that Weira and Toban have reached steady-state growth.<\/p><p>In the latest round of trade negotiations, representatives from each country discussed their efforts to foster their countries&#x27; economic development and benefit from the growth of world trade.<\/p><p>Procken&#x27;s Representative: &quot;We are wary of the potential for loss of domestic industries if we remove trade barriers. Given the state of our economy, I&#x27;m not certain that we can lower our trade barriers any further.&quot;<\/p><p>Krosse&#x27;s Representative: &quot;We in Krosse are not investing enough in infrastructure and education to increase the level of productivity and technology in our economy. We also need foreign direct investment and hence we welcome foreign investors.&quot;<\/p><p>Weira&#x27;s Representative: &quot;We are concerned about my country&#x27;s negative trade balance. Weira needs more exports to sustain our growth.&quot;<\/p><p>Toban&#x27;s Representative: &quot;We seem to be at a point in Toban where the growth rate of my country&#x27;s labor force may be insufficient to support our GDP growth rate.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which country is most likely to benefit from capital deepening?<\/p><\/div>", "subj": "economics"}, {"n": 8, "q": "For this question only, assume that the population growth rate is the same for Krosse and Procken. A possible cause for the difference in growth rate of labor is that relative to Procken, Krosse has:", "opts": ["stricter immigration policies.", "a lower labor participation rate.", "experienced an increase in average hours worked."], "ans": "C", "expl": "Krosse's labor growth rate is greater than that of Procken's. Labor growth can be accomplished by an increase in the labor force participation rate, an increase in average hours worked, additional supply of labor by immigration, or a higher population growth rate. We are told that the population growth rate is equal for the two countries. The only choice that allows for higher labor growth rate is then higher average hours worked. For Further Reference: (Study Session 4, Module 11.2, LOS 11.g)", "explhtml": "<p>Krosse&#x27;s labor growth rate is greater than that of Procken&#x27;s. Labor growth can be accomplished by an increase in the labor force participation rate, an increase in average hours worked, additional supply of labor by immigration, or a higher population growth rate. We are told that the population growth rate is equal for the two countries. The only choice that allows for higher labor growth rate is then higher average hours worked.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.2, LOS 11.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alfred Farias, fixed income analyst for BNF, Inc., is analyzing the economic prospects of Procken, Krosse, Weira, and Toban, four countries in the same region. He collects the following economic and demographic statistics for the countries:<\/p><div class=\"tbl\"><table><tr><td>Procken<\/td><td>Krosse<\/td><td>Weira<\/td><td>Toban<\/td><\/tr><tr><td>Current real GDP (in $ billions)<\/td><td>$250.00<\/td><td>$250.00 $4,500.00 $4,800.00<\/td><td><\/td><\/tr><\/table><\/div><p>Projected real GDP in 5 years (in $ billions) based on potential GDP growth<\/p><div class=\"tbl\"><table><tr><td>$306.00<\/td><td>$315.00 $5,262.00 $5,778.00<\/td><\/tr><\/table><\/div><p>rate<\/p><div class=\"tbl\"><table><tr><td>Long-term growth rate of capital<\/td><td>4.0%<\/td><td>4.2%<\/td><td>3.2%<\/td><td>3.8%<\/td><\/tr><tr><td>Current capital base ($ billions)<\/td><td>$782.9<\/td><td>$699.2<\/td><td>$18,750<\/td><td>$19,750<\/td><\/tr><tr><td>Imports (in $ billions)<\/td><td>$30.00<\/td><td>$60.00<\/td><td>$1,500.00<\/td><td>$900.00<\/td><\/tr><tr><td>Exports (in $ billions)<\/td><td>$32.00<\/td><td>$80.00<\/td><td>$1,000.00<\/td><td>$900.00<\/td><\/tr><tr><td>Population (in $ millions)<\/td><td>20.4<\/td><td>20.0<\/td><td>101.0<\/td><td>100.0<\/td><\/tr><tr><td>Labor growth rate<\/td><td>1.9%<\/td><td>2.9%<\/td><td>0.4%<\/td><td>0.8%<\/td><\/tr><tr><td>Cost of capital relative to total factor cost<\/td><td>32.5%<\/td><td>35.0%<\/td><td>25.0%<\/td><td>22.5%<\/td><\/tr><tr><td>Average real annual appreciation in equities (past five years)<\/td><td>4.0%<\/td><td>4.7%<\/td><td>4.5%<\/td><td>3.8%<\/td><\/tr><\/table><\/div><p>A GDP per capita below $25,000 is considered a developing country, and a GDP per capita greater than $25,000 is considered a developed country.<\/p><p>Farias concludes that Weira and Toban have reached steady-state growth.<\/p><p>In the latest round of trade negotiations, representatives from each country discussed their efforts to foster their countries&#x27; economic development and benefit from the growth of world trade.<\/p><p>Procken&#x27;s Representative: &quot;We are wary of the potential for loss of domestic industries if we remove trade barriers. Given the state of our economy, I&#x27;m not certain that we can lower our trade barriers any further.&quot;<\/p><p>Krosse&#x27;s Representative: &quot;We in Krosse are not investing enough in infrastructure and education to increase the level of productivity and technology in our economy. We also need foreign direct investment and hence we welcome foreign investors.&quot;<\/p><p>Weira&#x27;s Representative: &quot;We are concerned about my country&#x27;s negative trade balance. Weira needs more exports to sustain our growth.&quot;<\/p><p>Toban&#x27;s Representative: &quot;We seem to be at a point in Toban where the growth rate of my country&#x27;s labor force may be insufficient to support our GDP growth rate.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that the population growth rate is the same for Krosse and Procken. A possible cause for the difference in growth rate of labor is that relative to Procken, Krosse has:<\/p><\/div>", "subj": "economics"}, {"n": 9, "q": "The long-term growth rate of technology (TFP) for Toban is closest to:", "opts": ["0.4%.", "2.1%.", "2.3%."], "ans": "C", "expl": "Growth rate in potential GDP = long-term growth rate of technology + α × (long-term growth rate of capital) + (1 − α) × (long-term growth rate of labor). The growth rate in potential GDP using a calculator: PV = –$4,800; FV = +$5,778; N = 5; solve for I/Y. I/Y = 3.78%. Rearrange the equation to solve for long-term growth rate of technology. 3.78% = LTGRT + (0.225) × 3.8% + (0.775) × 0.8% LTGRT = 3.78% − 0.86% − 0.62% LTGRT = 2.30% For Further Reference: (Study Session 4, Module 11.2, LOS 11.e)", "explhtml": "<p>Growth rate in potential GDP = long-term growth rate of technology + α × (long-term growth rate of capital) + (1 − α) × (long-term growth rate of labor).<\/p><p>The growth rate in potential GDP using a calculator: PV = –$4,800; FV = +$5,778; N = 5; solve for I/Y. I/Y = 3.78%.<\/p><p>Rearrange the equation to solve for long-term growth rate of technology.<\/p><p>3.78% = LTGRT + (0.225) × 3.8% + (0.775) × 0.8% LTGRT = 3.78% − 0.86% − 0.62%<\/p><p>LTGRT = 2.30%<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.2, LOS 11.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alfred Farias, fixed income analyst for BNF, Inc., is analyzing the economic prospects of Procken, Krosse, Weira, and Toban, four countries in the same region. He collects the following economic and demographic statistics for the countries:<\/p><div class=\"tbl\"><table><tr><td>Procken<\/td><td>Krosse<\/td><td>Weira<\/td><td>Toban<\/td><\/tr><tr><td>Current real GDP (in $ billions)<\/td><td>$250.00<\/td><td>$250.00 $4,500.00 $4,800.00<\/td><td><\/td><\/tr><\/table><\/div><p>Projected real GDP in 5 years (in $ billions) based on potential GDP growth<\/p><div class=\"tbl\"><table><tr><td>$306.00<\/td><td>$315.00 $5,262.00 $5,778.00<\/td><\/tr><\/table><\/ trade balance. Weira needs more exports to sustain our growth.&quot;<\/p><p>Toban&#x27;s Representative: &quot;We seem to be at a point in Toban where the growth rate of my country&#x27;s labor force may be insufficient to support our GDP growth rate.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The long-term growth rate of technology (TFP) for Toban is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 10, "q": "Going forward, which country is most likely to experience lower stock market appreciation than that experienced over the past five years?", "opts": ["Weira.", "Toban.", "Procken."], "ans": "A", "expl": "If the neoclassical theory holds then the sustainable growth rate of output of G* is the same as the long-term growth rate of capital. The growth rate in potential GDP using a calculator: Procken (Past = 4.0%): PV = –$250; FV = +$306; N = 5; solve for I/Y = 4.12%. Krosse (Past = 4.7%): PV = –$250; FV = +$315; N = 5; solve for I/Y = 4.73%. Weira (Past = 4.5%): PV = –$4,500; FV = +$5,262; N = 5; solve for I/Y = 3.18%. Toban (Past = 3.8%): PV = –$4,800; FV = +$5,778; N = 5; solve for I/Y = 3.78%. Weira's stock market appreciation rate of 4.5% exceeds the potential growth rate of GDP of 3.2% significantly. The difference between potential GDP growth rate and past stock market appreciation for the other three countries differences is relatively smaller. For Further Reference: (Study Session 4, Module 11.1, LOS 11.b, 11.i)", "explhtml": "<p>If the neoclassical theory holds then the sustainable growth rate of output of G* is the same as the long-term growth rate of capital.<\/p><p>The growth rate in potential GDP using a calculator:<\/p><p>Procken (Past = 4.0%): PV = –$250; FV = +$306; N = 5; solve for I/Y = 4.12%.<\/p><div class=\"tbl\"><table><tr><td>Krosse (Past = 4.7%):<\/td><td>PV = –$250; FV = +$315; N = 5; solve for I/Y = 4.73%.<\/td><\/tr><tr><td>Weira (Past = 4.5%):<\/td><td>PV = –$4,500; FV = +$5,262; N = 5; solve for I/Y = 3.18%.<\/td><\/tr><tr ed, which developing country is most likely to achieve convergence in growth rates and standard of living with their developed counterparts?", "opts": ["Toban.", "Krosse.", "Procken."], "ans": "B", "expl": "Based on the data in the vignette, Krosse and Procken are developing countries. The GDP per capita for Krosse is $250 billion divided by 20.0 million people, which is equal to $12,500. The GDP per capita for Procken is $250 billion divided by 20.4 million people, which is equal to $12,255. Krosse is more likely to achieve convergence because Krosse is showing more willingness towards opening up the economy to trade and financial flows than is Procken; Krosse's international trade as a proportion of GDP is higher than Proken's, and comments by Krosse's representative indicate that inflow of foreign capital would be welcome. Finally, comments by Procken's representative indicate an inward-oriented policy, which could hinder convergence. For Further Reference: (Study Session 4, Module 11.3, LOS 11.j)", "explhtml": "<p>Based on the data in the vignette, Krosse and Procken are developing countries. The GDP per capita for Krosse is $250 billion divided by 20.0 million people, which is equal to $12,500. The GDP per capita for Procken is $250 billion divided by 20.4 million people, which is equal to $12,255. Krosse is more likely to achieve convergence because Krosse is showing more willingness towards opening up the economy to trade and financial flows than is Procken; Krosse&#x27;s international trade as a proportion of GDP is higher than Proken&#x27;s, and comments by Krosse&#x27;s representative indicate that inflow of foreign capital would be welcome. Finally, comments by Procken&#x27;s representative indicate an inward-oriented policy, which could hinder convergence.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.3, LOS 11.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alfred Farias, fixed income analyst for BNF, Inc., is analyzing the economic prospects of Procken, Krosse, Weira, and Toban, four countries in the same region. He collects the following economic and demographic statistics for the countries:<\/p><div class=\"tbl\"><table><tr><td>Procken<\/td><td>Krosse<\/td><td>Weira<\/td><td>Toban<\/td><\/tr><tr><td>Current real GDP (in $ billions)<\/td><td>$250.00<\/td><td>$250.00 $4,500.00 $4,800.00<\/td><td><\/td><\/tr><\/table><\/div><p>Projected real GDP in 5 years (in $ billions) based on potential GDP growth<\/p><div class=\"tbl\"><table><tr><td>$306.00<\/td><td>$315.00 $5,262.00 $5,778.00<\/td><\/tr><\/table><\/div><p>rate<\/p><div class=\"tbl\"><table><tr><td>Long-term growth rate of capital<\/td><td>4.0%<\/td><td>4.2%<\/td><td>3.2%<\/td><td>3.8%<\/td><\/tr><tr><td>Current capital base ($ billions)<\/td><td>$782.9<\/td><td>$699.2<\/td><td>$18,750<\/td><td>$19,750<\/td><\/tr><tr><td>Imports (in $ billions)<\/td><td>$30.00<\/td><td>$60.00<\/td><td>$1,500.00<\/td><td>$900.00<\/td><\/tr><tr><td>Exports (in $ billions)<\/td><td>$32.00<\/td><td>$80.00<\/td><td>$1,000.00<\/td><td>$900.00<\/td><\/tr><tr><td>Population (in $ millions)<\/td><td>20.4<\/td><td>20.0<\/td><td>101.0<\/td><td>100.0<\/td><\/tr><tr><td>Labor growth rate<\/td><td>1.9%<\/td><td>2.9%<\/td><td>0.4%<\/td><td>0.8%<\/td><\/tr><tr><td>Cost of capital relative to total factor cost<\/td><td>32.5%<\/td><td>35.0%<\/td><td>25.0%<\/td><td>22.5%<\/td><\/tr><tr><td>Average real annual appreciation in equities (past five years)<\/td><td>4.0%<\/td><td>4.7%<\/td><td>4.5%<\/td><td>3.8%<\/td><\/tr><\/table><\/div><p>A GDP per capita below $25,000 is considered a developing country, and a GDP per capita greater than $25,000 is considered a developed country.<\/p><p>Farias concludes that Weira and Toban have reached steady-state growth.<\/p><p>In the latest round of trade negotiations, representatives from each country discussed their efforts to foster their countries&#x27; economic development and benefit from the growth of world trade.<\/p><p>Procken&#x27;s Representative: &quot;We are wary of the potential for loss of domestic industries if we remove trade barriers. Given the state of our economy, I&#x27;m not certain that we can lower our trade barriers any further.&quot;<\/p><p>Krosse&#x27;s Representative: &quot;We in Krosse are not investing enough in infrastructure and education to increase the level of productivity and technology in our economy. We also need foreign direct investment and hence we welcome foreign investors.&quot;<\/p><p>Weira&#x27;s Representative: &quot;We are concerned about my country&#x27;s negative trade balance. Weira needs more exports to sustain our growth.&quot;<\/p><p>Toban&#x27;s Representative: &quot;We seem to be at a point in Toban where the growth rate of my country&#x27;s labor force may be insufficient to support our GDP growth rate.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information provided, which developing country is most likely to achieve convergence in growth rates and standard of living with their developed counterparts?<\/p><\/div>", "subj": "economics"}, {"n": 13, "q": "Due to the reclassification described in Exhibit 2, inventory turnover will most likely:", "opts": ["increase.", "remain the same.", "decrease."], "ans": "A", "expl": "Inventory turnover is cost of sales divided by inventory. A decrease in inventory is likely to cause the ratio to increase as the amount of inventory relative to the cost of goods sold decreases. For Further Reference: (Study Session 6, Module 18.5, LOS 18.d)", "explhtml": "<p>Inventory turnover is cost of sales divided by inventory. A decrease in inventory is likely to cause the ratio to increase as the amount of inventory relative to the cost of goods sold decreases.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 6, Module 18.5, LOS 18.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Lyle Kreiger, CFA, has recently taken an analyst role at Rockway Stone, a small private equity firm based in the United States. As part of his role, he has been asked to review the most recent unaudited financial statements from several private companies that have been identified as potential investments for the firm.<\/p><p>Rockway Stone has a strict policy of only investing in companies that demonstrate a high level of financial reporting quality. The firm has developed an internal scoring system to rank the quality of a target company&#x27;s financial statements. The scoring system awards points for each incident of low reporting quality; any company that reaches 40 points is not considered for potential investment. The scoring system is shown in Exhibit 1.<\/p><p><b>Exhibit 1: Rockway Stone FR Quality Score Sheet<\/b><\/p><div class=\"tbl\"><table><tr><td>1. Any instance of a change in policy year-to-year or reclassification of assets, liabilities, revenues,<\/td><td>5 points<\/td><\/tr><\/table><\/div><p>or expenses<\/p><div class=\"tbl\"><table><tr><td>2. Any instance from 1 that also results in an increase in total assets<\/td><td>Additional 5<\/td><\/tr><tr><td>points<\/td><td><\/td><\/tr><tr><td>3. Any instance from 1 that also results in an increase in revenue<\/td><td>Additional 10<\/td><\/tr><tr><td>points<\/td><td><\/td><\/tr><tr><td>4. Any indication that earnings are not persistent<\/td><td>5 points<\/td><\/tr><\/table><\/div><p>The first report Kreiger is reviewing is from Tolston Conductors, a firm providing highly polished metals to the technology industry. Kreiger&#x27;s supervisor has instructed Kreiger to focus on the inventory note shown in Exhibit 2.<\/p><p><b>Exhibit 2: Tolston Conductors Extract<\/b><\/p><p>Note 8 – Inventories<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td><\/td><\/tr><tr><td>Raw materials ($&#x27;000)<\/td><td>481<\/td><td>409<\/td><\/tr><tr><td>WIP ($&#x27;000)<\/td><td>1,392<\/td><td>894<\/td><\/tr><tr><td>Finished goods ($&#x27;000)<\/td><td>508<\/td><td>496<\/td><\/tr><\/table><\/div><p>Finished goods are classified as goods that are complete in all respects except packaging. Of the amount of inventory reported as work-in-progress in 2013, $342,000 has been reclassified as &quot;other current assets.&quot; This WIP consisted primarily of highly polished metals that are now to be further reworked and are not expected to be ready for sale for two years.<\/p><p>Kreiger is also reviewing financial statements from Resonator Wellness, a firm producing health and wellness products in the U.K. Extracts from the pro forma financial statement recently released, along with 2013 and 2012 comparables, is shown in Exhibit 3.<\/p><p><b>Exhibit 3: Resonator Wellness Financial Statement – (Extract)<\/b><\/p><p>Headline Operating Profit: Quarter Ending 31 December 2014 (£000)<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td>2012<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>8,380<\/td><td>7,980<\/td><td>7,450<\/td><\/tr><tr><td>Revenue retail outlet sales<\/td><td>1,402.2<\/td><td>3,543.9<\/td><td>3,501.6<\/td><\/tr><tr><td>Online sales<\/td><td>3,086.2<\/td><td>398.9<\/td><td>389.4<\/td><\/tr><tr><td>Headline net income (Note A)<\/td><td>1,262.7<\/td><td>1,104.4<\/td><td>1,086.0<\/td><\/tr><tr><td>Note A: Headline net income excludes settlement costs and network costs. Settlement costs are one-off<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>payments to settle legal procedures; these costs totaled (in £000) 20.0, 22.1, and 24.8 in 2012, 2013, and<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2014, respectively. Network costs related to running the online business totaled (in £000) 202.0, 325.0, and<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>885.5 in 2012, 2013, and 2014, respectively. The financial accounts submitted to our bank in accordance with<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>our loan covenants shows net income after charging both settlement and network costs in accordance with<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>local GAAP.<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Kreiger notes that the financial statements submitted to the firm&#x27;s bankers did indeed report net income correctly in accordance with local GAAP. However, this figure was much less prominent than headline net income, as the GAAP income was disclosed only in the footnotes rather than on the face of the income statement. Kreiger believes that the legal settlements are payments made to dissatisfied customers and are a normal part of business. Kreiger also believes that the increase in network cost is consistent with increased focus on online operations. Resonator&#x27;s required return on stockholders&#x27; equity is 5%.<\/p><p>Krieger&#x27;s final task is to analyze a set of financial statements for AltoJib Plc., a manufacturing and engineering company that is considering delisting. The company has a large number of investments in associates that Kreiger would like to isolate. Rockway Stone&#x27;s approach to isolating the impact of investment in associates is to perform some classic DuPont analysis to calculate ROE. In doing so, net margin and asset turnover (but not financial leverage) are adjusted for the impact of investment in associates.<\/p><p>The information Kreiger has to work with is shown in Exhibit 4 along with Rockway Stone&#x27;s method of isolating the impact of investment in associates on ROE using DuPont analysis.<\/p><p><b>Exhibit 4: AltoJib Plc. Financial Statements (Extracts)<\/b><\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td><\/td><\/tr><tr><td>(£000)<\/td><td>(£000)<\/td><td>(£000)<\/td><td>(£000)<\/td><td><\/td><\/tr><tr><td>Re ulation of total ROE<\/p><p>Net margin is based on net income including income from associates. Asset turnover is calculated using average total assets including investments in associates. Financial leverage is calculated using average assets and average equity including investments in associates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements is the least accurate regarding Resonator Wellness information shown in Exhibit 3?<\/p><\/div>", "subj": "fsa"}, {"n": 16, "q": "Which of the following conclusions is Kreiger most likely to draw about the earnings quality of Resonator Wellness? 2014 net income after correctly including network and settlement costs shows:", "opts": ["compound annual growth of over 7%, and earnings that are of high quality as they are correctly calculated under GAAP.", "negative compound annual growth of over 35%, and earnings that are of low quality.", "negative compound annual growth of over 35%, and earnings that are of high quality as they are correctly calculated under GAAP."], "ans": "B", "expl": "2014 2013 2012 Headline Net Income 1,262.7 1,104.4 1,086.0 Network costs (from note A) 885.5 325.0 202.0 Settlements (from note A) 24.8 22.1 20.0 Net Income 352.4 757.3 864.0 Net Income CAGR [(352.4 / 864) 1/2 ] − 1 = –0.36 = –36% Average stockholders' equity = (8,380 + 7,980) / 2 = 8,180 Return on stockholders' equity for 2014 = 352.4 / 8,180 = 4.31% Earnings quality refers not only to compliance with GAAP but also to the persistence and level of earnings. The GAAP- compliant net income does not satisfy the minimum return requirement; hence, earnings are low (and therefore of low quality). For Further Reference: (Study Session 6, Module 17.3, LOS 17.h)", "explhtml": "<div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td>2012<\/td><td><\/td><\/tr><tr><td>Headline Net Income<\/td><td>1,262.7 1,104.4 1,086.0<\/td><td><\/td><td><\/td><\/tr><tr><td>Network costs (from note A)<\/td><td>885.5<\/td><td>325.0<\/td><td>202.0<\/td><\/tr><tr><td>Settlements (from note A)<\/td><td>24.8<\/td><td>22.1<\/td><td>20.0<\/td><\/tr><tr><td>Net Income<\/td><td>352.4<\/td><td>757.3<\/td><td>864.0<\/td><\/tr><tr><td>Net Income CAGR [(352.4 / 864)<\/td><td>1/2<\/td><td>] − 1 = –0.36 = –36%<\/td><td><\/td><\/tr><tr><td>Average stockholders&#x27; equity = (8,380 + 7,980) / 2 = 8,180<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Return on stockholders&#x27; equity for 2014 = 352.4 / 8,180 = 4.31%<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Earnings quality refers not only to compliance with GAAP but also to the persistence and level of earnings. The GAAP- compliant net income does not satisfy the minimum return requirement; hence, earnings are low (and therefore of low quality).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 6, Module 17.3, LOS 17.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lyle Kreiger, CFA, has recently taken an analyst role at Rockway Stone, a small private equity firm based in the United States. As part of his role, he has been asked to review the most recent unaudited financial statements from several private companies that have been identified as potential investments for the firm.<\/p><p>Rockway Stone has a strict policy of only investing in companies that demonstrate a high level of financial reporting quality. The firm has developed an internal scoring system to rank the quality of a target company&#x27;s financial statements. The scoring system awards points for each incident of low reporting quality; any company that reaches 40 points is not considered for potential investment. The scoring system is shown in Exhibit 1.<\/p><p><b>Exhibit 1: Rockway Stone FR Quality Score Sheet<\/b><\/p><div class=\"tbl\"><table><tr><td>1. Any instance of a change in policy year-to-year or reclassification of assets, liabilities, revenues,<\/td><td>5 points<\/td><\/tr><\/table><\/div><p>or expenses<\/p><div class=\"tbl\"><table><tr><td>2. Any instance from 1 that also results in an increase in total assets<\/td><td>Additional 5<\/td><\/tr><tr><td>points<\/td><td><\/td><\/tr><tr><td>3. Any instance from 1 that also results in an increase in revenue<\/td><td>Additional 10<\/td><\/tr><tr><td>points<\/td><td><\/td><\/tr><tr><td>4. Any indication that earnings are not persistent<\/td><td>5 points<\/td><\/tr><\/table><\/div><p>The first report Kreiger is reviewing is from Tolston Conductors, a firm providing highly polished metals to the technology industry. Kreiger&#x27;s supervisor has instructed Kreiger to focus on the inventory note shown in Exhibit 2.<\/p><p><b>Exhibit 2: Tolston Conductors Extract<\/b><\/p><p>Note 8 – Inventories<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td><\/td><\/tr><tr><td>Raw materials ($&#x27;000)<\/td><td>481<\/td><td>409<\/td><\/tr><tr><td>WIP ($&#x27;000)<\/td><td>1,392<\/td><td>894<\/td><\/tr><tr><td>Finished goods ($&#x27;000)<\/td><td>508<\/td><td>496<\/td><\/tr><\/table><\/div><p>Finished goods are classified as goods that are complete in all respects except packaging. Of the amount of inventory reported as work-in-progress in 2013, $342,000 has been reclassified as &quot;other current assets.&quot; This WIP consisted primarily of highly polished metals that are now to be further reworked and are not expected to be ready for sale for two years.<\/p><p>Kreiger is also reviewing financial statements from Resonator Wellness, a firm producing health and wellness products in the U.K. Extracts from the pro forma financial statement recently released, along with 2013 and 2012 comparables, is shown in Exhibit 3.<\/p><p><b>Exhibit 3: Resonator Wellness Financial Statement – (Extract)<\/b><\/p><p>Headline Operating Profit: Quarter Ending 31 December 2014 (£000)<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td>2012<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>8,380<\/td><td>7,980<\/td><td>7,450<\/td><\/tr><tr><td>Revenue retail outlet sales<\/td><td>1,402.2<\/td><td>3,543.9<\/td><td>3,501.6<\/td><\/tr><tr><td>Online sales<\/td><td>3,086.2<\/td><td>398.9<\/td><td>389.4<\/td><\/tr><tr><td>Headline net income (Note A)<\/td><td>1,262.7<\/td><td>1,104.4<\/td><td>1,086.0<\/td><\/tr><tr><td>Note A: Headline net income excludes settlement costs and network costs. Settlement costs are one-off<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>payments to settle legal procedures; these costs totaled (in £000) 20.0, 22.1, and 24.8 in 2012, 2013, and<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2014, respectively. Network costs related to running the online business totaled (in £000) 202.0, 325.0, and<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>885.5 in 2012, 2013, and 2014, respectively. The financial accounts submitted to our bank in accordance with<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>our loan covenants shows net income after charging both settlement and network costs in accordance with<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>local GAAP.<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Kreiger notes that the financial statements submitted to the firm&#x27;s bankers did indeed report net income correctly in accordance with local GAAP. However, this figure was much less prominent than headline net income, as the GAAP income was disclosed only in the footnotes rather than on the face of the income statement. Kreiger believes that the legal settlements are payments made to dissatisfied customers and are a normal part of business. Kreiger also believes that the increase in network cost is consistent with increased focus on online operations. Resonator&#x27;s required return on stockholders&#x27; equity is 5%.<\/p><p>Krieger&#x27;s final task is to analyze a set of financial statements for AltoJib Plc., a manufacturing and engineering company that is considering delisting. The company has a large number of investments in associates that Kreiger would like to isolate. Rockway Stone&#x27;s approach to isolating the impact of investment in associates is to perform some classic DuPont analysis to calculate ROE. In doing so, net margin and asset turnover (but not financial leverage) are adjusted for the impact of investment in associates.<\/p><p>The information Kreiger has to work with is shown in Exhibit 4 along with Rockway Stone&#x27;s method of isolating the impact of investment in associates on ROE using DuPont analysis.<\/p><p><b>Exhibit 4: AltoJib Plc. Financial Statements (Extracts)<\/b><\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td><\/td><\/tr><tr><td>(£000)<\/td><td>(£000)<\/td><td>(£000)<\/td><td>(£000)<\/td><td><\/td><\/tr><tr><td>Revenue<\/td><td>998.5<\/td><td>918.6<\/td><td>817.6<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>44.4<\/td><td>31.2<\/td><td>26.7<\/td><td><\/td><\/tr><tr><td>Income from associates<\/td><td>17.8<\/td><td>11.2<\/td><td>8.4<\/td><td><\/td><\/tr><tr><td>Total assets<\/td><td>1,260.8 1,166.6 1,043.2 1,012.1<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Investment in associates<\/td><td>101.6<\/td><td>83.8<\/td><td>72.6<\/td><td>64.2<\/td><\/tr><tr><td>Equity<\/td><td>638.4<\/td><td>569.8<\/td><td>542.5<\/td><td>524.2<\/td><\/tr><tr><td>Financial leverage<\/td><td>2.01<\/td><td>1.99<\/td><td>1.93<\/td><td><\/td><\/tr><\/table><\/div><p>Calculation of ROE excluding associates<\/p><p>Net margin is based on net income excluding income from associates. Asset turnover is calculated using average total assets excluding investments in associates. Financial leverage is calculated using average assets and average equity including investments in associates.<\/p><p>Calculation of total ROE<\/p><p>Net margin is based on net income including income from associates. Asset turnover is calculated using average total assets including investments in associates. Financial leverage is calculated using average assets and average equity including investments in associates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following conclusions is Kreiger most likely to draw about the earnings quality of Resonator Wellness? 2014 net income after correctly including network and settlement costs shows:<\/p><\/div>", "subj": "fsa"}, {"n": 17, "q": "Treating an investment as an investment in associate rather than in a subsidiary is least likely to:", "opts": ["overstate net profit margins.", "understate fixed assets.", "understate net income."], "ans": "C", "expl": "An investment in associates is accounted for using the equity method, while investment in a subsidiary is accounted for using the acquisition method. Using either method, net income will be the same. However, fixed assets and total revenue will be lower under the equity method. For Further Reference: (Study Session 6, Module 17.5, LOS 17.k)", "explhtml": "<p>An investment in associates is accounted for using the equity method, while investment in a subsidiary is accounted for using the acquisition method. Using either method, net income will be the same. However, fixed assets and total revenue will be lower under the equity method.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 6, Module 17.5, LOS 17.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lyle Kreiger, CFA, has recently taken an analyst role at Rockway Stone, a small private equity firm based in the United States. As part of his role, he has been asked to review the most recent unaudited financial statements from several private companies that have been identified as potential investments for the firm.<\/p><p>Rockway Stone has a strict policy of o ancial leverage<\/td><td>2.01<\/td><td>1.99<\/td><td>1.93<\/td><td><\/td><\/tr><\/table><\/div><p>Calculation of ROE excluding associates<\/p><p>Net margin is based on net income excluding income from associates. Asset turnover is calculated using average total assets excluding investments in associates. Financial leverage is calculated using average assets and average equity including investments in associates.<\/p><p>Calculation of total ROE<\/p><p>Net margin is based on net income including income from associates. Asset turnover is calculated using average total assets including investments in associates. Financial leverage is calculated using average assets and average equity including investments in associates.<\/p><\/div><\/details><div class=\"qtext\"><p>Treating an investment as an investment in associate rather than in a subsidiary is least likely to:<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "Using the Rockway Stone approach to calculating ROE measures outlined in Exhibit 4, Kreiger is most likely to conclude that:", "opts": ["ROE excluding the effects of investment in associates has decreased from 2012 to 2014.", "ROE excluding the effects of investment in associates in 2014 was approximately 35% lower than the total ROE in 2014.", "total ROE was higher than the ROE excluding the effects of investment in associates for 2012 and 2014, but lower in 2013."], "ans": "B", "expl": "2014 2013 2012 2011 (£000) (£000) (£000) (£000) Revenue 998.5 918.6 817.6 Net income 44.4 31.2 26.7 Income from associates 17.8 11.2 8.4 NI excluding associates 26.6 20.0 18.3 Total assets 1,260.8 1,166.6 1,043.2 1,012.1 Investment in assoc. 101.6 83.8 72.6 64.2 Total assets 1,159.2 1,082.8 970.6 947.9 (ex assoc.) Equity 638.4 569.8 542.5 524.2 Average equity 604.1 556.2 533.4 510.2 Average assets 1,213.7 1,104.9 1,027.7 500.8 Average assets 1,121.0 1,026.7 959.3 (ex assoc.) 2.66% 2.18% 2.24% Net margin (ex assoc.) (26.6 / 998.5) (20.0 / 918.6) (18.3 / 817.6) Net margin 4.45% 3.40
