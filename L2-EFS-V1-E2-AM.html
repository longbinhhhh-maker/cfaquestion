e time.", "The methodology described is not applicable to portfolios containing option positions."], "ans": "A", "expl": "A monthly VaR cannot be annualized by simply multiplying by 12. The monthly return and standard deviation would need to be annualized and VaR recalculated. An assumption of a normal distribution is invalid if options were in the portfolio. For Further Reference: (Study Session 16, Module 45.1, LOS 45.b)", "explhtml": "<p>A monthly VaR cannot be annualized by simply multiplying by 12. The monthly return and standard deviation would need to be annualized and VaR recalculated. An assumption of a normal distribution is invalid if options were in the portfolio.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.1, LOS 45.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Gordon Stenton, CFA, works for a small investment management firm in the United States. Part of his role involves managing portfolios for high net worth individuals. Currently, Stenton is corresponding with Rachael Matten. Matten has withdrawn her assets from Altune, an asset management firm, and is considering allocating $2.5 million of those funds to Stenton&#x27;s firm. Matten indicated that she was unhappy with the level of disclosure about trading methods and risk management that were employed at Altune.<\/p><p>Matten has sent Stenton a list of questions to assess the policies at Stenton&#x27;s firm.<\/p><p>The first issue Matten wants clarification on pertains to the use of VaR. Among the documents that Altune sent Matten were two statements (shown in Exhibit 1). Matten was unsure of how to interpret either of these statements.<\/p><p><b>Exhibit 1: VaR<\/b><\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Your portfolio has a 5% monthly VaR of $225,000.<\/td><\/tr><tr><td>VaR is calculated using a parametric methodology and an assumption of normality for all risk<\/td><td><\/td><\/tr><tr><td>factors.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>The average loss once the VaR cutoff is exceeded is estimated to be $320,000.<\/td><\/tr><\/table><\/div><p>Matten indicates that in Statement 1, she understands that the $225,000 represents the minimum loss that will occur 5% of the time. She would also like to confirm her suspicion that the 1% VaR (loss) would be lower.<\/p><p>To provide Matten the risk management process employed at his firm, Stenton intends to send Matten the description shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Primary Risk Management Measure – Steps<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Identify the top 10 exposures for the portfolio.<\/td><\/tr><tr><td>Step 2:<\/td><td>Design a hypothetical global event that would simultaneously adversely affect each of the<\/td><\/tr><tr><td>exposures.<\/td><td><\/td><\/tr><tr><td>Step 3:<\/td><td>Assess the impact on the portfolio.<\/td><\/tr><\/table><\/div><p>Matten has also raised an issue about investing in ETFs and the trading methods used by Stenton. She has read several negative comments in the financial press regarding the use of algorithms to trade and about the growing trend of high frequency trading. She has asked Stenton to comment on the concerns she has noted in Exhibit 3.<\/p><p><b>Exhibit 3: Concerns<\/b><\/p><div class=\"tbl\"><table><tr><td>Concern 1: <\/td><td>The tracking error of ETFs chosen by Stenton tends to be fairly high.<\/td><\/tr><tr><td>Concern 2: <\/td><td>The increase in market fragmentation resulting from an increase in electronic markets.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following statements regarding Statement 1 in Exhibit 1 is least accurate?<\/p><\/div>", "subj": "portfolio"}, {"n": 50, "q": "Statement 2 in Exhibit 1 is most accurately described as:", "opts": ["incremental VaR.", "conditional VaR.", "marginal VaR."], "ans": "B", "expl": "The estimated loss under the condition that VaR has been exceeded is known as conditional VaR. For Further Reference: (Study Session 16, Module 45.2, LOS 45.e)", "explhtml": "<p>The estimated loss under the condition that VaR has been exceeded is known as conditional VaR.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.2, LOS 45.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gordon Stenton, CFA, works for a small investment management firm in the United States. Part of his role involves managing portfolios for high net worth individuals. Currently, Stenton is corresponding with Rachael Matten. Matten has withdrawn her assets from Altune, an asset management firm, and is considering allocating $2.5 million of those funds to Stenton&#x27;s firm. Matten indicated that she was unhappy with the level of disclosure about trading methods and risk management that were employed at Altune.<\/p><p>Matten has sent Stenton a list of questions to assess the policies at Stenton&#x27;s firm.<\/p><p>The first issue Matten wants clarification on pertains to the use of VaR. Among the documents that Altune sent Matten were two statements (shown in Exhibit 1). Matten was unsure of how to interpret either of these statements.<\/p><p><b>Exhibit 1: VaR<\/b><\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Your portfolio has a 5% monthly VaR of $225,000.<\/td><\/tr><tr><td>VaR is calculated using a parametric methodology and an assumption of normality for all risk<\/td><td><\/td><\/tr><tr><td>factors.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>The average loss once the VaR cutoff is exceeded is estimated to be $320,000.<\/td><\/tr><\/table><\/div><p>Matten indicates that in Statement 1, she understands that the $225,000 represents the minimum loss that will occur 5% of the time. She would also like to confirm her suspicion that the 1% VaR (loss) would be lower.<\/p><p>To provide Matten the risk management process employed at his firm, Stenton intends to send Matten the description shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Primary Risk Management Measure – Steps<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Identify the top 10 exposures for the portfolio.<\/td><\/tr><tr><td>Step 2:<\/td><td>Design a hypothetical global event that would simultaneously adversely affect each of the<\/td><\/tr><tr><td>exposures.<\/td><td><\/td><\/tr><tr><td>Step 3:<\/td><td>Assess the impact on the portfolio.<\/td><\/tr><\/table><\/div><p>Matten has also raised an issue about investing in ETFs and the trading methods used by Stenton. She has read several negative comments in the financial press regarding the use of algorithms to trade and about the growing trend of high frequency trading. She has asked Stenton to comment on the concerns she has noted in Exhibit 3.<\/p><p><b>Exhibit 3: Concerns<\/b><\/p><div class=\"tbl\"><table><tr><td>Concern 1: <\/td><td>The tracking error of ETFs chosen by Stenton tends to be fairly high.<\/td><\/tr><tr><td>Concern 2: <\/td><td>The increase in market fragmentation resulting from an increase in electronic markets.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Statement 2 in Exhibit 1 is most accurately described as:<\/p><\/div>", "subj": "portfolio"}, {"n": 51, "q": "In her interpretation of VaR, Matten is most likely:", "opts": ["correct regarding the $225,000 but incorrect regarding the 1% VaR.", "incorrect regarding the $225,000 but correct regarding the 1% VaR.", "incorrect regarding the $225,000 and the 1% VaR."], "ans": "A", "expl": "The $225,000 is a minimum loss that will be exceeded 5% of the time. A 1% VaR corresponds to a greater loss than a 5% VaR. For Further Reference: (Study Session 16, Module 45.1, LOS 45.a)", "explhtml": "<p>The $225,000 is a minimum loss that will be exceeded 5% of the time. A 1% VaR corresponds to a greater loss than a 5% VaR.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.1, LOS 45.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gordon Stenton, CFA, works for a small investment management firm in the United States. Part of his role involves managing portfolios for high net worth individuals. Currently, Stenton is corresponding with Rachael Matten. Matten has withdrawn her assets from Altune, an asset management firm, and is considering allocating $2.5 million of those funds to Stenton&#x27;s firm. Matten indicated that she was unhappy with the level of disclosure about trading methods and risk management that were employed at Altune.<\/p><p>Matten has sent Stenton a list of questions to assess the policies at Stenton&#x27;s firm.<\/p><p>The first issue Matten wants clarification on pertains to the use of VaR. Among the documents that Altune sent Matten were two statements (shown in Exhibit 1). Matten was unsure of how to interpret either of these statements.<\/p><p><b>Exhibit 1: VaR<\/b><\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Your portfolio has a 5% monthly VaR of $225,000.<\/td><\/tr><tr><td>VaR is calculated using a parametric methodology and an assumption of normality for all risk<\/td><td><\/td><\/tr><tr><td>factors.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>The average loss once the VaR cutoff is exceeded is estimated to be $320,000.<\/td><\/tr><\/table><\/div><p>Matten indicates that in Statement 1, she understands that the $225,000 represents the minimum loss that will occur 5% of the time. She would also like to confirm her suspicion that the 1% VaR (loss) would be lower.<\/p><p>To provide Matten the risk management process employed at his firm, Stenton intends to send Matten the description shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Primary Risk Management Measure – Steps<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Identify the top 10 exposures for the portfolio.<\/td><\/tr><tr><td>Step 2:<\/td><td>Design a hypothetical global event that would simultaneously adversely affect each of the<\/td><\/tr><tr><td>exposures.<\/td><td><\/td><\/tr><tr><td>Step 3:<\/td><td>Assess the impact on the portfolio.<\/td><\/tr><\/table><\/div><p>Matten has also raised an issue about investing in ETFs and the trading methods used by Stenton. She has read several negative comments in the financial press regarding the use of algorithms to trade and about the growing trend of high frequency trading. She has asked Stenton to comment on the concerns she has noted in Exhibit 3.<\/p><p><b>Exhibit 3: Concerns<\/b><\/p><div class=\"tbl\"><table><tr><td>Concern 1: <\/td><td>The tracking error of ETFs chosen by Stenton tends to be fairly high.<\/td><\/tr><tr><td>Concern 2: <\/td><td>The increase in market fragmentation resulting from an increase in electronic markets.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>In her interpretation of VaR, Matten is most likely:<\/p><\/div>", "subj": "portfolio"}, {"n": 52, "q": "The primary risk management measure discussed in Exhibit 2 is most accurately described as:", "opts": ["sensitivity risk analysis.", "reverse stress testing.", "Monte Carlo simulation."], "ans": "B", "expl": "The description is of reverse stress testing, which is a form of scenario analysis, not sensitivity analysis. A Monte Carlo simulation would run many repeated scenarios. For Further Reference: (Study Session 16, Module 45.3, LOS 45.h)", "explhtml": "<p>The description is of reverse stress testing, which is a form of scenario analysis, not sensitivity analysis. A Monte Carlo simulation would run many repeated scenarios.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.3, LOS 45.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gordon Stenton, CFA, works for a small investment management firm in the United States. Part of his role involves managing portfolios for high net worth individuals. Currently, Stenton is corresponding with Rachael Matten. Matten has withdrawn her assets from Altune, an asset management firm, and is considering allocating $2.5 million of those funds to Stenton&#x27;s firm. Matten indicated that she was unhappy with the level of disclosure about trading methods and risk management that were employed at Altune.<\/p><p>Matten has sent Stenton a list of questions to assess the policies at Stenton&#x27;s firm.<\/p><p>The first issue Matten wants clarification on pertains to the use of VaR. Among the documents that Altune sent Matten were two statements (shown in Exhibit 1). Matten was unsure of how to interpret either of these statements.<\/p><p><b>Exhibit 1: VaR<\/b><\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Your portfolio has a 5% monthly VaR of $225,000.<\/td><\/tr><tr><td>VaR is calculated using a parametric methodology and an assumption of normality for all risk<\/td><td><\/td><\/tr><tr><td>factors.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>The average loss once the VaR cutoff is exceeded is estimated to be $320,000.<\/td><\/tr><\/table><\/div><p>Matten indicates that in Statement 1, she understands that the $225,000 represents the minimum loss that will occur 5% of the time. She would also like to confirm her suspicion that the 1% VaR (loss) would be lower.<\/p><p>To provide Matten the risk management process employed at his firm, Stenton intends to send Matten the description shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Primary Risk Management Measure – Steps<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Identify the top 10 exposures for the portfolio.<\/td><\/tr><tr><td>Step 2:<\/td><td>Design a hypothetical global event that would simultaneously adversely affect each of the<\/td><\/tr><tr><td>exposures.<\/td><td><\/td><\/tr><tr><td>Step 3:<\/td><td>Assess the impact on the portfolio.<\/td><\/tr><\/table><\/div><p>Matten has also raised an issue about investing in ETFs and the trading methods used by Stenton. She has read several negative comments in the financial press regarding the use of algorithms to trade and about the growing trend of high frequency trading. She has asked Stenton to comment on the concerns she has noted in Exhibit 3.<\/p><p><b>Exhibit 3: Concerns<\/b><\/p><div class=\"tbl\"><table><tr><td>Concern 1: <\/td><td>The tracking error of ETFs chosen by Stenton tends to be fairly high.<\/td><\/tr><tr><td>Concern 2: <\/td><td>The increase in market fragmentation resulting from an increase in electronic markets.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The primary risk management measure discussed in Exhibit 2 is most accurately described as:<\/p><\/div>", "subj": "portfolio"}, {"n": 53, "q": "Stenton would least accurately respond to Concern 1 in Exhibit 3 by saying that tracking errors are caused by:", "opts": ["service charges paid by the authorized parties for primary market transactions.", "the increased use of execution algorithms to profit from arbitrage opportunities, which has decreased market stability.", "sampling and optimization methods used by funds."], "ans": "A", "expl": "Fund fees/expenses, sampling and optimization, fund accounting practices, use of depository receipts, index changes, regulatory and tax requirements, and asset manager operations contribute to ETF tracking errors. Service fees paid by APs offset any incidentals that the ETF bears in the creation/redemption process and do not contribute to tracking error. For Further Reference: (Study Session 16, Module 43.1, LOS 43.c)", "explhtml": "<p>Fund fees/expenses, sampling and optimization, fund accounting practices, use of depository receipts, index changes, regulatory and tax requirements, and asset manager operations contribute to ETF tracking errors. Service fees paid by APs offset any incidentals that the ETF bears in the creation/redemption process and do not contribute to tracking error.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 43.1, LOS 43.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gordon Stenton, CFA, works for a small investment management firm in the United States. Part of his role involves managing portfolios for high net worth individuals. Currently, Stenton is corresponding with Rachael Matten. Matten has withdrawn her assets from Altune, an asset management firm, and is considering allocating $2.5 million of those funds to Stenton&#x27;s firm. Matten indicated that she was unhappy with the level of disclosure about trading methods and risk management that were employed at Altune.<\/p><p>Matten has sent Stenton a list of questions to assess the policies at Stenton&#x27;s firm.<\/p><p>The first issue Matten wants clarification on pertains to the use of VaR. Among the documents that Altune sent Matten were two statements (shown in Exhibit 1). Matten was unsure of how to interpret either of these statements.<\/p><p><b>Exhibit 1: VaR<\/b><\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Your portfolio has a 5% monthly VaR of $225,000.<\/td><\/tr><tr><td>VaR is calculated using a parametric methodology and an assumption of normality for all risk<\/td><td><\/td><\/tr><tr><td>factors.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>The average loss once the VaR cutoff is exceeded is estimated to be $320,000.<\/td><\/tr><\/table><\/div><p>Matten indicates that in Statement 1, she understands that the $225,000 represents the minimum loss that will occur 5% of the time. She would also like to confirm her suspicion that the 1% VaR (loss) would be lower.<\/p><p>To provide Matten the risk management process employed at his firm, Stenton intends to send Matten the description shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Primary Risk Management Measure – Steps<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Identify the top 10 exposures for the portfolio.<\/td><\/tr><tr><td>Step 2:<\/td><td>Design a hypothetical global event that would simultaneously adversely affect each of the<\/td><\/tr><tr><td>exposures.<\/td><td><\/td><\/tr><tr><td>Step 3:<\/td><td>Assess the impact on the portfolio.<\/td><\/tr><\/table><\/div><p>Matten has also raised an issue about investing in ETFs and the trading methods used by Stenton. She has read several negative comments in the financial press regarding the use of algorithms to trade and about the growing trend of high frequency trading. She has asked Stenton to comment on the concerns she has noted in Exhibit 3.<\/p><p><b>Exhibit 3: Concerns<\/b><\/p><div class=\"tbl\"><table><tr><td>Concern 1: <\/td><td>The tracking error of ETFs chosen by Stenton tends to be fairly high.<\/td><\/tr><tr><td>Concern 2: <\/td><td>The increase in market fragmentation resulting from an increase in electronic markets.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Stenton would least accurately respond to Concern 1 in Exhibit 3 by saying that tracking errors are caused by:<\/p><\/div>", "subj": "portfolio"}, {"n": 54, "q": "Stenton should most accurately respond to Concern 2 in Exhibit 3 by saying that:", "opts": ["U.S. markets are not fragmented.", "one specific type of trading algorithm, smart order routing, is chiefly responsible for market fragmentation.", "smart order routing was developed as a response to market fragmentation."], "ans": "C", "expl": "Market fragmentation occurs when the number of venues trading the same instrument increases. As a response, algorithms are used to aggregate liquidity and route orders to the venues that have the best price and market depth. For Further Reference: (Study Session 17, Module 48.2, LOS 48.e)", "explhtml": "<p>Market fragmentation occurs when the number of venues trading the same instrument increases. As a response, algorithms are used to aggregate liquidity and route orders to the venues that have the best price and market depth.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 48.2, LOS 48.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gordon Stenton, CFA, works for a small investment management firm in the United States. Part of his role involves managing portfolios for high net worth individuals. Currently, Stenton is corresponding with Rachael Matten. Matten has withdrawn her assets from Altune, an asset management firm, and is considering allocating $2.5 million of those funds to Stenton&#x27;s firm. Matten indicated that she was unhappy with the level of disclosure about trading methods and risk management that were employed at Altune.<\/p><p>Matten has sent Stenton a list of questions to assess the policies at Stenton&#x27;s firm.<\/p><p>The first issue Matten wants clarification on pertains to the use of VaR. Among the documents that Altune sent Matten were two statements (shown in Exhibit 1). Matten was unsure of how to interpret either of these statements.<\/p><p><b>Exhibit 1: VaR<\/b><\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Your portfolio has a 5% monthly VaR of $225,000.<\/td><\/tr><tr><td>VaR is calculated using a parametric methodology and an assumption of normality for all risk<\/td><td><\/td><\/tr><tr><td>factors.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>The average loss once the VaR cutoff is exceeded is estimated to be $320,000.<\/td><\/tr><\/table><\/div><p>Matten indicates that in Statement 1, she understands that the $225,000 represents the minimum loss that will occur 5% of the time. She would also like to confirm her suspicion that the 1% VaR (loss) would be lower.<\/p><p>To provide Matten the risk management process employed at his firm, Stenton intends to send Matten the description shown in Exhibit 2.<\/p><p><b>Exhibit 2: Risk Management Measures<\/b><\/p><p>Primary Risk Management Measure – Steps<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Identify the top 10 exposures for the portfolio.<\/td><\/tr><tr><td>Step 2:<\/td><td>Design a hypothetical global event that would simultaneously adversely affect each of the<\/td><\/tr><tr><td>exposures.<\/td><td><\/td><\/tr><tr><td>Step 3:<\/td><td>Assess the impact on the portfolio.<\/td><\/tr><\/table><\/div><p>Matten has also raised an issue about investing in ETFs and the trading methods used by Stenton. She has read several negative comments in the financial press regarding the use of algorithms to trade and about the growing trend of high frequency trading. She has asked Stenton to comment on the concerns she has noted in Exhibit 3.<\/p><p><b>Exhibit 3: Concerns<\/b><\/p><div class=\"tbl\"><table><tr><td>Concern 1: <\/td><td>The tracking error of ETFs chosen by Stenton tends to be fairly high.<\/td><\/tr><tr><td>Concern 2: <\/td><td>The increase in market fragmentation resulting from an increase in electronic markets.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Stenton should most accurately respond to Concern 2 in Exhibit 3 by saying that:<\/p><\/div>", "subj": "portfolio"}, {"n": 55, "q": "Equations (1) through (4) are examples of:", "opts": ["macroeconomic factor models.", "fundamental factor models.", "statistical factor models."], "ans": "A", "expl": "The models in equations 1 through 4 employ factors derived from macroeconomic variables. For Further Reference: (Study Session 16, Module 44.2, LOS 44.d)", "explhtml": "<p>The models in equations 1 through 4 employ factors derived from macroeconomic variables.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.2, LOS 44.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Samuel Edson, CFA, portfolio manager for Driver Associates, employs a multifactor model to evaluate individual stocks and portfolios. Edson examines several possible risk factors and finds two that are priced in the marketplace. These two factors are investor sentiment (IS) risk and business cycle (BC) risk. Edson manages three equity portfolios (A, B, and C) and derives the following relationships for each portfolio, as well as for the S&amp;P 500 stock market index:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= 0.1750 + 2.0F  + 1.5F<\/td><td>(1)<\/td><\/tr><tr><td>A<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.0940 + 0.5F  + 0.8F<\/td><td>(2)<\/td><\/tr><tr><td>B<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.1550 + 1.25F  + 1.15F<\/td><td>(3)<\/td><\/tr><tr><td>C<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.1475 + 1.5F  + 1.25F<\/td><td>(4)<\/td><\/tr><tr><td>S&amp;P<\/td><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R , R , R , and R<\/td><td>= the returns for portfolios A, B, C, and the S&amp;P 500 market index, respectively<\/td><td><\/td><td><\/td><\/tr><tr><td>A<\/td><td>B<\/td><td>C<\/td><td>S&amp;P<\/td><\/tr><\/table><\/div><p>Portfolios A and B are well-diversified, while C is a less than fully diversified, value-oriented portfolio. F  is the surprise in IS<\/p><div class=\"tbl\"><table><tr><td>investor sentiment, and F<\/td><td> is the surprise in the business cycle. Surprises in the risk factors are defined as the difference<\/td><\/tr><tr><td>BC<\/td><td><\/td><\/tr><\/table><\/div><p>between the actual value and the predicted value.<\/p><p>Exhibit 1 provides data for the actual and predicted values for the investor sentiment and business cycle risk factors.<\/p><p><b>Exhibit 1: Risk Factor Values<\/b><\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>Actual Value Predicted Value<\/td><td><\/td><\/tr><tr><td>Investor sentiment<\/td><td>1%<\/td><td>2%<\/td><\/tr><tr><td>Business cycle<\/td><td>2%<\/td><td>3%<\/td><\/tr><\/table><\/div><p>Driver Associates also provides Edson with the following multifactor equations on three additional portfolios (D, E, and Z):<\/p><div class=\"tbl\"><table><tr><td>E(R ) = R  + 1.0F  + 0.0F<\/td><td> = 9%<\/td><td>(5)<\/td><td><\/td><\/tr><tr><td>D<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>E(R )<\/td><td>= R  + 0.0F  + 1.0F<\/td><td> = 8%<\/td><td>(6)<\/td><\/tr><tr><td>E<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>E(R )<\/td><td>= R  + 1.5F  + 1.25F<\/td><td> = 14.75%<\/td><td>(7)<\/td><\/tr><tr><td>Z<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>Driver Associates uses a two-factor arbitrage pricing model to develop equilibrium expected returns for individual stocks and portfolios:<\/p><div class=\"tbl\"><table><tr><td>E(R) = risk-free rate + b λ  + b λ<\/td><td>(8)<\/td><\/tr><tr><td>1 1<\/td><td>2 2<\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>b<\/td><td>= sensitivity of the portfolio return to changes in risk factor 1<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>b<\/td><td>= sensitivity of the portfolio return to changes in risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 1<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><p>At the time of Edson&#x27;s analysis, the long-term government bond yield was 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>Equations (1) through (4) are examples of:<\/p><\/div>", "subj": "portfolio"}, {"n": 56, "q": "Edson's supervisor, Rosemary Valry, asks Edson to interpret the intercept of the multifactor equation for Portfolio A (0.175). Edson should respond that the intercept equals:", "opts": ["the expected return for Portfolio A, assuming no surprises in the macroeconomic variables.", "the expected return for Portfolio A, assuming the macroeconomic variables (investor sentiment and business cycle) equal zero.", "the expected abnormal return for Portfolio A."], "ans": "A", "expl": "The intercept in a macroeconomic factor model equals the expected return for the portfolio examined in the model (assuming no surprises in the macroeconomic variables). The factors in the multifactor equations, F and F , are factor IS BC \"surprises,\" which by definition are expected to equal zero (i.e., by definition, zero \"surprise\" is \"expected\"). So, by assumption, F and F are expected to equal zero. Therefore, the expected return for Portfolio A equals its intercept IS BC (17.5%). For Further Reference: (Study Session 16, Module 44.2, LOS 44.d)", "explhtml": "<p>The intercept in a macroeconomic factor model equals the expected return for the portfolio examined in the model<\/p><div class=\"tbl\"><table><tr><td>(assuming no surprises in the macroeconomic variables). The factors in the multifactor equations, F  and F<\/td><td>, are factor<\/td><\/tr><tr><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>&quot;surprises,&quot; which by definition are expected to equal zero (i.e., by definition, zero &quot;surprise&quot; is &quot;expected&quot;). So, by<\/p><div class=\"tbl\"><table><tr><td>assumption, F  and F<\/td><td> are expected to equal zero. Therefore, the expected return for Portfolio A equals its intercept<\/td><\/tr><tr><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>(17.5%).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.2, LOS 44.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samuel Edson, CFA, portfolio manager for Driver Associates, employs a multifactor model to evaluate individual stocks and portfolios. Edson examines several possible risk factors and finds two that are priced in the marketplace. These two factors are investor sentiment (IS) risk and business cycle (BC) risk. Edson manages three equity portfolios (A, B, and C) and derives the following relationships for each portfolio, as well as for the S&amp;P 500 stock market index:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= 0.1750 + 2.0F  + 1.5F<\/td><td>(1)<\/td><\/tr><tr><td>A<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.0940 + 0.5F  + 0.8F<\/td><td>(2)<\/td><\/tr><tr><td>B<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.1550 + 1.25F  + 1.15F<\/td><td>(3)<\/td><\/tr><tr><td>C<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.1475 + 1.5F  + 1.25F<\/td><td>(4)<\/td><\/tr><tr><td>S&amp;P<\/td><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R , R , R , and R<\/td><td>= the returns for portfolios A, B, C, and the S&amp;P 500 market index, respectively<\/td><td><\/td><td><\/td><\/tr><tr><td>A<\/td><td>B<\/td><td>C<\/td><td>S&amp;P<\/td><\/tr><\/table><\/div><p>Portfolios A and B are well-diversified, while C is a less than fully diversified, value-oriented portfolio. F  is the surprise in IS<\/p><div class=\"tbl\"><table><tr><td>investor sentiment, and F<\/td><td> is the surprise in the business cycle. Surprises in the risk factors are defined as the difference<\/td><\/tr><tr><td>BC<\/td><td><\/td><\/tr><\/table><\/div><p>between the actual value and the predicted value.<\/p><p>Exhibit 1 provides data for the actual and predicted values for the investor sentiment and business cycle risk factors.<\/p><p><b>Exhibit 1: Risk Factor Values<\/b><\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>Actual Value Predicted Value<\/td><td><\/td><\/tr><tr><td>Investor sentiment<\/td><td>1%<\/td><td>2%<\/td><\/tr><tr><td>Business cycle<\/td><td>2%<\/td><td>3%<\/td><\/tr><\/table><\/div><p>Driver Associates also provides Edson with the following multifactor equations on three additional portfolios (D, E, and Z):<\/p><div class=\"tbl\"><table><tr><td>E(R ) = R  + 1.0F  + 0.0F<\/td><td> = 9%<\/td><td>(5)<\/td><td><\/td><\/tr><tr><td>D<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>E(R )<\/td><td>= R  + 0.0F  + 1.0F<\/td><td> = 8%<\/td><td>(6)<\/td><\/tr><tr><td>E<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>E(R )<\/td><td>= R  + 1.5F  + 1.25F<\/td><td> = 14.75%<\/td><td>(7)<\/td><\/tr><tr><td>Z<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>Driver Associates uses a two-factor arbitrage pricing model to develop equilibrium expected returns for individual stocks and portfolios:<\/p><div class=\"tbl\"><table><tr><td>E(R) = risk-free rate + b λ  + b λ<\/td><td>(8)<\/td><\/tr><tr><td>1 1<\/td><td>2 2<\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>b<\/td><td>= sensitivity of the portfolio return to changes in risk factor 1<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>b<\/td><td>= sensitivity of the portfolio return to changes in risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 1<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><p>At the time of Edson&#x27;s analysis, the long-term government bond yield was 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>Edson&#x27;s supervisor, Rosemary Valry, asks Edson to interpret the intercept of the multifactor equation for Portfolio A (0.175). Edson should respond that the intercept equals:<\/p><\/div>", "subj": "portfolio"}, {"n": 57, "q": "The firm-specific surprises contributed 1.20% to Portfolio A's return. Using the data in Exhibit 1, the actual return on Portfolio A is closest to:", "opts": ["12.2%.", "13.7%.", "15.2%."], "ans": "C", "expl": "The multifactor equation for Portfolio A is used to answer this question. Simply insert the factor surprises for F and F . IS BC From Exhibit 1, F = 0.01 − 0.02 = –0.01 and F = 0.02 − 0.03 = –0.01. Therefore, both factor surprises equal –1%. IS BC Substituting into the multifactor equation for Portfolio A and including the firm-specific surprise return: 0.1750 + 2(–0.01) + 1.5(–0.01) + 0.012 = 15.2%. For Further Reference: (Study Session 16, Module 44.2, LOS 44.d)", "explhtml": "<div class=\"tbl\"><table><tr><td>The multifactor equation for Portfolio A is used to answer this question. Simply insert the factor surprises for F  and F<\/td><td>.<\/td><\/tr><tr><td>IS<\/td><td>BC<\/td><\/tr><tr><td>From Exhibit 1, F  = 0.01 − 0.02 = –0.01 and F<\/td><td> = 0.02 − 0.03 = –0.01. Therefore, both factor surprises equal –1%.<\/td><\/tr><tr><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>Substituting into the multifactor equation for Portfolio A and including the firm-specific surprise return: 0.1750 + 2(–0.01) + 1.5(–0.01) + 0.012 = 15.2%.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.2, LOS 44.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samuel Edson, CFA, portfolio manager for Driver Associates, employs a multifactor model to evaluate individual stocks and portfolios. Edson examines several possible risk factors and finds two that are priced in the marketplace. These two factors are investor sentiment (IS) risk and business cycle (BC) risk. Edson manages three equity portfolios (A, B, and C) and derives the following relationships for each portfolio, as well as for the S&amp;P 500 stock market index:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= 0.1750 + 2.0F  + 1.5F<\/td><td>(1)<\/td><\/tr><tr><td>A<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.0940 + 0.5F  + 0.8F<\/td><td>(2)<\/td><\/tr><tr><td>B<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.1550 + 1.25F  + 1.15F<\/td><td>(3)<\/td><\/tr><tr><td>C<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.1475 + 1.5F  + 1.25F<\/td><td>(4)<\/td><\/tr><tr><td>S&amp;P<\/td><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R , R , R , and R<\/td><td>= the returns for portfolios A, B, C, and the S&amp;P 500 market index, respectively<\/td><td><\/td><td><\/td><\/tr><tr><td>A<\/td><td>B<\/td><td>C<\/td><td>S&amp;P<\/td><\/tr><\/table><\/div><p>Portfolios A and B are well-diversified, while C is a less than fully diversified, value-oriented portfolio. F  is the surprise in IS<\/p><div class=\"tbl\"><table><tr><td>investor sentiment, and F<\/td><td> is the surprise in the business cycle. Surprises in the risk factors are defined as the difference<\/td><\/tr><tr><td>BC<\/td><td><\/td><\/tr><\/table><\/div><p>between the actual value and the predicted value.<\/p><p>Exhibit 1 provides data for the actual and predicted values for the investor sentiment and business cycle risk factors.<\/p><p><b>Exhibit 1: Risk Factor Values<\/b><\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>Actual Value Predicted Value<\/td><td><\/td><\/tr><tr><td>Investor sentiment<\/td><td>1%<\/td><td>2%<\/td><\/tr><tr><td>Business cycle<\/td><td>2%<\/td><td>3%<\/td><\/tr><\/table><\/div><p>Driver Associates also provides Edson with the following multifactor equations on three additional portfolios (D, E, and Z):<\/p><div class=\"tbl\"><table><tr><td>E(R ) = R  + 1.0F  + 0.0F<\/td><td> = 9%<\/td><td>(5)<\/td><td><\/td><\/tr><tr><td>D<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>E(R )<\/td><td>= R  + 0.0F  + 1.0F<\/td><td> = 8%<\/td><td>(6)<\/td><\/tr><tr><td>E<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>E(R )<\/td><td>= R  + 1.5F  + 1.25F<\/td><td> = 14.75%<\/td><td>(7)<\/td><\/tr><tr><td>Z<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>Driver Associates uses a two-factor arbitrage pricing model to develop equilibrium expected returns for individual stocks and portfolios:<\/p><div class=\"tbl\"><table><tr><td>E(R) = risk-free rate + b λ  + b λ<\/td><td>(8)<\/td><\/tr><tr><td>1 1<\/td><td>2 2<\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>b<\/td><td>= sensitivity of the portfolio return to changes in risk factor 1<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>b<\/td><td>= sensitivity of the portfolio return to changes in risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 1<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><p>At the time of Edson&#x27;s analysis, the long-term government bond yield was 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>The firm-specific surprises contributed 1.20% to Portfolio A&#x27;s return. Using the data in Exhibit 1, the actual return on Portfolio A is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 58, "q": "Driver Associates uses portfolios D, E, and Z as part of their risk management strategies. Which of these portfolios are factor portfolios?", "opts": ["Portfolios D and E.", "Portfolios D and Z.", "Portfolio Z only."], "ans": "A", "expl": "A portfolio that has a sensitivity of 1.0 to one of the macroeconomic factors, and zero sensitivity to the remaining macroeconomic factors is called a factor portfolio. Portfolios D and E are factor portfolios. A portfolio that has factor sensitivities that equal the sensitivities of the benchmark is called a tracking portfolio. Portfolio Z has factor sensitivities that exactly match those of the S&P 500. For Further Reference: (Study Session 16, Module 44.3, LOS 44.f)", "explhtml": "<p>A portfolio that has a sensitivity of 1.0 to one of the macroeconomic factors, and zero sensitivity to the remaining macroeconomic factors is called a factor portfolio. Portfolios D and E are factor portfolios. A portfolio that has factor sensitivities that equal the sensitivities of the benchmark is called a tracking portfolio. Portfolio Z has factor sensitivities that exactly match those of the S&amp;P 500.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.3, LOS 44.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samuel Edson, CFA, portfolio manager for Driver Associates, employs a multifactor model to evaluate individual stocks and portfolios. Edson examines several possible risk factors and finds two that are priced in the marketplace. These two factors are investor sentiment (IS) risk and business cycle (BC) risk. Edson manages three equity portfolios (A, B, and C) and derives the following relationships for each portfolio, as well as for the S&amp;P 500 stock market index:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= 0.1750 + 2.0F  + 1.5F<\/td><td>(1)<\/td><\/tr><tr><td>A<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.0940 + 0.5F  + 0.8F<\/td><td>(2)<\/td><\/tr><tr><td>B<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.1550 + 1.25F  + 1.15F<\/td><td>(3)<\/td><\/tr><tr><td>C<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>R<\/td><td>= 0.1475 + 1.5F  + 1.25F<\/td><td>(4)<\/td><\/tr><tr><td>S&amp;P<\/td><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R , R , R , and R<\/td><td>= the returns for portfolios A, B, C, and the S&amp;P 500 market index, respectively<\/td><td><\/td><td><\/td><\/tr><tr><td>A<\/td><td>B<\/td><td>C<\/td><td>S&amp;P<\/td><\/tr><\/table><\/div><p>Portfolios A and B are well-diversified, while C is a less than fully diversified, value-oriented portfolio. F  is the surprise in IS<\/p><div class=\"tbl\"><table><tr><td>investor sentiment, and F<\/td><td> is the surprise in the business cycle. Surprises in the risk factors are defined as the difference<\/td><\/tr><tr><td>BC<\/td><td><\/td><\/tr><\/table><\/div><p>between the actual value and the predicted value.<\/p><p>Exhibit 1 provides data for the actual and predicted values for the investor sentiment and business cycle risk factors.<\/p><p><b>Exhibit 1: Risk Factor Values<\/b><\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>Actual Value Predicted Value<\/td><td><\/td><\/tr><tr><td>Investor sentiment<\/td><td>1%<\/td><td>2%<\/td><\/tr><tr><td>Business cycle<\/td><td>2%<\/td><td>3%<\/td><\/tr><\/table><\/div><p>Driver Associates also provides Edson with the following multifactor equations on three additional portfolios (D, E, and Z):<\/p><div class=\"tbl\"><table><tr><td>E(R ) = R  + 1.0F  + 0.0F<\/td><td> = 9%<\/td><td>(5)<\/td><td><\/td><\/tr><tr><td>D<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>E(R )<\/td><td>= R  + 0.0F  + 1.0F<\/td><td> = 8%<\/td><td>(6)<\/td><\/tr><tr><td>E<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><tr><td>E(R )<\/td><td>= R  + 1.5F  + 1.25F<\/td><td> = 14.75%<\/td><td>(7)<\/td><\/tr><tr><td>Z<\/td><td>F<\/td><td>IS<\/td><td>BC<\/td><\/tr><\/table><\/div><p>Driver Associates uses a two-factor arbitrage pricing model to develop equilibrium expected returns for individual stocks and portfolios:<\/p><div class=\"tbl\"><table><tr><td>E(R) = risk-free rate + b λ  + b λ<\/td><td>(8)<\/td><\/tr><tr><td>1 1<\/td><td>2 2<\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>b<\/td><td>= sensitivity of the portfolio return to changes in risk factor 1<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>b<\/td><td>= sensitivity of the portfolio return to changes in risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 1<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><p>At the time of Edson&#x27;s analysis, the long-term government bond yield was 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>Driver Associates uses portfolios D, E, and Z as part of their risk management strategies. Which of these portfolios are factor portfolios?<\/p><\/div>", "subj": "portfolio"}, {"n": 59, "q": "Valry instructs Edson to use the two-factor model to examine Driver Associates's well-diversified balanced Portfolio P, which has an Investor Sentiment factor sensitivity equal to 1.25 and a Business Cycle factor sensitivity equal to 1.10. According to Driver Associates's model, the expected return for Portfolio P equals:", "opts": ["8.3%.", "10.8%.", "13.3%."], "ans": "C", "expl": "According to the Arbitrage Pricing Model, the expected return equals risk-free rate + b RP + b RP , where RP is the risk 1 1 2 2 i premium for factor i. Portfolio D is designed to have sensitivity equal to one to the investor sentiment risk factor and sensitivity equal to zero to the business cycle risk factor. Similarly, Portfolio E is a portfolio designed to have sensitivity equal to zero to the investor sentiment risk factor and sensitivity equal to one to the business cycle risk factor. Portfolios that have a sensitivity equal to 1.0 to one factor and zero sensitivity to the remaining factors are called factor portfolios. Therefore, Portfolio D is the investor sentiment factor portfolio, and Portfolio E is the business cycle factor portfolio. According to the multifactor equations, the expected return for the investor sentiment factor portfolio (D) equals 9% and for the business cycle factor portfolio (E) equals 8%. Risk premiums are defined as the difference between the expected return on the appropriate factor portfolio and the risk-free rate. The risk-free rate is 5% (the long-term government bond yield). Therefore, the investor sentiment risk premium equals 0.09 − 0.05 = 0.04. Similarly, the business cycle risk premium equals 0.08 − 0.05 = 0.03. Therefore, the expected return for Portfolio P equals 0.05 + 1.25(0.04) + 1.1(0.03) = 13.3%. For Further Reference: (Study Session 16, Module 44.2, LOS 44.d)", "explhtml": "<p>According to the Arbitrage Pricing Model, the expected return equals risk-free rate + b RP  + b RP , where RP  is the risk<\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>1<\/td><td>2<\/td><td>2<\/td><td>i<\/td><\/tr><\/table><\/div><p>premium for factor i. Portfolio D is designed to have sensitivity equal to one to the investor sentiment risk factor and sensitivity equal to zero to the business cycle risk factor. Similarly, Portfolio E is a portfolio designed to have sensitivity equal to zero to the investor sentiment risk factor and sensitivity equal to one to the business cycle risk factor. Portfolios that have a sensitivity equal to 1.0 to one factor and zero sensitivity to the remaining factors are called factor portfolios. Therefore, Portfolio D is the investor sentiment factor portfolio, and Portfolio E is the business cycle factor portfolio. According to the multifactor equations, the expected return for the investor sentiment factor portfolio (D) equals 9% and for the business cycle factor portfolio (E) equals 8%. Risk premiums are defined as the difference between the expected return on the appropriate factor portfolio and the risk-free rate. The ass=\"tbl\"><table><tr><td>λ<\/td><td>= risk premium associated with risk factor 2<\/td><\/tr><\/table><\/div><p>2<\/p><p>At the time of Edson&#x27;s analysis, the long-term government bond yield was 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>Valry instructs Edson to use the two-factor model to examine Driver Associates&#x27;s well-diversified balanced Portfolio P, which has an Investor Sentiment factor sensitivity equal to 1.25 and a Business Cycle factor sensitivity equal to 1.10. According to Driver Associates&#x27;s model, the expected return for Portfolio P equals:<\/p><\/div>", "subj": "portfolio"}, {"n": 60, "q": "Assuming Driver Associates uses the S&P 500 Index as their performance benchmark, which of the following portfolios is expected to have the least active factor risk?", "opts": ["Portfolio D.", "Portfolio E.", "Portfolio Z."], "ans": "C", "expl": "Active factor risk is caused by deviations of a portfolio's factor sensitivities from the benchmark factor sensitivities. Deviations are quite large for both Portfolios D and E, but Portfolio Z's factor sensitivities match those of the S&P 500 benchmark (1.5 and 1.25). For Further Reference: (Study Session 16, Module 44.3, LOS 44.f)", "explhtml": "<p>Active factor risk is caused by deviations of a portfolio&#x27;s factor sensitivities from the benchmark factor sensitivities. Deviations are quite large for both Portfolios D and E, but Portfolio Z&#x27;s factor sensitivities match those of the S&amp;P 500 benchmark (1.5 and 1.25).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.3, LOS 44.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samuel Edson, CFA, portfolio manager for Driver Associates, employs a multifactor model to evaluate individual stocks and portfolios. Edson examines several possible risk factors const CFG = {"title": "Extra Full Syllabus V1 · Exam 2 — Morning (AM)", "subtitle": "CFA Level II · 60 câu · 3 giờ", "minutes": 180, "passMark": 65, "hasAnswers": true, "hasExpl": true};

let answers = {};      // i -> letter
let pinned  = {};      // i -> true

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");

  Object.keys(pinned).forEach(i=>{

  if(done>0 && !graded){

}

  $("title").textContent = CFG.title || "Quiz";

    head.appendChild(num); head.appendChild(pin);

  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";

      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";

  let correct = 0;
  DATA.forEach((q,i)=>{

const CFA_SESSION_SUBJECT_RANGES = {

};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,

  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->

<style id="qnav-note-css">

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
