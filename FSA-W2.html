nly basic EPS.", "dilutive and report both diluted EPS and basic EPS."], "ans": "B", "expl": "Both US GAAP and IFRS require companies that have convertible securities in their capital structure (ie, complex structure) to calculate and\nreport both basic earnings per share (EPS) and diluted EPS. Diluted EPS assumes that all convertible securities were converted to common stock\nat the beginning of the period. Conversion usually causes EPS to be lower due to the increased number of shares over which net income is\napportioned.\nWhen diluted EPS is greater than basic EPS, the convertible securities are described as antidilutive. Both GAAP and IFRS require a company to\nexclude antidilutive securities from EPS calculations and report only the lower EPS figure (ie, basic EPS). Company Z has both convertible\npreferred and common stock, but since its diluted EPS is $0.05 greater than basic EPS, the convertible preferred stock is antidilutive. Therefore,\nCompany Z will report only the basic EPS of $0.50 for the year.\n(Choice A) The convertible preferred stock is antidilutive, so Company Z will report only basic EPS.\n(Choice C) The convertible preferred stock is antidilutive, but GAAP and IFRS both require Company Z to report basic, not diluted, EPS.\nThings to remember:\nEven if a security is convertible, if its conversion to common stock causes earnings per share (EPS) to increase, then the security is antidilutive\nand is treated as nonconvertible when calculating EPS. If diluted EPS is higher than basic EPS, both IFRS and US GAAP require the company to\nreport only basic EPS.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 29, "q": "A company has issued convertible bonds and has no other dilutive securities outstanding. If the convertible bonds are antidilutive, the impact on reported basic and diluted earnings per share (EPS) is most likely that:", "opts": ["basic EPS increases.", "neither earnings measure changes.", "both basic and diluted EPS are impacted."], "ans": "B", "expl": "IFRS and US GAAP require companies to report basic and diluted earnings per share (EPS). Basic EPS is calculated by dividing the firm's\nincome available to common shareholders (ie, net income less preferred dividends) by its weighted average number of common shares. Basic\nEPS ignores any impact from potentially dilutive convertible securities. If the company has a simple capital structure with no convertible\nsecurities, then diluted EPS is equal to basic EPS.\nIf the company has a complex capital structure, and if its convertible securities are dilutive, then diluted EPS is less than basic EPS. Accounting\nstandards treat all dilutive convertible securities as if they are converted to common stock at the beginning of the year. In general, this\nhypothetical conversion increases the number of shares outstanding, which makes diluted EPS less than basic EPS.\nIn some cases, conversion results in fewer common shares outstanding and/or in more earnings available to common shareholders, which causes\ncalculated diluted EPS to be greater than basic EPS. In such cases, the securities are antidilutive. Since companies should report the most\nconservative (ie, lowest) figure for EPS, if basic EPS is lower than calculated diluted EPS, then reported diluted EPS is equal to basic EPS. Both\nbasic and diluted EPS effectively ignore any impact from antidilutive securities (Choices A and C).\nThings to remember:\nAntidilutive convertible securities indicate that were the securities converted, there would be fewer shares outstanding and/or more earnings\navailable to common shareholders, which causes calculated diluted earnings per share (EPS) to be greater than basic EPS. In that case, reported\ndiluted EPS is equal to basic EPS since it is the more conservative measure.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 30, "q": "A company will report net income of €30 million this fiscal year ending 31 December. It began the year with 40 million common shares and neither issued nor repurchased common shares during the year. On July 1, the firm sold 100,000 shares of convertible preferred stock for €50 per share. The shares carry a 5% dividend and are immediately convertible into 20 shares of common stock. The effective tax rate is 40%. The company's diluted EPS for the year is closest to: ", "opts": ["€0.71", "€0.73", "€0.74"], "ans": "A", "expl": "A corporation must report basic earnings per share (EPS) as well as diluted EPS if its capital structure includes securities that can be\nconverted into common shares. If converted, such securities increase the number of shares outstanding, so net income is divided by more\nshares, resulting in a lower per-share figure.\nFor calculating diluted EPS, convertible preferred stock is assumed to have been converted to common stock (ie, if-converted method) at the\nbeginning of the period.\nThe if-converted method treats the preferred stock as though it never existed, so the company will not have to pay dividends on it. For diluted\nEPS, the dividends that would have been paid are added back to net income, which increases the numerator. Firm B's adjustments from basic to\ndiluted EPS are shown below:\n(Choice B) The preferred dividends were added back to net income, so the numerator is correct, but the weighted average number of shares was\ncalculated as if the preferred stock had been converted as of the date it was issued (July 1), rather than the beginning of the period (January 1).\nThis would cause the additional shares to be 1,000,000 instead of 2,000,000, and the diluted EPS to be approximately 0.73.\n(Choice C) 0.74 is closest to the company's basic EPS, not its diluted EPS.\nThings to remember:\nConversion of convertible securities is assumed to be at the beginning of the period if the securities were outstanding at the beginning of the\nperiod. If the securities were issued during the period, conversion is assumed to have occurred at as of the date of issuance.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 31, "q": "A company just sold a warehouse that it no longer uses. The sale price was $4 million payable in equal installments over four years. The buyer has paid the first installment of $1 million and is expected to make the remaining payments on time. The company carried the warehouse on its balance sheet at its net book value of $6 million. This year, the company will most appropriately recognize a loss of:", "opts": ["$0", "$500,000", "$2,000,000"], "ans": "C", "expl": "Under the accrual accounting method, revenues are generally recognized in the accounting period they are earned, and any associated gains or\nlosses are also recognized in the same period. A seller earns the revenue by performing all its requirements under a contract. One exception to\nthe general rule is for installment sales, in which the seller receives payments over more than one accounting period.\nWith installments, the seller recognizes a prorated amount of the total profit from the sale each year. However, the installment sales exception\napplies only when the seller has a gain from the sale. If the sale is made at a loss, then the entire loss is realized immediately and recognized\nin the period of the sale.\n(Choice A) Although the company's loss may exceed $2 million if the buyer defaults on payments, the firm at this point has no reason to assume\nthat the buyer will default. There is no uncertainty surrounding the current amount of the company's loss of $2 million; therefore, the firm must\nimmediately realize and recognize the loss.\n(Choice B) The installment sales exception does not apply to sales made at a loss, and the seller cannot prorate the loss over the installment\nperiod.\nThings to remember:\nDeferring realization and recognition of revenues through use of the installment sales method applies only when the transaction would result in a\ngain at the time of sale. When the sale is made at a loss, the entire loss must be realized and recognized in the period of the sale.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for\nfinancial analysis", "qhtml": null}, {"n": 32, "q": "An analyst gathers the following information about a company for the most recent fiscal year: annual net income: HKD 500 million weighted average common shares outstanding: 250 million convertible debt outstanding: HKD 100 million at 9% interest, convertible into 10 million common shares tax rate: 33.33% If there are no other dilutive securities, then diluted EPS (in HKD) is closest to: ", "opts": ["1.95", "2.00", "2.11"], "ans": "A", "expl": "Companies with complex capital structures (ie, potentially dilutive securities) may report a diluted EPS that is different from its basic EPS.\nDilutive securities, such as convertible debt, are convertible into shares of common stock. Companies issue additional common shares upon\nconversion, thus increasing the number of shares outstanding and reducing EPS. Under the if-converted method, diluted EPS is calculated\nassuming that conversion occurred at the beginning of the year.\nIf the company had converted its convertible bonds at the beginning of the period to common shares, it would not have paid after-tax interest\nexpense of HKD 6 million for the year. Therefore, it is added back to net income in the diluted EPS numerator. Furthermore, the company would\nhave issued 10 million additional common shares, which increases the denominator and dilutes the EPS to HKD 1.95.\n(Choice B) 2.00 is the basic EPS.\n(Choice C) 2.11 results from subtracting the new common shares in the denominator, instead of adding.\nThings to remember:\nUnder the if-converted method, diluted EPS is calculated assuming that conversion occurred at the beginning of the year. For companies with\nconvertible debt in their capital structure, add back after-tax interest cost to net income in the numerator and add additional common shares issued\nto the denominator.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 33, "q": "Which of the following best describes a conservative approach for managing expenses?", "opts": ["Using estimates that maximize periodic expenses", "Expensing the cost of warranties when they occur", "Decreasing receivables when an account is deemed uncollectible"], "ans": "A", "expl": "Conservative accounting policies\nUnderstate net income\nOverstate expenses\nUse estimates to recognize expenses\nOne aspect of a company's reporting is how conservative its accounting policies are. Companies using highly conservative accounting policies\nensure that operational uncertainties are adequately considered and disclosed in their financial statements. The use of estimates that produce\nhigher expenses (ie, lower net income) is considered conservative.\nThe cost of warranties is unknown since the future claims are uncertain. To be conservative, a company should record estimated warranty\nexpenses immediately and in each period. This is preferable to waiting until the actual warranty expenses occur (Choice B).\nSimilarly, when a company has credit sales, customer defaults are uncertain at the time of purchase. The company should estimate defaults and\nrecord an expense in each period. It would be less conservative to wait and decrease accounts receivable as incurred since this would delay\nrecognition of the bad debt expense (Choice C).\nThings to remember:\nCompanies may use conservative accounting policies to ensure that operational uncertainties are adequately considered and disclosed in their\nfinancial statements. The use of estimates to calculate expenses is considered more conservative than waiting for actual events to occur since it\nallows companies to recognize a greater expense (eg, more than zero) earlier.\nDescribe general principles of expense recognition, specific expense recognition applications, implications of expense recognition choices for\nfinancial analysis and contrast costs that are capitalized versus those that are expensed in the period in which they are incurred", "qhtml": null}, {"n": 34, "q": "An analyst collects the following information on a company for the most recent reporting period: Net income €100 million Preferred dividends €5 million Weighted average common shares outstanding 150 million Stock options 20 million Exercise price €30 Average stock price €40 Based on this information, if the number of stock options is constant during the period, then the company's diluted EPS (in €) is closest to:", "opts": ["0.56", "0.61", "0.63"], "ans": "B", "expl": "The method used to calculate diluted EPS for a company with outstanding options assumes that:\nthe options will be converted into common shares (ie, exercised) if the average stock price is greater than the exercise price, and\nthe company will use all cash proceeds from the exercised options to repurchase shares at the average market price to mitigate EPS\ndilution.\nThus, the net share increase equals new common shares issued, net of repurchases.\nNote that since the average stock price (€40) is greater than the exercise price (€30), all 20 million options are assumed to be converted into\ncommon shares. The company would have used all options proceeds (20 million × €30, or €600 million) to repurchase 15 million shares (€600\nmillion / €40), thus increasing net new shares by 5 million.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and diluted earnings per share for companies with\nsimple and complex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 35, "q": "A company's 20X6 income statement is: On the company's 20X6 common-size income statement, rent expense is closest to: ", "opts": ["5%", "10%", "33%"], "ans": "A", "expl": "A common-size income statement shows each income statement figure as a percentage of revenue. Since this method evaluates all\nexpenses and overall profitability in proportion to revenue, not as absolute numbers, it allows for more useful reviews of a company's performance\nover multiple periods or comparisons between two companies. In this scenario, rent expense, expressed as a percentage of revenue, is 5%\n(10,000 ÷ 200,000):\nOne exception is made for tax expense, which is expressed as a percentage of pretax income, not revenue. That percentage is the company's\neffective tax rate. Although tax expense and the effective tax rate are related to revenue, they also reflect a company's management of tax\nobligations, so the effective tax rate is the preferred metric for comparisons. This metric also allows analysts to project net income based on\nhistorical effective tax rates.\nThings to remember:\nPreparing a common-size income statement requires converting each income statement figure to a percentage of revenue. The one exception is\ntax expense, which is expressed as a percentage of pretax income, not revenue.\nEvaluate a company’s financial performance using common-size income statements and financial ratios based on the income statement", "qhtml": null}];
const CFG = {"title": "Wiley · Analyzing Income Statements", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Financial Statement Analysis · 35 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
