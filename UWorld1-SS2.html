ông phải danh mục đầu tư chênh lệch tối thiểu toàn cầu và tài sản phi rủi ro. Danh mục đầu tư\nđược tạo bằng danh mục chênh lệch tối thiểu toàn cầu sẽ ở mức dưới mức tối ưu so với danh mục được tạo\nvới danh mục đầu tư rủi ro tối ưu.\n(Lựa chọn C) CAL mô tả danh mục đầu tư được tạo từ danh mục thị trường lý thuyết và\ntài sản phi rủi ro lý thuyết, không phải chứng khoán chính phủ ngắn hạn.\nNhững điều cần nhớ:\nĐường thị trường vốn, một ứng dụng của đường phân bổ vốn, thay thế\ndanh mục đầu tư lý thuyết bằng tài sản thực tế.\nGiải thích đường phân bổ vốn (CAL) và đường thị trường vốn (CML)\nLOS","qhtml":null},{"n":27,"q":"Which of the following factors is most appropriately a concern for potential shareholders?","opts":["An activist shareholder with a significant position","Executive remuneration that includes time-vested shares","Governance codes implemented on a \"comply or explain\" basis"],"ans":"A","expl":"Các yếu tố chính liên quan đến quản trị doanh nghiệp và\nquản lý các bên liên quan\nQuyền sở hữu công ty và cơ cấu biểu quyết\nĐại diện cổ đông trong hội đồng quản trị giám đốc\nThù lao và khuyến khích cho ban quản lý\nCác nhà đầu tư hoạt động đáng kể\nSức mạnh của quyền cổ đông\nQuản lý rủi ro dài hạn\nQuy tắc quản trị và tiết lộ sai lệch so với mã\nCác nhà đầu tư quan trọng có xu hướng hoạt động có thể ảnh hưởng lớn đến nhiều chức năng\ncủa công ty bằng cách gây áp lực lên ban quản lý thông qua các chiến thuật như bắt đầu các cuộc chiến ủy quyền,\nđề xuất các giải pháp cho cổ đông và nâng cao nhận thức về các vấn đề có thể gây tranh cãi.\nĐộng lực chính cho hoạt động tích cực thường là tăng giá trị cổ đông theo cách mà\nnhà hoạt động tin rằng là tốt nhất. Điều này có thể khiến các cổ đông tiềm năng lo ngại vì sự hiện diện của\nmột nhà hoạt động có thể ảnh hưởng đến định hướng chiến lược của công ty và gây ra\nnhững thay đổi đáng kể đối với thành phần cổ đông .\n(Lựa chọn B) Kế hoạch thù lao cho giám đốc điều hành bao gồm cổ phiếu được giao theo thời gian sẽ khuyến khích\ncác nhà điều hành có tầm nhìn dài hạn về hiệu quả hoạt động của công ty. Quan điểm này phù hợp hơn với\nlợi ích của cổ đông hơn là tiền mặt hoặc các ưu đãi ngắn hạn khác.\n(Lựa chọn C) Các quy tắc quản trị được triển khai trên cơ sở \"tuân thủ hoặc giải thích\" là tự nguyện nhưng\nyêu cầu mọi sai lệch so với các quy tắc phải được tiết lộ công khai, điều này thúc đẩy tính minh bạch của thông tin\nvà là một lợi thế cho các cổ đông.\nNhững điều cần làm hãy nhớ:\nSự tham gia của cổ đông mô tả sự tương tác của công ty với các cổ đông. Một nhà đầu tư\nhoạt động có vị trí quan trọng trong cổ phiếu của công ty có thể thay đổi đáng kể\nthành phần cổ đông và ảnh hưởng đến chiến lược của công ty. Sự hiện diện của một nhà đầu tư như vậy\ncó thể là mối lo ngại đối với các nhà đầu tư tiềm năng.\nMô tả quản trị doanh nghiệp và cơ chế quản lý mối quan hệ với các bên liên quan và giảm thiểu\nrủi ro liên quan\nLOS","qhtml":null},{"n":28,"q":"An advisor is evaluating an equity portfolio's risk-adjusted return for last year. It is most\nappropriate for the advisor to use the Sharpe ratio, rather than the Treynor ratio, if:","opts":["last year's excess return is negative.","the investor's portfolio is not fully diversified.","the advisor is considering only systematic risk."],"ans":"B","expl":"So sánh sử dụng tỷ lệ Sharpe so với tỷ lệ Treynor\nSử dụng tỷ lệ Sharpe khi… Sử dụng tỷ lệ Treynor khi:\nNhà đầu tư không sở hữu tài sản nào khác Beta của tài sản (hoặc danh mục đầu tư)\nso với danh mục đầu tư dương\nđược đánh giá Chỉ số rủi ro là rủi ro hệ thống\nChỉ số rủi ro là tổng rủi ro (được đo bằng beta)\n(được đo theo tiêu chuẩn Tài sản chỉ chiếm một phần của\nđộ lệch) tổng nắm giữ của nhà đầu tư\nTài sản của nhà đầu tư không được đa dạng hóa hoàn toàn\ntỷ lệ Sharpe và Treynor đều đo lường lợi nhuận được điều chỉnh theo rủi ro để đánh giá\nlợi nhuận vượt mức của một khoản đầu tư so với rủi ro của nó. Tử số của các tỷ số giống hệt nhau. Tuy nhiên,\nmẫu số của tỷ lệ Sharpe là tổng rủi ro—tổng của rủi ro hệ thống (tức là không thể đa dạng hóa)\nvà rủi ro phi hệ thống—trong khi mẫu số của tỷ lệ Treynor chỉ là rủi ro hệ thống.\nCác nhà đầu tư chỉ được đền bù khi giả định rủi ro hệ thống (được đo bằng beta) vì\nrủi ro phi hệ thống có thể được loại bỏ thông qua đa dạng hóa. Một danh mục đầu tư không được đa dạng hóa hoàn toàn\n(như trong kịch bản này) sẽ gặp rủi ro tổng thể (được đo bằng độ lệch chuẩn).\nVì tỷ lệ Sharpe đánh giá lợi nhuận vượt mức so với tổng rủi ro nên tỷ lệ thích hợp\nđể đánh giá lợi nhuận điều chỉnh theo rủi ro của danh mục đầu tư không đa dạng hóa (hoặc ít hơn mức đa dạng hóa hoàn toàn).\n(Lựa chọn A) Để có ý nghĩa, cả hai tỷ lệ đều yêu cầu tử số dương. Tỷ lệ lớn nhất\nthể hiện lợi nhuận được điều chỉnh theo rủi ro tốt nhất. Tuy nhiên, tử số âm sẽ tạo ra tỷ lệ âm\nít hơn cho danh mục đầu tư rủi ro hơn, do đó thứ hạng sẽ không chính xác.\n(Lựa chọn C) Một cố vấn quan tâm đến việc đánh giá lợi nhuận được điều chỉnh theo rủi ro chỉ dựa trên\nrủi ro hệ thống sẽ sử dụng tỷ lệ Treynor một cách thích hợp nhất chứ không phải tỷ lệ Sharpe. Tỷ lệ\nTreynor đánh giá lợi nhuận vượt mức so với beta, đây chỉ là thước đo rủi ro\ncó hệ thống.\nNhững điều cần nhớ:\nTỷ lệ Sharpe và Treynor là thước đo lợi tức đầu tư vượt mức được điều chỉnh theo rủi ro.\nTỷ lệ Sharpe đánh giá lợi nhuận vượt mức so với tổng rủi ro, trong khi tỷ lệ Treynor\nđánh giá lợi nhuận vượt mức tương ứng với rủi ro hệ thống. Tỷ lệ Sharpe phù hợp hơn\nkhi khoản đầu tư đang được đánh giá chưa được đa dạng hóa hoàn toàn và do đó gặp phải\ncả rủi ro hệ thống và phi hệ thống.\nTính toán và giải thích tỷ lệ Sharpe, tỷ lệ Treynor, M2 và alpha\nLOS","qhtml":null},{"n":29,"q":"A company undertakes an average-risk project, which is 100% financed with debt and\ngenerates relevant overhead costs. One year later, the CFO realizes that the project's NPV\nhad been significantly overestimated. Which of the following capital allocation mistakes\nwould most appropriately explain this overestimation?","opts":["Overestimating overhead costs","Disregarding ROE when analyzing the project","Using the cost of debt to discount the projected cash flows"],"ans":"C","expl":"Ban quản lý của công ty sử dụng quy trình phân bổ vốn khi đưa ra quyết định đầu tư vốn\n. Một giả định quan trọng của quá trình này là chi phí tài chính\nbị bỏ qua khi ước tính dòng tiền của dự án vì chúng đã được phản ánh\ntrong tỷ lệ chiết khấu. Tỷ lệ chiết khấu phù hợp là tỷ lệ lợi nhuận bắt buộc , là:\nlợi nhuận tối thiểu mà nhà đầu tư sẽ chấp nhận khi thực hiện một dự án,\ntỷ lệ chiết khấu được điều chỉnh theo rủi ro và\ndành riêng cho dự án, do đó, các dự án rủi ro hơn sẽ yêu cầu tỷ lệ cao hơn.\nTỷ suất lợi nhuận yêu cầu còn được gọi là chi phí cơ hội của vốn vì công ty\nước tính lợi nhuận của các dự án có thể so sánh được và chọn (các) phương án thay thế tốt nhất để đầu tư.\nTất cả các dự án đã thực hiện đều trở thành một phần danh mục đầu tư của công ty , được tài trợ bởi\nsự kết hợp giữa các công cụ vốn và nợ. Tỷ suất lợi nhuận yêu cầu của nhà đầu tư vốn cổ phần được xác định bởi\ncấu trúc vốn này, được điều chỉnh theo hồ sơ rủi ro của từng dự án.\nNgay cả đối với một dự án có rủi ro trung bình, chi phí nợ sẽ luôn thấp hơn tỷ suất lợi nhuận yêu cầu\n, điều này phản ánh rủi ro lớn hơn đối với các nhà đầu tư vốn cổ phần (tức là chi phí vốn cổ phần).\nDo đó, việc chiết khấu dòng tiền bằng chi phí nợ đánh giá thấp mức yêu cầu\ntrả về và đánh giá quá cao NPV của dự án .\n(Lựa chọn A) Việc ước tính không chính xác chi phí chung do dự án tạo ra là một lỗi phổ biến\nphân bổ vốn. Đánh giá quá cao chi phí chung sẽ dẫn đến NPV bị đánh giá thấp.\n(Lựa chọn B) ROE là một số liệu kế toán ngắn hạn và không nên đưa vào\nquyết định đầu tư. Quyết định này phải dựa trên phân tích dòng tiền và tập trung vào\nlợi ích dài hạn của các cổ đông.\nNhững điều cần nhớ:\nDòng tiền của dự án nên được chiết khấu theo đúng quy định suất chiết khấu được điều chỉnh theo rủi ro,\ntỷ suất lợi nhuận yêu cầu. Việc giảm giá chỉ bằng chi phí nợ là một sai lầm sẽ dẫn đến\nNPV được đánh giá quá cao.\nMô tả các nguyên tắc phân bổ vốn và những cạm bẫy phân bổ vốn phổ biến\nLOS","qhtml":null},{"n":30,"q":"In a corporate bond indenture, which of the following is most likely a negative covenant?","opts":["Prohibiting a bond call before the first call date","Restricting the issuance of debt senior to existing bond issues","Limiting interest payments on bonds if profitability fails to meet specified thresholds"],"ans":"B","expl":"Trái phiếu là hợp đồng giữa tổ chức phát hành và người sở hữu trái phiếu. Quyền của chủ sở hữu trái phiếu\nvà nghĩa vụ của tổ chức phát hành được ghi thành từng khoản trong khế ước. Các khế ước bao gồm các điều khoản\nđược thiết kế để bảo vệ lợi ích của trái chủ. Các điều khoản này được phân loại là:\nCác giao ước khẳng định yêu cầu nhà phát hành thực hiện các hành động cụ thể\nCác giao ước tiêu cực hạn chế hoặc cấm các hành động cụ thể\nCác giao ước tiêu cực bảo vệ người nắm giữ trái phiếu bằng cách hạn chế các hành động của nhà phát hành\nsẽ làm suy giảm khả năng trả lãi và/hoặc trả nợ gốc của nhà phát hành. Ví dụ:\ngiao ước phủ định có thể hạn chế việc phát hành khoản nợ mới cao hơn khoản nợ\nđã tồn đọng. Nếu không, khoản nợ mới sẽ gây bất lợi cho các trái chủ hiện tại\nbằng cách tạo ra yêu cầu cao hơn đối với tài sản của công ty.\n(Lựa chọn A) Bảo vệ cuộc gọi, cấm thu hồi trái phiếu trong một khoảng thời gian sau khi phát hành, không\nđược coi là một giao ước phủ định vì nó không ngăn cản nhà phát hành thực hiện hành động\nlàm suy yếu khả năng trả nợ của họ.\n(Lựa chọn C) Thanh toán lãi trái phiếu là nghĩa vụ pháp lý đối với tổ chức phát hành, do đó, các giao ước phủ định\nsẽ không hạn chế các khoản thanh toán đó. Tuy nhiên, một giao ước phủ định phổ biến là giới hạn\nphân phối cho các cổ đông (ví dụ: cổ tức bằng tiền mặt) nếu khả năng sinh lời không đáp ứng được\nngưỡng cụ thể.\nNhững điều cần nhớ:\nCác giao ước phủ định bảo vệ các trái chủ bằng cách hạn chế các hành động của nhà phát hành sẽ làm suy yếu\nkhả năng trả lãi và trả nợ gốc của nhà phát hành. Một giao ước phủ định phổ biến là\nhạn chế việc phát hành khoản nợ mới cao hơn số nợ đã tồn đọng và tạo ra\nsự bất lợi cho các trái chủ hiện tại.\nMô tả nội dung của khế ước trái phiếu và đối chiếu các giao ước khẳng định và phủ định.\nLOS","qhtml":null},{"n":31,"q":"A benchmark government yield curve is most likely obtained from:","opts":["interpolation.","the par curve.","the spot curve."],"ans":"A","expl":"Đường cong lợi suất hiển thị cấu trúc kỳ hạn của lãi suất bằng cách vẽ đồ thị mối quan hệ giữa\nkỳ hạn và lãi suất trái phiếu. Trái phiếu chính phủ tạo thành cơ sở của hầu hết các đường cong lãi suất, cơ bản nhất\nlà đường cong lãi suất trái phiếu coupon (tức là đường cong lãi suất).\nNhiều chính phủ thường xuyên phát hành trái phiếu với các kỳ hạn chọn lọc như 2, 3, 5, 7, 10 và 30\nnăm và những trái phiếu này tạo thành xương sống của đường cong lãi suất \"chuẩn mực\". Vì các đường cong phiếu giảm giá chính phủ\nđược xây dựng chỉ sử dụng các trái phiếu\nđược phát hành và giao dịch tích cực gần đây nhất làm điểm chuẩn, nên phần còn lại của đường cong được xây dựng bằng phép nội suy (tức là\ngiá trị ước tính) để kết nối các điểm này.\n(Lựa chọn B và C) Đường cong giao ngay được xây dựng từ một loạt các trái phiếu không lãi suất chính phủ\nkhác nhau kỳ hạn. Đường cong mệnh giá được xây dựng từ đường cong giao ngay và biểu thị\nlãi suất phiếu giảm giá cho một kỳ hạn nhất định sao cho trái phiếu sẽ giao dịch ở mức ngang giá khi mỗi khoản thanh toán phiếu lãi\nđược chiết khấu theo lãi suất giao ngay có kỳ hạn thích hợp. Đường cong giao ngay và/hoặc mệnh giá không được\ndùng để xây dựng đường cong lãi suất chuẩn.\nNhững điều cần nhớ:\nĐường cong lãi suất trái phiếu lãi suất chính phủ chỉ được xây dựng bằng cách sử dụng\ntrái phiếu chuẩn được phát hành gần đây nhất và được giao dịch tích cực. Phần còn lại của đường cong được xây dựng bằng cách sử dụng\nnội suy để kết nối các điểm này.\nSo sánh đường cong điểm, đường cong ngang bằng và đường cong thuận.\nLOS","qhtml":null},{"n":32,"q":"An investor is seeking an alternative investment that offers historically low correlation with\nglobal equities, relatively low volatility, and current income. Which of the following most\nappropriately meets these requirements?","opts":["Farmland","Managed futures","Publicly listed real estate investment trust"],"ans":"A","expl":"Đầu tư vào đất nông nghiệp và đất rừng\nĐất nông nghiệp Đất gỗ chung cho cả hai\nThu hoạch\nsố lượng\nNguồn\nGiá hàng hóa Giá gỗ\nGiá đất\nlợi nhuận\nthay đổi\nCó thể là ESG Phòng ngừa lạm phát\nThân thiện với ESG\nThu nhập thường xuyên Tương quan thấp\nDài mới\nThu hoạch với\nĐầu tư\nchu kỳ tăng trưởng truyền thống\nkhông linh hoạt; tại tài sản\nthuộc tính\nThu hoạch\nít nhất hàng năm Có thể phòng ngừa rủi ro với\ntính linh hoạt\nchu kỳ thu hoạch tương lai\nMua trực tiếp,\nnhưng chỉ dành cho các nhà đầu tư lớn nhất\nchỉ dành cho các nhà đầu tư được giao dịch công khai\nĐầu tư\nREITs Tư nhân\nphương tiện\nđầu tư\nquỹ\nESG = Môi trường, xã hội và\nREIT = Ủy thác đầu tư bất động sản\nquản trị\nBa nguồn lợi nhuận đất nông nghiệp là số lượng thu hoạch, giá cả hàng hóa và giá đất\n. Đất nông nghiệp mang lại nguồn thu nhập ổn định khi cây trồng được thu hoạch và\nđược coi là một biện pháp phòng ngừa lạm phát vì nó giúp các nhà đầu tư tiếp cận với giá cả hàng hóa và đất đai\n. So với cổ phiếu toàn cầu, các thuộc tính khiến đất nông nghiệp trở thành một khoản đầu tư mong muốn\nbao gồm mối tương quan thấp , độ biến động hàng năm thấp và tỷ suất lợi nhuận có thể so sánh được.\n(Lựa chọn B) Hợp đồng tương lai được quản lý mang lại lợi ích đa dạng hóa cho một danh mục đầu tư điển hình, nhưng\nlợi nhuận có xu hướng không ổn định.\n(Lựa chọn C) Quỹ tín thác đầu tư bất động sản được niêm yết công khai có mối tương quan cao với toàn cầu\ncổ phiếu và có mức độ biến động cao.\nNhững điều cần nhớ:\nSo với cổ phiếu toàn cầu, các thuộc tính khiến đất nông nghiệp trở thành một khoản đầu tư đáng mơ ước bao gồm\nmối tương quan thấp, biến động hàng năm thấp và tỷ suất lợi nhuận có thể so sánh được. Đất nông nghiệp cũng cung cấp\nmột nguồn thu nhập ổn định khi cây trồng được thu hoạch và được coi là một biện pháp phòng ngừa lạm phát\nvì nó giúp các nhà đầu tư tiếp cận với giá cả hàng hóa và đất đai.\nGiải thích các đặc điểm của đất thô, đất rừng và đất nông nghiệp cũng như các đặc điểm đầu tư của chúng\nLOS","qhtml":null},{"n":33,"q":"If dealers provide liquidity in a market, the market is most likely a(n):","opts":["brokered market.","order-driven market.","quote-driven market."],"ans":"C","expl":"Thị trường định giá là thị trường không cần kê đơn (OTC) trong đó hầu hết các giao dịch diễn ra\ngiữa khách hàng và đại lý. Trong các thị trường định hướng theo báo giá, các đại lý cung cấp tính thanh khoản (tức là\ntạo thị trường) bằng cách sẵn sàng giao dịch ở mức giá niêm yết của họ. Nhà đầu tư chỉ có thể mua hoặc bán\nở mức giá mà đại lý sẵn sàng giao dịch. Hầu như tất cả giao dịch tiền tệ và trái phiếu, cũng như\nnhư hầu hết giao dịch hàng hóa giao ngay, đều diễn ra ở các thị trường định giá (tức là OTC).\n(Lựa chọn A) Thị trường môi giới là những thị trường trong đó các nhà môi giới tìm kiếm các đối tác sẵn sàng thay mặt cho khách hàng\n. Tài sản được giao dịch trong các thị trường được môi giới thường đắt tiền, độc đáo,\nđược giao dịch không thường xuyên và/hoặc khó giữ trong kho (ví dụ: khối lượng hàng tồn kho rất lớn, tác phẩm nghệ thuật\n, bất động sản).\n(Lựa chọn B) Trong thị trường theo thứ tự, lệnh mua và bán được khớp dựa trên mức độ ưu tiên về giá\nvà ưu tiên thời gian. Tất cả các hệ thống giao dịch tự động và gần như tất cả các sàn giao dịch đều sử dụng hệ thống điều khiển theo đơn đặt hàng.\nNhững điều cần nhớ:\nThị trường định giá là thị trường phi tập trung trong đó hầu hết các giao dịch diễn ra giữa\nkhách hàng và đại lý. Trong các thị trường định hướng báo giá, các đại lý cung cấp tính thanh khoản bằng cách sẵn sàng\ngiao dịch ở mức giá niêm yết của họ.\nMô tả cách chứng khoán, hợp đồng và tiền tệ được giao dịch trong các thị trường định giá, định hướng đơn hàng và\nđược môi giới\nLOS","qhtml":null},{"n":34,"q":"An analyst gathers the following information on the constituents of a price-weighted index:\nBeginning Ending Dividends Shares\nStock\nprice (¥) price (¥) per share (¥) outstanding\nA 150 180 0 12,000\nB 250 270 10 10,000\nC 200 180 5 14,000\nBased on this information, the index's price return is closest to:","opts":["5.0%","6.3%","7.5%"],"ans":"A","expl":"Mức sinh lời theo giá của một chỉ số bằng với mức trung bình có trọng số của mức sinh lời của giá\ncủa từng chứng khoán cấu thành trong chỉ mục. Lợi nhuận về giá của mỗi chứng khoán là\nsự thay đổi về giá tính theo phần trăm của giá trị ban đầu; nó không bao gồm cổ tức, tiền lãi và\ncác phân phối khác.\nTrong chỉ số tính trọng số giá , trọng số của mỗi chứng khoán là tỷ lệ giữa giá ban đầu\nvới tổng giá ban đầu của chỉ số. Ví dụ: trong trường hợp này, giá khởi điểm\ncủa Cổ phiếu A là 150 Yên. Tổng giá khởi điểm của cả ba cổ phiếu là ¥600, do đó\ntỷ trọng trong chỉ số của Cổ phiếu A là ¥150 / ¥600, hoặc 25%.\nMức lợi nhuận về giá của chỉ số được tính như sau:\nCần lưu ý rằng vì không có sự chia tách cổ phiếu trong kỳ nên lợi nhuận về giá\ncũng có thể được tính như sau: (630 − 600) / 600 = 5,0%.\n(Lựa chọn B) 6,3% sẽ là lợi nhuận theo giá của chỉ số nếu nó được tính theo trọng số vốn hóa thị trường,\nthay vì tính theo trọng số giá.\n(Lựa chọn C) 7,5% là tổng lợi nhuận của chỉ số, bao gồm thu nhập từ chứng khoán (ví dụ:\ncổ tức, tiền lãi).\nNhững điều cần nhớ:\nMức lợi nhuận về giá của một chứng khoán là sự thay đổi về giá của nó tính theo phần trăm so với giá trị ban đầu của nó.\nMức lợi nhuận về giá của một chỉ số là bình quân gia quyền của lợi nhuận về giá của từng tài sản\ntrong chỉ mục. Cổ tức, tiền lãi và các khoản phân phối khác được loại trừ khỏi giá\nreturn.\nTính toán và giải thích giá trị, lợi nhuận của giá và tổng lợi nhuận của một chỉ số\nLOS","qhtml":null},{"n":35,"q":"Which of the following best describes the relationship of the underlying asset to the pricing of\na derivative? The derivative price:","opts":["represents the value of a replication strategy.","considers an embedded risk premium on the underlying asset.","implies the same expected rate of return as the underlying asset."],"ans":"A","expl":"Khái niệm định giá phái sinh\nNhà giao dịch lợi dụng bất kỳ hành vi định giá sai nào của\nphái sinh\nCác chiến lược không rủi ro được tạo ra từ việc bù đắp\ncác vị trí không có chênh lệch giá\ntrong các công cụ phái sinh và tài sản cơ bản\nCác chiến lược được theo đuổi cho đến khi lợi nhuận không có rủi ro được\nloại bỏ (tức là định giá không có chênh lệch giá)\nCác công cụ phái sinh có thể được tạo tổng hợp từ\ntài sản cơ bản và không có rủi ro\nSao chép các vị thế tương đương phải có cùng mức lợi nhuận dự kiến\nlợi nhuận\nGiá phái sinh phản ánh giá trị của chiến lược sao chép\n\nCác vị thế không rủi ro được tạo từ mua/bán\nTrung tính rủi ro\ncác chiến lược sao chép và phái sinh\nVị thế không rủi ro kiếm được tỷ suất lợi nhuận phi rủi ro;\ndòng tiền được chiết khấu ở mức lãi suất không rủi ro\nĐịnh giá phái sinh dựa trên ba khái niệm chính:\nĐịnh giá không có chênh lệch giá giả định giá thị trường không có cơ hội chênh lệch giá.\nĐịnh giá phái sinh là trung tính rủi ro vì thị trường không có chênh lệch giá đảm bảo các vị thế\nkhông rủi ro và kiếm được lãi suất không rủi ro.\nCác vị trí tương đương có thể được tạo thông qua việc sao chép bằng cách sử dụng kết hợp\ntài sản cơ bản, tài sản không rủi ro và công cụ phái sinh.\nGiá phái sinh phải phản ánh lãi suất phi rủi ro vì các vị thế không rủi ro có thể được tạo bởi\nkết hợp một tài sản cơ bản (ví dụ: trái phiếu mua) với các dẫn xuất liên quan (ví dụ: trái phiếu ngắn\ntương lai). Tương tự, các vị thế phái sinh có thể được sao chép bằng cách kết hợp các vị thế trong\ntài sản cơ bản với tài sản không có rủi ro. Các vị trí được sao chép tương đương về mặt kinh tế\n nên giao dịch ở mức giá tương đương về mặt kinh tế . Do đó, giá của một công cụ phái sinh\nphản ánh giá trị của một chiến lược nhân rộng.\nNếu không giữ được điều kiện tương đương về mặt kinh tế, thì hoạt động chênh lệch giá sẽ xảy ra cho đến khi giá điều chỉnh sao cho\nkhông thể kiếm được lợi nhuận không rủi ro nữa và đạt được mức giá không có chênh lệch giá. Việc định giá\nkhông có chênh lệch giá này khiến nhà đầu tư trung lập với rủi ro, nghĩa là phí bảo hiểm rủi ro mà nhà đầu tư yêu cầu\nđể nắm giữ tài sản cơ bản không ảnh hưởng đến việc định giá phái sinh (Lựa chọn B) .\n(Lựa chọn C) Giá của hợp đồng phái sinh phụ thuộc vào giá của tài sản\ncơ bản và các điều khoản của hợp đồng, chẳng hạn như giá thực hiện và ngày thực hiện. Điều này không\nngụ ý rằng tỷ suất lợi nhuận dự kiến ​​của tài sản cơ bản sẽ giống với tỷ suất lợi nhuận dự kiến\ncủa công cụ phái sinh.\nNhững điều cần nhớ:\nCác công cụ phái sinh được định giá trên cơ sở sao chép không có chênh lệch giá, sao cho các vị trí tương đương về mặt kinh tế\nsẽ giao dịch ở mức giá tương đương về mặt kinh tế. Vì các chiến lược sao chép\nkhông có rủi ro nên các nhà đầu tư được coi là trung tính với rủi ro khi định giá các công cụ phái sinh.\nGiải thích cách sử dụng các khái niệm chênh lệch giá và sao chép trong định giá các công cụ phái sinh\nLOS","qhtml":null},{"n":36,"q":"Which of the following market anomalies is inconsistent with semi-strong form market\nefficiency?","opts":["Initial public offering","Earnings surprise effect","Closed-end fund discount"],"ans":"B","expl":"Lý thuyết về hiệu quả thị trường dạng bán mạnh cho rằng giá thị trường chứa tất cả thông tin có sẵn công khai\n. Một hệ quả của lý thuyết này là các nhà đầu tư không thể đạt được\nlợi nhuận bất thường nếu không sử dụng thông tin quan trọng, không công khai. Sự bất thường của thị trường là\ncác sự kiện thị trường liên tục không nhất quán với hiệu quả ở dạng khá mạnh , tức là\nnhững thay đổi về giá không thể giải thích được bằng thông tin công khai có sẵn hoặc mới được công bố.\nSự bất thường bất ngờ về thu nhập là do thiếu sự điều chỉnh giá đầy đủ và ngay lập tức\nđối với những tin tức bất ngờ từ báo cáo thu nhập. Vì có độ trễ giữa việc\ncông bố báo cáo thu nhập (sẽ trở thành thông tin công khai) và việc điều chỉnh giá\nsau đó, nên có thể tạo ra lợi nhuận bất thường trong một thời gian ngắn. Điều này không nhất quán\nvới hiệu quả thị trường ở dạng khá mạnh.\n(Lựa chọn A) Sự bất thường trong đợt chào bán lần đầu ra công chúng (IPO) cho thấy rằng, trung bình, các nhà đầu tư\nmua cổ phiếu thông qua IPO có thể kiếm được lợi nhuận bất thường trong ngắn hạn. IPO\nthường được định giá thấp, cho phép các nhà đầu tư kiếm được lợi nhuận bất thường; tuy nhiên, giá thị trường\nđiều chỉnh nhanh chóng, hỗ trợ hiệu quả thị trường khá mạnh.\n(Lựa chọn C) Chiết khấu quỹ đóng là mức chiết khấu liên tục 4–10% đối với giá trị tài sản ròng\n (NAV) được quan sát thấy trong giá của các quỹ này. Việc giảm giá không dẫn đến lợi nhuận bất thường\ndo chi phí giao dịch, tính thanh khoản và khả năng tính toán sai NAV.\nNhững điều cần nhớ:\nSự bất thường của thị trường là một sự kiện thị trường không phù hợp với lý thuyết thị trường hiệu quả.\nsự bất thường về thu nhập không phù hợp với lý thuyết hiệu quả thị trường ở dạng bán mạnh do\ncó độ trễ ngắn giữa việc công bố thông tin đại chúng và lần điều chỉnh giá\nsau đó.\nMô tả những điểm bất thường của thị trường\nLOS","qhtml":null},{"n":37,"q":"An industry has high barriers to exit. According to Porter's \"five forces\" framework, which of\nthe following is most likely to be present in this industry?","opts":["Threat of substitutes is high","Threat of new entrants is high","Bargaining power of buyers is low"],"ans":"A","expl":"Phân tích “năm lực lượng” của Porter là một khuôn khổ chiến lược quan trọng để đánh giá khả năng của một ngành\nmôi trường cạnh tranh. Các thuộc tính cơ cấu có thể khác nhau đáng kể giữa các ngành,\ntạo ra các hồ sơ lợi nhuận kinh tế rất khác nhau. Một số ngành tạo ra sự nhất quán\nlợi nhuận trong suốt chu kỳ kinh tế, trong khi các ngành khác gặp khó khăn ngay cả trong\nduy trì sự mở rộng kinh tế.\nSức mạnh định giá thường là một khía cạnh quan trọng của việc tạo ra lợi nhuận kinh tế. Quyền định giá thường là\nvững mạnh trong một ngành có rào cản gia nhập cao do mối đe dọa từ những người mới gia nhập là thấp , nhưng\ncó những trường hợp ngoại lệ, chẳng hạn như nhà sản xuất ô tô, nhà máy lọc dầu và bộ nhớ bán dẫn\ncác nhà sản xuất (ví dụ: DRAM, flash), cũng có rào cản rút lui cao (Lựa chọn B) .\nSức mạnh định giá sẽ yếu nếu khả năng thương lượng của người mua cao. Khi các ngành công nghiệp\nsản xuất các sản phẩm là hàng hóa (ví dụ: DRAM, xăng) hoặc có giá cao và dễ dàng\ncó thể thay thế được (ví dụ: ô tô), tồn tại nguy cơ cao về các sản phẩm thay thế, góp phần làm suy yếu\nquyền định giá (Lựa chọn C).\nNhững ngành có những đặc điểm này được cho là có rào cản rút lui cao. Họ là\ncũng được đặc trưng bởi sự đầu tư lớn vào tài sản cố định không thể dễ dàng chuyển đổi thành\nmục đích khác, khiến họ dễ bị dư thừa năng lực.\nNhững điều cần nhớ:\nNhững ngành có rào cản gia nhập cao và khả năng định giá yếu cũng thường có rào cản gia nhập cao.\nthoát ra. Trong khuôn khổ “năm lực lượng” của Porter, những ngành có rào cản gia nhập và rút lui cao\nđược đặc trưng bởi mối đe dọa từ những người mới tham gia thấp, khả năng thương lượng cao của người mua và cao\nmối đe dọa của sản phẩm thay thế.\nPhân tích cấu trúc của một ngành và những ảnh hưởng bên ngoài bằng cách sử dụng Năm lực lượng và PESTLE của Porter\nkhuôn khổ\nLOS","qhtml":null},{"n":38,"q":"An analyst observes that a commodity's forward curve is in backwardation. This\nsituation most likely implies:","opts":["negative roll yield.","negative collateral yield.","convenience yield exceeds storage costs."],"ans":"C","expl":"Nhà đầu tư sở hữu hàng hóa vật chất (ví dụ: đồng) phải chịu chi phí lưu trữ cho đến khi hàng hóa\nđược sử dụng hoặc bán. Tuy nhiên, nhà đầu tư đó cũng tích lũy lợi ích (ví dụ: khả năng sẵn sàng\nngay lập tức) từ việc sở hữu trực tiếp hàng hóa; lợi ích bù đắp chi phí lưu trữ là\nsự tiện lợi. Ngược lại, nhà đầu tư sở hữu hợp đồng tương lai trên cùng một loại hàng hóa\nkhông phải chịu chi phí lưu kho cho đến khi hợp đồng đáo hạn và việc giao hàng được chấp nhận, nhưng không tích lũy\nlợi suất tiện lợi.\nTất cả các yếu tố khác không đổi, giá tương lai của hàng hóa cao hơn giá giao ngay bằng chi phí\ngiữ hàng hóa, điều này ngăn chặn hoạt động kinh doanh chênh lệch giá. Do đó, cấu trúc định giá kỳ hạn điển hình\nđối với hàng hóa vật chất là một đường cong kỳ hạn dốc lên (tức là giá tương lai >\ngiá giao ngay); trong trường hợp đó, thị trường được cho là ở trạng thái bù hoãn mua.\nĐường cong kỳ hạn dốc xuống (tức là giá tương lai < giá giao ngay), được gọi là\nlà lạc hậu , xuất phát từ lợi suất tiện lợi vượt quá chi phí lưu trữ .\nSự lùi lại thường cho thấy sự tắc nghẽn trong nguồn cung hoặc giao hàng trên thị trường giao ngay.\n(Lựa chọn A) Lợi suất cuộn là lợi nhuận (dương hoặc âm) mà xảy ra khi một hợp đồng gần hết hạn\nvà giá tương lai hội tụ với giá giao ngay. Ngược lại dẫn đến\nlợi suất cuộn dương.\n(Lựa chọn B) Lợi suất tài sản thế chấp là một thành phần của lợi tức giá của hợp đồng tương lai và phải\nluôn luôn dương.\nNhững điều cần nhớ:\nContango và bù trừ là các thuật ngữ mô tả giá của hợp đồng tương lai so với\ngiá giao ngay của hàng hóa cơ bản. Hợp đồng ở trạng thái bù hoãn bán nếu giá tương lai\nthấp hơn giá giao ngay. Khi điều này xảy ra, lợi nhuận thuận tiện sẽ lớn hơn chi phí lưu trữ\n.\nGiải thích các đặc điểm của đất thô, đất rừng và đất nông nghiệp cũng như đặc điểm đầu tư của chúng\nLOS","qhtml":null},{"n":39,"q":"A 20-year government bond is currently trading at 100% of par, and a 1-year forward contract\non the bond is initiated with a value of zero at a price of 102. There are no other costs or\nbenefits to holding the bond. At the forward contract's initiation, it is most likely that the:","opts":["risk-free rate is equal to 2%.","coupon rate is greater than the risk-free rate.","risk-free rate is greater than the coupon rate."],"ans":"C","expl":"Lãi suất phi rủi ro – Lãi suất coupon = Giá kỳ hạn – Giá giao ngay\nLãi suất phi rủi ro > Lãi suất trái phiếu Giá kỳ hạn > Giá giao ngay\nLãi suất phi rủi ro < Lãi suất coupon Giá kỳ hạn < Giá giao ngay\nLãi suất phi rủi ro = Lãi suất coupon Giá kỳ hạn = Giá giao ngay\nĐịnh giá phái sinh dựa trên việc định giá không có chênh lệch giá, đòi hỏi phải có tính kinh tế\nvị trí tương đương kiếm được lợi nhuận như nhau. Để một hợp đồng kỳ hạn trái phiếu có giá trị ban đầu là\nbằng 0, chênh lệch giữa giá kỳ hạn và giá giao ngay phải bằng chi phí ròng hoặc\ních của việc nắm giữ trái phiếu cơ sở cho đến khi hợp đồng kỳ hạn hết hạn.\nVì không có chi phí nắm giữ hoặc lợi ích nào khác trong kịch bản này nên các yếu tố ảnh hưởng đến\nchênh lệch giá giao ngay/giá kỳ hạn là:\nnắm giữ trái phiếu\ntạo ra thu nhập từ phiếu giảm giá, kiếm được theo lãi suất phiếu giảm giá và\ntạo ra chi phí cơ hội bằng lãi suất có thể kiếm được tại thời điểm\nlãi suất phi rủi ro, và đó\nnắm giữ hợp đồng kỳ hạn trái phiếu không tạo ra thu nhập nhưng không tạo ra chi phí cơ hội.\nNếu lãi suất trái phiếu nhỏ hơn (lớn hơn) lãi suất phi rủi ro thì sẽ có chi phí ròng\n(lợi ích) khi nắm giữ trái phiếu thay vì nắm giữ hợp đồng kỳ hạn. Trong trường hợp đó thì tốt hơn\nnắm giữ hợp đồng kỳ hạn, hợp đồng này sẽ có giá cao hơn trái phiếu.\nTrong kịch bản này, giá kỳ hạn lớn hơn giá giao ngay của trái phiếu, do đó kỳ hạn 1 năm\nlãi suất phi rủi ro phải lớn hơn lãi suất coupon của trái phiếu. Kể từ khi chính phủ 20 năm\ntrái phiếu đang được giao dịch ở mức ngang giá, lãi suất một năm lớn hơn lãi suất coupon của trái phiếu hàm ý rằng\nđường cong lợi suất bị đảo ngược.\n(Lựa chọn A) Giá kỳ hạn 1 năm khác với giá giao ngay một điểm bằng lãi suất phi rủi ro trừ đi\nlãi suất coupon, không phải bằng lãi suất phi rủi ro.\n(Lựa chọn B) Lãi suất trái phiếu lớn hơn lãi suất phi rủi ro dẫn đến lãi suất kỳ hạn\ngiá thấp hơn giá giao ngay của trái phiếu.\nNhững điều cần nhớ:\nGiá kỳ hạn và giá giao ngay khác nhau bởi chi phí ròng hoặc lợi ích của việc nắm giữ trái phiếu cơ bản. Nếu một\ngiá kỳ hạn của trái phiếu lớn hơn giá giao ngay thì chi phí cơ hội của việc nắm giữ trái phiếu là\nlớn hơn thu nhập của nó và lãi suất phi rủi ro lớn hơn lãi suất trái phiếu.\nGiải thích sự khác biệt giữa giá giao ngay và giá kỳ vọng trong tương lai của một tài sản cơ sở và chi phí của\nmang theo liên quan đến việc nắm giữ tài sản cơ bản\nLOS","qhtml":null},{"n":40,"q":"A manager is concerned with identifying a noncallable coupon bond that minimizes the risk of\nfunding a future liability. Which type of duration is most appropriate for this manager to use?","opts":["Key rate duration","Modified duration","Macaulay duration"],"ans":"C","expl":"Trái phiếu trả lãi không thể thu hồi có hai loại rủi ro lãi suất: rủi ro về giá và rủi ro tái đầu tư\nrủi ro. Thay đổi lãi suất có tác động trái ngược nhau đối với hai rủi ro này và đối với các thành phần của lợi nhuận trái phiếu\n. Những thay đổi về lãi suất là:\ncó liên quan nghịch với giá vì lãi suất cao hơn (thấp hơn) khiến giá trái phiếu giảm\n(tăng) và\nliên quan trực tiếp đến thu nhập tái đầu tư vì lãi suất cao hơn (thấp hơn) khiến\nthu nhập tái đầu tư tăng (giảm).\nThời hạn Macaulay là khoảng thời gian nắm giữ (tức là thời hạn đầu tư) trong đó một thay đổi giá trái phiếu\nbằng với thay đổi trong thu nhập tái đầu tư, cho phép những thay đổi đó bù đắp cho từng\nkhác. Việc nắm giữ trái phiếu trong khoảng thời gian đó sẽ cân bằng rủi ro tái đầu tư và rủi ro về giá\nvà giảm thiểu tổng rủi ro . Do đó, lợi tức của trái phiếu nắm giữ trong thời hạn Macaulay\nbằng với lãi suất chiết khấu thị trường của trái phiếu (tức là YTM) khi nó được mua. Mua một trái phiếu\nvới thời hạn Macaulay bằng với thời gian cho đến khi một khoản nợ đến hạn sẽ giảm thiểu rủi ro rằng\nngười phát hành trái phiếu sẽ không thể tài trợ cho khoản nợ đó.\n(Lựa chọn A) Thời hạn lãi suất chính đo lường tác động lên giá trái phiếu khi có sự thay đổi trong một (hoặc\nthêm) lãi suất có kỳ hạn cụ thể.\n(Lựa chọn B) Thời hạn được sửa đổi đo lường phần trăm thay đổi giá gần đúng của trái phiếu do\nsự thay đổi 100 điểm cơ bản trong YTM của nó, bỏ qua tác động của độ lồi.\nNhững điều cần nhớ:\nThời hạn Macaulay là khoảng thời gian nắm giữ (tức là thời hạn đầu tư) trong đó sự thay đổi giá của trái phiếu\nbằng với sự thay đổi trong thu nhập tái đầu tư. Một trái phiếu được nắm giữ trong thời hạn Macaulay\nkiếm được lợi nhuận bằng YTM khi trái phiếu được mua. Mua một trái phiếu có thời hạn\nMacaulay bằng thời gian cho đến khi một khoản nợ đến hạn sẽ giảm thiểu rủi ro rằng\nnhà phát hành trái phiếu sẽ không thể tài trợ cho khoản nợ đó.\nXác định, tính toán và diễn giải thời hạn Macaulay.\nLOS","qhtml":null},{"n":41,"q":"In a developed country's sovereign bond market, which of the following best describes a\nresponsibility of primary dealers?","opts":["Syndicate new issuance of government bonds to indirect bidders.","Facilitate foreign central bank participation in government debt auctions.","Participate as noncompetitive bidders in multiple-price auctions of government bonds."],"ans":"B","expl":"Các đại lý sơ cấp về nợ có chủ quyền\nCác tổ chức tài chính được chính phủ có chủ quyền chỉ định là đại lý chính\nBắt buộc phải tham gia đấu giá chứng khoán chính phủ\nTạo điều kiện cho các ngân hàng trung ương nước ngoài tham gia đấu giá\nThường xuyên đóng vai trò là đối tác của ngân hàng trung ương trong hoạt động thị trường mở\nCác đại lý sơ cấp là các trung gian tài chính được chính phủ chỉ định thực hiện\nđóng góp quan trọng vào hoạt động của thị trường nợ có chủ quyền. Chính\ncác đại lý tham gia vào cả việc phát hành nợ mới và giao dịch thứ cấp, cải thiện\nhiệu quả của thị trường nợ chính phủ và hỗ trợ thực hiện cơ chế thị trường mở\nhoạt động.\nTrong khi các nhà buôn sơ cấp tham gia vào tất cả các cuộc đấu giá nợ chính phủ và đóng vai trò là thị trường mở\nđối tác hoạt động của ngân hàng trung ương, họ cũng giao dịch với các ngân hàng trung ương nước ngoài và\nngười đấu giá. Một số giao dịch của các đại lý sơ cấp tạo điều kiện cho ngân hàng trung ương nước ngoài gián tiếp\ntham gia đấu giá nợ chính phủ.\n(Lựa chọn A) Không giống như trái phiếu doanh nghiệp phát hành mới, thường được bán thông qua bảo lãnh phát hành\ntập đoàn, trái phiếu chính phủ mới phát hành thường được bán trong một cuộc đấu giá cạnh tranh. Công ty\nViệc phát hành chứng khoán thường được thực hiện thông qua cam kết bảo lãnh phát hành chắc chắn (đúng hơn là\nhơn là đấu giá), trong đó tập đoàn hỗ trợ việc mua tất cả trái phiếu.\n(Lựa chọn C) Trách nhiệm của các đại lý chính là tham gia vào tất cả các khoản nợ một giá\nđấu giá với tư cách là người trả giá cạnh tranh. Các đại lý sơ cấp chấp nhận giá trúng thầu là như nhau\ngiá được trả bởi tất cả các nhà thầu khác.\nNhững điều cần nhớ:\nViệc phát hành nợ chính phủ thường diễn ra thông qua đấu giá công khai sử dụng các\ncác thủ tục được tạo điều kiện bởi các ngân hàng trung ương thay mặt cho kho bạc quốc gia hoặc bộ tài chính.\nChính phủ có chủ quyền chỉ định các tổ chức tài chính là đại lý chính và yêu cầu họ phải\ntham gia tất cả các cuộc đấu giá có đấu thầu cạnh tranh.\nSo sánh việc phát hành và giao dịch các công cụ thu nhập cố định của chính phủ và doanh nghiệp.\nLOS","qhtml":null},{"n":42,"q":"An analyst gathers the following information related to a company's stock:\nCurrent annual dividend per share €1.00\nAnnual dividend growth rate for Years 1–3 6%\nAnnual dividend growth rate for Years 4+ 2%\nRequired rate of return 10%\nIf the stock is fairly valued, then the terminal value at the end of Year 3 using the two-stage\ndividend discount model is closest to:","opts":["€14.20","€14.89","€15.19"],"ans":"C","expl":"Mô hình tăng trưởng cổ tức hai giai đoạn được sử dụng để xác định giá trị nội tại của cổ phiếu của một\ncông ty dự kiến sẽ trải qua giai đoạn tăng trưởng cổ tức cao, ngắn hạn sau đó\ndo tốc độ tăng trưởng dài hạn thấp hơn. Giá trị nội tại của cổ phiếu là tổng giá trị hiện tại của\ncổ tức từ cả hai giai đoạn.\nGiá trị cuối cùng thể hiện giá trị nội tại của cổ phiếu ở cuối giai đoạn tăng trưởng cao\nngắn hạn. Tại thời điểm đó, cổ tức dự kiến ​​sẽ tăng với tốc độ thấp hơn trong khoảng thời gian\ndự kiến ​​sẽ tiếp tục vô thời hạn. Giá trị cuối cùng có thể được tính bằng cách sử dụng\nmô hình tăng trưởng Gordon vì mô hình đó phù hợp với một cổ phiếu có mức tăng trưởng cổ tức\ndự kiến ​​không đổi.\nTrong trường hợp này, giá trị cuối cùng là giá trị vào cuối Năm thứ 3, khi giai đoạn tăng trưởng dài hạn\nbắt đầu. Trước tiên, hãy tính cổ tức vào cuối Năm 3 bằng cách sử dụng tốc độ tăng trưởng\nngắn hạn là 6% vì cổ tức tăng trưởng với tốc độ cao hơn cho đến thời điểm đó. Sau đó,\ngiá trị cuối cùng được tính bằng cách sử dụng tốc độ tăng trưởng dài hạn, thấp hơn là 2%:\n(Lựa chọn A) €14,20 là giá trị nội tại của cổ phiếu tại Năm 0.\n(Lựa chọn B) €14,89 là kết quả của việc sử dụng cổ tức Năm 3 để tính giá trị cuối cùng, thay vì\nso với cổ tức Năm 4.\nNhững điều cần nhớ:\nTrong mô hình tăng trưởng cổ tức hai giai đoạn, giá trị nội tại của cổ phiếu là tổng của\ngiá trị hiện tại của cổ tức từ cả giai đoạn tăng trưởng ngắn hạn, tăng trưởng cao và giai đoạn tăng trưởng thấp hơn, dài hạn tiếp theo\n. Giá trị cuối đại diện cho giá trị nội tại ở đầu\ngiai đoạn thứ hai, dự kiến ​​sẽ tiếp tục vô thời hạn. Mô hình tăng trưởng Gordon\nphù hợp với một cổ phiếu có tốc độ tăng trưởng không đổi dự kiến, có thể được sử dụng để xác định\ngiá trị cuối cùng.\nTính toán và giải thích giá trị nội tại của chứng khoán vốn dựa trên mô hình chiết khấu cổ tức tăng trưởng Gordon (không đổi)\n hoặc mô hình chiết khấu cổ tức hai giai đoạn, nếu phù hợp\nLOS","qhtml":null},{"n":43,"q":"The costs of holding an asset exceed the benefits. At inception, the price of a forward contract\non the asset is most likely :","opts":["less than its spot price.","equal to its spot price.","greater than its spot price."],"ans":"C","expl":"Giá kỳ hạn so với giá giao ngay\nKỳ hạn < Chi phí giao ngay < Lợi ích\nKỳ hạn = Chi phí giao ngay = Lợi ích\nKỳ hạn > Chi phí giao ngay > Lợi ích\nBằng cách mua hợp đồng kỳ hạn thay vì tài sản cơ bản, nhà đầu tư tránh được chi phí\nnhưng cũng bỏ qua mọi lợi ích của việc nắm giữ tài sản. Hợp đồng kỳ hạn thường được bắt đầu ở giá trị\nbằng 0; do đó, giá kỳ hạn khác với giá giao ngay ở chi phí ròng để nắm giữ\ntài sản cơ bản cho đến khi hợp đồng kỳ hạn hết hạn.\nChi phí nắm giữ ròng được gọi là chi phí nắm giữ hoặc chỉ mang theo.\nChi phí nắm giữ tài sản cơ sở:\nluôn bao gồm chi phí cơ hội của số tiền dùng để mua tài sản và\ncó thể bao gồm các chi phí bổ sung chẳng hạn như lưu trữ hoặc bảo hiểm.\nLợi ích của việc nắm giữ tài sản cơ sở có thể bao gồm:\nlợi ích tiền tệ như cổ tức hoặc lãi suất và/hoặc\nlợi ích phi tiền tệ được gọi là lợi tức tiện lợi.\nKhi chi phí nắm giữ tài sản lớn hơn lợi ích, giá kỳ hạn\nlớn hơn giá giao ngay bằng số tiền ròng tiết kiệm được khi nắm giữ tài sản đó chuyển tiếp\nvà không phát sinh chi phí ròng khi nắm giữ tài sản cơ sở (Lựa chọn A và B) .\nNhững điều cần nhớ:\nMua hợp đồng kỳ hạn giúp tránh được chi phí nhưng bỏ qua mọi lợi ích của việc nắm giữ tài sản\ncơ bản. Khi chi phí nắm giữ tài sản cơ sở vượt quá lợi ích, giá kỳ hạn\nsẽ lớn hơn giá giao ngay.\nGiải thích sự khác biệt giữa giá giao ngay và giá dự kiến trong tương lai của một tài sản cơ sở và chi phí\nvận chuyển liên quan đến việc nắm giữ tài sản cơ sở\nLOS","qhtml":null},{"n":44,"q":"For otherwise identical fixed-coupon bonds, the greatest difference between the effective\nconvexity of a callable bond and approximate convexity of a noncallable bond most\nlikely occurs when the benchmarks bond's yield is:","opts":["significantly lower than the bonds' coupon rates.","approximately equal to the bonds' coupon rates.","significantly higher than the bonds' coupon rates."],"ans":"A","expl":"Độ lồi đo lường mức độ nhạy cảm của giá trái phiếu (tức là thời hạn) thay đổi khi lãi suất thay đổi.\nKhi lãi suất thị trường tăng (và tiếp tục tăng) trên lãi suất phiếu giảm giá, giá có thể gọi được\nvà trái phiếu không thể gọi được có xu hướng phản ứng theo cùng một cách. Cả độ lồi gần đúng và độ lồi hiệu quả\n đều dương và giá trị của chúng đang hội tụ. Tuy nhiên, khi lợi suất thị trường\ngiảm hơn nữa dưới lãi suất phiếu giảm giá, hành vi giá của trái phiếu có thể mua lại và không thể mua lại\nsẽ khác nhau do độ lồi ngày càng khác nhau của chúng (Lựa chọn B và C) .\nTrái phiếu có thể mua lại và không thể mua lại có cùng dòng tiền theo lịch trình cho đến khi đáo hạn. Tuy nhiên, dòng tiền của trái phiếu có thể mua lại\nkhông chắc chắn do cuộc gọi được nhúng. Bất kỳ sự khác biệt nào về hiệu suất giá\nđều do tùy chọn nhúng và khả năng trái phiếu được gọi.\nVới lợi suất thấp hơn lãi suất coupon của trái phiếu có thể thu hồi, trái phiếu có thể sẽ được gọi ở cơ hội\nsớm nhất. Điều đó hạn chế khả năng tăng giá, do đó giá trái phiếu có thể mua lại trở nên ít nhạy cảm hơn\nvới sự sụt giảm thêm của lợi suất thị trường (tức là độ lồi âm). Mặt khác,\ngiá trái phiếu không thể mua lại trở nên nhạy cảm hơn khi lợi suất chuẩn tiếp tục giảm (tức là\nđộ lồi dương). Sự khác biệt về độ lồi dẫn đến hiệu suất giá rất khác nhau\nkhi lợi suất giảm.\nNhững điều cần nhớ:\nCác trái phiếu có thể mua lại và không thể mua lại giống hệt nhau biểu hiện hành vi giá tương tự nhau và có\nđộ lồi tương tự, ở mức lãi suất chuẩn cao hơn đáng kể so với lãi suất phiếu giảm giá của trái phiếu. Với lợi suất\nthấp hơn nhiều so với lãi suất coupon, trái phiếu có thể mua lại có khả năng bị hủy bỏ sớm, điều này hạn chế khả năng tăng giá\ncủa nó. Điều này dẫn đến sự khác biệt lớn về hiệu suất giá của trái phiếu có thể mua lại và\nkhông thể mua lại với lãi suất thấp hơn lãi suất phiếu giảm giá, điều này phản ánh độ lồi khác nhau.\nTính toán và giải thích độ lồi và mô tả điều chỉnh độ lồi.\nLOS","qhtml":null},{"n":45,"q":"A hedge fund has the following fee structure, charged on year-end assets under management\n(AUM):\nAnnual management fee 1.5%\nIncentive fee 12%\nSoft hurdle rate 5%\nHigh-water mark $380 million\nThe fund value is $372 million at the beginning of the year and $412 million, before fees, at\nthe end of the year. For this year, if fees are calculated independently, the net return to the\ninvestor is closest to:","opts":["7.80%","8.06%","8.67%"],"ans":"B","expl":"Lợi nhuận của nhà đầu tư được tính sau khi trừ phí và là phần trăm của giá trị ban đầu\ncủa quỹ. Các quỹ phòng hộ thường thu cả phí quản lý và phí khuyến khích.\nPhí quản lý được tính bằng phần trăm của tổng tài sản cuối cùng của quỹ\nđược quản lý (AUM) và được đánh giá bất kể lợi nhuận .\nPhí khuyến khích được tính bằng phần trăm lợi nhuận ròng (tức là sau\nkhấu trừ) hoặc tổng (tức là trước khi khấu trừ) phí quản lý.\nNếu phí được tính độc lập , việc xác định tỷ lệ vượt rào và tính phí\ndựa trên cơ sở tổng .\nPhí khuyến khích thường phụ thuộc vào lợi nhuận lớn hơn tỷ lệ vượt ngưỡng và/hoặc AUM\ncao hơn mốc nước cao. Trong kịch bản này, ngưỡng để quỹ kiếm được\nphí khuyến khích phụ thuộc vào việc vượt quá tỷ lệ rào cản mềm 5% và ngưỡng cao nhất\n$380 triệu. Do tỷ lệ rào cản mềm, phí khuyến khích sẽ được áp dụng cho toàn bộ lợi nhuận\ntrên mốc nước cao.\nLợi nhuận của nhà đầu tư trong năm được tính (bằng triệu đô la) như sau:\n(Lựa chọn A) Lợi nhuận 7,80% tính toán lợi nhuận một cách không chính xác bằng cách sử dụng AUM bắt đầu, thay vì\ncủa mốc nước cao, làm phí khuyến khích base.\n(Lựa chọn C) Lợi nhuận 8,67% được tính toán lợi nhuận một cách không chính xác bằng cách sử dụng tỷ lệ vượt rào cản cứng.\nNhững điều cần nhớ:\nLợi tức của nhà đầu tư đối với quỹ phòng hộ được tính toán sau khi trừ phí và là tỷ lệ phần trăm của\ngiá trị ban đầu của quỹ. Các quỹ phòng hộ thu cả phí quản lý và phí khuyến khích.\nPhí quản lý được tính bằng phần trăm của tổng giá trị cuối kỳ, tổng phí,\nvà được đánh giá bất kể lợi nhuận. Phí khuyến khích được tính theo tỷ lệ phần trăm của\nlợi nhuận, tùy thuộc vào tỷ lệ vượt rào và mức nước cao.\nTính toán và diễn giải lợi nhuận đầu tư thay thế cả trước và sau phí\nLOS","qhtml":null},{"n":46,"q":"An analyst estimates a firm's enterprise value (EV) using an EV/EBITDA multiple and then\ncorrectly calculates the firm's implied equity value from its EV. If the equity value is higher\nthan the EV, the most likely reason is that:","opts":["the EV/EBITDA multiple is low.","the firm's stock is greatly undervalued.","the firm has more cash than debt and preferred stock."],"ans":"C","expl":"Để ước tính giá trị doanh nghiệp (EV), các nhà phân tích thường nhân EBITDA của công ty đó với\ntỷ lệ EV/EBITDA. Giá trị doanh nghiệp đo lường giá trị hoạt động của một công ty, được\nhỗ trợ bởi vốn chủ sở hữu và các nguồn vốn không vốn chủ sở hữu.\nGiá trị vốn chủ sở hữu đo lường giá trị đối với các cổ đông phổ thông.\nKhiếu nại không sở hữu cổ phần hoặc nợ ròng, đo lường giá trị đối với các nhà cung cấp vốn khác, chẳng hạn như\ncổ đông ưu đãi và chủ nợ.\nLưu ý: Nợ ròng là ròng tiền mặt vì tiền mặt có thể được sử dụng để trả nợ.\nVề mặt lý thuyết, giá trị vốn chủ sở hữu là những gì chủ sở hữu sẽ nhận được từ việc bán doanh nghiệp sau khi thanh toán\nnợ ròng. Trong một số trường hợp (chẳng hạn như kịch bản này), giá trị vốn chủ sở hữu có thể vượt quá giá trị doanh nghiệp\ndo nợ ròng âm : Công ty có nhiều tiền mặt và các khoản đầu tư có thể bán được hơn\ntổng các yêu cầu bồi thường không sở hữu vốn (ví dụ: nợ, cổ phiếu ưu đãi, lãi không kiểm soát).\n(Lựa chọn A) Hệ số EV/EBITDA thấp không ảnh hưởng đến nợ ròng. Do đó, bội số\nEV/EBITDA thấp không góp phần vào sự khác biệt giữa EV và giá trị vốn chủ sở hữu.\n(Lựa chọn B) Phán quyết về định giá cổ phiếu của công ty so sánh giá trị vốn chủ sở hữu nội tại ước tính\nvới giá trị vốn cổ phần thị trường của nó, chứ không phải với EV ước tính.\nNhững điều cần nhớ:\nTỷ lệ EV/EBITDA có thể được sử dụng để ước tính giá trị doanh nghiệp của công ty (EV). EV đo lường\ngiá trị của các hoạt động cốt lõi của một công ty, được hỗ trợ bởi các nguồn vốn sở hữu và không vốn chủ sở hữu của\nvốn. Giá trị vốn chủ sở hữu đo lường giá trị đối với các chủ doanh nghiệp (tức là các cổ đông phổ thông)\ntrong khi các yêu cầu không có vốn chủ sở hữu hoặc nợ ròng đo lường giá trị đối với các nhà cung cấp vốn khác. Giá trị vốn chủ sở hữu\ncó thể vượt quá EV khi nợ ròng âm.\nMô tả bội số giá trị doanh nghiệp và cách sử dụng chúng trong việc ước tính giá trị vốn chủ sở hữu\nLOS","qhtml":null},{"n":47,"q":"Three equity indexes hold the same 30 securities, but they are weighted differently in each\nindex. Over the past year, the total returns of the indexes were:\nIndex Weighting Return %\nFundamental 6\nEqual 10\nMarket capitalization 2\nThe best explanation for this performance difference is:","opts":["large-cap and value outperformance.","small-cap and value outperformance.","large-cap and momentum outperformance."],"ans":"B","expl":"Các kiểu tính trọng số chỉ số vốn chủ sở hữu\nLoại chỉ mục Trình điều khiển hiệu suất chính\nVốn hóa thị trường Vốn hóa lớn, động lượng\nBằng nhau Vốn hóa nhỏ, giá trị\nGiá trị cơ bản\nGiá Cổ phiếu giá cao\nPhương pháp tính trọng số chỉ số có thể có tác động đáng kể đến hiệu suất cơ bản của\nmột chỉ mục. Hiểu được những thành kiến ​​cơ bản hiện diện trong mỗi phương pháp giúp phân tích hiệu suất của chỉ mục\nhiệu quả hơn. Ba phương pháp tính trọng số chỉ số chính là:\nBằng nhau: Trọng số bằng nhau được gán cho từng tài sản.\nVốn hóa thị trường: Trọng số dựa trên giá trị thị trường của tài sản dưới dạng phần trăm\ntrong tổng giá trị thị trường của tài sản trong chỉ mục.\nCơ bản: Trọng số dựa trên số liệu công ty (ví dụ: doanh thu, giá trị sổ sách, số lượng\nnhân viên so với tổng của tất cả các thành phần, lợi nhuận thu nhập ) để\nxác định tỷ trọng trong chỉ số.\nSo với cách tiếp cận vốn hóa thị trường, các chỉ số\ncó trọng số ngang bằng về cơ bản nhấn mạnh các tài sản thường gắn liền với độ nghiêng giá trị. Trong các chỉ số\ncó trọng số ngang nhau, các cổ phiếu có vốn hóa nhỏ có tác động rất lớn đến hiệu suất. Trong kịch bản\nnày, chỉ số có trọng số bằng nhau rõ ràng là có hiệu suất cao hơn, cho thấy hiệu suất vượt trội về giá trị và vốn hóa nhỏ.\n(Lựa chọn A và C) Hiệu suất của chỉ số tính theo trọng số vốn hóa thị trường bị ảnh hưởng nặng nề\nbởi các cổ phiếu có vốn hóa lớn và hiệu ứng động lượng. Các chỉ số có trọng số vốn hóa\ndựa trên giá trị thị trường, do đó, các cổ phiếu có động lượng cao có tỷ trọng và hiệu suất tăng dần\ntác động.\nNhững điều cần nhớ:\nSo với phương pháp tiếp cận vốn hóa thị trường, các chỉ số có trọng số bằng nhau nhấn mạnh vào\ncác cổ phiếu và tài sản có vốn hóa nhỏ thường gắn liền với độ nghiêng giá trị.\nTính toán và phân tích giá trị cũng như lợi nhuận của một chỉ mục dựa trên phương pháp tính trọng số của nó\nLOS","qhtml":null},{"n":48,"q":"Which of the following least likely requires a future long-term growth rate for valuation\npurposes?","opts":["Justified P/E","Dividend discount model","Asset-based valuation model"],"ans":"C","expl":"Các nhà phân tích sử dụng mô hình định giá để ước tính giá trị nội tại của một cổ phiếu nhằm xác định xem\nnó có được định giá công bằng hay không. Các dạng mô hình định giá phổ biến bao gồm hệ số nhân, giá trị hiện tại và\ndựa trên tài sản.\nVới mô hình định giá dựa trên tài sản, giá trị vốn chủ sở hữu ước tính của một công ty (tức là giá trị đối với\ncổ đông) được giả định bằng giá trị hợp lý hiện tại của tài sản trừ đi\ngiá trị hợp lý của nợ phải trả . Các nhà phân tích thường bắt đầu với giá trị sổ sách của các chi tiết đơn hàng trên bảng cân đối kế toán\nvà thực hiện các điều chỉnh giá trị hợp lý để tính ra giá trị thị trường của chúng. Vì tất cả đầu vào đều\ndựa trên dữ liệu hiện tại nên không cần tốc độ tăng trưởng dài hạn ( g ); g được sử dụng làm đầu vào để\ndự báo dòng tiền trong tương lai (ví dụ: cổ tức, dòng tiền tự do).\n(Lựa chọn A) Khi mô hình cấp số nhân được điều chỉnh hợp lý (tức là P/E hợp lý), nó thường bắt nguồn từ\nmô hình giá trị hiện tại (ví dụ: dòng tiền tự do chiết khấu, mô hình chiết khấu cổ tức),\nbao gồm g làm đầu vào.\n(Lựa chọn B) Các mô hình giá trị hiện tại (ví dụ: mô hình chiết khấu cổ tức) thường yêu cầu g để\ndự báo kết quả tài chính trong tương lai của công ty (ví dụ: cổ tức, dòng tiền tự do). Sau khi\ndự báo được thực hiện, chúng sẽ được chiết khấu về hiện tại với tỷ lệ chiết khấu thích hợp (ví dụ:\nWACC) để rút ra giá trị nội tại.\nNhững điều cần nhớ:\nCác dạng mô hình định giá phổ biến bao gồm hệ số nhân, giá trị hiện tại và dựa trên tài sản. Với\nmô hình định giá dựa trên tài sản, giá trị vốn chủ sở hữu ước tính của một công ty (tức là giá trị đối với các cổ đông) được\ngiả định bằng giá trị hợp lý hiện tại của tài sản trừ đi giá trị hợp lý của nợ phải trả. Vì\ntất cả đầu vào đều dựa trên dữ liệu hiện tại nên không cần tốc độ tăng trưởng dài hạn.\nMô tả các danh mục chính của mô hình định giá vốn cổ phần\nLOS","qhtml":null},{"n":49,"q":"A portfolio manager is considering adding an infrastructure investment to a pension portfolio\nto increase the fund's long-term expected return. Which of the following is the most\nappropriate investment to add to the portfolio?","opts":["Direct brownfield investment in a power plant","Direct greenfield investment in a toll road project","Publicly listed master limited partnership in existing energy pipeline assets"],"ans":"B","expl":"Các đặc điểm cơ sở hạ tầng của Greenfield so với brownfield\nGreenfield Brownfield\nCơ sở hạ tầng vẫn chưa được mở rộng hoặc cải thiện cơ sở hạ tầng hiện có\ncơ sở hạ tầng được xây dựng\nKhông có lịch sử hoạt động hoặc tài chính Có thể đã tạo ra dòng tiền đều đặn hoặc\nThường có rủi ro cao hơn, cổ tức cao hơn\ntiềm năng Thường có rủi ro thấp hơn, tiềm năng lợi nhuận thấp hơn\nCác thuật ngữ brownfield và greenfield đề cập đến giai đoạn phát triển của khoản đầu tư vào cơ sở hạ tầng\n. Các dự án Greenfield xây dựng cơ sở hạ tầng mới (ví dụ: đường thu phí mới). Các dự án của Brownfield\nmở rộng hoặc cải thiện cơ sở hạ tầng hiện có (ví dụ: bổ sung công suất tại một nhà máy điện).\nCác dự án cơ sở hạ tầng của Greenfield không có lịch sử tài chính hoặc hoạt động. Các dự án Greenfield\nlà một trong những khoản đầu tư rủi ro nhất cần thực hiện do thời gian thực hiện dài (thường là 5–10\nnăm) và có khả năng bị chậm trễ hoặc vượt chi phí trong việc thu hồi đất, giấy phép, kỹ thuật,\nvà xây dựng cuối cùng.\nDo rủi ro cao liên quan đến các dự án greenfield, các nhà đầu tư yêu cầu lợi nhuận rất cao\nđối với những loại dự án này đầu tư. Một quỹ hưu trí có thời hạn đầu tư rất dài có thể\nhấp thụ rủi ro trong khi thu được lợi nhuận kỳ vọng tiềm tàng lớn hơn có thể được tạo ra\ntrong suốt thời gian dài của những tài sản này.\n(Lựa chọn A) So với các dự án mới, tài sản tiềm năng có rủi ro thấp hơn do tạo ra dòng tiền ổn định\ncũng như lịch sử hoạt động và tài chính đã biết. Các dự án này có xu hướng\ntạo ra nhiều thu nhập hơn và/hoặc định hướng cổ tức, nhưng lợi nhuận kỳ vọng thấp hơn.\n(Lựa chọn C) Một công ty hợp danh hữu hạn chính (MLP) được niêm yết công khai trong các tài sản đường ống năng lượng hiện có\nlà một ví dụ về tài sản mỏ nâu, với kỳ vọng lợi nhuận thấp hơn so với dự án greenfield\n. MLP chủ yếu nhấn mạnh đến việc tạo thu nhập.\nNhững điều cần nhớ:\nCác dự án Greenfield xây dựng cơ sở hạ tầng mới, trong khi các dự án brownfield mở rộng hoặc cải thiện\ncơ sở hạ tầng hiện có. Vì chúng thường có thời gian thực hiện dài và không có lịch sử hoạt động nên\ntài sản của lĩnh vực xanh tiềm ẩn rủi ro đáng kể và do đó phải mang lại lợi nhuận kỳ vọng\ndài hạn cao hơn nhiều so với tài sản của lĩnh vực nâu.\nGiải thích các tính năng và đặc điểm của cơ sở hạ tầng\nLOS","qhtml":null},{"n":50,"q":"Which of the following is the least appropriate ratio to use for evaluating the performance of a\nmarket-neutral hedge fund?","opts":["MAR ratio","Calmar ratio","Treynor ratio"],"ans":"C","expl":"Lợi nhuận đầu tư thường được biểu thị trên cơ sở điều chỉnh rủi ro (tức là lợi nhuận trên mỗi mức rủi ro).\nTỷ lệ Treynor đo lường lợi nhuận vượt mức so với rủi ro hệ thống, trong đó:\nlợi nhuận vượt mức được tính bằng chênh lệch giữa lợi nhuận của danh mục đầu tư và\nlợi nhuận của một tài sản không có rủi ro (ví dụ: tín phiếu Kho bạc Hoa Kỳ hoặc tín phiếu kho bạc) và\nrủi ro hệ thống được đo bằng beta.\nDo đó, tỷ lệ Treynor phù hợp hơn để đánh giá danh mục đầu tư đa dạng hóa hoàn toàn không có rủi ro cụ thể của công ty.\nCác quỹ phòng hộ trung lập với thị trường đầu tư vào từng chứng khoán riêng lẻ trong khi nhắm mục tiêu\nbeta trung bình bằng 0 để chúng chỉ mang lại rủi ro phi hệ thống. Do đó, việc cố gắng tính toán lợi nhuận vượt trội của một\nquỹ phòng hộ trung lập với thị trường trên mỗi đơn vị rủi ro hệ thống là không phù hợp.\n(Lựa chọn A và B) Cả hai tỷ lệ Calmar và MAR đều thích hợp để đo lường hiệu suất được điều chỉnh theo rủi ro-\n của các tài sản thay thế hoặc quỹ phòng hộ bằng cách tính đến tổn thất rút vốn\n. Cả hai đều so sánh lợi nhuận gộp trung bình hàng năm với mức giảm tối đa.\nNhững điều cần nhớ:\nTỷ lệ Treynor xác định lợi nhuận vượt mức của danh mục đầu tư trên mỗi đơn vị rủi ro hệ thống (và sẽ\nkhông phải là thước đo thích hợp về hiệu suất cho một quỹ phòng hộ trung lập với thị trường). Tỷ lệ Calmar\nvà MAR đo lường hiệu suất được điều chỉnh theo rủi ro của các tài sản thay thế hoặc quỹ phòng hộ bằng cách\ntính đến khoản lỗ rút vốn.\nMô tả việc đánh giá hiệu suất của các khoản đầu tư thay thế\nLOS","qhtml":null},{"n":51,"q":"Using matrix pricing to value a bond, the applicable discount rate is most\nappropriately estimated using:","opts":["spot rates.","yields on similar bonds.","spreads above benchmark government bond yields."],"ans":"B","expl":"Ước tính giá trị trái phiếu\nPhương pháp tiếp cận Các cân nhắc khác\nGiá trị trái phiếu như một gói chứng khoán không trả lãi,\nTỷ giá giao ngay Có thể yêu cầu thêm tín dụng\nchiết khấu từng tỷ lệ phản ánh chênh lệch giá\ngiá đến lãi suất giao ngay không rủi ro\nkỳ hạn\nGiá trị trái phiếu sử dụng YTM của giao dịch tích cực\nMatrix Cần điều chỉnh tỷ lệ chiết khấu cho\ntrái phiếu có lãi suất coupon tương tự, kỳ hạn và\nsự khác biệt về giá giữa các trái phiếu\nrủi ro tín dụng\nNhiều đợt phát hành trái phiếu được giao dịch không thường xuyên. Do đó, giá giao dịch gần đây nhất của trái phiếu có thể\ncách đây vài ngày hoặc vài tuần và có thể không phản ánh chính xác giá trị hiện tại của nó. Định giá ma trận có thể được\ndùng để ước tính giá thị trường của chứng khoán được giao dịch không hoạt động từ\nYTM của trái phiếu được giao dịch tích cực .\nChứng khoán có rủi ro tương tự sẽ có lợi nhuận kỳ vọng tương tự, do đó, trái phiếu có\nrủi ro tín dụng, lãi suất phiếu giảm giá và thời gian đáo hạn tương tự sẽ giao dịch ở mức YTM tương đương. Nếu không có trái phiếu\ncó kỳ hạn tương tự để so sánh, thì tỷ lệ chiết khấu thị trường để định giá một\ntrái phiếu được giao dịch không hoạt động có thể được ước tính từ lợi suất của các trái phiếu được giao dịch tích cực tương tự\ncó kỳ hạn ngắn hơn và dài hơn.\n(Lựa chọn A) Chiết khấu dòng tiền của trái phiếu theo lãi suất giao ngay được tính từ trái phiếu có rủi ro tương tự\nlà một giải pháp thay thế để định giá ma trận (không phải là một thành phần của nó). Đây là một phương pháp khác để định giá\ntrái phiếu được giao dịch không hoạt động.\n(Lựa chọn C) Thêm chênh lệch lãi suất cho trái phiếu chính phủ chuẩn là một phương pháp thay thế cho\nước tính tỷ lệ chiết khấu, nhưng nó không được sử dụng trong định giá ma trận.\nNhững điều cần nhớ:\nTrái phiếu khiến nhà đầu tư gặp mức độ rủi ro tương tự sẽ có lợi nhuận kỳ vọng tương tự. Nếu\ntrái phiếu có kỳ hạn tương tự không có sẵn để so sánh, thì tỷ lệ chiết khấu thị trường để định giá\nmột trái phiếu không được giao dịch tích cực có thể được ước tính từ lợi tức của các trái phiếu được giao dịch tích cực\ncó kỳ hạn ngắn hơn và dài hơn.\nMô tả giá ma trận\nLOS","qhtml":null},{"n":52,"q":"The risk to the cash flows investors receive from agency pass-through mortgage-backed\nsecurities is most likely related to:","opts":["prepayment risk.","reinvestment risk.","borrower defaults."],"ans":"A","expl":"Rủi ro trả trước của chứng khoán đảm bảo bằng thế chấp\nẢnh hưởng đến đầu tư\nNguyên nhân Hậu quả\ngiá trị\nTuổi thọ trung bình ngắn hơn của Dòng tiền cao hơn trong giai đoạn đầu\nSuy giảm\nnhững năm được thế chấp đảm bảo phải được tái đầu tư\nlãi suất rủi ro\nchứng khoán với lãi suất thấp hơn\nTrì hoãn nhiều dòng tiền hơn để\nTuổi thọ trung bình dài hơn của\nTiện ích mở rộng Tăng lên trong những năm sau đó, làm giảm\nthế chấp được hỗ trợ\nrủi ro lãi suất giá trị hiện tại và giá của\nchứng khoán\nbảo mật\nThông qua đại lý là một loại chứng khoán được thế chấp (MBS): Nhà đầu tư nhận được\nphần lãi và tiền gốc từ một nhóm các khoản vay thế chấp. Vì hầu hết các khoản thế chấp\ncho phép người đi vay có quyền trả trước khoản vay của họ nên dòng tiền thực tế định kỳ từ\nMBS có thể thay đổi khi thời gian đáo hạn thực tế (tức là thời gian sử dụng trung bình) của MBS thay đổi. Rủi ro trả trước\nđề cập đến sự không chắc chắn của dòng tiền và thời gian đáo hạn của MBS.\nCó hai thành phần của rủi ro trả trước:\nRủi ro thu hẹp: Lãi suất giảm khuyến khích người đi vay tái cấp vốn cho khoản vay của họ,\ndẫn đến việc trả nợ sớm (tức là trả trước) các khoản thế chấp ban đầu. Điều này\nsự trở lại nhanh chóng của vốn gốc buộc tái đầu tư các dòng tiền cao hơn dự kiến\nvới lãi suất thấp hơn.\nRủi ro gia hạn: Lãi suất tăng khiến ít khoản tái cấp vốn và trả trước hơn, do đó\nphần lớn hơn của dòng tiền MBS sẽ được hoãn lại hơn nữa trong tương lai. Việc trì hoãn các dòng tiền\n, cùng với tỷ lệ chiết khấu cao hơn, dẫn đến sự sụt giảm trong\ngiá trị MBS.\n(Lựa chọn B) Rủi ro tái đầu tư liên quan đến sự không chắc chắn của lãi suất mà tại đó các dòng tiền\nđược tái đầu tư, chứ không phải sự không chắc chắn của dòng tiền nhận được từ việc nắm giữ MBS.\nNhững thay đổi trong tỷ lệ trả trước dẫn đến thay đổi về mức độ rủi ro tái đầu tư mà chủ sở hữu MBS\nphải đối mặt, do đó có mối liên hệ giữa rủi ro trả trước và rủi ro tái đầu tư\n. Tuy nhiên, chúng được xác định là các loại rủi ro riêng biệt.\n(Lựa chọn C) MBS của cơ quan có bảo lãnh của chính phủ hoặc bảo lãnh của cơ quan, vì vậy\nviệc người vay vỡ nợ không ảnh hưởng đến sự không chắc chắn của dòng tiền của những chứng khoán này.\nNhững điều cần nhớ:\nChứng khoán được thế chấp thông qua của đại lý (MBS) là một khoản đầu tư vào nhóm\ncho vay thế chấp. Người đi vay thường có quyền trả trước các khoản vay đó, điều này tạo ra\nsự không chắc chắn về thời hạn hiệu lực của MBS. Sự không chắc chắn này được gọi là\nrủi ro trả trước.\nXác định rủi ro trả trước và mô tả cấu trúc phân chia thời gian trong chứng khoán hóa và mục đích của chúng.\nLOS","qhtml":null},{"n":53,"q":"A corporate bond with a 6% annual coupon rate, paid monthly, is quoted at a 5.5% YTM. If\nthe YTM is restated as a bond with semiannual payments, the restated YTM is closest to:","opts":["5.56%","5.58%","5.64%"],"ans":"A","expl":"Tính chu kỳ của trái phiếu (tức là tần suất gộp) thường phản ánh số phiếu thanh toán\nmỗi năm. Tính định kỳ được sử dụng để có được YTM của trái phiếu, thường được trích dẫn\ntrên cơ sở hàng năm. Quy ước này có nghĩa là các YTM dựa trên\ncác chu kỳ khác nhau không thể so sánh trực tiếp được .\nĐể so sánh lợi tức của các trái phiếu khác nhau , các YTM phải được biểu thị bằng cách sử dụng cùng một\nchu kỳ . Trong trường hợp này, lợi suất dựa trên chu kỳ hàng tháng phải được chuyển đổi thành a\nlợi suất tương đương nửa năm như trong bảng bên dưới:\n(Lựa chọn B) 5,58% sẽ là lợi suất thực tế hàng năm của trái phiếu doanh nghiệp nếu YTM\n2)]2} ban đầu.\ndựa trên chu kỳ 2 {[1 + (0,055) /\n12)]12}.\n(Lựa chọn C) 5,64% là lợi suất hiệu dụng hàng năm của trái phiếu doanh nghiệp {[1 + (0,55 /\nNhững điều cần nhớ:\nNói chung, YTM trái phiếu được báo giá hàng năm và sử dụng định kỳ phản ánh\nsố lần thanh toán phiếu lãi mỗi năm. Trái phiếu YTM dựa trên các chu kỳ khác nhau không thể so sánh trực tiếp được\nTuy nhiên, một YTM của một chu kỳ nhất định có thể được chuyển đổi thành\nYTM tương đương của một chu kỳ khác để cho phép so sánh giữa các trái phiếu.\ntính lãi suất hàng năm của một trái phiếu cho các giai đoạn gộp khác nhau trong một năm\nLOS","qhtml":null},{"n":54,"q":"A portfolio consists of a protective put position. For put-call parity to hold, a portfolio of equal\nvalue most appropriately consists of a call with the same strike and expiration as the put and:","opts":["a zero-coupon bond.","a long position in the underlying asset.","a short position in the underlying asset."],"ans":"A","expl":"Ngang giá quyền chọn bán mô tả mối quan hệ định giá chênh lệch giữa giá của quyền chọn mua kiểu Châu Âu\nvà đặt nó có cùng giá thực hiện và thời hạn. Quyền chọn bán và gọi có thể được sử dụng để\ntạo ra các danh mục đầu tư có kết quả giống nhau.\nKinh doanh chênh lệch giá dựa trên tính chẵn lẻ của quyền chọn bán đảm bảo rằng quyền chọn bán và quyền chọn mua có giá trị tương đối so với\nnhau mọi lúc. Biến thể danh mục đầu tư tương đương của tính chẵn lẻ của quyền chọn bán, như được trình bày trong\nhình ảnh trên minh họa mối quan hệ định giá giữa quyền chọn bán bảo vệ và quyền chọn mua ủy thác.\nCả hai danh mục đầu tư đều có cùng giá trị khi hết hạn và vì quyền chọn kiểu Châu Âu có thể được thực thi.\nchỉ khi hết hạn, chúng cũng có cùng giá trị bất kỳ lúc nào trước khi hết hạn.\nQuyền chọn bán bảo vệ được tạo ra bằng cách kết hợp một quyền chọn với một vị thế mua trong cơ sở\ntài sản.\nDanh mục quyền chọn mua được ủy thác kết hợp quyền chọn mua với trái phiếu không trả lãi\nmệnh giá bằng với giá thực hiện của quyền chọn.\nNói cách khác, giá trị thị trường (tức là giá) của trái phiếu trong cuộc gọi ủy thác bằng với hiện tại\ngiá trị của giá thực hiện (tức là mệnh giá) được chiết khấu ở mức lãi suất phi rủi ro.\n(Lựa chọn B) Vị thế mua, tài sản dài hạn không tương đương với quyền chọn bán bảo vệ và không phải là quyền chọn bán\ndanh mục đầu tư ngang giá quyền chọn mua.\n(Lựa chọn C) Vị thế bán không phải là một thành phần của tính chẵn lẻ của lệnh bán nhưng có thể được sử dụng để tạo\nvị trí tổng hợp thông qua sao chép.\nNhững điều cần nhớ:\nNgang giá quyền chọn bán mô tả mối quan hệ không có chênh lệch giữa giá của quyền chọn mua kiểu Châu Âu\nvà đặt, có thể được sử dụng để tạo ra các danh mục đầu tư có kết quả giống nhau. Tương đương\ndanh mục đầu tư được biết đến như quyền chọn bán bảo vệ và quyền chọn mua ủy thác.\nGiải thích tính chẵn lẻ của quyền chọn bán kiểu Châu Âu\nLOS","qhtml":null},{"n":55,"q":"Prior to expiration, which of the following American options on a stock with an upcoming\ndividend should have the smallest difference in value from an otherwise identical European\noption?","opts":["In-the-money put","At-the-money call","Out-of-the-money put"],"ans":"C","expl":"Giá tối thiểu của quyền chọn Mỹ và châu Âu\nMỹ Châu Âu\nChênh lệch lớn hơn bằng 0 Lớn hơn bằng 0 của chênh lệch giữa\nĐặt giữa giá thực hiện và giá thực hiện chiết khấu và cổ phiếu\ngiá cổ phiếu giá\nLớn hơn 0 hoặc chênh lệch giữa giá cổ phiếu và giá chiết khấu\nGọi\ngiá đình công\nQuyền chọn kiểu Mỹ, không giống như quyền chọn kiểu Châu Âu, có thể được thực hiện bất kỳ lúc nào trước khi\nhết hạn. Do đó, giá quyền chọn kiểu Mỹ ít nhất luôn bằng giá của\ncác quyền chọn châu Âu tương đương khác.\nQuyền chọn của Mỹ có giá trị lớn hơn (không bằng) so với các quyền chọn ở Châu Âu về hai mặt.\ntình huống:\nKhi cả hai đều được quyền chọn bán và có tiền\nKhi cả hai đều là quyền chọn mua và có dòng tiền (ví dụ: cổ tức) từ cổ phiếu cơ sở\nQuyền chọn bán bằng tiền có giá trị nội tại và quyền chọn bán kiểu Mỹ có thể được thực hiện ngay lập tức để\nnhận ra giá trị đó. Quyền chọn bán kiểu Châu Âu không thể được thực hiện cho đến khi hết hạn và sự chậm trễ đó gây ra\nchênh lệch giá giữa hai lựa chọn (Lựa chọn A). Từ lúc hết tiền\nquyền chọn bán không có giá trị nội tại, quyền chọn bán hết tiền của Mỹ và châu Âu sẽ\ncó giá bằng nhau (nghĩa là có sự khác biệt nhỏ nhất về giá trị).\nKhi cổ phiếu cơ sở giao dịch không hưởng cổ tức, giá cổ phiếu giảm một lượng bằng\ncổ tức. Người nắm giữ quyền chọn mua của Mỹ có thể thực hiện quyền mua cổ phiếu cơ sở kịp thời\nđể nhận cổ tức, bù đắp cho tác động của việc giảm giá cổ phiếu, nhưng các cuộc gọi của châu Âu\nkhông cung cấp quyền đó. Do đó, quyền quyết định của Mỹ, với quyền thực hiện sớm, mang lại một\nlợi thế và có giá trị hơn quyền chọn mua kiểu Châu Âu (Lựa chọn B).\nNhững điều cần nhớ:\nNgược lại với quyền chọn kiểu Châu Âu, quyền chọn kiểu Mỹ có thể được thực hiện bất kỳ lúc nào trước khi\nhết hạn. Sự khác biệt này mang lại cho một số quyền chọn của Mỹ giá trị lớn hơn những cách khác-\nquyền chọn Châu Âu tương đương. Các quyền chọn hết tiền không có giá trị thực hiện đối với\ngiảm giá và do đó có giá trị bằng nhau.\nXác định các yếu tố xác định giá trị của một lựa chọn và mô tả mỗi yếu tố ảnh hưởng như thế nào đến\ngiá trị của một lựa chọn\nLOS","qhtml":null},{"n":56,"q":"An investor is considering a three-year investment and has calculated a \"2y1y\" forward rate of\n2.75%. If a two-year zero-coupon bond's YTM is 1.85% and a three-year zero-coupon bond's\nYTM is 2.15%, the forward rate is best described as the:","opts":["implied spot rate of a two-year zero-coupon bond in one year.","required rate of return to invest in the three-year zero-coupon bond.","breakeven reinvestment rate on a one-year zero-coupon bond in two years."],"ans":"C","expl":"Tỷ giá kỳ hạn ngụ ý (hoặc chỉ là \"tỷ giá kỳ hạn\") là lãi suất được lấy từ cấu trúc kỳ hạn trái phiếu không trả lãi định kỳ hiện hành\n(tức là đường cong giao ngay). Định giá không có chênh lệch giá đảm bảo\nsự nhất quán của tỷ giá kỳ hạn với chênh lệch tỷ giá giao ngay. Tỷ giá kỳ hạn có thể được hiểu là\nlợi nhuận gia tăng cần thiết để kéo dài thời gian đến ngày đáo hạn thêm một khoảng thời gian nữa.\nVí dụ: trong trường hợp này, một nhà đầu tư sẽ không quan tâm đến việc đầu tư vào trái phiếu không trả lãi định kỳ ba năm với lãi suất 2,15% hoặc đầu tư vào trái phiếu không trả lãi định kỳ hai năm với lãi suất 1,85% và sau đó, hai\nnăm kể từ bây giờ, trong trái phiếu không trả lãi định kỳ một năm ở mức 2,75% (tức là lãi suất kỳ hạn \"2 năm 1 năm\"), vì\ncả hai đều mang lại lợi nhuận như nhau sau ba năm.\nTỷ giá kỳ hạn ngụ ý là tỷ lệ tái đầu tư hòa vốn cần thiết để thực hiện\nhai giao dịch tương đương. Nếu một nhà đầu tư tin rằng lãi suất một năm trong hai năm trong tương lai\nsẽ thấp hơn tỷ lệ hòa vốn 2,75%, thì nhà đầu tư tốt hơn nên mua\ntrái phiếu không trả lãi định kỳ ba năm ngay hôm nay.\n(Lựa chọn A) Tỷ giá giao ngay ngụ ý của trái phiếu không trả lãi định kỳ hai năm trong một năm được niêm yết là\n1y2y, không phải 2y1y.\n(Lựa chọn B) Tỷ lệ hoàn vốn của trái phiếu không trả lãi định kỳ 3 năm đã được biết trước (tức là 2,15%); đó là\nsự hoàn vốn của trái phiếu không lãi suất một năm trong hai năm là điều không chắc chắn. Tỷ giá kỳ hạn ngụ ý\nlà tỷ suất lợi nhuận yêu cầu để nhà đầu tư không quan tâm đến hai\ngiao dịch .\nNhững điều cần nhớ:\nTỷ lệ kỳ hạn ngụ ý là lãi suất được tính từ cấu trúc kỳ hạn trái phiếu không trả lãi định kỳ hiện tại\n. Tỷ lệ tái đầu tư hòa vốn cần thiết để thực hiện một loạt các giao dịch trái phiếu lãi suất bằng 0\ntương đương về mặt kinh tế.\nXác định tỷ giá ngang bằng và tỷ giá kỳ hạn, đồng thời tính tỷ giá mệnh giá, tỷ giá kỳ hạn từ tỷ giá giao ngay, tỷ giá giao ngay\ntừ tỷ giá kỳ hạn và giá của trái phiếu sử dụng tỷ giá kỳ hạn.\nLOS","qhtml":null},{"n":57,"q":"A new issue of 270-day commercial paper is priced at 96 per 100 of par value. Using a 360-\nday year, the discount interest rate at issuance is closest to:","opts":["5.33%","5.41%","5.56%"],"ans":"A","expl":"Các công cụ thị trường tiền tệ được trích dẫn bằng lãi suất chiết khấu hoặc lãi suất bổ sung.\nQuy ước thị trường xác định lãi suất được sử dụng cho các chứng khoán cụ thể.\nChứng khoán chiết khấu (ví dụ: hóa đơn, thương phiếu, chấp nhận của ngân hàng) được trích dẫn\nsử dụng tỷ lệ chiết khấu , được tính dựa trên mệnh giá (tức là giá trị tương lai)\ncủa chứng khoán: ( FV − PV ) / FV .\nCác công cụ thị trường tiền tệ khác (ví dụ: chứng chỉ tiền gửi, thỏa thuận mua lại)\nđược trích dẫn bằng tỷ giá bổ sung, được tính được tính toán dựa trên giá (tức là\ngiá trị hiện tại) của chứng khoán: ( FV − PV ) / PV .\nChứng khoán chiết khấu là một công cụ nợ có kỳ hạn ngắn được phát hành không có phiếu giảm giá. Các nhà đầu tư\nmua chứng khoán với giá chiết khấu bằng (tức là thấp hơn) mệnh giá và họ nhận được mệnh giá\nkhi đáo hạn. Tiền lãi thu được là chênh lệch giữa giá mua (PV) và\nmệnh giá (FV). Lãi suất chiết khấu trên thị trường tiền tệ là lãi suất định kỳ (tức là lãi suất\nthu được dưới dạng phần trăm của mệnh giá); tỷ lệ này được tính hàng năm bằng cách nhân với\ntính tuần hoàn của bảo mật:\n(Lựa chọn B) Tỷ lệ 5,41% là kết quả của việc sử dụng một năm 365 ngày không thích hợp.\n(Lựa chọn C) 5,56% là tỷ lệ tương đương bổ sung của thương phiếu, được tính bằng cách sử dụng\ntỷ lệ định kỳ dựa trên giá của công cụ (96) chứ không phải mệnh giá của nó .\nNhững điều cần nhớ:\nLãi suất chiết khấu thị trường tiền tệ là lãi suất được sử dụng để báo giá chứng khoán chiết khấu. Tỷ lệ chiết khấu\nbằng với tiền lãi kiếm được theo tỷ lệ phần trăm của mệnh giá, được tính hàng năm để tính đến\ntính chu kỳ của chứng khoán.\nTính toán và giải thích các thước đo chênh lệch lợi suất cho các công cụ lãi suất thả nổi.\nLOS","qhtml":null},{"n":58,"q":"An equipment manufacturer provides customer financing through loans. The manufacturer\ntransfers the loans to a special purpose entity (SPE) that issues bonds to investors. The\ninvestors' collateral is most likely the:","opts":["loans held by the SPE.","cash flows of the manufacturer.","equipment purchased with the loan financing."],"ans":"A","expl":"Chứng khoán đảm bảo bằng tài sản (ABS) được tạo thông qua một quy trình gọi là chứng khoán hóa. Các công ty,\nchẳng hạn như nhà sản xuất trong trường hợp này, tài trợ cho một thực thể có mục đích đặc biệt (SPE), sau đó\nmua lại một tài sản hoặc một danh mục tài sản (ví dụ: các khoản vay của khách hàng), dùng làm tài sản thế chấp . Như\ntrong trường hợp này, nhà tài trợ ABS thường là người khởi tạo các khoản vay trở thành tài sản thế chấp. Sau đó,\nSPE sẽ phát hành trái phiếu được đảm bảo bằng tài sản này cho các nhà đầu tư.\nTài sản thế chấp của nhà đầu tư là tài sản (tức là các khoản vay) do SPE nắm giữ. Các nhà đầu tư trái phiếu\nkhông có quyền yêu cầu đối với tài sản hoặc dòng tiền của nhà tài trợ ABS và/hoặc người khởi tạo khoản vay. Trong\ntrường hợp này, nhà sản xuất vừa là nhà tài trợ vừa là người khởi tạo, nhưng họ không còn sở hữu các khoản vay\nvì chúng đã được bán cho SPE (Lựa chọn B) .\n(Lựa chọn C) Thiết bị được mua bằng số tiền vay có thể dùng làm tài sản thế chấp cho\ncác khoản vay nhưng không phải cho các trái phiếu sử dụng các khoản vay làm tài sản thế chấp.\nNhững điều cần làm hãy nhớ:\nChứng khoán đảm bảo bằng tài sản (ABS) mang lại cho nhà đầu tư một phần dòng tiền được tạo ra bởi một nhóm tài sản\ndo một thực thể có mục đích đặc biệt (SPE) nắm giữ. Tài sản do SPE nắm giữ đóng vai trò là tài sản thế chấp\ntrên ABS. Các nhà đầu tư ABS không có quyền yêu cầu đối với tài sản hoặc dòng tiền của người khởi tạo khoản vay hoặc\nnhà tài trợ SPE.\nMô tả chứng khoán hóa, bao gồm các bên và vai trò của họ.\nLOS","qhtml":null},{"n":59,"q":"Historical monthly changes in a country's consumer price index (CPI) have been negatively\ncorrelated with both global equity and global bond returns. To capture the potential benefits\nof these correlations in a diversified portfolio, an investor would most appropriately invest in\nwhich of the following?","opts":["Greenfield infrastructure project","Fixed-income convertible arbitrage","Broad-based commodity index fund"],"ans":"C","expl":"Đầu tư thay thế đề cập đến đầu tư vào các tài sản phi truyền thống như hàng hóa,\nbất động sản, vốn cổ phần tư nhân và các quỹ phòng hộ. Động lực chính để thêm sự thay thế\nđầu tư vào danh mục đầu tư truyền thống là để cải thiện hồ sơ rủi ro-lợi ích vì các lựa chọn thay thế\ntài sản nói chung có mối tương quan tương đối thấp với tài sản truyền thống.\nHàng hóa mang lại cơ hội đầu tư hấp dẫn do giá cả thấp trong lịch sử\nmối tương quan giữa lợi nhuận của chúng với các tài sản truyền thống và khả năng chống lạm phát của chúng .\nCác chỉ số hàng hóa được xem là biện pháp phòng ngừa lạm phát đặc biệt tốt vì hàng hóa\ntrực tiếp (ví dụ: giá thực phẩm, năng lượng) hoặc gián tiếp (ví dụ: chi phí nhà ở) ảnh hưởng đến cơ bản\ntính toán chỉ số lạm phát [ví dụ: chỉ số giá tiêu dùng (CPI)]. Vì vậy, hàng hóa\nnhìn chung có mối tương quan tích cực tương đối cao với các biện pháp lạm phát và được coi là\nmột trong những lựa chọn thay thế tốt nhất để nắm bắt và phòng ngừa xu hướng lạm phát.\n(Lựa chọn A) Đầu tư vào lĩnh vực xanh là đầu tư vào cơ sở hạ tầng chưa được thực hiện\nđược xây dựng. Các dự án cơ sở hạ tầng thường mang lại rủi ro và lợi nhuận đáng kể cho từng dự án cụ thể\nhồ sơ. Mặc dù đầu tư trực tiếp vào cơ sở hạ tầng có thể mang lại lợi ích đa dạng hóa, nhưng nó\nhồ sơ lợi nhuận dường như không tương quan với giá tiêu dùng.\n(Lựa chọn B) Kinh doanh chênh lệch giá chuyển đổi thu nhập cố định cố gắng kiếm lợi từ việc định giá sai giữa\nquyền chọn vốn cổ phần gắn liền với trái phiếu chuyển đổi và cổ phiếu phổ thông cơ bản. Cái này\nchiến lược dựa vào việc nắm bắt những khác biệt về giá theo sự kiện trong ngắn hạn và không liên quan đến\nxu hướng lạm phát dài hạn được thể hiện trong chỉ số CPI.\nNhững điều cần nhớ:\nCác nhà đầu tư bị thu hút bởi hàng hóa do mối tương quan lợi nhuận thấp trong lịch sử của chúng với\ntài sản truyền thống và để bảo vệ chúng khỏi lạm phát. Chỉ số hàng hóa được xem là\nphòng ngừa lạm phát đặc biệt tốt vì hàng hóa ảnh hưởng trực tiếp hoặc gián tiếp đến cơ sở\ntính toán chỉ số lạm phát [ví dụ: chỉ số giá tiêu dùng (CPI)] và do đó có\nmối tương quan tích cực tương đối cao với các biện pháp lạm phát.\nGiải thích đặc điểm của đất thô, đất rừng, đất nông nghiệp và đặc điểm đầu tư của chúng\nLOS","qhtml":null},{"n":60,"q":"Which of the following best describes a private equity recapitalization? A private equity firm:","opts":["sells a portfolio company to a strategic industry buyer.","provides mezzanine financing to facilitate a leveraged buyout.","pays itself a cash dividend by increasing leverage in a portfolio company."],"ans":"C","expl":"Chiến lược rút vốn cổ phần tư nhân\nMua bán thương mại\nChào bán lần đầu ra công chúng\nBán thứ cấp\nXóa sổ hoặc thanh lý\nTái cấp vốn\nMột công ty cổ phần tư nhân thường sẽ rút khoản đầu tư vào một công ty danh mục đầu tư ở mức cao hơn\nđịnh giá sau khi cải thiện hiệu quả hoạt động và tài chính của công ty. Kết quả\nlợi nhuận là cơ sở cho lợi tức đầu tư của công ty cổ phần tư nhân. Thoát thành công\nđầu tư có thể xảy ra thông qua việc bán hàng cho người mua chiến lược trong ngành (bán hàng thương mại) hoặc các hoạt động tư nhân khác.\ncông ty cổ phần (bán thứ cấp) hoặc thông qua phát hành lần đầu ra công chúng.\nGiao dịch tái cấp vốn không thực sự là một lối thoát vì công ty cổ phần tư nhân vẫn còn\nđầu tư, nhưng nó mang lại lợi nhuận bằng tiền mặt cho công ty cổ phần tư nhân và thường là tiền đề cho một\nthoát ra. Trong tái cấp vốn, quỹ đầu tư tư nhân làm tăng nợ của công ty đầu tư\ngánh nặng tài trợ cho việc chi trả cổ tức bằng tiền mặt cho công ty cổ phần tư nhân .\n(Lựa chọn A) Trong giao dịch mua bán thương mại, một công ty trong danh mục đầu tư được bán cho một người mua chiến lược trong ngành.\n(Lựa chọn B) Trong một thương vụ mua lại có đòn bẩy, một công ty cổ phần tư nhân mua lại một doanh nghiệp khác bằng cách sử dụng\nkhoản nợ lớn, thường được tài trợ bởi công ty bị mua lại. Tài trợ tầng lửng là\nnguồn vốn nợ rủi ro nhất trong các giao dịch này.\nNhững điều cần nhớ:\nTrong tái cấp vốn, quỹ đầu tư cổ phần tư nhân tìm cách tối đa hóa lợi nhuận bằng cách tăng\ngánh nặng nợ của công ty đầu tư đặc biệt là phải trả cổ tức bằng tiền mặt cho công ty cổ phần tư nhân.\nMặc dù việc tái cấp vốn không thực sự là một lối thoát vì công ty cổ phần tư nhân vẫn tiếp tục đầu tư, nhưng nó\nthường là dấu hiệu báo trước một lối thoát.\nGiải thích các đặc điểm của vốn cổ phần tư nhân và đặc điểm đầu tư của nó\nLOS","qhtml":null},{"n":61,"q":"A hedge fund will commit $15 million to a short sale of an exchange-listed stock. The fund\nsells short the maximum number of shares allowable when the margin requirement is 0.4.\nThe relevant information is shown in the table below:\nShare price at initial sale $30\nShare price at repurchase $28\nDividend (paid 8 months after short sale) $1/share\nMargin loan rate 9%\nBroker's deposit rate 4%\nNo interest is paid for the borrowed shares, but there is a short rebate on the sales proceeds.\nIf the fund closes out the position in exactly 1 year, the total percentage return is closest to:","opts":["8.3%","18.3%","26.7%"],"ans":"B","expl":"Việc bán khống cổ phiếu xảy ra khi người bán khống vay cổ phiếu, bán chúng và\nsau đó mua lại và trả lại cho người cho vay. Bán khống sẽ có lãi nếu giá mua lại\nthấp hơn giá bán (\"mua thấp, bán cao\" = \"bán cao, mua thấp\").\nLợi nhuận phụ thuộc phần lớn vào số lượng cổ phiếu bị bán khống.\nViệc vay cổ phiếu thể hiện đòn bẩy, vì vậy tất cả các giao dịch bán khống đều là giao dịch ký quỹ.\nsố lượng cổ phiếu tối đa có thể bán khống là hàm số của vốn chủ sở hữu của người bán khống trong\ngiao dịch. Ngoài chênh lệch giữa giá bán và giá mua lại,\nlợi nhuận từ việc bán khống cũng phụ thuộc vào:\ngiảm giá bán khống: tiền lãi mà người bán khống thu được từ số tiền bán khống và\nđược tính như một hàm số của giá trị đầu tư và lãi suất tiền gửi của nhà môi giới.\ncổ tức được trả trên cổ phiếu cho đến khi chúng được mua lại, mà người môi giới người bán khống\nphải thanh toán cho người cho vay.\nhoa hồng và các chi phí giao dịch khác được trừ vào số tiền thu được (không phải là một yếu tố tr
