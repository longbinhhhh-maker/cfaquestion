<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following is most consistent with a risk budgeting approach to portfolio\nmanagement?", "opts": ["Allocating additional funds to managers with the highest risk-adjusted returns", "Requiring that a certain percentage of each portfolio be dedicated to hedging strategies", "Setting a firm-wide standard deviation target and managing investments toward that goal"], "ans": "C", "expl": "Risk budgeting is the process of allocating assets or investments to portfolios or a\ncompany based on underlying risk characteristics and the firm's maximum level of risk.\nRisk budgeting can use one-dimensional (ie, single-factor) risk metrics or multidimensional\n(ie, multifactor) risk metrics. Single-factor risk budgeting typically uses a risk metric such\nas standard deviation , beta, or value at risk (VaR) to guide firm-wide decisions.\nThese metrics guide management in daily risk-return trade-off decisions and help identify\nprojects or assets that have the highest return per unit of risk. The company may choose to\ntake on more risk than budgeted by hedging or using insurance if that will keep the company\nwithin its risk tolerance.\n(Choice A) Risk budgeting does not focus on fund allocation among managers, but rather on\nthe risk characteristics of the assets or investments themselves.\n(Choice B) Risk budgeting neither requires nor prohibits hedging. Although hedging can be\nused to meet risk budgeting goals, requiring a certain amount of hedging is not consistent\nwith risk budgeting.\nThings to remember:\nRisk budgeting is the process of allocating a predetermined level of risk to a portfolio or firm\nbased on the underlying risk characteristics of the assets or investments. Single-factor risk\nbudgeting typically uses a risk metric such as standard deviation to guide decisions.\nDescribe risk budgeting and its role in risk governance\nLOS", "qhtml": null}, {"n": 2, "q": "Which of the following topics is most likely to be voted on during a company's annual general\nmeeting?", "opts": ["Approving the external auditor", "Accepting a merger or acquisition", "Amending the rights of a class of shares"], "ans": "A", "expl": "General meetings agenda items\nFinancial statement approval\nCompany performance review\nAnnual general meeting (AGM)\nElection of directors and auditors\nBoard and management compensation\nMaterial corporate changes\nMergers and acquisitions\nExtraordinary general meeting (EGM)\nSale or spinoff of corporate assets\nCompanies normally hold an annual general meeting (AGM) to give shareholders an\nopportunity to vote on decisions that are not delegated solely to the board of directors.\nTypical (and often recurring) agenda items for an AGM include the following:\nAn overview of the company's financial statements and performance\nApproval of audited financial statements (if applicable)\nElection and discharge of directors\nRemuneration of directors and executives\nAppointment of external auditors\nThe opportunity for shareholders to voice concerns or opinion\nAn extraordinary general meeting (EGM) is called by a company to address irregular and\ntimely matters, often related to a corporate transaction or material corporate change that\nrequires shareholder approval. Items may include mergers and acquisitions or amendments\nto the rights of a class of shares. If the timing is appropriate, special items may be voted on\nduring an AGM; this is less likely, however, if the items are not of a pressing nature or occur\ninfrequently (Choices B and C) .\nThings to remember:\nCompanies normally hold an annual general meeting (AGM) to give shareholders an\nopportunity to vote on decisions that are not delegated solely to the board of directors.\nApproval of the external auditor is a typical AGM agenda item.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate\nassociated risks\nLOS", "qhtml": null}, {"n": 3, "q": "An analyst gathers the following information for a company:\nBook value of existing debt ¥150 million\nBook value per share of common stock ¥16\nMarket value of existing debt ¥170 million\nCurrent stock price ¥25\nCommon shares outstanding 10 million\nYTM on existing debt 5%\nRisk-free rate 3%\nExpected market return 12%\nCorporate tax rate 35%\nBased on this information, if the appropriate beta is 1.2, the company's WACC is closest to:", "opts": ["9.5%", "10.4%", "11.7%"], "ans": "A", "expl": "The weighted average cost of capital (WACC) is a company's weighted average after-\ntax cost of capital from all sources . The most common sources of capital include equity,\npreferred stock, and debt. In this scenario, there is no preferred equity, so the company's\nWACC is the weighted average cost of its debt and common equity.\nThe weights for debt and equity are determined using the market values of equity and debt to\ndetermine correct proportions. Market value is preferred to book value since WACC is used to\ndetermine the profitability of future projects, and market value represents the most current\nvalue whereas book value represents historical cost.\nThe cost of common equity can be determined using different methods, based on available\ninformation. In this case, the data provided (eg, beta, risk-free rate, market return) suggest\nuse of the capital asset pricing model (CAPM).\nThe calculation is:\n(Choice B) 10.4% results from using the book values rather than market values to\ndetermine the equity and debt proportions.\n(Choice C) 11.7% results from incorrectly multiplying the beta in the CAPM by the market\nreturn instead of multiplying by the risk premium (ie, market return minus risk-free rate).\nThings to remember:\nA company's weighted average cost of capital (WACC) is its marginal cost to raise additional\ncapital for investment. The cost is weighted by the proportion of each type of capital the\ncompany currently uses to support all its business activities. These weights are applied to the\ncosts of equity and debt to determine the overall cost of capital for the company.\nCalculate and interpret the weighted-average cost of capital for a company\nLOS", "qhtml": null}, {"n": 4, "q": "The general conclusions of the CAPM would most likely be materially affected by", "opts": ["non-zero transaction costs.", "restrictions on short selling.", "an inability to borrow at the risk-free rate."], "ans": "B", "expl": "Assumptions of the CAPM\nInvestors are risk-averse, utility focused, and rational\nInvestors have a single-period time horizon\nInvestors are price takers\nInvestors have homogeneous expectations (eg, use\nidentical methods and data to analyze securities)\nInvestments are infinitely divisible\nMarkets are frictionless: no transaction costs and taxes,\nno restrictions on short-selling or on borrowing at the\nrisk-free rate\nThe CAPM establishes a direct linear relationship between an asset's expected\nreturn and its beta , a measure of systematic risk. The CAPM assumes a simplified model of\nfinancial markets, without informational or operational inefficiencies, enabling a clearer\nunderstanding of the relationship between systematic risk and expected return.\nMost of these assumptions have minimal impact on the model results. However, restrictions\non short selling could bias asset prices by restricting arbitrage and could impact key outcomes\nof the CAPM.\n(Choices A and C) The presence of real-world transaction costs, taxes, and limitations on\nborrowing at the risk-free rate typically does not significantly alter the fundamental\nconclusions of the CAPM.\nThings to remember:\nThe CAPM assumes frictionless markets with no transaction costs or taxes and the ability to\nborrow and lend at the risk-free rate. Although actual transaction costs and borrowing\nconstraints do not materially affect the CAPM's core conclusions, short selling costs and\nrestrictions could skew asset prices, potentially affecting CAPM outcomes.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market\nline (SML)\nLOS", "qhtml": null}, {"n": 5, "q": "An activist shareholder fails to convince a company's management to change strategic\ndirection and initiates a proxy contest. Which of the following company actions would create\nthe most effective barrier against the shareholder's action?", "opts": ["Initiate a tender offer.", "Implement a poison pill.", "Stagger the board elections."], "ans": "C", "expl": "Activist investor strategies\nRaising awareness among other shareholders\nProposing resolutions\nProxy battle\nTender offer\nHostile takeover\nShareholder derivative lawsuit\nActivist shareholders take positions in companies they believe are not maximizing\nshareholder value. The primary motivation for these investments is to compel a\ncompany's management to make substantive changes in order to increase the company's\nstock price. Activist strategies vary, from persuasion to hostile takeovers, and include:\nMeeting with management\nRaising shareholders' awareness of specific issues\nProposing resolutions for shareholders to vote on\nProxy conteststo elect desired board members\nTender offers\nShareholder derivative lawsuits\nCompanies can combat takeover attempts. On staggered boards , directors are divided\ninto groups by tenure , so that only one group is elected in a given year (and other groups in\nsubsequent years). This makes it more difficult for an activist to succeed in a proxy battle\nsince multiple board elections over several years would be required to reach the turnover\nnecessary to gain a majority .\n(Choice A) A tender offer is typically initiated by shareholders, not the company itself.\n(Choice B) A poison pill would more directly combat a tender offer or other hostile takeover\nattempt through share purchases and would less effectively defend against a proxy battle.\nThings to remember:\nAn activist shareholder takes a position in a company to pressure its management to act in the\nactivist's desired manner. Activist strategies include raising awareness of specific issues,\nproposing resolutions for shareholders to vote on, proxy battles, tender offers, and\nshareholder derivative lawsuits.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate\nassociated risks\nLOS", "qhtml": null}, {"n": 6, "q": "A company has spent $2 million on market research to determine whether to sell or renovate\nan existing building. If the company sells the building, it will receive $500 million today. If\nthe company renovates the building, it will have to invest $100 million immediately. The\ncompany also will have to borrow the $100 million at a 6% annual interest rate. If the\ncompany decides to renovate, the project's initial cash outlay ($ millions ) is closest to:", "opts": ["600", "602", "606"], "ans": "A", "expl": "Include in cash\nCash flows $ in millions\nflow?\nMarket research 2 No, sunk cost\nOpportunity cost of not selling building 500 Yes, opportunity cost\nRenovation costs 100 Yes, initial investment\nInterest cost on loan 6 No, financing cost\nCapital budgeting is the process companies use to select the most profitable capital\nprojects ; projected cash flows are useful for evaluating each potential project. Capital\nprojects usually involve an initial cash outlay followed by a series of cash inflows. In addition\nto direct inflows and outflows, opportunity costs should be considered when estimating a\nproject's cash flows.\nIn this scenario, if the company uses the building instead of selling it, the sale offer represents\nopportunity cost. This cost should be included in the net cash flow for Year 0 along with the\nrenovation costs, resulting in an initial cash outlay of $600 million ($500 million + $100\nmillion).\n(Choice B) $602 million includes the market research, a sunk cost that is irrelevant to future\ninvestment decisions.\n(Choice C) $606 million includes the interest cost for the loan. Financing costs are not\nincluded in cash flows since they are implicitly reflected in the required rate of return.\nThings to remember:\nIn capital budgeting, some cash flows that are not directly part of a project represent an\nopportunity cost and should be included in the investment decision. Sunk costs are not\nrelevant to the investment decision. Financing costs are not included in cash flows since they\nare implicit in the required rate of return.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return\n(IRR), and return on invested capital (ROIC), and contrast their use in capital allocation\nLOS", "qhtml": null}, {"n": 7, "q": "Management has set a firm's target capital structure range to consist of 20%–25% debt\nfinancing. If the firm's capital structure has deviated to 18% debt and 82% equity, it most\nlikely indicates that the firm experiences:", "opts": ["agency costs.", "a low interest rate environment.", "rising demand for the firm's shares."], "ans": "C", "expl": "A firm's capital structure is defined by its proportion of debt and equity financing ,\nmeasured at market values. Firms often set a range for their target capital structure (eg,\n20%–25% debt range) that theoretically maximizes firm value without taking on excessive\nfinancial leverage.\nIn practice, a firm's actual target capital structure may stray outside its target range due to:\nfluctuations in the market values of debt and/or equity\nopportunistic financing costs for a particular source of capital (eg, low interest rate\nenvironment)\nhigh transaction costs and high minimum transaction size requirements for obtaining\ncapital.\nIn addition, agency costs are the costs of principal-agent issues between shareholders and\nmanagement. Management has discretion over how it uses the company's cash flows and\nmay adopt strategies that benefit management at the expense of shareholder wealth. A\nstrategy to reduce agency costs is to incur more debt and thus more mandatory debt\nobligations, which would reduce management's discretion over the use of cash flows.\nIn this question, the proportion of debt in the firm's capital structure has dropped below its\nminimum 20% threshold to 18%. Greater demand for the firm's shares would increase\nshare prices and increase the proportion of equity in the capital structure, reducing its\nproportion of debt.\n(Choice A) Agency costs would encourage the firm to use debt to control managers and to\nnot have a lower proportion of debt in its capital structure.\n(Choice B) The firm would be able to borrow more at low interest rates, which would\nencourage an increase in the proportion of debt.\nThings to remember:\nA firm's actual capital structure may deviate outside its target capital structure range due to\nfluctuating market values and opportunistic financing costs. High transaction costs and\nminimum size requirements may inhibit a firm from rebalancing its capital structure. Also,\nagency costs would encourage the firm to use debt to control management discretion.\nDescribe optimal and target capital structures\nLOS", "qhtml": null}, {"n": 8, "q": "The global minimum-variance portfolio is best described as being:", "opts": ["unattainable without including a risk-free rate.", "the portfolio with the lowest return on the efficient frontier.", "the point of tangency between the efficient frontier and the capital allocation line."], "ans": "B", "expl": "The minimum-variance frontier is the line containing all minimum-variance portfolios,\nwhich are those with the lowest expected risk for a given level of expected return within\nthe investment opportunity set. Portfolios on the minimum-variance frontier are composed of\nonly risky assets. Of these portfolios, the global minimum-variance portfolio has\nthe lowest expected risk .\nThe efficient fronter (ie, Markowitz efficient frontier, blue line above) is composed of all\nportfolios on the minimum-variance frontier with returns greater than or equal to the global\nminimum-variance portfolio. Each of those portfolios has the highest return for a given level\nof risk. All portfolios with lower returns are suboptimal (red line above), meaning that each\nhas a lower return than an alternative portfolio with the same level of risk.\nNone of the suboptimal portfolios are part of the efficient frontier, so the global minimum-\nvariance portfolio has the lowest return of any portfolio on the efficient frontier .\n(Choice A) Since the global minimum-variance portfolio lies on the minimum-variance\nfrontier, where all portfolios have only risky assets, it is attainable without the risk-free rate.\n(Choice C) The optimal risky portfolio is located at the point of tangency between the\nefficient frontier and the capital allocation line.\nThings to remember:\nAll portfolios on the minimum-variance frontier with returns greater than or equal to the global\nminimum-variance portfolio comprise the Markowitz efficient frontier. The global minimum-\nvariance portfolio has the lowest return of any portfolio on the efficient frontier.\nDescribe and interpret the minimum-variance and efficient frontiers of risky assets and the global\nminimum-variance portfolio\nLOS", "qhtml": null}, {"n": 9, "q": "Which of the following best describes a behavioral bias resulting from both cognitive and\nemotional errors?", "opts": ["Endowment bias", "Loss-aversion bias", "Overconfidence bias"], "ans": "C", "expl": "Behavioral biases affecting analyst forecasts and their remedies\nBias Description Remedy\nReview past forecasts, assess\nHaving unjustified faith in own\nrelative accuracy\nOverconfidence capacity\nApply scenario analysis\nand abilities\nRestrict number of model\nOverestimating own ability to\nIllusion of control\nvariables and expert opinions\ncontrol forecast accuracy\nRegular review of models by an\nBeing reluctant to incorporate\ninvestment team\nConservatism\nnew information (eg, anchoring)\nFlexible models, fewer variables\nClassifying new data based on\nFor base-rate neglect, consider\npast\nboth outside and inside\nRepresentativeness\nviews or experience (eg, base-rate\ninformation\nneglect)\nSeek different perspectives (eg,\nSelecting data that confirm beliefs\nConfirmation\nneutral or negative opinions)\nand discarding conflicting data\nTraditional finance theory presumes that financial market participants act rationally when\nconsidering available information and thus optimize the desired outcome, promoting market\nefficiency. However, behavioral biases often lead to suboptimal investment decision\nmaking. Cognitive errors stem from faulty reasoning and may be corrected with education\nand awareness, while emotional biases stem from internal feelings or emotions and are\nharder to correct.\nOverconfidence bias arises from unjustified or excessive confidence in one's own abilities; it\nis primarily emotionally driven but also has some cognitive elements. For example:\nprediction overconfidence results in confidence intervals that are too narrow (eg, from\nunderestimates of variances), and\ncertainty overconfidence results from overestimating probabilities.\nIn these examples, the bias is based on emotion (eg, hope) and results in flawed reasoning.\nTo overcome overconfidence bias, analysts should candidly evaluate the real reasons\ninfluencing investment decisions and distinguish factually supported decisions from flawed\nreasoning that may be based on emotion.\n(Choice A) The endowment bias is an emotional bias in which more value is attributed to\nassets one personally owns. In effect, the ownership of an asset \"endows\" undue value.\n(Choice B) Loss-aversion bias is an emotional bias that attributes disproportionate fear to\npotential losses, compared with the desire to achieve gains. For example, this bias may lead\ninvestors to hold losing securities to avoid recognizing a loss, thereby taking an unnecessary\nrisk while missing out on potential gains.\nThings to remember:\nCognitive errors originate from faulty reasoning and may be addressed with education, while\nemotional biases—caused by internal feelings or emotions that lead to irrational impulses and\nunsupported intuition—are harder to correct. Some biases, such as overconfidence, have both\ncognitive and emotional elements.\nCompare and contrast cognitive errors and emotional biases\nLOS", "qhtml": null}, {"n": 10, "q": "According to the Modigliani-Miller propositions (with taxes), if a company increases its debt\nlevel, its market value will most likely :", "opts": ["decrease since the costs of financial distress are increasing.", "remain the same since the market value is unaffected by the capital structure.", "increase proportionally to the change in debt."], "ans": "C", "expl": "The Modigliani-Miller (MM) propositions assume perfect capital markets (ie, no arbitrage, no\ntransaction or bankruptcy costs, and symmetric information) and assert that a company's\nmarket value equals the present value of its future cash flows. Modigliani and Miller propose\nthat, in the absence of taxes :\nA company's capital structure does not affect its value (MM I without taxes); and\nA company's cost of equity ( r ) is directly proportional to its debt-to-equity ratio ( D/E ),\ne\nbut WACC remains constant (MM II without taxes).\nHowever, these propositions change when there are corporate taxes :\nThe market value of a levered company is greater than the value of an unlevered but\notherwise identical company; tax-exempt interest payments improve the levered\ncompany's cash flows, increasing its value. The difference in value is the amount of\nthe debt tax shield ( tD ) , which is the product of a company's tax rate ( t ) and value of\ndebt ( D ) (MM I with taxes).\nA company's r is directly proportional to D/E , adjusted by (1 − t ) . Greater leverage\ne\nwill increase the cost of equity, but at a slower pace due to taxes. The greater the tax\nrate ( t ), the slower the increase in r when D/E increases (MM II with taxes).\ne\nTherefore, with taxes, an increase in debt will proportionally increase a company's value and\nreduce its WACC.\n(Choice A) The MM propositions assume no cost of financial distress.\n(Choice B) The market value would remain the same in the absence of taxes.\nThings to remember:\nThe Modigliani-Miller (MM) propositions assume perfect capital markets (ie, no arbitrage, no\ntransaction or bankruptcy costs, and symmetric information). When these propositions\ninclude corporate taxes, greater leverage will increase a company's market value (MM I) and\nreduce its WACC (MM II).\nExplain the Modigliani–Miller propositions regarding capital structure\nLOS", "qhtml": null}, {"n": 11, "q": "Which of the following is the best example of a stakeholder mechanism to improve corporate\ngovernance?", "opts": ["A company adopting staggered board elections", "Consumers using social media to complain about a CEO's decision", "The board of directors forming an ad hoc committee to restructure the company's bonds"], "ans": "B", "expl": "Corporate governance mechanisms\nStakeholders Mechanisms used to improve governance\nAnnual reports\nAll stakeholders Financial statements\nAnnual/extraordinary general meetings\nTakeovers\nShareholders\nActivism\nLitigation\nBond indentures\nCreditors\nCreditor committees\nAudit committees\nBoard and management Compensation committee\nLabor unions\nEmployees\nEmployee stock ownership plans (ESOPs)\nContractual agreements\nCustomers and suppliers Use of social media to influence company\nLaws and regulations\nGovernment/regulators\nCorporate governance codes and standards\nCorporate governance involves aligning the interests of various stakeholders as well as\nenforcing compliance with external rules and regulations. Common governance mechanisms\ninclude those used by shareholders (eg, general meetings) and the board of directors, but also\nby other stakeholders such as creditors, employees, and customers.\nCustomers and suppliers use contracts to govern their relationship with the company,\nestablishing payment terms, delivery methods, rights, and responsibilities. Customers also\nuse social media to publicize and advance their interests and to compete with management\nto influence public opinion. Thus, corporate governance is improved by better alignment with\ncustomer interests.\n(Choice A) A staggered board (eg, a nine-member board replacing three directors each\nyear) prevents a change in the majority of the board in a single election, weakening the power\nof board elections as a mechanism to advance the interests of shareholder activists.\n(Choice C) An ad hoc committee of bondholders may form to suggest restructuring a\ncompany's bonds, usually when the issuer is facing difficulties meeting its obligations, to\nbetter align governance with creditor interests. Such a committee would not be formed by the\nboard of directors.\nThings to remember:\nCorporate governance includes mechanisms used by various stakeholders, including creditors,\nemployees, and customers, to align their interests with shareholder and management\ninterests. Customers may use social media to publicize and advance their interests.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate\nassociated risks\nLOS", "qhtml": null}, {"n": 12, "q": "An analyst gathers the following information on three stocks:\nExpected\nStock Standard Beta\nDeviation\nA 20% 1.3\nB 13% 0.8\nC 31% −0.3\nThe market's expected return is 12%. Based on the CAPM, if the risk-free rate is 2%, then\nthe stock with an expected return greater than the market's expected return is most likely :", "opts": ["Stock A.", "Stock B.", "Stock C."], "ans": "A", "expl": "According to the CAPM, an asset's expected return is a function of its sensitivity\nto systematic risk as measured by beta , the market risk premium , and the risk-free rate .\nThe market's beta is always equal to 1.0. If a security's beta is greater than 1.0, that security\nhas more exposure to systematic risk and a higher expected return than the market.\nIn this case, Stock A's beta (1.3) is greater than the market beta (1.0), so Stock A has an\nexpected return greater than the market's expected return (Choices B and C) . Alternatively,\na security's expected return can be calculated using the CAPM and then compared to the\nmarket's return. Stock A's expected return of 15% is greater than the market's expected\nreturn of 12%.\nThings to remember:\nAccording to the CAPM, an asset's expected return is a function of its sensitivity to systematic\nrisk, the market risk premium, and the risk-free rate. The market's beta is always equal to\n1.0. If a security's beta is greater than 1.0, that security has more exposure to systematic\nrisk and a higher expected return than the market.\nCalculate and interpret the expected return of an asset using the CAPM\nLOS", "qhtml": "<p>An analyst gathers the following information on three stocks:</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>Standard Deviation</th><th>Beta</th></tr></thead><tbody><tr><td>A</td><td>20%</td><td>1.3</td></tr><tr><td>B</td><td>13%</td><td>0.8</td></tr><tr><td>C</td><td>31%</td><td>−0.3</td></tr></tbody></table><p>The market's expected return is 12%. Based on the CAPM, if the risk-free rate is 2%, then the stock with an expected return greater than the market's expected return is most likely:</p>"}, {"n": 13, "q": "All else equal, which of the following types of businesses would most likely benefit from one-\nsided network effects?", "opts": ["Ridesharing", "Social networks", "Payment processing"], "ans": "B", "expl": "A business model helps investors understand a company's strategy, target market, supply\nchain, risks, and other characteristics. Many companies operate a conventional business\nmodel that has been tested by peers or in similar industries.\nThe network effect is the exponential growth in the value of a company's services based\non an increase in the number of users. It can be an important part of a company's business\nmodel.\nOne-sided network effects have one type of user, and the network's value (to each\nuser) increases as more users are added (eg, social media platforms).\nMulti-sided network effects have multiple types of users, and the network's value (to\neach user) is increased by adding all kinds of users.\n(Choice A) Ridesharing benefits from multi-sided network effects. As more drivers use the\nservice, it becomes more valuable to consumers, and as more consumers use the service, it\nbecomes more valuable to drivers.\n(Choice C) Payment processors benefit from multi-sided network effects. As more retailers\naccept the form of payment, the network's value increases to consumers, and as more\nconsumers use the network, its value to retailers increases.\nThings to remember:\nThe network effect is the exponential growth in the value of a company's services based on an\nincrease in the number of users. One-sided network effects have one type of user, while\nmulti-sided network effects have multiple types of users.\nDescribe various types of business models\nLOS", "qhtml": null}, {"n": 14, "q": "According to pecking order theory, the relative attractiveness of different sources of capital\nis most likely based on:", "opts": ["agency costs.", "priority of claims.", "information asymmetries."], "ans": "C", "expl": "Pecking order theory proposes that required information disclosure determines the\nrelative attractiveness of different sources of capital . Management would prefer to\ngenerate funds:\n1. internally, since that requires the least amount of information disclosure to investors,\nrather than\n2. externally, since that requires a greater amount of information disclosure to investors.\nThis theory reflects the presumption that\ncompany management has both public and nonpublic information, while\ninvestors have only public information, and funding decisions thus contain signals.\nFor example, a company would prefer to issue stock when it believes the stock is overvalued,\nso an equity offering signals that management believes the stock is overvalued. Since\nmanagement has more knowledge about the company's prospects, the equity offering reveals\ninformation about the stock's value to investors.\nThe sources of financing for company operations determine its capital structure. Many\ncompanies have target capital structures based on long-run targets/objectives (eg,\nminimizing WACC, desired credit rating). However, various factors such as information\nasymmetries can also affect funding decisions and result in capital structures that differ from\nthe target.\n(Choice A) Agency costs are incurred by principals (eg, shareholders) to monitor the actions\nof parties acting as the principals' agents (eg, company managers) due to potential conflicts of\ninterest. Agency costs do not affect pecking order theory.\n(Choice B) Priority of claims, the relative seniority or subordination of claims by creditors\nand shareholders, is based on contract law and the legal system, not on pecking order theory.\nThings to remember:\nPecking order theory is based on the presumption that management has more information\nthan investors regarding future performance and that raising capital discloses information.\nSuch disclosures can affect management's preferred choice of financing.\nExplain factors affecting capital structure and the weighted-average cost of capital\nLOS", "qhtml": null}, {"n": 15, "q": "An argument supporting a dual-class structure of common equity is most likely that compared\nto single-class structures, dual-class structures better:", "opts": ["align voting power with economic ownership.", "promote stability and long-term strategic investments.", "remove conflicts of interest between noncontrolling shareholders and management."], "ans": "B", "expl": "A common share structure for public companies is the single-class structure, wherein each\nshare grants the holder one vote so that every shareholder has proportional voting\npower based on the number of shares held (eg, a shareholder owning 5% of the company\ncontrols 5% of the votes). Other companies have dual-class structures, with multiple share\nclasses that allow different numbers of votes per share (eg, Class A has one vote per share,\nwhile Class B has five votes per share).\nProponents of dual-class structures argue that they provide more stability since founders and\ninsiders can better retain control when faced with activism or a takeover attempt. In addition,\nshareholders and their chosen managers are insulated when voting power is controlled, so the\ncompany can focus on long-term strategic investments instead of short-term financial results.\nOnce created, dual-class structures are difficult to dismantle.\n(Choice A) Dual-class structures separate voting power from economic ownership since\nowners of the class with more votes (usually founders or insiders) have voting power\ndisproportionate to their share ownership.\n(Choice C) Critics of dual-class structures argue that they can create conflicts of interest\nbetween company executives and noncontrolling shareholders, who lack the voting power to\nenforce their preferences when the executives—chosen by insiders—have different goals.\nThings to remember:\nDual-class share structures separate voting power from economic ownership since owners of\nthe class with more votes have voting power disproportionate to their number of shares.\nProponents of dual-class structures argue that they provide more stability and allow\ncompanies to focus on long-term strategic investments.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups\nLOS", "qhtml": null}, {"n": 16, "q": "In an individual investor's investment policy statement, which of the following is least\nlikely characterized as a client objective?", "opts": ["Having a 35-year time horizon to retirement", "Setting a minimum return above a benchmark", "Identifying the largest acceptable loss per year"], "ans": "A", "expl": "Portfolio planning: objectives vs. constraints\nObjectives Constraints\nRisk and return goals Factors that restrict\nRisk objective determines available investment\namount of attainable return options\nRisk objective addresses: Internal (eg, liquidity\nAbility to assume risk needs, time horizon)\nWillingness to assume risk External (eg, legal\nrestrictions)\nMost investment policy statements (IPS) contain the client's objectives and\nconstraints. Objectives address risk tolerance and return goals ; constraints describe the\nlimits for the types of investments that managers can use to achieve the objectives.\nA common investment constraint for an individual is retirement age , which determines\nthe time horizon for the client's objectives. Regardless of the client's objectives, a 35-year\ntime horizon to retirement indicates the investment options that may be appropriate for that\nclient.\nObjectives can be stated in either absolute or relative terms. For example, a relative return\nobjective explicitly states the minimum standard of return the portfolio should attain (Choice\nB) . In describing a client's risks, an absolute risk objective can be expressed as a maximum\npercentage loss on the portfolio over a period (Choice C) .\nThings to remember:\nIn an investment policy statement, client objectives address only the client's risk and return\nrequirements. Constraints may include the client's time horizon, tax status, preferences, and\nliquidity needs.\nDescribe risk and return objectives and how they may be developed for a client\nLOS", "qhtml": null}, {"n": 17, "q": "An investor constructs a mean-variance graph. For the investor's unique risk tolerance, the\ninvestor's optimal portfolio is most likely displayed as:", "opts": ["Point X", "Point Y", "Point Z"], "ans": "A", "expl": "Optimal investor portfolio\nThe capital allocation line [P, CAL(P)] contains the best possible portfolios available to every\ninvestor. Each portfolio is a linear combination of the risk-free asset and the optimal risky\nportfolio for a different level of risk. The ultimate selection of an investor's optimal portfolio\ndepends on the risk preferences (ie, risk tolerance) of that investor.\nAn investor's risk preferences are graphically depicted by an indifference curve. The investor's\noptimal portfolio is where the CAL is tangent to the individual investor's indifference\ncurve . Thus, different investors will have different optimal portfolios depending on\ntheir individual indifference curves . The optimal portfolio for this investor is Point X .\nPoint Z represents the optimal risky portfolio, the point at which the CAL is tangent to the\nefficient frontier. Although Point Z is on the CAL( P ) and the efficient frontier, this investor's\nrisk tolerance indicates an unwillingness to accept the risk necessary to obtain the return\nprofile of Point Z. An individual investor's optimal portfolio depends on the investor's\nindifference curve (Choice C) .\n(Choice B) Point Y represents the global minimum-variance portfolio. The efficient frontier\nthat dominates the set of portfolios above the global minimum-variance portfolio is preferred\nto the set of portfolios below. Point Y would be inefficient for this investor.\nThings to remember:\nAn investor's optimal portfolio is a combination of the risk-free asset and a risky portfolio on\nthe capital allocation line (CAL). The choice of optimal portfolio depends on an investor's risk\npreferences as expressed by an indifference curve. The optimal portfolio is depicted as the\npoint where the CAL is tangent to the investor's indifference curve.\nDescribe the implications of combining a risk-free asset with a portfolio of risky assets\nLOS", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2wAAAIcCAIAAAAFW7pzAABeX0lEQVR42u3df3zbd3nv/X ARKGqgsX/9fr+3SVET7D+jnA0AAABRzgYAAMDobGSbtdGMueGqKGcDAABAI7P3p2V/ecrZAAAAEOVsAAAAzDgykQAAACCIBAAAAEEkAAAACCIBAABAEAkAAACCSAAAAIAgEgAAAASRAAAAIIgEAAAAQSQAAAAIIgEAAACCSAAAABBEAgAAgCASAAAAteP/AhdCBxvX12z8AAAAAElFTkSuQmCC\" alt=\"exhibit\">An investor constructs a mean-variance graph. For the investor's unique risk tolerance, the\ninvestor's optimal portfolio is most likely displayed as:"}, {"n": 18, "q": "An analyst gathers the following information about a company:\nTotal capital $2 billion\nDebt-to-equity ratio 25%\nCost of common equity 9.0%\nPretax cost of debt 5.0%\nTax rate 20%\nIf the company has only common equity and debt in its capital structure, the company's\nweighted average cost of capital (WACC) is closest to:", "opts": ["7.75%", "8.00%", "8.20%"], "ans": "B", "expl": "A company's weighted average cost of capital (WACC) is its marginal cost to raise\nadditional capital. If each source of capital has a different component cost of capital, WACC is\nthe weighted average of these costs of capital . The costs are weighted\nby the proportions of capital the company currently uses to support all its business activities.\nIn this question, to calculate the WACC the weights of debt and equity must be derived from\nthe company's debt-to-equity ratio (D/E). The company's D/E ratio of 25% means it has\n$0.25 of debt for every $1.00 of equity, or 25% as much debt as equity. The weights can be\nderived as follows:\nNote: Since the proportions of debt and equity must equal 100%, the weight of equity\nis 80% = 100% − 20%.\nTo calculate WACC, the company's component costs of capital are multiplied by their weights.\nTo account for the after-tax cost of debt, be sure to apply the company's tax rate:\nWACC = [(0.20) (0.05 × (1 − 0.20))] + [(0.80) (0.09)]\nWACC = 8.00%\n(Choice A) 7.75% results from incorrectly interpreting the company's D/E ratio of 25% to\nmean that 25%, instead of 20%, of the company's cost structure is debt.\n(Choice C) 8.20% results from using the company's pretax, instead of after-tax, cost of\ndebt.\nThings to remember:\nA company's weighted average cost of capital (WACC) is its marginal cost to raise additional\ncapital. WACC is the sum of each capital component's cost weighted by its proportion of the\noverall capital structure.\nCalculate and interpret the weighted-average cost of capital for a company\nLOS", "qhtml": null}, {"n": 19, "q": "A two-asset portfolio has the following characteristics:\nExpected Security's\nSecurity Standard Portfolio\nDeviation Weight\nStock A 9% 80%\nStock B 10% 20%\nIf the correlation coefficient of returns between the two securities is 0.6, then the portfolio's\nexpected variance is closest to:", "opts": ["0.0073", "0.0085", "0.0855"], "ans": "A", "expl": "The variance of a portfolio's returns ( σp2 ) is a measure of risk . In a two-asset portfolio,\nthe portfolio variance is a function of the weight (ie, proportion of total capital) and\nthe risk ( σx2 ) of each asset as well as the correlation coefficient ρab ) between the\nassets' returns. Portfolio variance expresses the degree of dispersion of a portfolio's\nreturns around its mean. The greater the dispersion, the higher the portfolio risk.\nIn this example, the portfolio's variance is 0.0073.\n(Choice B) 0.0085 results from using the weighted average expected variance in the\nformula. This ignores the effect of the correlation between the two assets' returns.\n(Choice C) 0.0855 is the portfolio's expected standard deviation (ie, the square root of its\nexpected variance).\nThings to remember:\nThe variance of a portfolio's returns is a measure of risk. In a two-asset portfolio, the portfolio\nvariance is a function of the weight and the risk of each asset and the correlation between the\nassets. The variance expresses the degree of dispersion of the portfolio's returns around its\nmean.\nCalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based\non historical data\nLOS", "qhtml": "<p>A two-asset portfolio has the following characteristics:</p><table class=\"qtable\"><thead><tr><th>Security</th><th>Standard Deviation</th><th>Portfolio Weight</th></tr></thead><tbody><tr><td>Stock A</td><td>9%</td><td>80%</td></tr><tr><td>Stock B</td><td>10%</td><td>20%</td></tr></tbody></table><p>If the correlation coefficient of returns between the two securities is 0.6, then the portfolio's expected variance is closest to:</p>"}, {"n": 20, "q": "When evaluating mutually exclusive projects, the IRR most likely :", "opts": ["is appropriate for a project with nonconventional cash flows.", "does not provide context regarding the scale of the investment options.", "provides realistic reinvestment assumptions for projects with conventional cash flows."], "ans": "B", "expl": "Problems when using internal rate of return (IRR) to evaluate capital projects\nPotentially more than one IRR exists when future cash flows are\nMultiple IRR\nnegative (eg, expanding original project)\nPossible that no IRR exists: no discount rate results in zero net\nNo IRR\npresent value (NPV)\nA project with small NPV could have high IRR, and one with low IRR\nRelative scale\ncould have large NPV\nUnrealistic reinvestment\nUnlikely that firms with high hurdle rates can reinvest at those rates\nassumption\nNet present value (NPV) and internal rate of return (IRR) are the most common methods used\nto determine a project's profitability in capital budgeting decisions. The general rule is to\naccept a project if:\nthe project's NPV is positive or\nthe project's IRR is greater than the company's required rate of return.\nA project's IRR is the single discount rate that equates the present value of forecasted cash\nflows to the initial investment, resulting in a zero NPV.\nIf projects are mutually exclusive , the decision to pursue one project precludes investing in\nthe others. In such cases, a ranking problem (eg, one project with a higher IRR but smaller\nNPV than another) could exist.\nSince IRR does not provide context regarding the scale (ie, monetary amount of value\nadded) of investment options, best practice is for a company to maximize profitability as\nmeasured by project NPV. For example, a project may generate an IRR of 20% and NPV of $1\nmillion, but an alternative project that generates a 16% IRR and NPV of $3 million adds more\nvalue.\n(Choice A) A project with unconventional cash flows can generate multiple IRRs. This\ncomplicates the investment decision since there is no way to assess which rate is correct,\nmaking IRR an inferior measure of project profitability, especially when projects must be\nranked.\n(Choice C) The IRR method assumes that a company will be able to reinvest cash flows at\nthe IRR rate. The NPV required rate of return assumption (ie, that the company can reinvest\nat its cost of capital) is considered more conservative and realistic than IRR for all types of\ncash flows.\nThings to remember:\nIf projects are mutually exclusive, a ranking problem could exist between them when making\ncapital budgeting decisions. Since IRR does not provide context regarding the scale of\ninvestment options, best practice is for a company to maximize profitability as measured by\nproject NPV.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return\n(IRR), and return on invested capital (ROIC), and contrast their use in capital allocation\nLOS", "qhtml": null}, {"n": 21, "q": "On Nov 30 20X5, a retailer receives goods purchased from a supplier and offers them for\nsale. In 20X5, if the retailer has a 15-day cash conversion cycle, 25 days payables\noutstanding, 20 days sales outstanding, and a fiscal year end of Dec 31, an analyst's most\nappropriate forecast would be that an amount related to this transaction will appear on the\n20X5 balance sheet's:", "opts": ["inventory.", "accounts payable.", "accounts receivable."], "ans": "C", "expl": "A cash conversion cycle ( CCC ) is the average number of days it takes a company to collect\ncash from a credit sale of goods after paying suppliers for the goods or the materials used to\nmake those goods. The CCC is the sum of the average number of days needed to generate\ncash inflow by selling inventory (DOH) and collecting receivables (DSO), less the average\nnumber of days to generate cash outflow by paying suppliers (DPO).\nThe activities that result in the CCC affect the balance sheet in several ways. For a retailer, for\nexample:\nInventory is recognized when goods are received from a supplier and derecognized\nwhen the goods are sold ; the time elapsed is DOH.\nAccounts payable is recognized when goods are received and derecognized when\nsuppliers are paid ; the time elapsed is DPO.\nAccounts receivable is recognized when goods are sold and derecognized when\ncustomers pay ; the time elapsed is DSO.\nIn this scenario, the only unknown is DOH. DOH = CCC − DSO + DPO = 15 − 20 + 25 = 20\ndays .\nTherefore, on the fiscal year-end 20X5 balance sheet , one month (ie, 31 days) after the\npurchase:\nthe goods are already sold and derecognized from inventory (ie, after 20 days), and\nsuppliers have been paid and the liability derecognized from accounts payable (ie, after\n15 days) (Choices A and B) .\nThus, the only related amount to appear on the Dec 31 20X5 balance sheet is the accounts\nreceivable , which will be paid 9 days (= DOH + DSO − Days remaining in 20X5 = 20 + 20 −\n31) after the fiscal year end.\nThings to remember:\nA cash conversion cycle (CCC) is the average number of days needed to turn a company's\npayment for the purchase of goods or materials from suppliers back into cash from the sale of\nthose goods or materials. Inventory, accounts payable, and accounts receivable are\nrecognized and derecognized on the balance sheet according to when goods are received and\nsold and the company realizes the related cash flow.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles\nLOS", "qhtml": null}, {"n": 22, "q": "A company's board of directors decides that management is not taking enough risk to\nmaximize value for shareholders. Management is currently paid in cash. All else equal, which\nof the following changes to management compensation would best align its risk appetite with\nthat of shareholders?", "opts": ["Tie compensation to company size", "Compensate primarily with stock options", "Award stock grants as additional compensation"], "ans": "C", "expl": "A company's board of directors appoints managers to operate the business on shareholders'\nbehalf. Managers (ie, the agents) are expected to act in the best interest of the shareholders\n(ie, the principals) to maximize shareholder value. However, principal-agent conflicts\narise when management acts in its own self-interest , including:\nInsufficient effort: lapses in managing operations and making operational decisions\nInappropriate risks: overly risk-seeking or risk-averse behaviors (eg, in choosing\ninvestments)\nEmpire building: growing the business specifically to have a larger company to manage\nEntrenchment: operating the company specifically to protect management's jobs\nSelf-dealing: exploiting company resources for personal benefit\nOne way the board can reduce the potential for such conflicts is through management\ncompensation. Paying management with stock-based compensation (eg, using stock\noptions or warrants as compensation) should more strongly align management's\ninterests with shareholders' . Companies often mix salary and bonuses with stock-based\ncompensation; however:\nToo little stock-based compensation may result in management taking too little risk to\nmaximize shareholder value if management interests are not strongly enough aligned\nwith shareholders'.\nToo much stock-based compensation could result in management taking too much risk\nsince management would benefit primarily from stock price upside (Choice B) .\n(Choice A) Tying compensation to the size of the business (eg, total assets) would increase\nthe tendency toward empire building with not enough focus on creating shareholder value.\nThings to remember:\nA company's board of directors appoints managers to operate the business on shareholders'\nbehalf. However, managers sometimes act in their own self-interest, creating principal-agent\nconflicts. A board can reduce the potential for such conflicts by increasing management's own\nequity stake through compensation, and thus more strongly align management's interests\nwith shareholders'.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups\nLOS", "qhtml": null}, {"n": 23, "q": "The following information is collected for three investments:\nExpected Covariance between\nExpected\nInvestment standard investment and the\nreturn (%)\ndeviation market\nX 9 16 0.0318\nY 11 17 0.0056\nZ 13 19 0.0225\nMarket 8 15\nBased only on this information, which investment most likely has the same level of systematic\nrisk as the market?", "opts": ["Investment X", "Investment Y", "Investment Z"], "ans": "C", "expl": "Beta measures systematic risk, indicating how sensitive a security's returns are to changes in\nthe market. The market has a beta equal to 1. A security with a beta greater than 1 is\nconsidered riskier than the market, while a security with a beta less than 1 is less risky than\nthe market.\nBeta is derived from a security's standard deviation, the market's standard deviation, and\ntheir correlation, or from the market's variance and the covariance between the security and\nthe market. Since beta is a measure of market risk, a security with a beta of 1 has the same\nlevel of systematic risk as the market.\n(Choices A and B) Investments X and Y each have betas different from 1, indicating that\ntheir levels of systematic risk are different from the market's systematic risk.\nThings to remember:\nBeta is a measure of systematic risk. It is a function of the security's standard deviation, the\nmarket's standard deviation, and the correlation between the two, or of the market's variance\nand the covariance between the security and the market. A security with a beta of 1 has the\nsame level of systematic risk as the market.\nCalculate and interpret beta\nLOS", "qhtml": null}, {"n": 24, "q": "A project has the following forecasted annual cash flows (in ¥ billions):\nYear Cash Flow\n0 −5\n1 15\n2 8\n3 −20\nBased on this information, which of the following discount rates will produce the lowest net\npresent value (NPV)?", "opts": ["6%", "8%", "11%"], "ans": "A", "expl": "The net present value (NPV) of an investment equals the present value of its forecasted net\ncash flows (ie, inflows minus outflows). The discount rate used for calculating NPV is the\nrequired rate of return for investors, which accounts for the investment's risk.\nTypically, for projects with conventional cash flows (ie, one initial negative cash flow followed\nby positive future cash flows), lower discount rates will yield higher NPVs. However, for\nprojects with unconventional cash flows (ie, negative cash flows occurring beyond the\ninitial period), the relationship between discount rates and the size of the NPV can vary.\nIn this case, the investment has unconventional cash flows. The lowest discount rate (6%)\nyields the lowest NPV (−¥0.52 billion) (Choices B and C) . This occurs because the sizable\nnegative terminal cash flow generates the most negative present value when using the 6%\ndiscount rate; therefore, the NPV is reduced more than under the other two rates.\nThings to remember:\nFor projects with conventional cash flows, the discount rate and the net present value (NPV)\nare inversely related. For projects with unconventional cash flows, the relationship between\nthe discount rate and the NPV is not predictable.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return\n(IRR), and return on invested capital (ROIC), and contrast their use in capital allocation\nLOS", "qhtml": null}, {"n": 25, "q": "A company experiences rapidly accelerating revenue growth, yet its free cash flow remains\nnegative. The company plans to add to its assets, consisting largely of equipment and\naccounts receivable, and to invest in sales and marketing to grow its customer base. Based\nonly on the company's life-cycle stage, the most appropriate type of debt for the company is:", "opts": ["secured.", "unsecured.", "convertible."], "ans": "A", "expl": "Life-cycle phase:\nFinancial and debt characteristics\nLife cycle phase Financial characteristics Debt characteristics\nRevenue growth: Low Availability: Little to none\nCash flow: Negative Cost: High\nStart-up\nBusiness risk: High Capital structure: ~0% debt\nAvailability: Moderate\nRevenue growth: High\nCost: Moderate\nCash flow: Increasing\nGrowth\nType of debt: Secured\nBusiness risk: Medium\nCapital structure: 0%–20% debt\nAvailability: High\nRevenue growth: Slowing\nCost: Low\nCash flow: Positive/predictable\nMature\nType of debt: Unsecured\nBusiness risk: Low\nCapital structure: > 20% debt\nA company's capital structure and the type of debt it uses are likely to be influenced by\nwhere the company is in the industry life cycle and by the type of industry in which it\noperates. The typical pattern is shown below:\nIn the start-up (ie, embryonic) phase, a company has minimal revenue and the risk of\nfailure is high. This leads to limited financing options; convertible debt is typically the\nonly type of debt financing that is available (Choice C) .\nIn the growth phase , revenue growth is accelerating, but additional investment is still\nneeded for expansion. Free cash flows are likely still negative but should be improving.\nThe improving risk outlook makes the business more attractive to investors, lowering\nthe cost of debt . Secured debt (ie, debt backed by collateral) is the most likely form\nof debt financing.\nIn the mature phase, revenue growth slows but becomes more predictable. Free cash\nflow is positive and stable, the company's customer base is established, and investment\nspending is less. Because of the lower risk profile and free cash flow to service debt\npayments, lenders are more willing to offer more unsecured borrowing (Choice B) .\nIn this scenario, the company is in the growth phase and has assets to use as collateral.\nTherefore, the company is most likely to obtain secured debt.\nThings to remember:\nA company's capital structure and the type of debt it uses are likely to be influenced by where\nthe company is in the industry life cycle. Typically, in the start-up phase, only convertible debt\nis available. In the growth phase, secured debt is the most likely form of financing. In the\nmature phase, lenders are more willing to offer more unsecured borrowing.\nExplain factors affecting capital structure and the weighted-average cost of capital\nLOS", "qhtml": null}, {"n": 26, "q": "The capital market line (CML) represents portfolios that consist of a stock market index and\nUS Treasury bills, whereas the capital allocation line (CAL) is best described as representing\nportfolios that consist of:", "opts": ["the optimal risky portfolio and the risk-free asset.", "the global minimum variance portfolio and the risk-free asset.", "the market portfolio and short-term government securities."], "ans": "A", "expl": "The capital allocation line (CAL) graphically shows all combinations of the risk-free asset and\nthe optimal risky portfolio. The point where the CAL touches the efficient frontier is the\noptimal risky portfolio. The CAL, a straight-line tangent to the efficient frontier, begins at the\nrisk-free rate (its y-intercept).\nThe capital market line (CML), an application of the CAL, replaces theoretical portfolios\nwith actual assets . The CML replaces the risk-free asset with short-term government bonds\n(eg, US Treasury bills). It also assumes that a stock index portfolio (eg, S&P 500 index)\nreplaces the optimal risky portfolio.\n(Choice B) The CAL assumes portfolios are created from the optimal risky portfolio and the\nrisk-free asset, not the global minimum variance portfolio and the risk-free asset. Portfolios\ncreated with the global minimum variance portfolio would be suboptimal to portfolios created\nwith the optimal risky portfolio.\n(Choice C) The CAL depicts portfolios created from the theoretical market portfolio and the\ntheoretical risk-free asset , not short-term government securities.\nThings to remember:\nThe capital market line, an application of the capital allocation line, replaces theoretical\nportfolios with actual assets.\nExplain the capital allocation line (CAL) and the capital market line (CML)\nLOS", "qhtml": null}, {"n": 27, "q": "Which of the following factors is most appropriately a concern for potential shareholders?", "opts": ["An activist shareholder with a significant position", "Executive remuneration that includes time-vested shares", "Governance codes implemented on a \"comply or explain\" basis"], "ans": "A", "expl": "Key factors related to corporate governance and\nstakeholder management\nCompany ownership and voting structure\nShareholder representation on board of directors\nRemuneration and incentives for management\nSignificant activist investors\nStrength of shareholder rights\nManagement of long-term risks\nGovernance codes and disclosure of deviation from codes\nSignificant investors with activist tendencies can heavily influence many corporate\nfunctions by pressuring management through tactics such as initiating proxy battles,\nproposing shareholder resolutions, and raising awareness of potentially contentious issues.\nThe primary motivation for activism is usually to increase shareholder value in the manner the\nactivist believes is best. This may concern potential shareholders since the presence of\nan activist can influence a company's strategic direction and cause\nsignificant changes to shareholder composition .\n(Choice B) An executive remuneration plan that includes time-vested shares encourages\nexecutives to take a long-term view of company performance. This view better aligns with\nshareholders' interests than cash or other short-term incentives.\n(Choice C) Governance codes implemented on a \"comply or explain\" basis are voluntary but\nrequire any deviation from the codes to be disclosed publicly, which promotes transparency of\ninformation and is an advantage for shareholders.\nThings to remember:\nShareholder engagement describes a company's interaction with its shareholders. An activist\ninvestor with a significant position in the company's stock can substantially change\nshareholder composition and influence company strategy. The presence of such an investor\nmay be a concern for potential investors.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate\nassociated risks\nLOS", "qhtml": null}, {"n": 28, "q": "An advisor is evaluating an equity portfolio's risk-adjusted return for last year. It is most\nappropriate for the advisor to use the Sharpe ratio, rather than the Treynor ratio, if:", "opts": ["last year's excess return is negative.", "the investor's portfolio is not fully diversified.", "the advisor is considering only systematic risk."], "ans": "B", "expl": "Comparisons using Sharpe ratio vs. Treynor ratio\nUse Sharpe ratio when… Use Treynor ratio when:\nInvestor owns no assets other Beta of asset (or portfolio) is\nthan the portfolio being positive\nevaluated Risk metric is systematic risk\nRisk metric is total risk (measured by beta)\n(measured by standard The assets make up only part of\ndeviation) investor's overall holdings\nInvestor's assets are not fully\ndiversified\nThe Sharpe and Treynor ratios both measure risk-adjusted returns to evaluate an\ninvestment's excess return relative to its risk. The ratios' numerators are identical. However,\nthe Sharpe ratio's denominator is total risk—the
