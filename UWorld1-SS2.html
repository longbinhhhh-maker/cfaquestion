sum of systematic (ie, non-diversifiable)\nand nonsystematic risk—while the Treynor ratio's denominator is only systematic risk.\nInvestors are compensated only for assuming systematic risk (measured by beta) since\nnonsystematic risk can be eliminated through diversification. A portfolio that is not fully\ndiversified (as in this scenario) will be exposed to total risk (measured by standard deviation).\nSince the Sharpe ratio evaluates excess return relative to total risk, it is the appropriate ratio\nto assess the risk-adjusted return of a non-diversified (or less than fully diversified) portfolio.\n(Choice A) To be meaningful, both ratios require a positive numerator. The greatest ratios\nrepresent the best risk-adjusted returns. However, a negative numerator will generate a less\nnegative ratio for a riskier portfolio, so the rankings will be incorrect.\n(Choice C) An advisor concerned with evaluating risk-adjusted returns based solely\non systematic risk would most appropriately use the Treynor ratio, not the Sharpe ratio. The\nTreynor ratio evaluates excess return relative to beta, which is a measure of only systematic\nrisk.\nThings to remember:\nThe Sharpe and Treynor ratios are risk-adjusted measures of excess return on investments.\nThe Sharpe ratio evaluates excess return relative to total risk, while the Treynor ratio\nevaluates excess return relative to systematic risk. The Sharpe ratio is more appropriate\nwhen the investment being evaluated is less than fully diversified and therefore exposed to\nboth systematic and unsystematic risk.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha\nLOS", "qhtml": null}, {"n": 29, "q": "A company undertakes an average-risk project, which is 100% financed with debt and\ngenerates relevant overhead costs. One year later, the CFO realizes that the project's NPV\nhad been significantly overestimated. Which of the following capital allocation mistakes\nwould most appropriately explain this overestimation?", "opts": ["Overestimating overhead costs", "Disregarding ROE when analyzing the project", "Using the cost of debt to discount the projected cash flows"], "ans": "C", "expl": "A company's management uses the capital allocation process when making capital investment\ndecisions. One important assumption of this process is that financing\ncosts are ignored when estimating the project cash flows since they are already reflected\nin the discount rate. The appropriate discount rate is the required rate of return , which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific , so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company\nestimates returns of comparable projects and selects the best alternative(s) to invest.\nAll undertaken projects become part of the company's portfolio , which is financed by\na mix of equity and debt instruments. Equity investors' required rate of return is defined by\nthis capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate\nof return, which reflects the greater risk to equity investors (ie, cost of equity).\nTherefore, discounting the cash flows by the cost of debt underestimates the required\nreturn and overestimates the project's NPV .\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common\ncapital allocation mistake. Overestimating overhead would result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the\ninvestment decision, which should be based on cash flow analysis and focused on the long-\nterm interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the\nrequired rate of return. Discounting it by only the cost of debt is a mistake that will result in\nan overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls\nLOS", "qhtml": null}, {"n": 30, "q": "In a corporate bond indenture, which of the following is most likely a negative covenant?", "opts": ["Prohibiting a bond call before the first call date", "Restricting the issuance of debt senior to existing bond issues", "Limiting interest payments on bonds if profitability fails to meet specified thresholds"], "ans": "B", "expl": "A bond is a contract between the issuer and the bondholders. The rights of the bondholders\nand obligations of the issuer are itemized in an indenture. Indentures include provisions\ndesigned to protect the bondholders' interests. These provisions are categorized as:\nAffirmative covenants that require the issuer to take specified actions\nNegative covenants that restrict or prohibit specified actions\nNegative covenants protect bondholders by restricting actions by the issuer that\nwould impair the issuer's ability to pay interest and/or repay principal . For example, a\nnegative covenant may restrict the issuance of new debt that would be senior to debt\nalready outstanding. Otherwise, the new debt would disadvantage the existing bondholders\nby creating a more senior claim on the company's assets.\n(Choice A) Call protection, which prohibits calling a bond for a period after issuance, is not\nconsidered a negative covenant since it does not prevent the issuer from taking action\nthat impairs its ability to repay debt.\n(Choice C) Payment of interest on bonds is a legal obligation for an issuer, so negative\ncovenants would not restrict such payments. However, a common negative covenant is a limit\non distributions to shareholders (eg, cash dividends) if profitability fails to meet specified\nthresholds.\nThings to remember:\nNegative covenants protect bondholders by restricting actions by the issuer that would impair\nthe issuer's ability to pay interest and repay principal. One common negative covenant is to\nrestrict the issuance of new debt that would be senior to already outstanding debt and create\na disadvantage for existing bondholders.\nDescribe the contents of a bond indenture and contrast affirmative and negative covenants.\nLOS", "qhtml": null}, {"n": 31, "q": "A benchmark government yield curve is most likely obtained from:", "opts": ["interpolation.", "the par curve.", "the spot curve."], "ans": "A", "expl": "Yield curves display the term structure of interest rates by graphing the relationship between\nmaturities and bond yields. Government bonds form the basis of most yield curves, the most\nfundamental of which is the yield curve on coupon bonds (ie, the coupon curve).\nMany governments regularly issue bonds in select maturities such as 2, 3, 5, 7, 10, and 30\nyears, and these bonds form the backbone of the \"benchmark\" coupon curve. As government\ncoupon curves are constructed using only the most recently issued and actively traded\nbonds as benchmarks, the remainder of the curve is constructed using interpolation (ie,\nestimated values) to connect these points.\n(Choices B and C) The spot curve is constructed from a series of government zero-coupon\nbonds of different maturities. A par curve is constructed from a spot curve and represents the\ncoupon rate for a given maturity such that the bond would trade at par when each coupon\npayment is discounted by the appropriate term spot rate. Spot and/or par curves are not\nused to construct a benchmark coupon curve.\nThings to remember:\nYield curves on government coupon bonds are constructed using only the most recently issued\nand actively traded benchmark bonds. The remainder of the curve is constructed using\ninterpolation to connect these points.\nCompare the spot curve, par curve, and forward curve.\nLOS", "qhtml": null}, {"n": 32, "q": "An investor is seeking an alternative investment that offers historically low correlation with\nglobal equities, relatively low volatility, and current income. Which of the following most\nappropriately meets these requirements?", "opts": ["Farmland", "Managed futures", "Publicly listed real estate investment trust"], "ans": "A", "expl": "Farmland and timberland investments\nFarmland Timberland Common to both\nHarvest\nquantities\nSources of\nCommodity prices Lumber prices\nLand price\nreturns\nchanges\nPossibly ESG Inflation hedge\nESG-friendly\nRegular income Low correlation\nLong new\nHarvest with traditional\nInvestment\ngrowth cycle\ninflexibility; at assets\nattributes\nHarvest\nleast annual Can hedge with\nflexibility\nharvest cycle futures\nDirect purchase,\nbut for largest\nPublicly traded investors only\nInvestment\nREITs Private\nvehicles\ninvestment\nfunds\nESG = Environmental, social, and\nREIT = Real estate investment trust\ngovernance\nThe three sources of return on farmland are harvest quantities, commodity prices, and land\nprices. Farmland provides a consistent income stream as the crops are harvested, and is\nconsidered an inflation hedge since it offers investors exposure to commodity and land\nprices. Relative to global equities, attributes that make farmland a desirable investment\ninclude low correlations , low annualized volatility , and comparable rates of return.\n(Choice B) Managed futures provide diversification benefits to a typical portfolio, but the\nreturns tend to be volatile.\n(Choice C) Publicly listed real estate investment trusts have high correlations to global\nequities and exhibit high volatility.\nThings to remember:\nRelative to global equities, attributes that make farmland a desirable investment include low\ncorrelations, low annualized volatility, and comparable rates of return. Farmland also provides\na consistent income stream as the crops are harvested and is considered an inflation hedge\nsince it offers investors exposure to commodity and land prices.\nExplain features of raw land, timberland, and farmland and their investment characteristics\nLOS", "qhtml": null}, {"n": 33, "q": "If dealers provide liquidity in a market, the market is most likely a(n):", "opts": ["brokered market.", "order-driven market.", "quote-driven market."], "ans": "C", "expl": "Quote-driven markets are over-the-counter (OTC) markets in which most trades occur\nbetween customers and dealers. In quote-driven markets, dealers provide liquidity (ie,\nmake markets) by standing ready to trade at their quoted prices. Investors can buy or sell\nonly at the price the dealer is willing to transact. Almost all currency and bond trading, as well\nas most spot commodity trading, occurs in quote-driven markets (ie, OTC).\n(Choice A) Brokered markets are those in which brokers search for willing counterparties on\nbehalf of customers. Assets traded in brokered markets typically are expensive, unique,\ntraded infrequently, and/or difficult to hold in inventory (eg, very large blocks of stock, fine\nart, real estate).\n(Choice B) In order-driven markets, buy and sell orders are matched based on price priority\nand time precedence. All automated trading systems and nearly all exchanges use order-\ndriven systems.\nThings to remember:\nQuote-driven markets are over-the-counter markets in which most trades occur between\ncustomers and dealers. In quote-driven markets, dealers provide liquidity by standing ready\nto trade at their quoted prices.\nDescribe how securities, contracts, and currencies are traded in quote-driven, order-driven, and\nbrokered markets\nLOS", "qhtml": null}, {"n": 34, "q": "An analyst gathers the following information on the constituents of a price-weighted index:\nBeginning Ending Dividends Shares\nStock\nprice (¥) price (¥) per share (¥) outstanding\nA 150 180 0 12,000\nB 250 270 10 10,000\nC 200 180 5 14,000\nBased on this information, the index's price return is closest to:", "opts": ["5.0%", "6.3%", "7.5%"], "ans": "A", "expl": "The price return of an index is equal to the weighted average of the price\nreturns of each constituent security in the index. The price return of each security is the\nchange in price as a percentage of the beginning value; it excludes dividends, interest, and\nother distributions.\nIn a price-weighted index , each security's weighting is the ratio of its beginning\nprice to the total beginning price of the index. For example, in this scenario Stock A's\nbeginning price is ¥150. The total beginning price of all three stocks is ¥600, so Stock A's\nweight in the index is ¥150 / ¥600, or 25%.\nThe price return of the index is calculated as follows:\nIt should be noted that since there were no stock splits during the period, the price return can\nalso be calculated as (630 − 600) / 600 = 5.0%.\n(Choice B) 6.3% would be the price return of the index if it were market cap-weighted,\ninstead of price-weighted.\n(Choice C) 7.5% is the total return of the index, which includes income from securities (eg,\ndividends, interest).\nThings to remember:\nThe price return of a security is the change in its price as a percentage of its beginning value.\nThe price return of an index is the weighted average of the price returns of the individual\nassets in the index. Dividends, interest, and other distributions are excluded from price\nreturn.\nCalculate and interpret the value, price return, and total return of an index\nLOS", "qhtml": null}, {"n": 35, "q": "Which of the following best describes the relationship of the underlying asset to the pricing of\na derivative? The derivative price:", "opts": ["represents the value of a replication strategy.", "considers an embedded risk premium on the underlying asset.", "implies the same expected rate of return as the underlying asset."], "ans": "A", "expl": "Derivative pricing concepts\nTraders take advantage of any mispricing of\nderivatives\nRiskless strategies are created from offsetting\nArbitrage-free\npositions in derivatives and underlying assets\nStrategies are pursued until risk-free profits are\neliminated (ie, no-arbitrage pricing)\nDerivatives can be created synthetically from\nunderlying and risk-free assets\nReplication Equivalent positions must have the same expected\nreturns\nDerivative price reflects the value of the replicating\nstrategy\nRiskless positions are created from long/short\nRisk-neutral\nderivatives and replication strategies\nRiskless positions earn a risk-free rate of return;\ncash flows are discounted at the risk-free rate\nDerivative pricing is based on three key concepts:\nArbitrage-free pricing assumes market prices are free of arbitrage opportunities.\nDerivative pricing is risk-neutral since arbitrage-free markets guarantee risk-free\npositions that earn the risk-free rate.\nEquivalent positions can be created through replication using combinations of the\nunderlying asset, a risk-free asset, and a derivative.\nDerivative prices must reflect the risk-free rate since riskless positions can be created by\ncombining an underlying asset (eg, long a bond) with related derivatives (eg, short bond\nfutures). Similarly, derivative positions can be replicated by combining positions in the\nunderlying asset with the risk-free asset. Replicated positions that are economically\nequivalent should trade at economically equivalent prices . Thus, the price of a derivative\nreflects the value of a replication strategy.\nIf an economically equivalent condition does not hold, arbitrage occurs until prices adjust so\nthat riskless profits can no longer be earned and arbitrage-free pricing is achieved. This\narbitrage-free pricing renders investors risk-neutral, meaning that the risk premiums required\nby investors to hold the underlying asset have no effect on derivative pricing (Choice B) .\n(Choice C) The price of a derivative contract is dependent on the price of the underlying\nasset and the terms of the contract, such as the strike price and exercise date. This does not\nimply that the underlying asset's expected rate of return will be the same as the derivative's\nexpected rate of return.\nThings to remember:\nDerivatives are priced on the basis of arbitrage-free replication, such that economically\nequivalent positions should trade at economically equivalent prices. Since replication\nstrategies are riskless, investors are assumed to be risk-neutral when pricing derivatives.\nExplain how the concepts of arbitrage and replication are used in pricing derivatives\nLOS", "qhtml": null}, {"n": 36, "q": "Which of the following market anomalies is inconsistent with semi-strong form market\nefficiency?", "opts": ["Initial public offering", "Earnings surprise effect", "Closed-end fund discount"], "ans": "B", "expl": "The theory of semi-strong form market efficiency holds that market prices contain all publicly\navailable information. One consequence of this theory is that investors cannot achieve\nabnormal returns without using material, nonpublic information. Market anomalies are\npersistent market events that are inconsistent with semi-strong form efficiency , that is,\nprice changes that cannot be explained by available or newly released public information.\nThe earnings surprise anomaly is due to the lack of a complete and immediate price\nadjustment to unexpected news from an earnings report. Since there is a lag between the\nrelease of the earnings report (which becomes public information) and the subsequent price\nadjustment, it is possible to generate abnormal returns for a short time. This is inconsistent\nwith semi-strong form market efficiency.\n(Choice A) The initial public offering (IPO) anomaly indicates that, on average, investors\npurchasing shares through an IPO may be able to earn short-term abnormal profits. IPOs are\nfrequently underpriced, allowing investors to earn abnormal returns; however, market prices\nadjust quickly, supporting semi-strong market efficiency.\n(Choice C) A closed-end fund discount is the persistent 4–10% discount to net asset\nvalue (NAV) observed in these funds' prices. The discount does not result in abnormal returns\ndue to transaction costs, liquidity, and the potential for NAV miscalculations.\nThings to remember:\nA market anomaly is a market event that is inconsistent with efficient market theory. The\nearnings surprise anomaly is inconsistent with semi-strong form market efficiency theory due\nto the short lag between the release of public information and the subsequent price\nadjustment.\nDescribe market anomalies\nLOS", "qhtml": null}, {"n": 37, "q": "An industry has high barriers to exit. According to Porter's \"five forces\" framework, which of\nthe following is most likely to be present in this industry?", "opts": ["Threat of substitutes is high", "Threat of new entrants is high", "Bargaining power of buyers is low"], "ans": "A", "expl": "Porter's \"five forces\" analysis is a key strategic framework for assessing an industry's\ncompetitive environment. Structural attributes can vary dramatically between industries,\ngenerating vastly different economic return profiles. Some industries generate consistent\nprofits throughout an economic cycle, whereas other industries struggle even during a\nsustained economic expansion.\nPricing power is often a key aspect of generating economic profit. Pricing power is usually\nrobust in an industry with high barriers to entry since the threat of new entrants is low , but\nthere are exceptions, such as auto manufacturers, oil refiners, and semiconductor memory\nmanufacturers (eg, DRAM, flash), that also have high barriers to exit (Choice B) .\nPricing power will be weak if the bargaining power of buyers is high . When industries\nproduce products that are commodities (eg, DRAM, gasoline) or high priced and easily\ninterchangeable (eg, autos), a high threat of substitutes exists, contributing to weak\npricing power (Choice C) .\nIndustries with these characteristics are said to have high barriers to exit . They are\nalso characterized by large investment in fixed assets that cannot be easily converted to\nanother purpose, making them prone to overcapacity .\nThings to remember:\nIndustries with high barriers to entry and weak pricing power also often have high barriers to\nexit. Within Porter's \"five forces\" framework, industries with high barriers to entry and exit\nare characterized by a low threat of new entrants, high bargaining power of buyers, and high\nthreat of substitutes.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE\nframeworks\nLOS", "qhtml": null}, {"n": 38, "q": "An analyst observes that a commodity's forward curve is in backwardation. This\nsituation most likely implies:", "opts": ["negative roll yield.", "negative collateral yield.", "convenience yield exceeds storage costs."], "ans": "C", "expl": "An investor who owns a physical commodity (eg, copper) incurs storage costs until the\ncommodity is used or sold. However, that investor also accrues benefits (eg, immediate\navailability) from directly owning the commodity; the benefit that offsets storage costs is the\nconvenience yield. In contrast, an investor who owns a futures contract on the same\ncommodity incurs no storage costs until the contract matures and delivery is accepted, but no\nconvenience yield is accrued.\nAll else equal, a commodity's futures prices are higher than the spot price by the cost of\nholding the commodity, which prevents arbitrage. Therefore, the typical forward pricing\nstructure for physical commodities is an upward-sloping forward curve (ie, futures prices >\nspot prices); in that case, the market is said to be in contango.\nA downward-sloping forward curve (ie, futures prices < spot prices), known\nas backwardation , results from the convenience yield exceeding storage costs .\nBackwardation often indicates bottlenecks in supply or delivery in the spot market.\n(Choice A) Roll yield is the return (positive or negative) that occurs when a contract nears\nexpiration and the futures price converges with the spot price. Backwardation results in\na positive roll yield.\n(Choice B) Collateral yield is a component of a futures contract's price return and should\nalways be positive.\nThings to remember:\nContango and backwardation are terms that describe a futures contract's price relative to the\nspot price of the underlying commodity. The contract is in backwardation if the futures price is\nlower than the spot price. When this occurs, the convenience yield is greater than the storage\ncosts.\nExplain features of raw land, timberland, and farmland and their investment characteristics\nLOS", "qhtml": null}, {"n": 39, "q": "A 20-year government bond is currently trading at 100% of par, and a 1-year forward contract\non the bond is initiated with a value of zero at a price of 102. There are no other costs or\nbenefits to holding the bond. At the forward contract's initiation, it is most likely that the:", "opts": ["risk-free rate is equal to 2%.", "coupon rate is greater than the risk-free rate.", "risk-free rate is greater than the coupon rate."], "ans": "C", "expl": "Risk-free rate – Coupon rate = Forward price – Spot price\nRisk-free rate > Coupon rate Forward price > Spot price\nRisk-free rate < Coupon rate Forward price < Spot price\nRisk-free rate = Coupon rate Forward price = Spot price\nDerivative valuation is based on arbitrage-free pricing, which requires that economically\nequivalent positions earn equal returns. For a bond forward contract to have an initial value of\nzero, the difference between the forward price and the spot price must equal the net cost or\nbenefit of holding the underlying bond until the forward contract expiration.\nSince there are no other holding costs or benefits in this scenario, the factors affecting the\nspot/forward price difference are that:\nholding the bond\ngenerates coupon income, earned at the coupon rate, and\ncreates an opportunity cost equal to the interest that could have been earned at the\nrisk-free rate, and that\nholding a bond forward contract generates no income but creates no opportunity cost.\nIf the bond's coupon rate is less (greater) than the risk-free rate , there is a net cost\n(benefit) to holding the bond instead of holding the forward contract. In that case, it is better\nto hold the forward contract, which will have a higher price than the bond.\nIn this scenario, the forward price is greater than the bond's spot price , so the 1-year\nrisk-free rate must be greater than the bond's coupon rate. Since the 20-year government\nbond is trading at par, the one-year rate being greater that the bond's coupon rate implies that\nthe yield curve is inverted.\n(Choice A) A 1-year forward price differs from the spot price by the risk-free rate minus the\ncoupon rate , not by the risk-free rate.\n(Choice B) A bond's coupon rate that is greater than the risk-free rate results in a forward\nprice that is less than the bond's spot price.\nThings to remember:\nForward and spot prices differ by the net cost or benefit of holding the underlying bond. If a\nbond's forward price is greater than its spot price, the opportunity cost of holding the bond is\ngreater than its income, and the risk-free rate is greater than the bond's coupon rate.\nExplain the difference between the spot and expected future price of an underlying and the cost of\ncarry associated with holding the underlying asset\nLOS", "qhtml": null}, {"n": 40, "q": "A manager is concerned with identifying a noncallable coupon bond that minimizes the risk of\nfunding a future liability. Which type of duration is most appropriate for this manager to use?", "opts": ["Key rate duration", "Modified duration", "Macaulay duration"], "ans": "C", "expl": "Noncallable coupon bonds contain two types of interest rate risk: price risk and reinvestment\nrisk. Interest rate changes have opposite effects on these two risks and on the components of\nbond returns. Interest rate changes are:\ninversely related to price since higher (lower) rates cause bond prices to decrease\n(increase), and\ndirectly related to reinvestment income since higher (lower) rates cause\nreinvestment income to increase (decrease).\nMacaulay duration is the holding period (ie, investment horizon) over which a bond's price\nchange is equal to a change in reinvestment income, allowing those changes to offset each\nother. Holding the bond over that period will balance reinvestment risk and price risk\nand minimize total risk . Therefore, the return on a bond held over its Macaulay duration is\nequal to the bond's market discount rate (ie, YTM) when it was purchased. Buying a bond\nwith a Macaulay duration equal to the time until a liability is due minimizes the risk that the\nbond's issuer will be unable to fund that liability.\n(Choice A) Key rate duration measures the effect on bond prices of a change in one (or\nmore) specific-term interest rate(s).\n(Choice B) Modified duration measures a bond's approximate percentage price change due\nto a 100-basis-point change in its YTM, ignoring the impact of convexity.\nThings to remember:\nMacaulay duration is the holding period (ie, investment horizon) over which a bond's price\nchange equals a change in reinvestment income. A bond held over its Macaulay duration\nearns a return equal to the YTM when the bond was purchased. Buying a bond with a\nMacaulay duration equal to the time until a liability is due minimizes the risk that the bond's\nissuer will be unable to fund that liability.\nDefine, calculate, and interpret Macaulay duration.\nLOS", "qhtml": null}, {"n": 41, "q": "In a developed country's sovereign bond market, which of the following best describes a\nresponsibility of primary dealers?", "opts": ["Syndicate new issuance of government bonds to indirect bidders.", "Facilitate foreign central bank participation in government debt auctions.", "Participate as noncompetitive bidders in multiple-price auctions of government bonds."], "ans": "B", "expl": "Primary dealers in sovereign debt\nFinancial institutions designated as primary dealers by sovereign government\nRequired to participate in government securities auctions\nFacilitate auction participation by foreign central banks\nFrequently serve as counterparties to the central bank in open market operations\nPrimary dealers are government-designated financial intermediaries that make\nimportant contributions to the operation of sovereign debt markets. Primary\ndealers participate in both new debt issuance and secondary trading , improving the\nefficiency of the sovereign debt market and assisting in the implementation of open market\noperations.\nWhile primary dealers participate in all sovereign debt auctions and serve as open market\noperation counterparties to the central bank, they also transact with foreign central banks and\nbidders. Some of that trading by primary dealers facilitates indirect foreign central bank\nparticipation in sovereign debt auctions.\n(Choice A) Unlike new issue corporate bonds, which are usually sold through an underwriting\nsyndicate, new issue sovereign bonds are typically sold in a competitive auction. Corporate\nsecurities issuance is usually accomplished through a firm underwriting commitment (rather\nthan an auction), in which the syndicate supports the purchase of all bonds.\n(Choice C) A responsibility of primary dealers is to participate in all single-price debt\nauctions as competitive bidders. Primary dealers accept the winning price, which is the same\nprice paid by all other bidders.\nThings to remember:\nSovereign debt issuance typically takes place through a public auction using well-defined\nprocedures facilitated by central banks on behalf of the national treasury or finance ministry.\nSovereign governments designate financial institutions as primary dealers and require them to\nparticipate in all auctions with competitive bidding.\nContrast the issuance and trading of government and corporate fixed-income instruments.\nLOS", "qhtml": null}, {"n": 42, "q": "An analyst gathers the following information related to a company's stock:\nCurrent annual dividend per share €1.00\nAnnual dividend growth rate for Years 1–3 6%\nAnnual dividend growth rate for Years 4+ 2%\nRequired rate of return 10%\nIf the stock is fairly valued, then the terminal value at the end of Year 3 using the two-stage\ndividend discount model is closest to:", "opts": ["€14.20", "€14.89", "€15.19"], "ans": "C", "expl": "The two-stage dividend growth model is used to determine the intrinsic value of the stock of a\ncompany that is expected to experience a period of high, short-term dividend growth followed\nby lower long-term growth. The stock's intrinsic value is the sum of the present values of\ndividends from both stages.\nThe terminal value represents the stock's intrinsic value at the end of the short-term,\nhigh-growth stage. At that point, the dividend is expected to grow at a lower rate over a\nperiod expected to continue indefinitely. The terminal value can be calculated using\nthe Gordon growth model since that model is appropriate for a stock with expected constant\ndividend growth.\nIn this scenario, the terminal value is the value at the end of Year 3, when the long-term\ngrowth stage begins. First, calculate the dividend at the end of Year 3 using the short-term\ngrowth rate of 6% since the dividend grows at the higher rate up to that point. Then, the\nterminal value is calculated using the lower, long-term growth rate of 2%:\n(Choice A) €14.20 is the intrinsic value of the stock at Year 0.\n(Choice B) €14.89 results from using the Year 3 dividend to calculate terminal value, rather\nthan the Year 4 dividend.\nThings to remember:\nIn the two-stage dividend growth model, a stock's intrinsic value is the sum of the present\nvalues of dividends from both a short-term, high-growth stage and a subsequent, long-term\nstage of lower growth. The terminal value represents the intrinsic value at the beginning of\nthe second stage, which is expected to continue indefinitely. The Gordon growth model, which\nis appropriate for a stock with an expected constant growth rate, can be used to determine\nthe terminal value.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant)\ngrowth dividend discount model or a two-stage dividend discount model, as appropriate\nLOS", "qhtml": null}, {"n": 43, "q": "The costs of holding an asset exceed the benefits. At inception, the price of a forward contract\non the asset is most likely :", "opts": ["less than its spot price.", "equal to its spot price.", "greater than its spot price."], "ans": "C", "expl": "Forward price versus spot price\nForward < Spot Costs < Benefits\nForward = Spot Costs = Benefits\nForward > Spot Costs > Benefits\nBy buying a forward contract rather than the underlying asset, an investor avoids the costs,\nbut also forgoes any benefits, of holding the asset. Forward contracts are usually initiated at a\nvalue of zero; therefore, the forward price differs from the spot price by the net cost of holding\nthe underlying asset until the forward contract's expiration.\nThe net holding costs are referred to as the cost of carry, or just the carry.\nThe costs of holding the underlying:\nalways include the opportunity cost of the money used to purchase the asset and\nmay include additional expenses such as storage or insurance.\nThe benefits of holding the underlying may include:\nmonetary benefits such as dividends or interest and/or\na nonmonetary benefit referred to as a convenience yield.\nWhen the costs of holding the asset are greater than the benefits , the forward price\nis greater than the spot price by the net amount saved by holding the forward\nand not incurring the net costs of holding the underlying (Choices A and B) .\nThings to remember:\nBuying a forward contract avoids the costs, but forgoes any benefits, of holding the underlying\nasset. When the costs of holding the underlying asset exceed the benefits, the forward price\nis greater than the spot price.\nExplain the difference between the spot and expected future price of an underlying and the cost of\ncarry associated with holding the underlying asset\nLOS", "qhtml": null}, {"n": 44, "q": "For otherwise identical fixed-coupon bonds, the greatest difference between the effective\nconvexity of a callable bond and approximate convexity of a noncallable bond most\nlikely occurs when the benchmarks bond's yield is:", "opts": ["significantly lower than the bonds' coupon rates.", "approximately equal to the bonds' coupon rates.", "significantly higher than the bonds' coupon rates."], "ans": "A", "expl": "Convexity measures how bond price sensitivity (ie, duration) changes as yields change.\nWhen market yields rise (and continue to rise) above their coupon rates, the prices of callable\nand noncallable bonds tend to react the same way. Both approximate and effective\nconvexity are positive, and their values are converging. However, as market yields\ndecline further below coupon rates, the price behavior of callable and noncallable\nbonds diverges due to their increasingly different convexities (Choices B and C) .\nCallable and noncallable bonds have the same scheduled cash flows to maturity. However, the\ncallable bonds' cash flows are uncertain due to the embedded call. Any difference in price\nperformance is driven by the embedded option and the likelihood of the bond getting called.\nAt yields below the callable bond's coupon rate, the bond is likely to be called at the earliest\nopportunity. That limits the potential for appreciation, so callable bond prices become less\nsensitive to further declines in market yields (ie, negative convexity). On the other hand,\nnoncallable bond prices become more sensitive the further benchmark yields decline (ie,\npositive convexity). The difference in convexities results in very different price performance\nas yields decline.\nThings to remember:\nOtherwise identical callable and noncallable bonds exhibit similar price behavior, and have\nsimilar convexities, at benchmark yields significantly above the bonds' coupon rates. At yields\nwell below its coupon rate, the callable bond is likely to be retired early, limiting its potential\nfor appreciation. This results in a large divergence in price performance of callable and\nnoncallable bonds at yields below their coupon rates, which reflects the differing convexities.\nCalculate and interpret convexity and describe the convexity adjustment.\nLOS", "qhtml": null}, {"n": 45, "q": "A hedge fund has the following fee structure, charged on year-end assets under management\n(AUM):\nAnnual management fee 1.5%\nIncentive fee 12%\nSoft hurdle rate 5%\nHigh-water mark $380 million\nThe fund value is $372 million at the beginning of the year and $412 million, before fees, at\nthe end of the year. For this year, if fees are calculated independently, the net return to the\ninvestor is closest to:", "opts": ["7.80%", "8.06%", "8.67%"], "ans": "B", "expl": "An investor's return is calculated net of fees and as a percentage of the fund's beginning\nvalue. Hedge funds often levy both a management fee and an incentive fee.\nThe management fee is calculated as a percentage of the fund's total ending assets\nunder management (AUM) and is assessed regardless of profitability .\nThe incentive fee is calculated as a percentage of profits either net (ie, after\ndeducting) or gross (ie, before deducting) of management fees.\nIf fees are calculated independently , the hurdle rate determination and fee calculations\nare on a gross basis .\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or AUM\nbeing higher than the high-water mark. In this scenario, the fund's threshold to earn an\nincentive fee is contingent on exceeding the 5% soft hurdle rate and the high-water mark of\n$380 million. Due to the soft hurdle rate, the incentive fee will be applied to the entire gain\nabove the high-water mark.\nThe investor's return for the year is calculated (in $ millions) as follows:\n(Choice A) A 7.80% return inappropriately calculates returns using beginning AUM, instead\nof the high-water mark, as the incentive fee's base.\n(Choice C) An 8.67% return inappropriately calculates returns using a hard hurdle rate.\nThings to remember:\nAn investor's return on a hedge fund is calculated net of fees and as a percentage of the\nfund's beginning value. Hedge funds levy both a management fee and an incentive fee. The\nmanagement fee is calculated as a percentage of the fund's ending total value, gross of fees,\nand assessed regardless of profitability. The incentive fee is calculated as a percentage of\nprofits, subject to hurdle rates and high-water marks.\nCalculate and interpret alternative investment returns both before and after fees\nLOS", "qhtml": null}, {"n": 46, "q": "An analyst estimates a firm's enterprise value (EV) using an EV/EBITDA multiple and then\ncorrectly calculates the firm's implied equity value from its EV. If the equity value is higher\nthan the EV, the most likely reason is that:", "opts": ["the EV/EBITDA multiple is low.", "the firm's stock is greatly undervalued.", "the firm has more cash than debt and preferred stock."], "ans": "C", "expl": "To estimate a firm's enterprise value (EV), analysts often multiply the firm's EBITDA by\nan EV/EBITDA ratio. Enterprise value measures the value of a firm's operations, which is\nsupported by equity and nonequity sources of capital.\nEquity value measures the value to common shareholders.\nNonequity claims, or net debt, measure the value to other providers of capital, such as\npreferred shareholders and creditors.\nNote: Net debt is net of cash since cash can be used to pay down debt.\nTheoretically, equity value is what owners would receive from selling a business after settling\nnet debt. In some cases (such as this scenario), equity value can exceed enterprise\nvalue due to negative net debt : The firm has more cash and marketable investments than\nits gross nonequity claims (eg, debt, preferred stock, noncontrolling interest).\n(Choice A) A low EV/EBITDA multiple has no impact on net debt. Therefore, a low\nEV/EBITDA multiple does not contribute to the difference between EV and equity value.\n(Choice B) A judgment about the firm's stock valuation compares its estimated intrinsic\nequity value to its market equity value, not to an estimated EV.\nThings to remember:\nThe EV/EBITDA ratio can be used to estimate the firm's enterprise value (EV). EV measures\nthe value of a firm's core operations, which is supported by equity and nonequity sources of\ncapital. Equity value measures the value to businessowners (ie, common shareholders)\nwhereas nonequity claims, or net debt, measure the value to other capital providers. Equity\nvalue can exceed EV when there is negative net debt.\nDescribe enterprise value multiples and their use in estimating equity value\nLOS", "qhtml": null}, {"n": 47, "q": "Three equity indexes hold the same 30 securities, but they are weighted differently in each\nindex. Over the past year, the total returns of the indexes were:\nIndex Weighting Return %\nFundamental 6\nEqual 10\nMarket capitalization 2\nThe best explanation for this performance difference is:", "opts": ["large-cap and value outperformance.", "small-cap and value outperformance.", "large-cap and momentum outperformance."], "ans": "B", "expl": "Equity index weighting styles\nType of index Key performance drivers\nMarket capitalization Large-cap, momentum\nEqual Small-cap, value\nFundamental Value\nPrice High-priced stocks\nIndex weighting methodology can have a substantial impact on the underlying performance of\nan index. Understanding the underlying biases present in each approach helps analyze index\nperformance more effectively. Three key index weighting methods are:\nEqual: Equal weight is assigned to each asset.\nMarket capitalization: Weight is based on the market value of the asset as a percentage\nof the total market value of assets in the index.\nFundamental: Weight is based on a company metric (eg, revenues, book value, number\nof employees relative to the sum of the total for all constituents, earnings yields ) to\ndetermine the weight in the index.\nCompared to a market capitalization approach, fundamentally and equally weighted\nindexes emphasize assets normally associated with a value tilt. In equally weighted\nindexes, small-capitalization stocks have an outsized effect on performance. In this\nscenario, the equal-weighted index was the clear outperformer, indicating small-\ncap and value outperformance .\n(Choices A and C) Market capitalization-weighted index performance is heavily influenced\nby large-capitalization stocks and the momentum effect. Capitalization-weighted indexes are\nbased on market value, so high-momentum stocks have increasing weight and performance\nimpact.\nThings to remember:\nCompared to a market capitalization approach, equally weighted indexes give emphasis to\nsmall-capitalization stocks and assets normally associated with a value tilt.\nCalculate and analyze the value and return of an index given its weighting method\nLOS", "qhtml": null}, {"n": 48, "q": "Which of the following least likely requires a future long-term growth rate for valuation\npurposes?", "opts": ["Justified P/E", "Dividend discount model", "Asset-based valuation model"], "ans": "C", "expl": "Analysts use valuation models to estimate the intrinsic value of a stock to determine whether\nit is valued fairly. Common forms of valuation models include multiplier, present value, and\nasset based.\nWith an asset-based valuation model, a firm's estimated equity value (ie, value to\nshareholders) is assumed to be equal to the current fair value of assets minus the fair\nvalue of liabilities . Analysts often start with the book values of line items on the balance\nsheet and make fair value adjustments to derive their market values. Since all inputs are\nbased on current data, no long-term growth rate ( g ) is needed; g is used as an input for\nforecasting future cash flows (eg, dividends, free cash flows).\n(Choice A) When a multiplier model is justified (ie, justified P/E), it typically is derived from\na present value model (eg, discounted free cash flow, dividend discount model), that\nincludes g as an input.\n(Choice B) Present value models (eg, dividend discount model) typically require g for\nforecasting a company's future financial results (eg, dividends, free cash flows). Once\nforecasts are made, they are discounted to the present at an appropriate discount rate (eg,\nWACC) to derive an intrinsic value.\nThings to remember:\nCommon forms of valuation models include multiplier, present value, and asset based. With\nan asset-based valuation model, a firm's estimated equity value (ie, value to shareholders) is\nassumed to be equal to the current fair value of assets minus the fair value of liabilities. Since\nall inputs are based on current data, no long-term growth rate is needed.\nDescribe major categories of equity valuation models\nLOS", "qhtml": null}, {"n": 49, "q": "A portfolio manager is considering adding an infrastructure investment to a pension portfolio\nto increase the fund's long-term expected return. Which of the following is the most\nappropriate investment to add to the portfolio?", "opts": ["Direct brownfield investment in a power plant", "Direct greenfield investment in a toll road project", "Publicly listed master limited partnership in existing energy pipeline assets"], "ans": "B", "expl": "Greenfield vs. brownfield infrastructure characteristics\nGreenfield Brownfield\nInfrastructure that has yet to be Expansion or improvement of existing\nbuilt infrastructure\nNo operating or financial history May already be generating regular cash flow or\nUsually higher risk, higher return dividends\npotential Usually lower risk, lower return potential\nThe terms brownfield and greenfield refer to the development stage of infrastructure\ninvestments. Greenfield projects build new infrastructure (eg, new toll road). Brownfield\nprojects expand or improve existing infrastructure (eg, adding capacity at a power plant).\nGreenfield infrastructure projects have no financial or operating history. Greenfield\nprojects are among the riskiest investments to undertake due to long lead times (often 5–10\nyears) and the potential for delays or cost overruns in land acquisition, permits, engineering,\nand final construction.\nDue to the high risks associated with greenfield projects, investors require very high returns\nfor these types of investments. A pension fund with a very long investment horizon can\nabsorb the risks while reaping the potentially greater expected returns that can be generated\nover the long life of these assets.\n(Choice A) Relative to greenfield projects, brownfield assets have lower risks due to stable\ncash flow generation and known operating and financial histories. These projects tend to be\nmore income producing and/or dividend oriented, but the expected returns are lower.\n(Choice C) A publicly listed master limited partnership (MLP) in existing energy pipeline\nassets is an example of a brownfield asset, with lower return expectations than a greenfield\nproject. MLPs primarily emphasize income generation.\nThings to remember:\nGreenfield projects build new infrastructure, while brownfield projects expand or improve\nexisting infrastructure. Since they often have long lead times and no performance history,\ngreenfield assets carry considerable risk and therefore must offer much higher long-term\nexpected returns than brownfield assets.\nExplain features and characteristics of infrastructure\nLOS", "qhtml": null}, {"n": 50, "q": "Which of the following is the least appropriate ratio to use for evaluating the performance of a\nmarket-neutral hedge fund?", "opts": ["MAR ratio", "Calmar ratio", "Treynor ratio"], "ans": "C", "expl": "Investment returns are often expressed on a risk-adjusted basis (ie, return per level of risk).\nThe Treynor ratio measures excess returns relative to systematic risk, in which:\nexcess return is calculated as the difference between the portfolio's return and the\nreturn of a risk-free asset (eg, US Treasury bill or T-bill), and\nsystematic risk is measured by beta.\nThe Treynor ratio is therefore more suitable for evaluating a fully diversified portfolio that does\nnot have company-specific risk.\nMarket-neutral hedge funds invest in individual securities while targeting an average\nbeta of zero so that they carry only nonsystematic risk. Therefore, trying to calculate a\nmarket-neutral hedge fund's excess return per unit of systematic risk is not appropriate.\n(Choices A and B) Both the Calmar and MAR ratios are appropriate for measuring the risk-\nadjusted performance of alternative assets or hedge funds by accounting for the drawdown\nloss. Both compare compounded average annual returns against the maximum drawdown.\nThings to remember:\nThe Treynor ratio determines a portfolio's excess return per unit of systematic risk (and would\nnot be an appropriate measure of performance for a market-neutral hedge fund). The Calmar\nand MAR ratios measure the risk-adjusted performance of alternative assets or hedge funds by\naccounting for the drawdown loss.\nDescribe the performance appraisal of alternative investments\nLOS", "qhtml": null}, {"n": 51, "q": "Using matrix pricing to value a bond, the applicable discount rate is most\nappropriately estimated using:", "opts": ["spot rates.", "yields on similar bonds.", "spreads above benchmark government bond yields."], "ans": "B", "expl": "Estimating bond values\nMethod Approach Other considerations\nValue bond as a package of zero-coupon securities,\nSpot rate May require adding a credit\ndiscounting each by a rate reflecting the different\npricing spread to risk-free spot rates\nmaturities\nValue bonds using the YTMs of actively traded\nMatrix Need to adjust discount rate for\nbonds with similar coupon rates, maturities, and\npricing differences between bonds\ncredit risks\nMany bond issues trade infrequently. As a result, a bond's most recent transaction price can\nbe days or weeks old and may not accurately reflect its current value. Matrix pricing can be\nused to estimate the market price of inactively traded securities from\nthe YTM of actively traded bonds .\nSecurities with similar risks should have similar expected returns, so bonds that have similar\ncredit risks, coupon rates, and times to maturity should trade at a comparable YTM. If bonds\nof similar maturities are not available for comparison, a market discount rate for pricing an\ninactively traded bond can be estimated from the yields of otherwise-similar actively traded\nbonds of shorter and longer maturities.\n(Choice A) Discounting a bond's cash flows by spot rates calculated from similar-risk bonds\nis an alternative to matrix pricing (not a component of it). It is another method for valuing\ninactively traded bonds.\n(Choice C) Adding a yield spread to a benchmark government bond is an alternative for\nestimating a discount rate, but it is not used in matrix pricing.\nThings to remember:\nBonds that expose investors to similar degrees of risk should have similar expected returns. If\nbonds of similar maturities are not available for comparison, a market discount rate for pricing\nan inactively traded bond can be estimated from the yields of otherwise-similar actively traded\nbonds of shorter and longer maturities.\nDescribe matrix pricing\nLOS", "qhtml": null}, {"n": 52, "q": "The risk to the cash flows investors receive from agency pass-through mortgage-backed\nsecurities is most likely related to:", "opts": ["prepayment risk.", "reinvestment risk.", "borrower defaults."], "ans": "A", "expl": "Prepayment risk of mortgage-backed securities\nEffects on investment\nCauses Consequences\nvalue\nShorter average life of Higher cash flows in early\nContraction Declining\nmortgage-backed years that must be reinvested\nrisk interest rates\nsecurities at lower interest rates\nDefers more of cash flows to\nLonger average life of\nExtension Rising later years, reducing their\nmortgage-backed\nrisk interest rates present value and price of\nsecurities\nsecurity\nAgency pass-throughs are a type of mortgage-backed security (MBS): Investors receive a\nshare of the interest and principal from a pool of mortgage loans . Since most mortgages\ngive borrowers the right to prepay their loans, actual periodic cash flows from\nan MBS may vary as the effective maturity (ie, average life) of the MBS varies. Prepayment\nrisk refers to the uncertainty of MBS cash flows and maturity.\nThere are two components of prepayment risk:\nContraction risk: Declining interest rates encourage borrowers to refinance their loans,\nresulting in early repayment (ie, prepayment) of the original mortgages. This\naccelerated return of principal forces reinvestment of higher-than-anticipated cash flows\nat lower interest rates.\nExtension risk: Rising interest rates cause fewer refinancings and prepayments, so a\nlarger portion of MBS cash flows is deferred further into the future. The deferral of cash\nflows, along with the higher rates at which they are discounted, results in a decline in\nMBS values.\n(Choice B) Reinvestment risk relates to the uncertainty of the interest rate at which cash\nflows are reinvested, not the uncertainty of the cash flows received from holding an MBS.\nChanges in prepayment rates result in changes in the amount of reinvestment risk MBS\nholders are exposed to, so there is a connection between prepayment risk and reinvestment\nrisk. However, they are defined as distinct types of risk.\n(Choice C) An agency MBS has either a government guarantee or an agency guarantee, so\nborrower defaults do not affect the cash flow uncertainty of these securities.\nThings to remember:\nAn agency pass-through mortgage-backed security (MBS) is an investment in pools of\nmortgage loans. Borrowers usually have the right to prepay such loans, which creates\nuncertainty as to the effective maturity of the MBS. This uncertainty is referred to as\nprepayment risk.\nDefine prepayment risk and describe time tranching structures in securitizations and their purpose.\nLOS", "qhtml": null}, {"n": 53, "q": "A corporate bond with a 6% annual coupon rate, paid monthly, is quoted at a 5.5% YTM. If\nthe YTM is restated as a bond with semiannual payments, the restated YTM is closest to:", "opts": ["5.56%", "5.58%", "5.64%"], "ans": "A", "expl": "A bond's periodicity (ie, compounding frequency) usually reflects the number of coupon\npayments per year. The periodicity is used to obtain the bond's YTM, which is normally quoted\non an annual basis. This convention means that YTMs based on different\nperiodicities are not directly comparable .\nTo compare different bonds' yields , the YTMs must be expressed using the same\nperiodicity . In this scenario, the yield based on monthly periodicity must be converted to a\nsemiannual equivalent yield as shown in the table below:\n(Choice B) 5.58% would be the effective annual yield of the corporate bond if the initial YTM\n2)]2}.\nwere based on a periodicity of 2 {[1 + (0.055 /\n12)]12}.\n(Choice C) 5.64% is the effective annual yield of the corporate bond {[1 + (0.55 /\nThings to remember:\nGenerally, bond YTMs are quoted on an annual basis and use a periodicity that reflects the\nnumber of coupon payments per year. Bond YTMs based on different periodicities are not\ndirectly comparable. However, a YTM of a given periodicity can be converted to the equivalent\nYTM of a different periodicity to allow comparisons between bonds.\ncalculate annual yield on a bond for varying compounding periods in a year\nLOS", "qhtml": null}, {"n": 54, "q": "A portfolio consists of a protective put position. For put-call parity to hold, a portfolio of equal\nvalue most appropriately consists of a call with the same strike and expiration as the put and:", "opts": ["a zero-coupon bond.", "a long position in the underlying asset.", "a short position in the underlying asset."], "ans": "A", "expl": "Put-call parity describes an arbitrage-pricing relationship between the prices of a European call\nand put that have the same strike price and expiration. Put and call options can be used to\ncreate portfolios that produce identical payoffs.\nArbitrage based on put-call parity ensures that the put and the call are fairly valued relative to\neach other at all times. The equivalent portfolios variant of put-call parity, as shown in the\nimage above, illustrates the pricing relationship between a protective put and a fiduciary call.\nBoth portfolios have the same value at expiration, and since European options are exercisable\nonly at expiration, they also have the same value any time prior to expiration.\nA protective put is created by combining an option with a long position in the underlying\nasset.\nA fiduciary call portfolio combines a call option with a zero-coupon bond that has\na face value equal to the options' strike price .\nIn other words, the market value (ie, price) of the bond in the fiduciary call equals the present\nvalue of the strike price (ie, face value) discounted at the risk-free rate.\n(Choice B) A long asset, long call position is not equivalent to a protective put and is not a\nportfolio of put-call parity.\n(Choice C) A short position is not a component of put-call parity but can be used to create\nsynthetic positions through replication.\nThings to remember:\nPut-call parity describes an arbitrage-free relationship between the prices of a European call\nand put, which can be used to create portfolios that produce identical payoffs. The equivalent\nportfolios are known as a protective put and a fiduciary call.\nExplain put–call parity for European options\nLOS", "qhtml": null}, {"n": 55, "q": "Prior to expiration, which of the following American options on a stock with an upcoming\ndividend should have the smallest difference in value from an otherwise identical European\noption?", "opts": ["In-the-money put", "At-the-money call", "Out-of-the-money put"], "ans": "C", "expl": "Minimum prices of American and European options\nAmerican European\nGreater of zero of the difference Greater of zero of the difference between\nPut between the strike price and the the discounted strike price and the stock\nstock price price\nGreater of zero or the difference between the stock price and the discounted\nCall\nstrike price\nAmerican options , unlike European options, can be exercised at any time prior to\nexpiration. Therefore, American option prices are always at least equal to prices of\notherwise-equivalent European options.\nAmerican options have greater (not equal) value than their European counterparts in two\nsituations:\nWhen both are put options and in the money\nWhen both are call options and have a cash flow (eg, dividend) from the underlying stock\nAn in-the-money put has intrinsic value, and an American put can be exercised immediately to\nrealize that value. A European put cannot be exercised until expiration, and that delay causes\na price difference between the two options (Choice A) . Since an out-of-the-money\nput has zero intrinsic value , American and European out-of-the-money puts should\nbe equally priced (ie, have the smallest difference in value).\nWhen the underlying stock trades ex-dividend, the stock price falls by the amount of the\ndividend. Holders of American calls can exercise the right to buy the underlying shares in time\nto receive the dividend, which offsets the impact of the share price decline, but European calls\ndo not provide that right. Therefore, American calls, with early exercise rights, offer an\nadvantage and are more valuable than European calls (Choice B) .\nThings to remember:\nIn contrast to European options, American options can be exercised at any time prior to\nexpiration. This difference gives some American options greater value than otherwise-\nequivalent European options. Out-of-the-money options do not have exercise value to\ndiscount and therefore have equal values.\nIdentify the factors that determine the value of an option and describe how each factor affects the\nvalue of an option\nLOS", "qhtml": null}, {"n": 56, "q": "An investor is considering a three-year investment and has calculated a \"2y1y\" forward rate of\n2.75%. If a two-year zero-coupon bond's YTM is 1.85% and a three-year zero-coupon bond's\nYTM is 2.15%, the forward rate is best described as the:", "opts": ["implied spot rate of a two-year zero-coupon bond in one year.", "required rate of return to invest in the three-year zero-coupon bond.", "breakeven reinvestment rate on a one-year zero-coupon bond in two years."], "ans": "C", "expl": "The implied forward rate (or just \"forward rate\") is an interest rate derived from the current\nzero-coupon bond term structure (ie, spot curve). Arbitrage-free pricing enforces the\nconsistency of forward rates with spot rate differences. A forward rate can be interpreted as\nthe incremental return required for extending the time-to-maturity by an additional period.\nFor example, in this scenario an investor would be indifferent to investing in a three-year zero-\ncoupon bond at 2.15% or investing in a two-year zero-coupon bond at 1.85% and then, two\nyears from now, in a one-year zero-coupon bond at 2.75% (ie, the \"2y1y\" forward rate), since\nboth result in the same return in three years.\nThe implied forward rate is the breakeven reinvestment rate required to make the\ntwo transactions equivalent. If an investor believes that the one-year rate two years in the\nfuture will be lower than the breakeven rate of 2.75%, the investor is better off buying the\nthree-year zero-coupon bond today.\n(Choice A) The implied spot rate of a two-year zero-coupon bond in one year is quoted as\n1y2y, not 2y1y.\n(Choice B) The rate of return of the three-year zero-coupon bond is known (ie, 2.15%); it is\nthe return of the one-year zero-coupon bond in two years that is uncertain. The implied\nforward rate is the required rate of return for the investor to be indifferent to the two\ntransactions .\nThings to remember:\nThe implied forward rate is an interest rate derived from the current zero-coupon bond term\nstructure. It is the breakeven reinvestment rate that is required to make a series of zero-\ncoupon bond transactions economically equivalent.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates\nfrom forward rates, and the price of a bond using forward rates.\nLOS", "qhtml": null}, {"n": 57, "q": "A new issue of 270-day commercial paper is priced at 96 per 100 of par value. Using a 360-\nday year, the discount interest rate at issuance is closest to:", "opts": ["5.33%", "5.41%", "5.56%"], "ans": "A", "expl": "Money market instruments are quoted using either discount rates or add-on interest rates.\nMarket convention determines the interest rates used for specific securities.\nDiscount securities (eg, T-bills, commercial paper, banker's acceptances) are quoted\nusing discount rates , which are calculated based on the face value (ie, future value)\nof the security: ( FV − PV ) / FV .\nOther money market instruments (eg, certificates of deposit, repurchase agreements)\nare quoted using add-on rates, which are calculated based on the price (ie, present\nvalue) of the security: ( FV − PV ) / PV .\nA discount security is a short-maturity debt instrument issued without a coupon. Investors\npurchase the security at a discount to (ie, below) the face value, and they receive the face\nvalue at maturity. The interest earned is the difference between the purchase price (PV) and\nthe face value (FV). A money market discount interest rate is a periodic rate (ie, interest\nearned as a percentage of the face value); the rate is annualized by multiplying it by the\nsecurity's periodicity:\n(Choice B) A rate of 5.41% results from inappropriately using a 365-day year.\n(Choice C) 5.56% is the add-on equivalent rate of the commercial paper, calculated by using\na periodic rate based on the instrument's price (96) rather than its face value .\nThings to remember:\nMoney market discount rates are interest rates used to quote discount securities. A discount\nrate equals the interest earned as a percentage of the face value, annualized to account for\nthe security's periodicity.\nCalculate and interpret yield spread measures for floating-rate instruments.\nLOS", "qhtml": null}, {"n": 58, "q": "An equipment manufacturer provides customer financing through loans. The manufacturer\ntransfers the loans to a special purpose entity (SPE) that issues bonds to investors. The\ninvestors' collateral is most likely the:", "opts": ["loans held by the SPE.", "cash flows of the manufacturer.", "equipment purchased with the loan financing."], "ans": "A", "expl": "Asset-backed securities (ABS) are created through a process called securitization. Firms,\nsuch as the manufacturer in this scenario, sponsor a special purpose entity (SPE), which then\nacquires an asset, or a portfolio of assets (eg, customer loans), that serves as collateral . As\nin this case, the ABS sponsor is often the originator of loans that become the collateral. The\nSPE then issues bonds, backed by this asset, to investors.\nThe investors' collateral is the assets (ie, loans) held by the SPE . The bond investors\nhave no claim on the assets or cash flows of the ABS sponsor and/or the loan originator. In\nthis case, the manufacturer is both sponsor and originator, but it no longer owns the loans\nsince they have been sold to the SPE (Choice B) .\n(Choice C) The equipment purchased with the loan proceeds may serve as collateral for\nthe loans but not for the bonds that use the loans as collateral.\nThings to remember:\nAsset-backed securities (ABS) give investors a share of the cash flows generated by a pool of\nassets held by a special purpose entity (SPE). The assets held by the SPE serve as collateral\non the ABS. ABS investors have no claim on the assets or cash flow of the loan originator or\nSPE sponsor.\nDescribe securitization, including the parties and the roles they play.\nLOS", "qhtml": null}, {"n": 59, "q": "Historical monthly changes in a country's consumer price index (CPI) have been negatively\ncorrelated with both global equity and global bond returns. To capture the potential benefits\nof these correlations in a diversified portfolio, an investor would most appropriately invest in\nwhich of the following?", "opts": ["Greenfield infrastructure project", "Fixed-income convertible arbitrage", "Broad-based commodity index fund"], "ans": "C", "expl": "Alternative investments refer to investments in nontraditional assets such as commodities,\nreal estate, private equity, and hedge funds. The primary motivation for adding alternative\ninvestments to a traditional portfolio is to improve the risk-reward profile since alternative\nassets generally have relatively low correlations with traditional assets.\nCommodities offer attractive investment opportunities due to historically low\ncorrelations of their returns with traditional assets and for their inflation protection .\nCommodity indexes are viewed as particularly good inflation hedges since commodities\ndirectly (eg, food, energy prices) or indirectly (eg, housing costs) affect the underlying\ncalculation of the inflation indexes [eg, consumer price index (CPI)]. Therefore, commodities\ngenerally have relatively high positive correlations with inflation measures and are considered\none of the best alternatives for capturing and hedging against inflation trends.\n(Choice A) A greenfield investment is an infrastructure investment that has not yet been\nbuilt. Infrastructure projects generally carry considerable project-specific risk and return\nprofiles. Although a direct infrastructure investment may provide diversification benefits, its\nreturn profile is unlikely to be correlated with consumer prices.\n(Choice B) Fixed-income convertible arbitrage attempts to profit from mispricing between\nthe embedded equity option in a convertible bond and the underlying common stock. This\nstrategy relies on capturing short-term, event-driven pricing discrepancies and is unrelated to\nlong-term inflation trends represented in a CPI.\nThings to remember:\nInvestors are attracted to commodities due to their historically low correlations of returns with\ntraditional assets and for their inflation protection. Commodity indexes are viewed as\nparticularly good inflation hedges since commodities directly or indirectly affect the underlying\ncalculation of the inflation indexes [eg, consumer price index (CPI)] and therefore have\nrelatively high positive correlations with inflation measures.\nExplain features of raw land, timberland, and farmland and their investment characteristics\nLOS", "qhtml": null}, {"n": 60, "q": "Which of the following best describes a private equity recapitalization? A private equity firm:", "opts": ["sells a portfolio company to a strategic industry buyer.", "provides mezzanine financing to facilitate a leveraged buyout.", "pays itself a cash dividend by increasing leverage in a portfolio company."], "ans": "C", "expl": "Private equity exit strategies\nTrade sale\nInitial public offering\nSecondary sale\nWrite-off or liquidation\nRecapitalization\nA private equity firm will typically exit its investment in a portfolio company at a higher\nvaluation after improving the company's operational and financial performance. The resulting\ngain is the basis for the private equity firm's return on its investment. Exits of successful\ninvestments can occur through sales to strategic industry buyers (trade sales) or other private\nequity firms (secondary sales) or through initial public offerings.\nA recapitalization transaction is not truly an exit since the private equity firm remains\ninvested, but it provides a cash return to the private equity firm and is often a precursor to an\nexit. In a recapitalization , a private equity fund increases the portfolio company's debt\nburden to finance a cash dividend payout to the private equity firm .\n(Choice A) In a trade sale , a portfolio company is sold to a strategic industry buyer.\n(Choice B) In a leveraged buyout, a private equity firm acquires another business using\nlarge amounts of debt, usually funded by the company being acquired. Mezzanine financing is\nthe riskiest source of debt capital in these transactions.\nThings to remember:\nIn a recapitalization, a private equity fund seeks to maximize its return by increasing a\nportfolio company's debt burden specifically to pay the private equity firm a cash dividend.\nAlthough a recapitalization is not truly an exit since the private equity firm remains invested, it\nis often a precursor to an exit.\nExplain features of private equity and its investment characteristics\nLOS", "qhtml": null}, {"n": 61, "q": "A hedge fund will commit $15 million to a short sale of an exchange-listed stock. The fund\nsells short the maximum number of shares allowable when the margin requirement is 0.4.\nThe relevant information is shown in the table below:\nShare price at initial sale $30\nShare price at repurchase $28\nDividend (paid 8 months after short sale) $1/share\nMargin loan rate 9%\nBroker's deposit rate 4%\nNo interest is paid for the borrowed shares, but there is a short rebate on the sales proceeds.\nIf the fund closes out the position in exactly 1 year, the total percentage return is closest to:", "opts": ["8.3%", "18.3%", "26.7%"], "ans": "B", "expl": "A short sale of a stock happens when the short seller borrows shares , sells them , and\nsubsequently repurchases and returns them to the lender. A short sale is profitable if the\nrepurchase price is lower than the sales price (\"buy low, sell high\" = \"sell high, buy low\"). The\nprofit depends largely on the number of shares that are shorted.\nBorrowing shares represents leverage, so all short sales are margin transactions. The\nmaximum number of shares that can be sold short is a function of the short seller's equity in\nthe transaction. In addition to the difference between the sales and repurchase prices, the\nreturn on a short sale also depends on:\nthe short rebate: interest earned by the short seller on the short sales proceeds and\ncalculated as a function of the investment value and the broker’s deposit rate.\ndividends that are paid on the shares until they are repurchased, which the short seller\nmust pay the lender.\ncommissions and other trading costs subtracted from the proceeds (not a factor in this\nquestion).\nThe calculations for all components of the short sale in this scenario are shown below:\n(Choice A) 8.3% would be the approximate return if the short rebate on the sales proceeds\nis not included.\n(Choice C) 26.7% would be the approximate return if the $1.25 million dividend is not\nsubtracted from the fund's gains.\nThings to remember:\nThe profit from a short sale depends on the number of shares that are shorted, which is a\nfunction of the seller's equity in the transaction. The total return on the short sale is the\ngain/loss on the underlying transaction, plus any interest (\"short rebate\") earned by the seller,\nless the dividends paid on the shares while the short sale is in effect, and less commissions\nand other trading costs.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the\nsecurity price at which the investor would receive a margin call\nLOS", "qhtml": null}, {"n": 62, "q": "A broker concerned with executing a trade in a timely manner and with a high probability of\nexecution would most appropriately use a(n):", "opts": ["limit order.", "market order.", "immediate or cancel order."], "ans": "B", "expl": "Market and limit orders are the two most common instructions for executing a trade.\nA market order instructs an intermediary (eg, broker, dealer) to immediately\nexecute the trade on behalf of a client at the best market price currently available. This\nensures the greatest probability of execution but may not result in the best price for the\nclient (eg, highest price for a seller, lowest price for a buyer).\nA limit order also instructs the intermediary to seek the best price currently available\nbut requires that the limit price or better be achieved .\nIf the price of a limit buy (sell) order is above (below) the specified limit price, the order will\nremain open until the limit price is achieved. Therefore, limit orders may not be executed\nright away or at all. Since market orders seek immediate execution, they often execute\nfaster than limit orders, making them more appropriate for a broker concerned with executing\na trade in a timely manner and with a high probability of execution (Choice A) .\n(Choice C) Immediate or cancel (IOC) orders are a type of validity instruction that refers to\nhow long an intermediary has to fill an order rather than the order's price. An IOC order must\nbe filled upon receipt, in part or in whole, and the order is cancelled immediately if it cannot\nbe filled. This would make an IOC order inappropriate for a broker concerned with a high\nprobability of execution.\nThings to remember:\nMarket orders seek immediate execution at the best price currently available; due to the lack\nof a specified trading price, there is a high probability of execution. In contrast, limit orders\nmust be filled at the limit price or better, so they may not be executed right away or at all.\nCompare market orders with limit orders\nLOS", "qhtml": null}, {"n": 63, "q": "A portfolio manager uses an active management strategy based on only historical and publicly\navailable information and achieves abnormal returns. The manager is trading in a market best\ndescribed as:", "opts": ["weak form efficient.", "semi-strong form efficient.", "strong form efficient."], "ans": "A", "expl": "The efficient market hypothesis (EMH) defines market efficiency based on how quickly and\ncompletely information is reflected in asset prices. If markets are truly efficient,\nthen abnormal returns cannot be achieved on a consistent basis. The EMH defines three\nforms of market efficiency:\nThe weak form assumes that asset prices reflect only historical market data (eg, price\nand volume data). In a weak form efficient market , the market achieves only limited\nefficiency since it reflects limited information (ie, only historical data). An investment\nmanager using active management and all publicly available information could achieve\nabnormal returns to consistently outperform the market.\nThe semi-strong form assumes that asset prices reflect all historical market\ndata plus all publicly available information (eg, financial statement information).\nNew public information is quickly assimilated into prices, so an investment manager\ncannot capitalize on events such as earnings surprises to achieve abnormal returns,\nmaking active management strategies ineffective, without using nonpublic\ninformation (Choice B) .\nThe strong form assumes that asset prices reflect all public information as well as\nmaterial, nonpublic information (ie, information known to management or other\ninsiders). In this case, it is impossible for an investment manager to consistently\noutperform the market even on a short-term basis since asset prices reflect all available\ninformation (Choice C) .\nThings to remember:\nThe efficient market hypothesis (EMH) defines market efficiency based on how quickly and\ncompletely information is reflected in asset prices. The EMH defines three forms of market\nefficiency: weak, semi-strong, and strong. Only in a weak form efficient market can an\ninvestment manager use active management to consistently outperform the market, since the\nmarket achieves only limited efficiency and reflects limited information.\nContrast weak-form, semi-strong-form, and strong-form market efficiency\nLOS", "qhtml": null}, {"n": 64, "q": "Which of the following is the best example of a validity instruction?", "opts": ["\"Trade only if the entire order can be filled.\"", "\"Cancel the order if it cannot be filled immediately.\"", "\"Display part of the order size to the market and hide the other part.\""], "ans": "B", "expl": "Execution instructions vs. validity instructions\nMarket order types Examples\nMarket: order is immediately filled at the best available price\nLimit: order is filled at a threshold price or better\nExecution instructions\nAll-or-none (AON): entire order is filled or canceled\nDay: expires at the end of the trading day\nStop: contingent on a specified price to trigger action\nValidity instructions\nGood-till-canceled (GTC): order is good until canceled\nMarket-on-close (MOC): order filled at the day's closing price\nTraders send various order instructions to intermediaries (eg, brokers, dealers, exchanges) to\nplace trades. These orders can include both execution and validity instructions. Execution\ninstructions define how an order is to be filled, allowing traders to control the price, size,\nvisibility, and conditions of the order.\nValidity instructions refer to when an order can be filled , as well as how long an unfilled\norder should remain open before it expires. For example, day orders are valid only for that\ntrading day, while good-till-canceled (GTC) orders remain open indefinitely until filled or\ncanceled.\nImmediate-or-cancel orders are a type of validity instruction since they define the timing of\nthe trade:\nIf the order cannot be filled instantly , it is canceled immediately.\nIf the order can be filled instantly but only partially, the unfilled portion is immediately\ncanceled.\nFor this reason, in some markets
