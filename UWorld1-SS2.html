<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Which of the following is most consistent with a risk budgeting approach to portfolio\nmanagement?","opts":["Allocating additional funds to managers with the highest risk-adjusted returns","Requiring that a certain percentage of each portfolio be dedicated to hedging strategies","Setting a firm-wide standard deviation target and managing investments toward that goal"],"ans":"C","expl":"Lập ngân sách rủi ro là quá trình phân bổ tài sản hoặc khoản đầu tư vào danh mục đầu tư hoặc một\ncông ty dựa trên các đặc điểm rủi ro cơ bản và mức rủi ro tối đa của công ty.\nLập ngân sách rủi ro có thể sử dụng các thước đo rủi ro một chiều (tức là một yếu tố) hoặc các thước đo rủi ro đa chiều\n(tức là đa yếu tố). Lập ngân sách cho rủi ro một yếu tố thường sử dụng thước đo rủi ro như\nlàm độ lệch chuẩn, beta hoặc giá trị rủi ro (VaR) để hướng dẫn các quyết định trên toàn công ty.\nNhững thước đo này hướng dẫn quản lý trong các quyết định đánh đổi lợi nhuận-rủi ro hàng ngày và giúp xác định\ndự án hoặc tài sản có lợi tức cao nhất trên mỗi đơn vị rủi ro. Công ty có thể chọn\nchấp nhận nhiều rủi ro hơn ngân sách dự kiến bằng cách phòng ngừa rủi ro hoặc sử dụng bảo hiểm nếu điều đó sẽ giúp công ty\ntrong mức chấp nhận rủi ro.\n(Lựa chọn A) Lập ngân sách rủi ro không tập trung vào phân bổ vốn giữa các nhà quản lý mà tập trung vào\nđặc điểm rủi ro của chính tài sản hoặc khoản đầu tư.\n(Lựa chọn B) Lập ngân sách rủi ro không yêu cầu cũng như không yêu cầu cấm phòng ngừa rủi ro. Mặc dù phòng ngừa rủi ro có thể được\nsử dụng để đáp ứng các mục tiêu lập ngân sách rủi ro, việc yêu cầu một mức phòng ngừa rủi ro nhất định không nhất quán\nvới việc lập ngân sách rủi ro.\nNhững điều cần nhớ:\nLập ngân sách rủi ro là quá trình phân bổ mức độ rủi ro được xác định trước cho danh mục đầu tư hoặc công ty\ndựa trên các đặc điểm rủi ro cơ bản của tài sản hoặc khoản đầu tư. Lập ngân sách cho rủi ro một yếu tố\nthường sử dụng thước đo rủi ro như độ lệch chuẩn để hướng dẫn các quyết định.\nMô tả việc lập ngân sách cho rủi ro và vai trò của nó trong quản trị rủi ro\nLOS","qhtml":null},{"n":2,"q":"Which of the following topics is most likely to be voted on during a company's annual general\nmeeting?","opts":["Approving the external auditor","Accepting a merger or acquisition","Amending the rights of a class of shares"],"ans":"A","expl":"Các mục trong chương trình họp chung\nPhê duyệt báo cáo tài chính\nĐánh giá hiệu quả hoạt động của công ty\nĐại hội thường niên (AGM)\nBầu cử giám đốc và kiểm toán viên\nThù lao cho hội đồng quản trị và quản lý\nNhững thay đổi quan trọng trong công ty\nSáp nhập và mua lại\nĐại hội bất thường (EGM)\nBán hoặc tách tài sản doanh nghiệp\nCác công ty thường tổ chức đại hội thường niên cuộc họp (ĐHCĐ) để mang lại cho các cổ đông\ncơ hội biểu quyết các quyết định không chỉ được ủy quyền cho hội đồng quản trị.\nCác mục trong chương trình nghị sự điển hình (và thường định kỳ) cho một ĐHCĐ bao gồm:\nTổng quan về báo cáo tài chính và kết quả hoạt động của công ty\nPhê duyệt báo cáo tài chính đã được kiểm toán (nếu có)\nBầu cử và bãi nhiệm các giám đốc\nThù lao của các giám đốc và giám đốc điều hành\nBổ nhiệm kiểm toán viên bên ngoài\nCơ hội để các cổ đông bày tỏ quan ngại hoặc ý kiến\nMột cuộc họp đại hội bất thường (EGM) được triệu tập bởi một công ty để giải quyết các vấn đề bất thường và\nkịp thời, thường liên quan đến một giao dịch công ty hoặc thay đổi quan trọng của công ty\ncần có sự chấp thuận của cổ đông. Các hạng mục có thể bao gồm việc sáp nhập và mua lại hoặc sửa đổi\nquyền của một loại cổ phần. Nếu thời điểm thích hợp, các nội dung đặc biệt có thể được biểu quyết\ntrong ĐHĐCĐ thường niên; Tuy nhiên, điều này ít có khả năng xảy ra hơn nếu các mục không có tính chất cấp bách hoặc xảy ra\nkhông thường xuyên (Lựa chọn B và C).\nNhững điều cần nhớ:\nCác công ty thường tổ chức đại hội đồng cổ đông thường niên (ĐHCĐ) để tạo cho các cổ đông\ncơ hội bỏ phiếu về các quyết định không chỉ được ủy quyền cho hội đồng quản trị.\nSự chấp thuận của kiểm toán viên bên ngoài là một nội dung điển hình trong chương trình nghị sự ĐHĐCĐ.\nMô tả quản trị doanh nghiệp và cơ chế quản lý mối quan hệ với các bên liên quan và giảm thiểu\nrủi ro liên quan\nLOS","qhtml":null},{"n":3,"q":"An analyst gathers the following information for a company:\nBook value of existing debt ¥150 million\nBook value per share of common stock ¥16\nMarket value of existing debt ¥170 million\nCurrent stock price ¥25\nCommon shares outstanding 10 million\nYTM on existing debt 5%\nRisk-free rate 3%\nExpected market return 12%\nCorporate tax rate 35%\nBased on this information, if the appropriate beta is 1.2, the company's WACC is closest to:","opts":["9.5%","10.4%","11.7%"],"ans":"A","expl":"Chi phí vốn bình quân gia quyền (WACC) là chi phí vốn bình quân gia quyền sau thuế của công ty từ tất cả các nguồn . Các nguồn vốn phổ biến nhất bao gồm vốn sở hữu,\ncổ phiếu ưu đãi và nợ. Trong kịch bản này, không có vốn chủ sở hữu ưu tiên, do đó\nWACC của công ty là chi phí trung bình có trọng số của nợ và vốn cổ phần phổ thông.\nTrọng số của nợ và vốn chủ sở hữu được xác định bằng cách sử dụng giá trị thị trường của vốn chủ sở hữu và nợ để\nxác định tỷ lệ chính xác. Giá trị thị trường được ưu tiên hơn giá trị sổ sách vì WACC được sử dụng để\nxác định khả năng sinh lời của các dự án trong tương lai và giá trị thị trường thể hiện giá trị\nhiện tại nhất trong khi giá trị sổ sách thể hiện chi phí lịch sử.\nChi phí vốn cổ phần phổ thông có thể được xác định bằng các phương pháp khác nhau, dựa trên thông tin\ncó sẵn. Trong trường hợp này, dữ liệu được cung cấp (ví dụ: beta, lãi suất phi rủi ro, lợi nhuận thị trường) đề xuất\nsử dụng mô hình định giá tài sản vốn (CAPM).\nTính toán là:\n(Lựa chọn B) 10,4% là kết quả của việc sử dụng giá trị sổ sách thay vì giá trị thị trường để\nxác định tỷ lệ vốn chủ sở hữu và nợ.\n(Lựa chọn C) 11,7% là do nhân sai số beta trong CAPM với lợi nhuận thị trường\nthay vì nhân với phần bù rủi ro (tức là lợi nhuận thị trường trừ lãi suất phi rủi ro).\nNhững điều cần nhớ:\nChi phí vốn bình quân gia quyền (WACC) của một công ty là chi phí cận biên để huy động thêm\nvốn đầu tư. Chi phí được tính theo tỷ lệ của từng loại vốn mà công ty\nhiện đang sử dụng để hỗ trợ mọi hoạt động kinh doanh của mình. Các trọng số này được áp dụng cho\nchi phí vốn cổ phần và nợ để xác định chi phí vốn tổng thể của công ty.\nTính toán và giải thích chi phí vốn bình quân gia quyền của một công ty\nLOS","qhtml":null},{"n":4,"q":"The general conclusions of the CAPM would most likely be materially affected by","opts":["non-zero transaction costs.","restrictions on short selling.","an inability to borrow at the risk-free rate."],"ans":"B","expl":"Các giả định của CAPM\nCác nhà đầu tư không thích rủi ro, tập trung vào tiện ích và hợp lý\nCác nhà đầu tư có khoảng thời gian một khoảng thời gian Horizon\nNhà đầu tư là người chấp nhận giá\nNhà đầu tư có kỳ vọng đồng nhất (ví dụ: sử dụng\ncác phương pháp và dữ liệu giống hệt nhau để phân tích chứng khoán)\nĐầu tư có thể phân chia vô hạn\nThị trường không có ma sát: không có chi phí giao dịch và thuế,\nkhông có hạn chế về bán khống hoặc vay mượn tại\ntỷ lệ phi rủi ro\nCAPM thiết lập mối quan hệ tuyến tính trực tiếp giữa lợi nhuận dự kiến\ncủa một tài sản và beta của nó, thước đo rủi ro hệ thống. CAPM giả định một mô hình đơn giản hóa của\nthị trường tài chính, không có sự kém hiệu quả về thông tin hoặc hoạt động, giúp hiểu rõ hơn\nmối quan hệ giữa rủi ro hệ thống và lợi nhuận kỳ vọng.\nHầu hết các giả định này có tác động tối thiểu đến kết quả mô hình. Tuy nhiên, các hạn chế\nbán khống có thể làm thiên vị giá tài sản bằng cách hạn chế chênh lệch giá và có thể ảnh hưởng đến các kết quả chính\ncủa CAPM.\n(Lựa chọn A và C) Sự hiện diện của chi phí giao dịch, thuế và các hạn chế trong thế giới thực đối với\nvay ở lãi suất không rủi ro thường không làm thay đổi đáng kể các kết luận cơ bản\ncủa CAPM.\nNhững điều cần nhớ:\nCAPM giả định thị trường không có ma sát, không có chi phí giao dịch hoặc thuế và khả năng\nvay và cho vay với lãi suất không có rủi ro. Mặc dù chi phí giao dịch thực tế và các ràng buộc vay\nkhông ảnh hưởng trọng yếu đến các kết luận cốt lõi của CAPM, nhưng chi phí bán khống và\ncác hạn chế có thể làm lệch giá tài sản, có khả năng ảnh hưởng đến kết quả CAPM.\nGiải thích mô hình định giá tài sản vốn (CAPM), bao gồm các giả định của nó và thị trường chứng khoán\nline (SML)\nLOS","qhtml":null},{"n":5,"q":"An activist shareholder fails to convince a company's management to change strategic\ndirection and initiates a proxy contest. Which of the following company actions would create\nthe most effective barrier against the shareholder's action?","opts":["Initiate a tender offer.","Implement a poison pill.","Stagger the board elections."],"ans":"C","expl":"Chiến lược của nhà đầu tư hoạt động\nNâng cao nhận thức của các cổ đông khác\nĐề xuất các giải pháp\nCuộc chiến ủy quyền\nƯu đãi đấu thầu\nSự tiếp quản thù địch\nVụ kiện phái sinh của cổ đông\nCác cổ đông của nhà hoạt động nắm giữ các vị trí trong các công ty mà họ tin rằng không tối đa hóa\ngiá trị cổ đông. Động lực chính cho những khoản đầu tư này là buộc ban lãnh đạo\ncông ty thực hiện những thay đổi đáng kể nhằm tăng giá cổ phiếu\ncủa công ty. Các chiến lược của các nhà hoạt động khác nhau, từ thuyết phục đến tiếp quản thù địch, và bao gồm:\nGặp ban quản lý\nNâng cao nhận thức của cổ đông về các vấn đề cụ thể\nĐề xuất nghị quyết để cổ đông bỏ phiếu\nCác cuộc thi ủy quyền để bầu ra thành viên hội đồng quản trị mong muốn\nĐề nghị đấu thầu\nCác vụ kiện phái sinh của cổ đông\nCác công ty có thể chống lại các nỗ lực tiếp quản. Trên các hội đồng so le , các giám đốc được chia\nthành các nhóm theo nhiệm kỳ , sao cho chỉ một nhóm được bầu vào một năm nhất định (và các nhóm khác được bầu vào\nnhững năm tiếp theo). Điều này khiến một nhà hoạt động khó thành công hơn trong cuộc chiến ủy nhiệm\nvì cần phải có nhiều cuộc bầu cử hội đồng quản trị trong nhiều năm để đạt được doanh thu\ncần thiết để giành được đa số .\n(Lựa chọn A) Việc chào mua thường do các cổ đông khởi xướng chứ không phải do chính công ty khởi xướng.\n(Lựa chọn B) Một viên thuốc độc sẽ trực tiếp chống lại một lời đề nghị đấu thầu hoặc sự tiếp quản thù địch khác\ncố gắng thông qua việc mua cổ phần và sẽ phòng vệ kém hiệu quả hơn trước một cuộc chiến ủy nhiệm.\nNhững điều cần nhớ:\nMột cổ đông hoạt động nắm giữ một vị trí trong một công ty để gây áp lực buộc ban quản lý công ty phải hành động theo cách thức\nmong muốn của nhà hoạt động. Các chiến lược của nhà hoạt động bao gồm nâng cao nhận thức về các vấn đề cụ thể,\nđề xuất các nghị quyết để cổ đông bỏ phiếu, đấu tranh ủy quyền, chào mua công khai và\ncác vụ kiện phái sinh của cổ đông.\nMô tả quản trị doanh nghiệp và cơ chế quản lý mối quan hệ với các bên liên quan và giảm thiểu\nrủi ro liên quan\nLOS","qhtml":null},{"n":6,"q":"A company has spent $2 million on market research to determine whether to sell or renovate\nan existing building. If the company sells the building, it will receive $500 million today. If\nthe company renovates the building, it will have to invest $100 million immediately. The\ncompany also will have to borrow the $100 million at a 6% annual interest rate. If the\ncompany decides to renovate, the project's initial cash outlay ($ millions ) is closest to:","opts":["600","602","606"],"ans":"A","expl":"Bao gồm trong tiền mặt\nDòng tiền tính bằng triệu đô la\ndòng?\nNghiên cứu thị trường 2 Không, chi phí chìm\nChi phí cơ hội của việc không bán tòa nhà 500 Có, chi phí cơ hội\nChi phí cải tạo 100 Có, đầu tư ban đầu\nChi phí lãi vay 6 Không, chi phí tài chính\nLập ngân sách vốn là quá trình các công ty sử dụng để lựa chọn các dự án vốn\ncó lợi nhuận cao nhất ; dòng tiền dự kiến ​​rất hữu ích cho việc đánh giá từng dự án tiềm năng. Các dự án vốn\nthường liên quan đến khoản chi tiền mặt ban đầu, sau đó là một loạt dòng tiền vào. Ngoài\ndòng tiền vào và dòng tiền ra trực tiếp, chi phí cơ hội cần được xem xét khi ước tính\ndòng tiền của dự án.\nTrong trường hợp này, nếu công ty sử dụng tòa nhà thay vì bán nó, thì ưu đãi bán hàng thể hiện\nchi phí cơ hội. Chi phí này phải được tính vào dòng tiền ròng cho Năm 0 cùng với\nchi phí cải tạo, dẫn đến chi phí tiền mặt ban đầu là 600 triệu USD (500 triệu USD + 100\ntriệu).\n(Lựa chọn B) 602 triệu USD bao gồm nghiên cứu thị trường, một chi phí chìm không liên quan đến các quyết định đầu tư\ntrong tương lai.\n(Lựa chọn C) 606 triệu USD bao gồm chi phí lãi vay. Chi phí tài chính không\nđược bao gồm trong dòng tiền vì chúng được phản ánh ngầm trong tỷ suất lợi nhuận yêu cầu.\nNhững điều cần nhớ:\nTrong lập ngân sách vốn, một số dòng tiền không trực tiếp là một phần của dự án thể hiện\nchi phí cơ hội và nên được đưa vào quyết định đầu tư. Chi phí chìm không\nliên quan đến quyết định đầu tư. Chi phí tài chính không được tính vào dòng tiền vì chúng\nẩn trong tỷ suất lợi nhuận yêu cầu.\nMô tả quá trình phân bổ vốn, tính giá trị hiện tại ròng (NPV), tỷ suất lợi nhuận nội bộ\n(IRR) và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu việc sử dụng chúng trong phân bổ vốn\nLOS","qhtml":null},{"n":7,"q":"Management has set a firm's target capital structure range to consist of 20%–25% debt\nfinancing. If the firm's capital structure has deviated to 18% debt and 82% equity, it most\nlikely indicates that the firm experiences:","opts":["agency costs.","a low interest rate environment.","rising demand for the firm's shares."],"ans":"C","expl":"Cơ cấu vốn của một công ty được xác định bởi tỷ lệ nợ và tài trợ vốn chủ sở hữu,\nđược đo theo giá trị thị trường. Các công ty thường đặt ra một phạm vi cho cấu trúc vốn mục tiêu của họ (ví dụ:\nphạm vi nợ 20%–25%) về mặt lý thuyết sẽ tối đa hóa giá trị công ty mà không sử dụng đòn bẩy tài chính quá mức\n.\nTrên thực tế, cấu trúc vốn mục tiêu thực tế của một công ty có thể nằm ngoài phạm vi mục tiêu do:\nbiến động về giá trị thị trường của nợ và/hoặc vốn chủ sở hữu\nchi phí tài chính cơ hội cho một nguồn vốn cụ thể (ví dụ: lãi suất thấp\nmôi trường)\nchi phí giao dịch cao và yêu cầu quy mô giao dịch tối thiểu cao để có được\nvốn.\nNgoài ra, chi phí đại lý là chi phí cho các vấn đề giữa người đại diện chính và người đại diện giữa các cổ đông và ban quản lý\n. Ban quản lý có toàn quyền quyết định cách sử dụng dòng tiền của công ty và\ncó thể áp dụng các chiến lược mang lại lợi ích cho ban quản lý nhưng gây tổn hại đến tài sản của cổ đông. Chiến lược\nđể giảm chi phí đại diện là phát sinh nhiều nợ hơn và do đó có nhiều nghĩa vụ nợ bắt buộc hơn, điều này sẽ làm giảm quyền quyết định của ban quản lý đối với việc sử dụng dòng tiền.\nTrong câu hỏi này, tỷ lệ nợ trong cơ cấu vốn của công ty đã giảm xuống dưới ngưỡng\ntối thiểu 20% xuống còn 18%. Nhu cầu lớn hơn đối với cổ phiếu của công ty sẽ làm tăng\ngiá cổ phiếu và tăng tỷ lệ vốn chủ sở hữu trong cơ cấu vốn, làm giảm\ntỷ lệ nợ.\n(Lựa chọn A) Chi phí đại diện sẽ khuyến khích công ty sử dụng nợ để kiểm soát các nhà quản lý và để\nkhông có tỷ lệ nợ thấp hơn trong cơ cấu vốn của mình.\n(Lựa chọn B) Công ty sẽ có thể vay nhiều hơn với lãi suất thấp, điều này sẽ\nkhuyến khích tăng tỷ lệ nợ.\nNhững điều cần nhớ:\nCơ cấu vốn thực tế của một công ty có thể lệch ra ngoài phạm vi cơ cấu vốn mục tiêu do\ngiá trị thị trường biến động và chi phí tài chính cơ hội. Chi phí giao dịch cao và\nyêu cầu về quy mô tối thiểu có thể cản trở công ty tái cân bằng cơ cấu vốn của mình. Ngoài ra,\nchi phí đại diện sẽ khuyến khích công ty sử dụng nợ để kiểm soát quyền quyết định của ban quản lý.\nMô tả cấu trúc vốn mục tiêu và tối ưu\nLOS","qhtml":null},{"n":8,"q":"The global minimum-variance portfolio is best described as being:","opts":["unattainable without including a risk-free rate.","the portfolio with the lowest return on the efficient frontier.","the point of tangency between the efficient frontier and the capital allocation line."],"ans":"B","expl":"Đường biên có phương sai tối thiểu là đường chứa tất cả các danh mục đầu tư có phương sai tối thiểu,\nlà những danh mục có rủi ro dự kiến thấp nhất đối với một mức lợi nhuận kỳ vọng nhất định trong\nbộ cơ hội đầu tư. Danh mục đầu tư trên biên giới có phương sai tối thiểu chỉ bao gồm\ncác tài sản rủi ro. Trong số các danh mục đầu tư này, danh mục đầu tư có chênh lệch tối thiểu toàn cầu có\nrủi ro dự kiến ​​thấp nhất .\nĐường giới hạn hiệu quả (tức là đường biên hiệu quả Markowitz, đường màu xanh ở trên) bao gồm tất cả\ndanh mục đầu tư trên đường biên chênh lệch tối thiểu với lợi nhuận lớn hơn hoặc bằng danh mục đầu tư toàn cầu\nphương sai tối thiểu. Mỗi danh mục đầu tư đó đều có lợi nhuận cao nhất với mức độ rủi ro\nnhất định. Tất cả danh mục đầu tư có lợi nhuận thấp hơn đều ở mức dưới mức tối ưu (đường màu đỏ ở trên), nghĩa là mỗi\ncó lợi nhuận thấp hơn danh mục đầu tư thay thế có cùng mức độ rủi ro.\nKhông có danh mục đầu tư nào dưới mức tối ưu là một phần của đường biên hiệu quả, do đó, danh mục đầu tư sai lệch-\ntoàn cầu tối thiểu có lợi tức thấp nhất so với bất kỳ danh mục đầu tư nào trên đường biên hiệu quả .\n(Lựa chọn A) Vì toàn cầu Danh mục đầu tư có phương sai tối thiểu nằm trên biên giới có phương sai tối thiểu\n, trong đó tất cả các danh mục đầu tư chỉ có tài sản rủi ro, có thể đạt được danh mục này mà không cần lãi suất phi rủi ro.\n(Lựa chọn C) Danh mục đầu tư rủi ro tối ưu nằm ở điểm tiếp tuyến giữa\nđường biên hiệu quả và đường phân bổ vốn.\nNhững điều cần nhớ:\nTất cả danh mục đầu tư trên biên giới phương sai tối thiểu với lợi nhuận lớn hơn hoặc bằng danh mục đầu tư toàn cầu\nphương sai tối thiểu bao gồm biên giới hiệu quả Markowitz. Danh mục đầu tư sai lệch-\ntối thiểu toàn cầu có lợi nhuận thấp nhất so với bất kỳ danh mục đầu tư nào trên đường biên hiệu quả.\nMô tả và giải thích đường biên hiệu quả và phương sai tối thiểu của tài sản rủi ro và\ndanh mục đầu tư có đường biên hiệu quả toàn cầu\nLOS","qhtml":null},{"n":9,"q":"Which of the following best describes a behavioral bias resulting from both cognitive and\nemotional errors?","opts":["Endowment bias","Loss-aversion bias","Overconfidence bias"],"ans":"C","expl":"Thành kiến về hành vi ảnh hưởng đến dự báo của nhà phân tích và biện pháp khắc phục\nThành kiến Mô tả Biện pháp khắc phục\nXem lại các dự báo trong quá khứ, đánh giá\nCó niềm tin phi lý vào\nđộ chính xác tương đối\nKhả năng quá tự tin\nÁp dụng phân tích kịch bản\nvà khả năng\nHạn chế số lượng mô hình\nĐánh giá quá cao khả năng của chính mình đối với\nẢo tưởng về khả năng kiểm soát\ncác biến và ý kiến chuyên gia\nkiểm soát độ chính xác của dự báo\nĐánh giá thường xuyên các mô hình bởi\nKhông muốn kết hợp\nnhóm đầu tư\nChủ nghĩa bảo thủ\nthông tin mới (ví dụ: neo)\nMô hình linh hoạt, ít biến số hơn\nPhân loại dữ liệu mới dựa trên về\nĐối với việc bỏ qua tốc độ cơ sở, hãy xem xét\nquá khứ\ncả bên ngoài và bên trong\nTính đại diện\nlượt xem hoặc trải nghiệm (ví dụ: tốc độ cơ sở\nthông tin\nbỏ bê)\nTìm kiếm các quan điểm khác nhau (ví dụ\nChọn dữ liệu xác nhận niềm tin\nXác nhận\ný kiến trung lập hoặc tiêu cực)\nvà loại bỏ dữ liệu xung đột\nLý thuyết tài chính truyền thống cho rằng những người tham gia thị trường tài chính hành động hợp lý khi\nxem xét thông tin có sẵn và do đó tối ưu hóa kết quả mong muốn, thúc đẩy hiệu quả\nthị trường. Tuy nhiên, những thành kiến ​​về hành vi thường dẫn đến việc ra quyết định đầu tư\ndưới mức tối ưu. Các lỗi nhận thức xuất phát từ lý luận sai lầm và có thể được sửa chữa bằng giáo dục\nvà nhận thức, trong khi những thành kiến ​​về cảm xúc xuất phát từ cảm giác hoặc cảm xúc bên trong và khó sửa hơn\nThành kiến ​​tự tin quá mức phát sinh từ sự tự tin quá mức hoặc vô căn cứ vào khả năng của bản thân; nó\nchủ yếu được điều khiển bằng cảm xúc nhưng cũng có một số yếu tố nhận thức. Ví dụ:\nsự tự tin quá cao trong dự đoán dẫn đến khoảng tin cậy quá hẹp (ví dụ: do\nđánh giá thấp phương sai) và\nsự tự tin quá mức chắc chắn là do đánh giá quá cao xác suất.\nTrong những ví dụ này, thành kiến dựa trên cảm xúc (ví dụ: hy vọng) và dẫn đến lý luận sai lầm.\nĐể khắc phục thành kiến tự tin quá mức, các nhà phân tích nên đánh giá một cách thẳng thắn những lý do thực sự\nảnh hưởng đến quyết định đầu tư và phân biệt các quyết định được chứng minh bằng thực tế với những lý do\nthiếu sót có thể dựa trên cảm xúc.\n(Lựa chọn A) Thành kiến về nguồn lực là một thành kiến về mặt cảm xúc trong đó tài sản mà cá nhân sở hữu có nhiều giá trị hơn. Trên thực tế, quyền sở hữu một tài sản \"mang lại\" giá trị quá mức.\n(Lựa chọn B) Thành kiến ​​ác cảm với mất mát là một thành kiến ​​về mặt cảm xúc quy nỗi sợ hãi không cân xứng thành\nnhững tổn thất tiềm tàng, so với mong muốn đạt được lợi ích. Ví dụ: thành kiến này có thể khiến\nnhà đầu tư nắm giữ chứng khoán bị mất để tránh nhận ra lỗ, do đó gặp rủi ro\nkhông cần thiết trong khi bỏ lỡ những lợi ích tiềm năng.\nNhững điều cần nhớ:\nLỗi nhận thức bắt nguồn từ lý luận sai lầm và có thể được giải quyết bằng giáo dục, trong khi\nthành kiến về cảm xúc—gây ra bởi cảm giác hoặc cảm xúc bên trong dẫn đến phi lý sự thôi thúc và\ntrực giác không được hỗ trợ—khó sửa hơn. Một số thành kiến, chẳng hạn như quá tự tin, có cả\nyếu tố nhận thức và cảm xúc.\nSo sánh và đối chiếu các lỗi nhận thức và thành kiến ​​cảm xúc\nLOS","qhtml":null},{"n":10,"q":"According to the Modigliani-Miller propositions (with taxes), if a company increases its debt\nlevel, its market value will most likely :","opts":["decrease since the costs of financial distress are increasing.","remain the same since the market value is unaffected by the capital structure.","increase proportionally to the change in debt."],"ans":"C","expl":"Các đề xuất của Modigliani-Miller (MM) giả định thị trường vốn hoàn hảo (nghĩa là không có chênh lệch giá, không có\nchi phí giao dịch hoặc phá sản và thông tin đối xứng) và khẳng định rằng giá trị thị trường\ncủa một công ty bằng với giá trị hiện tại của dòng tiền trong tương lai. Modigliani và Miller đề xuất\nrằng, trong trường hợp không có thuế :\nCơ cấu vốn của một công ty không ảnh hưởng đến giá trị của nó (MM I không có thuế); và\nChi phí vốn cổ phần của một công ty ( r ) tỷ lệ thuận với tỷ lệ nợ trên vốn chủ sở hữu ( D/E ),\ne\nnhưng WACC không đổi (MM II không có thuế).\nTuy nhiên, những đề xuất này thay đổi khi có thuế doanh nghiệp :\nGiá trị thị trường của một công ty có vay nợ lớn hơn giá trị của một công ty không có nợ vay nhưng\ncông ty giống hệt nhau; các khoản thanh toán lãi được miễn thuế cải thiện dòng tiền của công ty có vốn vay\n, tăng giá trị của nó. Sự khác biệt về giá trị là lượng\nlá chắn thuế nợ ( tD ), là tích của thuế suất ( t ) của công ty và giá trị của\nnợ ( D ) (MM I có thuế).\nR của một công ty tỷ lệ thuận với D/E , được điều chỉnh bởi (1 − t ) . Đòn bẩy lớn hơn\ne\nsẽ làm tăng chi phí vốn cổ phần, nhưng với tốc độ chậm hơn do thuế. Tỷ lệ thuế\n ( t ), mức tăng r càng chậm khi D/E tăng (MM II có thuế).\ne\nDo đó, với thuế, nợ tăng sẽ làm tăng giá trị của công ty theo tỷ lệ và\ngiảm WACC của nó.\n(Lựa chọn A) Đề xuất MM giả định không có chi phí kiệt quệ tài chính.\n(Lựa chọn B) Giá trị thị trường sẽ giữ nguyên trong trường hợp không có thuế.\nNhững điều cần nhớ:\nCác mệnh đề của Modigliani-Miller (MM) giả định thị trường vốn hoàn hảo (nghĩa là không có chênh lệch giá, không có\nchi phí giao dịch hoặc phá sản và thông tin đối xứng). Khi các mệnh đề này\nbao gồm thuế doanh nghiệp, đòn bẩy lớn hơn sẽ làm tăng giá trị thị trường của công ty (MM I) và\ngiảm WACC (MM II).\nGiải thích các mệnh đề Modigliani–Miller liên quan đến cấu trúc vốn\nLOS","qhtml":null},{"n":11,"q":"Which of the following is the best example of a stakeholder mechanism to improve corporate\ngovernance?","opts":["A company adopting staggered board elections","Consumers using social media to complain about a CEO's decision","The board of directors forming an ad hoc committee to restructure the company's bonds"],"ans":"B","expl":"Cơ chế quản trị doanh nghiệp\nCác bên liên quan Cơ chế được sử dụng để cải thiện quản trị\nBáo cáo thường niên\nTất cả các bên liên quan Tài chính báo cáo\nĐại hội thường niên/bất thường\nThâu tóm\nCổ đông\nHoạt động\nKiện tụng\nKhế ước trái phiếu\nChủ nợ\nỦy ban chủ nợ\nKiểm toán ủy ban\nHội đồng quản trị và quản lý Ủy ban thù lao\nLiên đoàn lao động\nNhân viên\nKế hoạch sở hữu cổ phiếu của nhân viên (ESOP)\nThỏa thuận hợp đồng\nKhách hàng và nhà cung cấp Sử dụng mạng xã hội để gây ảnh hưởng đến công ty\nLuật và quy định\nChính phủ/cơ quan quản lý\nCác quy tắc và tiêu chuẩn quản trị doanh nghiệp\nQuản trị doanh nghiệp liên quan đến việc điều chỉnh lợi ích của các bên liên quan khác nhau cũng như\nthực thi việc tuân thủ các quy tắc và quy định bên ngoài. Các cơ chế quản trị chung\nbao gồm các cơ chế được sử dụng bởi các cổ đông (ví dụ: các cuộc họp chung) và hội đồng quản trị, cũng như\ncủa các bên liên quan khác như chủ nợ, nhân viên và khách hàng.\nKhách hàng và nhà cung cấp sử dụng hợp đồng để chi phối mối quan hệ của họ với công ty,\nthiết lập các điều khoản thanh toán, phương thức giao hàng, quyền và trách nhiệm. Khách hàng cũng\nsử dụng mạng xã hội để công khai và nâng cao lợi ích của họ cũng như cạnh tranh với ban quản lý\nđể gây ảnh hưởng đến dư luận. Do đó, quản trị doanh nghiệp được cải thiện bằng cách điều chỉnh tốt hơn với\nlợi ích của khách hàng.\n(Lựa chọn A) Một hội đồng quản trị so le (ví dụ: hội đồng quản trị gồm chín thành viên thay thế ba giám đốc mỗi\nnăm) sẽ ngăn chặn sự thay đổi đa số trong hội đồng trong một cuộc bầu cử duy nhất, làm suy yếu quyền lực\ncủa các cuộc bầu cử hội đồng quản trị như một cơ chế nâng cao lợi ích của các nhà hoạt động cổ đông.\n(Lựa chọn C) Một ủy ban đặc biệt gồm các trái chủ có thể thành lập để đề xuất tái cơ cấu trái phiếu của một công ty, thường là khi nhà phát hành gặp khó khăn trong việc đáp ứng các nghĩa vụ của mình, để\nđiều chỉnh tốt hơn việc quản trị phù hợp với lợi ích của chủ nợ. Một ủy ban như vậy sẽ không được thành lập bởi\nhội đồng quản trị.\nNhững điều cần nhớ:\nQuản trị doanh nghiệp bao gồm các cơ chế được nhiều bên liên quan khác nhau sử dụng, bao gồm chủ nợ,\nnhân viên và khách hàng, để điều chỉnh lợi ích của họ với lợi ích của cổ đông và ban quản lý\n. Khách hàng có thể sử dụng mạng xã hội để công khai và nâng cao lợi ích của mình.\nMô tả quản trị doanh nghiệp và cơ chế quản lý mối quan hệ với các bên liên quan cũng như giảm thiểu\nrủi ro liên quan\nLOS","qhtml":null},{"n":12,"q":"An analyst gathers the following information on three stocks:\nExpected\nStock Standard Beta\nDeviation\nA 20% 1.3\nB 13% 0.8\nC 31% −0.3\nThe market's expected return is 12%. Based on the CAPM, if the risk-free rate is 2%, then\nthe stock with an expected return greater than the market's expected return is most likely :","opts":["Stock A.","Stock B.","Stock C."],"ans":"A","expl":"Theo CAPM, lợi nhuận kỳ vọng của một tài sản là hàm số của độ nhạy cảm của nó\nđối với rủi ro hệ thống được đo bằng beta , phí bảo hiểm rủi ro thị trường và lãi suất phi rủi ro .\nPhiên bản beta của thị trường luôn bằng 1,0. Nếu beta của một chứng khoán lớn hơn 1.0 thì chứng khoán đó\ncó nhiều rủi ro hệ thống hơn và lợi nhuận kỳ vọng cao hơn thị trường.\nTrong trường hợp này, beta của Cổ phiếu A (1.3) lớn hơn beta thị trường (1.0), do đó Cổ phiếu A có\nlợi nhuận kỳ vọng lớn hơn lợi nhuận kỳ vọng của thị trường (Lựa chọn B và C) . Ngoài ra,\nlợi nhuận kỳ vọng của chứng khoán có thể được tính toán bằng cách sử dụng CAPM và sau đó so sánh với\nlợi nhuận của thị trường. Lợi nhuận kỳ vọng 15% của Cổ phiếu A lớn hơn lợi nhuận dự kiến\n12% của thị trường.\nNhững điều cần nhớ:\nTheo CAPM, lợi nhuận kỳ vọng của một tài sản là hàm số độ nhạy của nó đối với rủi ro hệ thống\n, phần bù rủi ro thị trường và lãi suất phi rủi ro. Beta của thị trường luôn bằng\n1.0. Nếu beta của một chứng khoán lớn hơn 1,0 thì chứng khoán đó có nhiều rủi ro\nhệ thống hơn và lợi nhuận kỳ vọng cao hơn thị trường.\nTính toán và giải thích lợi tức kỳ vọng của một tài sản bằng cách sử dụng CAPM\nLOS","qhtml":"<p>An analyst gathers the following information on three stocks:</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>Standard Deviation</th><th>Beta</th></tr></thead><tbody><tr><td>A</td><td>20%</td><td>1.3</td></tr><tr><td>B</td><td>13%</td><td>0.8</td></tr><tr><td>C</td><td>31%</td><td>−0.3</td></tr></tbody></table><p>The market's expected return is 12%. Based on the CAPM, if the risk-free rate is 2%, then the stock with an expected return greater than the market's expected return is most likely:</p>"},{"n":13,"q":"All else equal, which of the following types of businesses would most likely benefit from one-\nsided network effects?","opts":["Ridesharing","Social networks","Payment processing"],"ans":"B","expl":"Mô hình kinh doanh giúp các nhà đầu tư hiểu được chiến lược, thị trường mục tiêu, chuỗi cung ứng\n, rủi ro và các đặc điểm khác của công ty. Nhiều công ty vận hành mô hình kinh doanh\nthông thường đã được thử nghiệm bởi các công ty ngang hàng hoặc trong các ngành tương tự.\nHiệu ứng mạng là sự tăng trưởng theo cấp số nhân về giá trị dịch vụ của công ty dựa trên\nkhi số lượng người dùng tăng lên. Nó có thể là một phần quan trọng trong mô hình\nkinh doanh của công ty.\nHiệu ứng mạng một phía có một loại người dùng và giá trị của mạng (đối với mỗi\nngười dùng) tăng lên khi có nhiều người dùng được thêm vào (ví dụ: nền tảng mạng xã hội).\nHiệu ứng mạng đa phía có nhiều loại người dùng và giá trị của mạng (đối với\nmỗi người dùng) là tăng lên bằng cách thêm tất cả các loại người dùng.\n(Lựa chọn A) Việc chia sẻ xe được hưởng lợi từ hiệu ứng mạng đa chiều. Khi có nhiều tài xế sử dụng dịch vụ\n, dịch vụ này sẽ trở nên có giá trị hơn đối với người tiêu dùng và khi có nhiều người tiêu dùng sử dụng dịch vụ hơn, dịch vụ này\nsẽ trở nên có giá trị hơn đối với tài xế.\n(Lựa chọn C) Bộ xử lý thanh toán được hưởng lợi từ hiệu ứng mạng nhiều mặt. Khi càng nhiều nhà bán lẻ\nchấp nhận hình thức thanh toán, giá trị của mạng sẽ tăng lên đối với người tiêu dùng và khi càng nhiều\nngười tiêu dùng sử dụng mạng thì giá trị của mạng đối với các nhà bán lẻ cũng tăng lên.\nNhững điều cần nhớ:\nHiệu ứng mạng là sự tăng trưởng theo cấp số nhân về giá trị dịch vụ của công ty dựa trên sự\nsố lượng người dùng tăng lên. Hiệu ứng mạng một phía có một loại người dùng, trong khi\nhiệu ứng mạng nhiều phía có nhiều loại người dùng.\nMô tả các loại mô hình kinh doanh khác nhau\nLOS","qhtml":null},{"n":14,"q":"According to pecking order theory, the relative attractiveness of different sources of capital\nis most likely based on:","opts":["agency costs.","priority of claims.","information asymmetries."],"ans":"C","expl":"Lý thuyết trật tự phân hạng đề xuất rằng việc công bố thông tin bắt buộc sẽ quyết định\nsự hấp dẫn tương đối của các nguồn vốn khác nhau . Ban quản lý muốn\ntạo vốn:\n1. trong nội bộ, vì điều đó đòi hỏi ít tiết lộ thông tin nhất cho nhà đầu tư\nthay vì\n2. ra bên ngoài, vì điều đó đòi hỏi lượng thông tin được tiết lộ nhiều hơn cho các nhà đầu tư.\nLý thuyết này phản ánh giả định rằng\nban quản lý công ty có cả thông tin công khai và không công khai, trong khi\nnhà đầu tư chỉ có thông tin công khai và do đó các quyết định cấp vốn đều chứa đựng các tín hiệu.\nVí dụ: một công ty muốn phát hành cổ phiếu khi họ tin rằng cổ phiếu được định giá quá cao,\nvốn chủ sở hữu đưa ra các tín hiệu cho thấy ban quản lý tin rằng cổ phiếu được định giá quá cao. Vì ban quản lý\ncó nhiều kiến ​​thức hơn về triển vọng của công ty nên việc chào bán cổ phần sẽ tiết lộ\nthông tin về giá trị cổ phiếu cho các nhà đầu tư.\nCác nguồn tài trợ cho hoạt động của công ty quyết định cơ cấu vốn của công ty. Nhiều\ncông ty có cơ cấu vốn mục tiêu dựa trên các mục tiêu/mục tiêu dài hạn (ví dụ:\ngiảm thiểu WACC, xếp hạng tín dụng mong muốn). Tuy nhiên, nhiều yếu tố khác nhau như sự bất cân xứng về thông tin\ncũng có thể ảnh hưởng đến quyết định cấp vốn và dẫn đến cấu trúc vốn khác với\nmục tiêu.\n(Lựa chọn A) Chi phí đại diện do người ủy quyền (ví dụ: cổ đông) phải gánh chịu để giám sát hành động\ncủa các bên đóng vai trò là đại diện của người ủy quyền (ví dụ: người quản lý công ty) do xung đột lợi ích\ncó thể xảy ra. Chi phí đại diện không ảnh hưởng đến lý thuyết trật tự phân hạng.\n(Lựa chọn B) Mức độ ưu tiên của các yêu cầu bồi thường, mức độ thâm niên tương đối hoặc mức độ phụ thuộc của các yêu cầu bồi thường của chủ nợ\nvà các cổ đông, dựa trên luật hợp đồng và hệ thống pháp luật, không dựa trên lý thuyết trật tự phân hạng.\nNhững điều cần nhớ:\nLý thuyết trật tự phân hạng dựa trên giả định rằng ban quản lý có nhiều thông tin hơn\nhơn các nhà đầu tư về hiệu quả hoạt động trong tương lai và việc huy động vốn sẽ tiết lộ thông tin.\nNhững tiết lộ như vậy có thể ảnh hưởng đến lựa chọn tài trợ ưu tiên của ban quản lý.\nGiải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí vốn bình quân gia quyền\nLOS","qhtml":null},{"n":15,"q":"An argument supporting a dual-class structure of common equity is most likely that compared\nto single-class structures, dual-class structures better:","opts":["align voting power with economic ownership.","promote stability and long-term strategic investments.","remove conflicts of interest between noncontrolling shareholders and management."],"ans":"B","expl":"Cấu trúc cổ phiếu chung cho các công ty đại chúng là cấu trúc một lớp, trong đó mỗi\ncổ phiếu cấp cho người nắm giữ một phiếu bầu để mỗi cổ đông có quyền biểu quyết theo tỷ lệ\ndựa trên quyền lực về số lượng cổ phiếu nắm giữ (ví dụ: một cổ đông sở hữu 5% công ty\nkiểm soát 5% số phiếu bầu). Các công ty khác có cấu trúc hai lớp, với nhiều lớp\ncho phép số lượng phiếu bầu khác nhau trên mỗi cổ phiếu (ví dụ: Lớp A có một phiếu bầu trên mỗi cổ phiếu,\ntrong khi Lớp B có năm phiếu bầu trên mỗi cổ phiếu).\nNhững người ủng hộ cấu trúc hai lớp cho rằng chúng mang lại sự ổn định hơn vì người sáng lập và\nngười trong cuộc có thể duy trì quyền kiểm soát tốt hơn khi đối mặt với hoạt động tích cực hoặc nỗ lực tiếp quản. Ngoài ra,\ncác cổ đông và người quản lý được chọn của họ được cách ly khi quyền biểu quyết được kiểm soát, do đó\ncông ty có thể tập trung vào các khoản đầu tư chiến lược dài hạn thay vì kết quả tài chính ngắn hạn.\nSau khi được tạo, cấu trúc hai lớp rất khó bị phá bỏ.\n(Lựa chọn A) Cấu trúc hai lớp tách quyền biểu quyết khỏi quyền sở hữu kinh tế vì\nchủ sở hữu của lớp có nhiều hơn phiếu bầu (thường là người sáng lập hoặc người trong nội bộ) có quyền biểu quyết\nkhông tương xứng với quyền sở hữu cổ phần của họ.\n(Lựa chọn C) Những người chỉ trích cấu trúc hai lớp cho rằng chúng có thể tạo ra xung đột lợi ích\ngiữa các giám đốc điều hành công ty và các cổ đông không kiểm soát, những người thiếu quyền biểu quyết để\nthực thi các ưu tiên của họ khi các giám đốc điều hành—do người trong cuộc lựa chọn—có các mục tiêu khác nhau.\nNhững điều cần nhớ:\nCấu trúc cổ phần hai cấp tách biệt quyền biểu quyết khỏi quyền sở hữu kinh tế vì chủ sở hữu của\nnhóm có nhiều phiếu bầu hơn có quyền biểu quyết không tương xứng với số cổ phần của họ.\nNhững người ủng hộ cấu trúc hai cấp cho rằng chúng mang lại sự ổn định hơn và cho phép\ncác công ty tập trung vào đầu tư chiến lược dài hạn.\nMô tả mối quan hệ giữa người ủy quyền và người đại diện và những xung đột có thể nảy sinh giữa các nhóm bên liên quan\nLOS","qhtml":null},{"n":16,"q":"In an individual investor's investment policy statement, which of the following is least\nlikely characterized as a client objective?","opts":["Having a 35-year time horizon to retirement","Setting a minimum return above a benchmark","Identifying the largest acceptable loss per year"],"ans":"A","expl":"Lập kế hoạch danh mục đầu tư: mục tiêu và hạn chế\nMục tiêu Các ràng buộc\nMục tiêu rủi ro và lợi nhuận Các yếu tố hạn chế\nMục tiêu rủi ro xác định khoản đầu tư sẵn có\nsố lượng tùy chọn lợi nhuận có thể đạt được\nĐịa chỉ mục tiêu rủi ro: Nội bộ (ví dụ: thanh khoản\nKhả năng chấp nhận nhu cầu rủi ro, khoảng thời gian)\nSẵn sàng chấp nhận rủi ro Bên ngoài (ví dụ: pháp lý\nhạn chế)\nHầu hết các tuyên bố chính sách đầu tư (IPS) đều chứa các mục tiêu và ràng buộc\ncủa khách hàng. Mục tiêu giải quyết các mục tiêu về mức độ chấp nhận rủi ro và lợi nhuận; các ràng buộc mô tả các giới hạn\nđối với các loại hình đầu tư mà người quản lý có thể sử dụng để đạt được mục tiêu.\nMột hạn chế đầu tư phổ biến đối với một cá nhân là tuổi nghỉ hưu, xác định\nkhoảng thời gian cho các mục tiêu của khách hàng. Bất kể mục tiêu của khách hàng là gì, khoảng thời gian\nnghỉ hưu là 35 năm cho biết các lựa chọn đầu tư có thể phù hợp với\nkhách hàng đó.\nMục tiêu có thể được nêu dưới dạng tuyệt đối hoặc tương đối. Ví dụ: mục tiêu lợi nhuận tương đối\n nêu rõ tiêu chuẩn lợi nhuận tối thiểu mà danh mục đầu tư phải đạt được (Choice\nB) . Khi mô tả rủi ro của khách hàng, mục tiêu rủi ro tuyệt đối có thể được biểu thị dưới dạng\nphần trăm tổn thất tối đa đối với danh mục đầu tư trong một khoảng thời gian (Lựa chọn C).\nNhững điều cần nhớ:\nTrong tuyên bố chính sách đầu tư, mục tiêu của khách hàng chỉ đề cập đến các yêu cầu về rủi ro và lợi nhuận\ncủa khách hàng. Các ràng buộc có thể bao gồm khoảng thời gian của khách hàng, trạng thái thuế, sở thích và\nnhu cầu thanh khoản.\nMô tả các mục tiêu rủi ro và lợi nhuận cũng như cách chúng có thể được phát triển cho khách hàng\nLOS","qhtml":null},{"n":17,"q":"An investor constructs a mean-variance graph. For the investor's unique risk tolerance, the\ninvestor's optimal portfolio is most likely displayed as:","opts":["Point X","Point Y","Point Z"],"ans":"A","expl":"Danh mục đầu tư tối ưu\nDòng phân bổ vốn [P, CAL(P)] chứa các danh mục đầu tư tốt nhất có thể dành cho mọi nhà đầu tư\n. Mỗi danh mục đầu tư là sự kết hợp tuyến tính giữa tài sản phi rủi ro và danh mục đầu tư\nrủi ro tối ưu cho một mức độ rủi ro khác nhau. Việc lựa chọn cuối cùng danh mục đầu tư tối ưu của nhà đầu tư\nphụ thuộc vào sở thích rủi ro (tức là mức độ chấp nhận rủi ro) của nhà đầu tư đó.\nƯu tiên rủi ro của nhà đầu tư được mô tả bằng đồ họa bằng một đường cong bàng quan. Danh mục đầu tư\ntối ưu của nhà đầu tư là nơi CAL tiếp xúc với đường bàng quan\ncủa nhà đầu tư cá nhân. Do đó, các nhà đầu tư khác nhau sẽ có danh mục đầu tư tối ưu khác nhau tùy thuộc vào\nđường bàng quan cá nhân của họ . Danh mục đầu tư tối ưu cho nhà đầu tư này là Điểm X .\nĐiểm Z thể hiện danh mục đầu tư rủi ro tối ưu, điểm mà tại đó CAL tiếp xúc với\nđường biên hiệu quả. Mặc dù Điểm Z nằm trên CAL( P ) và đường biên hiệu quả, khả năng chấp nhận rủi ro\ncủa nhà đầu tư này cho thấy họ không sẵn sàng chấp nhận rủi ro cần thiết để đạt được hồ sơ lợi nhuận\ncủa Điểm Z. Danh mục đầu tư tối ưu của một nhà đầu tư cá nhân phụ thuộc vào\nđường bàng quan (Lựa chọn C) của nhà đầu tư đó.\n(Lựa chọn B) Điểm Y đại diện cho phương sai tối thiểu toàn cầu danh mục đầu tư. Biên giới hiệu quả\nchi phối tập hợp danh mục đầu tư trên danh mục đầu tư có phương sai tối thiểu toàn cầu được ưu tiên\nso với tập hợp danh mục đầu tư bên dưới. Điểm Y sẽ không hiệu quả đối với nhà đầu tư này.\nNhững điều cần nhớ:\nDanh mục đầu tư tối ưu của nhà đầu tư là sự kết hợp giữa tài sản không rủi ro và danh mục đầu tư rủi ro trên\nđường phân bổ vốn (CAL). Việc lựa chọn danh mục đầu tư tối ưu phụ thuộc vào sở thích\nrủi ro của nhà đầu tư được thể hiện bằng đường bàng quan. Danh mục đầu tư tối ưu được mô tả là điểm\ntrong đó CAL tiếp xúc với đường bàng quan của nhà đầu tư.\nMô tả ý nghĩa của việc kết hợp tài sản không rủi ro với danh mục tài sản rủi ro\nLOS","qhtml":"<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2wAAAIcCAIAAAAFW7pzAABeX0lEQVR42u3df3zbd3nv/XdI2yRNG0fuuZMmp4kTuS2lJY2ZzFk3wpxu0g2jgXqAzChsMYNJMGC3Ntgkum7HY/yQ9uOB4RSoxXZw4dCCVZgz0g6wOtI1Hd2NdXAaWqCN1TTpSZpsjeyGNEnbNOePK/7wjWTJv23Jfj3/yMP+Wv5K+kp2Ll/X57o+i86ePSsAAABgIl7BJQAAAABBJAAAAAgiAQAAQBAJAAAAgkgAAAAQRAIAAAAEkQAAACCIBAAAAEEkAAAACCIBAABAEAkAAAAQRAIAAIAgEgAAAASRs2fr1q1bt27ltQcAACCIBAAAwOy5YKE94d7e3gceeMA+kNTa2sqbAAAAYKIWnT17Vguslm1BZEtLi6Rdu3bxJgAAABDlbAAAAIhM5HTZv3+/pI0bN3oPPvnkkxs2bOB9AAAAINZEjqqjo2PUg93d3bwPAAAARDkbAAAAopw9dUNDQ1a2Hh4e9h6vq6uzMvfKlSt5NwAAAIhMpM6f7DM8PFwUQVpM2dvba+N+AAAAQBAJAAAAVUs5O5v t of common equity 9.0%\nPretax cost of debt 5.0%\nTax rate 20%\nIf the company has only common equity and debt in its capital structure, the company's\nweighted average cost of capital (WACC) is closest to:","opts":["7.75%","8.00%","8.20%"],"ans":"B","expl":"Chi phí vốn bình quân gia quyền (WACC) của một công ty là chi phí biên để huy động\nvốn bổ sung. Nếu mỗi nguồn vốn có chi phí vốn thành phần khác nhau thì WACC là\ntrung bình có trọng số của các chi phí vốn này . Chi phí được tính toán\ntheo tỷ lệ vốn mà công ty hiện đang sử dụng để hỗ trợ tất cả các hoạt động kinh doanh của mình.\nTrong câu hỏi này, để tính WACC, trọng số của nợ và vốn chủ sở hữu phải được tính từ\ntỷ lệ nợ trên vốn chủ sở hữu (D/E) của công ty. Tỷ lệ D/E của công ty là 25% có nghĩa là công ty có\n$0,25 nợ cho mỗi $1,00 vốn chủ sở hữu, hoặc 25% nợ nhiều hơn vốn chủ sở hữu. Trọng số có thể được\nđược suy ra như sau:\nLưu ý: Vì tỷ lệ nợ và vốn chủ sở hữu phải bằng 100% nên trọng số vốn chủ sở hữu\nlà 80% = 100% − 20%.\nĐể tính WACC, chi phí vốn thành phần của công ty được nhân với trọng số của chúng.\nĐể tính toán WACC chi phí nợ sau thuế, hãy đảm bảo áp dụng thuế suất của công ty:\nWACC = [(0,20) (0,05 × (1 − 0,20))] + [(0,80) (0,09)]\nWACC = 8,00%\n(Lựa chọn A) 7,75% là kết quả của việc diễn giải sai dữ liệu của công ty Tỷ lệ D/E là 25% so với\ncó nghĩa là 25%, thay vì 20%, trong cơ cấu chi phí của công ty là nợ.\n(Lựa chọn C) 8,20% là kết quả của việc sử dụng chi phí nợ trước thuế của công ty, thay vì sau thuế.\nnợ.\nNhững điều cần nhớ:\nA Chi phí vốn bình quân gia quyền (WACC) của công ty là chi phí cận biên để huy động vốn\nthêm. WACC là tổng chi phí của từng thành phần vốn được tính theo tỷ trọng của nó trong\ncơ cấu vốn tổng thể.\nTính toán và diễn giải chi phí vốn bình quân gia quyền của một công ty\nLOS","qhtml":null},{"n":19,"q":"A two-asset portfolio has the following characteristics:\nExpected Security's\nSecurity Standard Portfolio\nDeviation Weight\nStock A 9% 80%\nStock B 10% 20%\nIf the correlation coefficient of returns between the two securities is 0.6, then the portfolio's\nexpected variance is closest to:","opts":["0.0073","0.0085","0.0855"],"ans":"A","expl":"Phương sai lợi nhuận của danh mục đầu tư ( σp2 ) là thước đo rủi ro . Trong danh mục đầu tư hai tài sản,\nphương sai danh mục đầu tư là hàm số của trọng số (tức là tỷ lệ của tổng vốn) và\nrủi ro ( σx2 ) của từng tài sản cũng như hệ số tương quan ρab ) giữa lợi nhuận của\ntài sản. Phương sai danh mục đầu tư thể hiện mức độ phân tán lợi nhuận\ncủa danh mục đầu tư xung quanh giá trị trung bình của nó. Độ phân tán càng lớn thì rủi ro danh mục đầu tư càng cao.\nTrong ví dụ này, phương sai của danh mục đầu tư là 0,0073.\n(Lựa chọn B) 0,0085 là kết quả của việc sử dụng phương sai kỳ vọng trung bình có trọng số trong công thức\n. Điều này bỏ qua tác động của mối tương quan giữa lợi nhuận của hai tài sản.\n(Lựa chọn C) 0,0855 là độ lệch chuẩn dự kiến ​​của danh mục đầu tư (tức là căn bậc hai của\nphương sai kỳ vọng).\nNhững điều cần nhớ:\nPhương sai lợi nhuận của danh mục đầu tư là thước đo rủi ro. Trong danh mục đầu tư hai tài sản, phương sai\ndanh mục đầu tư là một hàm của trọng số và rủi ro của từng tài sản cũng như mối tương quan giữa các tài sản\n. Phương sai biểu thị mức độ phân tán lợi nhuận của danh mục đầu tư xung quanh\ntrung bình của nó.\nTính toán và giải thích giá trị trung bình, phương sai và hiệp phương sai (hoặc tương quan) của lợi nhuận tài sản dựa trên\ndựa trên dữ liệu lịch sử\nLOS","qhtml":"<p>A two-asset portfolio has the following characteristics:</p><table class=\"qtable\"><thead><tr><th>Security</th><th>Standard Deviation</th><th>Portfolio Weight</th></tr></thead><tbody><tr><td>Stock A</td><td>9%</td><td>80%</td></tr><tr><td>Stock B</td><td>10%</td><td>20%</td></tr></tbody></table><p>If the correlation coefficient of returns between the two securities is 0.6, then the portfolio's expected variance is closest to:</p>"},{"n":20,"q":"When evaluating mutually exclusive projects, the IRR most likely :","opts":["is appropriate for a project with nonconventional cash flows.","does not provide context regarding the scale of the investment options.","provides realistic reinvestment assumptions for projects with conventional cash flows."],"ans":"B","expl":"Các vấn đề khi sử dụng tỷ suất hoàn vốn nội bộ (IRR) để đánh giá dự án vốn\nCó khả năng tồn tại nhiều IRR khi dòng tiền trong tương lai\nIRR đa dạng\ntiêu cực (ví dụ: mở rộng dự án ban đầu)\nCó thể không tồn tại IRR: không có lãi suất chiết khấu dẫn đến giá trị ròng bằng 0\nKhông có IRR\ngiá trị hiện tại (NPV)\nMột dự án có NPV nhỏ có thể có IRR cao và một dự án có IRR thấp\nTỷ lệ tương đối\ncó thể có NPV lớn\nTái đầu tư không thực tế\nKhó có khả năng các công ty có lãi suất vượt rào cao có thể tái đầu tư ở mức lãi suất đó\ngiả định\nGiá trị hiện tại ròng (NPV) và tỷ suất hoàn vốn nội bộ (IRR) là những phương pháp phổ biến nhất được sử dụng\nđể xác định khả năng sinh lời của dự án trong các quyết định lập ngân sách vốn. Nguyên tắc chung là để\nchấp nhận một dự án nếu:\nNPV của dự án dương hoặc\nIRR của dự án lớn hơn tỷ suất lợi nhuận yêu cầu của công ty.\nIRR của dự án là tỷ lệ chiết khấu duy nhất tương đương với giá trị hiện tại của tiền mặt dự kiến\nchảy vào khoản đầu tư ban đầu, dẫn đến NPV bằng 0.\nNếu các dự án loại trừ lẫn nhau thì quyết định theo đuổi một dự án sẽ loại trừ việc đầu tư vào\nnhững người khác. Trong những trường hợp như vậy, một vấn đề xếp hạng (ví dụ: một dự án có IRR cao hơn nhưng nhỏ hơn\nNPV hơn cái khác) có thể tồn tại.\nVì IRR không cung cấp bối cảnh liên quan đến quy mô (tức là lượng giá trị tiền tệ\nthêm) các lựa chọn đầu tư, cách thực hành tốt nhất là công ty có thể tối đa hóa lợi nhuận cũng như\nđược đo bằng NPV của dự án. Ví dụ: một dự án có thể tạo ra IRR là 20% và NPV là 1 USD\ntriệu USD, nhưng một dự án thay thế tạo ra IRR 16% và NPV là 3 triệu USD sẽ bổ sung thêm nhiều hơn nữa.\ngiá trị.\n(Lựa chọn A) Một dự án có dòng tiền bất thường có thể tạo ra nhiều IRR. Cái này\nlàm phức tạp quyết định đầu tư vì không có cách nào để đánh giá tỷ lệ nào là chính xác,\nlàm cho IRR trở thành thước đo kém hơn về lợi nhuận của dự án, đặc biệt khi dự án phải\nđược xếp hạng.\n(Lựa chọn C) Phương pháp IRR giả định rằng một công ty sẽ có thể tái đầu tư dòng tiền ở mức\ntỷ lệ IRR. Giả định tỷ suất lợi nhuận yêu cầu NPV (tức là công ty có thể tái đầu tư\nvới chi phí vốn) được coi là thận trọng và thực tế hơn IRR đối với tất cả các loại\ndòng tiền.\nNhững điều cần nhớ:\nNếu các dự án loại trừ lẫn nhau, vấn đề xếp hạng có thể tồn tại giữa chúng khi thực hiện\ncác quyết định về ngân sách vốn. Vì IRR không cung cấp bối cảnh liên quan đến quy mô của\ncác lựa chọn đầu tư, thực tiễn tốt nhất là công ty có thể tối đa hóa lợi nhuận được đo bằng\nNPV của dự án\nMô tả quá trình phân bổ vốn, tính giá trị hiện tại ròng (NPV), tỷ suất hoàn vốn nội bộ\n(IRR) và lợi tức trên vốn đầu tư (ROIC) và đối chiếu việc sử dụng chúng trong phân bổ vốn\nLOS","qhtml":null},{"n":21,"q":"On Nov 30 20X5, a retailer receives goods purchased from a supplier and offers them for\nsale. In 20X5, if the retailer has a 15-day cash conversion cycle, 25 days payables\noutstanding, 20 days sales outstanding, and a fiscal year end of Dec 31, an analyst's most\nappropriate forecast would be that an amount related to this transaction will appear on the\n20X5 balance sheet's:","opts":["inventory.","accounts payable.","accounts receivable."],"ans":"C","expl":"Chu kỳ chuyển đổi tiền mặt ( CCC ) là số ngày trung bình mà một công ty cần để thu thập\ntiền mặt từ việc bán hàng trả chậm sau khi thanh toán cho nhà cung cấp hàng hóa hoặc nguyên liệu được sử dụng để\ntạo ra những hàng hóa đó. CCC là tổng số ngày trung bình cần thiết để tạo ra\ndòng tiền vào bằng cách bán hàng tồn kho (DOH) và thu các khoản phải thu (DSO), trừ đi\nsố ngày trung bình để tạo ra dòng tiền chi ra bởi các nhà cung cấp thanh toán (DPO).\nCác hoạt động tạo ra CCC ảnh hưởng đến bảng cân đối kế toán theo nhiều cách. Đối với nhà bán lẻ, ví dụ\n:\nHàng tồn kho được ghi nhận khi hàng hóa được nhận từ nhà cung cấp và được hủy nhận dạng\nkhi hàng hóa được bán ; thời gian đã trôi qua là DOH.\nTài khoản phải trả được ghi nhận khi hàng hóa được nhận và được hủy ghi nhận khi\nnhà cung cấp được thanh toán ; thời gian trôi qua là DPO.\nCác khoản phải thu được ghi nhận khi hàng hóa được bán và hủy ghi nhận khi\nkhách hàng thanh toán ; thời gian đã trôi qua là DSO.\nTrong trường hợp này, ẩn số duy nhất là DOH. DOH = CCC − DSO + DPO = 15 − 20 + 25 = 20\nngày .\nDo đó, trên bảng cân đối kế toán 20X5 cuối năm tài chính , một tháng (tức là 31 ngày) sau khi\nmua hàng:\nhàng hóa đã được bán và được hủy ghi nhận khỏi hàng tồn kho (tức là sau 20 ngày) và\nnhà cung cấp đã được thanh toán và trách nhiệm pháp lý được hủy ghi nhận từ các tài khoản phải trả (tức là sau\n15 ngày) (Lựa chọn A và B) .\nDo đó, số tiền liên quan duy nhất xuất hiện trên bảng cân đối kế toán ngày 31 tháng 12 năm 20X5 là các tài khoản\ncó thể thu được , sẽ được thanh toán trong 9 ngày (= DOH + DSO − Số ngày còn lại trong 20X5 = 20 + 20 −\n31) sau khi kết thúc năm tài chính.\nNhững điều cần nhớ:\nChu kỳ chuyển đổi tiền mặt (CCC) là số ngày trung bình cần thiết để biến khoản thanh toán\ncủa công ty cho việc mua hàng hóa hoặc vật liệu từ nhà cung cấp trở lại thành tiền mặt từ việc bán\nnhững hàng hóa hoặc vật liệu đó. Hàng tồn kho, tài khoản phải trả và tài khoản phải thu được\nghi nhận và hủy ghi nhận trên bảng cân đối kế toán theo thời điểm hàng hóa được nhận và\nđược bán và công ty thực hiện dòng tiền liên quan.\nGiải thích chu kỳ chuyển đổi tiền mặt và so sánh chu kỳ chuyển đổi tiền mặt của các nhà phát hành\nLOS","qhtml":null},{"n":22,"q":"A company's board of directors decides that management is not taking enough risk to\nmaximize value for shareholders. Management is currently paid in cash. All else equal, which\nof the following changes to management compensation would best align its risk appetite with\nthat of shareholders?","opts":["Tie compensation to company size","Compensate primarily with stock options","Award stock grants as additional compensation"],"ans":"C","expl":"Hội đồng quản trị của một công ty chỉ định người quản lý điều hành doanh nghiệp thay mặt cho các cổ đông\n. Các nhà quản lý (tức là người đại diện) phải hành động vì lợi ích tốt nhất của các cổ đông\n(tức là người đứng đầu) để tối đa hóa giá trị của cổ đông. Tuy nhiên, xung đột giữa người đại diện và người ủy quyền\nphát sinh khi ban quản lý hành động vì lợi ích riêng của mình, bao gồm:\nThiếu nỗ lực: sai sót trong việc quản lý hoạt động và đưa ra quyết định hoạt động\nRủi ro không phù hợp: hành vi tìm kiếm rủi ro quá mức hoặc không thích rủi ro (ví dụ: trong việc lựa chọn\nđầu tư)\nXây dựng đế chế: phát triển doanh nghiệp đặc biệt để có một công ty lớn hơn để quản lý\nEntrenchment: điều hành công ty đặc biệt để bảo vệ công việc của ban quản lý\nTự xử lý: khai thác tài nguyên của công ty vì lợi ích cá nhân\nMột cách mà hội đồng quản trị có thể giảm khả năng xảy ra những xung đột như vậy là thông qua việc bồi thường\ncủa ban quản lý. Việc trả lương cho ban quản lý bằng khoản thù lao dựa trên cổ phiếu (ví dụ: sử dụng quyền chọn hoặc chứng quyền cổ phiếu\nlàm khoản bồi thường) sẽ gắn kết chặt chẽ hơn lợi ích của ban quản lý\nvới lợi ích của cổ đông. Các công ty thường kết hợp tiền lương và tiền thưởng với chế độ đãi ngộ\ndựa trên cổ phiếu; tuy nhiên:\nTiền thưởng dựa trên cổ phiếu quá ít có thể dẫn đến việc ban quản lý gặp quá ít rủi ro để\ntối đa hóa giá trị cổ đông nếu lợi ích của ban quản lý không đủ liên kết\nvới các cổ đông.\nTiền thưởng dựa trên cổ phiếu quá nhiều có thể dẫn đến việc ban quản lý gặp quá nhiều rủi ro\nvì ban quản lý sẽ được hưởng lợi chủ yếu từ việc tăng giá cổ phiếu (Lựa chọn B) .\n(Lựa chọn A) Việc buộc thù lao theo quy mô của doanh nghiệp (ví dụ: tổng tài sản) sẽ làm tăng\nxu hướng xây dựng đế chế mà không tập trung đủ vào việc tạo ra giá trị cho cổ đông.\nNhững điều cần nhớ:\nHội đồng quản trị của một công ty bổ nhiệm các nhà quản lý để điều hành doanh nghiệp thay mặt cho các cổ đông\n. Tuy nhiên, các nhà quản lý đôi khi hành động vì lợi ích riêng của họ, tạo ra xung đột giữa người đại diện và người đại diện\n. Hội đồng quản trị có thể giảm nguy cơ xảy ra xung đột như vậy bằng cách tăng\ncổ phần vốn sở hữu của ban quản lý thông qua bồi thường và do đó điều chỉnh mạnh mẽ hơn lợi ích của ban quản lý\nvới các cổ đông.\nMô tả mối quan hệ giữa người ủy quyền và người đại diện và những xung đột có thể nảy sinh giữa các nhóm bên liên quan\nLOS","qhtml":null},{"n":23,"q":"The following information is collected for three investments:\nExpected Covariance between\nExpected\nInvestment standard investment and the\nreturn (%)\ndeviation market\nX 9 16 0.0318\nY 11 17 0.0056\nZ 13 19 0.0225\nMarket 8 15\nBased only on this information, which investment most likely has the same level of systematic\nrisk as the market?","opts":["Investment X","Investment Y","Investment Z"],"ans":"C","expl":"Beta đo lường rủi ro hệ thống, cho biết mức độ nhạy cảm của lợi nhuận của chứng khoán đối với những thay đổi trong\nthị trường. Thị trường có beta bằng 1. Chứng khoán có beta lớn hơn 1 được\nđược coi là rủi ro hơn thị trường, trong khi chứng khoán có beta nhỏ hơn 1 sẽ ít rủi ro hơn\nthị trường.\nBeta được tính từ độ lệch chuẩn của chứng khoán, độ lệch chuẩn của thị trường và\nmối tương quan của chúng hoặc từ phương sai của thị trường và hiệp phương sai giữa chứng khoán và\nthị trường. Vì beta là thước đo rủi ro thị trường nên chứng khoán có beta bằng 1 có cùng\nmức rủi ro hệ thống như thị trường.\n(Lựa chọn A và B) Các khoản đầu tư X và Y đều có beta khác 1, cho thấy rằng\nmức độ rủi ro hệ thống của chúng khác với rủi ro hệ thống của thị trường.\nNhững điều cần nhớ:\nBeta là thước đo rủi ro hệ thống. Nó là hàm của độ lệch chuẩn của chứng khoán,\nđộ lệch chuẩn của thị trường và mối tương quan giữa hai độ lệch này hoặc của phương sai của thị trường\nvà hiệp phương sai giữa chứng khoán và thị trường. Chứng khoán có beta bằng 1 có\nmức độ rủi ro hệ thống tương tự như thị trường.\nTính toán và giải thích beta\nLOS","qhtml":null},{"n":24,"q":"A project has the following forecasted annual cash flows (in ¥ billions):\nYear Cash Flow\n0 −5\n1 15\n2 8\n3 −20\nBased on this information, which of the following discount rates will produce the lowest net\npresent value (NPV)?","opts":["6%","8%","11%"],"ans":"A","expl":"Giá trị hiện tại ròng (NPV) của một khoản đầu tư bằng với giá trị hiện tại của dòng tiền ròng\ndòng dự báo (tức là dòng tiền vào trừ đi dòng tiền chi). Tỷ lệ chiết khấu được sử dụng để tính NPV là\ntỷ lệ lợi nhuận bắt buộc đối với các nhà đầu tư, tính đến rủi ro của khoản đầu tư.\nThông thường, đối với các dự án có dòng tiền thông thường (tức là một dòng tiền âm ban đầu, theo sau là\nlà dòng tiền dương trong tương lai), tỷ lệ chiết khấu thấp hơn sẽ mang lại NPV cao hơn. Tuy nhiên, đối với\ndự án có dòng tiền bất thường (tức là dòng tiền âm xảy ra sau\ngiai đoạn đầu), mối quan hệ giữa tỷ lệ chiết khấu và quy mô của NPV có thể khác nhau.\nTrong trường hợp này, khoản đầu tư có dòng tiền bất thường. Tỷ lệ chiết khấu thấp nhất (6%)\nmang lại NPV thấp nhất (−0,52 tỷ yên) (Lựa chọn B và C) . Điều này xảy ra vì\ndòng tiền âm cuối cùng khá lớn tạo ra giá trị hiện tại âm nhất khi sử dụng tỷ lệ chiết khấu 6%\n; do đó, NPV giảm nhiều hơn so với hai tỷ lệ còn lại.\nNhững điều cần nhớ:\nĐối với các dự án có dòng tiền thông thường, tỷ lệ chiết khấu và giá trị hiện tại ròng (NPV)\ncó mối quan hệ nghịch đảo. Đối với các dự án có dòng tiền bất thường, mối quan hệ giữa\ntỷ lệ chiết khấu và NPV là không thể dự đoán được.\nMô tả quy trình phân bổ vốn, tính giá trị hiện tại ròng (NPV), tỷ suất hoàn vốn nội bộ\n(IRR) và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu cách sử dụng chúng trong phân bổ vốn\nLOS","qhtml":null},{"n":25,"q":"A company experiences rapidly accelerating revenue growth, yet its free cash flow remains\nnegative. The company plans to add to its assets, consisting largely of equipment and\naccounts receivable, and to invest in sales and marketing to grow its customer base. Based\nonly on the company's life-cycle stage, the most appropriate type of debt for the company is:","opts":["secured.","unsecured.","convertible."],"ans":"A","expl":"Giai đoạn vòng đời:\nĐặc điểm tài chính và nợ\nGiai đoạn vòng đời Đặc điểm tài chính Đặc điểm nợ\nTăng trưởng doanh thu: Thấp Tính sẵn sàng: Ít hoặc không có\nDòng tiền: Chi phí âm: Cao\nKhởi nghiệp\nRủi ro kinh doanh: Cao Cơ cấu vốn: ~0% nợ\nKhả năng sử dụng: Trung bình\nTăng trưởng doanh thu: Cao\nChi phí: Trung bình\nDòng tiền: Tăng\nTăng trưởng\nLoại nợ: Bảo đảm\nRủi ro kinh doanh: Trung bình\nCơ cấu vốn: Nợ 0%–20%\nTính sẵn có: Cao\nTăng trưởng doanh thu: Chậm lại\nChi phí: Thấp\nDòng tiền: Tích cực/có thể dự đoán\nTrưởng thành\nLoại nợ: Không có bảo đảm\nRủi ro kinh doanh: Thấp\nCơ cấu vốn: > 20% nợ\nCơ cấu vốn của một công ty và loại nợ mà công ty sử dụng có thể bị ảnh hưởng bởi\nnơi công ty sử dụng nằm trong vòng đời của ngành và theo loại ngành mà\nhoạt động. Mô hình điển hình được hiển thị bên dưới:\nTrong giai đoạn khởi nghiệp (tức là giai đoạn phôi thai), một công ty có doanh thu tối thiểu và nguy cơ\nthất bại là rất cao. Điều này dẫn đến các lựa chọn tài chính hạn chế; nợ chuyển đổi thường là\nloại hình tài trợ nợ duy nhất hiện có (Lựa chọn C).\nTrong giai đoạn tăng trưởng , tăng trưởng doanh thu đang tăng tốc nhưng vẫn cần đầu tư bổ sung\nđể mở rộng. Dòng tiền tự do có thể vẫn âm nhưng sẽ được cải thiện.\nTriển vọng rủi ro được cải thiện khiến doanh nghiệp trở nên hấp dẫn hơn đối với các nhà đầu tư, giảm\nchi phí nợ . Nợ có bảo đảm (tức là nợ được đảm bảo bằng tài sản thế chấp) là hình thức tài trợ bằng nợ có khả năng xảy ra nhất\n.\nTrong giai đoạn trưởng thành, tăng trưởng doanh thu chậm lại nhưng trở nên dễ dự đoán hơn. Dòng tiền tự do\ndương và ổn định, cơ sở khách hàng của công ty được thiết lập và chi tiêu đầu tư\nít hơn. Do mức độ rủi ro thấp hơn và dòng tiền tự do để thanh toán nợ\n, người cho vay sẵn sàng cung cấp nhiều khoản vay không có bảo đảm hơn (Lựa chọn B).\nTrong kịch bản này, công ty đang trong giai đoạn tăng trưởng và có tài sản để sử dụng làm tài sản thế chấp.\nDo đó, công ty có nhiều khả năng nhận được khoản nợ có bảo đảm nhất.\nNhững điều cần nhớ:\nA Cơ cấu vốn của công ty và loại nợ mà công ty sử dụng có thể bị ảnh hưởng bởi vị trí\ncủa công ty trong vòng đời của ngành. Thông thường, trong giai đoạn khởi động, chỉ có nợ chuyển đổi\ncó sẵn. Trong giai đoạn tăng trưởng, nợ có bảo đảm là hình thức tài trợ phổ biến nhất. Trong\ngiai đoạn trưởng thành, người cho vay sẵn sàng cung cấp nhiều khoản vay không có bảo đảm hơn.\nGiải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí vốn bình quân gia quyền\nLOS","qhtml":null},{"n":26,"q":"The capital market line (CML) represents portfolios that consist of a stock market index and\nUS Treasury bills, whereas the capital allocation line (CAL) is best described as representing\nportfolios that consist of:","opts":["the optimal risky portfolio and the risk-free asset.","the global minimum variance portfolio and the risk-free asset.","the market portfolio and short-term government securities."],"ans":"A","expl":"Đường phân bổ vốn (CAL) hiển thị bằng đồ họa tất cả các kết hợp của tài sản phi rủi ro và\ndanh mục đầu tư rủi ro tối ưu. Điểm mà CAL chạm vào đường biên hiệu quả là\ndanh mục đầu tư rủi ro tối ưu. CAL, một đường tiếp tuyến với đường biên hiệu quả, bắt đầu ở\ntỷ lệ phi rủi ro (điểm chặn y của nó).\nĐường thị trường vốn (CML), một ứng dụng của CAL, thay thế danh mục đầu tư lý thuyết\nbằng tài sản thực tế . CML thay thế tài sản không có rủi ro bằng trái phiếu chính phủ ngắn hạn\n(ví dụ: tín phiếu Kho bạc Hoa Kỳ). Nó cũng giả định rằng danh mục đầu tư chỉ số chứng khoán (ví dụ: chỉ số S&P 500)\nthay thế danh mục đầu tư rủi ro tối ưu.\n(Lựa chọn B) CAL giả định danh mục đầu tư được tạo từ danh mục đầu tư rủi ro tối ưu và\ntài sản phi rủi ro, kh
