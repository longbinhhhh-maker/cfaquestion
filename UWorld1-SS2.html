ong\ncâu hỏi này).\nCác tính toán cho tất cả các thành phần của giao dịch bán khống trong kịch bản này được hiển thị bên dưới:\n(Lựa chọn A) 8,3% sẽ là lợi nhuận gần đúng nếu khoản chiết khấu bán khống trên số tiền thu được từ bán khống\nkhông được bao gồm.\n(Lựa chọn C) 26,7% sẽ là lợi nhuận gần đúng nếu cổ tức 1,25 triệu đô la không được\ntrừ vào lợi nhuận của quỹ.\nNhững điều cần nhớ:\nLợi nhuận từ việc bán khống phụ thuộc vào số lượng cổ phiếu bị bán khống, đó là một\nhàm vốn chủ sở hữu của người bán trong giao dịch. Tổng lợi nhuận từ việc bán khống là\nlãi/lỗ trên giao dịch cơ bản, cộng với bất kỳ khoản lãi (\"giảm giá bán khống\") nào mà người bán kiếm được,\ntrừ đi cổ tức được trả cho cổ phiếu trong khi bán khống có hiệu lực và trừ đi hoa hồng\nvà các chi phí giao dịch khác.\nTính toán và diễn giải tỷ lệ đòn bẩy, tỷ suất lợi nhuận trên một giao dịch ký quỹ và\ngiá chứng khoán mà tại đó nhà đầu tư sẽ nhận được lệnh gọi ký quỹ\nLOS","qhtml":null},{"n":62,"q":"A broker concerned with executing a trade in a timely manner and with a high probability of\nexecution would most appropriately use a(n):","opts":["limit order.","market order.","immediate or cancel order."],"ans":"B","expl":"Lệnh thị trường và lệnh giới hạn là hai hướng dẫn phổ biến nhất để thực hiện giao dịch.\nLệnh thị trường hướng dẫn người trung gian (ví dụ: nhà môi giới, đại lý) ngay lập tức\nthực hiện giao dịch thay mặt cho khách hàng ở mức giá thị trường tốt nhất hiện có. Điều này\nđảm bảo xác suất thực thi lớn nhất nhưng có thể không mang lại giá tốt nhất cho khách hàng\n(ví dụ: giá cao nhất cho người bán, giá thấp nhất cho người mua).\nLệnh giới hạn cũng hướng dẫn người trung gian tìm kiếm mức giá tốt nhất hiện có\nnhưng yêu cầu phải đạt được mức giá giới hạn hoặc tốt hơn .\nNếu giá mua giới hạn Lệnh (bán) cao hơn (dưới) giá giới hạn được chỉ định, lệnh sẽ\nvẫn mở cho đến khi đạt được giá giới hạn. Do đó, các lệnh giới hạn có thể không được thực thi\nngay lập tức hoặc hoàn toàn không được thực hiện. Vì lệnh thị trường yêu cầu thực hiện ngay lập tức nên chúng thường thực hiện\nnhanh hơn lệnh giới hạn, khiến chúng phù hợp hơn với nhà môi giới quan tâm đến việc thực hiện\nmột giao dịch kịp thời và có xác suất thực hiện cao (Lựa chọn A).\n(Lựa chọn C) Lệnh ngay lập tức hoặc hủy (IOC) là một loại hướng dẫn hợp lệ đề cập đến\nthời gian mà một trung gian phải thực hiện một lệnh hơn là giá của đơn đặt hàng. Đơn đặt hàng IOC phải\nđược điền khi nhận, một phần hoặc toàn bộ và đơn hàng sẽ bị hủy ngay lập tức nếu không thể\nđược điền. Điều này sẽ khiến lệnh IOC không phù hợp đối với nhà môi giới quan tâm đến\nxác suất thực thi cao.\nNhững điều cần nhớ:\nLệnh thị trường tìm cách khớp lệnh ngay lập tức ở mức giá tốt nhất hiện có; do thiếu\ngiá giao dịch được chỉ định nên có khả năng khớp lệnh cao. Ngược lại, lệnh giới hạn\nphải được thực hiện ở mức giá giới hạn hoặc cao hơn, do đó chúng có thể không được thực thi ngay lập tức hoặc hoàn toàn không được thực hiện.\nSo sánh lệnh thị trường với lệnh giới hạn\nLOS","qhtml":null},{"n":63,"q":"A portfolio manager uses an active management strategy based on only historical and publicly\navailable information and achieves abnormal returns. The manager is trading in a market best\ndescribed as:","opts":["weak form efficient.","semi-strong form efficient.","strong form efficient."],"ans":"A","expl":"Giả thuyết thị trường hiệu quả (EMH) xác định hiệu quả của thị trường dựa trên mức độ nhanh chóng và\nthông tin được phản ánh đầy đủ vào giá tài sản. Nếu thị trường thực sự hiệu quả,\nthì lợi nhuận bất thường không thể đạt được một cách nhất quán. EMH định nghĩa ba\nCác hình thức hiệu quả của thị trường:\nDạng yếu giả định rằng giá tài sản chỉ phản ánh dữ liệu lịch sử thị trường (ví dụ: giá\nvà khối lượng dữ liệu). Trong một thị trường hiệu quả dạng yếu, thị trường chỉ đạt được những thành tựu hạn chế\nhiệu quả vì nó phản ánh thông tin hạn chế (tức là chỉ có dữ liệu lịch sử). Một khoản đầu tư\nngười quản lý sử dụng quản lý tích cực và tất cả thông tin có sẵn công khai có thể đạt được\nlợi nhuận bất thường để luôn vượt trội hơn thị trường.\nDạng bán mạnh giả định rằng giá tài sản phản ánh tất cả lịch sử thị trường\ndữ liệu cộng với tất cả thông tin có sẵn công khai (ví dụ: thông tin báo cáo tài chính).\nThông tin công cộng mới nhanh chóng được đồng hóa vào giá cả, vì vậy nhà quản lý đầu tư\nkhông thể tận dụng các sự kiện như thu nhập bất ngờ để đạt được lợi nhuận bất thường,\nlàm cho các chiến lược quản lý tích cực không hiệu quả nếu không sử dụng các biện pháp không công khai\nthông tin (Lựa chọn B).\nDạng mạnh giả định rằng giá tài sản phản ánh tất cả thông tin công cộng cũng như\nthông tin quan trọng, không công khai (tức là thông tin được ban quản lý hoặc người khác biết\nngười trong cuộc). Trong trường hợp này, nhà quản lý đầu tư không thể liên tục\ntốt hơn thị trường ngay cả trong thời gian ngắn vì giá tài sản phản ánh tất cả những gì có sẵn\nthông tin (Lựa chọn C).\nNhững điều cần nhớ:\nGiả thuyết thị trường hiệu quả (EMH) xác định hiệu quả của thị trường dựa trên mức độ nhanh chóng và\nthông tin được phản ánh đầy đủ vào giá tài sản. EMH xác định ba hình thức thị trường\nhiệu quả: yếu, nửa mạnh và mạnh. Chỉ trong một thị trường hiệu quả ở dạng yếu mới có thể\nngười quản lý đầu tư sử dụng phương pháp quản lý tích cực để luôn vượt trội hơn thị trường, vì\nthị trường chỉ đạt được hiệu quả hạn chế và phản ánh thông tin hạn chế.\nSo sánh hiệu quả thị trường dạng yếu, dạng nửa mạnh và dạng mạnh\nLOS","qhtml":null},{"n":64,"q":"Which of the following is the best example of a validity instruction?","opts":["\"Trade only if the entire order can be filled.\"","\"Cancel the order if it cannot be filled immediately.\"","\"Display part of the order size to the market and hide the other part.\""],"ans":"B","expl":"Hướng dẫn thực hiện so với hướng dẫn hợp lệ\nCác loại lệnh thị trường Ví dụ\nThị trường: lệnh được thực hiện ngay lập tức ở mức giá tốt nhất hiện có\nGiới hạn: lệnh được khớp ở mức giá ngưỡng hoặc cao hơn\nHướng dẫn thực hiện\nTất cả hoặc không (AON): toàn bộ lệnh được khớp hoặc bị hủy\nNgày: hết hạn vào cuối ngày giao dịch\nDừng: tùy thuộc vào một mức giá được chỉ định để kích hoạt hành động\nHướng dẫn hiệu lực\nGood-till-canceled (GTC): lệnh vẫn có hiệu lực cho đến khi bị hủy\nThị trường đóng cửa (MOC): lệnh được thực hiện ở giá đóng cửa trong ngày\nNgười giao dịch gửi nhiều hướng dẫn đặt lệnh khác nhau tới các bên trung gian (ví dụ: nhà môi giới, đại lý, sàn giao dịch) để\nđặt giao dịch. Các lệnh này có thể bao gồm cả hướng dẫn thực hiện và hiệu lực. Hướng dẫn thực thi\nxác định cách thực hiện một lệnh, cho phép nhà giao dịch kiểm soát giá, kích thước,\nkhả năng hiển thị và các điều kiện của lệnh.\nHướng dẫn có hiệu lực đề cập đến thời điểm có thể thực hiện một lệnh cũng như thời gian một lệnh\nkhông được thực hiện sẽ vẫn mở trước khi lệnh đó hết hạn. Ví dụ: lệnh trong ngày chỉ hợp lệ cho\nngày giao dịch đó, trong khi lệnh tạm dừng cho đến khi bị hủy (GTC) vẫn mở vô thời hạn cho đến khi được thực hiện hoặc\nbị hủy.\nLệnh ngay lập tức hoặc hủy là một loại hướng dẫn hợp lệ vì chúng xác định thời gian của\ngiao dịch:\nNếu lệnh không thể được thực hiện ngay lập tức , nó bị hủy ngay lập tức.\nNếu lệnh có thể được thực hiện ngay lập tức nhưng chỉ một phần thì phần chưa được thực hiện sẽ bị hủy ngay lập tức\nbị hủy.\nVì lý do này, ở một số thị trường, các lệnh như vậy còn được gọi là lệnh thực hiện hoặc hủy .\n(Lựa chọn A) Hướng dẫn giao dịch chỉ nếu có thể thực hiện toàn bộ lệnh được gọi là tất cả-hoặc-\nkhông có gì (AON) đơn đặt hàng. Các lệnh này không xác định thời điểm nhưng cách thực hiện lệnh\n; do đó, lệnh AON là một loại lệnh thực hiện.\n(Lựa chọn C) Chỉ hiển thị một phần quy mô lệnh ra thị trường là một hình thức thực hiện khác\nlệnh. Phần ẩn chỉ được tiết lộ cho người giao dịch sau khi họ mua hoặc bán kích thước\nđược hiển thị. Những đơn đặt hàng như vậy thường được gọi là đơn đặt hàng tảng băng trôi.\nNhững điều cần nhớ:\nHướng dẫn về hiệu lực đề cập đến thời điểm một đơn hàng có thể được thực hiện, cũng như thời gian một đơn hàng chưa được thực hiện\nsẽ được mở trước khi hết hạn. Nếu một lệnh ngay lập tức hoặc hủy bỏ (điền hoặc hủy) không thể được thực hiện\nngay lập tức, lệnh đó sẽ bị hủy; nếu nó được lấp đầy ngay lập tức nhưng một phần thì phần còn lại của đơn hàng sẽ bị\nbị hủy.\nSo sánh các hướng dẫn thực hiện, tính hợp lệ và xóa\nLOS","qhtml":null},{"n":65,"q":"Which of the following is least likely to be a feature of futures contracts? Buyers and sellers:","opts":["must meet initial margin requirements.","negotiate the quantity of the underlying asset.","use a clearinghouse as their legal counterparty."],"ans":"B","expl":"Đặc điểm của hợp đồng tương lai\nBên hợp đồng bán (dài) có nghĩa vụ bán (mua)\ncác cam kết về tài sản cơ bản\nGiao dịch trao đổi Không có giao dịch tương lai không cần kê đơn\nTrung tâm thanh toán bù trừ sàn giao dịch là hợp pháp\nClearinghouse\nđối tác\nĐược chuẩn hóa\nSàn giao dịch đặt tất cả các điều khoản hợp đồng\nhợp đồng\nYêu cầu ký quỹ Tiền gửi tiền mặt để bù lỗ cho các vị thế\nLãi và lỗ trên các vị thế mở đã thực hiện\nThanh toán hàng ngày\nbằng tiền mặt hàng ngày\nThay đổi giá cho phép so với\nGiới hạn giá hàng ngày\ngiá thanh toán\nHợp đồng tương lai là hợp đồng được tiêu chuẩn hóa : các điều khoản hợp đồng chẳng hạn như số lượng\ntài sản cơ bản hoặc thời gian hết hạn hợp đồng được thiết lập bởi sàn giao dịch nơi mỗi hợp đồng\nđược giao dịch. Người mua và người bán hợp đồng tương lai không thể thay đổi các điều khoản này. Các điều khoản hợp đồng\nđược đàm phán là một tính năng của các công cụ phái sinh không cần kê đơn (OTC) (ví dụ: hợp đồng kỳ hạn).\n(Lựa chọn A) Cả người mua và người bán đều phải đáp ứng các yêu cầu ký quỹ bằng cách gửi tiền mặt dưới dạng\nmột trái phiếu hoạt động có sẵn để bù đắp các khoản lỗ trên vị thế của họ. Yêu cầu ký quỹ được\nđặt ra bởi sàn giao dịch nơi hợp đồng được giao dịch.\n(Lựa chọn C) Mặc dù hợp đồng tương lai được tạo ra bởi giao dịch giữa người mua và người bán, nhưng\ncơ quan thanh toán bù trừ của sàn giao dịch sẽ trở thành đối tác hợp pháp của hợp đồng sau khi giao dịch được bắt đầu\n.\nNhững điều cần nhớ:\nHợp đồng tương lai được bắt đầu các công cụ phái sinh giao dịch trao đổi được sàn giao dịch chuẩn hóa để\nngười mua và người bán không thương lượng các điều khoản hợp đồng. Cơ quan thanh toán bù trừ trao đổi\ntrở thành đối tác hợp pháp cho tất cả các nhà giao dịch, những người phải đáp ứng các yêu cầu về ký quỹ\ncủa sàn giao dịch.\nXác định hợp đồng kỳ hạn, hợp đồng tương lai, giao dịch hoán đổi, quyền chọn (gọi và đặt) và các công cụ phái sinh tín dụng\nvà so sánh các đặc điểm cơ bản của chúng\nLOS","qhtml":null},{"n":66,"q":"An investor sells a European call option for €7 with a strike price of €150 on a stock trading at\n€140 with 3 months to expiration. Based on only this information, if the stock is trading at\n€145 at expiration, the seller's profit (in €) is closest to:","opts":["2","5","7"],"ans":"C","expl":"Quyền chọn mua (bán) kiểu Châu Âu cung cấp cho người mua quyền—nhưng không phải\nnghĩa vụ—mua (bán) một tài sản cơ bản tại thời điểm thực hiện giá (tức là giá thực hiện) vào\nngày hết hạn. Người bán quyền chọn (tức là vị trí quyền chọn mua\n) bán quyền này và thu phí bảo hiểm, đó là giá của hợp đồng quyền chọn.\nKhi hết hạn, nếu quyền chọn có lãi, quyền chọn mua sẽ được thực hiện và người bán sẽ buộc\nbuộc phải bán cổ phiếu cho người mua theo giá thực hiện. Tuy nhiên, như trong trường hợp này, nếu quyền chọn\nhết tiền và giá cổ phiếu ST thấp hơn giá thực hiện\nX (tức là 145 < 150), quyền chọn sẽ hết hạn mà không có giá trị CT (tức là ở mức 0). Khi đó\nlợi nhuận của người bán ⊓ sẽ là phí quyền chọn (tức là €7).\nPhí bảo hiểm nhận được luôn là lợi nhuận tối đa cho người bán hợp đồng quyền chọn.\nCác khoản lỗ tiềm ẩn trong vị thế mua bán ngắn hạn về mặt lý thuyết là không giới hạn vì không có giới hạn về mức độ\ngiá của cổ phiếu cơ bản có thể tăng.\n(Choice A) Lợi nhuận €2 sẽ thu được từ một vị thế bán khống (tức là 7 − 5).\n(Lựa chọn B) €5 sẽ là giá trị thực hiện của một vị thế bán dài (tức là 150 − 145).\nNhững điều cần nhớ:\nQuyền chọn mua kiểu Châu Âu cung cấp cho người mua quyền chứ không phải nghĩa vụ mua một\ntài sản cơ bản theo giá thực hiện vào ngày hết hạn. Người bán quyền chọn bán quyền\nnày và thu phí. Phí bảo hiểm nhận được luôn là lợi nhuận tối đa cho\nngười bán hợp đồng quyền chọn.\nxác định giá trị khi hết hạn và thu lợi nhuận từ vị thế mua hoặc bán trong quyền chọn mua hoặc bán\nLOS","qhtml":null},{"n":67,"q":"At the beginning of the year, a new fund of funds invests £300 million equally among three\nhedge funds. The fund of funds has a \"1 and 10\" fee structure and a 5% soft hurdle rate.\nManagement and incentive fees are calculated independently at year end. After one year, the\nreturns of the underlying hedge funds, gross of fees, are −2%, 6%, and 10%. The total fees\npaid to the fund of funds is closest to:","opts":["£3.14 million.","£4.54 million.","£4.74 million."],"ans":"A","expl":"Quỹ quỹ (FoF) là quỹ phòng hộ đầu tư vào các quỹ phòng hộ khác . Các quỹ phòng hộ\nthường thu cả phí quản lý và phí khuyến khích. Phí quản lý được tính\ndưới dạng phần trăm của tổng tài sản cuối cùng được quản lý (AUM) của quỹ và được\nđánh giá bất kể lợi nhuận . Phí khuyến khích được tính bằng tỷ lệ phần trăm của\nlợi nhuận ròng (tức là sau khi khấu trừ) hoặc tổng (tức là trước khi khấu trừ) phí quản lý\n; phí khuyến khích được đánh giá trên cơ sở gộp được cho là \"được tính toán độc lập\".\nPhí khuyến khích thường phụ thuộc vào lợi nhuận lớn hơn tỷ lệ vượt ngưỡng và/hoặc AUM\ncao hơn mức cao nhất. Phí và lợi nhuận của FoF được tính như sau (giá trị cuối năm\nvà phí tính bằng triệu bảng Anh):\nTính toán các bước\nGiá trị cuối năm của FoF = giá trị cuối năm của mỗi quỹ 98 + 106 + 110 = 314\nTính lợi nhuận trước phí (300 = đầu tư ban đầu) (314 − 300) / 300 ≈ 4,67%\nTính phí quản lý 314 × 0,01 = 3,14\nTrong trường hợp này, ngưỡng kiếm được phí khuyến khích của FoF phụ thuộc vào lợi nhuận vượt quá\ntỷ lệ vượt rào. Vì lợi nhuận 4,67% không vượt quá tỷ lệ rào cản 5% nên không có phí khuyến khích\nđược trả.\n(Lựa chọn B) Tổng phí 4,54 triệu bảng Anh là kết quả của việc giả định không phù hợp về rào cản mềm\nphí khuyến khích được trả cho tất cả lợi nhuận.\n(Lựa chọn C) Tổng phí 4,74 triệu bảng là kết quả của việc giả định rào cản mềm không phù hợp\nphí khuyến khích được trả cho hai quỹ phòng hộ cơ bản đã vượt quá tỷ lệ vượt rào.\nNhững điều cần nhớ:\nQuỹ quỹ (FoF) là một quỹ phòng hộ đầu tư vào các quỹ phòng hộ khác. Các quỹ phòng hộ thường\nthu cả phí quản lý và phí khuyến khích. Các nhà đầu tư phải chịu phí từ cả FoF và\ncác quỹ phòng hộ cơ bản của nó.\nTính toán và giải thích lợi nhuận đầu tư thay thế cả trước và sau phí\nLOS","qhtml":null},{"n":68,"q":"Two market-cap weighted indexes are created with the same stocks and stock weights, one as\na total return index and one as a price return index. If the stocks repurchase shares instead\nof paying dividends, after 1 year, which index will most likely have the greater return?","opts":["The total return index","The price return index","The indexes will have the same return"],"ans":"C","expl":"Chỉ số lợi nhuận\nTổng lợi nhuận\nChỉ phản ánh giá Phản ánh cả giá cả và thu nhập của\nchứng khoán chứng khoán\nBằng tổng lợi nhuận nếu không Lớn hơn lợi nhuận theo giá nếu chứng khoán\nchứng khoán tạo ra thu nhập tạo ra thu nhập\nLợi nhuận trên một chỉ số có thể được tính dưới dạng chỉ số lợi nhuận theo giá hoặc chỉ số tổng lợi nhuận.\nChỉ số lợi nhuận về giá phản ánh sự thay đổi giá của từng chứng khoán thành phần.\nChỉ số tổng lợi nhuận phản ánh cả sự thay đổi về giá của từng chứng khoán thành phần và bất kỳ\ncổ tức và/hoặc thu nhập lãi từ chứng khoán đó.\nSự khác biệt giữa chỉ số tổng lợi nhuận và chỉ số lợi tức giá là lợi tức trên\nthu nhập từ cổ tức và/hoặc tiền lãi.\nGiá trị của việc mua lại cổ phiếu được phản ánh trong giá cổ phiếu. Việc mua lại có tác động\nnhư nhau đối với cả hai loại chỉ số lợi nhuận vì cả hai đều nắm bắt được sự thay đổi về giá. Trong trường hợp này,\nhai chỉ số có các cổ phiếu cấu thành giống nhau được nắm giữ theo tỷ lệ như nhau và không có\ncổ tức được trả; do đó, chúng sẽ có cùng lợi nhuận (Lựa chọn A và B) .\nNhững điều cần nhớ:\nChỉ số lợi nhuận về giá phản ánh sự thay đổi về giá của từng loại chứng khoán thành phần, trong khi chỉ số lợi nhuận tổng\ncũng bao gồm mọi thu nhập (ví dụ: cổ tức, tiền lãi) từ chứng khoán. Việc mua lại cổ phần\nđược phản ánh trong giá cổ phiếu và sự thay đổi về giá được thể hiện bằng cả lợi nhuận\nlợi tức giá và tổng lợi nhuận, việc mua lại sẽ có tác động như nhau đối với cả hai thước đo lợi nhuận.\nTính toán và giải thích giá trị, lợi nhuận của giá và tổng lợi nhuận của một chỉ số\nLOS","qhtml":null},{"n":69,"q":"A six-month European put option on a common stock is valued at €39, while an otherwise\nidentical one-year put option is valued at €38. All else being equal, which of the following best\ndescribes the circumstance that results in this price difference?","opts":["The options are deep in the money.","The stock pays a dividend in nine months.","The underlying stock's volatility has increased."],"ans":"A","expl":"Nói chung, một quyền chọn có thời gian hết hạn dài hơn sẽ có giá trị hơn một quyền chọn có ngày ngắn hơn nhưng\ntùy chọn giống hệt nhau. Tuy nhiên, điều này không phải lúc nào cũng đúng đối với quyền chọn bán sâu\ntiền Châu Âu vì nó không thể được thực hiện cho đến khi hết hạn và giá thực hiện\ncủa nó phải được chiết khấu theo lãi suất phi rủi ro để giải thích cho sự chậm trễ này.\nDo chiết khấu, quyền chọn bán có kỳ hạn dài hơn có thể có giá trị nội tại ít hơn so với quyền chọn bán có ngày ngắn hơn.\nTrong kịch bản này, giả sử rằng cổ phiếu giao dịch ở mức 0 trong khi quyền chọn bán có giá thực hiện\nlà €40 và lãi suất phi rủi ro 5%. Giá trị hiện tại của giá thực hiện, được chiết khấu trong một năm\nvới lãi suất không có rủi ro, là khoảng €38. Giá trị này thấp hơn giá trị hiện tại của quyền chọn bán trong sáu tháng\nkhoảng €39.\n(Lựa chọn B) Giá trị quyền chọn bán ở Châu Âu tăng nếu cổ tức được trả vì khoản thanh toán\nlàm giảm giá trị của tài sản cơ sở. Tất cả đều không đổi, quyền chọn bán một năm phải có giá trị\ncao hơn quyền chọn bán sáu tháng, được trả cổ tức trong chín tháng.\n(Lựa chọn C) Giá trị của quyền chọn bán có liên quan trực tiếp đến sự biến động của cổ phiếu, bất kể\nthời gian hết hạn. Trong trường hợp này, giá trị của cả hai quyền chọn bán sẽ bị ảnh hưởng tương tự do\nsự gia tăng biến động.\nNhững điều cần nhớ:\nGiá thực hiện của một quyền chọn bán đáng giá ở Châu Âu phải được chiết khấu ở mức\nkhông rủi ro để giải thích cho việc không thể thực hiện trước khi hết hạn. Do chiết khấu, quyền chọn bán có thời hạn dài hơn\ncó thể có ít giá trị nội tại hơn quyền chọn bán có thời hạn ngắn hơn.\nXác định các yếu tố xác định giá trị của một quyền chọn và mô tả cách mỗi yếu tố ảnh hưởng đến\ngiá trị của một quyền chọn\nLOS","qhtml":null},{"n":70,"q":"An analyst gathers the following information on spot rates:\nMaturity Spot Rate\n0.5 year 1.50%\n1.0 year 1.90%\n1.5 years 2.20%\n2.0 years 2.40%\nBased on this information, the price of a two-year 3% coupon bond that pays interest\nsemiannually is closest to:","opts":["96.64","101.16","101.18"],"ans":"C","expl":"Trái phiếu có lãi suất cố định thanh toán phiếu lãi vào cuối mỗi kỳ và trả lại mệnh giá cùng với\nthanh toán phiếu lãi cuối cùng; giá trái phiếu có thể được ước tính bằng tổng giá trị hiện tại của\nmỗi dòng tiền. Trái phiếu không trả lãi định kỳ chỉ thực hiện một khoản thanh toán duy nhất khi đáo hạn, do đó, trái phiếu\ncó thể được định giá như thể nó là một chuỗi trái phiếu không trả lãi định kỳ có mệnh giá bằng với\ndòng tiền và thời gian đáo hạn của trái phiếu trả lãi phù hợp với việc thanh toán các dòng tiền đó.\nLãi suất giao ngay là YTM trên trái phiếu không trả lãi định kỳ , do đó, lãi suất được cung cấp ở đây có thể được sử dụng để\ntính toán giá trị hiện tại của từng dòng tiền của trái phiếu coupon. Đối với kịch bản này:\nMỗi khoản thanh toán phiếu lãi định kỳ là 0,03 × 100 2 = 1,50.\nTỷ giá giao ngay đã nêu (tức là hàng năm) được chuyển đổi thành lãi suất tương đương định kỳ (nửa năm)\nbằng cách chia cho chu kỳ của trái phiếu (2).\n(Lựa chọn A) 96,64 là kết quả của việc chiết khấu từng lãi suất dòng tiền thêm 1 cộng với lãi suất giao ngay đã nêu,\ndo đó không chuyển đổi lãi suất hàng năm thành giá trị tương đương nửa năm của chúng.\n(Lựa chọn B) 101,16 là kết quả của việc chiết khấu mỗi dòng tiền theo giá trị tương đương trong nửa năm của\ntỷ giá giao ngay kỳ hạn hai năm (1,2%).\nNhững điều cần nhớ:\nTrái phiếu lãi suất có thể được định giá như thể nó là một chuỗi trái phiếu không trả lãi định kỳ có mệnh giá bằng\ndòng tiền và thời gian đáo hạn của trái phiếu trả lãi khớp với việc thanh toán các dòng tiền đó.\nCác dòng tiền riêng lẻ được chiết khấu theo YTM của trái phiếu không trả lãi định kỳ (tức là lãi suất giao ngay).\nTỷ giá giao ngay phải được chuyển đổi thành lãi suất tương đương định kỳ đối với trái phiếu có chu kỳ\nlớn hơn 1.\nXác định tỷ giá giao ngay và đường cong giao ngay, đồng thời tính giá trái phiếu bằng cách sử dụng tỷ giá giao ngay.\nLOS","qhtml":null},{"n":71,"q":"A company has a forward price-to-earnings (P/E) of 5. In reviewing the company's financial\ndata, an analyst estimates a justified forward P/E of 4. Based on the justified forward P/E, the\nstock is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"The Tỷ lệ giá trên thu nhập (P/E) là giá cổ phiếu của công ty dưới dạng bội số của thu nhập trên mỗi\ncổ phiếu.\nTỷ lệ P/E dự phóng dựa trên giá thị trường được quan sát và ước tính thu nhập dự phóng\n.\nTỷ lệ P/E dự phóng hợp lý dựa trên giá trị nội tại của giá và thu nhập dự phóng\n ước tính.\nTỷ lệ P/E dự phóng hợp lý có thể được so sánh với các dạng tỷ lệ P/E khác để xác định\nliệu một cổ phiếu có bị định giá sai hay không. Nếu P/E dự phóng hợp lý dựa trên giá trị nội tại\nnhỏ hơn (lớn hơn) so với P/E dự phóng dựa trên giá trị thị trường, thì cổ phiếu\nđược thị trường coi là định giá quá cao (định giá thấp) (Lựa chọn A và B). Trong trường hợp này,\ntỷ lệ P/E dự phóng hợp lý là 4 nhỏ hơn tỷ lệ P/E dự phóng là 5, cho thấy rằng\ncổ phiếu được định giá quá cao.\nSự khác biệt trong hai P/E có thể được giải thích bằng các giả định về tỷ suất lợi nhuận yêu cầu\nhoặc tốc độ tăng trưởng được sử dụng để xác định giá trị nội tại.\nNhững điều cần nhớ:\nTỷ lệ giá trên thu nhập (P/E) dự phóng hợp lý có thể được so sánh với các dạng khác của tỷ lệ P/E\nđể xác định xem một cổ phiếu có bị định giá sai hay không. Nếu P/E dự phóng hợp lý dựa trên\ngiá trị nội tại nhỏ hơn (lớn hơn) so với P/E dự phóng dựa trên giá trị thị trường, thì cổ phiếu\nđược thị trường coi là định giá quá cao (định giá thấp).\nGiải thích lý do căn bản cho việc sử dụng bội số giá để định giá vốn chủ sở hữu, giá của bội số thu nhập\nliên quan đến các nguyên tắc cơ bản và việc sử dụng bội số như thế nào dựa trên các đối tượng so sánh\nLOS","qhtml":null},{"n":72,"q":"A company's noncallable, nonconvertible preferred stock pays dividends of $5 per share and\nhas a required rate of return of 8%. If the required rate of return decreases to 7.5%, then the\nvalue of the preferred stock would most likely :","opts":["increase by $4.17 per share.","decrease by $4.17 per share.","change to $4.65 per share."],"ans":"A","expl":"tại\n( r = 8,0%) ( r = 7,5%)\nCổ tức ( D )\n5,00 5,00\n0\n-> Tỷ lệ chiết khấu ( r ) 0,08 0,075\nGiá trị ( V )\n= 62,50 66,67\n0\nΔ V = 66,67 − 62,50 = $4,17\n0\nCổ phiếu ưu đãi là một loại vốn chủ sở hữu thường trả cổ tức cố định thường xuyên. Vì tất cả các dòng tiền\nluôn giống nhau nên cổ phiếu ưu đãi được định giá vĩnh viễn và giá trị hiện tại của nó được tính\nbằng công thức vĩnh viễn, tức là bằng cách chia khoản thanh toán cổ tức\ncho tỷ suất lợi nhuận yêu cầu .\n(Lựa chọn B) Giá trị của cổ phiếu tăng chứ không giảm, cho $4,17.\n(Lựa chọn C) $4,65 là kết quả của việc chia $5 cho (1 + 7,5%).\nNhững điều cần nhớ:\nCổ phiếu ưu đãi là một loại vốn chủ sở hữu thường trả cổ tức cố định thường xuyên. Vì tất cả các dòng tiền\nluôn giống nhau nên cổ phiếu ưu đãi được định giá vĩnh viễn và giá trị hiện tại của nó được tính toán bằng công thức vĩnh viễn, nghĩa là bằng cách chia khoản thanh toán cổ tức cho\ntỷ suất lợi nhuận bắt buộc.\nTính giá trị nội tại của một cổ phiếu ưu đãi không thể mua lại, không thể chuyển đổi\nLOS","qhtml":null},{"n":73,"q":"Which of the following models most likely estimates equity value from the market value of\nbalance sheet items?","opts":["Multiplier models","Present value models","Asset-based valuation models"],"ans":"C","expl":"Loại mô hình Giá trị nội tại của cổ phiếu bắt nguồn từ:\nGiá trị hiện tại Chiết khấu dòng tiền tự do hoặc cổ tức dự kiến ở tỷ lệ lợi nhuận yêu cầu\nNhân số liệu tài chính (ví dụ: EBITDA, doanh thu, thu nhập ròng) với thị trường\nHệ số nhân\nbội số (EV / EBITDA, EV / doanh thu, P/E)\nDựa trên tài sản\nTrừ giá trị hợp lý của nợ phải trả khỏi giá trị hợp lý của tài sản\nđịnh giá\nEV = giá trị doanh nghiệp.\nCác nhà phân tích sử dụng mô hình định giá để ước tính giá trị nội tại của một cổ phiếu nhằm xác định xem\nnó có được định giá hợp lý hay không. Các dạng mô hình định giá phổ biến bao gồm giá trị hiện tại, hệ số nhân và\nđịnh giá dựa trên tài sản.\nVới mô hình định giá dựa trên tài sản , giá trị vốn chủ sở hữu của công ty (tức là giá trị đối với các cổ đông)\nbằng giá trị hợp lý của tài sản trừ đi giá trị hợp lý của nợ phải trả . Các nhà phân tích thường bắt đầu với\ngiá trị sổ sách của các chi tiết đơn hàng trên bảng cân đối kế toán và thực hiện các điều chỉnh giá trị hợp lý để rút ra\ngiá trị thị trường của tất cả tổng tài sản và nợ phải trả. Lý do cơ bản là giá trị của\ncông ty có thể được biểu thị bằng giá trị tài sản của công ty và do đó giá trị vốn chủ sở hữu\ncủa công ty bằng với giá trị hợp lý của tài sản của công ty trừ đi nợ phải trả.\n(Lựa chọn A) Mô hình cấp số nhân thường liên quan đến việc áp dụng bội số thị trường cho một số liệu tài chính\nchẳng hạn như EBITDA hoặc doanh thu. Những số liệu này thường không được tìm thấy trên bảng cân đối kế toán.\n(Lựa chọn B) Các mô hình giá trị hiện tại được sử dụng để chiết khấu dòng tiền trong tương lai hoặc\ncổ tức của công ty. Quá trình này thường không trực tiếp liên quan đến việc buộc giá trị thị trường của tài sản và\nnợ phải trả với giá trị của công ty.\nNhững điều cần nhớ:\nTheo mô hình định giá dựa trên tài sản, giá trị vốn chủ sở hữu của công ty (tức là giá trị đối với các cổ đông)\nbằng giá trị hợp lý của tài sản trừ đi giá trị hợp lý của nợ phải trả. Cơ sở lý luận cơ bản là\nrằng giá trị của công ty có thể được biểu thị bằng giá trị tài sản của công ty và do đó\ngiá trị vốn chủ sở hữu của công ty bằng với giá trị hợp lý của tài sản của công ty trừ đi nợ phải trả.\nMô tả các loại chính của mô hình định giá vốn cổ phần\nLOS","qhtml":null},{"n":74,"q":"A corporate borrower plans to close on a bank loan in 30 days, when the loan terms will be\nfinalized. The interest rate on the loan is tied to 90-day SOFR. Based on only this\ninformation, which of the following transactions most appropriately hedges the company's\ninterest rate risk?","opts":["Long 30-day forward rate agreement (FRA) on 90-day SOFR","Long 90-day forward rate agreement (FRA) on 90-day SOFR","Long 120-day forward rate agreement (FRA) on 90-day SOFR"],"ans":"A","expl":"Thỏa thuận tỷ giá kỳ hạn (FRA) là một hợp đồng kỳ hạn trong đó tài sản cơ sở không phải là tài sản\n mà là lãi suất tham chiếu (ví dụ: SOFR 90 ngày). Một bên có kế hoạch vay trong tương lai\ncó thể mua FRA để phòng ngừa việc tăng lãi suất và những người cho vay tiềm năng có thể\nbán FRA để phòng ngừa việc giảm lãi suất. Để có hiệu quả nhất, thời gian hết hạn của FRA:\nphải phù hợp với thời điểm bắt đầu khoản vay trong tương lai và tỷ lệ tham chiếu\ncủa FRA phải phù hợp với tỷ lệ tham chiếu của khoản vay.\nTrong trường hợp này, người mua đang phòng ngừa rủi ro với tỷ lệ SOFR kỳ hạn 90 ngày cao hơn trong 30 ngày, khi\ncác điều khoản của khoản vay sẽ được hoàn tất. Do đó, FRA dài hạn 30 ngày trên SOFR 90 ngày là hợp đồng\nthích hợp nhất để phòng ngừa rủi ro (Lựa chọn B và C).\nNhững điều cần nhớ:\nThỏa thuận tỷ giá kỳ hạn (FRA) là hợp đồng kỳ hạn trong đó tài sản cơ sở không phải là tài sản\nmà là lãi suất tham chiếu. Một bên dự định vay trong tương lai có thể mua FRA để\nphòng ngừa việc tăng lãi suất. Để có hiệu quả nhất, thời gian hết hạn của FRA\nphải phù hợp với thời điểm bắt đầu khoản vay trong tương lai và tỷ giá tham chiếu của nó phải phù hợp với\ntỷ giá tham chiếu của khoản vay.\nGiải thích cách xác định tỷ giá kỳ hạn cho các hợp đồng kỳ hạn lãi suất và mô tả cách sử dụng\ncủa các tỷ giá kỳ hạn này.\nLOS","qhtml":null},{"n":75,"q":"All else being equal, key rate duration is most appropriate for assessing the interest rate risk\nof callable bonds if:","opts":["yield volatility is increasing.","yield spreads are widening.","the yield curve is steepening."],"ans":"C","expl":"Thời hạn trái phiếu\nLoại Biện pháp Trái phiếu áp dụng\nThời gian trung bình tính theo giá trị hiện tại để\nMacaulay Không có tùy chọn nhúng\nnhận được phiếu giảm giá và tiền gốc\nPhần trăm thay đổi về giá của một mặt hàng nhất định\nĐã sửa đổi Không có tùy chọn nhúng\nsự thay đổi lợi suất đến ngày đáo hạn của trái phiếu\nPhần trăm thay đổi về giá do\nTất cả có hiệu lực\nsự dịch chuyển song song của đường cong lợi suất chuẩn\nPhần trăm thay đổi về giá do sự thay đổi\nLãi suất cơ bản nằm trong một phần lợi suất chuẩn Tất cả\nđường cong\nSự thay đổi giá theo đơn vị tiền tệ cho trước một\nTiền Tất cả\nthay đổi năng suất hoặc đường cong thích hợp\nTùy chọn nghỉ hưu sớm gắn liền với trái phiếu có thể thu hồi được tạo ra sự không chắc chắn về tiền mặt trong tương lai\nchảy. Hai loại thời hạn được sử dụng để đánh giá tác động của các lựa chọn nghỉ hưu sớm đối với\nDòng tiền phải trả trong một khoảng thời gian không chắc chắn:\nKhoảng thời gian hiệu dụng giả định những thay đổi song song trong đường cong lãi suất chuẩn và\nthời hạn lãi suất cơ bản dựa trên sự thay đổi về hình dạng (tức là định hình rủi ro) của\nđường cong lợi suất chuẩn.\nKỳ hạn lãi suất cơ bản của trái phiếu được tính bằng cách giả định những thay đổi trong một hoặc nhiều lợi suất trên\nđường cong lợi suất chuẩn. Đường cong lợi suất dốc lên có thể là kết quả của việc giảm lãi suất ngắn hạn\nlãi suất có kỳ hạn, tăng lãi suất dài hạn hoặc kết hợp cả hai. Sự thay đổi giả định trong\nđường chuẩn được sử dụng để đánh giá tác động lên quyền chọn mua và tiền mặt được nhúng\nchảy trong suốt thời gian tồn tại của trái phiếu.\n(Lựa chọn A) Biến động lợi suất ảnh hưởng đến giá trị trái phiếu nhưng không phải là yếu tố được đo bằng lãi suất cơ bản\nthời lượng.\n(Lựa chọn B) Lợi suất trái phiếu doanh nghiệp phản ánh lợi suất trái phiếu chính phủ chuẩn và lợi suất\ntrải rộng trên điểm chuẩn đó. Mức chênh lệch phản ánh rủi ro tín dụng của người phát hành và khả năng phát hành trái phiếu.\nrủi ro thanh khoản. Khoảng thời gian lãi suất chính dựa trên những thay đổi trong đường cong lãi suất chuẩn, do đó,\nkhông kết hợp trực tiếp những thay đổi trong chênh lệch lãi suất.\nNhững điều cần nhớ:\nThời hạn lãi suất chính đo lường tác động lên giá trị của trái phiếu có thể thu hồi do những thay đổi trong một hoặc\nlợi suất cao hơn trên đường cong lợi suất chuẩn. Hình dạng hoặc độ dốc của đường cong lợi suất phản ánh\ntác động của những thay đổi đó.\nXác định khoảng thời gian lãi suất chính và mô tả cách sử dụng nó để đo lường độ nhạy cảm về giá của trái phiếu có thu nhập cố định\ncông cụ để đánh giá những thay đổi của đường cong lợi suất.\nLOS","qhtml":null},{"n":76,"q":"Debtholders of a subordinated bond recovered 15% of their bond's value during a bankruptcy\nwhile the holders of a senior secured bond recovered 75% of their bond's value. The most\nlikely explanation is that the:","opts":["various classes of claimants agreed to a negotiated settlement.","value of the secured property was less than the amount of the claim.","preferred shareholders received distributions first based on the priority of claims."],"ans":"A","expl":"Đối với các tổ chức phát hành có nhiều vấn đề nợ tồn đọng, khế ước thiết lập thứ hạng thâm niên\nxác định mức độ ưu tiên của các yêu cầu đối với các tầng lớp nhà đầu tư khác nhau. Trong thời kỳ phá sản,\nviệc tuân thủ nghiêm ngặt mức độ ưu tiên của các yêu cầu bồi thường sẽ dẫn đến việc thanh toán đầy đủ theo trình tự, theo\nthâm niên của từng hạng người yêu cầu.\nNếu các chủ nợ cấp dưới nhận được thanh toán một phần trước khi các chủ nợ có bảo đảm và cấp cao được\nđược thanh toán đầy đủ thì quyền ưu tiên của các yêu cầu bồi thường không được tuân thủ nghiêm ngặt. Một lý do rất có thể là\ncác nhóm nguyên đơn khác nhau đã thương lượng một giải pháp giải quyết để tránh kiện tụng, điều này sẽ\ngiảm tài sản sẵn có để thu hồi.\nTrong kịch bản này, các chủ nợ cấp dưới nhận được 15% yêu cầu bồi thường của họ trong khi chủ nợ cấp cao hơn\ncác chủ nợ có bảo đảm đã nhận được 75% số tiền của họ, cho thấy các nguyên đơn khác nhau đã đồng ý với điều đó\nmột khu định cư. Nếu thứ tự ưu tiên của các yêu cầu bồi thường được tuân thủ nghiêm ngặt, các chủ nợ có bảo đảm cấp cao sẽ\nlẽ ra sẽ nhận được 100% yêu cầu của họ trước khi các tầng lớp thấp hơn nhận được bất kỳ khoản phân phối nào.\n(Phương án B) Trong trường hợp giá trị tài sản bảo đảm nhỏ hơn số tiền\nyêu cầu bồi thường, các khoản thiếu hụt sẽ có vị thế ngang bằng với yêu cầu bồi thường của các chủ nợ cấp cao không có bảo đảm. Cái này\nyêu cầu bồi thường vẫn được ưu tiên hơn các chủ nợ cấp dưới dựa trên mức độ ưu tiên của các yêu cầu bồi thường.\n(Lựa chọn C) Các cổ đông, bao gồm cả cổ đông ưu đãi, có quyền yêu cầu bồi thường thấp hơn quyền lợi của tất cả các cổ đông ưu đãi.\nchủ nợ. Họ sẽ chỉ nhận được các khoản phân phối sau khi tất cả các yêu cầu bồi thường của chủ sở hữu trách nhiệm pháp lý được thanh toán đầy đủ.\nđầy đủ, giả sử tuân thủ mức độ ưu tiên của yêu cầu bồi thường.\nNhững điều cần nhớ:\nCác loại trái phiếu không có bảo đảm cao cấp và có bảo đảm có mức độ ưu tiên cao hơn đối với các yêu cầu bồi thường đối với trái phiếu của công ty.\ntài sản trong thời kỳ phá sản. Nếu các chủ nợ cấp dưới nhận được thanh toán một phần trước\ncác chủ nợ có bảo đảm và cấp cao được thanh toán đầy đủ, một lý do có thể là do các loại nợ khác nhau\nnguyên đơn đã thương lượng giải quyết để tránh kiện tụng.\nMô tả thứ hạng thâm niên của khoản nợ, nợ có bảo đảm và không có bảo đảm và mức độ ưu tiên của các khoản nợ trong\nphá sản và tác động của chúng đến xếp hạng tín dụng.\nLOS","qhtml":null},{"n":77,"q":"If a noncallable bond has an annual modified duration of 9.718 and an annual convexity of\n167.574, the estimated percentage price increase if its YTM declines by 50 basis points\nis closest to:","opts":["4.65%","4.86%","5.07%"],"ans":"C","expl":"Thời gian và độ lồi có thể được sử dụng để ước tính phần trăm thay đổi trong giá trái phiếu. Thời lượng\nđã sửa đổi đo lường sự thay đổi trong giá trái phiếu đối với một thay đổi nhất định trong YTM của nó và độ lồi\nđo lường sự thay đổi về độ nhạy giá của trái phiếu.\nƯớc tính thay đổi giá dựa trên thời gian phản ánh mối quan hệ nghịch đảo giữa giá trái phiếu\nvà lợi suất. Để nắm bắt hướng thay đổi độ nhạy cảm về giá, tác động của độ lồi về giá\nphải được:\nthêm vào phần trăm thay đổi giá do khoảng thời gian khi YTM giảm và\ntrừ đi phần trăm thay đổi giá do khoảng thời gian khi YTM tăng .\n(Lựa chọn A) 4,65% là kết quả của việc trừ nhầm tác động lồi của giá\nthay đổi được ước tính từ thời hạn sửa đổi của trái phiếu thay vì thêm nó. Độ lồi làm giảm\ngiá trái phiếu giảm khi lãi suất tăng, nhưng làm tăng giá khi\nYTM của trái phiếu giảm.\n(Lựa chọn B) 4,86% là sự thay đổi giá ước tính do thời hạn được sửa đổi của trái phiếu, nhưng nó\nkhông tính đến độ lồi của trái phiếu.\nNhững điều cần làm hãy nhớ:\nThời lượng và độ lồi có thể được sử dụng để ước tính phần trăm thay đổi trong giá trái phiếu đối với một\nsự thay đổi nhất định trong YTM của nó. Đối với trái phiếu không thể thu hồi, ước tính thay đổi giá dựa trên thời hạn được\nđiều chỉnh bằng cách cộng hiệu ứng lồi khi YTM giảm và trừ đi hiệu ứng lồi\nkhi YTM tăng.\nTính phần trăm thay đổi giá của trái phiếu đối với một thay đổi cụ thể về lãi suất, dựa trên\nthời hạn và độ lồi của trái phiếu.\nLOS","qhtml":null},{"n":78,"q":"An analyst gathers the following information on 10-year government benchmark rates (with\nYTMs assuming semiannual compounding):\nBenchmark YTM\nGovernment bond 4.18%\nInterest rate swap 4.28%\nGovernment spot rate 4.35%\nFor a 6% coupon semiannual pay corporate bond with 10 years to maturity and priced at\n100.35, the g -spread in basis points (bps) is closest to:","opts":["160 bps","167 bps","177 bps"],"ans":"C","expl":"Đường cong lợi suất hiển thị cấu trúc kỳ hạn của lãi suất bằng cách vẽ đồ thị mối quan hệ giữa\nkỳ hạn và lãi suất trái phiếu. Nhiều chính phủ, bao gồm cả Vương quốc Anh, Hoa Kỳ và Nhật Bản,\nthường xuyên phát hành trái phiếu với kỳ hạn chọn lọc (ví dụ: 2, 5, 10 và 30 năm). Các trái phiếu chuẩn\nnày tạo thành cơ sở của đường cong lãi suất chính phủ.\nG - spread là sự khác biệt giữa YTM của trái phiếu phi chính phủ so với\nYTM của trái phiếu chính phủ chuẩn có cùng kỳ hạn . Nó định lượng\nlợi suất bổ sung (tức là chênh lệch) mà thị trường yêu cầu để sở hữu trái phiếu rủi ro hơn.\nTrong câu hỏi này, YTM của trái phiếu doanh nghiệp có thể được tính từ thông tin được cung cấp\nbằng máy tính tài chính. Được tính trên cơ sở nửa năm một lần, YTM của trái phiếu chính phủ là\n4,18% và YTM của trái phiếu doanh nghiệp là 5,95%. Do đó, mức chênh lệch g là 0,0595 − 0,0418\n= 0,0177 hoặc 177 bps.\n(Lựa chọn A) 160 bps (0,0595 − 0,0435 = 0,0160) là chênh lệch giữa YTM của trái phiếu\n và tỷ giá giao ngay. Nó xuất phát từ việc áp dụng không phù hợp khái niệm chênh lệch Z,\nyêu cầu tỷ giá giao ngay của toàn bộ đường cong chuẩn chứ không chỉ YTM của một kỳ.\n(Lựa chọn B) 167 bps (0,0595 − 0,0428 = 0,0167) là chênh lệch giữa YTM của trái phiếu\nvà tỷ giá hoán đổi chuẩn, hay i - Lan truyền.\nNhững điều cần nhớ:\nG - Spread là sự khác biệt giữa YTM của trái phiếu phi chính phủ so với YTM\ncủa trái phiếu chính phủ chuẩn có cùng kỳ hạn. Nó định lượng lợi suất bổ sung\nmà thị trường yêu cầu để sở hữu trái phiếu rủi ro hơn.\nSo sánh, tính toán và giải thích các biện pháp lợi suất và chênh lệch lợi suất đối với trái phiếu có lãi suất cố định.\nLOS","qhtml":null},{"n":79,"q":"When evaluating the risk management policies of alternative investment managers, which of\nthe following is most likely considered a best practice?","opts":["Use of separately managed accounts","In-house security valuation by a dedicated valuation expert","Individual security position limits solely determined by each portfolio manager"],"ans":"A","expl":"Danh sách kiểm tra thẩm định đầu tư thay thế\nKinh nghiệm của nhóm, rủi ro của người chủ chốt và danh tiếng\nDanh tiếng của các nhà cung cấp dịch vụ bên thứ ba (ví dụ:\nTổ chức\nkiểm toán viên, nhà môi giới chính)\nHồ sơ theo dõi gần đây và dài hạn\nDanh mục đầu tư\nChiến lược, quy trình đầu tư và tạo ý tưởng\nquản lý\nKiểm soát nội bộ, báo cáo tài chính đã kiểm toán,\ntần suất báo cáo\nHoạt động\nPhương pháp định giá và kiểm soát\nSự độc lập của giám đốc rủi ro với danh mục đầu tư\nra quyết định\nChính sách rủi ro\nGiới hạn quỹ/vị trí, đòn bẩy, chính sách phòng ngừa rủi ro\nCơ cấu quỹ và đăng ký pháp lý\nVụ kiện tụng hiện tại hoặc trước đó chống lại quỹ hoặc\nRủi ro pháp lý\ntiền gốc\nPhí, khóa, thời gian thông báo mua lại\nĐiều khoản của\nLãi suất thực hiện, chính sách phân phối\nđầu tư\nViệc thẩm định chi tiết của các nhà quản lý đầu tư thay thế đặt ra những thách thức không phải lúc nào cũng\ngặp phải với truyền thống các hãng đầu tư. Cụ thể, các chính sách và thủ tục liên quan\nvới rủi ro hoạt động và danh mục đầu tư đòi hỏi sự xem xét kỹ lưỡng hơn và sự hiểu biết về các phương pháp hay nhất trong toàn ngành\n.\nCác khoản đầu tư truyền thống (ví dụ: quỹ tương hỗ) thường nắm giữ tài sản của khách hàng thông qua người giám sát\nbên thứ ba, giúp bảo vệ các nhà đầu tư bằng cách tách biệt các tài sản đó. Với các khoản đầu tư\nthay thế, chẳng hạn như quỹ phòng hộ và vốn cổ phần tư nhân, điều này không phải lúc nào cũng đúng.\nCác quỹ phòng hộ thường sử dụng một nhà môi giới chính làm người giám sát, nhưng tài khoản khách hàng cũng có thể được cấu trúc\ndưới dạng tài khoản được quản lý riêng (SMA). SMA là các tài khoản được nắm giữ bởi một người giám sát\nđộc lập đứng tên nhà đầu tư. Đối với nhà đầu tư, các vị thế và giao dịch trong những tài khoản đó\nhoàn toàn minh bạch, giảm nguy cơ gian lận.\n(Lựa chọn B) Các phương pháp hay nhất quy định việc giám sát định giá chứng khoán của bên thứ ba. Việc định giá\nbảo mật nội bộ có thể dẫn đến xung đột lợi ích tiềm ẩn do các nhà quản lý/quỹ có động cơ\nđịnh giá quá cao tài sản. Rủi ro này đặc biệt nghiêm trọng đối với chứng khoán không được giao dịch và kém thanh khoản.\n(Lựa chọn C) Giới hạn vị thế cá nhân được đặt ra trong biên bản chào bán và được thực thi bởi\ngiám đốc rủi ro chứ không phải người quản lý danh mục đầu tư.\nNhững điều cần nhớ:\nViệc quản lý tài sản của nhà đầu tư của bên thứ ba là phương pháp hay nhất đối với tất cả các công ty đầu tư. Tài khoản được quản lý\nriêng biệt là tùy chọn lưu ký của bên thứ ba mang lại sự minh bạch hoàn toàn cho các nhà đầu tư.\nSo sánh các phương thức đầu tư trực tiếp, đồng đầu tư và quỹ đầu tư để thay thế\ncác khoản đầu tư\nLOS","qhtml":null},{"n":80,"q":"A put option is most likely in the money when the underlying asset price is less than the:","opts":["strike price.","strike price less the premium.","present value of the strike price."],"ans":"A","expl":"Tính tiền\nĐiều kiện cuộc gọi Đặt\nBằng tiền Giá giao ngay > Giá thực hiện Hết tiền\nGiá giao ngay = Giá thực hiện Tại số tiền\nHết tiền Giá giao ngay < Giá thực hiện Trong tiền\nQuyền chọn là các yêu cầu ngẫu nhiên mang lại cho chủ sở hữu (tức là người mua hoặc bên mua) quyền giao dịch\nmột tài sản ở một mức giá cố định (tức là giá thực hiện) vào một ngày trong tương lai. Một quyền chọn có giá trị khi\nviệc thực hiện quyền chọn cho phép chủ sở hữu giao dịch tài sản cơ sở ở mức giá tốt hơn\ngiá thị trường hiện tại của tài sản (tức là khi giá trị thực hiện là dương).\nQuyền chọn mua có giá trị khi giá thực hiện là < giá thị trường của tài sản.\nQuyền chọn bán có giá trị khi giá thực hiện là > thị trường của tài sản\nprice .\nNếu quyền chọn bán đang có lãi, trước tiên, người nắm giữ quyền chọn bán có thể mua tài sản theo giá thị trường và\nsau đó bán tài sản ở mức giá thực hiện, tức là > giá thị trường và nhận được khoản chênh lệch.\n(Lựa chọn B) Giá thực hiện của quyền chọn bán trừ đi phí bảo hiểm là điểm hòa vốn của quyền chọn.\nTuy nhiên, an Khả năng kiếm tiền của quyền chọn được xác định bởi mối quan hệ giữa giá\ncủa tài sản cơ sở với giá thực hiện, bất kể phí bảo hiểm được trả là bao nhiêu.\n(Lựa chọn C) Giá trị hiện tại của giá thực hiện được sử dụng trong định giá quyền chọn (ví dụ: quyền chọn bán\nchẵn lẻ) nhưng không phải là yếu tố xác định tính sinh tiền của quyền chọn.\nNhững điều cần nhớ:\nQuyền chọn bán cung cấp cho chủ sở hữu quyền bán một tài sản cơ bản với một mức giá xác định vào một ngày\ntrong tương lai. Một quyền chọn bán có lãi khi giá tài sản cơ bản thấp hơn giá thực hiện của\ntùy chọn.\nGiải thích giá trị thực hiện, số tiền và giá trị thời gian của một tùy chọn\nLOS","qhtml":null},{"n":81,"q":"An investor is considering a $20 million investment in the STU fund of funds (FoF). The FoF's\ncharacteristics, as well as the characteristics of the funds in which it invests, are as follows:\nSTU fund of funds Funds held by STU\nFee structure 1 and 10 2 and 20\nPerformance fee Independent of Independent of\ncalculation management fee management fee\nHurdle rate No hurdle rate 6% hard hurdle\nBased on beginning-of-year Based on beginning-of-year\nManagement fee\nAUM AUM\nAssuming each of STU's investments earns a 15% gross return, the investor would pay $0.424\nmillion total fees to STU. An investment in STU would earn a net return closest to:","opts":["7.88%","8.68%","9.08%"],"ans":"C","expl":"Cấu trúc phí quỹ phòng hộ điển hình\nCơ sở tính phí Chi tiết cụ thể\nThường là 1%−3% AUM hàng năm\nTài sản trong\nKhông phụ thuộc vào lợi nhuận của quỹ\nQuản lý\nquản lý (AUM)\nLuôn được tính trước phí khuyến khích\nCó thể là phí quản lý ròng hoặc tổng phí quản lý\nCó thể phải chịu tỷ lệ vượt rào và/hoặc\nHiệu suất hoặc khuyến khích Lợi nhuận hàng năm\nmức cao\nCác nhà quản lý quỹ phòng hộ kiếm được phí quản lý, chẳng hạn như 2% tài sản được quản lý,\nvà phí hoạt động, thường được đặt là 20% lợi nhuận. Cấu trúc này thường được gọi là 2 và\n20 . Thành phần phí hiệu suất thường không áp dụng trừ khi người quản lý có thể vượt quá\ntỷ lệ vượt ngưỡng. Tỷ lệ vượt rào trong trường hợp này là một rào cản cứng, được tính từ tổng lợi nhuận\nkhi tính phí hoạt động.\nCác nhà quản lý quỹ (FoF) thường tuân theo cấu trúc phí tương tự. Thỏa thuận chung\nlà phí quản lý 1% và phí thực hiện 10% (tức là 1 và 10). Phí FoF được\nbổ sung vào các khoản phí được tính bởi các quỹ mà FoF đầu tư vào . Trong trường hợp này, tổng\nfoF được tính là 0,424 triệu USD.\nTrong trường hợp này, phí quản lý dựa trên AUM đầu năm và phí hiệu suất\nđược tính độc lập với phí quản lý. Để xác định lợi nhuận ròng cho FoF\n(STU), trước tiên hãy tính lợi nhuận ròng cho danh mục quỹ mà STU sẽ đầu tư, sau đó\ngiải lợi nhuận của STU sau khi áp dụng phí foF:\nNhà đầu tư vào STU kiếm được lợi nhuận ròng khoảng 9,08% .\n(Lựa chọn A) 7,88% là kết quả của việc không thực hiện áp dụng tỷ lệ vượt rào.\n(Lựa chọn B) 8,68% sẽ là kết quả nếu phí hiệu suất được tính sau khi trừ\nphí quản lý. Trong trường hợp này, phí hiệu suất và phí quản lý được tính\nđộc lập với nhau (tức là trên cơ sở tổng).\nNhững điều cần nhớ:\nCác nhà quản lý quỹ phòng hộ kiếm được cả phí quản lý và phí hiệu suất, thường theo cấu trúc 2 và 20\n. Các nhà quản lý quỹ áp dụng cấu trúc 1 và 10 tương tự dựa trên các khoản phí được tính\ntheo quỹ trong danh mục đầu tư của họ.\nTính toán và giải thích lợi nhuận đầu tư thay thế cả trước và sau phí\nLOS","qhtml":null},{"n":82,"q":"The priorities that preferred shareholders have compared to common shareholders are least\nlikely related to:","opts":["voting rights.","payment of dividends.","claim on assets upon liquidation."],"ans":"A","expl":"Đặc điểm của chứng khoán vốn\nƯu tiên chung\nBiểu quyết Một số hành động của công ty (ví dụ: M&A) và\nThường không có\nghế hội đồng quyền\nCổ tức chỉ trả sau ưu đãi Thanh toán đầy đủ trước chung\nYêu cầu còn lại sau tất cả các nghĩa vụ khác Yêu cầu ưu tiên đối với tài sản chung\nTài sản\nphân phối hưu trí\nCó hai loại chứng khoán vốn: cổ phiếu phổ thông và cổ phiếu ưu đãi (tức là cổ phiếu ưu đãi\n). Các công ty phải có cổ phiếu phổ thông đang lưu hành, thể hiện quyền sở hữu\ntrong công ty. Với tư cách là chủ sở hữu, cổ đông phổ thông:\nchia sẻ hiệu quả hoạt động của công ty,\ntham gia quản trị công ty thông qua quyền biểu quyết và\ncó quyền yêu cầu còn lại đối với tài sản của công ty trong trường hợp thanh lý.\nCác công ty có thể huy động thêm vốn cổ phần bằng cách phát hành cổ phiếu ưu đãi . Không giống như cổ phiếu\nthông thường, cổ phiếu ưu đãi thường không có quyền biểu quyết và không tham gia vào hoạt động điều hành\ncủa công ty. Tuy nhiên, cổ phiếu ưu đãi xếp trước (tức là có ưu tiên hơn)\ncổ phiếu phổ thông, vì cổ đông ưu đãi nhận được:\ncổ tức ưu đãi, sau khi được tuyên bố, trước khi bất kỳ cổ tức cổ phiếu phổ thông nào có thể được\ntrả (Lựa chọn B) và\nmệnh giá cổ phiếu trước khi cổ đông phổ thông nhận được bất kỳ khoản phân phối nào, khi\nthanh lý (Lựa chọn C) .\nNhững điều cần nhớ:\nCó hai loại chứng khoán vốn: cổ phiếu phổ thông và cổ phiếu ưu đãi. Các công ty\nphải có cổ phiếu phổ thông đang lưu hành và có thể phát hành cổ phiếu ưu đãi để huy động thêm\nvốn. Cổ phiếu ưu đãi có quyền ưu tiên chia cổ tức và phân phối tài sản khi thanh lý công ty\nnhưng thông thường, chúng không có quyền biểu quyết.\nMô tả sự khác biệt về quyền biểu quyết và các đặc điểm sở hữu khác giữa các loại vốn chủ sở hữu\n\nLOS","qhtml":null},{"n":83,"q":"All else equal, a company's book value of equity is most likely to decrease when the:","opts":["company stops paying common dividends.","company reports a large accumulated loss.","company's stock price falls below par value."],"ans":"B","expl":"Giá trị sổ sách của vốn chủ sở hữu Giá trị thị trường của vốn chủ sở hữu\n(Vốn chủ sở hữu của cổ đông) (Giới hạn thị trường)\nCổ phiếu phổ thông* + Số cổ phiếu đang lưu hành (hiện tại) ×\nThu nhập giữ lại (hoặc lỗ lũy kế) Giá cổ phiếu hiện tại\n*Cổ phiếu phổ thông = Cổ phiếu đã phát hành × Giá phát hành\nGiá trị sổ sách của vốn chủ sở hữu là số vốn chủ sở hữu của cổ đông được báo cáo trên bảng cân đối kế toán\ncủa công ty. Nó chủ yếu bao gồm cổ phiếu phổ thông và lợi nhuận giữ lại. Trên bảng cân đối\n:\ncổ phiếu phổ thông báo cáo giá trị lịch sử của vốn cổ phần phổ thông đã phát hành và\nthu nhập giữ lại (lỗ lũy kế) báo cáo lợi nhuận ròng (lỗ) tích lũy kể từ khi công ty thành lập, trừ cổ tức.\nTất cả các khoản lỗ lũy kế bằng nhau sẽ làm giảm giá trị sổ sách của vốn chủ sở hữu bằng cách giảm\nthu nhập giữ lại. Giá trị sổ sách của vốn chủ sở hữu cũng là sự khác biệt giữa tổng tài sản và\ntổng nợ phải trả.\nGiá trị thị trường của vốn chủ sở hữu là giá trị hiện tại của vốn chủ sở hữu của cổ đông (Cổ phiếu\nlưu hành × Giá cổ phiếu hiện tại). Sự thay đổi về giá cổ phiếu hiện tại sẽ ảnh hưởng đến\ngiá trị thị trường của vốn chủ sở hữu chứ không phải giá trị sổ sách của nó (Lựa chọn C).\nVì giá cổ phiếu dựa trên kỳ vọng của nhà đầu tư về thu nhập trong tương lai của công ty hoặc\ndòng tiền nên giá trị thị trường của vốn chủ sở hữu là hướng tới tương lai, trong khi giá trị sổ sách của vốn chủ sở hữu\n(dựa trên giá trị cổ phiếu khi phát hành) là lạc hậu.\n(Lựa chọn A) Tất cả các yếu tố khác đều bằng nhau, việc tạm dừng chia cổ tức làm tăng thu nhập giữ lại và do đó, ghi sổ\ngiá trị vốn chủ sở hữu vì công ty giữ nhiều thu nhập hơn, thay vì trả chúng dưới dạng cổ tức.\nNhững điều cần nhớ:\nGiá trị sổ sách của vốn chủ sở hữu được báo cáo trên bảng cân đối kế toán của công ty là giá trị lịch sử của\ncổ phiếu phổ thông đã phát hành (tức là cổ phiếu phổ thông) và giá trị ròng tích lũy lợi nhuận (lỗ) kể từ khi\nthành lập công ty, cổ tức ròng (tức là lợi nhuận giữ lại). Giá trị thị trường của vốn chủ sở hữu dựa trên\ngiá cổ phiếu hiện tại, dựa trên kỳ vọng hiện tại của nhà đầu tư về thu nhập trong tương lai.\nMô tả tài chính hành vi và mức độ liên quan tiềm tàng của nó để hiểu những điểm bất thường của thị trường\nLOS","qhtml":null},{"n":84,"q":"Which of the following financial intermediaries is least likely to provide liquidity to the markets\nthey operate in?","opts":["Dealers","Brokers","Mortgage banks"],"ans":"B","expl":"Các trung gian tài chính cung cấp nhiều sản phẩm và dịch vụ tài chính khác nhau nhằm kết nối người mua\nvà người bán trên thị trường tài chính. Những người tham gia thị trường muốn mua hoặc bán chứng khoán có thể sử dụng\ncác dịch vụ của nhà môi giới hoặc đại lý:\nNhà môi giới tạo điều kiện cho khách hàng giao dịch nhưng không giao dịch với khách hàng.\nCác đại lý đóng vai trò là đối tác và giao dịch với khách hàng.\nMột thước đo tính thanh khoản thị trường đề cập đến khả năng mua hoặc bán của người tham gia khi họ\nmuốn giao dịch với chi phí giao dịch thấp ở mức giá thị trường. Bằng cách đóng vai trò là đối tác cho\ngiao dịch của khách hàng, đặc biệt khi điều kiện thị trường khiến việc tìm kiếm đối tác sẵn sàng trở nên khó khăn hơn\n, các đại lý sẽ cung cấp tính thanh khoản cho thị trường (Lựa chọn A) . Các nhà môi giới chỉ cố gắng tìm\nđối tác cho các giao dịch của khách hàng, điều này không bổ sung tính thanh khoản cho thị trường.\n(Lựa chọn C) Các ngân hàng thế chấp cung cấp tính thanh khoản cho thị trường cho vay thế chấp\nbằng cách chứng khoán hóa các khoản vay thế chấp, cung cấp vốn mà các ngân hàng thế chấp có thể cho những người mua bất động sản\nkhác vay với lãi suất thấp hơn. Tác động kết hợp của cả hai loại hoạt động này làm tăng\ntính thanh khoản cho thị trường cho vay thế chấp.\nNhững điều cần nhớ:\nCác nhà môi giới và đại lý là những trung gian tài chính giúp những người tham gia thị trường mua và bán\nchứng khoán. Các đại lý giao dịch trực tiếp với những người tham gia, do đó họ cung cấp tính thanh khoản cho thị trường.\nCác nhà môi giới cố gắng tìm đối tác cho những khách hàng muốn giao dịch của họ; họ không đóng vai trò là đối tác\n nên họ không cung cấp tính thanh khoản cho thị trường. Các ngân hàng thế chấp cung cấp tính thanh khoản cho\nthị trường thế chấp thông qua chứng khoán hóa.\nMô tả các loại trung gian tài chính và dịch vụ mà họ cung cấp\nLOS","qhtml":null},{"n":85,"q":"The purpose of a repo margin is most likely to:","opts":["provide a return to the lender.","shield the borrower from counterparty risk.","protect the lender from a decline in collateral value."],"ans":"C","expl":"Các yếu tố ảnh hưởng đến ký quỹ repo\nChất lượng tài sản thế chấp càng cao thì ký quỹ càng thấp\nYêu cầu ký quỹ thấp hơn nếu tài sản thế chấp cụ thể ở mức cao\nNhu cầu tài sản đảm bảo\nnhu cầu\nThời hạn của repo càng dài thì biên lợi nhuận càng cao\nĐộ tin cậy của đối tác càng cao, tỷ suất lợi nhuận thấp\nRủi ro của bên đối tác\nTrong một thỏa thuận mua lại (\"repo\"), người mua repo, với tư cách là người cho vay, sẽ trao đổi tiền mặt\nđối với chứng khoán được cung cấp bởi người bán repo, với tư cách là người đi vay. Trên thực tế, chứng khoán là tài sản thế chấp\ncho nguồn tài chính ngắn hạn do repo cung cấp.\nNgười cho vay gặp rủi ro là người đi vay sẽ không mua lại tài sản thế chấp khi\nthỏa thuận kết thúc, không trả được nợ trên repo. Mặc dù người cho vay có thể bán tài sản thế chấp trên thị trường\n, nhưng có thể giá trị thị trường của nó sẽ giảm kể từ khi repo được bắt đầu.\nĐể bảo vệ người cho vay khỏi bị giảm giá trị tài sản thế chấp trong trường hợp vỡ nợ, giá trị của\ntài sản thế chấp lớn hơn số tiền thực sự được vay (ví dụ: 102%, 105%).\nSự khác biệt giữa giá trị của tài sản thế chấp và giá trị tài sản thế chấp số tiền được vay là repo\nmargin . Độ lớn của biên độ repo phụ thuộc vào:\nchất lượng của tài sản thế chấp,\nnhu cầu về tài sản thế chấp cụ thể,\nthời hạn của repo và\nđộ tin cậy của đối tác.\n(Lựa chọn A) Lợi nhuận của người cho vay (tức là lãi suất) khi cung cấp tiền mặt cho người đi vay là\nkhoản repo rate.\n(Lựa chọn B) Biên độ repo bảo vệ người cho vay khỏi rủi ro đối tác chứ không phải người đi vay.\nNhững điều cần nhớ:\nBiên độ thỏa thuận mua lại (\"repo\") là chênh lệch giữa giá trị tiền mặt\nđược vay và giá trị của tài sản thế chấp. Ký quỹ repo bảo vệ người cho vay khỏi rủi ro vỡ nợ của đối tác\nvà sự suy giảm giá trị tài sản thế chấp.\nMô tả các thỏa thuận mua lại (repos), cách sử dụng cũng như lợi ích và rủi ro của chúng.\nLOS","qhtml":null},{"n":86,"q":"A Japanese corporation makes a public offering of EUR-denominated bonds in the French\ndomestic bond market. From a French investor's perspective, these securities are most\nlikely considered:","opts":["Eurobonds.","foreign bonds.","domestic bonds."],"ans":"B","expl":"Phân loại trái phiếu theo địa lý\nTrái phiếu trong nước Trái phiếu nước ngoài Eurobonds\nNhà phát hành Giống như quốc gia\nKhác với quốc gia phát hành\nnơi phát hành\nTiền tệ Tiền tệ trong nước (địa phương) Ngoại tệ\nNhiều\nQuyền tài phán Các quy tắc pháp lý, quy định và thuế trong nước\nmiễn trừ\nTrái phiếu nước ngoài là chứng khoán nợ được phát hành trên thị trường trong nước bởi nhà phát hành\ncó trụ sở ở nước ngoài . Chứng khoán được tính bằng đồng nội tệ và tuân theo luật pháp địa phương,\nquy định và thuế. Các tổ chức phát hành nước ngoài phát hành những chứng khoán đó để giảm rủi ro tiền tệ đối với\nthu nhập của các công ty con trong nước và/hoặc để tiếp cận vốn với lãi suất hấp dẫn.\nTrong trường hợp này, khoản nợ của công ty Nhật Bản phát hành ở Pháp và có mệnh giá bằng\nEUR, là đồng nội tệ nơi phát hành trái phiếu, được coi là trái phiếu nước ngoài trong\nthị trường trái phiếu Pháp.\n(Lựa chọn A) Trái phiếu châu Âu là chứng khoán nợ được phát hành bên ngoài thị trường nội địa của tổ chức phát hành;\nchúng được phát hành ở một quốc gia và có mệnh giá bằng đồng tiền của một quốc gia khác. Trái phiếu châu Âu\ncó nhiều miễn trừ đối với các quy tắc, quy định và thuế địa phương thường dẫn đến chi phí vốn\nso với việc phát hành trái phiếu trong nước thấp hơn. Hầu hết các tổ chức phát hành huy động vốn bên ngoài\nthị trường trong nước của họ đều làm như vậy trên thị trường Eurobond.\n(Lựa chọn C) Trái phiếu trong nước là chứng khoán nợ được phát hành trong quốc gia mà tổ chức phát hành\ncó trụ sở và có mệnh giá bằng đơn vị tiền tệ của quốc gia đó. Những vấn đề này phải tuân theo\nluật, quy định và thuế địa phương. Hầu hết chứng khoán nợ được phát hành là trái phiếu trong nước.\nNhững điều cần nhớ:\nKhi phân loại trái phiếu theo địa lý, có ba loại: trái phiếu trong nước, trái phiếu nước ngoài\nvà trái phiếu châu Âu. Trái phiếu nước ngoài là chứng khoán nợ được phát hành trên thị trường trong nước bởi một\ntổ chức phát hành có trụ sở nước ngoài. Chứng khoán được tính bằng đồng nội tệ của quốc gia\nnơi chúng được phát hành và tuân theo luật pháp, quy định và thuế địa phương.\nMô tả các phân khúc thị trường có thu nhập cố định cũng như nhà phát hành và nhà đầu tư tham gia.\nLOS","qhtml":null},{"n":87,"q":"All else being equal, as soon as the coupon on a bond is paid, the quoted price of that bond\nfrom a bond dealer will most likely :","opts":["decrease.","remain the same.","increase."],"ans":"B","expl":"Giá thị trường niêm yết hoặc giá cố định (tức là giá sạch) của trái phiếu, không\nbao gồm lãi tích lũy. Do đó, tất cả các yếu tố khác đều như nhau, vào ngày thanh toán lãi trái phiếu,\ngiá niêm yết của trái phiếu vẫn giữ nguyên . Việc chỉ trích dẫn giá cố định sẽ tách thành phần lãi suất\ntích lũy luôn làm tăng giá khỏi các yếu tố khác (ví dụ: thay đổi về\nlãi suất hoặc chất lượng tín dụng) phù hợp hơn với các nhà đầu tư.\nGiá đầy đủ của trái phiếu (tức là giá bẩn) hoặc tổng số tiền mà nhà đầu tư trả cho trái phiếu, bằng\ngiá cố định cộng với lãi tích lũy. Tiền lãi tích lũy mỗi ngày; do đó, toàn bộ giá\ntăng mỗi ngày cho đến khi thanh toán phiếu giảm giá được thực hiện, tại thời điểm đó tiền lãi tích lũy giảm xuống\n0 (như minh họa trong hình trên). Vào ngày thanh toán phiếu lãi, giá cố định và giá\nđầy đủ giống nhau.\n(Lựa chọn A và C) Quy ước định giá thị trường tiêu chuẩn là đưa ra giá cố định\nkhông bao gồm lãi tích lũy. Do đó, thanh toán lãi coupon không ảnh hưởng đến\ngiá niêm yết của trái phiếu.\nNhững điều cần nhớ:\nGiá thị trường niêm yết là giá cố định của trái phiếu, không bao gồm lãi tích lũy.\nDo đó, thanh toán coupon không ảnh hưởng đến giá niêm yết của trái phiếu. Người mua thanh toán đầy đủ\ngiá (tức là giá cố định cộng với tiền lãi tích lũy).\nTính giá trái phiếu dựa trên lợi tức đến ngày đáo hạn vào hoặc giữa các ngày phiếu lãi.\nLOS","qhtml":null},{"n":88,"q":"50,000 bonds with a 15-year maturity were issued 10 years ago and are currently trading at\n110. The indenture contains a sinking fund provision that retires 10% of the outstanding\nbonds every year for the next four years (starting now). If an investor bought 500 bonds at\nissuance, which of the following is the best outcome for the investor this year?","opts":["All bonds are redeemed.","50 bonds are redeemed.","No bonds are redeemed."],"ans":"C","expl":"Cung cấp quỹ chìm\nLịch trình định trước để rút lại một phần\nvấn đề trái phiếu trước khi đáo hạn\nkhiến các trái chủ gặp phải:\nRủi ro tái đầu tư\nRủi ro tín dụng giảm dần\nMột thỏa thuận quỹ chìm nêu chi tiết về lịch trình rút dần một phần tiền gốc của trái phiếu\n. Đối với người nắm giữ trái phiếu (tức là nhà đầu tư), điều khoản này có thể mang lại lợi ích hoặc\ngây bất lợi, tùy thuộc vào hoàn cảnh. Quỹ chìm giảm dần rủi ro tín dụng bằng cách\ngiảm mức độ tiếp xúc với một đợt phát hành trái phiếu cụ thể. Tuy nhiên, việc trả nợ gốc sớm làm tăng\nrủi ro tái đầu tư vì số tiền thu được phải được tái đầu tư ở mức lãi suất khác—và có lẽ thấp hơn—\n.\nCác điều khoản của quỹ chìm thường hoạt động trên cơ sở xổ số, với số lượng\ntrái phiếu được xác định trước (ví dụ: 10%) được chọn ngẫu nhiên dựa trên số sê-ri hoặc số nhận dạng tương tự.\nXổ số quỹ chìm này tạo ra một tình huống trong đó các nhà đầu tư cá nhân có thể có tất cả, không có hoặc\nbất kỳ số lượng trái phiếu nào được mua lại.\nTrong trường hợp này, với trái phiếu được giao dịch ở mức chênh lệch lớn (tức là 110), việc mua lại ở mệnh giá (tức là\n100) do điều khoản quỹ chìm sẽ gây bất lợi cho nhà đầu tư kể từ khi được mua lại\nprincipal bây giờ phải được tái đầu tư với lãi suất thấp hơn. Do đó, kết quả tốt nhất cho\nnhà đầu tư là không có trái phiếu nào trong số 500 trái phiếu được mua lại (Lựa chọn A và B).\nNhững điều cần nhớ:\nThỏa thuận quỹ chìm nêu chi tiết về lịch trình rút dần tiền gốc của trái phiếu. Đối với\ntrái chủ, điều khoản này có thể làm giảm rủi ro tín dụng nhưng cũng làm tăng rủi ro tái đầu tư\n.\nMô tả cấu trúc dòng tiền chung của các công cụ thu nhập cố định và dòng tiền tương phản\ncác điều khoản dự phòng mang lại lợi ích cho tổ chức phát hành và nhà đầu tư.\nLOS","qhtml":null},{"n":89,"q":"All else equal, which of the following is most likely to cause futures and forward contract prices\nto differ? Differences in:","opts":["contract liquidity.","counterparty credit risk.","timing of gain/loss realization."],"ans":"C","expl":"Hợp đồng tương lai so với hợp đồng kỳ hạn\nHợp đồng tương lai\nĐịa điểm giao dịch Trao đổi phi tập trung\nĐối tác hợp pháp Cơ quan thanh toán bù trừ sàn giao dịch Đối tác hợp đồng\nĐiều khoản hợp đồng Được tiêu chuẩn hóa Đã thương lượng (tức là không được tiêu chuẩn hóa)\nGhi nhận lãi/lỗ Thanh toán hàng ngày Khi hết hạn\nHợp đồng kỳ hạn và hợp đồng tương lai có cùng tài sản cơ sở và thời hạn đáo hạn có thể khác nhau\ngiá hợp đồng do mô hình dòng tiền khác nhau , phản ánh thời điểm thu được lợi nhuận khác nhau\nvà thực hiện tổn thất:\nLãi và lỗ hợp đồng kỳ hạn được thực hiện khi hợp đồng hết hạn.\nLãi và lỗ hợp đồng tương lai được thực hiện hàng ngày.\nNếu giá tương lai có tương quan với lãi suất và nếu có bất kỳ sự biến động nào về lãi suất thì\nsự khác biệt về thời điểm lãi và lỗ dẫn đến giá kỳ hạn và giá kỳ hạn khác nhau.\nVì hợp đồng tương lai thanh toán hàng ngày nên lãi (lỗ) của họ được tái đầu tư (tài trợ) sớm hơn và\nthường xuyên hơn so với các hợp đồng kỳ hạn, có lãi (lỗ) được tái đầu tư (tài trợ)\nchỉ khi hết hạn. Điều này dẫn đến sự khác biệt về giá. Nếu lãi suất không tương quan với\ntương lai hoặc nếu lãi suất không đổi thì giá tương lai và giá kỳ hạn bằng nhau.\nVì giá của cả hai loại hợp đồng đều phản ánh chi phí định giá chênh lệch giá thực hiện nên cả hai loại đều không\nthanh khoản cũng như rủi ro tín dụng đối tác ảnh hưởng đến hợp đồng tương lai không có chênh lệch giá hoặc kỳ hạn\ngiá (Lựa chọn A và B). Tính thanh khoản ảnh hưởng đến mức độ chênh lệch giá chào mua; sự khác biệt trong\nrủi ro tín dụng đối tác ảnh hưởng đến tài sản thế chấp mà nhà đầu tư phải cung cấp để giao dịch kỳ hạn nhưng\nkhông ảnh hưởng tới giá của chúng.\nNhững điều cần nhớ:\nNếu giá tương lai có tương quan với lãi suất và nếu có bất kỳ sự biến động nào về lãi suất thì\nsự khác biệt về thời điểm lãi và lỗ dẫn đến giá kỳ hạn và giá kỳ hạn khác nhau.\nVì hợp đồng tương lai thanh toán hàng ngày nên lãi (lỗ) của họ được tái đầu tư (tài trợ) sớm hơn và\nthường xuyên hơn so với các hợp đồng kỳ hạn, có lãi (lỗ) được tái đầu tư (tài trợ)\nchỉ khi hết hạn. Điều này dẫn đến sự khác biệt về giá. Nếu lãi suất không tương quan với\ntương lai hoặc nếu lãi suất không đổi thì giá tương lai và giá kỳ hạn bằng nhau.\nGiải thích tại sao giá kỳ hạn và giá tương lai khác nhau\nLOS","qhtml":null},{"n":90,"q":"Compared to traditional investments, alternative investments are most likely to:","opts":["have concentrated portfolios.","be highly regulated due to the risks involved.","have managers who are investment generalists."],"ans":"A","expl":"Đầu tư thay thế là đầu tư vào tài sản phi truyền thống, chẳng hạn như quỹ phòng hộ, vốn cổ phần\ntư nhân, cơ sở hạ tầng và hàng hóa. Các khoản đầu tư thay thế thường hoạt động ở những thị trường ít\nhiệu quả hơn, mang lại cho các nhà quản lý đầu tư tiềm năng lớn hơn để khai thác việc định giá sai\nthông qua các chiến lược đầu tư tích cực.\nCác đặc điểm điển hình của các khoản đầu tư thay thế bao gồm:\nDanh mục đầu tư tập trung được quản lý tích cực\nCác nhà quản lý là chuyên gia trong lĩnh vực của họ (ví dụ: công nghệ sinh học dài hạn)\nÍt hơn quy định và tính minh bạch\nPhí quản lý cao\nHạn chế mua lại\n(Lựa chọn B) So với các khoản đầu tư truyền thống, các khoản đầu tư thay thế chịu ít\nquy định hơn, dẫn đến ít yêu cầu báo cáo hơn và kém minh bạch hơn về\nchiến lược, vị thế và hiệu suất đầu tư.\n(Lựa chọn C) Các nhà quản lý đầu tư thay thế có xu hướng tập trung vào các chuyên gia hẹp trong\ncác lĩnh vực tương ứng của họ, không phải các chuyên gia đầu tư tổng quát.\nNhững điều cần nhớ:\nCác khoản đầu tư thay thế có xu hướng được quản lý tích cực bởi các danh mục tập trung, được giám sát bởi\ncác chuyên gia đầu tư và có ít sự giám sát theo quy định hơn so với các khoản đầu tư\ntruyền thống.\nMô tả các tính năng và danh mục đầu tư thay thế\nLOS","qhtml":null}];
const CFG = {"title": "UWorld Mock Exam 1 — Session 2", "subtitle": "UWorld · CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
