, such orders are also known as fill-or-kill orders .\n(Choice A) Instructions to trade only if the entire order can be filled are known as all-or-\nnothing (AON) orders. These orders do not determine when but how the order should be\nfilled; therefore, AON orders are a type of execution instruction.\n(Choice C) Displaying just part of the order size to the market is another form of execution\ninstruction. The hidden part is revealed to traders only after they buy or sell the displayed\nsize. Such orders are usually called iceberg orders.\nThings to remember:\nValidity instructions refer to when an order can be filled, as well as how long an unfilled order\nshould remain open before it expires. If an immediate-or-cancel (fill-or-kill) order cannot be\ninstantly filled, it is canceled; if it is instantly but partially filled, the remainder of the order is\ncanceled.\nCompare execution, validity, and clearing instructions\nLOS", "qhtml": null}, {"n": 65, "q": "Which of the following is least likely to be a feature of futures contracts? Buyers and sellers:", "opts": ["must meet initial margin requirements.", "negotiate the quantity of the underlying asset.", "use a clearinghouse as their legal counterparty."], "ans": "B", "expl": "Features of futures contracts\nContractual Short (long) party obligated to sell (buy)\ncommitments underlying asset\nExchange traded No over-the-counter trading of futures\nExchange clearinghouse as legal\nClearinghouse\ncounterparty\nStandardized\nExchange sets all contract terms\ncontracts\nMargin requirements Cash deposits to cover losses on positions\nGains and losses on open positions realized\nDaily settlement\nin cash daily\nAllowable price change from previous day's\nDaily price limits\nsettlement price\nFutures contracts are standardized contracts : contract terms such as the quantity of the\nunderlying asset or the contract expiration are established by the exchange where each\ncontract is traded. The buyers and sellers of futures cannot alter these terms. Negotiated\ncontract terms are a feature of over-the-counter (OTC) derivatives (eg, forward contracts).\n(Choice A) Both the buyer and seller must meet margin requirements by depositing cash as\na performance bond available to cover losses on their positions. The margin requirements are\nset by the exchange where the contract is traded.\n(Choice C) Although a futures contract is created by a trade between a buyer and seller, the\nexchange clearinghouse becomes the legal counterparty on the contract after the trade is\ninitiated.\nThings to remember:\nFutures contracts are exchange-traded derivatives that are standardized by the exchange so\nthat buyers and seller do not negotiate the contract terms. The exchange clearinghouse\nbecomes the legal counterparty to all traders, who must meet the exchange's margin\nrequirements.\nDefine forward contracts, futures contracts, swaps, options (calls and puts), and credit derivatives\nand compare their basic characteristics\nLOS", "qhtml": null}, {"n": 66, "q": "An investor sells a European call option for €7 with a strike price of €150 on a stock trading at\n€140 with 3 months to expiration. Based on only this information, if the stock is trading at\n€145 at expiration, the seller's profit (in €) is closest to:", "opts": ["2", "5", "7"], "ans": "C", "expl": "A European call (put) option gives its buyer (ie, long call [put] position) the right—but not\nthe obligation—to purchase (sell) an underlying asset at the exercise price (ie, strike price) on\nthe date of expiration. The option seller (ie, short call\nposition) sells this right and collects a premium , which is the price of the option contract.\nAt expiration, if the option is in the money, the call will be exercised and the seller will be\nforced to sell the stock to the buyer at the strike price. However, as in this case, if the call\nis out of the money and the price of the stock ST is less than the exercise price\nX (ie, 145 < 150), the option will expire with no value CT (ie, at zero). The\nseller's profit ⊓ will then be the option premium (ie, €7).\nThe premium received is always the maximum profit for the seller of an option contract.\nPotential losses in a short call position are theoretically unlimited since there is no limit on how\nhigh the price of the underlying stock may go.\n(Choice A) A €2 profit would result from a short put position (ie, 7 − 5).\n(Choice B) €5 would be the exercise value of a long put position (ie, 150 − 145).\nThings to remember:\nA European call option gives its buyer the right, but not the obligation, to purchase an\nunderlying asset at the exercise price on the date of expiration. The option seller sells this\nright and collects a premium. The premium received is always the maximum profit for the\nseller of an option contract.\ndetermine the value at expiration and profit from a long or a short position in a call or put option\nLOS", "qhtml": null}, {"n": 67, "q": "At the beginning of the year, a new fund of funds invests £300 million equally among three\nhedge funds. The fund of funds has a \"1 and 10\" fee structure and a 5% soft hurdle rate.\nManagement and incentive fees are calculated independently at year end. After one year, the\nreturns of the underlying hedge funds, gross of fees, are −2%, 6%, and 10%. The total fees\npaid to the fund of funds is closest to:", "opts": ["£3.14 million.", "£4.54 million.", "£4.74 million."], "ans": "A", "expl": "A fund of funds (FoF) is a hedge fund that invests in other hedge funds . Hedge funds\noften levy both a management fee and an incentive fee. The management fee is calculated\nas a percentage of the fund's total ending assets under management (AUM) and is\nassessed regardless of profitability . The incentive fee is calculated as a percentage of\nprofits either net of (ie, after deducting) or gross of (ie, before deducting) the management\nfee; incentive fees assessed on a gross basis are said to be \"calculated independently.\"\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or the AUM\nbeing above the high-water mark. The FoF's fees and return are calculated as follows (year-\nend values and fees in £ millions):\nSteps Calculations\nFoF year-end value = year-end value of each fund 98 + 106 + 110 = 314\nCalculate return before fees (300 = initial investment) (314 − 300) / 300 ≈ 4.67%\nCalculate management fee 314 × 0.01 = 3.14\nIn this scenario, the FoF's threshold to earn an incentive fee depends on the profits exceeding\nthe hurdle rate. Since the 4.67% return does not exceed the 5% hurdle rate, no incentive fee\nis paid.\n(Choice B) Total fees of £4.54 million result from inappropriately assuming a soft hurdle\nincentive fee is paid on all gains.\n(Choice C) Total fees of £4.74 million result from inappropriately assuming a soft hurdle\nincentive fee is paid on the two underlying hedge funds that exceeded the hurdle rate.\nThings to remember:\nA fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often\nlevy both a management fee and an incentive fee. Investors incur fees from both the FoF and\nits underlying hedge funds.\nCalculate and interpret alternative investment returns both before and after fees\nLOS", "qhtml": null}, {"n": 68, "q": "Two market-cap weighted indexes are created with the same stocks and stock weights, one as\na total return index and one as a price return index. If the stocks repurchase shares instead\nof paying dividends, after 1 year, which index will most likely have the greater return?", "opts": ["The total return index", "The price return index", "The indexes will have the same return"], "ans": "C", "expl": "Return indexes\nPrice return Total return\nReflects only prices of Reflects both prices and income of\nsecurities securities\nEqual to total return if no Greater than price return if securities\nsecurities generate income generate income\nThe return on an index can be calculated as a price return index or a total return index.\nA price return index reflects the price change of each constituent security.\nA total return index reflects both the price change of each constituent security and any\ndividend and/or interest income from that security.\nThe difference between a total return index and a price return index is the return on\ndividend and/or interest income.\nThe value of share repurchases is reflected in a stock's price. Repurchases have the same\neffect on both types of return index since they both capture price changes. In this scenario,\nthe two indexes have the same constituent stocks held in the same proportions, and no\ndividends are paid; therefore, they will have the same return (Choices A and B) .\nThings to remember:\nA price return index reflects the change in price of each constituent security, while a total\nreturn index also includes any income (eg, dividends, interest) from the securities. Share\nrepurchases are reflected in a stock's price and price changes are captured by both price\nreturn and total return, repurchases would have the same effect on both return measures.\nCalculate and interpret the value, price return, and total return of an index\nLOS", "qhtml": null}, {"n": 69, "q": "A six-month European put option on a common stock is valued at €39, while an otherwise\nidentical one-year put option is valued at €38. All else being equal, which of the following best\ndescribes the circumstance that results in this price difference?", "opts": ["The options are deep in the money.", "The stock pays a dividend in nine months.", "The underlying stock's volatility has increased."], "ans": "A", "expl": "Generally, an option with a longer time to expiration is more valuable than a shorter-dated but\notherwise identical option. However, this is not always the case for a deep-in-the-\nmoney European put option since it cannot be exercised until expiration , and its strike\nprice must be discounted by the risk-free rate to account for this delay.\nDue to discounting, a longer-dated put can have less intrinsic value than a shorter-dated put.\nIn this scenario, assume that the stock trades at zero while the put option has a strike price\nof €40 and a 5% risk-free rate. The present value of the strike price, discounted for one year\nat the risk-free rate, is about €38. This is lower than the six-month put's present value of\nabout €39.\n(Choice B) A European put's value increases if a dividend is paid since the payment\ndecreases the value of the underlying. All else equal, the one-year put should be\nworth more than the six-month put, given a dividend payment in nine months.\n(Choice C) The value of a put is directly related to the stock's volatility, regardless of the\ntime to expiration. In this case, the values of both puts would be similarly affected by an\nincrease in volatility.\nThings to remember:\nThe strike price of an in-the-money-European put option must be discounted at the risk-free\nrate to account for the inability to exercise before expiration. Due to discounting, a longer-\ndated put can have less intrinsic value than a shorter-dated put.\nIdentify the factors that determine the value of an option and describe how each factor affects the\nvalue of an option\nLOS", "qhtml": null}, {"n": 70, "q": "An analyst gathers the following information on spot rates:\nMaturity Spot Rate\n0.5 year 1.50%\n1.0 year 1.90%\n1.5 years 2.20%\n2.0 years 2.40%\nBased on this information, the price of a two-year 3% coupon bond that pays interest\nsemiannually is closest to:", "opts": ["96.64", "101.16", "101.18"], "ans": "C", "expl": "Fixed-rate bonds pay coupons at the end of each period and return the par value with the\nfinal coupon payment; a bond's price can be estimated as the sum of the present value of\neach cash flow. Zero-coupon bonds make only a single payment at maturity, so a coupon\nbond can be priced as if it were a series of zero-coupon bonds with par values equal to the\ncoupon bond's cash flows and maturities matching the payment of those cash flows.\nSpot rates are the YTM on zero-coupon bonds , so the rates provided here can be used to\ncalculate the present values of each of the coupon bond's cash flows. For this scenario:\nEach periodic coupon payment is 0.03 × 100 ÷ 2 = 1.50.\nThe stated (ie, annual) spot rates are converted to periodic (semiannual) equivalent\nrates by dividing by the bond's periodicity (2).\n(Choice A) 96.64 results from discounting each cash flow by 1 plus the stated spot rate,\ntherefore failing to convert the annual rates to their semiannual equivalent.\n(Choice B) 101.16 results from discounting each cash flow by the semiannual equivalent of\nthe two-year spot rate (1.2%).\nThings to remember:\nA coupon bond can be priced as if it were a series of zero-coupon bonds with par values equal\nto the coupon bond's cash flows and maturities matching the payment of those cash flows.\nThe individual cash flows are discounted by the YTM of a zero-coupon bond (ie, spot rate).\nThe spot rate must be converted to a periodic equivalent rate for bonds with a periodicity\ngreater than 1.\nDefine spot rates and the spot curve, and calculate the price of a bond using spot rates.\nLOS", "qhtml": null}, {"n": 71, "q": "A company has a forward price-to-earnings (P/E) of 5. In reviewing the company's financial\ndata, an analyst estimates a justified forward P/E of 4. Based on the justified forward P/E, the\nstock is:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "C", "expl": "The price-to-earnings (P/E) ratio is the company's stock price as a multiple of its earnings per\nshare.\nA forward P/E ratio is based on the observed market price and a forward earnings\nestimate.\nA justified forward P/E ratio is based on an intrinsic value for price and a forward\nearnings estimate.\nThe justified forward P/E ratio can be compared with other forms of the P/E ratio to determine\nwhether a stock is mispriced. If the justified forward P/E based on intrinsic value\nis less (greater) than the forward P/E based on market value, the stock is\nconsidered overvalued (undervalued) by the market (Choices A and B) . In this scenario,\nthe justified forward P/E ratio of 4 is less than the forward P/E ratio of 5, indicating that the\nstock is overvalued.\nThe difference in the two P/Es can be explained by assumptions for the required rate of return\nor the growth rate used to determine intrinsic value.\nThings to remember:\nThe justified forward price-to-earnings (P/E) ratio can be compared with other forms of the\nP/E ratio to determine whether a stock is mispriced. If the justified forward P/E based on\nintrinsic value is less (greater) than the forward P/E based on market value, the stock is\nconsidered overvalued (undervalued) by the market.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple\nrelates to fundamentals, and the use of multiples based on comparables\nLOS", "qhtml": null}, {"n": 72, "q": "A company's noncallable, nonconvertible preferred stock pays dividends of $5 per share and\nhas a required rate of return of 8%. If the required rate of return decreases to 7.5%, then the\nvalue of the preferred stock would most likely :", "opts": ["increase by $4.17 per share.", "decrease by $4.17 per share.", "change to $4.65 per share."], "ans": "A", "expl": "at at\n( r = 8.0%) ( r = 7.5%)\nDividend ( D )\n5.00 5.00\n0\n÷ Discount rate ( r ) 0.08 0.075\nValue ( V )\n= 62.50 66.67\n0\nΔ V = 66.67 − 62.50 = $4.17\n0\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash\nflows are forever the same, preferred stock is valued as a perpetuity and its present value is\ncalculated using the perpetuity formula, that is, by dividing the dividend payment\nby the required rate of return .\n(Choice B) The value of the stock increased, not decreased, by $4.17.\n(Choice C) $4.65 results from dividing $5 by (1 + 7.5%).\nThings to remember:\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash\nflows are forever the same, preferred stock is valued as a perpetuity and its present value is\ncalculated using the perpetuity formula, that is, by dividing the dividend payment by the\nrequired rate of return.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock\nLOS", "qhtml": null}, {"n": 73, "q": "Which of the following models most likely estimates equity value from the market value of\nbalance sheet items?", "opts": ["Multiplier models", "Present value models", "Asset-based valuation models"], "ans": "C", "expl": "Model type Stock's intrinsic value derived by:\nPresent value Discounting projected free cash flows or dividends at a required rate of return\nMultiplying a financial metric (eg, EBITDA, revenue, net income) by a market\nMultiplier\nmultiple (EV / EBITDA, EV / revenue, P/E)\nAsset-based\nSubtracting the fair value of liabilities from the fair value of assets\nvaluation\nEV = enterprise value.\nAnalysts use valuation models to estimate the intrinsic value of a stock to determine whether\nit is fairly valued. Common forms of valuation models include present value, multiplier, and\nasset-based valuation.\nWith an asset-based valuation model , the firm's equity value (ie, value to shareholders)\nequals the fair value of assets minus the fair value of liabilities . Analysts often start with\nthe book values of line items on the balance sheet and make fair value adjustments to derive\nthe market value of all total assets and liabilities. The underlying rationale is that the value of\nthe firm can be represented by the value of its assets, and therefore the value of the firm's\nequity equals the fair value of the firm's assets less liabilities.\n(Choice A) Multiplier models typically involve applying a market multiple to a financial metric\nsuch as EBITDA or revenue. These metrics are usually not found on the balance sheet.\n(Choice B) Present value models are used to discount a firm's future cash flows or\ndividends. The process typically does not directly involve tying the market value of assets and\nliabilities to the firm's value.\nThings to remember:\nUnder the asset-based valuation model, the firm's equity value (ie, value to shareholders)\nequals the fair value of assets minus the fair value of liabilities. The underlying rationale is\nthat the value of the firm can be represented by the value of its assets, and therefore the\nvalue of the firm's equity equals the fair value of the firm's assets less liabilities.\nDescribe major categories of equity valuation models\nLOS", "qhtml": null}, {"n": 74, "q": "A corporate borrower plans to close on a bank loan in 30 days, when the loan terms will be\nfinalized. The interest rate on the loan is tied to 90-day SOFR. Based on only this\ninformation, which of the following transactions most appropriately hedges the company's\ninterest rate risk?", "opts": ["Long 30-day forward rate agreement (FRA) on 90-day SOFR", "Long 90-day forward rate agreement (FRA) on 90-day SOFR", "Long 120-day forward rate agreement (FRA) on 90-day SOFR"], "ans": "A", "expl": "A forward rate agreement (FRA) is a forward contract in which the underlying is not an\nasset, but a reference interest rate (eg, 90-day SOFR). A party planning to borrow in the\nfuture can buy an FRA to hedge against an increase in interest rates, and potential lenders can\nsell an FRA to hedge against a decrease in interest rates. To be most effective, the FRA's:\nexpiration should align with the initiation of the future loan, and its\nreference rate should align with the reference rate of the loan.\nIn this scenario, the buyer is hedging against higher 90-day SOFR rates in 30 days, when the\nterms of the loan will be finalized. Therefore, a long 30-day FRA on 90-day SOFR is the most\nappropriate contract to hedge the risk (Choices B and C) .\nThings to remember:\nA forward rate agreement (FRA) is a forward contract in which the underlying is not an asset,\nbut a reference interest rate. A party planning to borrow in the future can buy an FRA to\nhedge against an increase in interest rates. To be most effective, the expiration of the FRA\nshould align with the initiation of the future loan, and its reference rate should align with the\nreference rate of the loan.\nExplain how forward rates are determined for interest rate forward contracts and describe the uses\nof these forward rates.\nLOS", "qhtml": null}, {"n": 75, "q": "All else being equal, key rate duration is most appropriate for assessing the interest rate risk\nof callable bonds if:", "opts": ["yield volatility is increasing.", "yield spreads are widening.", "the yield curve is steepening."], "ans": "C", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to\nEffective All\nparallel shift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate within a portion of benchmark yield All\ncurve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nThe early retirement option embedded in callable bonds creates uncertainty about future cash\nflows. Two types of duration are used to evaluate the effect of early retirement options on\ncash flows payable over an uncertain time horizon:\nEffective duration assumes parallel shifts in the benchmark yield curve, and\nkey rate duration is based on a change in the shape (ie, shaping risk) of\nthe benchmark yield curve .\nA bond's key rate duration is calculated by assuming changes in one or more yields on the\nbenchmark yield curve. A steepening of the yield curve could result from a decrease in short-\nterm rates, an increase in long-term rates, or a combination of both. The assumed change in\nthe benchmark curve is used to evaluate the effect on the embedded call option and cash\nflows over the life of the bond.\n(Choice A) Yield volatility affects bond values but is not a factor measured by key rate\nduration.\n(Choice B) Corporate bond yields reflect a benchmark government bond yield and a yield\nspread over that benchmark. The spread reflects the issuer's credit risk and the bond issue's\nliquidity risk. Key rate duration is based on changes in the benchmark yield curve, so it does\nnot directly incorporate changes in yield spreads.\nThings to remember:\nKey rate duration measures the effect on a callable bond's value caused by changes in one or\nmore yields on a benchmark yield curve. The shape or slope of the yield curve reflects the\nimpact of those changes.\nDefine key rate duration and describe its use to measure price sensitivity of fixed-income\ninstruments to benchmark yield curve changes.\nLOS", "qhtml": null}, {"n": 76, "q": "Debtholders of a subordinated bond recovered 15% of their bond's value during a bankruptcy\nwhile the holders of a senior secured bond recovered 75% of their bond's value. The most\nlikely explanation is that the:", "opts": ["various classes of claimants agreed to a negotiated settlement.", "value of the secured property was less than the amount of the claim.", "preferred shareholders received distributions first based on the priority of claims."], "ans": "A", "expl": "For issuers with multiple debt issues outstanding, indentures establish seniority rankings that\ndetermine the priority of claims for the different classes of investors. During a bankruptcy,\nstrict adherence to the priority of claims results in sequential payment in full, according to the\nseniority of each class of claimants.\nIf subordinated debtholders receive partial payment before secured and senior debtholders are\npaid in full, then the priority of claims was not strictly adhered to. A likely reason is that\nthe various classes of claimants negotiated a settlement to avoid litigation, which would\nreduce assets available for recovery.\nIn this scenario, the subordinated debtholders received 15% of their claim while the senior\nsecured debtholders received 75% of theirs, suggesting the various claimants agreed to such\na settlement. If the priority of claims were strictly followed, the senior secured debtholders\nwould have received 100% of their claim before lower classes received any distributions.\n(Choice B) In cases where the value of the secured property is less than the amount of the\nclaim, shortfalls are given a status equal to the claims of senior unsecured creditors. This\nclaim still takes priority over subordinated debtholders based on the priority of claims.\n(Choice C) Shareholders, including preferred shareholders, have claims junior to those of all\ndebtholders. They will receive distributions only after all liability holders' claims are paid in\nfull, assuming adherence to the priority of claims.\nThings to remember:\nSecured and senior unsecured bond classes have a higher priority of claims on a company's\nassets during bankruptcies. If subordinated debtholders receive partial payment before\nsecured and senior debtholders are paid in full, a likely reason is that the various classes of\nclaimants negotiated a settlement to avoid litigation.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in\nbankruptcy, and their impact on credit ratings.\nLOS", "qhtml": null}, {"n": 77, "q": "If a noncallable bond has an annual modified duration of 9.718 and an annual convexity of\n167.574, the estimated percentage price increase if its YTM declines by 50 basis points\nis closest to:", "opts": ["4.65%", "4.86%", "5.07%"], "ans": "C", "expl": "Duration and convexity can be used to estimate percentage changes in bond prices. Modified\nduration measures the change in a bond's price for a given change in its YTM, and convexity\nmeasures the change in the bond's price sensitivity.\nDuration-based estimates of price change reflect the inverse relationship between bond prices\nand yields. To capture the direction of price sensitivity changes, the price\nimpact of convexity should be:\nadded to the percentage price change due to duration when YTM declines and\nsubtracted from the percentage price change due to duration when YTM increases .\n(Choice A) 4.65% results from mistakenly subtracting the convexity impact of the price\nchange estimated from the bond's modified duration rather than adding it. Convexity reduces\nbond price declines when interest rates rise, but increases price appreciation when a bond's\nYTM decreases.\n(Choice B) 4.86% is the estimated price change due to the bond's modified duration, but it\nfails to account for the bond's convexity.\nThings to remember:\nDuration and convexity can be used to estimate the percentage change in a bond's price for a\ngiven change in its YTM. For noncallable bonds, price change estimates based on duration are\nadjusted by adding the convexity effect when the YTM declines and subtracting the convexity\neffect when the YTM increases.\nCalculate the percentage price change of a bond for a specified change in yield, given the bond’s\nduration and convexity.\nLOS", "qhtml": null}, {"n": 78, "q": "An analyst gathers the following information on 10-year government benchmark rates (with\nYTMs assuming semiannual compounding):\nBenchmark YTM\nGovernment bond 4.18%\nInterest rate swap 4.28%\nGovernment spot rate 4.35%\nFor a 6% coupon semiannual pay corporate bond with 10 years to maturity and priced at\n100.35, the g -spread in basis points (bps) is closest to:", "opts": ["160 bps", "167 bps", "177 bps"], "ans": "C", "expl": "Yield curves display the term structure of interest rates by graphing the relationship between\nmaturities and bond yields. Many governments, including those of the UK, US, and Japan,\nregularly issue bonds with select maturities (eg, 2, 5, 10, and 30 years). These benchmark\nbonds form the basis of the government yield curve.\nThe g -spread is the difference between the YTM of a nongovernment bond relative to the\nYTM of a benchmark government bond with the same maturity . It quantifies the\nadditional yield (ie, spread) required by the market to own the riskier bond.\nIn this question, the YTM of the corporate bond can be derived from the information provided\nusing a financial calculator. Stated on a semiannual basis, the government bond's YTM is\n4.18%, and the corporate bond's YTM is 5.95%. Therefore, the g -spread is 0.0595 − 0.0418\n= 0.0177, or 177 bps.\n(Choice A) 160 bps (0.0595 − 0.0435 = 0.0160) is the difference between the YTM of the\nbond and the spot rate. It results from an inappropriate application of the Z-spread concept,\nwhich requires the entire benchmark curve's spot rates , not just a single period's YTM.\n(Choice B) 167 bps (0.0595 − 0.0428 = 0.0167) is the difference between the YTM of the\nbond and the benchmark swap rate, or i -spread.\nThings to remember:\nThe g -spread is the difference between the YTM of a nongovernment bond relative to the YTM\nof a benchmark government bond with the same maturity. It quantifies the additional yield\nrequired by the market to own the riskier bond.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.\nLOS", "qhtml": null}, {"n": 79, "q": "When evaluating the risk management policies of alternative investment managers, which of\nthe following is most likely considered a best practice?", "opts": ["Use of separately managed accounts", "In-house security valuation by a dedicated valuation expert", "Individual security position limits solely determined by each portfolio manager"], "ans": "A", "expl": "Alternative investment due diligence checklist\nTeam experience, key person risk, and reputation\nReputation of third-party service providers (eg,\nOrganization\nauditors, prime broker)\nRecent and long-term track record\nPortfolio\nStrategy, investment process, and idea generation\nmanagement\nInternal controls, audited financial statements,\nreporting frequency\nOperations\nValuation methodology and controls\nChief risk officer's independence from portfolio\ndecision-making\nRisk policies\nFund/position limits, leverage, hedging policies\nFund structure and legal registrations\nExisting or prior litigation against fund or\nLegal risks\nprincipals\nFees, lockouts, redemption notice period\nTerms of\nCarried interest, distribution policy\ninvestment\nDue diligence of alternative investment managers presents challenges not always\nencountered with traditional investment firms. Specifically, policies and procedures related\nto operational and portfolio risks require greater scrutiny and an understanding of industry-\nwide best practices .\nTraditional investments (eg, mutual funds) usually hold client assets through a third-party\ncustodian , which protects investors by segregating those assets. With alternative\ninvestments, such as hedge funds and private equity, this is not always the case.\nHedge funds often use a prime broker as custodian, but client accounts also can be structured\nas separately managed accounts (SMAs). SMAs are accounts held by an independent\ncustodian in the investor's name. For the investor, positions and trades in such accounts are\nfully transparent, reducing the risk of fraud.\n(Choice B) Best practices dictate third-party security valuation oversight. In-house security\nvaluation can lead to potential conflicts of interest since managers/funds have an incentive to\novervalue assets. This risk is particularly significant for nontraded and illiquid securities.\n(Choice C) Individual position limits are set in the offering memorandum and enforced by\nthe chief risk officer, not the portfolio manager.\nThings to remember:\nThird-party custody of investor assets is a best practice for all investment firms. A separately\nmanaged account is a third-party custody option that provides full transparency for investors.\nCompare direct investment, co-investment, and fund investment methods for alternative\ninvestments\nLOS", "qhtml": null}, {"n": 80, "q": "A put option is most likely in the money when the underlying asset price is less than the:", "opts": ["strike price.", "strike price less the premium.", "present value of the strike price."], "ans": "A", "expl": "Moneyness\nCall Condition Put\nIn the money Spot price > Strike price Out of the money\nAt the money Spot price = Strike price At the money\nOut of the money Spot price < Strike price In the money\nOptions are contingent claims that give the holder (ie, buyer or long party) the right to trade\nan asset at a fixed price (ie, strike price) at a future date. An option is in the money when\nexercise of the option allows the holder to trade the underlying at a better price than the\ncurrent market price of the asset (ie, when the exercise value is positive).\nCall options are in the money when the exercise price is < the asset's market price.\nPut options are in the money when the exercise price is > the asset's market\nprice .\nIf a put option is in the money, the put holder can first buy the asset at its market price and\nthen sell the asset at the strike price, which is > the market price, and realize the difference.\n(Choice B) A put option's strike price less the premium is the option's breakeven point.\nHowever, an option's moneyness is determined by the relationship of the underlying asset's\nprice to the exercise price, regardless of the premium paid.\n(Choice C) The present value of the strike price is used in option valuation (eg, put-call\nparity) but is not a factor in determining an option's moneyness.\nThings to remember:\nPut options give holders the right to sell an underlying asset for a specified price at a future\ndate. A put is in the money when the underlying asset price is less than the strike price of the\noption.\nExplain the exercise value, moneyness, and time value of an option\nLOS", "qhtml": null}, {"n": 81, "q": "An investor is considering a $20 million investment in the STU fund of funds (FoF). The FoF's\ncharacteristics, as well as the characteristics of the funds in which it invests, are as follows:\nSTU fund of funds Funds held by STU\nFee structure 1 and 10 2 and 20\nPerformance fee Independent of Independent of\ncalculation management fee management fee\nHurdle rate No hurdle rate 6% hard hurdle\nBased on beginning-of-year Based on beginning-of-year\nManagement fee\nAUM AUM\nAssuming each of STU's investments earns a 15% gross return, the investor would pay $0.424\nmillion total fees to STU. An investment in STU would earn a net return closest to:", "opts": ["7.88%", "8.68%", "9.08%"], "ans": "C", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nDoes not depend on fund's profitability\nManagement\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nCan be subject to hurdle rate and/or\nPerformance or incentive Annual returns\nhigh-water mark\nHedge fund managers earn a management fee , such as 2% of assets under management,\nand a performance fee , often set as 20% of profits. This structure is normally called 2 and\n20 . The performance fee component usually does not apply unless the manager can exceed\na hurdle rate. The hurdle rate in this case is a hard hurdle, which is netted from the gross\nreturn when calculating the performance fee.\nFund of funds (FoF) managers usually follow a similar fee structure. A common arrangement\nis a 1% management fee and a 10% performance fee (ie, 1 and 10). The FoF fees are in\naddition to the fees charged by the funds in which the FoF invests . In this case, the total\nFoF fees are given as $0.424 million.\nIn this scenario, the management fee is based on beginning-of-year AUM and the performance\nfee is calculated independent of management fee. To determine the net return for the FoF\n(STU), first calculate the net return for the portfolio of funds in which STU would invest, then\nsolve for STU's return after FoF fees are applied:\nThe investor in STU earns a net return of approximately 9.08% .\n(Choice A) 7.88% results from failing to apply the hurdle rate.\n(Choice B) 8.68% would be the result if the performance fees are calculated after netting\nthe management fee. In this instance, performance and management fees are calculated\nindependently of each other (ie, on a gross basis).\nThings to remember:\nHedge fund managers earn both management and performance fees, usually as a 2-and-20\nstructure. Fund-of-funds managers apply a similar 1-and-10 structure on top of fees charged\nby funds in their portfolios.\nCalculate and interpret alternative investment returns both before and after fees\nLOS", "qhtml": null}, {"n": 82, "q": "The priorities that preferred shareholders have compared to common shareholders are least\nlikely related to:", "opts": ["voting rights.", "payment of dividends.", "claim on assets upon liquidation."], "ans": "A", "expl": "Equity securities' characteristics\nCommon Preferred\nVoting Some corporate actions (eg, M&A) and\nUsually none\nrights board seats\nDividends Payable only after preferred Payable in full before common\nResidual claim after all other obligations Priority claim over common for asset\nAssets\nretired distributions\nThere are two types of equity securities: common stocks and preferred stocks (ie, preference\nshares). Corporations must have common shares outstanding, which represent the ownership\ninterests in the company. As owners, common stockholders:\nshare in the company's operating performance,\nparticipate in its governance through voting rights, and\nhave a residual claim on the company's assets in the case of liquidation.\nCompanies may raise additional equity capital by issuing preferred stock . Unlike common\nstock, preferred shares normally carry no voting rights and do not participate in company\noperating performance. However, preferred shares rank ahead of (ie, have preference over)\ncommon shares, as preferred shareholders receive:\npreferred dividends, once declared, before any common stock dividends can be\npaid (Choice B) , and\nshares' par value before common shareholders receive any distributions, upon\nliquidation (Choice C) .\nThings to remember:\nThere are two types of equity securities: common stocks and preferred stocks. Corporations\nmust have common shares outstanding and may issue preferred stocks to raise additional\ncapital. Preferred shares have a priority claim on dividends and asset distributions in a\ncompany liquidation, but normally they have no voting rights.\nDescribe differences in voting rights and other ownership characteristics among different equity\nclasses\nLOS", "qhtml": null}, {"n": 83, "q": "All else equal, a company's book value of equity is most likely to decrease when the:", "opts": ["company stops paying common dividends.", "company reports a large accumulated loss.", "company's stock price falls below par value."], "ans": "B", "expl": "Book value of equity Market value of equity\n(Shareholders' equity) (Market cap)\nCommon stock* + Shares outstanding (current) ×\nRetained earnings (or accum. loss) Current stock price\n*Common stock = Shares issued × Issue price\nThe book value of equity is the amount of shareholders' equity reported on a company's\nbalance sheet. It primarily consists of common stock and retained earnings. On the balance\nsheet:\ncommon stock reports the historical value of common equity issued, and\nretained earnings (accumulated loss) reports the cumulative net profit (loss) since a\ncompany's inception, net of dividends.\nAll else equal, accumulated losses will reduce the book value of equity by reducing\nretained earnings. The book value of equity is also the difference between total assets and\ntotal liabilities.\nThe market value of equity is the current value of the shareholders' equity (Shares\noutstanding × Current stock price). A change in the current stock price will affect the equity's\nmarket value, not its book value (Choice C) .\nSince the stock price is based on investors' expectations of a company's future earnings or\ncash flows, the market value of equity is forward-looking, whereas the book value of equity\n(based on share value at issuance) is backward-looking.\n(Choice A) All else equal, halting dividends increases retained earnings and, thus, book\nvalue of equity since the company keeps more earnings, instead of paying them as dividends.\nThings to remember:\nThe book value of equity is reported on a company's balance sheet as the historical value of\ncommon equity issued (ie, common stock) and cumulative net profit (loss) since a company's\ninception, net of dividends (ie, retained earnings). The equity's market value is based on\ncurrent share price, which is based on investors' current expectations of future earnings.\nDescribe behavioral finance and its potential relevance to understanding market anomalies\nLOS", "qhtml": null}, {"n": 84, "q": "Which of the following financial intermediaries is least likely to provide liquidity to the markets\nthey operate in?", "opts": ["Dealers", "Brokers", "Mortgage banks"], "ans": "B", "expl": "Financial intermediaries offer various financial products and services that connect buyers\nand sellers in financial markets. Market participants who want to buy or sell securities can use\nthe services of a broker or a dealer:\nBrokers facilitate client trades but do not trade with clients.\nDealers serve as a counterparty and trade with clients.\nOne measure of market liquidity refers to the ability of participants to buy or sell when they\nwant to trade with low transaction costs at market prices. By serving as counterparties to\nclient trades, especially when market conditions make finding willing counterparties more\ndifficult, dealers provide liquidity to the market (Choice A) . Brokers attempt only to find\ncounterparties for client trades, which does not add liquidity to the market.\n(Choice C) Mortgage banks provide liquidity to the mortgage loan market\nby securitizing mortgage loans, which provides capital that mortgage banks can lend to other\nreal property purchasers at lower rates. The combined effects of both types of activity add\nliquidity to the mortgage loan market.\nThings to remember:\nBrokers and dealers are financial intermediaries who help market participants buy and sell\nsecurities. Dealers trade directly with participants, so they provide liquidity to the market.\nBrokers attempt to find counterparties for their clients who want to trade; they do not act as\ncounterparties, so they do not provide market liquidity. Mortgage banks provide liquidity to\nmortgage markets through securitizations.\nDescribe types of financial intermediaries and services that they provide\nLOS", "qhtml": null}, {"n": 85, "q": "The purpose of a repo margin is most likely to:", "opts": ["provide a return to the lender.", "shield the borrower from counterparty risk.", "protect the lender from a decline in collateral value."], "ans": "C", "expl": "Factors affecting repo margin\nCollateral quality The higher the quality of collateral, the lower the margin\nLower margin is required if specific collateral is in high\nCollateral demand\ndemand\nLength The longer the term of the repo, the higher the margin\nHigher creditworthiness of counterparty, lower margin\nCounterparty risk\nrequired\nIn a repurchase agreement (\"repo\"), the repo buyer, as the lender, provides cash in exchange\nfor securities provided by the repo seller, as the borrower. In effect, securities are collateral\nfor the short-term financing provided by the repo.\nThe lender is exposed to the risk that the borrower will not repurchase the collateral when the\nagreement ends, defaulting on the repo. Although the lender can sell the collateral in the\nmarket, it is possible that its market value will have declined since the repo was initiated.\nTo shield the lender from a decline in collateral value in the event of default , the value of\nthe collateral is greater than the amount actually loaned (eg, 102%, 105%).\nThe difference between the value of the collateral and the amount loaned is the repo\nmargin . The magnitude of the repo margin depends upon:\nthe quality of the collateral,\nthe demand for specific collateral,\nthe term of the repo, and\nthe counterparty's creditworthiness.\n(Choice A) The lender's return (ie, interest rate) for providing cash to the borrower is\nthe repo rate.\n(Choice B) The repo margin protects the lender from counterparty risk, not the borrower.\nThings to remember:\nThe repurchase agreement (\"repo\") margin is the difference between the value of the cash\nloaned and the value of the collateral. The repo margin protects the lender from counterparty\ndefault risk and a decline in collateral value.\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.\nLOS", "qhtml": null}, {"n": 86, "q": "A Japanese corporation makes a public offering of EUR-denominated bonds in the French\ndomestic bond market. From a French investor's perspective, these securities are most\nlikely considered:", "opts": ["Eurobonds.", "foreign bonds.", "domestic bonds."], "ans": "B", "expl": "Geographic classification of bonds\nDomestic bonds Foreign bonds Eurobonds\nIssuer Same as country\nDifferent from country of issuance\ndomicile of issuance\nCurrency Domestic (local) currency Foreign currency\nNumerous\nJurisdiction Domestic legal, regulatory, and tax rules\nexemptions\nForeign bonds are debt securities issued in the domestic market by foreign-domiciled\nissuers . The securities are denominated in the local currency and are subject to local laws,\nregulations, and taxes. Foreign issuers issue such securities to reduce currency risk for\nearnings of domestic subsidiaries and/or to gain access to capital at attractive interest rates.\nIn this scenario, the debt of the Japanese corporation issued in France and denominated in\nEUR, which is the local currency where the bond is issued, is considered a foreign bond in the\nFrench bond market.\n(Choice A) Eurobonds are debt securities issued outside of the issuer's domestic market;\nthey are issued in one country and denominated in the currency of another. Eurobonds have\nnumerous exemptions from local rules, regulations, and taxes that often result in lower capital\ncosts relative to domestic bond issues. Most issuers raising capital outside of their own\ndomestic markets do so in the Eurobond markets.\n(Choice C) Domestic bonds are debt securities issued within the country in which the issuer\nis domiciled and denominated in that country's currency. These issues are subject to local\nlaws, regulations, and taxes. Most issued debt securities are domestic bonds.\nThings to remember:\nWhen classifying bonds by geography, there are three categories: domestic bonds, foreign\nbonds, and Eurobonds. Foreign bonds are debt securities issued in the domestic market by a\nforeign-domiciled issuer. The securities are denominated in the local currency of the country\nwhere they are issued and are subject to its local laws, regulations, and taxes.\nDescribe fixed-income market segments and their issuer and investor participants.\nLOS", "qhtml": null}, {"n": 87, "q": "All else being equal, as soon as the coupon on a bond is paid, the quoted price of that bond\nfrom a bond dealer will most likely :", "opts": ["decrease.", "remain the same.", "increase."], "ans": "B", "expl": "The quoted market price , or the flat price (ie, clean price) of a bond, does not\ninclude accrued interest. Therefore, all else being equal, on the coupon payment date the\nquoted price of a bond remains the same . Quoting only the flat price separates the accrued\ninterest component, which always increases the price, from other factors (eg, changes in\ninterest rates or credit quality) that are more relevant to investors.\nThe bond's full price (ie, dirty price), or the total amount an investor pays for a bond, is equal\nto the flat price plus the accrued interest. Interest accrues each day; therefore, the full price\nincreases each day until the coupon payment is made, at which point accrued interest falls to\nzero (as shown in the image above). On the coupon payment date, the flat price and the full\nprice are the same.\n(Choices A and C) The standard market quoting convention is to quote the flat price, which\ndoes not include accrued interest. Therefore, a coupon payment does not affect the bond's\nquoted price.\nThings to remember:\nThe quoted market price is the bond's flat price, which does not include accrued interest.\nTherefore, a coupon payment does not affect the bond's quoted price. The buyer pays the full\nprice (ie, flat price plus accrued interest).\nCalculate a bond’s price given a yield-to-maturity on or between coupon dates.\nLOS", "qhtml": null}, {"n": 88, "q": "50,000 bonds with a 15-year maturity were issued 10 years ago and are currently trading at\n110. The indenture contains a sinking fund provision that retires 10% of the outstanding\nbonds every year for the next four years (starting now). If an investor bought 500 bonds at\nissuance, which of the following is the best outcome for the investor this year?", "opts": ["All bonds are redeemed.", "50 bonds are redeemed.", "No bonds are redeemed."], "ans": "C", "expl": "Sinking fund provision\nPredetermined schedule for retiring a portion of\na bond issue prior to maturity\nExposes bondholders to:\nReinvestment risk\nGradually reduced credit risk\nA sinking fund arrangement details a schedule for gradually retiring a portion of a\nbond's principal . For the bondholder (ie, investor), this provision can be either beneficial or\ndetrimental, depending on the circumstance. A sinking fund gradually reduces credit risk by\ndecreasing exposure to a specific bond issue. However, early principal repayment increases\nreinvestment risk since the proceeds must be reinvested at a different—and perhaps lower—\ninterest rate.\nSinking fund provisions typically operate on a lottery basis, with a predetermined quantity of\nbonds (eg, 10%) randomly selected based on a serial number or similar identifier. This\nsinking fund lottery creates a situation in which individual investors could have all, none, or\nany number of their bonds redeemed.\nIn this instance, with bonds trading at a large premium (ie, 110), a redemption at par (ie,\n100) due to the sinking fund provision is detrimental for the investor since the redeemed\nprincipal must now be reinvested at a lower interest rate. Therefore, the best outcome for\nthe investor is to have none of the 500 bonds redeemed (Choices A and B) .\nThings to remember:\nA sinking fund arrangement details a schedule for gradually retiring a bond's principal. For the\nbondholder, this provision can reduce exposure to credit risk but also increases reinvestment\nrisk.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow\ncontingency provisions that benefit issuers and investors.\nLOS", "qhtml": null}, {"n": 89, "q": "All else equal, which of the following is most likely to cause futures and forward contract prices\nto differ? Differences in:", "opts": ["contract liquidity.", "counterparty credit risk.", "timing of gain/loss realization."], "ans": "C", "expl": "Futures vs. forward contracts\nFutures Forwards\nTrading venue Exchange-traded Over-the-counter\nLegal counterparty Exchange clearinghouse Contract counterparty\nContract terms Standardized Negotiated (ie, nonstandardized)\nGain/loss realization Daily settlement At expiration\nForwards and futures with the same underlying asset and expiration may have different\ncontract prices due to different cash flow patterns , reflecting the different timing of gain\nand loss realization:\nForward contract gains and losses are realized at contract expiration .\nFutures contract gains and losses are realized daily .\nIf futures prices are correlated with interest rates and if there is any interest rate volatility, the\ndifference in the timing of gains and losses results in different futures and forward prices.\nSince futures contracts settle daily, their gains (losses) are reinvested (financed) sooner and\nmore often than those of forward contracts, whose gains (losses) are reinvested (financed)\nonly at expiration. This results in price differences . If interest rates are not correlated with\nfutures or if interest rates are constant, futures and forward prices are equal.\nSince the prices of both types of contracts reflect cost of carry arbitrage pricing, neither\nliquidity nor counterparty credit risk affects the arbitrage-free futures or forward\nprice (Choices A and B) . Liquidity affects the size of the bid-ask spread; differences in\ncounterparty credit risk affect the collateral that investors must provide to trade forwards but\ndo not affect their prices.\nThings to remember:\nIf futures prices are correlated with interest rates and if there is any interest rate volatility, the\ndifference in the timing of gains and losses results in different futures and forward prices.\nSince futures contracts settle daily, their gains (losses) are reinvested (financed) sooner and\nmore often than those of forward contracts, whose gains (losses) are reinvested (financed)\nonly at expiration. This results in price differences. If interest rates are not correlated with\nfutures or if interest rates are constant, futures and forward prices are equal.\nExplain why forward and futures prices differ\nLOS", "qhtml": null}, {"n": 90, "q": "Compared to traditional investments, alternative investments are most likely to:", "opts": ["have concentrated portfolios.", "be highly regulated due to the risks involved.", "have managers who are investment generalists."], "ans": "A", "expl": "Alternative investments are investments in nontraditional assets, such as hedge funds, private\nequity, infrastructure, and commodities. Alternative investments typically operate in less\nefficient markets that provide investment managers with greater potential to exploit mispricing\nthrough active investment strategies.\nTypical characteristics of alternative investments include the following:\nActively managed concentrated portfolios\nManagers who are specialists in their fields (eg, long-short biotech)\nLess regulation and transparency\nHigh management fees\nRedemption restrictions\n(Choice B) Compared to traditional investments, alternative investments are subject to less\nregulation, resulting in fewer reporting requirements and less transparency regarding\ninvestment strategies, positions, and performance.\n(Choice C) Alternative investment managers tend to be narrowly focused specialists in their\nrespective fields, not investment generalists.\nThings to remember:\nAlternative investments tend to be actively managed concentrated portfolios, are overseen by\ninvestment specialists, and have less regulatory oversight compared to traditional\ninvestments.\nDescribe features and categories of alternative investments\nLOS", "qhtml": null}];
const CFG = {"title": "UWorld Mock Exam 1 — Session 2", "subtitle": "UWorld · CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const day = new Date().toISOString().slice(0,10);
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
