<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<header>

\"Exhibit\"><p>Tanaka adds that the exclusion of the word &quot;not&quot; in Token Group 2 would prevent the ML model from capturing the correct meaning (ie, &quot;not significant&quot;). Saito asks if this would affect the efficiency of the model. Tanaka explains that he can employ a technique to overcome this problem.<\/p><p>Finally, Saito asks if Tanaka is ready to start building the text ML model. Tanaka answers that he still has a concern about noisy features that could affect the results of the model, especially regarding sparse (rare) terms that could be present in just a few of the texts.<\/p><\/div><\/details><div class=\"qtext\"><p>Tanaka&#x27;s concern about noisy features from sparse terms is most likely related to model:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":7,"q":"Based on Exhibit 1, which is the most appropriate alternative hypothesis and conclusion from Marek's assumption on the seating capacity variable (SC)?","opts":["Ha: SC > 0; reject the null.","Ha: SC > 0; fail to reject the null.","Ha: SC ≤ 0; tail to reject the null."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Lana Marek, CFA, a pricing analyst at a European auto manufacturer, is analyzing competitor pricing data. She is working with Micah Hould, CFA, a quantitative analyst at the same company, to create multiple regression models that help identify factors affecting vehicle pricing.<\/p><p>As part of her analysis, she has chosen three independent variables to regress against vehicle price: engine power output (HP), vehicle seating capacity (SC), and size of the car&#x27;s interior (CI). Marek assumes that all three variables are positively related to price. To test this, she has compiled data for 30 different vehicle models from last year and developed a regression equation and statistics at a 5% level of significance.<\/p><p>Marek believes that there is another variable that affects vehicle price: whether the car belongs to a luxury vehicle brand. She adds a dummy variable and assigns a value of 1 for a luxury vehicle and a value of 0 for a nonluxury vehicle. Marek expects that there will be a positive relationship between the brand variable and price. The updated regression statistics and equation are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex003.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><p>Marek notices that R2 increased after she added the<\/p><p><b>2<\/b> 2<\/p><p><b>dummy variable to her analysis, but adjusted R<\/b> (or R decreased.<\/p><p>Finally, Marek is concerned about multicollinearity&#x27;s effect on her model. She suspects the seating capacity and interior size variables are highly correlated, which may influence the regression results. She shares her concern with Hould, who responds as follows:<\/p><p>Statement 1: &quot;The most reliable way of detecting multicollinearity is to assess the magnitude of correlations between independent variables.&quot;<\/p><p>Statement 2: &quot;A key issue with multicollinearity is that t-tests on regression coefficients will result in instances of rejecting a true null hypothesis.&quot;<\/p><p>Statement 3: &quot;The most straightforward way to correct multicollinearity is to remove one or more correlated variables from the regression.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which is the most appropriate alternative hypothesis and conclusion from Marek&#x27;s assumption on the seating capaci ehicle price: whether the car belongs to a luxury vehicle brand. She adds a dummy variable and assigns a value of 1 for a luxury vehicle and a value of 0 for a nonluxury vehicle. Marek expects that there will be a positive relationship between the brand variable and price. The updated regression statistics and equation are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex003.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><p>Marek notices that R2 increased after she added the<\/p><p><b>2<\/b> 2<\/p><p><b>dummy variable to her analysis, but adjusted R<\/b> (or R decreased.<\/p><p>Finally, Marek is concerned about multicollinearity&#x27;s effect on her model. She suspects the seating capacity and interior size variables are highly correlated, which may influence the regression results. She shares her concern with Hould, who responds as follows:<\/p><p>Statement 1: &quot;The most reliable way of detecting multicollinearity is to assess the magnitude of correlations between independent variables.&quot;<\/p><p>Statement 2: &quot;A key issue with multicollinearity is that t-tests on regression coefficients will result in instances of rejecting a true null hypothesis.&quot;<\/p><p>Statement 3: &quot;The most straightforward way to correct multicollinearity is to remove one or more correlated variables from the regression.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The decline in R most likely suggests that:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":12,"q":"Which of Hould's statements on multicollinearity is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lana Marek, CFA, a pricing analyst at a European auto manufacturer, is analyzing competitor pricing data. She is working with Micah Hould, CFA, a quantitative analyst at the same company, to create multiple regression models that help identify factors affecting vehicle pricing.<\/p><p>As part of her analysis, she has chosen three independent variables to regress against vehicle price: engine power output (HP), vehicle seating capacity (SC), and size of the car&#x27;s interior (CI). Marek assumes that all three variables are positively related to price. To test this, she has compiled data for 30 different vehicle models from last year and developed a regression equation and statistics at a 5% level of significance.<\/p><p>Marek believes that there is another variable that affects vehicle price: whether the car belongs to a luxury vehicle brand. She adds a dummy variable and assigns a value of 1 for a luxury vehicle and a value of 0 for a nonluxury vehicle. Marek expects that there will be a positive relationship between the brand variable and price. The updated regression statistics and equation are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex003.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><p>Marek notices that R2 increased after she added the<\/p><p><b>2<\/b> 2<\/p><p><b>dummy variable to her analysis, but adjusted R<\/b> (or R decreased.<\/p><p>Finally, Marek is concerned about multicollinearity&#x27;s effect on her model. She suspects the seating capacity and interior size variables are highly correlated, which may influence the regression results. She shares her concern with Hould, who responds as follows:<\/p><p>Statement 1: &quot;The most reliable way of detecting multicollinearity is to assess the magnitude of correlations between independent variables.&quot;<\/p><p>Statement 2: &quot;A key issue with multicollinearity is that t-tests on regression coefficients will result in instances of rejecting a true null hypothesis.&quot;<\/p><p>Statement 3: &quot;The most straightforward way to correct multicollinearity is to remove one or more correlated variables from the regression.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Hould&#x27;s statements on multicollinearity is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":13,"q":"Which of the following is the most appropriate type of model to predict the stock price of GlobeMax?","opts":["Log-linear trend model","AR (1) model with seasonal lags","First-differenced log AR(1) model"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Dahlia Bakker, CFA, is a strategist who focuses on the airline industry. At the start of this year, many of the airlines that Bakker covers warned that they would report lower earnings than expected, and most blamed rising fuel costs for their poor performance.<\/p><p>First, Bakker analyzes the stock price of GlobeMax, a large airline. She assesses a model that would predict the stock price of GlobeMax given a change in the price of jet fuel. Bakker tried using a linear trend model but found that the regression followed a nonlinear trend. Bakker also found that the time series did not exhibit signs of seasonality, nor did the model&#x27;s residuals show signs of serial correlation.<\/p><p>Bakker is performing a more detailed analysis on the stock price trend for AFX, one of GlobeMax&#x27;s competitors. To reduce the effect of short-term price fluctuations, Bakker decides to use a moving average. AFX&#x27;s stock price for the previous 12 months is shown in Exhibit 1, with December being the most recent month.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex004.webp\" style=\"max-width:min(100%,324px)\" alt=\"Exhibit\"><p>Since a historical moving average calculation gives equal weight to all prior periods, Bakker decides she would prefer a more complex moving average time series model to forecast the stock price of AFX. Based on her evaluation of the data, Bakker determines that an MA(2) model is most appropriate for her analysis of AFX&#x27;s stock.<\/p><p>Next, Bakker decides to build a regression on the average price of jet fuel over time. She starts by using a linear trend model of the monthly spot price over the last five years, as shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex005.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><p>Bakker correctly decides the linear trend model is not suitable for predicting jet fuel prices, so she tries instead to use a log-linear model. She correctly determines this is also unsuitable, so she switches to an autoregressive (AR) model, as shown in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex006.webp\" style=\"max-width:min(100%,522px)\" alt=\"Exhibit\"><p>Bakker determines from the data in Exhibit 3 that the AR model is not properly specified.<\/p><p>Finally, Bakker creates a first-differenced autoregression for the stock price of another airline, TerraAir, based on the company&#x27;s monthly stock price for the last five years. Bakker determines the regression is properly specified and generates the following regression data.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex007.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following is the most appropriate type of model to predict the stock price of GlobeMax?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":14,"q":"Based on Exhibit 1 and as of January 1, 20X1, the 6-month moving average AFX stock price is closest to:","opts":["28.50","29.36","30.23"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dahlia Bakker, CFA, is a strategist who focuses on the airline industry. At the start of this year, many of the airlines that Bakker covers warned that they would report lower earnings than expected, and most blamed rising fuel costs for their poor performance.<\/p><p>First, Bakker analyzes the stock price of GlobeMax, a large airline. She assesses a model that would predict the stock price of GlobeMax given a change in the price of jet fuel. Bakker tried using a linear trend model but found that the regression followed a nonlinear trend. Bakker also found that the time series did not exhibit signs of seasonality, nor did the model&#x27;s residuals show signs of serial correlation.<\/p><p>Bakker is performing a more detailed analysis on the stock price trend for AFX, one of GlobeMax&#x27;s competitors. To reduce the effect of short-term price fluctuations, Bakker decides to use a moving average. AFX&#x27;s stock price for the previous 12 months is shown in Exhibit 1, with December being the most recent month.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex004.webp\" style=\"max-width:min(100%,324px)\" alt=\"Exhibit\"><p>Since a historical moving average calculation gives equal weight to all prior periods, Bakker decides she would prefer a more complex moving average time series model to forecast the stock price of AFX. Based on her evaluation of the data, Bakker determines that an MA(2) model is most appropriate for her analysis of AFX&#x27;s stock.<\/p><p>Next, Bakker decides to build a regression on the average price of jet fuel over time. She starts by using a linear trend model of the monthly spot price over the last five years, as shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex005.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><p>Bakker correctly decides the linear trend model is not suitable for predicting jet fuel prices, so she tries instead to use a log-linear model. She correctly determines this is also unsuitable, so she switches to an autoregressive (AR) model, as shown in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex006.webp\" style=\"max-width:min(100%,522px)\" alt=\"Exhibit\"><p>Bakker determines from the data in Exhibit 3 that the AR model is not properly specified.<\/p><p>Finally, Bakker creates a first-differenced autoregression for the stock price of another airline, TerraAir, based on the company&#x27;s monthly stock price for the last five years. Bakker determines the regression is properly specified and generates the following regression data.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex007.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and as of January 1, 20X1, the 6-month moving average AFX stock price is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh he last five years, as shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex005.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><p>Bakker correctly decides the linear trend model is not suitable for predicting jet fuel prices, so she tries instead to use a log-linear model. She correctly determines this is also unsuitable, so she switches to an autoregressive (AR) model, as shown in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex006.webp\" style=\"max-width:min(100%,522px)\" alt=\"Exhibit\"><p>Bakker determines from the data in Exhibit 3 that the AR model is not properly specified.<\/p><p>Finally, Bakker creates a first-differenced autoregression for the stock price of another airline, TerraAir, based on the company&#x27;s monthly stock price for the last five years. Bakker determines the regression is properly specified and generates the following regression data.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex007.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, Bakker correctly rejects the AR model due to the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q017.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":18,"q":"Bakker gathers information on TerraAir's stock price, in which t is the most recent month: Month Ending stock price (in €) t 18.90 t- 1 14.93 t- 2 15.85 Based on Exhibit 4, TerraAir's ending stock price projection (in €) for next month (t + 1) will be closest to:","opts":["15.66","17.12","21.19"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a018.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dahlia Bakker, CFA, is a strategist who focuses on the airline industry. At the start of this year, many of the airlines that Bakker covers warned that they would report lower earnings than expected, and most blamed rising fuel costs for their poor performance.<\/p><p>First, Bakker analyzes the stock price of GlobeMax, a large airline. She assesses a model that would predict the stock price of GlobeMax given a change in the price of jet fuel. Bakker tried using a linear trend model but found that the regression followed a nonlinear trend. Bakker also found that the time series did not exhibit signs of seasonality, nor did the model&#x27;s residuals show signs of serial correlation.<\/p><p>Bakker is performing a more detailed analysis on the stock price trend for AFX, one of GlobeMax&#x27;s competitors. To reduce the effect of short-term price fluctuations, Bakker decides to use a moving average. AFX&#x27;s stock price for the previous 12 months is shown in Exhibit 1, with December being the most recent month.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex004.webp\" style=\"max-width:min(100%,324px)\" alt=\"Exhibit\"><p>Since a historical moving average calculation gives equal weight to all prior periods, Bakker decides she would prefer a more complex moving average time series model to forecast the stock price of AFX. Based on her evaluation of the data, Bakker determines that an MA(2) model is most appropriate for her analysis of AFX&#x27;s stock.<\/p><p>Next, Bakker decides to build a regression on the average price of jet fuel over time. She starts by using a linear trend model of the monthly spot price over the last five years, as shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex005.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><p>Bakker correctly decides the linear trend model is not suitable for predicting jet fuel prices, so she tries instead to use a log-linear model. She correctly determines this is also unsuitable, so she switches to an autoregressive (AR) model, as shown in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex006.webp\" style=\"max-width:min(100%,522px)\" alt=\"Exhibit\"><p>Bakker determines from the data in Exhibit 3 that the AR model is not properly specified.<\/p><p>Finally, Bakker creates a first-differenced autoregression for the stock price of another airline, TerraAir, based on the company&#x27;s monthly stock price for the last five years. Bakker determines the regression is properly specified and generates the following regression data.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex007.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Bakker gathers information on TerraAir&#x27;s stock price, in which t is the most recent month:<\/p><p>Month Ending stock price (in €)<\/p><p>t 18.90<\/p><p>t- 1 14.93<\/p><p>t- 2 15.85<\/p><p>Based on Exhibit 4, TerraAir&#x27;s ending stock price projection (in €) for next month (t + 1) will be closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q018.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":19,"q":"Based on Exhibit 1 and the CART model results, the most appropriate allocation to DHI is:","opts":["underweight.","equal weight.","overweight."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a019.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a019.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 19–24 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Meiying Chan is a quantitative analyst at Karlsson Management, a global macro hedge fund. She has recently developed a classification and regression tree (CART) model to guide Karlsson&#x27;s allocation to certain investments. Chan&#x27;s manager, Patrick O&#x27;Leary, asks her to classify the stock of Diamond Head Industries (DHI). DHI recently reported the following information:<\/p><p>P/E-to-growth (PEG) ratio of 1.03<\/p><p>Price-to-sales (P/S) ratio of 1.42<\/p><p>Price-to-book (P/B) ratio of 0.99<\/p><p>P/E ratio of 16.15<\/p><p>FCFE year-over-year growth of 4.8%<\/p><p>Chan runs DHI&#x27;s information in the CART model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex008.webp\" style=\"max-width:min(100%,564px)\" alt=\"Exhibit\"><p>After comparing the results from the model with his own analysis, O&#x27;Leary is concerned that the CART model might be overfitted and unable to generalize. O&#x27;Leary asks Chan why she used CART instead of k-nearest neighbor (KNN) for this exercise and states that KNN models have certain benefits, such as:<\/p><p><b>Benefit 1:<\/b> They can be used directly for multiclass classification.<\/p><p><b>Benefit 2:<\/b> They are parametric, and assumptions about the distribution of the data can be adjusted.<\/p><p><b>Benefit 3:<\/b> They automatically create a distance metric to model similarity based on the features selected.<\/p><p>O&#x27;Leary asks Chan to review a set of models received from other analysts that predict price upsides in a set of stocks. The model set contains support vector machine (SVM), k-nearest neighbor (KNN), and CART. Karlsson uses each of the models to evaluate the same five stocks and decides which stock has the greatest potential upside:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex009.webp\" style=\"max-width:min(100%,330px)\" alt=\"Exhibit\"><p>Chan is also asked to categorize these stocks in the Euronext 100 index based on two factors: capital intensity and revenue growth. Categorizing the stocks will help her analyze each company&#x27;s relative value versus its peers. Chan does not yet know the most appropriate number of categories, so she would prefer a model that provides multiple possibilities. In addition, given Karlsson&#x27;s top-down approach to investment research, she would prefer a model that uses a top-down approach to categorization. Finally, O&#x27;Leary and Chan discuss neural networks, which is an area of ML that Karlsson has not yet explored. Chan states that:<\/p><p><b>Statement 1:<\/b> Within neural networks, the magnitude by which weights are reassigned during the learning process can be adjusted by changing the learning rate.<\/p><p><b>Statement 2:<\/b> Deep neural networks improve on regular neural networks since they do all the learning on their own and therefore do not require any hyperparameter selection.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and the CART model results, the most appropriate allocation to DHI is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":20,"q":"Which of the following options would least likely improve the ability of Chan's CART model to generalize?","opts":["Using K-fold cross-validation","Pruning after the model is completed","Increasing the maximum depth of the tree"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 19–24 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Meiying Chan is a quantitative analyst at Karlsson Managem s for ML. They include:<\/p><p><b>Process 1:<\/b> When a company announces a new bond issue, K2&#x27;s analysts will classify that issue in one of five categories based on existing bonds outstanding from other companies with similar characteristics.<\/p><p><b>Process 2:<\/b> On a quarterly basis, K2 will analyze the issuers of the bonds it holds to determine whether they are likely to default within the next 12 months.<\/p><p>Han reads about classification and regression tree (CART) algorithms and the risk of overfitting if the algorithms are left unconstrained. To counter this risk, Han considers adding regularization parameters to any CART models she decides to use.<\/p><p>Han soon realizes that in some of K2&#x27;s processes, multiple algorithms could provide applicable outputs. She asks the company&#x27;s chief technology officer, Minjae Cho, for advice on which algorithm to select in such cases. Cho tells Han about the ensemble method:<\/p><p><b>Statement 1:<\/b> When using ensemble learning with heterogeneous learners, the first ML model used is validated by each additional model. Therefore, a single output should be agreed upon for the models; otherwise, the results will be unreliable.<\/p><p><b>Statement 2:<\/b> When using ensemble learning with homogeneous learners, bootstrap aggregating is used to generate multiple sets of training data from the same data set.<\/p><p><b>Statement 3:<\/b> The random forest classifier is a type of ensemble learning that uses a large number of decision trees so that errors in a single tree tend to cancel out.<\/p><p><b>Statement 4:<\/b> When using random forest classifiers, an analyst should ensure that the number of features in each decision tree is the same.<\/p><p><b>Statement 5:<\/b> One benefit of random forest classifiers is that they are based on models such as CART and thus have high levels of interpretability.<\/p><\/div><\/details><div class=\"qtext\"><p>The method of machine learning that Han plans to implement is best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":32,"q":"Which of the following machine learning algorithms would be most appropriate for Han to use for Process 1?","opts":["K-nearest neighbor","Penalized regression","Support vector machine"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a032.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a032.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Soojin Han, CFA, a fixed income portfolio manager at K2 Financial, is exploring how machine learning (ML) can improve several of the firm&#x27;s investing and operational functions. After researching on her own and asking colleagues for advice, Han decides that she is most comfortable labeling factors and targets to train an algorithm, then allowing the algorithm to infer a pattern and predict output values. Based on this process, she plans to begin by implementing simple algorithms to infer relationships within the functions.<\/p><p>Han identifies several processes at K2 that she considers good candidates for ML. They include:<\/p><p><b>Process 1:<\/b> When a company announces a new bond issue, K2&#x27;s analysts will classify that issue in one of five categories based on existing bonds outstanding from other companies with similar characteristics.<\/p><p><b>Process 2:<\/b> On a quarterly basis, K2 will analyze the issuers of the bonds it holds to determine whether they are likely to default within the next 12 months.<\/p><p>Han reads about classification and regression tree (CART) algorithms and the risk of overfitting if the algorithms are left unconstrained. To counter this risk, Han considers adding regularization parameters to any CART models she decides to use.<\/p><p>Han soon realizes that in some of K2&#x27;s processes, multiple algorithms could provide applicable outputs. She asks the company&#x27;s chief technology officer, Minjae Cho, for advice on which algorithm to select in such cases. Cho tells Han about the ensemble method:<\/p><p><b>Statement 1:<\/b> When using ensemble learning with heterogeneous learners, the first ML model used is validated by each additional model. Therefore, a single output should be agreed upon for the models; otherwise, the results will be unreliable.<\/p><p><b>Statement 2:<\/b> When using ensemble learning with homogeneous learners, bootstrap aggregating is used to generate multiple sets of training data from the same data set.<\/p><p><b>Statement 3:<\/b> The random forest classifier is a type of ensemble learning that uses a large number of decision trees so that errors in a single tree tend to cancel out.<\/p><p><b>Statement 4:<\/b> When using random forest classifiers, an analyst should ensure that the number of features in each decision tree is the same.<\/p><p><b>Statement 5:<\/b> One benefit of random forest classifiers is that they are based on models such as CART and thus have high levels of interpretability.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following machine learning algorithms would be most appropriate for Han to use for Process 1?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":33,"q":"If Han wants to avoid using a hyperparameter, which of the following ML algorithms would be most appropriate for her to use for Process 2?","opts":["K-nearest neighbor","Penalized regression","Support vector machine"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) e sets of training data from the same data set.<\/p><p><b>Statement 3:<\/b> The random forest classifier is a type of ensemble learning that uses a large number of decision trees so that errors in a single tree tend to cancel out.<\/p><p><b>Statement 4:<\/b> When using random forest classifiers, an analyst should ensure that the number of features in each decision tree is the same.<\/p><p><b>Statement 5:<\/b> One benefit of random forest classifiers is that they are based on models such as CART and thus have high levels of interpretability.<\/p><\/div><\/details><div class=\"qtext\"><p>To regularize CART models, which of the following should Han most appropriately implement?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q034.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":35,"q":"Which of Cho's statements about the ensemble method are correct?","opts":["Only Statement 1","Only Statement 2","Both Statement 1 and Statement 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a035.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a035.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Soojin Han, CFA, a fixed income portfolio manager at K2 Financial, is exploring how machine learning (ML) can improve several of the firm&#x27;s investing and operational functions. After researching on her own and asking colleagues for advice, Han decides that she is most comfortable labeling factors and targets to train an algorithm, then allowing the algorithm to infer a pattern and predict output values. Based on this process, she plans to begin by implementing simple algorithms to in etability.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Cho&#x27;s statements about the ensemble method are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":36,"q":"Which of Cho's statements about the random forest classifiers is correct?","opts":["Statement 3","Statement 4","Statement 5"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a036.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a036.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Soojin Han, CFA, a fixed income portfolio manager at K2 Financial, is exploring how machine learning (ML) can improve several of the firm&#x27;s investing and operational functions. After researching on her own and asking colleagues for advice, Han decides that she is most comfortable labeling factors and targets to train an algorithm, then allowing the algorithm to infer a pattern and predict output values. Based on this process, she plans to begin by implementing simple algorithms to infer relationships within the functions.<\/p><p>Han identifies several processes at K2 that she considers good candidates for ML. They include:<\/p><p><b>Process 1:<\/b> When a company announces a new bond issue, K2&#x27;s analysts will classify that issue in one of five categories based on existing bonds outstanding from other companies with similar characteristics.<\/p><p><b>Process 2:<\/b> On a quarterly basis, K2 will analyze the issuers of the bonds it holds to determine whether they are likely to default within the next 12 months.<\/p><p>Han reads about classification and regression tree (CART) algorithms and the risk of overfitting if the algorithms are left unconstrained. To counter this risk, Han considers adding regularization parameters to any CART models she decides to use.<\/p><p>Han soon realizes that in some of K2&#x27;s processes, multiple algorithms could provide applicable outputs. She asks the company&#x27;s chief technology officer, Minjae Cho, for advice on which algorithm to select in such cases. Cho tells Han about the ensemble method:<\/p><p><b>Statement 1:<\/b> When using ensemble learning with heterogeneous learners, the first ML model used is validated by each additional model. Therefore, a single output should be agreed upon for the models; otherwise, the results will be unreliable.<\/p><p><b>Statement 2:<\/b> When using ensemble learning with homogeneous learners, bootstrap aggregating is used to generate multiple sets of training data from the same data set.<\/p><p><b>Statement 3:<\/b> The random forest classifier is a type of ensemble learning that uses a large number of decision trees so that errors in a single tree tend to cancel out.<\/p><p><b>Statement 4:<\/b> When using random forest classifiers, an analyst should ensure that the number of features in each decision tree is the same.<\/p><p><b>Statement 5:<\/b> One benefit of random forest classifiers is that they are based on models such as CART and thus have high levels of interpretability.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Cho&#x27;s statements about the random forest classifiers is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q036.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":37,"q":"Which of Shu's statements about the text exploration step is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a037.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a037.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Jing Shu, an investment analyst at a brokerage firm, is developing a text data machine learning (ML) model based on social media posts and online news services. Fang Chen, his supervisor, requests more details about the text exploration step, and Shu replies:<\/p><p><b>Statement 1:<\/b> Document frequency (DF) can be used to remove noise features from the data set.<\/p><p><b>Statement 2:<\/b> Name entity recognition (NER) and parts of speech (POS) are common techniques of feature selection.<\/p><p><b>Statement 3:<\/b> Mutual information (MI) measures the independence between the occurrences of a token and the occurrence of a class.<\/p><p>Shu adds that the next step in the ML process is fitting a system of rules to the data set. If the model is a good fit, it can be generalized to new (out-of-sample) data; however, he is concerned that the model may be overfitted. Shu also informs Chen that he has already selected an appropriate method for model training since the data set contains ground truth.<\/p><p>Later, Shu divides the data set into a training set, a cross-validation set (CV), and a test set. Shu runs a model using the training set, aiming to anticipate trends in the stock market. The model classifies each text as Class &quot;1&quot; (positive sentiment) or Class &quot;0&quot; (negative sentiment). Shu uses an error analysis to measure model performance, creating the confusion matrix in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex011.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>After the performance evaluation of the model, Shu compares the model&#x27;s prediction error using different data sets (training and CV). He concludes that the prediction error on the training set is low, but the prediction error on the CV set is significantly higher.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Shu&#x27;s statements about the text exploration step is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":38,"q":"Which of the following would best explain Shu's concern about overfitting?","opts":["The model is oversimplified.","Some words occur very frequently.","There are a large number of features."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jing Shu, an investment analyst at a brokerage firm, is developing a text data machine learning (ML) model based on social media posts and online news services. Fang Chen, his supervisor, requests more details about the text exploration step, and Shu replies:<\/p><p><b>Statement 1:<\/b> Document frequency (DF) can be used to remove noise features from the data set.<\/p><p><b>Statement 2:<\/b> Name entity recognition (NER) and parts of speech (POS) are common techniques of feature selection.<\/p><p><b>Statement 3:<\/b> Mutual information (MI) measures the independence between the occurrences of a token and the occurrence of a class.<\/p><p>Shu adds that the next step in the ML process is fitting a system of rules to the data set. If the model is a good fit, it can be generalized to new (out-of-sample) data; however, he is concerned that the model may be overfitted. Shu also informs Chen that he has already selected an appropriate method for model training since the data set contains ground truth.<\/p><p>Later, Shu divides the data set into a training set, a cross-validation set (CV), and a test set. Shu runs a model using the training set, aiming to anticipate trends in the stock market. The model classifies each text as Class &quot;1&quot; (positive sentiment) or Class &quot;0&quot; (negative sentiment). Shu uses an error analysis to measure model performance, creating the confusion matrix in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex011.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>After the performance evaluation of the model, Shu compares the model&#x27;s prediction error using different data sets (training and CV). He concludes that the prediction error on the training set is low, but the prediction error on the CV set is significantly higher.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following would best explain Shu&#x27;s concern about overfitting?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q038.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":39,"q":"Which of the following model training methods would be the most appropriate for Shu to use?","opts":["Clustering","Supervised learning","Unsupervised learning"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a039.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a039.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jing Shu, an investment analyst at a brokerage firm, is developing a text data machin
