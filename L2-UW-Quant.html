res tells Araujo that she has heard about neural networks but is not sure how they work. Araujo says:<\/p><p>Comment 1: One difference between neural networks and multiple regression is that neural networks add a hidden layer that adds multiple steps of linear functionality between the input and output layers.<\/p><p>Comment 2: Each node in a neural network typically has a summation operator and activation function that transform an input from the previous layer into an output for the next layer.<\/p><p>Comment 3: Deep learning nets, which are neural networks with 100 or more hidden layers, can help solve even more complex problems.<\/p><\/div><\/details><div class=\"qtext\"><p>The model that Araujo is working with is best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q079.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":80,"q":"Which of Araujo's comments about neural networks is correct?","opts":["Comment 1","Comment 2","Comment 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a080.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a080.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 75–80 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Camila Soares, CFA, is a portfolio manager at Down River Capital (DRC). She reads about how machine learning (ML) can improve her portfolio&#x27;s performance and asks three of her colleagues, Luciana Dias, Gabriel Batista, and Felipe Araujo, for advice.<\/p><p>Dias is building an ML algorithm that will automatically trade overbought or oversold stocks based on multiple technical factors. She states that although the model captures the relationships well in the test sample, it is not translating this into useful results once she uses validation and test samples.<\/p><p>Batista wants to improve on an existing model. He tells Soares that the model has shown low in-sample error but high out-of-sample error. To correct this, Batista plans to:<\/p><p>Employ a least absolute shrinkage and selection operator (LASSO) model with λ = 0.<\/p><p>Add features to help explain outliers.<\/p><p>Use cross-validation to reduce holdout samples.<\/p><p>Batista adds, &quot;More than one ML algorithm can be used in most cases, but not every ML algorithm is useful for every purpose. In this case, I wanted to use a supervised ML algorithm to simplify some fixed income models by cutting down on the number of features I had identified using an ordinary least squares regression. As you know, having multiple correlated parameters can result in incorrect results.&quot;<\/p><p>Araujo has been working with advanced ML algorithms based on neural networks. One such algorithm that Araujo discovered involves speech recognition and natural language processing. Araujo has begun looking into how this algorithm could be used to help sift through large amounts of news articles, press releases, and company presentations to filter for information that would be pertinent for investment decisions.<\/p><p>Soares tells Araujo that she has heard about neural networks but is not sure how they work. Araujo says:<\/p><p>Comment 1: One difference between neural networks and multiple regression is that neural networks add a hidden layer that adds multiple steps of linear functionality between the input and output layers.<\/p><p>Comment 2: Each node in a neural network typically has a summation operator and activation function that transform an input from the previous layer into an output for the next layer.<\/p><p>Comment 3: Deep learning nets, which are neural networks with 100 or more hidden layers, can help solve even more complex problems.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Araujo&#x27;s comments about neural networks is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q080.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":81,"q":"Millard's forecasted revenue (in $ billions) for Q2 20Y9, using the log-linear trend model shown in Exhibits 1 and 2, would be closest to:","opts":["4.2","23.8","68.8"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a081.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a081.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 81–86 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Deepak Patel, CFA, is analyzing the gross revenues of Millard, a large online retailer. He compiled quarterly revenues (in $ billions) from Q1 20X3 through the most recent quarter-end of Q4 20Y8 (totaling 64 quarters), then created regressions in the form of both linear and log-linear trend models. The revenue data for both models is plotted in the graph in Exhibit 1, while regression results for both are shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex018.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex019.webp\" style=\"max-width:min(100%,603px)\" alt=\"Exhibit\"><p>Patel determines that neither of these regressions appropriately models Millard&#x27;s revenues over time. Instead, he creates a model by first-differencing the log-linear time series, in which Rev equals quarterly gross revenue. He then calculates a new regression, as summarized in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex020.webp\" style=\"max-width:min(100%,581px)\" alt=\"Exhibit\"><p>After reviewing the data in Exhibit 3, Patel determines that he must adjust for seasonality by adding two seasonal lags to the model. He then updates the regression, as shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex021.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit\"><p>Exhibit 4.<\/p><p>Patel would like to use the latest model (Exhibit 4) and Millard&#x27;s revenue data to forecast revenue growth. He includes the historical growth that Millard has experienced in the four preceding quarters:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex022.webp\" style=\"max-width:min(100%,361px)\" alt=\"Exhibit\"><p>Patel&#x27;s manager asks if Patel could improve on his models by adding more time periods to his analysis. In response, Patel states that:<\/p><p><b>Statement 1:<\/b> Adding time periods may reveal that the time series has multiple regimes.<\/p><p><b>Statement 2:<\/b> Deriving the regression with different sample periods can result in different forecasted values.<\/p><p><b>Statement 3:<\/b> If model data show multiple regimes, this requires adjusting the model in the same way as needed to accommodate for seasonality.<\/p><p>Patel would also like to determine whether there is a relationship between Millard&#x27;s revenues and stock price. To test this, he models a time series for both the revenues and the stock price. He then must perform tests on each for unit roots and cointegration.<\/p><\/div><\/details><div class=\"qtext\"><p>Millard&#x27;s forecasted revenue (in $ billions) for Q2 20Y9, using the log-linear trend model shown in Exhibits 1 and 2, would be closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q081.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":82,"q":"Which of the following Exhibit 2 values most likely indicates that first-differencing is needed?","opts":["R2","Time period t-statistic","Durbin-Watson statistic"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a082.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a082.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 81–86 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Deepak Patel, CFA, is analyzing the gross revenues of Millard, a large online retailer. He compiled quarterly revenues (in $ billions) from Q1 20X3 through the most recent quarter-end of Q4 20Y8 (totaling 64 quarters), then created regressions in the form of both linear and log-linear trend models. The revenue data for both models is plotted in the graph in Exhibit 1, while regression results for both are shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex018.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex019.webp\" style=\"max-width:min(100%,603px)\" alt=\"Exhibit\"><p>Patel determines that neither of these regressions appropriately models Millard&#x27;s revenues over time. Instead, he creates a model by first-differencing the log-linear time series, in which Rev equals quarterly gross revenue. He then calculates a new regression, as summarized in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex020.webp\" style=\"max-width:min(100%,581px)\" alt=\"Exhibit\"><p>After reviewing the data in Exhibit 3, Patel determines that he must adjust for seasonality by adding two seasonal lags to the model. He then updates the regression, as shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex021.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit\"><p>Exhibit 4.<\/p><p>Patel would like to use the latest model (Exhibit 4) and Millard&#x27;s revenue data to f rrelation t-statistic."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a087.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a087.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 87–92 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Anna Meccini, CFA, is interested in the effects of rising inflation on client portfolios. Meccini analyzes monthly US inflation levels for the past 8 years and performs a regression using an AR(1) specification. The results of the autoregression are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex023.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit\"><p>Meccini must next determine if this model is properly specified. She plans to test for nonstationarity and is assessing options for how to perform that test. She decides to first-difference the AR(1) model data and then runs a second regression. That regression&#x27;s results are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex024.webp\" style=\"max-width:min(100%,577px)\" alt=\"Exhibit\"><p>Meccini believes that the first-differenced AR(1) model is stationary and mean-reverting. She would like to determine the mean-reverting level and compare it against the most recently observed month-over-month inflation change (Δi).<\/p><p>After estimating the current period&#x27;s error to be 2%, Meccini believes that the first-differenced model can be used to estimate the variance of the errors in subsequent periods. Using the residuals from the first-differenced model, she performs a regression to test whether the model has ARCH(1) errors. Exhibit 3 summarizes those results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex025.webp\" style=\"max-width:min(100%,603px)\" alt=\"E \" loading=\"lazy\" src=\"l2img/uw-quant/ex023.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit\"><p>Meccini must next determine if this model is properly specified. She plans to test for nonstationarity and is assessing options for how to perform that test. She decides to first-difference the AR(1) model data and then runs a second regression. That regression&#x27;s results are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex024.webp\" style=\"max-width:min(100%,577px)\" alt=\"Exhibit\"><p>Meccini believes that the first-differenced AR(1) model is stationary and mean-reverting. She would like to determine the mean-reverting level and compare it against the most recently observed month-over-month inflation change (Δi).<\/p><p>After estimating the current period&#x27;s error to be 2%, Meccini believes that the first-differenced model can be used to estimate the variance of the errors in subsequent periods. Using the residuals from the first-differenced model, she performs a regression to test whether the model has ARCH(1) errors. Exhibit 3 summarizes those results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex025.webp\" style=\"max-width:min(100%,603px)\" alt=\"Exhibit\"><p>Finally, Meccini uses the first-differenced AR(1) model to forecast inflation for the next three months. She is interested in the out-of-sample forecasting performance of her model, so she compares the actual inflation for those months against the forecast. For the three months, the sum of square errors of that sample is 0.0019. An earlier version of her model (Model 1) had a RMSE of 3%, and she would like to verify her current model (Model 2) using the same method.<\/p><\/div><\/details><div class=\"qtext\"><p>Compared to the older model (Model 1) with a RMSE of 3%, the new model (Model 2) is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q092.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":93,"q":"To estimate whether or not a country will default, Drenth should most appropriately use a:","opts":["logistic regression model.","restricted regression model.","regression model with a dummy independent variable."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a093.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a093.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 93–96 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Ursula Beijer is the portfolio manager of Scheldt Equities Fund. The fund holds stocks from emerging markets, and Beijer is concerned about the risk of government debt default. She asks Roland Drenth, a quantitative analyst at the firm, to build a multiple regression model based on macroeconomic factors to predict whether or not a country will default. Drenth explains that the objective of the model is to predict a discrete variable that takes the value of:<\/p><p>1 when the model predicts a debt default or 0 when a default is not expected. Beijer also wants to investigate how the returns of the Scheldt fund are influenced by distinct market factors. She asks Drenth to build a regression model of the fund&#x27;s excess returns against the three factors in the Fama-French model. Drenth presents the following multiple regression equation:<\/p><p>SEFi = b0 + b1MKTRFi + b2SMBi + b3HMLi + εi, where:<\/p><p>SEF = Excess return of the Scheldt Equities Fund MKTRF = Market excess return over the risk-free rate SMB = Small minus big (size effect) HML = High minus low (value premium) Beijer asks Drenth how to interpret the regression variables and estimated coefficients. Drenth makes the following statements:<\/p><p><b>Statement 1:<\/b> The intercept b0 is the fund&#x27;s expected excess return if the error term εi is zero.<\/p><p><b>Statement 2:<\/b> The slope b1 describes how SEF is affected by a unit change in MKTRF while holding SMB and HML constant.<\/p><p><b>Statement 3:<\/b> MKTRF, SMB, and HML constitute the stochastic part of the model.<\/p><p>Drenth then runs the regression with 60 monthly return observations, stated in whole percentages (ie, 1 = 1%), and arrives at the following equation with the estimated coefficients:<\/p><p>SEF = 0.06 + 0.51MKTRF − 0.72SMB + 0.30HML<\/p><p>Beijer asks for a numeric example, and Drenth estimates Scheldt&#x27;s excess return in a hypothetical month, given the following assumptions:<\/p><p>MKTRF = 1.00%,<\/p><p>SMB = 1.00%, and<\/p><p>HML = 0.50%.<\/p><p>Beijer wants to use the regression model to predict the fund&#x27;s performance. However, Drenth advises Beijer that several additional steps must be taken before deeming the model acceptable for making predictions and performing further analysis.<\/p><\/div><\/details><div class=\"qtext\"><p>To estimate whether or not a country will default, Drenth should most appropriately use a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q093.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":94,"q":"Which of the following statements about variables and coefficients is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a094.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a094.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 93–96 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ursula Beijer is the portfolio manager of Scheldt Equities Fund. The fund holds stocks from emerging markets, and Beijer is concerned about the risk of government debt default. She asks Roland Drenth, a quantitative analyst at the firm, to build a multiple regression model based on macroeconomic factors to predict whether or not a country will default. Drenth explains that the objective of the model is to predict a discrete variable that takes the value of:<\/p><p>1 when the model predicts a debt default or 0 when a default is not expected. Beijer also wants to investigate how the returns of the Scheldt fund are influenced by distinct market factors. She asks Drenth to build a regression model of the fund&#x27;s excess returns against the three factors in the Fama-French model. Drenth presents the following multiple regression equation:<\/p><p>SEFi = b0 + b1MKTRFi + b2SMBi + b3HMLi + εi, where:<\/p><p>SEF = Excess return of the Scheldt Equities Fund MKTRF = Market excess return over the risk-free rate SMB = Small minus big (size effect) HML = High minus low (value premium) Beijer asks Drenth how to interpret the regression variables and estimated coefficients. Drenth makes the following statements:<\/p><p><b>Statement 1:<\/b> The intercept b0 is the fund&#x27;s expected excess return if the error term εi is zero.<\/p><p><b>Statement 2:<\/b> The slope b1 describes how SEF is affected by a unit change in MKTRF while holding SMB and HML constant.<\/p><p><b>Statement 3:<\/b> MKTRF, SMB, and HML constitute the stochastic part of the model.<\/p><p>Drenth then runs the regression with 60 monthly return observations, stated in whole percentages (ie, 1 = 1%), and arrives at the following equation with the estimated coefficients:<\/p><p>SEF = 0.06 + 0.51MKTRF − 0.72SMB + 0.30HML<\/p><p>Beijer asks for a numeric example, and Drenth estimates Scheldt&#x27;s excess return in a hypothetical month, given the following assumptions:<\/p><p>MKTRF = 1.00%,<\/p><p>SMB = 1.00%, and<\/p><p>HML = 0.50%.<\/p><p>Beijer wants to use the regression model to p const CFG = {"title": "UWorld — Quantitative Methods", "subtitle": "CFA Level II · 96 câu · UWorld item sets", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");

  Object.keys(pinned).forEach(i=>{

  if(graded) paintResults();

  if(done>0 && !graded){

    head.appendChild(num); head.appendChild(pin);

      else { grade(true); }

  }
  applySaved();

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){

    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }

    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);

  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");

  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;

  if(!label){
    label=document.createElement("span"); label.className="question-subject";

  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;

}

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;

        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

<style id="qnav-note-css">
  #navGrid .cell.noted::before{content:"\1F4DD";position:absolute;top:-4px;left:-3px;font-size:10px;line-height:1}
</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
