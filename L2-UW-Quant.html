\">Vignette<\/span>Case 7 · Câu 37–42 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jing Shu, an investment analyst at a brokerage firm, is developing a text data machine learning (ML) model based on social media posts and online news services. Fang Chen, his supervisor, requests more details about the text exploration step, and Shu replies:<\/p><p><b>Statement 1:<\/b> Document frequency (DF) can be used to remove noise features from the data set.<\/p><p><b>Statement 2:<\/b> Name entity recognition (NER) and parts of speech (POS) are common techniques of feature selection.<\/p><p><b>Statement 3:<\/b> Mutual information (MI) measures the independence between the occurrences of a token and the occurrence of a class.<\/p><p>Shu adds that the next step in the ML process is fitting a system of rules to the data set. If the model is a good fit, it can be generalized to new (out-of-sample) data; however, he is concerned that the model may be overfitted. Shu also informs Chen that he has already selected an appropriate method for model training since the data set contains ground truth.<\/p><p>Later, Shu divides the data set into a training set, a cross-validation set (CV), and a test set. Shu runs a model using the training set, aiming to anticipate trends in the stock market. The model classifies each text as Class &quot;1&quot; (positive sentiment) or Class &quot;0&quot; (negative sentiment). Shu uses an error analysis to measure model performance, creating the confusion matrix in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex011.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>After the performance evaluation of the model, Shu compares the model&#x27;s prediction error using different data sets (training and CV). He concludes that the prediction error on the training set is low, but the prediction error on the CV set is significantly higher.<\/p><\/div><\/details><div class=\"qtext\"><p>Shu&#x27;s comparison of the model&#x27;s prediction errors indicates that the current model exhibits low:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q042.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":43,"q":"Of the following data sets used by Butler, the one that is most likely to be covariance stationary is the monthly:","opts":["natural gas consumption in the US.","inflation rates for a developed market.","revenues of an expanding restaurant chain."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a043.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a043.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Frederick Butler is a senior quantitative analyst for a macro hedge fund. He is testing models using various macroeconomic data sets and their relation to companies&#x27; fundamentals. Butler begins modeling by deciding how to forecast each of three data sets. He wishes to use autoregressive (AR) models for forecasting, but first plans to check to determine if the data sets are covariance stationary. The data sets are for monthly:<\/p><p>natural gas consumption in the US.<\/p><p>inflation rates for a developed market.<\/p><p>revenues of an expanding restaurant chain.<\/p><p>Stephanie Hsieh, a junior quantitative analyst for the hedge fund, is forecasting US retail sales and has adjusted her model several times to make it covariance stationary. She presents the model&#x27;s most recent outputs to Butler in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex012.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>Butler explains that the requirements for expected value, variance, and covariance are what allow a covariance stationary time series to be regressed using AR. These requirements differ from those of a random walk. He notes that the dependent variable of a random walk is observed over several periods.<\/p><p>Butler runs an AR(1) regression on US household financial obligations as a percent of disposable personal income:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex013.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>The most recent data points for HFO%DPI are:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex014.webp\" style=\"max-width:min(100%,319px)\" alt=\"Exhibit\"><p>v<\/p><p>Butler asks Hsieh to review the regression. Hsieh plots the data points in a graph and notices that the data appear to exhibit multiple regimes. She asks Butler what the best course of action would be to fix the issue.<\/p><p>Hsieh asks Butler whether she should use an autoregressive moving-average (ARMA) model instead of an AR model. Butler states that:<\/p><p><b>Statement 1:<\/b> ARMA models have more stable parameters and therefore produce better forecasts than AR models.<\/p><p><b>Statement 2:<\/b> Unlike AR models, ARMA models do not have to be tested for autoregressive conditional heteroskedasticity (ARCH).<\/p><\/div><\/details><div class=\"qtext\"><p>Of the following data sets used by Butler, the one that is most likely to be covariance stationary is the monthly:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q043.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":44,"q":"Based on Exhibit 1, Hsieh could most appropriately conclude that the:","opts":["model is misspecified.","standard error is greatest for the fourth lag.","slope coefficient does not differ significantly from zero."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a044.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a044.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frederick Butler is a senior quantitative analyst for a macro hedge fund. He is testing models using various macroeconomic data sets and their relation to companies&#x27; fundamentals. Butler begins modeling by deciding how to forecast each of three data sets. He wishes to use autoregressive (AR) models for forecasting, but first plans to check to determine if the data sets are covariance stationary. The data sets are for monthly:<\/p><p>natural gas consumption in the US.<\/p><p>inflation rates for a developed market.<\/p><p>revenues of an expanding restaurant chain.<\/p><p>Stephanie Hsieh, a junior quantitative analyst for the hedge fund, is forecasting US retail sales and has adjusted her model several times to make it covariance stationary. She presents the model&#x27;s most recent outputs to Butler in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex012.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>Butler explains that the requirements for expected value, variance, and covariance are what allow a covariance stationary time series to be regressed using AR. These requirements differ from those of a random walk. He notes that the dependent variable of a random walk is observed over several periods.<\/p><p>Butler runs an AR(1) regression on US household financial obligations as a percent of disposable personal income:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex013.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>The most recent data points for HFO%DPI are:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex014.webp\" style=\"max-width:min(100%,319px)\" alt=\"Exhibit\"><p>v<\/p><p>Butler asks Hsieh to review the regression. Hsieh plots the data points in a graph and notices that the data appear to exhibit multiple regimes. She asks Butler what the best course of action would be to fix the issue.<\/p><p>Hsieh asks Butler whether she should use an autoregressive moving-average (ARMA) model instead of an AR model. Butler states that:<\/p><p><b>Statement 1:<\/b> ARMA models have more stable parameters and therefore produce better forecasts than AR models.<\/p><p><b>Statement 2:<\/b> Unlike AR models, ARMA models do not have to be tested for autoregressive conditional heteroskedasticity (ARCH).<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Hsieh could most appropriately conclude that the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q044.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":45,"q":"As the number of periods over which the dependent variable of a random walk is observed approaches infinity, the variance of the error term will:","opts":["decline to zero.","approach infinity.","remain the same."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a045.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a045.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frederick Butler is a senior quantitative analyst for a macro hedge fund. He is testing models using various macroeconomic data sets and their relation to companies&#x27; fundamentals. Butler begins modeling by deciding how to forecast each of three data sets. He wishes to use autoregressive (AR) models for forecasting, but first plans to check to determine if the data sets are covariance stationary. The data sets are for monthly:<\/p><p>natural gas consumption in the US.<\/p><p>inflation rates for a developed market.<\/p><p>revenues of an expanding restaurant chain.<\/p><p>Stephanie Hsieh, a junior quantitative analyst for the hedge fund, is forecasting US retail sales and has adjusted her model several times to make it covariance stationary. She presents the model&#x27;s most recent outputs to Butler in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex012.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>Butler explains that the requirements for expected value, variance, and covariance are what allow a covariance stationary time series to be regressed using AR. These requirements differ from those of a random walk. He notes that the dependent variable of a random walk is observed over several periods.<\/p><p>Butler runs an AR(1) regression on US household financial obligations as a percent of disposable personal income:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex013.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>The most recent data points for HFO%DPI are:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex014.webp\" style=\"max-width:min(100%,319px)\" alt=\"Exhibit\"><p>v<\/p><p>Butler asks Hsieh to review the regression. Hsieh plots the data points in a graph and notices that the data appear to exhibit multiple regimes. She asks Butler what the best course of action would be to fix the issue.<\/p><p>Hsieh asks Butler whether she should use an autoregressive moving-average (ARMA) model instead of an AR model. Butler states that:<\/p><p><b>Statement 1:<\/b> ARMA models have more stable parameters and therefore produce better forecasts than AR models.<\/p><p><b>Statement 2:<\/b> Unlike AR models, ARMA models do not have to be tested for autoregressive conditional heteroskedasticity (ARCH).<\/p><\/div><\/details><div class=\"qtext\"><p>As the number of periods over which the dependent variable of a random walk is observed approaches infinity, the variance of the error term will:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q045.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":46,"q":"Based on Exhibits 2 and 3, the value of HFO%DPI in July 2022 is closest to:","opts":["13.91","14.07","14.09"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a046.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a046.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frederick Butler is a senior quantitative analyst for a macro hedge fund. He is testing models using various macroeconomic data sets and their relation to companies&#x27; fundamentals. Butler begins modeling by deciding how to forecast each of three data sets. He wishes to use autoregressive (AR) models for forecasting, but first plans to check to determine if the data sets are covariance stationary. The data sets are for monthly:<\/p><p>natural gas consumption in the US.<\/p><p>inflation rates for a developed market.<\/p><p>revenues of an expanding restaurant chain.<\/p><p>Stephanie Hsieh, a junior quantitative analyst for the hedge fund, is forecasting US retail sales and has adjusted her model several times to make it covariance stationary. She presents the model&#x27;s most recent outputs to Butler in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex012.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>Butler explains that the requirements for expected value, variance, and covariance are what allow a covariance stationary time series to be regressed using AR. These requirements differ from those of a random walk. He notes that the dependent variable of a random walk is observed over several periods.<\/p><p>Butler runs an AR(1) regression on US household financial obligations as a percent of disposable personal income:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex013.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>The most recent data points for HFO%DPI are:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex014.webp\" style=\"max-width:min(100%,319px)\" alt=\"Exhibit\"><p>v<\/p><p>Butler asks Hsieh to review the regression. Hsieh plots the data points in a graph and notices that the data appear to exhibit multiple regimes. She asks Butler what the best course of action would be to fix the issue.<\/p><p>Hsieh asks Butler whether she should use an autoregressive moving-average (ARMA) model instead of an AR model. Butler states that:<\/p><p><b>Statement 1:<\/b> ARMA models have more stable parameters and therefore produce better forecasts than AR models.<\/p><p><b>Statement 2:<\/b> Unlike AR models, ARMA models do not have to be tested for autoregressive conditional heteroskedasticity (ARCH).<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 2 and 3, the value of HFO%DPI in July 2022 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q046.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":47,"q":"Which of the following is the best approach to fix the issue of multiple regimes?","opts":["Add additional lag coefficients","Shorten the regression time period","Take the log of the independent variable"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a047.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a047.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frederick Butler is a senior quantitative analyst for a macro hedge fund. He is testing models using various macroeconomic data sets and their relation to companies&#x27; fundamentals. Butler begins modeling by deciding how to forecast each of three data sets. He wishes to use autoregressive (AR) models for forecasting, but first plans to check to determine if the data sets are covariance stationary. The data sets are for monthly:<\/p><p>natural gas consumption in the US.<\/p><p>inflation rates for a developed market.<\/p><p>revenues of an expanding restaurant chain.<\/p><p>Stephanie Hsieh, a junior quantitative analyst for the hedge fund, is forecasting US retail sales and has adjusted her model several times to make it covariance stationary. She presents the model&#x27;s most recent outputs to Butler in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex012.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>Butler explains that the requirements for expected value, variance, and covariance are what allow a covariance stationary time series to be regressed using AR. These requirements differ from those of a random walk. He notes that the dependent variable of a random walk is observed over several periods.<\/p><p>Butler runs an AR(1) regression on US household financial obligations as a percent of disposable personal income:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex013.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>The most recent data points for HFO%DPI are:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex014.webp\" style=\"max-width:min(100%,319px)\" alt=\"Exhibit\"><p>v<\/p><p>Butler asks Hsieh to review the regression. Hsieh plots the data points in a graph and notices that the data appear to exhibit multiple regimes. She asks Butler what the best course of action would be to fix the issue.<\/p><p>Hsieh asks Butler whether she should use an autoregressive moving-average (ARMA) model instead of an AR model. Butler states that:<\/p><p><b>Statement 1:<\/b> ARMA models have more stable parameters and therefore produce better forecasts than AR models.<\/p><p><b>Statement 2:<\/b> Unlike AR models, ARMA models do not have to be tested for autoregressive conditional heteroskedasticity (ARCH).<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the best approach to fix the issue of multiple regimes?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q047.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":48,"q":"Which of Butler's statements about ARMA models is correct?","opts":["Statement 1","Statement 2","Neither Statement 1 nor Statement 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a048.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a048.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frederick Butler is a senior quantitative analyst for a macro hedge fund. He is testing models using various macroeconomic data sets and their relation to companies&#x27; fundamentals. Butler begins modeling by deciding how to forecast each of three data sets. He wishes to use autoregressive (AR) models for forecasting, but first plans to check to determine if the data sets are covariance stationary. The data sets are for monthly:<\/p><p>natural gas consumption in the US.<\/p><p>inflation rates for a developed market.<\/p><p>revenues of an expanding restaurant chain.<\/p><p>Stephanie Hsieh, a junior quantitative analyst for the hedge fund, is forecasting US retail sales and has adjusted her model several times to make it covariance stationary. She presents the model&#x27;s most recent outputs to Butler in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex012.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><p>Butler explains that the requirements for expected value, variance, and covariance are what allow a covariance stationary time series to be regressed using AR. These requirements differ from those of a random walk. He notes that the dependent variable of a random walk is observed over several periods.<\/p><p>Butler runs an AR(1) regression on US household financial obligations as a percent of disposable personal income:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex013.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>The most recent data points for HFO%DPI are:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex014.webp\" style=\"max-width:min(100%,319px)\" alt=\"Exhibit\"><p>v<\/p><p>Butler asks Hsieh to review the regression. Hsieh plots the data points in a graph and notices that the data appear to exhibit multiple regimes. She asks Butler what the best course of action would be to fix the issue.<\/p><p>Hsieh asks Butler whether she should use an autoregressive moving-average (ARMA) model instead of an AR model. Butler states that:<\/p><p><b>Statement 1:<\/b> ARMA models have more stable parameters and therefore produce better forecasts than AR models.<\/p><p><b>Statement 2:<\/b> Unlike AR models, ARMA models do not have to be tested for autoregressive conditional heteroskedasticity (ARCH).<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Butler&#x27;s statements about ARMA models is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q048.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":49,"q":"The machine learning model used in Article 1 is most likely:","opts":["K-means clustering.","hierarchical clustering.","principal components analysis."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a049.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a049.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 49–54 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Jonas Bauer plans to start an independent sell-side firm and use machine learning (ML) techniques for some of the firm&#x27;s processes. He plans to cover 28 healthcare and pharmaceutical stocks with a team of analysts. Unfamiliar with many popular ML techniques, Bauer decides to read articles from popular investment professionals:<\/p><p>Article 1: As an alternative to simply classifying your investments by industry, I found that it is more helpful to classify them by similar financial characteristics. My model uses 4 primary financial metrics to classify companies. After several trials with different hyperparameters, I found that splitting companies into 7 groups brought the most useful classification system.<\/p><p>Article 2: I have found three advantages to hierarchical clustering when compared with K-means clustering. These are:<\/p><p>Benefit 1: Hierarchical clustering will produce the same results whether using agglomerative or divisive methods.<\/p><p>Benefit 2: With hierarchical clustering, analysts can see the alternative segmentations at different levels of granularity.<\/p><p>Benefit 3: Unlike K-means clustering, hierarchical clustering allows you to predetermine the number of clusters.<\/p><p>Article 3: ML is a powerful tool and, if set up right, allows the machine to do the hard work for you. I prefer to use algorithms that discover the structure of the data themselves, so training is not required. Just provide it the inputs without a target or reward and they can help with dimension reduction and clustering problems.<\/p><p>Bauer, through a former colleague, learns about another hedge fund, Ancient Oak Investments (AOI), that is exploring the use of ML algorithms to make investment decisions. Bauer contacts the chief investment officer of AOI, Hanna Krause, to get more information. Krause tells Bauer that AOI is planning to integrate two types of ML algorithms.<\/p><p>The first ML algorithm that AOI is planning to use learns through a trial-and-error process, testing new trading strategies to decide which will get the best returns. Krause has programmed the algorithm with certain trading rules it must follow and specified that its goal is to maximize returns.<\/p><p>The second ML algorithm that AOI is planning to use will simplify complex economic models. These economic models will sometimes have 15 or more variables. Krause wants to use as few variables as possible, preferably 2 or 3, even if the original variables are combined. Krause does not want to train the model and would prefer the model to discover the relationships on its own.<\/p><\/div><\/details><div class=\"qtext\"><p>The machine learning model used in Article 1 is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q049.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":50,"q":"If Bauer implements the machine learning model described in Article 1, the hyperparameter he would most likely use is:","opts":["4","7","28"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a050.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\">< g/uw-quant/a055.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–60 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Oscar Bass, a junior data analyst at Great Price Electronics (GPE), is building a machine learning (ML) model to predict sales growth for each of GPE&#x27;s stores. The model is based on structured data collected from GPE&#x27;s enterprise resource planning (ERP) system. After performing some initial steps, Bass built a data set in which each row represents a GPE store, and each column represents a feature (or variable) of these stores. Exhibit 1 presents a sample of the raw data set before cleansing:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex015.webp\" style=\"max-width:min(100%,610px)\" alt=\"Exhibit\"><p>After cleansing the data, Bass<\/p><p>creates an additional variable to the data set: annual sales per square feet<\/p><p>removes the third column (State) since the state can be identified by the first two characters of the second column (Store).<\/p><p>Bass then decides to normalize the annual sales per store. Over the full data set, the variable &quot;Annual Sales&quot; ranges from USD 21.2 million to 81.2 million, with an average of USD 30.2 million and a standard deviation of USD 10.0 million.<\/p><p>Bass presents his analysis to Pamela Walker, GPE&#x27;s chief information officer (CIO). Walker believes that GPE&#x27;s ERP system provides a substantial amount of data and is an adequate source for the model. However, she is concerned about relying on a single data source and believes that external sources could produce insights about market trends and competitors&#x27; strategies. Walker asks Bass to add other sources of information to his analysis, including competitors&#x27; annual reports, social media posts, and online news services. Walker reminds Bass that unstructured data requires specific operations in the cleansing process of a text ML model.<\/p><\/div><\/details><div class=\"qtext\"><p>The initial steps performed by Bass to build Exhibit 1 most likely include data collection and:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q055.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":56,"q":"Which of the following best describes the type of error observed in the third row of data (ID 3) in Exhibit 1?","opts":["Invalidity error","Inconsistency error","Incompleteness error"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a056.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a056.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–60 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Oscar Bass, a junior data analyst at Great Price Electronics (GPE), is building a machine learning (ML) model to predict sales growth for each of GPE&#x27;s stores. The model is based on structured data collected from GPE&#x27;s enterprise resource planning (ERP) system. After performing some initial steps, Bass built a data set in which each row represents a GPE store, and each column represents a feature (or variable) of these stores. Exhibit 1 presents a sample of the raw data set before cleansing:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex015.webp\" style=\"max-width:min(100%,610px)\" alt=\"Exhibit\"><p>After cleansing the data, Bass<\/p><p>creates an additional variable to the data set: annual sales per square feet<\/p><p>removes the third column (State) since the state can be identified by the first two characters of the second column (Store).<\/p><p>Bass then decides to normalize the annual sales per store. Over the full data set, the variable &quot;Annual Sales&quot; ranges from USD 21.2 million to 81.2 million, with an average of USD 30.2 million and a standard deviation of USD 10.0 million.<\/p><p>Bass presents his analysis to Pamela Walker, GPE&#x27;s chief information officer (CIO). Walker believes that GPE&#x27;s ERP system provides a substantial amount of data and is an adequate source for the model. However, she is concerned about relying on a single data source and believes that external sources could produce insights about market trends and competitors&#x27; strategies. Walker asks Bass to add other sources of information to his analysis, including competitors&#x27; annual reports, social media posts, and online news services. Walker reminds Bass that unstructured data requires specific operations in the cleansing process of a text ML model.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the type of error observed in the third row of data (ID 3) in Exhibit 1?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q056.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":57,"q":"After cleansing the data, Bass creates an additional variable and removes a column from the data set. These transformations are best described as:","opts":["extraction and selection.","conversion and filtration.","aggregation and scaling."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a057.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a057.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–60 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Oscar Bass, a junior data analyst at Great Price Electronics (GPE), is building a machin d other sources of information to his analysis, including competitors&#x27; annual reports, social media posts, and online news services. Walker reminds Bass that unstructured data requires specific operations in the cleansing process of a text ML model.<\/p><\/div><\/details><div class=\"qtext\"><p>As part of the cleansing process of social media posts and online news services, some punctuation and numbers should most appropriately be:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q060.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":61,"q":"Which of the following violations is most likely indicated by the changes in the residuals' variances across observations?","opts":["Nonlinearity","Autocorrelation","Heteroskedasticity"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a061.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a061.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 61–64 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Henrik Lippert is a junior quantitative analyst at Regnitz. Lippert is running a multiple regression to predict revenue growth for an energy stock he covers and presents his findings to Tanja Vogl, his supervisor at Regnitz. Vogl analyzes the residual plot and notices a pattern: the variance of residuals changes across observations and is correlated with one of the independent variables. She tells Lippert that he needs to adjust the model since it appears to violate a multiple linear regression assumption.<\/p><p>Lippert uses 72 observations to recalculate the regression of the dependent variable against four factors, and he plots the three graphs presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/wx061.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>Vogl analyzes the graphs and says that Graph 1 suggests a potential violation of another multiple linear regression assumption. She adds that scatterplots can also be used to identify the violation of other assumptions, such as linearity.<\/p><p>Finally, Vogl asks Lippert to create a Q–Q plot of regression residuals; he presents the graph in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex016.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following violations is most likely indicated by the changes in the residuals&#x27; variances across observations?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q061.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":62,"q":"Graph 1 in Exhibit 1 indicates a possible violation of the assumption of independence of:","opts":["errors.","observations.","independent variables."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a062.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a062.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 61–64 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henrik Lippert is a junior quantitative analyst at Regnitz. Lippert is running a multiple regression to predict revenue growth for an energy stock he covers and presents his findings to Tanja Vogl, his supervisor at Regnitz. Vogl analyzes the residual plot and notices a pattern: the variance of residuals changes across observations and is correlated with one of the independent variables. She tells Lippert that he needs to adjust the model since it appears to violate a multiple linear regression assumption.<\/p><p>Lippert uses 72 observations to recalculate the regression of the dependent variable against four factors, and he plots the three graphs presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/wx061.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>Vogl analyzes the graphs and says that Graph 1 suggests a potential violation of another multiple linear regression assumption. She adds that scatterplots can also be used to identify the violation of other assumptions, such as linearity.<\/p><p>Finally, Vogl asks Lippert to create a Q–Q plot of regression residuals; he presents the graph in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex016.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Graph 1 in Exhibit 1 indicates a possible violation of the assumption of independence of:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q062.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":63,"q":"Based on Exhibit 1, which of the following graphs is most appropriately used to identify a violation of the linearity assumption?","opts":["Graph 1","Graph 2","Graph 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a063.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a063.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 61–64 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henrik Lippert is a junior quantitative analyst at Regnitz. Lippert is running a multiple regression to predict revenue growth for an energy stock he covers and presents his findings to Tanja Vogl, his supervisor at Regnitz. Vogl analyzes the residual plot and notices a pattern: the variance of residuals changes across observations and is correlated with one of the independent variables. She tells Lippert that he needs to adjust the model since it appears to violate a multiple linear regression assumption.<\/p><p>Lippert uses 72 observations to recalculate the regression of the dependent variable against four factors, and he plots the three graphs presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/wx061.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>Vogl analyzes the graphs and says that Graph 1 suggests a potential violation of another multiple linear regression assumption. She adds that scatterplots can also be used to identify the violation of other assumptions, such as linearity.<\/p><p>Finally, Vogl asks Lippert to create a Q–Q plot of regression residuals; he presents the graph in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex016.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which of the following graphs is most appropriately used to identify a violation of the linearity assumption?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q063.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":64,"q":"Based on Exhibit 2, which of the following multiple linear regression assumptions is most likely violated?","opts":["Linearity","Normality","Homoskedasticity"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a064.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a064.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 61–64 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henrik Lippert is a junior quantitative analyst at Regnitz. Lippert is running a multiple regression to predict revenue growth for an energy stock he covers and presents his findings to Tanja Vogl, his supervisor at Regnitz. Vogl analyzes the residual plot and notices a pattern: the variance of residuals changes across observations and is correlated with one of the independent variables. She tells Lippert that he needs to adjust the model since it appears to violate a multiple linear regression assumption.<\/p><p>Lippert uses 72 observations to recalculate the regression of the dependent variable against four factors, and he plots the three graphs presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/wx061.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>Vogl analyzes the graphs and says that Graph 1 suggests a potential violation of another multiple linear regression assumption. She adds that scatterplots can also be used to identify the violation of other assumptions, such as linearity.<\/p><p>Finally, Vogl asks Lippert to create a Q–Q plot of regression residuals; he presents the graph in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex016.webp\" style=\"max-width:min(100%,582px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, which of the following multiple linear regression assumptions is most likely violated?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q064.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":65,"q":"If Castillo models Sol Banco based on only two factors, but Espinosa is correct about the third factor, then the omitted variable will most likely cause:","opts":["serial correlation or multicollinearity.","multicollinearity or heteroskedasticity.","heteroskedasticity or serial correlation."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a065.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a065.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 65–68 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Hector Castillo and Rosa Espinosa are fixed-income analysts running regressions on companies they cover. They start by regressing revenue for Sol Banco, a regional bank. Castillo chooses two independent variables: the central bank&#x27;s interest rate and the country&#x27;s aggregate savings rate. Espinosa believes that the interest rate spread is an important third independent factor for an accurate regression.<\/p><p>Castillo and Espinosa then discuss violations of regression assumptions they should be aware of. Castillo states that when using multiple regressions to forecast asset prices:<\/p><p><b>Statement 1:<\/b> Positive serial correlation affects the consistency of regression coefficients and statistical tests.<\/p><p><b>Statement 2:<\/b> Negative serial correlation means a negative residual for one observation increases the chance of a negative residual for the next observation.<\/p><p><b>Statement 3:<\/b> Patterns in serially correlated residuals may contain information that has the potential to be exploited.<\/p><p>Espinosa then discusses heteroskedasticity, saying that one of her models was displaying signs of conditional heteroskedasticity. Knowing this, she questions the accuracy of the t-tests for the individual coefficients. She adds that running a Breusch–Pagan (BP) test can diagnose for potential conditional heteroskedasticity. She shows Castillo a BP test that she ran on an earlier regression with a test statistic of 37.3 and p-value of 0.005.<\/p><\/div><\/details><div class=\"qtext\"><p>If Castillo models Sol Banco based on only two factors, but Espinosa is correct about the third factor, then the omitted variable will most likely cause:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q065.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":66,"q":"Which of Castillo's statements about serial correlation is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a066.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a066.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 65–68 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Castillo and Rosa Espinosa are fixed-income analysts running regressions on companies they cover. They start by regressing revenue for Sol Banco, a regional bank. Castillo chooses two independent variables: the central bank&#x27;s interest rate and the country&#x27;s aggregate savings rate. Espinosa believes that the interest rate spread is an important third independent factor for an accurate regression.<\/p><p>Castillo and Espinosa then discuss violations of regression assumptions they should be aware of. Castillo states that when using multiple regressions to forecast asset prices:<\/p><p><b>Statement 1:<\/b> Positive serial correlation affects the consistency of regression coefficients and statistical tests.<\/p><p><b>Statement 2:<\/b> Negative serial correlation means a negative residual for one observation increases the chance of a negative residual for the next observation.<\/p><p><b>Statement 3:<\/b> Patterns in serially correlated residuals may contain information that has the potential to be exploited.<\/p><p>Espinosa then discusses heteroskedasticity, saying that one of her models was displaying signs of conditional heteroskedasticity. Knowing this, she questions the accuracy of the t-tests for the individual coefficients. She adds that running a Breusch–Pagan (BP) test can diagnose for potential conditional heteroskedasticity. She shows Castillo a BP test that she ran on an earlier regression with a test statistic of 37.3 and p-value of 0.005.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Castillo&#x27;s statements about serial correlation is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q066.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":67,"q":"Which type of error is most likely present in the t-test for the coefficients of Espinosa's model?","opts":["Only Type","Only Type II","Either Type I or Type I|"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a067.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a067.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 65–68 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Castillo and Rosa Espinosa are fixed-income analysts running regressions on companies they cover. They start by regressing revenue for Sol Banco, a regional bank. Castillo chooses two independent variables: the central bank&#x27;s interest rate and the country&#x27;s aggregate savings rate. Espinosa believes that the interest rate spread is an important third independent factor for an accurate regression.<\/p><p>Castillo and Espinosa then discuss violations of regression assumptions they should be aware of. Castillo states that when using multiple regressions to forecast asset prices:<\/p><p><b>Statement 1:<\/b> Positive serial correlation affects the consistency of regression coefficients and statistical tests.<\/p><p><b>Statement 2:<\/b> Negative serial correlation means a negative residual for one observation increases the chance of a negative residual for the next observation.<\/p><p><b>Statement 3:<\/b> Patterns in serially correlated residuals may contain information that has the potential to be exploited.<\/p><p>Espinosa then discusses heteroskedasticity, saying that one of her models was displaying signs of conditional heteroskedasticity. Knowing this, she questions the accuracy of the t-tests for the individual coefficients. She adds that running a Breusch–Pagan (BP) test can diagnose for potential conditional heteroskedasticity. She shows Castillo a BP test that she ran on an earlier regression with a test statistic of 37.3 and p-value of 0.005.<\/p><\/div><\/details><div class=\"qtext\"><p>Which type of error is most likely present in the t-test for the coefficients of Espinosa&#x27;s model?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q067.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":68,"q":"Based on the result from Espinosa's Breusch-Pagan test, at a 95% confidence interval, what action is most appropriate?","opts":["No action needed","Use robust standard errors","Use variance inflation factors"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a068.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a068.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 65–68 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Castillo and Rosa Espinosa are fixed-income analysts running regressions on companies they cover. They start by regressing revenue for Sol Banco, a regional bank. Castillo chooses two independent variables: the central bank&#x27;s interest rate and the country&#x27;s aggregate savings rate. Espinosa believes that the interest rate spread is an important third independent factor for an accurate regression.<\/p><p>Castillo and Espinosa then discuss violations of regression assumptions they should be aware of. Castillo states that when using multiple regressions to forecast asset prices:<\/p><p><b>Statement 1:<\/b> Positive serial correlation affects the consistency of regression coefficients and statistical tests.<\/p><p><b>Statement 2:<\/b> Negative serial correlation means a negative residual for one observation increases the chance of a negative residual for the next observation.<\/p><p><b>Statement 3:<\/b> Patterns in serially correlated residuals may contain information that has the potential to be exploited.<\/p><p>Espinosa then discusses heteroskedasticity, saying that one of her models was displaying signs of conditional heteroskedasticity. Knowing this, she questions the accuracy of the t-tests for the individual coefficients. She adds that running a Breusch–Pagan (BP) test can diagnose for potential conditional heteroskedasticity. She shows Castillo a BP test that she ran on an earlier regression with a test statistic of 37.3 and p-value of 0.005.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the result from Espinosa&#x27;s Breusch-Pagan test, at a 95% confidence interval, what action is most appropriate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q068.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":69,"q":"Which of Vaillant's statements about the techniques is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a069.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a069.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 69–74 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Pauline Vaillant, a data analyst at a hedge fund, built a machine learning (ML) model using text data from social media posts, internet discussion forums, and online news services. The objective of the model is to predict the sentiments of the texts in the data set. Vaillant explains the model-building process to Pierre Frossard, an equity analyst at the hedge fund: &quot;After cleansing and normalizing the data, I used common techniques to gain insights about the data.&quot; Frossard asks about these techniques, and Vaillant states:<\/p><p><b>Statement 1:<\/b> A bag-of-words model presents the tokens in the sequence they appear in the data set.<\/p><p><b>Statement 2:<\/b> A document term matrix is a table displaying the occurrences of each token in each text or sentence of the data set.<\/p><p><b>Statement 3:<\/b> A word cloud is a visualization in which the tokens with the largest font size are the most relevant for model training.<\/p><p>Vaillant explains to Frossard that she built a table with the term frequency (TF) and inverse document frequency (IDF) of the tokens in the data set. She then analyzed the TF–IDF values and selected the most relevant tokens for model training.<\/p><p>Vaillant tells Frossard that she split the data set into training, cross-validation (CV), and test data sets. She built a confusion matrix to understand the performance metrics, using the training data set and classifying the texts as 1 (positive sentiment) or 0 (negative sentiment). Frossard says, &quot;I am very concerned about the model incorrectly predicting a positive sentiment.&quot;<\/p><p>Vaillant decides to evaluate different models using a logistic regression. She applies this method to the training data set, predicting positive or negative sentiments based on each sentence&#x27;s probability value (p-value). She then uses the receiver operating characteristic (ROC) technique to compare the results of four different models with both training and CV data sets. Exhibit 1 displays the area under the curve (AUC) for each model&#x27;s ROC curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex017.webp\" style=\"max-width:min(100%,452px)\" alt=\"Exhibit\"><p>Finally, Vaillant decides to apply the least absolute shrinkage and selection operator (LASSO) regularization to Model 4 in Exhibit 1.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Vaillant&#x27;s statements about the techniques is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q069.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":70,"q":"Vaillant should most appropriately select the tokens with TF-IDF (term frequency-inverse document frequency) values that are:","opts":["low.","intermediate.","high."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a070.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a070.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 69–74 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pauline Vaillant, a data analyst at a hedge fund, built a machine learning (ML) model using text data from social media posts, internet discussion forums, and online news services. The objective of the model is to predict the sentiments of the texts in the data set. Vaillant explains the model-building process to Pierre Frossard, an equity analyst at the hedge fund: &quot;After cleansing and normalizing the data, I used common techniques to gain insights about the data.&quot; Frossard asks about these techniques, and Vaillant states:<\/p><p><b>Statement 1:<\/b> A bag-of-words model presents the tokens in the sequence they appear in the data set.<\/p><p><b>Statement 2:<\/b> A document term matrix is a table displaying the occurrences of each token in each text or sentence of the data set.<\/p><p><b>Statement 3:<\/b> A word cloud is a visualization in which the tokens with the largest font size are the most relevant for model training.<\/p><p>Vaillant explains to Frossard that she built a table with the term frequency (TF) and inverse document frequency (IDF) of the tokens in the data set. She then analyzed the TF–IDF values and selected the most relevant tokens for model training.<\/p><p>Vaillant tells Frossard that she split the data set into training, cross-validation (CV), and test data sets. She built a confusion matrix to understand the performance metrics, using the training data set and classifying the texts as 1 (positive sentiment) or 0 (negative sentiment). Frossard says, &quot;I am very concerned about the model incorrectly predicting a positive sentiment.&quot;<\/p><p>Vaillant decides to evaluate different models using a logistic regression. She applies this method to the training data set, predicting positive or negative sentiments based on each sentence&#x27;s probability value (p-value). She then uses the receiver operating characteristic (ROC) technique to compare the results of four different models with both training and CV data sets. Exhibit 1 displays the area under the curve (AUC) for each model&#x27;s ROC curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex017.webp\" style=\"max-width:min(100%,452px)\" alt=\"Exhibit\"><p>Finally, Vaillant decides to apply the least absolute shrinkage and selection operator (LASSO) regularization to Model 4 in Exhibit 1.<\/p><\/div><\/details><div cl ut the model incorrectly predicting a positive sentiment.&quot;<\/p><p>Vaillant decides to evaluate different models using a logistic regression. She applies this method to the training data set, predicting positive or negative sentiments based on each sentence&#x27;s probability value (p-value). She then uses the receiver operating characteristic (ROC) technique to compare the results of four different models with both training and CV data sets. Exhibit 1 displays the area under the curve (AUC) for each model&#x27;s ROC curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex017.webp\" style=\"max-width:min(100%,452px)\" alt=\"Exhibit\"><p>Finally, Vaillant decides to apply the least absolute shrinkage and selection operator (LASSO) regularization to Model 4 in Exhibit 1.<\/p><\/div><\/details><div class=\"qtext\"><p>When applying a logistic regression to the training data set, Vaillant should predict a negative sentiment for sentences with a p-value below:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q072.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":73,"q":"Based on Exhibit 1, which of the following models provides the best model performance?","opts":["Model 1","Model 2","Model 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a073.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a073.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 69–74 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pauline Vaillant, a data analyst at a hedge fund, built a machine learning (ML) model using text data from social media posts, internet discussion forums, and online news services. The objective of the model is to predict the sentiments of the texts in the data set. Vaillant explains the model-building process to Pierre Frossard, an equity analyst at the hedge fund: &quot;After cleansing and normalizing the data, I used common techniques to gain insights about the data.&quot; Frossard asks about these techniques, and Vaillant states:<\/p><p><b>Statement 1:<\/b> A bag-of-words model presents the tokens in the sequence they appear in the data set.<\/p><p><b>Statement 2:<\/b> A document term matrix is a table displaying the occurrences of each token in each text or sentence of the data set.<\/p><p><b>Statement 3:<\/b> A word cloud is a visualization in which the tokens with the largest font size are the most relevant for model training.<\/p><p>Vaillant explains to Frossard that she built a table with the term frequency (TF) and inverse document frequency (IDF) of the tokens in the data set. She then analyzed the TF–IDF values and selected the most relevant tokens for model training.<\/p><p>Vaillant tells Frossard that she split the data set into training, cross-validation (CV), and test data sets. She built a confusion matrix to understand the performance metrics, using the training data set and classifying the texts as 1 (positive sentiment) or 0 (negative sentiment). Frossard says, &quot;I am very concerned about the model incorrectly predicting a positive sentiment.&quot;<\/p><p>Vaillant decides to evaluate different models using a logistic regression. She applies this method to the training data set, predicting positive or negative sentiments based on each sentence&#x27;s probability value (p-value). She then uses the receiver operating characteristic (ROC) technique to compare the results of four different models with both training and CV data sets. Exhibit 1 displays the area under the curve (AUC) for each model&#x27;s ROC curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex017.webp\" style=\"max-width:min(100%,452px)\" alt=\"Exhibit\"><p>Finally, Vaillant decides to apply the least absolute shrinkage and selection operator (LASSO) regularization to Model 4 in Exhibit 1.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which of the following models provides the best model performance?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q073.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":74,"q":"After applying the LASSO regularization to Model 4 of Exhibit 1, the AUC of the training set will most likely:","opts":["decrease.","remain the same.","increase."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a074.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a074.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 69–74 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pauline Vaillant, a data analyst at a hedge fund, built a machine learning (ML) model using text data from social media posts, internet discussion forums, and online news services. The objective of the model is to predict the sentiments of the texts in the data set. Vaillant explains the model-building process to Pierre Frossard, an equity analyst at the hedge fund: &quot;After cleansing and normalizing the data, I used common techniques to gain insights about the data.&quot; Frossard asks about these techniques, and Vaillant states:<\/p><p><b>Statement 1:<\/b> A bag-of-words model presents the tokens in the sequence they appear in the data set.<\/p><p><b>Statement 2:<\/b> A document term matrix is a table displaying the occurrences of each token in each text or sentence of the data set.<\/p><p><b>Statement 3:<\/b> A word cloud is a visualization in which the tokens with the largest font size are the most relevant for model training.<\/p><p>Vaillant explains to Frossard that she built a table with the term frequency (TF) and inverse document frequency (IDF) of the tokens in the data set. She then analyzed the TF–IDF values and selected the most relevant tokens for model training.<\/p><p>Vaillant tells Frossard that she split the data set into training, cross-validation (CV), and test data sets. She built a confusion matrix to understand the performance metrics, using the training data set and classifying the texts as 1 (positive sentiment) or 0 (negative sentiment). Frossard says, &quot;I am very concerned about the model incorrectly predicting a positive sentiment.&quot;<\/p><p>Vaillant decides to evaluate different models using a logistic regression. She applies this method to the training data set, predicting positive or negative sentiments based on each sentence&#x27;s probability value (p-value). She then uses the receiver operating characteristic (ROC) technique to compare the results of four different models with both training and CV data sets. Exhibit 1 displays the area under the curve (AUC) for each model&#x27;s ROC curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-quant/ex017.webp\" style=\"max-width:min(100%,452px)\" alt=\"Exhibit\"><p>Finally, Vaillant decides to apply the least absolute shrinkage and selection operator (LASSO) regularization to Model 4 in Exhibit 1.<\/p><\/div><\/details><div class=\"qtext\"><p>After applying the LASSO regularization to Model 4 of Exhibit 1, the AUC of the training set will most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q074.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":75,"q":"Dias's machine learning algorithm most likely suffers from which of the following?","opts":["Overfitting","Projection error","Backward propagation"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a075.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a075.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 75–80 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Camila Soares, CFA, is a portfolio manager at Down River Capital (DRC). She reads about how machine learning (ML) can improve her portfolio&#x27;s performance and asks three of her colleagues, Luciana Dias, Gabriel Batista, and Felipe Araujo, for advice.<\/p><p>Dias is building an ML algorithm that will automatically trade overbought or oversold stocks based on multiple technical factors. She states that although the model captures the relationships well in the test sample, it is not translating this into useful results once she uses validation and test samples.<\/p><p>Batista wants to improve on an existing model. He tells Soares that the model has shown low in-sample error but high out-of-sample error. To correct this, Batista plans to:<\/p><p>Employ a least absolute shrinkage and selection operator (LASSO) model with λ = 0.<\/p><p>Add features to help explain outliers.<\/p><p>Use cross-validation to reduce holdout samples.<\/p><p>Batista adds, &quot;More than one ML algorithm can be used in most cases, but not every ML algorithm is useful for every purpose. In this case, I wanted to use a supervised ML algorithm to simplify some fixed income models by cutting down on the number of features I had identified using an ordinary least squares regression. As you know, having multiple correlated parameters can result in incorrect results.&quot;<\/p><p>Araujo has been working with advanced ML algorithms based on neural networks. One such algorithm that Araujo discovered involves speech recognition and natural language processing. Araujo has begun looking into how this algorithm could be used to help sift through large amounts of news articles, press releases, and company presentations to filter for information that would be pertinent for investment decisions.<\/p><p>Soares tells Araujo that she has heard about neural networks but is not sure how they work. Araujo says:<\/p><p>Comment 1: One difference between neural networks and multiple regression is that neural networks add a hidden layer that adds multiple steps of linear functionality between the input and output layers.<\/p><p>Comment 2: Each node in a neural network typically has a summation operator and activation function that transform an input from the previous layer into an output for the next layer.<\/p><p>Comment 3: Deep learning nets, which are neural networks with 100 or more hidden layers, can help solve even more complex problems.<\/p><\/div><\/details><div class=\"qtext\"><p>Dias&#x27;s machine learning algorithm most likely suffers from which of the following?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q075.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":76,"q":"Batista's corrections to his model were most likely made to address which type of error?","opts":["Bias error","Base error","Variance error"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a076.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a076.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 75–80 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Camila Soares, CFA, is a portfolio manager at Down River Capital (DRC). She reads about how machine learning (ML) can improve her portfolio&#x27;s performance and asks three of her colleagues, Luciana Dias, Gabriel Batista, and Felipe Araujo, for advice.<\/p><p>Dias is building an ML algorithm that will automatically trade overbought or oversold stocks based on multiple technical factors. She states that although the model captures the relationships well in the test sample, it is not translating this into useful results once she uses validation and test samples.<\/p><p>Batista wants to improve on an existing model. He tells Soares that the model has shown low in-sample error but high out-of-sample error. To correct this, Batista plans to:<\/p><p>Employ a least absolute shrinkage and selection operator (LASSO) model with λ = 0.<\/p><p>Add features to help explain outliers.<\/p><p>Use cross-validation to reduce holdout samples.<\/p><p>Batista adds, &quot;More than one ML algorithm can be used in most cases, but not every ML algorithm is useful for every purpose. In this case, I wanted to use a supervised ML algorithm to simplify some fixed income models by cutting down on the number of features I had identified using an ordinary least squares regression. As you know, having multiple correlated parameters can result in incorrect results.&quot;<\/p><p>Araujo has been working with advanced ML algorithms based on neural networks. One such algorithm that Araujo discovered involves speech recognition and natural language processing. Araujo has begun looking into how this algorithm could be used to help sift through large amounts of news articles, press releases, and company presentations to filter for information that would be pertinent for investment decisions.<\/p><p>Soares tells Araujo that she has heard about neural networks but is not sure how they work. Araujo says:<\/p><p>Comment 1: One difference between neural networks and multiple regression is that neural networks add a hidden layer that adds multiple steps of linear functionality between the input and output layers.<\/p><p>Comment 2: Each node in a neural network typically has a summation operator and activation function that transform an input from the previous layer into an output for the next layer.<\/p><p>Comment 3: Deep learning nets, which are neural networks with 100 or more hidden layers, can help solve even more complex problems.<\/p><\/div><\/details><div class=\"qtext\"><p>Batista&#x27;s corrections to his model were most likely made to address which type of error?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q076.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":77,"q":"Which of the following approaches would be most appropriate for Batista to implement to correct his model?","opts":["Employing a LASSO model with 1 = 0","Adding features to help explain outliers","Using cross-validation to reduce holdout samples"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a077.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a077.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 75–80 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Camila Soares, CFA, is a portfolio manager at Down River Capital (DRC). She reads about how machine learning (ML) can improve her portfolio&#x27;s performance and asks three of her colleagues, Luciana Dias, Gabriel Batista, and Felipe Araujo, for advice.<\/p><p>Dias is building an ML algorithm that will automatically trade overbought or oversold stocks based on multiple technical factors. She states that although the model captures the relationships well in the test sample, it is not translating this into useful results once she uses validation and test samples.<\/p><p>Batista wants to improve on an existing model. He tells Soares that the model has shown low in-sample error but high out-of-sample error. To correct this, Batista pl ast squares regression. As you know, having multiple correlated parameters can result in incorrect results.&quot;<\/p><p>Araujo has been working with advanced ML algorithms based on neural networks. One such algorithm that Araujo discovered involves speech recognition and natural language processing. Araujo has begun looking into how this algorithm could be used to help sift through large amounts of news articles, press releases, and company presentations to filter for information that would be pertinent for investment decisions.<\/p><p>Soares tells Araujo that she has heard about neural networks but is not sure how they work. Araujo says:<\/p><p>Comment 1: One difference between neural networks and multiple regression is that neural networks add a hidden layer that adds multiple steps of linear functionality between the input and output layers.<\/p><p>Comment 2: Each node in a neural network typically has a summation operator and activation function that transform an input from the previous layer into an output for the next layer.<\/p><p>Comment 3: Deep learning nets, which are neural networks with 100 or more hidden layers, can help solve even more complex problems.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following supervised machine learning algorithms would be most appropriate for Batista to utilize to simplify the fixed income models?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-quant/q078.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":79,"q":"The model that Araujo is working with is best described as:","opts":["Deep learning","Supervised machine learning","Unsupervised machine learning"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-quant/a079.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-quant/a079.webp\" alt=\"Lời giải\"><\/a>","qht
