<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An investor is considering purchasing ACQ. There is a 30% probability that ACQ will be\nacquired in the next two months. If ACQ is acquired, there is a 40% probability of earning a\n30% return on the investment and a 60% probability of earning 25%. If ACQ is not acquired,\nthe expected return is 12%. What is the expected return on this investment?", "opts": ["16.5%.", "12.3%.", "18.3%."], "ans": "A", "expl": "E(r) = (0.70 × 0.12) + (0.30 × 0.40 × 0.30) + (0.30 × 0.60 × 0.25) = 0.165.\n(Module 4.1, LOS 4.a)"}, {"n": 2, "q": "An economist estimates a 60% probability that the economy will expand next year. The\ntechnology sector has a 70% probability of outperforming the market if the economy\nexpands and a 10% probability of outperforming the market if the economy does not\nexpand. Given the new information that the technology sector will not outperform the\nmarket, the probability that the economy will not expand is closest to:", "opts": ["67%.", "54%.", "33%."], "ans": "A", "expl": "A decision tree diagram illustrating economic expansion probabilities and technology\nsector performance, with branching percentages leading to four possible outcomes based\non whether the economy expands and technology outperforms or not.\nUsing the new information we can use Bayes' formula to update the probability.\nP(economy does not expand | tech does not outperform) = P(economy does not expand\nand tech does not outperform) / P(tech does not outperform).\nP(economy does not expand and tech does not outperform) = P(tech does not outperform\n| economy does not expand) × P(economy does not expand) = 0.90 × 0.40 = 0.36.\nP(economy does expand and tech does not outperform) = P(tech does not outperform |\neconomy does expand) × P(economy does expand) = 0.30 × 0.60 = 0.18.\nP(economy does not expand) = 1.00 – P(economy does expand) = 1.00 – 0.60 = 0.40.\nP(tech does not outperform | economy does not expand) = 1.00 – P(tech does outperform\n| economy does not expand) = 1.00 – 0.10 = 0.90.\nP(tech does not outperform) = P(tech does not outperform and economy does not expand)\n+ P(tech does not outperform and economy does expand) = 0.36 + 0.18 = 0.54.\nP(economy does not expand | tech does not outperform) = P(economy does not expand\nand tech does not outperform) / P(tech does not outperform) = 0.36 / 0.54 = 0.67.\n(Module 4.1, LOS 4.c)"}, {"n": 3, "q": "A two-sided but very thick coin is expected to land on its edge twice out of every 100 flips.\nAnd the probability of face up (heads) and the probability of face down (tails) are equal.\nWhen the coin is flipped, the prize is $1 for heads, $2 for tails, and $50 when the coin lands\non its edge. What is the expected value of the prize on a single coin toss?", "opts": ["$2.47.", "$1.50.", "$17.67."], "ans": "A", "expl": "We need to calculate of probability weighted average payoff.\nSince the probability of the coin landing on its edge is 0.02, the probability of each of the\nother two events is 0.49. The expected payoff is: (0.02 × $50) + (0.49 × $1) + (0.49 × $2) =\n$2.47.\nOutcomeProbabilityPayoffProbability × Payoff\nEdge2 / 100 = 2%$502% × $50\nHeads49%$149% × $1\nTails49%$249% × $2\nExpected Payoff = ∑ Probability × Payoff$2.47\n(Module 4.1, LOS 4.a)"}, {"n": 4, "q": "Bonds rated B have a 25% chance of default in five years. Bonds rated CCC have a 40%\nchance of default in five years. A portfolio consists of 30% B and 70% CCC-rated bonds. If a\nrandomly selected bond defaults in a five-year period, what is the probability that it was a B-\nrated bond?", "opts": ["0.211.", "0.250.", "0.625."], "ans": "A", "expl": "According to Bayes' formula: P(B | default) = P(default and B) / P(default).\nP(default and B) = P(default | B) × P(B) = 0.250 × 0.300 = 0.075\nP(default and CCC) = P(default | CCC) × P(CCC) = 0.400 × 0.700 = 0.280\nP(default) = P(default and B) + P(default and CCC) = 0.355\nP(B | default) = P(default and B) / P(default) = 0.075 / 0.355 = 0.211\n(Module 4.1, LOS 4.c)"}, {"n": 5, "q": "An analyst expects that 20% of all publicly traded companies will experience a decline in\nearnings next year. The analyst has developed a ratio to help forecast this decline. If the\ncompany has a decline in earnings, there is a 90% probability that this ratio will be negative.\nIf the company does not have a decline in earnings, there is only a 10% probability that the\nratio will be negative. The analyst randomly selects a company with a negative ratio. Based\non Bayes' theorem, the updated probability that the company will experience a decline is:", "opts": ["18%.", "26%.", "69%."], "ans": "C", "expl": "Given a set of prior probabilities for an event of interest, Bayes' formula is used to update\nthe probability of the event, in this case that the company we have already selected will\nexperience a decline in earnings next year. Bayes' formula says to divide the Probability of\nNew Information given Event by the Unconditional Probability of New Information and\nmultiply that result by the Prior Probability of the Event. In this case, P(company having a\ndecline in earnings next year) = 0.20 is divided by 0.26 (which is the Unconditional\nProbability that a company having an earnings decline will have a negative ratio (90% have\nnegative ratios of the 20% which have earnings declines) plus (10% have negative ratios of\nthe 80% which do not have earnings declines) or ((0.90) × (0.20)) + ((0.10) × (0.80)) = 0.26.)\nThis result is then multiplied by the Prior Probability of the ratio being negative, 0.90. The\nresult is (0.20 / 0.26) × (0.90) = 0.69 or 69%.\n(Module 4.1, LOS 4.c)"}, {"n": 6, "q": "John purchased 60% of the stocks in a portfolio, while Andrew purchased the other 40%. Half\nof John's stock-picks are considered good, while a fourth of Andrew's are considered to be\ngood. If a randomly chosen stock is a good one, what is the probability John selected it?", "opts": ["0.40.", "0.75.", "0.30."], "ans": "B", "expl": "Using the information of the stock being good, the probability is updated to a conditional\nprobability:\nP(John | good) = P(good and John) / P(good).\nP(good and John) = P(good | John) × P(John) = 0.5 × 0.6 = 0.3.\nP(good and Andrew) = 0.25 × 0.40 = 0.10.\nP(good) = P(good and John) + P (good and Andrew) =  0.40.\nP(John | good) = P(good and John) / P(good) = 0.3 / 0.4 = 0.75.\n(Module 4.1, LOS 4.c)"}, {"n": 7, "q": "Tully Advisers, Inc., has determined four possible economic scenarios and has projected the\nportfolio returns for two portfolios for their client under each scenario. Tully's economist has\nestimated the probability of each scenario as shown in the table below. Given this\ninformation, what is the expected return on Portfolio A?\nScenarioProbabilityReturn on Portfolio AReturn on Portfolio B\nA15%17%19%\nB20%14%18%\nC25%12%10%\nD40%8%9%", "opts": ["12.55%.", "11.55%.", "12.75%."], "ans": "B", "expl": "The expected return on Portfolio A is a probability-weighted average of 17%, 14%, 12%,\nand 8%.\nExpected return = (0.15)(0.17) + (0.20)(0.14) + (0.25)(0.12) + (0.40)(0.08) = 0.1155 or 11.55%.\nScenarioProbabilityReturn on Portfolio APortfolio × Weight\nA15%17%15 × 17%\nB20%14%20% × 14%\nC25%12%25% × 12%\nD40%8%40% × 8%\nProbability Weighted Average Return\n11.55%\n∑ Probability × Weight\n(Module 4.1, LOS 4.a)", "qhtml": "<p>Tully Advisers, Inc., has determined four possible economic scenarios and has projected the portfolio returns for two portfolios for their client under each scenario. Tully's economist has estimated the probability of each scenario as shown in the table below. Given this information, what is the expected return on Portfolio A?</p><table class=\"qtable\"><thead><tr><th>Scenario</th><th>Probability</th><th>Return on Portfolio A</th><th>Return on Portfolio B</th></tr></thead><tbody><tr><td>A</td><td>15%</td><td>17%</td><td>19%</td></tr><tr><td>B</td><td>20%</td><td>14%</td><td>18%</td></tr><tr><td>C</td><td>25%</td><td>12%</td><td>10%</td></tr><tr><td>D</td><td>40%</td><td>8%</td><td>9%</td></tr></tbody></table>"}, {"n": 8, "q": "C\nThe probability of A is 0.4. The probability of A is 0.6. The probability of (B | A) is 0.5, and\nC\nthe probability of (B | A) is 0.2. Using Bayes' formula, what is the probability of (A | B)?", "opts": ["0.125.", "0.375.", "0.625."], "ans": "C", "expl": "Using the total probability rule, we can compute the\nCC\nP(B): P(B) = [P(B | A) × P(A)] + [P(B | A) × P(A)]\nP(B) = [0.5 × 0.4] + [0.2 × 0.6] = 0.32\nUsing Bayes' formula, we can solve for\nP(A | B): P(A | B) = [ P(B | A) ÷ P(B) ] × P(A) = [0.5 ÷ 0.32] × 0.4 = 0.625\n(Module 4.1, LOS 4.c)", "qhtml": "<p>The probability of A is 0.4. The probability of A<sup>C</sup> is 0.6. The probability of (B | A) is 0.5, and the probability of (B | A<sup>C</sup>) is 0.2. Using Bayes' formula, what is the probability of (A | B)?</p>"}, {"n": 9, "q": "A conditional expectation involves:", "opts": ["refining a forecast because of the occurrence of some other event.", "calculating the conditional variance.", "determining the expected joint probability."], "ans": "A", "expl": "Conditional expected values are contingent upon the occurrence of some other event. The\nexpectation changes as new information is revealed.\n(Module 4.1, LOS 4.b)"}, {"n": 10, "q": "An analyst announces that an increase in the discount rate next quarter will double her\nearnings forecast for a firm. This is an example of a:", "opts": ["use of Bayes' formula.", "conditional expectation.", "joint probability."], "ans": "B", "expl": "This is a conditional expectation. The analyst indicates how an expected value will change\ngiven another event.\n(Module 4.1, LOS 4.b)"}, {"n": 11, "q": "Use the following data to calculate the standard deviation of the return:\n50% chance of a 12% return\n30% chance of a 10% return\n20% chance of a 15% return", "opts": ["1.7%.", "2.5%.", "3.0%."], "ans": "A", "expl": "The standard deviation is the positive square root of the variance. The variance is the\nexpected value of the squared deviations around the expected value, weighted by the\nprobability of each observation. The expected value is: (0.5) × (0.12) + (0.3) × (0.1) + (0.2) ×\n22\n(0.15) = 0.12. The variance is: (0.5) × (0.12 – 0.12) + (0.3) × (0.1 – 0.12) + (0.2) × (0.15 –\n2\n0.12) = 0.0003. The standard deviation is the square root of 0.0003 = 0.017 or 1.7%.\n(Module 4.1, LOS 4.a)"}, {"n": 12, "q": "There is a 40% probability that an investment will earn 10%, a 40% probability that the\ninvestment will earn 12.5%, and a 20% probability that the investment will earn 30%. What\nare the mean expected return and the standard deviation of expected returns, respectively?", "opts": ["15.0%; 5.75%.", "15.0%; 7.58%.", "17.5%; 5.75%."], "ans": "B", "expl": "Mean = (0.4)(10) + (0.4)(12.5) + (0.2)(30) = 15%\n222\nVar = (0.4)(10 – 15) + (0.4)(12.5 – 15) + (0.2)(30 – 15) = 57.5\nStandard deviation = √57.5 = 7.58\n(Module 4.1, LOS 4.a)"}, {"n": 13, "q": "There is a 60% chance that the economy will be good next year and a 40% chance that it will\nbe bad. If the economy is good, there is a 70% chance that XYZ Incorporated will have EPS of\n$5.00 and a 30% chance that their earnings will be $3.50. If the economy is bad, there is an\n80% chance that XYZ Incorporated will have EPS of $1.50 and a 20% chance that their\nearnings will be $1.00. What is the firm's expected EPS?", "opts": ["$2.75.", "$3.29.", "$5.95."], "ans": "B", "expl": "Joint\nState of the EconomyConditionalJoint\nEPSProbability ×\n(Unconditional Probability)ProbabilityProbability\nEPS\n60% × 70% =42% × $5.00 =\n70%$5.00\n42%$2.10\nGOOD 60%\n60% × 30% =18% × $3.50 =\n30%$3.50\n18%$0.63\n40% × 80% =32% × $1.50 =\n80%$1.50\n32%$0.48\nBAD 40%\n40% × 20% =8% × $1.00 =\n20%$1.00\n8%$0.08\nExpected EPS = ∑ Joint Probability × EPS$3.29\n(Module 4.1, LOS 4.a)"}, {"n": 14, "q": "A parking lot has 100 red and blue cars in it.\n40% of the cars are red.\n70% of the red cars have radios.\n80% of the blue cars have radios.\nWhat is the probability that the car is red given that it has a radio?", "opts": ["47%.", "28%.", "37%."], "ans": "C", "expl": "Given a set of prior probabilities for an event of interest, Bayes' formula is used to update\nthe probability of the event, in this case that the car we already know has a radio is red.\nBayes' formula says to divide the Probability of New Information given Event by the\nUnconditional Probability of New Information and multiply that result by the Prior\nProbability of the Event. In this case, P(red car has a radio) = 0.70 is divided by 0.76 (which\nis the Unconditional Probability of a car having a radio (40% are red of which 70% have\nradios) plus (60% are blue of which 80% have radios) or ((0.40) × (0.70)) + ((0.60) × (0.80)) =\n0.76.) This result is then multiplied by the Prior Probability of a car being red, 0.40. The\nresult is (0.70 / 0.76) × (0.40) = 0.37 or 37%.\n(Module 4.1, LOS 4.c)"}, {"n": 15, "q": "Tina O'Fahey, CFA, believes a stock's price in the next quarter depends on two factors: the\ndirection of the overall market and whether the company's next earnings report is good or\npoor. The possible outcomes and some probabilities are illustrated in the tree diagram\nshown below:\nA decision tree\ndiagram showing potential stock prices based on market movements and earnings\nperformance, with probabilities assigned to each scenario, leading to four possible\noutcomes ranging from $55 to $70.\nBased on this tree diagram, the expected value of the stock if the market decreases is\nclosest to:", "opts": ["$26.00.", "$57.00.", "$62.50."], "ans": "B", "expl": "The expected value if the overall market decreases is 0.4($60) + (1 – 0.4)($55) = $57.\n(Module 4.1, LOS 4.b)"}];
const CFG = {"title": "Probability Trees and Conditional Expectations", "subtitle": "CFA · Quantitative Methods · Reading 4 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
