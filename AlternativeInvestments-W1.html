<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

const DATA = [{"n": 1, "q": "When co-investing, investors most likely:", "opts": ["rely heavily on the fund manager's due diligence.", "source the investment idea and have others invest alongside.", "raise additional capital to fund the investment once the investing decision has been made."], "ans": "A", "expl": "Co-investing in alternative investments\nAdvantages Disadvantages\nOffers direct investing experience Requires more resources and expertise\nLeverages the investment firm's process than fund investing\nand expertise Direct investing opportunities are\nReduced management fees dependent on the investment firm\nMore active approach Potential adverse selection bias\nCoinvesting occurs when an investor in an alternative fund (eg, hedge fund, venture capital) accepts the opportunity to invest directly (ie, direct\nprivate investment outside the fund structure) by committing additional capital in specific investments alongside the fund manager who\nintroduced the idea (ie, acted as an intermediary).\nCoinvesting requires two processes that demand more resources and expertise from the investor: fund-specific due diligence and asset-specific\ndue diligence. Considerable asset-specific due diligence is performed by the investment firm (ie, general partner and fund manager) when it\nacts as an intermediary and presents the opportunity to the investor.\nCoinvesting is often a transitional step for investors to learn the details and fine points of direct investing. In addition, decisions to coinvest are\noften made under tight deadlines, putting considerable pressure on the investor to thoroughly complete the required level of due diligence. For\nthese reasons, many investors rely heavily on the fund manager's due diligence expertise when evaluating a coinvestment opportunity.\n(Choice B) The investment firm, not the investor, sources the investment idea and has others invest alongside.\n(Choice C) Since the deadlines for decision-making and funding are usually tight, raising additional funding capital is not normally an option once\nthe decision to coinvest has been made.\nThings to remember:\nCoinvesting is often a transitional step for investors to learn the details and fine points of direct investing. In addition, decisions to coinvest are\noften made under tight deadlines, putting considerable pressure on the investor to thoroughly complete the required level of due diligence. For\nthese reasons, investors often rely heavily on the fund manager's due diligence expertise when evaluating a coinvestment opportunity.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null, "explfigs": null}, {"n": 2, "q": "Compared with traditional investments, alternative investments are least likely to have:", "opts": ["large short positions.", "detailed public reporting.", "active asset management."], "ans": "B", "expl": "Common characteristics of alternative\ninvestments compared with traditional\ninvestments\nLess liquid\nLess regulation\nLess transparency\nMore active management\nHigher fee structure\nHigher minimum investments\nLess flexibility\nAlternative investments refer to vehicles established to invest both in traditional asset classes such as stocks and bonds as well as in\nnontraditional asset classes such as commodities and real estate. The term also refers to nontraditional investments, such as private equity\nfunds and hedge funds.\nAlternative investments generally cater to institutions and wealthy individuals. In theory, these are sophisticated investors who can perform their\nown due diligence and oversight, which minimizes their need for regulatory protection. As a result, alternative investments are subject to fewer\nreporting requirements than are traditional investments. The level of reporting in alternative investments is far more likely to be cursory than\ndetailed.\n(Choice A) Many alternative investment strategies employ large amounts of leverage (ie, borrowing) to enhance investment returns. Shorting a\nsecurity is a form of leverage. Entering a short position means that the fund borrows an underlying security and sells it in anticipation that its price\nwill fall and the company can buy the security back at a lower price in the future.\n(Choice C) Most types of alternative investments are characterized by active management. While traditional investments can also be actively\nmanaged, they typically use passive management more than alternative investments do.\nThings to remember:\nMost alternative investments are actively managed. They are subject to less regulation than traditional investments, so they typically have fewer\nreporting requirements. Alternative investment managers often employ strategies that include substantial amounts of leverage.\nDescribe features and categories of alternative investments", "qhtml": null, "explfigs": null}, {"n": 3, "q": "Which of the following choices most likely describes a benefit of adding alternative investments to a portfolio of traditional investments?", "opts": ["Increased liquidity", "More transparency", "Lower correlations with other assets"], "ans": "C", "expl": "Alternative investments refer to investments in nontraditional assets such as commodities, real estate, private equity, and hedge funds. The\nterm also refers to vehicles, such as limited partnerships, created to invest in traditional asset classes (eg, stocks, bonds).\nAlternative investments are attractive since they give investors access to a broader range of assets classes and have the potential to provide\ndiversification benefits when added to a traditional asset portfolio. Typically, alternative assets have lower correlations with traditional assets.\n(Choice A) The markets for these assets are typically less liquid (ie, assets cannot be sold as quickly for cash) than markets for traditional\nassets. As a result, adding alternative assets to a traditional asset portfolio most likely decreases the portfolio's liquidity.\n(Choice B) Alternative investments are subject to less regulation than traditional investments, which results in fewer reporting requirements and\ntherefore less transparency. Alternative investments also have higher fee structures (eg, hedge funds have both management and incentive fees).\nThings to remember:\nPotential benefits of adding alternative investments to a traditional investment portfolio include diversification benefits from typically lower\ncorrelations. Investors should be aware that alternative investments are generally less liquid and transparent and carry higher fees compared to\ntraditional investments.\nDescribe features and categories of alternative investments", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAowAAADrCAIAAABsP1BKAAA1rElEQVR42u2dTWwjyZXnn0qqKjfKDaXa8KF8GKW6scCcLBJYYE5dSmKN9qmbJGbQp2mTxKznZA9JLOY09pKc8ZyMAcn1nGZ2QbI9p8ECIu2TDS+U7Dk1YEApHxoG5qCUj/5opQ4Fu6pVpT38XQ/RkR+kJEqiqv6/Q4GVyoyMePHi4714EblydnYmhBBCCFk+7lAEhBBCCAdpQgghhHCQJoQQQjhIE0IIIYSDNCGEEMJBmhBCCCEcpAkhhBDCQZoQQgjhIE0IIYQQDtKEEEIIB2lCCCGEcJAmhBBCCAdpQgghhIM0IYQQQjhIE0IIIRykCSGEEMJBmhBCCOEgTQghhBAO0oQQQgjhIE0IIYRwkCaEEEIIB2lCCCGEgzQhhBBCOEgTQgghhIM0IYQQwkGaEEIIIRykCSGEEA7ShBBCCOEgTQghhLy6rF3gmSiKRCQIguzbPM97deQYhqH+KyK5XE5EHMe5QFIQLIQ8vxh938cPx3Hw9ttOFEXj8diUKkThuu5C5HxTBEGAcqEsZrkWIjSzYbquu5BkbzVm01CdufHu4lbrMLlOVs7Ozi6m9IVCYeadjUZDRLrd7qKyOx6PJ5OJiAwGgxscPJrNpohUKhUdQdvttoh0Oh38d29v78LTFAhWe5Y5K2hlZUVHMrz9Vg/PkIM1EcR4U6lUsuUcBAEqaNnkMBwORaRWq1nXoczVanUhA5LZMFutFjRz+YVzeVBSx3HQ7SQ2jSUpeLvdXkhfcSvacry3fDmUDfMqS9mE7m5CCCFE6O5eCL1eDz8ub0yrfXmD0zF4KWu1Gky9SqVCBbo6i1PNaPgDi8Uipq66EJBmS6mNsmzApBDDz7S+vn5tDtglF45cbqWpUCjgR6vVYgtaBl6+3lI1Db+vTdNoSRNCCCEvryUdX/ey5lC9Xg+TjssER+gardxoyE+aJQcJWHIgcok1aQVuGNODkibn6XR6K8qFsiwwVmMellw4i4rZjHOBsBu5eq/GS99XZPSWL6um3SZ3d6lUQqeg7m5UmOWpHg6HiAKLogjjd7FYtMJnIBH4P80r7XYbYUR6P673+311kxaLRb3BnB9gvNdRv1qt4tnRaIR04H6s1+saGYsMWN3caDRCIpqCmaYY8bpRFCEFlFfZ2dlB3MFiYzuRmU6ngx+u69brdUl3q5oVgfvhm4qvLGjPgqKVSiUtV1 tegies,\nunderlying investments, or even prior performance.\n(Choice B) One feature of alternative investments is potentially greater returns. However, risk and return are related concepts, and an investor\ncannot expect higher returns without assuming a higher degree of risk.\n(Choice C) Managers of alternative investments often employ strategies that require much more active management than strategies commonly\nassociated with traditional investments.\nThings to remember:\nAlternative investments offer the potential for greater returns than traditional investments, but the higher returns require investors to assume more\nrisk. Alternative investments are also less regulated than traditional investments, so investors must accept a level of transparency and disclosure\nthat is often significantly less than the requirements for traditional investments.\nDescribe features and categories of alternative investments", "qhtml": null, "explfigs": null}, {"n": 5, "q": "For a small firm, co-investing in alternative assets is most likely:", "opts": ["attractive as it avoids adverse-selection bias.", "attractive due to the elimination of the intermediary.", "challenging due to the resources and expertise needed."], "ans": "C", "expl": "The three most common methods of investing in alternative investments, ordered by increasing level of involvement or expertise required, are:\nFund investing: The investor invests in a fund (eg, hedge, private equity) that makes all investment decisions. Fund investing is an indirect\nmethod of investing.\nCo-investing: An investor in an alternative fund (eg, venture, private equity) has the opportunity to invest directly (ie, private investment\noutside of the fund structure) by committing additional capital in specific investments along with the fund manager who introduced the idea\n(ie, acts as an intermediary).\nDirect investing: An investor makes a direct investment in an asset (eg, taking a position in a private company directly, without the use of\nan intermediary).\nInvesting in any alternative investment requires due diligence. For a small firm, resources (eg, assets, firm capital) and expertise are most likely\nlimited, which makes fund investing attractive as it requires the lowest level of involvement. Co-investing is challenging for a small firm: it\nrequires two separate due diligence processes (ie, fund and asset-specific processes), demanding more resources and expertise.\n(Choices A and B) Co-investing does not eliminate the intermediary, as it is the fund's investment firm that is presenting the co-investment\nidea/opportunity to the investor. This dynamic introduces adverse-selection bias since the fund firm is incentivized to keep the best deals for\nthemselves.\nThings to remember:\nThere are three common methods of investing in alternative investments: fund investing, co-investing, and direct investing. Fund investing\nrequires the lowest level of investor involvement. Co-investing requires two separate due diligence processes and often challenges a small firm's\nlimited resources and expertise.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA3YAAAKdCAIAAADgO2wvAACsa0lEQVR42u39a3RU15m2C986S0hIBY4BcyzadgxOYxXdBveOna2S8e6Mjv0GCX7st3EbScnIThvHIDn9deN4DCR5jMSkRxpJdux0voy2JNzQ748XJKXtZMcdgtS288XgNCUTxzjGTQHG8RFKHAw61vfjlh4vVh1UOpfEff3QKK1aNddcc64117PuZz7PTAmHwxBCCCGEEGL8SFUTCCGEEEIImZhCCCGEEEImphBCCCGEkIkphBBCCCGETEwhhBBCCCETUwghhBBCyMQUQgghhBBCJqYQQgghhJCJKYQQQgghZGIKIYQQQgghE1MIIYQQQsjEFEIIIYQQMjGFEEIIIYRMTCGEEEIIIWRiCiGEEEIImZhCCCGEEEImphBCCCGEEDIxhRBCCCGETEwhhBBCCCETUwghhBBCCJmYQgghhBBCJqYQQgghhJCJKYQQQgghhExMIYQQQgghE1MIIYQQQsjEFEIIIYQQMjGFEEIIIYSQiSmEEEIIIWRiCiGEEEKImU+6mkCIRAgGg/YXgN/vV5sIIYQQkIo5haREUFxcnPiesXZOnPb29vb29tbW1tbW1qiHG5ejjIWamhqrDGubVD1YUVGxfPny5cuXFw8xZ86c+K1tp1NTUzOzL+/ISyvJW6CmpsZ1vSVP3YqLi61iCbb2DCAUCoVCIfaLqzWGbZApHM+nfNichFub19sMu9girz  fund) can invest directly (ie, privately and outside the fund structure) by\ncommitting additional capital to specific investments along with the fund manager who introduced the idea (ie, as an intermediary).\nDirect investing: An investor makes a direct investment in an asset (eg, takes a position in a private company directly, without using an\nintermediary).\nCertain fund managers enjoy reputational benefits that make them desirable partners in private deals. The involvement of such managers,\nlike well-known hedge funds, creates an aura of legitimacy that boosts the chances of a successful offering for the issuer. Therefore, issuers seek\nout these managers, giving them better access to the best deals than other direct investors. Adverse selection bias is possible, however, since\nthe managers may choose to keep those deals for themselves (Choice C).\n(Choice A) Alternative investment managers offer private deals to their fund investors, not the other way around.\nThings to remember:\nCertain fund managers enjoy reputational benefits that make them desirable partners in private deals. The involvement of such managers creates\nan aura of legitimacy, boosting the chances of a successful offering. Therefore, issuers seek out these managers, which gives the managers\nbetter access to the best deals but could lead to adverse selection bias if they choose to keep those deals for themselves.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null, "explfigs": null}, {"n": 8, "q": "An investor is conducting due diligence on a hedge fund. Which of the following is most likely to be readily available? Information on the fund's:", "opts": ["historical returns.", "largest investments.", "investment process."], "ans": "A", "expl": "Alternative investment due diligence checklist\nTeam experience, key person risk, and reputation\nOrganization Reputation of third-party service providers (eg, auditors,\nprime broker)\nPortfolio Recent and long-term track record\nmanagement Strategy, investment process, and idea generation\nInternal controls, audited financial statements, reporting\nOperations frequency\nValuation methodology and controls\nChief risk officer's independence from portfolio decision-\nRisk policies making\nFund/position limits, leverage, hedging policies\nFund structure and legal registrations\nLegal risks\nExisting or prior litigation against fund or principals\nTerms of Fees, lockouts, redemption notice period\ninvestment Carried interest, distribution policy\nGiven the aggressive and risky strategies of hedge funds, conducting due diligence on them is extremely important. Due diligence should be done\nwith all available information, including analysis of a fund's size, its past performance, and many other factors that could be pertinent to an\ninvestor.\nA fund's track record is commonly used in the due diligence process since it is often made available by the hedge fund or by third parties.\nHistorical returns can be used as an indicator of a fund's future performance and risk tolerance.\nAlthough reasonable steps should be taken to gather all pertinent information, one major limitation to hedge fund due diligence is that fund\nmanagers tend to limit disclosure of certain data. This likely includes the fund's investment strategy, process, and positions since these are\noften proprietary and believed to be competitive advantages (Choices B and C). An investor may only be able to obtain a broad description of\nthe investment strategy (eg, that it is market-neutral).\nThings to remember:\nDue diligence is an important part of investing in hedge funds given their aggressive and risky nature. A fund's track record is a commonly used\nfactor in the due diligence process since it is one of the more readily available pieces of information and can be used as an indicator of a fund's\nfuture performance and risk tolerance.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null, "explfigs": null}, {"n": 9, "q": "For the general partner in a private equity or venture capital fund, which of the following waterfall distribution methods is most advantageous compared to the others?", "opts": ["Clawback.", "Deal-by-deal.", "Whole-of-fund."], "ans": "B", "expl": "Alternative investments (eg, private equity, venture capital, real estate) often have a waterfall distribution framework for paying out\nreturns/profits. Generally, limited partners (ie, LP investors) receive distributions equal to their initial capital outlay plus profits up to the hurdle\nrate; the general partner (GP) is then paid a performance fee. At this point, unless the limited partnership agreement contains a catch-up clause,\ndistributions and profits are split proportionately between the GP and LPs.\nWaterfall distribution methods are classified as either:\ndeal-by-deal (American style) or\nwhole-of-fund (European style).\nThe timing of performance fee payments makes deal-by-deal waterfalls more advantageous to the GP since each deal is evaluated as each\ninvestment is exited. This allows the GP an opportunity to receive performance fee cash flows earlier (eg, annually) than under the whole-of-fund\nmethod.\n(Choice A) In deal-by-deal waterfalls, a clawback provision would likely be included in the partnership agreement to protect the LPs by restoring\nthe profit split if subsequent investments in the portfolio do not earn performance fees. This provision \"claws back\" the performance fee already\npaid to the GP and is not to the GP's advantage.\n(Choice C) A whole-of-fund waterfall pays the GP based on the performance of the entire fund. This delays payment of performance fees until\nthe end of the fund's life (eg, 7–8 years), which is not to the GP's advantage.\nThings to remember:\nIn alternative investments, deal-by-deal waterfall distributions are more advantageous to the general partner (GP) due to the timing of performance\nfee cash flows. The performance of each deal is evaluated as each investment is exited, potentially earning the GP a performance fee. Under the\nwhole-of-fund method, the GP is paid performance fees only at the end of the fund's life.\nDescribe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCoAAAIjCAIAAABK6G1vAACGRklEQVR42u39b4wk933f+37Hpk2uKXNqCZj0CtZuzZqyHNPk9JwrIwZEYrohxAFEJdMt50FEApnuA+T6kMDFdOfk5kpP7nTniXTu9XVPPyFP7gFOdweQdB7Emh5HFOAcCNMDUYYDy2d6SCsnkjY7tVTgNRmAWyOHJhlT3vPgk/2mtqq7p2emZ3Zm9v16sOitqa761a+qu39/vr/fb+b27dsGAAAAAMfvp8gCAAAAAFQ/AAAAAFD9AAAAAACqHwAAAACofgAAAACg+gEAAAAAVD8AAAAAUP0AAAAAAKofAAAAAKh+AAAAAKD6AQAAAABUPwAAAABQ/QAAAAAAqh8AAAAAqH4AAAAAoPoBAAAAAFQ/AAAAAFD9AAAAAACqHwAAAACofgAAAACg+gEAAAAAVD8AAAAAUP0AAAAAAKofAAAAAKh+AAAAAKD6AQAAAABUPwAAAABQ/QAAAAAAqh8AAAAAqH4AAAAAoPoBAAAAAFQ/AAAAAJwTD5AFAPr9vl4EQZDL5cbsoH3MLLtb8iBDdzid4jg2s16vF0WRtuTzef/3QAaDgR8weYQoivzgyhll0ZnT6/X8MnUhukbfcgK3ftSzmsxkbb9XmZz6sHgiRz0e9+SZ91sWhqH/CwAnY+b27dvkAnCfW1hY8OJI6jtB2xcWFlJvSe3W7/cLhYJeV6tVM2s2m4dLzGAwqNVqZra5uXkCFQ8l2y/fi2K7u7sHPaAO5aVPz6J6vd5oNHy3zc3Ne1j0PJxKpWJmnU4ntV25NDc3lyxSJ2+cMrlWqy0vL0+lzD0zM+PnSp4omcnafpRzHSXZnsJUIkc9HseqXq+rFqRPZfbTurq66rsBgBF8BQAAAMAIvgJwnuTzeW/+1wuPGElGktjdfRTJ0Jdk78Hi4qIdoaU22VFwrNSWnwwlMrOlpaUzGhl1fAaDQbLfIwiClZUVM9vb2xsftNPr9dRtEsexuhHsjMSYncVkJykOrVAo6IW6OADA6P0AAAAAYPR+ALivzM/P290DZ71nY2dnxybo/dja2rLE0OrDJSN5EDupQedOg1XO3KiMk8+olZWV1FCBUcMYBoNB6r12nIMcpjWA4YjJPg0jKtXpkZzwwO7u7WTYJwCqHwDs3gZf+etUfcODr1Sp8FClra2tcrmcDb4Kw9ADclT6abVaydCsIAgUnZUcC6uCY6q05KVJfxHHsaKANjY2kqlaWVkZGgXkbwzDUHt6ZNf8/HyqttPtdnW9uq4wDD39qcmdsuk/phHDPg6+WCyura0p27VF4U/Jmp7ulN+vcrmsvNJlLi4upkrnnU5H2aiidhAES0tLemPqmMqZZC1Rh8rn83pyUqlNnXpU9toEs2x1u10lb3FxcXyG9/v95LUnT5F9DhVft7i4qD093G7fZOtQQzNZT0WqFhSGYTI/s5W6tbU1nS4IAgV6FYvF8Q9D8oA6u39wtGe/3x9zy3Qcj6YbNc+bf9DGPB7J7E0eUOn0DNd/l5eXqdsDMIKvAAAAAJyo2wBw+7b3WuiFNt66dcu/K6rVarVa9RblXC7n+ GP to the entire 2% profit above the 8% hurdle rate (ie, 20% of the 10% return).\nAfter this point, all profits are split (ie, 80/20 profit split) per the LPA since the GP is \"caught up.\"\n(Choices A and B) In this same scenario without a catch-up clause, the GP would have received a 20% performance fee on the 2% return above\nthe hurdle rate, which is 0.40% (ie, 20% of 2%) of the fund's total profits. This would be the minimum performance fee in this situation.\nThings to remember:\nIn alternative investments, once a fund's hurdle rate is reached, a catch-up clause allows the general partner to receive all subsequent\ndistributions until the agreed-upon profit split occurs per the limited partnership agreement. After this point, additional profits are split\nproportionately.\nDescribe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA5QAAAPgCAIAAADC56TIAACdeElEQVR42uz9e3CU95nn/X9kG+zYltR2NnaCjCR2JxnMsakKzBiHlWQ2VcYPGVrerbVdJEiqHTOsVURSDX44zBhJ9gyHDSlJdon14N2ohc3PsPWM1XhYcFWC1RrZ8j6Qp2jAGGZmd9WSDJODE1oiJwfb+v1xWd+9ufugAwKE9H79QYmbu+/Dt1vi0nVf3+ubNTg4KAAAAOBmcAtDAAAAAIJXAAAAgOAVAAAABK8AAAAAwSsAAABA8AoAAACCVwAAAIDgFQAAACB4BQAAAMErAAAAQPAKAAAAELwCAACA4BUAAAAgeAUAAAAIXgEAAEDwCgAAABC8AgAAAASvAAAAIHgFAAAACF4BAAAAglcAAAAQvAIAAAAErwAAAADBKwAAAAheAQAAAIJXAAAAgOAVAAAABK8AAAAAwSsAAACmutsYAlwL8Xjc/SkpGAwGAgGGBcDUFI1G3deFhYWFhYWMCUDwigkhEolIqqmpcWGrU1xcLKm2ttZ9PS7C4XAwGLT4eMwHycrK8l5ke3v7lH0HGYqrj1FKSkrsa/u019XVuX9NJBKSGhsbfdvtJS6+GRwcHK9vxvr6ekmxWMyFTWVlZb6zezU2NjY1NdlvnvYLZ3l5ud1Iut8/77nnHruv7u5uO4Vtr6urO3jwoPfsoVCoqqoq5U8A+4lRU1Njl+1+6W1oaBjfnxjXmd17SUmJDZFj91VTU+O+3VJ+r43Lz7dr+lPCXfawn2H7JxuHUCjEzwqIsgEAAACIzCswQhUVFZYnUManZvZnS0tLeXm5ri6ZYUmLaDRKdhC6SZ5L2IfWsozpcp/jda7S0lKlquexXGx/f78l/xy7HvtXXZkntu+45G80u5FEImHZVpdzTffTIBKJWGK1ra1NnvRbIpFYtGiRO6P3O93yee3t7Tdp8tXeBXdflkANBAIZMqmT7Oeb3XtNTY19HiyLT+YVBK+48RobG73/UXkf9rn//7z/KdbU1NgPr7EVwtr/f94aMmCCCAaDLtrw1T ) after investing all\nfunds\ncommitted capital\nAlways based on % of profits (realized or\nBased on % of profits realized on sale of fund holdings\nnot)\nIncentive Profits are not distributed (and incentive fee is not earned) until holdings\nFund has discretion on distributing\nare sold\nrealized profits\nHedge funds and private equity funds both initially obtain capital commitments from investors, which obligate investors to invest in the fund. These\ncapital commitments are often for \"soft commitments,\" occurring over a period of time (eg, 1 year) and at the investor's discretion, but they are\nnot legally binding. Conversely, private equity investors are legally obligated to deliver cash up to their capital commitment when demanded\nby the fund. This difference is largely due to the underlying structure and investments of the funds.\nFor hedge funds, management fees are always based on assets under management due to the lack of \"hard\" capital commitments. For private\nequity funds, the management fee is based on committed capital until all funds have been drawn down or the commitment period has ended\n(Choice A). At that point, the basis for the management fee converts to assets under management.\n(Choice B) Seed funding from the managing principals is included in assets under management for hedge fund management fee calculation\npurposes. Also, seed funding does not impact committed capital.\nThings to remember:\nFor hedge funds, management fees are always based on assets under management. For private equity funds, the management fee is based on\ncommitted capital until all the funds have been drawn down or the commitment period has ended. After that, the management fee is based on\nassets under management.\nDescribe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null, "explfigs": null}, {"n": 14, "q": "Investors that choose fund investing instead of other alternative investing methods can most likely expect:", "opts": ["higher costs and lower level of investor involvement.", "greater amounts of due diligence and a higher degree of control.", "reduced diversification benefits and higher minimum capital requirements."], "ans": "A", "expl": "Investors can choose from three different methods to invest in alternatives:\nDirect investing: investors take a direct position in an asset without use of external managers.\nCo-investing: investors collaborate with the fund manager and also invest at the fund level.\nFund investing: investors choose a fund, leaving the fund manager to choose the investments and perform due diligence.\nFund investing is typically the costliest of the three methods since investors pay both management and performance fees. Factors driving the\nhigh costs include greater complexity of alternative investments and due diligence requirements. In return for higher fees, fund investors delegate\nmanagement of investments to the fund manager, so fund investing usually requires the lowest amount of involvement from investors.\n(Choice B) An advantage of fund investing is that investors can delegate the most complex and time-consuming aspects of management, such\nas due diligence, to the fund managers. However, by delegating, investors also sacrifice level of control since the managers are usually making all\nfund-related decisions without investor input.\n(Choice C) Fund investing gives investors a high degree of diversification due to the number of investments typically available under a fund\nmanager. Funds also tend to have lower minimum capital requirements than co-investment or direct investment opportunities.\nThings to remember:\nInvestors may choose to invest in alternatives through fund investing, co-investing, or direct investing. Fund investing offers greater diversification\nopportunities, less investor involvement, and ability to delegate to fund managers. The main disadvantage is higher cost.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA3YAAAKdCAIAAADgO2wvAACsa0lEQVR42u39a3RU15m2C986S0hIBY4BcyzadgxOYxXdBveOna2S8e6Mjv0GCX7st3EbScnIThvHIDn9deN4DCR5jMSkRxpJdux0voy2JNzQ748XJKXtZMcdgtS288XgNCUTxzjGTQHG8RFKHAw61vfjlh4vVh1UOpfEff3QKK1aNddcc64117PuZz7PTAmHwxBCCCGEEGL8SFUTCCGEEEIImZhCCCGEEEImphBCCCGEkIkphBBCCCGETEwhhBBCCCETUwghhBBCyMQUQgghhBBCJqYQQgghhJCJKYQQQgghZGIKIYQQQgghE1MIIYQQQsjEFEIIIYQQMjGFEEIIIYRMTCGEEEIIIWRiCiGEEEIImZhCCCGEEEImphBCCCGEEDIxhRBCCCGETEwhhBBCCCETUwghhBBCCJmYQgghhBBCJqYQQgghhJCJKYQQQgghhExMIYQQQgghE1MIIYQQQsjEFEIIIYQQMjGFEEIIIYSQiSmEEEIIIWRiCiGEEEKImU+6mkCIRAgGg/YXgN/vV5sIIYQQkIo5haREUFxcnPiesXZOnPb29vb29tbW1tbW1qiHG5ejjIWamhqrDGubVD1YUVGxfPny5cuXFw8xZ86c+K1tp1NTUzOzL+/ISyvJW6CmpsZ1vSVP3YqLi61iCbb2DCAUCoVCIfaLqzWGbZApHM+nfNichFub19sMu9girzQhE1MIIYQQQkCOchHv7XDYLePyugagqqqqqakJQHV1NYCSkhK1f+Kw6fgXgMfj8fl8ALxe7zXeMqFQqKqqio2jS0utPWpaW1t5apyFInkpGS4214NjZlxslGOrqqp0pcnEvFasTJvSNxEmZiAQcJpHAqOdgmk0NjYOO9rSBj148CD/nanGaCAQiHVpJXkLlJeXO2891nb6tvZ0p6GhwXWXGXV1dWbxJA92YXs8npl6a8/IB0dDQ0PkkC4gR7kQQgghhIBUTBEVv99vaiXfFE1K6ezsdIYqDytqtra2sgQMucxcYkwwGLQdyMmTJ1kyVaWo2hJdCfyhx+NhyXFUKOf+rMOwIp/9hBoAJaUEf+IUD/x+/6j1p0SqzW/ZaM5WZdf4fL7RaRjWs+ZzDwQCrA8LLCkpsQanfmP19Hq9rr4Ydgd+ZRP2h+0g53UVq50pAzivLru0WIc4LeO8sKO2QPxLLnJPHitOC2CE/sHIoqxNvF6v86AYiSzkipnw+/0JJiWI09quG5n1b21t5U/iNKYrPYLP52P57e3trJX1S5ym4LUaqymcFxIr4yzZeTG4REq7QmK1TzAYdNbc1R2Rp+baIfKOGK9ZByzZTsfv97Mara2t3OgaqEOhkLOFI3tq2B2CwSBPJBQKDdsjrhO3Fna1c9QHh93abMzIWlHy5Pl6vV4b1XniTU1N/BBn/Im8el2DYZx2djVF1Adie3v7sFeaq7+sEL/fP1MVa0jFFEIIIYQQ04ywmHhc0gXfmUpKSkpKSmwfj8fD96Tq6mpO53f+xHY7cuRILJ2Ge547d457OgtxwUM4K+bz+Xw+X6RswFodOXLEdUZHjhxhTSILZ/Uif3Lu3Llz587FOoTz1fbgwYMHDx6MfxQMTaorLy9PvCPitF5ktePrTKxhVFh/Z2vHuhhY/8jCW1paWlpawuHwiRMnTpw44Txf17EaGxsbGxvhmCoav7VjdVCclolsZ9clGnl1xWkB1xU7bAsYlZWVlZWVkVeOa7urtaPiqr91pavalZWVvC8iD8p+SeSSi3WCkbe2XXWuwTlOa9uNzMvAxhAXlZWV8VvA2YC8DBJpCraGqynOnTsXdc9hL4aozybXPWjXvPOCt2s+aoNb9eLcETxrjjajGM9jj const CFG = {"title": "Wiley · Alternative Investment Features Methods and Structures", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Alternative Investments · 15 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<!--qnote-feature-start-->
<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
</body>
