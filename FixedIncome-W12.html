ight line represents\nthe price change estimated from the bond's duration. For small changes in YTM, duration closely estimates the actual change in price, but the\nestimate is less accurate for larger changes.\nApproximate convexity, a measure of yield convexity, is used to calculate the convexity adjustment. When added to the estimate based on\nduration, the convexity adjustment provides a closer estimate to the actual price change since it accounts for the curvature of the price-yield for\nchanges in YTM. In the diagram below, the estimate based on duration and convexity is represented by the curve above the straight duration line.\nIn this scenario, substitute as follows to obtain the percentage price change:\nFor noncallable bonds, duration always results in an estimated price that is lower than the actual price for a given change in YTM. Adding the\nconvexity adjustment to the duration estimate brings the estimated price change much closer to the actual price change for a given change in YTM\nthan just using duration alone.\n(Choice A) −7.31% is the decrease in price that results from considering only the effect of duration, rather than the combined impact of duration\nplus convexity.\n(Choice C) The bond yield in this scenario increases, so the price would decrease, not increase. 8.59% represents a percentage increase in\nprice that results from failing to account for the negative sign before AnnModDur in the formula given above.\nThings to remember:\nDuration is a linear estimate of the change in a bond's price due to a change in yield. Approximate convexity is used to calculate the convexity\nadjustment, which is the additional amount the price changes due to the curvature in the relationship between price and YTM.\nCalculate the percentage price change of a bond for a specified change in yield, given the bond’s duration and convexity.\n29. If a noncallable bond has an annual modified duration of 9.718 and an annual convexity of 167.574, the estimated percentage price increase if\nits YTM declines by 50 basis points is closest to:\nA. 4.65%\nB. 4.86%\n\nC. 5.07%\nExplanation\nDuration and convexity can be used to estimate percentage changes in bond prices. Modified duration measures the change in a bond's price for\na given change in its YTM, and convexity measures the change in the bond's price sensitivity.\nDuration-based estimates of price change reflect the inverse relationship between bond prices and yields. To capture the direction of price\nsensitivity changes, the price impact of convexity should be:\nadded to the percentage price change due to duration when YTM declines and\nsubtracted from the percentage price change due to duration when YTM increases.\n(Choice A) 4.65% results from mistakenly subtracting the convexity impact of the price change estimated from the bond's modified duration rather\nthan adding it. Convexity reduces bond price declines when interest rates rise, but increases price appreciation when a bond's YTM decreases.\n(Choice B) 4.86% is the estimated price change due to the bond's modified duration, but it fails to account for the bond's convexity.\nThings to remember:\nDuration and convexity can be used to estimate the percentage change in a bond's price for a given change in its YTM. For noncallable bonds,\nprice change estimates based on duration are adjusted by adding the convexity effect when the YTM declines and subtracting the convexity effect\nwhen the YTM increases.\nCalculate the percentage price change of a bond for a specified change in yield, given the bond’s duration and convexity.", "qhtml": null}, {"n": 29, "q": "If a noncallable bond has an annual modified duration of 9.718 and an annual convexity of 167.574, the estimated percentage price increase if its YTM declines by 50 basis points is closest to:", "opts": ["4.65%", "4.86%", "5.07%"], "ans": "C", "expl": "Duration and convexity can be used to estimate percentage changes in bond prices. Modified duration measures the change in a bond's price for\na given change in its YTM, and convexity measures the change in the bond's price sensitivity.\nDuration-based estimates of price change reflect the inverse relationship between bond prices and yields. To capture the direction of price\nsensitivity changes, the price impact of convexity should be:\nadded to the percentage price change due to duration when YTM declines and\nsubtracted from the percentage price change due to duration when YTM increases.\n(Choice A) 4.65% results from mistakenly subtracting the convexity impact of the price change estimated from the bond's modified duration rather\nthan adding it. Convexity reduces bond price declines when interest rates rise, but increases price appreciation when a bond's YTM decreases.\n(Choice B) 4.86% is the estimated price change due to the bond's modified duration, but it fails to account for the bond's convexity.\nThings to remember:\nDuration and convexity can be used to estimate the percentage change in a bond's price for a given change in its YTM. For noncallable bonds,\nprice change estimates based on duration are adjusted by adding the convexity effect when the YTM declines and subtracting the convexity effect\nwhen the YTM increases.\nCalculate the percentage price change of a bond for a specified change in yield, given the bond’s duration and convexity.", "qhtml": null}, {"n": 30, "q": "An option pricing model is used to determine the following information about a callable bond: Selected Bond Data Bond's initial price 107.21 Bond's price after yield increase 104.66 Bond's price after yield decrease 107.83 Effective convexity −89.90 Approximate convexity −65.47 Based on only this information, the implied shift (in basis points) in the benchmark yield is closest to: ", "opts": ["142", "166", "181"], "ans": "A", "expl": "A bond's price changes can be measured as a function of changes in the bond's YTM or shifts in a benchmark yield curve. Approximate convexity\n(a measure of yield convexity) is the appropriate convexity measure for price changes resulting from changes to a bond's YTM. Effective\nconvexity (a measure of curve convexity) is the appropriate convexity measure for price changes resulting from shifts in a benchmark yield curve.\nThe future cash flows of callable bonds are uncertain due to the embedded option that gives issuers the ability to call the bonds before maturity,\nending cash flows to investors. This means that a callable bond's internal rate of return is not consistent with its YTM, and changes in the YTM\ncannot reliably indicate the bond's duration and convexity. Therefore, effective convexity, not approximate convexity, is used for callable bonds.\nIn this scenario, the bond is callable, so effective convexity is appropriate. Substitute the bond price and the effective convexity data to\ncalculate the implied shift in the benchmark yield:\nCalculate and interpret convexity and describe the convexity adjustment.", "qhtml": null}];
const CFG = {"title": "Wiley · Yield-Based Bond Convexity and Portfolio Properties", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 30 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
