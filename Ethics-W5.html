 and the limitations and risks associated with these processes. Members and candidates must\nuse reasonable judgment when identifying important factors. To comply with the Standard, members and candidates should communicate to\nclients an understandable description of the investment process. It need not be a complete dissertation of the strategy.\nHere, Haughton must communicate, in understandable terms, the basic process and logic of the complex trading process. The communication\nshould convey enough information that clients can recognize the risks and limitations of the investment process.\n(Choice A) Haughton is not required to communicate to current and prospective clients the entire complex trading strategy and its underpinnings.\nHowever, he must supply the basic premise of his strategy so that clients can gain an understanding of its limitations and risks.\n(Choice C) Describing significant trades is helpful information, but it is incomplete to meet this Standard. Current and prospective clients should\nbe able to grasp the risks and drawbacks of the complex strategy.\nThings to remember:\nStandard V(B) requires members and candidates to disclose to current and prospective clients the basic format of investment processes and the\nlimitations and risks associated with the process. To comply with the Standard, members and candidates should communicate to clients an\nunderstandable description of the investment process. It need not be a complete dissertation of the strategy.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 105, "q": "Jesus Martinez, CFA, is a successful real estate analyst at Monument Associates. He is also a volunteer board member for CasaMundo, a nonprofit that finds housing for the homeless. Since Martinez understands the local real estate market very well, he agrees to negotiate CasaMundo's purchase of a new building listed at $875,000. Martinez offers the building's seller $850,000, which is accepted. His offer includes his legal and customary $5,000 commission, which is paid by the seller. CasaMundo, unaware of Martinez's commission, determines that he obtained a fair price of $850,000 and is happy with his contribution of time and energy. Does Martinez violate Standard I(D) Misconduct?", "opts": ["Yes.", "No, since the commission is legal and customary.", "No, since Martinez negotiated a fair market price."], "ans": "A", "expl": "\"Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit or\ncommit any act that reflects adversely on their professional reputation, integrity, or competence.\"\nUnder Standard I(D), Members and Candidates must completely refrain from any conduct that diminishes the industry's integrity, a firm's\nreputation, or an individual's competence. Any breach of a Member's integrity diminishes the investment industry's aggregate reputation.\nDeceit or dishonesty can negatively impact a Member's or Candidate's integrity and violate the Standard, even if it does not violate the law.\nMartinez violates the Standard since he deceives CasaMundo as he fails to disclose the details of the transaction and hides his commission from\nCasaMundo.\n(Choice B) Even though it is legal and customary to charge a commission, Martinez still deceitfully profits from CasaMundo since he fails to\ninform CasaMundo of his commission. Without his commission, CasaMundo may have obtained a better price.\n(Choice C) Martinez negotiates a below-market price but still deceives CasaMundo by not informing CasaMundo of his commission. Regardless\nof the price Martinez obtains for CasaMundo, to comply with the Standard he should have disclosed his intentions to charge a commission and\nreceived CasaMundo's approval.\nThings to remember:\nMembers and Candidates must refrain from any conduct that diminishes the integrity, reputation, or competence of the industry, a firm, or\nthemselves. Any breach of a Member's integrity diminishes the investment industry's aggregate reputation. Deceit or dishonesty negatively\nimpacts a Member's or Candidate's integrity and violates the Standard, even if it does not violate the law.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 106, "q": "Halim Gamal, CFA, is a research analyst at Nile Capital Bank (NCB). He conducts independent research on health care companies and participates in group research on the industry with other NCB analysts. Gamal meets with the research group to discuss the impact of a new law on the industry. Most of the analysts expect the regulations written to enforce the new law to create unintended consequences that will shrink health care industry profits. Although Gamal believes the basis for the group's conclusion is reasonable and adequate, he thinks the law will ultimately benefit the industry. The most senior NCB health care analyst writes the report for the group with a conclusion drawn for the majority. Gamal does not ask that his name be removed from the report despite disagreeing with the conclusion. Has Gamal violated Standard V(A) Diligence and Reasonable Basis? ", "opts": ["No", "Yes, he should write a separate report with his own dissenting conclusion", "Yes, he should disassociate from the report and ask that his name be removed"], "ans": "A", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires all investment analysis done by Members and Candidates to be diligent and thorough.\nReasonable efforts must be made to ensure all pertinent issues are considered when issuing recommendations.\nWhen investment analysis and recommendations are done by a group, not all members of the group must agree on the conclusion\ndisseminated to clients. Those with dissenting opinions:\nare allowed to keep their names on the report and\ndo not need to disassociate if they disagree with colleagues as long as they believe the group's conclusion has a reasonable and adequate\nbasis.\nIn this scenario, although Halim Gamal does not agree with the group's conclusion, he is satisfied with the group's process and believes their\nconclusion is based on adequate and sound reasoning. As such, he does not need to write his own dissenting report or request that his name be\nremoved (Choices B and C). The Standard allows Gamal to keep his name on the research report.\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis requires all investment analysis done by Members and Candidates to be researched thoroughly.\nWhen investment analysis and recommendations are done by a group, those with dissenting opinions may keep their names on the report if they\nbelieve the group's conclusion has a reasonable and adequate basis.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}];
const CFG = {"title": "Wiley · Ethics Application", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Ethical & Professional Standards · 106 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
