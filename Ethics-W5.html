d by an \"expert\" when she does not know\nthat to be the case.\n(Choice B) Using research available on social media is not a violation of the Standard; social media is a legitimate outlet for information. As with\nall sources, material from social media should be properly cited.\n(Choice C) Although Zheng does not know the real name of the source of the research since the author chose not to share it, she should not\nreproduce the research without attribution. Since she omits any citation, it is plagiarism.\nThings to remember:\nMisrepresentation happens when a candidate or member knowingly misrepresents or misuses information. The standard applies whether\ninformation is prepared for clients, colleagues, or the public. Misrepresentation consists of plagiarism, omission, or exaggeration.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 51, "q": "Christine Hansen, CFA, works as an investment advisor at a large regional bank. Many of Hansen's larger clients can benefit from comprehensive estate planning, including the need for various trusts and insurance policies. For the trust work, Hansen refers these clients to an outside law firm, and for their insurance needs, she refers them to the bank's internal insurance subsidiary. Hansen receives a one-time $100 bonus for every insurance policy sold by the subsidiary on her referral. The law firm is a corporate sponsor of the local professional basketball team and gives Hansen two courtside tickets for each referral. With regard to Standard VI(C) Referral Fees, Hansen is required to disclose:", "opts": ["both referral arrangements.", "only the internal referral arrangement.", "only the external referral arrangement."], "ans": "A", "expl": "\"Members and Candidates must disclose to their employer, clients, and prospective clients, as appropriate, any\ncompensation, consideration, or benefit received from or paid to others for the recommendation of products or\nservices.\"\nStandard VI(C) Referral Fees requires members and candidates to notify employers and clients if they receive any benefit for\nrecommending a product or service. Such benefits can create a conflict of interest, so disclosing the potential conflict allows affected parties to\ndetermine whether the recommendation is impartial. The Standard refers to \"any compensation,\" so the size of the fee that Hansen receives is\nirrelevant. She is required by the Standard to disclose both arrangements to her clients when making the referrals.\n(Choice B) The outside referral arrangement is a form of noncash compensation and must also be disclosed to comply with the Standard.\n(Choice C) The fact that a client being referred to the internal subsidiary is an existing client of the firm does not affect the need for full disclosure\nof the fee arrangement.\nThings to remember:\nStandard VI(C) Referral Fees requires members and candidates to disclose referral fees for recommending products or services. A referral fee is\nbroadly defined and includes any cash or noncash reward.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 52, "q": "Jalen Butler, CFA, is a research analyst for Principal Capital. As part of his research, Butler uses aggregated data generated from a variety of social media websites to track trends. Principal's compliance department updates its record retention policies annually, and therefore its most recent rules do not include several of the new websites used by Butler. Butler does not retain the data generated from the websites outside of Principal's record retention list since the information is on the internet and therefore is easily accessible. Has Butler most likely violated the Standards?", "opts": ["Yes", "No, since certain sources are not on Principal's record retention list", "No, since he is not required to retain records of information that can be found on the internet"], "ans": "A", "expl": "\"Members and Candidates must develop and maintain appropriate records to support their investment analyses,\nrecommendations, actions, and other investment-related communications with clients and prospective clients.\"\nStandard V(C) Record Retention requires members and candidates to keep records of their research and motives for their actions and\nrecommendations. Although records are considered property of the firm, and the Standard places some responsibility for record retention on the\nfirm, Members and Candidates are ultimately responsible for assisting the firm in collecting and retaining this information, even if it is easily\naccessible to anyone via the internet. Sources that require retention include:\nClient conversations\nNotes from earnings calls\nStatistical analyses (ie, spreadsheets)\nWritten reports\nElectronic communications (eg, texts, emails)\nMedia communications (eg, Twitter feeds, blogs)\nGiven the frequent changes in digital media landscape, companies' record retention policies often lag the creation and popularization of new\nsources of information. This puts the burden of retention regarding these types of media more heavily on the Member or Candidate than the\ncompany. In this question, Jalen Butler is required to retain his records from all social media websites, whether on the company's retention list or\nnot. Failing to do so violates the Standard (Choice B).\n(Choice C) Although media communication is often easily accessible on the internet, information can also be removed from a website, so\nMembers and Candidates are required to retain this information.\nThings to remember:\nStandard V(C) Record Retention requires members and candidates to keep records of their research and motives for their actions and\nrecommendations. Members and Candidates are ultimately responsible for assisting the firm in collecting and retaining this information. Given\nthe frequent changes to digital media landscape, the burden of retention of these types of media falls more heavily on Members and Candidates\nthan companies.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 53, "q": "Liu Tengfei, CFA, manages a set of client portfolios. Several of his portfolios are underperforming for the quarter. Liu's boss tells him that Golden Peak, a pharmaceutical company, has a drug that is expected to receive regulatory approval soon, and the approval is likely to increase the price of the stock. After analyzing Golden Peak's financials, Liu purchases Golden Peak stock for only his underperforming portfolios. Two weeks later, the drug receives regulatory approval and the stock increases 35%. Has Liu most likely violated Standard III(C) Suitability? ", "opts": ["Yes", "No, since Golden Peak's stock increased in value", "No, since he allocated Golden Peak to only underperforming client portfolios"], "ans": "A", "expl": "When Members and Candidates are in an advisory relationship with a client, they must: …\nb. Determine that an investment is suitable to the client's financial situation and consistent with the client's\nwritten objectives, mandates, and constraints before making an investment recommendation or taking\ninvestment action.\nStandard III(C) Suitability addresses a Member's or Candidate's responsibilities in evaluating the appropriateness of every investment for each\nclient. A manager creates and maintains an investment policy statement for each client based on the client's goals, risk tolerance, and\nconstraints. The adviser should consider an individual client's situation before making an investment decision for the client.\nIn this scenario, Liu violates the Standard by purchasing Golden Peak for clients based solely on the performance of their portfolios. Liu must\nweigh the suitability of the stock's risk and return characteristics for each client's portfolio before making any purchases.\n(Choice B) The increase in Golden Peak's stock price does not excuse Liu from evaluating the investment against each of his clients' investment\nparameters before making the investment decisions.\n(Choice C) Liu conducts due diligence in regard to Golden Peak's financials, but he fails to evaluate the suitability of the investment for his\nclients. Golden Peak's risk and return characteristics may not be suitable for each client with an underperforming portfolio, and they may be\nsuitable for other clients' portfolios.\nThings to remember:\nStandard III(C) Suitability requires Members and Candidates to evaluate an investment's suitability for each client. The manager must consider an\nindividual client's investment goals, constraints, and risk tolerance before making an investment decision for the client.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 54, "q": "Kyle Trainor, CFA, publishes a popular investing newsletter. In the most recent edition he recommends that subscribers buy Ambit Holdings (AHC). Trainor has owned AHC for many years and would like to sell it, but he believes that AHC is undervalued at its current price of $25 per share. His recommendation is based on interviews with AHC's executives as well as his own independent research, and he believes that AHC's price will double when it releases its year-end earnings next month. He includes a few details of his research, using phrases such as \"I have heard that earnings will be very strong\" and \"Many people think that this stock will SOAR.\" He also discloses his ownership of AHC stock. Based on his recommendation, many subscribers buy AHC stock, which causes the price to rise. Before AHC releases its year-end earnings, Trainor sells his entire AHC position at a price of $45 per share. After AHC releases its earnings report, its price continues to rise, peaking at $64 per share before declining. Did Trainor most likely violate Standard II(B) Market Manipulation? ", "opts": ["No", "Yes, since his recommendation was premised on opinion, not fact.", "Yes, since he benefitted from the price increase caused by his recommendation."], "ans": "A", "expl": "\"Members and Candidates must not engage in practices that distort prices or artificially inflate trading volume with\nthe intent to mislead market participants.\"\nStandard II(B) Market Manipulation prohibits activities by members or candidates that distort securities prices. Manipulation can occur through\ninformation-based activities, such as spreading false rumors, or\ntransaction-based activities, such as exaggerated trading between two accounts.\nHowever, a key element in determining whether the Standard is violated is that the Member or Candidate must intend to deceive other market\nparticipants. The Guidance emphasizes that intent is critical; there is no violation of the Standard without it. Intent in each case must be inferred\nfrom relevant facts and circumstances.\nHere, no market manipulation occurred, as Trainor had no intent to deceive. His recommendation was based on research from different sources,\nand while some of it could be characterized as rumor (eg, he heard that earnings would be \"very strong\"), he also offered details of the research,\nas well as disclosing his ownership in Ambit. Since he engaged in no manipulative conduct, it is irrelevant that he benefitted from his\nrecommendation (Choice C).\n(Choice B) Trainor's recommendation was based on a combination of variables. He formed an opinion based on a reasonable interpretation of\nthose variables. Nothing suggests any intent by Trainor to deceive his subscribers, which would have been the case had he based it on falsity or\nunsupportable conjecture.\nThings to remember:\nViolation of Standard II(B) Market Manipulation requires an action that distorts a security's price. However, the action must be intended to\ndeceive. Intent can be inferred from the facts and circumstances of each situation.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 55, "q": "Ashton Griffiths, CFA, a world-renowned investor, is an adviser at TenSteps Investments. On a popular podcast, Griffiths publicly recommends purchasing shares of Allthrift, a large online bank. At Griffiths' direction, TenSteps has held Allthrift for over 7 years for clients and Griffiths is still confident that it is an excellent investment. The next day, TenSteps buys 100,000 shares for clients. After the trade, Allthrift price declines 2%. Two weeks later, after receiving preclearance, Griffiths sells 10,000 shares of Allthrift from his private account for tax purposes and to purchase a second home. According to Standard VI(B) Priority of Transaction, does Griffith most likely violate the Standard?", "opts": ["No.", "Yes, by purchasing Allthrift for clients.", "Yes, by selling Allthrift after recommending its purchase."], "ans": "A", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions in which a Member or\nCandidate is the beneficial owner.\"\nStandard VI(B) requires Members and Candidates to put clients' interests ahead of their own. This means clients should be financially unharmed\nby a Member's personal trades. To comply with the Standard, for a given security, client trades should be placed before nonclient (eg, employee)\ntrades. If employees trade the same security before clients, employees may negatively impact the security's price (eg, higher prices for buys,\nlower prices for sells) for clients.\nThe Standard allows Members and Candidate to make personal trades if they:\nDo not harm clients from their trades\nDo not receive an economic benefit from client trades\nAdhere to governing laws and regulations\nEven if the action contradicts previous investment recommendations (ie, selling after recommending a buy), investment professionals may\ninvest according to their personal needs. Ashton Griffiths publicly makes a recommendation, promptly makes purchases for clients, and sells\nafter receiving preclearance. He does not violate the Standard by selling Allthrift since clients are not harmed, he does not benefit from client\ntrades, and he fulfills his regulatory obligations (Choices B and C).\nThings to remember:\nClients' interests have priority over Members' or Candidates' interests. However, if Members and Candidates do not harm clients, do not receive\nan economic benefit from client trading, and abide by regulations, personal trades are allowed. This includes trades contradictory to previous\nrecommendations since Members and Candidates may invest according to their personal needs.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 56, "q": "Lena Schmidt, CFA, is preparing an investment report on Fulcrum Industries while she waits for a plane at the airport. While writing the report, she sees the CEO of Fulcrum boarding a flight to the city where Keel Manufacturing, one of Fulcrum's competitors, has its headquarters. Based on her research of the companies' financial statements, Schmidt knows that Fulcrum and Keel have significant strategic and geographic overlap. She recalls that, on the company's latest earnings call, Fulcrum's CEO mentioned he was analyzing acquisition targets. Based on this information, Schmidt concludes that Fulcrum may be preparing an offer to purchase Keel. She revises her research report on Fulcrum to add her theory on the acquisition, citing the above information, and changes her recommendation from buy to hold. She then sends the report to her clients. Has Schmidt most likely violated Standard II(A) Material Nonpublic Information? ", "opts": ["No", "Yes, since she shared the information before the CEO announced his trip", "Yes, since she shared her report only with clients and not the general public"], "ans": "A", "expl": "\"Members and Candidates who possess material nonpublic information that could affect the value of an\ninvestment must not act or cause others to act on the information.\"\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from trading on or recommending investments based on\nmaterial nonpublic information. However, analysts may piece together public and nonmaterial nonpublic data from multiple sources to form\nan investment conclusion.\nThis research approach is referred to as the mosaic theory, and it recognizes that analysts form conclusions from various sources of information.\nConclusions formed through the mosaic process, even when based on information that would be considered material and nonpublic if it were\ncoming directly from a reliable source (eg, the company), do not violate the Standard.\nIn this scenario, Lena Schmidt has used public information (eg, financial statements) and nonmaterial nonpublic information (ie, the CEO's flight)\nto form an investment conclusion using the mosaic approach. Although Schmidt's conclusion, if true, would be the equivalent of material nonpublic\ninformation if disclosed directly to her by the company, her actions do not violate the Standard.\n(Choice B) A CEO's travel plan is typically deemed a nonmaterial event (ie, by itself, it would not affect the company's stock price). Therefore,\nSchmidt did not need to wait for the company to issue a press release to make the information public.\n(Choice C) Analysts are not required to publicly disseminate their research reports. As long as Schmidt's report was sent to clients in a fair\nmanner, she has not violated the Standard.\nThings to remember:\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from trading on or recommending investments based on material\nnonpublic information. Mosaic theory, an approach that uses a combination of public and nonmaterial nonpublic information to arrive at investment\nconclusions, is not considered a violation of the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 57, "q": "Ross Farley, CFA, is the chief compliance officer at Prudent Advisors, Inc. (PA). PA offers investment advisory services to retail investors. Farley monitors the activity of six financial advisors to ensure compliance with all applicable laws and regulations. Farley has provided all employees with the firm's code of ethics and a policies and procedures manual. On an annual basis, Farley conducts educational training, sets expectations for behavior, and asks employees to sign a document attesting that they have received the code and manual and understand their contents. In addition, employees are required to submit a quarterly transaction report detailing their trading of individual securities. Farley discovers that Greg Smith, an advisor at the firm, recently opened an unauthorized account at a discount brokerage firm and is conducting personal trades that have not been reported or approved. According to Standard IV(C) Responsibilities of Supervisors, did Farley most likely violate the Standards? ", "opts": ["No", "Yes, for failing to set up and implement an effective compliance program", "Yes, for failing to prevent Smith from trading in an unauthorized brokerage account"], "ans": "A", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their\nsupervision or authority complies with applicable laws, rules, regulations, and the Code and\nStandards.\"\nStandard IV(C) Responsibilities of Supervisors requires Members and Candidates who supervise employees to make a reasonable effort to\ndetect and prevent unethical behavior and violations of the law, rules established by their firm, and the Code and Standards. However, failing to\ndetect such behavior is not necessarily a violation of the Standard if the supervisor ensures that a proper compliance system is in place.\nThe Guidance to the Standard indicates that compliance, at a minimum, requires supervisors to:\nestablish written compliance procedures, and\nperform regular reviews to ensure that employees are following the procedures.\nA supervisor who does not satisfy these requirements violates the Standard even if no laws or codes were violated. However, the concept of\n\"reasonableness\" does not make supervisors responsible for detecting all violations; employees may be able to evade compliance in ways that\ncannot be detected through reasonable efforts.\nIn this instance, Ross Farley established and implemented an adequate compliance program (Choice B). It is not reasonable to conclude that\nFarley should have known that an employee would try to evade the requirement (Choice C). However, now that he knows it is possible, Farley\nshould enhance the compliance systems to prevent future occurrences.\nThings to remember:\nStandard IV(C) Responsibilities of Supervisors requires supervisors to, at a minimum, establish written compliance procedures and perform\nregular reviews to ensure that employees are following those procedures. Supervisors who do not satisfy these requirements violate the Standard\neven if no laws or codes are violated. However, the Standard requires only that supervisors make reasonable preventative efforts; a supervisor\nwho follows the requirements does not violate the Standard even if there is a violation.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 58, "q": "Reem Gamal, CFA, is the owner of Osiris Partners. She is working on the marketing pitch that she will give to the trustees of Horus University to have Osiris manage its endowment fund. As part of her pitch, she plans to say: I: \"Since Osiris hires only CFA charterholders, we are among the elite asset management firms, as proven by our performance: Our returns have outperformed the overall market in 9 of the past 10 years.\" II: \"By passing such an intense and comprehensive study program, each of our analysts have enhanced their knowledge in portfolio management, including endowments.\" Which of the statements would most likely violate the Standards? ", "opts": ["Only Statement I", "Only Statement II", "Both Statement I and II"], "ans": "A", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA Program, Members\nand Candidates must not misrepresent or exaggerate the meaning or implications of membership in CFA Institute, holding the\nCFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program forbids Members and Candidates from exaggerating the\nmeaning or implication of having a CFA charter. This includes overstating competency or the ability to achieve superior investment\nperformance.\nAlthough Standard I(C) focuses generally on promises related to investment guarantees or ability to achieve superior returns, Standard VII(B)\nspecifies that these claims cannot be attributable to the CFA designation. However, statements of objective fact about the benefits (eg,\nknowledge and skills gained, credibility) of the CFA designation and the rigor of the program are allowed.\nIn this question, Gamal's first statement violates the Standard by asserting that Osiris Partners is an elite asset management firm since the firm\nhires only CFA charterholders; by doing so, she attributes elite status to the charter. Even though the statement compares the firm's performance\nagainst the market, the statement is still a violation since it implies superior performance can be expected going forward. Gamal's second\nstatement does not violate the Standard since it states only facts about the intensity of the exam and skills and knowledge earned (Choices B and\nC).\nThings to remember:\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program forbids Members and Candidates from exaggerating the\nmeaning or implication of having a CFA charter violate the Standard. However, statements of objective fact about the benefits of the CFA\ndesignation and the rigor of the program are allowed.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 59, "q": "Trevor Collins, CFA, is a financial adviser for Starlight Advisory. Some of his clients require additional services outside his expertise. Collins refers clients who need life insurance to another department at Starlight. The life insurance department gives Collins 10% of each client's initial life insurance payment as a referral fee. Collins does not disclose this arrangement to clients since the referral is internal to his company. Collins refers clients who need advanced tax services to Accounting Hub, a third-party accounting firm. For every 10 referrals, Accounting Hub invites Collins to join the firm's managers in their corporate box for a professional football game. Collins discloses to clients that he has a referral agreement with Accounting Hub but does not disclose the details. Collins most likely violated the Standards with respect to:", "opts": ["only the internal life insurance referral.", "only the third-party advanced tax services referral.", "both the internal life insurance and third-party advanced tax services referrals."], "ans": "C", "expl": "\"Members and Candidates must disclose to their employer, clients, and prospective clients, as appropriate, any compensation,\nconsideration, or benefit received from or paid to others for the recommendation of products or services.\"\nStandard VI(C) Referral Fees requires Members and Candidates to notify their employers, existing clients, and prospective clients of any benefit\nthey receive for recommending a product or service. Disclosing referral arrangements allows employers and clients to determine if conflicts of\ninterest exist and whether a recommendation is impartial. A referral fee is broadly defined and includes any cash or noncash rewards.\nIn this question, Trevor Collins violates the Standard for both referrals since the Standard stipulates that all referral agreements must be\ndisclosed. The referral for life insurance must be disclosed to clients since the referral fee can cause a conflict of interest for Collins whether it\ncomes from an internal or external source (Choice B). The referral for advanced tax services must be disclosed to clients with full details so\nclients can make informed judgments; it is not enough to simply disclose the existence of an agreement (Choice A).\nThings to remember:\nMembers and Candidates must notify their employers, existing clients, and prospective clients of any benefit they receive for recommending a\nproduct or service. This disclosure allows employers and clients to determine if conflicts of interest exist. Disclosures must include the detailed\narrangements of the referral and must be made regardless of whether the arrangement is with an internal or external party.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 60, "q": "Sumit Ahuja, CFA, is an investor with limited knowledge of the biotech industry. Through an expert network, he calls a physician at a prestigious hospital regarding broad trends in the biotech industry. The physician names several companies that have high-profile drugs in the final stages of the government's publicly disclosed approval process. One of the companies is Orion Pharmaceuticals. After the call, as part of his thorough research on Orion, Ahuja purchases a newly released research report from Vijaya Dayal, a respected biotech analyst who covers Orion. In her report, Dayal states that Orion's drug is likely to receive regulatory approval, based on her own opinion from thorough research. As a result, Ahuja purchases stock in Orion. Ahuja: ", "opts": ["was in full compliance of the Standards.", "violated the Standards by trading based on information received from the expert network.", "violated the Standards by trading based on a research report that was not disseminated to the general public."], "ans": "A", "expl": "\"Members and Candidates who possess material nonpublic information that could affect the value\nof an investment must not act or cause others to act on the information.\"\nStandard II(A) requires Members and Candidates to abstain from investment actions if they have material nonpublic information (MNI). Trading\nbased on MNI erodes trust in the fairness of the capital markets and the investing profession by perpetuating the idea that insiders take deceitful\nadvantage of the investing public. MNI can come from many sources, including company management and expert networks. A Member or\nCandidate must evaluate the information itself to decide whether it is MNI before acting on it.\nIn this question, the physician whom Sumit Ahuja calls through an expert network provides information on broad industry trends, which is\nnonmaterial since it is not company specific. The physician also provides the names of companies with drugs in the final stages of the government\napproval process, which is public information. Therefore, Ahuja did not receive MNI through the expert network and did not violate the Standard\nby acting on it (Choice B).\nAlthough research reports from sell-side analysts, even those based on opinions, can be material and nonpublic, trading based on these reports\ndoes not violate the Standard if any investor can purchase them. Such availability means that a report is public even if not publicly disseminated.\nSince the report Ahuja purchased from Vijaya Dayal is available to all investors, Ahuja did not violate the Standard by acting on it (Choice C).\nThings to remember:\nStandard II(A) requires Members and Candidates to abstain from making transactions using material nonpublic information (MNI). MNI can come\nfrom many sources, including company management and expert networks. Members and Candidates must evaluate information to decide\nwhether it is material and nonpublic before acting on it.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 61, "q": "Miles McAllen, CFA, is a research analyst for Everhold Securities. For the last several years, McAllen has analyzed 4Furniture, Inc. for Everhold. McAllen joins 4Furniture's board of directors and receives 500 shares of 4Furniture's common stock as compensation, which is disclosed to and approved by Everhold. According to Standard VI(A) Disclosure of Conflicts, does McAllen's directorship most likely violate the Standard?", "opts": ["Yes, since McAllen's objectivity is compromised.", "Yes, as McAllen must refuse external compensation.", "No, but McAllen may not make investment decisions on 4Furniture."], "ans": "C", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to\nimpair their independence and objectivity or interfere with respective duties to their clients, prospective clients,\nand employer. Members and Candidates must ensure that such disclosures are prominent, are delivered in plain\nlanguage, and communicate the relevant information effectively.\"\nMembers and Candidates who serve as directors have a conflict of interest between serving their employer's clients and the board's\nshareholders. The existence of a conflict alone does not necessarily violate the Standard. If an employee receives stock compensation as a\ndirector, the employee must:\nDisclose the compensation to the employer\nDisassociate from the investment decisions regarding the external company\nSince Miles McAllen's directorship is approved by Everhold Securities and McAllen discloses his compensation, McAllen does not violate the\nStandard (Choices A and B).\nFirms that allow employees to maintain directorships at external public companies must prevent them from making investment judgments on those\ncompanies since conflicts of interest exist. Therefore, McAllen must not participate in analyzing or giving opinions about 4Furniture, Inc. to abide\nby the Standard. A suggested solution is for firms to establish a firewall to mitigate the conflict.\nThings to remember:\nDirectors have conflicts between serving their clients and the company's shareholders, but this alone does not necessarily violate the Standard.\nDirectors may receive company stock as compensation but must disclose it and refrain from giving investment opinions about the company.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 62, "q": "Emilia Cosgrove, CFA, is considering a job offer to work as an analyst for Juniper Securities. It is the only offer she has received after five months of searching for employment. Manuel Griggs, Cosgrove's close friend, was hired by Juniper six months ago and currently works there as an analyst. In confidence, Cosgrove shares her offer with Griggs, who in turn shares his salary. Griggs is paid 30% more than the salary offered to Cosgrove. Cosgrove negotiates for higher compensation, but Juniper stands by its original offer. She accepts the offer and begins working for Juniper. Whenever she travels on assignments for Juniper, she requests reimbursement for amounts that exceed her actual expenses. According to Standard I(D) Misconduct, do Griggs and/or Cosgrove most likely violate the Standard?", "opts": ["No.", "Yes, Cosgrove violates the Standard by compromising her integrity.", "Yes, Cosgrove and Griggs violate the Standard by sharing salary information."], "ans": "B", "expl": "\"Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit or\ncommit any act that reflects adversely on their professional reputation, integrity, or competence.\"\nMembers and Candidates must comply with Standard I(D) by abstaining from behaviors that diminish the individual's, firm's, or investment\nindustry's reputation. Deceitful or dishonest acts negatively impact a Member's or Candidate's integrity and violate the Standard.\nIn this scenario, if Juniper Securities does not pay equitable wages to all employees, the matter should be pursued through the appropriate\nchannels while maintaining compliance with the Standard. Emilia Cosgrove violates the Standard by falsifying her travel expenses to Juniper\nregardless of her subjective belief that doing so is warranted. Cosgrove diminishes her reputation and the reputation of the investment industry by\ndishonestly reporting her expenses (Choice A).\n(Choice C) Cosgrove and Manuel Griggs may share personal information, including how much they earn, without violating the Standard.\nThings to remember:\nMembers and Candidates must abstain from behaviors that diminish the individual's, firm's, or investment industry's reputation. Deceitful or\ndishonest acts negatively impact a Member's or Candidate's integrity and violate the Standard, even when the Member or Candidate believes\nsuch acts are justified.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 63, "q": "Juan Castillo, CFA, is director of research at State Pension Fund (SPF). SPF invests exclusively through subadvisors to construct the pension's portfolio. While preparing for SPF's annual strategy session, Castillo contacts Macro Trade Research Advisors (MTRA) to get its latest research and views on the financial markets. MTRA has a correspondent brokerage relationship with Johnson Brothers Brokerage (JBB) in which JBB directs 50% of commissions to MTRA. Castillo instructs several subadvisors to send trades to JBB to pay for MTRA's research services. Do Castillo's actions most likely comply with Standard III(A) Loyalty, Prudence, and Care? ", "opts": ["Yes.", "No, since Castillo cannot direct other firms' trades.", "No, since Castillo uses pension fund assets to pay for research services."], "ans": "A", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients'\ninterests before their employer's or their own interests.\"\nA client practices directed brokerage by directing brokerage commissions for the purchase of goods or services that aid the beneficiaries of\nthe client's account. This practice is common among plan sponsors who outsource the responsibility of day-to-day investment decisions to\nsubadvisors and do not directly generate commissions themselves.\nTrading commissions are considered an asset of the client—in this scenario, State Pension Fund (SPF), represented by Juan Castillo—not the\nsubadvisor. The client has the right to make beneficial use of that asset, and the subadvisor has a duty of loyalty to use the asset for the benefit of\nthe client if so requested.\nCastillo, on behalf of SPF (ie, the client), instructs several subadvisors to direct trade commissions (ie, the asset) to Johnson Brothers Brokerage\nto pay for Macro Trade Research Advisors' research services. Castillo complies with Standard III(A) Loyalty, Prudence, and Care by using\ndirected brokerage to pay for investment research related directly to SPF's investment decisions and to SPF's benefit.\n(Choices B and C) Castillo does not misuse his position or violate his duty of loyalty to the pension fund. Since trading commissions are assets\nof the client, it is appropriate to sometimes request that those assets be used to acquire research services (ie, direct subadvisor trades) for the\nbenefit of the client (ie, the pension plan).\nThings to remember:\nTrading commissions are considered an asset of the client, not the investment manager, and the client has the right to make beneficial use of that\nasset. A client may practice directed brokerage by directing commissions for the purchase of goods or services that will aid the beneficiaries of the\nclient's account.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 64, "q": "Duane Wolfe, CFA, is a well-regarded equities analyst. Advisors in his firm routinely forward his reports and other communications to their clients. Wolfe covers a company called Western Aerospace, a major military contractor. Western Aerospace is rumored to be close to signing a significant government contract and based on the rumors its stock price has steadily increased. The company confirms only that contract talks are ongoing. Many clients of Wolfe's firm own Western Aerospace stock. At a restaurant after work, Wolfe overhears two individuals he does not know talking about Western Aerospace's contract negotiations and implying that the deal will fall through. Wolfe immediately calls a source at Western Aerospace, but the source neither confirms nor denies what Wolfe overheard. The next morning, Wolfe sends an email to the firm's client advisors that says, \"Heads up: I may have information that could significantly affect Western Aerospace's stock price.\" He provides no further details. Several client advisors forward the email to their clients, many of whom interpret it to mean that the contract will not happen and therefore sell their stock. Later that day, Western Aerospace announces that there will be no government contract, and its stock price declines significantly. Has Wolfe most likely violated Standard II(A) Material Nonpublic Information?", "opts": ["Yes.", "No, since the information Wolfe overheard was unreliable.", "No, since Wolfe did not know that his email would cause clients to sell their stock."], "ans": "B", "expl": "\"Members and Candidates who possess material nonpublic information that could affect the value of an\ninvestment must not act or cause others to act on the information.\"\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from acting on or causing others to act on information that is\nboth material and nonpublic. The Standard applies only if both elements are present.\nInformation is nonpublic if it is not available to the investing public in general. In this scenario, Western Aerospace initially provides no\ninformation about the contract except to confirm that it is negotiating with the government. It does not announce that the negotiations failed until\nafter Duane Wolfe sent his email. Therefore, prior to the announcement, information concerning the contract's status, including what Wolfe\noverheard, is nonpublic.\nInformation is material if:\na reasonable investor would consider it important to know before making an investment decision or\nthe information would likely impact the stock price.\nWith respect to materiality, information's reliability must be considered. Wolfe cannot assess the veracity of what he overheard since he does\nnot know the speakers. In addition, his source at Western Aerospace cannot confirm what he overheard. Therefore, the overheard conversation\nis unreliable, rendering the information immaterial (Choice A). Although Wolfe may have violated Standard V(A) Diligence and Reasonable Basis\nby sending his email, he did not violate Standard II(A).\n(Choice C) Given Wolfe's stature as an analyst, it is reasonable to conclude that his email caused clients to act. Had the email been based on\nmaterial nonpublic information, Wolfe would have violated Standard II(A).\nThings to remember:\nStandard II(A) prohibits Members and Candidates from acting on or causing others to act on material nonpublic information. To determine whether\ninformation is material, the source's reliability must be considered.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 65, "q": "Mina Pappas, CFA, is the sole proprietor of Milos Capital, providing financial advice to high-net-worth clients. Pappas invests client's equity assets through a separately managed account strategy consisting of a portfolio of 20 equally weighted, large-cap stocks. Part of Pappas' sales pitch to clients and prospects is that she invests \"alongside\" her clients by investing her own assets in the same strategy. Pappas decides to sell one of the holdings and replace it with her best new idea. Pappas enters the buy and sell orders for all clients, including herself, and executes the trades. All clients receive the same execution prices, including Pappas. According to Standard VI(B) Priority of Transactions, Pappas most likely: ", "opts": ["is in full compliance with the Standard.", "violated the Standard by not adhering to a blackout period.", "violated the Standard by not executing the client's trades first."], "ans": "A", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions in which a\nMember or Candidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions requires members and candidates to place clients' and employers' financial interests before their\nown when conducting investment transactions. It is not uncommon for a member or candidate to transact in the same investments as clients, or\neven alongside clients. A Member or Candidate does not violate the Standard provided that:\nthe client is not disadvantaged by the trade,\nthe member or candidate does not benefit from the client transactions, and\nthe member or candidate adheres to all applicable regulatory requirements.\nIn this scenario, Pappas complied with the Standard.\n(Choice B) Blackout periods are specifically intended to prevent \"front-running,\" which is placing personal trades or a firm's proprietary trades\nahead of client trades. In this instance, by combining and executing all trades at once, Pappas is investing alongside her clients, as she has\npreviously communicated. Therefore, a blackout period is not applicable given the circumstances.\n(Choice C) In this case, the client was not disadvantaged nor did Pappas benefit from the client transactions; therefore, Pappas did not violate\nthe Standard by executing her trades alongside her clients' trades.\nThings to remember:\nStandard VI(B) requires Members and Candidates to place clients' and employers' financial interests before their own with respect to investment\ntransactions. However, it is not uncommon and not a violation for a Member or Candidate to transact in the same investments as clients, or even\nalongside clients.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 66, "q": "Meng Bo, CFA, is a research analyst for Grant Capital. She currently has a hold rating on Spire Data Center Investments (SDCI). SDCI is considering a secondary public offering. Meng is approached by Hao Liang, an investment banker for Grant who is trying to win SDCI's business for its offering. Hao tells Meng, \"We'll have a better chance of winning SDCI's offering if we have a buy rating on them. Can you take another look and see if you can upgrade them?\" Meng reviews SDCI's business again and does not see any change to her base case, which she views as the most likely outcome. However, Meng believes that, in a best-case scenario, SDCI could outperform its peers and be worthy of a buy rating. She still views the best-case scenario as unlikely, but its probability increases with the funds from the secondary offering. Meng writes a new report with a buy rating, stating that she expects SDCI to achieve its best-case scenario and outperform peers, and sends it to clients. Has Meng most likely violated Standard V(A) Diligence and Reasonable Basis? ", "opts": ["Yes", "No, since the new rating is backed by her best-case scenario", "No, since she thoroughly reviewed SDCI's business before changing the rating"], "ans": "A", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis addresses the need for Members and Candidates to conduct thorough and independent analyses\nof investments before issuing recommendations. Recommendations must be supported by the evidence available at the time. Reasonable\nefforts must be made to cover all pertinent issues.\nWhen making recommendations, Members and Candidates must also avoid outside influences that can affect their decision-making\nprocesses. They should recommend only the conclusions based on their own research.\nIn this scenario, Meng Bo does not see any change to Spire Data Center Investments' (SDCI's) base case on further review, which supports the\nhold rating. She still expects that her best-case scenario, which she relied on to justify a buy rating, is unlikely even after the secondary offering.\nIn her report, she misrepresents her opinion of the likelihood of the best-case scenario. She has violated the Standard by not exercising\nindependence.\n(Choice B) Although Meng's buy rating was supported by her best-case scenario, the scenario is unlikely and insufficient to support a rating\nupgrade.\n(Choice C) A thorough review of SDCI's business did not protect Meng from violating the Standard. After doing her due diligence, she should\nhave submitted a report that reflected her independent opinion rather than Hao Liang's influence.\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis addresses the need for Members and Candidates to conduct a thorough and independent\nanalysis of an investment. Recommendations must be supported by the evidence available at the time. They must also reflect the Member's or\nCandidate's actual beliefs and cannot be determined by outside influences.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 67, "q": "Anisa Bhandari recently received notice that she passed Level I of the CFA program. She updates her credentials on a popular social media platform by stating, \"CFA Candidate: Passed Level I of the CFA Program.\" As Bhandari is looking for new full-time employment, she has decided not to enroll for the Level II exam until her work situation is more settled and she can be sure she can commit the time and energy needed to pass the exam. Did Bhandari most likely violate the Standards?", "opts": ["No.", "Yes, by stating that she is a CFA Candidate.", "Yes, by stating that she passed Level I of the CFA program."], "ans": "B", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA Program, Members\nand Candidates must not misrepresent or exaggerate the meaning or implications of membership in CFA Institute, holding the\nCFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program regulates how Members and Candidates may use the\nCFA designation. Candidates are those who have:\nregistered with CFA Institute and are enrolled to sit for an exam, or\nsat for an exam and are awaiting results.\nSince Anisa Bhandari has received her results but has not registered for the next scheduled exam, she is no longer considered an active\nCandidate (Choice A). When Bhandari successfully registers for Level II, she can consider herself a Candidate again.\n(Choice C) Candidates may disclose their prior participation in the CFA program or may factually state that they passed a certain exam.\nLanguage such as \"Passed Level I of the CFA Program\" is acceptable.\nThings to remember:\nStandard VII(B) regulates how Candidates disclose their participation in the CFA program. Candidates may reference their candidacy for a future\nexam only if they are registered and enrolled.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 68, "q": "Walter Warner, CFA, is a research analyst covering the renewable energy sector. He recently inherited 1,000 shares of Hast Renewal Energy (HRE). Warner promptly informs his firm of his personal holding, and the firm does not restrict him from trading the stock. Warner publishes a report with favorable coverage of the renewable energy industry, including HRE, without disclosing his ownership of HRE. HRE stock, which Warner continues to hold, increases by more than 25% after the report's release. With regard to Standard VI(A) Conflicts of Interest, did Warner's release of the report most likely violate the Standard?", "opts": ["Yes, by not disclosing his HRE stock in the report.", "No, since he informed his employer of his holding.", "No, since he did not sell the stock and realize a gain."], "ans": "A", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to\nimpair their independence and objectivity or interfere with respective duties to their clients, prospective clients,\nand employer. Members and Candidates must ensure that such disclosures are prominent, are delivered in plain\nlanguage, and communicate the relevant information.\"\nPersonal ownership of stock recommended or held in client portfolios is a common potential conflict of interest that requires disclosure. Here,\nWarner appropriately disclosed his ownership of HRE stock to his employer. However, Standard VI(A) also requires disclosure of his\npersonal ownership of HRE stock to clients and prospective clients. This is meant to allow clients to decide for themselves whether the\npotential conflict of interest might influence a candidate's or member's objectivity (Choice B).\n(Choice C) That Warner held the stock and did not sell it for a gain is not relevant to the requirement to disclose his personal holding in the\npublished report.\nThings to remember:\nStandard VI(A) Disclosure of Conflicts addresses the responsibility of members and candidates to disclose actual and potential conflicts of\ninterests to clients, prospective clients, and employers so they can determine whether the conflict might influence a candidate's or member's\nobjectivity. Personal ownership of stock recommended or held in client portfolios is a common potential conflict of interest that requires disclosure\nunder the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 69, "q": "Maya Levine, CFA, is a research analyst at a hedge fund. Levine covers the global alternative energy industry and regularly uses an expert network to keep abreast of new developments. During a recent expert network call with a junior scientific researcher at an electric car manufacturer, Levine asks about a new battery technology that was disclosed in the last earnings release. The researcher echoes the optimistic tone of the press release, suggesting possible commercial development within a short period, but also notes that the rare earth elements needed for commercial production are in short supply. Based on this conversation, Levine begins researching rare earth mining stocks that could potentially benefit from large-scale commercialization were the technology adopted. After conducting her research, Levine identifies and recommends the purchase for the hedge fund of an attractively valued rare earth mining company, believing that this new technology could provide an upside to her valuation estimate. According to the Standard II(A) Material Nonpublic Information, Levine: ", "opts": ["did not violate the Standard.", "violated the Standard by acting on material nonpublic information.", "violated the Standard by not reporting the receipt of material nonpublic information to her supervisor or compliance staff."], "ans": "A", "expl": "\"Members and Candidates who possess material nonpublic information that could affect the value of an investment must not act\nor cause others to act on the information.\"\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from acting on or recommending investments based on\nmaterial nonpublic information. However, analysts may piece together public and nonmaterial nonpublic data from multiple sources to form\nan investment conclusion. This process is referred to as mosaic theory. Recommendations based on mosaic theory do not violate the Standard\nsince, rather than rely on company insiders, the conclusions depend on the analyst's skill in synthesizing information from disparate sources.\nIn this scenario, the researcher reiterates the company's already publicly released statement on the prospects and timeline for commercial\ndevelopment of a new battery technology, so no nonpublic information was disclosed. The researcher's comments regarding rare earth elements\nbeing in short supply might provide some additional nonmaterial information since it can be reasonably assumed that the information is included in\nthe company's publicly released forecasts or otherwise publicly available.\nTherefore, Maya Levine did not violate the Standard since she disclosed no material nonpublic information. Levine used this information in\napplying mosaic theory to assist with the investment thesis for the rare earth mining company (Choice B).\n(Choice C) Although it is recommended that Members and Candidates report the receipt of potentially material nonpublic information to their\nsupervisor or compliance staff, it is not required in all circumstances, and Members and Candidates are urged to exercise their own judgment, as\nappropriate.\nThings to remember:\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from acting on or recommending investments based on material\nnonpublic information. However, using mosaic theory, an approach that combines public and nonmaterial nonpublic information to arrive at\ninvestment conclusions, is not considered a violation of the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 70, "q": "David Landry, CFA, is director of investor relations at a small-cap industrial company and has been directed by the CEO to elevate the investment profile of the company. Landry contacts independent research providers regarding writing an investment research report on the company for distribution to buy-side analysts. Landry obtains quotes from two analysts. Nora O'Connor, CFA, proposes a variable fee structure based on the number of new buy-side investors. George Novogratz, CFA, proposes a flat fee for the research report plus $2,500 for distributing the report to 10 of his buy-side contacts. After evaluating both offers, Landry hires O'Connor. According to Standard I(B) Independence and Objectivity, the Standard was violated by: ", "opts": ["Landry and O'Connor only.", "O'Connor and Novogratz only.", "Landry, O'Connor, and Novogratz."], "ans": "A", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in\ntheir professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or\nconsideration that reasonably could be expected to compromise their own or another's independence and objectivity.\"\nStandard I(B) Independence and Objectivity requires Members and Candidates to avoid actions that compromise their independence and\nobjectivity or create conflicts of interest.\nProducing issuer-paid research is an acceptable practice as long as the analyst conducts the research with due diligence, remains\nindependent, and discloses all conflicts. One way to maintain independence is to accept only a flat fee for this type of work, since a variable fee\nlinked to conclusions, recommendations, or outcomes could inhibit the analyst's independence and objectivity. In this scenario, Landry and\nO'Connor both violated the Standard by agreeing to tie compensation to outcomes (ie, new investors).\n(Choices B and C) Novogratz did not violate the Standard by proposing his distribution arrangement since this compensation is not based on any\nspecific outcome and cannot be seen as compromising his independence.\nThings to remember:\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid actions that compromise their independence and\nobjectivity or create conflicts of interest. Producing issuer-paid research is an acceptable practice if the analyst conducts the research with due\ndiligence, remains independent, and discloses all conflicts.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 71, "q": "Nadine Pinot, CFA, is a fintech analyst. To stay current on the latest technology, she hires Connective, Inc., a consulting firm that matches subject matter experts with investors. Connective requires experts to pledge in writing that they will not share any confidential company information. Through Connective, Pinot interviews Pierre Johann, head of technology at Advantage Securities Ltd. During their conversation, Johann excitedly claims that his latest improvements in hardware and software technology, completed only a week earlier, will give Advantage the fastest trading speed in the market. Johann also shares that although he is not sure, he believes Advantage will launch his technology in the current year. Pinot realizes the launch could help Advantage gain more market share and improve its margins. Based on Johann's information, she strongly recommends that her firm buy Advantage stock. Does Pinot violate Standard II(A) Material Nonpublic Information? ", "opts": ["Yes.", "No, since Johann pledged not to share private data.", "No, since Pinot hired Connective to source new public information from experts."], "ans": "A", "expl": "Members and Candidates who possess material nonpublic information that could affect the value of an investment\nmust not act or cause others to act on the information.\"\nStandard II(A) requires Members and Candidates to abstain from taking investment actions based on material nonpublic information (MNI)\nrelated to a security. Buying and selling of the security may occur only after the information is publicly disclosed. Members and Candidates who\ntrade using MNI might generate short-term profits, but their actions diminish the integrity of capital markets and the investment profession over the\nlong term.\nIn this scenario, Nadine Pinot violates the Standard by basing her recommendation on MNI. The new technology improvements could reasonably\nbe expected to move the company's stock price, making the information material. The information also has not been publicly disclosed by the\ncompany (Choices B and C).\nPinot must evaluate her interaction with Pierre Johann and determine whether it provided her with MNI. Pinot should conclude that the\ninformation she received is material, and since it has not been publicly disclosed, she should not use it in her recommendation.\nThings to remember:\nMembers and Candidates must abstain from taking investment actions based on material nonpublic information (MNI). An analyst cannot rely on\nassurance from an external or hired source that information is not MNI. Instead, the analyst must personally evaluate the situation and judge\nwhether the source inappropriately divulged MNI.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 72, "q": "Meiling Huang, CFA, is a well-respected independent real estate sell-side analyst. The investor relations manager of MNC Properties, a real estate company that went public this year, reaches out to Huang to see if she will write a report on MNC. MNC does not have significant cash on hand, so Huang agrees to be paid in stock options. After evaluating MNC, Huang believes that the company is undervalued and worthy of a \"buy\" rating. Huang writes her report on MNC and discloses that she was compensated by MNC but does not indicate the type of compensation. Does Huang most likely violate Standard I(B) Independence and Objectivity?", "opts": ["Yes", "No, since her report's conclusion reflected her opinion", "No, since she disclosed that she was compensated for her report"], "ans": "A", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in\ntheir professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or\nconsideration that reasonably could be expected to compromise their own or another's independence and objectivity.\"\nStandard I(B) Independence and Objectivity requires Members and Candidates to refuse any compensation that could reasonably be expected to\ncompromise their independence and objectivity. Sell-side analysts can be compensated by companies for writing research reports about the\ncompany. However, analysts must be careful not let the compensation affect their judgement. The report must reflect an independent opinion\nfollowing diligent and thorough research.\nCompensation from the company should not be linked to the conclusion of the report. Forms of compensation that violate that Standard are\nthose that can reasonably be expected to bias the analyst's opinion directly (eg, payments based on the rating) or indirectly (eg, stock options,\nwarrants). Best practice calls for a flat fee paid by the company. Analysts are required to disclose the compensation in their report, including the\nnature of the compensation, but disclosure does not offset a violation of accepting influential compensation (Choice C).\n(Choice B) Although the report reflected Huang's independent opinion, this opinion can be reasonably viewed as biased by clients due to the\nnature of the compensation (ie, stock options) for writing the report, thus violating he Standard.\nThings to remember:\nSell-side analysts can be compensated by companies for writing research reports about the company. However, compensation from the company\nshould not be linked to the conclusion of the report, which must reflect the analyst's independent opinion following diligent and thorough research.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 73, "q": "Enes Yilmaz, CFA, is a portfolio manager who is responsible for selecting emerging market subadvisors for a government pension fund. Yilmaz regularly evaluates third-party investment advisers and has developed an extensive due diligence checklist. While screening for new managers, he identifies a particularly strong-performing hedge fund that provides excellent diversification benefits to the pension portfolio. During his due diligence, Yilmaz discovers that: the fund is registered in an offshore jurisdiction with weak governance requirements, none of the firm's employees are CFA charterholders, and the company does not have an established code of ethics. The hedge fund's CEO explains that all employees are thoroughly vetted before hiring and that everyone at his firm \"knows right from wrong.\" Although Yilmaz is concerned about the lack of a code of ethics, he confirms that the fund complies with local laws and is in good standing with regulators; therefore, he decides to invest. Does Yilmaz's conduct comply with Standard V(A) Diligence and Reasonable Basis? ", "opts": ["No.", "Yes, since external advisory firms are not required to adopt a code of ethics.", "Yes, since he performed thorough due diligence and investing in the hedge fund is in the plan's best interest."], "ans": "A", "expl": "\"Members and Candidates must:\nExercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\nHave a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis states that Members and Candidates must perform reasonable and standardized due\ndiligence on external advisers. In addition to reviewing an adviser's investment process, strategy, performance presentation, and internal\ncontrols, Members and Candidates must review the adviser's code of ethics.\nIn this scenario, Enes Yilmaz conducts thorough due diligence and confirms that the hedge fund operates in compliance with local laws, as\nrequired by the Standard. However, he also discovers that the company does not have an established code of ethics. Without a code of ethics,\nYilmaz cannot be confident that the firm will adhere to a high level of ethical standards. Therefore, by investing with this manager, Yilmaz violates\nStandard V(A) Diligence and Reasonable Basis.\n(Choice B) Given the circumstances, the hedge fund is not required to conform to the Standards. However, before investing, Yilmaz must ensure\na minimum level of internal controls and decision-making protocols, including an established code of ethics.\n(Choice C) Yilmaz has a fiduciary duty to the pension plan participants but also must adhere to the higher ethical standards imposed on CFA\ncharterholders.\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis states that Members and Candidates must perform reasonable and standardized due diligence on\nexternal advisers. In addition to reviewing an adviser's investment process, strategy, performance presentation, and internal controls, Members\nand Candidates must review the adviser's code of ethics.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 74, "q": "Eugene Power, CFA, works with clients in Asia and the United States. During his flight home from Asia to the US, he is unexpectedly upgraded to first-class and sits next to his college roommate Norm Brownstone. While celebrating their chance meeting, they reminisce about college over several bottles of champagne. Power knows that as soon as he gets back to the US, he must make personal trades, interview a potential client on the phone, and write an investment policy statement (IPS) for a client before getting some much-needed sleep. Still intoxicated when he lands in the early morning, Power knows he should not drive and debates whether to hire a car for a short ride to his office or a longer ride to his home. Power least likely violates Standard I(D) Misconduct if he:", "opts": ["writes the client IPS at the firm.", "executes the personal trades at home.", "interviews the potential client from home."], "ans": "B", "expl": "\"Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit or\ncommit any act that reflects adversely on their professional reputation, integrity, or competence\"\nUnder Standard I(D) Misconduct, Members and Candidates must refrain from conduct that diminishes the integrity, reputation, or competence\nof the industry, a firm, or themselves. Although the CFA Institute recommends that Members and Candidates always act responsibly, the\nStandard focuses on how a Member's behavior impacts professional activities. The integrity of the profession is founded on the belief that\nMembers and Candidates act in a trustworthy manner; otherwise, the industry's overall reputation is diminished.\nIn this scenario, to violate the Standard, Eugene Power must be intoxicated while working in a professional capacity. He does not violate the\nStandard by being intoxicated and making personal trades. The location of his work is irrelevant, but the nature of the work matters. By itself,\nintoxication is not a violation of the Standard, but carrying out professional duties—such as interviewing potential clients or writing an investment\npolicy statement while intoxicated—calls into question Power's judgment and competence and violates the Standard (Choices A and C).\nThings to remember:\nMembers and Candidates must refrain from conduct that diminishes the reputation of the industry, a firm, or themselves. Although CFA Institute\nprefers that Members always act responsibly, the Standard focuses on how a Member's behavior impacts professional activities. By itself,\nintoxication is not a violation of the Standard, but carrying out professional duties while intoxicated calls into question the analyst's judgment and\nviolates the Standard.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 75, "q": "Stella Smith, CFA, works for Aqua Investment Consulting. She is invited to share her economic outlook at a conference hosted by Zenat Securities Corp., an investment management firm used by Aqua. Zenat pays all speakers' travel expenses and entices speakers by offering a free spa day during the conference. Smith most likely violates Standard I(B) Independence and Objectivity if she accepts Zenat's offer for:", "opts": ["only her travel.", "only the spa day.", "both her travel and the spa day."], "ans": "B", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and\nobjectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift,\nbenefit, compensation, or consideration that reasonably could be expected to compromise their own or another's\nindependence and objectivity.\"\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid actions that compromise their independence and\nobjectivity or create conflicts of interest. In many cases, Members and Candidates should refrain from accepting payment for travel expenses\nto avoid any appearance of compromised independence or objectivity.\nIn this scenario, Stella Smith has been invited to speak on the economic outlook at an investment conference hosted by Zenat Securities Corp.\nSince she is not making any investment recommendations or endorsing Zenat in any way, accepting payment to cover her travel expenses in this\ncase is not likely to compromise her independence or objectivity (Choices A and C).\nHowever, the spa day can be considered an extravagant gift. Since Zenat has a vendor-client relationship with Smith's firm, Aqua Investment\nConsulting, this gift might be seen as an attempt to compromise Smith's independence and objectivity in making investment recommendations\nto Aqua's clients.\nThings to remember:\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid actions that compromise their independence and\nobjectivity. Accepting compensation or gifts other than travel expenses from firms when there is a vendor-client relationship may compromise\nindependence and objectivity with regard to investment recommendations.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 76, "q": "Nancy Bender, CFA, manages multigenerational clientele for Arch Investments, Inc. Bender hosts a social media page that is exclusively for clients. In January 20X5, she posts her quarterly investment review to the social media page, which states: \"Wishing everyone a Happy New Year. In 20X5, we expect monetary and fiscal policies will benefit the overall market and your investments. If you have any questions, please let us know as we are here to help you. Remember, as we discussed, do not post confidential information to this social media page.\" Leo Faber, one of Bender's clients, responds to Bender's social media review with the following post: \"Nancy: Martha and I want to set up trusts of $1 million for each of our grandchildren. Also, please see the attached tax forms detailing our income for 20X4. Please forward this to your tax person we used last year.\" Bender immediately deletes Faber's post after reading it. According to Standard III(E) Preservation of Confidentiality, does Bender most likely violate the Standard? ", "opts": ["No", "Yes, since Bender should prevent, not delete, Faber's post.", "Yes, since Bender uses social media pages to communicate with clients."], "ans": "A", "expl": "\"Members and Candidates must keep information about current, former, and prospective clients confidential\nunless:\nThe information concerns illegal activities on the part of the client or prospective client,\nDisclosure is required by law, or\nThe client or prospective client permits disclosure of the information.\"\nStandard III (E) Preservation of Confidentiality requires that Members and Candidates not disclose a client's information unless is it required by\nlaw or if the client gives explicit permission. Conservative application of this Standard suggests that analysts should not disclose anything that\nthe client may give or share with them unless the client gives authorization. However, a client may accidentally share communications intended\nfor only the advisor with others.\nTo comply with the Standard, advisors must try to prevent accidental disclosures by instructing clients on the proper use of social media. Since\nBender reiterated instructions regarding the use of her social media page, she does not violate the Standard; immediately removing Faber's post\nalso would align with meeting the Standard (Choice B).\n(Choice C) The use of social media is common, and its use is not an immediate violation. If an advisor chooses to contact clients using social\nmedia, the Member or Candidate must give clients clear instructions on its use to comply with the Standard.\nThings to remember:\nMembers must keep client information confidential unless they are required by law to disclose it or if the client gives permission. If social media is\ninvolved, a client might breach confidentiality accidentally. If an advisor uses social media to communicate with clients, the advisor must give\nclients clear instructions on how to best use social media to protect their confidentiality.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 77, "q": "The CEO of PrimeHealth, Inc., a publicly traded pharmaceutical company, hosted a conference call for approximately 15 analysts from 10 different investment banks. One of the listeners was Paula Pressly, Level II CFA candidate. The CEO of PrimeHealth announces that the company has received regulatory approval to sell its latest cancer drug. The CEO tells the assembled participants that he anticipates additional revenues of $3 billion this year, which he estimates will grow at 10% per year. After the call, but before the CEO's information has been widely distributed, Pressly buys 100 shares of PrimeHealth for her account. At the same time, she also calls her father and advises him to buy PrimeHealth stock, but he does not act on her advice. Which of the following most accurately describes any violations by Pressly of Standard II(A) Material Nonpublic Information?", "opts": ["Pressly violated the Standard only by purchasing the stock.", "Pressly violated the Standard only by recommending that her father purchase the stock.", "Pressly violated the Standard both by her purchase and recommending that her father purchase the stock."], "ans": "C", "expl": "\"Members and Candidates who possess material nonpublic information that could affect the value of an\ninvestment must not act or cause others to act on the information.\"\nStandard II(A) Material Nonpublic Information prohibits members and candidates from trading on material nonpublic information. \"Material\"\nrefers to information that would be expected to cause a significant change in the market price of a security. \"Nonpublic\" means that the\ninformation has not been disseminated to the general investing marketplace. Information that is given only to a limited group of investors, such as\nto analysts on a conference call, does not make that information public.\nThe Standard also prohibits members and candidates from recommending investments to others if the recommendation is based on material\nnonpublic information. It is irrelevant whether the recipient acts on the recommendation.\nPressly violated the Standard both by purchasing the stock and advising her father to buy it. The CEO's information is clearly material since the\nexpected boost to Prime Health's revenues from regulatory approval of t
