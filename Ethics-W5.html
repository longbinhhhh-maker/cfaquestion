curate, and complete record of their\nperformance. To avoid misrepresentation, a manager, firm, portfolio, or composite must provide full disclosure of all aspects of performance to all\nclients, prospective clients, and prospective employers.\nIf the details are fully disclosed, the Standard allows the presentation of performance information from prior employers, accounts managed by\nmultiple people, and simulations. Performance data from a prior employer cannot be used without written permission from the employer. In this\nscenario, Erik Johansen receives written approval from his prior employer, Henderson Bank, before presenting data on the returns he achieved\nthere as a portfolio manager. The marketing brochure fully discloses both this background and the fact that Claire Olsen's model returns are\nsimulated, so the Standard is not being violated (Choices B and C).\nThings to remember:\nPerformance reporting should communicate fair, accurate, and complete information. Standard III(D) Performance Presentation calls for providing\nfull disclosure of all aspects of performance to avoid misrepresentation.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 24, "q": "Aline Costa, CFA, is a financial advisor for Solar Bank. At a conference, Costa meets Juanita Carvalho, a portfolio manager for Lunar Financial. Carvalho tells Costa about a propriety quantitative model developed by Lunar that aims to predict interest rate changes. Costa reads Lunar's sales literature on the model to understand how it works, its assumptions, and its testing parameters, which included both extreme positive and negative scenarios. Of the following, Costa can most appropriately begin integrating the model into her research process:", "opts": ["immediately.", "after thoroughly testing the model herself.", "after taking the time to learn the technical aspects of the model."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires Members and Candidates that are advisors to conduct thorough due diligence when\nanalyzing investments. The Standard requires that the due diligence on quantitative models be as thorough as all other aspects of the\ninvestment recommendation process. The Member or Candidate must:\nunderstand how the model works and be able to explain it to clients,\nunderstand the model's assumptions and limitations, and\nthoroughly test the model.\nEven if the model was already tested by third-party developers, Members and Candidates should test the model before incorporating it into their\nresearch process or recommendations. This ensures that the model was properly tested (Choice A). Data used in testing should encompass all\nperformance and volatility expectations.\n(Choice C) The model's developers must understand all the technical aspects of the model (eg, equations, variables). However, users are not\nrequired to have as deep an understanding, as long as they understand its assumptions and limitations and are able to explain the model to\nclients.\nThings to remember:\nWhen Members and Candidates use quantitative models as part of their investment process, the Standard requires that the due diligence on the\nmodel be as thorough as all other aspects of the process. The model's users must understand how the model works well enough to explain it to\nclients and to thoroughly test the model.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 25, "q": "Kathy Harriet, CFA, is the chief investment officer at PPG Investments. Harriet hosts a video meeting where she speaks to all employees. During her live presentation, Harriet discusses PPG's top holdings, including Responsive Market Tech, Inc. (RMT). Harriet explains why RMT is a top holding: existing barriers to entry and the current competitive landscape create a rare opportunity for accelerated earnings growth. Sidney Fletcher, CFA and PPG employee, acts on Harriet's explanation and purchases 100,000 shares of RMT for PPG's trading account during the meeting. After Fletcher's trades, RMT's price has not changed. According to PPG's policies, Harriet sends the recorded meeting and its transcript to clients and employees right after the meeting. According to Standard VI(B) Priority of Transactions, did Fletcher most likely comply with the Standard? ", "opts": ["No.", "Yes, since Fletcher did not impact RMT's price.", "Yes, since Harriet sent the transcript directly after the meeting."], "ans": "A", "expl": "Investment transactions for clients and employers must have priority over investment transactions in which a\nMember or Candidate is the beneficial owner\nStandard VI(B) Priority of Transactions requires Members and Candidates to place clients' interests ahead of their own. The Standard\nmandates that, for a given security, the firm's or employee's trades must be placed after client trades. There is no specific waiting period, but\nfirms must give clients a reasonable amount of time to act on recommendations.\nSidney Fletcher violated the Standard by trading Responsive Market Tech, Inc. for the firm's account before PPG Investments' clients had time to\nact upon Kathy Harriet's advice. Fletcher should have postponed trading until clients could reasonably have acted on Harriet's recommendation.\n(Choice B) The resulting price after Fletcher's trade does not mitigate his violation. Fletcher is not exempted from violating the Standard just for\nhaving no price impact.\n(Choice C) Harriet complied by delivering the meeting transcript and her recommendation as soon as possible, but Fletcher should have placed\nthe firm's trades after clients could reasonably be expected to receive and use the recommendation.\nThings to remember:\nStandard VI(B) Priority of Transactions governs how Members and Candidates place clients' interests ahead of their own. For a given security, a\nfirm's or an employee's trades must be placed after clients' trades. Clients must be given a reasonable amount of time to act on a\nrecommendation before a firm may trade for itself.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 26, "q": "Rahul Agarwal, CFA, is the Chief Investment Officer of Bagh Capital. He is having lunch with a group of prospective clients and passes out a summary of the company's performance. The summary mentions that the firm was able to generate returns of 25% last year, 18% annualized over the past three years, and 15% annualized over the past five years. The returns exclude several portfolios that Bagh closed last year due to underperformance. The summary does not mention the exclusions but notes that it is limited in nature and that a detailed presentation is available upon request. By distributing this summary to clients, does Agarwal most likely violate Standard III(D) Performance Presentation?", "opts": ["No", "Yes, by excluding the closed portfolios", "Yes, by distributing only the summary and not the detailed presentation"], "ans": "B", "expl": "\"When communicating investment performance information, Members and Candidates must make reasonable\nefforts to ensure that this information is fair, accurate, and complete.\"\nStandard III(D) Performance Presentation requires Members and Candidates to provide a fair, accurate, and complete performance record.\nMisrepresenting performance is a violation of the Standard, whether it is in the measurement or presentation. Providing a complete performance\nrecord entails including all pertinent portfolios or composites when calculating the performance of a firm.\nRahul Agarwal violates the Standard by excluding terminated portfolios from the firm's performance and not making any note that they were\nexcluded (Choice A). By excluding terminated portfolios, Agarwal misrepresents Bagh Capital's performance and fails to provide the prospective\nclients with an accurate and complete picture of historical returns.\n(Choice C) Distributing a summary of performance is allowed under the Standard. Best practices call for summaries to include a note about the\nlimited nature of the presentation.\nThings to remember:\nPerformance reporting should communicate fair, accurate, and complete information. This entails including all pertinent portfolios or composites\nwhen calculating the performance of a firm. By excluding terminated portfolios, Agarwal violates the Standard by deliberately presenting\nincomplete information.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 27, "q": "Bull Advisors, based in Country Y, expanded its operations to Country X, where securities laws and regulations are less strict than either CFA Institute's Code and Standards or Country Y's laws and regulations. One of Bull's advisors, Joseph Telluci, CFA, travels to Country X to meet with a client. In a rush to meet with the client before she leaves for vacation, Telluci does not familiarize himself with Country X's securities laws and regulations. After the meeting, he begins the investment management process on behalf of the client based on the laws, regulations, and rules of Country Y and the Code and Standards. Has Telluci most likely violated Standard I(A) Knowledge of the Law?", "opts": ["Yes.", "No, since he follows the laws of Country Y.", "No, since he adheres to CFA Institute's Standards of Professional Conduct."], "ans": "A", "expl": "\"Members and Candidates must understand and comply with all applicable laws, rules, and regulations (including the CFA Institute Code of Ethics\nand Standards of Professional Conduct) of any government, regulatory organization, licensing agency, or professional association governing their\nprofessional activities. In the event of conflict, Members and Candidates must comply with the more strict law, rule, or regulation. Members and\nCandidates must not knowingly participate or assist in and must dissociate from any violation of such laws, rules, or regulations.\"\nStandard I(A) Knowledge of the Law requires members and candidates to understand local laws. When members or candidates do business\nin more than one country, they are required to know and understand both the Standards of Professional Conduct and the laws and regulations\nof each country. In all professional activities, they must follow the strictest of the applicable rules.\nTelluci does business in both Country Y (where Bull Advisors is based) and Country X (where the new client resides). Before doing business with\nthe client, Telluci must be familiar with the set of securities laws and regulations in Country X—in addition to those of Country Y and the Code and\nStandards—so that he knows which rules to apply if a conflict arises. Without this knowledge, Telluci could not make an informed judgment.\n(Choices B and C) Although the rules of Country X are less strict than those of Country Y or the Code and Standards, Telluci violated Standard\nI(A) by not familiarizing himself with and understanding all the applicable laws and regulations.\nThings to remember:\nStandard I(A) Knowledge of the Law requires members and candidates to understand the laws and regulations in any country where they engage\nin professional activities, as well as the Code and Standards. In all cases, the strictest of these laws, rules, and regulations must be followed.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 28, "q": "Sarah Cohen, CFA, is a portfolio manager at Mountain Peak Capital (MPC) and manages the firm's multi-cap equity growth fund. Cohen often directs the firm's trading desk to place orders through certain brokerage firms that have assisted her in idea generation or in investment decision- making. Cohen has recently agreed to enter into a new soft dollar relationship with Large-Cap Capital (LCC) for research services. Cohen sends a large order for a thinly traded small-cap stock to the firm's trading desk. Cohen usually prefers small-cap stock trades to be directed to Small-Cap Specialists, Inc. (SCSI), as they are better able to source liquidity (ie, find buyers and sellers) to fill these trades than most of their competitors. The trader suggests the order be routed through LCC to help satisfy MPC's new soft dollar commitment. LCC can execute the order, but it would likely be at market prices, and the large order size will almost certainly negatively affect the execution. After discussing the situation with the firm's trader, Cohen instructs the trader to send the order to LCC. Cohen most likely violates Standard III(A) Loyalty, Prudence, and Care, by:", "opts": ["entering into a soft dollar arrangement.", "failing to achieve best price and execution.", "actively directing orders to specific brokerage firms."], "ans": "B", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients' best\ninterests before their employer's or their own interests.\"\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to seek best price and best execution for client trades. \"Best\nprice\" and \"best execution\" do not necessarily mean the lowest trading commission, but commissions must be commensurate with the value\nreceived. Examples of sell-side factors to consider for best price and execution include:\nIdea generation\nResearch and analysis\nOverall execution price\nCommission paid\nCharterholders must be especially diligent in applying best price and execution standards when there are soft dollar arrangements. Soft dollar\nbrokerage is the practice of using a portion of brokerage commissions to pay for investment research. Such research is considered an asset of\nthe client, not the manager, and must be used to benefit the client.\nIn this instance, Sarah Cohen should have directed the large order of thinly traded small-cap stock to the firm that could best execute the trade,\nwhich is SCSI. She violated the Standard by failing to obtain best price and best execution for the express purpose of satisfying the firm's soft\ndollar commitment and not for the client's benefit.\n(Choice A) Soft dollar brokerage is not prohibited by the Standards, but the manager has a duty of loyalty to use this asset for the exclusive\nbenefit of the client.\n(Choice C) Directing trading activity to firms that provide decision-making value to the manager is not prohibited by the Standards.\nThings to remember:\nStandard III(A) Loyalty, Prudence, and Care requires that the clients' best interest be placed before the employer's or the analyst's own interests.\nMembers and Candidates are obligated to seek best price and best execution, particularly in the context of soft dollar arrangements.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 29, "q": "Dimitri Federov, CFA, is a financial adviser for Arrow Financial. One of Federov's clients, Natasha Popova, offers Federov the use of her vacation home next January if her portfolio achieves 10% return this year. Federov accepts Popova's offer without disclosing it to Arrow since it is only a nonmonetary offer. Federov later joins the Safe Bank board of directors, which he discloses to Arrow. As part of his compensation, Federov will receive Safe stock options for each of his clients that he enrolls as a client of Safe's trust services. Federov does not disclose this arrangement to Arrow since he does not have any clients who currently need Safe's trust services and has not recommended them to anyone. Federov most likely violated the Standards:", "opts": ["only by accepting Popova's offer without disclosing it to Arrow.", "only by failing to disclose the options compensation from Safe.", "both by accepting Popova's offer and failing to disclose the options compensation from Safe."], "ans": "C", "expl": "\"Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably\nbe expected to create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved.\"\nStandard IV(B) Additional Compensation Arrangements allows additional compensation agreements with third parties, including clients. However,\nMembers and Candidates must disclose such agreements in full and obtain written permission from all parties involved before accepting\ncompensation that could be reasonably seen as creating a conflict with their employers. Gifts, benefits, and other compensation do not need to\nbe monetary to require approval.\nIn this scenario, Dimitri Federov's actions violate the Standard in both arrangements. His options compensation agreement with Safe Bank must\nbe disclosed to Arrow Financial in full before he accepts it. The fact that he has not recommended Safe's trust services to his clients and has not\nreceived any options does not excuse him from disclosing the arrangement to Arrow, as it could create a conflict of interest later (Choice A).\nLikewise, his compensation agreement with Natasha Popova must be approved in writing by Arrow before he accepts it since the Standard applies\nto both monetary and nonmonetary compensation (Choice B).\nThings to remember:\nStandard IV(B) requires Members and Candidates to disclose third-party compensation agreements in full and obtain written permission before\naccepting them. Such arrangements can create a conflict with an employer's interest. The Standard applies to both monetary and nonmonetary\ncompensation.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 30, "q": "Sonja Hossi, CFA, recently started her own investment research firm, Hossi Investor Research (HIR). Throughout her career, Hossi has been a well-known analyst in the paper industry. The chief financial officer (CFO) of Metsa, a company in the pulp sector of the industry, contacts Hossi and asks her if HIR will publish a Metsa-prepared research report that recommends Metsa as a \"buy\"; HIR currently rates Metsa as a \"hold.\" The CFO offers to pay Hossi her standard flat fee to publish the report under her name. After conducting her own due diligence, Hossi believes that the upgrade is appropriate. She makes some minor changes to the report's wording, but otherwise publishes it \"as is\" with herself as author and recommending Metsa as a \"buy.\" She also discloses that she was paid by Metsa. Has Hossi most likely violated Standard I(C) Misrepresentation?", "opts": ["No", "Yes, by accepting her full fee to issue the report", "Yes, by representing the research report as her original work"], "ans": "C", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment analysis,\nrecommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation concerns actions that may undermine investor trust in the integrity of the profession and financial markets. The\nStandard applies whether the information is prepared for clients, colleagues, or the public. Misrepresentation can include:\nPlagiarism: quoting information without acknowledgement or citation\nOmission: presenting incomplete information or data in order to mislead\nExaggeration: inflating professional credentials or performance results\nHere, Hossi violates the Standard by claiming she authored the report (ie, plagiarism). The slight changes in wording she made are not enough to\nmake it her work. Although the chief financial officer granted verbal permission to use the report, this does not absolve Hossi of the need to\ndisclose the original source (Choice A).\n(Choice B) There is nothing in the Standards that prevents Hossi from collecting her full fee for this assignment. By collecting only a flat fee that\nwas neither based on her recommendation nor tied to the client's future stock performance, and by disclosing who paid for the report, Hossi has\nfollowed the recommendations under Standard I(B) Independence and Objectivity.\nThings to remember:\nStandard I(C) Misrepresentation applies to situations in which a candidate or member knowingly misrepresents or misuses information. The\nStandard applies whether information is prepared for clients, colleagues, or the public. Misrepresentation can include plagiarism, omission, or\nexaggeration.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 31, "q": "Vanessa Pinto, CFA, an analyst at Force One Securities, uses fundamental research data supplied by Force One when she considers updating her investment recommendation on the stock of Bear Equipment, Inc. Pinto also uses other sources, including a local college library, respected investment commentary, and blogs from other research firms. After weeks of detailed research, Pinto makes no changes to her investment recommendation on Bear Equipment. According to Standard V(C) Record Retention, for which data must Pinto most likely keep appropriate records?", "opts": ["Only data from independent sources", "None, since her recommendation is unchanged", "Data provided by Force One and all independent sources"], "ans": "C", "expl": "\"Members and Candidates must develop and maintain appropriate records to support their investment analyses,\nrecommendations, actions, and other investment-related communications with clients and prospective clients.\"\nTo comply with Standard V(C), Members and Candidates must keep well-organized records that demonstrate the extent of their investigative\nefforts and the motives for their recommendations. Analysts must preserve the data used in their investigations regardless of whether the\nresearch results in changes to previous recommendations. Vanessa Pinto is required to save the data and records obtained from all sources,\nincluding her employer (Choices A and B).\nThings to remember:\nMembers and Candidates must keep well-organized records that demonstrate the extent of their investigative efforts and the motives for their\nrecommendations. This requirement applies even when no changes are made to previous recommendations.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 32, "q": "Chester Hall, CFA, manages a small hedge fund called Taurus Group. Hall is currently seeking additional investors to grow assets under management and is approached by Kathy Walker, CFA, who manages a fund of hedge funds. Walker tells Hall that being included in Walker's fund will increase Taurus's exposure, which in turn would increase assets. However, there is intense competition to be included in the fund of hedge funds platform, and many hedge funds are under consideration. Hall offers Walker box seats to a high-profile football game so they can further discuss Taurus. Walker declines, telling Hall that she doesn't accept personal gifts. Walker then mentions that her husband runs a charity that is having a fundraiser next month and says Hall should buy tickets so that they can discuss business at the event. The Member(s) that most likely violates Standard I(B) Independence and Objectivity is:", "opts": ["only Hall.", "only Walker.", "both Hall and Walker."], "ans": "C", "expl": "Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their\nprofessional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or\nconsideration that reasonably could be expected to compromise their own or another's independence and objectivity.\nStandard I(B) Independence and Objectivity focuses on Members and Candidates maintaining their independence and objectivity so that their\nactions and advice to clients are unaffected by conflicts of interest. The Standard applies to entities or individuals that seek to influence the\ndecision-making process to the detriment of clients but does not apply to gifts from clients themselves.\nDuring the manager selection process, accepting, soliciting, or offering any gifts or donations that can be seen as compromising\nindependence and objectivity violates the Standard. The gift or donation does not need to be monetary or be directed at the manager. Gifts to\nfavorite charities or political candidates also violate the Standard.\nIn this scenario, both Hall and Walker violate the Standard. Walker, by suggesting that Hall purchase tickets to her husband's charity fundraiser, is\nsoliciting a gift from Hall and attempting to influence the fund of hedge fund's decision-making process. A donation to the charity run by Walker's\nhusband may be seen as favorable to her and should be treated as a personal gift for the purposes of the Standard (Choice A). Hall, by offering\nbox seats to a high-profile football game, is attempting to influence Walker's decision and gain an unfair advantage in the fund selection process\n(Choice B).\nThings to remember:\nStandard I(B) Independence and Objectivity focuses on Members and Candidates maintaining their independence and objectivity. During the\nmanager selection process, soliciting or offering any gifts or donations that may be seen as compromising independence and objectivity violates\nthe Standard.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 33, "q": "Shreya Batra, CFA, is an equity analyst for S&K Financial (SKF). SKF creates an online forum solely for its paying clients and encourages its analysts to post their research reports following public dissemination so clients can discuss the reports among themselves. Batra recommends that her clients join the forum so they can take part in the discussions. However, she warns each client that posts on the forum can be seen by any SFK client and that they should avoid posting confidential or sensitive information. Following the release of a new report about Fox Property Group, Batra posts the report to SFK's forum. One client posts, \"This has really got me thinking. I should invest in Fox when I sell my company next year. We can discuss it during our meeting next month.\" Batra knows the sale of the client's company is confidential and deletes the post as soon as she sees it, an hour after it was posted. Has Batra most likely violated Standard III(E) Preservation of Confidentiality?", "opts": ["Yes", "No, since the client – not Batra – posted the information on the forum", "No, since Batra provided adequate warning to clients about posting confidential information"], "ans": "C", "expl": "\"Members and Candidates must keep information about current, former, and prospective clients confidential\nunless:\n1. The information concerns illegal activities on the part of the client or prospective client,\n2. Disclosure is required by law, or\n3. The client or prospective client permits disclosure of the information.\"\nStandard III(E) Preservation of Confidentiality addresses the protection of clients' information. It is required that a Member or Candidate preserve\nthe confidentiality of information received while conducting business with the client. The Standard encompasses information shared in any\nform, including electronic media.\nThe increase of electronic communication (eg, email, social media, online forums) creates situations that can result in accidental dissemination of\nclient information. Members and Candidates should take steps to limit the likelihood of accidental leaks and to follow each firms' procedures on\nelectronic information communication and storage. An accidental leak of confidential information does not constitute a violation of the Standard so\nlong as reasonable efforts were taken to prevent the leak. However, without taking reasonable steps, a Member or Candidate can violate the\nStandard even if clients leak the information themselves (Choice B).\nIn this scenario, Shreya Batra warned clients that information shared on social media would be public and that they should avoid sharing anything\nconfidential. As soon as she saw the post of confidential client information, she deleted the post. Since she took reasonable steps to avoid the\ndissemination of confidential information, she did not violate the Standard (Choice A).\nThings to remember:\nStandard III(E) Preservation of Confidentiality requires a Member or Candidate to preserve the confidentiality of information received while\nconducting business with a client. Members and Candidates should take steps to limit the likelihood of accidental leaks through electronic\ncommunication and to follow each firms' procedures on electronic information communication and storage.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 34, "q": "Krishan Patel, CFA, a senior analyst at CityStock, conducts due diligence of Specialty Products Corp. (SPC) and determines that it is a compelling buy and that the stock price will soon increase. Patel hesitates to recommend SPC since CityStock places a five-day blackout period on all recommended stocks. Instead, he purchases 300 shares of SPC for his account without sharing his analysis and recommendation with CityStock. SPC's price subsequently drops by 30%. Patel reviews his analysis and, still convinced that SPC is a great buying opportunity, submits his analysis and buy recommendation to the investment committee at CityStock. Patel most likely violates Standard VI(B) Priority of Transactions:", "opts": ["only by purchasing SPC.", "only by withholding his recommendation.", "both by withholding his recommendation and purchasing SPC."], "ans": "C", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions in which a Member or\nCandidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions specifies the responsibility of members and candidates to place the interests of clients and employers\nahead of their own. An application of this Standard demands that personal trades for a given security be placed after clients' trades so as not to\nharm the clients' financial interests. Withholding an investment recommendation to avoid this trading restriction violates the Standard.\nSince Patel has willfully not acted in his clients' best interests, his actions violate the Standard, even when his unshared determination proves to\nbe wrong (ie, the stock declines by 30%). The Standard is violated by Patel withholding his recommendation to purchase Specialty Products\nCorp. before clients can act (Choices A and B).\nThings to remember:\nStandard VI(B) Priority of Transactions requires that personal trades of a given security be placed after clients' trades so as not to harm the clients'\nfinancial interests. Members and candidates violate this Standard by avoiding or delaying recommendations with an intent to make personal\ntrades first.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 35, "q": "Margareta Schiffrin, CFA, is an investment adviser at a firm that advises high-net-worth clients and has adopted the CFA Institute's Code and Standards. Schiffrin informs the firm's compliance director that she just attended the World Cup alpine ski finals as a guest of one of the firm's long-standing clients, who had been pleased with his portfolio's superior performance. Regarding Standard I(B) Independence and Objectivity, did Schiffrin most likely violate the Standard? ", "opts": ["No", "Yes, by accepting the gift", "Yes, by reporting the gift after she accepted it"], "ans": "A", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and\nobjectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift,\nbenefit, compensation, or consideration that reasonably could be expected to compromise their own or another's\nindependence and objectivity.\"\nStandard I(B) Independence and Objectivity focuses on avoiding any actions that would compromise the independence and objectivity of an\ninvestment professional. A member or candidate is prohibited from accepting or offering a compromise to independence and objectivity.\nInducements to do so may come from many sources (eg, employers, vendors, or firms that are the subject of research). They may take many\nforms (eg, offers of gifts, entertainment, donations, or employment-related compensation).\nGifts from clients with established compensation arrangements are not prohibited (Choice B). They are considered supplementary\ncompensation and unlikely to threaten the independence and objectivity of the adviser.\nGifts from clients must be reported so that the employer can assess whether independence may have been compromised or firm policies\nviolated. Such gifts should be reported before they are accepted, but they may be reported after acceptance without violating the Standard\n(Choice C).\nThings to remember:\nMembers and candidates should avoid any actions that would compromise the independence and objectivity of an investment professional.\nInducements to do so may come from many sources and take many forms. Gifts from clients are not prohibited but must be reported, preferably\nbefore acceptance.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 36, "q": "Stephanie Chang, CFA, is a financial advisor to individual clients for SMF Investments (SMF). She also manages the account of her father, who is a client of SMF. SMF secures a portion of shares for the oversubscribed initial public offering (IPO) of Trek Corp and assigns the IPO shares to its financial advisors to allocate to their clients' portfolios. After reviewing Trek's suitability for her clients' portfolios, Chang concludes that she would allocate 2,500 shares to her clients, including 100 to her father. She also likes Trek for her personal portfolio and wants to allocate 300 shares for herself. However, she receives only 2,000 shares of Trek from SMF. To avoid violating Standard III(B) Fair Dealing, Chang should most likely allocate IPO shares to her nonfamilial clients:", "opts": ["and herself, but not her father.", "and her father, but not herself.", "but not to herself or her father."], "ans": "B", "expl": "\"Members and Candidates must deal fairly and objectively with all clients when providing investment analysis,\nmaking investment recommendations, taking investment action, or engaging in other professional activities.\"\nStandard III(B) Fair Dealing specifies that Members and Candidates must treat all clients fairly. Investment actions must be taken based on\neach client's individual investment objectives and circumstances.\nWhen allocating shares of initial public offerings (IPOs), Members and Candidates should distribute the shares to all clients for which the\noffering is suitable. If an IPO is oversubscribed, best practices dictate that the allocated shares be prorated for all applicable clients. This\nincludes family members who are clients. Further, when issues are oversubscribed, managers should forgo any shares for themselves or\nfamily members who are not clients in order to provide as many shares to clients as possible.\nTo comply with Standard III(B), since Stephanie Chang receives fewer Trek Corp shares from SMF Investments than planned, she should allocate\nshares only to her SMF clients and not to herself. Since Chang's father is an SMF client, he should not be treated any differently than other SMF\nclients despite being family and should receive shares. However, since Chang did not receive enough shares to fulfill her request for clients'\nportfolios, she should not keep any shares for herself (Choices A and C).\nThings to remember:\nStandard III(B) Fair Dealing focuses on managers' responsibility to treat all clients fairly, based on each client's individual investment objectives\nand circumstances. For initial public offerings (IPOs), Members and Candidates should allocate shares to all clients deemed suitable. For\noversubscribed IPOs, Members and Candidates should allocate shares to clients, including family clients, on a pro rata basis, but forgo shares for\nthemselves so clients can receive more shares.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 37, "q": "Gareth Irwin, CFA, recently retired after 30 years as a portfolio manager with a large asset-management firm. Irwin is interested in obtaining freelance investment consulting engagements and creates a biography that lists his accomplishments. Two entries in the biography are: Entry 1: \"As a CFA Charterholder for over 30 years, I have consistently achieved above-market returns\" Entry 2: \"I am a retired CFA Charterholder.\" Irwin has sent a check to CFA Institute to pay for the upcoming year's membership dues. He indicates on the check that he is paying as a \"retired Charterholder\" but has not completed any other membership paperwork. Based only on this information, which of the following concerning Irwin's biography most likely complies with Standard VII(B) Reference to CFA Institute, the CFA designation, and the CFA Program?", "opts": ["Only Entry 1", "Only Entry 2", "Neither Entry 1 nor Entry 2"], "ans": "C", "expl": "When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA Program, Members\nand Candidates must not misrepresent or exaggerate the meaning or implications of membership in CFA Institute, holding the\nCFA designation, or candidacy in the CFA Program.\nStandard VII(B) addresses how Members and Candidates can use the CFA designation in written communications, which include Irwin's\nbiography. The Standard applies to both active and retired Members.\nGareth Irwin can refer to himself as a retired Charterholder in his biography only if he is still a member of CFA Institute. Membership requires that\nhe pay the annual membership dues and complete the Professional Conduct Statement Agreement. He has not submitted anything other\nthan his dues payment. Therefore, he cannot use the CFA designation in any capacity until he completes the Professional Conduct Statement and\nCFA Institute accepts it (Choice B).\nStandard VII(B) also governs how a Member or Candidate can use the CFA designation. A Member can state facts but cannot misrepresent or\nexaggerate the meaning of being a Charterholder. In this question, Irwin states that he achieved \"above-market returns\" but offers neither context\n(eg, how he defines the market) nor quantitative evidence to support the claim. As such, Irwin's statement is not a statement of fact; using it in the\nbiography misrepresents the meaning of the designation (Choice A).\nThings to remember:\nA Charterholder can indicate a \"retired\" status only if still a member of CFA Institute, which requires payment of membership dues and filing all\nrequired paperwork to use the designation. Members and Candidates can assert statements of fact, but the Standard does not permit Members or\nCandidates to exaggerate or misrepresent the meaning of being a Charterholder.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 38, "q": "Kevin Smith, Level I CFA Candidate, has just finished the exam. Outside the test center, he posts on a popular CFA social media blog, \"The Level I CFA mocks are a joke!\", \"Be sure to memorize ALL the convexity formulas!!!\" Hamza Bennani, who is also a Level I CFA Candidate, immediately responds by stating \"I hope I passed! The CFA Institute needs to provide better exam prep materials as there were too many questions that I wasn't prepared for!\" Based on Standard VII(A) Conduct as Participants in CFA Institute Programs, most likely:", "opts": ["only Smith violated the Standard.", "only Bennani violated the Standard.", "both Bennani and Smith violated the Standard."], "ans": "A", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or\nintegrity of CFA Institute or the CFA designation or the integrity, validity, or security of CFA Institute\nprograms.\"\nStandard VII(A) Conduct as Participants in CFA Institute Programs mandates that Members and Candidates maintain the reputation, integrity,\nvalidity, and security of CFA Institute exams and programs. The Standard prohibits behavior that would compromise the public's confidence in the\nlevel of merit needed to achieve a CFA charter.\nCandidates taking the exam must sign the Candidate Pledge, which identifies behaviors that are prohibited before, during, and after the test.\nThese behaviors include:\ngiving or receiving information about the exam before or during the exam, and\nproviding information regarding the exam to others after the exam, including broad topical areas and formulas tested, until that\ninformation is publicly released by CFA Institute.\nIn this instance, Kevin Smith violated the Standard by providing specific information regarding which formulas were tested. However, Hamza\nBennani did not violate the Standard as he made a very generic comment without mentioning any areas of study or exam content.\n(Choices B and C) Members and Candidates can express opinions about the exams or the CFA Institute without violating the Standard as long\nas the opinions do not reveal specific information about the exams. Smith and Bennani did not violate the Standard by criticizing the CFA Institute.\nThings to remember:\nStandard VII(A) requires Members and Candidates to refrain from engaging in conduct that undermines the integrity of the CFA exam process.\nThis includes disclosing confidential information, including specific details about questions or broad topic areas tested on the exam, until it is\npublicly released by CFA Institute.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 39, "q": "Grace Chang, CFA, keeps two social media accounts: one for personal use and one firm-approved business account used for client engagement, which is monitored by her employer, Canyon Investments. After three years at Canyon, during which Chang has connected with all her clients through her business account, Chang decides to leave Canyon for LVL Bank. Canyon asks Chang to delete the business account before leaving. However, Chang confirms that she has not signed a noncompete agreement with Canyon and, upon starting at LVL, Chang updates her business account to reflect her new employer and continues to maintain both accounts. Has Chang most likely violated Standard IV(A) Loyalty? ", "opts": ["Yes.", "No, since she did not sign a noncompete agreement with Canyon.", "No, since all social media accounts operated by Chang are her property."], "ans": "A", "expl": "\"In matters related to their employment, Members and Candidates must act for the benefit of their employer and\nnot deprive their employer of the advantage of their skills and abilities, divulge confidential information, or\notherwise cause harm to their employer.\"\nStandard IV(A) Loyalty requires Members and Candidates to protect the interests of their employer. This includes acting for the benefit of the\nemployer even when one is planning to leave and refraining from taking property of that firm upon leaving unless given permission to do so.\nSocial media accounts that are created solely for business use and contact with clients are considered property of the firm and should be\ntreated similarly to other firm property (Choice C). When leaving an employer, Members and Candidates should follow their firm's policies and\nprocedures and transfer or delete the accounts if so directed. When social media accounts include both personal contacts and clients, the\nMember or Candidate should discuss with the firm how those profiles should be treated.\nIn this scenario, Chang created a social media account solely for client engagement. Since this social media account is used solely for business,\nit is considered the property of Canyon Investments. Even though Chang did not sign a noncompete agreement with Canyon, Chang must comply\nwith the firm's request regarding its property. Failure to delete the account disregards the firm's request and is a violation of the Standard (Choice\nB).\nThings to remember:\nStandard IV(A) requires Members and Candidates to act for the benefit of the employer even when planning to leave, and should refrain from\ntaking property of that firm upon leaving. Social media accounts created solely for business use and liaising with clients are considered property\nof the firm and should be transferred back to the firm or deleted.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 40, "q": "Xu Liang, CFA, is an equity portfolio manager of a large mutual fund. Liang's fund primarily invests in large-cap, dividend-paying stocks that tend to be less volatile than the broad equity market. Bernard Gerhardt is Liang's primary contact and salesperson at Trusted Brokers. Liang's firm is Trusted Brokers' largest client, and Liang's fund generates significant commission business. Gerhardt approaches Liang regarding a private placement in Smart AI, an artificial intelligence software company. During their conversation, Gerhardt comments that \"I know you don't normally buy these things for the mutual fund, but Smart AI is priced so cheap that it could easily double in just a few months! You should consider investing personally.\" Liang conducts thorough due diligence and believes Smart AI is a great investment opportunity but not a good fit for the fund since it does not align with the fund's mandate and risk profile. Therefore, Liang decides to personally invest in the private placement. According to Standard VI(B) Priority of Transactions, Liang most likely: ", "opts": ["violated the Standard by personally investing in the private placement.", "did not violate the Standard since the investment was inappropriate for the fund.", "did not violate the Standard since the fund was given the opportunity to invest first."], "ans": "A", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions in which a Member or\nCandidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions requires Members and Candidates to place clients' and employers' financial interests before their own\nwhen conducting investment transactions and to avoid even the appearance of conflicts of interest. A Member or Candidate's participation in\nprivate placements and initial public offerings (IPOs) requires an especially high standard of care.\nThe potential for conflicts of interest is more significant for investment personnel at large investment firms. Investment personnel (eg, Liang) may\nbe offered special enticements, such as access to private placements or IPOs, as payback for doing business (eg, largest client) with the broker\n(eg, Trusted Brokers) offering the securities.\nAnother concern is that once the private placement goes public, there is an incentive for the Member or Candidate who bought into the private\nplacement and holds the now-public company's stock to offer and/or buy the securities for clients (or, in this case, for the fund) whether suitable or\nnot.\nParticipation in private placements should be strictly limited to special situations in which there is no potential for even the appearance of\nconflicts of interest. Therefore, Liang violated the Standard by involving himself in a situation that potentially had the appearance of\nimpropriety.\n(Choices B and C) Liang appropriately considered the investment for the fund first and found it unsuitable. However, this is not where the\nviolation occurred.\nThings to remember:\nStandard VI(B) requires Members and Candidates to place clients' and employers' financial interests before their own when conducting investment\ntransactions. Participation in private placements should be strictly limited to special situations in which there is no potential for even the\nappearance of conflicts of interest.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 41, "q": "Apurva Basu, CFA, is a highly respected analyst covering the mining industry for South India Investments (SII). She has a list of 12 \"star\" clients who pay an extra fee for greater access to Basu and the other analysts at SII. This service is disclosed and offered to all clients. After sending her latest research report to all of her clients, Basu immediately calls the 12 on the list to discuss the report's conclusions in more detail. In regard to Standard III(B) Fair Dealing, based on Basu's research process, does she most likely violate the Standard? ", "opts": ["No.", "Yes, by favoring one set of clients over others.", "Yes, by not confirming that all her clients received the report before calling the \"star\" clients."], "ans": "A", "expl": "\"Members and Candidates must deal fairly and objectively with all clients when providing investment analysis,\nmaking investment recommendations, taking investment action, or engaging in other professional activities.\"\nStandard III(B) Fair Dealing focuses on the responsibility of members and candidates to treat all clients fairly, specifically when disseminating\ninvestment recommendations and taking investment actions. However, \"fairly\" does not mean \"equally\" since it is not possible to ensure that\neach client will receive investment recommendations at the same time. Nor does each client have the same investment goals.\nMembers and candidates must ensure each investment recommendation is disseminated in a way that provides all clients the ability to act on the\nrecommendation. The Standard allows firms to offer different levels of service to clients willing to pay a premium if those services:\ndo not disadvantage or negatively affect other clients and\nthe services are disclosed and available to all clients and prospective clients.\nIn this scenario, since Basu disseminates her research report fairly to all clients before calling the \"star\" clients, and since her calls do not\nnegatively impact the other clients, she does not violate the Standard (Choice B).\n(Choice C) Basu is required by the Standard to ensure that her recommendations are disseminated fairly, but she is not required to wait for all of\nher clients to confirm that they received the report.\nThings to remember:\nStandard III(B) Fair Dealing focuses on the responsibility of members and candidates to treat all clients fairly, but fairly does not mean equally.\nInformation must be disseminated in a way that allows all clients to act on it. However, the Standard allows firms to offer different levels of service.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 42, "q": "Sofia Giordano, CFA, is a private tutor for Candidates taking the CFA exam. Her marketing materials state that her program includes \"tips and strategies to pass the CFA exam.\" She continually works to make the program's practice exams more realistic. The day after the end of the most recent CFA exam period, Giordano sends a follow-up email to her students, congratulating them on getting through the exam and asking them which specific topics, in each domain, were tested so she can improve next year's practice exams. Giordano most likely violates Standard VII(A) Conduct as Participants in CFA Institute Programs:", "opts": ["only by offering \"tips and strategies\" to pass the exam.", "only by soliciting confidential information about the exam.", "both by offering \"tips and strategies\" and soliciting confidential information."], "ans": "B", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of\nCFA Institute or the CFA designation or the integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) Conduct as Participants in CFA Institute Programs requires Members and Candidates to refrain from conduct that undermines the\nintegrity of CFA Institute or its programs. Each Candidate taking the CFA exam must sign the Candidate Pledge, which specifies the types of\nconduct that violate the Standard, including:\ngiving or receiving information about the exam before or during the exam,\nproviding information about the exam to others after the exam, or\nviolating CFA Institute rules and regulations.\nIn addition, the Standard prohibits Members from soliciting confidential information gained prior to or during the exam. Unless and until CFA\nInstitute releases it publicly, Candidates must not divulge confidential information, including:\nspecific details about questions on the exam and\nbroad topical areas tested on the exam.\nIn this scenario, Sofia Giordano solicits confidential information about the CFA exam from her students. By doing so, she violates the Standard.\nSince the information has not been disseminated by CFA Institute, Candidates cannot disclose it. If Giordano's students send her confidential\ninformation, they would also violate the Standard.\n(Choices A and C) Offering tips and strategies to pass the CFA exam does not violate the Standard, as long as the tips and strategies do not\ninclude confidential information that CFA Institute has not publicly released.\nThings to remember:\nStandard VII(A) requires Members and Candidates to refrain from engaging in conduct that undermines the integrity of the CFA exam process.\nThis includes disclosing or soliciting confidential information, including specific details about questions or broad topic areas tested on the exam,\nuntil it is publicly released by CFA Institute.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 43, "q": "Giada Rossi, CFA, is a sell-side analyst at Hickory Capital, an integrated investment firm that offers trading, research, and investment banking services. Rossi has covered Turtle Shell, Inc. (TSI) for several years and currently has a buy rating on the stock. TSI has appreciated significantly in the past six months and is substantially above Rossi's price target. Rossi prepares a research report downgrading TSI based on valuation, unaware that Hickory's investment banking group is preparing a secondary offering of TSI common stock. Hickory's head of investment banking, Peter Johnson, CFA, is concerned that a downgrade would be detrimental to the secondary offering and might cause Hickory to be left out of the deal. Before Rossi disseminates her report, Johnson puts TSI on the firm's restricted list of investment banking clients and instructs Rossi to publish only factual news and corporate developments related to TSI. Rossi agrees. Has Rossi or Johnson most likely violated Standard I(B) Independence and Objectivity? ", "opts": ["No.", "Yes, Rossi violated the Standard by not properly disseminating her honest opinion.", "Yes, Johnson violated the Standard by instructing Rossi to compromise her independence."], "ans": "A", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and\nobjectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift,\nbenefit, compensation, or consideration that reasonably could be expected to compromise their own or another's\nindependence and objectivity.\"\nStandard I(B) Independence and Objectivity mandates that Members and Candidates who are investment professionals avoid actions that\ncompromise their independence and objectivity or create conflicts of interest. Investment banking relationships often create conflict for sell-\nside firms since the firms may pressure analysts to provide favorable research reports for investment banking clients. To minimize potential\ninformation sharing and conflicts of interest, firms should create firewalls between analysts and investment bankers.\nFirms are recommended to maintain a restricted list of investment banking clients and report only factual information, without analysts' opinions,\nfor those companies. If a firm's investment banking client is not on the restricted list and the firm will not disseminate unfavorable opinions, the\nfirm should add the client to the list to maintain independence and objectivity.\nIn this scenario, Giada Rossi does not violate the Standard since the firm restricted her ability to disseminate any investment opinion regarding\nTurtle Shell, Inc., in compliance with recommended practice (Choice B). Peter Johnson does not violate the Standard since he added TSI to the\nrestricted list, also in compliance with recommended practice (Choice C). Therefore, the firm should publish only factual news and corporate\ndevelopments related to TSI.\nThings to remember:\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid actions that compromise their independence and\nobjectivity or create conflicts of interest. To minimize potential conflicts of interest, firms should maintain a restricted list of investment banking\nclients and issue only factual information for those companies.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 44, "q": "Olga Ivanova, CFA, plans to leave her employer, Vector Advisors LLC (\"Vector\"), since they allow advisors to invest only in traditional assets. Ivanova plans to start her own investment advisory business where she can take riskier strategies. She has not signed a noncompete agreement with Vector. Before she leaves Vector, Ivanova: Searches for office space, on weekends, for the new company, Completes forms and begins the process to get the new company registered, and Calls Sergey Aslanov, her golf partner, to convince him to be her first client. Ivanova recently solicited Aslanov's business on behalf of Vector, but to date Aslanov has remained undecided about whether he will become a client. Has Ivanova most likely violated Standard IV(A) Loyalty?", "opts": ["No.", "Yes, by contacting a prospective Vector client before leaving.", "Yes, by preparing for her business on weekends before leaving Vector."], "ans": "B", "expl": "\"In matters related to their employment, Members and Candidates must act for the benefit of their employer and\nnot deprive their employer of the advantage of their skills and abilities, divulge confidential information, or\notherwise cause harm to their employer.\"\nStandard IV(A) Loyalty prohibits Members and Candidates from acting in ways that would harm their employer or deprive it of their skills and\nabilities. When planning to leave an employer, Members and Candidates must continue to act in their employer's best interest. This includes not\ncontacting the firm's clients and prospective clients with the purpose of soliciting business for their own independent business or a new\nemployer.\nIn this scenario, Ivanova calls Aslanov before she leaves the firm to solicit his business for her independent advisory business. Although Aslanov\nhas not agreed to join Vector, Ivanova recently solicited his business on behalf of Vector, and he has not yet decided whether to become a client of\nthe firm. As such, he remains a prospective client for Vector, and Ivanova violates the Standard by soliciting his business for her independent\npractice (Choice A).\n(Choice C) The Standard allows Ivanova to prepare her new business before leaving her current employer so long as preparation is done on her\nown time. Since she works on her independent business on weekends, doing so does not violate the Standard.\nThings to remember:\nStandard IV(A) prohibits Members and Candidates from contacting their employer's clients and prospective clients with the purpose of soliciting\nthem for their own independent business or a new employer. When planning to leave an employer, Members and Candidates must continue to act\nin their employer's best interest.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 45, "q": "Shreya Bhatt, CFA, is an independent financial advisor who wants to grow her client base. At a dinner with several prospective clients, she states, \"The knowledge and skills I have gained in the CFA program have enhanced my abilities in portfolio management. The rigor and intensity of the exams have trained me to work hard for my clients. As a CFA charterholder, I am best qualified to manage your money. My results speak for themselves. My clients have achieved an annualized rate of return of 10% over the past ten years, compared with 6% for my benchmark.\" Assuming her return figures are accurate, has Bhatt violated Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program? ", "opts": ["Yes.", "No, since her statements are backed by facts.", "No, since her statements were made verbally."], "ans": "A", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA\nProgram, Members and Candidates must not misrepresent or exaggerate the meaning or implications of\nmembership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program forbids Members and Candidates from exaggerating the\nmeaning or implication of their CFA charters. This includes overstating one's competency or ability to achieve superior performance. Although\nother Standards prohibit Members and Candidates from generally promising the achievement of superior returns, Standard VII(B) specifies that\nthese claims cannot be attributable to the CFA designation.\nStating objective facts about the benefits of achieving the CFA designation or the intensity and rigor of the CFA program is allowed. This\nincludes statements about knowledge and skills gained. However, such statements do not justify using the CFA designation to declare superior\ncompetency as an investment professional. Shreya Bhatt violates the Standard by stating, \"As a CFA charterholder, I am best qualified to manage\nyour money\" (Choice B). Although her return figures are factual, she exaggerates the meaning of the CFA designation.\n(Choice C) The Standard applies to any form of communication (eg, written, verbal). It also applies to any audience (eg, employers, prospective\nclients, the public).\nThings to remember:\nStandard VII(B) forbids Members and Candidates from exaggerating the meaning or implication of their CFA charters. Stating facts about the CFA\ndesignation and program is allowed. However, that permission does not allow statements that tie the CFA designation to superior competency or\nability to achieve better performance than noncharterholders.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 46, "q": "Rashid Miah, CFA, negotiates with his employer, Tenor Capital, to work only part-time as a financial advisor while finishing a graduate degree, with the understanding that he will return to full-time work after graduation. After graduating, Miah remains employed part-time since Tenor does not have enough clients, and keeps him at a part-time status until more clients are obtained. Miah looks for ways to increase his income and arranges to advise friends and family on investment decisions for a fee when not working for Tenor. He also plans to work as a driver for a ridesharing company on weekends, when Tenor is closed. To comply with Standard IV(B) Additional Compensation Agreements, Miah should obtain written permission from Tenor before pursuing: ", "opts": ["only the investment advisory.", "both the investment advisory and the ridesharing.", "neither the investment advisory nor the ridesharing."], "ans": "A", "expl": "\"Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or\nmight reasonably be expected to create a conflict of interest with their employer's interest unless they obtain\nwritten consent from all parties involved.\"\nStandard IV(B) addresses compensation arrangements from third parties that can challenge loyalty to an employer by competing with and/or\ncreating a conflict with the employer's interests. A Member or Candidate should receive written consent from all parties involved for any such\ncompensation.\nIn this scenario, Miah's investment advisory for friends and family can be reasonably seen as competing with Tenor's business, since Miah would\nbe doing the same type of work that he currently does for Tenor. Therefore, Miah needs to obtain written permission from Tenor and from his\nfriends and family before he starts advising (Choice C). The ridesharing role does not compete directly with Tenor's business, so Miah does not\nneed to obtain written permission for this arrangement (Choice B).\nStandard IV(B) recommends that Members and Candidates make a written report to their employer detailing the compensation from any third-\nparty sources before engaging in such activities. However, obtaining written permission is only required before entering into arrangements that\ncould be seen as competing or creating conflicts of interest.\nThings to remember:\nStandard IV(B) addresses the compensation that Members and Candidates can accept from third parties by requiring written permission for\ncompensation that can be reasonably seen as creating a conflict of interest with their employer. Recommended practice calls for a written report\nto the employer detailing the compensation from any third-party sources.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 47, "q": "Tim Green, CFA, is an investment advisor for Steady Hand Advisors (SHA). While attending a charity function, Green runs into one of his clients, Dr. Walter Kowalski. Kowalski tells Green about a small-cap biotechnology company developing a new process that could be a medical breakthrough. Green says he is familiar with the company but considers its stock to be very speculative since the company has never been profitable or even produced a viable product. Nevertheless, Kowalski instructs Green to buy 10,000 shares of the stock when the market opens the next day. Green advises against the trade: although an investment of this size will have an immaterial impact on Kowalski's portfolio, it does not meet his investment objectives and violates the constraints of his investment policy statement (IPS). Still, Kowalski insists that Green execute the trade. The next morning, Green documents his rationale for why the trade is unsuitable on SHA's unsolicited trade request form. Green emails the form to Kowalski to sign and return so the trade can be executed at the market open. Do Green's actions comply with Standard III(C) Suitability? ", "opts": ["Yes.", "No, the investment is unsuitable regardless of portfolio impact.", "No, since Green is required update the investment policy statement."], "ans": "A", "expl": "\"When Members and Candidates are in an advisory relationship with a client, they must:…\nb. Determine that an investment is suitable to the client's financial situation and consistent with the client's written\nobjectives, mandates, and constraints before making an investment recommendation or taking investment action.\nc. Judge the suitability of investments in the context of the client's total portfolio.…\"\nStandard III(C) Suitability addresses the adviser's responsibility to assess the suitability of investments for each client. The adviser does this\nby researching a client's specific investment goals, constraints, and risk tolerance, which together form the building blocks of the client's\ninvestment policy statement (IPS). The IPS can be used to determine the suitability of proposed investments.\nClients and advisors may disagree regarding investment suitability. Best practices regarding unsolicited requests for unsuitable investments\ninclude:\nRefrain from making the trade until discussing it with the client.\nEducate the client regarding divergence from the IPS.\nConsider the trade's potential impact within the context of the client's entire portfolio.\nBe sure the client acknowledges being advised that the trade is unsuitable.\nUpdate the IPS if the trade is executed and its portfolio impact is material.\nIn extreme cases, determine whether to continue the advisory relationship.\nIn this scenario, Tim Green complies with the Standard since he:\ndiscusses the trade with the client,\neducates the client regarding the trade's conflict with the IPS,\nconsiders the trade's immaterial portfolio impact (Choice B), and\nhas the client sign the unsolicited trade request form before the trade is executed.\n(Choice C) Obtaining the client's acknowledgment of the discussion is a best practice, but the Standard does not require updating the IPS unless\nthe trade has a material portfolio impact.\nThings to remember:\nStandard III(C) Suitability addresses the adviser's responsibility to assess the suitability of investments for each client. Best practices regarding\nunsolicited and unsuitable trade requests include discussing the trade's unsuitability with the client, considering the portfolio impact, and having\nthe client acknowledge the discussion.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 48, "q": "Chen Hong, CFA, is an independent investment advisor. Through a referral from an existing client, Chen contacts Zhao Qiuping. Chen briefly meets with Zhao, who is leaving for vacation the next day. Zhao agrees to be Chen's client and sends him money that is currently in her savings account. They are not able to discuss the details of Zhao's financial circumstances and objectives at the meeting, but Zhao tells Chen that he can invest the money however he sees fit and agrees that they will meet again to create a detailed investment policy statement when Zhao returns. Chen invests a portion of Zhao's funds in several stocks of companies that Chen has invested in other clients' funds, since Chen believes the stock prices will increase and Chen does not want Zhao to miss out. By the time Zhao returns, her investment portfolio is up 4%. With regards to Zhao's investments, Chen:", "opts": ["was in full compliance with the Standards.", "violated the Standards by not getting approval from Zhao for each investment.", "violated the Standards by investing Zhao's funds before gathering appropriate information."], "ans": "C", "expl": "\"When Members and Candidates are in an advisory relationship with a client, they must:…\na. Make a reasonable inquiry into a client's or prospective client's investment experience, risk and return objectives, and financial\nconstraints prior to making any investment recommendation or taking investment action and must reassess and update this\ninformation regularly.\nb. Determine that an investment is suitable to the client's financial situation and consistent with the client's written objectives,\nmandates, and constraints before making an investment recommendation or taking investment action.\"\nStandard III(C) Suitability requires Members and Candidates that are advisors to properly assess the suitability of each potential investment for\neach client before making investment decisions. To do this, an advisor must first gather information on each client's specific investment goals,\nconstraints, and risk tolerance. This information is used to develop an investment policy statement (IPS), which is then used to develop an\nappropriate investment program for the client.\nWithout gathering and understanding the appropriate information, an advisor has no way of knowing if specific investments meet criteria for\nsuitability for the client. Therefore, investing a client's assets before gathering appropriate information violates the Standard. In this scenario,\nChen invests Zhao's assets before getting information on Zhao's financial circumstances and objectives. Even though Zhao said to invest her\nassets however Chen saw fit, Chen had no way to know if the investments were suitable for Zhao. Therefore, Chen violated the Standards\n(Choice A).\n(Choice B) Members and Candidates do not need client approval for every specific investment to adhere to the Standard. Once the IPS is\ncreated, the advisors can invest within the confines of the IPS without approval for each investment.\nThings to remember:\nStandard III(C) Suitability requires Members and Candidates that are advisors to properly assess the suitability of each potential investment for\neach client before making investment decisions. Without an IPS, suitability cannot be determined. Therefore, investing a client's assets before an\nIPS is developed violates the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 49, "q": "Archer Clegg, CFA, manages a fund of illiquid distressed real estate that primarily consists of properties located in economically depressed areas. Clegg does not report fund performance relative to a benchmark since there are no benchmarks based on distressed real estate. Clegg uses two reputable appraisal firms to value each property annually. Last year, a new appraisal firm was hired due to cost and timing concerns involving a previous appraiser. Since then, Clegg has noticed that the new firm appears to consistently undervalue properties compared with the other firm doing appraisals. Fund performance reports are prepared using the average of the two appraisals, a method that is disclosed to clients and potential clients. Has Clegg most likely violated Standard I(C) Misrepresentation? ", "opts": ["No.", "Yes, since he is not using only the lowest appraisal.", "Yes, since he fails to compare performance to a benchmark."], "ans": "A", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment analysis,\nrecommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation prohibits actions and statements by investment professionals that could undermine confidence in investment\nperformance reporting. Members and Candidates must provide accurate and reliable pricing information to enable informed investment\ndecision-making by clients.\nAccurate values for distressed real estate are difficult to determine, and a wide range of appraised values is not uncommon. Using the average\nfrom several appraisers is a reasonable method for estimating a property's fair value. The method should be disclosed to clients and potential\nclients.\n(Choice B) Using the lower estimates for asset values can lead to exaggerating the expected returns when undervalued assets are sold. Archer\nClegg potentially violates the Standard if he uses only the lowest appraisals since doing so could result in the estimates for future returns being\nupwardly biased.\n(Choice C) The Standard recommends but does not require that Members and Candidates compare their performance results to comparable\nbenchmarks. CFA Institute recognizes that some assets, such as those Clegg manages, do not lend themselves to benchmark comparison.\nThings to remember:\nStandard I(C) Misrepresentation prohibits Members and Candidates from making misrepresentations that may undermine confidence in\ninvestment performance reporting. To comply with the Standard, they should provide only accurate and reliable valuations that investors can use\nto make informed decisions.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 50, "q": "Bo Shun Zheng, CFA, is a journalist who writes articles on market sentiment for a major news organization. She uses various sources, including social media, analyst interviews, and more conventionally published research. In one article, she reproduces research published on social media by an analyst known only as \"Big Alpha.\" Since she does not know Big Alpha's real name, she includes the research without citation, noting only that it has been endorsed by \"a leading investment expert.\" Regarding Standard I(C) Misrepresentation, does Zheng most likely violate the Standard?", "opts": ["Yes, by not citing the source of the research.", "Yes, by using research available only on social media.", "No, because she protects Big Alpha's choice to hide his true identity."], "ans": "A", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment analysis,\nrecommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation focuses on knowingly misrepresenting or misusing information, and as a result, undermining investor trust\nin the integrity of the profession and financial markets. The standard applies whether information is prepared for clients, colleagues, or the public\n—and whether it is a verbal or published statement.\nMisrepresentation can consist of\nomission: not presenting complete information or data in order to mislead\nplagiarism: quoting information without acknowledgement or citation\nexaggeration: inflating professional credentials or performance results\nIn this scenario, Zheng violates the standard in two ways. First, by not citing the source of the research and by reproducing it as though it were\nher own, she engages in plagiarism. Although she does not know the author's full name, she should not mislead her readers as to the\ninformation's source. Second, she exaggerates the validity of the research by stating that it is endorse
