he drug will likely affect PrimeHealth's stock price. The information was\nalso nonpublic since only a few analysts knew it when Pressly bought the stock. Although Pressly's father did not act on her recommendation, it\nwas based on material nonpublic information, so her recommendation alone violated the Standard (Choices A and B).\nThings to remember:\nStandard II(A) Material Nonpublic Information prohibits members and candidates from trading on material nonpublic information or providing that\ninformation to others. With respect to providing it to others, it is unnecessary for the recipient to act on the information; merely making the\nrecommendation while possessing material nonpublic information violates the Standard.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 78, "q": "Grace Lee, CFA, is an investment advisor at Apex Investments. After considerable research, Lee recommends the XYZ 130/30 long/short exchange traded fund (ETF) to her retail clients as their primary equity exposure, if it is suitable for their portfolios. The XYZ fund invests in a selection of benchmark equity securities while employing leverage (130% long) and short positions (30% short) to arrive at an equivalent 100% long position. Lee is very comfortable recommending the ETF, as it has historically outperformed the benchmark index while exhibiting a similar level of volatility. When discussing the ETF with clients and prospects, Lee touts the relative outperformance and low tracking error versus the benchmark, referring to it as an \"enhanced index fund.\" Lee has most likely:", "opts": ["remained in full compliance with the Standards.", "violated the Standards by not adequately disclosing the risks of the ETF.", "violated the Standards by using the ETF as equity exposure for retail clients."], "ans": "B", "expl": "\"Members and Candidates must:\nUse reasonable judgement in identifying which factors are important to their investment analyses,\nrecommendations, or actions, and include those factors in communications with clients and prospective clients.\"\nStandard V(B) Communication with Clients and Prospective Clients requires Members and Candidates to inform both clients and prospective\nclients about the limitations and risks of an asset or investment process. The communications must use plain language that is easy for clients to\nunderstand but also conveys enough information for them to recognize the relevant risks and limitations.\nIn this instance, Lee violated the Standard by oversimplifying the exchange traded fund (ETF) as an \"enhanced index fund,\" which\ninappropriately downplays the underlying risks associated with the investment. Specifically, the ETF is not an index fund and employs an active\napproach, leverage, and short positions, which should all be clearly acknowledged and detailed when communicating the risks of the\ninvestment with clients and prospects (Choice A).\n(Choice C) The fact that Lee uses the ETF as primary equity exposure for retail clients does not specifically violate the Standard. Lee conducted\nconsiderable research before recommending this investment and is acting in what she believes to be in the best interest of her clients. The issue\nis in how she communicated the favorable aspects of the investment but failed to mention the considerable risks that a well-informed investor\nwould want to know.\nThings to remember:\nStandard V(B) Communication with Clients and Prospective Clients requires Members and Candidates to inform both clients and prospective\nclients about the limitations and risks of an asset or investment process. The communications must use language that is easy for clients to\nunderstand but also conveys enough information for them to recognize the relevant risks and limitations.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 79, "q": "Zoey Baines, CFA, works in the investment management division of a large bank. As part of the bank's incentives for driving revenue growth, it offers Baines $300 for each investment management client she refers to either the bank's banking or financial planning divisions. At year end, the employee with the most referrals receives an additional $5,000 bonus. Baines does not share her compensation structure with her clients since she feels her compensation is a private matter. Does Baines most likely violate Standard VI(C) Referral Fees? ", "opts": ["Yes", "No, since the incentive is considered compensation.", "No, since the offer is for only referrals within the bank."], "ans": "A", "expl": "Members and Candidates must disclose to their employer, clients, and prospective clients, as appropriate, any compensation, consideration, or\nbenefit received from or paid to others for the recommendation of products or services\nStandard VI(C) addresses various types of conflicts of interest that Members and Candidates must avoid. Under Standard VI(C) Referral Fees,\nMembers and Candidates must notify clients of benefits they obtain for giving a referral. By disclosing referral arrangements, clients may\nevaluate the employee's objectivity and a proposal's total cost. All referral arrangements, whether with a third party or within the same firm,\nmust be disclosed (Choice C).\nZoey Baines violates the Standard by failing to inform clients about the financial reward she receives for referring customers to the bank's other\ndivisions. Even if Baines considers her compensation a private matter, it does not excuse her from disclosing any compensation associated with\nmaking internal or external referrals (Choice B).\nThings to remember:\nMembers and Candidates must notify their clients of any benefits obtained for sending referrals. By disclosing referral arrangements, clients may\nevaluate the employee's preference for specific proposals and the total cost. All referral arrangements, whether between a third party or within the\nsame firm, must be disclosed.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 80, "q": "Harold Martin, CFA, is a senior wealth management strategist at Synergy Investment Advisors (SIA). SIA does not manage funds but maintains a list of approved brokerage firms the advisors can suggest to clients for placing trades. Recently, one of those firms asked Martin to recommend it exclusively to his clients. In exchange, the firm offered to sell Martin tickets to a sold-out sporting event at the face value of $2,500 per ticket. Martin would have been unable to acquire these tickets otherwise except at a significantly higher price. The firm's commissions are slightly higher than others on the approved list, but it consistently provides better execution on its trades. Martin subsequently recommends that his clients use this firm without advising them of its ticket incentive. Does Martin most likely violate Standard VI(C) Referral Fees? ", "opts": ["Yes", "No, since he had to pay for the tickets and did not receive them as a gift", "No, since his clients will receive enhanced value from the broker's better execution"], "ans": "A", "expl": "\"Members and Candidates must disclose to their employer, clients, and prospective clients, as appropriate, any\ncompensation, consideration, or benefit received from or paid to others for the recommendation of products or\nservices.\"\nStandard VI(C) Referral Fees requires Members and Candidates to advise employers and clients if they receive any type of benefit for\nrecommending a product or service. These benefits can pose a conflict of interest, so disclosing the conflict allows affected parties to\ndetermine whether the recommendation was impartial. Note that the Standard does not require that clients consent to the arrangement, only that\nthey be made aware of it.\nIn this question, Martin violated the Standard since he did not disclose the ticket arrangement to his clients. The broker's offer to sell the tickets for\na greatly reduced price confers a benefit to Martin. CFA Institute defines \"benefit\" broadly to include both cash and noncash considerations. It is\nirrelevant that Martin had to pay for the tickets; the ability to buy something for less than market value is still considered a benefit (Choice B).\n(Choice C) It is irrelevant whether a client receives a benefit by following the recommendation. The Standard does not excuse a Member or\nCandidate's failure to disclose a referral fee arrangement on the rationale that the client benefits by using the recommended product or service.\nThings to remember:\nStandard VI(C) Referral Fees requires Members and Candidates to disclose referral fees for recommending products or services. A referral fee is\nbroadly defined and includes cash and noncash consideration. The Standard does not require clients to consent to referral fee arrangements, only\nthat they be made aware of them.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 81, "q": "Aiko Nakamura, CFA, has worked as an investment adviser for the past 20 years and specialized in creating individual stock portfolios for her clients. Recently her firm transitioned all clients to firm-approved model portfolios based on risk tolerance. These model portfolios include only passively managed ETFs, a handful of actively managed mutual funds, and a few hedge funds. Pat Smith, Nakamura's largest client and an old friend, is not happy with the new arrangement; she prefers to invest in individual stocks and threatens to take her business elsewhere. To keep her client with the firm, Nakamura suggests that she could provide \"informal\" stock ideas to Smith on a quarterly basis at Nakamura's favorite restaurant, an expensive steakhouse, as long as Smith pays for dinner. Smith could then execute the trades through an unrelated discount brokerage firm if she liked the ideas. Smith is receptive to the idea, agreeing to the arrangement, and remains a client. Does Nakamura's conduct violate Standard IV(B) Additional Compensation Arrangements? ", "opts": ["Yes.", "No, since Nakamura is just suggesting ideas over dinner with a friend.", "No, since her firm no longer offers this service so she is not competing with her employer."], "ans": "A", "expl": "\"Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected\nto create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved.\"\nStandard IV(B) Additional Compensation Arrangements notes that third-party, additional compensation is allowed. However, if the\narrangement could be reasonably seen as creating a conflict with the employer, the Member or Candidate must obtain written permission\nfrom all parties involved.\nIn this case, Nakamura cannot accept compensation for any investment advice that could be seen as conflicting with her firm's interests without\nwritten permission from all parties involved. Since Nakamura is giving investment advice that differs from her firm's recommendations and\nproposing trade execution by another firm, this can reasonably be seen as a conflict with her employer's interests (Choice C). Therefore, she has\nviolated the Standards by not obtaining prior written permission.\nAdditional compensation does not necessarily have to be cash compensation; it could be anything of value above a reasonable threshold,\nincluding a gift, tickets to a sporting event, or, as here, a series of expensive dinners. By establishing this condition for sharing her investment\nideas, Nakamura has created a compensation arrangement and is not just having dinner with a friend (Choice B).\nThings to remember:\nStandard IV(B) Additional Compensation Arrangements notes that third-party, additional compensation is allowed. However, if the arrangement\ncould be reasonably seen as creating a conflict with the employer, the Member or Candidate must obtain written permission from all parties\ninvolved.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 82, "q": "Choon-Hee Kim, CFA, a financial advisor, evaluates an attractive but risky initial public offering (IPO) for TTG, Inc. After evaluating her clients' investment policies, Kim decides that TTG's stock is suitable for her risk-tolerant clients' portfolios but that it surpasses the risk threshold of her risk-averse clients. Kim believes TTG's stock has a strong chance of appreciating quickly, so she allocates shares to her risk-tolerant clients. Two months after the IPO, TTG stock has increased by 38%. Regarding Standard III(A) Loyalty, Prudence, and Care, did Kim most likely violate the Standard?", "opts": ["No.", "Yes, by allocating risky IPO shares to any of her clients.", "Yes, by excluding clients from the allocation after concluding the stock would appreciate."], "ans": "A", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients'\ninterests before their employer's or their own interests.\"\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to be loyal to their clients and to use prudence and care when\nmaking investment decisions on a client's behalf. Investment actions must be carried out for the sole benefit of the client and in the client's best\ninterest. Prudence includes adhering to the investment parameters established by the portfolio manager and the client. Each client's individual\nneeds should be considered.\nIn this scenario, Kim acted with prudence and care when evaluating TTG, Inc.'s stock and deciding which accounts are appropriate for it, based on\neach client's risk tolerance. Despite her belief in TTG's strong upside potential, Kim adhered to her clients' investment parameters by not\nallocating the stock to her risk-averse clients (Choice C). Regardless of whether Kim's forecast proves accurate and the stock price continues to\nincrease, the stock is still too risky for these clients.\n(Choice B) Allocating risky shares to clients is not a violation of the Standard. Such shares may be appropriate for clients with investment\nparameters that allow riskier assets.\nThings to remember:\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to be loyal to their clients and to use prudence and care when\nmaking decisions on a client's behalf. Prudence includes adhering to the investment parameters established by each client and the portfolio\nmanager.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 83, "q": "Joseph Smith, CFA, is the head equity trader for an investment management firm and is responsible for the firm's soft dollar policies and brokerage relationships. During a planning session, the investment management team agrees that the firm will use soft dollars to purchase new economic research from XYZ Economists, new performance attribution software, and new computers for the trading desk. According to Standard III(A) Loyalty, Prudence, and Care, Smith would most likely violate the Standard by using soft dollar brokerage to purchase the:", "opts": ["economic research.", "computers for the trading desk.", "performance attribution software."], "ans": "B", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients' best\ninterests before their employer's or their own interests.\"\nInvestment managers pay a commission to a broker to execute client trades. Soft dollar brokerage is the practice of using a portion of\nbrokerage commissions to purchase investment services. Since it is the client who ultimately \"pays\" (ie, out of client assets) the commission,\nwhen a portion of the commission (ie, soft dollars) purchases additional investment services, the services \"belong\" to the client.\nThe investment manager has a duty of loyalty to use such assets for the benefit of the client. Soft dollars can be used only to purchase research\nservices that assist the manager in the investment decision-making process (ie, to make better decisions for the client). Therefore, soft dollars\ncannot be used to cover the investment manager's operating expenses, such as computers, office supplies, or travel expenses.\nInvestment managers may be tempted to generate excess soft dollar commissions to purchase additional research or to gain clout with brokerage\nfirms by generating more commission revenue. The investment manager cannot meet the Standard by paying a higher commission rate for the\nexclusive purpose of generating soft dollar commissions and must disclose soft dollar practices to clients.\n(Choices A and C) Performance attribution software and economic research will assist the portfolio management team in making more informed\ninvesting decisions for the client and is therefore permissible under the Standard.\nThings to remember:\nSoft dollar brokerage is the practice of using a portion of brokerage commissions to pay for investment research. The portion of trading\ncommissions that is used to purchase research is considered an asset of the client, not the investment manager. The manager has a duty of\nloyalty to use this asset for the benefit of the client.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 84, "q": "Zhang Yong, CFA, is a CFA Institute volunteer who is helping create material for the upcoming Level III CFA exam. Zhang meets with CFA Institute staff and other question writers and is assigned to write an essay question about portfolio management for a college endowment fund. At dinner one night, Zhang tells his friend, Li Min, CFA, about the question he is working on. Li manages the endowment fund of a local university, and Zhang believes that Li can provide helpful insight. Has Zhang most likely violated Standard VII(A) Conduct as Participants in CFA Institute Programs?", "opts": ["Yes.", "No, since Li is not a Candidate for an upcoming exam.", "No, since the question is under deliberation and is not finalized."], "ans": "A", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA\nInstitute or the CFA designation or the integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) prohibits Members and Candidates from engaging in behavior that undermines the integrity of CFA Institute or its programs. CFA\nInstitute takes care to ensure that confidential information about exams is not shared by anyone. For Members and Candidates, sharing such\ninformation is a violation of the Standard. Members may not disclose:\nquestions that are set to appear on the exam or are under consideration,\nany parts of the deliberation process related to the exam, or\ninformation related to the scoring of questions.\nIn this scenario, Zhang Yong has confidential information about the deliberation process and questions under consideration, including one that he\nplans to write. Per the Standard, he may not discuss this information with anyone, including Members and Candidates, regardless of whether the\nquestion he plans to write appears on the exam (Choices B and C).\nThings to remember:\nStandard VII(A) prohibits Members and Candidates from engaging in behavior that undermines the integrity of CFA Institute or its programs.\nMembers may not disclose questions that are set to appear on the exam or are under consideration, nor may they discuss the deliberation\nprocess related to the exam.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 85, "q": "Anand Rana, CFA, a portfolio manager for Amethyst Investment Group, expects that political conflict between two developed countries will create turmoil for emerging markets. He asks Rahul Kumar, CFA, a quantitative analyst at Amethyst, to develop a model to track various economic factors in each of the emerging markets. Kumar creates a model, tests it with available data from the last two years when emerging markets expanded rapidly, then delivers it to Rana. Unhappy with the finished product, Rana asks another quantitative analyst to create a model with different inputs. The new model, upon thorough testing by Rana, delivers more helpful results. Since this model delivers the results that Rana wants, he does not inquire how it uses the inputs or produces its results. Standard V(A) Diligence and Reasonable Basis is most likely violated by:", "opts": ["only Rana.", "only Kumar.", "both Rana and Kumar."], "ans": "C", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires Members and Candidates to conduct thorough due diligence when analyzing investments\nand taking actions on a client's behalf. When quantitative models are used as part of an investment process, the Standard requires that the due\ndiligence on the model be as thorough as other aspects of the process. The model's developers and users must:\nunderstand how the model works well enough to explain it to clients and\nthoroughly test the model.\nData that encompass all performance and volatility expectations should be used for testing.\nIn this scenario, both Rana and Kumar violate the Standard. Kumar, as the model's developer, is required to thoroughly test the model to ensure\nits recommendations are accurate. However, he tested the model only with data from a period of rapid expansion and did not account for\neconomic contractions and other negative market events that could affect the model (Choice A). Rana, who will incorporate the model into his\ninvestment recommendations, is required to understand the new model well enough to explain to clients how it works. Since he does not inquire\nabout how the inputs are used or the results are produced, he cannot develop a sufficiently strong understanding of the model (Choice B).\nThings to remember:\nStandard V(A) requires that when quantitative models are used as part of an investment process, the due diligence on the model be as thorough\nas other aspects of the process. The model's developers and users must understand how the model works well enough to explain it to clients, and\nthey must thoroughly test the model.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 86, "q": "Rul Investing is a full-service investment firm that has adopted the CFA Institute Code and Standards. As policy and practice, the firm prohibits communication between the research and investment banking departments. An exception occurs when the firm forms teams that include both research analysts and investment bankers to work on joint projects. For those projects, the entire team is eligible for a bonus based on the results of the project or transaction. The firm is careful to disclose to clients those cases in which research analysts and investment bankers work together. Does Rul's practice regarding these special project teams most likely comply with Standard I(B) Independence and Objectivity?", "opts": ["Yes.", "No, since analysts can earn bonuses resulting from work on the special teams.", "No, since the firm should not allow teams with both analysts and investment bankers."], "ans": "B", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional\nactivities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be\nexpected to compromise their own or another's independence and objectivity.\"\nOne potential threat to a member or candidate's independence and objectivity is pressure on research analysts from the investment banking\ndepartment to issue more favorable recommendations. Firms often establish firewalls between departments to mitigate this threat.\nOne such firewall is establishing a compensation plan that rewards analysts for accuracy and objectivity, not the performance of other\ndepartments. Rul's compensation for the joint teams directly conflicts with this requirement by making the analysts eligible for bonuses based\non team results. Thus, it is a violation of the Standard, whether or not it is disclosed to clients (Choice A).\n(Choice C) The Standard recognizes that there may be efficiencies to having analysts and investment bankers work together (ie, more efficient\nrisk assessment and pricing). As a result, the Standard does not prohibit joint teams, such as those at Rul, but does recommend mitigating\npractices, such as ensuring that analysts' compensation plans that independent of investment banking results.\nThings to remember:\nStandard I(B) Independence and Objectivity focuses on avoiding any actions that would compromise the independence and objectivity of an\ninvestment professional. To maintain analysts' independence and objectivity, the Standard requires the implementation of best practices, including\nfirewalls between the investment banking and research departments.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 87, "q": "One day after taking Level II of the CFA exam, Guyton Wyll visited a website used by several thousand CFA candidates and posted the following to a thread visible to candidates at all levels: \"I can't believe that CFA Institute recommended that we study for more than 300 hours when they asked such easy questions on most topics. But the Ethics questions were so subjective, and I can't remember that any of them dealt with the Standards...really unfair!\" Did Wyll's post most likely violate Standard VII(A)–Conduct as Participants in CFA Institute Programs?", "opts": ["No", "Yes, with his reference to the ethics questions", "Yes, with his reference to CFA Institute's recommended study time"], "ans": "B", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA\nInstitute or the CFA designation or the integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) prohibits Members and Candidates from engaging in any conduct that would undermine the integrity of the CFA Institute or any\nCFA Institute program, including the CFA Program exams. A specific requirement in connection with this Standard is a pledge that candidates\nmust sign before taking any Level exam. The pledge reads, in part, \"After this exam, I will not disclose ANY portion of this exam…\"\nWyll, by referencing areas that the Ethics questions did not address, violated Standard VII(A) and the pledge. It is immaterial that he did not\ndiscuss specific questions. His statement that certain areas of the candidate body of knowledge were not tested, especially since it was posted\nsoon after he took the exam, is considered assistance to future candidates. This assistance undermines the integrity of the exam and is prohibited\nunder the Standard.\nHowever, general opinions about the difficulty of an exam that do not address specific questions or topics or CFA Institute's policies and\nprocedures do not violate the Standard. Wyll's opinions that the exam was \"easy\" and that CFA Institute's recommendation is unwarranted\nregarding time needed to study for Level II do not violate the Standard (Choice C).\nThings to remember:\nStandard VII(A) prohibits members and candidates from engaging in conduct that would undermine the integrity of the CFA exam process. This\nincludes disclosing any information concerning either a specific question or a topic that was tested on the exam. The Standard does not prevent\nmembers or candidates from voicing opinions concerning CFA Institute including policies and procedures.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 88, "q": "Trevor Halcott is a practicing lawyer and a CFA charterholder. He meets with the legal team of a potential client, Smith & Smith, Inc., to discuss a case that involves derivatives and portfolio management. At the beginning of the meeting, he hands out business cards that give his name as \"Trevor Halcott, JD, CFA.\" Later, he tells the legal team, \"completing the CFA Program greatly improved my knowledge of portfolio management and derivatives.\" Has Halcott violated most likely VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program? ", "opts": ["No.", "Yes, by listing his JD before his CFA designation.", "Yes, by stating that the CFA Program has increased his knowledge."], "ans": "A", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA\nProgram, Members and Candidates must not misrepresent or exaggerate the meaning or implications of\nmembership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program designates when Members may use the CFA designation.\nCFA Institute takes special care to ensure that individuals who use the CFA designation meet all requirements to do so and use the designation\nproperly.\nAlthough CFA Institute maintains specific rules about how to use the CFA designation, the Standard does not assign a mandatory order of\ncredentials for Members who have multiple professional or academic certifications. Therefore, in this scenario, Trevor Halcott does not violate\nthe Standard by listing his JD before his CFA designation on his business card (Choice B).\nStandard VII(B) also governs how Members and Candidates reference the CFA Program. Statements exaggerating the meaning or implication of\nhaving a CFA charter violate the Standard. However, statements of objective fact about the benefits (eg, knowledge and skills gained) of the\nCFA designation are allowed. In his meeting with a prospective client's legal team, Halcott states that the CFA Program enhanced his knowledge,\nwhich does not violate the Standard (Choice C).\nThings to remember:\nStandard VII(B) allows Members with multiple professional and academic designations to list them in any order. It also allows Members to make\nstatements of objective fact regarding the knowledge they gained through the CFA Program.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 89, "q": "Bao Pham, CFA, is an investment adviser serving high–net worth retail clients. Several of Pham's younger clients prefer using instant messaging to communicate with him. Pham often receives requests and investment questions from clients via his personal phone and social media accounts. Pham does not forward any of these items to his firm since he considers them personal. The firm has no stated policy on data collection via personal devices or social media. Does Pham's conduct most likely comply with Standard V(C) Record Retention? ", "opts": ["No.", "Yes, since the firm has no stated policy on the issue.", "Yes, since these are private messages received through personal devices and accounts."], "ans": "A", "expl": "\"Members and Candidates must develop and maintain appropriate records to support their investment analyses,\nrecommendations, actions, and other investment-related communications with clients and prospective clients.\"\nStandard V(C) Record Retention requires Members and Candidates to keep records that are considered property of their firms. This\nrequirement includes retaining and documenting all social media and instant messaging interactions that involve investment-related\ncommunication with clients and prospective clients.\nAlthough the Standard places some responsibility for record retention on firms, Members and Candidates must assist in the process, which\nincludes capturing and forwarding documentation of work-related digital media (eg, text messages, blog posts, social media interactions).\nIn this scenario, Bao Pham's failure to retain and document all of his client communications violates the Standard. His concern that private\ninformation may be included does not override the requirement (Choice C).\n(Choice B) Personal social media and instant messaging interactions that include any work-related content must be retained and submitted to the\nfirm, even if the firm has no stated policy on the issue.\nThings to remember:\nStandard V(C) Record Retention requires Members and Candidates to keep records of their investment-related communication with clients and\nprospective clients. This requirement includes capturing and forwarding all relevant digital media (eg, text messages, blog posts, social media\ninteractions).\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 90, "q": "The endowment fund managers for Springvale University hire Omar Najjar, CFA, to provide investment advice. During their conversation, the managers mention that the endowment is funding a new academic building that the University has not yet announced to the public. Najjar tells the managers to call one of his clients, who just received an inheritance of $100,000 and disclosed that information to Najjar during a recent meeting. Later that night, Najjar has dinner with his friend, Farah Said, an alumna of Springvale University. Najjar tells Said that the University is planning a new academic building and needs donations. According to Standard III(E) Preservation of Confidentiality, Najjar has most likely violated the Standard by disclosing:", "opts": ["his clients' inheritance to the endowment managers.", "Springvale University's building plans and funding needs to Said.", "both his client's inheritance and Springvale University's building plans and funding needs."], "ans": "C", "expl": "\"Members and Candidates must keep information about current, former, and prospective clients confidential\nunless:\n1. The information concerns illegal activities on the part of the client or prospective client,\n2. Disclosure is required by law, or\n3. The client or prospective client permits disclosure of the information.\"\nStandard III(E) Preservation of Confidentiality requires Members and Candidates to maintain the confidentiality of information from clients,\nprospective clients, and former clients. Confidential information may be disclosed only if the client authorizes it, if applicable law requires it, or if it\ninvolves a client's illegal activities and applicable law does not require the information to remain confidential.\nConfidential information includes information that:\nIs received while advising on or managing the client's business or personal affairs\nArises from or is relevant to the portion of the client's business that is subject to the relationship\nIn this scenario, Omar Najjar learns of the building plans and funding needs of Springvale University while conducting business on behalf of the\nendowment, a client, so that information is confidential. Similarly, Najjar learns of the inheritance while advising an individual who is a client, so\nthat information is also confidential. To comply with the Standard, Najjar should not disclose any client's confidential information without that\nclient's authorization (Choices A and B).\nThings to remember:\nMembers and Candidates have a duty to maintain confidentiality of information from clients, prospective clients, and former clients. Information\nmust remain confidential unless disclosure is authorized by the client, required by law, or involves illegal activity.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 91, "q": "Zheng Dongmei took the Level III CFA exam and is awaiting her results. She currently works as a financial advisor but wants to transition to research analysis. Zheng believes that the CFA charter can help her with the transition. She titles her resume \"Zheng Dongmei, CFA Level II,\" and under education she writes \"Passed CFA Level II exam\" and \"Candidate for the Level III CFA exam (charter pending).\" In composing her resume, Zheng most likely violated Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program:", "opts": ["only by listing \"charter pending.\"", "only by listing \"Zheng Dongmei, CFA Level II.\"", "both by listing \"charter pending\" and \" Zheng Dongmei, CFA Level II.\""], "ans": "C", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA\nProgram, Members and Candidates must not misrepresent or exaggerate the meaning or implications of\nmembership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program regulates how Members and Candidates may use the\nCFA designation. Candidates are those who have:\nregistered with CFA Institute and enrolled to sit for an exam or\nsat for an exam and are awaiting results.\nCandidates may disclose their participation in the CFA program only by referencing that they passed a certain exam or referencing their candidacy\nfor a future exam. Language such as \"passed CFA Level II exam\" and \"Candidate for the Level III CFA exam\" is acceptable.\nSuggesting that a charter is pending or expected to be completed by a certain date violates the Standard; since Candidates cannot know for\nsure that they will attain CFA chartership, the language is misleading. In this scenario, Zheng Dongmei suggests that her charter is pending, which\nimplies that she passed the Level III exam although she does not yet know that, and that she has fulfilled the other requirements of obtaining the\ncharter.\nReferences to a partial charter also violate the Standard. A person either is or is not a charterholder. Zheng writes in her resume \"Zheng\nDongmei, CFA Level II,\" suggesting that the CFA charter has different levels, which is does not.\nZheng violates the Standard both by writing \"charter pending\" and \"Zheng Dongmei, CFA Level II\" (Choices A and B). However, the language\n\"Passed CFA Level II exam\" and \"Candidate for the Level III CFA exam\" is acceptable.\nThings to remember:\nStandard VII(B) regulates how Candidates disclose their participation in the CFA program. Candidates may reference passing an exam or their\ncandidacy for a future exam. Referencing a partial charter and suggesting that a charter is pending or expected violates the Standard.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 92, "q": "Evan Zhang, CFA, a sell-side analyst, covers Spencer Pharmaceuticals. Andreas Perry, Spencer's CEO, confirms that the current year's earnings beat expectations by $0.02. He also comments that certain drugs are showing promise in advanced clinical trials. Perry expects the pipeline of new medicines to generate new revenue of over $1 billion if successful. Zhang writes a report that states, \"Based on the facts that Spencer Pharmaceuticals has better than expected results and the company will have at least $1 billion in new revenue from its pipeline, I recommend it as a STRONG BUY.\" With respect to Standard V(B) Communication with Clients and Prospective Clients, has Zhang most likely violated the Standard?", "opts": ["No.", "Yes, by his characterization of the earnings confirmation.", "Yes, by his characterization of the description of the pipeline."], "ans": "C", "expl": "\"Members and Candidates…must distinguish between fact and opinion in the presentation of investment analysis\nand recommendations.\"\nUnder Standard V(B) Communication with Clients and Prospective Clients, members and candidates must differentiate between fact and\nopinion when communicating with clients. Mixing facts and opinions may transpire when communications blur the distinction between past\nevents and future results. Forward-looking conclusions are opinions that depend on upcoming events.\nHere, Zhang states: \"Based on the facts…Spencer…will have at least $1 billion in new revenue.\" Zhang portrays Perry's opinion of the future\nsuccess of the pipeline as a fact. This violates the Standard since future events must happen for the pipeline to be successful (Choice A).\n(Choice B) Zhang does not violate the Standard by basing his recommendation on Perry's confirmation of the current year's earnings since it is a\nfact, not an opinion. There are no future events that could impact this earnings confirmation.\nThings to remember:\nUnder Standard V(B), members and candidates must differentiate between fact and opinion when communicating with clients. Mixing facts and\nopinions happens when communications blur the distinction between past events and future results. Past events are facts; forward-looking\nconclusions are opinions that depend on upcoming events.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 93, "q": "Rolf Lauer, CFA, an analyst at Ludwig Credit Advisors (LCA), manages a bond index fund. Per the fund's prospectus, the fund is rebalanced monthly to match its index. Lauer uses a model to rebalance the fund. During his review of the model, he identifies an error that causes the weights of some securities in the fund to deviate from how they are weighted in the index. However, the error also results in the fund having better performance than the index over the last year. He immediately corrects the model's flaws to replicate the index better. One month later, other responsibilities prevent him from rebalancing the fund to meet the firm's operational deadline. The following day he completes that task and informs his supervisor of the delay. After further review, the one-day delay in rebalancing did not cause the fund to deviate significantly from the index. To comply with Standard V(B)(1), which of the following should have been disclosed to current and potential clients of the fund? ", "opts": ["Only the model's error", "Only the delay in rebalancing", "Both the model's error and the delay in rebalancing"], "ans": "A", "expl": "\"Members and Candidates must disclose to clients and prospective clients the basic format and general principles of the\ninvestment processes they use to analyze investments, select securities, and construct portfolios, and must promptly disclose\nany changes that might materially affect those processes.\"\nStandard V(B)1 requires members and candidates to disclose their general duties of how they manage money as well as the limitations and\nrisks associated with their investment process. If material errors are discovered within the investment process, members and candidates must\ncommunicate them. A material error is one that a reasonable investor would want to know about before making an investment decision.\nHere, the flaw in the model results in the fund deviating from its index. Since the fund was invested differently than stated, it is a material error and\nmust be disclosed. Whether errors benefit or harm investors is irrelevant to the firm's responsibility for communicating them.\n(Choices B and C) Delaying the monthly rebalancing by one day is not a material error since the fund still adheres to its stated policy of monthly\nrebalancing.\nThings to remember:\nStandard V(B)(1) requires members and candidates to disclose material errors in the investment process and how the firm will correct the errors.\nA material error is one that a reasonable investor would want to know about before making an investment decision.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 94, "q": "Phoebe Ross, CFA, is a portfolio manager for an equity fund that participates in small-cap IPOs. One of her accounts is a family trust account in which she and her parents each hold one-third beneficial interests. Ross routinely allocates IPO shares equally to all accounts for which IPOs are suitable investments, including the trust account. Based only on this information, does Ross violate Standard VI(B) Priority of Transactions?", "opts": ["No", "Yes, since she must first allocate shares to nonfamily accounts", "Yes, since she must first allocate shares to accounts in which she has no beneficial interest"], "ans": "A", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions in which a\nMember or Candidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions requires Members and Candidates to place clients' and employers' financial interests before their own\nwith respect to investment transactions. Clients must be allowed to act on investment opportunities before a Member personally transacts in the\nsame investment.\n\"Personal transactions\" include transactions for family accounts. However, CFA Institute's Guidance for this Standard specifically advises that if a\nfamily account is also a client account, it should neither be advantaged nor disadvantaged by virtue of being a family account (Choice B). In this\nquestion, Ross neither discriminates against nor extends preferential treatment to the trust account, so there is no violation of Standard VI(B).\n(Choice C) CFA Institute's Guidance addresses how to apply the Standard when a member has a beneficial interest in a family account, such as\na trust account. If it is a client account, it has the same standing as any other client account. Ross's beneficial interest does not disqualify it as a\nclient account or prohibit it from participating equally in investment opportunities.\nThings to remember:\nStandard VI(B) requires Members and Candidates to first allow clients and employers to act on investment opportunities before personally\ntransacting in those investments. Personal investing includes family accounts, but when the family account is also a client account, the Standard\nrequires that it be treated the same as other client accounts. This applies even if the member has a beneficial interest in the family account.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 95, "q": "Malini Laghari, CEO of Vent Advisors, hires Rani Singh, CFA, as a portfolio manager and supervisor for the firm's five analysts. Vent does not have a compliance system in place yet, so Laghari and Singh discuss plans to implement one that follows the Code and Standards. Laghari suggests that they create a three-strike program to address analyst violations, as follows: The violator receives a warning. After each warning, the analyst's trading is monitored by Laghari for one week. After two warnings, if there is a third incident, the violator faces a more thorough investigation and disciplinary action. Singh suggests that she be the firm's compliance officer herself and take responsibility for reporting violations to Laghari for follow-up. Based on Standard IV(C) Responsibilities of Supervisors, the suggestion that constitutes adequate compliance procedures is:", "opts": ["only Singh's.", "only Laghari's.", "neither Singh's nor Laghari's."], "ans": "C", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or\nauthority complies with applicable laws, rules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors requires Members and Candidates who supervise employees to encourage employee behavior that\ncomplies with local laws, the firm's rules, and the Code and Standards. Supervisors must enforce the Code and Standards for all employees\nunder their supervision. They also must take reasonable steps to detect and prevent violations. To achieve that goal, supervisors should design a\ncompliance system that includes:\na compliance officer with clearly defined responsibilities and authority to enforce rules,\ncontinuing education and training programs, and\nan incentive structure that rewards ethical behavior.\nOnce a violation is discovered, a supervisor should:\nrespond promptly,\nconduct a thorough investigation,\nincrease the supervision and place limitations on the wrongdoer during an investigation, and\nreview procedures to prevent future violations.\nIn this scenario, neither Malini Laghari nor Rani Singh has suggested adequate compliance procedures. Laghari's suggested three-strike program\ndoes not adequately investigate and discipline violators. A thorough investigation should be conducted after any violation—even a first one—is\ndiscovered so future violations can be prevented (Choice B).\nSingh's suggested role for herself as the compliance officer does not include all the required responsibilities of that position, including the authority\nto implement the firm's compliance procedures. Singh's suggested implementation allows her to only report violations to Laghari (Choice A).\nThings to remember:\nMembers and Candidates who are supervisors should encourage behavior from their subordinates that complies with local laws, firm rules, and\nthe Code and Standards. They also must take reasonable steps to detect and prevent violations. Once a violation is discovered, a supervisor\nshould conduct a thorough investigation and review procedures to prevent future violations.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 96, "q": "Henry Boswell, CFA, is an adviser to only high-net-worth clients who have a minimum portfolio value of at least GBP 100 million. Recently, Boswell thoroughly researched a new fund, which promises high returns, although with high risks. He then purchased shares of this new fund for all of his clients since the extremely large value of their portfolios will easily absorb the additional risk. Has Boswell most likely violated Standard III(C) Suitability?", "opts": ["No, since he has performed a thorough analysis of the fund", "No, since his clients all have the ability to tolerate the fund's risk", "Yes, since he did not assess the appropriateness of the fund for each client"], "ans": "C", "expl": "1. \"When Members and Candidates are in an advisory relationship with a client, they must:\na. Make a reasonable inquiry into a client's or prospective client's investment experience, risk and return\nobjectives, and financial constraints prior to making any investment recommendation or taking\ninvestment action and must reassess and update this information regularly.\nb. Determine that an investment is suitable to the client's financial situation and consistent with the\nclient's written objectives, mandates, and constraints before making an investment recommendation\nor taking investment action.\nc. Judge the suitability of investments in the context of the client's total portfolio.\n2. When Members and Candidates are responsible for managing a portfolio to a specific mandate, strategy, or\nstyle, they must make only investment recommendations or take only investment actions that are consistent\nwith the stated objectives and constraints of the portfolio.\"\nStandard III(C) Suitability addresses the adviser's responsibilities to assess the suitability of investments for each client. The adviser does this by\nresearching each client's specific investment goals, constraints, and risk tolerance, as well as the characteristics of a proposed investment.\nHere, Boswell violates the Standard because he does not assess the new fund relative to each client's specific objectives and constraints; in fact,\nthe fund may not be suitable for each client. For example, while each client has the ability to tolerate the fund's risk, not every client may have the\nwillingness to do so (Choice B). Furthermore, the fund may contain investments that a client finds objectionable or that have adverse tax\nconsequences for a specific client.\n(Choice A) Although Boswell has prudently and thoroughly researched the fund, he violates the Standard by not determining the fund's suitability\nfor each client.\nThings to remember:\nStandard III(C) Suitability addresses the adviser's responsibilities to assess the suitability of investments for each client. The adviser does this by\nresearching each client's specific investment goals and experience, constraints, and risk tolerance, as well as the characteristics of a proposed\ninvestment.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 97, "q": "Lindsay Grant, CFA, manages the investment portfolios of six private foundations and the endowment fund of a large university while working at Limestone Partners. The endowment fund is twice the combined size of the six foundation funds. Grant believes Spire Telecom would be a great addition to all the accounts she manages. Due to the size of her accounts, she decides to submit a block trade order to Brick Wall Capital for $1.8 million of Spire Telecom, consisting of $1.2 million for the endowment and $600,000 for the six foundations. Brick Wall offers the best execution for block trades, and its commission decreases on orders over $1 million. After the trade is executed, Grant allocates the stock to her clients and charges the endowment a lower commission than the foundations since it was the endowment's allocation that triggered the decrease in commission. Limestone's policies, which are disclosed to clients, allow such a practice. Has Grant most likely violated Standard III(B) Fair Dealing? ", "opts": ["Yes.", "No, since Grant complies with Limestone's policies.", "No, since the endowment would have been charged a lower commission anyway."], "ans": "A", "expl": "\"Members and Candidates must deal fairly and objectively with all clients when providing investment analysis,\nmaking investment recommendations, taking investment action, or engaging in other professional activities.\"\nStandard III(B) Fair Dealing specifies that Members and Candidates must treat all clients fairly, specifically when disseminating investment\nrecommendations or conducting an investment action on behalf of the client. When dealing with block trades involving multiple clients, all\nclients involved should receive the same execution price and be charged the same commission. This ensures that the potential for favoritism,\nor the perception of favoritism, is limited.\nBest practice suggests that managers and advisors inform clients of firm policies. However, even if clients agree to these policies, the Standard\nstill requires that each client be treated fairly. Agreement to unfair policies does not permit the Member or Candidate to engage in practices\nconsidered unfair according to the Standards.\nIn this scenario, Lindsay Grant violates the Standard by charging the endowment a lower commission than the foundations. The block order\nsubmitted by Grant included the orders for all her clients, so all should be treated equally. This includes being charged the same commission,\ndespite the endowment being large enough to receive the lower commission on its own (Choice C). Grant should treat clients equally despite the\nLimestone Partners policy allowing for different commissions, since that policy is unfair under the Standard (Choice B).\nThings to remember:\nStandard III(B) Fair Dealing focuses on managers' responsibility to treat all clients fairly. With block trades, all clients should receive the same\nexecution price and be charged the same commission. Firm policies should be disseminated to clients, but the Standards do not permit a Member\nor Candidate to follow unfair firm policies.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 98, "q": "Whitney Hill, CFA, has notified her manager at Mercury Bank of her plans to leave Mercury and join Saturn Bank in two weeks. Hill is contacted by a potential client, Brewster Payne, looking to invest with an investment management firm. Hill is careful not to disclose that she is leaving Mercury, though she tells Payne to wait a few weeks and they can revisit the discussion. After leaving Mercury and joining Saturn, Hill calls several of Mercury's clients that she is able to find contact information for using public records; she does not contact Payne. Assuming Hill did not sign a noncompete agreement with Mercury, did she violate the Code and Standards?", "opts": ["No.", "Yes, by not trying to recruit Payne for Mercury.", "Yes, by soliciting existing Mercury clients after joining Saturn."], "ans": "B", "expl": "\"In matters related to their employment, Members and Candidates must act for the benefit of their employer and\nnot deprive their employer of the advantage of their skills and abilities, divulge confidential information, or\notherwise cause harm to their employer.\"\nStandard IV(A) Loyalty requires Members and Candidates to protect the interests of their employers. When planning to leave an employer,\nMembers and Candidates must continue to act in their current employer's best interest. This includes recruiting prospective clients to the\ncurrent employer and not contacting the employer's clients and prospective clients with the purpose of soliciting business for their own\nindependent business or another firm.\nAfter leaving an employer, a Member or Candidate may contact their former employer's clients, so long as the contact information is found\nusing public records (eg, the internet) and not from records that are property of the old firm. Additionally, the Member or Candidate must ensure\nthat they do not have a noncompete agreement with the former employer that would prohibit them from contacting the former employer's clients.\nIn this scenario, Whitney Hill violates the Standard by not trying to recruit Brewster Payne for Mercury Bank. By asking Payne to wait a few weeks\nbefore revisiting the conversation (at which time she would be at Saturn Bank), she is not acting in the best interest of Mercury and therefore\nviolates the Standard, even though she does not try to recruit Payne as a client for her new firm (Choice A).\n(Choice C) Since Hill did not sign a noncompete agreement, she did not violate the Standard by using public records to contact Mercury's clients\nafter leaving.\nThings to remember:\nStandard IV(A) Loyalty requires Members and Candidates to protect the interests of their employers. When planning to leave an employer, a\nMember or Candidate must continue to act in their employer's best interest. After leaving an employer, a Member or Candidate may contact their\nformer employer's clients if the contact information is found using public records and they do not have a noncompete agreement.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 99, "q": "Letitia Armando, CFA, works for a global investment bank. She is transferred to an office in an emerging market country. The local office staff suggest that Armando pay an unofficial \"administrative fee\" to local regulatory officials in return for ensuring that the bank receives approval on new public offerings. Armando researches local law and finds that it does not prohibit such payments and that, in fact, it is the accepted local practice. If Armando pays the officials, will she most likely violate Standard I: Professionalism?", "opts": ["No, since the payments are not illegal", "No, since the standard requires compliance with local law", "Yes, since the payments compromise the officials' objectivity"], "ans": "C", "expl": "Standard I of the CFA Institute Code and Standards focuses on four subsections of professional conduct: (A) Knowledge of the Law; (B)\nIndependence and Objectivity; (C) Misrepresentation; and (D) Misconduct. Standard I(A) Knowledge of the Law requires members and\ncandidates to know local law and the Code and Standards and to follow whichever is stricter.\n\"Members and Candidates must understand and comply with all applicable laws, rules, and regulations (including\nthe CFA Institute Code of Ethics and Standards of Professional Conduct) of any government, regulatory\norganization, licensing agency, or professional association governing their professional activities. In the event of\nconflict, Members and Candidates must comply with the more strict law, rule, or regulation. Members and\nCandidates must not knowingly participate or assist in and must dissociate from any violation of such laws, rules,\nor regulations.\"\nIn this case, the payments do not violate local laws, but the Code and Standards prescribe a more restrictive policy in Standard I(B) Independence\nand Objectivity. Standard I(B) requires members and candidates to avoid any actions that would compromise the independence and\nobjectivity of an investment professional, including a regulatory official.\n\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and\nobjectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift,\nbenefit, compensation, or consideration that reasonably could be expected to compromise their own or another's\nindependence and objectivity.\"\nSince these payments are intended to compromise the independence and objectivity of regulatory officials, by ensuring regulatory approval,\nmaking such payments is a violation of Standard I(B). Since the Code and Standards prohibit such payments and are stricter than local law, the\npayments also violate Standard I(A).\n(Choices A and B) Although the payments are not illegal and comply with local law, Armando also needs to comply with CFA Institute standards\nsince they are stricter in this case. She would violate Standard I(B)—and therefore also Standard I(A)—by making these payments.\nThings to remember:\nStandard I(A) requires members and candidates to follow local law or CFA Institute Code and Standards, whichever is stricter. An action that is\nnot prohibited under local law may still violate the Code and Standards. Actions that would compromise the independence and objectivity of an\ninvestment professional violate Standard I(B).\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct\n100. Cheng Shufen, CFA, is an independent research analyst who operates a weekly podcast in which she and her guests discuss the week's\nimportant market topics. She invites Wei Lan, CFA, a high-profile portfolio manager at Cascade Partners, to appear on an episode of the podcast.\nBefore taping the show, Cheng reaches out to Cascade's human resources (HR) manager for information on Wei's work history, which she plans\nto use to promote the podcast. The HR manager tells Cheng that Wei led a team responsible for creating a series of sector-specific exchange-\ntraded funds. However, this was not true; although Wei was part of the team, she did not in fact lead it. Cheng includes the information from the\nHR manager in the podcast's description.\nIn the months after recording the podcast, Cheng and Wei are both very busy and have no further contact. Cheng uses the podcast in her\nmarketing efforts, and Wei promotes it on social media and sends it to Cascade's prospective clients. Standard I(C) Misrepresentation has most\nlikely been violated by:\n\nA. only Wei.\nB. only Cheng.\nC. both Wei and Cheng.\nExplanation\n\"Members and Candidates must not knowingly make any misrepresentations relating to investment analysis,\nrecommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation prohibits Members and Candidates from knowingly using false or misleading statements in or omitting facts\nfrom any communication. Such misrepresentation can undermine investor trust. The Standard specifies that to violate it, a Member or Candidate\nmust knowingly mislead, meaning that the Member or Candidate either has knowledge of or should have had knowledge of the\nmisrepresentation or omission.\nIn this scenario, Wei was not involved in the creation of her biography for the podcast. However, she promoted the podcast on social media and in\nmarketing to prospective clients for months after recording it. In that time, she should have become aware of the error since it was about her work\nexperience; therefore, by continuing to use the podcast without correction, she violated the Standard.\nAlthough Cheng included in the podcast's description a misrepresentation about Wei's role in creating exchange-traded funds, the error was\nunknown to her since the information came from a reliable source (ie, Cascade Partner's human resources manager). Therefore, Cheng had no\nreason to question the information's accuracy. As long as Cheng corrects the error if and when it becomes known to her, she will not have violated\nthe Standard (Choices B and C).\nThings to remember:\nStandard I(C) Misrepresentation prohibits Members and Candidates from knowingly using false or misleading statements in or omitting facts from\nany communication. To violate the Standard, a Member or Candidate must either have knowledge of or should have had knowledge of the\nmisrepresentation or omission.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 100, "q": "Cheng Shufen, CFA, is an independent research analyst who operates a weekly podcast in which she and her guests discuss the week's important market topics. She invites Wei Lan, CFA, a high-profile portfolio manager at Cascade Partners, to appear on an episode of the podcast. Before taping the show, Cheng reaches out to Cascade's human resources (HR) manager for information on Wei's work history, which she plans to use to promote the podcast. The HR manager tells Cheng that Wei led a team responsible for creating a series of sector-specific exchange- traded funds. However, this was not true; although Wei was part of the team, she did not in fact lead it. Cheng includes the information from the HR manager in the podcast's description. In the months after recording the podcast, Cheng and Wei are both very busy and have no further contact. Cheng uses the podcast in her marketing efforts, and Wei promotes it on social media and sends it to Cascade's prospective clients. Standard I(C) Misrepresentation has most likely been violated by: ", "opts": ["only Wei.", "only Cheng.", "both Wei and Cheng."], "ans": "A", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment analysis,\nrecommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation prohibits Members and Candidates from knowingly using false or misleading statements in or omitting facts\nfrom any communication. Such misrepresentation can undermine investor trust. The Standard specifies that to violate it, a Member or Candidate\nmust knowingly mislead, meaning that the Member or Candidate either has knowledge of or should have had knowledge of the\nmisrepresentation or omission.\nIn this scenario, Wei was not involved in the creation of her biography for the podcast. However, she promoted the podcast on social media and in\nmarketing to prospective clients for months after recording it. In that time, she should have become aware of the error since it was about her work\nexperience; therefore, by continuing to use the podcast without correction, she violated the Standard.\nAlthough Cheng included in the podcast's description a misrepresentation about Wei's role in creating exchange-traded funds, the error was\nunknown to her since the information came from a reliable source (ie, Cascade Partner's human resources manager). Therefore, Cheng had no\nreason to question the information's accuracy. As long as Cheng corrects the error if and when it becomes known to her, she will not have violated\nthe Standard (Choices B and C).\nThings to remember:\nStandard I(C) Misrepresentation prohibits Members and Candidates from knowingly using false or misleading statements in or omitting facts from\nany communication. To violate the Standard, a Member or Candidate must either have knowledge of or should have had knowledge of the\nmisrepresentation or omission.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 101, "q": "Feng Wei, CFA, manages 47 traders for Full Moon Financial. Due to the large number of subordinates, Feng decides to delegate some of his supervisory duties to Qian Yong, a non-CFA charterholder, so that Feng can focus on other responsibilities. Responsibilities delegated to Qian include the monitoring and evaluation of compliance for each employee reporting to Feng. Feng instructs Qian on methods to enforce compliance based on local laws, firm rules, and the Code and Standards. Has Feng most likely violated Standard IV(C) Responsibilities of Supervisors? ", "opts": ["No.", "Yes, since he needs to evaluate his employees' conduct himself.", "Yes, since he delegates evaluation of employees' conduct to a non-CFA charterholder."], "ans": "A", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or\nauthority complies with applicable laws, rules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors requires Members and Candidates who supervise employees to encourage behavior that\ncomplies with local laws, rules established by their firms, and the Code and Standards. They must also take reasonable steps to detect and\nprevent violations.\nUnder the Standard, supervisors who supervise large numbers of employees are allowed to delegate supervision (Choice B). The employee to\nwhom those supervisory responsibilities are delegated does not have to be a CFA charterholder (Choice C). However, the supervisor has the\nresponsibility to instruct that employee on methods to promote compliance, including preventing and detecting violations. The supervisor still\nbears ultimate responsibility even though some day-to-day oversight has been delegated.\nThings to remember:\nMembers and Candidates who are supervisors are required to encourage behavior that complies with local laws, firm rules, and the Code and\nStandards. They must also take reasonable steps to detect and prevent violations. Supervisors can delegate supervisory responsibility to another\nemployee but are required to instruct that employee on methods to promote compliance.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 102, "q": "Anabella Sanchez, CFA, is the CFO of Perrello Enterprises, a software security firm. As part of her compensation, she has received call options on Perrello stock that can be exercised in five years. Next week, Sanchez plans to meet with a research analyst in front of an invited audience at a conference to discuss Perello's strategic direction and wishes to mention the company's plans to speed its expansion through acquisitions. To avoid disclosing material information in a nonpublic forum, Sanchez instructs the company's media director to immediately issue a press release stating the company's intent to evaluate acquisition targets. The press release excites investors, who drive up Perello's stock price by 5%. Have Sanchez's actions most likely violated Standard II(B) Market Manipulation? ", "opts": ["No", "Yes, by issuing the press release about the company's acquisition plans", "Yes, by discussing the company's strategic plans at the investor conference"], "ans": "A", "expl": "\"Members and Candidates must not engage in practices that distort prices or artificially inflate trading volume with the intent to\nmislead market participants.\"\nStandard II(B) Market Manipulation prohibits activities by Members or Candidates that distort securities prices. Manipulation can occur through\nInformation-based activities, such as spreading false rumors, or\nTransaction-based activities, such as exaggerated trading between two accounts\nManipulation can lead to a loss of trust in the fairness and integrity of the markets. The Member's or Candidate's intent determines whether he or\nshe has violated the Standard. Actions that move security prices but were not intended to deceive market participants do not violate the\nStandard.\nIn this scenario, Perrello Enterprises is reviewing acquisitions, so the statements made by Anabella Sanchez are not false or misleading. Sanchez\ndid not intend to deceive or manipulate the market by issuing the press release. Her intention was to educate investors on the strategic direction\nof the company so they can make informed investment decisions, and therefore did not violate the Standard (Choices B and C). The fact that the\npress release caused an increase in the stock price does not mean the Standard is violated.\nThings to remember:\nStandard II(B) Market Manipulation prohibits information-based and transaction-based activities that distort security prices. The intent of the action\nis the determining factor in deciding whether a Member or Candidate violated the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 103, "q": "Jorge Martinez is frustrated about failing the Level II CFA exam three times but signs up to take it again next year. He sees an article written by CFA Institute on a key issue. Martinez does not agree with the article and decides to write about it and other issues on a social media account: \"CFA Institute should think carefully about posting advocacy articles on key issues that I and others disagree with. They can give potential employers the impression that all charterholders agree with CFA Institute when that is rarely the case. In addition, CFA Institute's procedures are too strict. For instance, why are we allowed to use only two calculators when there are others that are better? Get with the times!\" By posting this on social media, does Martinez most likely violate Standard VII(A) Conduct as Participants in CFA Institute Programs? ", "opts": ["No", "Yes, by publicly disagreeing with CFA Institute exam policies", "Yes, by publicly disagreeing with CFA Institute stances on key issues"], "ans": "A", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA\nInstitute or the CFA designation or the integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) Conduct as Participants in CFA Institute Programs mandates that Members and Candidates act ethically when involved in any\nCFA Institute programs, including the CFA exams. The Standard prohibits behavior that compromises the public's confidence in the level of merit\nneeded to achieve a CFA charter. It also encompasses CFA Institute's other credentialing programs.\nThe Standard allows Members and Candidates to share opinions that disagree with CFA Institute policies (eg, allowing only two types of\ncalculators) and stances on key issues (eg, advocacy articles). Members and Candidates are allowed to share opinions about the exams or CFA\nInstitute as long as the opinions do not reveal specific information about the exams. In this scenario, since Jorge Martinez's post does not\nreveal confidential information about the exams, he does not violate the Standard, although he disagrees with CFA Institute (Choices B and C).\nThings to remember:\nStandard VII(A) mandates that Members and Candidates act ethically when involved in CFA Institute programs. It prohibits behavior that\ncompromises the public's confidence in the CFA charter. However, Members and Candidates are allowed to share opinions about, and even in\nopposition to, CFA Institute policies and stances on key issues as long as they do not reveal confidential exam information.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 104, "q": "Liam Haughton, CFA, is an investment strategist at Joffery Securities, Ltd. (JSL). Through his meticulous research, he develops an algorithm that delivers exceptional risk-adjusted performance using a complex trading process. JSL wants to market this discovery as an additional service to its current and prospective clients. Haughton prepares the communication to advise clients about the algorithm and strategy but is concerned that most clients will be unable to comprehend it. He does not detail his algorithm, valuation models, or asset allocation structures in his communications. He believes clients need to know the changes in the portfolio and how they impact performance. Haughton settles on discussing how the three biggest trades impact performance in his monthly report. With respect to Standard V(B) Communication with Clients and Prospective Clients, Haughton most likely:", "opts": ["violates the Standard since he does not explain the complex trading process.", "violates the Standard since he does not disclose the strategy's limitations and risks.", "does not violate the Standard since he describes the significant trades impacting performance."], "ans": "B", "expl": "\"Members and Candidates must:\nDisclose to client and prospective clients the basic format and general principles of the investment processes they use to analyze\ninvestments, select securities, and construct portfolios and must promptly disclose any changes that might materially affect those\nprocesses.\"\nStandard V(B) Communication with Clients and Prospective Clients requires members and candidates to disclose to current and prospective\nclients the basic format of investment processes
