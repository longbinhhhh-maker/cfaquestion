<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n":1,"q":"Compared to developed economies, developing economies are more likely to experience:","opts":["high rates of savings and investment.","policies which encourage entrepreneurship.","restrictions on international trade and flows of capital"],"ans":"C","expl":"C is correct because developing countries differ significantly from developed countries in terms of their institutional structure and their legal and political environments. Lack of appropriate institutions and poor legal and political environments restrain growth in the developing economies and partially explain why these countries are poor and experience slow growth. Factors limiting growth include restrictions on international trade and flows of capital.","explhtml":"<p>C is correct because developing countries differ significantly from developed countries in terms of their institutional structure and their legal and political environments. Lack of appropriate institutions and poor legal and political environments restrain growth in the developing economies and partially explain why these countries are poor and experience slow growth. Factors limiting growth include restrictions on international trade and flows of capital.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Compared to developed economies, developing economies are more likely to experience:<\/p><\/div>","subj":"economics"},{"n":2,"q":"When considering the factors that facilitate economic growth, which of the following statements is most accurate? Compared to a developed country, a developing country:","opts":["should invest in primary and secondary education vs. post-secondary education.","will have higher rates of domestic savings due to fewer opportunities in capital markets.","should pass regulations impeding foreign direct investment to protect domestic markets."],"ans":"A","expl":"A is correct because developing countries, which largely apply technology developed elsewhere, should emphasize primary and secondary education. Developed countries need to invest in post-secondary education to encourage innovation and growth.","explhtml":"<p>A is correct because developing countries, which largely apply technology developed elsewhere, should emphasize primary and secondary education. Developed countries need to invest in post-secondary education to encourage innovation and growth.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>When considering the factors that facilitate economic growth, which of the following statements is most accurate? Compared to a developed country, a developing country:<\/p><\/div>","subj":"economics"},{"n":3,"q":"Earnings growth is most likely to exceed GDP growth when the ratio of corporate profits to GDP is:","opts":["trending downward over time.","flat.","trending upward over time."],"ans":"C","expl":"C is correct because for earnings growth to exceed GDP growth, the ratio of corporate profits to GDP must trend upward over time.","explhtml":"<p>C is correct because for earnings growth to exceed GDP growth, the ratio of corporate profits to GDP must trend upward over time.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Earnings growth is most likely to exceed GDP growth when the ratio of corporate profits to GDP is:<\/p><\/div>","subj":"economics"},{"n":4,"q":"Country X has experienced a high real economic growth rate over a long period, but has reported a relatively low real return on equity. According to Grinold–Kroner, which of the following is most likely the reason for this discrepancy?","opts":["An increase in the expected repricing term related to the P/E ratios in the market","An increase in dilution effects from the privatization of large state-owned enterprises","A decrease in the relative dynamism of the economy coming from small-sized and medium-sized entrepreneurial firms"],"ans":"B","expl":"B is correct because according to Grinold-Kroner (2002): Expected return to equity, E(Re) = dividend yield + expected repricing + inflation rate + real economic growth – change in shares outstanding = dy + Δ(P/E) + i + g – ΔS. The change in shares outstanding, ΔS, termed the dilution effect, plays an important role in determining expected equity returns. China has the highest real economic growth rate over the period (8.2% annual) but a relatively low real return to equity (0.7%), because of significant dilution effects arising from the privatization of large state-owned enterprises.","explhtml":"<p>B is correct because according to Grinold-Kroner (2002): Expected return to equity, E(Re) = dividend yield + expected repricing + inflation rate + real economic growth – change in shares outstanding = dy + Δ(P/E) + i + g – ΔS. The change in shares outstanding, ΔS, termed the dilution effect, plays an important role in determining expected equity returns. China has the highest real economic growth rate over the period (8.2% annual) but a relatively low real return to equity (0.7%), because of significant dilution effects arising from the privatization of large state-owned enterprises.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Country X has experienced a high real economic growth rate over a long period, but has reported a relatively low real return on equity. According to Grinold–Kroner, which of the following is most likely the reason for this discrepancy?<\/p><\/div>","subj":"economics"},{"n":5,"q":"Based on the Grinold–Kroner model, which of the following factors is the primary channel through which economic growth can impact equity returns?","opts":["Dividend yield","Earnings growth per share","Expected repricing term of the market's P/E ratio"],"ans":"B","expl":"B is Correct because earnings growth per share is the primary channel through which economic growth can impact equity returns.","explhtml":"<p>B is Correct because earnings growth per share is the primary channel through which economic growth can impact equity returns.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Based on the Grinold–Kroner model, which of the following factors is the primary channel through which economic growth can impact equity returns?<\/p><\/div>","subj":"economics"},{"n":6,"q":"All else being equal, as economic growth from firms not listed on the stock market increases, divergence between total economic growth and the earnings growth of listed companies:","opts":["decreases.","remains unchanged.","increases."],"ans":"C","expl":"C is Correct because the wedge between economic growth and equity returns arises for at least two reasons. The second effect is due to some part of economic growth coming from small- and medium-sized entrepreneurial firms that are not traded publicly on the stock market. The greater this effect, termed the relative dynamism of the economy, rd, the greater the divergence between economic growth in the economy as a whole and the earnings growth of companies listed on the stock market.","explhtml":"<p>C is Correct because the wedge between economic growth and equity returns arises for at least two reasons. The second effect is due to some part of economic growth coming from small- and medium-sized entrepreneurial firms that are not traded publicly on the stock market. The greater this effect, termed the relative dynamism of the economy, rd, the greater the divergence between economic growth in the economy as a whole and the earnings growth of companies listed on the stock market.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>All else being equal, as economic growth from firms not listed on the stock market increases, divergence between total economic growth and the earnings growth of listed companies:<\/p><\/div>","subj":"economics"},{"n":7,"q":"Which of the following statements about potential GDP growth rates is most accurate?","opts":["Faster growth in potential GDP translates into higher real interest rates","Actual GDP growth above the potential GDP growth rate puts downward pressure on inflation","A lower rate of potential GDP growth improves the general credit quality of fixed- income securities"],"ans":"A","expl":"A is Correct because the growth rate of potential GDP is also an important factor for the level of real interest rates and, therefore, real asset returns in general. Faster growth in potential GDP translates into higher real interest rates and higher expected real asset returns in general. Higher real interest rates are required to induce savings to fund capital accumulation, which in turn can fuel higher potential GDP growth rates","explhtml":"<p>A is Correct because the growth rate of potential GDP is also an important factor for the level of real interest rates and, therefore, real asset returns in general. Faster growth in potential GDP translates into higher real interest rates and higher expected real asset returns in general. Higher real interest rates are required to induce savings to fund capital accumulation, which in turn can fuel higher potential GDP growth rates<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Which of the following statements about potential GDP growth rates is most accurate?<\/p><\/div>","subj":"economics"},{"n":8,"q":"The discrepancy often found between economic growth and equity returns is most likely explained by:","opts":["share buybacks only.","the issuance of new shares only.","both share buybacks and the issuance of new shares."],"ans":"C","expl":"C is Correct because when the number of shares outstanding in a market is constant, real economic growth translates into higher expected returns on equity. The empirical evidence on the existence of a direct relationship between economic growth and equity returns is conflicting and suggests that the change in shares outstanding, ΔS, termed the dilution effect, plays an important role in determining expected equity returns. This wedge between economic growth and equity returns arises for at least two reasons. The first reason is that publicly traded companies either buy back their shares and increase equity returns by decreasing shares outstanding, or issue new shares and dilute existing shareholder returns.","explhtml":"<p>C is Correct because when the number of shares outstanding in a market is constant, real economic growth translates into higher expected returns on equity. The empirical evidence on the existence of a direct relationship between economic growth and equity returns is conflicting and suggests that the change in shares outstanding, ΔS, termed the dilution effect, plays an important role in determining expected equity returns. This wedge between economic growth and equity returns arises for at least two reasons. The first reason is that publicly traded companies either buy back their shares and increase equity returns by decreasing shares outstanding, or issue new shares and dilute existing shareholder returns.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>The discrepancy often found between economic growth and equity returns is most likely explained by:<\/p><\/div>","subj":"economics"},{"n":9,"q":"For a developed country with a fixed number of workers, which of the following most likely results in the largest increase in per capita output?","opts":["Increasing business investment","Loosening restrictions on foreign investment","Increasing investment on research and development"],"ans":"C","expl":"C is Correct because an increase in spending on research and development will increase total factor productivity (TFP) and thus output per worker. Developing countries have the potential to grow through both capital deepening and technological progress, whereas improvement in potential GDP growth in developed countries is largely driven by technological progress.","explhtml":"<p>C is Correct because an increase in spending on research and development will increase total factor productivity (TFP) and thus output per worker. Developing countries have the potential to grow through both capital deepening and technological progress, whereas improvement in potential GDP growth in developed countries is largely driven by technological progress.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>For a developed country with a fixed number of workers, which of the following most likely results in the largest increase in per capita output?<\/p><\/div>","subj":"economics"},{"n":10,"q":"An analyst gathers the following economic data about three countries: All else being equal, which country would most likely experience the greatest increase in per capita economic growth as a result of capital deepening?","opts":["Country 1","Country 2","Country 3"],"ans":"C","expl":"C is Correct because Country 3 has the lowest capital-to-labor ratio and would therefore benefit most from increases in capital spending in the long-term, all else being equal. We calculate the amount of capital available for each worker as total capital divided by size of workforce. For Country 3: $560 billion/15 million = $37,333 of capital per worker. Capital deepening, an increase in the capital-to-labor ratio reflects rising investment in the economy. The ratio will increase as long as the growth rate of capital (net investment) exceeds the growth rate of labor. Once the capital-to-labor ratio becomes very high, however, further additions to capital have relatively little impact on per capita output. This dynamic occurs because the marginal product of capital declines as more capital is added to the labor input. At the point at which the marginal product of capital equals its marginal cost, profit maximizing producers will stop adding capital (i.e., stop increasing the capital-to- labor ratio). Once the economy reaches this steady state, capital deepening cannot be a source of sustained growth in the economy. Only when the economy is operating below the steady state and when the marginal product of capital exceeds its marginal cost can capital deepening raise per capita growth.","explhtml":"<p>C is Correct because Country 3 has the lowest capital-to-labor ratio and would therefore benefit most from increases in capital spending in the long-term, all else being equal. We calculate the amount of capital available for each worker as total capital divided by size of workforce. For Country 3: $560 billion/15 million = $37,333 of capital per worker. Capital deepening, an increase in the capital-to-labor ratio reflects rising investment in the economy. The ratio will increase as long as the growth rate of capital (net investment) exceeds the growth rate of labor. Once the capital-to-labor ratio becomes very high, however, further additions to capital have relatively little impact on per capita output. This dynamic occurs because the marginal product of capital declines as more capital is added to the labor input. At the point at which the marginal product of capital equals its marginal cost, profit maximizing producers will stop adding capital (i.e., stop increasing the capital-to- labor ratio). Once the economy reaches this steady state, capital deepening cannot be a source of sustained growth in the economy. Only when the economy is operating below the steady state and when the marginal product of capital exceeds its marginal cost can capital deepening raise per capita growth.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>An analyst gathers the following economic data about three countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp075.webp\" style=\"max-width:min(100%,428px)\" alt=\"\"><p>All else being equal, which country would most likely experience the greatest increase in per capita economic growth as a result of capital deepening?<\/p><\/div>","subj":"economics"},{"n":11,"q":"When total factor productivity increases, the capital-to-labor ratio will most likely:","opts":["decrease.","remain unchanged.","increase."],"ans":"C","expl":"C is Correct because increasing total factor productivity (TFP) (reflecting the general level of productivity or technology in the economy) will result in an increase in the capital-to-labor ratio, which is also known as capital deepening. Note that once technological progress (TFP growth) is introduced, the capital-to-labor ratio will have to keep increasing just to keep the marginal productivity of capital equal to its marginal cost. But the point remains: Once that equality is attained, companies will not increase the capital-to-labor ratio faster than is necessary to maintain that equality.","explhtml":"<p>C is Correct because increasing total factor productivity (TFP) (reflecting the general level of productivity or technology in the economy) will result in an increase in the capital-to-labor ratio, which is also known as capital deepening. Note that once technological progress (TFP growth) is introduced, the capital-to-labor ratio will have to keep increasing just to keep the marginal productivity of capital equal to its marginal cost. But the point remains: Once that equality is attained, companies will not increase the capital-to-labor ratio faster than is necessary to maintain that equality.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>When total factor productivity increases, the capital-to-labor ratio will most likely:<\/p><\/div>","subj":"economics"},{"n":12,"q":"An analyst gathers the following information about a country's economy: Based on the growth accounting equation, the potential annual GDP growth of the economy is closest to:","opts":["1.88%.","2.17%.","2.80%."],"ans":"A","expl":"A is Correct because growth in potential GDP = ΔA/A + αΔK/K + (1 − α)ΔL/L = 0.0125 + (0.47)×(0.0325) + (0.53)×(−0.017) = 1.8765% ≈ 1.88%, where ΔA/A = annual growth in total factor productivity = 1.25%, α = capital share of output = 1 − labor share of output = 1 − 53% = 47%, ΔK/K = annual growth in capital = 3.25%, and ΔL/L = annual growth in labor = –1.70%. The growth accounting equation is essentially the production function written in the form of growth rates. ΔY/Y = ΔA/A + αΔK/K + (1 − α)ΔL/L The growth accounting equation states that the growth rate of output equals the rate of technological change plus α times the growth rate of capital plus (1 − α) multiplied by the growth rate of labor.","explhtml":"<p>A is Correct because growth in potential GDP = ΔA/A + αΔK/K + (1 − α)ΔL/L = 0.0125 + (0.47)×(0.0325) + (0.53)×(−0.017) = 1.8765% ≈ 1.88%, where ΔA/A = annual growth in total factor productivity = 1.25%, α = capital share of output = 1 − labor share of output = 1 − 53% = 47%, ΔK/K = annual growth in capital = 3.25%, and ΔL/L = annual growth in labor = –1.70%. The growth accounting equation is essentially the production function written in the form of growth rates. ΔY/Y = ΔA/A + αΔK/K + (1 − α)ΔL/L The growth accounting equation states that the growth rate of output equals the rate of technological change plus α times the growth rate of capital plus (1 − α) multiplied by the growth rate of labor.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a country&#x27;s economy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp076.webp\" style=\"max-width:min(100%,435px)\" alt=\"\"><p>Based on the growth accounting equation, the potential annual GDP growth of the economy is closest to:<\/p><\/div>","subj":"economics"},{"n":13,"q":"Based on the Cobb–Douglas production function, diminishing marginal productivity does not occur when:","opts":["only labor input is increased.","only capital is increased.","both labor input and capital input are increased proportionally."],"ans":"C","expl":"C is Correct because the exponents on the K (quantity of labor) and L (estimate of the capital services provided by the stock of equipment and structures used to produce goods and services) variables in the Cobb–Douglas production function sum to one, indicating constant returns to scale—that is, there are no diminishing marginal returns if both inputs are increased proportionately.","explhtml":"<p>C is Correct because the exponents on the K (quantity of labor) and L (estimate of the capital services provided by the stock of equipment and structures used to produce goods and services) variables in the Cobb–Douglas production function sum to one, indicating constant returns to scale—that is, there are no diminishing marginal returns if both inputs are increased proportionately.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Based on the Cobb–Douglas production function, diminishing marginal productivity does not occur when:<\/p><\/div>","subj":"economics"},{"n":14,"q":"Which of the following is treated as exogenous in the GDP growth accounting equation?","opts":["Growth rate of labor","Growth rate of capital","Rate of technological change"],"ans":"C","expl":"C is Correct because the growth accounting equation states that the growth rate of output equals the rate of technological change plus α times the growth rate of capital plus (1 − α) multiplied by the growth rate of labor. The rate of technological change is not directly measured and must therefore be estimated. The standard methodology treats TFP, technological growth, as exogenous and estimates its growth rate using various time-series models.","explhtml":"<p>C is Correct because the growth accounting equation states that the growth rate of output equals the rate of technological change plus α times the growth rate of capital plus (1 − α) multiplied by the growth rate of labor. The rate of technological change is not directly measured and must therefore be estimated. The standard methodology treats TFP, technological growth, as exogenous and estimates its growth rate using various time-series models.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Which of the following is treated as exogenous in the GDP growth accounting equation?<\/p><\/div>","subj":"economics"},{"n":15,"q":"A country depending on strong demand for export of its natural resources may find its economic growth limited over time due to:","opts":["a limited supply of labor.","rapid currency depreciation.","an inability to compete globally in manufacturing."],"ans":"C","expl":"C is Correct because countries rich in resources may suffer the Dutch disease, where currency appreciation driven by strong export demand for resources makes other segments of the economy, in particular manufacturing, globally uncompetitive. The strength of the country's currency, driven by demand for resources, makes its manufactured goods more expensive and thus uncompetitive.","explhtml":"<p>C is Correct because countries rich in resources may suffer the Dutch disease, where currency appreciation driven by strong export demand for resources makes other segments of the economy, in particular manufacturing, globally uncompetitive. The strength of the country&#x27;s currency, driven by demand for resources, makes its manufactured goods more expensive and thus uncompetitive.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>A country depending on strong demand for export of its natural resources may find its economic growth limited over time due to:<\/p><\/div>","subj":"economics"},{"n":16,"q":"An analyst gathers the following economic data for three countries with below-average GDP growth: Based only on this information, the country that most likely suffers from the Dutch disease is:","opts":["Country 1.","Country 2.","Country 3."],"ans":"C","expl":"C is Correct because countries rich in resources may suffer the Dutch disease, where currency appreciation driven by strong export demand for resources makes other segments of the economy, in particular manufacturing, globally uncompetitive. The name for this phenomenon comes from the experience of the Netherlands: Following the discovery of large natural gas fields in the Netherlands, the Dutch guilder (the nation’s currency at that time) appreciated and the manufacturing sector contracted. Because of this contraction, the resource-rich country does not participate in the TFP progress that occurs in countries with more vigorous manufacturing sectors. Country 3 best fits the criteria for Dutch disease: rich in resources, a strong currency and low productivity and GDP growth.","explhtml":"<p>C is Correct because countries rich in resources may suffer the Dutch disease, where currency appreciation driven by strong export demand for resources makes other segments of the economy, in particular manufacturing, globally uncompetitive. The name for this phenomenon comes from the experience of the Netherlands: Following the discovery of large natural gas fields in the Netherlands, the Dutch guilder (the nation’s currency at that time) appreciated and the manufacturing sector contracted. Because of this contraction, the resource-rich country does not participate in the TFP progress that occurs in countries with more vigorous manufacturing sectors. Country 3 best fits the criteria for Dutch disease: rich in resources, a strong currency and low productivity and GDP growth.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>An analyst gathers the following economic data for three countries with below-average GDP growth:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp077.webp\" style=\"max-width:min(100%,603px)\" alt=\"\"><p>Based only on this information, the country that most likely suffers from the Dutch disease is:<\/p><\/div>","subj":"economics"},{"n":17,"q":"As the rate of immigration in developed countries increases, economic growth:","opts":["decreases.","does not change.","increases."],"ans":"C","expl":"C is Correct because a factor increasing economic and population growth, especially among the developed countries, is immigration. The open-border policies of both countries led to a significant population of immigrants that contributed to a large increase in labor input for both countries. Growth in the number of people available for work (quantity of workforce) is an important source of economic growth. The growth accounting equation states that the growth rate of output equals the rate of technological change plus α times the growth rate of capital plus (1 − α) multiplied by the growth rate of labor.","explhtml":"<p>C is Correct because a factor increasing economic and population growth, especially among the developed countries, is immigration. The open-border policies of both countries led to a significant population of immigrants that contributed to a large increase in labor input for both countries. Growth in the number of people available for work (quantity of workforce) is an important source of economic growth. The growth accounting equation states that the growth rate of output equals the rate of technological change plus α times the growth rate of capital plus (1 − α) multiplied by the growth rate of labor.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>As the rate of immigration in developed countries increases, economic growth:<\/p><\/div>","subj":"economics"},{"n":18,"q":"Which of the following most likely increases the growth rate of per capita GDP?","opts":["Immigration","Population growth","The labor force participation rate"],"ans":"C","expl":"C is Correct because in contrast to population, an increase in the participation rate may raise the growth of per capita GDP.","explhtml":"<p>C is Correct because in contrast to population, an increase in the participation rate may raise the growth of per capita GDP.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Which of the following most likely increases the growth rate of per capita GDP?<\/p><\/div>","subj":"economics"},{"n":19,"q":"An economist gathers the following historical information on select economic variables: Based only on this information, which country is most likely to forecast the highest potential sustainable rate of economic growth?","opts":["Country 1","Country 2","Country 3"],"ans":"C","expl":"C is Correct because Country 3 is to forecast the highest potential sustainable GDP growth rate. Demographic factors (i.e., the number of workers available to enter the workforce) can positively or negatively contribute to a country’s sustainable rate of economic growth. Country 3 (compared to Country 1 and Country 2) has the highest share of the population under the age of 16 and the lowest share of the population over the age of 65. Over the next decade, Country 3 will receive a demographic benefit because of the high percentage of young people entering the workforce. All else being equal, this implies higher growth of the labor force and hence higher growth of potential GDP. From an historical point of view, the population growth rates of Country 1 and 2 (mainly driven by net migration) were slightly above the population growth rates of Country 3. However, a high pace of immigration for Country 1 and 2 is not sustainable and is likely to slow, which will result in slower growth in both the population and the labor force. In sum, the lack of (potential) population growth and a rapidly aging population in Country 1 and 2 will limit their potential rate of growth. Potential GDP growth in Country 3 should receive a boost from its favorable population trends.","explhtml":"<p>C is Correct because Country 3 is to forecast the highest potential sustainable GDP growth rate. Demographic factors (i.e., the number of workers available to enter the workforce) can positively or negatively contribute to a country’s sustainable rate of economic growth. Country 3 (compared to Country 1 and Country 2) has the highest share of the population under the age of 16 and the lowest share of the population over the age of 65. Over the next decade, Country 3 will receive a demographic benefit because of the high percentage of young people entering the workforce. All else being equal, this implies higher growth of the labor force and hence higher growth of potential GDP. From an historical point of view, the population growth rates of Country 1 and 2 (mainly driven by net migration) were slightly above the population growth rates of Country 3. However, a high pace of immigration for Country 1 and 2 is not sustainable and is likely to slow, which will result in slower growth in both the population and the labor force. In sum, the lack of (potential) population growth and a rapidly aging population in Country 1 and 2 will limit their potential rate of growth. Potential GDP growth in Country 3 should receive a boost from its favorable population trends.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>An economist gathers the following historical information on select economic variables:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp078.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Based only on this information, which country is most likely to forecast the highest potential sustainable rate of economic growth?<\/p><\/div>","subj":"economics"},{"n":20,"q":"The impact from investment spending on a country's GDP growth rate is:","opts":["independent from the size of the existing physical capital stock.","larger when the country's existing physical capital stock is small.","larger when the country's existing physical capital stock is large."],"ans":"B","expl":"B is Correct because although diminishing marginal productivity will eventually limit the impact of capital deepening, investment-driven growth may last for a considerable period, especially in countries that start with relatively low levels of capital per worker. Moreover, the impact of investment spending on available capital depends on the existing physical capital stock. As with the share of GDP devoted to investment, the stock of capital available per worker varies significantly across countries. The wide difference in physical capital per worker suggests that the positive impact of changes in the physical capital stock on growth is very significant in developing countries. Mexican workers have relatively little access to machinery or equipment, so adding even a little can make a big percentage difference. In developed countries, such as the United States, Japan, Germany, France, and the United Kingdom, the physical capital stock is so large that positive net investment in any given year has only a small percentage effect on the accumulated capital stock. For the developed countries, a sustained high level of investment over many years is required to have a meaningful relative impact on the physical capital stock even though the absolute size of the increase in any given year is still larger than in the developing countries.","explhtml":"<p>B is Correct because although diminishing marginal productivity will eventually limit the impact of capital deepening, investment-driven growth may last for a considerable period, especially in countries that start with relatively low levels of capital per worker. Moreover, the impact of investment spending on available capital depends on the existing physical capital stock. As with the share of GDP devoted to investment, the stock of capital available per worker varies significantly across countries. The wide difference in physical capital per worker suggests that the positive impact of changes in the physical capital stock on growth is very significant in developing countries. Mexican workers have relatively little access to machinery or equipment, so adding even a little can make a big percentage difference. In developed countries, such as the United States, Japan, Germany, France, and the United Kingdom, the physical capital stock is so large that positive net investment in any given year has only a small percentage effect on the accumulated capital stock. For the developed countries, a sustained high level of investment over many years is required to have a meaningful relative impact on the physical capital stock even though the absolute size of the increase in any given year is still larger than in the developing countries.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>The impact from investment spending on a country&#x27;s GDP growth rate is:<\/p><\/div>","subj":"economics"},{"n":21,"q":"Which of the following forms of investment is least likely to create a sustainable increase in economic growth?","opts":["Building a new university","Improving the electrical grid","Purchasing construction equipment"],"ans":"C","expl":"C is Correct because the other category of investment, non-ICT capital spending, includes non-residential construction, transport equipment, and machinery. High levels of capital spending for this category should eventually result in capital deepening and thus have less impact on potential GDP growth. In contrast, a growing share of ICT investments in the economy, through their externality impacts, may actually boost the growth rate of potential GDP.","explhtml":"<p>C is Correct because the other category of investment, non-ICT capital spending, includes non-residential construction, transport equipment, and machinery. High levels of capital spending for this category should eventually result in capital deepening and thus have less impact on potential GDP growth. In contrast, a growing share of ICT investments in the economy, through their externality impacts, may actually boost the growth rate of potential GDP.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Which of the following forms of investment is least likely to create a sustainable increase in economic growth?<\/p><\/div>","subj":"economics"},{"n":22,"q":"An analyst gathers the following information about three countries: Based on the labor productivity growth accounting equation, the country with the highest GDP growth potential is:","opts":["Country 1.","Country 2.","Country 3."],"ans":"C","expl":"C is Correct because the labor productivity growth accounting equation can be used to measure potential GDP. Under this approach, the equation for estimating potential GDP is: Growth rate in potential GDP = Long-term growth rate of labor force + Long-term growth rate in labor productivity. Thus, potential GDP growth is a combination of the long-term growth rate of the labor force and the long-term growth rate of labor productivity. Growth rate in potential GDP (Country 3) = Long-term growth rate of labor + Long- term growth rate in labor productivity = –0.5% + 2.0% = 1.5%, being the highest of the three countries.","explhtml":"<p>C is Correct because the labor productivity growth accounting equation can be used to measure potential GDP. Under this approach, the equation for estimating potential GDP is: Growth rate in potential GDP = Long-term growth rate of labor force + Long-term growth rate in labor productivity. Thus, potential GDP growth is a combination of the long-term growth rate of the labor force and the long-term growth rate of labor productivity. Growth rate in potential GDP (Country 3) = Long-term growth rate of labor + Long- term growth rate in labor productivity = –0.5% + 2.0% = 1.5%, being the highest of the three countries.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp079.webp\" style=\"max-width:min(100%,593px)\" alt=\"\"><p>Based on the labor productivity growth accounting equation, the country with the highest GDP growth potential is:<\/p><\/div>","subj":"economics"},{"n":23,"q":"Which of the following growth theories assumes that technological progress translates into higher population growth?","opts":["Classical model","Neoclassical model","Endogenous growth model"],"ans":"A","expl":"A is Correct because the key assumption underlying the classical model is that population growth accelerates when the level of per capita income rises above the subsistence income, which is the minimum income needed to maintain life. This means that technological progress and land expansion, which increase labor productivity, translate into higher population growth. But because the labor input faces diminishing marginal returns, the additional output produced by the growing workforce eventually declines to zero. Ultimately, the population grows so much that labor productivity falls and per capita income returns back to the subsistence level. The classical model predicts that in the long run, the adoption of new technology results in a larger but not richer population.","explhtml":"<p>A is Correct because the key assumption underlying the classical model is that population growth accelerates when the level of per capita income rises above the subsistence income, which is the minimum income needed to maintain life. This means that technological progress and land expansion, which increase labor productivity, translate into higher population growth. But because the labor input faces diminishing marginal returns, the additional output produced by the growing workforce eventually declines to zero. Ultimately, the population grows so much that labor productivity falls and per capita income returns back to the subsistence level. The classical model predicts that in the long run, the adoption of new technology results in a larger but not richer population.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Which of the following growth theories assumes that technological progress translates into higher population growth?<\/p><\/div>","subj":"economics"},{"n":24,"q":"In contrast to the classical and neoclassical growth models, which of the following is an implication of the endogenous growth model?","opts":["Higher savings does not permanently raise the growth rate of output","New technology will result in a larger population with a constant standard of living","permanently higher growth rate can be achieved through savings and investment decisions"],"ans":"C","expl":"C is Correct because in the endogenous growth model, the economy does not reach a steady growth rate equal to the growth of labor plus an exogenous rate of labor productivity growth. Instead, saving and investment decisions can generate self- sustaining growth at a permanently higher rate. This situation is in sharp contrast to the neoclassical model.","explhtml":"<p>C is Correct because in the endogenous growth model, the economy does not reach a steady growth rate equal to the growth of labor plus an exogenous rate of labor productivity growth. Instead, saving and investment decisions can generate self- sustaining growth at a permanently higher rate. This situation is in sharp contrast to the neoclassical model.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>In contrast to the classical and neoclassical growth models, which of the following is an implication of the endogenous growth model?<\/p><\/div>","subj":"economics"},{"n":25,"q":"The prediction that technological progress results in a larger population with no increase in per capita output is characteristic of which of the following theories of economic growth?","opts":["Classical model","Neoclassical model","Endogenous growth model"],"ans":"A","expl":"A is Correct because the classical model predicts that in the long run, the adoption of new technology results in a larger but not richer population. There is no growth in per capita output.","explhtml":"<p>A is Correct because the classical model predicts that in the long run, the adoption of new technology results in a larger but not richer population. There is no growth in per capita output.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>The prediction that technological progress results in a larger population with no increase in per capita output is characteristic of which of the following theories of economic growth?<\/p><\/div>","subj":"economics"},{"n":26,"q":"All else being equal, developing countries eventually catching up with developed countries and matching them in per capita output is best described as","opts":["club convergence.","absolute convergence.","conditional convergence."],"ans":"B","expl":"B is Correct because absolute convergence means that developing countries, regardless of their particular characteristics, will eventually catch up with the developed countries and match them in per capita output. The neoclassical model assumes that all countries have access to the same technology. As a result, per capita income in all countries should eventually grow at the same rate. Thus, the model implies convergence of per capita growth rates among all countries. It does not, however, imply that the level of per capita income will be the same in all countries regardless of underlying characteristics; that is, it does not imply absolute convergence.","explhtml":"<p>B is Correct because absolute convergence means that developing countries, regardless of their particular characteristics, will eventually catch up with the developed countries and match them in per capita output. The neoclassical model assumes that all countries have access to the same technology. As a result, per capita income in all countries should eventually grow at the same rate. Thus, the model implies convergence of per capita growth rates among all countries. It does not, however, imply that the level of per capita income will be the same in all countries regardless of underlying characteristics; that is, it does not imply absolute convergence.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>All else being equal, developing countries eventually catching up with developed countries and matching them in per capita output is best described as<\/p><\/div>","subj":"economics"},{"n":27,"q":"Which of the following statements about convergence hypotheses is most accurate?","opts":["Countries risk falling into a non-convergence trap if they do not implement necessary institutional reforms","The neoclassical model allows for countries that start with high per capita income to grow faster and stay ahead of developing countries","Investing in lower-income countries subject to club convergence should provide a lower rate of return than investing in higher-income countries"],"ans":"A","expl":"A is Correct because countries may fall into a non-convergence trap if they do not implement necessary institutional reforms. For example, failure to reform labor markets has undermined growth in some European countries that have experienced weak growth in employment and high rates of unemployment over the last two decades. Certain institutional arrangements that initially enhance growth may later generate non-convergence traps if maintained too long. Import substitution policies enabled the Latin American countries to grow rapidly in the 1950s and 1960s but caused them to stagnate in the 1970s and 1980s.","explhtml":"<p>A is Correct because countries may fall into a non-convergence trap if they do not implement necessary institutional reforms. For example, failure to reform labor markets has undermined growth in some European countries that have experienced weak growth in employment and high rates of unemployment over the last two decades. Certain institutional arrangements that initially enhance growth may later generate non-convergence traps if maintained too long. Import substitution policies enabled the Latin American countries to grow rapidly in the 1950s and 1960s but caused them to stagnate in the 1970s and 1980s.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>Which of the following statements about convergence hypotheses is most accurate?<\/p><\/div>","subj":"economics"},{"n":28,"q":"The economic rationale for government incentives encouraging private production of knowledge capital is most likely to:","opts":["reduce the need for labor.","encourage long run economic growth.","promote convergence of developing and developed economies."],"ans":"B","expl":"B is Correct because there may be a role for government intervention to correct for the market failure by direct government spending on R&D and/or providing tax breaks and subsidies for private production of knowledge capital. Higher levels of spending on knowledge capital could translate into faster economic growth even in the long run. Because R&D spending promotes positive externalities, the government may offer incentives for R&D investment to correct for underinvestment by the the private sector.","explhtml":"<p>B is Correct because there may be a role for government intervention to correct for the market failure by direct government spending on R&amp;D and/or providing tax breaks and subsidies for private production of knowledge capital. Higher levels of spending on knowledge capital could translate into faster economic growth even in the long run. Because R&amp;D spending promotes positive externalities, the government may offer incentives for R&amp;D investment to correct for underinvestment by the the private sector.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>The economic rationale for government incentives encouraging private production of knowledge capital is most likely to:<\/p><\/div>","subj":"economics"},{"n":29,"q":"The government of a developing country offers large tax breaks to private companies to invest in research and development. The government assumes that this will generate a permanently higher economic growth rate. This assumption is a characteristic of the:","opts":["classical growth theory.","neoclassical growth theory.","endogenous growth theory."],"ans":"C","expl":"C is Correct because according to the endogenous growth model, saving and investment decisions can generate self-sustaining growth at a permanently higher rate. This situation is in sharp contrast to the neoclassical model, in which only a transitory increase in growth above the steady state is possible. The reason for this difference is that because of the externalities on R&D, diminishing marginal returns to capital do not set in. Higher levels of spending on knowledge capital could translate into faster economic growth even in the long run. Finally, according to the endogenous growth theory, there is no reason why the incomes of developed and developing countries should converge.","explhtml":"<p>C is Correct because according to the endogenous growth model, saving and investment decisions can generate self-sustaining growth at a permanently higher rate. This situation is in sharp contrast to the neoclassical model, in which only a transitory increase in growth above the steady state is possible. The reason for this difference is that because of the externalities on R&amp;D, diminishing marginal returns to capital do not set in. Higher levels of spending on knowledge capital could translate into faster economic growth even in the long run. Finally, according to the endogenous growth theory, there is no reason why the incomes of developed and developing countries should converge.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>The government of a developing country offers large tax breaks to private companies to invest in research and development. The government assumes that this will generate a permanently higher economic growth rate. This assumption is a characteristic of the:<\/p><\/div>","subj":"economics"},{"n":30,"q":"According to the neoclassical model, if economies are open and there is free trade and international borrowing and lending, capital should flow from countries with a:","opts":["low capital-to-labor ratio to those with a low capital-to-labor ratio.","high capital-to-labor ratio to those with a low capital-to-labor ratio.","high capital-to-labor ratio to those with a high capital-to-labor ratio."],"ans":"B","expl":"B is Correct because according to the neoclassical model, convergence should occur more quickly if economies are open and there is free trade and international borrowing and lending. Opening up the economy should increase the rate at which countries’ capital-to-labor ratios converge. Developing countries have less capital per worker, and as a result, the marginal product of capital is higher. Thus, the rate of return on investments should be higher in countries with low capital-to-labor ratios and lower in countries with high capital-to-labor ratios. Global savers, seeking higher returns on investments, will invest in the capital-poor countries. In an open economy, capital should flow from countries with high capital-to-labor ratios to those that are capital poor, i.e., those with a low capital-to-labor ratio.","explhtml":"<p>B is Correct because according to the neoclassical model, convergence should occur more quickly if economies are open and there is free trade and international borrowing and lending. Opening up the economy should increase the rate at which countries’ capital-to-labor ratios converge. Developing countries have less capital per worker, and as a result, the marginal product of capital is higher. Thus, the rate of return on investments should be higher in countries with low capital-to-labor ratios and lower in countries with high capital-to-labor ratios. Global savers, seeking higher returns on investments, will invest in the capital-poor countries. In an open economy, capital should flow from countries with high capital-to-labor ratios to those that are capital poor, i.e., those with a low capital-to-labor ratio.<\/p>","qhtml":"<div class=\"pp-topic\">Economic Growth<\/div><div class=\"qtext\"><p>According to the neoclassical model, if economies are open and there is free trade and international borrowing and lending, capital should flow from countries with a:<\/p><\/div>","subj":"economics"},{"n":31,"q":"All else being equal, which of the following factors widens the bid–ask spread for two currencies quoted in the interbank foreign exchange market? A high degree of:","opts":["market volatility.","market participation for the quoted currency.","dealer competition to win repeat foreign exchange business."],"ans":"A","expl":"A is Correct because when major market participants have greater uncertainty about the factors influencing market pricing, they will attempt to reduce their risk exposures and/or charge a higher price for taking on risk. In the FX market, this response implies wider bid–offer spreads in both the interbank and broader markets.","explhtml":"<p>A is Correct because when major market participants have greater uncertainty about the factors influencing market pricing, they will attempt to reduce their risk exposures and/or charge a higher price for taking on risk. In the FX market, this response implies wider bid–offer spreads in both the interbank and broader markets.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>All else being equal, which of the following factors widens the bid–ask spread for two currencies quoted in the interbank foreign exchange market? A high degree of:<\/p><\/div>","subj":"economics"},{"n":32,"q":"A dealer regularly handles equity security trades and fixed income transactions for a retail client. The client requests a currency transaction for 250,000 Canadian dollars (CAD) and Czech korunas (CZK), an uncommon pairing and a relatively small transaction size. The dealer prepares a bid/ask quote for the client. Which of the following factors would most likely lead to a tighter spread between the bid and ask for the transaction?","opts":["The currencies involved","The size of the transaction","The dealer/client relationship"],"ans":"C","expl":"C is Correct because if the client has other business with the dealer the dealer might offer tighter spreads to retain the other business and the dealer might also give tighter bid–offer quotes in order to win repeat FX business","explhtml":"<p>C is Correct because if the client has other business with the dealer the dealer might offer tighter spreads to retain the other business and the dealer might also give tighter bid–offer quotes in order to win repeat FX business<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>A dealer regularly handles equity security trades and fixed income transactions for a retail client. The client requests a currency transaction for 250,000 Canadian dollars (CAD) and Czech korunas (CZK), an uncommon pairing and a relatively small transaction size. The dealer prepares a bid/ask quote for the client. Which of the following factors would most likely lead to a tighter spread between the bid and ask for the transaction?<\/p><\/div>","subj":"economics"},{"n":33,"q":"The bid–offer spread on the foreign exchange spot market is most likely wider:","opts":["for retail transactions compared to interbank transactions.","when a dealer hopes to win repeat business from the client.","when there is greater certainty about factors affecting market pricing."],"ans":"A","expl":"A is Correct because retail quotes are typically for dealing sizes smaller than 1 million units of the base currency and can range all the way down to foreign exchange transactions conducted by individuals. The bid–offer spreads for these retail transactions can be very large compared with those in the interbank market.","explhtml":"<p>A is Correct because retail quotes are typically for dealing sizes smaller than 1 million units of the base currency and can range all the way down to foreign exchange transactions conducted by individuals. The bid–offer spreads for these retail transactions can be very large compared with those in the interbank market.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The bid–offer spread on the foreign exchange spot market is most likely wider:<\/p><\/div>","subj":"economics"},{"n":34,"q":"The following are spot rate quotes in the interbank market between the Danish Krone (DKK), EUR, and USD: Note: DKK/EUR is the amount of DKK per 1 EUR. DKK/USD is the amount of DKK per 1 USD. If a dealer quoted a bid–offer of 0.9483/0.9510 for EUR/USD, a trader would most likely:","opts":["not make any arbitrage profits.","make arbitrage profits by buying USD from the dealer with EUR and selling it in the interbank market.","make arbitrage profits by buying EUR from the dealer with DKK and selling it in the interbank market."],"ans":"A","expl":"A is Correct because the cross-rate between any two currency pairs will equal the exchange rate for the remaining currency pair, resulting in no mispricing. For example, the EUR/USD cross rate is EUR/DKK × DKK/USD. Since the offer rate must be greater than the bid, the bid and ask DKK/EUR rates must be reversed and then inverted before multiplying by the DKK/USD bid and offer rates. The bid is computed as: (1/7.4679) × 7.0820 ≈ 0.9483, and the ask is: (1/7.4524) × 7.0870 ≈ 0.9510. These are the same rates provided the dealer.","explhtml":"<p>A is Correct because the cross-rate between any two currency pairs will equal the exchange rate for the remaining currency pair, resulting in no mispricing. For example, the EUR/USD cross rate is EUR/DKK × DKK/USD. Since the offer rate must be greater than the bid, the bid and ask DKK/EUR rates must be reversed and then inverted before multiplying by the DKK/USD bid and offer rates. The bid is computed as: (1/7.4679) × 7.0820 ≈ 0.9483, and the ask is: (1/7.4524) × 7.0870 ≈ 0.9510. These are the same rates provided the dealer.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The following are spot rate quotes in the interbank market between the Danish Krone (DKK), EUR, and USD:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp080.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Note: DKK/EUR is the amount of DKK per 1 EUR. DKK/USD is the amount of DKK per 1 USD. If a dealer quoted a bid–offer of 0.9483/0.9510 for EUR/USD, a trader would most likely:<\/p><\/div>","subj":"economics"},{"n":35,"q":"The following are spot rate quotes in the interbank market between the EUR, USD, and Swiss Franc (CHF): Note: EUR/USD is the amount of EUR per 1 USD. CHF/USD is the amount of CHF per 1 USD. The bid–offer on the EUR/CHF cross rate implied by the interbank market is closest to:","opts":["0.8562/0.8576.","1.0515/1.0533.","1.0519/1.0529."],"ans":"B","expl":"B is Correct because EUR/CHF = EUR/USD × USD/CHF. The bid and offer CHF/USD rates must be inverted and interchanged to obtain USD/CHF. So the bid and offer USD/CHF rates are: 1/0.9025 ≈ 1.1080 and 1/.9022 ≈ 1.1084, respectively. Multiplying the bid of the EUR/USD with the bid of the USD/CHF is: 0.9490 ×1.1080 ≈ 1.0515, the EUR/CHF bid. Similarly, multiplying the offer of the EUR/USD with the offer of the USD/CHF is: 0.9503 × 1.1084 ≈ 1.0533, the EUR/CHF offer.","explhtml":"<p>B is Correct because EUR/CHF = EUR/USD × USD/CHF. The bid and offer CHF/USD rates must be inverted and interchanged to obtain USD/CHF. So the bid and offer USD/CHF rates are: 1/0.9025 ≈ 1.1080 and 1/.9022 ≈ 1.1084, respectively. Multiplying the bid of the EUR/USD with the bid of the USD/CHF is: 0.9490 ×1.1080 ≈ 1.0515, the EUR/CHF bid. Similarly, multiplying the of
