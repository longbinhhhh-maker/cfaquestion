fer of the EUR/USD with the offer of the USD/CHF is: 0.9503 × 1.1084 ≈ 1.0533, the EUR/CHF offer.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The following are spot rate quotes in the interbank market between the EUR, USD, and Swiss Franc (CHF):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp081.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Note: EUR/USD is the amount of EUR per 1 USD. CHF/USD is the amount of CHF per 1 USD. The bid–offer on the EUR/CHF cross rate implied by the interbank market is closest to:<\/p><\/div>","subj":"economics"},{"n":36,"q":"An analyst gathers the following data about the current USD/EUR spot exchange rate and the 180-day MRR (annualized) for the USD and the EUR: Note: USD/EUR is the amount of USD per 1 EUR. Assuming covered interest rate parity holds, the EUR is trading at a forward premium (discount) closest to:","opts":["–0.00373.","0.00371.","0.00373."],"ans":"C","expl":"C is Correct because the covered interest rate parity equation can also be rearranged to give an expression for the forward premium or discount. The formula for the forward premium (discount) for the domestic currency (d), the EUR, is: Ff/d − Sf/d = Sf/d ([ Actual/360]/[1 + id[ Actual/360 ]] × (if − id). Ff/d − Sf/d = 0.94 ([180/360]/[1 + 0.017 [180/360]]) × (0.025 – 0.017) = 0.00373.","explhtml":"<p>C is Correct because the covered interest rate parity equation can also be rearranged to give an expression for the forward premium or discount. The formula for the forward premium (discount) for the domestic currency (d), the EUR, is: Ff/d − Sf/d = Sf/d ([ Actual/360]/[1 + id[ Actual/360 ]] × (if − id). Ff/d − Sf/d = 0.94 ([180/360]/[1 + 0.017 [180/360]]) × (0.025 – 0.017) = 0.00373.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>An analyst gathers the following data about the current USD/EUR spot exchange rate and the 180-day MRR (annualized) for the USD and the EUR:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp082.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Note: USD/EUR is the amount of USD per 1 EUR. Assuming covered interest rate parity holds, the EUR is trading at a forward premium (discount) closest to:<\/p><\/div>","subj":"economics"},{"n":37,"q":"The spot rates and forward points for the EUR/GBP are as follows: Note: EUR/GBP is the amount of EUR per 1 GBP. The 6-month forward bid rate for EUR/GBP is closest to:","opts":["1.1435.","1.1437.","1.1447"],"ans":"A","expl":"A is Correct because the six-month forward bid rate is determined by the sum of the spot bid rate and the six-month forward points bid rate divided by 10,000. Spot Rate (bid): 1.1520 Six-month Forward Points (bid): –85 Six-months forward bid rate = spot bid rate + (six-month forward points bid rate/10,000) = 1.1520 + (–85/10,000) = 1.1435.","explhtml":"<p>A is Correct because the six-month forward bid rate is determined by the sum of the spot bid rate and the six-month forward points bid rate divided by 10,000. Spot Rate (bid): 1.1520 Six-month Forward Points (bid): –85 Six-months forward bid rate = spot bid rate + (six-month forward points bid rate/10,000) = 1.1520 + (–85/10,000) = 1.1435.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The spot rates and forward points for the EUR/GBP are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp083.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Note: EUR/GBP is the amount of EUR per 1 GBP. The 6-month forward bid rate for EUR/GBP is closest to:<\/p><\/div>","subj":"economics"},{"n":38,"q":"An investor purchases 1 million Canadian Dollars (CAD) for delivery against the Euro in nine months at an all- in forward rate of of 1.4301 (EUR/CAD). Three months later, the bid-offer quotes for spot and forward points six months prior to the settlement date are as follows: Note: EUR/CAD is the amount of EUR per 1 CAD. If the investor wants to close out his position today, the mark-to-market value of the original forward contract is closest to:","opts":["EUR –24,099.","EUR –23,805.","EUR –4,840."],"ans":"A","expl":"A is Correct because to determine the mark-to-market value, first calculate the sale of the base currency CAD using the bid side of the market. The six month forward rate to use is: Spot rate + (six months points / 10,000) or 1.4011 + (46 / 10,000) = 1.4057. Subtract the original spot rate at purchase to determine the EUR cash flow at settlement. (1.4057 –1.4301) × 1,000,000 = €–24,400. This cash flow six months in the future is then discounted to the present: –24,400 / (1 + 0.025 (180/360) = €–24,098.76 ≈ €–24,099.","explhtml":"<p>A is Correct because to determine the mark-to-market value, first calculate the sale of the base currency CAD using the bid side of the market. The six month forward rate to use is: Spot rate + (six months points / 10,000) or 1.4011 + (46 / 10,000) = 1.4057. Subtract the original spot rate at purchase to determine the EUR cash flow at settlement. (1.4057 –1.4301) × 1,000,000 = €–24,400. This cash flow six months in the future is then discounted to the present: –24,400 / (1 + 0.025 (180/360) = €–24,098.76 ≈ €–24,099.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>An investor purchases 1 million Canadian Dollars (CAD) for delivery against the Euro in nine months at an all- in forward rate of of 1.4301 (EUR/CAD). Three months later, the bid-offer quotes for spot and forward points six months prior to the settlement date are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp084.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Note: EUR/CAD is the amount of EUR per 1 CAD. If the investor wants to close out his position today, the mark-to-market value of the original forward contract is closest to:<\/p><\/div>","subj":"economics"},{"n":39,"q":"An investor bought 1 million Singapore Dollars (SGD) at an all-in forward price of 1.1465 AUD/SGD (1.1465 Australian Dollars (AUD) per 1 SGD). Three months prior to the settlement date, the investor wants to mark-to-market this forward position. The investor has the following information: The mark-to-mark value of the forward position three months prior to settlement date is closest to:","opts":["AUD 4,252.","AUD 4,300.","AUD 4,845."],"ans":"A","expl":"A is Correct because the dealer initially bought a SGD 1 million at a forward at a price of AUD/SGD 1.14650. To offset this he needs to sell (or short) a three month forward contract at the bid rate of 1.1483 + 25/10,000 = 1.1508. On settlement date he will receive (1.1508 – 1.1465 = 0.0043) × 1,000,000 = 4,300. This is discounted for 3 months using the AUD MRR 4,300/(1+.045(90/360)) = AUD 4,252.16 ≈ 4,252.","explhtml":"<p>A is Correct because the dealer initially bought a SGD 1 million at a forward at a price of AUD/SGD 1.14650. To offset this he needs to sell (or short) a three month forward contract at the bid rate of 1.1483 + 25/10,000 = 1.1508. On settlement date he will receive (1.1508 – 1.1465 = 0.0043) × 1,000,000 = 4,300. This is discounted for 3 months using the AUD MRR 4,300/(1+.045(90/360)) = AUD 4,252.16 ≈ 4,252.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>An investor bought 1 million Singapore Dollars (SGD) at an all-in forward price of 1.1465 AUD/SGD (1.1465 Australian Dollars (AUD) per 1 SGD). Three months prior to the settlement date, the investor wants to mark-to-market this forward position. The investor has the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp085.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>The mark-to-mark value of the forward position three months prior to settlement date is closest to:<\/p><\/div>","subj":"economics"},{"n":40,"q":"An investor enters into a 6-month forward contract to purchase EUR 10 million at an all-in rate of USD/EUR 1.0665. Two months later, the following quotes were obtained: Note: USD/EUR is the amount of USD per 1 EUR. The mark-to-market value of the forward contract is closest to:","opts":["USD 107,843.","USD 108,197.","USD 110,000."],"ans":"B","expl":"B is Correct because this is the mark-to-market value after two months. The mark- to-market value of forward contracts reflects the profit (or loss) that would be realized from closing out the position at current market prices. To offset the transaction, the investor needs a forward transaction to sell EUR 10 million four months from now. Using the USD/EUR quote, where EUR is the base currency, use the bid for both the spot rate and the forward points, 1.0825 + (– 50/10,000) = 1.0775. At the settlement date, these EUR amounts will offset. But the USD amounts differ due to the forward rate shift. The resulting USD cash flow will be: 1.0775 − 1.0665 × 10,000,000 = USD 110,000. Discounting this using the four-month MMR annualized USD discount rate, the present value is USD 110,000 / (1 + 0.05 × (120/360)) = USD 108,196.72 ≈ USD 108,197.","explhtml":"<p>B is Correct because this is the mark-to-market value after two months. The mark- to-market value of forward contracts reflects the profit (or loss) that would be realized from closing out the position at current market prices. To offset the transaction, the investor needs a forward transaction to sell EUR 10 million four months from now. Using the USD/EUR quote, where EUR is the base currency, use the bid for both the spot rate and the forward points, 1.0825 + (– 50/10,000) = 1.0775. At the settlement date, these EUR amounts will offset. But the USD amounts differ due to the forward rate shift. The resulting USD cash flow will be: 1.0775 − 1.0665 × 10,000,000 = USD 110,000. Discounting this using the four-month MMR annualized USD discount rate, the present value is USD 110,000 / (1 + 0.05 × (120/360)) = USD 108,196.72 ≈ USD 108,197.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>An investor enters into a 6-month forward contract to purchase EUR 10 million at an all-in rate of USD/EUR 1.0665. Two months later, the following quotes were obtained:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp086.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Note: USD/EUR is the amount of USD per 1 EUR. The mark-to-market value of the forward contract is closest to:<\/p><\/div>","subj":"economics"},{"n":41,"q":"Which of the following international parity conditions is enforced by arbitrage?","opts":["Forward rate parity","Purchasing power parity","Covered interest rate parity"],"ans":"C","expl":"C is Correct because covered interest rate parity is the only parity condition that is enforced by arbitrage.","explhtml":"<p>C is Correct because covered interest rate parity is the only parity condition that is enforced by arbitrage.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>Which of the following international parity conditions is enforced by arbitrage?<\/p><\/div>","subj":"economics"},{"n":42,"q":"Which international parity condition asserts that the percentage change in the spot exchange rate will be determined by the difference between the foreign and domestic inflation rates?","opts":["The international Fisher effect","Relative purchasing power parity","Absolute purchasing power parity"],"ans":"B","expl":"B is Correct because according to the relative version of PPP, the percentage change in the spot exchange rate will be completely determined by the difference between the foreign and domestic inflation rates.","explhtml":"<p>B is Correct because according to the relative version of PPP, the percentage change in the spot exchange rate will be completely determined by the difference between the foreign and domestic inflation rates.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>Which international parity condition asserts that the percentage change in the spot exchange rate will be determined by the difference between the foreign and domestic inflation rates?<\/p><\/div>","subj":"economics"},{"n":43,"q":"An analyst gathers the following data for a potential short-term investment: Over the next year, if uncovered interest rate parity holds, the NZD is expected to appreciate:","opts":["1.25%.","2.00%.","2.25%."],"ans":"A","expl":"A is Correct because if the uncovered interest rate parity holds the expected change in the spot exchange rate over the investment horizon should be reflected in the interest rate differential: %Δ Sef/d = if − id 7.50% – 6.25% = 1.25%","explhtml":"<p>A is Correct because if the uncovered interest rate parity holds the expected change in the spot exchange rate over the investment horizon should be reflected in the interest rate differential: %Δ Sef/d = if − id 7.50% – 6.25% = 1.25%<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>An analyst gathers the following data for a potential short-term investment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp087.webp\" style=\"max-width:min(100%,569px)\" alt=\"\"><p>Over the next year, if uncovered interest rate parity holds, the NZD is expected to appreciate:<\/p><\/div>","subj":"economics"},{"n":44,"q":"With respect to interest rates, differences in currency risk across countries are reflected in:","opts":["real interest rates only.","nominal interest rates only.","both real interest rates and nominal interest rates."],"ans":"C","expl":"C is Correct because riskier currencies have both higher real and nominal interest rates. Economists typically separate the nominal interest rate into the real interest rate, an inflation premium, and a risk premium. Investors in a riskier country will require a risk premium for holding the currency, which will be reflected in nominal and real interest rates that are higher than would be expected under the international Fisher effect and real interest rate parity conditions.","explhtml":"<p>C is Correct because riskier currencies have both higher real and nominal interest rates. Economists typically separate the nominal interest rate into the real interest rate, an inflation premium, and a risk premium. Investors in a riskier country will require a risk premium for holding the currency, which will be reflected in nominal and real interest rates that are higher than would be expected under the international Fisher effect and real interest rate parity conditions.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>With respect to interest rates, differences in currency risk across countries are reflected in:<\/p><\/div>","subj":"economics"},{"n":45,"q":"Which of the following international parity conditions must hold for the international Fisher effect to hold true?","opts":["The Fisher effect only","Real interest rate parity only","Both the Fisher effect and real interest rate parity"],"ans":"C","expl":"C is Correct because assuming the Fisher effect holds in all markets—that is, the nominal interest rate in each market equals the real interest rate plus the expected inflation rate—and also assuming that real interest rates are broadly the same across all markets (real interest rate parity), then the nominal yield spread between domestic and foreign markets will equal the domestic–foreign expected inflation differential, which is the international Fisher effect.","explhtml":"<p>C is Correct because assuming the Fisher effect holds in all markets—that is, the nominal interest rate in each market equals the real interest rate plus the expected inflation rate—and also assuming that real interest rates are broadly the same across all markets (real interest rate parity), then the nominal yield spread between domestic and foreign markets will equal the domestic–foreign expected inflation differential, which is the international Fisher effect.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>Which of the following international parity conditions must hold for the international Fisher effect to hold true?<\/p><\/div>","subj":"economics"},{"n":46,"q":"The forward rate is an unbiased predictor of the future spot rate when which of the following conditions holds?","opts":["Covered interest rate parity only","Uncovered interest rate parity only","Both covered interest rate parity and uncovered interest rate parity"],"ans":"C","expl":"C is Correct because if both covered and uncovered interest rate parity hold that is, the nominal yield spread equals both the forward premium (or discount) and the expected percentage change in the spot exchange rate—then the forward exchange rate will be an unbiased predictor of the future spot exchange rate.","explhtml":"<p>C is Correct because if both covered and uncovered interest rate parity hold that is, the nominal yield spread equals both the forward premium (or discount) and the expected percentage change in the spot exchange rate—then the forward exchange rate will be an unbiased predictor of the future spot exchange rate.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The forward rate is an unbiased predictor of the future spot rate when which of the following conditions holds?<\/p><\/div>","subj":"economics"},{"n":47,"q":"The 1-year deposit rate is 2.25% in Japan and 6.25% in the US. According to the uncovered interest rate parity theory, the JPY/USD rate (amount of JPY per 1 USD) is expected to:","opts":["decrease by 4% in one year.","remain the same.","increase by 4% in one year."],"ans":"A","expl":"A is Correct because uncovered interest rate parity says the expected change in the spot exchange rate over the investment horizon should be reflected in the interest rate differential: %ΔSef/d = i f − i d = JPY/USD = Japan interest rate – US interest rate = 2.25% – 6.25% = – 4.0%. This suggest that the exchange rate (JPY/USD) is expected to decrease by 4%.","explhtml":"<p>A is Correct because uncovered interest rate parity says the expected change in the spot exchange rate over the investment horizon should be reflected in the interest rate differential: %ΔSef/d = i f − i d = JPY/USD = Japan interest rate – US interest rate = 2.25% – 6.25% = – 4.0%. This suggest that the exchange rate (JPY/USD) is expected to decrease by 4%.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The 1-year deposit rate is 2.25% in Japan and 6.25% in the US. According to the uncovered interest rate parity theory, the JPY/USD rate (amount of JPY per 1 USD) is expected to:<\/p><\/div>","subj":"economics"},{"n":48,"q":"The following table shows the expected inflation rates for three countries: According to ex ante purchasing power parity (PPP):","opts":["the JPY/AUD (the amount of JPY per 1 AUD) exchange rate is expected to decrease by 2%.","the USD/AUD (the amount of USD per 1 AUD) exchange rate is expected to decrease by 1%.","the JPY/USD (the amount of JPY per 1 USD) exchange rate is expected to increase by 3%."],"ans":"A","expl":"A is Correct because the ex ante version of PPP asserts that the expected changes in the spot exchange rate are entirely driven by expected differences in national inflation rates. Ex ante PPP tells us that countries that are expected to run persistently high inflation rates should expect to see their currencies depreciate over time. Ex ante PPP can be expressed as %Δ S e f/d = πef − π ed . %Δ S e f/d = πef − π ed = Japan inflation – Australia inflation = (1% – 3%) = – 2% Since Australia has a higher inflation rate than Japan, the AUD is expected to depreciate by (3% – 1%) 2% against the JPY.","explhtml":"<p>A is Correct because the ex ante version of PPP asserts that the expected changes in the spot exchange rate are entirely driven by expected differences in national inflation rates. Ex ante PPP tells us that countries that are expected to run persistently high inflation rates should expect to see their currencies depreciate over time. Ex ante PPP can be expressed as %Δ S e f/d = πef − π ed . %Δ S e f/d = πef − π ed = Japan inflation – Australia inflation = (1% – 3%) = – 2% Since Australia has a higher inflation rate than Japan, the AUD is expected to depreciate by (3% – 1%) 2% against the JPY.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The following table shows the expected inflation rates for three countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp088.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>According to ex ante purchasing power parity (PPP):<\/p><\/div>","subj":"economics"},{"n":49,"q":"According to ex ante purchasing power parity, the expected change in the spot exchange rate should equal the:","opts":["differential in interest rates between two countries.","expected difference between domestic and foreign inflation rates.","difference between the forward exchange rate and the spot exchange rate."],"ans":"B","expl":"B is Correct because according to the ex ante PPP approach to exchange rate determination, the expected change in the spot exchange rate should equal the expected difference between domestic and foreign inflation rates.","explhtml":"<p>B is Correct because according to the ex ante PPP approach to exchange rate determination, the expected change in the spot exchange rate should equal the expected difference between domestic and foreign inflation rates.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>According to ex ante purchasing power parity, the expected change in the spot exchange rate should equal the:<\/p><\/div>","subj":"economics"},{"n":50,"q":"The forward exchange rate is an unbiased predictor of the future spot exchange rate if:","opts":["only covered interest rate parity holds.","only uncovered interest rate parity holds.","both covered and uncovered interest rate parity hold."],"ans":"C","expl":"C is Correct because if both covered and uncovered interest rate parity hold—that is, the nominal yield spread equals both the forward premium (or discount) and the expected percentage change in the spot exchange rate—then the forward exchange rate will be an unbiased predictor of the future spot exchange rate.","explhtml":"<p>C is Correct because if both covered and uncovered interest rate parity hold—that is, the nominal yield spread equals both the forward premium (or discount) and the expected percentage change in the spot exchange rate—then the forward exchange rate will be an unbiased predictor of the future spot exchange rate.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The forward exchange rate is an unbiased predictor of the future spot exchange rate if:<\/p><\/div>","subj":"economics"},{"n":51,"q":"Foreign exchange (FX) carry trades have been profitable in short and medium time periods because:","opts":["low-yield currencies reflect a more unstable economy.","the return to the trader consists of credit risk and currency appreciation/depreciation.","high-yield currencies do not depreciate to levels predicted by interest rate differentials."],"ans":"C","expl":"C is Correct because when the high-yield currency does not depreciate to the level predicted by the interest rate differentials it provides a profit opportunity on the returning currency exchange. The evidence suggests that uncovered interest rate parity does not hold over short and medium time periods. Studies have generally found that high-yield currencies, on average, have not depreciated and low-yield currencies have not appreciated to the levels predicted by interest rate differentials.","explhtml":"<p>C is Correct because when the high-yield currency does not depreciate to the level predicted by the interest rate differentials it provides a profit opportunity on the returning currency exchange. The evidence suggests that uncovered interest rate parity does not hold over short and medium time periods. Studies have generally found that high-yield currencies, on average, have not depreciated and low-yield currencies have not appreciated to the levels predicted by interest rate differentials.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>Foreign exchange (FX) carry trades have been profitable in short and medium time periods because:<\/p><\/div>","subj":"economics"},{"n":52,"q":"A currency trader executes a 1-year carry trade by borrowing in Swedish krona (SEK) and investing in Singapore dollars (SGD) based on the following data: Note: SEK/SGD is the amount of SEK per 1 SGD. The net profit on the trade is closest to:","opts":["3.72%.","7.78%.","11.53%."],"ans":"B","expl":"B is Correct because the net profit is calculated as follows: Step 1: Borrow in SEK and convert into SGD at 1/(SEK/SGD) = (1/7.4162) Step 2: The investment earns interest at the SGD MMR (1 + MRRSGD) = (1 + 0.065) Step 3: Convert the investment + interest back into SEK at SEK/SGD1 = 7.7663 Step 4: Subtract the original investment to determine the gross profit and subtract the borrowing costs at MMR SEK (1/rate0) × (1+i) × rate1 – 1 – borrowing cost (1/7.4162) × (1+ 0.065) × 7.7663 – 1 – 0.375 = 7.78%","explhtml":"<p>B is Correct because the net profit is calculated as follows: Step 1: Borrow in SEK and convert into SGD at 1/(SEK/SGD) = (1/7.4162) Step 2: The investment earns interest at the SGD MMR (1 + MRRSGD) = (1 + 0.065) Step 3: Convert the investment + interest back into SEK at SEK/SGD1 = 7.7663 Step 4: Subtract the original investment to determine the gross profit and subtract the borrowing costs at MMR SEK (1/rate0) × (1+i) × rate1 – 1 – borrowing cost (1/7.4162) × (1+ 0.065) × 7.7663 – 1 – 0.375 = 7.78%<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>A currency trader executes a 1-year carry trade by borrowing in Swedish krona (SEK) and investing in Singapore dollars (SGD) based on the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp089.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Note: SEK/SGD is the amount of SEK per 1 SGD. The net profit on the trade is closest to:<\/p><\/div>","subj":"economics"},{"n":53,"q":"The government of an inflation-prone economy initiates the tightening of monetary policy to promote price stability and long-term sustainable growth. Which of the following is most likely an expected consequence of this action?","opts":["The country's currency will appreciate","Domestic interest rates will decrease relative to yields in other economies","Inflation expectations for the economy relative to other economies will increase"],"ans":"A","expl":"A is Correct because tightening monetary policy is done by increasing interest rates relative to other markets and as a result inflation expectations will decline. The combination of those two events should put upward pressure on the currency, causing it to appreciate. To achieve price stability, policymakers in the high-yield economy will initiate a tightening in monetary policy by gradually raising the level of domestic interest rates relative to yield levels in the rest of the world. If the tightening in domestic monetary policy is sustained, inflation expectations for the high-yield economy relative to other economies should gradually decline. The combination of sustained wide nominal yield spreads and a steady narrowing in relative inflation expectations should exert upward pressure on the high-yield currency’s value.","explhtml":"<p>A is Correct because tightening monetary policy is done by increasing interest rates relative to other markets and as a result inflation expectations will decline. The combination of those two events should put upward pressure on the currency, causing it to appreciate. To achieve price stability, policymakers in the high-yield economy will initiate a tightening in monetary policy by gradually raising the level of domestic interest rates relative to yield levels in the rest of the world. If the tightening in domestic monetary policy is sustained, inflation expectations for the high-yield economy relative to other economies should gradually decline. The combination of sustained wide nominal yield spreads and a steady narrowing in relative inflation expectations should exert upward pressure on the high-yield currency’s value.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>The government of an inflation-prone economy initiates the tightening of monetary policy to promote price stability and long-term sustainable growth. Which of the following is most likely an expected consequence of this action?<\/p><\/div>","subj":"economics"},{"n":54,"q":"All else being equal, a depreciation of the currency in a country with a current account deficit will most likely lead to an increase in:","opts":["export prices in foreign currency terms.","export prices in domestic currency terms.","import prices in domestic currency terms."],"ans":"C","expl":"C is Correct because a depreciation of a deficit country’s currency should result in an increase in import prices in domestic currency terms and a decrease in export prices in foreign currency terms.","explhtml":"<p>C is Correct because a depreciation of a deficit country’s currency should result in an increase in import prices in domestic currency terms and a decrease in export prices in foreign currency terms.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>All else being equal, a depreciation of the currency in a country with a current account deficit will most likely lead to an increase in:<\/p><\/div>","subj":"economics"},{"n":55,"q":"An expansionary fiscal policy will most likely result in the appreciation of the domestic currency when capital flows are:","opts":["immobile.","insensitive to interest rate differentials.","highly sensitive to interest rate differentials."],"ans":"C","expl":"C is Correct because expansionary fiscal policy—either directly through increased spending or indirectly via lower taxes—typically exerts upward pressure on interest rates because larger budget deficits must be financed. With flexible exchange rates and mobile capital, the rising domestic interest rates will attract capital from lower-yielding markets, putting upward pressure on the domestic currency. If capital flows are highly sensitive to interest rate differentials, then the domestic currency will tend to appreciate substantially.","explhtml":"<p>C is Correct because expansionary fiscal policy—either directly through increased spending or indirectly via lower taxes—typically exerts upward pressure on interest rates because larger budget deficits must be financed. With flexible exchange rates and mobile capital, the rising domestic interest rates will attract capital from lower-yielding markets, putting upward pressure on the domestic currency. If capital flows are highly sensitive to interest rate differentials, then the domestic currency will tend to appreciate substantially.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>An expansionary fiscal policy will most likely result in the appreciation of the domestic currency when capital flows are:<\/p><\/div>","subj":"economics"},{"n":56,"q":"According to the Mundell-Fleming model, when capital mobility is high, monetary policy affects exchange rates through its impact on:","opts":["trade flows.","interest rates.","inflation rates."],"ans":"B","expl":"B is Correct because in the Mundell–Fleming model, monetary policy is transmitted to the exchange rate through its impact on interest rates and output.","explhtml":"<p>B is Correct because in the Mundell–Fleming model, monetary policy is transmitted to the exchange rate through its impact on interest rates and output.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>According to the Mundell-Fleming model, when capital mobility is high, monetary policy affects exchange rates through its impact on:<\/p><\/div>","subj":"economics"},{"n":57,"q":"A goal of government intervention and capital controls on inflows from overseas is most likely to:","opts":["decrease foreign exchange reserves.","prevent the currency from depreciating.","prevent the currency from appreciating too strongly."],"ans":"C","expl":"C is Correct because although a case can be made for government intervention and capital controls to limit the potential damage associated with unrestricted inflows of overseas capital, the key issue for policymakers is whether intervention and capital controls will actually work in terms of preventing currencies from appreciating too strongly.","explhtml":"<p>C is Correct because although a case can be made for government intervention and capital controls to limit the potential damage associated with unrestricted inflows of overseas capital, the key issue for policymakers is whether intervention and capital controls will actually work in terms of preventing currencies from appreciating too strongly.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>A goal of government intervention and capital controls on inflows from overseas is most likely to:<\/p><\/div>","subj":"economics"},{"n":58,"q":"Consider the following economic conditions for three countries: All else being equal, which country is most vulnerable to a currency crisis?","opts":["Country X","Country Y","Country Z"],"ans":"C","expl":"C is Correct because Country Z displays the greatest number of conditions associated with an early currency crisis warning system. Foreign exchange reserves tend to decline precipitously as a crisis approaches, the ratio of exports to imports (known as “the terms of trade”) often deteriorates before a crisis, and broad money growth and the ratio of M2 (a measure of money supply) to bank reserves tend to rise prior to a crisis.","explhtml":"<p>C is Correct because Country Z displays the greatest number of conditions associated with an early currency crisis warning system. Foreign exchange reserves tend to decline precipitously as a crisis approaches, the ratio of exports to imports (known as “the terms of trade”) often deteriorates before a crisis, and broad money growth and the ratio of M2 (a measure of money supply) to bank reserves tend to rise prior to a crisis.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>Consider the following economic conditions for three countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp090.webp\" style=\"max-width:min(100%,603px)\" alt=\"\"><p>All else being equal, which country is most vulnerable to a currency crisis?<\/p><\/div>","subj":"economics"},{"n":59,"q":"A country liberalized its financial markets, resulting in domestic banks borrowing short-term debt denominated in foreign currency, and a small depreciation of the local currency. The banks are now having trouble servicing the debt and speculators have started to short the local currency. What action could the government take to avoid a currency crisis?","opts":["Decrease interest rates","Sell its currency in foreign exchange markets","Use foreign currency reserves to buy its own currency"],"ans":"C","expl":"C is Correct because reducing its foreign currency reserves would be a direct intervention the government could take to defend its currency. The government will have to spend down its foreign currency reserves to buy its own currency in the foreign exchange markets.","explhtml":"<p>C is Correct because reducing its foreign currency reserves would be a direct intervention the government could take to defend its currency. The government will have to spend down its foreign currency reserves to buy its own currency in the foreign exchange markets.<\/p>","qhtml":"<div class=\"pp-topic\">Currency Exchange Rates: Understanding Equilibrium Value<\/div><div class=\"qtext\"><p>A country liberalized its financial markets, resulting in domestic banks borrowing short-term debt denominated in foreign currency, and a small depreciation of the local currency. The banks are now having trouble servicing the debt and speculators have started to short the local currency. What action could the government take to avoid a currency crisis?<\/p><\/div>","subj":"economics"}];
const CFG = {"title": "Economics — Practice Pack", "subtitle": "CFA Level II · 59 câu · EdZeb", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);

function setSubmitButtonMode(showResults){

  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);

function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"

}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }

  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

(function(){

        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';

      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}

})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

(function(){

    var r=panel.getBoundingClientRect();

    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);

})();

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
