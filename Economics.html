 structures has high barriers to entry?", "opts": ["An oligopoly", "Perfect competition", "Monopolistic competition"], "ans": "A", "expl": "A. Correct because the characteristics of oligopoly markets include: entry into the market is difficult,\nwith fairly high costs and significant barriers to competition.\nB. Incorrect because perfect competition has very low barriers to entry.\nC.Incorrect because monopolistic competition has low barriers to entry.\nEconomics: Identify the type of market structure within which a firm operates and describe the use\nand limitations of concentration measures", "qhtml": null}, {"n": 48, "q": "With respect to trading blocs, a common market most likely incorporates all aspects of\na(n):", "opts": ["customs union.", "monetary union.", "economic union."], "ans": "A", "expl": "A. Correct because the common market is the next level of economic integration that incorporates\nall aspects of the customs union and extends it by allowing free movement of factors of production\namong members.\nB. Incorrect because the common market is the customs union plus the free movement of factors of\nproduction among members. An economic union plus a common currency is a monetary union. That\nis, if the members of the economic union decide to adopt a common currency, then it is also a\nmonetary union.\nC. Incorrect because the common market is the customs union plus the free movement of factors of\nproduction among members. Common economic institutions and coordination of economic policies\namong members are traits of an economic union. That is, an economic union requires an even\ngreater degree of integration. It incorporates all aspects of a common market and in addition\nrequires common economic institutions and coordination of economic policies among members.\nEconomics: explain motivations for and advantages of trading blocs, common markets, and economic\nunions", "qhtml": null}, {"n": 49, "q": "All else being equal, in an efficient market a forward exchange rate will decrease as a\nresult of an increase in the:", "opts": ["spot exchange rate.", "foreign risk-free interest rate.", "domestic risk-free interest rate."], "ans": "C", "expl": "A. Incorrect because the forward exchange rate will increase, rather than decrease, as a result of an\nincrease in the spot exchange rate.\nB. Incorrect because the forward exchange rate will increase, rather than decrease, as a result of an\nincrease in the foreign risk-free interest rate.\nC. Correct because the arbitrage equation can be re-arranged as needs require. For example, to get\nthe formula for the forward rate, the above equation can be restated as: F = S x [(1+i)/(1+i )]\nt/d t/d t d\nwhere F is the forward exchange rate, S is the spot exchange rate, i is the foreign risk-free\nt/d t/d f\ninterest rate, and i is the domestic risk-free interest rate. Therefore, the forward exchange rate will\nd\ndecrease as a result of an increase in the domestic risk- free interest rate.\nEconomics: explain the arbitrage relationship between spot and forward exchange rates and interest\nrates, calculate a forward rate using points or in percentage terms, and interpret a forward discount\nor premium", "qhtml": null}, {"n": 50, "q": "Which of the following indicators suggest(s) a monopoly market?", "opts": ["A concentration ratio of 100% only", "A Herfindahl-Hirschman index of zero only", "Both a concentration ratio of 100% and a Herfindahl-Hirschman index of zero"], "ans": "A", "expl": "A. Correct because the concentration ratio is the sum of the market shares of the largest N firms.\nThis number is always between zero (perfect competition) and 100 percent (monopoly).\nB. Incorrect because O.C. Herfindahl and A.O. Hirschman suggested an index where the market\nshares of the top N companies are first squared and then added. If one firm controls the whole\nmarket (a monopoly), the Herfindahl-\nHirschman index (HHI) equals 1.\nC. Incorrect because O.C. Herfindahl and A.O. Hirschman suggested an index where the market\nshares of the top N companies are first squared and then added. If one firm controls the whole\nmarket (a monopoly), the Herfindahl-\nHirschman index (HHI) equals 1.\nEconomics: identify the type of market structure within which a firm operates and describe the use\nand limitations of concentration measures", "qhtml": null}, {"n": 51, "q": "When a country that is a price taker imposes a tariff on an imported good:", "opts": ["national welfare increases.", "consumers gain consumer surplus.", "local producers gain producer surplus."], "ans": "C", "expl": "A. Incorrect because a small country is one that is a price taker in the world market for a product and\ncannot influence the world market price. The welfare effect can be summarized as follows:\nConsumers suffer a loss of consumer surplus, local producers gain producer surplus and the net\nwelfare effect results in a deadweight loss to the country's welfare.\nB. Incorrect because the economic impact of a tariff on imports in a small country is one that is a\nprice taker in the world market for a product and cannot influence the world market price. The\nwelfare effect can be summarized as follows: Consumers suffer a loss of consumer surplus, local\nproducers gain producer surplus and the net welfare effect results in a deadweight loss to the\ncountry's welfare.\nC. Correct because the economic impact of a tariff on imports in small country is one that is a price\ntaker in the world market for a product and cannot influence the world market price. The welfare\neffect can be summarized as follows: Consumers suffer a loss of consumer surplus, local producers\ngain producer surplus and the net welfare effect results in a deadweight loss to the country's welfare.\nEconomics: compare types of trade restrictions, such as tariffs, quotas, and export subsidies, and\ntheir economic implications", "qhtml": null}, {"n": 52, "q": "An ideal international currency regime would most likely have:", "opts": ["currencies that are fully convertible.", "floating exchange rates between currencies.", "a common monetary policy across different countries."], "ans": "A", "expl": "A. Correct because the ideal currency regime would have three properties. One of those properties\nis, all currencies would be fully convertible (ie., currencies could be freely exchanged for any purpose\nand in any amount). This condition ensures unrestricted flow of capital.\nB. Incorrect because the ideal currency regime would have three properties. One of those properties\nstates the exchange rate between any two currencies would be credibly fixed, not floating.\nC. Incorrect because the ideal currency regime would have three properties. One of those properties\nstates each country would be able to undertake fully independent [not common] monetary policy in\npursuit of domestic objectives, such as growth and inflation targets.\nEconomics: describe exchange rate regimes and explain the effects of exchange rates on countries'\ninternational trade and capital flows", "qhtml": null}, {"n": 53, "q": "In the short run, a firm most likely shuts down production when:", "opts": ["economic profit is zero.", "sunk costs are greater than total revenue.", "total revenue is less than total variable cost."], "ans": "C", "expl": "A. Incorrect because in the long run, if a firm cannot earn at least a zero economic profit, it will not\noperate because it is not covering the opportunity cost of all of its factors of production, labor, and\ncapital. In the short run, however, a firm might find it advantageous to continue to operate even if it\nis not earning at least a zero economic profit. Firms will stay in business (short and long run) if they\nmake a zero profit.\nB. Incorrect because sunk costs cannot be avoided, no matter what the firm does. Sunk costs must be\nignored in the decision to continue to operate in the short run. As long as the firm's revenues cover\nat least its variable cost, the firm is better off continuing to operate.\nC. Correct because the firm must cover its variable cost to remain in business in the short run; if TR\ncannot cover TVC, the firm shuts down production to minimize loss. The loss would be equal to the\namount of fixed cost.\nEconomics: determine and interpret breakeven and shutdown points of production, as well as how\neconomies and diseconomies of scale affect costs under perfect and imperfect competition", "qhtml": null}, {"n": 54, "q": "If the spot USD/EUR exchange rate (the amount of USD per one EUR) is 1.1605 and the\none-year forward rate is 1.17240, the forward points are:", "opts": ["+101.5.", "+102.5.", "+119.0."], "ans": "C", "expl": "A. Incorrect because calculating (1-(1.1605/1.17240)) x 10,000 ≈101.5 is not using the correct\nformula of (1.1724 - 1.1605) x 10,000 = 119.0.\nB. Incorrect because calculating (1.17240/1.1605-1) x 10,000 ≈102.5 is not using the correct formula\nof (1.17240 -1.1605 ) x 10,000 = 119.0.\nC. Correct because the forward rate is calculated as (1.17240-1.1605) x 10,000 = 119.0.\nEconomics: explain the arbitrage relationship between spot and forward exchange rates and interest\nrates, calculate a forward rate using points or in percentage terms, and interpret a forward discount\nor premium", "qhtml": null}, {"n": 55, "q": "Under which of the following market structures are pricing strategies most likely\ninfluenced by the expected reaction of other firms?", "opts": ["Oligopoly", "Perfect competition", "Monopolistic competition"], "ans": "A", "expl": "A. Correct because the oligopoly market structure is based on a relatively small number of firms\nsupplying the market. The small number of firms in the market means that each firm must consider\nwhat retaliatory strategies the other firms will pursue when prices and production levels change.\nConsider the pricing behavior of commercial airline companies. Pricing strategies and route\nscheduling are based on the expected reaction of the other carriers in similar markets.\nB. Incorrect because there are many sellers in this type of market structure and firms operating in a\nmarket structure or perfect competition are price takers.\nC. Incorrect because there are many sellers and in the case of monopolistic competition, the success\nof product differentiation determines the degree with which the firm can influence prices.\nEconomics: describe characteristics of perfect competition, monopolistic competition, oligopoly, and\npure monopoly", "qhtml": null}, {"n": 56, "q": "The neutral policy rate is equal to:", "opts": ["long-run expected inflation.", "the real trend rate of growth of the underlying economy.", "long-run expected inflation plus the real trend rate of growth of the underlying economy."], "ans": "C", "expl": "A. Incorrect because the neutral policy rate for any economy comprises two components: Real trend\nrate of growth of the underlying economy, and long-run expected inflation. Also note Neutral rate =\nTrend growth + Inflation target.\nB. Incorrect because the neutral policy rate for any economy comprises two components: Real trend\nrate of growth of the underlying economy, and long-run expected inflation. Also note Neutral rate =\nTrend growth + Inflation target.\nC. Correct because the\nneutral policy rate for any economy comprises two components: Real trend rate of growth of the\nunderlying economy, and long-run expected inflation. Also note Neutral rate = Trend growth +\nInflation target.\nEconomics: describe qualities of effective central banks, contrast their use of inflation, interest rate,\nand exchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy", "qhtml": null}, {"n": 57, "q": "In long-run equilibrium, the perfectly competitive firm's supply curve is best represented\nby the firm's long-run:", "opts": ["marginal cost schedule.", "average revenue schedule.", "marginal revenue schedule."], "ans": "A", "expl": "A. Correct because the long-run marginal cost schedule is the perfectly competitive firm's supply\ncurve. The firm's demand curve is dictated by the aggregate market's equilibrium price. The basic\nrule of profit maximization is that MR = MC, as is the case in long-run equilibrium.\nB. Incorrect because the horizontal line that represents the firm's demand curve is the firm's AR\n[average revenue] schedule.\nC. Incorrect because in a perfectly competitive market structure the firm's demand schedule is the\nsame as the firm's marginal revenue and average revenue. Given its cost of operation, the only\ndecision the perfectly competitive firm faces is how much to produce. The answer is the level of\noutput that maximizes its return, and that level is where MR = MC. The demand curve is perfectly\nelastic. Of course, the firm constantly tries to find ways to lower its cost in the long run.\nEconomics: explain supply and demand relationships under monopolistic competition, including the\noptimal price and output for firms as well as pricing strategy", "qhtml": null}, {"n": 58, "q": "Which of the following is most likely an objective of fiscal policy?", "opts": ["Maintaining price stability", "Affecting aggregate demand", "Achieving an exchange rate target"], "ans": "B", "expl": "A. Incorrect because ensuring price stability is an objective of monetary policy not fiscal policy. There\nis one overarching objective [of the central bank] that most seem to acknowledge explicitly, and that\nis the objective of maintaining price stability.\nB. Correct because the tools associated with fiscal policy involve the use of government spending\nand changing tax revenue to affect a number of aspects of the economy: including the overall level of\naggregate demand in an economy and hence the level of economic activity.\nC. Incorrect because targeting exchange rates is a part of monetary not fiscal policy. Many developing\neconomies choose to operate monetary policy by targeting their currency's exchange rate, rather\nthan an explicit level of domestic inflation.\nEconomics: describe roles and objectives of fiscal policy as well as arguments as to whether the size\nof a national debt relative to GDP matters", "qhtml": null}, {"n": 59, "q": "Which of the following is most likely to limit the effectiveness of monetary policy?", "opts": ["A liquidity trap", "The crowding out effect", "A time lag to implement government spending"], "ans": "A", "expl": "A. Correct because there may be occasions where the demand for money becomes infinitely elastic\nso that further injections of money into the economy will not serve to further lower interest rates or\naffect real activity. This is known as a liquidity trap. In this extreme circumstance, monetary policy\ncan become completely ineffective.\nB. Incorrect because crowding out is the reduction in private sector investment due to increased\ngovernment borrowing and describes a difficulty in implementing fiscal, not monetary, policy.\nC. Incorrect because this is the action lag and describes a difficulty in implementing fiscal policy. An\nexample of the action lag is the government's decision to raise spending on capital projects to\nincrease employment and incomes, but they may take many months to implement.\nEconomics: describe qualities of effective central banks; contrast their use of inflation, interest rate,\nand exchange rate targeting in expansionary or contractionary monetary policy, and describe the\nlimitations of monetary policy", "qhtml": null}, {"n": 60, "q": "Which of the following is a limitation of monetary policy?", "opts": ["The presence of automatic stabilizers in the economy", "The ineffectiveness of interest rate adjustments in deflationary environments", "The uneven distribution of income and wealth among different segments of the population"], "ans": "B", "expl": "A. Incorrect because this is not a limitation of monetary policy. Automatic stabilizers [are features\nwhich] reduce output fluctuations in the economy and impact fiscal policy.\nB. Correct because this is a limitation of monetary policy. The limitations of monetary policy include\nproblems in the transmission mechanism and the relative ineffectiveness of interest rate adjustment\nas a policy tool in deflationary environments.\nC. Incorrect because this is not a limitation of monetary policy. This is an aspect of the economy that\nfiscal policy tools try to address. The limitations of monetary policy include problems in the\ntransmission mechanism and the relative ineffectiveness of interest rate adjustment as a policy tool\nin deflationary environments.\nEconomics: describe qualities of effective central banks, contrast their use of inflation, interest rate,\nand exchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy", "qhtml": null}, {"n": 61, "q": "The main objective of the World Bank Group is to:", "opts": ["support exchange rate stability and an open system of international payments.", "provide the legal and institutional foundation of the multinational trading system.", "help developing countries fight poverty and enhance environmentally sound economic growth."], "ans": "C", "expl": "A. Incorrect because this refers to a key objective for the International Monetary Fund. That is, the\nIMF supports exchange rate stability and an open system of international payments.\nB. Incorrect because this refers to a key objective for the World Trade Organization. That is, the WTO\nprovides the legal and institutional foundation of the multinational trading system.\nC. Correct because the World Bank's main objective is to help developing countries fight poverty and\nenhance environmentally sound economic growth.\nEconomics: describe functions and objectives of the international organizations that facilitate trade,\nincluding the World Bank, the International Monetary Fund, and the World Trade Organization", "qhtml": null}, {"n": 62, "q": "Which of the following is an expansionary fiscal policy?", "opts": ["An increase in sales taxes", "A decrease in interest rates", "in public spending on infrastructure"], "ans": "C", "expl": "A. Incorrect because expansionary [fiscal] policy could take one or more of the following forms:...\nCuts in sales (indirect) taxes to lower prices which raises real incomes with the objective of raising\nconsumer demand. Thus, an increase in sales taxes would be contractionary, not expansionary.\nB. Incorrect because when the economy is slowing and inflation and monetary trends are weakening,\ncentral banks may increase liquidity by cutting their target [interest] rate. In these circumstances,\nmonetary policy is said to be expansionary. Thus while expansionary, this is an example of monetary\nrather than fiscal policy.\nC. Correct because there are a number of ways that fiscal policy can influence aggregate demand...\nexpansionary policy could take one or more of the following forms:... New public spending on social\ngoods and infrastructure.\nEconomics: explain the implementation of fiscal policy and difficulties of implementation as well as\nwhether a fiscal policy is expansionary or contractionary", "qhtml": null}, {"n": 63, "q": "If the spot rate for AUD/USD (amount of AUD per 1 USD) is 1.4780 and the 1-month\nforward points are -16.0, the 1-month forward rate for AUD/USD is closest to:", "opts": ["1.3180.", "1.4764.", "1.4796."], "ans": "B", "expl": "A. Incorrect because to convert any of these quoted forward points into a forward rate, one would\ndivide the number of points by 10,000 (to scale down to the fourth decimal place, the last decimal\nplace in the spot quote) and then add the result to the spot exchange rate quote The forward points\nwere incorrectly divided by 100 and the forward rate was calculated as follows -16/100+1.4780=-\n0.16+1.4780=1.3180.\nB. Correct because to convert any of these quoted forward points into a forward rate, one would\ndivide the number of points by 10.000 (to scale down to the fourth decimal place, the last decimal\nplace in the spot quote) and then add the result to the spot exchange rate quote. The forward points\nare negative and therefore the forward rate = - 16/10,000+ 1.4780=-0.0016+1.4780 =1.4764.\nC. Incorrect because to conved any of these quoted forward points into a forward rate one would\ndivide the number of points by 10.000 (to scale down to the fourth decimal place, the last decimal\nplace in the spat quote) and then add the result to the spot exchange rate quote. In this case the\nforward points have been treated as a positive number as follows: 16/10,000+ 1.4780 = 0.0016 +\n1.4780 = 1.4796.\nEconomics: explain the arbitrage relationship between spot and forward exchange rates and interest\nrates, calculate a forward rate using points or in percentage terms, and interpret a forward discount\nor premium", "qhtml": null}, {"n": 64, "q": "When a central bank sells government bonds to commercial banks, broad money growth:", "opts": ["decreases.", "remains the same.", "increases."], "ans": "A", "expl": "A. Correct because when a central bank sells government bonds to a commercial bank the reserves\nof commercial banks decline, reducing their capacity to make loans (1.e., create credit) to\nhouseholds and corporations and thus causing broad money growth to decline through the money\nmultiplier mechanism.\nB. Incorrect because when a central bank sells government bonds to a commercial bank the reserves\nof commercial banks decline, reducing their capacity to make loans (ie., create credit) to households\nand corporations and thus causing broad money growth to decline through the money multiplier\nmechanism.\nC. Incorrect because when a central bank sells government bonds to a commercial bank the reserves\nof commercial banks decline, reducing their capacity to make loans (ie., create credit) to households\nand corporations and thus causing broad money growth to decline through the money multiplier\nmechanism.\nEconomics: describe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth, inflation,\ninterest, and exchange rates", "qhtml": null}, {"n": 65, "q": "When a country has a fiscal surplus and an excess of private saving over investment, its\nexports are:", "opts": ["less than its imports.", "equal to its imports.", "greater than its imports."], "ans": "C", "expl": "A. Incorrect because when a country has a fiscal surplus (T> G) and an excess of private saving over\ninvestment (S > I), its exports are greater than [not less than] its imports (X> M).\nB. Incorrect because when a country has a fiscal surplus (T> G) and an excess of private saving over\ninvestment (S> I), its exports are greater than [not less than] its imports (X> M).\nC. Correct because using a fundamental identity from Macroeconomics: the relationship between\nthe trade balance and expenditure/saving decisions can be expressed as: X-M = (S-I) + (T-G) where X\nrepresents exports, M is imports, S is private savings, I is investment in plant and equipment, T is\ntaxes net of transfers, and G is government expenditure. From this relationship, we can see that a\ntrade surplus (X> M) must be reflected in a fiscal surplus (T> G), an excess of private saving over\ninvestment (S> I), or both\nWe can also see that when a country has a fiscal surplus (T> G) and an excess of private saving over\ninvestment (S>I), its exports are greater than its imports (X>M).\nEconomics: describe exchange rate regimes and explain the effects of exchange rates on countries'\ninternational trade and capital flows", "qhtml": null}, {"n": 66, "q": "Which of the following behavioral archetypes best describes a country that is high on the\nglobalization spectrum but low on the cooperation spectrum?", "opts": ["Autarky", "Hegemony", "Bilateralism"], "ans": "B", "expl": "A. Incorrect because there are four archetypes of country behavior: autarky, hegemony,\nmultilateralism, and bilateralism, where autarky is situated low on the cooperation spectrum and low\n(not high) on the globalization spectrum. Autarky describes countries seeking political self-sufficiency\nwith little or no external trade or finance. State-owned enterprises control strategic domestic\nindustries\nB. Correct because using the two axes we have discussed-political cooperation versus non-\ncooperation and globalization versus nationalism--Investment analysts can assess geopolitical actors\nand the likelihood of threat to investment outcomes Specifically, there are four archetypes of country\nbehavior, autarky, hegemony. multilateralism, and bilateralism, where hegemony is situated low on\nthe cooperation spectrum and high on the globalization spectrum. Hegemonic countries tend to be\nregional or even global leaders..and they use their political areentomic influence of others to control\nresources State-owned enterprises teed le control key export markets Examples of hegemonic\ncountries include the united States and Russia\nC. Incorrect because there are four archetypes of country behavior autarky, hegemony,\nmultilateralism, and bilateralism, where bilateralism is situated high on the cooperation (not\nglobalization) spectrum and low on the globalization (not cooperation) spectrum. Bilateralism is the\nconduct of political, economic, financial, or cultural cooperation between two countries. Countries\nengaging in bilateralism may have relations with many different countries, but they are one-at-a-time\nagreements without multiple partners.\nEconomics: describe geopolitics from a cooperation versus competition perspective", "qhtml": null}, {"n": 67, "q": "An analyst gathers the following data about an economy:\n● Real trend growth rate 0.5%\n● Central bank's policy rate 1.5%\nIf monetary policy is contractionary, the central bank's inflation target is:", "opts": ["less than 1.0%.", "equal to 1.0%.", "greater than 1.0%."], "ans": "A", "expl": "A. Correct because when policy rates are above the neutral rate, monetary policy is contractionary\nwhen they are below the neutral rate, monetary policy is expansionary. The calculation of the neutral\nrate is as follows: Neutral rate Trend growth Inflation target. Therefore, if monetary policy is\ncontractionary then the policy rate (1.5%) must be greater than the neutral rate. Hence the long-\nterm inflation rate must be less than 1.0% in order for the policy rate to be greater than the neutral\nrate\n8. Incorrect because when policy rates are above the neutral rate, monetary policy is contractionary\nwhen they are below the neutral rate, monetary policy is expansionary. The calculation of the neutral\nrate is as follows: Neutral rate = Trend growth + Inflation target. Therefore, if monetary policy is\ncontractionary then the policy rate (1.5%) must be greater than the neutral rate. Hence the long-\nterm inflation rate must be less than 1.0% in order for the policy rate to be greater than the neutral\nrate.\nC. Incorrect because when policy rates are above the neutral rate, monetary policy is contractionary;\nwhen they are below the neutral rate, monetary policy is expansionary. The calculation of the neutral\nrate is as follows: Neutral rate Trend growth + Inflation target. Therefore if monetary policy is\ncontractionary then the policy rate (1.5%) must be greater than the neutral rate. Hence the long-\nterm inflation rate must be less than 1.0% in order for the policy rate to be greater than the neutral\nrate.\nEconomics: describe qualities of effective central banks; contrast their use of inflation, interest rate,\nand exchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy", "qhtml": null}, {"n": 68, "q": "An analyst gathers the following information (in $ millions) about a firm operating in a\nperfectly competitive market:\n● Total variable costs 700\n● Total fixed costs 400\nIf the firm's total revenue is $1,000 million, the firm should:", "opts": ["stay in the market in both the short run and long run.", "stay in the market in the short run and exit the market in the long run.", "shut down production in the short run and exit the market in the long run."], "ans": "B", "expl": "A. Incorrect because TR > TVC but < TC. As such the firm will stay in the market in the short run and\nexit the market in the long run.\nB. Correct because when TR total revenue is enough to cover TVC (total variable costs) but not all of\nTFC total continue to produce in the short run but will be unable to maintain financial solvency in\n1,000 which is greater than TVC of $700, but not enough to cover the firm's TFC of $400. Therefore\nthe firm will exit the market the long run.\nC. Incorrect because TR > TVC but <TC Therefore, the firm will stay in the market in the short run\nbecause TR is enough to cover TVC, the firm can continue to produce in the short run.\nEconomics: determine and interpret breakeven and shutdown competition points of production, as\nwell as how economies and diseconomies of scale affect costs under perfect and imperfect\ncompetition", "qhtml": null}, {"n": 69, "q": "To be effective in targeting inflation a central bank is least likely to need:", "opts": ["government oversight.", "transparency of decisions.", "credibility with market participants."], "ans": "A", "expl": "A. Correct because an inflation-targeting framework normally has the following set of features - An\nindependent and credible central bank.\nB. Incorrect because by explaining their views on the economy and by being transparent in decision\nmaking, the independent, inflation-targeting central banks seek to gain reputation and credibility,\nmaking it easier to influence inflation expectations and hence ultimately easier to meet the inflation\ntarget.\nC. Incorrect because credibility-the independence of the central bank and public confidence in it are\nkey in the design of an inflation-targeting regime.\nEconomics: describe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth, inflation,\ninterest, and exchange rates", "qhtml": null}, {"n": 70, "q": "To increase liquidity, a central bank most likely implements an interest rate policy that is:", "opts": ["contractionary.", "neutral.", "expansionary."], "ans": "C", "expl": "A. Incorrect because when they [central banks] believe that economic activity is likely to lead to an\nincrease in inflation, they might increase interest rates, thereby reducing liquidity. In these cases,\nmarket analysts describe such actions as contractionary.\nB. Incorrect because the neutral rate is that rate of interest that neither spurs on nor slows down the\nunderlying economy. As such, when policy rates are above the neutral rate, monetary policy is\ncontractionary, when they are below the neutral rate, monetary policy is expansionary\nC. Correct because when the economy is slowing and inflation and monetary trends are weakening,\ncentral banks may increase liquidity by cutting their target rate. In these circumstances, monetary\npolicy is said to be expansionary.\nEconomics: describe qualities of effective central banks, contrast their use of inflation, interest rate,\nand exchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy", "qhtml": null}, {"n": 71, "q": "The conversion of nominal exchange rates into real exchange rates requires the:", "opts": ["GDP of both countries.", "price levels in both countries.", "interest rates in both countries."], "ans": "B", "expl": "A. Incorrect because real exchange rates adjust for the price level in both countries not GDP. Real\nexchange rates, which are indexes often constructed by economists and other market analysts to\nassess changes in the relative purchasing power of one currency compared with another. Creating\nthese indexes requires adjusting the nominal exchange rate by using the price levels in each country\nof the currency pair\nB. Correct because real exchange rates, which are indexes often constructed by economists and\nother market analysts to assess changes in the relative purchasing power of one currency compared\nwith another. Creating these indexes requires adjusting the nominal exchange rate by using the price\nlevels in each country of the currency pair\nC. Incorrect because real exchange rates adjust for the price level in both countries not interest rates.\nReal exchange rates, which are indexes often constructed by economists and other market analysts\nto assess changes in the relative purchasing power of one currency compared with another. Creating\nthese indexes requires adjusting the nominal exchange rate by using the price levels in each country\nof the currency pair.\nEconomics: describe the foreign exchange market, including its functions and participants,\ndistinguish between nominal and real exchange rates, and calculate and interpret the percentage\nchange in a currency relative to another currency", "qhtml": null}, {"n": 72, "q": "Which of the following is most likely a benefit of globalization?", "opts": ["Increased profits", "More equal income distribution", "Stronger environmental, social, and governance standards"], "ans": "A", "expl": "A. Correct because the opportunity to generate higher profits may motivate companies to globalize.\nThe first way to generate profit is to increase sales. Companies may choose to engage in globalization\nin order to access new customers for their goods and services. Another way to increase profits is to\nreduce costs. Globalization allows companies to access lower tax-operating environments, reduce\nlabor costs, or seek other supply chain efficiency gains\nB. Incorrect because globalization can contribute to income and wealth inequality, as well as\ndifferences in opportunity, within and between countries.\nC. Incorrect because companies operating in lower-cost countries often operate in the local\nstandards of those countries. If standards on environmental protection, social benefits, or corporate\ngovernance are lower in one country compared to another and companies ultimately reduce their\nstandards of production in that context, then globalization can create a drain on human,\nadministrative, and environmental resources.\nEconomics: describe geopolitics and its relationship with globalization", "qhtml": null}, {"n": 73, "q": "Natural disasters are an example of:", "opts": ["event risk.", "thematic risk.", "exogenous risk."], "ans": "C", "expl": "A. Incorrect because event risk evolves around set dates, such as elections, new legislation, or other\ndate-driven milestones, such as holidays or political anniversaries, known in advance.\nB. Incorrect because thematic risks are known risks that evolve and expand over a period of time.\nClimate change, pattern migration, the rise of populist forces, and the ongoing threat of terrorism fall\ninto this category.\nC. Correct because exogenous risk is a sudden or unanticipated risk that impacts either a country's\ncooperative stance, the ability of non-state actors to globalize, or both. Examples include sudden\nuprisings, invasions, or the aftermath of natural disasters.\nEconomics: describe the impact of geopolitical risk on investments", "qhtml": null}, {"n": 74, "q": "Which of the following changes are investors most likely to make in response to a black\nswan risk?", "opts": ["Tactical", "Sector specific", "Asset allocation"], "ans": "A", "expl": "A. Correct because the velocity of geopolitical risk is the pace at which it impacts an investor\nportfolio. For the sake of simplicity, we explore short-term or 'high velocity' impacts, medium-term,\nand long-term or 'low velocity' impacts []. In the short term, we may see volatility in the markets\naffecting entire industries or even the entire market. Exogenous or 'black swan' events tend to fit into\nthis category, causing market volatility and investor flight to quality. A black swan risk is an event that\nis rare and difficult to predict but has an important impact. Investors with the appropriate time\nhorizon and risk tolerance may make tactical changes to their investment choices as a result of these\nevents. Long-term changes are unlikely to be necessary.\nB. Incorrect because this relates to a medium-term impact of geopolitical risk instead: Risks with a\nmedium-term impact may begin to impair companies' processes, costs, and investment\nopportunities, resulting in lower valuations. These risks tend to be distributed towards specific\nsectors, meaning they will impact some companies much more than others.\nC. Incorrect because this relates to a low velocity impact of geopolitical risk instead: The velocity of\ngeopolitical risk is the pace at which it impacts an investor portfolio. For the sake of simplicity, we\nexplore short-term or 'high velocity' impacts, medium-term, and long-term or 'low velocity' impacts.\nAnd long-term risks may have important environmental, social, governance, and other impacts. This\ncan impact an investor's asset allocation-including choice of asset classes and investment styles-for a\nlong-term horizon; however, the immediate impact on portfolios is likely to be more limited.\nEconomics: describe the impact of geopolitical risk on investments", "qhtml": null}, {"n": 75, "q": "During the recovery phase of the business cycle, inflation most likely.", "opts": ["remains moderate.", "further accelerates.", "decelerates but with a lag."], "ans": "A", "expl": "A. Correct because, in the \"recovery\" phase, inflation remains moderate.\nB. Incorrect because, in the \"recovery\" phase, inflation remains moderate and in the \"slowdown\"\nphase inflation further accelerates.\nC. Incorrect because, in the \"recovery\" phase, inflation remains moderate and in the \"contraction\"\nphase inflation decelerates but with a lag.\nEconomics: describe the business cycle and its phases", "qhtml": null}, {"n": 76, "q": "The Herfindahl-Hirschman index is calculated based on:", "opts": ["market shares of the companies.", "elasticity of demand in the market.", "probability of new entry into the market."], "ans": "A", "expl": "A. Correct because in calculating the Herfindahl-Hirschman index the market shares of the top N\ncompanies are first squared and then added. If one firm controls the whole market (a monopoly), the\nHerfindahl-Hirschman index (HHI) equals 1. If there are M firms in the industry with equal market\nshares, then the HHI equals (1/M).\nB. Incorrect because just like the concentration ratio, the HHI does not take the possibility of entry\ninto account, nor does it consider the elasticity of demand.\nC. Incorrect because just like the concentration ratio, the HHI does not take the possibility of entry\ninto account, nor does it consider the elasticity of demand.\nEconomics: identify the type of market structure within which a firm operates and describe the use\nand limitations of concentration measures", "qhtml": null}];
const CFG = {"title": "Economics", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 152, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->

<style id="qnav-note-css">
  #navGrid .cell.noted::before{content:"\1F4DD";position:absolute;top:-4px;left:-3px;font-size:10px;line-height:1}
</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnav-note-end-->
