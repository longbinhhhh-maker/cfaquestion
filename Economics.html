<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Fiscal policy refers to the government's decisions about:","opts":["taxation only.","taxation and spending only.","taxation, spending, and the quantity of money in the economy."],"ans":"B","expl":"A. Không chính xác vì chính sách tài khóa đề cập đến các quyết định của chính phủ về thuế và chi tiêu.\nB. Đúng vì chính sách tài khóa đề cập đến các quyết định của chính phủ về thuế và chi tiêu.\nC. Không chính xác vì chính sách tiền tệ đề cập đến các hoạt động của ngân hàng trung ương nhằm\ntác động đến số lượng tiền và tín dụng trong nền kinh tế. Ngược lại, chính sách tài khóa đề cập đến\ncác quyết định của chính phủ về thuế và chi tiêu.\nKinh tế: so sánh chính sách tiền tệ và tài chính","qhtml":null},{"n":2,"q":"Under which of the following market structures is product differentiation most important?","opts":["Monopoly","Perfect competition","Monopolistic competition"],"ans":"C","expl":"A. Không chính xác vì cấu trúc thị trường ít cạnh tranh nhất là độc quyền. Trong các thị trường độc quyền thuần túy,\nkhông có sản phẩm thay thế tốt nào khác cho sản phẩm hoặc dịch vụ nhất định. Chỉ có một người bán duy nhất, nếu\nđược phép hoạt động mà không bị ràng buộc, sẽ có quyền lực đáng kể trong việc đưa ra các quyết định về giá cả và sản lượng\n.\nB. Không chính xác vì cạnh tranh hoàn hảo là một thực tế - ví dụ: ở một số thị trường hàng hóa,\nnơi người bán và người mua có sản phẩm hoàn toàn đồng nhất và không có nhà sản xuất nào đủ lớn\nđể ảnh hưởng đến giá cả thị trường. Không thể tạo ra sự khác biệt hóa sản phẩm trong môi trường cạnh tranh hoàn hảo.\nC. Đúng vì cạnh tranh độc quyền cũng có tính cạnh tranh cao; tuy nhiên, nó được coi là một\nhình thức cạnh tranh không hoàn hảo. Đặc điểm cạnh tranh là số lượng lớn các công ty,\ntrong khi khía cạnh độc quyền là kết quả của sự khác biệt hóa sản phẩm. Nghĩa là, nếu người bán có thể thuyết phục\nngười tiêu dùng rằng sản phẩm của họ khác biệt duy nhất so với các sản phẩm tương tự khác, thì người bán có thể\nthực hiện một số mức độ quyền lực định giá trên thị trường.\nKinh tế: xác định loại cấu trúc thị trường trong đó một công ty hoạt động và mô tả việc sử dụng\nvà những hạn chế của các biện pháp tập trung","qhtml":null},{"n":3,"q":"Which of the following economic policies is most likely directed toward influencing the\nquantity of credit in an economy?","opts":["Fiscal policy only","Monetary policy only","Both fiscal policy and monetary policy"],"ans":"B","expl":"A. Không chính xác vì chính sách tài khóa đề cập đến các quyết định của chính phủ về thuế và chi tiêu\nvà nó không liên quan trực tiếp đến lượng tín dụng trong nền kinh tế.\nB. Đúng vì chính sách tiền tệ đề cập đến các hoạt động của ngân hàng trung ương hướng tới\ntác động đến lượng tiền và tín dụng trong nền kinh tế.\nC. Không chính xác vì chính sách tài khóa đề cập đến các quyết định của chính phủ về thuế và chi tiêu\nvà nó không liên quan trực tiếp đến lượng tín dụng trong nền kinh tế.\nKinh tế: so sánh chính sách tiền tệ và tài khóa","qhtml":null},{"n":4,"q":"An analyst gathers the following information:\n● USD/AUD spot rate 0.8027\n● AUD 1-year interest rate 3.30%\n● USD 1-year interest rate 2.42%\nUSD/AUD is the amount of USD per 1 AUD.\nThe USD/AUD 1-year forward rate is closest to:","opts":["0.7959.","0.8096.","0.8292."],"ans":"A","expl":"A. Đúng vì F = F ((1+i)/(1+i )). Thay thế các giá trị, F = 0,8027 x\nt/d t/d f d t/d\n((1+0,0242)/(1+0,033)) = 0,7959.\nB. Không chính xác vì nó sử dụng công thức sai F = F ((1+ i )/(1+ i))). Thay thế các giá trị,\nt/d t/d d f\nF = 0,8027 x ((1+0,033)/(1+0,0242)) 0,8096.\nt/d\nC. Không chính xác vì nó sử dụng công thức sai F = F (1+i). Thay thế các giá trị, F = 0,8027\nt/d t/d f t/d\n× (1+0,033) -0,8292.\nKinh tế học: giải thích mối quan hệ chênh lệch giữa tỷ giá hối đoái giao ngay và kỳ hạn và lãi suất\ntỷ giá kỳ hạn, tính tỷ giá kỳ hạn bằng cách sử dụng điểm hoặc theo thuật ngữ và diễn giải tỷ lệ phần trăm kỳ hạn giảm giá\nhoặc cao cấp","qhtml":null},{"n":5,"q":"With respect to fiscal policy, transfer payments are best described as:","opts":["welfare payments.","infrastructure spending.","spending on recurring goods and services."],"ans":"A","expl":"A. Đúng vì các khoản thanh toán chuyển nhượng là các khoản thanh toán phúc lợi được thực hiện thông qua hệ thống\nan sinh xã hội và tùy thuộc vào quốc gia, bao gồm các khoản thanh toán cho lương hưu nhà nước, trợ cấp nhà ở, tín dụng thuế\nvà hỗ trợ thu nhập cho các gia đình nghèo hơn, trợ cấp trẻ em, trợ cấp thất nghiệp và trợ cấp tìm kiếm việc làm\nphụ cấp\nB. Không chính xác vì chi tiêu vốn bao gồm chi tiêu cơ sở hạ tầng cho đường sá, bệnh viện,\nnhà tù và trường học, chứ không phải các khoản thanh toán chuyển nhượng.\nC. Không chính xác vì chi tiêu hiện tại của chính phủ liên quan đến chi tiêu cho hàng hóa và dịch vụ được\ncung cấp thường xuyên, định kỳ-bao gồm y tế, giáo dục và quốc phòng, chứ không phải chuyển\ncác khoản thanh toán.\nKinh tế: mô tả các công cụ của chính sách tài khóa, bao gồm cả ưu điểm và nhược điểm của chúng","qhtml":null},{"n":6,"q":"Which of the following economic conditions for a country best supports a well-functioning\ncurrency board exchange rate system?","opts":["Flexible domestic prices and wages","Rapid growth in supply of the global reserve asset","Large non-traded sectors of the domestic economy"],"ans":"A","expl":"A. Đúng vì hệ thống bảng tiền tệ hoạt động tốt nhất nếu giá cả và tiền lương trong nước rất\nlinh hoạt.\nB. Không chính xác vì hệ thống bảng tiền tệ hoạt động tốt nhất khi nguồn cung tài sản dự trữ toàn cầu\ntăng trưởng với tốc độ chậm, ổn định phù hợp với tăng trưởng thực tế dài hạn với giá cả ổn định.\nC. Không chính xác vì hệ thống bảng tiền tệ hoạt động tốt nhất nếu các khu vực phi thương mại của nền kinh tế\ntrong nước tương đối nhỏ.\nKinh tế: mô tả chế độ tỷ giá hối đoái và giải thích tác động của tỷ giá hối đoái đối với\nthương mại quốc tế và dòng vốn","qhtml":null},{"n":7,"q":"Which of the following indexes is most likely considered a leading economic indicator?","opts":["Consumer price index","Broad stock market index","Industrial production index"],"ans":"B","expl":"A. Không chính xác vì chỉ số giá tiêu dùng được coi là chỉ báo độ trễ: Lạm phát nhìn chung\nđiều chỉnh theo chu kỳ muộn, đặc biệt là khu vực dịch vụ ổn định hơn.\nB. Đúng vì với tư cách là một chỉ báo kinh tế hàng đầu, sự thay đổi tích cực trong Chỉ số S&P 500\nđược cho là sẽ dẫn đến (đi trước) sự gia tăng trong hoạt động kinh tế tổng hợp. Sự gia tăng S&P\n500 sẽ là điều tích cực cho tăng trưởng kinh tế trong tương lai, tất cả các yếu tố khác đều như nhau. Ngoài ra, Chỉ số Vốn chủ sở hữu Euro Stoxx\nđược coi là chỉ báo hàng đầu tại Khu vực đồng tiền chung châu Âu\nC. Không chính xác vì chỉ số này đo lường sản lượng công nghiệp, do đó nắm bắt được hành vi của bộ phận\nkhông ổn định nhất trong nền kinh tế. Chỉ số này được coi là một trong 4 chỉ số ngẫu nhiên ở\nHoa Kỳ do Conference Board theo dõi.\nKinh tế: mô tả mức độ sử dụng tài nguyên, hoạt động kinh doanh và tiêu dùng, hoạt động trong lĩnh vực nhà ở và\nhoạt động của lĩnh vực ngoại thương thay đổi theo chu kỳ kinh doanh và mô tả cách đo lường chúng bằng cách sử dụng\ncác chỉ số kinh tế","qhtml":null},{"n":8,"q":"Independence, credibility, and transparency are most likely:","opts":["key objectives of fiscal policy.","properties of the monetary transmission mechanism.","qualities that determine the success of an inflation-targeting central bank."],"ans":"C","expl":"A. Không chính xác vì đây là những phẩm chất của một ngân hàng trung ương. Mục đích chính của chính sách tài khóa là giúp\nquản lý nền kinh tế thông qua ảnh hưởng của nó đối với tổng sản lượng quốc gia, tức là GDP thực tế.\nB. Không chính xác vì đây là những phẩm chất của một ngân hàng trung ương thực hiện thành công mục tiêu lạm phát. Cơ chế truyền dẫn tiền tệ\nlà quá trình trong đó lãi suất của ngân hàng trung ương được truyền\nthông qua nền kinh tế và cuối cùng ảnh hưởng đến tốc độ tăng giá - tức là lạm phát. Các kênh\nđó bao gồm lãi suất cho vay ngân hàng, giá tài sản, kỳ vọng của đại lý và tỷ giá hối đoái.\nC. Đúng vì mặc dù các chế độ nhắm mục tiêu lạm phát thay đổi đôi chút tùy theo từng nền kinh tế, nhưng\nthành công của chúng được cho là phụ thuộc vào ba khái niệm chính: tính độc lập, độ tin cậy của ngân hàng trung ương và\ntính minh bạch.\nKinh tế: mô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và cơ chế truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế, lạm phát,\nlãi suất và tỷ giá hối đoái","qhtml":null},{"n":9,"q":"With respect to geopolitics, setting standards for the size and shape of containers used for\nshipping is most likely an example of:","opts":["regulatory cooperation.","process standardization.","operational synchronization."],"ans":"C","expl":"A. Không chính xác vì hợp tác quản lý bao gồm việc thành lập các cơ quan quản lý như Basel\nỦy ban giám sát ngân hàng (BCBS) thay vì đặt ra các tiêu chuẩn về kích thước và hình dạng thùng chứa.\nB. Không chính xác vì việc tiêu chuẩn hóa quy trình bao gồm việc thiết lập các quy trình như Hiệp hội\nViền thông tài chính liên ngân hàng toàn cầu (SWIFT) thay vì đặt tiêu chuẩn cho\nkích thước và hình dạng vùng chứa.\nC. Đúng vì một ví dụ về đồng bộ hóa vận hành là các tiêu chuẩn được đặt ra cho các container có\nkích thước và hình dạng đồng nhất sử dụng các hình thức vận tải đa phương thức (đường bộ, đường biển, đường hàng không, đường sắt) và cần trục tại cảng.\nKinh tế: mô tả địa chính trị từ góc độ hợp tác và cạnh tranh","qhtml":null},{"n":10,"q":"A nation that cooperates with a neighboring country is most likely characterized as:","opts":["autarkic.","bilateral.","hegemonic."],"ans":"B","expl":"A. Không chính xác vì chế độ tự túc mô tả các quốc gia đang tìm kiếm sự tự chủ về chính trị với rất ít hoặc không có\nthương mại hoặc tài chính bên ngoài. Các nước tự trị có xu hướng không hợp tác với các nước khác.\nB. Đúng vì chủ nghĩa song phương là sự tiến hành hợp tác\nchính trị, kinh tế, hoặc văn hóa giữa hai quốc gia. Các quốc gia tham gia vào chủ nghĩa song phương có thể có quan hệ với\nnhiều quốc gia khác nhau, nhưng đó là những thỏa thuận từng lần một mà không có nhiều đối tác.\nC. Không chính xác vì các quốc gia bá quyền có xu hướng trở thành các nhà lãnh đạo khu vực hoặc thậm chí toàn cầu và họ sử dụng\nảnh hưởng chính trị hoặc kinh tế của mình từ người khác để kiểm soát các nguồn lực. Sự thống trị về kinh tế và chính trị\ncó thể mang lại ảnh hưởng quan trọng đến các vấn đề toàn cầu. Do đó, các nước bá quyền có xu hướng dẫn đầu hoặc\nthống trị hơn là hợp tác.\nKinh tế: mô tả địa chính trị từ góc độ hợp tác và cạnh tranh","qhtml":null},{"n":11,"q":"The inflation target of an effective central bank is most likely:","opts":["equal to zero to avoid the risk of deflation.","sufficiently below zero to maintain high credibility.","low enough to ensure a significant degree of price stability."],"ans":"C","expl":"A. Không chính xác vì khuôn khổ mục tiêu lạm phát thường có\nmục tiêu lạm phát trung hạn rõ ràng, cân xứng và hướng tới tương lai, đủ trên 0 phần trăm để tránh rủi ro giảm phát nhưng\nđủ thấp để đảm bảo mức độ ổn định giá đáng kể\nB. Không chính xác vì khuôn khổ lạm phát mục tiêu thường có mục tiêu lạm phát trung hạn rõ ràng, cân xứng và hướng tới tương lai\n, đủ trên 0 phần trăm để tránh rủi ro giảm phát nhưng\nđủ thấp để đảm bảo mức độ ổn định giá cả đáng kể.\nC. Đúng vì khuôn khổ lạm phát mục tiêu thường có mục tiêu lạm phát trung hạn rõ ràng, cân xứng và hướng tới tương lai, đủ trên 0 phần trăm để tránh rủi ro giảm phát nhưng\nđủ thấp để đảm bảo mức độ ổn định giá đáng kể.\nKinh tế: mô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và cơ chế truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế, lạm phát,\nlãi suất và tỷ giá hối đoái","qhtml":null},{"n":12,"q":"Under which of the following conditions is monetary policy most effective? When the:","opts":["demand for money is infinitely elastic.","central bank targets an exchange rate.","risk of inflation is greater than deflation."],"ans":"C","expl":"A. Không chính xác vì điều này dẫn đến bẫy thanh khoản. Trong những trường hợp rất cực đoan, có thể có những trường hợp\nnhu cầu về tiền trở nên co giãn vô hạn nên việc bơm thêm tiền vào nền kinh tế\nsẽ không giúp giảm lãi suất hơn nữa hoặc ảnh hưởng đến hoạt động thực tế. Điều này được gọi là\nbẫy thanh khoản trong hoàn cảnh cực đoan này, chính sách tiền tệ có thể trở nên hoàn toàn không hiệu quả.\nB. Không chính xác vì khi ngân hàng trung ương hoặc cơ quan tiền tệ chọn nhắm mục tiêu\ntỷ giá hối đoái, lãi suất và điều kiện trong nền kinh tế trong nước sẽ thích ứng để phù hợp với mục tiêu này\nvà lãi suất trong nước cũng như cung tiền có thể trở nên biến động hơn.\nC. Đúng vì giảm phát gây khó khăn cho ngân hàng trung ương hơn là lạm phát. Giảm phát là một\nthất bại phổ biến và dai dẳng về chỉ số giá chung và chính sách tiền tệ truyền thống\nkhó giải quyết hơn là lạm phát. Điều này là do việc cắt giảm lãi suất danh nghĩa xuống dưới 0 nhiều để\nkích thích nền kinh tế là điều khó khăn. Tại thời điểm này, các điều kiện kinh tế cho bẫy thanh khoản\nxuất hiện.\nKinh tế: mô tả phẩm chất hiệu quả của các ngân hàng trung ương, đối chiếu việc sử dụng lạm phát, lãi suất\nvà nhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp và mô tả\nhạn chế của chính sách tiền tệ","qhtml":null},{"n":13,"q":"Cyber threats most likely fall into the category of:","opts":["event risk.","thematic risk.","exogenous risk."],"ans":"B","expl":"A. Không chính xác vì rủi ro sự kiện phát triển xung quanh các ngày đã định, chẳng hạn như bầu cử, luật mới hoặc các cột mốc\ntheo ngày khác, chẳng hạn như ngày lễ hoặc ngày kỷ niệm chính trị, đã được biết trước, trong khi rủi ro\ntheo chủ đề là những rủi ro đã biết phát triển và mở rộng theo một khoảng thời gian và các mối đe dọa trên mạng là một ví dụ\nvề rủi ro theo chủ đề.\nB. Đúng vì các mối đe dọa trên mạng là một ví dụ khác về rủi ro theo chủ đề.\nC. Không chính xác vì rủi ro ngoại sinh là rủi ro bất ngờ hoặc không lường trước được, ảnh hưởng đến lập trường hợp tác\ncủa một quốc gia, khả năng toàn cầu hóa của các chủ thể phi nhà nước hoặc cả hai. Các ví dụ bao gồm\ncác cuộc nổi dậy, xâm lược hoặc hậu quả của thiên tai bất ngờ, trong khi rủi ro theo chủ đề là những rủi ro đã biết\nphát triển và mở rộng theo thời gian và các mối đe dọa trên mạng là [một ví dụ về rủi ro theo chủ đề]\nKinh tế: mô tả tác động của rủi ro địa chính trị đối với các khoản đầu tư","qhtml":null},{"n":14,"q":"Fiat money:","opts":["is not currently used in any major economy.","can be exchanged for a precious metal at the country's central bank.","derives its value via government decree and because people accept it for payment."],"ans":"C","expl":"A. Không chính xác vì tiền ở tất cả các nền kinh tế lớn ngày nay không được luật pháp chuyển đổi thành bất kỳ thứ gì khác,\nnhưng về mặt luật pháp, nó là hợp pháp. Tiền không thể chuyển đổi thành bất kỳ hàng hóa nào khác được gọi là tiền fiat\n.\nB. Không chính xác vì tiền không thể chuyển đổi thành bất kỳ hàng hóa nào khác được gọi là tiền định danh.\nC. Đúng vì tiền pháp định có giá trị thông qua nghị định của chính phủ và vì mọi người chấp nhận nó\nđể thanh toán hàng hóa, dịch vụ cũng như trả nợ.\nKinh tế: mô tả vai trò và mục tiêu của ngân hàng trung ương","qhtml":null},{"n":15,"q":"An objective of fiscal policy is to:","opts":["supervise the banking system.","influence the quantity of credit in an economy.","distribute income among different segments of the population."],"ans":"C","expl":"A. Không chính xác vì chính sách tiền tệ, không phải chính sách tài khóa, đề cập đến các hoạt động của ngân hàng trung ương như\ngiám sát hệ thống ngân hàng.\nB. Không chính xác vì chính sách tiền tệ đề cập đến các hoạt động của ngân hàng trung ương nhằm\ntác động đến số lượng tiền và tín dụng trong nền kinh tế. Ngược lại, chính sách tài khóa đề cập đến\ncác quyết định của chính phủ về thuế và chi tiêu.\nC. Đúng vì chính sách tài khóa liên quan đến việc sử dụng chi tiêu của chính phủ và thay đổi doanh thu thuế\nđể tác động đến một số khía cạnh của nền kinh tế bao gồm sự phân bổ thu nhập và của cải giữa\ncác phân khúc dân số khác nhau.\nKinh tế: mô tả vai trò và mục tiêu của chính sách tài khóa cũng như các lập luận về việc liệu quy mô\ncủa nợ quốc gia có liên quan đến vấn đề GDP hay không","qhtml":null},{"n":16,"q":"A decrease in taxes and an increase in interest rates most likely reflect:","opts":["easy fiscal policy and tight monetary policy.","tight fiscal policy and easy monetary policy.","tight fiscal policy and tight monetary policy."],"ans":"A","expl":"A. Đúng vì giảm thuế phản ánh chính sách tài khóa dễ dàng. Nếu thuế được cắt giảm, chính sách tài chính\nmở rộng sẽ dẫn đến tăng tổng sản lượng. Lãi suất tăng phản ánh chính sách tiền tệ thắt chặt. Nếu\nđiều này đi kèm với việc giảm nguồn cung tiền để bù đắp cho việc mở rộng tài chính thì lãi suất\nsẽ tăng.\nB. Không chính xác vì giảm thuế là chính sách tài khóa mở rộng, không phải chính sách tài khóa thắt chặt.\nC. Không chính xác vì giảm thuế là chính sách tài khóa mở rộng, không phải chính sách tài khóa thắt chặt\nKinh tế: giải thích sự tương tác giữa chính sách tiền tệ và tài khóa","qhtml":null},{"n":17,"q":"With respect to conventional monetary policy, combating inflation is most likely:","opts":["less difficult than combating deflation.","equally difficult as combating deflation.","more difficult than combating deflation."],"ans":"A","expl":"A. Đúng vì giảm phát khó đối phó với chính sách tiền tệ thông thường hơn\nlạm phát. Điều này là do một khi cơ quan tiền tệ đã cắt giảm lãi suất danh nghĩa xuống 0 để\nkích thích nền kinh tế, họ không thể cắt giảm thêm nữa.\nB. Không chính xác vì chính sách tiền tệ thông thường khó giải quyết tình trạng giảm phát hơn\nlạm phát. Điều này là do một khi cơ quan tiền tệ đã cắt giảm lãi suất danh nghĩa xuống 0 để\nkích thích nền kinh tế, họ không thể cắt giảm thêm nữa.\nC. Không chính xác vì chính sách tiền tệ thông thường khó giải quyết tình trạng giảm phát hơn\nlạm phát. Điều này là do một khi cơ quan tiền tệ đã cắt giảm lãi suất danh nghĩa xuống 0 để\nkích thích nền kinh tế, họ không thể cắt giảm thêm nữa.\nKinh tế: mô tả phẩm chất của các ngân hàng trung ương hiệu quả, đối chiếu việc họ sử dụng lạm phát, lãi suất\nvà mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp, đồng thời mô tả\nnhững hạn chế của chính sách tiền tệ","qhtml":null},{"n":18,"q":"With respect to the foreign exchange market, an arbitrage relationship involving\ncountries' relative interest rates\nserves as the basis for:","opts":["real exchange rates.","forward exchange rates.","nominal exchange rates."],"ans":"B","expl":"A. Không chính xác vì tỷ giá hối đoái thực là các chỉ số thường được các nhà kinh tế và các nhà phân tích thị trường\n khác xây dựng để đánh giá những thay đổi về sức mua tương đối của một loại tiền tệ so với\nmột loại tiền tệ khác và do đó không dựa trên mối quan hệ chênh lệch giá.\nB. Đúng vì tỷ giá hối đoái kỳ hạn dựa trên mối quan hệ chênh lệch giá đánh đồng lợi tức đầu tư\ntrên hai khoản đầu tư thay thế nhưng tương đương, bao gồm mối quan hệ\ngiữa lãi suất phi rủi ro của hai quốc gia liên quan. Mối quan hệ chênh lệch giá là F\nf/d\n= F (1+i)/(1+i ), trong đó F là tỷ giá kỳ hạn. S là tỷ giá giao ngay, và i (i ) là lãi suất phi rủi ro (trong nước)\nf/d f d f/d t/d f d\nlãi suất phi rủi ro.\nC. Không chính xác vì tỷ giá hối đoái danh nghĩa là số đơn vị của một loại tiền tệ (được gọi là\nđơn vị tiền tệ giá) mà một đơn vị của một loại tiền tệ khác (được gọi là tiền tệ cơ sở) sẽ mua và được ấn định bởi\ncác lực lượng thị trường, ví dụ: dòng vốn, dòng thương mại, v.v. Mặc dù đúng là báo giá tỷ giá chéo (tỷ giá hối đoái danh nghĩa\n) phải nhất quán, thị trường sẽ phân xử các định giá sai, chênh lệch giá cụ thể\nmối quan hệ liên quan đến tỷ giá hối đoái danh nghĩa không liên quan đến lãi suất tương đối, nó chỉ đơn giản\ndựa trên báo giá thị trường tiền tệ (và sau đó là tỷ giá chéo tiền tệ dẫn xuất).\nKinh tế học: giải thích mối quan hệ chênh lệch giá giữa tỷ giá hối đoái giao ngay và kỳ hạn và lãi suất\n, tính tỷ giá kỳ hạn bằng cách sử dụng điểm hoặc theo tỷ lệ phần trăm và diễn giải chiết khấu kỳ hạn\nhoặc phí bảo hiểm","qhtml":null},{"n":19,"q":"Which of the following would most likely lead to an increase in globalization? A decrease\nin:","opts":["soft power.","nationalism.","standardization."],"ans":"B","expl":"A. Không chính xác vì quyền lực mềm có tác động tích cực đến toàn cầu hóa. Quyền lực mềm là một phương tiện\ntác động đến quyết định của quốc gia khác mà không cần dùng vũ lực hay ép buộc. Quyền lực mềm có thể được xây dựng theo thời gian\nthông qua các hành động như chương trình văn hóa, quảng cáo, tài trợ du lịch và trao đổi đại học.\nVà toàn cầu hóa cũng có những đặc điểm văn hóa và giao tiếp. Mặc dù khó có thể\nđo lường những đặc điểm này, chẳng hạn như sự lan truyền thông tin hoặc văn hóa, nhưng nó đã làm tăng sự tương tác\ngiữa công dân của các quốc gia trên toàn thế giới. Việc sử dụng Internet cho phép lan truyền\nthông tin văn hóa và bối cảnh gần như tức thời.\nB. Đúng vì toàn cầu hóa được đánh dấu bằng sự hợp tác kinh tế và tài chính, bao gồm\nthương mại hàng hóa và dịch vụ tích cực, dòng vốn, trao đổi tiền tệ và trao đổi văn hóa và thông tin\n. Các tác nhân tham gia toàn cầu hóa có khả năng vượt ra ngoài biên giới quốc gia của họ để\ntiếp cận các thị trường, tài năng hoặc học tập mới. Ngược lại, chống toàn cầu hóa hoặc chủ nghĩa dân tộc là\nthúc đẩy lợi ích kinh tế của chính một quốc gia nhằm loại trừ hoặc gây phương hại đến lợi ích của\ncác quốc gia khác.\nC. Không chính xác vì tiêu chuẩn hóa là quá trình tạo các giao thức cho việc sản xuất, bán,\nvận chuyển hoặc sử dụng một sản phẩm hoặc dịch vụ. Quá trình tiêu chuẩn hóa xảy ra khi các bên liên quan đồng ý\ncùng nhau tuân theo các giao thức này. Nó giúp hỗ trợ các hoạt động kinh tế và tài chính mở rộng xuyên biên giới\n. Và khi toàn cầu hóa ngày càng sâu rộng, các công ty phát triển các tiêu chuẩn và quy trình để kết hợp\nnhiều nền văn hóa vào văn hóa doanh nghiệp tổng thể của họ. Họ phải hợp tác với nhiều bộ\nquy tắc và có thể thiết lập các quy trình chuẩn dựa trên các nhóm công ty mà họ điều hành\nin.\nKinh tế: mô tả địa chính trị và mối quan hệ của nó với toàn cầu hóa","qhtml":null},{"n":20,"q":"Which of the following organizations was founded with the goal of assisting in the\nreconstruction of the international payment system?","opts":["The World Trade Organization","The International Monetary Fund","The International Bank for Reconstruction and Development"],"ans":"B","expl":"A. Không chính xác vì WTO cung cấp nền tảng pháp lý và thể chế cho hệ thống\nthương mại đa quốc gia. Đây là tổ chức quốc tế duy nhất quản lý các mối quan hệ thương mại xuyên biên giới giữa\ncác quốc gia trên quy mô toàn cầu\nB. Đúng vì IMF được thành lập với mục tiêu ổn định tỷ giá hối đoái và hỗ trợ\ntái thiết hệ thống thanh toán quốc tế của thế giới.\nC. Không chính xác vì Ngân hàng Thế giới được thành lập để hỗ trợ việc tái thiết và phát triển\nsau chiến tranh. Ngoài ra, hai đơn vị liên kết chặt chẽ của Ngân hàng Thế giới-Ngân hàng Tái thiết và Phát triển Quốc tế (IBRD) và Hiệp hội Phát triển Quốc tế (IDA)-\ncung cấp các khoản vay và viện trợ với lãi suất thấp hoặc không có lãi suất cho các quốc gia không có điều kiện thuận lợi hoặc không có khả năng tiếp cận\nthị trường tín dụng quốc tế.\nKinh tế: mô tả các chức năng và mục tiêu của các tổ chức quốc tế hỗ trợ thương mại,\nbao gồm Ngân hàng Thế giới, Quỹ Tiền tệ Quốc tế và Tổ chức Thương mại Thế giới","qhtml":null},{"n":21,"q":"Under which of the following market structures do firms have the least control over\nprice?","opts":["Oligopoly","Monopoly","Monopolistic competition"],"ans":"C","expl":"A. Không chính xác vì theo quan điểm của chủ sở hữu công ty, cấu trúc thị trường\nđược mong muốn nhất là cấu trúc có khả năng kiểm soát giá cao nhất, bởi vì sự kiểm soát này có thể dẫn đến lợi nhuận lớn.\nThị trường độc quyền và độc quyền nhóm cung cấp khả năng kiểm soát tiềm năng lớn nhất đối với giá cả, cạnh tranh độc quyền\ncạnh tranh mang lại ít quyền kiểm soát hơn. Các công ty hoạt động trong điều kiện thị trường cạnh tranh hoàn hảo không có\nkhông kiểm soát được giá cả.\nB. Không chính xác vì theo quan điểm của chủ sở hữu công ty, cấu trúc thị trường\nđược mong muốn nhất là cấu trúc có khả năng kiểm soát giá cao nhất, bởi vì sự kiểm soát này có thể dẫn đến lợi nhuận lớn.\nThị trường độc quyền và độc quyền nhóm cung cấp khả năng kiểm soát tiềm năng lớn nhất đối với giá cả, cạnh tranh độc quyền\ncạnh tranh mang lại ít quyền kiểm soát hơn. Các công ty hoạt động trong điều kiện thị trường cạnh tranh hoàn hảo không có\nkhông kiểm soát được giá cả.\nC. Đúng vì theo quan điểm của chủ sở hữu công ty, cấu trúc thị trường\nđược mong muốn nhất là cấu trúc có khả năng kiểm soát giá cao nhất, bởi vì sự kiểm soát này có thể dẫn đến lợi nhuận lớn.\nThị trường độc quyền và độc quyền nhóm mang lại khả năng kiểm soát giá tiềm năng lớn nhất; cạnh tranh\nđộc quyền mang lại ít quyền kiểm soát hơn. Các công ty hoạt động trong điều kiện thị trường cạnh tranh hoàn hảo không có\nkhông kiểm soát được giá cả.\nKinh tế: mô tả các đặc điểm của cạnh tranh hoàn hảo, cạnh tranh độc quyền, độc quyền nhóm và\nđộc quyền thuần túy","qhtml":null},{"n":22,"q":"Assuming wages and prices are rigid, which of the following policy combinations most\nlikely leads to the private sector increasing its share of GDP?","opts":["Easy fiscal policy and tight monetary policy","Tight monetary policy and tight fiscal policy","Tight fiscal policy and easy monetary policy"],"ans":"C","expl":"A. Không chính xác vì nếu cắt giảm thuế hoặc tăng chi tiêu chính phủ, chính sách tài khóa mở rộng sẽ\ndẫn đến sự gia tăng tổng sản lượng. Nếu điều này đi kèm với việc giảm nguồn cung tiền để bù đắp cho việc mở rộng tài chính\n thì lãi suất sẽ tăng và có tác động tiêu cực đến nhu cầu của khu vực tư nhân. Chúng ta\ncó sản lượng cao hơn và lãi suất cao hơn, đồng thời chi tiêu của chính phủ sẽ chiếm tỷ trọng lớn hơn trong\ntổng thu nhập quốc dân.\nB. Không chính xác vì trong trường hợp chính sách tiền tệ thắt chặt và chính sách tài khóa thắt chặt, lãi suất sẽ tăng (ít nhất\nnếu tác động của tiền tệ lên lãi suất lớn hơn) và làm giảm nhu cầu tư nhân. Đồng thời\n, thuế cao hơn và chi tiêu chính phủ giảm dẫn đến tổng cầu giảm từ cả\nkhu vực công và tư nhân.\nC. Đúng vì nếu sự thu hẹp tài chính đi kèm với chính sách tiền tệ mở rộng và lãi suất\nthấp. khi đó khu vực tư nhân sẽ được kích thích và sẽ tăng tỷ trọng trong GDP, trong khi\nkhu vực công sẽ thu hẹp lại.\nKinh tế: giải thích sự tương tác giữa chính sách tiền tệ và tài chính","qhtml":null},{"n":23,"q":"Which of the following changes most likely reflects a discretionary fiscal policy action?","opts":["A decrease in corporate tax revenues due to lower corporate profitability","An increase in government expenditures due to new infrastructure projects","An increase in payments of unemployment benefits due to increasing unemployment"],"ans":"B","expl":"A. Không chính xác vì thâm hụt có thể thay đổi vì những lý do không liên quan đến những thay đổi chính sách tài khóa thực tế.\nBộ ổn định tự động sẽ dẫn đến những thay đổi về thâm hụt ngân sách không liên quan đến những thay đổi chính sách tài khóa; a\nsuy thoái kinh tế sẽ khiến nguồn thu từ thuế giảm và thâm hụt ngân sách tăng lên.\nB. Đúng vì ngoài những điều chỉnh tự động này, các chính phủ còn sử dụng\nđiều chỉnh tài chính tùy ý để tác động đến tổng cầu. Những điều này sẽ liên quan đến những thay đổi về thuế và/hoặc cắt giảm hoặc tăng chi tiêu\nthường nhằm mục đích ổn định nền kinh tế. Việc tăng chi tiêu của chính phủ\ndo các dự án cơ sở hạ tầng mới là một hành động chính sách tài khóa tùy ý vì\nchi tiêu công mới cho hàng hóa xã hội và cơ sở hạ tầng, chẳng hạn như bệnh viện và trường học, thúc đẩy thu nhập cá nhân\nvới mục tiêu tăng tổng cầu.\nC. Không chính xác vì các biện pháp ổn định tự động-chẳng hạn như thuế thu nhập, VAT và phúc lợi xã hội là quan trọng\nbởi vì khi sản lượng và việc làm giảm và giảm doanh thu thuế, thì doanh thu thuế ròng cũng giảm khi\nlợi ích thất nghiệp tăng lên. Điều này hoạt động như một biện pháp kích thích tài chính và giúp giảm quy mô của hệ số nhân\n, làm giảm phản ứng đầu ra của bất cứ điều gì gây ra sự sụt giảm sản lượng ngay từ đầu. Bởi\nbản chất của chúng, các bộ ổn định tự động không yêu cầu thay đổi chính sách; không nhà hoạch định chính sách nào phải quyết định\nrằng một cú sốc kinh tế đã xảy ra và cách ứng phó.\nKinh tế: giải thích việc thực hiện chính sách tài khóa và những khó khăn khi thực hiện cũng như\nliệu chính sách tài khóa là mở rộng hay thu hẹp.","qhtml":null},{"n":24,"q":"Each oligopoly firm faces an individual demand curve under:","opts":["colluding market conditions only.","non-colluding market conditions only.","both colluding and non-colluding market conditions."],"ans":"B","expl":"A. Không chính xác vì trong một thị trường độc quyền nơi có sự thông đồng, đường cầu tổng hợp\nthị trường được chia cho từng người tham gia sản xuất. Trong điều kiện thị trường không thông đồng\n, mỗi công ty phải đối mặt với một đường cầu riêng.\nB. Đúng vì trong một thị trường độc quyền nơi có sự thông đồng, đường cong tổng cầu thị trường\nđược chia cho từng người tham gia sản xuất. Trong điều kiện thị trường không thông đồng,\nmỗi công ty phải đối mặt với một đường cầu riêng\nC. Không chính xác vì trong một thị trường độc quyền có sự thông đồng, đường cong tổng cầu thị trường\nđược chia cho từng người tham gia sản xuất. Trong điều kiện thị trường không thông đồng,\nmỗi công ty phải đối mặt với một đường cầu riêng\nKinh tế: giải thích mối quan hệ cung và cầu dưới sự độc quyền nhóm, bao gồm mức giá tối ưu và\nsản lượng cho các công ty cũng như chiến lược định giá","qhtml":null},{"n":25,"q":"A decline in tax revenues due to a recession is best described as an example of a(n):","opts":["automatic stabilizer.","expansionary fiscal policy.","contractionary fiscal policy."],"ans":"A","expl":"A. Đúng vì doanh thu thuế giảm do suy thoái kinh tế là một ví dụ về chính sách ổn định tự động, không phải là\nchính sách tài khóa tùy ý. Bộ ổn định tự động sẽ dẫn đến những thay đổi về thâm hụt ngân sách không liên quan đến\nnhững thay đổi về chính sách tài khóa, suy thoái kinh tế sẽ khiến nguồn thu từ thuế giảm và thâm hụt ngân sách tăng lên.\nB. Không chính xác vì doanh thu thuế giảm do suy thoái kinh tế là một ví dụ về bộ ổn định tự động.\nBộ ổn định tự động sẽ dẫn đến những thay đổi trong thâm hụt ngân sách không liên quan đến những thay đổi trong chính sách tài khóa; a\nsuy thoái kinh tế sẽ khiến nguồn thu từ thuế giảm và thâm hụt ngân sách tăng lên. Chính sách tài khóa mở rộng là\ntùy ý nhằm giúp quản lý nền kinh tế thông qua ảnh hưởng của nó đối với tổng sản lượng quốc gia\n, tức là GDP thực tế. Trong thời kỳ suy thoái, các chính phủ có thể tăng chi tiêu (chính sách tài khóa mở rộng)\nnhằm nỗ lực tăng việc làm và sản lượng.\nC. Không chính xác vì doanh thu thuế giảm do suy thoái kinh tế là một ví dụ về bộ ổn định tự động.\nBộ ổn định tự động sẽ dẫn đến những thay đổi trong thâm hụt ngân sách không liên quan đến những thay đổi trong chính sách tài khóa; a\nsuy thoái kinh tế sẽ khiến nguồn thu từ thuế giảm và thâm hụt ngân sách tăng lên. Chính sách tài khóa thắt chặt là\ntùy ý nhằm giúp quản lý nền kinh tế thông qua ảnh hưởng của nó đối với tổng sản lượng quốc gia\n, tức là GDP thực tế. Khi một nền kinh tế có đầy đủ việc làm và tiền lương cũng như giá cả tăng quá nhanh\nthì chi tiêu của chính phủ có thể giảm và tăng thuế (chính sách tài khóa thu hẹp).\nKinh tế: giải thích việc thực hiện chính sách tài khóa và những khó khăn trong việc thực hiện cũng như\nliệu chính sách tài khóa là mở rộng hay thu hẹp","qhtml":null},{"n":26,"q":"According to the Cournot assumption, in an oligopoly market each firm determines its\nprofit-maximizing production level by assuming that other firms will:","opts":["decrease output.","not change output.","increase output."],"ans":"B","expl":"A. Không chính xác vì trong giả định của Cournot, mỗi công ty xác định mức sản xuất\ntối đa hóa lợi nhuận của mình bằng cách giả định rằng sản lượng của các công ty khác sẽ không thay đổi. Giả định này đơn giản hóa chiến lược định giá\nvì không cần phải đoán xem công ty kia sẽ làm gì để trả đũa.\nB. Đúng vì trong giả định của Cournot, mỗi hãng xác định mức sản xuất\ntối đa hóa lợi nhuận của mình bằng cách giả định rằng sản lượng của các hãng khác sẽ không thay đổi. Giả định này đơn giản hóa chiến lược định giá\nvì không cần phải đoán xem công ty kia sẽ làm gì để trả đũa.\nC. Không chính xác vì trong giả định của Cournot, mỗi công ty xác định mức sản xuất\ntối đa hóa lợi nhuận của mình bằng cách giả định rằng sản lượng của các công ty khác sẽ không thay đổi. Giả định này đơn giản hóa chiến lược định giá\nvì không cần phải đoán xem công ty kia sẽ làm gì để trả đũa.\nKinh tế: giải thích mối quan hệ cung cầu dưới sự độc quyền nhóm, bao gồm mức giá tối ưu và\nđầu ra cho các công ty cũng như chiến lược định giá","qhtml":null},{"n":27,"q":"The main objective of most central banks is to maintain:","opts":["price stability.","gold reserves.","an employment target."],"ans":"A","expl":"A. Đúng vì đối với ngân hàng trung ương, có một mục tiêu bao trùm mà hầu hết\nthừa nhận một cách rõ ràng và đó là mục tiêu duy trì sự ổn định giá cả.\nB. Không chính xác vì trong khi hầu hết các ngân hàng trung ương cũng sẽ chịu trách nhiệm quản lý dự trữ ngoại hối\nvà cả dự trữ vàng của đất nước họ. Có một mục tiêu bao quát mà hầu hết\ndường như thừa nhận một cách rõ ràng, đó là mục tiêu duy trì sự ổn định về giá.\nC. Không chính xác vì trong khi một số ngân hàng trung ương được giao nhiệm vụ làm tất cả những gì có thể để duy trì đầy đủ\nviệc làm và sản lượng thì có một mục tiêu bao trùm mà dường như hầu hết mọi người đều thừa nhận\nmột cách rõ ràng, đó là mục tiêu duy trì sự ổn định về giá.\nKinh tế: mô tả vai trò và mục tiêu của các ngân hàng trung ương","qhtml":null},{"n":28,"q":"An analyst gathers the following information about a company:\n● Average variable cost per unit $12.50\n● Selling price per unit $37.50\n● Total fixed costs $900,000\nThe minimum production level needed to continue operations over the long run is most\nlikely:","opts":["24,000 units.","36,000 units.","72,000 units."],"ans":"B","expl":"A. Không chính xác vì trong long ni, nếu một công ty không thể kiếm được lợi nhuận kinh tế ít nhất bằng 0, thì nó sẽ không\nhoạt động vì nó không trang trải được chi phí cơ hội của tất cả các yếu tố sản xuất, lao động và\nvốn trong dài hạn, nếu tổng doanh thu bằng hoặc vượt quá tổng chi phí thì công ty nên ở lại thị trường\nVới giá bán $37-80 mỗi đơn vị sẽ trang trải $12-50 chi phí biến đổi, và đóng góp $25 vào\nchi phí cố định $900.000 chi phí cố định chia cho 525 này bằng 36.000 đơn vị Tại 36.000 đơn vị, tất cả chi phí biến đổi\nvà chi phí cố định đều được bao gồm trong tổng doanh thu nếu toàn bộ giá bán $37,50 được chia cho\ntổng $900.000 cố định. chi phí, kết quả là 24.000 đơn vị thấp hơn mức sản xuất tối thiểu\ncần thiết để đảm bảo hoạt động trong thời gian dài.\nB. Đúng vì về lâu dài, nếu một công ty không thể kiếm được ít nhất lợi nhuận kinh tế bằng 0, thì nó sẽ không\nhoạt động vì nó không trang trải được chi phí cơ hội của tất cả các yếu tố lớn của vốn sản xuất và\nvốn trong thời gian dài. Tổng doanh thu của tôi bằng hoặc vượt quá tổng chi phí mà công ty nên duy trì trên thị trường\nVới giá bán là 37,50 USD, mỗi đơn vị sẽ bao gồm 12 60 USD chi phí biến đổi và đóng góp 25 USD\n(biên lợi nhuận đóng góp) vào chi phí cố định 5900.000 USD chi phí cố định chia cho 25 USD này bằng 36.000\nđơn vị. Ở mức 36.000 đơn vị, tất cả chi phí biến đổi và cố định đều được bù đắp bằng tổng doanh thu\nC. Không chính xác vì về lâu dài, nếu một công ty không thể kiếm được ít nhất lợi nhuận kinh tế bằng 0, thì công ty đó sẽ không\nhoạt động vì nó không trang trải được chi phí cơ hội của tất cả các yếu tố sản xuất, lao động và\nvốn. Về lâu dài, nếu tổng doanh thu bằng hoặc vượt quá tổng chi phí thì công ty nên tiếp tục tham gia thị trường\n. Với giá bán là 37,50 USD, mỗi đơn vị sẽ bao gồm 12,50 USD chi phí biến đổi và đóng góp 25 USD\n(biên lợi nhuận đóng góp) vào chi phí cố định 900.000 USD chi phí cố định chia cho 25 USD này bằng 36.000\nđơn vị. Ở mức 36.000 đơn vị, tất cả các chi phí biến đổi và cố định đều được bù đắp bằng tổng doanh thu. Đây là mức sản xuất\ntối thiểu cần thiết để công ty tiếp tục sản xuất. Nếu chi phí biến đổi trung bình của\n$12,50 được chia thành 900.000 USD thì kết quả là 72.000 đơn vị\nKinh tế học: xác định và giải thích các điểm hòa vốn và điểm dừng sản xuất, cũng như\nnền kinh tế và tính phi kinh tế theo quy mô ảnh hưởng đến chi phí trong điều kiện cạnh tranh hoàn hảo và không hoàn hảo","qhtml":null},{"n":29,"q":"The implementation of an export subsidy for a normal good produced in a small country\nwill most likely increase the:","opts":["domestic consumption of the good.","price of the good in the domestic market.","national welfare of the country providing the subsidy."],"ans":"B","expl":"A. Không chính xác vì trong trường hợp trợ cấp xuất khẩu, nhà xuất khẩu có động cơ chuyển doanh số\ntừ thị trường nội địa sang thị trường xuất khẩu. Kịch bản này làm tăng giá ở thị trường trong nước bằng\nlượng trợ cấp trong trường hợp nước nhỏ (giá trước trợ cấp cộng với trợ cấp). Vì giá\ntrong nước ở quốc gia nhỏ cao hơn nên mức tiêu thụ hàng hóa sẽ giảm (chứ không phải tăng).\nB. Đúng vì trong trường hợp trợ cấp xuất khẩu, nhà xuất khẩu có động cơ chuyển doanh số bán hàng từ\ntrong nước sang thị trường xuất khẩu vì nhận được giá quốc tế cộng với trợ cấp trên mỗi đơn vị\ncho mỗi đơn vị hàng hóa xuất khẩu. Kịch bản này làm tăng giá ở thị trường trong nước\nsố tiền trợ cấp trong trường hợp nước nhỏ (giá trước trợ cấp cộng với trợ cấp).\nC. Không chính xác vì trợ cấp xuất khẩu là khoản thanh toán của chính phủ cho một công ty cho mỗi đơn vị\nhàng hóa được xuất khẩu. Mục tiêu của nó là kích thích xuất khẩu. Nhưng nó cản trở hoạt động của thị trường tự do\nvà có thể làm biến dạng thương mại khỏi lợi thế so sánh. Do đó, nó làm giảm phúc lợi....\nHiệu ứng phúc lợi ròng là âm trong cả trường hợp nước lớn và nước nhỏ. Do đó, trợ cấp xuất khẩu\ngiảm thay vì tăng phúc lợi quốc gia.\nKinh tế: so sánh các loại hạn chế thương mại, chẳng hạn như thuế quan, hạn ngạch và trợ cấp xuất khẩu, và\ný nghĩa kinh tế của chúng","qhtml":null},{"n":30,"q":"Under monopolistic competition, a firm's supply curve is represented by:","opts":["average cost.","marginal cost.","neither average cost nor marginal cost."],"ans":"C","expl":"A. Không chính xác vì trong cạnh tranh hoàn hảo, đường cung của hãng được thể hiện bằng\nđường chi phí biên. Trong cạnh tranh độc quyền, không có hàm cung được xác định rõ ràng. Thông tin\nđược sử dụng để xác định mức đầu ra thích hợp dựa trên sự giao nhau giữa MC\nvà MR. Tuy nhiên, mức giá sẽ được tính dựa trên lịch trình nhu cầu thị trường. Đường cung\ncủa hãng sẽ đo lường số lượng mà hãng sẵn sàng cung cấp ở các mức giá khác nhau. Thông tin\nđó không được biểu thị bằng chi phí cận biên hoặc chi phí trung bình\nB. Không chính xác vì trong cạnh tranh hoàn hảo, đường cung của hãng được thể hiện bằng\nđường chi phí biên. Trong cạnh tranh độc quyền, không có hàm cung được xác định rõ ràng. Thông tin\nđược sử dụng để xác định mức đầu ra thích hợp dựa trên sự giao nhau giữa MC\nvà MR. Tuy nhiên, mức giá sẽ được tính dựa trên lịch trình nhu cầu thị trường. Đường cung\ncủa hãng sẽ đo lường số lượng mà hãng sẵn sàng cung cấp ở các mức giá khác nhau. Thông tin\nđó không được biểu thị bằng chi phí cận biên hoặc chi phí trung bình.\nC. Đúng vì trong cạnh tranh hoàn hảo, đường cung của hãng được biểu thị bằng đường chi phí cận biên\n. Trong cạnh tranh độc quyền, không có hàm cung được xác định rõ ràng. Thông tin\nđược sử dụng để xác định mức sản lượng phù hợp dựa trên giao điểm của MC và MR.\nTuy nhiên, mức giá sẽ được tính dựa trên biểu đồ nhu cầu thị trường. Đường cung\ncủa hãng sẽ đo lường số lượng mà hãng sẵn sàng cung cấp ở các mức giá khác nhau. Thông tin đó\nkhông được biểu thị bằng chi phí cận biên hay chi phí trung bình.\nKinh tế: giải thích mối quan hệ cung và cầu trong cạnh tranh độc quyền, bao gồm\ngiá và sản lượng tối ưu cho các công ty cũng như chiến lược định giá","qhtml":null},{"n":31,"q":"During the slowdown phase of the business cycle:","opts":["inflation decelerates.","business halts new orders.","business slows its rate of hiring."],"ans":"C","expl":"A. Không chính xác vì trong giai đoạn giảm tốc, lạm phát tăng tốc hơn nữa [không giảm tốc]\nB. Không chính xác vì trong giai đoạn suy thoái, các công ty tiếp tục đặt hàng mới khi họ hoạt động\nở mức hoặc gần hết công suất.\nC. Đúng vì trong giai đoạn suy thoái, doanh nghiệp tiếp tục tuyển dụng nhưng với tốc độ chậm hơn.\ntỷ lệ thất nghiệp tiếp tục giảm nhưng với tốc độ giảm dần.\nKinh tế: mô tả chu kỳ kinh doanh và các giai đoạn của nó","qhtml":null},{"n":32,"q":"The interest rate spread between 10-year treasury yields and overnight borrowing rates\nmost likely:","opts":["is a lagging economic indicator.","decreases when the market expects an economic downturn.","increases as the market expects future short-term interest rates to decrease."],"ans":"B","expl":"A. Không chính xác vì các chỉ số kinh tế hàng đầu có những bước ngoặt thường xảy ra trước những bước ngoặt của\ncủa nền kinh tế tổng thể. Các chỉ số kinh tế tụt hậu có những bước ngoặt diễn ra muộn hơn so với\ncủa nền kinh tế tổng thể. Chênh lệch lãi suất giữa lãi suất trái phiếu kho bạc kỳ hạn 10 năm và lãi suất vay qua đêm\nlà một chỉ báo kinh tế hàng đầu.\nB. Đúng vì lợi suất dài hạn thể hiện kỳ ​​vọng của thị trường về hướng của lãi suất ngắn hạn\nvà lãi suất cuối cùng theo chu kỳ kinh tế lên xuống, chênh lệch rộng hơn, bằng cách\ndự đoán lãi suất ngắn hạn tăng, cũng dự đoán xu hướng tăng trưởng kinh tế Ngược lại, chênh lệch\nhẹp hơn do dự đoán lãi suất ngắn hạn giảm, cũng dự đoán suy thoái kinh tế.\nC. Không chính xác vì lợi suất dài hạn thể hiện kỳ ​​vọng của thị trường về hướng của lãi suất ngắn hạn\nvà lãi suất cuối cùng cũng theo chu kỳ kinh tế lên xuống, chênh lệch rộng hơn, bằng cách\ndự đoán lãi suất ngắn hạn tăng, cũng dự đoán xu hướng tăng trưởng kinh tế. dự đoán một\nsuy thoái kinh tế.\nKinh tế: mô tả mức độ sử dụng tài nguyên, hoạt động kinh doanh và tiêu dùng, hoạt động trong lĩnh vực nhà ở và\nhoạt động của lĩnh vực ngoại thương thay đổi theo chu kỳ kinh doanh và mô tả cách đo lường chúng bằng cách sử dụng\ncác chỉ số kinh tế","qhtml":null},{"n":33,"q":"Which of the following monetary policy actions is most likely considered expansionary?\nThe central bank:","opts":["acts as the lender in a repurchase agreement.","sells government bonds to commercial banks.","raises reserve requirements of commercial banks."],"ans":"A","expl":"A. Đúng vì nếu ngân hàng trung ương muốn tăng nguồn cung tiền, họ có thể mua trái phiếu\n(thường là trái phiếu chính phủ) từ các ngân hàng, với thỏa thuận bán lại chúng vào một thời điểm nào đó trong\ntrong tương lai. Giao dịch này được gọi là thỏa thuận mua lại. Người cho vay trong thỏa thuận mua lại\nlà bên ban đầu mua trái phiếu và đồng ý bán lại chúng vào thời điểm sau\n. Bằng cách mua trái phiếu từ các ngân hàng, ngân hàng trung ương đang tăng nguồn cung tiền hoặc tăng\ntính thanh khoản, mang tính mở rộng.\nB. Không chính xác vì ngân hàng trung ương có thể bán trái phiếu chính phủ cho ngân hàng thương mại. Bằng cách này,\ndự trữ của các ngân hàng thương mại giảm, làm giảm khả năng cho vay (tức là tạo tín dụng) đối với\ncác hộ gia đình và tập đoàn và do đó khiến tăng trưởng tiền tệ trên diện rộng giảm thông qua cơ chế số nhân tiền\n. Sự giảm thanh khoản này mang tính thu hẹp chứ không phải mở rộng.\nC. Không chính xác vì ngân hàng trung ương có thể hạn chế việc tạo tiền bằng cách tăng yêu cầu dự trữ\ncủa các ngân hàng. Điều này khiến các ngân hàng phải giữ nhiều tiền dự trữ hơn, làm giảm cung tiền.\nHành động chính sách tiền tệ này mang tính thu hẹp, không mở rộng.\nKinh tế: mô tả phẩm chất của các ngân hàng trung ương hiệu quả; đối chiếu việc họ sử dụng lạm phát, lãi suất,\nvà nhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nhạn chế của chính sách tiền tệ","qhtml":null},{"n":34,"q":"Dollarization is best described as an exchange rate regime whereby a country:","opts":["uses the currency of another nation as its medium of exchange.","participates in a monetary union whose members share the same legal tender.","makes a commitment to exchange domestic currency for a specified foreign currency at a fixed exchange rate."],"ans":"A","expl":"A. Đúng vì trong trường hợp đô la hóa, quốc gia này sử dụng tiền tệ của quốc gia khác làm\nphương tiện trao đổi và đơn vị tài khoản.\nB. Không chính xác vì IMF xác định hai loại thỏa thuận trong đó một quốc gia không có\nđấu thầu hợp pháp của riêng mình. Đầu tiên, được gọi là đô la hóa, quốc gia này sử dụng tiền tệ của một quốc gia\nkhác làm phương tiện trao đổi và đơn vị tài khoản. Trong trường hợp thứ hai, quốc gia tham gia vào một\nliên minh tiền tệ mà các thành viên có chung đấu thầu hợp pháp. Do đó, đô la hóa không phải là cách tốt nhất\nđược mô tả như một chế độ tỷ giá hối đoái, theo đó quận tham gia vào một liên minh tiền tệ mà\ncác thành viên có chung đấu thầu hợp pháp\nC. Không chính xác vì trong trường hợp đô la hóa, quốc gia này sử dụng tiền tệ của quốc gia khác làm\nphương tiện trao đổi và đơn vị tài khoản. Ngược lại, bảng tiền tệ là một chế độ tiền tệ dựa trên\ndựa trên cam kết lập pháp rõ ràng để đổi nội tệ lấy một loại ngoại tệ cụ thể\nở một tỷ giá hối đoái cố định, kết hợp với các hạn chế đối với cơ quan phát hành để đảm bảo thực hiện\nnghĩa vụ pháp lý của mình.\nKinh tế: mô tả các chế độ tỷ giá hối đoái và giải thích tác động của tỷ giá hối đoái đối với\nthương mại và vốn quốc tế của các quốc gia dòng chảy","qhtml":null},{"n":35,"q":"Which of the following fiscal policy actions is most likely contractionary?","opts":["Increasing taxes and decreasing spending","Decreasing taxes and increasing spending","Decreasing taxes and decreasing spending"],"ans":"A","expl":"A. Đúng vì việc tăng thuế và giảm chi tiêu là biểu hiện của chính sách tài chính\nco rút. Khi một nền kinh tế có đầy đủ việc làm và tiền lương cũng như giá cả tăng quá nhanh thì\nchi tiêu của chính phủ có thể giảm và tăng thuế (chính sách tài khóa thu hẹp).\nB. Không chính xác vì việc giảm thuế và tăng chi tiêu là biểu hiện của thâm hụt ngân sách,\ncó tính chất mở rộng. Chính sách mở rộng có thể thực hiện một hoặc nhiều hình thức sau đây, cắt giảm\nthuế bán hàng (gián tiếp) để giảm giá làm tăng thu nhập thực tế với mục tiêu tăng\nnhu cầu của người tiêu dùng, cắt giảm thuế doanh nghiệp (công ty) để tăng lợi nhuận kinh doanh, có thể tăng chi tiêu vốn\nvà cắt giảm thuế suất đối với tiết kiệm cá nhân để tăng thu nhập khả dụng cho những người có tiền tiết kiệm,\nvới mục tiêu tăng nhu cầu của người tiêu dùng Chính sách tài khóa mở rộng cũng bao gồm chi tiêu công\nmới cho hàng hóa xã hội và cơ sở hạ tầng, chẳng hạn như bệnh viện và trường học, thúc đẩy thu nhập cá nhân\nvới mục tiêu nâng cao tổng cầu. Sự gia tăng thặng dư ngân sách sẽ\nliên quan đến chính sách tài khóa thắt chặt, trong khi sự gia tăng thâm hụt là một chính sách tài khóa mở rộng\nC. Không chính xác vì việc giảm thuế mang tính mở rộng, trong khi việc giảm chi tiêu lại mang tính thu hẹp\n. Nếu không biết mức độ tương đối, chúng tôi không thể nói liệu chính sách này\nmở rộng hay thu hẹp. Chính sách mở rộng có thể thực hiện một hoặc nhiều hình thức\ncắt giảm thuế bán hàng (gián tiếp) sau đây để giảm giá, từ đó làm tăng thu nhập thực tế với mục tiêu\ntăng nhu cầu tiêu dùng, cắt giảm thuế doanh nghiệp (công ty) để tăng lợi nhuận kinh doanh, có thể\ntăng chi tiêu vốn và cắt giảm thuế suất đối với tiết kiệm cá nhân để tăng thu nhập khả dụng cho những người\ncó tiết kiệm, với mục tiêu tăng nhu cầu tiêu dùng. Tuy nhiên, việc tăng (chứ không phải giảm) chi tiêu\ncó tính chất mở rộng. Chính sách tài khóa mở rộng cũng bao gồm chi tiêu công mới cho hàng hóa và cơ sở hạ tầng xã hội\n, chẳng hạn như bệnh viện và trường học, thúc đẩy thu nhập cá nhân với\nmục tiêu là tăng tổng cầu. Sự gia tăng thặng dư ngân sách sẽ gắn liền với chính sách tài khóa thu hẹp\n. trong khi thâm hụt tăng lên là một chính sách tài khóa mở rộng.\nKinh tế: giải thích việc thực hiện chính sách tài khóa và những khó khăn trong việc thực hiện cũng như\nliệu chính sách tài khóa là mở rộng hay thu hẹp","qhtml":null},{"n":36,"q":"A fiscal policy tool that can immediately influence spending is most likely:","opts":["indirect taxes.","exchange rate targeting.","capital expenditure plans."],"ans":"A","expl":"A. Đúng vì thuế gián tiếp có thể được điều chỉnh gần như ngay lập tức sau khi chúng được công bố và\ncó thể ảnh hưởng đến hành vi chi tiêu ngay lập tức và tạo ra doanh thu cho chính phủ với chi phí ít hoặc không có\ncho chính phủ.\nB. Không chính xác vì nhắm mục tiêu tỷ giá hối đoái là công cụ chính sách tiền tệ, không phải công cụ chính sách tài chính. Nhiều\nnền kinh tế đang phát triển chọn thực hiện chính sách tiền tệ bằng cách nhắm mục tiêu tỷ giá hối đoái\nđồng tiền của họ.\nC. Không chính xác vì kế hoạch chi tiêu vốn mất nhiều thời gian hơn để xây dựng và thực hiện, thường là trong khoảng thời gian\nnăm. Tác động của thay đổi tài chính càng chậm thì các thay đổi ngoại sinh khác\nsẽ càng có nhiều khả năng ảnh hưởng đến nền kinh tế trước khi thay đổi tài chính bắt đầu.\nKinh tế: mô tả các công cụ của chính sách tài khóa, bao gồm cả ưu điểm và nhược điểm của chúng","qhtml":null},{"n":37,"q":"Which of the following is most likely a lagging economic indicator?","opts":["Inventory-sales ratio","S&P 500 Stock Index","Manufacturers' new orders for consumer goods and materials"],"ans":"A","expl":"A. Đúng vì hàng tồn kho tích lũy khi doanh số bán hàng ban đầu giảm xuống, sau khi doanh nghiệp điều chỉnh việc đặt hàng\ncủa mình. trở nên cạn kiệt khi doanh số bán hàng tăng lên, do đó tỷ lệ này có xu hướng tụt lại phía sau chu kỳ.\nB. Không chính xác vì đây là chỉ báo kinh tế hàng đầu. Giá cổ phiếu dự đoán những bước ngoặt kinh tế\n, cả lên và xuống, vì vậy chuyển động của chúng đưa ra tín hiệu sớm hữu ích về chu kỳ kinh tế.\nC. Không chính xác vì đây là chỉ báo kinh tế hàng đầu. Các doanh nghiệp không thể chờ đợi quá lâu để đáp ứng\nnhu cầu về nguyên vật liệu cho hàng tiêu dùng hoặc nguyên vật liệu mà không đặt hàng, vì vậy những thước đo này có xu hướng dẫn\nnhững thăng trầm và suy thoái. Một cách gián tiếp, những thay đổi trong tâm lý kinh doanh cũng thường dẫn đến\nchu kỳ.\nKinh tế: mô tả mức độ sử dụng tài nguyên, hoạt động kinh doanh và tiêu dùng, hoạt động trong lĩnh vực nhà ở và\nhoạt động của lĩnh vực thương mại bên ngoài thay đổi theo chu kỳ kinh doanh và mô tả cách đo lường chúng bằng cách sử dụng\ncác chỉ số kinh tế","qhtml":null},{"n":38,"q":"As an economy moves from the gold standard to a system of fiat currency, the role of the\ncentral bank most likely:","opts":["becomes less crucial.","remains unchanged.","becomes more crucial."],"ans":"C","expl":"A. Không chính xác vì một khi nền kinh tế đã chuyển sang hệ thống tiền định danh, vai trò của nhà cung cấp\nsố tiền đó [ngân hàng trung ương] càng trở nên quan trọng hơn vì chẳng hạn, họ có thể\nmở rộng nguồn cung số tiền này vô thời hạn nếu họ muốn làm như vậy. Do đó, các ngân hàng trung ương đóng\nmột vai trò quan trọng trong các nền kinh tế hiện đại với tư cách là nhà cung cấp và người bảo vệ giá trị của các loại tiền tệ truyền thống của họ\nvà là các tổ chức có vai trò duy trì niềm tin vào tiền tệ của họ\nB. Không chính xác vì một khi nền kinh tế đã chuyển sang hệ thống tiền định danh, vai trò của nhà cung cấp\nsố tiền đó [ngân hàng trung ương] càng trở nên quan trọng hơn bởi vì họ có thể, chẳng hạn,\nmở rộng nguồn cung cấp số tiền này vô thời hạn nếu họ muốn làm như vậy. Do đó, các ngân hàng trung ương đóng\nmột vai trò quan trọng trong các nền kinh tế hiện đại với tư cách là nhà cung cấp và người bảo vệ giá trị đồng tiền cố định của họ\nvà là tổ chức chịu trách nhiệm duy trì niềm tin vào tiền tệ của họ\nC. Đúng vì một khi nền kinh tế đã chuyển sang hệ thống tiền tệ, vai trò của nhà cung cấp\nsố tiền đó [ngân hàng trung ương] càng trở nên quan trọng hơn bởi vì họ có thể, chẳng hạn, mở rộng\nviệc cung cấp số tiền này vô thời hạn nếu họ muốn làm như vậy. Do đó, ngân hàng trung ương đóng một vai trò\nquan trọng trong các nền kinh tế hiện đại với tư cách là nhà cung cấp và người bảo vệ giá trị của các loại tiền tệ truyền thống của họ và là\ncác tổ chức chịu trách nhiệm duy trì niềm tin vào tiền tệ của họ.\nKinh tế: mô tả vai trò và mục tiêu của các ngân hàng trung ương","qhtml":null},{"n":39,"q":"Which of the following is most likely a coincident indicator of economic activity?","opts":["Average duration of unemployment","Average weekly hours, manufacturing","Employees on non-agricultural payrolls"],"ans":"C","expl":"A. Không chính xác vì các doanh nghiệp đợi cho đến khi suy thoái có vẻ nghiêm trọng rồi mới sa thải và đợi cho đến khi\nphục hồi có vẻ an toàn để tuyển dụng lại, biện pháp này rất quan trọng vì nó làm chậm chu kỳ cả về\nđi xuống và đi lên. Do đó, thời gian thất nghiệp trung bình là một chỉ số kinh tế có độ trễ\nB. Không chính xác vì các doanh nghiệp sẽ cắt giảm thời gian làm thêm trước khi sa thải công nhân trong thời kỳ suy thoái và\ntăng thời gian làm thêm trước khi tuyển dụng lại hàng tuần theo chu kỳ tăng trưởng, các biện pháp này tăng giảm trước\nnền kinh tế chung. Do đó, số giờ trung bình, sản xuất là chỉ số kinh tế hàng đầu.\nC. Đúng vì một khi suy thoái hoặc phục hồi rõ ràng, các doanh nghiệp sẽ điều chỉnh bảng lương toàn thời gian của mình. Bảng lương phi nông nghiệp và sản xuất và bán hàng thương mại là các chỉ số trùng khớp.\nKinh tế: mô tả mức độ sử dụng tài nguyên, hoạt động kinh doanh và tiêu dùng, hoạt động của ngành nhà ở và\nhoạt động của khu vực ngoại thương thay đổi theo chu kỳ kinh doanh và mô tả cách đo lường chúng bằng cách sử dụng\ncác chỉ số kinh tế","qhtml":null},{"n":40,"q":"An analyst gathers the following foreign exchange rate information:\nCAD/USD JPY/USD\n● Beginning of period 1.3216 105.42\n● End of period 1.2944 104.74\nCAD/USD is the amount of CAD per 1 USD.\nJPY/USD is the amount of JPY per 1 USD.\nThe percentage change in the JPY/CAD cross-rate for the period is closest to:","opts":["-2.7%.","1.4%.","2.8%."],"ans":"B","expl":"A. Không chính xác vì tỷ giá hối đoái CAD/USD không được đảo ngược, như được yêu cầu trong phép tính\nchính xác:\nTỷ giá JPY/CAD đầu kỳ = 1,3216 x 105,42 = 139,32\nTỷ giá hối đoái cuối kỳ JPY/CAD = 1,2944 x 104,74 = 135,58\nDo đó, phần trăm thay đổi trong JPY/CAD đã được tính toán không chính xác thành 135,58/139,32-1=-2,68%≈\n2,7%.\nB. Đúng vì đôi khi cần phải đảo ngược một trong các báo giá để lấy được\nđồng tiền trung gian hủy bỏ trong phương trình để có được tỷ giá chéo. Ví dụ: để nhận báo giá\nCanada-yen (JPY/CAD), người ta thường sử dụng tỷ giá đô la-Canada (CAD/USD) và tỷ giá đô la-yen\n(JPY/USD), là các quy ước thị trường. Do đó, để có được báo giá đồng Yên Canada (JPY/CAD), trước tiên chúng ta\nphải đảo ngược tỷ giá đồng đô la Canada (CAD/USD) trước khi nhân với đồng đô la-yên (JPY/USD)\nquote\nDo đó, tỷ giá hối đoái đầu kỳ là = 1/1.3216 x 105 42 = 0,75666 x 105,42 =\n79,77\nDo đó, tỷ giá hối đoái JPY/CAD cuối kỳ là = 1/1,2944 x 104,74 0,77256 × 104,74 = 80,92\nDo đó, phần trăm thay đổi trong tỷ giá hối đoái JPY/CAD trong kỳ là = 80,92/79,77-\n1=1,44% ≈1,4%.\nC. Không chính xác vì tỷ giá hối đoái JPY/USD đầu và cuối kỳ đã bị đảo ngược\ntheo trình tự thời gian như sau: Tỷ giá JPY/CAD đầu kỳ = 1/1,3216 x 104,74 = 0,75666 x 104,74\n= 79,25\nTỷ giá hối đoái cuối kỳ JPY/CAD = 1/1,2944 x 105,42 0,77256 x 105,42 = 81,44\nDo đó, phần trăm thay đổi trong JPY/CAD đã được tính toán không chính xác là 81,44/79,25-1=2,76%\n≈2,8%.\nKinh tế: tính toán và giải thích tiền tệ tỷ giá chéo","qhtml":null},{"n":41,"q":"An analyst gathers the following information about spot rates:\n● USD/GBP 1.2604\n● USD/EUR 1.1786\nUSD/GBP is the amount of USD per 1 GBP.\nUSD/EUR is the amount of USD per 1 EUR.\nThe spot EUR/GBP cross rate is closest to:","opts":["0.9351.","1.0694.","1.4855."],"ans":"B","expl":"A. Không chính xác vì đôi khi cần phải đảo ngược một trong các báo giá để lấy được\nđồng tiền trung gian hủy bỏ trong phương trình để có được tỷ giá chéo. Công thức cho tỷ giá chéo\nEUR/GBP là USD/GBP x USD/EUR)-1= USD/GBP x EUR/USD. Câu trả lời này đảo ngược tỷ giá hối đoái\nsai và đảo ngược công thức thành 1,1786/1,2604 ≈0,9351. Câu trả lời này sẽ là\ntỷ giá chéo GBP/EUR, không phải tỷ giá chéo EUR/GBP.\nB. Đúng vì đôi khi cần phải đảo ngược một trong các báo giá để lấy được\nđồng tiền trung gian hủy bỏ trong phương trình để có được tỷ giá chéo. Ví dụ: để nhận báo giá\nCanada-yen (JPY/CAD), người ta thường sử dụng tỷ giá đô la-Canada (CAD/USD) và tỷ giá đô la-yen\n(JPY/USD), là các quy ước thị trường. Phép tính đồng Yên Canada này yêu cầu tỷ giá\nđô la Canada (CAD/USD) phải được đảo ngược thành tỷ giá USD/CAD để phép tính có thể hoạt động. Công thức\ncho tỷ giá chéo EUR/GBP là USD/GBP x (USD/EUR)-1 = USD/GBP x EUR/USD =\n1.2604/1.1786≈1.0694.\nC. Không chính xác vì đôi khi cần phải đảo ngược một trong các báo giá để lấy được\nđồng tiền trung gian hủy bỏ trong phương trình để có được tỷ giá chéo. Câu trả lời này không đảo ngược\ncác báo giá mà là nhân hai tỷ giá giao ngay. 1,2604 x 1,1786≈1,4855.\nKinh tế học: tính toán và giải thích tỷ giá chéo tiền tệ","qhtml":null},{"n":42,"q":"A perfectly competitive market structure:","opts":["is not possible in reality.","causes all industries to ultimately fail due to lack of profits.","drives company profits to the investors' required rate of return."],"ans":"C","expl":"A. Không chính xác vì không giống như một số khái niệm kinh tế, cạnh tranh hoàn hảo không chỉ đơn thuần là một\nlý tưởng dựa trên các giả định. Cạnh tranh hoàn hảo là một thực tế.\nB. Không chính xác vì cạnh tranh hoàn hảo không có nghĩa là tất cả các ngành cạnh tranh hoàn hảo đều\ndẫn đến tuyệt chủng do thiếu lợi nhuận. Ngược lại, hàng triệu doanh nghiệp hoạt động rất tốt\nđang phải sống dưới áp lực của cạnh tranh hoàn hảo.\nC. Đúng vì lợi nhuận trong điều kiện cạnh tranh hoàn hảo được hướng tới\ntỷ lệ lợi nhuận bắt buộc mà doanh nhân phải trả để vay vốn từ các nhà đầu tư (cái gọi là lợi nhuận thông thường hoặc\nchi phí thuê vốn).\nKinh tế: mô tả các đặc điểm của cạnh tranh hoàn hảo, cạnh tranh độc quyền, độc quyền nhóm và\nđộc quyền thuần túy","qhtml":null},{"n":43,"q":"In contrast to real exchange rates, nominal foreign exchange rates:","opts":["tend to deviate from purchasing power parity.","represent the relative price levels in the domestic and foreign countries.","are indexes useful for understanding international trade and capital flows."],"ans":"A","expl":"A. Đúng vì tỷ giá hối đoái danh nghĩa thể hiện sự sai lệch dai dẳng so với PPP.\nB. Không chính xác vì mức giá tương đối được biểu thị bằng tỷ giá hối đoái thực. Tỷ giá hối đoái thực\nlà chỉ số điều chỉnh tỷ giá hối đoái danh nghĩa theo mức giá của mỗi quốc gia.\nViệc tạo các chỉ mục này yêu cầu điều chỉnh tỷ giá hối đoái danh nghĩa bằng cách sử dụng các mức giá ở mỗi\nquốc gia của cặp tiền tệ (do đó có tên \"tỷ giá hối đoái thực\") để so sánh sức mua\ntương đối giữa các quốc gia. Một cách tương đương để xem tỷ giá hối đoái thực là nó\nthể hiện mức giá tương đối ở trong nước và nước ngoài.\nC. Không chính xác vì tỷ giá hối đoái danh nghĩa không phải là chỉ số. Tỷ giá hối đoái thực đại diện cho\nchỉ số do các nhà phân tích tạo ra để hiểu khả năng cạnh tranh quốc tế của một nền kinh tế và\nsức mua thực sự của một loại tiền tệ. Trong bối cảnh này, tỷ giá hối đoái thực có thể hữu ích để\nhiểu xu hư
