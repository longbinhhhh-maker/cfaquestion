<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Fiscal policy refers to the government's decisions about:", "opts": ["taxation only.", "taxation and spending only.", "taxation, spending, and the quantity of money in the economy."], "ans": "B", "expl": "A. Incorrect because fiscal policy refers to the government's decisions about taxation and spending.\nB. Correct because fiscal policy refers to the government's decisions about taxation and spending.\nC. Incorrect because monetary policy refers to central bank activities that are directed toward\ninfluencing the quantity of money and credit in an economy. By contrast, fiscal policy refers to the\ngovernment's decisions about taxation and spending.\nEconomics: compare monetary and fiscal policy", "qhtml": null}, {"n": 2, "q": "Under which of the following market structures is product differentiation most important?", "opts": ["Monopoly", "Perfect competition", "Monopolistic competition"], "ans": "C", "expl": "A. Incorrect because the least competitive market structure is monopoly. In pure monopoly markets,\nthere are no other good substitutes for the given product or service. There is a single seller, which, if\nallowed to operate without constraint, exercises considerable power over pricing and output\ndecisions.\nB. Incorrect because perfect competition is a reality-for example, in several commodities markets,\nwhere sellers and buyers have a strictly homogeneous product and no single producer is large\nenough to influence market prices. Product differentiation is not possible under perfect competition.\nC. Correct because monopolistic competition is also highly competitive; however, it is considered a\nform of imperfect competition. The competitive characteristic is a notably large number of firms,\nwhile the monopoly aspect is the result of product differentiation. That is, if the seller can convince\nconsumers that its product is uniquely different from other, similar products, then the seller can\nexercise some degree of pricing power over the market.\nEconomics: identify the type of market structure within which a firm operates and describe the use\nand limitations of concentration measures", "qhtml": null}, {"n": 3, "q": "Which of the following economic policies is most likely directed toward influencing the\nquantity of credit in an economy?", "opts": ["Fiscal policy only", "Monetary policy only", "Both fiscal policy and monetary policy"], "ans": "B", "expl": "A. Incorrect because fiscal policy refers to the government's decisions about taxation and spending\nand it is not directly related to the quantity of credit in an economy.\nB. Correct because monetary policy refers to central bank activities that are directed toward\ninfluencing the quantity of money and credit in an economy.\nC. Incorrect because fiscal policy refers to the government's decisions about taxation and spending\nand it is not directly related to the quantity of credit in an economy.\nEconomics: compare monetary and fiscal policy", "qhtml": null}, {"n": 4, "q": "An analyst gathers the following information:\n● USD/AUD spot rate 0.8027\n● AUD 1-year interest rate 3.30%\n● USD 1-year interest rate 2.42%\nUSD/AUD is the amount of USD per 1 AUD.\nThe USD/AUD 1-year forward rate is closest to:", "opts": ["0.7959.", "0.8096.", "0.8292."], "ans": "A", "expl": "A. Correct because F = F ((1+i)/(1+i )). Substituting the values, F = 0.8027 x\nt/d t/d f d t/d\n((1+0.0242)/(1+0.033)) = 0.7959.\nB. Incorrect because it uses the incorrect formula F = F ((1+ i )/(1+ i))). Substituting the values,\nt/d t/d d f\nF = 0.8027 x ((1+0.033)/(1+0.0242)) 0.8096.\nt/d\nC. Incorrect because it uses the incorrect formula F = F (1+i). Substituting the values, F = 0.8027\nt/d t/d f t/d\n× (1+0.033) -0.8292.\nEconomics: explain the arbitrage relationship between spot and forward exchange rates and interest\nrates, calculate a forward rate using points or in percentage terms, and interpret a forward discount\nor premium", "qhtml": null}, {"n": 5, "q": "With respect to fiscal policy, transfer payments are best described as:", "opts": ["welfare payments.", "infrastructure spending.", "spending on recurring goods and services."], "ans": "A", "expl": "A. Correct because transfer payments are welfare payments made through the social security\nsystem, and, depending on the country, comprise payments for state pensions, housing benefits, tax\ncredits and income support for poorer families, child benefits, unemployment benefits and job search\nallowances\nB. Incorrect because capital expenditure includes infrastructure spending on roads, hospitals,\nprisons, and schools, not transfer payments.\nC. Incorrect because current government spending involves spending on goods and services that are\nprovided on a regular, recurring basis-including health, education, and defense, not transfer\npayments.\nEconomics: describe tools of fiscal policy, including their advantages and disadvantages", "qhtml": null}, {"n": 6, "q": "Which of the following economic conditions for a country best supports a well-functioning\ncurrency board exchange rate system?", "opts": ["Flexible domestic prices and wages", "Rapid growth in supply of the global reserve asset", "Large non-traded sectors of the domestic economy"], "ans": "A", "expl": "A. Correct because a currency board system works best if domestic prices and wages are very\nflexible.\nB. Incorrect because a currency board system works best when the global supply of the reserve asset\ngrows at a slow, steady rate consistent with long-run real growth with stable prices.\nC. Incorrect because a currency board system works best if non-traded sectors of the domestic\neconomy are relatively small.\nEconomics: describe exchange rate regimes and explain the effects of exchange rates on countries'\ninternational trade and capital flows", "qhtml": null}, {"n": 7, "q": "Which of the following indexes is most likely considered a leading economic indicator?", "opts": ["Consumer price index", "Broad stock market index", "Industrial production index"], "ans": "B", "expl": "A. Incorrect because the consumer price index is considered a lagging indicator: Inflation generally\nadjusts to the cycle late, especially the more stable services area.\nB. Correct because as a leading economic indicator, a positive change in the S&P 500 Index is\nsupposed to lead (come before) an increase in aggregate economic activity. An increase in the S&P\n500 would be positive for future economic growth, all else equal. Additionally, the Euro Stoxx Equity\nIndex is considered a leading indicator in the Eurozone\nC. Incorrect because this index measures industrial output, thus capturing the behavior of the most\nvolatile part of the economy. This index is considered one of the 4 coincidental indicators in the\nUnited States as tracked by the Conference Board.\nEconomics: describe how resource use, consumer and business activity, housing sector activity, and\nexternal trade sector activity vary over the business cycle and describe their measurement using\neconomic indicators", "qhtml": null}, {"n": 8, "q": "Independence, credibility, and transparency are most likely.", "opts": ["key objectives of fiscal policy.", "properties of the monetary transmission mechanism.", "qualities that determine the success of an inflation-targeting central bank."], "ans": "C", "expl": "A. Incorrect because these are qualities of a central bank. A primary aim for fiscal policy is to help\nmanage the economy through its influence on aggregate national output, that is, real GDP.\nB. Incorrect because these are qualities of a successful inflation-targeting central bank. The monetary\ntransmission mechanism is the process whereby a central bank's interest rate gets transmitted\nthrough the economy and ultimately affects the rate of increase of prices-that is, inflation. Those\nchannels include bank lending rates, asset prices, agents' expectations, and exchange rates.\nC. Correct because although inflation-targeting regimes vary a little from economy to economy, their\nsuccess is thought to depend on three key concepts: central bank independence, credibility, and\ntransparency.\nEconomics: describe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth, inflation,\ninterest, and exchange rates", "qhtml": null}, {"n": 9, "q": "With respect to geopolitics, setting standards for the size and shape of containers used for\nshipping is most likely an example of:", "opts": ["regulatory cooperation.", "process standardization.", "operational synchronization."], "ans": "C", "expl": "A. Incorrect because regulatory cooperation includes setting up regulatory bodies such as Basel\nCommittee on Banking Supervision (BCBS) rather than setting standards for container size and shape.\nB. Incorrect because process standardization includes establishing processes like Society for\nWorldwide Interbank Financial Telecommunication (SWIFT) rather than setting standards for\ncontainer size and shape.\nC. Correct because an example of operational synchronization is standards set for containers of\nuniform size and shape using multi-modal forms of transport (land, sea, air, rail) and port cranes.\nEconomics: describe geopolitics from a cooperation versus competition perspective", "qhtml": null}, {"n": 10, "q": "A nation that cooperates with a neighboring country is most likely characterized as:", "opts": ["autarkic.", "bilateral.", "hegemonic."], "ans": "B", "expl": "A. Incorrect because autarky describes countries seeking political self-sufficiency with little or no\nexternal trade or finance. Autarkic countries tend not to be cooperative with other countries.\nB. Correct because bilateralism is the conduct of political, economic, financial, or cultural\ncooperation between two countries. Countries engaging in bilateralism may have relations with\nmany different countries, but they are one- at-a-time agreements without multiple partners.\nC. Incorrect because hegemonic countries tend to be regional or even global leaders, and they use\ntheir political or economic influence of others to control resources economic and political dominance\nmay provide important influence on global affairs. Thus, hegemonic countries tend to lead or\ndominate more than cooperate.\nEconomics: describe geopolitics from a cooperation versus competition perspective", "qhtml": null}, {"n": 11, "q": "The inflation target of an effective central bank is most likely. the risk of deflation.", "opts": ["equal to zero to avoid", "sufficiently below zero to maintain high credibility. a significant degree of price stability.", "low enough to ensure"], "ans": "C", "expl": "A. Incorrect because an inflation-targeting framework normally has a clear, symmetric and forward-\nlooking medium- term inflation target, sufficiently above 0 percent to avoid the risk of deflation but\nlow enough to ensure a significant degree of price stability\nB. Incorrect because an inflation-targeting framework normally has a clear, symmetric and forward-\nlooking medium- term inflation target, sufficiently above 0 percent to avoid the risk of deflation but\nlow enough to ensure a significant degree of price stability.\nC. Correct because an inflation-targeting framework normally has a clear, symmetric and forward-\nlooking medium- term inflation target, sufficiently above 0 percent to avoid the risk of deflation but\nlow enough to ensure a significant degree of price stability.\nEconomics: describe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth, inflation,\ninterest, and exchange rates", "qhtml": null}, {"n": 12, "q": "Under which of the following conditions is monetary policy most effective? When the:", "opts": ["demand for money is infinitely elastic.", "central bank targets an exchange rate.", "risk of inflation is greater than deflation."], "ans": "C", "expl": "A. Incorrect because this leads to a liquidity trap. In very extreme instances, there may be occasions\nwhere the demand for money becomes infinitely elastic so that further injections of money into the\neconomy will not serve to further lower interest rates or affect real activity. This is known as a\nliquidity trap in this extreme circumstance monetary policy can become completely ineffective.\nB. Incorrect because when the central bank or monetary authority chooses to target an exchange\nrate, interest rates and conditions in the domestic economy intrat adapt to accommodate this target\nand domestic interest rates and money supply can become more volatile.\nC. Correct because deflation is more problematicter the central bank than Inflation. Deflation is a\npervasive and persistent fail in a general price index and is more difficult for conventional monetary\npolicy to deal with than ination. This is because cutting namimal interest rates much below zero to\nstimulate the economy is difficult it is at this point that the economic conditions for a liquidity trap\narise.\nEconomics: describe qualities of effective central banks, contrast their use of inflation, interest rate,\nand exchange rate targeting in expansionary or contractionary monetary policy, and describe the\nlimitations of monetary policy", "qhtml": null}, {"n": 13, "q": "Cyber threats most likely fall into the category of", "opts": ["event risk.", "thematic risk.", "exogenous risk."], "ans": "B", "expl": "A. Incorrect because event risk evolves around set dates, such as elections, new legislation, or other\ndate-driven milestones, such as holidays or political anniversaries, known in advance, whilst thematic\nrisks are known risks that evolve and expand over a period of time and cyber threats are an example\nof thematic risk.\nB. Correct because cyber threats are another example of thematic risk.\nC. Incorrect because exogenous risk is a sudden or unanticipated risk that impacts either a country's\ncooperative stance, the ability of non-state actors to globalize, or both. Examples include sudden\nuprisings, invasions, or the aftermath of natural disasters, whilst thematic risks are known risks that\nevolve and expand over a period of time and cyber threats are [an example of thematic risk]\nEconomics: describe the impact of geopolitical risk on investments", "qhtml": null}, {"n": 14, "q": "Flat money:", "opts": ["is not currently used in any major economy.", "can be exchanged for a precious metal at the country's central bank.", "derives its value via government decree and because people accept it for payment."], "ans": "C", "expl": "A. Incorrect because money in all major economies today is not convertible by law into anything else,\nbut it is, in law, legal tender. Money that is not convertible into any other commodity is known as fiat\nmoney.\nB. Incorrect because money that is not convertible into any other commodity is known as fiat money.\nC. Correct because fiat money derives its value via government decree and because people accept it\nfor payment of goods and services and for debt repayment.\nEconomics: describe the roles and objectives of central banks", "qhtml": null}, {"n": 15, "q": "An objective of fiscal policy is to:", "opts": ["supervise the banking system.", "influence the quantity of credit in an economy.", "distribute income among different segments of the population."], "ans": "C", "expl": "A. Incorrect because monetary policy, not fiscal policy, refers to central bank activities such as\nsupervising the banking system.\nB. Incorrect because monetary policy refers to central bank activities that are directed toward\ninfluencing the quantity of money and credit in an economy. By contrast, fiscal policy refers to the\ngovernment's decisions about taxation and spending.\nC. Correct because fiscal policy involves the use of government spending and changing tax revenue\nto affect a number of aspects of the economy including the distribution of income and wealth among\ndifferent segments of the population.\nEconomics: describe roles and objectives of fiscal policy as well as arguments as to whether the size\nof a national debt relative to GDP matters", "qhtml": null}, {"n": 16, "q": "A decrease in taxes and an increase in interest rates most likely reflect:", "opts": ["easy fiscal policy and tight monetary policy.", "tight fiscal policy and easy monetary policy.", "tight fiscal policy and tight monetary policy."], "ans": "A", "expl": "A. Correct because decreasing taxes reflects easy fiscal policy. If taxes are cut the expansionary fiscal\npolicy will lead to a rise in aggregate output Increasing interest rates reflects tight monetary policy. If\nthis is accompanied by a reduction in money supply to offset the fiscal expansion, then interest rates\nwill rise.\nB. Incorrect because a decrease in taxes is expansionary fiscal policy, not tight fiscal policy.\nC. Incorrect because a decrease in taxes is expansionary fiscal policy, not tight fiscal policy\nEconomics: explain the interaction of monetary and fiscal policy", "qhtml": null}, {"n": 17, "q": "With respect to conventional monetary policy, combating inflation is most likely.", "opts": ["less difficult than combating deflation.", "equally difficult as combating deflation.", "more difficult than combating deflation."], "ans": "A", "expl": "A. Correct because deflation is more difficult for conventional monetary policy to deal with than\ninflation. This is because once the monetary authority has cut nominal interest rates to zero to\nstimulate the economy, it cannot cut them any further.\nB. Incorrect because deflation is more difficult for conventional monetary policy to deal with than\ninflation. This is because once the monetary authority has cut nominal interest rates to zero to\nstimulate the economy, it cannot cut them any further.\nC. Incorrect because deflation is more difficult for conventional monetary policy to deal with than\ninflation. This is because once the monetary authority has cut nominal interest rates to zero to\nstimulate the economy, it cannot cut them any further.\nEconomics: describe qualities of effective central banks, contrast their use of inflation, interest rate,\nand exchange rate targeting in expansionary or contractionary monetary policy, and describe the\nlimitations of monetary policy", "qhtml": null}, {"n": 18, "q": "With respect to the foreign exchange market, an arbitrage relationship involving\ncountries' relative interest rates\nserves as the basis for:", "opts": ["real exchange rates.", "forward exchange rates.", "nominal exchange rates."], "ans": "B", "expl": "A. Incorrect because real exchange rates are indexes often constructed by economists and other\nmarket analysts to assess changes in the relative purchasing power of one currency compared with\nanother, and are therefore not based on an arbitrage relationship.\nB. Correct because forward exchange rates are based on an arbitrage relationship that equates the\ninvestment return on two alterative but equivalent investments, which involves the relationship\nbetween the risk-free interest rates of the two countries concerned. The arbitrage relationship is F\nf/d\n= F (1+i)/(1+i ), where F the forward rate. S is the spot rate, and i (i ) is the foreign (domestic)\nf/d f d f/d t/d f d\nrisk-free interest rate.\nC. Incorrect because the nominal exchange rate is the number of units of one currency (called the\nprice currency) that one unit of another currency (called the base currency) will buy, and is set by\nmarket forces eg, capital flows, trade flows, etc. While it is true that cross-rate (nominal exchange\nrate) quotes must be consistent, the market will arbitrage the mispricings, the specific arbitrage\nrelationship relating to nominal exchange rates does not involve relative interest rates, it is simply\nbased on currency market quotations (and subsequently by the derived currency cross-rates).\nEconomics: explain the arbitrage relationship between spot and forward exchange rates and interest\nrates, calculate a forward rate using points or in percentage terms, and interpret a forward discount\nor premium", "qhtml": null}, {"n": 19, "q": "Which of the following would most likely lead to an increase in globalization? A decrease\nin:", "opts": ["soft power.", "nationalism.", "standardization."], "ans": "B", "expl": "A. Incorrect because soft power has a positive effect on globalization. Soft power is a means of\ninfluencing another country's decisions without force or coercion. Soft power can be built over time\nthrough such actions as cultural programs, advertisement, travel grants, and university exchange.\nAnd globalization also has cultural and communicative features. Although it can be difficult to\nmeasure these features, such as the spread of information or culture, it has increased interactions\nbetween citizens of countries all over the world. Internet usage allows for the near-instantaneous\nspread of cultural information and context.\nB. Correct because globalization is marked by economic and financial cooperation, including the\nactive trade of goods and services, capital flows, currency exchange, and cultural and information\nexchange. Actors participating in globalization are likely to reach beyond their national borders for\naccess to new markets, talent, or learning. By contrast, anti-globalization or nationalism is the\npromotion of a country's own economic interests to the exclusion or detriment of the interests of\nother nations.\nC. Incorrect because standardization is the process of creating protocols for the production, sale,\ntransport, or use of a product or service. Standardization occurs when relevant parties agree to\nfollow these protocols together. It helps support expanded economic and financial activities across\nborders. And as globalization deepens, companies develop standards and processes to incorporate\nmultiple cultures into their overall corporate culture. They must cooperate with multiple sets of\nrules, and they may establish standard procedures based on the groups of companies they operate\nin.\nEconomics: describe geopolitics and its relationship with globalization", "qhtml": null}, {"n": 20, "q": "Which of the following organizations was founded with the goal of assisting in the\nreconstruction of the international payment system?", "opts": ["The World Trade Organization", "The International Monetary Fund", "The International Bank for Reconstruction and Development"], "ans": "B", "expl": "A. Incorrect because WTO provides the legal and institutional foundation of the multinational trading\nsystem. It is the only international organization that regulates cross-border trade relationships among\nnations on a global scale\nB. Correct because IMF was founded with the goal to stabilize exchange rates and assist the\nreconstruction of the world's international payment system.\nC. Incorrect because the World Bank was created to facilitate post-war reconstruction and\ndevelopment. Also, World Bank's two closely affiliated entities-the International Bank for\nReconstruction and Development (IBRD) and the International Development Association (IDA)-\nprovide low or no-interest loans and grants to countries that have unfavourable or no access to\ninternational credit markets.\nEconomics: describe functions and objectives of the international organizations that facilitate trade,\nincluding the World Bank, the International Monetary Fund, and the World Trade Organization", "qhtml": null}, {"n": 21, "q": "Under which of the following market structures do firms have the least control over\nprice?", "opts": ["Oligopoly", "Monopoly", "Monopolistic competition"], "ans": "C", "expl": "A. Incorrect because from the perspective of the owners of the firm, the most desirable market\nstructure is that with the most control over price, because this control can lead to large profits.\nMonopoly and oligopoly markets offer the greatest potential control over price, monopolistic\ncompetition offers less control. Firms operating under perfectly competitive market conditions have\nno control over price.\nB. Incorrect because from the perspective of the owners of the firm, the most desirable market\nstructure is that with the most control over price, because this control can lead to large profits.\nMonopoly and oligopoly markets offer the greatest potential control over price, monopolistic\ncompetition offers less control. Firms operating under perfectly competitive market conditions have\nno control over price.\nC. Correct because from the perspective of the owners of the firm, the most desirable market\nstructure is that with the most control over price, because this control can lead to large profits.\nMonopoly and oligopoly markets offer the greatest potential control over price; monopolistic\ncompetition offers less control. Firms operating under perfectly competitive market conditions have\nno control over price.\nEconomics: describe characteristics of perfect competition, monopolistic competition, oligopoly, and\npure monopoly", "qhtml": null}, {"n": 22, "q": "Assuming wages and prices are rigid, which of the following policy combinations most\nlikely leads to the private sector increasing its share of GDP?", "opts": ["Easy fiscal policy and tight monetary policy", "Tight monetary policy and tight fiscal policy", "Tight fiscal policy and easy monetary policy"], "ans": "C", "expl": "A. Incorrect because if taxes are cut or government spending rises, the expansionary fiscal policy will\nlead to a rise in aggregate output. If this is accompanied by a reduction in money supply to offset the\nfiscal expansion, then interest rates will rise and have a negative effect on private sector demand. We\nhave higher output and higher interest rates, and government spending will be a larger proportion of\noverall national income.\nB. Incorrect because, in the case of tight monetary policy and tight fiscal policy, interest rates rise (at\nleast if the monetary impact on interest rates is larger) and reduce private demand. At the same\ntime, higher taxes and falling government spending lead to a drop in aggregate demand from both\npublic and private sectors.\nC. Correct because if a fiscal contraction is accompanied by expansionary monetary policy and low\ninterest rates. then the private sector will be stimulated and will rise as a share of GDP, while the\npublic sector will shrink.\nEconomics: explain the interaction of monetary and fiscal policy", "qhtml": null}, {"n": 23, "q": "Q. Which of the following changes most likely reflects a discretionary fiscal policy action?", "opts": ["A decrease in corporate tax revenues due to lower corporate profitability", "An increase in government expenditures due to new infrastructure projects", "An increase in payments of unemployment benefits due to increasing unemployment"], "ans": "B", "expl": "A. Incorrect because the deficit can change for reasons unrelated to actual fiscal policy changes.\nAutomatic stabilizers will lead to changes in the budget deficit unrelated to fiscal policy changes; a\nrecession will cause tax revenues to fall and the budget deficit to rise.\nB. Correct because in addition to these automatic adjustments, governments also use discretionary\nfiscal adjustments to influence aggregate demand. These will involve tax changes and/or spending\ncuts or increase usually with the aim of stabilizing the economy. An increase in government\nexpenditures due to new infrastructure projects is a discretionary fiscal policy action because new\npublic spending on social goods and infrastructure, such as hospitals and schools, boosting personal\nincomes with the objective of raising aggregate demand.\nC. Incorrect because automatic stabilizers-such as income tax, VAT, and social benefits are important\nbecause as output and employment fall and reduce tax revenues, so net tax revenues also fall as\nunemployment benefits rise. This acts as a fiscal stimulus and serves to reduce the size of the\nmultiplier, dampening the output response of whatever caused the fall in output in the first place. By\ntheir very nature, automatic stabilizers do not require policy changes; no policymaker has to decide\nthat an economic shock has occurred and how to respond.\nEconomics: explain the implementation of fiscal policy and difficulties of implementation as well as\nwhether a fiscal policy is expansionary or contractionary.", "qhtml": null}, {"n": 24, "q": "Each oligopoly firm faces an individual demand curve under:", "opts": ["colluding market conditions only.", "non-colluding market conditions only.", "both colluding and non-colluding market conditions."], "ans": "B", "expl": "A. Incorrect because in an oligopoly market where collusion is present, the aggregate market\ndemand curve is divided up by the individual production participants. Under non-colluding market\nconditions, each firm faces an individual demand curve.\nB. Correct because in an oligopoly market where collusion is present, the aggregate market demand\ncurve is divided up by the individual production participants. Under non-colluding market conditions,\neach firm faces an individual demand curve\nC. Incorrect because in an oligopoly market where collusion is present, the aggregate market demand\ncurve is divided up by the individual production participants. Under non-colluding market conditions,\neach firm faces an individual demand curve\nEconomics: explain supply and demand relationships under oligopoly, including the optimal price and\noutput for firms as well as pricing strategy", "qhtml": null}, {"n": 25, "q": "A decline in tax revenues due to a recession is best described as an example of a(n):", "opts": ["automatic stabilizer.", "expansionary fiscal policy.", "contractionary fiscal policy."], "ans": "A", "expl": "A. Correct because falling tax revenues due to a recession is an example of automatic stabilizer, not a\ndiscretionary fiscal policy. Automatic stabilizers will lead to changes in the budget deficit unrelated to\nfiscal policy changes, a recession will cause tax revenues to fall and the budget deficit to rise.\nB. Incorrect because falling tax revenues due to a recession are an example of an automatic stabilizer.\nAutomatic stabilizers will lead to changes in the budget deficit unrelated to fiscal policy changes; a\nrecession will cause tax revenues to fall and the budget deficit to rise. An expansionary fiscal policy is\ndiscretionary in order to help manage the economy through its influence on aggregate national\noutput, that is, real GDP. In a recession, governments can raise spending (expansionary fiscal policy)\nin an attempt to raise employment and output.\nC. Incorrect because falling tax revenues due to a recession are an example of an automatic stabilizer.\nAutomatic stabilizers will lead to changes in the budget deficit unrelated to fiscal policy changes; a\nrecession will cause tax revenues to fall and the budget deficit to rise. A contractionary fiscal policy is\ndiscretionary in order to help manage the economy through its influence on aggregate national\noutput, that is, real GDP. When an economy has full employment and wages and prices are rising too\nfast-then government spending may be reduced and taxes raised (contractionary fiscal policy).\nEconomics: explain the implementation of fiscal policy and difficulties of implementation as well as\nwhether a fiscal policy is expansionary or contractionary", "qhtml": null}, {"n": 26, "q": "According to the Cournot assumption, in an oligopoly market each firm determines its\nprofit-maximizing production level by assuming that other firms will:", "opts": ["decrease output.", "not change output.", "increase output."], "ans": "B", "expl": "A. Incorrect because in the Cournot assumption, each firm determines its profit-maximizing\nproduction level by assuming that the other firms' output will not change. This assumption simplifies\npricing strategy because there is no need to guess what the other firm will do to retaliate.\nB. Correct because in the Cournot assumption, each firm determines its profit-maximizing\nproduction level by assuming that the other firms' output will not change. This assumption simplifies\npricing strategy because there is no need to guess what the other firm will do to retaliate.\nC. Incorrect because in the Cournot assumption, each firm determines its profit-maximizing\nproduction level by assuming that the other firms' output will not change. This assumption simplifies\npricing strategy because there is no need to guess what the other firm will do to retaliate.\nEconomics: explain supply and demand relationships under oligopoly, including the optimal price and\noutput for firms as well as pricing strategy", "qhtml": null}, {"n": 27, "q": "The main objective of most central banks is to maintain:", "opts": ["price stability.", "gold reserves.", "an employment target."], "ans": "A", "expl": "A. Correct because for a central bank there is one overarching objective that most seem to\nacknowledge explicitly, and that is the objective of maintaining price stability.\nB. Incorrect because while most central banks will also be responsible for managing their country's\nforeign currency reserves and also its gold reserves. There is one overarching objective that most\nseem to acknowledge explicitly, and that is the objective of maintaining price stability.\nC. Incorrect because while some central banks are charged with doing all they can to maintain full\nemployment and output there is one overarching objective that most seem to acknowledge\nexplicitly, and that is the objective of maintaining price stability.\nEconomics: describe the roles and objectives of central banks", "qhtml": null}, {"n": 28, "q": "An analyst gathers the following information about a company:\n● Average variable cost per unit $12.50\n● Selling price per unit $37.50\n● Total fixed costs $900,000\nThe minimum production level needed to continue operations over the long run is most\nlikely.", "opts": ["24,000 units.", "36,000 units", "72,000 units."], "ans": "B", "expl": "A. Incorrect because in the long nun, if a firm cannot earn at least a zero economic profit, it will not\noperate because it is not covering the opportunity cost of all of its factors of production, labor, and\ncapital in the long run, if total revenues equal or exceed total costs the firm should stay in the market\nAt a selling price of $37 80 each unit will cover $12 50 of variable cost, and contribute $25 towards\nfixed costs $900,000 of fixed costs divided by this 525 equals 36,000 units At 36,000 units all variable\nand fixed costs are covered by total revenues if the full selling price of $37.50 is divided into the\n$900,000 total fixed. costs, the result is 24,000 units which is below the minimum production\nrequired to contmire operations in the long run.\nB. Correct because in the long run if a firm cannot earn at least a zero economic pront, it will not\noperate because it is not covering the opportunity cost of all tits factors of production laper and\ncapital in the long run. I total revenues equal or exceed total costs the firm should stay in the market\nAt a selling price of $37.50 each unit will cover $12 60 of variable cost, and contribute $25\n(contribution margin) towards fixed costs 5900,000 of fixed costs divided by this $25 equals 36.000\nunits. At 36.000 units all variable and fixed costs are covered by total revenues\nC. Incorrect because in the long run, if a firm cannot earn at least a zero economic profit, it will not\noperate because it is not covering the opportunity cost of all of its factors of production, labor, and\ncapital. In the long run, if total revenues equal or exceed total costs the firm should stay in the\nmarket. At a selling price of $37.50, each unit will cover $12.50 of variable cost, and contribute $25\n(contribution margin) towards fixed costs $900,000 of fixed costs divided by this $25 equals 36,000\nunits. At 36.000 units, all variable and fixed costs are covered by total revenues. This is the minimum\nproduction level needed for the company to continue production. If the average variable cost of\n$12.50 is divided into $900,000 the result is 72,000 units\nEconomics: determine and interpret breakeven and shutdown points of production, as well as how\neconomies and diseconomies of scale affect costs under perfect and imperfect competition", "qhtml": null}, {"n": 29, "q": "The implementation of an export subsidy for a normal good produced in a small country\nwill most likely increase the:", "opts": ["domestic consumption of the good.", "price of the good in the domestic market.", "national welfare of the country providing the subsidy."], "ans": "B", "expl": "A. Incorrect because in the case of an export subsidy, the exporter has the incentive to shift sales\nfrom the domestic to the export market. This scenario raises the price in the domestic market by the\namount of the subsidy in the small country case (price before subsidy plus subsidy). As the domestic\nprice in the small country is higher, the consumption of the good will decline (rather than increase).\nB. Correct because in the case of an export subsidy, the exporter has the incentive to shift sales from\nthe domestic to the export market because it receives the international price plus the per-unit\nsubsidy for each unit of the good exported. This scenario raises the price in the domestic market by\nthe amount of the subsidy in the small country case (price before subsidy plus subsidy).\nC. Incorrect because an export subsidy is a payment by the government to a firm for each unit of a\ngood that is exported. Its goal is to stimulate exports. But it interferes with the functioning of the\nfree market and may distort trade away from comparative advantage. Hence, it reduces welfare....\nThe net welfare effect is negative in both the large and small country cases. Thus, export subsidies\ndecrease rather than increase national welfare.\nEconomics: compare types of trade restrictions, such as tariffs, quotas, and export subsidies, and\ntheir economic implications", "qhtml": null}, {"n": 30, "q": "Under monopolistic competition, a firm's supply curve is represented by:", "opts": ["average cost.", "marginal cost.", "neither average cost nor marginal cost."], "ans": "C", "expl": "A. Incorrect because in perfect competition, the firm's supply schedule is represented by the\nmarginal cost schedule. In monopolistic competition, there is no well-defined supply function. The\ninformation used to determine the appropriate level of output is based on the intersection of MC\nand MR. However, the price that will be charged is based on the market demand schedule. The firm's\nsupply curve should measure the quantity the firm is willing to supply at various prices. That\ninformation is not represented by either marginal cost or average cost\nB. Incorrect because in perfect competition, the firm's supply schedule is represented by the\nmarginal cost schedule. In monopolistic competition, there is no well-defined supply function. The\ninformation used to determine the appropriate level of output is based on the intersection of MC\nand MR. However, the price that will be charged is based on the market demand schedule. The firm's\nsupply curve should measure the quantity the firm is willing to supply at various prices. That\ninformation is not represented by either marginal cost or average cost.\nC. Correct because in perfect competition, the firm's supply schedule is represented by the marginal\ncost schedule. In monopolistic competition, there is no well-defined supply function. The information\nused to determine the appropriate level of output is based on the intersection of MC and MR.\nHowever, the price that will be charged is based on the market demand schedule. The firm's supply\ncurve should measure the quantity the firm is willing to supply at various prices. That information is\nnot represented by either marginal cost or average cost.\nEconomics: explain supply and demand relationships under monopolistic competition, including the\noptimal price and output for firms as well as pricing strategy", "qhtml": null}, {"n": 31, "q": "During the slowdown phase of the business cycle:", "opts": ["inflation decelerates.", "business halts new orders.", "business slows its rate of hiring."], "ans": "C", "expl": "A. Incorrect because in the slowdown slowdown phase inflation further accelerates [not decelerates]\nB. Incorrect because in the slowdown phase companies continue to place new orders as they operate\nat or near capacity.\nC. Correct because in the slowdown phase business continue hiring but at a slower rate. The\nunemployment rate continues to fall but at a decreasing rate.\nEconomics: describe the business cycle and its phases", "qhtml": null}, {"n": 32, "q": "The interest rate spread between 10-year treasury yields and overnight borrowing rates\nmost likely.", "opts": ["is a lagging economic indicator.", "decreases when the market expects an economic downturn.", "increases as the market expects future short-term interest rates to decrease."], "ans": "B", "expl": "A. Incorrect because leading economic indicators have turning points those usually precede those of\nthe overall economy. Lagging economic indicators have turning points that take place later those of\nthe overall economy Interest rate spread between 10-year treasury yields and overnight borrowing\nrates is a leading economic indicator.\nB. Correct because long-term yields express market expectations about the direction of short-term\ninterest rates, and rates ultimately follow the economic cycle up and down, a wider spread, by\nanticipating short rate increases, also anticipates an economic upswing Conversely, a narrower\nspread by anticipating short rate decreases, also anticipates an economic downturn.\nC. Incorrect because long-term yields express market expectations about the direction of short-term\ninterest rates, and rates ultimately follow the economic cycle up and down, a wider spread, by\nanticipating short rate increases, also anticipates an economic upswing. anticipates an economic\ndownturn.\nEconomics: describe how resource use, consumer and business activity, housing sector activity, and\nexternal trade sector activity vary over the business cycle and describe their measurement using\neconomic indicators", "qhtml": null}, {"n": 33, "q": "Which of the following monetary policy actions is most likely considered expansionary?\nThe central bank:", "opts": ["acts as the lender in a repurchase agreement", "sells government bonds to commercial banks.", "raises reserve requirements of commercial banks."], "ans": "A", "expl": "A. Correct because if the central bank wishes to increase the supply of money, it might buy bonds\n(usually government bonds) from the banks, with an agreement to sell them back at some time in\nthe future. This transaction is known as a repurchase agreement. The lender in a repurchase\nagreement is the party that initially buys the bonds and agrees to sell them back at a later point in\ntime. By purchasing bonds from banks the central bank is increasing the money supply, or increasing\nliquidity, which is expansionary.\nB. Incorrect because the central bank can sell government bonds to commercial banks. By doing this,\nthe reserves of commercial banks decline, reducing their capacity to make loans (ie, create credit) to\nhouseholds and corporations and thus causing broad money growth to decline through the money\nmultiplier mechanism. This reduction in liquidity is contractionary, not expansionary.\nC. Incorrect because a central bank could restrict money creation by raising the reserve requirements\nof banks. This causes banks to keep more money in reserve, which reduces the money supply. This\nmonetary policy action is contractionary, not expansionary.\nEconomics: describe qualities of effective central banks; contrast their use of inflation, interest rate,\nand exchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy", "qhtml": null}, {"n": 34, "q": "Dollarization is best described as an exchange rate regime whereby a country:", "opts": ["uses the currency of another nation as its medium of exchange.", "participates in a monetary union whose members share the same legal tender.", "makes a commitment to exchange domestic currency for a specified foreign currency at a fixed exchange rate."], "ans": "A", "expl": "A. Correct because in case of dollarization the country uses the currency of another nation as its\nmedium of exchange and unit of account.\nB. Incorrect because the IMF identifies two types of arrangements in which a country does not have\nits own legal tender. In the first, known as dollarization, the country uses the currency of another\nnation as its medium of exchange and unit of account. In the second, the country participates in a\nmonetary union whose members share the same legal tender. Therefore dollarization is not best\ndescribed as an exchange rate regime whereby the county participates in a monetary union whose\nmembers share the same legal tender\nC. Incorrect because in case of dollarization the country uses the currency of another nation as its\nmedium of exchange and unit of account. In contrast, a currency board is a monetary regime based\non an explicit legislative commitment to exchange domestic currency for a specified foreign currency\nat a fixed exchange rate, combined with restrictions on the issuing authority to ensure fulfillment of\nits legal obligation.\nEconomics: describe exchange rate regimes and explain the effects of exchange rates on countries'\nInternational trade and capital flows", "qhtml": null}, {"n": 35, "q": "Which of the following fiscal policy actions is most likely contractionary?", "opts": ["Increasing taxes and decreasing spending", "Decreasing taxes and increasing spending", "Decreasing taxes and decreasing spending"], "ans": "A", "expl": "A. Correct because increasing taxes and decreasing spending are indicative of a contractionary fiscal\npolicy. When an economy has full employment and wages and prices are rising too fast-then\ngovernment spending may be reduced and taxes raised (contractionary fiscal policy).\nB. Incorrect because decreasing taxes and increasing spending are indicative of a budget deficit,\nwhich is expansionary. An expansionary policy could take one or more of the following forms cuts in\nsales (indirect) taxes to lower prices which raises real incomes with the objective of raising consumer\ndemand cuts in corporation (company) taxes to boost business profits, which may raise capital\nspending, and cuts in tax rates on personal savings to raise disposable income for those with savings,\nwith the objective of raising consumer demand Expansionary fiscal policy also includes new public\nspending on social goods and infrastructure, such as hospitals and schools, boosting personal\nincomes with the objective of raising aggregate demand. An increase in a budget surplus would be\nassociated with contractionary fiscal policy, while a rise in a deficit is an expansionary fiscal policy\nC. Incorrect because a decrease in taxes is expansionary, while a decrease in spending is\ncontractionary. Without knowing the relative magnitudes, we cannot say whether the policy is\nexpansionary or contractionary. An expansionary policy could take one or more of the following\nforms cuts in sales (indirect) taxes to lower prices which raises real incomes with the objective of\nraising consumer demand cuts in corporation (company) taxes to boost business profits, which may\nraise capital spending, and cuts in tax rates on personal savings to raise disposable income for those\nwith savings, with the objective of raising consumer demand. However, an increase (not decrease) in\nspending is expansionary. Expansionary fiscal policy also includes new public spending on social\ngoods and infrastructure, such as hospitals and schools, boosting personal incomes with the\nobjective of raising aggregate demand. An increase in a budget surplus would be associated with\ncontractionary fiscal policy. while a rise in a deficit is an expansionary fiscal policy.\nEconomics: explain the implementation of fiscal policy and difficulties of implementation as well as\nwhether a fiscal policy is expansionary or contractionary", "qhtml": null}, {"n": 36, "q": "A fiscal policy tool that can immediately influence spending is most likely.", "opts": ["indirect taxes.", "exchange rate targeting.", "capital expenditure plans."], "ans": "A", "expl": "A. Correct because indirect taxes can be adjusted almost immediately after they are announced and\ncan influence spending behaviour instantly and generate revenue for the government at little or no\ncost to the government.\nB. Incorrect because exchange rate targeting is a monetary policy tool, not a fiscal policy tool. Many\ndeveloping economies choose to operate monetary policy by targeting their currency's exchange\nrate.\nC. Incorrect because capital spending plans take longer to formulate and implement, typically over a\nperiod of years. The slower the impact of a fiscal change, the more likely other exogenous changes\nwill already be influencing the economy before the fiscal change kicks in.\nEconomics: describe tools of fiscal policy, including their advantages and disadvantages", "qhtml": null}, {"n": 37, "q": "Which of the following is most likely a lagging economic indicator?", "opts": ["Inventory-sales ratio", "S&P 500 Stock Index", "Manufacturers' new orders for consumer goods and materials"], "ans": "A", "expl": "A. Correct because inventories accumulate as sales initially decline then, once a business adjusts its\nordering. become depleted as sales pick up, so this ratio tends to lag the cycle.\nB. Incorrect because this is a leading economic indicator. Stock prices anticipate economic turning\npoints, both up and down, so their movements offer a useful early signal on economic cycles.\nC. Incorrect because this is a leading economic indicator. Businesses cannot wait too long to meet\ndemands for materials consumer goods or materials without ordering, so these gauges tend to lead\nat upturns and downturns. Indirectly, changes in business sentiment as well, which also often leads\nthe cycle.\nEconomics: describe how resource use, consumer and business activity, housing sector activity, and\nexternal trade sector activity vary over the business cycle and describe their measurement using\neconomic indicators", "qhtml": null}, {"n": 38, "q": "As an economy moves from the gold standard to a system of fiat currency, the role of the\ncentral bank most likely.", "opts": ["becomes less crucial.", "remains unchanged.", "becomes more crucial."], "ans": "C", "expl": "A. Incorrect because once an economy has moved to a system of fiat money, the role of the supplier\nof that money [the central bank] becomes even more crucial because they could, for example,\nexpand the supply of this money indefinitely should they wish to do so. Central banks therefore play\na crucial role in modern economies as the suppliers and guardians of the value of their fiat currencies\nand as institutions charged with the role of maintaining confidence in their currencies\nB. Incorrect because once an economy has moved to a system of fiat money, the role of the supplier\nof that money [the central bank] becomes even more crucial because they could, for example,\nexpand the supply of this money Indefinitely should they wish to do so. Central banks therefore play\na crucial role in modem economies as the suppliers and guardians of the value of their flat currencies\nand as institutions charged with the role of maintaining confidence in their currencies\nC. Correct because once an economy has moved to a system of flal money, the role of the supplier of\nthat money [the central bank) becomes even more crucial because they could, for example, expand\nthe supply of this money indefinitely should they wish to do so. Central banks therefore play a crucial\nrole in modem economies as the suppliers and guardians of the value of their fiat currencies and as\ninstitutions charged with the role of maintaining confidence in their currencies.\nEconomics: describe the roles and objectives of central banks", "qhtml": null}, {"n": 39, "q": "Which of the following is most likely a coincident indicator of economic activity?", "opts": ["Average duration of unemployment", "Average weekly hours, manufacturing", "Employees on non-agricultural payrolls"], "ans": "C", "expl": "A. Incorrect because businesses wait until downturns look genuine to lay off, and wait until\nrecoveries look secure to rehire, this measure is important because it lags the cycle on both the way\ndown and the way up. Thus, average duration of unemployment is a lagging economic indicator\nB. Incorrect because businesses will cut overtime before laying off workers in a downturn and\nincrease it before rehiring weekly in a cyclical upturn, these measures move up and down before the\ngeneral economy. Thus, average hours, manufacturing is a leading economic indicator.\nC. Correct because once recession or recovery is clear, businesses adjust their fulltime payrolls. Non-\nagricultural payrolls and manufacturing and trade sales are coincident indicators.\nEconomics: describe how resource use, consumer and business activity, housing sector activity, and\nexternal trade sector activity vary over the business cycle and describe their measurement using\neconomic indicators", "qhtml": null}, {"n": 40, "q": "An analyst gathers the following foreign exchange rate information:\nCAD/USD JPY/USD\n● Beginning of period 1.3216 105.42\n● End of period 1.2944 104.74\nCAD/USD is the amount of CAD per 1 USD.\nJPY/USD is the amount of JPY per 1 USD.\nThe percentage change in the JPY/CAD cross-rate for the period is closest to:", "opts": ["-2.7%.", "1.4%.", "2.8%"], "ans": "B", "expl": "A. Incorrect because the CAD/USD exchange rate was not inverted, as required in the correct\ncalculation:\nBeginning of period JPY/CAD rate = 1.3216 x 105.42 = 139.32\nEnd of period JPY/CAD exchange rate = 1.2944 x 104.74 = 135.58\nTherefore the percentage change in JPY/CAD was calculated incorrectly as 135.58/139.32-1=-2.68%≈\n2.7%.\nB. Correct because sometimes it is necessary to invert one of the quotes in order to get the\nintermediary currency to cancel out in the equation to get the cross-rate. For example, to get a\nCanada-yen (JPY/CAD) quote, one is typically using the dollar-Canada (CAD/USD) rate and dollar-yen\n(JPY/USD) rate, which are the market conventions. Hence, to get a Canada-yen (JPY/CAD) quote, we\nmust first invert the dollar-Canada (CAD/USD) quote before multiplying by the dollar-yen (JPY/USD)\nquote\nThe beginning of period JPY/CAD exchange rate is therefore = 1/1.3216 x 105 42 = 0.75666 x 105.42 =\n79.77\nThe end of period JPY/CAD exchange rate is therefore = 1/1.2944 x 104.74 0.77256 × 104.74 = 80.92\nThe percentage change in the JPY/CAD exchange rate over the period is therefore = 80.92/79.77-\n1=1.44% ≈1.4%.\nC. Incorrect because the beginning and end of period JPY/USD exchange rates have been reversed\nchronologically as follows: Beginning of period JPY/CAD rate = 1/1.3216 x 104.74 = 0.75666 x 104.74\n= 79.25\nEnd of period JPY/CAD exchange rate = 1/1.2944 x 105.42 0.77256 x 105.42 = 81.44\nTherefore the percentage change in JPY/CAD was calculated incorrectly as 81.44/79.25-1=2.76%\n≈2.8%.\nEconomics: calculate and interpret currency cross-rates", "qhtml": null}, {"n": 41, "q": "An analyst gathers the following information about spot rates:\n● USD/GBP 1.2604\n● USD/EUR 1.1786\nUSD/GBP is the amount of USD per 1 GBP.\nUSD/EUR is the amount of USD per 1 EUR.\nThe spot EUR/GBP cross rate is closest to:", "opts": ["0.9351.", "1.0694.", "1.4855."], "ans": "B", "expl": "A. Incorrect because sometimes it is necessary to invert one of the quotes in order to get the\nintermediary currency to cancel out in the equation to get the cross-rate. The formula for the\nEUR/GBP cross rate is USD/GBP x USD/EUR)-1= USD/GBP x EUR/USD. This answer inverts the wrong\nexchange rate and reverses the formula to 1.1786/1.2604 ≈0.9351. This answer would be the\nGBP/EUR cross rate, not the EUR/GBP cross rate.\nB. Correct because sometimes it is necessary to invert one of the quotes in order to get the\nintermediary currency to cancel out in the equation to get the cross-rate. For example, to get a\nCanada-yen (JPY/CAD) quote, one is typically using the dollar-Canada (CAD/USD) rate and dollar-yen\n(JPY/USD) rate, which are the market conventions. This Canada-yen calculation requires that the\ndollar-Canada rate (CAD/USD) be inverted to a USD/CAD quote for the calculations to work. The\nformula for the EUR/GBP cross rate is USD/GBP x (USD/EUR)-1 = USD/GBP x EUR/USD =\n1.2604/1.1786≈1.0694.\nC. Incorrect because sometimes it is necessary to invert one of the quotes in order to get the\nintermediary currency to cancel out in the equation to get the cross-rate. This answer does not invert\nthe quotes but rather multiplies the two spot rates. 1.2604 x 1.1786≈1.4855.\nEconomics: calculate and interpret currency cross-rates", "qhtml": null}, {"n": 42, "q": "A perfectly competitive market structure:", "opts": ["is not possible in reality.", "causes all industries to ultimately fail due to lack of profits.", "drives company profits to the investors' required rate of return."], "ans": "C", "expl": "A. Incorrect because unlike some economic concepts, perfect competition is not merely an ideal\nbased on assumptions. Perfect competition is a reality.\nB. Incorrect because perfect competition does not mean that all perfectly competitive industries are\ndoomed to extinction by a lack of profits. On the contrary, millions of businesses that do very well\nare living under the pressures of perfect competition.\nC. Correct because profits under the conditions of perfect competition are driven to the required\nrate of return paid by the entrepreneur to borrow capital from investors (so-called normal profit or\nrental cost of capital).\nEconomics: describe characteristics of perfect competition, monopolistic competition, oligopoly, and\npure monopoly", "qhtml": null}, {"n": 43, "q": "In contrast to real exchange rates, nominal foreign exchange rates:", "opts": ["tend to deviate from purchasing power parity.", "represent the relative price levels in the domestic and foreign countries.", "are indexes useful for understanding international trade and capital flows."], "ans": "A", "expl": "A. Correct because nominal exchange rates exhibit persistent deviations from PPP.\nB. Incorrect because relative price levels are represented by the real exchange rate. The real\nexchange rate is an index that adjusts the nominal exchange rate for each country's price level.\nCreating these indexes requires adjusting the nominal exchange rate by using the price levels in each\ncountry of the currency pair (hence the name \"real exchange rates\") in order to compare the relative\npurchasing power between countries. An equivalent way of viewing the real exchange rate is that it\nrepresents the relative price levels in the domestic and foreign countries.\nC. Incorrect because nominal exchange rates are not indexes. The real exchange rate represents\nindexes created by analysts to understand the international competitiveness of an economy and the\nreal purchasing power of a currency. In this context, real exchange rates can be useful for\nunderstanding trends in international trade and capital flows and hence can be seen as one of the\ninfluences on nominal spot exchange rates\nEconomics: describe the foreign exchange market, including its functions and participants,\ndistinguish between nominal and real exchange rates, and calculate and interpret the percentage\nchange in a currency relative to another currency", "qhtml": null}, {"n": 44, "q": "An argument against free trade is that:", "opts": ["it has the potential to lead to greater income inequality.", "it increases average production costs in goods and services.", "it discourages foreign research and development in an economy."], "ans": "A", "expl": "A. Correct because opponents of free trade point to the potential for greater income inequality and\nthe loss of jobs in developed countries as a result of import competition.\nB. Incorrect because firms benefit from greater economies of scale... Hence, scale economies allow\nfirms to benefit from the larger market size and experience lower average cost of production as a\nresult of trade.\nC. Incorrect because trade can lead to increased exchange of ideas, freer flow of technical expertise,\nand greater awareness of changing consumer tastes and preferences in global markets. It can also\ncontribute to the higher quality and more effective institutions and policies that encourage domestic\ninnovation. For example, Coe and Helpman (1995) show that foreign research and development\n(R&D) has beneficial effects on domestic productivity. These effects become stronger the more open\nan economy is to foreign trade.\nEconomics: describe the benefits and costs of international trade", "qhtml": null}, {"n": 45, "q": "An analyst gathers the following information:\n● Foreign inflation rate 2%\n● Domestic inflation rate 3%\n● Nominal appreciation of domestic currency against foreign currency 6%\nThe real appreciation of the domestic currency against the foreign currency is closest to:", "opts": ["4%.", "5%.", "7%."], "ans": "B", "expl": "A. Incorrect because it does not add 1 to the inflation rates and the nominal appreciation rate in the\nformula, and calculates the change of the real exchange rate as (6%)x(2% /(3%)=4%.\nB. Correct because the change in the real exchange rate is\n(1 +ΔS /S ) × (1+ ΔS/S) / (1 + ΔP /P -1 = (1 +6%) × (1+2%)/(1+3%) - 1 = 1.06 x 1.02/1.03 -1=\nd/f d/f f f d d\n0.0497 ≈0.05 = 5%, where ASd/Sa is the change of the nominal exchange rate, ΔP/P is the foreign\nf f\ninflation rate, and APP, is the domestic inflation rate.\nUsing the appropriate approximate formula, 6.0% +2.0% -3.0%-5% leads to the same answer choice.\nC. Incorrect because it interchanges domestic and foreign inflation rates in the formula, and\ncalculates the change of real exchange rate as (1+6%) x (1+3%) / (1+2%) -11.06 x 1.03/1.02-10.0704\n≈0.07 = 7%.\nEconomics: describe the foreign exchange market, including its functions and participants,\ndistinguish between nominal and real exchange rates, and calculate and interpret the percentage\nchange in a currency relative to another currency", "qhtml": null}, {"n": 46, "q": "Price levels increase by 2% in the US and by 6% in the Eurozone. If the nominal spot\nexchange rate of the USD/EUR (amount of US dollars per 1 euro) decreases by 4%, the\nabsolute change in the real exchange rate is closest to:", "opts": ["0%.", "4%.", "8%."], "ans": "A", "expl": "A. Correct because the change in the real exchange rate is\n(1+ ΔS /S x (1+ΔP/Pf)/(1+ ΔP /P )-1\nd/f d/f) f d d\n(1-4%) x (1+6%)/(1+2%)-1 ≈ 0%\nThus, the change in the real exchange rate is approximately zero percent. The rough calculation is: -\n4% +6% - 2% = 0%.\nB. Incorrect because the price increase in the U.S. is assumed to be additive; -4% +6%+2% = 4%.\nC. Incorrect because the change in the nominal exchange rate is misinterpreted, 4% + 6% - 2% = 8%.\nEconomics: describe the foreign exchange market, including its functions and participants,\ndistinguish between nominal and real exchange rates, and calculate and interpret the percentage\nchange in a currency relative to another currency", "qhtml": null}, {"n": 47, "q": "Which of the following market
