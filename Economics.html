ớng trong thương mại quốc tế và dòng vốn và do đó có thể được coi là một trong những\nảnh hưởng đến tỷ giá hối đoái danh nghĩa giao ngay\nKinh tế học: mô tả thị trường ngoại hối, bao gồm các chức năng và thành phần tham gia,\nphân biệt giữa tỷ giá hối đoái danh nghĩa và tỷ giá hối đoái thực, đồng thời tính toán và diễn giải tỷ lệ phần trăm\nthay đổi bằng một loại tiền tệ so với một loại tiền tệ khác","qhtml":null},{"n":44,"q":"An argument against free trade is that:","opts":["it has the potential to lead to greater income inequality.","it increases average production costs in goods and services.","it discourages foreign research and development in an economy."],"ans":"A","expl":"A. Đúng vì những người phản đối thương mại tự do chỉ ra nguy cơ bất bình đẳng thu nhập lớn hơn và\nmất việc làm ở các nước phát triển do cạnh tranh nhập khẩu.\nB. Không chính xác vì các công ty được hưởng lợi từ tính kinh tế theo quy mô lớn hơn... Do đó, tính kinh tế theo quy mô cho phép\ncác công ty được hưởng lợi từ quy mô thị trường lớn hơn và có chi phí sản xuất trung bình thấp hơn do\nkết quả của thương mại.\nC. Không chính xác vì thương mại có thể dẫn đến tăng cường trao đổi ý tưởng, luồng chuyên môn kỹ thuật tự do hơn,\nvà nhận thức rõ hơn về việc thay đổi thị hiếu và sở thích của người tiêu dùng trên thị trường toàn cầu. Nó cũng có thể\nđóng góp vào các thể chế và chính sách có chất lượng cao hơn và hiệu quả hơn nhằm khuyến khích sự đổi mới\ntrong nước. Ví dụ, Coe và Helpman (1995) cho thấy nghiên cứu và phát triển nước ngoài\n(R&D) có tác động có lợi đến năng suất trong nước. Những tác động này trở nên mạnh mẽ hơn khi nền kinh tế\ncởi mở hơn với ngoại thương.\nKinh tế: mô tả lợi ích và chi phí của thương mại quốc tế","qhtml":null},{"n":45,"q":"An analyst gathers the following information:\n● Foreign inflation rate 2%\n● Domestic inflation rate 3%\n● Nominal appreciation of domestic currency against foreign currency 6%\nThe real appreciation of the domestic currency against the foreign currency is closest to:","opts":["4%.","5%.","7%."],"ans":"B","expl":"A. Không chính xác vì nó không thêm 1 vào tỷ lệ lạm phát và tỷ lệ tăng giá danh nghĩa trong công thức\nvà tính toán sự thay đổi của tỷ giá hối đoái thực là (6%)x(2% /(3%)=4%.\nB. Đúng vì thay đổi trong tỷ giá hối đoái thực là\n(1 +ΔS /S ) × (1+ ΔS/S) / (1 + ΔP /P -1 = (1 +6%) × (1+2%)/(1+3%) - 1 = 1,06 x 1,02/1,03 -1=\nd/f d/f f f d d\n0,0497 ≈0,05 = 5%, trong đó ASd/Sa là thay đổi của tỷ giá hối đoái danh nghĩa, ΔP/P là tỷ giá hối đoái danh nghĩa\nf f\ntỷ lệ lạm phát và APP, là tỷ lệ lạm phát trong nước.\nSử dụng công thức gần đúng thích hợp, 6,0% +2,0% -3,0%-5% dẫn đến cùng một lựa chọn trả lời.\nC. Không chính xác vì nó hoán đổi tỷ lệ lạm phát trong nước và nước ngoài trong công thức và\ntính toán sự thay đổi của tỷ giá hối đoái thực như (1+6%) x (1+3%) / (1+2%) -11,06 x 1,03/1,02-10,0704\n≈0,07 = 7%.\nKinh tế học: mô tả thị trường ngoại hối, bao gồm các chức năng và thành phần tham gia,\nphân biệt giữa tỷ giá hối đoái danh nghĩa và tỷ giá hối đoái thực, đồng thời tính toán và diễn giải tỷ lệ phần trăm\nsự thay đổi của một loại tiền tệ so với một loại tiền tệ khác","qhtml":null},{"n":46,"q":"Price levels increase by 2% in the US and by 6% in the Eurozone. If the nominal spot\nexchange rate of the USD/EUR (amount of US dollars per 1 euro) decreases by 4%, the\nabsolute change in the real exchange rate is closest to:","opts":["0%.","4%.","8%."],"ans":"A","expl":"A. Đúng vì thay đổi trong tỷ giá hối đoái thực là\n(1+ ΔS /S x (1+ΔP/Pf)/(1+ ΔP /P )-1\nd/f d/f) f d d\n(1-4%) x (1+6%)/(1+2%)-1 ≈ 0%\nDo đó, thay đổi trong tỷ giá hối đoái thực tế là khoảng 0 phần trăm. Tính toán sơ bộ là: -\n4% +6% - 2% = 0%.\nB. Không chính xác vì mức tăng giá ở Hoa Kỳ được coi là cộng dồn; -4% +6%+2% = 4%.\nC. Không chính xác vì sự thay đổi trong tỷ giá hối đoái danh nghĩa bị hiểu sai, 4% + 6% - 2% = 8%.\nEconomics: mô tả thị trường ngoại hối, bao gồm các chức năng và thành phần tham gia của nó,\nphân biệt giữa tỷ giá hối đoái danh nghĩa và thực tế, đồng thời tính toán và giải thích tỷ lệ phần trăm\nthay đổi của một loại tiền tệ so với một loại tiền tệ khác","qhtml":null},{"n":47,"q":"Which of the following market structures has high barriers to entry?","opts":["An oligopoly","Perfect competition","Monopolistic competition"],"ans":"A","expl":"A. Đúng vì đặc điểm của thị trường độc quyền bao gồm: việc gia nhập thị trường rất khó khăn,\nvới chi phí khá cao và các rào cản cạnh tranh đáng kể.\nB. Không chính xác vì cạnh tranh hoàn hảo. có rào cản gia nhập rất thấp.\nC. Không chính xác vì cạnh tranh độc quyền có rào cản gia nhập thấp.\nKinh tế: Xác định loại cấu trúc thị trường trong đó một công ty hoạt động và mô tả việc sử dụng\nvà những hạn chế của các biện pháp tập trung","qhtml":null},{"n":48,"q":"With respect to trading blocs, a common market most likely incorporates all aspects of\na(n):","opts":["customs union.","monetary union.","economic union."],"ans":"A","expl":"A. Đúng vì thị trường chung là cấp độ hội nhập kinh tế tiếp theo kết hợp\ntất cả các khía cạnh của liên minh hải quan và mở rộng nó bằng cách cho phép di chuyển tự do các yếu tố sản xuất\ngiữa các thành viên.\nB. Không chính xác vì thị trường chung là liên minh hải quan cộng với sự di chuyển tự do của các yếu tố sản xuất\ngiữa các thành viên. Một liên minh kinh tế cộng với một đồng tiền chung là một liên minh tiền tệ.\nlà, nếu các thành viên của liên minh kinh tế quyết định sử dụng một loại tiền tệ chung, thì đó cũng là một liên minh tiền tệ.\nC. Không chính xác vì thị trường chung là liên minh hải quan cộng với sự di chuyển tự do của các yếu tố sản xuất\ngiữa các thành viên. Các thể chế kinh tế chung và sự phối hợp các chính sách kinh tế\ngiữa các thành viên là những đặc điểm của một liên minh kinh tế. phối hợp các chính sách kinh tế giữa các thành viên.\nKinh tế: giải thích động lực và lợi thế của các khối thương mại, thị trường chung và kinh tế\ncông đoàn","qhtml":null},{"n":49,"q":"All else being equal, in an efficient market a forward exchange rate will decrease as a\nresult of an increase in the:","opts":["spot exchange rate.","foreign risk-free interest rate.","domestic risk-free interest rate."],"ans":"C","expl":"A. Không chính xác vì tỷ giá hối đoái kỳ hạn sẽ tăng chứ không phải giảm do\ntăng tỷ giá hối đoái giao ngay.\nB. Không chính xác vì tỷ giá hối đoái kỳ hạn sẽ tăng, thay vì giảm, do\ntăng lãi suất phi rủi ro nước ngoài.\nC. Đúng vì phương trình chênh lệch giá có thể được sắp xếp lại theo nhu cầu. Ví dụ, để có được\ncông thức cho tỷ giá kỳ hạn, phương trình trên có thể được phát biểu lại thành: F = S x [(1+i)/(1+i )]\nt/d t/d t d\ntrong đó F là tỷ giá hối đoái kỳ hạn, S là tỷ giá hối đoái giao ngay, i là tỷ giá hối đoái phi rủi ro nước ngoài\nt/d t/d f\nlãi suất và i là lãi suất phi rủi ro trong nước. Do đó, tỷ giá hối đoái kỳ hạn sẽ\nd\ngiảm do lãi suất phi rủi ro trong nước tăng lên.\nKinh tế học: giải thích mối quan hệ chênh lệch giá giữa tỷ giá hối đoái giao ngay và kỳ hạn với lãi suất\n, tính toán tỷ giá kỳ hạn bằng cách sử dụng điểm hoặc theo tỷ lệ phần trăm và diễn giải chiết khấu kỳ hạn\nhoặc phí bảo hiểm","qhtml":null},{"n":50,"q":"Which of the following indicators suggest(s) a monopoly market?","opts":["A concentration ratio of 100% only","A Herfindahl-Hirschman index of zero only","Both a concentration ratio of 100% and a Herfindahl-Hirschman index of zero"],"ans":"A","expl":"A. Đúng vì tỷ lệ tập trung là tổng thị phần của N công ty lớn nhất.\nCon số này luôn nằm trong khoảng từ 0 (cạnh tranh hoàn hảo) đến 100 phần trăm (độc quyền).\nB. Không chính xác vì O.C. Herfindahl và A.O. Hirschman đề xuất một chỉ số trong đó thị phần\ncủa N công ty hàng đầu được bình phương trước rồi mới cộng vào. Nếu một công ty kiểm soát toàn bộ thị trường\n(độc quyền), thì chỉ số Herfindahl-\nHirschman (HHI) bằng 1.\nC. Không chính xác vì O.C. Herfindahl và A.O. Hirschman đề xuất một chỉ số trong đó thị phần\ncủa N công ty hàng đầu được bình phương trước rồi mới cộng vào. Nếu một công ty kiểm soát toàn bộ\nthị trường (độc quyền), thì chỉ số Herfindahl-\nHirschman (HHI) bằng 1.\nKinh tế: xác định loại cấu trúc thị trường mà một công ty hoạt động và mô tả việc sử dụng\nvà những hạn chế của các biện pháp tập trung","qhtml":null},{"n":51,"q":"When a country that is a price taker imposes a tariff on an imported good:","opts":["national welfare increases.","consumers gain consumer surplus.","local producers gain producer surplus."],"ans":"C","expl":"A. Không chính xác vì một quốc gia nhỏ là quốc gia định giá một sản phẩm trên thị trường thế giới và\nkhông thể ảnh hưởng đến giá thị trường thế giới. Hiệu ứng phúc lợi có thể được tóm tắt như sau:\nNgười tiêu dùng bị mất thặng dư tiêu dùng, nhà sản xuất địa phương đạt được thặng dư nhà sản xuất và hiệu ứng phúc lợi ròng\ndẫn đến tổn thất vô ích đối với phúc lợi của đất nước.\nB. Không chính xác vì tác động kinh tế của thuế quan đối với hàng nhập khẩu ở một quốc gia nhỏ là tác động\nngười định giá một sản phẩm trên thị trường thế giới và không thể ảnh hưởng đến giá thị trường thế giới. Hiệu ứng phúc lợi\ncó thể được tóm tắt như sau: Người tiêu dùng bị mất thặng dư tiêu dùng,\nnhà sản xuất địa phương có được thặng dư nhà sản xuất và hiệu ứng phúc lợi ròng dẫn đến tổn thất vô ích đối với\nphúc lợi của đất nước.\nC. Đúng vì tác động kinh tế của thuế quan đối với hàng nhập khẩu ở một quốc gia nhỏ là tác động của thuế quan đối với một sản phẩm trên thị trường thế giới và không thể ảnh hưởng đến giá thị trường thế giới. Hiệu ứng phúc lợi\ncó thể được tóm tắt như sau: Người tiêu dùng bị mất thặng dư tiêu dùng, nhà sản xuất địa phương\ncó được thặng dư nhà sản xuất và hiệu ứng phúc lợi ròng dẫn đến tổn thất vô ích đối với phúc lợi của đất nước.\nKinh tế: so sánh các loại hạn chế thương mại, chẳng hạn như thuế quan, hạn ngạch và trợ cấp xuất khẩu cũng như\ný nghĩa kinh tế của chúng","qhtml":null},{"n":52,"q":"An ideal international currency regime would most likely have:","opts":["currencies that are fully convertible.","floating exchange rates between currencies.","a common monetary policy across different countries."],"ans":"A","expl":"A. Đúng vì chế độ tiền tệ lý tưởng sẽ có ba đặc tính. Một trong những đặc tính đó\nlà tất cả các loại tiền tệ sẽ có thể chuyển đổi hoàn toàn (tức là các loại tiền tệ có thể được trao đổi tự do cho bất kỳ mục đích nào\nvà với bất kỳ số lượng nào). Điều kiện này đảm bảo dòng vốn không bị hạn chế.\nB. Không chính xác vì chế độ tiền tệ lý tưởng sẽ có ba đặc tính. Một trong những thuộc tính đó\ntuyên bố tỷ giá hối đoái giữa hai loại tiền tệ bất kỳ sẽ được cố định một cách đáng tin cậy, không thả nổi.\nC. Không chính xác vì chế độ tiền tệ lý tưởng sẽ có ba đặc tính. Một trong những đặc tính đó\ntuyên bố rằng mỗi quốc gia sẽ có thể thực hiện chính sách tiền tệ hoàn toàn độc lập [không phổ biến] để theo đuổi các mục tiêu trong nước, chẳng hạn như mục tiêu tăng trưởng và lạm phát.\nKinh tế: mô tả chế độ tỷ giá hối đoái và giải thích tác động của tỷ giá hối đoái đối với\nthương mại quốc tế và dòng vốn","qhtml":null},{"n":53,"q":"In the short run, a firm most likely shuts down production when:","opts":["economic profit is zero.","sunk costs are greater than total revenue.","total revenue is less than total variable cost."],"ans":"C","expl":"A. Không chính xác vì về lâu dài, nếu một công ty không thể kiếm được ít nhất lợi nhuận kinh tế bằng 0, thì công ty đó sẽ không\nhoạt động vì nó không trang trải được chi phí cơ hội của tất cả các yếu tố sản xuất, lao động và\nvốn. Tuy nhiên, trong ngắn hạn, một công ty có thể thấy thuận lợi khi tiếp tục hoạt động ngay cả khi nó\nkhông kiếm được ít nhất lợi nhuận kinh tế bằng 0. Các công ty sẽ duy trì hoạt động kinh doanh (ngắn hạn và dài hạn) nếu họ\nkhông tạo ra lợi nhuận.\nB. Không chính xác vì không thể tránh được chi phí chìm, bất kể doanh nghiệp có làm gì đi chăng nữa. Chi phí chìm phải được\nbỏ qua trong quyết định tiếp tục hoạt động trong ngắn hạn. Miễn là doanh thu của công ty đủ bù đắp\nít nhất là chi phí biến đổi, tốt hơn hết là công ty nên tiếp tục hoạt động.\nC. Đúng vì công ty phải trang trải chi phí biến đổi để duy trì hoạt động kinh doanh trong ngắn hạn; nếu TR\nkhông thể đảm bảo TVC, công ty sẽ ngừng sản xuất để giảm thiểu tổn thất. Khoản lỗ sẽ bằng\nsố chi phí cố định.\nKinh tế học: xác định và diễn giải các điểm hòa vốn và điểm dừng sản xuất, cũng như\ntính kinh tế và phi kinh tế theo quy mô ảnh hưởng đến chi phí trong điều kiện cạnh tranh hoàn hảo và không hoàn hảo","qhtml":null},{"n":54,"q":"If the spot USD/EUR exchange rate (the amount of USD per one EUR) is 1.1605 and the\none-year forward rate is 1.17240, the forward points are:","opts":["+101.5.","+102.5.","+119.0."],"ans":"C","expl":"A. Không chính xác vì việc tính toán (1-(1.1605/1.17240)) x 10.000 ≈101.5 không sử dụng công thức\nchính xác của (1.1724 - 1.1605) x 10.000 = 119.0.\nB. Không chính xác vì tính toán (1.17240/1.1605-1) x 10.000 ≈102.5 không sử dụng công thức đúng\ncủa (1.17240 -1.1605 ) x 10.000 = 119.0.\nC. Đúng vì tỷ giá kỳ hạn được tính là (1.17240-1.1605) x 10.000 = 119.0.\nKinh tế học: giải thích mối quan hệ chênh lệch giá giữa tỷ giá hối đoái giao ngay và kỳ hạn với lãi suất\n, tính tỷ giá kỳ hạn bằng cách sử dụng điểm hoặc theo tỷ lệ phần trăm và diễn giải chiết khấu kỳ hạn\nhoặc phí bảo hiểm","qhtml":null},{"n":55,"q":"Under which of the following market structures are pricing strategies most likely\ninfluenced by the expected reaction of other firms?","opts":["Oligopoly","Perfect competition","Monopolistic competition"],"ans":"A","expl":"A. Đúng vì cấu trúc thị trường độc quyền dựa trên một số lượng tương đối nhỏ các công ty\ncung cấp cho thị trường. Số lượng nhỏ các công ty trên thị trường có nghĩa là mỗi công ty phải xem xét\nchiến lược trả đũa mà các công ty khác sẽ theo đuổi khi giá cả và mức sản xuất thay đổi.\nHãy xem xét hành vi định giá của các công ty hàng không thương mại. Chiến lược định giá và lập kế hoạch tuyến đường\ndựa trên phản ứng dự kiến ​​của các hãng vận chuyển khác tại các thị trường tương tự.\nB. Không chính xác vì có nhiều người bán trong loại cấu trúc thị trường này và các công ty hoạt động trong cấu trúc thị trường a\nhoặc cạnh tranh hoàn hảo là những người chấp nhận giá.\nC. Không chính xác vì có nhiều người bán và trong trường hợp cạnh tranh độc quyền, sự thành công\ncủa sự khác biệt hóa sản phẩm quyết định mức độ mà công ty có thể tác động đến giá cả.\nKinh tế: mô tả các đặc điểm của cạnh tranh hoàn hảo, cạnh tranh độc quyền, độc quyền nhóm và\nđộc quyền thuần túy","qhtml":null},{"n":56,"q":"The neutral policy rate is equal to:","opts":["long-run expected inflation.","the real trend rate of growth of the underlying economy.","long-run expected inflation plus the real trend rate of growth of the underlying economy."],"ans":"C","expl":"A. Không chính xác vì lãi suất chính sách trung lập đối với bất kỳ nền kinh tế nào đều bao gồm hai thành phần: Xu hướng thực\ntốc độ tăng trưởng của nền kinh tế cơ bản và lạm phát dự kiến ​​trong dài hạn. Cũng lưu ý Tỷ lệ trung lập =\nXu hướng tăng trưởng + Mục tiêu lạm phát.\nB. Không chính xác vì lãi suất chính sách trung lập đối với bất kỳ nền kinh tế nào đều bao gồm hai thành phần: Xu hướng thực\ntốc độ tăng trưởng của nền kinh tế cơ bản và lạm phát dự kiến ​​trong dài hạn. Cũng lưu ý Tỷ lệ trung lập =\nXu hướng tăng trưởng + Mục tiêu lạm phát.\nC. Đúng vì tỷ lệ chính sách trung lập cho bất kỳ nền kinh tế nào đều bao gồm hai thành phần: Tốc độ tăng trưởng theo xu hướng thực của\nnền kinh tế cơ bản và lạm phát dự kiến ​​trong dài hạn. Cũng lưu ý Tỷ lệ trung lập = Xu hướng tăng trưởng +\nMục tiêu lạm phát.\nKinh tế: mô tả phẩm chất của các ngân hàng trung ương hiệu quả, đối chiếu việc họ sử dụng lạm phát, lãi suất,\nvà nhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nnhững hạn chế của chính sách tiền tệ","qhtml":null},{"n":57,"q":"In long-run equilibrium, the perfectly competitive firm's supply curve is best represented\nby the firm's long-run:","opts":["marginal cost schedule.","average revenue schedule.","marginal revenue schedule."],"ans":"A","expl":"A. Đúng vì đường chi phí cận biên dài hạn là đường cung\ncủa hãng cạnh tranh hoàn hảo. Đường cầu của doanh nghiệp được quyết định bởi giá cân bằng của thị trường tổng hợp. Quy tắc cơ bản\nđể tối đa hóa lợi nhuận là MR = MC, giống như trường hợp cân bằng dài hạn.\nB. Không chính xác vì đường nằm ngang thể hiện đường cầu của công ty là biểu đồ AR\n[doanh thu trung bình] của công ty.\nC. Không chính xác vì trong cấu trúc thị trường cạnh tranh hoàn hảo, đường cầu của công ty\ngiống với doanh thu cận biên và doanh thu trung bình của công ty. Với chi phí hoạt động, quyết định\nduy nhất mà công ty cạnh tranh hoàn hảo phải đối mặt là sản xuất bao nhiêu. Câu trả lời là mức đầu ra\ncó thể tối đa hóa lợi nhuận của nó và mức đó là nơi MR = MC. Đường cầu hoàn toàn\nco giãn. Tất nhiên, công ty không ngừng cố gắng tìm cách giảm chi phí về lâu dài.\nKinh tế: giải thích mối quan hệ cung cầu trong cạnh tranh độc quyền, bao gồm\ngiá và sản lượng tối ưu cho các công ty cũng như chiến lược định giá","qhtml":null},{"n":58,"q":"Which of the following is most likely an objective of fiscal policy?","opts":["Maintaining price stability","Affecting aggregate demand","Achieving an exchange rate target"],"ans":"B","expl":"A. Không chính xác vì đảm bảo ổn định giá cả là mục tiêu của chính sách tiền tệ chứ không phải chính sách tài khóa. Có\nlà một mục tiêu bao trùm [của ngân hàng trung ương] mà dường như hầu hết mọi người đều thừa nhận một cách rõ ràng và đó\nlà mục tiêu duy trì sự ổn định về giá.\nB. Đúng vì các công cụ liên quan đến chính sách tài khóa liên quan đến việc sử dụng chi tiêu của chính phủ\nvà thay đổi doanh thu thuế để ảnh hưởng đến một số khía cạnh của nền kinh tế: bao gồm mức tổng hợp\ntổng cầu trong một nền kinh tế và do đó là mức độ hoạt động kinh tế.\nC. Không chính xác vì nhắm mục tiêu tỷ giá hối đoái là một phần của chính sách tiền tệ chứ không phải chính sách tài chính. Nhiều nền kinh tế\nđang phát triển chọn thực hiện chính sách tiền tệ bằng cách nhắm mục tiêu tỷ giá hối đoái của đồng tiền của họ, thay vì\nhơn là mức lạm phát trong nước rõ ràng.\nKinh tế: mô tả vai trò và mục tiêu của chính sách tài khóa cũng như các lập luận về việc liệu quy mô\ncủa nợ quốc gia có liên quan đến vấn đề GDP hay không","qhtml":null},{"n":59,"q":"Which of the following is most likely to limit the effectiveness of monetary policy?","opts":["A liquidity trap","The crowding out effect","A time lag to implement government spending"],"ans":"A","expl":"A. Đúng vì có thể có những lúc nhu cầu về tiền trở nên co giãn vô hạn\nnên việc bơm thêm tiền vào nền kinh tế sẽ không làm giảm lãi suất hơn nữa hoặc\nảnh hưởng đến hoạt động thực tế. Điều này được gọi là bẫy thanh khoản. Trong hoàn cảnh cực đoan này, chính sách tiền tệ\ncó thể trở nên hoàn toàn không hiệu quả.\nB. Không chính xác vì lấn át là sự giảm đầu tư của khu vực tư nhân do chính phủ\nvay mượn nhiều hơn và mô tả khó khăn trong việc thực hiện chính sách tài chính chứ không phải tiền tệ.\nC. Không chính xác vì đây là độ trễ hành động và mô tả khó khăn trong việc thực hiện chính sách tài khóa. Một\nví dụ về độ trễ hành động là quyết định của chính phủ tăng chi tiêu cho các dự án vốn nhằm\ntăng việc làm và thu nhập, nhưng có thể mất nhiều tháng để thực hiện.\nKinh tế: mô tả phẩm chất của các ngân hàng trung ương hiệu quả; đối chiếu việc họ sử dụng lạm phát, lãi suất\nvà nhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp, đồng thời mô tả\nnhững hạn chế của chính sách tiền tệ","qhtml":null},{"n":60,"q":"Which of the following is a limitation of monetary policy?","opts":["The presence of automatic stabilizers in the economy","The ineffectiveness of interest rate adjustments in deflationary environments","The uneven distribution of income and wealth among different segments of the population"],"ans":"B","expl":"A. Không chính xác vì đây không phải là hạn chế của chính sách tiền tệ. Bộ ổn định tự động [là các tính năng\ngiúp giảm biến động sản lượng trong nền kinh tế và tác động đến chính sách tài khóa.\nB. Đúng vì đây là hạn chế của chính sách tiền tệ. Những hạn chế của chính sách tiền tệ bao gồm\ncác vấn đề trong cơ chế truyền tải và sự kém hiệu quả tương đối của việc điều chỉnh lãi suất\nnhư một công cụ chính sách trong môi trường giảm phát.\nC. Không chính xác vì đây không phải là hạn chế của chính sách tiền tệ. Đây là một khía cạnh của nền kinh tế mà\ncác công cụ chính sách tài khóa cố gắng giải quyết. Những hạn chế của chính sách tiền tệ bao gồm các vấn đề trong cơ chế truyền tải\nvà sự kém hiệu quả tương đối của việc điều chỉnh lãi suất như một công cụ chính sách\ntrong môi trường giảm phát.\nKinh tế: mô tả phẩm chất của các ngân hàng trung ương hiệu quả, đối chiếu việc sử dụng lạm phát, lãi suất\nvà nhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nhạn chế của chính sách tiền tệ","qhtml":null},{"n":61,"q":"The main objective of the World Bank Group is to:","opts":["support exchange rate stability and an open system of international payments.","provide the legal and institutional foundation of the multinational trading system.","help developing countries fight poverty and enhance environmentally sound economic growth."],"ans":"C","expl":"A. Không chính xác vì điều này đề cập đến mục tiêu chính của Quỹ Tiền tệ Quốc tế. Nghĩa là,\nIMF hỗ trợ ổn định tỷ giá hối đoái và một hệ thống thanh toán quốc tế mở.\nB. Không chính xác vì điều này đề cập đến mục tiêu chính của Tổ chức Thương mại Thế giới. Nghĩa là, WTO\ncung cấp nền tảng pháp lý và thể chế của hệ thống thương mại đa quốc gia.\nC. Đúng vì mục tiêu chính của Ngân hàng Thế giới là giúp các nước đang phát triển chống lại đói nghèo và\ntăng cường tăng trưởng kinh tế thân thiện với môi trường.\nKinh tế: mô tả các chức năng và mục tiêu của các tổ chức quốc tế hỗ trợ thương mại,\nbao gồm Ngân hàng Thế giới, Quỹ Tiền tệ Quốc tế và Tổ chức Thương mại Thế giới","qhtml":null},{"n":62,"q":"Which of the following is an expansionary fiscal policy?","opts":["An increase in sales taxes","A decrease in interest rates","An increase in public spending on infrastructure"],"ans":"C","expl":"A. Không chính xác vì chính sách [tài chính] mở rộng có thể có một hoặc nhiều hình thức sau:...\nCắt giảm thuế bán hàng (gián tiếp) để hạ giá, làm tăng thu nhập thực tế với mục tiêu tăng\nnhu cầu của người tiêu dùng. Do đó, việc tăng thuế bán hàng sẽ mang tính thu hẹp chứ không phải mở rộng.\nB. Không chính xác vì khi nền kinh tế đang chậm lại và lạm phát cũng như xu hướng tiền tệ đang suy yếu,\nngân hàng trung ương có thể tăng tính thanh khoản bằng cách cắt giảm [lãi suất] mục tiêu của họ. Trong những trường hợp này,\nchính sách tiền tệ được cho là có tính mở rộng. Do đó, mặc dù mang tính mở rộng nhưng đây là một ví dụ về tiền tệ\nchứ không phải chính sách tài khóa.\nC. Đúng vì có một số cách mà chính sách tài khóa có thể ảnh hưởng đến tổng cầu...\nchính sách mở rộng có thể có một hoặc nhiều hình thức sau:... Chi tiêu công mới cho\nhàng hóa và cơ sở hạ tầng xã hội.\nKinh tế: giải thích việc thực hiện chính sách tài khóa và những khó khăn khi thực hiện cũng như\nliệu chính sách tài khóa là mở rộng hay thu hẹp","qhtml":null},{"n":63,"q":"If the spot rate for AUD/USD (amount of AUD per 1 USD) is 1.4780 and the 1-month\nforward points are -16.0, the 1-month forward rate for AUD/USD is closest to:","opts":["1.3180.","1.4764.","1.4796."],"ans":"B","expl":"A. Không chính xác vì để chuyển đổi bất kỳ điểm kỳ hạn nào trong số này thành tỷ giá kỳ hạn, người ta sẽ\nchia số điểm cho 10.000 (để giảm xuống chữ số thập phân thứ tư, vị trí thập phân cuối cùng\ntrong báo giá giao ngay) rồi thêm kết quả vào báo giá tỷ giá hối đoái giao ngay. Điểm kỳ hạn\nđã được chia không chính xác cho 100 và tỷ giá kỳ hạn được tính như sau -16/100+1.4780=-\n0.16+1.4780=1.3180.\nB. Đúng vì để chuyển đổi bất kỳ điểm kỳ hạn nào trong số này thành tỷ giá kỳ hạn, người ta sẽ\nchia số điểm cho 10.000 (để giảm xuống chữ số thập phân thứ tư, vị trí thập phân cuối cùng\ntrong báo giá giao ngay) rồi thêm kết quả vào báo giá tỷ giá hối đoái giao ngay. Điểm chuyển tiếp\nlà số âm và do đó tỷ lệ chuyển tiếp = - 16/10.000+ 1,4780=-0,0016+1,4780 =1,4764.\nC. Không chính xác vì để quy đổi bất kỳ điểm kỳ hạn nào trong số này thành tỷ giá kỳ hạn, người ta sẽ\nchia số điểm cho 10.000 (để giảm tỷ lệ xuống vị trí thập phân thứ tư, vị trí thập phân cuối cùng\ntrong báo giá trùng lặp) rồi thêm kết quả vào báo giá tỷ giá hối đoái giao ngay. Trong trường hợp này,\nđiểm chuyển tiếp được coi là số dương như sau: 16/10.000+ 1,4780 = 0,0016 +\n1,4780 = 1,4796.\nKinh tế học: giải thích mối quan hệ chênh lệch giữa tỷ giá hối đoái giao ngay và kỳ hạn cũng như lãi suất\n, hãy tính a tỷ giá kỳ hạn sử dụng điểm hoặc theo tỷ lệ phần trăm và diễn giải chiết khấu kỳ hạn\nhoặc phí bảo hiểm","qhtml":null},{"n":64,"q":"When a central bank sells government bonds to commercial banks, broad money growth:","opts":["decreases.","remains the same.","increases."],"ans":"A","expl":"A. Đúng vì khi ngân hàng trung ương bán trái phiếu chính phủ cho ngân hàng thương mại, dự trữ\ncủa các ngân hàng thương mại giảm, làm giảm khả năng cho vay (1.e., tạo tín dụng) cho\ncác hộ gia đình và tập đoàn và do đó khiến tăng trưởng tiền tệ trên diện rộng giảm thông qua cơ chế số nhân tiền\n.\nB. Không chính xác vì khi ngân hàng trung ương bán trái phiếu chính phủ cho một ngân hàng thương mại, dự trữ\ncủa các ngân hàng thương mại giảm, làm giảm khả năng cho vay (tức là tạo tín dụng) đối với các hộ gia đình\nvà các tập đoàn và do đó khiến tăng trưởng tiền nói chung giảm thông qua cơ chế số nhân tiền\n.\nC. Không chính xác vì khi ngân hàng trung ương bán trái phiếu chính phủ cho ngân hàng thương mại, dự trữ\ncủa các ngân hàng thương mại giảm, làm giảm khả năng cho vay (tức là tạo tín dụng) đối với các hộ gia đình\nvà các tập đoàn và do đó khiến tăng trưởng tiền tệ giảm thông qua cơ chế nhân tiền\n.\nKinh tế: mô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế, lạm phát,\nlãi suất và tỷ giá hối đoái","qhtml":null},{"n":65,"q":"When a country has a fiscal surplus and an excess of private saving over investment, its\nexports are:","opts":["less than its imports.","equal to its imports.","greater than its imports."],"ans":"C","expl":"A. Không chính xác vì khi một quốc gia có thặng dư tài chính (T> G) và tiết kiệm tư nhân vượt quá\nđầu tư (S > I), xuất khẩu của quốc gia đó lớn hơn [không nhỏ hơn] nhập khẩu (X> M).\nB. Không chính xác vì khi một quốc gia có thặng dư tài chính (T> G) và tiết kiệm tư nhân vượt quá\nđầu tư (S> I), xuất khẩu của quốc gia đó lớn hơn [không nhỏ hơn] nhập khẩu (X> M).\nC. Đúng vì sử dụng đồng nhất thức cơ bản từ Kinh tế vĩ mô: mối quan hệ giữa\ncán cân thương mại và các quyết định chi tiêu/tiết kiệm có thể được biểu diễn dưới dạng: X-M = (S-I) + (T-G) trong đó X\nđại diện cho xuất khẩu, M là nhập khẩu, S là tiết kiệm tư nhân, I là đầu tư vào nhà máy và thiết bị, T là\nthuế sau khi chuyển nhượng và G là chi tiêu chính phủ. Từ mối quan hệ này, chúng ta có thể thấy rằng\nthặng dư thương mại (X> M) phải được phản ánh trong thặng dư tài chính (T> G), tiết kiệm tư nhân vượt quá\nđầu tư (S> I), hoặc cả hai\nChúng ta cũng có thể thấy rằng khi một quốc gia có thặng dư tài chính (T> G) và tiết kiệm tư nhân vượt quá\nđầu tư (S>I), xuất khẩu của nước đó lớn hơn nhập khẩu (X>M).\nKinh tế: mô tả các chế độ tỷ giá hối đoái và giải thích tác động của tỷ giá hối đoái đối với\ndòng vốn và thương mại quốc tế","qhtml":null},{"n":66,"q":"Which of the following behavioral archetypes best describes a country that is high on the\nglobalization spectrum but low on the cooperation spectrum?","opts":["Autarky","Hegemony","Bilateralism"],"ans":"B","expl":"A. Không chính xác vì có bốn kiểu hành vi của quốc gia: tự túc, bá quyền,\nchủ nghĩa đa phương và chủ nghĩa song phương, trong đó chế độ tự túc nằm ở vị trí thấp trên phạm vi hợp tác và thấp\n(không cao) trên phạm vi toàn cầu hóa. Autarky mô tả các quốc gia đang tìm kiếm sự tự chủ về chính trị\nvới rất ít hoặc không có thương mại hoặc tài chính bên ngoài. Các doanh nghiệp nhà nước kiểm soát các ngành công nghiệp chiến lược\ntrong nước\nB. Đúng vì sử dụng hai trục mà chúng ta đã thảo luận-hợp tác chính trị so với hợp tác phi-\nvà toàn cầu hóa so với chủ nghĩa dân tộc--Các nhà phân tích đầu tư có thể đánh giá các tác nhân địa chính trị\nvà khả năng đe dọa đến kết quả đầu tư Cụ thể, có bốn nguyên mẫu về hành vi quốc gia\n, tự cung tự cấp, bá quyền. chủ nghĩa đa phương và chủ nghĩa song phương, trong đó quyền bá chủ nằm ở vị trí thấp\ntrong phạm vi hợp tác và ở vị trí cao trên phạm vi toàn cầu hóa. Các quốc gia bá quyền có xu hướng trở thành\ncác nhà lãnh đạo khu vực hoặc thậm chí toàn cầu..và họ sử dụng ảnh hưởng chính trị của mình từ những người khác để kiểm soát\ntài nguyên Các doanh nghiệp nhà nước kiểm soát các thị trường xuất khẩu chính Ví dụ về các quốc gia bá quyền\nbao gồm Hoa Kỳ và Nga\nC. Không chính xác vì có bốn nguyên mẫu hành vi của quốc gia là tự cung tự cấp, bá quyền,\nchủ nghĩa đa phương và chủ nghĩa song phương, trong đó chủ nghĩa song phương ở mức cao trên phạm vi hợp tác (không phải\ntoàn cầu hóa) và ở mức thấp trên phạm vi toàn cầu hóa (không hợp tác). Chủ nghĩa song phương là\ntiến hành hợp tác chính trị, kinh tế, tài chính hoặc văn hóa giữa hai quốc gia. Các quốc gia\ntham gia vào chủ nghĩa song phương có thể có quan hệ với nhiều quốc gia khác nhau, nhưng đó là những thỏa thuận\nmột lần mà không có nhiều đối tác.\nKinh tế: mô tả địa chính trị từ góc độ hợp tác và cạnh tranh","qhtml":null},{"n":67,"q":"An analyst gathers the following data about an economy:\n● Real trend growth rate 0.5%\n● Central bank's policy rate 1.5%\nIf monetary policy is contractionary, the central bank's inflation target is:","opts":["less than 1.0%.","equal to 1.0%.","greater than 1.0%."],"ans":"A","expl":"A. Đúng vì khi lãi suất chính sách cao hơn lãi suất trung lập, chính sách tiền tệ sẽ bị thu hẹp\nkhi chúng ở dưới lãi suất trung lập, chính sách tiền tệ sẽ mở rộng. Việc tính toán tỷ lệ\ntrung lập như sau: Tỷ lệ trung lập Tăng trưởng theo xu hướng Mục tiêu lạm phát. Do đó, nếu chính sách tiền tệ\nco lại thì lãi suất chính sách (1,5%) phải lớn hơn lãi suất trung lập. Do đó, tỷ lệ lạm phát dài hạn\nphải nhỏ hơn 1,0% để tỷ lệ chính sách cao hơn tỷ lệ\ntrung tính\n8. Không chính xác vì khi lãi suất chính sách cao hơn lãi suất trung lập, chính sách tiền tệ sẽ bị thu hẹp\nkhi chúng ở dưới lãi suất trung lập, chính sách tiền tệ sẽ mở rộng. Việc tính toán tỷ lệ\ntrung lập như sau: Tỷ lệ trung lập = Xu hướng tăng trưởng + Mục tiêu lạm phát. Do đó, nếu chính sách tiền tệ\nco lại thì lãi suất chính sách (1,5%) phải lớn hơn lãi suất trung lập. Do đó, tỷ lệ lạm phát dài hạn\nphải nhỏ hơn 1,0% để tỷ lệ chính sách lớn hơn tỷ lệ\ntrung tính.\nC. Không chính xác vì khi lãi suất chính sách cao hơn lãi suất trung lập, chính sách tiền tệ sẽ bị thu hẹp;\nkhi chúng ở dưới lãi suất trung lập, chính sách tiền tệ sẽ mở rộng. Việc tính toán tỷ lệ\ntrung lập như sau: Tỷ lệ trung lập Xu hướng tăng trưởng + Mục tiêu lạm phát. Do đó, nếu chính sách tiền tệ\nco lại thì lãi suất chính sách (1,5%) phải lớn hơn lãi suất trung lập. Do đó, tỷ lệ lạm phát dài hạn\nphải nhỏ hơn 1,0% để tỷ lệ chính sách cao hơn tỷ lệ\ntrung lập.\nKinh tế: mô tả phẩm chất của các ngân hàng trung ương hiệu quả; đối chiếu việc họ sử dụng lạm phát, lãi suất,\nvà nhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nhạn chế của chính sách tiền tệ","qhtml":null},{"n":68,"q":"An analyst gathers the following information (in $ millions) about a firm operating in a\nperfectly competitive market:\n● Total variable costs 700\n● Total fixed costs 400\nIf the firm's total revenue is $1,000 million, the firm should:","opts":["stay in the market in both the short run and long run.","stay in the market in the short run and exit the market in the long run.","shut down production in the short run and exit the market in the long run."],"ans":"B","expl":"A. Không chính xác vì TR > TVC nhưng < TC. Như vậy, công ty sẽ tồn tại trên thị trường trong thời gian ngắn và\nrời khỏi thị trường trong thời gian dài.\nB. Đúng vì khi tổng doanh thu TR đủ để trang trải TVC (tổng chi phí biến đổi) nhưng không phải tất cả\ntổng TFC tiếp tục sản xuất trong thời gian ngắn nhưng sẽ không thể duy trì khả năng thanh toán tài chính ở\n1.000, lớn hơn TVC là 700 đô la, nhưng không đủ để trang trải TFC là 400 đô la của công ty. Do đó\ncông ty sẽ rời khỏi thị trường trong thời gian dài.\nC. Không chính xác vì TR > TVC nhưng <TC Do đó, công ty sẽ tồn tại trên thị trường trong thời gian ngắn\nvì TR đủ để trang trải TVC, công ty có thể tiếp tục sản xuất trong thời gian ngắn.\nKinh tế học: xác định và giải thích các điểm hòa vốn và điểm dừng cạnh tranh của sản xuất, cũng như\ncũng như lợi thế kinh tế và phi kinh tế theo quy mô ảnh hưởng đến chi phí như thế nào trong điều kiện hoàn hảo và không hoàn hảo\ncạnh tranh","qhtml":null},{"n":69,"q":"To be effective in targeting inflation a central bank is least likely to need:","opts":["government oversight.","transparency of decisions.","credibility with market participants."],"ans":"A","expl":"A. Đúng vì khuôn khổ lạm phát mục tiêu thường có bộ tính năng sau - Một\nngân hàng trung ương độc lập và đáng tin cậy.\nB. Không chính xác vì bằng cách giải thích quan điểm của họ về nền kinh tế và bằng cách minh bạch trong việc ra quyết định\n, các ngân hàng trung ương độc lập, nhắm mục tiêu lạm phát tìm cách đạt được danh tiếng và sự tín nhiệm,\nlàm cho việc tác động đến kỳ vọng lạm phát trở nên dễ dàng hơn và do đó cuối cùng dễ dàng đạt được mục tiêu lạm phát\n.\nC. Không chính xác vì độ tin cậy-sự độc lập của ngân hàng trung ương và niềm tin của công chúng vào nó là\nchìa khóa trong việc thiết kế chế độ lạm phát mục tiêu.\nKinh tế: mô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và cơ chế truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế, lạm phát,\nlãi suất và tỷ giá hối đoái","qhtml":null},{"n":70,"q":"To increase liquidity, a central bank most likely implements an interest rate policy that is:","opts":["contractionary.","neutral.","expansionary."],"ans":"C","expl":"A. Không chính xác vì khi họ [các ngân hàng trung ương] tin rằng hoạt động kinh tế có thể dẫn đến lạm phát tăng, họ có thể tăng lãi suất, do đó làm giảm tính thanh khoản. Trong những trường hợp này,\ncác nhà phân tích thị trường mô tả những hành động đó là thu hẹp.\nB. Không chính xác vì lãi suất trung lập là lãi suất không thúc đẩy cũng như không làm chậm lại\nnền kinh tế cơ bản. Như vậy, khi lãi suất chính sách cao hơn lãi suất trung lập, chính sách tiền tệ\nco lại, khi chúng ở dưới lãi suất trung lập, chính sách tiền tệ sẽ mở rộng\nC. Đúng vì khi nền kinh tế đang chậm lại và lạm phát cũng như xu hướng tiền tệ đang suy yếu,\nngân hàng trung ương có thể tăng tính thanh khoản bằng cách cắt giảm lãi suất mục tiêu của họ. Trong những trường hợp này, chính sách tiền tệ\nđược cho là có tính mở rộng.\nKinh tế: mô tả phẩm chất của các ngân hàng trung ương hiệu quả, đối chiếu việc họ sử dụng lạm phát, lãi suất,\nvà nhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nhạn chế của chính sách tiền tệ","qhtml":null},{"n":71,"q":"The conversion of nominal exchange rates into real exchange rates requires the:","opts":["GDP of both countries.","price levels in both countries.","interest rates in both countries."],"ans":"B","expl":"A. Không chính xác vì tỷ giá hối đoái thực điều chỉnh theo mức giá ở cả hai nước chứ không phải GDP. Tỷ giá hối đoái thực\nlà các chỉ số thường được các nhà kinh tế và các nhà phân tích thị trường khác xây dựng để\nđánh giá những thay đổi về sức mua tương đối của một loại tiền tệ so với một loại tiền tệ khác. Việc tạo\ncác chỉ mục này yêu cầu điều chỉnh tỷ giá hối đoái danh nghĩa bằng cách sử dụng các mức giá ở mỗi quốc gia\ncủa cặp tiền tệ\nB. Đúng vì tỷ giá hối đoái thực, là các chỉ số thường được các nhà kinh tế và\ncác nhà phân tích thị trường khác xây dựng để đánh giá những thay đổi về sức mua tương đối của một loại tiền tệ so với\nvới một loại tiền tệ khác. Việc tạo các chỉ mục này yêu cầu điều chỉnh tỷ giá hối đoái danh nghĩa bằng cách sử dụng các mức giá\nở mỗi quốc gia của cặp tiền tệ\nC. Không chính xác vì tỷ giá hối đoái thực điều chỉnh theo mức giá ở cả hai quốc gia chứ không phải lãi suất.\nTỷ giá hối đoái thực, là các chỉ số thường được các nhà kinh tế và các nhà phân tích thị trường khác xây dựng\nđể đánh giá những thay đổi về sức mua tương đối của một loại tiền tệ so với một loại tiền tệ khác. Việc tạo\ncác chỉ mục này yêu cầu điều chỉnh tỷ giá hối đoái danh nghĩa bằng cách sử dụng mức giá ở mỗi quốc gia\ncủa cặp tiền tệ.\nKinh tế học: mô tả thị trường ngoại hối, bao gồm các chức năng và thành phần tham gia,\nphân biệt giữa tỷ giá hối đoái danh nghĩa và tỷ giá hối đoái thực, đồng thời tính toán và diễn giải tỷ lệ phần trăm\nthay đổi của một loại tiền tệ so với loại tiền tệ khác","qhtml":null},{"n":72,"q":"Which of the following is most likely a benefit of globalization?","opts":["Increased profits","More equal income distribution","Stronger environmental, social, and governance standards"],"ans":"A","expl":"A. Đúng vì cơ hội tạo ra lợi nhuận cao hơn có thể thúc đẩy các công ty toàn cầu hóa.\nCách đầu tiên để tạo ra lợi nhuận là tăng doanh số bán hàng. Các công ty có thể chọn tham gia toàn cầu hóa\nđể tiếp cận khách hàng mới cho hàng hóa và dịch vụ của họ. Một cách khác để tăng lợi nhuận là\ngiảm chi phí. Toàn cầu hóa cho phép các công ty tiếp cận môi trường hoạt động có mức thuế thấp hơn, giảm\nchi phí lao động hoặc tìm kiếm những lợi ích khác về hiệu quả của chuỗi cung ứng\nB. Không chính xác vì toàn cầu hóa có thể góp phần tạo ra sự bất bình đẳng về thu nhập và tài sản, cũng như\nsự khác biệt về cơ hội, trong và giữa các quốc gia.\nC. Không chính xác vì các công ty hoạt động ở các quốc gia có chi phí thấp hơn thường hoạt động theo tiêu chuẩn\nđịa phương của các quốc gia đó. Nếu các tiêu chuẩn về bảo vệ môi trường, lợi ích xã hội hoặc quản trị doanh nghiệp\nở một quốc gia thấp hơn so với quốc gia khác và cuối cùng các công ty giảm\ntiêu chuẩn sản xuất của họ trong bối cảnh đó, thì toàn cầu hóa có thể tạo ra sự hao hụt tài nguyên con người,\nhành chính và môi trường.\nKinh tế: mô tả địa chính trị và mối quan hệ của nó với toàn cầu hóa","qhtml":null},{"n":73,"q":"Natural disasters are an example of:","opts":["event risk.","thematic risk.","exogenous risk."],"ans":"C","expl":"A. Không chính xác vì rủi ro sự kiện phát triển xung quanh các ngày đã định, chẳng hạn như bầu cử, luật mới hoặc các mốc quan trọng khác\ntheo ngày, chẳng hạn như ngày lễ hoặc ngày kỷ niệm chính trị đã được biết trước.\nB. Không chính xác vì rủi ro theo chủ đề là những rủi ro đã biết phát triển và mở rộng trong một khoảng thời gian.\nBiến đổi khí hậu, mô hình di cư, sự trỗi dậy của các lực lượng dân túy và mối đe dọa khủng bố đang diễn ra đều thuộc loại này.\nC. Đúng vì rủi ro ngoại sinh là rủi ro bất ngờ hoặc không lường trước được, ảnh hưởng đến lập trường hợp tác\ncủa một quốc gia, khả năng toàn cầu hóa của các chủ thể phi nhà nước hoặc cả hai. Các ví dụ bao gồm\ncác cuộc nổi dậy, xâm lược hoặc hậu quả của thiên tai bất ngờ.\nKinh tế: mô tả tác động của rủi ro địa chính trị đối với các khoản đầu tư","qhtml":null},{"n":74,"q":"Which of the following changes are investors most likely to make in response to a black\nswan risk?","opts":["Tactical","Sector specific","Asset allocation"],"ans":"A","expl":"A. Đúng vì tốc độ của rủi ro địa chính trị là tốc độ mà nó tác động đến danh mục đầu tư\ncủa nhà đầu tư. Để đơn giản hóa, chúng tôi khám phá các tác động ngắn hạn hoặc 'tốc độ cao', trung hạn,\nvà tác động dài hạn hoặc 'tốc độ thấp' []. Trong ngắn hạn, chúng ta có thể thấy sự biến động trên thị trường\nảnh hưởng đến toàn bộ ngành hoặc thậm chí toàn bộ thị trường. Các sự kiện ngoại sinh hoặc 'thiên nga đen' có xu hướng phù hợp với\nloại này, gây ra biến động thị trường và khiến nhà đầu tư chuyển hướng sang chất lượng. Rủi ro thiên nga đen là một sự kiện\nhiếm gặp và khó dự đoán nhưng có tác động quan trọng. Các nhà đầu tư có khoảng thời gian\nthích hợp và khả năng chấp nhận rủi ro có thể thực hiện những thay đổi mang tính chiến thuật đối với lựa chọn đầu tư của họ do những sự kiện\nnày. Những thay đổi dài hạn dường như là không cần thiết.\nB. Không chính xác vì thay vào đó, điều này liên quan đến tác động trung hạn của rủi ro địa chính trị: Rủi ro có tác động trung hạn\ncó thể bắt đầu làm suy giảm quy trình, chi phí và cơ hội đầu tư\ncủa công ty, dẫn đến việc định giá thấp hơn. Những rủi ro này có xu hướng phân bố sang các lĩnh vực\ncụ thể, nghĩa là chúng sẽ tác động đến một số công ty nhiều hơn những công ty khác.\nC. Không chính xác vì thay vào đó, điều này liên quan đến tác động tốc độ thấp của rủi ro địa chính trị: Tốc độ của\nrủi ro địa chính trị là tốc độ mà nó tác động đến danh mục đầu tư của nhà đầu tư. Để đơn giản hóa, chúng tôi\nkhám phá các tác động ngắn hạn hoặc 'tốc độ cao', tác động trung hạn và dài hạn hoặc 'tốc độ thấp'.\nVà rủi ro dài hạn có thể có các tác động quan trọng về môi trường, xã hội, quản trị và các tác động khác. Điều này\ncó thể tác động đến việc phân bổ tài sản của nhà đầu tư-bao gồm cả việc lựa chọn loại tài sản và phong cách đầu tư-cho một\ntầm nhìn dài hạn; tuy nhiên, tác động tức thời đến danh mục đầu tư có thể sẽ hạn chế hơn.\nKinh tế: mô tả tác động của rủi ro địa chính trị đối với các khoản đầu tư","qhtml":null},{"n":75,"q":"During the recovery phase of the business cycle, inflation most likely:","opts":["remains moderate.","further accelerates.","decelerates but with a lag."],"ans":"A","expl":"A. Đúng vì trong giai đoạn \"phục hồi\", lạm phát vẫn ở mức vừa phải.\nB. Không chính xác vì trong giai đoạn \"phục hồi\", lạm phát vẫn ở mức vừa phải và trong giai đoạn \"chậm lại\"\nlạm phát tiếp tục tăng tốc.\nC. Không chính xác vì trong giai đoạn \"phục hồi\", lạm phát vẫn ở mức vừa phải và trong giai đoạn \"co lại\"\nlạm phát giảm tốc nhưng có độ trễ.\nKinh tế: mô tả chu kỳ kinh doanh và các giai đoạn của nó","qhtml":null},{"n":76,"q":"The Herfindahl-Hirschman index is calculated based on:","opts":["market shares of the companies.","elasticity of demand in the market.","probability of new entry into the market."],"ans":"A","expl":"A. Đúng vì khi tính chỉ số Herfindahl-Hirschman, thị phần của các công ty N\nhàng đầu trước tiên được bình phương rồi sau đó được cộng vào. Nếu một công ty kiểm soát toàn bộ thị trường (độc quyền),\nchỉ số Herfindahl-Hirschman (HHI) bằng 1. Nếu có M công ty trong ngành có thị phần\nbằng nhau thì HHI bằng (1/M).\nB. Không chính xác vì giống như tỷ lệ tập trung, HHI không tính đến khả năng nhập\nvà cũng không xem xét độ co giãn của cầu.\nC. Không chính xác vì giống như tỷ lệ tập trung, HHI không tính đến khả năng thâm nhập\nvà cũng không xem xét độ co giãn của cầu.\nKinh tế: xác định loại cấu trúc thị trường trong đó một công ty hoạt động và mô tả việc sử dụng\nvà những hạn chế của các biện pháp tập trung","qhtml":null}];

function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<style id="qnav-note-css">
  #navGrid .cell.noted::before{content:"\1F4DD";position:absolute;top:-4px;left:-3px;font-size:10px;line-height:1}
</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnav-note-end-->

  <iframe id="qnotesFrame" title="Ghi chú của tôi" loading="lazy"></iframe>
</div>
<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--qnotes-panel-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
