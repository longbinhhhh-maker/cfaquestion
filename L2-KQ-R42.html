<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 42 — Application of the Code and Standards Level II · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;

    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));

  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}

  }
</style>

<!--l2-vignette-start-->
<style id="l2-css">

  .pp-topic.set{color:#a855f7;background:color-mix(in srgb,#a855f7 12%,transparent)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>

<script>
const DATA = [{"n": 1, "q": "Patricia Spraetz is the chief financial officer and compliance officer at Super Selection Investment Advisors. Super Selection is a medium-sized money management firm which has incorporated the CFA Institute Code of Ethics and Standards of Practice into the firm's compliance manual. Karen Jackson is a portfolio manager for Super Selection. She is not a CFA charterholder. Jackson is friendly with David James, president of AMD, a rapidly growing biotech company. James has provided Jackson with recommendations in the biotech industry, which she buys for her own portfolio before buying them for her clients. For three years, Jackson has also served on AMD's board of directors but has never notified Super Selection of this fact. She has received options and fees as compensation. Recently, the board of AMD decided to raise capital by voting to issue shares to the public. This was attractive to board members (including Jackson) who wanted to exercise their stock options and sell their shares to get cash. When the demand for initial public offerings (IPO) diminished, just before AMD's public offering, James asked Jackson to commit to a large purchase of the offering for her portfolios. Jackson had previously determined that AMD was a questionable investment but agreed to reconsider at James' request. Her reevaluation confirmed the stock to be overpriced, but she nevertheless decided to purchase AMD for her clients' portfolios.  Which of the following statements is NOT correct?", "opts": ["Jackson violated Standard VI(A) regarding Conflicts of interest by not disclosing her board membership and ownership of stock options to her employer. Jackson did not violate Standard III(A) on Fiduciary Duty to clients because she was", "bound by her fiduciary duty to AMD and its stockholders as a board member. Therefore, when she reversed her decision to buy AMD shares for Super Selection's clients, portfolios on James' request, her obligation to AMD took precedence.", "Jackson violated Standard IV(B) regarding Disclosure of Additional Compensation by not disclosing additional compensation in the form of cash and stock options received from AMD, as its board member to her employer."], "ans": "B", "expl": "Jackson has violated Standard III(A) because her first obligation is to her firm's clients. Standard VI(A) addresses precisely these kinds of situations regarding potential conflict of interest. Given this conflict of interest, Jackson also compromised her objectivity in violation of Standard I(B). Her fiduciary duty to her clients takes precedence over her fiduciary duty to AMD's stockholders under the CFA Institute Code and Standards. By not disclosing her relationship with AMD, she also violated Standard IV(B). Making past personal security transactions ahead of purchase of the same securities for her clients has put Jackson in violation of Standard VI(B). This standard clearly prohibits such actions.", "explhtml": "<p>Jackson has violated Standard III(A) because her first obligation is to her firm&#x27;s clients. Standard VI(A) addresses precisely these kinds of situations regarding potential conflict of interest. Given this conflict of interest, Jackson also compromised her objectivity in violation of Standard I(B). Her fiduciary duty to her clients takes precedence over her fiduciary duty to AMD&#x27;s stockholders under the CFA Institute Code and Standards. By not disclosing her relationship with AMD, she also violated Standard IV(B). Making past personal security transactions ahead of purchase of the same securities for her clients has put Jackson in violation of Standard VI(B). This standard clearly prohibits such actions.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Patricia Spraetz is the chief financial officer and compliance officer at Super Selection Investment Advisors. Super Selection is a medium-sized money management firm which has incorporated the CFA Institute Code of Ethics and Standards of Practice into the firm&#x27;s compliance manual.<\/p><p>Karen Jackson is a portfolio manager for Super Selection. She is not a CFA charterholder. Jackson is friendly with David James, president of AMD, a rapidly growing biotech company. James has provided Jackson with recommendations in the biotech industry, which she buys for her own portfolio before buying them for her clients. For three years, Jackson has also served on AMD&#x27;s board of directors but has never notified Super Selection of this fact. She has received options and fees as compensation.<\/p><p>Recently, the board of AMD decided to raise capital by voting to issue shares to the public. This was attractive to board members (including Jackson) who wanted to exercise their stock options and sell their shares to get cash. When the demand for initial public offerings (IPO) diminished, just before AMD&#x27;s public offering, James asked Jackson to commit to a large purchase of the offering for her portfolios. Jackson had previously determined that AMD was a questionable investment but agreed to reconsider at James&#x27; request. Her reevaluation confirmed the stock to be overpriced, but she nevertheless decided to purchase AMD for her clients&#x27; portfolios.<\/p><p> Which of the following statements is NOT correct?<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Which of the following statements concerning Sherman's actions is CORRECT?", "opts": ["Sherman did not violate Standard IV(A) since members can engage in independent consulting practice as long as their employer policy does not specifically prohibit it.", "Sherman did not violate Standard IV(A) by soliciting clients that were rejected by Pearl either because they were too small or unsuitable as long as winning their business did not adversely affect Pearl.", "Sherman did not violate any Standard by taking away the news articles from his previous employer, Pearl, for potential research ideas."], "ans": "B", "expl": "Standard IV(A) addresses Loyalty to the Employer and depriving the employer of profit opportunities is a violation of this standard. Because Pearl had no interest in rejected clients and had turned their profit potential down already, soliciting them is not a violation. Taking away news articles and computer program models is a violation of Standard IV(A) because Sherman took away employer property, which could be used by Pearl or Sherman's replacement. Engaging in independent consulting practice is a violation IV(A) because Sherman not only compromised his independence and objectivity, but also did not obtain explicit written consent of his new employer, Standard IV(B), Additional Compensation Arrangements.", "explhtml": "<p>Standard IV(A) addresses Loyalty to the Employer and depriving the employer of profit opportunities is a violation of this standard. Because Pearl had no interest in rejected clients and had turned their profit potential down already, soliciting them is not a violation.<\/p><p>Taking away news articles and computer program models is a violation of Standard IV(A) because Sherman took away employer property, which could be used by Pearl or Sherman&#x27;s replacement. Engaging in independent consulting practice is a violation IV(A) because Sherman not only compromised his independence and objectivity, but also did not obtain explicit written consent of his new employer, Standard IV(B), Additional Compensation Arrangements.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 2–3<\/summary><div class=\"vig-body\"><p>Glenarm Case Study (Refer to CFA Institute Standards of Practice Casebook for details.)<\/p><p>Peter Sherman, CFA, has recently joined Glenarm Company after spending 5 years at Pearl Investment Management. He is responsible for identifying potential Latin American investments. Previously, Sherman held jobs as a consultant for many Latin American companies and had plans to continue such consulting jobs without disclosing anything to Glenarm.<\/p><p>After resigning, but before leaving his employment at Pearl, Sherman had encouraged Pearl customers to move their accounts to Glenarm. He contacted accounts Pearl had been soliciting for business. He also contacted potential clients that Pearl had rejected in the past as too small or incompatible with the firm's business. Furthermore, he convinced several of Pearl's clients and prospects to hire Glenarm after he joined Glenarm. He also identified materials from Pearl to take with him, such as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r42/v001.webp\" style=\"max-width:min(100%,597px)\" alt=\"1. Sample marketing presentations he had prepared. 2. Computer program models for stock selection. 3. Research materials on companies he had been following. 4. A list of companies recommended by Sherman for potential investment which were rejected by Pearl. 5. News articles for potential research ideas.\"><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Which of the following statements concerning Sherman&#x27;s actions is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Sherman's attempt to lure away clients from Pearl while he was still employed at Pearl is:", "opts": ["not a violation of Standard IV(A) because they would have followed Sherman to his new firm anyway, and no harm to Pearl was done as a result.", "a violation of Standard IV(A) because it undermined Pearl's business and its profit opportunities and caused damage to Pearl's business.", "not a violation of Standard V(A) because it was conducted \"after hours\" on Sherman's own time."], "ans": "B", "expl": "An attempt, successful or not, to lure away existing clients of the current employer is a violation of Standard IV(A) as it causes damage to the employer's business. Others are incorrect because: \"After hours\" solicitation is not an excuse if it damages the employer's business; the fact that Pearl's clients were agreeable does not absolve Sherman of Standard IV(A) violation; even if Pearl's clients would have followed Sherman to his new employer anyway, Sherman, by soliciting such clients, damaged his employer's business. The focus is on Sherman's actions.", "explhtml": "<p>An attempt, successful or not, to lure away existing clients of the current employer is a violation of Standard IV(A) as it causes damage to the employer&#x27;s business.<\/p><p>Others are incorrect because: &quot;After hours&quot; solicitation is not an excuse if it damages the employer&#x27;s business; the fact that Pearl&#x27;s clients were agreeable does not absolve Sherman of Standard IV(A) violation; even if Pearl&#x27;s clients would have followed Sherman to his new employer anyway, Sherman, by soliciting such clients, damaged his employer&#x27;s business. The focus is on Sherman&#x27;s actions.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 2–3<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Glenarm Case Study (Refer to CFA Institute Standards of Practice Casebook for details.)<\/p><p>Peter Sherman, CFA, has recently joined Glenarm Company after spending 5 years at Pearl Investment Management. He is responsible for identifying potential Latin American investments. Previously, Sherman held jobs as a consultant for many Latin American companies and had plans to continue such consulting jobs without disclosing anything to Glenarm.<\/p><p>After resigning, but before leaving his employment at Pearl, Sherman had encouraged Pearl customers to move their accounts to Glenarm. He contacted accounts Pearl had been soliciting for business. He also contacted potential clients that Pearl had rejected in the past as too small or incompatible with the firm's business. Furthermore, he convinced several of Pearl's clients and prospects to hire Glenarm after he joined Glenarm. He also identified materials from Pearl to take with him, such as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r42/v001.webp\" style=\"max-width:min(100%,597px)\" alt=\"1. Sample marketing presentations he had prepared. 2. Computer program models for stock selection. 3. Research materials on companies he had been following. 4. A list of companies recommended by Sherman for potential investment which were rejected by Pearl. 5. News articles for potential research ideas.\"><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Sherman&#x27;s attempt to lure away clients from Pearl while he was still employed at Pearl is:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Patricia Spraetz is the chief financial officer and compliance officer at Super Selection Investment Advisors.  Super Selection is a medium-sized money management firm which has incorporated the CFA Institute Code of Ethics and Standards of Practice into the firm's compliance manual. Karen Jackson is a portfolio manager for Super Selection.  She is not a CFA charterholder.  Jackson is friendly with David James, president of AMD, a rapidly growing biotech company.  James has provided Jackson with recommendations in the biotech industry, which she buys for her own portfolio before buying them for her clients.  For three years, Jackson has also served on AMD's board of directors.  She has received options and fees as compensation. Recently, the board of AMD decided to raise capital by voting to issue shares to the public. This was attractive to board members (including Jackson) who wanted to exercise their stock options and sell their shares to get cash.  When the demand for initial public offerings (IPO) diminished, just before AMD's public offering, James asked Jackson to commit to a large purchase of the offering for her portfolios.  Jackson had previously determined that AMD was a questionable investment but agreed to reconsider at James' request.  Her reevaluation confirmed the stock to be overpriced, but she nevertheless decided to purchase AMD for her clients' portfolios. Which of the following actions are most appropriate for Spraetz?", "opts": ["Even though Spraetz does not supervise Jackson, as the compliance officer of the firm she is responsible for identifying violations. Spraetz is not responsible for preventing them and should not go beyond their documentation for senior management. Thus, she should record the violations but need not take any further action.", "If, after her investigation Spraetz finds that Jackson has committed violations, Spraetz must report them to senior management and seek legal counsel for possible legal and regulatory implications. If the upper management does not follow through and take action, Spraetz has fulfilled her supervisory duties and need not take any further action.", "Spraetz, as the chief compliance officer, must set company policy in clear terms and monitor the actions of the employees. In case of violations, she should investigate thoroughly, initiate disciplinary action, and issue guidelines that must be followed in order to prevent future violations. She must not only detect violations through a continuous monitoring process but also provide guidance for proper conduct consistent with the firm's policy manual."], "ans": "C", "expl": "Since Spraetz has the authority to hire, fire, reward, and punish Jackson, Spraetz has supervisory duties in addition to being the chief compliance officer of Superior Selection. She must investigate Jackson and report her findings to her superiors and possibly the board. If no action is taken, Spraetz must consider resigning under the CFA Institute Code and Standards. Spraetz is also responsible for setting the policy, preventing and detecting violations, and putting into place reasonable procedures to monitor employees' actions. Her role as the chief compliance officer requires her to take disciplinary actions in order to deter further violations.", "explhtml": "<p>Since Spraetz has the authority to hire, fire, reward, and punish Jackson, Spraetz has supervisory duties in addition to being the chief compliance officer of Superior Selection. She must investigate Jackson and report her findings to her superiors and possibly the board. If no action is taken, Spraetz must consider resigning under the CFA Institute Code and Standards. Spraetz is also responsible for setting the policy, preventing and detecting violations, and putting into place reasonable procedures to monitor employees&#x27; actions. Her role as the chief compliance officer requires her to take disciplinary actions in order to deter further violations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Patricia Spraetz is the chief financial officer and compliance officer at Super Selection Investment Advisors.  Super Selection is a medium-sized money management firm which has incorporated the CFA Institute Code of Ethics and Standards of Practice into the firm&#x27;s compliance manual.<\/p><p>Karen Jackson is a portfolio manager for Super Selection.  She is not a CFA charterholder.  Jackson is friendly with David James, president of AMD, a rapidly growing biotech company.  James has provided Jackson with recommendations in the biotech industry, which she buys for her own portfolio before buying them for her clients.  For three years, Jackson has also served on AMD&#x27;s board of directors.  She has received options and fees as compensation.<\/p><p>Recently, the board of AMD decided to raise capital by voting to issue shares to the public. This was attractive to board members (including Jackson) who wanted to exercise their stock options and sell their shares to get cash.  When the demand for initial public offerings (IPO) diminished, just before AMD&#x27;s public offering, James asked Jackson to commit to a large purchase of the offering for her portfolios.  Jackson had previously determined that AMD was a questionable investment but agreed to reconsider at James&#x27; request.  Her reevaluation confirmed the stock to be overpriced, but she nevertheless decided to purchase AMD for her clients&#x27; portfolios.<\/p><p>Which of the following actions are most appropriate for Spraetz?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Patricia Spraetz is the chief financial officer and compliance officer at Super Selection Investment Advisors. Super Selection is a medium-sized money management firm which has incorporated the CFA Institute Code of Ethics and Standards of Practice into the firm's compliance manual. Karen Jackson is a portfolio manager for Super Selection. She is not a CFA charterholder. Jackson is friendly with David James, president of AMD, a rapidly growing biotech company. James has provided Jackson with recommendations in the biotech industry, which she buys for her own portfolio before buying them for her clients. For three years, Jackson has also served on AMD's board of directors. She has received options and fees as compensation. Recently, the board of AMD decided to raise capital by voting to issue shares to the public.  This was attractive to board members (including Jackson) who wanted to exercise their stock options and sell their shares to get cash. When the demand for initial public offerings (IPO) diminished, just before AMD's public offering, James asked Jackson to commit to a large purchase of the offering for her portfolios. Jackson had previously determined that AMD was a questionable investment but agreed to reconsider at James' request. Her reevaluation confirmed the stock to be overpriced, but she nevertheless decided to purchase AMD for her clients' portfolios. Which of the following statements concerning Super Selection is CORRECT?", "opts": ["Jackson did not violate the CFA Institute Code of Ethics and Standards since she is not a CFA charterholder.", "All employees of a firm are bound by CFA Institute's Code and Standards if they are incorporated in the company's policies manual, and the firm subscribes to them explicitly.", "Spraetz, in her capacity as a supervisor, violated Standard IV(C) by not preventing violations by Jackson."], "ans": "B", "expl": "Even though Jackson is not a CFA charterholder, she is nevertheless required to follow the Code and Standards since her firm subscribes to them and has incorporated them in its policy manual. Standard IV(C) violation is not clear or obvious since the case does not say much about a lack of guidelines or explicit gaps in the policy manual. Under this assumption, Spraetz is not guilty of any supervisory violation. Even though Jackson did not personally trade ahead of purchasing AMD shares for her clients, she had done so in the past and is in violation of Standard VI(B). Spraetz needs to act on it because this violation has only just come to light.", "explhtml": "<p>Even though Jackson is not a CFA charterholder, she is nevertheless required to follow the Code and Standards since her firm subscribes to them and has incorporated them in its policy manual.<\/p><p>Standard IV(C) violation is not clear or obvious since the case does not say much about a lack of guidelines or explicit gaps in the policy manual. Under this assumption, Spraetz is not guilty of any supervisory violation. Even though Jackson did not personally trade ahead of purchasing AMD shares for her clients, she had done so in the past and is in violation of Standard VI(B). Spraetz needs to act on it because this violation has only just come to light.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 42.1, LOS 42.a<\/div><div class=\"qtext\"><p>Patricia Spraetz is the chief financial officer and compliance officer at Super Selection Investment Advisors. Super Selection is a medium-sized money management firm which has incorporated the CFA Institute Code of Ethics and Standards of Practice into the firm&#x27;s compliance manual.<\/p><p>Karen Jackson is a portfolio manager for Super Selection. She is not a CFA charterholder. Jackson is friendly with David James, president of AMD, a rapidly growing biotech company. James has provided Jackson with recommendations in the biotech industry, which she buys for her own portfolio before buying them for her clients. For three years, Jackson has also served on AMD&#x27;s board of directors. She has received options and fees as compensation.<\/p><p>Recently, the board of AMD decided to raise capital by voting to issue shares to the public.  This was attractive to board members (including Jackson) who wanted to exercise their stock options and sell their shares to get cash. When the demand for initial public offerings (IPO) diminished, just before AMD&#x27;s public offering, James asked Jackson to commit to a large purchase of the offering for her portfolios. Jackson had previously determined that AMD was a questionable investment but agreed to reconsider at James&#x27; request. Her reevaluation confirmed the stock to be overpriced, but she nevertheless decided to purchase AMD for her clients&#x27; portfolios.<\/p><p>Which of the following statements concerning Super Selection is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Which of the following statements about consulting work is CORRECT?", "opts": ["In some circumstances the employee must receive the employer's written permission prior to receiving additional compensation from parties other than the firm. This requirement applies to both monetary and non-monetary compensation.", "In all cases the employee must receive the employer's written permission prior to receiving additional compensation from parties other than the firm. This requirement applies to both monetary and non-monetary compensation.", "In some circumstances the employee must receive the employer's written permission prior to receiving additional compensation from parties other than the firm. This requirement applies to monetary compensation only."], "ans": "A", "expl": "Standard IV(A): Loyalty to Employer requires written permission from both the employer and the consulting customer if the work involves competition with the employer. An example of an instance not requiring permission would be if a CFA charterholder who works for a broker wishes to write grants for a nonprofit foundation. In such case, he need not get permission, nor does he need to disclose the compensation. This Standard applies for work that provides either monetary or nonmonetary compensation.", "explhtml": "<p>Standard IV(A): Loyalty to Employer requires written permission from both the employer and the consulting customer if the work involves competition with the employer. An example of an instance not requiring permission would be if a CFA charterholder who works for a broker wishes to write grants for a nonprofit foundation. In such case, he need not get permission, nor does he need to disclose the compensation. This Standard applies for work that provides either monetary or nonmonetary compensation.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 6–9<\/summary><div class=\"vig-body\"><p>Jacques Claudel, a CFA Institute member, represents Vector Funds, a U.S.-based fund manager, in Canada. Although Vector Funds is properly licensed to deal in all Canadian and U.S. securities, its primary objective is to sell United States funds to Canadian institutional investors seeking diversification into the U.S. dollar. While it would be willing to do so if requested by its clients, Vector has not placed trades in Canadian securities since Claudel began working there two years ago.<\/p><p>Prior to joining Vector's Canadian operations, Claudel was an independent asset manager handling the funds of wealthy individuals and small institutions. Most of these accounts remain under his management, under the business name Coup de Gras. Claudel is unclear as to whether his consulting work is in competition with his new employer, as the accounts under his management are invested strictly in Canadian securities, while Vector has not traded Canadian securities. However, just to be on the safe side, he obtained written permission from Vector to continue serving his former clients. His former clients were not notified.<\/p><p>Claudel receives cash compensation for most of the accounts he handles independently, but for one he receives a new car for his personal use every two years, and for another he is compensated with a one-week, expenses-paid holiday in the European country of his choice.<\/p><p>As part of his responsibility, Claudel makes trades for some of his Canadian clients. He runs all of his trades through two brokers, Ace Equity Traders and the Parlay Group. Ace offers some of the best research available on health-care stocks, but charges fairly hefty commissions. Parley has some of the cheapest commissions in Toronto, but provides no research of value to Claudel.<\/p><p>Henri Bonnet, CFA, a friend of Claudel's, works on the floor of the Vancouver Stock Exchange. He asks Claudel to establish an account for him at Coup de Gras. Claudel learns that it is Bonnet's intention to manipulate the prices of penny stocks he trades on the exchange, and profit from the price movements in the account at Coup de Gras. Claudel sets up the account, but advises Bonnet that he \"will have nothing to do\" with the manipulation scheme beyond placing trades as Bonnet directs.<\/p><p>Claudel is currently pursuing a master's degree in financial economics in the evenings. During the interview with Vector and on his resume he indicated that he \"attended Victoria University.\" giving his estimated date of graduation. He is not sure whether Vector understood that he did not have his master's degree.<\/p><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Which of the following statements about consulting work is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Claudel's statement about his education background is:", "opts": ["truthful, but not in accord with the Code and Standards.", "truthful, and in accord with the Code and Standards.", "not truthful, and not in accord with the Code and Standards."], "ans": "B", "expl": "Standard I(C) Misrepresentation states that \"members shall not make any statements, orally or in writing, that misrepresent the member's academic or professional credentials.\" In this case, Claudel's statements are truthful, and are not a violation of the Standard. He could have been more clear, but what he said is undeniably correct. Whether Vector understood what he told them is not his problem, as long as he was truthful and did not attempt to deceive them.", "explhtml": "<p>Standard I(C) Misrepresentation states that &quot;members shall not make any statements, orally or in writing, that misrepresent the member&#x27;s academic or professional credentials.&quot; In this case, Claudel&#x27;s statements are truthful, and are not a violation of the Standard. He could have been more clear, but what he said is undeniably correct. Whether Vector understood what he told them is not his problem, as long as he was truthful and did not attempt to deceive them.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 6–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jacques Claudel, a CFA Institute member, represents Vector Funds, a U.S.-based fund manager, in Canada. Although Vector Funds is properly licensed to deal in all Canadian and U.S. securities, its primary objective is to sell United States funds to Canadian institutional investors seeking diversification into the U.S. dollar. While it would be willing to do so if requested by its clients, Vector has not placed trades in Canadian securities since Claudel began working there two years ago.<\/p><p>Prior to joining Vector's Canadian operations, Claudel was an independent asset manager handling the funds of wealthy individuals and small institutions. Most of these accounts remain under his management, under the business name Coup de Gras. Claudel is unclear as to whether his consulting work is in competition with his new employer, as the accounts under his management are invested strictly in Canadian securities, while Vector has not traded Canadian securities. However, just to be on the safe side, he obtained written permission from Vector to continue serving his former clients. His former clients were not notified.<\/p><p>Claudel receives cash compensation for most of the accounts he handles independently, but for one he receives a new car for his personal use every two years, and for another he is compensated with a one-week, expenses-paid holiday in the European country of his choice.<\/p><p>As part of his responsibility, Claudel makes trades for some of his Canadian clients. He runs all of his trades through two brokers, Ace Equity Traders and the Parlay Group. Ace offers some of the best research available on health-care stocks, but charges fairly hefty commissions. Parley has some of the cheapest commissions in Toronto, but provides no research of value to Claudel.<\/p><p>Henri Bonnet, CFA, a friend of Claudel's, works on the floor of the Vancouver Stock Exchange. He asks Claudel to establish an account for him at Coup de Gras. Claudel learns that it is Bonnet's intention to manipulate the prices of penny stocks he trades on the exchange, and profit from the price movements in the account at Coup de Gras. Claudel sets up the account, but advises Bonnet that he \"will have nothing to do\" with the manipulation scheme beyond placing trades as Bonnet directs.<\/p><p>Claudel is currently pursuing a master's degree in financial economics in the evenings. During the interview with Vector and on his resume he indicated that he \"attended Victoria University.\" giving his estimated date of graduation. He is not sure whether Vector understood that he did not have his master's degree.<\/p><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Claudel&#x27;s statement about his education background is:<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "Which of the following statements is CORRECT?", "opts": ["Bonnet has violated Standard III(B): Fair Dealing, and Claudel has violated Standard I(B): Independence and Objectivity.", "Bonnet has violated Standard II(A): Material Nonpublic Information, and Claudel has not violated Standard III(A): Loyalty, Prudence, and Care.", "Bonnet has violated Standard IV(A): Loyalty to Employer, and Claudel has violated Standard I(A): Knowledge of the Law."], "ans": "C", "expl": "Bonnet violated several Standards, including IV(A) and II(B), by manipulating stock prices and profiting from that manipulation at the expense of other purchasers. Standard IV(A) requires that employees not act to injure the firm or deprive it of profits, and Bonnet's personal trading and market manipulation crosses well over that line. However, Bonnet did not violate Standard II(A) Material Nonpublic Information because no nonpublic information was involved. Claudel violated Standard I(A) by contributing to Bonnet's plans to break the law. Under the Code and Standards, Claudel cannot knowingly assist others who are violating the Standards or the law, even if he does not profit personally. While Claudel's ethics are in question, nothing he did for Bonnet is likely to affect his independence, and he did not violate Standard I(B) Independence and Objectivity.", "explhtml": "<p>Bonnet violated several Standards, including IV(A) and II(B), by manipulating stock prices and profiting from that manipulation at the expense of other purchasers. Standard IV(A) requires that employees not act to injure the firm or deprive it of profits, and Bonnet&#x27;s personal trading and market manipulation crosses well over that line. However, Bonnet did not violate Standard II(A) Material Nonpublic Information because no nonpublic information was involved. Claudel violated Standard I(A) by contributing to Bonnet&#x27;s plans to break the law. Under the Code and Standards, Claudel cannot knowingly assist others who are violating the Standards or the law, even if he does not profit personally. While Claudel&#x27;s ethics are in question, nothing he did for Bonnet is likely to affect his independence, and he did not violate Standard I(B) Independence and Objectivity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 6–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jacques Claudel, a CFA Institute member, represents Vector Funds, a U.S.-based fund manager, in Canada. Although Vector Funds is properly licensed to deal in all Canadian and U.S. securities, its primary objective is to sell United States funds to Canadian institutional investors seeking diversification into the U.S. dollar. While it would be willing to do so if requested by its clients, Vector has not placed trades in Canadian securities since Claudel began working there two years ago.<\/p><p>Prior to joining Vector's Canadian operations, Claudel was an independent asset manager handling the funds of wealthy individuals and small institutions. Most of these accounts remain under his management, under the business name Coup de Gras. Claudel is unclear as to whether his consulting work is in competition with his new employer, as the accounts under his management are invested strictly in Canadian securities, while Vector has not traded Canadian securities. However, just to be on the safe side, he obtained written permission from Vector to continue serving his former clients. His former clients were not notified.<\/p><p>Claudel receives cash compensation for most of the accounts he handles independently, but for one he receives a new car for his personal use every two years, and for another he is compensated with a one-week, expenses-paid holiday in the European country of his choice.<\/p><p>As part of his responsibility, Claudel makes trades for some of his Canadian clients. He runs all of his trades through two brokers, Ace Equity Traders and the Parlay Group. Ace offers some of the best research available on health-care stocks, but charges fairly hefty commissions. Parley has some of the cheapest commissions in Toronto, but provides no research of value to Claudel.<\/p><p>Henri Bonnet, CFA, a friend of Claudel's, works on the floor of the Vancouver Stock Exchange. He asks Claudel to establish an account for him at Coup de Gras. Claudel learns that it is Bonnet's intention to manipulate the prices of penny stocks he trades on the exchange, and profit from the price movements in the account at Coup de Gras. Claudel sets up the account, but advises Bonnet that he \"will have nothing to do\" with the manipulation scheme beyond placing trades as Bonnet directs.<\/p><p>Claudel is currently pursuing a master's degree in financial economics in the evenings. During the interview with Vector and on his resume he indicated that he \"attended Victoria University.\" giving his estimated date of graduation. He is not sure whether Vector understood that he did not have his master's degree.<\/p><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Which of the following statements is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "Assuming that both Ace Equity Traders and the Parlay Group offer best execution, Claudel:", "opts": ["must disclose to clients whether client-directed brokerage will prevent him from getting the best execution.", "must direct all the trades for clients who do not wish to own health-care stocks to the Parlay Group.", "can select the broker that refers the most business back to him, as long as any research purchased benefits the client whose account is being traded."], "ans": "B", "expl": "The Standards require that purchased brokerage directly benefits the client. Clients who do not hold health-care stocks get no benefit from Ace's research, so Claudel is obligated to send their trades to the broker with the lowest transaction costs. While disclosing the risks of client-directed brokerage is a good idea, it is not relevant in this case because we are not given any information about client directed trades. Referrals can play no part in the broker-selection process. ", "explhtml": "<p>The Standards require that purchased brokerage directly benefits the client. Clients who do not hold health-care stocks get no benefit from Ace&#x27;s research, so Claudel is obligated to send their trades to the broker with the lowest transaction costs. While disclosing the risks of client-directed brokerage is a good idea, it is not relevant in this case because we are not given any information about client directed trades. Referrals can play no part in the broker-selection process. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 6–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jacques Claudel, a CFA Institute member, represents Vector Funds, a U.S.-based fund manager, in Canada. Although Vector Funds is properly licensed to deal in all Canadian and U.S. securities, its primary objective is to sell United States funds to Canadian institutional investors seeking diversification into the U.S. dollar. While it would be willing to do so if requested by its clients, Vector has not placed trades in Canadian securities since Claudel began working there two years ago.<\/p><p>Prior to joining Vector's Canadian operations, Claudel was an independent asset manager handling the funds of wealthy individuals and small institutions. Most of these accounts remain under his management, under the business name Coup de Gras. Claudel is unclear as to whether his consulting work is in competition with his new employer, as the accounts under his management are invested strictly in Canadian securities, while Vector has not traded Canadian securities. However, just to be on the safe side, he obtained written permission from Vector to continue serving his former clients. His former clients were not notified.<\/p><p>Claudel receives cash compensation for most of the accounts he handles independently, but for one he receives a new car for his personal use every two years, and for another he is compensated with a one-week, expenses-paid holiday in the European country of his choice.<\/p><p>As part of his responsibility, Claudel makes trades for some of his Canadian clients. He runs all of his trades through two brokers, Ace Equity Traders and the Parlay Group. Ace offers some of the best research available on health-care stocks, but charges fairly hefty commissions. Parley has some of the cheapest commissions in Toronto, but provides no research of value to Claudel.<\/p><p>Henri Bonnet, CFA, a friend of Claudel's, works on the floor of the Vancouver Stock Exchange. He asks Claudel to establish an account for him at Coup de Gras. Claudel learns that it is Bonnet's intention to manipulate the prices of penny stocks he trades on the exchange, and profit from the price movements in the account at Coup de Gras. Claudel sets up the account, but advises Bonnet that he \"will have nothing to do\" with the manipulation scheme beyond placing trades as Bonnet directs.<\/p><p>Claudel is currently pursuing a master's degree in financial economics in the evenings. During the interview with Vector and on his resume he indicated that he \"attended Victoria University.\" giving his estimated date of graduation. He is not sure whether Vector understood that he did not have his master's degree.<\/p><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Assuming that both Ace Equity Traders and the Parlay Group offer best execution, Claudel:<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "Karen Jackson is a portfolio manager. Jackson is friendly with David James, president of Acme Medical, a rapidly growing biotech company. James has provided Jackson with recommendations in the biotech industry, which she buys for her own portfolio before buying them for her clients. For three years, Jackson has also served on Acme Medical's board of directors. She has received options and fees as compensation. Recently, the board of Acme Medical decided to raise capital by voting to issue shares to the public. This was attractive to board members (including Jackson) who wanted to exercise their stock options and sell their shares to get cash. When the demand for initial public offerings (IPO) diminished, just before Acme Medical's public offering, James asked Jackson to commit to a large purchase of the offering for her portfolios. Jackson had previously determined that Acme Medical was a questionable investment but agreed to reconsider at James' request. Her reevaluation confirmed the stock to be overpriced, but she nevertheless decided to purchase Acme Medical for her clients' portfolios. Did Jackson violate Standard III(C) Suitability concerning portfolio recommendations and actions?", "opts": ["No.", "Yes, because she did not deal fairly with all clients.", "Yes, because she did not consider the appropriateness and suitability of investment recommendations or actions for each portfolio or client."], "ans": "C", "expl": "Jackson violated Standard III(C) Suitability because she did not consider her clients' financial situation, investment experience, and investment objectives.", "explhtml": "<p>Jackson violated Standard III(C) Suitability because she did not consider her clients&#x27; financial situation, investment experience, and investment objectives.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Karen Jackson is a portfolio manager. Jackson is friendly with David James, president of Acme Medical, a rapidly growing biotech company. James has provided Jackson with recommendations in the biotech industry, which she buys for her own portfolio before buying them for her clients. For three years, Jackson has also served on Acme Medical&#x27;s board of directors. She has received options and fees as compensation.<\/p><p>Recently, the board of Acme Medical decided to raise capital by voting to issue shares to the public. This was attractive to board members (including Jackson) who wanted to exercise their stock options and sell their shares to get cash. When the demand for initial public offerings (IPO) diminished, just before Acme Medical&#x27;s public offering, James asked Jackson to commit to a large purchase of the offering for her portfolios. Jackson had previously determined that Acme Medical was a questionable investment but agreed to reconsider at James&#x27; request. Her reevaluation confirmed the stock to be overpriced, but she nevertheless decided to purchase Acme Medical for her clients&#x27; portfolios.<\/p><p>Did Jackson violate Standard III(C) Suitability concerning portfolio recommendations and actions?<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "Jim Jones is an equity research analyst at Gamma funds. Because of his expertise in the telecommunications field, a Chinese telecommunications provider hires Jones as a consultant to help them identify potential investors. According to the Standards of Professional Conduct IV(A) related to duties to employer, Jones must:", "opts": ["describe to his employer in detail the activities related to this consulting arrangement.", "refuse this consulting arrangement.", "obtain verbal permission from his employer to engage in this consulting arrangement."], "ans": "A", "expl": "According to the Standards of Professional Conduct, Jones must disclose to his employer all outside compensation arrangements, describe to his employer in detail the activities that give rise to outside compensation, and obtain written permission from his employer in advance.", "explhtml": "<p>According to the Standards of Professional Conduct, Jones must disclose to his employer all outside compensation arrangements, describe to his employer in detail the activities that give rise to outside compensation, and obtain written permission from his employer in advance.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Jim Jones is an equity research analyst at Gamma funds. Because of his expertise in the telecommunications field, a Chinese telecommunications provider hires Jones as a consultant to help them identify potential investors. According to the Standards of Professional Conduct IV(A) related to duties to employer, Jones must:<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "With regard to the Smith account, O'Brien's actions are best described as being in:", "opts": ["compliance with all applicable CFA Institute Standards.", "violation of Standard V(B) - Communication with Clients and Prospective Clients.", "violation of Standard III(A) - Loyalty, Prudence, and Care."], "ans": "A", "expl": "O'Brien's actions are in full compliance with the Standards. He did appropriate research to determine the suitability of high-yield investments in Smith's account, and followed up regularly, as is required. O'Brien cannot read Smith's mind, nor is he expected to do so. It is incumbent upon Smith to notify O'Brien of a change in her risk tolerance and objectives if these change between annual updates.", "explhtml": "<p>O&#x27;Brien&#x27;s actions are in full compliance with the Standards. He did appropriate research to determine the suitability of high-yield investments in Smith&#x27;s account, and followed up regularly, as is required. O&#x27;Brien cannot read Smith&#x27;s mind, nor is he expected to do so. It is incumbent upon Smith to notify O&#x27;Brien of a change in her risk tolerance and objectives if these change between annual updates.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 12–15<\/summary><div class=\"vig-body\"><p>Sean O'Brien, CFA, works for Paradigm Portfolios as a portfolio manager. He manages a high- yield (junk bond) fund as well as 14 large private accounts. O'Brien's compensation for the high- yield fund is performance based, while the private-account compensation is based upon a percentage of assets. The company's compensation packages are a closely guarded secret, and kept in-house.<\/p><p>O'Brien routinely takes personal positions in securities held in the high-yield fund, a practice allowed by Paradigm. On his way to work, he learns over the radio that a hurricane is heading toward the location of Villa Real Resorts in Mexico. Landfall is expected by Dec. 23, which could potentially ruin the lucrative Christmas vacation season. If the hurricane hits as expected, it will have a devastating affect on cash flows, and O'Brien believes Villa Real might default on its bonds. Both O'Brien and the high-yield fund hold Villa Real bonds. After arriving at the office, O'Brien sells off the fund's Villa Real holdings, then immediately liquidates his own position.<\/p><p>Periodically O'Brien buys convertible bonds in the high-yield fund. When these are converted into common equity he typically does not vote the proxies, saying. \"the fund is not an equity fund, and the equities are usually sold within the year.\" Before accepting a new account, O'Brien conducts a thorough investigation into his client's financial situation, investment experience, and investment objectives. The information is updated annually through a survey mailed to the client and returned to Paradigm, and O'Brien follows up with a telephone call to the client. Judy Smith's portfolio was deemed suitable for the inclusion of high-yield bonds based upon the initial investigation, and reaffirmed at the last three annual updates. It is three months since Smith's last annual update, and the high-yield market has been weak. Smith files a lawsuit alleging malfeasance on the part of O'Brien.<\/p><p>In the course of effecting money-market transactions for the accounts, O'Brien routinely places numerous trades, allocating the paper with marginally higher yields to the high-yield fund and the remainder to the private accounts.<\/p><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>With regard to the Smith account, O&#x27;Brien&#x27;s actions are best described as being in:<\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "Which of the following statements about O'Brien's use of convertible bonds is CORRECT?", "opts": ["O’Brien’s lack of expertise in equity analysis, despite usage of the CFA mark, represents a violation of Standard VII(A): Conduct as Members and Candidates in the CFA Program.", "Unless O’Brien makes arrangements for someone else to vote the proxies, he is in violation of Standard III(A): Loyalty, Prudence, and Care.", "The use of convertible bonds in O’Brien’s high-yield fund violates Standard V(A): Diligence and Reasonable Basis."], "ans": "B", "expl": "O'Brien has a fiduciary duty to ensure that the proxies are voted according to the best interests of his clients. He need not do the voting himself, but he must set up a system by which somebody takes responsibility. There is nothing about convertible bonds that makes them necessarily unfit for a high-yield fund. If O'Brien earned the CFA designation and kept his dues up to date, he can use the designation even if he specializes. Standard I(C), Misrepresentation, relates to marketing services, not voting proxies.", "explhtml": "<p>O&#x27;Brien has a fiduciary duty to ensure that the proxies are voted according to the best interests of his clients. He need not do the voting himself, but he must set up a system by which somebody takes responsibility. There is nothing about convertible bonds that makes them necessarily unfit for a high-yield fund. If O&#x27;Brien earned the CFA designation and kept his dues up to date, he can use the designation even if he specializes. Standard I(C), Misrepresentation, relates to marketing services, not voting proxies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 12–15<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sean O'Brien, CFA, works for Paradigm Portfolios as a portfolio manager. He manages a high- yield (junk bond) fund as well as 14 large private accounts. O'Brien's compensation for the high- yield fund is performance based, while the private-account compensation is based upon a percentage of assets. The company's compensation packages are a closely guarded secret, and kept in-house.<\/p><p>O'Brien routinely takes personal positions in securities held in the high-yield fund, a practice allowed by Paradigm. On his way to work, he learns over the radio that a hurricane is heading toward the location of Villa Real Resorts in Mexico. Landfall is expected by Dec. 23, which could potentially ruin the lucrative Christmas vacation season. If the hurricane hits as expected, it will have a devastating affect on cash flows, and O'Brien believes Villa Real might default on its bonds. Both O'Brien and the high-yield fund hold Villa Real bonds. After arriving at the office, O'Brien sells off the fund's Villa Real holdings, then immediately liquidates his own position.<\/p><p>Periodically O'Brien buys convertible bonds in the high-yield fund. When these are converted into common equity he typically does not vote the proxies, saying. \"the fund is not an equity fund, and the equities are usually sold within the year.\" Before accepting a new account, O'Brien conducts a thorough investigation into his client's financial situation, investment experience, and investment objectives. The information is updated annually through a survey mailed to the client and returned to Paradigm, and O'Brien follows up with a telephone call to the client. Judy Smith's portfolio was deemed suitable for the inclusion of high-yield bonds based upon the initial investigation, and reaffirmed at the last three annual updates. It is three months since Smith's last annual update, and the high-yield market has been weak. Smith files a lawsuit alleging malfeasance on the part of O'Brien.<\/p><p>In the course of effecting money-market transactions for the accounts, O'Brien routinely places numerous trades, allocating the paper with marginally higher yields to the high-yield fund and the remainder to the private accounts.<\/p><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>Which of the following statements about O&#x27;Brien&#x27;s use of convertible bonds is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 14, "q": "With regard to the Villa Real investment, O'Brien's actions:", "opts": ["violate neither the reasonable-basis Standard nor the priority-of-transactions Standard.", "do not violate the fiduciary-duties Standard but do violate the priority-oftransactions Standard.", "violate the reasonable-basis Standard and the fiduciary-duties Standard."], "ans": "A", "expl": "O'Brien is allowed to invest in securities he covers according to company policy. Since he traded for the firm's accounts first and his personal account second, O'Brien did not violate a fiduciary duty or the priority-of-transactions Standard. Since O'Brien acted on information he obtained through a weather forecast, he did not use any material nonpublic information. His sell decision was based on his knowledge of the company and its circumstances, and, as such, is not a violation of the reasonable basis standard.", "explhtml": "<p>O&#x27;Brien is allowed to invest in securities he covers according to company policy. Since he traded for the firm&#x27;s accounts first and his personal account second, O&#x27;Brien did not violate a fiduciary duty or the priority-of-transactions Standard. Since O&#x27;Brien acted on information he obtained through a weather forecast, he did not use any material nonpublic information. His sell decision was based on his knowledge of the company and its circumstances, and, as such, is not a violation of the reasonable basis standard.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 12–15<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sean O'Brien, CFA, works for Paradigm Portfolios as a portfolio manager. He manages a high- yield (junk bond) fund as well as 14 large private accounts. O'Brien's compensation for the high- yield fund is performance based, while the private-account compensation is based upon a percentage of assets. The company's compensation packages are a closely guarded secret, and kept in-house.<\/p><p>O'Brien routinely takes personal positions in securities held in the high-yield fund, a practice allowed by Paradigm. On his way to work, he learns over the radio that a hurricane is heading toward the location of Villa Real Resorts in Mexico. Landfall is expected by Dec. 23, which could potentially ruin the lucrative Christmas vacation season. If the hurricane hits as expected, it will have a devastating affect on cash flows, and O'Brien believes Villa Real might default on its bonds. Both O'Brien and the high-yield fund hold Villa Real bonds. After arriving at the office, O'Brien sells off the fund's Villa Real holdings, then immediately liquidates his own position.<\/p><p>Periodically O'Brien buys convertible bonds in the high-yield fund. When these are converted into common equity he typically does not vote the proxies, saying. \"the fund is not an equity fund, and the equities are usually sold within the year.\" Before accepting a new account, O'Brien conducts a thorough investigation into his client's financial situation, investment experience, and investment objectives. The information is updated annually through a survey mailed to the client and returned to Paradigm, and O'Brien follows up with a telephone call to the client. Judy Smith's portfolio was deemed suitable for the inclusion of high-yield bonds based upon the initial investigation, and reaffirmed at the last three annual updates. It is three months since Smith's last annual update, and the high-yield market has been weak. Smith files a lawsuit alleging malfeasance on the part of O'Brien.<\/p><p>In the course of effecting money-market transactions for the accounts, O'Brien routinely places numerous trades, allocating the paper with marginally higher yields to the high-yield fund and the remainder to the private accounts.<\/p><\/div><\/details><div class=\"pp-topic\">Module 42.1, LOS 42.b<\/div><div class=\"qtext\"><p>With regard to the Villa Real investment, O&#x27;Brien&#x27;s actions:<\/p><\/div>", "subj": "ethics"}, {"n": 15, "q": "O'Brien's money-market allocations represent:", "opts": ["a breach of his fiduciary duty to mutual-fund account owners.", "reasonable actions, as they simply reflect the nature of his compensation.", "a violation of Standard III(B): Fair Dealing."], "ans": "C", "expl": "O'Brien breached his fiduciary duty to private-account holders, but not to owners of the fund. He did violate the fair-dealing Standard by attempting to boost his compensation.", "explhtml": "<p>O&#x27;Brien breached his fiduciary duty to private-account holders, but not to owners of the fund. He did violate the fair-dealing Standard by attempting to boost his compensation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 12–15<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sean O'Brien, CFA, works for Paradigm Portfolios as a portfolio manager. He manages a high- yield (junk bond) fund as well as 14 large private accounts. O'Brien's compensation for const CFG = {"title": "Reading 42 — Application of the Code and Standards Level II", "subtitle": "CFA Level II · 16 câu · Kaplan Schweser QBank 2025 (6 câu đơn · 10 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{

      else { grade(true); }
