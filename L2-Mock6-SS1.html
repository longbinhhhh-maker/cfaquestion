.","k-nearest neighbor model."],"ans":"A","expl":"Penalized regressions impose a penalty proportional to the number of features included in the model, and hence, only use the variables with the most independent predictive power.\n(Module 3.2, LOS 3.c)","explhtml":"<p>Penalized regressions impose a penalty proportional to the number of features included in the model, and hence, only use the variables with the most independent predictive power.<\/p><p>(Module 3.2, LOS 3.c)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Vasili Bobrow is a Level III candidate in the CFA program. Bobrow wants to make use of the skills he developed during his graduate studies in machine learning, to seek out promising investment opportunities: he seeks to identify the Russian companies that are most likely to announce a positive earnings surprise. Bobrow collects data on listed companies that are part of the MOEX index (previously the MICEX index) over the last 10 years. Bobrow&#x27;s sample consists of 400 observations, equally split between observations of positive earnings surprise, and no positive earnings surprise. For each observation, Bobrow collects company-specific data for 20 financial variables used in the model.<\/p><p>Bobrow has several concerns about his model:<\/p><p>Concern 1: The number of variables may be too large, and some of these variables were discovered to be highly correlated.<\/p><p>Concern 2: I want pruning in my model.<\/p><p>Concern 3: Model error leading to false positives should be minimized.<\/p><p>Concern 4: My model has a high in-sample error rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Bobrow would most appropriately handle Concern 1 by using a:<\/p><\/div>","subj":"quant"},{"n":6,"q":"Bobrow's Concern 2 would be most applicable to:","opts":["an ensemble and learning forest model.","a classification and regression tree model.","a random forest."],"ans":"B","expl":"Pruning is a regularization technique used for classification and regression trees (CART), whereby those sections of the tree with limited predictive power are trimmed (i.e., pruned).\n(Module 3.2, LOS 3.c)","explhtml":"<p>Pruning is a regularization technique used for classification and regression trees (CART), whereby those sections of the tree with limited predictive power are trimmed (i.e., pruned).<\/p><p>(Module 3.2, LOS 3.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vasili Bobrow is a Level III candidate in the CFA program. Bobrow wants to make use of the skills he developed during his graduate studies in machine learning, to seek out promising investment opportunities: he seeks to identify the Russian companies that are most likely to announce a positive earnings surprise. Bobrow collects data on listed companies that are part of the MOEX index (previously the MICEX index) over the last 10 years. Bobrow&#x27;s sample consists of 400 observations, equally split between observations of positive earnings surprise, and no positive earnings surprise. For each observation, Bobrow collects company-specific data for 20 financial variables used in the model.<\/p><p>Bobrow has several concerns about his model:<\/p><p>Concern 1: The number of variables may be too large, and some of these variables were discovered to be highly correlated.<\/p><p>Concern 2: I want pruning in my model.<\/p><p>Concern 3: Model error leading to false positives should be minimized.<\/p><p>Concern 4: My model has a high in-sample error rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Bobrow&#x27;s Concern 2 would be most applicable to:<\/p><\/div>","subj":"quant"},{"n":7,"q":"Bobrow would most appropriately address Concern 3 by using a model with high:","opts":["precision.","recall.","F1 score."],"ans":"A","expl":"Models with high precision have a lower proportion of false positives (but a higher proportion of false negatives).\n(Module 4.3, LOS 4.c)","explhtml":"<p>Models with high precision have a lower proportion of false positives (but a higher proportion of false negatives).<\/p><p>(Module 4.3, LOS 4.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vasili Bobrow is a Level III candidate in the CFA program. Bobrow wants to make use of the skills he developed during his graduate studies in machine learning, to seek out promising investment opportunities: he seeks to identify the Russian companies that are most likely to announce a positive earnings surprise. Bobrow collects data on listed companies that are part of the MOEX index (previously the MICEX index) over the last 10 years. Bobrow&#x27;s sample consists of 400 observations, equally split between observations of positive earnings surprise, and no positive earnings surprise. For each observation, Bobrow collects company-specific data for 20 financial variables used in the model.<\/p><p>Bobrow has several concerns about his model:<\/p><p>Concern 1: The number of variables may be too large, and some of these variables were discovered to be highly correlated.<\/p><p>Concern 2: I want pruning in my model.<\/p><p>Concern 3: Model error leading to false positives should be minimized.<\/p><p>Concern 4: My model has a high in-sample error rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Bobrow would most appropriately address Concern 3 by using a model with high:<\/p><\/div>","subj":"quant"},{"n":8,"q":"The error mentioned in Bobrow's Concern 4 is best described as:","opts":["bias error.","variance error.","base error."],"ans":"A","expl":"Bias error is the error in-sample (i.e., using training data). Variance error is out-of-sample error. Base error occurs due to the randomness of the data. (Module 3.1, LOS 3.b)","explhtml":"<p>Bias error is the error in-sample (i.e., using training data). Variance error is out-of-sample error. Base error occurs due to the randomness of the data. (Module 3.1, LOS 3.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vasili Bobrow is a Level III candidate in the CFA program. Bobrow wants to make use of the skills he developed during his graduate studies in machine learning, to seek out promising investment opportunities: he seeks to identify the Russian companies that are most likely to announce a positive earnings surprise. Bobrow collects data on listed companies that are part of the MOEX index (previously the MICEX index) over the last 10 years. Bobrow&#x27;s sample consists of 400 observations, equally split between observations of positive earnings surprise, and no positive earnings surprise. For each observation, Bobrow collects company-specific data for 20 financial variables used in the model.<\/p><p>Bobrow has several concerns about his model:<\/p><p>Concern 1: The number of variables may be too large, and some of these variables were discovered to be highly correlated.<\/p><p>Concern 2: I want pruning in my model.<\/p><p>Concern 3: Model error leading to false positives should be minimized.<\/p><p>Concern 4: My model has a high in-sample error rate.<\/p><\/div><\/details><div class=\"qtext\"><p>The error mentioned in Bobrow&#x27;s Concern 4 is best described as:<\/p><\/div>","subj":"quant"},{"n":9,"q":"Shetty's comment 1 is most likely:","opts":["correct.","correct only in the short term.","incorrect."],"ans":"C","expl":"Since covered interest rate parity always holds (by arbitrage), if forward rates are unbiased estimators of future spot rates, uncovered interest rate parity would also hold.\n(Module 5.2, LOS 5.f)","explhtml":"<p>Since covered interest rate parity always holds (by arbitrage), if forward rates are unbiased estimators of future spot rates, uncovered interest rate parity would also hold.<\/p><p>(Module 5.2, LOS 5.f)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics<\/summary><div class=\"vig-body\"><p>Mandira Shetty works as a global strategist for Dema Bank. She is meeting Rameshwar Patwaran who is the head of investment to discuss which countries would present the best investment opportunities for the short to medium term. During the meeting, Shetty made the following comment:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Even if forward quotes are unbiased estimators of future spot rates, uncovered interest rate parity would not hold.<\/td><\/tr><\/table><\/div><p>Patwaran asked Shetty whether the bank&#x27;s forward FX Contract 9877 in the currency market was in the money. Shetty shared  Exhibit 1: FX Contract 9877 with Patwaran.<\/p><p>Exhibit 1: FX Contract 9877<\/p><p>90-day Contract for long 1 million AUD vs. USD at an all in rate of USD/AUD 1.0405.<\/p><p>Time elapsed since inception: 30 days<\/p><div class=\"tbl\"><table><tr><td>Quotes<\/td><td>USD/AUD<\/td><td><\/td><\/tr><tr><td>Spot rate<\/td><td>1.0501-1.0520<\/td><td><\/td><\/tr><tr><td>30-day forward<\/td><td>1.0492-1.0500<\/td><td><\/td><\/tr><tr><td>60-day forward<\/td><td>1.0491-1.0502<\/td><td><\/td><\/tr><tr><td>Int Rates<\/td><td>AUD<\/td><td>USD<\/td><\/tr><tr><td>30-day<\/td><td>1.25%<\/td><td>0.25%<\/td><\/tr><tr><td>60-day<\/td><td>1.35%<\/td><td>0.30%<\/td><\/tr><\/table><\/div><p>Patwaran then showed Shetty a research report that contained the economic data of selected countries ( Exhibit 2: Selected Economic Data (2000–2010)) and asked if it is possible to tell which country will grow faster than the others.<\/p><p>Exhibit 2: Selected Economic Data (2000–2010)<\/p><div class=\"tbl\"><table><tr><td>Growth rate<\/td><td>Growth Growth rate of total<\/td><td>Share of labor<\/td><td><\/td><td><\/td><\/tr><tr><td>of labor<\/td><td>rate of factor productivity<\/td><td>in national<\/td><td><\/td><td><\/td><\/tr><tr><td>force<\/td><td>capital<\/td><td>income<\/td><td><\/td><td><\/td><\/tr><tr><td>Alphanista<\/td><td>2.2%<\/td><td>1.5%<\/td><td>2.0%<\/td><td>0.6<\/td><\/tr><tr><td>Balastu<\/td><td>2.9%<\/td><td>3.5%<\/td><td>0.5%<\/td><td>0.7<\/td><\/tr><tr><td>Catmandu<\/td><td>2.6%<\/td><td>1.9%<\/td><td>1.5%<\/td><td>0.7<\/td><\/tr><\/table><\/div><p>Patwaran then performed a comparison of the historical growth rates of selected countries given in the same research report and made the following comment:<\/p><div class=\"tbl\"><table><tr><td>Comment 2:<\/td><td>It seems that having natural resources does not always help a country to grow faster, as can be seen from the examples of<\/td><\/tr><\/table><\/div><p>Venezuela and Nigeria. I am of the opinion that some of these resource-rich countries are not growing as fast because the economic institutions necessary for growth are not developed. Depreciation of the domestic currencies of these countries is hurting their manufacturing sectors and making them uncompetitive.<\/p><\/div><\/details><div class=\"qtext\"><p>Shetty&#x27;s comment 1 is most likely:<\/p><\/div>","subj":"economics"},{"n":10,"q":"Given  Exhibit 1: FX Contract 9877, the mark-to-market valuation of contract FX 9877 is closest to:","opts":["–8,595 USD.","+8,590 USD.","+9,700 USD"],"ans":"B","expl":"(FPt−FP)(contract size) Vt= Days\n[1+R( 360 (1.0491−1.0405)(1,000,000) | )]\nVt= 60 | = USD 8,595\n[1+0.0030( 360 | )]\n(Module 5.2, LOS 5.d)","explhtml":"<p>(FPt−FP)(contract size) Vt= Days<\/p><div class=\"tbl\"><table><tr><td>[1+R( 360 (1.0491−1.0405)(1,000,000)<\/td><td>)]<\/td><\/tr><tr><td>Vt= 60<\/td><td>= USD 8,595<\/td><\/tr><tr><td>[1+0.0030( 360<\/td><td>)]<\/td><\/tr><\/table><\/div><p>(Module 5.2, LOS 5.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mandira Shetty works as a global strategist for Dema Bank. She is meeting Rameshwar Patwaran who is the head of investment to discuss which countries would present the best investment opportunities for the short to medium term. During the meeting, Shetty made the following comment:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Even if forward quotes are unbiased estimators of future spot rates, uncovered interest rate parity would not hold.<\/td><\/tr><\/table><\/div><p>Patwaran asked Shetty whether the bank&#x27;s forward FX Contract 9877 in the currency market was in the money. Shetty shared  Exhibit 1: FX Contract 9877 with Patwaran.<\/p><p>Exhibit 1: FX Contract 9877<\/p><p>90-day Contract for long 1 million AUD vs. USD at an all in rate of USD/AUD 1.0405.<\/p><p>Time elapsed since inception: 30 days<\/p><div class=\"tbl\"><table><tr><td>Quotes<\/td><td>USD/AUD<\/td><td><\/td><\/tr><tr><td>Spot rate<\/td><td>1.0501-1.0520<\/td><td><\/td><\/tr><tr><td>30-day forward<\/td><td>1.0492-1.0500<\/td><td><\/td><\/tr><tr><td>60-day forward<\/td><td>1.0491-1.0502<\/td><td><\/td><\/tr><tr><td>Int Rates<\/td><td>AUD<\/td><td>USD<\/td><\/tr><tr><td>30-day<\/td><td>1.25%<\/td><td>0.25%<\/td><\/tr><tr><td>60-day<\/td><td>1.35%<\/td><td>0.30%<\/td><\/tr><\/table><\/div><p>Patwaran then showed Shetty a research report that contained the economic data of selected countries ( Exhibit 2: Selected Economic Data (2000–2010)) and asked if it is possible to tell which country will grow faster than the others.<\/p><p>Exhibit 2: Selected Economic Data (2000–2010)<\/p><div class=\"tbl\"><table><tr><td>Growth rate<\/td><td>Growth Growth rate of total<\/td><td>Share of labor<\/td><td><\/td><td><\/td><\/tr><tr><td>of labor<\/td><td>rate of factor productivity<\/td><td>in national<\/td><td><\/td><td><\/td><\/tr><tr><td>force<\/td><td>capital<\/td><td>income<\/td><td><\/td><td><\/td><\/tr><tr><td>Alphanista<\/td><td>2.2%<\/td><td>1.5%<\/td><td>2.0%<\/td><td>0.6<\/td><\/tr><tr><td>Balastu<\/td><td>2.9%<\/td><td>3.5%<\/td><td>0.5%<\/td><td>0.7<\/td><\/tr><tr><td>Catmandu<\/td><td>2.6%<\/td><td>1.9%<\/td><td>1.5%<\/td><td>0.7<\/td><\/tr><\/table><\/div><p>Patwaran then performed a comparison of the historical growth rates of selected countries given in the same research report and made the following comment:<\/p><div class=\"tbl\"><table><tr><td>Comment 2:<\/td><td>It seems that having natural resources does not always help a country to grow faster, as can be seen from the examples of<\/td><\/tr><\/table><\/div><p>Venezuela and Nigeria. I am of the opinion that some of these resource-rich countries are not growing as fast because the economic institutions necessary for growth are not developed. Depreciation of the domestic currencies of these countries is hurting their manufacturing sectors and making them uncompetitive.<\/p><\/div><\/details><div class=\"qtext\"><p>Given  Exhibit 1: FX Contract 9877, the mark-to-market valuation of contract FX 9877 is closest to:<\/p><\/div>","subj":"economics"},{"n":11,"q":"Using the data in  Exhibit 2: Selected Economic Data (2000–2010) and the Cobb-Douglas production function, the country with the highest growth rate in potential GDP is:","opts":["Alphanista.","Balastu.","Catmandu."],"ans":"A","expl":"Growth | Share of\nGrowth | Growth rate of | Growth rate\nrate of | labor in\nrate of | total factor | of potential\nlabor | national\ncapital | productivity | GDP*\nforce | income\nAlphanista | 2.2% | 1.5% | 2.0% | 0.6 | 3.92%\nBalastu | 2.9% | 3.5% | 0.5% | 0.7 | 3.58%\nCatmandu | 2.6% | 1.9% | 1.5% | 0.7 | 3.89%\n*Growth in potential GDP = Growth of total factor productivity + (share of labor × growth in labor) + (share of capital × growth in capital) Alphanista: 2.0% + (0.6 × 2.2%) + (0.4 × 1.5%) = 3.92% Balastu: 0.5% + (0.7 × 2.9%) + (0.3 × 3.5%) = 3.58% Catmandu: 1.5% + (0.7 × 2.6%) + (0.3 × 1.9%) = 3.89% (Module 6.2, LOS 6.e)","explhtml":"<div class=\"tbl\"><table><tr><td>Growth<\/td><td>Share of<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Growth<\/td><td>Growth rate of<\/td><td>Growth rate<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>rate of<\/td><td>labor in<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>rate of<\/td><td>total factor<\/td><td>of potential<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>labor<\/td><td>national<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>capital<\/td><td>productivity<\/td><td>GDP*<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>force<\/td><td>income<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Alphanista<\/td><td>2.2%<\/td><td>1.5%<\/td><td>2.0%<\/td><td>0.6<\/td><td>3.92%<\/td><\/tr><tr><td>Balastu<\/td><td>2.9%<\/td><td>3.5%<\/td><td>0.5%<\/td><td>0.7<\/td><td>3.58%<\/td><\/tr><tr><td>Catmandu<\/td><td>2.6%<\/td><td>1.9%<\/td><td>1.5%<\/td><td>0.7<\/td><td>3.89%<\/td><\/tr><\/table><\/div><p>*Growth in potential GDP = Growth of total factor productivity + (share of labor × growth in labor) + (share of capital × growth in capital) Alphanista: 2.0% + (0.6 × 2.2%) + (0.4 × 1.5%) = 3.92% Balastu: 0.5% + (0.7 × 2.9%) + (0.3 × 3.5%) = 3.58% Catmandu: 1.5% + (0.7 × 2.6%) + (0.3 × 1.9%) = 3.89% (Module 6.2, LOS 6.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mandira Shetty works as a global strategist for Dema Bank. She is meeting Rameshwar Patwaran who is the head of investment to discuss which countries would present the best investment opportunities for the short to medium term. During the meeting, Shetty made the following comment:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Even if forward quotes are unbiased estimators of future spot rates, uncovered interest rate parity would not hold.<\/td><\/tr><\/table><\/div><p>Patwaran asked Shetty whether the bank&#x27;s forward FX Contract 9877 in the currency market was in the money. Shetty shared  Exhibit 1: FX Contract 9877 with Patwaran.<\/p><p>Exhibit 1: FX Contract 9877<\/p><p>90-day Contract for long 1 million AUD vs. USD at an all in rate of USD/AUD 1.0405.<\/p><p>Time elapsed since inception: 30 days<\/p><div class=\"tbl\"><table><tr><td>Quotes<\/td><td>USD/AUD<\/td><td><\/td><\/tr><tr><td>Spot rate<\/td><td>1.0501-1.0520<\/td><td><\/td><\/tr><tr><td>30-day forward<\/td><td>1.0492-1.0500<\/td><td><\/td><\/tr><tr><td>60-day forward<\/td><td>1.0491-1.0502<\/td><td><\/td><\/tr><tr><td>Int Rates<\/td><td>AUD<\/td><td>USD<\/td><\/tr><tr><td>30-day<\/td><td>1.25%<\/td><td>0.25%<\/td><\/tr><tr><td>60-day<\/td><td>1.35%<\/td><td>0.30%<\/td><\/tr><\/table><\/div><p>Patwaran then showed Shetty a research report that contained the economic data of selected countries ( Exhibit 2: Selected Economic Data (2000–2010)) and asked if it is possible to tell which country will grow faster than the others.<\/p><p>Exhibit 2: Selected Economic Data (2000–2010)<\/p><div class=\"tbl\"><table><tr><td>Growth rate<\/td><td>Growth Growth rate of total<\/td><td>Share of labor<\/td><td><\/td><td><\/td><\/tr><tr><td>of labor<\/td><td>rate of factor productivity<\/td><td>in national<\/td><td><\/td><td><\/td><\/tr><tr><td>force<\/td><td>capital<\/td><td>income<\/td><td><\/td><td><\/td><\/tr><tr><td>Alphanista<\/td><td>2.2%<\/td><td>1.5%<\/td><td>2.0%<\/td><td>0.6<\/td><\/tr><tr><td>Balastu<\/td><td>2.9%<\/td><td>3.5%<\/td><td>0.5%<\/td><td>0.7<\/td><\/tr><tr><td>Catmandu<\/td><td>2.6%<\/td><td>1.9%<\/td><td>1.5%<\/td><td>0.7<\/td><\/tr><\/table><\/div><p>Patwaran then performed a comparison of the historical growth rates of selected countries given in the same research report and made the following comment:<\/p><div class=\"tbl\"><table><tr><td>Comment 2:<\/td><td>It seems that having natural resources does not always help a country to grow faster, as can be seen from the examples of<\/td><\/tr><\/table><\/div><p>Venezuela and Nigeria. I am of the opinion that some of these resource-rich countries are not growing as fast because the economic institutions necessary for growth are not developed. Depreciation of the domestic currencies of these countries is hurting their manufacturing sectors and making them uncompetitive.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in  Exhibit 2: Selected Economic Data (2000–2010) and the Cobb-Douglas production function, the country with the highest growth rate in potential GDP is:<\/p><\/div>","subj":"economics"},{"n":12,"q":"Of the three factors mentioned in Comment 2, which of the following is least likely to be accurate?","opts":["The depreciation of the domestic currency.","The manufacturing sector is not competitive on a global basis.","Economic institutions necessary for growth are not developed."],"ans":"A","expl":"A resource-rich country may not be growing as fast because the economic institutions necessary for growth are not developed. The appreciation of the domestic currency (not depreciation) makes the other domestic industries, such as manufacturing, less\n(Module 6.2, LOS 6.f)","explhtml":"<p>A resource-rich country may not be growing as fast because the economic institutions necessary for growth are not developed. The appreciation of the domestic currency (not depreciation) makes the other domestic industries, such as manufacturing, less<\/p><p>(Module 6.2, LOS 6.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mandira Shetty works as a global strategist for Dema Bank. She is meeting Rameshwar Patwaran who is the head of investment to discuss which countries would present the best investment opportunities for the short to medium term. During the meeting, Shetty made the following comment:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Even if forward quotes are unbiased estimators of future spot rates, uncovered interest rate parity would not hold.<\/td><\/tr><\/table><\/div><p>Patwaran asked Shetty whether the bank&#x27;s forward FX Contract 9877 in the currency market was in the money. Shetty shared  Exhibit 1: FX Contract 9877 with Patwaran.<\/p><p>Exhibit 1: FX Contract 9877<\/p><p>90-day Contract for long 1 million AUD vs. USD at an all in rate of USD/AUD 1.0405.<\/p><p>Time elapsed since inception: 30 days<\/p><div class=\"tbl\"><table><tr><td>Quotes<\/td><td>USD/AUD<\/td><td><\/td><\/tr><tr><td>Spot rate<\/td><td>1.0501-1.0520<\/td><td><\/td><\/tr><tr><td>30-day forward<\/td><td>1.0492-1.0500<\/td><td><\/td><\/tr><tr><td>60-day forward<\/td><td>1.0491-1.0502<\/td><td><\/td><\/tr><tr><td>Int Rates<\/td><td>AUD<\/td><td>USD<\/td><\/tr><tr><td>30-day<\/td><td>1.25%<\/td><td>0.25%<\/td><\/tr><tr><td>60-day<\/td><td>1.35%<\/td><td>0.30%<\/td><\/tr><\/table><\/div><p>Patwaran then showed Shetty a research report that contained the economic data of selected countries ( Exhibit 2: Selected Economic Data (2000–2010)) and asked if it is possible to tell which country will grow faster than the others.<\/p><p>Exhibit 2: Selected Economic Data (2000–2010)<\/p><div class=\"tbl\"><table><tr><td>Growth rate<\/td><td>Growth Growth rate of total<\/td><td>Share of labor<\/td><td><\/td><td><\/td><\/tr><tr><td>of labor<\/td><td>rate of factor productivity<\/td><td>in national<\/td><td><\/td><td><\/td><\/tr><tr><td>force<\/td><td>capital<\/td><td>income<\/td><td><\/td><td><\/td><\/tr><tr><td>Alphanista<\/td><td>2.2%<\/td><td>1.5%<\/td><td>2.0%<\/td><td>0.6<\/td><\/tr><tr><td>Balastu<\/td><td>2.9%<\/td><td>3.5%<\/td><td>0.5%<\/td><td>0.7<\/td><\/tr><tr><td>Catmandu<\/td><td>2.6%<\/td><td>1.9%<\/td><td>1.5%<\/td><td>0.7<\/td><\/tr><\/table><\/div><p>Patwaran then performed a comparison of the historical growth rates of selected countries given in the same research report and made the following comment:<\/p><div class=\"tbl\"><table><tr><td>Comment 2:<\/td><td>It seems that having natural resources does not always help a country to grow faster, as can be seen from the examples of<\/td><\/tr><\/table><\/div><p>Venezuela and Nigeria. I am of the opinion that some of these resource-rich countries are not growing as fast because the economic institutions necessary for growth are not developed. Depreciation of the domestic currencies of these countries is hurting their manufacturing sectors and making them uncompetitive.<\/p><\/div><\/details><div class=\"qtext\"><p>Of the three factors mentioned in Comment 2, which of the following is least likely to be accurate?<\/p><\/div>","subj":"economics"},{"n":13,"q":"Which growth model theories do Comments 1 and 2 originate from?","opts":["Both comments refer to the neoclassical model.","Both comments refer to the endogenous growth theory.","Comment 1 refers to the endogenous growth theory and Comment 2 refers to the neoclassical model."],"ans":"C","expl":"The neoclassical model focuses on estimating an economy's steady state growth rate. TFP growth rate is an exogenous variable. The steady state growth rate in productivity depends on the TFP growth rate and labor's share of output. In the endogenous growth model, technological progress enhances productivity of both labor and capital and there is no steady state in this model. An increase in savings and investments can permanently increase the growth rate.\n(Module 6.3, LOS 6.i)","explhtml":"<p>The neoclassical model focuses on estimating an economy&#x27;s steady state growth rate. TFP growth rate is an exogenous variable. The steady state growth rate in productivity depends on the TFP growth rate and labor&#x27;s share of output. In the endogenous growth model, technological progress enhances productivity of both labor and capital and there is no steady state in this model. An increase in savings and investments can permanently increase the growth rate.<\/p><p>(Module 6.3, LOS 6.i)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Economics<\/summary><div class=\"vig-body\"><p>Daan De Vries heads the research department at Mega Bank. De Vries wants to prepare a research report on global investment outlook for the bank&#x27;s board of directors. De Vries sets up a meeting with bank&#x27;s chief economist, Dr. Emma Van Dijk, to get her opinion on some of the items in the report.<\/p><p>De Vries told Van Dijk that he attended a seminar recently where the speaker mentioned the following:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>The economy does not converge to a steady state rate of growth independent of saving/investment decisions.<\/td><\/tr><tr><td>Comment 2:<\/td><td>Growth in TFP is exogenous to the model but the steady state growth rate depends on TFP growth rate.<\/td><\/tr><tr><td>Comment 3:<\/td><td>A poor country that implements the necessary institutional reforms can converge to the income level of the wealthier nations.<\/td><\/tr><\/table><\/div><p>Van Dijk states that changing regulatory environment should be a key focus driving expectations about asset returns globally. She makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Regulatory burden is generally easy to measure ex-ante including the direct and indirect costs.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Prospectively, regulators often focus only on the direct costs arising out of a regulation while conducting their cost-benefit analysis.<\/td><\/tr><\/table><\/div><p>Van Dijk also identified several countries that were adopting new requirements that call for OTC derivative contracts to be now cleared via a central clearing house with associated standardized margin requirements. Van Dijk recommended that Mega Bank avoid trading swaps in those countries.<\/p><\/div><\/details><div class=\"qtext\"><p>Which growth model theories do Comments 1 and 2 originate from?<\/p><\/div>","subj":"economics"},{"n":14,"q":"Comment 3 is most likely referring to:","opts":["club convergence.","absolute convergence.","conditional convergence."],"ans":"A","expl":"Absolute convergence: Developing countries, regardless of their characteristics, will catch up and match the per capita output of developed countries over time.\nConditional convergence: A poorer country will converge to the same steady state growth rate and the same level of per capita output as a richer nation if it has the same population growth rate, saving rate, and production function.\nClub convergence: Countries that are members of the \"club\" converge to the income level of the richest countries in the world, while countries outside the club continue to fall behind. A poor country can join the club by making the necessary institutional changes.\n(Module 6.3, LOS 6.j)","explhtml":"<p>Absolute convergence: Developing countries, regardless of their characteristics, will catch up and match the per capita output of developed countries over time.<\/p><p>Conditional convergence: A poorer country will converge to the same steady state growth rate and the same level of per capita output as a richer nation if it has the same population growth rate, saving rate, and production function.<\/p><p>Club convergence: Countries that are members of the &quot;club&quot; converge to the income level of the richest countries in the world, while countries outside the club continue to fall behind. A poor country can join the club by making the necessary institutional changes.<\/p><p>(Module 6.3, LOS 6.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Daan De Vries heads the research department at Mega Bank. De Vries wants to prepare a research report on global investment outlook for the bank&#x27;s board of directors. De Vries sets up a meeting with bank&#x27;s chief economist, Dr. Emma Van Dijk, to get her opinion on some of the items in the report.<\/p><p>De Vries told Van Dijk that he attended a seminar recently where the speaker mentioned the following:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>The economy does not converge to a steady state rate of growth independent of saving/investment decisions.<\/td><\/tr><tr><td>Comment 2:<\/td><td>Growth in TFP is exogenous to the model but the steady state growth rate depends on TFP growth rate.<\/td><\/tr><tr><td>Comment 3:<\/td><td>A poor country that implements the necessary institutional reforms can converge to the income level of the wealthier nations.<\/td><\/tr><\/table><\/div><p>Van Dijk states that changing regulatory environment should be a key focus driving expectations about asset returns globally. She makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Regulatory burden is generally easy to measure ex-ante including the direct and indirect costs.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Prospectively, regulators often focus only on the direct costs arising out of a regulation while conducting their cost-benefit analysis.<\/td><\/tr><\/table><\/div><p>Van Dijk also identified several countries that were adopting new requirements that call for OTC derivative contracts to be now cleared via a central clearing house with associated standardized margin requirements. Van Dijk recommended that Mega Bank avoid trading swaps in those countries.<\/p><\/div><\/details><div class=\"qtext\"><p>Comment 3 is most likely referring to:<\/p><\/div>","subj":"economics"},{"n":15,"q":"How many of Van Dijk's statements are correct?","opts":["Both statements are correct.","Neither statement is correct.","Only one statement is correct."],"ans":"C","expl":"Statement 1 is incorrect. Regulatory burden is generally difficult to measure - specifically pertaining to the indirect costs related to changes in economic behavior.\nStatement 2 is correct. In assessing regulatory burden, regulators need to evaluate both the direct and indirect costs associated with a regulation. Indirect costs includes the cost of unintended consequences. Because indirect costs are difficult to assess on a prospective basis, they are often only \"discovered\" only on a retrospective basis. Prospectively, regulators therefore often only consider the direct cost of regulations.\n(Module 7.1, LOS 7.h)\n(Module 7.1, LOS 7.b)","explhtml":"<p>Statement 1 is incorrect. Regulatory burden is generally difficult to measure - specifically pertaining to the indirect costs related to changes in economic behavior.<\/p><p>Statement 2 is correct. In assessing regulatory burden, regulators need to evaluate both the direct and indirect costs associated with a regulation. Indirect costs includes the cost of unintended consequences. Because indirect costs are difficult to assess on a prospective basis, they are often only &quot;discovered&quot; only on a retrospective basis. Prospectively, regulators therefore often only consider the direct cost of regulations.<\/p><p>(Module 7.1, LOS 7.h)<\/p><p>(Module 7.1, LOS 7.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Daan De Vries heads the research department at Mega Bank. De Vries wants to prepare a research report on global investment outlook for the bank&#x27;s board of directors. De Vries sets up a meeting with bank&#x27;s chief economist, Dr. Emma Van Dijk, to get her opinion on some of the items in the report.<\/p><p>De Vries told Van Dijk that he attended a seminar recently where the speaker mentioned the following:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>The economy does not converge to a steady state rate of growth independent of saving/investment decisions.<\/td><\/tr><tr><td>Comment 2:<\/td><td>Growth in TFP is exogenous to the model but the steady state growth rate depends on TFP growth rate.<\/td><\/tr><tr><td>Comment 3:<\/td><td>A poor country that implements the necessary institutional reforms can converge to the income level of the wealthier nations.<\/td><\/tr><\/table><\/div><p>Van Dijk states that changing regulatory environment should be a key focus driving expectations about asset returns globally. She makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Regulatory burden is generally easy to measure ex-ante including the direct and indirect costs.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Prospectively, regulators often focus only on the direct costs arising out of a regulation while conducting their cost-benefit analysis.<\/td><\/tr><\/table><\/div><p>Van Dijk also identified several countries that were adopting new requirements that call for OTC derivative contracts to be now cleared via a central clearing house with associated standardized margin requirements. Van Dijk recommended that Mega Bank avoid trading swaps in those countries.<\/p><\/div><\/details><div class=\"qtext\"><p>How many of Van Dijk&#x27;s statements are correct?<\/p><\/div>","subj":"economics"},{"n":16,"q":"Van Dijk's recommendation about swaps trading is most likely an illustration of:","opts":["regulatory arbitrage.","information frictions.","externalities."],"ans":"A","expl":"Regulatory arbitrage occurs when businesses shop for a country/jurisdiction that allows a specific behavior as opposed to other countries/jurisdictions, thereby circumventing undesirable regulations. Externalities are costs or benefits that affect a party that did not choose to incur that cost or benefit and is not relevant here in deciding where to execute swap trades. Informational frictions occur when information is not equally available or distributed and therefore is not relevant here.\n(Module 7.1, LOS 7.f)\n(Module 7.1, LOS 7.a)","explhtml":"<p>Regulatory arbitrage occurs when businesses shop for a country/jurisdiction that allows a specific behavior as opposed to other countries/jurisdictions, thereby circumventing undesirable regulations. Externalities are costs or benefits that affect a party that did not choose to incur that cost or benefit and is not relevant here in deciding where to execute swap trades. Informational frictions occur when information is not equally available or distributed and therefore is not relevant here.<\/p><p>(Module 7.1, LOS 7.f)<\/p><p>(Module 7.1, LOS 7.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Daan De Vries heads the research department at Mega Bank. De Vries wants to prepare a research report on global investment outlook for the bank&#x27;s board of directors. De Vries sets up a meeting with bank&#x27;s chief economist, Dr. Emma Van Dijk, to get her opinion on some of the items in the report.<\/p><p>De Vries told Van Dijk that he attended a seminar recently where the speaker mentioned the following:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>The economy does not converge to a steady state rate of growth independent of saving/investment decisions.<\/td><\/tr><tr><td>Comment 2:<\/td><td>Growth in TFP is exogenous to the model but the steady state growth rate depends on TFP growth rate.<\/td><\/tr><tr><td>Comment 3:<\/td><td>A poor country that implements the necessary institutional reforms can converge to the income level of the wealthier nations.<\/td><\/tr><\/table><\/div><p>Van Dijk states that changing regulatory environment should be a key focus driving expectations about asset returns globally. She makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Regulatory burden is generally easy to measure ex-ante including the direct and indirect costs.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Prospectively, regulators often focus only on the direct costs arising out of a regulation while conducting their cost-benefit analysis.<\/td><\/tr><\/table><\/div><p>Van Dijk also identified several countries that were adopting new requirements that call for OTC derivative contracts to be now cleared via a central clearing house with associated standardized margin requirements. Van Dijk recommended that Mega Bank avoid trading swaps in those countries.<\/p><\/div><\/details><div class=\"qtext\"><p>Van Dijk&#x27;s recommendation about swaps trading is most likely an illustration of:<\/p><\/div>","subj":"economics"},{"n":17,"q":"Regarding interview Question 1 in Exhibit 1, Doshi would most appropriately respond that prior service costs should be recognized in:","opts":["the income statement in the current period.","other comprehensive income in the current period.","the income statement, to the extent that the benefits are vested."],"ans":"B","expl":"Under U.S. GAAP, prior service costs are immediately reported in comprehensive income (and so affect equity) but not in pension expense (they do not affect net income). The amount not recognized as pension expense in the initial period is amortized over the service lives of employees, and thus is charged to pension expense over time.\n(Module 9.2, LOS 9.d)","explhtml":"<p>Under U.S. GAAP, prior service costs are immediately reported in comprehensive income (and so affect equity) but not in pension expense (they do not affect net income). The amount not recognized as pension expense in the initial period is amortized over the service lives of employees, and thus is charged to pension expense over time.<\/p><p>(Module 9.2, LOS 9.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Dilip Doshi, CFA, has been working as an equity analyst for Sack Investments for the past six years. He has applied for a portfolio manager position in the same firm. Dhiren Sanghvi, principal and the hiring manager, requires strong skills in financial reporting and analysis. Accordingly, Sanghvi has prepared a list of technical questions to evaluate Doshi&#x27;s knowledge, as shown in Exhibit 1.<\/p><p>Exhibit 1: List of Technical Interview Questions<\/p><p>1. What is the appropriate accounting treatment under U.S. GAAP when the sponsor of a defined benefit pension amends the plan to increase benefits retroactively? 2. What is the appropriate accounting treatment under IFRS for grants of incentive stock options to employees? 3. For multinational companies with subsidiaries in hyperinflationary economies, what is the appropriate accounting treatment under IFRS?<\/p><p>4. How would you spot aggressive accounting practices that make use of revenue acceleration techniques?<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding interview Question 1 in Exhibit 1, Doshi would most appropriately respond that prior service costs should be recognized in:<\/p><\/div>","subj":"fsa"},{"n":18,"q":"Supposing that the options mentioned in interview Question 2 were granted out of the money and exercisable after four years, Doshi's most appropriate answer to Question 2 would be that:","opts":["compensation expense equal to fair value of the stock options should be recognized over four years.","because the options have a negative intrinsic value, no compensation expense should be recognized until the options are in the money.","compensation expense equal to the fair value of the options should be recognized on the grant date."],"ans":"A","expl":"The fair value of the options should be recognized over the service period; in this case four years. Whether the options are in the money or not on the grant date is irrelevant.\n(Module 9.1, LOS 9.b)","explhtml":"<p>The fair value of the options should be recognized over the service period; in this case four years. Whether the options are in the money or not on the grant date is irrelevant.<\/p><p>(Module 9.1, LOS 9.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dilip Doshi, CFA, has been working as an equity analyst for Sack Investments for the past six years. He has applied for a portfolio manager position in the same firm. Dhiren Sanghvi, principal and the hiring manager, requires strong skills in financial reporting and analysis. Accordingly, Sanghvi has prepared a list of technical questions to evaluate Doshi&#x27;s knowledge, as shown in Exhibit 1.<\/p><p>Exhibit 1: List of Technical Interview Questions<\/p><p>1. What is the appropriate accounting treatment under U.S. GAAP when the sponsor of a defined benefit pension amends the plan to increase benefits retroactively? 2. What is the appropriate accounting treatment under IFRS for grants of incentive stock options to employees? 3. For multinational companies with subsidiaries in hyperinflationary economies, what is the appropriate accounting treatment under IFRS?<\/p><p>4. How would you spot aggressive accounting practices that make use of revenue acceleration techniques?<\/p><\/div><\/details><div class=\"qtext\"><p>Supposing that the options mentioned in interview Question 2 were granted out of the money and exercisable after four years, Doshi&#x27;s most appropriate answer to Question 2 would be that:<\/p><\/div>","subj":"fsa"},{"n":19,"q":"With regard to interview Question 3, the multinational company would most likely include a purchasing power gain or loss in:","opts":["the income statement if the subsidiary holds non-monetary assets and non- monetary liabilities.","the income statement if the subsidiary holds monetary assets and monetary liabilities.","other comprehensive income."],"ans":"B","expl":"In the case of a subsidiary operating in a hyperinflationary economy and under IFRS, non-monetary assets and liabilities are restated for inflation. Monetary assets and liabilities are not restated for inflation and, therefore, they may have resultant gains or losses (change in value due to inflation). The net gain or loss in purchasing power due to holding monetary assets and liabilities is recognized in the income statement.\n(Module 10.7, LOS 10.g)","explhtml":"<p>In the case of a subsidiary operating in a hyperinflationary economy and under IFRS, non-monetary assets and liabilities are restated for inflation. Monetary assets and liabilities are not restated for inflation and, therefore, they may have resultant gains or losses (change in value due to inflation). The net gain or loss in purchasing power due to holding monetary assets and liabilities is recognized in the income statement.<\/p><p>(Module 10.7, LOS 10.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dilip Doshi, CFA, has been working as an equity analyst for Sack Investments for the past six years. He has applied for a portfolio manager position in the same firm. Dhiren Sanghvi, principal and the hiring manager, requires strong skills in financial reporting and analysis. Accordingly, Sanghvi has prepared a list of technical questions to evaluate Doshi&#x27;s knowledge, as shown in Exhibit 1.<\/p><p>Exhibit 1: List of Technical Interview Questions<\/p><p>1. What is the appropriate accounting treatment under U.S. GAAP when the sponsor of a defined benefit pension amends the plan to increase benefits retroactively? 2. What is the appropriate accounting treatment under IFRS for grants of incentive stock options to employees? 3. For multinational companies with subsidiaries in hyperinflationary economies, what is the appropriate accounting treatment under IFRS?<\/p><p>4. How would you spot aggressive accounting practices that make use of revenue acceleration techniques?<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to interview Question 3, the multinational company would most likely include a purchasing power gain or loss in:<\/p><\/div>","subj":"fsa"},{"n":20,"q":"Which of the following attributes is least likely to indicate a potential revenue acceleration issue?","opts":["Lessor use of the capital lease classification","Large increases in unearned revenue","Bill-and-hold sales"],"ans":"B","expl":"Large increases in unearned revenue postpones revenue recognition: increasing unearned revenue balances are an indication of conservative accounting choices that depress earnings in the current period. Bill-and-hold sales recognize revenue in the current period, which accelerates revenue recognition. Lessor use of capital lease classification would recognize revenue up front at lease inception, versus an operating lease, where the rent payments over the life of the lease would be recognized as revenue.\n(Module 12.1, LOS 12.b)","explhtml":"<p>Large increases in unearned revenue postpones revenue recognition: increasing unearned revenue balances are an indication of conservative accounting choices that depress earnings in the current period. Bill-and-hold sales recognize revenue in the current period, which accelerates revenue recognition. Lessor use of capital lease classification would recognize revenue up front at lease inception, versus an operating lease, where the rent payments over the life of the lease would be recognized as revenue.<\/p><p>(Module 12.1, LOS 12.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dilip Doshi, CFA, has been working as an equity analyst for Sack Investments for the past six years. He has applied for a portfolio manager position in the same firm. Dhiren Sanghvi, principal and the hiring manager, requires strong skills in financial reporting and analysis. Accordingly, Sanghvi has prepared a list of technical questions to evaluate Doshi&#x27;s knowledge, as shown in Exhibit 1.<\/p><p>Exhibit 1: List of Technical Interview Questions<\/p><p>1. What is the appropriate accounting treatment under U.S. GAAP when the sponsor of a defined benefit pension amends the plan to increase benefits retroactively? 2. What is the appropriate accounting treatment under IFRS for grants of incentive stock options to employees? 3. For multinational companies with subsidiaries in hyperinflationary economies, what is the appropriate accounting treatment under IFRS?<\/p><p>4. How would you spot aggressive accounting practices that make use of revenue acceleration techniques?<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following attributes is least likely to indicate a potential revenue acceleration issue?<\/p><\/div>","subj":"fsa"},{"n":21,"q":"Regarding Statement 1 and Statement 2 by Feeney, it would be most accurate to state that:","opts":["both statements are correct.","only Statement 1 is correct.","only Statement 2 is correct."],"ans":"A","expl":"Both statements are correct. AFFO is arrived at after deducting needed maintenance-type capital expenditures and noncash rents. Because both FFO and AFFO use net income as the starting point, it is after the deduction of interest expense. Leverage, therefore, affects the values of FFO and AFFO—and therefore, the FFO and AFFO multiples of REITs with different leverage levels will differ (even if their operating characteristics are similar).\n(Module 33.2, LOS 33.h)","explhtml":"<p>Both statements are correct. AFFO is arrived at after deducting needed maintenance-type capital expenditures and noncash rents. Because both FFO and AFFO use net income as the starting point, it is after the deduction of interest expense. Leverage, therefore, affects the values of FFO and AFFO—and therefore, the FFO and AFFO multiples of REITs with different leverage levels will differ (even if their operating characteristics are similar).<\/p><p>(Module 33.2, LOS 33.h)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Malik Khan serves on the board of the employee pension plan at Smolow, Inc. During the previous board meeting, the board agreed to an increased portfolio allocation to real estate. Khan meets with David Feeney, CIO, to discuss the various options.<\/p><p>Feeney states that one option is to invest in private real estate. Alternatively, Feeney suggests taking an ownership interest in a diversified pool of real estate by investing in REITs. Khan points out that REITs can be mispriced in the market. Feeney replies that they can examine multiples such as P/FFO and P/AFFO, or the REIT&#x27;s NAVPS.<\/p><p>Feeney makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>AFFO takes into account the capital expenditures that are required to sustain the properties&#x27; economic income.<\/td><\/tr><tr><td>Statement 2:<\/td><td>REITs with similar operating characteristics are likely to have different FFO and AFFO multiples if the REITs have different levels of leverage.<\/td><\/tr><\/table><\/div><p>Feeney uses the data for Gemini Healthcare REIT, as shown in Exhibit 1.<\/p><p>Exhibit 1: Gemini Healthcare REIT—Selected Data<\/p><p>000s<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>1200<\/td><\/tr><tr><td>Operating expenses<\/td><td>120<\/td><\/tr><tr><td>Depreciation<\/td><td>230<\/td><\/tr><tr><td>Interest expense<\/td><td>440<\/td><\/tr><tr><td>Net income<\/td><td>410<\/td><\/tr><\/table><\/div><p>Other data:<\/p><div class=\"tbl\"><table><tr><td>Recurring capex<\/td><td>140<\/td><\/tr><tr><td>Noncash rent<\/td><td>88<\/td><\/tr><\/table><\/div><p>Feeney states that compared to an investment in REITs, investments in private real estate have the following advantages:<\/p><p>Advantage 1: There is high transparency.<\/p><p>Advantage 2: Returns are dictated by property performance.<\/p><p>Khan makes the following statements about NAVPS:<\/p><p>Statement 1: NAVPS is based on the depreciated historical cost of a REIT&#x27;s assets.<\/p><p>Statement 2: REITs with high leverage and trading at a discount to NAVPS may find it difficult to refinance maturing debt.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Statement 1 and Statement 2 by Feeney, it would be most accurate to state that:<\/p><\/div>","subj":"alternatives"},{"n":22,"q":"The adjusted AFFO for Gemini Healthcare is closest to:","opts":["$412,000.","$640,000.","$852,000."],"ans":"A","expl":"FFO = net income + depreciation – gain on sale of real estate = 410,000 + 230,000 – 0 = $640,000.\nAFFO = FFO – recurring capex – noncash rent = 640,000 – 140,000 – 88,000 = $412,000.\n(Module 33.2, LOS 33.h)","explhtml":"<p>FFO = net income + depreciation – gain on sale of real estate = 410,000 + 230,000 – 0 = $640,000.<\/p><p>AFFO = FFO – recurring capex – noncash rent = 640,000 – 140,000 – 88,000 = $412,000.<\/p><p>(Module 33.2, LOS 33.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Malik Khan serves on the board of the employee pension plan at Smolow, Inc. During the previous board meeting, the board agreed to an increased portfolio allocation to real estate. Khan meets with David Feeney, CIO, to discuss the various options.<\/p><p>Feeney states that one option is to invest in private real estate. Alternatively, Feeney suggests taking an ownership interest in a diversified pool of real estate by investing in REITs. Khan points out that REITs can be mispriced in the market. Feeney replies that they can examine multiples such as P/FFO and P/AFFO, or the REIT&#x27;s NAVPS.<\/p><p>Feeney makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>AFFO takes into account the capital expenditures that are required to sustain the properties&#x27; economic income.<\/td><\/tr><tr><td>Statement 2:<\/td><td>REITs with similar operating characteristics are likely to have different FFO and AFFO multiples if the REITs have different levels of leverage.<\/td><\/tr><\/table><\/div><p>Feeney uses the data for Gemini Healthcare REIT, as shown in Exhibit 1.<\/p><p>Exhibit 1: Gemini Healthcare REIT—Selected Data<\/p><p>000s<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>1200<\/td><\/tr><tr><td>Operating expenses<\/td><td>120<\/td><\/tr><tr><td>Depreciation<\/td><td>230<\/td><\/tr><tr><td>Interest expense<\/td><td>440<\/td><\/tr><tr><td>Net income<\/td><td>410<\/td><\/tr><\/table><\/div><p>Other data:<\/p><div class=\"tbl\"><table><tr><td>Recurring capex<\/td><td>140<\/td><\/tr><tr><td>Noncash rent<\/td><td>88<\/td><\/tr><\/table><\/div><p>Feeney states that compared to an investment in REITs, investments in private real estate have the following advantages:<\/p><p>Advantage 1: There is high transparency.<\/p><p>Advantage 2: Returns are dictated by property performance.<\/p><p>Khan makes the following statements about NAVPS:<\/p><p>Statement 1: NAVPS is based on the depreciated historical cost of a REIT&#x27;s assets.<\/p><p>Statement 2: REITs with high leverage and trading at a discount to NAVPS may find it difficult to refinance maturing debt.<\/p><\/div><\/details><div class=\"qtext\"><p>The adjusted AFFO for Gemini Healthcare is closest to:<\/p><\/div>","subj":"alternatives"},{"n":23,"q":"Which of Feeney's advantages of private real estate investment is correct?","opts":["Advantage 1 only.","Advantage 2 only.","Both advantages."],"ans":"B","expl":"While property performance is, indeed, a driver of the return on private real estate investment, high transparency is actually an advantage of public real estate securities (REITs and REOCs).(Module 33.2, LOS 33.j)","explhtml":"<p>While property performance is, indeed, a driver of the return on private real estate investment, high transparency is actually an advantage of public real estate securities (REITs and REOCs).(Module 33.2, LOS 33.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Malik Khan serves on the board of the employee pension plan at Smolow, Inc. During the previous board meeting, the board agreed to an increased portfolio allocation to real estate. Khan meets with David Feeney, CIO, to discuss the various options.<\/p><p>Feeney states that one option is to invest in private real estate. Alternatively, Feeney suggests taking an ownership interest in a diversified pool of real estate by investing in REITs. Khan points out that REITs can be mispriced in the market. Feeney replies that they can examine multiples such as P/FFO and P/AFFO, or the REIT&#x27;s NAVPS.<\/p><p>Feeney makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>AFFO takes into account the capital expenditures that are required to sustain the properties&#x27; economic income.<\/td><\/tr><tr><td>Statement 2:<\/td><td>REITs with similar operating characteristics are likely to have different FFO and AFFO multiples if the REITs have different levels of leverage.<\/td><\/tr><\/table><\/div><p>Feeney uses the data for Gemini Healthcare REIT, as shown in Exhibit 1.<\/p><p>Exhibit 1: Gemini Healthcare REIT—Selected Data<\/p><p>000s<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>1200<\/td><\/tr><tr><td>Operating expenses<\/td><td>120<\/td><\/tr><tr><td>Depreciation<\/td><td>230<\/td><\/tr><tr><td>Interest expense<\/td><td>440<\/td><\/tr><tr><td>Net income<\/td><td>410<\/td><\/tr><\/table><\/div><p>Other data:<\/p><div class=\"tbl\"><table><tr><td>Recurring capex<\/td><td>140<\/td><\/tr><tr><td>Noncash rent<\/td><td>88<\/td><\/tr><\/table><\/div><p>Feeney states that compared to an investment in REITs, investments in private real estate have the following advantages:<\/p><p>Advantage 1: There is high transparency.<\/p><p>Advantage 2: Returns are dictated by property performance.<\/p><p>Khan makes the following statements about NAVPS:<\/p><p>Statement 1: NAVPS is based on the depreciated historical cost of a REIT&#x27;s assets.<\/p><p>Statement 2: REITs with high leverage and trading at a discount to NAVPS may find it difficult to refinance maturing debt.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Feeney&#x27;s advantages of private real estate investment is correct?<\/p><\/div>","subj":"alternatives"},{"n":24,"q":"Which of Khan's statements about NAVPS is correct?","opts":["Only Statement 1.","Only Statement 2.","Both statements."],"ans":"B","expl":"Statement 1 is incorrect, as NAVPS values a REIT's real estate holdings using the direct capitalization approach (and not based on depreciated historical cost). Statement 2 is correct. (Module 33.2, LOS 33.g)","explhtml":"<p>Statement 1 is incorrect, as NAVPS values a REIT&#x27;s real estate holdings using the direct capitalization approach (and not based on depreciated historical cost). Statement 2 is correct. (Module 33.2, LOS 33.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Malik Khan serves on the board of the employee pension plan at Smolow, Inc. During the previous board meeting, the board agreed to an increased portfolio allocation to real estate. Khan meets with David Feeney, CIO, to discuss the various options.<\/p><p>Feeney states that one option is to invest in private real estate. Alternatively, Feeney suggests taking an ownership interest in a diversified pool of real estate by investing in REITs. Khan points out that REITs can be mispriced in the market. Feeney replies that they can examine multiples such as P/FFO and P/AFFO, or the REIT&#x27;s NAVPS.<\/p><p>Feeney makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>AFFO takes into account the capital expenditures that are required to sustain the properties&#x27; economic income.<\/td><\/tr><tr><td>Statement 2:<\/td><td>REITs with similar operating characteristics are likely to have different FFO and AFFO multiples if the REITs have different levels of leverage.<\/td><\/tr><\/table><\/div><p>Feeney uses the data for Gemini Healthcare REIT, as shown in Exhibit 1.<\/p><p>Exhibit 1: Gemini Healthcare REIT—Selected Data<\/p><p>000s<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>1200<\/td><\/tr><tr><td>Operating expenses<\/td><td>120<\/td><\/tr><tr><td>Depreciation<\/td><td>230<\/td><\/tr><tr><td>Interest expense<\/td><td>440<\/td><\/tr><tr><td>Net income<\/td><td>410<\/td><\/tr><\/table><\/div><p>Other data:<\/p><div class=\"tbl\"><table><tr><td>Recurring capex<\/td><td>140<\/td><\/tr><tr><td>Noncash rent<\/td><td>88<\/td><\/tr><\/table><\/div><p>Feeney states that compared to an investment in REITs, investments in private real estate have the following advantages:<\/p><p>Advantage 1: There is high transparency.<\/p><p>Advantage 2: Returns are dictated by property performance.<\/p><p>Khan makes the following statements about NAVPS:<\/p><p>Statement 1: NAVPS is based on the depreciated historical cost of a REIT&#x27;s assets.<\/p><p>Statement 2: REITs with high leverage and trading at a discount to NAVPS may find it difficult to refinance maturing debt.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Khan&#x27;s statements about NAVPS is correct?<\/p><\/div>","subj":"alternatives"},{"n":25,"q":"Williams's statement 1 is best described as:","opts":["correct.","incorrect about bond maturity relative to investment horizon.","incorrect about the shape of the yield curve."],"ans":"C","expl":"\"Rolling down the yield curve\" (also sometimes referred to as \"riding the yield curve\") is an active bond portfolio strategy that entails buying longer-maturity (relative to the investment horizon) bonds. The strategy works in an environment with a yield curve that is upward sloping.\n(Module 25.2, LOS 25.d)","explhtml":"<p>&quot;Rolling down the yield curve&quot; (also sometimes referred to as &quot;riding the yield curve&quot;) is an active bond portfolio strategy that entails buying longer-maturity (relative to the investment horizon) bonds. The strategy works in an environment with a yield curve that is upward sloping.<\/p><p>(Module 25.2, LOS 25.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<\/summary><div class=\"vig-body\"><p>Sharon Summers, CFA, serves as Chief Financial Officer for the Western Teachers Retirement Fund (WTRF), a large pension fund with assets in excess of $5 billion. Summers is responsible for the asset management group, which includes fixed-income analysts Ben Sabage and Tonya Williams.<\/p><p>Recently, WTRF&#x27;s board revised the fund&#x27;s target asset allocation, increasing its targeted fixed income allocation range from 15–20% of total assets to 25–30% of total assets. Summers wants to discuss strategies to invest the increased allocation as well as to enhance the performance of the fixed income asset class.<\/p><p>Williams makes the following three statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>&quot;Rolling down the yield curve&quot; is an active bond portfolio management strategy that involves buying bonds with maturities longer than our investment horizon. This strategy is profitable only when the yield curve is downward sloping.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Active bond portfolio management entails comparing our expected future spot rates to current forward rates. If our expected future<\/td><\/tr><\/table><\/div><p>spot rate applicable for a bond is greater than the corresponding current forward rate, we would consider that bond to be overvalued.<\/p><div class=\"tbl\"><table><tr><td>Statement 3:<\/td><td>The forward contract price of a bond depends on current spot and forward rates.<\/td><\/tr><\/table><\/div><p>Sabage presented the current spot rates as shown in  Exhibit 1: Selected Spot Rates.<\/p><p>Exhibit 1: Selected Spot Rates<\/p><div class=\"tbl\"><table><tr><td>Maturity (yrs)<\/td><td>Spot Rate (%)<\/td><\/tr><tr><td>1<\/td><td>2.25<\/td><\/tr><tr><td>2<\/td><td>2.33<\/td><\/tr><tr><td>3<\/td><td>2.67<\/td><\/tr><tr><td>5<\/td><td>3.00<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Williams&#x27;s statement 1 is best described as:<\/p><\/div>","subj":"fixed"},{"n":26,"q":"Williams's statement 2 is best described as:","opts":["correct.","incorrect about comparing current forward rates to expected future spot rates.","incorrect about the bond being considered overvalued."],"ans":"A","expl":"If an investor's expected future spot rates are higher than the current forward rates for the same maturity, the investor would consider the bond to be overvalued. This is so because the market is discounting the future cash flows at too low a discount rate compared to investor expectations, leading to too high a valuation for the bond.\n(Module 25.1, LOS 25.b)","explhtml":"<p>If an investor&#x27;s expected future spot rates are higher than the current forward rates for the same maturity, the investor would consider the bond to be overvalued. This is so because the market is discounting the future cash flows at too low a discount rate compared to investor expectations, leading to too high a valuation for the bond.<\/p><p>(Module 25.1, LOS 25.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sharon Summers, CFA, serves as Chief Financial Officer for the Western Teachers Retirement Fund (WTRF), a large pension fund with assets in excess of $5 billion. Summers is responsible for the asset management group, which includes fixed-income analysts Ben Sabage and Tonya Williams.<\/p><p>Recently, WTRF&#x27;s board revised the fund&#x27;s target asset allocation, increasing its targeted fixed income allocation range from 15–20% of total assets to 25–30% of total assets. Summers wants to discuss strategies to invest the increased allocation as well as to enhance the performance of the fixed income asset class.<\/p><p>Williams makes the following three statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>&quot;Rolling down the yield curve&quot; is an active bond portfolio management strategy that involves buying bonds with maturities longer than our investment horizon. This strategy is profitable only when the yield curve is downward sloping.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Active bond portfolio management entails comparing our expected future spot rates to current forward rates. If our expected future<\/td><\/tr><\/table><\/div><p>spot rate applicable for a bond is greater than the corresponding current forward rate, we would consider that bond to be overvalued.<\/p><div class=\"tbl\"><table><tr><td>Statement 3:<\/td><td>The forward contract price of a bond depends on current spot and forward rates.<\/td><\/tr><\/table><\/div><p>Sabage presented the current spot rates as shown in  Exhibit 1: Selected Spot Rates.<\/p><p>Exhibit 1: Selected Spot Rates<\/p><div class=\"tbl\"><table><tr><td>Maturity (yrs)<\/td><td>Spot Rate (%)<\/td><\/tr><tr><td>1<\/td><td>2.25<\/td><\/tr><tr><td>2<\/td><td>2.33<\/td><\/tr><tr><td>3<\/td><td>2.67<\/td><\/tr><tr><td>5<\/td><td>3.00<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Williams&#x27;s statement 2 is best described as:<\/p><\/div>","subj":"fixed"},{"n":27,"q":"The forward contract price of a bond is most likely to decrease if spot rates in the future:","opts":["turn out to be higher than the corresponding current forward rates.","turn out to be lower than the corresponding current forward rates.","evolve according to the forward curve."],"ans":"A","expl":"The forward contract price of a bond is inversely related to evolution of spot rates. If the future spot rates evolve to be the same as the current forward rates, the forward price will be unchanged. However, if the future spot rates are higher (lower) than the current forward rates, the forward price will decrease (increase).\n(Module 25.1, LOS 25.b)","explhtml":"<p>The forward contract price of a bond is inversely related to evolution of spot rates. If the future spot rates evolve to be the same as the current forward rates, the forward price will be unchanged. However, if the future spot rates are higher (lower) than the current forward rates, the forward price will decrease (increase).<\/p><p>(Module 25.1, LOS 25.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sharon Summers, CFA, serves as Chief Financial Officer for the Western Teachers Retirement Fund (WTRF), a large pension fund with assets in excess of $5 billion. Summers is responsible for the asset management group, which includes fixed-income analysts Ben Sabage and Tonya Williams.<\/p><p>Recently, WTRF&#x27;s board revised the fund&#x27;s target asset allocation, increasing its targeted fixed income allocation range from 15–20% of total assets to 25–30% of total assets. Summers wants to discuss strategies to invest the increased allocation as well as to enhance the performance of the fixed income asset class.<\/p><p>Williams makes the following three statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>&quot;Rolling down the yield curve&quot; is an active bond portfolio management strategy that involves buying bonds with maturities longer than our investment horizon. This strategy is profitable only when the yield curve is downward sloping.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Active bond portfolio management entails comparing our expected future spot rates to current forward rates. If our expected future<\/td><\/tr><\/table><\/div><p>spot rate applicable for a bond is greater than the corresponding current forward rate, we would consider that bond to be overvalued.<\/p><div class=\"tbl\"><table><tr><td>Statement 3:<\/td><td>The forward contract price of a bond depends on current spot and forward rates.<\/td><\/tr><\/table><\/div><p>Sabage presented the current spot rates as shown in  Exhibit 1: Selected Spot Rates.<\/p><p>Exhibit 1: Selected Spot Rates<\/p><div class=\"tbl\"><table><tr><td>Maturity (yrs)<\/td><td>Spot Rate (%)<\/td><\/tr><tr><td>1<\/td><td>2.25<\/td><\/tr><tr><td>2<\/td><td>2.33<\/td><\/tr><tr><td>3<\/td><td>2.67<\/td><\/tr><tr><td>5<\/td><td>3.00<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The forward contract price of a bond is most likely to decrease if spot rates in the future:<\/p><\/div>","subj":"fixed"},{"n":28,"q":"Based on the information in  Exhibit 1: Selected Spot Rates, the forward rate for a one-year zero issued two years from today should be closest to:","opts":["2.60%.","2.75%.","3.35%."],"ans":"C","expl":"3 | 3\n[1+r(3)] | (1.0267)\nf (2, 1) = | −1 = | −1 = 0.0335 or 3.35%\n2 | 2\n[1+r(2)] | (1.0233)\n3.35% is the reinvestment rate that would make an investor indifferent between buying a three-year zero-coupon bond versus investing in a two-year zero and at maturity reinvesting the proceeds for one year.\n(Module 25.1, LOS 25.a)","explhtml":"<di
