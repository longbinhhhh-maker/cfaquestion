e for a bond is greater than the corresponding current forward rate, we would consider that bond to be overvalued.<\/p><div class=\"tbl\"><table><tr><td>Statement 3:<\/td><td>The forward contract price of a bond depends on current spot and forward rates.<\/td><\/tr><\/table><\/div><p>Sabage presented the current spot rates as shown in  Exhibit 1: Selected Spot Rates.<\/p><p>Exhibit 1: Selected Spot Rates<\/p><div class=\"tbl\"><table><tr><td>Maturity (yrs)<\/td><td>Spot Rate (%)<\/td><\/tr><tr><td>1<\/td><td>2.25<\/td><\/tr><tr><td>2<\/td><td>2.33<\/td><\/tr><tr><td>3<\/td><td>2.67<\/td><\/tr><tr><td>5<\/td><td>3.00<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on the information in  Exhibit 1: Selected Spot Rates, the forward rate for a one-year zero issued two years from today should be closest to:<\/p><\/div>","subj":"fixed"},{"n":29,"q":"Using the binomial model, the optimal hedge ratio for Tyrex Mining call options is closest to:","opts":["0.42.","0.49.","0.56."],"ans":"C","expl":"S0 = $60, U = 1.25, D = 0.80, X = $60.\n+ | – | + | –\nS = 60 × 1.25 = $75; S = 60 × 0.80 = $48; C = 15; C = 0.\n+ | −\nC | −C | 15−0\nHedge ratio = | = | = 0.56\n+ | −\nS | −S | 75−48\n(Module 31.1, LOS 31.a)","explhtml":"<p>S0 = $60, U = 1.25, D = 0.80, X = $60.<\/p><div class=\"tbl\"><table><tr><td><sup>+<\/sup><\/td><td><sup>–<\/sup><\/td><td><sup>+<\/sup><\/td><td><sup>–<\/sup><\/td><\/tr><\/table><\/div><p>S = 60 × 1.25 = $75; S = 60 × 0.80 = $48; C = 15; C = 0.<\/p><div class=\"tbl\"><table><tr><td><sup>+<\/sup><\/td><td><sup>−<\/sup><\/td><td><\/td><\/tr><tr><td>C<\/td><td>−C<\/td><td>15−0<\/td><\/tr><tr><td>Hedge ratio = <\/td><td>=<\/td><td>= 0.56<\/td><\/tr><tr><td><sup>+<\/sup><\/td><td><sup>−<\/sup><\/td><td><\/td><\/tr><tr><td>S<\/td><td>−S<\/td><td>75−48<\/td><\/tr><\/table><\/div><p>(Module 31.1, LOS 31.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<\/summary><div class=\"vig-body\"><p>Tess Mulroney, CFA, has some experience with options and uses them for both speculation and hedging. As she often uses over-the-counter options, Mulroney typically calculates option values herself before taking any positions at dealer prices. Risk-free rates are currently 5% and the yield curve is flat.<\/p><p>Mulroney is currently considering at-the-money 1-year calls on Tyrex Mining shares. Tyrex stock is currently trading at $60. Using a binomial model, Mulroney determines that an up-factor of 1.25 and a down-factor of 0.80 would be appropriate for Tyrex stock.<\/p><p>Mulroney is also considering a purchase of two-year European put options on Merrill Materials stock with an exercise price of 35. Merrill stock is currently trading at 38. Mulroney believes that an up-factor of 1.2 and a down factor of 0.8 are appropriate for Merrill stock.<\/p><p>Despite her experience, Mulroney knows she always has more to learn. She finds some technical material about options on the internet, and spends the next hour reading up on sensitivity factors (the &quot;Greeks&quot;) related to option pricing. She finds the relations for exercise prices and asset prices to be intuitive but is not as comfortable with theta, vega, and rho.<\/p><p>Mulroney discusses options strategies with a colleague, Pete Glanda. Glanda tells Mulroney about delta hedging and explains that she can create a delta hedge either by selling calls or buying puts. Glanda explains that the deltas are the sensitivities of option prices to changes in the underlying asset value, and that &quot;dynamic&quot; indicates that the position must be adjusted over time. Mulroney plans to use 0.76 delta call options to hedge her long position in Xiling Inc. stock. She is unsure about gamma though.<\/p><p>Glanda suggests that for Mulroney&#x27;s speculative trades she might consider call and put options on Spectra Inc. stock.  Exhibit 1: Selected BSM Information for Spectra Inc. Options shows information related to the options.<\/p><p>Exhibit 1: Selected BSM Information for Spectra Inc. Options<\/p><p>Exercise<\/p><div class=\"tbl\"><table><tr><td>Stock Price<\/td><td>$35 Price<\/td><td>$33<\/td><\/tr><\/table><\/div><p>Time to<\/p><div class=\"tbl\"><table><tr><td>0.25<\/td><td>Volatility<\/td><td>28%<\/td><\/tr><\/table><\/div><p>expiration<\/p><div class=\"tbl\"><table><tr><td>d1<\/td><td>0.5796<\/td><td>N(d1)<\/td><td>0.72<\/td><\/tr><tr><td>d2<\/td><td>0.4396<\/td><td>N(d2)<\/td><td>0.67<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the binomial model, the optimal hedge ratio for Tyrex Mining call options is closest to:<\/p><\/div>","subj":"derivatives"},{"n":30,"q":"Using the binomial model, the value of the Merrill put should be closest to:","opts":["$1.36","$2.55.","$3.80."],"ans":"A","expl":"S0 = $38, U = 1.20, D = 0.80, X = $35.\n+ | – | ++ | ––\nS = 38 × 1.2 = $45.60; S = 38 × 0.80 = $30.40; S | = 45.60 × 1.2 = $54.72; S | = 30.40\n+– | –+\n× 0.80 = $24.32; S | = S | = 30.40 × 1.2 = $36.48.\n++ | +– | ––\nP | = 0; P | = 0; P | = 10.68\n1+r−D | 1.05−0.80\nπU= | = | = 0.625\nU−D πD= 0.375 | 1.20−0.80\n+ | –\nP = 0; P = [(0.625 × 0) + (0.375 × 10.68)]/1.05 = $3.81 P = [(0.625 × 0) + (0.375 × 3.81)]/1.05 = $1.36 (Module 31.1, LOS 31.d)","explhtml":"<p>S0 = $38, U = 1.20, D = 0.80, X = $35.<\/p><div class=\"tbl\"><table><tr><td><sup>+<\/sup><\/td><td><sup>–<\/sup><\/td><td><sup>++<\/sup><\/td><td><sup>––<\/sup><\/td><\/tr><tr><td>S = 38 × 1.2 = $45.60; S = 38 × 0.80 = $30.40; S<\/td><td> = 45.60 × 1.2 = $54.72; S<\/td><td>= 30.40<\/td><td><\/td><\/tr><tr><td><sup>+–<\/sup><\/td><td><sup>–+<\/sup><\/td><td><\/td><td><\/td><\/tr><tr><td>× 0.80 = $24.32; S<\/td><td> = S<\/td><td> = 30.40 × 1.2 = $36.48.<\/td><td><\/td><\/tr><tr><td><sup>++<\/sup><\/td><td><sup>+–<\/sup><\/td><td><sup>––<\/sup><\/td><td><\/td><\/tr><tr><td>P<\/td><td>= 0; P<\/td><td> = 0; P<\/td><td> = 10.68<\/td><\/tr><tr><td>1+r−D<\/td><td>1.05−0.80<\/td><td><\/td><td><\/td><\/tr><tr><td>πU=<\/td><td>=<\/td><td>= 0.625<\/td><td><\/td><\/tr><tr><td>U−D πD= 0.375<\/td><td>1.20−0.80<\/td><td><\/td><td><\/td><\/tr><tr><td><sup>+<\/sup><\/td><td><sup>–<\/sup><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>P = 0; P = [(0.625 × 0) + (0.375 × 10.68)]/1.05 = $3.81 P = [(0.625 × 0) + (0.375 × 3.81)]/1.05 = $1.36 (Module 31.1, LOS 31.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tess Mulroney, CFA, has some experience with options and uses them for both speculation and hedging. As she often uses over-the-counter options, Mulroney typically calculates option values herself before taking any positions at dealer prices. Risk-free rates are currently 5% and the yield curve is flat.<\/p><p>Mulroney is currently considering at-the-money 1-year calls on Tyrex Mining shares. Tyrex stock is currently trading at $60. Using a binomial model, Mulroney determines that an up-factor of 1.25 and a down-factor of 0.80 would be appropriate for Tyrex stock.<\/p><p>Mulroney is also considering a purchase of two-year European put options on Merrill Materials stock with an exercise price of 35. Merrill stock is currently trading at 38. Mulroney believes that an up-factor of 1.2 and a down factor of 0.8 are appropriate for Merrill stock.<\/p><p>Despite her experience, Mulroney knows she always has more to learn. She finds some technical material about options on the internet, and spends the next hour reading up on sensitivity factors (the &quot;Greeks&quot;) related to option pricing. She finds the relations for exercise prices and asset prices to be intuitive but is not as comfortable with theta, vega, and rho.<\/p><p>Mulroney discusses options strategies with a colleague, Pete Glanda. Glanda tells Mulroney about delta hedging and explains that she can create a delta hedge either by selling calls or buying puts. Glanda explains that the deltas are the sensitivities of option prices to changes in the underlying asset value, and that &quot;dynamic&quot; indicates that the position must be adjusted over time. Mulroney plans to use 0.76 delta call options to hedge her long position in Xiling Inc. stock. She is unsure about gamma though.<\/p><p>Glanda suggests that for Mulroney&#x27;s speculative trades she might consider call and put options on Spectra Inc. stock.  Exhibit 1: Selected BSM Information for Spectra Inc. Options shows information related to the options.<\/p><p>Exhibit 1: Selected BSM Information for Spectra Inc. Options<\/p><p>Exercise<\/p><div class=\"tbl\"><table><tr><td>Stock Price<\/td><td>$35 Price<\/td><td>$33<\/td><\/tr><\/table><\/div><p>Time to<\/p><div class=\"tbl\"><table><tr><td>0.25<\/td><td>Volatility<\/td><td>28%<\/td><\/tr><\/table><\/div><p>expiration<\/p><div class=\"tbl\"><table><tr><td>d1<\/td><td>0.5796<\/td><td>N(d1)<\/td><td>0.72<\/td><\/tr><tr><td>d2<\/td><td>0.4396<\/td><td>N(d2)<\/td><td>0.67<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the binomial model, the value of the Merrill put should be closest to:<\/p><\/div>","subj":"derivatives"},{"n":31,"q":"A properly-constructed delta-hedged portfolio that Mulroney plans for her investment in Xiling stock is most likely to have:","opts":["zero gamma.","positive gamma.","negative gamma."],"ans":"C","expl":"The delta-hedged portfolio will have a long position in stock (given) and a short position in call options. Calls have positive gamma, while stock has zero gamma; thus the short position in calls will result in a net negative gamma for the overall portfolio.\n(Module 31.7, LOS 31.m)","explhtml":"<p>The delta-hedged portfolio will have a long position in stock (given) and a short position in call options. Calls have positive gamma, while stock has zero gamma; thus the short position in calls will result in a net negative gamma for the overall portfolio.<\/p><p>(Module 31.7, LOS 31.m)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tess Mulroney, CFA, has some experience with options and uses them for both speculation and hedging. As she often uses over-the-counter options, Mulroney typically calculates option values herself before taking any positions at dealer prices. Risk-free rates are currently 5% and the yield curve is flat.<\/p><p>Mulroney is currently considering at-the-money 1-year calls on Tyrex Mining shares. Tyrex stock is currently trading at $60. Using a binomial model, Mulroney determines that an up-factor of 1.25 and a down-factor of 0.80 would be appropriate for Tyrex stock.<\/p><p>Mulroney is also considering a purchase of two-year European put options on Merrill Materials stock with an exercise price of 35. Merrill stock is currently trading at 38. Mulroney believes that an up-factor of 1.2 and a down factor of 0.8 are appropriate for Merrill stock.<\/p><p>Despite her experience, Mulroney knows she always has more to learn. She finds some technical material about options on the internet, and spends the next hour reading up on sensitivity factors (the &quot;Greeks&quot;) related to option pricing. She finds the relations for exercise prices and asset prices to be intuitive but is not as comfortable with theta, vega, and rho.<\/p><p>Mulroney discusses options strategies with a colleague, Pete Glanda. Glanda tells Mulroney about delta hedging and explains that she can create a delta hedge either by selling calls or buying puts. Glanda explains that the deltas are the sensitivities of option prices to changes in the underlying asset value, and that &quot;dynamic&quot; indicates that the position must be adjusted over time. Mulroney plans to use 0.76 delta call options to hedge her long position in Xiling Inc. stock. She is unsure about gamma though.<\/p><p>Glanda suggests that for Mulroney&#x27;s speculative trades she might consider call and put options on Spectra Inc. stock.  Exhibit 1: Selected BSM Information for Spectra Inc. Options shows information related to the options.<\/p><p>Exhibit 1: Selected BSM Information for Spectra Inc. Options<\/p><p>Exercise<\/p><div class=\"tbl\"><table><tr><td>Stock Price<\/td><td>$35 Price<\/td><td>$33<\/td><\/tr><\/table><\/div><p>Time to<\/p><div class=\"tbl\"><table><tr><td>0.25<\/td><td>Volatility<\/td><td>28%<\/td><\/tr><\/table><\/div><p>expiration<\/p><div class=\"tbl\"><table><tr><td>d1<\/td><td>0.5796<\/td><td>N(d1)<\/td><td>0.72<\/td><\/tr><tr><td>d2<\/td><td>0.4396<\/td><td>N(d2)<\/td><td>0.67<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>A properly-constructed delta-hedged portfolio that Mulroney plans for her investment in Xiling stock is most likely to have:<\/p><\/div>","subj":"derivatives"},{"n":32,"q":"Consider a zero-coupon bond with a face value equal to the $33 option exercise price. Based on the Black-Scholes Model valuation approach and using the information in Exhibit 1: Selected BSM Information for Spectra Inc. Options, a long position in 100 Spectra Inc. puts can most accurately replicated by a portfolio of:","opts":["long 33 bonds and short 28 shares.","long 67 bonds and short 72 shares.","long 67 bonds and short 28 shares."],"ans":"A","expl":"According to BSM, a put option can be replicated by going long N(–d2) zero-coupon bonds and short N(–d1) shares. N(–d2) = 1 – N(d2) = 1 – 0.67 = 0.33 and N(–d1) = 1 – N(d1) = 1 – 0.72 = 0.28, hence 100 put options can be replicated by going long 33 bonds and short 28 shares.\n(Module 31.6, LOS 31.f)","explhtml":"<p>According to BSM, a put option can be replicated by going long N(–d2) zero-coupon bonds and short N(–d1) shares. N(–d2) = 1 – N(d2) = 1 – 0.67 = 0.33 and N(–d1) = 1 – N(d1) = 1 – 0.72 = 0.28, hence 100 put options can be replicated by going long 33 bonds and short 28 shares.<\/p><p>(Module 31.6, LOS 31.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tess Mulroney, CFA, has some experience with options and uses them for both speculation and hedging. As she often uses over-the-counter options, Mulroney typically calculates option values herself before taking any positions at dealer prices. Risk-free rates are currently 5% and the yield curve is flat.<\/p><p>Mulroney is currently considering at-the-money 1-year calls on Tyrex Mining shares. Tyrex stock is currently trading at $60. Using a binomial model, Mulroney determines that an up-factor of 1.25 and a down-factor of 0.80 would be appropriate for Tyrex stock.<\/p><p>Mulroney is also considering a purchase of two-year European put options on Merrill Materials stock with an exercise price of 35. Merrill stock is currently trading at 38. Mulroney believes that an up-factor of 1.2 and a down factor of 0.8 are appropriate for Merrill stock.<\/p><p>Despite her experience, Mulroney knows she always has more to learn. She finds some technical material about options on the internet, and spends the next hour reading up on sensitivity factors (the &quot;Greeks&quot;) related to option pricing. She finds the relations for exercise prices and asset prices to be intuitive but is not as comfortable with theta, vega, and rho.<\/p><p>Mulroney discusses options strategies with a colleague, Pete Glanda. Glanda tells Mulroney about delta hedging and explains that she can create a delta hedge either by selling calls or buying puts. Glanda explains that the deltas are the sensitivities of option prices to changes in the underlying asset value, and that &quot;dynamic&quot; indicates that the position must be adjusted over time. Mulroney plans to use 0.76 delta call options to hedge her long position in Xiling Inc. stock. She is unsure about gamma though.<\/p><p>Glanda suggests that for Mulroney&#x27;s speculative trades she might consider call and put options on Spectra Inc. stock.  Exhibit 1: Selected BSM Information for Spectra Inc. Options shows information related to the options.<\/p><p>Exhibit 1: Selected BSM Information for Spectra Inc. Options<\/p><p>Exercise<\/p><div class=\"tbl\"><table><tr><td>Stock Price<\/td><td>$35 Price<\/td><td>$33<\/td><\/tr><\/table><\/div><p>Time to<\/p><div class=\"tbl\"><table><tr><td>0.25<\/td><td>Volatility<\/td><td>28%<\/td><\/tr><\/table><\/div><p>expiration<\/p><div class=\"tbl\"><table><tr><td>d1<\/td><td>0.5796<\/td><td>N(d1)<\/td><td>0.72<\/td><\/tr><tr><td>d2<\/td><td>0.4396<\/td><td>N(d2)<\/td><td>0.67<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Consider a zero-coupon bond with a face value equal to the $33 option exercise price. Based on the Black-Scholes Model valuation approach and using the information in Exhibit 1: Selected BSM Information for Spectra Inc. Options, a long position in 100 Spectra Inc. puts can most accurately replicated by a portfolio of:<\/p><\/div>","subj":"derivatives"},{"n":33,"q":"Based on the information in  Exhibit 1: Small-Cap Equity Fund—Selected Information, the highest Sharpe ratio that can be achieved by combining the actively managed portfolio and its benchmark is closest to:","opts":["0.21.","0.35.","0.45."],"ans":"C","expl":"Information ratio of actively managed portfolio = Expected active return / Standard deviation of active return = 2.3 / 7.8 = 0.29 11−3\nSharpe ratio of the benchmark =  23 | = 0.35\nSharpe ratio of optimal portfolio =\n2 | 2 | 2 | 2\n√(SR B | ) | + (IR) | = √(0.35) | + (0.29) | = √0.2066 = 0.45\n(Module 40.2, LOS 40.b)","explhtml":"<p>Information ratio of actively managed portfolio = Expected active return / Standard deviation of active return = 2.3 / 7.8 = 0.29 11−3<\/p><div class=\"tbl\"><table><tr><td>Sharpe ratio of the benchmark =  23<\/td><td>= 0.35<\/td><\/tr><\/table><\/div><p>Sharpe ratio of optimal portfolio =<\/p><div class=\"tbl\"><table><tr><td><sup>2<\/sup><\/td><td><sup>2<\/sup><\/td><td><sup>2<\/sup><\/td><td><sup>2<\/sup><\/td><td><\/td><td><\/td><\/tr><tr><td>√(SR B<\/td><td>)<\/td><td>+ (IR)<\/td><td>= √(0.35)<\/td><td>+ (0.29)<\/td><td>= √0.2066 = 0.45<\/td><\/tr><\/table><\/div><p>(Module 40.2, LOS 40.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Mary Phillips, CFA, was recently hired to the team that manages the Dominick Trust (DT), a USD 220 million family-owned portfolio. The DT portfolio consists of several funds with diversified holdings. Recently, DT has been considering the possibility of taking further advantage of its fund managers&#x27; abilities by additionally managing outside money.<\/p><p>During her first week on the job, Phillips sets up appointments with several fund managers to get an overview of the different approaches to portfolio management that are employed at DT. First, she meets with Andrew Kapp, fund manager for an actively managed small-cap equity fund.  Exhibit 1: Small-Cap Equity Fund— Selected Information provides information about the fund and its benchmark.<\/p><p>Exhibit 1: Small-Cap Equity Fund—Selected Information<\/p><div class=\"tbl\"><table><tr><td>Expected active return<\/td><td>2.3%<\/td><\/tr><\/table><\/div><p>Standard deviation of active 7.8% return<\/p><div class=\"tbl\"><table><tr><td>Expected benchmark return<\/td><td>11.0%<\/td><\/tr><\/table><\/div><p>Standard deviation of 23.0% benchmark returns<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>Next, Phillips meets with Archana Singh, portfolio manager for an actively-managed corporate bond fund. Singh makes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Investment constraints have reduced the correlation between my active weights and my forecasted active returns, resulting in a lower information ratio.&quot;<\/td><\/tr><tr><td>Statement 2:<\/td><td>&quot;Ex-post, the portfolio&#x27;s return variability is comprised of variation due to realized information coefficient as well as variation due to the constraints imposed on the manager.&quot;<\/td><\/tr><\/table><\/div><p>Phillips is asked to prepare a presentation for Mrs. R. Zingler, a relative of the Dominicks. Phillips plans to recommend to Zingler the small-cap equity portfolio described in  Exhibit 1: Small-Cap Equity Fund—Selected Information. Upon learning that Zingler would like to limit her active risk to 5%, Phillips creates a new portfolio by combining the Small-cap equity portfolio with its benchmark in order to meet Zingler&#x27;s investment constraint.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information in  Exhibit 1: Small-Cap Equity Fund—Selected Information, the highest Sharpe ratio that can be achieved by combining the actively managed portfolio and its benchmark is closest to:<\/p><\/div>","subj":"portfolio"},{"n":34,"q":"Singh's statement 1 is best described as:","opts":["correct.","incorrect about investment constraints reducing her information ratio.","incorrect about investment constraints reducing the correlation between actual active weights and forecasted active returns."],"ans":"A","expl":"Singh's statement 1 is correct.\nIn the presence of investment constraints, IR = (TC) (IC) √BR where TC is the transfer coefficient. The transfer coefficient is the correlation between actual active weights and forecasted active returns. The greater the investment constraints, the lower the transfer coefficient, the lower the correlation between active weights and forecasted active return, and the lower the information ratio will be.\n(Module 40.3, LOS 40.c)","explhtml":"<p>Singh&#x27;s statement 1 is correct.<\/p><p>In the presence of investment constraints, IR = (TC) (IC) √BR where TC is the transfer coefficient. The transfer coefficient is the correlation between actual active weights and forecasted active returns. The greater the investment constraints, the lower the transfer coefficient, the lower the correlation between active weights and forecasted active return, and the lower the information ratio will be.<\/p><p>(Module 40.3, LOS 40.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mary Phillips, CFA, was recently hired to the team that manages the Dominick Trust (DT), a USD 220 million family-owned portfolio. The DT portfolio consists of several funds with diversified holdings. Recently, DT has been considering the possibility of taking further advantage of its fund managers&#x27; abilities by additionally managing outside money.<\/p><p>During her first week on the job, Phillips sets up appointments with several fund managers to get an overview of the different approaches to portfolio management that are employed at DT. First, she meets with Andrew Kapp, fund manager for an actively managed small-cap equity fund.  Exhibit 1: Small-Cap Equity Fund— Selected Information provides information about the fund and its benchmark.<\/p><p>Exhibit 1: Small-Cap Equity Fund—Selected Information<\/p><div class=\"tbl\"><table><tr><td>Expected active return<\/td><td>2.3%<\/td><\/tr><\/table><\/div><p>Standard deviation of active 7.8% return<\/p><div class=\"tbl\"><table><tr><td>Expected benchmark return<\/td><td>11.0%<\/td><\/tr><\/table><\/div><p>Standard deviation of 23.0% benchmark returns<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>Next, Phillips meets with Archana Singh, portfolio manager for an actively-managed corporate bond fund. Singh makes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Investment constraints have reduced the correlation between my active weights and my forecasted active returns, resulting in a lower information ratio.&quot;<\/td><\/tr><tr><td>Statement 2:<\/td><td>&quot;Ex-post, the portfolio&#x27;s return variability is comprised of variation due to realized information coefficient as well as variation due to the constraints imposed on the manager.&quot;<\/td><\/tr><\/table><\/div><p>Phillips is asked to prepare a presentation for Mrs. R. Zingler, a relative of the Dominicks. Phillips plans to recommend to Zingler the small-cap equity portfolio described in  Exhibit 1: Small-Cap Equity Fund—Selected Information. Upon learning that Zingler would like to limit her active risk to 5%, Phillips creates a new portfolio by combining the Small-cap equity portfolio with its benchmark in order to meet Zingler&#x27;s investment constraint.<\/p><\/div><\/details><div class=\"qtext\"><p>Singh&#x27;s statement 1 is best described as:<\/p><\/div>","subj":"portfolio"},{"n":35,"q":"Singh's statement 2 is best described as:","opts":["correct.","incorrect about the portfolio’s return variability being partly comprised of variation due to realized information coefficient.","incorrect about the portfolio’s return variability being partly comprised of variation due to constraints imposed on the manager."],"ans":"A","expl":"Singh's statement 2 is correct. Ex-post, an active portfolio's return variance, can be decomposed into variation due to realized information coefficient and variation due to constraint-induced noise.\n(Module 40.4, LOS 40.f)","explhtml":"<p>Singh&#x27;s statement 2 is correct. Ex-post, an active portfolio&#x27;s return variance, can be decomposed into variation due to realized information coefficient and variation due to constraint-induced noise.<\/p><p>(Module 40.4, LOS 40.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mary Phillips, CFA, was recently hired to the team that manages the Dominick Trust (DT), a USD 220 million family-owned portfolio. The DT portfolio consists of several funds with diversified holdings. Recently, DT has been considering the possibility of taking further advantage of its fund managers&#x27; abilities by additionally managing outside money.<\/p><p>During her first week on the job, Phillips sets up appointments with several fund managers to get an overview of the different approaches to portfolio management that are employed at DT. First, she meets with Andrew Kapp, fund manager for an actively managed small-cap equity fund.  Exhibit 1: Small-Cap Equity Fund— Selected Information provides information about the fund and its benchmark.<\/p><p>Exhibit 1: Small-Cap Equity Fund—Selected Information<\/p><div class=\"tbl\"><table><tr><td>Expected active return<\/td><td>2.3%<\/td><\/tr><\/table><\/div><p>Standard deviation of active 7.8% return<\/p><div class=\"tbl\"><table><tr><td>Expected benchmark return<\/td><td>11.0%<\/td><\/tr><\/table><\/div><p>Standard deviation of 23.0% benchmark returns<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>Next, Phillips meets with Archana Singh, portfolio manager for an actively-managed corporate bond fund. Singh makes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Investment constraints have reduced the correlation between my active weights and my forecasted active returns, resulting in a lower information ratio.&quot;<\/td><\/tr><tr><td>Statement 2:<\/td><td>&quot;Ex-post, the portfolio&#x27;s return variability is comprised of variation due to realized information coefficient as well as variation due to the constraints imposed on the manager.&quot;<\/td><\/tr><\/table><\/div><p>Phillips is asked to prepare a presentation for Mrs. R. Zingler, a relative of the Dominicks. Phillips plans to recommend to Zingler the small-cap equity portfolio described in  Exhibit 1: Small-Cap Equity Fund—Selected Information. Upon learning that Zingler would like to limit her active risk to 5%, Phillips creates a new portfolio by combining the Small-cap equity portfolio with its benchmark in order to meet Zingler&#x27;s investment constraint.<\/p><\/div><\/details><div class=\"qtext\"><p>Singh&#x27;s statement 2 is best described as:<\/p><\/div>","subj":"portfolio"},{"n":36,"q":"The information ratio of the blended portfolio recommended by Phillips to meet Zingler's constraint is most likely to be:","opts":["higher than the information ratio of the small-cap equity portfolio.","lower than the information ratio of the small-cap equity portfolio.","the same as the information ratio of the small-cap equity portfolio."],"ans":"C","expl":"Allocating a portion of investment funds to the benchmark rather than to the active portfolio reduces both active risk and active return in the same proportion— meaning that the information ratio of the active/benchmark blend will be the same as that of the active portfolio alone.\n(Module 40.2, LOS 40.b)","explhtml":"<p>Allocating a portion of investment funds to the benchmark rather than to the active portfolio reduces both active risk and active return in the same proportion— meaning that the information ratio of the active/benchmark blend will be the same as that of the active portfolio alone.<\/p><p>(Module 40.2, LOS 40.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mary Phillips, CFA, was recently hired to the team that manages the Dominick Trust (DT), a USD 220 million family-owned portfolio. The DT portfolio consists of several funds with diversified holdings. Recently, DT has been considering the possibility of taking further advantage of its fund managers&#x27; abilities by additionally managing outside money.<\/p><p>During her first week on the job, Phillips sets up appointments with several fund managers to get an overview of the different approaches to portfolio management that are employed at DT. First, she meets with Andrew Kapp, fund manager for an actively managed small-cap equity fund.  Exhibit 1: Small-Cap Equity Fund— Selected Information provides information about the fund and its benchmark.<\/p><p>Exhibit 1: Small-Cap Equity Fund—Selected Information<\/p><div class=\"tbl\"><table><tr><td>Expected active return<\/td><td>2.3%<\/td><\/tr><\/table><\/div><p>Standard deviation of active 7.8% return<\/p><div class=\"tbl\"><table><tr><td>Expected benchmark return<\/td><td>11.0%<\/td><\/tr><\/table><\/div><p>Standard deviation of 23.0% benchmark returns<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>Next, Phillips meets with Archana Singh, portfolio manager for an actively-managed corporate bond fund. Singh makes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Investment constraints have reduced the correlation between my active weights and my forecasted active returns, resulting in a lower information ratio.&quot;<\/td><\/tr><tr><td>Statement 2:<\/td><td>&quot;Ex-post, the portfolio&#x27;s return variability is comprised of variation due to realized information coefficient as well as variation due to the constraints imposed on the manager.&quot;<\/td><\/tr><\/table><\/div><p>Phillips is asked to prepare a presentation for Mrs. R. Zingler, a relative of the Dominicks. Phillips plans to recommend to Zingler the small-cap equity portfolio described in  Exhibit 1: Small-Cap Equity Fund—Selected Information. Upon learning that Zingler would like to limit her active risk to 5%, Phillips creates a new portfolio by combining the Small-cap equity portfolio with its benchmark in order to meet Zingler&#x27;s investment constraint.<\/p><\/div><\/details><div class=\"qtext\"><p>The information ratio of the blended portfolio recommended by Phillips to meet Zingler&#x27;s constraint is most likely to be:<\/p><\/div>","subj":"portfolio"},{"n":37,"q":"Which of the following is least likely to represent a cost of investing in ETFs?","opts":["Cash drag","Tracking error","Portfolio turnover"],"ans":"A","expl":"The main components of ETF costs include the following: fund management fees, tracking error, portfolio turnover, taxable gains/losses, trading costs, and security lending. Cash drag is an issue for open-ended mutual funds; the in-kind creation of ETFs means that cash drag is not a significant component of ETF costs.\n(Module 35.1, LOS 35.b)","explhtml":"<p>The main components of ETF costs include the following: fund management fees, tracking error, portfolio turnover, taxable gains/losses, trading costs, and security lending. Cash drag is an issue for open-ended mutual funds; the in-kind creation of ETFs means that cash drag is not a significant component of ETF costs.<\/p><p>(Module 35.1, LOS 35.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Ale Nieminen is the founder of Nieminen Advisors, a boutique advisory firm based in Helsinki, Finland. Nieminen is preparing for a meeting with his client, Adda Virtanen, who recently inherited a substantial amount of money. Virtanen would like to invest a significant portion of her inheritance in the United States. Nieminen prepares some information on a particular U.S. equity ETF as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected AAQB ETF Information<\/p><p>Management fees: 0.20% per year<\/p><p>Bid-ask spread: 0.09%<\/p><p>Commission (one-way): 0.06%<\/p><p>Earlier in the week, Nieminen had lunch with Susan Dominick, another prospective client. During lunch, Dominick stated that her family trust is her sole source of income, though she passes most of this income on to charity. (Dominick serves on the board of several charities and does various other volunteer work.)<\/p><p>The following week, Nieminen begins to assemble a presentation recommending that Altria Trust (AT), another client, reduce its allocation to U.S. Treasuries. Nieminen collects market price information, along with his expectations, as shown in Exhibit 2.<\/p><p>Exhibit 2: Treasury Market Information and Macroeconomic Expectations<\/p><p>Market price of zero coupon T-bond maturing in one year ($100 $97.89 face value)<\/p><div class=\"tbl\"><table><tr><td>Real risk-free rate<\/td><td>0.50%<\/td><\/tr><tr><td>Expected inflation over the next year<\/td><td>1.25%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is least likely to represent a cost of investing in ETFs?<\/p><\/div>","subj":"portfolio"},{"n":38,"q":"Using the information in Exhibit 1, the three-year holding period cost for AAQB ETF will be closest to:","opts":["0.21%.","0.41%.","0.81%."],"ans":"C","expl":"Round trip trading cost = (2 × one-way commission) + (bid-ask spread) = (2 × 0.06%) + 0.09% = 0.21%.\nManagement fees for three years = 3 × 0.20% = 0.60% Total three-year holding cost = 0.21% + 0.60% = 0.81% (Module 35.2, LOS 35.f)","explhtml":"<p>Round trip trading cost = (2 × one-way commission) + (bid-ask spread) = (2 × 0.06%) + 0.09% = 0.21%.<\/p><p>Management fees for three years = 3 × 0.20% = 0.60% Total three-year holding cost = 0.21% + 0.60% = 0.81% (Module 35.2, LOS 35.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ale Nieminen is the founder of Nieminen Advisors, a boutique advisory firm based in Helsinki, Finland. Nieminen is preparing for a meeting with his client, Adda Virtanen, who recently inherited a substantial amount of money. Virtanen would like to invest a significant portion of her inheritance in the United States. Nieminen prepares some information on a particular U.S. equity ETF as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected AAQB ETF Information<\/p><p>Management fees: 0.20% per year<\/p><p>Bid-ask spread: 0.09%<\/p><p>Commission (one-way): 0.06%<\/p><p>Earlier in the week, Nieminen had lunch with Susan Dominick, another prospective client. During lunch, Dominick stated that her family trust is her sole source of income, though she passes most of this income on to charity. (Dominick serves on the board of several charities and does various other volunteer work.)<\/p><p>The following week, Nieminen begins to assemble a presentation recommending that Altria Trust (AT), another client, reduce its allocation to U.S. Treasuries. Nieminen collects market price information, along with his expectations, as shown in Exhibit 2.<\/p><p>Exhibit 2: Treasury Market Information and Macroeconomic Expectations<\/p><p>Market price of zero coupon T-bond maturing in one year ($100 $97.89 face value)<\/p><div class=\"tbl\"><table><tr><td>Real risk-free rate<\/td><td>0.50%<\/td><\/tr><tr><td>Expected inflation over the next year<\/td><td>1.25%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1, the three-year holding period cost for AAQB ETF will be closest to:<\/p><\/div>","subj":"portfolio"},{"n":39,"q":"Relative to the portfolio of an average investor, Dominick's portfolio should most appropriately have a greater exposure to:","opts":["cyclical equities.","high-quality corporate bonds.","short-term government treasuries."],"ans":"A","expl":"Given Dominick's relatively high income from investments and her lack of exposure to employment income, she is relatively insensitive to business cycle risk. Because the average investor is sensitive to business cycle risk (due to the correlation of employment income with the business cycle), there is a risk premium for bearing such risk. Dominick has a comparative advantage in bearing this kind of risk.\n(Module 39.2, LOS 39.g)","explhtml":"<p>Given Dominick&#x27;s relatively high income from investments and her lack of exposure to employment income, she is relatively insensitive to business cycle risk. Because the average investor is sensitive to business cycle risk (due to the correlation of employment income with the business cycle), there is a risk premium for bearing such risk. Dominick has a comparative advantage in bearing this kind of risk.<\/p><p>(Module 39.2, LOS 39.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ale Nieminen is the founder of Nieminen Advisors, a boutique advisory firm based in Helsinki, Finland. Nieminen is preparing for a meeting with his client, Adda Virtanen, who recently inherited a substantial amount of money. Virtanen would like to invest a significant portion of her inheritance in the United States. Nieminen prepares some information on a particular U.S. equity ETF as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected AAQB ETF Information<\/p><p>Management fees: 0.20% per year<\/p><p>Bid-ask spread: 0.09%<\/p><p>Commission (one-way): 0.06%<\/p><p>Earlier in the week, Nieminen had lunch with Susan Dominick, another prospective client. During lunch, Dominick stated that her family trust is her sole source of income, though she passes most of this income on to charity. (Dominick serves on the board of several charities and does various other volunteer work.)<\/p><p>The following week, Nieminen begins to assemble a presentation recommending that Altria Trust (AT), another client, reduce its allocation to U.S. Treasuries. Nieminen collects market price information, along with his expectations, as shown in Exhibit 2.<\/p><p>Exhibit 2: Treasury Market Information and Macroeconomic Expectations<\/p><p>Market price of zero coupon T-bond maturing in one year ($100 $97.89 face value)<\/p><div class=\"tbl\"><table><tr><td>Real risk-free rate<\/td><td>0.50%<\/td><\/tr><tr><td>Expected inflation over the next year<\/td><td>1.25%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Relative to the portfolio of an average investor, Dominick&#x27;s portfolio should most appropriately have a greater exposure to:<\/p><\/div>","subj":"portfolio"},{"n":40,"q":"Based on the information in Exhibit 2, the implied premium for inflation uncertainty is closest to:","opts":["0.23%.","0.32%.","0.41%."],"ans":"C","expl":"The total expected return on the bond is (100/97.89) – 1 = 0.02155 or 2.16% The risk premium for inflation uncertainty = 2.16% – (0.5% + 1.25%) = 0.41%. (Module 39.1, LOS 39.d)","explhtml":"<p>The total expected return on the bond is (100/97.89) – 1 = 0.02155 or 2.16% The risk premium for inflation uncertainty = 2.16% – (0.5% + 1.25%) = 0.41%. (Module 39.1, LOS 39.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ale Nieminen is the founder of Nieminen Advisors, a boutique advisory firm based in Helsinki, Finland. Nieminen is preparing for a meeting with his client, Adda Virtanen, who recently inherited a substantial amount of money. Virtanen would like to invest a significant portion of her inheritance in the United States. Nieminen prepares some information on a particular U.S. equity ETF as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected AAQB ETF Information<\/p><p>Management fees: 0.20% per year<\/p><p>Bid-ask spread: 0.09%<\/p><p>Commission (one-way): 0.06%<\/p><p>Earlier in the week, Nieminen had lunch with Susan Dominick, another prospective client. During lunch, Dominick stated that her family trust is her sole source of income, though she passes most of this income on to charity. (Dominick serves on the board of several charities and does various other volunteer work.)<\/p><p>The following week, Nieminen begins to assemble a presentation recommending that Altria Trust (AT), another client, reduce its allocation to U.S. Treasuries. Nieminen collects market price information, along with his expectations, as shown in Exhibit 2.<\/p><p>Exhibit 2: Treasury Market Information and Macroeconomic Expectations<\/p><p>Market price of zero coupon T-bond maturing in one year ($100 $97.89 face value)<\/p><div class=\"tbl\"><table><tr><td>Real risk-free rate<\/td><td>0.50%<\/td><\/tr><tr><td>Expected inflation over the next year<\/td><td>1.25%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 2, the implied premium for inflation uncertainty is closest to:<\/p><\/div>","subj":"portfolio"},{"n":41,"q":"Antares's written trade allocation policy statement would:","opts":["not violate the Standards of Professional Conduct.","violate Standard III(B) Fair Dealing.","violate Standard III(C) Suitability."],"ans":"C","expl":"While the pro rata trade allocation policy is otherwise fair, it calls for allocation of IPOs to all accounts without consideration of suitability. (Module 42.5, LOS 42.a)","explhtml":"<p>While the pro rata trade allocation policy is otherwise fair, it calls for allocation of IPOs to all accounts without consideration of suitability. (Module 42.5, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Antares Investment Management (Antares) is a mid-sized operation based in Boston, Massachusetts. Antares provides investment analysis, advice, and account management services for individuals, investment banking services for corporate clients, and manages assets for several mutual funds. Antares also allocates some client assets among mutual funds of other firms. Antares wants to include CFA Institute Standards of Professional Conduct as part of the firm&#x27;s Policies and Procedures Manual.<\/p><p>Antares has a written policy on trade allocation and makes this policy available to clients and prospective clients. The policy is disseminated to all employees. Antares also has supervisory procedures that provide reasonable assurance that both the firm and its employees adhere to the firm&#x27;s policy and applicable laws and regulations. The policy calls for pro rata allocation of IPOs to all client accounts.<\/p><p>Antares&#x27;s policies and procedures call for appropriate trade allocation practices as follows:<\/p><p>Policy 1:     &quot;Get advanced indication of client interest regarding any new issues.&quot;<\/p><p>Policy 2:     &quot;Execute orders in a timely and efficient manner.&quot;<\/p><p>Policy 3:     &quot;Distribute new issues by portfolio manager and not by client.&quot;<\/p><p>David Haywood, CFA, manages one of Antares&#x27;s larger mutual funds. Over the holidays, Haywood learns from his brother-in-law that his employer, Trident Telecommunications, has seen a large increase in orders. Haywood then researches telecom firms and settles upon Alpha, a small-cap telecommunications firm with promising new technology. Over the next three days, Haywood purchases 100,000 shares of Alpha for the fund he runs, using a volume-weighted average price algorithm. Several weeks later, Haywood spots the CEO of Trident dining with the CEO of Alpha at an upscale restaurant. Haywood knows that Trident has made several acquisitions in the past few years and concludes that Alpha may be Trident&#x27;s newest target. Haywood places an order for 500,000 additional shares of Alpha for the fund he manages.<\/p><p>Alfred Mack, CFA, is an investment officer at Antares. Mack and Erika Lee, CFA, are good friends; they studied finance together at a university in Chicago. Lee has recently accepted a position as Senior Vice President of Trading at East Coast Securities, a medium-sized brokerage firm. Last night, Lee invited Mack out to dinner at the Great Austin Steakhouse, an expensive restaurant that is frequented by famous movie stars, well-known musicians, and professional athletes. Over the course of the dinner, Lee tells Mack of her plans to increase her firm&#x27;s trading volume. She asks Mack to direct some trades to her at East Coast Securities. Since Lee is an old friend, Mack believes he is not required to inform his supervisor that he had dinner with Lee.<\/p><\/div><\/details><div class=\"qtext\"><p>Antares&#x27;s written trade allocation policy statement would:<\/p><\/div>","subj":"ethics"},{"n":42,"q":"Which of Antares's trade allocation practices is least likely to conform to CFA Institute Standards of Professional Conduct?","opts":["Policy 1.","Policy 2.","Policy 3."],"ans":"C","expl":"Policies 1 and 2 conform to the recommended practices under the Standards of Professional Conduct. Policy 3 does not conform; to ensure that clients are treated fairly, new issues should be distributed by client and not by portfolio manager.\n(Module 42.5, LOS 42.a)","explhtml":"<p>Policies 1 and 2 conform to the recommended practices under the Standards of Professional Conduct. Policy 3 does not conform; to ensure that clients are treated fairly, new issues should be distributed by client and not by portfolio manager.<\/p><p>(Module 42.5, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antares Investment Management (Antares) is a mid-sized operation based in Boston, Massachusetts. Antares provides investment analysis, advice, and account management services for individuals, investment banking services for corporate clients, and manages assets for several mutual funds. Antares also allocates some client assets among mutual funds of other firms. Antares wants to include CFA Institute Standards of Professional Conduct as part of the firm&#x27;s Policies and Procedures Manual.<\/p><p>Antares has a written policy on trade allocation and makes this policy available to clients and prospective clients. The policy is disseminated to all employees. Antares also has supervisory procedures that provide reasonable assurance that both the firm and its employees adhere to the firm&#x27;s policy and applicable laws and regulations. The policy calls for pro rata allocation of IPOs to all client accounts.<\/p><p>Antares&#x27;s policies and procedures call for appropriate trade allocation practices as follows:<\/p><p>Policy 1:     &quot;Get advanced indication of client interest regarding any new issues.&quot;<\/p><p>Policy 2:     &quot;Execute orders in a timely and efficient manner.&quot;<\/p><p>Policy 3:     &quot;Distribute new issues by portfolio manager and not by client.&quot;<\/p><p>David Haywood, CFA, manages one of Antares&#x27;s larger mutual funds. Over the holidays, Haywood learns from his brother-in-law that his employer, Trident Telecommunications, has seen a large increase in orders. Haywood then researches telecom firms and settles upon Alpha, a small-cap telecommunications firm with promising new technology. Over the next three days, Haywood purchases 100,000 shares of Alpha for the fund he runs, using a volume-weighted average price algorithm. Several weeks later, Haywood spots the CEO of Trident dining with the CEO of Alpha at an upscale restaurant. Haywood knows that Trident has made several acquisitions in the past few years and concludes that Alpha may be Trident&#x27;s newest target. Haywood places an order for 500,000 additional shares of Alpha for the fund he manages.<\/p><p>Alfred Mack, CFA, is an investment officer at Antares. Mack and Erika Lee, CFA, are good friends; they studied finance together at a university in Chicago. Lee has recently accepted a position as Senior Vice President of Trading at East Coast Securities, a medium-sized brokerage firm. Last night, Lee invited Mack out to dinner at the Great Austin Steakhouse, an expensive restaurant that is frequented by famous movie stars, well-known musicians, and professional athletes. Over the course of the dinner, Lee tells Mack of her plans to increase her firm&#x27;s trading volume. She asks Mack to direct some trades to her at East Coast Securities. Since Lee is an old friend, Mack believes he is not required to inform his supervisor that he had dinner with Lee.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Antares&#x27;s trade allocation practices is least likely to conform to CFA Institute Standards of Professional Conduct?<\/p><\/div>","subj":"ethics"},{"n":43,"q":"Regarding Haywood's investment in shares of Alpha, Haywood most likely:","opts":["violated Standard II(A) Material Nonpublic Information.","violated Standard V(A) Diligence and Reasonable Basis.","did not violate any Standards of Professional Conduct."],"ans":"C","expl":"Haywood performs a careful study of telecom firms before selecting Alpha and hence is not violating the standard on Diligence and Reasonable Basis. Additionally, Haywood has no inside knowledge about the motives of Trident; rather, he is assembling the pieces of a puzzle (mosaic theory) regarding Trident's potential takeover of Alpha.\n(Module 42.8, LOS 42.a)","explhtml":"<p>Haywood performs a careful study of telecom firms before selecting Alpha and hence is not violating the standard on Diligence and Reasonable Basis. Additionally, Haywood has no inside knowledge about the motives of Trident; rather, he is assembling the pieces of a puzzle (mosaic theory) regarding Trident&#x27;s potential takeover of Alpha.<\/p><p>(Module 42.8, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antares Investment Management (Antares) is a mid-sized operation based in Boston, Massachusetts. Antares provides investment analysis, advice, and account management services for individuals, investment banking services for corporate clients, and manages assets for several mutual funds. Antares also allocates some client assets among mutual funds of other firms. Antares wants to include CFA Institute Standards of Professional Conduct as part of the firm&#x27;s Policies and Procedures Manual.<\/p><p>Antares has a written policy on trade allocation and makes this policy available to clients and prospective clients. The policy is disseminated to all employees. Antares also has supervisory procedures that provide reasonable assurance that both the firm and its employees adhere to the firm&#x27;s policy and applicable laws and regulations. The policy calls for pro rata allocation of IPOs to all client accounts.<\/p><p>Antares&#x27;s policies and procedures call for appropriate trade allocation practices as follows:<\/p><p>Policy 1:     &quot;Get advanced indication of client interest regarding any new issues.&quot;<\/p><p>Policy 2:     &quot;Execute orders in a timely and efficient manner.&quot;<\/p><p>Policy 3:     &quot;Distribute new issues by portfolio manager and not by client.&quot;<\/p><p>David Haywood, CFA, manages one of Antares&#x27;s larger mutual funds. Over the holidays, Haywood learns from his brother-in-law that his employer, Trident Telecommunications, has seen a large increase in orders. Haywood then researches telecom firms and settles upon Alpha, a small-cap telecommunications firm with promising new technology. Over the next three days, Haywood purchases 100,000 shares of Alpha for the fund he runs, using a volume-weighted average price algorithm. Several weeks later, Haywood spots the CEO of Trident dining with the CEO of Alpha at an upscale restaurant. Haywood knows that Trident has made several acquisitions in the past few years and concludes that Alpha may be Trident&#x27;s newest target. Haywood places an order for 500,000 additional shares of Alpha for the fund he manages.<\/p><p>Alfred Mack, CFA, is an investment officer at Antares. Mack and Erika Lee, CFA, are good friends; they studied finance together at a university in Chicago. Lee has recently accepted a position as Senior Vice President of Trading at East Coast Securities, a medium-sized brokerage firm. Last night, Lee invited Mack out to dinner at the Great Austin Steakhouse, an expensive restaurant that is frequented by famous movie stars, well-known musicians, and professional athletes. Over the course of the dinner, Lee tells Mack of her plans to increase her firm&#x27;s trading volume. She asks Mack to direct some trades to her at East Coast Securities. Since Lee is an old friend, Mack believes he is not required to inform his supervisor that he had dinner with Lee.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Haywood&#x27;s investment in shares of Alpha, Haywood most likely:<\/p><\/div>","subj":"ethics"},{"n":44,"q":"Lee paid US$500 for the dinner with Mack at the steakhouse. Which of the following is most consistent with the CFA Institute's Standards?","opts":["No violation of the CFA Institute’s Code and Standards has occurred.","Mack has violated the CFA Institute’s Standards of Professional Conduct.","The Code and Standards do not state any specific dollar amounts, so it is unclear whether a violation has occurred."],"ans":"B","expl":"Under Standard I(B): Professionalism – Independence and Objectivity, Mack's objectivity may be impeded when he accepts the expensive dinner from Lee. Mack could be accused of giving favorable treatment to Lee in return for the meal.\nEven though Lee and Mack are old friends, since the main purpose of the dinner was to discuss business, several violations have occurred.\nMack is required to seek approval from his supervisor before accepting.\nMack should have declined the dinner or paid for half the bill to avoid the appearance that his independence and objectivity may have been compromised.\nThe standards are particularly sensitive to members receiving gifts from a non-client when the gift giver (e.g., a broker) has incentive to influence a member's (e.g., an investment manager) behavior.\nThe best answer is, therefore, that Mack has violated the CFA Institute's Standards of Professional Conduct.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Under Standard I(B): Professionalism – Independence and Objectivity, Mack&#x27;s objectivity may be impeded when he accepts the expensive dinner from Lee. Mack could be accused of giving favorable treatment to Lee in return for the meal.<\/p><p>Even though Lee and Mack are old friends, since the main purpose of the dinner was to discuss business, several violations have occurred.<\/p><p>Mack is required to seek approval from his supervisor before accepting.<\/p><p>Mack should have declined the dinner or paid for half the bill to avoid the appearance that his independence and objectivity may have been compromised.<\/p><p>The standards are particularly sensitive to members receiving gifts from a non-client when the gift giver (e.g., a broker) has incentive to influence a member&#x27;s (e.g., an investment manager) behavior.<\/p><p>The best answer is, therefore, that Mack has violated the CFA Institute&#x27;s Standards of Professional Conduct.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antares Investment Management (Antares) is a mid-sized operation based in Boston, Massachusetts. Antares provides investment analysis, advice, and account management services for individuals, investment banking services for corporate clients, and manages assets for several mutual funds. Antares also allocates some client assets among mutual funds of other firms. Antares wants to include CFA Institute Standards of Professional Conduct as part of the firm&#x27;s Policies and Procedures Manual.<\/p><p>Antares has a written policy on trade allocation and makes this policy available to clients and prospective clients. The policy is disseminated to all employees. Antares also has supervisory procedures that provide reasonable assurance that both the firm and its employees adhere to the firm&#x27;s policy and applicable laws and regulations. The policy calls for pro rata allocation of IPOs to all client accounts.<\/p><p>Antares&#x27;s policies and procedures call for appropriate trade allocation practices as follows:<\/p><p>Policy 1:     &quot;Get advanced indication of client interest regarding any new issues.&quot;<\/p><p>Policy 2:     &quot;Execute orders in a timely and efficient manner.&quot;<\/p><p>Policy 3:     &quot;Distribute new issues by portfolio manager and not by client.&quot;<\/p><p>David Haywood, CFA, manages one of Antares&#x27;s larger mutual funds. Over the holidays, Haywood learns from his brother-in-law that his employer, Trident Telecommunications, has seen a large increase in orders. Haywood then researches telecom firms and settles upon Alpha, a small-cap telecommunications firm with promising new technology. Over the next three days, Haywood purchases 100,000 shares of Alpha for the fund he runs, using a volume-weighted average price algorithm. Several weeks later, Haywood spots the CEO of Trident dining with the CEO of Alpha at an upscale restaurant. Haywood knows that Trident has made several acquisitions in the past few years and concludes that Alpha may be Trident&#x27;s newest target. Haywood places an order for 500,000 additional shares of Alpha for the fund he manages.<\/p><p>Alfred Mack, CFA, is an investment officer at Antares. Mack and Erika Lee, CFA, are good friends; they studied finance together at a university in Chicago. Lee has recently accepted a position as Senior Vice President of Trading at East Coast Securities, a medium-sized brokerage firm. Last night, Lee invited Mack out to dinner at the Great Austin Steakhouse, an expensive restaurant that is frequented by famous movie stars, well-known musicians, and professional athletes. Over the course of the dinner, Lee tells Mack of her plans to increase her firm&#x27;s trading volume. She asks Mack to direct some trades to her at East Coast Securities. Since Lee is an old friend, Mack believes he is not required to inform his supervisor that he had dinner with Lee.<\/p><\/div><\/details><div class=\"qtext\"><p>Lee paid US$500 for the dinner with Mack at the steakhouse. Which of the following is most consistent with the CFA Institute&#x27;s Standards?<\/p><\/div>","subj":"ethics"}];
const CFG = {"title": "Schweser Mock 6 (2025) — Session 1", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }

  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
