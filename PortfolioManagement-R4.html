<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following would least likely be considered a minimum requirement of an IPS?\nA(n):", "opts": ["investment strategy based on client circumstances and constraints.", "target return figure.", "benchmark portfolio."], "ans": "B", "expl": "An IPS does not necessarily, or even typically, require a target return because future\nmarket movements are either difficult or impossible to predict with any degree of\naccuracy. At a minimum the IPS should contain a clear statement of client circumstances\nand constraints, and investment strategy consistent with these, and a benchmark portfolio\nor instrument against which to evaluate portfolio returns.\n(Module 86.1, LOS 86.b)"}, {"n": 2, "q": "While assessing an investor's risk tolerance, a financial adviser is least likely to ask which of\nthe following questions?", "opts": ["“How much insurance coverage do you have?”", "“Is your home life stable?”", "“What rate of investment return do you expect?”"], "ans": "C", "expl": "While the degree of risk tolerance will have an effect on expected returns, assessing the\nrisk tolerance comes first, and the resulting set of feasible returns follows. The other\nquestions address risk tolerance.\n(Module 86.1, LOS 86.d)"}, {"n": 3, "q": "Brian Nebrik, CFA, meets with a new investment management client. They compose a\nstatement that defines each of their responsibilities concerning this account and choose a\nbenchmark index with which to evaluate the account's performance. Which of these items\nshould be included in the client's Investment Policy Statement (IPS)?", "opts": ["Both of these items.", "Only one of these items.", "Neither of these items."], "ans": "A", "expl": "Two of the major components of an IPS should be a statement of the responsibilities of\nthe investment manager and the client, and a performance evaluation benchmark.\n(Module 86.1, LOS 86.b)"}, {"n": 4, "q": "The major components of a typical investment policy statement (IPS) least likely include:", "opts": ["the investment manager’s compensation.", "duties and responsibilities of the investment manager.", "investment objectives."], "ans": "A", "expl": "Investment manager's compensation is not among the major components of a typical IPS.\nThe major components include a description of the client; a statement of purpose; a\nstatement of duties and responsibilities; procedures to update the IPS; investment\nobjectives; investment constraints; investment guidelines; and benchmark for evaluation\nof performance.\n(Module 86.1, LOS 86.b)"}, {"n": 5, "q": "If an investor's ability to bear risk is low and willingness to bear risk is high, an investment\nmanager should most appropriately consider the investor's overall financial risk tolerance to\nbe:", "opts": ["low.", "high.", "moderate."], "ans": "A", "expl": "In general, an advisor should consider an investor's risk tolerance to be the lower of the\ninvestor's ability and willingness to bear risk.\n(Module 86.1, LOS 86.d)"}, {"n": 6, "q": "Which of the following statements is most accurate about integrating ESG considerations\ninto portfolio planning and construction?", "opts": ["Integrating ESG considerations into portfolio planning and construction is likely to decrease portfolio returns.", "A broad market index is an inappropriate benchmark for a portfolio that uses negative screening to address the investor’s ESG concerns.", "Investors who engage in active ownership to pursue their ESG considerations should vote their shares themselves rather than delegating share voting to an investment manager."], "ans": "B", "expl": "If a portfolio's investment universe is constrained by negative screening, an appropriate\nbenchmark is an index that excludes companies or industries that investors with ESG\nconcerns commonly avoid.\nInvestors engaging in active ownership to pursue their ESG considerations may choose to\nvote their shares themselves or instruct an investment manager to vote the shares.\nThe effect of integrating ESG considerations on portfolio returns is uncertain. While\nlimiting the universe of investment choices and incurring the costs involved in considering\nESG factors may decrease returns, investing in companies with good corporate governance\npractices and avoiding those that face ESG-related risks may increase returns.\n(Module 86.1, LOS 86.g)"}, {"n": 7, "q": "Based on a questionnaire about investment risk, an advisor concludes that an investor's risk\ntolerance is high, but based on an analysis of the client's income needs and time horizon, he\nconcludes the investor's risk tolerance is low. The most appropriate action for the advisor is\nto:", "opts": ["emphasize stocks over bonds.", "emphasize bonds over stocks.", "educate the client about investment risk and re-administer the questionnaire."], "ans": "B", "expl": "When determining an investor's risk tolerance, an advisor must consider both the\ninvestor's ability and willingness to bear risk. Even though the investor has a high\nwillingness to bear risk, his ability to take risk (based on his financial situation) is low, and\nthis should take precedence. A portfolio that emphasizes bonds over stocks has less\ninvestment risk and is the most appropriate choice.\n(Module 86.1, LOS 86.d)"}, {"n": 8, "q": "A return objective is said to be relative if the objective is:", "opts": ["based on a benchmark index or portfolio.", "compared to a specific numerical outcome.", "stated in terms of probability."], "ans": "A", "expl": "Relative return objectives are stated relative to specified benchmarks, such as LIBOR or\nthe return on a stock index. Absolute return objectives are stated in terms of specific\nnumerical outcomes, such as a 5% return. Risk objectives (either absolute or relative) may\nbe stated in terms of probability, such as \"no more than a 5% probability of a negative\nreturn.\"\n(Module 86.1, LOS 86.c)"}, {"n": 9, "q": "Which of the following statements about risk and return is least accurate?", "opts": ["Return objectives may be stated in absolute terms.", "Risk and return may be considered on a mutually exclusive basis.", "Specifying investment objectives only in terms of return may expose an investor to inappropriately high levels of risk."], "ans": "B", "expl": "Risk and return must always be considered together when expressing investment\nobjectives. Return objectives may be expressed either in absolute terms (dollar amounts)\nor in percentages.\n(Module 86.1, LOS 86.c)"}, {"n": 10, "q": "An investment manager has constructed an efficient frontier based on a client's investable\nasset classes. The strategic asset allocation for the client should be the asset allocation of\none of these efficient portfolios, selected based on:", "opts": ["the relative valuations of the investable asset classes.", "the client’s investment objectives and constraints.", "a risk budgeting process."], "ans": "B", "expl": "After defining the investable asset classes and constructing an efficient frontier of possible\nportfolios of these asset classes, the manager should choose the efficient portfolio that\nbest suits the investor's objectives and constraints as specified in the IPS. The investor's\nstrategic asset allocation can then be defined as the asset allocation of the chosen\nportfolio. Tactical asset allocation based on relative valuation of asset classes would\nrequire the manager to deviate from the strategic asset allocation. Risk budgeting refers to\nthe practice of determining an overall risk limit for a portfolio and allocating that risk to\nstrategic asset allocation, tactical asset allocation, and security selection decisions.\n(Module 86.1, LOS 86.g)"}, {"n": 11, "q": "An endowment is required by statute to pay out a minimum percentage of its asset value\neach period to its beneficiaries. This investment constraint is best classified as:", "opts": ["legal and regulatory.", "liquidity.", "unique circumstances."], "ans": "A", "expl": "Legal and regulatory constraints are those that apply to an investor by law.\n(Module 86.1, LOS 86.e)"}, {"n": 12, "q": "Which of the following is NOT a rationale for the importance of the policy statement in\ninvesting? It:", "opts": ["helps investors understand the risks and costs of investing.", "identifies specific stocks the investor may wish to purchase.", "forces investors to understand their needs and constraints."], "ans": "B", "expl": "The policy statement outlines broad objectives and constraints but does not get into the\ndetails of specific stocks for investment.\n(Module 86.1, LOS 86.a)"}, {"n": 13, "q": "A firm that invests the majority of a portfolio to track a benchmark index, and uses active\ninvestment strategies for the remaining portion, is said to be using:", "opts": ["a core-satellite approach.", "risk budgeting.", "strategic asset allocation."], "ans": "A", "expl": "With a core-satellite approach, a firm invests the majority of a portfolio passively and uses\nactive strategies for the remaining portion. Strategic asset allocation refers to specifying\nthe percentages of a portfolio's value to allocate to specific asset classes. Risk budgeting\nrefers to allocating a portfolio's overall permitted risk among strategic asset allocation,\ntactical asset allocation, and security selection.\n(Module 86.1, LOS 86.g)"}, {"n": 14, "q": "Which of the following should least likely be included as a constraint in an investment policy\nstatement (IPS)?", "opts": ["Any unique needs or preferences an investor may have.", "How funds are spent after being withdrawn from the portfolio.", "Constraints put on investment activities by regulatory agencies."], "ans": "B", "expl": "How funds are spent after withdrawal would not be a constraint of an IPS.\n(Module 86.1, LOS 86.e)"}, {"n": 15, "q": "Which of the following statements is NOT consistent with the assumption that individuals\nare risk averse with their investment portfolios?", "opts": ["Many individuals purchase lottery tickets.", "There is a positive relationship between expected returns and expected risk.", "Higher betas are associated with higher expected returns."], "ans": "A", "expl": "Investors are risk averse. Given a choice between two assets with equal rates of return, the\ninvestor will always select the asset with the lowest level of risk. This means that there is a\npositive relationship between expected returns (ER) and expected risk and the risk return\nline (capital market line [CML] and security market line [SML]) is upward sweeping.\nHowever, investors can be risk averse in one area and not others, as evidenced by their\npurchase of lottery tickets.\n(Module 86.1, LOS 86.d)"}, {"n": 16, "q": "All of the following affect an investor's risk tolerance EXCEPT:", "opts": ["family situation.", "years of experience with investing in the markets.", "tax bracket."], "ans": "C", "expl": "Tax concerns play an important role in investment planning. However, these constitute an\ninvestment constraint, not an investment objective (i.e. risk tolerance).\n(Module 86.1, LOS 86.d)"}, {"n": 17, "q": "Which of the following is not necessarily included in an investment policy statement?", "opts": ["A benchmark against which to judge performance.", "An investment strategy based on the investor’s objectives and constraints.", "Procedures to update the IPS when circumstances change."], "ans": "C", "expl": "At a minimum an IPS should contain a clear statement of client circumstances and\nconstraints, an investment strategy based on these, and some benchmark against which to\nevaluate the account performance. The investment must periodically update the IPS as\ncircumstances change, but explicit procedures for these updates are not necessarily\nincluded in the IPS itself.\n(Module 86.1, LOS 86.a)"}, {"n": 18, "q": "Which of the following is least likely to be considered a constraint when preparing an\ninvestment policy statement?", "opts": ["Liquidity needs.", "Risk tolerance.", "Tax concerns."], "ans": "B", "expl": "The constraints are: liquidity needs, time horizon, taxes, legal and regulatory factors, and\nunique needs and preferences. Risk tolerance is included in the investment objectives of\nthe policy statement, not in the constraints.\n(Module 86.1, LOS 86.e)"}, {"n": 19, "q": "When preparing a strategic asset allocation, how should asset classes be defined with\nrespect to the correlations of returns among the securities in each asset class?", "opts": ["Low correlation within asset classes and high correlation between asset classes.", "High correlation within asset classes and low correlation between asset classes.", "Low correlation within asset classes and low correlation between asset classes."], "ans": "B", "expl": "The portfolio diversification benefits from strategic asset allocation result from low\ncorrelations of returns between asset classes. Asset classes should consist of assets with\nsimilar characteristics and investment performance, which means correlations within an\nasset class are relatively high.\n(Module 86.1, LOS 86.f)"}, {"n": 20, "q": "Which of the following portfolio constraints in the Investment Policy Statement of a local\ncollege's endowment most likely belongs in the \"unique circumstances\" category? The\nendowment is:", "opts": ["exempt from taxes.", "subject to oversight by a regulatory authority.", "unwilling to invest in companies that sell weapons."], "ans": "C", "expl": "Issues involving taxes fall in the tax concerns category, and issues regarding regulation fall\nin the legal and regulatory factors category. Specific guidance from the investor on\npermitted businesses for investment is included in unique circumstances.\n(Module 86.1, LOS 86.e)"}, {"n": 21, "q": "Which of the following asset class specifications is most appropriate for asset allocation\npurposes?", "opts": ["Consumer discretionary.", "Emerging markets.", "Domestic bonds."], "ans": "C", "expl": "An asset class should be specified by type of security (e.g., stocks, bonds, alternative\nassets, cash) and can then be further subdivided by region or industry classification. An\nasset class defined only as \"emerging markets\" or \"consumer discretionary firms\" should\nidentify the type of securities (e.g., equities or debt).\n(Module 86.1, LOS 86.f)"}, {"n": 22, "q": "Which of the following factors is least likely to affect an investor's risk tolerance?", "opts": ["Level of insurance coverage.", "Level of inflation in the economy.", "Number of dependent family members."], "ans": "B", "expl": "The level of inflation in the economy should be considered in determining the return\nobjective. Risk tolerance is a function of the investor's psychological makeup and the\ninvestor's personal factors such as age, family situation, existing wealth, insurance\ncoverage, current cash reserves and income.\n(Module 86.1, LOS 86.d)"}, {"n": 23, "q": "When performing strategic asset allocation, properly defined and specified asset classes\nshould:", "opts": ["approximate the investor’s total investable universe as a group.", "each contain assets that have a broad range of risk and expected return.", "have high returns correlations with other asset classes."], "ans": "A", "expl": "When taken together, the asset classes should approximate the investor's total investible\nuniverse. Properly defined and specified asset classes should each have a low return\ncorrelation to the other asset classes, and within each asset class should be assets that\nhave similar expected risk and return.\n(Module 86.1, LOS 86.f)"}, {"n": 24, "q": "Which of the following statements about investment constraints is least accurate?", "opts": ["Diversification efforts can increase tax liability.", "Investors concerned about time horizon are not likely to worry about liquidity.", "Unwillingness to invest in gambling stocks is a constraint."], "ans": "B", "expl": "Investors with a time horizon constraint may have little time for capital appreciation\nbefore they need the money. Need for money in the near term is a liquidity constraint.\nTime horizon and liquidity constraints often go hand in hand. Diversification often requires\nthe sale of an investment and the purchase of another. Investment sales often trigger tax\nliability. Younger investors should take advantage of tax deferrals while they have time for\nthe savings to compound, and while they are in their peak earning years. Many retirees\nhave little income and face less tax liability on investment returns.\n(Module 86.1, LOS 86.e)"}, {"n": 25, "q": "Categories of investment constraints in an investment policy statement least likely include:", "opts": ["liquidity needs.", "risk tolerance.", "tax concerns."], "ans": "B", "expl": "Risk tolerance and return requirements make up the investment objectives. Investment\nconstraints include liquidity needs, time horizon, tax concerns, legal and regulatory\nfactors, and unique circumstances.\n(Module 86.1, LOS 86.e)"}, {"n": 26, "q": "A portfolio manager who believes equity securities are overvalued in the short term reduces\nthe weight of equities in her portfolio to 35% from its longer-term target weight of 40%. This\ndecision is best described as an example of:", "opts": ["rebalancing.", "strategic asset allocation.", "tactical asset allocation."], "ans": "C", "expl": "Tactical asset allocation refers to deviating from a portfolio's target asset allocation\nweights in the short term to take advantage of perceived opportunities in specific asset\nclasses. Strategic asset allocation is determining the target asset allocation percentages\nfor a portfolio. Rebalancing is periodically adjusting a portfolio back to its target asset\nallocation.\n(Module 86.1, LOS 86.g)"}, {"n": 27, "q": "Which of the following statements about the importance of risk and return in the investment\nobjective is least accurate?", "opts": ["The investor’s risk tolerance is likely to determine what level of return will be feasible.", "Expressing investment goals in terms of risk is more appropriate than expressing goals in terms of return.", "The return objective may be stated in dollar amounts even if the risk objective is stated in percentages."], "ans": "B", "expl": "Expressing investment goals in terms of risk is not more appropriate than expressing goals\nin terms of return. The investment objectives should be stated in terms of both risk and\nreturn. Risk tolerance will likely help determine what level of expected return is feasible.\n(Module 86.1, LOS 86.c)"}, {"n": 28, "q": "Which of the following statements about risk is NOT correct? Generally, greater:", "opts": ["existing wealth allows for greater risk.", "insurance coverage allows for greater risk.", "spending needs allows for greater risk."], "ans": "C", "expl": "Greater spending needs usually allow for lower risk because there is a definite need to\nensure that the return may adequately fund the spending needs (a \"fixed\" cost).\n(Module 86.1, LOS 86.d)"}, {"n": 29, "q": "When developing the strategic asset allocation in an IPS, the correlations of returns:", "opts": ["among asset classes should be relatively high.", "within an asset class should be relatively high.", "within an asset class should be relatively low."], "ans": "B", "expl": "Asset classes are defined such that correlations of returns within an asset class are\nrelatively high. Low correlations of returns among asset classes increase the benefits of\ndiversification across asset classes.\n(Module 86.1, LOS 86.f)"}, {"n": 30, "q": "An investment manager is most likely to be engaging in tactical asset allocation if she:", "opts": ["allocates more than the targeted 10% to emerging market bonds because the sector appears to be undervalued.", "increases the allocation to tax-free bonds because the investor’s effective tax rate has increased.", "allocates 5% to cash, 20% to fixed income, and 75% to equities based on the investor’s long time horizon and high risk tolerance."], "ans": "A", "expl": "Tactical asset allocation is deviating from a portfolio's strategic asset allocation because an\nasset class or sector is perceived to be mispriced in the short term. Establishing and\nupdating target weights for asset classes based on the investor's objectives and\nconstraints is strategic asset allocation.\n(Module 86.1, LOS 86.g)"}, {"n": 31, "q": "An individual investor specifies to her investment advisor that her portfolio must produce a\nminimum amount of cash each period. This investment constraint is best classified as:", "opts": ["legal and regulatory.", "liquidity.", "unique circumstances."], "ans": "B", "expl": "Liquidity constraints arise from an investor's need for spendable cash.\n(Module 86.1, LOS 86.e)"}, {"n": 32, "q": "Davis Samuel, CFA, is meeting with one of his portfolio management clients, Joseph Pope, to\ndiscuss Pope's investment constraints. Samuel has established that:\nPope plans to retire from his job as a bond salesman in 17 years, after which this\nportfolio will be his primary source of income.\nPope has sufficient cash available that he will not need this portfolio to generate cash\noutflows until he retires.\nPope, as a registered securities representative, is required to have Samuel send a\ncopy of his account statements to the compliance officer at Pope's employer.\nPope opposes certain policies of the government of Lower Pannonia and does not\nwish to own any securities of companies that do business with its regime.\nTo complete his assessment of Pope's investment constraints, Samuel still needs to inquire\nabout Pope's:", "opts": ["unique circumstances.", "tax concerns.", "liquidity needs."], "ans": "B", "expl": "Of the five categories of investment constraints, the four matters listed are related to\nPope's time horizon (years to retirement), liquidity needs (available cash), legal and\nregulatory factors (required copies of account statements to Pope's compliance officer),\nand unique needs and preferences (no investments in Lower Pannonia). None of these\nconstraints address Pope's tax situation or the taxable status of the investment account.\n(Module 86.1, LOS 86.e)"}];
const CFG = {"title": "Basics of Portfolio Planning and Construction", "subtitle": "CFA · Portfolio Management · Reading 86 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
