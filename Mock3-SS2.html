<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Hedge funds are most likely characterized by:", "opts": ["significant investment restrictions.", "a high correlation of returns with investment-grade bonds.", "performance relative to a traditional portfolio that may be hard to gauge."], "ans": "C", "expl": "A. Incorrect because hedge funds are also subject to much lighter regulatory, compliance, and transparency\nrequirements. With more flexibility in portfolio construction, hedge funds enjoy leeway to invest in situations in\nwhich time may be needed to generate an expected return.\nB. Incorrect because hedge fund performance has a very low correlation with that of traditional asset classes, such\nas investment bonds and currencies/cash. (However, hedge funds have a fairly high correlation with equities.)\nC. Correct because hedge fund portfolios approach return generation differently from traditional portfolios. The most\nsignificant difference is that hedge funds seek to limit market exposure and returns from beta and primarily focus\nHedgeFunds\n· analyze sources of risk, return, and diversification among hedge fund investments", "qhtml": null}, {"n": 2, "q": "The price of a forward contract most likely:", "opts": ["decreases as the price of the underlying goes up.", "is constant and set as part of the contract specifications.", "increases as market risk increases."], "ans": "B", "expl": "A. Incorrect. The price of a forward contract is not affected by market conditions. It is set as part of the contract\nspecifications.\nB. Correct. The price of a forward contract remains constant throughout the life of the contract. It is set as part of the\ncontract specifications.\nC. Incorrect. The price of a forward contract is not affected by market conditions. It is set as part of the contract\nspecifications.\nPricing and valuation of forward contracts and for an underlying with varying maturities\nexplain how the value and price of a forward contract are determined at initiation, during the life of the contract, and\nat expiration\nDiscuss\nFilter", "qhtml": null}, {"n": 3, "q": "Which of the following is most likely a distinction between futures and forward\ncontracts? Futures contracts are:", "opts": ["easily customized.", "traded on an exchange.", "more attractive than forwards for long positions when futures prices are negatively correlated to interest rates."], "ans": "B", "expl": "futures exchange, and are more heavily regulated, whereas forward contracts are typically private, customized\ntransactions. Therefore, it is more likely that forwards would be customizable than future contracts.\nB. Correct because futures contracts differ from forward contracts in that they have standard terms, are traded on a\nfutures exchange, and are more heavily regulated, whereas forward contracts are typically private, customized\ntransactions.\nC. Incorrect because a negative correlation between futures prices and interest rates leads to the opposite\ninterpretation, with forwards being more desirable than futures to the long position. The more desirable contract\nwill tend to have the higher price.\nPricing and Valuation of Futures Contracts\nexplainwhyforwardandfuturespricesdiffer\nDiscuss ①\nFilter\nDiscussion", "qhtml": null}, {"n": 4, "q": "Which of the following yield curves is a sequence of breakeven reinvestment\nrates?", "opts": ["Par curve", "Spot curve", "Forward curve"], "ans": "C", "expl": "A. Incorrect because the spot curve is used to derive two other important yield curves: the par curve and the forward\ncurve. A par curve involves bond yields for hypothetical benchmark securities priced at par.\nB. Incorrect because yields-to-maturity on a series of default-risk-free zero-coupon bonds, are known as spot rates.\nThe spot curve is used to derive two other important yield curves: the par curve and the forward curve. A par curve\ninvolves bond yields for hypothetical benchmark securities priced at par, while the forward curve involves rates for\ninterest periods starting in the future.\nC. Correct because spot rates can also be used to calculate implied forward rates (also known as forward yields),\nwhich are breakeven reinvestment rates. They link the return on an investment in a shorter-term zero-coupon bond\nto the return on an investment in a longer-term zero-coupon bond.\nThe Term Structure of Interest Rates: Spot, Par, and Forward Curves\nIcompare the spot curve, par curve, and forward curve\nDiscuss ①\nFilter\nDiscussion", "qhtml": null}, {"n": 5, "q": "The sensitivity of a 30-year fixed-rate bond to a 50 basis points increase in the\nbenchmark rate at the 25-30 years maturity segment is best measured by:", "opts": ["key rate duration.", "effective duration.", "modified duration."], "ans": "A", "expl": "A. Correct because key rate duration provides further insight into a bond's sensitivity to changes in the benchmark\nyield curve. A key rate duration (or partial duration) is a measure of a bond's sensitivity to a change in the\nbenchmark yield curve at a specific maturity segment.\nB. Incorrect because effective duration is a curve duration statistic in that it measures interest rate risk in terms of a\nparallel shift in the benchmark yield curve (△Curve).\nC. Incorrect because modified duration provides an estimate of the percentage price change for a bond given a\nchange in its yield-to-maturity.\nCurve-Based and Empirical Fixed-lncome Risk Measures\n1 define key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark\nyield curve changes\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 6, "q": "In using matrix pricing to estimate the required yield spread on a new corporate\nbond issue, the benchmark rate used is most likely to be the:", "opts": ["coupon rate on a government bond with a similar time to maturity.", "yield to maturity on a government bond with a similar time to maturity.", "yield to maturity on a corporate bond with similar credit risk and time to maturity."], "ans": "B", "expl": "A. Incorrect because the benchmark rate is measured relative to the yield to maturity and not the coupon rate.\nB. Correct because matrix pricing also is used in underwriting new bonds to get an estimate of the required yield\nspread over the benchmark rate, or the difference in yield-to-maturity between the bond and that of a government\nbenchmark bond with the same or a similar time-to-maturity.\nsimilar corporatebond.\nFixed-lncome Bond Valuation: Prices and Yields\ndescribe matrix pricing\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 7, "q": "Which type of preference shares can be exchanged into a predetermined number\nof common shares?", "opts": ["Convertible preference shares", "Cumulative preference shares", "Participating preference shares"], "ans": "A", "expl": "A. Correct because convertible preference shares entitle shareholders to convert their shares into a specified\nnumber of common shares.\ndividend in one or more periods, the unpaid dividends accrue and must be paid in full before dividends on common\nshares can be paid.\nC. Incorrect because participating preference shares entitle the shareholders to receive the standard preferred\ndividend plus the opportunity to receive an additional dividend if the company's profits exceed a pre-specified\nlevel.\nOverview of Equity Securities\n?describe characteristics of types of equity securities\nDiscuss\nFilter\nDiscussion\nWhat doyouwant to discuss...(required)", "qhtml": null}, {"n": 8, "q": "Privately held convertible debt is most likely used by companies in which of the\nfollowing life cycle stages?", "opts": ["Seed", "Growth", "Maturity"], "ans": "A", "expl": "A. Correct because privately held convertible debt is relied on in the seed or start-up stages of the corporate life\ncycle.\nB. Incorrect because privately held convertible debt is relied on in the seed or start-up stages of the corporate life\n o.\nC. Incorrect because the prices at which ETFs trade rarely differ much from net asset values. The market price and\nnet asset values of ETFs tend to converge.\nMarket Organization and Structure\n· describe the major types of securities, currencies, contracts, commodities, and real assets that trade in organized\nmarkets, including their distinguishing characteristics and major subtypes\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 12, "q": "In an equally weighted portfolio, the diversification ratio is best described as a\nmeasure of the:", "opts": ["relative level of risk between any two individual assets.", "amount of risk an asset contributes to the portfolio's risk.", "risk reduction benefit of investing in the portfolio versus a security from the portfolio."], "ans": "C", "expl": "A. Incorrect because the diversification ratio compares volatility between a portfolio and a single asset, not between\ntwo single assets. A simple measure of the value of diversification is calculated as the ratio of the standard\ndeviation of the equally weighted portfolio to the standard deviation of the randomly selected security.\nB. Incorrect because the diversification ratio compares the risk of an overall portfolio relative to a single security; it\ndoes not measure the amount of risk an asset contributes to the portfolio's risk.\nC. Correct because the level of risk reduction from the portfolio approach to investing, relative to the risk of investing\ncalculated as the ratio of the standard deviation of the equally weighted portfolio to the standard deviation of the\nrandomly selected security. This ratio may be referred to as the diversification ratio. The diversification ratio of\na simple portfolio construction method, equal weighting.\nPortfolio Management: An Overview\n·describe the portfolio approach to investing\nDiscuss\nFilter\ni", "qhtml": null}, {"n": 13, "q": "Based solely on the P/E and P/CF ratios, which company appears overvalued?", "opts": ["Company A", "Company B", "Company C"], "ans": "A", "expl": "A. Correct. Company A has the highest P/E multiple and the highest P/CF multiple. Given the law of one price, similar\ncompanies should trade at similar P/E and P/CF levels. Thus, Company A is the company that appears overvalued\nrelative to its peers.\nB. Incorrect because Company B has the lowest P/E and P/CF multiples; therefore, it does not appear overvalued\nrelative to its peers.\nC. Incorrect because Company C has lower P/E and P/CF multiples than Company A and has P/E and P/CF multiples\nthat are below the industry P/E and P/CF averages. Therefore, Company C does not appear to be overvalued\nrelative to its peers.\nEquity Valuation: Concepts and Basic Tools\ncalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to\nsales, andprice tobookvalue", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAE3CAIAAAAhZ1u6AACW6UlEQVR42u3ddVwU2/s48DO7bMDS3SAhISogdnd3Byp2t9e81lWxO7DrKgaiYBcKqCAlobR0dy6bM78/zs/57ocSvXpjed5/+FqX2Tpz5swz5zznDBEcHIwA+H4URcG3+isfRxDEf6JIf+CH/Hd/CwBNqd7wteXsRxEEQVEUg8Fo+kc39GXo5+s+aOS/BEE0vlmtbep9c/qx7A/5sQ2aUubyUccU9PX1oZkDAAAAAEDQt4WaUXcGA/Y6AAAAAABobggYtQQAAAAAAM0N9AQDAAAAAAAIggEAAAAAAIAgGAAAAAAAAAiC/z6pqakCgQB2EgAAAAAAaEZBcEFBgVAohJ0EAAAAAAAgHQIAAAAAAAAIggEAAAAAAIAgGAAAAAAAAAiCAQAAAAAA+GVB8LNnz/bt25efn/8v+XlisRj2MQAAAAAAqEXh576dj4/PmzdvioqK9u3b9w/+KoqiAgMD4+Pj+Xy+paWljo5Op06d/qkvExISIpFIVFRUWrdu/Ut/Mr4DNoNRz4UNn89XVFQkCOKvfIRQKMzLy0tNTUUI9erVq6GrjsrKSg0NjXo/i6IooVDI5XLhwAMAAACAXAXBfD6foqgHDx4ghFauXGlgYPD3/6QlS5aEh4eXlZXJPmloaDhw4MDffvvtV3/6vn37goKCEEKbN29u164dQmjRokXV1dW2trb37t37pZ97+fJlLpf78eNH+sng4ODly5fX1NSIxWIGg6Gvr9+7d+/Nmzf/wPuLRKJu3bpVVVUhhFgsVnR0dN1tBg8enJ6eTlEUQRCqqqqnT592dHTE0bC/v/9vv/2GvwmLxbK2tt67d6+VlRUcgQAAAABA8pQT/Pjx46NHj/4jP8nPz69WBIwQysnJuXHjRnV1Nfr1N/iIj4+Pj48vKir6235yQEDAy5cvEUK4MxhLS0s7e/ZsRUUFzgkhSTInJ+fOnTuy2zRdVVUVjoAb4unpmZ ceive before the stock is sold and depends indirectly on the expected dividends for periods\nthe estimated intrinsic value of the stock for a one-year holding period will be the same as for a five-year holding\nperiod.\nC. Incorrect because the estimated intrinsic value of the stock for a one-year holding period will be the same as for a\nfive-year holding period.\nEquity Valuation: Concepts and Basic Tools\nexplain the rationale for using present value models to value equity and describe the dividend discount and free-\ncash-flow-to-equity models\nDiscuss\nFilter\ni", "qhtml": null}, {"n": 20, "q": "A credit issuer rating assigned by a rating agency is based on:", "opts": ["the notching adjustment of a specific bond of the issuer.", "the ranking of a specific bond in the issuer's capital structure.", "the issuer's ability and willingness to service its senior unsecured debt."], "ans": "C", "expl": "A. Incorrect because an issue rating is notched from the issuer rating, not the other way round. The rating agencies\nhave adopted a notching process whereby their credit ratings on issues can be moved up or down from the issuer\nrating,\nB. Incorrect because an issue rating, not an issuer rating, should consider ranking in the capital structure. Issue\ncapital structure (e.g., secured or subordinated).\nwillingness to make timely payments of interest and principal on its debt. The issuer credit rating usually applies to\nitssenior unsecured debt.\nCredit Analysis for Corporate Issuers\n· describe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and\ntheir impact on credit ratings\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 21, "q": "A net investment hedge occurs when a derivative is used to:", "opts": ["offset the fluctuation in the fair value of an asset or liability.", "absorb the variable cash flow of a floating rate asset or liability.", "offset the exchange rate risk of the equity of a foreign operation."], "ans": "C", "expl": "A. Incorrect because this describes a fair value hedge, not a net investment hedge. A fair value hedge designation\napplies when a derivative is deemed to offset the fluctuation in fair value of an asset or liability.\nB. Incorrect because this describes a cash flow hedge, not a net investment hedge. Derivatives designated as\ncommodities are referred to as cash flow hedges.\nC. Correct because net investment hedges occur when either a foreign currency bond or a derivative such as an FX\nswap or forward is used to offset the exchange rate risk of the equity of a foreign operation.\nDerivative Benefits, Risks, and Issuer and Investor Uses\ncompare the use of derivatives among issuers and investors\nDiscuss\nFilter\n1\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 22, "q": "The value effect anomaly:", "opts": ["contradicts semi-strong market efficiency.", "was identified using time series of data only.", "states that growth stocks have consistently outperformed value stocks."], "ans": "A", "expl": "A. Correct because the value stock anomaly contradicts semi-strong market efficiency because all the information\nused to categorize stocks in this manner is publicly available.\nthe anomaly. Time-series anomalies were identified using time series of data. Cross-sectional anomalies were\nidentified based on analyzing a a cross section of companies that differ on some key characteristics. The value\neffect was found based on cross-sectional analysis.\nC. Incorrect because the value stock anomaly refers to the studies that have shown that value stocks have\nconsistently outperformed growth stocks over long periods of time.\nMarket Efficiency\ndescribe market anomalies\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 23, "q": "A company's series B, 8% preferred stock has the following features:\n○ A par value of $50, and it pays quarterly dividends.\n○ Its current market value is $35.\n○ The shares are retractable (at par) with the retraction date set for three years\nfrom today.\n○ Similarly rated preferred issues have an estimated nominal required rate of\nreturn of 12%.\n○ Analysts expect a sustainable growth rate of 4% for the company's earnings.\nThe intrinsic value estimate of a share of this preferred issue is closest to:", "opts": ["$33.33.", "$45.02.", "$52.00."], "ans": "B", "expl": "A. Incorrect. This value is simply the perpetual cash flow model to find a preferred stock's intrinsic value, which is\nannual dividend divided by required return = $4/0.12 = $33.33. This calculation fails to incorporate the retractable\nnature of the shares.\nB. Correct. Because the current market value is well below the retraction price, retraction is likely, and the preferred\nshare will be priced on the basis of its retraction feature.\nQuarterly dividend = ($50 x 0.08)/4 = $1 a share\nQuarterly required return = 12%/4 = 3%\nThe value is calculated as follows:\nV。 = $1/1.03 + 1/1.032 + . . $1/1.0312 + $50/1.0312 = $45.02\nQuestion 23 of 90\nSolution\nA. Incorrect. This value is simply the perpetual cash flow model to find a preferred stock's intrinsic value, which is\nannual dividend divided by required return = $4/0.12 = $33.33. This calculation fails to incorporate the retractable\nnature of the shares.\nB. Correct. Because the current market value is well below the retraction price, retraction is likely, and the preferred\nshare will be priced on the basis of its retraction feature.\nQuarterly dividend = ($50 x 0.08)/4 = $1 a share\nQuarterly required return = 12%/4 = 3%\nThevalue iscalculated asfollows:\nVo = $1/1.03 + 1/1.032 + . . . $1/1.0312 + $50/1.0312 = $45.02\nOr, using a financial calculator:\nPMT = $1; N = 12; FV = $50; / = 3%; Compute PV = $45.02.\nC. Incorrect. It incorrectly applies constant growth model to preferred stock valuation.\nVo = 4(1.04)/(0.12 - 0.04) = $52.00\nEquity Valuation: Concepts and Basic Tools\ncalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 24, "q": "The return on investment is closest to:", "opts": ["18%.", "25%.", "30%."], "ans": "C", "expl": "A. Incorrect because it has omitted the dividend received in the calculation of returns, consequently:\nCost of purchase\nShares purchased x Purchase price = 10,000 x $100 = $1,000,000\nEquity invested\nCost of purchase / Leverage ratio = $1,000,000 / 2.5 = $400,000\nInitial investment\nEquity invested = $400,000\nCost of purchase - Equity invested = $1,000,000 - $400,000\nAmount borrowed\n= $600,000\nSales proceeds\nShares sold × Sales price = 10,000 × $110 = $1,100,000\nQuestion 24 of 90\nSolution\nA. Incorrect because it has omitted the dividend received in the calculation of returns, consequently:\nCost of purchase\nEquity invested\nCost of purchase / Leverage ratio = $1,000,000 / 2.5 = $400,000\nInitial investment\nEquity invested = $400,000\nCost of purchase - Equity invested = $1,000,000 - $400,000\nAmount borrowed\n= $600,000\nSales proceeds\nShares sold x Sales price = 10,000 x $110 = $1,100,000\nInterest paid\nAmount borrowed × Call money rate = $600,000 × 5% = $30,000\nDividend received\n= $50,000\nSales Proceeds - Cost of purchase - Interest paid = $1,100,000 - $1,000,000 -\nNet gain/loss\n$30,000= $70,000\nNet gain/loss / Initial investment\nReturn on investment\n= $70,000 / $400,000\n= 17.5 ~ 18%\nB. Incorrect because it has miscalculated the interest cost based on the cost of purchase instead of the amount\nborrowed,consequently:\nCost of purchase\nShares purchased × Purchase price = 10,000 × $100 = $1,000,000\nEauityinvested\n/2.5=$400.000\nQuestion 24 of 90\n=17.5 ~ 18%\nB. Incorrect because it has miscalculated the interest cost based on the cost of purchase instead of the amount\nborrowed, consequently:\nCost of purchase\nEquity invested\nCost of purchase / Leverage ratio = $1,000,000 / 2.5 = $400,000\nInitial investment\nEquity invested = $400,00 ized\nexchanges, brokerages, securitization, clearing houses, and so forth.\nMarket Organization and Structure\n· describe characteristics of a well-functioning financial system\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 27, "q": "Which of the following is least likely a primary reason a company would raise\ncapital through the issuance of equity securities?", "opts": ["Maximize the wealth of shareholders", "Directly satisfy stock compensation plans", "Finance the purchase of long-lived assets"], "ans": "B", "expl": "A. Incorrect. The primary goal of raising capital is to finance the company's revenue generating activities in order to\nincrease its net income and maximize the wealth of its shareholders.\nB. Correct. In general, a company will utilize share buybacks to satisfy stock compensation plans.\nC. Incorrect. In most cases, the capital that is raised through equity issuance is used to finance the purchase of long-\nlived assets, capital expansion projects, research and development, the entry into new product or geographic\nregions, and the acquisition of other companies.\nOverview of Equity Securities\n·explain the role of equity securities in the financing of a company's assets\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 28, "q": "Mass redemptions may force the sale of underlying real estate by managers of:", "opts": ["open-end funds only.", "publicly traded REITs only.", "both open-end funds and publicly traded REITs."], "ans": "A", "expl": "experiencing mass redemptions.\nB. Incorrect because the REiT is not forced to sell the company's underlying real estate like open-end funds\nexperiencing mass redemptions.\nC. Incorrect because the REiT is not forced to sell the company's underlying real estate like open-end funds\nexperiencing mass redemptions.\nReal Estate Infrastructure\nexplain features and characteristics of real estate\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 29, "q": "The bonds of Apex Corporations have a par value of $10,000 each and an annual\nrequired rate of return of 10%.\nThe bonds make quarterly coupon payments at an annual rate of 6% and have two\nyears remaining until maturity. The current market price of each bond is closest to:", "opts": ["$9,283.", "$9,306.", "$10,749."], "ans": "A", "expl": "A. Correct. Using the quarterly coupon payment of $150 [= (0.06 x 10000)/4] over eight quarters and a quarterly\nrequired rate of return of 2.5%, we calculate the bond's price as:\nP。 = 150/(1.025)1 + 150/(1.025)2 + ... + 150/(1.025)° + 10,000/(1.025)8 = $9,282.99\nB. Incorrect because the bond's price is computed using the annual coupon payment of $600 [= (0.06 x 10,000)] over\n2 years and the annual required rate of return of 10%:\nP。 = 600/(1.10)1 + (600 + 10,000)/(1.10) = $9,305.79\na quarterly required rate of return of 1.5%:\n68011 = 8(1101)/00001 + 8(1101)/0 +  + 21101)092 + ,(1001)/0 = 0\nFixed-lncome Bond Valuation: Prices and Yields\ncalculate a bond's price given a yield-to-maturity on or between coupon dates", "qhtml": null}, {"n": 30, "q": "Which of the following is most likely an example of a Eurobond?", "opts": ["A Japanese borrower issuing US dollar-denominated bonds in the US market.", "A Canadian borrower issuing British pound-denominated bonds in the UK market.", "An Australian borrower issuing Canadian dollar-denominated bonds in the UK market."], "ans": "C", "expl": "A. Incorrect because this is an example of a foreign bond, which is a bond issued by an entity incorporated in a\ncountry other than where the bond is issued and in whose currency the bond is denominated.\nB. Incorrect because this is an example of a foreign bond, which is a bond issued by an entity incorporated in a\ncountry other than where the bond is issued and in whose currency the bond is denominated.\nC. Correct. A Eurobond is an international bond issued outside the jurisdiction of any one country and not\ndenominated in the currency of the country where it is issued.\nFixed-lncome Cash Flows and Types\nI describe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities\nDiscuss\nFilter\ni\nDiscussion\nWhat do you want to discuss...(required)", "qhtml": null}, {"n": 31, "q": "For a bond investment, loss severity is:", "opts": ["independent of the recovery rate.", "used in the calculation of the expected loss.", "the primary focus when assessing the creditworthiness of high-quality issuers."], "ans": "B", "expl": "A. Incorrect because loss severity is often expressed as (1 - Recovery rate), where the recovery rate is the\npercentage of the principal amount recovered in the event of default.\nB. Correct because Expected loss = Default probability x Loss severity given default.\nC. Incorrect because loss severity is most relevant for lower-quality debt issuers. Because default risk (default\nprobability and devote less effort to assessing the potential loss severity arising from default.\nCredit Risk\ndescribe credit risk and its components, probability of default and loss given default\nDiscuss\nFilter\ni\nDiscussion\nWhat do you want to discuss...(required)", "qhtml": null}, {"n": 32, "q": "For a call option, if the underlying asset's value is less than the option's exercise\nprice, the option is said to be:", "opts": ["at the money.", "out of the money.", "in the money."], "ans": "B", "expl": "A. Incorrect. For an at-the-money call option, the value of the underlying asset is equal to the option's exercise price,\nand the option buyer would be indifferent between exercising or not exercising the option.\nB. Correct. If the underlying asset's value is less than the option's exercise price, the call option is not worth\nexercising and is said to be out of the money.\nC. Incorrect. For an in-the-money call option, the value of the underlying asset is greater than the option's exercise\nprice, and the option is worth exercising.\nForward Commitment and Contingent Claim Features and Instruments\ndefine forward contracts, futures contracts, swaps, options (calls and puts), and credit derivatives and compare their\nbasic characteristics\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 33, "q": "For European options, all else being equal, a higher exercise price results in a\nhigher value for:", "opts": ["puts only.", "calls only.", "both puts and calls."], "ans": "A", "expl": "A. Correct because the value of a European call option is inversely related to the exercise price whereas the value of\na European put option is directly related to the exercise price. Therefore, all else being equal, the higher the\nexercise price, the higher is the value of European puts and the lower is the value of European calls.\nB. Incorrect because higher exercise price results in a higher value for puts only (not calls), as explained in the\nrationale for the correct answer.\nC. Incorrect because higher exercise price results in a higher value for puts only (not calls), as explained in the\nrationale for the correct answer.\nPricing and Valuation of Options\n· identify the factors that determine the value of an option and describe how each factor affects the value of an option\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 34, "q": "If the bond's yield to maturity increases to 7.25%, the bond's estimated market\nvalue will be closest to:", "opts": ["$9,746,599.", "$10,271,142.", "$10,832,403."], "ans": "C", "expl": "A. Incorrect because $9,746,818 results from incorrectly using a yield to maturity of 4.5% (the semiannual coupon\nrate rather than the 6.57% yield to maturity):\n△AnnYield ≠ 7.25%-4.50% = 2.75% or 0.0275\n%△PvFull ~ -AnnModDur × AnnYield ≈ -4.687985 × 0.0275 = -0.1289 or -12.89%\n$11,189,092 x (1 - 0.1289) = $9,746,599.\nB. Incorrect because the res ue will be closest to:"}, {"n": 35, "q": "Assume management fees are calculated using end-of-period valuation. The\ninvestor's net return given this fee structure is closest to:", "opts": ["9.68%.", "9.79%.", "10.88%."], "ans": "B", "expl": "A. Incorrect. It ignores the fact that the incentive fee is calculated net of management fees. Management fee: 1% of\n$112 million = $1.12 million.\nIncentive fee: 10% of $12 million = $1.2 million.\nFund value after fees: $112 million - $1.12 million - $1.2 million = $109.68 million\nInvestor return: ($109.68 million / $100 million) - 1 = 9.68%\nB. Correct.\nManagement fee: 1% of $112 million = $1.12 million\nIncentive fee: 10% of ($12 million - $ 1.12 million) = $1.088 million\nFund value after fees: $112 million - $1.12 million - $1.088 million = $109.792 million\nQuestion35 of 90\nSolution\nA. Incorrect. It ignores the fact that the incentive fee is calculated net of management fees. Management fee: 1% of\n$112 million = $1.12 million.\nIncentive fee: 10% of $12 million = $1.2 million.\nFund value after fees: $112 million - $1.12 million - $1.2 million = $109.68 million\nInvestor return: ($109.68 million / $100 million) - 1 = 9.68%\nB. Correct.\nManagement fee: 1% of $112 million = $1.12 million\nIncentive fee: 10% of ($12 million - $ 1.12 million) = $1.088 million\nFund value after fees: $112 million - $1.12 million - $1.088 million = $109.792 million\nInvestor return: ($109.792 million/$100 million) - 1 = 9.79%\nC. Incorrect. It neglects the incentive fee.\nManagement fee: 1% of $112 million = $1.12 million\nFund value after fees: $112 million - $1.12 million = $110.88 million\nInvestor return: ($110.88 million/$100 million) - 1 = 10.88%\nAlternative Investment Performance and Returns\ncalculate and interpret alternative investment returns both before and after fees", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAADsCAIAAAD/6bziAACDdUlEQVR42u3dd1wUx9sA8Lk7rnB39N6rgCKKYEMNNgQV7LFE7F3 ect because GAAP accounting rules in the United States created a methodology that involves the\ncategorization of investments into three buckets: Level 1, 2, and 3 asset pricing. Level 1 assets involve situations\nwhere an exchange-traded, publicly traded price is available and is mandated to be used for valuation purposes.\nWhen such pricing is not available, outside broker quotes, or Level 2 values, may be relied on. As a final recourse,\nwhen such broker quotes are deemed either unavailable or unreliable, assets may be computed using only internal\nmodels-—a process referred to as Level 3 asset pricing.\nAlternative InvestmentPerformance and Returns\n·describe theperformance appraisal of alternative investments\nDiscuss\nFilter", "qhtml": null}, {"n": 37, "q": "One source of return for an investor in a fixed-rate corporate bond is most likely\nthe:", "opts": ["bid-ask spread.", "interest on the collateral.", "reinvestment of coupon payments."], "ans": "C", "expl": "A. Incorrect because the bid-offer spread or bid-ask spread, which reflects the prices at which dealers will buy from a\ncustomer (bid) and sell to a customer (offer or ask), is very often used as an indicator of liquidity, not a source of\ns a o   s ns       ps s u s\nthe bond to the investor.\npaying ability of an operating entity but on the cash flows generated by one or more underlying financial assets,\nsuch as mortgages or auto loans. Interest on the collateral of the bond may be a source of return from certain ABs,\nbut not from a typical fixed-rate corporate bond.\nC. Correct because the fixed-rate bond investor has three sources of return: (1) receipt of the promised coupon and\nprincipal payments on the scheduled dates, (2) reinvestment of coupon payments, and (3) potential capital gains or\nlosses on the sale of the bond prior to maturity.\nInterest Rate Risk and Return\ncalculate and interpret the sources of return from investing in a fixed-rate bond;\nDiscuss\nFilter\n1", "qhtml": null}, {"n": 38, "q": "Which of the following performance measures is only relevant for\nwell-diversified portfolios?", "opts": ["Sharpe ratio", "Jensen's alpha", "M-squared (M3)"], "ans": "B", "expl": "A. Incorrect because total risk is relevant for an investor when he or she holds a portfolio that is not fully diversified,\nwhich is not a desirable portfolio. In such cases, the Sharpe ratio and M? are appropriate performance measures.\nPerformance measures relative to beta risk-Treynor ratio and Jensen's alpha—are relevant when the investor\nholds a well-diversified portfolio with negligible diversifiable risk. Thus, the Sharpe ratio, which considers total risk,\nis not an appropriate performance measure for an investor that holds a well-diversified portfolio.\nB. Correct because total risk is relevant for an investor when he or she holds a portfolio that is not fully diversified,\nwhich is not a desirable portfolio. In such cases, the Sharpe ratio and M? are appropriate performance measures.\nPerformance measures relative to beta risk—Treynor ratio and Jensen's alpha—are relevant when the investor\nholds a well-diversified portfolio with negligible diversifiable risk. Thus, Jensen's alpha, which considers only beta\nrisk, is an appropriate performance measure for an investor that holds a well-diversified portfolio.\nC. Incorrect because total risk is relevant for an investor when he or she holds a portfolio that is not fully diversified,\nwhich is not a desirable portfolio. In such cases, the Sharpe ratio and M? are appropriate performance measures.\nPerformance measures relative to beta risk—Treynor ratio and Jensen's alpha—are relevant when the investor\nPortfolio Risk and Return: Part Il\n· calculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen's alpha", "qhtml": null}, {"n": 39, "q": "Which of the following behavioral biases most likely helps explain the\nmomentum market anomaly?", "opts": ["Status quo bias", "Availability bias", "Anchoring and adjustment bias"], "ans": "B", "expl": "A. Incorrect because status quo bias is an emotional bias in which people choose to do nothing (i.e., maintain the\nstatus quo') instead of making a change, even when change is warranted. While this could be incorrectly\nexplained by availability, hindsight, and loss aversion biases.\nB. Correct because momentum can be partly explained by availability, hindsight, and loss aversion biases. Studies\nhave identified faulty learning models within traders, in which reasoning is based on their recent experience.\nBehaviorally, this is availabilitybias.\nC. Incorrect because anchoring and adjustment bias refers to relying on an initial piece of information to make\naversion biases.\nThe Behavioral Biases of Individuals\n· describe how behavioral biases of investors can lead to market characteristics that may not be explained by\ntraditional finance\nDiscuss ①\nFilter", "qhtml": null}, {"n": 40, "q": "A good risk management framework:", "opts": ["is a top-down process and guidance directing risk management activities.", "seeks to prioritize avoidance of financial loss over defining policies and processes.", "is typically a process that addresses a common set of factors within different organizations."], "ans": "C", "expl": "A. Incorrect. Risk governance is the top-down process and guidance that directs risk management activities to align\nwith andsupport theoverall enterprise.\nB. Incorrect. A good risk management framework prioritizes the definition of policies and procedures over avoidance\nof financial loss.\nC. Correct. Good risk management may not prevent losses but provides a framework that addresses common\nfactors, such as risk governance, risk infrastructure, policies and procedures, risk monitoring, and integration,\npreviously given: It is the infrastructure, process, and analytics needed to support effective risk management in an\nsupport of best achieving its goals within its tolerance for risk. Risk management is not a “one-size-fits-all\" solution;\nit is integral to the enterprise's goals and needs. Despite customization, every risk management framework should\naddress the commonfactors listed above.\nIntroduction to Risk Management\n· describe features of a risk management framework\nDiscuss θ\nFilter", "qhtml": null}, {"n": 41, "q": "For a coupon bond with a positive yield, compounding more frequently within\nthe year results in a yield-to-maturity that is:", "opts": ["less positive.", "the same.", "more positive."], "ans": "A", "expl": "A. Correct because for a given pair of cash flows, the stated annual rate and the periodicity are inversely related.\nThus, increasing the frequency of compounding reduces the annual rate.\nB. Incorrect because for a given pair of cash flows, the stated annual rate and the periodicity are inversely related.\nThus, increasing the frequency of compounding reduces the annual rate. The annual rate does not stay the same.\nC. Incorrect because for a given pair of cash flows, the stated annual rate and the periodicity are inversely related.\nThus, increasing the frequency of compounding reduces, not increases, the annual rate.\nYield and Yield Spread Measures for Fixed-Rate Bonds\ncalculate annual yield on a bond for varying compounding periods in a year\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 42, "q": "Which of the following ESG investment approaches best describes positive\nscreening?", "opts": ["Systematic consideration of material ESG factors in asset allocation", "Inclusion of sectors or companies in the portfolio based on specific ESG criteria", "Investments made with the intention to generate positive, measurable social and environmental impact"], "ans": "B", "expl": "A. Incorrect because this describes ESG integration, not positive screening. ESG integration is defined as the\ndecisions.\nB. Correct because positive screening is defined as including sectors or companies based on specific ESG e general partner's performance fee.\nC. represents the minimum rate of return that must be exceeded in order to earn a performance fee.\nSolution\nhigh-water mark, which reflects the highest value used to calculate an incentive fee. A high-water mark is the\nhighest value of the fund investment ever achieved at a performance fee crystallization date, net of fees, by the\nthe high-water mark before performance fees can be charged on newly generated profits. The use of high-water\nmarks protects clients from paying twice for the same performance.\ne sa     si s   s a  e fi d l\naccruals and payments. Clawback provisions are usually activated when a GP exits successful deals early on but\nincurslossesondealslater inthefund'slife.\no    si   y   sd s a i\nexceed in order to earn the performance fee. GPs typically receive 20% of the total profit of the private equity fund\ns  s    s\nof the soft hurdle rate, in which case the fee is calculated on the entire annual gross return as long as the set\nhurdleisexceeded.\nAlternative Investment Features, Methods, and Structures\n· describe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null}, {"n": 47, "q": "Which of the following is categorized as a social infrastructure asset?", "opts": ["Airport", "Correctional facility", "Telecommunication tower"], "ans": "B", "expl": "A. Incorrect because an airport is a transportation asset and transportation assets are classified as economic (not\nsocial) infrastructure assets.\nB. Correct because social infrastructure assets are directed toward human activities and include such assets as\neducational, health care, social housing, and correctional facilities, with the focus on providing, operating, and\nmaintaining the asset infrastructure.\nC. Incorrect because a telecommunication tower is an information and communications technology (IcT) asset and\nICT assets are classified as economic (not social) infrastructure assets.\nReal Estate Infrastructure\n·explainfeatures and characteristics of infrastructure\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 48, "q": "Which of the following is best classified as\nnon-financial risk?", "opts": ["Credit risk", "Market risk", "Solvency risk"], "ans": "C", "expl": "A. Incorrect because credit risk is a financial risk. The three primary types of financial risks are market risk, credit risk,\nand liquidity risk. Credit risk is the risk of loss if one party fails to pay an amount owed on an obligation, such as a\nbond, loan, or derivative, to another party.\nrates, and commodity prices.\nC. Correct because, although most risks have monetary consequences, there are a number of risks that are typically\nclassified as non-financial in nature. These risks arise from a variety of sources, such as from actions within the\norganization and counterparties, regulators, governments, suppliers, and customers.\nAn example of non-financial risk is solvency risk, which is the risk that the organization does not survive or\nsucceed because it runs out of cash, even though it might otherwise be solvent.\nIntroduction to Risk Management\nDiscuss\nFilter", "qhtml": null}, {"n": 49, "q": "With respect to margin, the leverage ratio:", "opts": ["is the value of the equity investment divided by the value of the position.", "is the minimum fraction of the purchase price that must be trader's equity.", "indicates how many times larger a position is than the equity that supports its"], "ans": "C", "expl": "A. Incorrect because the leverage ratio is the ratio of the value of the position to the value of the equity investment in\nit.\nB. Incorrect because the initial margin requirement (not the leverage ratio) is the minimum fraction of the purchase\nprice that must be trader's equity.\nC. Correct because the leverage ratio indicates how many times larger a position is than the equity that supports it.\nMarket Organization and Structure\nthe investor would receive a margin call\nDiscuss\nFilter\ni\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 50, "q": "An investment-grade bond index is typically further\nsubdivided by:", "opts": ["maturity only.", "credit rating only.", "both maturity and credit rating."], "ans": "C", "expl": "A. Incorrect because investment-grade indexes are typically subdivided by maturity (i.e., short, intermediate, or long)\nand by credit rating (e.g., AAA, BBB, etc.).\nB. Incorrect because investment-grade indexes are typically subdivided by maturity (i.e., short, intermediate, or long)\nand by credit rating (e.g., AAA, BBB, etc.).\nC. Correct because investment-grade indexes are typically further subdivided by maturity (i.e., short, intermediate, or\nlong) and by credit rating (e.g., AAA, BBB, etc.).\nSecurity Market Indexes\ndescribetypesoffixed-incomeindexes\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 51, "q": "The total fees (in $ millions) earned by the hedge fund\nin Year 1 are:", "opts": ["3.84.", "4.30.", "4.84."], "ans": "C", "expl": "A. Incorrect because the soft hurdle rate is treated as a hard hurdle rate. The management fee is $2,300,000\n($115,000,000× .02) and the incentive fee is $1,540,000 (($115,000,000 - $100,000,000 - $2,300,000 -\n$5,000,000 hurdle rate) × .2). Total fees are $3,840,000.\nB. Incorrect because the hurdle rate is treated as a hard hurdle rate and the incentive fee is calculated independently\nof the management fee. The management fee is $2,300,000 ($115,000,000 × .02) and the incentive fee is\n$2,000,000 (($115,000,000 - $100,000,000 - $5,000,000 hurdle rate) × .2). Total fees are $4,300,000.\ni y   p ( x     s e   '\n(($115,000,000 - $100,000,000 - $2,300,000) × .2). Total fees are $4,840,000. With a soft hurdle rate, the\nincentive fee is earned on all of the return as long as the hurdle rate is exceeded.\nAlternative Investment Performance and Returns kes a direct investment in an asset (labeled\n\"Investment A\") without the use of an intermediary. Direct investors have great flexibility and control when it comes\ne     sn s    s\nspecial vehicle, such as a fund. Direct investment usually applies to private capital and real estate. Sizable\nand natural resources.\nAlternative Investment Features, Methods, and Structures", "qhtml": null}, {"n": 56, "q": "If the price of the underlying at expiration is 260, the\nprofit for the seller is:", "opts": ["5", "10", "15"], "ans": "C", "expl": "A. Incorrect because it represents the put price po less the difference between the exercise price X and the price of\nthe underlying S at expiration: 15 - (260 - 250) = 5. This would be the profit to the seller of a call option,  = -\nis  = -Max(0,X - S) + Po. Therefore,  = -Max(0,250 - 260) + 15 = 15.\nseller, the profit is I = -Max(0,X - St) + Po, where po is the put price. Therefore,  = -Max(0,250 - 260) + 15 = 15.\nC. Correct because to the put seller, the profit is I = -Max(O,X - St) + po, where X is the exercise price, S is the\nForward Commitment and Contingent Claim Features and Instruments\n· determine the value at expiration and profit from a long or a short position in a call or put option", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApUAAACECAIAAABOJkfnAAArZklEQVR42u3de1xM6f8A8M/MdNN0s4RthVyyrEIrt0iq01XblUKli0IXiagssbEIsVQkiVA2EkXKbZcNiZBLWrIKFYp0malmaub8/nhee76zUyw2v8V+3n/0Oj1zzpnnPOfM+Ty3M8O6fPkyoI8bTdPMMovFeo9tJbeS3Nvfvt2/fryd6F2L7hO9QtCne818Kpfo3+aTxWK9bh2pdKl/2Wx2+5ekFtr/lXrT163f/tUOd9Jhysd5gmR69eqFn1KEEEKofYX4Y64cs7DmjhBCCH1y2FgECCGEEMZvhBBCCH1e8bu6urq+vh4LHSGEEML2N0IIIYTxGyGEEEIYvxFCCCH0scTvkydPrl+//kNnrrW1Fc8QQggh1J7M+2124MCBgoKCmpqaDRs2dHqeGhsbFyxYUFxcXF9fr6WltWzZsvHjx3f6uzg6OmpoaMTExLz3Hs6ePfv7778z//r7+wMATdM//vhjWVmZsbHxzJkz33JX27Zty83NtbCw8PPzYxLFYnFMTMydO3e++OKLqKgoJn3//v1XrlwZN27c9OnT8QpGCKH/pvf8/hYPD4+CggIAsLW1XbduHbz1/HN5eXlVVdU3rzZ06FCpXE2fPj0iIuKfH+2QIUMAoKSkBABG ong or a short position in a call or put option", "qhtml": null}, {"n": 58, "q": "The acquisition of a public company with the intent to\ntake it private using debt financing best describes:", "opts": ["angel investing.", "venture capital investing.", "leveraged buyout investing."], "ans": "C", "expl": "develop a business plan and to assess market potential. The amount of financing here is typically small and\npotential. Typically, these are start-ups or young companies, but venture capital can be injected at various stages,\nits acquisition.\nC. Correct because leveraged buyouts, or highly leveraged transactions, arise when private equity firms establish\nbuyout funds (or LBO funds) to acquire public companies or established private companies, with a significant\npercentage of the purchase price financed through debt. The target company's assets typically serve as collateral\nfor the debt, and the target company's cash flows are expected to be sufficient to service the debt. The debt\ncompany becomes or remains a privately owned company.\nInvestments in Private Capital: Equity and Debt\nI explain features of private equity and its investment characteristics", "qhtml": null}, {"n": 59, "q": "An advantage of using price multiples in valuation is\nmost likely that multiples:", "opts": ["allow easy cross-sectional comparisons.", "are not affected by differences in accounting rules.", "for cyclical companies are relatively stable over the economic cycle."], "ans": "A", "expl": "beneficial for analysts who are assigned to a particular industry or sector and need to identify the expected best\nperforming stocks within that sector. Price multiples are popular with investors because the multiples can be\ncalculated easily and many multiples are readily available from financial websites and newspapers.\nB. Incorrect because differences in reporting rules among different markets and in chosen accounting methods can\nresult in revenues, earnings, book values, and cash flows that are not easily comparable. These differences can, in\nturn, result in multiples that are not easily comparable.\nEquity Valuation: Concepts and Basic Tools\n·explain advantages and disadvantages of each category of valuation model\nDiscuss θ\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 60, "q": "Using these ratios, credit quality is strongest for:", "opts": ["Company 1.", "Company 2.", "the industry."], "ans": "A", "expl": "(lowest). Therefore, Company 1 has the strongest credit quality overall\nEBITDA/lnterest expense: This ratio measures the degree to which operating profit covers periodic interest\ninclude depreciation and amortization (EBITDA) as well as rental expense (EBITDAR), while the denominator my\ndebt-to-EBlTDA ratio represents higher leverage, and debt may be adjusted to reflect operating leases or off-\nbalance-sheet commitments. Rating agencies often use it as a trigger for rating actions, and banks reference it in\nloancoy\nQuestion 60 of 90\nEBlTDA/lnterest expense: This ratio measures the degree to which operating profit covers periodic interest\ninclude depreciation and amortization (EBITDA) as well as rental expense (EBiTDAR), while the denominator my\ndebt-to-EBlTDA ratio represents higher leverage, and debt may be adjusted to reflect operating leases or off-\nbalance-sheet commitments. Rating agencies often use it as a trigger for rating actions, and banks reference it in\nleverage (fixed costs).\nCompany 1 has the best ratios for both EBITDA/interest expense (highest) and for Debt/EBITDA (lowest).\nTherefore, Company 1 has the strongest credit quality overall.\nB. Incorrect because, compared to Company 1, Company 2 has worse ratios for EBITDA/interest expense and for\nDebt/EBITDA.\nC. Incorrect because, compared to Company 1, the industry has worse ratios for EBITDA/interest expense and for\nDebt/EBITDA.\nCreditAnalysisfor CorporateIssuers\n· calculate and interpret financial ratios used in credit action costs", "Inaccurate forecasts", "Differences in risk aversion"], "ans": "A", "expl": "A. Correct. Transaction costs may render an arbitrage strategy unprofitable and can therefore prevent precise\nconvergenceofprices.\nB. Incorrect. No forecasts are needed in implementing an arbitrage position.\nC. Incorrect. Differences in risk aversion are irrelevant for arbitrage because arbitrage transactions are riskless.\nArbitrage, Replication, and the Cost of Carry in Pricing Derivatives\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 64, "q": "Which form of market efficiency is most likely tested using technical analysis?", "opts": ["Weak form", "Semi-strong form", "Strong form"], "ans": "A", "expl": "attempt to exploit historical trading data. If any such trading rule consistently generates abnormal risk-adjusted\nreturns after trading costs, this evidence will contradict weak-form efficiency. This approach is commonly\nassociated with technical analysis, which involves the analysis of historical trading information (primarily pricing\ninvestmentdecisions.\nB. Incorrect because semi-strong-form efficiency focuses on public information rather than historic trading data. In a\nsemi-strong-form efficient market, prices reflect all publicly known and available information. Publicly available\ninformation includes financial statement data (such as earnings, dividends, corporate investments, changes in\nmanagement, etc.) and financial market data (such as closing prices, shares traded, etc.). Therefore, the semi-\nstrong form of market efficiency encompasses the weak form. Since technical analysis uses historical information\nnot public (private) information, it cannot be used to test semi-strong-form market efficiency.\nC. Incorrect because strong-form efficiency looks primarily at private information effects rather than historic trading\na strong-form efficient market, insiders would not be able to earn abnormal returns from trading on the basis of\nprivate information. Since technical analysis uses historical information not public (private) information, it cannot be\nused to test semi-strong-form market efficiency.\nMarket Efficiency\n· contrast weak-form, semi-strong-form, and strong-form market efficiency", "qhtml": null}, {"n": 65, "q": "A factor that most likely measures a client's ability to bear risk is his or her:", "opts": ["time horizon.", "personality type.", "inclination to independent thinking."], "ans": "A", "expl": "A. Correct. A longer time horizon tends to imply greater ability to bear risk.\nB. Incorrect. Personality type gives an indication about the willingness (not ability) of a client to bear risk.\nC. Incorrect. Inclination to independent thinking gives an indication about the willingness (not ability) of a client to bear\nrisk.\nBasics of Portfolio Planning and Construction\nexplain the difference between the willingness and the ability (capacity) to take risk in analyzing an investor's\nfinancial risk tolerance\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 66, "q": "A callable bond most likely experiences negative convexity when the bond's\nyield to maturity is:", "opts": ["less than the bond's coupon rate.", "equal to the bond's coupon rate.", "greater than the bond's coupon rate."], "ans": "A", "expl": "A. Correct. A callable bond is most likely to experience negative convexity when the bond's yield to maturity is less\nthan the bond's coupon rate. When calculating the “convexity effect\" for the relationship between bond prices and\nsmaller than the decrease in price when the benchmark yield curve is raised (in absolute terms). This situation\ncreates negative convexity. When a callable bond moves into the range of negative convexity, it indicates that the\ncall option has more value to the issuer and is more likely to be exercised. When interest rates are low, the value of\nthe call option is much greater because the issuer is more likely to exercise the option to refinance the debt at a\nlower cost of funds.\nB. Incorrect because a callable bond is most likely to experience negative convexity when the yield to maturity is less\noption is low, callable and non-callable bonds experience very similar effects from interest rate changes and both\nhave positive convexity.\nthan the bond's coupon rate (not when it is greater than the bond's coupon rate). When interest rates are high, the\nF s odo    fo   e  s i a  m so s oo   fo\ncallable and non-callable bonds experience very similar effects from interest rate changes and both have positive\nconvexity.\nCurve-Based and Empirical Fixed-lncome Risk Measures", "qhtml": null}, {"n": 67, "q": "The sum of the coupon payments over a year divided by the flat price of a bond\nis best defined as:", "opts": ["true yield.", "simple yield.", "current yield."], "ans": "C", "expl": "A. Incorrect because the true yield-to-maturity is the internal rate of return on the cash flows using the actual calendar\nyield.\nB. Incorrect because the simple yield on a bond is the sum of the coupon payments plus the straight-line amortized\nmaturity unlike current yield.\nC. Correct because the current yield (also called the income or running yield) is the sum of the coupon payments\nreceived over the year divided by the flat price.\nYield and Yield Spread Measures for Fixed-Rate Bonds\ncompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 68, "q": "In a rising interest rate environment, the effective duration of a putable bond\nrelative to an otherwise identical non-putable bond, will most likely be:", "opts": ["lower.", "the same.", "higher."], "ans": "A", "expl": "A. Correct because when interest rates are rising, the put option becomes more valuable to the investor. The ability\nto sell the bond at par value limits th lder of the physical commodity should expect to be compensated\nvia a higher forward price, F。*(T), than the prevailing cash price.\nC. Correct because since convenience yield is a benefit and accrues to the owner, it reduces the forward price. Thus,\na decrease in convenienceyieldwill increase theforwardprice.\nNaturalResources\n· describe features of commodities and their investment characteristics\nDiscuss\nFilter", "qhtml": null}, {"n": 74, "q": "As an investor assumes additional risk along the Markowitz efficient frontier, the\nrate at which expected return increases will most likely:", "opts": ["decrease.", "remain constant.", "increase."], "ans": "A", "expl": "A. Correct because the increase in return with every unit increase in risk, however, keeps decreasing as we move\nfrom left to the right, on the efficient frontier, because the slope continues to decrease.\nB. Incorrect because it describes the capital market line (CML), which has a constant slope and a constant rate at\nwhich expected return increases.\nyou move up along the efficient frontier.\nPortfolio Risk and Return: Part I\ndescribe and interpret the minimum-variance and efficient frontiers of risky assets and the global minimum-variance\nportfolio\nQuestion 74 of 90 @\nFilter\nDiscussion\nWhat doyou want todiscuss...(required)", "qhtml": null}, {"n": 75, "q": "Which of the following sections of an IPS most likely provides information\nabout specific types of assets to be excluded from a portfolio?", "opts": ["Procedures", "Investment Guidelines", "Statement of Duties and Responsibilities"], "ans": "B", "expl": "A. Incorrect because the Procedures section explains the steps to take to keep the IPS current and the procedures to\nfollow to respond to various contingencies.\nB. Correct because the Investment Guidelines section provides information about how policy should be executed\n(e.g., on the permissible use of leverage and derivatives) and on specific types of assets excluded from\ninvestment, ical factors contributing to the degree of efficiency in a market is the number\nof market participants. Any rule that reduces the number of market participants, restricts the potential for trading\nactivity, and hence reduces market efficiency.\nC. Incorrect because the reduction of the number of market participants reduces, not facilitates, market efficiency.\nMarket Efficiency\nI explain factors that affect a market's efficiency\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 78, "q": "The correlation of cryptocurrencies with traditional assets has been:", "opts": ["decreasing.", "steady.", "increasing."], "ans": "C", "expl": "A. Incorrect because the correlation of cryptocurrencies with traditional assets is on the rise.\nB. Incorrect because the correlation of cryptocurrencies with traditional assets is on the rise.\nC. Correct because the correlation of cryptocurrencies with traditional assets is on the rise.\nIntroduction to Digital Assets\nanalyze sources of risk, return, and diversification among digital asset investments\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss...(required)", "qhtml": null}, {"n": 79, "q": "The weighted average of the time to receipt of a bond's promised future\npayments is best measured by:", "opts": ["effective duration.", "modified duration.", "Macaulay duration."], "ans": "C", "expl": "A. Incorrect because the effective duration of a bond is the sensitivity of the bond's price to a change in a benchmark\nyield curve, not to the change in the bond's own yield-to-maturity. Effective duration is a curve duration statistic in\nthat it measures interest rate risk in terms of a change in the benchmark yield curve (△Curve).\nchange in its yield-to-maturity; it provides a linear estimate of the percentage price change.\nC. Correct because Macaulay duration is a weighted average of the time to receipt of the bond's promised payments,\nMacaulay duration is measured in terms of
