\nof their value.\nThings to remember:\nThe value of digital assets is primarily determined by their potential for price appreciation and future realized gains. They have no fundamental\nvalue since they do not generate expected cash flows. Given their limited acceptance in traditional financial markets, they are relatively illiquid, so\nliquidity is not a source of their value.\nAnalyze sources of risk, return, and diversification among digital asset investments", "qhtml": null}, {"n": 99, "q": "Which one of the following factors is least likely to influence the prices or returns of most cryptocurrencies?", "opts": ["Limited supply", "Underlying cash flows", "Potential to transfer value in the future"], "ans": "B", "expl": "Most cryptocurrencies derive their values primarily from the price appreciation of the assets themselves, without any underlying cash flows.\nUnlike traditional financial assets, they do not possess inherent value tied to underlying assets or the potential for generating cash flows through\ninterest and dividends (ie, they lack a fundamental value).\nInstead, their prices or returns are primarily determined by the expectation of asset appreciation due to perceived scarcity resulting from limitations\non the total currency supply (Choice A). In addition, their prices or returns are influenced by the potential to transfer value in the future, facilitated\nby unique features in the underlying algorithms that enable specific types of financial transactions (Choice C). Other factors influencing the prices\nor returns of cryptocurrencies are market adoption, network effects, technological advancements, regulatory developments, speculation, and the\noverall appetite for market risk.\nThings to remember:\nThe value of most cryptocurrencies comes mainly from asset price appreciation, without any underlying cash flows. Factors such as scarcity,\npotential for future value transfer, market adoption, network effects, technology advancements, regulations, speculation, and overall market risk\nappetite influence cryptocurrency prices and returns.\nAnalyze sources of risk, return, and diversification among digital asset investments", "qhtml": null}, {"n": 100, "q": "Which of the following statements regarding the regulation of digital assets is correct?", "opts": ["Use of digital assets is legal in every country.", "Price manipulation and fraud may be unregulated on digital exchanges.", "Digital assets are globally considered commodities for regulatory purposes."], "ans": "B", "expl": "Regulation of digital assets compared with traditional financial assets\nDigital assets Traditional financial assets\nClarity Ambiguous and still being developed Clear and well-defined rules\nInconsistent across regulatory bodies:\nAsset class categorization US classifies as commodities Consistent asset classification\nOthers classify as nonfinancial assets\nLegality of market behaviors Legality may vary across accepted guidelines Legality standardized across jurisdictions\nTraditional financial assets, such as stocks and bonds, are clearly defined and regulated under well-established legal frameworks across\njurisdictions. A robust regulatory framework protects capital market integrity and safeguards investors from illegal activities such as price\nmanipulation and fraud.\nIn contrast, the regulatory framework for digital assets poses significant challenges for investors. As digital assets are a relatively new asset\nclass, regulation is still underdeveloped and inconsistent across regulatory bodies. This lack of an established framework leads to poor legal\nguidelines. Thus, certain activities that are illegal on traditional asset exchanges, such as price manipulation and fraud, may be legal on digital\nexchanges.\n(Choice A) The use of digital assets is illegal in some countries, where legal and regulatory standards vary widely.\n(Choice C) US regulatory bodies treat cryptocurrencies as commodities, whereas some other regulatory bodies treat cryptocurrencies as\nnonfinancial assets.\nThings to remember:\nA robust legal and regulatory framework exists around traditional financial assets to protect investors from illegal activities such as price\nmanipulation and fraud. In contrast, a weak regulatory framework exists around digital assets; fraud and price manipulation may be unregulated\non digital exchanges.\nExplain investment features of digital assets and contrast them with other asset classes", "qhtml": null}, {"n": 101, "q": "Which of the following is least likely to be a difference between digital assets and traditional financial assets? Digital assets:", "opts": ["are recorded on a decentralized digital ledger.", "do not have an intrinsic value based on expected cash flows.", "trade under widely accepted and well-known rules and regulations."], "ans": "C", "expl": "Digital assets vs. traditional financial assets\nDigital Traditional\nIntrinsic value None Based on future cash flows\nDecentralized Private ledgers\nValidation of transactions\nRecorded on distributed ledgers Recorded by intermediaries\nLimited for direct exchanges Indirect medium of exchange\nMediums of exchange\nFocus is commercial viability Easily convertible to fiat currencies\nUnregulated\nEstablished and proven standards\nLegal and regulatory Limited legal protection\nWell-defined globally\nIllegal in some countries\nDigital assets differ from traditional financial assets in several important ways. One difference is that regulations for digital assets are not well-\nestablished, resulting in unclear and conflicting guidelines. Digital exchanges often operate without sufficient supervision or legal protections,\nexposing individuals to potential price manipulation and fraudulent activities.\nAlso, the ownership and exchange of digital assets are typically recorded in a decentralized digital ledger, such as a blockchain, using\ncryptography and advanced algorithms (Choice A). In contrast, traditional financial assets are documented in private ledgers controlled and\nprotected by a central intermediary. In the United States, for example, equity shares are registered with the Securities and Exchange Commission.\nUnlike traditional financial assets, the majority of digital assets lack intrinsic value as they have no expected cash flows or underlying asset value.\nInstead, their pricing is mainly driven by expected asset appreciation, which in turn is driven by perceived scarcity and the continued ability to\ntransfer value (Choice B).\nThings to remember:\nRegulations for digital assets are less established compared with traditional financial assets, leading to unclear and conflicting guidelines. Digital\nassets also differ from traditional financial assets as they are recorded on a decentralized digital ledger, and these assets lack intrinsic value since\nthey do not generate expected cash flows.\nExplain investment features of digital assets and contrast them with other asset classes", "qhtml": null}, {"n": 102, "q": "The advantage of a company raising funds through an initial coin offering (ICO) instead of an initial public offering (IPO) is most likely that an ICO:", "opts": ["follows a regulated process.", "requires lower issuance costs.", "provides voting rights to investors."], "ans": "B", "expl": "Differences between initial public offering (IPO) and initial coin offering (ICO)\nIPO ICO\nOffering process Regulated Unregulated\nIssuance costs Higher Lower\nPreparation time frame Longer Shorter\nShareholder voting rights Available Not available\nAn initial coin offering (ICO) is a process through which a company sells a new cryptocurrency to raise funds, with investors receiving\ncryptocurrency in exchange for their investment. On the other hand, an initial public offering (IPO) refers to the process of offering shares of a\nprivate corporation to the public through a new stock issuance.\nAn ICO involves lower issuance expenses compared with an IPO. Since an ICO involves the sale of a cryptocurrency, not a security, it is not\nsubject to the formal registration requirements of an IPO. Therefore, the ICO does not require the legal, accounting, marketing, and underwriting\nfees that IPOs require.\n(Choice A) ICOs are largely unregulated, with no specific regulations and requirements in place. In contrast, the IPO process involves the\npreparation and filing of various documents, such as underwriting agreements, legal and financial disclosures, and corporate governance\ndocuments.\n(Choice C) A company that raises funds through an ICO typically does not provide voting rights to investors since an ICO is the sale of a\ncryptocurrency rather than a security. Investors receive new cryptocurrency tokens that may be used for the issuing company's product or service.\nThings to remember:\nAn initial coin offering (ICO) is the cryptocurrency version of an initial public offering (IPO). Compared with the IPO process, however, ICOs\ngenerally involve lower issuance expenses when raising funds. ICOs are largely unregulated, with no specific regulations in place. Typically, ICOs\ndo not provide voting rights as they entail the sale of a cryptocurrency rather than a security.\nDescribe financial applications of distributed ledger technology", "qhtml": null}, {"n": 103, "q": "Of the following, the most likely benefit of using distributed ledger technology (DLT) to record financial transactions is that DLT:", "opts": ["is operationally secure.", "provides greater transparency.", "requires only small amounts of energy to verify transaction activity."], "ans": "B", "expl": "Advantages and disadvantages of distributed ledger technology\nAdvantages Disadvantages\nEnhanced precision and security in record keeping Technology not fully secured\nGreater transparency in record keeping Greater likelihood of security\nFaster exchange of ownership breaches\nFacilitates peer-to-peer interaction Massive energy consumption\nDistributed ledger technology (DLT) creates a shared electronic database where transactions are recorded, tracked, and shared in a\ndistributed ledger (D5898). These transactions can involve the creation, transfer, or recording of digital asset ownership.\nDLT offers the advantage of greater transparency in record keeping since all participants have access to the entire digital record. Even user\nnodes that are not part of the consensus protocols, and thus cannot validate or accept transactions, can access the ledger containing all records.\nHowever, DLT also has disadvantages. For instance, the technology is not fully secured, so there is an increased likelihood of privacy and data\nprotection breaches (Choice A). Moreover, the computational processes involved in DLT often demand substantial energy consumption to\nvalidate transaction activity (Choice C).\nThings to remember:\nDistributed ledger technology (DLT) provides the benefit of enhanced transparency in record keeping since even users who cannot validate and\naccept transactions have access to the complete database. However, DLT is not completely secure. Disadvantages include the increased\nlikelihood of security breaches and the substantial amount of computational energy required.\nDescribe financial applications of distributed ledger technology", "qhtml": null}, {"n": 104, "q": "Cryptocurrencies most likely:", "opts": ["are easily converted into fiat currencies.", "do not have a fundamental inherent value.", "are regularly used as a direct medium of exchange."], "ans": "B", "expl": "Uses as a medium of exchange\nCryptocurrencies Traditional financial assets (eg, stocks, bonds)\nGenerally not accepted as legal tender; stiff restrictions Generally not used as direct medium of exchange, but easily\nor outright ban in some countries exchanged into fiat currencies\nCryptocurrencies do not have a fundamental value. Their price results primarily from expected price appreciation due to perceived scarcity and\nthe potential to transfer value in the future.\nThere is limited acceptance of cryptocurrency as a traditional medium of exchange in the mainstream financial system. Although\ncryptocurrencies are used to pay for certain goods and services and as investments, they are not legal tender in most jurisdictions. The use of\ncryptocurrency for payment and investment purposes is restricted in multiple countries; other countries have banned it outright.\n(Choice A) Cryptocurrencies can be converted into fiat currency; however, this typically necessitates the use of a third-party platform (eg, an app\nthat creates a secure \"wallet\") linked directly to an individual's bank account. These platforms usually charge fees, have withdrawal limits, and\nimpose a delay in releasing cash, so the conversion is not an easy process.\n(Choice C) Cryptocurrencies are not regularly used as a medium of exchange. It is possible with Bitcoin, but only in certain circumstances such\nas online transactions in which counterparties use the Web3 ecosystem.\nThings to remember:\nCryptocurrencies do not have a fundamental value. Their price results primarily from expected price appreciation due to perceived scarcity and\nthe potential to transfer value in the future. Cryptocurrency is typically not useful as a medium of exchange since it requires a specialized trading\nplatform with associated fees and restrictions. In addition, some countries have outright bans on the use of cryptocurrencies.\nExplain investment features of digital assets and contrast them with other asset classes", "qhtml": null}, {"n": 105, "q": "Stablecoins least likely:", "opts": ["are collateralized by a basket of assets.", "are launched for entertainment purposes.", "maintain their value through algorithmic formulas."], "ans": "B", "expl": "Main features of stablecoins\nStable value through asset reserves or algorithmic formulas\nFewer issues with cryptocurrency transactions\nFacilitation of settlement\nSimplification of cross-border trading, investing, and payments\nMeme coins are cryptocurrencies that often stem from humorous ideas and are typically introduced for entertainment purposes. In contrast,\nstablecoins are cryptocurrencies created to keep a steady value by pegging their worth to another asset.\nStablecoins are collateralized by a reserve of another asset, such as a currency, commodity, or financial instrument (Choice A). The reserve\nprotects investors from price volatility often observed in other cryptocurrencies like Bitcoin, as well as potential issues with cryptocurrency\ntransactions, such as network congestion and insufficient fees.\nSome stablecoins, known as \"smart stablecoins\" or \"algorithmic stablecoins,\" aim to achieve price stability through algorithmic formulas that\ncontrol their supply relative to another asset, instead of depending on physical reserves of that asset (Choice C).\nThings to remember:\nStablecoins are cryptocurrencies pegged to the value of another asset and collateralized by a reserve of this asset, such as a currency,\ncommodity, or financial instrument. Some stablecoins aim to achieve price stability through algorithmic formulas that control their supply. In\ncontrast, meme coins are cryptocurrencies that often stem from humorous ideas and are typically introduced for entertainment purposes.\nExplain investment features of digital assets and contrast them with other asset classes", "qhtml": null}, {"n": 106, "q": "Which of the following is least likely to be a source of risk for a cryptocurrency? The cryptocurrency is:", "opts": ["created on a permissionless network.", "recorded in a decentralized distributed ledger.", "valued based on expected future earnings and/or cash flows."], "ans": "C", "expl": "Sources of risk and return for cryptocurrencies\nSources of risk Sources of return\nNo fundamental value Market adoption\nDecentralized digital ledger Network effects\nPermissionless networks Technological advancement\nLess usage as direct medium of exchange Regulatory development\nAmbiguous, evolving framework Speculation\nUnregulated with minimum legal protections General market risk appetite\nCryptocurrency lacks fundamental value, having no expected future earnings and/or cash flows. Therefore, cryptocurrencies' value is based\non asset appreciation and the ability to transfer value in the future. This has led to volatile price fluctuations and uncertainties in their markets.\nOther sources of risk for cryptocurrencies include the use of distributed ledger technology (DLT). Cryptocurrency is logged in a decentralized\ndistributed ledger, which does not provide complete security, leaving room for potential privacy breaches and data protection concerns (Choice\nB). DLT offers several advantages, such as improved precision, transparency, and security in maintaining records, as well as faster ownership\ntransfers and peer-to-peer interactions.\nDLT can be a permissionless or permissioned network. Permissionless networks are open to all users for transactions and lack centralized\nauthority for transaction validation. Decentralized exchanges are hard to regulate, enabling potential illegal activity, which is another source of risk\nfor cryptocurrencies (Choice A).\nThings to remember:\nOne source of risk for cryptocurrencies is that they have no intrinsic value as they lack anticipated future earnings and cash flows; their value\ndepends on asset appreciation and the capacity to transfer value in the future. Also, they depend on distributed ledger technology, which is open\nto security breaches and illegal activity.\nDescribe investment forms and vehicles used in digital asset investments", "qhtml": null}, {"n": 107, "q": "Permissionless networks most likely support cryptocurrency investors by creating:", "opts": ["decentralization.", "faster speed of transaction validation.", "cost-effectiveness of transaction validation."], "ans": "A", "expl": "Differences between permissioned and permissionless networks\nPermissioned Permissionless\nSpeed of transaction validation Faster Slower\nCost-effectiveness of transaction validation More Less\nGovernance Centralized Decentralized\nDegree of decentralization Partial Total\nAccess Limited membership Unlimited membership\nDigital ledger technology, which employs cryptography and algorithms, can be maintained on a permissioned or permissionless network. A\npermissionless network is open to any user to engage in transactions and to maintain the network. With many participants storing a copy of\nthe same single distributed ledger, the network is decentralized, so no one user can cause the network to fail. Bitcoin creation is a well-known\nexample of a permissionless network.\nIn contrast, a permissioned network requires approval to join and to participate in various activities and thus is typically accessed by a limited\nnumber of authorized individuals. Such networks are generally used for enterprise purposes, enabling private entities to manage their data and\noperations.\n(Choice B) A permissionless network operates without any centralized authority for transaction validation and thus requires a larger number of\nmembers to reach consensus to validate transactions. As a result, processing speed is slower, which decreases network speed and scalability.\n(Choice C) Validating transactions on a permissionless network requires the work of many members, which consumes large amounts of\nprocessing power, making this type of network less cost-effective than permissioned blockchains.\nThings to remember:\nA permissionless network is completely decentralized and thus does not require a central intermediary for transaction validation. It requires a\nlarge number of members to reach consensus on validating transactions, which slows processing speed, and it consumes more computer\nprocessing power, which decreases cost-effectiveness.\nDescribe financial applications of distributed ledger technology", "qhtml": null}, {"n": 108, "q": "Digital assets most likely derive value from which of the following?", "opts": ["Liquidity", "Asset appreciation", "Expected cash flows"], "ans": "B", "expl": "Digital vs. traditional assets\nDigital assets Traditional financial assets\nSupply and demand\nSupply and demand\nBasis for inherent Potential to transfer value in future; asset\nPotential to transfer value in future;\nvalue appreciation\nasset appreciation\nExpected future cash flows\nRecords kept in decentralized digital\nledgers enabled by cryptography and Records kept in private ledgers maintained\nValidating transactions\nenhanced algorithms in permissioned by central intermediaries\nor permissionless networks\nMedium of exchange Cryptocurrencies Fiat currency\nLegal and regulatory Ambiguous and evolving regulatory framework with\nWell-defined regulation across jurisdictions\nprotection inconsistencies across jurisdictions\nTraditional financial assets (eg, stocks, bonds) have fundamental values that are primarily determined by expected future cash flows. This\nfundamental value theoretically serves as a basis for an asset's price.\nUnlike traditional investments, digital assets (eg, cryptocurrencies, tokens) have no fundamental values since they are not expected to generate\nfuture cash flows (Choice C). Instead, digital assets derive their values purely from the market's expectations of future price appreciation\nand the potential to realize gains in the future.\n(Choice A) Given their very limited acceptance in conventional financial markets, digital assets are relatively illiquid; thus, liquidity is not a source\nof their value.\nThings to remember:\nThe value of digital assets is primarily determined by their potential for price appreciation and future realized gains. They have no fundamental\nvalue since they do not generate expected cash flows. Given their limited acceptance in traditional financial markets, they are relatively illiquid, so\nliquidity is not a source of their value.\nExplain investment features of digital assets and contrast them with other asset classes", "qhtml": null}, {"n": 109, "q": "An investment in Bitcoin futures would most appropriately be characterized as a(n):", "opts": ["direct digital investment.", "indirect digital investment.", "digital form of investment for nondigital assets."], "ans": "B", "expl": "Direct vs. indirect digital investments\nDigital forms of investments\nDirect Indirect\nfor nondigital assets\nCoins ✓\nFutures ✓\nETFs ✓\nHedge funds ✓\nEquities ✓\nAsset-backed tokens ✓\nInvestments in cryptocurrencies can be direct or indirect. Direct investments are made on digital exchanges and recorded directly in the\nblockchain (Choice A).\nIndirect digital investments are made through conventional securities (eg, equities, ETFs, hedge funds) invested in digital exchanges or\nblockchain-related assets, or they can be derivatives (eg, futures contracts) with cryptocurrencies as the underlying reference asset. Therefore,\nbuying Bitcoin futures rather than the cryptocurrency itself is an indirect digital investment.\nIn the US, Bitcoin futures trade through the Chicago Mercantile Exchange (CME), which tracks the spot price of Bitcoin via an internal reference\nrate. Bitcoin futures are typically cash settled, and no Bitcoin changes hands.\n(Choice C) When a digital security's value is derived from a nondigital asset (eg, a traditional financial asset), it is considered direct ownership of\nthe nondigital asset. For example, asset-backed tokens represent digital claims on physical or financial assets collateralized by the underlying\nasset.\nThings to remember:\nIndirect digital investments are made through conventional securities invested in digital exchanges or blockchain-related assets, or they can be\nderivatives with blockchain-related assets as the underlying. Direct digital investments involve purchasing cryptocurrency on a digital exchange\nand are recorded in the blockchain.\nDescribe investment forms and vehicles used in digital asset investments", "qhtml": null}];
const CFG = {"title": "Alternative Investments — Wiley/UWorld Q-bank", "subtitle": "CFA Level I · Wiley 2024 · 109 câu · không giới hạn giờ", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
