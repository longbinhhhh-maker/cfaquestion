<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "When co-investing, investors most likely:", "opts": ["rely heavily on the fund manager's due diligence.", "source the investment idea and have others invest alongside.", "raise additional capital to fund the investment once the investing decision has been made."], "ans": "A", "expl": "Co-investing in alternative investments\nAdvantages Disadvantages\nOffers direct investing experience Requires more resources and expertise\nLeverages the investment firm's process than fund investing\nand expertise Direct investing opportunities are\nReduced management fees dependent on the investment firm\nMore active approach Potential adverse selection bias\nCoinvesting occurs when an investor in an alternative fund (eg, hedge fund, venture capital) accepts the opportunity to invest directly (ie, direct\nprivate investment outside the fund structure) by committing additional capital in specific investments alongside the fund manager who\nintroduced the idea (ie, acted as an intermediary).\nCoinvesting requires two processes that demand more resources and expertise from the investor: fund-specific due diligence and asset-specific\ndue diligence. Considerable asset-specific due diligence is performed by the investment firm (ie, general partner and fund manager) when it\nacts as an intermediary and presents the opportunity to the investor.\nCoinvesting is often a transitional step for investors to learn the details and fine points of direct investing. In addition, decisions to coinvest are\noften made under tight deadlines, putting considerable pressure on the investor to thoroughly complete the required level of due diligence. For\nthese reasons, many investors rely heavily on the fund manager's due diligence expertise when evaluating a coinvestment opportunity.\n(Choice B) The investment firm, not the investor, sources the investment idea and has others invest alongside.\n(Choice C) Since the deadlines for decision-making and funding are usually tight, raising additional funding capital is not normally an option once\nthe decision to coinvest has been made.\nThings to remember:\nCoinvesting is often a transitional step for investors to learn the details and fine points of direct investing. In addition, decisions to coinvest are\noften made under tight deadlines, putting considerable pressure on the investor to thoroughly complete the required level of due diligence. For\nthese reasons, investors often rely heavily on the fund manager's due diligence expertise when evaluating a coinvestment opportunity.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null}, {"n": 2, "q": "Compared with traditional investments, alternative investments are least likely to have:", "opts": ["large short positions.", "detailed public reporting.", "active asset management."], "ans": "B", "expl": "Common characteristics of alternative\ninvestments compared with traditional\ninvestments\nLess liquid\nLess regulation\nLess transparency\nMore active management\nHigher fee structure\nHigher minimum investments\nLess flexibility\nAlternative investments refer to vehicles established to invest both in traditional asset classes such as stocks and bonds as well as in\nnontraditional asset classes such as commodities and real estate. The term also refers to nontraditional investments, such as private equity\nfunds and hedge funds.\nAlternative investments generally cater to institutions and wealthy individuals. In theory, these are sophisticated investors who can perform their\nown due diligence and oversight, which minimizes their need for regulatory protection. As a result, alternative investments are subject to fewer\nreporting requirements than are traditional investments. The level of reporting in alternative investments is far more likely to be cursory than\ndetailed.\n(Choice A) Many alternative investment strategies employ large amounts of leverage (ie, borrowing) to enhance investment returns. Shorting a\nsecurity is a form of leverage. Entering a short position means that the fund borrows an underlying security and sells it in anticipation that its price\nwill fall and the company can buy the security back at a lower price in the future.\n(Choice C) Most types of alternative investments are characterized by active management. While traditional investments can also be actively\nmanaged, they typically use passive management more than alternative investments do.\nThings to remember:\nMost alternative investments are actively managed. They are subject to less regulation than traditional investments, so they typically have fewer\nreporting requirements. Alternative investment managers often employ strategies that include substantial amounts of leverage.\nDescribe features and categories of alternative investments", "qhtml": null}, {"n": 3, "q": "Which of the following choices most likely describes a benefit of adding alternative investments to a portfolio of traditional investments?", "opts": ["Increased liquidity", "More transparency", "Lower correlations with other assets"], "ans": "C", "expl": "Alternative investments refer to investments in nontraditional assets such as commodities, real estate, private equity, and hedge funds. The\nterm also refers to vehicles, such as limited partnerships, created to invest in traditional asset classes (eg, stocks, bonds).\nAlternative investments are attractive since they give investors access to a broader range of assets classes and have the potential to provide\ndiversification benefits when added to a traditional asset portfolio. Typically, alternative assets have lower correlations with traditional assets.\n(Choice A) The markets for these assets are typically less liquid (ie, assets cannot be sold as quickly for cash) than markets for traditional\nassets. As a result, adding alternative assets to a traditional asset portfolio most likely decreases the portfolio's liquidity.\n(Choice B) Alternative investments are subject to less regulation than traditional investments, which results in fewer reporting requirements and\ntherefore less transparency. Alternative investments also have higher fee structures (eg, hedge funds have both management and incentive fees).\nThings to remember:\nPotential benefits of adding alternative investments to a traditional investment portfolio include diversification benefits from typically lower\ncorrelations. Investors should be aware that alternative investments are generally less liquid and transparent and carry higher fees compared to\ntraditional investments.\nDescribe features and categories of alternative investments", "qhtml": null}, {"n": 4, "q": "Compared with traditional investments, alternative investments are less likely to exhibit:", "opts": ["transparency.", "downside risk.", "active management."], "ans": "A", "expl": "Typical characteristics of alternative\ninvestments\nIlliquid\nNarrow manager specialization\nLow correlation with traditional investments\nLack of transparency\nLimited information on historical returns\nSpecial legal and tax considerations\nAlternative investments (eg, hedge funds, private equity) are subject to significantly less regulation than traditional investments such as\nindividual stocks and bonds. One consequence of less regulation is that managers of alternative investments face reduced reporting\nrequirements compared with traditional investments. This means that managers often have no regulatory obligation to disclose strategies,\nunderlying investments, or even prior performance.\n(Choice B) One feature of alternative investments is potentially greater returns. However, risk and return are related concepts, and an investor\ncannot expect higher returns without assuming a higher degree of risk.\n(Choice C) Managers of alternative investments often employ strategies that require much more active management than strategies commonly\nassociated with traditional investments.\nThings to remember:\nAlternative investments offer the potential for greater returns than traditional investments, but the higher returns require investors to assume more\nrisk. Alternative investments are also less regulated than traditional investments, so investors must accept a level of transparency and disclosure\nthat is often significantly less than the requirements for traditional investments.\nDescribe features and categories of alternative investments", "qhtml": null}, {"n": 5, "q": "For a small firm, co-investing in alternative assets is most likely:", "opts": ["attractive as it avoids adverse-selection bias.", "attractive due to the elimination of the intermediary.", "challenging due to the resources and expertise needed."], "ans": "C", "expl": "The three most common methods of investing in alternative investments, ordered by increasing level of involvement or expertise required, are:\nFund investing: The investor invests in a fund (eg, hedge, private equity) that makes all investment decisions. Fund investing is an indirect\nmethod of investing.\nCo-investing: An investor in an alternative fund (eg, venture, private equity) has the opportunity to invest directly (ie, private investment\noutside of the fund structure) by committing additional capital in specific investments along with the fund manager who introduced the idea\n(ie, acts as an intermediary).\nDirect investing: An investor makes a direct investment in an asset (eg, taking a position in a private company directly, without the use of\nan intermediary).\nInvesting in any alternative investment requires due diligence. For a small firm, resources (eg, assets, firm capital) and expertise are most likely\nlimited, which makes fund investing attractive as it requires the lowest level of involvement. Co-investing is challenging for a small firm: it\nrequires two separate due diligence processes (ie, fund and asset-specific processes), demanding more resources and expertise.\n(Choices A and B) Co-investing does not eliminate the intermediary, as it is the fund's investment firm that is presenting the co-investment\nidea/opportunity to the investor. This dynamic introduces adverse-selection bias since the fund firm is incentivized to keep the best deals for\nthemselves.\nThings to remember:\nThere are three common methods of investing in alternative investments: fund investing, co-investing, and direct investing. Fund investing\nrequires the lowest level of investor involvement. Co-investing requires two separate due diligence processes and often challenges a small firm's\nlimited resources and expertise.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null}, {"n": 6, "q": "Which of the following most accurately describes why alternative investments are increasingly used by investors?", "opts": ["Liquidity is no longer a constraint for these strategies.", "Investors are drawn to potentially less efficient markets.", "The use of leverage by these investments ensures greater returns."], "ans": "B", "expl": "Alternative investments are investments in nontraditional assets, such as hedge funds, private equity, infrastructure, and commodities.\nAlternative investment managers focus largely on less efficient markets that provide a greater potential to exploit mispricing through active\ninvestment strategies. These strategies are attractive to investors since they generate superior risk-adjusted returns after fees.\n(Choice A) Lack of liquidity due to lockups, redemption restrictions, and underlying illiquid assets (eg, real estate, private equity) remains a key\nconstraint for many alternative investment strategies.\n(Choice C) Alternative investments are more likely to utilize leverage, but leverage does not ensure greater returns. Leverage is a double-edged\nsword; it can multiply both gains and losses.\nThings to remember:\nAlternative investment managers focus largely on less efficient markets that provide a greater potential to exploit mispricing through active\ninvestment strategies.\nDescribe features and categories of alternative investments", "qhtml": null}, {"n": 7, "q": "Regarding alternative investments, which of the following is most likely characteristic of co-investing? Alternative investment managers:", "opts": ["are offered private deals from their fund investors.", "have better access to private deals than direct investors.", "bring in other investors on the most attractive private deals."], "ans": "B", "expl": "Co-investing in alternative investments\nAdvantages Disadvantages\nOffers direct investing experience Requires more resources and expertise\nLeverages the investment firm's process than fund investing\nand expertise Direct investing opportunities are\nReduced management fees dependent on the investment firm\nMore active approach Potential adverse selection bias\nThe three most common methods of engaging in alternative investments, ordered by the increasing level of involvement or expertise required, are:\nFund investing: The fund (eg, hedge fund) makes all the investment decisions. Fund investing is an indirect method of investing.\nCo-investing: An investor in an alternative fund (eg, private equity fund) can invest directly (ie, privately and outside the fund structure) by\ncommitting additional capital to specific investments along with the fund manager who introduced the idea (ie, as an intermediary).\nDirect investing: An investor makes a direct investment in an asset (eg, takes a position in a private company directly, without using an\nintermediary).\nCertain fund managers enjoy reputational benefits that make them desirable partners in private deals. The involvement of such managers,\nlike well-known hedge funds, creates an aura of legitimacy that boosts the chances of a successful offering for the issuer. Therefore, issuers seek\nout these managers, giving them better access to the best deals than other direct investors. Adverse selection bias is possible, however, since\nthe managers may choose to keep those deals for themselves (Choice C).\n(Choice A) Alternative investment managers offer private deals to their fund investors, not the other way around.\nThings to remember:\nCertain fund managers enjoy reputational benefits that make them desirable partners in private deals. The involvement of such managers creates\nan aura of legitimacy, boosting the chances of a successful offering. Therefore, issuers seek out these managers, which gives the managers\nbetter access to the best deals but could lead to adverse selection bias if they choose to keep those deals for themselves.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null}, {"n": 8, "q": "An investor is conducting due diligence on a hedge fund. Which of the following is most likely to be readily available? Information on the fund's:", "opts": ["historical returns.", "largest investments.", "investment process."], "ans": "A", "expl": "Alternative investment due diligence checklist\nTeam experience, key person risk, and reputation\nOrganization Reputation of third-party service providers (eg, auditors,\nprime broker)\nPortfolio Recent and long-term track record\nmanagement Strategy, investment process, and idea generation\nInternal controls, audited financial statements, reporting\nOperations frequency\nValuation methodology and controls\nChief risk officer's independence from portfolio decision-\nRisk policies making\nFund/position limits, leverage, hedging policies\nFund structure and legal registrations\nLegal risks\nExisting or prior litigation against fund or principals\nTerms of Fees, lockouts, redemption notice period\ninvestment Carried interest, distribution policy\nGiven the aggressive and risky strategies of hedge funds, conducting due diligence on them is extremely important. Due diligence should be done\nwith all available information, including analysis of a fund's size, its past performance, and many other factors that could be pertinent to an\ninvestor.\nA fund's track record is commonly used in the due diligence process since it is often made available by the hedge fund or by third parties.\nHistorical returns can be used as an indicator of a fund's future performance and risk tolerance.\nAlthough reasonable steps should be taken to gather all pertinent information, one major limitation to hedge fund due diligence is that fund\nmanagers tend to limit disclosure of certain data. This likely includes the fund's investment strategy, process, and positions since these are\noften proprietary and believed to be competitive advantages (Choices B and C). An investor may only be able to obtain a broad description of\nthe investment strategy (eg, that it is market-neutral).\nThings to remember:\nDue diligence is an important part of investing in hedge funds given their aggressive and risky nature. A fund's track record is a commonly used\nfactor in the due diligence process since it is one of the more readily available pieces of information and can be used as an indicator of a fund's\nfuture performance and risk tolerance.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null}, {"n": 9, "q": "For the general partner in a private equity or venture capital fund, which of the following waterfall distribution methods is most advantageous compared to the others?", "opts": ["Clawback.", "Deal-by-deal.", "Whole-of-fund."], "ans": "B", "expl": "Alternative investments (eg, private equity, venture capital, real estate) often have a waterfall distribution framework for paying out\nreturns/profits. Generally, limited partners (ie, LP investors) receive distributions equal to their initial capital outlay plus profits up to the hurdle\nrate; the general partner (GP) is then paid a performance fee. At this point, unless the limited partnership agreement contains a catch-up clause,\ndistributions and profits are split proportionately between the GP and LPs.\nWaterfall distribution methods are classified as either:\ndeal-by-deal (American style) or\nwhole-of-fund (European style).\nThe timing of performance fee payments makes deal-by-deal waterfalls more advantageous to the GP since each deal is evaluated as each\ninvestment is exited. This allows the GP an opportunity to receive performance fee cash flows earlier (eg, annually) than under the whole-of-fund\nmethod.\n(Choice A) In deal-by-deal waterfalls, a clawback provision would likely be included in the partnership agreement to protect the LPs by restoring\nthe profit split if subsequent investments in the portfolio do not earn performance fees. This provision \"claws back\" the performance fee already\npaid to the GP and is not to the GP's advantage.\n(Choice C) A whole-of-fund waterfall pays the GP based on the performance of the entire fund. This delays payment of performance fees until\nthe end of the fund's life (eg, 7–8 years), which is not to the GP's advantage.\nThings to remember:\nIn alternative investments, deal-by-deal waterfall distributions are more advantageous to the general partner (GP) due to the timing of performance\nfee cash flows. The performance of each deal is evaluated as each investment is exited, potentially earning the GP a performance fee. Under the\nwhole-of-fund method, the GP is paid performance fees only at the end of the fund's life.\nDescribe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null}, {"n": 10, "q": "Compared to traditional investments, alternative investments are most likely to:", "opts": ["have concentrated portfolios.", "be highly regulated due to the risks involved.", "have managers who are investment generalists."], "ans": "A", "expl": "Alternative investments are investments in nontraditional assets, such as hedge funds, private equity, infrastructure, and commodities. Alternative\ninvestments typically operate in less efficient markets that provide investment managers with greater potential to exploit mispricing through active\ninvestment strategies.\nTypical characteristics of alternative investments include the following:\nActively managed concentrated portfolios\nManagers who are specialists in their fields (eg, long-short biotech)\nLess regulation and transparency\nHigh management fees\nRedemption restrictions\n(Choice B) Compared to traditional investments, alternative investments are subject to less regulation, resulting in fewer reporting requirements\nand less transparency regarding investment strategies, positions, and performance.\n(Choice C) Alternative investment managers tend to be narrowly focused specialists in their respective fields, not investment generalists.\nThings to remember:\nAlternative investments tend to be actively managed concentrated portfolios, are overseen by investment specialists, and have less regulatory\noversight compared to traditional investments.\nDescribe features and categories of alternative investments", "qhtml": null}, {"n": 11, "q": "At year-end, a private equity fund has returned 10% and has an 8% hurdle rate and a 20% performance fee with a catch-up clause. Based on only this information, the performance fee earned by the general partner is closest to:", "opts": ["0.00%", "0.40%", "2.00%"], "ans": "C", "expl": "In alternative investments such as private equity and venture capital, once a fund's hurdle rate is reached, a catch-up clause allows the general\npartner (GP) to receive all subsequent distributions until the agreed-upon profit split occurs per the limited partnership agreement (LPA).\nAdditional profits are then split proportionately (eg, 80/20).\nIn this scenario, the fund's annual performance is 10%, which exceeds the 8% hurdle rate; thus, the GP earns a performance fee. The catch-up\nclause combined with the 20% performance fee entitles the GP to the entire 2% profit above the 8% hurdle rate (ie, 20% of the 10% return).\nAfter this point, all profits are split (ie, 80/20 profit split) per the LPA since the GP is \"caught up.\"\n(Choices A and B) In this same scenario without a catch-up clause, the GP would have received a 20% performance fee on the 2% return above\nthe hurdle rate, which is 0.40% (ie, 20% of 2%) of the fund's total profits. This would be the minimum performance fee in this situation.\nThings to remember:\nIn alternative investments, once a fund's hurdle rate is reached, a catch-up clause allows the general partner to receive all subsequent\ndistributions until the agreed-upon profit split occurs per the limited partnership agreement. After this point, additional profits are split\nproportionately.\nDescribe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null}, {"n": 12, "q": "A hedge fund has a fee structure with a high-water mark but no hurdle rates. The high-water mark most likely:", "opts": ["resets with a new calendar year.", "will not apply if a fund always has positive returns.", "triggers fees from all fund investors at the same time."], "ans": "B", "expl": "A high-water mark (HWM) is the highest value that a fund has previously achieved for a given investor in the fund. It is used as a threshold for\ncalculating whether that investor will owe the fund manager a performance fee (also called an incentive fee or carried interest).\nHWMs ensure that performance fees are paid only when managers exceed prior HWMs, not when the fund recovers from previous losses. A\nmanager cannot receive a performance fee in subsequent periods unless the fund's value exceeds the existing HWM (ie, sets a new HWM). A\nmanager who can constantly increase the fund's value (and therefore constantly exceed prior HWMs) would always earn performance fees,\nassuming the manager is not also required to meet hurdle rates.\n(Choice A) A HWM does not reset with a new calendar year; it resets when the fund reaches a new high value.\n(Choice C) HWMs vary by investor (also known as a limited partner [LP]), depending on the fund's value when the LP invested. Therefore, an\ninvestor may or may not pay a performance fee at any given time, depending on whether the manager has exceeded that investor's HWM.\nThings to remember:\nA high-water mark (HWM) is the highest value achieved by a fund for a specific investor. Performance fees are typically paid by the investor only\nwhen a fund has surpassed that investor's prior HWM.\nDescribe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null}, {"n": 13, "q": "A new hedge fund is formed, and the managing principals seed the fund with €10 million. During the initial marketing phase, the hedge fund receives €50 million in capital commitments and the fund is launched. At the end of Year 1, total assets under management are €25 million. The management fee for Year 1 is most likely calculated on:", "opts": ["committed capital.", "committed capital less seed funding.", "year-end assets under management."], "ans": "C", "expl": "Private equity vs. hedge fund fee structures\nFee Private equity Hedge funds\nInternal rate of return (IRR) of a portfolio, accounts for all contributions\nBased totally on AUM\nand withdrawals\nManagement \"Committed capital\" inapplicable to hedge\nSwitches to % of assets under management (AUM) after investing all\nfunds\ncommitted capital\nAlways based on % of profits (realized or\nBased on % of profits realized on sale of fund holdings\nnot)\nIncentive Profits are not distributed (and incentive fee is not earned) until holdings\nFund has discretion on distributing\nare sold\nrealized profits\nHedge funds and private equity funds both initially obtain capital commitments from investors, which obligate investors to invest in the fund. These\ncapital commitments are often for \"soft commitments,\" occurring over a period of time (eg, 1 year) and at the investor's discretion, but they are\nnot legally binding. Conversely, private equity investors are legally obligated to deliver cash up to their capital commitment when demanded\nby the fund. This difference is largely due to the underlying structure and investments of the funds.\nFor hedge funds, management fees are always based on assets under management due to the lack of \"hard\" capital commitments. For private\nequity funds, the management fee is based on committed capital until all funds have been drawn down or the commitment period has ended\n(Choice A). At that point, the basis for the management fee converts to assets under management.\n(Choice B) Seed funding from the managing principals is included in assets under management for hedge fund management fee calculation\npurposes. Also, seed funding does not impact committed capital.\nThings to remember:\nFor hedge funds, management fees are always based on assets under management. For private equity funds, the management fee is based on\ncommitted capital until all the funds have been drawn down or the commitment period has ended. After that, the management fee is based on\nassets under management.\nDescribe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null}, {"n": 14, "q": "Investors that choose fund investing instead of other alternative investing methods can most likely expect:", "opts": ["higher costs and lower level of investor involvement.", "greater amounts of due diligence and a higher degree of control.", "reduced diversification benefits and higher minimum capital requirements."], "ans": "A", "expl": "Investors can choose from three different methods to invest in alternatives:\nDirect investing: investors take a direct position in an asset without use of external managers.\nCo-investing: investors collaborate with the fund manager and also invest at the fund level.\nFund investing: investors choose a fund, leaving the fund manager to choose the investments and perform due diligence.\nFund investing is typically the costliest of the three methods since investors pay both management and performance fees. Factors driving the\nhigh costs include greater complexity of alternative investments and due diligence requirements. In return for higher fees, fund investors delegate\nmanagement of investments to the fund manager, so fund investing usually requires the lowest amount of involvement from investors.\n(Choice B) An advantage of fund investing is that investors can delegate the most complex and time-consuming aspects of management, such\nas due diligence, to the fund managers. However, by delegating, investors also sacrifice level of control since the managers are usually making all\nfund-related decisions without investor input.\n(Choice C) Fund investing gives investors a high degree of diversification due to the number of investments typically available under a fund\nmanager. Funds also tend to have lower minimum capital requirements than co-investment or direct investment opportunities.\nThings to remember:\nInvestors may choose to invest in alternatives through fund investing, co-investing, or direct investing. Fund investing offers greater diversification\nopportunities, less investor involvement, and ability to delegate to fund managers. The main disadvantage is higher cost.\nCompare direct investment, co-investment, and fund investment methods for alternative investments", "qhtml": null}, {"n": 15, "q": "A clawback provision protects the limited partner from excess fees paid to the general partner in a private equity fund. Which of the following situations most likely activates a clawback provision?", "opts": ["Committed capital was never fully drawn down", "Profits and incentive fees were distributed annually", "Management fees are forfeited due to poor performance"], "ans": "B", "expl": "Clawback provision\nLimited partners are due their initial investment plus 80% of fund profits\nClawback is triggered to restore the 80/20 profit split balance\nRequires the general partner to return incentive fees to the limited partners\nOccurs when fees are paid over time instead of at wind down of a private equity fund\nPrivate equity funds charge both an annual management fee and an incentive fee. The typical structure pays the general partner (GP) a 2%\nmanagement fee and 20% of profits (ie, 2 and 20).\nThe management fee is initially based on committed capital and converts only to assets under management (AUM) when the commitment period\nends or when all funds are drawn down. During the commitment period (eg, 3 years), investors are contractually obligated to provide cash (up to\ntheir commitment level) when demanded by the fund. Investors do not actually provide capital until the fund needs cash for an investment.\nThe incentive fee is based on realized profits from the sale of the fund's investments. If incentive fees are paid throughout the life of the fund as\ninvestments are sold, a situation could occur where losses or small gains on other holdings result in the GP receiving more than 20% of the\nprofits. In this situation, the clawback provision requires the GP to repay a portion of the incentive fee or to forfeit future incentive fees to\nrestore the 80/20 profit split balance.\n(Choices A and C) Management fees are initially based on committed capital and convert to AUM when the commitment period ends; however,\nthe clawback provision applies only to incentive fees, regardless of fund performance.\nThings to remember:\nThe clawback provision requires the general partner to repay a portion of the incentive fee or to forfeit future incentive fees to restore the 80/20\nprofit split balance.\nDescribe investment ownership and compensation structures commonly used in alternative investments", "qhtml": null}, {"n": 16, "q": "A private equity fund specializes in leveraged buyouts. Its investors have committed a total of €45 million in capital. The fund has invested €40 million as of the end of 20X8 but has not yet demanded the remaining €5 million in commitments. For 20X8, the fund's assets generated a 15% unrealized gain, and the fund has not sold any of its investments. If the fund charges a 2% management fee and a 20% incentive fee, the total fees that the fund earned for 20X8 are closest to: ", "opts": ["€900,000", "€2,100,000", "€2,120,000"], "ans": "A", "expl": "Private equity vs. hedge fund fee structures\nFee Private equity Hedge funds\nInternal rate of return (IRR) of a portfolio, accounts for all contributions\nBased totally on AUM\nand withdrawals\nManagement \"Committed capital\" inapplicable to hedge\nSwitches to % of assets under management (AUM) after investing all\nfunds\ncommitted capital\nAlways based on % of profits (realized or\nBased on % of profits realized on sale of fund holdings\nnot)\nIncentive Profits are not distributed (and incentive fee is not earned) until holdings\nFund has discretion on distributing\nare sold\nrealized profits\nMost private equity funds obtain capital commitments from their investors. This means that for a specified period, such as three years, the\ninvestors are legally obligated to invest a specific amount when demanded by the fund. Investors do not actually provide capital until the fund\nneeds cash for an investment.\nPrivate equity funds typically charge separate management and incentive fees. The management fee is a percentage of the committed capital\nuntil the fund has invested all of the capital committed by its investors. At that point, the management fee is based on assets under management\n(AUM). This fund has invested only €40 million of the €45 million committed, so its management fee is 2% of €45 million, or €900,000. Note that\nthis is lower than if the fee were based on AUM, which would include the 15% gain on the invested funds.\nAny incentive fee is based on the fund's realized profits, so the fund earns an incentive fee only when it sells an asset. The fund's 15% return is\nunrealized, so it earns only the management fee for 20X8.\n(Choice B) The fund earned 15% on the €40 million invested, so AUM is €46 million for a profit of €6 million. Twenty percent of this amount is\n€1.2 million. If the 20% management fee is incorrectly added to the incentive fee, the total fee is computed as €900,000 + €1.2 million = €2.10\nmillion.\n(Choice C) This answer incorrectly bases the management fee on AUM (46 million × 0.02 = €920,000) and also incorrectly adds an incentive fee\nfor a total of €2.12 million.\nThings to remember:\nPrivate equity (PE) funds charge both an annual management fee and an incentive fee. Initially, the management fee is a percentage of\ncommitted capital. The incentive fee is based on realized profits from sales of the funds' assets. PE funds earn no incentive fees on unrealized\ngains.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 17, "q": "A hedge fund began the year with ¥20 billion in assets under management (AUM). It ended the year with ¥25 billion in AUM before deducting any fees. The fund's fee structure is as follows: Management fee: 2% of AUM Incentive fee: 20% of profits, net of management fee, with a high-water mark of ¥23 billion and a 5% hard hurdle rate The total fees charged by the fund for the year are closest to: ", "opts": ["¥570 million", "¥670 million", "¥800 million"], "ans": "A", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nHedge funds typically charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total\nvalue of the fund's assets (ie, assets under management, or AUM). It is assessed each year regardless of whether the fund earned a profit or\nincurred a loss. In this question, the fund's management fee is ¥500 million, calculated as follows:\nThe incentive fee is based on the fund's profits. It can also be subject to a hurdle rate and/or a high-water mark. Since this fund's incentive fee\nis net of the management fee, AUM is adjusted by subtracting the management fee from AUM before calculating the incentive fee. This fund's\nadjusted ending AUM is ¥24.5 billion, which exceeds the high-water mark of ¥23 billion, so the fund is entitled to an incentive fee.\nIf a hurdle rate applies, then the incentive fee is based on the profits in excess of the hurdle rate. This means that the high-water mark is adjusted\nupward by multiplying it by (1 + hurdle rate). After making the necessary adjustments, the fund's profits on which the incentive fee is based are\n¥350 million, as shown below:\nThe incentive fee is 20% × ¥350 million, or ¥70 million. Adding the incentive fee to the management fee results in a total fee of ¥570 million.\nThings to remember:\nHedge funds charge both a management fee, which does not depend on profitability, and an incentive fee. The incentive fee can be calculated\nindependently of the management fee or net of it. The incentive fee can be subject to a high-water mark and/or a hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 18, "q": "The seed investor of a three-year-old hedge fund that invests in high-yield private placements requests a redemption of £20 million. Fund details are listed below: Fund assets £50 million High-water mark £51 million Fee structure 2% and 20% Redemption notice period 2 weeks Lockup period 1 year Hurdle rate 2% Average annual returns since inception 1.5% Number of positions 20 Which of the following is the most likely outcome? ", "opts": ["The forced liquidation causes the hedge fund to close.", "There is sufficient time for an orderly disposition of assets.", "The hedge fund could invoke the lockup clause, delaying the redemption."], "ans": "A", "expl": "Effect of redemptions on hedge funds\nPoor performance often results in redemptions.\nA drawdown below the high-water mark is often a catalyst for redemptions.\nLarge redemptions often cause forced selling, leading to further losses.\nRedemption notice periods help insulate a hedge fund from withdrawals.\nLockup periods commit investors to a minimum investment period.\nThe redemption is most likely catastrophic for this hedge fund for the following reasons:\nThe redemption (£20 million) represents 40% of assets, making it difficult for the fund to continue executing its strategy.\nThe fund has performed poorly, on average not even hitting its hurdle rate, and assets under management are currently valued below the\nhigh-water mark.\nLike other areas of asset management, fees have decreased, even for the hedge fund industry. The 2-and-20 structure, common in the\npast, is now considered high for all but the most successful firms.\nThe two-week redemption notice period is not long enough to result in an orderly disposition of assets since the fund is concentrated (only\n20 positions) in illiquid assets (high-yield private placements) (Choice B).\nThis relatively large redemption will create a negative feedback loop: The fund will be forced to sell assets, most likely creating losses and poor\nperformance that will result in more redemptions, more asset sales, even poorer performance, and eventual liquidation.\n(Choice C) As the seed (ie, initial) investor, this investor has been with the fund since its inception three years ago and is no longer restricted by\nthe lockup period.\nThings to remember:\nRedemptions often coincide with poor performance, particularly when hedge funds fall below their high-water mark. Large redemptions can\ncompound performance issues, driving down the prices of fund holdings and resulting in more redemptions. This vicious cycle can ultimately lead\nto fund closure.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 19, "q": "A private equity fund operates with a hard hurdle of 6% and a 20% performance fee. The firm draws down its €200 million initial investment to purchase a portfolio company. Three years later, the portfolio company is sold for €280 million. If the firm operated with a soft hurdle instead of a hard hurdle, the additional performance fees (in € millions) that the GP would earn is closest to:", "opts": ["2.4", "7.6", "12.8"], "ans": "B", "expl": "Alternative asset funds can use many structures to calculate fees. One option is for funds to set a hurdle rate, which is a minimum rate of\nreturn that fund managers must achieve for investors before they start earning performance fees.\nHard hurdle rates allow fund managers to earn performance fees on only returns that are greater than the hurdle rate.\nSoft hurdle rates allow fund managers to earn performance fees on entire returns. They also allow fund managers to catch up their fees\nafter the limited partners (LPs) have been paid.\nIn this question, the fund achieved an €80 million (= €280 million − €200 million), or 40% gain. This exceeds the hurdle rate of 19.1% (= 1.063 −\n1), so the general partner (GP) is entitled to a performance fee. To find the difference between performance fees under hard and soft hurdle rates,\nboth must be calculated:\nAlternatively, the performance fee under the soft hurdle can be calculated as 80.0 × 0.2 (= 16.0). The difference between the soft hurdle and hard\nhurdle is 7.6 million (= 16.0 − 8.4)\n(Choice A) 2.4 incorrectly sets the hurdle rate at 6%, not accounting for three years of returns.\n(Choice C) 12.8 incorrectly calculates the catch-up fee earned under the soft hurdle rate as the performance fee on the whole gain.\nThings to remember:\nA hurdle rate is a minimum rate of return that fund managers much achieve for investors before they start earning performance fees. Hard hurdle\nrates allow fund managers to earn performance fees on only returns greater than the hurdle rate. Soft hurdle rates allow fund managers to earn\nperformance fees on entire returns.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 20, "q": "A hedge fund has EUR 800 million of initial capital. The fund charges a 3.0% management fee and a 15.0% incentive fee based on returns that exceed a 5.0% hurdle rate. Over a year, the fund increases in value by 25.0%. Assuming that management fees are calculated using end-of-year assets under management and that the performance fee is calculated net of the management fee, a fund investor's return, net of fees, is closest to:", "opts": ["12.4%", "14.6%", "18.8%"], "ans": "C", "expl": "Hedge funds typically charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total\nvalue of the fund's assets (ie, assets under management [AUM]). It is assessed each year regardless of whether the fund earned a profit or\nincurred a loss. In this instance, the fund's management fee is EUR 30 million, calculated as follows:\nThe incentive fee is based on the fund's profits. In this case, the fund earned 25% over the year, resulting in total profits of EUR 200 million\n(ending AUM − beginning AUM or 1,000 − 800). When the incentive fee is subject to a hurdle rate, any incentive fee is calculated on the profit in\nexcess of the hurdle rate. Since the incentive fee is also net of the management fee here, the total profit is adjusted by both the management fee\nand the hurdle rate prior to applying the incentive fee:\nAdding the incentive fee of EUR 19.5 million to the management fee of EUR 30 million results in a total fee of EUR 49.5 million. To calculate the\ninvestor's return, subtract the total fee from ending AUM (1,000 − 49.5 = 950.5) and then calculate the return percentage as follows (recalling\nthat beginning AUM was EUR 800 million):\n(Choice A) 12.4% results from calculating the return as the profit net of fees divided by the ending, not the beginning, AUM.\n(Choice B) 14.6% results from failing to calculate the incentive fee net of the management fee.\nThings to remember:\nHedge funds charge both a management fee (a percentage of the total assets under management) and an incentive fee. The incentive fee is\ncontingent on whether the fund earns a profit and may be subject to a hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 21, "q": "At the end of 20X4, a hedge fund had $25 million in assets under management (AUM). The fund has the following fee structure, high-water mark, and 20X5 results: Selected Data Management fee (average assets) 1% Incentive fee (net of management fee) 10% Soft hurdle rate 6% High-water mark (millions) $27 Year-end fund assets 20X5 (millions) $30 Assuming no inflows or outflows, the incentive fee (in $) earned by this hedge fund for 20X5 is closest to:", "opts": ["109,000", "272,500", "300,000"], "ans": "B", "expl": "Hedge funds charge a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of the fund's\nassets under management (AUM). It is assessed each year regardless of profitability.\nThe incentive fee is levied against the fund's annual gains, subject to certain conditions. It is calculated either gross or net of the management\nfee. The net calculation subtracts the management fee from AUM to arrive at an adjusted AUM that is used to calculate the fund's profits.\nThe high-water mark represents the value of AUM, net of fees, at any time during the fund's existence. To earn an incentive fee, the fund must\nexceed the high-water mark, the base from which the fee is calculated.\nThe hurdle rate is the minimum profit that the fund must earn (usually annually) before it receives an incentive fee. The hurdle rate can either\nbe \"soft,\" meaning that the incentive fee is calculated based on the entire profit, or \"hard,\" meaning that the incentive fee is based on only the\nexcess profit above the hurdle rate.\nIn this scenario, the fund generated net returns in 20X5 of 18.9% ( = (29.725 – 25) / 25 ), above the soft hurdle rate of 6%, and eclipsed the high-\nwater mark of $27 million. Therefore, the fund earned an incentive fee of 10% of profits, net of the management fee on average assets of\n$27,500,000:\n0.10 × (29,725,000 − 27,000,000) = $272,500.\nThings to remember:\nHedge funds charge both a fixed management fee and a variable incentive fee. The incentive fee is contingent on whether the fund earns a profit\nand may be subject to a high-water mark and hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees\n7.An endowment invested €10 million into a hedge fund on January 1 of Year 1 and neither added nor withdrew funds since then. Information\nconcerning the fund is shown as of the beginning of Year 5:\nAssets under management (AUM), beginning of year €200 million\nManagement fee 3% of year-end AUM\nIncentive fee 20% of annual profits\nIncentive fee calculation Independent of management fee\nPrevious high-water mark €250 million\nFund's return for the year 15%\nThe incentive fee is independent of the management fee and is subject to the high-water mark. If the fees are based on year-end AUM, then the\nendowment's return for the year is closest to:\nA. 8.6%\n\nB. 11.6%\nC. 15.0%\nExplanation\nA hedge fund investor's return is calculated after the hedge fund deducts its fees. Hedge funds typically impose both a management fee and an\nincentive fee. The management fee is calculated as a percentage of the total value of fund's assets (ie, assets under management, or AUM).\nIt is assessed at the end of each year regardless of profitability. The fund's management fee is €230 million × 3%, or €6.9 million.\nThe incentive fee is calculated as a percentage of profits. It can be calculated either after deducting the management fee (net) or before doing\nso (gross). Also, the incentive fee may be contingent on profits being greater than the hurdle rate and/or AUM being higher than the high-water\nmark.\nThis fund has no hurdle rate, but its incentive fee is subject to a high-water mark. In this scenario, the high-water mark of €250 million means that\nending AUM must exceed that amount before it can earn an incentive fee from the endowment. With ending AUM of only €230 million, the fund\nreceives no incentive fee.\nThe endowment's return for the year is calculated as follows (AUM and profits in € millions):\nThings to remember:\nHedge funds usually charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of\nfund's assets (AUM). It is assessed at the end of each year regardless of profitability. The incentive fee is calculated as a percentage of profits,\neither net or gross of the management fee. Also, the incentive fee may be contingent on the hurdle rate and/or the high-water mark.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 22, "q": "An endowment invested €10 million into a hedge fund on January 1 of Year 1 and neither added nor withdrew funds since then. Information concerning the fund is shown as of the beginning of Year 5: Assets under management (AUM), beginning of year €200 million Management fee 3% of year-end AUM Incentive fee 20% of annual profits Incentive fee calculation Independent of management fee Previous high-water mark €250 million Fund's return for the year 15% The incentive fee is independent of the management fee and is subject to the high-water mark. If the fees are based on year-end AUM, then the endowment's return for the year is closest to:", "opts": ["8.6%", "11.6%", "15.0%"], "ans": "B", "expl": "A hedge fund investor's return is calculated after the hedge fund deducts its fees. Hedge funds typically impose both a management fee and an\nincentive fee. The management fee is calculated as a percentage of the total value of fund's assets (ie, assets under management, or AUM).\nIt is assessed at the end of each year regardless of profitability. The fund's management fee is €230 million × 3%, or €6.9 million.\nThe incentive fee is calculated as a percentage of profits. It can be calculated either after deducting the management fee (net) or before doing\nso (gross). Also, the incentive fee may be contingent on profits being greater than the hurdle rate and/or AUM being higher than the high-water\nmark.\nThis fund has no hurdle rate, but its incentive fee is subject to a high-water mark. In this scenario, the high-water mark of €250 million means that\nending AUM must exceed that amount before it can earn an incentive fee from the endowment. With ending AUM of only €230 million, the fund\nreceives no incentive fee.\nThe endowment's return for the year is calculated as follows (AUM and profits in € millions):\nThings to remember:\nHedge funds usually charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of\nfund's assets (AUM). It is assessed at the end of each year regardless of profitability. The incentive fee is calculated as a percentage of profits,\neither net or gross of the management fee. Also, the incentive fee may be contingent on the hurdle rate and/or the high-water mark.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 23, "q": "A hedge fund's fees are calculated independently, and the fund does not collect an incentive fee on assets that have already been subject to that fee. Which of the following best describes this fee structure?", "opts": ["Management and incentive fees are on a net basis, subject to a hurdle rate", "Management fees are on a gross basis and incentive fees are on a net basis", "Management and incentive fees are on a gross basis, subject to a high-water mark"], "ans": "C", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nHedge funds often levy both a management fee and an incentive fee. If fees are calculated independently, calculations are on a gross basis.\nAn incentive fee is often contingent on:\nprofits being greater than a hurdle rate, which is the minimum performance that a fund must achieve before earning a performance fee,\nand/or\nAssets under management (AUM) being above a high-water mark (HWM), which is the base asset value used to calculate the incentive\nfee. The HWM represents the fund's previous peak value of AUM at which incentive fees have been paid.\nIn this case, the fee structure's management and incentive fees are on a gross basis (ie, independently), subject to a high-water mark, since the\nfund does not collect an incentive fee on assets that have already been subject to that fee (Choices A and B).\nThings to remember:\nHedge funds often levy both a management fee and an incentive fee. If fees are calculated independently, calculations are on a gross basis. The\nhigh-water mark represents the fund's previous peak value of assets under management (AUM) at which incentive fees have been paid.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 24, "q": "An investor most appropriately uses the Sharpe ratio as the risk-adjusted return measure for a hedge fund when the fund's:", "opts": ["holdings are illiquid.", "returns are normally distributed.", "strategy relies on significant leverage."], "ans": "B", "expl": "The Sharpe ratio measures excess return relative to total risk, using standard deviation as the measure of risk. However, standard deviation\nis an appropriate risk metric only when the investment's returns are normally distributed. Many hedge funds' return distributions are non-\nnormal, often exhibiting skewness and kurtosis. For those funds, the Sortino and Calmar ratios may be a more appropriate measure.\n(Choice A) Illiquid assets trade infrequently and their value must be estimated. Calculating returns based on subjective estimates of the assets'\nvalue rather than actual market prices frequently reduces price volatility, resulting in return smoothing. Thus, the standard deviation of those\nreturns most likely understates their true volatility.\n(Choice C) Large amounts of leverage introduce the risk of large left-tail events (ie, negative skew). The Sharpe ratio will often not reveal this\ndynamic until it is \"too late.\" It is equally or even more important to understand how the fund's performance history was created than to know the\nrisk metric's output based on that performance.\nThings to remember:\nThe Sharpe ratio is an appropriate measure for a hedge fund's risk-adjusted return only when the investment's returns are normally distributed.\nMany hedge funds have non-normal distributions, use leverage, and have illiquid holdings; these factors make the Sharpe ratio a less appropriate\nperformance metric.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 25, "q": "A hedge fund manager wants the power to liquidate positions in a well-organized way whenever necessary and plans to impose restrictions on investors' ability to redeem capital. Which of the following restrictions would be most appropriate? ", "opts": ["Notice period", "Lockup period", "Redemption fee"], "ans": "A", "expl": "Investor redemptions can significantly impact the performance of hedge funds. Unplanned redemption requests may force the fund manager to\nsell illiquid or volatile assets at unfavorable prices. This may harm fund performance and result in losses for the remaining investors.\nHedge funds often impose restrictions on investors, discouraging or prohibiting redemptions during specific periods:\nA lockup period is the minimum time an investor is committed to a fund after the initial investment. This restriction should give the fund\nmanager a reasonable time frame to select and acquire assets that optimize the fund's strategy. Withdrawals are not allowed during this\nperiod, but nothing restricts redemptions after the lockup period ends (Choice B).\nA notice period is the length of time an investor is required to wait to receive a redemption after requesting it. This restriction gives the fund\nmanager more time to convert assets into cash, which reduces the risk of forced selling and makes the notice period the most appropriate\nchoice for fund managers concerned about liquidity.\nRedemption fees are paid by investors when redeeming their capital and are generally added back to the fund. The fees compensate the\nremaining investors for losses the fund may eventually suffer when liquidating positions in an accelerated way. Redemption fees\ndiscourage but do not prohibit redemptions at any time (Choice C).\nThings to remember:\nHedge funds often impose restrictions on redemptions. These restrictions may prohibit investors from redeeming for a period after the initial\ninvestment (lockup period) and/or require advance notice for processing redemptions (notice period). Funds may also impose redemption fees,\nwhich discourage—but do not prohibit—redemptions and generally compensate the remaining investors for any resulting losses.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 26, "q": "Which of the following is the least appropriate ratio to use for evaluating the performance of a market-neutral hedge fund?", "opts": ["MAR ratio", "Calmar ratio", "Treynor ratio"], "ans": "C", "expl": "Investment returns are often expressed on a risk-adjusted basis (ie, return per level of risk). The Treynor ratio measures excess returns relative\nto systematic risk, in which:\nexcess return is calculated as the difference between the portfolio's return and the return of a risk-free asset (eg, US Treasury bill or T-\nbill), and\nsystematic risk is measured by beta.\nThe Treynor ratio is therefore more suitable for evaluating a fully diversified portfolio that does not have company-specific risk.\nMarket-neutral hedge funds invest in individual securities while targeting an average beta of zero so that they carry only nonsystematic risk.\nTherefore, trying to calculate a market-neutral hedge fund's excess return per unit of systematic risk is not appropriate.\n(Choices A and B) Both the Calmar and MAR ratios are appropriate for measuring the risk-adjusted performance of alternative assets or hedge\nfunds by accounting for the drawdown loss. Both compare compounded average annual returns against the maximum drawdown.\nThings to remember:\nThe Treynor ratio determines a portfolio's excess return per unit of systematic risk (and would not be an appropriate measure of performance for a\nmarket-neutral hedge fund). The Calmar and MAR ratios measure the risk-adjusted performance of alternative assets or hedge funds by\naccounting for the drawdown loss.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 27, "q": "A hedge fund had the following attributes during 20X3: Management fee 1.5% Incentive fee 15.0% Soft hurdle rate 5.0% High-water mark $200 million Beginning assets $191 million Ending assets $216 million If the management fee is calculated on ending assets and the incentive fee is based on net returns, the return (%) to the investor for 20X3 is closest to:", "opts": ["9.7", "10.4", "10.8"], "ans": "B", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nAn investor's hedge fund return is calculated net of fees. Hedge funds often levy both a management fee and an incentive fee. The\nmanagement fee is calculated as a percentage of the fund's total assets under management (AUM) and is assessed regardless of profitability.\nThe incentive fee is calculated as a percentage of profits, either net (ie, after deducting) or gross (ie, before deducting) of management fees.\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or AUM being higher than the high-water mark. The threshold\nfor this hedge fund to earn an incentive fee is contingent on exceeding the 5% soft hurdle rate and the high-water mark of $200 million. Since this\nfund has a soft hurdle rate, the incentive fee will be applied to the entire gain above the high-water mark.\nThe fund's return for the year is calculated as follows (AUM and profits in $ millions):\n(Choice A) 9.7% is the investor return by assuming no high-water mark.\n(Choice C) 10.8% is the investor return assuming a hard hurdle rate of 5%. A hard hurdle rate increases an investor's return, as the incentive fee\nis earned only on returns at or above the hurdle rate, not the entire gain.\nThings to remember:\nAn investor's return in a hedge fund is calculated net of fees. Hedge funds levy both a management fee and an incentive fee. The management\nfee is calculated as a percentage of the fund's total value and is assessed regardless of profitability. The incentive fee is calculated as a\npercentage of profits, subject to hurdle rates and high-water marks.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 28, "q": "The general partner of a private equity fund will most likely earn an incentive fee once the:", "opts": ["clawback provision has been invoked.", "committed capital has been fully drawn down.", "limited partners' initial investment has been paid back."], "ans": "C", "expl": "Private equity vs. hedge fund fee structures\nFee Private equity Hedge funds\nInternal rate of return (IRR) of a portfolio, accounts for all contributions\nBased totally on AUM\nand withdrawals\nManagement \"Committed capital\" inapplicable to hedge\nSwitches to % of assets under management (AUM) after investing all\nfunds\ncommitted capital\nAlways based on % of profits (realized or\nBased on % of profits realized on sale of fund holdings\nnot)\nIncentive Profits are not distributed (and incentive fee is not earned) until holdings\nFund has discretion on distributing\nare sold\nrealized profits\nPrivate equity (PE) funds charge both an annual management fee and an incentive fee. The incentive fee is based on realized profits from the\nsale of the fund's investments. The general partner (GP) (ie, fund manager) is eligible for the incentive fee once the limited partners (ie,\ninvestors) have received distributions equal to their initial investments.\n(Choice A) If incentive fees are paid throughout the life of the fund as investments are sold, the GP may receive more than the contractually\nagreed upon portion of profits due to losses on other holdings. In this situation, a clawback provision requires the GP to repay a portion of the\nincentive fee or forfeit future incentive fees.\n(Choice B) Committed capital refers to the amount the limited partners have agreed to provide the PE fund upon request to finance a new\ninvestment. A PE fund will draw down these capital commitments, usually over three to five years. The incentive fee is based on fund\nperformance and is not contingent on the full draw down of committed capital.\nThings to remember:\nThe incentive fee is based on realized profits from the sale of the fund's investments. Once investors have received distributions equal to their\ninitial investment, the general partner can be paid an incentive fee.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 29, "q": "An investor invests in the HFX fund of funds at the beginning of 20X2. At that time HFX has a net asset value of $240 million. HFX charges a 1% management fee assessed on ending assets under management and a 10% incentive fee assessed on profits before deducting the management fee. At the end of 20X2, HFX's net assets are valued at $270 million before the assessment of any fees. The annual return earned by the investor, net of all fees, is closest to: ", "opts": ["10.1%", "10.2%", "12.5%"], "ans": "A", "expl": "A fund of funds (FOF) is a hedge fund that invests in multiple hedge funds. This gives an investor diversification among different hedge funds\nthrough a single investment. Other advantages include enhanced due diligence and access to funds that are otherwise closed to investors.\nThe main disadvantage is that a FOF carries higher costs. Investors incur fees on assets under management as well as incentive fees imposed\nby both the fund of funds and the hedge funds in which it invests. The fees of the portfolio hedge funds are a drag on performance, but they are\nalready reflected in HFX's year-end valuation in this scenario and therefore not a separate factor in the FOF return calculation.\nThe incentive fee is calculated as a percentage of profits and can be on either a net (ie, after management fee) or gross (ie, before management\nfee) basis. In this case, the incentive fee is calculated on a gross basis.\n(Choice B) 10.2% results from calculating the incentive fee net of the management fee.\n(Choice C) 12.5% results from failing to deduct the management and incentive fees when calculating the return.\nThings to remember:\nA fund of funds invests in multiple hedge funds. Both the fund of funds and the h
