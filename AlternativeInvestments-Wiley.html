ojects have no financial or operating history. Greenfield projects are among the riskiest investments to undertake due\nto long lead times (often 5–10 years) and the potential for delays or cost overruns in land acquisition, permits, engineering, and final construction.\nDue to the high risks associated with greenfield projects, investors require very high returns for these types of investments. A pension fund with a\nvery long investment horizon can absorb the risks while reaping the potentially greater expected returns that can be generated over the long life\nof these assets.\n(Choice A) Relative to greenfield projects, brownfield assets have lower risks due to stable cash flow generation and known operating and\nfinancial histories. These projects tend to be more income producing and/or dividend oriented, but the expected returns are lower.\n(Choice C) A publicly listed master limited partnership (MLP) in existing energy pipeline assets is an example of a brownfield asset, with lower\nreturn expectations than a greenfield project. MLPs primarily emphasize income generation.\nThings to remember:\nGreenfield projects build new infrastructure, while brownfield projects expand or improve existing infrastructure. Since they often have long lead\ntimes and no performance history, greenfield assets carry considerable risk and therefore must offer much higher long-term expected returns than\nbrownfield assets.\nExplain features and characteristics of infrastructure", "qhtml": null}, {"n": 65, "q": "An investor who does not seek current income from an investment in infrastructure should most appropriately:", "opts": ["directly invest in a greenfield hospital project.", "own shares in an unlisted mutual fund that invests in existing toll roads.", "invest in an exchange-traded fund that consists of brownfield public utilities."], "ans": "A", "expl": "Classification of infrastructure investments\nCategory Characteristics\nTransportation assets (eg, bridges, airports)\nEconomic\nUtility assets (eh, water, waste treatment, power generation)\nTypes of assets\nSocial Public welfare assets (eg, hospitals, schools)\nBrownfield Improving existing infrastructure\nStage of development\nGreenfield Building new infrastructure\nDirect ownership of a project\nDirect Highest upside potential\nHighest concentration and liquidity risks\nInvestment vehicle\nShares of publicly traded infrastructure companies\nIndirect Investment can be made through exchange-traded funds, mutual funds\nBetter liquidity and more diversification than direct investment\nA greenfield infrastructure project is one that has not yet been built; a brownfield project already exists. Infrastructure projects typically require\na long construction period, so they tend not to produce current income at the project's inception. This type of investment is appropriate for an\ninvestor who does not seek current income.\nDirect investment refers to an ownership interest in the project itself. An indirect investment consists of an investment in an entity such as a\nmutual fund or an exchange-traded fund that in turn invests in infrastructure assets.\n(Choices B and C) Investments in completed (ie, brownfield) projects can produce immediate current income, and utilities and toll roads typically\nproduce significant amounts of current income.\nThings to remember:\nGreenfield infrastructure assets must be built, and a greenfield investor often realizes no current income during an asset's construction.\nBrownfield investments, especially those that benefit from regular revenue streams such as utilities and toll roads, are more appropriate for an\ninvestor seeking current income.\nExplain features and characteristics of infrastructure", "qhtml": null}, {"n": 66, "q": "An analyst is using a real estate valuation index to estimate the value of an investment property and wishes to avoid sample selection bias. The analyst's least appropriate choice is to use a(n):", "opts": ["REIT index.", "appraisal index.", "repeat sales index."], "ans": "C", "expl": "Real estate return indexes are categorized as appraisal, repeat sales, or real estate investment trust (REIT) indexes. Repeat sales indexes are\nconstructed using the average price change of the same property as a result of a sale or refinancing. This transaction-based approach\nprovides a timely and accurate valuation for a broad range of properties (eg, residential single-family homes).\nA repeat sales index does have limitations, including sample selection bias. The selection process is nonrandom since it uses properties with\nprior sales. Thus, the index may have a bias toward properties that turn over at a higher rate but are not necessarily representative of the broader\ngeographic scope of the index. Selection bias could also occur if sales in a specific area are infrequent, making the results less reliable.\n(Choice A) REIT indexes are based on the underlying prices of publicly traded REITs. Although useful for the valuation of the real estate asset\nclass, valuation of publicly traded REITs may not align with the specific circumstances (eg, geography, quality, property type) for valuing a\nparticular investment property.\n(Choice B) Appraisal indexes rely on appraised property values, which are typically based on comparable properties or cash flow estimates.\nLimitations of the appraisal index include the subjectivity of the appraisal process and the reliance on appraisals to calculate returns, all of which\nmay result in understated return volatility.\nThings to remember:\nSample selection bias is a limitation of repeat sales indexes. Since the selection process is nonrandom, a repeat sales index may have a bias\ntoward certain properties that are not necessarily representative of the broader geographic scope of the index. Selection bias could also occur if\nsales in a specific area are infrequent, making the results less reliable.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 67, "q": "The type of infrastructure investment most likely to have the highest concentration risk is a(n):", "opts": ["direct investment in a greenfield project.", "unlisted mutual fund that invests in multiple global brownfield projects.", "exchange-traded fund (ETF) made up of publicly traded infrastructure companies."], "ans": "A", "expl": "Classification of infrastructure investments\nCategory Characteristics\nTransportation assets (eg, bridges, airports)\nEconomic\nUtility assets (eh, water, waste treatment, power generation)\nTypes of assets\nSocial Public welfare assets (eg, hospitals, schools)\nBrownfield Improving existing infrastructure\nStage of development\nGreenfield Building new infrastructure\nDirect ownership of a project\nDirect Highest upside potential\nHighest concentration and liquidity risks\nInvestment vehicle\nShares of publicly traded infrastructure companies\nIndirect Investment can be made through exchange-traded funds, mutual funds\nBetter liquidity and more diversification than direct investment\nInfrastructure refers to public-use assets such as schools, hospitals, and roads. Investing in infrastructure is a form of alternative investing.\nGreenfield projects represent new assets that will be built; brownfield assets are those that already exist. Most infrastructure investing is\nthrough indirect vehicles such as mutual funds and exchange-traded funds (ETFs), but direct investment is available for some types of projects.\nDirect investors are responsible for building the greenfield asset; they own all its upside potential as well as its risks. Infrastructure projects are\nextremely capital-intensive, and each project's capital requirements often make it unfeasible for an investor to directly invest in multiple projects.\nThis limited ability to diversify causes concentration risk.\n(Choice B) Unlisted mutual funds make passive investments in infrastructure assets that are not publicly traded, such as hospitals or schools.\nThese funds diversify among several different investments, so concentration risk is usually not present.\n(Choice C) Infrastructure ETFs consist of shares of publicly traded infrastructure companies. The diversification across many companies means\nthat no single company comprises a significant percentage of the fund. This reduces the possibility of concentration risk.\nThings to remember:\nInvestors can choose between direct and indirect investments in infrastructure projects. Direct investing captures all the project's upside potential\nbut exposes the investor to the most risk, including concentration risk. Indirect investing can provide more diversification and reduce the investor's\nrisk.\nExplain features and characteristics of infrastructure", "qhtml": null}, {"n": 68, "q": "A private equity real estate fund that primarily redevelops and repurposes shopping malls in secondary and tertiary markets is most likely structured as a(n):", "opts": ["core-plus strategy fund.", "finite-life closed-end fund.", "infinite-life open-end fund."], "ans": "B", "expl": "Indirect real estate:\nPrivate equity fund characteristics\nInfinite life, open end Finite life, closed end\nBeta exposure, income oriented Higher-risk property types and markets, but higher return profile\nBuy-and-hold strategy Sell properties once redeveloped, focus on capital appreciation, then\nContribute and redeem throughout the fund's life close the fund\nCore strategy: high quality, best markets, and stable return Value-add strategy: modest upgrades and redevelopment or\nprofile repositioning of property\nCore-plus strategy: incorporates an allocation to lower-tier Opportunistic strategy: higher-risk projects, major redevelopments,\nmarkets and higher-risk properties significant vacancies, and speculation\nIndirect real restate investing takes many forms, including various public and private pooled investment vehicles, such as real estate-focused\nprivate equity funds. Real estate private equity funds are generally structured as either finite-life closed-end (FLCE) funds or infinite-life open-\nend (ILOE) funds.\nFLCE funds typically earn returns through the development or redevelopment of higher-risk properties (eg, nursing homes, hotels) in noncore\nmarkets. Once redeveloped, the properties are sold to lock in returns and the fund is then wound down. After their initial investment, investors\nare unable to contribute or redeem until the fund is wound down. FLCE funds are positioned as:\nValue-add funds, which include modest property upgrades and redevelopment or repositioning of a property.\nOpportunistic funds, which are the most aggressive and include projects with much higher risk. Examples include major redevelopments,\nvacant properties, and outright speculative construction.\nA fund that primarily redevelops and repurposes shopping malls (ie, high risk) in secondary and tertiary markets (ie, noncore) is most likely\nstructured as an opportunistic finite-life closed-end fund.\nILOE funds have no predetermined end date and investors can contribute and redeem throughout the life of the fund. ILOE funds include core\nfunds, which focus exclusively on buying and holding the best properties in the best markets (ie, low risk, income focus) and provide general asset\nclass exposure (ie, beta). Core-plus funds also invest primarily in core properties but add a modest allocation to riskier markets and property\ntypes (Choices A and C).\nThings to remember:\nFinite-life closed-end funds generally invest in higher-risk property types in noncore markets. Once redeveloped, the properties are sold to lock in\nreturns and the fund is then wound down. Opportunistic finite-life closed-end fund strategies are more aggressive than value-add strategies.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 69, "q": "Which of the following is most likely a limitation of using appraisal indexes to measure returns to real estate?", "opts": ["Infrequent trading", "Understated volatility", "Sample selection bias"], "ans": "B", "expl": "Returns to real estate can be measured using various indexes, which are broadly categorized as appraisal, repeat sales (ie, transactional), or real\nestate investment trust (REIT) indexes. Appraisal index returns rely on appraised property values, which are typically based on comparable\nproperties or cash flow estimates.\nAlthough appraisals are expert estimates of value, both the selection of comparable properties and adjustments made to those properties are\nsubjective. Also, appraisals are often updated less frequently than needed to reflect current market conditions. These limitations tend to result\nin understated return volatility.\n(Choice A) The appraisal index is not based on trading shares, so it is unaffected by trading frequency. Trading infrequency is a potential\nlimitation of REIT indexes since reliability is directly related to the frequency of trading.\n(Choice C) An appraisal index is based on appraisals of actual assets in the index, so sample selection is irrelevant. Sample selection bias is a\nlimitation of repeat sales indexes, which are based on the change in value for sales of the same property during a given period.\nThings to remember:\nReal estate return indexes are categorized as appraisal, repeat sales, or real estate investment trust indexes. Limitations of the appraisal index\ninclude the subjectivity of the appraisal process and the potential reliance on infrequent appraisals to calculate returns, all of which may result in\nunderstated return volatility.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 70, "q": "In commodity futures markets, futures prices are more likely to be in contango when:", "opts": ["storage costs are positive.", "the forward curve is downward sloping.", "convenience yields are greater than storage costs."], "ans": "A", "expl": "Commodities are a type of alternative investment in physical products, such as minerals and agricultural goods. A commodity can be owned\ndirectly by the investor, but most commodities investing is accomplished through futures contracts. When the futures price is greater than the\nspot price (ie, price at which the asset currently trades in the market), the futures contract is said to be in contango.\nTo determine the arbitrage-free price of a futures contract, use the following formula:\nWhen an investor owns a commodity directly, the commodity incurs storage costs, which are added to the futures price since the futures owner is\nnot holding the commodity and therefore not paying the costs. The convenience yield represents the investor's imputed benefit from directly\nowning the commodity; this yield is deducted from the futures price since the futures owner does not hold the commodity or receive the benefit.\nThe storage costs are added to the futures price and the convenience yield is deducted from it. This prevents the possibility of arbitrage, in which:\nthe storage costs cause the futures price to be greater than the spot price, and\nthe convenience yield can result in a spot price that is less than the futures price.\nBackwardation occurs when the futures price falls below the spot price; this possibility exists when the convenience yield is greater than the\nstorage costs (Choice C).\n(Choice B) A contract in backwardation produces a downward-sloping forward curve (ie, forward price is less than spot price). A contract in\ncontango has an upward-sloping forward curve.\nThings to remember:\nThe terms contango and backwardation describe a futures contract price as it relates to the underlying commodity's spot price. A contango\n(backwardation) contract has a futures price greater (less) than the underlying spot price. Contango can result when storage costs exceed the\nconvenience yield.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 71, "q": "Commodity indexes are most likely:", "opts": ["subject to backfill and survivorship bias.", "directly comparable since weighting methods are standardized.", "to have performance differences versus the underlying commodities."], "ans": "C", "expl": "Commodity indexes\nExposure to underlying commodities gained through\nderivatives\nDerivative price performance can vary significantly from\nphysical commodity price\nUnderlying commodity exposure can vary substantially\nbetween indexes\nWidely viewed as an inflation hedge\nHistorically low correlations to other asset classes\nCommodity indexes use futures or other derivative contracts to gain exposure to the underlying commodities in each index. This makes the\nindexes more investable and easier to replicate with greater price transparency than direct commodity investments.\nAn index may have exposure to more than one commodity, and each commodity in the index may have a different weight. Futures prices, while\ncertainly affected by changes in the underlying commodity, are also affected by carrying costs and returns on the collateral required for futures\ninvestments. These factors mean that the price of the index is almost certain to differ from the commodity's futures price. Likewise, an underlying\ncommodity's return as measured by a change in its spot price is almost certain to differ from the commodity index's return as measured by a\nchange in its futures price.\n(Choice A) Unlike other alternative investment indexes (eg, hedge funds, private equities), commodity indexes are based on observable market\nprices of commodity derivatives and therefore not subject to the selective reporting that leads to backfill and survivorship bias.\n(Choice B) Underlying commodity exposure and weighting methods can vary substantially between indexes and therefore are not standardized.\nThings to remember:\nCommodity indexes use futures or other derivative contracts to gain exposure to the underlying commodities in each index. Since the futures\nprice of an underlying commodity is almost certain to differ from its spot price, the index's return as measured by a change in its futures price is\nalmost certain to differ from the commodity's return as measured by a change in its spot price.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 72, "q": "Generally, the investment characteristic that best distinguishes farmland from timberland is that farmland:", "opts": ["can be hedged using futures.", "has a role as an inflation hedge.", "lacks the production flexibility of timberland."], "ans": "C", "expl": "Farmland and timberland investments\nFarmland Timberland Common to both\nHarvest quantities\nSources of returns Commodity prices Lumber prices\nLand price changes\nPossibly ESG Inflation hedge\nESG-friendly\nInvestment Regular income Low correlation with traditional\nLong new growth cycle\nattributes Harvest inflexibility; at least annual assets\nHarvest flexibility\nharvest cycle Can hedge with futures\nDirect purchase, but for largest\nInvestment vehicles Publicly traded REITs investors only\nPrivate investment funds\nESG = environmental, social, and governance REIT = Real estate investment trust\nFarmland and timberland have three principal components of return: harvest quantities, changes in commodity prices, and changes in land\nprices. Both types of land are desirable investments due to:\na low occurrence of negative historical annual returns;\nincome streams derived from the sale of crops or timber;\nlow correlations with other financial assets; and\nproviding an inflation hedge due to exposure to commodity and land prices.\nThe most significant difference between farmland and timberland is the harvest cycle. Farm crops, whether row crops (eg, corn, wheat) or\npermanent crops (eg, almonds, grapes) must be harvested when ripe, with little flexibility in production. By contrast, timber does not have to be\nharvested regularly, so if market conditions are unfavorable, the harvest can be delayed indefinitely. Timberland can serve simultaneously as a\nproduction facility (when timber is harvested) as well as a source of raw material (ie, uncut trees).\n(Choice A) Both timberland (ie, lumber) and many farmland crops (eg, corn, wheat) can be hedged through futures on the commodities produced.\n(Choice B) Both farmland and timberland are viewed as inflation hedges.\nThings to remember:\nBoth farmland and timberland provide a regular history of positive returns, diversification benefits, an inflation hedge, and returns comparable to\nequities. The most significant distinguishing investment characteristic of farmland relative to timberland is the harvest cycle: farm crops must be\nharvested at least annually; harvesting of timber can be delayed indefinitely.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 73, "q": "An analyst observes that a commodity's forward curve is in backwardation. This situation most likely implies:", "opts": ["negative roll yield.", "negative collateral yield.", "convenience yield exceeds storage costs."], "ans": "C", "expl": "An investor who owns a physical commodity (eg, copper) incurs storage costs until the commodity is used or sold. However, that investor also\naccrues benefits (eg, immediate availability) from directly owning the commodity; the benefit that offsets storage costs is the convenience yield. In\ncontrast, an investor who owns a futures contract on the same commodity incurs no storage costs until the contract matures and delivery is\naccepted, but no convenience yield is accrued.\nAll else equal, a commodity's futures prices are higher than the spot price by the cost of holding the commodity, which prevents arbitrage.\nTherefore, the typical forward pricing structure for physical commodities is an upward-sloping forward curve (ie, futures prices > spot prices); in\nthat case, the market is said to be in contango.\nA downward-sloping forward curve (ie, futures prices < spot prices), known as backwardation, results from the convenience yield exceeding\nstorage costs. Backwardation often indicates bottlenecks in supply or delivery in the spot market.\n(Choice A) Roll yield is the return (positive or negative) that occurs when a contract nears expiration and the futures price converges with the spot\nprice. Backwardation results in a positive roll yield.\n(Choice B) Collateral yield is a component of a futures contract's price return and should always be positive.\nThings to remember:\nContango and backwardation are terms that describe a futures contract's price relative to the spot price of the underlying commodity. The contract\nis in backwardation if the futures price is lower than the spot price. When this occurs, the convenience yield is greater than the storage costs.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 74, "q": "A portfolio manager is seeking an alternative investment to diversify a pension portfolio. If the investment is actively managed, liquid, and a variant of a global macro strategy, it is most likely a:", "opts": ["market-neutral fund.", "merger arbitrage fund.", "managed futures fund."], "ans": "C", "expl": "Managed futures\nActively managed futures trading\nFeatures Absolute return focus\nSubset of global macro approach\nLow/negative correlation to traditional assets\nBenefits Potentially strong performance during equity market corrections\nHigh liquidity\nUse of substantial leverage\nRisks\nSustained periods of relative underperformance\nManaged futures (MF) are alternative investments that actively trade a variety of futures contracts (eg, commodity, interest rate, foreign\nexchange). MF use short-term, trend-following strategies; are absolute-return oriented; and are most commonly associated with global macro\ninvesting. Global macro is an investing strategy based on anticipating moves in macro factors (eg, interest rates, government policy, foreign\nexchange). The primary attraction for MF investors is the low-to-negative correlations with traditional asset classes and high levels of liquidity.\nMF funds are similar in structure to hedge funds and often have comparable incentive fee structures based on fund performance. As with\nnumerous hedge fund strategies that have gone mainstream, many MF products are available in a mutual fund or exchange-traded fund format\n(ie, \"liquid alts\").\n(Choice A) A market-neutral strategy consists of buying undervalued stocks and shorting overvalued stocks to create a portfolio that is immune to\nmarket-level risks and is zero-beta. Market-neutral portfolios do not employ global macro tactics.\n(Choice B) Merger arbitrage pairs merger partners in long and short positions. It is an event-driven, bottom-up strategy and does not use a\nglobal macro approach.\nThings to remember:\nManaged futures (MF) funds are alternative investments that actively trade a variety of futures contracts. MF use short-term, trend-following\nstrategies and are most commonly associated with global macro investing.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 75, "q": "When a commodity's futures prices are in contango, its forward price curve most likely has:", "opts": ["a negative slope.", "a positive roll yield.", "little to no convenience yield."], "ans": "C", "expl": "Slope of the futures curve\nContango Backwardation\nFutures price > spot price Futures price < spot price\nMay result if May result if\nNo convenience yield or Convenience yield > storage costs\nConvenience yield < storage costs\nAn investor who owns a physical commodity (eg, wheat, copper) incurs storage costs until the commodity is used or sold. In contrast, an investor\nwho owns a futures contract on the same commodity incurs no storage costs until the contract matures and delivery is accepted.\nAll else equal, to prevent arbitrage, a commodity's futures prices are set higher than the spot price by the cost of holding the commodity. An\nupward-sloping futures curve (ie, futures prices > spot prices) is the typical forward pricing structure for physical commodities. This structure is\ncalled contango.\nConvenience yield, which offsets the storage costs, is the benefit the investor receives from directly owning the commodity (eg, immediate\navailability). Contango results if the convenience yield is less than the storage costs, which is usually the case. When the futures contract is in\ncontango, there is little to no convenience yield (ie, benefit) to owning the commodity directly.\n(Choice A) Backwardation has a negatively sloped (ie, downward-sloping) forward price curve since the futures price is less than the spot price.\n(Choice B) Roll yield is the return (positive or negative) that occurs when the contract nears its expiration and the futures price converges with the\nspot price. The roll yield for a forward price curve in contango is negative since the futures price is moving toward the lower spot price.\nThings to remember:\nA futures contract is in contango if the futures price is higher than the spot price. When this occurs, the convenience yield of holding the\ncommodity directly is less than the storage costs.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 76, "q": "A hedge fund that concentrates on midstream oil and gas investments is most likely to invest in:", "opts": ["gasoline refineries.", "drilling companies.", "plastics manufacturers."], "ans": "A", "expl": "Categories of alternative investing in the oil and gas sector\nCategory Characteristics\nExploration and extraction\nUpstream\nDrilling and oil field services companies\nRefining and processing\nMidstream\nGasoline, heating oil, and jet fuel refineries\nMakers of end-user goods from refined petroleum products\nDownstream\nPlastics and chemicals manufacturers\nCommodity investing focuses on physical resources, which include energy-related products like coal and crude oil. In addition to gaining direct\nexposure to commodities through futures contracts, alternative investment vehicles also invest in the companies that mine and refine those\nproducts.\nIn the oil and gas sector, companies are divided into three broad categories. Upstream companies explore for and extract the basic product,\nsuch as crude oil. Midstream companies refine the crude oil into gasoline, kerosene, and heating oil. Downstream companies create other\nproducts or services (eg, tires, retail gas stations) from the refined commodity.\nAn oil and gas sector hedge fund that focuses on midstream companies most likely invests in a gasoline refinery. A drilling company is an\nupstream company (Choice B), and a plastics manufacturer is an example of a downstream company (Choice C).\nThings to remember:\nCommodities investing includes alternative investment funds that focus on companies involved in the production of commodities. The oil and gas\nsector of energy commodities is divided into upstream, midstream, and downstream companies. Each category refers to where a company is\nlocated within the overall supply chain.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 77, "q": "Historical monthly changes in a country's consumer price index (CPI) have been negatively correlated with both global equity and global bond returns. To capture the potential benefits of these correlations in a diversified portfolio, an investor would most appropriately invest in which of the following?", "opts": ["Greenfield infrastructure project", "Fixed-income convertible arbitrage", "Broad-based commodity index fund"], "ans": "C", "expl": "Alternative investments refer to investments in nontraditional assets such as commodities, real estate, private equity, and hedge funds. The\nprimary motivation for adding alternative investments to a traditional portfolio is to improve the risk-reward profile since alternative assets generally\nhave relatively low correlations with traditional assets.\nCommodities offer attractive investment opportunities due to historically low correlations of their returns with traditional assets and for their\ninflation protection. Commodity indexes are viewed as particularly good inflation hedges since commodities directly (eg, food, energy prices) or\nindirectly (eg, housing costs) affect the underlying calculation of the inflation indexes [eg, consumer price index (CPI)]. Therefore, commodities\ngenerally have relatively high positive correlations with inflation measures and are considered one of the best alternatives for capturing and\nhedging against inflation trends.\n(Choice A) A greenfield investment is an infrastructure investment that has not yet been built. Infrastructure projects generally carry considerable\nproject-specific risk and return profiles. Although a direct infrastructure investment may provide diversification benefits, its return profile is unlikely\nto be correlated with consumer prices.\n(Choice B) Fixed-income convertible arbitrage attempts to profit from mispricing between the embedded equity option in a convertible bond and\nthe underlying common stock. This strategy relies on capturing short-term, event-driven pricing discrepancies and is unrelated to long-term\ninflation trends represented in a CPI.\nThings to remember:\nInvestors are attracted to commodities due to their historically low correlations of returns with traditional assets and for their inflation protection.\nCommodity indexes are viewed as particularly good inflation hedges since commodities directly or indirectly affect the underlying calculation of the\ninflation indexes [eg, consumer price index (CPI)] and therefore have relatively high positive correlations with inflation measures.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 78, "q": "Which of the following alternative investments is the least likely candidate to meet environmental, social, and governance (ESG) investing criteria?", "opts": ["Timberland", "Managed futures", "Greenfield renewables utility project"], "ans": "B", "expl": "Alternative investments overview\nMotivations for using Constraints of using\nExploit less efficient markets\nHigh fees\nLow correlations with traditional\nLow transparency, due diligence\ninvestments\nrequired\nDiversification benefits within\nLess regulatory investor protection\nalternatives\nPotential legal/tax consequences\nHigher expected returns\nUnderlying investments can be\nPositive absolute returns\nilliquid\nAlpha creation/superior risk-\nLockup/redemption restrictions\nadjusted returns\nAlternative investments are investments in nontraditional assets, such as hedge funds, private equity, infrastructure, and natural resources.\nAlternative investments typically operate in less efficient markets that provide investment managers with greater potential to exploit mispricing\nthrough active investment strategies.\nAn additional motivation for incorporating alternative investments in a portfolio is an ability to meet environmental, social, and governance (ESG)\ninvesting goals. For example, infrastructure investing has seen the adoption of frameworks such as the Equator Principles, which incorporate\nESG criteria for infrastructure projects, especially by global financial institutions that provide major infrastructure financing. Thus, a greenfield (ie,\nnew) renewables utility project (eg, wind, solar, water) would most likely be ESG compliant (Choice C).\nTimberland is also an obvious candidate to invest in to achieve ESG goals. Timber benefits from its positive environmental impact of\nabsorbing carbon dioxide (CO ) (ie, acting as a carbon sink), thus offsetting some carbon emissions (ie, air pollution). Combined with otherwise\n2\nattractive investment characteristics (eg, low correlations, competitive returns), timberland is often a preferred choice of ESG investors (Choice\nA).\nOutside of very limited circumstances (eg, minority-owned firm), which could be true for almost any investment, managed futures do not have\nwidespread application within ESG investing.\nThings to remember:\nFor investors seeking alternative investments, timberland and greenfield infrastructure stand out as likely candidates to achieve environmental,\nsocial, and governance (ESG) goals. Timber benefits from its positive environmental impact of absorbing carbon dioxide, thus offsetting some\nhuman-related carbon emissions. Greenfield infrastructure is also likely to adhere to ESG frameworks.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 79, "q": "An analyst has compiled the following spot and futures pricing data for a commodity: Which of the following best describes the commodity's spot and futures prices?", "opts": ["In contango", "In backwardation", "Having zero convenience yield"], "ans": "B", "expl": "Slope of the futures curve\nContango Backwardation\nFutures price > spot price Futures price < spot price\nMay result if May result if\nNo convenience yield or Convenience yield > storage costs\nConvenience yield < storage costs\nWhen a commodity's spot price is higher (lower) than its futures price, the futures curve is said to be in backwardation (contango). For most\ncommodities, under normal circumstances, contango is the typical forward pricing structure.\nIf an investor physically owns a commodity, the investor pays storage costs until the commodity is used or resold. An investor who owns a futures\ncontract incurs no storage costs until the futures contract matures. Storage costs are usually reflected in futures price to prevent the possibility of\narbitrage. Storage costs cause the commodity futures price to be higher than the spot price.\nThe convenience yield is the benefit the investor receives from currently owning the commodity (ie, its availability). Therefore, it is deducted from\nthe spot price. When the convenience yield is high and/or greater than the storage costs, the spot price may be higher than the futures price,\ncreating backwardation.\n(Choices A and C) When the spot price is lower than the underlying futures price, the contract is in contango. Contango can result when there is\nlittle to no (ie, zero) convenience yield to owning the commodity, often due to high storage costs.\nThings to remember:\nContango and backwardation are terms that describe the relative position of a futures price to the spot price of the underlying commodity. A\ncontract in backwardation has a spot price that is higher than the futures price. Backwardation is possible when the convenience yield is high\nand/or higher than the storage costs.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 80, "q": "An investor wishes to enhance the return from a series of long-only investments in commodity futures contracts by rolling each contract upon expiration. All else equal, the investor's best choice is a market where:", "opts": ["storage costs for the commodity are at historical peaks.", "sellers are paying buyers to take on exposure to the commodity.", "low inventories are causing market participants to hold the physical commodity."], "ans": "C", "expl": "Investors can gain exposure to commodities' price changes by either purchasing a physical commodity or using derivatives (eg, futures). A futures\ncontract may or may not be settled with delivery of the commodity. To maintain exposure, long-term commodity futures investors reestablish a\nposition in the next month's (or a later) contract.\nIf a near-month contract trades at a premium to more distant contracts, the futures curve is in backwardation. This occurs when inventories of\ncommodities are tight relative to current demand, such that market participants are willing to pay a premium for nearby deliveries or to buy in the\nspot market.\nIn a market that is in backwardation, the future expected spot price is lower than the current spot price. An investor enhances return by rolling\na position forward to a contract with a later expiration date since the cost of that later contract is less than the current spot price.\n(Choices A and B) Excess supply of a commodity results in low spot prices and increases the demand for storage, thus raising storage (ie,\ncarrying) costs. High carrying costs push futures prices to a higher level than spot prices (ie, the market is in contango). An investor who rolls an\nexpiring contract into a new position with a deferred expiration does so at a higher price, resulting in a loss on the roll.\nThings to remember:\nBackwardation allows investors to enhance the return for long-only commodity positions by rolling an expiring contract to a future-dated contract at\na lower price (and thus a lower cost) than the current spot, thus locking in a gain on the roll.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null}, {"n": 81, "q": "A hedge fund has investors from several different countries. The hedge fund's obligations with respect to providing country-specific tax reporting information to investors will most likely be addressed by the: ", "opts": ["side letter agreement.", "private placement memorandum.", "partnership operating agreement."], "ans": "A", "expl": "Common hedge fund documentation\nPrivate placement Marketing document that highlights the fund's\nmemorandum features and risks for potential investors\nAddresses legal and contractual relationship\nPartnership agreement\nbetween manager and investors\nAddresses additional legal, regulatory, tax, and\nSide letter agreement\nreporting requirements unique to specific investors\nA partnership agreement describes the contractual relationship between a hedge fund's manager (ie, general partner) and its investors (ie, limited\npartners). It often addresses matters such as investment strategy, fund structure, capital contribution, management fees, etc.\nFunds often use side letter agreements to address certain requirements (eg, legal, regulatory, tax) that are unique to specific investors. In\nthis scenario, the hedge fund would have a side letter agreement that addresses the requirements for investors with country-specific tax reporting\nneeds.\n(Choice B) A private placement memorandum is a marketing document provided to potential investors that highlights the standard financial\ninformation about the issuer, the purpose of the funds being raised, and other terms of investing in fund shares.\n(Choice C) A partnership operating agreement addresses the general relationship between the fund manager and the investors. It does not\naddress the special requirements unique to certain individual investors.\nThings to remember:\nFunds may use side letter agreements when they wish to address specific legal, regulatory, tax, operational, or reporting requirements. A\npartnership agreement dictates the general relationship between the fund manager and investors. A private placement memorandum is a\nmarketing document that highlights fund features and discloses risks to potential investors.\nDescribe investment forms and vehicles used in hedge fund investments", "qhtml": null}, {"n": 82, "q": "A hedge fund has consistently outperformed traditional index-based mutual funds and ETFs due to the fund manager's ability to identify undervalued stocks. This type of superior performance is most appropriately attributed to:", "opts": ["market beta.", "strategy beta.", "idiosyncratic risk."], "ans": "C", "expl": "Sources of return for traditional funds vs. hedge funds\nSignificance level: Traditional funds Hedge funds\nMost Market exposure (beta) Idiosyncratic risk exposure\n↕ Sector/style exposure Sector/style exposure\nLeast Idiosyncratic risk exposure Market exposure (beta)\nHedge fund managers attempt to generate risk-adjusted excess returns (ie, alpha) by maximizing idiosyncratic returns (ie, returns unique to\ninvested companies/securities) while simultaneously minimizing market exposure. Managers can generate idiosyncratic returns through\nidentifying mispriced securities, properly timing the market, and using leverage. In this scenario, the fund manager's stock selection skills\nprovided idiosyncratic returns unique to each undervalued company's stock.\n(Choice A) Hedge fund returns are not typically attributed to market beta since hedge funds seek to minimize exposure to market risks. Instead,\nhedge funds focus on exposure to idiosyncratic (ie, company-specific) risk.\n(Choice B) Strategy beta is attributed to the hedge fund's investment style (eg, fundamental growth, fundamental value, convertible arbitrage).\nThings to remember:\nHedge fund managers attempt to generate risk-adjusted excess returns by maximizing idiosyncratic returns (ie, returns unique to invested\ncompanies/securities) while simultaneously minimizing market exposure. Managers can generate idiosyncratic returns through identifying\nmispriced securities, properly timing the market, and using leverage.\nAnalyze sources of risk, return, and diversification among hedge fund investments", "qhtml": null}, {"n": 83, "q": "Theoretically, which of the following is the primary driver of hedge fund alpha?", "opts": ["Moderation of market risks", "Diversifying style/sector risks", "Exposure to idiosyncratic risks"], "ans": "C", "expl": "Sources of return for traditional funds vs. hedge funds\nSignificance level: Traditional funds Hedge funds\nMost Market exposure (beta) Idiosyncratic risk exposure\n↕ Sector/style exposure Sector/style exposure\nLeast Idiosyncratic risk exposure Market exposure (beta)\nHedge funds attempt to generate alpha primarily by optimizing idiosyncratic risk (ie, nonsystematic risk) exposure while minimizing market\nexposure, which is measured by beta. Managers can generate idiosyncratic returns through identifying mispriced securities, timing the market,\nand using leverage.\nIn contrast, traditional investment funds, especially index funds such as ETFs and mutual funds, typically mimic market returns by holding large\nsecurity portfolios that diversify away idiosyncratic risk. Therefore, traditional fund returns are primarily based on market risk exposure (ie, beta).\n(Choice A) The moderation of market risk is the least important source of alpha for hedge funds. Nullifying beta (ie, market risk) contributes the\nleast to a manager's pursuit of alpha.\n(Choice B) Diversifying away sector/style risks would simply insulate the portfolio from those sources of return, rather than serve as the primary\nsource of alpha. Hedge funds seek to diversify away market return risk, focusing instead on idiosyncratic returns (ie, returns unique to a security).\nThings to remember:\nHedge funds attempt to generate alpha primarily by optimizing idiosyncratic risk exposure (ie, returns unique to invested companies/securities)\nwhile minimizing market exposure, which is measured by beta. Managers can generate idiosyncratic returns through identifying mispriced\nsecurities, timing the market, and using leverage.\nAnalyze sources of risk, return, and diversification among hedge fund investments", "qhtml": null}, {"n": 84, "q": "A large accredited investor wishing to invest in a hedge fund that holds the underlying assets in the investor's name would most appropriately choose a(n):", "opts": ["fund of one.", "master-feeder structure.", "separately managed account."], "ans": "C", "expl": "Hedge funds: forms of direct investment\nMost common fund form\nPooled investment vehicles\nMaster-feeder structure\nConsists of an offshore feeder fund and an onshore feeder\nfund that funnel capital into a master investment fund\nSuitable for large institutional or accredited investors\nFund of one Separate investment account created for an investor\nUnderlying assets held and registered in fund's name\nSuitable for large institutional or accredited investors\nSeparately managed\nSeparate investment account created for an investor\naccount (SMA)\nUnderlying assets held and registered in investor's name\nA hedge fund is generally a private pool investment vehicle funded by capital from multiple accredited investors (eg, institutions, high-net-worth\nindividuals). A general partner manages the fund's day-to-day operations and operates within guidelines set by the partnership agreement. Most\nhedge funds are formed with a master-feeder structure comprised of both onshore and offshore accounts that funnel capital to a master fund.\nLarger accredited investors enjoy exclusive access to individually managed accounts (instead of commingled funds accounts) through a\nseparately managed account (SMA) or a \"fund of one.\" In a SMA, the invested assets are held and registered under the investor's name while\nthe hedge fund manager manages the account.\n(Choice A) In a fund of one, a hedge fund is created specifically for a single investor and follows that investor's mandates, but the assets are\nregistered under the fund's name, instead of in the investor's name.\n(Choice B) A master-feeder structure is used to funnel investment funds to hedge fund management to invest in pooled investment vehicles. This\nstructure is not used to fund individually managed accounts.\nThings to remember:\nLarger institutional or accredited hedge fund investors may enjoy exclusive access to individually managed accounts instead of commingled funds\naccounts. In a separately managed account, the invested assets are held and registered under the investor's name while the hedge fund manager\nmanages the account. In a fund of one, a hedge fund is created specifically for a single investor and follows that investor's mandates, but the\nassets are registered under the fund's name.\nDescribe investment forms and vehicles used in hedge fund investments", "qhtml": null}, {"n": 85, "q": "A hedge fund is subject to a margin call and is unable to post additional collateral. The most likely outcome is that the:", "opts": ["lockup period allows for an orderly liquidation.", "prime broker realizes a loss on the margin loan.", "margin call magnifies the losses for the hedge fund."], "ans": "C", "expl": "Alternative investment managers commonly use leverage to successfully implement investment strategies. Hedge funds borrow from a prime\nbroker to finance trades using the initial margin requirements.\nThe prime broker protects its capital by imposing a maintenance margin requirement that specifies the minimum equity percentage (eg, 30%) that\nmust be maintained. If the equity value drops below the minimum, a margin call is issued, and the investor (ie, hedge fund) must contribute\nadditional equity. If the hedge fund is unable or unwilling to contribute additional cash or collateral, the prime broker sells the entire position to\nrecoup the loan and prevent losses to the firm.\nWhen the position is closed by the prime broker, losses on the position are \"locked in\" by a forced liquidation. Due to the abrupt and\nimmediate nature of a forced liquidation, closing the position can negatively impact the security; as the prime broker liquidates its position, the\nprice may fall significantly, further magnifying losses for the hedge fund.\n(Choice A) A lockup period restricts withdrawals by investors for a certain period of time after they invest. Lockups allow for an orderly liquidation\nof positions due to investor redemptions, not a forced liquidation due to a margin call.\n(Choice B) The prime broker implements the margin call to avoid suffering losses on its loan to the hedge fund.\nThings to remember:\nIf a hedge fund is unable or unwilling to contribute additional cash or collateral to a margin call, the forced liquidation leads to \"locked-in\" and often\nmagnified losses.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 86, "q": "A hedge fund that is most likely to use a top-down approach to identify investments is a:", "opts": ["macro fund.", "distressed investing fund.", "convertible arbitrage fund."], "ans": "A", "expl": "Hedge fund strategies and characteristics\nCategory Characteristics\nCapitalize on short-term corporate events (eg, mergers)\nEvent-driven strategies Company-level analysis (ie, \"bottom-up\")\nUse long and short strategies\nExploit short-term pricing discrepancies of related securities\nRelative value strategies\nMost common example is convertible arbitrage\nIdentify long-term economic trends (ie, \"big picture\")\nMacro funds Industry-level analysis (ie, \"top-down\")\nTake long and short positions\nFocus on publicly traded common stock\nEquity hedge funds \"Bottom-up\" analysis\nTake long and short positions to hedge unwanted risk\nMacro hedge funds focus on investment opportunities based on economic trends. Their expertise is to recognize the early signs of how one or\nmore markets are likely to move, and then use different strategies to exploit the movement. In general, macro funds focus on an entire industry or\nsector rather than specific companies, so they employ a top-down approach to evaluating investment opportunities.\n(Choice B) A distressed investing fund is a type of event-driven fund. These funds purchase debt of a company experiencing severe financial\ndifficulties. The debt is priced at a significant discount, and the fund profits if the company can successfully restructure so that the value of its debt\nincreases.\n(Choice C) A convertible arbitrage fund attempts to profit from perceived mispricing between a convertible bond and the underlying common\nstock. In efficient markets, the relative mispricing exists for a very short time, as supply and demand will cause any arbitrage opportunities to\nquickly disappear.\nThings to remember:\nHedge funds use several different investment strategies. Most strategies are based on short-term situations, such as mergers or arbitrage\nopportunities involving related securities. Macro funds invest to profit from economic or market trends, and those investment strategies tend to be\nmore long term.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 87, "q": "Which of the following best describes an advantage of investing in a fund of hedge funds over an individual hedge fund? A fund of hedge funds:", "opts": ["can have less restrictive redemption terms.", "typically has a more simplified fee structure.", "provides higher returns by shorting underperforming hedge funds."], "ans": "A", "expl": "Fund of hedge fund advantages and disadvantages\nLess investor due diligence required\nImproved accessibility\nAdvantages\nBetter redemption terms\nMore diversified\nMore complex\nDisadvantages\nMore expensive\nA fund of hedge funds (aka a fund of funds) is a fund that invests in multiple hedge funds. This creates a diversified portfolio of hedge funds\nthat potentially spans multiple strategies or geographic areas. A fund of hedge funds' returns are generated by the underlying individual hedge\nfunds.\nFund of funds managers are assumed to have expertise in conducting due diligence on the funds they invest in, saving investors the time and\nresources of doing due diligence on the multiple funds themselves.\nIn addition, fund managers may have better relationships or more leverage than individual investors with the hedge funds in which they invest.\nThis would provide individual investors potential benefits otherwise unavailable to them, including better redemption terms. For instance,\nindividual hedge funds may impose redemption terms, which include lockup periods (ie, notice periods before withdrawals can be made) and\nredemption fees.\n(Choice B) Funds of funds investors typically pay a management fee and may pay an incentive fee to the fund manager. Any fees charged by\nthe individual hedge funds are also passed through to the investors by the fund of funds. This makes funds of funds' fee structure more complex\nand more expensive than those for individual hedge funds.\n(Choice C) Since funds of funds managers purchase and redeem their investments directly from hedge funds and not on the open market, the\nfunds cannot be borrowed and shorted.\nThings to remember:\nFunds of hedge funds (also known as funds of funds) create a portfolio of hedge funds for investors. They can provide several advantages over\nindividual hedge fund investments, including the potential to negotiate better redemption terms than individual investors receive. However, the\nfunds of funds' fee structure is more complex and more expensive than those for individual hedge funds.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 88, "q": "A retail investor who wishes to obtain hedge fund exposure by diversifying across strategies and managers would most appropriately choose to invest in a(n): ", "opts": ["fund of funds (FoF).", "multi-strategy hedge fund.", "managed futures account (MFA)."], "ans": "A", "expl": "Advantages of hedge fund investing through a fund of funds (FoF)\nAdvantage Rationale\nBetter diversification One investment gains exposure to multiple funds\nEnhanced FoF managers presumably offer better due diligence of\nmanagement potential funds\nSome hedge funds are closed to direct investment, but may\nAccess\nbe accessible through FoF\nMinimum investment May offer lower initial investment\nEnhanced redemption FoF may have preferred status with respect to redemptions\nability from underlying hedge funds\nA hedge fund is a private pooled investment vehicle defined by its investment strategy (eg, long/short, merger arbitrage, convertible bond\narbitrage). Many hedge funds utilize leverage, short selling, and/or exotic instruments coupled with complex strategies to enhance returns. Due to\ntheir complex nature and lack of regulation, hedge funds are directly available only to accredited investors (eg, institutions, high-net-worth\nindividuals).\nHowever, retail investors can still gain indirect exposure to hedge funds by investing in a fund of funds (FoF): a fund that invests in multiple\nunderlying hedge funds. This structure allows for greater public access and improves diversification.\nThe main disadvantage to the FoF approach is a higher fee structure. The FoF's return is reduced by the fees imposed by each of the underlying\nhedge funds. In addition, the FoF itself charges both a fee on assets under management and an incentive fee, so the investor's return is reduced\nby two layers of fees.\n(Choice B) A multi-strategy hedge fund deploys relative value strategies across asset classes and instruments. However, a multi-strategy hedge\nfund is still restricted to accredited investors.\n(Choice C) A managed futures account (MFA) may provide higher returns, as well as diversification within assets that utilize futures. However,\nthese benefits are not across a broad spectrum of potential hedge fund investments.\nThings to remember:\nRetail investors can gain indirect exposure to hedge funds by investing in a fund of funds (FoF): a fund that invests in multiple underlying hedge\nfunds. This structure allows retail investors access to hedge fund strategies with improved diversification. The main disadvantage to the FoF\napproach is a higher fee structure.\nDescribe investment forms and vehicles used in hedge fund investments", "qhtml": null}, {"n": 89, "q": "Which of the following hedge fund strategies is least likely to use short selling?", "opts": ["Activist", "Market-neutral", "Merger arbitrage"], "ans": "A", "expl": "Select hedge fund categories and strategies\nStrategy name Common strategy description\nMarket neutral Long/short to neutralize market risk\nEquity hedge Fundamental growth Fundamental analysis to identify high growth stocks\nQuantitative directional Technical analysis to identify over/undervalued stocks\nFixed income general Long/short to identify relative value discrepancies\nRelative value\nVolatility Buy/sell options to long/short market volatility\nMerger arbitrage Purchase target while selling acquirer\nEvent-driven\nActivist Purchase equity to influence company decisions\nMacro Macro Top-down approach to identify economic trends\nHedge funds are aggressively managed pooled investment vehicles. Their returns and risk are often elevated with leverage, derivates, and short\nselling. Different hedge fund strategies focus on different areas of the market and take on different types of risk.\nActivist shareholder (ie, activist) strategies are event-driven strategies that focus on influencing a company's strategic direction or decision-\nmaking (eg, divestitures, capital distributions). Activists may also seek to add members to the company's board of directors or to replace part of\nthe company's executive management team.\nSince activists seek influence, their primary strategy is to purchase a company's common shares until they become one of its largest\nshareholders. Short selling is not likely to be a part of this strategy. Activist strategies can be especially effective if activists are able to enlist other\nshareholders in their cause.\n(Choice B) Short selling is an important part of market-neutral hedge fund strategies, which aim to identify and purchase undervalued securities\nwhile simultaneously short selling overvalued securities to remain neutral with regard to market risk.\n(Choice C) Short selling is an important part of merger arbitrage hedge fund strategies. Such strategies aim to profit from the deal spread of an\nannounced merger, typically by purchasing the stock of the target company while simultaneously short selling the stock of the acquiring company.\nThings to remember:\nActivist hedge funds focus on acquiring large portions of a company's equity to affect the company's strategic direction or decision-making. For\nthis reason, an activist primarily purchases common shares with the aim of becoming one of the company's largest shareholders. This strategy is\nnot likely to include short selling.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 90, "q": "At the time of a merger announcement, a hedge fund manager purchases stock of the target company and shorts the stock of the acquirer. Which type of hedge fund strategy best characterizes this approach?", "opts": ["Macro", "Event-driven", "Relative-value"], "ans": "B", "expl": "Hedge fund strategies and characteristics\nCategory Characteristics\nCapitalize on short-term corporate events (eg, mergers)\nEvent-driven strategies Company-level analysis (ie, \"bottom-up\")\nUse long and short strategies\nExploit short-term pricing discrepancies of related securities\nRelative value strategies\nMost common example is convertible arbitrage\nIdentify long-term economic trends (ie, \"big picture\")\nMacro funds Industry-level analysis (ie, \"top-down\")\nTake long and short positions\nFocus on publicly traded common stock\nEquity hedge funds \"Bottom-up\" analysis\nTake long and short positions to hedge unwanted risk\nHedge funds are pooled investment vehicles that pursue high returns by engaging in strategies that may be high risk. They can be categorized by\nthe types of assets they invest in or by their strategy. Hedge funds pursuing event-driven strategies seek profits from stock price changes\nrelated to an event that affects specific companies. Merger arbitrage hedge funds are categorized as event-driven strategies.\nIn a merger, frequently the market perceives that the acquiring company overpays. This often results in the acquirer's stock price decreasing while\nthe price of the target company increases. Merger arbitrage funds try to exploit this by buying (ie, go long) the stock of the target and selling (ie,\ngo short) the stock of the acquiring company.\n(Choice A) Macro hedge funds focus on opportunities based on economic trends, not on events that affect specific companies. In general, macro\nfunds focus on an entire industry or sector rather than on specific companies (ie, employing a top-down evaluation approach).\n(Choice C) Relative-value strategies seek to exploit short-term pricing discrepancies between related securities. The price discrepancies are\nexpected to resolve within a short time frame. For example, fixed-income convertible arbitrage strategies may involve simultaneously buying\nconvertible stock and selling common stock for the same company.\nThings to remember:\nEvent-driven hedge fund strategy managers pursue profits from stock price changes related to an event (eg, a merger announcement) that affects\nspecific companies.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 91, "q": "Which of the following is most likely a direct form of hedge fund investment?", "opts": ["Fund of hedge funds", "Master feeder structure", "Hedge fund replication ETFs"], "ans": "B", "expl": "Forms of hedge fund investments\nDirect forms Indirect forms\nMaster feeder structure Fund of hedge funds\nSeparately managed accounts Hedge fund replication ETFs\nHedge funds are commonly established as privately managed investment partnerships, either onshore or in offshore locations. These funds\naccept investments from individuals who meet specific criteria related to their income and/or overall financial worth.\nHedge fund investments can be direct or indirect. The most common direct form is a master feeder structure, which allows eligible investors to\ninvest through either an onshore or offshore feeder fund to optimize tax advantages. The feeder funds feed into a master fund that then invests\nthe capital.\nAnother example of direct investing is the separately managed account (SMA). SMAs are personalized investment portfolios tailored to meet\ninvestors' specific requirements. They are particularly suitable for larger institutional investors.\nIndirect investments, such as a fund of hedge funds or a hedge fund replication ETF, are better suited for smaller investors who have limited\nresources and expertise (Choices A and C). The advantages of an indirect arrangement for smaller investors include reduced management fees\nand increased performance transparency and liquidity.\nA fund of hedge funds is a professionally managed investment portfolio that consists of multiple hedge funds. Hedge fund replication ETFs seek\nto replicate the investment styles of hedge funds using liquid assets, either through indexing or active management. Their goal is to mimic the\nreturns of established hedge fund strategies, such as long/short equity, market neutral, and event-driven approaches.\nThings to remember:\nDirect forms of hedge fund investment, such as a master feeder structure or separately managed account (SMA), allow eligible investors to invest\nthrough either an onshore or offshore feeder fund to optimize tax advantages. The feeder investments funnel into a master fund that invests the\ncapital.\nDescribe investment forms and vehicles used in hedge fund investments", "qhtml": null}, {"n": 92, "q": "Compared with an individual hedge fund, a fund of funds will more likely:", "opts": ["have a simpler fee structure.", "offer less restrictive redemption terms.", "be used by large investors to attain hedge fund exposure."], "ans": "B", "expl": "Fund of hedge fund advantages and disadvantages\nLess investor due diligence required\nImproved accessibility\nAdvantages\nBetter redemption terms\nMore diversified\nMore complex\nDisadvantages\nMore expensive\nA fund of hedge funds (ie, fund of funds [FoF]) is a fund that invests in multiple hedge funds. This creates a portfolio of hedge funds that can\nspan multiple strategies or geographic markets.\nFoF managers provide individual investors with potential benefits, including better redemption terms. FoFs can negotiate the terms directly with\nhedge funds; such negotiations are usually beyond the ability of individual investors.\n(Choice A) FoF investors typically pay a management fee and sometimes an incentive fee to the FoF manager. In addition, individual hedge fund\nfees flow to the investor via the FoF. This makes FoFs more complex and expensive in their fee structure than individual funds.\n(Choice C) Large investors (eg, high-net-worth individuals, institutional investors) rely less on FoFs since they have direct access to individual\nhedge funds. Smaller investors often cannot meet the minimum capital requirements of hedge funds, so the FoF structure is sometimes the only\nway they can obtain hedge fund exposure.\nThings to remember:\nFunds of hedge funds (ie, funds of funds [FoF]) provide a portfolio of hedge funds for investors. FoFs offer several advantages over individual\nhedge funds, including the ability of FoF managers to negotiate better redemption terms for their clients. However, FoFs typically have more\nexpensive and complex fee structures than individual hedge funds.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 93, "q": "Compared to investing in a single hedge fund, which of the following is most likely an advantage of investing in a fund-of-funds?", "opts": ["Greater tax efficiency", "Avoiding the double fee structure", "Resources to better perform due diligence"], "ans": "C", "expl": "Fund-of-funds vs. single hedge fund\nDiversification\nInvestment expertise\nAdvantages Due diligence expertise\nLower investment minimums\nEnhanced redemption ability\nDisadvantage Additional layer of fees to overcome\nA fund-of-funds (FOF) is an alternative investment vehicle that invests in multiple underlying hedge funds. The main advantages of an FOF\nare as follows:\nDiversification: Risk is spread out over numerous hedge fund investment strategies.\nInvestment expertise: Similar to a traditional fund manager, portfolio holdings (ie, hedge funds) are constantly evaluated.\nDue diligence expertise: FOFs conduct extensive due diligence, evaluating underlying investment strategies, processes, and operational\ndetails.\nLower minimum investment: A single investment in an FOF accesses numerous underlying funds. If invested individually with each\nhedge fund, each fund has its own minimum, requiring significantly more capital.\nEnhanced redemption ability: FOFs can often negotiate better redemption terms, shortening lockups or redemption periods.\nThe main disadvantage of the FOF approach is the two layers of fees imposed on investors (Choice B). The FOF charges a fee on assets under\nmanagement and an incentive fee, in addition to the underlying hedge fund fees that are passed through to the investor by the FOF manager.\n(Choice A) FOFs are not known for their tax efficiency. They have a reputation for being \"fast\" money, quickly redeeming from underlying funds\nat any signs of underperformance, creating taxable events.\nThings to remember:\nThe main benefits of a fund-of-funds (FOF) structure include due diligence expertise, diversification, a lower minimum investment, preferred\nredemption status, and access to funds that would otherwise be closed to new investors. The main disadvantage is that the FOF approach\nimposes two layers of fees.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 94, "q": "A wealthy investor is considering a sizable investment in either a hedge fund or a fund-of-funds. From the investor's perspective, the fund-of- funds is least likely to offer the benefit of:", "opts": ["less risk.", "a lower fee structure.", "enhanced due diligence."], "ans": "B", "expl": "Advantages of hedge fund investing through a fund of funds (FoF)\nAdvantage Rationale\nBetter diversification One investment gains exposure to multiple funds\nEnhanced FoF managers presumably offer better due diligence of\nmanagement potential funds\nSome hedge funds are closed to direct investment, but may\nAccess\nbe accessible through FoF\nMinimum investment May offer lower initial investment\nEnhanced redemption FoF may have preferred status with respect to redemptions\nability from underlying hedge funds\nA fund-of-funds is an alternative investment vehicle that invests in multiple underlying hedge funds. This type of investment affords an investor\ndiversification among different hedge funds through a single investment. Other advantages include enhanced due diligence and potential access\nto funds that are otherwise closed to direct investment (Choice C).\nThe main disadvantage to the fund-of-funds approach is a higher fee structure. The fund-of-funds return is reduced by the fees imposed by\neach of the underlying investments. In addition, the fund-of-funds itself charges both a fee on assets under management and an incentive fee, so\nthe investor's return is reduced by two layers of fees.\n(Choice A) The added diversification from exposure to multiple underlying hedge funds reduces the investor's risk. This is an advantage of the\nfund-of-funds structure.\nThings to remember:\nA fund-of-funds invests in multiple hedge funds. Investors benefit from this structure through increased due diligence, more diversification, lower\ninitial investment, preferred redemption status, and access to funds that would otherwise be closed for new investment. The main disadvantage to\nthe fund-of-funds approach is that it imposes two layers of fees on the investment, which diminishes the investor's return relative to investment in a\nsingle fund.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 95, "q": "A recently launched hedge fund that is subject to a prime broker's margin call will most likely benefit from a:", "opts": ["drawdown.", "lockup period.", "committed capital drawdown."], "ans": "B", "expl": "Hedge fund investor redemption restrictions\nMinimum time an investor is committed to the\nLockup period fund before withdrawals are allowed\nUsually less than 2 years\nRequires investor to notify the fund of\nRedemption notice period planned redemption\nUsually 30−90 days\nHedge funds commonly use leverage to implement investment strategies by borrowing from a prime broker. If the equity value of the account\ndrops below a minimum level, a margin call is issued. The fund is then forced to reduce its leverage, usually by liquidating existing positions.\nMargin calls can magnify losses for a hedge fund since the forced liquidation creates a negative feedback loop: the selling forced by the margin\ncall drives the price down even more, leading to investor redemptions, which force more selling, etc.\nRedemption notices and lockup periods help protect a hedge fund from investor redemptions that would further worsen its position. In this\nscenario, most if not all investors in the recently launched hedge fund will be subject to a lockup period, restricting withdrawals immediately\nfollowing their initial investments.\n(Choice A) A drawdown is a reduction in a hedge fund's net asset value below the high-water mark, not a helpful development during a margin\ncall.\n(Choice C) Committed capital refers to an amount the limited partners in a private equity (PE) fund (ie, not a hedge fund), agree to provide the\nfund upon request to finance a new investment. The PE fund will draw down this capital commitment, usually over 3 to 5 years.\nThings to remember:\nA hedge fund benefits from a lockup period, which restricts investor withdrawals for a period of time immediately following an initial investment. If\nthe hedge fund receives a margin call and must sell off positions to satisfy the margin, the lockup period protects the fund from further losses.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null}, {"n": 96, "q": "Decentralized finance (DeFi) is most likely explored in order to:", "opts": ["reform financial regulations.", "function as a medium of exchange.", "deleverage investment risk in digital assets."], "ans": "B", "expl": "Decentralized finance (DeFi) has emerged to meet the demand for decentralized financial applications (dApps), which allow financial\ntransactions to occur without a central system. dApps manage financial tasks on the blockchain, such as serving as a medium of exchange, a\nstore of value, a way to tokenize underlying assets, and a means to record ownership and transfer of digital assets. They also allow for the\ncreation of decentralized financial products and services covering lending, trading, investment, settlement, payments, and transfers.\n(Choice A) DeFi is not intended to reform financial regulations. Instead, it has emerged due to the need for decentralized financial applications\nthat handle financial tasks on the blockchain.\n(Choice C) While DeFi offers certain technological advantages over the traditional finance system, such as saving time and reducing risk in\nsettlements and asset transfers, it has not reached its full potential yet. Up to this point, DeFi applications have primarily been used for investors\nseeking leverage in their investments and speculating with digital assets.\nThings to remember:\nDecentralized finance (DeFi) has emerged to meet the demand for decentralized financial applications, which allow financial transactions to occur\nwithout a central system. These applications manage financial tasks on the blockchain, such as serving as a medium of exchange, a store of\nvalue, a way to tokenize underlying assets, and an immutable record of ownership and transfer. While DeFi presents certain technological\nadvantages over the traditional finance system, it has not yet reached full development.\nDescribe investment forms and vehicles used in digital asset investments", "qhtml": null}, {"n": 97, "q": "Which of the following consensus protocols most likely requires solving puzzles using large amounts of computing power?", "opts": ["Tokenization", "Proof of work", "Proof of stake"], "ans": "B", "expl": "Consensus protocols: proof of work and proof of stake\nProof of work Proof of stake\nValidation Miners validate transactions by solving algorithm puzzles \"Stakers\" guarantee transactions\nPledged stake of holdings in\nValidation requirements Massive amounts of computing power\nblockchain\nProtection from Computing power requirements protect against third-party\n\"Stakers\" protect access\nmanipulation manipulation\nBlockchains are digital ledgers where transaction information is recorded in a series of linked \"blocks\" using a consensus protocol to verify and\nlink the blocks and thus establish an unchangeable \"truth.\" Two primary types of consensus protocols are the proof of work (PoW) and proof of\nstake (PoS) mechanisms.\nPoW protocols require crypto miners to solve complex cryptographic puzzles, a process that consumes large amounts of computing power to\nearn cryptocurrency as a reward. The large expenditure of time, computing power, and energy is intended to make the cost of fraud greater than\nits potential rewards.\nPoS protocols have individual validators pledge or lock up some of their holdings as a \"stake\" to earn the opportunity to validate and guarantee the\naccuracy of newly added information (Choice C). The \"stakers\" are assumed to control and protect the blockchain.\n(Choice A) Tokenization is the process of validating ownership rights to a portion of a blockchain or a distributed ledger. It is one of the\napplications of distributed ledger technology (DLT) to the financial services and investment management industry.\nThings to remember:\nProof of work is one of the primary types of blockchain consensus protocols; it requires large amounts of computing power, which makes the cost\nof fraud greater than its potential rewards. Proof of stake protocols require validators to pledge holdings and then guarantee the accuracy of newly\nadded information, thereby protecting the integrity of the blockchain.\nDescribe investment forms and vehicles used in digital asset investments", "qhtml": null}, {"n": 98, "q": "Digital assets most likely derive value from which of the following?", "opts": ["Liquidity", "Asset appreciation", "Expected cash flows"], "ans": "B", "expl": "Digital vs. traditional assets\nDigital assets Traditional financial assets\nSupply and demand\nSupply and demand\nBasis for inherent Potential to transfer value in future; asset\nPotential to transfer value in future;\nvalue appreciation\nasset appreciation\nExpected future cash flows\nRecords kept in decentralized digital\nledgers enabled by cryptography and Records kept in private ledgers maintained\nValidating transactions\nenhanced algorithms in permissioned by central intermediaries\nor permissionless networks\nMedium of exchange Cryptocurrencies Fiat currency\nLegal and regulatory Ambiguous and evolving regulatory framework with\nWell-defined regulation across jurisdictions\nprotection inconsistencies across jurisdictions\nTraditional financial assets (eg, stocks, bonds) have fundamental values that are primarily determined by expected future cash flows. This\nfundamental value theoretically serves as a basis for an asset's price.\nUnlike traditional investments, digital assets (eg, cryptocurrencies, tokens) have no fundamental values since they are not expected to generate\nfuture cash flows (Choice C). Instead, digital assets derive their values purely from the market's expectations of future price appreciation\nand the potential to realize gains in the future.\n(Choice A) Given their very limited acceptance in conventional financial markets, digital assets are relatively illiquid; thus, liquidity is not a source
