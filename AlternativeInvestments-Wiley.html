edge funds in which it invests assess fees that reduce investor\nreturns. The fees of the portfolio hedge funds are already reflected in the fund of funds' valuation and therefore not a separate factor when\ncalculating its performance.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 30, "q": "For performance appraisal of alternative investments, one advantage of using the IRR instead of the multiple of invested capital (MOIC) is that the IRR:", "opts": ["is perceived as more intuitive.", "has a more straightforward calculation.", "considers the timing of cash flow decisions."], "ans": "C", "expl": "Some types of alternative investments (ie, private equity or real estate) have variable cash flows in which investors often experience low or\nnegative cash flows early in the investment, with cash flows eventually turning positive. Ideally, measuring returns capture both the amount and\nthe timing of cash flows.\nIRR is the primary measure used to assess investments with variable cash flows. The IRR calculation considers the timing of an investment's\ncash flows and its overall time frame, as well as the opportunity cost of the capital committed to an investment.\nThe multiple of invested capital (MOIC) (ie, money multiple) is a ratio of total value of all residual asset values and distributions to the initial\ninvestment; thus, it is expressed as a multiple of the initial investment. This is viewed as a shortcut method that does not consider the\ninvestment time frame.\nIRR's main advantage over MOIC is that it accounts for how cash flow timing affects returns. IRR also has two key disadvantages:\nIt is less intuitive than MOIC: MOIC illustrates how much an investor has received relative to the amount initially invested (Choice A).\nIRR is more complicated to calculate: MOIC is simply a multiple at a point in time and ignores effects from the timing of cash flows; IRR\nrelies on assumptions about financing and reinvestment rates (Choice B).\nThings to remember:\nPrivate equity and real estate investments tend to have variable cash flows and therefore are measured using tools that are suited for cash flow\nvariability. IRR is the primary measure used since it accounts for both cash flow timing and amount. However, investors also rely on other\nmeasures (such as the multiple of invested capital) that are more intuitive.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 31, "q": "When evaluating the portfolio risk of an alternative investment with a leptokurtic return profile, which of the following is the most appropriate measure to capture drawdown risk? ", "opts": ["Calmar ratio", "Sharpe ratio", "Treynor ratio"], "ans": "A", "expl": "Alternative investments (eg, hedge funds, private equity) often have non-normal, leptokurtic return distributions (ie, a taller peak and fatter tails\nthan a normal distribution), so risk measures based on a normal distribution, such as the Sharpe ratio, are not appropriate for evaluating those\ninvestments' risk (Choice B).\nThe Calmar ratio takes a commonsense approach to measuring portfolio risk, focusing on drawdown risk. It is the ratio of the most recent\nthree-year annualized returns relative to the peak-to-trough observed loss (ie, maximum drawdown) over the same time. Since it does not use\nthe standard deviation as a measure of risk, it can be applied to investments that are not normally distributed. The advantage of the Calmar ratio\nis its observational and calculational simplicity.\n(Choice C) The Treynor ratio measures excess return relative to the portfolio's beta (versus a market index). The Treynor ratio is a relative\nmeasure, not an absolute measure that measures drawdown risk.\nThings to remember:\nThe Calmar ratio takes a commonsense approach to measuring portfolio risk, focusing on drawdown risk, and is not subject to a normal\ndistribution constraint. The Calmar ratio uses the most recent three-year annualized returns relative to maximum drawdown over the same time.\nThe advantage of the Calmar ratio is its observational and calculational simplicity.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 32, "q": "The high-water mark used for incentive fee calculation is most likely based on a fund's:", "opts": ["net assets.", "hurdle rate.", "gross assets."], "ans": "A", "expl": "Hedge funds charge performance-based incentive fees, subject to certain constraints, on investors' assets. One constraint is a high-water mark\n(HWM), the base asset value that is used to calculate the incentive fee:\nThe HWM is the fund's previous peak value of assets under management (AUM) that has earned an incentive fee.\nIt is calculated net of fees, so that all fees and expenses are deducted from the fund's assets before determining the HWM and investors do\nnot pay the incentive fee for those costs (Choice C).\nAn HWM protects investors by preventing the hedge fund from collecting an incentive fee twice for the same performance. For example, in the\nimage above, the fund reached an HWM in Year 2. After a significant decline in Year 3, the fund had a positive performance in Year 4. The fund\nmight have been eligible for an incentive fee in Year 4 had it not already collected an incentive fee on that same value of assets (ie, same\nperformance) in Year 2. The fund may earn an incentive fee in Year 5 since its performance surpasses the HWM set in Year 2.\n(Choice B) A hurdle rate is the minimum total return, either net or gross of management fees, that a fund must earn before it receives an incentive\nfee.\nThings to remember:\nA high-water mark (HWM), the base asset value that is used to calculate the incentive fee, is defined as the fund's previous peak value of assets\nunder management that has earned an incentive fee. HWMs are always calculated net of fees, so that all fees and expenses are deducted from\nthe fund's assets before determining the HWM.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 33, "q": "An analyst using the Sortino ratio to evaluate an alternative investment is most likely interested in the investment's:", "opts": ["total risk.", "downside risk.", "systematic risk."], "ans": "B", "expl": "Alternative investments (eg, hedge funds) often have nonnormal return distributions. The distributions may be negatively skewed or leptokurtic,\nboth of which indicate the investments have a greater probability of negative returns than implied by a normal distribution.\nStandard deviation, the basis of many risk-adjusted return measures (eg, Sharpe ratio), is based on a normal distribution of returns. Given the\nnature of standard deviation, downside (eg, very large negative returns) and upside (eg, very large positive returns) volatility are treated equally in\nassessing risk.\nIn contrast, the Sortino ratio measures return relative to downside deviation and incorporates only returns below a minimum return\nthreshold (eg, risk-free rate, zero) in the risk calculation; in effect, returns below the threshold are the only returns that constitute risk. This ratio is\ntherefore a more appropriate measure of downside risk. The Sortino ratio can be used as a comparative tool; the investment with the higher\nratio is preferred since it is generating more return per downside risk (ie, unfavorable volatility).\n(Choice A) Return relative to total risk is best reflected by the Sharpe ratio, not the Sortino ratio. The Sharpe ratio captures both upside and\ndownside volatility by using the standard deviation as a risk measure.\n(Choice C) Return relative to systematic risk is best reflected by the Treynor ratio, not the Sortino ratio. The Treynor ratio uses beta, a measure\nof systematic risk, as its risk measure.\nThings to remember:\nThe Sortino ratio measures return relative to downside deviation, which penalizes only returns below a minimum return threshold and is therefore\nan appropriate measure of downside risk. Many alternative investments have nonnormal return distributions, making the Sortino ratio an effective\ntool in evaluating the risk of these investments.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 34, "q": "A fund of funds (FoF) has a \"1 and 10\" fee structure, with all fees calculated independently at year end. At the beginning of the year, the FoF has €150 million equally allocated among three hedge funds. For the year, the hedge fund's' returns are −2%, 10%, and 16%. If the FoF has a high-water mark of €152 million, the total fee paid to the FoF is closest to:", "opts": ["€2.46 million.", "€2.50 million.", "€2.62 million."], "ans": "C", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nA fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often levy both a management fee and an incentive fee.\nThe management fee is calculated as a percentage of the fund's end-of-period assets under management (AUM) and is assessed\nregardless of profitability.\nThe incentive fee is calculated as a percentage of profits either gross (ie, before deduction) or net (ie, after deduction) of management\nfees.\nIf fees are calculated independently, calculations are on a gross basis.\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or the AUM being above a high-water mark (HWM), which is\nthe base asset value used to calculate the incentive fee. The HWM represents the fund's previous peak AUM value that has already earned an\nincentive fee.\nThe FoF's fees and return are calculated (with year-end values and fees in € millions) as follows:\nSteps Calculations\nCalculate the FoF's year-end asset value 49 + 55 + 58 = 162\nCalculate management fee 162 × 0.01 = 1.62\nCalculate HWM-adjusted incentive fee base 162 − 152 = 10.0\nCalculate incentive fee 10.0 × 0.10 = 1.00\nTotal fee paid to FoF 1.62 + 1.00 = 2.62\nIn this scenario, the total fee paid to the FoF is €2.62 million.\n(Choice A) A total fee of €2.46 million results from calculating the incentive fee on a net basis.\n(Choice B) A total of €2.50 million results from inappropriately using beginning AUM to calculate the management fee.\nThings to remember:\nA fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often levy both a management fee and an incentive fee.\nInvestors incur fees from the FoF and its underlying hedge funds.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 35, "q": "At the beginning of the year, a new fund of funds invests £300 million equally among three hedge funds. The fund of funds has a \"1 and 10\" fee structure and a 5% soft hurdle rate. Management and incentive fees are calculated independently at year end. After one year, the returns of the underlying hedge funds, gross of fees, are −2%, 6%, and 10%. The total fees paid to the fund of funds is closest to:", "opts": ["£3.14 million.", "£4.54 million.", "£4.74 million."], "ans": "A", "expl": "A fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often levy both a management fee and an incentive fee.\nThe management fee is calculated as a percentage of the fund's total ending assets under management (AUM) and is assessed regardless of\nprofitability. The incentive fee is calculated as a percentage of profits either net of (ie, after deducting) or gross of (ie, before deducting) the\nmanagement fee; incentive fees assessed on a gross basis are said to be \"calculated independently.\"\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or the AUM being above the high-water mark. The FoF's fees\nand return are calculated as follows (year-end values and fees in £ millions):\nSteps Calculations\nFoF year-end value = year-end value of each fund 98 + 106 + 110 = 314\nCalculate return before fees (300 = initial investment) (314 − 300) / 300 ≈ 4.67%\nCalculate management fee 314 × 0.01 = 3.14\nIn this scenario, the FoF's threshold to earn an incentive fee depends on the profits exceeding the hurdle rate. Since the 4.67% return does not\nexceed the 5% hurdle rate, no incentive fee is paid.\n(Choice B) Total fees of £4.54 million result from inappropriately assuming a soft hurdle incentive fee is paid on all gains.\n(Choice C) Total fees of £4.74 million result from inappropriately assuming a soft hurdle incentive fee is paid on the two underlying hedge funds\nthat exceeded the hurdle rate.\nThings to remember:\nA fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often levy both a management fee and an incentive fee.\nInvestors incur fees from both the FoF and its underlying hedge funds.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 36, "q": "The following table depicts a hedge fund's performance and fee information for year-end 20X7: Assets $130 million Fund's net performance 30% High-water mark $100 million Incentive fee $3 million Based on only the information provided, which of the following best describes the hedge fund's incentive fee structure? ", "opts": ["A soft hurdle rate of 5% and a 10% incentive fee", "A soft hurdle rate of 10% and a 12% incentive fee", "A hard hurdle rate of 10% and a 10% incentive fee"], "ans": "A", "expl": "A hedge fund charges incentive fees subject to certain constraints that include the following:\nThe hurdle rate, which is the minimum total return, either net or gross of management fees, that the fund must earn before it receives an\nincentive fee. The hurdle rate can be either:\nsoft, so that the incentive fee is based on the entire profit, or\nhard, so that the incentive fee is based on only returns in excess of the hurdle rate.\nThe high-water mark, a base asset value used to calculate the incentive fee. It is the fund's previous peak value of assets under\nmanagement that resulted in an incentive fee.\nIn this scenario, the fund's net performance (ie, after management fees) of 30% cleared all the given hurdle rates, which entitles the fund to an\nincentive fee. The soft hurdle rate allows the fund to collect the incentive fee on the entire gain above the high-water mark (ie, 10% of $30\nmillion = $3 million).\n(Choice B) This structure implies a $3.6 million incentive fee (ie, 12% of $30 million). However, the incentive fee in this scenario is $3 million.\nThe soft hurdle rate of 10% allows the fund to collect on the entire gain above the high-water mark of $100 million (ie, 130 − 100 = 30).\n(Choice C) Given a high-water mark of $100 million and a 10% hard hurdle rate, the fund would receive an incentive fee on only the gains above\nthe hurdle rate. The fund's net performance of 30% minus 10% equals 20%, and 20% of $100 million is $20 million, so the incentive fee would be\n10% of $20 million (ie, $2 million).\nThings to remember:\nThe hurdle rate is the minimum total return that the fund must earn before it receives an incentive fee. A soft hurdle rate allows the incentive fee to\nbe earned on the entire profit. A hard hurdle rate results in an incentive fee based on only the excess returns above the hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 37, "q": "Using internal models to value the assets in a fund's portfolios is most likely for which of the following?", "opts": ["Macro hedge funds", "Hedge funds specializing in distressed debt", "Hedge funds focused on fundamental value strategies"], "ans": "B", "expl": "Proper asset valuations are necessary for calculating investment performance. Valuation is straightforward when an asset is highly liquid and\ntrades frequently since prices are readily available. Valuation becomes more difficult and subjective when prices cannot be readily observed\nor when an asset trades infrequently.\nInternal modeling tends to be used for valuation only if other, more objective methods cannot be applied. Internal modeling is typically used if the\nasset is:\nilliquid,\nnot traded on exchanges,\nnot priced by outside sources, or\naffected by unobservable inputs or assumptions\nDistressed debt generally fits all these criteria, so hedge funds specializing in distressed debt would likely use internal models to value their\nassets.\n(Choice A) Macro hedge funds invest opportunistically across a wide variety of asset classes, including derivatives. The value of certain\nderivatives such as interest rate swaps or currency swaps depends on rates that are directly observable in the market.\n(Choice C) Assets that trade regularly on public exchanges have reliable and easily available prices. Hedge funds specializing in fundamental\nvalue strategies establish long and short positions on assets that are openly traded in the market, and thus are unlikely to rely on internal models.\nThings to remember:\nCalculations of investment performance rely on proper valuations. Some hedge fund strategies rely on assets whose valuation depends on\ninternal modeling instead of market pricing since their assets are typically illiquid, not traded on exchanges, not priced by outside sources, and are\naffected by unobservable inputs or assumptions.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 38, "q": "A hedge fund begins the year with £100 million in assets. The fund charges a 2% management fee and 20% incentive fee (calculated net of the management fee) on year-end assets, subject to a 6% hard hurdle rate. At year-end, the fund had appreciated by 8%. The investor's return is closest to:", "opts": ["4.67%", "5.84%", "6.00%"], "ans": "B", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nA hedge fund investor's return is calculated net of fees and as a percentage of the fund's beginning-of-period value. Hedge funds often levy both a\nmanagement fee and an incentive fee.\nThe management fee is calculated as a percentage of the fund's total ending assets under management (AUM) and is assessed\nregardless of profitability.\nThe incentive fee is calculated as a percentage of profits either net (ie, after deducting) or gross (ie, before deducting) of management\nfees.\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or AUM being higher than a high-water mark. In this scenario,\nthe fund's threshold to earn an incentive fee is contingent on exceeding the 6% hard hurdle rate.\nThe investor's return for the year is calculated as follows:\n(Choice A) 4.67% results from not accounting for the hurdle rate and assumes paying an incentive fee on £5.84 million.\n(Choice C) 6.00% inappropriately assumes the management fee is calculated on beginning AUM, so that there are £2 million in total fees paid.\nThings to remember:\nAn investor's return on a hedge fund is calculated net of fees and as a percentage of the fund's beginning value. Hedge funds levy both a\nmanagement fee and an incentive fee. The management fee is calculated as a percentage of the fund's ending total value, gross of fees, and\nassessed regardless of profitability. The incentive fee is calculated as a percentage of profits, subject to hurdle rates and high-water marks.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 39, "q": "Within the context of a new hedge fund, which of the following best describes founders' shares? Founders' shares entitle early fund investors to: ", "opts": ["a lower fee structure than subsequent investors.", "lower fees in exchange for a longer lockup period.", "an \"either/or\" fee structure of management fees or incentive fees."], "ans": "A", "expl": "Hedge funds and funds of funds (FOFs): custom fee arrangements\nFees based on liquidity terms Reduced fees for longer lock-up period, or based on total assets invested in the fund for large\nand/or asset size investors, placement agents, and FOFs\nFounders' shares Early investors in new funds pay a lower fee to incentivize initial fund growth\nEither/or fees Investors pay either a management fee or an incentive fee, but not both\nHedge funds frequently charge both a management fee and an incentive fee. Hedge fund fees are often negotiated, enticing investors to commit\ncapital, particularly for new or small hedge funds. These custom fee arrangements can take many forms, but a common arrangement includes\nfounders' shares, which entitle early investors to:\npermanently lower fees, up to a certain monetary threshold (eg, $100 million invested), or\nfees that do not apply until the fund grows to a certain size (eg, greater than $100 million AUM).\n(Choice B) Lower fees in exchange for a longer lockup period indicate a liquidity-based fee arrangement, not founder's shares.\n(Choice C) An \"either/or\" fee structure is not a characteristic of founders' shares and refers to an arrangement of paying either management or\nincentive fees. For example, an investor may agree to pay a 30% incentive fee if certain performance thresholds are met, but in exchange will not\npay an annual management fee.\nThings to remember:\nHedge fund fees are often negotiated, enticing investors to commit capital, particularly for new or small funds. Founders' shares entitle early fund\ninvestors to permanently lower fees, up to a certain monetary threshold, or to fees that do not apply until the fund grows to a certain size.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 40, "q": "A hedge fund has the following fee structure, charged on year-end assets under management (AUM): Annual management fee 1.5% Incentive fee 12% Soft hurdle rate 5% High-water mark $380 million The fund value is $372 million at the beginning of the year and $412 million, before fees, at the end of the year. For this year, if fees are calculated independently, the net return to the investor is closest to:", "opts": ["7.80%", "8.06%", "8.67%"], "ans": "B", "expl": "An investor's return is calculated net of fees and as a percentage of the fund's beginning value. Hedge funds often levy both a management fee\nand an incentive fee.\nThe management fee is calculated as a percentage of the fund's total ending assets under management (AUM) and is assessed\nregardless of profitability.\nThe incentive fee is calculated as a percentage of profits either net (ie, after deducting) or gross (ie, before deducting) of management\nfees.\nIf fees are calculated independently, the hurdle rate determination and fee calculations are on a gross basis.\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or AUM being higher than the high-water mark. In this scenario,\nthe fund's threshold to earn an incentive fee is contingent on exceeding the 5% soft hurdle rate and the high-water mark of $380 million. Due to\nthe soft hurdle rate, the incentive fee will be applied to the entire gain above the high-water mark.\nThe investor's return for the year is calculated (in $ millions) as follows:\n(Choice A) A 7.80% return inappropriately calculates returns using beginning AUM, instead of the high-water mark, as the incentive fee's base.\n(Choice C) An 8.67% return inappropriately calculates returns using a hard hurdle rate.\nThings to remember:\nAn investor's return on a hedge fund is calculated net of fees and as a percentage of the fund's beginning value. Hedge funds levy both a\nmanagement fee and an incentive fee. The management fee is calculated as a percentage of the fund's ending total value, gross of fees, and\nassessed regardless of profitability. The incentive fee is calculated as a percentage of profits, subject to hurdle rates and high-water marks.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 41, "q": "Which measure of private equity industry performance is most likely to be overstated?", "opts": ["Volatility", "Published returns", "Correlation with other assets"], "ans": "B", "expl": "Issues when measuring private equity performance\nDescription Published Results\nExcluding firms that no\nSurvivorship bias Overstate returns\nlonger exist\nReporting multiple\nperiods after not\nBackfill bias Overstate returns\nreporting them in the\npast\nNot updating\nFailure to use mark-to- Understate volatility and\ninvestments to market\nmarket accounting correlations\nvaluations\nPrivate equity funds provide the potential for strong returns at increased levels of risk. However, published returns (eg, an index) can\noverstate the performance of funds due to the challenges of measuring private equity performance. These challenges include survivorship bias\nand backfill bias.\nSurvivorship bias occurs when indexes include the performance of funds that exist when the data is collected but exclude funds that\nhave ceased to exist, often due to poor performance.\nBackfill bias occurs when a fund that previously declined to report its results suddenly reports multiple periods of historical returns. This\nis more likely if the fund has experienced a period of improved performance, but a fund is required to report all historical results. Otherwise,\nthe current period's industry results will not reflect the fund's withheld poor performance.\nThe likely effect of both biases is that funds with lower performance are omitted from tracking.\n(Choices A and C) The failure of private equity funds to mark investments to market creates an illusion of stationary pricing when actual values\nhave changed, leading to an understatement of volatility. Observed correlation with other assets is also understated if a fund's reported prices do\nnot accurately reflect movements in the market.\nThings to remember:\nThe published returns of private equity funds can be overstated due to survivorship bias and backfill bias. Survivorship bias occurs when indexes\nfail to include the performance of funds that have ceased to exist. Backfill bias occurs when funds that have been withholding their returns\nsuddenly report multiple periods of historical results.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 42, "q": "A hedge fund begins the year with EUR 250 million in assets under management (AUM) and ends the year with EUR 300 million prior to deducting any fees. The fund charges a 1.5% management fee, calculated based on ending AUM, and an 18% incentive fee. There is no hurdle rate or high-water mark. If the incentive fee is calculated net of the management fee, the investor's return net of fees is closest to:", "opts": ["12.4%", "14.6%", "14.9%"], "ans": "C", "expl": "Hedge funds impose both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of\nthe fund's assets under management (AUM). The management fee is assessed each year regardless of profitability. The incentive fee is\nbased on the fund's annual profits, subject to certain conditions. The incentive fee is calculated either independently of the management fee or\nnet of it.\nIn this instance, the incentive fee is calculated net of management fees. To calculate the incentive fee, first subtract the management fee from the\ntotal profit. Multiply the resulting adjusted profit by the incentive fee percentage. To calculate the return percentage, take the difference\nbetween the ending AUM after fees and the beginning AUM and divide that amount by the beginning AUM.\n(Choice A) 12.4% results from calculating the return as the profit net of fees divided by beginning, not ending, AUM.\n(Choice B) 14.6% results from failing to calculate the incentive fee net of the management fee.\nThings to remember:\nHedge funds charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of the\nfund's assets under management. The incentive fee is contingent on whether the fund earns a profit, whereas the management fee does not\ndepend on profitability.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 43, "q": "A hedge fund charges a 2% management fee and a 20% incentive fee, with a hurdle rate of 5%. Both fees are calculated based on year-end assets under management (AUM), and the incentive fee is calculated net of the management fee. In addition, the incentive fee is subject to a high-water mark of €27 million. This year, the fund began the year with AUM of €25 million and realized a 10% return before fees. The net-of-fee return that an investor in the fund realized for the year is closest to:", "opts": ["2.30%", "2.41%", "7.80%"], "ans": "C", "expl": "Hedge funds impose both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of the\nfund's assets (ie, assets under management, or AUM). It is assessed each year regardless of profitability.\nThe incentive fee is levied against the fund's annual profits, subject to certain conditions. It is calculated either independently of the\nmanagement fee or net of it. The net calculation means that the fund first subtracts the management fee from AUM; the resulting number is used\nto calculate the fund's profits.\nThe incentive fee can also be subject to a hurdle rate and/or a high-water mark. Here, the fund's hurdle rate is 5%. Its total return is 10%, so any\nincentive fee is calculated on the excess return, or (10% − 5%) = 5%. However, the high-water mark is €27 million. After deducting the\nmanagement fee, adjusted AUM is €26.95 million, which is less than the high-water mark. The fund earns no incentive fee for the year.\nThe investor's return is calculated as follows:\n(Choices A and B) These choices incorrectly assume that the hedge fund earned an incentive fee. This is based on misinterpreting the fund's\nbefore-fee AUM of €27.5 million as exceeding the €27 million high-water mark. Choice A calculates an incentive fee gross of the management fee,\nwhereas Choice B calculates it net of the management fee.\nThings to remember:\nHedge funds charge both a management fee and an incentive fee. The incentive fee is contingent on whether the fund earns a profit, whereas the\nmanagement fee does not depend on profitability. In addition, an incentive fee may be contingent on whether assets under management exceed a\nhigh-water mark and/or whether the fund's return for a period exceeds a hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 44, "q": "The stage at which a venture capital (VC) fund provides funding to a company immediately prior to the company's initial public offering (IPO) most likely occurs at the:", "opts": ["later stage.", "formative stage.", "mezzanine stage."], "ans": "C", "expl": "Venture capital financing\nFinancing Characteristics\nDivided into angel financing, seed stage, and early-stage financing\nAngel financing is from friends and family; venture capital (VC) funds begin to invest with seed stage\nFormative stage\nFinancing is through common and/or preferred stock\nCompany's management retains control but fund receives equity interest\nFinancing used to expand operations and/or marketing\nLater stage Management transfers control to VC\nVC finances company both by purchasing company's equity and by lending to it\nMezzanine stage Provides funding until the company completes an initial public offering\nVenture capital (VC) is a type of private equity investing that focuses on very young companies. VC funds provide financing at three general\nstages of the company's existence. Mezzanine stage financing is typically the final financing stage by a VC fund. It is a type of bridge financing\nthat permits the company to continue operations until it completes an initial public offering (IPO) of its stock.\n(Choice A) Later-stage financing is the second stage. CFA Institute identifies this as the stage where the VC fund purchases control of the\ncompany. Financing consists of debt and equity and is used to expand operations, but the VC fund still bears significant risk. The debt portion of\nthe financing provides a way for the VC fund to obtain priority for its investment if the company declares bankruptcy since debtholders' claims are\nsenior to equity owners' claims in bankruptcy.\n(Choice B) The first stage, which CFA Institute refers to as the formative stage, consists primarily of the VC purchasing a minority equity\ninvestment in the company. The financing permits the company to develop its product, and management (typically the company's founders)\nretains control.\nThings to remember:\nVenture capital (VC) investing focuses on very young companies (ie, start-ups). VC funds provide financing at three distinct stages of a company's\nexistence. Formative stage financing occurs while the company's existing management controls the company. Later-stage financing is marked by\nthe company transferring control of itself to the VC investors. Mezzanine financing provides interim support until the company completes its IPO.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 45, "q": "Which of the following best describes an attractive feature of unitranche private debt?", "opts": ["Simplifies debt issuance for the borrower", "Conversion rights allow investors to convert into equity", "Investors get a blended range of risk exposures in a single investment"], "ans": "A", "expl": "Tighter lending standards and regulations have led to a rapidly expanding private debt market as private institutions (eg, private equity, venture\ncapital) step in and disintermediate (ie, reduce the role of) traditional bank lending and investment bank underwriting.\nUnitranche debt has become particularly attractive for individual small- to midsize borrowers since it simplifies and accelerates the private debt\nissuance process. Typically, a private debt firm will:\nbundle what would normally be a company's multiple debt issues of senior and subordinated debt into a single blended loan transaction\nwith a single offering document and a blended interest rate, and then\nrepackage and resell this loan to investors.\nThe unitranche structure is particularly attractive for firms that would otherwise be required to negotiate each tranche as a separate transaction\nwith separate offering documents, covenants, and debt service schedules. Instead, this is now undertaken by the private debt firm that structured\nthe loan.\n(Choice B) Conversion rights that allow investors to convert into equity are a common feature in leveraged buyout (LBO) and venture mezzanine\nfinancing but are not a feature of unitranche debt.\n(Choice C) The borrower (not the investors) benefits from a single loan structure. Investors must still choose the appropriate tranche and the\nassociated risk/reward associated with that portion of the deal.\nThings to remember:\nThe unitranche structure simplifies private debt issuance for a single borrower, as financing and debt service are bundled into a single loan. The\nloan comprises a blend of senior and subordinated debt, which the private debt firm then divides into various tranches to resell to investors.\nExplain features of private debt and its investment characteristics", "qhtml": null}, {"n": 46, "q": "A company targeted for a private equity leveraged buyout (LBO) is most likely to be a:", "opts": ["public company with a depressed stock price.", "private company with significant intangible assets.", "private company that is efficiently managed and operated."], "ans": "A", "expl": "Characteristics of attractive LBO target companies\nDepressed/undervalued stock price\nAgreeable management and shareholders\nInefficient operations\nRobust and predictable cash flow\nLow leverage\nUnencumbered physical assets\nA leveraged buyout (LBO) occurs when a private equity (PE) firm purchases a controlling majority of the outstanding shares of a private or public\ncompany and the purchase is financed with a significant amount of debt. The borrower is the company being acquired, not the PE firm. The\ncompany's assets serve as collateral for the loan, and its cash flows pay the interest and principal on the debt.\nDue to the highly leveraged nature of the transaction, prudent company selection is critical to an LBO's success. Acquirers look for firms that can:\nservice the debt financing,\nimprove their performance, and\nincrease their value.\nPublic companies are often the target of an LBO. By targeting companies with a depressed stock price (ie, undervalued stock), the PE firm\ncan structure the deal at a premium to the current market price, thus enticing existing shareholders to sell while still paying less than intrinsic value\nfor the company. Once the company's performance improves and its value increases, the company is sold again in the public markets or to\nstrategic buyers.\n(Choice B) Intangible assets are difficult to appraise and use as collateral. Unencumbered physical assets (ie, not intangible assets) that can be\nused as loan collateral make a company more attractive as an LBO target.\n(Choice C) PE firms add value by improving the efficiency of inefficiently managed companies, thus raising their value.\nThings to remember:\nAn attractive target company in a leveraged buyout is one that can service the debt, improve its performance, and increase its value. Key\ncharacteristics are an undervalued stock price, agreeable management and shareholders, inefficient operations, robust and predictable cash flow,\nlow leverage, and unencumbered physical assets.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 47, "q": "Which of the following best describes a characteristic of private equity? Private equity funds:", "opts": ["are typically passively managed.", "can invest in public or private companies.", "are more liquid than traditional investments."], "ans": "B", "expl": "Types of private equity (PE) strategies\nType Characteristics\nPublic company is converted to a private company\nPurchase price financed through debt and equity\nLeveraged buyout\nTarget’s assets collateralize the debt and its cash\nflows service the debt\nUsually invests in start-up companies with high growth\nVenture\npotential\ncapital\nInvestments can be equity, debt, or both\nDevelopment Typically involves mature companies\ncapital PE financing allows company to expand\nPE fund buys debt or companies in bankruptcy or in\nDistressed default on debt\ninvesting Assumes that company can be turned around with\nnew management\nPrivate equity is a type of alternative investment that encompasses both direct investment and indirect investment through private equity funds.\nInvestments may be made in:\nprivate companies, as in venture capital investing; or\npublic companies, with the goal of taking them private.\nInvestments in private companies range from seed capital for startups and other early-stage companies to mezzanine financing to prepare a\ncompany planning for its initial public offering. Investments in public companies typically entail leveraged buyouts to take large companies private.\n(Choice A) Private equity funds are typically actively managed. Funds are often actively involved with the companies they invest in, which can\ninclude replacing management, combining companies to realize synergies, or providing support functions. Managers' goals are to help small\ncompanies grow and help poorly managed companies improve their operations and strategy to grow their investments.\n(Choice C) Private equity investments are significantly less liquid than traditional investments (eg, stocks, bonds). For private equity funds,\ninvestments often take years to realize any gains. Investors in private equity funds often face lockup periods and redemption fees, making these\ninvestments illiquid.\nThings to remember:\nPrivate equity invests in private companies or in public companies with the intent of taking them private. Private company investments range from\nseed capital to mezzanine financing. Investments in public companies include leveraged buyouts of large companies.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 48, "q": "Which of the following best describes a characteristic of an attractive leveraged buyout target company?", "opts": ["Cyclical profitability profile", "Unencumbered physical assets", "High level of operating efficiency"], "ans": "B", "expl": "A leveraged buyout (LBO) occurs when a private equity (PE) firm purchases effectively all the outstanding shares of a publicly traded company\nusing equity capital and a significant amount of debt (often 80% or more of the transaction value). PE firms raise money through investment funds\nwith the intention of completely acquiring businesses.\nDue to the highly levered nature of the transaction, selecting a company with the right attributes is critical to an LBO's success. One of an LBO's\ndefining characteristics is that the transaction is structured so that the borrower is the company being acquired. Therefore, having unencumbered\nphysical assets that can be used as loan collateral is one factor that makes a target more attractive. Other attractive characteristics include:\nan undervalued stock price,\nagreeable management and shareholders,\ninefficient operations,\nrobust and predictable cash flow, and\nlow leverage.\nOnce the restructuring is complete, the company is sold in public markets or to strategic buyers at a price that constitutes a substantial return on\nthe PE investors' original equity investment.\n(Choice A) A cyclical profitability profile presents the risk of being unable to service the considerable amount of debt used to fund the transaction.\n(Choice C) PE firms search for opportunities with the potential to cut costs or improve operating efficiency. Therefore, a company that is already\noperating at a high level of efficiency is not an ideal LBO target.\nThings to remember:\nThe preferred attributes of a leveraged buyout target company include an undervalued stock price, agreeable management and shareholders,\ninefficient operations, robust and predictable cash flow, low leverage, and unencumbered physical assets.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 49, "q": "Due to its position within a company's capital structure and its convertibility into common equity, which of the following types of debt is most commonly associated with leveraged buyouts? ", "opts": ["Mezzanine", "Payment in kind", "Contingent convertible"], "ans": "A", "expl": "Mezzanine financing\nUsed in Characteristics\nHybrid security structure issued in place of straight\nhigh-yield debt\nLeveraged\nEquity conversion optionality or attached warrants\nbuyout (LBO)\nSubordinate to all other forms of debt financing\nHigh coupon rate\nUsed as bridge financing to sustain a company\nVenture\nbacked by private venture capital until it receives\ncapital\nproceeds from an upcoming initial public offering\n\"Mezzanine\" commonly refers to an intermediate floor in a large building (eg, hotel), above the ground floor but below the second floor. The term\nmezzanine financing is figurative and refers to a hybrid type of financing within a company's capital structure, positioned between common\nequity and debt. Key characteristics of debt in mezzanine financing include:\nhigh coupon rates,\nthe most junior (ie, most subordinated) debt tranche, and\nhybrid securities that are convertible into common equity.\nA leveraged buyout (LBO) occurs when a private equity firm purchases the outstanding shares of a publicly traded company. Mezzanine debt is\nthe riskiest source of debt capital in these transactions, but it can provide a significant benefit to investors if the common equity increases in value.\nIn venture capital, mezzanine debt is used to bridge the target company's cash needs until proceeds from an initial public offering (IPO) are\nreceived. The ability to convert the debt into common equity once the IPO occurs is the primary attraction for investors.\n(Choice B) A payment-in-kind (PIK) bond allows the issuer to pay coupon interest in cash or in additional bonds (ie, in kind). PIK bonds are often\nused to fund LBOs but are not convertible into common equity.\n(Choice C) Contingent convertible bonds (CoCos) are not used in LBOs. Financial institutions issue CoCos since the bonds are classified\nfavorably for regulatory capital purposes (ie, as equity). Automatic conversion can occur when the issuer suffers losses that cause owner's equity\non the balance sheet to fall below minimum regulatory requirements.\nThings to remember:\nA mezzanine debt issue has a hybrid position within a company's capital structure since it is convertible into common equity. Mezzanine debt is\noften used in leveraged buyouts.\nExplain features of private debt and its investment characteristics", "qhtml": null}, {"n": 50, "q": "If venture capitalists are investing in a company by providing funds to initiate commercial production, which of the following best describes the company's financing stage? ", "opts": ["Early", "Seed", "Angel"], "ans": "A", "expl": "Venture capital financing\nFinancing Characteristics\nDivided into angel financing, seed stage, and early-stage financing\nAngel financing is from friends and family; venture capital (VC) funds begin to invest with seed stage\nFormative stage\nFinancing is through common and/or preferred stock\nCompany's management retains control but fund receives equity interest\nFinancing used to expand operations and/or marketing\nLater stage Management transfers control to VC\nVC finances company both by purchasing company's equity and by lending to it\nMezzanine stage Provides funding until the company completes an initial public offering\nVenture capital (VC) is a type of private equity investing that focuses on very young companies. VC funds provide financing at three general\nstages of a company's existence: the formative stage, the later stage, and the mezzanine stage. The earliest investment in the company is done\nin the formative stage. The formative stage consists primarily of a minority equity investment in the company that helps it with product\ndevelopment and allows management (typically the company's founders) to retain control.\nFormative-stage financing can be subdivided into:\nAngel investing—Angel investors, who are usually friends and family of the company's founder(s), provide equity capital, rather than VC\nfunds. This is often done only in the beginning, idea stage of the business (Choice C).\nSeed-stage financing—Seed capital provides funds that take an idea to a new level by financing market research, product development,\nand marketing. This is typically the first stage when VC funds are invested in a company (Choice B).\nEarly-stage financing—An early-stage investment allows the company to begin commercial production by providing the necessary funds to\nbring the product to market. This is the last round of formative-stage financing.\nThings to remember:\nVenture capital funds provide financing at three general stages of a company's existence: the formative stage, the later stage, and the mezzanine\nstage. The formative stage can be subdivided into angel investing, seed-stage financing, and early-stage financing. Early-stage financing\nprovides the necessary capital to move the product from the development stage into commercial production and sales.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 51, "q": "A feature of mezzanine debt is that it most likely:", "opts": ["offers conversion rights to investors.", "is used for funding early-stage companies.", "offers more stable returns than direct lending."], "ans": "A", "expl": "Private debt generally refers to nonbank entities (eg, a private debt fund, an investment firm's private debt arm) lending money to private\ninstitutions. It can be broadly classified into four categories.\nDirect lending: private firms raise capital to lend directly to borrowers\nMezzanine debt: subordinated debt typically used for acquisitions or buyouts\nVenture debt: lending for start-up companies that have low or negative cash flow\nDistressed debt: purchases of debt of mature companies facing financial problems\nMezzanine debt provides capital in the form of subordinated debt, which has higher risk. Investors are typically compensated for this risk\nthrough a combination of higher interest rates and features like conversion rights, in which investors have the right to convert the debt to equity\nunder specified conditions.\n(Choice B) Venture debt is generally used to fund start-ups and early-stage companies. Mezzanine debt typically is used for acquisitions and\nbuyouts.\n(Choice C) Direct lending is associated with relatively lower risk and more stable returns than mezzanine debt, which tends to be riskier with\nmore volatile returns.\nThings to remember:\nMezzanine debt is a form of subordinated debt that typically is used in acquisitions and buyouts. It is considered riskier than other forms of debt.\nIt is also associated with higher returns, as well as features such as conversion rights, to compensate investors for the higher risk.\nExplain features of private debt and its investment characteristics", "qhtml": null}, {"n": 52, "q": "Which of the following hedge fund strategies is best described as zero-beta?", "opts": ["Merger arbitrage", "Convertible arbitrage", "Distressed/restructuring"], "ans": "B", "expl": "Hedge fund strategy Key concepts\nBuys undervalued stocks; shorts overvalued stocks\nMarket-neutral Combines equity securities to create a zero-beta portfolio\nSeeks to eliminate market risk, focus on idiosyncratic factors\nExploits short-term pricing discrepancies between related securities\nRelative-value\nMost common example is convertible arbitrage\nAttempts to profit from corporate events\nEvent-driven\nExamples include merger arbitrage, distressed/restructuring\nHedge fund is a broad term used to describe numerous types of private investment partnerships that pursue high risk–adjusted returns by\nengaging in unconventional investing strategies, such as the use of leverage, short positions, and derivatives.\nMarket-neutral is a classic equity hedge fund strategy that consists of buying undervalued stocks and shorting overvalued stocks with\nsimilar fundamental (eg, products, industry) or quantitative (eg, value, growth) characteristics to create a portfolio that is immune from\nmarket-level risks and is theoretically zero-beta.\nA relative-value strategy seeks to exploit short-term pricing discrepancies between related securities.\nConvertible arbitrage combines characteristics of a market-neutral and a relative-value strategy. It attempts to profit from mispricing between the\nembedded equity option in a convertible bond and the underlying common stock. The strategy involves simultaneously buying a convertible\nbond and selling common stock of the same company to capture a profit spread. When investors \"go long\" the embedded equity option in the\nconvertible bond and short the common stock, the net effect is a zero-beta equity position.\n(Choice A) Merger arbitrage pairs merger partners in long and short positions. It is an event-driven, not a market-neutral, strategy.\n(Choice C) Distressed/restructuring strategies focus on buying debt or equity of companies in or near bankruptcy. These strategies are not\nmarket neutral.\nThings to remember:\nA market-neutral strategy consists of buying undervalued stocks and shorting overvalued stocks to create a portfolio that is immune from market-\nlevel risks and is zero-beta. A convertible arbitrage strategy combines characteristics of market-neutral and relative-value strategies. It involves\nsimultaneously buying a convertible bond and selling common stock of the same company.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 53, "q": "A small private equity fund is looking to exit a large investment at the highest potential valuation while generating positive publicity. Which of the following exit strategies is most appropriate for the fund?", "opts": ["Trade sale", "Recapitalization", "Initial public offering"], "ans": "C", "expl": "Pros and cons of private equity exit strategies\nPros Cons\nFast, immediate cash exit Management and employee opposition due to\nPotentially high valuations due to corporate layoff concerns\nTrade sale (Corporate\nsynergies Few buyers\nbuyer)\nLow transaction costs and disclosure Valuation likely lower than with initial public\nrequirements offering\nSecondary sale Lower valuations\nRelatively fast exit\n(Investor group or private May be complex\nCapital can be redeployed in other opportunities\nequity firm) More disclosure requirements\nHighest valuation potential Longest lead times\nInitial public offering Management's preferred option High transaction costs\n(Sold to the public) Positive publicity for the private equity firm Potential lockup period\nPotential long-term equity upside High disclosure requirements\nA private equity fund will typically sell its investment by using one of several exit strategies. An initial public offering (IPO) is a strategy more\noften used for larger companies with attractive growth profiles. IPOs involve the portfolio company selling all or a portion of its equity shares\nto the general public, including some or all of the shares owned by the private equity fund.\nSince the sales price of an IPO is not negotiated but instead determined by auction in a public exchange, the shares have both unlimited upside\npotential and a larger pool of potential investors than a trade or secondary sale. Therefore, an IPO has the potential to realize the highest exit\nprice for the private equity fund. The high-profile nature of an IPO also can create the greatest amount of positive publicity for the fund.\n(Choice A) A trade sale is a private sale to a competitor and is not likely to generate the same level of publicity as an IPO. Publicity is also less\nlikely to be positive due to the potential for layoffs at the portfolio company.\n(Choice B) Recapitalization is not an exit from an investment but an increase in or introduction of debt at the portfolio company, allowing the\nprivate equity fund to pay itself a dividend.\nThings to remember:\nIPOs have the potential to realize the highest exit price for a private equity fund's investment. The sales price of an IPO is determined by auction\nin a public exchange, and thus the shares have both unlimited upside potential and a larger pool of potential investors than a trade or secondary\nsale. IPOs can also generate positive publicity for the fund.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 54, "q": "Which of the following best describes a private equity recapitalization? A private equity firm:", "opts": ["sells a portfolio company to a strategic industry buyer.", "provides mezzanine financing to facilitate a leveraged buyout.", "pays itself a cash dividend by increasing leverage in a portfolio company."], "ans": "C", "expl": "Private equity exit strategies\nTrade sale\nInitial public offering\nSecondary sale\nWrite-off or liquidation\nRecapitalization\nA private equity firm will typically exit its investment in a portfolio company at a higher valuation after improving the company's operational and\nfinancial performance. The resulting gain is the basis for the private equity firm's return on its investment. Exits of successful investments can\noccur through sales to strategic industry buyers (trade sales) or other private equity firms (secondary sales) or through initial public offerings.\nA recapitalization transaction is not truly an exit since the private equity firm remains invested, but it provides a cash return to the private equity\nfirm and is often a precursor to an exit. In a recapitalization, a private equity fund increases the portfolio company's debt burden to finance a\ncash dividend payout to the private equity firm.\n(Choice A) In a trade sale, a portfolio company is sold to a strategic industry buyer.\n(Choice B) In a leveraged buyout, a private equity firm acquires another business using large amounts of debt, usually funded by the company\nbeing acquired. Mezzanine financing is the riskiest source of debt capital in these transactions.\nThings to remember:\nIn a recapitalization, a private equity fund seeks to maximize its return by increasing a portfolio company's debt burden specifically to pay the\nprivate equity firm a cash dividend. Although a recapitalization is not truly an exit since the private equity firm remains invested, it is often a\nprecursor to an exit.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 55, "q": "After a successful turnaround, a private equity fund is structuring a transaction to exit from a portfolio company. After learning the proposal's details, company management and the employees are strongly opposed. Based only on this information, which exit strategy is most likely being planned?", "opts": ["Trade sale", "Secondary sale", "Initial public offering (IPO)"], "ans": "A", "expl": "Pros and cons of private equity exit strategies\nPros Cons\nFast, immediate cash exit Management and employee opposition due to\nPotentially high valuations due to corporate layoff concerns\nTrade sale (Corporate\nsynergies Few buyers\nbuyer)\nLow transaction costs and disclosure Valuation likely lower than with initial public\nrequirements offering\nSecondary sale Lower valuations\nRelatively fast exit\n(Investor group or private May be complex\nCapital can be redeployed in other opportunities\nequity firm) More disclosure requirements\nHighest valuation potential Longest lead times\nInitial public offering Management's preferred option High transaction costs\n(Sold to the public) Positive publicity for the private equity firm Potential lockup period\nPotential long-term equity upside High disclosure requirements\nPrivate equity (PE) funds generally invest in either early-stage start-up companies or underperforming businesses. The PE fund's management\nis actively involved in how the acquired business is run, and on average holds an investment for about five years. In a successful investment,\nthe fund realizes the value that has been created by exiting the investment through a trade sale, secondary sale, or initial public offering\n(IPO).\nA trade sale is typically the option least preferred by a company's management and employees due to concerns over job security. A trade sale\noccurs when a portfolio company is sold to a corporate buyer (ie, competitor), with the rationale that the buyer can gain market share and that\ncorporate synergies will be created by the acquisition. Cost-cutting often makes up the largest portion of these synergies, including reduction in\noverhead expenses through consolidating offices/facilities and firing duplicate staff from the acquired company.\n(Choice B) In a secondary sale, management and employees would likely be retained and their situation would remain largely unchanged.\n(Choice C) Management's preferred option is an IPO since their position would likely be maintained and they might benefit financially.\nThings to remember:\nA trade sale occurs when a portfolio company is sold to a corporate buyer. A trade sale is typically opposed by a company's management and\nemployees since layoffs are likely to occur.\nExplain features of private equity and its investment characteristics", "qhtml": null}, {"n": 56, "q": "Compared to a brownfield infrastructure investment, a greenfield investment most likely has:", "opts": ["higher levels of risk.", "lower potential returns.", "more current cash flows."], "ans": "A", "expl": "Greenfield vs. brownfield infrastructure characteristics\nGreenfield Brownfield\nInfrastructure that has yet to be built Expansion or improvement of existing infrastructure\nNo operating or financial history May already be generating regular cash flow or dividends\nUsually higher risk, higher return potential Usually lower risk, lower return potential\nThe terms brownfield and greenfield refer to the development stage of infrastructure investments. Greenfield investments build new infrastructure\n(eg, a new toll road). Brownfield investments expand or improve existing infrastructure (eg, adding a new hospital wing).\nUnlike brownfield assets, greenfield assets have no financial or operating history. An investor in a greenfield project may have the promise\nthat a government will purchase or lease the asset once it is built, or the investor may be planning to own and operate the completed asset.\nGiven the long time required to construct a greenfield asset, the risks for a greenfield investor are that the completed project may get a lower\nprice or face lower demand than expected. It may also be difficult to obtain needed financing for a greenfield investment, and construction or\noperating costs could be higher than expected.\n(Choice B) Greenfield investments have higher potential returns since the latest technology can be used to maximize the efficiency of the asset's\noperations and maintenance.\n(Choice C) It takes a long time to construct greenfield investments and make them operational. During that time, they typically do not generate\ncash flows, whereas brownfield projects may generate predictable cash flows even before they are completed.\nThings to remember:\nA greenfield investment is an infrastructure investment that has not yet been built. Since a greenfield investment has no financial or operating\nhistory, there is risk that the completed asset may face lower demand or have a lower value than expected. Other risks include difficulty obtaining\nfinancing and higher construction or operating costs.\nExplain features and characteristics of infrastructure", "qhtml": null}, {"n": 57, "q": "Which of the following types of alternative investments most likely provides investors the greatest income stability?", "opts": ["Direct investment in farmland", "Direct investment in timberland", "Equity real estate investment trusts"], "ans": "C", "expl": "Equity real estate investments\nCategory Sources of return Comments\nRental income\nConsidered commercial property when not owner-\nResidential property Property\noccupied\nappreciation\nRental income\nDirect investments Commercial real estate Property Types: offices, retail, industrial, warehouses, hotels\nappreciation\nCrop income\nGood inflation hedges due to both land and crop\nFarmland and timberland Property\nvalues\nappreciation\nRental income\nPooled Equity real estate investment\nProperty Stable income on portfolio of commercial properties\ninvestments trusts\nappreciation\nEquity investment in real estate takes the form of direct investment in individual properties or pooled investment in real estate investment trusts\n(REITs).\nThe net rental income of equity REITs is mostly derived from commercial leases (eg, office buildings, retail malls) and multifamily residences (eg,\napartment complexes). Rental income from these properties is relatively predictable and provides more stable income than other types of real\nestate equity investments.\n(Choices A and B) Direct ownership of natural resources (eg, farmland, timberland) provides investors with a stream of current income and\npotential property appreciation. Current income is derived from sales of harvestable commodities. However, commodity prices and harvests can\nbe relatively volatile, resulting in less predictable income streams.\nThings to remember:\nEquity investment in real estate takes the form of direct investment in individual properties or pooled investment in real estate investment trusts\n(REITs). These investments usually have an income component. Pooled investments in REITs offer more stable rental income streams than\nnatural resources (eg, farmland, timberland) since income from crops is susceptible to volatility in commodity prices and harvests.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 58, "q": "An investor is seeking an alternative investment that offers historically low correlation with global equities, relatively low volatility, and current income. Which of the following most appropriately meets these requirements? ", "opts": ["Farmland", "Managed futures", "Publicly listed real estate investment trust"], "ans": "A", "expl": "Farmland and timberland investments\nFarmland Timberland Common to both\nHarvest quantities\nSources of returns Commodity prices Lumber prices\nLand price changes\nPossibly ESG Inflation hedge\nESG-friendly\nInvestment Regular income Low correlation with traditional\nLong new growth cycle\nattributes Harvest inflexibility; at least annual assets\nHarvest flexibility\nharvest cycle Can hedge with futures\nDirect purchase, but for largest\nInvestment vehicles Publicly traded REITs investors only\nPrivate investment funds\nESG = environmental, social, and governance REIT = Real estate investment trust\nThe three sources of return on farmland are harvest quantities, commodity prices, and land prices. Farmland provides a consistent income\nstream as the crops are harvested, and is considered an inflation hedge since it offers investors exposure to commodity and land prices.\nRelative to global equities, attributes that make farmland a desirable investment include low correlations, low annualized volatility, and\ncomparable rates of return.\n(Choice B) Managed futures provide diversification benefits to a typical portfolio, but the returns tend to be volatile.\n(Choice C) Publicly listed real estate investment trusts have high correlations to global equities and exhibit high volatility.\nThings to remember:\nRelative to global equities, attributes that make farmland a desirable investment include low correlations, low annualized volatility, and comparable\nrates of return. Farmland also provides a consistent income stream as the crops are harvested and is considered an inflation hedge since it offers\ninvestors exposure to commodity and land prices.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 59, "q": "In a floating-rate mortgage on a commercial real estate property, the lender's risk compared to the borrower's risk is best described as:", "opts": ["spread risk.", "interest rate risk.", "the loan-to-value ratio."], "ans": "C", "expl": "The loan-to-value ratio is one of the most common risk assessment tools used by mortgage lenders. This ratio divides a loan's current value by\nthe current appraised property value and reflects the size of the lender's investment relative to the borrower's investment.\nSince the property is generally the only collateral for the loan, the loan-to-value ratio is especially important in the loan risk assessment process\nand ultimately determines the amount of risk (ie, potential for capital losses) assumed by the lender. A common initial loan-to-value ratio in\ncommercial real estate is 65%–80%, meaning that the borrower has equity in the property of 35%–20%. The greater the ratio, the greater the\nlender's risk.\n(Choice A) Spread risk refers to the impact on a bond's price from changes in credit spreads, which are not directly relevant here.\n(Choice B) In this case, the loan is a floating-rate mortgage, which neutralizes interest rate risk for the lender.\nThings to remember:\nThe loan-to-value ratio divides a loan's current value by the current appraised property value. Since the property is usually the only collateral for\nthe loan, the loan-to-value ratio is especially important in the loan risk assessment process and ultimately determines the amount of risk assumed\nby the lender.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 60, "q": "An investor seeking to benefit from the appreciation of commercial real estate would most appropriately buy:", "opts": ["equity real estate investment trusts.", "mortgage real estate investment trusts.", "commercial mortgage-backed securities."], "ans": "A", "expl": "Pooled real estate investments\nSources of return Description\nLoan (mortgage) income\nResidential MBS Pools of single-family residential mortgage loans\nSecured by property\nLoan (mortgage) income\nCommercial MBS Pools of commercial/multi-family residential mortgages\nSecured by property\nRental income\nEquity REITs Stable income on portfolio of commercial properties\nProperty appreciation\nLoan (mortgage) income\nMortgage REITs Portfolio of residential and/or commercial MBS\nSecured by property\nMBS = mortgage-backed securities; REITs = real estate investment trusts.\nPublicly traded, pooled real estate investments are usually structured as real estate investment trusts (REITs) or mortgage-backed securities\n(MBS). There are two types of REITS: equity REITs and mortgage REITs.\nEquity REITs purchase (ie, own the equity in) commercial real estate.\nMBS and mortgage REITs invest in real estate–related debt.\nThe benefits of property appreciation accrue primarily to the property owners. Of the choices, only equity REITs own commercial real estate and\nrealize the full benefit of property appreciation.\n(Choice B) Mortgage REITs hold portfolios of MBS. As holders of interests in pools of debt instruments, mortgage REITs are owed a share of the\nprincipal and interest of the loan pools; however, they do not participate in property appreciation.\n(Choice C) Commercial MBS (CMBS) are interests in single pools of commercial mortgages. CMBS holders have a claim on the interest and\nprincipal of the pooled mortgages, but they do not share in property value gains.\nThings to remember:\nPublicly traded, pooled real estate investments are mostly structured as real estate investment trusts (REITs) or mortgage-backed securities.\nEquity REITs are the only type of pooled real estate investment that participates directly in the appreciation of commercial properties.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 61, "q": "An alternative investment that provides diversification benefits and an inflation hedge while also generating consistent income is best described as an investment in: ", "opts": ["farmland.", "managed futures.", "a greenfield infrastructure project."], "ans": "A", "expl": "Farmland and timberland investments\nFarmland Timberland Common to both\nHarvest quantities\nSources of returns Commodity prices Lumber prices\nLand price changes\nPossibly ESG Inflation hedge\nESG-friendly\nInvestment Regular income Low correlation with traditional\nLong new growth cycle\nattributes Harvest inflexibility; at least annual assets\nHarvest flexibility\nharvest cycle Can hedge with futures\nDirect purchase, but for largest\nInvestment vehicles Publicly traded REITs investors only\nPrivate investment funds\nESG = environmental, social, and governance REIT = Real estate investment trust\nReal estate is a varied asset class that includes many forms (eg, residential, commercial, land) and investment structures (eg, direct, indirect,\nsecuritized). For example, investments in farmland provide significant diversification benefits to traditional debt and equity portfolios.\nThere are three principal components of return for farmland: harvest quantities, commodity prices, and land prices. Farmland can be divided into\nrow crops (eg, corn, wheat) that may be harvested more than once per year and permanent crops (eg, orchards, vineyards). As the crops are\nharvested, they provide a consistent income stream. Farmland also represents an inflation hedge since it offers investors exposure to\ncommodity and land prices.\n(Choice B) Managed futures provide diversification benefits and possible income to typical portfolio, but they are not considered an inflation\nhedge.\n(Choice C) Greenfield infrastructure projects require a significant cash outlay and often take many years to produce revenue, so they are\ninappropriate for consistent income.\nThings to remember:\nFarmland provides diversification benefits and a consistent income stream as crops are harvested; it also represents an inflation hedge since\ninvestors gain exposure to commodity and land prices. The three principal components of return for farmland are harvest quantities, commodity\nprices, and land prices.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 62, "q": "Compared with a direct investment in real estate, investing in real estate investment trusts (REITs) most likely offers a distinct advantage regarding:", "opts": ["taxes.", "degree of control.", "stability of income."], "ans": "C", "expl": "Real estate investing categories\nSingle-family residences Commercial real estate Farm and timber\nDirect equity ownership – Yes Yes\nDirect debt investment – Yes –\nCMBS\nPooled investment vehicles Joint ventures\nRMBS Joint ventures\n(debt and equity) Real estate funds\nReal estate funds\nREITs Yes, mortgage REITs Yes, wide variety of subsectors Yes, timber REITs\nRMBS = residential mortgage-backed securities; CMBS = commercial mortgage-backed securities;\nREIT = real estate investment trust.\nInvestors can own real estate\ndirectly through purchasing and managing property, or\nindirectly through purchasing shares in a publicly traded REIT.\nReal estate investment trusts (REITs) are publicly traded companies that invest in a portfolio of commercial or residential properties, typically\nrelying on leverage to finance and hold larger portfolios that can enhance returns. In REITs, shares are publicly traded and the investment\nportfolio is diversified, providing two key advantages over direct investment: liquidity and income stability.\n(Choice A) Tax advantages are not unique to REITs. Both kinds of investments offer tax advantages to investors: direct investments often offer\nreal estate-specific deductions and deferrals, while REITs avoid corporate taxes if they distribute most of the rental income (ie, at least 90%) to\nshareholders.\n(Choice B) Degree of control is an advantage unique to direct investment. Direct investment offers control over decisions such as buying, selling,\nsources of funding, number of tenants, and whether to undertake capital projects. A REIT, however, makes management decisions for its portfolio\nof properties without investor feedback or approval.\nThings to remember:\nReal estate investing offers several advantages to investors. Some advantages are shared across different forms of real estate investments. For\ninstance, direct investment and real estate investment trusts (REITs) both provide tax advantages. Other advantages are unique to the type of\nreal estate investment. For example, a key advantage of direct investment is degree of control, while REITs offer liquidity and income stability.\nExplain features and characteristics of real estate", "qhtml": null}, {"n": 63, "q": "An infrastructure investor primarily concerned with market liquidity would most appropriately invest in:", "opts": ["the expansion of an income-generating toll road.", "an exchange-traded fund consisting of utility companies.", "a hedge fund investing in various types of infrastructure companies."], "ans": "B", "expl": "Classification of infrastructure investments\nCategory Characteristics\nTransportation assets (eg, bridges, airports)\nEconomic\nUtility assets (eh, water, waste treatment, power generation)\nTypes of assets\nSocial Public welfare assets (eg, hospitals, schools)\nBrownfield Improving existing infrastructure\nStage of development\nGreenfield Building new infrastructure\nDirect ownership of a project\nDirect Highest upside potential\nHighest concentration and liquidity risks\nInvestment vehicle\nShares of publicly traded infrastructure companies\nIndirect Investment can be made through exchange-traded funds, mutual funds\nBetter liquidity and more diversification than direct investment\nInfrastructure investments provide access to returns from assets (eg, roads, airports) that provide essential services intended for public use.\nIndirect infrastructure investments are more liquid than direct investments (eg, building or purchasing a hospital). Whether publicly traded (eg,\ninfrastructure exchange-traded funds (ETFs)) or unlisted (eg, hedge funds), indirect investments require smaller capital outlays and are easier\nto exit since they can typically be sold back to the fund or traded on an exchange.\nPublicly traded indirect investments are more liquid than unlisted indirect investments, which have a smaller pool of potential investors and may\nhave redemption restrictions. For investors primarily concerned with market liquidity, a publicly traded indirect investment (eg, ETF consisting of\nutility companies) is preferable to an unlisted infrastructure hedge fund (Choice C).\n(Choice A) Direct infrastructure investments (eg, expansion of an income-generating toll road) have low market liquidity driven by the need for a\nlarge amount of capital, the time required to exit an investment, and the limited number of potential buyers. These factors can make it difficult to\nrealize an asset's full market value in a sale, especially for an investor seeking a quick exit; therefore, a direct infrastructure investment is a less\nappropriate choice for an investor primarily concerned with market liquidity.\nThings to remember:\nDue to smaller capital outlays and ease of exit, indirect infrastructure investments are more liquid than direct investments. Publicly traded indirect\ninvestments (eg, exchange-traded funds) are more liquid than unlisted indirect investments (eg, hedge funds).\nExplain features and characteristics of infrastructure", "qhtml": null}, {"n": 64, "q": "A portfolio manager is considering adding an infrastructure investment to a pension portfolio to increase the fund's long-term expected return. Which of the following is the most appropriate investment to add to the portfolio?", "opts": ["Direct brownfield investment in a power plant", "Direct greenfield investment in a toll road project", "Publicly listed master limited partnership in existing energy pipeline assets"], "ans": "B", "expl": "Greenfield vs. brownfield infrastructure characteristics\nGreenfield Brownfield\nInfrastructure that has yet to be built Expansion or improvement of existing infrastructure\nNo operating or financial history May already be generating regular cash flow or dividends\nUsually higher risk, higher return potential Usually lower risk, lower return potential\nThe terms brownfield and greenfield refer to the development stage of infrastructure investments. Greenfield projects build new infrastructure\n(eg, new toll road). Brownfield projects expand or improve existing infrastructure (eg, adding capacity at a power plant).\nGreenfield infrastructure pr
