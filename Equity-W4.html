<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

ge.\n(Choice A) Preference shares, like fixed-income securities, can be callable or putable. Call provisions give an issuer the right to buy back the\nshares, while put provisions give shareholders the right to sell the shares back to the issuer. These terms are disclosed by the company at\nissuance.\n(Choice C) Like common share dividends, the dividends on preference shares are not legal obligations. Missing a dividend payment will not send\na company into default—as would happen when a bond payment is missed—or have any other legally enforceable consequence.\nThings to remember:\nPreference shares are a type of equity financing with characteristics similar to common shares and debt securities. Like debt securities, their\nregular dividends are fixed at issuance and will not increase during periods of strong performance by the company.\nDescribe characteristics of types of equity securities", "qhtml": null, "explfigs": null}, {"n": 3, "q": "All else equal, a company's return on equity will most likely decrease if:", "opts": ["its stock price significantly decreases.", "it issues large amounts of new common shares.", "its net income increases at a faster rate than its book value of equity."], "ans": "B", "expl": "ROE is the rate of return that common shareholders receive on equity capital invested in a company. Issuing common shares increases the book\nvalue of equity, which leads to a decrease in ROE, all else equal.\nSince net income and book value of equity are accounting measures, ROE may sometimes be impacted by management's choice of a reporting\nmethod (eg, revenue recognition policies, depreciation assumptions). Analysts should consider differences in reporting methods when evaluating\nROE across multiple firms.\n(Choice A) A change in a company's stock price leads to a change in the market value of equity, which has no direct impact on ROE since ROE is\ncalculated using the book value, not the market value.\n(Choice C) Net income increasing faster than the book value of equity would lead to an increase, not a decrease, in ROE.\nThings to remember:\nROE is the rate of return that common shareholders receive on equity capital invested in a company and is found by dividing net income by\naverage book value of equity. Issuing common shares increases the book value of equity, which leads to a decrease in ROE, all else equal.\nCompare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAmcAAABaCAIAAAByq2YcAAATBklEQVR42u2d3XXawBaFx3fdd4sKIipArgCpAqACUAWgCoAKgAoQFSBXgKjASgWRK4hcQe7DXtlr7giJPztxkv09eDmKNJoZyXN0zpyfhx8/fhghhBBCXMB/NAVCCCGEpKYQQgghqSmEEEJIagohhBCSmkIIIYSkphBCCCGpKYQQQghJTSGEEEJSUwghhJDUFEIIISQ1hRBCCElNIYQQQlJTCCGEEJKaQgghhKSmEEII8QH8V1MghPi9JElijCmKYr/fG2M8z3NOiKLIGDMejyeTybWNF0VhjAmCoOmENE2NMV+/fjXGrFYrPQ4hqSmE+NRAsOV5DvG53W6dE/I8N8b0+/1rWx6NRr1er11q+r6vRyCMLLRCCCGEdE0hxF8LjKXj8TgMw3dpsKqqs+e8172EdE0hhBBCSGoKIT4fYRj6vu/7fhzHVVW1q4lFURRFMRqNHizsC5MkSZKkKIrdbrfb7fDPJgU3TVOegJajKMqyLMuybreLxp+envBfzuWLxaLT6XQ6nYeHh2632+12caHd1SiKoig62U/z090piqI0TXkmfsFpSZLgwk6ns16v1+u13QHc7unp6enpCed0Op3FYqE3yshCK4T4u4EfUBRFy+XSNHu0lmUJr9owDA+Hg/lpid1sNjj+8vICJyDP8+Dsg382tUaPJDYF/yO7D8vlMo5jNG4s1980TXGO7/ubzcYYMxqNjDHfvn2jRIQR+HA4oPHlcsl+GsvdqSzL+XxujJlOp2i82+3aw4T4N8YMh0OMK8sy3A4XrlYrDGe5XL69vckrWLqmEEIIIV1TCCF+OubMZjMYIcfjsTkVNJKmKQ4ivtO+HMpZlmWI7NztdohXuSHQE1qafXdodVRJ0cn9fj8cDu3+47SyLJ+fn6HvOv0MgoD9hOKI49PplP2E7rvb7exhhmEIh6myLKFrbjYbaJmOSdb3faiz8/m8Hv8qJDWFEH8P8/kcssGxiJLj8Qg7JASDObXrSVF0M460dmQPLbr1G1HIwc4M2e+INMhXNMIW6t8HZ2NJ8zyH1fd4PDZNhZyEjSy0QgghhHRNIYQwnufBLQimzpPuoFDC6tmCcOSf0q6goX758uXkVCjzkXRNIYQQQrqmEEL8BFt9+IlwDkfRxL5mXQ3FhugvULB4i6IonP1IxlPinPqOY1VV2NGsb3ne0A1omc5UVFUFVyO5AklqCiHMPxW+CXdTm/F4DD+gxWIxm81skYlwRsZKGmMQtvgRUhN24DiO4f7j+z7CLhlsCqEYRRHk6Gw2YwaGJk+iaxmPx/iqgISeTCaM10RnbnAeFkYWWiGEEEK6phDC/N1uQcaY+XzuJMMLwxBqaJIkUOwcNyKaT/v9Pk6AudLWQe8HKuZoNHK0Yai/VPK22y36z1H4vo9cP/ebTxeLBZRpROng 7uNptNc6w7Dx8+RKA3nV+wITUaDTxTKBQQsk2LEXfGwUxlzo452Jb4O852wkmVeACb5jKOmmTuMFkpylsIIYQQwnTziRBCCCHEOSLbkhBCCCGEZktCCCGEEJotCSGEEEJotiSEEEIIodmSEEIIIYRmS0IIIYQQ14X/H7J8WbK0wZSaAAAAAElFTkSuQmCC"]}, {"n": 6, "q": "The priorities that preferred shareholders have compared to common shareholders are least likely related to:", "opts": ["voting rights.", "payment of dividends.", "claim on assets upon liquidation."], "ans": "A", "expl": "Equity securities' characteristics\nCommon Preferred\nVoting rights Some corporate actions (eg, M&A) and board seats Usually none\nDividends Payable only after preferred Payable in full before common\nAssets Residual claim after all other obligations retired Priority claim over common for asset distributions\nThere are two types of equity securities: common stocks and preferred stocks (ie, preference shares). Corporations must have common shares\noutstanding, which represent the ownership interests in the company. As owners, common stockholders:\nshare in the company's operating performance,\nparticipate in its governance through voting rights, and\nhave a residual claim on the company's assets in the case of liquidation.\nCompanies may raise additional equity capital by issuing preferred stock. Unlike common stock, preferred shares normally carry no voting\nrights and do not participate in company operating performance. However, preferred shares rank ahead of (ie, have preference over) common\nshares, as preferred shareholders receive:\npreferred dividends, once declared, before any common stock dividends can be paid (Choice B), and\nshares' par value before common shareholders receive any distributions, upon liquidation (Choice C).\nThings to remember:\nThere are two types of equity securities: common stocks and preferred stocks. Corporations must have common shares outstanding and may\nissue preferred stocks to raise additional capital. Preferred shares have a priority claim on dividends and asset distributions in a company\nliquidation, but normally they have no voting rights.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null, "explfigs": null}, {"n": 7, "q": "A group of investors use a large amount of debt financing to purchase all the shares of a company's publicly traded stock. The investors are most likely executing a:", "opts": ["leveraged buyout.", "venture capital transaction.", "private investment in public equity."], "ans": "A", "expl": "A leveraged buyout (LBO) occurs when a group of investors purchases all the outstanding shares of a publicly traded company using a\nsignificant amount of debt. The purchase is not entirely financed by debt, as the investors also use equity capital to finance the purchase. An\nLBO is known as \"taking the company private,\" since after the purchase, the investors have complete control over the company. Company\ninsiders, such as management, often execute the LBO, in which case it may be referred to as a management buyout (MBO).\nThe LBO is structured such that the funds are borrowed by the acquired company. Targets for LBOs often have high cash flow and/or undervalued\nassets, which can be used to pay down the transaction debt. The LBO investors often restructure the company, the goal being to sell the company\nin public markets at a price that constitutes a substantial annual return on the investors' original equity investment.\n(Choice B) Venture capital investment involves providing early-stage financing to companies with high growth potential that are in need of funds\nto expand the business.\n(Choice C) A private investment in public equity (PIPE) occurs when a publicly traded company has an urgent need for funds in a short time. The\ncompany sells its stock to a large, accredited investor at a discount to the stock's market value. The PIPE can be more efficient and less\nregulatorily burdensome than a public offering.\nThings to remember:\nA leveraged buyout (LBO) occurs when a gr  "A", "expl": "Investing in nondomestic equities\nSecurity Issuer Quoted/traded\nIssuer's equity in Issuer's domestic\nCompany\ndomestic market currency\nDirect\nExchange's local\nGRS Company\ncurrency\nADR US depository USD\nExchange's local\nGDR Local depository\nIndirect currency\nBLDR ETF holding Exchange's local\n(ETF) ADRs/GDRs currency\nADR = American depository receipt GDR = Global depository receipt\nBLDR = Basket of listed depository receipts GRS = Global registered share\nETF = Exchange-traded fund\nInvestments in nondomestic equities can be made directly through global registered shares (GRSs) or indirectly through depository receipts\n(DRs). GRSs are identical shares issued in multiple countries; each share carries the same ownership interests (eg, dividends, voting rights) but\nis traded in a market's local currency. DRs, also traded in local currency, are interests in accounts at depositories that hold the foreign\ncompany shares.\nDRs may be sponsored or unsponsored. Returns on DRs match the performance of the shares in each account. However, the depository, not\nthe investor, is the legal owner of the foreign company shares. Whereas investors in GRSs retain full voting rights, holders of unsponsored\nDRs may lack voting rights if the depository chooses to retain them.\n(Choice B) Investors in both GRSs and DRs receive 100% of the dividends.\n(Choice C) GRSs and DRs expose investors to the same currency risk. Both are traded in the local currency, avoiding the need to trade\ncurrencies to invest in nondomestic equities. However, since the value of a company is usually determined by the share price in its domestic\nmarket, currency fluctuations can affect the price of a GRS or DR.\nThings to remember:\nGlobal registered share (GRS) holders retain all rights of ownership, including voting, since GRSs are the issuing companies' actual shares. In\ncontrast, depository receipts (DRs) are interests in accounts that hold foreign company shares. Since depositories legally own these shares,\nholders of unsponsored DRs may lack voting rights.\nDescribe methods for investing in non-domestic equity securities", "qhtml": null, "explfigs": null}, {"n": 9, "q": "If a company's cost of equity differs from an equity investor's required rate of return, which of the following best explains that difference?", "opts": ["A company's future cash flows are uncertain and unknown", "The company announces that it plans to undertake riskier projects", "Cost of equity is calculated after tax since dividends are tax deductible"], "ans": "A", "expl": "Investors must be compensated for bearing risk when providing capital to companies. Equity investors base their required rate of return on\nexpected future cash flows. Since these are uncertain and unknown, different investors will have different estimates of the company's future\ncash flows. This leads to different investors having different required rates of return.\nSince companies seek to issue capital at the lowest potential cost, a company will issue equity capital at the lowest rate that will allow it to raise\nsufficient capital, which becomes the company's cost of equity. Investors with required rates of return less than or equal to this rate will purchase\nthe company's securities; those that have higher required rates of return will not. For a given amount of equity issued, the company's cost of\nequity will be a single rate. Investors will have varied required rates of return, which often differ from a company's cost of equity.\n(Choice B) A company taking on riskier projects would most likely increase both its cost of equity and investors' required rate of return, assuming\nthe investors would be aware of the projects. This is not a reason for differences between the cost of equity and investors' required rates of return.\n(Choice C) The company's cost of debt, not its cost of equity, is calculated after tax. Interest expense is a tax-deductible expense for the\ncompany, but dividends are not.\nThings to remember:\nInvestors base their required rates of return for equity securities on their estimates of expected future cash flows, which leads to different required\nrates of return among investors. For a given amount of equity issued, the company's cost of equity will be a single rate; investors will have a range\nof required rates of return that often differ from the company's cost of equity.\nCompare a company’s cost of equity, its (accounting) return on equity, and investors’ required rates of return", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAxQAAAG1CAIAAADvPiWkAAAzpUlEQVR42u3dO2wjX5bf8SNjAWfb9U+c7YiKF4aq08UuVEx3ApHpGjBJ2DlZjnYjqqJxRtKAA8MByWAGxiYsBRuzhBk4ZQm7AzgwwNJMtkmXNjMcyMEPOq5/8SHq1a3H9xM0utlkPS7ZzaNzzr336O7uzgAAAHCYf8UQAAAAEDwBAAAQPAEAABA8AQAAEDwBAAAQPAEAABA8MQQAAAAETwAAAARPAAAABE8AAAAETwAAAARPAAAABE8MAQAAAMETAAAAwRMAAADBEwAAwDvyJwwBamazWVEUW/+q0WiYWbfbffLBy7I0syAI3sidmllRFLoj3V3VxcWF/woAgJF5AgAAeKyju7s7RgFVzWYzz3MzC8Ow9ldZlunx1Wr12MOmaWpm8/nczBaLxY+9RyWTLi8vzSyKIqWgVquVJ5/0hJubGzObTqd8KgAARtkOeyhsWi6XW4OnZrOpaONR9TsFZCrb/XCTycTM1uu1VWqIaZoOBgNdpJ7whBgRAGCU7QAAAGBknvAEURTpN1s7ymezmQphZVmenZ2Z2WAwUF4ny7Krqyt/4cXFhepiWZbpkVoSq/q4fpNlmQ6lnNDZ2ZleMpvN9JskSfTMMAyHw6HtbUuv9a1/+fKlmhUbj8etVsu2tZADAEDwBHvs9LTNqKLX65lZmqaKY758+aLepsvLS9X+iqJQZKMARYFUNajaDJ78cb0wjmPFOp1Ox8xub2/1eJIk3rqkaqPPFtzTWaXr99au6+trMzs/P9flzefzzZIlAABG2Q4AAMDIPOH5lJJpNpv281KXHo+iyBNFesRnq/kEPVXlTk5O9FeDwUDZIOWTnpDXKctSmSQvHap73cxUpFOhzcxOT0+VCdtDL9ENehat2+3GcWxmnU5HD+qai6LwkwIAQOYJAADAyDzhWdRdpKZvu08X5XmuFY+q/UlK/yhPk6apFnOySmuRGpK0BIC9ULt6jeectvZjbaVb0AE9sVQUhfJk6/VaN6IMlh9wuVy+kbXRAQAET3hbFC7UtiVpNpua6dZqtTyGUId1rQ3cNpaMesu36bFRkiT9fl+xo+p3Ki+GYdhut6sd8QAAo2wHAAAAI/OEFzSdTr9+/WpmvV7PVwFQCkq/braBF0XxtKWSbm9vv+etqTE8TVOtOe6PeNrs9PR01+pWAACCJ8B2Fbk0SS2OY7U6RVGkfiMVuXzpS7sv5DWbTS3LVKsAWqW5yrdtUQSmF6Zp+j0XqNT1j0YjL0dWLyYIAgVzx8fHfAwAAJTtAAAAjMwTXoUmzc3nc01DW61Wyg9pFl6v19PC4o1GQ6mpMAx9np2emSSJmTWbTRX+Wq2WHjk5OVGNzOtl320L4SzLlP2qrkiuxnAtBBV hares, nonparticipating preference shares do\nnot provide such benefits.\n(Choice A) Voting is a right bestowed on common shareholders, not preferred shareholders.\n(Choice C) The provision to sell shares back to a company at a predetermined price is not a feature of participating preferred stock.\nThings to remember:\nParticipating preference (preferred) stock provides additional dividend payments to shareholders if the company's profits exceed a certain\nbenchmark.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null, "explfigs": null}, {"n": 12, "q": "A depository receipt allows a local investor to invest in:", "opts": ["local securities through a foreign exchange.", "foreign securities through a local exchange.", "foreign securities through a foreign exchange."], "ans": "B", "expl": "Investors can invest in foreign securities directly by transacting in foreign markets (ie, direct investing) or indirectly by owning depository receipts\n(DR). Sometimes, direct foreign investing can be difficult due to currency conversion, low liquidity, or lack of transparency. DR allow investors\naccess to foreign securities without having to transact directly in the foreign market.\nDR are created when foreign companies deposit their shares into another country's bank. The bank then issues DR that represent the deposited\nshares and helps list DR on an exchange in the bank's country (ie, a local exchange). This allows local investors (ie, investors in the bank's\ncountry) to purchase DR and effectively invest in shares of the foreign stock that can be publicly traded on the local exchange.\nThings to remember:\nDepository receipts (DR) allow investors access to foreign securities without trading in a foreign market. DR are created when foreign companies\ndeposit their shares into a local bank. The local bank then issues DR that represent the deposited shares and helps list DR on a local exchange.\nDescribe methods for investing in non-domestic equity securities", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA9kAAAHVCAIAAABqi6/vAACDrklEQVR42u3db2xb550n+q9jx2T+lUzahu5Ox6S3O2L/TCh5d6ICdytZ6lzpxczIlu6tCkwbwdIiAbZTB7HQvJjFBLCEyWAKTArbiNtewMZahtxeoMyuFWs6L6S9sEy3xYaZhSWmBUp2sBbd7dRMuw2ZSRoycaL74mv++vgckqJs/bW/nxcGRR+e85znHFE//vh7nmfb0tISRERERERk3d2jLhARERERUSwuIiIiIqJYXEREREREFIuLiIiIiCgWFxERERERxeIiIiIiIorFRUREREREsbiIiIiIiGJxERERERFRLC4iIiIiolhcREREREQUi4uIiIiIKBYXEREREVEsLiIiIiIiisVFRERERBSLi4iIiIiIYnEREREREcXiIiIiIiKiWFxERERERLG4iIiIiIgoFhcRERERUSwuIiIiIiKKxUVEREREFIuLiIiIiCgWFxERERERxeIiIiIiIorFRUREREREsbiIiIiIiGJxERERERFRLC4iIiIiolhcREREREQUi4uIiIiIbAE71AUi66BYLM7PzzfYIBwOt7W13SW9sbi4aP8C4ImHw2HdJxtobm7uLrwVN+dvh/1q8LdDvxoiisVF5HbNz893d3c33oZ/cQ8fPnzkyJE7uzfOnDkDYGxsjD9euHABQFdXl20wNTUF4OWXXz59+rRunvVh92dXVxevyKrc9qOjo3aJxfP5HMDo6OjBgwfd+//MmTP2q8Guc381RASqURERERERESgvLoI7Lk82NjbGb6jv2pRwd3c36yWUDty6xsfH3a8+xGNqampkZIS/9cyLiwiUFxcRERERESgvLnIHY7LQUxQ+NTXFVOL8/PzExASAffv2DQ8P35E9wHOvVxZvgwhlPS0tLWENRoJKTQsLC/werOZvxx0/YkREFIuLbDr9/f2cvGLPnj185vjx455YnH+8JyYmXn75ZTgzkDzzzDOxWAy+iUo4RJJhPTdguL+4uMgXHjlypN4UDYylzpw5Y1M6HDhwAMDw8HDNlxSLRX6EsLahWmTCr+DdFnLnFy9e5I/2Hb012M6CDY5Go56uaNA83Dwli78r2I3Hjx9nq6xhoVAIwOHDh+ErJ2DwxB+feeaZxvNasM1sNvvZnmGM1dbW1uBSevrKc/XZbIt029raGrzEPUSxWOQ2Bw8erFn84zbbepvXNJ/Pu+2fmJhgf4bDYV67/v5+z67cmUD8PWB7fvnlly0kZQ/wOt5CedKxY8d4R7ln6tnVsjfD0aNHeV7c8vjx4+70RwcOHPDfYA3ufx6dF8hews3czypsz8WLF9ngxcVF+9XgWXgurv9YDa5szd+1xcVFHtTeChrfRSIC1aiIiIiIiOCO/F5SRNaaO6fb2NjY2NhYvS3dFKP7/OXLl8PhcL2M7OnTp0+fPu0ezj1if39/zdeGw+ErV65cuXLFPdDw8HCD2phwOHz58uXLly/b9txDg1QxD+2+hD0AZ9Y2T4M9urq6PC1s/liePfsTh/39/W6fe3pjaWnJcud8sOy1xs0zQ7s9c+7cuXPnzjW+lLyann0u+5ILFy7Yxm+88cYbb7zR1tZWb5pwXuJ6zXZ7u6ury+2xevfG4cOHDx8+7N9Vvb84y85f7u+BehqfKX/dmr8Z2HUNhk37bzDr7cYveeONN2p2qeciXrhwwTPg1b2y/NVrcBv4r6znd63eFfQ0UkTWk2pURDaXtrY2FkWg+v0y/3KPjIzw+/RwOGzfpFuJOWdxZkzp/1M9NTXFP8D8hvrMmTP8jrtYLHIPFnyMj4/zvyxO5ZfXi4uLPESxWBwYGABw+fJltw1WaXD06FHGJRcvXmQQYPMoN55kOhaLcXsLHWK  investors, with resale restrictions\nLevel I: SEC-registered and trades over-the-counter (OTC); basic access to US investors\nLevel II: SEC-registered and exchange-traded; better investor access but higher cost and more requirements\nLevel III: most stringent SEC registration requirements; can be used by foreign-listed firms to raise new equity capital and for acquisitions\n(Choice A) Level I ADRs give foreign-listed firms basic access to US markets and investors. However, these ADRs may not be sold to raise new\nequity capital.\n(Choice B) Level II ADRs give foreign-listed firms basic access to US markets and a mainstream exchange listing, but they still cannot be used\nfor raising new equity capital.\nThings to remember:\nLevel III ADRs require the most stringent SEC registration process and can be used to raise new equity capital and for acquisitions.\nDescribe methods for investing in non-domestic equity securities", "qhtml": null, "explfigs": null}, {"n": 15, "q": "Which of the following best describes a characteristic of common stock?", "opts": ["It gives the investor an ownership stake in the issuing company.", "It obligates the issuer to repay the amount received from shareholders.", "It does not allow shareholders to participate in the decision-making process."], "ans": "A", "expl": "Characteristics of common shares\n• Rank below preference shares in respect to\n◦ Dividend payments\n◦ Asset distribution during liquidation\n• Represent ownership stake in a company\n• Share in the operating performance of the company\n• Typically offer voting rights for shareholders to participate in\ndecision-making process\n• Companies can choose to pay all, some, or none of their profits in dividends\nCommon shares are a type of equity security that provides financing for the issuing company in exchange for a claim on the company's net\nassets. They are the predominant type of equity financing used by companies.\nCommon shares represent an equity ownership stake, allowing the investor to share in the company's operating performance, vote on certain\ncompany decisions, and make claims on the company's net assets in the event of bankruptcy. The claims of common shareholders rank below\ndebt holders and preference shareholders, adding to the risk of common shares.\n(Choice B) The proceeds from the sale of common shares are not loans, so there is no repayment obligation at maturity (ie, principal payment) as\nwould be the case for bonds. Since common shares have no maturity, they may remain outstanding in perpetuity or until the company\nrepurchases and retires them.\n(Choice C) Most common shares allow shareholders to participate in major corporate governance decisions (eg, mergers and acquisitions) by the\ncompany through voting. The company will specify how many votes each share receives.\nThings to remember:\nCommon shares are the predominant type of equity financing used by companies, representing an ownership stake in the issuing company. As\nsuch, they allow the investor to share in the company's operating performance, vote on certain company decisions, and make claims on the\ncompany's net assets in the event of bankruptcy. Common shareholders' claims are subordinated to those of debt holders and preference\nshareholders.\nDescribe characteristics of types of equity securities", "qhtml": null, "explfigs": null}, {"n": 16, "q": "A company uses the proceeds from newly issued bonds to buy back common shares. Holding all else constant, including the common dividend per share, if return on equity increases, the increase is most likely the result of:", "opts": ["book value of equity declining proportionally more than net income.", "net income increasing due to the increase in tax-deductible interest expense.", "total dividend payments decreasing, resulting in an increase in shareholders' equity."], "ans": "A", "expl": "Issuing debt to fund share buybacks impacts both the balance sheet and the income statement. On the balance sheet, long-term debt will\nincrease and shareholders' equity will decrease. On the income statement, interest expense will increase while taxable income, tax expense,\nand net income will decrease. Holding operating profit constant, net income must decline since the increase in interest expense is greater than\nthe decrease in tax expense.\nIn this scenario, there has been an increase in ROE (given) and a decrease in net income. For ROE to increase while net income has decreased,\nthe decline in average shareholders' equity (ie, book value) must be proportionally greater than the decline in net income.\n(Choice B) Net income has decreased, rather than increased. The additional tax deduction is less than the increased interest expense, so the\nnet effect is a decrease in net income.\n(Choice C) Shareholders' equity decreased rather than increased. Dividend payments reduced the shareholders' equity, although the impact was\nlessened since the dividend was paid on the smaller number of outstanding shares (after the buyback). Shareholders' equity was further reduced\nby the market value of the repurchased shares.\nThings to remember:\nHolding all else constant, issuing bonds increases interest expense and decreases net income, and repurchasing shares reduces shareholders'\nequity. For ROE to increase while net income and book value of equity decrease, the decline in equity must be proportionally greater than the\ndecline in net income.\nContrast the market value and book value of equity securities", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA8YAAAGfCAIAAAAS7VyAAABseklEQVR42u2923IaW5avP3RCB9tLaa+1XV2rapfx7e4dYfwEhrt9J7ju6BA8gcQTSDwB8AIF6hcQegKhJxCK6FpVqzs6jG+qO6LDNvaqClvn/8WvPf5zZQJCEpKR/H0XBCSZc86cpxw55hhjTp2fnxsAAAAAAFyVaaoAAAAAAACRGgAAAAAAkRoAAAAAAJEaAAAAAACRGgAAAAAAEKkBAAAAABCpAQAAAAAQqQEAAAAAEKkBAAAAAACRGgAAAAAAkRoAAAAAAJEaAAAAAACRGgAAAAAAEKkBAAAAABCpAQAAAAAQqQEAAAAAEKkBAAAAAACRGgAAAAAAkRoAAAAAAJEaAAAAAACRGgAAAAAAkRoAAAAAABCpAQAAAAAQqQEAAAAA eir equity investor base by creating American depository receipts (ADR). In a\nsponsored ADR, a foreign company deposits shares of its stock with certain banks that create dollar-denominated certificates (ie, ADRs), which\nwill usually be listed on an exchange. An ADR trades just like a stock and generally tracks the underlying value of the company's shares that trade\non a foreign exchange.\nThere are four primary types of ADR listings, each with progressively more stringent listing and corporate governance requirements:\nRule 144A ADR: unregistered and privately sold only to qualified investors, with resale restrictions\nLevel I: SEC-registered and trades over-the-counter (OTC) with basic access to US investors\nLevel II: SEC-registered and exchange-traded with better investor access but higher cost and more requirements\nLevel III: most stringent SEC registration requirements; can be used by foreign-listed firms to raise new equity capital and for acquisitions\n(Choices B and C) Level I ADRs give foreign-listed firms the most basic access to US markets and investors. SEC filing requirements are less\nstringent, and these ADRs may not be sold to raise new equity capital in the US.\nThings to remember:\nLevel I American depository receipts (ADRs) give foreign-listed firms the most basic access to US markets and investors. Level I ADRs trade\nover-the-counter, have less stringent SEC filing requirements, and may not be sold to raise new equity capital in the US.\nDescribe methods for investing in non-domestic equity securities", "qhtml": null, "explfigs": null}, {"n": 18, "q": "Which of the following best describes a fundamental difference between preference shares and common shares?", "opts": ["Preference shares carry more voting rights than common shares.", "Common shares typically have larger dividends than preference shares.", "Preference shareholders receive dividends before common shareholders."], "ans": "C", "expl": "Characteristics of preference shares (preferred stock)\n• Rank above common shares in respect to\n◦ Dividend payments\n◦ Asset distribution during liquidation\n• Do not generally offer voting rights\n• Can be callable, putable, or convertible\n• Dividends are\n◦ Not contractual obligations\n◦ Generally fixed at issuance\nPreference shares are a type of equity security that provides financing for the issuing company. Preference shareholders receive a regular\ndividend payment from the company that is fixed at issuance. Like dividends on common shares, preferred dividends are not contractual\nobligations, and missing payments will not send a company into default.\nPreference shares rank above common shares when dividends and claims on a company's net assets are paid during liquidation. In that\nsituation, preference shareholders must receive their dividends before common shareholders can receive theirs.\nThis requirement is taken a step further in regard to cumulative preference shares: A company must pay any current and previously unpaid\ndividends to cumulative preference shareholders before common dividends can be paid.\n(Choice A) Unlike common shares, preference shares usually do not provide voting rights to the shareholders. When exceptions occur,\npreference shareholders are typically allowed to vote on only those matters relevant to their shares.\n(Choice B) Dividends on preference shares are fixed and generally larger than those on common shares. This helps to make preference shares\nmore attractive to potential investors, despite lacking the upside potential of common shares.\nThings to remember:\nPreference shareholders receive regular, fixed dividends from the issuing company. The payments are set at issuance. These dividends rank\nabove those of common shares, which means that preference shareholders must receive their dividends before common share dividends can be\npaid.\nDescribe characteristics of types of equity securities", "qhtml": null, "explfigs": null}, {"n": 19, "q": "Holding all other factors constant, an issuance of common stock is most likely to result in an increase to the company's:", "opts": ["total assets.", "return on equity.", "intrinsic value per share."], "ans": "A", "expl": "Companies can raise money to finance their operations by issuing debt or equity securities. Issuing equity securities gives firms more flexibility\nsince there is no legal obligation to retire equity or distribute dividends to shareholders.\nIssuing equity securities has several immediate impacts on a company's balance sheet. Common stock, a component of shareholders' equity,\nincreases to account for the value of shares issued. Since cash is an asset, the net proceeds from the offering (ie, the cash received in exchange\nfor the common shares issued) increase total assets.\n(Choice B) ROE is the ratio of net income to the average book value of common shareholders' equity. Since net income (numerator) is held\nconstant in this case and the issuance of common shares increases the average book value of common shareholders' equity (denominator), ROE\ndecreases.\n(Choice C) The intrinsic value of a company is the estimated present value of its future cash flows. In this scenario, since everything other than\nan issuance of common stock is held constant, projected future cash flows would be unchanged, leading to the same intrinsic value for the firm.\nSince there are more shares outstanding after the new issue, intrinsic value per share would decrease.\nThings to remember:\nIssuing equity securities impacts a company's balance sheet. Common stock, a component of shareholders' equity, increases to account for the\nvalue of shares issued. Since cash is an asset, the net proceeds from the offering (ie, the cash received in exchange for the common shares\nissued) increase total assets.\nExplain the role of equity securities in the financing of a company’s assets", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAr4AAAKfCAIAAAAHFVyxAABceUlEQVR42u3d d and not paid to cumulative preference shareholders in the future.", "accrued and paid to cumulative preference shareholders in the future before paying common shareholders.", "accrued and paid to cumulative preference shareholders in the future only after paying common shareholders."], "ans": "B", "expl": "Types of preference shares (preferred stock)\nCumulative Accrues for past dividends that are unpaid\nNoncumulative Does not accrue dividends that are undeclared and unpaid in past periods\nParticipating Allows for additional dividend payments if company profits exceed a certain threshold\nNonparticipating Fixed dividend; no additional payments based on company performance\nConvertible Can convert into a specified number of common shares\nCallable Allows issuer to buy back shares from investors for a specified price\nPutable Allows investors to sell shares back to issuer for a specified price\nPreferred (preference) shares ownership represents a form of equity investment in a company. Preference shares may grant certain benefits to\npreferred shareholders such as high dividend payments and in some cases conversion rights (to common stock). Furthermore, dividend\npayments to preferred shareholders take precedence over dividend payments to common shareholders. Preferred dividends can be cumulative\nor noncumulative.\nFor cumulative preference dividends, if a company does not pay a dividend (or dividends) in one period (or several periods), the unpaid dividend\naccrues and is owed in the future. Conversely, for noncumulative preference dividends, the company does not accrue (and does not owe payment\nfor) unpaid dividends from past periods.\n(Choice A) Unpaid dividends on cumulative preferred shares are accrued and owed to preferred shareholders.\n(Choice C) Payments of past unpaid dividends are due to preference shareholders before any dividends can be distributed to common\nshareholders.\nThings to remember:\nFor cumulative preference dividends, if a company does not pay a dividend, the unpaid dividend is accrued and paid in the future. Accrued\ndividends from cumulative preference shares must be paid before dividends can be paid to common shareholders. Conversely, for noncumulative\npreference dividends, the company neither accrues nor owes payment for unpaid dividends from past periods.\nDescribe differences in voting rights and other ownership characteristics among different equity classes", "qhtml": null, "explfigs": null}, {"n": 23, "q": "In contrast to statutory voting, cumulative voting allows common shareholders to cast:", "opts": ["more total votes.", "all votes for one candidate.", "one vote for multiple candidates."], "ans": "B", "expl": "Shareholders often vote in board of director elections, which are conducted via statutory voting or cumulative voting. Often, one vote is tied to\neach share.\nIn the case of statutory voting, shareholders must allocate their total votes, which are based on the number of open board seats, evenly among\nthe candidates. Under this system, larger shareholders have greater representation than smaller shareholders. In cumulative voting,\nshareholders can disproportionally allocate their votes to any one candidate (or any number of candidates), which can improve representation\nfor smaller shareholders.\nIn the example above, three board seats are open for election and there are five candidates. Suppose a particular shareholder has 300 votes.\nUnder statutory voting, the shareholder must pick three candidates and distribute 100 votes to each of the three. Under cumulative voting, the\nshareholder can apply all 300 votes to one candidate. This benefits the shareholder if this shareholder strongly prefers a specific candidate to win\na board seat.\n(Choice A) A cumulative voting system does not change the total number of votes granted to a shareholder.\n(Choice C) Each vote is cast for one candidate. A single vote cannot be split for multiple candidates.\nThings to remember:\nIn the case e any distributions.\nHowever, balancing these preferences are factors that limit the upside for preferred shareholders. Nonparticipating, nonconvertible preferred\nstocks do not participate in increases in the company's value or in dividend increases due to company performance. To compensate for these\nlimits, preferred stocks usually have greater dividend yields than common stocks.\n(Choice B) Despite their larger dividend yields compared with common stocks, preferred shares have lower expected returns due to their\nexclusion from participation in company performance.\n(Choice C) Due to their seniority and more predictable dividend payments compared to common stock, preferred stocks exhibit lower price\nvolatility.\nThings to remember:\nIn contrast to common shares, nonparticipating, nonconvertible preferred stocks do not participate in increases in the company's value and cannot\nhave their dividends increased. In compensation for their limited returns, preferred stocks have higher dividend yields than common stocks.\nCompare the risk and return characteristics of different types of equity securities", "qhtml": null, "explfigs": null}];
const CFG = {"title": "Wiley · Overview Of Equity Securities", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Equity Investments · 25 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;

  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);

    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
