<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "When using a security market index to represent a market's performance, the performance\nof that market over a period of time is best represented by:", "opts": ["the index value.", "the change in the index value.", "the percent change in the index value."], "ans": "C", "expl": "Percentage changes in the value of a security market index over time represent the\nperformance of the market, segment, or asset class from which the securities are chosen.\n(Module 40.1, LOS 40.a)"}, {"n": 2, "q": "Commodity price indexes are based on the prices of:", "opts": ["commodities.", "futures contracts.", "real assets such as grains, oil, and precious metals."], "ans": "B", "expl": "The constituent securities of commodity price indexes are commodity futures contracts. As\na result, the return on a commodity index can be different than the returns from holding\nthe constituent commodities themselves.\n(Module 40.2, LOS 40.k)"}, {"n": 3, "q": "The providers of the Smith 30 Stock Index remove Jones Company from the index because it\nhas been acquired by another firm, and replace it with Johnson Company. This change in the\nindex is best described as an example of:", "opts": ["reconstitution.", "redefinition.", "rebalancing."], "ans": "A", "expl": "Reconstitution refers to changing the securities that make up an index. Reconstitution of\nan index is required if one of its constituent securities goes out of existence (for example,\na maturing bond or an expiring futures contract) or no longer meets the requirements to\nbe included in the index.\n(Module 40.2, LOS 40.f)"}, {"n": 4, "q": "With regard to stock market indexes, it is least likely that:", "opts": ["the use of price weighting versus market value weighting produces a downward bias on the index.", "buying 100 shares of each stock in a price-weighted index will result in a portfolio that tracks the index quite well.", "a market-cap weighted index must be adjusted for stock splits but not for dividends."], "ans": "C", "expl": "A price-weighted index needs to be adjusted for stock splits, but a market-cap weighted\nindex does not. Neither type of index considers dividend income unless it is designed as a\ntotal return index.\nPrice weighting produces a downward bias compared to market weighting because firms\nthat split their stocks (which tend to be the more successful firms) decrease in weight\nwithin a price-weighted index. The returns on a price-weighted index can be matched by\npurchasing a portfolio with an equal number of shares of each stock in the index.\n(Module 40.1, LOS 40.d)"}, {"n": 5, "q": "Which of the following statements is most accurate regarding commodity indexes?", "opts": ["Commodity indexes are based on spot prices, while most investors purchase futures contracts.", "The return to commodity indexes consists of two major components: the risk-free rate of return and the roll yield.", "Weighting methodology varies among index providers and leads to differences in index risk and returns."], "ans": "C", "expl": "Weighting methodology is a major issue for commodity indexes. Several different\nmethodologies are used, including equal weighting and global production values.\nDifferences in weighting cause differing exposures for the indexes and lead to different\nrisk and return profiles.\nCommodity indexes represent futures contracts on commodities, not the actual spot\nprices of commodities. Commodity index returns come from three sources: the risk-free\nrate of return, changes in futures prices, and the roll yield.\n(Module 40.2, LOS 40.k)"}, {"n": 6, "q": "Which of the following is least likely required when defining a security market index? The:", "opts": ["number of securities in the index.", "target market the index will represent.", "weighting method for the index."], "ans": "A", "expl": "A market index does not necessarily have to consist of a fixed number of securities. For\nexample, some indexes are defined to include all the stocks that trade on a certain\nexchange, a number that can vary over time.\n(Module 40.1, LOS 40.c)"}, {"n": 7, "q": "Use the data below to determine which of the statements is most accurate?\nAs of December 31\nCompanyStock PriceShares Outstanding\nA$2520,000\nB$5020,000\nC$10010,000", "opts": ["For a given percentage change in the stock price, Company B will have less of an impact on the market-cap weighted index as Company C.", "For a given percentage change in the stock price, Company A will have a greater impact on the market-cap weighted index than Companies B or C.", "A 100% increase in the stock price of Company A will have a smaller impact on the price-weighted index than a 100% increase in the stock price of Company C."], "ans": "C", "expl": "A 100% change in the stock price of Company C will have a larger impact than a 100%\nchange in either stocks A or B on the price-weighted index. A price-weighted index adds\ntogether the market price of each stock in the index and then divides this total by the\nnumber of stocks in the index. The price-weighted index assumes you purchase one share\nof each stock represented in the index. The price-weighted index is influenced most by\ngiven percentage changes in the higher priced stocks.\n(Module 40.1, LOS 40.e)", "qhtml": "<p>Use the data below to determine which of the statements is most accurate?</p><p>As of December 31</p><table class=\"qtable\"><thead><tr><th>Company</th><th>Stock Price</th><th>Shares Outstanding</th></tr></thead><tbody><tr><td>A</td><td>$25</td><td>20,000</td></tr><tr><td>B</td><td>$50</td><td>20,000</td></tr><tr><td>C</td><td>$100</td><td>10,000</td></tr></tbody></table>"}, {"n": 8, "q": "An equity index comprised of value stocks, identified by their price-to-earnings ratios, is best\ndescribed as a:", "opts": ["fundamental weighted index.", "style index.", "sector index."], "ans": "B", "expl": "An index of value stocks is an example of a style index. Sector indexes measure the\nperformance of securities in specific industries or industry sectors. Fundamental weighting\nis used to weight indexes by a factor such as the size of the firms or economies\nrepresented in the index.\n(Module 40.2, LOS 40.h)"}, {"n": 9, "q": "Ken Miller, CFA, wants to compare the returns on government agency bonds to the returns\non corporate bonds. Peg Egan, CFA, wants to compare the returns on high yield bonds in\ndeveloped markets to the returns on investment grade bonds in emerging markets. Which of\nthese analysts is most likely able to use bond indexes for their analysis?", "opts": ["Both of these analysts.", "Neither of these analysts.", "Only one of these analysts."], "ans": "A", "expl": "Because of the wide universe of bonds that trade in financial markets, indexes are\navailable (or can be constructed) based on virtually any feature or classification of bonds.\n(Module 40.2, LOS 40.j)"}, {"n": 10, "q": "Which of the following indexes is a price weighted index?", "opts": ["The New York Stock Exchange Index.", "The Nikkei Dow Index.", "The Standard and Poor's Index."], "ans": "B", "expl": "The Nikkei Dow Index is a price-weighted index. The other two are market value-weighted\nindexes.\n(Module 40.2, LOS 40.i)"}, {"n": 11, "q": "An analyst using the capital asset pricing model is most likely to use a security market index\nas a proxy for:", "opts": ["beta.", "the market return.", "the risk-free rate."], "ans": "B", "expl": "The return on a security market index can be used as a proxy for the market return in a\npricing model such as the CAPM.\n(Module 40.2, LOS 40.g)"}, {"n": 12, "q": "What is the price-weighted index of the following three stocks?\nAs of December 31, 2001\nCompanyStock PriceShares Outstanding\nA$5010,000\nB$3520,000\nC$11030,000", "opts": ["65.", "80.", "75."], "ans": "A", "expl": "The price-weighted index equals [(50 + 35 + 110) / 3] = 65.\n(Module 40.1, LOS 40.e)", "qhtml": "<p>What is the price-weighted index of the following three stocks?</p><p>As of December 31, 2001</p><table class=\"qtable\"><thead><tr><th>Company</th><th>Stock Price</th><th>Shares Outstanding</th></tr></thead><tbody><tr><td>A</td><td>$50</td><td>10,000</td></tr><tr><td>B</td><td>$35</td><td>20,000</td></tr><tr><td>C</td><td>$110</td><td>30,000</td></tr></tbody></table>"}, {"n": 13, "q": "Creating a bond market index is more difficult than constructing a stock market index due\nto:", "opts": ["lack of continuous trade data for bonds.", "a narrower universe of bonds versus stocks.", "lower price volatility of bonds versus stocks."], "ans": "A", "expl": "It is difficult to price individual bond issues in an index because continuous trade data may\nnot exist for some bonds. In addition, it is challenging to create a bond market index\nbecause the bond universe is much broader, and the price volatility of a bond (i.e., its\nduration) changes over time as the bond approaches maturity.\n(Module 40.2, LOS 40.j)"}, {"n": 14, "q": "The first step in developing a security market index is choosing the index's:", "opts": ["constituent securities.", "target market.", "weighting method."], "ans": "B", "expl": "The first decision that must be made is choosing the target market the index will\nrepresent. Only then can the index provider determine which constituent securities should\nbe included and which weighting scheme is most appropriate to measure the target\nmarket's returns.\n(Module 40.1, LOS 40.c)"}, {"n": 15, "q": "When a security is added to a widely followed market index, the security's price is most likely\nto:", "opts": ["be unaffected.", "decrease.", "increase."], "ans": "C", "expl": "Adding a security to a market index typically causes an increase in that security's price as\nportfolio managers who track the index purchase the security.\n(Module 40.2, LOS 40.f)"}, {"n": 16, "q": "The measure of return on a security market index that includes any dividends or interest\npaid by the securities in the index is known as the:", "opts": ["cash flow return.", "price return.", "total return."], "ans": "C", "expl": "The total return on a security market index includes cash flows from the securities\n(dividends and interest) as well as price changes. Price return only accounts for changes in\nthe price of the security. Cash flow return (or yield) refers to the internal rate of return of a\nportfolio.\n(Module 40.1, LOS 40.b)"}, {"n": 17, "q": "The type of securities market index that has a bias toward value stocks is an index with\nweights based on:", "opts": ["earnings.", "security prices.", "market capitalization."], "ans": "A", "expl": "Fundamental-weighted indexes, such as those weighted on earnings, dividends, or book\nvalues, tend to weight value stocks more heavily than growth stocks.\n(Module 40.1, LOS 40.d)"}, {"n": 18, "q": "An index provider maintains a price index and a total return index for the same 40 stocks.\nAssuming both indexes begin the year with the same value, the total return index at the end\nof the year will least likely be:", "opts": ["equal to the price index if the constituent stocks do not pay dividends.", "greater than the price index.", "less than the price index if the price index increases and greater than the price index if the price index decreases."], "ans": "C", "expl": "A price index only includes the prices of the constituent securities in the calculation of the\nindex value. A total return index includes the prices and the dividends paid in the\ncalculation of the index value. If all of the constituents are non-dividend paying stocks,\nthen the total return index will be the same as the price index at the end of the year.\nOtherwise the total return index will be greater than the price index.\n(Module 40.1, LOS 40.b)"}, {"n": 19, "q": "Six months after inception, the price return and the total return of an equal-weighted index\nwill be different if:", "opts": ["capital gains exceed capital losses or vice versa.", "constituent securities have paid dividends.", "market prices have not changed."], "ans": "B", "expl": "The difference between a price and total return index is that cash distributions are\nincluded in a total return index. The two will differ when the constituent securities make\ncash distributions over the period. Otherwise, the two versions will be the same.\n(Module 40.1, LOS 40.b)"}, {"n": 20, "q": "The most appropriate benchmark for measuring the relative performance of an investment\nmanager is:", "opts": ["the risk-adjusted return on the market portfolio.", "an index that matches the manager’s investment approach.", "a broad market index."], "ans": "B", "expl": "An index chosen as a benchmark for an investment manager's performance should\ninclude securities in the manager's investment universe. For example, the performance of\nan emerging market bond fund manager should be measured relative to the performance\nof an emerging market bond index.\n(Module 40.2, LOS 40.g)"}, {"n": 21, "q": "The table below lists information on price per share and shares outstanding for three stocks.\nAs of Beginning of YearAs of End of Year\nPrice per Share# SharesPrice per Share# shares\nStock\n($)Outstanding($)Outstanding\nMertz1010,0001510,000\nNorton505,000505,000\nRubble10050085500\nAt the beginning of the year, the value of a market-cap weighted index of these three stocks\nwas 100. The index value at year-end is closest to:", "opts": ["44.3.", "93.8.", "110.6."], "ans": "C", "expl": "Market-cap weighted index = (ending market capitalization / beginning market\ncapitalization) × beginning index value.\nBeginning market capitalization = (10)(10,000) + (50)(5,000) + (100)(500) = 400,000\nEnding market capitalization = (15)(10,000) + (50)(5,000) + (85)(500) = 442,500\nIndex value = (442,500 / 400,000) × 100 = 110.625\n(Module 40.1, LOS 40.e)", "qhtml": "<p>The table below lists information on price per share and shares outstanding for three stocks.</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>Price per Share (Beginning) ($)</th><th># Shares Outstanding (Beginning)</th><th>Price per Share (End) ($)</th><th># Shares Outstanding (End)</th></tr></thead><tbody><tr><td>Mertz</td><td>10</td><td>10,000</td><td>15</td><td>10,000</td></tr><tr><td>Norton</td><td>50</td><td>5,000</td><td>50</td><td>5,000</td></tr><tr><td>Rubble</td><td>100</td><td>500</td><td>85</td><td>500</td></tr></tbody></table><p>At the beginning of the year, the value of a market-cap weighted index of these three stocks was 100. The index value at year-end is closest to:</p>"}, {"n": 22, "q": "Which of the following statements about a security market index is most accurate?", "opts": ["If an index increases by 5% in one year, the market return for the year is 5%.", "An index must use actual prices from market transactions.", "An index may reflect dividends paid by its constituent securities."], "ans": "C", "expl": "An index that is designed to measure total return will include dividends in its calculation.\nSome security market indexes use estimated prices when actual prices are not available.\nThe percent change in a security market index is the return on a portfolio of its constituent\nsecurities. Whether this represents an estimate of the market return depends on the\nnature and purpose of the index (for example, a security market index may be designed to\nrepresent a particular industry or asset class).\n(Module 40.1, LOS 40.a)"}, {"n": 23, "q": "In one year, a security market index has the following quarterly price returns:\nFirst quarter3%\nSecond quarter4%\nThird quarter-2%\nFourth quarter5%\nThe price return for the year is closest to:", "opts": ["10.00%.", "10.2%.", "9.9%."], "ans": "B", "expl": "Return for the year = (1.03)(1.04)(0.98)(1.05) − 1 = 10.23%.\n(Module 40.1, LOS 40.b)", "qhtml": "<p>In one year, a security market index has the following quarterly price returns:</p><table class=\"qtable\"><tbody><tr><td>First quarter</td><td>3%</td></tr><tr><td>Second quarter</td><td>4%</td></tr><tr><td>Third quarter</td><td>-2%</td></tr><tr><td>Fourth quarter</td><td>5%</td></tr></tbody></table><p>The price return for the year is closest to:</p>"}, {"n": 24, "q": "Which type of stock index must be adjusted for stock splits?", "opts": ["Price weighted index.", "Equal weighted index.", "Market capitalization weighted index."], "ans": "A", "expl": "When computing any price-weighted index, the denominator must be adjusted to take\nstock splits into account.\n(Module 40.1, LOS 40.d)"}, {"n": 25, "q": "Compared to S&P 500 index weighting, an equities index that is weighted based on a\nfundamental factor, such as earnings, will most likely:", "opts": ["have a value tilt.", "have a momentum tilt.", "overweight firms with high EPS."], "ans": "A", "expl": "Compared to the S&P 500 index, which is market cap weighted, an index that is weighted\nbased on fundamentals will have a value tilt. Firms that have a higher earnings weight than\nmarket cap weight will be those with higher earnings yields. Weights are based on firm\nearnings, not earnings per share.\n(Module 40.1, LOS 40.d)"}, {"n": 26, "q": "Contreras Fund is a mutual fund that invests in value stocks. The most appropriate type of\nequity index to use as a benchmark of manager performance for Contreras Fund is a:", "opts": ["style index.", "broad market index.", "sector index."], "ans": "A", "expl": "The index selected as a benchmark for manager performance should represent the\ninvestment universe from which the manager actually selects stocks. If the manager only\ninvests in value stocks, then the most appropriate index is a style index that seeks to\nrepresent the returns from a value strategy. A sector index is appropriate for managers\nwho invest in specific sectors (e.g., technology stocks, emerging market bonds).\n(Module 40.2, LOS 40.g)"}, {"n": 27, "q": "A high yield bond fund states that through active management, the fund's return has\noutperformed an index of Treasury securities by 4% on average over the past five years. As a\nperformance benchmark for this fund, the index chosen is:", "opts": ["inappropriate, because the index return does not reflect active management.", "appropriate.", "inappropriate, because the index does not reflect the actual bonds in which the fund invests."], "ans": "C", "expl": "Security market indexes may be used as benchmarks for the performance of active\nmanagers, but the index chosen should represent the universe of securities from which\nthe manager is choosing. Here, an index of high yield bonds would be a more appropriate\nbenchmark.\n(Module 40.2, LOS 40.f)"}, {"n": 28, "q": "Which type of equity market index is most likely to be adjusted for free float?", "opts": ["Price weighted.", "Value weighted.", "Fundamental weighted."], "ans": "B", "expl": "Value-weighted (market-capitalization weighted) index weights may be based on the total\nvalue of shares available for investment (the market float) rather than on all the\noutstanding shares of a firm.\n(Module 40.1, LOS 40.d)"}, {"n": 29, "q": "Which of the following statements about indexes is CORRECT?", "opts": ["An equal weighted index assumes a proportionate market value investment in each company in the index.", "A price-weighted index assumes an equal number of shares (one of each stock) represented in the index.", "A market weighted series must adjust the denominator to reflect stock splits in the sample over time."], "ans": "B", "expl": "The descriptions of value weighted and unweighted indexes are switched. The\ndenominator of a price-weighted index must be adjusted to reflect stock splits and\nchanges in the sample over time. A market value-weighted series assumes you make a\nproportionate market value investment in each company in the index.\n(Module 40.1, LOS 40.d)"}, {"n": 30, "q": "Which of the following statements regarding bond market indexes is least accurate?", "opts": ["The bond universe is more stable than the stock universe.", "There are more bond issues than stocks.", "Unlike stocks, bonds lack continuous price trading data."], "ans": "A", "expl": "One reason why the creation of a bond index is more difficult than a stock index is due to\nthe fact that the universe of bonds is constantly changing because of numerous new\nissues, bond maturities, calls, and bond sinking funds.\n(Module 40.2, LOS 40.j)"}, {"n": 31, "q": "Equal weighting is the most common weighting methodology for indexes of which of the\nfollowing types of assets?", "opts": ["Equities.", "Fixed income securities.", "Hedge funds."], "ans": "C", "expl": "Most hedge fund indexes are equal-weighted. Equity and fixed income indexes are\npredominately market capitalization weighted.\n(Module 40.2, LOS 40.i)"}, {"n": 32, "q": "Compared to a value-weighted index, the type of index most likely to have a value tilt is a(n):", "opts": ["equal-weighted index.", "fundamental-weighted index.", "price-weighted index."], "ans": "B", "expl": "An index based on company fundamentals, for example on earnings or book value, will\nassign more weight to stocks with low P/E or price-to-book ratios compared to a value-\nweighted index. This is similar to managing an equity portfolio using a value strategy.\n(Module 40.1, LOS 40.e)"}, {"n": 33, "q": "Reconstitution of an index refers to:", "opts": ["changing the methodology used to calculate the value of the index.", "adjusting the weights of the securities that constitute the index.", "removing some securities from the index and adding others."], "ans": "C", "expl": "Reconstitution begins with evaluating the securities in an index against the index's criteria.\nSecurities that are no longer representative of the index are removed and replaced with\ndifferent securities that do meet the criteria. Adjusting the weights of the securities that\nconstitute an index is termed rebalancing.\n(Module 40.2, LOS 40.f)"}, {"n": 34, "q": "Assume a stock index consists of many firms who have recently split their stock. Which of\nthe following weighting schemes will see a bias due to the impact of stock splits?", "opts": ["Price-weighted series.", "Unweighted price series.", "Market value-weighted series."], "ans": "A", "expl": "Firms that split their stock price will have the identical weight before and after the split in\nboth the unweighted and the market value-weighted series. However, in the price-\nweighted series, large successful firms will lose weight within the index due to simply\nsplitting their stock. This creates a downward bias in a price-weighted series. Standard and\nPoor's 500 Index is a market value-weighted index.\n(Module 40.1, LOS 40.d)"}, {"n": 35, "q": "Which of the following statements regarding fixed income indexes is most accurate?", "opts": ["Because some fixed income securities are illiquid, indexes may include estimates of value.", "Compared to stock indexes, turnover is typically lower in fixed income indexes.", "It is typically easier for portfolio managers to replicate a fixed income index than an equity index."], "ans": "A", "expl": "Because some fixed income securities are illiquid, a lack of recent trade prices may result\nin indexes having to estimate values. Unlike stocks, bonds mature and must be replaced in\nfixed income indexes. As a result turnover is higher in fixed income indexes. Illiquidity,\ntransaction costs, and high turnover make it more expensive and difficult for a portfolio\nmanager to replicate a fixed income index than a stock index.\n(Module 40.2, LOS 40.j)"}, {"n": 36, "q": "The Top Banking Index contains stocks in the finance industry that represent more than 90%\nof the total market capitalization for the finance industry. The index is best described as a:", "opts": ["broad market index.", "sector index.", "style index."], "ans": "B", "expl": "A sector index measures the returns for an industry sector such as financials. Style indexes\nmeasure the returns to strategies that are differentiated by market capitalization and by\nvalue or growth. A broad market index typically consists of constituent securities that\nrepresent 90% or more of the total market capitalization for a given market.\n(Module 40.2, LOS 40.h)"}, {"n": 37, "q": "Which of the following is NOT a reason bond market indexes are more difficult to create\nthan stock market indexes?", "opts": ["There is a lack of continuous trade data available for bonds.", "The universe of bonds is much broader than that of stocks.", "Bond deviations tend to be relatively constant."], "ans": "C", "expl": "Bond prices are quite volatile as measured by the bond's duration.\n(Module 40.2, LOS 40.j)"}, {"n": 38, "q": "An index was recently begun with the following two stocks:\nCompany A – 50 shares valued at $2 each.\nCompany B – 10 shares valued at $10 each.\nGiven that the value-weighted index was originally set at 100 and Company A's stock is\ncurrently selling for $4 per share while Company B's stock is still at $10 per share, what is\nthe current value of the price-weighted index and the market-cap-weighted index?\nPrice-weightedMarket-cap-weighted", "opts": ["7 | 150", "7 | 300", "8 | 150"], "ans": "A", "expl": "Price weight = [(4) + (10)] / 2 = 7\nMarket-cap weight = [(4)(50) + (10)(10)] / [(2)(50) + (10)(10)](100) = 150\n(Module 40.1, LOS 40.e)", "qhtml": "<p>An index was recently begun with the following two stocks:</p><table class=\"qtable\"><thead><tr><th>Company</th><th>Shares</th><th>Price</th></tr></thead><tbody><tr><td>Company A</td><td>50</td><td>$2</td></tr><tr><td>Company B</td><td>10</td><td>$10</td></tr></tbody></table><p>Given that the value-weighted index was originally set at 100 and Company A's stock is currently selling for $4 per share while Company B's stock is still at $10 per share, what is the current value of the price-weighted index and the market-cap-weighted index?</p><p><em>Options show → <strong>Price-weighted Index</strong> | <strong>Market-cap-weighted Index</strong></em></p>"}, {"n": 39, "q": "Which of the following equity indexes is an example of a market capitalization weighted\nindex?", "opts": ["Dow Jones Industrial Average.", "MSCI All Country World Index.", "Nikkei Stock Average."], "ans": "B", "expl": "The MSCI All Country World Index is a market capitalization weighted index. The Dow Jones\nIndustrial Average and the Nikkei Stock Average are price-weighted indexes.\n(Module 40.2, LOS 40.i)"}, {"n": 40, "q": "Voluntary reporting of performance by hedge fund managers leads to:", "opts": ["a downward bias in hedge fund index returns.", "an upward bias in hedge fund index returns.", "no appreciable bias in hedge fund index returns."], "ans": "B", "expl": "Empirical studies have shown that since hedge fund managers have the option to report\nperformance results only funds with good results will report. Since funds with poor\nperformance do not report their results, the results of hedge fund indexes will be biased\nupwards.\n(Module 40.2, LOS 40.k)"}, {"n": 41, "q": "Which of the following statements best describes the investment assumption used to\ncalculate an equal weighted price indicator series?", "opts": ["A proportionate market value investment is made for each stock in the index.", "An equal dollar investment is made in each stock in the index.", "An equal number of shares of each stock are used in the index."], "ans": "B", "expl": "An equal weighted price indicator series assumes that an equal dollar investment is made\nin each stock in the index. All stocks carry equal weight regardless of their price or market\nvalue.\n(Module 40.1, LOS 40.d)"}, {"n": 42, "q": "What is the market-cap weighted index of the following three stocks assuming the beginning\nindex value is 100 and a base value of $150,000?\nAs of December 31\nCompanyStock PriceShares Outstanding\nX$15,000\nY$202,500\nZ$601,000", "opts": ["30.", "77.", "100."], "ans": "B", "expl": "The market-cap weighted index = [(($1)(5,000) + ($20)(2,500) + ($60)(1,000))/$150,000](100)\n= ($115,000/$150,000)(100)\n= (0.767)(100)\n= 76.67 or 77\n(Module 40.1, LOS 40.e)", "qhtml": "<p>What is the market-cap weighted index of the following three stocks assuming the beginning index value is 100 and a base value of $150,000?</p><p>As of December 31</p><table class=\"qtable\"><thead><tr><th>Company</th><th>Stock Price</th><th>Shares Outstanding</th></tr></thead><tbody><tr><td>X</td><td>$1</td><td>5,000</td></tr><tr><td>Y</td><td>$20</td><td>2,500</td></tr><tr><td>Z</td><td>$60</td><td>1,000</td></tr></tbody></table>"}, {"n": 43, "q": "The target market for a security market index is best described as the:", "opts": ["investors who will follow the index.", "market or segment the index is designed to measure.", "portfolio managers who will track the index."], "ans": "B", "expl": "The target market of an index is the securities market or portion of a securities market\nthat the index will be designed to represent. The securities from the target market that are\nincluded in the index are called its constituent securities.\n(Module 40.1, LOS 40.c)"}, {"n": 44, "q": "Which of the following sets of indexes are price-weighted?", "opts": ["S&P 500 Index and Dow Jones Industrial Average.", "Dow Jones World Stock Index and Russell Index.", "Dow Jones Industrial Average and Nikkei Dow Jones Stock Market Average."], "ans": "C", "expl": "The Dow Jones World Stock Index, the Russell Index, the S&P 500 Index, and Morgan\nStanley Capital International Index are all market-value weighted. Only the Dow Jones\nIndustrial Average and the Nikkei Dow Jones Stock Market Averages are price-weighted.\n(Module 40.2, LOS 40.i)"}, {"n": 45, "q": "The table below lists information on price per share and shares outstanding for three\ncompanies–Lair Enterprises, Kurlew, Inc., and Mowe, Ltd.\nAs of Beginning of YearAs of End of Year\nPrice Per Share# SharesPrice Per Share# Shares\nStock\n($)Outstanding($)Outstanding\nLair1510,0001010,000\nKurlew455,000605,000\nMowe90500110500\nAssume that at the beginning of the year, the value of the market-weighted index was 100.\nThe one-year return on the market-cap weighted index is closest to:", "opts": ["13.33%.", "30.0%.", "8.33%."], "ans": "C", "expl": "Expand the table as follows:\nAs of\nAs of Beginning of\nEnd of\nYear 1\nYear 1\nPricePrice\nMarketMarket\nPer# SharesPer# Shares\nStockCapitalizationCapitalization\nShareOutstandingShareOutstanding\n(in $)(in $)\n(in $)(in $)\nLair1510,000150,0001010,000100,000\nKurlew455,000225,000605,000300,000\nMowe9050045,00011050055,000\nTotal150420,000180455,000\nFirst, we will calculate the year-end market-cap weighted index value, then we will\ncalculate the return percentage.\nValue of market-cap weighted index = [(market capitalization) / (market\nyear-end\ncapitalization)] × Beginning index value\nbeginning of year\n= (455,000 / 420,000) × 100 = 108.33\nOne-Year Return = [(Index value / Index value) − 1] × 100\nyear-endbeginning of year\n= [(108.33 / 100) − 1] × 100 = 8.33%.\n(Module 40.1, LOS 40.e)", "qhtml": "<p>The table below lists information on price per share and shares outstanding for three companies–Lair Enterprises, Kurlew, Inc., and Mowe, Ltd.</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>Price Per Share (Beginning) ($)</th><th># Shares Outstanding (Beginning)</th><th>Price Per Share (End) ($)</th><th># Shares Outstanding (End)</th></tr></thead><tbody><tr><td>Lair</td><td>15</td><td>10,000</td><td>10</td><td>10,000</td></tr><tr><td>Kurlew</td><td>45</td><td>5,000</td><td>60</td><td>5,000</td></tr><tr><td>Mowe</td><td>90</td><td>500</td><td>110</td><td>500</td></tr></tbody></table><p>Assume that at the beginning of the year, the value of the market-weighted index was 100. The one-year return on the market-cap weighted index is closest to:</p>"}, {"n": 46, "q": "The value of a total return index:", "opts": ["can be calculated by multiplying the beginning value by the geometrically linked series of periodic total returns.", "is determined by the price changes of the securities that constitute the index.", "may increase at either a faster or slower rate than the value of a price return index with the same constituent securities and weights."], "ans": "A", "expl": "The value of a total return index can be calculated by multiplying the beginning value by\nthe geometrically linked series of index total returns. The value of a total return index\nincludes both the price changes of the securities that constitute the index and any cash\nflows from the securities (dividends, interest, and other distributions). A total return index\ncannot increase at a slower rate (or decrease at a faster rate) than an otherwise identical\nprice return index because cash flows from the securities cannot be negative.\n(Module 40.1, LOS 40.b)"}, {"n": 47, "q": "The value of a security market index at the end of December is 1,200. The index returns for\nthe next six months are:\nMonthReturn\nJanuary3.89%\nFebruary8.76%\nMarch−4.74%\nApril6.88%\nMay−5.39%\nJune−8.12%\nThe index value at the end of June is closest to:", "opts": ["1,200.", "1,214.", "1,186."], "ans": "A", "expl": "The index value at the end of June is\n1,200(1.0389)(1.0876)(0.9526)(1.0688)(0.9461)(0.9188) = 1,200.\nNote that the compound rate of return is\n(1.0389)(1.0876)(0.9526)(1.0688)(0.9461)(0.9188) – 1 = 0.\n(Module 40.1, LOS 40.b)", "qhtml": "<p>The value of a security market index at the end of December is 1,200. The index returns for</p><p>the next six months are:</p><table class=\"qtable\"><thead><tr><th>Month</th><th>Return</th></tr></thead><tbody><tr><td>January</td><td>3.89%</td></tr><tr><td>February</td><td>8.76%</td></tr><tr><td>March</td><td>−4.74%</td></tr><tr><td>April</td><td>6.88%</td></tr><tr><td>May</td><td>−5.39%</td></tr><tr><td>June</td><td>−8.12%</td></tr></tbody></table><p>The index value at the end of June is closest to:</p>"}, {"n": 48, "q": "James Investments is calculating an equally weighted index on a four stock portfolio.\nStockNumber of SharesInitial CostCurrent Cost\nW1005.005.00\nX1,00010.0012.50\nY5007.5010.00\nZ15005.008.00\nIf the initial index value is 100, the current index is closest to:", "opts": ["137.9.", "142.6.", "129.5."], "ans": "C", "expl": "First calculate the return relatives and then find the mean of the relatives. The number of\nshares is irrelevant in this question.\n5/5 = 1\n12.5/10 = 1.25\n10/7.50 = 1.33\n8/5 = 1.60\n(1 + 1.25 + 1.33 + 1.60) / 4 = 1.295\n100 × 1.295 = 129.5\n(Module 40.1, LOS 40.e)", "qhtml": "<p>James Investments is calculating an equally weighted index on a four stock portfolio.</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>Number of Shares</th><th>Initial Cost</th><th>Current Cost</th></tr></thead><tbody><tr><td>W</td><td>100</td><td>$5.00</td><td>$5.00</td></tr><tr><td>X</td><td>1,000</td><td>$10.00</td><td>$12.50</td></tr><tr><td>Y</td><td>500</td><td>$7.50</td><td>$10.00</td></tr><tr><td>Z</td><td>1,500</td><td>$5.00</td><td>$8.00</td></tr></tbody></table><p>If the initial index value is 100, the current index is closest to:</p>"}, {"n": 49, "q": "The type of index weighting that produces a portfolio similar to that of a momentum\nstrategy is an index with weights that are:", "opts": ["equal.", "based on fundamentals.", "based on market capitalization."], "ans": "C", "expl": "An index based on market capitalization (value-weighted index) will put more weight over\ntime on the stocks that have increased the most (and less weight on stocks that have\ndecreased the most) in value, which is similar to a momentum strategy that invests heavily\nin stocks that have increased the most in value over the recent past.\n(Module 40.1, LOS 40.d)"}];
const CFG = {"title": "Security Market Indexes", "subtitle": "CFA · Equity Investments · Reading 40 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
<!--qnote-feature-start-->
<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
</body>
