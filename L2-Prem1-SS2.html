ent three-factor model with the factor sensitivities and returns shown in Exhibit 2. The ETF has an active return from security selection of 1.85%. C\"ORO<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-003.webp\" style=\"max-width:min(100%,364px)\" alt=\"Factor Sensitivity ETF Foxtrot Benchmark Factor Return Factor 1 0.60 0.20 5.80% Factor 2 0.20 0.15 4.40% Factor 3 0.05 -0.05 -4.00%\"><\/div><\/details><div class=\"qtext\"><p>The mostrelevant costs for Oosthuizen to consider when selecting an emerging<\/p><p>market ETF investment are:<\/p><\/div>", "subj": "portfolio"}, {"n": 14, "q": "Oosthuizen's investment in the real estate ETF is best described as an example of:", "opts": ["portfolio rebalancing.", "transition management.", "a portfolio completion strategy."], "ans": "C", "expl": "C is correct. because portfolio completion strategies use ETFs to fill a temporary gap in exposure to an asset class, sector, or investment theme or factor. Gaps may arise with changes in external managers or when an existing manager takes an active view that moves the portfolio out of a market segment to which the investor wishes to have continued exposure. The investor may want to retain the manager but use a tactical ETF strategy to maintain exposure to the desired market segment. The investment in the real estate ETF to fill the temporary gap in the strategic exposure as a result of changes in the asset allocation of managers is therefore best described as an example of a portfolio completion strategy.", "explhtml": "<p><b>C is correct.<\/b> because portfolio completion strategies use ETFs to fill a temporary gap<\/p><p>in exposure to an asset class, sector, or investment theme or factor. Gaps may arise with changes in external managers or when an existing manager takes an active view that moves the portfolio out of a market segment to which the investor wishes to have continued exposure. The investor may want to retain the manager but use a tactical ETF strategy to maintain exposure to the desired market segment. The investment in the real estate ETF to fill the temporary gap in the strategic exposure as a result of changes in the asset allocation of managers is therefore best described as an example of a portfolio completion strategy.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Portfolio Management · Carol Oosthuizen<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carol Oosthuizen is a portfolio manager based in South Africa. She allocates part of her investment assets to ETFs. Oosthuizen evaluates several domestically listed emerging market ETFs as possible investments. The ETFs have varying levels of commissions, bid- ask spreads, and management fees. Oosthuizen intends to hold the ETF as a long-term investment in her portfolio. Given her holding period, Oosthuizen considers which costs are most relevant when selecting which ETF to invest in. Oosthuizen notes that in one of her portfolios, the manager of the actively managed funds in the portfolio has changed their asset allocations. This resulted in a temporary underweighting in real estate. The changes did not however breach the target weight thresholds of Oosthuizen's portfolio. Oosthuizen would like to retain the existing manager allocation and given this, decides to invest in a real estate ETF as a tactical strategy to fill this temporary gap in her desired strategic exposure. Oosthuizen next evaluates the expected performance of ETF Echo using a three-factor macroeconomic model. The market forecast expected return for ETF Echo is 5.4%. Oosthuizen uses the information on the model's three factors in Exhibit 1 to calculate the ETF's expected return if her macroeconomic forecasts are realized.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-002.webp\" style=\"max-width:min(100%,512px)\" alt=\"Factor Market Oosthuizen&#x27;s Factor Sensitivity Forecast SAnAAAZA Forecast Inflation -1.5 6.0% 5.4% Unemployment 0.4 18.5% 20.0% GDP growth 1.8 5.5% 6.3%\"><p>Finally, Oosthuizen analyzes ETF Foxtrot using a different three-factor model with the factor sensitivities and returns shown in Exhibit 2. The ETF has an active return from security selection of 1.85%. C\"ORO<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-003.webp\" style=\"max-width:min(100%,364px)\" alt=\"Factor Sensitivity ETF Foxtrot Benchmark Factor Return Factor 1 0.60 0.20 5.80% Factor 2 0.20 0.15 4.40% Factor 3 0.05 -0.05 -4.00%\"><\/div><\/details><div class=\"qtext\"><p>Oosthuizen's investment in the real estate ETF is best described as an example of:<\/p><\/div>", "subj": "portfolio"}, {"n": 15, "q": "If Oosthuizen's macroeconomic forecasts are realized, the return on ETF Echo would be closestto:", "opts": ["2.9%.", "8.3%.", "11.2%."], "ans": "B", "expl": "B is correct. because the return to ETF Echo using the macroeconomic multifactor model is calculated as: Rp= ap + bp1F1+ bp2F2 + bp3F3 Where: Rp = the return to the portfolio / ETF ai = the expected return to the portfolio / ETF bpi = the sensitivity of the portfolio to the given surprise factor Fi = the surprise in the factor = 5.4 - 1.5(5.4% - 6.0%) + 0.4(20.0% - 18.5%) + 1.80(6.3% - 5.5%) = 5.4 - 1.5(-0.6%) + 0.4(1.5%) + 1.8(0.8%) = 5.4 + 0.9% + 0.6% + 1.44% = 5.4 + 2.94% = 8.34%", "explhtml": "<p><b>B is correct.<\/b> because the return to ETF Echo using the macroeconomic multifactor<\/p><p>model is calculated as: Rp= ap + bp1F1+ bp2F2 + bp3F3 Where: Rp = the return to the portfolio / ETF ai = the expected return to the portfolio / ETF bpi = the sensitivity of the portfolio to the given surprise factor Fi = the surprise in the factor = 5.4 - 1.5(5.4% - 6.0%) + 0.4(20.0% - 18.5%) + 1.80(6.3% - 5.5%) = 5.4 - 1.5(-0.6%) + 0.4(1.5%) + 1.8(0.8%) = 5.4 + 0.9% + 0.6% + 1.44% = 5.4 + 2.94% = 8.34%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Portfolio Management · Carol Oosthuizen<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carol Oosthuizen is a portfolio manager based in South Africa. She allocates part of her investment assets to ETFs. Oosthuizen evaluates several domestically listed emerging market ETFs as possible investments. The ETFs have varying levels of commissions, bid- ask spreads, and management fees. Oosthuizen intends to hold the ETF as a long-term investment in her portfolio. Given her holding period, Oosthuizen considers which costs are most relevant when selecting which ETF to invest in. Oosthuizen notes that in one of her portfolios, the manager of the actively managed funds in the portfolio has changed their asset allocations. This resulted in a temporary underweighting in real estate. The changes did not however breach the target weight thresholds of Oosthuizen's portfolio. Oosthuizen would like to retain the existing manager allocation and given this, decides to invest in a real estate ETF as a tactical strategy to fill this temporary gap in her desired strategic exposure. Oosthuizen next evaluates the expected performance of ETF Echo using a three-factor macroeconomic model. The market forecast expected return for ETF Echo is 5.4%. Oosthuizen uses the information on the model's three factors in Exhibit 1 to calculate the ETF's expected return if her macroeconomic forecasts are realized.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-002.webp\" style=\"max-width:min(100%,512px)\" alt=\"Factor Market Oosthuizen&#x27;s Factor Sensitivity Forecast SAnAAAZA Forecast Inflation -1.5 6.0% 5.4% Unemployment 0.4 18.5% 20.0% GDP growth 1.8 5.5% 6.3%\"><p>Finally, Oosthuizen analyzes ETF Foxtrot using a different three-factor model with the factor sensitivities and returns shown in Exhibit 2. The ETF has an active return from security selection of 1.85%. C\"ORO<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-003.webp\" style=\"max-width:min(100%,364px)\" alt=\"Factor Sensitivity ETF Foxtrot Benchmark Factor Return Factor 1 0.60 0.20 5.80% Factor 2 0.20 0.15 4.40% Factor 3 0.05 -0.05 -4.00%\"><\/div><\/details><div class=\"qtext\"><p>If Oosthuizen's macroeconomic forecasts are realized, the return on ETF Echo would<\/p><p>be closestto:<\/p><\/div>", "subj": "portfolio"}, {"n": 16, "q": "The active return of ETF Foxtrot is closestto:", "opts": ["2.1%.", "4.0%.", "6.0%."], "ans": "B", "expl": "B is correct. because the absolute active return of ETF Foxtrot includes the return from factor tilts and security selection. Factor Sensitivity", "explhtml": "<p><b>B is correct.<\/b> because the absolute active return of ETF Foxtrot includes the return<\/p><p>from factor tilts and security selection. Factor Sensitivity<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2a-013.webp\" style=\"max-width:min(100%,595px)\" alt=\"Portfolio Benchmark Difference Factor Return Absolute Contribution to Active Return Factor 1 0.60 0.20 0.40 5.80% 2.32% Factor 2 0.20 0.15 0.05 4.40% 0.22% Factor 3 0.05 -0.05 0.10 4.00% -0.40% Return from factor tilts 2.14% Return from security selection 1.85% Active Return 3.99%\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Portfolio Management · Carol Oosthuizen<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carol Oosthuizen is a portfolio manager based in South Africa. She allocates part of her investment assets to ETFs. Oosthuizen evaluates several domestically listed emerging market ETFs as possible investments. The ETFs have varying levels of commissions, bid- ask spreads, and management fees. Oosthuizen intends to hold the ETF as a long-term investment in her portfolio. Given her holding period, Oosthuizen considers which costs are most relevant when selecting which ETF to invest in. Oosthuizen notes that in one of her portfolios, the manager of the actively managed funds in the portfolio has changed their asset allocations. This resulted in a temporary underweighting in real estate. The changes did not however breach the target weight thresholds of Oosthuizen's portfolio. Oosthuizen would like to retain the existing manager allocation and given this, decides to invest in a real estate ETF as a tactical strategy to fill this temporary gap in her desired strategic exposure. Oosthuizen next evaluates the expected performance of ETF Echo using a three-factor macroeconomic model. The market forecast expected return for ETF Echo is 5.4%. Oosthuizen uses the information on the model's three factors in Exhibit 1 to calculate the ETF's expected return if her macroeconomic forecasts are realized.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-002.webp\" style=\"max-width:min(100%,512px)\" alt=\"Factor Market Oosthuizen&#x27;s Factor Sensitivity Forecast SAnAAAZA Forecast Inflation -1.5 6.0% 5.4% Unemployment 0.4 18.5% 20.0% GDP growth 1.8 5.5% 6.3%\"><p>Finally, Oosthuizen analyzes ETF Foxtrot using a different three-factor model with the factor sensitivities and returns shown in Exhibit 2. The ETF has an active return from security selection of 1.85%. C\"ORO<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-003.webp\" style=\"max-width:min(100%,364px)\" alt=\"Factor Sensitivity ETF Foxtrot Benchmark Factor Return Factor 1 0.60 0.20 5.80% Factor 2 0.20 0.15 4.40% Factor 3 0.05 -0.05 -4.00%\"><\/div><\/details><div class=\"qtext\"><p>The active return of ETF Foxtrot is closestto:<\/p><\/div>", "subj": "portfolio"}, {"n": 17, "q": "Tran's choice of valuation model for Aspen is best supported by:", "opts": ["its dividend level.", "its capital structure.", "the presence of a controlling investor."], "ans": "B", "expl": "B is correct. because an FCFF model would be more appropriate for a levered company with a changing capital structure. If historical data are used to forecast free cash flow growth rates, FCFF growth might reflect fundamentals more clearly than does FCFE growth, which reflects fluctuating amounts of net borrowing. In addition, in a forward-looking context, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify.", "explhtml": "<p><b>B is correct.<\/b> because an FCFF model would be more appropriate for a levered company<\/p><p>with a changing capital structure. If historical data are used to forecast free cash flow growth rates, FCFF growth might reflect fundamentals more clearly than does FCFE growth, which reflects fluctuating amounts of net borrowing. In addition, in a forward-looking context, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation · Emily Tran<\/summary><div class=\"vig-body\"><p>Emily Tran, an equity analyst, uses free cash flow valuation approaches to evaluate three companies: Aspen, Silverton, and Durango.<\/p><p>Tran examines several characteristics of Aspen and makes the following observations. First, Aspen's dividend level differs significantly from the company's capacity to pay dividends. Second, Aspen has a controlling investor who owns 60% of the outstanding voting stock. Finally, Aspen has debt outstanding and the company's capital structure is expected to change. Tran determines that using an FCFF model would be a more appropriate approach than FCFE to value Aspen's equity.<\/p><p>Tran collects the following information to compute Aspen's FCFF: • Cash flow from operations: €175 million • Interest expense included in operating cash flow: €24 million • Investment in working capital: €26 million • Investment in fixed capital: €80 million • Taxrate: 25%<\/p><p>Next, Tran examines Silverton and computes both FCFF and FCFE by adjusting net income. She observes that Silverton recently reported the following non-cash transactions: • €25 million impairment of intangibles • €25 million income from the reversal of a restructuring charge • €15 million net gain from non-operating activities<\/p><p>Tran estimates Silverton's firm value by using a constant-growth FCFF model and the Sallamina infanmatian. following information: • Current FCFF: €240 million • Market value of debt: €1.5 billion • Sustainable growth rate of FCFF: 4% • WACC: 7% • Required return on equity: 8%<\/p><p>Finally, Tran examines Durango, which has recently announced a plan to issue debt to nonunahaco rommon atarl Than pnncidona whothon thie nan will affont futumo CCCE an repurchase common stock. Tran considers whether this plan will affect future FCFE or FCFF.<\/p><\/div><\/details><div class=\"qtext\"><p>Tran's choice of valuation model for Aspen is best supported by:<\/p><\/div>", "subj": "equity"}, {"n": 18, "q": "Aspen's FCFF (in € millions) is:", "opts": ["77.", "87.", "113."], "ans": "C", "expl": "C is correct. because FCFF, starting from operating cash flow, is derived as follows: FCFF = CFO + Int(1 - Tax rate) - FCInv where. CFO = cash flow from operations = 175 Int = interest expense included in operating cash flow = 24 FCInv = investment in fixed capital = 80 Tax rate = 0.25 FCFF = 175 + 24 × (1 - 0.25) - 80 = 113", "explhtml": "<p><b>C is correct.<\/b> because FCFF, starting from operating cash flow, is derived as follows:<\/p><p>FCFF = CFO + Int(1 - Tax rate) - FCInv where. CFO = cash flow from operations = 175 Int = interest expense included in operating cash flow = 24 FCInv = investment in fixed capital = 80 Tax rate = 0.25 FCFF = 175 + 24 × (1 - 0.25) - 80 = 113<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation · Emily Tran<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily Tran, an equity analyst, uses free cash flow valuation approaches to evaluate three companies: Aspen, Silverton, and Durango.<\/p><p>Tran examines several characteristics of Aspen and makes the following observations. First, Aspen's dividend level differs significantly from the company's capacity to pay dividends. Second, Aspen has a controlling investor who owns 60% of the outstanding voting stock. Finally, Aspen has debt outstanding and the company's capital structure is expected to change. Tran determines that using an FCFF model would be a more appropriate approach than FCFE to value Aspen's equity.<\/p><p>Tran collects the following information to compute Aspen's FCFF: • Cash flow from operations: €175 million • Interest expense included in operating cash flow: €24 million • Investment in working capital: €26 million • Investment in fixed capital: €80 million • Taxrate: 25%<\/p><p>Next, Tran examines Silverton and computes both FCFF and FCFE by adjusting net income. She observes that Silverton recently reported the following non-cash transactions: • €25 million impairment of intangibles • €25 million income from the reversal of a restructuring charge • €15 million net gain from non-operating activities<\/p><p>Tran estimates Silverton's firm value by using a constant-growth FCFF model and the Sallamina infanmatian. following information: • Current FCFF: €240 million • Market value of debt: €1.5 billion • Sustainable growth rate of FCFF: 4% • WACC: 7% • Required return on equity: 8%<\/p><p>Finally, Tran examines Durango, which has recently announced a plan to issue debt to nonunahaco rommon atarl Than pnncidona whothon thie nan will affont futumo CCCE an repurchase common stock. Tran considers whether this plan will affect future FCFE or FCFF.<\/p><\/div><\/details><div class=\"qtext\"><p>Aspen's FCFF (in € millions) is:<\/p><\/div>", "subj": "equity"}, {"n": 19, "q": "Silverton's firm value (in € billions) using a constant-growth FCFF model is closest to:", "opts": ["6.2.", "6.8.", "8.3."], "ans": "C", "expl": "C is correct. because firm value using a constant-growth FCFF valuation model is derived as follows: Firm value = FCFF1 / (WACC - 9) = FCFFO(1 + g) / (WACC - 9) where. FCFFO = current FCFF = 240 g= sustainable growth rate of FCFF = 4% WACC = 7% Firm value = 240 x (1 + 0.04) / (0.07 - 0.04) = 8,320 = 8.3 billion", "explhtml": "<p><b>C is correct.<\/b> because firm value using a constant-growth FCFF valuation model is<\/p><p>derived as follows: Firm value = FCFF1 / (WACC - 9) = FCFFO(1 + g) / (WACC - 9) where. FCFFO = current FCFF = 240 g= sustainable growth rate of FCFF = 4% WACC = 7% Firm value = 240 x (1 + 0.04) / (0.07 - 0.04) = 8,320 = 8.3 billion<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation · Emily Tran<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily Tran, an equity analyst, uses free cash flow valuation approaches to evaluate three companies: Aspen, Silverton, and Durango.<\/p><p>Tran examines several characteristics of Aspen and makes the following observations. First, Aspen's dividend level differs significantly from the company's capacity to pay dividends. Second, Aspen has a controlling investor who owns 60% of the outstanding voting stock. Finally, Aspen has debt outstanding and the company's capital structure is expected to change. Tran determines that using an FCFF model would be a more appropriate approach than FCFE to value Aspen's equity.<\/p><p>Tran collects the following information to compute Aspen's FCFF: • Cash flow from operations: €175 million • Interest expense included in operating cash flow: €24 million • Investment in working capital: €26 million • Investment in fixed capital: €80 million • Taxrate: 25%<\/p><p>Next, Tran examines Silverton and computes both FCFF and FCFE by adjusting net income. She observes that Silverton recently reported the following non-cash transactions: • €25 million impairment of intangibles • €25 million income from the reversal of a restructuring charge • €15 million net gain from non-operating activities<\/p><p>Tran estimates Silverton's firm value by using a constant-growth FCFF model and the Sallamina infanmatian. following information: • Current FCFF: €240 million • Market value of debt: €1.5 billion • Sustainable growth rate of FCFF: 4% • WACC: 7% • Required return on equity: 8%<\/p><p>Finally, Tran examines Durango, which has recently announced a plan to issue debt to nonunahaco rommon atarl Than pnncidona whothon thie nan will affont futumo CCCE an repurchase common stock. Tran considers whether this plan will affect future FCFE or FCFF.<\/p><\/div><\/details><div class=\"qtext\"><p>Silverton's firm value (in € billions) using a constant-growth FCFF model is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 20, "q": "Will both Durango's FCFE and FCFF be impacted by its recently announced plan?", "opts": ["Yes", "No, only FCFE will be impacted", "No, only FCFF will be impacted"], "ans": "B", "expl": "B is correct. because FCFE will be affected and FCFF will not be affected. FCFE: An increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense. FCFF: Share repurchases of common stock do not affect FCFF.", "explhtml": "<p><b>B is correct.<\/b> because FCFE will be affected and FCFF will not be affected.<\/p><p>FCFE: An increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense. FCFF: Share repurchases of common stock do not affect FCFF.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation · Emily Tran<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily Tran, an equity analyst, uses free cash flow valuation approaches to evaluate three companies: Aspen, Silverton, and Durango.<\/p><p>Tran examines several characteristics of Aspen and makes the following observations. First, Aspen's dividend level differs significantly from the company's capacity to pay dividends. Second, Aspen has a controlling investor who owns 60% of the outstanding voting stock. Finally, Aspen has debt outstanding and the company's capital structure is expected to change. Tran determines that using an FCFF model would be a more appropriate approach than FCFE to value Aspen's equity.<\/p><p>Tran collects the following information to compute Aspen's FCFF: • Cash flow from operations: €175 million • Interest expense included in operating cash flow: €24 million • Investment in working capital: €26 million • Investment in fixed capital: €80 million • Taxrate: 25%<\/p><p>Next, Tran examines Silverton and computes both FCFF and FCFE by adjusting net income. She observes that Silverton recently reported the following non-cash transactions: • €25 million impairment of intangibles • €25 million income from the reversal of a restructuring charge • €15 million net gain from non-operating activities<\/p><p>Tran estimates Silverton's firm value by using a constant-growth FCFF model and the Sallamina infanmatian. following information: • Current FCFF: €240 million • Market value of debt: €1.5 billion • Sustainable growth rate of FCFF: 4% • WACC: 7% • Required return on equity: 8%<\/p><p>Finally, Tran examines Durango, which has recently announced a plan to issue debt to nonunahaco rommon atarl Than pnncidona whothon thie nan will affont futumo CCCE an repurchase common stock. Tran considers whether this plan will affect future FCFE or FCFF.<\/p><\/div><\/details><div class=\"qtext\"><p>Will both Durango's FCFE and FCFF be impacted by its recently announced plan?<\/p><\/div>", "subj": "equity"}, {"n": 21, "q": "Based on Spencer's scenario analysis, the 10-year break-even inflation rate in Country A will most likely.", "opts": ["decrease.", "remain unchanged.", "increase."], "ans": "A", "expl": "A is correct. because Spencer believes the market's adjustment for inflation contained in the default-free nominal bond is too large. This adjustment is the break- even inflation (BEI) rate. This break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon of the bond plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation. For a 10-year default-free nominal zero-coupon bond the discount rate would be: Discount rate = 1 + IO,10 + 00,10 + т0,10 where: IO, 10 is the interest rate on the 10-year default-free real zero-coupon bond; 00,10 is additional return to compensate for the expected 10-year rate of inflation; and TO,10 is additional return to compensate for the uncertainty related to the 10-year rate of inflation. Then the BEI rate would be the last two terms of the equation, 00,10 + т0,10. Spencer thinks that there is more uncertainty in the forecasts of the 10-year rate than is warranted. That is, she thinks that n0,10 is larger than it should be. Hence, based on her scenario analysis in which the level of uncertainty declines, the 10-year BEI rate in Country A should be lower than the current BEI rate.", "explhtml": "<p><b>A is correct.<\/b> because Spencer believes the market's adjustment for inflation<\/p><p>contained in the default-free nominal bond is too large. This adjustment is the break- even inflation (BEI) rate. This break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon of the bond plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation. For a 10-year default-free nominal zero-coupon bond the discount rate would be: Discount rate = 1 + IO,10 + 00,10 + т0,10 where: IO, 10 is the interest rate on the 10-year default-free real zero-coupon bond; 00,10 is additional return to compensate for the expected 10-year rate of inflation; and TO,10 is additional return to compensate for the uncertainty related to the 10-year rate of inflation. Then the BEI rate would be the last two terms of the equation, 00,10 + т0,10. Spencer thinks that there is more uncertainty in the forecasts of the 10-year rate than is warranted. That is, she thinks that n0,10 is larger than it should be. Hence, based on her scenario analysis in which the level of uncertainty declines, the 10-year BEI rate in Country A should be lower than the current BEI rate.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Rose Spencer<\/summary><div class=\"vig-body\"><p>Rose Spencer works as a portfolio manager for Hutch Investments. She is reviewing an existing fixed-income portfolio and designing a new actively managed portfolio.<\/p><p>Global Fixed Income Portfolio Spencer starts by evaluating the nominal and inflation-adjusted default-free, zero- coupon bonds issued by Country A. As part of her analysis, Spencer determines the 10- year break-even inflation rate for Country A based on the market consensus forecast. Following her review, Spencer believes that the level of uncertainty implied by the consensus forecast is too high. She performs a scenario analysis to determine how a reduced level of uncertainty would impact the 10-year break-even rate of inflation.<\/p><p>Actively Managed Portfolio Spencer is evaluating the Neptune Fund, which is long-only and actively managed. The Fund's holdinqs comprise stocks and bonds and it uses a separate benchmark for these two asset classes. Spencer measures the value added by the Neptune Fund over the past year. The 1-year rates of return for each asset class as well as their allocations at the beginning of the year, are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-004.webp\" style=\"max-width:min(100%,537px)\" alt=\"Neptune Fund Neptune Fund Benchmark Benchmark Allocation (%) Return (%) Allocation (%) Return (%) Stocks 70 -22.5 60 -19.0 Bonds 30 -6.8 40 -8.2\"><p>Spencer proposes a new portfolio which combines the Neptune Fund with a new benchmark to achieve the optimal amount of active risk assuming no constraints. She estimates the Neptune Fund information ratio to be 0.25. Her forecasts of excess returns (expected returns minus the risk-free rate) and risk for the benchmark and the Neptune Fund are presented in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-005.webp\" style=\"max-width:min(100%,512px)\" alt=\"Neptune Fund New Benchmark Forecast excess return (%) 10.0 8.5 Standard deviation of return (%)| 19.0 16.0\"><p>Upon further examination, Spencer discovers that due to the size of some positions taken by the Neptune Fund manager, the new portfolio offering would violate Hutch's position limit policy for individual securities held in client portfolios. Using the fundamental law of active management, she correctly concludes that if Hutch's limit policy were applied to the Neptune Fund, its information ratio would be lower.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Spencer's scenario analysis, the 10-year break-even inflation rate in<\/p><p>Country A will most likely.<\/p><\/div>", "subj": "portfolio"}, {"n": 22, "q": "Based on the Neptune Fund's returns and allocations, the value added attributable to security selection is closest to:", "opts": ["-2.03%.", " evaluating the nominal and inflation-adjusted default-free, zero- coupon bonds issued by Country A. As part of her analysis, Spencer determines the 10- year break-even inflation rate for Country A based on the market consensus forecast. Following her review, Spencer believes that the level of uncertainty implied by the consensus forecast is too high. She performs a scenario analysis to determine how a reduced level of uncertainty would impact the 10-year break-even rate of inflation.<\/p><p>Actively Managed Portfolio Spencer is evaluating the Neptune Fund, which is long-only and actively managed. The Fund's holdinqs comprise stocks and bonds and it uses a separate benchmark for these two asset classes. Spencer measures the value added by the Neptune Fund over the past year. The 1-year rates of return for each asset class as well as their allocations at the beginning of the year, are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-004.webp\" style=\"max-width:min(100%,537px)\" alt=\"Neptune Fund Neptune Fund Benchmark Benchmark Allocation (%) Return (%) Allocation (%) Return (%) Stocks 70 -22.5 60 -19.0 Bonds 30 -6.8 40 -8.2\"><p>Spencer proposes a new portfolio which combines the Neptune Fund with a new benchmark to achieve the optimal amount of active risk assuming no constraints. She estimates the Neptune Fund information ratio to be 0.25. Her forecasts of excess returns (expected returns minus the risk-free rate) and risk for the benchmark and the Neptune Fund are presented in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-005.webp\" style=\"max-width:min(100%,512px)\" alt=\"Neptune Fund New Benchmark Forecast excess return (%) 10.0 8.5 Standard deviation of return (%)| 19.0 16.0\"><p>Upon further examination, Spencer discovers that due to the size of some positions taken by the Neptune Fund manager, the new portfolio offering would violate Hutch's position limit policy for individual securities held in client portfolios. Using the fundamental law of active management, she correctly concludes that if Hutch's limit policy were applied to the Neptune Fund, its information ratio would be lower.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the Neptune Fund's returns and allocations, the value added attributable to<\/p><p>security selection is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 23, "q": "The optimal amount of active risk for the proposed new portfolio offering is closestto:", "opts": ["7.5%.", "9.0%.", "13.3%."], "ans": "A", "expl": "A is correct. because the optimal amount of active risk is calculated as: Optimal o(RA) = (IR/SRB) x oB Where: IR is the information ratio of the Neptune Fund; SRB is the Sharpe ratio of the benchmark; and oB is the standard deviation of return on the benchmark. Using the information from the Exhibit: IR = 0.25 (from the case) SRB = E(RB)/oB = 8.5%/16.0% = 0.5313 Optimal o(RA) = (IR/SRB) × oB = (0.25/0.5313) × 16.0% = 7.529% ~ 7.5%", "explhtml": "<p><b>A is correct.<\/b> because the optimal amount of active risk is calculated as:<\/p><p>Optimal o(RA) = (IR/SRB) x oB Where: IR is the information ratio of the Neptune Fund; SRB is the Sharpe ratio of the benchmark; and oB is the standard deviation of return on the benchmark. Using the information from the Exhibit: IR = 0.25 (from the case) SRB = E(RB)/oB = 8.5%/16.0% = 0.5313 Optimal o(RA) = (IR/SRB) × oB = (0.25/0.5313) × 16.0% = 7.529% ~ 7.5%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2a-015.webp\" style=\"max-width:min(100%,599px)\" alt=\"Neptune Fund Benchmark Forecast excess return (%) 10.0 8.5 Standard deviation of retur (%) 19.0 16.0 Sharpe ratio 0.5263 0.5313\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Rose Spencer<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rose Spencer works as a portfolio manager for Hutch Investments. She is reviewing an existing fixed-income portfolio and designing a new actively managed portfolio.<\/p><p>Global Fixed Income Portfolio Spencer starts by evaluating the nominal and inflation-adjusted default-free, zero- coupon bonds issued by Country A. As part of her analysis, Spencer determines the 10- year break-even inflation rate for Country A based on the market consensus forecast. Following her review, Spencer believes that the level of uncertainty implied by the consensus forecast is too high. She performs a scenario analysis to determine how a reduced level of uncertainty would impact the 10-year break-even rate of inflation.<\/p><p>Actively Managed Portfolio Spencer is evaluating the Neptune Fund, which is long-only and actively managed. The Fund's holdinqs comprise stocks and bonds and it uses a separate benchmark for these two asset classes. Spencer measures the value added by the Neptune Fund over the past year. The 1-year rates of return for each asset class as well as their allocations at the beginning of the year, are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-004.webp\" style=\"max-width:min(100%,537px)\" alt=\"Neptune Fund Neptune Fund Benchmark Benchmark Allocation (%) Return (%) Allocation (%) Return (%) Stocks 70 -22.5 60 -19.0 Bonds 30 -6.8 40 -8.2\"><p>Spencer proposes a new portfolio which combines the Neptune Fund with a new benchmark to achieve the optimal amount of active risk assuming no constraints. She estimates the Neptune Fund information ratio to be 0.25. Her forecasts of excess returns (expected returns minus the risk-free rate) and risk for the benchmark and the Neptune Fund are presented in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-005.webp\" style=\"max-width:min(100%,512px)\" alt=\"Neptune Fund New Benchmark Forecast excess return (%) 10.0 8.5 Standard deviation of return (%)| 19.0 16.0\"><p>Upon further examination, Spencer discovers that due to the size of some positions taken by the Neptune Fund manager, the new portfolio offering would violate Hutch's position limit policy for individual securities held in client portfolios. Using the fundamental law of active management, she correctly concludes that if Hutch's limit policy were applied to the Neptune Fund, its information ratio would be lower.<\/p><\/div><\/details><div class=\"qtext\"><p>The optimal amount of active risk for the proposed new portfolio offering<\/p><p>is closestto:<\/p><\/div>", "subj": "portfolio"}, {"n": 24, "q": "Spencer's conclusion about applying Hutch's policy to the Neptune Fund would most likely be the result of a lower:", "opts": ["portfolio breadth.", "transfer coefficient.", "information coefficient."], "ans": "B", "expl": "B is correct. because based on the full fundamental law of active management, the information ratio (IR) can be expressed as a function of three components—a transfer coefficient (TC), an information coefficient (IC), and breadth, (BR) as follows: IR = (TC) (IC) BR$. Of these three components, only the transfer coefficient would be impacted by Hutch's position limits. The correlation between any set of active weights, Awi, and forecasted active returns, ui, measures the degree to which the investor's forecasts are translated into active weights, called the transfer coefficient (TC). Hutch's position limits would impact the ability of the manager to translate their forecasts into active weights. This limit would reduce the transfer coefficient and hence the information ratio.", "explhtml": "<p><b>B is correct.<\/b> because based on the full fundamental law of active management, the<\/p><p>information ratio (IR) can be expressed as a function of three components—a transfer coefficient (TC), an information coefficient (IC), and breadth, (BR) as follows: IR = (TC) (IC) BR$. Of these three components, only the transfer coefficient would be impacted by Hutch's position limits. The correlation between any set of active weights, Awi, and forecasted active returns, ui, measures the degree to which the investor's forecasts are translated into active weights, called the transfer coefficient (TC). Hutch's position limits would impact the ability of the manager to translate their forecasts into active weights. This limit would reduce the transfer coefficient and hence the information ratio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Rose Spencer<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rose Spencer works as a portfolio manager for Hutch Investments. She is reviewing an existing fixed-income portfolio and designing a new actively managed portfolio.<\/p><p>Global Fixed Income Portfolio Spencer starts by evaluating the nominal and inflation-adjusted default-free, zero- coupon bonds issued by Country A. As part of her analysis, Spencer determines the 10- year break-even inflation rate for Country A based on the market consensus forecast. Following her review, Spencer believes that the level of uncertainty implied by the consensus forecast is too high. She performs a scenario analysis to determine how a reduced level of uncertainty would impact the 10-year break-even rate of inflation.<\/p><p>Actively Managed Portfolio Spencer is evaluating the Neptune Fund, which is long-only and actively managed. The Fund's holdinqs comprise stocks and bonds and it uses a separate benchmark for these two asset classes. Spencer measures the value added by the Neptune Fund over the past year. The 1-year rates of return for each asset class as well as their allocations at the beginning of the year, are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-004.webp\" style=\"max-width:min(100%,537px)\" alt=\"Neptune Fund Neptune Fund Benchmark Benchmark Allocation (%) Return (%) Allocation (%) Return (%) Stocks 70 -22.5 60 -19.0 Bonds 30 -6.8 40 -8.2\"><p>Spencer proposes a new portfolio which combines the Neptune Fund with a new benchmark to achieve the optimal amount of active risk assuming no constraints. She estimates the Neptune Fund information ratio to be 0.25. Her forecasts of excess returns (expected returns minus the risk-free rate) and risk for the benchmark and the Neptune Fund are presented in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-005.webp\" style=\"max-width:min(100%,512px)\" alt=\"Neptune Fund New Benchmark Forecast excess return (%) 10.0 8.5 Standard deviation of return (%)| 19.0 16.0\"><p>Upon further examination, Spencer discovers that due to the size of some positions taken by the Neptune Fund manager, the new portfolio offering would violate Hutch's position limit policy for individual securities held in client portfolios. Using the fundamental law of active management, she correctly concludes that if Hutch's limit policy were applied to the Neptune Fund, its information ratio would be lower.<\/p><\/div><\/details><div class=\"qtext\"><p>Spencer's conclusion about applying Hutch's policy to the Neptune Fund would most<\/p><p>likely be the result of a lower:<\/p><\/div>", "subj": "portfolio"}, {"n": 25, "q": "Based on the sector report, MuzicPlay's continuing residual income after 20 years will most likely be:", "opts": ["negative.", "zero.", "positive."], "ans": "B", "expl": "B is correct. because in a competitive environment, residual income approaches often model ROE fading toward the cost of equity. An ROE equal to the cost of equity would result in residual income of zero. According to the sector report, Muzicplay's ROE will remain at its cost of equity after 20 years. Hence, its continuing residual income will equal zero.", "explhtml": "<p><b>B is correct.<\/b> because in a competitive environment, residual income approaches often<\/p><p>model ROE fading toward the cost of equity. An ROE equal to the cost of equity would result in residual income of zero. According to the sector report, Muzicplay's ROE will remain at its cost of equity after 20 years. Hence, its continuing residual income will equal zero.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Fiona Wai<\/summary><div class=\"vig-body\"><p>Fiona Wai is an analyst at a private equity fund. Wai is analyzing two publicly traded companies in the music industry, MuzicPlay Ltd. and Legendre Entertainment Co.<\/p><p>MuzicPlay MuzicPlay operates in the online music streaming sector. While analyzing the company. Wai refers to a sector report. The report projects that MuzicPlay will reach its peak profitability in the next few years. Thereafter, the company's ROE will decline and then remain equal to its cost of equity after 20 years.<\/p><p>Wai disagrees with the projection in the report. She expects MuzicPlay's low dividend payout ratio will allow it to invest in growth opportunities and generate returns higher than its cost of equity over the long term. In order to calculate the intrinsic value of MuzicPlay's stockusing a multistage residual income model, Wai uses MuzicPlay's information and her own estimates shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-006.webp\" style=\"max-width:min(100%,513px)\" alt=\"Current book value per share $40.00 Estimated annual residual income of Year 20 $8.00 Estimated present value of all residual income $30.00\"><p>from Year 1 to Year 19<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-007.webp\" style=\"max-width:min(100%,513px)\" alt=\"Estimated residual income persistence factor after 20 years 1 Cost of equity 10.0%\"><p>Legendre Legendre's current dividend per share is $1.50. A broker estimates Legendre's required rate of return to be 6.5% and sets a target price for Legendre's stock at $100.00. Wai calculates the implied dividend growth rate using the broker's estimate and the Gordon growth model.<\/p><p>Wai generates her own long-term estimates for Legendre. She also calculates Legendre's sustainable growth rate using her estimates in Exhibit 2 and a DuPont analysis.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-008.webp\" style=\"max-width:min(100%,507px)\" alt=\"Dividend payout ratio 40.0% Profit margin 12.0% Total asset turnover 35.0% Equity multiplier 2.50\"><\/div><\/details><div class=\"qtext\"><p>Based on the sector report, MuzicPlay's continuing residual income after 20 years<\/p><p>will most likely be:<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "Using a multistage residual income model, the intrinsic value of MuzicPlay's stock is closestto:", "opts": ["$71.", "$82.", "$83."], "ans": "C", "expl": "C is correct. because the intrinsic value of the stock based on a multistage residual income model is calculated as: 1)(1+r)t +ET-rBT-1(1+r-w)(1+r)T-1 where BO is the current book value per share of MuzicPlay: $40.00 [T-1t=1 (Et-rBt-1)(1+r)t [t=1T-1 (Et-rBt-1)(1+r)t is the present value of all residual income from Year 1 to Year 19: $30.00 ET-rBT-1ET-rBT-1is the annual residual income of Year 20: $8.00 w=1 as MuzicPlay is expected to have a residual income persistence factor of 1 T= 20 ET-rBT-1(1+r-w)(1+r)T-1=annual residual income of Year 20(1+10%-1)×(1+10%)(20-1) =80.1x(1.1)19ET-rBT-1(1+r-w)(1+r)T-1=annual residual income of Year 20(1+10%- 1)x(1+10%)(20-1)=80.1x(1.1)19 = 13.0806 VO = 40.00 + 30.00 + 13.0806 = $83.0806 = $83", "explhtml": "<p><b>C is correct.<\/b> because the intrinsic value of the stock based on a multistage residual<\/p><p>income model is calculated as:<\/p><p>1)(1+r)t +ET-rBT-1(1+r-w)(1+r)T-1 where BO is the current book value per share of MuzicPlay: $40.00 [T-1t=1 (Et-rBt-1)(1+r)t [t=1T-1 (Et-rBt-1)(1+r)t is the present value of all residual income from Year 1 to Year 19: $30.00 ET-rBT-1ET-rBT-1is the annual residual income of Year 20: $8.00 w=1 as MuzicPlay is expected to have a residual income persistence factor of 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2a-016.webp\" style=\"max-width:min(100%,593px)\" alt=\"= Cost of equity = 10.0%\"><p>T= 20 ET-rBT-1(1+r-w)(1+r)T-1=annual residual income of Year 20(1+10%-1)×(1+10%)(20-1) =80.1x(1.1)19ET-rBT-1(1+r-w)(1+r)T-1=annual residual income of Year 20(1+10%- 1)x(1+10%)(20-1)=80.1x(1.1)19 = 13.0806 VO = 40.00 + 30.00 + 13.0806 = $83.0806 = $83<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Fiona Wai<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Fiona Wai is an analyst at a private equity fund. Wai is analyzing two publicly traded companies in the music industry, MuzicPlay Ltd. and Legendre Entertainment Co.<\/p><p>MuzicPlay MuzicPlay operates in the online music streaming sector. While analyzing the company. Wai refers to a sector report. The report projects that MuzicPlay will reach its peak profitability in the next few years. Thereafter, the company's ROE will decline and then remain equal to its cost of equity after 20 years.<\/p><p>Wai disagrees with the projection in the report. She expects MuzicPlay's low dividend payout ratio will allow it to invest in growth opportunities and generate returns higher than its cost of equity over the long term. In order to calculate the intrinsic value of MuzicPlay's stockusing a multistage residual income model, Wai uses MuzicPlay's information and her own estimates shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-006.webp\" style=\"max-width:min(100%,513px)\" alt=\"Current book value per share $40.00 Estimated annual residual income of Year 20 $8.00 Estimated present valu
