broker's estimate and the Gordon growth model.<\/p><p>Wai generates her own long-term estimates for Legendre. She also calculates Legendre's sustainable growth rate using her estimates in Exhibit 2 and a DuPont analysis.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-008.webp\" style=\"max-width:min(100%,507px)\" alt=\"Dividend payout ratio 40.0% Profit margin 12.0% Total asset turnover 35.0% Equity multiplier 2.50\"><\/div><\/details><div class=\"qtext\"><p>Based on the broker's estimate and the Gordon growth model, the implied growth<\/p><p>rate of Legendre's dividends is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 28, "q": "Based on Wai's estimates and the DuPont analysis, Legendre's sustainable growth rate is closest to:", "opts": ["4.2%.", "6.3%.", "7.2%."], "ans": "C", "expl": "C is correct. because the sustainable growth rate can be calculated from the DuPont analysis: Total assetsxTotal assetsShareholders' equity where (Net Income - Dividends) / Net Income is the retention ratio b = (1 - dividend payout ratio) = 1 - 40.0% = 60.0% Net Income / Sales is the profit margin of 12.0% Sales / Total Assets is the asset turnover of 35.0% Total Assets / Shareholders' equity is the equity multiplier (financial leverage) of 2.50 g = 60.0% × 12.0% × 35.0% × 2.50 = 6.3%", "explhtml": "<p><b>C is correct.<\/b> because the sustainable growth rate can be calculated from the DuPont<\/p><p>analysis:<\/p><p>Total assetsxTotal assetsShareholders' equity where (Net Income - Dividends) / Net Income is the retention ratio b = (1 - dividend payout ratio) = 1 - 40.0% = 60.0% Net Income / Sales is the profit margin of 12.0% Sales / Total Assets is the asset turnover of 35.0% Total Assets / Shareholders' equity is the equity multiplier (financial leverage) of 2.50 g = 60.0% × 12.0% × 35.0% × 2.50 = 6.3%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Fiona Wai<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Fiona Wai is an analyst at a private equity fund. Wai is analyzing two publicly traded companies in the music industry, MuzicPlay Ltd. and Legendre Entertainment Co.<\/p><p>MuzicPlay MuzicPlay operates in the online music streaming sector. While analyzing the company. Wai refers to a sector report. The report projects that MuzicPlay will reach its peak profitability in the next few years. Thereafter, the company's ROE will decline and then remain equal to its cost of equity after 20 years.<\/p><p>Wai disagrees with the projection in the report. She expects MuzicPlay's low dividend payout ratio will allow it to invest in growth opportunities and generate returns higher than its cost of equity over the long term. In order to calculate the intrinsic value of MuzicPlay's stockusing a multistage residual income model, Wai uses MuzicPlay's information and her own estimates shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-006.webp\" style=\"max-width:min(100%,513px)\" alt=\"Current book value per share $40.00 Estimated annual residual income of Year 20 $8.00 Estimated present value of all residual income $30.00\"><p>from Year 1 to Year 19<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-007.webp\" style=\"max-width:min(100%,513px)\" alt=\"Estimated residual income persistence factor after 20 years 1 Cost of equity 10.0%\"><p>Legendre Legendre's current dividend per share is $1.50. A broker estimates Legendre's required rate of return to be 6.5% and sets a target price for Legendre's stock at $100.00. Wai calculates the implied dividend growth rate using the broker's estimate and the Gordon growth model.<\/p><p>Wai generates her own long-term estimates for Legendre. She also calculates Legendre's sustainable growth rate using her estimates in Exhibit 2 and a DuPont analysis.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-008.webp\" style=\"max-width:min(100%,507px)\" alt=\"Dividend payout ratio 40.0% Profit margin 12.0% Total asset turnover 35.0% Equity multiplier 2.50\"><\/div><\/details><div class=\"qtext\"><p>Based on Wai's estimates and the DuPont analysis, Legendre's sustainable growth<\/p><p>rate is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 29, "q": "Based on Metavar's target dividend payout ratio, Kaushal's estimated dividend per share for the current year is closestto:", "opts": ["$1.34.", "$1.43.", "$1.77."], "ans": "A", "expl": "A is correct. because the current year's expected dividend is $1.34 using the target payout adjustment model, as below: Expected dividend = Previous dividend + [(Expected earnings × Target payout ratio - Previous dividend) × Adjustment factor] where Adjustment factor = 1 / number of years over which the adjustment in dividends should take place. From Exhibit 1 (all numbers per share basis): Previous dividend = $1.20 Expected earnings = $9.82 Target payout ratio = 18% Adjustment factor = 1/4 = 0.25 Therefore, the expected dividend per share is calculated as 1.20 + [(9.82 x 0.18 - 1.20) × 0.25] = 1.20 + 0.1419 = 1.3419 ~ 1.34", "explhtml": "<p><b>A is correct.<\/b> because the current year's expected dividend is $1.34 using the target<\/p><p>payout adjustment model, as below: Expected dividend = Previous dividend + [(Expected earnings × Target payout ratio - Previous dividend) × Adjustment factor] where Adjustment factor = 1 / number of years over which the adjustment in dividends should take place. From Exhibit 1 (all numbers per share basis): Previous dividend = $1.20 Expected earnings = $9.82 Target payout ratio = 18% Adjustment factor = 1/4 = 0.25 Therefore, the expected dividend per share is calculated as 1.20 + [(9.82 x 0.18 - 1.20) × 0.25] = 1.20 + 0.1419 = 1.3419 ~ 1.34<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers · Martha Kaushal<\/summary><div class=\"vig-body\"><p>Martha Kaushal is analyzing the dividend and ESG policies of Metavar, a large, mature company that sells consumer durables.<\/p><p>Metavar's current dividend policy represents a gradual adjustment to a target dividend payout ratio. Kaushal collects information about Metavar in Exhibit 1 to estimate the dividend per share for the current year.<\/p><p><b>Exhibit 1<\/b><\/p><p>Target dividend payout ratio 18% Adjustment period for the target dividend payout ratio 4 years<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-009.webp\" style=\"max-width:min(100%,524px)\" alt=\"Prior year dividend per share $1.20 Current year expected EPS $9.82\"><p>Kaushal next evaluates the sustainability of Metavar's dividend policy by reviewing each of the following ratios that cover a range of five years:<\/p><p>• Ratio 1: FCFE coverage ratio of 0.9 to 1.0x; • Ratio 2: Dividend coverage of 2.0 to 2.5x; and • Ratio 3: Leverage ratio of 1.4 to 1.5 times that of Metavar's industry peers.<\/p><p>Kaushal then calculates the total effective tax rate on pretax income distributed as dividends to individual investors. Metavar is in a jurisdiction with a double taxation system, in which the corporate tax rate on pretax income is 30% and the personal tax rate on dividends is 25%.<\/p><p>Finally, Kaushal evaluates Metavar's ESG policies. In particular, she considers the strength of the company's corporate governance compared to two of its competitors and compiles the information in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-010.webp\" style=\"max-width:min(100%,356px)\" alt=\"Ownership Voting Cap Metavar Dispersed No cap on voting\"><p>Competitor 1 Concentrated No cap on voting Competitor 2 Concentrated Cap on voting<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Metavar's target dividend payout ratio, Kaushal's estimated dividend per<\/p><p>share for the current year is closestto:<\/p><\/div>", "subj": "corporate"}, {"n": 30, "q": "Which ratio best supports the sustainability of Metavar's dividend policy?", "opts": ["Ratio 1", "Ratio 2", "Ratio 3"], "ans": "B", "expl": "B is correct. because the dividend coverage ratio in the range of 2.0 to 2.5x reflects good sustainability of dividends for large mature companies over long-term. Metavar is a large, mature company and its dividend coverage ratio results in a dividend payout ratio of 1/2.5 to 1/2 times, i.e., 40% to 50%. Large mature companies often target dividend payout ratios of 40% to 60% so that dividend coverage ratios range from about 1.7 to 2.5 times, excluding \"extra\" payments. Mature companies are expected to be in this range over the course of a 5- to 10-year business cycle.", "explhtml": "<p><b>B is correct.<\/b> because the dividend coverage ratio in the range of 2.0 to 2.5x reflects<\/p><p>good sustainability of dividends for large mature companies over long-term. Metavar is a large, mature company and its dividend coverage ratio results in a dividend payout ratio of 1/2.5 to 1/2 times, i.e., 40% to 50%. Large mature companies often target dividend payout ratios of 40% to 60% so that dividend coverage ratios range from about 1.7 to 2.5 times, excluding \"extra\" payments. Mature companies are expected to be in this range over the course of a 5- to 10-year business cycle.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers · Martha Kaushal<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martha Kaushal is analyzing the dividend and ESG policies of Metavar, a large, mature company that sells consumer durables.<\/p><p>Metavar's current dividend policy represents a gradual adjustment to a target dividend payout ratio. Kaushal collects information about Metavar in Exhibit 1 to estimate the dividend per share for the current year.<\/p><p><b>Exhibit 1<\/b><\/p><p>Target dividend payout ratio 18% Adjustment period for the target dividend payout ratio 4 years<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-009.webp\" style=\"max-width:min(100%,524px)\" alt=\"Prior year dividend per share $1.20 Current year expected EPS $9.82\"><p>Kaushal next evaluates the sustainability of Metavar's dividend policy by reviewing each of the following ratios that cover a range of five years:<\/p><p>• Ratio 1: FCFE coverage ratio of 0.9 to 1.0x; • Ratio 2: Dividend coverage of 2.0 to 2.5x; and • Ratio 3: Leverage ratio of 1.4 to 1.5 times that of Metavar's industry peers.<\/p><p>Kaushal then calculates the total effective tax rate on pretax income distributed as dividends to individual investors. Metavar is in a jurisdiction with a double taxation system, in which the corporate tax rate on pretax income is 30% and the personal tax rate on dividends is 25%.<\/p><p>Finally, Kaushal evaluates Metavar's ESG policies. In particular, she considers the strength of the company's corporate governance compared to two of its competitors and compiles the information in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-010.webp\" style=\"max-width:min(100%,356px)\" alt=\"Ownership Voting Cap Metavar Dispersed No cap on voting\"><p>Competitor 1 Concentrated No cap on voting Competitor 2 Concentrated Cap on voting<\/p><\/div><\/details><div class=\"qtext\"><p>Which ratio best supports the sustainability of Metavar's dividend policy?<\/p><\/div>", "subj": "corporate"}, {"n": 31, "q": "The total effective tax rate on pretax income distributed as dividends to individual investors of Metavar is:", "opts": ["47.5%.", "52.5%.", "55.0%."], "ans": "A", "expl": "A is correct. because the effective tax rate can be calculated as 1 minus the fraction of 1 unit of earnings that investors retain after all taxes. Also note that this calculation does not require an actual EPS number. Under double taxation system: Effective tax rate = 1 - (1 - Corporate tax rate) × (1 - Personal tax rate on dividends) Corporate tax rate = 30% Personal tax rate on dividends = 25% Effective tax rate= 1 - (1 - 30%) × (1 - 25%) = 0.475 = 47.5% Alternative method of calculation: Calculation of double taxation of dividends at 30% corporate tax rate and 25% Personal tax rate (per $100) as shown below: Double tax rate on dividend distributions based on pretax income (pretax income - 47.5% net dividend to shareholders) (100 - 52.5)", "explhtml": "<p><b>A is correct.<\/b> because the effective tax rate can be calculated as 1 minus the fraction<\/p><p>of 1 unit of earnings that investors retain after all taxes. Also note that this calculation does not require an actual EPS number. Under double taxation system: Effective tax rate = 1 - (1 - Corporate tax rate) × (1 - Personal tax rate on dividends) Corporate tax rate = 30% Personal tax rate on dividends = 25% Effective tax rate= 1 - (1 - 30%) × (1 - 25%) = 0.475 = 47.5% Alternative method of calculation: Calculation of double taxation of dividends at 30% corporate tax rate and 25% Personal tax rate (per $100) as shown below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2a-017.webp\" style=\"max-width:min(100%,608px)\" alt=\"Net Income before taxes $100 Net income after taxes $70 Dividend assuming 100% payout $70 Shareholder tax on dividend (dividend payout x Personal tax rate) (70 x 25%) $17.5 Net dividend to shareholders (70 - 17.5) $52.5\"><p>Double tax rate on dividend distributions based on pretax income (pretax income - 47.5% net dividend to shareholders) (100 - 52.5)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers · Martha Kaushal<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martha Kaushal is analyzing the dividend and ESG policies of Metavar, a large, mature company that sells consumer durables.<\/p><p>Metavar's current dividend policy represents a gradual adjustment to a target dividend payout ratio. Kaushal collects information about Metavar in Exhibit 1 to estimate the dividend per share for the current year.<\/p><p><b>Exhibit 1<\/b><\/p><p>Target dividend payout ratio 18% Adjustment period for the target dividend payout ratio 4 years<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-009.webp\" style=\"max-width:min(100%,524px)\" alt=\"Prior year dividend per share $1.20 Current year expected EPS $9.82\"><p>Kaushal next evaluates the sustainability of Metavar's dividend policy by reviewing each of the following ratios that cover a range of five years:<\/p><p>• Ratio 1: FCFE coverage ratio of 0.9 to 1.0x; • Ratio 2: Dividend coverage of 2.0 to 2.5x; and • Ratio 3: Leverage ratio of 1.4 to 1.5 times that of Metavar's industry peers.<\/p><p>Kaushal then calculates the total effective tax rate on pretax income distributed as dividends to individual investors. Metavar is in a jurisdiction with a double taxation system, in which the corporate tax rate on pretax income is 30% and the personal tax rate on dividends is 25%.<\/p><p>Finally, Kaushal evaluates Metavar's ESG policies. In particular, she considers the strength of the company's corporate governance compared to two of its competitors and compiles the information in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-010.webp\" style=\"max-width:min(100%,356px)\" alt=\"Ownership Voting Cap Metavar Dispersed No cap on voting\"><p>Competitor 1 Concentrated No cap on voting Competitor 2 Concentrated Cap on voting<\/p><\/div><\/details><div class=\"qtext\"><p>The total effective tax rate on pretax income distributed as dividends to individual<\/p><p>investors of Metavar is:<\/p><\/div>", "subj": "corporate"}, {"n": 32, "q": "Which of the following companies is most susceptible to a principal-principal problem?", "opts": ["Metavar", "Competitor 1", "Competitor 2"], "ans": "B", "expl": "B is correct. because Competitor 1 has concentrated ownership with no caps on voting which results in concentrated voting power in the hands of the controlling shareholders. This combination results in the controlling shareholders maintaining a position of power over both managers and minority shareholders and is known as the principal-principal problem. Controlling shareholders can allocate companies resources for their own benefit at the expense of minority shareholders.", "explhtml": "<p><b>B is correct.<\/b> because Competitor 1 has concentrated ownership with no caps on voting<\/p><p>which results in concentrated voting power in the hands of the controlling shareholders. This combination results in the controlling shareholders maintaining a position of power over both managers and minority shareholders and is known as the principal-principal problem. Controlling shareholders can allocate companies resources for their own benefit at the expense of minority shareholders.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers · Martha Kaushal<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martha Kaushal is analyzing the dividend and ESG policies of Metavar, a large, mature company that sells consumer durables.<\/p><p>Metavar's current dividend policy represents a gradual adjustment to a target dividend payout ratio. Kaushal collects information about Metavar in Exhibit 1 to estimate the dividend per share for the current year.<\/p><p><b>Exhibit 1<\/b><\/p><p>Target dividend payout ratio 18% Adjustment period for the target dividend payout ratio 4 years<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-009.webp\" style=\"max-width:min(100%,524px)\" alt=\"Prior year dividend per share $1.20 Current year expected EPS $9.82\"><p>Kaushal next evaluates the sustainability of Metavar's dividend policy by reviewing each of the following ratios that cover a range of five years:<\/p><p>• Ratio 1: FCFE coverage ratio of 0.9 to 1.0x; • Ratio 2: Dividend coverage of 2.0 to 2.5x; and • Ratio 3: Leverage ratio of 1.4 to 1.5 times that of Metavar's industry peers.<\/p><p>Kaushal then calculates the total effective tax rate on pretax income distributed as dividends to individual investors. Metavar is in a jurisdiction with a double taxation system, in which the corporate tax rate on pretax income is 30% and the personal tax rate on dividends is 25%.<\/p><p>Finally, Kaushal evaluates Metavar's ESG policies. In particular, she considers the strength of the company's corporate governance compared to two of its competitors and compiles the information in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-010.webp\" style=\"max-width:min(100%,356px)\" alt=\"Ownership Voting Cap Metavar Dispersed No cap on voting\"><p>Competitor 1 Concentrated No cap on voting Competitor 2 Concentrated Cap on voting<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following companies is most susceptible to a principal-principal<\/p><p>problem?<\/p><\/div>", "subj": "corporate"}, {"n": 33, "q": "The risk-neutral default probability for Bond 1 is closest to:", "opts": ["2.20%.", "2.33%.", "2.39%."], "ans": "C", "expl": "C is correct. because in one year, at maturity, the bond payoff will be either the amount of principal plus coupon, i.e., 104.50 (if it does not default), or the recovery of 40.0% of such amount, i.e. 41.80. If we denote the risk-neutral default probability to be p* the probability of survival is 1 - p*. Given that the corporate bond is priced at 100 (par), P* is found as the solution to P*: 100.00 = [104.50 x (1 - p*) + 41.80 x P*]/1.03 (Note that 3% is the one-year risk-free rate.) 103.00 = 104.50 - 104.5 × p* + 41.80 × P* -1.50=-62.70xP* P* = 0.02392 = 2.39%.", "explhtml": "<p><b>C is correct.<\/b> because in one year, at maturity, the bond payoff will be either the<\/p><p>amount of principal plus coupon, i.e., 104.50 (if it does not default), or the recovery of 40.0% of such amount, i.e. 41.80. If we denote the risk-neutral default probability to be p* the probability of survival is 1 - p*. Given that the corporate bond is priced at 100 (par), P* is found as the solution to P*: 100.00 = [104.50 x (1 - p*) + 41.80 x P*]/1.03 (Note that 3% is the one-year risk-free rate.) 103.00 = 104.50 - 104.5 × p* + 41.80 × P* -1.50=-62.70xP* P* = 0.02392 = 2.39%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Fixed Income · Giuseppe Mortale<\/summary><div class=\"vig-body\"><p>Giuseppe Mortale is a financial analyst at an investment fund. Mortale is analyzing the credit risk of publicly traded corporate and securitized debt. The current annual one- year and two-year zero-coupon default-free rates are 3.0% and 3.2%, respectively.<\/p><p>Mortale first looks at Bond 1, a 4.5% annual coupon bond with one year to maturity and trading at par. It has just paid its annual coupon. Mortale estimates a probability of survival for the bond of 97.8%. In case of default, Mortale expects a recovery rate of 40% of the exposure.<\/p><p>Bond 2 has three years to maturity and a modified duration of 2.6. The bond is rated BBB. Mortale expects the bond to be downgraded to a BB rating in one year, so he prepares the partial transition matrix in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-011.webp\" style=\"max-width:min(100%,603px)\" alt=\"From/To | A and Above BBB BB B and Below BBB 2.70 87.00 6.50 3.80 Credit spread n/a 1.50% 3.75% n/a\"><p>Mortale next decides to build a reduced-form credit risk model to predict the credit rating change of Bond 2.<\/p><p>Bond 3 was issued by a high-yield issuer that was recently acquired through a leveraged buyout. The credit term structure of Bond 3's issuer is downward sloping. Mortale considers the market expectations implied by such a term structure.<\/p><\/div><\/details><div class=\"qtext\"><p>The risk-neutral default probability for Bond 1 is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 34, "q": "If Mortale's expectations regarding Bond 2's downgrade occurs, the price decline will be closestto:", "opts": ["0.38%.", "5.85%.", "6.75%."], "ans": "B", "expl": "B is correct. because for each possible transition, the expected percentage price change is the product of the modified duration and the change in the spread. % price change =modified duration × (spread at BBB rating - spread at BB rating) % price change = 2.6 × (1.50% - 3.75%) % price change = -5.85%.", "explhtml": "<p><b>B is correct.<\/b> because for each possible transition, the expected percentage price<\/p><p>change is the product of the modified duration and the change in the spread. % price change =modified duration × (spread at BBB rating - spread at BB rating) % price change = 2.6 × (1.50% - 3.75%) % price change = -5.85%.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Fixed Income · Giuseppe Mortale<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Giuseppe Mortale is a financial analyst at an investment fund. Mortale is analyzing the credit risk of publicly traded corporate and securitized debt. The current annual one- year and two-year zero-coupon default-free rates are 3.0% and 3.2%, respectively.<\/p><p>Mortale first looks at Bond 1, a 4.5% annual coupon bond with one year to maturity and trading at par. It has just paid its annual coupon. Mortale estimates a probability of survival for the bond of 97.8%. In case of default, Mortale expects a recovery rate of 40% of the exposure.<\/p><p>Bond 2 has three years to maturity and a modified duration of 2.6. The bond is rated BBB. Mortale expects the bond to be downgraded to a BB rating in one year, so he prepares the partial transition matrix in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-011.webp\" style=\"max-width:min(100%,603px)\" alt=\"From/To | A and Above BBB BB B and Below BBB 2.70 87.00 6.50 3.80 Credit spread n/a 1.50% 3.75% n/a\"><p>Mortale next decides to build a reduced-form credit risk model to predict the credit rating change of Bond 2.<\/p><p>Bond 3 was issued by a high-yield issuer that was recently acquired through a leveraged buyout. The credit term structure of Bond 3's issuer is downward sloping. Mortale considers the market expectations implied by such a term structure.<\/p><\/div><\/details><div class=\"qtext\"><p>If Mortale's expectations regarding Bond 2's downgrade occurs, the price decline<\/p><p>will be closestto:<\/p><\/div>", "subj": "fixed"}, {"n": 35, "q": "Which of the following is a key input to Mortale's credit risk model?", "opts": ["Default barrier", "Default intensity", "Asset value volatility"], "ans": "B", "expl": "B is correct. because unlike structural models that aim to explain why default occurs, reduced-form models aim to explain statistically when default will occur. This is known as the default time and can be modeled using a Poisson stochastic process. The key parameter in this process is the default intensity.", "explhtml": "<p><b>B is correct.<\/b> because unlike structural models that aim to explain why default occurs,<\/p><p>reduced-form models aim to explain statistically when default will occur. This is known as the default time and can be modeled using a Poisson stochastic process. The key parameter in this process is the default intensity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Fixed Income · Giuseppe Mortale<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Giuseppe Mortale is a financial analyst at an investment fund. Mortale is analyzing the credit risk of publicly traded corporate and securitized debt. The current annual one- year and two-year zero-coupon default-free rates are 3.0% and 3.2%, respectively.<\/p><p>Mortale first looks at Bond 1, a 4.5% annual coupon bond with one year to maturity and trading at par. It has just paid its annual coupon. Mortale estimates a probability of survival for the bond of 97.8%. In case of default, Mortale expects a recovery rate of 40% of the exposure.<\/p><p>Bond 2 has three years to maturity and a modified duration of 2.6. The bond is rated BBB. Mortale expects the bond to be downgraded to a BB rating in one year, so he prepares the partial transition matrix in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-011.webp\" style=\"max-width:min(100%,603px)\" alt=\"From/To | A and Above BBB BB B and Below BBB 2.70 87.00 6.50 3.80 Credit spread n/a 1.50% 3.75% n/a\"><p>Mortale next decides to build a reduced-form credit risk model to predict the credit rating change of Bond 2.<\/p><p>Bond 3 was issued by a high-yield issuer that was recently acquired through a leveraged buyout. The credit term structure of Bond 3's issuer is downward sloping. Mortale considers the market expectations implied by such a term structure.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is a key input to Mortale's credit risk model?<\/p><\/div>", "subj": "fixed"}, {"n": 36, "q": "The shape of the credit term structure for Bond 3's issuer is most likely explained by the market's expectation of:", "opts": ["decreasing leverage and improving margins over time.", "increasing leverage and deteriorating margins over time.", "decreasing leverage and deteriorating margins over time."], "ans": "A", "expl": "A is correct. because high yield issuers in cyclical industries sometimes face a downward-sloping credit term structure because of issuer- or industry-specific reasons. For example, an ownership change resulting from a leveraged buyout may often be accompanied by a significant increase in leverage. In such a case, an inverted credit curve may indicate investor expectations that the new owners will create efficiencies in the restructured organization, leading to improved future cash flows and profitability that will benefit debt investors. The benefit to debt investors from the improved future cash flows expected over time, implies that the company is expected to decrease its leverage and the risk associated with it, and therefore, the longer range of the credit curve shows a lower spread than the shorter range.", "explhtml": "<p><b>A is correct.<\/b> because high yield issuers in cyclical industries sometimes face a<\/p><p>downward-sloping credit term structure because of issuer- or industry-specific reasons. For example, an ownership change resulting from a leveraged buyout may often be accompanied by a significant increase in leverage. In such a case, an inverted credit curve may indicate investor expectations that the new owners will create efficiencies in the restructured organization, leading to improved future cash flows and profitability that will benefit debt investors. The benefit to debt investors from the improved future cash flows expected over time, implies that the company is expected to decrease its leverage and the risk associated with it, and therefore, the longer range of the credit curve shows a lower spread than the shorter range.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Fixed Income · Giuseppe Mortale<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Giuseppe Mortale is a financial analyst at an investment fund. Mortale is analyzing the credit risk of publicly traded corporate and securitized debt. The current annual one- year and two-year zero-coupon default-free rates are 3.0% and 3.2%, respectively.<\/p><p>Mortale first looks at Bond 1, a 4.5% annual coupon bond with one year to maturity and trading at par. It has just paid its annual coupon. Mortale estimates a probability of survival for the bond of 97.8%. In case of default, Mortale expects a recovery rate of 40% of the exposure.<\/p><p>Bond 2 has three years to maturity and a modified duration of 2.6. The bond is rated BBB. Mortale expects the bond to be downgraded to a BB rating in one year, so he prepares the partial transition matrix in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-011.webp\" style=\"max-width:min(100%,603px)\" alt=\"From/To | A and Above BBB BB B and Below BBB 2.70 87.00 6.50 3.80 Credit spread n/a 1.50% 3.75% n/a\"><p>Mortale next decides to build a reduced-form credit risk model to predict the credit rating change of Bond 2.<\/p><p>Bond 3 was issued by a high-yield issuer that was recently acquired through a leveraged buyout. The credit term structure of Bond 3's issuer is downward sloping. Mortale considers the market expectations implied by such a term structure.<\/p><\/div><\/details><div class=\"qtext\"><p>The shape of the credit term structure for Bond 3's issuer is most likely explained<\/p><p>by the market's expectation of:<\/p><\/div>", "subj": "fixed"}, {"n": 37, "q": "The carry benefits of the government bond being evaluated by Lagrange will most likely be:", "opts": ["less than its carry costs.", "equal to its carry costs.", "greater than its carry costs."], "ans": "C", "expl": "C is correct. because the carry benefit (FV of the coupon payment) will be greater than the carry cost. Carry benefits are cash flows the owner might receive for holding the underlying assets (e.g. bond coupon payments). For financial instruments, carry costs are essentially zero.", "explhtml": "<p><b>C is correct.<\/b> because the carry benefit (FV of the coupon payment) will be greater<\/p><p>than the carry cost. Carry benefits are cash flows the owner might receive for holding the underlying assets (e.g. bond coupon payments). For financial instruments, carry costs are essentially zero.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Derivatives · Marcus Lagrange<\/summary><div class=\"vig-body\"><p>Marcus Lagrange is a fixed-income portfolio manager in South Africa. He is reviewing several current and potential derivative positions. All currency amounts are in South African rand (ZAR) and all calculations use an actual/365-day count convention.<\/p><p>Lagrange evaluates a 6-month futures contract on a government bond that pays a 5% fixed annual coupon and trades at par. The current annual risk-free rate is 5% and the bond will pay a coupon three months prior to expiry of the futures contract. Lagrange considers the bond's carry benefits and costs in the context of the carry arbitrage model.<\/p><p>Three months ago, Lagrange purchased a corporate bond forward contract with six months to expiry at a price of 118 (percentage of par). The current forward price is 123, the annualized 3-month (91 day) discount rate is 4.62%, and the 6-month (183 day) discount rate is 4.87%. He determines the current value of the position.<\/p><p>Lagrange wants to buy a European interest rate call option that, if exercised, will fix the interest rate he receives for six months starting three months from now. He decides to value this interest rate option using the Black model and determines the appropriate underlying rate to value the option.<\/p><p>Lagrange holds a fixed-rate bond and is considering using an interest rate swap to hedge the cash flows. He uses the present value factors in Exhibit 1 to price a 4-year interest rate swap with annual resets. MAt, AUAA HIL ANAIA MAAAHA<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-012.webp\" style=\"max-width:min(100%,313px)\" alt=\"Maturity Present Value Factors 1-year 0.9524 2-year 0.9042 3-year 0.8562 4-year 0.8065\"><\/div><\/details><div class=\"qtext\"><p>The carry benefits of the government bond being evaluated by Lagrange will most<\/p><p>likely be:<\/p><\/div>", "subj": "derivatives"}, {"n": 38, "q": "The current value (as a percentage of par) of Lagrange's corporate bond forward position is closestto:", "opts": ["4.78.", "4.88.", "4.94."], "ans": "C", "expl": "C is correct. because the current value of the long corporate bond forward position can be calculated as follows: Vt = PV[Ft - FO] Where. Vt = value of the forward position (percentage of par) Ft= current forward price FO = forward price at initiation The 3-month rate is the appropriate rate for discounting as Lagrange entered into the forward contract with six months to expiration, and it is now three months later. Vt = (123 - 118)/(1+ 0.0462)91/365 = 5/1.00115 = 4.94", "explhtml": "<p><b>C is correct.<\/b> because the current value of the long corporate bond forward position<\/p><p>can be calculated as follows: Vt = PV[Ft - FO] Where. Vt = value of the forward position (percentage of par) Ft= current forward price FO = forward price at initiation The 3-month rate is the appropriate rate for discounting as Lagrange entered into the forward contract with six months to expiration, and it is now three months later. Vt = (123 - 118)/(1+ 0.0462)91/365 = 5/1.00115 = 4.94<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Derivatives · Marcus Lagrange<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marcus Lagrange is a fixed-income portfolio manager in South Africa. He is reviewing several current and potential derivative positions. All currency amounts are in South African rand (ZAR) and all calculations use an actual/365-day count convention.<\/p><p>Lagrange evaluates a 6-month futures contract on a government bond that pays a 5% fixed annual coupon and trades at par. The current annual risk-free rate is 5% and the bond will pay a coupon three months prior to expiry of the futures contract. Lagrange considers the bond's carry benefits and costs in the context of the carry arbitrage model.<\/p><p>Three months ago, Lagrange purchased a corporate bond forward contract with six months to expiry at a price of 118 (percentage of par). The current forward price is 123, the annualized 3-month (91 day) discount rate is 4.62%, and the 6-month (183 day) discount rate is 4.87%. He determines the current value of the position.<\/p><p>Lagrange wants to buy a European interest rate call option that, if exercised, will fix the interest rate he receives for six months starting three months from now. He decides to value this interest rate option using the Black model and determines the appropriate underlying rate to value the option.<\/p><p>Lagrange holds a fixed-rate bond and is considering using an interest rate swap to hedge the cash flows. He uses the present value factors in Exhibit 1 to price a 4-year interest rate swap with annual resets. MAt, AUAA HIL ANAIA MAAAHA<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-012.webp\" style=\"max-width:min(100%,313px)\" alt=\"Maturity Present Value Factors 1-year 0.9524 2-year 0.9042 3-year 0.8562 4-year 0.8065\"><\/div><\/details><div class=\"qtext\"><p>The current value (as a percentage of par) of Lagrange's corporate bond forward<\/p><p>position is closestto:<\/p><\/div>", "subj": "derivatives"}, {"n": 39, "q": "Based on Lagrange's choice of model, the underlying rate for valuing the European interest rate call option is the:", "opts": ["3 × 6 FRA rate.", "3 x 9 FRA rate.", "3-month spot rate."], "ans": "B", "expl": "B is correct. because Lagrange is using the Black model to value the European interest rate option, and as such a forward or futures price is used as the underlying. The 3' 9 FRA rate is the appropriate rate to use to price the European interest rate option as it corresponds with the period for which Lagrange wants to fix the interest rate.", "explhtml": const CFG = {"title": "CFA Premium Mock 1 — Session 2", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();

    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }

}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");

    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");

      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);

  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");

    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,

  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,

};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();

<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(false); }catch(e){} };
  window.showGradedResult=function(){ try{ afterGrade(true); }catch(e){} };

  function afterGrade(restored){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent, !restored);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText, celebrate){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      if(celebrate){ fetchEmoji('face-positive', emoji); confetti(); }
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
