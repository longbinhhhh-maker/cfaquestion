<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n": 1, "q": "Do the Standards require Behie to disclose to Pépin his relation to Aardvark's owner and the fee arrangement?", "opts": ["Yes", "No, he is not required to disclose the fee arrangement", "No, he is not required to disclose his relation to Aardvark's owner"], "ans": "A", "expl": "A is correct. because Behie will need to disclose that his brother is the owner of Aardvark. Behie will also need to disclose the temporary fee discount that his firm receives for directing all client trades to Aardvark. The temporary fee discount received by Behie's firm is an incentive for the adviser to direct trades to one brokerage and not another (which may provide clients with better execution or better pricing). According to Standard VI(A): Members and candidates must maintain their objectivity when rendering investment advice or taking investment action. Investment advice or actions may be perceived to be tainted in numerous situations. Requiring members and candidates to disclose all matters that could be expected to impair the member's or candidate's objectivity allows clients and prospective clients to judge motives and possible biases for themselves.Behie's family with Aardvark's owner may create a perception of bias among both existing and potential clients. Not just actual conflicts of interest, but the appearance of a conflict of interest must be disclosed. Likewise, any waivers, rebates, and other fees for directed trades are acceptable, but must be disclosed to clients to allow them to judge motives and possible biases for themselves.", "explhtml": "<p><b>A is correct.<\/b> because Behie will need to disclose that his brother is the owner of<\/p><p>Aardvark. Behie will also need to disclose the temporary fee discount that his firm receives for directing all client trades to Aardvark. The temporary fee discount received by Behie's firm is an incentive for the adviser to direct trades to one brokerage and not another (which may provide clients with better execution or better pricing). According to Standard VI(A): Members and candidates must maintain their objectivity when rendering investment advice or taking investment action. Investment advice or actions may be perceived to be tainted in numerous situations. Requiring members and candidates to disclose all matters that could be expected to impair the member's or candidate's objectivity allows clients and prospective clients to judge motives and possible biases for themselves.Behie's family with Aardvark's owner may create a perception of bias among both existing and potential clients. Not just actual conflicts of interest, but the appearance of a conflict of interest must be disclosed. Likewise, any waivers, rebates, and other fees for directed trades are acceptable, but must be disclosed to clients to allow them to judge motives and possible biases for themselves.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Ethics · Gordon Behie<\/summary><div class=\"vig-body\"><p>Gordon Behie, CFA, recently set up his own investment advisory firm based in Country 1. Behie's brother owns Aardvark Securities, a brokerage firm with many connections in the international business community. To help build his new business, Behie asks his brother to refer potential clients to him. The first referral is Bernice Pépin, a high-net- worth individual who is risk averse and is domiciled in Country 2. The brother also states that if Behie directs all of his clients' trades through Aardvark, the brother will discount the trading fees that Behie's new firm would have to pay.<\/p><p>Behie meets with Pépin, who provides full details of her portfolio. Behie realizes that the portfolio's stock allocation is heavily exposed to the energy sector. On a follow up call with Pépin, Behie proposes reducing this exposure through a strategy involving the sale of futures contracts on energy commodities. Behie tells Pépin that while futures contracts have several risks, they may also have benefits for her portfolio. Behie uses a proprietary model to select which and how many futures contracts to use for this proposed strategy. He tells Pépin the details of his model and the specific inputs he uses to select these futures contracts for her portfolio.<\/p><p>After their meeting ends, Behie places Pépin's written IPS into his files for record retention purposes. He also puts the recording of the entire call into an electronic filing system. However, Behie decides not to retain a written description of the inputs used in his proprietary model or any of his written notes made during the call. Shortly thereafter, Pépin contacts Behie and asks him to place a limit order to buy shares in XYZ Ltd., a liquid large-cap stock. The current price of XYZ stock is $50 per share and Pépin's limit order is to buy at $45 per share. Behie decides to sell some of his personal holdings in XYZ stock to raise money for his son's education. He first places his personal order to sell XYZ stock at the current market price, and then places Pépin's limit-buy order.<\/p><\/div><\/details><div class=\"qtext\"><p>Do the Standards require Behie to disclose to Pépin his relation to Aardvark's owner<\/p><p>and the fee arrangement?<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Does Behie's proposed strategy involving futures contracts meet the requirements of the Standards with regard to suitability?", "opts": ["Yes", "No, because the strategy is not suitable for Pépin as a risk-averse client", "No, because the impact of the strategy on Pépin's portfolio diversification was not considered"], "ans": "A", "expl": "A is correct. because Standard III(C) on Duties to Client -- Suitability requires that potential investments must analyze the entire portfolio and the recommended rade's impact on the portfolio's diversification. Behie has in fact considered th mpact of the short position in futures contracts on the equity portfolio' diversification, and recommends this approach as a means to reduce the portfolio's risk exposures to firms in the energy sector.Regarding the Reasonable Basis Cdd.WhMahdaiauadiaamwalatianchin nithdliant Standard: When Members and Candidates are in an advisory relationship with a client, they must: (1) a. Make a reasonable inquiry into a client's or prospective client's investment experience, risk and return objectives, and financial constraints prior to making any investment recommendation or taking investment action and must reassess and update this information regularly. b. Determine that an investment is suitable to the client's financial situation and consistent with the client's written objectives, mandates, and constraints before making an investment recommendation or taking investment action. c. Judge the suitability of investments in the context of the client's total portfolio. (2) When Members and Candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must make only investment recommendations or take only investment actions that are consistent with the stated objectives and constraints of the portfolio. Based on the case material, Behie has done all of this.", "explhtml": "<p><b>A is correct.<\/b> because Standard III(C) on Duties to Client -- Suitability requires that<\/p><p>potential investments must analyze the entire portfolio and the recommended rade's impact on the portfolio's diversification. Behie has in fact considered th mpact of the short position in futures contracts on the equity portfolio' diversification, and recommends this approach as a means to reduce the portfolio's risk exposures to firms in the energy sector.Regarding the Reasonable Basis Cdd.WhMahdaiauadiaamwalatianchin nithdliant Standard: When Members and Candidates are in an advisory relationship with a client, they must: (1) a. Make a reasonable inquiry into a client's or prospective client's investment experience, risk and return objectives, and financial constraints prior to making any investment recommendation or taking investment action and must reassess and update this information regularly. b. Determine that an investment is suitable to the client's financial situation and consistent with the client's written objectives, mandates, and constraints before making an investment recommendation or taking investment action. c. Judge the suitability of investments in the context of the client's total portfolio. (2) When Members and Candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must make only investment recommendations or take only investment actions that are consistent with the stated objectives and constraints of the portfolio. Based on the case material, Behie has done all of this.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Ethics · Gordon Behie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gordon Behie, CFA, recently set up his own investment advisory firm based in Country 1. Behie's brother owns Aardvark Securities, a brokerage firm with many connections in the international business community. To help build his new business, Behie asks his brother to refer potential clients to him. The first referral is Bernice Pépin, a high-net- worth individual who is risk averse and is domiciled in Country 2. The brother also states that if Behie directs all of his clients' trades through Aardvark, the brother will discount the trading fees that Behie's new firm would have to pay.<\/p><p>Behie meets with Pépin, who provides full details of her portfolio. Behie realizes that the portfolio's stock allocation is heavily exposed to the energy sector. On a follow up call with Pépin, Behie proposes reducing this exposure through a strategy involving the sale of futures contracts on energy commodities. Behie tells Pépin that while futures contracts have several risks, they may also have benefits for her portfolio. Behie uses a proprietary model to select which and how many futures contracts to use for this proposed strategy. He tells Pépin the details of his model and the specific inputs he uses to select these futures contracts for her portfolio.<\/p><p>After their meeting ends, Behie places Pépin's written IPS into his files for record retention purposes. He also puts the recording of the entire call into an electronic filing system. However, Behie decides not to retain a written description of the inputs used in his proprietary model or any of his written notes made during the call. Shortly thereafter, Pépin contacts Behie and asks him to place a limit order to buy shares in XYZ Ltd., a liquid large-cap stock. The current price of XYZ stock is $50 per share and Pépin's limit order is to buy at $45 per share. Behie decides to sell some of his personal holdings in XYZ stock to raise money for his son's education. He first places his personal order to sell XYZ stock at the current market price, and then places Pépin's limit-buy order.<\/p><\/div><\/details><div class=\"qtext\"><p>Does Behie's proposed strategy involving futures contracts meet the requirements<\/p><p>of the Standards with regard to suitability?<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Are Behie's record retention practices following the initial meeting with Pépin consistent with the Standards?", "opts": ["Yes", "No, with regard to his written notes made during the call", "No, with regard to the inputs used in the proprietary model"], "ans": "A", "expl": "A is correct. because the Standard on Record Retention requires retention for all analysis that underlies a trade recommendation. Behie has retained a written copy of the IPS, as required by the Standards. He has also retained an audio recording of their entire phone conversation, in which the basis for his trade recommendations were discussed Members and Candidates must develop and maintain appropriate records to support their investment analyses, recommendations, actions, and other investment-related communications with clients and prospective clients. Behie discussed with Pépin both the proprietary model and the specific inputs used to make the investment recommendation, so these details were captured on the recording of his phone conversation with Pépin. No written notes (other than the IPS) were saved from the meeting, but Standard V(C) on record retention allows for digital media (such as a phone recording) that preserve information used to support investment recommendations and actions.", "explhtml": "<p><b>A is correct.<\/b> because the Standard on Record Retention requires retention for all<\/p><p>analysis that underlies a trade recommendation. Behie has retained a written copy of the IPS, as required by the Standards. He has also retained an audio recording of their entire phone conversation, in which the basis for his trade recommendations were discussed Members and Candidates must develop and maintain appropriate records to support their investment analyses, recommendations, actions, and other investment-related communications with clients and prospective clients. Behie discussed with Pépin both the proprietary model and the specific inputs used to make the investment recommendation, so these details were captured on the recording of his phone conversation with Pépin. No written notes (other than the IPS) were saved from the meeting, but Standard V(C) on record retention allows for digital media (such as a phone recording) that preserve information used to support investment recommendations and actions.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Ethics · Gordon Behie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gordon Behie, CFA, recently set up his own investment advisory firm based in Country 1. Behie's brother owns Aardvark Securities, a brokerage firm with many connections in the international business community. To help build his new business, Behie asks his brother to refer potential clients to him. The first referral is Bernice Pépin, a high-net- worth individual who is risk averse and is domiciled in Country 2. The brother also states that if Behie directs all of his clients' trades through Aardvark, the brother will discount the trading fees that Behie's new firm would have to pay.<\/p><p>Behie meets with Pépin, who provides full details of her portfolio. Behie realizes that the portfolio's stock allocation is heavily exposed to the energy sector. On a follow up call with Pépin, Behie proposes reducing this exposure through a strategy involving the sale of futures contracts on energy commodities. Behie tells Pépin that while futures contracts have several risks, they may also have benefits for her portfolio. Behie uses a proprietary model to select which and how many futures contracts to use for this proposed strategy. He tells Pépin the details of his model and the specific inputs he uses to select these futures contracts for her portfolio.<\/p><p>After their meeting ends, Behie places Pépin's written IPS into his files for record retention purposes. He also puts the recording of the entire call into an electronic filing system. However, Behie decides not to retain a written description of the inputs used in his proprietary model or any of his written notes made during the call. Shortly thereafter, Pépin contacts Behie and asks him to place a limit order to buy shares in XYZ Ltd., a liquid large-cap stock. The current price of XYZ stock is $50 per share and Pépin's limit order is to buy at $45 per share. Behie decides to sell some of his personal holdings in XYZ stock to raise money for his son's education. He first places his personal order to sell XYZ stock at the current market price, and then places Pépin's limit-buy order.<\/p><\/div><\/details><div class=\"qtext\"><p>Are Behie's record retention practices following the initial meeting with Pépin<\/p><p>consistent with the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "When placing the orders for XYZ stock, does Behie violate the Standard relating to priority of transactions?", "opts": ["No", "Yes, because his personal order will adversely affect the stock price", "Yes, because he should have placed Pépin's order before his personal order"], "ans": "A", "expl": "A is correct. because Behie's market sell order for stock in XYZ at the current market price will not adversely affect his client's buy order for XYZ with a limit order below the current market price. There is no conflict of interest with this transaction: Behie derives no benefit by placing his personal order before the client's order. Nor should there be a perceived conflict of interest because Behie's trade may, in fact, actually benefit the client (by driving the stock price towards the client's execution level, if only at the margin since it is a liquid large-cap stock). Therefore, Standard VI(B) on Priority of Transactions is not violated.Nothing is inherently unethical about individual managers, advisors, or mutual fund employees - from making money from personal investments as long as (1) the client is not disadvantaged by the trade, (2) the investment professional does not benefit personally from trades undertaken for clients, and (3) the investment professional complies with applicable regulatory requirements.", "explhtml": "<p><b>A is correct.<\/b> because Behie's market sell order for stock in XYZ at the current<\/p><p>market price will not adversely affect his client's buy order for XYZ with a limit order below the current market price. There is no conflict of interest with this transaction: Behie derives no benefit by placing his personal order before the client's order. Nor should there be a perceived conflict of interest because Behie's trade may, in fact, actually benefit the client (by driving the stock price towards the client's execution level, if only at the margin since it is a liquid large-cap stock). Therefore, Standard VI(B) on Priority of Transactions is not violated.Nothing is inherently unethical about individual managers, advisors, or mutual fund employees - from making money from personal investments as long as (1) the client is not disadvantaged by the trade, (2) the investment professional does not benefit personally from trades undertaken for clients, and (3) the investment professional complies with applicable regulatory requirements.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Ethics · Gordon Behie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gordon Behie, CFA, recently set up his own investment advisory firm based in Country 1. Behie's brother owns Aardvark Securities, a brokerage firm with many connections in the international business community. To help build his new business, Behie asks his brother to refer potential clients to him. The first referral is Bernice Pépin, a high-net- worth individual who is risk averse and is domiciled in Country 2. The brother also states that if Behie directs all of his clients' trades through Aardvark, the brother will discount the trading fees that Behie's new firm would have to pay.<\/p><p>Behie meets with Pépin, who provides full details of her portfolio. Behie realizes that the portfolio's stock allocation is heavily exposed to the energy sector. On a follow up call with Pépin, Behie proposes reducing this exposure through a strategy involving the sale of futures contracts on energy commodities. Behie tells Pépin that while futures contracts have several risks, they may also have benefits for her portfolio. Behie uses a proprietary model to select which and how many futures contracts to use for this proposed strategy. He tells Pépin the details of his model and the specific inputs he uses to select these futures contracts for her portfolio.<\/p><p>After their meeting ends, Behie places Pépin's written IPS into his files for record retention purposes. He also puts the recording of the entire call into an electronic filing system. However, Behie decides not to retain a written description of the inputs used in his proprietary model or any of his written notes made during the call. Shortly thereafter, Pépin contacts Behie and asks him to place a limit order to buy shares in XYZ Ltd., a liquid large-cap stock. The current price of XYZ stock is $50 per share and Pépin's limit order is to buy at $45 per share. Behie decides to sell some of his personal holdings in XYZ stock to raise money for his son's education. He first places his personal order to sell XYZ stock at the current market price, and then places Pépin's limit-buy order.<\/p><\/div><\/details><div class=\"qtext\"><p>When placing the orders for XYZ stock, does Behie violate the Standard relating to<\/p><p>priority of transactions?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "To comply with the Standard relating to performance presentation, Gataki should request a change to:", "opts": ["Statement 1.", "Statement 2.", "Statement 3."], "ans": "A", "expl": "A is correct. because Statement 1 violates Standard III(D) Performance Presentation. Statement 1 does not clearly indicate that Gataki's returns were generated at her prior firm. If a firm is not claiming compliance with the GIPS standards, members and candidates can also meet their obligations under Standard III(D) by including disclosures that fully explain the performance results being reported (for example, clearly indicating when the performance record is that of a prior entity). Given that this is Gataki's first week of employment with Crete Capital, her returns were generated at her prior firm.", "explhtml": "<p><b>A is correct.<\/b> because Statement 1 violates Standard III(D) Performance<\/p><p>Presentation. Statement 1 does not clearly indicate that Gataki's returns were generated at her prior firm. If a firm is not claiming compliance with the GIPS standards, members and candidates can also meet their obligations under Standard III(D) by including disclosures that fully explain the performance results being reported (for example, clearly indicating when the performance record is that of a prior entity). Given that this is Gataki's first week of employment with Crete Capital, her returns were generated at her prior firm.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Ethics · Anastasia Gataki<\/summary><div class=\"vig-body\"><p>Anastasia Gataki, CFA, was recently hired as a senior investment advisor at Crete Capital (Crete), a large private wealth management firm with discretionary and nondiscretionary accounts. Crete has adopted the Standards as part of its ethics and compliance policy.<\/p><p>On her first day with the firm, Crete's marketing team asks Gataki to approve new marketing materials that will be distributed to current and prospective clients of the firm. The materials include the following three statements about Gataki's performance record:<\/p><p>• Statement 1: Gataki has generated average annual returns of over 13% for her clients. • Statement 2: Two accounts were terminated one year prior to the end of the measurement period and are included in the calculation of average annual returns. • Statement 3: Additional assumptions and data underlying the calculation of average annual returns are publicly available on Crete's website.<\/p><p>Gataki is asked to discuss the CFA Program at a training session for new interns. Gataki encourages the attendees to pursue the charter, but she warns them that the supplementary study materials she purchased from a well-known exam preparation provider did not help much, particularly for the Ethics questions in the exams. Gataki elaborates that all three exams were significantly more difficult than she expected, but she is proud to say that she passed each level of the CFA exam on her first attempt. Gataki receives an e-mail notifying her that Crete has just downgraded its recommendation on HydraPharma stock from \"hold\" to \"sell.\" She immediately sends an e-mail with the updated recommendation to all of her clients. She then sells all shares of HydraPharma held in discretionary accounts. Gataki receives an automatic response from one of Crete's largest nondiscretionary clients, Theo Scala, stating that he is on vacation and unable to receive e-mails. Gataki calls Scala on his cell phone to inform him of the HydraPharma rating downgrade because she knows that he has a large position in the company.<\/p><p>On the call with Gataki, Scala states that he wants to sell all his shares in HydraPharma immediately. He requests that this trade and all future trades for his account be routed through QuickTrader, a small broker recently acquired by one of Scala's business associates. Gataki explains that, although the commissions at QuickTrader are equivalent to those charged by Crete's current broker, AlphaBroker, she knows that Quick Trader's execution is inferior to that of AlphaBroker. The phone connection to Scala is then lost and subsequent attempts to reconnect are unsuccessful. Gataki sends an e-mail to Scala documenting their conversation and decides whether to immediately place the sell order.<\/p><\/div><\/details><div class=\"qtext\"><p>To comply with the Standard relating to performance presentation, Gataki should<\/p><p>request a change to:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Were Gataki's comments about the CFA Program at the training session a violation of the Standards?", "opts": ["No", "Yes, with respect to exam content and difficulty", "Yes, with respect to her performance on the exams"], "ans": "A", "expl": "A is correct. because Gataki's general remarks about (1) the difficulty of the exam and the exam prep provider and (2) her success in passing each exam on the first attempt are not violations of the Standards.Regarding the difficulty of the exam and the exam prep provider not helping with the Ethics section, Standard VII(A) (Conduct as Participants in CFA Institute Programs) does not cover expressing opinions regarding CFA Institute, the CFA Program, or other CFA Institute programs. The character did not violate Standard VII(A) when she wrote about how difficult she found the exam or how well she thinks she may have done. Regarding passing the three exams on three consecutive attempts, Standard I(C) Misrepresentation and Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program require candidates to only make factual statements about their qualifications. A member can state that they \"passed all three CFA Program examinations in three consecutive years.\"", "explhtml": "<p><b>A is correct.<\/b> because Gataki's general remarks about (1) the difficulty of the exam<\/p><p>and the exam prep provider and (2) her success in passing each exam on the first attempt are not violations of the Standards.Regarding the difficulty of the exam and the exam prep provider not helping with the Ethics section, Standard VII(A) (Conduct as Participants in CFA Institute Programs) does not cover expressing opinions regarding CFA Institute, the CFA Program, or other CFA Institute programs. The character did not violate Standard VII(A) when she wrote about how difficult she found the exam or how well she thinks she may have done. Regarding passing the three exams on three consecutive attempts, Standard I(C) Misrepresentation and Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program require candidates to only make factual statements about their qualifications. A member can state that they \"passed all three CFA Program examinations in three consecutive years.\"<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Ethics · Anastasia Gataki<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anastasia Gataki, CFA, was recently hired as a senior investment advisor at Crete Capital (Crete), a large private wealth management firm with discretionary and nondiscretionary accounts. Crete has adopted the Standards as part of its ethics and compliance policy.<\/p><p>On her first day with the firm, Crete's marketing team asks Gataki to approve new marketing materials that will be distributed to current and prospective clients of the firm. The materials include the following three statements about Gataki's performance record:<\/p><p>• Statement 1: Gataki has generated average annual returns of over 13% for her clients. • Statement 2: Two accounts were terminated one year prior to the end of the measurement period and are included in the calculation of average annual returns. • Statement 3: Additional assumptions and data underlying the calculation of average annual returns are publicly available on Crete's website.<\/p><p>Gataki is asked to discuss the CFA Program at a training session for new interns. Gataki encourages the attendees to pursue the charter, but she warns them that the supplementary study materials she purchased from a well-known exam preparation provider did not help much, particularly for the Ethics questions in the exams. Gataki elaborates that all three exams were significantly more difficult than she expected, but she is proud to say that she passed each level of the CFA exam on her first attempt. Gataki receives an e-mail notifying her that Crete has just downgraded its recommendation on HydraPharma stock from \"hold\" to \"sell.\" She immediately sends an e-mail with the updated recommendation to all of her clients. She then sells all shares of HydraPharma held in discretionary accounts. Gataki receives an automatic response from one of Crete's largest nondiscretionary clients, Theo Scala, stating that he is on vacation and unable to receive e-mails. Gataki calls Scala on his cell phone to inform him of the HydraPharma rating downgrade because she knows that he has a large position in the company.<\/p><p>On the call with Gataki, Scala states that he wants to sell all his shares in HydraPharma immediately. He requests that this trade and all future trades for his account be routed through QuickTrader, a small broker recently acquired by one of Scala's business associates. Gataki explains that, although the commissions at QuickTrader are equivalent to those charged by Crete's current broker, AlphaBroker, she knows that Quick Trader's execution is inferior to that of AlphaBroker. The phone connection to Scala is then lost and subsequent attempts to reconnect are unsuccessful. Gataki sends an e-mail to Scala documenting their conversation and decides whether to immediately place the sell order.<\/p><\/div><\/details><div class=\"qtext\"><p>Were Gataki's comments about the CFA Program at the training session a violation<\/p><p>of the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "With regard to the HydraPharma recommendation downgrade, did Gataki violate the Standard relating to fair dealing?", "opts": ["No", "Yes, by calling Scala", "Yes, by selling the shares held in discretionary accounts"], "ans": "A", "expl": "A is correct. because Gataki did not violate Standard III(B) Fair Dealing. She correctly disseminated all of the information to all (both discretionary and nondiscretionary) clients via e-mail, and only then did she take action for discretionary accounts. Members and candidates should establish procedures for the timing of dissemination of investment recommendations so that all clients are treated fairlythat is, are informed at approximately the same time. The fact that she followed up with one client via a phone call is also not a violation because, once distribution has occurred, the member or candidate may follow up separately with individual clients, but members and candidates should not give favored clients advance information when such advance notification may disadvantage other clients. Furthermore, it is clear that Gataki maintained a list of clients and their holdings: Members and candidates should maintain a list of all clients and the securities or other investments each client holds in order to facilitate notification of customers or clients of a change in an investment recommendation. If a particular security or other investment is to be sold, such a list can be used to ensure that all holders are treated fairly in the liquidation of that particular investment.", "explhtml": "<p><b>A is correct.<\/b> because Gataki did not violate Standard III(B) Fair Dealing. She<\/p><p>correctly disseminated all of the information to all (both discretionary and nondiscretionary) clients via e-mail, and only then did she take action for discretionary accounts. Members and candidates should establish procedures for the timing of dissemination of investment recommendations so that all clients are treated fairlythat is, are informed at approximately the same time. The fact that she followed up with one client via a phone call is also not a violation because, once distribution has occurred, the member or candidate may follow up separately with individual clients, but members and candidates should not give favored clients advance information when such advance notification may disadvantage other clients. Furthermore, it is clear that Gataki maintained a list of clients and their holdings: Members and candidates should maintain a list of all clients and the securities or other investments each client holds in order to facilitate notification of customers or clients of a change in an investment recommendation. If a particular security or other investment is to be sold, such a list can be used to ensure that all holders are treated fairly in the liquidation of that particular investment.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Ethics · Anastasia Gataki<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anastasia Gataki, CFA, was recently hired as a senior investment advisor at Crete Capital (Crete), a large private wealth management firm with discretionary and nondiscretionary accounts. Crete has adopted the Standards as part of its ethics and compliance policy.<\/p><p>On her first day with the firm, Crete's marketing team asks Gataki to approve new marketing materials that will be distributed to current and prospective clients of the firm. The materials include the following three statements about Gataki's performance record:<\/p><p>• Statement 1: Gataki has generated average annual returns of over 13% for her clients. • Statement 2: Two accounts were terminated one year prior to the end of the measurement period and are included in the calculation of average annual returns. • Statement 3: Additional assumptions and data underlying the calculation of average annual returns are publicly available on Crete's website.<\/p><p>Gataki is asked to discuss the CFA Program at a training session for new interns. Gataki encourages the attendees to pursue the charter, but she warns them that the supplementary study materials she purchased from a well-known exam preparation provider did not help much, particularly for the Ethics questions in the exams. Gataki elaborates that all three exams were significantly more difficult than she expected, but she is proud to say that she passed each level of the CFA exam on her first attempt. Gataki receives an e-mail notifying her that Crete has just downgraded its recommendation on HydraPharma stock from \"hold\" to \"sell.\" She immediately sends an e-mail with the updated recommendation to all of her clients. She then sells all shares of HydraPharma held in discretionary accounts. Gataki receives an automatic response from one of Crete's largest nondiscretionary clients, Theo Scala, stating that he is on vacation and unable to receive e-mails. Gataki calls Scala on his cell phone to inform him of the HydraPharma rating downgrade because she knows that he has a large position in the company.<\/p><p>On the call with Gataki, Scala states that he wants to sell all his shares in HydraPharma immediately. He requests that this trade and all future trades for his account be routed through QuickTrader, a small broker recently acquired by one of Scala's business associates. Gataki explains that, although the commissions at QuickTrader are equivalent to those charged by Crete's current broker, AlphaBroker, she knows that Quick Trader's execution is inferior to that of AlphaBroker. The phone connection to Scala is then lost and subsequent attempts to reconnect are unsuccessful. Gataki sends an e-mail to Scala documenting their conversation and decides whether to immediately place the sell order.<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to the HydraPharma recommendation downgrade, did Gataki violate the<\/p><p>Standard relating to fair dealing?<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "Regarding Scala's request to sell HydraPharma shares, to comply with the Standards, Gataki should:", "opts": ["immediately place the sell order with AlphaBroker.", "immediately place the sell order with QuickTrader.", "not place the sell order until she receives written instruction from Scala."], "ans": "B", "expl": "B is correct. because Scala instructed Gataki to route this trade and all future trades for his account be routed through QuickTrader, a small broker recently acquired by one of Scala's business associates. According to the guidance for Standard III(A) Loyalty, Prudence, and Care, from time to time, a client will direct a manager to use the client's brokerage to purchase goods or services for the client, a practice that is commonly called 'directed brokerage.' Because brokerage commission is an asset of the client and is used to benefit that client, not the manager, such a practice does not violate any duty of loyalty. While Gataki does not know the direct benefit to the client, using QuickTrader could provide other business-related benefits to Scala. Thus, Gataki should execute the trade through the nondiscretionary client's preferred broker, QuickTrader.", "explhtml": "<p><b>B is correct.<\/b> because Scala instructed Gataki to route this trade and all future trades<\/p><p>for his account be routed through QuickTrader, a small broker recently acquired by one of Scala's business associates. According to the guidance for Standard III(A) Loyalty, Prudence, and Care, from time to time, a client will direct a manager to use the client's brokerage to purchase goods or services for the client, a practice that is commonly called 'directed brokerage.' Because brokerage commission is an asset of the client and is used to benefit that client, not the manager, such a practice does not violate any duty of loyalty. While Gataki does not know the direct benefit to the client, using QuickTrader could provide other business-related benefits to Scala. Thus, Gataki should execute the trade through the nondiscretionary client's preferred broker, QuickTrader.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Ethics · Anastasia Gataki<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anastasia Gataki, CFA, was recently hired as a senior investment advisor at Crete Capital (Crete), a large private wealth management firm with discretionary and nondiscretionary accounts. Crete has adopted the Standards as part of its ethics and compliance policy.<\/p><p>On her first day with the firm, Crete's marketing team asks Gataki to approve new marketing materials that will be distributed to current and prospective clients of the firm. The materials include the following three statements about Gataki's performance record:<\/p><p>• Statement 1: Gataki has generated average annual returns of over 13% for her clients. • Statement 2: Two accounts were terminated one year prior to the end of the measurement period and are included in the calculation of average annual returns. • Statement 3: Additional assumptions and data underlying the calculation of average annual returns are publicly available on Crete's website.<\/p><p>Gataki is asked to discuss the CFA Program at a training session for new interns. Gataki encourages the attendees to pursue the charter, but she warns them that the supplementary study materials she purchased from a well-known exam preparation provider did not help much, particularly for the Ethics questions in the exams. Gataki elaborates that all three exams were significantly more difficult than she expected, but she is proud to say that she passed each level of the CFA exam on her first attempt. Gataki receives an e-mail notifying her that Crete has just downgraded its recommendation on HydraPharma stock from \"hold\" to \"sell.\" She immediately sends an e-mail with the updated recommendation to all of her clients. She then sells all shares of HydraPharma held in discretionary accounts. Gataki receives an automatic response from one of Crete's largest nondiscretionary clients, Theo Scala, stating that he is on vacation and unable to receive e-mails. Gataki calls Scala on his cell phone to inform him of the HydraPharma rating downgrade because she knows that he has a large position in the company.<\/p><p>On the call with Gataki, Scala states that he wants to sell all his shares in HydraPharma immediately. He requests that this trade and all future trades for his account be routed through QuickTrader, a small broker recently acquired by one of Scala's business associates. Gataki explains that, although the commissions at QuickTrader are equivalent to those charged by Crete's current broker, AlphaBroker, she knows that Quick Trader's execution is inferior to that of AlphaBroker. The phone connection to Scala is then lost and subsequent attempts to reconnect are unsuccessful. Gataki sends an e-mail to Scala documenting their conversation and decides whether to immediately place the sell order.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Scala's request to sell HydraPharma shares, to comply with the<\/p><p>Standards, Gataki should:<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "Based on the labor productivity growth accounting equation, the growth rate in Country A's potential GDP is closest to:", "opts": ["3.0%.", "3.2%.", "3.6%."], "ans": "B", "expl": "B is correct. because according to the labor productivity growth accounting equation, potential GDP growth is given as the sum of long-term growth rate of the labor force and long-term growth rate of labor productivity. 1% + 2.2% = 3.2%.", "explhtml": "<p><b>B is correct.<\/b> because according to the labor productivity growth accounting equation,<\/p><p>potential GDP growth is given as the sum of long-term growth rate of the labor force and long-term growth rate of labor productivity. 1% + 2.2% = 3.2%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics · Elana Grosky<\/summary><div class=\"vig-body\"><p>Elana Grosky is writing a report on Country A, a developed nation with a strong industrial base and a large financial sector.<\/p><p>Growth in Country A Grosky uses the labor productivity growth accounting equation and the selected data for Country A in Exhibit 1 to update her estimate of the growth rate in Country A's potential GDP.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-001.webp\" style=\"max-width:min(100%,372px)\" alt=\"Long-term growth rate of capital 2.0% Long-term growth rate of labor force 1.0%\"><p>Long-term growth rate in labor productivity 2.2% Relative share of capital in national income 0.4<\/p><p>Grosky estimates a 1.0% long-term growth rate in Country A's labor force. She summarizes other labor-force characteristics of Country A as follows:<\/p><p>• Declining average hours worked • Stable labor force participation rate • Net immigration • High percentage of population aged over 65 • Low percentage of population aged under 15 Grosky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 1.3% as a result of the following revisions: Grosky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 1.3% as a result of the following revisions:<\/p><p>• A 0.3% higher estimated real growth rate in potential GDP • A 1.0% lower estimate of short-term real GDP growth Grosky studies a report written by the research department at Country A's central bank. The report strongly supports the idea of constant returns to aggregate capital accumulation in Country A. Based on this, the research department recommends that, in order to achieve a permanent increase of the growth rate in output per worker, the government should develop appropriate policies aimed at increasing savings rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the labor productivity growth accounting equation, the growth rate in<\/p><p>Country A's potential GDP is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 10, "q": "Grosky's revisions to her growth forecasts for Country A most likely imply:", "opts": ["lower expected long-term equity returns and higher expected short-term inflation.", "higher expected long-term equity returns and lower expected short-term inflation.", "higher expected long-term equity returns and higher expected short-term inflation."], "ans": "B", "expl": "B is correct. because a higher growth rate in potential output implies higher long-term equity returns while a widening of the gap between the growth rate in potential GDP and short-term GDP growth is an indication of slack in the economy, which puts downward pressure on short-term inflation. This relationship holds even if the gap is negative. The main point is that the gap widens, the absolute value does not matter. Actual GDP growth above (below) the potential GDP growth rate puts upward (downward) pressure on inflation, which puts corresponding pressure on nominal interest rates and bond prices. The growth rate of potential GDP is also an important factor for the level of real interest rates and, therefore, real asset returns in general. Faster growth in potential GDP translates into higher real interest rates and higher expected real asset returns in general.", "explhtml": "<p><b>B is correct.<\/b> because a higher growth rate in potential output implies higher long-term<\/p><p>equity returns while a widening of the gap between the growth rate in potential GDP and short-term GDP growth is an indication of slack in the economy, which puts downward pressure on short-term inflation. This relationship holds even if the gap is negative. The main point is that the gap widens, the absolute value does not matter. Actual GDP growth above (below) the potential GDP growth rate puts upward (downward) pressure on inflation, which puts corresponding pressure on nominal interest rates and bond prices. The growth rate of potential GDP is also an important factor for the level of real interest rates and, therefore, real asset returns in general. Faster growth in potential GDP translates into higher real interest rates and higher expected real asset returns in general.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics · Elana Grosky<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elana Grosky is writing a report on Country A, a developed nation with a strong industrial base and a large financial sector.<\/p><p>Growth in Country A Grosky uses the labor productivity growth accounting equation and the selected data for Country A in Exhibit 1 to update her estimate of the growth rate in Country A's potential GDP.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-001.webp\" style=\"max-width:min(100%,372px)\" alt=\"Long-term growth rate of capital 2.0% Long-term growth rate of labor force 1.0%\"><p>Long-term growth rate in labor productivity 2.2% Relative share of capital in national income 0.4<\/p><p>Grosky estimates a 1.0% long-term growth rate in Country A's labor force. She summarizes other labor-force characteristics of Country A as follows:<\/p><p>• Declining average hours worked • Stable labor force participation rate • Net immigration • High percentage of population aged over 65 • Low percentage of population aged under 15 Grosky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 1.3% as a result of the following revisions: Grosky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 1.3% as a result of the following revisions:<\/p><p>• A 0.3% higher estimated real growth rate in potential GDP • A 1.0% lower estimate of short-term real GDP growth Grosky studies a report written by the research department at Country A's central bank. The report strongly supports the idea of constant returns to aggregate capital accumulation in Country A. Based on this, the research department recommends that, in order to achieve a permanent increase of the growth rate in output per worker, the government should develop appropriate policies aimed at increasing savings rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Grosky's revisions to her growth forecasts for Country A most likely imply:<\/p><\/div>", "subj": "economics"}, {"n": 11, "q": "The research department's recommendation for Country A is most consistent with:", "opts": ["classical growth theory.", "endogenous growth theory.", "neoclassical growth theory."], "ans": "B", "expl": "B is correct. because constant returns to aggregate capital accumulation are a distinctive feature of endogenous growth theory. Only endogenous growth theory implies that an increase in the savings rate will permanently increase the growth rate of output per worker. Output per worker grows at the same rate as capital per worker.", "explhtml": "<p><b>B is correct.<\/b> because constant returns to aggregate capital accumulation are a<\/p><p>distinctive feature of endogenous growth theory. Only endogenous growth theory implies that an increase in the savings rate will permanently increase the growth rate of output per worker. Output per worker grows at the same rate as capital per worker.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics · Elana Grosky<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elana Grosky is writing a report on Country A, a developed nation with a strong industrial base and a large financial sector.<\/p><p>Growth in Country A Grosky uses the labor productivity growth accounting equation and the selected data for Country A in Exhibit 1 to update her estimate of the growth rate in Country A's potential GDP.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-001.webp\" style=\"max-width:min(100%,372px)\" alt=\"Long-term growth rate of capital 2.0% Long-term growth rate of labor force 1.0%\"><p>Long-term growth rate in labor productivity 2.2% Relative share of capital in national income 0.4<\/p><p>Grosky estimates a 1.0% long-term growth rate in Country A's labor force. She summarizes other labor-force characteristics of Country A as follows:<\/p><p>• Declining average hours worked • Stable labor force participation rate • Net immigration • High percentage of population aged over 65 • Low percentage of population aged under 15 Grosky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 1.3% as a result of the following revisions: Grosky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 1.3% as a result of the following revisions:<\/p><p>• A 0.3% higher estimated real growth rate in potential GDP • A 1.0% lower estimate of short-term real GDP growth Grosky studies a report written by the research department at Country A's central bank. The report strongly supports the idea of constant returns to aggregate capital accumulation in Country A. Based on this, the research department recommends that, in order to achieve a permanent increase of the growth rate in output per worker, the government should develop appropriate policies aimed at increasing savings rates.<\/p><\/div><\/details><div class=\"qtext\"><p>The research department's recommendation for Country A is most consistent with:<\/p><\/div>", "subj": "economics"}, {"n": 12, "q": "Grosky's estimated long-term growth rate in Country A's labor force is best supported by Country A's:", "opts": ["net immigration", "percentage of population aged over 65", "percentage of population aged under 15"], "ans": "A", "expl": "A is correct. because the other factors related to the labor-force growth rate are not favorable for Country A. Specifically, average hours worked are declining, the labor force participation rate is stable, there is a low percentage of population aged under 15, and a high percentage of population aged over 65. Growth in the labor force depends on four factors: population growth, labor force participation, net immigration, and average hours worked. Furthermore, immigration commonly increases population growth, especially in developed countries.", "explhtml": "<p><b>A is correct.<\/b> because the other factors related to the labor-force growth rate are<\/p><p>not favorable for Country A. Specifically, average hours worked are declining, the labor force participation rate is stable, there is a low percentage of population aged under 15, and a high percentage of population aged over 65. Growth in the labor force depends on four factors: population growth, labor force participation, net immigration, and average hours worked. Furthermore, immigration commonly increases population growth, especially in developed countries.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics · Elana Grosky<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elana Grosky is writing a report on Country A, a developed nation with a strong industrial base and a large financial sector.<\/p><p>Growth in Country A Grosky uses the labor productivity growth accounting equation and the selected data for Country A in Exhibit 1 to update her estimate of the growth rate in Country A's potential GDP.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-001.webp\" style=\"max-width:min(100%,372px)\" alt=\"Long-term growth rate of capital 2.0% Long-term growth rate of labor force 1.0%\"><p>Long-term growth rate in labor productivity 2.2% Relative share of capital in national income 0.4<\/p><p>Grosky estimates a 1.0% long-term growth rate in Country A's labor force. She summarizes other labor-force characteristics of Country A as follows:<\/p><p>• Declining average hours worked • Stable labor force participation rate • Net immigration • High percentage of population aged over 65 • Low percentage of population aged under 15 Grosky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 1.3% as a result of the following revisions: Grosky estimates that the output gap, defined as the difference between the real growth rate in potential GDP and short-term real GDP growth, has widened by 1.3% as a result of the following revisions:<\/p><p>• A 0.3% higher estimated real growth rate in potential GDP • A 1.0% lower estimate of short-term real GDP growth Grosky studies a report written by the research department at Country A's central bank. The report strongly supports the idea of constant returns to aggregate capital accumulation in Country A. Based on this, the research department recommends that, in order to achieve a permanent increase of the growth rate in output per worker, the government should develop appropriate policies aimed at increasing savings rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Grosky's estimated long-term growth rate in Country A's labor force<\/p><p>is best supported by Country A's:<\/p><\/div>", "subj": "economics"}, {"n": 13, "q": "The mostrelevant costs for Oosthuizen to consider when selecting an emerging market ETF investment are:", "opts": ["commissions.", "bid-ask spreads. ( manaament fana", "management fees."], "ans": "C", "expl": "C is correct. because management fees will have a bigger impact on the cost of owning the ETF over the long term. Management fees, tracking error, and other costs that accumulate over longer holding periods will be more important considerations in deciding on the appropriate ETF to use as a long-term investment in a portfolio. Liquidity and trading costs (commissions, bid-ask spreads, premiums/discounts) are more significant considerations for active, short-term ETF investors who trade frequently.", "explhtml": "<p><b>C is correct.<\/b> because management fees will have a bigger impact on the cost of owning<\/p><p>the ETF over the long term. Management fees, tracking error, and other costs that accumulate over longer holding periods will be more important considerations in deciding on the appropriate ETF to use as a long-term investment in a portfolio. Liquidity and trading costs (commissions, bid-ask spreads, premiums/discounts) are more significant considerations for active, short-term ETF investors who trade frequently.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Portfolio Management · Carol Oosthuizen<\/summary><div class=\"vig-body\"><p>Carol Oosthuizen is a portfolio manager based in South Africa. She allocates part of her investment assets to ETFs. Oosthuizen evaluates several domestically listed emerging market ETFs as possible investments. The ETFs have varying levels of commissions, bid- ask spreads, and management fees. Oosthuizen intends to hold the ETF as a long-term investment in her portfolio. Given her holding period, Oosthuizen considers which costs are most relevant when selecting which ETF to invest in. Oosthuizen notes that in one of her portfolios, the manager of the actively managed funds in the portfolio has changed their asset allocations. This resulted in a temporary underweighting in real estate. The changes did not however breach the target weight thresholds of Oosthuizen's portfolio. Oosthuizen would like to retain the existing manager allocation and given this, decides to invest in a real estate ETF as a tactical strategy to fill this temporary gap in her desired strategic exposure. Oosthuizen next evaluates the expected performance of ETF Echo using a three-factor macroeconomic model. The market forecast expected return for ETF Echo is 5.4%. Oosthuizen uses the information on the model's three factors in Exhibit 1 to calculate the ETF's expected return if her macroeconomic forecasts are realized.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s2-002.webp\" style=\"max-width:min(100%,512px)\" alt=\"Factor Market Oosthuizen&#x27;s Factor Sensitivity Forecast SAnAAAZA Forecast Inflation -1.5 6.0% 5.4% Unemployment 0.4 18.5% 20.0% GDP growth 1.8 5.5% 6.3%\"><p>Finally, Oosthuizen analyzes ETF Foxtrot using a differ
