 = the probability of a down movement = 0.5. In a binomial stock price tree, the risk-neutral probability of an up move can be calculated based on the risk-free rate, the size of an up movement, and the size of a down movement: πU = (1 + Rf – D) / (U – D).\n(Module 31.5, LOS 31.e)","explhtml":"<p>For a binomial interest rate tree, the probability of an up movement = the probability of a down movement = 0.5. In a binomial stock price tree, the risk-neutral probability of an up move can be calculated based on the risk-free rate, the size of an up movement, and the size of a down movement: πU = (1 + Rf – D) / (U – D).<\/p><p>(Module 31.5, LOS 31.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Simon Jackman, a junior analyst for Tucker Group Limited (TGL), has been asked to evaluate the firm&#x27;s various swap transactions and interest rate option positions. TGL&#x27;s counterparty for many of these derivatives is MBS Bank, a large full-service bank in Australia.<\/p><p>Jackman begins writing his report for the management of TGL. In the report, Jackman makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>A payer swap can be replicated using a long receiver swaption and a<\/td><\/tr><tr><td>1:<\/td><td>short payer swaption with the same exercise rates. If the exercise rate is set such that the premiums of the payer and receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><\/tr><tr><td>Statement<\/td><td>A long callable bond can be replicated using a long option-free bond<\/td><\/tr><tr><td>2:<\/td><td>plus a short receiver swaption.<\/td><\/tr><\/table><\/div><p>Jackman is also evaluating a two-year European interest rate call option with a strike rate of 5% and a notional principal of $2 ments regarding dedicated short-selling and short-biased strategies, is accurate?","opts":["Statement 1 only.","Statement 2 only.","Both statements."],"ans":"C","expl":"Statement 1 is accurate. Dedicated short-selling hedge fund managers take short-only positions. Such funds vary their short exposure only with respect to portfolio sizing by holding different levels of cash.\nShort-biased managers are less extreme: they may balance their short exposure with some modest value-oriented or index-oriented long exposure.\nStatement 2 is accurate. While dedicated short-selling hedge fund managers tend to be 60% to 120% short, short-biased managers are generally 30% to 60% net short. Both types of managers, however, focus on single-equity stock picking rather than shorting indexes.\n(Module 34.2, LOS 34.b)","explhtml":"<p>Statement 1 is accurate. Dedicated short-selling hedge fund managers take short-only positions. Such funds vary their short exposure only with respect to portfolio sizing by holding different levels of cash.<\/p><p>Short-biased managers are less extreme: they may balance their short exposure with some modest value-oriented or index-oriented long exposure.<\/p><p>Statement 2 is accurate. While dedicated short-selling hedge fund managers tend to be 60% to 120% short, short-biased managers are generally 30% to 60% net short. Both types of managers, however, focus on single-equity stock picking rather than shorting indexes.<\/p><p>(Module 34.2, LOS 34.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Elena Russo is a senior investment analyst at Wieser Hedge Fund (WHF), a multistrategy hedge fund based in Italy with more than EUR 10 billion in assets under management. WHF&#x27;s recently hired chief investment officer, Isabella Marino, wants to learn more about Russo&#x27;s investment approach.<\/p><p>Russo and Marino discuss hedge fund equity investment strategies, particularly dedicated short-selling and short-biased strategies. Russo makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Short-biased managers may moderate short beta with some value-oriented long exposure.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Both dedicated short-selling and short-biased managers tend to focus on single-equity stock picking.<\/td><\/tr><\/table><\/div><p>Russo and Marino also discuss equity market–neutral (EMN) strategies. Marino illustrates the concept of stub trading by providing an example involving three hypothetical companies: Company A (the parent company) as well as Company B and Company C (Company A&#x27;s subsidiaries). Marino states that Company A is overvalued, while Company B and Company C are undervalued.  Exhibit 1: Selected Information Pertaining to Company A, Company B, and Company C includes information pertaining to the three companies.<\/p><p>Exhibit 1: Selected Information Pertaining to Company A, Company B, and Company C<\/p><div class=\"tbl\"><table><tr><td>Company<\/td><td>Stock Price<\/td><td>Company A Ownership<\/td><td>Correlation With Company A<\/td><\/tr><tr><td>Company A<\/td><td>100<\/td><td>100%<\/td><td>1.0<\/td><\/tr><tr><td>Company B<\/td><td>50<\/td><td>80%<\/td><td>0.5<\/td><\/tr><tr><td>Company C<\/td><td>25<\/td><td>70%<\/td><td>0.4<\/td><\/tr><\/table><\/div><p>Russo contends that WHF should allocate some funds to relative value strategies. She believes that investment approaches based on hybrid securities, such as convertible bonds, could provide attractive returns. Particularly, Russo emphasizes that volatility-oriented convertible managers could generate high returns in the current market conditions. She makes the following statements about two hypothetical convertible managers:<\/p><div class=\"tbl\"><table><tr><td>Manager A:<\/td><td>The manager does not hedge the credit risk of the bond issuer.<\/td><\/tr><tr><td>Manager B:<\/td><td>The manager overhedges the equity risk of the convertible bond.<\/td><\/tr><\/table><\/div><p>Another opportunity proposed by Russo is an investment in insurance contracts. She mentions the diversification benefits provided by life insurance contracts, and describes the process through which WHF could achieve an exposure to these assets by dealing with a third-party broker. Russo emphasizes the following key characteristics that WHF should look for in life insurance contracts:<\/p><div class=\"tbl\"><table><tr><td>Characteristic 1:<\/td><td>A relatively high surrender value<\/td><\/tr><tr><td>Characteristic 2:<\/td><td>Relatively low ongoing premium payments<\/td><\/tr><tr><td>Characteristic 3:<\/td><td>A high probability that the insured person will pass away earlier than predicted by standard actuarial methods<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of Russo&#x27;s statements regarding dedicated short-selling and short-biased strategies, is accurate?<\/p><\/div>","subj":"alternatives"},{"n":82,"q":"Based on Exhibit 1 and the relative valuations of Company A, Company B, and Company C, which of following trading strategies is consistent with stub trading?","opts":["Short 1 share of Company A, long 1 share of Company B, and long 2 shares of Company C.","Short 1 share of Company A, long 2 shares of Company B, and long 2.5 shares of Company C.","Short 1 share of Company A, long 0.8 shares of Company B, and long 0.7 shares of Company C."],"ans":"C","expl":"Equity market–neutral investment strategies take long and short positions in similar or related equities with divergent valuations. Those strategies aim to neutralize market risk by building a portfolio with a market beta approximately equal to zero.\nStub trading is a type of EMN trading that entails buying (selling) the stock of an undervalued (overvalued) parent company and selling (buying) the stocks of its overvalued (undervalued) subsidiaries, weighted by the percentage of ownership that the parent company has in each of its subsidiaries.\nCompany A is overvalued and owns 80% and 70% of Company B and Company C, respectively. Stub trading would entail going short 1 stock of Company A and going long both 0.8 shares of Company B and 0.7 shares of Company C.\nThe answer option to short 1 share of Company A, long 1 share of Company B, and long 2 shares of Company C is not appropriate because the weights are incorrectly calculated based on the stock prices, and the positions taken in Company B and Company C are based on an incorrect assumption that stub trading is a zero net expenditure strategy.\nThe answer option to short 1 share of Company A, long 2 shares of Company B, and long 2.5 shares of Company C is not suitable because the weights are incorrectly calculated based on the correlation levels between Company A and its subsidiaries.\n(Module 34.2, LOS 34.b)","explhtml":"<p>Equity market–neutral investment strategies take long and short positions in similar or related equities with divergent valuations. Those strategies aim to neutralize market risk by building a portfolio with a market beta approximately equal to zero.<\/p><p>Stub trading is a type of EMN trading that entails buying (selling) the stock of an undervalued (overvalued) parent company and selling (buying) the stocks of its overvalued (undervalued) subsidiaries, weighted by the percentage of ownership that the parent company has in each of its subsidiaries.<\/p><p>Company A is overvalued and owns 80% and 70% of Company B and Company C, respectively. Stub trading would entail going short 1 stock of Company A and going long both 0.8 shares of Company B and 0.7 shares of Company C.<\/p><p>The answer option to short 1 share of Company A, long 1 share of Company B, and long 2 shares of Company C is not appropriate because the weights are incorrectly calculated based on the stock prices, and the positions taken in Company B and Company C are based on an incorrect assumption that stub trading is a zero net expenditure strategy.<\/p><p>The answer option to short 1 share of Company A, long 2 shares of Company B, and long 2.5 shares of Company C is not suitable because the weights are incorrectly calculated based on the correlation levels between Company A and its subsidiaries.<\/p><p>(Module 34.2, LOS 34.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elena Russo is a senior investment analyst at Wieser Hedge Fund (WHF), a multistrategy hedge fund based in Italy with more than EUR 10 billion in assets under management. WHF&#x27;s recently hired chief investment officer, Isabella Marino, wants to learn more about Russo&#x27;s investment approach.<\/p><p>Russo and Marino discuss hedge fund equity investment strategies, particularly dedicated short-selling and short-biased strategies. Russo makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Short-biased managers may moderate short beta with some value-oriented long exposure.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Both dedicated short-selling and short-biased managers tend to focus on single-equity stock picking.<\/td><\/tr><\/table><\/div><p>Russo and Marino also discuss equity market–neutral (EMN) strategies. Marino illustrates the concept of stub trading by providing an example involving three hypothetical companies: Company A (the parent company) as well as Company B and Company C (Company A&#x27;s subsidiaries). Marino states that Company A is overvalued, while Company B and Company C are undervalued.  Exhibit 1: Selected Information Pertaining to Company A, Company B, and Company C includes information pertaining to the three companies.<\/p><p>Exhibit 1: Selected Information Pertaining to Company A, Company B, and Company C<\/p><div class=\"tbl\"><table><tr><td>Company<\/td><td>Stock Price<\/td><td>Company A Ownership<\/td><td>Correlation With Company A<\/td><\/tr><tr><td>Company A<\/td><td>100<\/td><td>100%<\/td><td>1.0<\/td><\/tr><tr><td>Company B<\/td><td>50<\/td><td>80%<\/td><td>0.5<\/td><\/tr><tr><td>Company C<\/td><td>25<\/td><td>70%<\/td><td>0.4<\/td><\/tr><\/table><\/div><p>Russo contends that WHF should allocate some funds to relative value strategies. She believes that investment approaches based on hybrid securities, such as convertible bonds, could provide attractive returns. Particularly, Russo emphasizes that volatility-oriented convertible managers could generate high returns in the current market conditions. She makes the following statements about two hypothetical convertible managers:<\/p><div class=\"tbl\"><table><tr><td>Manager A:<\/td><td>The manager does not hedge the credit risk of the bond issuer.<\/td><\/tr><tr><td>Manager B:<\/td><td>The manager overhedges the equity risk of the convertible bond.<\/td><\/tr><\/table><\/div><p>Another opportunity proposed by Russo is an investment in insurance contracts. She mentions the diversification benefits provided by life insurance contracts, and describes the process through which WHF could achieve an exposure to these assets by dealing with a third-party broker. Russo emphasizes the following key characteristics that WHF should look for in life insurance contracts:<\/p><div class=\"tbl\"><table><tr><td>Characteristic 1:<\/td><td>A relatively high surrender value<\/td><\/tr><tr><td>Characteristic 2:<\/td><td>Relatively low ongoing premium payments<\/td><\/tr><tr><td>Characteristic 3:<\/td><td>A high probability that the insured person will pass away earlier than predicted by standard actuarial methods<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and the relative valuations of Company A, Company B, and Company C, which of following trading strategies is consistent with stub trading?<\/p><\/div>","subj":"alternatives"},{"n":83,"q":"Regarding convertible bonds, which manager is likely to be classified as a volatility-oriented convertible manager?","opts":["Manager A only.","Manager B only.","Neither Manager A nor Manager B."],"ans":"B","expl":"A convertible bond is a hybrid security that can be viewed as a combination of straight debt and a long equity call option. The goal of a convertible arbitrage manager is to identify relatively cheap embedded optionality and to invest accordingly.\nA credit-oriented (not a volatility-oriented) convertible manager does not hedge the credit risk of the convertible bond issuer. A volatility-oriented convertible manager aims for a higher exposure to volatility by overhedging equity risk, thereby taking a short-biased position in the underlying stock.\nThus, Manager A is a credit-oriented convertible manager, while Manager B is a volatility-oriented convertible manager.\n(Module 34.2, LOS 34.d)","explhtml":"<p>A convertible bond is a hybrid security that can be viewed as a combination of straight debt and a long equity call option. The goal of a convertible arbitrage manager is to identify relatively cheap embedded optionality and to invest accordingly.<\/p><p>A credit-oriented (not a volatility-oriented) convertible manager does not hedge the credit risk of the convertible bond issuer. A volatility-oriented convertible manager aims for a higher exposure to volatility by overhedging equity risk, thereby taking a short-biased position in the underlying stock.<\/p><p>Thus, Manager A is a credit-oriented convertible manager, while Manager B is a volatility-oriented convertible manager.<\/p><p>(Module 34.2, LOS 34.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elena Russo is a senior investment analyst at Wieser Hedge Fund (WHF), a multistrategy hedge fund based in Italy with more than EUR 10 billion in assets under management. WHF&#x27;s recently hired chief investment officer, Isabella Marino, wants to learn more about Russo&#x27;s investment approach.<\/p><p>Russo and Marino discuss hedge fund equity investment strategies, particularly dedicated short-selling and short-biased strategies. Russo makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Short-biased managers may moderate short beta with some value-oriented long exposure.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Both dedicated short-selling and short-biased managers tend to focus on single-equity stock picking.<\/td><\/tr><\/table><\/div><p>Russo and Marino also discuss equity market–neutral (EMN) strategies. Marino illustrates the concept of stub trading by providing an example involving three hypothetical companies: Company A (the parent company) as well as Company B and Company C (Company A&#x27;s subsidiaries). Marino states that Company A is overvalued, while Company B and Company C are undervalued.  Exhibit 1: Selected Information Pertaining to Company A, Company B, and Company C includes information pertaining to the three companies.<\/p><p>Exhibit 1: Selected Information Pertaining to Company A, Company B, and Company C<\/p><div class=\"tbl\"><table><tr><td>Company<\/td><td>Stock Price<\/td><td>Company A Ownership<\/td><td>Correlation With Company A<\/td><\/tr><tr><td>Company A<\/td><td>100<\/td><td>100%<\/td><td>1.0<\/td><\/tr><tr><td>Company B<\/td><td>50<\/td><td>80%<\/td><td>0.5<\/td><\/tr><tr><td>Company C<\/td><td>25<\/td><td>70%<\/td><td>0.4<\/td><\/tr><\/table><\/div><p>Russo contends that WHF should allocate some funds to relative value strategies. She believes that investment approaches based on hybrid securities, such as convertible bonds, could provide attractive returns. Particularly, Russo emphasizes that volatility-oriented convertible managers could generate high returns in the current market conditions. She makes the following statements about two hypothetical convertible managers:<\/p><div class=\"tbl\"><table><tr><td>Manager A:<\/td><td>The manager does not hedge the credit risk of the bond issuer.<\/td><\/tr><tr><td>Manager B:<\/td><td>The manager overhedges the equity risk of the convertible bond.<\/td><\/tr><\/table><\/div><p>Another opportunity proposed by Russo is an investment in insurance contracts. She mentions the diversification benefits provided by life insurance contracts, and describes the process through which WHF could achieve an exposure to these assets by dealing with a third-party broker. Russo emphasizes the following key characteristics that WHF should look for in life insurance contracts:<\/p><div class=\"tbl\"><table><tr><td>Characteristic 1:<\/td><td>A relatively high surrender value<\/td><\/tr><tr><td>Characteristic 2:<\/td><td>Relatively low ongoing premium payments<\/td><\/tr><tr><td>Characteristic 3:<\/td><td>A high probability that the insured person will pass away earlier than predicted by standard actuarial methods<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding convertible bonds, which manager is likely to be classified as a volatility-oriented convertible manager?<\/p><\/div>","subj":"alternatives"},{"n":84,"q":"Which of the following life insurance contract characteristics mentioned by Russo is least likely to appeal to a hedge fund?","opts":["Characteristic 1.","Characteristic 2.","Characteristic 3."],"ans":"A","expl":"Life insurance provides payment to the policyholder's dependents if the policyholder passes away. Life insurance contracts can be sold to specialized brokers in the secondary market. The valuation of these contracts requires an actuarial analysis and a medical examination of the policyholder.\nCharacteristic 1 is not desired. A hedge fund investing in a life insurance contract seeks a low surrender value because it will allow the hedge fund to purchase the contract at a lower price.\nCharacteristic 2 is desirable. Hedge funds seek life insurance contracts with low ongoing premium payments because the hedge funds will have to make these payments to keep the contracts active.\nCharacteristic 3 is desirable. The higher the probability that the insured person will pass away earlier than predicted by actuarial methods, the more valuable the life insurance contract is to a hedge fund. (The higher the mortality risk of the insured, the more likely the insurance company will have to pay out the death benefit soon --thereby enhancing the hedge fund's return.)\n(Module 34.3, LOS 34.f)","explhtml":"<p>Life insurance provides payment to the policyholder&#x27;s dependents if the policyholder passes away. Life insurance contracts can be sold to specialized brokers in the secondary market. The valuation of these contracts requires an actuarial analysis and a medical examination of the policyholder.<\/p><p>Characteristic 1 is not desired. A hedge fund investing in a life insurance contract seeks a low surrender value because it will allow the hedge fund to purchase the contract at a lower price.<\/p><p>Characteristic 2 is desirable. Hedge funds seek life insurance contracts with low ongoing premium payments because the hedge funds will have to make these payments to keep the contracts active.<\/p><p>Characteristic 3 is desirable. The higher the probability that the insured person will pass away earlier than predicted by actuarial methods, the more valuable the life insurance contract is to a hedge fund. (The higher the mortality risk of the insured, the more likely the insurance company will have to pay out the death benefit soon --thereby enhancing the hedge fund&#x27;s return.)<\/p><p>(Module 34.3, LOS 34.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elena Russo is a senior investment analyst at Wieser Hedge Fund (WHF), a multistrategy hedge fund based in Italy with more than EUR 10 billion in assets under management. WHF&#x27;s recently hired chief investment officer, Isabella Marino, wants to learn more about Russo&#x27;s investment approach.<\/p><p>Russo and Marino discuss hedge fund equity investment strategies, particularly dedicated short-selling and short-biased strategies. Russo makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Short-biased managers may moderate short beta with some value-oriented long exposure.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Both dedicated short-selling and short-biased managers tend to focus on single-equity stock picking.<\/td><\/tr><\/table><\/div><p>Russo and Marino also discuss equity market–neutral (EMN) strategies. Marino illustrates the concept of stub trading by providing an example involving three hypothetical companies: Company A (the parent company) as well as Company B and Company C (Company A&#x27;s subsidiaries). Marino states that Company A is overvalued, while Company B and Company C are undervalued.  Exhibit 1: Selected Information Pertaining to Company A, Company B, and Company C includes information pertaining to the three companies.<\/p><p>Exhibit 1: Selected Information Pertaining to Company A, Company B, and Company C<\/p><div class=\"tbl\"><table><tr><td>Company<\/td><td>Stock Price<\/td><td>Company A Ownership<\/td><td>Correlation With Company A<\/td><\/tr><tr><td>Company A<\/td><td>100<\/td><td>100%<\/td><td>1.0<\/td><\/tr><tr><td>Company B<\/td><td>50<\/td><td>80%<\/td><td>0.5<\/td><\/tr><tr><td>Company C<\/td><td>25<\/td><td>70%<\/td><td>0.4<\/td><\/tr><\/table><\/div><p>Russo contends that WHF should allocate some funds to relative value strategies. She believes that investment approaches based on hybrid securities, such as convertible bonds, could provide attractive returns. Particularly, Russo emphasizes that volatility-oriented convertible managers could generate high returns in the current market conditions. She makes the following statements about two hypothetical convertible managers:<\/p><div class=\"tbl\"><table><tr><td>Manager A:<\/td><td>The manager does not hedge the credit risk of the bond issuer.<\/td><\/tr><tr><td>Manager B:<\/td><td>The manager overhedges the equity risk of the convertible bond.<\/td><\/tr><\/table><\/div><p>Another opportunity proposed by Russo is an investment in insurance contracts. She mentions the diversification benefits provided by life insurance contracts, and describes the process through which WHF could achieve an exposure to these assets by dealing with a third-party broker. Russo emphasizes the following key characteristics that WHF should look for in life insurance contracts:<\/p><div class=\"tbl\"><table><tr><td>Characteristic 1:<\/td><td>A relatively high surrender value<\/td><\/tr><tr><td>Characteristic 2:<\/td><td>Relatively low ongoing premium payments<\/td><\/tr><tr><td>Characteristic 3:<\/td><td>A high probability that the insured person will pass away earlier than predicted by standard actuarial methods<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following life insurance contract characteristics mentioned by Russo is least likely to appeal to a hedge fund?<\/p><\/div>","subj":"alternatives"},{"n":85,"q":"According to CFA Institute Standards of Professional Conduct, which of the following statements is most accurate with regard to the investment report on BlueNote, Inc.? The report:","opts":["complies with the Standards.","should not have included a price target as it makes an implicit guarantee of investment performance.","does not comply with the Standards due to improper risk analysis."],"ans":"C","expl":"Under Standard V(A), specification of a price target is acceptable as long as the risk is appropriately disclosed. A research report can specify VaR as an appropriate risk metric, but the report should clarify that the quality of the VaR estimate depends on the quality of model inputs.\n(Module 42.8, LOS 42.a)","explhtml":"<p>Under Standard V(A), specification of a price target is acceptable as long as the risk is appropriately disclosed. A research report can specify VaR as an appropriate risk metric, but the report should clarify that the quality of the VaR estimate depends on the quality of model inputs.<\/p><p>(Module 42.8, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following statements is most accurate with regard to the investment report on BlueNote, Inc.? The report:<\/p><\/div>","subj":"ethics"},{"n":86,"q":"Did Holly violate any CFA Institute Standards of Professional Conduct with respect to his report on BlueNote or BigTime, as it relates to potential use of material nonpublic information?","opts":["Holly has violated Standard on material nonpublic information in the case of both reports.","There is a violation regarding the BlueNote report, but no violation with the BigTime report.","There is a violation regarding the BigTime report, but no violation with the BlueNote report."],"ans":"C","expl":"Standard II(A). Holly has utilized public information to conduct an intensive analysis of BlueNote and has also utilized information obtained from a supplier that, while nonpublic, is not by itself material. When combined with his knowledge of BlueNote's material public information, however, the information from the supplier allows Holly to make a significant and material conclusion that would not be known to the public in general. This situation falls under the Mosaic Theory. Holly is free to make recommendations based on her material nonpublic conclusion on BlueNote since the conclusion was formed using material public information combined with nonmaterial nonpublic information. Thus, the BlueNote report did not violate Standard II(A) Integrity of Capital Markets – Material Nonpublic Information, and since there appears to be a reasonable and adequate basis, does not appear to violate any other Standards either. Holly's report on BigTime, however, is based in part on a conversation that he overheard between executives at BigTime. The information he overheard related to the sale of one of BigTime's business units was both material and nonpublic. The fact that several other analysts overheard the conversation as well does not make the information public. Because Holly is in possession of material nonpublic information, he is prohibited by Standard II(A) from acting or causing others to act on the information. Therefore, his report on BigTime violates the Standard.\n(Module 42.3, LOS 42.a)\n(Module 42.3, LOS 42.b)","explhtml":"<p>Standard II(A). Holly has utilized public information to conduct an intensive analysis of BlueNote and has also utilized information obtained from a supplier that, while nonpublic, is not by itself material. When combined with his knowledge of BlueNote&#x27;s material public information, however, the information from the supplier allows Holly to make a significant and material conclusion that would not be known to the public in general. This situation falls under the Mosaic Theory. Holly is free to make recommendations based on her material nonpublic conclusion on BlueNote since the conclusion was formed using material public information combined with nonmaterial nonpublic information. Thus, the BlueNote report did not violate Standard II(A) Integrity of Capital Markets – Material Nonpublic Information, and since there appears to be a reasonable and adequate basis, does not appear to violate any other Standards either. Holly&#x27;s report on BigTime, however, is based in part on a conversation that he overheard between executives at BigTime. The information he overheard related to the sale of one of BigTime&#x27;s business units was both material and nonpublic. The fact that several other analysts overheard the conversation as well does not make the information public. Because Holly is in possession of material nonpublic information, he is prohibited by Standard II(A) from acting or causing others to act on the information. Therefore, his report on BigTime violates the Standard.<\/p><p>(Module 42.3, LOS 42.a)<\/p><p>(Module 42.3, LOS 42.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Holly violate any CFA Institute Standards of Professional Conduct with respect to his report on BlueNote or BigTime, as it relates to potential use of material nonpublic information?<\/p><\/div>","subj":"ethics"},{"n":87,"q":"According to CFA Institute Standards of Professional Conduct, which of the following statements is most likely correct with regard to Holly's report and subsequent sale of his and his clients' shares of BigTime common stock? Holly has:","opts":["violated the Standard by attempting to manipulate the market price of BigTime stock.","not violated the Standard since he first obtained approval to make the trades from his compliance officer.","not violated the Standard since he acted in the best interest of his clients by realizing gains on BigTime stock."],"ans":"A","expl":"Standard II(B) – Market Manipulation. Holly has issued a buy recommendation on BigTime stock. The analysis is based on a very optimistic analysis of the company's fundamentals. Yet, three days after issuing the report, Holly decides to sell all of his clients' holdings as well as his own holdings of BigTime stock after observing a rise in the price of the stock. Holly's report, which caused an increase in the price of BigTime stock, was intended to deceive market participants into believing the company was a good investment when, as indicated by his subsequent sale of the shares, Holly believed otherwise. The combination of actions indicates that Holly is likely attempting to manipulate the price of the stock for his clients', and his own, benefit. Thus, he has likely violated Standard II(B) – Integrity of Capital Markets – Market Manipulation.\n(Module 42.3, LOS 42.a)\n(Module 42.3, LOS 42.b)","explhtml":"<p>Standard II(B) – Market Manipulation. Holly has issued a buy recommendation on BigTime stock. The analysis is based on a very optimistic analysis of the company&#x27;s fundamentals. Yet, three days after issuing the report, Holly decides to sell all of his clients&#x27; holdings as well as his own holdings of BigTime stock after observing a rise in the price of the stock. Holly&#x27;s report, which caused an increase in the price of BigTime stock, was intended to deceive market participants into believing the company was a good investment when, as indicated by his subsequent sale of the shares, Holly believed otherwise. The combination of actions indicates that Holly is likely attempting to manipulate the price of the stock for his clients&#x27;, and his own, benefit. Thus, he has likely violated Standard II(B) – Integrity of Capital Markets – Market Manipulation.<\/p><p>(Module 42.3, LOS 42.a)<\/p><p>(Module 42.3, LOS 42.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following statements is most likely correct with regard to Holly&#x27;s report and subsequent sale of his and his clients&#x27; shares of BigTime common stock? Holly has:<\/p><\/div>","subj":"ethics"},{"n":88,"q":"In his letter to clients explaining the change in the valuation model, did Holly violate any CFA Institute Standards of Professional Conduct?","opts":["No.","Yes, because he did not treat all clients fairly in his dissemination of the letter.","Yes, because he failed to include details of the current valuation model to contrast with the new model."],"ans":"A","expl":"Standard V(B) – Communication With Clients and Prospective Clients. Standard V(B) requires members and candidates to promptly disclose any changes that materially affect investment processes. Holly has provided a detailed description of the new valuation model that will be used to generate investment recommendations and has disclosed the new limitations on the investment universe (i.e., no alcohol or tobacco stocks). Therefore, it does not appear that he has violated Standard V(B). Holly also has not violated any other standards. It is acceptable for him to email those clients with email addresses and send his letter by regular mail to those who do not. Standard III(B) – Fair Dealing does not require that all clients receive investment recommendations or other communications at exactly the same time, only that the system treats clients fairly.\n(Module 42.8, LOS 42.b)\n(Module 42.8, LOS 42.a)","explhtml":"<p>Standard V(B) – Communication With Clients and Prospective Clients. Standard V(B) requires members and candidates to promptly disclose any changes that materially affect investment processes. Holly has provided a detailed description of the new valuation model that will be used to generate investment recommendations and has disclosed the new limitations on the investment universe (i.e., no alcohol or tobacco stocks). Therefore, it does not appear that he has violated Standard V(B). Holly also has not violated any other standards. It is acceptable for him to email those clients with email addresses and send his letter by regular mail to those who do not. Standard III(B) – Fair Dealing does not require that all clients receive investment recommendations or other communications at exactly the same time, only that the system treats clients fairly.<\/p><p>(Module 42.8, LOS 42.b)<\/p><p>(Module 42.8, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>In his letter to clients explaining the change in the valuation model, did Holly violate any CFA Institute Standards of Professional Conduct?<\/p><\/div>","subj":"ethics"}];
const CFG = {"title": "Schweser Mock 2 (2025) — Session 2", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){

function saveProg(){

    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");

    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);

const CFA_SESSION_SUBJECT_RANGES = {

const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,

  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;

  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnav-note-end-->

<button id="qnotesFab" type="button" onclick="qnotesOpen()" title="Ghi chú của tôi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 10h6M8 14h8M8 18h5"/></svg><span>Ghi chú</span></button>
<div id="qnotesOverlay" onclick="qnotesClose()"></div>
<div id="qnotesPanel" aria-hidden="true">
  <div class="qnp-head" id="qnotesHead"><span class="qnp-grip" aria-hidden="true">⠿</span><b>Ghi chú của tôi</b><a class="qnp-open" href="index.html?view=notes" target="_blank" rel="noopener">Mở trang ↗</a><button type="button" class="qnp-x" onclick="qnotesClose()" title="Đóng (Esc)">✕</button></div>
  <iframe id="qnotesFrame" title="Ghi chú của tôi" loading="lazy"></iframe>
</div>
<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--qnotes-panel-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
