<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

    <!--subject-breakdown-panel-start-->
    <div id="subjectBreakdown" class="subject-breakdown" aria-live="polite"></div>
    <!--subject-breakdown-panel-end-->
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

 risk.<\/p><\/div><\/details><div class=\"qtext\"><p>To best model the emerging markets data using linear regression, Hu should use:<\/p><\/div>","subj":"quant"},{"n":46,"q":"The most likely problem in Hu's regression of the emerging market data and the most appropriate test for it in the regression is:\nProblem | Test","opts":["Serial correlation Durbin-Watson","Serial correlation Dickey-Fuller","Cointegrated variables Engle-Granger"],"ans":"A","expl":"The most likely problem in Hu's regression of the emerging market data is that the error terms appear to be positively correlated in  Exhibit 2: Residual Plot From Emerging Markets Data. The first few error terms are positive, then negative, and then positive. This indicates serial correlation, which is common in trend models. As Hu regresses the macroeconomic data against a time variable, she is using a trend model. In a linear trend model, the Durbin-Watson statistic can be used to detect serial correlation.\n(Module 1.3, LOS 1.i)","explhtml":"<p>The most likely problem in Hu&#x27;s regression of the emerging market data is that the error terms appear to be positively correlated in  Exhibit 2: Residual Plot From Emerging Markets Data. The first few error terms are positive, then negative, and then positive. This indicates serial correlation, which is common in trend models. As Hu regresses the macroeconomic data against a time variable, she is using a trend model. In a linear trend model, the Durbin-Watson statistic can be used to detect serial correlation.<\/p><p>(Module 1.3, LOS 1.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Song Hu is the quantitative analyst for Guangho Equity Partners. Hu has been busy over the past week modeling the macroeconomic data of an emerging market. The data for the past 24 months is shown in  Exhibit 1: Time Series o s envisioned. Li mentions that he is collecting the relevant fundamental and technical variable data for the 100 companies.<\/p><p>Li states that he would rather take the broad sample of 1,000 stocks with the highest trading volume and divide the sample into 10 groups of diverse characteristics. The intent is to select 1 stock from each group to long/short so as to diversify the portfolio composition and reduce risk.<\/p><\/div><\/details><div class=\"qtext\"><p>The most likely problem in Hu&#x27;s regression of the emerging market data and the most appropriate test for it in the regression is:<\/p><div class=\"tbl\"><table><tr><td>Problem<\/td><td>Test<\/td><\/tr><\/table><\/div><\/div>","subj":"quant"},{"n":47,"q":"Which model would be most appropriate for Li to use in predicting returns?","opts":["Penalized regression model.","Clustering model.","KNN Model."],"ans":"A","expl":"The objective of the model is to forecast monthly returns using a set of fundamental and technical variables (features). This is not a classification problem and hence clustering and KNN would be inappropriate. A penalized regression model tries to use a limited number of most important features that explain the variation in the dependent variable (the monthly return on 100 stocks).\n(Module 3.2, LOS 3.c)","explhtml":"<p>The objective of the model is to forecast monthly returns using a set of fundamental and technical variables (features). This is not a classification problem and hence clustering and KNN would be inappropriate. A penalized regression model tries to use a limited number of most important features that explain the variation in the dependent variable (the monthly return on 100 stocks).<\/p><p>(Module 3.2, LOS 3.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Song Hu is the quantitative analyst for Guangho Equity dsize companies. A portfolio with a long position in 10 stocks with the highest forecasted return and a corresponding short position in 10 stocks with the lowest return is envisioned. Li mentions that he is collecting the relevant fundamental and technical variable data for the 100 companies.<\/p><p>Li states that he would rather take the broad sample of 1,000 stocks with the highest trading volume and divide the sample into 10 groups of diverse characteristics. The intent is to select 1 stock from each group to long/short so as to diversify the portfolio composition and reduce risk.<\/p><\/div><\/details><div class=\"qtext\"><p>Which model would be most appropriate for Li to use in predicting returns?<\/p><\/div>","subj":"quant"},{"n":48,"q":"Li's suggested diversification problem could be best addressed using the:","opts":["principal component analysis (PCA).","K-Means clustering.","LASSO."],"ans":"B","expl":"LASSO is a feature-reduction algorithm; through optimization, LASSO automatically eliminates the least-predictive features. LASSO is not used for classification. K-means clustering partitions observations into k (k = 10 in this case) nonoverlapping clusters. PCA summarizes the information in a large number of correlated factors (features) into a much smaller set of uncorrelated factors and is used for dimension reduction and not for grouping or classification.\n(Module 3.3, LOS 3.d)","explhtml":"<p>LASSO is a feature-reduction algorithm; through optimization, LASSO automatically eliminates the least-predictive features. LASSO is not used for classification. K-means clustering partitions observations into k (k = 10 in this case) nonoverlapping clusters. PCA summarizes the information in a large number of correlated factors (features) into a much smaller set of uncorrelated factors and is used for dimension reduction and not for grouping or classification.<\/p><p>(Module 3.3, LOS 3.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignet set up a meeting with Qianfan Li, senior analyst to discuss the progress on a model that Li was developing. The model is supposed to forecast return over the next month for a group of 100 midsize companies. A portfolio with a long position in 10 stocks with the highest forecasted return and a corresponding short position in 10 stocks with the lowest return is envisioned. Li mentions that he is collecting the relevant fundamental and technical variable data for the 100 companies.<\/p><p>Li states that he would rather take the broad sample of 1,000 stocks with the highest trading volume and divide the sample into 10 groups of diverse characteristics. The intent is to select 1 stock from each group to long/short so as to diversify the portfolio composition and reduce risk.<\/p><\/div><\/details><div class=\"qtext\"><p>Li&#x27;s suggested diversification problem could be best addressed using the:<\/p><\/div>","subj":"quant"},{"n":49,"q":"Using Angle's analysis, what is the nominal 1-year interest rate in Canada?","opts":["Less than 7%.","Between 7% and 13%.","Greater than 13%."],"ans":"C","expl":"Angle uses the uncovered interest rate parity relationship to forecast future spot rates. If the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso, then nominal interest rates in Canada must be higher than those in the United States and Mexico. The 13% nominal interest rate in Mexico is higher than the nominal interest rate in the U.S., so the nominal interest rate in Canada must be greater than 13%. (Module 5.2, LOS 5.e)","explhtml":"<p>Angle uses the uncovered interest rate parity relationship to forecast future spot rates. If the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso, then nominal interest rates in Canada must be higher than those in the United States and Mexico. The 13% nominal interest rate in Mexico is higher than the nominal interest rate in the U.S., so the nominal interest rate in Canada must be greater than 13%. (Module 5.2, LOS 5.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Economics<\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statement about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also holds under certain conditions.<\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><div class=\"tbl\"><table><tr><td>Great Britain<\/td><td>Japan<\/td><td><\/td><\/tr><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using Angle&#x27;s analysis, what is the nominal 1-year interest rate in Canada?<\/p><\/div>","subj":"economics"},{"n":50,"q":"Is Hohlman's statement regarding the effect of monetary policies on the dollar correct?","opts":["Yes, it is correct.","No, under the Mundell-Fleming model, expansionary monetary policy in the U.S. would weaken the dollar.","No, the dollar value would be unchanged, but under the asset market model and not the Mundell-Fleming model."],"ans":"B","expl":"Hohlman is incorrect regarding the implications of an expansionary monetary policy in the U.S. under the Mundell-Fleming model, which predicts a depreciation of the dollar. The asset market approach focuses on fiscal policy—not monetary policy. (Module 5.3, LOS 5.k)","explhtml":"<p>Hohlman is incorrect regarding the implications of an expansionary monetary policy in the U.S. under the Mundell-Fleming model, which predicts a depreciation of the dollar. The asset market approach focuses on fiscal policy—not monetary policy. (Module 5.3, LOS 5.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statement about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also holds under certain conditions.<\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><div class=\"tbl\"><table><tr><td>Great Britain<\/td><td>Japan<\/td><td><\/td><\/tr><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Is Hohlman&#x27;s statement regarding the effect of monetary policies on the dollar correct?<\/p><\/div>","subj":"economics"},{"n":51,"q":"What additional condition must be satisfied for Hohlman's statement to be valid?","opts":["Covered interest parity must hold.","Fisher effect must hold.","The international Fisher relation must hold."],"ans":"C","expl":"If relative purchasing power parity holds, then inflation differentials drive future exchange rates. If the international Fisher relationship holds, then inflation differentials will be equal to interest rate differentials. Hence, when both relative purchasing power parity and the international Fisher relationship hold, uncovered interest rate parity should also hold. Covered interest rate parity always holds (by arbitrage) and is not a necessary additional condition. Real interest rate parity links the Fisher effect to the international Fisher relationship. (Module 5.2, LOS 5.f)","explhtml":"<p>If relative purchasing power parity holds, then inflation differentials drive future exchange rates. If the international Fisher relationship holds, then inflation differentials will be equal to interest rate differentials. Hence, when both relative purchasing power parity and the international Fisher relationship hold, uncovered interest rate parity should also hold. Covered interest rate parity always holds (by arbitrage) and is not a necessary additional condition. Real interest rate parity links the Fisher effect to the international Fisher relationship. (Module 5.2, LOS 5.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statement about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also holds under certain conditions.<\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><div class=\"tbl\"><table><tr><td>Great Britain<\/td><td>Japan<\/td><td><\/td><\/tr><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>What additional condition must be satisfied for Hohlman&#x27;s statement to be valid?<\/p><\/div>","subj":"economics"},{"n":52,"q":"Which of the following is closest to the current ¥/£ spot rate?","opts":["¥194/£.","¥200/£.","¥206/£."],"ans":"C","expl":"Angle assumes the forward rate is an accurate predictor of the expected future spot rate, so we will use ¥200/£ as the future spot rate.\nAngle states that uncovered interest rate parity holds. Given a quote structure of ¥/£, S0 (1 + Yen interest rate) / (1 + GBP interest rate) = E(S1) S0(1.064 / 1.097) = 200 S0 = 206.20 Notice that the exchange rate will move from ¥206/£ to ¥200/£. So it takes fewer yen to buy one pound (i.e., the yen has strengthened), which uncovered interest rate parity predicts because the Japanese interest rate is lower. (Module 5.2, LOS 5.f) (Module 5.2, LOS 5.e)","explhtml":"<p>Angle assumes the forward rate is an accurate predictor of the expected future spot rate, so we will use ¥200/£ as the future spot rate.<\/p><p>Angle states that uncovered interest rate parity holds. Given a quote structure of ¥/£, S0 (1 + Yen interest rate) / (1 + GBP interest rate) = E(S1) S0(1.064 / 1.097) = 200 S0 = 206.20 Notice that the exchange rate will move from ¥206/£ to ¥200/£. So it takes fewer yen to buy one pound (i.e., the yen has strengthened), which uncovered interest rate parity predicts because the Japanese interest rate is lower. (Module 5.2, LOS 5.f) (Module 5.2, LOS 5.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statement about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also holds under certain conditions.<\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><div class=\"tbl\"><table><tr><td>Great Britain<\/td><td>Japan<\/td><td><\/td><\/tr><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is closest to the current ¥/£ spot rate?<\/p><\/div>","subj":"economics"},{"n":53,"q":"Had EPI used the proportionate consolidation method instead of the equity method to account for its investment, which of the following statements is the most accurate?","opts":["Net profit margin would be the same.","Return on assets would be the same.","Return on equity would be the same."],"ans":"C","expl":"Total assets, liabilities, revenues, and expenses are higher under proportionate consolidation as compared to the equity method. However, net income and stockholders' equity are the same under either method. Accordingly, profit margin and return on assets are typically lower under proportionate consolidation than under the equity method. Return on equity will be same under either method.\nThe following financial statements are provided for informational purposes only. The numbers in the acquisition method are derived as EPI + EP/BM LLC, except for the equity items.\nAcquisition\nIn Millions, Year End 2018 | EPI | EP/BM LLC Method\nRevenue | $3,115 | $421 | $3,536\nCost of goods sold | $2,580 | $295 | $2,875\nSG&A | $316 | $50 | $366\nEBIT | $219 | $76 | $295\nInterest expense | $47 | $8 | $55\nEquity in earnings of EP/BM | $22 | N/A\nPretax income | $194 | $68 | $240\nIncome tax | $60 | $24 | $84\n(–) Noncontrolling interest | $22*\nNet income | $134 | $44 | $134\nIn Millions, December 31, | Acquisition\nEPI | EP/BM LL
