ody\"><p>Engineered Packaging, Inc., (EPI) is a manufacturer of industrial and consumer packaging products. The company&#x27;s products include composite and plastic rigid packaging, flexible packaging, as well as metal and plastic ends and closures. In January 2018, EPI entered into a joint venture with BMI Enterprises. EPI contributed ownership of five plants, while BMI contributed a new manufacturing technology. The joint venture is known as EP/BM LLC. EPI owns 50% of EP/BM LLC and uses the equity method to account for its investment. The following information for 2018 is provided:<\/p><div class=\"tbl\"><table><tr><td>In Millions, Year-End 2018<\/td><td>EPI<\/td><td>EP/BM LLC<\/td><\/tr><tr><td>Revenue<\/td><td>$3,115<\/td><td>$421<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$2,580<\/td><td>$295<\/td><\/tr><tr><td>SG&amp;A<\/td><td>$316<\/td><td>$50<\/td><\/tr><tr><td>Interest expense<\/td><td>$47<\/td><td>$8<\/td><\/tr><tr><td>Equity in earnings of EP/BM<\/td><td>$22<\/td><td><\/td><\/tr><tr><td>Pretax income<\/td><td>$194<\/td><td>$68<\/td><\/tr><tr><td>Income tax<\/td><td>$60<\/td><td>$24<\/td><\/tr><tr><td>Net income<\/td><td>$134<\/td><td>$44<\/td><\/tr><tr><td>In Millions, December 31, 2018<\/td><td>EPI<\/td><td>EP/BM LLC<\/td><\/tr><\/table><\/div><p>Assets<\/p><div class=\"tbl\"><table><tr><td>Cash<\/td><td>$118<\/td><td>$13<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$390<\/td><td>$50<\/td><\/tr><tr><td>Inventory<\/td><td>$314<\/td><td>$41<\/td><\/tr><tr><td>Property<\/td><td>$1,007<\/td><td>$131<\/td><\/tr><tr><td>Investment<\/td><td>$38<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>$1,867<\/td><td>$235<\/td><\/tr><tr><td>Liabilities and Equity<\/td><td>EPI<\/td><td>EP/BM LLC<\/td><\/tr><tr><td>Accounts payable<\/td><td>$274<\/td><td>$35<\/td><\/tr><tr><td>Long-term debt<\/td><td>$719<\/td><td>$125<\/td><\/tr><tr><td>Equity<\/td><td>$874<\/td><td>$75<\/td><\/tr><tr><td>Total<\/td><td>$1,867<\/td><td>$235<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Had EPI used the acquisition method instead of the equity method to account for its investment, EPI&#x27;s long-term debt-to-equity ratio would have been:<\/p><\/div>","subj":"fsa"},{"n":57,"q":"Which of the following statements is the most accurate regarding the Troth Health information shown in Exhibit 1?","opts":["The financial statements submitted to analysts are not as decision-useful as they could be due to biased accounting choices.","The financial statements submitted to the bank are decision-useful because they report GAAP-compliant net income.","The financial statements submitted to the bank are decision-useful as they exhibit no evidence of biased accounting choices."],"ans":"A","expl":"Biased accounting choices are reflected not only in the numbers presented but also in the manner of disclosure of information. The lack of transparency of GAAP-compliant net income relative to the headline net income suggests that the financial statements are not very decision-useful. (Module 12.1, LOS 12.b)","explhtml":"<p>Biased accounting choices are reflected not only in the numbers presented but also in the manner of disclosure of information. The lack of transparency of GAAP-compliant net income relative to the headline net income suggests that the financial statements are not very decision-useful. (Module 12.1, LOS 12.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Matthew Jackson, CFA, has recently taken an analyst role at The Collins Group, an asset management firm based in New Jersey. As part of his job, Jackson has been asked to review the most recent unaudited financial statements from several private companies that have been identified as potential investments for the firm.<\/p><p>Jackson is reviewing financial statements from Troth Health, a firm producing health and wellness products in the United Kingdom. Extracts from the pro forma financial statement recently released, along with 2019 and 2018 comparables, is shown in Exhibit 1.<\/p><p>Exhibit 1: Troth Health Financial Statement (Extract)<\/p><p>Headline Operating Profit: Quarter Ending 31 December 2020 (£000)<\/p><div class=\"tbl\"><table><tr><td>2020<\/td><td>2019<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>8,380<\/td><td>7,980<\/td><td>7,450<\/td><\/tr><tr><td>Revenue retail outlet sales<\/td><td>1,402.2<\/td><td>3,543.9<\/td><td>3,501.6<\/td><\/tr><tr><td>Online sales<\/td><td>3,086.2<\/td><td>398.9<\/td><td>389.4<\/td><\/tr><tr><td>Headline net income (Note A)<\/td><td>1,262.7<\/td><td>1,104.4<\/td><td>1,086.0<\/td><\/tr><\/table><\/div><p>Note A:Headline net income excludes settlement costs and network costs. Settlement costs are one-off payments to settle legal procedures; these costs totaled (in £000) 20.0, 22.1, and 24.8 in 2018, 2019, and 2020, respectively. Network costs related to running the online business totaled (in £000) 202.0, 325.0, and 885.5 in 2018, 2019, and 2020, respectively. The financial accounts submitted to our bank in accordance with our loan covenants shows net income after charging both settlement and network costs in accordance with local GAAP.<\/p><p>Jackson notes that the financial statements submitted to the firm&#x27;s bankers did indeed report net income correctly in accordance with local GAAP. However, this figure was much less prominent than headline net income, as the GAAP income was disclosed only in the footnotes rather than on the face of the income statement.<\/p><p>Jackson believes that the legal settlements are payments made to dissatisfied customers and are a normal part of business. Jackson also believes that the increase in network cost is consistent with Troth&#x27;s increased focus on online operations. Troth&#x27;s required return on stockholders&#x27; equity is 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements is the most accurate regarding the Troth Health information shown in Exhibit 1?<\/p><\/div>","subj":"fsa"},{"n":58,"q":"Which of the following conclusions is Jackson most likely to draw about the earnings quality of Troth Health? 2020 net income after correctly including network and settlement costs shows:","opts":["compound annual growth of over 7%, and earnings that are of high quality as they are correctly calculated under GAAP.","negative compound annual growth of over 35%, and earnings that are of low quality.","negative compound annual growth of over 35%, and earnings that are of high quality as they are correctly calculated under GAAP."],"ans":"B","expl":"2020 | 2019 | 2018\nHeadline Net Income | 1,262.7 | 1,104.4 | 1,086.0\nNetwork costs (from note A) | 885.5 | 325.0 | 202.0\nSettlements (from note A) | 24.8 | 22.1 | 20.0\nNet Income | 352.4 | 757.3 | 864.0\n1/2\nNet Income CAGR = [(352.4 / 864) | ] − 1 = –0.36 = –36%\nAverage stockholders' equity = (8,380 + 7,980) / 2 = 8,180\nReturn on stockholders' equity for 2020 = 352.4 / 8,180 = 4.31%\nEarnings quality refers not only to compliance with GAAP but also to the persistence and level of earnings. The GAAP-compliant net income does not satisfy the minimum return requirement; hence, earnings are low (and therefore of low quality). (Module 12.3, LOS 12.h)","explhtml":"<div class=\"tbl\"><table><tr><td>2020<\/td><td>2019<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Headline Net Income<\/td><td>1,262.7<\/td><td>1,104.4<\/td><td>1,086.0<\/td><\/tr><tr><td>Network costs (from note A)<\/td><td>885.5<\/td><td>325.0<\/td><td>202.0<\/td><\/tr><tr><td>Settlements (from note A)<\/td><td>24.8<\/td><td>22.1<\/td><td>20.0<\/td><\/tr><tr><td>Net Income<\/td><td>352.4<\/td><td>757.3<\/td><td>864.0<\/td><\/tr><\/table><\/div><p><sup>1/2<\/sup><\/p><div class=\"tbl\"><table><tr><td>Net Income CAGR = [(352.4 / 864)<\/td><td>] − 1 = –0.36 = –36%<\/td><\/tr><\/table><\/div><p>Average stockholders&#x27; equity = (8,380 + 7,980) / 2 = 8,180<\/p><p>Return on stockholders&#x27; equity for 2020 = 352.4 / 8,180 = 4.31%<\/p><p>Earnings quality refers not only to compliance with GAAP but also to the persistence and level of earnings. The GAAP-compliant net income does not satisfy the minimum return requirement; hence, earnings are low (and therefore of low quality). (Module 12.3, LOS 12.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Matthew Jackson, CFA, has recently taken an analyst role at The Collins Group, an asset management firm based in New Jersey. As part of his job, Jackson has been asked to review the most recent unaudited financial statements from several private companies that have been identified as potential investments for the firm.<\/p><p>Jackson is reviewing financial statements from Troth Health, a firm producing health and wellness products in the United Kingdom. Extracts from the pro forma financial statement recently released, along with 2019 and 2018 comparables, is shown in Exhibit 1.<\/p><p>Exhibit 1: Troth Health Financial Statement (Extract)<\/p><p>Headline Operating Profit: Quarter Ending 31 December 2020 (£000)<\/p><div class=\"tbl\"><table><tr><td>2020<\/td><td>2019<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>8,380<\/td><td>7,980<\/td><td>7,450<\/td><\/tr><tr><td>Revenue retail outlet sales<\/td><td>1,402.2<\/td><td>3,543.9<\/td><td>3,501.6<\/td><\/tr><tr><td>Online sales<\/td><td>3,086.2<\/td><td>398.9<\/td><td>389.4<\/td><\/tr><tr><td>Headline net income (Note A)<\/td><td>1,262.7<\/td><td>1,104.4<\/td><td>1,086.0<\/td><\/tr><\/table><\/div><p>Note A:Headline net income excludes settlement costs and network costs. Settlement costs are one-off payments to settle legal procedures; these costs totaled (in £000) 20.0, 22.1, and 24.8 in 2018, 2019, and 2020, respectively. Network costs related to running the online business totaled (in £000) 202.0, 325.0, and 885.5 in 2018, 2019, and 2020, respectively. The financial accounts submitted to our bank in accordance with our loan covenants shows net income after charging both settlement and network costs in accordance with local GAAP.<\/p><p>Jackson notes that the financial statements submitted to the firm&#x27;s bankers did indeed report net income correctly in accordance with local GAAP. However, this figure was much less prominent than headline net income, as the GAAP income was disclosed only in the footnotes rather than on the face of the income statement.<\/p><p>Jackson believes that the legal settlements are payments made to dissatisfied customers and are a normal part of business. Jackson also believes that the increase in network cost is consistent with Troth&#x27;s increased focus on online operations. Troth&#x27;s required return on stockholders&#x27; equity is 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following conclusions is Jackson most likely to draw about the earnings quality of Troth Health? 2020 net income after correctly including network and settlement costs shows:<\/p><\/div>","subj":"fsa"},{"n":59,"q":"Treating an investment as an investment in associate rather than in a subsidiary is least likely to:","opts":["overstate net profit margins.","understate fixed assets.","understate net income."],"ans":"C","expl":"An investment in associates is accounted for using the equity method, while investment in a subsidiary is accounted for using the acquisition method. Using either method, net income will be the same. However, fixed assets and total revenue will be lower under the equity method. (Module 12.3, LOS 12.h)","explhtml":"<p>An investment in associates is accounted for using the equity method, while investment in a subsidiary is accounted for using the acquisition method. Using either method, net income will be the same. However, fixed assets and total revenue will be lower under the equity method. (Module 12.3, LOS 12.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Matthew Jackson, CFA, has recently taken an analyst role at The Collins Group, an asset management firm based in New Jersey. As part of his job, Jackson has been asked to review the most recent unaudited financial statements from several private companies that have been identified as potential investments for the firm.<\/p><p>Jackson is reviewing financial statements from Troth Health, a firm producing health and wellness products in the United Kingdom. Extracts from the pro forma financial statement recently released, along with 2019 and 2018 comparables, is shown in Exhibit 1.<\/p><p>Exhibit 1: Troth Health Financial Statement (Extract)<\/p><p>Headline Operating Profit: Quarter Ending 31 December 2020 (£000)<\/p><div class=\"tbl\"><table><tr><td>2020<\/td><td>2019<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>8,380<\/td><td>7,980<\/td><td>7,450<\/td><\/tr><tr><td>Revenue retail outlet sales<\/td><td>1,402.2<\/td><td>3,543.9<\/td><td>3,501.6<\/td><\/tr><tr><td>Online sales<\/td><td>3,086.2<\/td><td>398.9<\/td><td>389.4<\/td><\/tr><tr><td>Headline net income (Note A)<\/td><td>1,262.7<\/td><td>1,104.4<\/td><td>1,086.0<\/td><\/tr><\/table><\/div><p>Note A:Headline net income excludes settlement costs and network costs. Settlement costs are one-off payments to settle legal procedures; these costs totaled (in £000) 20.0, 22.1, and 24.8 in 2018, 2019, and 2020, respectively. Network costs related to running the online business totaled (in £000) 202.0, 325.0, and 885.5 in 2018, 2019, and 2020, respectively. The financial accounts submitted to our bank in accordance with our loan covenants shows net income after charging both settlement and network costs in accordance with local GAAP.<\/p><p>Jackson notes that the financial statements submitted to the firm&#x27;s bankers did indeed report net income correctly in accordance with local GAAP. However, this figure was much less prominent than headline net income, as the GAAP income was disclosed only in the footnotes rather than on the face of the income statement.<\/p><p>Jackson believes that the legal settlements are payments made to dissatisfied customers and are a normal part of business. Jackson also believes that the increase in network cost is consistent with Troth&#x27;s increased focus on online operations. Troth&#x27;s required return on stockholders&#x27; equity is 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>Treating an investment as an investment in associate rather than in a subsidiary is least likely to:<\/p><\/div>","subj":"fsa"},{"n":60,"q":"If Jackson were to find that Troth has significant amounts of off-balance-sheet debt, the aspect of financial reporting quality that Troth Health's balance sheet is most likely to be lacking is:","opts":["completeness.","unbiased measurement.","clear presentation."],"ans":"A","expl":"Balance sheets with significant amounts of off-balance-sheet debt lack the completeness aspect of financial reporting quality. (Module 12.5, LOS 12.j)","explhtml":"<p>Balance sheets with significant amounts of off-balance-sheet debt lack the completeness aspect of financial reporting quality. (Module 12.5, LOS 12.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Matthew Jackson, CFA, has recently taken an analyst role at The Collins Group, an asset management firm based in New Jersey. As part of his job, Jackson has been asked to review the most recent unaudited financial statements from several private companies that have been identified as potential investments for the firm.<\/p><p>Jackson is reviewing financial statements from Troth Health, a firm producing health and wellness products in the United Kingdom. Extracts from the pro forma financial statement recently released, along with 2019 and 2018 comparables, is shown in Exhibit 1.<\/p><p>Exhibit 1: Troth Health Financial Statement (Extract)<\/p><p>Headline Operating Profit: Quarter Ending 31 December 2020 (£000)<\/p><div class=\"tbl\"><table><tr><td>2020<\/td><td>2019<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>8,380<\/td><td>7,980<\/td><td>7,450<\/td><\/tr><tr><td>Revenue retail outlet sales<\/td><td>1,402.2<\/td><td>3,543.9<\/td><td>3,501.6<\/td><\/tr><tr><td>Online sales<\/td><td>3,086.2<\/td><td>398.9<\/td><td>389.4<\/td><\/tr><tr><td>Headline net income (Note A)<\/td><td>1,262.7<\/td><td>1,104.4<\/td><td>1,086.0<\/td><\/tr><\/table><\/div><p>Note A:Headline net income excludes settlement costs and network costs. Settlement costs are one-off payments to settle legal procedures; these costs totaled (in £000) 20.0, 22.1, and 24.8 in 2018, 2019, and 2020, respectively. Network costs related to running the online business totaled (in £000) 202.0, 325.0, and 885.5 in 2018, 2019, and 2020, respectively. The financial accounts submitted to our bank in accordance with our loan covenants shows net income after charging both settlement and network costs in accordance with local GAAP.<\/p><p>Jackson notes that the financial statements submitted to the firm&#x27;s bankers did indeed report net income correctly in accordance with local GAAP. However, this figure was much less prominent than headline net income, as the GAAP income was disclosed only in the footnotes rather than on the face of the income statement.<\/p><p>Jackson believes that the legal settlements are payments made to dissatisfied customers and are a normal part of business. Jackson also believes that the increase in network cost is consistent with Troth&#x27;s increased focus on online operations. Troth&#x27;s required return on stockholders&#x27; equity is 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>If Jackson were to find that Troth has significant amounts of off-balance-sheet debt, the aspect of financial reporting quality that Troth Health&#x27;s balance sheet is most likely to be lacking is:<\/p><\/div>","subj":"fsa"},{"n":61,"q":"Regarding the LIFO cost flow assumption, which of the following is the most accurate adjustment to calculate EVA for Gigatech?","opts":["While there is no adjustment needed to the NOPAT, the change in the LIFO reserve should be added to the invested capital.","While there is no adjustment to the invested capital, the LIFO reserve should be added to NOPAT.","The LIFO reserve should be added to the invested capital, and the change in the LIFO reserve should be added to NOPAT."],"ans":"C","expl":"The correct adjustment is to add the LIFO reserve to the invested capital and add back the change in the LIFO reserve to NOPAT.\n(Module 23.1, LOS 23.a)","explhtml":"<p>The correct adjustment is to add the LIFO reserve to the invested capital and add back the change in the LIFO reserve to NOPAT.<\/p><p>(Module 23.1, LOS 23.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Jared Sampson, CFA, is analyzing Gigatech, a large U.S.-based technology conglomerate. Sampson first starts out calculating economic value added (EVA) for Gigatech and notices that the firm uses last-in, first-out (LIFO) cost flow assumption. Sampson is also valuing the stock of Heritage Builders, a developer of luxury residential communities. Heritage reports in accordance with the IFRS.<\/p><p>Heritage&#x27;s current book value per share is €15. In prior years, Heritage has enjoyed high residual income. Going forward, Heritage&#x27;s return on equity (ROE) of 15% is expected to converge to its required rate of return of 12%, with a persistence factor of 0.60.<\/p><p>One of the concerns that Sampson has is the appropriateness of the residual income model of valuation for Heritage. He makes the following observations after analyzing Heritage&#x27;s financial statements:<\/p><p>1. The firm&#x27;s free cash flows have been negative in two of the last four years. 2. Heritage&#x27;s pension plan shows remeasurement losses of €128 million. 3. Heritage does not pay any dividends.<\/p><p>Finally, Sampson wonders what would lead to a higher estimate of the persistence factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the LIFO cost flow assumption, which of the following is the most accurate adjustment to calculate EVA for Gigatech?<\/p><\/div>","subj":"equity"},{"n":62,"q":"The estimate of value of Heritage stock using the residual income valuation is closest to:","opts":["€16.67.","€15.87.","€15.22."],"ans":"B","expl":"V0 = current book value + PV of continuing residual income B0(ROE−r)\nV0= B0 + [ (1+r−ω) 15(0.15−0.12) | ]\n= 15 + [ (1+0.12−0.6) | ] = 15.87\n(Module 23.4, LOS 23.h)","explhtml":"<p>V0 = current book value + PV of continuing residual income B0(ROE−r)<\/p><div class=\"tbl\"><table><tr><td>V0= B0 + [ (1+r−ω) 15(0.15−0.12)<\/td><td>]<\/td><\/tr><tr><td>= 15 + [ (1+0.12−0.6)<\/td><td>] = 15.87<\/td><\/tr><\/table><\/div><p>(Module 23.4, LOS 23.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jared Sampson, CFA, is analyzing Gigatech, a large U.S.-based technology conglomerate. Sampson first starts out calculating economic value added (EVA) for Gigatech and notices that the firm uses last-in, first-out (LIFO) cost flow assumption. Sampson is also valuing the stock of Heritage Builders, a developer of luxury residential communities. Heritage reports in accordance with the IFRS.<\/p><p>Heritage&#x27;s current book value per share is €15. In prior years, Heritage has enjoyed high residual income. Going forward, Heritage&#x27;s return on equity (ROE) of 15% is expected to converge to its required rate of return of 12%, with a persistence factor of 0.60.<\/p><p>One of the concerns that Sampson has is the appropriateness of the residual income model of valuation for Heritage. He makes the following observations after analyzing Heritage&#x27;s financial statements:<\/p><p>1. The firm&#x27;s free cash flows have been negative in two of the last four years. 2. Heritage&#x27;s pension plan shows remeasurement losses of €128 million. 3. Heritage does not pay any dividends.<\/p><p>Finally, Sampson wonders what would lead to a higher estimate of the persistence factor.<\/p><\/div><\/details><div class=\"qtext\"><p>The estimate of value of Heritage stock using the residual income valuation is closest to:<\/p><\/div>","subj":"equity"},{"n":63,"q":"Which observation regarding Heritage is problematic for use of the residual income valuation model?","opts":["Observation 2 only.","Observations 1 and 2.","Observations 1 and 3."],"ans":"A","expl":"Observations 1 and 3 justify the use of residual income model over other models. Observation 2 would lead to a violation of the clean surplus relationship: pension remeasurements go through OCI rather than the income statement. (Module 23.5, LOS 23.k) (Module 23.5, LOS 23.j)","explhtml":"<p>Observations 1 and 3 justify the use of residual income model over other models. Observation 2 would lead to a violation of the clean surplus relationship: pension remeasurements go through OCI rather than the income statement. (Module 23.5, LOS 23.k) (Module 23.5, LOS 23.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jared Sampson, CFA, is analyzing Gigatech, a large U.S.-based technology conglomerate. Sampson first starts out calculating economic value added (EVA) for Gigatech and notices that the firm uses last-in, first-out (LIFO) cost flow assumption. Sampson is also valuing the stock of Heritage Builders, a developer of luxury residential communities. Heritage reports in accordance with the IFRS.<\/p><p>Heritage&#x27;s current book value per share is €15. In prior years, Heritage has enjoyed high residual income. Going forward, Heritage&#x27;s return on equity (ROE) of 15% is expected to converge to its required rate of return of 12%, with a persistence factor of 0.60.<\/p><p>One of the concerns that Sampson has is the appropriateness of the residual income model of valuation for Heritage. He makes the following observations after analyzing Heritage&#x27;s financial statements:<\/p><p>1. The firm&#x27;s free cash flows have been negative in two of the last four years. 2. Heritage&#x27;s pension plan shows remeasurement losses of €128 million. 3. Heritage does not pay any dividends.<\/p><p>Finally, Sampson wonders what would lead to a higher estimate of the persistence factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Which observation regarding Heritage is problematic for use of the residual income valuation model?<\/p><\/div>","subj":"equity"},{"n":64,"q":"Which of the following would least likely lead to a higher persistence factor for Heritage?","opts":["Heritage does not pay any dividends.","Luxury residential builders have enjoyed a high persistence factor historically.","Heritage has a high level of ROE as compared to its peers."],"ans":"C","expl":"Higher persistence factors will be associated with the following: Low dividend payouts Historically high residual income persistence in the industry Lower persistence factors will be associated with the following: High return on equity Significant levels of nonrecurring items High accounting accruals (Module 23.4, LOS 23.h)","explhtml":"<p>Higher persistence factors will be associated with the following: Low dividend payouts Historically high residual income persistence in the industry Lower persistence factors will be associated with the following: High return on equity Significant levels of nonrecurring items High accounting accruals (Module 23.4, LOS 23.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jared Sampson, CFA, is analyzing Gigatech, a large U.S.-based technology conglomerate. Sampson first starts out calculating economic value added (EVA) for Gigatech and notices that the firm uses last-in, first-out (LIFO) cost flow assumption. Sampson is also valuing the stock of Heritage Builders, a developer of luxury residential communities. Heritage reports in accordance with the IFRS.<\/p><p>Heritage&#x27;s current book value per share is €15. In prior years, Heritage has enjoyed high residual income. Going forward, Heritage&#x27;s return on equity (ROE) of 15% is expected to converge to its required rate of return of 12%, with a persistence factor of 0.60.<\/p><p>One of the concerns that Sampson has is the appropriateness of the residual income model of valuation for Heritage. He makes the following observations after analyzing Heritage&#x27;s financial statements:<\/p><p>1. The firm&#x27;s free cash flows have been negative in two of the last four years. 2. Heritage&#x27;s pension plan shows remeasurement losses of €128 million. 3. Heritage does not pay any dividends.<\/p><p>Finally, Sampson wonders what would lead to a higher estimate of the persistence factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following would least likely lead to a higher persistence factor for Heritage?<\/p><\/div>","subj":"equity"},{"n":65,"q":"The required rate of return estimate for equity of Freedom Corporation is closest to:","opts":["3%.","6%.","9%."],"ans":"C","expl":"year-ahead dividend\nrequired return estimate = market price ($3.00×0.40) | + expected dividend growth rate\nrequired return estimate | = | + 0.06\n($15,000 million/ 375 million = 0.09 | )\nSince Freedom Corporation has a dividend policy of paying 40% of earnings, dividend growth equals earnings growth.\nThe assumption is that Freedom's stock is correctly valued (and is given in the vignette).\n(Module 17.2, LOS 17.e)","explhtml":"<p>year-ahead dividend<\/p><div class=\"tbl\"><table><tr><td>required return estimate = market price ($3.00×0.40)<\/td><td>+ expected dividend growth rate<\/td><td><\/td><\/tr><tr><td>required return estimate<\/td><td>=<\/td><td>+ 0.06<\/td><\/tr><tr><td>(<sup>$15,000 million<\/sup>/ 375 million = 0.09<\/td><td>)<\/td><td><\/td><\/tr><\/table><\/div><p>Since Freedom Corporation has a dividend policy of paying 40% of earnings, dividend growth equals earnings growth.<\/p><p>The assumption is that Freedom&#x27;s stock is correctly valued (and is given in the vignette).<\/p><p>(Module 17.2, LOS 17.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Sentinel News is a publisher of more than 100 newspapers around the country, with the exception of the Midwestern states. The company&#x27;s CFO, Harry Miller, has been reviewing a number of potential candidates (both public and private companies) that would provide Sentinel News entrance into the Midwestern market. Recently, the founder of Midwest News, a small, private newspaper company, passed away. The founder&#x27;s family members are inclined to sell their 80% controlling interest.<\/p><p>Miller noted that Midwest News does not pay a dividend, nor does the company have any debt. The most comparable publicly traded stock is Freedom Corporation. Freedom, however, has significant radio and television operations. Freedom is expected to maintain a payout ratio of 40%. Analysts are forecasting the company will earn $3.00 per share next year and grow their earnings by 6% per year. Freedom has a current market capitalization of $15 billion and 375 million shares outstanding. Freedom&#x27;s current market value equals its intrinsic value.<\/p><p>Miller&#x27;s staff uses current expectations to develop the appropriate equity risk premium for Midwest News. Miller believes the best method to estimate the required return on equity of Midwest News is the build-up method. All relevant information to determine Midwest News&#x27;s required return on equity is presented in Exhibit 1.<\/p><p>Exhibit 1: Required Return Estimate Factors<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>4.0%<\/td><\/tr><tr><td>Small size premium<\/td><td>3.5%<\/td><\/tr><tr><td>Specific-company premium<\/td><td>2.0%<\/td><\/tr><tr><td>Beta<\/td><td>1.2<\/td><\/tr><tr><td>Growth rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>Miller makes two statements concerning cost of capital as shown below:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>In some less-developed countries that lack corporate debt markets, businesses have to rely on bank lending known as the shadow banking system.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Countries that follow common law–based legal systems offer lower risk premiums compared to countries with civil law– based legal systems.<\/td><\/tr><\/table><\/div><p>Miller is also looking into foreign media companies. Specifically, Miller is evaluating the valuation of Maura Ltd., a media house in an emerging economy.<\/p><\/div><\/details><div class=\"qtext\"><p>The required rate of return estimate for equity of Freedom Corporation is closest to:<\/p><\/div>","subj":"corporate"},{"n":66,"q":"Using the build-up method, Midwest News's required return on equity is closest to:","opts":["13.0%.","13.8%.","15.8%."],"ans":"A","expl":"ri = risk-free rate + equity risk premium + size premiumi + specific-company premiumi ri = 3.5% + 4.0% + 3.5% + 2.0% = 13.0% (Module 17.2, LOS 17.e)","explhtml":"<p>ri = risk-free rate + equity risk premium + size premiumi + specific-company premiumi ri = 3.5% + 4.0% + 3.5% + 2.0% = 13.0% (Module 17.2, LOS 17.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sentinel News is a publisher of more than 100 newspapers around the country, with the exception of the Midwestern states. The company&#x27;s CFO, Harry Miller, has been reviewing a number of potential candidates (both public and private companies) that would provide Sentinel News entrance into the Midwestern market. Recently, the founder of Midwest News, a small, private newspaper company, passed away. The founder&#x27;s family members are inclined to sell their 80% controlling interest.<\/p><p>Miller noted that Midwest News does not pay a dividend, nor does the company have any debt. The most comparable publicly traded stock is Freedom Corporation. Freedom, however, has significant radio and television operations. Freedom is expected to maintain a payout ratio of 40%. Analysts are forecasting the company will earn $3.00 per share next year and grow their earnings by 6% per year. Freedom has a current market capitalization of $15 billion and 375 million shares outstanding. Freedom&#x27;s current market value equals its intrinsic value.<\/p><p>Miller&#x27;s staff uses current expectations to develop the appropriate equity risk premium for Midwest News. Miller believes the best method to estimate the required return on equity of Midwest News is the build-up method. All relevant information to determine Midwest News&#x27;s required return on equity is presented in Exhibit 1.<\/p><p>Exhibit 1: Required Return Estimate Factors<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>4.0%<\/td><\/tr><tr><td>Small size premium<\/td><td>3.5%<\/td><\/tr><tr><td>Specific-company premium<\/td><td>2.0%<\/td><\/tr><tr><td>Beta<\/td><td>1.2<\/td><\/tr><tr><td>Growth rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>Miller makes two statements concerning cost of capital as shown below:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>In some less-developed countries that lack corporate debt markets, businesses have to rely on bank lending known as the shadow banking system.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Countries that follow common law–based legal systems offer lower risk premiums compared to countries with civil law– based legal systems.<\/td><\/tr><\/table><\/div><p>Miller is also looking into foreign media companies. Specifically, Miller is evaluating the valuation of Maura Ltd., a media house in an emerging economy.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the build-up method, Midwest News&#x27;s required return on equity is closest to:<\/p><\/div>","subj":"corporate"},{"n":67,"q":"Miller has made two statements, the shadow banking system, and the other concerning the characteristics of common law-based and civil law-based legal systems. Are Miller's statements correct?","opts":["Only Statement 1 is correct.","Only Statement 2 is correct.","Both Statements 1 and 2 are correct."],"ans":"B","expl":"Statement 1 is incorrect. Shadow banking system relies on unregulated, non-bank sources.\nStatement 2 is correct. Countries that follow common law–based legal systems offer stronger protection to investors, leading to lower risk premiums compared to countries with civil law–based legal systems.\n(Module 17.1, LOS 17.a)","explhtml":"<p>Statement 1 is incorrect. Shadow banking system relies on unregulated, non-bank sources.<\/p><p>Statement 2 is correct. Countries that follow common law–based legal systems offer stronger protection to investors, leading to lower risk premiums compared to countries with civil law–based legal systems.<\/p><p>(Module 17.1, LOS 17.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sentinel News is a publisher of more than 100 newspapers around the country, with the exception of the Midwestern states. The company&#x27;s CFO, Harry Miller, has been reviewing a number of potential candidates (both public and private companies) that would provide Sentinel News entrance into the Midwestern market. Recently, the founder of Midwest News, a small, private newspaper company, passed away. The founder&#x27;s family members are inclined to sell their 80% controlling interest.<\/p><p>Miller noted that Midwest News does not pay a dividend, nor does the company have any debt. The most comparable publicly traded stock is Freedom Corporation. Freedom, however, has significant radio and television operations. Freedom is expected to maintain a payout ratio of 40%. Analysts are forecasting the company will earn $3.00 per share next year and grow their earnings by 6% per year. Freedom has a current market capitalization of $15 billion and 375 million shares outstanding. Freedom&#x27;s current market value equals its intrinsic value.<\/p><p>Miller&#x27;s staff uses current expectations to develop the appropriate equity risk premium for Midwest News. Miller believes the best method to estimate the required return on equity of Midwest News is the build-up method. All relevant information to determine Midwest News&#x27;s required return on equity is presented in Exhibit 1.<\/p><p>Exhibit 1: Required Return Estimate Factors<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>4.0%<\/td><\/tr><tr><td>Small size premium<\/td><td>3.5%<\/td><\/tr><tr><td>Specific-company premium<\/td><td>2.0%<\/td><\/tr><tr><td>Beta<\/td><td>1.2<\/td><\/tr><tr><td>Growth rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>Miller makes two statements concerning cost of capital as shown below:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>In some less-developed countries that lack corporate debt markets, businesses have to rely on bank lending known as the shadow banking system.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Countries that follow common law–based legal systems offer lower risk premiums compared to countries with civil law– based legal systems.<\/td><\/tr><\/table><\/div><p>Miller is also looking into foreign media companies. Specifically, Miller is evaluating the valuation of Maura Ltd., a media house in an emerging economy.<\/p><\/div><\/details><div class=\"qtext\"><p>Miller has made two statements, the shadow banking system, and the other concerning the characteristics of common law-based and civil law-based legal systems. Are Miller&#x27;s statements correct?<\/p><\/div>","subj":"corporate"},{"n":68,"q":"Which of the following approaches would be least appropriate to measure the cost of capital of Maura Ltd.?","opts":["Expanded CAPM.","Extended CAPM.","Country risk premium."],"ans":"A","expl":"Two approaches to estimating the cost of equity of a foreign company are (1) country risk premium model and (2) the extended CAPM. Expanded CAPM is used for domestic private companies where additional risk premia (above those applicable for public companies) are applicable. (Module 17.2, LOS 17.d)","explhtml":"<p>Two approaches to estimating the cost of equity of a foreign company are (1) country risk premium model and (2) the extended CAPM. Expanded CAPM is used for domestic private companies where additional risk premia (above those applicable for public companies) are applicable. (Module 17.2, LOS 17.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sentinel News is a publisher of more than 100 newspapers around the country, with the exception of the Midwestern states. The company&#x27;s CFO, Harry Miller, has been reviewing a number of potential candidates (both public and private companies) that would provide Sentinel News entrance into the Midwestern market. Recently, the founder of Midwest News, a small, private newspaper company, passed away. The founder&#x27;s family members are inclined to sell their 80% controlling interest.<\/p><p>Miller noted that Midwest News does not pay a dividend, nor does the company have any debt. The most comparable publicly traded stock is Freedom Corporation. Freedom, however, has significant radio and television operations. Freedom is expected to maintain a payout ratio of 40%. Analysts are forecasting the company will earn $3.00 per share next year and grow their earnings by 6% per year. Freedom has a current market capitalization of $15 billion and 375 million shares outstanding. Freedom&#x27;s current market value equals its intrinsic value.<\/p><p>Miller&#x27;s staff uses current expectations to develop the appropriate equity risk premium for Midwest News. Miller believes the best method to estimate the required return on equity of Midwest News is the build-up method. All relevant information to determine Midwest News&#x27;s required return on equity is presented in Exhibit 1.<\/p><p>Exhibit 1: Required Return Estimate Factors<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>4.0%<\/td><\/tr><tr><td>Small size premium<\/td><td>3.5%<\/td><\/tr><tr><td>Specific-company premium<\/td><td>2.0%<\/td><\/tr><tr><td>Beta<\/td><td>1.2<\/td><\/tr><tr><td>Growth rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>Miller makes two statements concerning cost of capital as shown below:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>In some less-developed countries that lack corporate debt markets, businesses have to rely on bank lending known as the shadow banking system.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Countries that follow common law–based legal systems offer lower risk premiums compared to countries with civil law– based legal systems.<\/td><\/tr><\/table><\/div><p>Miller is also looking into foreign media companies. Specifically, Miller is evaluating the valuation of Maura Ltd., a media house in an emerging economy.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following approaches would be least appropriate to measure the cost of capital of Maura Ltd.?<\/p><\/div>","subj":"corporate"},{"n":69,"q":"Lowenstadt's Statement 1 is best described as:","opts":["incorrect, as he should have instead stated American call option.","incorrect, as he should have instead stated European put option.","correct."],"ans":"C","expl":"European call on assets is the correct analogy for equity under the structural model for credit analysis.\n(Module 28.4, LOS 28.d)","explhtml":"<p>European call on assets is the correct analogy for equity under the structural model for credit analysis.<\/p><p>(Module 28.4, LOS 28.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses.<\/p><p>Lowenstadt makes the following statement regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the company&#x27;s assets.<\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CTT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 1.<\/p><p>Exhibit 1: CTT Firm View on Reduced Form Models<\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of default over the next time period. Default intensity is estimated using option pricing models.<\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CTT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 2.<\/p><p>Exhibit 2: ABS Overview<\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk.<\/p><p>Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement.<\/p><p>Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Lowenstadt&#x27;s Statement 1 is best described as:<\/p><\/div>","subj":"fixed"},{"n":70,"q":"Given Lowenstadt's scenario, relative to the price performance of the straight bond issued by ZT, Inc., the callable bond is most likely to have:","opts":["equal or poorer price performance.","equal or better price performance.","the same price performance."],"ans":"B","expl":"Given Lowenstadt's scenario of a ratings downgrade, spreads should widen. Callable bonds have a duration that is lower than (or equal to) the duration of comparable straight bonds. Hence, the decline in price for a callable ZT bond will be less than (or equal to) the decline in price of an equivalent straight ZT bond.\n(Module 28.6, LOS 28.f)\n(Module 27.5, LOS 27.j)","explhtml":"<p>Given Lowenstadt&#x27;s scenario of a ratings downgrade, spreads should widen. Callable bonds have a duration that is lower than (or equal to) the duration of comparable straight bonds. Hence, the decline in price for a callable ZT bond will be less than (or equal to) the decline in price of an equivalent straight ZT bond.<\/p><p>(Module 28.6, LOS 28.f)<\/p><p>(Module 27.5, LOS 27.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses.<\/p><p>Lowenstadt makes the following statement regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the company&#x27;s assets.<\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CTT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 1.<\/p><p>Exhibit 1: CTT Firm View on Reduced Form Models<\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of default over the next time period. Default intensity is estimated using option pricing models.<\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CTT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 2.<\/p><p>Exhibit 2: ABS Overview<\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk.<\/p><p>Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement.<\/p><p>Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Given Lowenstadt&#x27;s scenario, relative to the price performance of the straight bond issued by ZT, Inc., the callable bond is most likely to have:<\/p><\/div>","subj":"fixed"},{"n":71,"q":"Which of Lowenstadt's points in Exhibit 1 is correct?","opts":["Only point 1 is accurate.","Only point 2 is accurate.","Neither point is accurate."],"ans":"A","expl":"While structural models provide economic rationale regarding why default occurs (i.e., when AT < K), reduced form models do not. Default intensity is typically estimated using regression models (not option pricing models).\n(Module 28.4, LOS 28.d)","explhtml":"<p>While structural models provide economic rationale regarding why default occurs (i.e., when AT &lt; K), reduced form models do not. Default intensity is typically estimated using regression models (not option pricing models).<\/p><p>(Module 28.4, LOS 28.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses.<\/p><p>Lowenstadt makes the following statement regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the company&#x27;s assets.<\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CTT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 1.<\/p><p>Exhibit 1: CTT Firm View on Reduced Form Models<\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of default over the next time period. Default intensity is estimated using option pricing models.<\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CTT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 2.<\/p><p>Exhibit 2: ABS Overview<\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk.<\/p><p>Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement.<\/p><p>Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Lowenstadt&#x27;s points in Exhibit 1 is correct?<\/p><\/div>","subj":"fixed"},{"n":72,"q":"Lowenstadt's overview of asset-backed securities in Exhibit 2 most likely contains an error in:","opts":["Section 1, because short-term granular and homogenous structured finance vehicles are evaluated using a statistical-based approach, while medium-term granular and homogenous obligations are evaluated using a","portfolio-based approach. Section 2, because counterparty risk is not relevant for servicer quality.","Section 3, because credit enhancement is not relevant for asset-backed securities."],"ans":"A","expl":"Short-term granular and homogenous structured finance vehicles are evaluated using a statistical-based approach. Medium-term granular and homogenous obligations are evaluated using a portfolio-based approach because the portfolio composition varies over time. All other sections are correct.\n(Module 28.7, LOS 28.h)","explhtml":"<p>Short-term granular and homogenous structured finance vehicles are evaluated using a statistical-based approach. Medium-term granular and homogenous obligations are evaluated using a portfolio-based approach because the portfolio composition varies over time. All other sections are correct.<\/p><p>(Module 28.7, LOS 28.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses.<\/p><p>Lowenstadt makes the following statement regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the company&#x27;s assets.<\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CTT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 1.<\/p><p>Exhibit 1: CTT Firm View on Reduced Form Models<\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of default over the next time period. Default intensity is estimated using option pricing models.<\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CTT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 2.<\/p><p>Exhibit 2: ABS Overview<\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk.<\/p><p>Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement.<\/p><p>Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Lowenstadt&#x27;s overview of asset-backed securities in Exhibit 2 most likely contains an error in:<\/p><\/div>","subj":"fixed"},{"n":73,"q":"Indicate whether the statements made by Stamper in his memo regarding the value of the embedded option and the effect of the volatility assumption are correct.","opts":["Only the statement regarding the value of the embedded option is correct.","Only the statement regarding the effect of the volatility assumption is correct.","Both statements are correct."],"ans":"C","expl":"Statement 1 is correct. The value of the option would be the difference between the value calculated with no call feature and the value calculated assuming the bond is callable.\nStatement 2 is also correct. Increased volatility would increase the value of the option, thus lowering the value of the callable bond.\n(Module 27.1, LOS 27.b)","explhtml":"<p>Statement 1 is correct. The value of the option would be the difference between the value calculated with no call feature and the value calculated assuming the bond is callable.<\/p><p>Statement 2 is also correct. Increased volatility would increase the value of the option, thus lowering the value of the callable bond.<\/p><p>(Module 27.1, LOS 27.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Fixed Income<\/summary><div class=\"vig-body\"><p>Ben Stamper, CFA, is evaluating callable bonds issued by Gardein, Inc. Stamper has decided to calculate the value of the Gardein bonds using a binomial interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Stamper summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo.<\/p><p>In this memo, Stamper makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The value of the option embedded in the Gardein bonds can be derived by simply subtracting the interest rate tree value of the Gardein bonds from the interest rate tree value of the otherwise comparable straight bonds.<\/td><\/tr><tr><td>Statement 2:<\/td><td>I am concerned that the 10% volatility assumption used to develop the interest rate tree might be too low. A higher volatility assumption would result in a lower value for the Gardein bonds.<\/td><\/tr><\/table><\/div><p>After reviewing Stamper&#x27;s analysis, Puldo notes that Stamper has not included any information on the option adjusted spread (OAS) for the Gardein bonds. Puldo suggests that Stamper should evaluate the OAS in order to get an idea of the liquidity risk of the Gardein bonds. Stamper counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>Stamper provides Puldo with the process used by the firm to evaluate credit risk as shown in Exhibit 1.<\/p><p>Exhibit 1: Key Underlying Principles<\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss.<\/p><p>2. The sum of expected losses for each period is equal to the cumulative valuation adjustment.<\/p><p>3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated.<\/p><p>Stamper also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes the following observation:<\/p><p>Observation: Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a European put option on the assets of the company with a strike price equal to K and maturing at time T.<\/p><\/div><\/details><div class=\"qtext\"><p>Indicate whether the statements made by Stamper in his memo regarding the value of the embedded option and the effect of the volatility assumption are correct.<\/p><\/div>","subj":"fixed"},{"n":74,"q":"Which of the following most accurately critiques the OAS discussion between Stamper and Puldo? Puldo is:","opts":["correct that the OAS will provide insight into the liquidity risk of the Gardein bonds, and Stamper is correct that different volatility assumptions would change the OAS.","correct that the OAS will provide insight into the liquidity risk of the Gardein Bonds, but Stamper is incorrect since OAS implicitly adjusts for the volatility of interest rates.","incorrect that the OAS will provide insight into the liquidity risk of the Gardein Bonds, but Stamper is correct that different volatility assumptions would change the OAS."],"ans":"A","expl":"The OAS accounts for compensation for credit and liquidity risk after the optionality has been removed (i.e., after the cash flows have been adjusted). Since in this case the credit risk of the bonds is similar, the OAS could prove helpful in evaluating the relative liquidity risk. OAS will be affected by different assumptions regarding the volatility of interest rates.\n(Module 27.4, LOS 27.g)","explhtml":"<p>The OAS accounts for compensation for credit and liquidity risk after the optionality has been removed (i.e., after the cash flows have been adjusted). Since in this case the credit risk of the bonds is similar, the OAS could prove helpful in evaluating the relative liquidity risk. OAS will be affected by different assumptions regarding the volatility of interest rates.<\/p><p>(Module 27.4, LOS 27.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ben Stamper, CFA, is evaluating callable bonds issued by Gardein, Inc. Stamper has decided to calculate the value of the Gardein bonds using a binomial interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Stamper summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo.<\/p><p>In this memo, Stamper makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The value of the option embedded in the Gardein bonds can be derived by simply subtracting the interest rate tree value of the Gardein bonds from the interest rate tree value of the otherwise comparable straight bonds.<\/td><\/tr><tr><td>Statement 2:<\/td><td>I am concerned that the 10% volatility assumption used to develop the interest rate tree might be too low. A higher volatility assumption would result in a lower value for the Gardein bonds.<\/td><\/tr><\/table><\/div><p>After reviewing Stamper&#x27;s analysis, Puldo notes that Stamper has not included any information on the option adjusted spread (OAS) for the Gardein bonds. Puldo suggests that Stamper should evaluate the OAS in order to get an idea of the liquidity risk of the Gardein bonds. Stamper counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>Stamper provides Puldo with the process used by the firm to evaluate credit risk as shown in Exhibit 1.<\/p><p>Exhibit 1: Key Underlying Principles<\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss.<\/p><p>2. The sum of expected losses for each period is equal to the cumulative valuation adjustment.<\/p><p>3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated.<\/p><p>Stamper also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes the following observation:<\/p><p>Observation: Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a European put option on the assets of the company with a strike price equal to K and maturing at time T.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following most accurately critiques the OAS discussion between Stamper and Puldo? Puldo is:<\/p><\/div>","subj":"fixed"},{"n":75,"q":"In Exhibit 1, which of the underlying principles outlined by Stamper is most accurate?","opts":["Principle 1.","Principle 2.","Principle 3."],"ans":"C","expl":"The expected loss is (the probability of default) × (loss given default), not the recovery rate. Credit valuation adjustment (CVA) is the sum of the present value of the expected loss for each period. In general, given the market price (and hence the implied credit spread), the estimated risk-neutral probabilities of default and recovery rates are positively correlated.\n(Module 28.1, LOS 28.a)","explhtml":"<p>The expected loss is (the probability of default) × (loss given default), not the recovery rate. Credit valuation adjustment (CVA) is the sum of the present value of the expected loss for each period. In general, given the market price (and hence the implied credit spread), the estimated risk-neutral probabilities of default and recovery rates are positively correlated.<\/p><p>(Module 28.1, LOS 28.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ben Stamper, CFA, is evaluating callable bonds issued by Gardein, Inc. Stamper has decided to calculate the value of the Gardein bonds using a binomial interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Stamper summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo.<\/p><p>In this memo, Stamper makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The value of the option embedded in the Gardein bonds can be derived by simply subtracting the interest rate tree value of the Gardein bonds from the interest rate tree value of the otherwise comparable straight bonds.<\/td><\/tr><tr><td>Statement 2:<\/td><td>I am concerned that the 10% volatility assumption used to develop the interest rate tree might be too low. A higher volatility assumption would result in a lower value for the Gardein bonds.<\/td><\/tr><\/table><\/div><p>After reviewing Stamper&#x27;s analysis, Puldo notes that Stamper has not included any information on the option adjusted spread (OAS) for the Gardein bonds. Puldo suggests that Stamper should evaluate the OAS in order to get an idea of the liquidity risk of the Gardein bonds. Stamper counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>Stamper provides Puldo with the process used by the firm to evaluate credit risk as shown in Exhibit 1.<\/p><p>Exhibit 1: Key Underlying Principles<\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss.<\/p><p>2. The sum of expected losses for each period is equal to the cumulative valuation adjustment.<\/p><p>3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated.<\/p><p>Stamper also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes the following observation:<\/p><p>Observation: Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a European put option on the assets of the company with a strike price equal to K and maturing at time T.<\/p><\/div><\/details><div class=\"qtext\"><p>In Exhibit 1, which of the underlying principles outlined by Stamper is most accurate?<\/p><\/div>","subj":"fixed"},{"n":76,"q":"Stamper's observation about the structural model is most likely:","opts":["incorrect, as he should have instead stated purchasing a European call option.","incorrect, as he should have instead stated selling a European put option.","correct."],"ans":"B","expl":"The option analogy for debt states that a long position in risky debt is equivalent to a long position in a riskless bond plus a short European put on the company's assets.\n(Module 28.4, LOS 28.d)","explhtml":"<p>The option analogy for debt states that a long position in risky debt is equivalent to a long position in a riskless bond plus a short European put on the company&#x27;s assets.<\/p><p>(Module 28.4, LOS 28.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ben Stamper, CFA, is evaluating callable bonds issued by Gardein, Inc. Stamper has decided to calculate the value of the Gardein bonds using a binomial interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Stamper summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo.<\/p><p>In this memo, Stamper makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The value of the option embedded in the Gardein bonds can be derived by simply subtracting the interest rate tree value of the Gardein bonds from the interest rate tree value of the otherwise comparable straight bonds.<\/td><\/tr><tr><td>Statement 2:<\/td><td>I am concerned that the 10% volatility assumption used to develop the interest rate tree might be too low. A higher volatility assumption would result in a lower value for the Gardein bonds.<\/td><\/tr><\/table><\/div><p>After reviewing Stamper&#x27;s analysis, Puldo notes that Stamper has not included any information on the option adjusted spread (OAS) for the Gardein bonds. Puldo suggests that Stamper should evaluate the OAS in order to get an idea of the liquidity risk of the Gardein bonds. Stamper counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>Stamper provides Puldo with the process used by the firm to evaluate credit risk as shown in Exhibit 1.<\/p><p>Exhibit 1: Key Underlying Principles<\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss.<\/p><p>2. The sum of expected losses for each period is equal to the cumulative valuation adjustment.<\/p><p>3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated.<\/p><p>Stamper also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes the following observation:<\/p><p>Observation: Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a European put option on the assets of the company with a strike price equal to K and maturing at time T.<\/p><\/div><\/details><div class=\"qtext\"><p>Stamper&#x27;s observation about the structural model is most likely:<\/p><\/div>","subj":"fixed"},{"n":77,"q":"Jackman's Statement 1 is most likely:","opts":["correct.","incorrect about long receiver swaption and short payer swaption.","incorrect about the exercise rate being equal to the market swap fixed rate if the premiums of the two swaptions are equal."],"ans":"B","expl":"A payer swap can be replicated using a long payer swaption and short receiver swaption with the same exercise rates. Jackman's Statement 1 about how if the premiums of the two options are equal, the exercise rate must be equal to the market swap fixed rate is correct. (Module 31.6, LOS 31.j)","explhtml":"<p>A payer swap can be replicated using a long payer swaption and short receiver swaption with the same exercise rates. Jackman&#x27;s Statement 1 about how if the premiums of the two options are equal, the exercise rate must be equal to the market swap fixed rate is correct. (Module 31.6, LOS 31.j)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Derivatives<\/summary><div class=\"vig-body\"><p>Simon Jackman, a junior analyst for Tucker Group Limited (TGL), has been asked to evaluate the firm&#x27;s various swap transactions and interest rate option positions. TGL&#x27;s counterparty for many of these derivatives is MBS Bank, a large full-service bank in Australia.<\/p><p>Jackman begins writing his report for the management of TGL. In the report, Jackman makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>A payer swap can be replicated using a long receiver swaption and a<\/td><\/tr><tr><td>1:<\/td><td>short payer swaption with the same exercise rates. If the exercise rate is set such that the premiums of the payer and receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><\/tr><tr><td>Statement<\/td><td>A long callable bond can be replicated using a long option-free bond<\/td><\/tr><tr><td>2:<\/td><td>plus a short receiver swaption.<\/td><\/tr><\/table><\/div><p>Jackman is also evaluating a two-year European interest rate call option with a strike rate of 5% and a notional principal of $2 million. Jackman wants to use a binomial tree as shown in Exhibit 1 to value the option.<\/p><p>Exhibit 1: Two-Period Interest Rate Tree<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAEjAcADAREAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYFAwQCAQcI/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEAMQAAAB+qAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEfNQygAAAAArySliAAAAAAAAAAAAAAAAAAACPF4ZQAAAAAVJlLEAAAAAAAAAAAAAAAAAAAEeLszAGibZrmMymYyAFSZSxAAAAAAAAAAAAAAAAAAAMBHSRmYGAhROCIGA3zKSYAqTKWIAAAAAAAAABiOQAAAAADoyg5PhJOScmYHBXnRlNc3TXN8AqTKWIAAAAAAAAABDCzAAAAAAKsmhwQ0lRUl4ZQAAAAAVJkLIAAAAAAAAAAi5KAAAAAACNEhIcTAylWVZ0AAAAADASM2gAAAAAAAAACLkoAK48PTg1D0tzOARM1iZHYAAAAAAAAAAAAAAAAAAKcjRPQDCUZvGsDWMxIAD5+SguAAAAAAAAAADRNA9AAAAAPDouwcHyw6PqgB4enJ0AeHoBGgbRdg8MYAAAAAAMoBFS/PQAAAAAR0lRyQ4l5HCUgAAAAAEaJKR89L8j5gMoAAAAAK8kJYgi5KAAAAAACNl2RMmJkI2YwAAAAAD0k4KIoSzJEZgAAAAAVJkLIEXJQAa5mNEGQzGYAEVNQmZ0AAAAAAAAAD5ib5O s. TGL&#x27;s counterparty for many of these derivatives is MBS Bank, a large full-service bank in Australia.<\/p><p>Jackman begins writing his report for the management of TGL. In the report, Jackman makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>A payer swap can be replicated using a long receiver swaption and a<\/td><\/tr><tr><td>1:<\/td><td>short payer swaption with the same exercise rates. If the exercise rate is set such that the premiums of the payer and receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><\/tr><tr><td>Statement<\/td><td>A long callable bond can be replicated using a long option-free bond<\/td><\/tr><tr><td>2:<\/td><td>plus a short receiver swaption.<\/td><\/tr><\/table><\/div><p>Jackman is also evaluating a two-year European interest rate call option with a strike rate of 5% and a notional principal of $2 million. Jackman wants to use a binomial tree as shown in Exhibit 1 to value the option.<\/p><p>Exhibit 1: Two-Period Interest Rate Tree<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAEjAcADAREAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYFAwQCAQcI/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEAMQAAAB+qAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEfNQygAAAAArySliAAAAAAAAAAAAAAAAAAACPF4ZQAAAAAVJlLEAAAAAAAAAAAAAAAAAAAEeLszAGibZrmMymYyAFSZSxAAAAAAAAAAAAAAAAAAAMBHSRmYGAhROCIGA3zKSYAqTKWIAAAAAAAAABiOQAAAAADoyg5PhJOScmYHBXnRlNc3TXN8AqTKWIAAAAAAAAABDCzAAAAAAKsmhwQ0lRUl4ZQAAAAAVJkLIAAAAAAAAAAi5KAAAAAACNEhIcTAylWVZ0AAAAADASM2gAAAAAAAAACLkoAK48PTg1D0tzOARM1iZHYAAAAAAAAAAAAAAAAAAKcjRPQDCUZvGsDWMxIAD5+SguAAAAAAAAAADRNA9AAAAAPDouwcHyw6PqgB4enJ0AeHoBGgbRdg8MYAAAAAAMoBFS/PQAAAAAR0lRyQ –<\/sup><\/p><div class=\"tbl\"><table><tr><td>Similarly, the value at node C<\/td><td> can be calculated as:<\/td><\/tr><\/table><\/div><p>[Max (0, 0.0504 − 0.05)] × $2,000,000 = $800 <sup>+<\/sup> Value at node C = [(0.5 × 66,000) + (0.5 × 800)] / (1.0531) = $31,716 <sup>–<\/sup> Value at node C = [(0.5 × 800) + 0] / (1.0322) = $388 And the value at node C = [(0.5 × 31,716) + (0.5 × 388)] / (1.04) = $15,435 (Module 31.5, LOS 31.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Simon Jackman, a junior analyst for Tucker Group Limited (TGL), has been asked to evaluate the firm&#x27;s various swap transactions and interest rate option positions. TGL&#x27;s counterparty for many of these derivatives is MBS Bank, a large full-service bank in Australia.<\/p><p>Jackman begins writing his report for the management of TGL. In the report, Jackman makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>A payer swap can be replicated using a long receiver swaption and a<\/td><\/tr><tr><td>1:<\/td><td>short payer swaption with the same exercise rates. If the exercise rate is set such that the premiums of the payer and receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><\/tr><tr><td>Statement<\/td><td>A long callable bond can be replicated using a long option-free bond<\/td><\/tr><tr><td>2:<\/td><td>plus a short receiver swaption.<\/td><\/tr><\/table><\/div><p>Jackman is also evaluating a two-year European interest rate call option with a strike rate of 5% and a notional principal of $2 million. Jackman wants to use a binomial tree as shown in Exhibit 1 to value the option.<\/p><p>Exhibit 1: Two-Period Interest Rate Tree<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAA
