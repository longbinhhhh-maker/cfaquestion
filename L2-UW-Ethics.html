<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<header>

const DATA = [{"n":1,"q":"When distributing the report through instant messaging, does Viklund most likely violate the Standards?","opts":["Yes","No, since he followed BB's written procedures","No, since BB's compliance officer should have warned him"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a001.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a001.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Nathaniel Viklund, CFA, is a research analyst at Brinson Brokers (BB). He covers several companies in the retail industry, including Guadiana Stores. In the previous month, after extensive research and analysis, Viklund wrote a report with a buy recommendation of Guadiana stock. He distributed the report to all BB&#x27;s clients through email, text messaging, and instant messaging apps, strictly following BB&#x27;s written procedures, which were revised by BB&#x27;s compliance officer two years ago.<\/p><p>However, just after the report was released, one of Viklund&#x27;s clients informed him that, six months earlier, a new regulation had prohibited the use of instant messaging to distribute investment opinions or recommendations. Viklund instantly contacted the compliance officer, who was also unaware of the new regulation and immediately updated BB&#x27;s written procedures.<\/p><p>Later, Guadiana announces the closing of several stores, prompting Viklund to update his research. He concludes that his recommendation should be changed to &quot;hold.&quot; In a call with some of BB&#x27;s clients, he explains the new outlook and the change in recommendation. These &quot;premium&quot; clients pay an additional fee for this personalized service, which is offered to all BB&#x27;s existing and prospective clients. Viklund includes his updated report with the new recommendation in BB&#x27;s weekly newsletter, which is released and distributed to all clients two days later.<\/p><p>Viklund receives a call from Victoria Mwape, CFA, an independent financial adviser who is a client of BB. Mwape recommended the stock of Tagus Corp. to her clients, based on a report written by Viklund. In the report, after diligent analysis and with reasonable basis, Viklund recommended buying Tagus, but the stock has declined sharply since then. Mwape&#x27;s clients have had difficulty selling the stock due to its low liquidity. She contends the report should have warned that the stock was highly illiquid, and Viklund explains that Tagus&#x27;s low average trading volume was public information.<\/p><p>Tagus recently announced a substantial impairment loss on an investment in an online retailer. When Mwape complains that Viklund&#x27;s report did not include a warning about this, Viklund replies that his research did not indicate a risk of impairment. Mwape also believes that the report was misleading since it stated, &quot;Given an estimated increase in operating margin from 11% to 16% in the next three years, our recommendation for Tagus stock is a strong buy.&quot; After the report<\/p><p>was written, Tagus released its quarterly financial results, disclosing that its operating margin decreased to 9.5%.<\/p><p>Mwape gathers information on the financial objectives and constraints of all her new clients. She uses that information to develop individual investment policy statements (IPS), which she updates at least annually. After determining each client&#x27;s risk profile, Mwape usually recommends<\/p><p>allocating a portion of the client&#x27;s assets to the same index-based ETF. For the most risk-averse clients, she also typically recommends buying index put options to limit potential losses from a decrease in the ETF&#x27;s price. She makes the recommendations according to each client&#x27;s IPS and explains to each client the potential outcomes and the risks involved.<\/p><p>Mwape sends a monthly newsletter to her clients and prospective clients. In the latest newsletter, she presents the performance of Ticino Asset Management&#x27;s funds, which she has been recommending to her clients. Ticino hired an equity portfolio manager who had a remarkable 10-year track record at a previous company. Mwape presents this track record in the newsletter, disclosing both the portfolio manager&#x27;s specific role in achieving it and the fact that it occurred at a different firm. The performance is presented gross of fees, which is also disclosed.<\/p><p>One of Mwape&#x27;s clients is Mind the Future (MTF), a nongovernmental organization (NGO) that assists college students. In a recent meeting, MTF&#x27;s CEO told Mwape the organization had launched a fundraising campaign to create a network of libraries that would lend textbooks to low-income students. The CEO also mentioned that the board of directors was defining the budget and funding to renovate MTF&#x27;s headquarters. Later, Mwape meets with another client, the dean of a university, who tells her that the university recently awarded an honorary degree to one of MTF&#x27;s board members. Mwape tries to get the CEO&#x27;s opinion on this, but she cannot reach the CEO by phone. In the monthly newsletter, she includes a section on MTF, disclosing the public fundraising, the headquarters renovation, and the honorary degree awarded to its board member.<\/p><\/div><\/details><div class=\"qtext\"><p>When distributing the report through instant messaging, does Viklund most likely violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q001.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":2,"q":"In the call with only BB's \"premium\" clients, does Viklund violate the CFA Institute Code ial outcomes and the risks involved.<\/p><p>Mwape sends a monthly newsletter to her clients and prospective clients. In the latest newsletter, she presents the performance of Ticino Asset Management&#x27;s funds, which she has been recommending to her clients. Ticino hired an equity portfolio manager who had a remarkable 10-year track record at a previous company. Mwape presents this track record in the newsletter, disclosing both the portfolio manager&#x27;s specific role in achieving it and the fact that it occurred at a different firm. The performance is presented gross of fees, which is also disclosed.<\/p><p>One of Mwape&#x27;s clients is Mind the Future (MTF), a nongovernmental organization (NGO) that assists college students. In a recent meeting, MTF&#x27;s CEO told Mwape the organization had launched a fundraising campaign to create a network of libraries that would lend textbooks to low-income students. The CEO also mentioned that the board of directors was defining the budget and funding to renovate MTF&#x27;s headquarters. Later, Mwape meets with another client, the dean of a university, who tells her that the university recently awarded an honorary degree to one of MTF&#x27;s board members. Mwape tries to get the CEO&#x27;s opinion on this, but she cannot reach the CEO by phone. In the monthly newsletter, she includes a section on MTF, disclosing the public fundraising, the headquarters renovation, and the honorary degree awarded to its board member.<\/p><\/div><\/details><div class=\"qtext\"><p>In her recommendations of ETFs and options, does Mwape most likely violate the CFA Institute Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q004.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":5,"q":"When presenting Ticino Asset Management's performance, does Mwape violate the CFA Institute Code and Standards?","opts":["No","Yes, since the performance is pres n BB&#x27;s weekly newsletter, which is released and distributed to all clients two days later.<\/p><p>Viklund receives a call from Victoria Mwape, CFA, an independent financial adviser who is a client of BB. Mwape recommended the stock of Tagus Corp. to her clients, based on a report written by Viklund. In the report, after diligent analysis and with reasonable basis, Viklund recommended buying Tagus, but the stock has declined sharply since then. Mwape&#x27;s clients have had difficulty selling the stock due to its low liquidity. She contends the report should have warned that the stock was highly illiquid, and Viklund explains that Tagus&#x27;s low average trading volume was public information.<\/p><p>Tagus recently announced a substantial impairment loss on an investment in an online retailer. When Mwape complains that Viklund&#x27;s report did not include a warning about this, Viklund replies that his research did not indicate a risk of impairment. Mwape also believes that the report was misleading since it stated, &quot;Given an estimated increase in operating margin from 11% to 16% in the next three years, our recommendation for Tagus stock is a strong buy.&quot; After the report<\/p><p>was written, Tagus released its quarterly financial results, disclosing that its operating margin decreased to 9.5%.<\/p><p>Mwape gathers information on the financial objectives and constraints of all her new clients. She uses that information to develop individual investment policy statements (IPS), which she updates at least annually. After determining each client&#x27;s risk profile, Mwape usually recommends<\/p><p>allocating a portion of the client&#x27;s assets to the same index-based ETF. For the most risk-averse clients, she also typically recommends buying index put options to limit potential losses from a decrease in the ETF&#x27;s price. She makes the recommendations according to each client&#x27;s IPS and explains to each client the potential outcomes and the risks involved.<\/p><p>Mwape sends a monthly newsletter to her clients and prospective clients. In the latest newsletter, she presents the performance of Ticino Asset Management&#x27;s funds, which she has been recommending to her clients. Ticino hired an equity portfolio manager who had a remarkable 10-year track record at a previous company. Mwape presents this track record in the newsletter, disclosing both the portfolio manager&#x27;s specific role in achieving it and the fact that it occurred at a different firm. The performance is presented gross of fees, which is also disclosed.<\/p><p>One of Mwape&#x27;s clients is Mind the Future (MTF), a nongovernmental organization (NGO) that assists college students. In a recent meeting, MTF&#x27;s CEO told Mwape the organization had launched a fundraising campaign to create a network of libraries that would lend textbooks to low-income students. The CEO also mentioned that the board of directors was defining the budget and funding to renovate MTF&#x27;s headquarters. Later, Mwape meets with another client, the dean of a university, who tells her that the university recently awarded an honorary degree to one of MTF&#x27;s board members. Mwape tries to get the CEO&#x27;s opinion on this, but she cannot reach the CEO by phone. In the monthly newsletter, she includes a section on MTF, disclosing the public fundraising, the headquarters renovation, and the honorary degree awarded to its board member.<\/p><\/div><\/details><div class=\"qtext\"><p>When presenting Ticino Asset Management&#x27;s performance, does Mwape violate the CFA Institute Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q005.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":6,"q":"In the MTF section of the newsletter, Mwape most likely violates the CFA Institute Code and Standards by disclosing the:","opts":["fundraising campaign.","headquarters renovation plans.","honorary degree awarded to the board member."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a006.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a006.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nathaniel Viklund, CFA, is a research analyst at Brinson Brokers (BB). He covers several companies in the retail industry, including Guadiana Stores. In the previous month, after extensive research and analysis, Viklund wrote a report with a buy recommendation of Guadiana stock. He distributed the report to all BB&#x27;s clients through email, text messaging, and instant messaging apps, strictly following BB&#x27;s written procedures, which were revised by BB&#x27;s compliance officer two years ago.<\/p><p>However, just after the report was released, one of Viklund&#x27;s clients informed him that, six months earlier, a new regulation had prohibited the use of instant messaging to distribute investment opinions or recommendations. Viklund instantly contacted the compliance officer, who was also unaware of the new regulation and immediately updated BB&#x27;s written procedures.<\/p><p>Later, Guadiana announces the closing of several stores, prompting Viklund to update his research. He concludes that his recommendation should be changed to &quot;hold.&quot; In a call with some of BB&#x27;s clients, he explains the new outlook and the change in recommendation. These &quot;premium&quot; clients pay an additional fee for this personalized service, which is offered to all BB&#x27;s existing and prospective clients. Viklund includes his updated report with the new recommendation in BB&#x27;s weekly newsletter, which is released and distributed to all clients two days later.<\/p><p>Viklund receives a call from Victoria Mwape, CFA, an independent financial adviser who is a client of BB. Mwape recommended the stock of Tagus Corp. to her clients, based on a report written by Viklund. In the report, after diligent analysis and with reasonable basis, Viklund recommended buying Tagus, but the stock has declined sharply since then. Mwape&#x27;s clients have had difficulty selling the stock due to its low liquidity. She contends the report should have warned that the stock was highly illiquid, and Viklund explains that Tagus&#x27;s low average trading volume was public information.<\/p><p>Tagus recently announced a substantial impairment loss on an investment in an online retailer. When Mwape complains that Viklund&#x27;s report did not include a warning about this, Viklund replies that his research did not indicate a risk of impairment. Mwape also believes that the report was misleading since it stated, &quot;Given an estimated increase in operating margin from 11% to 16% in the next three years, our recommendation for Tagus stock is a strong buy.&quot; After the report<\/p><p>was written, Tagus released its quarterly financial results, disclosing that its operating margin decreased to 9.5%.<\/p><p>Mwape gathers information on the financial objectives and constraints of all her new clients. She uses that information to develop individual investment policy statements (IPS), which she updates at least annually. After determining each client&#x27;s risk profile, Mwape usually recommends<\/p><p>allocating a portion of the client&#x27;s assets to the same index-based ETF. For the most risk-averse clients, she also typically recommends buying index put options to limit potential losses from a decrease in the ETF&#x27;s price. She makes the recommendations according to each client&#x27;s IPS and explains to each client the potential outcomes and the risks involved.<\/p><p>Mwape sends a monthly newsletter to her clients and prospective clients. In the latest newsletter, she presents the performance of Ticino Asset Management&#x27;s funds, which she has been recommending to her clients. Ticino hired an equity portfolio manager who had a remarkable 10-year track record at a previous company. Mwape presents this track record in the newsletter, disclosing both the portfolio manager&#x27;s specific role in achieving it and the fact that it occurred at a different firm. The performance is presented gross of fees, which is also disclosed.<\/p><p>One of Mwape&#x27;s clients is Mind the Future (MTF), a nongovernmental organization (NGO) that assists college students. In a recent meeting, MTF&#x27;s CEO told Mwape the organization had launched a fundraising campaign to create a network of libraries that would lend textbooks to low-income students. The CEO also mentioned that the board of directors was defining the budget and funding to renovate MTF&#x27;s headquarters. Later, Mwape meets with another client, the dean of a university, who tells her that the university recently awarded an honorary degree to one of MTF&#x27;s board members. Mwape tries to get the CEO&#x27;s opinion on this, but she cannot reach the CEO by phone. In the monthly newsletter, she includes a section on MTF, disclosing the public fundraising, the headquarters renovation, and the honorary degree awarded to its board member.<\/p><\/div><\/details><div class=\"qtext\"><p>In the MTF section of the newsletter, Mwape most likely violates the CFA Institute Code and Standards by disclosing the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":7,"q":"Based on Exhibit 1, did Ahmad's use of instant messaging (IM) violate the Code and Standards?","opts":["Yes","No, since Ahmad engaged only in general conversation","No, since Ahmad's country of residence allows the use of IM"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–10 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Salma Ahmad, CFA, works in fixed income sales for Bank Gibraltar (BG), a large international investment bank. Ahmad lives and works in a country in the Middle East. Ahmad&#x27;s sales coverage universe includes the entire Middle East region, serving many countries and regulatory jurisdictions, and she is required by BG to be familiar with the rules and regulations of the countries in which she does business.<\/p><p>The investment bank is finalizing work on an underwriting for a new green bond issue for an industrial company based in the same country as Ahmad. Ahmad emails a preliminary prospectus for the bond issue to all her institutional clients. Ahmad also emails her largest institutional client, Ishmael Khan, portfolio manager at Wahiba Capital, for feedback on the specific terms, structure, and pricing. Khan operates in a different country than Ahmad.<\/p><p>Khan manages three fixed-income funds for Wahiba:<\/p><p>An ESG-focused fund that invests exclusively in green bonds<\/p><p>A diversified investment-grade corporate bond fund that invests only in the Middle East region<\/p><p>A broadly diversified global bond fund<\/p><p>The next day, after not receiving a response to her email, Ahmad asks Khan for feedback and potential interest in the new issue through an instant messaging (IM) app. Khan responds through IM, stating that he is agreeable to the proposed terms, and he places an order for the securities. Ahmad conveys the order information to BG&#x27;s trading desk. The policies, laws, and regulations on the use of IM are detailed in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex001.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><p>Khan&#x27;s order included an equal number of bonds for each of the three funds since Khan deemed the bonds were appropriate for all funds. The demand for the green bonds is very high, and the offering is many times oversubscribed. Wahiba&#x27;s allocation from BG is only a third of what Khan requested. Khan decides to place the entire allocation with the ESG-focused fund since this was the original amount requested for that fund, the fund has the least investment flexibility, and there are other attractive investment options for the other funds.<\/p><p>A few weeks ago, BG also underwrote a large negotiated corporate bond offering. BG still has a sizeable position in these bonds, having been unable to place the entire issue with institutional clients. The market has deteriorated considerably since the original issue date as interest rates have moved sharply higher. The bonds are now trading well below the original par issue price. Quarter end is approaching, and the bank is anxious to get these bonds off its balance sheet but does not want to take a loss on the position.<\/p><p>In an attempt to sell the bonds at par, the bank&#x27;s head of fixed income sales organizes a conference call with some of the firm&#x27;s largest high-net-worth investors who have purchased similar bonds in the past. Ahmad is asked to lead the sales presentation but is told not to mention the current market price of the bonds. Ahmad complies with the request because she has experienced similar situations in the past and believes it is in the best interest of the bank to participate. Ahmad also knows that if the trading desk takes a large loss on these bonds, it will negatively affect her bonus.<\/p><p>A few months later, Bob Smith, CFA, the investor relations head for the bond issuer, organizes a conference call with company management, institutional buy-side investors, and sell-side analysts. During the call, material nonpublic information is inadvertently disclosed.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, did Ahmad&#x27;s use of instant messaging (IM) violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":8,"q":"Regarding Standard III(B) Fair Dealing, did Khan violate the Standard?","opts":["Yes","No, as Khan allocated shares to the most appropriate fund","No, as the ESG fund received no more than its planned allocation"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–10 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Salma Ahmad, CFA, works in fixed income sales for Bank Gibraltar (BG), a large international investment bank. Ahmad lives and works in a country in the Middle East. Ahmad&#x27;s sales coverage universe includes the entire Middle East region, serving many countries and regulatory jurisdictions, and she is required by BG to be familiar with the rules and regulations of the countries in which she does business.<\/p><p>The investment bank is finalizing work on an underwriting for a new green bond issue for an industrial company based in the same country as Ahmad. Ahmad emails a preliminary prospectus for the bond issue to all her institutional clients. Ahmad also emails her largest institutional client, Ishmael Khan, portfolio manager at Wahiba Capital, for feedback on the specific terms, structure, and pricing. Khan operates in a different country than Ahmad.<\/p><p>Khan manages three fixed-income funds for Wahiba:<\/p><p>An ESG-focused fund that invests exclusively in green bonds<\/p><p>A diversified investment-grade corporate bond fund that invests only in the Middle East region<\/p><p>A broadly diversified global bond fund<\/p><p>The next day, after not receiving a response to her email, Ahmad asks Khan for feedback and potential interest in the new issue through an instant messaging (IM) app. Khan responds through IM, stating that he is agreeable to the proposed terms, and he places an order for the securities. Ahmad conveys the order information to BG&#x27;s trading desk. The policies, laws, and regulations on the use of IM are detailed in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex001.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><p>Khan&#x27;s order included an equal number of bonds for each of the three funds since Khan deemed the bonds were appropriate for all funds. The demand for the green bonds is very high, and the offering is many times oversubscribed. Wahiba&#x27;s allocation from BG is only a third of what Khan requested. Khan decides to place the entire allocation with the ESG-focused fund since this was the original amount requested for that fund, the fund has the least investment flexibility, and there are other attractive investment options for the other funds.<\/p><p>A few weeks ago, BG also underwrote a large negotiated corporate bond offering. BG still has a sizeable position in these bonds, having been unable to place the entire issue with institutional clients. The market has deteriorated considerably since the original issue date as interest rates have moved sharply higher. The bonds are now trading well below the original par issue price. Quarter end is approaching, and the bank is anxious to get these bonds off its balance sheet but does not want to take a loss on the position.<\/p><p>In an attempt to sell the bonds at par, the bank&#x27;s head of fixed income sales organizes a conference call with some of the firm&#x27;s largest high-net-worth investors who have purchased similar bonds in the past. Ahmad is asked to lead the sales presentation but is told not to mention the current market price of the bonds. Ahmad complies with the request because she has experienced similar situations in the past and believes it is in the best interest of the bank to participate. Ahmad also knows that if the trading desk takes a large loss on these bonds, it will negatively affect her bonus.<\/p><p>A few months later, Bob Smith, CFA, the investor relations head for the bond issuer, organizes a conference call with company management, institutional buy-side investors, and sell-side analysts. During the call, material nonpublic information is inadvertently disclosed.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Standard III(B) Fair Dealing, did Khan violate the Standard?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q008.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":9,"q":"Regarding the sales presentation to high-net-worth retail investors, has Ahmad violated the Code and Standards?","opts":["No","Yes, by not disclosing relevant information","Yes, by failing to determine investor suitability"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a009.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a009.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–10 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Salma Ahmad, CFA, works in fixed income sales for Bank Gibraltar (BG), a large internat nce this was the original amount requested for that fund, the fund has the least investment flexibility, and there are other attractive investment options for the other funds.<\/p><p>A few weeks ago, BG also underwrote a large negotiated corporate bond offering. BG still has a sizeable position in these bonds, having been unable to place the entire issue with institutional clients. The market has deteriorated considerably since the original issue date as interest rates have moved sharply higher. The bonds are now trading well below the original par issue price. Quarter end is approaching, and the bank is anxious to get these bonds off its balance sheet but does not want to take a loss on the position.<\/p><p>In an attempt to sell the bonds at par, the bank&#x27;s head of fixed income sales organizes a conference call with some of the firm&#x27;s largest high-net-worth investors who have purchased similar bonds in the past. Ahmad is asked to lead the sales presentation but is told not to mention the current market price of the bonds. Ahmad complies with the request because she has experienced similar situations in the past and believes it is in the best interest of the bank to participate. Ahmad also knows that if the trading desk takes a large loss on these bonds, it will negatively affect her bonus.<\/p><p>A few months later, Bob Smith, CFA, the investor relations head for the bond issuer, organizes a conference call with company management, institutional buy-side investors, and sell-side analysts. During the call, material nonpublic information is inadvertently disclosed.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the sales presentation to high-net-worth retail investors, has Ahmad violated the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q009.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":10,"q":"Regarding the material nonpublic information (MNI) that was disclosed, the most appropriate next step for the company and Bob Smith is to:","opts":["issue a public press release stating what information was disclosed.","do nothing, as the information is now considered publicly disseminated.","do nothing, as the sell-side analysts will disclose the information in their research reports."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a010.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a010.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–10 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Salma Ahmad, CFA, works in fixed income sales for Bank Gibraltar (BG), a large international investment bank. Ahmad lives and works in a country in the Middle East. Ahmad&#x27;s sales coverage universe includes the entire Middle East region, serving many countries and regulatory jurisdictions, and she is required by BG to be familiar with the rules and regulations of the countries in which she does business.<\/p><p>The investment bank is finalizing work on an underwriting for a new green bond issue for an industrial company based in the same country as Ahmad. Ahmad emails a preliminary prospectus for the bond issue to all her institutional clients. Ahmad also emails her largest institutional client, Ishmael Khan, portfolio manager at Wahiba Capital, for feedback on the specific terms, structure, and pricing. Khan operates in a different country than Ahmad.<\/p><p>Khan manages three fixed-income funds for Wahiba:<\/p><p>An ESG-focused fund that invests exclusively in green bonds<\/p><p>A diversified investment-grade corporate bond fund that invests only in the Middle East region<\/p><p>A broadly diversified global bond fund<\/p><p>The next day, after not receiving a response to her email, Ahmad asks Khan for feedback and potential interest in the new issue through an instant messaging (IM) app. Khan responds through IM, stating that he is agreeable to the proposed terms, and he places an order for the securities. Ahmad conveys the order information to BG&#x27;s trading desk. The policies, laws, and regulations on the use of IM are detailed in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex001.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><p>Khan&#x27;s order included an equal number of bonds for each of the three funds since Khan deemed the bonds were appropriate for all funds. The demand for the green bonds is very high, and the offering is many times oversubscribed. Wahiba&#x27;s allocation from BG is only a third of what Khan requested. Khan decides to place the entire allocation with the ESG-focused fund since this was the original amount requested for that fund, the fund has the least investment flexibility, and there are other attractive investment options for the other funds.<\/p><p>A few weeks ago, BG also underwrote a large negotiated corporate bond offering. BG still has a sizeable position in these bonds, having been unable to place the entire issue with institutional clients. The market has deteriorated considerably since the original issue date as interest rates have moved sharply higher. The bonds are now trading well below the original par issue price. Quarter end is approaching, and the bank is anxious to get these bonds off its balance sheet but does not want to take a loss on the position.<\/p><p>In an attempt to sell the bonds at par, the bank&#x27;s head of fixed income sales organizes a conference call with some of the firm&#x27;s largest high-net-worth investors who have purchased similar bonds in the past. Ahmad is asked to lead the sales presentation but is told not to mention the current market price of the bonds. Ahmad complies with the request because she has experienced similar situations in the past and believes it is in the best interest of the bank to participate. Ahmad also knows that if the trading desk takes a large loss on these bonds, it will negatively affect her bonus.<\/p><p>A few months later, Bob Smith, CFA, the investor relations head for the bond issuer, organizes a conference call with company management, institutional buy-side investors, and sell-side analysts. During the call, material nonpublic information is inadvertently disclosed.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the material nonpublic information (MNI) that was disclosed, the most appropriate next step for the company and Bob Smith is to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q010.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":11,"q":"Do Universal's personal transaction disclosure policies comply with CFA Institute's required and recommended procedures?","opts":["No.","Yes, since no disclosure is required.","Yes, since they meet the minimum disclosure requirements."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a011.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a011.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–16 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Tom Johnson, CFA, is a portfolio manager at Universal Advisors, a US-based wealth management firm that serves high-net-worth individuals and families. Universal&#x27;s equity portfolio offering includes separately managed accounts (SMAs) in which clients own individual securities. Johnson manages the portfolio with an aggressive high-risk, high-reward strategy, investing mostly in small-cap growth stocks. To reduce transaction costs and to simplify trading and settlement, Universal buys only US-listed securities for client accounts.<\/p><p>Johnson instructs Francois Martin, a CFA Level II candidate and new equity analyst at the firm, to conduct research on Vent Industries, a French wind turbine manufacturer. Vent is dually listed on exchanges in France and in the US. Martin, a French national who recently moved to the US, is already familiar with the company since he has been following it personally for the past two years.<\/p><p>After completing due diligence on Vent, Martin is thoroughly impressed by the investment prospects and suggests that Johnson add the US-listed shares of Vent to client portfolios. Johnson, as the sole decision-maker, reviews Martin&#x27;s research and financial models but wants to think about the suggestion before reaching a conclusion.<\/p><p>Martin is so impressed with Vent&#x27;s investment prospects that he wants to buy it for his personal account. For guidance, Martin references Universal&#x27;s publicly available personal transaction disclosure, which states only the following:<\/p><p>&quot;Investment personnel are subject to policies and procedures regarding their personal trading.&quot;<\/p><p>Needing more detail, Martin checks with the firm&#x27;s compliance officer, who informs him that the firm does have policies and procedures designed to prevent potential conflicts of interest related to personal trading. Universal does not require that employees obtain preclearance before trading, but the firm&#x27;s policies do require:<\/p><p>a two-day blackout period before and after client trades, and a quarterly report by its investment decision-making personnel on transactions and holdings. Based on this information, Martin immediately places an order to buy Vent shares listed in France through his personal French brokerage account, which he established prior to joining Universal.<\/p><p>Three days later, Johnson decides to invest for clients in the US-listed shares of Vent and places the order through Universal&#x27;s trading desk.<\/p><p>Johnson is a board member for a local hospital endowment; for this, he receives modest compensation. Universal has approved Johnson&#x27;s board participation and compensation. Johnson is considered to be a thoughtful and successful investor. The other board members, unhappy with the fees and performance of the endowment&#x27;s existing income-oriented large-cap equity manager, asked Johnson a year ago if he would be willing to manage the equity portion of the endowment. Johnson responded by stating:<\/p><p>&quot;The hospital provides so much to this community, I would be happy to manage the endowment&#x27;s equity portfolio. It won&#x27;t even take much time; I will manage the endowment portfolio as an exact replica of Universal&#x27;s equity portfolio.&quot;<\/p><p>The next month, without informing Universal, Johnson began managing the endowment portfolio as a mirror image of Universal&#x27;s equity strategy.<\/p><p>Recently, Johnson evaluated the investment prospects of an upcoming IPO for a small-cap biotech firm. The company does innovative cancer research, but it is still years away from profitability. After conducting thorough due diligence, Johnson has concluded this is a great investment opportunity; he would like the hospital endowment to participate, believing the other board members would be excited about the company&#x27;s cancer research.<\/p><p>Johnson speaks to Universal&#x27;s lead underwriter and requests that 5% of the firm&#x27;s IPO allotment be allocated to the endowment. A few days later, when the IPO is priced and allocated, Universal receives 95,000 shares and the endowment receives 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>Do Universal&#x27;s personal transaction disclosure policies comply with CFA Institute&#x27;s required and recommended procedures?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":12,"q":"Which of Universal's procedures for personal investing by employees is inconsistent with CFA Institute's required and recommended procedures?","opts":["There is no preclearance requirement.","Transaction and holdings disclosures are not frequent enough.","The blackout period is insufficient to prevent front-running of client trades."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–16 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tom Johnson, CFA, is a portfolio manager at Universal Advisors, a US-based wealth management firm that serves high-net-worth individuals and families. Universal&#x27;s equity portfolio offering includes separately managed accounts (SMAs) in which clients own individual securities. Johnson manages the portfolio with an aggressive high-risk, high-reward strategy, investing mostly in small-cap growth stocks. To reduce transaction costs and to simplify trading and settlement, Universal buys only US-listed securities for client accounts.<\/p><p>Johnson instructs Francois Martin, a CFA Level II candidate and new equity analyst at the firm, to conduct research on Vent Industries, a French wind turbine manufacturer. Vent is dually listed on exchanges in France and in the US. Martin, a French national who recently moved to the US, is already familiar with the company since he has been following it personally for the past two years.<\/p><p>After completing due diligence on Vent, Martin is thoroughly impressed by the investment prospects and suggests that Johnson add the US-listed shares of Vent to client portfolios. Johnson, as the sole decision-maker, reviews Martin&#x27;s research and financial models but wants to think about the suggestion before reaching a conclusion.<\/p><p>Martin is so impressed with Vent&#x27;s investment prospects that he wants to buy it for his personal account. For guidance, Martin references Universal&#x27;s publicly available personal transaction disclosure, which states only the following:<\/p><p>&quot;Investment personnel are subject to policies and procedures regarding their personal trading.&quot;<\/p><p>Needing more detail, Martin checks with the firm&#x27;s compliance officer, who informs him that the firm does have policies and procedures designed to prevent potential conflicts of interest related to personal trading. Universal does not require that employees obtain preclearance before trading, but the firm&#x27;s policies do require:<\/p><p>a two-day blackout period before and after client trades, and a quarterly report by its investment decision-making personnel on transactions and holdings. Based on this information, Martin immediately places an order to buy Vent shares listed in France through his personal French brokerage account, which he established prior to joining Universal.<\/p><p>Three days later, Johnson decides to invest for clients in the US-listed shares of Vent and places the order through Universal&#x27;s trading desk.<\/p><p>Johnson is a board member for a local hospital endowment; for this, he receives modest compensation. Universal has approved Johnson&#x27;s board participation and compensation. Johnson is considered to be a thoughtful and successful investor. The other board members, unhappy with the fees and performance of the endowment&#x27;s existing income-oriented large-cap equity manager, asked Johnson a year ago if he would be willing to manage the equity portion of the endowment. Johnson responded by stating:<\/p><p>&quot;The hospital provides so much to this community, I would be happy to manage the endowment&#x27;s equity portfolio. It won&#x27;t even take much time; I will manage the endowment portfolio as an exact replica of Universal&#x27;s equity portfolio.&quot;<\/p><p>The next month, without informing Universal, Johnson began managing the endowment portfolio as a mirror image of Universal&#x27;s equity strategy.<\/p><p>Recently, Johnson evaluated the investment prospects of an upcoming IPO for a small-cap biotech firm. The company does innovative cancer research, but it is still years away from profitability. After conducting thorough due diligence, Johnson has concluded this is a great investment opportunity; he would like the hospital endowment to participate, believing the other board members would be excited about the company&#x27;s cancer research.<\/p><p>Johnson speaks to Universal&#x27;s lead underwriter and requests that 5% of the firm&#x27;s IPO allotment be allocated to the endowment. A few days later, when the IPO is priced and allocated, Universal receives 95,000 shares and the endowment receives 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Universal&#x27;s procedures for personal investing by employees is inconsistent with CFA Institute&#x27;s required and recommended procedures?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":13,"q":"According to Standard VI(B) Priority of Transactions, when Martin bought shares of Vent, he most likely:","opts":["violated the Standards.","did not violate the Standards since the trade was outside the blackout period.","did not violate the Standards since the transaction was in a different market than client transactions."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a013.webp\" target=\"_blank\" rel=\"noo
