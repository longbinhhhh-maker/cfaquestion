ents to the model to make it more applicable in the real world. He believes these adjustments were sufficient in magnitude that sourcing the original research is not necessary. Wong agrees with Devonshire&#x27;s assessment and approves the publication of the report.<\/p><p>Back in her office, Wong is reviewing the firm&#x27;s trading records and notices an exceptionally large series of trades that were done by the firm&#x27;s proprietary trading desk (ie, prop trading desk), which trades for the firm&#x27;s benefit with the firm&#x27;s capital. The trades involved homebuilder stocks: all were very profitable, and open positions were closed out within 24 hours after they were established. The trades were executed by the firm&#x27;s most celebrated trader, Bill Campbell, who has generated considerable profits for the firm over his career. Wong then reviews trading records for the past several months and identifies a pattern of trading these same stocks at about the same time each month.<\/p><p>Wong asks Campbell about the trades. Campbell replies that Lantau&#x27;s economic research team has been very good at correctly forecasting data on government housing starts, which are released monthly. Lantau publishes each month&#x27;s report before the government releases this data. Campbell explains that he has been trading in advance of the government&#x27;s releases based on the firm&#x27;s published research.<\/p><p>Wong consults with the economic research team to verify Campbell&#x27;s story. The head of economic research advises Wong that the team recently hired a junior analyst, Solomon Timur, CFA. Timur previously worked at the government Department of Housing, and his monthly forecasts have been exceptional.<\/p><p>Wong then visits Timur&#x27;s office to introduce herself. Timur is visibly nervous when questioned about his forecasts. During the conversation, Timur admits he has a contact inside the Department of Housing who provides him with information that will be included in each government press release on housing starts. Timur has been using this information in his published research reports. Timur states that he has disclosed this information on the government employee to Wong to achieve the protections afforded a &quot;whistleblower.&quot;<\/p><p>rd<\/p><p><b>Please do 3<\/b> question here<\/p><\/div><\/details><div class=\"qtext\"><p>By publishing the research, the Standards were most likely violated by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q030.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":31,"q":"Did Timur's actions violate Standard IV(A) Duties to Employer?","opts":["Yes","No, as Timur acted to create profit for the firm","No, as Timur became a whistleblower and is protected under the Standard"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a031.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a031.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 29–32 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alita Wong, CFA, is the chief compliance officer at Lantau Capital, a sell-side brokerage firm. Wong is updating the firm&#x27;s policies and procedures related to preventing general misconduct, and she develops the following procedures:<\/p><p><b>Procedure 1:<\/b> Check references of potential new employees to ensure they are of good character and for violations of investment-related laws or regulations.<\/p><p><b>Procedure 2:<\/b> Disseminate to all employees a list of potential violations along with related disciplinary sanctions, including actions that lead to termination.<\/p><p><b>Procedure 3:<\/b> Secure an acknowledgment from every employee that they have read, understand, and will abide by Lantau&#x27;s code of ethics. As part of her duties, Wong has compliance supervision responsibilities regarding the research Lantau produces. Wong delegates much of the review process to others, but she regularly conducts random reviews of new research that is scheduled to be released to clients.<\/p><p>One report in particular caught her attention; it was completed by Jared Devonshire, CFA, a quantitative analyst at the firm. In the report, Devonshire unveils a new quantitative stock selection model based on a new and innovative approach. Devonshire credits the quantitative team at Lantau for coming up with the new model.<\/p><p>Intrigued and genuinely curious about this new approach, Wong stops by Devonshire&#x27;s office to ask how he and the team came up with the idea. Devonshire responds by stating that he had read about this new approach in a recently released paper published in an academic journal. Wong responds by stating she did not see a reference to the original research.<\/p><p>Devonshire replies that while the team maintained the core concepts of the original research, the team also made some mechanical adjustments to the model to make it more applicable in the real world. He believes these adjustments were sufficient in magnitude that sourcing the original research is not necessary. Wong agrees with Devonshire&#x27;s assessment and approves the publication of the report.<\/p><p>Back in her office, Wong is reviewing the firm&#x27;s trading records and notices an exceptionally large series of trades that were done by the firm&#x27;s proprietary trading desk (ie, prop trading desk), which trades for the firm&#x27;s benefit with the firm&#x27;s capital. The trades involved homebuilder stocks: all were very profitable, and open positions were closed out within 24 hours after they were established. The trades were executed by the firm&#x27;s most celebrated trader, Bill Campbell, who has generated considerable profits for the firm over his career. Wong then reviews trading records for the past several months and identifies a pattern of trading these same stocks at about the same time each month.<\/p><p>Wong asks Campbell about the trades. Campbell replies that Lantau&#x27;s economic research team has been very good at correctly forecasting data on government housing starts, which are released monthly. Lantau publishes each month&#x27;s report before the government releases this data. Campbell explains that he has been trading in advance of the government&#x27;s releases based on the firm&#x27;s published research.<\/p><p>Wong consults with the economic research team to verify Campbell&#x27;s story. The head of economic research advises Wong that the team recently hired a junior analyst, Solomon Timur, CFA. Timur previously worked at the government Department of Housing, and his monthly forecasts have been exceptional.<\/p><p>Wong then visits Timur&#x27;s office to introduce herself. Timur is visibly nervous when questioned about his forecasts. During the conversation, Timur admits he has a contact inside the Department of Housing who provides him with information that will be included in each government press release on housing starts. Timur has been using this information in his published research reports. Timur states that he has disclosed this information on the government employee to Wong to achieve the protections afforded a &quot;whistleblower.&quot;<\/p><p>rd<\/p><p><b>Please do 3<\/b> question here<\/p><\/div><\/details><div class=\"qtext\"><p>Did Timur&#x27;s actions violate Standard IV(A) Duties to Employer?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":32,"q":"Has Campbell violated Standard I|(A) relating to material nonpublic information (MNI)?","opts":["Yes","No, as he had no knowledge of Timur's impropriety","No, as the MNI was macroeconomic data and not specific to the individual companies traded"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a032.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a032.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 29–32 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alita Wong, CFA, is the chief compliance officer at Lantau Capital, a sell-side brokerage firm. Wong is updating the firm&#x27;s policies and procedures related to preventing general misconduct, and she develops the following procedures:<\/p><p><b>Procedure 1:<\/b> Check references of potential new employees to ensure they are of good character and for violations of investment-related laws or regulations.<\/p><p><b>Procedure 2:<\/b> Disseminate to all employees a list of potential violations along with related disciplinary sanctions, including actions that lead to termination.<\/p><p><b>Procedure 3:<\/b> Secure an acknowledgment from every employee that they have read, understand, and will abide by Lantau&#x27;s code of ethics. As part of her duties, Wong has compliance supervision responsibilities regarding the research Lantau produces. Wong delegates much of the review process to others, but she regularly conducts random reviews of new research that is scheduled to be released to clients.<\/p><p>One report in particular caught her attention; it was completed by Jared Devonshire, CFA, a quantitative analyst at the firm. In the report, Devonshire unveils a new quantitative stock selection model based on a new and innovative approach. Devonshire credits the quantitative team at Lantau for coming up with the new model.<\/p><p>Intrigued and genuinely curious about this new approach, Wong stops by Devonshire&#x27;s office to ask how he and the team came up with the idea. Devonshire responds by stating that he had read about this new approach in a recently released paper published in an academic journal. Wong responds by stating she did not see a reference to the original research.<\/p><p>Devonshire replies that while the team maintained the core concepts of the original research, the team also made some mechanical adjustments to the model to make it more applicable in the real world. He believes these adjustments were sufficient in magnitude that sourcing the original research is not necessary. Wong agrees with Devonshire&#x27;s assessment and approves the publication of the report.<\/p><p>Back in her office, Wong is reviewing the firm&#x27;s trading records and notices an exceptionally large series of trades that were done by the firm&#x27;s proprietary trading desk (ie, prop trading desk), which trades for the firm&#x27;s benefit with the firm&#x27;s capital. The trades involved homebuilder stocks: all were very profitable, and open positions were closed out within 24 hours after they were established. The trades were executed by the firm&#x27;s most celebrated trader, Bill Campbell, who has generated considerable profits for the firm over his career. Wong then reviews trading records for the past several months and identifies a pattern of trading these same stocks at about the same time each month.<\/p><p>Wong asks Campbell about the trades. Campbell replies that Lantau&#x27;s economic research team has been very good at correctly forecasting data on government housing starts, which are released monthly. Lantau publishes each month&#x27;s report before the government releases this data. Campbell explains that he has been trading in advance of the government&#x27;s releases based on the firm&#x27;s published research.<\/p><p>Wong consults with the economic research team to verify Campbell&#x27;s story. The head of economic research advises Wong that the team recently hired a junior analyst, Solomon Timur, CFA. Timur previously worked at the government Department of Housing, and his monthly forecasts have been exceptional.<\/p><p>Wong then visits Timur&#x27;s office to introduce herself. Timur is visibly nervous when questioned about his forecasts. During the conversation, Timur admits he has a contact inside the Department of Housing who provides him with information that will be included in each government press release on housing starts. Timur has been using this information in his published research reports. Timur states that he has disclosed this information on the government employee to Wong to achieve the protections afforded a &quot;whistleblower.&quot;<\/p><p>rd<\/p><p><b>Please do 3<\/b> question here<\/p><\/div><\/details><div class=\"qtext\"><p>Has Campbell violated Standard I|(A) relating to material nonpublic information (MNI)?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":33,"q":"Freeman would violate the Standards by accepting the offer from Sokolowski for:","opts":["only the travel and accommodations.","only the tickets to the sporting event.","both the travel and accommodations and the tickets to the sporting event."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a033.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a033.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 33–38 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Transcend Capital is an asset management firm that specializes in domestic investments and hires third-party managers to manage foreign investments. Jericho Freeman, CFA, is one of the portfolio managers at Transcend. He plans to attend a large medical industry conference to talk to companies&#x27; management teams, third-party fund managers, and potential clients.<\/p><p>Transcend has been reviewing third-party managers and plans to add another. Borys Sokolowski, a manager at Fortune Partners, one of the third-party funds in consideration, is also planning to attend the industry conference. Although commercial travel options are available, Sokolowski offers to pay for Freeman&#x27;s travel and accommodations for the conference since it is considered a business meeting. Sokolowski also offers to pay for Freeman&#x27;s tickets to a sporting event before their scheduled business dinner.<\/p><p>Freeman plans to bring a marketing brochure he put together on Transcend to present to prospective clients at the conference. The brochure has the following summary:<\/p><p>&quot;Transcend was able to generate returns of:<\/p><p>25% last year,<\/p><p>18% annualized over the past three years, and<\/p><p>15% annualized over the past five years.&quot;<\/p><p>The returns are accurate but exclude several portfolios that Transcend closed last year due to underperformance. The portfolios were excluded since Transcend does not claim GIPS compliance. The summary indicates that accounts were excluded in the past but does not mention when. The summary also notes that it is limited in nature and that a detailed presentation is available upon request.<\/p><p>On the plane to the conference, Freeman sits behind Sayuri Nomura, CFA, a well-respected senior medical device analyst, and one of her associates, Amelia Parker, CFA. Freeman overhears part of their conversation:<\/p><p>Nomura: I will finalize my research on Cardinal Medical Technologies at the conference after confirming a few things with their CEO. The report will update the rating from hold to buy, and the updated valuation will be 20% higher than my current valuation and 30% higher than the company&#x27;s stock price. I will distribute the note after my meeting with the CEO.<\/p><p>Parker: Per your request, so you can use them in your research, I am keeping track of any:<\/p><p>trending Twitter posts about companies that we cover,<\/p><p>price movements of companies&#x27; stocks before and after big announcements, and<\/p><p>press releases issued by companies during the conference.<\/p><p>At the conference, Freeman meets with Ranjit Kapoor, CFA, a newly hired pension manager at BTK Manufacturing (BTKM). Kapoor is considering investing a portion of the pension fund assets with Transcend. Kapoor tells Freeman that the pension fund is heavily invested in BTKM stock, and BTKM&#x27;s management has pressured Kapoor to allocate more of the fund&#x27;s assets to BTKM stock. Kapoor believes this would help support the stock&#x27;s price but would make the plan less diversified. Instead, Kapoor believes an investment in Transcend would provide much-needed diversification and reduce the plan&#x27;s risk for participants. BTKM&#x27;s management believes third-party investment managers are too risky and that BTKM&#x27;s stock is the safest investment. They note that most of their compensation comes from BTKM stock options and warrants.<\/p><p>Freeman also meets with Xue Chin, who tells Freeman that she is planning to move her investments from her current asset manager, Element Financial. Chin says that the manager of Element, Fredrick Love, CFA, has done things that she is not comfortable with:<\/p><p><b>Action 1:<\/b> Being arrested during a protest of a newly elected government official<\/p><p><b>Action 2:<\/b> Refusing to testify against a colleague that he knew was trading on inside information despite being subpoenaed<\/p><p><b>Action 3:<\/b> Declaring bankruptcy after being fined for accepting undisclosed payments from brokers for recommending their services to clients<\/p><\/div><\/details><div class=\"qtext\"><p>Freeman would violate the Standards by accepting the offer from Sokolowski for:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q033.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":34,"q":"If Freeman distributes the marketing brochure to clients, would he most likely be violating the Standards?","opts":["No.","Yes, by excluding the closed portfolios.","Yes, by distributing only the summary and not the detailed presentation."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a034.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a034.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 33–38 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Transcend Capital is an asset management firm that specializes in domestic investments and hires third-party managers to manage foreign investments. Jericho Freeman, CFA, is one of the portfolio managers at Transcend. He plans to attend a large medical industry conference to talk to companies&#x27; management teams, third-party fund managers, and potential clients.<\/p><p>Transcend has been reviewing third-party managers and plans to add another. Borys Sokolowski, a manager at Fortune Partners, one of the third-party funds in consideration, is also planning to attend the industry conference. Although commercial travel options are available, Sokolowski offers to pay for Freeman&#x27;s travel and accommodations for the conference since it is considered a business meeting. Sokolowski also offers to pay for Freeman&#x27;s tickets to a sporting event before their scheduled business dinner.<\/p><p>Freeman plans to bring a marketing brochure he put together on Transcend to present to prospective clients at the conference. The brochure has the following summary:<\/p><p>&quot;Transcend was able to generate returns of:<\/p><p>25% last year,<\/p><p>18% annualized over the past three years, and<\/p><p>15% annualized over the past five years.&quot;<\/p><p>The returns are accurate but exclude several portfolios that Transcend closed last year due to underperformance. The portfolios were excluded since Transcend does not claim GIPS compliance. The summary indicates that accounts were excluded in the past but does not mention when. The summary also notes that it is limited in nature and that a detailed presentation is available upon request.<\/p><p>On the plane to the conference, Freeman sits behind Sayuri Nomura, CFA, a well-respected senior medical device analyst, and one of her associates, Amelia Parker, CFA. Freeman overhears part of their conversation:<\/p><p>Nomura: I will finalize my research on Cardinal Medical Technologies at the conference after confirming a few things with their CEO. The report will update the rating from hold to buy, and the updated valuation will be 20% higher than my current valuation and 30% higher than the company&#x27;s stock price. I will distribute the note after my meeting with the CEO.<\/p><p>Parker: Per your request, so you can use them in your research, I am keeping track of any:<\/p><p>trending Twitter posts about companies that we cover,<\/p><p>price movements of companies&#x27; stocks before and after big announcements, and<\/p><p>press releases issued by companies during the conference.<\/p><p>At the conference, Freeman meets with Ranjit Kapoor, CFA, a newly hired pension manager at BTK Manufacturing (BTKM). Kapoor is considering investing a portion of the pension fund assets with Transcend. Kapoor tells Freeman that the pension fund is heavily invested in BTKM stock, and BTKM&#x27;s management has pressured Kapoor to allocate more of the fund&#x27;s assets to BTKM stock. Kapoor believes this would help support the stock&#x27;s price but would make the plan less diversified. Instead, Kapoor believes an investment in Transcend would provide much-needed diversification and reduce the plan&#x27;s risk for participants. BTKM&#x27;s management believes third-party investment managers are too risky and that BTKM&#x27;s stock is the safest investment. They note that most of their compensation comes from BTKM stock options and warrants.<\/p><p>Freeman also meets with Xue Chin, who tells Freeman that she is planning to move her investments from her current asset manager, Element Financial. Chin says that the manager of Element, Fredrick Love, CFA, has done things that she is not comfortable with:<\/p><p><b>Action 1:<\/b> Being arrested during a protest of a newly elected government official<\/p><p><b>Action 2:<\/b> Refusing to testify against a colleague that he knew was trading on inside information despite being subpoenaed<\/p><p><b>Action 3:<\/b> Declaring bankruptcy after being fined for accepting undisclosed payments from brokers for recommending their services to clients<\/p><\/div><\/details><div class=\"qtext\"><p>If Freeman distributes the marketing brochure to clients, would he most likely be violating the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q034.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":35,"q":"If Freeman trades for his personal account based on the information overheard from Nomura, he would most likely be violating the Standard relating to:","opts":["preservation of confidentiality.","material nonpublic information.","diligence and reasonable basis."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a035.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a035.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 3 n:<\/p><p>Nomura: I will finalize my research on Cardinal Medical Technologies at the conference after confirming a few things with their CEO. The report will update the rating from hold to buy, and the updated valuation will be 20% higher than my current valuation and 30% higher than the company&#x27;s stock price. I will distribute the note after my meeting with the CEO.<\/p><p>Parker: Per your request, so you can use them in your research, I am keeping track of any:<\/p><p>trending Twitter posts about companies that we cover,<\/p><p>price movements of companies&#x27; stocks before and after big announcements, and<\/p><p>press releases issued by companies during the conference.<\/p><p>At the conference, Freeman meets with Ranjit Kapoor, CFA, a newly hired pension manager at BTK Manufacturing (BTKM). Kapoor is considering investing a portion of the pension fund assets with Transcend. Kapoor tells Freeman that the pension fund is heavily invested in BTKM stock, and BTKM&#x27;s management has pressured Kapoor to allocate more of the fund&#x27;s assets to BTKM stock. Kapoor believes this would help support the stock&#x27;s price but would make the plan less diversified. Instead, Kapoor believes an investment in Transcend would provide much-needed diversification and reduce the plan&#x27;s risk for participants. BTKM&#x27;s management believes third-party investment managers are too risky and that BTKM&#x27;s stock is the safest investment. They note that most of their compensation comes from BTKM stock options and warrants.<\/p><p>Freeman also meets with Xue Chin, who tells Freeman that she is planning to move her investments from her current asset manager, Element Financial. Chin says that the manager of Element, Fredrick Love, CFA, has done things that she is not comfortable with:<\/p><p><b>Action 1:<\/b> Being arrested during a protest of a newly elected government official<\/p><p><b>Action 2:<\/b> Refusing to testify against a colleague that he knew was trading on inside information despite being subpoenaed<\/p><p><b>Action 3:<\/b> Declaring bankruptcy after being fined for accepting undisclosed payments from brokers for recommending their services to clients<\/p><\/div><\/details><div class=\"qtext\"><p>If Freeman trades for his personal account based on the information overheard from Nomura, he would most likely be violating the Standard relating to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":36,"q":"To comply with Standard V(C), Parker would least likely need to keep records for:","opts":["Twitter posts.","price movements.","company press releases."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a036.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a036.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 33–38 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Transcend Capital is an asset management firm that specializes in domestic investments and hires third-party managers to manage foreign investments. Jericho Freeman, CFA, is one of the portfolio managers at Transcend. He plans to attend a large medical industry conference to talk to companies&#x27; management teams, third-party fund managers, and potential clients.<\/p><p>Transcend has been reviewing third-party managers and plans to add another. Borys Sokolowski, a manager at Fortune Partners, one of the third-party funds in consideration, is also planning to attend the industry conference. Although commercial travel options are available, Sokolowski offers to pay for Freeman&#x27;s travel and accommodations for the conference since it is considered a business meeting. Sokolowski also offers to pay for Freeman&#x27;s tickets to a sporting event before their scheduled business dinner.<\/p><p>Freeman plans to bring a marketing brochure he put together on Transcend to present to prospective clients at the conference. The brochure has the following summary:<\/p><p>&quot;Transcend was able to generate returns of:<\/p><p>25% last year,<\/p><p>18% annualized over the past three years, and<\/p><p>15% annualized over the past five years.&quot;<\/p><p>The returns are accurate but exclude several portfolios that Transcend closed last year due to underperformance. The portfolios were excluded since Transcend does not claim GIPS compliance. The summary indicates that accounts were excluded in the past but does not mention when. The summary also notes that it is limited in nature and that a detailed presentation is available upon request.<\/p><p>On the plane to the conference, Freeman sits behind Sayuri Nomura, CFA, a well-respected senior medical device analyst, and one of her associates, Amelia Parker, CFA. Freeman overhears part of their conversation:<\/p><p>Nomura: I will finalize my research on Cardinal Medical Technologies at the conference after confirming a few things with their CEO. The report will update the rating from hold to buy, and the updated valuation will be 20% higher than my current valuation and 30% higher than the company&#x27;s stock price. I will distribute the note after my meeting with the CEO.<\/p><p>Parker: Per your request, so you can use them in your research, I am keeping track of any:<\/p><p>trending Twitter posts about companies that we cover,<\/p><p>price movements of companies&#x27; stocks before and after big announcements, and<\/p><p>press releases issued by companies during the conference.<\/p><p>At the conference, Freeman meets with Ranjit Kapoor, CFA, a newly hired pension manager at BTK Manufacturing (BTKM). Kapoor is considering investing a portion of the pension fund assets w , has done things that she is not comfortable with:<\/p><p><b>Action 1:<\/b> Being arrested during a protest of a newly elected government official<\/p><p><b>Action 2:<\/b> Refusing to testify against a colleague that he knew was trading on inside information despite being subpoenaed<\/p><p><b>Action 3:<\/b> Declaring bankruptcy after being fined for accepting undisclosed payments from brokers for recommending their services to clients<\/p><\/div><\/details><div class=\"qtext\"><p>According to the Standards, to fulfill his duty to his clients, Kapoor should most appropriately invest the pension fund&#x27;s investments:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":38,"q":"Which of Love's actions does not violate the Standards?","opts":["Action 1","Action 2","Action 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 33–38 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Transcend Capital is an asset management firm that specializes in domestic investments and hires third-party managers to manage foreign investments. Jericho Freeman, CFA, is one of the portfolio managers at Transcend. He plans to attend a large medical industry conference to talk to companies&#x27; management teams, third-party fund managers, and potential clients.<\/p><p>Transcend has been reviewing third-party managers and plans to add another. Borys Sokolowski, a manager at Fortune Partners, one of the third-party funds in consideration, is also planning to attend the industry conference. Although commercial travel options are available, Sokolowski offers to pay for Freeman&#x27;s travel and accommodations for the conference since it is considered a business meeting. Sokolowski also offers to pay for Freeman&#x27;s tickets to a sporting event before their scheduled business dinner.<\/p><p>Freeman plans to bring a marketing brochure he put together on Transcend to present to prospective clients at the conference. The brochure has the following summary:<\/p><p>&quot;Transcend was able to generate returns of:<\/p><p>25% last year,<\/p><p>18% annualized over the past three years, and<\/p><p>15% annualized over the past five years.&quot;<\/p><p>The returns are accurate but exclude several portfolios that Transcend closed last year due to underperformance. The portfolios were excluded since Transcend does not claim GIPS compliance. The summary indicates that accounts were excluded in the past but does not mention when. The summary also notes that it is limited in nature and that a detailed presentation is available upon request.<\/p><p>On the plane to the conference, Freeman sits behind Sayuri Nomura, CFA, a well-respected senior medical device analyst, and one of her associates, Amelia Parker, CFA. Freeman overhears part of their conversation:<\/p><p>Nomura: I will finalize my research on Cardinal Medical Technologies at the conference after confirming a few things with their CEO. The report will update the rating from hold to buy, and the updated valuation will be 20% higher than my current valuation and 30% higher than the company&#x27;s stock price. I will distribute the note after my meeting with the CEO.<\/p><p>Parker: Per your request, so you can use them in your research, I am keeping track of any:<\/p><p>trending Twitter posts about companies that we cover,<\/p><p>price movements of companies&#x27; stocks before and after big announcements, and<\/p><p>press releases issued by companies during the conference.<\/p><p>At the conference, Freeman meets with Ranjit Kapoor, CFA, a newly hired pension manager at BTK Manufacturing (BTKM). Kapoor is considering investing a portion of the pension fund assets with Transcend. Kapoor tells Freeman that the pension fund is heavily invested in BTKM stock, and BTKM&#x27;s management has pressured Kapoor to allocate more of the fund&#x27;s assets to BTKM stock. Kapoor believes this would help support the stock&#x27;s price but would make the plan less diversified. Instead, Kapoor believes an investment in Transcend would provide much-needed diversification and reduce the plan&#x27;s risk for participants. BTKM&#x27;s management believes third-party investment managers are too risky and that BTKM&#x27;s stock is the safest investment. They note that most of their compensation comes from BTKM stock options and warrants.<\/p><p>Freeman also meets with Xue Chin, who tells Freeman that she is planning to move her investments from her current asset manager, Element Financial. Chin says that the manager of Element, Fredrick Love, CFA, has done things that she is not comfortable with:<\/p><p><b>Action 1:<\/b> Being arrested during a protest of a newly elected government official<\/p><p><b>Action 2:<\/b> Refusing to testify against a colleague that he knew was trading on inside information despite being subpoenaed<\/p><p><b>Action 3:<\/b> Declaring bankruptcy after being fined for accepting undisclosed payments from brokers for recommending their services to clients<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Love&#x27;s actions does not violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q038.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":39,"q":"Regarding the purchase of Upstream and use of Insight Brokers' research, did Mani violate the Code and Standards?","opts":["No","Yes, since there was a lower-cost option available","Yes, since the report was used by another manager and not for the sole benefit of Mani's clients"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a039.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a039.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 39–44 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Kamala Mani, CFA, is a portfolio manager at an investment management firm. Mani has two clients, a municipal pension fund with assets under management (AUM) of $1.5 billion and a college endowment fund with AUM of $250 million.<\/p><p>Mani is researching Upstream Technologies and believes it would be an appropriate investment for both of her clients. Mani gives the Upstream stock buy order to Insight Brokers, who executes the order in a single transaction as a block trade. Insight Brokers is not the lowest-cost provider, but it also provides research to Mani&#x27;s firm through a soft dollar arrangement. The agreement is disclosed to Mani&#x27;s two clients, and she uses Insight Brokers&#x27; research to benefit both clients. The next day, Mani receives a research report from Insight Brokers, which she uses in her research to update certain stocks&#x27; valuations. After review, she provides the research report to another portfolio manager at the company, who uses this report in his own research.<\/p><p>Mani receives another report from Insight Brokers later in the week. Typically, Mani reviews Insight Brokers&#x27; reports herself, but she is getting ready for several meetings later that day and does not have time to do so. She asks Binita Singh, an analyst at the firm, to review the report for accuracy and soundness, stating that Insight Brokers&#x27; previous reports have all been accurate with valid and compelling reasoning. After review, Singh confirms that the research report is sound and free from inaccuracy.<\/p><p>Later that morning, Mani decides to purchase Agile Logistics, which she recently researched and believes would also be an appropriate investment for both clients. Mani plans to submit a block trade to Basic Brokers, a low-priced broker, and allocate shares worth $500,000 to the pension fund and $100,000 to the endowment fund. However, to satisfy her soft dollar commitment, she instead submits the $500,000 order to Insight Brokers and the $100,000 order to Basic Brokers. When allocating the shares, she allocates the higher price paid to Insight Brokers to the pension fund and the lower price paid to Basic Brokers to the endowment fund since that is where the orders were placed, which is allowed based on the firm&#x27;s policies.<\/p><p>Mani then attends a lunch meeting with Shalini Kohli, a representative of a broker that is seeking Mani&#x27;s business. Kohli brings an example of research conducted by the broker&#x27;s research team. Mani is not impressed by the research, but suggests that a donation to the local food bank, where Mani often volunteers, would inspire her to look more deeply into the broker&#x27;s research. After returning to the office and before hearing about whether Kohli accepts her offer, Mani reviews more of the broker&#x27;s research and decides not to use the<\/p><p>broker&#x27;s services.<\/p><p>Later that day, Mani meets with Mihir Datta, a<\/p><p>representative from her pension fund client, for dinner.<\/p><p>The pension fund has outperformed its benchmark over the<\/p><p>past year and the municipality wishes to show its gratitude.<\/p><p>Datta gives Mani two front-row seats to the upcoming<\/p><p>professional football playoff game. Since her firm&#x27;s office is<\/p><p>closed for the night, Mani accepts the invitation and<\/p><p>discloses the gift to the firm&#x27;s compliance department the<\/p><p>next morning.<\/p><p>At the dinner, Datta indicates that he is looking for<\/p><p>inheritance tax planning services. Mani&#x27;s firm does not<\/p><p>provide these services, but it partners with CPA Tax<\/p><p>Advisors, a tax consultancy firm. For every client that Mani<\/p><p>refers to CPA Tax Advisors, her firm receives a referral bonus<\/p><p>based on a percentage of the total value of the service<\/p><p>referred. Mani suggests Datta contact CPA Tax Advisors and<\/p><p>states that her firm does receive a referral bonus, but all<\/p><p>referred clients have praised these services. Mani does not<\/p><p>specify the terms of the referral bonus.<\/p><p>On her free time, Mani is a CFA Institute volunteer who is<\/p><p>helping to create material for the upcoming Level I CFA<\/p><p>exam. Mani is assigned to write a series of questions about<\/p><p>monetary and fiscal policy. Mani invites another volunteer,<\/p><p>Daichi Fujita, CFA, who is developing another set of<\/p><p>economics questions, to dinner to discuss their processes.<\/p><p>Mani and Fujita discuss each of their questions under<\/p><p>consideration and provide feedback to each other.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the purchase of Upstream and use of Insight Brokers&#x27; research, did Mani violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q039.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":40,"q":"After Singh reviewed the research report from Insight Brokers, Mani can use the report to update her valuation:","opts":["immediately.","after receiving a second opinion.","only after doing her own due diligence."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a040.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a040.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span clas lege endowment fund with AUM of $250 million.<\/p><p>Mani is researching Upstream Technologies and believes it would be an appropriate investment for both of her clients. Mani gives the Upstream stock buy order to Insight Brokers, who executes the order in a single transaction as a block trade. Insight Brokers is not the lowest-cost provider, but it also provides research to Mani&#x27;s firm through a soft dollar arrangement. The agreement is disclosed to Mani&#x27;s two clients, and she uses Insight Brokers&#x27; research to benefit both clients. The next day, Mani receives a research report from Insight Brokers, which she uses in her research to update certain stocks&#x27; valuations. After review, she provides the research report to another portfolio manager at the company, who uses this report in his own research.<\/p><p>Mani receives another report from Insight Brokers later in the week. Typically, Mani reviews Insight Brokers&#x27; reports herself, but she is getting ready for several meetings later that day and does not have time to do so. She asks Binita Singh, an analyst at the firm, to review the report for accuracy and soundness, stating that Insight Brokers&#x27; previous reports have all been accurate with valid and compelling reasoning. After review, Singh confirms that the research report is sound and free from inaccuracy.<\/p><p>Later that morning, Mani decides to purchase Agile Logistics, which she recently researched and believes would also be an appropriate investment for both clients. Mani plans to submit a block trade to Basic Brokers, a low-priced broker, and allocate shares worth $500,000 to the pension fund and $100,000 to the endowment fund. However, to satisfy her soft dollar commitment, she instead submits the $500,000 order to Insight Brokers and the $100,000 order to Basic Brokers. When allocating the shares, she allocates the higher price paid to Insight Brokers to the pension fund and the lower price paid to Basic Brokers to the endowment fund since that is where the orders were placed, which is allowed based on the firm&#x27;s policies.<\/p><p>Mani then attends a lunch meeting with Shalini Kohli, a representative of a broker that is seeking Mani&#x27;s business. Kohli brings an example of research conducted by the broker&#x27;s research team. Mani is not impressed by the research, but suggests that a donation to the local food bank, where Mani often volunteers, would inspire her to look more deeply into the broker&#x27;s research. After returning to the office and before hearing about whether Kohli accepts her offer, Mani reviews more of the broker&#x27;s research and decides not to use the<\/p><p>broker&#x27;s services.<\/p><p>Later that day, Mani meets with Mihir Datta, a<\/p><p>representative from her pension fund client, for dinner.<\/p><p>The pension fund has outperformed its benchmark over the<\/p><p>past year and the municipality wishes to show its gratitude.<\/p><p>Datta gives Mani two front-row seats to the upcoming<\/p><p>professional football playoff game. Since her firm&#x27;s office is<\/p><p>closed for the night, Mani accepts the invitation and<\/p><p>discloses the gift to the firm&#x27;s compliance department the<\/p><p>next morning.<\/p><p>At the dinner, Datta indicates that he is looking for<\/p><p>inheritance tax planning services. Mani&#x27;s firm does not<\/p><p>provide these services, but it partners with CPA Tax<\/p><p>Advisors, a tax consultancy firm. For every client that Mani<\/p><p>refers to CPA Tax Advisors, her firm receives a referral bonus<\/p><p>based on a percentage of the total value of the service<\/p><p>referred. Mani suggests Datta contact CPA Tax Advisors and<\/p><p>states that her firm does receive a referral bonus, but all<\/p><p>referred clients have praised these services. Mani does not<\/p><p>specify the terms of the referral bonus.<\/p><p>On her free time, Mani is a CFA Institute volunteer who is<\/p><p>helping to create material for the upcoming Level I CFA<\/p><p>exam. Mani is assigned to write a series of questions about<\/p><p>monetary and fiscal policy. Mani invites another volunteer,<\/p><p>Daichi Fujita, CFA, who is developing another set of<\/p><p>economics questions, to dinner to discuss their processes.<\/p><p>Mani and Fujita discuss each of their questions under<\/p><p>consideration and provide feedback to each other.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on her orders for Agile Logistics, did Mani most likely violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q041.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":42,"q":"At the meetings with Kohli and Datta, Mani violated Standard (B) Independence and Objectivity:","opts":["only by suggesting the donation to the food bank.","only by accepting the tickets to the football game.","both by suggesting the donation to the food bank and accepting tickets to the football game."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a042.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a042.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 39–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kamala Mani, CFA, is a portfolio manager at an investment management firm. Mani has two clients, a municipal pension fund with assets under management (AUM) of $1.5 billion and a college endowment fund with AUM of $250 million.<\/p><p>Mani is researching Upstream Technologies and believes it would be an appropriate investment for both of her clients. Mani gives the Upstream stock buy order to Insight Brokers, who executes the order in a single transaction as a block trade. Insigh layoff game. Since her firm&#x27;s office is<\/p><p>closed for the night, Mani accepts the invitation and<\/p><p>discloses the gift to the firm&#x27;s compliance department the<\/p><p>next morning.<\/p><p>At the dinner, Datta indicates that he is looking for<\/p><p>inheritance tax planning services. Mani&#x27;s firm does not<\/p><p>provide these services, but it partners with CPA Tax<\/p><p>Advisors, a tax consultancy firm. For every client that Mani<\/p><p>refers to CPA Tax Advisors, her firm receives a referral bonus<\/p><p>based on a percentage of the total value of the service<\/p><p>referred. Mani suggests Datta contact CPA Tax Advisors and<\/p><p>states that her firm does receive a referral bonus, but all<\/p><p>referred clients have praised these services. Mani does not<\/p><p>specify the terms of the referral bonus.<\/p><p>On her free time, Mani is a CFA Institute volunteer who is<\/p><p>helping to create material for the upcoming Level I CFA<\/p><p>exam. Mani is assigned to write a series of questions about<\/p><p>monetary and fiscal policy. Mani invites another volunteer,<\/p><p>Daichi Fujita, CFA, who is developing another set of<\/p><p>economics questions, to dinner to discuss their processes.<\/p><p>Mani and Fujita discuss each of their questions under<\/p><p>consideration and provide feedback to each other.<\/p><\/div><\/details><div class=\"qtext\"><p>By discussing the questions with Fujita, did Mani violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q044.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":45,"q":"When Sideris makes the presentation, does she violate the CFA Institute Code and Standards?","opts":["No.","Yes, by presenting back-tested simulated results.","Yes, by including results from when the fund was not available to the public."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a045.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a045.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 45–50 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Ionna Sideris, CFA, a financial adviser at Dauerhaft Investments, attends an investment conference where she participates in a panel discussion. She presents the performance of funds managed by Dauerhaft, including DH Equities, a fund based on a proprietary stock selection methodology. The presentation includes:<\/p><p>back-tested returns from 2010 to 2015 using the proprietary methodology,<\/p><p>actual returns from 2016 to 2018, when DH fund was restricted to Dauerhaft partners,<\/p><p>the fund&#x27;s actual performance beginning in 2019, when it became widely available to investors, and<\/p><p>detailed explanations that fully disclose all aspects of the performance being reported.<\/p><p>At the cocktail reception after the conference, Sideris meets with potential clients and industry practitioners. She is introduced to Ludovic Tremblay, CFA, a sell-side equity analyst at Regen Securities who is interested in having Dauerhaft as a client and gives her copies of Regen&#x27;s equity research reports. The next day, Sideris realizes that, with the reports, Tremblay mistakenly gave her a list of names and email addresses of Regen&#x27;s clients. She decides not to inform Tremblay and adds the email addresses to her mailing list of prospective clients.<\/p><p>Sideris holds a conference call with Dauerhaft&#x27;s clients in which she details the characteristics of the DH Equities fund. She describes the fund&#x27;s returns, historical composition, performance attribution, fee structure, and management team. Since DH&#x27;s proprietary methodology is confidential, she does not disclose any aspect of the stock selection process or the risks involved.<\/p><p>Back at his office at Regen, Tremblay finalizes a research report on 4Auto, a small-cap auto parts manufacturer. Based on an extensive analysis, he believes the company will lose a third of its largest clients to a new competitor with a groundbreaking manufacturing technology. As a result, expecting the stock to decrease 15%, he distributes a sell recommendation to his clients. He documents information that supports his report, including financial models and notes from meetings. He also uses an outside research report from an independent research firm, but he does not include it in the documentation file since it is publicly available.<\/p><p>In the following days, 4Auto stock decreases 28%. Tremblay diligently revises each step of his analysis, confirms that the fundamentals remain the same, and changes his recommendation to a buy. He explains to Regen&#x27;s clients that his assumptions and target price did not change, but that the stock became undervalued due to its recent sharp decline. One month later, 4Auto stock recovers part of its losses and generates substantial profits to the clients who followed Tremblay&#x27;s recommendations.<\/p><p>Tremblay finishes writing a research report on another company, Aeolian Industries, which manufactures wind turbines. After a diligent analysis, he recommends selling the stock given worsening prospects for the wind turbine industry. Before distributing the report, he is informed that Regen&#x27;s CEO has just been appointed to Aeolian&#x27;s board of directors. Tremblay is not sure if he should distribute the report given this potential conflict of interest.<\/p><\/div><\/details><div class=\"qtext\"><p>When Sideris makes the presentation, does she violate the CFA Institute Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q045.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":46,"q":"By adding Regen's clients to her mailing list, Sideris most likely violates the CFA Institute Standard relating to:","opts":["misconduct.","preservation of confidentiality.","material nonpublic information."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a046.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a046.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 45–50 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ionna Sideris, CFA, a financial adviser at Dauerhaft Investments, attends an investment conference where she participates in a panel discussion. She presents the performance of funds managed by Dauerhaft, including DH Equities, a fund based on a proprietary stock selection methodology. The presentation includes:<\/p><p>back-tested returns from 2010 to 2015 using the proprietary methodology,<\/p><p>actual returns from 2016 to 2018, when DH fund was restricted to Dauerhaft partners,<\/p><p>the fund&#x27;s actual performance beginning in 2019, when it became widely available to investors, and<\/p><p>detailed explanations that fully disclose all aspects of the performance being reported.<\/p><p>At the cocktail reception after the conference, Sideris meets with potential clients and industry practitioners. She is introduced to Ludovic Tremblay, CFA, a sell-side equity analyst at Regen Securities who is interested in having Dauerhaft as a client and gives her copies of Regen&#x27;s equity research reports. The next day, Sideris realizes that, with the reports, Tremblay mistakenly gave her a list of names and email addresses of Regen&#x27;s clients. She decides not to inform Tremblay and adds the email addresses to her mailing list of prospective clients.<\/p><p>Sideris hol onflict of interest.<\/p><\/div><\/details><div class=\"qtext\"><p>By adding Regen&#x27;s clients to her mailing list, Sideris most likely violates the CFA Institute Standard relating to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q046.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":47,"q":"In the call with Dauerhaft's clients, when Sideris describes the DH Equities fund, does she violate the CFA Institute Code and Standards?","opts":["Yes.","No, since she is protecting Dauerhaft's proprietary methodology.","No, since the communication was not in the form of a written report."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a047.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a047.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 45–50 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ionna Sideris, CFA, a financial adviser at Dauerhaft Investments, attends an investment conference where she participates in a panel discussion. She presents the performance of funds managed by Dauerhaft, including DH Equities, a fund based on a proprietary stock selection methodology. The presentation includes:<\/p><p>back-tested returns from 2010 to 2015 using the proprietary methodology,<\/p><p>actual returns from 2016 to 2018, when DH fund was restricted to Dauerhaft partners,<\/p><p>the fund&#x27;s actual performance beginning in 2019, when it became widely available to investors, and<\/p><p>detailed explanations that fully disclose all aspects of the performance being reported.<\/p><p>At the cocktail reception after the conference, Sideris meets with potential clients and industry practitioners. She is intr ases 28%. Tremblay diligently revises each step of his analysis, confirms that the fundamentals remain the same, and changes his recommendation to a buy. He explains to Regen&#x27;s clients that his assumptions and target price did not change, but that the stock became undervalued due to its recent sharp decline. One month later, 4Auto stock recovers part of its losses and generates substantial profits to the clients who followed Tremblay&#x27;s recommendations.<\/p><p>Tremblay finishes writing a research report on another company, Aeolian Industries, which manufactures wind turbines. After a diligent analysis, he recommends selling the stock given worsening prospects for the wind turbine industry. Before distributing the report, he is informed that Regen&#x27;s CEO has just been appointed to Aeolian&#x27;s board of directors. Tremblay is not sure if he should distribute the report given this potential conflict of interest.<\/p><\/div><\/details><div class=\"qtext\"><p>Concerning the outside research report, does Tremblay violate the CFA Institute Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q048.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":49,"q":"When Tremblay changes his recommendation on 4Auto, does he violate the CFA Institute Code and Standards?","opts":["No.","Yes, since he manipulated the market.","Yes, since he changed his recommendation without new information."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a049.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a049.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 45–50 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-bo ttribution, fee structure, and management team. Since DH&#x27;s proprietary methodology is confidential, she does not disclose any aspect of the stock selection process or the risks involved.<\/p><p>Back at his office at Regen, Tremblay finalizes a research report on 4Auto, a small-cap auto parts manufacturer. Based on an extensive analysis, he believes the company will lose a third of its largest clients to a new competitor with a groundbreaking manufacturing technology. As a result, expecting the stock to decrease 15%, he distributes a sell recommendation to his clients. He documents information that supports his report, including financial models and notes from meetings. He also uses an outside research report from an independent research firm, but he does not include it in the documentation file since it is publicly available.<\/p><p>In the following days, 4Auto stock decreases 28%. Tremblay diligently revises each step of his analysis, confirms that the fundamentals remain the same, and changes his recommendation to a buy. He explains to Regen&#x27;s clients that his assumptions and target price did not change, but that the stock became undervalued due to its recent sharp decline. One month later, 4Auto stock recovers part of its losses and generates substantial profits to the clients who followed Tremblay&#x27;s recommendations.<\/p><p>Tremblay finishes writing a research report on another company, Aeolian Industries, which manufactures wind turbines. After a diligent analysis, he recommends selling the stock given worsening prospects for the wind turbine industry. Before distributing the report, he is informed that Regen&#x27;s CEO has just been appointed to Aeolian&#x27;s board of directors. Tremblay is not sure if he should distribute the report given this potential conflict of interest.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the Code and Standards, concerning the research report on Aeolian Industries and the potential conflict of interest, Tremblay is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q050.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":51,"q":"Gobert most likely violated the Standards by distributing:","opts":["the fact sheet.","both the fact sheet and the annual report.","neither the fact sheet nor the annual report."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a051.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a051.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 51–56 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Susan Gobert, CFA, is a senior portfolio manager at Draco Asset Management. She has frequent meetings with her clients to explain the performance of Draco&#x27;s funds, including the Orion Balanced Fund. In these meetings, she usually distributes materials that include fact sheets on the investment funds and Draco&#x27;s annual report.<\/p><p>Given the current environment of lower interest rates, Draco&#x27;s investment committee recently approved a temporary increase in the Orion Balanced Fund&#x27;s allocation to equities, as well as the inclusion of riskier high-yield corporate bonds. Gobert knows that Orion&#x27;s fact sheet has not yet been updated with that information. She is also aware that Draco&#x27;s annual report overstates her years of investment experience by including a period of four years when she worked at a fintech firm focused on digital payments.<\/p><p>Draco&#x27;s marketing department is responsible for creating both the fact sheets and the annual reports. Since these are the most recent materials produced by the firm, Gobert distributes them to clients without additional clarification.<\/p><p>The investment committee has decided to reduce the positions several of Draco&#x27;s funds hold in WTech, a small data services company. Gobert worries that this will lead to a substantial decrease in the stock&#x27;s price, given its low trading volume, and harm the return for the funds&#x27; shareholders. She decides to engage in a series of trades between Draco&#x27;s funds to increase WTech&#x27;s liquidity and visibility and thus attract the interest of other market participants. As a result, WTech&#x27;s liquidity increases, giving the funds a better selling opportunity and benefitting the shareholders. Gobert does not own WTech stock and does not personally profit from the trades.<\/p><p>The trading desk at Draco uses several brokers to execute trades for the firm&#x27;s funds. Gobert has asked the desk to direct a substantial portion of the WTech trades to XBrokers and ZTrading, two small brokers with whom she has negotiated referral arrangements: in exchange for receiving a significant portion of Draco&#x27;s business, XBrokers recommends the firm&#x27;s advisory services to its wealthiest clients, while ZTrading provides research reports to the firm. Gobert and her team consider ZTrading&#x27;s reports extremely valuable and use them consistently to select stocks for the funds. The trading desk believes that trade execution through XBrokers is reliable but expensive and that ZTrading has competitive prices and high-quality service. Gobert did not disclose the arrangements to her superiors at Draco or her clients.<\/p><p>Gobert, who passed the three CFA exams between 19X6<\/p><p>and 19X8, encouraged Terence Lakatos, a portfolio manager<\/p><p>who reports to her, to obtain the CFA designation. Lakatos<\/p><p>is currently registered and enrolled to sit for the Level II CFA<\/p><p>exam. He is also responsible for the monthly market<\/p><p>outlook newsletter Draco distributes to its clients. The<\/p><p>newsletter includes bios of the portfolio management team<\/p><p>and presents the following statements:<\/p><p><b>Statement 1:<\/b> Susan Gobert, CFA, has passed the three CFA<\/p><p>exams in three consecutive years. She believes that the CFA<\/p><p>designation enhanced her credibility and improved her<\/p><p>knowledge in the field of investment management.<\/p><p><b>Statement 2:<\/b> Terence Lakatos has passed Level I of the CFA<\/p><p>Program. He enrolled in the CFA Program to gain the most<\/p><p>respected credential in the worldwide investment<\/p><p>profession.<\/p><p>Gobert recently became aware that Draco&#x27;s written<\/p><p>compliance procedures restrict certain trades for its mutual<\/p><p>funds but not for its separately managed accounts (SMAs).<\/p><p>She warned the firm&#x27;s compliance officer, senior managers,<\/p><p>and her team about the deficiency.<\/p><p>Draco&#x27;s internal research team is finishing a detailed<\/p><p>analysis of Hypersales, an e-commerce company that<\/p><p>specializes in discount clothing. Gobert tells Lakatos that<\/p><p>the stock seems to be a good opportunity, but they should<\/p><p>wait for the analysis to be completed before deciding<\/p><p>whether to acquire the stock. Consulting the compliance<\/p><p>manual, Lakatos notices that it has not been updated by the<\/p><p>compliance officer, restricting the trade of Hypersales for<\/p><p>mutual funds but not for SMAs; immediately, he buys<\/p><p>Hypersales stocks for some of the SMAs.<\/p><\/div><\/details><div class=\"qtext\"><p>Gobert most likely violated the Standards by distributing:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q051.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":52,"q":"By making the WTech stock trades, does Gobert violate the Standards?","opts":["Yes","No, since the trades benefit the firm's clients","No, since Gobert does not personally profit from the trades"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"< tract the interest of other market participants. As a result, WTech&#x27;s liquidity increases, giving the funds a better selling opportunity and benefitting the shareholders. Gobert does not own WTech stock and does not personally profit from the trades.<\/p><p>The trading desk at Draco uses several brokers to execute trades for the firm&#x27;s funds. Gobert has asked the desk to direct a substantial portion of the WTech trades to XBrokers and ZTrading, two small brokers with whom she has negotiated referral arrangements: in exchange for receiving a significant portion of Draco&#x27;s business, XBrokers recommends the firm&#x27;s advisory services to its wealthiest clients, while ZTrading provides research reports to the firm. Gobert and her team consider ZTrading&#x27;s reports extremely valuable and use them consistently to select stocks for the funds. The trading desk believes that trade execution through XBrokers is reliable but expensive and that ZTrading has competitive prices and high-quality service. Gobert did not disclose the arrangements to her superiors at Draco or her clients.<\/p><p>Gobert, who passed the three CFA exams between 19X6<\/p><p>and 19X8, encouraged Terence Lakatos, a portfolio manager<\/p><p>who reports to her, to obtain the CFA designation. Lakatos<\/p><p>is currently registered and enrolled to sit for the Level II CFA<\/p><p>exam. He is also responsible for the monthly market<\/p><p>outlook newsletter Draco distributes to its clients. The<\/p><p>newsletter includes bios of the portfolio management team<\/p><p>and presents the following statements:<\/p><p><b>Statement 1:<\/b> Susan Gobert, CFA, has passed the three CFA<\/p><p>exams in three consecutive years. She believes that the CFA<\/p><p>designation enhanced her credibility and improved her<\/p><p>knowledge in the field of investment management.<\/p><p><b>Statement 2:<\/b> Terence Lakatos has passed Level I of the CFA<\/p><p>Program. He enrolled in the CFA Program to gain the most<\/p><p>respected credential in the worldwide investment<\/p><p>profession.<\/p><p>Gobert recently became aware that Draco&#x27;s written<\/p><p>compliance procedures restrict certain trades for its mutual<\/p><p>funds but not for its separately managed accounts (SMAs).<\/p><p>She warned the firm&#x27;s compliance officer, senior managers,<\/p><p>and her team about the deficiency.<\/p><p>Draco&#x27;s internal research team is finishing a detailed<\/p><p>analysis of Hypersales, an e-commerce company that<\/p><p>specializes in discount clothing. Gobert tells Lakatos that<\/p><p>the stock seems to be a good opportunity, but they should<\/p><p>wait for the analysis to be completed before deciding<\/p><p>whether to acquire the stock. Consulting the compliance<\/p><p>manual, Lakatos notices that it has not been updated by the<\/p><p>compliance officer, restricting the trade of Hypersales for<\/p><p>mutual funds but not for SMAs; immediately, he buys<\/p><p>Hypersales stocks for some of the SMAs.<\/p><\/div><\/details><div class=\"qtext\"><p>By making the WTech stock trades, does Gobert violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q052.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":53,"q":"In her arrangements with the brokers, does Gobert violate any CFA Institute Standards?","opts":["No","Yes, in her arrangement with XBrokers only","Yes, in her arrangements with XBrokers and Trading"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a053.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a053.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 51–56 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"v
