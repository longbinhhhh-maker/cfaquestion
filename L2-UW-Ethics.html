 Standards in her supervision of Lakatos?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q055.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":56,"q":"In his internet forum post, does Lakatos violate the Standards?","opts":["Yes","No, since he posted after the exam window was closed","No, since he did not provide quantifiable or detailed information about the exam"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a056.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a056.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 51–56 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Susan Gobert, CFA, is a senior portfolio manager at Draco Asset Management. She has frequent meetings with her clients to explain the performance of Draco&#x27;s funds, including the Orion Balanced Fund. In these meetings, she usually distributes materials that include fact sheets on the investment funds and Draco&#x27;s annual report.<\/p><p>Given the current environment of lower interest rates, Draco&#x27;s investment committee recently approved a temporary increase in the Orion Balanced Fund&#x27;s allocation to equities, as well as the inclusion of riskier high-yield corporate bonds. Gobert knows that Orion&#x27;s fact sheet has not yet been updated with that information. She is also aware that Draco&#x27;s annual report overstates her years of investment experience by including a period of four years when she worked at a fintech firm focused on digital payments.<\/p><p>Draco&#x27;s marketing department is responsible for creating both the fact sheets and the annual reports. Since these are the most recent materials produced by the firm, Gobert distributes them to clients without additional clarification.<\/p><p>The investment committee has decided to reduce the positions several of Draco&#x27;s funds hold in WTech, a small data services company. Gobert worries that this will lead to a substantial decrease in the stock&#x27;s price, given its low trading volume, and harm the return for the funds&#x27; shareholders. She decides to engage in a series of trades between Draco&#x27;s funds to increase WTech&#x27;s liquidity and visibility and thus attract the interest of other market participants. As a result, WTech&#x27;s liquidity increases, giving the funds a better selling opportunity and benefitting the shareholders. Gobert does not own WTech stock and does not personally profit from the trades.<\/p><p>The trading desk at Draco uses several brokers to execute trades for the firm&#x27;s funds. Gobert has asked the desk to direct a substantial portion of the WTech trades to XBrokers and ZTrading, two small brokers with whom she has negotiated referral arrangements: in exchange for receiving a significant portion of Draco&#x27;s business, XBrokers recommends the firm&#x27;s advisory services to its wealthiest clients, while ZTrading provides research reports to the firm. Gobert and her team consider ZTrading&#x27;s reports extremely valuable and use them consistently to select stocks for the funds. The trading desk believes that trade execution through XBrokers is reliable but expensive and that ZTrading has competitive prices and high-quality service. Gobert did not disclose the arrangements to her superiors at Draco or her clients.<\/p><p>Gobert, who passed the three CFA exams between 19X6<\/p><p>and 19X8, encouraged Terence Lakatos, a portfolio manager<\/p><p>who reports to her, to obtain the CFA designation. Lakatos<\/p><p>is currently registered and enrolled to sit for the Level II CFA<\/p><p>exam. He is also responsible for the monthly market<\/p><p>outlook newsletter Draco distributes to its clients. The<\/p><p>newsletter includes bios of the portfolio management team<\/p><p>and presents the following statements:<\/p><p><b>Statement 1:<\/b> Susan Gobert, CFA, has passed the three CFA<\/p><p>exams in three consecutive years. She believes that the CFA<\/p><p>designation enhanced her credibility and improved her<\/p><p>knowledge in the field of investment management.<\/p><p><b>Statement 2:<\/b> Terence Lakatos has passed Level I of the CFA<\/p><p>Program. He enrolled in the CFA Program to gain the most<\/p><p>respected credential in the worldwide investment<\/p><p>profession.<\/p><p>Gobert recently became aware that Draco&#x27;s written<\/p><p>compliance procedures restrict certain trades for its mutual<\/p><p>funds but not for its separately managed accounts (SMAs).<\/p><p>She warned the firm&#x27;s compliance officer, senior managers,<\/p><p>and her team about the deficiency.<\/p><p>Draco&#x27;s internal research team is finishing a detailed<\/p><p>analysis of Hypersales, an e-commerce company that<\/p><p>specializes in discount clothing. Gobert tells Lakatos that<\/p><p>the stock seems to be a good opportunity, but they should<\/p><p>wait for the analysis to be completed before deciding<\/p><p>whether to acquire the stock. Consulting the compliance<\/p><p>manual, Lakatos notices that it has not been updated by the<\/p><p>compliance officer, restricting the trade of Hypersales for<\/p><p>mutual funds but not for SMAs; immediately, he buys<\/p><p>Hypersales stocks for some of the SMAs.<\/p><\/div><\/details><div class=\"qtext\"><p>In his internet forum post, does Lakatos violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q056.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":57,"q":"With respect to recommending the sale of Clydesdale stock, did Wentworth most likely violate Standard I|(B) Market Manipulation?","opts":["No.","Yes, since his recommendation was based on opinion, not fact.","Yes, since he benefitted from the price decrease that followed his recommendation."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a057.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a057.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 57–62 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Paul Wentworth, CFA, is an independent investment adviser on investment strategies, but he does not sell any investment products. Wentworth also hosts a live, widely viewed weekly television show. During each episode, he offers insights on investing and markets, and usually makes investment recommendations. At the end of each episode, a disclaimer is shown, stating: &quot;Any recommendations made during this show are the host&#x27;s own opinions. Viewers should do their own research or consult with professional investment advisers before acting on any recommendation.&quot;<\/p><p>Sources that Wentworth uses to compile his research include:<\/p><p>Notes written when interviewing company personnel Twitter posts Text messages between himself and other advisers and analysts Historical price feeds A popular segment of the show is &quot;Pick of the Week,&quot; during which Wentworth highlights one stock, discusses relevant details, and recommends whether to buy or sell it. Many of Wentworth&#x27;s advisory clients tell him they regularly watch his show and often follow his &quot;Pick of the Week&quot; recommendations. Frequently, stocks that he highlights in this segment experience significant short-term price movements based on his recommendations.<\/p><p>Recently, Wentworth recommended selling Clydesdale Tires in the &quot;Pick of the Week&quot; segment. Wentworth does not presently own Clydesdale stock and would like to buy some shares, but he believes Clydesdale is overvalued at its current price of $55 per share.<\/p><p>Wentworth based his Clydesdale recommendation on the following:<\/p><p>An interview with an employee in Clydesdale&#x27;s purchasing department, who told Wentworth that Clydesdale is producing fewer tires this year and buying smaller quantities of raw materials Interviews with some of Clydesdale&#x27;s suppliers, which confirmed the reduced purchases Research on industry trends indicating that demand for tires is lower than in previous years An individual in a restaurant saying that Clydesdale&#x27;s earnings will be much lower than expected. Wentworth overheard this, but he does not know the individual and cannot confirm the statement with sources within Clydesdale.<\/p><p>Based on his research, Wentworth thought Clydesdale&#x27;s year-end earnings would be significantly below market consensus. During the segment, Wentworth included details of the research, adding, &quot;I think earnings will be weak.&quot; He also disclosed that he did not own any Clydesdale stock, without mentioning that he would buy some of that stock if the price were lower. Based on his recommendation, many viewers sell Clydesdale, causing the price to fall. Two days later, Wentworth buys 1,000 shares at a price of $40 per share. A few weeks later, Clydesdale releases its earnings report. While Wentworth was correct that earnings were weaker than expected, Clydesdale’s stock price remained around $40 per share and began to rise.<\/p><p>Carson Puig, CFA, and Leandra Canas, CFA, are comanagers of the Extra Alpha Fund, which owns a sizeable position in Clydesdale. They had a target price of $60 for Clydesdale. Puig saw Wentworth&#x27;s show that included the Clydesdale &quot;sell&quot; recommendation.<\/p><p>The morning after the show, Puig contacted a source in Clydesdale&#x27;s investor relations department, who told him that the company&#x27;s year-end earnings would be a &quot;surprise.&quot; Puig then made plans to sell the fund&#x27;s Clydesdale position and wrote a brief report that would advise the fund&#x27;s investors as to the reason for this decision. The report included Wentworth&#x27;s rationale for the &quot;sell&quot; recommendation, as well as what Puig&#x27;s source told him, but with no acknowledgment that Wentworth&#x27;s show was the basis for much of the report&#x27;s content. Before releasing the report, Puig showed it to Canas, who had not seen Wentworth&#x27;s program.<\/p><p>Canas concurred with Puig&#x27;s decision to sell and added to Puig&#x27;s report a portion of a government study indicating reduced demand for tires. This information was not subject to copyright protection, but Canas did not indicate the government source in the report. Puig and Canas sold the fund&#x27;s Clydesdale stock and distributed the report in an email to the fund&#x27;s investors.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to recommending the sale of Clydesdale stock, did Wentworth most likely violate Standard I|(B) Market Manipulation?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q057.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":58,"q":"By recommending the sale of Clydesdale, has Wentworth most likely violated Standard ||(A) Material Nonpublic Information?","opts":["Yes.","No, since the statement Wentworth overheard in the restaurant was unreliable.","No, since he did not know that his recommendation would induce others to sell the stock."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a058.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a058.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 57–62 th most likely violated the Standard relating to which of the following?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q059.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":60,"q":"Did Puig's and Canas's sale of Clydesdale violate Standard V(A) Diligence and Reasonable Basis?","opts":["Yes.","No, since they had a target price of $60 for Clydesdale.","No, since Puig's source within Clydesdale told him that earnings would be a \"surprise.\""],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a060.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a060.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 57–62 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Wentworth, CFA, is an independent investment adviser on investment strategies, but he does not sell any investment products. Wentworth also hosts a live, widely viewed weekly television show. During each episode, he offers insights on investing and markets, and usually makes investment recommendations. At the end of each episode, a disclaimer is shown, stating: &quot;Any recommendations made during this show are the host&#x27;s own opinions. Viewers should do their own research or consult with professional investment advisers before acting on any recommendation.&quot;<\/p><p>Sources that Wentworth uses to compile his research include:<\/p><p>Notes written when interviewing company personnel Twitter posts Text messages between himself and other advisers and analysts Historical price feeds A popular segment of the show is &quot;Pick of the Week,&quot; during which Wentworth highlights one stock, discusses relevant details, and recommends whether to buy or sell it. Many of Wentworth&#x27;s advisory clients tell him they regularly watch his show and often follow his &quot;Pick of the Week&quot; recommendations. Frequently, stocks that he highlights in this segment experience significant short-term price movements based on his recommendations.<\/p><p>Recently, Wentworth recommended selling Clydesdale Tires in the &quot;Pick of the Week&quot; segment. Wentworth does not presently own Clydesdale stock and would like to buy some shares, but he believes Clydesdale is overvalued at its current price of $55 per share.<\/p><p>Wentworth based his Clydesdale recommendation on the following:<\/p><p>An interview with an employee in Clydesdale&#x27;s purchasing department, who told Wentworth that Clydesdale is producing fewer tires this year and buying smaller quantities of raw materials Interviews with some of Clydesdale&#x27;s suppliers, which confirmed the reduced purchases Research on industry trends indicating that demand for tires is lower than in previous years An individual in a restaurant saying that Clydesdale&#x27;s earnings will be much lower than expected. Wentworth overheard this, but he does not know the individual and cannot confirm the statement with sources within Clydesdale.<\/p><p>Based on his research, Wentworth thought Clydesdale&#x27;s year-end earnings would be significantly below market consensus. During the segment, Wentworth included details of the research, adding, &quot;I think earnings will be weak.&quot; He also disclosed that he did not own any Clydesdale stock, without mentioning that he would buy some of that stock if the price were lower. Based on his recommendation, many viewers sell Clydesdale, causing the price to fall. Two days later, Wentworth buys 1,000 shares at a price of $40 per share. A few weeks later, Clydesdale releases its earnings report. While Wentworth was correct that earnings were weaker than expected, Clydesdale’s stock price remained around $40 per share and began to rise.<\/p><p>Carson Puig, CFA, and Leandra Canas, CFA, are comanagers of the Extra Alpha Fund, which owns a sizeable position in Clydesdale. They had a target price of $60 for Clydesdale. Puig saw Wentworth&#x27;s show that included the Clydesdale &quot;sell&quot; recommendation.<\/p><p>The morning after the show, Puig contacted a source in Clydesdale&#x27;s investor relations department, who told him that the company&#x27;s year-end earnings would be a &quot;surprise.&quot; Puig then made plans to sell the fund&#x27;s Clydesdale position and wrote a brief report that would advise the fund&#x27;s investors as to the reason for this decision. The report included Wentworth&#x27;s rationale for the &quot;sell&quot; recommendation, as well as what Puig&#x27;s source told him, but with no acknowledgment that Wentworth&#x27;s show was the basis for much of the report&#x27;s content. Before releasing the report, Puig showed it to Canas, who had not seen Wentworth&#x27;s program.<\/p><p>Canas concurred with Puig&#x27;s decision to sell and added to Puig&#x27;s report a portion of a government study indicating reduced demand for tires. This information was not subject to copyright protection, but Canas did not indicate the government source in the report. Puig and Canas sold the fund&#x27;s Clydesdale stock and distributed the report in an email to the fund&#x27;s investors.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Puig&#x27;s and Canas&#x27;s sale of Clydesdale violate Standard V(A) Diligence and Reasonable Basis?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q060.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":61,"q":"Did Puig and/or Canas most likely violate Standard I(C) Misrepresentation?","opts":["Only Puig","Only Canas","Both Puig and Canas"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a061.webp\" target=\"_blank\" rel= Wentworth&#x27;s rationale for the &quot;sell&quot; recommendation, as well as what Puig&#x27;s source told him, but with no acknowledgment that Wentworth&#x27;s show was the basis for much of the report&#x27;s content. Before releasing the report, Puig showed it to Canas, who had not seen Wentworth&#x27;s program.<\/p><p>Canas concurred with Puig&#x27;s decision to sell and added to Puig&#x27;s report a portion of a government study indicating reduced demand for tires. This information was not subject to copyright protection, but Canas did not indicate the government source in the report. Puig and Canas sold the fund&#x27;s Clydesdale stock and distributed the report in an email to the fund&#x27;s investors.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Puig and/or Canas most likely violate Standard I(C) Misrepresentation?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q061.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":62,"q":"According to Standard VC) Record Retention, Wentworth must keep a record of his personal notes and his:","opts":["Twitter posts and price feeds.","price feeds and text messages.","Twitter posts and text messages."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a062.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a062.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 57–62 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Wentworth, CFA, is an independent investment adviser on investment strategies, but he does not sell any investment products. Wentworth also hosts a live, widely viewed weekly television show. During each episode, he offers insights on investing , Wentworth thought Clydesdale&#x27;s year-end earnings would be significantly below market consensus. During the segment, Wentworth included details of the research, adding, &quot;I think earnings will be weak.&quot; He also disclosed that he did not own any Clydesdale stock, without mentioning that he would buy some of that stock if the price were lower. Based on his recommendation, many viewers sell Clydesdale, causing the price to fall. Two days later, Wentworth buys 1,000 shares at a price of $40 per share. A few weeks later, Clydesdale releases its earnings report. While Wentworth was correct that earnings were weaker than expected, Clydesdale’s stock price remained around $40 per share and began to rise.<\/p><p>Carson Puig, CFA, and Leandra Canas, CFA, are comanagers of the Extra Alpha Fund, which owns a sizeable position in Clydesdale. They had a target price of $60 for Clydesdale. Puig saw Wentworth&#x27;s show that included the Clydesdale &quot;sell&quot; recommendation.<\/p><p>The morning after the show, Puig contacted a source in Clydesdale&#x27;s investor relations department, who told him that the company&#x27;s year-end earnings would be a &quot;surprise.&quot; Puig then made plans to sell the fund&#x27;s Clydesdale position and wrote a brief report that would advise the fund&#x27;s investors as to the reason for this decision. The report included Wentworth&#x27;s rationale for the &quot;sell&quot; recommendation, as well as what Puig&#x27;s source told him, but with no acknowledgment that Wentworth&#x27;s show was the basis for much of the report&#x27;s content. Before releasing the report, Puig showed it to Canas, who had not seen Wentworth&#x27;s program.<\/p><p>Canas concurred with Puig&#x27;s decision to sell and added to Puig&#x27;s report a portion of a government study indicating reduced demand for tires. This information was not subject to copyright protection, but Canas did not indicate the government source in the report. Puig and Canas sold the fund&#x27;s Clydesdale stock and distributed the report in an email to the fund&#x27;s investors.<\/p><\/div><\/details><div class=\"qtext\"><p>According to Standard VC) Record Retention, Wentworth must keep a record of his personal notes and his:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q062.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":63,"q":"Regarding the research report on GoldTech, did Bullard violate the Code and Standards?","opts":["Yes","No, since Bullard included discussion of the risk factors in his report","No, since he acted in what he believed to be in the best interest of his clients"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a063.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a063.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 63–68 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Henry Bullard, CFA, is a well-respected sell-side analyst covering the metals and mining industry at Denali Capital Markets, a publicly traded investment bank. He is currently reviewing his model and recommendation for GoldTech Mining, a precious metals miner, with his associate, Marjorie Congdon, CFA. GoldTech recently reported Q2 earnings and provided guidance that was below Bullard&#x27;s estimates, causing its stock to decline 10%.<\/p><p>Bullard sets up a call with Emilia Schiavo, CFA, the CFO of GoldTech, with whom Bullard has developed a close relationship over the years. On the call, he asks questions about the company&#x27;s health and its competitive positioning. At the end of the call, Schiavo says &quot;I hope you&#x27;re planning to maintain our buy rating. I would hate for you to lose your ability to ask questions on our future earnings calls.&quot;<\/p><p>After completing the call and updating their research on GoldTech, Bullard and Congdon determine that GoldTech is overvalued based on its current price and believe a sell rating is warranted. However, Bullard believes the relationship with Schiavo provides valuable insights to his research, which he believes is in the best long-term interest of Denali&#x27;s clients. He publishes a new research report, downgrading the stock to a hold rating to maintain his relationship with Schiavo, but also includes discussion of the additional risk factors that could affect the company.<\/p><p>After Bullard publishes the report, GoldTech&#x27;s stock increases 3%. Congdon has noticed that when Bullard issues reports on certain companies, it can cause those companies&#x27; stocks to move. Congdon asks Bullard if Denali&#x27;s policy to send the research only to clients and not the general public causes an issue with material nonpublic information (MNI) since the report itself is material but its dissemination is nonpublic. Bullard notes that the dissemination is based on Denali&#x27;s policies and that all clients receive the research report at the same time.<\/p><p>Bullard is currently the program chair for the local CFA society. He often arranges for speakers to present at the society&#x27;s monthly meetings. Schiavo asks if Bullard would consider hosting her as a speaker for an event to increase GoldTech&#x27;s exposure to potential investors. In exchange for being allowed to speak to the society, Schiavo tells Bullard that she will attend group meetings with Denali&#x27;s clients, which she has not done in the past.<\/p><p>Denali recently hired Eric Kim, CFA, as the new compliance officer for the research group. After reviewing the company&#x27;s current procedures, Kim makes the following suggestions to decrease the chances of analysts acting on MNI:<\/p><p><b>Suggestion 1:<\/b> Allowing investment banking analysts to review the research team&#x27;s reports before dissemination to ensure MNI is not being used.<\/p><p><b>Suggestion 2:<\/b> Physically separating the research and investment banking teams on different floors of the building to reduce the chances of unintended communication.<\/p><p><b>Suggestion 3:<\/b> Eliminating the watch list and more frequently updating the restricted list, which will be more effective to stop trading on MNI.<\/p><p>In discussing the new rules with Denali&#x27;s analysts, Kim speaks broadly about ethical activity, stating:<\/p><p><b>Statement 1:<\/b> Since different regions have different views on ethical behavior, when meeting with clients, analysts should consider how their processes might affect this country&#x27;s financial market only in the context of their ethical obligations.<\/p><p><b>Statement 2:<\/b> At the end of the day, Denali is in business to maximize value to shareholders at all costs, so we should be revamping the compensation structure to reflect that while promising to continue acting ethically.<\/p><p>Kim oversees the monitoring of personal trading activity for Denali&#x27;s research analysts. He has confirmed that Denali&#x27;s compliance procedures are adequate to catch wrongdoing. After two months at Denali, Kim discovers that one of the company&#x27;s analysts made a trade that violated company policy. After learning of the wrongdoing, Kim does an in-depth review of the analyst&#x27;s trades to discover the extent of the wrongdoing and warns the analyst not to do this again; the analyst agrees.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the research report on GoldTech, did Bullard violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q063.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":64,"q":"Regarding Standard I|(A) Material Nonpublic Information, does Denali's policy of research dissemination violate the Standard?","opts":["No, it is in full compliance","Yes, since the report is not publicly released immediately","Yes, since the report is not publicly released after paying clients receive it"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a064.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a064.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 63–68 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henry Bullard, CFA, is a well-respected sell-side analyst covering the metals and mining industry at Denali Capital Markets, a publicly traded investment bank. He is currently reviewing his model and recommendation for GoldTech Mining, a precious metals miner, with his associate, Marjorie Congdon, CFA. GoldTech recently reported Q2 earnings and provided guidance that was below Bullard&#x27;s estimates, causing its stock to decline 10%.<\/p><p>Bullard sets up a call with Emilia Schiavo, CFA, the CFO of GoldTech, with whom Bullard has developed a close relationship over the years. On the call, he asks questions about the company&#x27;s health and its competitive positioning. At the end of the call, Schiavo says &quot;I hope you&#x27;re planning to maintain our buy rating. I would hate for you to lose your ability to ask questions on our future earnings calls.&quot;<\/p><p>After completing the call and updating their research on GoldTech, Bullard and Congdon determine that GoldTech is overvalued based on its current price and believe a sell rating is warranted. However, Bullard believes the relationship with Schiavo provides valuable insights to his research, which he believes is in the best long-term interest of Denali&#x27;s clients. He publishes a new research report, downgrading the stock to a hold rating to maintain his relationship with Schiavo, but also includes discussion of the additional risk factors that could affect the company.<\/p><p>After Bullard publishes the report, GoldTech&#x27;s stock increases 3%. Congdon has noticed that when Bullard issues reports on certain companies, it can cause those companies&#x27; stocks to move. Congdon asks Bullard if Denali&#x27;s policy to send the research only to clients and not the general public causes an issue with material nonpublic information (MNI) since the report itself is material but its dissemination is nonpublic. Bullard notes that the dissemination is based on Denali&#x27;s policies and that all clients receive the research report at the same time.<\/p><p>Bullard is currently the program chair for the local CFA society. He often arranges for speakers to present at the society&#x27;s monthly meetings. Schiavo asks if Bullard would consider hosting her as a speaker for an event to increase GoldTech&#x27;s exposure to potential investors. In exchange for being allowed to speak to the society, Schiavo tells Bullard that she will attend group meetings with Denali&#x27;s clients, which she has not done in the past.<\/p><p>Denali recently hired Eric Kim, CFA, as the new compliance officer for the research group. After reviewing the company&#x27;s current procedures, Kim makes the following suggestions to decrease the chances of analysts acting on MNI:<\/p><p><b>Suggestion 1:<\/b> Allowing investment banking analysts to review the research team&#x27;s reports before dissemination to ensure MNI is not being used.<\/p><p><b>Suggestion 2:<\/b> Physically separating the research and investment banking teams on different floors of the building to reduce the chances of unintended communication.<\/p><p><b>Suggestion 3:<\/b> Eliminating the watch list and more frequently updating the restricted list, which will be more effective to stop trading on MNI.<\/p><p>In discussing the new rules with Denali&#x27;s analysts, Kim speaks broadly about ethical activity, stating:<\/p><p><b>Statement 1:<\/b> Since different regions have different views on ethical behavior, when meeting with clients, analysts should consider how their processes might affect this country&#x27;s financial market only in the context of their ethical obligations.<\/p><p><b>Statement 2:<\/b> At the end of the day, Denali is in business to maximize value to shareholders at all costs, so we should be revamping the compensation structure to reflect that while promising to continue acting ethically.<\/p><p>Kim oversees the monitoring of personal trading activity for Denali&#x27;s research analysts. He has confirmed that Denali&#x27;s compliance procedures are adequate to catch wrongdoing. After two months at Denali, Kim discovers that one of the company&#x27;s analysts made a trade that violated company policy. After learning of the wrongdoing, Kim does an in-depth review of the analyst&#x27;s trades to discover the extent of the wrongdoing and warns the analyst not to do this again; the analyst agrees.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Standard I|(A) Material Nonpublic Information, does Denali&#x27;s policy of research dissemination violate the Standard?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q064.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":65,"q":"If Bullard acquiesces to Schiavo's request to speak at the CFA society meeting, would Bullard violate the Code and Standards?","opts":["No.","Yes, by hosting a company that he covers at a CFA society event.","Yes, since Bullard is using his position as society program chair to benefit himself."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a065.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a065.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 63–68 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henry Bullard, CFA, is a well-respected sell-side analyst covering the metals and mining industry at Denali Capital Markets, a publicly traded investment bank. He is currently reviewing his model and recommendation for GoldTech Mining, a precious metals miner, with his associate, Marjorie Congdon, CFA. GoldTech recently reported Q2 earnings and provided guidance that was below Bullard&#x27;s estimates, causing its stock to decline 10%.<\/p><p>Bullard sets up a call with Emilia Schiavo, CFA, the CFO of GoldTech, with whom Bullard has developed a close relationship over the years. On the call, he asks questions about the company&#x27;s health and its competitive positioning. At the end of the call, Schiavo says &quot;I hope you&#x27;re planning to maintain our buy rating. I would hate for you to lose your ability to ask questions on our future earnings calls.&quot;<\/p><p>After completing the call and updating their research on GoldTech, Bullard and Congdon determine that GoldTech is overvalued based on its current price and believe a sell rating is warranted. However, Bullard believes the relationship with Schiavo provides valuable insights to his research, which he believes is in the best long-term interest of Denali&#x27;s clients. He publishes a new research report, downgrading the stock to a hold rating to maintain his relationship with Schiavo, but also includes discussion of the additional risk factors that could affect the company.<\/p><p>After Bullard publishes the report, GoldTech&#x27;s stock increases 3%. Congdon has noticed that when Bullard issues reports on certain companies, it can cause those companies&#x27; stocks to move. Congdon asks Bullard if Denali&#x27;s policy to send the research only to clients and not the general public causes an issue with material nonpublic information (MNI) since the report itself is material but its dissemination is nonpublic. Bullard notes that the dissemination is based on Denali&#x27;s policies and that all clients receive the research report at the same time.<\/p><p>Bullard is currently the program chair for the local CFA society. He often arranges for speakers to present at the society&#x27;s monthly meetings. Schiavo asks if Bullard would consider hosting her as a speaker for an event to increase GoldTech&#x27;s exposure to potential investors. In exchange for being allowed to speak to the society, Schiavo tells Bullard that she will attend group meetings with Denali&#x27;s clients, which she has not done in the past.<\/p><p>Denali recently hired Eric Kim, CFA, as the new compliance officer for the research group. After reviewing the company&#x27;s current procedures, Kim makes the following suggestions to decrease the chances of analysts acting on MNI:<\/p><p><b>Suggestion 1:<\/b> Allowing investment banking analysts to review the research team&#x27;s reports before dissemination to ensure MNI is not being used.<\/p><p><b>Suggestion 2:<\/b> Physically separating the research and investment banking teams on different floors of the building to reduce the chances of unintended communication.<\/p><p><b>Suggestion 3:<\/b> Eliminating the watch list and more frequently updating the restricted list, which will be more effective to stop trading on MNI.<\/p><p>In discussing the new rules with Denali&#x27;s analysts, Kim speaks broadly about ethical activity, stating:<\/p><p><b>Statement 1:<\/b> Since different regions have different views on ethical behavior, when meeting with clients, analysts should consider how their processes might affect this country&#x27;s financial market only in the context of their ethical obligations.<\/p><p><b>Statement 2:<\/b> At the end of the day, Denali is in business to maximize value to shareholders a or, when meeting with clients, analysts should consider how their processes might affect this country&#x27;s financial market only in the context of their ethical obligations.<\/p><p><b>Statement 2:<\/b> At the end of the day, Denali is in business to maximize value to shareholders at all costs, so we should be revamping the compensation structure to reflect that while promising to continue acting ethically.<\/p><p>Kim oversees the monitoring of personal trading activity for Denali&#x27;s research analysts. He has confirmed that Denali&#x27;s compliance procedures are adequate to catch wrongdoing. After two months at Denali, Kim discovers that one of the company&#x27;s analysts made a trade that violated company policy. After learning of the wrongdoing, Kim does an in-depth review of the analyst&#x27;s trades to discover the extent of the wrongdoing and warns the analyst not to do this again; the analyst agrees.<\/p><\/div><\/details><div class=\"qtext\"><p>In monitoring and reviewing the analyst&#x27;s personal trades, did Kim violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q068.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":69,"q":"Did Arcos's behavior during the exam violate the Standards?","opts":["Yes","No, because there was no ethical breach","No, because no testing policies were violated"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a069.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a069.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 69–74 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Grace Jones and David Arcos are junior analysts at Chestnut Wealth Management, a retail client advisory firm. Jones and Arcos are both Level I candidates in the CFA Program and have been studying together; they were even able to schedule their exams for the same time, day, and location.<\/p><p>During the exam, a software glitch resulted in answer choices not displaying correctly for Arcos. The other candidates were not affected. After Arcos notified a proctor, the proctor paused Arcos&#x27;s exam. Arcos then became extremely frustrated and began shouting at the proctor to cancel the exam so that he could reschedule. Arcos&#x27;s outburst was unsettling and distracting to the other exam takers. After a 30-minute delay, the issue was corrected, and Arcos resumed the exam.<\/p><p>After the exam, Arcos posted on an internet forum that caters specifically to CFA Program Candidates:<\/p><p>&quot;I wanted to warn the CFA Candidate community about a very frustrating software glitch that occurred when I was taking the Level I CFA exam this morning. Just be prepared.&quot;<\/p><p>On another social media forum that focuses on stock investing, Arcos touts the investment prospects of Orogeny Mining Corp. (OMC), a micro-cap stock. Until recently, OMC was a gold mining exploration company. A short time ago, OMC abandoned its conventional mineral-exploration program and started mining cryptocurrencies. Arcos owns 100 shares of OMC, which are currently trading at $1.00 per share. He has not reported his ownership of OMC to Chestnut because his position is small, and the stock is so speculative that the firm would never buy it for clients.<\/p><p>Arcos knows little about the company and has done no due diligence, but states on the social media platform:<\/p><p>&quot;The word on the street is OMC is in discussions to be acquired by another cryptocurrency mining firm! I can&#x27;t say which one, but it&#x27;s a household name and one of the biggest in the industry! OMC is going higher: be long or be wrong!!!&quot; The next morning in the office break room, Jones, Arcos, and Shelia Smith discuss how stressful the exam experience was. Smith is one of the firm&#x27;s advisers and not a Member or Candidate. During the conversation, Jones asks Arcos what he thought of the accrued interest calculation question in the second session. Arcos states that he was so upset by the whole testing experience that he does not even remember that question.<\/p><p>Later that day, Smith is running late for a meeting with a new client. Smith had initially met the client two weeks before and this follow-up meeting is to present an investment policy statement and recommended investments to the client. At the last minute, Smith asks Jones to fill in for her for just a few minutes to not keep the client waiting. As an analyst, Jones does not normally meet with clients and has not been briefed on the details of the prior meeting.<\/p><p>Jones immediately begins the conversation by suggesting the client consider the firm&#x27;s option overlay strategy, which is a covered call strategy on a popular equity index. Jones states that the strategy has generated better risk-adjusted returns than the index over the past three years. Jones continues by stating the strategy is very popular with clients as an alternative to their conventional equity allocation. Smith arrives at this point in the conversation and Jones leaves the meeting.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Arcos&#x27;s behavior during the exam violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q069.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":70,"q":"Did Arcos's social media post about the software glitch violate the Standards?","opts":["No","Yes, because he violated the Candidate Pledge","Yes, because he gave future test takers an advantage"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a070.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a070.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 69–74 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Grace Jones and David Arcos are junior analysts at Chestnut Wealth Management, a retail client advisory firm. Jones and Arcos are both Level I candidates in the CFA Program and have been studying together; they were even able to schedule their exams for the same time, day, and location.<\/p><p>During the exam, a software glitch resulted in answer choices not displaying correctly for Arcos. The other candidates were not affected. After Arcos notified a proctor, the proctor paused Arcos&#x27;s exam. Arcos then became extremely frustrated and began shouting at the proctor to cancel the exam so that he could reschedule. Arcos&#x27;s outburst was unsettling and distracting to the other exam takers. After a 30-minute delay, the issue was corrected, and Arcos resumed the exam.<\/p><p>After the exam, Arcos posted on an internet forum that caters specifically to CFA Program Candidates:<\/p><p>&quot;I wanted to warn the CFA Candidate community about a very frustrating software glitch that occurred when I was taking the Level I CFA exam this morning. Just be prepared.&quot;<\/p><p>On another social media forum that focuses on stock investing, Arcos touts the investment prospects of Orogeny Mining Corp. (OMC), a micro-cap stock. Until recently, OMC was a gold mining exploration company. A short time ago, OMC abandoned its conventional mineral-exploration program and started mining cryptocurrencies. Arcos owns 100 shares of OMC, which are currently trading at $1.00 per share. He has not reported his ownership of OMC to Chestnut because his position is small, and the stock is so speculative that the firm would never buy it for clients.<\/p><p>Arcos knows little about the company and has done no due diligence, but states on the social media platform:<\/p><p>&quot;The word on the street is OMC is in discussions to be acquired by another cryptocurrency mining firm! I can&#x27;t say which one, but it&#x27;s a household name and one of the biggest in the industry! OMC is going higher: be long or be wrong!!!&quot; The next morning in the office break room, Jones, Arcos, and Shelia Smith discuss how stressful the exam experience was. Smith is one of the firm&#x27;s advisers and not a Member or Candidate. During the conversation, Jones asks Arcos what he thought of the accrued interest calculation question in the second session. Arcos states that he was so upset by the whole testing experience that he does not even remember that question.<\/p><p>Later that day, Smith is running late for a meeting with a new client. Smith had initially met the client two weeks before and this follow-up meeting is to present an investment policy statement and recommended investments to the client. At the last minute, Smith asks Jones to fill in for her for just a few minutes to not keep the client waiting. As an analyst, Jones does not normally meet with clients and has not been briefed on the details of the prior meeting.<\/p><p>Jones immediately begins the conversation by suggesting the client consider the firm&#x27;s option overlay strategy, which is a covered call strategy on a popular equity index. Jones states that the strategy has generated better risk-adjusted returns than the index over the past three years. Jones continues by stating the strategy is very popular with clients as an alternative to their conventional equity allocation. Smith arrives at this point in the conversation and Jones leaves the meeting.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Arcos&#x27;s social media post about the software glitch violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading uld never buy it for clients.<\/p><p>Arcos knows little about the company and has done no due diligence, but states on the social media platform:<\/p><p>&quot;The word on the street is OMC is in discussions to be acquired by another cryptocurrency mining firm! I can&#x27;t say which one, but it&#x27;s a household name and one of the biggest in the industry! OMC is going higher: be long or be wrong!!!&quot; The next morning in the office break room, Jones, Arcos, and Shelia Smith discuss how stressful the exam experience was. Smith is one of the firm&#x27;s advisers and not a Member or Candidate. During the conversation, Jones asks Arcos what he thought of the accrued interest calculation question in the second session. Arcos states that he was so upset by the whole testing experience that he does not even remember that question.<\/p><p>Later that day, Smith is running late for a meeting with a new client. Smith had initially met the client two weeks before and this follow-up meeting is to present an investment policy statement and recommended investments to the client. At the last minute, Smith asks Jones to fill in for her for just a few minutes to not keep the client waiting. As an analyst, Jones does not normally meet with clients and has not been briefed on the details of the prior meeting.<\/p><p>Jones immediately begins the conversation by suggesting the client consider the firm&#x27;s option overlay strategy, which is a covered call strategy on a popular equity index. Jones states that the strategy has generated better risk-adjusted returns than the index over the past three years. Jones continues by stating the strategy is very popular with clients as an alternative to their conventional equity allocation. Smith arrives at this point in the conversation and Jones leaves the meeting.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Jones violate the Standards during her conversation with the prospective client?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q074.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":75,"q":"Did Salim violate CFA Institute Code and Standards by suggesting his client hire his cousin as a real estate agent?","opts":["No","Yes, according to the Standards related to referral fees","Yes, according to the Standards related to conflicts of interest"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a075.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a075.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 75–80 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Abdul Salim, CFA, is the head of institutional fixed-income trading at Gold Capital Group (GCG), a sell-side brokerage firm. Salim oversees a team of twelve traders; several of whom are CFA charterholders. The trading desk facilitates orders for large institutional clients such as mutual funds, hedge funds, and other professional investors.<\/p><p>The macroeconomic environment has deteriorated in recent months as the central bank has raised its policy rate several times, the economy has shown signs of slowing, and the inflation rate has increased. Real estate activity has also slowed significantly, with residential home sales down 10% year-over-year.<\/p><p>Salim speaks to one of his regular buy-side clients, who mentions that he has just moved into a new home but has not yet sold his old house. The client is concerned that the deteriorating market conditions may result in a lower listing price for the old house. In passing, Salim suggests the client call his cousin, Shira, a real estate agent, saying that Shira could help the client get his house listed before the market deteriorates further.<\/p><p>Given the macroeconomic conditions, equity markets have also fallen sharply. Salim was recently subject to a margin call in his personal account that he could not meet. Salim was able to secure a personal loan of €100,000 from a longtime client to cover the margin call. Although borrowing from a client violates local law, it is rarely enforced if the loan is repaid quickly. Salim repaid the loan less than one month later, and no one else was even aware the loan took place.<\/p><p>GCG&#x27;s offices are currently undergoing renovations, necessitating that some groups share office space. In particular, GCG&#x27;s proprietary trading desk, which trades exclusively for the benefit of the firm, has temporarily relocated to the main trading floor, where client transactions are carried out. The groups are now in close proximity to one another and can often hear each other&#x27;s conversations and inadvertently see each other&#x27;s screens.<\/p><p>Firm management has decided that this temporary trading situation is acceptable since the firm has a policy of not allowing the proprietary traders to act on any client information. Both groups of traders agree that the situation is not ideal but understand that it is temporary, so they go along with the arrangement.<\/p><p>Salim takes a call from a client who wants to buy a large<\/p><p>block of distressed B-rated corporate bonds that is owned<\/p><p>by another broker-dealer, Apex Brokerage. The client does<\/p><p>not have a trading relationship with Apex and needs Salim<\/p><p>to facilitate the trade. Even though Salim&#x27;s client is not<\/p><p>normally a buyer of below-investment-grade securities,<\/p><p>Salim executes the order for the client, buying at the offer<\/p><p>price and charging the minimum commission to execute the<\/p><p>trade.<\/p><p>Salim purchased a large block of AA-rated corporate bonds<\/p><p>a few days ago and has been unable to find buyers at his<\/p><p>quoted price. Salim provides copies of the most recent<\/p><p>credit rating agency (CRA) research on this bond issue to all<\/p><p>the fixed income sales staff. The CRA research confirms the<\/p><p>strong financial position of the firm and the excellent credit<\/p><p>protections specific to this issue. Salim instructs the sales<\/p><p>staff to aggressively promote these bonds to clients<\/p><p>because the firm needs to free up capital for other<\/p><p>purposes.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Salim violate CFA Institute Code and Standards by suggesting his client hire his cousin as a real estate agent?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q075.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":76,"q":"With regard to the margin call and Salim's loan arrangement, did Salim violate the CFA Institute Code and Standards?","opts":["Yes","No, as Salim quickly repaid the loan","No, as his actions were not fraudulent or deceitful"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a076.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a076.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 75–80 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Abdul Salim, CFA, is the head of institutional fixed-income trading at Gold Capital Group (GCG), a sell-side brokerage firm. Salim oversees a team of twelve traders; several of whom are CFA charterholders. The trading desk facilitates orders for large institutional clients such as mutual funds, hedge funds, and other professional investors.<\/p><p>The macroeconomic environment has deteriorated in recent months as the central bank has raised its policy rate several times, the economy has shown signs of slowing, and ain trading floor, where client transactions are carried out. The groups are now in close proximity to one another and can often hear each other&#x27;s conversations and inadvertently see each other&#x27;s screens.<\/p><p>Firm management has decided that this temporary trading situation is acceptable since the firm has a policy of not allowing the proprietary traders to act on any client information. Both groups of traders agree that the situation is not ideal but understand that it is temporary, so they go along with the arrangement.<\/p><p>Salim takes a call from a client who wants to buy a large<\/p><p>block of distressed B-rated corporate bonds that is owned<\/p><p>by another broker-dealer, Apex Brokerage. The client does<\/p><p>not have a trading relationship with Apex and needs Salim<\/p><p>to facilitate the trade. Even though Salim&#x27;s client is not<\/p><p>normally a buyer of below-investment-grade securities,<\/p><p>Salim executes the order for the client, buying at the offer<\/p><p>price and charging the minimum commission to execute the<\/p><p>trade.<\/p><p>Salim purchased a large block of AA-rated corporate bonds<\/p><p>a few days ago and has been unable to find buyers at his<\/p><p>quoted price. Salim provides copies of the most recent<\/p><p>credit rating agency (CRA) research on this bond issue to all<\/p><p>the fixed income sales staff. The CRA research confirms the<\/p><p>strong financial position of the firm and the excellent credit<\/p><p>protections specific to this issue. Salim instructs the sales<\/p><p>staff to aggressively promote these bonds to clients<\/p><p>because the firm needs to free up capital for other<\/p><p>purposes.<\/p><\/div><\/details><div class=\"qtext\"><p>By disseminating CRA research on the AA-rated corporate bonds to GCG&#x27;s sales staff, did Salim violate the CFA Institute Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q080.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":81,"q":"When he recommends buying BPT stock, does Aguirre violate the Standards?","opts":["No.","Yes, by not distinguishing facts from opinions.","Yes, by not having a reasonable and adequate basis for his recommendation."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a081.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a081.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 81–86 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Carlos Aguirre, CFA, is a sell-side analyst at Strike Brokers, a US-based brokerage firm. Aguirre covers the technology industry and provides recommendations on stocks for Strike&#x27;s clients. Aguirre is currently analyzing the prospects of two US companies: Blue Point Technology (BPT) and New Edge Semiconductors (NES).<\/p><p>Aguirre expects BPT to announce an expansion of its operations to Latin America, which would give a substantial boost to the company&#x27;s earnings given BPT&#x27;s proprietary, state-of-the-art technology. After analyzing the company&#x27;s public filings and doing his own extensive research, Aguirre is confident that this announcement will occur soon. He estimates the stock price target using his financial models and quantitative skills, and he writes in his research report: &quot;In the next weeks, BPT will announce the expansion of its operations to Latin America. This will have substantial positive effects on the company&#x27;s future earnings. We recommend buying BPT stock with a target price of USD 115.&quot;<\/p><p>After studying NES and modeling information compiled from multiple sources, Aguirre is preparing a report with a &quot;buy&quot; recommendation. However, just before finishing the report, he notices a post from a respected financial analyst on an analyst internet forum open only to subscribers. The post says, &quot;NES may look like a solid company, but I expect its stock to suffer a lot in the next quarter.&quot; Aguirre knows that the analyst is very diligent in his research, so he decides to change his recommendation to a &quot;hold&quot; and releases the report to clients.<\/p><p>As a result of his strong track record, Aguirre receives—and accepts—a job offer from Whitaker Asset Management (WAM) to cover the technology sector as a buy-side research analyst. Before leaving Strike, he downloads a large database containing public data from all equity offerings in the last twenty years in the US. Aguirre created and updated this database during his tenure with Strike, without the assistance of any other employee, so he does not ask for his employer&#x27;s consent.<\/p><p>At WAM, Aguirre analyzes another stock, Intrepid Software. After thorough research, he prepares a presentation for the weekly meeting of the investment committee. Aguirre recommends buying the stock, and the committee decides in favor of allocating Intrepid to the accounts for which the stock is suitable.<\/p><p>Leticia Flores, CFA, a portfolio manager at WAM who was present at the meeting, believes this would be a good opportunity for some of her clients. After carefully reviewing Aguirre&#x27;s analysis and her clients&#x27; investment policy statements, Flores concludes that the stock would be suitable to 20 of her 50 clients. Since she does not have discretionary authority over her clients&#x27; accounts, she sends an email to the 20 clients, explaining the investment recommendation. Then, she conducts individual videoconferences with her five major institutional clients to further discuss the recommendation.<\/p><p>One of these videoconferences is with Ben Gafford, a member of the board of trustees of the Solstice Hospital Endowment Fund. This fund has been a client for ten years, an lores with confidential information from the fund, including planned investments in its main charitable projects. Gafford is very satisfied with Flores&#x27; recent recommendations. During the videoconference, on behalf of the board of trustees, he proposes to Flores a one-week trip to a ski resort with all expenses paid for every year that the fund&#x27;s portfolio beats its benchmark by at least 200 basis points. Immediately, Flores calls her employer—who agrees with the proposal— and then Flores tells Gafford she accepts the offer.<\/p><p>A few days later, Flores receives a call from James Conley, one of her private wealth clients. Conley tells Flores, &quot;I am considering donating to the Solstice Hospital Endowment Fund. Gafford told me recently that you also manage the fund&#x27;s portfolio and that you were aware of the fund&#x27;s planned investments in charitable projects. I have been calling Gafford to get details on these investments, but I wasn&#x27;t able to contact him. I would like to decide as soon as possible, so I need you to send that information to me.&quot; Flores knows that any donation would be greatly beneficial to the endowment fund; she sends Conley the requested information and immediately notifies Gafford.<\/p><\/div><\/details><div class=\"qtext\"><p>By sending the Solstice Hospital Endowment Fund&#x27;s information to Conley, does Flores violate any Standard?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q086.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":87,"q":"Based on Exhibit 1, are Foursquare's proxy voting policies consistent with the requirements under Standard II|(A) Loyalty, Prudence, and Care?","opts":["Yes.","No, fund managers may not outsource proxy voting recommendations.","No, even if using a third-party service, every proxy voting decision must be thoroughly researched."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a087.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a087.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 87–90 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Larry Fitzpatrick, CFA, is the chief investment officer at Foursquare Capital Management. Foursquare primarily offers investment services to pensions, endowments, and other large institutional accounts.<\/p><p>Nicole Rappaport, CFA, is the chief investment officer for the endowment of a large children&#x27;s hospital. Rappaport is evaluating the investment merits of the Foursquare Balanced Fund (FSBF), which invests 60% in stocks and 40% in bonds. Foursquare also offers the same strategy as a separately managed account (SMA) with the same level of service but a higher fee. Rappaport is primarily interested in the SMA option since the endowment could retain beneficial ownership of individual securities and benefit from greater transparency with regard to specific investments.<\/p><p>Fitzpatrick and Rappaport are scheduled to meet in a few days to discuss the possibility of an investment in the FSBF strategy. Rappaport is preparing for the meeting and is reviewing investment and legal documentation provided by Foursquare.<\/p><p>Rappaport identifies three specific policy areas that require further clarification from Fitzpatrick, as presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex003.webp\" style=\"max-width:min(100%,648px)\" alt=\"Exhibit\"><p>As Fitzpatrick prepares for the meeting, he is concerned about the FSBF&#x27;s most recent quarterly performance. Foursquare has a reputation as a bottom-up manager, and during the most recent quarter, one of the portfolio&#x27;s largest technology stock positions suffered a 40% decline. Normally, fund performance attribution is presented at the sector level, but the loss was so large in this one position that it negatively skewed the stock selection attribution for not only the technology sector, but the entire fund.<\/p><p>In an effort to explain what occurred during the quarter, Fitzpatrick omits the sector level performance attribution from the standardized client report and instead uses an industry level attribution to better isolate the problem position. Instead of 10 sectors, the report now identifies 88 industry groups. Fitzpatrick believes this added level of disclosure will help clarify that the occurrence was an outlier event and therefore should not overshadow the otherwise strong stock selection in the fund. He presents this information to Rappaport in their meeting.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, are Foursquare&#x27;s proxy voting policies consistent with the requirements under Standard II|(A) Loyalty, Prudence, and Care?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q087.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":88,"q":"ased on Exhibit 1, do Foursquare's trade allocation procedures comply with the requirements of Standard |I|(B) Fair Dealing?","opts":["No.","Yes, as the policies are fully disclosed and transparent.","Yes, as Foursquare's duty of loyalty is to its fund's clients."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a088.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a088.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 87–90 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Larry Fitzpatrick, CFA, is the chief investment ate the problem position. Instead of 10 sectors, the report now identifies 88 industry groups. Fitzpatrick believes this added level of disclosure will help clarify that the occurrence was an outlier event and therefore should not overshadow the otherwise strong stock selection in the fund. He presents this information to Rappaport in their meeting.<\/p><\/div><\/details><div class=\"qtext\"><p>ased on Exhibit 1, do Foursquare&#x27;s trade allocation procedures comply with the requirements of Standard |I|(B) Fair Dealing?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q088.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":89,"q":"Based on Exhibit 1, is Foursquare's minimum lot allocation policy consistent with the required and recommended policies in Standard III(B) Fair Dealing?","opts":["Yes.","No, trade allocations should be done only on a pro rata basis.","No, minimum lot allocation policies are inconsistent with the Standard."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a089.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a089.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 87–90 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Larry Fitzpatrick, CFA, is the chief investment officer at Foursquare Capital Management. Foursquare primarily offers investment services to pensions, endowments, and other large institutional accounts.<\/p><p>Nicole Rappaport, CFA, is the chief investment officer for the endowment of a large children&#x27;s hospital. Rappaport is evaluating the investment merits of the Foursquare Balanced Fund (FSBF), which invests 60% in stocks and 40% in bonds. Foursquare also s Foursquare&#x27;s minimum lot allocation policy consistent with the required and recommended policies in Standard III(B) Fair Dealing?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q089.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":90,"q":"Does Fitzpatrick's performance attribution presentation to Rappaport comply with Standard IIID) Performance Presentation?","opts":["No.","Yes, as it provides greater transparency.","Yes, as there is no specific requirement to present performance attribution."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a090.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a090.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 87–90 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Larry Fitzpatrick, CFA, is the chief investment officer at Foursquare Capital Management. Foursquare primarily offers investment services to pensions, endowments, and other large institutional accounts.<\/p><p>Nicole Rappaport, CFA, is the chief investment officer for the endowment of a large children&#x27;s hospital. Rappaport is evaluating the investment merits of the Foursquare Balanced Fund (FSBF), which invests 60% in stocks and 40% in bonds. Foursquare also offers the same strategy as a separately managed account (SMA) with the same level of service but a higher fee. Rappaport is primarily interested in the SMA option since the endowment could retain beneficial ownership of individual securities and benefit from greater transparency with regard to specific investments.<\/p><p>Fitzpatrick and Rappaport are scheduled to meet in a few days to discuss the possibility of an investment in the FSBF strategy. Rappaport is preparing for the meeting and is reviewing investment and legal documentation provided by Foursquare.<\/p><p>Rappaport identifies three specific policy areas that require further clarification from Fitzpatrick, as presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex003.webp\" style=\"max-width:min(100%,648px)\" alt=\"Exhibit\"><p>As Fitzpatrick prepares for the meeting, he is concerned about the FSBF&#x27;s most recent quarterly performance. Foursquare has a reputation as a bottom-up manager, and during the most recent quarter, one of the portfolio&#x27;s largest technology stock positions suffered a 40% decline. Normally, fund performance attribution is presented at the sector level, but the loss was so large in this one position that it negatively skewed the stock selection attribution for not only the technology sector, but the entire fund.<\/p><p>In an effort to explain what occurred during the quarter, Fitzpatrick omits the sector level performance attribution from the standardized client report and instead uses an industry level attribution to better isolate the problem position. Instead of 10 sectors, the report now identifies 88 industry groups. Fitzpatrick believes this added level of disclosure will help clarify that the occurrence was an outlier event and therefore should not overshadow the otherwise strong stock selection in the fund. He presents this information to Rappaport in their meeting.<\/p><\/div><\/details><div class=\"qtext\"><p>Does Fitzpatrick&#x27;s performance attribution presentation to Rappaport comply with Standard IIID) Performance Presentation?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q090.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":91,"q":"Rossi's primary duty of loyalty is to the:","opts":["fund's investment mandate.","financial advisers since they invest on behalf of clients.","fund's retail shareholders since they pay the highest fees."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a091.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a091.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 91–96 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Sienna Rossi, CFA, is a portfolio manager at Mela Advisors, a buy-side investment manager. Rossi is the portfolio manager of the Mela European Equity Fund, which invests exclusively in large-cap European equities. The fund has two separate share classes: the A-class shares, which are marketed to retail investors; and the ADV-class shares, which are marketed to financial advisers. The funds are identical except for the minimum investment required and the fees that are charged; the A-class shares charge a higher fee.<\/p><p>Rossi is invited to be the keynote speaker at a popular investment conference. During Rossi&#x27;s presentation, she makes the following comments:<\/p><p><b>Comment 1:<\/b> I believe the Italian markets are undervalued by 20%; Italian equities thus represent the largest country overweight in the fund.<\/p><p><b>Comment 2:<\/b> My favorite idea right now is Banco Pompeii; I think it is a buy at the current price.<\/p><p><b>Comment 3:<\/b> I believe everyone in this room should consider owning the Mela European Equity Fund. Mela is in the process of hiring a new equity analyst. Today, Rossi is interviewing Stephen Brewer, a candidate for the position. At their meeting, Rossi asks Brewer about his qualifications. Brewer responds by stating that he was recently a summer intern at a large investment bank and that:<\/p><p><b>Statement 1:<\/b> I passed Level I of the CFA Program on the first try, and<\/p><p><b>Statement 2:<\/b> I am a CFA, Level II Candidate. Rossi asks Brewer when he is taking the next CFA exam. Brewer responds by stating that he passed Level I two years ago and has been very busy since. As such, he has not yet registered for Level II but plans to do so in the near future. After the interview, Rossi meets with Wei Tan, CFA, a third-party investment consultant conducting due diligence on the Mela European Equity Fund. Tan&#x27;s firm is very influential in securing investment allocations to pensions and endowments. If the fund is approved and placed in the consultant&#x27;s model portfolio, assets under management for the Mela European Equity Fund would likely double.<\/p><p>Tan notes that he has already completed a detailed review of the fund&#x27;s published return information and has been impressed by the amount and quality of the information. Tan has also reviewed the fund&#x27;s publicly stated objectives and strategies but asks Rossi to provide more in-depth information regarding specifics about the adviser&#x27;s investment process during their discussion.<\/p><p>After more than an hour-long discussion, Rossi is not confident that Tan is sufficiently impressed. Rossi needs to leave for a client meeting and suggests they finish the discussion over dinner at the Prestige Club, an exclusive country club where she is a member. Tan eagerly accepts, as he has never been to the Prestige Club; he believes becoming a member would be a great way to meet new clients.<\/p><p>Back at Tan&#x27;s office that afternoon, Guo Ming, CFA, an analyst who works with Tan, asks Tan for additional documentation related to the Mela due diligence, including Mela&#x27;s:<\/p><p>Item 1:Code of ethics,<\/p><p>Item 2:Compliance policies and procedures, and<\/p><p>Item 3:Internal control procedures.<\/p><p>Tan responds by stating that he did not review those items, but that Rossi is a CFA charterholder and he (Tan) is confident that she will hold the Mela organization to the high standard of care required by the Code and Standards.<\/p><p>Rossi and Tan continue their discussion over dinner at the Prestige Club. As they finish, Rossi senses Tan&#x27;s interest in joining the club and suggests that she could recommend Tan to the membership committee. As Rossi is about to pay for the meal, Tan insists they split the cost, citing his firm&#x27;s policy.<\/p><p>The next day, Rossi sends Tan the Prestige Club membership application, which includes her letter of recommendation to the club&#x27;s membership committee. Rossi expenses the cost of the dinner and pays for it with soft dollars. A few weeks later, Tan informs Rossi that the Mela European Equity Fund has been added to Tan&#x27;s firm&#x27;s model portfolios. A month later Tan is accepted as a new member of the Prestige Club.<\/p><\/div><\/details><div class=\"qtext\"><p>Rossi&#x27;s primary duty of loyalty is to the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q091.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":92,"q":"Which of Rossi's comments) violated Standard III(C) Suitability?","opts":["None","Only Comments 2 and 3","Comments 1, 2, and 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a092.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a092.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 91–96 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sienna Rossi, CFA, is a portfolio manager at Mela Advisors, a buy-side investment manager. Rossi is the portfolio manager of the Mela European Equity Fund, which invests exclusively in large-cap European equities. The fund has two separate share classes: the A-class shares, which are marketed to
