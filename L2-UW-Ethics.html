fter conducting thorough due diligence, Johnson has concluded this is a great investment opportunity; he would like the hospital endowment to participate, believing the other board members would be excited about the company&#x27;s cancer research.<\/p><p>Johnson speaks to Universal&#x27;s lead underwriter and requests that 5% of the firm&#x27;s IPO allotment be allocated to the endowment. A few days later, when the IPO is priced and allocated, Universal receives 95,000 shares and the endowment receives 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>According to Standard VI(B) Priority of Transactions, when Martin bought shares of Vent, he most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":14,"q":"According to Standard VI(B) Priority of Transactions, the recommended procedures relating to the restricted period for personal transactions should be:","opts":["Al the same for both Johnson and Martin.","longer for Johnson, as the portfolio manager and sole decision-maker.","eliminated for Martin since he has no investment decision-making authority."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–16 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tom Johnson, CFA, is a portfolio manager at Universal Advisors, a US-based wealth management firm that serves high-net-worth individuals and families. Universal&#x27;s equity portfolio offering includes separately managed accounts (SMAs) in which clients own individual securities. Johnson manages the portfolio with an aggressive high-risk, high-reward strategy, investing mostly in small-cap growth stocks. To reduce transaction costs and to simplify trading and settlement, Universal buys only US-listed securities for client accounts.<\/p><p>Johnson instructs Francois Martin, a CFA Level II candidate and new equity analyst at the firm, to conduct research on Vent Industries, a French wind turbine manufacturer. Vent is dually listed on exchanges in France and in the US. Martin, a French national who recently moved to the US, is already familiar with the company since he has been following it personally for the past two years.<\/p><p>After completing due diligence on Vent, Martin is thoroughly impressed by the investment prospects and suggests that Johnson add the US-listed shares of Vent to client portfolios. Johnson, as the sole decision-maker, reviews Martin&#x27;s research and financial models but wants to think about the suggestion before reaching a conclusion.<\/p><p>Martin is so impressed with Vent&#x27;s investment prospects that he wants to buy it for his personal account. For guidance, Martin references Universal&#x27;s publicly available personal transaction disclosure, which states only the following:<\/p><p>&quot;Investment personnel are subject to policies and procedures regarding their personal trading.&quot;<\/p><p>Needing more detail, Martin checks with the firm&#x27;s compliance officer, who informs him that the firm does have policies and procedures designed to prevent potential conflicts of interest related to personal trading. Universal does not require that employees obtain preclearance before trading, but the firm&#x27;s policies do require:<\/p><p>a two-day blackout period before and after client trades, and a quarterly report by its investment decision-making personnel on transactions and holdings. Based on this information, Martin immediately places an order to buy Vent shares listed in France through his personal French brokerage account, which he established prior to joining Universal.<\/p><p>Three days later, Johnson decides to invest for clients in the US-listed shares of Vent and places the order through Universal&#x27;s trading desk.<\/p><p>Johnson is a board member for a local hospital endowment; for this, he receives modest compensation. Universal has approved Johnson&#x27;s board participation and compensation. Johnson is considered to be a thoughtful and successful investor. The other board members, unhappy with the fees and performance of the endowment&#x27;s existing income-oriented large-cap equity manager, asked Johnson a year ago if he would be willing to manage the equity portion of the endowment. Johnson responded by stating:<\/p><p>&quot;The hospital provides so much to this community, I would be happy to manage the endowment&#x27;s equity portfolio. It won&#x27;t even take much time; I will manage the endowment portfolio as an exact replica of Universal&#x27;s equity portfolio.&quot;<\/p><p>The next month, without informing Universal, Johnson began managing the endowment portfolio as a mirror image of Universal&#x27;s equity strategy.<\/p><p>Recently, Johnson evaluated the investment prospects of an upcoming IPO for a small-cap biotech firm. The company does innovative cancer research, but it is still years away from profitability. After conducting thorough due diligence, Johnson has concluded this is a great investment opportunity; he would like the hospital endowment to participate, believing the other board members would be excited about the company&#x27;s cancer research.<\/p><p>Johnson speaks to Universal&#x27;s lead underwriter and requests that 5% of the firm&#x27;s IPO allotment be allocated to the endowment. A few days later, when the IPO is priced and allocated, Universal receives 95,000 shares and the endowment receives 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>According to Standard VI(B) Priority of Transactions, the recommended procedures relating to the restricted period for personal transactions should be:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q014.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":15,"q":"By managing the endowment's equity portfolio, Johnson most likely:","opts":["violated the Standards.","did not violate the Standards since he is not being compensated for his new responsibilities.","did not violate the Standards since his board participation has already been approved by Universal."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a015.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a015.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–16 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tom Johnson, CFA, is a portfolio manager at Universal Advisors, a US-based wealth management firm that serves high-net-worth individuals and families. Universal&#x27;s equity portfolio offering includes separately managed accounts (SMAs) in which clients own individual securities. Johnson manages the portfolio with an aggressive high-risk, high-reward strategy, investing mostly in small-cap growth stocks. To reduce transaction costs and to simplify trading and settlement, Universal buys only US-listed securities for client accounts.<\/p><p>Johnson instructs Francois Martin, a CFA Level II candidate and new equity analyst at the firm, to conduct research on Vent Industries, a French wind turbine manufacturer. Vent is dually listed on exchanges in France and in the US. Martin, a French national who recently moved to the US, is already familiar with the company since he has been following it personally for the past two years.<\/p><p>After completing due diligence on Vent, Martin is thoroughly impressed by the investment prospects and suggests that Johnson add the US-listed shares of Vent to client portfolios. Johnson, as the sole decision-maker, reviews Martin&#x27;s research and financial models but wants to think about the suggestion before reaching a conclusion.<\/p><p>Martin is so impressed with Vent&#x27;s investment prospects that he wants to buy it for his personal account. For guidance, Martin references Universal&#x27;s publicly available personal transaction disclosure, which states only the following:<\/p><p>&quot;Investment personnel are subject to policies and procedures regarding their personal trading.&quot;<\/p><p>Needing more detail, Martin checks with the firm&#x27;s compliance officer, who informs him that the firm does have policies and procedures designed to prevent potential conflicts of interest related to personal trading. Universal does not require that employees obtain preclearance before trading, but the firm&#x27;s policies do require:<\/p><p>a two-day blackout period before and after client trades, and a quarterly report by its investment decision-making personnel on transactions and holdings. Based on this information, Martin immediately places an order to buy Vent shares listed in France through his personal French brokerage account, which he established prior to joining Universal.<\/p><p>Three days later, Johnson decides to invest for clients in the US-listed shares of Vent and places the order through Universal&#x27;s trading desk.<\/p><p>Johnson is a board member for a local hospital endowment; for this, he receives modest compensation. Universal has approved Johnson&#x27;s board participation and compensation. Johnson is considered to be a thoughtful and successful investor. The other board members, unhappy with the fees and performance of the endowment&#x27;s existing income-oriented large-cap equity manager, asked Johnson a year ago if he would be willing to manage the equity portion of the endowment. Johnson responded by stating:<\/p><p>&quot;The hospital provides so much to this community, I would be happy to manage the endowment&#x27;s equity portfolio. It won&#x27;t even take much time; I will manage the endowment portfolio as an exact replica of Universal&#x27;s equity portfolio.&quot;<\/p><p>The next month, without informing Universal, Johnson began managing the endowment portfolio as a mirror image of Universal&#x27;s equity strategy.<\/p><p>Recently, Johnson evaluated the investment prospects of an upcoming IPO for a small-cap biotech firm. The company does innovative cancer research, but it is still years away from profitability. After conducting thorough due diligence, Johnson has concluded this is a great investment opportunity; he would like the hospital endowment to participate, believing the other board members would be excited about the company&#x27;s cancer research.<\/p><p>Johnson speaks to Universal&#x27;s lead underwriter and requests that 5% of the firm&#x27;s IPO allotment be allocated to the endowment. A few days later, when the IPO is priced and allocated, Universal receives 95,000 shares and the endowment receives 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>By managing the endowment&#x27;s equity portfolio, Johnson most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q015.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":16,"q":"Johnson distributed the IPO on a pro rata basis; by allocating shares of the IPO to the endowment, did he violate the Standards?","opts":["Yes.","No, since all clients were treated fairly and equitably.","No, since Johnson conducted thorough due diligence of the IPO."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a016.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a016.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 11–16 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tom Johnson, CFA, is a portfolio manager at Universal Advisors, a US-based wealth management firm that serves high-net-worth individuals and families. Universal&#x27;s equity portfolio offering includes separately managed accounts (SMAs) in which clients own individual securities. Johnson manages the portfolio with an aggressive high-risk, high-reward strategy, investing mostly in small-cap growth stocks. To reduce transaction costs and to simplify trading and settlement, Universal buys only US-listed securities for client accounts.<\/p><p>Johnson instructs Francois Martin, a CFA Level II candidate and new equity analyst at the firm, to conduct research on Vent Industries, a French wind turbine manufacturer. Vent is dually listed on exchanges in France and in the US. Martin, a French national who recently moved to the US, is already familiar with the company since he has been following it personally for the past two years.<\/p><p>After completing due diligence on Vent, Martin is thoroughly impressed by the investment prospects and suggests that Johnson add the US-listed shares of Vent to client portfolios. Johnson, as the sole decision-maker, reviews Martin&#x27;s research and financial models but wants to think about the suggestion before reaching a conclusion.<\/p><p>Martin is so impressed with Vent&#x27;s investment prospects that he wants to buy it for his personal account. For guidance, Martin references Universal&#x27;s publicly available personal transaction disclosure, which states only the following:<\/p><p>&quot;Investment personnel are subject to policies and procedures regarding their personal trading.&quot;<\/p><p>Needing more detail, Martin checks with the firm&#x27;s compliance officer, who informs him that the firm does have policies and procedures designed to prevent potential conflicts of interest related to personal trading. Universal does not require that employees obtain preclearance before trading, but the firm&#x27;s policies do require:<\/p><p>a two-day blackout period before and after client trades, and a quarterly report by its investment decision-making personnel on transactions and holdings. Based on this information, Martin immediately places an order to buy Vent shares listed in France through his personal French brokerage account, which he established prior to joining Universal.<\/p><p>Three days later, Johnson decides to invest for clients in the US-listed shares of Vent and places the order through Universal&#x27;s trading desk.<\/p><p>Johnson is a board member for a local hospital endowment; for this, he receives modest compensation. Universal has approved Johnson&#x27;s board participation and compensation. Johnson is considered to be a thoughtful and successful investor. The other board members, unhappy with the fees and performance of the endowment&#x27;s existing income-oriented large-cap equity manager, asked Johnson a year ago if he would be willing to manage the equity portion of the endowment. Johnson responded by stating:<\/p><p>&quot;The hospital provides so much to this community, I would be happy to manage the endowment&#x27;s equity portfolio. It won&#x27;t even take much time; I will manage the endowment portfolio as an exact replica of Universal&#x27;s equity portfolio.&quot;<\/p><p>The next month, without informing Universal, Johnson began managing the endowment portfolio as a mirror image of Universal&#x27;s equity strategy.<\/p><p>Recently, Johnson evaluated the investment prospects of an upcoming IPO for a small-cap biotech firm. The company does innovative cancer research, but it is still years away from profitability. After conducting thorough due diligence, Johnson has concluded this is a great investment opportunity; he would like the hospital endowment to participate, believing the other board members would be excited about the company&#x27;s cancer research.<\/p><p>Johnson speaks to Universal&#x27;s lead underwriter and requests that 5% of the firm&#x27;s IPO allotment be allocated to the endowment. A few days later, when the IPO is priced and allocated, Universal receives 95,000 shares and the endowment receives 5,000 shares.<\/p><\/div><\/details><div class=\"qtext\"><p>Johnson distributed the IPO on a pro rata basis; by allocating shares of the IPO to the endowment, did he violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q016.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":17,"q":"By agreeing to write the research report, did Tullos most likely violate the Code and Standards?","opts":["No.","Yes, due to the compensation arrangement.","Yes, since issuer-paid research is prohibited under the Standards."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a017.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a017.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 17–22 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Gregory Tullos, CFA, is a sell-side equity analyst at Trailblazer Financial, a multinational financial services company. Trailblazer is approached by Insight Technologies, a small technology company that recently went public through an IPO, to write a research report to increase awareness among potential investors. Trailblazer assigns the report to Tullos. As compensation, Insight offers to pay Trailblazer a flat fee and to pay Tullos a bonus based on the number of new investors in Insight over the next year. Tullos plans to disclose all compensation in the report.<\/p><p>Tullos agrees to the offer and begins research on Insight. During the research process, Tullos uses a model created by a former employee of Trailblazer who developed the model while working there. When the report is completed, the former employee is not credited for her work.<\/p><p>Before publishing the report, Tullos talks to Rania El-Hachem, CFA, about IPOs. El-Hachem is a portfolio manager of separately managed accounts at Trailblazer. She recently researched the upcoming IPO of Dome Pharmaceuticals and has deemed it an appropriate investment for some of her clients. She also likes the stock for her own portfolio, but she submits a request for only enough shares for her clients.<\/p><p>Demand for the IPO ends up being less than anticipated, and the underwriter asks if El-Hachem would be interested in additional shares if the IPO comes in at a slightly lower price. El-Hachem confirms that she could purchase the full allocation for her clients and then purchase some shares for herself. She purchases the shares for her clients with Trailblazer&#x27;s funds, allocating those shares to suitable client portfolios. Then, using personal funds, El-Hachem purchases the additional shares for herself, a practice allowed by Trailblazer.<\/p><p>One of El-Hachem&#x27;s clients requests that El-Hachem add a certain stock to his portfolio. The stock has increased 2% or more in each of the last four trading days, and the client wants to buy the stock before it increases further. After researching the company, El-Hachem does not believe that the stock aligns with the risk and return objectives outlined in the client&#x27;s investment policy statement. However, El-Hachem believes that the trade would have only a minimal impact on the portfolio&#x27;s overall risk profile.<\/p><p>One of the analysts on Tullos&#x27;s team recently left Trailblazer for another firm. This former employee manages two social media accounts: one personal account and one professional account that has been sponsored by Trailblazer and used for client engagement. Trailblazer requires employees to delete their professional social media accounts when leaving the firm. Upon leaving Trailblazer, the former employee posted that the professional account would remain active but that he would no longer be updating it; instead, he provided a link to his professional account at his new firm.<\/p><p>Chris Arendse, another portfolio manager at Trailblazer, is becoming a father and plans to reduce his full-time role with the company to help care for his child. Trailblazer and Arendse agree to a scaled-back role for him with fewer clients. El-Hachem will assume some of Arendse&#x27;s clients. After this occurs, one client who was transferred to El-Hachem asks Arendse to review his portfolio quarterly. In return, the client offers to let Arendse use the client&#x27;s beach house one week each year.<\/p><\/div><\/details><div class=\"qtext\"><p>By agreeing to write the research report, did Tullos most likely violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q017.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":18,"q":"In his use of the model developed by the former employee for the research report, did Tullos violate the Code and Standards?","opts":["No.","Yes, since Tullos did not create the model.","Yes, by not citing the former employee in the research report."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a018.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 17–22 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gregory Tullos, CFA, is a sell-side equity analyst at Trailblazer Financial, a multinational financial services company. Trailblazer is approached by Insight Technologies, a small technology company that recently went public through an IPO, to write a research report to increase awareness among potential investors. Trailblazer assigns the report to Tullos. As compensation, Insight offers to pay Trailblazer a flat fee and to pay Tullos a bonus based on the number of new investors in Insight over the next year. Tullos plans to disclose all compensation in the report.<\/p><p>Tullos agrees to the offer and begins research on Insight. During the research process, Tullos uses a model created by a former employee of Trailblazer who developed the model while working there. When the report is completed, the former employee is not credited for her work.<\/p><p>Before publishing the report, Tullos talks to Rania El-Hachem, CFA, about IPOs. El-Hachem is a portfolio manager of separately managed accounts at Trailblazer. She recently researched the upcoming IPO of Dome Pharmaceuticals and has deemed it an appropriate investment for some of her clients. She also likes the stock for her own portfolio, but she submits a request for only enough shares for her clients.<\/p><p>Demand for the IPO ends up being less than anticipated, and the underwriter asks if El-Hachem would be interested in additional shares if the IPO comes in at a slightly lower price. El-Hachem confirms that she could purchase the full allocation for her clients and then purchase some shares for herself. She purchases the shares for her clients with Trailblazer&#x27;s funds, allocating those shares to suitable client portfolios. Then, using personal funds, El-Hachem purchases the additional shares for herself, a practice allowed by Trailblazer.<\/p><p>One of El-Hachem&#x27;s clients requests that El-Hachem add a certain stock to his portfolio. The stock has increased 2% or more in each of the last four trading days, and the client wants to buy the stock before it increases further. After researching the company, El-Hachem does not believe that the stock aligns with the risk and return objectives outlined in the client&#x27;s investment policy statement. However, El-Hachem believes that the trade would have only a minimal impact on the portfolio&#x27;s overall risk profile.<\/p><p>One of the analysts on Tullos&#x27;s team recently left Trailblazer for another firm. This former employee manages two social media accounts: one personal account and one professional account that has been sponsored by Trailblazer and used for client engagement. Trailblazer requires employees to delete their professional social media accounts when leaving the firm. Upon leaving Trailblazer, the former employee posted that the professional account would remain active but that he would no longer be updating it; instead, he provided a link to his professional account at his new firm.<\/p><p>Chris Arendse, another portfolio manager at Trailblazer, is becoming a father and plans to reduce his full-time role with the company to help care for his child. Trailblazer and Arendse agree to a scaled-back role for him with fewer clients. El-Hachem will assume some of Arendse&#x27;s clients. After this occurs, one client who was transferred to El-Hachem asks Arendse to review his portfolio quarterly. In return, the client offers to let Arendse use the client&#x27;s beach house one week each year.<\/p><\/div><\/details><div class=\"qtext\"><p>In his use of the model developed by the former employee for the research report, did Tullos violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q018.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":19,"q":"Regarding the IPO of Dome Pharmaceuticals, did El-Hachem violate the Code and Standards?","opts":["No","Yes, by allocating shares to herself","Yes, by allocating shares to certain clients but not to others"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a019.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a019.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 17–22 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gregory Tullos, CFA, is a sell-side equity analyst at Trailblazer Financial, a multinational financial services company. Trailblazer is approached by Insight Technologies, a small technology company that recently went public through an IPO, to write a research report to increase awareness among potential investors. Trailblazer assigns the report to Tullos. As compensation, Insight offers to pay Trailblazer a flat fee and to pay Tullos a bonus based on the number of new investors in Insight over the next year. Tullos plans to disclose all compensation in the report.<\/p><p>Tullos agrees to the offer and begins research on Insight. During the research process, Tullos uses a model created by a former employee of Trailblazer who developed the model while working there. When the report is completed, the former employee is not credited for her work.<\/p><p>Before publishing the report, Tullos talks to Rania El-Hachem, CFA, about IPOs. El-Hachem is a portfolio manager of separately managed accounts at Trailblazer. She recently researched the upcoming IPO of Dome Pharmaceuticals and has deemed it an appropriate investment for some of her clients. She also likes the stock for her own portfolio, but she submits a request for only enough shares for her clients.<\/p><p>Demand for the IPO ends up being less than anticipated, and the underwriter asks if El-Hachem would be interested in additional shares if the IPO comes in at a slightly lower price. El-Hachem confirms that she could purchase the full allocation for her clients and then purchase some shares for herself. She purchases the shares for her clients with Trailblazer&#x27;s funds, allocating those shares to suitable client portfolios. Then, using personal funds, El-Hachem purchases the additional shares for herself, a practice allowed by Trailblazer.<\/p><p>One of El-Hachem&#x27;s clients requests that El-Hachem add a certain stock to his portfolio. The stock has increased 2% or more in each of the last four trading days, and the client wants to buy the stock before it increases further. After researching the company, El-Hachem does not believe that the stock aligns with the risk and return objectives outlined in the client&#x27;s investment policy statement. However, El-Hachem believes that the trade would have only a minimal impact on the portfolio&#x27;s overall risk profile.<\/p><p>One of the analysts on Tullos&#x27;s team recently left Trailblazer for another firm. This former employee manages two social media accounts: one personal account and one professional account that has been sponsored by Trailblazer and used for client engagement. Trailblazer requires employees to delete their professional social media accounts when leaving the firm. Upon leaving Trailblazer, the former employee posted that the professional account would remain active but that he would no longer be updating it; instead, he provided a link to his professional account at his new firm.<\/p><p>Chris Arendse, another portfolio manager at Trailblazer, is becoming a father and plans to reduce his full-time role with the company to help care for his child. Trailblazer and Arendse agree to a scaled-back role for him with fewer clients. El-Hachem will assume some of Arendse&#x27;s clients. After this occurs, one client who was transferred to El-Hachem asks Arendse to review his portfolio quarterly. In return, the client offers to let Arendse use the client&#x27;s beach house one week each year.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the IPO of Dome Pharmaceuticals, did El-Hachem violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":20,"q":"Based on the Code and Standards, when El-Hachem receives the unsolicited trade request, she should first:","opts":["submit the trade for the client.","create a new, unmanaged account for the stock.","discuss concerns about the trade with the client."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 17–22 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gregory Tullos, CFA, is a sell-side equity analyst at Trailblazer Financial, a multinational financial services company. Trailblazer is approached by Insight Technologies, a small technology company that recently went public through an IPO, to write a research report to increase awareness among potential investors. Trailblazer assigns the report to Tullos. As compensation, Insight offers to pay Trailblazer a flat fee and to pay Tullos a bonus based on the number of new investors in Insight over the next year. Tullos plans to disclose all compensation in the report.<\/p><p>Tullos agrees to the offer and begins research on Insight. During the research process, Tullos uses a model created by a former employee of Trailblazer who developed the model while working there. When the report is completed, the former employee is not credited for her work.<\/p><p>Before publishing the report, Tullos talks to Rania El-Hachem, CFA, about IPOs. El-Hachem is a portfolio manager of separately managed accounts at Trailblazer. She recently researched the upcoming IPO of Dome Pharmaceuticals and has deemed it an appropriate investment for some of her clients. She also likes the stock for her own portfolio, but she submits a request for only enough shares for her clients.<\/p><p>Demand for the IPO ends up being less than anticipated, and the underwriter asks if El-Hachem would be interested in additional shares if the IPO comes in at a slightly lower price. El-Hachem confirms that she could purchase the full allocation for her clients and then purchase some shares for herself. She purchases the shares for her clients with Trailblazer&#x27;s funds, allocating those shares to suitable client portfolios. Then, using personal funds, El-Hachem purchases the additional shares for herself, a practice allowed by Trailblazer.<\/p><p>One of El-Hachem&#x27;s clients requests that El-Hachem add a certain stock to his portfolio. The stock has increased 2% or more in each of the last four trading days, and the client wants to buy the stock before it increases further. After researching the company, El-Hachem does not believe that the stock aligns with the risk and return objectives outlined in the client&#x27;s investment policy statement. However, El-Hachem believes that the trade would have only a minimal impact on the portfolio&#x27;s overall risk profile.<\/p><p>One of the analysts on Tullos&#x27;s team recently left Trailblazer for another firm. This former employee manages two social media accounts: one personal account and one professional account that has been sponsored by Trailblazer and used for client engagement. Trailblazer requires employees to delete their professional social media accounts when leaving the firm. Upon leaving Trailblazer, the former employee posted that the professional account would remain active but that he would no longer be updating it; instead, he provided a link to his professional account at his new firm.<\/p><p>Chris Arendse, another portfolio manager at Trailblazer, is becoming a father and plans to reduce his full-time role with the company to help care for his child. Trailblazer and Arendse agree to a scaled-back role for him with fewer clients. El-Hachem will assume some of Arendse&#x27;s clients. After this occurs, one client who was transferred to El-Hachem asks Arendse to review his portfolio quarterly. In return, the client offers to let Arendse use the client&#x27;s beach house one week each year.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the Code and Standards, when El-Hachem receives the unsolicited trade request, she should first:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q020.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":21,"q":"Based on the former employee's use of the professional social media account, she violated the Standard relating to:","opts":["loyalty.","misconduct.","communication with clients and prospective clients."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a021.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a021.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 17–22 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gregory Tullos, CFA, is a sell-side equity analyst at Trailblazer Financial, a multinational financial services company. Trailblazer is approached by Insight Technologies, a small technology company that recently went public through an IPO, to write a research report to increase awareness among potential investors. Trailblazer assigns the report to Tullos. As compensation, Insight offers to pay Trailblazer a flat fee and to pay Tullos a bonus based on the number of new investors in Insight over the next year. Tullos plans to disclose all compensation in the report.<\/p><p>Tullos agrees to the offer and begins research on Insight. During the research process, Tullos uses a model created by a former employee of Trailblazer who developed the model while working there. When the report is completed, the former employee is not credited for her work.<\/p><p>Before publishing the report, Tullos talks to Rania El-Hachem, CFA, about IPOs. El-Hachem is a portfolio manager of separately managed accounts at Trailblazer. She recently researched the upcoming IPO of Dome Pharmaceuticals and has deemed it an appropriate investment for some of her clients. She also likes the stock for her own portfolio, but she submits a request for only enough shares for her clients.<\/p><p>Demand for the IPO ends up being less than anticipated, and the underwriter asks if El-Hachem would be interested in additional shares if the IPO comes in at a slightly lower price. El-Hachem confirms that she could purchase the full allocation for her clients and then purchase some shares for herself. She purchases the shares for her clients with Trailblazer&#x27;s funds, allocating those shares to suitable client portfolios. Then, using personal funds, El-Hachem purchases the additional shares for herself, a practice allowed by Trailblazer.<\/p><p>One of El-Hachem&#x27;s clients requests that El-Hachem add a certain stock to his portfolio. The stock has increased 2% or more in each of the last four trading days, and the client wants to buy the stock before it increases further. After researching the company, El-Hachem does not believe that the stock aligns with the risk and return objectives outlined in the client&#x27;s investment policy statement. However, El-Hachem believes that the trade would have only a minimal impact on the portfolio&#x27;s overall risk profile.<\/p><p>One of the analysts on Tullos&#x27;s team recently left Trailblazer for another firm. This former employee manages two social media accounts: one personal account and one professional account that has been sponsored by Trailblazer and used for client engagement. Trailblazer requires employees to delete their professional social media accounts when leaving the firm. Upon leaving Trailblazer, the former employee posted that the professional account would remain active but that he would no longer be updating it; instead, he provided a link to his professional account at his new firm.<\/p><p>Chris Arendse, another portfolio manager at Trailblazer, is becoming a father and plans to reduce his full-time role with the company to help care for his child. Trailblazer and Arendse agree to a scaled-back role for him with fewer clients. El-Hachem will assume some of Arendse&#x27;s clients. After this occurs, one client who was transferred to El-Hachem asks Arendse to review his portfolio quarterly. In return, the client offers to let Arendse use the client&#x27;s beach house one week each year.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the former employee&#x27;s use of the professional social media account, she violated the Standard relating to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q021.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":22,"q":"Based on recommended procedures for compliance with Standard IV(B), Arendse's most appropriate course of action is to:","opts":["refuse to review the client's portfolio.","continue to review the portfolio without disclosure to Trailblazer.","disclose the offer to Trailblazer and get written approval before accepting the offer."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a022.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a022.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 17–22 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gregory Tullos, CFA, is a sell-side equity analyst at Trailblazer Financial, a multinational financial services company. Trailblazer is approached by Insight Technologies, a small technology company that recently went public through an IPO, to write a research report to increase awareness among potential investors. Trailblazer assigns the report to Tullos. As compensation, Insight offers to pay Trailblazer a flat fee and to pay Tullos a bonus based on the number of new investors in Insight over the next year. Tullos plans to disclose all compensation in the report.<\/p><p>Tullos agrees to the offer and begins research on Insight. During the research process, Tullos uses a model created by a former employee of Trailblazer who developed the model while working there. When the report is completed, the former employee is not credited for her work.<\/p><p>Before publishing the report, Tullos talks to Rania El-Hachem, CFA, about IPOs. El-Hachem is a portfolio manager of separately managed accounts at Trailblazer. She recently researched the upcoming IPO of Dome Pharmaceuticals and has deemed it an appropriate investment for some of her clients. She also likes the stock for her own portfolio, but she submits a request for only enough shares for her clients.<\/p><p>Demand for the IPO ends up being less than anticipated, and the underwriter asks if El-Hachem would be interested in additional shares if the IPO comes in at a slightly lower price. El-Hachem confirms that she could purchase the full allocation for her clients and then purchase some shares for herself. She purchases the shares for her clients with Trailblazer&#x27;s funds, allocating those shares to suitable client portfolios. Then, using personal funds, El-Hachem purchases the additional shares for herself, a practice allowed by Trailblazer.<\/p><p>One of El-Hachem&#x27;s clients requests that El-Hachem add a certain stock to his portfolio. The stock has increased 2% or more in each of the last four trading days, and the client wants to buy the stock before it increases further. After researching the company, El-Hachem does not believe that the stock aligns with the risk and return objectives outlined in the client&#x27;s investment policy statement. However, El-Hachem believes that the trade would have only a minimal impact on the portfolio&#x27;s overall risk profile.<\/p><p>One of the analysts on Tullos&#x27;s team recently left Trailblazer for another firm. This former employee manages two social media accounts: one personal account and one professional account that has been sponsored by Trailblazer and used for client engagement. Trailblazer requires employees to delete their professional social media accounts when leaving the firm. Upon leaving Trailblazer, the former employee posted that the professional account would remain active but that he would no longer be updating it; instead, he provided a link to his professional account at his new firm.<\/p><p>Chris Arendse, another portfolio manager at Trailblazer, is becoming a father and plans to reduce his full-time role with the company to help care for his child. Trailblazer and Arendse agree to a scaled-back role for him with fewer clients. El-Hachem will assume some of Arendse&#x27;s clients. After this occurs, one client who was transferred to El-Hachem asks Arendse to review his portfolio quarterly. In return, the client offers to let Arendse use the client&#x27;s beach house one week each year.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on recommended procedures for compliance with Standard IV(B), Arendse&#x27;s most appropriate course of action is to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q022.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":23,"q":"With respect to creating the algorithm used for Petersen's investments, did Laight violate Standard V(A) Diligence and Reasonable Basis?","opts":["Yes.","No, since there can be a reasonable basis for a recommendation even if there is a loss.","No, since Laight did not communicate with Chaiken's clients or manage any client portfolios."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a023.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a023.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 23–28 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Chaiken Partners is an investment advisory firm in Country A. The firm services institutions and high-net-worth individuals from around the world but has no offices or advisers outside of Country A. Chaiken&#x27;s investment strategy is to invest based on outputs from complex algorithm-driven computer models that are developed internally by a team led by Charlene Laight, CFA.<\/p><p>When creating an algorithm, Laight&#x27;s team meticulously researches the inputs that will be used and performs extensive backtesting on existing market data to forecast the algorithm&#x27;s performance. Once Laight approves an algorithm, she thoroughly explains the algorithm&#x27;s strategy to Chaiken&#x27;s advisers and provides a summary of the backtest results, but she does not provide technical details on how the algorithms work.<\/p><p>Laight and her team recently developed and approved a new model; when backtested over a 15-year period, this model generated average hypothetical returns of 9% with a standard deviation of 13%. However, the model has not yet produced actual results.<\/p><p>One of Chaiken&#x27;s advisers, Hitomi Tanaka, has been contacted by a potential client, Bryson Petersen, who resides in Country A but is a citizen of Country B. Petersen is considering an initial investment of USD 25 million and indicates that this amount represents about 50% of his net worth. Petersen tells Tanaka that he understands in general the tradeoff between investment risk and return but has little investing experience. Tanaka discusses Petersen&#x27;s background with Chaiken&#x27;s compliance department, which then authorizes her to take Petersen on as a client.<\/p><p>Tanaka explains to Petersen that Chaiken uses algorithms to generate investment options and, although the options&#x27; performance has been good over long periods, there is always a risk of loss. Tanaka invests Petersen&#x27;s assets using Laight&#x27;s new model, which generates a 15% loss in the first quarter.<\/p><p>Shortly after Petersen becomes a client, Tanaka hears a rumor that Petersen is being investigated for money laundering in Country B. She is concerned that money laundering might be the source of Petersen&#x27;s investment with Chaiken, but there is no definitive evidence of this. Tanaka gathers information about the applicable laws of Countries A and B that apply to this situation, and how those laws compare with the Code and Standards. This information is shown in Exhibit 1:<\/p><p>Ross Farley, CFA, is head of compliance for Chaiken. He has provided all employees with Chaiken&#x27;s code of ethics and a policies and procedures manual. Each year, Farley regularly conducts educational training, sets expectations for behavior, and requires employees to sign a document attesting that they have received the code and manual and understand the contents of both. In addition, employees are required to submit a quarterly transaction report detailing their trading of individual securities.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex002.webp\" style=\"max-width:min(100%,527px)\" alt=\"Exhibit\"><p>Tanaka posts on an online chat site where participants offer advice to Candidates studying for the CFA exams. After reading a CFA Institute article that advocates for increased corporate environmental, social, and governance (ESG) awareness, she posts the following on the site: &quot;CFA Institute should think carefully about posting advocacy articles on key issues, such as ESG, that I and others disagree with. These articles can give potential employers the impression that all investment professionals agree with CFA Institute positions when that is rarely the case. In addition, CFA Institute&#x27;s procedures are too strict. For instance, why are we allowed to use only two types of calculators when there are others that are better? Get with the times!&quot;<\/p><p>Tanaka&#x27;s biography on Chaiken&#x27;s website mentions that she is a licensed medical doctor, and her business cards read &quot;Hitomi Tanaka, MD, CFA.&quot; In the biography, she states that &quot;completing the CFA Program greatly improved my knowledge of portfolio management and investing strategies based on Big Data applications.&quot;<\/p><p>Chaiken permits employees to maintain investment accounts with outside firms but requires the employees to send Farley duplicate confirmations for all trades. This rule applies for accounts that an employee establishes in his or her own name, as well as accounts for immediate family members such as a spouse, domestic partner, child, or parent. About half of the employees have outside accounts. Farley does not regularly check the confirmations but believes that employees are complying with the rule.<\/p><p>Greg Smith, a Chaiken employee, recently circumvented the rule by having his neighbor open an account at another firm, with Smith directing the trades made in the account. Farley was not aware of this activity until the neighbor who &quot;owned&quot; the account was charged with insider trading. The neighbor then told law enforcement authorities that Smith was directing the trades.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to creating the algorithm used for Petersen&#x27;s investments, did Laight violate Standard V(A) Diligence and Reasonable Basis?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q023.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":24,"q":"' using the new model to invest Petersen's assets, Tanaka most likely violated which of the following Standards?","opts":["Only Standard III (C) Suitability","Only Standard V(A) Diligence and Reasonable Basis","Both Standard I (C) and Standard V(A)"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a024.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a024.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 23–28 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chaiken Partners is an investment advisory firm in Country A. The firm services institutions and high-net-worth individuals from around the world but has no offices or advisers outside of Country A. Chaiken&#x27;s investment strategy is to invest based on outputs from complex algorithm-driven computer models that are developed internally by a team led by Charlene Laight, CFA.<\/p><p>When creating an algorithm, Laight&#x27;s team meticulously researches the inputs that will be used and performs extensive backtesting on existing market data to forecast the algorithm&#x27;s performance. Once Laight approves an algorithm, she thoroughly explains the algorithm&#x27;s strategy to Chaiken&#x27;s advisers and provides a summary of the backtest results, but she does not provide technical details on how the algorithms work.<\/p><p>Laight and her team recently developed and approved a new model; when backtested over a 15-year period, this model generated average hypothetical returns of 9% with a standard deviation of 13%. However, the model has not yet produced actual results.<\/p><p>One of Chaiken&#x27;s advisers, Hitomi Tanaka, has been contacted by a potential client, Bryson Petersen, who resides in Country A but is a citizen of Country B. Petersen is considering an initial investment of USD 25 million and indicates that this amount represents about 50% of his net worth. Petersen tells Tanaka that he understands in general the tradeoff between investment risk and return but has little investing experience. Tanaka discusses Petersen&#x27;s background with Chaiken&#x27;s compliance department, which then authorizes her to take Petersen on as a client.<\/p><p>Tanaka explains to Petersen that Chaiken uses algorithms to generate investment options and, although the options&#x27; performance has been good over long periods, there is always a risk of loss. Tanaka invests Petersen&#x27;s assets using Laight&#x27;s new model, which generates a 15% loss in the first quarter.<\/p><p>Shortly after Petersen becomes a client, Tanaka hears a rumor that Petersen is being investigated for money laundering in Country B. She is concerned that money laundering might be the source of Petersen&#x27;s investment with Chaiken, but there is no definitive evidence of this. Tanaka gathers information about the applicable laws of Countries A and B that apply to this situation, and how those laws compare with the Code and Standards. This information is shown in Exhibit 1:<\/p><p>Ross Farley, CFA, is head of compliance for Chaiken. He has provided all employees with Chaiken&#x27;s code of ethics and a policies and procedures manual. Each year, Farley regularly conducts educational training, sets expectations for behavior, and requires employees to sign a document attesting that they have received the code and manual and understand the contents of both. In addition, employees are required to submit a quarterly transaction report detailing their trading of individual securities.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex002.webp\" style=\"max-width:min(100%,527px)\" alt=\"Exhibit\"><p>Tanaka posts on an online chat site where participants offer advice to Candidates studying for the CFA exams. After reading a CFA Institute article that advocates for increased corporate environmental, social, and governance (ESG) awareness, she posts the following on the site: &quot;CFA Institute should think carefully about posting advocacy articles on key issues, such as ESG, that I and others disagree with. These articles can give potential employers the impression that all investment professionals agree with CFA Institute positions when that is rarely the case. In addition, CFA Institute&#x27;s procedures are too strict. For instance, why are we allowed to use only two types of calculators when there are others that are better? Get with the times!&quot;<\/p><p>Tanaka&#x27;s biography on Chaiken&#x27;s website mentions that she is a licensed medical doctor, and her business cards read &quot;Hitomi Tanaka, MD, CFA.&quot; In the biography, she states that &quot;completing the CFA Program greatly improved my knowledge of portfolio management and investing strategies based on Big Data applications.&quot;<\/p><p>Chaiken permits employees to maintain investment accounts with outside firms but requires the employees to send Farley duplicate confirmations for all trades. This rule applies for accounts that an employee establishes in his or her own name, as well as accounts for immediate family members such as a spouse, domestic partner, child, or parent. About half of the employees have outside accounts. Farley does not regularly check the confirmations but believes that employees are complying with the rule.<\/p><p>Greg Smith, a Chaiken employee, recently circumvented the rule by having his neighbor open an account at another firm, with Smith directing the trades made in the account. Farley was not aware of this activity until the neighbor who &quot;owned&quot; the account was charged with insider trading. The neighbor then told law enforcement authorities that Smith was directing the trades.<\/p><\/div><\/details><div class=\"qtext\"><p>&#x27; using the new model to invest Petersen&#x27;s assets, Tanaka most likely violated which of the following Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q024.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":25,"q":"If Tanaka suspects that Petersen's financing may be from money laundering, to comply with Standard |(A) Knowledge of the Law, Tanaka's most appropriate action would be to:","opts":["contact the police in Country B.","take no action since Petersen has not been convicted of a crime.","inform Farley of the situation and ask for guidance on how to proceed."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a025.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a025.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 23–28 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chaiken Partners is an investment advisory firm in Country A. The firm services institutions and high-net-worth individuals from around the world but has no offices or advisers outside of Country A. Chaiken&#x27;s investment strategy is to invest based on outputs from complex algorithm-driven computer models that a  outside firms but requires the employees to send Farley duplicate confirmations for all trades. This rule applies for accounts that an employee establishes in his or her own name, as well as accounts for immediate family members such as a spouse, domestic partner, child, or parent. About half of the employees have outside accounts. Farley does not regularly check the confirmations but believes that employees are complying with the rule.<\/p><p>Greg Smith, a Chaiken employee, recently circumvented the rule by having his neighbor open an account at another firm, with Smith directing the trades made in the account. Farley was not aware of this activity until the neighbor who &quot;owned&quot; the account was charged with insider trading. The neighbor then told law enforcement authorities that Smith was directing the trades.<\/p><\/div><\/details><div class=\"qtext\"><p>If Tanaka suspects that Petersen&#x27;s financing may be from money laundering, to comply with Standard |(A) Knowledge of the Law, Tanaka&#x27;s most appropriate action would be to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":26,"q":"With respect to Smith's unauthorized account, Farley most likely violated Standard IV(C) Responsibilities of Supervisors:","opts":["only by not regularly checking the confirmations.","only by not preventing Smith from circumventing the rule.","both by not regularly checking the confirmations and by not preventing Smith from circumventing the rule."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a026.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a026.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 23–28 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chaiken Partners is an investment advisory firm in Country A. The firm services institutions and high-net-worth individuals from around the world but has no offices or advisers outside of Country A. Chaiken&#x27;s investment strategy is to invest based on outputs from complex algorithm-driven computer models that are developed internally by a team led by Charlene Laight, CFA.<\/p><p>When creating an algorithm, Laight&#x27;s team meticulously researches the inputs that will be used and performs extensive backtesting on existing market data to forecast the algorithm&#x27;s performance. Once Laight approves an algorithm, she thoroughly explains the algorithm&#x27;s strategy to Chaiken&#x27;s advisers and provides a summary of the backtest results, but she does not provide technical details on how the algorithms work.<\/p><p>Laight and her team recently developed and approved a new model; when backtested over a 15-year period, this model generated average hypothetical returns of 9% with a standard deviation of 13%. However, the model has not yet produced actual results.<\/p><p>One of Chaiken&#x27;s advisers, Hitomi Tanaka, has been contacted by a potential client, Bryson Petersen, who resides in Country A but is a citizen of Country B. Petersen is considering an initial investment of USD 25 million and indicates that this amount represents about 50% of his net worth. Petersen tells Tanaka that he understands in general the tradeoff between investment risk and return but has little investing experience. Tanaka discusses Petersen&#x27;s background with Chaiken&#x27;s compliance department, which then authorizes her to take Petersen on as a client.<\/p><p>Tanaka explains to Petersen that Chaiken uses algorithms to generate investment options and, although the options&#x27; performance has been good over long periods, there is always a risk of loss. Tanaka invests Petersen&#x27;s assets using Laight&#x27;s new model, which generates a 15% loss in the first quarter.<\/p><p>Shortly after Petersen becomes a client, Tanaka hears a rumor that Petersen is being investigated for money laundering in Country B. She is concerned that money laundering might be the source of Petersen&#x27;s investment with Chaiken, but there is no definitive evidence of this. Tanaka gathers information about the applicable laws of Countries A and B that apply to this situation, and how those laws compare with the Code and Standards. This information is shown in Exhibit 1:<\/p><p>Ross Farley, CFA, is head of compliance for Chaiken. He has provided all employees with Chaiken&#x27;s code of ethics and a policies and procedures manual. Each year, Farley regularly conducts educational training, sets expectations for behavior, and requires employees to sign a document attesting that they have received the code and manual and understand the contents of both. In addition, employees are required to submit a quarterly transaction report detailing their trading of individual securities.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex002.webp\" style=\"max-width:min(100%,527px)\" alt=\"Exhibit\"><p>Tanaka posts on an online chat site where participants offer advice to Candidates studying for the CFA exams. After reading a CFA Institute article that advocates for increased corporate environmental, social, and governance (ESG) awareness, she posts the following on the site: &quot;CFA Institute should think carefully about posting advocacy articles on key issues, such as ESG, that I and others disagree with. These articles can give potential employers the impression that all investment professionals agree with CFA Institute positions when that is rarely the case. In addition, CFA Institute&#x27;s procedures are too strict. For instance, why are we allowed to use only two types of calculators when there are others that are better? Get with the times!&quot;<\/p><p>Tanaka&#x27;s biography on Chaiken&#x27;s website mentions that she is a licensed medical doctor, and her business cards read &quot;Hitomi Tanaka, MD, CFA.&quot; In the biography, she states that &quot;completing the CFA Program greatly improved my knowledge of portfolio management and investing strategies based on Big Data applications.&quot;<\/p><p>Chaiken permits employees to maintain investment accounts with outside firms but requires the employees to send Farley duplicate confirmations for all trades. This rule applies for accounts that an employee establishes in his or her own name, as well as accounts for immediate family members such as a spouse, domestic partner, child, or parent. About half of the employees have outside accounts. Farley does not regularly check the confirmations but believes that employees are complying with the rule.<\/p><p>Greg Smith, a Chaiken employee, recently circumvented the rule by having his neighbor open an account at another firm, with Smith directing the trades made in the account. Farley was not aware of this activity until the neighbor who &quot;owned&quot; the account was charged with insider trading. The neighbor then told law enforcement authorities that Smith was directing the trades.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to Smith&#x27;s unauthorized account, Farley most likely violated Standard IV(C) Responsibilities of Supervisors:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q026.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":27,"q":"With respect to her statements concerning CA Institute's advocacy for ESG and the calculators that can be used in the exam, did Tanaka violate the Code and Standards?","opts":["No.","Yes, with respect to her response to CFA Institute's position on ESG.","Yes, with respect to her statement concerning CFA Institute's approved calculators."],"ans":"A","expl":"Lời giải chi ti e with. These articles can give potential employers the impression that all investment professionals agree with CFA Institute positions when that is rarely the case. In addition, CFA Institute&#x27;s procedures are too strict. For instance, why are we allowed to use only two types of calculators when there are others that are better? Get with the times!&quot;<\/p><p>Tanaka&#x27;s biography on Chaiken&#x27;s website mentions that she is a licensed medical doctor, and her business cards read &quot;Hitomi Tanaka, MD, CFA.&quot; In the biography, she states that &quot;completing the CFA Program greatly improved my knowledge of portfolio management and investing strategies based on Big Data applications.&quot;<\/p><p>Chaiken permits employees to maintain investment accounts with outside firms but requires the employees to send Farley duplicate confirmations for all trades. This rule applies for accounts that an employee establishes in his or her own name, as well as accounts for immediate family members such as a spouse, domestic partner, child, or parent. About half of the employees have outside accounts. Farley does not regularly check the confirmations but believes that employees are complying with the rule.<\/p><p>Greg Smith, a Chaiken employee, recently circumvented the rule by having his neighbor open an account at another firm, with Smith directing the trades made in the account. Farley was not aware of this activity until the neighbor who &quot;owned&quot; the account was charged with insider trading. The neighbor then told law enforcement authorities that Smith was directing the trades.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to her statements concerning CA Institute&#x27;s advocacy for ESG and the calculators that can be used in the exam, did Tanaka violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q027.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":28,"q":"With respect to her business card and biographical information, did Tanaka most likely violate the Code and Standards?","opts":["No.","Yes, by listing her MD before her CFA designation.","Yes, by stating that the CFA Program has increased her knowledge."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a028.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a028.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 23–28 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chaiken Partners is an investment advisory firm in Country A. The firm services institutions and high-net-worth individuals from around the world but has no offices or advisers outside of Country A. Chaiken&#x27;s investment strategy is to invest based on outputs from complex algorithm-driven computer models that are developed internally by a team led by Charlene Laight, CFA.<\/p><p>When creating an algorithm, Laight&#x27;s team meticulously researches the inputs that will be used and performs extensive backtesting on existing market data to forecast the algorithm&#x27;s performance. Once Laight approves an algorithm, she thoroughly explains the algorithm&#x27;s strategy to Chaiken&#x27;s advisers and provides a summary of the backtest results, but she does not provide technical details on how the algorithms work.<\/p><p>Laight and her team recently developed and approved a new model; when backtested over a 15-year period, this model generated average hypothetical returns of 9% with a standard deviation of 13%. However, the model has not yet produced actual results.<\/p><p>One of Chaiken&#x27;s advisers, Hitomi Tanaka, has been contacted by a potential client, Bryson Petersen, who resides in Country A but is a citizen of Country B. Petersen is considering an initial investment of USD 25 million and indicates that this amount represents about 50% of his net worth. Petersen tells Tanaka that he understands in general the tradeoff between investment risk and return but has little investing experience. Tanaka discusses Petersen&#x27;s background with Chaiken&#x27;s compliance department, which then authorizes her to take Petersen on as a client.<\/p><p>Tanaka explains to Petersen that Chaiken uses algorithms to generate investment options and, although the options&#x27; performance has been good over long periods, there is always a risk of loss. Tanaka invests Petersen&#x27;s assets using Laight&#x27;s new model, which generates a 15% loss in the first quarter.<\/p><p>Shortly after Petersen becomes a client, Tanaka hears a rumor that Petersen is being investigated for money laundering in Country B. She is concerned that money laundering might be the source of Petersen&#x27;s investment with Chaiken, but there is no definitive evidence of this. Tanaka gathers information about the applicable laws of Countries A and B that apply to this situation, and how those laws compare with the Code and Standards. This information is shown in Exhibit 1:<\/p><p>Ross Farley, CFA, is head of compliance for Chaiken. He has provided all employees with Chaiken&#x27;s code of ethics and a policies and procedures manual. Each year, Farley regularly conducts educational training, sets expectations for behavior, and requires employees to sign a document attesting that they have received the code and manual and understand the contents of both. In addition, employees are required to submit a quarterly transaction report detailing their trading of individual securities.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-ethics/ex002.webp\" style=\"max-width:min(100%,527px)\" alt=\"Exhibit\"><p>Tanaka posts on an online chat site where participants offer advice to Candidates studyi er business card and biographical information, did Tanaka most likely violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q028.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":29,"q":"Which of Wong's procedures are in accordance with the recommended procedures under Standard |(D) Misconduct?","opts":["Only Procedure 1 and Procedure 2","Only Procedure 3","All of these procedures"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a029.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a029.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 29–32 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Alita Wong, CFA, is the chief compliance officer at Lantau Capital, a sell-side brokerage firm. Wong is updating the firm&#x27;s policies and procedures related to preventing general misconduct, and she develops the following procedures:<\/p><p><b>Procedure 1:<\/b> Check references of potential new employees to ensure they are of good character and for violations of investment-related laws or regulations.<\/p><p><b>Procedure 2:<\/b> Disseminate to all employees a list of potential violations along with related disciplinary sanctions, including actions that lead to termination.<\/p><p><b>Procedure 3:<\/b> Secure an acknowledgment from every employee that they have read, understand, and will abide by Lantau&#x27;s code of ethics. As part of her duties, Wong has compliance supervision responsibilities regarding the research Lantau produces. Wong delegates much of the review process to others, but she regularly conducts random reviews of new research that is scheduled to be released to clients.<\/p><p>One report in particular caught her attention; it was completed by Jared Devonshire, CFA, a quantitative analyst at the firm. In the report, Devonshire unveils a new quantitative stock selection model based on a new and innovative approach. Devonshire credits the quantitative team at Lantau for coming up with the new model.<\/p><p>Intrigued and genuinely curious about this new approach, Wong stops by Devonshire&#x27;s office to ask how he and the team came up with the idea. Devonshire responds by stating that he had read about this new approach in a recently released paper published in an academic journal. Wong responds by stating she did not see a reference to the original research.<\/p><p>Devonshire replies that while the team maintained the core concepts of the original research, the team also made some mechanical adjustments to the model to make it more applicable in the real world. He believes these adjustments were sufficient in magnitude that sourcing the original research is not necessary. Wong agrees with Devonshire&#x27;s assessment and approves the publication of the report.<\/p><p>Back in her office, Wong is reviewing the firm&#x27;s trading records and notices an exceptionally large series of trades that were done by the firm&#x27;s proprietary trading desk (ie, prop trading desk), which trades for the firm&#x27;s benefit with the firm&#x27;s capital. The trades involved homebuilder stocks: all were very profitable, and open positions were closed out within 24 hours after they were established. The trades were executed by the firm&#x27;s most celebrated trader, Bill Campbell, who has generated considerable profits for the firm over his career. Wong then reviews trading records for the past several months and identifies a pattern of trading these same stocks at about the same time each month.<\/p><p>Wong asks Campbell about the trades. Campbell replies that Lantau&#x27;s economic research team has been very good at correctly forecasting data on government housing starts, which are released monthly. Lantau publishes each month&#x27;s report before the government releases this data. Campbell explains that he has been trading in advance of the government&#x27;s releases based on the firm&#x27;s published research.<\/p><p>Wong consults with the economic research team to verify Campbell&#x27;s story. The head of economic research advises Wong that the team recently hired a junior analyst, Solomon Timur, CFA. Timur previously worked at the government Department of Housing, and his monthly forecasts have been exceptional.<\/p><p>Wong then visits Timur&#x27;s office to introduce herself. Timur is visibly nervous when questioned about his forecasts. During the conversation, Timur admits he has a contact inside the Department of Housing who provides him with information that will be included in each government press release on housing starts. Timur has been using this information in his published research reports. Timur states that he has disclosed this information on the government employee to Wong to achieve the protections afforded a &quot;whistleblower.&quot;<\/p><p>rd<\/p><p><b>Please do 3<\/b> question here<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Wong&#x27;s procedures are in accordance with the recommended procedures under Standard |(D) Misconduct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-ethics/q029.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":30,"q":"By publishing the research, the Standards were most likely violated by:","opts":["neither Devonshire nor Wong","only Devonshire","both Devonshire and Wong"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-ethics/a030.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-ethics/a030.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette
