<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

asis-point change.\nThe PVBP can be calculated as [(PV − PV ) / 2] or alternatively as the product of approximate modified duration, the bond's current value,\n− +\nand 1 basis point (0.0001). The reason these two calculations yield the same result is shown here.\nIn this scenario, since the approximate modified duration and the bond's current price are given but the prices of the bond when the yield changes\nare unknown, PVBP can be calculated as:\nThus, the price value of a basis point is $0.12 per $100 par value.\n(Choice B) $0.35 is the result of using the bond's approximate convexity instead of approximate modified duration in the equation above. PVBP\nis a measure of yield duration and therefore does not involve convexity.\n(Choice C) $4.33 is the result of multiplying the current value of the bond by 0.0001 and then multiplying by both approximate modified duration\nand approximate convexity. This overestimates PVBP, which is calculated using only duration.\nThings to remember:\nThe price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes (in currency), given a\nchange of 1 basis point in its YTM. PVBP can be calculated as [(PV − PV ) / 2] or alternatively as the product [(approximate modified duration) ×\n− +\nPV × 0.0001].\n0\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 4, "q": "A bond's current price is 97.15, its approximate modified duration is 12.3, and its approximate convexity is 36.2. The bond's price value of a basis point (in $) is closest to: ", "opts": ["0.12", "0.35", "4.33"], "ans": "A", "expl": "The price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes (in currency) given a\nchange of 1 basis point in its yield-to-maturity. A basis point is 1/100th of a percentage point, or 0.0001. The PVBP of a bond is also known as\nthe bond's PV01 or DV01, meaning \"price value\" or \"dollar value\" of a 1-basis-point change.\nThe PVBP can be calculated as [(PV − PV ) / 2] or alternatively as the product of approximate modified duration, the bond's current value,\n− +\nand 1 basis point (0.0001). The reason these two calculations yield the same result is shown here.\nIn this scenario, since the approximate modified duration and the bond's current price are given but the prices of the bond when the yield changes\nare unknown, PVBP can be calculated as:\nThus, the price value of a basis point is $0.12 per $100 par value.\n(Choice B) $0.35 is the result of using the bond's approximate convexity instead of approximate modified duration in the equation above. PVBP\nis a measure of yield duration and therefore does not involve convexity.\n(Choice C) $4.33 is the result of multiplying the current value of the bond by 0.0001 and then multiplying by both approximate modified duration\nand approximate convexity. This overestimates PVBP, which is calculated using only duration.\nThings to remember:\nThe price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes (in currency), given a\nchange of 1 basis point in its YTM. PVBP can be calculated as [(PV − PV ) / 2] or alternatively as the product [(approximate modified duration) ×\n− +\nPV × 0.0001].\n0\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 5, "q": "A 6% semiannual pay coupon bond has exactly 12 years to maturity. The bond has a YTM of 5.81% and is priced at 101.625466 per 100 of par value. The price value of a basis point for the bond is closest to:", "opts": ["0.0856", "0.0864", "0.1729"], "ans": "B", "expl": "The price value of a basis point (PVBP) is the currency unit change in a bond's full value (ie, market price plus accrued interest) for a change of 1\nbasis point in its YTM. The solution requires determining the price of the bond twice: once at the initial yield less 1 basis point and again at\nthe initial yield plus 1 basis point. The difference between the two prices is then divided by 2 to find the average price change.\nSince the bond pays semiannually, the annual coupon and yields must be divided by 2 and the years to maturity must be multiplied by 2 to obtain\nthe correct input values.\nPVBP is a measure of bond price sensitivity to a change in yield. 0.0864 is the approximate price change per 100 par value due to a 1 basis point\nchange in the bond's YTM. PVBP is used as an alternative to modified or effective duration as a measure of interest rate risk.\n(Choice A) 0.0856 is the PVBP for the bond if it paid coupons annually rather than semiannually.\n(Choice C) 0.1729 results from failing to divide the price difference by 2.\nThings to remember:\nThe price value of a basis point is the currency unit change in a bond's full value for a one basis point change in its YTM. Determine the price of\nthe bond twice, once at the initial yield less 1 basis point and again at the initial yield plus 1 basis point, then divide the difference by 2 to find the\naverage price change.\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 6, "q": "The following applies to a noncallable bond: Selected Bond Data Effective convexity 98.8691 Price if YTM decreases by 1 basis point 101.3167 Price if yield curve shifts down by 1 basis point 101.2866 Price if YTM increases by 1 basis point 100.9711 Price if yield curve shifts up by 1 basis point 101.0011 The bond's PVBP is closest to:", "opts": ["0.1428", "0.1728", "0.3456"], "ans": "B", "expl": "The price value of a basis point (PVBP, also known as PV01 or DV01 [dollar value of 1 basis point]) is a measure of yield duration. PVBP is a\nway to estimate how much a bond's price changes (in currency) given a change of 1 basis point in its YTM. A basis point is 1/100 of a\npercentage point, or 0.0001.\nThe PVBP can be calculated in two ways. In this scenario, the current value of the bond (PV ) is not given, so one can use the price when the\n0\nyield decreases (PV ) and the price when the yield increases (PV ):\n− +\n(Choice A) 0.1428 is the result of incorrectly using the prices of the bond based on changes to shifts in the benchmark yield curve. A noncallable\nbond's price changes are measured with respect to changes in its YTM, not with respect to changes in the yield curve.\n(Choice C) 0.3456 is the result of subtracting PV from PV .\n+ −\nThings to remember:\nThe price value of a basis point (PVBP) is a measure of how much a bond's price changes (in currency) given a change of 1 basis point in its\nYTM. The PVBP can be calculated as [(PV − PV ) / 2] or, alternatively, as the product of approximate modified duration, the bond's current value,\n− +\nand a change in YTM of 1 basis point.\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 7, "q": "An analyst has collected information on three bonds that pay annual coupons and are trading at the same YTM: All else being equal, which of the bonds has the greatest interest rate risk?", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "B", "expl": "Interest rate changes impact the reinvestment risk of coupon-bearing bonds and the call or prepayment risk of fixed-income securities subject to\nearly retirement. Interest rate risk most commonly refers to the impact on bond prices of changes in their YTM. The interest rate (price) risk of\nbonds is positively related to maturity and inversely related to coupon rate and yield.\nA bond's price is the present value of the coupon and principal payments. Interest rate risk reflects the sensitivity of the cash flows' present value\nto maturity, coupon, and yield:\nMaturity (date of the largest single cash flow): A longer maturity has a greater number of periods over which an interest rate change is\ncompounded, which magnifies the impact of rate changes on present value.\nCoupon rate: The higher a bond's coupon rate, the greater the percentage of total cash flows received earlier in a bond's life, which reduces\nthe sensitivity of their present value to interest rate changes.\nYield: The higher a bond's YTM, the smaller the percentage change in yield each basis point represents. Since price changes\nproportionately to the percentage change in YTM, interest rate risk is inversely related to yield.\nIn summary, holding all else constant, the longer (shorter) the time to maturity, the lower (higher) the coupon rate, and the lower (higher) a bond's\nYTM, the higher (lower) its interest rate. Bond Y has the greatest interest rate risk since it has the lowest coupon of the bonds with the longest\nmaturity (Choices A and C).\nThings to remember:\nThe interest rate (price) risk of bonds is positively related to maturity and inversely related to coupon rate and yield.\nExplain how a bond’s maturity, coupon, and yield level affect its interest rate risk", "qhtml": null}, {"n": 8, "q": "An analyst has gathered information on Bonds X, Y, and Z: Assuming the coupon bonds pay interest annually and there is no accrued interest, which of the bonds most likely has the greatest money duration per 100 of par value?", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "B", "expl": "Like modified duration and effective duration, money duration is a measure of a bond's price sensitivity to a change in its yield-to-maturity.\nWhereas modified and effective durations estimate percentage price change, money duration estimates price change in currency units of the\nbond's denomination.\nFor noncallable bonds, money duration is a bond's modified duration multiplied by its full price. Consequently, the bond with the greatest\nsensitivity on a percentage basis (ie, highest modified duration) does not necessarily have the greatest money duration. In this question, the bond\nwith the greatest modified duration (the 20-year, zero-coupon bond) has the smallest money duration since it has a much lower price per 100 par\nvalue compared to the coupon bonds.\nThings to remember:\nMoney duration measures bond price sensitivity to a change in yield-to-maturity, with price changes expressed in currency units of the bond's\ndenomination. For noncallable bonds, money duration is a bond's modified duration multiplied by its full price.\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 9, "q": "The price value of a basis point for a bond is GBP 0.17. If the bond's YTM rises by 1 basis point, its price changes to GBP 98.12. If, instead, the bond's YTM falls by 1 basis point, its price is closest to:", "opts": ["97.78", "97.95", "98.46"], "ans": "C", "expl": "The price value of a basis point (PVBP), a measure of yield duration, is a way to estimate how much a bond's price changes (in currency)\ngiven a change of 1 basis point in its YTM. A basis point is 1/100th of a percentage point, or 0.0001. The PVBP of a bond may also be referred\nto as the bond's PV01 (meaning the price value of 1 basis point) or its DV01 (meaning the dollar value of 1 basis point).\nThe PVBP can be calculated as [(PV − PV )/2] or, alternatively, as the product of approximate modified duration, the bond's current value, and a\n− +\n1-basis-point change in yield:\nIn this scenario, since the PVBP and price information are given, substitute into the formula to solve for PV as follows:\n−\nThus, the price when the bond's yield falls by 1 basis point is GBP 98.46.\n(Choice A) 97.78 is the result of reversing the price when the interest rate increases and the price when the interest rate decreases in the\nnumerator, and then solving for the latter.\n(Choice B) 97.95 is the result of inappropriately subtracting the PVBP from the bond's price if the YTM rises by 1 basis point. The price when the\nyield falls by 1 basis point (2 × PVBP) is greater than the price when the yield rises by 1 basis point, not (1 x PVBP) less than it.\nThings to remember:\nThe price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes given a change in its\nYTM of 1 basis point. The PVBP can be calculated as PVBP = (PV − PV )/2.\n− +\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 10, "q": "A noncallable bond's market value changes from €818,115 to €825,232 when its yield decreases by 0.1%. This price change includes the effects of both duration and convexity. If the bond has a money convexity of €3,271,259,000, its money duration is closest to:", "opts": ["€3,845,741", "€5,481,370", "€7,117,000"], "ans": "B", "expl": "The change in a bond's money price (ie, value in currency) due to a change in its YTM can be estimated using money duration and money\nconvexity. The relationship between the price and YTM of a noncallable bond is represented by a convex curve, as in the image above.\nThe change in a bond's price estimated using only duration is a linear approximation as reflected in the line tangent to the price/yield curve in the\nimage. Therefore, accurate estimates of a bond's price change involve combining two effects: the price change based on duration and the\nprice change due to convexity (ie, the convexity adjustment in currency):\nIn this scenario, the price change, yield change, and money convexity are known. The money duration can be estimated as:\n(Choice A) €3,845,741 is the result of failing to multiply by 1/2 in the numerator.\n(Choice C) €7,117,000 is the result of estimating money duration based on the assumption that the change in the bond's price is due only to\nduration. This is incorrect since the change in the bond's price given in the question includes the effects of both duration and convexity.\nThings to remember:\nEstimating a bond's price change (in currency) involves combining two effects: the price change based on money duration and the price change\ndue to money convexity.\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 11, "q": "A bond matures in 15 years and pays an annual coupon of 5%. It is currently priced at 90.287751 per 100 par value, with a yield-to-maturity of 6%. The bond has a Macaulay duration of 10.658 and an annual modified duration of 10.054. The bond's money duration is closest to: ", "opts": ["907.80", "962.26", "1,005.40"], "ans": "A", "expl": "The money duration of a bond is calculated by multiplying its annual modified duration by the bond's full price. The full price of a bond is its\nmarket price plus accrued interest. In this calculation, the full price is the bond's market (flat) price. There is no accrued interest since there are\nexactly 15 years to maturity.\nLike modified duration—on which it is based—money duration's primary application is quantifying and managing risk. Unlike modified duration,\nwhich can be used to estimate percentage price changes, money duration is used to estimate price changes in money units based on the currency\nin which a bond is denominated.\n(Choice B) 962.26 results from using the Macaulay duration rather than the modified duration.\n(Choice C) 1,005.40 results from multiplying the modified duration by the par value rather than the full price.\nThings to remember:\nA bond's money duration equals its annual modified duration multiplied by its full market price. Money duration estimates price changes in money\nunits based on the currency in which a bond is denominated.\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}];
const CFG = {"title": "Wiley · Yield-Based Bond Duration Measures and Properties", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 11 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
