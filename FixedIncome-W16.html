<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

const DATA = [{"n": 1, "q": "In a bankruptcy reorganization, which of the following categories of creditors is most likely to have the highest recovery rate?", "opts": ["Second lien", "Senior unsecured", "Senior subordinated"], "ans": "A", "expl": "Secured debt is backed by a claim (ie, lien) on specific assets pledged as collateral. Secured creditors have the most senior claim on the cash\nflows and assets of a company. As a type of secured debt, a second lien obligation is ranked ahead of all unsecured creditors and equity\nholders. Secured creditors' claims are paid first in any liquidation or obtain the highest recovery rates in a bankruptcy reorganization.\nIn the case of a second lien obligation, first lienholders have a prior claim on the assets pledged as collateral. However, the collateral value is\ntypically significantly greater than the original value of the claims of all lienholders. Should the collateral prove inadequate to cover the entire debt,\nsecured creditors are ranked equally with senior unsecured creditors for the balance of their claims.\n(Choice B) Senior unsecured creditors are ranked ahead of all other unsecured creditors and all equity holders. However, senior unsecured\ncreditors rank behind the secured creditors, including second and third lienholders, with respect to any asset pledged as collateral.\n(Choice C) Senior subordinated creditors are junior to the other listed creditor classes. Although senior to other subordinated creditors and equity\nholders, senior subordinated lenders have the lowest recovery rate among the categories of creditors shown here.\nThings to remember:\nSecured creditors have the most senior claim on the cash flows and assets of a company. As a type of secured debt holder, second lienholders\nare ranked ahead of all unsecured creditors and all equity holders. Second lienholders have among the highest recovery rates in bankruptcy\nreorganizations.\nDescribe the seniority rankings of debt, secured versus unsecu IIIYSQC8r/H2HquvGVMC9LAAAAAElFTkSuQmCC"]}, {"n": 3, "q": "The following information is from a company's income statement: € millions Gross profit 7,294 Other operating income 314 Other operating expenses 6,910 Operating profit 698 Interest income 54 Interest expense 169 Income before taxes 583 Income taxes 172 Net income 411 Depreciation and amortization were €207 million for 20X0. Based on only this information, the company's EBITDA interest coverage ratio is closest to:", "opts": ["4.13", "5.36", "7.87"], "ans": "B", "expl": "EBITDA interest coverage = EBITDA ÷ Interest expense\nEBITDA = Operating profit + Depreciation and amortization\nCredit analysts often use credit analysis ratios as part of an evaluation of a company's financial health. Among these, coverage ratios can assess\nthe company's ability to pay its interest obligations through its operations. Two commonly used ratios are the EBITDA and EBIT interest-coverage\nratios.\nBoth ratios measure the operating earnings available to make interest payments relative to the size of those interest payments. The higher the\nratio, the more likely the company can meet its obligations. Of the two, EBITDA interest coverage is considered the more liberal ratio since it adds\nback the noncash expense of depreciation and amortization to the numerator, and EBIT interest coverage does not.\nIn this scenario, the EBITDA interest coverage ratio is calculated by first determining EBITDA. Since this company does not have other\nnonoperating income and expenses, its operating profit equals EBIT. Therefore:\nEBITDA = Operating profit + Depreciation and amortization\n= 698 + 207\n= 905\nThen, EBITDA is divided by interest expense:\nEBITDA interest coverage = EBITDA / Interest expense\n= 905 / 169\n≈ 5.36\n(Choice A) 4.13 results from not adding in depreciation and amortization before dividing by the interest expense. It is the correct result when\ncalculating the EBIT interest coverage ratio, not the EBITDA interest coverage ratio.\n(Choice C) 7.87 results from dividing by the net of the interest income and expense, not just the interest expense.\nThings to remember:\nA credit analyst uses credit analysis measures to evaluate a company's financial health. Among these measures, coverage ratios can assess the\ncompany's ability to pay its interest obligations. The EBITDA interest coverage ratio = (Operating profit + Depreciation and amortization) / Interest\nexpense.\nCalculate and interpret financial ratios used in credit analysis", "qhtml": "<p>The following information is from a company&#x27;s income statement:<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgwAAAJECAIAAAD17+tZAAAd10lEQVR42u3dWbLqthoGUJtiGplU5j8X34d9Q1Fu5F+dkWGtp4Rj3Aisz+rY87IsEwDseSgCAIQEAEICACEBgJAAQEgAICQAEBIAfImnIgAuMM/z6pWPrORdncbrHI5eL/4nIQFQGA/vr/vRh0l3EyAhEBIAEmLS3QRQnhB//Uufyo+2vVu/0FcmJIAPVNDLsszzXFzJvmfMaieJfxokL3PPKnhFnaYGzEaNgOt7meI1z6qK3N15onWSiJALZjeliyK9ffFFtY0KYxLAN0yUSs+hGjMs6zdotRMhAXCzQfvEHl7/tG3K/JmMSQDTwGMPXZfOpfthRphSlbj81T+dDsyUjfM3LG0hAVzxEN1qcXLijX//NEhOpEfsO9X1PQbtdTcB445aky6x9GSnxFCNkAD46fxoNTqiuwnoUmcFhyVqVksQHLeoKWQhAUyX9UQlFhn8zoVf06RoVbxCArhujtOPBMP22l850bYELvitciEB8LEh/bbV+uvX1xtGkYFr4B6/pvd9115fPkfDPA0PJCSAvnVlZLHYD+ZEqws/3U/lgcwrAEBLAgAhAYCQAEBIACAkABASAAgJAIQEAEICACEBAEICACEBgJAAQEgAICQAEBIACAkAhAQAQgIAIQEAQgIAIQFAhefpFvM8KyaA77Ysi5YEAJPuJgCEBACdzUf9UACgJQGAkABASAAgJAAQEgAICQCEBABCAgAhAYCQAEBIAICQAEBIACAkABASAAgJAIQEADfxbLu7eZ63L/rjd/WFuSzL3/8qTPiyGzxyUxfc/q1qjGfXeGh7rj+bEOnNFCyMc1ee3o/bnSRqyNXG8bo0WIFcFxKrZ97df1KdNX/EaPg9AK7vHnh/cVtDbjd+bZmuHNrWDM/eNdrq2uREMUUHw96DWf0lq81enclHNeTrxffqdLrdwLUqDNA+KNtsW3+edicc7a15hDyvKZ1XVO5mb6I4Eh1Z/TZLPyakd1J5UYkuyKNzyBr+Aj44/tzqiTydEIkNPjYmESmdSB6+t7aCwzttNysYcTodbiq4KGD6ut7ggtt8hJrhOWb57oZzotuu7WbBsw12I2Zd1KqhcHRu27YFMGxH0zX76VQhPD5+YYlL2g7vbGdMJTZLl11ZUb6/K9E+qLko4KcmlQS7piMv9nhkfNwrnCNTif82ixT37mZZX4X423MvCviRZkT68fH6M5ku6246Ou+yWWJN2lkf75+RB6AZkVW5rzq0r3/cfN7944nM8wluBnDZw/vpZMv39ROnFVq/2uzZaSZWZH5Rwxg/Xbwe3AzggmZE8FF dit analysis is\nan issuer's ability to generate cash flow sufficient to make timely debt service payments (ie, avoid default). The focus shifts to asset values (ie,\ncollateral) when the probability of default has increased enough to concern investors.\n(Choice B) Projected cash flow from company operations is an important consideration when evaluating an issuer's capacity in traditional credit\nanalysis.\n(Choice C) Affirmative and restrictive indenture provisions are an important consideration when evaluating bondholder contractual protections (ie,\ncovenants) in traditional credit analysis.\nThings to remember:\nIn the four Cs of traditional credit analysis, collateral refers to the value of a company's assets relative to its level of indebtedness. In this context,\ncollateral (ie, assets) evaluates the extent to which the sale of financial, tangible and intangible assets could fund the repayment of debt.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAloAAAE4CAIAAAAM7cpxAABKoklEQVR42u2dT2wbR7bujxJPcud5BmznXsxFMAOJSnZjRKKW41gQubSjQNRuDBkQuYqfvaC4GT17Q3GjRG8jciHDsxIZmHB2ohDFWaoFOdmKppEsR00isxjjImoujDvJ2NFbfNfnlavJJinLsmR/v4VANavrz6nqPnVOnSoO7O/vCyGEEPJ68wZFQAghhFAdEkIIIVSHhBBCCNUhIYQQQnVICCGEUB0SQgghVIeEEEII1SEhhBBCdUgIIYRQHRJCCCFUh4QQQgjVISGEEEJ1SAghhFAdEkIIIVSHhBBCCNUhIYQQQnVICCGEUB0SQgghVIeEEEII1SEhhBBCdUgIIYRQHRJCCCFUh4QQQgjVISGEEEJ1SAghhFAdEkIIIVSHhBBCCNUhIYQQQnVICCGEUB0SQgghoZyiCI4S13W3trZ6STkxMRGPx09uS33fF5FSqYT24l8Ricfjs7OzIhKNRo9nzQuFgoisr6/jX9Rzdnb2RHdHqVRqNBr4nMvl2g7ITv2CvnMc50Q/ep0kcASPvIh0FTKhdUgIIYQcD/bJEbKwsNBjvywsLJzQNq6tra2trTmOE25PzM3NHcPKz83Nta3t2traiR54pmnbaUBubm5ubm7qV3t7e3Nzc3Nzc/F4PB6Pn/RHr5MEjuCRDxEyOVbQWfoyicVinXTG0NDQSWxRtVqdnp42r6RSKXiHPM+Dz0p9kmj7UXquevSUqm9wdXUVH15V79bQ0JDqCWsoDg8Pw016or3Ex0HCpgxPus+ZzlJCCCHkFWdgf3+fUjgy8vm85Tl5xabeZ86cMSMvNjc3Y7GYmaBWqyUSCRHxfR9pdnd3j8+seWBgQJ6G/KD+r0a/JBIJxHSISI+ lders will be\ntreated equally in their rights to payment and/or eventual recovery of assets. In this scenario, all bonds are senior unsecured debt of the same\nclass and therefore all bondholders have an equally ranked, pro rata claim.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjEAAADaCAIAAADYEYTLAAAmeElEQVR42u2d61WrThfGt+/6fxcrECsQK5BUEFKBpIJIBZEKAhWEVBBSQSYVBCsQKxArOO+HZ5295gy5G2PU5/fBpQgzw9z2ZfYMF3/+/BFCCCHkDPgfq4AQQghlEiGEEEKZRAghhDKJEEIIoUwihBBCmUQIIYRQJhFCCKFMIoQQQiiTCCGEUCYRQgghlEmEEEIokwghhBDKJEIIIZRJhBBCCGUSIYSQX8N/rIKfx8XFBSuBEHJu7PK5PsqkX9385OiqAKudkI8oyvTdEUIIEa4nEUIIIZRJhBBCKJMIIYQQyiRCCCGUSYQQQghlEiGEEMokQgghhDKJEEIIZRIhhBBCmUQIIYQyiRBCCKFMIoQQIvxWBflVdDodETHGBEEgIsvl0rmhaRoRubq6wp9PT0/D4XCvLOq6FpGqqqIoOkqZ0zQ1xojIfD7HFfzpeR7e4gxr2MHzPBHpdrsiEsfxmXeSJElE5Pb29vyL+o3qqigK/T2OY/w5mUy0V69MWURGo5EzHPAsBpqIYKANBoMwDLd2RRHxff/h4UFEnPuTJMH1TxpWtJMIIYTQTiJnj+d5VVWpquX7vv5LTRAYTAfQ7/ehgh3LTnp4eICF4SiA6xTMr8UYA/XTVkJRz6iZ19fXfU3PE4O+AduOHKWu6rpO09T2TLy+vupw25By23LKsuzp6UlE7u/v4diYTCYYFEhcrRwkHoahYw+VZQlLazwe2+Zdt9tFF227T2gnEUIIoZ1EfgdBEEBzhyZl60qz2UxEoiiy3d/SWnBSJS4IgqMr1JoF9DvbjPsWoNhtYwjvlWXZmdtJ5OikaYpR9pHBgiH5+Pjo9B84JK6urvI8h/Xj9Ebn/uFwCHuo3+/bQywMQxSvKIrPWEqkTCKbQD+GBLL7X1mW6NYrZVKSJFmWORcxBpBIp9OBnDPGaGACXG3tmVqv42KaphB1eLBpmsfHRwxjTcr+0HKn04ETo2kaPGh781BOjNKXl5czUQW0hu3a1hfXe1Cl6oTpdDpYfE6SBLMGvCv2BIdZptvtOi5TdRtOp1PbiaTFwHw0HA7XTUPoCc/Pz85ie1EUz8/PYi3C4y3SNNXEkeZoNNo8F1dVBceU+rKcBzudDjqJuqFwZ5qmeC9NP8syuMW0xgaDAX5BVQRB4FQvdIUkSVDspmmQy2g0slf7m6ZB1RVFgUfQP3dRsIqiOFYn1NAGh71c2Wiyoijg99NRiUrL8/wzZBJ9d4QQQoS+O/INwAKpY/RUVQW1zlkUVbU0yzKopVEUqXYJDVcVWyjsQRBAP90LKKrIIgxDZAFVzlYGYWCNRiPYBE3T4EXqulZHH546VpyFHMMbCYNDVe+6rnu9HtRt6K2qieO6atbGGGjH4/EYv7TNDrx4mqbOK8NSbJoGj/R6PdypajVucNw4NjA72kvur6+vehGlUsMXiTdNg8R1+X2d1t/pdJD7fD5HXaEe9EHP89Cg2jNh4htj0GdUr8/zHB0P6ajhpcZcmqbOSr7GT ts 40.82 Total debt 7.05 Total liabilities 24.51 Based on this information, the company's debt/capital ratio is closest to:", "opts": ["17.27%", "30.18%", "43.23%"], "ans": "B", "expl": "Debt/capital ratio = Total debt / Total capital\nTotal capital = Total debt + Shareholders' equity\nA credit analyst uses credit analysis measures to evaluate the financial health of a company. Among these measures, leverage ratios can assess\nthe company's ability to repay its debt principal. One leverage ratio, the debt/capital ratio, indicates the percentage of the company's total\ncapital that is financed by debt.\nIn this scenario, total capital is calculated as follows:\nTotal capital = Total debt + Shareholders' equity\n= 7.05 + 16.31\n= 23.36\nTo determine the company's debt/capital ratio, divide total debt by total capital:\nDebt/capital ratio = Total debt / Total capital\n= 7.05 / 23.36\n= 30.18%\nNote: Nondebt current liabilities are not included in total debt. Therefore, total debt does not equal total liabilities.\n(Choice A) 17.27% results from dividing total debt by total assets instead of total capital.\n(Choice C) 43.23% results from dividing total debt by shareholders' equity instead of total capital.\nThings to remember:\nCredit analysis measures are used to evaluate a company's financial health. Among these measures, leverage ratios (eg, debt/capital ratio)\nassess the company's ability to repay its debt principal. The debt/capital ratio indicates the percentage of the company's capital that is financed by\ndebt. Nondebt current liabilities are not included in total debt and therefore not equal to total debt.\nCalculate and interpret financial ratios used in credit analysis", "qhtml": "<p>An analyst gathered the following company data:<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlMAAADoCAIAAABEsfYgAAANx0lEQVR42u3d2bKiMBQFULT4/1+2H26VRQuEk4EhsNZb30YIUbPJAL4+n88AAI/xVgUASD4AkHwAIPkAQPIBgOQDAMkHAJIPACQfAEg+ACg2qgLgOV6v1/yPkYc4Tl+Y3n7 suggesting\nthe various claimants agreed to such a settlement. If the priority of claims were strictly followed, the senior secured debtholders would have\nreceived 100% of their claim before lower classes received any distributions.\n(Choice B) In cases where the value of the secured property is less than the amount of the claim, shortfalls are given a status equal to the claims\nof senior unsecured creditors. This claim still takes priority over subordinated debtholders based on the priority of claims.\n(Choice C) Shareholders, including preferred shareholders, have claims junior to those of all debtholders. They will receive distributions only\nafter all liability holders' claims are paid in full, assuming adherence to the priority of claims.\nThings to remember:\nSecured and senior unsecured bond classes have a higher priority of claims on a company's assets during bankruptcies. If subordinated\ndebtholders receive partial payment before secured and senior debtholders are paid in full, a likely reason is that the various classes of claimants\nnegotiated a settlement to avoid litigation.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAx0AAAIDCAIAAADuUOSbAACevklEQVR42u39bXAba5bniZ2EdKt7u/uKoHand9rbVwRYuxNex4wIqsYRnnGXAPB+8b5YBG/ZG2t7SwBUdsTaGyUSuuF1+MMVQVXYDttx+aJaj7+4BYA1u94NR4ugasL+MHMFQBXetT+0CMo73o2JLgFU9cTGurYFkLcrNrpKzPSHP3Huo8xEIgGCFF/+v6i4BYGJJ598MvPJk/9znnMsx3GEEEIIIYQcmwiHgBBCCCGEdhUhhBBCCO0qQgghhBDaVYQQQgghhHYVIYQQQgjtKkIIIYQQ2lWEEEIIIbSrCCGEEEII7SpCCCGEENpVhBBCCCG0qwghhBBCaFcRQgghhBDaVYQQQgghtKsIIYQQQmhXEUIIIYQQ2lWEEEIIIbSrCCGEEEJoVxFCCCGE0K4ihBBCCCG0qwghhBBCaFcRQgghhNCuIoQQQgihXUUIIYQQQmhXEUIIIYTQriKEuHAcZ7ytBTQ43n2diwEZdohG7saHGtuQhzPUloQQ2lWEEEIIIaeNxfcVQuQY2oBlWaY+of90bWBuGSxveBv0bXnY7rk6o/tyNT7yvi7AGex3mkY+EWMfzICryHsefbcMf0ESQmhXEfLBvFTHsUuO+RPvA3K8j8zwB3gSZoRvgy4DcShDZ nducting such policies and strategies can result in overstating profitability. Since investors can never have a complete understanding of a\ncompany's financial and operating situation, they are reliant on management for a truthful portrayal of company circumstances. Questionable\naccounting policies or tax strategies raise concerns about management's character.\nPremature revenue recognition or delayed expense recognition are examples of aggressive accounting policies. Claiming tax credits or\ndeductions that are likely to be challenged by tax authorities are aggressive tax strategies. Such actions can result in higher borrowing costs or\nrequire greater protections for bondholders (eg, more restrictive indenture covenants) because of concerns about character.\n(Choice A) Collateral is the element of the 4 Cs that relates to the value of the company's assets relative to its level of indebtedness.\n(Choice B) Covenants is the element of the 4 Cs that relates bond contract provisions designed to protect bondholders.\nThings to remember:\nIn the 4 Cs of traditional credit analysis, character refers to investors' assessment of company management. Since investors rely on management\nfor an honest portrayal of a company's circumstances, questionable accounting policies or tax strategies raise questions about management's\ncharacter.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAloAAAE4CAIAAAAM7cpxAABKoklEQVR42u2dT2wbR7bujxJPcud5BmznXsxFMAOJSnZjRKKW41gQubSjQNRuDBkQuYqfvaC4GT17Q3GjRG8jciHDsxIZmHB2ohDFWaoFOdmKppEsR00isxjjImoujDvJ2NFbfNfnlavJJinLsmR/v4VANavrz6nqPnVOnSoO7O/vCyGEEPJ68wZFQAghhFAdEkIIIVSHhBBCCNUhIYQQQnVICCGEUB0SQgghVIeEEEII1SEhhBBCdUgIIYRQHRJCCCFUh4QQQgjVISGEEEJ1SAghhFAdEkIIIVSHhBBCCNUhIYQQQnVICCGEUB0SQgghVIeEEEII1SEhhBBCdUgIIYRQHRJCCCFUh4QQQgjVISGEEEJ1SAghhFAdEkIIIVSHhBBCCNUhIYQQQnVICCGEUB0SQgghoZyiCI4S13W3trZ6STkxMRGPx09u eferred shareholders receiving distributions only after all liability holders' claims\n(including those of subordinated lenders) are paid in full is consistent with strict adherence to the priority of claims.\n(Choice A) All creditors accepting partial settlement of their claims is not strict adherence to the priority of claims. However, senior creditors often\naccept immediate, partial settlement of their claims to avoid protracted litigation and obtain higher recovery rates.\n(Choice C) Secured creditors have a claim only to the money they are owed. Collateral sale proceeds in excess of their claims are used to make\ndistributions to other claimants. Shortfalls are given a status equal to the claims senior unsecured creditors.\nThings to remember:\nThe types of issued securities and the provisions (ie, indentures) of debt contracts determine the priority of claims for different classes of owners\nand creditors. Preferred shareholders receiving no distributions until all liability holders' claims are paid in full is consistent with strict adherence to\nthe priority of claims.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAx0AAAIDCAIAAADuUOSbAACevklEQVR42u39bXAba5bniZ2EdKt7u/uKoHand9rbVwRYuxNex4wIqsYRnnGXAPB+8b5YBG/ZG2t7SwBUdsTaGyUSuuF1+MMVQVXYDttx+aJaj7+4BYA1u94NR4ugasL+MHMFQBXetT+0CMo73o2JLgFU9cTGurYFkLcrNrpKzPSHP3Huo8xEIgGCFF/+v6i4BYGJJ598MvPJk/9znnMsx3GEEEIIIYQcmwiHgBBCCCGEdhUhhBBCCO0qQgghhBDaVYQQQgghhHYVIYQQQgjtKkIIIYQQ2lWEEEIIIbSrCCGEEEII7SpCCCGEENpVhBBCCCG0qwghhBBCaFcRQgghhBDaVYQQQgghtKsIIYQQQmhXEUIIIYQQ2lWEEEIIIbSrCCGEEEJoVxFCCCGE0K4ihBBCCCG0qwghhBBCaFcRQgghhNCuIoQQQgihXUUIIYQQQmhXEUIIIYTQriKEuHAcZ7ytBTQ43n2diwEZdohG7saHGtuQhzPUloQQ2lWEEEIIIaeNxfcVQuQY2oBlWaY+of90bWBuGSxveBv0bXnY7rk6o/tyNT7yvi7AGex3mkY+EWMfzICryHsefbcMf0ESQmhXEfLBvFTHsUuO+RPvA3K8j8zwB3gSZoRvgy4DcShDZ+TuhbHABu4ruMN bt/Total capital Leverage Reliance on debt Lower\nTotal debt/EBITDA Leverage Debt carrying capacity Lower\nEBITDA/Interest expense Coverage Ability to service debt Higher\nA credit analyst uses credit analysis measures to evaluate a company's financial health. Among these measures, coverage ratios can assess the\ncompany's ability to pay (ie, cover) its interest obligations, with a higher ratio indicating better credit quality.\nIn contrast, leverage ratios compare total debt to some measure of capital, income, or cash flow to assess the company's ability to repay principal\nand/or its use of leverage. Since debt is in the numerator of both the total debt/total capital ratio and the total debt/EBITDA ratio, lower leverage\nratios indicate better credit quality.\nIn this scenario, Company Z has the highest EBITDA/interest ratio, indicating that it has the greatest ability to cover the interest payments on its\ndebt. Company Z also has the lowest leverage ratios: its total debt/EBITDA and total debt/total capital ratios are the lowest, indicating a\ngreater ability to pay debt principal and less reliance on debt financing than the other companies. The three ratios together indicate that Company\nZ has the best credit quality on average (Choices A and B).\nThings to remember:\nA credit analyst uses credit analysis measures to evaluate a company's financial health. Among these measures, coverage ratios can assess the\ncompany's ability to pay (ie, cover) its interest obligations, with a higher ratio indicating better credit quality. Leverage ratios compare total debt to\nsome measure of income, cash flow, or capital to assess the company's ability to repay principal and/or its use of leverage.\nCalculate and interpret financial ratios used in credit analysis", "qhtml": "<p>An analyst compiles the following data for three companies: Total debt/total capital Total debt/EBITDA EBITDA/interest expense<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEU n+MLDeuQj67C6HqK6zg5miKGdRI8Ok9W669aYL7bKSr+vLqObVZ1v1QV2K9//zqc0XkE80lfY7Vq10y7WEJ/TcFKib0cJ+9vHqOL2kL+hkrbCwNAACDPacsHA4AADI9AADI9AzHxtv8bU+rkx4AAJneNkAAAPCyObIm6QIAINMDAACDsTcAAIBMDwAAyPQAACDTAwAAMj0AACDTAwCATA8AANzYf+wcpqlNawYUAAAAAElFTkSuQmCC\" alt=\"table\"><p>The company with the highest credit quality is most likely:<\/p>", "explfigs": null}, {"n": 11, "q": "With regards to credit analysis, management's strategy and execution most likely affects:", "opts": ["capacity.", "collateral.", "character."], "ans": "A", "expl": "4 Cs of credit analysis\nCapacity Ability to make debt payments on time\nCollateral Value of assets supporting debt\nCovenants Terms and conditions in debt contracts\nCharacter Track record of management\nCapacity is a borrower's ability to service debt. Evaluating capacity requires a comprehensive analysis of the stability and predictability of all\nrevenues and expenditures. Assessment of a company's capacity should include:\nindustry structure and fundamentals to determine the competitive environment and prospects for growth,\ncompany fundamentals to understand its competitive position and operating history,\nratio analysis to evaluate profitability, leverage, and debt service coverage, and\ncorporate liquidity to assess future flexibility for financing operations and funding investment.\nAssessing management's strategy and execution is a crucial aspect of analyzing a company's capacity to service its debt. Analysts must\nevaluate management's ability to design strategies appropriate for the operating environment and its capability to successfully execute those\nstrategies to achieve targeted growth and profitability.\n(Choice B) Collateral refers to the value of a borrower's assets relative to the amount of its debt.\n(Choice C) Character refers to management's openness and honesty with regards to financial reporting and public communications.\nThings to remember:\nIn traditional credit analysis, capacity is a borrower's ability to service debt. Management's ability to design appropriate strategies and successfully\nexecute them is a crucial aspect of evaluating capacity.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null, "explfigs": null}, {"n": 12, "q": "If a corporate bond issuer defaults, which of the following categories of bondholders is most likely to realize the lowest recovery rate?", "opts": ["Second lien", "Senior secured", "Senior subordinated"], "ans": "C", "expl": "For companies with multiple debt issues outstanding, the debt contracts' provisions (ie, indentures) establish seniority rankings that determine the\npriority of claims for different classes of creditors. The more senior the ranking, the higher the priority of the claim on the cash flow and assets of\nthe issuer.\nSubordinated bondholders are the most junior (ie, lowest ranked) class of company creditors, although they are still senior to the equity\nholders. Consequently, subordinated bondholders are the last creditors to be paid in any liquidation and obtain the lowest recovery rate in a\nbankruptcy reorganization of a company.\n(Choice A) A second lien obligation is a type of secured debt. Other company creditors (ie, first lienholders) have a prior claim on the pledged\nasset. However, recovery is still viable because the value of the collateral should exceed the original value of the claims of all lienholders—\nincluding first, second, and possibly third lienholders.\n(Choice B) Senior secured (first lien) bondholders are ranked ahead of all other creditors.\nThings to remember:\nSubordinated bondholders are the most junior class of company creditors; however, they are still senior to equity holders. Subordinated\nbondholders are the last creditors paid in any liquidation and obtain the lowest recovery rate in a bankruptcy reorganization of a company.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAx0AAAIDCAIAAADuUOSbAACevklEQVR42u39bXAba5bniZ2EdKt7u/uKoHand9rbVwRYuxNex4wIqsYRnnGXAPB+8b5YBG/ZG2t7SwBUdsTaGyUSuuF1+MMVQVXYDttx+aJaj7+4BYA1u94NR4ugasL+MHMFQBXetT+0CMo73o2JLgFU9cTGurYFkLcrNrpKzPSHP3Huo8xEIgGCFF/+v6i4BYGJJ598MvPJk/9znnMsx3GEEEIIIYQcmwiHgBBCCCGEdhUhhBBCCO0qQgghhBDaVYQQQgghhHYVIYQQQgjtKkIIIYQQ2lWEEEIIIbSrCCGEEEII7SpCCCGEENpVhBBCCCG0qwghhBBCaFcRQgghhBDaVYQQQgghtKsIIYQQQmhXEUIIIYQQ2lWEEEIIIbSrCCGEEEJoVxFCCCGE0K4ihBBCCCG0qwghhBBCaFcRQgghhNCuIoQQQgihXUUIIYQQQmhXEUIIIYTQriKEuHAcZ7ytBTQ43n2diwEZdohG7saHGtuQhzPUloQQ2lWEEEIIIaeNxfcVQuQY2oBlWaY+of90bWBuGSxveBv0bXnY7rk6o/tyNT7yvi7AGex3mkY+EWMfzICryHsefbcMf0ESQmhXEfLBvFTHsUuO+RPvA3K8j8zwB3gSZoRvgy4DcShDZ+TuhbHABu4ruMNjOXEDx+T49johROgHJIQQQggR6lWEyDkUrsbo4gm/x+N4DIO9SOFbPs44BAhULoll4JYj9+oUnHcBJy682nT8dQBUqgihXUXIGY3O2dnZ+fzzz4NXgSWTSRHJ5XIiEovFwu+lXC6LSKVSwT9XV1dnZ2dP1Obb3d1dWlrCT+7evavdNtnb20PLQx3L6QSrFQoFDFq3252cnBSRbDYrImtra+MyUNLpNFqYnZ01mw1vJOlRpNNpfJiZmUFTw5o+YUaGXj9ChH5AQgghhJBzxFUOASEjo2//BwcHtVoteONGoyEi6+vrIlKv1xOJRMi9QBmq1+v45/7+vgwpUA0bVt/pdHR3kNn0h91uF0exsrIiIs+fP1e96pgh/OaWvhHi5uH0a7xYLKJ7+qdOpyMi0Wg0IPJ9BCFHx8frPPUOe/Dx1ut115bDdibYb2j2iusBCaFdRYicI4cgntOpVArmiD7PqtVqs9mEBSYimUym3W5LiNV8juOgqeXlZXwTxu/ma9yEeZRi+1gsprtLpVLmBnBUPXr0qJ8xdJzwnYGW2UDPGoxX3bLZbM7MzIgIzMFhTZ+TDlfCb3Wop6amRl5n2s/52K8FGlWECP2AhBBCCCFCvYoQuUz1Z5LJJBxSyvLycjqdlp7/aG9vD/KV1xtoWRakLPw3lUpBMXLpRtLfOeU4TjweF5FYLNbPuebqNnyLu7u76E8sFnP1P7yL6jhCSD93GIai1Wrhm2Qy6bsXVWsUiFXi8QMGoIOPnyQSieA49H7H2+12cYp1777nWnq+y4ChUJmt0+ns7u6iQbSmXYKzuN1uQ870ipqqJqqkJ356JCFEqFcRQgghhAj1KkLkYgWwS/+auwiT0nhnRPyIiKljiUipVMrn8/qrXC6HsJuVlRXs5fnz5y6NAYLHxsYGZCfdeyqVQjgUZBvtZLFYRNS59OKl8M9utwudo1QqoVfSi/7Bf+fm5rSfZudFZHZ2dmdnR7/f2dlxyTPr6+sPHjzQ7lWr1Tt37gSnU4feUygUXDuNRqOLi4tepcfblCu6SAJTS4hINpvFByUWi2GIMplMSCmuUCjoAgVXt0ulEpp67+02EtGwPF39YMaBJZNJ5LlYXFzUVQsY+SdPnojIo0eP0LKSyWS2trbMwcQZfPz4sV4kqmAhp4YrWwRTMxBCu4qQD4Zt22bUdiQS8T6c4 easures Better credit quality if ratio is\nTotal debt/Total capital Leverage Reliance on debt Lower\nTotal debt/EBITDA Leverage Debt carrying capacity Lower\nEBITDA/Interest expense Coverage Ability to service debt Higher\nDebt-to-total capital ratios measure the extent to which a firm relies on debt to finance its operations. Total debt-to-EBITDA ratios assess how\nwell a company's ability to generate cash from operations can support its debt. In general, the higher the value of these leverage ratios, the\nworse a company's credit quality. Company Z's leverage ratios are above both the industry average and Company Y's.\nEBITDA-to-interest expense ratios measure a company's ability to cover interest payments with cash flow from operations, using EBITDA\n(earnings before interest, taxes, depreciation, and amortization) as a proxy for operating cash flow. A lower coverage ratio means greater\nuncertainty that the company can generate the cash flow to service its debt. Company Z's coverage ratio is below both the industry average and\nCompany Y's.\nThings to remember:\nLeverage and coverage ratios are two of the most important categories of financial ratios for evaluating credit quality. In general, higher leverage\nand lower coverage ratios are associated with lower credit quality, and vice versa.\nCalculate and interpret financial ratios used in credit analysis", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAt0AAADiCAIAAAAd5uz0AAAsLElEQVR42u2d71nqzvO/h9/1fW6o4EAFhgoMFQgVCBVIKhAqACogVABWQKzAWIGxAmMF5/fgdZ259hP+iL7VI577fuClcZNsdnY3szOzk8bv378NAAAA4Bvw/2gCAAAAQC8BAAAAQC8BAAAA9BIAAAAA9BIAAABALwEAAABALwEAAAD0EgAAAAD0EgAAAEAvAQAAAEAvAQAAAPQSAAAAAPQSAAAAQC8BAAAAQC8BAACAf4b/e+sJjUaDVgMAAIDj+f3797FqxvFFAQAAAAw/DgAAAKCXAAAAAKCXAAAAAHoJAAAAAHoJAAAAoJcAAAAAoJcAAAAAoJcAAAAAegkAAAAAegkAAACglwAAAACglwAAAID99O8JA5wW3W731TJXV1dmNhgMXi1ZFIWZxXF8fAV0Spqmm83mQLEsy5bL5c5/XV5eqnpRFL2jBbIse3h4MLPpdPoZD/h3ZSfxHSM7Pd1bH60oijRNzeyA+LIsM7MD4lP13iE+Xfnh4eFV2 ompany's credit analysis.\n(Choice B) When default occurs, high-quality intangibles (ie, intellectual property) are considered easier to liquidate, thus reducing loss severity.\nIn contrast, low-quality intangibles have little or no liquidation value and cannot be relied on to compensate creditors. Therefore, collateral\nassessments are most significant to companies holding low-quality intangibles.\n(Choice C) A company with large capital expenditures compared against its depreciation expense may be investing capital in new or replacement\nassets with higher liquidation values that can reduce loss severity. Such investments may also indicate sustained financial performance and lower\ndefault risk. For these reasons, collateral assessments would not be a significant concern.\nThings to remember:\nCollateral analysis measures the liquidation value of assets that may be sold in the event of default. When a company has stocks trading below\nbook value, low capital expenditures, or low-quality intangibles, the risks of default and severe loss increase. Collateral assessments would be a\nsignificant concern in the company's credit analysis.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null, "explfigs": null}, {"n": 16, "q": "An analyst compiles the following information for a company: £ 20X1 20X2 20X3 Total debt 912 1,200 2,010 Shareholders' equity 165 173 186 Total capital 1,077 1,373 2,196 Operating profit 246 210 205 Depreciation and amortization 262 146 314 Interest expense 114 75 100 Based on the trends in the company's ratio of total debt to total capital and its ratio of EBITDA to interest expense over the three-year period, the most appropriate conclusion is that the company's ability to pay interest payments is:", "opts": ["increasing and its ability to repay principal is increasing.", "increasing and its ability to repay principal is decreasing.", "decreasing and its ability to repay principal is increasing."], "ans": "B", "expl": "Credit analysis ratios\nType Ratio\nDebt-to-Capital\nLeverage Debt-to-EBITDA\n(ability to repay principal) FFO-to-Debt\nFCF after dividends-to-Debt\nCoverage EBITDA-to-Interest expense\n(ability to cover interest) EBIT-to-Interest expense\nEBITDA\nProfitability and FFO\ncash flow measures FCF before dividends\nFCF after dividends\nFCF = free cash flow; FFO = funds from operations.\nA credit analyst uses measures such as coverage ratios and leverage ratios to evaluate a company's financial health. Coverage ratios (eg,\nEBITDA to interest expense) can assess the company's ability to pay (ie, cover) its interest obligations; a higher coverage ratio indicates better\ncredit quality.\nIn contrast, leverage ratios (eg, total debt to total capital) compare total debt with some measure of capital, income, or cash flow to assess the\ncompany's ability to repay debt principal and/or its use of leverage. Since debt is in the numerator in the ratio of total debt to total capital, a lower\nnumber indicates a greater ability to repay principal and, therefore, better credit quality.\nIn this scenario, the two ratios are calculated for each of the three years:\nThe company's ratio of EBITDA to interest expense is increasing, which indicates that its ability to pay interest on debt is increasing.\nHowever, its ratio of total debt to total capital is also increasing, which indicates that its ability to repay debt principal is decreasing\n(Choices A and C).\nCalculate and interpret financial ratios used in credit analysis", "qhtml": "<p>An analyst compiles the following information for a company:<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1wAAAGRCAIAAAD+biXQAAAcdElEQVR42u3d2ZarOBYFQPDi/3+Zfsi6bi8bxNHEGPFUlRczHGTYFgLGeZ4HAACe7aUEAAAIhQAACIUAAAiFAAAIhQAACIUAAAiFAAAIhQAA/GdqOK9xHH//6OHYAPe2ePBPH/+D54vfySLTJBb9NfGFzlAFRd6/zmUrqTHXF7lVhccmM1oromgI8MA4mD74pz/1+ZGyc2T8/H2Jc1PxGXbPOt8gBpy/Me9Q5NcOdQTggYlwcZrNT31OsH ans": "B", "expl": "4 Cs of credit analysis\nCapacity Ability to make debt payments on time\nCollateral Value of assets supporting debt\nCovenants Terms and conditions in debt contracts\nCharacter Track record of management\nCapacity is a borrower's ability to service debt. Evaluating capacity entails both industry and company analysis. The industries in which a\nborrower operates are analyzed to understand the competitive environment and prospects for growth and how each impacts borrower cash flow.\nBeyond assessing the general operating environment, borrower-specific circumstances are analyzed, including:\nAbility to generate revenue (eg, sales trends and turnover ratios)\nProfitability (eg, profit margins and return ratios\nSolvency and ability to meet obligations (eg, debt ratios and coverage ratios)\nOperating and financial leverage\nEBITDA is a proxy for operating cash flow. EBITDA/interest expense is a widely used coverage ratio. Beyond operating considerations,\ncapacity is also influenced by the ability to obtain additional funds (eg, access to capital markets or banks).\n(Choice A) Management's track record is addressed in Character.\n(Choice C) Asset values versus level of indebtedness is addressed under Collateral.\nThings to remember:\nCapacity is a borrower's ability to service debt. Capacity is primarily evaluated by comparing net operating cash flows to required debt payments.\nEBITDA is a proxy for operating cash flow and is often compared to interest expense (ie, interest coverage ratio) to assess a borrower's capacity\nto repay its debts.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null, "explfigs": null}];
const CFG = {"title": "Wiley · Credit Analysis for Corporate Issuers", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 17 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
