<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "According to Standard IV Duty to Employers, all members and candidates must:", "opts": ["judge the suitability of investments on a total portfolio approach.", "not accept gifts that create conflicts of interest without written consent.", "not engage in conduct that compromises the reputation of the CFA Institute."], "ans": "B", "expl": "\"Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or\nmight reasonably be expected to create a conflict of interest with their employer's interest unless they obtain\nwritten consent from all parties involved.\"\nStandard IV focuses on the duty to employers. Under Standard IV(B), members and candidates must not accept gifts that may create a conflict\nof interest with their employer unless all parties involved give written consent.\nHere, all the answer choices are valid constraints of the Standards, but only one is associated with Standard IV. This is a way of testing\nknowledge of the Standards themselves. Although most exam questions will address applications of the Standards, it is possible that there will be\na question like this on the exam.\n(Choice A) Judging the suitability of an investment using the total portfolio approach is an application of Standard III(C) Suitability, not Standard\nIV Duty to Employers. Standard III is about a member's or candidate's duty to clients.\n(Choice C) Standard VII(A) Conduct as Participants in CFA Institute Programs , not Standard IV Duty to Employers, requires members and\ncandidates to act in a manner that does not compromise the reputation of the CFA Institute.\nThings to remember:\nOne aspect of Standard IV that relates to the duty to employers is accepting gifts. Under this Standard, members and candidates must not accept\ngifts that may create a conflict of interest with their employer unless all parties involved give written consent.\nExplain the ethical responsibilities required by the Code and Standards, including the sub-sections of each Standard", "qhtml": null, "explfigs": null}, {"n": 2, "q": "Which of the following is one of the six elements of the CFA Institute's Code of Ethics? Members and candidates must:", "opts": ["judge the suitability of investments in the context of the client's total portfolio.", "promote the integrity of the global capital markets for the ultimate benefit of society.", "avoid misrepresentations relating to analysis, recommendations, actions, or other professional activities."], "ans": "B", "expl": "Code of Ethics Standards of Professional Conduct\nAspirational Behavioral\nOverarching expected behavior Ethical business practices\nConceptual Actionable\nCFA Charter holders and candidates are obligated to abide by and advocate for the Code of Ethics (ie, the Code) and the Standards of\nProfessional Conduct (ie, the Standards), which provide guidance for appropriate ethical behavior. The Code includes general principles to\nwhich members and candidates must adhere. In contrast, the Standards address more specific applications of those principles that must be\nfollowed.\nTo identify elements of the Code and the Standards, determine whether the task in question is actionable or is more conceptual. \"Promoting…\nintegrity and viability…for the ultimate benefit of society\" is one of the six principles of ethical behaviors in the Code. Judging client suitability\nand avoiding misrepresentation are practical applications of the Standards (Choices A and C).\nThings to remember:\nThe Code of Ethics and the Standards of Professional Conduct provide guidance in identifying appropriate ethical behavior. The Code includes\ngeneral principles and the Standards contain more specific applications.\nIdentify the six components of the Code of Ethics and the seven Standards of Professional Conduct", "qhtml": null, "explfigs": null}, {"n": 3, "q": "The CFA Institute's Professional Conduct staff (PCS) finds that Simon Perret, CFA, has violated the Standards. Perret rejects the PCS's proposed sanctions. Which of the following is most likely to occur?", "opts": ["The PCS revokes Perret's charter.", "The PCS issues Perret a cautionary letter.", "The Disciplinary Review Committee reviews the PCS's investigative report."], "ans": "C", "expl": "The CFA Institute Professional Conduct Program is a framework for handling inquiries about members' and candidates' professional conduct. The\nProfessional Conduct staff (PCS) initiates an inquiry, which is based on an external complaint or internal investigations. The PCS may question\nthe accused member or anyone else associated with the inquiry. The PCS records evidence relevant to the investigation, prepares a report, and\ndetermines if a violation occurred.\nIf the PCS believes that a violation occurred and the member accepts this finding, then the PCS will either issue a cautionary letter or proceed with\ndisciplinary action. If the accused rejects the finding, then a panel of the Disciplinary Review Committee (DRC) becomes involved. The panel\nreviews the PCS's report and further investigates the matter. The DRC determines whether a violation occurred and sets the final disciplinary\naction.\n(Choices A and B) The PCS imposes sanctions only when it believes a violation transpired and the member or candidate accepts the PCS's\nfindings.\nThings to remember:\nThe Professional Conduct staff (PCS) conducts inquiries and determines if a violation occurred. If the accused member accepts the finding that a\nviolation has occurred and the proposed sanction by the PCS, then the PCS sets the penalty. If the member rejects the PCS's decision, then the\nDiscipline Review Committee further investigates the matter, determines if the violation occurred, and sets the final penalty.\nDescribe the structure of the CFA Institute Professional Conduct Program and the process for the enforcement of the Code and Standards", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANS : 4, "q": "Based on Standard I Professionalism, Members and Candidates must:", "opts": ["have a duty of loyalty to their clients.", "maintain independence and objectivity.", "not compromise the reputation or the integrity of CFA Institute."], "ans": "B", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in\ntheir professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or\nconsideration that reasonably could be expected to compromise their own or another's independence and objectivity.\"\nStandard I of the Standards of Professional Conduct addresses the professionalism of Members and Candidates. Standard I(B)\nIndependence and Objectivity specifically states:\n\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional\nactivities.…\"\nStandard I(B) specifically focuses on Members and Candidates achieving and maintaining independence and objectivity so that their actions and\nadvice to clients are unaffected by conflicts of interest. The Standard applies to situations wherein entities or individuals may seek to influence the\ndecision-making process to the detriment of clients. It does not apply to gifts from the clients themselves.\nIn this question, all answer choices are directly from the Standards but only one is associated with Standard I.\n(Choice A) Standard III(A) Loyalty, Prudence, and Care specifically addresses the duty of loyalty that Members and Candidates have toward their\nclients.\n(Choice C) Standard VII(A) Conduct as Participants in CFA Institute Programs requires Members and Candidates to act in a manner that does\nnot compromise the reputation or the integrity of CFA Institute.\nThings to remember:\nStandard I(B) Independence and Objectivity focuses on Members and Candidates achieving and maintaining independence and objectivity so that\ntheir actions and advice to clients are unaffected by conflicts of interest.\nExplain the ethical responsibilities required by the Code and Standards, including the sub-sections of each Standard", "qhtml": null, "explfigs": null}, {"n": 5, "q": "Standard VI(C) of the Standard of Professional Conduct on Conflicts of Interest most appropriately requires Members and Candidates to:", "opts": ["obtain their employers' written approval for outside compensation.", "notify clients that they may receive a referral fee for recommending a product.", "avoid sending more detailed recommendations to clients based on personal relationships."], "ans": "B", "expl": "This question highlights Standards that have similar language but address different ethical issues and/or requirements for compliance. Although it\nis unlikely that a Candidate will see many of these \"memorization\" ethics questions, the Learning Outcome Statement requires Candidates to\nidentify components of the Standards.\nStandard VI focuses exclusively on conflicts of interest. Standard VI(C) Referral Fees requires Members and Candidates to notify clients that the\nMember or Candidate may receive a referral fee for recommending a product or service.\n(Choice A) Standard IV(B) Additional Compensation Arrangements, not Standard VI, requires Members and Candidates to receive their\nemployers' written approval for all outside compensation, which poses, or could reasonably pose, a conflict of interest. Standard VI requires only\nthat Members and Candidates notify affected parties of any conflict of interest, for which approval is not needed.\n(Choice C) Standard III(B) Fair Dealing requires Members and Candidates to treat all clients impartially with respect to investment\nrecommendations or opportunities.\nThings to remember:\nStandard VI(C) Referral Fees and Standard IV(B) Additional Compensation Arrangements both focus on conflicts of interest. Standard VI(C)\nrequires that Members and Candidates notify affected parties about referral fees. Standard IV(B) requires Members and Candidates to obtain\nwritten approval from their employers for all outside compensation, not just referral fees.\nIdentify the six components of the Code of Ethics and the seven Standards of Professional Conduct", "qhtml": null, "explfigs": null}, {"n": 6, "q": "The CFA Institute's Professional Conduct staff identifies a member as the subject of a written complaint. According to the CFA Institute Bylaws and Rules of Procedure for Professional Conduct, which of the following is most likely the Professional Conduct staff's next step?", "opts": ["Interview the member's supervisor", "Issue the member a cautionary letter", "Refer the inquiry to the Disciplinary Review Committee"], "ans": "A", "expl": "The CFA Institute Professional Conduct Program manages inquiries about members and candidates. One way the Professional Conduct staff\n(PCS) is informed about potential violations is through a written complaint from the public. With this complaint, the PCS creates an inquiry. Once\nan inquiry is opened, the PCS may question the accused member or anyone else associated with the inquiry (eg, the member's supervisor). The\nPCS documents evidence relevant to the investigation and prepares a report.\nIf the PCS believes that a violation occurred, it either issues a cautionary letter or proceeds with disciplinary action. At this point, the member or\ncandidate may reject or accept the charges and sanctions. If the accused party rejects them, then a panel of the Disciplinary Review\nCommittee (DRC) becomes involved. The panel reviews the PCS's report and further investigates the inquiry. It concludes whether the violation\noccurred and sets the final disciplinary action.\n(Choice B) The PCS does not issue a cautionary letter until after the accused accepts the proposed sanctions.\n(Choice C) The PCS refers the inquiry to the DRC only if the member or candidate rejects the PCS charges and sanctions.\nThings to remember:\nThe Professional Conduct staff (PCS) conducts inquiries and determines if it believes a violation has occurred. If so, it proposes the charges and\nsanctions. The member or candidate can accept or reject the PCS's decision. If the accused rejects it, then the Disciplinary Review Committee\nfurther investigates the matter, determines if the violation occurred, and sets the disciplinary action.\nDescribe the structure of the CFA Institute Professional Conduct Program and the process for the enforcement of the Code and Standards", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAR1CAIAAAA8wYd8AAEAAElEQVR42uzd6XYb55Xv/02CACdRBGVLjqw4guQ4djwcgSvu4393slqge52VrHVeiLwCkldA8gpIXgHJGzgEcwMku086vXp1h1A7TmInFqHErXZnEtSJ43iICQ0UB0z/F7/mPqXCIIqTOHw/L7igUqFQKBQK9Tx7P/tpqlQqBgAAAABHTTOHAAAAAACNGQAAAACgMQMAAAAANGYAAAAA0JgBAAAAABozAAAAAEBjBgAAAACNGQAAAACgMQMAAAAANGYAAAAAgMYMAAAAABozAAAAAEBjBgAAAABozAAAAACgMQMAAAAANGYAAAAAgMYMAAAAABozAAAAAEBjBgAAAABozAAAAAAAjRkAAAAANGYAAAAAgMYMAAAAANCYAQAAAEBjBgAAAABozAAAAAAAjRkAAAAANGYAAAAAgMYMAAAAANCYAQAAAICAFg4Bjo1sNmtmmUzm7t27WnL16lUzS6VSNdfP5/N6ymPF4/FkMrmdLdR7rcfudj6f3/EW9lUmk/GDYGY1j8ORs52P/ql8EDoNFhYW7ty5s51z+Kl/4/y8PbQ7uR+7nc1m9b3Y5qWGr/OeXNuDn1pIIpHwvwCMyAwAAAAAHH5NlUqFo4AjLZfLmdnw8LB3OlpVp93U1JSZ9ff326OdlH19fdt5iVQqtbS0VL08nU4PDw8Hl9y+fftJewe1D77zT+srubCwYGaLi4tmNjs7+/+uEU1NwQ7s6uMwOTlpZt3d3aOjo7ZH0YmxsTEzGxwc3Keu7u1/9KOjozp57EDCMtqrYNRIp9Pt27cP4Vevr68v+KU7Kr8mO97tXC6n7/uTXmoO0U/+477OB2ZycrK7u1tfsSe9SFr9+Mz8/LwdlwAyACPNDHYy8sr0O+cZCIlEQvd/uVxO7ZxcLjcwMGBm+p3bw/uMmZmZ6iUHdu+7H7d322886Nj29fXpwcTExF41qIaHh/VpDg4OPvUjMz09rQcH8LGm02lvxuhurL+/Xzd8OCSXmuB1Rn/9IhO61Bza9ow97Y4nXbFzudyeXDRC29fGl5eXSTkDjDQzAAAAADAiM8B+UMqH95Wq7zyYtKBudeUs+YOaPabqIxwfH7cn6WKsHkS+sLBwFCMzDfI36iXhBDuk98rNmzcbD/PdD9UfvQeItDM6i8bHxzVmev/4aHI/mQ/5gPKnmKT01C81oeSo6ksNkZn9u2iELkq5XE7Jrul0Wp/REY2QA6Axg5Mlk8kE2xKjo6PVuddacvPmTa2p1J1cLrf7DIRQgtnQ0FA6ndbGdSu8+1uZTCZz/fp1/+fg4KBuAubm5vQgmUyOjIxYrRo+2pnFxUW//dJ7v3btWvAWOZfLzc3NVd9tTE5OXrx4Ue9Ldwlm5k ment is suitable to the client's financial situation and consistent with the client's written objectives,\nmandates, and constraints before making an investment recommendation or taking investment action.\nc. Judge the suitability of investments in the context of the client's total portfolio.\"\nCFA Members (including CFA charterholders) and Candidates are obligated to abide by and advocate for the Code of Ethics (ie, the Code) and the\nStandards of Professional Conduct (ie, the Standards), which provide guidance for appropriate ethical behavior. The Code includes general\nprinciples to which Members and Candidates must adhere. In contrast, the Standards address the principles' more specific applications, which\nmust be followed.\nStandard III(C) Suitability addresses the Members' and Candidates' responsibilities to assess the suitability of investments for each client. A\nMember or Candidate does this by researching each client's specific investment goals, constraints, and risk tolerance, which are compared to the\ncharacteristics of each proposed investment. Specifically, a Member or Candidate must determine suitability based on a client's written\nobjectives, mandates, and constraints before taking investment action.\n(Choice A) Investment suitability is based not only on the merits of a specific investment but also how that investment fits within a client's total\nportfolio.\n(Choice B) Low-fee investments are preferred if they are suitable and appropriate. However, the highest expected return may entail greater risk\n(ie, returns cannot be ensured) than a client is willing or able to bear and so may not be suitable for that client.\nThings to remember:\nStandard III(C) Suitability addresses the responsibility of Members and Candidates to assess the suitability of investments when in an advisory\nrelationship with a client. This is done by researching the client's specific investment goals, constraints, and risk tolerance, as well as the\ncharacteristics of each const CFG = {"title": "Wiley · Code Of Ethics And Standards Of Professional Conduct", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Ethical & Professional Standards · 9 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<!--qnote-feature-start-->
<style id="qnote-css">
  .qnote{margin-top:12px;border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:8px 10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{width:100%;resize:vertical;min-height:40px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
</style>
<script>
/* ===== Ghi chú cá nhân cho mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      if(card.querySelector(".qnote")) continue;
      var k = keyFor(card);
      if(k===null) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú của bạn</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.rows = 2;
      ta.setAttribute("placeholder","Viết ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      card.appendChild(wrap);
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
