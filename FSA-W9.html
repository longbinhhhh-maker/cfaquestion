<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "This fiscal year, a company: received in advance from a customer $60,000 for goods to be delivered next year. This amount is recognized as revenue for tax purposes this year but cannot be recognized as accounting revenue until next year. prepaid a vendor $12,000 for monthly office cleaning services that will begin next year. This amount cannot be recognized as an accounting expense until next year but is deductible for tax purposes this year. Based on only this information, if the company is subject to a 25% tax rate, then this year it most likely will experience a: ", "opts": ["$12,000 increase in deferred tax assets.", "$12,000 increase in deferred tax liabilities.", "$48,000 increase in deferred tax assets."], "ans": "A", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred tax assets (DTA) and liabilities (DTL) arise from temporary differences between income tax expense and taxes payable for a period.\nIncome tax expense is based on pretax income from the income statement and is reported for financial reporting (accounting) purposes. Taxes\npayable is based on taxable income on the tax return and is the actual amount owed to the government.\nIn this scenario, the company has greater taxes payable ($12,000) than income tax expense ($0) for the period. This temporary \"overpayment\"\nleads to a $12,000 increase in DTA, which is expected to reverse in a future period when the respective revenues and expenses are recognized\nfor accounting purposes (Choice B).\n(Choice C) A $48,000 increase in DTA results from incorrectly taking the difference between taxable income and pretax income.\nThings to remember:\nIncome tax expense is based on pretax income from the income statement and is reported for financial reporting (accounting) purposes. Taxes\npayable is based on taxable income on the tax return and is the actual amount owed to the government. Deferred tax assets occur when income\ntax expense is less than taxes payable, whereas deferred tax liabilities occur when income tax expense is greater than taxes payable.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 2, "q": "In 20X8, a security company received payment of £20,000 for services that it will not perform until 20X9. If the statutory tax rate increases from 25% to 30% in 20X9, the effect of this advance payment in 20X9 most likely causes an increase in:", "opts": ["tax expense of £1,000.", "taxes payable of £1,000.", "deferred tax assets of £1,000."], "ans": "C", "expl": "Deferred tax assets (DTA) arise when a company's taxable income temporarily exceeds its pretax income. The imbalance causes the company\nto pay more in taxes than it reports as tax expense on its income statement. This occurs when the company pays tax on cash it receives in the\ncurrent period but for which it will not earn and recognize as revenue until a future period.\nThe carrying value and tax base of an item are similar concepts. Carrying value refers to an item's value that the company reports in its financial\nreporting. The tax base is the value that the company uses for the same item when it calculates its tax obligations.\nThe company pays tax on the advance payment in 20X8, even though it does not recognize the cash as revenue in 20X8 since it has not\nperformed the agreed-upon services. It creates a liability (eg, deferred revenue) of £20,000 to account for the cash, and the liability's 20X8\ncarrying value is £20,000. The cash's 20X8 tax base equals zero since it was taxed when received in 20X8. This difference results in a DTA.\nA DTA is the difference between the item's carrying value and its tax base, multiplied by the tax rate: (20,000 − 0) × 25% = £5,000. When the\ntax rate increases to 30% in 20X9, the DTA also increases: (20,000 − 0) × 30% = £6,000, an increase of £1,000.\n(Choice A) The increase in DTA from £5,000 to £6,000 causes tax expense to decline, not increase, by £1,000.\n(Choice B) The company paid the tax on the customer advance in 20X8, so that has no impact on its tax obligations for 20X9.\nThings to remember:\nA deferred tax asset (DTA) arises when a company pays more taxes now than it will pay in the future due to differences between accounting\nstandards and tax laws. A deferred tax liability (DTL) arises when the company pays less tax now than it will in the future. When tax rates change,\ndeferred tax items are adjusted accordingly. Increases in tax rates cause increases in the value of both DTL and DTA. Decreases in tax rates\nhave the opposite effect.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 3, "q": "An appliance manufacturing company depreciates its noncurrent assets for financial reporting using straight-line depreciation, but the tax code permits the company to use accelerated depreciation for tax purposes. If this company acquired an asset this year that cost €3 million, has a three-year useful life, and has zero salvage value, the most likely impact on the company's financial statements at the end of this year will be that the tax base of the asset is: ", "opts": ["less than the carrying value.", "equal to the carrying value.", "greater than the carrying value."], "ans": "A", "expl": "The tax base of an asset is the total amount that the applicable tax laws allow a company to deduct for tax purposes over the asset's future life.\nThe carrying amount of the same asset is its book value for financial reporting. If a company uses different depreciation methods for financial\nreporting and tax reporting, in most cases the carrying amount and tax base will differ.\nHere, the company uses accelerated depreciation for tax purposes. This results in higher depreciation than straight-line depreciation (€1.5\nmillion vs. €1.0 million in Year 1 is assumed in this question), so the asset's ending value is lower for tax reporting. Note, however, that the\ndifference between the tax base and carrying value is temporary since it is caused by the timing difference in depreciation expense. Any\ndifferences will reverse over the asset's useful life.\n(Choice B) Using different depreciation methods causes a difference between an asset's carrying value and its tax base.\n(Choice C) This is correct only if the company used straight-line depreciation for tax purposes and accelerated depreciation for financial\npurposes.\nThings to remember:\nStraight-line depreciation and accelerated depreciation result in different depreciation expense. If the tax code permits accelerated depreciation\nfor tax purposes, the tax base of the asset is usually less than its financial statement carrying value at the beginning of the asset's useful life. At\nthe conclusion of its useful life, the asset's tax base and carrying value are identical.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 4, "q": "A company has a deferred tax asset (DTA) and a deferred tax liability (DTL). If tax rates fall during the next year, holding all else equal, it is most likely that the company's deferred tax:", "opts": ["asset will increase.", "liability will decrease.", "liability will remain constant."], "ans": "B", "expl": "Deferred tax liabilities (DTLs) arise when a company's pretax income temporarily exceeds its taxable income. For example, when a company\nuses accelerated depreciation for taxes and straight-line depreciation for financial reporting in the early years of the life of the deferred tax asset\n(DTA), taxable income is lower than pretax income due to the higher depreciation expense. The difference between pretax income and taxable\nincome is temporary and reverses as the asset is fully depreciated.\nA DTL represents future taxes. When the statutory tax rate decreases, the DTL decreases since the delayed taxable event will now be taxed at\nthe lower rate and the company will owe less tax in the future (Choice C).\n(Choice A) The DTA will also decrease if tax rates decrease, since it becomes less valuable as an offset for future taxes when those taxes are\nless.\nThings to remember:\nDeferred tax liabilities (DTL) arise when a company's pretax income temporarily exceeds its taxable income. The difference causes the company\nto pay less in taxes than it reports as tax expense on its income statement. When statutory tax rates decrease, both the DTL and the deferred tax\nasset will also decrease.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 5, "q": "A company purchases a service on credit for TRY 10,000 in 20X8. The company recognizes the expense on its income statement that year but will not pay cash until 20X9. Tax laws require that the company recognize the expense when cash is paid. If the company's tax rate is 30%, in 20X8 the company would most appropriately record a:", "opts": ["deferred tax asset of TRY 3,000.", "deferred tax asset of TRY 7,000.", "deferred tax liability of TRY 3,000."], "ans": "A", "expl": "Deferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) arise when a company records a tax expense for financial reporting purposes (ie,\nincome tax expense different from the amount it owes in taxes (ie, taxes payable) for that period, and the difference is expected to reverse. A\ncompany incurs a DTA when its taxes payable are greater than its income tax expense.\nIn this scenario, the company recognizes an expense of TRY 10,000 on its income statement in 20X8. However, the company will not pay cash\nfor the expense nor record it on the tax return until 20X9. In 20X8, the company's:\npretax profit will be 10,000 less than its taxable income, and its\nincome tax expense will be 3,000 (10,000 × 30%) less than its taxes payable.\nSince these differences will reverse in 20X9 when the company pays cash for the expense, a DTA of TRY 3,000 is created in 20X8.\nAssuming the company had revenue of TRY 15,000, the accounting difference would be as follows:\n(Choice B) A DTA of 7,000 is the difference between the portions of the expense that affect net income and taxable income, not the difference\nbetween tax expense and taxes payable.\n(Choice C) A DTL of 3,000 is calculated by incorrectly reversing the tax expense and taxes payable.\nThings to remember:\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) arise when a company records an income tax expense different from its taxes\npayable, and that difference is expected to reverse. A DTA is incurred if the company's taxes payable are greater than its tax expense.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 6, "q": "A French catering firm prepares and supplies in-flight meals and snacks to airlines at various airports in Europe and reports its financial results under IFRS. Its tax rate is 25%. On January 1, 20X8, the firm incurred €800,000 in research costs to improve the efficiency of its operations. It expensed the entire amount on its income statement but recorded it as an asset for tax purposes. It will amortize this amount equally over four years. Which of the following is the most likely impact of the research costs on the firm's 20X8 financial results?", "opts": ["The research costs' carrying value equals €600,000.", "The firm's taxable income is less than its pretax income.", "The firm reports a deferred tax asset (DTA) of €150,000."], "ans": "C", "expl": "An asset's tax base is the amount that a company can deduct for tax purposes during the asset's useful life. Carrying value refers to the asset's\nbalance sheet book value. Differences between tax base and carrying value cause the company's taxable income to differ from its pretax\nincome.\nThese differences mean that the company's taxes payable and tax expense are not the same. When these differences are temporary (ie, they\nwill reverse in the future), the company creates deferred tax assets (DTA) and deferred tax liabilities (DTL).\nIf a company expenses an item completely, then it has zero carrying value (Choice A) since there is no asset to record. The firm treated the entire\n€800,000 research costs as an expense on its income statement. However, the tax code permitted the firm to capitalize the research and\ndevelopment expense, so that expense is an asset for tax purposes. The costs have an initial tax base of €800,000; the 20X8 amortization of\n€200,000 reduces the tax base to €600,000 at the end of 20X8.\nThe carrying value (€0) minus the tax base (€600,000) is less than zero. This means that at the end of 20X8, the firm creates a DTA equal to\n(€600,000 − 0) × 25% = €150,000.\n(Choice B) The firm's expenses for tax purposes (€200,000) are less than the expenses it reports on its income statement (€800,000). This\nmeans that its taxable income is greater (by €600,000) than its reported pretax income.\nThings to remember:\nWhen the tax base and carrying value of an item differ, a deferred tax item is created to reconcile the difference between taxes payable and tax\nexpense. If the underlying item causing the deferred tax item is a balance sheet asset and the item's carrying value is less than the tax base, then\nthe deferred item is a deferred tax asset.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 7, "q": "An increase in the statutory tax rate will most likely:", "opts": ["increase both deferred tax assets and deferred tax liabilities.", "increase deferred tax assets and decrease deferred tax liabilities.", "decrease deferred tax assets and increase deferred tax liabilities."], "ans": "A", "expl": "Deferred tax items (ie, deferred tax assets and liabilities) arise from the difference between income tax expense (for accounting purposes) and\ntaxes payable (for tax reporting) for a period. Differences can occur as tax expense is calculated according to accounting standards and taxes\npayable are calculated according to the tax code.\nDeferred tax assets (DTA) arise when taxable profit is greater than accounting profit and taxes payable are greater than tax expense.\nDeferred tax liabilities (DTL) arise when taxable profit is less than accounting profits and taxes payable are less than tax expense.\nAs illustrated above, at any given tax rate, deferred tax items can be calculated as the absolute difference between taxable profit and accounting\nprofit, multiplied by the tax rate. Therefore, the sizes of DTA and DTL are directly related to the tax rate. As the tax rate increases, the value of\ndeferred tax items also increase (Choices B and C).\nThings to remember:\nDeferred tax items can be calculated by multiplying the absolute difference between taxable profit and accounting profit by the applicable tax rate.\nTherefore, the sizes of deferred tax assets and deferred tax liabilities are directly related to the tax rate. As the tax rate increases, the value of\ndeferred tax items also increases.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 8, "q": "A deferred tax asset most likely results when:", "opts": ["taxable income is less than pretax income.", "income tax expense is less than taxes payable.", "income tax expense is greater than taxes payable."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred tax assets and liabilities result from differences between income tax expense and taxes payable. Income tax expense is based on\npretax income from the income statement and is shown for financial reporting (accounting) purposes. Taxes payable is based on taxable\nincome on the tax return and is the actual amount owed to the government for tax purposes.\nDifferences in revenues (eg, customer advances) and expenses (eg, depreciation) that are recognized for accounting purposes but not tax\npurposes can cause pretax income to differ from taxable income. These differences require companies to create tax assets or liabilities to\nreconcile the differences.\nWhen income tax expense (on the income statement) is less than taxes payable (amount due to government), the company overpays taxes for\nthe current year, thereby producing a deferred tax asset equal to the excess amount. This deferred tax asset provides a future benefit since the\ntemporary overpayment is expected to be recovered in the future.\n(Choice A) When taxable income is less than pretax income, it results in a deferred tax liability. The liability signals that the company expects to\npay higher taxes in the future.\n(Choice C) A deferred tax liability occurs when income tax expense is more than taxes payable. This means that the company underpays taxes\nfor the current year, thereby producing a deferred tax liability.\nThings to remember:\nA deferred tax asset is created when income tax expense on the income statement is less than taxes payable on the tax return. A deferred tax\nasset provides a future benefit since the temporary overpayment is expected to be recovered in the future.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 9, "q": "In 20X5, a company reports different asset amounts for accounting purposes and tax purposes: The company reports investment securities at fair value at €200,000 on the balance sheet. For tax purposes, the investments are valued at the original cost of €190,000. The company capitalizes €1 million in software development costs. For accounting purposes, 20% of the costs are amortized in 20X5. For tax purposes, 25% of the costs are amortized in 20X5. The company reports net accounts receivable (AR) of €480,000 after subtracting €20,000 in allowance for doubtful accounts. For tax purposes, the allowance for doubtful accounts is determined to be 10% of gross AR. The statutory tax rate is 30%. Based on this information, in 20X5 the carrying amount for assets exceeds the tax base by:", "opts": ["€27,000", "€90,000", "€108,000"], "ans": "B", "expl": "An asset's carrying amount reflects the reported book value on the balance sheet (per accounting standards). An asset's tax base reflects the\nvalue that remains as a deductible expense (per the tax code) over the asset's useful life. Differences between accounting standards and tax\ncodes may cause carrying amounts and tax bases to differ, which may lead to deferred tax assets and deferred tax liabilities.\nIn this scenario, calculate each asset's amount and tax base to determine the total difference in 20X5:\nInvestment securities are valued at €200,000 for accounting purposes and €190,000 for tax purposes.\nFor the €1 million of capitalized software development costs, 20% is amortized for accounting purposes, so the carrying amount is €800,000\n[(1 − 0.2) × 1 million]. In comparison, 25% is amortized for tax purposes, so the tax base is €750,000 [(1 − 0.25) × 1 million].\nFor (net) accounts receivable (AR), €480,000 is recorded on the balance sheet based on an accounting estimate of €20,000 for allowance\nfor doubtful accounts. Therefore, the gross AR must be €500,000. For tax purposes, the allowance for doubtful accounts is calculated as\n10% of €500,000 in gross AR, or €50,000. Therefore, the tax base for net AR is €450,000 (500,000 − 50,000).\nIn aggregate, the carrying amount of assets is €90,000 more than the tax base.\n(Choice A) €27,000 is the deferred tax liability, which is the product of €90,000 and the 30% tax rate.\n(Choice C) €108,000 results from misapplying the 10% to the carrying amount of net AR (€480,000), when it should be applied to the gross AR\namount of €500,000.\nThings to remember:\nAn asset's carrying amount reflects its book value on the balance sheet (per accounting standards). An asset's tax base reflects the value that\nremains tax deductible over the asset's useful life. Differences between accounting rules and tax rules often cause carrying amounts and tax\nbases to differ.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate\n10. Which of the following items is most likely to result in the creation of a deferred tax item?\nA. Interest received on city and state government bonds\n\nB. Compensation paid in the future with shares of company stock\nC. Fines paid to a government agency to settle violations of security laws\nExplanation\nDeferred tax assets (DTA) and deferred tax liabilities (DTL) arise from temporary differences between pretax income and taxable income.\nCompensation in stock is a deductible expense, and for financial reporting, the company deducts the market value of the shares in the period that\nit accrues the expense. The company will deduct the value of the shares for tax purposes in the future period when it delivers the shares.\nThe lack of tax deductibility in the current period means that the company pays more taxes than it reports as tax expenses. This is a temporary\ndifference since the company will pay less tax in the period of delivery than it pays in the current period. To account for the difference, the\ncompany creates a DTA. This advises investors and analysts that the discrepancy between what the company pays in tax currently and what it\nreports as tax expense will reverse in a future period.\nWhen the discrepancy is permanent (ie, will never reverse), no deferred tax item is created. The chart below shows items that lead to\npermanent differences:\nMajor areas resulting in permanent differences between pretax and taxable income\nItem Impact Reason\nInterest on state and local Pretax income > taxable\nInterest is tax-free\ngovernment bonds income\nFines and penalties Fines are tax-deductible\nTaxable income > pretax\nCertain entertainment expenses Not all are fully tax-deductible\nincome\nCertain benefits for senior Some benefits, such as company-paid premiums on life insurance,\nmanagement are not tax-deductible\nCompanies include interest on municipal (state and local) bonds as revenue for financial reporting, but municipal bond interest is never taxable to\nthe recipient (Choice A). Similarly, fines imposed by a government agency are deducted as an operating expense for financial reporting, but fines\ncannot be deducted when calculating taxable income (Choice C).\nThings to remember:\nCompensation paid in company stock is tax-deductible in the period of delivery. If that period is later than the period that it accrues the expense, it\ncreates a deferred tax asset to account for the difference between its tax expense and taxes payable. Only temporary differences give rise to\ndeferred tax assets and liabilities.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 10, "q": "Which of the following items is most likely to result in the creation of a deferred tax item?", "opts": ["Interest received on city and state government bonds", "Compensation paid in the future with shares of company stock", "Fines paid to a government agency to settle violations of security laws"], "ans": "B", "expl": "Deferred tax assets (DTA) and deferred tax liabilities (DTL) arise from temporary differences between pretax income and taxable income.\nCompensation in stock is a deductible expense, and for financial reporting, the company deducts the market value of the shares in the period that\nit accrues the expense. The company will deduct the value of the shares for tax purposes in the future period when it delivers the shares.\nThe lack of tax deductibility in the current period means that the company pays more taxes than it reports as tax expenses. This is a temporary\ndifference since the company will pay less tax in the period of delivery than it pays in the current period. To account for the difference, the\ncompany creates a DTA. This advises investors and analysts that the discrepancy between what the company pays in tax currently and what it\nreports as tax expense will reverse in a future period.\nWhen the discrepancy is permanent (ie, will never reverse), no deferred tax item is created. The chart below shows items that lead to\npermanent differences:\nMajor areas resulting in permanent differences between pretax and taxable income\nItem Impact Reason\nInterest on state and local Pretax income > taxable\nInterest is tax-free\ngovernment bonds income\nFines and penalties Fines are tax-deductible\nTaxable income > pretax\nCertain entertainment expenses Not all are fully tax-deductible\nincome\nCertain benefits for senior Some benefits, such as company-paid premiums on life insurance,\nmanagement are not tax-deductible\nCompanies include interest on municipal (state and local) bonds as revenue for financial reporting, but municipal bond interest is never taxable to\nthe recipient (Choice A). Similarly, fines imposed by a government agency are deducted as an operating expense for financial reporting, but fines\ncannot be deducted when calculating taxable income (Choice C).\nThings to remember:\nCompensation paid in company stock is tax-deductible in the period of delivery. If that period is later than the period that it accrues the expense, it\ncreates a deferred tax asset to account for the difference between its tax expense and taxes payable. Only temporary differences give rise to\ndeferred tax assets and liabilities.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 11, "q": "A company has a tax rate of 25% and reports an income tax expense of CAD 100 million and taxes payable of CAD 75 million for the current year. If this difference is due solely to using different depreciation methods for financial reporting and tax purposes, the company most likely has a:", "opts": ["CAD 25 million deferred tax asset.", "CAD 25 million deferred tax liability.", "CAD 18.75 million deferred tax liability."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred tax assets and liabilities arise from the difference between income tax expense and taxes payable for a period. Income tax expense is\nbased on pretax income from the income statement and is shown for financial reporting (accounting) purposes. Taxes payable is based on\ntaxable income on the tax return and is the actual amount owed to the government.\nA deferred tax liability occurs when income tax expense is more than taxes payable. This means that the company pays less taxes for the current\nyear than what it reports as income tax expense (on the income statement), thereby generating a liability.\nIn this case, a temporary difference in depreciation for the current year caused income tax expense (CAD 100 million) to be more than income tax\npayable (CAD 75 million), resulting in a CAD 25 million deferred tax liability.\n(Choice A) A deferred tax asset is created when income tax expense is less than taxes payable, not more.\n(Choice C) CAD 18.75 million results from incorrectly multiplying the deferred tax liability by (1 − tax rate).\nThings to remember:\nDeferred tax liabilities occur when income tax expense is more than taxes payable. This means that the company underpays taxes for the current\nyear, thereby producing a deferred tax liability that is likely to be paid in the future. Differences in depreciation methods used for accounting\nversus tax purposes frequently lead to deferred tax liabilities.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 12, "q": "A mining company reports financial results under IFRS. It reports the following information for 20X8 and 20X9: (ZAR thousands) 20X9 20X8 Deferred tax assets 15 18 Deferred tax liabilities 21 14 Taxes payable 35 29 Based on this information, the income tax expense that this company reports in 20X9 is closest to:", "opts": ["ZAR 25,000", "ZAR 41,000", "ZAR 45,000"], "ans": "C", "expl": "Tax expense and taxes payable both relate to a company's income taxes for the year. The table below shows the relationship:\nTax expense and taxes payable differ for two primary reasons: whether the company has recorded deferred tax assets (DTA) and/or deferred tax\nliabilities (DTL), and the changes in those deferred items from the previous year. DTL arise when a company reports lower revenues or higher\nexpenses for tax purposes than for financial accounting. DTA arise in the reverse situation.\nDTL signal that the company will owe more taxes in the future than it paid this period. DTA signal the opposite. The company's DTL increased by\nZAR 7,000 from 20X8 to 20X9, indicating that the company owes an additional ZAR 7,000 in the future. However, the company's decrease in\nDTA also increases its future tax obligations, so the change in DTA is added to the 20X9 taxes payable (subtracting a negative number adds it to\nthe total).\nThe net change in the company's deferred tax items is ZAR 7,000 − (− ZAR 3,000), or an increase of ZAR 10,000. Adding this amount to the\ncompany's taxes payable (ZAR 35,000) results in tax expense of ZAR 45,000.\n(Choice A) This subtracts the net change from taxes payable instead of adding it.\n(Choice B) This uses the net ending balance of deferred tax items instead of the net change in those items.\nThings to remember:\nThe difference in the change (ie, the ending balance minus the beginning balance) in DTL minus the change in DTA is added to taxes payable\nwhen calculating the income statement tax expense.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 13, "q": "A company recognizes all anticipated payments from an installment sale as revenue in the current period for accounting purposes. The tax code only taxes payments that the company receives. In the current period, for the installment sale revenue, the company most appropriately records:", "opts": ["a deferred tax asset.", "a deferred tax liability.", "neither a deferred tax asset nor a deferred tax liability."], "ans": "B", "expl": "A deferred tax liability (DTL) is created when a company owes less in taxes (ie, taxes payable) for a given period than it reports as tax expense on\nits income statement for the same period. Often, these differences arise when the tax code and accounting standards disagree on how and when\ncompanies should recognize revenues and expenses. A DTL is temporary; in future periods, total tax expense and total taxes payable will be\nequal.\nA common DTL example involves installment sales. Under accrual accounting (other than for long-term construction contracts), a company\nrecognizes revenues when earned, even if payments extend over several years. Tax laws often impose tax only on payments received, so\nannual tax expense exceeds taxes payable. The DTL signals investors that the company will owe more taxes as it receives future payments from\nthe sale.\n(Choice A) A deferred tax asset is created when the amount of taxes payable is greater than the tax expense that the company reports on its\nincome statement.\n(Choice C) When the amount of taxes payable differs from tax expense, the company creates a deferred tax item (either an asset or a liability) on\nits balance sheet.\nThings to remember:\nDifferences in tax reporting that cause accounting income to exceed taxable income result in the creation of a deferred tax liability.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 14, "q": "In the third quarter of this year, a company that reports under US GAAP prepays a vendor $25,000 for software subscription services that will not begin until next year. The company will not recognize any expense for financial reporting purposes until the software service starts. However, the tax laws allow the company to deduct the full amount this year on their tax return. If the company's tax rate is 20%, the gross impact of this transaction in this year is most likely a $5,000 increase to:", "opts": ["deferred tax assets.", "valuation allowances.", "deferred tax liabilities."], "ans": "C", "expl": "Deferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) arise from differences between income tax expense and taxes payable for a period.\nIncome tax expense is based on pretax income shown on the income statement for financial reporting (ie, accounting) purposes. Taxes payable\nare based on taxable income according to the tax code and reported on the tax return as the actual amount owed to the government.\nA DTL is incurred when income tax expense is greater than taxes payable, so the company pays less in taxes for the current year than it reports\nas income tax expense. This temporary \"underpayment\" generates a DTL that is expected to reverse later.\nIn this question, assume revenue this year is $100,000. The $25,000 paid to the vendor (ie, prepaid expense) is recognized for tax purposes as a\ncash expense this year. However, for accounting purposes, the expense will not be reported until next year. This temporarily causes pretax\nincome to be $25,000 more than taxable income, which creates a DTL of $5,000.\n(Choice A) A DTA is created when tax expense is less than tax payable.\n(Choice B) A valuation allowance account is a contra account to DTAs. It is recorded when certain amounts of DTAs are unlikely to be recovered\nin the future.\nThings to remember:\nA deferred liability is incurred when income tax expense is more than taxes payable, so that the company pays less for taxes for the current year\nthan it reports as income tax expense (on the income statement). This temporary \"underpayment\" generates a deferred tax liability now that is\nexpected to reverse later.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 15, "q": "Which of the following most likely indicates use of a deferred tax liability?", "opts": ["An equity's carrying value is less than its tax base.", "An asset's carrying value is greater than its tax base.", "A liability's carrying value is greater than its tax base."], "ans": "B", "expl": "Tax laws allow companies to use different methods to report balance sheet items (eg, assets or liabilities) for tax purposes and financial reporting.\nDifferent reporting methods create temporary differences between an item's carrying value and its tax base. The tax base is the value of the asset\nfor tax purposes. For financial reporting purposes, carrying value is the same as the asset's net book value.\nWhen an asset's carrying value exceeds its tax base, it indicates that reporting differences have resulted in a deferred tax liability (DTL). For\nexample, if a company chooses to depreciate assets more rapidly for tax purposes than for financial reporting, then for tax reporting:\ndepreciation expense is higher,\ntaxable income is lower,\ntax expense is lower,\ntaxes payable is lower, and\ntax base is lower than carrying value.\nDTL is temporary since under either method an asset's net cost fully depreciates over time. Due to the difference in depreciation methods, the\ncompany pays less now but owes future taxes; this debt is recorded as a DTL.\n(Choices A) Changes in equity valuation have no impact on deferred tax assets or liabilities.\n(Choices C) If a liability's carrying value is less than its tax base, it indicates use of a DTL.\nThings to remember:\nTax laws allow companies to use different methods to report balance sheet items for tax purposes and financial reporting. Different reporting\nmethods create temporary differences between an item's carrying value and its tax base. When an asset's carrying value exceeds its tax base, it\nindicates use of a deferred tax liability.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 16, "q": "A company has available-for-sale securities on its balance sheet. If the market value of those securities increases by $100,000, the company will most appropriately record:", "opts": ["a deferred tax asset.", "a deferred tax liability.", "neither a deferred tax liability nor a deferred tax asset."], "ans": "C", "expl": "Both IFRS and GAAP require companies to hold available-for-sale securities at their market values. Unrealized gains or losses from changes in\nmarket value are not included when calculating net income. Instead, they are carried in shareholders' equity as a component of other\ncomprehensive income (OCI). Any tax implications from accumulated gains or losses are deferred until the company sells the securities.\nIn this case, the company discloses the deferred tax impact in the footnotes to its entries for OCI. When it sells the securities, any realized gain or\nloss is removed from OCI and included with retained earnings:\n(Choices A and B) Deferred tax assets and liabilities arise only when the company's taxable income differs from its pretax income. Unrealized\ngains or losses from available-for-sale securities are not recognized either for financial accounting or for tax purposes. Pretax income and taxable\nincome are the same, so no deferred tax item is created.\nThings to remember:\nDeferred tax assets or liabilities are created when the accounting standards cause temporary differences between accounting income and taxable\nincome. Items that bypass the income statement and are taken directly to equity have no impact on either accounting or taxable income and do\nnot require a deferred tax item to be created.\nAnalyze disclosures relating to deferred tax items and the effective tax rate reconciliation and explain how information included in these\ndisclosures affects a company’s financial statements and financial ratios", "qhtml": null}, {"n": 17, "q": "On the last day of this fiscal year, a company receives cash from a customer for a service that it will not provide until the next fiscal year. The company does not recognize any revenue until the service is delivered, but the applicable tax code recognizes revenue when the cash is received. If this transaction creates the only difference between the company's accounting profit and its taxable income, then for this year it will most likely increase the company's:", "opts": ["tax base.", "deferred tax assets.", "deferred tax liabilities."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nA deferred tax asset is created when income tax expense is less than taxes payable. This means that the company pays more taxes for the\ncurrent year (as shown on its tax return) than it reports as income tax expense (on its income statement). This temporary overpayment generates\na future tax benefit (ie, deferred tax asset) since this difference is expected to reverse.\nFor example, if the company receives $50,000 in cash before delivering services and the company's tax rate is 20%, then the result is as follows:\nSince the cash received from the customer (ie, unearned revenue) is recognized as revenue for tax purposes but not for accounting purposes,\ntaxable income is greater than pretax income (ie, accounting profit) and taxes payable is greater than tax expense, which generates a deferred tax\nasset.\n(Choice A) Tax base refers to the value of an asset or liability for tax purposes.\n(Choice C) A deferred tax liability is created when deferred tax expense is more than taxes payable.\nThings to remember:\nA deferred tax asset is created when income tax expense is less than taxes payable. This occurs when the company pays more taxes for the\ncurrent year (as shown on its tax return) than it reports as income tax expense (on its income statement). This temporary overpayment generates\na future tax benefit (ie, deferred tax asset) since this difference is expected to reverse.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 18, "q": "When a deferred tax liability is no longer expected to reverse, which of the following is the most appropriate financial adjustment? The company should:", "opts": ["increase total assets.", "decrease taxable income.", "increase shareholders' equity."], "ans": "C", "expl": "A deferred tax liability (DTL) is created when income tax expense (for financial reporting) temporarily exceeds taxes payable (for tax reporting) in a\nreporting period. This means that the company pays less taxes in the current period than it reports on its income statement. Therefore, this\ntemporary \"underpayment\" generates a DTL that is expected to reverse in a future period.\nFor example, a company may generate a DTL by\nreporting unrealized gains from holding certain securities on the income statement, but\ndelaying recognition of gains for tax purposes until the securities are sold in a future period.\nWhen the securities are sold in the future, the company will report the realized gain as taxable income and reverse the liability.\nSometimes a DTL is no longer expected to reverse in the future. For example, the company may decide to not sell the security and instead own\nit indefinitely. When this happens, the company should write off the DTL and increase shareholders' equity by the same amount.\n(Choice A) There is no change in total assets. Total assets equal liabilities plus equity. In this scenario, the decrease in the DTL is fully offset by\nthe increase in shareholders' equity.\n(Choice B) Taxable income is determined by taxable revenues and allowed expenses. It is not determined by changes to DTL.\nThings to remember:\nWhen a deferred tax liability (DTL) is no longer expected to reverse, the appropriate financial adjustment is to write off the DTL and increase\nshareholders' equity.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 19, "q": "Three companies present the disclosure requirements for income taxes in the notes of their financial statements: Which company most likely has the lowest effective tax rate?", "opts": ["Company A", "Company B", "Company C"], "ans": "C", "expl": "Total income tax expense is the sum of the current taxes and the net deferred taxes. Current taxes refers to taxes payable in the current\nperiod. Deferred tax assets or liabilities arise from differences between tax reporting and financial reporting. The effective tax rate is the\npercentage calculated when income tax expense is divided by pretax income:\nTotal pretax income is earnings before tax for both domestic and foreign operations. Adding total current income taxes to the change in total\ndeferred taxes results in a company's total income tax expense on both domestic and foreign income. In this scenario, Company C's effective tax\nrate is the lowest at 23.4%:\n20.Tax loss carryforwards are best described as losses in the current year that:\nA. create a deferred tax liability.\n\nB. reduce future taxable income.\nC. lower prior-year tax obligations.\nExplanation\nDeferred tax assets (DTAs) and liabilities (DTLs) are created to help reconcile temporary differences between tax expense and taxes payable.\nDifferences can occur because:\ntax expense is derived from net income based on accounting standards, whereas\ntaxes payable is derived from taxable income based on the tax code.\nA DTA is created when a company reports higher revenues or lower expenses for tax purposes than it reports on its financial statements. When\nthis happens, taxes payable are greater than tax expenses for the period (ie, the company pays more tax earlier and less later). A DTL occurs in\nthe reverse situation.\nTax loss carryforwards, a type of DTA, occur when the absolute value of accounting losses is greater than the current year's taxable income.\nSubject to local tax laws, accounting losses offset taxable income. Since the tax benefit (lowering taxable income and, thus, taxes payable) from\nlosses is allowed only to the extent of the current year's taxable income, losses exceeding that amount are carried forward to offset future taxable\nincome. This excess portion of the loss, which will provide a future tax benefit, is a DTA since the company may reduce taxes payable in the\nfuture.\n(Choice A) Carryforwards create DTAs, not DTLs, since the company gets the benefit of lower taxes in the future.\n(Choice C) Carryforwards create DTAs that can offset future, not past, tax obligations.\nThings to remember:\nTax loss carryforwards create a deferred tax asset when losses exceed the current year's taxable income, and the excess losses are carried\nforward to offset future taxable income.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 20, "q": "Tax loss carryforwards are best described as losses in the current year that:", "opts": ["create a deferred tax liability.", "reduce future taxable income.", "lower prior-year tax obligations."], "ans": "B", "expl": "Deferred tax assets (DTAs) and liabilities (DTLs) are created to help reconcile temporary differences between tax expense and taxes payable.\nDifferences can occur because:\ntax expense is derived from net income based on accounting standards, whereas\ntaxes payable is derived from taxable income based on the tax code.\nA DTA is created when a company reports higher revenues or lower expenses for tax purposes than it reports on its financial statements. When\nthis happens, taxes payable are greater than tax expenses for the period (ie, the company pays more tax earlier and less later). A DTL occurs in\nthe reverse situation.\nTax loss carryforwards, a type of DTA, occur when the absolute value of accounting losses is greater than the current year's taxable income.\nSubject to local tax laws, accounting losses offset taxable income. Since the tax benefit (lowering taxable income and, thus, taxes payable) from\nlosses is allowed only to the extent of the current year's taxable income, losses exceeding that amount are carried forward to offset future taxable\nincome. This excess portion of the loss, which will provide a future tax benefit, is a DTA since the company may reduce taxes payable in the\nfuture.\n(Choice A) Carryforwards create DTAs, not DTLs, since the company gets the benefit of lower taxes in the future.\n(Choice C) Carryforwards create DTAs that can offset future, not past, tax obligations.\nThings to remember:\nTax loss carryforwards create a deferred tax asset when losses exceed the current year's taxable income, and the excess losses are carried\nforward to offset future taxable income.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 21, "q": "An analyst collects the following information (in € millions) on a company: Income tax expense 500 Deferred tax assets (DTAs) 40 Deferred tax liabilities (DTLs) 80 Prior year DTA 50 Prior year DTL 60 Based on only this data, the company's income taxes payable (in € millions) is closest to: ", "opts": ["470", "490", "510"], "ans": "A", "expl": "Deferred tax assets (DTAs) and liabilities (DTLs) reflect temporary differences between income tax expense and taxes payable, created by\ndifferences between accounting standards and tax laws. Income tax expense is reported on the income statement according to accounting\nstandards, whereas taxes payable is the actual amount owed to the government based on applicable tax laws.\nWhen tax expense is less than taxes payable, DTA is created since the company:\npays more in taxes in the current period and\nwill owe less in taxes in the future.\nWhen tax expense is greater than taxes payable, DTL is created since the company:\npays less in taxes in the current period and\nwill owe more in taxes in the future.\nThe equation above shows how changes in DTL and DTA are related to tax expense and taxes payable. To calculate taxes payable, substitute\nvalues for all the other variables.\n(Choice B) 490 results from reversing the sign when treating the change in DTA.\n(Choice C) 510 results from reversing the sign when treating the change in DTL.\nThings to remember:\nDeferred tax assets (DTAs) and liabilities (DTLs) reflect temporary differences between income tax expense and taxes payable for a period. Tax\nexpense = Taxes payable + ΔDTL − ΔDTA.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 22, "q": "An analyst gathers the following information about a company that reports under US GAAP: (USD thousands) Year 2 Year 1 Net deferred tax assets 6,400 7,600 Accounting profit 2,300 2,100 Taxable income 3,300 1,900 In Year 2, the decrease in net deferred tax assets most likely results from an increase in:", "opts": ["statutory tax rates.", "valuation allowance.", "deferred tax liabilities."], "ans": "B", "expl": "Deferred tax assets (DTA) and liabilities (DTL) result from temporary differences between taxable income (based on tax reporting) and\naccounting profit (based on financial reporting).\nDTA are created when companies pay higher current taxes since taxable income is greater than accounting profit. This creates future tax\nbenefits, as in this scenario.\nDTL are created when companies pay lower current taxes since taxable income is less than accounting profit. This creates future tax\nliabilities.\nThe carrying amount of DTA represents the recoverable tax benefit, so if a company does not expect to generate enough taxable income to fully\nrecover the DTA, it must reduce the carrying amount. In that case, under US GAAP a company would create or increase a valuation allowance,\nwhich is a contra account that decreases DTA. Under IFRS, the company reduces DTA directly and does not use a valuation allowance.\nDTL and DTA (net of the valuation allowance) are combined and presented as net DTA (DTL) on the balance sheet. Therefore, an increase in the\nvaluation allowance would result in a decrease in the net DTA reported.\n(Choice A) An increase in statutory tax rates would increase net DTA.\n(Choice C) Since taxable income exceeds accounting profit in Year 2, there is an increase in DTA, not DTL.\nThings to remember:\nDeferred tax assets (DTA) are created when companies pay higher current taxes due to temporary differences, creating future tax benefits. If a\ncompany does not expect to generate enough future taxable income to fully recover the carrying amount of the DTA, it must be decreased. Under\nUS GAAP, the company adjusts the carrying value using a valuation allowance.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 23, "q": "The value of deferred tax liabilities is most likely based on tax rates:", "opts": ["as of the balance sheet date.", "averaged over the current fiscal year.", "expected to apply when the liability is satisfied."], "ans": "C", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred taxes account for temporary differences between income tax expense and taxes payable. Such differences occur due to differences\nbetween tax reporting and financial reporting. A deferred tax liability (DTL) is created when a company pays less tax (tax reporting) than it reports\non its income statement (financial reporting); the DTL represents future taxes payable.\nWhile current taxes payable are based on the tax rates that apply on the balance sheet date, a DTL is measured by tax rates that are expected\nto be in place at the time of the liability's settlement. If expected rates are higher or lower than existing rates, that will be reflected in the value of\nthe DTL. This provides a more realistic measure of value since it is based on future rates, not historical ones (eg, balance sheet date, average\nover the fiscal year) (Choices A and B).\nThings to remember:\nA deferred tax liability (DTL) is created when a company pays less tax (tax reporting) than it reports on its income statement (financial reporting);\nthe DTL represents future taxes payable. While current taxes payable are based on the tax rates that apply on the balance sheet date, a DTL is\nmeasured by tax rates that are expected to be in place at the time of the liability's settlement (ie, estimated future tax rates). This provides a more\nrealistic measure of value for the DTL.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 24, "q": "In 2X10, a company reports income tax expense of ¥230 million and taxes payable of ¥223 million. If deferred tax assets increases by ¥3 million, then deferred tax liabilities would most likely:", "opts": ["increase by ¥4 million.", "increase by ¥10 million.", "decrease by ¥10 million."], "ans": "B", "expl": "Deferred tax assets (DTAs) and deferred tax liabilities (DTLs) reflect temporary differences between income tax expense and taxes payable for\na period. Such differences are created by differences between accounting standards and tax laws. Income tax expense is reported on the income\nstatement according to accounting standards, whereas taxes payable is the actual amount owed to the government (based on applicable tax\nlaws).\nWhen tax expense is greater than taxes payable, a DTL is created since the company pays less in taxes in the current period but will owe\nmore in taxes in the future.\nWhen tax expense is less than taxes payable, a DTA is created since the company pays more in taxes in the current period and will owe\nless in taxes in the future.\nThe equation above shows how the changes in DTL and DTA are related to tax expense and taxes payable. To calculate the change in DTL in this\nscenario, substitute values for all the other variables.\n(Choice A) A ¥4 million increase results from placing the incorrect sign in front of ΔDTA.\n(Choice C) A ¥10 million decrease results from placing the incorrect sign in front of ΔDTL.\nThings to remember:\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) reflect temporary differences between income tax expense and taxes payable for a\nperiod. Such differences are created by differences between accounting standards and tax laws. Tax expense equals taxes payable plus\nchanges to DTL less changes to DTA.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 25, "q": "This year, a pharmaceutical company: capitalizes €20 million in drug development costs at the beginning of the year. For accounting purposes, 25% of the cost is amortized this year. For tax purposes, 30% of the cost is amortized this year. spends €5 million on research over the year. The entire amount is expensed for accounting purposes. For tax purposes, the full amount is amortized at 20% annually, starting this year. The statutory tax rate is 30%. Based on only this information, this year the company will most likely report a:", "opts": ["deferred tax asset of €3 million.", "deferred tax asset of €0.9 million.", "deferred tax liability of €0.9 million."], "ans": "B", "expl": "An asset's carrying amount reflects its book value on the balance sheet for accounting purposes. An asset's tax base reflects the value that is\ndeductible for tax purposes over the asset's useful life. Differences between accounting rules and tax rules can cause carrying amounts to differ\nfrom tax bases. These temporary differences are reflected in deferred tax assets and deferred tax liabilities.\nIn this scenario, calculate each asset's carrying amount and tax base :\nFor the €20 million of capitalized development costs, 25% is amortized for accounting purposes, so the carrying amount is €15 million [(1 −\n0.25) × €20 million]. In comparison, 30% is amortized for tax purposes, so the tax base is €14 million [1 − 0.3) × €20 million].\nFor the €5 million of research costs, the full amount is expensed on the income statement for accounting purposes, so the carrying amount\non the balance sheet is 0. In contrast, 20% is amortized for tax purposes this year, so the tax base is €4 million [or (1 − 0.2) × €5 million].\nIn total, the carrying amount of assets is €3 million less than the tax base, creating a deferred tax asset of €0.9 million (€3 million difference × 30%\ntax rate) (Choice C).\n(Choice A) €3 million is the difference between the carrying amount and the tax base; apply the tax rate to the difference to determine the amount\nof the deferred tax asset.\nThings to remember:\nA deferred tax asset is created when the carrying amount is less than the tax base. A deferred tax liability is created when the carrying amount is\ngreater than the tax base. The amount of the deferred tax item equals the difference between the carrying amount and the tax base times the tax\nrate.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 26, "q": "Which of the following most likely creates a deferred tax asset?", "opts": ["Carryforward of prior years' gains, offset by current losses", "Greater expenses for financial reporting than for tax reporting", "Foreign currency received for income earned during the same period"], "ans": "B", "expl": "Comparison of deferred tax assets (DTA) and liabilities (DTL)\nDTA DTL\nTemporary\nTaxable income > accounting income Taxable income < accounting income\ndifferences\nFuture tax\nDecrease Increase\nobligations\nRevaluation Change value if future earnings are at risk None\nAccelerated for financial reporting; straight-line for tax Straight-line for financial reporting; accelerated for tax\nDepreciation\nreporting reporting\nExpenses Expenses recorded before cash is paid Expenses recorded after cash is paid\nCarryforwards Prior years' losses None\nRevenue Cash received before revenue is earned Cash received after revenue is earned\nA deferred tax asset (DTA) is created when a company's accounting income is less than its taxable income. In that case, according to the tax\ncode, the tax expense that the company must pay is greater than its income tax expense based on financial reporting. Often, these differences\narise when the tax code and accounting standards differ on how and when companies should recognize revenues and expenses. A DTA is\ntemporary since its benefit is expected to offset future taxes.\nFor example, accounting income is less than taxable income when a company elects accelerated depreciation for financial reporting and straight-\nline depreciation for tax reporting. Using straight-line depreciation for tax reporting results in lower depreciation expense and higher taxable\nincome than when it is used for financial reporting. Higher taxable income increases tax expense and taxes payable. Overpayment of tax today\nresults in a DTA since the company will pay less tax in the future.\n(Choice A) Carryforwards of prior years' losses, not gains, may be used against future gains and are recorded as DTAs. Under most tax laws,\ngains are immediately taxable and are usually disallowed as carryforwards.\n(Choice C) Foreign or domestic currency received for revenue earned during the same period creates neither a DTA nor a deferred tax liability\nsince accounting standards and the tax code recognize the currency as income.\nThings to remember:\nA deferred tax asset (DTA) is created when a company's accounting income is less than its taxable income. Often, these differences arise when\nthe tax code and accounting standards disagree on how and when companies should recognize revenues and expenses. A DTA is temporary\nsince its benefit is expected to offset future taxes.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 27, "q": "A company reports the following information in its first year of operations: Taxable profit €155,000 Accounting profit €140,000 Tax rate 20% All else equal, if the tax rate had been 25% instead of 20%, then most likely the company's:", "opts": ["deferred tax assets would have been €750 lower.", "deferred tax assets would have been €750 higher.", "deferred tax liabilities would have been €750 higher."], "ans": "B", "expl": "Deferred tax assets (DTA) and liabilities arise from temporary differences between income tax expense and taxes payable for a period. These\ndifferences are expected to reverse over time and offset previous deferred tax items. Income tax expense is based on reported accounting\nincome from the income statement. Taxes payable is based on taxable income on the tax return and is the actual amount owed to the\ngovernment.\nDTA arise when:\nTaxable income > Accounting income and\nTaxes payable > Tax expense.\nDeferred tax liabilities (DTL) arise when:\nTaxable income < Accounting income and\nTaxes payable < Tax expense.\nIn this scenario, a DTA is created since taxable income is greater than accounting income (Choice C).\nThe deferred tax amount can be calculated as the product of the absolute difference between the taxable income and accounting income and the\ntax rate. Therefore, the size of the deferred tax item is directly correlated to the tax rate. If the tax rate were higher, the amount of the DTA\nincrease would be higher as well (Choice A).\nThings to remember:\nA deferred tax item amount can be calculated as the product of the absolute difference between the taxable profit and accounting profit and the tax\nrate. The size of the deferred tax item is directly correlated to the tax rate.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 28, "q": "Deferred taxes most likely result from:", "opts": ["only temporary tax differences.", "only permanent tax differences.", "both temporary and permanent tax differences."], "ans": "A", "expl": "Major areas resulting in permanent differences between pretax and taxable income\nItem Impact Reason\nInterest on state and local Pretax income > taxable\nInterest is tax-free\ngovernment bonds income\nFines and penalties Fines are tax-deductible\nTaxable income > pretax\nCertain entertainment expenses Not all are fully tax-deductible\nincome\nCertain benefits for senior Some benefits, such as company-paid premiums on life insurance,\nmanagement are no
