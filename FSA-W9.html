t tax-deductible\nTax laws allow companies to report balance sheet and income statement items differently for tax and financial reporting purposes. These\ndifferences cause pretax income and taxable income to diverge. The differences are classified as either temporary or permanent.\nDeferred taxes arise only from temporary differences in pretax income and taxable income. For example, a company may choose to\ndepreciate assets more rapidly for tax purposes than for financial reporting. When this happens, compared to the financial reports, in tax\nreporting:\ndepreciation is higher,\ntaxable income is lower,\ntax obligation is lower, and\ntaxes payable is lower.\nThe difference is temporary since an asset will be depreciated by the same amount over its useful life, regardless of the depreciation methods.\nWhen the discrepancy is permanent (ie, never to be reversed), no deferred tax item is created (Choices B and C). For example, companies\ninclude interest on municipal (state and local) bonds as revenue for financial reporting, but municipal bond interest is never taxable to the\nrecipient. Similarly, fines imposed by a government agency are deducted as an operating expense for financial reporting, but fines cannot be\ndeducted when calculating taxable income.\nThings to remember:\nCompanies can report figures differently for tax purposes and for financial reporting. These differences cause pretax income and taxable income\nto diverge. Deferred taxes arise only from temporary differences in pretax income and taxable income. When the discrepancy is permanent, no\ndeferred tax item is created.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 29, "q": "A company that reports under US GAAP has recognized a change in both deferred tax assets and deferred tax liabilities from the previous year. This year its taxes payable decreases and it reports a higher tax expense. The most likely reason this occurred is that: ", "opts": ["valuation allowance has increased.", "deferred tax assets have increased.", "the company uses straight-line depreciation for financial and tax reporting."], "ans": "A", "expl": "The equation above demonstrates the relationship between taxes payable, tax expense, deferred tax liabilities (DTL) and deferred tax assets\n(DTA). Here, tax expense increases, but taxes payable decreases. Rearranging the equation produces:\nHigher tax expense and lower taxes payable make the left side of the equation larger. To maintain equality, the right side must increase as well,\nwhich occurs when deferred tax liabilities (DTL) increase from the previous year (ie, the change in DTL is positive) and/or deferred tax assets\n(DTA) decrease from the previous year (ie, the change in DTA is negative).\nDTA offset future taxes, but the company must reasonably expect to generate future taxes that the DTA can offset. If that is not the case and the\nDTA is less likely to be used, then:\nunder US GAAP, a valuation allowance is established to show the reduced value of the DTA.\nunder IFRS, the DTA is reduced directly so a valuation allowance is not used.\nA decrease in DTA makes the right side of the rearranged equation larger by subtracting a negative number. An increase in the valuation\nallowance is the only answer choice that can produce that result.\n(Choice B) Increasing DTA makes the right side of the equation smaller, not larger.\n(Choice C) Deferred tax items usually result when a company uses accelerated depreciation for tax purposes and straight-line depreciation for\nfinancial reporting. Using straight-line depreciation for both financial and tax reporting has no impact on either DTL or DTA.\nThings to remember:\nDeferred tax assets (DTA) can reduce a company's future tax obligations. However, the company must have future income, and income taxes,\nagainst which the DTA will apply. A valuation allowance reduces the value of DTA if it is less likely that the company will generate future income\ntaxes that the DTA can offset.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 30, "q": "On March 1, 20X7, a company purchased securities of a publicly traded company for €1 million. At the end of 20X7, the securities were worth €800,000. If the company treats the securities as trading securities, then for these securities, at the end of 20X7, the company will most appropriately record:", "opts": ["a deferred tax asset.", "a deferred tax liability.", "neither a deferred tax asset nor a deferred tax liability."], "ans": "A", "expl": "Deferred tax assets (DTA) and deferred tax liabilities (DTL) arise from temporary differences between taxable income and pretax income. These\ndifferences can result when the tax code and financial standards diverge in recognizing revenues and expenses. When an item is treated the\nsame for tax purposes and financial reporting purposes, no deferred tax item is created.\nTrading securities are held on the balance sheet at their market value. Unrealized gains and losses in market value are included in the income\nstatement and affect pretax income. However, the €200,000 loss is not tax-deductible until the company sells the securities and realizes the loss,\nso its taxable income, which does not include the loss, is €200,000 higher than its pretax income, which does include the loss. Its taxes payable is\nthus greater than its tax expense, creating a DTA, not a DTL (Choice B).\nThe correct answer can also be inferred from the difference between the securities' carrying value and tax base\nThe carrying value is the value shown on the balance sheet and applies to financial reporting.\nThe tax base is the equivalent of the carrying value for tax purposes.\nThe unrealized loss reduces the carrying value but not the tax base, and resulting in a DTA.\n(Choice C) The change in value of an available-for-sale security would not lead to a deferred tax item since changes in value of those securities\nbypass the income statement. The result is that gains or losses for available-for-sale securities produce identical taxable income and pretax\nincome.\nThings to remember:\nGains and losses on trading securities cause temporary differences between taxable income and pretax income. The gain or loss is recognized\ncurrently in the income statement but is not recognized for tax purposes until the securities are sold. These temporary differences result in the\ncreation of deferred tax assets, if there is an unrealized loss, and liabilities, if there is an unrealized gain.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 31, "q": "A company reports the following information: (€ millions) 20X8 20X7 Deferred tax assets 15 17 Deferred tax liabilities 29 24 Tax expense 19 - Based on this information, the company's taxes payable for 20X8 are closest to: ", "opts": ["€12 million", "€22 million", "€26 million"], "ans": "A", "expl": "Tax expense appears on a company's income statement. It demonstrates what a company owes in taxes based on applicable accounting\nstandards. For some items, the tax laws mandate treatment different from accounting standards. This difference means that the taxes that the\ncompany pays (or owes) are not the same as it reports as tax expense.\nIf the disparity between tax expense and taxes payable is expected to reverse in the future, the company creates a deferred tax asset (DTA) or a\ndeferred tax liability (DTL). A DTA signals investors that the company will pay less tax in the future than it pays in the current period; a DTL signals\nthe opposite.\nTax expense relates to taxes payable by adding the difference between the change in DTL and DTA for a given period. As a simple example, if a\ncompany reports a tax expense of $20 and taxes payable of $12, it creates a DTL of $20 − 12 = $8 to account for the difference. If the company\nhad no previous DTL, its DTL increased by $8, and the above equality holds (ie, $20 = $12 + 8).\nRearrange the formula above to solve for taxes payable:\n(Choice B) This choice incorrectly adds both the change in DTL and DTA.\n(Choice C) This choice incorrectly adds the change in DTL and subtracts the change in DTA.\nThings to remember:\nTaxes payable for a period equals the tax expense shown on the income statement plus the change in deferred tax assets and minus the change\nin deferred tax liabilities.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 32, "q": "An analyst gathers the following information about a company reporting under US GAAP: ($ millions) Fiscal Year End 20X1 Total deferred tax assets 1,100 Valuation allowance (700) Total deferred tax assets after valuation allowance 400 Total deferred tax liabilities (1,500) Net deferred tax liabilities (1,100) All else being equal, an increase in the statutory tax rate from 20% to 25% would most likely increase:", "opts": ["total assets.", "total liabilities.", "taxable income."], "ans": "B", "expl": "Deferred tax assets (DTA) and deferred tax liabilities (DTL) result from temporary differences between taxable income (based on tax reporting)\nand accounting profit (based on financial reporting). These differences create future tax benefits (ie, DTA) or obligations (ie, DTL).\nDTA and DTL are reassessed at the end of each fiscal year, based on the tax rates that will be applied in the future when the temporary\ndifferences reverse, and DTA is recovered, or DTL is settled. If future income is taxed at higher (lower) rates:\nthe company's tax obligations increase (decrease), resulting in an increased (decreased) DTL, and\nthe benefit of future deductions increases (decreases), resulting in an increased (decreased) DTA.\nDTA and DTL are netted and reported as a single item on the balance sheet. In this case, since DTL > DTA, there are no deferred taxes reported\nas an asset on the balance sheet.\nDeferred taxes and statutory tax rates\n20% rate 25% rate Difference\nTotal DTA 1,100 1,375 275\nTotal DTL (1,500) (1,875) (375)\nNet effect (400) (500) (100)\nAn increase in the statutory tax rate increases both DTL and DTA, so in this scenario the net effect is an increase in net DTL. Therefore, total\nliabilities will increase and the tax rate change will not affect total assets.\nNote: No calculation is necessary to answer this question.\nThings to remember:\nDeferred tax assets (DTA) and deferred tax liabilities (DTL) are created by temporary differences and must be reassessed every year for any\nchanges in the applicable tax rate. An increase in the statutory tax rate increases both DTA and DTL since both future tax benefits (ie, DTA) and\nobligations (ie, DTL) will increase. DTA and DTL are netted and reported as a single item on the balance sheet.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 33, "q": "In the fiscal year ending 31 December 20X4, a company: received a payment of £50,000 on 30 December 20X4 from a tenant for January 20X5's rent. This amount is taxable in 20X4. purchased equipment on 1 January 20X4 for £200,000. The equipment has no salvage value. In 20X4, depreciation expense was calculated as: 20% of the equipment's cost for accounting purposes and 40% of the equipment's cost for tax purposes. prepaid £12,000 on 12 December 20X4 for a software subscription to be consumed in 20X5. This amount is tax deductible in 20X4. Using only the information provided, which of the following most likely resulted in a deferred tax asset in 20X4?", "opts": ["The prepaid software subscription", "The rent amount received in advance", "The different depreciation methods on the equipment"], "ans": "B", "expl": "Creation of deferred tax assets (DTA) and liabilities (DTL)\nBalance sheet item Scenario\nCarrying amount > Tax base → DTL\nAsset\nCarrying amount < Tax base → DTA\nCarrying amount > Tax base → DTA\nLiability\nCarrying amount < Tax base → DTL\nThe carrying amount of an asset or liability reflects the book value on the balance sheet, reported according to the applicable accounting\nstandards. In contrast, the tax base of an asset or liability reflects the carrying value for tax purposes, according to the applicable tax code.\nDifferences between accounting standards and tax codes may cause the carrying amount to differ from the tax base, resulting in deferred tax\nassets (DTA) and deferred tax liabilities (DTL).\nIn this scenario, the firm cannot recognize the £50,000 rent payment as revenue for accounting purposes until it is fully earned in January 20X5.\nInstead, it records £50,000 as unearned revenue, a liability, on 30 December 20X4. For tax purposes, the firm recognizes the £50,000 as taxable\ncash revenue in 20X4. Since the liability's carrying value (£50,000) is greater than its tax base (£0), this creates a DTA.\n(Choice A) The £12,000 for the prepaid software subscription is recorded as an asset (prepaid expenses), but for tax purposes it is recognized as\na cash expense in 20X4. Since the asset's carrying amount (£12,000) is greater than its tax base (£0), a DTL is created.\n(Choice C) For the £200,000 equipment, which is an asset, 20% of the historical cost is depreciated for accounting purposes in 20X4, so the\nremaining carrying amount is £160,000 or [(1 − 0.2) × 200,000]. In contrast, 40% is depreciated for tax purposes, so the remaining tax base is\n£120,000 or [1 − 0.4) × 200,000]. Since the asset's carrying amount (£160,000) is greater than its tax base (£120,000), a DTL is created.\nThings to remember:\nThe carrying amount of an asset or liability reflects the book value on the balance sheet, reported according to the applicable accounting\nstandards. The tax base of an asset or liability reflects its value for tax purposes, based on the applicable tax code. Differences between\naccounting standards and tax codes may cause the carrying amount to differ from the tax base.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 34, "q": "In 20X0, a company's deferred tax liabilities increased by €3 million and its deferred tax assets decreased by €2 million. If the company reports €80 million in taxes payable, then its income tax expense (in € millions) is closest to:", "opts": ["79", "81", "85"], "ans": "C", "expl": "Deferred tax assets (DTA) and deferred tax liabilities (DTL) reflect temporary differences between income tax expense and taxes payable for a\nperiod. Such differences are created by differences between accounting standards and tax laws. Income tax expense is reported on the income\nstatement according to accounting standards, whereas taxes payable is the actual amount owed to the government based on applicable tax laws.\nWhen tax expense is greater than taxes payable, a DTL is created since the company pays less in taxes in the current period but will owe\nmore in taxes in the future.\nWhen tax expense is less than taxes payable, a DTA is created since the company pays more in taxes in the current period and will owe\nless in taxes in the future.\nThe equation above shows how changes in DTL and DTA are related to tax expense and taxes payable. To calculate tax expense in this scenario,\nsubstitute the values for all of the other variables.\nTax expense = Taxes payable + ΔDTL – ΔDTA = 80 + 3 – (-2) = 85\n(Choice A) 79 results from incorrectly subtracting the change in DTL and adding the change in DTA to taxes payable.\n(Choice B) 81 results from incorrectly adding the change in DTA.\nThings to remember:\nDeferred tax assets (DTA) and deferred tax liabilities (DTL) reflect temporary differences between income tax expense and taxes payable for a\nperiod. Such differences are created by differences between accounting standards and tax laws. Tax expense equals taxes payable plus the\nchange in DTL less the change in DTA.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 35, "q": "For a company reporting under US GAAP, nontaxable income generated from holding municipal bonds most likely causes:", "opts": ["a valuation allowance created for certain deferred tax assets.", "a temporary difference between taxable profit and accounting profit.", "a permanent difference between taxable profit and accounting profit."], "ans": "C", "expl": "Major areas resulting in permanent differences between pretax and taxable income\nItem Impact Reason\nInterest on state and local Pretax income > taxable\nInterest is tax-free\ngovernment bonds income\nFines and penalties Fines are tax-deductible\nTaxable income > pretax\nCertain entertainment expenses Not all are fully tax-deductible\nincome\nCertain benefits for senior Some benefits, such as company-paid premiums on life insurance,\nmanagement are not tax-deductible\nPermanent differences between accounting profit (ie, pretax income) and taxable profit (ie, taxable income) arise due to the tax deductibility of\ncertain items. For example, tax-exempt income from municipal bonds is included in accounting profit and excluded from taxable profit. Since this\ndifference is not expected to reverse in the future, it is considered permanent.\nIn contrast, temporary differences between accounting profit and taxable profit arise from the timing of recognizing certain revenues and\nexpenses. These differences are reflected in deferred tax assets (DTAs) and deferred tax liabilities (DTLs). Since the differences will be reversed\nin the future, they are considered temporary (Choice B).\n(Choice A) A valuation allowance account is a reserve created to offset deferred tax assets, which capture temporary differences, in the event\nthat future economic benefits are not realized. In this scenario, the differences between taxable profit and accounting profit are permanent.\nThings to remember:\nPermanent differences between accounting profit and taxable profit arise due to the tax deductibility of certain items. Such differences will not be\nreversed and therefore are permanent. In contrast, temporary differences between accounting profit and taxable profit arise from timing\ndifferences in recognizing certain revenues and expenses.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between\naccounting profit and taxable income", "qhtml": null}, {"n": 36, "q": "A company reporting under US GAAP has deferred tax assets that exceed deferred tax liabilities. All else equal, a reduction in the tax rate will most likely increase the company's:", "opts": ["operating profit.", "debt-to-asset ratio.", "shareholders' equity."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nDeferred tax items (ie, deferred tax assets and liabilities) arise from the difference between income tax expense (for accounting purposes) and\ntaxes payable (for tax reporting) for a period. Differences can occur as tax expense is calculated according to accounting standards whereas\ntaxes payable are calculated according to the tax code.\nDeferred tax assets (DTA) arise when taxable profit is greater than accounting profit and taxes payable are greater than tax expense.\nDeferred tax liabilities (DTL) arise when taxable profit is less than accounting profit and taxes payable are less than tax expense.\nIn this scenario, the value of deferred tax items is directly correlated with the tax rate. All else equal, when the tax rate decreases (as is the\ncase in this scenario), DTA and DTL decrease. Since the company's DTA exceeds its DTL, it has a net DTA balance, which is reported as a net\nlong-term asset under US GAAP. Therefore, a decrease in the tax rate ultimately reduces total assets, which increases the debt-to-asset\n(debt/asset) ratio.\n(Choice A) Operating profit is pre-tax, so a decrease in tax expense will not affect operating profit.\n(Choice C) Since the company has a net DTA, decreasing the tax rate also reduces the DTA. From the accounting equation assets = liabilities +\nequity, equity would have to decrease, not increase, to maintain the balance.\nThings to remember:\nThe value of deferred tax items is directly correlated with the tax rate. When there is a net deferred tax asset balance, a decrease in the tax rate\ndecreases that balance and thus total assets, increasing the debt-to-asset ratio and decreasing shareholders' equity.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax rate", "qhtml": null}, {"n": 37, "q": "In 20X7, a firm: receives $10 million of payments in advance from a customer for goods to be delivered in 20X8. Assume the firm pays taxes on this amount in 20X7. is fined $5 million by the government. The firm pays the fine at the end of 20X7 and expenses it for accounting purposes. The fine is not deductible for tax purposes under the jurisdiction. Based on this information, in 20X7, the carrying amount of liabilities is most likely:", "opts": ["equal to its tax base.", "$5 million more than its tax base.", "$10 million more than its tax base."], "ans": "C", "expl": "The carrying amount of a liability reflects the reported book value on the balance sheet according to the applicable accounting standards. The\ntax base of a liability reflects its value for tax purposes. Differences between accounting standards and tax codes may cause the carrying\namount to differ from the tax base. These temporary differences are reflected in deferred tax assets and deferred tax liabilities.\nIn this scenario, the carrying amount and tax base of each liability is calculated to determine the total difference in 20X7.\nFor accounting purposes, the firm cannot recognize the $10 million of customer advances as revenue until the goods are delivered in 20X8.\nTherefore, it records $10 million as unearned revenue, a liability, in 20X7. In contrast, for tax purposes, the firm recognizes the $10 million\nas taxable cash revenue in 20X7 and does not record a liability.\nThe firm pays the government fine in 20X7; therefore, the carrying amount is zero for accounting purposes. The fine is not tax deductible,\nso the tax base is also zero.\nIn aggregate, the carrying amount of liabilities is $10 million more than the tax base.\n(Choice A) The carrying amount would be equal to the tax base if the $10 million liability for unearned revenue were included in the tax base.\n(Choice B) A carrying amount of $5 million more than the tax base results from incorrectly reporting a $5 million liability for fines in the tax base.\nThings to remember:\nThe carrying amount of a liability reflects the reported book value on the balance sheet according to the applicable accounting standards. The tax\nbase of a liability reflects its value for tax purposes. Differences between accounting standards and tax codes may cause the carrying amount to\ndiffer from the tax base.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}, {"n": 38, "q": "A company that reports under US GAAP presents its 20X3 deferred tax assets valuation allowance at $10,000. In 20X4, it is reported at $0. All else equal, the reduction in the valuation allowance most likely signals that the company expects: ", "opts": ["higher taxes payable.", "lower taxable income.", "lower statutory tax rates."], "ans": "A", "expl": "Deferred tax asset vs. deferred tax liability\nItem created Accounting reporting Tax reporting\nDeferred tax asset1 Income tax expense < Taxes payable\nDeferred tax liability2 Income tax expense > Taxes payable\n1Overpayment of tax in current period creates deferred tax asset\n2Underpayment of tax in current period creates deferred tax liability\nDeferred taxes account for temporary differences between income tax expense and taxes payable. Such differences occur due to differences\nbetween tax calculations and financial statement reporting. A deferred tax asset (DTA) is created when a company pays more taxes (ie, tax\nreporting) than it reports (ie, financial reporting). The DTA can offset (ie, be applied to) future taxes owed.\nHowever, the company must expect the future taxes that the DTA will offset. To generate future taxes, the company must have taxable income.\nIf lower taxes are expected, the use of DTA is less likely, so its value is less likely to be realized. Under US GAAP, the company then decreases\nthe net DTA by increasing the valuation allowance (ie, contra account).\nIf taxable income and taxes payable are expected to increase, the DTA becomes more valuable. The company then lowers the valuation\nallowance, which increases the net value of the DTA. In this scenario, the company reduces the valuation allowance to zero. This indicates that\nthe company's taxable income and taxes payable increased so much that the value of its DTA will be fully realized.\n(Choices B and C) If taxable income or statutory tax rates are expected to be lower, the company can anticipate lower taxes payable and the\nprobability that it will use less, not more, of the DTA. To reflect decreased net DTA value, the valuation allowance is increased.\nThings to remember:\nA deferred tax asset (DTA) can offset a company's future taxes if the taxes are expected. Under US GAAP, if the probability of higher taxable\nincome and taxes payable increases, the valuation allowance is reduced, which increases the DTA's net value.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a company’s deferred tax liabilities and assets\nshould be treated for the purposes of financial analysis", "qhtml": null}];
const CFG = {"title": "Wiley · Analysis of Income Taxes", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Financial Statement Analysis · 38 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
