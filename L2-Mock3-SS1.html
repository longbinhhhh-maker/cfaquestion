<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n":1,"q":"The yen cost to Carr of buying NT$10 million is closest to:","opts":["¥3,077,000.","¥32,453,000.","¥32,490,000."],"ans":"C","expl":"The trick to this question (relative to other problems you may have seen) is that in some sense, we're given the ending point, and then asked to work backwards from there. Specifically, we are told that we need to end up with NT$10M, and then we're asked to calculate the starting position in yen to get there. So the process will seem different (backwards) to what you are accustomed to: we're actually going from yen to NT$ – and not vice-versa.\nWe want to convert ¥ to NT$ (via USD). Since we are not given the starting ¥ position, we start with a hypothetical ¥1,000 contract size. The quotes given are $/¥ and $/NT$. To convert ¥ to $ (i.e., going \"up the quote\") use the bid price (and multiply). To convert from $ to NT$ we use the offer price (and divide).\nStep 1: | Convert 1,000 yen to USD at $0.008852 to obtain 1,000 × 0.008852 = $8.852.\nStep 2: | Convert $8.852 to NT$ at $0.02876 to get 8.852 / 0.02876 = NT$ 307.7886.\nNow, we want NT$ 10 million or 10,000,000 / 307.7886 = 32,489.8323 ¥ contracts or ¥32,489,832.\nAlternatively, we can calculate the NT$/yen cross rate as 0.307789–0.308142.\nTo convert yen to NT$ (going up the quote, use bid price and multiply):\nYen × 0.307789 = NT$ 10,000,000\nYen = 10,000,000 / 0.307789 = 32,489,790.\n(Module 5.1, LOS 5.b)","explhtml":"<p>The trick to this question (relative to other problems you may have seen) is that in some sense, we&#x27;re given the ending point, and then asked to work backwards from there. Specifically, we are told that we need to end up with NT$10M, and then we&#x27;re asked to calculate the starting position in yen to get there. So the process will seem different (backwards) to what you are accustomed to: we&#x27;re actually going from yen to NT$ – and not vice-versa.<\/p><p>We want to convert ¥ to NT$ (via USD). Since we are not given the starting ¥ position, we start with a hypothetical ¥1,000 contract size. The quotes given are $/¥ and $/NT$. To convert ¥ to $ (i.e., going &quot;up the quote&quot;) use the bid price (and multiply). To convert from $ to NT$ we use the offer price (and divide).<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Convert 1,000 yen to USD at $0.008852 to obtain 1,000 × 0.008852 = $8.852.<\/td><\/tr><tr><td>Step 2:<\/td><td>Convert $8.852 to NT$ at $0.02876 to get 8.852 / 0.02876 = NT$ 307.7886.<\/td><\/tr><\/table><\/div><p>Now, we want NT$ 10 million or 10,000,000 / 307.7886 = 32,489.8323 ¥ contracts or ¥32,489,832.<\/p><p>Alternatively, we can calculate the NT$/yen cross rate as 0.307789–0.308142.<\/p><p>To convert yen to NT$ (going up the quote, use bid price and multiply):<\/p><p>Yen × 0.307789 = NT$ 10,000,000<\/p><p>Yen = 10,000,000 / 0.307789 = 32,489,790.<\/p><p>(Module 5.1, LOS 5.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Economics<\/summary><div class=\"vig-body\"><p>Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852–56 for the yen and $0.02874–6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><\/div><\/details><div class=\"qtext\"><p>The yen cost to Carr of buying NT$10 million is closest to:<\/p><\/div>","subj":"economics"},{"n":2,"q":"Are Surratt and Castillo correct with regard to their statements concerning the currency bid-ask spreads?","opts":["Only Surratt is correct.","Only Castillo is correct.","Both Surratt and Castillo are correct."],"ans":"A","expl":"Surratt is correct. Market conditions affect currency spreads such that the bid-ask spread on foreign currency quotations increases as exchange rate volatility (uncertainty) increases. In this example, an economic crisis in the Asian markets would create uncertainty, thereby impacting the $/¥ and $/NT$ exchange rates and increasing the bid-ask spread.\nCastillo is incorrect. Bank and other currency dealer positions are not considered to directly impact the size of foreign currency spreads.\nIn this example, it is true that the dealer would likely reduce her yen ask (selling price) if she wanted to unload an excess inventory of yen. However, the dealer would also probably reduce her bid (buying price) so that she did not buy any additional yen. The result would be that the spread would remain relatively unchanged. (Module 5.1, LOS 5.a)","explhtml":"<p>Surratt is correct. Market conditions affect currency spreads such that the bid-ask spread on foreign currency quotations increases as exchange rate volatility (uncertainty) increases. In this example, an economic crisis in the Asian markets would create uncertainty, thereby impacting the $/¥ and $/NT$ exchange rates and increasing the bid-ask spread.<\/p><p>Castillo is incorrect. Bank and other currency dealer positions are not considered to directly impact the size of foreign currency spreads.<\/p><p>In this example, it is true that the dealer would likely reduce her yen ask (selling price) if she wanted to unload an excess inventory of yen. However, the dealer would also probably reduce her bid (buying price) so that she did not buy any additional yen. The result would be that the spread would remain relatively unchanged. (Module 5.1, LOS 5.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852–56 for the yen and $0.02874–6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><\/div><\/details><div class=\"qtext\"><p>Are Surratt and Castillo correct with regard to their statements concerning the currency bid-ask spreads?<\/p><\/div>","subj":"economics"},{"n":3,"q":"Evaluate Surratt's statements concerning the impact of monetary policy on currency values. Surratt is:","opts":["correct.","incorrect, because restrictive monetary policy in the United States would lead to a lower value of the dollar.","incorrect, because restrictive U.S. monetary policy would be matched by foreign governments."],"ans":"A","expl":"Surratt is correct. Under the Mundell-Fleming model, restrictive monetary policy reduces the growth rate of the money supply and will lead to appreciation of a country's currency. Restrictive monetary policy will increase the interest rate and, consequently, the demand for domestic physical and financial assets. This increase in financial inflows (increase in the financial account) increases the demand for the domestic currency for investment purposes leading to its appreciation. Choice C is incorrect because we are given in the vignette that the foreign interest rates remain constant. (Module 5.3, LOS 5.k)","explhtml":"<p>Surratt is correct. Under the Mundell-Fleming model, restrictive monetary policy reduces the growth rate of the money supply and will lead to appreciation of a country&#x27;s currency. Restrictive monetary policy will increase the interest rate and, consequently, the demand for domestic physical and financial assets. This increase in financial inflows (increase in the financial account) increases the demand for the domestic currency for investment purposes leading to its appreciation. Choice C is incorrect because we are given in the vignette that the foreign interest rates remain constant. (Module 5.3, LOS 5.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852–56 for the yen and $0.02874–6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><\/div><\/details><div class=\"qtext\"><p>Evaluate Surratt&#x27;s statements concerning the impact of monetary policy on currency values. Surratt is:<\/p><\/div>","subj":"economics"},{"n":4,"q":"Regarding Castillo's statements concerning the effect of fiscal policy on currency values, Castillo is:","opts":["correct.","incorrect, because under the Mundell-Fleming model, restrictive Canadian fiscal policies lead to a short-run depreciation of the Canadian dollar.","incorrect, because under the Mundell-Fleming model, restrictive Canadian fiscal policies lead to an increase in the value of the Canadian dollar in the long run."],"ans":"B","expl":"Castillo is incorrect with respect to the impact of unanticipated restrictive fiscal policies on the value of the Canadian dollar.\nA reduction in the budget deficit means that government borrowing will decline, which reduces interest rates and causes investment funds to flow out of the country. As a result, the value of the Canadian dollar tends to decline. (Module 5.3, LOS 5.k)","explhtml":"<p>Castillo is incorrect with respect to the impact of unanticipated restrictive fiscal policies on the value of the Canadian dollar.<\/p><p>A reduction in the budget deficit means that government borrowing will decline, which reduces interest rates and causes investment funds to flow out of the country. As a result, the value of the Canadian dollar tends to decline. (Module 5.3, LOS 5.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852–56 for the yen and $0.02874–6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Castillo&#x27;s statements concerning the effect of fiscal policy on currency values, Castillo is:<\/p><\/div>","subj":"economics"},{"n":5,"q":"Which of the following best describes the covered interest arbitrage that Ponder should execute? Borrow in:","opts":["Swiss francs to make an arbitrage profit of $80,313.","U.S. dollars to make an arbitrage profit of $80,313.","Swiss francs to make an arbitrage profit of $75,588."],"ans":"C","expl":"The 90-day USD and SF interest rates are 18% / 4 = 4.5% and 12% / 4 = 3%, respectively.\nUsing CIRP, F = S (1 + R$) / (1 + RSF) = 0.85 (1.045) / (1.03) = $0.8624 / SF, which is greater than the market forward price of $0.80/SF. This implies that SF is trading at a bargain price in the forward market —buy it! In the spot we do the reverse: sell (the borrowed) SF.\nAt t = 0 | Cash Flow\nBuy (i.e., long position in) SF in forward market at $0.80/SF | $0\nSell 1,176,471 SF in the spot at $0.85/SF | $1,000,000 (1,176,471 SF)\nBorrow 1,176,471 SF for 90 days @ 12% annual rate | 1,176,471 SF\nInvest $1 million for 90 days @ 18% annual rate | ($1,000,000)\nTotal cash flows at t = 0 | 0\nat t = 90 | Cash Flow\nReceive USD with interest | $1,045,000\nConvert USD 969,412* into SF at previously locked-in forward rate | ($969,412)\nof $0.80/SF\nSF 1,211,765\nRepay the SF loan taken at t = 0 1,211,765) | (SF\nTotal cash flows at t = 90 | $75,588\n*This is the amount needed to repay the SF loan (with interest) after conversion. (Module 5.2, LOS 5.e)","explhtml":"<p>The 90-day USD and SF interest rates are 18% / 4 = 4.5% and 12% / 4 = 3%, respectively.<\/p><p>Using CIRP, F = S (1 + R$) / (1 + RSF) = 0.85 (1.045) / (1.03) = $0.8624 / SF, which is greater than the market forward price of $0.80/SF. This implies that SF is trading at a bargain price in the forward market —buy it! In the spot we do the reverse: sell (the borrowed) SF.<\/p><div class=\"tbl\"><table><tr><td>At t = 0<\/td><td>Cash Flow<\/td><\/tr><tr><td>Buy (i.e., long position in) SF in forward market at $0.80/SF<\/td><td>$0<\/td><\/tr><tr><td>Sell 1,176,471 SF in the spot at $0.85/SF<\/td><td>$1,000,000 (1,176,471 SF)<\/td><\/tr><tr><td>Borrow 1,176,471 SF for 90 days @ 12% annual rate<\/td><td>1,176,471 SF<\/td><\/tr><tr><td>Invest $1 million for 90 days @ 18% annual rate<\/td><td>($1,000,000)<\/td><\/tr><tr><td>Total cash flows at t = 0<\/td><td>0<\/td><\/tr><tr><td>at t = 90<\/td><td>Cash Flow<\/td><\/tr><tr><td>Receive USD with interest<\/td><td>$1,045,000<\/td><\/tr><tr><td>Convert USD 969,412* into SF at previously locked-in forward rate<\/td><td>($969,412)<\/td><\/tr><\/table><\/div><p>of $0.80/SF<\/p><p>SF 1,211,765<\/p><div class=\"tbl\"><table><tr><td>Repay the SF loan taken at t = 0 1,211,765)<\/td><td>(SF<\/td><\/tr><tr><td>Total cash flows at t = 90<\/td><td>$75,588<\/td><\/tr><\/table><\/div><p>*This is the amount needed to repay the SF loan (with interest) after conversion. (Module 5.2, LOS 5.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<\/summary><div class=\"vig-body\"><p>Jim Satya is a currency trader for the Alpha Bank. One of Alpha&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming an initial capital of $1 million.<\/p><p>He asks Satya to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Satya has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><tr><td>Three-month interest rate for U.S. dollars (annualized)<\/td><td>18.0%<\/td><\/tr><\/table><\/div><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Satya about the impact of such a deficit on the value of the Bun.<\/p><p>Satya states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><\/table><\/div><p>1:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><\/table><\/div><p>2:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The response of import and export demand to changes in import and<\/td><\/tr><tr><td>3:<\/td><td>export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the covered interest arbitrage that Ponder should execute? Borrow in:<\/p><\/div>","subj":"economics"},{"n":6,"q":"How many of the factors identified by Satya regarding Bundovia's current account deficit are accurate?","opts":["One factor only.","Two factors only.","All three factors."],"ans":"A","expl":"Only Factor 3 is correct. Factor 1 incorrectly specifies the size of expected future deficits rather than size of initial current account deficit. Factor 2 incorrectly specifies influence on domestic prices in general rather than domestic prices of traded goods (i.e., imports/exports). (Module 5.3, LOS 5.j)","explhtml":"<p>Only Factor 3 is correct. Factor 1 incorrectly specifies the size of expected future deficits rather than size of initial current account deficit. Factor 2 incorrectly specifies influence on domestic prices in general rather than domestic prices of traded goods (i.e., imports/exports). (Module 5.3, LOS 5.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jim Satya is a currency trader for the Alpha Bank. One of Alpha&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming an initial capital of $1 million.<\/p><p>He asks Satya to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Satya has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><tr><td>Three-month interest rate for U.S. dollars (annualized)<\/td><td>18.0%<\/td><\/tr><\/table><\/div><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Satya about the impact of such a deficit on the value of the Bun.<\/p><p>Satya states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><\/table><\/div><p>1:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><\/table><\/div><p>2:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The response of import and export demand to changes in import and<\/td><\/tr><tr><td>3:<\/td><td>export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>How many of the factors identified by Satya regarding Bundovia&#x27;s current account deficit are accurate?<\/p><\/div>","subj":"economics"},{"n":7,"q":"For this question only, suppose that the Bundovian government wants to fix the BUN/USD exchange rate. Under the Mundell-Fleming model, the Bundovian government's ability to follow an expansionary monetary policy would be limited by:","opts":["its fiscal policy.","the price sensitivity of its exports to the United States.","its USD reserves."],"ans":"C","expl":"Under the Mundell-Fleming model, an expansionary monetary policy would lead to depreciation of the Bun. Under a fixed-exchange rate regime, to counteract the depreciation of the Bun, the Bundovian government has to support its currency by purchasing it in the market. This action is limited by the government's foreign currency reserves. (Module 5.3, LOS 5.k)","explhtml":"<p>Under the Mundell-Fleming model, an expansionary monetary policy would lead to depreciation of the Bun. Under a fixed-exchange rate regime, to counteract the depreciation of the Bun, the Bundovian government has to support its currency by purchasing it in the market. This action is limited by the government&#x27;s foreign currency reserves. (Module 5.3, LOS 5.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jim Satya is a currency trader for the Alpha Bank. One of Alpha&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming an initial capital of $1 million.<\/p><p>He asks Satya to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Satya has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><tr><td>Three-month interest rate for U.S. dollars (annualized)<\/td><td>18.0%<\/td><\/tr><\/table><\/div><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Satya about the impact of such a deficit on the value of the Bun.<\/p><p>Satya states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><\/table><\/div><p>1:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><\/table><\/div><p>2:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The response of import and export demand to changes in import and<\/td><\/tr><tr><td>3:<\/td><td>export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>For this question only, suppose that the Bundovian government wants to fix the BUN/USD exchange rate. Under the Mundell-Fleming model, the Bundovian government&#x27;s ability to follow an expansionary monetary policy would be limited by:<\/p><\/div>","subj":"economics"},{"n":8,"q":"When advising customers pursuing carry trade, Satya would most accurately describe the strategy's return distribution as:","opts":["negatively skewed, with fat tails.","either positively or negatively skewed, with skinny tails.","positively skewed, with normal tails."],"ans":"A","expl":"The carry trade is a leveraged strategy that involves borrowing a low-yielding currency (the \"funding\" currency), converting it, and investing in a higher-yielding currency (the \"investment\" currency), while leaving the exchange rate risk unhedged. The return distribution of the carry trade is negatively skewed, with fat tails (relative to a normal distribution). (Module 5.3, LOS 5.i)","explhtml":"<p>The carry trade is a leveraged strategy that involves borrowing a low-yielding currency (the &quot;funding&quot; currency), converting it, and investing in a higher-yielding currency (the &quot;investment&quot; currency), while leaving the exchange rate risk unhedged. The return distribution of the carry trade is negatively skewed, with fat tails (relative to a normal distribution). (Module 5.3, LOS 5.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jim Satya is a currency trader for the Alpha Bank. One of Alpha&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming an initial capital of $1 million.<\/p><p>He asks Satya to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Satya has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><tr><td>Three-month interest rate for U.S. dollars (annualized)<\/td><td>18.0%<\/td><\/tr><\/table><\/div><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Satya about the impact of such a deficit on the value of the Bun.<\/p><p>Satya states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><\/table><\/div><p>1:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><\/table><\/div><p>2:<\/p><div class=\"tbl\"><table><tr><td>Factor<\/td><td>The response of import and export demand to changes in import and<\/td><\/tr><tr><td>3:<\/td><td>export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>When advising customers pursuing carry trade, Satya would most accurately describe the strategy&#x27;s return distribution as:<\/p><\/div>","subj":"economics"},{"n":9,"q":"With respect to the balance sheet accrual ratio, which of the following, other things equal, would most likely lead to an increase in the ratio for a growing company?","opts":["Extending the time the firm takes to pay its suppliers.","A significant build-up of cash.","A build-up of inventory."],"ans":"C","expl":"The balance sheet accrual ratio is the year-over-year increase in net operating assets divided by average net operating assets. An increase in payables (a liability) will tend to decrease (reduce the change in) net operating assets, while an increase in inventory will tend to increase (increase the change in) net operating assets. Cash is not an operating asset and does not affect the ratio. (Module 13.5, LOS 13.e)","explhtml":"<p>The balance sheet accrual ratio is the year-over-year increase in net operating assets divided by average net operating assets. An increase in payables (a liability) will tend to decrease (reduce the change in) net operating assets, while an increase in inventory will tend to increase (increase the change in) net operating assets. Cash is not an operating asset and does not affect the ratio. (Module 13.5, LOS 13.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Tobin Yoakam, CFA, is analyzing the financial performance of Konker Industries, a U.S. company which is publicly traded under the ticker KONK. Yoakam is particularly concerned about the quality of Konker&#x27;s financial statements and its choices of accounting methodologies.<\/p><p>Below is a summary of Konker&#x27;s financial statements prepared by Yoakam.<\/p><p>Konker Industries<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>Balance Sheet<\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X8<\/td><td><\/td><td><\/td><\/tr><tr><td>($ in thousands)<\/td><td>($ in thousands)<\/td><td><\/td><td><\/td><\/tr><tr><td>Gross sales<\/td><td>55,435<\/td><td>Cash and equivalents<\/td><td>457<\/td><\/tr><\/table><\/div><p>Sales discounts, returns, and<\/p><div class=\"tbl\"><table><tr><td>1,352<\/td><td>Short term marketable securities<\/td><td>927<\/td><\/tr><\/table><\/div><p>allowances<\/p><div class=\"tbl\"><table><tr><td>Net sales<\/td><td>54,083<\/td><td>Accounts receivable (net)<\/td><td>47,740<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>26,500<\/td><td>Inventories<\/td><td>20,963<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>15,625<\/td><td>PP&amp;E (net of depreciation)<\/td><td>25,371<\/td><\/tr><tr><td>Depreciation expense<\/td><td>1,082<\/td><td>Total assets<\/td><td>95,458<\/td><\/tr><\/table><\/div><p>Earnings before interest and 10,876 taxes<\/p><div class=\"tbl\"><table><tr><td>Interest expense<\/td><td>693<\/td><td>Accounts payable<\/td><td>24,994<\/td><\/tr><tr><td>Earnings before taxes<\/td><td>10,183<\/td><td>Other current liabilities<\/td><td>1,209<\/td><\/tr><tr><td>Taxes (tax rate 40%)<\/td><td>4,073<\/td><td>Long term debt<\/td><td>21,770<\/td><\/tr><tr><td>Net income<\/td><td>6,110<\/td><td>Total liabilities<\/td><td>47,973<\/td><\/tr><tr><td>Common stock<\/td><td>40,314<\/td><td><\/td><td><\/td><\/tr><tr><td>Dividends<\/td><td>5,046<\/td><td>Retained earnings<\/td><td>7,171<\/td><\/tr><\/table><\/div><p>Total liabilities and shareholders<\/p><div class=\"tbl\"><table><tr><td>Net addition to retained earnings<\/td><td>1,064 equity<\/td><td>95,458<\/td><\/tr><\/table><\/div><p>At the beginning of 20X8, Konker formed a qualified special purpose entity (QSPE) and sold a portion of its accounts receivables to the QSPE. Under U.S. GAAP, QSPE was exempt from consolidation requirements. The total amount of accounts receivables sold to the QSPE was $13.5 million. Yoakam has noted in his research that the Financial Accounting Standards Board (FASB) eliminated qualified special purpose entities.<\/p><p>Konker has three major operating divisions: Konker Industrial, Konker Defense, and Konker Capital. Yoakam has computed the EBIT margin for each division over the last three years, as well as the ratio of the percentage of total capital expenditures to the percentage of total assets for each division.<\/p><div class=\"tbl\"><table><tr><td>EBIT / Assets<\/td><td>CapEx % / Assets %<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td><\/td><\/tr><tr><td>Konker Industrial<\/td><td>6.2%<\/td><td>7.5%<\/td><td>6.7%<\/td><td>1.5<\/td><td>1.3<\/td><td>1.2<\/td><\/tr><tr><td>Konker Defense<\/td><td>6.7%<\/td><td>7.2%<\/td><td>6.9%<\/td><td>0.5<\/td><td>0.6<\/td><td>0.7<\/td><\/tr><tr><td>Konker Capital<\/td><td>10.1%<\/td><td>12.1%<\/td><td>11.1%<\/td><td>0.7<\/td><td>0.6<\/td><td>0.5<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>With respect to the balance sheet accrual ratio, which of the following, other things equal, would most likely lead to an increase in the ratio for a growing company?<\/p><\/div>","subj":"fsa"},{"n":10,"q":"When FASB retroactively eliminated the allowance of QSPEs created for the securitization of receivables, the most likely impact on Konker's financial statements would have been:","opts":["an increase in equity and an increase in interest expense.","no change in assets but an increase in financial leverage ratios.","an increase in financial leverage ratios and a decrease in the interest coverage ratio."],"ans":"C","expl":"The elimination of the securitization of receivables as an off-balance-sheet item would result in Konker having to report the transaction as securitized borrowing, replacing the receivables on the balance sheet, and reporting a liability equal to the proceeds of the securitization transaction. The impact on Konker's balance sheet would be an increase in assets, and an increase in liabilities. The change in equity from reporting the transaction in this way is likely to be small. Financial leverage would increase, and the consequent increase in interest expense from the liability would decrease the interest coverage ratio. (Module 13.5, LOS 13.d)","explhtml":"<p>The elimination of the securitization of receivables as an off-balance-sheet item would result in Konker having to report the transaction as securitized borrowing, replacing the receivables on the balance sheet, and reporting a liability equal to the proceeds of the securitization transaction. The impact on Konker&#x27;s balance sheet would be an increase in assets, and an increase in liabilities. The change in equity from reporting the transaction in this way is likely to be small. Financial leverage would increase, and the consequent increase in interest expense from the liability would decrease the interest coverage ratio. (Module 13.5, LOS 13.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tobin Yoakam, CFA, is analyzing the financial performance of Konker Industries, a U.S. company which is publicly traded under the ticker KONK. Yoakam is particularly concerned about the quality of Konker&#x27;s financial statements and its choices of accounting methodologies.<\/p><p>Below is a summary of Konker&#x27;s financial statements prepared by Yoakam.<\/p><p>Konker Industries<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>Balance Sheet<\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X8<\/td><td><\/td><td><\/td><\/tr><tr><td>($ in thousands)<\/td><td>($ in thousands)<\/td><td><\/td><td><\/td><\/tr><tr><td>Gross sales<\/td><td>55,435<\/td><td>Cash and equivalents<\/td><td>457<\/td><\/tr><\/table><\/div><p>Sales discounts, returns, and<\/p><div class=\"tbl\"><table><tr><td>1,352<\/td><td>Short term marketable securities<\/td><td>927<\/td><\/tr><\/table><\/div><p>allowances<\/p><div class=\"tbl\"><table><tr><td>Net sales<\/td><td>54,083<\/td><td>Accounts receivable (net)<\/td><td>47,740<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>26,500<\/td><td>Inventories<\/td><td>20,963<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>15,625<\/td><td>PP&amp;E (net of depreciation)<\/td><td>25,371<\/td><\/tr><tr><td>Depreciation expense<\/td><td>1,082<\/td><td>Total assets<\/td><td>95,458<\/td><\/tr><\/table><\/div><p>Earnings before interest and 10,876 taxes<\/p><div class=\"tbl\"><table><tr><td>Interest expense<\/td><td>693<\/td><td>Accounts payable<\/td><td>24,994<\/td><\/tr><tr><td>Earnings before taxes<\/td><td>10,183<\/td><td>Other current liabilities<\/td><td>1,209<\/td><\/tr><tr><td>Taxes (tax rate 40%)<\/td><td>4,073<\/td><td>Long term debt<\/td><td>21,770<\/td><\/tr><tr><td>Net income<\/td><td>6,110<\/td><td>Total liabilities<\/td><td>47,973<\/td><\/tr><tr><td>Common stock<\/td><td>40,314<\/td><td><\/td><td><\/td><\/tr><tr><td>Dividends<\/td><td>5,046<\/td><td>Retained earnings<\/td><td>7,171<\/td><\/tr><\/table><\/div><p>Total liabilities and shareholders<\/p><div class=\"tbl\"><table><tr><td>Net addition to retained earnings<\/td><td>1,064 equity<\/td><td>95,458<\/td><\/tr><\/table><\/div><p>At the beginning of 20X8, Konker formed a qualified special purpose entity (QSPE) and sold a portion of its accounts receivables to the QSPE. Under U.S. GAAP, QSPE was exempt from consolidation requirements. The total amount of accounts receivables sold to the QSPE was $13.5 million. Yoakam has noted in his research that the Financial Accounting Standards Board (FASB) eliminated qualified special purpose entities.<\/p><p>Konker has three major operating divisions: Konker Industrial, Konker Defense, and Konker Capital. Yoakam has computed the EBIT margin for each division over the last three years, as well as the ratio of the percentage of total capital expenditures to the percentage of total assets for each division.<\/p><div class=\"tbl\"><table><tr><td>EBIT / Assets<\/td><td>CapEx % / Assets %<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td><\/td><\/tr><tr><td>Konker Industrial<\/td><td>6.2%<\/td><td>7.5%<\/td><td>6.7%<\/td><td>1.5<\/td><td>1.3<\/td><td>1.2<\/td><\/tr><tr><td>Konker Defense<\/td><td>6.7%<\/td><td>7.2%<\/td><td>6.9%<\/td><td>0.5<\/td><td>0.6<\/td><td>0.7<\/td><\/tr><tr><td>Konker Capital<\/td><td>10.1%<\/td><td>12.1%<\/td><td>11.1%<\/td><td>0.7<\/td><td>0.6<\/td><td>0.5<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>When FASB retroactively eliminated the allowance of QSPEs created for the securitization of receivables, the most likely impact on Konker&#x27;s financial statements would have been:<\/p><\/div>","subj":"fsa"},{"n":11,"q":"An analyst is considering the effects of income reported under the equity method on certain financial ratios. For a firm that reports equity income as non-operating income (not included in EBIT), removing equity income from the financial statements would most likely result in:","opts":["an increase in the tax burden term in the extended Du Pont decomposition of ROE.","an increase in the asset turnover ratio.","a decrease in the interest coverage ratio."],"ans":"B","expl":"Removing the effects of the income reported under the equity method involves removing the income and the equity asset reported on the balance sheet. The decrease in total assets will increase the asset turnover ratio. The tax burden term is net income divided by earnings before tax so that the decrease in net income from removing the equity income will decrease the term. Neither interest expense nor operating earnings (EBIT) are affected by the appropriate adjustments, so the interest coverage ratio is unaffected. (Module 13.2, LOS 13.b)","explhtml":"<p>Removing the effects of the income reported under the equity method involves removing the income and the equity asset reported on the balance sheet. The decrease in total assets will increase the asset turnover ratio. The tax burden term is net income divided by earnings before tax so that the decrease in net income from removing the equity income will decrease the term. Neither interest expense nor operating earnings (EBIT) are affected by the appropriate adjustments, so the interest coverage ratio is unaffected. (Module 13.2, LOS 13.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tobin Yoakam, CFA, is analyzing the financial performance of Konker Industries, a U.S. company which is publicly traded under the ticker KONK. Yoakam is particularly concerned about the quality of Konker&#x27;s financial statements and its choices of accounting methodologies.<\/p><p>Below is a summary of Konker&#x27;s financial statements prepared by Yoakam.<\/p><p>Konker Industries<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>Balance Sheet<\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X8<\/td><td><\/td><td><\/td><\/tr><tr><td>($ in thousands)<\/td><td>($ in thousands)<\/td><td><\/td><td><\/td><\/tr><tr><td>Gross sales<\/td><td>55,435<\/td><td>Cash and equivalents<\/td><td>457<\/td><\/tr><\/table><\/div><p>Sales discounts, returns, and<\/p><div class=\"tbl\"><table><tr><td>1,352<\/td><td>Short term marketable securities<\/td><td>927<\/td><\/tr><\/table><\/div><p>allowances<\/p><div class=\"tbl\"><table><tr><td>Net sales<\/td><td>54,083<\/td><td>Accounts receivable (net)<\/td><td>47,740<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>26,500<\/td><td>Inventories<\/td><td>20,963<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>15,625<\/td><td>PP&amp;E (net of depreciation)<\/td><td>25,371<\/td><\/tr><tr><td>Depreciation expense<\/td><td>1,082<\/td><td>Total assets<\/td><td>95,458<\/td><\/tr><\/table><\/div><p>Earnings before interest and 10,876 taxes<\/p><div class=\"tbl\"><table><tr><td>Interest expense<\/td><td>693<\/td><td>Accounts payable<\/td><td>24,994<\/td><\/tr><tr><td>Earnings before taxes<\/td><td>10,183<\/td><td>Other current liabilities<\/td><td>1,209<\/td><\/tr><tr><td>Taxes (tax rate 40%)<\/td><td>4,073<\/td><td>Long term debt<\/td><td>21,770<\/td><\/tr><tr><td>Net income<\/td><td>6,110<\/td><td>Total liabilities<\/td><td>47,973<\/td><\/tr><tr><td>Common stock<\/td><td>40,314<\/td><td><\/td><td><\/td><\/tr><tr><td>Dividends<\/td><td>5,046<\/td><td>Retained earnings<\/td><td>7,171<\/td><\/tr><\/table><\/div><p>Total liabilities and shareholders<\/p><div class=\"tbl\"><table><tr><td>Net addition to retained earnings<\/td><td>1,064 equity<\/td><td>95,458<\/td><\/tr><\/table><\/div><p>At the beginning of 20X8, Konker formed a qualified special purpose entity (QSPE) and sold a portion of its accounts receivables to the QSPE. Under U.S. GAAP, QSPE was exempt from consolidation requirements. The total amount of accounts receivables sold to the QSPE was $13.5 million. Yoakam has noted in his research that the Financial Accounting Standards Board (FASB) eliminated qualified special purpose entities.<\/p><p>Konker has three major operating divisions: Konker Industrial, Konker Defense, and Konker Capital. Yoakam has computed the EBIT margin for each division over the last three years, as well as the ratio of the percentage of total capital expenditures to the percentage of total assets for each division.<\/p><div class=\"tbl\"><table><tr><td>EBIT / Assets<\/td><td>CapEx % / Assets %<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td><\/td><\/tr><tr><td>Konker Industrial<\/td><td>6.2%<\/td><td>7.5%<\/td><td>6.7%<\/td><td>1.5<\/td><td>1.3<\/td><td>1.2<\/td><\/tr><tr><td>Konker Defense<\/td><td>6.7%<\/td><td>7.2%<\/td><td>6.9%<\/td><td>0.5<\/td><td>0.6<\/td><td>0.7<\/td><\/tr><tr><td>Konker Capital<\/td><td>10.1%<\/td><td>12.1%<\/td><td>11.1%<\/td><td>0.7<\/td><td>0.6<\/td><td>0.5<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>An analyst is considering the effects of income reported under the equity method on certain financial ratios. For a firm that reports equity income as non-operating income (not included in EBIT), removing equity income from the financial statements would most likely result in:<\/p><\/div>","subj":"fsa"},{"n":12,"q":"Regarding the three operating divisions of Konker, Yoakam should be most concerned that:","opts":["Konker is growing the Industrial division over time.","the operating ROA of the Capital division has fallen over the last year.","the ratio of the Capex percent change to the asset percentage is significantly less than one for the Defense division."],"ans":"A","expl":"The fact that Konker is growing the Industrial division most rapidly (highest capex percent to asset percent ratio) is a likely cause for concern and further investigation, since this division has the lowest operating return on assets. The decrease in the operating ROA for the Capital division is not particularly troublesome as it mirrors the pattern for the other divisions and likely just reflects year-to-year variation in profitability. The fact that the percent of capex for the Defense division is less than its percent of total assets is not a primary cause for concern since that division has a lower operating ROA, and growth in capital assets likely follows contract awards in the defense industry, rather than drives business. Also, the apparent overinvestment in the Industrial division will decrease the capex percent for other divisions, other things equal. (Module 13.2, LOS 13.b)","explhtml":"<p>The fact that Konker is growing the Industrial division most rapidly (highest capex percent to asset percent ratio) is a likely cause for concern and further investigation, since this division has the lowest operating return on assets. The decrease in the operating ROA for the Capital division is not particularly troublesome as it mirrors the pattern for the other divisions and likely just reflects year-to-year variation in profitability. The fact that the percent of capex for the Defense division is less than its percent of total assets is not a primary cause for concern since that division has a lower operating ROA, and growth in capital assets likely follows contract awards in the defense industry, rather than drives business. Also, the apparent overinvestment in the Industrial division will decrease the capex percent for other divisions, other things equal. (Module 13.2, LOS 13.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tobin Yoakam, CFA, is analyzing the financial performance of Konker Industries, a U.S. company which is publicly traded under the ticker KONK. Yoakam is particularly concerned about the quality of Konker&#x27;s financial statements and its choices of accounting methodologies.<\/p><p>Below is a summary of Konker&#x27;s financial statements prepared by Yoakam.<\/p><p>Konker Industries<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>Balance Sheet<\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X8<\/td><td><\/td><td><\/td><\/tr><tr><td>($ in thousands)<\/td><td>($ in thousands)<\/td><td><\/td><td><\/td><\/tr><tr><td>Gross sales<\/td><td>55,435<\/td><td>Cash and equivalents<\/td><td>457<\/td><\/tr><\/table><\/div><p>Sales discounts, returns, and<\/p><div class=\"tbl\"><table><tr><td>1,352<\/td><td>Short term marketable securities<\/td><td>927<\/td><\/tr><\/table><\/div><p>allowances<\/p><div class=\"tbl\"><table><tr><td>Net sales<\/td><td>54,083<\/td><td>Accounts receivable (net)<\/td><td>47,740<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>26,500<\/td><td>Inventories<\/td><td>20,963<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>15,625<\/td><td>PP&amp;E (net of depreciation)<\/td><td>25,371<\/td><\/tr><tr><td>Depreciation expense<\/td><td>1,082<\/td><td>Total assets<\/td><td>95,458<\/td><\/tr><\/table><\/div><p>Earnings before interest and 10,876 taxes<\/p><div class=\"tbl\"><table><tr><td>Interest expense<\/td><td>693<\/td><td>Accounts payable<\/td><td>24,994<\/td><\/tr><tr><td>Earnings before taxes<\/td><td>10,183<\/td><td>Other current liabilities<\/td><td>1,209<\/td><\/tr><tr><td>Taxes (tax rate 40%)<\/td><td>4,073<\/td><td>Long term debt<\/td><td>21,770<\/td><\/tr><tr><td>Net income<\/td><td>6,110<\/td><td>Total liabilities<\/td><td>47,973<\/td><\/tr><tr><td>Common stock<\/td><td>40,314<\/td><td><\/td><td><\/td><\/tr><tr><td>Dividends<\/td><td>5,046<\/td><td>Retained earnings<\/td><td>7,171<\/td><\/tr><\/table><\/div><p>Total liabilities and shareholders<\/p><div class=\"tbl\"><table><tr><td>Net addition to retained earnings<\/td><td>1,064 equity<\/td><td>95,458<\/td><\/tr><\/table><\/div><p>At the beginning of 20X8, Konker formed a qualified special purpose entity (QSPE) and sold a portion of its accounts receivables to the QSPE. Under U.S. GAAP, QSPE was exempt from consolidation requirements. The total amount of accounts receivables sold to the QSPE was $13.5 million. Yoakam has noted in his research that the Financial Accounting Standards Board (FASB) eliminated qualified special purpose entities.<\/p><p>Konker has three major operating divisions: Konker Industrial, Konker Defense, and Konker Capital. Yoakam has computed the EBIT margin for each division over the last three years, as well as the ratio of the percentage of total capital expenditures to the percentage of total assets for each division.<\/p><div class=\"tbl\"><table><tr><td>EBIT / Assets<\/td><td>CapEx % / Assets %<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><td><\/td><\/tr><tr><td>Konker Industrial<\/td><td>6.2%<\/td><td>7.5%<\/td><td>6.7%<\/td><td>1.5<\/td><td>1.3<\/td><td>1.2<\/td><\/tr><tr><td>Konker Defense<\/td><td>6.7%<\/td><td>7.2%<\/td><td>6.9%<\/td><td>0.5<\/td><td>0.6<\/td><td>0.7<\/td><\/tr><tr><td>Konker Capital<\/td><td>10.1%<\/td><td>12.1%<\/td><td>11.1%<\/td><td>0.7<\/td><td>0.6<\/td><td>0.5<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding the three operating divisions of Konker, Yoakam should be most concerned that:<\/p><\/div>","subj":"fsa"},{"n":13,"q":"Based on balance sheet accruals ratios, Ganatra is most likely to conclude which of the following regarding the earnings of Parichay?","opts":["The volatile accruals ratios are an indication that Parichay may be manipulating earnings.","Parichay’s earnings quality was lower than its peer group in 20X8 but higher in 20X6 and 20X7.","Parichay’s earnings quality worsened from 20X6 to 20X8, but was superior to its peer group over the 3-year period."],"ans":"A","expl":"Volatile accruals ratios are an indicator that a firm may be manipulating earnings, as are increasing accruals ratios. Lower accrual ratios represent higher earnings quality. (Module 13.2, LOS 13.b)","explhtml":"<p>Volatile accruals ratios are an indicator that a firm may be manipulating earnings, as are increasing accruals ratios. Lower accrual ratios represent higher earnings quality. (Module 13.2, LOS 13.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Dipesh Ganatra, CFA, is an equity analyst at Mahavir Securities Ltd. Ganatra is reviewing the financial statements of Parichay Industries, a diverse conglomerate headquartered in India. Ganatra is particularly concerned about the quality of Parichay&#x27;s earnings.<\/p><p>Ganatra decides to analyze Parichay&#x27;s accrual ratios using the balance sheet approach. The table below contains the last three years of accrual ratios for Parichay, as well as the industry average.<\/p><p>Exhibit 1: Accrual ratios for Parichay<\/p><div class=\"tbl\"><table><tr><td>Balance Sheet Accrual Ratios<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><\/tr><tr><td>Parichay<\/td><td>4.5%<\/td><td>15.0%<\/td><td>7.0%<\/td><\/tr><tr><td>Industry average<\/td><td>4.8%<\/td><td>4.4%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Ganatra has learned that Parichay has a small subsidiary in Ukraine. The subsidiary follows IFRS and uses FIFO inventory accounting. The Ukrainian subsidiary was acquired 10 years ago and has been fully integrated into Parichay&#x27;s operations. Parichay obtains funding for the subsidiary whenever the company finds profitable investments within Ukraine or neighboring countries. According to forecasts from economists, the Ukrainian Hryvnia is expected to depreciate relative to the Indian Rupee over the next few years. Ukrainian local currency prices are forecast to remain stable, however.<\/p><p>One of the managers at Mahavir has asked Ganatra to analyze another Parichay subsidiary, this one located in Pakistan. The manager explains that real interest rates in Pakistan over the past three years have been 2.00%, 2.50%, and 3.00%, respectively, while nominal interest rates have been 34.64%, 29.15%, and 25.66%, respectively. Ganatra requests more time to analyze the Pakistani subsidiary.<\/p><p>Ganatra meets an old colleague, Riteish Shah, for lunch. Shah specializes in the insurance industry and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>P&amp;C insurers&#x27; liability duration is generally shorter than that of life insurance companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Analysis of a life insurer&#x27;s profitability includes analysis of its loss reserves.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on balance sheet accruals ratios, Ganatra is most likely to conclude which of the following regarding the earnings of Parichay?<\/p><\/div>","subj":"fsa"},{"n":14,"q":"Which of the following statements regarding the consolidation of Parichay's Ukrainian subsidiary for the next year is least likely correct? Compared to the temporal method, the Ukrainian subsidiary's translated:","opts":["net income before translation gains or losses would be higher using the current rate method.","debt-to-equity ratio would be higher using the current rate method.","gross profit margin would be lower using the current rate method."],"ans":"C","expl":"Under both the current rate and temporal methods, the revenues for the Ukrainian subsidiary should be translated using the average rate. Cost of goods sold (COGS) should be translated using the historical rate for the temporal method and the average rate for the current rate method. Note that because local currency prices are expected to be constant in Ukraine, there will be no difference between LIFO and FIFO since all beginning, purchased, sold, and ending inventory will have the same cost. When a currency is depreciating, the COGS based on historical cost (temporal method) will be higher than COGS translated at the average rate (current rate method) since the average rate will incorporate the historical exchange rate and the most recent (depreciated) exchange
