idend yields is correct, but the comment about EBITDA ratios is incorrect."],"ans":"C","expl":"Comment 1 about EBITDA ratios is incorrect. EBITDA is a pre-interest variable, so it is available to all suppliers of capital, not just common shareholders. The comment about dividend yields is reasonable. (Module 22.4, LOS 22.n)(Module 22.4, LOS 22.o)","explhtml":"<p>Comment 1 about EBITDA ratios is incorrect. EBITDA is a pre-interest variable, so it is available to all suppliers of capital, not just common shareholders. The comment about dividend yields is reasonable. (Module 22.4, LOS 22.n)(Module 22.4, LOS 22.o)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Zhang Xiu Ying, CFA recently joined the analyst team at the pension plan of Steelworks Inc., reporting to Yew Yip, Senior Portfolio Manager. Ying is currently valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years; however, given its size and private status, Ying does not expect that Jensen could be easily sold. To obtain the appropriate price multiple for the Jensen valuation, Ying has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Ying estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Ying uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Ying determines an appropriate size premium using the smallest-firm-size decile of the database. Yip examines Ying&#x27;s cost of capital calculations and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>I am concerned about the use of this database. The estimate of the size<\/td><\/tr><tr><td>1:<\/td><td>premium may result in an undervaluation of the Jensen equity interest.<\/td><\/tr><tr><td>Statement<\/td><td>The use of betas and the CAPM from the database may be<\/td><\/tr><tr><td>2:<\/td><td>inappropriate. You should consider using the build-up method, where<\/td><\/tr><\/table><\/div><p>an industry risk premium is used instead of beta.<\/p><p>David Ng, one of Ying&#x27;s associates, has an affinity for the price-earnings-to-growth (PEG) ratio, because he believes it addresses the effect of growth on the P/E ratio. For example, if a firm&#x27;s P/E ratio is 20 and its forecasted 5-year growth rate is 10%, the PEG ratio is 2.0.<\/p><p>Ng prefers to invest in firms that have an above-industry-average PEG ratio. Ng also states that he seeks to invest in firms with leading P/E that is greater than its trailing P/E. Ying tells Ng that he would like to further investigate these two investment criteria.<\/p><p>Finally, Ying makes two comments about valuation ratios based on EBITDA and on dividends:<\/p><div class=\"tbl\"><table><tr><td>Comment<\/td><td>EBITDA is a pre-interest-expense figure, so I prefer a ratio of total equity<\/td><\/tr><tr><td>1:<\/td><td>value to EBITDA, versus a ratio of enterprise value to EBITDA.<\/td><\/tr><tr><td>Comment<\/td><td>Dividend yields are useful information because they are one component<\/td><\/tr><tr><td>2:<\/td><td>of total return. However, they can be an incomplete measure of return because investors trade off future earnings growth to receive higher current dividends.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Are Ying&#x27;s two comments about the dividend yield and EBITDA ratios correct?<\/p><\/div>","subj":"equity"},{"n":33,"q":"Which of the following strategies would be most appropriate given Jacobs's situation and desire to offset the equity exposure of the ELFS position in her portfolio? Establish an equity swap as:","opts":["the floating-rate payer and S&P 500 Index return receiver.","the fixed-rate receiver and S&P 500 Index return payer.","the fixed-rate payer and S&P 500 Index return receiver."],"ans":"B","expl":"Jacobs needs to offset the returns on the S&P 500 Index. She is currently receiving the returns on the index (which means if there is a negative return on the Index, Jacobs must make a payment), so she will need to enter into a swap in which she pays the index and receives a fixed rate. (Module 30.8, LOS 30.g)","explhtml":"<p>Jacobs needs to offset the returns on the S&amp;P 500 Index. She is currently receiving the returns on the index (which means if there is a negative return on the Index, Jacobs must make a payment), so she will need to enter into a swap in which she pays the index and receives a fixed rate. (Module 30.8, LOS 30.g)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Derivatives<\/summary><div class=\"vig-body\"><p>Paul Durham, CFA, is a senior manager in the structured bond department within Newton Capital Partners (NCP), an investment banking firm located in the United States. Durham has just returned from an international marketing campaign for NCP&#x27;s latest structured note offering, a series of equity-linked fixed-income securities or ELFS. The bonds will offer a 4.5% coupon paid annually along with the annual return on the S&amp;P 500 Index and will have a maturity of five years. The total face value of the ELFS series is expected to be $200 million.<\/p><p>Susan Jacobs, a fixed-income portfolio manager and principal with Smith &amp; Associates, has decided to include $10 million worth of ELFS in her fixed-income portfolio. At the end of the first year, however, the S&amp;P 500 Index value is 1,054, significantly lower than the initial value of 1,112 set by NCP at the time of the ELFS offering. Jacobs is concerned that the four remaining years of the ELFS life could have similar results and is considering her alternatives to offset the equity exposure of the ELFS position without selling the bonds. Jacobs decides to offset her portfolio&#x27;s exposure to the ELFS by entering into an equity-swap contract. The MRR term structure is shown in  Exhibit 1.<\/p><p>Exhibit 1: MRR Term Structure<\/p><div class=\"tbl\"><table><tr><td>MRR<\/td><td>Discount Factor<\/td><td><\/td><\/tr><tr><td>1-year<\/td><td>3.2%<\/td><td>0.9690<\/td><\/tr><tr><td>2-year<\/td><td>4.1%<\/td><td>0.9242<\/td><\/tr><tr><td>3-year<\/td><td>4.9%<\/td><td>0.8718<\/td><\/tr><tr><td>4-year<\/td><td>5.3%<\/td><td>0.8251<\/td><\/tr><\/table><\/div><p>To offset any credit risk associated with the equity swap, Widby recommends using an index trade strategy by entering into a credit default swap (CDS) as a protection buyer. Widby&#x27;s strategy would involve purchasing credit protection on an index comprising largely the same issuers (companies) included in the equity index underlying the swap. Widby suggests the CDS should have a maturity equal to that of the swap to provide maximum credit protection.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following strategies would be most appropriate given Jacobs&#x27;s situation and desire to offset the equity exposure of the ELFS position in her portfolio? Establish an equity swap as:<\/p><\/div>","subj":"derivatives"},{"n":34,"q":"Based on the strategy appropriate for Jacobs's portfolio, determine the contract rate on the swap strategy.","opts":["4.5%.","3.6%.","4.9%."],"ans":"C","expl":"Calculate the contract rate on a fixed-rate receiver equity swap using the following formula:\n1−ZN CN= (Z1+Z2+...+ZN)\nNote that this is the same formula for determining the fixed interest rate on an interest rate swap. The discount (Z) factors are given in  Exhibit 1. Therefore, the contract rate is:\n1−0.8251\nCN= (0.9690+0.9242+0.8718+0.8251) | = 4.9%\n(Module 30.8, LOS 30.g)","explhtml":"<p>Calculate the contract rate on a fixed-rate receiver equity swap using the following formula:<\/p><p>1−ZN CN= (Z1+Z2+...+ZN)<\/p><p>Note that this is the same formula for determining the fixed interest rate on an interest rate swap. The discount (Z) factors are given in  Exhibit 1. Therefore, the contract rate is:<\/p><p>1−0.8251<\/p><div class=\"tbl\"><table><tr><td>CN= (0.9690+0.9242+0.8718+0.8251)<\/td><td>= 4.9%<\/td><\/tr><\/table><\/div><p>(Module 30.8, LOS 30.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Durham, CFA, is a senior manager in the structured bond department within Newton Capital Partners (NCP), an investment banking firm located in the United States. Durham has just returned from an international marketing campaign for NCP&#x27;s latest structured note offering, a series of equity-linked fixed-income securities or ELFS. The bonds will offer a 4.5% coupon paid annually along with the annual return on the S&amp;P 500 Index and will have a maturity of five years. The total face value of the ELFS series is expected to be $200 million.<\/p><p>Susan Jacobs, a fixed-income portfolio manager and principal with Smith &amp; Associates, has decided to include $10 million worth of ELFS in her fixed-income portfolio. At the end of the first year, however, the S&amp;P 500 Index value is 1,054, significantly lower than the initial value of 1,112 set by NCP at the time of the ELFS offering. Jacobs is concerned that the four remaining years of the ELFS life could have similar results and is considering her alternatives to offset the equity exposure of the ELFS position without selling the bonds. Jacobs decides to offset her portfolio&#x27;s exposure to the ELFS by entering into an equity-swap contract. The MRR term structure is shown in  Exhibit 1.<\/p><p>Exhibit 1: MRR Term Structure<\/p><div class=\"tbl\"><table><tr><td>MRR<\/td><td>Discount Factor<\/td><td><\/td><\/tr><tr><td>1-year<\/td><td>3.2%<\/td><td>0.9690<\/td><\/tr><tr><td>2-year<\/td><td>4.1%<\/td><td>0.9242<\/td><\/tr><tr><td>3-year<\/td><td>4.9%<\/td><td>0.8718<\/td><\/tr><tr><td>4-year<\/td><td>5.3%<\/td><td>0.8251<\/td><\/tr><\/table><\/div><p>To offset any credit risk associated with the equity swap, Widby recommends using an index trade strategy by entering into a credit default swap (CDS) as a protection buyer. Widby&#x27;s strategy would involve purchasing credit protection on an index comprising largely the same issuers (companies) included in the equity index underlying the swap. Widby suggests the CDS should have a maturity equal to that of the swap to provide maximum credit protection.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the strategy appropriate for Jacobs&#x27;s portfolio, determine the contract rate on the swap strategy.<\/p><\/div>","subj":"derivatives"},{"n":35,"q":"If Jacobs enters into a $10 million 4-year 4.50% annual-pay fixed-rate equity swap as the equity return payer, what is the value to Jacob of the swap after one year (immediately after settlement) if the index has increased from 1,054 to 1,103, the MRR term structure is as given below, and the 3-year annual-pay swap fixed rate is currently 5.0%?\nMRR\n1-year: | 4.10%\n2-year: | 4.70%\n3-year: | 5.29%","opts":["–$136,885","–$464,982","–$602,555"],"ans":"A","expl":"Value to payer = (sum of discount factors) × (SFRnew −SFRold) × (days/360) × notional = 2.7377 × (0.05 −0.045) × (360/360) × $10,000,000 = $136,885 Since Jacob is a fixed rate receiver, value to Jacob = $–136,885. Note: The value of equity side is not relevant because the valuation is immediately after settlement. Hence the change in index value net of fixed rate payment was already settled. Discount factors are as calculated below:\nTerm (yr) | MRR | DF\n1 | 4.10% | 0.9606\n2 | 4.70% | 0.9141\n3 | 5.29% | 0.8630\nSum | 2.7377\nNote that MRR discount factors are calculated as follows: Year 3 DF = 1 / [1 + (0.0529 × 1080 / 360)] = 0.8630 Alternatively, value to fixed rate receiver = value of fixed rate bond – value of equity = [(2.7377 × 450,000) + (0.8630 × 10,000,000)] – 10,000,000 = 9,861,965 – 10,000,000 = –138,035 (difference due to rounding).\n(Module 30.8, LOS 30.g)","explhtml":"<p>Value to payer = (sum of discount factors) × (SFRnew −SFRold) × (days/360) × notional = 2.7377 × (0.05 −0.045) × (360/360) × $10,000,000 = $136,885 Since Jacob is a fixed rate receiver, value to Jacob = $–136,885. Note: The value of equity side is not relevant because the valuation is immediately after settlement. Hence the change in index value net of fixed rate payment was already settled. Discount factors are as calculated below:<\/p><div class=\"tbl\"><table><tr><td>Term (yr)<\/td><td>MRR<\/td><td>DF<\/td><\/tr><tr><td>1<\/td><td>4.10%<\/td><td>0.9606<\/td><\/tr><tr><td>2<\/td><td>4.70%<\/td><td>0.9141<\/td><\/tr><tr><td>3<\/td><td>5.29%<\/td><td>0.8630<\/td><\/tr><tr><td>Sum<\/td><td>2.7377<\/td><td><\/td><\/tr><\/table><\/div><p>Note that MRR discount factors are calculated as follows: Year 3 DF = 1 / [1 + (0.0529 × 1080 / 360)] = 0.8630 Alternatively, value to fixed rate receiver = value of fixed rate bond – value of equity = [(2.7377 × 450,000) + (0.8630 × 10,000,000)] – 10,000,000 = 9,861,965 – 10,000,000 = –138,035 (difference due to rounding).<\/p><p>(Module 30.8, LOS 30.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Durham, CFA, is a senior manager in the structured bond department within Newton Capital Partners (NCP), an investment banking firm located in the United States. Durham has just returned from an international marketing campaign for NCP&#x27;s latest structured note offering, a series of equity-linked fixed-income securities or ELFS. The bonds will offer a 4.5% coupon paid annually along with the annual return on the S&amp;P 500 Index and will have a maturity of five years. The total face value of the ELFS series is expected to be $200 million.<\/p><p>Susan Jacobs, a fixed-income portfolio manager and principal with Smith &amp; Associates, has decided to include $10 million worth of ELFS in her fixed-income portfolio. At the end of the first year, however, the S&amp;P 500 Index value is 1,054, significantly lower than the initial value of 1,112 set by NCP at the time of the ELFS offering. Jacobs is concerned that the four remaining years of the ELFS life could have similar results and is considering her alternatives to offset the equity exposure of the ELFS position without selling the bonds. Jacobs decides to offset her portfolio&#x27;s exposure to the ELFS by entering into an equity-swap contract. The MRR term structure is shown in  Exhibit 1.<\/p><p>Exhibit 1: MRR Term Structure<\/p><div class=\"tbl\"><table><tr><td>MRR<\/td><td>Discount Factor<\/td><td><\/td><\/tr><tr><td>1-year<\/td><td>3.2%<\/td><td>0.9690<\/td><\/tr><tr><td>2-year<\/td><td>4.1%<\/td><td>0.9242<\/td><\/tr><tr><td>3-year<\/td><td>4.9%<\/td><td>0.8718<\/td><\/tr><tr><td>4-year<\/td><td>5.3%<\/td><td>0.8251<\/td><\/tr><\/table><\/div><p>To offset any credit risk associated with the equity swap, Widby recommends using an index trade strategy by entering into a credit default swap (CDS) as a protection buyer. Widby&#x27;s strategy would involve purchasing credit protection on an index comprising largely the same issuers (companies) included in the equity index underlying the swap. Widby suggests the CDS should have a maturity equal to that of the swap to provide maximum credit protection.<\/p><\/div><\/details><div class=\"qtext\"><p>If Jacobs enters into a $10 million 4-year 4.50% annual-pay fixed-rate equity swap as the equity return payer, what is the value to Jacob of the swap after one year (immediately after settlement) if the index has increased from 1,054 to 1,103, the MRR term structure is as given below, and the 3-year annual-pay swap fixed rate is currently 5.0%?<\/p><p>MRR<\/p><div class=\"tbl\"><table><tr><td>1-year:<\/td><td>4.10%<\/td><\/tr><tr><td>2-year:<\/td><td>4.70%<\/td><\/tr><tr><td>3-year:<\/td><td>5.29%<\/td><\/tr><\/table><\/div><\/div>","subj":"derivatives"},{"n":36,"q":"Which of the following best describes Widby's suggested use of credit default swaps to offset the credit risk of the equity swap? Widby's recommended strategy is:","opts":["correct.","incorrect, because the maturity of the CDS is not properly specified.","incorrect, because the CDS does not reference the proper credit risk."],"ans":"C","expl":"The credit risk underlying the equity swap is associated with the swap counterparty, not the companies in the equity index. This credit risk arises from the possibility that the counterparty to the swap will be unable or unwilling to make payments to Jacobs if the equity return is less than the fixed rate on the swap (i.e., the counterparty owes a payment to Jacobs). (Module 29.1, LOS 29.a)","explhtml":"<p>The credit risk underlying the equity swap is associated with the swap counterparty, not the companies in the equity index. This credit risk arises from the possibility that the counterparty to the swap will be unable or unwilling to make payments to Jacobs if the equity return is less than the fixed rate on the swap (i.e., the counterparty owes a payment to Jacobs). (Module 29.1, LOS 29.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Durham, CFA, is a senior manager in the structured bond department within Newton Capital Partners (NCP), an investment banking firm located in the United States. Durham has just returned from an international marketing campaign for NCP&#x27;s latest structured note offering, a series of equity-linked fixed-income securities or ELFS. The bonds will offer a 4.5% coupon paid annually along with the annual return on the S&amp;P 500 Index and will have a maturity of five years. The total face value of the ELFS series is expected to be $200 million.<\/p><p>Susan Jacobs, a fixed-income portfolio manager and principal with Smith &amp; Associates, has decided to include $10 million worth of ELFS in her fixed-income portfolio. At the end of the first year, however, the S&amp;P 500 Index value is 1,054, significantly lower than the initial value of 1,112 set by NCP at the time of the ELFS offering. Jacobs is concerned that the four remaining years of the ELFS life could have similar results and is considering her alternatives to offset the equity exposure of the ELFS position without selling the bonds. Jacobs decides to offset her portfolio&#x27;s exposure to the ELFS by entering into an equity-swap contract. The MRR term structure is shown in  Exhibit 1.<\/p><p>Exhibit 1: MRR Term Structure<\/p><div class=\"tbl\"><table><tr><td>MRR<\/td><td>Discount Factor<\/td><td><\/td><\/tr><tr><td>1-year<\/td><td>3.2%<\/td><td>0.9690<\/td><\/tr><tr><td>2-year<\/td><td>4.1%<\/td><td>0.9242<\/td><\/tr><tr><td>3-year<\/td><td>4.9%<\/td><td>0.8718<\/td><\/tr><tr><td>4-year<\/td><td>5.3%<\/td><td>0.8251<\/td><\/tr><\/table><\/div><p>To offset any credit risk associated with the equity swap, Widby recommends using an index trade strategy by entering into a credit default swap (CDS) as a protection buyer. Widby&#x27;s strategy would involve purchasing credit protection on an index comprising largely the same issuers (companies) included in the equity index underlying the swap. Widby suggests the CDS should have a maturity equal to that of the swap to provide maximum credit protection.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes Widby&#x27;s suggested use of credit default swaps to offset the credit risk of the equity swap? Widby&#x27;s recommended strategy is:<\/p><\/div>","subj":"derivatives"},{"n":37,"q":"Compared to a direct investment in real estate, an investment in a REIT is most likely to produce greater:","opts":["tax benefits.","operational control.","agency conflict."],"ans":"C","expl":"Relative to publicly traded securities, private investment provides direct exposure to the real estate class, returns dictated by property performance, tax benefits, inflation hedge, illiquidity premium, control, and lower correlation with other asset classes. However, private investments suffer from illiquidity, high fees and expenses, high minimum investment, low transparency, fewer regulatory protections for investors, and higher risk due to leverage.\nPublicly traded securities are attractive because they provide high liquidity, professional management, tax efficiency (REITs), diversification, low minimum investment, low entry/exit costs, regulatory protection for investors, and high transparency. However, they suffer from higher volatility, higher correlation with stocks, and agency conflict (for example, there may be conflicting interests between managers and investors).\n(Module 33.2, LOS 33.j)","explhtml":"<p>Relative to publicly traded securities, private investment provides direct exposure to the real estate class, returns dictated by property performance, tax benefits, inflation hedge, illiquidity premium, control, and lower correlation with other asset classes. However, private investments suffer from illiquidity, high fees and expenses, high minimum investment, low transparency, fewer regulatory protections for investors, and higher risk due to leverage.<\/p><p>Publicly traded securities are attractive because they provide high liquidity, professional management, tax efficiency (REITs), diversification, low minimum investment, low entry/exit costs, regulatory protection for investors, and high transparency. However, they suffer from higher volatility, higher correlation with stocks, and agency conflict (for example, there may be conflicting interests between managers and investors).<\/p><p>(Module 33.2, LOS 33.j)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Julian Fuentes, CFA, analyzes real estate investments for AI Partners (AIP), a private equity real estate investment firm. AIP prefers investments in publicly traded real estate securities to direct investments in real estate.<\/p><p>Radna Margulies, AIP&#x27;s Chief Investment Officer, asks Fuentes to focus on Axis, a multi-family REIT. This request is based on Margulies&#x27;s perception of pent-up demand in the housing market. Fuentes forecasts financial data for Axis as presented in Exhibit 1.<\/p><p>Exhibit 1: AXIS SELECTED FINANCIAL INFORMATION ($ millions)<\/p><div class=\"tbl\"><table><tr><td>Net Income<\/td><td>$85<\/td><\/tr><tr><td>Recurring maintenance type capex<\/td><td>$11<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$12<\/td><\/tr><tr><td>Gains/(losses) on sale of property<\/td><td>$5<\/td><\/tr><tr><td>Non-cash rent (straight line)<\/td><td>$5<\/td><\/tr><\/table><\/div><p>Axis has 10 million shares outstanding. Fuentes estimates that multifamily REITs trade at a P/FFO multiple of 12x and a P/AFFO of 15x. For valuation purposes, Margulies prefers to use a metric that is representative of the current economic income of a REIT; meaning, one that represents the funds available for distribution.<\/p><p>Fuentes mentions that a different metric for valuation values a REIT&#x27;s assets to a buyer in the private market, which can be quite different from the value public market investors would attach to the REIT.<\/p><\/div><\/details><div class=\"qtext\"><p>Compared to a direct investment in real estate, an investment in a REIT is most likely to produce greater:<\/p><\/div>","subj":"alternatives"},{"n":38,"q":"Based on the information in the case and  Exhibit 1, the valuation for a share of Axis REIT based on P/AFFO will be closest to:","opts":["$91.","$114.","$110."],"ans":"B","expl":"First calculate the FFO and then calculate the AFFO:\nNet income | $85\n(+) depreciation | 12\n(−) gain on sale | (5)\nFFO | $92\n(−) non-cash rent | (5)\n(−) recurring maintenance type capex | (11)\nAFFO | $76\nAFFO per share = 76/10 = $7.60 Value = 7.60 × 15 = $114 (Module 33.2, LOS 33.i)","explhtml":"<p>First calculate the FFO and then calculate the AFFO:<\/p><div class=\"tbl\"><table><tr><td>Net income<\/td><td>$85<\/td><\/tr><tr><td>(+) depreciation<\/td><td>12<\/td><\/tr><tr><td>(−) gain on sale<\/td><td>(5)<\/td><\/tr><tr><td>FFO<\/td><td>$92<\/td><\/tr><tr><td>(−) non-cash rent<\/td><td>(5)<\/td><\/tr><tr><td>(−) recurring maintenance type capex<\/td><td>(11)<\/td><\/tr><tr><td>AFFO<\/td><td>$76<\/td><\/tr><\/table><\/div><p>AFFO per share = 76/10 = $7.60 Value = 7.60 × 15 = $114 (Module 33.2, LOS 33.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Julian Fuentes, CFA, analyzes real estate investments for AI Partners (AIP), a private equity real estate investment firm. AIP prefers investments in publicly traded real estate securities to direct investments in real estate.<\/p><p>Radna Margulies, AIP&#x27;s Chief Investment Officer, asks Fuentes to focus on Axis, a multi-family REIT. This request is based on Margulies&#x27;s perception of pent-up demand in the housing market. Fuentes forecasts financial data for Axis as presented in Exhibit 1.<\/p><p>Exhibit 1: AXIS SELECTED FINANCIAL INFORMATION ($ millions)<\/p><div class=\"tbl\"><table><tr><td>Net Income<\/td><td>$85<\/td><\/tr><tr><td>Recurring maintenance type capex<\/td><td>$11<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$12<\/td><\/tr><tr><td>Gains/(losses) on sale of property<\/td><td>$5<\/td><\/tr><tr><td>Non-cash rent (straight line)<\/td><td>$5<\/td><\/tr><\/table><\/div><p>Axis has 10 million shares outstanding. Fuentes estimates that multifamily REITs trade at a P/FFO multiple of 12x and a P/AFFO of 15x. For valuation purposes, Margulies prefers to use a metric that is representative of the current economic income of a REIT; meaning, one that represents the funds available for distribution.<\/p><p>Fuentes mentions that a different metric for valuation values a REIT&#x27;s assets to a buyer in the private market, which can be quite different from the value public market investors would attach to the REIT.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information in the case and  Exhibit 1, the valuation for a share of Axis REIT based on P/AFFO will be closest to:<\/p><\/div>","subj":"alternatives"},{"n":39,"q":"Based on Margulies's focus on current economic income, the most appropriate metric to use to value a REIT is:","opts":["AFFO.","NOI.","FFO."],"ans":"A","expl":"Adjusted funds from operations (AFFO) is intended to serve as a useful representation of current economic income. AFFO is also known as cash available for distribution (CAD) or funds available for distribution (FAD).\n(Module 33.2, LOS 33.h)","explhtml":"<p>Adjusted funds from operations (AFFO) is intended to serve as a useful representation of current economic income. AFFO is also known as cash available for distribution (CAD) or funds available for distribution (FAD).<\/p><p>(Module 33.2, LOS 33.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Julian Fuentes, CFA, analyzes real estate investments for AI Partners (AIP), a private equity real estate investment firm. AIP prefers investments in publicly traded real estate securities to direct investments in real estate.<\/p><p>Radna Margulies, AIP&#x27;s Chief Investment Officer, asks Fuentes to focus on Axis, a multi-family REIT. This request is based on Margulies&#x27;s perception of pent-up demand in the housing market. Fuentes forecasts financial data for Axis as presented in Exhibit 1.<\/p><p>Exhibit 1: AXIS SELECTED FINANCIAL INFORMATION ($ millions)<\/p><div class=\"tbl\"><table><tr><td>Net Income<\/td><td>$85<\/td><\/tr><tr><td>Recurring maintenance type capex<\/td><td>$11<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$12<\/td><\/tr><tr><td>Gains/(losses) on sale of property<\/td><td>$5<\/td><\/tr><tr><td>Non-cash rent (straight line)<\/td><td>$5<\/td><\/tr><\/table><\/div><p>Axis has 10 million shares outstanding. Fuentes estimates that multifamily REITs trade at a P/FFO multiple of 12x and a P/AFFO of 15x. For valuation purposes, Margulies prefers to use a metric that is representative of the current economic income of a REIT; meaning, one that represents the funds available for distribution.<\/p><p>Fuentes mentions that a different metric for valuation values a REIT&#x27;s assets to a buyer in the private market, which can be quite different from the value public market investors would attach to the REIT.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Margulies&#x27;s focus on current economic income, the most appropriate metric to use to value a REIT is:<\/p><\/div>","subj":"alternatives"},{"n":40,"q":"To which metric is Fuentes most likely referring, when discussing valuation of a REIT's assets to a buyer in the private market?","opts":["P/FFO.","NAVPS.","P/AFFO."],"ans":"B","expl":"Net asset value per share is an indication of the value of a REIT's assets to a buyer in the private market. This can be quite different from the value public market investors (where valuations are based on P/FFO or P/AFFO) would attach to the REIT. For this reason, there have historically been significant differences (i.e., premiums or discounts) between NAVPS estimates, and the prices at which REITs actually trade.\n(Module 33.2, LOS 33.h)","explhtml":"<p>Net asset value per share is an indication of the value of a REIT&#x27;s assets to a buyer in the private market. This can be quite different from the value public market investors (where valuations are based on P/FFO or P/AFFO) would attach to the REIT. For this reason, there have historically been significant differences (i.e., premiums or discounts) between NAVPS estimates, and the prices at which REITs actually trade.<\/p><p>(Module 33.2, LOS 33.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Julian Fuentes, CFA, analyzes real estate investments for AI Partners (AIP), a private equity real estate investment firm. AIP prefers investments in publicly traded real estate securities to direct investments in real estate.<\/p><p>Radna Margulies, AIP&#x27;s Chief Investment Officer, asks Fuentes to focus on Axis, a multi-family REIT. This request is based on Margulies&#x27;s perception of pent-up demand in the housing market. Fuentes forecasts financial data for Axis as presented in Exhibit 1.<\/p><p>Exhibit 1: AXIS SELECTED FINANCIAL INFORMATION ($ millions)<\/p><div class=\"tbl\"><table><tr><td>Net Income<\/td><td>$85<\/td><\/tr><tr><td>Recurring maintenance type capex<\/td><td>$11<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$12<\/td><\/tr><tr><td>Gains/(losses) on sale of property<\/td><td>$5<\/td><\/tr><tr><td>Non-cash rent (straight line)<\/td><td>$5<\/td><\/tr><\/table><\/div><p>Axis has 10 million shares outstanding. Fuentes estimates that multifamily REITs trade at a P/FFO multiple of 12x and a P/AFFO of 15x. For valuation purposes, Margulies prefers to use a metric that is representative of the current economic income of a REIT; meaning, one that represents the funds available for distribution.<\/p><p>Fuentes mentions that a different metric for valuation values a REIT&#x27;s assets to a buyer in the private market, which can be quite different from the value public market investors would attach to the REIT.<\/p><\/div><\/details><div class=\"qtext\"><p>To which metric is Fuentes most likely referring, when discussing valuation of a REIT&#x27;s assets to a buyer in the private market?<\/p><\/div>","subj":"alternatives"},{"n":41,"q":"According to CFA Institute Standards of Professional Conduct, Gillis may accept the invitation to attend the conference in Binaria without violating the Standards:","opts":["so long as she pays her own travel expenses and refuses the gift of emeralds.","so long as she refuses the gift of emeralds.","because she would be the guest of a sovereign government."],"ans":"B","expl":"Standard I(B). Attending the conference would be appropriate, but Gillis must avoid any situation that would affect her independence in order to properly comply with Standard I(B) − Professionalism: Independence and Objectivity. Since Binaria is remotely located, it is reasonable for the government to pay her travel expenses. However, the gift of emeralds must be refused. The fact that the host is a sovereign government does not matter—the obvious objective is to give the analysts a favorable bias toward the currency and the proposed reforms. (Module 42.1, LOS 42.a)","explhtml":"<p>Standard I(B). Attending the conference would be appropriate, but Gillis must avoid any situation that would affect her independence in order to properly comply with Standard I(B) − Professionalism: Independence and Objectivity. Since Binaria is remotely located, it is reasonable for the government to pay her travel expenses. However, the gift of emeralds must be refused. The fact that the host is a sovereign government does not matter—the obvious objective is to give the analysts a favorable bias toward the currency and the proposed reforms. (Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will help support Binaria&#x27;s weakening currency. He is asking currency specialists from several of the largest foreign exchange banks to visit Binaria for a conference on the planned reforms. Because of its remote location, Binaria will pay all travel expenses of the attendees, as well as lodging in government-owned facilities in the capital city. As a further inducement, attendees will also receive small bags of uncut emeralds (because emeralds are a principal export of Binaria), with an estimated market value of $500.<\/p><p>Gillis has approximately 25 clients that she deals with regularly, most of whom are large financial institutions interested in trading currencies. One of the services Gillis provides to these clients is a weekly summary of important trends in the emerging market currencies she follows. Gillis talks to local government officials and reads research reports prepared by local analysts, which are paid for by Trent. These inputs, along with Gillis&#x27;s interpretation, form the basis of most of Gillis&#x27;s weekly reports. Gillis decided to attend the conference in Binaria. In anticipation of a favorable reception for the proposed reforms, Gillis purchased a long Binaria currency position in her personal account before leaving on the trip. After hearing the finance minister&#x27;s proposals in person, however, she decides that the reforms are poorly timed and likely to cause the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gary Flint, Gillis&#x27;s supervisor, suspects that Gillis may have violated the firm&#x27;s policy on personal trading.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, Gillis may accept the invitation to attend the conference in Binaria without violating the Standards:<\/p><\/div>","subj":"ethics"},{"n":42,"q":"Given that Gillis's weekly reports to clients are market summaries rather than specific investment recommendations, what are her record-keeping obligations according to CFA Institute Standards of Professional Conduct? Gillis must:","opts":["maintain records of her conversations with local government officials and also keep copies of the research reports prepared by local analysts.","only maintain records of her conversations with local government officials and her own summaries of the research reports prepared by local analysts.","keep her own summaries of the research reports prepared by local analysts, but she has no obligation to maintain records of her conversations with local government officials."],"ans":"A","expl":"Standard V(C). Gillis's reports may not be specific investment recommendations, but because they are client communications, she should keep either electronic or hard copy records of her conversations with the government officials and copies of the research reports she used in developing her weekly summary reports, in order to comply with Standard V(C) − Investment Analysis, Recommendations, and Actions: Record Retention. (Module 42.8, LOS 42.a)","explhtml":"<p>Standard V(C). Gillis&#x27;s reports may not be specific investment recommendations, but because they are client communications, she should keep either electronic or hard copy records of her conversations with the government officials and copies of the research reports she used in developing her weekly summary reports, in order to comply with Standard V(C) − Investment Analysis, Recommendations, and Actions: Record Retention. (Module 42.8, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will help support Binaria&#x27;s weakening currency. He is asking currency specialists from several of the largest foreign exchange banks to visit Binaria for a conference on the planned reforms. Because of its remote location, Binaria will pay all travel expenses of the attendees, as well as lodging in government-owned facilities in the capital city. As a further inducement, attendees will also receive small bags of uncut emeralds (because emeralds are a principal export of Binaria), with an estimated market value of $500.<\/p><p>Gillis has approximately 25 clients that she deals with regularly, most of whom are large financial institutions interested in trading currencies. One of the services Gillis provides to these clients is a weekly summary of important trends in the emerging market currencies she follows. Gillis talks to local government officials and reads research reports prepared by local analysts, which are paid for by Trent. These inputs, along with Gillis&#x27;s interpretation, form the basis of most of Gillis&#x27;s weekly reports. Gillis decided to attend the conference in Binaria. In anticipation of a favorable reception for the proposed reforms, Gillis purchased a long Binaria currency position in her personal account before leaving on the trip. After hearing the finance minister&#x27;s proposals in person, however, she decides that the reforms are poorly timed and likely to cause the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gary Flint, Gillis&#x27;s supervisor, suspects that Gillis may have violated the firm&#x27;s policy on personal trading.<\/p><\/div><\/details><div class=\"qtext\"><p>Given that Gillis&#x27;s weekly reports to clients are market summaries rather than specific investment recommendations, what are her record-keeping obligations according to CFA Institute Standards of Professional Conduct? Gillis must:<\/p><\/div>","subj":"ethics"},{"n":43,"q":"Regarding Gillis's transactions in the Binaria currency, she has violated the Standards by:","opts":["taking the long position and by selling the position before issuing a recommendation to clients.","selling the position before issuing the recommendation to clients, although taking the long position was not a violation.","not disclosing the trades in her report because the trades are acceptable as long as they are disclosed."],"ans":"A","expl":"Standard VI(B). Gillis is attempting to trade ahead of her employer and her clients in violation of the Standards. She was wrong to take the long position in anticipation of a positive recommendation and wrong to sell the position before issuing her negative recommendation. These trades were wrong regardless of whether they were disclosed. In accordance with Standard VI(B) − Conflicts of Interest: Priority of Transactions, client interests must take precedence over personal interests. (Module 42.9, LOS 42.a)","explhtml":"<p>Standard VI(B). Gillis is attempting to trade ahead of her employer and her clients in violation of the Standards. She was wrong to take the long position in anticipation of a positive recommendation and wrong to sell the position before issuing her negative recommendation. These trades were wrong regardless of whether they were disclosed. In accordance with Standard VI(B) − Conflicts of Interest: Priority of Transactions, client interests must take precedence over personal interests. (Module 42.9, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will help support Binaria&#x27;s weakening currency. He is asking currency specialists from several of the largest foreign exchange banks to visit Binaria for a conference on the planned reforms. Because of its remote location, Binaria will pay all travel expenses of the attendees, as well as lodging in government-owned facilities in the capital city. As a further inducement, attendees will also receive small bags of uncut emeralds (because emeralds are a principal export of Binaria), with an estimated market value of $500.<\/p><p>Gillis has approximately 25 clients that she deals with regularly, most of whom are large financial institutions interested in trading currencies. One of the services Gillis provides to these clients is a weekly summary of important trends in the emerging market currencies she follows. Gillis talks to local government officials and reads research reports prepared by local analysts, which are paid for by Trent. These inputs, along with Gillis&#x27;s interpretation, form the basis of most of Gillis&#x27;s weekly reports. Gillis decided to attend the conference in Binaria. In anticipation of a favorable reception for the proposed reforms, Gillis purchased a long Binaria currency position in her personal account before leaving on the trip. After hearing the finance minister&#x27;s proposals in person, however, she decides that the reforms are poorly timed and likely to cause the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gary Flint, Gillis&#x27;s supervisor, suspects that Gillis may have violated the firm&#x27;s policy on personal trading.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Gillis&#x27;s transactions in the Binaria currency, she has violated the Standards by:<\/p><\/div>","subj":"ethics"},{"n":44,"q":"According to CFA Institute Standards of Professional Conduct, Flint's best course of action with regard to the suspected violations by Gillis would be to:","opts":["meet with Gillis in person, explain the nature of the violations, and seek assurances that such violations will not recur.","warn Gillis to cease the trading activities and report the violation to Flint’s supervisor immediately.","place limits on Gillis’s personal trading and increase monitoring of Gillis’s personal trades."],"ans":"C","expl":"Standard IV(C). Warning Gillis and/or reporting the violation up Trout's management structure are inadequate solutions. Limiting the trading activity and increased monitoring to prevent future violations are more appropriate initial responses, in accordance with Standard IV(C) − Responsibilities of Supervisors. (Module 42.1, LOS 42.a)","explhtml":"<p>Standard IV(C). Warning Gillis and/or reporting the violation up Trout&#x27;s management structure are inadequate solutions. Limiting the trading activity and increased monitoring to prevent future violations are more appropriate initial responses, in accordance with Standard IV(C) − Responsibilities of Supervisors. (Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will help support Binaria&#x27;s weakening currency. He is asking currency specialists from several of the largest foreign exchange banks to visit Binaria for a conference on the planned reforms. Because of its remote location, Binaria will pay all travel expenses of the attendees, as well as lodging in government-owned facilities in the capital city. As a further inducement, attendees will also receive small bags of uncut emeralds (because emeralds are a principal export of Binaria), with an estimated market value of $500.<\/p><p>Gillis has approximately 25 clients that she deals with regularly, most of whom are large financial institutions interested in trading currencies. One of the services Gillis provides to these clients is a weekly summary of important trends in the emerging market currencies she follows. Gillis talks to local government officials and reads research reports prepared by local analysts, which are paid for by Trent. These inputs, along with Gillis&#x27;s interpretation, form the basis of most of Gillis&#x27;s weekly reports. Gillis decided to attend the conference in Binaria. In anticipation of a favorable reception for the proposed reforms, Gillis purchased a long Binaria currency position in her personal account before leaving on the trip. After hearing the finance minister&#x27;s proposals in person, however, she decides that the reforms are poorly timed and likely to cause the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gary Flint, Gillis&#x27;s supervisor, suspects that Gillis may have violated the firm&#x27;s policy on personal trading.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, Flint&#x27;s best course of action with regard to the suspected violations by Gillis would be to:<\/p><\/div>","subj":"ethics"}];
const CFG = {"title": "Schweser Mock 3 (2025) — Session 1", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

</div>
<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
