 rate, decreasing the COGS. For instance, if the COGS in the local currency is 10 and the historical and average exchange rates are 1 and 1.5 (local currency per reporting currency), then COGS under the temporal method will be 10 and under the current rate method will be 6.67. Since translated sales are the same under both methods, gross profit and the gross profit margin will be higher under the current rate method. (Module 10.6, LOS 10.f)","explhtml":"<p>Under both the current rate and temporal methods, the revenues for the Ukrainian subsidiary should be translated using the average rate. Cost of goods sold (COGS) should be translated using the historical rate for the temporal method and the average rate for the current rate method. Note that because local currency prices are expected to be constant in Ukraine, there will be no difference between LIFO and FIFO since all beginning, purchased, sold, and ending inventory will have the same cost. When a currency is depreciating, the COGS based on historical cost (temporal method) will be higher than COGS translated at the average rate (current rate method) since the average rate will incorporate the historical exchange rate and the most recent (depreciated) exchange rate, decreasing the COGS. For instance, if the COGS in the local currency is 10 and the historical and average exchange rates are 1 and 1.5 (local currency per reporting currency), then COGS under the temporal method will be 10 and under the current rate method will be 6.67. Since translated sales are the same under both methods, gross profit and the gross profit margin will be higher under the current rate method. (Module 10.6, LOS 10.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dipesh Ganatra, CFA, is an equity analyst at Mahavir Securities Ltd. Ganatra is reviewing the financial statements of Parichay Industries, a diverse conglomerate headquartered in India. Ganatra is particularly concerned about the quality of Parichay&#x27;s earnings.<\/p><p>Ganatra decides to analyze Parichay&#x27;s accrual ratios using the balance sheet approach. The table below contains the last three years of accrual ratios for Parichay, as well as the industry average.<\/p><p>Exhibit 1: Accrual ratios for Parichay<\/p><div class=\"tbl\"><table><tr><td>Balance Sheet Accrual Ratios<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><\/tr><tr><td>Parichay<\/td><td>4.5%<\/td><td>15.0%<\/td><td>7.0%<\/td><\/tr><tr><td>Industry average<\/td><td>4.8%<\/td><td>4.4%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Ganatra has learned that Parichay has a small subsidiary in Ukraine. The subsidiary follows IFRS and uses FIFO inventory accounting. The Ukrainian subsidiary was acquired 10 years ago and has been fully integrated into Parichay&#x27;s operations. Parichay obtains funding for the subsidiary whenever the company finds profitable investments within Ukraine or neighboring countries. According to forecasts from economists, the Ukrainian Hryvnia is expected to depreciate relative to the Indian Rupee over the next few years. Ukrainian local currency prices are forecast to remain stable, however.<\/p><p>One of the managers at Mahavir has asked Ganatra to analyze another Parichay subsidiary, this one located in Pakistan. The manager explains that real interest rates in Pakistan over the past three years have been 2.00%, 2.50%, and 3.00%, respectively, while nominal interest rates have been 34.64%, 29.15%, and 25.66%, respectively. Ganatra requests more time to analyze the Pakistani subsidiary.<\/p><p>Ganatra meets an old colleague, Riteish Shah, for lunch. Shah specializes in the insurance industry and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>P&amp;C insurers&#x27; liability duration is generally shorter than that of life insurance companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Analysis of a life insurer&#x27;s profitability includes analysis of its loss reserves.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following statements regarding the consolidation of Parichay&#x27;s Ukrainian subsidiary for the next year is least likely correct? Compared to the temporal method, the Ukrainian subsidiary&#x27;s translated:<\/p><\/div>","subj":"fsa"},{"n":15,"q":"Which of the following statements related to the consolidation of Parichay's Pakistani subsidiary is least likely correct?","opts":["The Pakistani economic environment meets the criteria to be classified as a hyperinflationary economy.","IFRS would allow Parichay to translate the inflation-indexed value of nonmonetary assets of the Pakistani subsidiary at the current exchange rate.","Parichay can reduce potential translation losses from the Pakistani subsidiary by issuing debt denominated in the Indian currency and purchasing fixed assets for the subsidiary."],"ans":"C","expl":"A hyperinflationary economy is characterized by a 3-year cumulative inflation rate exceeding 100%. The inflation rate over the past three years can be calculated as follows:\nyear 1 inflation = [(1 + 0.3464) / (1 + 0.020)] − 1 = 32%\nyear 2 inflation = [(1 + 0.2915) / (1 + 0.025)] − 1 = 26%\nyear 3 inflation = [(1 + 0.2566) / (1 + 0.030)] − 1 = 22%\ncumulative 3-year inflation = (1.32)(1.26)(1.22) − 1 = 103%\nHence, the Pakistani economy could be characterized as hyperinflationary. U.S. GAAP allows the use of the temporal method, with the functional currency being the parent's reporting currency, when a foreign subsidiary is operating in a hyperinflationary environment. IFRS accounting standards allow the parent to translate an inflation-adjusted value of the nonmonetary assets and liabilities of the foreign subsidiary at the current inflation rate, removing most of the effects of high inflation on the value of the nonmonetary assets and liabilities in the reporting currency. In a hyperinflationary environment, the parent company can reduce translation losses by reducing its net monetary assets or increasing its net monetary liabilities. In order to do this, the parent should issue debt denominated in the subsidiary's local currency and invest the proceeds in fixed assets for the subsidiary to use in its operations. (Module 10.7, LOS 10.g)","explhtml":"<p>A hyperinflationary economy is characterized by a 3-year cumulative inflation rate exceeding 100%. The inflation rate over the past three years can be calculated as follows:<\/p><p>year 1 inflation = [(1 + 0.3464) / (1 + 0.020)] − 1 = 32%<\/p><p>year 2 inflation = [(1 + 0.2915) / (1 + 0.025)] − 1 = 26%<\/p><p>year 3 inflation = [(1 + 0.2566) / (1 + 0.030)] − 1 = 22%<\/p><p>cumulative 3-year inflation = (1.32)(1.26)(1.22) − 1 = 103%<\/p><p>Hence, the Pakistani economy could be characterized as hyperinflationary. U.S. GAAP allows the use of the temporal method, with the functional currency being the parent&#x27;s reporting currency, when a foreign subsidiary is operating in a hyperinflationary environment. IFRS accounting standards allow the parent to translate an inflation-adjusted value of the nonmonetary assets and liabilities of the foreign subsidiary at the current inflation rate, removing most of the effects of high inflation on the value of the nonmonetary assets and liabilities in the reporting currency. In a hyperinflationary environment, the parent company can reduce translation losses by reducing its net monetary assets or increasing its net monetary liabilities. In order to do this, the parent should issue debt denominated in the subsidiary&#x27;s local currency and invest the proceeds in fixed assets for the subsidiary to use in its operations. (Module 10.7, LOS 10.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dipesh Ganatra, CFA, is an equity analyst at Mahavir Securities Ltd. Ganatra is reviewing the financial statements of Parichay Industries, a diverse conglomerate headquartered in India. Ganatra is particularly concerned about the quality of Parichay&#x27;s earnings.<\/p><p>Ganatra decides to analyze Parichay&#x27;s accrual ratios using the balance sheet approach. The table below contains the last three years of accrual ratios for Parichay, as well as the industry average.<\/p><p>Exhibit 1: Accrual ratios for Parichay<\/p><div class=\"tbl\"><table><tr><td>Balance Sheet Accrual Ratios<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><\/tr><tr><td>Parichay<\/td><td>4.5%<\/td><td>15.0%<\/td><td>7.0%<\/td><\/tr><tr><td>Industry average<\/td><td>4.8%<\/td><td>4.4%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Ganatra has learned that Parichay has a small subsidiary in Ukraine. The subsidiary follows IFRS and uses FIFO inventory accounting. The Ukrainian subsidiary was acquired 10 years ago and has been fully integrated into Parichay&#x27;s operations. Parichay obtains funding for the subsidiary whenever the company finds profitable investments within Ukraine or neighboring countries. According to forecasts from economists, the Ukrainian Hryvnia is expected to depreciate relative to the Indian Rupee over the next few years. Ukrainian local currency prices are forecast to remain stable, however.<\/p><p>One of the managers at Mahavir has asked Ganatra to analyze another Parichay subsidiary, this one located in Pakistan. The manager explains that real interest rates in Pakistan over the past three years have been 2.00%, 2.50%, and 3.00%, respectively, while nominal interest rates have been 34.64%, 29.15%, and 25.66%, respectively. Ganatra requests more time to analyze the Pakistani subsidiary.<\/p><p>Ganatra meets an old colleague, Riteish Shah, for lunch. Shah specializes in the insurance industry and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>P&amp;C insurers&#x27; liability duration is generally shorter than that of life insurance companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Analysis of a life insurer&#x27;s profitability includes analysis of its loss reserves.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following statements related to the consolidation of Parichay&#x27;s Pakistani subsidiary is least likely correct?<\/p><\/div>","subj":"fsa"},{"n":16,"q":"Which of Shah's statements about insurance companies is most accurate?","opts":["Only Statement 1 is correct.","Only Statement 2 is correct.","Both statements are correct."],"ans":"A","expl":"Only Statement 1 is correct. P&C policies (and hence, claim liabilities) tend to be short-term, compared to relatively long-term life insurance policies. Statement 2 is incorrect because evaluation of loss reserves is important for P&C insurers' profitability. (Module 11.6, LOS 11.f)","explhtml":"<p>Only Statement 1 is correct. P&amp;C policies (and hence, claim liabilities) tend to be short-term, compared to relatively long-term life insurance policies. Statement 2 is incorrect because evaluation of loss reserves is important for P&amp;C insurers&#x27; profitability. (Module 11.6, LOS 11.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dipesh Ganatra, CFA, is an equity analyst at Mahavir Securities Ltd. Ganatra is reviewing the financial statements of Parichay Industries, a diverse conglomerate headquartered in India. Ganatra is particularly concerned about the quality of Parichay&#x27;s earnings.<\/p><p>Ganatra decides to analyze Parichay&#x27;s accrual ratios using the balance sheet approach. The table below contains the last three years of accrual ratios for Parichay, as well as the industry average.<\/p><p>Exhibit 1: Accrual ratios for Parichay<\/p><div class=\"tbl\"><table><tr><td>Balance Sheet Accrual Ratios<\/td><td>20X8<\/td><td>20X7<\/td><td>20X6<\/td><\/tr><tr><td>Parichay<\/td><td>4.5%<\/td><td>15.0%<\/td><td>7.0%<\/td><\/tr><tr><td>Industry average<\/td><td>4.8%<\/td><td>4.4%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Ganatra has learned that Parichay has a small subsidiary in Ukraine. The subsidiary follows IFRS and uses FIFO inventory accounting. The Ukrainian subsidiary was acquired 10 years ago and has been fully integrated into Parichay&#x27;s operations. Parichay obtains funding for the subsidiary whenever the company finds profitable investments within Ukraine or neighboring countries. According to forecasts from economists, the Ukrainian Hryvnia is expected to depreciate relative to the Indian Rupee over the next few years. Ukrainian local currency prices are forecast to remain stable, however.<\/p><p>One of the managers at Mahavir has asked Ganatra to analyze another Parichay subsidiary, this one located in Pakistan. The manager explains that real interest rates in Pakistan over the past three years have been 2.00%, 2.50%, and 3.00%, respectively, while nominal interest rates have been 34.64%, 29.15%, and 25.66%, respectively. Ganatra requests more time to analyze the Pakistani subsidiary.<\/p><p>Ganatra meets an old colleague, Riteish Shah, for lunch. Shah specializes in the insurance industry and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>P&amp;C insurers&#x27; liability duration is generally shorter than that of life insurance companies.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Analysis of a life insurer&#x27;s profitability includes analysis of its loss reserves.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of Shah&#x27;s statements about insurance companies is most accurate?<\/p><\/div>","subj":"fsa"},{"n":17,"q":"Which of the following factors most likely supports a high dividend payout for Diamond Mining? Diamond's:","opts":["growth rate.","EPS volatility.","new equity flotation costs."],"ans":"B","expl":"Payouts tend to be lower for firms with volatile earnings; however, we are told that Diamond has relatively stable EPS. Payouts also tend to be lower for firms experiencing rapid growth (and significant need for reinvestment of earnings), as well as for firms with high flotation costs.\n(Module 15.1, LOS 15.a)","explhtml":"<p>Payouts tend to be lower for firms with volatile earnings; however, we are told that Diamond has relatively stable EPS. Payouts also tend to be lower for firms experiencing rapid growth (and significant need for reinvestment of earnings), as well as for firms with high flotation costs.<\/p><p>(Module 15.1, LOS 15.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Meredith Chase, CFA works for Diamond Mining Inc. Diamond has grown rapidly over the past several years. Despite this rapid growth, Diamond&#x27;s EPS has been relatively stable. Since most of Diamond stock is held by the family of the company&#x27;s founder, the free float of Diamond stock is low and the flotation cost for new equity is high.<\/p><p>Diamond is planning to execute a reverse stock split to increase the price of Diamond stock to a more marketable range.<\/p><p>Diamond&#x27;s board is interested in a possible takeover of Copper Inc. Chase has been asked to do an ESG risk factor analysis on Copper.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following factors most likely supports a high dividend payout for Diamond Mining? Diamond&#x27;s:<\/p><\/div>","subj":"corporate"},{"n":18,"q":"Which of the following statements is most accurate regarding the proposed reverse stock split plan? A reverse stock split:","opts":["will reduce Diamond's leverage.","will not affect the company's leverage.","will reduce the shareholders' tax liabilities."],"ans":"B","expl":"Reverse stock splits increase the share price and reduce the number of shares outstanding. However, they do not affect the book value of equity (or leverage), nor do they affect the cost basis (or tax liabilities) of shareholders.\n(Module 15.1, LOS 15.a)","explhtml":"<p>Reverse stock splits increase the share price and reduce the number of shares outstanding. However, they do not affect the book value of equity (or leverage), nor do they affect the cost basis (or tax liabilities) of shareholders.<\/p><p>(Module 15.1, LOS 15.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Meredith Chase, CFA works for Diamond Mining Inc. Diamond has grown rapidly over the past several years. Despite this rapid growth, Diamond&#x27;s EPS has been relatively stable. Since most of Diamond stock is held by the family of the company&#x27;s founder, the free float of Diamond stock is low and the flotation cost for new equity is high.<\/p><p>Diamond is planning to execute a reverse stock split to increase the price of Diamond stock to a more marketable range.<\/p><p>Diamond&#x27;s board is interested in a possible takeover of Copper Inc. Chase has been asked to do an ESG risk factor analysis on Copper.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements is most accurate regarding the proposed reverse stock split plan? A reverse stock split:<\/p><\/div>","subj":"corporate"},{"n":19,"q":"Diamond's ownership structure is most accurately described as:","opts":["concentrated ownership and concentrated voting power.","concentrated ownership and dispersed voting power.","dispersed ownership and dispersed voting power."],"ans":"A","expl":"Most of the stock is held by the company's founder and hence the ownership is concentrated. We are not given information on any voting cap associated with the shares held by the founder so voting is also concentrated. (Module 16.1, LOS 16.a)","explhtml":"<p>Most of the stock is held by the company&#x27;s founder and hence the ownership is concentrated. We are not given information on any voting cap associated with the shares held by the founder so voting is also concentrated. (Module 16.1, LOS 16.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Meredith Chase, CFA works for Diamond Mining Inc. Diamond has grown rapidly over the past several years. Despite this rapid growth, Diamond&#x27;s EPS has been relatively stable. Since most of Diamond stock is held by the family of the company&#x27;s founder, the free float of Diamond stock is low and the flotation cost for new equity is high.<\/p><p>Diamond is planning to execute a reverse stock split to increase the price of Diamond stock to a more marketable range.<\/p><p>Diamond&#x27;s board is interested in a possible takeover of Copper Inc. Chase has been asked to do an ESG risk factor analysis on Copper.<\/p><\/div><\/details><div class=\"qtext\"><p>Diamond&#x27;s ownership structure is most accurately described as:<\/p><\/div>","subj":"corporate"},{"n":20,"q":"Which of the following statements about ESG analysis is least accurate?","opts":["The materiality of ESG risk factors is not important.","Fixed-income analysts usually will focus on ESG factors’ downside impact.","Issues that are likely to have a financial impact on the firm only over the long term may be of little concern for short-term investors."],"ans":"A","expl":"ESG risk factors are evaluated for materiality and time horizon. Issues that are likely to have a financial impact over the long term may be of little concern for short-term investors. Fixed-income analysts usually focus on downside risk while equity analysts evaluate both the downside and upside impacts of ESG factors and adjust the discount rate appropriately. (Module 16.2, LOS 16.c)","explhtml":"<p>ESG risk factors are evaluated for materiality and time horizon. Issues that are likely to have a financial impact over the long term may be of little concern for short-term investors. Fixed-income analysts usually focus on downside risk while equity analysts evaluate both the downside and upside impacts of ESG factors and adjust the discount rate appropriately. (Module 16.2, LOS 16.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Meredith Chase, CFA works for Diamond Mining Inc. Diamond has grown rapidly over the past several years. Despite this rapid growth, Diamond&#x27;s EPS has been relatively stable. Since most of Diamond stock is held by the family of the company&#x27;s founder, the free float of Diamond stock is low and the flotation cost for new equity is high.<\/p><p>Diamond is planning to execute a reverse stock split to increase the price of Diamond stock to a more marketable range.<\/p><p>Diamond&#x27;s board is interested in a possible takeover of Copper Inc. Chase has been asked to do an ESG risk factor analysis on Copper.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements about ESG analysis is least accurate?<\/p><\/div>","subj":"corporate"},{"n":21,"q":"Using the information in  Exhibit 1, estimate the P/E ratio for Flavia Stores using EPS estimated with the method of historical average EPS. The P/E ratio is closest to:","opts":["18.4.","20.6.","27.9."],"ans":"B","expl":"Normalizing EPS using the method of average EPS is accomplished by averaging the EPS over the six-year period from 2010–2015:\nEPS(normalized) = (1.90 + 1.65 + 0.99 + 1.35 + 0.77 + 1.04) / 6 = 1.283. The P/E ratio based on this normalized EPS is 26.5 / 1.283 = 20.649. (Module 22.4, LOS 22.e)","explhtml":"<p>Normalizing EPS using the method of average EPS is accomplished by averaging the EPS over the six-year period from 2010–2015:<\/p><p>EPS(normalized) = (1.90 + 1.65 + 0.99 + 1.35 + 0.77 + 1.04) / 6 = 1.283. The P/E ratio based on this normalized EPS is 26.5 / 1.283 = 20.649. (Module 22.4, LOS 22.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Arnaud Aims is assisting with the analysis of several firms in the retail department store industry. Because one of the industry members, Flavia Stores, has negative earnings for the current year, Aims wishes to normalize earnings to establish more meaningful P/E ratios. For the current year (2016) and six previous years, selected financial data are given below. All data are in euros.<\/p><p>Exhibit 1: Selected Financial Data for Flavia Stores, 2010–2016<\/p><div class=\"tbl\"><table><tr><td>2016<\/td><td>2015<\/td><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td>2010<\/td><td><\/td><\/tr><tr><td>Earnings per share<\/td><td>(1.05)<\/td><td>1.90<\/td><td>1.65<\/td><td>0.99<\/td><td>1.35<\/td><td>0.77<\/td><td>1.04<\/td><\/tr><tr><td>Book value per share<\/td><td>9.11<\/td><td>10.66<\/td><td>9.26<\/td><td>8.11<\/td><td>7.62<\/td><td>6.77<\/td><td>6.50<\/td><\/tr><tr><td>Return on equity<\/td><td>(0.115)<\/td><td>0.178<\/td><td>0.178<\/td><td>0.122<\/td><td>0.177<\/td><td>0.114<\/td><td>0.160<\/td><\/tr><\/table><\/div><p>Aims wishes to estimate normalized EPS for 2016 using two different methods, the method of historical average EPS and the method of average rate of return on equity. He will leave 2016 EPS and ROI out of his estimates. Based on his normalized EPS estimates, he will compute a trailing P/E for 2016. The stock price for Flavia Stores is €26.50.<\/p><p>Aims is also looking at price-to-book ratios as an alternative to price-to-earnings ratios. Three of the advantages of P/B ratios that Aims recalls are as follows:<\/p><div class=\"tbl\"><table><tr><td>Advantage 1:<\/td><td>Book value is more stable than EPS.<\/td><\/tr><tr><td>Advantage 2:<\/td><td>For many companies, human capital is more important than physical capital as an operating asset.<\/td><\/tr><tr><td>Advantage 3:<\/td><td>Book value per share accounts for size differences between companies.<\/td><\/tr><\/table><\/div><p>Aims used a constant growth DDM to establish a justified P/E ratio based on forecasted fundamentals. One of his associates asked Aims whether he could easily establish a justified price-to-sales (P/S) ratio and price-to-book (P/B) ratio from his justified P/E ratio.<\/p><p>Aims replied, &quot;I could do this fairly easily. If I multiply the trailing P/E ratio times the net profit margin, the ratio of net income to sales, the result will be the P/S ratio. If I multiply the leading P/E ratio times the return on equity, the ratio of net income to beginning book value of equity, the result will be the P/B ratio.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in  Exhibit 1, estimate the P/E ratio for Flavia Stores using EPS estimated with the method of historical average EPS. The P/E ratio is closest to:<\/p><\/div>","subj":"equity"},{"n":22,"q":"Using the information in  Exhibit 1, estimate the P/E ratio for Flavia Stores using EPS estimated with the method of average return on equity. The P/E ratio is closest to:","opts":["16.0.","18.8.","25.0."],"ans":"A","expl":"Normalizing EPS (for 2016) using the method of average return on equity is accomplished by (1) averaging the ROE over the six-year period from 2010−2015, and then (2) multiplying the average ROE times the 2015 BVPS. ROE(average) = (0.178 + 0.178 + 0.122 + 0.177 + 0.114 + 0.160) / 6 = 0.155. EPS(normalized) = 0.155(10.66) = 1.652. The P/E ratio based on this normalized EPS is 26.5 / 1.652 = 16.04. (Module 22.4, LOS 22.e)","explhtml":"<p>Normalizing EPS (for 2016) using the method of average return on equity is accomplished by (1) averaging the ROE over the six-year period from 2010−2015, and then (2) multiplying the average ROE times the 2015 BVPS. ROE(average) = (0.178 + 0.178 + 0.122 + 0.177 + 0.114 + 0.160) / 6 = 0.155. EPS(normalized) = 0.155(10.66) = 1.652. The P/E ratio based on this normalized EPS is 26.5 / 1.652 = 16.04. (Module 22.4, LOS 22.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Arnaud Aims is assisting with the analysis of several firms in the retail department store industry. Because one of the industry members, Flavia Stores, has negative earnings for the current year, Aims wishes to normalize earnings to establish more meaningful P/E ratios. For the current year (2016) and six previous years, selected financial data are given below. All data are in euros.<\/p><p>Exhibit 1: Selected Financial Data for Flavia Stores, 2010–2016<\/p><div class=\"tbl\"><table><tr><td>2016<\/td><td>2015<\/td><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td>2010<\/td><td><\/td><\/tr><tr><td>Earnings per share<\/td><td>(1.05)<\/td><td>1.90<\/td><td>1.65<\/td><td>0.99<\/td><td>1.35<\/td><td>0.77<\/td><td>1.04<\/td><\/tr><tr><td>Book value per share<\/td><td>9.11<\/td><td>10.66<\/td><td>9.26<\/td><td>8.11<\/td><td>7.62<\/td><td>6.77<\/td><td>6.50<\/td><\/tr><tr><td>Return on equity<\/td><td>(0.115)<\/td><td>0.178<\/td><td>0.178<\/td><td>0.122<\/td><td>0.177<\/td><td>0.114<\/td><td>0.160<\/td><\/tr><\/table><\/div><p>Aims wishes to estimate normalized EPS for 2016 using two different methods, the method of historical average EPS and the method of average rate of return on equity. He will leave 2016 EPS and ROI out of his estimates. Based on his normalized EPS estimates, he will compute a trailing P/E for 2016. The stock price for Flavia Stores is €26.50.<\/p><p>Aims is also looking at price-to-book ratios as an alternative to price-to-earnings ratios. Three of the advantages of P/B ratios that Aims recalls are as follows:<\/p><div class=\"tbl\"><table><tr><td>Advantage 1:<\/td><td>Book value is more stable than EPS.<\/td><\/tr><tr><td>Advantage 2:<\/td><td>For many companies, human capital is more important than physical capital as an operating asset.<\/td><\/tr><tr><td>Advantage 3:<\/td><td>Book value per share accounts for size differences between companies.<\/td><\/tr><\/table><\/div><p>Aims used a constant growth DDM to establish a justified P/E ratio based on forecasted fundamentals. One of his associates asked Aims whether he could easily establish a justified price-to-sales (P/S) ratio and price-to-book (P/B) ratio from his justified P/E ratio.<\/p><p>Aims replied, &quot;I could do this fairly easily. If I multiply the trailing P/E ratio times the net profit margin, the ratio of net income to sales, the result will be the P/S ratio. If I multiply the leading P/E ratio times the return on equity, the ratio of net income to beginning book value of equity, the result will be the P/B ratio.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in  Exhibit 1, estimate the P/E ratio for Flavia Stores using EPS estimated with the method of average return on equity. The P/E ratio is closest to:<\/p><\/div>","subj":"equity"},{"n":23,"q":"Which one of the three advantages recalled by Aims is the most appropriate reason to consider using a P/B ratio?","opts":["Advantage 1.","Advantage 2.","Advantage 3."],"ans":"A","expl":"Book value is more stable than EPS, so P/B may be more useful than P/E when EPS is particularly high, low, or volatile.\nP/Bs do not reflect the value of intangible economic assets, and hence would be inappropriate for evaluating companies with significant human capital. P/Bs can be misleading when there are significant differences in the asset size of the firms under consideration because in some cases the firm's business model dictates the size of its asset base. A firm that outsources its production will have fewer assets, lower book value, and a higher P/B ratio than an otherwise similar firm in the same industry that doesn't outsource. (Module 22.1, LOS 22.c)(Module 22.1, LOS 22.d)","explhtml":"<p>Book value is more stable than EPS, so P/B may be more useful than P/E when EPS is particularly high, low, or volatile.<\/p><p>P/Bs do not reflect the value of intangible economic assets, and hence would be inappropriate for evaluating companies with significant human capital. P/Bs can be misleading when there are significant differences in the asset size of the firms under consideration because in some cases the firm&#x27;s business model dictates the size of its asset base. A firm that outsources its production will have fewer assets, lower book value, and a higher P/B ratio than an otherwise similar firm in the same industry that doesn&#x27;t outsource. (Module 22.1, LOS 22.c)(Module 22.1, LOS 22.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Arnaud Aims is assisting with the analysis of several firms in the retail department store industry. Because one of the industry members, Flavia Stores, has negative earnings for the current year, Aims wishes to normalize earnings to establish more meaningful P/E ratios. For the current year (2016) and six previous years, selected financial data are given below. All data are in euros.<\/p><p>Exhibit 1: Selected Financial Data for Flavia Stores, 2010–2016<\/p><div class=\"tbl\"><table><tr><td>2016<\/td><td>2015<\/td><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td>2010<\/td><td><\/td><\/tr><tr><td>Earnings per share<\/td><td>(1.05)<\/td><td>1.90<\/td><td>1.65<\/td><td>0.99<\/td><td>1.35<\/td><td>0.77<\/td><td>1.04<\/td><\/tr><tr><td>Book value per share<\/td><td>9.11<\/td><td>10.66<\/td><td>9.26<\/td><td>8.11<\/td><td>7.62<\/td><td>6.77<\/td><td>6.50<\/td><\/tr><tr><td>Return on equity<\/td><td>(0.115)<\/td><td>0.178<\/td><td>0.178<\/td><td>0.122<\/td><td>0.177<\/td><td>0.114<\/td><td>0.160<\/td><\/tr><\/table><\/div><p>Aims wishes to estimate normalized EPS for 2016 using two different methods, the method of historical average EPS and the method of average rate of return on equity. He will leave 2016 EPS and ROI out of his estimates. Based on his normalized EPS estimates, he will compute a trailing P/E for 2016. The stock price for Flavia Stores is €26.50.<\/p><p>Aims is also looking at price-to-book ratios as an alternative to price-to-earnings ratios. Three of the advantages of P/B ratios that Aims recalls are as follows:<\/p><div class=\"tbl\"><table><tr><td>Advantage 1:<\/td><td>Book value is more stable than EPS.<\/td><\/tr><tr><td>Advantage 2:<\/td><td>For many companies, human capital is more important than physical capital as an operating asset.<\/td><\/tr><tr><td>Advantage 3:<\/td><td>Book value per share accounts for size differences between companies.<\/td><\/tr><\/table><\/div><p>Aims used a constant growth DDM to establish a justified P/E ratio based on forecasted fundamentals. One of his associates asked Aims whether he could easily establish a justified price-to-sales (P/S) ratio and price-to-book (P/B) ratio from his justified P/E ratio.<\/p><p>Aims replied, &quot;I could do this fairly easily. If I multiply the trailing P/E ratio times the net profit margin, the ratio of net income to sales, the result will be the P/S ratio. If I multiply the leading P/E ratio times the return on equity, the ratio of net income to beginning book value of equity, the result will be the P/B ratio.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which one of the three advantages recalled by Aims is the most appropriate reason to consider using a P/B ratio?<\/p><\/div>","subj":"equity"},{"n":24,"q":"Is Aims correct in describing how we could transform a justified P/E ratio into a P/S ratio or a P/B ratio?","opts":["Yes.","No. He is correct about the P/S ratio but incorrect about the P/B ratio.","No. He is correct about the P/B ratio but incorrect about the P/S ratio."],"ans":"A","expl":"Aims is correct about both ratios. For example, let's take the trailing P/E ratio, which is P0/E0. Multiplying by the net profit margin results in P0/E0 × E0/S0 = P0/S0. If the justified P/E is (1 − b)(1 + g) / (r − g), the justified P/S is (E0/S0) (1 − b)(1 + g) / (r − g). Multiplying the leading P/E ratio by the ROE results in P0/E1 × E1/B0 = P0/B0. If the justified P/E is (1 − b) / (r − g), the justified P/B is ROE(1 − b) / (r − g). This becomes (ROE − b × ROE) / (r − g). Since b × ROE = g (from sustainable growth equation), the equation becomes (ROE − g) / (r − g). (Module 22.2, LOS 22.i)","explhtml":"<p>Aims is correct about both ratios. For example, let&#x27;s take the trailing P/E ratio, which is P0/E0. Multiplying by the net profit margin results in P0/E0 × E0/S0 = P0/S0. If the justified P/E is (1 − b)(1 + g) / (r − g), the justified P/S is (E0/S0) (1 − b)(1 + g) / (r − g). Multiplying the leading P/E ratio by the ROE results in P0/E1 × E1/B0 = P0/B0. If the justified P/E is (1 − b) / (r − g), the justified P/B is ROE(1 − b) / (r − g). This becomes (ROE − b × ROE) / (r − g). Since b × ROE = g (from sustainable growth equation), the equation becomes (ROE − g) / (r − g). (Module 22.2, LOS 22.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Arnaud Aims is assisting with the analysis of several firms in the retail department store industry. Because one of the industry members, Flavia Stores, has negative earnings for the current year, Aims wishes to normalize earnings to establish more meaningful P/E ratios. For the current year (2016) and six previous years, selected financial data are given below. All data are in euros.<\/p><p>Exhibit 1: Selected Financial Data for Flavia Stores, 2010–2016<\/p><div class=\"tbl\"><table><tr><td>2016<\/td><td>2015<\/td><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td>2010<\/td><td><\/td><\/tr><tr><td>Earnings per share<\/td><td>(1.05)<\/td><td>1.90<\/td><td>1.65<\/td><td>0.99<\/td><td>1.35<\/td><td>0.77<\/td><td>1.04<\/td><\/tr><tr><td>Book value per share<\/td><td>9.11<\/td><td>10.66<\/td><td>9.26<\/td><td>8.11<\/td><td>7.62<\/td><td>6.77<\/td><td>6.50<\/td><\/tr><tr><td>Return on equity<\/td><td>(0.115)<\/td><td>0.178<\/td><td>0.178<\/td><td>0.122<\/td><td>0.177<\/td><td>0.114<\/td><td>0.160<\/td><\/tr><\/table><\/div><p>Aims wishes to estimate normalized EPS for 2016 using two different methods, the method of historical average EPS and the method of average rate of return on equity. He will leave 2016 EPS and ROI out of his estimates. Based on his normalized EPS estimates, he will compute a trailing P/E for 2016. The stock price for Flavia Stores is €26.50.<\/p><p>Aims is also looking at price-to-book ratios as an alternative to price-to-earnings ratios. Three of the advantages of P/B ratios that Aims recalls are as follows:<\/p><div class=\"tbl\"><table><tr><td>Advantage 1:<\/td><td>Book value is more stable than EPS.<\/td><\/tr><tr><td>Advantage 2:<\/td><td>For many companies, human capital is more important than physical capital as an operating asset.<\/td><\/tr><tr><td>Advantage 3:<\/td><td>Book value per share accounts for size differences between companies.<\/td><\/tr><\/table><\/div><p>Aims used a constant growth DDM to establish a justified P/E ratio based on forecasted fundamentals. One of his associates asked Aims whether he could easily establish a justified price-to-sales (P/S) ratio and price-to-book (P/B) ratio from his justified P/E ratio.<\/p><p>Aims replied, &quot;I could do this fairly easily. If I multiply the trailing P/E ratio times the net profit margin, the ratio of net income to sales, the result will be the P/S ratio. If I multiply the leading P/E ratio times the return on equity, the ratio of net income to beginning book value of equity, the result will be the P/B ratio.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Is Aims correct in describing how we could transform a justified P/E ratio into a P/S ratio or a P/B ratio?<\/p><\/div>","subj":"equity"},{"n":25,"q":"Are thestatements made by McDonnell comparing private firms and public firms accurate?","opts":["Yes.","No, both statements are incorrect.","No, one statement is correct, but the other statement is incorrect."],"ans":"C","expl":"Statement1: McDonnell is correct on this point. Private firms are usually smaller than public firms and, thus, thought to be riskier. Accordingly, private firms are usually assigned higher risk premiums and required returns than public firms. The lack of access to liquid public equity markets can also limit a private firm's growth.\nStatement 2: McDonnell is correct that small private firms may not be able to attract as many qualified applicants for top positions as public firms can. This may reduce the depth of management, slow growth, and increase risk at private firms. McDonnell is, however, incorrect about private firm managers and investors having a shorter-term view. Public firm shareholders often focus on short-term measures such as quarterlyearnings and the consistency of such, so public company management may therefore take a shorter-term view than they otherwise would. In fact, private firms are more likely to take a longer-term view.\nFurthermore, in most private firms, management has substantial equity ownership. In this case, external shareholders cannot exert as much control, which should help thefirm to take a longer-term perspective. (Module 24.1, LOS 24.a)","explhtml":"<p>Statement1: McDonnell is correct on this point. Private firms are usually smaller than public firms and, thus, thought to be riskier. Accordingly, private firms are usually assigned higher risk premiums and required returns than public firms. The lack of access to liquid public equity markets can also limit a private firm&#x27;s growth.<\/p><p>Statement 2: McDonnell is correct that small private firms may not be able to attract as many qualified applicants for top positions as public firms can. This may reduce the depth of management, slow growth, and increase risk at private firms. McDonnell is, however, incorrect about private firm managers and investors having a shorter-term view. Public firm shareholders often focus on short-term measures such as quarterlyearnings and the consistency of such, so public company management may therefore take a shorter-term view than they otherwise would. In fact, private firms are more likely to take a longer-term view.<\/p><p>Furthermore, in most private firms, management has substantial equity ownership. In this case, external shareholders cannot exert as much control, which should help thefirm to take a longer-term perspective. (Module 24.1, LOS 24.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in – and then actively manages – its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms, and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms do, because private firms are usually smaller and are thus seen as riskier. Furthermore, the lack of access to liquid public equity markets can limit a private firm&#x27;s growth.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants for top positions as public firms do. And due to the firms&#x27; higher risk, the managers they do attract tend to have a<\/td><\/tr><\/table><\/div><p>shorter-term view of the firm and their tenure at the firm, compared to that of public firm managers. As a result, the private firm may neglect profitable long-term opportunities.<\/p><p>Lutge adds to the discussion by making the following statement:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>When valuing a small stake in a private company using a P/E multiple from comparable public companies as the basis for valuation, we should apply appropriate discounts to reflect the unique characteristics of the private company investment.<\/td><\/tr><\/table><\/div><p>McDonnell is examining the prospects of Balanced Metals, a wrought iron fabricator. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide that desired exposure. The growth in sales at Balanced has been impressive of late, but is expected to slow considerably in the years ahead due to increased competition from firms overseas. The company&#x27;s most valuable assets are its equipment, and its factory located in a prime industrial area.<\/p><p>Balanced was previously considered to be a possible purchase target by a competitor (another privately held company in the metal fabrication industry). Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained from the Balanced Metals CFO the following financial figures, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will approximately equal depreciation plus 4% of the firm&#x27;s incremental revenues. McDonnell wishes to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Are thestatements made by McDonnell comparing private firms and public firms accurate?<\/p><\/div>","subj":"equity"},{"n":26,"q":"Regarding thestatement made by Lutge on valuation discounts, which of the following discounts would be appropriate in the scenario described?","opts":["DLOM ONLY.","DLOC ONLY.","Both DLOM and DLOC ONLY."],"ans":"A","expl":"If the basis of valuation is public company comparable, a discount for a private company's lack of marketability (DLOM) would be appropriate. Because this particular valuation is based on comparable public company's multiples such as P/E (and not actual public company acquisition prices), no control premium is not embedded in the valuation. Accordingly, a DLOC should not be applied.\n(Module 24.2, LOS 24.f)","explhtml":"<p>If the basis of valuation is public company comparable, a discount for a private company&#x27;s lack of marketability (DLOM) would be appropriate. Because this particular valuation is based on comparable public company&#x27;s multiples such as P/E (and not actual public company acquisition prices), no control premium is not embedded in the valuation. Accordingly, a DLOC should not be applied.<\/p><p>(Module 24.2, LOS 24.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in – and then actively manages – its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms, and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms do, because private firms are usually smaller and are thus seen as riskier. Furthermore, the lack of access to liquid public equity markets can limit a private firm&#x27;s growth.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants for top positions as public firms do. And due to the firms&#x27; higher risk, the managers they do attract tend to have a<\/td><\/tr><\/table><\/div><p>shorter-term view of the firm and their tenure at the firm, compared to that of public firm managers. As a result, the private firm may neglect profitable long-term opportunities.<\/p><p>Lutge adds to the discussion by making the following statement:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>When valuing a small stake in a private company using a P/E multiple from comparable public companies as the basis for valuation, we should apply appropriate discounts to reflect the unique characteristics of the private company investment.<\/td><\/tr><\/table><\/div><p>McDonnell is examining the prospects of Balanced Metals, a wrought iron fabricator. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide that desired exposure. The growth in sales at Balanced has been impressive of late, but is expected to slow considerably in the years ahead due to increased competition from firms overseas. The company&#x27;s most valuable assets are its equipment, and its factory located in a prime industrial area.<\/p><p>Balanced was previously considered to be a possible purchase target by a competitor (another privately held company in the metal fabrication industry). Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained from the Balanced Metals CFO the following financial figures, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will approximately equal depreciation plus 4% of the firm&#x27;s incremental revenues. McDonnell wishes to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding thestatement made by Lutge on valuation discounts, which of the following discounts would be appropriate in the scenario described?<\/p><\/div>","subj":"equity"},{"n":27,"q":"Which of the following is closest to the FCFF that McDonnell should estimate for Balanced Metals?","opts":["–$117,800.","$344,120.","$722,120."],"ans":"A","expl":"In a strategic transaction, a firm is acquired based in part on the synergies it brings to the acquirer. A financial transaction occurs when there are no synergies. The previous suitor of Balanced, a competitor in the same industry, was a strategic buyer and could realize the synergistic cost savings of $1,200,000.\nThorngate currently does not own a manufacturing firm, so it would be a financial buyer. Thorngate will not be able to realize any synergistic cost savings, so these are not included in the free cash flow to the firm (FCFF) estimates in the following tables.\nThe calculations are as follows.\nPro Forma Income Statement\nRevenues | $23,540,000\nCost of goods sold | $17,655,000\nGross profit | $5,885,000\nSG&A expenses | $5,400,000\nPro forma EBITDA | $485,000\nDepreciation and amortization | $235,400\nPro forma EBIT | $249,600\nPro forma taxes on EBIT | $74,880\nOperating income after tax | $174,720\nAdjustments to Obtain FCFF\nPlus: Depreciation and amortization | $235,400\nMinus: Capital expenditures | $297,000\nMinus: Increase in working capital | $231,000\nFCFF | –$117,880\nThe following provides a line-by-line explanation for the previous calculations.\nPro Forma Income Explanation Statement\nCurrent revenues times the growth rate: Revenues $22,000,000 × (1.07)\nRevenues times one minus the gross profit margin: Cost of goods sold $23,540,000 × (1 − 0.25)\nRevenues times the gross profit margin: Gross profit $23,540,000 × 0.25\nSG&A expenses | Given in the question\nGross profit minus SG&A expenses: Pro forma EBITDA $5,885,000 − $5,400,000\nRevenues times the given depreciation expense: Depreciation and amortization $23,540,000 × 0.01\nEBITDA minus depreciation and amortization: Pro forma EBIT $485,000 − $235,400\nPro forma taxes on EBIT | EBIT times tax rate: $249,600 × 0.30\nOperating income after EBIT minus taxes: $249,600 − $74,880 tax\nAdjustments to Obtain FCFF\nPlus: Depreciation and Add back noncash charges from above amortization\nExpenditures cover depreciation and increase with\nMinus: Capital | revenues:\nexpenditures $235,400 + 0.04 × ($23,540,000 − $22,000,000)\nMinus: Increase in | The working capital will increase as revenues increase\nworking capital | 0.15 × ($23,540,000 − $22,000,000)\nFCFF | Operating income net of the adjustments above\nNote: Depreciation expense is not included in SG&A or COGS.\n(Module 24.3, LOS 24.h)","explhtml":"<p>In a strategic transaction, a firm is acquired based in part on the synergies it brings to the acquirer. A financial transaction occurs when there are no synergies. The previous suitor of Balanced, a competitor in the same industry, was a strategic buyer and could realize the synergistic cost savings of $1,200,000.<\/p><p>Thorngate currently does not own a manufacturing firm, so it would be a financial buyer. Thorngate will not be able to realize any synergistic cost savings, so these are not included in the free cash flow to the firm (FCFF) estimates in the following tables.<\/p><p>The calculations are as follows.<\/p><p>Pro Forma Income Statement<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>$23,540,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$17,655,000<\/td><\/tr><tr><td>Gross profit<\/td><td>$5,885,000<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Pro forma EBITDA<\/td><td>$485,000<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$235,400<\/td><\/tr><tr><td>Pro forma EBIT<\/td><td>$249,600<\/td><\/tr><tr><td>Pro forma taxes on EBIT<\/td><td>$74,880<\/td><\/tr><tr><td>Operating income after tax<\/td><td>$174,720<\/td><\/tr><\/table><\/div><p>Adjustments to Obtain FCFF<\/p><div class=\"tbl\"><table><tr><td>Plus: Depreciation and amortization<\/td><td>$235,400<\/td><\/tr><tr><td>Minus: Capital expenditures<\/td><td>$297,000<\/td><\/tr><tr><td>Minus: Increase in working capital<\/td><td>$231,000<\/td><\/tr><tr><td>FCFF<\/td><td>–$117,880<\/td><\/tr><\/table><\/div><p>The following provides a line-by-line explanation for the previous calculations.<\/p><p>Pro Forma Income Explanation Statement<\/p><p>Current revenues times the growth rate: Revenues $22,000,000 × (1.07)<\/p><p>Revenues times one minus the gross profit margin: Cost of goods sold $23,540,000 × (1 − 0.25)<\/p><p>Revenues times the gross profit margin: Gross profit $23,540,000 × 0.25<\/p><div class=\"tbl\"><table><tr><td>SG&amp;A expenses<\/td><td>Given in the question<\/td><\/tr><\/table><\/div><p>Gross profit minus SG&amp;A expenses: Pro forma EBITDA $5,885,000 − $5,400,000<\/p><p>Revenues times the given depreciation expense: Depreciation and amortization $23,540,000 × 0.01<\/p><p>EBITDA minus depreciation and amortization: Pro forma EBIT $485,000 − $235,400<\/p><div class=\"tbl\"><table><tr><td>Pro forma taxes on EBIT<\/td><td>EBIT times tax rate: $249,600 × 0.30<\/td><\/tr><\/table><\/div><p>Operating income after EBIT minus taxes: $249,600 − $74,880 tax<\/p><p>Adjustments to Obtain FCFF<\/p><p>Plus: Depreciation and Add back noncash charges from above amortization<\/p><p>Expenditures cover depreciation and increase with<\/p><div class=\"tbl\"><table><tr><td>Minus: Capital<\/td><td>revenues:<\/td><\/tr><\/table><\/div><p>expenditures $235,400 + 0.04 × ($23,540,000 − $22,000,000)<\/p><div class=\"tbl\"><table><tr><td>Minus: Increase in<\/td><td>The working capital will increase as revenues increase<\/td><\/tr><tr><td>working capital<\/td><td>0.15 × ($23,540,000 − $22,000,000)<\/td><\/tr><tr><td>FCFF<\/td><td>Operating income net of the adjustments above<\/td><\/tr><\/table><\/div><p>Note: Depreciation expense is not included in SG&amp;A or COGS.<\/p><p>(Module 24.3, LOS 24.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in – and then actively manages – its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms, and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms do, because private firms are usually smaller and are thus seen as riskier. Furthermore, the lack of access to liquid public equity markets can limit a private firm&#x27;s growth.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants for top positions as public firms do. And due to the firms&#x27; higher risk, the managers they do attract tend to have a<\/td><\/tr><\/table><\/div><p>shorter-term view of the firm and their tenure at the firm, compared to that of public firm managers. As a result, the private firm may neglect profitable long-term opportunities.<\/p><p>Lutge adds to the discussion by making the following statement:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>When valuing a small stake in a private company using a P/E multiple from comparable public companies as the basis for valuation, we should apply appropriate discounts to reflect the unique characteristics of the private company investment.<\/td><\/tr><\/table><\/div><p>McDonnell is examining the prospects of Balanced Metals, a wrought iron fabricator. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide that desired exposure. The growth in sales at Balanced has been impressive of late, but is expected to slow considerably in the years ahead due to increased competition from firms overseas. The company&#x27;s most valuable assets are its equipment, and its factory located in a prime industrial area.<\/p><p>Balanced was previously considered to be a possible purchase target by a competitor (another privately held company in the metal fabrication industry). Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained from the Balanced Metals CFO the following financial figures, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will approximately equal depreciation plus 4% of the firm&#x27;s incremental revenues. McDonnell wishes to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is closest to the FCFF that McDonnell should estimate for Balanced Metals?<\/p><\/div>","subj":"equity"},{"n":28,"q":"Which of the following income approaches would be most appropriate for valuing Balanced Metals?","opts":["The free cash flow method.","The excess earnings method.","The capitalized cash flow method."],"ans":"A","expl":"The free cash flow method can accommodate multiple stage growth assumptions, and is thus the most appropriate to apply to this valuation. Balanced's growth is expected to slow considerably in the years ahead, so the constant growthassumption of the capitalized cash flow method would be inappropriate. (The capitalized cash flow method is only a single-stage model).\nThe excess earnings method is useful when there are intangible assets to value, but that does not appearto be a significant concern in the valuation of Balanced: the firm's assets appear to be largely tangible (consisting of equipment and the factory). (Module 24.3, LOS 24.h)","explhtml":"<p>The free cash flow method can accommodate multiple stage growth assumptions, and is thus the most appropriate to apply to this valuation. Balanced&#x27;s growth is expected to slow considerably in the years ahead, so the constant growthassumption of the capitalized cash flow method would be inappropriate. (The capitalized cash flow method is only a single-stage model).<\/p><p>The excess earnings method is useful when there are intangible assets to value, but that does not appearto be a significant concern in the valuation of Balanced: the firm&#x27;s assets appear to be largely tangible (consisting of equipment and the factory). (Module 24.3, LOS 24.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in – and then actively manages – its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms, and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms do, because private firms are usually smaller and are thus seen as riskier. Furthermore, the lack of access to liquid public equity markets can limit a private firm&#x27;s growth.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants for top positions as public firms do. And due to the firms&#x27; higher risk, the managers they do attract tend to have a<\/td><\/tr><\/table><\/div><p>shorter-term view of the firm and their tenure at the firm, compared to that of public firm managers. As a result, the private firm may neglect profitable long-term opportunities.<\/p><p>Lutge adds to the discussion by making the following statement:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>When valuing a small stake in a private company using a P/E multiple from comparable public companies as the basis for valuation, we should apply appropriate discounts to reflect the unique characteristics of the private company investment.<\/td><\/tr><\/table><\/div><p>McDonnell is examining the prospects of Balanced Metals, a wrought iron fabricator. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide that desired exposure. The growth in sales at Balanced has been impressive of late, but is expected to slow considerably in the years ahead due to increased competition from firms overseas. The company&#x27;s most valuable assets are its equipment, and its factory located in a prime industrial area.<\/p><p>Balanced was previously considered to be a possible purchase target by a competitor (another privately held company in the metal fabrication industry). Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained from the Balanced Metals CFO the following financial figures, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will approximately equal depreciation plus 4% of the firm&#x27;s incremental revenues. McDonnell wishes to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following income approaches would be most appropriate for valuing Balanced Metals?<\/p><\/div>","subj":"equity"},{"n":29,"q":"The total discount for control and marketability that Ying should apply to the Jensen valuation is closest to:","opts":["36.0%","39.8%","42.7%"],"ans":"A","expl":"Lutge is using the guideline transactions method (GTM) because his database uses the price multiples from the sale of entire public and private companies. The interest in Jensen is a noncontrolling equity interest, so a discount for lack of control (DLOC) will be applied to its valuation. A discount for lack of marketability (DLOM) will also be applied because the Jensen interest could not be easily sold.\nThe DLOC is backed out of the control premium.\nDLOC | = 1 −[1/ (1 + control premium)] = 1 −[1/1.187] = 0.1575\nThe total discount includes the discount for lack of marketability (DLOM).\ntotal discount = 1 −[(1 −0.1575) (1 −0.24)] = 36.0% | = 1 −[(1 −DLOC) (1 −DLOM)]\n(Module 24.2, LOS 24.f)","explhtml":"<p>Lutge is using the guideline transactions method (GTM) because his database uses the price multiples from the sale of entire public and private companies. The interest in Jensen is a noncontrolling equity interest, so a discount for lack of control (DLOC) will be applied to its valuation. A discount for lack of marketability (DLOM) will also be applied because the Jensen interest could not be easily sold.<\/p><p>The DLOC is backed out of the control premium.<\/p><div class=\"tbl\"><table><tr><td>DLOC<\/td><td>= 1 −[1/ (1 + control premium)] = 1 −[1/1.187] = 0.1575<\/td><\/tr><\/table><\/div><p>The total discount includes the discount for lack of marketability (DLOM).<\/p><div class=\"tbl\"><table><tr><td>total discount = 1 −[(1 −0.1575) (1 −0.24)] = 36.0%<\/td><td>= 1 −[(1 −DLOC) (1 −DLOM)]<\/td><\/tr><\/table><\/div><p>(Module 24.2, LOS 24.f)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Zhang Xiu Ying, CFA recently joined the analyst team at the pension plan of Steelworks Inc., reporting to Yew Yip, Senior Portfolio Manager. Ying is currently valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years; however, given its size and private status, Ying does not expect that Jensen could be easily sold. To obtain the appropriate price multiple for the Jensen valuation, Ying has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Ying estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Ying uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Ying determines an appropriate size premium using the smallest-firm-size decile of the database. Yip examines Ying&#x27;s cost of capital calculations and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>I am concerned about the use of this database. The estimate of the size<\/td><\/tr><tr><td>1:<\/td><td>premium may result in an undervaluation of the Jensen equity interest.<\/td><\/tr><tr><td>Statement<\/td><td>The use of betas and the CAPM from the database may be<\/td><\/tr><tr><td>2:<\/td><td>inappropriate. You should consider using the build-up method, where<\/td><\/tr><\/table><\/div><p>an industry risk premium is used instead of beta.<\/p><p>David Ng, one of Ying&#x27;s associates, has an affinity for the price-earnings-to-growth (PEG) ratio, because he believes it addresses the effect of growth on the P/E ratio. For example, if a firm&#x27;s P/E ratio is 20 and its forecasted 5-year growth rate is 10%, the PEG ratio is 2.0.<\/p><p>Ng prefers to invest in firms that have an above-industry-average PEG ratio. Ng also states that he seeks to invest in firms with leading P/E that is greater than its trailing P/E. Ying tells Ng that he would like to further investigate these two investment criteria.<\/p><p>Finally, Ying makes two comments about valuation ratios based on EBITDA and on dividends:<\/p><div class=\"tbl\"><table><tr><td>Comment<\/td><td>EBITDA is a pre-interest-expense figure, so I prefer a ratio of total equity<\/td><\/tr><tr><td>1:<\/td><td>value to EBITDA, versus a ratio of enterprise value to EBITDA.<\/td><\/tr><tr><td>Comment<\/td><td>Dividend yields are useful information because they are one component<\/td><\/tr><tr><td>2:<\/td><td>of total return. However, they can be an incomplete measure of return because investors trade off future earnings growth to receive higher current dividends.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The total discount for control and marketability that Ying should apply to the Jensen valuation is closest to:<\/p><\/div>","subj":"equity"},{"n":30,"q":"Are the statements that Yip made regarding Ying's cost of capital calculations for Jensen accurate?","opts":["Yes.","No, both statements are incorrect.","No, one statement is correct, but the other statement is incorrect."],"ans":"A","expl":"Statement 1: Yip is correct. Data from the smallest cap segment of public equity may include a distress premium that is not applicable to a healthy private firm such as Jensen. If so, the estimated size premium will be too large, resulting in a discount rate that is too high and an undervaluation of the Jensen equity interest.\nStatement 2: Yip is correct. Using the CAPM and estimating beta from public firm data may be inappropriate for private firms that have little probability of going public or being acquired by a public firm. In the build-up method, an industry risk premium is added to the risk-free rate, along with an equity risk premium, the small stock premium, and a company-specific risk premium. (Module 24.2, LOS 24.e)","explhtml":"<p>Statement 1: Yip is correct. Data from the smallest cap segment of public equity may include a distress premium that is not applicable to a healthy private firm such as Jensen. If so, the estimated size premium will be too large, resulting in a discount rate that is too high and an undervaluation of the Jensen equity interest.<\/p><p>Statement 2: Yip is correct. Using the CAPM and estimating beta from public firm data may be inappropriate for private firms that have little probability of going public or being acquired by a public firm. In the build-up method, an industry risk premium is added to the risk-free rate, along with an equity risk premium, the small stock premium, and a company-specific risk premium. (Module 24.2, LOS 24.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Zhang Xiu Ying, CFA recently joined the analyst team at the pension plan of Steelworks Inc., reporting to Yew Yip, Senior Portfolio Manager. Ying is currently valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years; however, given its size and private status, Ying does not expect that Jensen could be easily sold. To obtain the appropriate price multiple for the Jensen valuation, Ying has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Ying estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Ying uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Ying determines an appropriate size premium using the smallest-firm-size decile of the database. Yip examines Ying&#x27;s cost of capital calculations and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>I am concerned about the use of this database. The estimate of the size<\/td><\/tr><tr><td>1:<\/td><td>premium may result in an undervaluation of the Jensen equity interest.<\/td><\/tr><tr><td>Statement<\/td><td>The use of betas and the CAPM from the database may be<\/td><\/tr><tr><td>2:<\/td><td>inappropriate. You should consider using the build-up method, where<\/td><\/tr><\/table><\/div><p>an industry risk premium is used instead of beta.<\/p><p>David Ng, one of Ying&#x27;s associates, has an affinity for the price-earnings-to-growth (PEG) ratio, because he believes it addresses the effect of growth on the P/E ratio. For example, if a firm&#x27;s P/E ratio is 20 and its forecasted 5-year growth rate is 10%, the PEG ratio is 2.0.<\/p><p>Ng prefers to invest in firms that have an above-industry-average PEG ratio. Ng also states that he seeks to invest in firms with leading P/E that is greater than its trailing P/E. Ying tells Ng that he would like to further investigate these two investment criteria.<\/p><p>Finally, Ying makes two comments about valuation ratios based on EBITDA and on dividends:<\/p><div class=\"tbl\"><table><tr><td>Comment<\/td><td>EBITDA is a pre-interest-expense figure, so I prefer a ratio of total equity<\/td><\/tr><tr><td>1:<\/td><td>value to EBITDA, versus a ratio of enterprise value to EBITDA.<\/td><\/tr><tr><td>Comment<\/td><td>Dividend yields are useful information because they are one component<\/td><\/tr><tr><td>2:<\/td><td>of total return. However, they can be an incomplete measure of return because investors trade off future earnings growth to receive higher current dividends.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Are the statements that Yip made regarding Ying&#x27;s cost of capital calculations for Jensen accurate?<\/p><\/div>","subj":"equity"},{"n":31,"q":"When Ying further investigates the two investment criteria (the PEG ratio and the comparison between the trailing and leading P/E ratio), should he find Ng's use of them to be appropriate?","opts":["No.","The PEG ratio criterion is appropriate, but the P/E ratio criterion is not.","The P/E ratio criterion is appropriate, but the PEG ratio criterion is not."],"ans":"A","expl":"Both criteria are improperly applied by Ng. Generally, a lower PEG ratio—not a higher one—is considered desirable. The difference in the trailing and leading P/E ratios could be due to transitory elements in the current year's income in the denominator of the trailing P/E. Assuming an environment of growth, the leading P/E will naturally be smaller than the trailing P/E because earnings are growing by a positive g. (Module 22.2, LOS 22.l)(Module 22.4, LOS 22.e)","explhtml":"<p>Both criteria are improperly applied by Ng. Generally, a lower PEG ratio—not a higher one—is considered desirable. The difference in the trailing and leading P/E ratios could be due to transitory elements in the current year&#x27;s income in the denominator of the trailing P/E. Assuming an environment of growth, the leading P/E will naturally be smaller than the trailing P/E because earnings are growing by a positive g. (Module 22.2, LOS 22.l)(Module 22.4, LOS 22.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Zhang Xiu Ying, CFA recently joined the analyst team at the pension plan of Steelworks Inc., reporting to Yew Yip, Senior Portfolio Manager. Ying is currently valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years; however, given its size and private status, Ying does not expect that Jensen could be easily sold. To obtain the appropriate price multiple for the Jensen valuation, Ying has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Ying estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Ying uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Ying determines an appropriate size premium using the smallest-firm-size decile of the database. Yip examines Ying&#x27;s cost of capital calculations and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>I am concerned about the use of this database. The estimate of the size<\/td><\/tr><tr><td>1:<\/td><td>premium may result in an undervaluation of the Jensen equity interest.<\/td><\/tr><tr><td>Statement<\/td><td>The use of betas and the CAPM from the database may be<\/td><\/tr><tr><td>2:<\/td><td>inappropriate. You should consider using the build-up method, where<\/td><\/tr><\/table><\/div><p>an industry risk premium is used instead of beta.<\/p><p>David Ng, one of Ying&#x27;s associates, has an affinity for the price-earnings-to-growth (PEG) ratio, because he believes it addresses the effect of growth on the P/E ratio. For example, if a firm&#x27;s P/E ratio is 20 and its forecasted 5-year growth rate is 10%, the PEG ratio is 2.0.<\/p><p>Ng prefers to invest in firms that have an above-industry-average PEG ratio. Ng also states that he seeks to invest in firms with leading P/E that is greater than its trailing P/E. Ying tells Ng that he would like to further investigate these two investment criteria.<\/p><p>Finally, Ying makes two comments about valuation ratios based on EBITDA and on dividends:<\/p><div class=\"tbl\"><table><tr><td>Comment<\/td><td>EBITDA is a pre-interest-expense figure, so I prefer a ratio of total equity<\/td><\/tr><tr><td>1:<\/td><td>value to EBITDA, versus a ratio of enterprise value to EBITDA.<\/td><\/tr><tr><td>Comment<\/td><td>Dividend yields are useful information because they are one component<\/td><\/tr><tr><td>2:<\/td><td>of total return. However, they can be an incomplete measure of return because investors trade off future earnings growth to receive higher current dividends.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>When Ying further investigates the two investment criteria (the PEG ratio and the comparison between the trailing and leading P/E ratio), should he find Ng&#x27;s use of them to be appropriate?<\/p><\/div>","subj":"equity"},{"n":32,"q":"Are Ying's two comments about the dividend yield and EBITDA ratios correct?","opts":["Yes.","No. The comment about EBITDA ratios is correct, but the comment about dividend yields is incorrect.","No. The comment about div
