ate of return on Central Texas shares is closest to:","opts":["11.26%.","11.57%.","12.83%."],"ans":"B","expl":"One way to estimate the expected rate of return on Central Texas is to add the dividend yield to the growth rate. Expected dividend this coming year is 0.8 × 1.80 × 1.05 = 1.512. Expected market rate of return is 1.512 / 23 + 0.05 = 11.57%.\nThis is equivalent to setting the constant-growth DDM model value equal to the market price: 1.512 / (k – 0.05) = 23 and solving for the expected rate of return.\n(Module 20.2, LOS 20.f)","explhtml":"<p>One way to estimate the expected rate of return on Central Texas is to add the dividend yield to the growth rate. Expected dividend this coming year is 0.8 × 1.80 × 1.05 = 1.512. Expected market rate of return is 1.512 / 23 + 0.05 = 11.57%.<\/p><p>This is equivalent to setting the constant-growth DDM model value equal to the market price: 1.512 / (k – 0.05) = 23 and solving for the expected rate of return.<\/p><p>(Module 20.2, LOS 20.f)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Arshad Khan, CFA, is principal and founding partner of Khan Nolan, an asset management firm. Khan and his partner, Christopher Nolan, conclude that continuing increases in the price of oil are going to make natural gas a more attractive long-term choice as a source of energy. As a result of their analysis, Khan and Nolan decide to take a position in a natural gas distributor.<\/p><p>The Central Texas Energy &amp; Gas Company (Central Texas) is one possible choice for investment. The company has been in business for many years and has consistently paid out 80% of its earnings in dividends. Earnings per share for the year just concluded were $1.80. Khan and Nolan agree that the company&#x27;s growth rate going forward should remain constant at 5%, that the required rate of return for Central Texas&#x27;s equity should be 12.5%, and that its WACC is 10.5%. Nolan argues against investing in Central Texas, saying, &quot;Much of present value of Central Texas&#x27;s growth opportunities is already reflected in its market price.&quot; Currently, Central Texas shares trade at $23.<\/p><p>North Slope Energy Distributors, Inc. (North Slope) is another company that Khan Nolan is considering for investment. North Slope is currently experiencing rapid growth and Khan estimates that earnings will grow 15% this year. He expects this growth to decline over time, as North Slope matures, to 5% after 10 years. Last year&#x27;s earnings were $10 and North Slope maintains a payout ratio of 40%. Khan estimates that North Slope&#x27;s WACC is 9% and that the required rate of return on their equity is 11%.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Khan&#x27;s assumption about Central Texas&#x27;s future growth and assuming Central Texas is fairly priced in the market, the current market expected rate of return on Central Texas shares is closest to:<\/p><\/div>","subj":"equity"},{"n":66,"q":"Using Khan's estimate of the required rate of return for Central Texas, what percentage of its market price is due to the value of Central Texas's growth opportunities?","opts":["15.1%.","21.7%.","34.3%."],"ans":"C","expl":"We can subtract the no-growth value of Central Texas from its market price to get the present value of its growth opportunities (PVGO). Next year's earnings per share are expected to be 1.80 (1.05) = 1.89 and the no-growth value of Central Texas is 1.89 / 0.125 = 15.12 and the PVGO is 23 – 15.12 = 7.88. 7.88 / 23 = 34.3%.\n(Module 20.2, LOS 20.g)","explhtml":"<p>We can subtract the no-growth value of Central Texas from its market price to get the present value of its growth opportunities (PVGO). Next year&#x27;s earnings per share are expected to be 1.80 (1.05) = 1.89 and the no-growth value of Central Texas is 1.89 / 0.125 = 15.12 and the PVGO is 23 – 15.12 = 7.88. 7.88 / 23 = 34.3%.<\/p><p>(Module 20.2, LOS 20.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Arshad Khan, CFA, is principal and founding partner of Khan Nolan, an asset management firm. Khan and his partner, Christopher Nolan, conclude that continuing increases in the price of oil are going to make natural gas a more attractive long-term choice as a source of energy. As a result of their analysis, Khan and Nolan decide to take a position in a natural gas distributor.<\/p><p>The Central Texas Energy &amp; Gas Company (Central Texas) is one possible choice for investment. The company has been in business for many years and has consistently paid out 80% of its earnings in dividends. Earnings per share for the year just concluded were $1.80. Khan and Nolan agree that the company&#x27;s growth rate going forward should remain constant at 5%, that the required rate of return for Central Texas&#x27;s equity should be 12.5%, and that its WACC is 10.5%. Nolan argues against investing in Central Texas, saying, &quot;Much of present value of Central Texas&#x27;s growth opportunities is already reflected in its market price.&quot; Currently, Central Texas shares trade at $23.<\/p><p>North Slope Energy Distributors, Inc. (North Slope) is another company that Khan Nolan is considering for investment. North Slope is currently experiencing rapid growth and Khan estimates that earnings will grow 15% this year. He expects this growth to decline over time, as North Slope matures, to 5% after 10 years. Last year&#x27;s earnings were $10 and North Slope maintains a payout ratio of 40%. Khan estimates that North Slope&#x27;s WACC is 9% and that the required rate of return on their equity is 11%.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Khan&#x27;s estimate of the required rate of return for Central Texas, what percentage of its market price is due to the value of Central Texas&#x27;s growth opportunities?<\/p><\/div>","subj":"equity"},{"n":67,"q":"What is value of North Slope based on the most appropriate valuation model?","opts":["$66.67.","$103.33.","$143.33."],"ans":"B","expl":"The earnings growth pattern of North Slope best fits the H-model:\nD0×(1+g | ) | D0×H×(g−g | )\nL | s | L\nValue = | +\nr−g | r−g\nL D0= 10 (0.4) = $4    H = 10 / 2 = 5 | L\n4×1.05 | 4×5×(0.15−0.05)\n+ | = $103.33\n0.11−0.05 | 0.11−0.05\n(Module 20.3, LOS 20.n)","explhtml":"<p>The earnings growth pattern of North Slope best fits the H-model:<\/p><div class=\"tbl\"><table><tr><td>D0×(1+g<\/td><td>)<\/td><td>D0×H×(g−g<\/td><td>)<\/td><\/tr><tr><td>L<\/td><td>s<\/td><td>L<\/td><td><\/td><\/tr><tr><td>Value =<\/td><td>+<\/td><td><\/td><td><\/td><\/tr><tr><td>r−g<\/td><td>r−g<\/td><td><\/td><td><\/td><\/tr><tr><td>L D0= 10 (0.4) = $4    H = 10 / 2 = 5<\/td><td>L<\/td><td><\/td><td><\/td><\/tr><tr><td>4×1.05<\/td><td>4×5×(0.15−0.05)<\/td><td><\/td><td><\/td><\/tr><tr><td>+<\/td><td>= $103.33<\/td><td><\/td><td><\/td><\/tr><tr><td>0.11−0.05<\/td><td>0.11−0.05<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>(Module 20.3, LOS 20.n)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Arshad Khan, CFA, is principal and founding partner of Khan Nolan, an asset management firm. Khan and his partner, Christopher Nolan, conclude that continuing increases in the price of oil are going to make natural gas a more attractive long-term choice as a source of energy. As a result of their analysis, Khan and Nolan decide to take a position in a natural gas distributor.<\/p><p>The Central Texas Energy &amp; Gas Company (Central Texas) is one possible choice for investment. The company has been in business for many years and has consistently paid out 80% of its earnings in dividends. Earnings per share for the year just concluded were $1.80. Khan and Nolan agree that the company&#x27;s growth rate going forward should remain constant at 5%, that the required rate of return for Central Texas&#x27;s equity should be 12.5%, and that its WACC is 10.5%. Nolan argues against investing in Central Texas, saying, &quot;Much of present value of Central Texas&#x27;s growth opportunities is already reflected in its market price.&quot; Currently, Central Texas shares trade at $23.<\/p><p>North Slope Energy Distributors, Inc. (North Slope) is another company that Khan Nolan is considering for investment. North Slope is currently experiencing rapid growth and Khan estimates that earnings will grow 15% this year. He expects this growth to decline over time, as North Slope matures, to 5% after 10 years. Last year&#x27;s earnings were $10 and North Slope maintains a payout ratio of 40%. Khan estimates that North Slope&#x27;s WACC is 9% and that the required rate of return on their equity is 11%.<\/p><\/div><\/details><div class=\"qtext\"><p>What is value of North Slope based on the most appropriate valuation model?<\/p><\/div>","subj":"equity"},{"n":68,"q":"Based on Khan's earnings growth estimates, the justified trailing P/E ratio for North Slope at the end of year 10 is closest to:","opts":["6.33.","6.67.","7.00."],"ans":"C","expl":"At the end of year 10 the future growth rate for North Slope is estimated at 5%, the payout ratio is 40%, and the required rate of return on equity is 11%. The justified leading P/E is 0.4/(0.11 – 0.05) = 6.67. Since the earnings after year 10 are expected to grow by 5%, the justified trailing P/E is 6.67 (1.05) = 7.00.\n(Module 20.2, LOS 20.g)","explhtml":"<p>At the end of year 10 the future growth rate for North Slope is estimated at 5%, the payout ratio is 40%, and the required rate of return on equity is 11%. The justified leading P/E is 0.4/(0.11 – 0.05) = 6.67. Since the earnings after year 10 are expected to grow by 5%, the justified trailing P/E is 6.67 (1.05) = 7.00.<\/p><p>(Module 20.2, LOS 20.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Arshad Khan, CFA, is principal and founding partner of Khan Nolan, an asset management firm. Khan and his partner, Christopher Nolan, conclude that continuing increases in the price of oil are going to make natural gas a more attractive long-term choice as a source of energy. As a result of their analysis, Khan and Nolan decide to take a position in a natural gas distributor.<\/p><p>The Central Texas Energy &amp; Gas Company (Central Texas) is one possible choice for investment. The company has been in business for many years and has consistently paid out 80% of its earnings in dividends. Earnings per share for the year just concluded were $1.80. Khan and Nolan agree that the company&#x27;s growth rate going forward should remain constant at 5%, that the required rate of return for Central Texas&#x27;s equity should be 12.5%, and that its WACC is 10.5%. Nolan argues against investing in Central Texas, saying, &quot;Much of present value of Central Texas&#x27;s growth opportunities is already reflected in its market price.&quot; Currently, Central Texas shares trade at $23.<\/p><p>North Slope Energy Distributors, Inc. (North Slope) is another company that Khan Nolan is considering for investment. North Slope is currently experiencing rapid growth and Khan estimates that earnings will grow 15% this year. He expects this growth to decline over time, as North Slope matures, to 5% after 10 years. Last year&#x27;s earnings were $10 and North Slope maintains a payout ratio of 40%. Khan estimates that North Slope&#x27;s WACC is 9% and that the required rate of return on their equity is 11%.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Khan&#x27;s earnings growth estimates, the justified trailing P/E ratio for North Slope at the end of year 10 is closest to:<\/p><\/div>","subj":"equity"},{"n":69,"q":"If Acton issues the 2-year note with no embedded options, the yield to maturity at issuance will be closest to:","opts":["5.15%.","5.20%.","5.25%."],"ans":"A","expl":"(1050/1.055)+(1050/1.047)\n[ 2 | +50]\nBond Value = (1.052) | = $997.21\nTo value the 2-year note with no embedded options, we simply average the present values of the two possible values from the next period. From this value, the yield to maturity at issuance can then be calculated using our financial calculator: PV = –997.21, N = 2, PMT = 50, FV = 1,000; CPT I/Y = 5.15% (Module 26.1, LOS 26.e)","explhtml":"<p>(1050/1.055)+(1050/1.047)<\/p><div class=\"tbl\"><table><tr><td>[ 2<\/td><td>+50]<\/td><\/tr><tr><td>Bond Value = (1.052)<\/td><td>= $997.21<\/td><\/tr><\/table><\/div><p>To value the 2-year note with no embedded options, we simply average the present values of the two possible values from the next period. From this value, the yield to maturity at issuance can then be calculated using our financial calculator: PV = –997.21, N = 2, PMT = 50, FV = 1,000; CPT I/Y = 5.15% (Module 26.1, LOS 26.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<\/summary><div class=\"vig-body\"><p>Alan Foster, CFA, is a fixed income analyst for Quantshop, an investment management firm. Alan has been asked by his supervisor to prepare an analysis of a proposed bond offering by Acton Industries. The proposed offering is a 2-year annual-pay bond with a 5% coupon which Quantshop management believes will carry a single A rating.<\/p><p>Foster has developed an arbitrage-free interest rate tree for single A credits with medium liquidity. Part of this tree for the next five annual periods is as follows:<\/p><div class=\"tbl\"><table><tr><td>Present<\/td><td>1 year<\/td><td>2 years<\/td><td>3 years 5.8%<\/td><td>4 years 5.6%<\/td><\/tr><tr><td>5.9%<\/td><td>5.35%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5.5%<\/td><td>5.4%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5.2%<\/td><td>4.8%<\/td><td>5.2%<\/td><td><\/td><td><\/td><\/tr><tr><td>4.7%<\/td><td>4.9%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>4.6% 4.8%<\/td><td>4.9% 4.6%<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>As part of his analysis, Foster has been asked by Acton to consider the effect on the market yield of options that may be embedded in the note offering, specifically a par call exercisable after one year or a par put exercisable after one year.<\/p><p>Additionally, Foster&#x27;s supervisor has asked him to prepare answers to the following questions that he feels may come up during the next meeting with Acton:<\/p><div class=\"tbl\"><table><tr><td>Question:<\/td><td>If our proprietary interest rate volatility estimates are too high, what will be the impact on the valuation of callable and putable bonds?<\/td><\/tr><\/table><\/div><p>Foster sets to work preparing his analysis and answers to the questions that his supervisor believes may come up at the next meeting. While he thinks he can explain the answer to the first question to Acton quite easily, he feels the second may be more difficult to explain clearly. In preparation, Foster calculates two spread measures for a 10-year single A rated Carlson Manufacturing bond of medium liquidity. It is currently trading at a nominal spread of minus 20 basis points to the benchmark yield to maturity of a single A rated medium-liquidity option-free note. The OAS he calculates using his interest rate tree is 15 basis points.<\/p><\/div><\/details><div class=\"qtext\"><p>If Acton issues the 2-year note with no embedded options, the yield to maturity at issuance will be closest to:<\/p><\/div>","subj":"fixed"},{"n":70,"q":"The issue price of the note issue (% of par) if Acton chooses to issue the putable note is closest to:","opts":["99.895.","99.946.","100.27."],"ans":"B","expl":"1000+(1050/1.047)\n[ 2 | +50]\nBond Value = (1.052) | = $999.46\nSince the note is putable at par ($1,000) after one year, the put option will be exercised at the upper year-one node. So, the bond value at this node is replaced by $1,000 (plus the $50 coupon).\n(Module 27.2, LOS 27.f)","explhtml":"<p>1000+(1050/1.047)<\/p><div class=\"tbl\"><table><tr><td>[ 2<\/td><td>+50]<\/td><\/tr><tr><td>Bond Value = (1.052)<\/td><td>= $999.46<\/td><\/tr><\/table><\/div><p>Since the note is putable at par ($1,000) after one year, the put option will be exercised at the upper year-one node. So, the bond value at this node is replaced by $1,000 (plus the $50 coupon).<\/p><p>(Module 27.2, LOS 27.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alan Foster, CFA, is a fixed income analyst for Quantshop, an investment management firm. Alan has been asked by his supervisor to prepare an analysis of a proposed bond offering by Acton Industries. The proposed offering is a 2-year annual-pay bond with a 5% coupon which Quantshop management believes will carry a single A rating.<\/p><p>Foster has developed an arbitrage-free interest rate tree for single A credits with medium liquidity. Part of this tree for the next five annual periods is as follows:<\/p><div class=\"tbl\"><table><tr><td>Present<\/td><td>1 year<\/td><td>2 years<\/td><td>3 years 5.8%<\/td><td>4 years 5.6%<\/td><\/tr><tr><td>5.9%<\/td><td>5.35%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5.5%<\/td><td>5.4%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5.2%<\/td><td>4.8%<\/td><td>5.2%<\/td><td><\/td><td><\/td><\/tr><tr><td>4.7%<\/td><td>4.9%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>4.6% 4.8%<\/td><td>4.9% 4.6%<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>As part of his analysis, Foster has been asked by Acton to consider the effect on the market yield of options that may be embedded in the note offering, specifically a par call exercisable after one year or a par put exercisable after one year.<\/p><p>Additionally, Foster&#x27;s supervisor has asked him to prepare answers to the following questions that he feels may come up during the next meeting with Acton:<\/p><div class=\"tbl\"><table><tr><td>Question:<\/td><td>If our proprietary interest rate volatility estimates are too high, what will be the impact on the valuation of callable and putable bonds?<\/td><\/tr><\/table><\/div><p>Foster sets to work preparing his analysis and answers to the questions that his supervisor believes may come up at the next meeting. While he thinks he can explain the answer to the first question to Acton quite easily, he feels the second may be more difficult to explain clearly. In preparation, Foster calculates two spread measures for a 10-year single A rated Carlson Manufacturing bond of medium liquidity. It is currently trading at a nominal spread of minus 20 basis points to the benchmark yield to maturity of a single A rated medium-liquidity option-free note. The OAS he calculates using his interest rate tree is 15 basis points.<\/p><\/div><\/details><div class=\"qtext\"><p>The issue price of the note issue (% of par) if Acton chooses to issue the putable note is closest to:<\/p><\/div>","subj":"fixed"},{"n":71,"q":"The increase in the required yield to maturity at issuance of the note if Acton decides to include the proposed call feature is closest to:","opts":["0.07%.","0.09%.","0.11%."],"ans":"A","expl":"(1050/1.055)+1000\n[ 2 | +50]\nBond Value = (1.052) | = $995.85\nSince the note is callable at par ($1,000) after one year, the call option will be exercised at the lower year-one node. So, the bond value at this node is replaced by $1,000 (plus the $50 coupon).\nFrom this value, the yield to maturity at issuance can then be computed using our financial calculator:\nPV= –995.85, N=2, PMT = 50, FV=1,000; CPT I/Y = 5.22% The yield to maturity at issuance with no embedded options was calculated as: PV= –997.21, N=2, PMT = 50, FV=1,000; CPT I/Y = 5.15% Yield increase = 5.22% – 5.15% = 0.07% (Module 27.2, LOS 27.f)","explhtml":"<p>(1050/1.055)+1000<\/p><div class=\"tbl\"><table><tr><td>[ 2<\/td><td>+50]<\/td><\/tr><tr><td>Bond Value = (1.052)<\/td><td>= $995.85<\/td><\/tr><\/table><\/div><p>Since the note is callable at par ($1,000) after one year, the call option will be exercised at the lower year-one node. So, the bond value at this node is replaced by $1,000 (plus the $50 coupon).<\/p><p>From this value, the yield to maturity at issuance can then be computed using our financial calculator:<\/p><p>PV= –995.85, N=2, PMT = 50, FV=1,000; CPT I/Y = 5.22% The yield to maturity at issuance with no embedded options was calculated as: PV= –997.21, N=2, PMT = 50, FV=1,000; CPT I/Y = 5.15% Yield increase = 5.22% – 5.15% = 0.07% (Module 27.2, LOS 27.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alan Foster, CFA, is a fixed income analyst for Quantshop, an investment management firm. Alan has been asked by his supervisor to prepare an analysis of a proposed bond offering by Acton Industries. The proposed offering is a 2-year annual-pay bond with a 5% coupon which Quantshop management believes will carry a single A rating.<\/p><p>Foster has developed an arbitrage-free interest rate tree for single A credits with medium liquidity. Part of this tree for the next five annual periods is as follows:<\/p><div class=\"tbl\"><table><tr><td>Present<\/td><td>1 year<\/td><td>2 years<\/td><td>3 years 5.8%<\/td><td>4 years 5.6%<\/td><\/tr><tr><td>5.9%<\/td><td>5.35%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5.5%<\/td><td>5.4%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5.2%<\/td><td>4.8%<\/td><td>5.2%<\/td><td><\/td><td><\/td><\/tr><tr><td>4.7%<\/td><td>4.9%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>4.6% 4.8%<\/td><td>4.9% 4.6%<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>As part of his analysis, Foster has been asked by Acton to consider the effect on the market yield of options that may be embedded in the note offering, specifically a par call exercisable after one year or a par put exercisable after one year.<\/p><p>Additionally, Foster&#x27;s supervisor has asked him to prepare answers to the following questions that he feels may come up during the next meeting with Acton:<\/p><div class=\"tbl\"><table><tr><td>Question:<\/td><td>If our proprietary interest rate volatility estimates are too high, what will be the impact on the valuation of callable and putable bonds?<\/td><\/tr><\/table><\/div><p>Foster sets to work preparing his analysis and answers to the questions that his supervisor believes may come up at the next meeting. While he thinks he can explain the answer to the first question to Acton quite easily, he feels the second may be more difficult to explain clearly. In preparation, Foster calculates two spread measures for a 10-year single A rated Carlson Manufacturing bond of medium liquidity. It is currently trading at a nominal spread of minus 20 basis points to the benchmark yield to maturity of a single A rated medium-liquidity option-free note. The OAS he calculates using his interest rate tree is 15 basis points.<\/p><\/div><\/details><div class=\"qtext\"><p>The increase in the required yield to maturity at issuance of the note if Acton decides to include the proposed call feature is closest to:<\/p><\/div>","subj":"fixed"},{"n":72,"q":"What is the most likely impact of higher estimated volatility on the valuation of different bonds?\nCallable | Putable","opts":["Undervalued Overvalued","Overvalued Undervalued","Overvalued Overvalued"],"ans":"A","expl":"Higher assumed levels of volatility would overestimate the values of both call and put options. Hence, callable bonds (Vcallable = Vstraight – Vcall) would be undervalued, and putable bonds (Vputable = Vstraight + Vput) would be overvalued.\n(Module 27.4, LOS 27.h)","explhtml":"<p>Higher assumed levels of volatility would overestimate the values of both call and put options. Hence, callable bonds (Vcallable = Vstraight – Vcall) would be undervalued, and putable bonds (Vputable = Vstraight + Vput) would be overvalued.<\/p><p>(Module 27.4, LOS 27.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alan Foster, CFA, is a fixed income analyst for Quantshop, an investment management firm. Alan has been asked by his supervisor to prepare an analysis of a proposed bond offering by Acton Industries. The proposed offering is a 2-year annual-pay bond with a 5% coupon which Quantshop management believes will carry a single A rating.<\/p><p>Foster has developed an arbitrage-free interest rate tree for single A credits with medium liquidity. Part of this tree for the next five annual periods is as follows:<\/p><div class=\"tbl\"><table><tr><td>Present<\/td><td>1 year<\/td><td>2 years<\/td><td>3 years 5.8%<\/td><td>4 years 5.6%<\/td><\/tr><tr><td>5.9%<\/td><td>5.35%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5.5%<\/td><td>5.4%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5.2%<\/td><td>4.8%<\/td><td>5.2%<\/td><td><\/td><td><\/td><\/tr><tr><td>4.7%<\/td><td>4.9%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>4.6% 4.8%<\/td><td>4.9% 4.6%<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>As part of his analysis, Foster has been asked by Acton to consider the effect on the market yield of options that may be embedded in the note offering, specifically a par call exercisable after one year or a par put exercisable after one year.<\/p><p>Additionally, Foster&#x27;s supervisor has asked him to prepare answers to the following questions that he feels may come up during the next meeting with Acton:<\/p><div class=\"tbl\"><table><tr><td>Question:<\/td><td>If our proprietary interest rate volatility estimates are too high, what will be the impact on the valuation of callable and putable bonds?<\/td><\/tr><\/table><\/div><p>Foster sets to work preparing his analysis and answers to the questions that his supervisor believes may come up at the next meeting. While he thinks he can explain the answer to the first question to Acton quite easily, he feels the second may be more difficult to explain clearly. In preparation, Foster calculates two spread measures for a 10-year single A rated Carlson Manufacturing bond of medium liquidity. It is currently trading at a nominal spread of minus 20 basis points to the benchmark yield to maturity of a single A rated medium-liquidity option-free note. The OAS he calculates using his interest rate tree is 15 basis points.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the most likely impact of higher estimated volatility on the valuation of different bonds?<\/p><div class=\"tbl\"><table><tr><td>Callable<\/td><td>Putable<\/td><\/tr><\/table><\/div><\/div>","subj":"fixed"},{"n":73,"q":"The market conversion premium ratio on the convertible bond is closest to:","opts":["0.5%.","9.8%.","15.9%."],"ans":"C","expl":"Value of convertible:\nPMT = 35, N = 10, I/Y = 3, FV = 1,000; CPT PV = 1,042.65 Market conversion price = price of convertible / conversion ratio = 1,042.65/45 = 23.17 Market conversion premium per share = market conversion price – stock's market price = 23.17 – 20 = $3.17 Market conversion premium ratio = market conversion premium per share / stock price = 3.17 / 20 = 15.85% (Module 27.8, LOS 27.o)","explhtml":"<p>Value of convertible:<\/p><p>PMT = 35, N = 10, I/Y = 3, FV = 1,000; CPT PV = 1,042.65 Market conversion price = price of convertible / conversion ratio = 1,042.65/45 = 23.17 Market conversion premium per share = market conversion price – stock&#x27;s market price = 23.17 – 20 = $3.17 Market conversion premium ratio = market conversion premium per share / stock price = 3.17 / 20 = 15.85% (Module 27.8, LOS 27.o)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Fixed Income<\/summary><div class=\"vig-body\"><p>Alpha+ Strategies is a hedge fund that focuses on investing in fixed income securities. The fund specializes in investing in complex instruments with embedded options, and often uses short positions in closely-related option-free bonds to hedge interest rate and credit risk exposures.<\/p><p>Bill Weld, a senior analyst at Alpha+, is considering taking a position in Pioneer&#x27;s 10-year convertible debenture. It has a 3.5% annual coupon and is convertible at the rate of 45 Pioneer shares per $1,000 par bond. Pioneer shares are currently trading at $20, and have an expected dividend yield of 2.8% for the coming year. Weld states that the conversion feature would lower the yield on the bod from 3.5% to 3%.<\/p><p>Weld uses interest rate volatility of 15% for his models but is concerned about this estimate. He specifically wants to know the impact that a too-high estimate of volatility would have on the valuation of callable and putable bonds.<\/p><p>Weld meets with Bill Stys, Ph.D., the chief economist at Alpha+. Weld raises the topic of models that seek to explain the equilibrium term structure of interest rates and arbitrage-free models. Stys makes the following statements about these models:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>One of the models assumes that interest rate volatility increases with<\/td><\/tr><tr><td>1:<\/td><td>the level of interest rates.<\/td><\/tr><tr><td>Statement<\/td><td>One of the models takes the current yield curve as given, and produces<\/td><\/tr><tr><td>2:<\/td><td>a symmetrical distribution of future rates.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The market conversion premium ratio on the convertible bond is closest to:<\/p><\/div>","subj":"fixed"},{"n":74,"q":"The most likely effects of increased interest rate volatility on the value of an option-free bond and on the value of a callable bond are, respectively:\nOption-free | Callable","opts":["decrease increase","no effect decrease","decrease decrease"],"ans":"A","expl":"An increase in interest rate volatility will not affect the value of the option-free bond, but will increase the value of the call, and thereby decrease the value of a callable bond.\n(Module 27.3, LOS 27.d)","explhtml":"<p>An increase in interest rate volatility will not affect the value of the option-free bond, but will increase the value of the call, and thereby decrease the value of a callable bond.<\/p><p>(Module 27.3, LOS 27.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alpha+ Strategies is a hedge fund that focuses on investing in fixed income securities. The fund specializes in investing in complex instruments with embedded options, and often uses short positions in closely-related option-free bonds to hedge interest rate and credit risk exposures.<\/p><p>Bill Weld, a senior analyst at Alpha+, is considering taking a position in Pioneer&#x27;s 10-year convertible debenture. It has a 3.5% annual coupon and is convertible at the rate of 45 Pioneer shares per $1,000 par bond. Pioneer shares are currently trading at $20, and have an expected dividend yield of 2.8% for the coming year. Weld states that the conversion feature would lower the yield on the bod from 3.5% to 3%.<\/p><p>Weld uses interest rate volatility of 15% for his models but is concerned about this estimate. He specifically wants to know the impact that a too-high estimate of volatility would have on the valuation of callable and putable bonds.<\/p><p>Weld meets with Bill Stys, Ph.D., the chief economist at Alpha+. Weld raises the topic of models that seek to explain the equilibrium term structure of interest rates and arbitrage-free models. Stys makes the following statements about these models:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>One of the models assumes that interest rate volatility increases with<\/td><\/tr><tr><td>1:<\/td><td>the level of interest rates.<\/td><\/tr><tr><td>Statement<\/td><td>One of the models takes the current yield curve as given, and produces<\/td><\/tr><tr><td>2:<\/td><td>a symmetrical distribution of future rates.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The most likely effects of increased interest rate volatility on the value of an option-free bond and on the value of a callable bond are, respectively:<\/p><div class=\"tbl\"><table><tr><td>Option-free<\/td><td>Callable<\/td><\/tr><\/table><\/div><\/div>","subj":"fixed"},{"n":75,"q":"Stys's statement 1 would be most accurate as a description of:","opts":["the Ho-Lee model.","the Vasicek model.","the Cox-Ingersoll-Ross model."],"ans":"C","expl":"The CIR model dr = a(b−r) dt + σ√r dz states that interest rate volatility increases with the level of the short-term interest rate.\n(Module 26.3, LOS 26.i)","explhtml":"<p>The CIR model dr = a(b−r) dt + σ√r dz states that interest rate volatility increases with the level of the short-term interest rate.<\/p><p>(Module 26.3, LOS 26.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alpha+ Strategies is a hedge fund that focuses on investing in fixed income securities. The fund specializes in investing in complex instruments with embedded options, and often uses short positions in closely-related option-free bonds to hedge interest rate and credit risk exposures.<\/p><p>Bill Weld, a senior analyst at Alpha+, is considering taking a position in Pioneer&#x27;s 10-year convertible debenture. It has a 3.5% annual coupon and is convertible at the rate of 45 Pioneer shares per $1,000 par bond. Pioneer shares are currently trading at $20, and have an expected dividend yield of 2.8% for the coming year. Weld states that the conversion feature would lower the yield on the bod from 3.5% to 3%.<\/p><p>Weld uses interest rate volatility of 15% for his models but is concerned about this estimate. He specifically wants to know the impact that a too-high estimate of volatility would have on the valuation of callable and putable bonds.<\/p><p>Weld meets with Bill Stys, Ph.D., the chief economist at Alpha+. Weld raises the topic of models that seek to explain the equilibrium term structure of interest rates and arbitrage-free models. Stys makes the following statements about these models:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>One of the models assumes that interest rate volatility increases with<\/td><\/tr><tr><td>1:<\/td><td>the level of interest rates.<\/td><\/tr><tr><td>Statement<\/td><td>One of the models takes the current yield curve as given, and produces<\/td><\/tr><tr><td>2:<\/td><td>a symmetrical distribution of future rates.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Stys&#x27;s statement 1 would be most accurate as a description of:<\/p><\/div>","subj":"fixed"},{"n":76,"q":"Stys's statement 2 would be most accurate as a description of:","opts":["the Ho-Lee model.","the Vasicek model.","the Cox-Ingersoll-Ross model."],"ans":"A","expl":"Arbitrage-free models do not attempt to justify the current yield curve; instead, they take this curve as given. The Ho-Lee model drt= θtdt + σdzt, an arbitrage-free model, is calibrated by using market prices to find the time-dependent drift term θt that generates the current term structure. The model produces a symmetrical (normal) distribution of future rates.\n(Module 26.3, LOS 26.i)","explhtml":"<p>Arbitrage-free models do not attempt to justify the current yield curve; instead, they take this curve as given. The Ho-Lee model drt= θtdt + σdzt, an arbitrage-free model, is calibrated by using market prices to find the time-dependent drift term θt that generates the current term structure. The model produces a symmetrical (normal) distribution of future rates.<\/p><p>(Module 26.3, LOS 26.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alpha+ Strategies is a hedge fund that focuses on investing in fixed income securities. The fund specializes in investing in complex instruments with embedded options, and often uses short positions in closely-related option-free bonds to hedge interest rate and credit risk exposures.<\/p><p>Bill Weld, a senior analyst at Alpha+, is considering taking a position in Pioneer&#x27;s 10-year convertible debenture. It has a 3.5% annual coupon and is convertible at the rate of 45 Pioneer shares per $1,000 par bond. Pioneer shares are currently trading at $20, and have an expected dividend yield of 2.8% for the coming year. Weld states that the conversion feature would lower the yield on the bod from 3.5% to 3%.<\/p><p>Weld uses interest rate volatility of 15% for his models but is concerned about this estimate. He specifically wants to know the impact that a too-high estimate of volatility would have on the valuation of callable and putable bonds.<\/p><p>Weld meets with Bill Stys, Ph.D., the chief economist at Alpha+. Weld raises the topic of models that seek to explain the equilibrium term structure of interest rates and arbitrage-free models. Stys makes the following statements about these models:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>One of the models assumes that interest rate volatility increases with<\/td><\/tr><tr><td>1:<\/td><td>the level of interest rates.<\/td><\/tr><tr><td>Statement<\/td><td>One of the models takes the current yield curve as given, and produces<\/td><\/tr><tr><td>2:<\/td><td>a symmetrical distribution of future rates.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Stys&#x27;s statement 2 would be most accurate as a description of:<\/p><\/div>","subj":"fixed"},{"n":77,"q":"Under the binomial model, if an equity put option is overpriced in the market, the most appropriate action is to write the put option and:","opts":["purchase stock and borrow.","sell stock and borrow.","sell stock and lend."],"ans":"C","expl":"The equity put option is overpriced in the market, so to profit we want to go short (or write) that put option (\"sell high\"). To then hedge this short put position, we need a synthetic long put option, which can be replicated by lending that is funded by short-sale of the underlying stock. (A long put option is equivalent to a short position in the underlying, plus lending.)\n(Module 31.2, LOS 31.c)","explhtml":"<p>The equity put option is overpriced in the market, so to profit we want to go short (or write) that put option (&quot;sell high&quot;). To then hedge this short put position, we need a synthetic long put option, which can be replicated by lending that is funded by short-sale of the underlying stock. (A long put option is equivalent to a short position in the underlying, plus lending.)<\/p><p>(Module 31.2, LOS 31.c)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Derivatives<\/summary><div class=\"vig-body\"><p>Ayub Khan is a derivatives trader at Simyar Investments. Khan is having his weekly meeting with Alnoor Adai, one of the interns at Simyar. Adai has questions pertaining to valuation of options using the Black-Scholes model as well as the binomial model.<\/p><p>After answering those questions, Khan then discusses options on futures. He states that Simyar currently holds options on S&amp;P 500 futures. The options have a delta of 0.5389 and N(d2) of 0.4609. Additionally, the firm currently has a long position in an interest rate cap but Khan would rather have a payer swap position with the same maturity, reference rate, and settlement dates.<\/p><\/div><\/details><div class=\"qtext\"><p>Under the binomial model, if an equity put option is overpriced in the market, the most appropriate action is to write the put option and:<\/p><\/div>","subj":"derivatives"},{"n":78,"q":"According to the Black-Scholes-Merton option pricing model, the change in the value of an equity call option resulting from an increase in the risk-free rate is most likely to be in the same direction as a change in the value of the call option resulting from:","opts":["an increase in volatility.","a decrease in the price of the stock.","a decrease in the time to expiration."],"ans":"A","expl":"A call option's rho, vega, and delta are all positive. (Module 31.7, LOS 31.k)","explhtml":"<p>A call option&#x27;s rho, vega, and delta are all positive. (Module 31.7, LOS 31.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ayub Khan is a derivatives trader at Simyar Investments. Khan is having his weekly meeting with Alnoor Adai, one of the interns at Simyar. Adai has questions pertaining to valuation of options using the Black-Scholes model as well as the binomial model.<\/p><p>After answering those questions, Khan then discusses options on futures. He states that Simyar currently holds options on S&amp;P 500 futures. The options have a delta of 0.5389 and N(d2) of 0.4609. Additionally, the firm currently has a long position in an interest rate cap but Khan would rather have a payer swap position with the same maturity, reference rate, and settlement dates.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the Black-Scholes-Merton option pricing model, the change in the value of an equity call option resulting from an increase in the risk-free rate is most likely to be in the same direction as a change in the value of the call option resulting from:<\/p><\/div>","subj":"derivatives"},{"n":79,"q":"Which of the following is most accurate regarding valuation of the call option on S&P 500 futures using the Black model? Value can be estimated as:","opts":["the present value of the difference between 0.5389 times the current futures price and 0.4609 times the exercise price.","the difference between 0.5389 times the current futures price and 0.4609 times the exercise price.","the difference between 0.5389 times the futures price at expiration and 0.5391 times the exercise price."],"ans":"A","expl":"Under the Black model, the value of a call option on a futures contract is given by the present value of the difference between the current futures price times N(d1) and the exercise price × N(d2).\n−Rf × T\nC0 = e | [FT × N(d1) − X × N(d2)]\n(Module 31.6, LOS 31.i)","explhtml":"<p>Under the Black model, the value of a call option on a futures contract is given by the present value of the difference between the current futures price times N(d1) and the exercise price × N(d2).<\/p><p><sup>−Rf × T<\/sup><\/p><div class=\"tbl\"><table><tr><td>C0 = e<\/td><td>[FT × N(d1) − X × N(d2)]<\/td><\/tr><\/table><\/div><p>(Module 31.6, LOS 31.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ayub Khan is a derivatives trader at Simyar Investments. Khan is having his weekly meeting with Alnoor Adai, one of the interns at Simyar. Adai has questions pertaining to valuation of options using the Black-Scholes model as well as the binomial model.<\/p><p>After answering those questions, Khan then discusses options on futures. He states that Simyar currently holds options on S&amp;P 500 futures. The options have a delta of 0.5389 and N(d2) of 0.4609. Additionally, the firm currently has a long position in an interest rate cap but Khan would rather have a payer swap position with the same maturity, reference rate, and settlement dates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is most accurate regarding valuation of the call option on S&amp;P 500 futures using the Black model? Value can be estimated as:<\/p><\/div>","subj":"derivatives"},{"n":80,"q":"Which of the following trades would convert Simyar's existing position into a payer swap?","opts":["A short floor with the same exercise price as the cap.","A long floor with the same exercise price as the cap.","A portfolio of long FRAs with the same exercise price."],"ans":"A","expl":"If the exercise rate on a cap and floor is same, a long cap and short floor can be used to replicate a payer swap. The firm currently has a long cap and hence a short floor is needed to combine into an equivalent payer swap.\n(Module 31.6, LOS 31.j)","explhtml":"<p>If the exercise rate on a cap and floor is same, a long cap and short floor can be used to replicate a payer swap. The firm currently has a long cap and hence a short floor is needed to combine into an equivalent payer swap.<\/p><p>(Module 31.6, LOS 31.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ayub Khan is a derivatives trader at Simyar Investments. Khan is having his weekly meeting with Alnoor Adai, one of the interns at Simyar. Adai has questions pertaining to valuation of options using the Black-Scholes model as well as the binomial model.<\/p><p>After answering those questions, Khan then discusses options on futures. He states that Simyar currently holds options on S&amp;P 500 futures. The options have a delta of 0.5389 and N(d2) of 0.4609. Additionally, the firm currently has a long position in an interest rate cap but Khan would rather have a payer swap position with the same maturity, reference rate, and settlement dates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following trades would convert Simyar&#x27;s existing position into a payer swap?<\/p><\/div>","subj":"derivatives"},{"n":81,"q":"Backwardation is least likely to be associated with:","opts":["positive roll return.","the insurance hypothesis.","high storage costs relative to convenience yield."],"ans":"C","expl":"Backwardation indicates a downward-sloping price curve (i.e., the spot price is higher than futures prices). Roll return from rolling maturing futures contracts in a backwardated market will be positive. The insurance hypothesis explains backwardation as naturally occurring due risk-averse producer-shorts driving futures price down. When storage costs are higher than convenience yield, futures price will be higher than spot prices and market will be in contango.\n(Module 32.1, LOS 32.f)","explhtml":"<p>Backwardation indicates a downward-sloping price curve (i.e., the spot price is higher than futures prices). Roll return from rolling maturing futures contracts in a backwardated market will be positive. The insurance hypothesis explains backwardation as naturally occurring due risk-averse producer-shorts driving futures price down. When storage costs are higher than convenience yield, futures price will be higher than spot prices and market will be in contango.<\/p><p>(Module 32.1, LOS 32.f)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Jim Henry, principal with Axis Investment Consultants, Inc. (&quot;Axis&quot;), is preparing to give a presentation to Steve Salter, CFO of Aria Insurance, Inc. (&quot;Aria&quot;). Henry has been trying to land the Aria account for a long time. During their previous meeting, Salter had mentioned that Aria wants to increase its portfolio allocation to commodities.<\/p><p>Henry includes information on the term structure of commodity prices and theories that explain the term structure.<\/p><p>Henry&#x27;s recommendation states that Aria should look for commodity funds specializing in investing in futures contracts that exhibit backwardation.<\/p><p>Henry&#x27;s report also includes information on using total return swap contracts. Henry includes price information on sugar futures contracts (ICE: Sugar11) as the underlying on a total return swap as shown in  Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB).<\/p><p>Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB)<\/p><div class=\"tbl\"><table><tr><td>Month<\/td><td>Price<\/td><\/tr><tr><td>July (swap initiation)<\/td><td>13.84<\/td><\/tr><tr><td>August<\/td><td>13.22<\/td><\/tr><tr><td>September<\/td><td>13.49<\/td><\/tr><\/table><\/div><p>Henry has received an inquiry from a large pension plan that wishes to allocate a portion of their portfolio to Axis. Henry prepares a presentation for the trustees of the plan, including the merits of a portfolio allocation to hedge funds.<\/p><\/div><\/details><div class=\"qtext\"><p>Backwardation is least likely to be associated with:<\/p><\/div>","subj":"alternatives"},{"n":82,"q":"Assume a notional principal of 112,000 pounds of raw cane sugar and a monthly reset. Using the information in  Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB), for the month of September, it would be most accurate to state that the party that is long the sugar futures contract would:","opts":["pay $241.07","receive $270.00","receive $302.40"],"ans":"C","expl":"The long party receives a return based on the performance of the contract for the month of September. Since the price increased from 13.22 to 13.49, return = (13.49 − 13.22) = +0.27 US CTS/LB. Payment received by total return receiver (long party) = 0.27 US CTS/LB × 112,000 lb = 30,240¢ = $302.40.\n(Module 32.2, LOS 32.i)","explhtml":"<p>The long party receives a return based on the performance of the contract for the month of September. Since the price increased from 13.22 to 13.49, return = (13.49 − 13.22) = +0.27 US CTS/LB. Payment received by total return receiver (long party) = 0.27 US CTS/LB × 112,000 lb = 30,240¢ = $302.40.<\/p><p>(Module 32.2, LOS 32.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jim Henry, principal with Axis Investment Consultants, Inc. (&quot;Axis&quot;), is preparing to give a presentation to Steve Salter, CFO of Aria Insurance, Inc. (&quot;Aria&quot;). Henry has been trying to land the Aria account for a long time. During their previous meeting, Salter had mentioned that Aria wants to increase its portfolio allocation to commodities.<\/p><p>Henry includes information on the term structure of commodity prices and theories that explain the term structure.<\/p><p>Henry&#x27;s recommendation states that Aria should look for commodity funds specializing in investing in futures contracts that exhibit backwardation.<\/p><p>Henry&#x27;s report also includes information on using total return swap contracts. Henry includes price information on sugar futures contracts (ICE: Sugar11) as the underlying on a total return swap as shown in  Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB).<\/p><p>Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB)<\/p><div class=\"tbl\"><table><tr><td>Month<\/td><td>Price<\/td><\/tr><tr><td>July (swap initiation)<\/td><td>13.84<\/td><\/tr><tr><td>August<\/td><td>13.22<\/td><\/tr><tr><td>September<\/td><td>13.49<\/td><\/tr><\/table><\/div><p>Henry has received an inquiry from a large pension plan that wishes to allocate a portion of their portfolio to Axis. Henry prepares a presentation for the trustees of the plan, including the merits of a portfolio allocation to hedge funds.<\/p><\/div><\/details><div class=\"qtext\"><p>Assume a notional principal of 112,000 pounds of raw cane sugar and a monthly reset. Using the information in  Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB), for the month of September, it would be most accurate to state that the party that is long the sugar futures contract would:<\/p><\/div>","subj":"alternatives"},{"n":83,"q":"Suppose that one month ago, a trader took a long position in July sugar futures at a contract price of 13.85 US cents per pound (US CTS/LB). This position is near expiration and has a current price of 13.69 US CTS/LB. The trader will roll the expiring contract into September futures contracts which are currently trading at 13.53 US CTS/LB. The collateral yield is 3%. The total return for a fully collateralized position is closest to:","opts":["−0.24%","0.26%","2.57%"],"ans":"B","expl":"Price return = (current price - previous price) / previous price = (13.69 - 13.85) / 13.85 = -1.16% Roll return = (near-term futures price - longer-term futures price) / near-term price = (13.69 - 13.53) / 13.69 = 1.17% Collateral return = 3% / 12 = 0.25% Total return = -1.16% + 1.17% + 0.25% = 0.26% (Module 32.2, LOS 32.g)","explhtml":"<p>Price return = (current price - previous price) / previous price = (13.69 - 13.85) / 13.85 = -1.16% Roll return = (near-term futures price - longer-term futures price) / near-term price = (13.69 - 13.53) / 13.69 = 1.17% Collateral return = 3% / 12 = 0.25% Total return = -1.16% + 1.17% + 0.25% = 0.26% (Module 32.2, LOS 32.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jim Henry, principal with Axis Investment Consultants, Inc. (&quot;Axis&quot;), is preparing to give a presentation to Steve Salter, CFO of Aria Insurance, Inc. (&quot;Aria&quot;). Henry has been trying to land the Aria account for a long time. During their previous meeting, Salter had mentioned that Aria wants to increase its portfolio allocation to commodities.<\/p><p>Henry includes information on the term structure of commodity prices and theories that explain the term structure.<\/p><p>Henry&#x27;s recommendation states that Aria should look for commodity funds specializing in investing in futures contracts that exhibit backwardation.<\/p><p>Henry&#x27;s report also includes information on using total return swap contracts. Henry includes price information on sugar futures contracts (ICE: Sugar11) as the underlying on a total return swap as shown in  Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB).<\/p><p>Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB)<\/p><div class=\"tbl\"><table><tr><td>Month<\/td><td>Price<\/td><\/tr><tr><td>July (swap initiation)<\/td><td>13.84<\/td><\/tr><tr><td>August<\/td><td>13.22<\/td><\/tr><tr><td>September<\/td><td>13.49<\/td><\/tr><\/table><\/div><p>Henry has received an inquiry from a large pension plan that wishes to allocate a portion of their portfolio to Axis. Henry prepares a presentation for the trustees of the plan, including the merits of a portfolio allocation to hedge funds.<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose that one month ago, a trader took a long position in July sugar futures at a contract price of 13.85 US cents per pound (US CTS/LB). This position is near expiration and has a current price of 13.69 US CTS/LB. The trader will roll the expiring contract into September futures contracts which are currently trading at 13.53 US CTS/LB. The collateral yield is 3%. The total return for a fully collateralized position is closest to:<\/p><\/div>","subj":"alternatives"},{"n":84,"q":"The hedge fund strategy that is most likely to be used to counterbalance negative skew in portfolio return distribution is:","opts":["merger arbitrage.","global macro.","managed futures."],"ans":"C","expl":"Managed futures strategies have been shown to exhibit positive skewness (right tail skew) during times of market turmoil, and hence may be helpful in counterbalancing the returns of negatively-skewed strategies.\n(Module 34.3, LOS 34.e)","explhtml":"<p>Managed futures strategies have been shown to exhibit positive skewness (right tail skew) during times of market turmoil, and hence may be helpful in counterbalancing the returns of negatively-skewed strategies.<\/p><p>(Module 34.3, LOS 34.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jim Henry, principal with Axis Investment Consultants, Inc. (&quot;Axis&quot;), is preparing to give a presentation to Steve Salter, CFO of Aria Insurance, Inc. (&quot;Aria&quot;). Henry has been trying to land the Aria account for a long time. During their previous meeting, Salter had mentioned that Aria wants to increase its portfolio allocation to commodities.<\/p><p>Henry includes information on the term structure of commodity prices and theories that explain the term structure.<\/p><p>Henry&#x27;s recommendation states that Aria should look for commodity funds specializing in investing in futures contracts that exhibit backwardation.<\/p><p>Henry&#x27;s report also includes information on using total return swap contracts. Henry includes price information on sugar futures contracts (ICE: Sugar11) as the underlying on a total return swap as shown in  Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB).<\/p><p>Exhibit 1: Sugar Futures Prices in US cents per pound (US CTS/LB)<\/p><div class=\"tbl\"><table><tr><td>Month<\/td><td>Price<\/td><\/tr><tr><td>July (swap initiation)<\/td><td>13.84<\/td><\/tr><tr><td>August<\/td><td>13.22<\/td><\/tr><tr><td>September<\/td><td>13.49<\/td><\/tr><\/table><\/div><p>Henry has received an inquiry from a large pension plan that wishes to allocate a portion of their portfolio to Axis. Henry prepares a presentation for the trustees of the plan, including the merits of a portfolio allocation to hedge funds.<\/p><\/div><\/details><div class=\"qtext\"><p>The hedge fund strategy that is most likely to be used to counterbalance negative skew in portfolio return distribution is:<\/p><\/div>","subj":"alternatives"},{"n":85,"q":"Do Bravo's IPO allocation policy and differing levels of service comply with the CFA Institute's Standards?","opts":["Neither the IPO allocation methods nor the differing levels of service comply with the Standards.","The IPO allocation method is not in compliance, while the differing levels of service are in compliance.","Both the IPO allocation method and the differing levels of service are in compliance with the Standards."],"ans":"B","expl":"IPO allocation should be by pro-rata by clients (for whom the investment is suitable) rather than by portfolio managers. Differing levels of service does not violate the Standards as long as the practice is disclosed to clients.\n(Module 42.5, LOS 42.a)","explhtml":"<p>IPO allocation should be by pro-rata by clients (for whom the investment is suitable) rather than by portfolio managers. Differing levels of service does not violate the Standards as long as the practice is disclosed to clients.<\/p><p>(Module 42.5, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Bahman Goldoon, CFA, is research director at Bravo Capital LP (&quot;Bravo&quot;), a boutique asset management firm that manages the portfolios of several high- and medium-net-worth clients. Bravo has several portfolio managers, who each manage a number of client accounts.<\/p><p>While Bravo has not formally adopted the CFA Institute&#x27;s Code and Standards, it strives to ensure that the firm behaves ethically and that it complies with all laws and regulations. To ensure regulatory compliance, Bravo has a policy that all portfolio managers are responsible for ensuring that the employees they supervise follow all applicable laws, rules, and regulations.<\/p><p>One particular area of concern for Bravo is allocation of IPO shares to client accounts. Bravo has a policy of allocating IPO shares equally among all portfolio managers. The portfolio managers then allocate the shares to the accounts under their control based on suitability. Bravo also has a long-standing practice of offering different levels of service depending on the amount of fees that each client pays. The fee structure and available levels of service are disclosed to clients annually.<\/p><p>Bravo subscribes to research from Analytics Inc. to help Bravo track appropriate level of credit spread for corporate bonds purchased for client accounts. Goldoon has determined that the research from Analytics is very thorough, however Goldoon has not disclosed to clients that he relies on this information. Based on this research, Goldoon prepares a list of bonds that offer attractive yields and distributes the list to all Bravo portfolio managers.<\/p><p>Bravo has a longstanding relationship with Sequoia, a bond trading firm. If Sequoia makes a market in a specific bond, Sequoia will accept a Bravo trade for below-market commission. Additionally, any Bravo portfolio manager that generates more than $10 million in trades with Sequoia is treated by Sequoia to an all-expenses paid trip to the prestigious annual Investors&#x27; Roundtable conference.<\/p><p>Goldoon serves as a trustee for a local charitable foundation. Goldoon includes in his monthly client newsletter a mention of the foundation and its activities, as well as information on the foundation&#x27;s current fundraising drive.<\/p><\/div><\/details><div class=\"qtext\"><p>Do Bravo&#x27;s IPO allocation policy and differing levels of service comply with the CFA Institute&#x27;s Standards?<\/p><\/div>","subj":"ethics"},{"n":86,"q":"Does Bravo's reliance on research from Analytics Inc. and/or its relationship with Sequoia violate any CFA Institute Standards?","opts":["Neither the reliance on Analytics research nor the relationship with Sequoia is in compliance with the Standards.","Only the reliance on Analytics research is in compliance with the Standards.","The reliance on Analytics research and the relationship with Sequoia is in compliance with the Standards."],"ans":"B","expl":"Members can rely on third party research as long as such research is sound and has reasonable basis. The relationship with Sequoia is fraught with conflict of interest as portfolio managers have incentive to channel trades through Sequoia as well as to churn client accounts; hence the relationship with Sequoia violates Standard III(A) – Loyalty, Prudence, and Care.\n(Module 42.5, LOS 42.a)","explhtml":"<p>Members can rely on third party research as long as such research is sound and has reasonable basis. The relationship with Sequoia is fraught with conflict of interest as portfolio managers have incentive to channel trades through Sequoia as well as to churn client accounts; hence the relationship with Sequoia violates Standard III(A) – Loyalty, Prudence, and Care.<\/p><p>(Module 42.5, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bahman Goldoon, CFA, is research director at Bravo Capital LP (&quot;Bravo&quot;), a boutique asset management firm that manages the portfolios of several high- and medium-net-worth clients. Bravo has several portfolio managers, who each manage a number of client accounts.<\/p><p>While Bravo has not formally adopted the CFA Institute&#x27;s Code and Standards, it strives to ensure that the firm behaves ethically and that it complies with all laws and regulations. To ensure regulatory compliance, Bravo has a policy that all portfolio managers are responsible for ensuring that the employees they supervise follow all applicable laws, rules, and regulations.<\/p><p>One particular area of concern for Bravo is allocation of IPO shares to client accounts. Bravo has a policy of allocating IPO shares equally among all portfolio managers. The portfolio managers then allocate the shares to the accounts under their control based on suitability. Bravo also has a long-standing practice of offering different levels of service depending on the amount of fees that each client pays. The fee structure and available levels of service are disclosed to clients annually.<\/p><p>Bravo subscribes to research from Analytics Inc. to help Bravo track appropriate level of credit spread for corporate bonds purchased for client accounts. Goldoon has determined that the research from Analytics is very thorough, however Goldoon has not disclosed to clients that he relies on this information. Based on this research, Goldoon prepares a list of bonds that offer attractive yields and distributes the list to all Bravo portfolio managers.<\/p><p>Bravo has a longstanding relationship with Sequoia, a bond trading firm. If Sequoia makes a market in a specific bond, Sequoia will accept a Bravo trade for below-market commission. Additionally, any Bravo portfolio manager that generates more than $10 million in trades with Sequoia is treated by Sequoia to an all-expenses paid trip to the prestigious annual Investors&#x27; Roundtable conference.<\/p><p>Goldoon serves as a trustee for a local charitable foundation. Goldoon includes in his monthly client newsletter a mention of the foundation and its activities, as well as information on the foundation&#x27;s current fundraising drive.<\/p><\/div><\/details><div class=\"qtext\"><p>Does Bravo&#x27;s reliance on research from Analytics Inc. and/or its relationship with Sequoia violate any CFA Institute Standards?<\/p><\/div>","subj":"ethics"},{"n":87,"q":"Is Bravo's regulatory compliance policy consistent with the CFA Institute's Standards of Professional Conduct?","opts":["Yes.","No, because the policy does not cover every employee.","No, because Bravo is required to adopt the CFA Institute’s Standards of Professional Conduct."],"ans":"B","expl":"Standard IV(B) – Responsibilities of Supervisors states that any employee that has a supervisory role (not just portfolio managers) must ensure that the employees subject to their supervision or authority comply with all laws, rules, and regulations. While firm-wide adoption of standards is recommended, it is not required.\n(Module 42.7, LOS 42.a)","explhtml":"<p>Standard IV(B) – Responsibilities of Supervisors states that any employee that has a supervisory role (not just portfolio managers) must ensure that the employees subject to their supervision or authority comply with all laws, rules, and regulations. While firm-wide adoption of standards is recommended, it is not required.<\/p><p>(Module 42.7, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bahman Goldoon, CFA, is research director at Bravo Capital LP (&quot;Bravo&quot;), a boutique asset management firm that manages the portfolios of several high- and medium-net-worth clients. Bravo has several portfolio managers, who each manage a number of client accounts.<\/p><p>While Bravo has not formally adopted the CFA Institute&#x27;s Code and Standards, it strives to ensure that the firm behaves ethically and that it complies with all laws and regulations. To ensure regulatory compliance, Bravo has a policy that all portfolio managers are responsible for ensuring that the e
