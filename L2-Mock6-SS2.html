st<\/p><p>Equity and<\/p><div class=\"tbl\"><table><tr><td>189,816<\/td><td>210,349<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><p>Notes<\/p><p>1. The &quot;post&quot; balance sheet is prepared using the acquisition (partial goodwill) method.<\/p><p>2. The acquisition is a pure cash transaction: 80% of Ferrers equity for $7,000m.<\/p><p>3. Ferrers&#x27;s balance sheet required no fair value adjustments.<\/p><p>While Winchester has confirmed that the intern carried out the consolidation and calculations accurately, he does have reservations about the preparation of the consolidated balance sheet. Winchester intends to redraft the consolidated balance sheet three times, each time making just one of the following adjustments:<\/p><p>Adjustment One<\/p><p>Winchester does not believe that the method used to calculate goodwill is in line with current accounting standards, and intends to restate the &quot;post&quot; balance sheet using a method consistent with U.S. GAAP.<\/p><p>Adjustment Two<\/p><p>Winchester believes that Ferrers&#x27;s PPE has a fair value that is higher than the reported book value. Winchester estimates that the fair value of Ferrers&#x27;s PPE is approximately $18,300. This value still results in a positive goodwill figure.<\/p><p>Winchester is interested in the impact that this adjustment would have on the consolidated debt-to-equity ratio (assuming that goodwill is continued to be calculated as stated in  Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets).<\/p><p>Winchester calculates &quot;post&quot; debt-to-equity ratios after reclassifying the non-controlling interest as debt rather than as equity.<\/p><p>Adjustment Three<\/p><p>Winchester has noted that the remaining 20% of equity will be retained by the family of the original founder of Ferrers. He believes the family members will have significant input into the everyday operations of Ferrers even after the transaction, and hence does not feel confident that Ruggiano will have control. Winchester intends to prepare a &#x27;post&#x27; balance sheet with no fair value adjustments, but using an accounting method consistent with Ruggiano having influence but not control over Ferrers.<\/p><\/div><\/details><div class=\"qtext\"><p>Using information in  Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets and after making adjustment one only, the consolidated equity plus liabilities is most likely to be:<\/p><\/div>","subj":"fsa"},{"n":47,"q":"Using the information in  Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets and accounting for adjustment two only, the \"Post\" (i.e., consolidated) debt-to-equity ratio (using Winchester's methodology) is most likely to be:","opts":["higher than the currently calculated value.","lower than the currently calculated value.","unaffected by adjustment two."],"ans":"A","expl":"Ferrers's PPE at book value is $133,903m - $115,834m = $18,069m\nThe fair value adjustment is therefore $18,300m - $18,069m = $231m\nIn the consolidated balance sheet this would increase PPE and non-controlling interest (which is 20% × fair value of net assets under the partial goodwill method) and decrease goodwill. (The goodwill figure would still be positive which is important. If goodwill were negative, it would be considered a bargain purchase, and the resulting gain would be reported in the income statement, increasing net income and stockholders' equity).\nSince Winchester deems non-controlling interest as part of debt, the value of debt would increase, increasing the debt-to-equity ratio.\n(Module 8.9, LOS 8.c)","explhtml":"<p>Ferrers&#x27;s PPE at book value is $133,903m - $115,834m = $18,069m<\/p><p>The fair value adjustment is therefore $18,300m - $18,069m = $231m<\/p><p>In the consolidated balance sheet this would increase PPE and non-controlling interest (which is 20% × fair value of net assets under the partial goodwill method) and decrease goodwill. (The goodwill figure would still be positive which is important. If goodwill were negative, it would be considered a bargain purchase, and the resulting gain would be reported in the income statement, increasing net income and stockholders&#x27; equity).<\/p><p>Since Winchester deems non-controlling interest as part of debt, the value of debt would increase, increasing the debt-to-equity ratio.<\/p><p>(Module 8.9, LOS 8.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Winchester, CFA, works as an equity analyst for Guion Funds, a small investment management firm. Recently a news report was released regarding Ruggiano Inc., a large retailer that Guion is heavily invested in.<\/p><p>Ruggiano Inc. has hundreds of stores in 42 states across the United States. Most of the stores are large-footprint format stores with over 120,000 square feet of floor area. However, the news report suggested that Ruggiano is on the brink of completing the purchase of 80% of the common stock of Ferrers Inc., a much smaller retailer. Most Ferrers stores can be found in city and town centers. The average Ferrers store is well below 100,000 square feet in size.<\/p><p>Winchester is interested in how the potential acquisition would affect Ferrers&#x27;s financial statements, and asks an intern to prepare a consolidated balance sheet. This balance sheet, along with the relevant notes, is shown in  Exhibit 1: Ruggiano Pre-and Post-Acquisition Balance Sheets. Ruggiano follows U.S. GAAP in preparing their financial statements.<\/p><p>Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets<\/p><div class=\"tbl\"><table><tr><td>Pre $m<\/td><td>Post $m<\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>8,592<\/td><td>2,968<\/td><\/tr><tr><td>Receivables<\/td><td>5,691<\/td><td>6,605<\/td><\/tr><tr><td>Inventory<\/td><td>42,385<\/td><td>48,965<\/td><\/tr><tr><td>Other Current Assets<\/td><td>1,382<\/td><td>1,662<\/td><\/tr><tr><td>Total Current Assets<\/td><td>58,050<\/td><td>60,200<\/td><\/tr><tr><td>PPE<\/td><td>115,834<\/td><td>133,903<\/td><\/tr><tr><td>Goodwill<\/td><td>15,932<\/td><td>16,246<\/td><\/tr><tr><td>Total Assets<\/td><td>189,816<\/td><td>210,349<\/td><\/tr><tr><td>Accounts Payable<\/td><td>56,822<\/td><td>66,104<\/td><\/tr><tr><td>Short Term Debt<\/td><td>6,012<\/td><td>7,182<\/td><\/tr><\/table><\/div><p>Total Current<\/p><div class=\"tbl\"><table><tr><td>62,834<\/td><td>73,286<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><div class=\"tbl\"><table><tr><td>Long Term Debt<\/td><td>42,921<\/td><td>51,331<\/td><\/tr><tr><td>Total Liabilities<\/td><td>105,755<\/td><td>124,617<\/td><\/tr><tr><td>Common Stock<\/td><td>23,095<\/td><td>23,095<\/td><\/tr><\/table><\/div><p>Additional Paid in<\/p><div class=\"tbl\"><table><tr><td>49,000<\/td><td>49,000<\/td><\/tr><\/table><\/div><p>Capital<\/p><div class=\"tbl\"><table><tr><td>Retained Earnings<\/td><td>11,966<\/td><td>11,966<\/td><\/tr><\/table><\/div><p>Non-controlling 1,671 Interest<\/p><p>Equity and<\/p><div class=\"tbl\"><table><tr><td>189,816<\/td><td>210,349<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><p>Notes<\/p><p>1. The &quot;post&quot; balance sheet is prepared using the acquisition (partial goodwill) method.<\/p><p>2. The acquisition is a pure cash transaction: 80% of Ferrers equity for $7,000m.<\/p><p>3. Ferrers&#x27;s balance sheet required no fair value adjustments.<\/p><p>While Winchester has confirmed that the intern carried out the consolidation and calculations accurately, he does have reservations about the preparation of the consolidated balance sheet. Winchester intends to redraft the consolidated balance sheet three times, each time making just one of the following adjustments:<\/p><p>Adjustment One<\/p><p>Winchester does not believe that the method used to calculate goodwill is in line with current accounting standards, and intends to restate the &quot;post&quot; balance sheet using a method consistent with U.S. GAAP.<\/p><p>Adjustment Two<\/p><p>Winchester believes that Ferrers&#x27;s PPE has a fair value that is higher than the reported book value. Winchester estimates that the fair value of Ferrers&#x27;s PPE is approximately $18,300. This value still results in a positive goodwill figure.<\/p><p>Winchester is interested in the impact that this adjustment would have on the consolidated debt-to-equity ratio (assuming that goodwill is continued to be calculated as stated in  Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets).<\/p><p>Winchester calculates &quot;post&quot; debt-to-equity ratios after reclassifying the non-controlling interest as debt rather than as equity.<\/p><p>Adjustment Three<\/p><p>Winchester has noted that the remaining 20% of equity will be retained by the family of the original founder of Ferrers. He believes the family members will have significant input into the everyday operations of Ferrers even after the transaction, and hence does not feel confident that Ruggiano will have control. Winchester intends to prepare a &#x27;post&#x27; balance sheet with no fair value adjustments, but using an accounting method consistent with Ruggiano having influence but not control over Ferrers.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in  Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets and accounting for adjustment two only, the &quot;Post&quot; (i.e., consolidated) debt-to-equity ratio (using Winchester&#x27;s methodology) is most likely to be:<\/p><\/div>","subj":"fsa"},{"n":48,"q":"Using the information in  Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets and accounting for adjustment three only, the recalculated \"post\" total current assets would be closest to:","opts":["$51,000m","$58,000m","$60,000m"],"ans":"A","expl":"If Ruggiano had significant influence rather than control, the investment in Ferrers would be treated as an investment in associates and the equity method would be applied.\nOnly the parent's (i.e., Ruggiano's) current assets would be included in the consolidated ('Post') balance sheet. This would total $58,050m less $7,000m cash paid out for the purchase. Hence consolidated current assets would be 58,050 – 7,000 = 51,050. Note that the investment in the associate would be a non-current asset.\n(Module 8.1, LOS 8.a)","explhtml":"<p>If Ruggiano had significant influence rather than control, the investment in Ferrers would be treated as an investment in associates and the equity method would be applied.<\/p><p>Only the parent&#x27;s (i.e., Ruggiano&#x27;s) current assets would be included in the consolidated (&#x27;Post&#x27;) balance sheet. This would total $58,050m less $7,000m cash paid out for the purchase. Hence consolidated current assets would be 58,050 – 7,000 = 51,050. Note that the investment in the associate would be a non-current asset.<\/p><p>(Module 8.1, LOS 8.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Winchester, CFA, works as an equity analyst for Guion Funds, a small investment management firm. Recently a news report was released regarding Ruggiano Inc., a large retailer that Guion is heavily invested in.<\/p><p>Ruggiano Inc. has hundreds of stores in 42 states across the United States. Most of the stores are large-footprint format stores with over 120,000 square feet of floor area. However, the news report suggested that Ruggiano is on the brink of completing the purchase of 80% of the common stock of Ferrers Inc., a much smaller retailer. Most Ferrers stores can be found in city and town centers. The average Ferrers store is well below 100,000 square feet in size.<\/p><p>Winchester is interested in how the potential acquisition would affect Ferrers&#x27;s financial statements, and asks an intern to prepare a consolidated balance sheet. This balance sheet, along with the relevant notes, is shown in  Exhibit 1: Ruggiano Pre-and Post-Acquisition Balance Sheets. Ruggiano follows U.S. GAAP in preparing their financial statements.<\/p><p>Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets<\/p><div class=\"tbl\"><table><tr><td>Pre $m<\/td><td>Post $m<\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>8,592<\/td><td>2,968<\/td><\/tr><tr><td>Receivables<\/td><td>5,691<\/td><td>6,605<\/td><\/tr><tr><td>Inventory<\/td><td>42,385<\/td><td>48,965<\/td><\/tr><tr><td>Other Current Assets<\/td><td>1,382<\/td><td>1,662<\/td><\/tr><tr><td>Total Current Assets<\/td><td>58,050<\/td><td>60,200<\/td><\/tr><tr><td>PPE<\/td><td>115,834<\/td><td>133,903<\/td><\/tr><tr><td>Goodwill<\/td><td>15,932<\/td><td>16,246<\/td><\/tr><tr><td>Total Assets<\/td><td>189,816<\/td><td>210,349<\/td><\/tr><tr><td>Accounts Payable<\/td><td>56,822<\/td><td>66,104<\/td><\/tr><tr><td>Short Term Debt<\/td><td>6,012<\/td><td>7,182<\/td><\/tr><\/table><\/div><p>Total Current<\/p><div class=\"tbl\"><table><tr><td>62,834<\/td><td>73,286<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><div class=\"tbl\"><table><tr><td>Long Term Debt<\/td><td>42,921<\/td><td>51,331<\/td><\/tr><tr><td>Total Liabilities<\/td><td>105,755<\/td><td>124,617<\/td><\/tr><tr><td>Common Stock<\/td><td>23,095<\/td><td>23,095<\/td><\/tr><\/table><\/div><p>Additional Paid in<\/p><div class=\"tbl\"><table><tr><td>49,000<\/td><td>49,000<\/td><\/tr><\/table><\/div><p>Capital<\/p><div class=\"tbl\"><table><tr><td>Retained Earnings<\/td><td>11,966<\/td><td>11,966<\/td><\/tr><\/table><\/div><p>Non-controlling 1,671 Interest<\/p><p>Equity and<\/p><div class=\"tbl\"><table><tr><td>189,816<\/td><td>210,349<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><p>Notes<\/p><p>1. The &quot;post&quot; balance sheet is prepared using the acquisition (partial goodwill) method.<\/p><p>2. The acquisition is a pure cash transaction: 80% of Ferrers equity for $7,000m.<\/p><p>3. Ferrers&#x27;s balance sheet required no fair value adjustments.<\/p><p>While Winchester has confirmed that the intern carried out the consolidation and calculations accurately, he does have reservations about the preparation of the consolidated balance sheet. Winchester intends to redraft the consolidated balance sheet three times, each time making just one of the following adjustments:<\/p><p>Adjustment One<\/p><p>Winchester does not believe that the method used to calculate goodwill is in line with current accounting standards, and intends to restate the &quot;post&quot; balance sheet using a method consistent with U.S. GAAP.<\/p><p>Adjustment Two<\/p><p>Winchester believes that Ferrers&#x27;s PPE has a fair value that is higher than the reported book value. Winchester estimates that the fair value of Ferrers&#x27;s PPE is approximately $18,300. This value still results in a positive goodwill figure.<\/p><p>Winchester is interested in the impact that this adjustment would have on the consolidated debt-to-equity ratio (assuming that goodwill is continued to be calculated as stated in  Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets).<\/p><p>Winchester calculates &quot;post&quot; debt-to-equity ratios after reclassifying the non-controlling interest as debt rather than as equity.<\/p><p>Adjustment Three<\/p><p>Winchester has noted that the remaining 20% of equity will be retained by the family of the original founder of Ferrers. He believes the family members will have significant input into the everyday operations of Ferrers even after the transaction, and hence does not feel confident that Ruggiano will have control. Winchester intends to prepare a &#x27;post&#x27; balance sheet with no fair value adjustments, but using an accounting method consistent with Ruggiano having influence but not control over Ferrers.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in  Exhibit 1: Ruggiano Pre- and Post-Acquisition Balance Sheets and accounting for adjustment three only, the recalculated &quot;post&quot; total current assets would be closest to:<\/p><\/div>","subj":"fsa"},{"n":49,"q":"Using information from Exhibit 1, the company with the most efficient operations is most likely:","opts":["Alpha","Bravo","Charlie."],"ans":"C","expl":"Operational efficiency is indicated by the underwriting expense ratio (= underwriting expense / net premium written). Lower ratios indicate better operational efficiency. Underwriting expense ratio (Alpha) = 1,888 / 18,432 = 10.24% Underwriting expense ratio (Bravo) = 1,922 / 15,438 = 12.45% Underwriting expense ratio (Charlie) = 1,387 / 15,112 = 9.18% (lowest) (Module 11.6, LOS 11.f)","explhtml":"<p>Operational efficiency is indicated by the underwriting expense ratio (= underwriting expense / net premium written). Lower ratios indicate better operational efficiency. Underwriting expense ratio (Alpha) = 1,888 / 18,432 = 10.24% Underwriting expense ratio (Bravo) = 1,922 / 15,438 = 12.45% Underwriting expense ratio (Charlie) = 1,387 / 15,112 = 9.18% (lowest) (Module 11.6, LOS 11.f)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Shiron Simya, CFA, has been working as an equity analyst for Alpharetta Asset Managers covering the banking and insurance sectors. Simya has collected information on three property and casualty insurance companies covering the last year, as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected Financial Information on P&amp;C Insurance Companies<\/p><div class=\"tbl\"><table><tr><td>Description ($ millions)<\/td><td>Alpha<\/td><td>Bravo<\/td><td>Charlie<\/td><\/tr><tr><td>Loss and loss adjustment expense<\/td><td>14,800<\/td><td>13,865<\/td><td>14,552<\/td><\/tr><tr><td>Underwriting expense<\/td><td>1,888<\/td><td>1,922<\/td><td>1,387<\/td><\/tr><tr><td>Net premiums earned<\/td><td>18,211<\/td><td>15,787<\/td><td>14,889<\/td><\/tr><tr><td>Net premiums written<\/td><td>18,432<\/td><td>15,438<\/td><td>15,112<\/td><\/tr><\/table><\/div><p>During a lunch meeting with a colleague, Simya makes the following statements:<\/p><p>1. Compared to life and health insurance companies, property and casualty companies tend to have more predictable claims. 2. For P&amp;C companies, periods of soft pricing is evidenced by declining combined ratios for the industry.<\/p><p>3. Banks with higher concentrations of retail deposits and mortgage loans tend to perform well when the yield curve inverts during periods of rising short-term rates.<\/p><p>4. Banks with high amounts of risk-weighted assets tend to shore up their Tier 1 capital requirements under Basel III standards by issuing subordinated debt with maturities exceeding five years.<\/p><\/div><\/details><div class=\"qtext\"><p>Using information from Exhibit 1, the company with the most efficient operations is most likely:<\/p><\/div>","subj":"fsa"},{"n":50,"q":"Using information from Exhibit 1, the company with the highest quality of underwriting activities is most likely:","opts":["Alpha","Bravo.","Charlie."],"ans":"A","expl":"Quality of underwriting activities is evidenced by a low loss and loss adjustment expense ratio (= loss and loss adjustment expense / net premium earned). Loss and loss adjustment expense ratio (Alpha) = 14,800 / 18,211 = 81.27% (lowest) Loss and loss adjustment expense ratio (Bravo) = 13,865 / 15,787 = 87.83% Loss and loss adjustment expense ratio (Charlie) = 14,552 / 14,889 = 97.74% (Module 11.6, LOS 11.f)","explhtml":"<p>Quality of underwriting activities is evidenced by a low loss and loss adjustment expense ratio (= loss and loss adjustment expense / net premium earned). Loss and loss adjustment expense ratio (Alpha) = 14,800 / 18,211 = 81.27% (lowest) Loss and loss adjustment expense ratio (Bravo) = 13,865 / 15,787 = 87.83% Loss and loss adjustment expense ratio (Charlie) = 14,552 / 14,889 = 97.74% (Module 11.6, LOS 11.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Shiron Simya, CFA, has been working as an equity analyst for Alpharetta Asset Managers covering the banking and insurance sectors. Simya has collected information on three property and casualty insurance companies covering the last year, as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected Financial Information on P&amp;C Insurance Companies<\/p><div class=\"tbl\"><table><tr><td>Description ($ millions)<\/td><td>Alpha<\/td><td>Bravo<\/td><td>Charlie<\/td><\/tr><tr><td>Loss and loss adjustment expense<\/td><td>14,800<\/td><td>13,865<\/td><td>14,552<\/td><\/tr><tr><td>Underwriting expense<\/td><td>1,888<\/td><td>1,922<\/td><td>1,387<\/td><\/tr><tr><td>Net premiums earned<\/td><td>18,211<\/td><td>15,787<\/td><td>14,889<\/td><\/tr><tr><td>Net premiums written<\/td><td>18,432<\/td><td>15,438<\/td><td>15,112<\/td><\/tr><\/table><\/div><p>During a lunch meeting with a colleague, Simya makes the following statements:<\/p><p>1. Compared to life and health insurance companies, property and casualty companies tend to have more predictable claims. 2. For P&amp;C companies, periods of soft pricing is evidenced by declining combined ratios for the industry.<\/p><p>3. Banks with higher concentrations of retail deposits and mortgage loans tend to perform well when the yield curve inverts during periods of rising short-term rates.<\/p><p>4. Banks with high amounts of risk-weighted assets tend to shore up their Tier 1 capital requirements under Basel III standards by issuing subordinated debt with maturities exceeding five years.<\/p><\/div><\/details><div class=\"qtext\"><p>Using information from Exhibit 1, the company with the highest quality of underwriting activities is most likely:<\/p><\/div>","subj":"fsa"},{"n":51,"q":"Regarding Simya's statements 1 and 2, it would be most accurate to state that:","opts":["both statements are correct.","both statements are incorrect.","only one statement is correct."],"ans":"B","expl":"Both statements are incorrect. Compared to life and health insurance companies, property and casualty insurance companies tend to have 'lumpier' claims, while L&H insurance companies tend to have more predictable claims. Soft pricing periods for P&C companies is evidenced by rising combined ratios for the industry.\n(Module 11.6, LOS 11.f)","explhtml":"<p>Both statements are incorrect. Compared to life and health insurance companies, property and casualty insurance companies tend to have &#x27;lumpier&#x27; claims, while L&amp;H insurance companies tend to have more predictable claims. Soft pricing periods for P&amp;C companies is evidenced by rising combined ratios for the industry.<\/p><p>(Module 11.6, LOS 11.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Shiron Simya, CFA, has been working as an equity analyst for Alpharetta Asset Managers covering the banking and insurance sectors. Simya has collected information on three property and casualty insurance companies covering the last year, as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected Financial Information on P&amp;C Insurance Companies<\/p><div class=\"tbl\"><table><tr><td>Description ($ millions)<\/td><td>Alpha<\/td><td>Bravo<\/td><td>Charlie<\/td><\/tr><tr><td>Loss and loss adjustment expense<\/td><td>14,800<\/td><td>13,865<\/td><td>14,552<\/td><\/tr><tr><td>Underwriting expense<\/td><td>1,888<\/td><td>1,922<\/td><td>1,387<\/td><\/tr><tr><td>Net premiums earned<\/td><td>18,211<\/td><td>15,787<\/td><td>14,889<\/td><\/tr><tr><td>Net premiums written<\/td><td>18,432<\/td><td>15,438<\/td><td>15,112<\/td><\/tr><\/table><\/div><p>During a lunch meeting with a colleague, Simya makes the following statements:<\/p><p>1. Compared to life and health insurance companies, property and casualty companies tend to have more predictable claims. 2. For P&amp;C companies, periods of soft pricing is evidenced by declining combined ratios for the industry.<\/p><p>3. Banks with higher concentrations of retail deposits and mortgage loans tend to perform well when the yield curve inverts during periods of rising short-term rates.<\/p><p>4. Banks with high amounts of risk-weighted assets tend to shore up their Tier 1 capital requirements under Basel III standards by issuing subordinated debt with maturities exceeding five years.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Simya&#x27;s statements 1 and 2, it would be most accurate to state that:<\/p><\/div>","subj":"fsa"},{"n":52,"q":"Regarding statements 3 and 4 by Simya, it would be most accurate to state that:","opts":["both statements are correct.","both statements are incorrect.","only one statement is correct."],"ans":"B","expl":"Both statements are incorrect. During yield curve inversion (given rising short-term rates), retail (short-term) deposits earn a higher interest rate, whereas mortgages (longer-term rates) command a lower return, leading to a squeeze on a bank's margins. Subordinated debt issuances with maturities exceeding five years would be part of Tier 2 capital under Basel III standards—and not Tier 1 capital.\n(Module 11.2, LOS 11.c)","explhtml":"<p>Both statements are incorrect. During yield curve inversion (given rising short-term rates), retail (short-term) deposits earn a higher interest rate, whereas mortgages (longer-term rates) command a lower return, leading to a squeeze on a bank&#x27;s margins. Subordinated debt issuances with maturities exceeding five years would be part of Tier 2 capital under Basel III standards—and not Tier 1 capital.<\/p><p>(Module 11.2, LOS 11.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Shiron Simya, CFA, has been working as an equity analyst for Alpharetta Asset Managers covering the banking and insurance sectors. Simya has collected information on three property and casualty insurance companies covering the last year, as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected Financial Information on P&amp;C Insurance Companies<\/p><div class=\"tbl\"><table><tr><td>Description ($ millions)<\/td><td>Alpha<\/td><td>Bravo<\/td><td>Charlie<\/td><\/tr><tr><td>Loss and loss adjustment expense<\/td><td>14,800<\/td><td>13,865<\/td><td>14,552<\/td><\/tr><tr><td>Underwriting expense<\/td><td>1,888<\/td><td>1,922<\/td><td>1,387<\/td><\/tr><tr><td>Net premiums earned<\/td><td>18,211<\/td><td>15,787<\/td><td>14,889<\/td><\/tr><tr><td>Net premiums written<\/td><td>18,432<\/td><td>15,438<\/td><td>15,112<\/td><\/tr><\/table><\/div><p>During a lunch meeting with a colleague, Simya makes the following statements:<\/p><p>1. Compared to life and health insurance companies, property and casualty companies tend to have more predictable claims. 2. For P&amp;C companies, periods of soft pricing is evidenced by declining combined ratios for the industry.<\/p><p>3. Banks with higher concentrations of retail deposits and mortgage loans tend to perform well when the yield curve inverts during periods of rising short-term rates.<\/p><p>4. Banks with high amounts of risk-weighted assets tend to shore up their Tier 1 capital requirements under Basel III standards by issuing subordinated debt with maturities exceeding five years.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding statements 3 and 4 by Simya, it would be most accurate to state that:<\/p><\/div>","subj":"fsa"},{"n":53,"q":"To counter declining growth rates, IBS could least appropriately:","opts":["acquire faster-growing companies.","divest the slowest-growing business segment.","undertake a cost restructuring."],"ans":"C","expl":"To counter declining growth rates, a company could acquire other faster-growing businesses, or divest the segment with slow or declining growth. A cost restructuring is unlikely to counter declining growth rates.\n(Module 18.1, LOS 18.a)","explhtml":"<p>To counter declining growth rates, a company could acquire other faster-growing businesses, or divest the segment with slow or declining growth. A cost restructuring is unlikely to counter declining growth rates.<\/p><p>(Module 18.1, LOS 18.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Integrated Business Solutions (IBS) is a large-cap technology company operating three interrelated divisions: hardware, consulting, and cloud services. Over the past three years, the company&#x27;s growth rate has slowed significantly. Furthermore, there is an expectation of negative impact on foreign revenues going forward due to a continued strengthening of the U.S. dollar.<\/p><p>Super Transistors (ST) is a rapidly growing company that has plowed back all profits to finance its growth. The company has never issued debt in the capital markets, and its current borrowing is a small bank loan to finance the company&#x27;s receivables. Bill Mayer, ST&#x27;s CFO, believes that the company&#x27;s capital structure is suboptimal and recommends that the board approve the sale of 5% 20-year senior unsecured debentures to finance an open-market purchase of the company&#x27;s shares. Separately, ST wants to acquire Gemini, a smaller software company, for cash. Gemini&#x27;s EV/EBITDA multiple exceeds that of its peers.<\/p><p>Mayer recommends using a comparable transactions approach to value Gemini and makes the following statements in support of this recommendation:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The method is not sensitive to market mispricing.<\/td><\/tr><tr><td>Statement 2:<\/td><td>The method provides an estimate of a target&#x27;s value relative to similar transactions in the market.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>To counter declining growth rates, IBS could least appropriately:<\/p><\/div>","subj":"corporate"},{"n":54,"q":"Mayer's recommendation to repurchase Super Transistors stock would most accurately be described as:","opts":["a dividend recapitalization.","a stock recapitalization.","a leveraged buyout."],"ans":"A","expl":"Dividend recapitalization is a balance sheet restructuring that increases leverage by using borrowed funds to repurchase company stock. Stock recapitalization is not defined in the curriculum. A leveraged buyout involves taking a company private using borrowed funds.\n(Module 18.1, LOS 18.a)","explhtml":"<p>Dividend recapitalization is a balance sheet restructuring that increases leverage by using borrowed funds to repurchase company stock. Stock recapitalization is not defined in the curriculum. A leveraged buyout involves taking a company private using borrowed funds.<\/p><p>(Module 18.1, LOS 18.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Integrated Business Solutions (IBS) is a large-cap technology company operating three interrelated divisions: hardware, consulting, and cloud services. Over the past three years, the company&#x27;s growth rate has slowed significantly. Furthermore, there is an expectation of negative impact on foreign revenues going forward due to a continued strengthening of the U.S. dollar.<\/p><p>Super Transistors (ST) is a rapidly growing company that has plowed back all profits to finance its growth. The company has never issued debt in the capital markets, and its current borrowing is a small bank loan to finance the company&#x27;s receivables. Bill Mayer, ST&#x27;s CFO, believes that the company&#x27;s capital structure is suboptimal and recommends that the board approve the sale of 5% 20-year senior unsecured debentures to finance an open-market purchase of the company&#x27;s shares. Separately, ST wants to acquire Gemini, a smaller software company, for cash. Gemini&#x27;s EV/EBITDA multiple exceeds that of its peers.<\/p><p>Mayer recommends using a comparable transactions approach to value Gemini and makes the following statements in support of this recommendation:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The method is not sensitive to market mispricing.<\/td><\/tr><tr><td>Statement 2:<\/td><td>The method provides an estimate of a target&#x27;s value relative to similar transactions in the market.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Mayer&#x27;s recommendation to repurchase Super Transistors stock would most accurately be described as:<\/p><\/div>","subj":"corporate"},{"n":55,"q":"Which of the following is the least likely explanation for the difference in valuation of Gemini relative to its peers?","opts":["Differences in growth rates.","Differences in risk profile.","Differences in cost structure."],"ans":"C","expl":"EV/EBITDA is not affected by differences in cost structures. Multiples can differ due to differences in growth rates and/or risk profile. (Module 18.3, LOS 18.e)","explhtml":"<p>EV/EBITDA is not affected by differences in cost structures. Multiples can differ due to differences in growth rates and/or risk profile. (Module 18.3, LOS 18.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Integrated Business Solutions (IBS) is a large-cap technology company operating three interrelated divisions: hardware, consulting, and cloud services. Over the past three years, the company&#x27;s growth rate has slowed significantly. Furthermore, there is an expectation of negative impact on foreign revenues going forward due to a continued strengthening of the U.S. dollar.<\/p><p>Super Transistors (ST) is a rapidly growing company that has plowed back all profits to finance its growth. The company has never issued debt in the capital markets, and its current borrowing is a small bank loan to finance the company&#x27;s receivables. Bill Mayer, ST&#x27;s CFO, believes that the company&#x27;s capital structure is suboptimal and recommends that the board approve the sale of 5% 20-year senior unsecured debentures to finance an open-market purchase of the company&#x27;s shares. Separately, ST wants to acquire Gemini, a smaller software company, for cash. Gemini&#x27;s EV/EBITDA multiple exceeds that of its peers.<\/p><p>Mayer recommends using a comparable transactions approach to value Gemini and makes the following statements in support of this recommendation:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The method is not sensitive to market mispricing.<\/td><\/tr><tr><td>Statement 2:<\/td><td>The method provides an estimate of a target&#x27;s value relative to similar transactions in the market.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is the least likely explanation for the difference in valuation of Gemini relative to its peers?<\/p><\/div>","subj":"corporate"},{"n":56,"q":"Which statement made by Mayer is correct?","opts":["Statement 1 only.","Statement 2 only.","Neither statement is correct."],"ans":"B","expl":"Statement 1 is incorrect. The comparable transactions approach assumes that those transactions occurred at a fair price. However, if the takeover was mispriced, that estimate of value would not be a good benchmark to use; the comparable transactions approach is sensitive to market mispricing. Statement 2 is correct. The comparable transactions approach uses actual transaction data as the basis for valuation.\n(Module 18.2, LOS 18.c)","explhtml":"<p>Statement 1 is incorrect. The comparable transactions approach assumes that those transactions occurred at a fair price. However, if the takeover was mispriced, that estimate of value would not be a good benchmark to use; the comparable transactions approach is sensitive to market mispricing. Statement 2 is correct. The comparable transactions approach uses actual transaction data as the basis for valuation.<\/p><p>(Module 18.2, LOS 18.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Integrated Business Solutions (IBS) is a large-cap technology company operating three interrelated divisions: hardware, consulting, and cloud services. Over the past three years, the company&#x27;s growth rate has slowed significantly. Furthermore, there is an expectation of negative impact on foreign revenues going forward due to a continued strengthening of the U.S. dollar.<\/p><p>Super Transistors (ST) is a rapidly growing company that has plowed back all profits to finance its growth. The company has never issued debt in the capital markets, and its current borrowing is a small bank loan to finance the company&#x27;s receivables. Bill Mayer, ST&#x27;s CFO, believes that the company&#x27;s capital structure is suboptimal and recommends that the board approve the sale of 5% 20-year senior unsecured debentures to finance an open-market purchase of the company&#x27;s shares. Separately, ST wants to acquire Gemini, a smaller software company, for cash. Gemini&#x27;s EV/EBITDA multiple exceeds that of its peers.<\/p><p>Mayer recommends using a comparable transactions approach to value Gemini and makes the following statements in support of this recommendation:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The method is not sensitive to market mispricing.<\/td><\/tr><tr><td>Statement 2:<\/td><td>The method provides an estimate of a target&#x27;s value relative to similar transactions in the market.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which statement made by Mayer is correct?<\/p><\/div>","subj":"corporate"},{"n":57,"q":"Which of the following is the most appropriate price multiple that Fisher and Hamilton should use to assess the relative value of Spurlock Offshore Exploration?","opts":["Price-to-sales ratio.","Price-to-book ratio.","Trailing price-to-earnings ratio."],"ans":"A","expl":"As Spurlock has yet to earn a profit, the trailing price-to-earnings ratio is negative and cannot be used for relative valuation. Spurlock likely paid significantly higher prices for its equipment, having most likely purchased it more recently than the established firms in the industry. This leads to problems of comparability of book value (both higher acquisition prices and less accumulated depreciation) and makes relative valuation based on industry price-to-book ratios inappropriate.\nThe price-to-sales ratio would be the most appropriate price multiple for relative valuation of Spurlock based on comparables. The price-to-sales ratio can be applied even when earnings are negative and asset values are not comparable. If the firm can, at some point, match the average net margins in the industry, the average P/S ratio will be justified.\n(Module 22.1, LOS 22.c)","explhtml":"<p>As Spurlock has yet to earn a profit, the trailing price-to-earnings ratio is negative and cannot be used for relative valuation. Spurlock likely paid significantly higher prices for its equipment, having most likely purchased it more recently than the established firms in the industry. This leads to problems of comparability of book value (both higher acquisition prices and less accumulated depreciation) and makes relative valuation based on industry price-to-book ratios inappropriate.<\/p><p>The price-to-sales ratio would be the most appropriate price multiple for relative valuation of Spurlock based on comparables. The price-to-sales ratio can be applied even when earnings are negative and asset values are not comparable. If the firm can, at some point, match the average net margins in the industry, the average P/S ratio will be justified.<\/p><p>(Module 22.1, LOS 22.c)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Nancy Fisher and Charlene Hamilton evaluate firms in the basic materials sector for the investment firm of Boatwright Advisors. They are currently evaluating the prospects for Spurlock Offshore Exploration and the other firms in its industry.<\/p><p>Spurlock is a relatively new firm in the oil and gas exploration industry. The firm purchased equipment for offshore drilling two years ago, and sells its successful wells to major oil companies for development. Although the firm is not yet profitable, Fisher believes that the firm&#x27;s long-term prospects are favorable. Due to a global economic expansion there has been an increase in the demand for and price of oil, resulting in an increased demand for oil drilling equipment. As a result, Spurlock paid significantly higher prices for its equipment than the established firms in the industry. Spurlock common stock does not pay a dividend.<\/p><p>Hamilton is following a firm that manufactures oil and gas drilling equipment, Rig Industries. Last year, Rig had reported earnings per share of $2.40, under International Financial Reporting Standards (IFRS). Hamilton is estimating the firm&#x27;s underlying and normalized earnings. The economy and the industry have been in an expansion for three years. The firm reported expenses for environmental remediation of $0.29 per share last year and a gain on sales of surplus assets of $0.17 per share.<\/p><p>Fisher is examining the prospects of an agricultural chemicals producer, Walton Global. Walton has grown since it went public some years ago. Over the past few years, Walton has benefited from economic expansion and grown even more rapidly, both in terms of capacity and earnings. Fisher is valuing the firm using a justified leading P/E approach. The following are the mean analysts&#x27; earnings forecasts and other selected statistics for Walton Global:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$45<\/td><\/tr><tr><td>Expected earnings per share<\/td><td>$5.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>12.0%<\/td><\/tr><tr><td>Return on equity<\/td><td>10.0%<\/td><\/tr><tr><td>Retention ratio<\/td><td>40.0%<\/td><\/tr><\/table><\/div><p>Fisher is concerned that the justified leading P/E for Walton may be misleading because of a cyclical component in current earnings and also may suffer from upward bias in sell-side analysts&#x27; earnings and growth forecasts this far into an expansion. She wants to normalize EPS to get a normalized P/E ratio. Fisher is deciding whether to use the average P/E over the most recent full economic cycle or to use the average ROE over the cycle times current book value to calculate a normalized P/E.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the most appropriate price multiple that Fisher and Hamilton should use to assess the relative value of Spurlock Offshore Exploration?<\/p><\/div>","subj":"equity"},{"n":58,"q":"The highest trailing price-to-earnings ratio for Rig Industries would be one based on:","opts":["reported earnings.","underlying earnings.","normalized earnings."],"ans":"C","expl":"Rig has reported earnings per share of $2.40 and the economy and industry are three years into an expansion. Normalized earnings average the company's earnings over a business cycle, so Rig's normalized earnings would, in all likelihood, be lower than the current reported earnings per share. Underlying earnings are adjusted for nonrecurring items such as environmental remediation costs and gains on asset sales. Underlying earnings (adjusted for nonrecurring items) are higher than the reported earnings per share in this case. As normalized earnings are the lowest, they will result in the highest price-to-earnings ratio.\n(Module 22.4, LOS 22.e)","explhtml":"<p>Rig has reported earnings per share of $2.40 and the economy and industry are three years into an expansion. Normalized earnings average the company&#x27;s earnings over a business cycle, so Rig&#x27;s normalized earnings would, in all likelihood, be lower than the current reported earnings per share. Underlying earnings are adjusted for nonrecurring items such as environmental remediation costs and gains on asset sales. Underlying earnings (adjusted for nonrecurring items) are higher than the reported earnings per share in this case. As normalized earnings are the lowest, they will result in the highest price-to-earnings ratio.<\/p><p>(Module 22.4, LOS 22.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nancy Fisher and Charlene Hamilton evaluate firms in the basic materials sector for the investment firm of Boatwright Advisors. They are currently evaluating the prospects for Spurlock Offshore Exploration and the other firms in its industry.<\/p><p>Spurlock is a relatively new firm in the oil and gas exploration industry. The firm purchased equipment for offshore drilling two years ago, and sells its successful wells to major oil companies for development. Although the firm is not yet profitable, Fisher believes that the firm&#x27;s long-term prospects are favorable. Due to a global economic expansion there has been an increase in the demand for and price of oil, resulting in an increased demand for oil drilling equipment. As a result, Spurlock paid significantly higher prices for its equipment than the established firms in the industry. Spurlock common stock does not pay a dividend.<\/p><p>Hamilton is following a firm that manufactures oil and gas drilling equipment, Rig Industries. Last year, Rig had reported earnings per share of $2.40, under International Financial Reporting Standards (IFRS). Hamilton is estimating the firm&#x27;s underlying and normalized earnings. The economy and the industry have been in an expansion for three years. The firm reported expenses for environmental remediation of $0.29 per share last year and a gain on sales of surplus assets of $0.17 per share.<\/p><p>Fisher is examining the prospects of an agricultural chemicals producer, Walton Global. Walton has grown since it went public some years ago. Over the past few years, Walton has benefited from economic expansion and grown even more rapidly, both in terms of capacity and earnings. Fisher is valuing the firm using a justified leading P/E approach. The following are the mean analysts&#x27; earnings forecasts and other selected statistics for Walton Global:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$45<\/td><\/tr><tr><td>Expected earnings per share<\/td><td>$5.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>12.0%<\/td><\/tr><tr><td>Return on equity<\/td><td>10.0%<\/td><\/tr><tr><td>Retention ratio<\/td><td>40.0%<\/td><\/tr><\/table><\/div><p>Fisher is concerned that the justified leading P/E for Walton may be misleading because of a cyclical component in current earnings and also may suffer from upward bias in sell-side analysts&#x27; earnings and growth forecasts this far into an expansion. She wants to normalize EPS to get a normalized P/E ratio. Fisher is deciding whether to use the average P/E over the most recent full economic cycle or to use the average ROE over the cycle times current book value to calculate a normalized P/E.<\/p><\/div><\/details><div class=\"qtext\"><p>The highest trailing price-to-earnings ratio for Rig Industries would be one based on:<\/p><\/div>","subj":"equity"},{"n":59,"q":"Based on the analysts' mean earnings forecast and the other items provided for Walton Global, Walton is:","opts":["overvalued because its justified leading P/E is 5.0.","overvalued because its justified leading P/E is 7.5.","undervalued because its justified leading P/E is 10.0."],"ans":"B","expl":"The growth rate can be calculated as the retention ratio times the return on equity: 40% × 10% = 4%. The justified leading P/E ratio is then calculated as:\nP 0 | (1−0.40)\n= | = 7.5\nE1 | 0.12−0.04\nThe firm's actual leading P/E ratio is 45 / 5 = 9.0, so we conclude on the basis of this information that the firm is overvalued.\n(Module 22.4, LOS 22.l)","explhtml":"<p>The growth rate can be calculated as the retention ratio times the return on equity: 40% × 10% = 4%. The justified leading P/E ratio is then calculated as:<\/p><div class=\"tbl\"><table><tr><td>P 0<\/td><td>(1−0.40)<\/td><\/tr><tr><td>=<\/td><td>= 7.5<\/td><\/tr><tr><td>E1<\/td><td>0.12−0.04<\/td><\/tr><\/table><\/div><p>The firm&#x27;s actual leading P/E ratio is 45 / 5 = 9.0, so we conclude on the basis of this information that the firm is overvalued.<\/p><p>(Module 22.4, LOS 22.l)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nancy Fisher and Charlene Hamilton evaluate firms in the basic materials sector for the investment firm of Boatwright Advisors. They are currently evaluating the prospects for Spurlock Offshore Exploration and the other firms in its industry.<\/p><p>Spurlock is a relatively new firm in the oil and gas exploration industry. The firm purchased equipment for offshore drilling two years ago, and sells its successful wells to major oil companies for development. Although the firm is not yet profitable, Fisher believes that the firm&#x27;s long-term prospects are favorable. Due to a global economic expansion there has been an increase in the demand for and price of oil, resulting in an increased demand for oil drilling equipment. As a result, Spurlock paid significantly higher prices for its equipment than the established firms in the industry. Spurlock common stock does not pay a dividend.<\/p><p>Hamilton is following a firm that manufactures oil and gas drilling equipment, Rig Industries. Last year, Rig had reported earnings per share of $2.40, under International Financial Reporting Standards (IFRS). Hamilton is estimating the firm&#x27;s underlying and normalized earnings. The economy and the industry have been in an expansion for three years. The firm reported expenses for environmental remediation of $0.29 per share last year and a gain on sales of surplus assets of $0.17 per share.<\/p><p>Fisher is examining the prospects of an agricultural chemicals producer, Walton Global. Walton has grown since it went public some years ago. Over the past few years, Walton has benefited from economic expansion and grown even more rapidly, both in terms of capacity and earnings. Fisher is valuing the firm using a justified leading P/E approach. The following are the mean analysts&#x27; earnings forecasts and other selected statistics for Walton Global:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$45<\/td><\/tr><tr><td>Expected earnings per share<\/td><td>$5.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>12.0%<\/td><\/tr><tr><td>Return on equity<\/td><td>10.0%<\/td><\/tr><tr><td>Retention ratio<\/td><td>40.0%<\/td><\/tr><\/table><\/div><p>Fisher is concerned that the justified leading P/E for Walton may be misleading because of a cyclical component in current earnings and also may suffer from upward bias in sell-side analysts&#x27; earnings and growth forecasts this far into an expansion. She wants to normalize EPS to get a normalized P/E ratio. Fisher is deciding whether to use the average P/E over the most recent full economic cycle or to use the average ROE over the cycle times current book value to calculate a normalized P/E.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the analysts&#x27; mean earnings forecast and the other items provided for Walton Global, Walton is:<\/p><\/div>","subj":"equity"},{"n":60,"q":"With regard to Fisher's calculation of a normalized P/E for Walton, she should use:","opts":["either method, as they are theoretically the same.","the average EPS method.","the average ROE method."],"ans":"C","expl":"In this case, Fisher should use the average ROE over the economic cycle times current book value per share to estimate normalized earnings. Since Walton has grown rapidly, the average of historical EPS will understate the earnings power of the firm.\n(Module 22.4, LOS 22.e)","explhtml":"<p>In this case, Fisher should use the average ROE over the economic cycle times current book value per share to estimate normalized earnings. Since Walton has grown rapidly, the average of historical EPS will understate the earnings power of the firm.<\/p><p>(Module 22.4, LOS 22.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nancy Fisher and Charlene Hamilton evaluate firms in the basic materials sector for the investment firm of Boatwright Advisors. They are currently evaluating the prospects for Spurlock Offshore Exploration and the other firms in its industry.<\/p><p>Spurlock is a relatively new firm in the oil and gas exploration industry. The firm purchased equipment for offshore drilling two years ago, and sells its successful wells to major oil companies for development. Although the firm is not yet profitable, Fisher believes that the firm&#x27;s long-term prospects are favorable. Due to a global economic expansion there has been an increase in the demand for and price of oil, resulting in an increased demand for oil drilling equipment. As a result, Spurlock paid significantly higher prices for its equipment than the established firms in the industry. Spurlock common stock does not pay a dividend.<\/p><p>Hamilton is following a firm that manufactures oil and gas drilling equipment, Rig Industries. Last year, Rig had reported earnings per share of $2.40, under International Financial Reporting Standards (IFRS). Hamilton is estimating the firm&#x27;s underlying and normalized earnings. The economy and the industry have been in an expansion for three years. The firm reported expenses for environmental remediation of $0.29 per share last year and a gain on sales of surplus assets of $0.17 per share.<\/p><p>Fisher is examining the prospects of an agricultural chemicals producer, Walton Global. Walton has grown since it went public some years ago. Over the past few years, Walton has benefited from economic expansion and grown even more rapidly, both in terms of capacity and earnings. Fisher is valuing the firm using a justified leading P/E approach. The following are the mean analysts&#x27; earnings forecasts and other selected statistics for Walton Global:<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$45<\/td><\/tr><tr><td>Expected earnings per share<\/td><td>$5.00<\/td><\/tr><tr><td>Required return on stock<\/td><td>12.0%<\/td><\/tr><tr><td>Return on equity<\/td><td>10.0%<\/td><\/tr><tr><td>Retention ratio<\/td><td>40.0%<\/td><\/tr><\/table><\/div><p>Fisher is concerned that the justified leading P/E for Walton may be misleading because of a cyclical component in current earnings and also may suffer from upward bias in sell-side analysts&#x27; earnings and growth forecasts this far into an expansion. She wants to normalize EPS to get a normalized P/E ratio. Fisher is deciding whether to use the average P/E over the most recent full economic cycle or to use the average ROE over the cycle times current book value to calculate a normalized P/E.<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to Fisher&#x27;s calculation of a normalized P/E for Walton, she should use:<\/p><\/div>","subj":"equity"},{"n":61,"q":"The EV/EBITDA ratio for Luc Energy Partners is closest to:","opts":["3.3.","3.6.","4.6."],"ans":"B","expl":"EV = market value of common stock + market value of debt – cash and investments EV = ($30 × 45) + $120 – $42 – $275 = $1,153 million The EV/EBITDA ratio is thus: 1,153 / 320 = 3.60.\n(Module 22.4, LOS 22.o)","explhtml":"<p>EV = market value of common stock + market value of debt – cash and investments EV = ($30 × 45) + $120 – $42 – $275 = $1,153 million The EV/EBITDA ratio is thus: 1,153 / 320 = 3.60.<\/p><p>(Module 22.4, LOS 22.o)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Lisa Marie and Kevin Earnhardt are senior equity analysts at Wainscots Investments.<\/p><p>Marie covers the oil refining and petrochemical industry. She has noticed a great deal of variation in firm financial leverage and profitability across this industry. Marie generally uses the EV/EBITDA ratio, among other metrics, to value firms in this industry. One firm of particular interest to Marie is Luc Energy Partners. The relevant statistics that Marie uses to calculate Luc Energy&#x27;s EV/EBITDA ratio are as follows:<\/p><p>Luc Energy Partners financial information:<\/p><p>(all data in millions, except for stock price)<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$30.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>45.0<\/td><\/tr><tr><td>Market value of debt<\/td><td>$120.0<\/td><\/tr><tr><td>EBITDA<\/td><td>$320.0<\/td><\/tr><tr><td>Cash and marketable securities<\/td><td>$42.0<\/td><\/tr><tr><td>Investments<\/td><td>$275.0<\/td><\/tr><\/table><\/div><p>Earnhardt believes that Luc&#x27;s current dividend of $1.00 will increase at a growth rate of 10% next year and linearly decline to its constant growth rate of 5% over the next six years.<\/p><p>During Earnhardt&#x27;s weekly meeting with Sylvia Dietrich, an intern at the firm, Dietrich asks about an appropriate model to use to estimate the terminal value of Zeta Inc., a company that is currently experiencing high growth.<\/p><p>Earnhardt has become interested in Petroleo Corporation (Petroleo) because of its growth potential. Dietrich has compiled the data in the following table but is not sure exactly how she should estimate the growth rate for Petroleo&#x27;s dividends for the foreseeable future. They discuss the assumptions required for them to estimate a sustainable growth rate for Petroleo.<\/p><p>Excerpts from Petroleo Corporation&#x27;s most recent financial statements:<\/p><div class=\"tbl\"><table><tr><td>Cash and equivalents<\/td><td>$1 million<\/td><\/tr><tr><td>Net working capital<\/td><td>$5 million<\/td><\/tr><tr><td>Total debt<\/td><td>$30 million<\/td><\/tr><tr><td>Total equity<\/td><td>$20 million<\/td><\/tr><tr><td>Net income<\/td><td>$2 million<\/td><\/tr><tr><td>Dividend payout ratio<\/td><td>20% of net income<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The EV/EBITDA ratio for Luc Energy Partners is closest to:<\/p><\/div>","subj":"equity"},{"n":62,"q":"Based on Earnhardt's expectations, the required rate of return for Luc Energy indicated by the market price is closest to:","opts":["9%.","12%.","14%."],"ans":"A","expl":"We are given that D0 = 1, P0 = 30, H = 6 / 2 = 3, gS = 10%, gL = 5% The required rate of return is thus calculated as:\nr = [ (D0/P0 ) × {(1 + gL) + [H × (gs − gL)]} ] + gL = [(1 / 30) × {(1.05) + [3 × (0.10 − 0.05)]}] + 0.05 = [0.033 × 1.20] + 0.05 = 0.09 or 9% (Module 20.3, LOS 20.i)","explhtml":"<p>We are given that D0 = 1, P0 = 30, H = 6 / 2 = 3, gS = 10%, gL = 5% The required rate of return is thus calculated as:<\/p><p>r = [ (D0/P0 ) × {(1 + gL) + [H × (gs − gL)]} ] + gL = [(1 / 30) × {(1.05) + [3 × (0.10 − 0.05)]}] + 0.05 = [0.033 × 1.20] + 0.05 = 0.09 or 9% (Module 20.3, LOS 20.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lisa Marie and Kevin Earnhardt are senior equity analysts at Wainscots Investments.<\/p><p>Marie covers the oil refining and petrochemical industry. She has noticed a great deal of variation in firm financial leverage and profitability across this industry. Marie generally uses the EV/EBITDA ratio, among other metrics, to value firms in this industry. One firm of particular interest to Marie is Luc Energy Partners. The relevant statistics that Marie uses to calculate Luc Energy&#x27;s EV/EBITDA ratio are as follows:<\/p><p>Luc Energy Partners financial information:<\/p><p>(all data in millions, except for stock price)<\/p><div class=\"tbl\"><table><tr><td>Stock price<\/td><td>$30.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>45.0<\/td><\/tr><tr><td>Market value of debt<\/td><td>$120.0<\/td><\/tr><tr><td>EBITDA<\/td><td>$320.0<\/td><\/tr><tr><td>Cash and marketable securities<\/td><td>$42.0<\/td><\/tr><tr><td>Investments<\/td><td>$275.0<\/td><\/tr><\/table><\/div><p>Earnhardt believes that Luc&#x27;s current dividend of $1.00 will increase at a growth rate of 10% next year and linearly decline to its constant growth rate of 5% over the next six years.<\/p><p>During Earnhardt&#x27;s weekly meeting with Sylvia Dietrich, an intern at the firm, Dietrich asks about an appropriate model to use to estimate the terminal value of Zeta Inc., a company that is currently experiencing high growth.<\/p><p>Earnhardt has become interested in Petroleo Corporation (Petroleo) because of its growth potential. Dietrich has compiled the data in the following table but is not sure exactly how she should estimate the growth rate for Petroleo&#x27;s dividends for the foreseeable future. They discuss the assumptions required for them to estimate a sustainable growth rate for Petroleo.<\/p><p>Excerpts from Petroleo Corporation&#x27;s most recent financial statements:<\/p><div class=\"tbl\"><table><tr><td>Cash and equivalents<\/td><td>$1 million<\/td><\/tr><tr><td>Net working capital<\/td><td>$5 million<\/td><\/tr><tr><td>Total debt<\/td><td>$30 million<\/td><\/tr><tr><td>Total equity<\/td><td>$20 million<\/td><\/tr><tr><td>Net income<\/td><td>$2 million<\/td><\/tr><tr><td>Dividend payout ratio<\/td><td>20% of net income<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on Earnhardt&#x27;s expectations, the required rate of return for Luc Energy indicated by the market price is closest to:<\/p><\/div>","subj":"equity"},{"n":63,"q":"Regarding Dietrich's question about estimating terminal share value Zeta Inc., it would be least appropriate for Earnhardt to suggest the:","opts":["constant growth model.","price multiple method.","double-declining growth model."],"ans":"C","expl":"The two most frequently used methods to estimate the terminal value in a stock valuation model are the constant (Gordon) growth model and the method of price multiples. The double-declining model is not an appropriate method of estimating terminal value.\n(Module 20.3, LOS 20.m)","explhtml":"<p>The two most frequently used methods to estimate the terminal value in a stock valuation model are the constant (Gordon) growth model and the method of price multiples. The double-declining model is not an appropriate method of estimating terminal value.<\/p><p>(Module 20.3, LOS 20.m)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lisa Marie and Kevin Earnhardt are senior equity analysts at Wainscots Investments.<\/p><p>Marie covers the oil refining and petrochemical industry. She has noticed a great deal of variation in firm financial leverage and profitability acros <\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Dietrich&#x27;s question about estimating terminal share value Zeta Inc., it would be least appropriate for Earnhardt to suggest the:<\/p><\/div>","subj":"equity"},{"n":64,"q":"To estimate the sustainable growth rate for Petroleo, it would be most appropriate for Earnhardt and Dietrich to assume that Petroleo will:","opts":["not issue new debt or equity.","issue new debt but not new equity.","issue new equity but not new debt."],"ans":"B","expl":"The sustainable growth rate is estimated assuming that equity will grow internally by the amount of retained earnings (i.e., no new equity is issued). It is assumed that debt is increased proportionally so that the capital structure of the firm will remain unchanged over time.\n(Module 20.3, LOS 20.p)","explhtml":"<p>The sustainable growth rate is estimated assuming that equity will grow internally by the amount of retained earnings (i.e., no new equity is issued). It is assumed that debt is increased proportionally so that the capital structure of the firm will remain unchanged over time.<\/p><p>(Module 20.3, LOS 20.p)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lisa Marie and Kevin Earnhardt are senior equity analysts at Wainscots Investments.<\/p><p>Marie covers the oil refining and petrochemical industry. She has noticed a great deal of variation in firm financial leverage and profitability across this industry. Marie generally uses the EV/EBITDA ratio, among other metrics, to value firms in this industry. One firm of particular interest to Marie is Luc Energy Partners. The relevant statistics that Marie uses to calculate Luc Energy&#x27;s EV/EBITDA ratio are as follows:<\/p><p>Luc Energy Partners financial information:<\/p><p>(all data in millions, except for stock price)<\/p><div clas
