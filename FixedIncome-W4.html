<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A negotiable certificate of deposit (CD) is best described as having:", "opts": ["small denominations and a penalty for early withdrawal.", "a maximum maturity of one year, and interest is paid monthly.", "large denominations, and it can be traded in the secondary market."], "ans": "C", "expl": "Certificates of deposit (CD)\nNonnegotiable CD Negotiable CD\nDenomination ≤ USD 100,000 Usually ≥ USD 1,000,000\nEarly withdrawal Yes, with penalty No\nTradable No Yes, in secondary market\nBanks receive much of their funding through retail customer deposits, but they also often turn to the wholesale funding market to obtain capital.\nThe wholesale funding market consists of central bank funds, the interbank market, and certificates of deposit (CDs).\nIn exchange for a deposit, a bank will issue a CD in a specific amount for a specified time and interest rate. CDs are one of the primary sources of\nfunding for banks and similar financial institutions. CDs can be categorized as either negotiable or nonnegotiable.\nA nonnegotiable CD is commonly sold to the bank's retail customers. Nonnegotiable CDs pay interest at maturity, are issued in small\ndenominations of usually less than USD 100,000, and can only be withdrawn before maturity by paying a penalty (Choice A).\nA negotiable CD is issued in large denominations, often USD 1 million or more, and can be traded to other investors in the secondary market.\nNegotiable CDs pay interest at maturity and cannot be withdrawn early.\n(Choice B) Both types of CDs can have maturities greater than one year. A CD with a maturity of more than one year is known as a term CD. All\nCDs pay interest at maturity.\nThings to remember:\nIn exchange for a deposit, a bank will issue a certificate of deposit (CD) in a specific amount for a specified time and interest rate. A negotiable CD\nis issued in large denominations, often USD 1 million or more, and can be traded to other investors in the secondary market. Negotiable CDs pay\ninterest at maturity and cannot be withdrawn early.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 2, "q": "A US bank issues USD 100 million in 90-day, 4% US commercial paper. Assuming a 360-day year, the proceeds from the offering (USD millions) are closest to:", "opts": ["96", "99", "100"], "ans": "B", "expl": "Commercial paper is short-term unsecured debt issued by companies in many markets around the world. Commercial paper is used\nextensively for short-term financing needs, including working capital, seasonal funds, and bridge financing since it is relatively flexible, available,\nand low-cost. The United States commercial paper (USCP) market is the world's largest. Eurocommercial paper (ECP) refers to all commercial\npaper issued outside the United States market.\nOne of the most important differences between these markets is the way interest is earned. USCP pays interest on a discount basis whereas\nthe ECP market uses either an interest-bearing or discount basis. In this USCP scenario, the paper is issued at a discount to par. The interest\namount is calculated as follows:\nFor commercial paper offered on a discount basis, the offering proceeds are equal to the par value minus the interest: 100 million − 1 million = 99\nmillion.\n(Choice A) USD 96 million is the result of failing to multiply by (90 ÷ 360) when calculating the interest.\n(Choice C) USD 100 million is the amount of proceeds if the interest of the offering were on an interest bearing (ie, yield) basis.\nThings to remember:\nUS commercial paper is offered with interest on a discount basis, so offering proceeds are equal to par value minus interest. Eurocommercial\npaper may be offered on either a discount or interest-bearing basis.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 3, "q": "Interbank offered rates are least likely used:", "opts": ["to price a 5-year fixed-coupon bond issued by a bank.", "for resetting the coupon rate on a 5-year floating-rate note (FRN)", "as the reference rate for a 5-year fixed-for-floating interest rate swap."], "ans": "A", "expl": "Adjustable- or floating-rate instruments have numerous attractions for borrowers and creditors. Floating-rate loans or bonds are usually lower-cost\nsources of funds than long-term fixed rate borrowing. Lenders and investors can reduce interest rate risk by using floating-rate securities or\nderivatives. Interbank offered rates (eg, Libor) are widely used as reference rates for setting interest rates on such financial instruments.\nHowever, interbank rates are not used to price fixed-coupon bonds. Such a bond's price is based on the YTM at which the security is trading. A\n5-year bond's price reflects a 5-year interest rate. Interbank rates have terms that range from overnight to a maximum of 1 year; therefore, they\nare not used to price 5-year fixed-coupon bonds.\n(Choices B and C) The specific interbank rate used typically has a term consistent with the reset frequency (eg, a 3-month rate is used for\nquarterly resets).\nThings to remember:\nThe price of a fixed-coupon bond is based on the YTM at which the security is trading. Interbank rates have terms that range from overnight to a\nmaximum of 1 year; therefore, they are not used to price 5-year fixed-coupon bonds.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 4, "q": "The purpose of a repo margin is most likely to:", "opts": ["provide a return to the lender.", "shield the borrower from counterparty risk.", "protect the lender from a decline in collateral value."], "ans": "C", "expl": "Factors affecting repo margin\nCollateral quality The higher the quality of collateral, the lower the margin\nCollateral demand Lower margin is required if specific collateral is in high demand\nLength The longer the term of the repo, the higher the margin\nCounterparty risk Higher creditworthiness of counterparty, lower margin required\nIn a repurchase agreement (\"repo\"), the repo buyer, as the lender, provides cash in exchange for securities provided by the repo seller, as the\nborrower. In effect, securities are collateral for the short-term financing provided by the repo.\nThe lender is exposed to the risk that the borrower will not repurchase the collateral when the agreement ends, defaulting on the repo. Although\nthe lender can sell the collateral in the market, it is possible that its market value will have declined since the repo was initiated.\nTo shield the lender from a decline in collateral value in the event of default, the value of the collateral is greater than the amount actually\nloaned (eg, 102%, 105%). The difference between the value of the collateral and the amount loaned is the repo margin. The magnitude of the\nrepo margin depends upon:\nthe quality of the collateral,\nthe demand for specific collateral,\nthe term of the repo, and\nthe counterparty's creditworthiness.\n(Choice A) The lender's return (ie, interest rate) for providing cash to the borrower is the repo rate.\n(Choice B) The repo margin protects the lender from counterparty risk, not the borrower.\nThings to remember:\nThe repurchase agreement (\"repo\") margin is the difference between the value of the cash loaned and the value of the collateral. The repo margin\nprotects the lender from counterparty default risk and a decline in collateral value.\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.", "qhtml": null}, {"n": 5, "q": "With respect to principal repayment structures, a serial maturity bond is most similar to a:", "opts": ["coupon strip.", "payment-in-kind bond.", "bond with a sinking fund."], "ans": "C", "expl": "An issuance of corporate bonds typically has one of two principal repayment structures:\nIn a term maturity, the entire principal amount for a bond is due on the same date.\nWith a serial maturity, the bond issue has multiple maturity dates; the principals of certain bonds are retired on each of the maturity\ndates.\nSince a term maturity involves the issuer retiring the entire bond issue at one maturity date, it exposes bondholders to greater risk of default than a\nserial maturity structure. A sinking fund can mitigate this risk: the issuer is required to retire a certain minimum percentage of the bonds each year,\naccording to a schedule designated in the bond indenture. This means that redemptions to bondholders happen over time, similarly to how\ncash flows occur for a bond issuance with a serial maturity structure.\n(Choice A) A coupon strip refers to the securities created when the interest payments from a government bond are separated (\"stripped\") from\ntheir principal payment and the two types of obligations trade as separate securities in the market. In this process, the date of the principal\npayment is not changed and occurs on the same single date, so the resulting securities are not similar to a serial maturity.\n(Choice B) Payment-in-kind (PIK) refers to a type of bond coupon, not a type of principal repayment structure. A PIK coupon bond pays the\nperiodic coupon in the form of common stock shares of the company or in bonds, not cash.\nThings to remember:\nCorporate bond issues have either a serial maturity structure, in which the bonds are retired on multiple maturity dates, or a term maturity structure\nwith one maturity date. The term maturity structure involves more risk due to the single required date of principal repayment. A sinking fund is\nsimilar to a serial maturity structure from the issuer's perspective.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 6, "q": "A bank expects to originate more loans than can be funded by retail deposits. Banks in this situation most commonly utilize funding from:", "opts": ["wholesale funds.", "demand deposits.", "fixed-rate bond issuances."], "ans": "A", "expl": "Short-term funding available to banks\nDemand deposits (checking accounts)\nRetail deposits Savings accounts\nMoney market accounts\nCentral bank funds\nWholesale funds Interbank deposits\nCertificates of deposit\nShort-term loan-like agreements\nRepurchase agreements (\"repos\") Repo and reverse repo\nNot particular to banks\nDebt maturities < 360 days\nCommercial paper\nNot particular to banks\nFinancial institutions like banks have greater funding needs than nonfinancial companies since, in addition to projects like expansions and\nacquisitions, they engage in financial operations such as making loans and investing. Banks obtain much of their funding through the retail\ndeposits of their customers. However, when the amount of loans made to customers exceeds the funds available from retail accounts, they most\ncommonly turn to wholesale funds: central bank funds, interbank deposits, and certificates of deposit.\nBanks will use wholesale funds first, after retail deposits, since interest costs can be less than with retail deposits, repurchase agreements, and\ncommercial paper. Wholesale funds are also important in managing any potential fixed/floating balance sheet mismatch between assets and\nliabilities. Repurchase agreements are another commonly used source of funds available to banks and other companies.\n(Choice B) Demand deposits (checking accounts) are a type of retail deposit.\n(Choice C) Bank financial assets tend to be relatively short-term, and therefore result in a variable rate of interest. Banks normally first turn to\nlower-cost wholesale funds before issuing debt in the form of bonds. If banks issue bonds, the bonds are likely to have a floating (not fixed)\ncoupon rate.\nThings to remember:\nBanks are most likely to turn to wholesale funds if loan balances exceed retail deposits. Wholesale funds are generally less expensive for banks\nthan a bond issuance.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 7, "q": "For a bond issue with a sinking fund arrangement, the bonds retired prior to maturity are least likely to be retired at:", "opts": ["a discount to par.", "par.", "a premium to par."], "ans": "C", "expl": "Sinking fund provision\nPredetermined schedule for retiring a portion of a bond\nissue prior to maturity\nExposes bondholders to:\nReinvestment risk\nGradually reduced credit risk\nA bond issue with a sinking fund arrangement requires the issuer to retire a portion of the original principal amount prior to maturity (similar to a\nserial maturity structure). The sinking fund schedule specifies the principal amount of bonds that must be retired each year. The retirements\nreduce the total amount of debt outstanding, thereby reducing the credit risk faced by holders of the bonds still outstanding.\nThe issuer can meet the sinking fund requirement by either:\npurchasing the required par amount in the secondary market, or\nrandomly choosing bonds to call at par (Choice B).\nBonds purchased in the secondary market must be delivered to the indenture trustee to prove compliance with the sinking fund arrangement.\nSecondary market purchases are used to satisfy a sinking fund retirement only if the bond is trading at a discount to par (Choice A). If the\nbond is trading at a premium, the sinking fund calls at par are used. Therefore, bonds with a sinking fund arrangement are unlikely to ever be\nretired at a premium to par.\nThings to remember:\nA bond with a sinking fund arrangement requires the issuer to retire a portion of the original principal amount prior to maturity. The issuer can\nmeet this requirement by either calling bonds to be retired or purchasing bonds in the secondary market. Bonds are purchased in the secondary\nmarket only if they can be purchased at a discount.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 8, "q": "A contingency provision contained in the indenture of a bond issued by a corporation most likely refers to:", "opts": ["the issuer's ability to defer coupon payments if certain conditions are met.", "the bondholder's ability to force the corporation to redeem the bond before maturity.", "the issuer's right to incur additional debt while some or all of the original amount is still outstanding."], "ans": "B", "expl": "Typical bond contingency provisions\nCallability Issuer has right to redeem bond before maturity\nPutability Bondholder can require issuer to redeem bond before maturity\nBondholder can convert bond into a predetermined number of issuer's\nConvertibility\ncommon shares\nContingency provisions in the context of bonds are very specific and refer to the rights of the issuer and/or bondholders with respect to how a\nbond can be redeemed or disposed of. The most common types of contingency provisions concern whether a bond can be called, put, or\nconverted.\nA putable bond gives its holder the right to require that the issuer redeem the bond before maturity. The redemption price is established in the\nindenture, in addition to any other relevant provisions such as when the bondholder must act. This right (ie, the put) can be valuable to the\nbondholder, and that value allows the issuer to pay a lower coupon rate.\n(Choice A) The issuer's right to defer coupon payments does not relate to redeeming or converting the bond, so it is not properly categorized as a\ncontingency.\n(Choice C) Provisions concerning an issuer's ability to incur additional debt are a covenant, or promise, of actions that the issuer agrees to take\n(ie, affirmative covenants) or not take (ie, negative covenants).\nThings to remember:\nA contingency provision in a bond covenant refers to the circumstances governing the redemption or disposal of a bond. The most common\ncontingency provisions address a bond's callability, putability, and convertibility.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 9, "q": "If repo collateral is \"on special,\" it most likely:", "opts": ["is in high demand.", "is a repo to maturity.", "offers the highest overnight repo rate."], "ans": "A", "expl": "Factors affecting repo rates\nCollateral risk The higher the quality of collateral, the lower the rate.\nCollateral General collateral is the standard rate for a collateral type.\ndemand \"On special\" collateral lowers the repo rate.\nTerm The longer the term, the higher the rate.\nDelivery A lower rate is offered if collateral needs to be directly\nrequirements delivered to the lender versus a third-party custodian.\nFinancing Repo rates are affected by financing alternatives available in\nalternatives the market.\nThe repo rate is the quoted interest rate on a repurchase agreement. Repo rates are generally tied to short-term interest rates and follow the\ncentral bank policy rate very closely. With the policy rate as the baseline, other factors that influence the repo rate include collateral risk, demand\nfor collateral, term, delivery requirements, and alternative financing sources.\n\"General collateral\" refers to a broad variety (eg, maturities, coupons) of issues of the same type (eg, Treasuries, agency bonds) that serve as\ncollateral (ie, the asset sold and repurchased) for the repo. When a certain asset, such as a specific Treasury bond, is \"on special,\" there is great\ndemand for that specific security to serve as collateral, which depresses the repo rate below the general collateral rate. The lender is willing to\naccept the lower rate in order to have that specific asset as collateral. Specialness is driven by a very specific borrowing need (eg, a short position\nor a futures delivery) and most often applies to a benchmark security (eg, 10-year Treasury).\n(Choice B) A repo to maturity is a repo with a term equal to the maturity of the underlying collateral (eg, 15 days). Special collateral is most often\nin great demand to satisfy a very specific obligation; however, it is highly unlikely that a repo to maturity would be able satisfy the specific collateral\nobligation.\n(Choice C) An \"on special\" repo will have a lower rate versus general collateral of the same term.\nThings to remember:\nRepo rates are affected by collateral risk, demand for collateral, term, delivery requirements, and alternative financing sources. When a certain\nasset, such as a specific Treasury bond, is \"on special,\" there is great demand for that specific security to serve as collateral, which depresses the\nrepo rate below the general collateral rate.\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.", "qhtml": null}, {"n": 10, "q": "A large corporation based in the United States wants to borrow funds for three months as interim financing until it can complete a long-term bond issue. If the interim funding is to be unsecured, the most appropriate funding arrangement is to: ", "opts": ["issue three-month commercial paper.", "borrow directly from a bank for three months.", "initiate a three-month term repurchase agreement."], "ans": "A", "expl": "Commercial paper is a form of short-term debt that is often used for interim financing until longer-term financing can be finalized. In addition to\nbeing short-term, commercial paper is unsecured, meaning that there is no collateral; it is only the issuer's promise to pay that backs the loan.\nCommercial paper is issued to multiple investors through capital markets, whereas bank loans are negotiated directly between the borrower and\nlender.\n(Choice B) Bank loans are more likely to be used by smaller corporate borrowers that do not have ready access to capital markets. Most bank\nloans require the borrower to secure the loan with collateral.\n(Choice C) In a repurchase (\"repo\") agreement, the borrower sells an asset while agreeing to repurchase it in the future for a predetermined\nprice. Since the lender can sell the asset if the repurchase does not occur, a repo agreement can be viewed as a secured loan. For this reason, it\nis classified as a secured form of short-term debt.\nThings to remember:\nCommercial paper is a form of short-term debt that larger companies often use as a source of interim financing. Commercial paper is unsecured\nby any collateral or other security; it is backed only by the issuer's promise to pay.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 11, "q": "Which of the following fixed-income instruments is most similar to a collateralized loan?", "opts": ["Putable bond", "Interbank loan", "Repurchase agreement"], "ans": "C", "expl": "A repurchase agreement (ie, repo) is structured as two paired transactions. The first trade is a sale of securities for a specified amount of cash.\nAt that time, the counterparties agree to a second trade in which the initial seller repurchases the securities for a slightly higher price.\nThere is no price risk with a repo since the prices for both trades are agreed to at initiation; in effect, the price difference is interest earned on\nthe purchase (ie, loaned) amount. The original buyer is protected from default by the securities (ie, collateral) received in the initial trade. As a\nresult, a repo is the equivalent of a collateralized loan.\n(Choice A) The put provision in a putable bond does give bondholders the right to force the issuer to repurchase the bond prior to maturity, but\nthere is no collateral (ie, no assets are pledged against the risk of default).\n(Choice B) An interbank loan is unsecured. In a repo, the assets purchased function as collateral.\nThings to remember:\nRepurchase agreements (repos) consist of an initial sale and subsequent repurchase of securities. There is no price risk, so the agreed-upon\nprice difference is effectively interest. Since buyers are protected from default by the securities in their possession, repos are a type of\ncollateralized loan.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 12, "q": "A large company with a low credit rating needs to borrow a large amount of money. If the company operates in a country with an underdeveloped bond market, which of the following is the company's most likely source of funds?", "opts": ["Bilateral loan", "Bond issuance", "Syndicated loan"], "ans": "C", "expl": "Bank loans are the primary source of debt financing for small- and medium-size companies. Large companies may also use bank loans instead of\nissuing bonds if the company:\nis in an underdeveloped bond market area;\nmust compete for bond issuance in a market where government entities and financial institutions dominate (\"crowd out\") corporate issuers;\nor\nhas a low credit rating, making bond issuance more expensive than a bank loan.\nA syndicated loan is made by a group (ie, syndicate) of financial institutions (eg, banks, insurance companies, and other lenders) to a single\nborrower. A syndicated loan is appropriate when no single lender wishes to make a bilateral loan (ie, single lender to single borrower) and take\non all the credit risk of the loan (Choice A). A substantial loan to a large company with a low credit rating, as described in this case, would\ninvolve high credit risk, making a syndicate a more likely source of funds than a single lender.\n(Choice B) Large, established companies with high credit ratings issue bonds perceived as relatively safe investments by bond markets. For\nsuch companies, issuing bonds may be less expensive, and therefore more desirable, than taking out bank loans. The exceptions to this general\nrule is when bond markets are not fully developed or when government entities \"crowd out\" private companies in bond issuance.\nThings to remember:\nLarge companies with good credit ratings generally prefer to issue bonds as their lowest cost borrowing option. A large company may instead use\nbank loans if bond markets are underdeveloped; bond markets are dominated by government and financial institutions, or the company's credit\nrating is low. A syndicated loan is more appropriate than a bilateral loan when credit risk is too great and/or the loan principal is too large for a\nsingle lender.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 13, "q": "Which of the following exposes a counterparty lending to a bank to the least amount of credit risk?", "opts": ["Central bank funds", "Repurchase agreements", "Negotiable certificates of deposit"], "ans": "B", "expl": "Short-term bank funding alternatives\nFunds deposited by individual and commercial customers\nRetail deposits\nChecking (ie, demand), savings, and money market accounts\nCentral bank Commercial bank deposits (usually required) at central bank\n(reserve) funds Excess over required minimum may be lent to other banks\nInterbank funds Market for deposits and loans between banks\nNegotiable certificates Large denomination deposits with penalties for early withdrawal\nof deposit (CDs) Withdrawal penalty avoided by sale of deposit to another investor\nRepurchase Security sale paired with later repurchase of same security\nagreements (repos) Combined transactions equivalent to a collateralized loan\nA repurchase agreement (repo) is structured as a pair of transactions:\nAt initiation securities are sold for cash, and at the same time\nthe counterparties agree to a second trade in which the seller will repurchase those securities at maturity at a higher price.\nThe required repurchase makes repos economically equivalent to collateralized loans. The repo buyer (ie, lender) has securities that can be\nsold to recover the amount owed if the repo seller (ie, borrower) fails to repurchase them. The amount borrowed in a repo is less than the value of\nthe collateral, thus minimizing the lender's exposure to credit risk.\n(Choices A and C) Loans of central bank funds and negotiable certificates of deposit are not collateralized, so the lenders are exposed to more\ncredit risk than in a repo.\nThings to remember:\nRepurchase agreements (repos) consist of an initial sale of securities and the subsequent repurchase of those securities. Repos are a type of\ncollateralized loan since the buyers are protected from default by possessing the securities. Loans of central bank funds and negotiable\ncertificates of deposit are not collateralized and therefore expose the lenders to more credit risk.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 14, "q": "When a hedge fund engages in a reverse repurchase agreement, which of the following is the most likely purpose?", "opts": ["Earn interest on cash holdings", "Speculate on increasing security prices", "Obtain securities to deliver on a short sale"], "ans": "C", "expl": "Repurchase agreements (repos) and reverse repurchase agreements (reverse repos) have identical structures. In both transactions, the\ncounterparties agree to an initial exchange (ie, sale) of securities for cash. The initial exchange is conditioned on the original security holder's\npromise to buy them back (ie, repurchase agreement).\nRepos are economically equivalent to a loan of cash collateralized by securities. In the repo diagram, the insurance company lending cash is not\nconcerned with the specific security received, only that it is adequate collateral. The reverse repo has a different motivation: the hedge fund is\nborrowing a specific security and providing cash collateral in return. Reverse repos are often the least expensive method for borrowing securities\nneeded to complete a short sale.\nA short sale is a sale of securities the seller does not own. Nonetheless, the securities must be delivered, which is the motivation for the hedge\nfund doing a reverse repo. Short sales may be done to speculate on declining prices or to hedge long positions.\n(Choice A) The hedge fund would use a repurchase agreement to earn interest since repo rates are higher than interest rates on reverse repos.\n(Choice B) The sale and repurchase prices in repos and reverse repos are set at transaction initiation, so neither transaction entails a direct\nspeculation on the related security price.\nThings to remember:\nReverse repos are a loan of specific securities collateralized by cash that are often used to obtain securities to deliver on a short sale (ie, the sale\nof a security not owned).\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 15, "q": "The repo margin most accurately describes:", "opts": ["the rate of return earned by the repo lender.", "the difference between the market value of the collateral and the amount loaned.", "the amount of additional collateral required by the repo lender in addition to the repo collateral."], "ans": "B", "expl": "A repurchase agreement (ie, repo) is a type of short-term debt. It is structured as the sale of an asset, typically a high-quality, short-term bond\nthat the seller agrees to repurchase at a future date for a specified amount. Since the terms of the agreement are known in advance, a repo can\nbe viewed as a short-term secured loan. The repo seller is the borrower and the repo buyer is the lender.\nThe lender is exposed to the risk that the borrower will be unable to repurchase the asset when the agreement matures. Although the buyer can\nsell the collateral if the seller defaults, it is possible that its market value will have declined from when the repo was initiated. To mitigate this risk,\nthe amount loaned is less than the value of the collateral. The difference is the repo margin. In the example above, the repo margin is $1,010\n− 1,000 = $10.\n(Choice A) The repo rate is the lender's return from the transaction (ie, the repurchase agreement's interest rate). In the example above, the\nprice ($2 higher) that the seller pays to repurchase the asset is equivalent to the interest on the original $1,000 loan. In this case the repo rate is\n0.2% for the two-month period, or 1.2% annually.\n(Choice C) The financial instrument that the buyer purchases is the only collateral in a repo. The repo margin is a form of credit enhancement for\nthe loan, but it is not additional collateral.\nThings to remember:\nA repurchase agreement (ie, repo) is a type of short-term debt. It is structured as a sale of an asset that the seller agrees to repurchase at a future\ndate for a predetermined price. The repo margin is the difference between the value of the purchased asset (ie, the loan collateral) and the\namount paid for the asset (ie, the loan).\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.", "qhtml": null}, {"n": 16, "q": "Which of the following is most likely considered a contingency provision for a corporate bond?", "opts": ["The issuer's ability to call the bond prior to maturity", "An increase in the bond's coupon rate if the issuer's credit rating declines", "The bondholder's right to sell the bond to another investor prior to maturity"], "ans": "A", "expl": "Typical bond contingency provisions\nCallability Issuer has right to redeem bond before maturity\nPutability Bondholder can require issuer to redeem bond before maturity\nBondholder can convert bond into a predetermined number of issuer's\nConvertibility\ncommon shares\nBonds with contingency provisions combine the cash flows of a debt security with an embedded option. Contingency provisions give either\nbondholders or issuers the right to take some action that alters the bond's cash flows.\nExercise of call or put provisions shortens the period over which coupons are paid. In addition, calling a bond may require paying a\npremium over par value.\nConversion of a bond may shorten the period over which coupons are paid and always results in an exchange of securities for the converted\nbond rather than retiring it with cash.\nA common contingency provision in indentures gives issuers the right to force bondholders to surrender their securities (ie, call the bond) prior to\nmaturity.\n(Choice B) An increase in coupon rate due to a credit rating decline does alter a bond's cash flows, but this is not considered a contingency\nprovision. Instead, the change in cash flows is triggered by an event specified in the indenture, not by the issuer or bondholders exercising some\nright.\n(Choice C) Bondholders generally have the right to sell their bonds to other investors in the secondary market prior to maturity, but that right is not\na contingency provision since the sale would not alter the cash flows payable by the issuer.\nThings to remember:\nContingency provisions give either bondholders or issuers the right to take some action that alters the bond's cash flows. Bonds with contingency\nprovisions have an embedded option; exercising that option alters the bond's cash flows. Three common types of contingency provisions result in\nbonds that are either callable, putable, or convertible.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 17, "q": "Which of the following factors most likely impacts repo margin requirements?", "opts": ["Counterparty risk", "Central bank policy rate", "Interest rates on alternative financing sources"], "ans": "A", "expl": "Factors affecting repo margin\nCollateral quality The higher the quality of collateral, the lower the margin\nCollateral demand Lower margin is required if specific collateral is in high demand\nLength The longer the term of the repo, the higher the margin\nCounterparty risk Higher creditworthiness of counterparty, lower margin required\nA repurchase agreement (ie, repo) is structured as the sale of an asset, typically a high-quality bond (eg, treasury, agency) that the seller agrees to\nrepurchase at a future date for a specified amount. Since the terms of the agreement are known in advance, a repo is a type of short-term\ncollateralized loan. The repo seller is the borrower (ie, collateral provider) and the repo buyer (ie, cash provider) is the lender.\nThe lender is exposed to the risk that the borrower will be unable to repurchase the asset when the agreement ends. Although the buyer can sell\nthe collateral in the market if the seller defaults, it is possible that the market value will have declined since the repo was initiated. To mitigate this\nrisk, the value of the collateral is greater than the amount loaned. The difference is the repo margin, which is expressed as a percentage of the\nvalue of the loan (eg, 102%, 105%).\nThe amount of the repo margin depends upon the quality of the collateral, the demand for specific collateral, the term of the repo, and the\ncounterparty's creditworthiness.\n(Choices B and C) The central bank policy rate and the interest rate on alternative sources of financing affect the repo rate, not the repo margin.\nThings to remember:\nA repo margin is the difference between the value of a cash loan and the value of the collateral. The amount of the repo margin depends upon the\nquality of the collateral, the demand for specific collateral, the term of the repo, and the counterparty's creditworthiness.\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.", "qhtml": null}];
const CFG = {"title": "Wiley · Fixed-Income Markets for Corporate Issuers", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 17 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){

    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");

    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");

    const opts = document.createElement("div");

    if(q.expl){

      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
