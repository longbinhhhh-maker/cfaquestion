e word \"could,\" which implies possibility and not certainty. This type of forward-looking statement is typical in the investment industry, where professionals often provide estimates and projections based on their analysis. Such statements are not guarantees but are rather informed opinions intended to give clients an idea of potential outcomes. The CFA Institute Code and Standards require that members and candidates exercise diligence, independence, and thoroughness in making investment recommendations or actions. Malo's statement reflects a thoughtful and reasoned expectation, not a promise of certain returns. B is incorrect. The option suggesting that Malo violated the standards because she cannot guarantee returns misinterprets her statement. Malo did not offer a guarantee; she provided an estimate of what she believes the investment could yield. The CFA Institute's Standard I (C) - Misrepresentation prohibits members from guaranteeing investment performance, but it does not prohibit making projections or forecasts based on reasonable assumptions and analysis. Malo's use of the word \"could\" clearly indicates a projection, not a guarantee, thus adhering to the ethical guidelines set forth by the CFA Institute. C is incorrect. This option claims that Malo exaggerated her investment performance. However, there is no evidence in the scenario that Malo exaggerated her performance. Her statement was a projection of future returns, not a historical fact. It is a common practice for investment professionals to use past performance and current market analysis to project future returns. The CFA Institute requires that any such projections be made with diligence and reasonable basis. Malo's projection of a 12% return is based on her professional judgment and understanding of the market, which does not constitute an exaggeration but rather a typical practice within the bounds of professional ethical standards. ", "explhtml": "<p>Fernanda Malo&#x27;s statement to the city council member about the expected performance of his investment portfolio does not violate the CFA Institute Code and Standards. Malo&#x27;s comment that the council member &quot;could earn a 12% rate of return after fees for several more years&quot; is an expression of her professional judgment based on historical data and current market conditions. It is important to note that she used the word &quot;could,&quot; which implies possibility and not certainty. This type of forward-looking statement is typical in the investment industry, where professionals often provide estimates and projections based on their analysis. Such statements are not guarantees but are rather informed opinions intended to give clients an idea of potential outcomes. The CFA Institute Code and Standards require that members and candidates exercise diligence, independence, and thoroughness in making investment recommendations or actions. Malo&#x27;s statement reflects a thoughtful and reasoned expectation, not a promise of certain returns.<\/p><p><b>B is incorrect<\/b>. The option suggesting that Malo violated the standards because she cannot guarantee returns misinterprets her statement. Malo did not offer a guarantee; she provided an estimate of what she believes the investment could yield. The CFA Institute&#x27;s Standard I (C) - Misrepresentation prohibits members from guaranteeing investment performance, but it does not prohibit making projections or forecasts based on reasonable assumptions and analysis. Malo&#x27;s use of the word &quot;could&quot; clearly indicates a projection, not a guarantee, thus adhering to the ethical guidelines set forth by the CFA Institute.<\/p><p><b>C is incorrect<\/b>. This option claims that Malo exaggerated her investment performance. However, there is no evidence in the scenario that Malo exaggerated her performance. Her statement was a projection of future returns, not a historical fact. It is a common practice for investment professionals to use past performance and current market analysis to project future returns. The CFA Institute requires that any such projections be made with diligence and reasonable basis. Malo&#x27;s projection of a 12% return is based on her professional judgment and understanding of the market, which does not constitute an exaggeration but rather a typical practice within the bounds of professional ethical standards. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Fernanda Malo<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Fernanda Malo, CFA, is a portfolio manager in the wealth management division of LBO Capital in Megapolis. She manages stock and fixed-income portfolios for individuals and institutions on a discretionary basis. Recently, Malo was approached by one of her colleagues, Hector Perez, who specializes in municipal fixed-income in the investment banking division. Perez discovered that Malo grew up in the small and isolated town of Center City. He is working on a competitive bid to underwrite a new bond issue that Center City is planning to use to finance the construction of a new library. Perez has asked Malo to help present the proposal because she knows most of the city council members. Perez believes she could help LBO Capital secure the business over two other competing firms. Malo is well-known in the community as a local with a modest background who has achieved success with one of the nation’s largest diversified financial firms. Perez tells Malo that her time would not be wasted, as she would be compensated with a finder’s fee if the firm could close the deal. Furthermore, Perez is only asking her to help with the client relationships. She would not be involved in any way with the bond issue itself. Malo agrees to allow for the good of the company. She also enjoys the thought of helping to improve her hometown.<\/p><p>Perez prepares marketing materials for the proposal. In a few weeks, Malo arranged to meet him at a coffee shop in Center City several hours before their presentation to the city&#x27;s selection committee to coordinate which parts of the presentation each would cover. As Malo looks over the printed material given to the committee members, she notices that Perez has included biographical and professional information about each of them and several other members of the investment banking division who will bring the bonds to market. LBO Capital is selected. In the section describing her, Malo reads that Perez has described her as a rising star at LBO Capital, highlighting that she passed all of the CFA® exams in three consecutive years and is one of only 10 CFAs in the wealth management arm. Perez also notes an article from an institutional investment magazine in Megapolis that lists Malo as one of the 10 best portfolio managers in the country. Malo has not seen any of this material before, and she thinks the description is slightly overindulgent. She is also concerned about compliance with CFA Standards dealing with references to the CFA designation and the CFA program. Nevertheless, the presentation is in an hour, and there is no time to have the presentation reprinted.<\/p><p>Before their interview at city hall, Malo runs into several old school friends who now work for the city. They are excited to see her and are interested in her firm’s work, which could potentially finance the new city library. An employee tells Malo that the library will be a great economic and morale boost for the city, especially after the largest manufacturing plant announced it would close next year unless it finds a buyer. Malo had not heard that news, and she realized that the plant closing could severely harm the city’s finances, as it is the largest employer in town.<\/p><p>The selection committee received Malo and Perez&#x27;s presentation well. Most of the members knew Malo from when she was a girl. They were impressed by the firm’s work with other cities on similar projects, and their proposed fees were lower than all the other competitors but one. A week later, Center City issues a press release stating that LBO Capital will be awarded the bond issue and announces a schedule outlining events that should culminate in bond issuance in a few months. However, since the interview, Malo has grown increasingly concerned about the financial situation at Center City. The financial position looks strong in the city&#x27;s latest disclosures, but she is concerned about the potential loss of the city&#x27;s largest employer. As a result, she liquidates Center City bonds from previous bond issues in many of her clients&#x27; portfolios.<\/p><p>A year later, one of the Center City city council members, with whom Malo reconnected, calls her and asks if she would be willing to manage his personal investment account. For his equity portfolio, he tells her that he would pay her beyond the compensation provided by LBO Capital based on the performance of his account each year. Based on current conditions and the historical performance of the stocks Malo invests in, she believes he can earn a 12% rate of return after fees for several more years.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Malo’s statement to the city council member about expected performance most likely violate the CFA Institute Code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "Regarding the after-market trades, Mai Huang most likely:", "opts": ["Violates the Standards concerning market manipulation.", "Violates the Standards concerning loyalty, prudence, and care.", "Does not violate the Standards because there is no law in Pacifica against the trades."], "ans": "A", "expl": "Mai Huang's practice of submitting after-market trades for an index mutual fund at the day's closing NAV, despite the absence of specific laws against such actions in Pacifica, raises significant ethical concerns under the CFA Institute's Standards of Professional Conduct. This practice allows Huang to exploit the knowledge of daily index movements post-market close, enabling her to make trades based on information not available to all market participants at the time of trade execution. This ability to trade based on the certainty of the index's performance rather than on estimations or predictions provides her with an unfair advantage over other investors who do not have this privilege. Such actions can influence the market for the shares of the mutual fund, potentially leading to price distortions that do not reflect the true market conditions at the time of trade closure. This practice aligns with the definition of market manipulation, as it involves manipulating market prices through unfair trading practices, thus violating the CFA Institute's Standard on market manipulation. B is incorrect. While Standard III(A) of the CFA Institute emphasizes a duty of loyalty, prudence, and care towards clients, Mai Huang's actions do not directly contravene this standard in the context provided. The standard pertains to the quality and thoroughness of the investment process and the obligation to act in the best interest of clients. Huang's arrangement does not suggest a lack of diligence or prudence in her investment process, per se, nor does it indicate a failure in her duty towards her clients in terms of care and loyalty. Her actions are more aligned with market manipulation rather than a breach of loyalty, prudence, and care towards her clients. C is incorrect. The argument that Mai Huang does not violate any standards because there are no specific laws in Pacifica against after-market trades is flawed. The CFA Institute's Code and Standards often impose higher ethical requirements than local laws. Compliance with local laws does not exempt members from adhering to these higher ethical standards. The Code and Standards are designed to uphold the integrity of the investment profession by promoting ethical conduct that transcends local legal requirements. Therefore, even in the absence of local legislation against such trades, Huang's actions are still subject to scrutiny under the ethical standards set forth by the CFA Institute, specifically concerning market manipulation. ", "explhtml": "<p>Mai Huang&#x27;s practice of submitting after-market trades for an index mutual fund at the day&#x27;s closing NAV, despite the absence of specific laws against such actions in Pacifica, raises significant ethical concerns under the CFA Institute&#x27;s Standards of Professional Conduct. This practice allows Huang to exploit the knowledge of daily index movements post-market close, enabling her to make trades based on information not available to all market participants at the time of trade execution. This ability to trade based on the certainty of the index&#x27;s performance rather than on estimations or predictions provides her with an unfair advantage over other investors who do not have this privilege. Such actions can influence the market for the shares of the mutual fund, potentially leading to price distortions that do not reflect the true market conditions at the time of trade closure. This practice aligns with the definition of market manipulation, as it involves manipulating market prices through unfair trading practices, thus violating the CFA Institute&#x27;s Standard on market manipulation.<\/p><p><b>B is incorrect<\/b>. While Standard III(A) of the CFA Institute emphasizes a duty of loyalty, prudence, and care towards clients, Mai Huang&#x27;s actions do not directly contravene this standard in the context provided. The standard pertains to the quality and thoroughness of the investment process and the obligation to act in the best interest of clients. Huang&#x27;s arrangement does not suggest a lack of diligence or prudence in her investment process, per se, nor does it indicate a failure in her duty towards her clients in terms of care and loyalty. Her actions are more aligned with market manipulation rather than a breach of loyalty, prudence, and care towards her clients.<\/p><p><b>C is incorrect<\/b>. The argument that Mai Huang does not violate any standards because there are no specific laws in Pacifica against after-market trades is flawed. The CFA Institute&#x27;s Code and Standards often impose higher ethical requirements than local laws. Compliance with local laws does not exempt members from adhering to these higher ethical standards. The Code and Standards are designed to uphold the integrity of the investment profession by promoting ethical conduct that transcends local legal requirements. Therefore, even in the absence of local legislation against such trades, Huang&#x27;s actions are still subject to scrutiny under the ethical standards set forth by the CFA Institute, specifically concerning market manipulation. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Mai Huang<\/summary><div class=\"vig-body\"><p>Mai Huang, CFA, is a hedge fund manager who works for Eight Sons Investments, a relatively small fund in the island nation of Pacifica that seeks arbitrage trading opportunities. Recently, Huang has reached an agreement with a firm that manages index mutual funds, allowing her to submit after-market trades within half an hour after the markets close. Still, the trade is executed at the day&#x27;s NAV, even though the NAV has not yet been calculated. Huang has also arranged the same treatment for Eight Sons’ retail clients to avoid trading ahead of them. There are no laws in Pacifica against these trades.<\/p><p>Jie Ngo, CFA, is a colleague of Huang’s who works at Eight Sons as a sell-side analyst in a different part of the firm. As Ngo is researching Prime Bank, he collects as much data as possible. His efforts include scrutinizing financial reports, speaking with executives and employees at Prime Bank, and conducting interviews with customers. In the course of his research, Ngo learns the following:<\/p><p>Prime Bank’s net margin has grown 1% yearly for the last six years.<\/p><p>Customers have found it more and more challenging to reach their banker in the past<\/p><p>two years. In some cases, Prime Bank has failed to assign a new banker to a<\/p><p>relationship when an employee leaves the bank.<\/p><p>An investor relations representative mentioned that the bank plans on closing 10<\/p><p>branches in the next 12 months.<\/p><p>On one visit to the bank, Ngo overheard two managers discussing what seemed to be a<\/p><p>possible contract with Pacifica’s government to provide cash debit cards for recipients<\/p><p>of Pacifica’s government assistance payments.<\/p><p>Based on his initial research, Ngo collects more information consistent with the existence of a government contract and models the benefit of the contract to Prime Bank. After collecting adequate information from public sources, Ngo prepares a report with a buy recommendation.<\/p><p>After receiving a copy of Ngo&#x27;s report, Huang meets with several of Eight Sons Investments&#x27; key clients to discuss Prime Bank, but reveals that the report was not thoroughly reviewed and is only being distributed to a select group of clients for consideration. <\/p><p>Elias Hong, CFA, is Ngo’s supervisor. A few days later, Hong finishes reviewing Ngo’s report on Prime Bank and asks his team to prepare the distribution. Clients who fit the right profile to own stock in Prime Bank—about two-thirds of Eight Sons’ clients—will receive the report. Before the report is sent to clients who maintain discretion over their accounts, Eight Sons will buy Prime Bank stock for its non-discretionary client accounts. The firm’s account disclosures outline the enhanced level of service that non-discretionary accounts receive, including advance trading to maximize the value of firm research, and clients are required to acknowledge the disclosure with a signature.<\/p><p>After only a short period, Hong and Ngo each receive notices that CFA<sup>®<\/sup> Institute’s professional conduct staff has initiated an inquiry into their actions.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the after-market trades, Mai Huang most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "Ngo’s research most likely violates the Standards concerning:", "opts": ["Misconduct.", "Independence and objectivity.", "Material non-public information."], "ans": "C", "expl": "Ngo's actions most likely violate the CFA Institute's Standards concerning the use of material non-public information. By collecting information to confirm a rumor about a government contract that he overheard in Prime Bank’s offices, Ngo is potentially acting on material non-public information. This information, if true, could significantly affect the bank's financial outlook and stock price, thus providing an unfair trading advantage. The fact that this information was overheard and not publicly disclosed indicates that it was not intended for public dissemination. Ngo's subsequent actions, including modeling the benefits of the contract and preparing a report with a buy recommendation based on this information, suggest reliance on potentially material non-public information, which is a breach of the CFA Institute's ethical standards. A is incorrect. The option concerning misconduct is not applicable in this scenario because misconduct typically involves behavior that is unethical or unprofessional beyond the scope of investment decisions, such as fraud or deceit. Ngo's actions, while ethically questionable under the CFA standards, do not constitute misconduct in the broader sense. His actions are more specifically related to the ethical handling of sensitive information rather than general professional conduct or behavior that harms others or the integrity of the market. B is incorrect. Independence and objectivity refer to the need for analysts to make unbiased and impartial investment recommendations without being influenced by external pressures or conflicts of interest. In Ngo's case, while there is a concern about the source of his information, there is no indication that his decision to recommend buying Prime Bank shares was influenced by external pressures or personal interests. His decision appears to be based solely on the potential financial impact of the government contract, rather than any compromise of his analytical independence or objectivity. ", "explhtml": "<p>Ngo&#x27;s actions most likely violate the CFA Institute&#x27;s Standards concerning the use of material non-public information. By collecting information to confirm a rumor about a government contract that he overheard in Prime Bank’s offices, Ngo is potentially acting on material non-public information. This information, if true, could significantly affect the bank&#x27;s financial outlook and stock price, thus providing an unfair trading advantage. The fact that this information was overheard and not publicly disclosed indicates that it was not intended for public dissemination. Ngo&#x27;s subsequent actions, including modeling the benefits of the contract and preparing a report with a buy recommendation based on this information, suggest reliance on potentially material non-public information, which is a breach of the CFA Institute&#x27;s ethical standards.<\/p><p><b>A is incorrect<\/b>. The option concerning misconduct is not applicable in this scenario because misconduct typically involves behavior that is unethical or unprofessional beyond the scope of investment decisions, such as fraud or deceit. Ngo&#x27;s actions, while ethically questionable under the CFA standards, do not constitute misconduct in the broader sense. His actions are more specifically related to the ethical handling of sensitive information rather than general professional conduct or behavior that harms others or the integrity of the market.<\/p><p><b>B is incorrect<\/b>. Independence and objectivity refer to the need for analysts to make unbiased and impartial investment recommendations without being influenced by external pressures or conflicts of interest. In Ngo&#x27;s case, while there is a concern about the source of his information, there is no indication that his decision to recommend buying Prime Bank shares was influenced by external pressures or personal interests. His decision appears to be based solely on the potential financial impact of the government contract, rather than any compromise of his analytical independence or objectivity. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Mai Huang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mai Huang, CFA, is a hedge fund manager who works for Eight Sons Investments, a relatively small fund in the island nation of Pacifica that seeks arbitrage trading opportunities. Recently, Huang has reached an agreement with a firm that manages index mutual funds, allowing her to submit after-market trades within half an hour after the markets close. Still, the trade is executed at the day&#x27;s NAV, even though the NAV has not yet been calculated. Huang has also arranged the same treatment for Eight Sons’ retail clients to avoid trading ahead of them. There are no laws in Pacifica against these trades.<\/p><p>Jie Ngo, CFA, is a colleague of Huang’s who works at Eight Sons as a sell-side analyst in a different part of the firm. As Ngo is researching Prime Bank, he collects as much data as possible. His efforts include scrutinizing financial reports, speaking with executives and employees at Prime Bank, and conducting interviews with customers. In the course of his research, Ngo learns the following:<\/p><p>Prime Bank’s net margin has grown 1% yearly for the last six years.<\/p><p>Customers have found it more and more challenging to reach their banker in the past<\/p><p>two years. In some cases, Prime Bank has failed to assign a new banker to a<\/p><p>relationship when an employee leaves the bank.<\/p><p>An investor relations representative mentioned that the bank plans on closing 10<\/p><p>branches in the next 12 months.<\/p><p>On one visit to the bank, Ngo overheard two managers discussing what seemed to be a<\/p><p>possible contract with Pacifica’s government to provide cash debit cards for recipients<\/p><p>of Pacifica’s government assistance payments.<\/p><p>Based on his initial research, Ngo collects more information consistent with the existence of a government contract and models the benefit of the contract to Prime Bank. After collecting adequate information from public sources, Ngo prepares a report with a buy recommendation.<\/p><p>After receiving a copy of Ngo&#x27;s report, Huang meets with several of Eight Sons Investments&#x27; key clients to discuss Prime Bank, but reveals that the report was not thoroughly reviewed and is only being distributed to a select group of clients for consideration. <\/p><p>Elias Hong, CFA, is Ngo’s supervisor. A few days later, Hong finishes reviewing Ngo’s report on Prime Bank and asks his team to prepare the distribution. Clients who fit the right profile to own stock in Prime Bank—about two-thirds of Eight Sons’ clients—will receive the report. Before the report is sent to clients who maintain discretion over their accounts, Eight Sons will buy Prime Bank stock for its non-discretionary client accounts. The firm’s account disclosures outline the enhanced level of service that non-discretionary accounts receive, including advance trading to maximize the value of firm research, and clients are required to acknowledge the disclosure with a signature.<\/p><p>After only a short period, Hong and Ngo each receive notices that CFA<sup>®<\/sup> Institute’s professional conduct staff has initiated an inquiry into their actions.<\/p><\/div><\/details><div class=\"qtext\"><p>Ngo’s research most likely violates the Standards concerning:<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "Huang’s distribution of the report least likely violates the Standard related to:", "opts": ["Fair dealing.", "Diligence and reasonable basis.", "Material, non-public information."], "ans": "C", "expl": "Huang's distribution of the report is the least likely to violate the Standard related to material, non-public information. According to the CFA Institute's Standards of Professional Conduct, Standard II(A) - Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information. In this scenario, Huang, who works in a different part of the firm from Ngo and is primarily involved in hedge fund management, was not directly involved in the creation or analysis of the research report. Furthermore, there is no indication that Huang was aware of or deliberately used material nonpublic information in distributing the report. The information in the report was collected from public sources and through legitimate research methods, suggesting that the information was not \"non-public.\" A is incorrect. Standard III(B) - Fair Dealing requires that members and candidates deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, or taking investment actions. Huang's selective distribution of the report to only a few key clients before it was fully reviewed and more broadly distributed could be seen as a violation of this standard. This selective distribution could disadvantage other clients who did not receive the information simultaneously, potentially affecting their investment decisions based on the incomplete dissemination of the report. B is incorrect. Standard V(A) - Diligence and Reasonable Basis mandates that members and candidates must have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Huang's decision to distribute the report that was not fully reviewed undermines the diligence and reasonable basis of the report. By distributing an unreviewed report, Huang risked providing information that might not have been thoroughly vetted or might have contained inaccuracies, thus not meeting the standard of having a reasonable and adequate basis for the recommendation. ", "explhtml": "<p>Huang&#x27;s distribution of the report is the least likely to violate the Standard related to material, non-public information. According to the CFA Institute&#x27;s Standards of Professional Conduct, Standard II(A) - Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information. In this scenario, Huang, who works in a different part of the firm from Ngo and is primarily involved in hedge fund management, was not directly involved in the creation or analysis of the research report. Furthermore, there is no indication that Huang was aware of or deliberately used material nonpublic information in distributing the report. The information in the report was collected from public sources and through legitimate research methods, suggesting that the information was not &quot;non-public.&quot;<\/p><p><b>A is incorrect<\/b>. Standard III(B) - Fair Dealing requires that members and candidates deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, or taking investment actions. Huang&#x27;s selective distribution of the report to only a few key clients before it was fully reviewed and more broadly distributed could be seen as a violation of this standard. This selective distribution could disadvantage other clients who did not receive the information simultaneously, potentially affecting their investment decisions based on the incomplete dissemination of the report.<\/p><p><b>B is incorrect<\/b>. Standard V(A) - Diligence and Reasonable Basis mandates that members and candidates must have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. Huang&#x27;s decision to distribute the report that was not fully reviewed undermines the diligence and reasonable basis of the report. By distributing an unreviewed report, Huang risked providing information that might not have been thoroughly vetted or might have contained inaccuracies, thus not meeting the standard of having a reasonable and adequate basis for the recommendation. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Mai Huang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mai Huang, CFA, is a hedge fund manager who works for Eight Sons Investments, a relatively small fund in the island nation of Pacifica that seeks arbitrage trading opportunities. Recently, Huang has reached an agreement with a firm that manages index mutual funds, allowing her to submit after-market trades within half an hour after the markets close. Still, the trade is executed at the day&#x27;s NAV, even though the NAV has not yet been calculated. Huang has also arranged the same treatment for Eight Sons’ retail clients to avoid trading ahead of them. There are no laws in Pacifica against these trades.<\/p><p>Jie Ngo, CFA, is a colleague of Huang’s who works at Eight Sons as a sell-side analyst in a different part of the firm. As Ngo is researching Prime Bank, he collects as much data as possible. His efforts include scrutinizing financial reports, speaking with executives and employees at Prime Bank, and conducting interviews with customers. In the course of his research, Ngo learns the following:<\/p><p>Prime Bank’s net margin has grown 1% yearly for the last six years.<\/p><p>Customers have found it more and more challenging to reach their banker in the past<\/p><p>two years. In some cases, Prime Bank has failed to assign a new banker to a<\/p><p>relationship when an employee leaves the bank.<\/p><p>An investor relations representative mentioned that the bank plans on closing 10<\/p><p>branches in the next 12 months.<\/p><p>On one visit to the bank, Ngo overheard two managers discussing what seemed to be a<\/p><p>possible contract with Pacifica’s government to provide cash debit cards for recipients<\/p><p>of Pacifica’s government assistance payments.<\/p><p>Based on his initial research, Ngo collects more information consistent with the existence of a government contract and models the benefit of the contract to Prime Bank. After collecting adequate information from public sources, Ngo prepares a report with a buy recommendation.<\/p><p>After receiving a copy of Ngo&#x27;s report, Huang meets with several of Eight Sons Investments&#x27; key clients to discuss Prime Bank, but reveals that the report was not thoroughly reviewed and is only being distributed to a select group of clients for consideration. <\/p><p>Elias Hong, CFA, is Ngo’s supervisor. A few days later, Hong finishes reviewing Ngo’s report on Prime Bank and asks his team to prepare the distribution. Clients who fit the right profile to own stock in Prime Bank—about two-thirds of Eight Sons’ clients—will receive the report. Before the report is sent to clients who maintain discretion over their accounts, Eight Sons will buy Prime Bank stock for its non-discretionary client accounts. The firm’s account disclosures outline the enhanced level of service that non-discretionary accounts receive, including advance trading to maximize the value of firm research, and clients are required to acknowledge the disclosure with a signature.<\/p><p>After only a short period, Hong and Ngo each receive notices that CFA<sup>®<\/sup> Institute’s professional conduct staff has initiated an inquiry into their actions.<\/p><\/div><\/details><div class=\"qtext\"><p>Huang’s distribution of the report least likely violates the Standard related to:<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "Hong least likely violates the Standards by:", "opts": ["Failing to supervise.", "Not sending the research report to all of Eight Sons’ clients.", "Trading in non-discretionary accounts before distributing the report to discretionary account holders."], "ans": "B", "expl": "Option B aligns with the principles of the CFA Institute's Code and Standards regarding the dissemination of investment research. The CFA Standards require that investment professionals act in a manner that is consistent with the best interests of their clients. In this scenario, Elias Hong's decision to send the research report only to clients who fit the right profile to own stock in Prime Bank is a strategic and client-focused approach. This targeted distribution ensures that the investment advice provided is suitable and relevant to the recipients' investment profiles and financial goals. By selectively distributing the report, Hong ensures that the information is used effectively and responsibly, avoiding the potential misallocation of resources that might occur if the report were sent to clients for whom the investment is unsuitable. This approach not only respects the individual needs and objectives of each client but also upholds the integrity of the investment advice given. A is incorrect. Elias Hong violates the CFA Institute's Standards of Professional Conduct concerning supervision. As a supervisor, Hong is responsible for overseeing the activities of his subordinates to ensure compliance with applicable regulatory and ethical standards. In this case, Hong's failure to adequately review Jie Ngo's report before its initial distribution and his subsequent decision to allow trading in non-discretionary accounts before distributing the report to discretionary account holders indicate a lack of proper supervision. This oversight could lead to conflicts of interest and unfair treatment of clients, which are contrary to the principles of fairness, transparency, and diligence that the CFA Institute promotes. C is incorrect. Trading in non-discretionary accounts before distributing the research report to discretionary account holders is a violation of the CFA Institute's Standards of Professional Conduct. This action prioritizes the interests of some clients over others, which can lead to potential conflicts of interest and unfair treatment. The Standards require that all professional activities be conducted with fairness and impartiality, ensuring that the actions of the investment professional disadvantage no client. By executing trades for non-discretionary accounts prior to distributing the report, Hong could be seen as giving preferential treatment to certain clients, which undermines the trust and confidence that all clients should expect from their investment advisors. ", "explhtml": "<p>Option B aligns with the principles of the CFA Institute&#x27;s Code and Standards regarding the dissemination of investment research. The CFA Standards require that investment professionals act in a manner that is consistent with the best interests of their clients. In this scenario, Elias Hong&#x27;s decision to send the research report only to clients who fit the right profile to own stock in Prime Bank is a strategic and client-focused approach. This targeted distribution ensures that the investment advice provided is suitable and relevant to the recipients&#x27; investment profiles and financial goals. By selectively distributing the report, Hong ensures that the information is used effectively and responsibly, avoiding the potential misallocation of resources that might occur if the report were sent to clients for whom the investment is unsuitable. This approach not only respects the individual needs and objectives of each client but also upholds the integrity of the investment advice given.<\/p><p><b>A is incorrect<\/b>. Elias Hong violates the CFA Institute&#x27;s Standards of Professional Conduct concerning supervision. As a supervisor, Hong is responsible for overseeing the activities of his subordinates to ensure compliance with applicable regulatory and ethical standards. In this case, Hong&#x27;s failure to adequately review Jie Ngo&#x27;s report before its initial distribution and his subsequent decision to allow trading in non-discretionary accounts before distributing the report to discretionary account holders indicate a lack of proper supervision. This oversight could lead to conflicts of interest and unfair treatment of clients, which are contrary to the principles of fairness, transparency, and diligence that the CFA Institute promotes.<\/p><p><b>C is incorrect<\/b>. Trading in non-discretionary accounts before distributing the research report to discretionary account holders is a violation of the CFA Institute&#x27;s Standards of Professional Conduct. This action prioritizes the interests of some clients over others, which can lead to potential conflicts of interest and unfair treatment. The Standards require that all professional activities be conducted with fairness and impartiality, ensuring that the actions of the investment professional disadvantage no client. By executing trades for non-discretionary accounts prior to distributing the report, Hong could be seen as giving preferential treatment to certain clients, which undermines the trust and confidence that all clients should expect from their investment advisors. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Mai Huang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mai Huang, CFA, is a hedge fund manager who works for Eight Sons Investments, a relatively small fund in the island nation of Pacifica that seeks arbitrage trading opportunities. Recently, Huang has reached an agreement with a firm that manages index mutual funds, allowing her to submit after-market trades within half an hour after the markets close. Still, the trade is executed at the day&#x27;s NAV, even though the NAV has not yet been calculated. Huang has also arranged the same treatment for Eight Sons’ retail clients to avoid trading ahead of them. There are no laws in Pacifica against these trades.<\/p><p>Jie Ngo, CFA, is a colleague of Huang’s who works at Eight Sons as a sell-side analyst in a different part of the firm. As Ngo is researching Prime Bank, he collects as much data as possible. His efforts include scrutinizing financial reports, speaking with executives and employees at Prime Bank, and conducting interviews with customers. In the course of his research, Ngo learns the following:<\/p><p>Prime Bank’s net margin has grown 1% yearly for the last six years.<\/p><p>Customers have found it more and more challenging to reach their banker in the past<\/p><p>two years. In some cases, Prime Bank has failed to assign a new banker to a<\/p><p>relationship when an employee leaves the bank.<\/p><p>An investor relations representative mentioned that the bank plans on closing 10<\/p><p>branches in the next 12 months.<\/p><p>On one visit to the bank, Ngo overheard two managers discussing what seemed to be a<\/p><p>possible contract with Pacifica’s government to provide cash debit cards for recipients<\/p><p>of Pacifica’s government assistance payments.<\/p><p>Based on his initial research, Ngo collects more information consistent with the existence of a government contract and models the benefit of the contract to Prime Bank. After collecting adequate information from public sources, Ngo prepares a report with a buy recommendation.<\/p><p>After receiving a copy of Ngo&#x27;s report, Huang meets with several of Eight Sons Investments&#x27; key clients to discuss Prime Bank, but reveals that the report was not thoroughly reviewed and is only being distributed to a select group of clients for consideration. <\/p><p>Elias Hong, CFA, is Ngo’s supervisor. A few days later, Hong finishes reviewing Ngo’s report on Prime Bank and asks his team to prepare the distribution. Clients who fit the right profile to own stock in Prime Bank—about two-thirds of Eight Sons’ clients—will receive the report. Before the report is sent to clients who maintain discretion over their accounts, Eight Sons will buy Prime Bank stock for its non-discretionary client accounts. The firm’s account disclosures outline the enhanced level of service that non-discretionary accounts receive, including advance trading to maximize the value of firm research, and clients are required to acknowledge the disclosure with a signature.<\/p><p>After only a short period, Hong and Ngo each receive notices that CFA<sup>®<\/sup> Institute’s professional conduct staff has initiated an inquiry into their actions.<\/p><\/div><\/details><div class=\"qtext\"><p>Hong least likely violates the Standards by:<\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "By directing its portfolio managers to increase trading activity, did Peripheral most likely violate the Code and Standards?", "opts": ["No", "Yes, concerning market manipulation", "Yes, by citing the volume in emerging market stocks in its brochure"], "ans": "B", "expl": "Peripheral's directive to its portfolio managers to increase trading activity in emerging market stocks primarily to enhance the perceived liquidity of these stocks constitutes market manipulation. Market manipulation involves actions designed to deceive or mislead investors by artificially affecting the price or volume of securities. By increasing trading volumes artificially, Peripheral aimed to create a false impression of liquidity to attract more investors, which is a deceptive practice and violates Standard II(B) - Market Manipulation of the CFA Institute Code of Ethics and Standards of Professional Conduct. This standard prohibits practices that distort prices or artificially inflate trading volumes to mislead market participants. A is incorrect. The option suggesting that Peripheral did not violate the Code and Standards by directing increased trading activity overlooks the intent behind the directive. The increase in trading was not for legitimate investment reasons but to manipulate perceptions of market liquidity. This artificial inflation of trade volumes can mislead potential and current investors about the true market conditions, which is contrary to maintaining market integrity as required under the CFA Institute Code and Standards. C is incorrect. While citing the volume of trades in emerging market stocks in the brochure does involve the use of trading data, this action in itself does not constitute a violation of the Code and Standards. The critical issue is the intent and the effect of the cited information. In this case, the violation lies in the act of manipulating the trading volume to support the claims made in the brochure, rather than merely citing this data. Therefore, the mere citation of trading volume is not manipulative; rather, it is the artificial inflation of these volumes that breaches the ethical guidelines.", "explhtml": "<p>Peripheral&#x27;s directive to its portfolio managers to increase trading activity in emerging market stocks primarily to enhance the perceived liquidity of these stocks constitutes market manipulation. Market manipulation involves actions designed to deceive or mislead investors by artificially affecting the price or volume of securities. By increasing trading volumes artificially, Peripheral aimed to create a false impression of liquidity to attract more investors, which is a deceptive practice and violates Standard II(B) - Market Manipulation of the CFA Institute Code of Ethics and Standards of Professional Conduct. This standard prohibits practices that distort prices or artificially inflate trading volumes to mislead market participants.<\/p><p><b>A is incorrect<\/b>. The option suggesting that Peripheral did not violate the Code and Standards by directing increased trading activity overlooks the intent behind the directive. The increase in trading was not for legitimate investment reasons but to manipulate perceptions of market liquidity. This artificial inflation of trade volumes can mislead potential and current investors about the true market conditions, which is contrary to maintaining market integrity as required under the CFA Institute Code and Standards.<\/p><p><b>C is incorrect<\/b>. While citing the volume of trades in emerging market stocks in the brochure does involve the use of trading data, this action in itself does not constitute a violation of the Code and Standards. The critical issue is the intent and the effect of the cited information. In this case, the violation lies in the act of manipulating the trading volume to support the claims made in the brochure, rather than merely citing this data. Therefore, the mere citation of trading volume is not manipulative; rather, it is the artificial inflation of these volumes that breaches the ethical guidelines.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Ross Mike<\/summary><div class=\"vig-body\"><p>Ross Mike, CFA, a portfolio manager at Peripheral Capital Management, a long-short fund manager that focuses on emerging market companies, is currently completing a new brochure, hoping that investors will view emerging market stocks as more liquid than they are currently perceived to be. Mike believes that by helping to change investor sentiment, funds managed by Peripheral will draw additional capital. Before the brochure is finalized, the Peripheral management instructs Mike and other portfolio managers to increase the buying and selling of emerging market stocks. As a result, Peripheral cites the volume of emerging market stocks as evidence supporting the claim that they are not illiquid investments.<\/p><p>In addition, Mike is preparing a research report on heavy equipment manufacturers based in South America. In the report, Mike states, “Since heavy equipment manufacturers have seen rapid growth in new equipment orders, I expect that they will be able to convert the increased revenue into significant profit over the next five years.” Mike also writes that there are major risks associated with investing in these companies, especially due to the political instability in some South American countries.<\/p><p>Since Peripheral mainly invests in emerging markets, Mike recently relocated to and became a citizen of Colombia to seek out investments in South America more effectively. Peripheral’s employee trading policies allow for investment in companies where Peripheral does not take a position. Because of this, Mike believes he has found two opportunities for his portfolio that Peripheral has overlooked. The first is a local company, MCP Organics, whose CEO recently met with Mike and relayed information that has yet to be made public. The other, EKE Automation, is an opportunity in neighboring Brazil. Mike was able to take an early look at the company’s production figures before official publication at the end of the quarter. As Colombia’s securities laws do not prohibit trading on non-public information, and Brazil has poorly defined laws regarding non-public information, Mike proceeds with the trades.<\/p><p>In addition to managing its own funds, Peripheral manages a separate fund for a small group of high-net-worth investors. According to the investment policy statement, the strategy for these portfolios is to seek out growth opportunities in international stocks while maintaining proper diversification.. Juan Grace, CFA, the strategy manager, recently met with the investors to review the fund’s performance. At this meeting, the investors asked Grace to place a large trade in a company&#x27;s bonds that they feel are undervalued.<\/p><\/div><\/details><div class=\"qtext\"><p>By directing its portfolio managers to increase trading activity, did Peripheral most likely violate the Code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 14, "q": "Regarding Mike's report on South American heavy equipment manufacturers, does Mike most likely violate the Code and Standards?", "opts": ["No", "Yes, by commenting on the conversion of revenue into significant profits", "Yes, by failing to identify the details of the operations of heavy equipment manufacturers"], "ans": "A", "expl": "Mike's report on South American heavy equipment manufacturers does not violate the CFA Institute's Code and Standards. In his report, Mike clearly distinguishes between factual information and his professional opinion. The fact that he mentions is the rapid growth in new equipment orders, which is a verifiable and objective statement. His opinion, on the other hand, is the expectation that this growth in orders will translate into significant profits over the next five years. This projection is clearly stated as an expectation, which is a standard practice in financial analysis and reporting. By clearly labeling his views as opinions, Mike ensures transparency and avoids misleading the investors. This practice aligns with the CFA Institute's Code and Standards, which require that investment professionals use reasonable care and judgment to achieve and maintain independence and objectivity in their professional activities. B is incorrect. Expressing forward-looking opinions, when clearly identified as such, is a common and acceptable practice in financial analysis. Mike's statement is an opinion based on the observed growth in orders and is presented as a projection, not as a guaranteed outcome. This type of forward-looking statement is typical in industry reports and is valuable to investors making informed decisions. It is crucial, however, that such opinions are clearly identified as projections to maintain transparency and objectivity, which Mike has done. C is incorrect. In the context provided, Mike's focus is on the financial prospects of these companies based on their order growth, rather than a detailed analysis of their operational processes. The CFA Institute's Code and Standards do not require that every aspect of a business be detailed in every report. Instead, the focus should be on providing information that is relevant and material to the investment thesis being presented. Mike's report targets the financial implications of order growth, which is appropriate for the investment analysis he is conducting.", "explhtml": "<p>Mike&#x27;s report on South American heavy equipment manufacturers does not violate the CFA Institute&#x27;s Code and Standards. In his report, Mike clearly distinguishes between factual information and his professional opinion. The fact that he mentions is the rapid growth in new equipment orders, which is a verifiable and objective statement. His opinion, on the other hand, is the expectation that this growth in orders will translate into significant profits over the next five years. This projection is clearly stated as an expectation, which is a standard practice in financial analysis and reporting. By clearly labeling his views as opinions, Mike ensures transparency and avoids misleading the investors. This practice aligns with the CFA Institute&#x27;s Code and Standards, which require that investment professionals use reasonable care and judgment to achieve and maintain independence and objectivity in their professional activities.<\/p><p><b>B is incorrect<\/b>. Expressing forward-looking opinions, when clearly identified as such, is a common and acceptable practice in financial analysis. Mike&#x27;s statement is an opinion based on the observed growth in orders and is presented as a projection, not as a guaranteed outcome. This type of forward-looking statement is typical in industry reports and is valuable to investors making informed decisions. It is crucial, however, that such opinions are clearly identified as projections to maintain transparency and objectivity, which Mike has done.<\/p><p><b>C is incorrect<\/b>. In the context provided, Mike&#x27;s focus is on the financial prospects of these companies based on their order growth, rather than a detailed analysis of their operational processes. The CFA Institute&#x27;s Code and Standards do not require that every aspect of a business be detailed in every report. Instead, the focus should be on providing information that is relevant and material to the investment thesis being presented. Mike&#x27;s report targets the financial implications of order growth, which is appropriate for the investment analysis he is conducting.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Ross Mike<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ross Mike, CFA, a portfolio manager at Peripheral Capital Management, a long-short fund manager that focuses on emerging market companies, is currently completing a new brochure, hoping that investors will view emerging market stocks as more liquid than they are currently perceived to be. Mike believes that by helping to change investor sentiment, funds managed by Peripheral will draw additional capital. Before the brochure is finalized, the Peripheral management instructs Mike and other portfolio managers to increase the buying and selling of emerging market stocks. As a result, Peripheral cites the volume of emerging market stocks as evidence supporting the claim that they are not illiquid investments.<\/p><p>In addition, Mike is preparing a research report on heavy equipment manufacturers based in South America. In the report, Mike states, “Since heavy equipment manufacturers have seen rapid growth in new equipment orders, I expect that they will be able to convert the increased revenue into significant profit over the next five years.” Mike also writes that there are major risks associated with investing in these companies, especially due to the political instability in some South American countries.<\/p><p>Since Peripheral mainly invests in emerging markets, Mike recently relocated to and became a citizen of Colombia to seek out investments in South America more effectively. Peripheral’s employee trading policies allow for investment in companies where Peripheral does not take a position. Because of this, Mike believes he has found two opportunities for his portfolio that Peripheral has overlooked. The first is a local company, MCP Organics, whose CEO recently met with Mike and relayed information that has yet to be made public. The other, EKE Automation, is an opportunity in neighboring Brazil. Mike was able to take an early look at the company’s production figures before official publication at the end of the quarter. As Colombia’s securities laws do not prohibit trading on non-public information, and Brazil has poorly defined laws regarding non-public information, Mike proceeds with the trades.<\/p><p>In addition to managing its own funds, Peripheral manages a separate fund for a small group of high-net-worth investors. According to the investment policy statement, the strategy for these portfolios is to seek out growth opportunities in international stocks while maintaining proper diversification.. Juan Grace, CFA, the strategy manager, recently met with the investors to review the fund’s performance. At this meeting, the investors asked Grace to place a large trade in a company&#x27;s bonds that they feel are undervalued.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Mike&#x27;s report on South American heavy equipment manufacturers, does Mike most likely violate the Code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 15, "q": "By using the information gathered on MCP and EKE to enact trades in both companies, has Mike most likely violated the Code and Standards?", "opts": ["Yes, for both companies", "Yes for MCP, but no for EKE", "No for MCP, but yes for EKE"], "ans": "A", "expl": "Mike, by using the information gathered on MCP and EKE to enact trades in both companies, has indeed violated the Code and Standards. According to the CFA Institute's Code of Ethics and Standards of Professional Conduct, trading on material non-public information is strictly prohibited, regardless of local laws. In Mike's case, he obtained non-public, potentially market-moving information directly from the CEO of MCP Organics and through early access to EKE Automation's production figures. This information is considered material because it can influence an investor's decision to buy or sell the stocks of these companies. By trading on this information before it was made public, Mike engaged in insider trading, which is a clear violation of the CFA Institute's standards. This violation undermines the integrity of the financial markets and the trust that investors place in them. B is incorrect. The nature of the information Mike possessed for both companies was materially similar—both pieces of information were non-public and could influence the market. The fact that Colombia and Brazil have lax or poorly defined laws regarding non-public information does not exempt Mike from adhering to the higher ethical standards set forth by the CFA Institute. As a CFA Charterholder, Mike is required to uphold these standards, which are designed to maintain market integrity and protect investor interests globally, irrespective of local regulations. C is incorrect. Both scenarios involve Mike acting on non-public information, which is a clear breach of the CFA Institute's standards. The ethical breach does not differ between the two cases; in both instances, Mike used privileged information that was not available to the public to gain an unfair market advantage. This action is in direct violation of the ethical guidelines that demand fairness and honesty, which are crucial to maintaining public confidence in the financial markets.", "explhtml": "<p>Mike, by using the information gathered on MCP and EKE to enact trades in both companies, has indeed violated the Code and Standards. According to the CFA Institute&#x27;s Code of Ethics and Standards of Professional Conduct, trading on material non-public information is strictly prohibited, regardless of local laws. In Mike&#x27;s case, he obtained non-public, potentially market-moving information directly from the CEO of MCP Organics and through early access to EKE Automation&#x27;s production figures. This information is considered material because it can influence an investor&#x27;s decision to buy or sell the stocks of these companies. By trading on this information before it was made public, Mike engaged in insider trading, which is a clear violation of the CFA Institute&#x27;s standards. This violation undermines the integrity of the financial markets and the trust that investors place in them.<\/p><p><b>B is incorrect<\/b>. The nature of the information Mike possessed for both companies was materially similar—both pieces of information were non-public and could influence the market. The fact that Colombia and Brazil have lax or poorly defined laws regarding non-public information does not exempt Mike from adhering to the higher ethical standards set forth by the CFA Institute. As a CFA Charterholder, Mike is required to uphold these standards, which are designed to maintain market integrity and protect investor interests globally, irrespective of local regulations.<\/p><p><b>C is incorrect<\/b>. Both scenarios involve Mike acting on non-public information, which is a clear breach of the CFA Institute&#x27;s standards. The ethical breach does not differ between the two cases; in both instances, Mike used privileged information that was not available to the public to gain an unfair market advantage. This action is in direct violation of the ethical guidelines that demand fairness and honesty, which are crucial to maintaining public confidence in the financial markets.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Ross Mike<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ross Mike, CFA, a portfolio manager at Peripheral Capital Management, a long-short fund manager that focuses on emerging market companies, is currently completing a new brochure, hoping that investors will view emerging market stocks as more liquid than they are currently perceived to be. Mike believes that by helping to change investor sentiment, funds managed by Peripheral will draw additional capital. Before the brochure is finalized, the Peripheral management instructs Mike and other portfolio managers to increase the buying and selling of emerging market stocks. As a result, Peripheral cites the volume of emerging market stocks as evidence supporting the claim that they are not illiquid investments.<\/p><p>In addition, Mike is preparing a research report on heavy equipment manufacturers based in South America. In the report, Mike states, “Since heavy equipment manufacturers have seen rapid growth in new equipment orders, I expect that they will be able to convert the increased revenue into significant profit over the next five years.” Mike also writes that there are major risks associated with investing in these companies, especially due to the political instability in some South American countries.<\/p><p>Since Peripheral mainly invests in emerging markets, Mike recently relocated to and became a citizen of Colombia to seek out investments in South America more effectively. Peripheral’s employee trading policies allow for investment in companies where Peripheral does not take a position. Because of this, Mike believes he has found two opportunities for his portfolio that Peripheral has overlooked. The first is a local company, MCP Organics, whose CEO recently met with Mike and relayed information that has yet to be made public. The other, EKE Automation, is an opportunity in neighboring Brazil. Mike was able to take an early look at the company’s production figures before official publication at the end of the quarter. As Colombia’s securities laws do not prohibit trading on non-public information, and Brazil has poorly defined laws regarding non-public information, Mike proceeds with the trades.<\/p><p>In addition to managing its own funds, Peripheral manages a separate fund for a small group of high-net-worth investors. According to the investment policy statement, the strategy for these portfolios is to seek out growth opportunities in international stocks while maintaining proper diversification.. Juan Grace, CFA, the strategy manager, recently met with the investors to review the fund’s performance. At this meeting, the investors asked Grace to place a large trade in a company&#x27;s bonds that they feel are undervalued.<\/p><\/div><\/details><div class=\"qtext\"><p>By using the information gathered on MCP and EKE to enact trades in both companies, has Mike most likely violated the Code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 16, "q": "Regarding the purchase of the potentially undervalued bonds, to comply with the Code and Standards, Grace is most likely required to:", "opts": ["Purchase the bonds after the meeting as requested.", "Tell the investors that the investment policy statement prohibits the bond purchase.", "Ask for a written statement of consent signed by all investors before purchasing the bonds."], "ans": "B", "expl": "It aligns with the requirement to adhere strictly to the investment policy statement (IPS) that governs the management of the fund. The IPS serves as a fundamental guideline for all investment decisions made on behalf of the fund's clients. It specifies the types of investments that are permissible and the strategies that can be employed. If the IPS explicitly prohibits the purchase of the bonds, as suggested in option B, then Grace must communicate this to the investors and refrain from making the purchase. This adherence ensures that the fund's actions remain transparent, consistent, and within the legal and ethical boundaries set forth by the IPS, thereby protecting the interests of the investors and maintaining the integrity of the fund management process. A is incorrect because purchasing the bonds immediately after the meeting without verifying whether such an action complies with the IPS could lead to a breach of the ethical and professional standards expected of a CFA Charterholder. The CFA Institute's Code of Ethics and Standards of Professional Conduct require that investment professionals act with diligence, respect, and in accordance with the legal documents governing their professional activities. Making an investment that contradicts the IPS would not only undermine investor trust but also expose the fund to legal and reputational risks. C is incorrect because obtaining a written statement of consent from all investors does not override the stipulations of the IPS. While investor consent is important, it cannot legitimize an action that is fundamentally at odds with the IPS. The primary purpose of the IPS is to outline a clear and unambiguous investment strategy that is to be followed regardless of individual investor requests or preferences. This ensures that the fund is managed consistently and in a manner that aligns with the agreed-upon objectives and risk parameters, thereby safeguarding the collective interests of all investors.", "explhtml": "<p>It aligns with the requirement to adhere strictly to the investment policy statement (IPS) that governs the management of the fund. The IPS serves as a fundamental guideline for all investment decisions made on behalf of the fund&#x27;s clients. It specifies the types of investments that are permissible and the strategies that can be employed. If the IPS explicitly prohibits the purchase of the bonds, as suggested in option B, then Grace must communicate this to the investors and refrain from making the purchase. This adherence ensures that the fund&#x27;s actions remain transparent, consistent, and within the legal and ethical boundaries set forth by the IPS, thereby protecting the interests of the investors and maintaining the integrity of the fund management process.<\/p><p><b>A is incorrect<\/b> because purchasing the bonds immediately after the meeting without verifying whether such an action complies with the IPS could lead to a breach of the ethical and professional standards expected of a CFA Charterholder. The CFA Institute&#x27;s Code of Ethics and Standards of Professional Conduct require that investment professionals act with diligence, respect, and in accordance with the legal documents governing their professional activities. Making an investment that contradicts the IPS would not only undermine investor trust but also expose the fund to legal and reputational risks.<\/p><p><b>C is incorrect<\/b> because obtaining a written statement of consent from all investors does not override the stipulations of the IPS. While investor consent is important, it cannot legitimize an action that is fundamentally at odds with the IPS. The primary purpose of the IPS is to outline a clear and unambiguous investment strategy that is to be followed regardless of individual investor requests or preferences. This ensures that the fund is managed consistently and in a manner that aligns with the agreed-upon objectives and risk parameters, thereby safeguarding the collective interests of all investors.<\/p><p class=\"los\">Study Session 17, Learning Module 48: Guidance for Standards I-VII, LOS 48(b): Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Ross Mike<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ross Mike, CFA, a portfolio manager at Peripheral Capital Management, a long-short fund manager that focuses on emerging market companies, is currently completing a new brochure, hoping that investors will view emerging market stocks as more liquid than they are currently perceived to be. Mike believes that by helping to change investor sentiment, funds managed by Peripheral will draw additional capital. Before the brochure is finalized, the Peripheral management instructs Mike and other portfolio managers to increase the buying and selling of emerging market stocks. As a result, Peripheral cites the volume of emerging market stocks as evidence supporting the claim that they are not illiquid investments.<\/p><p>In addition, Mike is preparing a research report on heavy equipment manufacturers based in South America. In the report, Mike states, “Since heavy equipment manufacturers have seen rapid growth in new equipment orders, I expect that they will be able to convert the increased revenue into significant profit over the next five years.” Mike also writes that there are major risks associated with investing in these companies, especially due to the political instability in some South American countries.<\/p><p>Since Peripheral mainly invests in emerging markets, Mike recently relocated to and became a citizen of Colombia to seek out investments in South America more effectively. Peripheral’s employee trading policies allow for investment in companies where Peripheral does not take a position. Because of this, Mike believes he has found two opportunities for his portfolio that Peripheral has overlooked. The first is a local company, MCP Organics, whose CEO recently met with Mike and relayed information that has yet to be made public. The other, EKE Automation, is an opportunity in neighboring Brazil. Mike was able to take an early look at the company’s production figures before official publication at the end of the quarter. As Colombia’s securities laws do not prohibit trading on non-public information, and Brazil has poorly defined laws regarding non-public information, Mike proceeds with the trades.<\/p><p>In addition to managing its own funds, Peripheral manages a separate fund for a small group of high-net-worth investors. According to the investment policy statement, the strategy for these portfolios is to seek out growth opportunities in international stocks while maintaining proper diversification.. Juan Grace, CFA, the strategy manager, recently met with the investors to review the fund’s performance. At this meeting, the investors asked Grace to place a large trade in a company&#x27;s bonds that they feel are undervalued.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the purchase of the potentially undervalued bonds, to comply with the Code and Standards, Grace is most likely required to:<\/p><\/div>", "subj": "ethics"}, {"n": 17, "q": "Which of the following best describes a violation of CFA® Institute Code and Standards involving Wong’s loyalty to her employer?", "opts": ["Seeking alternative employment", "Talking about Island Bank’s lack of internal controls", "Saving research to a hard drive for use at Liang Brothers"], "ans": "C", "expl": "Option C involves a clear violation of the CFA Institute Code and Standards concerning duties to employers. According to the CFA Institute's Standards of Professional Conduct, employees must not take records or data that belong to their employer without permission, as these are considered proprietary information. In Wong's case, saving financial models and investment research developed during her tenure at Island Bank to a portable hard drive for future use at Liang Brothers constitutes misappropriation of company property. This action breaches the duty of loyalty to her employer. By taking valuable intellectual property, Wong not only deprives Island Bank of resources they invested in but also gives a competitive advantage to her new employer, Liang Brothers. Such behavior undermines the trust and integrity expected in professional conduct, as it involves the unauthorized use of an employer’s proprietary information for personal gain or the benefit of a third party. This violation can result in significant legal and professional consequences, highlighting the importance of adhering to ethical standards set forth by the CFA Institute. A is incorrect. Seeking alternative employment is not in itself a violation of the CFA Institute Code and Standards, provided that the search does not interfere with the employee's current duties and responsibilities. In Wong's scenario, there is no indication that her job performance at Island Bank suffered while she was considering employment at Liang Brothers. Furthermore, the CFA Standards allow professionals to seek other job opportunities as long as they continue to fulfill their current job responsibilities diligently and do not use resources or time at their current job to facilitate their job search beyond what is permitted by the employer. B is incorrect. Discussing concerns about a company's internal controls, especially when those concerns relate to potential violations of laws or regulations, does not constitute disloyalty or a breach of duty to the employer. In fact, addressing such issues is in line with the CFA Institute's encouragement of transparency and adherence to legal standards. Wong's expression of concern regarding the lack of internal controls at Island Bank, especially in the context of a professional meeting with a peer, can be seen as a responsible action aimed at understanding best practices and seeking solutions to improve her current firm's compliance and ethical standing. ", "explhtml": "<p>Option C involves a clear violation of the CFA Institute Code and Standards concerning duties to employers. According to the CFA Institute&#x27;s Standards of Professional Conduct, employees must not take records or data that belong to their employer without permission, as these are considered proprietary information. In Wong&#x27;s case, saving financial models and investment research developed during her tenure at Island Bank to a portable hard drive for future use at Liang Brothers constitutes misappropriation of company property. This action breaches the duty of loyalty to her employer. By taking valuable intellectual property, Wong not only deprives Island Bank of resources they invested in but also gives a competitive advantage to her new employer, Liang Brothers. Such behavior undermines the trust and integrity expected in professional conduct, as it involves the unauthorized use of an employer’s proprietary information for personal gain or the benefit of a third party. This violation can result in significant legal and professional consequences, highlighting the importance of adhering to ethical standards set forth by the CFA Institute.<\/p><p><b>A is incorrect<\/b>. Seeking alternative employment is not in itself a violation of the CFA Institute Code and Standards, provided that the search does not interfere with the employee&#x27;s current duties and responsibilities. In Wong&#x27;s scenario, there is no indication that her job performance at Island Bank suffered while she was considering employment at Liang Brothers. Furthermore, the CFA Standards allow professionals to seek other job opportunities as long as they continue to fulfill their current job responsibilities diligently and do not use resources or time at their current job to facilitate their job search beyond what is permitted by the employer.<\/p><p><b>B is incorrect<\/b>. Discussing concerns about a company&#x27;s internal controls, especially when those concerns relate to potential violations of laws or regulations, does not constitute disloyalty or a breach of duty to the employer. In fact, addressing such issues is in line with the CFA Institute&#x27;s encouragement of transparency and adherence to legal standards. Wong&#x27;s expression of concern regarding the lack of inte
