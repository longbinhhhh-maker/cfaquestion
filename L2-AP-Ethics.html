rnal controls at Island Bank, especially in the context of a professional meeting with a peer, can be seen as a responsible action aimed at understanding best practices and seeking solutions to improve her current firm&#x27;s compliance and ethical standing. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Yan Wong<\/summary><div class=\"vig-body\"><p>Yan Wong, CFA, is a senior research analyst specializing in medical-device manufacturing companies for Island Bank, one of the largest investment banking and wealth-management firms in Hong Kong. Wong has been with the firm for more than 10 years. She joined the company as a junior analyst and has worked her way up to her current role. She provides insightful investment ideas and recommendations to the firm’s sales force, traders, and institutional investors.<\/p><p>While Island Bank has been good for Wong’s personal and professional development, she has grown concerned lately about deteriorating professional standards at the firm, especially since a new manager was put in place after the firm merged with a competitor last year. Specifically, Wong is concerned about several reprimands the Island’s management received last month due to violations of security laws intended to separate a firm’s investment banking and research businesses. The incident arose during a company&#x27;s secondary stock offering in the consumer products division. Wong is concerned that the incident may harm the firm’s reputation, and hers by association. She is also concerned that a lack of internal controls at her company may lead to far worse infractions. Wong’s manager has suggested that she raise the rating on one of the companies she follows, implying that it would help the investment banking division’s relationships.<\/p><p>At a recent meeting of the Hong Kong Society of Financial Analysts, Wong shares her concerns with Bo Ma, the head of research at Liang Brothers, a direct competitor of Island Bank. Ma knows Wong and her work and offers Wong the opportunity to visit Liang Brothers and consider moving. The next week, Wong spends a full day at Liang Brothers, and she likes what she sees. She thinks the firm is highly ethical and has good internal controls. She knows some of the analysts who work there and thinks she would fit in well. In addition, Wong is convinced that her financial opportunities would be greater at Liang Brothers, especially if she is able to resume coverage of all of the companies she now covers and direct more business to Liang Brothers’ investment banking arm. She accepts an offer of employment but says she will not be able to start for a month to allow her time to finish at Island Bank. She also needs to finish the second stage of a three-part independent consulting project for a local mutual fund company.<\/p><p>To prepare for her move to Liang Brothers, Wong begins to save material at her current job that will be extremely helpful for resuming coverage of her companies at her new job. She saves all of the financial models and investment research she has prepared for the companies in her universe to a portable hard drive. She also researched several companies she had studied, but never added to her coverage universe at Island Bank because the head of research did not approve them. During her time at Island Bank, Wong has established an expansive professional network and has cultivated good rapport with a host of contacts. At a cocktail reception during a medical-device industry conference, Wong shares the news of her career change with several of the contacts but asks them not to spread the word until she officially notifies her employer. She tells them that the investment banking services at Liang Brothers are second to none and that things at Island Bank are going downhill fast, so it is a good thing their companies completed their investment banking deals at Island Bank last year.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes a violation of CFA<sup>®<\/sup> Institute Code and Standards involving Wong’s loyalty to her employer?<\/p><\/div>", "subj": "ethics"}, {"n": 18, "q": "Research on the companies that Wong has studied but does not officially follow would most likely:", "opts": ["Be used by Wong’s replacement.", "Not be considered property of Island Bank.", "Require written approval for Wong to copy and take with her."], "ans": "C", "expl": "This scenario aligns with professional standards and ethical guidelines governing the handling of proprietary information. According to these guidelines, any research or material developed by an employee during their tenure at a company is considered the intellectual property of that company. Therefore, if Wong wishes to take any research material with her to a new employer, she must obtain explicit written approval from her current employer, Island Bank. This requirement is in place to protect the proprietary information and interests of the employer, ensuring that sensitive or valuable information does not unjustly benefit a competitor. In Wong's case, taking the research without such approval could be seen as a breach of her duty to her employer and could potentially lead to legal consequences. A is incorrect. The research Wong conducted at Island Bank, regardless of whether she officially followed the company's instructions or not, remains the property of Island Bank. When an employee conducts research as part of their job duties, that research is typically considered a work product owned by the employer. This means that Wong's replacement, or any other authorized personnel at Island Bank, would have the right to use this research. It is a common practice in many industries, particularly in fields that involve intellectual and analytical work, to retain and utilize employee-generated work even after the employee has left the company. B is incorrect. It is incorrect to assume that the research on companies Wong studied but did not officially follow would not be considered property of Island Bank. In the context of employment, especially in research and analytical roles, any studies, reports, or data generated by an employee using the company's resources or during the employment period are legally owned by the company. This includes all documents, notes, data, and analyses created by Wong during her tenure at Island Bank. The fact that she did not officially add these companies to her coverage does not change the ownership status of the research. Therefore, this research is considered proprietary information of Island Bank, and Wong would need permission to use or take this information with her to a new employer. ", "explhtml": "<p>This scenario aligns with professional standards and ethical guidelines governing the handling of proprietary information. According to these guidelines, any research or material developed by an employee during their tenure at a company is considered the intellectual property of that company. Therefore, if Wong wishes to take any research material with her to a new employer, she must obtain explicit written approval from her current employer, Island Bank. This requirement is in place to protect the proprietary information and interests of the employer, ensuring that sensitive or valuable information does not unjustly benefit a competitor. In Wong&#x27;s case, taking the research without such approval could be seen as a breach of her duty to her employer and could potentially lead to legal consequences.<\/p><p><b>A is incorrect<\/b>. The research Wong conducted at Island Bank, regardless of whether she officially followed the company&#x27;s instructions or not, remains the property of Island Bank. When an employee conducts research as part of their job duties, that research is typically considered a work product owned by the employer. This means that Wong&#x27;s replacement, or any other authorized personnel at Island Bank, would have the right to use this research. It is a common practice in many industries, particularly in fields that involve intellectual and analytical work, to retain and utilize employee-generated work even after the employee has left the company.<\/p><p><b>B is incorrect<\/b>. It is incorrect to assume that the research on companies Wong studied but did not officially follow would not be considered property of Island Bank. In the context of employment, especially in research and analytical roles, any studies, reports, or data generated by an employee using the company&#x27;s resources or during the employment period are legally owned by the company. This includes all documents, notes, data, and analyses created by Wong during her tenure at Island Bank. The fact that she did not officially add these companies to her coverage does not change the ownership status of the research. Therefore, this research is considered proprietary information of Island Bank, and Wong would need permission to use or take this information with her to a new employer. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Yan Wong<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yan Wong, CFA, is a senior research analyst specializing in medical-device manufacturing companies for Island Bank, one of the largest investment banking and wealth-management firms in Hong Kong. Wong has been with the firm for more than 10 years. She joined the company as a junior analyst and has worked her way up to her current role. She provides insightful investment ideas and recommendations to the firm’s sales force, traders, and institutional investors.<\/p><p>While Island Bank has been good for Wong’s personal and professional development, she has grown concerned lately about deteriorating professional standards at the firm, especially since a new manager was put in place after the firm merged with a competitor last year. Specifically, Wong is concerned about several reprimands the Island’s management received last month due to violations of security laws intended to separate a firm’s investment banking and research businesses. The incident arose during a company&#x27;s secondary stock offering in the consumer products division. Wong is concerned that the incident may harm the firm’s reputation, and hers by association. She is also concerned that a lack of internal controls at her company may lead to far worse infractions. Wong’s manager has suggested that she raise the rating on one of the companies she follows, implying that it would help the investment banking division’s relationships.<\/p><p>At a recent meeting of the Hong Kong Society of Financial Analysts, Wong shares her concerns with Bo Ma, the head of research at Liang Brothers, a direct competitor of Island Bank. Ma knows Wong and her work and offers Wong the opportunity to visit Liang Brothers and consider moving. The next week, Wong spends a full day at Liang Brothers, and she likes what she sees. She thinks the firm is highly ethical and has good internal controls. She knows some of the analysts who work there and thinks she would fit in well. In addition, Wong is convinced that her financial opportunities would be greater at Liang Brothers, especially if she is able to resume coverage of all of the companies she now covers and direct more business to Liang Brothers’ investment banking arm. She accepts an offer of employment but says she will not be able to start for a month to allow her time to finish at Island Bank. She also needs to finish the second stage of a three-part independent consulting project for a local mutual fund company.<\/p><p>To prepare for her move to Liang Brothers, Wong begins to save material at her current job that will be extremely helpful for resuming coverage of her companies at her new job. She saves all of the financial models and investment research she has prepared for the companies in her universe to a portable hard drive. She also researched several companies she had studied, but never added to her coverage universe at Island Bank because the head of research did not approve them. During her time at Island Bank, Wong has established an expansive professional network and has cultivated good rapport with a host of contacts. At a cocktail reception during a medical-device industry conference, Wong shares the news of her career change with several of the contacts but asks them not to spread the word until she officially notifies her employer. She tells them that the investment banking services at Liang Brothers are second to none and that things at Island Bank are going downhill fast, so it is a good thing their companies completed their investment banking deals at Island Bank last year.<\/p><\/div><\/details><div class=\"qtext\"><p>Research on the companies that Wong has studied but does not officially follow would most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 19, "q": "Wong’s independent consulting for a mutual fund company most likely:", "opts": ["Does not need to be disclosed to Liang Brothers.", "Has the potential to create a conflict of interest for Wong.", "Is a not violation of her duty to disclose additional compensation arrangements."], "ans": "B", "expl": "Under Standard IV(B): Duties to Employers—Disclosure of Additional Compensation Arrangements, CFA® Institute members and candidates are required to disclose any arrangements that could potentially conflict with their employer's interests. Wong's independent consulting for a mutual fund company, while not directly related to her duties at Island Bank or Liang Brothers, could still influence her professional judgment or actions, particularly if the mutual fund company is a client or potential client of either bank. The consulting could also affect her availability or focus, which are critical to her primary employer. Therefore, this consulting work has the potential to create a conflict of interest, necessitating disclosure to her current and future employers to ensure transparency and maintain trust. A is incorrect. The statement that Wong's consulting work does not need to be disclosed to Liang Brothers overlooks the importance of transparency in professional relationships. According to the CFA Institute's Standards of Professional Conduct, it is essential for members to disclose any additional compensation arrangements to their employers. This disclosure helps manage any potential conflicts of interest and ensures that the employer is aware of the employee's external commitments. Failing to disclose such information could lead to a breach of trust and potentially harm the professional relationship. C is incorrect. The statement that Wong's consulting work is not a violation of her duty to disclose additional compensation arrangements is misleading. The CFA Institute's Standards explicitly require the disclosure of any additional compensation that might compete with an employer's interest or that could reasonably be expected to create a conflict of interest. By not disclosing her consulting role, Wong would be withholding important information that could impact her employment and professional duties at both Island Bank and Liang Brothers. This lack of disclosure could be viewed as a violation of her ethical obligations under the CFA Standards. ", "explhtml": "<p>Under Standard IV(B): Duties to Employers—Disclosure of Additional Compensation Arrangements, CFA® Institute members and candidates are required to disclose any arrangements that could potentially conflict with their employer&#x27;s interests. Wong&#x27;s independent consulting for a mutual fund company, while not directly related to her duties at Island Bank or Liang Brothers, could still influence her professional judgment or actions, particularly if the mutual fund company is a client or potential client of either bank. The consulting could also affect her availability or focus, which are critical to her primary employer. Therefore, this consulting work has the potential to create a conflict of interest, necessitating disclosure to her current and future employers to ensure transparency and maintain trust.<\/p><p><b>A is incorrect<\/b>. The statement that Wong&#x27;s consulting work does not need to be disclosed to Liang Brothers overlooks the importance of transparency in professional relationships. According to the CFA Institute&#x27;s Standards of Professional Conduct, it is essential for members to disclose any additional compensation arrangements to their employers. This disclosure helps manage any potential conflicts of interest and ensures that the employer is aware of the employee&#x27;s external commitments. Failing to disclose such information could lead to a breach of trust and potentially harm the professional relationship.<\/p><p><b>C is incorrect<\/b>. The statement that Wong&#x27;s consulting work is not a violation of her duty to disclose additional compensation arrangements is misleading. The CFA Institute&#x27;s Standards explicitly require the disclosure of any additional compensation that might compete with an employer&#x27;s interest or that could reasonably be expected to create a conflict of interest. By not disclosing her consulting role, Wong would be withholding important information that could impact her employment and professional duties at both Island Bank and Liang Brothers. This lack of disclosure could be viewed as a violation of her ethical obligations under the CFA Standards. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Yan Wong<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yan Wong, CFA, is a senior research analyst specializing in medical-device manufacturing companies for Island Bank, one of the largest investment banking and wealth-management firms in Hong Kong. Wong has been with the firm for more than 10 years. She joined the company as a junior analyst and has worked her way up to her current role. She provides insightful investment ideas and recommendations to the firm’s sales force, traders, and institutional investors.<\/p><p>While Island Bank has been good for Wong’s personal and professional development, she has grown concerned lately about deteriorating professional standards at the firm, especially since a new manager was put in place after the firm merged with a competitor last year. Specifically, Wong is concerned about several reprimands the Island’s management received last month due to violations of security laws intended to separate a firm’s investment banking and research businesses. The incident arose during a company&#x27;s secondary stock offering in the consumer products division. Wong is concerned that the incident may harm the firm’s reputation, and hers by association. She is also concerned that a lack of internal controls at her company may lead to far worse infractions. Wong’s manager has suggested that she raise the rating on one of the companies she follows, implying that it would help the investment banking division’s relationships.<\/p><p>At a recent meeting of the Hong Kong Society of Financial Analysts, Wong shares her concerns with Bo Ma, the head of research at Liang Brothers, a direct competitor of Island Bank. Ma knows Wong and her work and offers Wong the opportunity to visit Liang Brothers and consider moving. The next week, Wong spends a full day at Liang Brothers, and she likes what she sees. She thinks the firm is highly ethical and has good internal controls. She knows some of the analysts who work there and thinks she would fit in well. In addition, Wong is convinced that her financial opportunities would be greater at Liang Brothers, especially if she is able to resume coverage of all of the companies she now covers and direct more business to Liang Brothers’ investment banking arm. She accepts an offer of employment but says she will not be able to start for a month to allow her time to finish at Island Bank. She also needs to finish the second stage of a three-part independent consulting project for a local mutual fund company.<\/p><p>To prepare for her move to Liang Brothers, Wong begins to save material at her current job that will be extremely helpful for resuming coverage of her companies at her new job. She saves all of the financial models and investment research she has prepared for the companies in her universe to a portable hard drive. She also researched several companies she had studied, but never added to her coverage universe at Island Bank because the head of research did not approve them. During her time at Island Bank, Wong has established an expansive professional network and has cultivated good rapport with a host of contacts. At a cocktail reception during a medical-device industry conference, Wong shares the news of her career change with several of the contacts but asks them not to spread the word until she officially notifies her employer. She tells them that the investment banking services at Liang Brothers are second to none and that things at Island Bank are going downhill fast, so it is a good thing their companies completed their investment banking deals at Island Bank last year.<\/p><\/div><\/details><div class=\"qtext\"><p>Wong’s independent consulting for a mutual fund company most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 20, "q": "Wong’s comments to some of her clients at the medical-device industry conference most likely:", "opts": ["Were a clear violation of her duties to Island Bank.", "Do not violate CFA Standards, as they were made in a social context.", "Do not violate CFA Standards because the contacts are with companies that are not active investment banking clients of Island Bank."], "ans": "A", "expl": "Yan Wong's actions at the medical-device industry conference represent a clear violation of her duties to Island Bank. By discussing her impending move to Liang Brothers and suggesting that the investment banking services at her new employer are superior, Wong is effectively soliciting business for Liang Brothers while still employed by Island Bank. This behavior undermines the interests of her current employer and breaches her duty of loyalty. According to the CFA Institute's Standards of Professional Conduct, an employee must act for the benefit of their employer and not disclose or use any confidential information that could harm the employer's business interests. Wong's premature solicitation of clients and sharing of her negative views about Island Bank could potentially divert business away from Island Bank to Liang Brothers, thereby harming Island Bank's business relationships and reputation. B is incorrect. The context in which Wong made her comments does not exempt her from adhering to the CFA Standards. Even though the statements were made in a social setting at a conference, they pertain directly to her professional relationships and her employer's business interests. The CFA Standards require members to refrain from any actions that could harm their employer, regardless of the social or informal nature of the context in which those actions occur. By promoting her future employer and denigrating her current one, Wong compromised her professional integrity and loyalty to Island Bank. C is incorrect. The fact that the contacts are with companies that are not active investment banking clients of Island Bank does not mitigate the violation of CFA Standards. Wong's duty to act in the best interest of her employer extends to all professional activities and communications, regardless of the current status of the business relationships involved. By indicating a preference for her future employer and suggesting a decline in her current employer's service quality, Wong is potentially damaging Island Bank's reputation and business prospects, which is contrary to the principles upheld by the CFA Standards of loyalty, prudence, and care. ", "explhtml": "<p>Yan Wong&#x27;s actions at the medical-device industry conference represent a clear violation of her duties to Island Bank. By discussing her impending move to Liang Brothers and suggesting that the investment banking services at her new employer are superior, Wong is effectively soliciting business for Liang Brothers while still employed by Island Bank. This behavior undermines the interests of her current employer and breaches her duty of loyalty. According to the CFA Institute&#x27;s Standards of Professional Conduct, an employee must act for the benefit of their employer and not disclose or use any confidential information that could harm the employer&#x27;s business interests. Wong&#x27;s premature solicitation of clients and sharing of her negative views about Island Bank could potentially divert business away from Island Bank to Liang Brothers, thereby harming Island Bank&#x27;s business relationships and reputation.<\/p><p><b>B is incorrect<\/b>. The context in which Wong made her comments does not exempt her from adhering to the CFA Standards. Even though the statements were made in a social setting at a conference, they pertain directly to her professional relationships and her employer&#x27;s business interests. The CFA Standards require members to refrain from any actions that could harm their employer, regardless of the social or informal nature of the context in which those actions occur. By promoting her future employer and denigrating her current one, Wong compromised her professional integrity and loyalty to Island Bank.<\/p><p><b>C is incorrect<\/b>. The fact that the contacts are with companies that are not active investment banking clients of Island Bank does not mitigate the violation of CFA Standards. Wong&#x27;s duty to act in the best interest of her employer extends to all professional activities and communications, regardless of the current status of the business relationships involved. By indicating a preference for her future employer and suggesting a decline in her current employer&#x27;s service quality, Wong is potentially damaging Island Bank&#x27;s reputation and business prospects, which is contrary to the principles upheld by the CFA Standards of loyalty, prudence, and care. <\/p><p class=\"los\">Ethics, Learning Module 2: Application of the Code and Standards, LOS 2 (a): Evaluate policies and practices for a firm and an individual in relation to the CFA Institute Code of Ethics and Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Yan Wong<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yan Wong, CFA, is a senior research analyst specializing in medical-device manufacturing companies for Island Bank, one of the largest investment banking and wealth-management firms in Hong Kong. Wong has been with the firm for more than 10 years. She joined the company as a junior analyst and has worked her way up to her current role. She provides insightful investment ideas and recommendations to the firm’s sales force, traders, and institutional investors.<\/p><p>While Island Bank has been good for Wong’s personal and professional development, she has grown concerned lately about deteriorating professional standards at the firm, especially since a new manager was put in place after the firm merged with a competitor last year. Specifically, Wong is concerned about several reprimands the Island’s management received last month due to violations of security laws intended to separate a firm’s investment banking and research businesses. The incident arose during a company&#x27;s secondary stock offering in the consumer products division. Wong is concerned that the incident may harm the firm’s reputation, and hers by association. She is also concerned that a lack of internal controls at her company may lead to far worse infractions. Wong’s manager has suggested that she raise the rating on one of the companies she follows, implying that it would help the investment banking division’s relationships.<\/p><p>At a recent meeting of the Hong Kong Society of Financial Analysts, Wong shares her concerns with Bo Ma, the head of research at Liang Brothers, a direct competitor of Island Bank. Ma knows Wong and her work and offers Wong the opportunity to visit Liang Brothers and consider moving. The next week, Wong spends a full day at Liang Brothers, and she likes what she sees. She thinks the firm is highly ethical and has good internal controls. She knows some of the analysts who work there and thinks she would fit in well. In addition, Wong is convinced that her financial opportunities would be greater at Liang Brothers, especially if she is able to resume coverage of all of the companies she now covers and direct more business to Liang Brothers’ investment banking arm. She accepts an offer of employment but says she will not be able to start for a month to allow her time to finish at Island Bank. She also needs to finish the second stage of a three-part independent consulting project for a local mutual fund company.<\/p><p>To prepare for her move to Liang Brothers, Wong begins to save material at her current job that will be extremely helpful for resuming coverage of her companies at her new job. She saves all of the financial models and investment research she has prepared for the companies in her universe to a portable hard drive. She also researched several companies she had studied, but never added to her coverage universe at Island Bank because the head of research did not approve them. During her time at Island Bank, Wong has established an expansive professional network and has cultivated good rapport with a host of contacts. At a cocktail reception during a medical-device industry conference, Wong shares the news of her career change with several of the contacts but asks them not to spread the word until she officially notifies her employer. She tells them that the investment banking services at Liang Brothers are second to none and that things at Island Bank are going downhill fast, so it is a good thing their companies completed their investment banking deals at Island Bank last year.<\/p><\/div><\/details><div class=\"qtext\"><p>Wong’s comments to some of her clients at the medical-device industry conference most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 21, "q": "Is Garcia’s decision to create positions in Nerdcoin for his biggest clients most likely in violation of the code and Standards?", "opts": ["No; because Nerdcoin requires a substantial capital investment which his smaller clients may not afford", "Yes; because it puts less wealthy clients at a disadvantage", "No; because he goes ahead to issue yet another recommendation for less wealthy clients"], "ans": "B", "expl": "Garcia's decision to recommend Nerdcoin exclusively to his biggest clients likely violates Standard III(B): Fair Dealing of the CFA Institute's Code of Ethics and Standards of Professional Conduct. This standard mandates that all clients should be treated fairly and equitably when disseminating investment recommendations. By choosing to allocate Nerdcoin, which requires a substantial capital investment, only to his wealthiest clients, Garcia is potentially creating an uneven playing field. This action could disadvantage his smaller clients who might also wish to benefit from such investment opportunities but are excluded due to their lesser financial capability. The fair dealing standard is designed to prevent such disparities by ensuring that all clients have equal access to investment opportunities that suit their profiles, irrespective of their financial status. A is incorrect. While it is true that Nerdcoin requires a substantial capital investment which smaller clients may not afford, this does not justify excluding them from the opportunity to invest. Standard III(B) emphasizes the need for fair and equitable treatment of all clients. Garcia could have explored alternative ways to include smaller clients, such as recommending smaller denominations of Nerdcoin or similar investments that require less capital. By not doing so, he fails to treat his clients equitably, potentially breaching the fair dealing standard. C is incorrect. The fact that Garcia issues another recommendation for less wealthy clients does not rectify the initial unfair treatment. Each investment opportunity should be evaluated independently, and all clients should have the opportunity to participate in each recommendation according to their investment profiles. By initially excluding smaller clients from the Nerdcoin investment, Garcia has already placed them at a disadvantage, regardless of subsequent recommendations. This approach does not align with the principle of fair dealing, which requires that all clients should be considered equally for all investment opportunities. ", "explhtml": "<p>Garcia&#x27;s decision to recommend Nerdcoin exclusively to his biggest clients likely violates Standard III(B): Fair Dealing of the CFA Institute&#x27;s Code of Ethics and Standards of Professional Conduct. This standard mandates that all clients should be treated fairly and equitably when disseminating investment recommendations. By choosing to allocate Nerdcoin, which requires a substantial capital investment, only to his wealthiest clients, Garcia is potentially creating an uneven playing field. This action could disadvantage his smaller clients who might also wish to benefit from such investment opportunities but are excluded due to their lesser financial capability. The fair dealing standard is designed to prevent such disparities by ensuring that all clients have equal access to investment opportunities that suit their profiles, irrespective of their financial status.<\/p><p><b>A is incorrect<\/b>. While it is true that Nerdcoin requires a substantial capital investment which smaller clients may not afford, this does not justify excluding them from the opportunity to invest. Standard III(B) emphasizes the need for fair and equitable treatment of all clients. Garcia could have explored alternative ways to include smaller clients, such as recommending smaller denominations of Nerdcoin or similar investments that require less capital. By not doing so, he fails to treat his clients equitably, potentially breaching the fair dealing standard.<\/p><p><b>C is incorrect<\/b>. The fact that Garcia issues another recommendation for less wealthy clients does not rectify the initial unfair treatment. Each investment opportunity should be evaluated independently, and all clients should have the opportunity to participate in each recommendation according to their investment profiles. By initially excluding smaller clients from the Nerdcoin investment, Garcia has already placed them at a disadvantage, regardless of subsequent recommendations. This approach does not align with the principle of fair dealing, which requires that all clients should be considered equally for all investment opportunities. <\/p><p class=\"los\">Ethics, Learning Module 3: Application of the Code and Standards, LOS 3(b): Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Pedro Garcia<\/summary><div class=\"vig-body\"><p>Pedro Garcia, CFA, serves as a client adviser at Liberty Bank, a large well-established bank. He manages portfolios with a diversified mix of assets for middle-income and high-net-worth individuals. Each portfolio is managed accordingly depending on the client&#x27;s investment objectives, risk appetite, and risk tolerance. Under his watch, client portfolios have recorded significant growth over the years. He has also developed a strong rapport with his clients, who seek advice on various issues surrounding their investments both within and outside the bank. In addition, the management at Liberty has developed unwavering faith and confidence in his abilities. <\/p><p>Garcia has been successful in part because he is constantly on the lookout for emerging markets and products and undervalued assets. In the last couple of years, he has been keenly following developments in the cryptocurrency market. Like everyone else, he was initially skeptical about digital currencies partly because of the uncertainty surrounding their valuation and regulatory framework. However, the Capital Markets Authority recently introduced a trove of cryptocurrency regulations to increase monitoring and oversight of the new market. After these developments, Garcia believes it’s time he incorporated digital currencies in his clients’ portfolios and believes there’s potential for high returns and capital gains.<\/p><p>Garcia embarks on a detailed analysis of the cryptocurrency market. He spends three weeks scouring through online sources of information and attends a local cryptocurrency conference. Garcia learns that cryptocurrencies are traded on virtual exchanges where buyers and sellers meet. He has set his eyes on two – Nerdcoin and Breeze. Nerdcoin has been in circulation for more than three years and has considerable trading volume. However, demand-supply forces and stiff competition have pushed up Nerdcoin’s price. Buying a single unit of Nerdcoin would require substantial capital investment. On the other hand, Breeze is a relatively new digital currency with very little trading volume. Garcia recommends a 3% position in Nerdcoin only to clients with the largest portfolios, without assessing suitability for other clients who might afford it. But decides to research Breeze.<\/p><p>Golfing at the weekend, Garcia meets Breeze&#x27;s CEO and founder, who shares his vision for the currency. The CEO is impressed by Garcia’s grasp of matters cryptocurrency and invites Garcia to a meeting at the company’s headquarters. During the meeting, Garcia learns that there may also be an opportunity to make some extra cash through mining - the process of adding transaction records to the currency’s public ledger of past transactions or blockchain to keep them secure. The CEO gives him a detailed account of the process and the modalities involved. After the meeting, Garcia interacts with other senior partners over lunch at a nearby restaurant. He establishes that the company has been approached by representatives of the Capital Markets Authority looking to get some input ahead of a planned rollout of stricter cryptocurrency regulations.<\/p><p>Over the next few months, Garcia spends time practicing mining and even acquires special software used in the process. Breeze’s CEO also requests one of the IT experts at the company to help him. With time, Garcia grasps the intricacies of cryptocurrency and the underlying technology. The CEO offers him a non-paid part-time job at the company. Garcia accepts the offer, seeing it as an opportunity to improve his understanding of the subject further. However, he does not investigate Breeze&#x27;s financial stability, audit its security protocols, or analyze how pending CMA regulations could materially impact its viability. During a scheduled meeting with clients, he discusses cryptocurrencies and the market&#x27;s immense potential, largely based on the CEO&#x27;s optimistic claims. He goes ahead and issues a 5% buy recommendation on Breeze for all of his clients. <\/p><p>Most of Garcia’s clients have few questions and objections as a new market. Garcia is delighted with his work and feels his recommendation has been well received. <\/p><p>As a relatively newer cryptocurrency, Breeze has low trading volume, and Garcia realizes that it will take his clients several months to establish their positions. Luckily, though, Garcia knows that his mining skills can help him establish positions faster. After the meeting, Garcia sends all clients an email giving them the chance to buy Breeze tokens directly from him to not miss out on potential appreciation while trying to establish their positions.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Garcia’s decision to create positions in Nerdcoin for his biggest clients most likely in violation of the code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 22, "q": "To comply with the code and standards, Garcia must disclose:", "opts": ["The meeting at Breeze headquarters and the subsequent luncheon with senior management to his employer", "The job offer at Breeze to his employer", "All of the above"], "ans": "C", "expl": "Option C is the correct answer because it encompasses all necessary disclosures that Pedro Garcia must make to comply with the CFA Institute's Code of Ethics and Standards of Professional Conduct. According to Standard IV(B): Additional Compensation Arrangements, it is mandatory for members and candidates to disclose any arrangements that could potentially create a conflict of interest with their employer's interests. In Garcia's case, both the meeting at Breeze headquarters and the subsequent luncheon with senior management, as well as the job offer from Breeze, could influence his professional decisions and recommendations to clients. These situations could lead to a conflict of interest where Garcia's personal interests might compete with the interests of his employer, Liberty Bank. Therefore, disclosing these events to his employer ensures transparency and maintains the integrity of his professional conduct, aligning with the ethical standards set forth by the CFA Institute. A is incorrect. While disclosing the meeting at Breeze headquarters and the subsequent luncheon with senior management is necessary, it alone is not sufficient to comply fully with the CFA Institute's standards. This option does not include the disclosure of the job offer from Breeze, which is a significant piece of information that could create a conflict of interest. The job offer represents an additional compensation arrangement that could potentially influence Garcia's objectivity and loyalty to his employer. Therefore, merely disclosing the meeting and luncheon without mentioning the job offer does not satisfy the requirements of Standard IV(B) and could lead to ethical breaches. B is incorrect. Similarly, disclosing only the job offer at Breeze to his employer, while crucial, is not comprehensive enough to meet the ethical standards required by the CFA Institute. This option omits the disclosure of the meeting and luncheon, which are also relevant events that could affect Garcia's objectivity and professional decisions. The meeting and luncheon could be seen as additional benefits that might sway Garcia's recommendations to his clients, thereby creating a potential conflict of interest with his employer. Full disclosure of all relevant interactions and compensations is necessary to maintain transparency and uphold the integrity of professional conduct as mandated by the CFA standards. ", "explhtml": "<p>Option C is the correct answer because it encompasses all necessary disclosures that Pedro Garcia must make to comply with the CFA Institute&#x27;s Code of Ethics and Standards of Professional Conduct. According to Standard IV(B): Additional Compensation Arrangements, it is mandatory for members and candidates to disclose any arrangements that could potentially create a conflict of interest with their employer&#x27;s interests. In Garcia&#x27;s case, both the meeting at Breeze headquarters and the subsequent luncheon with senior management, as well as the job offer from Breeze, could influence his professional decisions and recommendations to clients. These situations could lead to a conflict of interest where Garcia&#x27;s personal interests might compete with the interests of his employer, Liberty Bank. Therefore, disclosing these events to his employer ensures transparency and maintains the integrity of his professional conduct, aligning with the ethical standards set forth by the CFA Institute.<\/p><p><b>A is incorrect<\/b>. While disclosing the meeting at Breeze headquarters and the subsequent luncheon with senior management is necessary, it alone is not sufficient to comply fully with the CFA Institute&#x27;s standards. This option does not include the disclosure of the job offer from Breeze, which is a significant piece of information that could create a conflict of interest. The job offer represents an additional compensation arrangement that could potentially influence Garcia&#x27;s objectivity and loyalty to his employer. Therefore, merely disclosing the meeting and luncheon without mentioning the job offer does not satisfy the requirements of Standard IV(B) and could lead to ethical breaches.<\/p><p><b>B is incorrect<\/b>. Similarly, disclosing only the job offer at Breeze to his employer, while crucial, is not comprehensive enough to meet the ethical standards required by the CFA Institute. This option omits the disclosure of the meeting and luncheon, which are also relevant events that could affect Garcia&#x27;s objectivity and professional decisions. The meeting and luncheon could be seen as additional benefits that might sway Garcia&#x27;s recommendations to his clients, thereby creating a potential conflict of interest with his employer. Full disclosure of all relevant interactions and compensations is necessary to maintain transparency and uphold the integrity of professional conduct as mandated by the CFA standards. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2 (a): demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Pedro Garcia<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pedro Garcia, CFA, serves as a client adviser at Liberty Bank, a large well-established bank. He manages portfolios with a diversified mix of assets for middle-income and high-net-worth individuals. Each portfolio is managed accordingly depending on the client&#x27;s investment objectives, risk appetite, and risk tolerance. Under his watch, client portfolios have recorded significant growth over the years. He has also developed a strong rapport with his clients, who seek advice on various issues surrounding their investments both within and outside the bank. In addition, the management at Liberty has developed unwavering faith and confidence in his abilities. <\/p><p>Garcia has been successful in part because he is constantly on the lookout for emerging markets and products and undervalued assets. In the last couple of years, he has been keenly following developments in the cryptocurrency market. Like everyone else, he was initially skeptical about digital currencies partly because of the uncertainty surrounding their valuation and regulatory framework. However, the Capital Markets Authority recently introduced a trove of cryptocurrency regulations to increase monitoring and oversight of the new market. After these developments, Garcia believes it’s time he incorporated digital currencies in his clients’ portfolios and believes there’s potential for high returns and capital gains.<\/p><p>Garcia embarks on a detailed analysis of the cryptocurrency market. He spends three weeks scouring through online sources of information and attends a local cryptocurrency conference. Garcia learns that cryptocurrencies are traded on virtual exchanges where buyers and sellers meet. He has set his eyes on two – Nerdcoin and Breeze. Nerdcoin has been in circulation for more than three years and has considerable trading volume. However, demand-supply forces and stiff competition have pushed up Nerdcoin’s price. Buying a single unit of Nerdcoin would require substantial capital investment. On the other hand, Breeze is a relatively new digital currency with very little trading volume. Garcia recommends a 3% position in Nerdcoin only to clients with the largest portfolios, without assessing suitability for other clients who might afford it. But decides to research Breeze.<\/p><p>Golfing at the weekend, Garcia meets Breeze&#x27;s CEO and founder, who shares his vision for the currency. The CEO is impressed by Garcia’s grasp of matters cryptocurrency and invites Garcia to a meeting at the company’s headquarters. During the meeting, Garcia learns that there may also be an opportunity to make some extra cash through mining - the process of adding transaction records to the currency’s public ledger of past transactions or blockchain to keep them secure. The CEO gives him a detailed account of the process and the modalities involved. After the meeting, Garcia interacts with other senior partners over lunch at a nearby restaurant. He establishes that the company has been approached by representatives of the Capital Markets Authority looking to get some input ahead of a planned rollout of stricter cryptocurrency regulations.<\/p><p>Over the next few months, Garcia spends time practicing mining and even acquires special software used in the process. Breeze’s CEO also requests one of the IT experts at the company to help him. With time, Garcia grasps the intricacies of cryptocurrency and the underlying technology. The CEO offers him a non-paid part-time job at the company. Garcia accepts the offer, seeing it as an opportunity to improve his understanding of the subject further. However, he does not investigate Breeze&#x27;s financial stability, audit its security protocols, or analyze how pending CMA regulations could materially impact its viability. During a scheduled meeting with clients, he discusses cryptocurrencies and the market&#x27;s immense potential, largely based on the CEO&#x27;s optimistic claims. He goes ahead and issues a 5% buy recommendation on Breeze for all of his clients. <\/p><p>Most of Garcia’s clients have few questions and objections as a new market. Garcia is delighted with his work and feels his recommendation has been well received. <\/p><p>As a relatively newer cryptocurrency, Breeze has low trading volume, and Garcia realizes that it will take his clients several months to establish their positions. Luckily, though, Garcia knows that his mining skills can help him establish positions faster. After the meeting, Garcia sends all clients an email giving them the chance to buy Breeze tokens directly from him to not miss out on potential appreciation while trying to establish their positions.<\/p><\/div><\/details><div class=\"qtext\"><p>To comply with the code and standards, Garcia must disclose:<\/p><\/div>", "subj": "ethics"}, {"n": 23, "q": "Which of the following standards has Garcia most likely violated?", "opts": ["Standard VI(A): Disclosure of Conflicts", "Standard V(A): Diligence and Reasonable Basis", "Both standard VI(A) and standard V(A)"], "ans": "C", "expl": "Garcia violated Standard V(A) not due to novelty alone, but because he: Failed to analyze material risks (e.g., impact of pending CMA regulations mentioned to him), relied solely on management's claims without verifying financial viability/security, and did not benchmark against competitors or stress-test projections His technical understanding of mining did not substitute for investment risk analysis. He also violated VI(A) by not disclosing his unpaid role at Breeze, which compromised his objectivity. He also offers to sell Breeze tokens directly to clients (acting as a distributor). Note: Standard V(A) requires heightened diligence for unregulated assets like early-stage cryptocurrencies (vs. IPOs with prospectuses/underwriter due diligence). Garcia failed to conduct this enhanced scrutiny. A is incorrect. While Garcia violated VI(A) by failing to disclose his Breeze role, IT support, and token-selling arrangement, this ignores his separate V(A) violation. The vignette explicitly shows he recommended Breeze without analyzing financial risks, security, or regulatory impacts, a clear lack of diligence under V(A). B is incorrect. Garcia violated V(A) by omitting critical due diligence on Breeze, but this ignores his undisclosed conflicts under VI(A). His unpaid role at Breeze and decision to sell tokens directly to clients created material conflicts that required disclosure, regardless of the depth of his research. ", "explhtml": "<p>Garcia violated Standard V(A) not due to novelty alone, but because he: Failed to analyze material risks (e.g., impact of pending CMA regulations mentioned to him), relied solely on management&#x27;s claims without verifying financial viability/security, and did not benchmark against competitors or stress-test projections His technical understanding of mining did not substitute for investment risk analysis. He also violated VI(A) by not disclosing his unpaid role at Breeze, which compromised his objectivity. He also offers to sell Breeze tokens directly to clients (acting as a distributor).<\/p><p>Note: Standard V(A) requires heightened diligence for unregulated assets like early-stage cryptocurrencies (vs. IPOs with prospectuses/underwriter due diligence). Garcia failed to conduct this enhanced scrutiny.<\/p><p><b>A is incorrect<\/b>. While Garcia violated VI(A) by failing to disclose his Breeze role, IT support, and token-selling arrangement, this ignores his separate V(A) violation. The vignette explicitly shows he recommended Breeze without analyzing financial risks, security, or regulatory impacts, a clear lack of diligence under V(A).<\/p><p><b>B is incorrect<\/b>. Garcia violated V(A) by omitting critical due diligence on Breeze, but this ignores his undisclosed conflicts under VI(A). His unpaid role at Breeze and decision to sell tokens directly to clients created material conflicts that required disclosure, regardless of the depth of his research. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2 (a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Pedro Garcia<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pedro Garcia, CFA, serves as a client adviser at Liberty Bank, a large well-established bank. He manages portfolios with a diversified mix of assets for middle-income and high-net-worth individuals. Each portfolio is managed accordingly depending on the client&#x27;s investment objectives, risk appetite, and risk tolerance. Under his watch, client portfolios have recorded significant growth over the years. He has also developed a strong rapport with his clients, who seek advice on various issues surrounding their investments both within and outside the bank. In addition, the management at Liberty has developed unwavering faith and confidence in his abilities. <\/p><p>Garcia has been successful in "qtext\"><p>Which of the following standards has Garcia most likely violated?<\/p><\/div>", "subj": "ethics"}, {"n": 24, "q": "Garcia recommends a 3% position in Nerdcoin and a 5% position in Breeze. Which of the two most likely violates the CFA Institute Standards of professional conduct?", "opts": ["The recommendation on Nerdcoin", "The recommendation on Breeze", "Both the recommendation on Nerdcoin and the recommendation on Breeze"], "ans": "C", "expl": "Garcia’s Nerdcoin recommendation violates Standard III(B): Fair Dealing because he restricted access based solely on client wealth, excluding potentially suitable clients with smaller portfolios. By restricting the recommendation only to his largest clients based on their wealth/ability to afford it, Garcia failed to treat all clients fairly. He did not make the recommendation available to clients for whom it might have been suitable (e.g., a smaller client for whom a 3% position was affordable and aligned with their risk profile). The violation is excluding potentially suitable clients based on account size/wealth, not uniformity. His Breeze recommendation violates Standard III(C): Suitability because he issued a uniform 5% allocation to all clients without individual assessment. By recommending a 5% position in a highly speculative, low-volume, new cryptocurrency uniformly to all clients, Garcia failed to consider the individual suitability factors (risk tolerance, financial situation, investment objectives) of each client. A one-size-fits-all recommendation for such a risky asset is inherently unsuitable. A is incorrect. While Nerdcoin’s recommendation was not uniform, it violates Standard III(B): Fair Dealing by restricting access to large clients without evaluating suitability for smaller clients who could afford the position. B is incorrect. Breeze violates Standard III(C): Suitability due to the uniform 5% recommendation to all clients without individual assessment, but Nerdcoin also violates III(B). ", "explhtml": "<p>Garcia’s Nerdcoin recommendation violates Standard III(B): Fair Dealing because he restricted access based solely on client wealth, excluding potentially suitable clients with smaller portfolios. By restricting the recommendation only to his largest clients based on their wealth/ability to afford it, Garcia failed to treat all clients fairly. He did not make the recommendation available to clients for whom it might have been suitable (e.g., a smaller client for whom a 3% position was affordable and aligned with their risk profile). The violation is excluding potentially suitable clients based on account size/wealth, not uniformity.<\/p><p>His Breeze recommendation violates Standard III(C): Suitability because he issued a uniform 5% allocation to all clients without individual assessment. By recommending a 5% position in a highly speculative, low-volume, new cryptocurrency uniformly to all clients, Garcia failed to consider the individual suitability factors (risk tolerance, financial situation, investment objectives) of each client. A one-size-fits-all recommendation for such a risky asset is inherently unsuitable.<\/p><p><b>A is incorrect<\/b>. While Nerdcoin’s recommendation was not uniform, it violates Standard III(B): Fair Dealing by restricting access to large clients without evaluating suitability for smaller clients who could afford the position.<\/p><p><b>B is incorrect<\/b>. Breeze violates Standard III(C): Suitability due to the uniform 5% recommendation to all clients without individual assessment, but Nerdcoin also violates III(B). <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2 (a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Pedro Garcia<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pedro Garcia, CFA, serves as a client adviser at Liberty Bank, a large well-established bank. He manages portfolios with a diversified mix of assets for middle-income and high-net-worth individuals. Each portfolio is managed accordingly depending on the client&#x27;s investment objectives, risk appetite, and risk tolerance. Under his watch, client portfolios have recorded significant growth over the years. He has also developed a strong rapport with his clients, who seek advice on various issues surrounding their investments both within and outside the bank. In addition, the management at Liberty has developed unwavering faith and confidence in his abilities. <\/p><p>Garcia has been successful in part because he is constantly on the lookout for emerging markets and products and undervalued assets. In the last couple of years, he has been keenly following developments in the cryptocurrency market. Like everyone else, he was initially skeptical about digital currencies partly because of the uncertainty surrounding their valuation and regulatory framework. However, the Capital Markets Authority recently introduced a trove of cryptocurrency regulations to increase monitoring and oversight of the new market. After these developments, Garcia believes it’s time he incorporated digital currencies in his clients’ portfolios and believes there’s potential for high returns and capital gains.<\/p><p>Garcia embarks on a detailed analysis of the cryptocurrency market. He spends three weeks scouring through online sources of information and attends a local cryptocurrency conference. Garcia learns that cryptocurrencies are traded on virtual exchanges where buyers and sellers meet. He has set his eyes on two – Nerdcoin and Breeze. Nerdcoin has been in circulation for more than three years and has considerable trading volume. However, demand-supply forces and stiff competition have pushed up Nerdcoin’s price. Buying a single unit of Nerdcoin would require substantial capital investment. On the other hand, Breeze is a relatively new digital currency with very little trading volume. Garcia recommends a 3% position in Nerdcoin only to clients with the largest portfolios, without assessing suitability for other clients who might afford it. But decides to research Breeze.<\/p><p>Golfing at the weekend, Garcia meets Breeze&#x27;s CEO and founder, who shares his vision for the currency. The CEO is impressed by Garcia’s grasp of matters cryptocurrency and invites Garcia to a meeting at the company’s headquarters. During the meeting, Garcia learns that there may also be an opportunity to make some extra cash through mining - the process of adding transaction records to the currency’s public ledger of past transactions or blockchain to keep them secure. The CEO gives him a detailed account of the process and the modalities involved. After the meeting, Garcia interacts with other senior partners over lunch at a nearby restaurant. He establishes that the company has been approached by representatives of the Capital Markets Authority looking to get some input ahead of a planned rollout of stricter cryptocurrency regulations.<\/p><p>Over the next few months, Garcia spends time practicing mining and even acquires special software used in the process. Breeze’s CEO also requests one of the IT experts at the company to help him. With time, Garcia grasps the intricacies of cryptocurrency and the underlying technology. The CEO offers him a non-paid part-time job at the company. Garcia accepts the offer, seeing it as an opportunity to improve his understanding of the subject further. However, he does not investigate Breeze&#x27;s financial stability, audit its security protocols, or analyze how pending CMA regulations could materially impact its viability. During a scheduled meeting with clients, he discusses cryptocurrencies and the market&#x27;s immense potential, largely based on the CEO&#x27;s optimistic claims. He goes ahead and issues a 5% buy recommendation on Breeze for all of his clients. <\/p><p>Most of Garcia’s clients have few questions and objections as a new market. Garcia is delighted with his work and feels his recommendation has been well received. <\/p><p>As a relatively newer cryptocurrency, Breeze has low trading volume, and Garcia realizes that it will take his clients several months to establish their positions. Luckily, though, Garcia knows that his mining skills can help him establish positions faster. After the meeting, Garcia sends all clients an email giving them the chance to buy Breeze tokens directly from him to not miss out on potential appreciation while trying to establish their positions.<\/p><\/div><\/details><div class=\"qtext\"><p>Garcia recommends a 3% position in Nerdcoin and a 5% position in Breeze. Which of the two most likely violates the CFA Institute Standards of professional conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 25, "q": "Is Gentner Capital's policy concerning review meetings with clients most likely consistent with the recommended procedures for compliance with the Standards?", "opts": ["Yes", "No, because review meetings should be held at least quarterly", "No, because review meetings should be held at least semiannually"], "ans": "A", "expl": "The recommended procedures for compliance with Standard III (A) - Loyalty, Prudence, and Care of the CFA Institute's Code of Ethics and Standards of Professional Conduct emphasize the importance of regular reviews of client accounts to ensure that the investments are aligned with the terms of the governing documents, such as the investment policy statement (IPS). Importantly, these standards do not specify a fixed interval for these reviews, allowing for flexibility based on individual client needs and circumstances. Gentner Capital's policy of conducting annual review meetings with clients to assess changes in investment objectives or constraints is in alignment with these guidelines. By instituting a policy that mandates at least annual reviews, Gentner Capital ensures ongoing adherence to each client's IPS and responsiveness to any changes in their financial situations or goals, thereby upholding the principles of loyalty, prudence, and care. B is incorrect. The statement that review meetings should be held quarterly is not supported by the CFA Institute's standards. The standards advocate for regular reviews but deliberately avoid prescribing a specific frequency, recognizing that the appropriate interval can vary based on factors such as the nature of the investment strategy, the volatility of the assets managed, and client preferences. Imposing a quarterly review requirement without basis could lead to unnecessary administrative burdens and could potentially distract from focusing on more substantive aspects of client care and portfolio management. C is incorrect. Similar to option B, the claim that review meetings should be held semiannually is not mandated by the CFA Institute's standards. While more frequent reviews might be appropriate for certain types of accounts or in volatile markets, the standards provide advisors with the discretion to determine the most suitable review schedule. This flexibility is crucial for tailoring the review process to the specific needs and circumstances of each client, thereby enhancing the advisor's ability to act in the best interest of the client, which is a core tenet of the standard concerning loyalty, prudence, and care. ", "explhtml": "<p>The recommended procedures for compliance with Standard III (A) - Loyalty, Prudence, and Care of the CFA Institute&#x27;s Code of Ethics and Standards of Professional Conduct emphasize the importance of regular reviews of client accounts to ensure that the investments are aligned with the terms of the governing documents, such as the investment policy statement (IPS). Importantly, these standards do not specify a fixed interval for these reviews, allowing for flexibility based on individual client needs and circumstances. Gentner Capital&#x27;s policy of conducting annual review meetings with clients to assess changes in investment objectives or constraints is in alignment with these guidelines. By instituting a policy that mandates at least annual reviews, Gentner Capital ensures ongoing adherence to each client&#x27;s IPS and responsiveness to any changes in their financial situations or goals, thereby upholding the principles of loyalty, prudence, and care.<\/p><p><b>B is incorrect<\/b>. The statement that review meetings should be held quarterly is not supported by the CFA Institute&#x27;s standards. The standards advocate for regular reviews but deliberately avoid prescribing a specific frequency, recognizing that the appropriate interval can vary based on factors such as the nature of the investment strategy, the volatility of the assets managed, and client preferences. Imposing a quarterly review requirement without basis could lead to unnecessary administrative burdens and could potentially distract from focusing on more substantive aspects of client care and portfolio management.<\/p><p><b>C is incorrect<\/b>. Similar to option B, the claim that review meetings should be held semiannually is not mandated by the CFA Institute&#x27;s standards. While more frequent reviews might be appropriate for certain types of accounts or in volatile markets, the standards provide advisors with the discretion to determine the most suitable review schedule. This flexibility is crucial for tailoring the review process to the specific needs and circumstances of each client, thereby enhancing the advisor&#x27;s ability to act in the best interest of the client, which is a core tenet of the standard concerning loyalty, prudence, and care. <\/p><p class=\"los\">Ethics, Learning Module 2: Application of the Code and Standards, LOS (a): Evaluate policies and practices for a firm and an individual in relation to the CFA Institute Code of Ethics and Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Ryan Gentner<\/summary><div class=\"vig-body\"><p>Ryan Gentner, CFA, is an investment advisor with Seaforth Investment Partners (Seaforth). After contemplating a change for the past few years, Gentner has decided to move back to his hometown of Stoneton, a three-hour drive west of the city in which Seaforth is headquartered. He intends to start his own boutique investment advisory firm, Gentner Capital.<\/p><p>Gentner notifies his supervisor, Aileen McCartney, of his intention to leave Seaforth. Because McCartney expects the level of competition between the two firms to be minimal relative to Seaforth&#x27;s total revenues, and out of appreciation for Gentner&#x27;s years of service, McCartney gives Gentner written consent to take and use copies of her company&#x27;s proprietary materials used by its advisors in developing situational and psychological profiles of clients and prospective clients. After he has notified McCartney, but before his term of employment at Seaforth officially ends, Gentner devotes much of his time to developing a marketing strategy for his new firm.<\/p><p>Recognizing that he requires assistance in developing the digital aspects of a marketing strategy, Gentner emails Ruth Stern, a marketing consultant who has a longstanding and ongoing business engagement with Seaforth. This email appears in its entirety in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0007.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Gentner&#x27;s email to Stern\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0008.webp\" style=\"max-width:min(100%,612px)\" alt=\"Ruth,\"><p>In three weeks, I will be leaving Seaforth and moving back to Stoneton,<\/p><p>where I will be starting my own firm, Gentner Capital. While this new<\/p><p>venture will be too small to compete with all of the services Seaforth offers,<\/p><p>I expect that we will compete directly for some accounts, and I am<\/p><p>confident that at least some of my current clients will eventually move their<\/p><p>accounts to my boutique shop.<\/p><p>Having seen the results of your work with Seaforth, you are my first choice<\/p><p>to design and implement a digital marketing strategy for Gentner Capital. I<\/p><p>realize that this work may compete for some of the time you devote to<\/p><p>Seaforth, so I am willing to pay the same rate they pay for your services.<\/p><p>As you may know, I was recently awarded the CFA charter. I found that the<\/p><p>effort required to complete the CFA Program while working full-time was<\/p><p>greater than what it took to get through two years of business school. I<\/p><p>believe that I have improved my skills as an investment advisor by<\/p><p>obtaining my charter, and I hope that clients and prospective clients will<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0009.webp\" style=\"max-width:min(100%,612px)\" alt=\"agree.\"><p>Will you please take on my firm as a client?<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0010.webp\" style=\"max-width:min(100%,612px)\" alt=\"Best regards,\"><p>Ryan Gentner, M.B.A., C.F.A.<\/p><p>Stern considers the opportunity to consult for Gentner Capital, but ultimately decides to turn down the offer. In conveying this decision to Gentner, she notes that Seaforth is her largest client and does not believe that it would be wise to take on a competitor as a client.<\/p><p>After officially leaving Seaforth and moving to Stoneton, Gentner begins writing the policies he will implement at his new firm. Specifically, all Gentner Capital employees who provide advisory services must meet with clients at least once annually to determine if their investment objectives and/or constraints have changed and make any necessary updates to their investment policy statement. Another firm policy mandates that clients receive account statements at regular intervals containing, among other information, returns stated on a gross-of-fees, before-tax basis. However, Gentner has yet to decide how frequently these statements should be sent.<\/p><p>Gentner is pleased to find that many of the clients he served at Seaforth have opened accounts with his new firm within a few months of his move. Master emailed Gentner an order to buy 50,000 shares in Tyndale Microsystems (TMS), noting that this transaction would be consistent with the investment policy statement (IPS) that the two had created at the account opening stage.<\/p><p>On the morning of the IPO of TMS shares, Jacqueline Dumont, a long-time client of Seaforth, pays an initial visit to Gentner Capital&#x27;s office, intending to open an account with the new firm. While at the office, Dumont has a brief discussion with Gentner in which she mentions that she believes that 50,000 shares of TMS stock would be an ideal fit for her portfolio. Dumont spends most of her visit working with Gentner&#x27;s assistant to complete the paperwork required to open her account. Later that day, Gentner can complete a block trade for 20,000 TMS shares in the firm&#x27;s oversubscribed IPO. Because Masters and Dumont both referenced 50,000 shares of TMS, Gentner allocates 10,000 shares to each client&#x27;s account.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Gentner Capital&#x27;s policy concerning review meetings with clients most likely consistent with the recommended procedures for compliance with the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 26, "q": "To adhere to the Standards, Gentner should most likely provide clients with account statements at least:", "opts": ["Monthly.", "Quarterly.", "Semiannually."], "ans": "B", "expl": "According to the recommended procedures for compliance with Standard III (A) - Loyalty, Prudence, and Care, from the CFA Institute's Standards of Professional Conduct, investment advisors are required to act with diligence and reasonable care in the best interest of their clients. This includes providing clients with regular updates on their account performance to ensure they are well-informed about their investments. The standard practice, as suggested by the CFA Institute, is to provide these updates at least quarterly. This frequency is considered sufficient to keep clients adequately informed about their investments while not being overly burdensome for the investment advisor. Therefore, option B, which suggests providing account statements quarterly, aligns with these guidelines and is the most appropriate choice for Gentner to meet his obligations under the standard. A is incorrect. While monthly statements would certainly keep clients well-informed, they are not typically necessary unless the specific nature of the investment or client needs dictates more frequent communication. Providing statements monthly could also lead to unnecessary administrative burdens and costs for the advisor, which may not provide proportional value to the client. The CFA Institute's guidelines suggest quarterly updates as a standard practice, making monthly updates more than what is generally required and not the most efficient use of resources unless specifically justified by the client's circumstances or the nature of the investments. C is incorrect. Providing account statements semiannually could potentially leave clients under-informed about the performance and management of their investments. This infrequency may not adequately fulfill the advisor's duty to keep clients informed about significant changes or developments in their accounts, which could impact their investment decisions and financial planning. In the fast-paced financial markets, a lot can change in six months, and clients may miss opportunities or fail to address risks in a timely manner if updates are only provided semiannually. Thus, semiannual statements do not align with the best practices of regular and thorough communication stipulated under Standard III (A). ", "explhtml": "<p>According to the recommended procedures for compliance with Standard III (A) - Loyalty, Prudence, and Care, from the CFA Institute&#x27;s Standards of Professional Conduct, investment advisors are required to act with diligence and reasonable care in the best interest of their clients. This includes providing clients with regular updates on their account performance to ensure they are well-informed about their investments. The standard practice, as suggested by the CFA Institute, is to provide these updates at least quarterly. This frequency is considered sufficient to keep clients adequately informed about their investments while not being overly burdensome for the investment advisor. Therefore, option B, which suggests providing account statements quarterly, aligns with these guidelines and is the most appropriate choice for Gentner to meet his obligations under the standard.<\/p><p><b>A is incorrect<\/b>. While monthly statements would certainly keep clients well-informed, they are not typically necessary unless the specific nature of the investment or client needs dictates more frequent communication. Providing statements monthly could also lead to unnecessary administrative burdens and costs for the advisor, which may not provide proportional value to the client. The CFA Institute&#x27;s guidelines suggest quarterly updates as a standard practice, making monthly updates more than what is generally required and not the most efficient use of resources unless specifically justified by the client&#x27;s circumstances or the nature of the investments.<\/p><p><b>C is incorrect<\/b>. Providing account statements semiannually could potentially leave clients under-informed about the performance and management of their investments. This infrequency may not adequately fulfill the advisor&#x27;s duty to keep clients informed about significant changes or developments in their accounts, which co
