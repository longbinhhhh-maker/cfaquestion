<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalystPrep — Ethical &amp; Professional Standards</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}

  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;

  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
  .expl-html .los{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
  .expl-html b{color:var(--txt)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

const DATA = [{"n": 1, "q": "In response to the information shared by Murray, Fitch should most likely:", "opts": ["Not take any action.", "Inform Murray’s supervisor and his firm.", "Seek counsel from Patel and his legal team."], "ans": "A", "expl": "Andrew Fitch's decision not to take any action in response to Sara Murray's comments is justified because there is no formal advisory relationship between them. Murray's intention to deviate from her fund's investment mandate to improve performance is a matter internal to her and her firm. Fitch, in his capacity as a provider of trading and research services, is not engaged in an advisory role with Murray or her fund. His role does not encompass overseeing or intervening in the investment strategies of the portfolio managers he interacts with unless explicitly agreed upon in a professional advisory context. Therefore, Fitch's non-action aligns with the ethical boundaries of his current professional responsibilities. B is incorrect. Informing Murray’s supervisor or her firm about her strategy would be inappropriate for Fitch because he does not have a formal advisory or supervisory role over Murray. The information shared by Murray was in a personal capacity and does not necessarily constitute a breach that requires reporting. Moreover, without a formal advisory relationship, Fitch does not have a professional obligation to report Murray's strategies to her superiors. Doing so could breach confidentiality and trust established during their informal meeting, potentially harming professional relationships and Fitch's reputation. C is incorrect. Seeking counsel from Patel and his legal team is an unnecessary step for Fitch, given the nature of the information shared by Murray. Since there is no formal advisory relationship and Murray's actions do not directly impact Fitch's professional responsibilities or the operations of his business unit, no legal or ethical dilemma is presented that would require legal advice. Consulting the legal team could lead to unnecessary complications and resource allocation, diverting attention from Fitch's core activities of trading and research services. ", "explhtml": "<p>Andrew Fitch&#x27;s decision not to take any action in response to Sara Murray&#x27;s comments is justified because there is no formal advisory relationship between them. Murray&#x27;s intention to deviate from her fund&#x27;s investment mandate to improve performance is a matter internal to her and her firm. Fitch, in his capacity as a provider of trading and research services, is not engaged in an advisory role with Murray or her fund. His role does not encompass overseeing or intervening in the investment strategies of the portfolio managers he interacts with unless explicitly agreed upon in a professional advisory context. Therefore, Fitch&#x27;s non-action aligns with the ethical boundaries of his current professional responsibilities.<\/p><p><b>B is incorrect<\/b>. Informing Murray’s supervisor or her firm about her strategy would be inappropriate for Fitch because he does not have a formal advisory or supervisory role over Murray. The information shared by Murray was in a personal capacity and does not necessarily constitute a breach that requires reporting. Moreover, without a formal advisory relationship, Fitch does not have a professional obligation to report Murray&#x27;s strategies to her superiors. Doing so could breach confidentiality and trust established during their informal meeting, potentially harming professional relationships and Fitch&#x27;s reputation.<\/p><p><b>C is incorrect<\/b>. Seeking counsel from Patel and his legal team is an unnecessary step for Fitch, given the nature of the information shared by Murray. Since there is no formal advisory relationship and Murray&#x27;s actions do not directly impact Fitch&#x27;s professional responsibilities or the operations of his business unit, no legal or ethical dilemma is presented that would require legal advice. Consulting the legal team could lead to unnecessary complications and resource allocation, diverting attention from Fitch&#x27;s core activities of trading and research services. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Alex Patel<\/summary><div class=\"vig-body\"><p>Alex Patel, CFA, recently started a small investment bank with two key business units: advisory services and trading and research services. His first two hires for this business are Eve Gollan, CFA, and Andrew Fitch, CFA. Gollan is responsible for the advisory business, while Fitch sets up the trading and research services.<\/p><p>Andrew Fitch previously worked in an independent research house and has professional relationships with many portfolio managers who may be willing to become clients of this new business. The portfolio manager with whom he has a good personal relationship has already begun setting up informal meetings. During one such meeting, Sara Murray, CFA, a portfolio manager at a USD 1 billion long/short equity hedge fund, told Fitch: &quot;I&#x27;m trying a different strategy for the next four weeks since my fund has been losing a lot of money lately. I hope this new strategy will help bring the YTD fund returns back on track and, hopefully, I will not need to tell my investors anything about the deviation I took from the investment mandate.”<\/p><p>Fitch has hired three research associates to build the research coverage for the new business. His research associates have been tasked with launching coverage on 50 stocks over the next two months. Maya Malik, CFA, one of the research associates, covers the auto sector and is ready to publish her first research report. The report covers the top five auto manufacturers and sources most of the industry data from the Auto Industry Association, a well-known source for industry statistics. After the report is published, she notices an error in one of the industry average numbers for the year 2001; Malik decides to ignore the error since it is a historical figure and, in her view, will not have any material impact on the quality of her report. Her report is well-received by investors and brings about considerable movement in the prices of four of the five stocks covered in her report. Andrew Fitch and Alex Patel are pleased with this development and feel that the new business is off to a great start.<\/p><p>The second research associate, Jim Matthews, covers telecom and media stocks and wants to use social media as his most preferred avenue for disseminating his research products to clients. Based on the information he has available from Fitch, the research division’s current client base is 325. Matthews has 325 followers on Twitter and 200 followers on Facebook. He starts actively posting his research opinions and updates on both of these platforms, but there are days when he is more active on one platform than the other.<\/p><\/div><\/details><div class=\"qtext\"><p>In response to the information shared by Murray, Fitch should most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "In her initiation report on the auto sector, Maya Malik is most likely:", "opts": ["In violation of Standard I(C) on misrepresentation.", "Not in violation of any Standards, as the data was sourced from a credible source.", "Not in violation of any Standards, as the data error has no material impact on her report’s quality."], "ans": "A", "expl": "Maya Malik's decision to ignore the error in the industry average numbers from the Auto Industry Association, despite knowing about it, constitutes a violation of Standard I(C) on misrepresentation. According to the CFA Institute's Standards of Professional Conduct, Standard I(C) requires members and candidates to use reasonable care and judgment to achieve and maintain accuracy and completeness in their professional activities. By choosing not to correct or disclose the error, Malik failed to ensure the accuracy and completeness of her report. This misrepresentation could potentially mislead investors, affecting their investment decisions based on the perceived performance and prospects of the auto manufacturers covered in her report. The fact that the error was from a historical figure does not exempt her from the responsibility of reporting accurate information, especially when the report influences market prices and investor decisions. B is incorrect. Although the data was sourced from a credible source, the Auto Industry Association, Maya Malik remains responsible for verifying and ensuring the accuracy of the data before dissemination. Standard I(C) emphasizes the importance of diligence and thoroughness in professional activities. The credibility of the source does not absolve Malik from her duty to correct known errors. Ignoring the error, even after identifying it, leads to the dissemination of potentially misleading information, which is a clear violation of the CFA Institute's ethical standards. C is incorrect. The argument that the data error has no material impact on the report’s quality is subjective and potentially flawed. Standard I(C) requires that members and candidates avoid misrepresentation of any kind, which includes the accuracy of data presented in research reports. The materiality of the error does not negate the obligation to correct or disclose it. By not addressing the error, Malik risks the integrity of her research and potentially misleads those who rely on her analysis for making investment decisions. The perception of materiality should not determine the ethical obligation to present accurate and complete information. ", "explhtml": "<p>Maya Malik&#x27;s decision to ignore the error in the industry average numbers from the Auto Industry Association, despite knowing about it, constitutes a violation of Standard I(C) on misrepresentation. According to the CFA Institute&#x27;s Standards of Professional Conduct, Standard I(C) requires members and candidates to use reasonable care and judgment to achieve and maintain accuracy and completeness in their professional activities. By choosing not to correct or disclose the error, Malik failed to ensure the accuracy and completeness of her report. This misrepresentation could potentially mislead investors, affecting their investment decisions based on the perceived performance and prospects of the auto manufacturers covered in her report. The fact that the error was from a historical figure does not exempt her from the responsibility of reporting accurate information, especially when the report influences market prices and investor decisions.<\/p><p><b>B is incorrect<\/b>. Although the data was sourced from a credible source, the Auto Industry Association, Maya Malik remains responsible for verifying and ensuring the accuracy of the data before dissemination. Standard I(C) emphasizes the importance of diligence and thoroughness in professional activities. The credibility of the source does not absolve Malik from her duty to correct known errors. Ignoring the error, even after identifying it, leads to the dissemination of potentially misleading information, which is a clear violation of the CFA Institute&#x27;s ethical standards.<\/p><p><b>C is incorrect<\/b>. The argument that the data error has no material impact on the report’s quality is subjective and potentially flawed. Standard I(C) requires that members and candidates avoid misrepresentation of any kind, which includes the accuracy of data presented in research reports. The materiality of the error does not negate the obligation to correct or disclose it. By not addressing the error, Malik risks the integrity of her research and potentially misleads those who rely on her analysis for making investment decisions. The perception of materiality should not determine the ethical obligation to present accurate and complete information. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Alex Patel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alex Patel, CFA, recently started a small investment bank with two key business units: advisory services and trading and research services. His first two hires for this business are Eve Gollan, CFA, and Andrew Fitch, CFA. Gollan is responsible for the advisory business, while Fitch sets up the trading and research services.<\/p><p>Andrew Fitch previously worked in an independent research house and has professional relationships with many portfolio managers who may be willing to become clients of this new business. The portfolio manager with whom he has a good personal relationship has already begun setting up informal meetings. During one such meeting, Sara Murray, CFA, a portfolio manager at a USD 1 billion long/short equity hedge fund, told Fitch: &quot;I&#x27;m trying a different strategy for the next four weeks since my fund has been losing a lot of money lately. I hope this new strategy will help bring the YTD fund returns back on track and, hopefully, I will not need to tell my investors anything about the deviation I took from the investment mandate.”<\/p><p>Fitch has hired three research associates to build the research coverage for the new business. His research associates have been tasked with launching coverage on 50 stocks over the next two months. Maya Malik, CFA, one of the research associates, covers the auto sector and is ready to publish her first research report. The report covers the top five auto manufacturers and sources most of the industry data from the Auto Industry Association, a well-known source for industry statistics. After the report is published, she notices an error in one of the industry average numbers for the year 2001; Malik decides to ignore the error since it is a historical figure and, in her view, will not have any material impact on the quality of her report. Her report is well-received by investors and brings about considerable movement in the prices of four of the five stocks covered in her report. Andrew Fitch and Alex Patel are pleased with this development and feel that the new business is off to a great start.<\/p><p>The second research associate, Jim Matthews, covers telecom and media stocks and wants to use social media as his most preferred avenue for disseminating his research products to clients. Based on the information he has available from Fitch, the research division’s current client base is 325. Matthews has 325 followers on Twitter and 200 followers on Facebook. He starts actively posting his research opinions and updates on both of these platforms, but there are days when he is more active on one platform than the other.<\/p><\/div><\/details><div class=\"qtext\"><p>In her initiation report on the auto sector, Maya Malik is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Knowing that her report has had an impact on stock prices, Malik is most likely:", "opts": ["Not in violation of Standard II(A) on material nonpublic information.", "In violation of the Standards for not making her research available to the public after knowing its materiality.", "In violation of Standard II(A) for not making her research available to the public at the same time as to her clients."], "ans": "A", "expl": "Maya Malik's actions do not constitute a violation of Standard II(A) on material nonpublic information. Standard II(A) pertains to the use and dissemination of material nonpublic information. In Malik's case, the information she used for her research report was sourced from the Auto Industry Association, which is a recognized and public source. Therefore, the data she used was already available to the public, and her analysis, although influential, was based on this public information. Her role involved interpreting this data using her expertise to provide insights on the auto sector, which does not equate to handling nonpublic material information. The impact of her report on stock prices does not retroactively make her analysis or the data she used nonpublic or material in the context of Standard II(A). B is incorrect. The statement that Malik is in violation of the Standards for not making her research available to the public after knowing its materiality is incorrect because the standard in question, Standard II(A), does not require that all research be made available to the public immediately upon understanding its potential impact. The standard primarily concerns the handling of nonpublic, material information. Since Malik's report was based on public data and her own analysis, she was under no obligation to withhold her findings from clients before releasing them to the broader public. Her duty was to ensure the accuracy and fairness of the information, not to manage its release based on its perceived impact. C is incorrect. The claim that Malik violated Standard II(A) by not making her research available to the public at the same time as to her clients misinterprets the requirements of the standard. Standard II(A) focuses on the equitable treatment of nonpublic material information. Malik's research, based on public sources, does not fall under the category of nonpublic material information. Therefore, the timing of the release of her research to different audiences is not pertinent under this standard. The standard does not mandate simultaneous distribution of all research; rather, it emphasizes the non-misuse of material nonpublic information. ", "explhtml": "<p>Maya Malik&#x27;s actions do not constitute a violation of Standard II(A) on material nonpublic information. Standard II(A) pertains to the use and dissemination of material nonpublic information. In Malik&#x27;s case, the information she used for her research report was sourced from the Auto Industry Association, which is a recognized and public source. Therefore, the data she used was already available to the public, and her analysis, although influential, was based on this public information. Her role involved interpreting this data using her expertise to provide insights on the auto sector, which does not equate to handling nonpublic material information. The impact of her report on stock prices does not retroactively make her analysis or the data she used nonpublic or material in the context of Standard II(A).<\/p><p><b>B is incorrect<\/b>. The statement that Malik is in violation of the Standards for not making her research available to the public after knowing its materiality is incorrect because the standard in question, Standard II(A), does not require that all research be made available to the public immediately upon understanding its potential impact. The standard primarily concerns the handling of nonpublic, material information. Since Malik&#x27;s report was based on public data and her own analysis, she was under no obligation to withhold her findings from clients before releasing them to the broader public. Her duty was to ensure the accuracy and fairness of the information, not to manage its release based on its perceived impact.<\/p><p><b>C is incorrect<\/b>. The claim that Malik violated Standard II(A) by not making her research available to the public at the same time as to her clients misinterprets the requirements of the standard. Standard II(A) focuses on the equitable treatment of nonpublic material information. Malik&#x27;s research, based on public sources, does not fall under the category of nonpublic onths. Maya Malik, CFA, one of the research associates, covers the auto sector and is ready to publish her first research report. The report covers the top five auto manufacturers and sources most of the industry data from the Auto Industry Association, a well-known source for industry statistics. After the report is published, she notices an error in one of the industry average numbers for the year 2001; Malik decides to ignore the error since it is a historical figure and, in her view, will not have any material impact on the quality of her report. Her report is well-received by investors and brings about considerable movement in the prices of four of the five stocks covered in her report. Andrew Fitch and Alex Patel are pleased with this development and feel that the new business is off to a great start.<\/p><p>The second research associate, Jim Matthews, covers telecom and media stocks and wants to use social media as his most preferred avenue for disseminating his research products to clients. Based on the information he has available from Fitch, the research division’s current client base is 325. Matthews has 325 followers on Twitter and 200 followers on Facebook. He starts actively posting his research opinions and updates on both of these platforms, but there are days when he is more active on one platform than the other.<\/p><\/div><\/details><div class=\"qtext\"><p>Knowing that her report has had an impact on stock prices, Malik is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "By distributing his research opinions and updates on social media platforms, Jim Matthews is most likely violating:", "opts": ["Only Standard III(B) on fair dealing.", "Only Standard V(B) on communication with clients and prospective clients.", "Both Standard III(B) on fair dealing and V(B) on communication with clients and prospective clients."], "ans": "C", "expl": "Jim Matthews, by choosing to distribute his research opinions and updates on social media platforms, is likely violating both Standard III(B) on fair dealing and Standard V(B) on communication with clients and prospective clients. Standard III(B) emphasizes the equitable treatment of all clients by ensuring that investment recommendations and other pertinent information are disseminated fairly. By posting updates on Twitter and Facebook, where not all of his clients may be present or active, Matthews risks providing information to a subset of his client base, thereby disadvantaging others who do not use these platforms. This selective dissemination can lead to unequal access to potentially market-moving information, which is contrary to the principles of fair dealing. A is incorrect. While it is true that Matthews' actions could be seen as a violation of Standard III(B) on fair dealing, focusing solely on this standard overlooks another critical aspect of ethical conduct. Standard V(B) on communication with clients and prospective clients also plays a significant role in this scenario. This standard mandates that members and candidates use reasonable care to ensure that communications with clients and prospective clients are clear, accurate, and provide sufficient information. By limiting his communication to social media platforms, Matthews fails to ensure that all clients receive the information, which is necessary for maintaining transparency and trust. B is incorrect. Similarly, stating that Matthews only violates Standard V(B) is incomplete as it disregards the implications of his actions under Standard III(B). The fair and equitable treatment of all clients is a cornerstone of ethical conduct in finance, and Matthews' selective use of communication channels compromises this principle. Both standards are intrinsically linked in this case, as the method of communication directly impacts the fairness of information dissemination among clients. ", "explhtml": "<p>Jim Matthews, by choosing to distribute his research opinions and updates on social media platforms, is likely violating both Standard III(B) on fair dealing and Standard V(B) on communication with clients and prospective clients. Standard III(B) emphasizes the equitable treatment of all clients by ensuring that investment recommendations and other pertinent information are disseminated fairly. By posting updates on Twitter and Facebook, where not all of his clients may be present or active, Matthews risks providing information to a subset of his client base, thereby disadvantaging others who do not use these platforms. This selective dissemination can lead to unequal access to potentially market-moving information, which is contrary to the principles of fair dealing.<\/p><p><b>A is incorrect<\/b>. While it is true that Matthews&#x27; actions could be seen as a violation of Standard III(B) on fair dealing, focusing solely on this standard overlooks another critical aspect of ethical conduct. Standard V(B) on communication with clients and prospective clients also plays a significant role in this scenario. This standard mandates that members and candidates use reasonable care to ensure that communications with clients and prospective clients are clear, accurate, and provide sufficient information. By limiting his communication to social media platforms, Matthews fails to ensure that all clients receive the information, which is necessary for maintaining transparency and trust.<\/p><p><b>B is incorrect<\/b>. Similarly, stating that Matthews only violates Standard V(B) is incomplete as it disregards the implications of his actions under Standard III(B). The fair and equitable treatment of all clients is a cornerstone of ethical conduct in finance, and Matthews&#x27; selective use of communication channels compromises this principle. Both standards are intrinsically linked in this case, as the method of communication directly impacts the fairness of information dissemination among clients. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Alex Patel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alex Patel, CFA, recently started a small investment bank with two key business units: advisory services and trading and research services. His first two hires for this business are Eve Gollan, CFA, and Andrew Fitch, CFA. Gollan is responsible for the advisory business, while Fitch sets up the trading and research services.<\/p><p>Andrew Fitch previously worked in an independent research house and has professional relationships with many portfolio managers who may be willing to become clients of this new business. The portfolio manager with whom he has a good personal relationship has already begun setting up informal meetings. During one such meeting, Sara Murray, CFA, a portfolio manager at a USD 1 billion long/short equity hedge fund, told Fitch: &quot;I&#x27;m trying a different strategy for the next four weeks since my fund has been losing a lot of money lately. I hope this new strategy will help bring the YTD fund returns back on track and, hopefully, I will not need to tell my investors anything about the deviation I took from the investment mandate.”<\/p><p>Fitch has hired three research associates to build the research coverage for the new business. His research associates have been tasked with launching coverage on 50 stocks over the next two months. Maya Malik, CFA, one of the research associates, covers the auto sector and is ready to publish her first research report. The report covers the top five auto manufacturers and sources most of the industry data from the Auto Industry Association, a well-known source for industry statistics. After the report is published, she notices an error in one of the industry average numbers for the year 2001; Malik decides to ignore the error since it is a historical figure and, in her view, will not have any material impact on the quality of her report. Her report is well-received by investors and brings about considerable movement in the prices of four of the five stocks covered in her report. Andrew Fitch and Alex Patel are pleased with this development and feel that the new business is off to a great start.<\/p><p>The second research associate, Jim Matthews, covers telecom and media stocks and wants to use social media as his most preferred avenue for disseminating his research products to clients. Based on the information he has available from Fitch, the research division’s current client base is 325. Matthews has 325 followers on Twitter and 200 followers on Facebook. He starts actively posting his research opinions and updates on both of these platforms, but there are days when he is more active on one platform than the other.<\/p><\/div><\/details><div class=\"qtext\"><p>By distributing his research opinions and updates on social media platforms, Jim Matthews is most likely violating:<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Which of the following most likely violates CFA Standards in referencing the CFA program?", "opts": ["Referencing the institutional investing magazine article", "Stating that Malo passed the CFA curriculum in three years", "Stating that Malo is one of 10 Chartered Financial Analysts at LBO Capital"], "ans": "C", "expl": "According to the CFA Institute's Standards of Professional Conduct, the designation \"Chartered Financial Analyst\" or \"CFA\" must always be used as an adjective, not as a noun. Therefore, stating that someone is a \"Chartered Financial Analyst\" at a company implies that the designation itself is a job position or title, which it is not. The correct usage should be \"CFA Charterholder\" or \"holder of the CFA charter.\" This distinction is crucial as it respects the integrity and value of the CFA charter and ensures that the designation is used correctly to reflect the individual's qualification rather than as a job role. Misrepresenting this can mislead the public and other professionals about the nature of the CFA designation and the ethical standards upheld by its bearers. A is incorrect. Referencing an article from an institutional investment magazine that lists Malo as one of the top portfolio managers does not violate the CFA Standards. Standard VII(B) of the CFA Institute's Standards of Professional Conduct allows for the use of professional achievements and recognitions in communications, provided they are factual and not misleading. The reference to the magazine article is a factual representation of a recognition that Malo received and does not inappropriately reference the CFA designation or program. Therefore, this mention is compliant with the CFA standards and does not constitute a violation. B is incorrect. Stating that Malo passed the CFA curriculum in three consecutive years is a factual statement regarding her completion of the program and does not violate CFA Standards. Standard VII(B) requires that references to the CFA Program must be factually accurate and not misleading. This statement meets that criterion. This information does not imply superiority or guarantee future performance, but rather, it is a straightforward fact about Malo's educational background. Thus, this statement adheres to the ethical guidelines set forth by the CFA Institute.", "explhtml": "<p>According to the CFA Institute&#x27;s Standards of Professional Conduct, the designation &quot;Chartered Financial Analyst&quot; or &quot;CFA&quot; must always be used as an adjective, not as a noun. Therefore, stating that someone is a &quot;Chartered Financial Analyst&quot; at a company implies that the designation itself is a job position or title, which it is not. The correct usage should be &quot;CFA Charterholder&quot; or &quot;holder of the CFA charter.&quot; This distinction is crucial as it respects the integrity and value of the CFA charter and ensures that the designation is used correctly to reflect the individual&#x27;s qualification rather than as a job role. Misrepresenting this can mislead the public and other professionals about the nature of the CFA designation and the ethical standards upheld by its bearers.<\/p><p><b>A is incorrect<\/b>. Referencing an article from an institutional investment magazine that lists Malo as one of the top portfolio managers does not violate the CFA Standards. Standard VII(B) of the CFA Institute&#x27;s Standards of Professional Conduct allows for the use of professional achievements and recognitions in communications, provided they are factual and not misleading. The reference to the magazine article is a factual representation of a recognition that Malo received and does not inappropriately reference the CFA designation or program. Therefore, this mention is compliant with the CFA standards and does not constitute a violation.<\/p><p><b>B is incorrect<\/b>. Stating that Malo passed the CFA curriculum in three consecutive years is a factual statement regarding her completion of the program and does not violate CFA Standards. Standard VII(B) requires that references to the CFA Program must be factually accurate and not misleading. This statement meets that criterion. This information does not imply superiority or guarantee future performance, but rather, it is a straightforward fact about Malo&#x27;s educational background. Thus, this statement adheres to the ethical guidelines set forth by the CFA Institute.<\/p><p class=\"los\">Ethics, Learning Module 1: Code of Ethics and Standards of Professional Conduct, LOS 1(a): Describe the six components of the Code of Ethics and the seven Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Fernanda Malo<\/summary><div class=\"vig-body\"><p>Fernanda Malo, CFA, is a portfolio manager in the wealth management division of LBO Capital in Megapolis. She manages stock and fixed-income portfolios for individuals and institutions on a discretionary basis. Recently, Malo was approached by one of her colleagues, Hector Perez, who specializes in municipal fixed-income in the investment banking division. Perez discovered that Malo grew up in the small and isolated town of Center City. He is working on a competitive bid to underwrite a new bond issue that Center City is planning to use to finance the construction of a new library. Perez has asked Malo to help present the proposal because she knows most of the city council members. Perez believes she could help LBO Capital secure the business over two other competing firms. Malo is well-known in the community as a local with a modest background who has achieved success with one of the nation’s largest diversified financial firms. Perez tells Malo that her time would not be wasted, as she would be compensated with a finder’s fee if the firm could close the deal. Furthermore, Perez is only asking her to help with the client relationships. She would not be involved in any way with the bond issue itself. Malo agrees to allow for the good of the company. She also enjoys the thought of helping to improve her hometown.<\/p><p>Perez prepares marketing materials for the proposal. In a few weeks, Malo arranged to meet him at a coffee shop in Center City several hours before their presentation to the city&#x27;s selection committee to coordinate which parts of the presentation each would cover. As Malo looks over the printed material given to the committee members, she notices that Perez has included biographical and professional information about each of them and several other members of the investment banking division who will bring the bonds to market. LBO Capital is selected. In the section describing her, Malo reads that Perez has described her as a rising star at LBO Capital, highlighting that she passed all of the CFA® exams in three consecutive years and is one of only 10 CFAs in the wealth management arm. Perez also notes an article from an institutional investment magazine in Megapolis that lists Malo as one of the 10 best portfolio managers in the country. Malo has not seen any of this material before, and she thinks the description is slightly overindulgent. She is also concerned about compliance with CFA Standards dealing with references to the CFA designation and the CFA program. Nevertheless, the presentation is in an hour, and there is no time to have the presentation reprinted.<\/p><p>Before their interview at city hall, Malo runs into several old school friends who now work for the city. They are excited to see her and are interested in her firm’s work, which could potentially finance the new city library. An employee tells Malo that the library will be a great economic and morale boost for the city, especially after the largest manufacturing plant announced it would close next year unless it finds a buyer. Malo had not heard that news, and she realized that the plant closing could severely harm the city’s finances, as it is the largest employer in town.<\/p><p>The selection committee received Malo and Perez&#x27;s presentation well. Most of the members knew Malo from when she was a girl. They were impressed by the firm’s work with other cities on similar projects, and their proposed fees were lower than all the other competitors but one. A week later, Center City issues a press release stating that LBO Capital will be awarded the bond issue and announces a schedule outlining events that should culminate in bond issuance in a few months. However, since the interview, Malo has grown increasingly concerned about the financial situation at Center City. The financial position looks strong in the city&#x27;s latest disclosures, but she is concerned about the potential loss of the city&#x27;s largest employer. As a result, she liquidates Center City bonds from previous bond issues in many of her clients&#x27; portfolios.<\/p><p>A year later, one of the Center City city council members, with whom Malo reconnected, calls her and asks if she would be willing to manage his personal investment account. For his equity portfolio, he tells her that he would pay her beyond the compensation provided by LBO Capital based on the performance of his account each year. Based on current conditions and the historical performance of the stocks Malo invests in, she believes he can earn a 12% rate of return after fees for several more years.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following most likely violates CFA Standards in referencing the CFA program?<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "What is the most likely reason for Malo to disclose her receipt of private placement fees, even if it is not required by law to do so?", "opts": ["CFA® Standards does not require it.", "It lets clients know that her firm also does investment banking.", "It helps clients evaluate any possible partiality in the recommendation of services."], "ans": "C", "expl": "Disclosing private placement fees, even when not legally mandated, is crucial for maintaining transparency and trust in client relationships. In the context of Fernanda Malo's situation, where she receives a finder's fee for facilitating a bond issue, disclosure helps clients understand any potential biases or conflicts of interest that might influence her recommendations. This transparency is essential because it allows clients to assess the impartiality of the advice they are receiving. Clients need to be aware if their financial advisor might be swayed by additional compensation from other sources, which could potentially lead to recommendations that are more beneficial to the advisor than to the client. By disclosing such fees, Malo ensures that her clients can make fully informed decisions based on the complete picture of her motivations and financial incentives. A is incorrect. While the CFA® Standards emphasize the importance of transparency and integrity, they specifically mandate the disclosure of conflicts of interest and referral fees to allow clients to fully understand the financial relationships and potential biases of their advisors. However, the question specifically asks for the reason why Malo should disclose her receipt of private placement fees, focusing on the evaluation of service recommendations rather than the general requirement of the standards. Therefore, while related, this option does not directly address the core reason for disclosure in this scenario, which is to help clients evaluate any possible partiality in the recommendation of services. B is incorrect. Although letting clients know that her firm engages in investment banking might be informative, it does not directly address the primary concern of evaluating the impartiality of Malo's recommendations. The disclosure of Malo's private placement fees is specifically relevant in helping clients understand how her personal financial interests might intersect with her professional recommendations. This option, while potentially beneficial as additional information, does not capture the essential reason for disclosure in this context, which is to allow clients to assess any potential conflicts of interest that could affect the objectivity of her advice. ", "explhtml": "<p>Disclosing private placement fees, even when not legally mandated, is crucial for maintaining transparency and trust in client relationships. In the context of Fernanda Malo&#x27;s situation, where she receives a finder&#x27;s fee for facilitating a bond issue, disclosure helps clients understand any potential biases or conflicts of interest that might influence her recommendations. This transparency is essential because it allows clients to assess the impartiality of the advice they are receiving. Clients need to be aware if their financial advisor might be swayed by additional compensation from other sources, which could potentially lead to recommendations that are more beneficial to the advisor than to the client. By disclosing such fees, Malo ensures that her clients can make fully informed decisions based on the complete picture of her motivations and financial incentives.<\/p><p><b>A is incorrect<\/b>. While the CFA® Standards emphasize the importance of transparency and integrity, they specifically mandate the disclosure of conflicts of interest and referral fees to allow clients to fully understand the financial relationships and potential biases of their advisors. However, the question specifically asks for the reason why Malo should disclose her receipt of private placement fees, focusing on the evaluation of service recommendations rather than the general requirement of the standards. Therefore, while related, this option does not directly address the core reason for disclosure in this scenario, which is to help clients evaluate any possible partiality in the recommendation of services.<\/p><p><b>B is incorrect<\/b>. Although letting clients know that her firm engages in investment banking might be informative, it does not directly address the primary concern of evaluating the impartiality of Malo&#x27;s recommendations. The disclosure of Malo&#x27;s private placement fees is specifically relevant in helping clients understand how her personal financial interests might intersect with her professional recommendations. This option, while potentially beneficial as additional information, does not capture the essential reason for disclosure in this context, which is to allow clients to assess any potential conflicts of interest that could affect the objectivity of her advice. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(b): Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Fernanda Malo<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Fernanda Malo, CFA, is a portfolio manager in the wealth management division of LBO Capital in Megapolis. She manages stock and fixed-income portfolios for individuals and institutions on a discretionary basis. Recently, Malo was approached by one of her colleagues, Hector Perez, who specializes in municipal fixed-income in the investment banking division. Perez discovered that Malo grew up in the small and isolated town of Center City. He is working on a competitive bid to underwrite a new bond issue that Center City is planning to use to finance the construction of a new library. Perez has asked Malo to help present the proposal because she knows most of the city council members. Perez believes she could help LBO Capital secure the business over two other competing firms. Malo is well-known in the community as a local with a modest background who has achieved success with one of the nation’s largest diversified financial firms. Perez tells Malo that her time would not be wasted, as she would be compensated with a finder’s fee if the firm could close the deal. Furthermore, Perez is only asking her to help with the client relationships. She would not be involved in any way with the bond issue itself. Malo agrees to allow for the good of the company. She also enjoys the thought of helping to improve her hometown.<\/p><p>Perez prepares marketing materials for the proposal. In a few weeks, Malo arranged to meet him at a coffee shop in Center City several hours before their presentation to the city&#x27;s selection committee to coordinate which parts of the presentation each would cover. As Malo looks over the printed material given to the committee members, she notices that Perez has included biographical and professional information about each of them and several other members of the investment banking division who will bring the bonds to market. LBO Capital is selected. In the section describing her, Malo reads that Perez has described her as a rising star at LBO Capital, highlighting that she passed all of the CFA® exams in three consecutive years and is one of only 10 CFAs in the wealth management arm. Perez also notes an article from an institutional investment magazine in Megapolis that lists Malo as one of the 10 best portfolio managers in the country. Malo has not seen any of this material before, and she thinks the description is slightly overindulgent. She is also concerned about compliance with CFA Standards dealing with references to the CFA designation and the CFA program. Nevertheless, the presentation is in an hour, and there is no time to have the presentation reprinted.<\/p><p>Before their interview at city hall, Malo runs into several old school friends who now work for the city. They are excited to see her and are interested in her firm’s work, which could potentially finance the new city library. An employee tells Malo that the library will be a great economic and morale boost for the city, especially after the largest manufacturing plant announced it would close next year unless it finds a buyer. Malo had not heard that news, and she realized that the plant closing could severely harm the city’s finances, as it is the largest employer in town.<\/p><p>The selection committee received Malo and Perez&#x27;s presentation well. Most of the members knew Malo from when she was a girl. They were impressed by the firm’s work with other cities on similar projects, and their proposed fees were lower than all the other competitors but one. A week later, Center City issues a press release stating that LBO Capital will be awarded the bond issue and announces a schedule outlining events that should culminate in bond issuance in a few months. However, since the interview, Malo has grown increasingly concerned about the financial situation at Center City. The financial position looks strong in the city&#x27;s latest disclosures, but she is concerned about the potential loss of the city&#x27;s largest employer. As a result, she liquidates Center City bonds from previous bond issues in many of her clients&#x27; portfolios.<\/p><p>A year later, one of the Center City city council members, with whom Malo reconnected, calls her and asks if she would be willing to manage his personal investment account. For his equity portfolio, he tells her that he would pay her beyond the compensation provided by LBO Capital based on the performance of his account each year. Based on current conditions and the historical performance of the stocks Malo invests in, she believes he can earn a 12% rate of return after fees for several more years.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the most likely reason for Malo to disclose her receipt of private placement fees, even if it is not required by law to do so?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "In reference to the Center City city council member and the additional compensation arrangement, Malo should most likely:", "opts": ["Obtain permission from her employer before accepting the compensation arrangement.", "Tell the member that it would be a conflict of interest due to the firm’s investment banking relationship.", "Turn down the additional compensation because it will result in conflicts of interests with other client accounts."], "ans": "A", "expl": "Fernanda Malo, CFA, should indeed obtain permission from her employer before accepting the compensation arrangement with the Center City council member. According to the CFA Institute's Standards of Professional Conduct, investment professionals must not accept gifts, benefits, compensation, or consideration that competes with their employer's interest unless they obtain written consent from all parties involved. This standard is designed to prevent potential conflicts of interest that might impair their ability to make unbiased and objective recommendations. By seeking permission, Malo ensures transparency and maintains her professional integrity, while also adhering to the ethical guidelines set forth by the CFA Institute. This action safeguards the interests of all parties and upholds the trust placed in her as a CFA Charterholder and a portfolio manager. B is incorrect. While it is crucial to avoid conflicts of interest, simply telling the council member that the arrangement would be a conflict of interest due to the firm’s investment banking relationship does not address the underlying issue adequately. The CFA Standards require disclosure and explicit permission from the employer when entering into additional compensation arrangements. It is not merely the existence of a conflict that must be managed, but how it is disclosed and formally approved. Therefore, while potential conflicts should be a concern, the correct procedure involves seeking employer approval after full disclosure, rather than outright dismissal based on presumed conflict. C is incorrect. Turning down the additional compensation solely on the basis that it will result in conflicts of interest with other client accounts is overly simplistic and not necessarily required under the CFA Standards. The Standards permit additional compensation arrangements, provided they are disclosed to and approved by the employer. This ensures that any potential conflicts are managed appropriately. Malo has the opportunity to continue serving the council member's interests without compromising her obligations to other clients, provided that she adheres to the proper disclosure and approval processes outlined in the CFA Standards. ", "explhtml": "<p>Fernanda Malo, CFA, should indeed obtain permission from her employer before accepting the compensation arrangement with the Center City council member. According to the CFA Institute&#x27;s Standards of Professional Conduct, investment professionals must not accept gifts, benefits, compensation, or consideration that competes with their employer&#x27;s interest unless they obtain written consent from all parties involved. This standard is designed to prevent potential conflicts of interest that might impair their ability to make unbiased and objective recommendations. By seeking permission, Malo ensures transparency and maintains her professional integrity, while also adhering to the ethical guidelines set forth by the CFA Institute. This action safeguards the interests of all parties and upholds the trust placed in her as a CFA Charterholder and a portfolio manager.<\/p><p><b>B is incorrect<\/b>. While it is crucial to avoid conflicts of interest, simply telling the council member that the arrangement would be a conflict of interest due to the firm’s investment banking relationship does not address the underlying issue adequately. The CFA Standards require disclosure and explicit permission from the employer when entering into additional compensation arrangements. It is not merely the existence of a conflict that must be managed, but how it is disclosed and formally approved. Therefore, while potential conflicts should be a concern, the correct procedure involves seeking employer approval after full disclosure, rather than outright dismissal based on presumed conflict.<\/p><p><b>C is incorrect<\/b>. Turning down the additional compensation solely on the basis that it will result in conflicts of interest with other client accounts is overly simplistic and not necessarily required under the CFA Standards. The Standards permit additional compensation arrangements, provided they are disclosed to and approved by the employer. This ensures that any potential conflicts are managed appropriately. Malo has the opportunity to continue serving the council member&#x27;s interests without compromising her obligations to other clients, provided that she adheres to the proper disclosure and approval processes outlined in the CFA Standards. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Fernanda Malo<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Fernanda Malo, CFA, is a portfolio manager in the wealth management division of LBO Capital in Megapolis. She manages stock and fixed-income portfolios for individuals and institutions on a discretionary basis. Recently, Malo was approached by one of her colleagues, Hector Perez, who specializes in municipal fixed-income in the investment banking division. Perez discovered that Malo grew up in the small and isolated town of Center City. He is working on a competitive bid to underwrite a new bond issue that Center City is planning to use to finance the construction of a new library. Perez has asked Malo to help present the proposal because she knows most of the city council members. Perez believes she could help LBO Capital secure the business over two other competing firms. Malo is well-known in the community as a local with a modest background who has achieved success with one of the nation’s largest diversified financial firms. Perez tells Malo that her time would not be wasted, as she would be compensated with a finder’s fee if the firm could close the deal. Furthermore, Perez is only asking her to help with the client relationships. She would not be involved in any way with the bond issue itself. Malo agrees to allow for the good of the company. She also enjoys the thought of helping to improve her hometown.<\/p><p>Perez prepares marketing materials for the proposal. In a few weeks, Malo arranged to meet him at a coffee shop in Center City several hours before their presentation to the city&#x27;s selection committee to coordinate which parts of the presentation each would cover. As Malo looks over the printed material given to the committee members, she notices that Perez has included biographical and professional information about each of them and several other members of the investment banking division who will bring the bonds to market. LBO Capital is selected. In the section describing her, Malo reads that Perez has described her as a rising star at LBO Capital, highlighting that she passed all of the CFA® exams in three consecutive years and is one of only 10 CFAs in the wealth management arm. Perez also notes an article from an institutional investment magazine in Megapolis that lists Malo as one of the 10 best portfolio managers in the country. Malo has not seen any of this material before, and she thinks the description is slightly overindulgent. She is also concerned about compliance with CFA Standards dealing with references to the CFA designation and the CFA program. Nevertheless, the presentation is in an hour, and there is no time to have the presentation reprinted.<\/p><p>Before their interview at city hall, Malo runs into several old school friends who now work for the city. They are excited to see her and are interested in her firm’s work, which could potentially finance the new city library. An employee tells Malo that the library will be a great economic and morale boost for the city, especially after the largest manufacturing plant announced it would close next year unless it finds a buyer. Malo had not heard that news, and she realized that the plant closing could severely harm the city’s finances, as it is the largest employer in town.<\/p><p>The selection committee received Malo and Perez&#x27;s presentation well. Most of the members knew Malo from when she was a girl. They were impressed by the firm’s work with other cities on similar projects, and their proposed fees were lower than all the other competitors but one. A week later, Center City issues a press release stating that LBO Capital will be awarded the bond issue and announces a schedule outlining events that should culminate in bond issuance in a few months. However, since the interview, Malo has grown increasingly concerned about the financial situation at Center City. The financial position looks strong in the city&#x27;s latest disclosures, but she is concerned about the potential loss of the city&#x27;s largest employer. As a result, she liquidates Center City bonds from previous bond issues in many of her clients&#x27; portfolios.<\/p><p>A year later, one of the Center City city council members, with whom Malo reconnected, calls her and asks if she would be willing to manage his personal investment account. For his equity portfolio, he tells her that he would pay her beyond the compensation provided by LBO Capital based on the performance of his account each year. Based on current conditions and the historical performance of the stocks Malo invests in, she believes he can earn a 12% rate of return after fees for several more years.<\/p><\/div><\/details><div class=\"qtext\"><p>In reference to the Center City city council member and the additional compensation arrangement, Malo should most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "Did Malo’s statement to the city council member about expected performance most likely violate the CFA Institute Code and Standards?", "opts": ["No", "Yes, since she cannot guarantee returns", "Yes, because she exaggerates her investment performance"], "ans": "A", "expl": "Fernanda Malo's statement to the city council member about the expected performance of his investment portfolio does not violate the CFA Institute Code and Standards. Malo's comment that the council member \"could earn a 12% rate of return after fees for several more years\" is an expression of her professional judgment based on historical data and current market conditions. It is important to note that she used th
