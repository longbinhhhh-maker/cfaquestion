son, which could mislead investors about the fund's ability to consistently outperform the benchmark. A is incorrect. Misrepresentation refers to false or exaggerated claims, and while the information presented may be technically accurate for the chosen time frame, the main issue is the incomplete comparison. C is incorrect. The issue is not the use of an industry benchmark per se but how the comparison to the benchmark is presented.", "explhtml": "<p>By choosing a specific time frame where the fund outperformed due to unusual market conditions and not presenting a full view of the fund’s performance across different market conditions, Harper’s article fails to provide a fair and complete comparison, which could mislead investors about the fund&#x27;s ability to consistently outperform the benchmark.<\/p><p><b>A is incorrect.<\/b> Misrepresentation refers to false or exaggerated claims, and while the information presented may be technically accurate for the chosen time frame, the main issue is the incomplete comparison.<\/p><p><b>C is incorrect.<\/b> The issue is not the use of an industry benchmark per se but how the comparison to the benchmark is presented.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Global Wealth Management (GWM)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Harper Lee, CFA, is the director of wealth management at Global Wealth Pooled Funds (GWM), a<\/p><p>firm offering a range of investment solutions catered to institutional and HNW individual clients.<\/p><p>One of GWM’s flagship products is the Global Dynamic Allocation Fund (GDAF), a globally<\/p><p>diversified multi-asset fund that aims to dynamically allocate between stocks, bonds, and<\/p><p>alternative investments to optimize risk-adjusted returns.<\/p><p>GWM, with Harper’s encouragement, has made significant investments in sophisticated<\/p><p>analytical tools to improve its ability to forecast market trends and evaluate investment<\/p><p>opportunities. These tools form the backbone of GWM’s quantitative model, which Harper has<\/p><p>marketed aggressively on the premise that it allows GWM to stay ahead of market curves.<\/p><p>Jeremy Smith, a marketing associate at GWM, is tasked with creating marketing materials for<\/p><p>the upcoming quarter. Jeremy, who is not a CFA charterholder, uses performance figures in a way<\/p><p>that places GWM in a favorable light without providing the context of overall market conditions<\/p><p>at the time. Furthermore, he includes testimonials from select clients who had exceptional<\/p><p>returns, attributing their success to GWM’s fund management strategies.<\/p><p>During a client review meeting, Harper presents GWM’s outlook and the impressive back-tested<\/p><p>results of the new quantitative model as indicators of the model&#x27;s future performance potential.<\/p><p>However, Harper fails to discuss the limitations of back-testing and does not mention that past<\/p><p>performance is not indicative of future results.<\/p><p>In their latest quarterly newsletter, Harper writes an article comparing GWM&#x27;s GDAF to an<\/p><p>industry benchmark index. The index chosen is applicable to the fund&#x27;s investment style, but the<\/p><p>time period selected for the comparison is when the GDAF notably outperformed the index due<\/p><p>to a temporary market anomaly that favored GWM&#x27;s investment style. No mention is made of the<\/p><p>more modest performance of the GDAF across most other time frames.<\/p><p><b>Data Table<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0011.webp\" style=\"max-width:min(100%,517px)\" alt=\"Quarter GDAF Industry Overall Return (%) Benchmark Market Index Return (%) Condition Q4 2021 6.0 4.0 Bull Market Q1 2022 −1.0 −2.0 Market Correction Q2 2022 2.5 2.0 Recovering Market Q3 2022 10.0 3.0 Market Anomaly (Anomaly) Favoring GWM’s style Q4 2022 3.0 3.5 Stable Market\"><p><b>Note:<\/b> The performance figures have been annualized for the duration of each quarter.<\/p><\/div><\/details><div class=\"qtext\"><p>The selection of an industry benchmark in the quarterly newsletter that only highlights periods of outperformance by GDAF is most indicative of a breach of Standard V (B) due to:<\/p><\/div>", "subj": "ethics"}, {"n": 48, "q": "How should Harper address the issue of selective performance reporting by Jeremy to ensure compliance with Standard V (B)?", "opts": ["Order the immediate removal of all current marketing materials and provide comprehensive training to marketing staff on Standards compliance.", "Revise the marketing materials to include a fully representative range of past performance and issue a statement clarifying the context of any previously published figures.", "Address the marketing team to encourage a more balanced approach in future materials and leave the current content as is to avoid alarming current clients."], "ans": "B", "expl": "To address the selective performance reporting, Harper should ensure that GWM's marketing materials present a complete and fair view of the performance. This action will align with Standard V (B) and correct any potential misinformation in the previously published materials. A is incorrect. While immediate removal and training are appropriate steps, it does not address the need to correct past communications. C is incorrect. It does not rectify the potential misinformation that has already been communicated, and leaving misleading content uncorrected could continue to mislead clients.", "explhtml": "<p>To address the selective performance reporting, Harper should ensure that GWM&#x27;s marketing materials present a complete and fair view of the performance. This action will align with Standard V (B) and correct any potential misinformation in the previously published materials.<\/p><p><b>A is incorrect.<\/b> While immediate removal and training are appropriate steps, it does not address the need to correct past communications.<\/p><p><b>C is incorrect.<\/b> It does not rectify the potential misinformation that has already been communicated, and leaving misleading content uncorrected could continue to mislead clients.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Global Wealth Management (GWM)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Harper Lee, CFA, is the director of wealth management at Global Wealth Pooled Funds (GWM), a<\/p><p>firm offering a range of investment solutions catered to institutional and HNW individual clients.<\/p><p>One of GWM’s flagship products is the Global Dynamic Allocation Fund (GDAF), a globally<\/p><p>diversified multi-asset fund that aims to dynamically allocate between stocks, bonds, and<\/p><p>alternative investments to optimize risk-adjusted returns.<\/p><p>GWM, with Harper’s encouragement, has made significant investments in sophisticated<\/p><p>analytical tools to improve its ability to forecast market trends and evaluate investment<\/p><p>opportunities. These tools form the backbone of GWM’s quantitative model, which Harper has<\/p><p>marketed aggressively on the premise that it allows GWM to stay ahead of market curves.<\/p><p>Jeremy Smith, a marketing associate at GWM, is tasked with creating marketing materials for<\/p><p>the upcoming quarter. Jeremy, who is not a CFA charterholder, uses performance figures in a way<\/p><p>that places GWM in a favorable light without providing the context of overall market conditions<\/p><p>at the time. Furthermore, he includes testimonials from select clients who had exceptional<\/p><p>returns, attributing their success to GWM’s fund management strategies.<\/p><p>During a client review meeting, Harper presents GWM’s outlook and the impressive back-tested<\/p><p>results of the new quantitative model as indicators of the model&#x27;s future performance potential.<\/p><p>However, Harper fails to discuss the limitations of back-testing and does not mention that past<\/p><p>performance is not indicative of future results.<\/p><p>In their latest quarterly newsletter, Harper writes an article comparing GWM&#x27;s GDAF to an<\/p><p>industry benchmark index. The index chosen is applicable to the fund&#x27;s investment style, but the<\/p><p>time period selected for the comparison is when the GDAF notably outperformed the index due<\/p><p>to a temporary market anomaly that favored GWM&#x27;s investment style. No mention is made of the<\/p><p>more modest performance of the GDAF across most other time frames.<\/p><p><b>Data Table<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0011.webp\" style=\"max-width:min(100%,517px)\" alt=\"Quarter GDAF Industry Overall Return (%) Benchmark Market Index Return (%) Condition Q4 2021 6.0 4.0 Bull Market Q1 2022 −1.0 −2.0 Market Correction Q2 2022 2.5 2.0 Recovering Market Q3 2022 10.0 3.0 Market Anomaly (Anomaly) Favoring GWM’s style Q4 2022 3.0 3.5 Stable Market\"><p><b>Note:<\/b> The performance figures have been annualized for the duration of each quarter.<\/p><\/div><\/details><div class=\"qtext\"><p>How should Harper address the issue of selective performance reporting by Jeremy to ensure compliance with Standard V (B)?<\/p><\/div>", "subj": "ethics"}, {"n": 49, "q": "Caleb's directive to ensure that all paperwork for the CFA Institute Asset Manager Code Award aligns with their expectations, potentially misrepresenting the rigor of PEP's compliance processes, least likely violates which CFA Institute Standard?", "opts": ["Standard I (D) - Misconduct.", "Standard VI (C) - Referral Fees.", "Standard VI (A) – Avoid or Disclose Conflicts."], "ans": "B", "expl": "Standard VI (C) - Referral Fees pertains to the disclosure of referral compensation agreements, which is not relevant to the situation described. A and C are incorrect. Standard I (D) - Misconduct addresses conduct involving dishonesty, fraud, or deceit, which Caleb's directive to misrepresent compliance processes might violate. Standard VI (A) - Avoid or Disclose Conflicts requires members and candidates to make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employers. By urging Keith Nolan to present the compliance procedures as more rigorous than they are, Caleb may be misleading the CFA Institute and potential clients about PEP's adherence to its standards, compromising transparency and potentially creating a conflict of interest.", "explhtml": "<p>Standard VI (C) - Referral Fees pertains to the disclosure of referral compensation agreements, which is not relevant to the situation described.<\/p><p><b>A and C are incorrect.<\/b><\/p><p>Standard I (D) - Misconduct addresses conduct involving dishonesty, fraud, or deceit, which Caleb&#x27;s directive to misrepresent compliance processes might violate.<\/p><p>Standard VI (A) - Avoid or Disclose Conflicts requires members and candidates to make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employers. By urging Keith Nolan to present the compliance procedures as more rigorous than they are, Caleb may be misleading the CFA Institute and potential clients about PEP&#x27;s adherence to its standards, compromising transparency and potentially creating a conflict of interest.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Prestige Equity Partners<\/summary><div class=\"vig-body\"><p>Caleb Johnson, CFA, is the Chief Investment Officer (CIO) at Prestige Equity Partners (PEP), a<\/p><p>well-established investment management firm that offers various equity funds to both<\/p><p>institutional investors and retail clients. PEP prides itself on its ethical culture and strong<\/p><p>adherence to regulatory compliance.<\/p><p>PEP recently decided to launch a new fund focusing on environmental, social, and governance<\/p><p>(ESG) criteria. To meet the anticipated demand for ESG investments and strengthen the firm&#x27;s<\/p><p>reputation as a responsible investor, Caleb creates the Prestige ESG Impact Fund (PEIF). Caleb<\/p><p>is particularly excited about this initiative since he believes social responsibility goes hand-in-<\/p><p>hand with long-term profitability.<\/p><p>In preparation for the new fund&#x27;s launch, Caleb directs his team to integrate ESG factors into<\/p><p>their investment analysis rigorously. However, Emily Wilson, a senior analyst, expresses concern<\/p><p>that the data currently available on the ESG performance of potential investments is often patchy<\/p><p>or non-standardized, which could impede robust analysis.<\/p><p>Meanwhile, Caleb faces pressure from PEP’s board to showcase immediate, strong results from<\/p><p>PEIF to attract investors. To ramp up the launch, Caleb decides to allocate a sizable portion of<\/p><p>PEIF to an electric vehicle (EV) company known for its rapid growth. This company, though, has<\/p><p>recently faced criticism over its governance practices and the environmental impact of its<\/p><p>battery production.<\/p><p>Caleb is featured in an industry publication where he enthusiastically discusses the expected<\/p><p>outperformance of ESG-focused funds, citing the superior ESG ratings PEP uses for investment<\/p><p>selection without mentioning that these ratings often lack standardization and are based on self-<\/p><p>reported company data.<\/p><p>At the same fiscal year-end, PEP is due for consideration by the CFA Institute Asset Manager<\/p><p>Code Award. Caleb believes that receiving this recognition would greatly enhance PEP’s<\/p><p>reputation and attract more clients. He therefore urges his compliance officer, Keith Nolan, to<\/p><p>ensure all paperwork and evidence align perfectly with the CFA Institute&#x27;s expectations, even if it<\/p><p>means presenting certain compliance processes as more rigorous than they are in practice.<\/p><p>Due to the significant allocation of PEIF in the EV company, one board member, Laura Bennet,<\/p><p>suggests a disclosure to investors regarding the potential risks associated with the company’s<\/p><p>governance issues. However, Caleb reassures the board that the overall ESG score of the PEIF is<\/p><p>high, and specific company issues are too nuanced to be included in fund-level disclosures.<\/p><p><b>Data Table<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0012.webp\" style=\"max-width:min(100%,578px)\" alt=\"Investment ESG Score Industry Average Notable ESG Score Issues EV Company 70 65 Governance and Environmental Impact Solar Company 85 75 None Water Utility 90 80 Social (Community Concerns)\"><p>*ESG scores are on a scale of 0 to 100, with 100 being the highest.<\/p><\/div><\/details><div class=\"qtext\"><p>Caleb&#x27;s directive to ensure that all paperwork for the CFA Institute Asset Manager Code Award aligns with their expectations, potentially misrepresenting the rigor of PEP&#x27;s compliance processes, least likely violates which CFA Institute Standard?<\/p><\/div>", "subj": "ethics"}, {"n": 50, "q": "By choosing to not include specific company issues in the PEIF fund-level disclosures, Caleb primarily runs the risk of violating which Standard related to investment actions and communications with clients?", "opts": ["Standard III (C) - Suitability.", "Standard V (A) - Diligence and Reasonable Basis.", "Standard VI (A) - Avoid or Disclose Conflicts."], "ans": "C", "expl": "Standard VI (A) - Avoid or Disclose Conflicts mandates full and fair disclosure of all facts that could reasonably compromise the transparency and understanding of risks by clients. By choosing not to disclose the specific governance and environmental risks associated with the EV company to investors, Caleb is not providing complete information that could influence clients’ investment decisions. A is incorrect. Suitability concerns whether investment actions are consistent with client objectives, which is not the primary issue in this context. B is incorrect. Diligence and Reasonable Basis is about performing appropriate due diligence on investments, and while related, the primary concern here is about disclosure of known risks.", "explhtml": "<p>Standard VI (A) - Avoid or Disclose Conflicts mandates full and fair disclosure of all facts that could reasonably compromise the transparency and understanding of risks by clients. By choosing not to disclose the specific governance and environmental risks associated with the EV company to investors, Caleb is not providing complete information that could influence clients’ investment decisions.<\/p><p><b>A is incorrect.<\/b> Suitability concerns whether investment actions are consistent with client objectives, which is not the primary issue in this context.<\/p><p><b>B is incorrect.<\/b> Diligence and Reasonable Basis is about performing appropriate due diligence on investments, and while related, the primary concern here is about disclosure of known risks.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Prestige Equity Partners<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Caleb Johnson, CFA, is the Chief Investment Officer (CIO) at Prestige Equity Partners (PEP), a<\/p><p>well-established investment management firm that offers various equity funds to both<\/p><p>institutional investors and retail clients. PEP prides itself on its ethical culture and strong<\/p><p>adherence to regulatory compliance.<\/p><p>PEP recently decided to launch a new fund focusing on environmental, social, and governance<\/p><p>(ESG) criteria. To meet the anticipated demand for ESG investments and strengthen the firm&#x27;s<\/p><p>reputation as a responsible investor, Caleb creates the Prestige ESG Impact Fund (PEIF). Caleb<\/p><p>is particularly excited about this initiative since he believes social responsibility goes hand-in-<\/p><p>hand with long-term profitability.<\/p><p>In preparation for the new fund&#x27;s launch, Caleb directs his team to integrate ESG factors into<\/p><p>their investment analysis rigorously. However, Emily Wilson, a senior analyst, expresses concern<\/p><p>that the data currently available on the ESG performance of potential investments is often patchy<\/p><p>or non-standardized, which could impede robust analysis.<\/p><p>Meanwhile, Caleb faces pressure from PEP’s board to showcase immediate, strong results from<\/p><p>PEIF to attract investors. To ramp up the launch, Caleb decides to allocate a sizable portion of<\/p><p>PEIF to an electric vehicle (EV) company known for its rapid growth. This company, though, has<\/p><p>recently faced criticism over its governance practices and the environmental impact of its<\/p><p>battery production.<\/p><p>Caleb is featured in an industry publication where he enthusiastically discusses the expected<\/p><p>outperformance of ESG-focused funds, citing the superior ESG ratings PEP uses for investment<\/p><p>selection without mentioning that these ratings often lack standardization and are based on self-<\/p><p>reported company data.<\/p><p>At the same fiscal year-end, PEP is due for consideration by the CFA Institute Asset Manager<\/p><p>Code Award. Caleb believes that receiving this recognition would greatly enhance PEP’s<\/p><p>reputation and attract more clients. He therefore urges his compliance officer, Keith Nolan, to<\/p><p>ensure all paperwork and evidence align perfectly with the CFA Institute&#x27;s expectations, even if it<\/p><p>means presenting certain compliance processes as more rigorous than they are in practice.<\/p><p>Due to the significant allocation of PEIF in the EV company, one board member, Laura Bennet,<\/p><p>suggests a disclosure to investors regarding the potential risks associated with the company’s<\/p><p>governance issues. However, Caleb reassures the board that the overall ESG score of the PEIF is<\/p><p>high, and specific company issues are too nuanced to be included in fund-level disclosures.<\/p><p><b>Data Table<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0012.webp\" style=\"max-width:min(100%,578px)\" alt=\"Investment ESG Score Industry Average Notable ESG Score Issues EV Company 70 65 Governance and Environmental Impact Solar Company 85 75 None Water Utility 90 80 Social (Community Concerns)\"><p>*ESG scores are on a scale of 0 to 100, with 100 being the highest.<\/p><\/div><\/details><div class=\"qtext\"><p>By choosing to not include specific company issues in the PEIF fund-level disclosures, Caleb primarily runs the risk of violating which Standard related to investment actions and communications with clients?<\/p><\/div>", "subj": "ethics"}, {"n": 51, "q": "Promoting the PEIF based on expected outperformance and superior ESG ratings, without discussing the ratings' limitations, could likely contravene which CFA Institute standard regarding investment performance and communications?", "opts": ["Standard III (D) - Performance Presentation.", "Standard V (B) - Communication with Clients and Prospective Clients.", "Standard VI (B) - Priority of Transactions."], "ans": "B", "expl": "Standard V (B) requires fair, accurate, and complete disclosures that are not misleading. Caleb’s failure to explain the limitations of the ESG ratings could lead clients to have unwarranted expectations about the ESG performance of their investments and the due diligence involved in PEP's investment selection process. A is incorrect. Performance Presentation is specifically about the presentation of past performance, rather than the projections or expectations of future performance. C is incorrect. Priority of Transactions pertains to members' personal investment transactions, not communication or performance expectations with clients.", "explhtml": "<p>Standard V (B) requires fair, accurate, and complete disclosures that are not misleading. Caleb’s failure to explain the limitations of the ESG ratings could lead clients to have unwarranted expectations about the ESG performance of their investments and the due diligence involved in PEP&#x27;s investment selection process.<\/p><p><b>A is incorrect.<\/b> Performance Presentation is specifically about the presentation of past performance, rather than the projections or expectations of future performance.<\/p><p><b>C is incorrect.<\/b> Priority of Transactions pertains to members&#x27; personal investment transactions, not communication or performance expectations with clients.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Prestige Equity Partners<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Caleb Johnson, CFA, is the Chief Investment Officer (CIO) at Prestige Equity Partners (PEP), a<\/p><p>well-established investment management firm that offers various equity funds to both<\/p><p>institutional investors and retail clients. PEP prides itself on its ethical culture and strong<\/p><p>adherence to regulatory compliance.<\/p><p>PEP recently decided to launch a new fund focusing on environmental, social, and governance<\/p><p>(ESG) criteria. To meet the anticipated demand for ESG investments and strengthen the firm&#x27;s<\/p><p>reputation as a responsible investor, Caleb creates the Prestige ESG Impact Fund (PEIF). Caleb<\/p><p>is particularly excited about this initiative since he believes social responsibility goes hand-in-<\/p><p>hand with long-term profitability.<\/p><p>In preparation for the new fund&#x27;s launch, Caleb directs his team to integrate ESG factors into<\/p><p>their investment analysis rigorously. However, Emily Wilson, a senior analyst, expresses concern<\/p><p>that the data currently available on the ESG performance of potential investments is often patchy<\/p><p>or non-standardized, which could impede robust analysis.<\/p><p>Meanwhile, Caleb faces pressure from PEP’s board to showcase immediate, strong results from<\/p><p>PEIF to attract investors. To ramp up the launch, Caleb decides to allocate a sizable portion of<\/p><p>PEIF to an electric vehicle (EV) company known for its rapid growth. This company, though, has<\/p><p>recently faced criticism over its governance practices and the environmental impact of its<\/p><p>battery production.<\/p><p>Caleb is featured in an industry publication where he enthusiasti select investments for PEIF that will demonstrate adherence to Standard VI (A) should:", "opts": ["Emphasize the outperformance potential of ESG investments based on historical trends.", "Rely exclusively on ESG ratings provided by reputable third-party agencies.", "Include a thorough explanation of the ESG evaluation process, highlighting any data quality concerns and how they are addressed."], "ans": "C", "expl": "Disclosures that adhere to Standard VI (A) need to provide a full and fair presentation of the investment process, including potential data limitations and the steps taken to mitigate their impact. This provides a clear view of the approach's thoroughness and allows clients to make informed choices. A is incorrect. Emphasizing outperformance potential based on historical trends without addressing data limitations might mislead clients. B is incorrect. Relying solely on third-party ratings without conducting an independent assessment may not align with the detailed disclosure required to ensure informed decision-making by clients.", "explhtml": "<p>Disclosures that adhere to Standard VI (A) need to provide a full and fair presentation of the investment process, including potential data limitations and the steps taken to mitigate their impact. This provides a clear view of the approach&#x27;s thoroughness and allows clients to make informed choices.<\/p><p><b>A is incorrect.<\/b> Emphasizing outperformance potential based on historical trends without addressing data limitations might mislead clients.<\/p><p><b>B is incorrect.<\/b> Relying solely on third-party ratings without conducting an independent assessment may not align with the detailed disclosure required to ensure informed decision-making by clients.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Prestige Equity Partners<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Caleb Johnson, CFA, is the Chief Investment Officer (CIO) at Prestige Equity Partners (PEP), a<\/p><p>well-established investment management firm that offers various equity funds to both<\/p><p>institutional investors and retail clients. PEP prides itself on its ethical culture and strong<\/p><p>adherence to regulatory compliance.<\/p><p>PEP recently decided to launch a new fund focusing on environmental, social, and governance<\/p><p>(ESG) criteria. To meet the anticipated demand for ESG investments and strengthen the firm&#x27;s<\/p><p>reputation as a responsible investor, Caleb creates the Prestige ESG Impact Fund (PEIF). Caleb<\/p><p>is particularly excited about this initiative since he believes social responsibility goes hand-in-<\/p><p>hand with long-term profitability.<\/p><p>In preparation for the new fund&#x27;s launch, Caleb directs his team to integrate ESG factors into<\/p><p>their investment analysis rigorously. However, Emily Wilson, a senior analyst, expresses concern<\/p><p>that the data currently available on the ESG performance of potential investments is often patchy<\/p><p>or non-standardized, which could impede robust analysis.<\/p><p>Meanwhile, Caleb faces pressure from PEP’s board to showcase immediate, strong results from<\/p><p>PEIF to attract investors. To ramp up the launch, Caleb decides to allocate a sizable portion of<\/p><p>PEIF to an electric vehicle (EV) company known for its rapid growth. This company, though, has<\/p><p>recently faced criticism over its governance practices and the environmental impact of its<\/p><p>battery production.<\/p><p>Caleb is featured in an industry publication where he enthusiastically discusses the expected<\/p><p>outperformance of ESG-focused funds, citing the superior ESG ratings PEP uses for investment<\/p><p>selection without mentioning that these ratings often lack standardization and are based on self-<\/p><p>reported company data.<\/p><p>At the same fiscal year-end, PEP is due for consideration by the CFA Institute Asset Manager<\/p><p>Code Award. Caleb believes that receiving this recognition would greatly enhance PEP’s<\/p><p>reputation and attract more clients. He therefore urges his compliance officer, Keith Nolan, to<\/p><p>ensure all paperwork and evidence align perfectly with the CFA Institute&#x27;s expectations, even if it<\/p><p>means presenting certain compliance processes as more rigorous than they are in practice.<\/p><p>Due to the significant allocation of PEIF in the EV company, one board member, Laura Bennet,<\/p><p>suggests a disclosure to investors regarding the potential risks associated with the company’s<\/p><p>governance issues. However, Caleb reassures the board that the overall ESG score of the PEIF is<\/p><p>high, and specific company issues are too nuanced to be included in fund-level disclosures.<\/p><p><b>Data Table<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0012.webp\" style=\"max-width:min(100%,578px)\" alt=\"Investment ESG Score Industry Average Notable ESG Score Issues EV Company 70 65 Governance and Environmental Impact Solar Company 85 75 None Water Utility 90 80 Social (Community Concerns)\"><p>*ESG scores are on a scale of 0 to 100, with 100 being the highest.<\/p><\/div><\/details><div class=\"qtext\"><p>Given the non-standardized and sometimes unreliable nature of ESG data, the methodology used to select investments for PEIF that will demonstrate adherence to Standard VI (A) should:<\/p><\/div>", "subj": "ethics"}, {"n": 53, "q": "Based on Standard I: Professionalism, which action by Janice Wu, CFA, is least likely to have violated the CFA Institute Code of Ethics and Standards of Professional Conduct?", "opts": ["Using Elliot's proprietary models without extensive testing for her presentation.", "Not disclosing that Elliot's models were under development when promoting them to potential clients.", "Trading personal investments based on information derived from Elliot's models before publicly discussing them."], "ans": "A", "expl": "The Code and Standards do not explicitly prohibit using new or untested models. This falls under an investment professional's discretion and judgment. While using such models carries reputational and professional risk, the act itself is not a direct violation, provided the user exercises diligence and prudence. The primary failure here was the subsequent lack of disclosure about the models' developmental status, not the initial use of them.. B is incorrect.This is a clear violation of Standard I(C) - Misrepresentation. By promoting the models to potential clients without disclosing that they were still under development and not extensively tested, Janice omitted a material fact. This omission created a misleading impression of the models' reliability, which could (and did) lead clients to make investment decisions based on an incomplete understanding of the risks. C is incorrect. This is a violation of Standard II(A) - Material Nonpublic Information. The key issue is not whether the model's underlying data was public, but the proprietary nature of the model's output itself. The model, as a unique and undisclosed asset of Highland Financial, produced investment conclusions that were not public information.", "explhtml": "<p>The Code and Standards do not explicitly prohibit using new or untested models. This falls under an investment professional&#x27;s discretion and judgment. While using such models carries reputational and professional risk, the act itself is not a direct violation, provided the user exercises diligence and prudence. The primary failure here was the subsequent lack of disclosure about the models&#x27; developmental status, not the initial use of them..<\/p><p><b>B is incorrect.<\/b>This is a clear violation of Standard I(C) - Misrepresentation. By promoting the models to potential clients without disclosing that they were still under development and not extensively tested, Janice omitted a material fact. This omission created a misleading impression of the models&#x27; reliability, which could (and did) lead clients to make investment decisions based on an incomplete understanding of the risks.<\/p><p><b>C is incorrect.<\/b> This is a violation of Standard II(A) - Material Nonpublic Information. The key issue is not whether the model&#x27;s underlying data was public, but the proprietary nature of the model&#x27;s output itself. The model, as a unique and undisclosed asset of Highland Financial, produced investment conclusions that were not public information.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Highland Financial Advisory<\/summary><div class=\"vig-body\"><p>Janice Wu, CFA, is a portfolio manager at Highland Financial Advisory, a boutique investment<\/p><p>firm known for its aggressive investment strategies and impressive client returns. Janice is<\/p><p>managing several high-profile client accounts and, due to her strong performance, has been<\/p><p>given an opportunity to present her market outlook at an upcoming investment conference.<\/p><p>To prepare for her presentation, Janice uses a combination of Highland&#x27;s proprietary market<\/p><p>research and third-party reports. She is particularly reliant on a few forecast models that were<\/p><p>recently developed by her colleague, Elliot Graham, CFA. Elliot&#x27;s models are based on cutting-<\/p><p>edge machine learning algorithms and have not been released to the public or other clients of<\/p><p>Highland.<\/p><p>Janice&#x27;s presentation is well-received, and several attendees ask her for more information about<\/p><p>the models she referenced. Realizing the potential to attract new clients, she agrees to share<\/p><p>Elliot&#x27;s models with individuals who sign up for Highland&#x27;s services within the next month. She<\/p><p>omits mentioning that these models are still under development and have not been tested<\/p><p>extensively outside of controlled environments.<\/p><p>Simultaneously, a compliance officer at Highland spots Janice’s presentation and becomes<\/p><p>concerned about the firm&#x27;s ability to replicate the model&#x27;s results consistently. To address this,<\/p><p>the compliance officer circulates a memo regarding the need for additional review of all<\/p><p>proprietary and experimental models before they are mentioned in any public or client-facing<\/p><p>communications.<\/p><p>Elliot, aware of Janice&#x27;s presentation and the discussions surrounding it, is gratified by her use of<\/p><p>his models. However, he is also mindful of the fact that some models may still contain technical<\/p><p>errors. He decides to review the models but does not take any steps to notify Janice or the firm&#x27;s<\/p><p>management of his concerns. Despite the concerns, Janice’s strategy and use of Elliot’s forecast<\/p><p>models continue to attract new clients to Highland. One of these clients, Victor Saunders,<\/p><p>explicitly mentions the models as a reason for his decision to invest a significant portion of his<\/p><p>assets with the firm. Two months later, the models are found to contain a significant error that<\/p><p>leads to several inaccurate forecasts. As the performance of the new client accounts begins to<\/p><p>suffer, Victor feels misled and files a complaint against Highland.<\/p><p>During the investigation of Victor’s complaint, it came to light that Janice also actively engaged<\/p><p>in trading personal investments based on information derived from Elliot’s models before<\/p><p>publicly discussing them at the investment conference.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Standard I: Professionalism, which action by Janice Wu, CFA, is least likely to have violated the CFA Institute Code of Ethics and Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 54, "q": "According to Standard III: Duties to Clients, which of the following is Janice Wu, CFA, most likely to have violated?", "opts": ["Standard III (A) - Loyalty, Prudence, and Care", "Standard III (B) - Fair Dealing", "Standard III (C) - Suitability"], "ans": "A", "expl": "Janice may have violated her duty of Loyalty, Prudence, and Care by including untested models in her investment strategy without thorough validation, potentially putting client funds at risk due to her negligence regarding the extensive testing and validation of investment tools. B is incorrect. Fair Dealing pertains to treating all clients fairly in the provision of investment analysis, advice, and actions. Although Janice's actions might implicate Fair Dealing, the information provided does not indicate that she treated clients or potential clients unfairly relative to others. C is incorrect. Suitability relates to understanding a client's investment profile and making recommendations consistent with the client's financial situation, investment objectives, and risk tolerance. There is no indication that Janice made unsuitable recommendations concerning Victor's or other clients' investment profiles.", "explhtml": "<p>Janice may have violated her duty of Loyalty, Prudence, and Care by including untested models in her investment strategy without thorough validation, potentially putting client funds at risk due to her negligence regarding the extensive testing and validation of investment tools.<\/p><p><b>B is incorrect.<\/b> Fair Dealing pertains to treating all clients fairly in the provision of investment analysis, advice, and actions. Although Janice&#x27;s actions might implicate Fair Dealing, the information provided does not indicate that she treated clients or potential clients unfairly relative to others.<\/p><p><b>C is incorrect.<\/b> Suitability relates to understanding a client&#x27;s investment profile and making recommendations consistent with the client&#x27;s financial situation, investment objectives, and risk tolerance. There is no indication that Janice made unsuitable recommendations concerning Victor&#x27;s or other clients&#x27; investment profiles.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Highland Financial Advisory<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Janice Wu, CFA, is a portfolio manager at Highland Financial Advisory, a boutique investment<\/p><p>firm known for its aggressive investment strategies and impressive client returns. Janice is<\/p><p>managing several high-profile client accounts and, due to her strong performance, has been<\/p><p>given an opportunity to present her market outlook at an upcoming investment conference.<\/p><p>To prepare for her presentation, Janice uses a combination of Highland&#x27;s proprietary market<\/p><p>research and third-party reports. She is particularly reliant on a few forecast models that were<\/p><p>recently developed by her colleague, Elliot Graham, CFA. Elliot&#x27;s models are based on cutting-<\/p><p>edge machine learning algorithms and have not been released to the public or other clients of<\/p><p>Highland.<\/p><p>Janice&#x27;s presentation is well-received, and several attendees ask her for more information about<\/p><p>the models she referenced. Realizing the potential to attract new clients, she agrees to share<\/p><p>Elliot&#x27;s models with individuals who sign up for Highland&#x27;s services within the next month. She<\/p><p>omits mentioning that these models are still under development and have not been tested<\/p><p>extensively outside of controlled environments.<\/p><p>Simultaneously, a compliance officer at Highland spots Janice’s presentation and becomes<\/p><p>concerned about the firm&#x27;s ability to replicate the model&#x27;s results consistently. To address this,<\/p><p>the compliance officer circulates a memo regarding the need for additional review of all<\/p><p>proprietary and experimental models before they are mentioned in any public or client-facing<\/p><p>communications.<\/p><p>Elliot, aware of Janice&#x27;s presentation and the discussions surrounding it, is gratified by her use of<\/p><p>his models. However, he is also mindful of the fact that some models may still contain technical<\/p><p>errors. He decides to review the models but does not take any steps to notify Janice or the firm&#x27;s<\/p><p>management of his concerns. Despite the concerns, Janice’s strategy and use of Elliot’s forecast<\/p><p>models continue to attract new clients to Highland. One of these clients, Victor Saunders,<\/p><p>explicitly mentions the models as a reason for his decision to invest a significant portion of his<\/p><p>assets with the firm. Two months later, the models are found to contain a significant error that<\/p><p>leads to several inaccurate forecasts. As the performance of the new client accounts begins to<\/p><p>suffer, Victor feels misled and files a complaint against Highland.<\/p><p>During the investigation of Victor’s complaint, it came to light that Janice also actively engaged<\/p><p>in trading personal investments based on information derived from Elliot’s models before<\/p><p>publicly discussing them at the investment conference.<\/p><\/div><\/details><div class=\"qtext\"><p>According to Standard III: Duties to Clients, which of the following is Janice Wu, CFA, most likely to have violated?<\/p><\/div>", "subj": "ethics"}, {"n": 55, "q": "Considering Standard VI: Conflicts of Interest, which of the following did Janice Wu, CFA, most likely fail to do appropriately?", "opts": ["Disclose to clients the limitations and risks of the models used.", "Obtain written consent from all parties involved before proceeding with the trades.", "Refrain from using the proprietary models for personal gain."], "ans": "A", "expl": "Janice should have disclosed the risks and any limitations associated with Elliot's models— especially since they were still under development and not extensively tested—before using them to attract potential clients, as per Standard VI(A) – Disclosure of Conflicts. B is incorrect. While obtaining written consent is important, the question is focused on the disclosure about models. However, disclosure and obtaining consent would be part of fulfilling her duties under this Standard. C is incorrect. While using the proprietary models for personal gain is a violation under Standard II(A) – Material Nonpublic Information, Standard VI primarily concerns the need to disclose conflicts to clients and does not explicitly prohibit the use of information for personal gain if proper disclosure has been made.", "explhtml": "<p>Janice should have disclosed the risks and any limitations associated with Elliot&#x27;s models— especially since they were still under development and not extensively tested—before using them to attract potential clients, as per Standard VI(A) – Disclosure of Conflicts.<\/p><p><b>B is incorrect.<\/b> While obtaining written consent is important, the question is focused on the disclosure about models. However, disclosure and obtaining consent would be part of fulfilling her duties under this Standard.<\/p><p><b>C is incorrect.<\/b> While using the proprietary models for personal gain is a violation under Standard II(A) – Material Nonpublic Information, Standard VI primarily concerns the need to disclose conflicts to clients and does not explicitly prohibit the use of information for personal gain if proper disclosure has been made.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Highland Financial Advisory<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Janice Wu, CFA, is a portfolio manager at Highland Financial Advisory, a boutique investment<\/p><p>firm known for its aggressive investment strategies and impressive client returns. Janice is<\/p><p>managing several high-profile client accounts and, due to her strong performance, has been<\/p><p>given an opportunity to present her market outlook at an upcoming investment conference.<\/p><p>To prepare for her presentation, Janice uses a combination of Highland&#x27;s proprietary market<\/p><p>research and third-party reports. She is particularly reliant on a few forecast models that were<\/p><p>recently developed by her colleague, Elliot Graham, CFA. Elliot&#x27;s models are based on cutting-<\/p><p>edge machine learning algorithms and have not been released to the public or other clients of<\/p><p>Highland.<\/p><p>Janice&#x27;s presentation is well-received, and several attendees ask her for more information about<\/p><p>the models she referenced. Realizing the potential to attract new clients, she agrees to share<\/p><p>Elliot&#x27;s models with individuals who sign up for Highland&#x27;s services within the next month. She<\/p><p>omits mentioning that these models are still under development and have not been tested<\/p><p>extensively outside of controlled environments.<\/p><p>Simultaneously, a compliance officer at Highland spots Janice’s presentation and becomes<\/p><p>concerned about the firm&#x27;s ability to replicate the model&#x27;s results consistently. To address this,<\/p><p>the compliance officer circulates a memo regarding the need for additional review of all<\/p><p>proprietary and experimental models before they are mentioned in any public or client-facing<\/p><p>communications.<\/p><p>Elliot, aware of Janice&#x27;s presentation and the discussions surrounding it, is gratified by her use of<\/p><p>his models. However, he is also mindful of the fact that some models may still contain technical<\/p><p>errors. He decides to review the models but does not take any steps to notify Janice or the firm&#x27;s<\/p><p>management of his concerns. Despite the concerns, Janice’s strategy and use of Elliot’s forecast<\/p><p>models continue to attract new clients to Highland. One of these clients, Victor Saunders,<\/p><p>explicitly mentions the models as a reason for his decision to invest a significant portion of his<\/p><p>assets with the firm. Two months later, the models are found to contain a significant error that<\/p><p>leads to several inaccurate forecasts. As the performance of the new client accounts begins to<\/p><p>suffer, Victor feels misled and files a complaint against Highland.<\/p><p>During the investigation of Victor’s complaint, it came to light that Janice also actively engaged<\/p><p>in trading personal investments based on information derived from Elliot’s models before<\/p><p>publicly discussing them at the investment conference.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering Standard VI: Conflicts of Interest, which of the following did Janice Wu, CFA, most likely fail to do appropriately?<\/p><\/div>", "subj": "ethics"}, {"n": 56, "q": "In regard to Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate, which of the following actions is Elliot Graham, CFA, least likely to have violated?", "opts": ["Reporting the potential errors in his model to his superiors.", "Cooperating with the compliance memo circulated by the firm.", "Contributing to the integrity of capital markets by reviewing his models' validity when doubts arose."], "ans": "B", "expl": "Elliot's cooperation with his firm's compliance memo aligns with Standard VII(A) – Conduct as Participants in CFA Institute Programs, which emphasizes integrity and the importance of adhering to established protocols and guidelines within the firm. This approach helps in maintaining professional responsibility and upholding compliance requirements. A is incorrect. Elliot did not report potential errors in his model to his superiors, which would likely constitute a violation of Standard VII(A) – Conduct as Participants in CFA Institute Programs, as it requires members to act with integrity and respect in their professional activities. C is incorrect. While Elliot did take the step to review his models when concerns arose, his failure to notify Janice or the firm's management about these potential issues could be seen as a lapse in his duty to uphold the integrity of capital markets. Standard V(A) – Diligence and Reasonable Basis requires members and candidates to have a reasonable and adequate basis, supported by appropriate research and investigations, for any investment analysis, recommendations, or actions. By not escalating his concerns, Elliot may have compromised the firm's ability to act diligently and responsibly.", "explhtml": "<p>Elliot&#x27;s cooperation with his firm&#x27;s compliance memo aligns with Standard VII(A) – Conduct as Participants in CFA Institute Programs, which emphasizes integrity and the importance of adhering to established protocols and guidelines within the firm. This approach helps in maintaining professional responsibility and upholding compliance requirements.<\/p><p><b>A is incorrect.<\/b> Elliot did not report potential errors in his model to his superiors, which would likely constitute a violation of Standard VII(A) – Conduct as Participants in CFA Institute Programs, as it requires members to act with integrity and respect in their professional activities.<\/p><p><b>C is incorrect.<\/b> While Elliot did take the step to review his models when concerns arose, his failure to notify Janice or the firm&#x27;s management about these potential issues could be seen as a lapse in his duty to uphold the integrity of capital markets. Standard V(A) – Diligence and Reasonable Basis requires members and candidates to have a reasonable and adequate basis, supported by appropriate research and investigations, for any investment analysis, recommendations, or actions. By not escalating his concerns, Elliot may have compromised the firm&#x27;s ability to act diligently and responsibly.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Highland Financial Advisory<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Janice Wu, CFA, is a portfolio manager at Highland Financial Advisory, a boutique investment<\/p><p>firm known for its aggressive investment strategies and impressive client returns. Janice is<\/p><p>managing several high-profile client accounts and, due to her strong performance, has been<\/p><p>given an opportunity to present her market outlook at an upcoming investment conference.<\/p><p>To prepare for her presentation, Janice uses a combination of Highland&#x27;s proprietary market<\/p><p>research and third-party reports. She is particularly reliant on a few forecast models that were<\/p><p>recently developed by her colleague, Elliot Graham, CFA. Elliot&#x27;s models are based on cutting-<\/p><p>edge machine learning algorithms and have not been released to the public or other clients of<\/p><p>Highland.<\/p><p>Janice&#x27;s presentation is well-received, and several attendees ask her for more information about<\/p><p>the models she referenced. Realizing the potential to attract new clients, she agrees to share<\/p><p>Elliot&#x27;s models with individuals who sign up for Highland&#x27;s services within the next month. She<\/p><p>omits mentioning that these models are still under development and have not been tested<\/p><p>extensively outside of controlled environments.<\/p><p>Simultaneously, a compliance officer at Highland spots Janice’s presentation and becomes<\/p><p>concerned about the firm&#x27;s ability to replicate the model&#x27;s results consistently. To address this,<\/p><p>the compliance officer circulates a memo regarding the need for additional review of all<\/p><p>proprietary and experimental models before they are mentioned in any public or client-facing<\/p><p>communications.<\/p><p>Elliot, aware of Janice&#x27;s presentation and the discussions surrounding it, is gratified by her use of<\/p><p>his models. However, he is also mindful of the fact that some models may still contain technical<\/p><p>errors. He decides to review the models but does not take any steps to notify Janice or the firm&#x27;s<\/p><p>management of his concerns. Despite the concerns, Janice’s strategy and use of Elliot’s forecast<\/p><p>models continue to attract new clients to Highland. One of these clients, Victor Saunders,<\/p><p>explicitly mentions the models as a reason for his decision to invest a significant portion of his<\/p><p>assets with the firm. Two months later, the models are found to contain a significant error that<\/p><p>leads to several inaccurate forecasts. As the performance of the new client accounts begins to<\/p><p>suffer, Victor feels misled and files a complaint against Highland.<\/p><p>During the investigation of Victor’s complaint, it came to light that Janice also actively engaged<\/p><p>in trading personal investments based on information derived from Elliot’s models before<\/p><p>publicly discussing them at the investment conference.<\/p><\/div><\/details><div class=\"qtext\"><p>In regard to Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate, which of the following actions is Elliot Graham, CFA, least likely to have violated?<\/p><\/div>", "subj": "ethics"}, {"n": 57, "q": "John’s acceptance and use of \"soft dollar\" benefits is most likely:", "opts": ["A violation of Standard I (B) – Professionalism: Independence and Objectivity.", "A violation of Standard VI (A) – Disclosure of Conflicts.", "Not a violation if the benefits serve the client's interests."], "ans": "B", "expl": "John's acceptance and use of \"soft dollar\" benefits from brokers could result in conflicts of interest that must be fully disclosed. Failure to fully disclose these arrangements is a violation of Standard VI(A). A is incorrect. While independence and objectivity are important, the current scenario highlights conflicts disclosure specifically. C is incorrect. Even if the benefits serve the client's interests, the failure to disclose potential conflicts is still a violation.", "explhtml": "<p>John&#x27;s acceptance and use of &quot;soft dollar&quot; benefits from brokers could result in conflicts of interest that must be fully disclosed. Failure to fully disclose these arrangements is a violation of Standard VI(A).<\/p><p><b>A is incorrect.<\/b> While independence and objectivity are important, the current scenario highlights conflicts disclosure specifically.<\/p><p><b>C is incorrect.<\/b> Even if the benefits serve the client&#x27;s interests, the failure to disclose potential conflicts is still a violation.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Zenith Asset Management<\/summary><div class=\"vig-body\"><p>John Anderson, CFA, is a senior portfolio manager at Zenith Asset Management (ZAM), a<\/p><p>boutique investment firm that boasts a solid reputation and consistent performance. Emma<\/p><p>Wright, a junior analyst at ZAM, has recently developed a proprietary valuation model that has<\/p><p>proven highly effective in predicting stock movements. Due to the success of this model in ZAM&#x27;s<\/p><p>internal testing, the firm decides to launch a new equity fund focusing on the strategies derived<\/p><p>from the model.<\/p><p>John, who is managing the new fund, receives a substantial amount of information and input<\/p><p>from various sources, including Emma&#x27;s model, brokerage research reports, and industry expert<\/p><p>chart analysis. However, John notices that Emma is consistently executing trades in her personal<\/p><p>account based on trades from the model before they are executed in the client funds, a fact she<\/p><p>has not disclosed to ZAM’s compliance department.<\/p><p>As the fund grows, the influence of the trades on the market becomes more notable. John has<\/p><p>received offers from several brokers to provide “soft dollar” benefits in exchange for routing the<\/p><p>fund’s increasing trade volume through them. John is conscious that such arrangements might<\/p><p>be a conflict of interest, but he also believes that the indirect benefits to the clients in terms of<\/p><p>research and tools could potentially outweigh these concerns.<\/p><p>In the recent months, Wright has been approached by a Wall Street Journal reporter probing for<\/p><p>insights on the fund&#x27;s remarkable performance. Wright, proud of her contribution, reveals the<\/p><p>proprietary strategy to the journalist without consent from ZAM. The story is published, leading<\/p><p>to a flood of new investments into the fund and raising concerns among existing clients about the<\/p><p>exclusivity and future performance of their investment.<\/p><p>Simultaneously, ZAM receives a lucrative offer from an analytics firm to acquire exclusive rights<\/p><p>to Emma’s valuation model. Emma is supportive of this deal as she stands to gain a significant<\/p><p>personal bonus from the sale. John feels pressure from the ZAM’s executive board to endorse the<\/p><p>deal, despite his own reservations about the long-term impact on the firm’s competitive edge.<\/p><p>Throughout his tenure at ZAM, John has also been serving on the investment committee of the<\/p><p>local charity foundation, without accepting any form of compensation. However, he has been directing trades from the charity&#x27;s endowment fund through the brokers offering the “soft dollar”<\/p><p>arrangements without disclosing this to the charity’s board.<\/p><\/div><\/details><div class=\"qtext\"><p>John’s acceptance and use of &quot;soft dollar&quot; benefits is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 58, "q": "Emma's execution of trades in her personal account based on the proprietary model is most likely:", "opts": ["A violation of Standard V (A) – Diligence and Reasonable Basis.", "A violation of Standard VI (B) – Priority of Transactions.", "Justified if her actions do not affect the model's performance."], "ans": "B", "expl": "Emma's actions give her an unfair advantage, as she is using her knowledge of the upcoming trades to benefit personally before executing them for clients, which is a violation of the priority of transactions. A is incorrect. The question pertains to priority and not the basis of recommendations. C is incorrect. The action harms the integrity of client priority regardless of its impact on the model's performance.", "explhtml": "<p>Emma&#x27;s actions give her an unfair advantage, as she is using her knowledge of the upcoming trades to benefit personally before executing them for clients, which is a violation of the priority of transactions.<\/p><p><b>A is incorrect.<\/b> The question pertains to priority and not the basis of recommendations.<\/p><p><b>C is incorrect.<\/b> The action harms the integrity of client priority regardless of its impact on the model&#x27;s performance.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Zenith Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Anderson, CFA, is a senior portfolio manager at Zenith Asset Management (ZAM), a<\/p><p>boutique investment firm that boasts a solid reputation and consistent performance. Emma<\/p><p>Wright, a junior analyst at ZAM, has recently developed a proprietary valuation model that has<\/p><p>proven highly effective in predicting stock movements. Due to the success of this model in ZAM&#x27;s<\/p><p>internal testing, the firm decides to launch a new equity fund focusing on the strategies derived<\/p><p>from the model.<\/p><p>John, who is managing the new fund, receives a substantial amount of information and input<\/p><p>from various sources, including Emma&#x27;s model, brokerage research reports, and industry expert<\/p><p>chart analysis. However, John notices that Emma is consistently executing trades in her personal<\/p><p>account based on trades from the model before they are executed in the client funds, a fact she<\/p><p>has not disclosed to ZAM’s compliance department.<\/p><p>As the fund grows, the influence of the trades on the market becomes more notable. John has<\/p><p>received offers from several brokers to provide “soft dollar” benefits in exchange for routing the<\/p><p>fund’s increasing trade volume through them. John is conscious that such arrangements might<\/p><p>be a conflict of interest, but he also believes that the indirect benefits to the clients in terms of<\/p><p>research and tools could potentially outweigh these concerns.<\/p><p>In the recent months, Wright has been approached by a Wall Street Journal reporter probing for<\/p><p>insights on the fund&#x27;s remarkable performance. Wright, proud of her contribution, reveals the<\/p><p>proprietary strategy to the journalist without consent from ZAM. The story is published, leading<\/p><p>to a flood of new investments into the fund and raising concerns among existing clients about the<\/p><p>exclusivity and future performance of their investment.<\/p><p>Simultaneously, ZAM receives a lucrative offer from an analytics firm to acquire exclusive rights<\/p><p>to Emma’s valuation model. Emma is supportive of this deal as she stands to gain a significant<\/p><p>personal bonus from the sale. John feels pressure from the ZAM’s executive board to endorse the<\/p><p>deal, despite his own reservations about the long-term impact on the firm’s competitive edge.<\/p><p>Throughout his tenure at ZAM, John has also been serving on the investment committee of the<\/p><p>local charity foundation, without accepting any form of compensation. However, he has been directing trades from the charity&#x27;s endowment fund through the brokers offering the “soft dollar”<\/p><p>arrangements without disclosing this to the charity’s board.<\/p><\/div><\/details><div class=\"qtext\"><p>Emma&#x27;s execution of trades in her personal account based on the proprietary model is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 59, "q": "Wright's disclosing the fund's strategy to the journalist without consent is most likely:", "opts": ["A violation of Standard I (C) – Misrepresentation.", "In accordance with Standard IV (C) – Responsibilities of Supervisors.", "A violation of Standard III (A) – Loyalty, Prudence, and Care."], "ans": "C", "expl": "Standard III(A) requires members to act for the benefit of their clients and place their clients' interests above their own. Emma Wright’s disclosure of the proprietary strategy to a journalist is a clear violation of this duty. Loyalty to Clients: By publicizing the fund's secret strategy, she undermined the exclusivity that provided an edge for the fund's clients. This action risked diluting the strategy's effectiveness as it became public knowledge, potentially harming the existing clients' investment returns. Her personal pride and desire for recognition were placed ahead of her clients' financial interests. Prudence and Care: A prudent and careful manager would protect confidential, proprietary information that is central to a fund's performance. Releasing this information without consent is a reckless act that fails to exercise due care for the clients' assets. A is incorrect. Standard I(C) prohibits knowingly misrepresenting investment analysis, recommendations, or actions. It deals with deceit and false statements. Emma's transgression was not that she misrepresented the strategy, but that she revealed it. She was likely truthful to the journalist about how the model worked. The core issue is the unauthorized disclosure of confidential information, not the distortion of facts. Therefore, while unethical, her action does not squarely fall under Misrepresentation. B is incorrect. Standard IV(C) outlines the duties of those who have supervisory responsibilities over others. This question is about Emma Wright's actions, not her supervisor's (John Anderson's) responsibilities. The answer choice states her act is \"in accordance with\" this standard, which would mean it is acceptable behavior. Clearly, her disclosure is a serious violation, not conduct that aligns with any CFA Institute Standard. This option is a distractor that misapplies a supervisory standard to a non-supervisor's misconduct.", "explhtml": "<p>Standard III(A) requires members to act for the benefit of their clients and place their clients&#x27; interests above their own. Emma Wright’s disclosure of the proprietary strategy to a journalist is a clear violation of this duty.<\/p><p>Loyalty to Clients: By publicizing the fund&#x27;s secret strategy, she undermined the exclusivity that provided an edge for the fund&#x27;s clients. This action risked diluting the strategy&#x27;s effectiveness as it became public knowledge, potentially harming the existing clients&#x27; investment returns. Her personal pride and desire for recognition were placed ahead of her clients&#x27; financial interests.<\/p><p>Prudence and Care: A prudent and careful manager would protect confidential, proprietary information that is central to a fund&#x27;s performance. Releasing this information without consent is a reckless act that fails to exercise due care for the clients&#x27; assets.<\/p><p><b>A is incorrect.<\/b> Standard I(C) prohibits knowingly misrepresenting investment analysis, recommendations, or actions. It deals with deceit and false statements. Emma&#x27;s transgression was not that she misrepresented the strategy, but that she revealed it. She was likely truthful to the journalist about how the model worked. The core issue is the unauthorized disclosure of confidential information, not the distortion of facts. Therefore, while unethical, her action does not squarely fall under Misrepresentation.<\/p><p><b>B is incorrect.<\/b> Standard IV(C) outlines the duties of those who have supervisory responsibilities over others. This question is about Emma Wright&#x27;s actions, not her supervisor&#x27;s (John Anderson&#x27;s) responsibilities. The answer choice states her act is &quot;in accordance with&quot; this standard, which would mean it is acceptable behavior. Clearly, her disclosure is a serious violation, not conduct that aligns with any CFA Institute Standard. This option is a distractor that misapplies a supervisory standard to a non-supervisor&#x27;s misconduct.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Zenith Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Anderson, CFA, is a senior portfolio manager at Zenith Asset Management (ZAM), a<\/p><p>boutique investment firm that boasts a solid reputation and consistent performance. Emma<\/p><p>Wright, a junior analyst at ZAM, has recently developed a proprietary valuation model that has<\/p><p>proven highly effective in predicting stock movements. Due to the success of this model in ZAM&#x27;s<\/p><p>internal testing, the firm decides to launch a new equity fund focusing on the strategies derived<\/p><p>from the model.<\/p><p>John, who is managing the new fund, receives a substantial amount of information and input<\/p><p>from various sources, including Emma&#x27;s model, brokerage research reports, and industry expert<\/p><p>chart analysis. However, John notices that Emma is consistently executing trades in her personal<\/p><p>account based on trades from the model before they are executed in the client funds, a fact she<\/p><p>has not disclosed to ZAM’s compliance department.<\/p><p>As the fund grows, the influence of the trades on the market becomes more notable. John has<\/p><p>received offers from several brokers to provide “soft dollar” benefits in exchange for routing the<\/p><p>fund’s increasing trade volume through them. John is conscious that such arrangements might<\/p><p>be a conflict of interest, but he also believes that the indirect benefits to the clients in terms of<\/p><p>research and tools could potentially outweigh these concerns.<\/p><p>In the recent months, Wright has been approached by a Wall Street Journal reporter probing for<\/p><p>insights on the fund&#x27;s remarkable performance. Wright, proud of her contribution, reveals the<\/p><p>proprietary strategy to the journalist without consent from ZAM. The story is published, leading<\/p><p>to a flood of new investments into the fund and raising concerns among existing clients about the<\/p><p>exclusivity and future performance of their investment.<\/p><p>Simultaneously, ZAM receives a lucrative offer from an analytics firm to acquire exclusive rights<\/p><p>to Emma’s valuation model. Emma is supportive of this deal as she stands to gain a significant<\/p><p>personal bonus from the sale. John feels pressure from the ZAM’s executive board to endorse the<\/p><p>deal, despite his own reservations about the long-term impact on the firm’s competitive edge.<\/p><p>Throughout his tenure at ZAM, John has also been serving on the investment committee of the<\/p><p>local charity foundation, without accepting any form of compensation. However, he has been directing trades from the charity&#x27;s endowment fund through the brokers offering the “soft dollar”<\/p><p>arrangements without disclosing this to the charity’s board.<\/p><\/div><\/details><div class=\"qtext\"><p>Wright&#x27;s disclosing the fund&#x27;s strategy to the journalist without consent is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 60, "q": "Regarding the potential sale of Emma Wright’s valuation model, John’s endorsement of the deal due to pressure is most likely:", "opts": ["A violation of Standard V (B) – Communication with Clients and Prospective Clients.", "A wise decision in light of ZAM's fiscal responsibilities.", "A violation of Standard VI (A) – Avoid or Disclose Conflicts."], "ans": "C", "expl": "The pressure from the board is a conflict of interest, and John’s primary concern should be whether the sale is in the best interests of the clients. Failing to consider and disclose all factors in such a decision is a violation. A is incorrect. The context is not specifically about client communication. B is incorrect. Fiscal responsibility does not override ethical conduct.", "explhtml": "<p>The pressure from the board is a conflict of interest, and John’s primary concern should be whether the sale is in the best interests of the clients. Failing to consider and disclose all factors in such a decision is a violation.<\/p><p><b>A is incorrect.<\/b> The context is not specifically about client communication.<\/p><p><b>B is incorrect.<\/b> Fiscal responsibility does not override ethical conduct.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Zenith Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Anderson, CFA, is a senior portfolio manager at Zenith Asset Management (ZAM), a<\/p><p>boutique investment firm that boasts a solid reputation and consistent performance. Emma<\/p><p>Wright, a junior analyst at ZAM, has recently developed a proprietary valuation model that has<\/p><p>proven highly effective in predicting stock movements. Due to the success of this model in ZAM&#x27;s<\/p><p>internal testing, the firm decides to launch a new equity fund focusing on the strategies derived<\/p><p>from the model.<\/p><p>John, who is managing the new fund, receives a substantial amount of information and input<\/p><p>from various sources, including Emma&#x27;s model, brokerage research reports, and industry expert<\/p><p>chart analysis. However, John notices that Emma is consistently executing trades in her personal<\/p><p>account based on trades from the model before they are executed in the client funds, a fact she<\/p><p>has not disclosed to ZAM’s compliance department.<\/p><p>As the fund grows, the influence of the trades on the market becomes more notable. John has<\/p><p>received offers from several brokers to provide “soft dollar” benefits in exchange for routing the<\/p><p>fund’s increasing trade volume through them. John is conscious that such arrangements might<\/p><p>be a conflict of interest, but he also believes that the indirect benefits to the clients in terms of<\/p><p>research and tools could potentially outweigh these concerns.<\/p><p>In the recent months, Wright has been approached by a Wall Street Journal reporter probing for<\/p><p>insights on the fund&#x27;s remarkable performance. Wright, proud of her contribution, reveals the<\/p><p>proprietary strategy to the journalist without consent from ZAM. The story is published, leading<\/p><p>to a flood of new investments into the fund and raising concerns among existing clients about the<\/p><p>exclusivity and future performance of their investment.<\/p><p>Simultaneously, ZAM receives a lucrative offer from an analytics firm to acquire exclusive rights<\/p><p>to Emma’s valuation model. Emma is supportive of this deal as she stands to gain a significant<\/p><p>personal bonus from the sale. John feels pressure from the ZAM’s executive board to endorse the<\/p><p>deal, despite his own reservations about the long-term impact on the firm’s competitive edge.<\/p><p>Throughout his tenure at ZAM, John has also been serving on the investment committee of the<\/p><p>local charity foundation, without accepting any form of compensation. However, he has been directing trades from the charity&#x27;s endowment fund through the brokers offering the “soft dollar”<\/p><p>arrangements without disclosing this to the charity’s board.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the potential sale of Emma Wright’s valuation model, John’s endorsement of the deal due to pressure is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 61, "q": "Alice is contemplating gifting executives with memberships to a wellness resort to encourage them to share information freely. By considering this action, Alice is most likely violating which CFA Institute Standard?", "opts": ["Standard III (B) - Fair Dealing", "Standard IV (B) - Additional Compensation Arrangements", "Standard I (B) - Independence and Objectivity"], "ans": "C", "expl": "Alice's intention to gift memberships could compromise her independence and objectivity because it might be perceived as a form of bribery to influence the executives to disclose information not readily available to other analysts. Even if there is no explicit expectation of reciprocation, it raises the issue of potential conflicts of interest, which Standard I (B) seeks to address by prohibiting analysts from accepting gifts that could influence their judgment. A is incorrect. Standard III (B) - Fair Dealing pertains to fair treatment of all clients when disseminating investment recommendations or taking action on behalf of clients. While this is a significant consideration, it does not specifically relate to Alice's contemplated action of gifting memberships for information. B is incorrect. Standard IV (B) - Additional Compensation Arrangements pertains to the disclosure of any compensation, payment, or benefit received by the member or candidate in addition to what is provided by the employer, not the offering of benefits to others to collect information.", "explhtml": "<p>Alice&#x27;s intention to gift memberships could compromise her independence and objectivity because it might be perceived as a form of bribery to influence the executives to disclose information not readily available to other analysts. Even if there is no explicit expectation of reciprocation, it raises the issue of potential conflicts of interest, which Standard I (B) seeks to address by prohibiting analysts from accepting gifts that could influence th
