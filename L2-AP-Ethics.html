eir judgment.<\/p><p><b>A is incorrect.<\/b> Standard III (B) - Fair Dealing pertains to fair treatment of all clients when disseminating investment recommendations or taking action on behalf of clients. While this is a significant consideration, it does not specifically relate to Alice&#x27;s contemplated action of gifting memberships for information.<\/p><p><b>B is incorrect.<\/b> Standard IV (B) - Additional Compensation Arrangements pertains to the disclosure of any compensation, payment, or benefit received by the member or candidate in addition to what is provided by the employer, not the offering of benefits to others to collect information.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Alice Johnson<\/summary><div class=\"vig-body\"><p>Alice Johnson, CFA, is an equity analyst at Bright Investment Management, a firm managing<\/p><p>portfolios for high-net-worth individuals. As part of her research responsibilities, Alice is tasked<\/p><p>with generating investment-grade reports on companies across different industries. Her process<\/p><p>includes rigorous financial modeling, projecting future earnings based on current economic data,<\/p><p>management discussions, and field analysis.<\/p><p>Lately, Alice has been focusing on the healthcare industry and has developed a strong opinion on<\/p><p>Medicore Inc., a company she believes is poised for significant growth due to an innovative new<\/p><p>drug that is expected to revolutionize treatments in its category. Alice wants to set up private<\/p><p>meetings with key executives from Medicore Inc. to validate her assumptions and forecasts.<\/p><p>To provide an incentive for the executives to share information freely, Alice contemplates gifting<\/p><p>them exclusive memberships to an elite health and wellness resort, which she believes aligns<\/p><p>with their personal interest in healthcare. She also intends to request suppliers’ and customers’<\/p><p>confidential data to better understand the value chain and gain insights beyond what&#x27;s publicly<\/p><p>available.<\/p><p>Simultaneously, Alice is aware that Bright Investment Management is about to take on a new<\/p><p>client, whose portfolio will substantially benefit if Medicore Inc. is added before the publication<\/p><p>of her report. She is considering whether she should act on her findings and include Medicore<\/p><p>Inc. in the new client&#x27;s portfolio immediately or wait until after her report is published.<\/p><p>Bright Investment Management has strict policies about gifts and entertainment and requires<\/p><p>analysts to always act in the best interest of the client. Furthermore, all non-public material<\/p><p>information must be handled confidentially.<\/p><p>Alice is also part of an analyst networking group where analysts share general market trends and<\/p><p>investment ideas. She sometimes discusses her hypotheses regarding certain companies, without<\/p><p>sharing specific details, to validate her thinking and gauge market sentiment.<\/p><\/div><\/details><div class=\"qtext\"><p>Alice is contemplating gifting executives with memberships to a wellness resort to encourage them to share information freely. By considering this action, Alice is most likely violating which CFA Institute Standard?<\/p><\/div>", "subj": "ethics"}, {"n": 62, "q": "By seeking suppliers’ and customers’ confidential data for a deeper understanding of Medicore Inc.'s value chain, Alice is most likely to violate which Standard if she proceeds without proper authorization?", "opts": ["Standard IV (C) - Responsibilities of Supervisors", "Standard II (A) - Material Nonpublic Information", "Standard V (A) - Diligence and Reasonable Basis"], "ans": "B", "expl": "If Alice obtains confidential data without proper authorization, she will be in possession of material nonpublic information. Using such information for investment decisions or making recommendations based on it can violate Standard II (A), as it would give Alice and her clients an unfair advantage in the marketplace. A is incorrect. Standard IV (C) - Responsibilities of Supervisors relates to the responsibility of supervisory personnel to prevent violations of applicable laws, rules, regulations, and the Code and Standards by persons under their supervision. While it is a valid concern, the question specifically asks about the action of seeking confidential data, not about supervisory duties. C is incorrect. Standard V (A) - Diligence and Reasonable Basis focuses on the need to exercise diligence, independence, and thoroughness in analyzing investments. Seeking confidential information could be a part of due diligence, but it is the unauthorized nature of obtaining the information that poses an ethical issue under Standard II (A).", "explhtml": "<p>If Alice obtains confidential data without proper authorization, she will be in possession of material nonpublic information. Using such information for investment decisions or making recommendations based on it can violate Standard II (A), as it would give Alice and her clients an unfair advantage in the marketplace.<\/p><p><b>A is incorrect.<\/b> Standard IV (C) - Responsibilities of Supervisors relates to the responsibility of supervisory personnel to prevent violations of applicable laws, rules, regulations, and the Code and Standards by persons under their supervision. While it is a valid concern, the question specifically asks about the action of seeking confidential data, not about supervisory duties.<\/p><p><b>C is incorrect.<\/b> Standard V (A) - Diligence and Reasonable Basis focuses on the need to exercise diligence, independence, and thoroughness in analyzing investments. Seeking confidential information could be a part of due diligence, but it is the unauthorized nature of obtaining the information that poses an ethical issue under Standard II (A).<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Alice Johnson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alice Johnson, CFA, is an equity analyst at Bright Investment Management, a firm managing<\/p><p>portfolios for high-net-worth individuals. As part of her research responsibilities, Alice is tasked<\/p><p>with generating investment-grade reports on companies across different industries. Her process<\/p><p>includes rigorous financial modeling, projecting future earnings based on current economic data,<\/p><p>management discussions, and field analysis.<\/p><p>Lately, Alice has been focusing on the healthcare industry and has developed a strong opinion on<\/p><p>Medicore Inc., a company she believes is poised for significant growth due to an innovative new<\/p><p>drug that is expected to revolutionize treatments in its category. Alice wants to set up private<\/p><p>meetings with key executives from Medicore Inc. to validate her assumptions and forecasts.<\/p><p>To provide an incentive for the executives to share information freely, Alice contemplates gifting<\/p><p>them exclusive memberships to an elite health and wellness resort, which she believes aligns<\/p><p>with their personal interest in healthcare. She also intends to request suppliers’ and customers’<\/p><p>confidential data to better understand the value chain and gain insights beyond what&#x27;s publicly<\/p><p>available.<\/p><p>Simultaneously, Alice is aware that Bright Investment Management is about to take on a new<\/p><p>client, whose portfolio will substantially benefit if Medicore Inc. is added before the publication<\/p><p>of her report. She is considering whether she should act on her findings and include Medicore<\/p><p>Inc. in the new client&#x27;s portfolio immediately or wait until after her report is published.<\/p><p>Bright Investment Management has strict policies about gifts and entertainment and requires<\/p><p>analysts to always act in the best interest of the client. Furthermore, all non-public material<\/p><p>information must be handled confidentially.<\/p><p>Alice is also part of an analyst networking group where analysts share general market trends and<\/p><p>investment ideas. She sometimes discusses her hypotheses regarding certain companies, without<\/p><p>sharing specific details, to validate her thinking and gauge market sentiment.<\/p><\/div><\/details><div class=\"qtext\"><p>By seeking suppliers’ and customers’ confidential data for a deeper understanding of Medicore Inc.&#x27;s value chain, Alice is most likely to violate which Standard if she proceeds without proper authorization?<\/p><\/div>", "subj": "ethics"}, {"n": 63, "q": "Alice considers acting on her positive findings on Medicore Inc. and including the stock in the portfolio of a new client who will substantially benefit from the inclusion. The most appropriate course of action according to the Standards would be to:", "opts": ["Include Medicore Inc. in the new client's portfolio immediately to ensure the client benefits from the potential growth.", "Wait until Bright Investment Management officially publishes her research report before including Medicore Inc. in the new client's portfolio.", "Disclose her intention to include Medicore Inc. in the new client's portfolio to her supervisor for approval before taking any action."], "ans": "C", "expl": "Standard VI (B) - Priority of Transactions stipulates that investment transactions for clients and employers must have priority over transactions in securities or other investments in which a member or candidate is the beneficial owner. Before she can include Medicore Inc. in the new client's portfolio based on her unpublished findings, Alice should obtain approval from her supervisor to ensure that there is no conflict of interest or front-running of her own firm's research. A is incorrect. Acting immediately could be seen as front-running the publication of her research report, which could disadvantage other clients and is prohibited by the Standards. B is incorrect. While waiting until the official publication of her research report is a conservative approach, it may not address potential conflicts or the best interests of all clients. The optimal procedure is to seek approval from her supervisor while considering all clients' interests equally.", "explhtml": "<p>Standard VI (B) - Priority of Transactions stipulates that investment transactions for clients and employers must have priority over transactions in securities or other investments in which a member or candidate is the beneficial owner. Before she can include Medicore Inc. in the new client&#x27;s portfolio based on her unpublished findings, Alice should obtain approval from her supervisor to ensure that there is no conflict of interest or front-running of her own firm&#x27;s research.<\/p><p><b>A is incorrect.<\/b> Acting immediately could be seen as front-running the publication of her research report, which could disadvantage other clients and is prohibited by the Standards.<\/p><p><b>B is incorrect.<\/b> While waiting until the official publication of her research report is a conservative approach, it may not address potential conflicts or the best interests of all clients. The optimal procedure is to seek approval from her supervisor while considering all clients&#x27; interests equally.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Alice Johnson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alice Johnson, CFA, is an equity analyst at Bright Investment Management, a firm managing<\/p><p>portfolios for high-net-worth individuals. As part of her research responsibilities, Alice is tasked<\/p><p>with generating investment-grade reports on companies across different industries. Her process<\/p><p>includes rigorous financial modeling, projecting future earnings based on current economic data,<\/p><p>management discussions, and field analysis.<\/p><p>Lately, Alice has been focusing on the healthcare industry and has developed a strong opinion on<\/p><p>Medicore Inc., a company she believes is poised for significant growth due to an innovative new<\/p><p>drug that is expected to revolutionize treatments in its category. Alice wants to set up private<\/p><p>meetings with key executives from Medicore Inc. to validate her assumptions and forecasts.<\/p><p>To provide an incentive for the executives to share information freely, Alice contemplates gifting<\/p><p>them exclusive memberships to an elite health and wellness resort, which she believes aligns<\/p><p>with their personal interest in healthcare. She also intends to request suppliers’ and customers’<\/p><p>confidential data to better understand the value chain and gain insights beyond what&#x27;s publicly<\/p><p>available.<\/p><p>Simultaneously, Alice is aware that Bright Investment Management is about to take on a new<\/p><p>client, whose portfolio will substantially benefit if Medicore Inc. is added before the publication<\/p><p>of her report. She is considering whether she should act on her findings and include Medicore<\/p><p>Inc. in the new client&#x27;s portfolio immediately or wait until after her report is published.<\/p><p>Bright Investment Management has strict policies about gifts and entertainment and requires<\/p><p>analysts to always act in the best interest of the client. Furthermore, all non-public material<\/p><p>information must be handled confidentially.<\/p><p>Alice is also part of an analyst networking group where analysts share general market trends and<\/p><p>investment ideas. She sometimes discusses her hypotheses regarding certain companies, without<\/p><p>sharing specific details, to validate her thinking and gauge market sentiment.<\/p><\/div><\/details><div class=\"qtext\"><p>Alice considers acting on her positive findings on Medicore Inc. and including the stock in the portfolio of a new client who will substantially benefit from the inclusion. The most appropriate course of action according to the Standards would be to:<\/p><\/div>", "subj": "ethics"}, {"n": 64, "q": "Which Standard would Alice be adhering to if she accurately represents her research findings and ensures the utilization of sound financial models and rigorous data analysis while preparing her report on Medicore Inc.?", "opts": ["Standard V (B) - Communication with Clients and Prospective Clients", "Standard V (A) - Diligence and Reasonable Basis", "Standard I (C) - Misrepresentation"], "ans": "B", "expl": "Standard V (A) requires members and candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions. By using sound financial models and rigorous data analysis, Alice is complying with this duty and providing a sound basis for her investment recommendations. A is incorrect. Standard V (B) - Communication with Clients and Prospective Clients focuses on the need to communicate investment analysis and recommendations to clients in a fair, accurate, and understandable manner. While related, it does not specifically address the preparation of the report itself. C is incorrect. Standard I (C) - Misrepresentation prohibits members and candidates from knowingly making any misrepresentations relating to investment analysis, recommendations, actions, or other professional activities. Diligent and thorough research does help prevent misrepresentation, but it is Standard V (A) that directly calls for a reasonable basis for investment recommendations.", "explhtml": "<p>Standard V (A) requires members and candidates to exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions. By using sound financial models and rigorous data analysis, Alice is complying with this duty and providing a sound basis for her investment recommendations.<\/p><p><b>A is incorrect.<\/b> Standard V (B) - Communication with Clients and Prospective Clients focuses on the need to communicate investment analysis and recommendations to clients in a fair, accurate, and understandable manner. While related, it does not specifically address the preparation of the report itself.<\/p><p><b>C is incorrect.<\/b> Standard I (C) - Misrepresentation prohibits members and candidates from knowingly making any misrepresentations relating to investment analysis, recommendations, actions, or other professional activities. Diligent and thorough research does help prevent misrepresentation, but it is Standard V (A) that directly calls for a reasonable basis for investment recommendations.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Alice Johnson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alice Johnson, CFA, is an equity analyst at Bright Investment Management, a firm managing<\/p><p>portfolios for high-net-worth individuals. As part of her research responsibilities, Alice is tasked<\/p><p>with generating investment-grade reports on companies across different industries. Her process<\/p><p>includes rigorous financial modeling, projecting future earnings based on current economic data,<\/p><p>management discussions, and field analysis.<\/p><p>Lately, Alice has been focusing on the healthcare industry and has developed a strong opinion on<\/p><p>Medicore Inc., a company she believes is poised for significant growth due to an innovative new<\/p><p>drug that is expected to revolutionize treatments in its category. Alice wants to set up private<\/p><p>meetings with key executives from Medicore Inc. to validate her assumptions and forecasts.<\/p><p>To provide an incentive for the executives to share information freely, Alice contemplates gifting<\/p><p>them exclusive memberships to an elite health and wellness resort, which she believes aligns<\/p><p>with their personal interest in healthcare. She also intends to request suppliers’ and customers’<\/p><p>confidential data to better understand the value chain and gain insights beyond what&#x27;s publicly<\/p><p>available.<\/p><p>Simultaneously, Alice is aware that Bright Investment Management is about to take on a new<\/p><p>client, whose portfolio will substantially benefit if Medicore Inc. is added before the publication<\/p><p>of her report. She is considering whether she should act on her findings and include Medicore<\/p><p>Inc. in the new client&#x27;s portfolio immediately or wait until after her report is published.<\/p><p>Bright Investment Management has strict policies about gifts and entertainment and requires<\/p><p>analysts to always act in the best interest of the client. Furthermore, all non-public material<\/p><p>information must be handled confidentially.<\/p><p>Alice is also part of an analyst networking group where analysts share general market trends and<\/p><p>investment ideas. She sometimes discusses her hypotheses regarding certain companies, without<\/p><p>sharing specific details, to validate her thinking and gauge market sentiment.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard would Alice be adhering to if she accurately represents her research findings and ensures the utilization of sound financial models and rigorous data analysis while preparing her report on Medicore Inc.?<\/p><\/div>", "subj": "ethics"}, {"n": 65, "q": "Which Standard is most likely implicated if Martín’s report fails to distinguish fact from opinion?", "opts": ["Standard I(A) – Knowledge of the Law.", "Standard I(B) – Independence and Objectivity.", "Standard V(B) – Communication with Clients and Prospective Clients"], "ans": "C", "expl": "Standard V(B) requires that all research reports clearly differentiate between facts and opinions. This is critical because clients and prospective investors rely on the clarity of the report to understand the basis of the recommendations. If Martín’s report fails to make this clear distinction, it misleads the readers by blurring objective data with subjective views, directly contravening the requirement for transparent communication. A is incorrect. Standard I(A) deals with the necessity of knowing and complying with applicable laws. It does not address the presentation or structure of the research report content. B is incorrect. Standard I(B) focuses more on maintaining independence and objectivity, chiefly ensuring that personal or external conflicts do not bias the analysis. While important, it is not specifically about distinguishing fact from opinion.", "explhtml": "<p>Standard V(B) requires that all research reports clearly differentiate between facts and opinions. This is critical because clients and prospective investors rely on the clarity of the report to understand the basis of the recommendations. If Martín’s report fails to make this clear distinction, it misleads the readers by blurring objective data with subjective views, directly contravening the requirement for transparent communication.<\/p><p><b>A is incorrect.<\/b> Standard I(A) deals with the necessity of knowing and complying with applicable laws. It does not address the presentation or structure of the research report content.<\/p><p><b>B is incorrect.<\/b> Standard I(B) focuses more on maintaining independence and objectivity, chiefly ensuring that personal or external conflicts do not bias the analysis. While important, it is not specifically about distinguishing fact from opinion.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Xander Rudolf<\/summary><div class=\"vig-body\"><p>Xander Rudolf, CFA, is a portfolio manager at Leicester Capital Ltd (LC), a $3 billion asset<\/p><p>manager specializing in global fixed–income strategies. LC’s investment process emphasizes<\/p><p>rigorous application of the CFA Institute Code of Ethics and Standards of Professional Conduct<\/p><p>and integration of material ESG factors into security analysis. Rudolf leads a team that includes<\/p><p>Maya Chen, the firm’s compliance officer, and Leo Martín, a junior analyst focusing on ESG<\/p><p>research. In a recent review of LC’s China credit mandates, Chen reminds Rudolf that all<\/p><p>research reports must distinguish between fact and opinion and fully disclose any limitations of<\/p><p>proprietary models, as per Standard V(B). She also reiterates the need to comply with more<\/p><p>stringent local regulations, even when they exceed the Code’s requirements, aligning with the<\/p><p>“more stringent of law or Code” principle.<\/p><p>Meanwhile, Martín has identified three potential ESG issues for Zhengwei Electric, a state–<\/p><p>owned Chinese power equipment manufacturer: dual–class share structure limiting minority<\/p><p>rights, high sulfur dioxide emissions relative to peers, and recent safety incidents at one of its<\/p><p>plants. Martín proposes using proprietary emissions data alongside third–party ratings to<\/p><p>quantify near–term compliance costs.<\/p><p>Rudolf convenes an ethics‐integration workshop, where he introduces the four‐step ethical<\/p><p>decision–making framework: Identify, Consider, Decide &amp; Act, Reflect, and challenges the team<\/p><p>to apply it when deciding whether to recommend Zhengwei. He emphasizes that internal<\/p><p>recommendations must be supported by a reasonable and adequate basis, exercising<\/p><p>independence and objectivity in line with Standard I(B).<\/p><p>At the next investment committee meeting, Xander must (1) ensure Leo’s ESG-adjusted cash‐flow<\/p><p>forecasts reflect plausible emission–tax impacts, (2) confirm Maya’s guidance on disclosure of<\/p><p>model limitations, and (3) demonstrate how the decision–making framework was used to arrive<\/p><p>at the final recommendation.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard is most likely implicated if Martín’s report fails to distinguish fact from opinion?<\/p><\/div>", "subj": "ethics"}, {"n": 66, "q": "Leo’s use of third‐party ESG ratings without verifying their methodology is least likely to satisfy which Standard?", "opts": ["Standard V(A) – Diligence and Reasonable Basis.", "Standard III(C) – Suitability.", "Standard I(B) – Independence and Objectivity"], "ans": "A", "expl": "Standard V(A) mandates that an analyst must have a reasonable and adequate basis for all research reports and recommendations, which includes thorough due diligence on any third‐ party data used. By employing third-party ESG ratings without vetting the methodology, Leo risks basing his analysis on potentially flawed or unverified data. This lack of due diligence undermines the robustness and accuracy of the research, directly conflicting with the requirement to establish a strong and verifiable foundation for investment analysis. B is incorrect. Standard III(C) mostly centers on ensuring that any recommendations are suitable for the client’s context, not the reliability of the inputs or the due diligence process related to research. C is incorrect. While maintaining independence and objectivity (Standard I(B)) is crucial, using third-party data does not inherently compromise these values unless there is evidence of undue influence or bias. The main issue here is the lack of due diligence, not a compromise in objectivity.", "explhtml": "<p>Standard V(A) mandates that an analyst must have a reasonable and adequate basis for all research reports and recommendations, which includes thorough due diligence on any third‐ party data used. By employing third-party ESG ratings without vetting the methodology, Leo risks basing his analysis on potentially flawed or unverified data. This lack of due diligence undermines the robustness and accuracy of the research, directly conflicting with the requirement to establish a strong and verifiable foundation for investment analysis.<\/p><p><b>B is incorrect.<\/b> Standard III(C) mostly centers on ensuring that any recommendations are suitable for the client’s context, not the reliability of the inputs or the due diligence process related to research.<\/p><p><b>C is incorrect.<\/b> While maintaining independence and objectivity (Standard I(B)) is crucial, using third-party data does not inherently compromise these values unless there is evidence of undue influence or bias. The main issue here is the lack of due diligence, not a compromise in objectivity.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Xander Rudolf<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Xander Rudolf, CFA, is a portfolio manager at Leicester Capital Ltd (LC), a $3 billion asset<\/p><p>manager specializing in global fixed–income strategies. LC’s investment process emphasizes<\/p><p>rigorous application of the CFA Institute Code of Ethics and Standards of Professional Conduct<\/p><p>and integration of material ESG factors into security analysis. Rudolf leads a team that includes<\/p><p>Maya Chen, the firm’s compliance officer, and Leo Martín, a junior analyst focusing on ESG<\/p><p>research. In a recent review of LC’s China credit mandates, Chen reminds Rudolf that all<\/p><p>research reports must distinguish between fact and opinion and fully disclose any limitations of<\/p><p>proprietary models, as per Standard V(B). She also reiterates the need to comply with more<\/p><p>stringent local regulations, even when they exceed the Code’s requirements, aligning with the<\/p><p>“more stringent of law or Code” principle.<\/p><p>Meanwhile, Martín has identified three potential ESG issues for Zhengwei Electric, a state–<\/p><p>owned Chinese power equipment manufacturer: dual–class share structure limiting minority<\/p><p>rights, high sulfur dioxide emissions relative to peers, and recent safety incidents at one of its<\/p><p>plants. Martín proposes using proprietary emissions data alongside third–party ratings to<\/p><p>quantify near–term compliance costs.<\/p><p>Rudolf convenes an ethics‐integration workshop, where he introduces the four‐step ethical<\/p><p>decision–making framework: Identify, Consider, Decide &amp; Act, Reflect, and challenges the team<\/p><p>to apply it when deciding whether to recommend Zhengwei. He emphasizes that internal<\/p><p>recommendations must be supported by a reasonable and adequate basis, exercising<\/p><p>independence and objectivity in line with Standard I(B).<\/p><p>At the next investment committee meeting, Xander must (1) ensure Leo’s ESG-adjusted cash‐flow<\/p><p>forecasts reflect plausible emission–tax impacts, (2) confirm Maya’s guidance on disclosure of<\/p><p>model limitations, and (3) demonstrate how the decision–making framework was used to arrive<\/p><p>at the final recommendation.<\/p><\/div><\/details><div class=\"qtext\"><p>Leo’s use of third‐party ESG ratings without verifying their methodology is least likely to satisfy which Standard?<\/p><\/div>", "subj": "ethics"}, {"n": 67, "q": "Which ESG factor is most likely to have a material near‐term cash‐flow impact on Zhengwei Electric?", "opts": ["Dual‐class share structure.", "Sulfur dioxide emissions intensity.", "Plant safety incident rate"], "ans": "B", "expl": "Sulfur dioxide emissions intensity is directly linked to near-term cash flows because it can lead to tangible financial burdens like increased emission taxes, mandatory capital expenditures for emissions control, or fines to comply with environmental regulations. These compliance-related costs are quantifiable and tend to be recurring based on production and emissions levels. The direct connection to environmental regulation makes this factor a material element affecting short-term cash flows A is incorrect. A dual‐class share structure primarily influences the company’s governance and control issues, which typically have longer-term implications on valuation rather than immediate cash flow effects. C is incorrect. Although plant safety incidents can result in fines or temporary shutdowns, these events are generally irregular and their costs less predictable compared to the systematic and potentially significant costs associated with emissions regulations.", "explhtml": "<p>Sulfur dioxide emissions intensity is directly linked to near-term cash flows because it can lead to tangible financial burdens like increased emission taxes, mandatory capital expenditures for emissions control, or fines to comply with environmental regulations. These compliance-related costs are quantifiable and tend to be recurring based on production and emissions levels. The direct connection to environmental regulation makes this factor a material element affecting short-term cash flows<\/p><p><b>A is incorrect.<\/b> A dual‐class share structure primarily influences the company’s governance and control issues, which typically have longer-term implications on valuation rather than immediate cash flow effects.<\/p><p><b>C is incorrect.<\/b> Although plant safety incidents can result in fines or temporary shutdowns, these events are generally irregular and their costs less predictable compared to the systematic and potentially significant costs associated with emissions regulations.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Xander Rudolf<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Xander Rudolf, CFA, is a portfolio manager at Leicester Capital Ltd (LC), a $3 billion asset<\/p><p>manager specializing in global fixed–income strategies. LC’s investment process emphasizes<\/p><p>rigorous application of the CFA Institute Code of Ethics and Standards of Professional Conduct<\/p><p>and integration of material ESG factors into security analysis. Rudolf leads a team that includes<\/p><p>Maya Chen, the firm’s compliance officer, and Leo Martín, a junior analyst focusing on ESG<\/p><p>research. In a recent review of LC’s China credit mandates, Chen reminds Rudolf that all<\/p><p>research reports must distinguish between fact and opinion and fully disclose any limitations of<\/p><p>proprietary models, as per Standard V(B). She also reiterates the need to comply with more<\/p><p>stringent local regulations, even when they exceed the Code’s requirements, aligning with the<\/p><p>“more stringent of law or Code” principle.<\/p><p>Meanwhile, Martín has identified three potential ESG issues for Zhengwei Electric, a state–<\/p><p>owned Chinese power equipment manufacturer: dual–class share structure limiting minority<\/p><p>rights, high sulfur dioxide emissions relative to peers, and recent safety incidents at one of its<\/p><p>plants. Martín proposes using proprietary emissions data alongside third–party ratings to<\/p><p>quantify near–term compliance costs.<\/p><p>Rudolf convenes an ethics‐integration workshop, where he introduces the four‐step ethical<\/p><p>decision–making framework: Identify, Consider, Decide &amp; Act, Reflect, and challenges the team<\/p><p>to apply it when deciding whether to recommend Zhengwei. He emphasizes that internal<\/p><p>recommendations must be supported by a reasonable and adequate basis, exercising<\/p><p>independence and objectivity in line with Standard I(B).<\/p><p>At the next investment committee meeting, Xander must (1) ensure Leo’s ESG-adjusted cash‐flow<\/p><p>forecasts reflect plausible emission–tax impacts, (2) confirm Maya’s guidance on disclosure of<\/p><p>model limitations, and (3) demonstrate how the decision–making framework was used to arrive<\/p><p>at the final recommendation.<\/p><\/div><\/details><div class=\"qtext\"><p>Which ESG factor is most likely to have a material near‐term cash‐flow impact on Zhengwei Electric?<\/p><\/div>", "subj": "ethics"}, {"n": 68, "q": "Which step in the ethical decision‐making framework did Rudolf apply by reviewing expected outcomes and comparing them to actual portfolio performance?", "opts": ["Identify", "Reflect", "Decide and Act"], "ans": "B", "expl": "The \"Reflect\" step in the four‐step ethical decision‐making framework is focused on post-decision evaluation. It requires practitioners to compare the outcomes of their decisions with their initial expectations, learn from the differences, and use this insight to improve future decision-making processes. Rudolf’s action of comparing the expected outcomes with the actual portfolio performance is a hallmark of this reflective process, ensuring that learning and accountability are built into the strategic process. A is incorrect. The \"Identify\" stage involves recognizing and outlining the ethical issues, the stakeholders, and the duties involved before any action is taken. C is incorrect. \"Decide and Act\" covers the process of selecting a course of action and implementing it, rather than the retrospective analysis of the outcomes.", "explhtml": "<p>The &quot;Reflect&quot; step in the four‐step ethical decision‐making framework is focused on post-decision evaluation. It requires practitioners to compare the outcomes of their decisions with their initial expectations, learn from the differences, and use this insight to improve future decision-making processes. Rudolf’s action of comparing the expected outcomes with the actual portfolio performance is a hallmark of this reflective process, ensuring that learning and accountability are built into the strategic process.<\/p><p><b>A is incorrect.<\/b> The &quot;Identify&quot; stage involves recognizing and outlining the ethical issues, the stakeholders, and the duties involved before any action is taken.<\/p><p><b>C is incorrect.<\/b> &quot;Decide and Act&quot; covers the process of selecting a course of action and implementing it, rather than the retrospective analysis of the outcomes.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Xander Rudolf<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Xander Rudolf, CFA, is a portfolio manager at Leicester Capital Ltd (LC), a $3 billion asset<\/p><p>manager specializing in global fixed–income strategies. LC’s investment process emphasizes<\/p><p>rigorous application of the CFA Institute Code of Ethics and Standards of Professional Conduct<\/p><p>and integration of material ESG factors into security analysis. Rudolf leads a team that includes<\/p><p>Maya Chen, the firm’s compliance officer, and Leo Martín, a junior analyst focusing on ESG<\/p><p>research. In a recent review of LC’s China credit mandates, Chen reminds Rudolf that all<\/p><p>research reports must distinguish between fact and opinion and fully disclose any limitations of<\/p><p>proprietary models, as per Standard V(B). She also reiterates the need to comply with more<\/p><p>stringent local regulations, even when they exceed the Code’s requirements, aligning with the<\/p><p>“more stringent of law or Code” principle.<\/p><p>Meanwhile, Martín has identified three potential ESG issues for Zhengwei Electric, a state–<\/p><p>owned Chinese power equipment manufacturer: dual–class share structure limiting minority<\/p><p>rights, high sulfur dioxide emissions relative to peers, and recent safety incidents at one of its<\/p><p>plants. Martín proposes using proprietary emissions data alongside third–party ratings to<\/p><p>quantify near–term compliance costs.<\/p><p>Rudolf convenes an ethics‐integration workshop, where he introduces the four‐step ethical<\/p><p>decision–making framework: Identify, Consider, Decide &amp; Act, Reflect, and challenges the team<\/p><p>to apply it when deciding whether to recommend Zhengwei. He emphasizes that internal<\/p><p>recommendations must be supported by a reasonable and adequate basis, exercising<\/p><p>independence and objectivity in line with Standard I(B).<\/p><p>At the next investment committee meeting, Xander must (1) ensure Leo’s ESG-adjusted cash‐flow<\/p><p>forecasts reflect plausible emission–tax impacts, (2) confirm Maya’s guidance on disclosure of<\/p><p>model limitations, and (3) demonstrate how the decision–making framework was used to arrive<\/p><p>at the final recommendation.<\/p><\/div><\/details><div class=\"qtext\"><p>Which step in the ethical decision‐making framework did Rudolf apply by reviewing expected outcomes and comparing them to actual portfolio performance?<\/p><\/div>", "subj": "ethics"}, {"n": 69, "q": "Which Standard does Vadolia most likely violate by accepting the sponsored safari trip without informing her employer?", "opts": ["Standard I(B) Independence and Objectivity", "Standard III(B) Fair Dealing", "Standard IV(A) Loyalty"], "ans": "A", "expl": "Standard I(B) Independence and Objectivity, because Vadolia accepted a sponsored trip, including flight, hotel, and an exclusive safari tour, without reporting it to her employer. This violates the principle that CFA members and candidates must maintain independence and objectivity in their professional activities and avoid situations that could create or appear to create conflicts of interest. B is incorrect. Standard III(B) Fair Dealing requires members to act in the best interest of their employer and avoid actions that may harm the firm. While failing to report the trip could be seen as a lapse in loyalty, the primary issue is the potential compromise of her independence and objectivity, making Standard I(B) the most relevant violation. C is incorrect. Loyalty under Duties to Employers is broader and would apply if she were depriving her employer of professional benefits or working against their interest directly.", "explhtml": "<p>Standard I(B) Independence and Objectivity, because Vadolia accepted a sponsored trip, including flight, hotel, and an exclusive safari tour, without reporting it to her employer. This violates the principle that CFA members and candidates must maintain independence and objectivity in their professional activities and avoid situations that could create or appear to create conflicts of interest.<\/p><p><b>B is incorrect.<\/b> Standard III(B) Fair Dealing requires members to act in the best interest of their employer and avoid actions that may harm the firm. While failing to report the trip could be seen as a lapse in loyalty, the primary issue is the potential compromise of her independence and objectivity, making Standard I(B) the most relevant violation.<\/p><p><b>C is incorrect.<\/b> Loyalty under Duties to Employers is broader and would apply if she were depriving her employer of professional benefits or working against their interest directly.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Heeral Vadolia<\/summary><div class=\"vig-body\"><p>Heeral Vadolia, CFA, is a portfolio manager at Explico Capital Ltd (EC), a medium-sized asset<\/p><p>management firm based in Dubai. EC recently expanded operations into South Africa and<\/p><p>appointed Vadolia to oversee the Johannesburg office, manage client portfolios, and lead a team<\/p><p>of three junior analysts.<\/p><p>To boost EC’s profile in the new market, Vadolia accepts an invitation to speak at a regional<\/p><p>finance forum sponsored by local investment banks. The event organizers pay for her flight,<\/p><p>hotel, and an exclusive safari tour afterward. She does not report the trip to EC.<\/p><p>At the event, Vadolia presents EC’s investment process, incorporating data from a recently<\/p><p>acquired affiliate firm to illustrate the strong performance of EC’s Africa Growth Strategy. The<\/p><p>data from the affiliate is unaudited and spans a period before EC’s acquisition. She also refers to<\/p><p>herself as a “lead African portfolio expert certified by the CFA Institute.”<\/p><p>Meanwhile, one of Vadolia’s analysts, Simon Nkosi, recommends a thinly traded microcap stock<\/p><p>that is rumoured to be involved in an acquisition. Vadolia asks Nkosi for further evidence, but he<\/p><p>claims the source is “a former classmate working for the acquirer’s legal team.” Despite her<\/p><p>doubts, Vadolia instructs the trading desk to accumulate shares the next day.<\/p><p>Later that week, Vadolia learns Nkosi has been posting EC’s proprietary valuation models on an<\/p><p>online finance forum under his name to gain visibility.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard does Vadolia most likely violate by accepting the sponsored safari trip without informing her employer?<\/p><\/div>", "subj": "ethics"}, {"n": 70, "q": "What is the most appropriate ethical concern regarding Vadolia’s use of unaudited affiliate data in her presentation?", "opts": ["It fails to maintain the confidentiality of proprietary data.", "It misrepresents the investment performance.", "It violates Standard VI(A) by failing to disclose referral arrangements."], "ans": "B", "expl": "It misrepresents the investment performance because Vadolia used unaudited data from an affiliate firm to illustrate EC’s Africa Growth Strategy. This data spans a period before EC’s acquisition, meaning it does not accurately reflect EC’s investment performance. Standard I(C) Misrepresentation prohibits CFA members from knowingly making misleading or false statements related to investment analysis, recommendations, or performance. A is incorrect. This would be a concern if Vadolia had disclosed confidential client or firm data without authorization. However, the issue here is the accuracy of the performance data, not confidentiality. C is incorrect. Standard VI(A) addresses disclosing conflicts of interest, including referral fees or benefits received for recommending services. Vadolia’s use of unaudited data does not involve a referral arrangement, making this option incorrect.", "explhtml": "<p>It misrepresents the investment performance because Vadolia used unaudited data from an affiliate firm to illustrate EC’s Africa Growth Strategy. This data spans a period before EC’s acquisition, meaning it does not accurately reflect EC’s investment performance. Standard I(C) Misrepresentation prohibits CFA members from knowingly making misleading or false statements related to investment analysis, recommendations, or performance.<\/p><p><b>A is incorrect.<\/b> This would be a concern if Vadolia had disclosed confidential client or firm data without authorization. However, the issue here is the accuracy of the performance data, not confidentiality.<\/p><p><b>C is incorrect.<\/b> Standard VI(A) addresses disclosing conflicts of interest, including referral fees or benefits received for recommending services. Vadolia’s use of unaudited data does not involve a referral arrangement, making this option incorrect.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Heeral Vadolia<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Heeral Vadolia, CFA, is a portfolio manager at Explico Capital Ltd (EC), a medium-sized asset<\/p><p>management firm based in Dubai. EC recently expanded operations into South Africa and<\/p><p>appointed Vadolia to oversee the Johannesburg office, manage client portfolios, and lead a team<\/p><p>of three junior analysts.<\/p><p>To boost EC’s profile in the new market, Vadolia accepts an invitation to speak at a regional<\/p><p>finance forum sponsored by local investment banks. The event organizers pay for her flight,<\/p><p>hotel, and an exclusive safari tour afterward. She does not report the trip to EC.<\/p><p>At the event, Vadolia presents EC’s investment process, incorporating data from a recently<\/p><p>acquired affiliate firm to illustrate the strong performance of EC’s Africa Growth Strategy. The<\/p><p>data from the affiliate is unaudited and spans a period before EC’s acquisition. She also refers to<\/p><p>herself as a “lead African portfolio expert certified by the CFA Institute.”<\/p><p>Meanwhile, one of Vadolia’s analysts, Simon Nkosi, recommends a thinly traded microcap stock<\/p><p>that is rumoured to be involved in an acquisition. Vadolia asks Nkosi for further evidence, but he<\/p><p>claims the source is “a former classmate working for the acquirer’s legal team.” Despite her<\/p><p>doubts, Vadolia instructs the trading desk to accumulate shares the next day.<\/p><p>Later that week, Vadolia learns Nkosi has been posting EC’s proprietary valuation models on an<\/p><p>online finance forum under his name to gain visibility.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the most appropriate ethical concern regarding Vadolia’s use of unaudited affiliate data in her presentation?<\/p><\/div>", "subj": "ethics"}, {"n": 71, "q": "Which ethical standard is most clearly violated when Vadolia trades on the acquisition rumour provided by Nkosi?", "opts": ["Standard II(A) Material Nonpublic Information", "Standard III(C) Suitability", "Standard V(B) Communication with Clients and Prospective Clients"], "ans": "A", "expl": "Standard II(A) Material Nonpublic Information, because Vadolia acted on a rumor of an acquisition provided by Nkosi, whose source was a former classmate working for the acquirer’s legal team. This information is both material and nonpublic, meaning it could significantly impact the stock price and was not publicly available. Standard II(A) prohibits CFA members from trading or causing others to trade based on material nonpublic information, as it undermines market integrity. B is incorrect. Standard III(C) Suitability applies to ensuring that investment recommendations align with a client’s financial situation, objectives, and constraints. Vadolia’s decision was based on insider information rather than an assessment of suitability, making this option incorrect. C is incorrect. Standard V(B) requires clear and transparent communication with clients and prospective clients, ensuring investment processes and risk disclosures are fully understood. It also mandates a clear distinction between factual information and personal opinions when presenting investment recommendations. While Vadolia’s actions were unethical, the primary issue was insider trading rather than misleading communication.", "explhtml": "<p>Standard II(A) Material Nonpublic Information, because Vadolia acted on a rumor of an acquisition provided by Nkosi, whose source was a former classmate working for the acquirer’s legal team. This information is both material and nonpublic, meaning it could significantly impact the stock price and was not publicly available. Standard II(A) prohibits CFA members from trading or causing others to trade based on material nonpublic information, as it undermines market integrity.<\/p><p><b>B is incorrect.<\/b> Standard III(C) Suitability applies to ensuring that investment recommendations align with a client’s financial situation, objectives, and constraints. Vadolia’s decision was based on insider information rather than an assessment of suitability, making this option incorrect.<\/p><p><b>C is incorrect.<\/b> Standard V(B) requires clear and transparent communication with clients and prospective clients, ensuring investment processes and risk disclosures are fully understood. It also mandates a clear distinction between factual information and personal opinions when presenting investment recommendations. While Vadolia’s actions were unethical, the primary issue was insider trading rather than misleading communication.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Heeral Vadolia<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Heeral Vadolia, CFA, is a portfolio manager at Explico Capital Ltd (EC), a medium-sized asset<\/p><p>management firm based in Dubai. EC recently expanded operations into South Africa and<\/p><p>appointed Vadolia to oversee the Johannesburg office, manage client portfolios, and lead a team<\/p><p>of three junior analysts.<\/p><p>To boost EC’s profile in the new market, Vadolia accepts an invitation to speak at a regional<\/p><p>finance forum sponsored by local investment banks. The event organizers pay for her flight,<\/p><p>hotel, and an exclusive safari tour afterward. She does not report the trip to EC.<\/p><p>At the event, Vadolia presents EC’s investment process, incorporating data from a recently<\/p><p>acquired affiliate firm to illustrate the strong performance of EC’s Africa Growth Strategy. The<\/p><p>data from the affiliate is unaudited and spans a period before EC’s acquisition. She also refers to<\/p><p>herself as a “lead African portfolio expert certified by the CFA Institute.”<\/p><p>Meanwhile, one of Vadolia’s analysts, Simon Nkosi, recommends a thinly traded microcap stock<\/p><p>that is rumoured to be involved in an acquisition. Vadolia asks Nkosi for further evidence, but he<\/p><p>claims the source is “a former classmate working for the acquirer’s legal team.” Despite her<\/p><p>doubts, Vadolia instructs the trading desk to accumulate shares the next day.<\/p><p>Later that week, Vadolia learns Nkosi has been posting EC’s proprietary valuation models on an<\/p><p>online finance forum under his name to gain visibility.<\/p><\/div><\/details><div class=\"qtext\"><p>Which ethical standard is most clearly violated when Vadolia trades on the acquisition rumour provided by Nkosi?<\/p><\/div>", "subj": "ethics"}, {"n": 72, "q": "What is the most appropriate Standard that applies to Nkosi’s action of posting EC’s models under his name online?", "opts": ["Standard IV(C) Responsibilities of Supervisors", "Standard I(C) Misrepresentation", "Standard II(B) Market Manipulation"], "ans": "B", "expl": "Standard I(C) Misrepresentation, because Nkosi posted EC’s proprietary valuation models under his name on an online finance forum. Standard I(C) prohibits CFA members from knowingly making false or misleading statements related to investment analysis, recommendations, or professional activities. By presenting EC’s models as his own, Nkosi misrepresented the source of the information, violating ethical standards of honesty and transparency. A is incorrect. Standard IV(C) Responsibilities of Supervisors applies to ensuring that supervisors take reasonable steps to prevent and detect violations of ethical standards by those under their authority. While Vadolia may have failed in her supervisory duties, the primary moral issue here is Nkosi’s misrepresentation, making Standard I(C) the most relevant violation. C is incorrect. Standard II(B) Market Manipulation prohibits practices that distort prices or artificially inflate trading volume to mislead market participants. Nkosi’s actions did not involve manipulating market conditions but rather misrepresenting proprietary models, making this option incorrect.", "explhtml": "<p>Standard I(C) Misrepresentation, because Nkosi posted EC’s proprietary valuation models under his name on an online finance forum. Standard I(C) prohibits CFA members from knowingly making false or misleading statements related to investment analysis, recommendations, or professional activities. By presenting EC’s models as his own, Nkosi misrepresented the source of the information, violating ethical standards of honesty and transparency.<\/p><p><b>A is incorrect.<\/b> Standard IV(C) Responsibilities of Supervisors applies to ensuring that supervisors take reasonable steps to prevent and detect violations of ethical standards by those under their authority. While Vadolia may have failed in her supervisory duties, the primary moral issue here is Nkosi’s misrepresentation, making Standard I(C) the most relevant violation.<\/p><p><b>C is incorrect.<\/b> Standard II(B) Market Manipulation prohibits practices that distort prices or artificially inflate trading volume to mislead market participants. Nkosi’s actions did not involve manipulating market conditions but rather misrepresenting proprietary models, making this option incorrect.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Heeral Vadolia<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Heeral Vadolia, CFA, is a portfolio manager at Explico Capital Ltd (EC), a medium-sized asset<\/p><p>management firm based in Dubai. EC recently expanded operations into South Africa and<\/p><p>appointed Vadolia to oversee the Johannesburg office, manage client portfolios, and lead a team<\/p><p>of three junior analysts.<\/p><p>To boost EC’s profile in the new market, Vadolia accepts an invitation to speak at a regional<\/p><p>finance forum sponsored by local investment banks. The event organizers pay for her flight,<\/p><p>hotel, and an exclusive safari tour afterward. She does not report the trip to EC.<\/p><p>At the event, Vadolia presents EC’s investment process, incorporating data from a recently<\/p><p>acquired affiliate firm to illustrate the strong performance of EC’s Africa Growth Strategy. The<\/p><p>data from the affiliate is unaudited and spans a period before EC’s acquisition. She also refers to<\/p><p>herself as a “lead African portfolio expert certified by the CFA Institute.”<\/p><p>Meanwhile, one of Vadolia’s analysts, Simon Nkosi, recommends a thinly traded microcap stock<\/p><p>that is rumoured to be involved in an acquisition. Vadolia asks Nkosi for further evidence, but he<\/p><p>claims the source is “a former classmate working for the acquirer’s legal team.” Despite her<\/p><p>doubts, Vadolia instructs the trading desk to accumulate shares the next day.<\/p><p>Later that week, Vadolia learns Nkosi has been posting EC’s proprietary valuation models on an<\/p><p>online finance forum under his name to gain visibility.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the most appropriate Standard that applies to Nkosi’s action of posting EC’s models under his name online?<\/p><\/div>", "subj": "ethics"}, {"n": 73, "q": "Which Standard is Nichols enforcing in the dialogue about declining the issuer-paid dinner?", "opts": ["Standard I(A): Knowledge of the Law", "Standard I(B): Independence and Objectivity", "Standard I(E): Competence"], "ans": "B", "expl": "Nichols enforces Independence and Objectivity, which requires CFA members to avoid situations that could impair or appear to impair their professional judgment. Although Polish regulations permit issuer-paid entertainment up to €200, Nichols declines the dinner based on HGI’s stricter firm policy, which aligns with the CFA Code and Standards. The principle of following the highest applicable standard ensures ethical integrity. A is incorrect. This standard requires members to be familiar with and comply with all applicable regulations and laws. However, Nichols is not addressing a legal gap or a violation of Polish securities regulations. Instead, he is emphasizing firm policy, which goes beyond legal requirements. This makes Standard I(A) a less relevant choice in this scenario. C is incorrect. This standard relates to maintaining professional knowledge and skills necessary for investment analysis. Declining issuer-paid entertainment does not relate to technical competence or analytical abilities. Suppose Nichols were addressing Nowak’s ability to perform valuation modeling correctly. In that case, Standard I(E) might apply, but in this case, the focus is on ethical judgment rather than skills or expertise.", "explhtml": "<p>Nichols enforces Independence and Objectivity, which requires CFA members to avoid situations that could impair or appear to impair their professional judgment. Although Polish regulations permit issuer-paid entertainment up to €200, Nichols declines the dinner based on HGI’s stricter firm policy, which aligns with the CFA Code and Standards. The principle of following the highest applicable standard ensures ethical integrity.<\/p><p><b>A is incorrect.<\/b> This standard requires members to be familiar with and comply with all applicable regulations and laws. However, Nichols is not addressing a legal gap or a violation of Polish securities regulations. Instead, he is emphasizing firm policy, which goes beyond legal requirements. This makes Standard I(A) a less relevant choice in this scenario.<\/p><p><b>C is incorrect.<\/b> This standard relates to maintaining professional knowledge and skills necessary for investment analysis. Declining issuer-paid entertainment does not relate to technical competence or analytical abilities. Suppose Nichols were addressing Nowak’s ability to perform valuation modeling correctly. In that case, Standard I(E) might apply, but in this case, the focus is on ethical judgment rather than skills or expertise.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · John Nichols<\/summary><div class=\"vig-body\"><p>John Nichols, CFA, is a senior portfolio manager at Horizon Global Investments (HGI), a London-<\/p><p>based firm that has recently opened an office in Warsaw. Nichols has been sent to Warsaw for<\/p><p>three months to help establish the new team and roll out HGI’s European Small-Cap Growth<\/p><p>Strategy.<\/p><p>Katarzyna Nowak, a junior analyst hired locally, assists Nichols. In their very first week, several<\/p><p>ethical dilemmas arise: Poland’s securities regulator allows analysts to attend “roadshows”<\/p><p>funded by issuers, provided the ticket cost remains under €200. At an issuer-sponsored event for<\/p><p>a small polluting-technology company, Nowak enthusiastically says,<\/p><p>“We can accept their dinner invitation, they only charge €180, and it’s legal here.”<\/p><p>Nichols replies, “Even if it’s legal locally, HGI’s policy forbids taking any issuer-paid travel or<\/p><p>entertainment. We must refuse.” Later, Nowak asks Nichols, “May I forward our internal<\/p><p>valuation model to a friend at another asset manager? I want her feedback on my modeling<\/p><p>technique.” Nichols reminds her, “That model is HGI’s intellectual property and client-<\/p><p>confidential. You cannot share it.”<\/p><p>Nichols reviews the week’s trades and notices Nowak bought 5,000 shares of Solaris<\/p><p>Technologies (SOL) in her account. He also sees HGI executed a large buy order for SOL on<\/p><p>behalf of its European Small-Cap Growth Fund the next morning. The fund’s order price moved<\/p><p>up 7% on thin volume. Near the end of the month, Nichols receives a frustrated email from<\/p><p>compliance: “We’re still missing email trails for the SOL trade decision. Someone deleted<\/p><p>messages.” Nichols considers telling Nowak to clear out her mailbox before the Warsaw office<\/p><p>review.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard is Nichols enforcing in the dialogue about declining the issuer-paid dinner?<\/p><\/div>", "subj": "ethics"}, {"n": 74, "q": "In their email-model exchange, which Standard did Nowak most likely violate by proposing to share HGI’s valuation model?", "opts": ["Standard III(E): Preservation of Confidentiality", "Standard IV(B): Additional Compensation Arrangements", "Standard V(C): Record Retention"], "ans": "A", "expl": "Nowak violated Standard III(E) by attempting to share HGI’s proprietary valuation model without authorization. CFA members must protect confidential information related to their firm and clients unless explicit permission is granted or legal disclosure is required. Since the valuation model contains internal intellectual property and client-sensitive data, sharing it with an external party would be an ethical breach. B is incorrect. This standard addresses the disclosure of gifts, bonuses, or other financial compensation that may create conflicts of interest between an employee and their employer. Nowak’s situation does not involve receiving compensation or incentives—only unauthorized information sharing, so this is not relevant. C is incorrect. Standard V(C) concerns maintaining proper documentation and audit trails of investment research and recommendations. While proper record-keeping is essential, this scenario is about unauthorized disclosure rather than documentation practices. The violation here is sharing proprietary data, which falls under the category of confidentiality rather than record-keeping.", "explhtml": "<p>Nowak violated Standard III(E) by attempting to share HGI’s proprietary valuation model without authorization. CFA members must protect confidential information related to their firm and clients unless explicit permission is granted or legal disclosure is required. Since the valuation model contains internal intellectual property and client-sensitive data, sharing it with an external party would be an ethical breach.<\/p><p><b>B is incorrect.<\/b> This standard addresses the disclosure of gifts, bonuses, or other financial compensation that may create conflicts of interest between an employee and their employer. Nowak’s situation does not involve receiving compensation or incentives—only unauthorized information sharing, so this is not relevant.<\/p><p><b>C is incorrect.<\/b> Standard V(C) concerns maintaining proper documentation and audit trails of investment research and recommendations. While proper record-keeping is essential, this scenario is about unauthorized disclosure rather than documentation practices. The violation here is sharing proprietary data, which falls under the category of confidentiality rather than record-keeping.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · John Nichols<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Nichols, CFA, is a senior portfolio manager at Horizon Global Investments (HGI), a London-<\/p><p>based firm that has recently opened an office in Warsaw. Nichols has been sent to Warsaw for<\/p><p>three months to help establish the new team and roll out HGI’s European Small-Cap Growth<\/p><p>Strategy.<\/p><p>Katarzyna Nowak, a junior analyst hired locally, assists Nichols. In their very first week, several<\/p><p>ethical dilemmas arise: Poland’s securities regulator allows analysts to attend “roadshows”<\/p><p>funded by issuers, provided the ticket cost remains under €200. At an issuer-sponsored event for<\/p><p>a small polluting-technology company, Nowak enthusiastically says,<\/p><p>“We can accept their dinner invitation, they only charge €180, and it’s legal here.”<\/p><p>Nichols replies, “Even if it’s legal locally, HGI’s policy forbids taking any issuer-paid travel or<\/p><p>entertainment. We must refuse.” Later, Nowak asks Nichols, “May I forward our internal<\/p><p>valuation model to a friend at another asset manager? I want her feedback on my modeling<\/p><p>technique.” Nichols reminds her, “That model is HGI’s intellectual property and client-<\/p><p>confidential. You cannot share it.”<\/p><p>Nichols reviews the week’s trades and notices Nowak bought 5,000 shares of Solaris<\/p><p>Technologies (SOL) in her account. He also sees HGI executed a large buy order for SOL on<\/p><p>behalf of its European Small-Cap Growth Fund the next morning. The fund’s order price moved<\/p><p>up 7% on thin volume. Near the end of the month, Nichols receives a frustrated email from<\/p><p>compliance: “We’re still missing email trails for the SOL trade decision. Someone deleted<\/p><p>messages.” Nichols considers telling Nowak to clear out her mailbox before the Warsaw office<\/p><p>review.<\/p><\/div><\/details><div class=\"qtext\"><p>In their email-model exchange, which Standard did Nowak most likely violate by proposing to share HGI’s valuation model?<\/p><\/div>", "subj": "ethics"}, {"n": 75, "q": "Which Standard is Nichols invoking when he insists that Nowak pre-clear her trades and wait until the fund’s order is fully executed?", "opts": ["Standard VI(B): Priority of Transactions", "Standard II(B): Market Manipulation", "Standard I(C): Misrepresentation"], "ans": "A", "expl": "Standard VI(B): Priority of Transactions. Nichols enforces Standard VI(B), which requires that clients' and employers' transactions take precedence over personal trades. The goal is to prevent conflicts of interest, such as front-running, where an individual places personal trades ahead of client transactions to gain an advantage. By insisting on pre-clearance and waiting for the fund’s order to execute first, Nichols ensures ethical trading practices. B is incorrect. This standard pertains to the deliberate misrepresentation of market participants by distorting prices or trading volumes. While Nowak’s personal trade coincided with the fund’s order, there was no intent to manipulate the market, making this standard irrelevant. C is incorrect. This standard applies to making false or misleading statements in communications. Since Nichols is addressing trade sequencing rather than deceptive information, no misrepresentation has occurred, making this choice incorrect.", "explhtml": "<p>Standard VI(B): Priority of Transactions. Nichols enforces Standard VI(B), which requires that clients&#x27; and employers&#x27; transactions take precedence over personal trades. The goal is to prevent conflicts of interest, such as front-running, where an individual places personal trades ahead of client transactions to gain an advantage. By insisting on pre-clearance and waiting for the fund’s order to execute first, Nichols ensures ethical trading practices.<\/p><p><b>B is incorrect.<\/b> This standard pertains to the deliberate misrepresentation of market participants by distorting prices or trading volumes. While Nowak’s personal trade coincided with the fund’s order, there was no intent to manipulate the market, making this standard irrelevant.<\/p><p><b>C is incorrect.<\/b> This standard applies to making false or misleading statements in communications. Since Nichols is addressing trade sequencing rather than deceptive information, no misrepresentation has occurred, making this choice incorrect.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · John Nichols<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Nichols, CFA, is a senior portfolio manager at Horizon Global Investments (HGI), a London-<\/p><p>based firm that has recently opened an office in Warsaw. Nichols has been sent to Warsaw for<\/p><p>three months to help establish the new team and roll out HGI’s European Small-Cap Growth<\/p><p>Strategy.<\/p><p>Katarzyna Nowak, a junior analyst hired locally, assists Nichols. In their very first week, several<\/p><p>ethical dilemmas arise: Poland’s securities regulator allows analysts to attend “roadshows”<\/p><p>funded by issuers, provided the ticket cost remains under €200. At an issuer-sponsored event for<\/p><p>a small polluting-technology company, Nowak enthusiastically says,<\/p><p>“We can accept their dinner invitation, they only charge €180, and it’s legal here.”<\/p><p>Nichols replies, “Even if it’s legal locally, HGI’s policy forbids taking any issuer-paid travel or<\/p><p>entertainment. We must refuse.” Later, Nowak asks Nichols, “May I forward our internal<\/p><p>valuation model to a friend at another asset manager? I want her feedback on my modeling<\/p><p>technique.” Nichols reminds her, “That model is HGI’s intellectual property and client-<\/p><p>confidential. You cannot share it.”<\/p><p>Nichols reviews the week’s trades and notices Nowak bought 5,000 shares of Solaris<\/p><p>Technologies (SOL) in her account. He also sees HGI executed a large buy order for SOL on<\/p><p>behalf of its European Small-Cap Growth Fund the next morning. The fund’s order price moved<\/p><p>up 7% on thin volume. Near the end of the month, Nichols receives a frustrated email from<\/p><p>compliance: “We’re still missing email trails for the SOL trade decision. Someone deleted<\/p><p>messages.” Nichols considers telling Nowak to clear out her mailbox before the Warsaw office<\/p><p>review.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard is Nichols invoking when he insists that Nowak pre-clear her trades and wait until the fund’s order is fully executed?<\/p><\/div>", "subj": "ethics"}, {"n": 76, "q": "Nichols considers advising Nowak to delete her old e-mails before the month-end review. Which Standard would that action violate?", "opts": ["Standard V(C): Record Retention", "Standard VII(A): Conduct as Participants in CFA Institute Programs", "Standard I(D): Misconduct"], "ans": "A", "expl": "This standard requires CFA members to maintain and develop appropriate records to support their investment analyses, recommendations, and actions. Advising Nowak to delete emails before a review constitutes a violation of record retention policies, as it obstructs transparency and accountability. Any attempt to erase records before an audit can signal unethical intent and potential misconduct. B is incorrect. This standard pertains to exam conduct and CFA Institute membership behavior, such as cheating on exams or misrepresenting CFA credentials. Since Nichols’ consideration involves record retention within the firm, this standard does not apply. C is incorrect. While misconduct broadly covers unethical behavior, Standard V(C) specifically addresses record destruction, making it the more precise and applicable standard. A failure to maintain records directly violates professional obligations under the CFA Code of Ethics.", "explhtml": "<p>This standard requires CFA members to maintain and develop appropriate records to support their investment analyses, recommendations, and actions. Advising Nowak to delete emails before a review constitutes a violation of record retention policies, as it obstructs transparency and accountability. Any attempt to erase records before an audit can signal unethical intent and potential misconduct.<\/p><p><b>B is incorrect.<\/b> This standard pertains to exam conduct and CFA Institute membership behavior, such as cheating on exams or misrepresenting CFA credentials. Since Nichols’ consideration involves record retention within the firm, this standard does not apply.<\/p><p><b>C is incorrect.<\/b> While misconduct broadly covers unethical behavior, Standard V(C) specifically addresses record destruction, making it the more precise and applicable standard. A failure to maintain records directly violates professional obligations under the CFA Code of Ethics.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · John Nichols<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Nichols, CFA, is a senior portfolio manager at Horizon Global Investments (HGI), a London-<\/p><p>based firm that has recently opened an office in Warsaw. Nichols has been sent to Warsaw for<\/p><p>three months to help establish the new team and roll out HGI’s European Small-Cap Growth<\/p><p>Strategy.<\/p><p>Katarzyna Nowak, a junior analyst hired locally, assists Nichols. In their very first week, several<\/p><p>ethical dilemmas arise: Poland’s securities regulator allows analysts to attend “roadshows”<\/p><p>funded by issuers, provided the ticket cost remains under €200. At an issuer-sponsored event for<\/p><p>a small polluting-technology company, Nowak enthusiastically says,<\/p><p>“We can accept their dinner invitation, they only charge €180, and it’s legal here.”<\/p><p>Nichols replies, “Even if it’s legal locally, HGI’s policy forbids taking any issuer-paid travel or<\/p><p>entertainment. We must refuse.” Later, Nowak asks Nichols, “May I forward our internal<\/p><p>valuation model to a friend at another asset manager? I want her feedback on my modeling<\/p><p>technique.” Nichols reminds her, “That model is HGI’s intellectual property and client-<\/p><p>confidential. You cannot share it.”<\/p><p>Nichols reviews the week’s trades and notices Nowak bought 5,000 shares of Solaris<\/p><p>Technologies (SOL) in her account. He also sees HGI executed a large buy order for SOL on<\/p><p>behalf of its European Small-Cap Growth Fund the next morning. The fund’s order price moved<\/p><p>up 7% on thin volume. Near the end of the month, Nichols receives a frustrated email from<\/p><p>compliance: “We’re still missing email trails for the SOL trade decision. Someone deleted<\/p><p>messages.” Nichols considers telling Nowak to clear out her mailbox before the Warsaw office<\/p><p>review.<\/p><\/div><\/details><div class=\"qtext\"><p>Nichols considers advising Nowak to delete her old e-mails before the month-end review. Which Standard would that action violate?<\/p><\/div>", "subj": "ethics"}, {"n": 77, "q": "Which Standard is Williams most likely violating by providing JCF with Zenith’s proprietary sector models?", "opts": ["Standard I(D): Misconduct", "Standard IV(A): Loyalty", "Standard VI(A): Avoid or Disclose Conflicts"], "ans": "B", "expl": "This standard requires CFA Institute members to act in the best interests of their employer and refrain from actions that could harm or disadvantage the firm, including disclosing confidential data or appropriating intellectual property. By taking Zenith’s proprietary sector models and distributing them at JCF, Williams violates the trust and legal obligation he held to his previous employer. The models constitute trade secrets, Zenith’s competitive edge, and using them elsewhere, even under the guise of “personal reference,” directly breaches his duty of loyalty. A is incorrect. Standard I(D) covers professional misconduct involving fraud, deceit, or dishonesty, including conduct that reflects poorly on one's integrity. While Williams’s behavior is certainly unethical, the key issue is not just general misconduct; it’s the specific betrayal o
