uld impact their investment decisions and financial planning. In the fast-paced financial markets, a lot can change in six months, and clients may miss opportunities or fail to address risks in a timely manner if updates are only provided semiannually. Thus, semiannual statements do not align with the best practices of regular and thorough communication stipulated under Standard III (A). <\/p><p class=\"los\">Ethics, Learning Module 2: Application of the Code and Standards, LOS 2(a): Evaluate policies and practices for a firm and an individual in relation to the CFA Institute Code of Ethics and Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Ryan Gentner<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ryan Gentner, CFA, is an investment advisor with Seaforth Investment Partners (Seaforth). After contemplating a change for the past few years, Gentner has decided to move back to his hometown of Stoneton, a three-hour drive west of the city in which Seaforth is headquartered. He intends to start his own boutique investment advisory firm, Gentner Capital.<\/p><p>Gentner notifies his supervisor, Aileen McCartney, of his intention to leave Seaforth. Because McCartney expects the level of competition between the two firms to be minimal relative to Seaforth&#x27;s total revenues, and out of appreciation for Gentner&#x27;s years of service, McCartney gives Gentner written consent to take and use copies of her company&#x27;s proprietary materials used by its advisors in developing situational and psychological profiles of clients and prospective clients. After he has notified McCartney, but before his term of employment at Seaforth officially ends, Gentner devotes much of his time to developing a marketing strategy for his new firm.<\/p><p>Recognizing that he requires assistance in developing the digital aspects of a marketing strategy, Gentner emails Ruth Stern, a marketing consultant who has a longstanding and ongoing business engagement with Seaforth. This email appears in its entirety in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0007.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Gentner&#x27;s email to Stern\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0008.webp\" style=\"max-width:min(100%,612px)\" alt=\"Ruth,\"><p>In three weeks, I will be leaving Seaforth and moving back to Stoneton,<\/p><p>where I will be starting my own firm, Gentner Capital. While this new<\/p><p>venture will be too small to compete with all of the services Seaforth offers,<\/p><p>I expect that we will compete directly for some accounts, and I am<\/p><p>confident that at least some of my current clients will eventually move their<\/p><p>accounts to my boutique shop.<\/p><p>Having seen the results of your work with Seaforth, you are my first choice<\/p><p>to design and implement a digital marketing strategy for Gentner Capital. I<\/p><p>realize that this work may compete for some of the time you devote to<\/p><p>Seaforth, so I am willing to pay the same rate they pay for your services.<\/p><p>As you may know, I was recently awarded the CFA charter. I found that the<\/p><p>effort required to complete the CFA Program while working full-time was<\/p><p>greater than what it took to get through two years of business school. I<\/p><p>believe that I have improved my skills as an investment advisor by<\/p><p>obtaining my charter, and I hope that clients and prospective clients will<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0009.webp\" style=\"max-width:min(100%,612px)\" alt=\"agree.\"><p>Will you please take on my firm as a client?<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0010.webp\" style=\"max-width:min(100%,612px)\" alt=\"Best regards,\"><p>Ryan Gentner, M.B.A., C.F.A.<\/p><p>Stern considers the opportunity to consult for Gentner Capital, but ultimately decides to turn down the offer. In conveying this decision to Gentner, she notes that Seaforth is her largest client and does not believe that it would be wise to take on a competitor as a client.<\/p><p>After officially leaving Seaforth and moving to Stoneton, Gentner begins writing the policies he will implement at his new firm. Specifically, all Gentner Capital employees who provide advisory services must meet with clients at least once annually to determine if their investment objectives and/or constraints have changed and make any necessary updates to their investment policy statement. Another firm policy mandates that clients receive account statements at regular intervals containing, among other information, returns stated on a gross-of-fees, before-tax basis. However, Gentner has yet to decide how frequently these statements should be sent.<\/p><p>Gentner is pleased to find that many of the clients he served at Seaforth have opened accounts with his new firm within a few months of his move. Master emailed Gentner an order to buy 50,000 shares in Tyndale Microsystems (TMS), noting that this transaction would be consistent with the investment policy statement (IPS) that the two had created at the account opening stage.<\/p><p>On the morning of the IPO of TMS shares, Jacqueline Dumont, a long-time client of Seaforth, pays an initial visit to Gentner Capital&#x27;s office, intending to open an account with the new firm. While at the office, Dumont has a brief discussion with Gentner in which she mentions that she believes that 50,000 shares of TMS stock would be an ideal fit for her portfolio. Dumont spends most of her visit working with Gentner&#x27;s assistant to complete the paperwork required to open her account. Later that day, Gentner can complete a block trade for 20,000 TMS shares in the firm&#x27;s oversubscribed IPO. Because Masters and Dumont both referenced 50,000 shares of TMS, Gentner allocates 10,000 shares to each client&#x27;s account.<\/p><\/div><\/details><div class=\"qtext\"><p>To adhere to the Standards, Gentner should most likely provide clients with account statements at least:<\/p><\/div>", "subj": "ethics"}, {"n": 27, "q": "In allocating the TMS shares acquired in the block trade to client accounts, does Gentner most likely violate the Standards?", "opts": ["No", "Yes, concerning fair dealing only", "Yes, concerning both fair dealing and suitability"], "ans": "C", "expl": "Gentner's allocation of TMS shares to client accounts likely violates Standard III(C) - Suitability, which mandates that investment advisors make a reasonable inquiry into a client's investment experience, risk tolerance, and financial objectives before making investment recommendations. In the case of Jacqueline Dumont, while she expressed that 50,000 shares of TMS would be an ideal fit for her portfolio, there is no evidence that Gentner conducted a thorough assessment or developed an Investment Policy Statement (IPS) tailored to her specific financial situation and goals. This lack of personalized assessment and formal documentation of investment objectives and constraints is crucial in ensuring that investment actions are suitable for the client's financial needs and circumstances. The mere expression of interest by Dumont in a specific investment does not substitute for a comprehensive evaluation of her investment profile, which is a fundamental requirement under the Suitability Standard. A is incorrect. The option suggesting that Gentner did not violate any standards is incorrect because the actions described clearly contravene the principles of fair dealing and suitability. Fair dealing requires equitable treatment of all clients when disseminating investment recommendations and executing orders, while suitability demands a thorough understanding of the client's financial situation and investment objectives. Gentner's allocation of shares without a proper suitability assessment, as well as potentially unequal treatment of clients in the allocation process, indicates a breach of these standards. B is incorrect. This option, which states that Gentner violated the standard concerning fair dealing only, is partially correct but incomplete. While it is true that Gentner's actions raise concerns about fair dealing, particularly in how investment opportunities are allocated among clients, it overlooks the violation of the suitability standard. The suitability standard is specifically breached in the case of Dumont, where there was a failure to establish a formal investment strategy based on a detailed understanding of her personal financial circumstances and objectives before making investment decisions on her behalf. ", "explhtml": "<p>Gentner&#x27;s allocation of TMS shares to client accounts likely violates Standard III(C) - Suitability, which mandates that investment advisors make a reasonable inquiry into a client&#x27;s investment experience, risk tolerance, and financial objectives before making investment recommendations. In the case of Jacqueline Dumont, while she expressed that 50,000 shares of TMS would be an ideal fit for her portfolio, there is no evidence that Gentner conducted a thorough assessment or developed an Investment Policy Statement (IPS) tailored to her specific financial situation and goals. This lack of personalized assessment and formal documentation of investment objectives and constraints is crucial in ensuring that investment actions are suitable for the client&#x27;s financial needs and circumstances. The mere expression of interest by Dumont in a specific investment does not substitute for a comprehensive evaluation of her investment profile, which is a fundamental requirement under the Suitability Standard.<\/p><p><b>A is incorrect<\/b>. The option suggesting that Gentner did not violate any standards is incorrect because the actions described clearly contravene the principles of fair dealing and suitability. Fair dealing requires equitable treatment of all clients when disseminating investment recommendations and executing orders, while suitability demands a thorough understanding of the client&#x27;s financial situation and investment objectives. Gentner&#x27;s allocation of shares without a proper suitability assessment, as well as potentially unequal treatment of clients in the allocation process, indicates a breach of these standards.<\/p><p><b>B is incorrect<\/b>. This option, which states that Gentner violated the standard concerning fair dealing only, is partially correct but incomplete. While it is true that Gentner&#x27;s actions raise concerns about fair dealing, particularly in how investment opportunities are allocated among clients, it overlooks the violation of the suitability standard. The suitability standard is specifically breached in the case of Dumont, where there was a failure to establish a formal investment strategy based on a detailed understanding of her personal financial circumstances and objectives before making investment decisions on her behalf. <\/p><p class=\"los\">Ethics, Learning Module 2: Application of the Code and Standards, LOS 2 (b): Explain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Ryan Gentner<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ryan Gentner, CFA, is an investment advisor with Seaforth Investment Partners (Seaforth). After contemplating a change for the past few years, Gentner has decided to move back to his hometown of Stoneton, a three-hour drive west of the city in which Seaforth is headquartered. He intends to start his own boutique investment advisory firm, Gentner Capital.<\/p><p>Gentner notifies his supervisor, Aileen McCartney, of his intention to leave Seaforth. Because McCartney expects the level of competition between the two firms to be minimal relative to Seaforth&#x27;s total revenues, and out of appreciation for Gentner&#x27;s years of service, McCartney gives Gentner written consent to take and use copies of her company&#x27;s proprietary materials used by its advisors in developing situational and psychological profiles of clients and prospective clients. After he has notified McCartney, but before his term of employment at Seaforth officially ends, Gentner devotes much of his time to developing a marketing strategy for his new firm.<\/p><p>Recognizing that he requires assistance in developing the digital aspects of a marketing strategy, Gentner emails Ruth Stern, a marketing consultant who has a longstanding and ongoing business engagement with Seaforth. This email appears in its entirety in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0007.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Gentner&#x27;s email to Stern\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0008.webp\" style=\"max-width:min(100%,612px)\" alt=\"Ruth,\"><p>In three weeks, I will be leaving Seaforth and moving back to Stoneton,<\/p><p>where I will be starting my own firm, Gentner Capital. While this new<\/p><p>venture will be too small to compete with all of the services Seaforth offers,<\/p><p>I expect that we will compete directly for some accounts, and I am<\/p><p>confident that at least some of my current clients will eventually move their<\/p><p>accounts to my boutique shop.<\/p><p>Having seen the results of your work with Seaforth, you are my first choice<\/p><p>to design and implement a digital marketing strategy for Gentner Capital. I<\/p><p>realize that this work may compete for some of the time you devote to<\/p><p>Seaforth, so I am willing to pay the same rate they pay for your services.<\/p><p>As you may know, I was recently awarded the CFA charter. I found that the<\/p><p>effort required to complete the CFA Program while working full-time was<\/p><p>greater than what it took to get through two years of business school. I<\/p><p>believe that I have improved my skills as an investment advisor by<\/p><p>obtaining my charter, and I hope that clients and prospective clients will<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0009.webp\" style=\"max-width:min(100%,612px)\" alt=\"agree.\"><p>Will you please take on my firm as a client?<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0010.webp\" style=\"max-width:min(100%,612px)\" alt=\"Best regards,\"><p>Ryan Gentner, M.B.A., C.F.A.<\/p><p>Stern considers the opportunity to consult for Gentner Capital, but ultimately decides to turn down the offer. In conveying this decision to Gentner, she notes that Seaforth is her largest client and does not believe that it would be wise to take on a competitor as a client.<\/p><p>After officially leaving Seaforth and moving to Stoneton, Gentner begins writing the policies he will implement at his new firm. Specifically, all Gentner Capital employees who provide advisory services must meet with clients at least once annually to determine if their investment objectives and/or constraints have changed and make any necessary updates to their investment policy statement. Another firm policy mandates that clients receive account statements at regular intervals containing, among other information, returns stated on a gross-of-fees, before-tax basis. However, Gentner has yet to decide how frequently these statements should be sent.<\/p><p>Gentner is pleased to find that many of the clients he served at Seaforth have opened accounts with his new firm within a few months of his move. Master emailed Gentner an order to buy 50,000 shares in Tyndale Microsystems (TMS), noting that this transaction would be consistent with the investment policy statement (IPS) that the two had created at the account opening stage.<\/p><p>On the morning of the IPO of TMS shares, Jacqueline Dumont, a long-time client of Seaforth, pays an initial visit to Gentner Capital&#x27;s office, intending to open an account with the new firm. While at the office, Dumont has a brief discussion with Gentner in which she mentions that she believes that 50,000 shares of TMS stock would be an ideal fit for her portfolio. Dumont spends most of her visit working with Gentner&#x27;s assistant to complete the paperwork required to open her account. Later that day, Gentner can complete a block trade for 20,000 TMS shares in the firm&#x27;s oversubscribed IPO. Because Masters and Dumont both referenced 50,000 shares of TMS, Gentner allocates 10,000 shares to each client&#x27;s account.<\/p><\/div><\/details><div class=\"qtext\"><p>In allocating the TMS shares acquired in the block trade to client accounts, does Gentner most likely violate the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 28, "q": "Before officially leaving Seaforth, did Gentner most likely violate the Standards concerning loyalty?", "opts": ["No", "Yes, by taking copies of Seaforth's proprietary materials", "Yes, by asking Stern to accept Gentner Capital as a client"], "ans": "A", "expl": "Ryan Gentner, in notifying his supervisor and receiving written consent to use proprietary materials, adhered to Standard IV (A) - Loyalty, which emphasizes the importance of loyalty to one's employer. This standard prohibits the misappropriation of an employer's resources but allows for preparations to enter into competitive business, provided these actions do not breach the duty of loyalty. Gentner's actions, such as taking copies of proprietary materials with permission and developing a marketing strategy, fall within permissible activities as he did not engage in activities that would directly harm Seaforth, such as soliciting its clients or using confidential information without consent. His preparations for his new venture were transparent and approved, thereby upholding his duty of loyalty to Seaforth. B is incorrect. The option suggesting that Gentner violated the Standards by taking copies of Seaforth's proprietary materials is incorrect because he had obtained explicit written consent from his supervisor to use these materials. The CFA Institute's standards allow for the use of employer resources in preparation for future employment if such use is authorized. Since Gentner received approval, his actions do not constitute a breach of loyalty or misappropriation, which would require using the company's resources without consent or for personal benefit at the expense of the employer. C is incorrect. The statement that Gentner violated the Standards by asking Ruth Stern to accept Gentner Capital as a client is also incorrect. Standard IV (A) - Loyalty primarily concerns the relationship between an employee and their employer. Gentner's request to Stern, a marketing consultant with an ongoing engagement with Seaforth, does not breach any duty of loyalty to Seaforth. Stern is an independent contractor, not a client or employee of Seaforth. Thus Gentner's solicitation of her services for his new firm does not interfere with his obligations under the CFA Standards concerning loyalty to his current employer. ", "explhtml": "<p>Ryan Gentner, in notifying his supervisor and receiving written consent to use proprietary materials, adhered to Standard IV (A) - Loyalty, which emphasizes the importance of loyalty to one&#x27;s employer. This standard prohibits the misappropriation of an employer&#x27;s resources but allows for preparations to enter into competitive business, provided these actions do not breach the duty of loyalty. Gentner&#x27;s actions, such as taking copies of proprietary materials with permission and developing a marketing strategy, fall within permissible activities as he did not engage in activities that would directly harm Seaforth, such as soliciting its clients or using confidential information without consent. His preparations for his new venture were transparent and approved, thereby upholding his duty of loyalty to Seaforth.<\/p><p><b>B is incorrect<\/b>. The option suggesting that Gentner violated the Standards by taking copies of Seaforth&#x27;s proprietary materials is incorrect because he had obtained explicit written consent from his supervisor to use these materials. The CFA Institute&#x27;s standards allow for the use of employer resources in preparation for future employment if such use is authorized. Since Gentner received approval, his actions do not constitute a breach of loyalty or misappropriation, which would require using the company&#x27;s resources without consent or for personal benefit at the expense of the employer.<\/p><p><b>C is incorrect<\/b>. The statement that Gentner violated the Standards by asking Ruth Stern to accept Gentner Capital as a client is also incorrect. Standard IV (A) - Loyalty primarily concerns the relationship between an employee and their employer. Gentner&#x27;s request to Stern, a marketing consultant with an ongoing engagement with Seaforth, does not breach any duty of loyalty to Seaforth. Stern is an independent contractor, not a client or employee of Seaforth. Thus Gentner&#x27;s solicitation of her services for his new firm does not interfere with his obligations under the CFA Standards concerning loyalty to his current employer. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Ryan Gentner<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ryan Gentner, CFA, is an investment advisor with Seaforth Investment Partners (Seaforth). After contemplating a change for the past few years, Gentner has decided to move back to his hometown of Stoneton, a three-hour drive west of the city in which Seaforth is headquartered. He intends to start his own boutique investment advisory firm, Gentner Capital.<\/p><p>Gentner notifies his supervisor, Aileen McCartney, of his intention to leave Seaforth. Because McCartney expects the level of competition between the two firms to be minimal relative to Seaforth&#x27;s total revenues, and out of appreciation for Gentner&#x27;s years of service, McCartney gives Gentner written consent to take and use copies of her company&#x27;s proprietary materials used by its advisors in developing situational and psychological profiles of clients and prospective clients. After he has notified McCartney, but before his term of employment at Seaforth officially ends, Gentner devotes much of his time to developing a marketing strategy for his new firm.<\/p><p>Recognizing that he requires assistance in developing the digital aspects of a marketing strategy, Gentner emails Ruth Stern, a marketing consultant who has a longstanding and ongoing business engagement with Seaforth. This email appears in its entirety in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0007.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Gentner&#x27;s email to Stern\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0008.webp\" style=\"max-width:min(100%,612px)\" alt=\"Ruth,\"><p>In three weeks, I will be leaving Seaforth and moving back to Stoneton,<\/p><p>where I will be starting my own firm, Gentner Capital. While this new<\/p><p>venture will be too small to compete with all of the services Seaforth offers,<\/p><p>I expect that we will compete directly for some accounts, and I am<\/p><p>confident that at least some of my current clients will eventually move their<\/p><p>accounts to my boutique shop.<\/p><p>Having seen the results of your work with Seaforth, you are my first choice<\/p><p>to design and implement a digital marketing strategy for Gentner Capital. I<\/p><p>realize that this work may compete for some of the time you devote to<\/p><p>Seaforth, so I am willing to pay the same rate they pay for your services.<\/p><p>As you may know, I was recently awarded the CFA charter. I found that the<\/p><p>effort required to complete the CFA Program while working full-time was<\/p><p>greater than what it took to get through two years of business school. I<\/p><p>believe that I have improved my skills as an investment advisor by<\/p><p>obtaining my charter, and I hope that clients and prospective clients will<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0009.webp\" style=\"max-width:min(100%,612px)\" alt=\"agree.\"><p>Will you please take on my firm as a client?<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0010.webp\" style=\"max-width:min(100%,612px)\" alt=\"Best regards,\"><p>Ryan Gentner, M.B.A., C.F.A.<\/p><p>Stern considers the opportunity to consult for Gentner Capital, but ultimately decides to turn down the offer. In conveying this decision to Gentner, she notes that Seaforth is her largest client and does not believe that it would be wise to take on a competitor as a client.<\/p><p>After officially leaving Seaforth and moving to Stoneton, Gentner begins writing the policies he will implement at his new firm. Specifically, all Gentner Capital employees who provide advisory services must meet with clients at least once annually to determine if their investment objectives and/or constraints have changed and make any necessary updates to their investment policy statement. Another firm policy mandates that clients receive account statements at regular intervals containing, among other information, returns stated on a gross-of-fees, before-tax basis. However, Gentner has yet to decide how frequently these statements should be sent.<\/p><p>Gentner is pleased to find that many of the clients he served at Seaforth have opened accounts with his new firm within a few months of his move. Master emailed Gentner an order to buy 50,000 shares in Tyndale Microsystems (TMS), noting that this transaction would be consistent with the investment policy statement (IPS) that the two had created at the account opening stage.<\/p><p>On the morning of the IPO of TMS shares, Jacqueline Dumont, a long-time client of Seaforth, pays an initial visit to Gentner Capital&#x27;s office, intending to open an account with the new firm. While at the office, Dumont has a brief discussion with Gentner in which she mentions that she believes that 50,000 shares of TMS stock would be an ideal fit for her portfolio. Dumont spends most of her visit working with Gentner&#x27;s assistant to complete the paperwork required to open her account. Later that day, Gentner can complete a block trade for 20,000 TMS shares in the firm&#x27;s oversubscribed IPO. Because Masters and Dumont both referenced 50,000 shares of TMS, Gentner allocates 10,000 shares to each client&#x27;s account.<\/p><\/div><\/details><div class=\"qtext\"><p>Before officially leaving Seaforth, did Gentner most likely violate the Standards concerning loyalty?<\/p><\/div>", "subj": "ethics"}, {"n": 29, "q": "Kiffin would most likely violate the Standards by doing the following before leaving Delta to start her firm?", "opts": ["Spending time every weekend writing a business plan for her own firm", "Asking her current clients to continue using her as an advisor after she leaves Delta", "Deleting copies of work completed for Delta that she has stored on her personal computer"], "ans": "B", "expl": "It directly violates Standard IV (A) - Loyalty, as outlined in the CFA Institute's Code of Ethics and Standards of Professional Conduct. This standard mandates that CFA members and candidates must show undivided loyalty to their employer and are prohibited from soliciting clients for future employment opportunities while still employed. By asking her current clients at Delta to continue using her services after her departure, Kiffin is engaging in an act that could potentially harm her employer by preemptively diverting business away from Delta before her official resignation. This action undermines the trust and loyalty expected between an employee and employer and can lead to conflicts of interest, thereby breaching the ethical standards set forth by the CFA Institute. A is incorrect. Standard IV(A) does not prevent members and candidates from making preparations to engage in independent practice on their own time. Writing a business plan for her own firm during personal time, such as weekends, is a preparatory activity that does not conflict with her current employment duties at Delta. This activity does not involve soliciting clients or proprietary information from her employer, and thus, does not breach the loyalty to her employer. Preparatory activities are generally permissible as long as they do not interfere with the service owed to the employer or involve misuse of the employer's resources. C is incorrect. Deleting copies of work completed for Delta that she has stored on her personal computer does not constitute a violation of Standard IV(A) - Loyalty. In fact, removing such files can be seen as a compliance action to ensure that no confidential or proprietary information of the employer is retained post-employment. This action aligns with the ethical requirement to safeguard the confidentiality and integrity of employer information. The standard requires that upon ending employment, an employee should not retain information or documents that belong to the employer, and thus, deleting these files from personal storage would be considered appropriate and ethical. ", "explhtml": "<p>It directly violates Standard IV (A) - Loyalty, as outlined in the CFA Institute&#x27;s Code of Ethics and Standards of Professional Conduct. This standard mandates that CFA members and candidates must show undivided loyalty to their employer and are prohibited from soliciting clients for future employment opportunities while still employed. By asking her current clients at Delta to continue using her services after her departure, Kiffin is engaging in an act that could potentially harm her employer by preemptively diverting business away from Delta before her official resignation. This action undermines the trust and loyalty expected between an employee and employer and can lead to conflicts of interest, thereby breaching the ethical standards set forth by the CFA Institute.<\/p><p><b>A is incorrect.<\/b> Standard IV(A) does not prevent members and candidates from making preparations to engage in independent practice on their own time. Writing a business plan for her own firm during personal time, such as weekends, is a preparatory activity that does not conflict with her current employment duties at Delta. This activity does not involve soliciting clients or proprietary information from her employer, and thus, does not breach the loyalty to her employer. Preparatory activities are generally permissible as long as they do not interfere with the service owed to the employer or involve misuse of the employer&#x27;s resources.<\/p><p><b>C is incorrect.<\/b> Deleting copies of work completed for Delta that she has stored on her personal computer does not constitute a violation of Standard IV(A) - Loyalty. In fact, removing such files can be seen as a compliance action to ensure that no confidential or proprietary information of the employer is retained post-employment. This action aligns with the ethical requirement to safeguard the confidentiality and integrity of employer information. The standard requires that upon ending employment, an employee should not retain information or documents that belong to the employer, and thus, deleting these files from personal storage would be considered appropriate and ethical. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Loretta Kiffin<\/summary><div class=\"vig-body\"><p>Loretta Kiffin, CFA, is a portfolio manager for Delta Investments, a large money management firm in Knoxville, Tennessee. Kiffin has been offered a new position within Delta that would require her to oversee a team of five subordinates. Still, she has concerns about the company&#x27;s compliance system, which she believes is inadequate.<\/p><p>Rather than accept the promotion that has been offered to her, Kiffin is considering leaving Delta and starting her investment advisory firm. She has many longstanding clients and believes that many of them may choose to continue to work with her if she does decide to operate as a sole practitioner.<\/p><p>After discussing the matter with her family, Kiffin turns down the offer. She feels experienced enough and decides to leave Delta to start her firm. As a condition of her departure, Kiffin agrees to sign a narrow non-compete agreement that allows her to solicit all but three of her current clients after she officially stops working for Delta. Kiffin must wait one year to solicit the agreement&#x27;s three current clients explicitly. After leaving Delta and starting at her firm, Kiffin updated her LinkedIn profile. All her contacts - including the three clients covered by the non-compete agreement - were notified of her new employment status.<\/p><p>A month after starting her firm, Kiffin has lunch with Rita Hay, a former colleague at Delta, who subsequently retired. Kiffin and Hay went through the CFA Program together and received their CFA charters in the same year. Hay mentions that she has not paid her CFA Institute membership dues in the past two years. Although she continues to use the letters “CFA” in the signature for her email account, she does not present herself as an active member of the CFA Institute in conversations with financial professionals.<\/p><\/div><\/details><div class=\"qtext\"><p>Kiffin would most likely violate the Standards by doing the following before leaving Delta to start her firm?<\/p><\/div>", "subj": "ethics"}, {"n": 30, "q": "Which of the following statements about Kiffin's duty to Delta is most accurate? After Kiffin starts her firm:", "opts": ["The skills that she obtained while working for Delta are considered privileged information.", "The skills that she obtained while working for Delta are not considered privileged information.", "Knowledge of names and existence of the clients she served while working for Delta is considered confidential information."], "ans": "B", "expl": "The skills and knowledge that Loretta Kiffin acquired during her tenure at Delta Investments are not considered privileged information. According to Standard IV (A) - Loyalty, as outlined by the CFA Institute, the skills, knowledge, and experience gained by an employee throughout their career can be utilized in any subsequent positions. This standard supports the idea that professional development and the accumulation of skills are personal assets that do not remain exclusive to any former employer. Therefore, Kiffin is entitled to use all the skills and knowledge she gained at Delta in her new venture without any ethical or legal breach. A is incorrect. It mistakenly classifies the skills obtained by Kiffin at Delta as privileged information. In the context of employment and professional development, \"privileged information\" refers to proprietary or confidential information that an employee is not permitted to disclose or use outside the company. However, the skills and general knowledge acquired, which are not confidential or proprietary to the company, do not fall under this category. Employees are encouraged to develop their skills and are free to use them in future roles, which is a fundamental principle in career development and does not violate any standard ethical practices. C is incorrect because it incorrectly states that the knowledge of names and the existence of the clients Kiffin served while at Delta is considered confidential information. While specific client data, account details, and personal information are indeed confidential, merely knowing the names and the fact that these individuals were clients at Delta does not constitute confidential information. Standard III (E) - Preservation of Confidentiality, primarily concerns the protection of information that could harm the client if disclosed, not the mere acknowledgment of a client relationship. Therefore, Kiffin's knowledge of her former clients' names and their existence does not breach any confidentiality standards as long as no specific, sensitive details are disclosed. ", "explhtml": "<p>The skills and knowledge that Loretta Kiffin acquired during her tenure at Delta Investments are not considered privileged information. According to Standard IV (A) - Loyalty, as outlined by the CFA Institute, the skills, knowledge, and experience gained by an employee throughout their career can be utilized in any subsequent positions. This standard supports the idea that professional development and the accumulation of skills are personal assets that do not remain exclusive to any former employer. Therefore, Kiffin is entitled to use all the skills and knowledge she gained at Delta in her new venture without any ethical or legal breach.<\/p><p><b>A is incorrect.<\/b> It mistakenly classifies the skills obtained by Kiffin at Delta as privileged information. In the context of employment and professional development, &quot;privileged information&quot; refers to proprietary or confidential information that an employee is not permitted to disclose or use outside the company. However, the skills and general knowledge acquired, which are not confidential or proprietary to the company, do not fall under this category. Employees are encouraged to develop their skills and are free to use them in future roles, which is a fundamental principle in career development and does not violate any standard ethical practices.<\/p><p><b>C is incorrect<\/b> because it incorrectly states that the knowledge of names and the existence of the clients Kiffin served while at Delta is considered confidential information. While specific client data, account details, and personal information are indeed confidential, merely knowing the names and the fact that these individuals were clients at Delta does not constitute confidential information. Standard III (E) - Preservation of Confidentiality, primarily concerns the protection of information that could harm the client if disclosed, not the mere acknowledgment of a client relationship. Therefore, Kiffin&#x27;s knowledge of her former clients&#x27; names and their existence does not breach any confidentiality standards as long as no specific, sensitive details are disclosed. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Loretta Kiffin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Loretta Kiffin, CFA, is a portfolio manager for Delta Investments, a large money management firm in Knoxville, Tennessee. Kiffin has been offered a new position within Delta that would require her to oversee a team of five subordinates. Still, she has concerns about the company&#x27;s compliance system, which she believes is inadequate.<\/p><p>Rather than accept the promotion that has been offered to her, Kiffin is considering leaving Delta and starting her investment advisory firm. She has many longstanding clients and believes that many of them may choose to continue to work with her if she does decide to operate as a sole practitioner.<\/p><p>After discussing the matter with her family, Kiffin turns down the offer. She feels experienced enough and decides to leave Delta to start her firm. As a condition of her departure, Kiffin agrees to sign a narrow non-compete agreement that allows her to solicit all but three of her current clients after she officially stops working for Delta. Kiffin must wait one year to solicit the agreement&#x27;s three current clients explicitly. After leaving Delta and starting at her firm, Kiffin updated her LinkedIn profile. All her contacts - including the three clients covered by the non-compete agreement - were notified of her new employment status.<\/p><p>A month after starting her firm, Kiffin has lunch with Rita Hay, a former colleague at Delta, who subsequently retired. Kiffin and Hay went through the CFA Program together and received their CFA charters in the same year. Hay mentions that she has not paid her CFA Institute membership dues in the past two years. Although she continues to use the letters “CFA” in the signature for her email account, she does not present herself as an active member of the CFA Institute in conversations with financial professionals.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements about Kiffin&#x27;s duty to Delta is most accurate? After Kiffin starts her firm:<\/p><\/div>", "subj": "ethics"}, {"n": 31, "q": "By updating her LinkedIn profile, has Kiffin most likely violated the Standards?", "opts": ["No", "Yes, concerning loyalty", "Yes, concerning communication with clients and prospective clients"], "ans": "A", "expl": "Kiffin's decision to update her LinkedIn profile to reflect her new employment status does not constitute a violation of the CFA Institute's Standards of Professional Conduct. Specifically, updating a LinkedIn profile is a common practice when individuals change jobs, and it serves merely to inform connections of a change in employment status. This action does not imply any solicitation of business, including from the three clients mentioned in the non-compete agreement. The non-compete agreement specifically restricts direct solicitation of those clients for one year, but merely updating a LinkedIn profile does not fall under the definition of solicitation. Solicitation would typically involve direct communication with clients to encourage them to use her new services, which Kiffin did not do. Therefore, this action aligns with maintaining professional conduct and respecting contractual agreements with her former employer. B is incorrect. It suggests a violation concerning loyalty is based on a misunderstanding of what constitutes disloyalty under the CFA Standards. Loyalty in this context refers to actions that would harm or disadvantage the former employer, such as misusing confidential information or soliciting key clients against the terms of an agreement. Kiffin's update of her LinkedIn profile does not disclose any confidential information, nor does it undermine Delta Investments in any competitive manner. It is merely an announcement of her career move, which does not impact her former employer's business operations or client relationships in any direct way. Thus, this action does not breach the loyalty standard. C is incorrect. This option suggests a violation concerning communication with clients and prospective clients. However, updating a LinkedIn profile does not equate to improper communication as outlined in Standard V(B) - Communication with Clients and Prospective Clients. This standard pertains to the clarity, accuracy, and thoroughness required in professional communications, including the distinction between fact and opinion. Kiffin's LinkedIn update is a factual statement about her employment status and does not involve any misleading claims, exaggerated statements, or misrepresentations. It is a straightforward notification, which does not involve any direct communication targeted at clients or prospective clients about her new services. Therefore, it does not violate the communication standards set forth by the CFA Institute. ", "explhtml": "<p>Kiffin&#x27;s decision to update her LinkedIn profile to reflect her new employment status does not constitute a violation of the CFA Institute&#x27;s Standards of Professional Conduct. Specifically, updating a LinkedIn profile is a common practice when individuals change jobs, and it serves merely to inform connections of a change in employment status. This action does not imply any solicitation of business, including from the three clients mentioned in the non-compete agreement. The non-compete agreement specifically restricts direct solicitation of those clients for one year, but merely updating a LinkedIn profile does not fall under the definition of solicitation. Solicitation would typically involve direct communication with clients to encourage them to use her new services, which Kiffin did not do. Therefore, this action aligns with maintaining professional conduct and respecting contractual agreements with her former employer.<\/p><p><b>B is incorrect<\/b>. It suggests a violation concerning loyalty is based on a misunderstanding of what constitutes disloyalty under the CFA Standards. Loyalty in this context refers to actions that would harm or disadvantage the former employer, such as misusing confidential information or soliciting key clients against the terms of an agreement. Kiffin&#x27;s update of her LinkedIn profile does not disclose any confidential information, nor does it undermine Delta Investments in any competitive manner. It is merely an announcement of her career move, which does not impact her former employer&#x27;s business operations or client relationships in any direct way. Thus, this action does not breach the loyalty standard.<\/p><p><b>C is incorrect<\/b>. This option suggests a violation concerning communication with clients and prospective clients. However, updating a LinkedIn profile does not equate to improper communication as outlined in Standard V(B) - Communication with Clients and Prospective Clients. This standard pertains to the clarity, accuracy, and thoroughness required in professional communications, including the distinction between fact and opinion. Kiffin&#x27;s LinkedIn update is a factual statement about her employment status and does not involve any misleading claims, exaggerated statements, or misrepresentations. It is a straightforward notification, which does not involve any direct communication targeted at clients or prospective clients about her new services. Therefore, it does not violate the communication standards set forth by the CFA Institute. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): demonstrate a thorough knowledge of the Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Loretta Kiffin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Loretta Kiffin, CFA, is a portfolio manager for Delta Investments, a large money management firm in Knoxville, Tennessee. Kiffin has been offered a new position within Delta that would require her to oversee a team of five subordinates. Still, she has concerns about the company&#x27;s compliance system, which she believes is inadequate.<\/p><p>Rather than accept the promotion that has been offered to her, Kiffin is considering leaving Delta and starting her investment advisory firm. She has many longstanding clients and believes that many of them may choose to continue to work with her if she does decide to operate as a sole practitioner.<\/p><p>After discussing the matter with her family, Kiffin turns down the offer. She feels experienced enough and decides to leave Delta to start her firm. As a condition of her departure, Kiffin agrees to sign a narrow non-compete agreement that allows her to solicit all but three of her current clients after she officially stops working for Delta. Kiffin must wait one year to solicit the agreement&#x27;s three current clients explicitly. After leaving Delta and starting at her firm, Kiffin updated her LinkedIn profile. All her contacts - including the three clients covered by the non-compete agreement - were notified of her new employment status.<\/p><p>A month after starting her firm, Kiffin has lunch with Rita Hay, a former colleague at Delta, who subsequently retired. Kiffin and Hay went through the CFA Program together and received their CFA charters in the same year. Hay mentions that she has not paid her CFA Institute membership dues in the past two years. Although she continues to use the letters “CFA” in the signature for her email account, she does not present herself as an active member of the CFA Institute in conversations with financial professionals.<\/p><\/div><\/details><div class=\"qtext\"><p>By updating her LinkedIn profile, has Kiffin most likely violated the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 32, "q": "Which of the following statements is most accurate? Hay has most likely:", "opts": ["Violated the Standards by using the CFA designation in her email signature.", "Violated the Standards by failing to pay her membership dues on a timely basis.", "not violated the Standards because she does not present herself as an active member of CFA Institute in conversations with financial professionals"], "ans": "A", "expl": "Hay has most likely violated the CFA Institute's Standards of Professional Conduct by using the CFA designation in her email signature despite not being an active member. According to Standard VII (B) - Reference to CFA Institute, the CFA Designation, and the CFA Program, it is imperative that individuals who use the CFA designation in any professional capacity maintain their membership and fulfill all necessary requirements, including payment of dues and submission of a Professional Conduct Statement. By using the CFA designation in her email signature while not having paid her dues for two years, Hay falsely represents herself as a current and active CFA charterholder, which can mislead others regarding her professional status and violates the integrity of the CFA designation. B is incorrect. While it is true that failing to pay membership dues on time is not in accordance with the best practices and requirements set by the CFA Institute, this action alone does not constitute a direct violation of the Standards regarding the use of the CFA designation. The critical issue is the representation of one's status as a CFA Charterholder. Members can be in arrears with their dues without violating the Standards, provided they do not use the CFA designation or present themselves as active Charterholders during such periods. C is incorrect. Although Hay does not present herself as an active member of the CFA Institute in conversations with financial professionals, this does not absolve her of the violation incurred by using the CFA designation in her email signature. The Standards require that any use of the CFA designation must be supported by active membership status. Therefore, regardless of her verbal statements, her written communication suggests a misleading professional qualification, which is a clear violation of the CFA Institute's Standards. ", "explhtml": "<p>Hay has most likely violated the CFA Institute&#x27;s Standards of Professional Conduct by using the CFA designation in her email signature despite not being an active member. According to Standard VII (B) - Reference to CFA Institute, the CFA Designation, and the CFA Program, it is imperative that individuals who use the CFA designation in any professional capacity maintain their membership and fulfill all necessary requirements, including payment of dues and submission of a Professional Conduct Statement. By using the CFA designation in her email signature while not having paid her dues for two years, Hay falsely represents herself as a current and active CFA charterholder, which can mislead others regarding her professional status and violates the integrity of the CFA designation.<\/p><p><b>B is incorrect<\/b>. While it is true that failing to pay membership dues on time is not in accordance with the best practices and requirements set by the CFA Institute, this action alone does not constitute a direct violation of the Standards regarding the use of the CFA designation. The critical issue is the representation of one&#x27;s status as a CFA Charterholder. Members can be in arrears with their dues without violating the Standards, provided they do not use the CFA designation or present themselves as active Charterholders during such periods.<\/p><p><b>C is incorrect<\/b>. Although Hay does not present herself as an active member of the CFA Institute in conversations with financial professionals, this does not absolve her of the violation incurred by using the CFA designation in her email signature. The Standards require that any use of the CFA designation must be supported by active membership status. Therefore, regardless of her verbal statements, her written communication suggests a misleading professional qualification, which is a clear violation of the CFA Institute&#x27;s Standards. <\/p><p class=\"los\">Ethics, Learning Module 2: Application of the Code and Standards, LOS 2 (a): Evaluate policies and practices for a firm and an individual in relation to the CFA Institute Code of Ethics and Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Loretta Kiffin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Loretta Kiffin, CFA, is a portfolio manager for Delta Investments, a large money management firm in Knoxville, Tennessee. Kiffin has been offered a new position within Delta that would require her to oversee a team of five subordinates. Still, she has concerns about the company&#x27;s compliance system, which she believes is inadequate.<\/p><p>Rather than accept the promotion that has been offered to her, Kiffin is considering leaving Delta and starting her investment advisory firm. She has many longstanding clients and believes that many of them may choose to continue to work with her if she does decide to operate as a sole practitioner.<\/p><p>After discussing the matter with her family, Kiffin turns down the offer. She feels experienced enough and decides to leave Delta to start her firm. As a condition of her departure, Kiffin agrees to sign a narrow non-compete agreement that allows her to solicit all but three of her current clients after she officially stops working for Delta. Kiffin must wait one year to solicit the agreement&#x27;s three current clients explicitly. After leaving Delta and starting at her firm, Kiffin updated her LinkedIn profile. All her contacts - including the three clients covered by the non-compete agreement - were notified of her new employment status.<\/p><p>A month after starting her firm, Kiffin has lunch with Rita Hay, a former colleague at Delta, who subsequently retired. Kiffin and Hay went through the CFA Program together and received their CFA charters in the same year. Hay mentions that she has not paid her CFA Institute membership dues in the past two years. Although she continues to use the letters “CFA” in the signature for her email account, she does not present herself as an active member of the CFA Institute in conversations with financial professionals.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements is most accurate? Hay has most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 33, "q": "Did Ritchie most likely violate the Standards during her time at the Swanson Bistro?", "opts": ["No", "Yes, concerning loyalty", "Yes, concerning misconduct"], "ans": "A", "expl": "Cheryl Ritchie's actions at the Swanson Bistro, where she met with her lawyer, Marvin Garber, do not constitute a violation of the CFA Institute's Standards of Professional Conduct. According to Standard IV (A) - Loyalty, which requires members and candidates to act for the benefit of their employer and not disclose confidential information, exceptions are permitted when such actions are necessary to comply with legal or ethical obligations. Ritchie's decision to provide her lawyer with a sealed envelope containing documents related to her concerns about potential unethical practices at her firm falls within these exceptions. Her primary motivation was to protect the interests of the clients and the integrity of the market, which aligns with her professional duties. Furthermore, her actions were discreet and aimed at seeking legal counsel to ensure that her response was appropriate under the circumstances. B is incorrect. The option suggesting that Ritchie violated the Standards concerning loyalty is incorrect because her actions were in fact in line with her duties to the market and clients. Standard IV (A) allows for exceptions where the member must act contrary to their employer's interests to uphold broader ethical or legal standards. Ritchie's sharing of information with her lawyer was not a breach of loyalty but a necessary step to address suspected unethical behavior within her firm, thereby aiming to protect the market and client interests, which is a higher duty prescribed by the Standards. C is incorrect. The statement that Ritchie engaged in misconduct is unfounded. Standard I (D) - Misconduct, defines misconduct as engaging in professional conduct involving dishonesty, fraud, deceit, or any act that adversely reflects on a professional's reputation, integrity, or competence. Ritchie's conduct at the bistro, which involved discussing her concerns with her lawyer and handling the situation in a legally appropriate manner, does not meet any criteria for misconduct. Her behavior was aimed at ensuring compliance with ethical standards and did not involve any dishonest or fraudulent activities. The social setting of the meeting and her personal conduct during the meeting, which included consuming alcohol in a responsible manner and sharing a taxi, do not constitute professional misconduct under the CFA Standards. ", "explhtml": "<p>Cheryl Ritchie&#x27;s actions at the Swanson Bistro, where she met with her lawyer, Marvin Garber, do not constitute a violation of the CFA Institute&#x27;s Standards of Professional Conduct. According to Standard IV (A) - Loyalty, which requires members and candidates to act for the benefit of their employer and not disclose confidential information, exceptions are permitted when such actions are necessary to comply with legal or ethical obligations. Ritchie&#x27;s decision to provide her lawyer with a sealed envelope containing documents related to her concerns about potential unethical practices at her firm falls within these exceptions. Her primary motivation was to protect the interests of the clients and the integrity of the market, which aligns with her professional duties. Furthermore, her actions were discreet and aimed at seeking legal counsel to ensure that her response was appropriate under the circumstances.<\/p><p><b>B is incorrect<\/b>. The option suggesting that Ritchie violated the Standards concerning loyalty is incorrect because her actions were in fact in line with her duties to the market and clients. Standard IV (A) allows for exceptions where the member must act contrary to their employer&#x27;s interests to uphold broader ethical or legal standards. Ritchie&#x27;s sharing of information with her lawyer was not a breach of loyalty but a necessary step to address suspected unethical behavior within her firm, thereby aiming to protect the market and client interests, which is a higher duty prescribed by the Standards.<\/p><p><b>C is incorrect<\/b>. The statement that Ritchie engaged in misconduct is unfounded. Standard I (D) - Misconduct, defines misconduct as engaging in professional conduct involving dishonesty, fraud, deceit, or any act that adversely reflects on a professional&#x27;s reputation, integrity, or competence. Ritchie&#x27;s conduct at the bistro, which involved discussing her concerns with her lawyer and handling the situation in a legally appropriate manner, does not meet any criteria for misconduct. Her behavior was aimed at ensuring compliance with ethical standards and did not involve any dishonest or fraudulent activities. The social setting of the meeting and her personal conduct during the meeting, which included consuming alcohol in a responsible manner and sharing a taxi, do not constitute professional misconduct under the CFA Standards. <\/p><p class=\"los\">Ethics, Learning Module 2: Application of the Code and Standards, LOS 2 (a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Joseph Bennett and Cheryl Ritchie<\/summary><div class=\"vig-body\"><p>Joseph Bennett and Cheryl Ritchie, both CFA charter holders, are traders at Holden &amp; Hodgson Brokerage (H&amp; H), located in London, UK. The two colleagues report to the same supervisor, Hanif Aslan, CFA.<\/p><p>Recently, Bennett received an order to sell 30,000 shares of Lumberg Enterprises (LMB) on behalf of the firm&#x27;s largest client, Malcolm Atchison. Upon receiving these instructions, Bennett explains to Atchison that it will be difficult to liquidate this position without incurring a significant discount to the current quoted price per share. This order volume represents approximately three times the number of LMB shares traded on an average day. Wanting to maximize the client&#x27;s return on this investment, Bennett asks his wife to post anonymous comments in online discussion forums purporting to be an LMB executive with the knowledge that the firm&#x27;s next quarterly earnings announcement will exceed analysts&#x27; expectations. Neither Bennett nor his wife has any basis for making such claims. Over the next two trading days, the price of LMB shares rises steadily. Bennett can liquidate Atchison&#x27;s position with a volume-weighted average selling price above the quoted price per share when the order was originally placed.<\/p><p>Atchison is pleased with Bennett&#x27;s efforts and asks him to use the proceeds of the sale of LMB shares to establish a long position in Hybrid Chemical Processing (HCP). Later that evening, following firm policy, Ritchie stopped at H&amp; H&#x27;s records library to submit paper copies of the forms that must be maintained as supporting documentation for all transactions executed on behalf of clients. Ritchie notices that Bennett&#x27;s submissions show he acquired HCP shares for his wife&#x27;s account five minutes before executing Atchison&#x27;s purchase order. Bennett&#x27;s documents, which he had left on the desk of a clerk who had already left for the day, include a note detailing the reasons why this security was a good investment for both accounts based on a careful and thorough analysis of all the relevant information. Ritchie makes copies of the documents left by Bennett and spends the rest of the evening preparing a detailed memo articulating her concerns. The next day, Ritchie raises these concerns in a meeting with Aslan, who tells her that he sees no reason to inquire into the matter without reading the memo and supporting documents that she wrote and offered to provide.<\/p><p>Because H&amp; H lacks a process allowing employees to anonymously report suspected illegal and/or unethical activities to the firm&#x27;s legal department, Ritchie arranges to meet her lawyer, Marvin Garber, for dinner that night at the Swanson Bistro. Over dinner, Ritchie reveals to Garber her concerns that H&amp; H&#x27;s managers are ignoring unethical and possibly illegal activities undertaken by employees perceived to be future leaders at the firm. She hands her lawyer a sealed envelope containing the memo and supporting documents that she attempted to give Aslan. Following their conversation about other topics, Ritchie enjoys Garber&#x27;s amusing stories about caring for his two-year-old twin daughters on his own while his wife was gone on business last week. Atchison, seated at a table across the room, observes Garber and Ritchie leave the restaurant together in the same taxi after sharing a bottle of wine. The next Saturday, Ritchie returns to the restaurant to collect the car she drove there the night before.<\/p><p>The following Monday, Aslan sends a firm-wide email announcing that Bennett has been promoted to a more senior position. Ritchie congratulates her colleague on his promotion, but is privately disappointed because she also applied for the position and considers herself an ideal candidate. Later that week, Ritchie received an email from Garber noting that she could anonymously report her concerns to local authorities, while she is not legally required to do so. After considering Garber&#x27;s advice, Ritchie decides not to file a report with local authorities but submits a written complaint about Bennett&#x27;s HCP trades to CFA Institute&#x27;s Professional Conduct Program (PCP). After thoroughly investigating the matter, the PCP staff ruled that Bennett violated the Standards and proposed a public censure as a sanction. Bennett, believing that the costs in terms of time and money that he would be required to incur if he chose to have this matter referred to the Disciplinary Review Committee (DRC), decides to accept the charge and proposed sanction.<\/p><p>Sensing that her opportunities for advancement at H&amp; H have diminished, Ritchie hires a recruiter and begins interviewing for positions with a competitor firm. When meeting with the Head of Trading at Portland Brothers, Ritchie makes the following statement: &quot;If I become a member of this team, I am confident that I can contribute to significant revenue growth. I have good relationships with many H&amp; H clients, and I will work to convince them to bring their business here.&quot; After accepting an offer to work at Portland Brothers, Ritchie reviews the most up-to-date version of H&amp;H&#x27;s client list before notifying Aslan of her pending departure.<\/p><p>All new Portland Brothers employees are required to complete a week-long course on professional ethics and compliance with firm policies and applicable laws before assuming their responsibilities. During her training, Ritchie learns that the firm&#x27;s policy allows employees to invest in oversubscribed initial public offerings (IPOs) personally and in private placements under certain conditions, provided that any such trades are immediately disclosed to the compliance department.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Ritchie most likely violate the Standards during her time at the Swanson Bistro?<\/p><\/div>", "subj": "ethics"}, {"n": 34, "q": "Does Portland Brothers' policy regarding employee participation in IPOs and private placements most likely adhere to the recommendations for compliance with the Standards?", "opts": ["Yes", "No, because employees should not be permitted to participate in private placements", "No, because employees should not be permitted to participate in oversubscribed IPOs"], "ans": "C", "expl": "Portland Brothers' policy allowing employees to participate in oversubscribed IPOs does not align with the best practices recommended under Standard III(B) - Fair Dealing of the CFA Institute's Standards of Professional Conduct. This standard emphasizes the importance of fair dealing, which ensures that all clients are treated equitably and have equal access to investment opportunities. In scenarios where an IPO is oversubscribed, it is crucial that members and candidates prioritize their clients over personal interests. By participating in oversubscribed IPOs, employees could potentially deprive clients of the opportunity to invest in these limited offerings, thereby compromising the principle of fair dealing. Consequently, to fully adhere to the recommendations, Portland Brothers should revise its policy to prohibit employee participation in oversubscribed IPOs, ensuring that client interests are placed ahead of personal gains. A is incorrect. The option suggests that Portland Brothers' current policy is in compliance with the Standards, which is not accurate. While the policy does allow for employee participation under certain conditions, it fails to restrict participation in oversubscribed IPOs. This oversight can lead to a conflict of interest and unfair advantage to employees over clients, which contradicts the principles outlined in Standard III(B) - Fair Dealing. The policy should be amended to include restrictions that prevent employees from participating in oversubscribed IPOs to ensure equitable treatment of all clients and adherence to ethical guidelines. B is incorrect. This option incorrectly states that employees should not be permitted to participate in private placements at all. According to the CFA Institute's Standards, particularly Standard I(B) - Independence and Objectivity and Standard VI(B) - Priority of Transactions, while strict limits should be placed on such investments, they are not entirely prohibited. The key is to manage these investments in a way that maintains independence and objectivity and ensures that client transactions are prioritized over those of employees. Therefore, a complete ban is not necessary, but stringent controls and transparent disclosure are essential to prevent conflicts of interest and ensure fair dealing. ", "explhtml": "<p>Portland Brothers&#x27; policy allowing employees to participate in oversubscribed IPOs does not align with the best practices recommended under Standard III(B) - Fair Dealing of the CFA Institute&#x27;s Standards of Professional Conduct. This standard emphasizes the importance of fair dealing, which ensures that all clients are treated equitably and have equal access to investment opportunities. In scenarios where an IPO is oversubscribed, it is crucial that members and candidates prioritize their clients over personal interests. By participating in oversubscribed IPOs, employees could potentially deprive clients of the opportunity to invest in these limited offerings, thereby compromising the principle of fair dealing. Consequently, to fully adhere to the recommendations, Portland Brothers should revise its policy to prohibit employee participation in oversubscribed IPOs, ensuring that client interests are placed ahead of personal gains.<\/p><p><b>A is incorrect<\/b>. The option suggests that Portland Brothers&#x27; current policy is in compliance with the Standards, which is not accurate. While the policy does allow for employee participation under certain conditions, it fails to restrict participation in oversubscribed IPOs. This oversight can lead to a conflict of interest and unfair advantage to employees over clients, which contradicts the principles outlined in Standard III(B) - Fair Dealing. The policy should be amended to include restrictions that prevent employees from participating in oversubscribed IPOs to ensure equitable treatment of all clients and adherence to ethical guidelines.<\/p><p><b>B is incorrect<\/b>. This option incorrectly states that employees should not be permitted to participate in private placements at all. According to the CFA Institute&#x27;s Standards, particularly Standard I(B) - Independence and Objectivity and Standard VI(B) - Priority of Transactions, while strict limits should be placed on such investments, they are not entirely prohibited. The key is to manage these investments in a way that maintains independence and objectivity and ensures that client transactions are prioritized over those of employees. Therefore, a complete ban is not necessary, but stringent controls and transparent disclosure are essential to prevent conflicts of interest and ensure fair dealing. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(b): Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Joseph Bennett and Cheryl Ritchie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joseph Bennett and Cheryl Ritchie, both CFA charter holders, are traders at Holden &amp; Hodgson Brokerage (H&amp; H), located in London, UK. The two colleagues report to the same supervisor, Hanif Aslan, CFA.<\/p><p>Recently, Bennett received an order to sell 30,000 shares of Lumberg Enterprises (LMB) on behalf of the firm&#x27;s largest client, Malcolm Atchison. Upon receiving these instructions, Bennett explains to Atchison that it will be difficult to liquidate this position without incurring a significant discount to the current quoted price per share. This order volume represents approximately three times the number of LMB shares traded on an average day. Wanting to maximize the client&#x27;s return on this investment, Bennett asks his wife to post anonymous comments in online discussion forums purporting to be an LMB executive with the knowledge that the firm&#x27;s next quarterly earnings announcement will exceed analysts&#x27; expectations. Neither Bennett nor his wife has any basis for making such claims. Over the next two trading days, the price of LMB shares rises steadily. Bennett can liquidate Atchison&#x27;s position with a volume-weighted average selling price above the quoted price per share when the order was originally placed.<\/p><p>Atchison is pleased with Bennett&#x27;s efforts and asks him to use the proceeds of the sale of LMB shares to establish a long position in Hybrid Chemical Processing (HCP). Later that evening, following firm policy, Ritchie stopped at H&amp; H&#x27;s records library to submit paper copies of the forms that must be maintained as supporting documentation for all transactions executed on behalf of clients. Ritchie notices that Bennett&#x27;s submissions show he acquired HCP shares for his wife&#x27;s account five minutes before executing Atchison&#x27;s purchase order. Bennett&#x27;s documents, which he had left on the desk of a clerk who had already left for the day, include a note detailing the reasons why this security was a good investment for both accounts based on a careful and thorough analysis of all the relevant information. Ritchie makes copies of the documents left by Bennett and spends the rest of the evening preparing a detailed memo articulating her concerns. The next day, Ritchie raises these concerns in a meeting with Aslan, who tells her that he sees no reason to inquire into the matter without reading the memo and supporting documents that she wrote and offered to provide.<\/p><p>Because H&amp; H lacks a process allowing employees to anonymously report suspected illegal and/or unethical activities to the firm&#x27;s legal department, Ritchie arranges to meet her lawyer, Marvin Garber, for dinner that night at the Swanson Bistro. Over dinner, Ritchie reveals to Garber her concerns that H&amp; H&#x27;s managers are ignoring unethical and possibly illegal activities undertaken by employees perceived to be future leaders at the firm. She hands her lawyer a sealed envelope containing the memo and supporting documents that she attempted to give Aslan. Following their conversation about other topics, Ritchie enjoys Garber&#x27;s amusing stories about caring for his two-year-old twin daughters on his own while his wife was gone on business last week. Atchison, seated at a table across the room, observes Garber and Ritchie leave the restaurant together in the same taxi after sharing a bottle of wine. The next Saturday, Ritchie returns to the restaurant to collect the car she drove there the night before.<\/p><p>The following Monday, Aslan sends a firm-wide email announcing that Bennett has been promoted to a more senior position. Ritchie congratulates her colleague on his promotion, but is privately disappointed because she also applied for the position and considers herself an ideal candidate. Later that week, Ritchie received an email from Garber noting that she could anonymously report her concerns to local authorities, while she is not legally required to do so. After considering Garber&#x27;s advice, Ritchie decides not to file a report with local authorities but submits a written complaint about Bennett&#x27;s HCP trades to CFA Institute&#x27;s Professional Conduct Program (PCP). After thoroughly investigating the matter, the PCP staff ruled that Bennett violated the Standards and proposed a public censure as a sanction. Bennett, believing that the costs in terms of time and money that he would be required to incur if he chose to have this matter referred to the Disciplinary Review Committee (DRC), decides to accept the charge and proposed sanction.<\/p><p>Sensing that her opportunities for advancement at H&amp; H have diminished, Ritchie hires a recruiter and begins interviewing for positions with a competitor firm. When meeting with the Head of Trading at Portland Brothers, Ritchie makes the following statement: &quot;If I become a member of this team, I am confident that I can contribute to significant revenue growth. I have good relationships with many H&amp; H clients, and I will work to convince them to bring their business here.&quot; After accepting an offer to work at Portland Brothers, Ritchie reviews the most up-to-date version of H&amp;H&#x27;s client list before notifying Aslan of her pending departure.<\/p><p>All new Portland Brothers employees are required to complete a week-long course on professional ethics and compliance with firm policies and applicable laws before assuming their responsibilities. During her training, Ritchie learns that the firm&#x27;s policy allows employees to invest in oversubscribed initial public offerings (IPOs) personally and in private placements under certain conditions, provided that any such trades are immediately disclosed to the compliance department.<\/p><\/div><\/details><div class=\"qtext\"><p>Does Portland Brothers&#x27; policy regarding employee participation in IPOs and private placements most likely adhere to the recommendations for compliance with the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 35, "q": "Did Bennett most likely violate the Standards regarding executing his Atchison's order to sell LMB shares?", "opts": ["No", "Yes, by engaging in transaction-based manipulation", "Yes, by engaging in information-based manipulation"], "ans": "C", "expl": "Bennett's actions clearly fall under the category of information-based manipulation, as defined by Standard II (B) - Market Manipulation of the CFA Institute's Code of Ethics and Standards of Professional Conduct. This standard specifically prohibits members and candidates from engaging in practices that distort prices or artificially inflate trading volume with the intent to mislead market participants. By having his wife post false information online, Bennett intentionally spread misleading information to influence the market price of LMB shares. This deceitful act was aimed at creating a false impression of anticipated positive financial results for LMB, thereby manipulating investor behavior to increase the stock price unjustifiably. This allowed Bennett to sell the shares at a higher price, directly benefiting from the manipulated higher market valuation, which is a clear violation of the CFA standards concerning ethical market conduct. A is i
