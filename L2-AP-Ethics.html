f employer trust and misuse of confidential materials, which Standard IV(A) addresses more precisely. C is incorrect. While a conflict of interest is present, the core ethical breach is the misappropriation of proprietary property and the violation of the duty of loyalty to his previous employer, which is most directly addressed by Standard IV(A)", "explhtml": "<p>This standard requires CFA Institute members to act in the best interests of their employer and refrain from actions that could harm or disadvantage the firm, including disclosing confidential data or appropriating intellectual property.<\/p><p>By taking Zenith’s proprietary sector models and distributing them at JCF, Williams violates the trust and legal obligation he held to his previous employer. The models constitute trade secrets, Zenith’s competitive edge, and using them elsewhere, even under the guise of “personal reference,” directly breaches his duty of loyalty.<\/p><p><b>A is incorrect.<\/b> Standard I(D) covers professional misconduct involving fraud, deceit, or dishonesty, including conduct that reflects poorly on one&#x27;s integrity. While Williams’s behavior is certainly unethical, the key issue is not just general misconduct; it’s the specific betrayal of employer trust and misuse of confidential materials, which Standard IV(A) addresses more precisely.<\/p><p><b>C is incorrect.<\/b> While a conflict of interest is present, the core ethical breach is the misappropriation of proprietary property and the violation of the duty of loyalty to his previous employer, which is most directly addressed by Standard IV(A)<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Clara Cannon<\/summary><div class=\"vig-body\"><p>Clara Cannon, CFA, is a Senior Analyst at John Crux Fund (JCF), a mid-sized U.S. equity shop in<\/p><p>New York. To deepen JCF’s sector expertise, Cannon’s manager has hired Maximus Williams<\/p><p>away from rival Zenith Capital. Williams arrives on his first day with a list of twelve of his former<\/p><p>clients and a USB stick containing Zenith’s proprietary small-cap sector models, files he<\/p><p>downloaded “for personal reference.”<\/p><p>Within hours, Williams emails JCF’s research group the Zenith models and says, “These sector<\/p><p>forecasts are invaluable, let’s fold them into our Q1 outlook.” Cannon recalls that Zenith’s<\/p><p>materials are confidential, but isn’t certain which firm policy applies to trade secrets.<\/p><p>That afternoon, Williams personally calls four of his ex-Zenith clients and urges them to transfer<\/p><p>their assets to JCF, touting JCF’s lower fee schedule. One client reminds him of a non-solicitation<\/p><p>clause in his Zenith employment contract. Williams brushes it off: “I’m free now, no one can stop<\/p><p>me.”<\/p><p>Meanwhile, Williams develops contacts at PacoTrade, a boutique broker. Over the next week, he<\/p><p>arranges block trades for two clients through PacoTrade and receives a small referral fee for<\/p><p>each introduction, payments he keeps off the books and never mentions to Cannon.<\/p><p>A few days later, Cannon receives a compliance email: “Supervisors must ensure all outside<\/p><p>compensation, gifts, referral fees, honoraria, are disclosed and pre-approved under JCF’s<\/p><p>Additional Compensation policy.” Cannon checks Williams’s file and finds no disclosures or<\/p><p>approvals on record.<\/p><p>Finally, JCF’s legal team issues a memo regarding new SEC guidance that requires analysts to<\/p><p>verify the provenance of any third-party research they use. Cannon, pressed for time, cites<\/p><p>Zenith’s slide projections in her own published note without confirming their source or getting<\/p><p>permission, hoping no one will notice.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard is Williams most likely violating by providing JCF with Zenith’s proprietary sector models?<\/p><\/div>", "subj": "ethics"}, {"n": 78, "q": "Which Standard is most appropriate for Cannon to invoke when she realizes Williams never disclosed his referral fees from PacoTrade?", "opts": ["Standard VI(C): Referral Fees", "Standard III(A): Loyalty, Prudence, and Care", "Standard V(A): Diligence and Reasonable Basis"], "ans": "A", "expl": "This standard requires members to disclose any compensation, benefit, or consideration received from third parties for recommending products or services. Williams accepted referral fees from PacoTrade without disclosing or obtaining pre-approval, which directly violates this standard. By keeping it “off the books,” he deprived his employer of transparency and introduced a potential conflict of interest. Cannon’s recognition of this non-disclosure would make Standard VI(C) the most relevant one for her to address. B is incorrect. While this standard centers on a duty to act in clients’ best interests, using reasonable judgment and exercising care, it’s geared more toward how professionals manage client assets, not internal disclosure of compensation arrangements. Williams’s omission is not a breach of client trust per se, but rather a violation of internal compliance policy and professional integrity. C is incorrect. This standard applies when analysts make recommendations or take actions based on investment research, ensuring they’ve exercised thorough diligence. Cannon might run afoul of this elsewhere in the case (like citing Zenith’s projections without verifying them), but it doesn't relate to Williams’s undisclosed referral fees.", "explhtml": "<p>This standard requires members to disclose any compensation, benefit, or consideration received from third parties for recommending products or services. Williams accepted referral fees from PacoTrade without disclosing or obtaining pre-approval, which directly violates this standard. By keeping it “off the books,” he deprived his employer of transparency and introduced a potential conflict of interest. Cannon’s recognition of this non-disclosure would make Standard VI(C) the most relevant one for her to address.<\/p><p><b>B is incorrect.<\/b> While this standard centers on a duty to act in clients’ best interests, using reasonable judgment and exercising care, it’s geared more toward how professionals manage client assets, not internal disclosure of compensation arrangements. Williams’s omission is not a breach of client trust per se, but rather a violation of internal compliance policy and professional integrity.<\/p><p><b>C is incorrect.<\/b> This standard applies when analysts make recommendations or take actions based on investment research, ensuring they’ve exercised thorough diligence. Cannon might run afoul of this elsewhere in the case (like citing Zenith’s projections without verifying them), but it doesn&#x27;t relate to Williams’s undisclosed referral fees.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Clara Cannon<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Cannon, CFA, is a Senior Analyst at John Crux Fund (JCF), a mid-sized U.S. equity shop in<\/p><p>New York. To deepen JCF’s sector expertise, Cannon’s manager has hired Maximus Williams<\/p><p>away from rival Zenith Capital. Williams arrives on his first day with a list of twelve of his former<\/p><p>clients and a USB stick containing Zenith’s proprietary small-cap sector models, files he<\/p><p>downloaded “for personal reference.”<\/p><p>Within hours, Williams emails JCF’s research group the Zenith models and says, “These sector<\/p><p>forecasts are invaluable, let’s fold them into our Q1 outlook.” Cannon recalls that Zenith’s<\/p><p>materials are confidential, but isn’t certain which firm policy applies to trade secrets.<\/p><p>That afternoon, Williams personally calls four of his ex-Zenith clients and urges them to transfer<\/p><p>their assets to JCF, touting JCF’s lower fee schedule. One client reminds him of a non-solicitation<\/p><p>clause in his Zenith employment contract. Williams brushes it off: “I’m free now, no one can stop<\/p><p>me.”<\/p><p>Meanwhile, Williams develops contacts at PacoTrade, a boutique broker. Over the next week, he<\/p><p>arranges block trades for two clients through PacoTrade and receives a small referral fee for<\/p><p>each introduction, payments he keeps off the books and never mentions to Cannon.<\/p><p>A few days later, Cannon receives a compliance email: “Supervisors must ensure all outside<\/p><p>compensation, gifts, referral fees, honoraria, are disclosed and pre-approved under JCF’s<\/p><p>Additional Compensation policy.” Cannon checks Williams’s file and finds no disclosures or<\/p><p>approvals on record.<\/p><p>Finally, JCF’s legal team issues a memo regarding new SEC guidance that requires analysts to<\/p><p>verify the provenance of any third-party research they use. Cannon, pressed for time, cites<\/p><p>Zenith’s slide projections in her own published note without confirming their source or getting<\/p><p>permission, hoping no one will notice.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard is most appropriate for Cannon to invoke when she realizes Williams never disclosed his referral fees from PacoTrade?<\/p><\/div>", "subj": "ethics"}, {"n": 79, "q": "Cannon fails to ensure that Williams’s referral fee disclosures are correctly filed. Which Standard did Cannon most likely breach as Williams’s supervisor?", "opts": ["Standard IV(C): Responsibilities of Supervisors", "Standard I(A): Knowledge of the Law", "Standard VII(A): Conduct as Participants in CFA Institute Programs"], "ans": "A", "expl": "This standard places an explicit duty on supervisors to detect and prevent violations of laws, rules, and professional conduct by those they oversee. Cannon had a responsibility to ensure that Williams complied with JCF's Additional Compensation policy. By failing to verify that his referral fees were disclosed correctly and approved, she neglected her supervisory duty, making her accountable under this standard. B is incorrect. Standard I(A) requires members to understand and comply with laws, rules, and regulations, including those governing the financial industry. Cannon may have missed an internal compliance requirement, but this standard is more about individual legal awareness, not supervisory oversight. Her breach isn't about ignorance of the law; it’s about failing to manage her supervisee properly. C is incorrect. This standard governs behavior related to the CFA Institute and its programs, including exam conduct, ethical representation, and integrity in the use of the CFA designation. It doesn’t pertain to supervisory failures in a professional setting.", "explhtml": "<p>This standard places an explicit duty on supervisors to detect and prevent violations of laws, rules, and professional conduct by those they oversee. Cannon had a responsibility to ensure that Williams complied with JCF&#x27;s Additional Compensation policy. By failing to verify that his referral fees were disclosed correctly and approved, she neglected her supervisory duty, making her accountable under this standard.<\/p><p><b>B is incorrect.<\/b> Standard I(A) requires members to understand and comply with laws, rules, and regulations, including those governing the financial industry. Cannon may have missed an internal compliance requirement, but this standard is more about individual legal awareness, not supervisory oversight. Her breach isn&#x27;t about ignorance of the law; it’s about failing to manage her supervisee properly.<\/p><p><b>C is incorrect.<\/b> This standard governs behavior related to the CFA Institute and its programs, including exam conduct, ethical representation, and integrity in the use of the CFA designation. It doesn’t pertain to supervisory failures in a professional setting.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Clara Cannon<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Cannon, CFA, is a Senior Analyst at John Crux Fund (JCF), a mid-sized U.S. equity shop in<\/p><p>New York. To deepen JCF’s sector expertise, Cannon’s manager has hired Maximus Williams<\/p><p>away from rival Zenith Capital. Williams arrives on his first day with a list of twelve of his former<\/p><p>clients and a USB stick containing Zenith’s proprietary small-cap sector models, files he<\/p><p>downloaded “for personal reference.”<\/p><p>Within hours, Williams emails JCF’s research group the Zenith models and says, “These sector<\/p><p>forecasts are invaluable, let’s fold them into our Q1 outlook.” Cannon recalls that Zenith’s<\/p><p>materials are confidential, but isn’t certain which firm policy applies to trade secrets.<\/p><p>That afternoon, Williams personally calls four of his ex-Zenith clients and urges them to transfer<\/p><p>their assets to JCF, touting JCF’s lower fee schedule. One client reminds him of a non-solicitation<\/p><p>clause in his Zenith employment contract. Williams brushes it off: “I’m free now, no one can stop<\/p><p>me.”<\/p><p>Meanwhile, Williams develops contacts at PacoTrade, a boutique broker. Over the next week, he<\/p><p>arranges block trades for two clients through PacoTrade and receives a small referral fee for<\/p><p>each introduction, payments he keeps off the books and never mentions to Cannon.<\/p><p>A few days later, Cannon receives a compliance email: “Supervisors must ensure all outside<\/p><p>compensation, gifts, referral fees, honoraria, are disclosed and pre-approved under JCF’s<\/p><p>Additional Compensation policy.” Cannon checks Williams’s file and finds no disclosures or<\/p><p>approvals on record.<\/p><p>Finally, JCF’s legal team issues a memo regarding new SEC guidance that requires analysts to<\/p><p>verify the provenance of any third-party research they use. Cannon, pressed for time, cites<\/p><p>Zenith’s slide projections in her own published note without confirming their source or getting<\/p><p>permission, hoping no one will notice.<\/p><\/div><\/details><div class=\"qtext\"><p>Cannon fails to ensure that Williams’s referral fee disclosures are correctly filed. Which Standard did Cannon most likely breach as Williams’s supervisor?<\/p><\/div>", "subj": "ethics"}, {"n": 80, "q": "Which Standard did Cannon most likely violate by using Zenith’s slide projections without verifying their provenance under the new SEC guidance?", "opts": ["Standard I(E): Competence", "Standard V(B): Communication with Clients and Prospective Clients", "Standard II(B): Market Manipulation"], "ans": "A", "expl": "This standard requires CFA members to maintain and demonstrate professional competence and to act with diligence and thoroughness in their work. By publishing research that included Zenith’s proprietary projections without verifying their origin or securing permission, especially after new SEC guidance, Cannon failed to meet the diligence and verification expected of a competent analyst. B is incorrect. This standard pertains to clearly explaining investment decisions, disclosing risks, and distinguishing between facts and opinions in communication. Cannon’s failure here wasn’t primarily about what she communicated, but how she sourced and vetted the data behind the communication, a competence and research process issue. C is incorrect. Standard II(B) prohibits actions such as spreading false information or engaging in practices intended to distort market prices. Cannon didn’t aim to manipulate the market; her issue stemmed from inadequate verification and due diligence, not deceitful or manipulative behavior.", "explhtml": "<p>This standard requires CFA members to maintain and demonstrate professional competence and to act with diligence and thoroughness in their work.<\/p><p>By publishing research that included Zenith’s proprietary projections without verifying their origin or securing permission, especially after new SEC guidance, Cannon failed to meet the diligence and verification expected of a competent analyst.<\/p><p><b>B is incorrect.<\/b> This standard pertains to clearly explaining investment decisions, disclosing risks, and distinguishing between facts and opinions in communication. Cannon’s failure here wasn’t primarily about what she communicated, but how she sourced and vetted the data behind the communication, a competence and research process issue.<\/p><p><b>C is incorrect.<\/b> Standard II(B) prohibits actions such as spreading false information or engaging in practices intended to distort market prices. Cannon didn’t aim to manipulate the market; her issue stemmed from inadequate verification and due diligence, not deceitful or manipulative behavior.<\/p><p class=\"los\">CFA Level II, Ethics, Learning Module 2: Guidance for Standards I–VII, LOS (a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Clara Cannon<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Cannon, CFA, is a Senior Analyst at John Crux Fund (JCF), a mid-sized U.S. equity shop in<\/p><p>New York. To deepen JCF’s sector expertise, Cannon’s manager has hired Maximus Williams<\/p><p>away from rival Zenith Capital. Williams arrives on his first day with a list of twelve of his former<\/p><p>clients and a USB stick containing Zenith’s proprietary small-cap sector models, files he<\/p><p>downloaded “for personal reference.”<\/p><p>Within hours, Williams emails JCF’s research group the Zenith models and says, “These sector<\/p><p>forecasts are invaluable, let’s fold them into our Q1 outlook.” Cannon recalls that Zenith’s<\/p><p>materials are confidential, but isn’t certain which firm policy applies to trade secrets.<\/p><p>That afternoon, Williams personally calls four of his ex-Zenith clients and urges them to transfer<\/p><p>their assets to JCF, touting JCF’s lower fee schedule. One client reminds him of a non-solicitation<\/p><p>clause in his Zenith employment contract. Williams brushes it off: “I’m free now, no one can stop<\/p><p>me.”<\/p><p>Meanwhile, Williams develops contacts at PacoTrade, a boutique broker. Over the next week, he<\/p><p>arranges block trades for two clients through PacoTrade and receives a small referral fee for<\/p><p>each introduction, payments he keeps off the books and never mentions to Cannon.<\/p><p>A few days later, Cannon receives a compliance email: “Supervisors must ensure all outside<\/p><p>compensation, gifts, referral fees, honoraria, are disclosed and pre-approved under JCF’s<\/p><p>Additional Compensation policy.” Cannon checks Williams’s file and finds no disclosures or<\/p><p>approvals on record.<\/p><p>Finally, JCF’s legal team issues a memo regarding new SEC guidance that requires analysts to<\/p><p>verify the provenance of any third-party research they use. Cannon, pressed for time, cites<\/p><p>Zenith’s slide projections in her own published note without confirming their source or getting<\/p><p>permission, hoping no one will notice.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard did Cannon most likely violate by using Zenith’s slide projections without verifying their provenance under the new SEC guidance?<\/p><\/div>", "subj": "ethics"}, {"n": 81, "q": "Which Standard is Krapf most likely violating by distributing his former employer’s AlphaScout® screening algorithm?", "opts": ["Standard I(A): Knowledge of the Law", "Standard III(E): Preservation of Confidentiality", "Standard VI(A): Avoid or Disclose Conflicts"], "ans": "B", "expl": "This standard requires members to preserve the confidentiality of information acquired from clients or employers, unless disclosure is authorized or required by law. In this case, the AlphaScout® screening algorithm is proprietary intellectual property, a key competitive asset of Krapf’s former employer. By distributing it to his new team, claiming it will improve their competitiveness, and planning to use it without attribution, Krapf is misusing confidential, protected material. It’s a textbook breach of Standard III(E), regardless of whether the files were encrypted, marked confidential, or casually shared. A is incorrect. While Standard I(A) requires members to comply with applicable laws and regulations, its focus is broader, covering overall legal awareness rather than specific confidentiality or trade secret issues. If Krapf were unaware that distributing the file violated IP law, this standard might also be triggered, but the core ethical violation is centered on confidentiality, not lack of legal understanding. C is incorrect. This standard applies to conflicts of interest, for example, when personal incentives, outside compensation, or relationships could bias professional decisions. Sharing AlphaScout® doesn’t stem from a hidden self-interest or conflict; it’s a breach of loyalty and confidentiality, not an undeclared conflict.", "explhtml": "<p>This standard requires members to preserve the confidentiality of information acquired from clients or employers, unless disclosure is authorized or required by law.<\/p><p>In this case, the AlphaScout® screening algorithm is proprietary intellectual property, a key competitive asset of Krapf’s former employer. By distributing it to his new team, claiming it will improve their competitiveness, and planning to use it without attribution, Krapf is misusing confidential, protected material. It’s a textbook breach of Standard III(E), regardless of whether the files were encrypted, marked confidential, or casually shared.<\/p><p><b>A is incorrect.<\/b> While Standard I(A) requires members to comply with applicable laws and regulations, its focus is broader, covering overall legal awareness rather than specific confidentiality or trade secret issues. If Krapf were unaware that distributing the file violated IP law, this standard might also be triggered, but the core ethical violation is centered on confidentiality, not lack of legal understanding.<\/p><p><b>C is incorrect.<\/b> This standard applies to conflicts of interest, for example, when personal incentives, outside compensation, or relationships could bias professional decisions. Sharing AlphaScout® doesn’t stem from a hidden self-interest or conflict; it’s a breach of loyalty and confidentiality, not an undeclared conflict.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Darrel Clifford<\/summary><div class=\"vig-body\"><p>Darrel Clifford, CFA, is a Senior Analyst at Bedford Fund, a UK-based global investment firm.<\/p><p>Recently, Bedford hired Pat Krapf, a junior analyst formerly employed at a competing asset<\/p><p>manager. Clifford was assigned as Krapf’s supervisor, tasked with onboarding him into the<\/p><p>emerging markets research team.<\/p><p>On his first day, Krapf distributes a file labeled “AlphaScout® v3.2”, a sophisticated screening<\/p><p>algorithm from his former employer. “It’s proprietary,” he tells the team, “but we’ll be more<\/p><p>competitive if we start with this.” Clifford recognizes the name of the tool from industry<\/p><p>publications and suspects it may be protected intellectual property.<\/p><p>Later that week, Krapf receives a £2,500 gold watch and a five-day stay at a client’s beach house<\/p><p>in Hawaii. The gifts come from BGR Capital, a client impressed with last year’s performance.<\/p><p>“It’s under the UK limit of £3,000,” Krapf explains. “Perfectly fine under local rules.” But Clifford<\/p><p>is concerned and reviews Bedford Fund’s internal policy, which requires all gifts exceeding £100<\/p><p>to be disclosed and pre-approved. Gifts of excessive value must be either declined or donated to<\/p><p>charity.<\/p><p>Clifford consults the firm’s ethics manual and notes that it explicitly states: “When laws and firm<\/p><p>policy conflict, staff must adhere to the stricter standard.” He reminds Krapf that even if the law<\/p><p>allows it, Bedford’s policies are more conservative, and CFA Institute Standards require<\/p><p>adherence to the highest applicable rule. Krapf is skeptical, replying, “I don’t see how it’s a<\/p><p>problem if the client’s happy and I’m within the law.”<\/p><p>As part of their upcoming research note, Krapf plans to utilize the AlphaScout outputs, excluding<\/p><p>any reference to the tool’s origin. Clifford cautions him: “If it’s not ours and not public domain,<\/p><p>we can’t just pass it off without attribution.” Krapf shrugs it off: “Let’s just label the graphs as<\/p><p>proprietary. No one will question it.” The final concern comes when Clifford overhears Krapf<\/p><p>training an intern and boasting about his past firm&#x27;s research processes. “We’re already way<\/p><p>ahead,” he says, “because I brought real tools with me.” Clifford begins to worry that his<\/p><p>supervision may fall short of ethical expectations, especially given the numerous issues that are<\/p><p>unfolding under his watch.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard is Krapf most likely violating by distributing his former employer’s AlphaScout® screening algorithm?<\/p><\/div>", "subj": "ethics"}, {"n": 82, "q": "Which Standard is Clifford invoking when he insists the gold watch and Hawaii trip be disclosed and either donated or declined?", "opts": ["Standard VI(A): Avoid or Disclose Conflicts", "Standard I(D): Misconduct", "Standard IV(A): Loyalty"], "ans": "A", "expl": "This standard requires CFA members to fully disclose any potential or actual conflicts of interest that could compromise their objectivity or loyalty. Gifts, especially those of significant value, such as a £2,500 watch or a luxury trip, can create the perception of undue influence. Clifford is invoking Standard VI(A) by insisting that these items be disclosed and either declined or redirected, in alignment with Bedford Fund’s stricter internal policy. His stance demonstrates an effort to maintain independence and transparency, as well as to protect the integrity of the firm–client relationship. B is incorrect. While accepting extravagant gifts without disclosure might raise questions of impropriety, Standard I(D) concerns broader professional conduct violations, such as dishonesty, fraud, or behavior that reflects poorly on one’s integrity. Clifford’s concern isn’t about general misconduct; he’s specifically addressing conflict of interest from undisclosed gifts. C is incorrect. Standard IV(A) focuses on a member’s duty to their employer, requiring them to act in the firm’s best interest and protect confidential information. Although Clifford is indeed acting loyally by upholding the policy, the specific issue at hand — third-party gifts influencing objectivity — aligns more directly with Standard VI(A) on conflicts of interest.", "explhtml": "<p>This standard requires CFA members to fully disclose any potential or actual conflicts of interest that could compromise their objectivity or loyalty. Gifts, especially those of significant value, such as a £2,500 watch or a luxury trip, can create the perception of undue influence.<\/p><p>Clifford is invoking Standard VI(A) by insisting that these items be disclosed and either declined or redirected, in alignment with Bedford Fund’s stricter internal policy. His stance demonstrates an effort to maintain independence and transparency, as well as to protect the integrity of the firm–client relationship.<\/p><p><b>B is incorrect.<\/b> While accepting extravagant gifts without disclosure might raise questions of impropriety, Standard I(D) concerns broader professional conduct violations, such as dishonesty, fraud, or behavior that reflects poorly on one’s integrity. Clifford’s concern isn’t about general misconduct; he’s specifically addressing conflict of interest from undisclosed gifts.<\/p><p><b>C is incorrect.<\/b> Standard IV(A) focuses on a member’s duty to their employer, requiring them to act in the firm’s best interest and protect confidential information. Although Clifford is indeed acting loyally by upholding the policy, the specific issue at hand — third-party gifts influencing objectivity — aligns more directly with Standard VI(A) on conflicts of interest.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Darrel Clifford<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darrel Clifford, CFA, is a Senior Analyst at Bedford Fund, a UK-based global investment firm.<\/p><p>Recently, Bedford hired Pat Krapf, a junior analyst formerly employed at a competing asset<\/p><p>manager. Clifford was assigned as Krapf’s supervisor, tasked with onboarding him into the<\/p><p>emerging markets research team.<\/p><p>On his first day, Krapf distributes a file labeled “AlphaScout® v3.2”, a sophisticated screening<\/p><p>algorithm from his former employer. “It’s proprietary,” he tells the team, “but we’ll be more<\/p><p>competitive if we start with this.” Clifford recognizes the name of the tool from industry<\/p><p>publications and suspects it may be protected intellectual property.<\/p><p>Later that week, Krapf receives a £2,500 gold watch and a five-day stay at a client’s beach house<\/p><p>in Hawaii. The gifts come from BGR Capital, a client impressed with last year’s performance.<\/p><p>“It’s under the UK limit of £3,000,” Krapf explains. “Perfectly fine under local rules.” But Clifford<\/p><p>is concerned and reviews Bedford Fund’s internal policy, which requires all gifts exceeding £100<\/p><p>to be disclosed and pre-approved. Gifts of excessive value must be either declined or donated to<\/p><p>charity.<\/p><p>Clifford consults the firm’s ethics manual and notes that it explicitly states: “When laws and firm<\/p><p>policy conflict, staff must adhere to the stricter standard.” He reminds Krapf that even if the law<\/p><p>allows it, Bedford’s policies are more conservative, and CFA Institute Standards require<\/p><p>adherence to the highest applicable rule. Krapf is skeptical, replying, “I don’t see how it’s a<\/p><p>problem if the client’s happy and I’m within the law.”<\/p><p>As part of their upcoming research note, Krapf plans to utilize the AlphaScout outputs, excluding<\/p><p>any reference to the tool’s origin. Clifford cautions him: “If it’s not ours and not public domain,<\/p><p>we can’t just pass it off without attribution.” Krapf shrugs it off: “Let’s just label the graphs as<\/p><p>proprietary. No one will question it.” The final concern comes when Clifford overhears Krapf<\/p><p>training an intern and boasting about his past firm&#x27;s research processes. “We’re already way<\/p><p>ahead,” he says, “because I brought real tools with me.” Clifford begins to worry that his<\/p><p>supervision may fall short of ethical expectations, especially given the numerous issues that are<\/p><p>unfolding under his watch.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard is Clifford invoking when he insists the gold watch and Hawaii trip be disclosed and either donated or declined?<\/p><\/div>", "subj": "ethics"}, {"n": 83, "q": "Which Standard most accurately explains why Clifford insists on following Bedford Fund’s stricter gift policy over the more lenient UK legal threshold?", "opts": ["Standard I(A): Knowledge of the Law", "Standard V(B): Communication with Clients and Prospective Clients", "Standard IV(C): Responsibilities of Supervisors"], "ans": "A", "expl": "This standard requires members to comply with all applicable laws, rules, and regulations. When there's a conflict between legal requirements and firm policies, members must follow the stricter of the two. Clifford is applying this principle by reminding Krapf that although UK law allows gifts up to £3,000, Bedford Fund's internal ethics policy sets a stricter threshold (£100). Therefore, Clifford is upholding the CFA Institute's expectation that members adhere to the most conservative rule in force, exactly what Standard I(A) demands. B is incorrect. While this standard governs transparent and fair communication, including the proper disclosure of investment risks and limitations, it doesn’t address internal compliance issues related to gift acceptance or legal standards. Clifford’s decision isn’t about communicating with clients; it’s about internal ethical adherence. C is incorrect. This standard outlines a supervisor’s responsibility to prevent and detect violations by those they supervise. While Clifford’s actions do reflect good supervisory conduct, the heart of his insistence lies in prioritizing stricter ethical policy over a more lenient law, which is squarely within the purview of Standard I(A).", "explhtml": "<p>This standard requires members to comply with all applicable laws, rules, and regulations. When there&#x27;s a conflict between legal requirements and firm policies, members must follow the stricter of the two.<\/p><p>Clifford is applying this principle by reminding Krapf that although UK law allows gifts up to £3,000, Bedford Fund&#x27;s internal ethics policy sets a stricter threshold (£100). Therefore, Clifford is upholding the CFA Institute&#x27;s expectation that members adhere to the most conservative rule in force, exactly what Standard I(A) demands.<\/p><p><b>B is incorrect.<\/b> While this standard governs transparent and fair communication, including the proper disclosure of investment risks and limitations, it doesn’t address internal compliance issues related to gift acceptance or legal standards. Clifford’s decision isn’t about communicating with clients; it’s about internal ethical adherence.<\/p><p><b>C is incorrect.<\/b> This standard outlines a supervisor’s responsibility to prevent and detect violations by those they supervise. While Clifford’s actions do reflect good supervisory conduct, the heart of his insistence lies in prioritizing stricter ethical policy over a more lenient law, which is squarely within the purview of Standard I(A).<\/p><p class=\"los\">CEthics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Darrel Clifford<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darrel Clifford, CFA, is a Senior Analyst at Bedford Fund, a UK-based global investment firm.<\/p><p>Recently, Bedford hired Pat Krapf, a junior analyst formerly employed at a competing asset<\/p><p>manager. Clifford was assigned as Krapf’s supervisor, tasked with onboarding him into the<\/p><p>emerging markets research team.<\/p><p>On his first day, Krapf distributes a file labeled “AlphaScout® v3.2”, a sophisticated screening<\/p><p>algorithm from his former employer. “It’s proprietary,” he tells the team, “but we’ll be more<\/p><p>competitive if we start with this.” Clifford recognizes the name of the tool from industry<\/p><p>publications and suspects it may be protected intellectual property.<\/p><p>Later that week, Krapf receives a £2,500 gold watch and a five-day stay at a client’s beach house<\/p><p>in Hawaii. The gifts come from BGR Capital, a client impressed with last year’s performance.<\/p><p>“It’s under the UK limit of £3,000,” Krapf explains. “Perfectly fine under local rules.” But Clifford<\/p><p>is concerned and reviews Bedford Fund’s internal policy, which requires all gifts exceeding £100<\/p><p>to be disclosed and pre-approved. Gifts of excessive value must be either declined or donated to<\/p><p>charity.<\/p><p>Clifford consults the firm’s ethics manual and notes that it explicitly states: “When laws and firm<\/p><p>policy conflict, staff must adhere to the stricter standard.” He reminds Krapf that even if the law<\/p><p>allows it, Bedford’s policies are more conservative, and CFA Institute Standards require<\/p><p>adherence to the highest applicable rule. Krapf is skeptical, replying, “I don’t see how it’s a<\/p><p>problem if the client’s happy and I’m within the law.”<\/p><p>As part of their upcoming research note, Krapf plans to utilize the AlphaScout outputs, excluding<\/p><p>any reference to the tool’s origin. Clifford cautions him: “If it’s not ours and not public domain,<\/p><p>we can’t just pass it off without attribution.” Krapf shrugs it off: “Let’s just label the graphs as<\/p><p>proprietary. No one will question it.” The final concern comes when Clifford overhears Krapf<\/p><p>training an intern and boasting about his past firm&#x27;s research processes. “We’re already way<\/p><p>ahead,” he says, “because I brought real tools with me.” Clifford begins to worry that his<\/p><p>supervision may fall short of ethical expectations, especially given the numerous issues that are<\/p><p>unfolding under his watch.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Standard most accurately explains why Clifford insists on following Bedford Fund’s stricter gift policy over the more lenient UK legal threshold?<\/p><\/div>", "subj": "ethics"}, {"n": 84, "q": "If Clifford allows the publication of research based on Krapf’s misappropriated algorithm without disclosure, which Standard is most likely to be breached?", "opts": ["Standard I(D): Misconduct", "Standard V(A): Diligence and Reasonable Basis", "Standard VII(B): Reference to CFA Institute, the CFA Designation, and the CFA Program"], "ans": "B", "expl": "This standard requires CFA members and candidates to exercise independent judgment and thoroughness when conducting investment analysis and making recommendations. Suppose Clifford allows the publication of research based on an algorithm that was misappropriated and not correctly sourced, and fails to question or verify its origin. In that case, he’s not exercising the required diligence. By relying on questionable data, especially one flagged as potentially proprietary, he risks undermining both the credibility and integrity of the research. This lack of scrutiny directly violates the expectation for sound, well-supported analysis. A is incorrect. This standard encompasses broad ethical failings, including fraud, deceit, or actions that discredit the profession. While Clifford’s passive approval might seem negligent, the ethical lapse here is more about professional standards of quality and process rather than overt misconduct. C is incorrect. This standard governs how members present their CFA status, ensuring accuracy and avoiding exaggeration or misuse of the designation. Since the issue here isn’t related to Clifford’s use of the CFA title or program credentials, this standard doesn’t apply.", "explhtml": "<p>This standard requires CFA members and candidates to exercise independent judgment and thoroughness when conducting investment analysis and making recommendations. Suppose Clifford allows the publication of research based on an algorithm that was misappropriated and not correctly sourced, and fails to question or verify its origin. In that case, he’s not exercising the required diligence.<\/p><p>By relying on questionable data, especially one flagged as potentially proprietary, he risks undermining both the credibility and integrity of the research. This lack of scrutiny directly violates the expectation for sound, well-supported analysis.<\/p><p><b>A is incorrect.<\/b> This standard encompasses broad ethical failings, including fraud, deceit, or actions that discredit the profession. While Clifford’s passive approval might seem negligent, the ethical lapse here is more about professional standards of quality and process rather than overt misconduct.<\/p><p><b>C is incorrect.<\/b> This standard governs how members present their CFA status, ensuring accuracy and avoiding exaggeration or misuse of the designation. Since the issue here isn’t related to Clifford’s use of the CFA title or program credentials, this standard doesn’t apply.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Darrel Clifford<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darrel Clifford, CFA, is a Senior Analyst at Bedford Fund, a UK-based global investment firm.<\/p><p>Recently, Bedford hired Pat Krapf, a junior analyst formerly employed at a competing asset<\/p><p>manager. Clifford was assigned as Krapf’s supervisor, tasked with onboarding him into the<\/p><p>emerging markets research team.<\/p><p>On his first day, Krapf distributes a file labeled “AlphaScout® v3.2”, a sophisticated screening<\/p><p>algorithm from his former employer. “It’s proprietary,” he tells the team, “but we’ll be more<\/p><p>competitive if we start with this.” Clifford recognizes the name of the tool from industry<\/p><p>publications and suspects it may be protected intellectual property.<\/p><p>Later that week, Krapf receives a £2,500 gold watch and a five-day stay at a client’s beach house<\/p><p>in Hawaii. The gifts come from BGR Capital, a client impressed with last year’s performance.<\/p><p>“It’s under the UK limit of £3,000,” Krapf explains. “Perfectly fine under local rules.” But Clifford<\/p><p>is concerned and reviews Bedford Fund’s internal policy, which requires all gifts exceeding £100<\/p><p>to be disclosed and pre-approved. Gifts of excessive value must be either declined or donated to<\/p><p>charity.<\/p><p>Clifford consults the firm’s ethics manual and notes that it explicitly states: “When laws and firm<\/p><p>policy conflict, staff must adhere to the stricter standard.” He reminds Krapf that even if the law<\/p><p>allows it, Bedford’s policies are more conservative, and CFA Institute Standards require<\/p><p>adherence to the highest applicable rule. Krapf is skeptical, replying, “I don’t see how it’s a<\/p><p>problem if the client’s happy and I’m within the law.”<\/p><p>As part of their upcoming research note, Krapf plans to utilize the AlphaScout outputs, excluding<\/p><p>any reference to the tool’s origin. Clifford cautions him: “If it’s not ours and not public domain,<\/p><p>we can’t just pass it off without attribution.” Krapf shrugs it off: “Let’s just label the graphs as<\/p><p>proprietary. No one will question it.” The final concern comes when Clifford overhears Krapf<\/p><p>training an intern and boasting about his past firm&#x27;s research processes. “We’re already way<\/p><p>ahead,” he says, “because I brought real tools with me.” Clifford begins to worry that his<\/p><p>supervision may fall short of ethical expectations, especially given the numerous issues that are<\/p><p>unfolding under his watch.<\/p><\/div><\/details><div class=\"qtext\"><p>If Clifford allows the publication of research based on Krapf’s misappropriated algorithm without disclosure, which Standard is most likely to be breached?<\/p><\/div>", "subj": "ethics"}];
const CFG = {"title": "AnalystPrep — Ethical & Professional Standards", "subtitle": "CFA Level II · 84 câu · 21 item sets · AnalystPrep 2026", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;

  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();

  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
</body>
</html>
