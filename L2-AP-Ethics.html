ncorrect. The option suggesting that Bennett did not violate the Standards is incorrect because his actions directly contravene the CFA Institute's prohibition against market manipulation. By disseminating false information to influence the stock price, Bennett engaged in deceptive practices that misled investors and distorted the market dynamics for LMB shares. This manipulation not only affects the integrity of the financial markets but also compromises the trust that investors place in the information available in public domains, which is crucial for making informed investment decisions. B is incorrect. While transaction-based manipulation also involves unethical practices that affect market prices, Bennett's specific actions do not align with this form of manipulation. Transaction-based manipulation typically involves the execution of trades or trade patterns that by themselves manipulate market prices, such as wash trades or churning. In Bennett's case, the manipulation was achieved through the spread of false information rather than through the mechanics of the trading itself. Therefore, while his actions were manipulative, they do not constitute transaction-based manipulation but rather information-based manipulation. ", "explhtml": "<p>Bennett&#x27;s actions clearly fall under the category of information-based manipulation, as defined by Standard II (B) - Market Manipulation of the CFA Institute&#x27;s Code of Ethics and Standards of Professional Conduct. This standard specifically prohibits members and candidates from engaging in practices that distort prices or artificially inflate trading volume with the intent to mislead market participants. By having his wife post false information online, Bennett intentionally spread misleading information to influence the market price of LMB shares. This deceitful act was aimed at creating a false impression of anticipated positive financial results for LMB, thereby manipulating investor behavior to increase the stock price unjustifiably. This allowed Bennett to sell the shares at a higher price, directly benefiting from the manipulated higher market valuation, which is a clear violation of the CFA standards concerning ethical market conduct.<\/p><p><b>A is incorrect<\/b>. The option suggesting that Bennett did not violate the Standards is incorrect because his actions directly contravene the CFA Institute&#x27;s prohibition against market manipulation. By disseminating false information to influence the stock price, Bennett engaged in deceptive practices that misled investors and distorted the market dynamics for LMB shares. This manipulation not only affects the integrity of the financial markets but also compromises the trust that investors place in the information available in public domains, which is crucial for making informed investment decisions.<\/p><p><b>B is incorrect<\/b>. While transaction-based manipulation also involves unethical practices that affect market prices, Bennett&#x27;s specific actions do not align with this form of manipulation. Transaction-based manipulation typically involves the execution of trades or trade patterns that by themselves manipulate market prices, such as wash trades or churning. In Bennett&#x27;s case, the manipulation was achieved through the spread of false information rather than through the mechanics of the trading itself. Therefore, while his actions were manipulative, they do not constitute transaction-based manipulation but rather information-based manipulation. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Joseph Bennett and Cheryl Ritchie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joseph Bennett and Cheryl Ritchie, both CFA charter holders, are traders at Holden &amp; Hodgson Brokerage (H&amp; H), located in London, UK. The two colleagues report to the same supervisor, Hanif Aslan, CFA.<\/p><p>Recently, Bennett received an order to sell 30,000 shares of Lumberg Enterprises (LMB) on behalf of the firm&#x27;s largest client, Malcolm Atchison. Upon receiving these instructions, Bennett explains to Atchison that it will be difficult to liquidate this position without incurring a significant discount to the current quoted price per share. This order volume represents approximately three times the number of LMB shares traded on an average day. Wanting to maximize the client&#x27;s return on this investment, Bennett asks his wife to post anonymous comments in online discussion forums purporting to be an LMB executive with the knowledge that the firm&#x27;s next quarterly earnings announcement will exceed analysts&#x27; expectations. Neither Bennett nor his wife has any basis for making such claims. Over the next two trading days, the price of LMB shares rises steadily. Bennett can liquidate Atchison&#x27;s position with a volume-weighted average selling price above the quoted price per share when the order was originally placed.<\/p><p>Atchison is pleased with Bennett&#x27;s efforts and asks him to use the proceeds of the sale of LMB shares to establish a long position in Hybrid Chemical Processing (HCP). Later that evening, following firm policy, Ritchie stopped at H&amp; H&#x27;s records library to submit paper copies of the forms that must be maintained as supporting documentation for all transactions executed on behalf of clients. Ritchie notices that Bennett&#x27;s submissions show he acquired HCP shares for his wife&#x27;s account five minutes before executing Atchison&#x27;s purchase order. Bennett&#x27;s documents, which he had left on the desk of a clerk who had already left for the day, include a note detailing the reasons why this security was a good investment for both accounts based on a careful and thorough analysis of all the relevant information. Ritchie makes copies of the documents left by Bennett and spends the rest of the evening preparing a detailed memo articulating her concerns. The next day, Ritchie raises these concerns in a meeting with Aslan, who tells her that he sees no reason to inquire into the matter without reading the memo and supporting documents that she wrote and offered to provide.<\/p><p>Because H&amp; H lacks a process allowing employees to anonymously report suspected illegal and/or unethical activities to the firm&#x27;s legal department, Ritchie arranges to meet her lawyer, Marvin Garber, for dinner that night at the Swanson Bistro. Over dinner, Ritchie reveals to Garber her concerns that H&amp; H&#x27;s managers are ignoring unethical and possibly illegal activities undertaken by employees perceived to be future leaders at the firm. She hands her lawyer a sealed envelope containing the memo and supporting documents that she attempted to give Aslan. Following their conversation about other topics, Ritchie enjoys Garber&#x27;s amusing stories about caring for his two-year-old twin daughters on his own while his wife was gone on business last week. Atchison, seated at a table across the room, observes Garber and Ritchie leave the restaurant together in the same taxi after sharing a bottle of wine. The next Saturday, Ritchie returns to the restaurant to collect the car she drove there the night before.<\/p><p>The following Monday, Aslan sends a firm-wide email announcing that Bennett has been promoted to a more senior position. Ritchie congratulates her colleague on his promotion, but is privately disappointed because she also applied for the position and considers herself an ideal candidate. Later that week, Ritchie received an email from Garber noting that she could anonymously report her concerns to local authorities, while she is not legally required to do so. After considering Garber&#x27;s advice, Ritchie decides not to file a report with local authorities but submits a written complaint about Bennett&#x27;s HCP trades to CFA Institute&#x27;s Professional Conduct Program (PCP). After thoroughly investigating the matter, the PCP staff ruled that Bennett violated the Standards and proposed a public censure as a sanction. Bennett, believing that the costs in terms of time and money that he would be required to incur if he chose to have this matter referred to the Disciplinary Review Committee (DRC), decides to accept the charge and proposed sanction.<\/p><p>Sensing that her opportunities for advancement at H&amp; H have diminished, Ritchie hires a recruiter and begins interviewing for positions with a competitor firm. When meeting with the Head of Trading at Portland Brothers, Ritchie makes the following statement: &quot;If I become a member of this team, I am confident that I can contribute to significant revenue growth. I have good relationships with many H&amp; H clients, and I will work to convince them to bring their business here.&quot; After accepting an offer to work at Portland Brothers, Ritchie reviews the most up-to-date version of H&amp;H&#x27;s client list before notifying Aslan of her pending departure.<\/p><p>All new Portland Brothers employees are required to complete a week-long course on professional ethics and compliance with firm policies and applicable laws before assuming their responsibilities. During her training, Ritchie learns that the firm&#x27;s policy allows employees to invest in oversubscribed initial public offerings (IPOs) personally and in private placements under certain conditions, provided that any such trades are immediately disclosed to the compliance department.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Bennett most likely violate the Standards regarding executing his Atchison&#x27;s order to sell LMB shares?<\/p><\/div>", "subj": "ethics"}, {"n": 36, "q": "Did Ritchie most likely violate the Standards with any of her actions to leave H&H to accept a position with Portland Brothers?", "opts": ["No", "Yes, by reviewing a list of H&H's current clients", "Yes, by offering to solicit the business of H&H's current clients"], "ans": "A", "expl": "Ritchie's actions, as described, do not constitute a violation of the CFA Institute's Standards of Professional Conduct, specifically Standard IV (A) - Loyalty. This standard mandates that members and candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, misappropriate their employer's property, or otherwise interfere with their employer's opportunities. Reviewing a list of current clients does not inherently imply misappropriation or misuse of confidential information unless it is used to the detriment of the current employer. Ritchie's review of the client list at H&H, as stated, was part of her regular duties and did not involve taking or using the list for personal gain or to harm H&H. Furthermore, her intention to solicit H&H's clients only after joining Portland Brothers and not before leaving H&H aligns with professional conduct that allows for competitive practices post-employment, provided there is no breach of confidentiality or misuse of proprietary information during the transition. B is incorrect. The statement that Ritchie violated the Standards by reviewing a list of H&H's current clients is unfounded based on the information provided. Standard IV (A) prohibits the misappropriation of employer resources, but Ritchie's review of the client list does not equate to misappropriation. She accessed the information in a professional context and there is no indication that she used or intended to use this information to the detriment of H&H. The mere act of reviewing client information as part of one's job responsibilities, especially when preparing for a transition that could require handover of ongoing projects or client management, does not constitute a violation unless accompanied by evidence of misuse. C is incorrect. Ritchie's statement about soliciting H&H's clients after joining Portland Brothers does not violate the Standards provided she does not act on this intention while still employed at H&H. The Standards permit competitive behavior post-employment as long as it does not involve the breach of confidentiality or the use of proprietary information obtained during the tenure with the former employer. Ritchie's planned solicitation of H&H's clients aims to occur after her employment with H&H has ended, which is a typical practice in competitive business environments and is not prohibited by the CFA Institute's Standards of Professional Conduct. ", "explhtml": "<p>Ritchie&#x27;s actions, as described, do not constitute a violation of the CFA Institute&#x27;s Standards of Professional Conduct, specifically Standard IV (A) - Loyalty. This standard mandates that members and candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, misappropriate their employer&#x27;s property, or otherwise interfere with their employer&#x27;s opportunities. Reviewing a list of current clients does not inherently imply misappropriation or misuse of confidential information unless it is used to the detriment of the current employer. Ritchie&#x27;s review of the client list at H&amp;H, as stated, was part of her regular duties and did not involve taking or using the list for personal gain or to harm H&amp;H. Furthermore, her intention to solicit H&amp;H&#x27;s clients only after joining Portland Brothers and not before leaving H&amp;H aligns with professional conduct that allows for competitive practices post-employment, provided there is no breach of confidentiality or misuse of proprietary information during the transition.<\/p><p><b>B is incorrect<\/b>. The statement that Ritchie violated the Standards by reviewing a list of H&amp;H&#x27;s current clients is unfounded based on the information provided. Standard IV (A) prohibits the misappropriation of employer resources, but Ritchie&#x27;s review of the client list does not equate to misappropriation. She accessed the information in a professional context and there is no indication that she used or intended to use this information to the detriment of H&amp;H. The mere act of reviewing client information as part of one&#x27;s job responsibilities, especially when preparing for a transition that could require handover of ongoing projects or client management, does not constitute a violation unless accompanied by evidence of misuse.<\/p><p><b>C is incorrect<\/b>. Ritchie&#x27;s statement about soliciting H&amp;H&#x27;s clients after joining Portland Brothers does not violate the Standards provided she does not act on this intention while still employed at H&amp;H. The Standards permit competitive behavior post-employment as long as it does not involve the breach of confidentiality or the use of proprietary information obtained during the tenure with the former employer. Ritchie&#x27;s planned solicitation of H&amp;H&#x27;s clients aims to occur after her employment with H&amp;H has ended, which is a typical practice in competitive business environments and is not prohibited by the CFA Institute&#x27;s Standards of Professional Conduct. <\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I-VII, LOS 2(a): Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Joseph Bennett and Cheryl Ritchie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joseph Bennett and Cheryl Ritchie, both CFA charter holders, are traders at Holden &amp; Hodgson Brokerage (H&amp; H), located in London, UK. The two colleagues report to the same supervisor, Hanif Aslan, CFA.<\/p><p>Recently, Bennett received an order to sell 30,000 shares of Lumberg Enterprises (LMB) on behalf of the firm&#x27;s largest client, Malcolm Atchison. Upon receiving these instructions, Bennett explains to Atchison that it will be difficult to liquidate this position without incurring a significant discount to the current quoted price per share. This order volume represents approximately three times the number of LMB shares traded on an average day. Wanting to maximize the client&#x27;s return on this investment, Bennett asks his wife to post anonymous comments in online discussion forums purporting to be an LMB executive with the knowledge that the firm&#x27;s next quarterly earnings announcement will exceed analysts&#x27; expectations. Neither Bennett nor his wife has any basis for making such claims. Over the next two trading days, the price of LMB shares rises steadily. Bennett can liquidate Atchison&#x27;s position with a volume-weighted average selling price above the quoted price per share when the order was originally placed.<\/p><p>Atchison is pleased with Bennett&#x27;s efforts and asks him to use the proceeds of the sale of LMB shares to establish a long position in Hybrid Chemical Processing (HCP). Later that evening, following firm policy, Ritchie stopped at H&amp; H&#x27;s records library to submit paper copies of the forms that must be maintained as supporting documentation for all transactions executed on behalf of clients. Ritchie notices that Bennett&#x27;s submissions show he acquired HCP shares for his wife&#x27;s account five minutes before executing Atchison&#x27;s purchase order. Bennett&#x27;s documents, which he had left on the desk of a clerk who had already left for the day, include a note detailing the reasons why this security was a good investment for both accounts based on a careful and thorough analysis of all the relevant information. Ritchie makes copies of the documents left by Bennett and spends the rest of the evening preparing a detailed memo articulating her concerns. The next day, Ritchie raises these concerns in a meeting with Aslan, who tells her that he sees no reason to inquire into the matter without reading the memo and supporting documents that she wrote and offered to provide.<\/p><p>Because H&amp; H lacks a process allowing employees to anonymously report suspected illegal and/or unethical activities to the firm&#x27;s legal department, Ritchie arranges to meet her lawyer, Marvin Garber, for dinner that night at the Swanson Bistro. Over dinner, Ritchie reveals to Garber her concerns that H&amp; H&#x27;s managers are ignoring unethical and possibly illegal activities undertaken by employees perceived to be future leaders at the firm. She hands her lawyer a sealed envelope containing the memo and supporting documents that she attempted to give Aslan. Following their conversation about other topics, Ritchie enjoys Garber&#x27;s amusing stories about caring for his two-year-old twin daughters on his own while his wife was gone on business last week. Atchison, seated at a table across the room, observes Garber and Ritchie leave the restaurant together in the same taxi after sharing a bottle of wine. The next Saturday, Ritchie returns to the restaurant to collect the car she drove there the night before.<\/p><p>The following Monday, Aslan sends a firm-wide email announcing that Bennett has been promoted to a more senior position. Ritchie congratulates her colleague on his promotion, but is privately disappointed because she also applied for the position and considers herself an ideal candidate. Later that week, Ritchie received an email from Garber noting that she could anonymously report her concerns to local authorities, while she is not legally required to do so. After considering Garber&#x27;s advice, Ritchie decides not to file a report with local authorities but submits a written complaint about Bennett&#x27;s HCP trades to CFA Institute&#x27;s Professional Conduct Program (PCP). After thoroughly investigating the matter, the PCP staff ruled that Bennett violated the Standards and proposed a public censure as a sanction. Bennett, believing that the costs in terms of time and money that he would be required to incur if he chose to have this matter referred to the Disciplinary Review Committee (DRC), decides to accept the charge and proposed sanction.<\/p><p>Sensing that her opportunities for advancement at H&amp; H have diminished, Ritchie hires a recruiter and begins interviewing for positions with a competitor firm. When meeting with the Head of Trading at Portland Brothers, Ritchie makes the following statement: &quot;If I become a member of this team, I am confident that I can contribute to significant revenue growth. I have good relationships with many H&amp; H clients, and I will work to convince them to bring their business here.&quot; After accepting an offer to work at Portland Brothers, Ritchie reviews the most up-to-date version of H&amp;H&#x27;s client list before notifying Aslan of her pending departure.<\/p><p>All new Portland Brothers employees are required to complete a week-long course on professional ethics and compliance with firm policies and applicable laws before assuming their responsibilities. During her training, Ritchie learns that the firm&#x27;s policy allows employees to invest in oversubscribed initial public offerings (IPOs) personally and in private placements under certain conditions, provided that any such trades are immediately disclosed to the compliance department.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Ritchie most likely violate the Standards with any of her actions to leave H&amp;H to accept a position with Portland Brothers?<\/p><\/div>", "subj": "ethics"}, {"n": 37, "q": "Which of the following actions would have been most likely to align with Standard I (E) - Competence?", "opts": ["Sarah, opting to trust Mark's overall diligence and including his analysis in the report despite the noticeable lack of clarity.", "Sarah, advising Mark to take a course on biotechnological regulatory processes to improve his understanding for future reports.", "Sarah, overlooking the need for Mark's understanding of biotechnological concepts, given his proficiency in pharmaceuticals."], "ans": "B", "expl": "Sarah advising Mark to take a course on biotechnological regulatory processes to improve his understanding of future reports would be the action most aligned with Standard I (E) - Competence. This standard mandates that CFA members maintain and improve their professional competence, which encompasses ensuring that those who work under their supervision are adequately equipped to perform competently. By encouraging Mark to further his education on the subject matter, Sarah would have been fostering an environment of continuous improvement and competence. A is incorrect. Trusting past diligence when the current work exhibits issues would not address the immediate need for competence in the subject matter. C is incorrect. Recognizing one's area of expertise and not overstating it is a component of competence; thus, not addressing Mark's lack of understanding in biotechnological concepts would be a breach of this standard.", "explhtml": "<p>Sarah advising Mark to take a course on biotechnological regulatory processes to improve his understanding of future reports would be the action most aligned with Standard I (E) - Competence. This standard mandates that CFA members maintain and improve their professional competence, which encompasses ensuring that those who work under their supervision are adequately equipped to perform competently. By encouraging Mark to further his education on the subject matter, Sarah would have been fostering an environment of continuous improvement and competence.<\/p><p><b>A is incorrect.<\/b> Trusting past diligence when the current work exhibits issues would not address the immediate need for competence in the subject matter.<\/p><p><b>C is incorrect.<\/b> Recognizing one&#x27;s area of expertise and not overstating it is a component of competence; thus, not addressing Mark&#x27;s lack of understanding in biotechnological concepts would be a breach of this standard.<\/p><p class=\"los\">CFA Level II, Ethics, Learning Module 2: Guidance for Standards I–VII, LOS (a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Precision Capital Management<\/summary><div class=\"vig-body\"><p>A group of five analysts at Precision Capital Management, headed by Sarah Thompson, CFA, has<\/p><p>been assigned to conduct a comprehensive analysis of the booming biotechnology sector. The<\/p><p>firm has recently attracted several high-net-worth individuals interested in long-term growth<\/p><p>opportunities in cutting-edge medical treatments. Sarah, renowned for her meticulous attention<\/p><p>to detail and extensive industry knowledge, leads the team with a focus on thorough research<\/p><p>and expertise.<\/p><p>Sarah delegates the task of analyzing the regulatory landscape to Mark Johnson, a junior analyst<\/p><p>with a background in pharmaceuticals but limited experience in biotechnology. In her guidance,<\/p><p>she emphasizes the importance of understanding the FDA approval process, as well as being<\/p><p>aware of international regulatory environments that might impact the sector. Sarah sets<\/p><p>stringent deadlines for the team to complete their individual parts of the analysis, emphasizing<\/p><p>the need for precision in the final report, which portfolio managers will use to inform their<\/p><p>investment decisions.<\/p><p>As the team synthesizes its findings, Sarah ensures that all analyses are cross-verified with the<\/p><p>latest industry data. Mark struggles to fully comprehend certain biotechnological concepts and<\/p><p>methodologies, and his section of the report reflects his misunderstanding. During their review<\/p><p>meetings, Sarah notices the lack of clarity in Mark&#x27;s analysis but decides to include it in the final<\/p><p>report, as time is running short, and she trusts his overall diligence in the past.<\/p><p>When presenting their findings to Precision Capital&#x27;s portfolio managers, Sarah delivers a<\/p><p>confident overview of the biotech landscape and offers specific investment recommendations<\/p><p>based on her team&#x27;s research. She, however, failed to clearly communicate the assumptions and<\/p><p>limitations of the analysis, particularly the sections authored by Mark on the regulatory<\/p><p>environment, which left potential areas of risk unaddressed.<\/p><p>As the report starts influencing investment decisions, the omitted details in communication and<\/p><p>underlying competencies begin to surface. A crucial biotech firm, highlighted in Precision&#x27;s<\/p><p>report as a strong buy, faces unexpected regulatory setbacks, leading to a significant share price<\/p><p>decline. The firm&#x27;s clients experienced losses, and senior management initiated an internal<\/p><p>review to understand how these risks had been overlooked.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following actions would have been most likely to align with Standard I (E) - Competence?<\/p><\/div>", "subj": "ethics"}, {"n": 38, "q": "When presenting the final report, Sarah's best approach to comply with Standard V (B) - Communication with Clients and Prospective Clients would have been:", "opts": ["To provide the portfolio managers with a summary of the biotechnology sector without sharing the analytical team's detailed findings.", "To fully disclose all assumptions, limitations of the analysis, and the actual contributors of each report section to the portfolio managers.", "To only communicate their specific investment recommendations, not the assumptions, to avoid causing confusion among the portfolio managers."], "ans": "B", "expl": "To fully disclose all assumptions, limitations of the analysis, and the actual contributors of each report section to the portfolio managers is the best approach to comply with Standard V (B) - Communication with Clients and Prospective Clients. This standard stresses the need for members to disclose to clients and prospective clients the basic format and general principles of the investment processes they use to analyze investments, select securities, and construct portfolios, and must promptly disclose any changes that might materially affect those processes. A is incorrect. Withholding detailed findings from portfolio managers could lead to poorly informed decision-making, violating the standard. C is incorrect. Avoiding communication of the assumptions behind recommendations can lead to misunderstandings and poor investment decisions, which is also a breach of the transparency required by the standard.", "explhtml": "<p>To fully disclose all assumptions, limitations of the analysis, and the actual contributors of each report section to the portfolio managers is the best approach to comply with Standard V (B) - Communication with Clients and Prospective Clients. This standard stresses the need for members to disclose to clients and prospective clients the basic format and general principles of the investment processes they use to analyze investments, select securities, and construct portfolios, and must promptly disclose any changes that might materially affect those processes.<\/p><p><b>A is incorrect.<\/b> Withholding detailed findings from portfolio managers could lead to poorly informed decision-making, violating the standard.<\/p><p><b>C is incorrect.<\/b> Avoiding communication of the assumptions behind recommendations can lead to misunderstandings and poor investment decisions, which is also a breach of the transparency required by the standard.<\/p><p class=\"los\">CFA Level II, Ethics, Learning Module 2: Guidance for Standards I–VII, LOS (a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Precision Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A group of five analysts at Precision Capital Management, headed by Sarah Thompson, CFA, has<\/p><p>been assigned to conduct a comprehensive analysis of the booming biotechnology sector. The<\/p><p>firm has recently attracted several high-net-worth individuals interested in long-term growth<\/p><p>opportunities in cutting-edge medical treatments. Sarah, renowned for her meticulous attention<\/p><p>to detail and extensive industry knowledge, leads the team with a focus on thorough research<\/p><p>and expertise.<\/p><p>Sarah delegates the task of analyzing the regulatory landscape to Mark Johnson, a junior analyst<\/p><p>with a background in pharmaceuticals but limited experience in biotechnology. In her guidance,<\/p><p>she emphasizes the importance of understanding the FDA approval process, as well as being<\/p><p>aware of international regulatory environments that might impact the sector. Sarah sets<\/p><p>stringent deadlines for the team to complete their individual parts of the analysis, emphasizing<\/p><p>the need for precision in the final report, which portfolio managers will use to inform their<\/p><p>investment decisions.<\/p><p>As the team synthesizes its findings, Sarah ensures that all analyses are cross-verified with the<\/p><p>latest industry data. Mark struggles to fully comprehend certain biotechnological concepts and<\/p><p>methodologies, and his section of the report reflects his misunderstanding. During their review<\/p><p>meetings, Sarah notices the lack of clarity in Mark&#x27;s analysis but decides to include it in the final<\/p><p>report, as time is running short, and she trusts his overall diligence in the past.<\/p><p>When presenting their findings to Precision Capital&#x27;s portfolio managers, Sarah delivers a<\/p><p>confident overview of the biotech landscape and offers specific investment recommendations<\/p><p>based on her team&#x27;s research. She, however, failed to clearly communicate the assumptions and<\/p><p>limitations of the analysis, particularly the sections authored by Mark on the regulatory<\/p><p>environment, which left potential areas of risk unaddressed.<\/p><p>As the report starts influencing investment decisions, the omitted details in communication and<\/p><p>underlying competencies begin to surface. A crucial biotech firm, highlighted in Precision&#x27;s<\/p><p>report as a strong buy, faces unexpected regulatory setbacks, leading to a significant share price<\/p><p>decline. The firm&#x27;s clients experienced losses, and senior management initiated an internal<\/p><p>review to understand how these risks had been overlooked.<\/p><\/div><\/details><div class=\"qtext\"><p>When presenting the final report, Sarah&#x27;s best approach to comply with Standard V (B) - Communication with Clients and Prospective Clients would have been:<\/p><\/div>", "subj": "ethics"}, {"n": 39, "q": "Based on the case study, Sarah Thompson is most likely to have violated which of the following CFA Institute Standards of Professional Conduct?", "opts": ["Standard I (A) - Knowledge of the Law", "Standard I (E) - Competence", "Standard V (A) - Diligence and Reasonable Basis"], "ans": "C", "expl": "Sarah Thompson is most likely to have violated Standard V (A) Diligence and Reasonable Basis. By including Mark's unclear and potentially misunderstood analysis in the report without further review or clarification, Sarah failed to exercise diligence, reasonable care, and thoroughness in the investment analysis. A is incorrect. There is no information in the case study suggesting that Sarah violated knowledge of the law. B is incorrect. While Sarah may have violated Standard I(E) by failing to ensure her subordinate (Mark) was competent to perform the assigned task, the more direct violation in this specific action (publishing a report without a reasonable basis) is Standard V(A).", "explhtml": "<p>Sarah Thompson is most likely to have violated Standard V (A) Diligence and Reasonable Basis. By including Mark&#x27;s unclear and potentially misunderstood analysis in the report without further review or clarification, Sarah failed to exercise diligence, reasonable care, and thoroughness in the investment analysis.<\/p><p><b>A is incorrect.<\/b> There is no information in the case study suggesting that Sarah violated knowledge of the law.<\/p><p><b>B is incorrect.<\/b> While Sarah may have violated Standard I(E) by failing to ensure her subordinate (Mark) was competent to perform the assigned task, the more direct violation in this specific action (publishing a report without a reasonable basis) is Standard V(A).<\/p><p class=\"los\">CFA Level II, Ethics, Learning Module 2: Guidance for Standards I–VII, LOS (a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Precision Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A group of five analysts at Precision Capital Management, headed by Sarah Thompson, CFA, has<\/p><p>been assigned to conduct a comprehensive analysis of the booming biotechnology sector. The<\/p><p>firm has recently attracted several high-net-worth individuals interested in long-term growth<\/p><p>opportunities in cutting-edge medical treatments. Sarah, renowned for her meticulous attention<\/p><p>to detail and extensive industry knowledge, leads the team with a focus on thorough research<\/p><p>and expertise.<\/p><p>Sarah delegates the task of analyzing the regulatory landscape to Mark Johnson, a junior analyst<\/p><p>with a background in pharmaceuticals but limited experience in biotechnology. In her guidance,<\/p><p>she emphasizes the importance of understanding the FDA approval process, as well as being<\/p><p>aware of international regulatory environments that might impact the sector. Sarah sets<\/p><p>stringent deadlines for the team to complete their individual parts of the analysis, emphasizing<\/p><p>the need for precision in the final report, which portfolio managers will use to inform their<\/p><p>investment decisions.<\/p><p>As the team synthesizes its findings, Sarah ensures that all analyses are cross-verified with the<\/p><p>latest industry data. Mark struggles to fully comprehend certain biotechnological concepts and<\/p><p>methodologies, and his section of the report reflects his misunderstanding. During their review<\/p><p>meetings, Sarah notices the lack of clarity in Mark&#x27;s analysis but decides to include it in the final<\/p><p>report, as time is running short, and she trusts his overall diligence in the past.<\/p><p>When presenting their findings to Precision Capital&#x27;s portfolio managers, Sarah delivers a<\/p><p>confident overview of the biotech landscape and offers specific investment recommendations<\/p><p>based on her team&#x27;s research. She, however, failed to clearly communicate the assumptions and<\/p><p>limitations of the analysis, particularly the sections authored by Mark on the regulatory<\/p><p>environment, which left potential areas of risk unaddressed.<\/p><p>As the report starts influencing investment decisions, the omitted details in communication and<\/p><p>underlying competencies begin to surface. A crucial biotech firm, highlighted in Precision&#x27;s<\/p><p>report as a strong buy, faces unexpected regulatory setbacks, leading to a significant share price<\/p><p>decline. The firm&#x27;s clients experienced losses, and senior management initiated an internal<\/p><p>review to understand how these risks had been overlooked.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the case study, Sarah Thompson is most likely to have violated which of the following CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 40, "q": "During the presentation to portfolio managers, Sarah failed to mention Mark's difficulties with his regulatory analysis and its impact on investment risks. This omission is most likely a breach of which Standard?", "opts": ["Standard IV (C) - Responsibilities of Supervisors", "Standard V (B) - Communication with Clients and Prospective Clients", "Standard VI (C) - Referral Fees"], "ans": "B", "expl": "This standard states that CFA charterholders must disclose to clients and prospective clients significant limitations and risks associated with the investment process. Sarah’s omission of the shortcomings in Mark's analysis could potentially mislead portfolio managers, making them unaware of the associated investment risks. A is incorrect. While Sarah is a supervisor and does have responsibilities over Mark, the specific violation noted here is in the context of communication, not supervisory responsibilities. C is incorrect. Referral fees are unrelated to the issue at hand, which is a failure to disclose significant analysis limitations.", "explhtml": "<p>This standard states that CFA charterholders must disclose to clients and prospective clients significant limitations and risks associated with the investment process. Sarah’s omission of the shortcomings in Mark&#x27;s analysis could potentially mislead portfolio managers, making them unaware of the associated investment risks.<\/p><p><b>A is incorrect.<\/b> While Sarah is a supervisor and does have responsibilities over Mark, the specific violation noted here is in the context of communication, not supervisory responsibilities.<\/p><p><b>C is incorrect.<\/b> Referral fees are unrelated to the issue at hand, which is a failure to disclose significant analysis limitations.<\/p><p class=\"los\">CFA Level II, Ethics, Learning Module 2: Guidance for Standards I–VII, LOS (a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Precision Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A group of five analysts at Precision Capital Management, headed by Sarah Thompson, CFA, has<\/p><p>been assigned to conduct a comprehensive analysis of the booming biotechnology sector. The<\/p><p>firm has recently attracted several high-net-worth individuals interested in long-term growth<\/p><p>opportunities in cutting-edge medical treatments. Sarah, renowned for her meticulous attention<\/p><p>to detail and extensive industry knowledge, leads the team with a focus on thorough research<\/p><p>and expertise.<\/p><p>Sarah delegates the task of analyzing the regulatory landscape to Mark Johnson, a junior analyst<\/p><p>with a background in pharmaceuticals but limited experience in biotechnology. In her guidance,<\/p><p>she emphasizes the importance of understanding the FDA approval process, as well as being<\/p><p>aware of international regulatory environments that might impact the sector. Sarah sets<\/p><p>stringent deadlines for the team to complete their individual parts of the analysis, emphasizing<\/p><p>the need for precision in the final report, which portfolio managers will use to inform their<\/p><p>investment decisions.<\/p><p>As the team synthesizes its findings, Sarah ensures that all analyses are cross-verified with the<\/p><p>latest industry data. Mark struggles to fully comprehend certain biotechnological concepts and<\/p><p>methodologies, and his section of the report reflects his misunderstanding. During their review<\/p><p>meetings, Sarah notices the lack of clarity in Mark&#x27;s analysis but decides to include it in the final<\/p><p>report, as time is running short, and she trusts his overall diligence in the past.<\/p><p>When presenting their findings to Precision Capital&#x27;s portfolio managers, Sarah delivers a<\/p><p>confident overview of the biotech landscape and offers specific investment recommendations<\/p><p>based on her team&#x27;s research. She, however, failed to clearly communicate the assumptions and<\/p><p>limitations of the analysis, particularly the sections authored by Mark on the regulatory<\/p><p>environment, which left potential areas of risk unaddressed.<\/p><p>As the report starts influencing investment decisions, the omitted details in communication and<\/p><p>underlying competencies begin to surface. A crucial biotech firm, highlighted in Precision&#x27;s<\/p><p>report as a strong buy, faces unexpected regulatory setbacks, leading to a significant share price<\/p><p>decline. The firm&#x27;s clients experienced losses, and senior management initiated an internal<\/p><p>review to understand how these risks had been overlooked.<\/p><\/div><\/details><div class=\"qtext\"><p>During the presentation to portfolio managers, Sarah failed to mention Mark&#x27;s difficulties with his regulatory analysis and its impact on investment risks. This omission is most likely a breach of which Standard?<\/p><\/div>", "subj": "ethics"}, {"n": 41, "q": "Which of the following actions by Sophie Bennett most likely violated CFA Institute's Standard III (B) - Fair Dealing?", "opts": ["Adjusting Mr. Wilson's portfolio without providing additional disclosures about the risks associated with the newly adopted technology.", "Writing an article for the firm's newsletter, omitting her role in researching and selecting the AI software.", "Recommending the AI software to the investment committee based on her research."], "ans": "A", "expl": "Standard III(B) requires members to deal fairly with all clients when taking investment actions. By adjusting Mr. Wilson’s portfolio based on the new, unproven AI technology without disclosing the associated risks, Bennett failed to ensure the client had adequate information to understand the potential implications of the change. This lack of disclosure deprived Mr. Wilson of the opportunity to provide informed consent, placing him at a disadvantage and constituting a failure to deal fairly. B is incorrect. Omitting her role in selecting the software from a firm newsletter is not an investment action and does not, by itself, disadvantage any client in the investment process. This omission could potentially raise issues under other standards (like misrepresentation), but it does not violate Standard III(B) as it did not affect the fair treatment of a client regarding an investment decision. C is incorrect. Recommending a software tool to an internal committee based on diligent research is part of her professional duties and is not a violation of any standard. This action was taken for the benefit of the firm and its clients and does not involve unfair treatment of any specific client.", "explhtml": "<p>Standard III(B) requires members to deal fairly with all clients when taking investment actions. By adjusting Mr. Wilson’s portfolio based on the new, unproven AI technology without disclosing the associated risks, Bennett failed to ensure the client had adequate information to understand the potential implications of the change. This lack of disclosure deprived Mr. Wilson of the opportunity to provide informed consent, placing him at a disadvantage and constituting a failure to deal fairly.<\/p><p><b>B is incorrect.<\/b> Omitting her role in selecting the software from a firm newsletter is not an investment action and does not, by itself, disadvantage any client in the investment process. This omission could potentially raise issues under other standards (like misrepresentation), but it does not violate Standard III(B) as it did not affect the fair treatment of a client regarding an investment decision.<\/p><p><b>C is incorrect.<\/b> Recommending a software tool to an internal committee based on diligent research is part of her professional duties and is not a violation of any standard. This action was taken for the benefit of the firm and its clients and does not involve unfair treatment of any specific client.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Harris &amp; Chen Investment Advisors<\/summary><div class=\"vig-body\"><p>Harris &amp; Chen Investment Advisors is a boutique investment firm specializing in active<\/p><p>management of equity portfolios for high-net-worth individuals. Sophie Bennett, a CFA<\/p><p>Charterholder employed at the firm, manages several client portfolios and co-leads the<\/p><p>investment committee with a senior advisor. Bennett also frequently contributes to the firm&#x27;s<\/p><p>quarterly newsletter, which includes market insights and her analysis of investment<\/p><p>opportunities.<\/p><p>Recently, the investment committee decided to focus on leveraging artificial intelligence (AI) in<\/p><p>enhancing portfolio management decisions. Bennett was tasked with researching various AI-<\/p><p>driven analysis software and presenting her findings at the next committee meeting. After<\/p><p>careful due diligence, she recommended a cutting-edge AI tool that had a high initial cost but<\/p><p>promised significant improvements in predictive analytics and portfolio optimization. Based on<\/p><p>Bennett&#x27;s presentation, the investment committee approved its purchase.<\/p><p>The conversation around AI&#x27;s impact continued to gain momentum internally, leading Bennett to<\/p><p>write an article titled &quot;The Future of Active Management: Embracing AI,&quot; for the firm&#x27;s<\/p><p>upcoming newsletter. In the article, Bennett discussed the potential benefits of integrating AI<\/p><p>into investment decision-making processes, citing the recently purchased AI tool as a key<\/p><p>component of this strategy. However, she omitted any mention of her instrumental role in<\/p><p>researching and selecting the software.<\/p><p>One of Bennett&#x27;s affluent clients, Mr. Wilson, after reading the newsletter article, requested to<\/p><p>have his assets reallocated to take advantage of the new AI capabilities. Bennett reassured him<\/p><p>about the capabilities of the new tool and anticipated its positive impact on portfolio<\/p><p>performance. Subsequently, she proceeded to adjust his portfolio allocations without providing<\/p><p>additional disclosures about the risks associated with using the newly adopted technology.<\/p><p>Six months after the implementation of the AI tool, the performance of the AI-driven portfolios<\/p><p>had not met the expectations that Bennett had set for her clients. The underperformance raised<\/p><p>concerns among several clients, including Mr. Wilson, who questioned the validity of the changes<\/p><p>that were made to his portfolio and the research behind the adoption of the AI tool. Bennett now<\/p><p>faces inquiries from clients and scrutiny from the firm’s compliance department regarding the process that led to the integration of the AI technology and whether her actions adhered to the<\/p><p>standards of professional conduct expected by the CFA Institute.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following actions by Sophie Bennett most likely violated CFA Institute&#x27;s Standard III (B) - Fair Dealing?<\/p><\/div>", "subj": "ethics"}, {"n": 42, "q": "Bennett’s co-leading of the investment committee would least likely result in a violation of which CFA Institute Standard?", "opts": ["Standard III (C) - Suitability", "Standard IV (B)- Additional Compensation Arrangements", "Standard VI (B) - Priority of Transactions"], "ans": "B", "expl": "Standard IV(B) specifically deals with accepting gifts or compensation that could create a conflict of interest with the employer. The scenario provides no information suggesting Bennett is receiving any additional compensation, gifts, or benefits from a third party for her committee work or recommendations. Therefore, her core duties on the committee are unrelated to the concerns of this standard. A is incorrect. As a co-leader of the investment committee, Bennett is directly involved in making investment recommendations and decisions. This role carries a high responsibility to ensure that each investment action is suitable for every client's financial situation and investment objectives, making a potential violation of Standard III(C) a direct and plausible risk.. C is incorrect. A member of the investment committee has early knowledge of impending portfolio transactions. This privileged position creates a clear risk that personal transactions could be executed ahead of client trades, which would directly violate Standard VI(B) by not giving client transactions priority.", "explhtml": "<p>Standard IV(B) specifically deals with accepting gifts or compensation that could create a conflict of interest with the employer. The scenario provides no information suggesting Bennett is receiving any additional compensation, gifts, or benefits from a third party for her committee work or recommendations. Therefore, her core duties on the committee are unrelated to the concerns of this standard.<\/p><p><b>A is incorrect.<\/b> As a co-leader of the investment committee, Bennett is directly involved in making investment recommendations and decisions. This role carries a high responsibility to ensure that each investment action is suitable for every client&#x27;s financial situation and investment objectives, making a potential violation of Standard III(C) a direct and plausible risk..<\/p><p><b>C is incorrect.<\/b> A member of the investment committee has early knowledge of impending portfolio transactions. This privileged position creates a clear risk that personal transactions could be executed ahead of client trades, which would directly violate Standard VI(B) by not giving client transactions priority.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Harris &amp; Chen Investment Advisors<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Harris &amp; Chen Investment Advisors is a boutique investment firm specializing in active<\/p><p>management of equity portfolios for high-net-worth individuals. Sophie Bennett, a CFA<\/p><p>Charterholder employed at the firm, manages several client portfolios and co-leads the<\/p><p>investment committee with a senior advisor. Bennett also frequently contributes to the firm&#x27;s<\/p><p>quarterly newsletter, which includes market insights and her analysis of investment<\/p><p>opportunities.<\/p><p>Recently, the investment committee decided to focus on leveraging artificial intelligence (AI) in<\/p><p>enhancing portfolio management decisions. Bennett was tasked with researching various AI-<\/p><p>driven analysis software and presenting her findings at the next committee meeting. After<\/p><p>careful due diligence, she recommended a cutting-edge AI tool that had a high initial cost but<\/p><p>promised significant improvements in predictive analytics and portfolio optimization. Based on<\/p><p>Bennett&#x27;s presentation, the investment committee approved its purchase.<\/p><p>The conversation around AI&#x27;s impact continued to gain momentum internally, leading Bennett to<\/p><p>write an article titled &quot;The Future of Active Management: Embracing AI,&quot; for the firm&#x27;s<\/p><p>upcoming newsletter. In the article, Bennett discussed the potential benefits of integrating AI<\/p><p>into investment decision-making processes, citing the recently purchased AI tool as a key<\/p><p>component of this strategy. However, she omitted any mention of her instrumental role in<\/p><p>researching and selecting the software.<\/p><p>One of Bennett&#x27;s affluent clients, Mr. Wilson, after reading the newsletter article, requested to<\/p><p>have his assets reallocated to take advantage of the new AI capabilities. Bennett reassured him<\/p><p>about the capabilities of the new tool and anticipated its positive impact on portfolio<\/p><p>performance. Subsequently, she proceeded to adjust his portfolio allocations without providing<\/p><p>additional disclosures about the risks associated with using the newly adopted technology.<\/p><p>Six months after the implementation of the AI tool, the performance of the AI-driven portfolios<\/p><p>had not met the expectations that Bennett had set for her clients. The underperformance raised<\/p><p>concerns among several clients, including Mr. Wilson, who questioned the validity of the changes<\/p><p>that were made to his portfolio and the research behind the adoption of the AI tool. Bennett now<\/p><p>faces inquiries from clients and scrutiny from the firm’s compliance department regarding the process that led to the integration of the AI technology and whether her actions adhered to the<\/p><p>standards of professional conduct expected by the CFA Institute.<\/p><\/div><\/details><div class=\"qtext\"><p>Bennett’s co-leading of the investment committee would least likely result in a violation of which CFA Institute Standard?<\/p><\/div>", "subj": "ethics"}, {"n": 43, "q": "According to CFA Institute's Standard IV (A) - Loyalty, which of the following would have been the most appropriate action for Bennett when writing the newsletter article?", "opts": ["Discuss the potential risks of AI in the article.", "Provide a full disclosure of all personal biases and conflicts she may hold regarding AI technology.", "Omit any information that could potentially dissuade clients from adopting AI into their investment strategies."], "ans": "A", "expl": "CFA Institute's Standard IV (A) - Loyalty emphasizes acting in the best interests of clients and maintaining transparency in communication. By discussing the risks associated with AI, Bennett would have provided a balanced and informed perspective, ensuring that clients understand both the benefits and potential drawbacks of the technology before making investment decisions. B is incorrect. While disclosing biases and conflicts is important, the primary concern in this scenario is ensuring that clients receive a comprehensive understanding of the risks involved in AI-driven investment strategies. Simply disclosing personal biases does not fulfill the duty to provide a well-rounded analysis of the technology's implications. C is incorrect. It violates the ethical obligation to provide clients with complete and accurate information. Omitting risks would mislead clients and could result in uninformed investment decisions, which contradicts the principles of transparency and integrity outlined in the CFA Institute's Code of Ethics.", "explhtml": "<p>CFA Institute&#x27;s Standard IV (A) - Loyalty emphasizes acting in the best interests of clients and maintaining transparency in communication. By discussing the risks associated with AI, Bennett would have provided a balanced and informed perspective, ensuring that clients understand both the benefits and potential drawbacks of the technology before making investment decisions.<\/p><p><b>B is incorrect.<\/b> While disclosing biases and conflicts is important, the primary concern in this scenario is ensuring that clients receive a comprehensive understanding of the risks involved in AI-driven investment strategies. Simply disclosing personal biases does not fulfill the duty to provide a well-rounded analysis of the technology&#x27;s implications.<\/p><p><b>C is incorrect.<\/b> It violates the ethical obligation to provide clients with complete and accurate information. Omitting risks would mislead clients and could result in uninformed investment decisions, which contradicts the principles of transparency and integrity outlined in the CFA Institute&#x27;s Code of Ethics.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Harris &amp; Chen Investment Advisors<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Harris &amp; Chen Investment Advisors is a boutique investment firm specializing in active<\/p><p>management of equity portfolios for high-net-worth individuals. Sophie Bennett, a CFA<\/p><p>Charterholder employed at the firm, manages several client portfolios and co-leads the<\/p><p>investment committee with a senior advisor. Bennett also frequently contributes to the firm&#x27;s<\/p><p>quarterly newsletter, which includes market insights and her analysis of investment<\/p><p>opportunities.<\/p><p>Recently, the investment committee decided to focus on leveraging artificial intelligence (AI) in<\/p><p>enhancing portfolio management decisions. Bennett was tasked with researching various AI-<\/p><p>driven analysis software and presenting her findings at the next committee meeting. After<\/p><p>careful due diligence, she recommended a cutting-edge AI tool that had a high initial cost but<\/p><p>promised significant improvements in predictive analytics and portfolio optimization. Based on<\/p><p>Bennett&#x27;s presentation, the investment committee approved its purchase.<\/p><p>The conversation around AI&#x27;s impact continued to gain momentum internally, leading Bennett to<\/p><p>write an article titled &quot;The Future of Active Management: Embracing AI,&quot; for the firm&#x27;s<\/p><p>upcoming newsletter. In the article, Bennett discussed the potential benefits of integrating AI<\/p><p>into investment decision-making processes, citing the recently purchased AI tool as a key<\/p><p>component of this strategy. However, she omitted any mention of her instrumental role in<\/p><p>researching and selecting the software.<\/p><p>One of Bennett&#x27;s affluent clients, Mr. Wilson, after reading the newsletter article, requested to<\/p><p>have his assets reallocated to take advantage of the new AI capabilities. Bennett reassured him<\/p><p>about the capabilities of the new tool and anticipated its positive impact on portfolio<\/p><p>performance. Subsequently, she proceeded to adjust his portfolio allocations without providing<\/p><p>additional disclosures about the risks associated with using the newly adopted technology.<\/p><p>Six months after the implementation of the AI tool, the performance of the AI-driven portfolios<\/p><p>had not met the expectations that Bennett had set for her clients. The underperformance raised<\/p><p>concerns among several clients, including Mr. Wilson, who questioned the validity of the changes<\/p><p>that were made to his portfolio and the research behind the adoption of the AI tool. Bennett now<\/p><p>faces inquiries from clients and scrutiny from the firm’s compliance department regarding the process that led to the integration of the AI technology and whether her actions adhered to the<\/p><p>standards of professional conduct expected by the CFA Institute.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute&#x27;s Standard IV (A) - Loyalty, which of the following would have been the most appropriate action for Bennett when writing the newsletter article?<\/p><\/div>", "subj": "ethics"}, {"n": 44, "q": "In addressing the underperformance after six months of applying AI to portfolio management, Bennett’s response to clients would best comply with Standard VI (A) – Avoid or Disclose Conflicts if she:", "opts": ["Claims that the underperformance was a market-wide phenomenon.", "Explains the actual vs. expected performance and discusses the inherent unpredictability of adopting new technologies.", "Refrains from discussing the underperformance but focuses on long-term investment strategies."], "ans": "B", "expl": "Standard VI(A) requires members to fully and fairly disclose all matters that could impair their independence and objectivity or interfere with their duties to clients. The AI tool's underperformance represents a conflict between the firm's promoted strategy and the actual results. By explaining the actual vs. expected performance and discussing the inherent risks and unpredictability of the new technology, Bennett is making the necessary disclosures. This transparency enables clients to fully understand the situation, thereby ensuring compliance with the standard. A is incorrect. Attributing the underperformance solely to a \"market-wide phenomenon\" is misleading and omits the material conflict. It avoids disclosing the specific role and performance of the new, promoted AI tool, which is at the heart of the conflict of interest. This lack of full disclosure violates Standard VI(A). C is incorrect. Refraining from discussing the underperformance entirely is a failure to disclose a material conflict. Clients have a right to know the reasons for the underperformance of a strategy that was specifically promoted to them. Focusing only on the long term without addressing the present issue is an omission that impairs transparency and violates the standard.", "explhtml": "<p>Standard VI(A) requires members to fully and fairly disclose all matters that could impair their independence and objectivity or interfere with their duties to clients. The AI tool&#x27;s underperformance represents a conflict between the firm&#x27;s promoted strategy and the actual results. By explaining the actual vs. expected performance and discussing the inherent risks and unpredictability of the new technology, Bennett is making the necessary disclosures. This transparency enables clients to fully understand the situation, thereby ensuring compliance with the standard.<\/p><p><b>A is incorrect.<\/b> Attributing the underperformance solely to a &quot;market-wide phenomenon&quot; is misleading and omits the material conflict. It avoids disclosing the specific role and performance of the new, promoted AI tool, which is at the heart of the conflict of interest. This lack of full disclosure violates Standard VI(A).<\/p><p><b>C is incorrect.<\/b> Refraining from discussing the underperformance entirely is a failure to disclose a material conflict. Clients have a right to know the reasons for the underperformance of a strategy that was specifically promoted to them. Focusing only on the long term without addressing the present issue is an omission that impairs transparency and violates the standard.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS (a) demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Harris &amp; Chen Investment Advisors<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Harris &amp; Chen Investment Advisors is a boutique investment firm specializing in active<\/p><p>management of equity portfolios for high-net-worth individuals. Sophie Bennett, a CFA<\/p><p>Charterholder employed at the firm, manages several client portfolios and co-leads the<\/p><p>investment committee with a senior advisor. Bennett also frequently contributes to the firm&#x27;s<\/p><p>quarterly newsletter, which includes market insights and her analysis of investment<\/p><p>opportunities.<\/p><p>Recently, the investment committee decided to focus on leveraging artificial intelligence (AI) in<\/p><p>enhancing portfolio management decisions. Bennett was tasked with researching various AI-<\/p><p>driven analysis software and presenting her findings at the next committee meeting. After<\/p><p>careful due diligence, she recommended a cutting-edge AI tool that had a high initial cost but<\/p><p>promised significant improvements in predictive analytics and portfolio optimization. Based on<\/p><p>Bennett&#x27;s presentation, the investment committee approved its purchase.<\/p><p>The conversation around AI&#x27;s impact continued to gain momentum internally, leading Bennett to<\/p><p>write an article titled &quot;The Future of Active Management: Embracing AI,&quot; for the firm&#x27;s<\/p><p>upcoming newsletter. In the article, Bennett discussed the potential benefits of integrating AI<\/p><p>into investment decision-making processes, citing the recently purchased AI tool as a key<\/p><p>component of this strategy. However, she omitted any mention of her instrumental role in<\/p><p>researching and selecting the software.<\/p><p>One of Bennett&#x27;s affluent clients, Mr. Wilson, after reading the newsletter article, requested to<\/p><p>have his assets reallocated to take advantage of the new AI capabilities. Bennett reassured him<\/p><p>about the capabilities of the new tool and anticipated its positive impact on portfolio<\/p><p>performance. Subsequently, she proceeded to adjust his portfolio allocations without providing<\/p><p>additional disclosures about the risks associated with using the newly adopted technology.<\/p><p>Six months after the implementation of the AI tool, the performance of the AI-driven portfolios<\/p><p>had not met the expectations that Bennett had set for her clients. The underperformance raised<\/p><p>concerns among several clients, including Mr. Wilson, who questioned the validity of the changes<\/p><p>that were made to his portfolio and the research behind the adoption of the AI tool. Bennett now<\/p><p>faces inquiries from clients and scrutiny from the firm’s compliance department regarding the process that led to the integration of the AI technology and whether her actions adhered to the<\/p><p>standards of professional conduct expected by the CFA Institute.<\/p><\/div><\/details><div class=\"qtext\"><p>In addressing the underperformance after six months of applying AI to portfolio management, Bennett’s response to clients would best comply with Standard VI (A) – Avoid or Disclose Conflicts if she:<\/p><\/div>", "subj": "ethics"}, {"n": 45, "q": "Jeremy’s marketing materials, which selectively included testimonials and favorable performance figures, most likely violate Standard V (B) because they:", "opts": ["Do not include a balanced selection of testimonials representing a diversity of client experiences.", "Use performance figures selectively without adequate context regarding market conditions.", "Both A and B."], "ans": "C", "expl": "Standard V (B) - Communication with Clients and Prospective Clients requires members to communicate investment performance information fairly, accurately, and to not be misleading. By selecting only favorable testimonials and presenting decontextualized performance figures, Jeremy's materials could give clients and prospective clients an unwarranted expectation of future performance. A is incorrect. It only identifies one aspect of misleading communication. B is incorrect. It also only identifies one aspect of misleading communication.", "explhtml": "<p>Standard V (B) - Communication with Clients and Prospective Clients requires members to communicate investment performance information fairly, accurately, and to not be misleading. By selecting only favorable testimonials and presenting decontextualized performance figures, Jeremy&#x27;s materials could give clients and prospective clients an unwarranted expectation of future performance.<\/p><p><b>A is incorrect.<\/b> It only identifies one aspect of misleading communication.<\/p><p><b>B is incorrect.<\/b> It also only identifies one aspect of misleading communication.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Global Wealth Management (GWM)<\/summary><div class=\"vig-body\"><p>Harper Lee, CFA, is the director of wealth management at Global Wealth Pooled Funds (GWM), a<\/p><p>firm offering a range of investment solutions catered to institutional and HNW individual clients.<\/p><p>One of GWM’s flagship products is the Global Dynamic Allocation Fund (GDAF), a globally<\/p><p>diversified multi-asset fund that aims to dynamically allocate between stocks, bonds, and<\/p><p>alternative investments to optimize risk-adjusted returns.<\/p><p>GWM, with Harper’s encouragement, has made significant investments in sophisticated<\/p><p>analytical tools to improve its ability to forecast market trends and evaluate investment<\/p><p>opportunities. These tools form the backbone of GWM’s quantitative model, which Harper has<\/p><p>marketed aggressively on the premise that it allows GWM to stay ahead of market curves.<\/p><p>Jeremy Smith, a marketing associate at GWM, is tasked with creating marketing materials for<\/p><p>the upcoming quarter. Jeremy, who is not a CFA charterholder, uses performance figures in a way<\/p><p>that places GWM in a favorable light without providing the context of overall market conditions<\/p><p>at the time. Furthermore, he includes testimonials from select clients who had exceptional<\/p><p>returns, attributing their success to GWM’s fund management strategies.<\/p><p>During a client review meeting, Harper presents GWM’s outlook and the impressive back-tested<\/p><p>results of the new quantitative model as indicators of the model&#x27;s future performance potential.<\/p><p>However, Harper fails to discuss the limitations of back-testing and does not mention that past<\/p><p>performance is not indicative of future results.<\/p><p>In their latest quarterly newsletter, Harper writes an article comparing GWM&#x27;s GDAF to an<\/p><p>industry benchmark index. The index chosen is applicable to the fund&#x27;s investment style, but the<\/p><p>time period selected for the comparison is when the GDAF notably outperformed the index due<\/p><p>to a temporary market anomaly that favored GWM&#x27;s investment style. No mention is made of the<\/p><p>more modest performance of the GDAF across most other time frames.<\/p><p><b>Data Table<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0011.webp\" style=\"max-width:min(100%,517px)\" alt=\"Quarter GDAF Industry Overall Return (%) Benchmark Market Index Return (%) Condition Q4 2021 6.0 4.0 Bull Market Q1 2022 −1.0 −2.0 Market Correction Q2 2022 2.5 2.0 Recovering Market Q3 2022 10.0 3.0 Market Anomaly (Anomaly) Favoring GWM’s style Q4 2022 3.0 3.5 Stable Market\"><p><b>Note:<\/b> The performance figures have been annualized for the duration of each quarter.<\/p><\/div><\/details><div class=\"qtext\"><p>Jeremy’s marketing materials, which selectively included testimonials and favorable performance figures, most likely violate Standard V (B) because they:<\/p><\/div>", "subj": "ethics"}, {"n": 46, "q": "Harper’s discussion of the quantitative model’s back-tested results without mentioning the inherent limitations of back-testing most likely violates which CFA Institute Standard?", "opts": ["Standard III (B) - Fair Dealing.", "Standard V (A) - Diligence and Reasonable Basis.", "Standard V (B) - Communication with Clients and Prospective Clients."], "ans": "C", "expl": "When presenting performance information, particularly back-tested results, to clients or potential clients, it is imperative to provide a thorough explanation, including the limitations and assumptions of the model. Omitting these explanations can result in misleading communications. A is incorrect. Fair Dealing pertains to equitable treatment of clients but does not specifically address the communication of investment methodologies and their limitations. B is incorrect. While Diligence and Reasonable Basis deals with thorough and diligent investment analysis, the violation in this case pertains to the communication aspects rather than the basis of the quantitative model.", "explhtml": "<p>When presenting performance information, particularly back-tested results, to clients or potential clients, it is imperative to provide a thorough explanation, including the limitations and assumptions of the model. Omitting these explanations can result in misleading communications.<\/p><p><b>A is incorrect.<\/b> Fair Dealing pertains to equitable treatment of clients but does not specifically address the communication of investment methodologies and their limitations.<\/p><p><b>B is incorrect.<\/b> While Diligence and Reasonable Basis deals with thorough and diligent investment analysis, the violation in this case pertains to the communication aspects rather than the basis of the quantitative model.<\/p><p class=\"los\">Ethics, Learning Module 2: Guidance for Standards I–VII, LOS 2(a) Demonstrate a thorough knowledge of the CFA Institute Code of Ethics and Standards of Professional Conduct by applying the Code and Standards to specific situations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Global Wealth Management (GWM)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Harper Lee, CFA, is the director of wealth management at Global Wealth Pooled Funds (GWM), a<\/p><p>firm offering a range of investment solutions catered to institutional and HNW individual clients.<\/p><p>One of GWM’s flagship products is the Global Dynamic Allocation Fund (GDAF), a globally<\/p><p>diversified multi-asset fund that aims to dynamically allocate between stocks, bonds, and<\/p><p>alternative investments to optimize risk-adjusted returns.<\/p><p>GWM, with Harper’s encouragement, has made significant investments in sophisticated<\/p><p>analytical tools to improve its ability to forecast market trends and evaluate investment<\/p><p>opportunities. These tools form the backbone of GWM’s quantitative model, which Harper has<\/p><p>marketed aggressively on the premise that it allows GWM to stay ahead of market curves.<\/p><p>Jeremy Smith, a marketing associate at GWM, is tasked with creating marketing materials for<\/p><p>the upcoming quarter. Jeremy, who is not a CFA charterholder, uses performance figures in a way<\/p><p>that places GWM in a favorable light without providing the context of overall market conditions<\/p><p>at the time. Furthermore, he includes testimonials from select clients who had exceptional<\/p><p>returns, attributing their success to GWM’s fund management strategies.<\/p><p>During a client review meeting, Harper presents GWM’s outlook and the impressive back-tested<\/p><p>results of the new quantitative model as indicators of the model&#x27;s future performance potential.<\/p><p>However, Harper fails to discuss the limitations of back-testing and does not mention that past<\/p><p>performance is not indicative of future results.<\/p><p>In their latest quarterly newsletter, Harper writes an article comparing GWM&#x27;s GDAF to an<\/p><p>industry benchmark index. The index chosen is applicable to the fund&#x27;s investment style, but the<\/p><p>time period selected for the comparison is when the GDAF notably outperformed the index due<\/p><p>to a temporary market anomaly that favored GWM&#x27;s investment style. No mention is made of the<\/p><p>more modest performance of the GDAF across most other time frames.<\/p><p><b>Data Table<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap10/f0011.webp\" style=\"max-width:min(100%,517px)\" alt=\"Quarter GDAF Industry Overall Return (%) Benchmark Market Index Return (%) Condition Q4 2021 6.0 4.0 Bull Market Q1 2022 −1.0 −2.0 Market Correction Q2 2022 2.5 2.0 Recovering Market Q3 2022 10.0 3.0 Market Anomaly (Anomaly) Favoring GWM’s style Q4 2022 3.0 3.5 Stable Market\"><p><b>Note:<\/b> The performance figures have been annualized for the duration of each quarter.<\/p><\/div><\/details><div class=\"qtext\"><p>Harper’s discussion of the quantitative model’s back-tested results without mentioning the inherent limitations of back-testing most likely violates which CFA Institute Standard?<\/p><\/div>", "subj": "ethics"}, {"n": 47, "q": "The selection of an industry benchmark in the quarterly newsletter that only highlights periods of outperformance by GDAF is most indicative of a breach of Standard V (B) due to:", "opts": ["Misrepresentation of the fund's consistent performance abilities.", "Presentation of a potentially misleading and incomplete comparison with the industry benchmark.", "Improper use of an industry benchmark for marketing purposes."], "ans": "B", "expl": "By choosing a specific time frame where the fund outperformed due to unusual market conditions and not presenting a full view of the fund’s performance across different market conditions, Harper’s article fails to provide a fair and complete compari
