FCFF) for 2019. The best information he has points to an increase in sales of 6%. The earnings before interest and tax (EBIT) margin is not expected to change from the rate of 6.4% achieved in 2018. Fixed capital spending is expected to be $36,470. Investment in net working capital is expected to be $24,313. Moreover, Warner notes that the only noncash charge is depreciation, which he estimates will be $60,000.<\/p><p>Warner has been asked to analyze the effect each of the following corporate events, if taken during 2019, would have on GDW&#x27;s free cash flow to equity (FCFE):<\/p><p>20% increase in dividends per share. Repurchase of 25% of the firm&#x27;s outstanding shares using cash. New common share offering that would increase shares outstanding by 30%. New issue of convertible bonds that are not callable for five years and would increase the level of debt by 10%.<\/p><\/div><\/details><div class=\"qtext\"><p>Warner determines that on a per-share basis, the FCFE for GDW in 2018 is $0.19. Further analysis suggests that FCFE per share will grow by $0.02 in each of the next two years before leveling off to a long-term growth rate of 5%. The current value of one share of GDW&#x27;s equity is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 30, "q": "Which corporate event that Warner is analyzing is likely to have the largest effect on FCFE in 2019?", "opts": ["Share repurchase.", "Share offering.", "Convertible bond issue."], "ans": "C", "expl": "Dividends, share repurchases, and changes in the number of shares outstanding do not have an effect on either FCFE or FCFF. Therefore, only the new convertible debt offering will have a significant influence on the current level of FCFE because net borrowing changes FCFE. For Further Reference: (Study Session 11, Module 28.5, LOS 28.i)", "explhtml": "<p>Dividends, share repurchases, and changes in the number of shares outstanding do not have an effect on either FCFE or FCFF. Therefore, only the new convertible debt offering will have a significant influence on the current level of FCFE because net borrowing changes FCFE.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.5, LOS 28.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 25 through 30 relate to Equity Valuation.<\/p><p>Global Drug World Case Scenario<\/p><p>Carl Warner, CFA, has been asked to review the financial information of Global Drug World (GDW) in preparation for a possible takeover bid by rival competitor Consolidated Drugstores International (Consolidated). GDW has produced impressive results since going public via an initial public offering in 2008. Through a program of aggressive growth by acquisition, GDW is currently seen as a major player and a threat to Consolidated&#x27;s own plans for growth and profitability. In preparation for his analysis, Warner has gathered the following financial data from GDW&#x27;s year-end statements.<\/p><p>GDW Statement of Income for Year Ended May 31, 2018<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>4,052,173<\/td><\/tr><\/table><\/div><p>Expenses<\/p><p> Cost of goods sold, general and operating expenses 3,735,397<\/p><div class=\"tbl\"><table><tr><td> Noncash charges<\/td><td>56,293<\/td><\/tr><tr><td> Interest on long-term debt<\/td><td>20,265<\/td><\/tr><tr><td>Other interest<\/td><td>5,223<\/td><\/tr><tr><td>3,817,178<\/td><td><\/td><\/tr><tr><td>Income before income taxes<\/td><td>234,995<\/td><\/tr><tr><td>Income taxes<\/td><td>70,499<\/td><\/tr><tr><td>Net income<\/td><td>164,497<\/td><\/tr><tr><td>Earnings per share<\/td><td>0.72<\/td><\/tr><\/table><\/div><p>Partial GDW Balance Sheet on May 31, 2018<\/p><p>Assets<\/p><p>Current assets (excluding cash)<\/p><div class=\"tbl\"><table><tr><td> Accounts receivable<\/td><td>284,762<\/td><\/tr><tr><td> Inventories<\/td><td>490,755<\/td><\/tr><tr><td> Prepaid expenses<\/td><td>23,743<\/td><\/tr><tr><td>Total current assets (excluding cash)<\/td><td>799,260<\/td><\/tr><tr><td>Property, plant, and equipment<\/td><td>687,890<\/td><\/tr><tr><td>Other assets<\/td><td>236,417<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><p>Current liabilities (excluding notes payable)<\/p><div class=\"tbl\"><table><tr><td> Accounts payable and accrued liabilities<\/td><td>296,564<\/td><\/tr><tr><td> Other<\/td><td>100,039<\/td><\/tr><\/table><\/div><p> Total current liabilities (excluding notes payable) 396,603<\/p><div class=\"tbl\"><table><tr><td>Long-term debt<\/td><td>262,981<\/td><\/tr><tr><td>Other liabilities<\/td><td>15,484<\/td><\/tr><\/table><\/div><p>Additional Information<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>4.5%<\/td><\/tr><tr><td>WACC<\/td><td>7.5%<\/td><\/tr><tr><td>2018 working capital investment<\/td><td>$7,325<\/td><\/tr><tr><td>2018 dividends<\/td><td>$82,248<\/td><\/tr><tr><td>Beta<\/td><td>1.10<\/td><\/tr><tr><td>Investment in fixed capital in 2018<\/td><td>$143,579<\/td><\/tr><tr><td>Market risk premium<\/td><td>5%<\/td><\/tr><tr><td>Total equity May 31, 2017<\/td><td>$1,019,869<\/td><\/tr><tr><td>Principal repayment of long-term debt in 2018<\/td><td>$33,275<\/td><\/tr><tr><td>Notes payable issued in 2018<\/td><td>$5,866<\/td><\/tr><tr><td>2018 change in liabilities<\/td><td>$27,409<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>As part of his analysis, Warner needs to forecast the free cash flow to the firm (FCFF) for 2019. The best information he has points to an increase in sales of 6%. The earnings before interest and tax (EBIT) margin is not expected to change from the rate of 6.4% achieved in 2018. Fixed capital spending is expected to be $36,470. Investment in net working capital is expected to be $24,313. Moreover, Warner notes that the only noncash charge is depreciation, which he estimates will be $60,000.<\/p><p>Warner has been asked to analyze the effect each of the following corporate events, if taken during 2019, would have on GDW&#x27;s free cash flow to equity (FCFE):<\/p><p>20% increase in dividends per share. Repurchase of 25% of the firm&#x27;s outstanding shares using cash. New common share offering that would increase shares outstanding by 30%. New issue of convertible bonds that are not callable for five years and would increase the level of debt by 10%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which corporate event that Warner is analyzing is likely to have the largest effect on FCFE in 2019?<\/p><\/div>", "subj": "equity"}, {"n": 31, "q": "The free cash flow to equity for Schön AG for 20X9 is closest to:", "opts": ["€439 million.", "€488 million.", "€499 million."], "ans": "B", "expl": "FCFE = CFO − FCInv + net borrowings CFO = 1042 (given), net borrowings is change in long-term debt and notes payable FCInv = CF from investing = 648 FCFE = 1042 − 648 + [(2,070 + 644) − (2,020 + 600)] = €488 million Please note that CF from investing activities and FCInv may not be always the same, but in the curriculum (and for this question), they are treated as same. For Further Reference: (Study Session 11, Module 28.4, LOS 28.d)", "explhtml": "<div class=\"tbl\"><table><tr><td>FCFE<\/td><td>= CFO − FCInv + net borrowings<\/td><\/tr><tr><td>CFO<\/td><td>= 1042 (given), net borrowings is change in long-term debt and notes payable<\/td><\/tr><\/table><\/div><p>FCInv = CF from investing = 648<\/p><div class=\"tbl\"><table><tr><td>FCFE<\/td><td>= 1042 − 648 + [(2,070 + 644) − (2,020 + 600)] = €488 million<\/td><\/tr><\/table><\/div><p>Please note that CF from investing activities and FCInv may not be always the same, but in the curriculum (and for this question), they are treated as same.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.4, LOS 28.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Questions 31 through 36 relate to Equity Valuation.<\/p><p>Lee Nguyen Investments Case Scenario<\/p><p>Marie LeBlanc, CFA, is an analyst at Lee Nguyen Investments, an international equities investment firm. LeBlanc has been asked to value two European cosmetics companies, Schön AG and Hermosa S.A.<\/p><p>The beauty products industry is a mature industry with few competitors. One segment that is growing is luxury skin care; while the cosmetics industry is expected to grow at a steady rate of 3.5%, the luxury skin care segment is expected to grow at 5.5%.<\/p><p>Schön AG, based in Frankfurt, Germany, is the largest company in the luxury skin care segment of the cosmetics industry. Schön is considered a very stable company within the cosmetics industry and the luxury skin care segment. Schön&#x27;s equity beta is 1.00.<\/p><p>LeBlanc collects selected financial information from Schön&#x27;s income statement and cash flow statement (for the last fiscal year) and from Schön&#x27;s balance sheet (for the last two fiscal year ends). The information is shown in Exhibit 1. Negative numbers are indicated in parentheses. There is no preferred stock, and no long-term asset sales occurred in 20X9.<\/p><p><b>Exhibit 1: Selected Schön Financial Information (€ millions except for rates and ratios)<\/b><\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>20X9<\/td><td>Balance Sheet<\/td><td>20X8<\/td><td>20X9<\/td><\/tr><tr><td>Revenue<\/td><td>4,250<\/td><td>Total current assets<\/td><td>2,408 2,577<\/td><td><\/td><\/tr><tr><td>EBITDA<\/td><td>1,461<\/td><td>Net PPE<\/td><td>3,794 4,150<\/td><td><\/td><\/tr><tr><td>Operating income<\/td><td>1,169<\/td><td>Notes payable<\/td><td>600<\/td><td>644<\/td><\/tr><tr><td>Interest expense<\/td><td>Long-term debt<\/td><td>2,020 2,070<\/td><td><\/td><td><\/td><\/tr><tr><td>Income tax rate<\/td><td>30%<\/td><td>Total liabilities<\/td><td>3,210 3,378<\/td><td><\/td><\/tr><tr><td>Dividends<\/td><td>357<\/td><td>Total equity<\/td><td>2,992 3,349<\/td><td><\/td><\/tr><tr><td>Other Information<\/td><td>20X9<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from operations<\/td><td>1,042<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from investing<\/td><td>(648)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Risk-free rate<\/td><td>2.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>After-tax cost of debt 4.50%<\/p><div class=\"tbl\"><table><tr><td>Cost of equity<\/td><td>8.50%<\/td><\/tr><tr><td>Target D/E ratio<\/td><td>1.00<\/td><\/tr><\/table><\/div><p>Hermosa S.A., based in Barcelona, Spain, is the third largest company in the luxury skin care segment of the cosmetics industry. Hermosa is considered a growth company within the cosmetics industry and the luxury skin care segment. Hermosa has not issued bonds and all of Hermosa&#x27;s debt is considered short and intermediate term. For the fiscal year 20X9, FCFF is €143 million and FCFE is €136.23 million. Hermosa pays no dividends. Hermosa&#x27;s earnings are expected to grow at 14.0% for three years and then at the expected overall rate of growth in the luxury skin care segment. Hermosa&#x27;s equity beta is 1.20. The risk-free rate is 2.5%. Hermosa&#x27;s target weight for debt is 25.0%.<\/p><p>LeBlanc gathers additional information on the various companies in luxury skin care industry as shown in Exhibit 2.<\/p><p><b>Exhibit 2: Luxury Skin Care Stocks<\/b><\/p><p>Company Price Per Share Shares Outstanding (in Millions) Earnings (trailing 12 Months) (in Millions)<\/p><div class=\"tbl\"><table><tr><td>Schön<\/td><td>€15.42<\/td><td>1,000<\/td><td>€713<\/td><\/tr><tr><td>Epiderm<\/td><td>€14.95<\/td><td>500<\/td><td>€345<\/td><\/tr><tr><td>Hermosa<\/td><td>€22.78<\/td><td>200<\/td><td>€193<\/td><\/tr><tr><td>Radiance<\/td><td>€18.50<\/td><td>100<\/td><td>€75<\/td><\/tr><tr><td>Bello<\/td><td>€24.78<\/td><td>50<\/td><td>€24<\/td><\/tr><\/table><\/div><p>The trailing price-to-earnings ratio for the luxury skin care segment is 22.9X.<\/p><p>Elizabeth Nguyen, one of the partners at Lee Nguyen Investments, approaches LeBlanc about a client interested in buying Hermosa S.A. Nguyen asks LeBlanc about the different methods LeBlanc used to value Hermosa as a buyout possibility.<\/p><p>LeBlanc states that she used three different approaches in her report:<\/p><div class=\"tbl\"><table><tr><td>Approach 1:<\/td><td>Dividend discount model.<\/td><\/tr><tr><td>Approach 2:<\/td><td>Free cash flow to the firm model.<\/td><\/tr><tr><td>Approach 3:<\/td><td>Trailing price-to-earnings multiples.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The free cash flow to equity for Schön AG for 20X9 is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "Assuming that the growth rate of Schön earnings is equal to the overall cosmetics industry growth rate, the value of the firm is closest to:", "opts": ["€17.2 billion.", "€33.6 billion.", "€49.9 billion."], "ans": "A", "expl": "FCFF = CFO + Int(1 − tax rate) − FCInv = 1042 + 150(0.7) − 648 = €499 Overall growth rate for cosmetics industry = 3.5% Percentage Cost Debt 50% 4.50% Equity 50% 8.50% WACC 6.50% Cosmetics industry growth rate 3.50% € € For Further Reference: (Study Session 11, Module 28.5, LOS 28.i, 28.j)", "explhtml": "<p>FCFF = CFO + Int(1 − tax rate) − FCInv = 1042 + 150(0.7) − 648 = €499<\/p><p>Overall growth rate for cosmetics industry = 3.5%<\/p><div class=\"tbl\"><table><tr><td>Percentage<\/td><td>Cost<\/td><td><\/td><\/tr><tr><td>Debt<\/td><td>50%<\/td><td>4.50%<\/td><\/tr><tr><td>Equity<\/td><td>50%<\/td><td>8.50%<\/td><\/tr><tr><td>WACC<\/td><td>6.50%<\/td><td><\/td><\/tr><tr><td>Cosmetics industry growth rate<\/td><td>3.50%<\/td><td><\/td><\/tr><tr><td>€<\/td><td><\/td><td><\/td><\/tr><tr><td>€<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.5, LOS 28.i, 28.j)<\/p>", "qhtml": "<details cl erent approaches in her report:<\/p><div class=\"tbl\"><table><tr><td>Approach 1:<\/td><td>Dividend discount model.<\/td><\/tr><tr><td>Approach 2:<\/td><td>Free cash flow to the firm model.<\/td><\/tr><tr><td>Approach 3:<\/td><td>Trailing price-to-earnings multiples.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The estimated value of Hermosa stock using FCFE valuation is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "If the estimated value of Schön's equity based on free cash flow to equity is €17.1 billion, then based on current market price, Schön's stock is:", "opts": ["overvalued.", "undervalued.", "fairly valued."], "ans": "B", "expl": "Free cash flow to equity values Schön's stock at €17,100,000,000 / 1,000,000,000 or €17.10 per share. This is greater than the market price per share of €15.42; the stock is selling at a price below the implied value which means the stock is undervalued. For Further Reference: (Study Session 11, Module 28.5, LOS 28.m)", "explhtml": "<p>Free cash flow to equity values Schön&#x27;s stock at €17,100,000,000 / 1,000,000,000 or €17.10 per share. This is greater than the market price per share of €15.42; the stock is selling at a price below the implied value which means the stock is undervalued.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.5, LOS 28.m)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 31 through 36 relate to Equity Valuation.<\/p><p>Lee Nguyen Investments Case Scenario<\/p><p>Marie LeBlanc, CFA, is an analyst at Lee Nguyen Investments, an international equities investment firm. LeBlanc has been asked to value two European cosmetics companies, Schön AG and Hermosa S.A.<\/p><p>The beauty products industry is a mature industry with few competitors. One segment that is growing is luxury s /td><\/tr><tr><td>Approach 2:<\/td><td>Free cash flow to the firm model.<\/td><\/tr><tr><td>Approach 3:<\/td><td>Trailing price-to-earnings multiples.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>If the estimated value of Schön&#x27;s equity based on free cash flow to equity is €17.1 billion, then based on current market price, Schön&#x27;s stock is:<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Using the luxury skin care P/E ratio as the benchmark, Hermosa is best described as:", "opts": ["overvalued.", "undervalued.", "fairly valued."], "ans": "A", "expl": "The luxury skin care segment's price-to-earnings ratio is 22.9X. The trailing P/E ratio for Hermosa is €22.78 divided by the earnings per share of €193 / 200 or €0.97. Trailing P/E = €22.78 / €0.97 = 23.6X. Hermosa seems to be slightly overvalued relative to the segment. For Further Reference: (Study Session 11, Module 29.1, LOS 29.a)", "explhtml": "<p>The luxury skin care segment&#x27;s price-to-earnings ratio is 22.9X. The trailing P/E ratio for Hermosa is €22.78 divided by the earnings per share of €193 / 200 or €0.97. Trailing P/E = €22.78 / €0.97 = 23.6X. Hermosa seems to be slightly overvalued relative to the segment.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.1, LOS 29.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 31 through 36 relate to Equity Valuation.<\/p><p>Lee Nguyen Investments Case Scenario<\/p><p>Marie LeBlanc, CFA, is an analyst at Lee Nguyen Investments, an international equities investment firm. LeBlanc has been asked to value two European cosmetics companies, Schön AG and Hermosa S.A.<\/p><p>The beauty products industry is a mature industry with few competitors. One segment that is growing is luxury skin care; while the cosmetics industry is expected to grow at firm model.<\/td><\/tr><tr><td>Approach 3:<\/td><td>Trailing price-to-earnings multiples.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the luxury skin care P/E ratio as the benchmark, Hermosa is best described as:<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "The best approach to valuing Hermosa for a potential acquirer is most likely:", "opts": ["Approach #1—Dividend discount model.", "Approach #2—Free cash flow to the firm model.", "Approach #3—Trailing price-to-earnings multiples."], "ans": "B", "expl": "Approach #2 is the best. The free cash flow to firm approach takes a control perspective in valuation as is appropriate in a buyout. Dividend discount models take a minority perspective, and Hermosa does not pay dividends so Approach #1 is unsuitable. Relative valuation approaches, such as trailing P/E, also focus on market price and hence are based on minority investor perspective. For Further Reference: (Study Session 11, Module 28.1, LOS 28.a)", "explhtml": "<p>Approach #2 is the best. The free cash flow to firm approach takes a control perspective in valuation as is appropriate in a buyout. Dividend discount models take a minority perspective, and Hermosa does not pay dividends so Approach #1 is unsuitable. Relative valuation approaches, such as trailing P/E, also focus on market price and hence are based on minority investor perspective.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.1, LOS 28.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 31 through 36 relate to Equity Valuation.<\/p><p>Lee Nguyen Investments Case Scenario<\/p><p>Marie LeBlanc, CFA, is an analyst at Lee Nguyen Investments, an international equities investment firm. LeBlanc has been asked to value two European cosmetics companies, Schön AG and Hermosa S.A.<\/p><p>The beauty products industry is a mature industry with few competitors. One segment that is growing is luxury skin care; while the cosmetics industry is expected to grow at a steady rate of 3.5%, the luxury skin care segment is expected to grow at 5.5%.<\/p><p>Schön AG, based in Frankfurt, Germany, is the largest company in the luxury skin care segment of the cosmetics industry. Schön is considered a very stable company within the cosmetics industry and the luxury skin care segment. Schön&#x27;s equity beta is 1.00.<\/p><p>LeBlanc collects selected financial information from Schön&#x27;s income statement and cash flow statement (for the last fiscal year) and from Schön&#x27;s balance sheet (for the last two fiscal year ends). The information is shown in Exhibit 1. Negative numbers are indicated in parentheses. There is no preferred stock, and no long-term asset sales occurred in 20X9.<\/p><p><b>Exhibit 1: Selected Schön Financial Information (€ millions except for rates and ratios)<\/b><\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>20X9<\/td><td>Balance Sheet<\/td><td>20X8<\/td><td>20X9<\/td><\/tr><tr><td>Revenue<\/td><td>4,250<\/td><td>Total current assets<\/td><td>2,408 2,577<\/td><td><\/td><\/tr><tr><td>EBITDA<\/td><td>1,461<\/td><td>Net PPE<\/td><td>3,794 4,150<\/td><td><\/td><\/tr><tr><td>Operating income<\/td><td>1,169<\/td><td>Notes payable<\/td><td>600<\/td><td>644<\/td><\/tr><tr><td>Interest expense<\/td><td>Long-term debt<\/td><td>2,020 2,070<\/td><td><\/td><td><\/td><\/tr><tr><td>Income tax rate<\/td><td>30%<\/td><td>Total liabilities<\/td><td>3,210 3,378<\/td><td><\/td><\/tr><tr><td>Dividends<\/td><td>357<\/td><td>Total equity<\/td><td>2,992 3,349<\/td><td><\/td><\/tr><tr><td>Other Information<\/td><td>20X9<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from operations<\/td><td>1,042<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from investing<\/td><td>(648)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Risk-free rate<\/td><td>2.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>After-tax cost of debt 4.50%<\/p><div class=\"tbl\"><table><tr><td>Cost of equity<\/td><td>8.50%<\/td><\/tr><tr><td>Target D/E ratio<\/td><td>1.00<\/td><\/tr><\/table><\/div><p>Hermosa S.A., based in Barcelona, Spain, is the third largest company in the luxury skin care segment of the cosmetics industry. Hermosa is considered a growth company within the cosmetics industry and the luxury skin care segment. Hermosa has not issued bonds and all of Hermosa&#x27;s debt is considered short and intermediate term. For the fiscal year 20X9, FCFF is €143 million and FCFE is €136.23 million. Hermosa pays no dividends. Hermosa&#x27;s earnings are expected to grow at 14.0% for three years and then at the expected overall rate of growth in the luxury skin care segment. Hermosa&#x27;s equity beta is 1.20. The risk-free rate is 2.5%. Hermosa&#x27;s target weight for debt is 25.0%.<\/p><p>LeBlanc gathers additional information on the various companies in luxury skin care industry as shown in Exhibit 2.<\/p><p><b>Exhibit 2: Luxury Skin Care Stocks<\/b><\/p><p>Company Price Per Share Shares Outstanding (in Millions) Earnings (trailing 12 Months) (in Millions)<\/p><div class=\"tbl\"><table><tr><td>Schön<\/td><td>€15.42<\/td><td>1,000<\/td><td>€713<\/td><\/tr><tr><td>Epiderm<\/td><td>€14.95<\/td><td>500<\/td><td>€345<\/td><\/tr><tr><td>Hermosa<\/td><td>€22.78<\/td><td>200<\/td><td>€193<\/td><\/tr><tr><td>Radiance<\/td><td>€18.50<\/td><td>100<\/td><td>€75<\/td><\/tr><tr><td>Bello<\/td><td>€24.78<\/td><td>50<\/td><td>€24<\/td><\/tr><\/table><\/div><p>The trailing price-to-earnings ratio for the luxury skin care segment is 22.9X.<\/p><p>Elizabeth Nguyen, one of the partners at Lee Nguyen Investments, approaches LeBlanc about a client interested in buying Hermosa S.A. Nguyen asks LeBlanc about the different methods LeBlanc used to value Hermosa as a buyout possibility.<\/p><p>LeBlanc states that she used three different approaches in her report:<\/p><div class=\"tbl\"><table><tr><td>Approach 1:<\/td><td>Dividend discount model.<\/td><\/tr><tr><td>Approach 2:<\/td><td>Free cash flow to the firm model.<\/td><\/tr><tr><td>Approach 3:<\/td><td>Trailing price-to-earnings multiples.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The best approach to valuing Hermosa for a potential acquirer is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Based on Lear's analysis, Taylor's stock is most likely to be:", "opts": ["correctly valued.", "overvalued.", "undervalued."], "ans": "B", "expl": "Since the required return (12%) as determined by CAPM is greater than Lear's expected return (10%), then Taylor's stock is overvalued. For Further Reference: (Study Session 9, Module 25.1, LOS 25.a)", "explhtml": "<p>Since the required return (12%) as determined by CAPM is greater than Lear&#x27;s expected return (10%), then Taylor&#x27;s stock is overvalued.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 9, Module 25.1, LOS 25.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Amie Lear Case Scenario<\/p><p>Amie Lear, CFA, is a quantitative analyst employed by a brokerage firm. She has been assigned by her supervisor to cover a number of different equity and debt investments. One of the investments is Taylor, Inc. (Taylor), a manufacturer of a wide range of children&#x27;s toys. Based on her extensive analysis, she determines that her expected return on the stock, given Taylor&#x27;s risks, is 10%. In applying the capital asset pricing model (CAPM), the result is a 12% rate of return.<\/p><p>For her analysis of the returns of Devon, Inc. (Devon), a manufacturer of high-end sports apparel, Lear intends to use the Fama-French model (FFM). Devon is a small-cap growth stock that has traded at a low market-to-book value in recent years. Lear&#x27;s analysis has provided a wealth of quantitative information to consider. The return on a value-weighted market index minus the risk-free rate is 5.5%, the small-cap return premium is 3.1%, the value return premium is 2.2%, and the liquidity premium is 3.3%. The risk-free rate is 3.4%. The market, size, relative value, and liquidity betas for Devon are 0.7, –0.3, 1.4, and 1.2, respectively. In estimating the appropriate equity risk premium, Lear has chosen to use the Gordon growth model.<\/p><p>Lear&#x27;s assistant, Doug Saunders, presents her with a report on macroeconomic multifactor models that includes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Business cycle risk represents the unexpected change in the difference between the return of<\/td><\/tr><tr><td>risky corporate bonds and government bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Confidence risk represents the unexpected change in the level of real business activity.<\/td><\/tr><\/table><\/div><p>Lear is also attempting to determine the most appropriate method for determining the required return for Densmore, Inc. (Densmore), a closely held company that is considering a debt issue within the next year. The company has not previously issued debt securities to the public, relying instead on bank financing. She realizes that there are a number of models to consider, including the CAPM, multifactor models, and build-up models.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Lear&#x27;s analysis, Taylor&#x27;s stock is most likely to be:<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "According to the FFM, the estimate of the required return for Devon is closest to:", "opts": ["9.4%.", "11.8%.", "13.4%."], "ans": "A", "expl": "Required return under FFM = risk-free rate + market beta (equity risk premium) + size beta (small-cap return premium) + value beta (value-return premium) = 3.4% + 0.7(5.5%) + –0.3(3.1%) + 1.4(2.2%) = 9.4% Note: The liquidity factor is only applicable to the Pastor-Stambaugh (PS) model. The PS model is otherwise the same as the FFM, save for the addition of the liquidity factor. For Further Reference: (Study Session 9, Module 25.1, LOS 25.d)", "explhtml": "<p>Required return under FFM = risk-free rate + market beta (equity risk premium) + size beta (small-cap return premium) + value beta (value-return premium)<\/p><p>= 3.4% + 0.7(5.5%) + –0.3(3.1%) + 1.4(2.2%) = 9.4%<\/p><p>Note: The liquidity factor is only applicable to the Pastor-Stambaugh (PS) model. The PS model is otherwise the same as the FFM, save for the addition of the liquidity factor.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 9, Module 25.1, LOS 25.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Amie Lear Case Scenario<\/p><p>Amie Lear, CFA, is a quantitative analyst employed by a brokerage firm. She has been assigned by her supervisor to cover a number of different equity and debt investments. One of the investments is Taylor, Inc. (Taylor), a manufacturer of a wide range of children&#x27;s toys. Based on her extensive analysis, she determines that her expected return on the stock, given Taylor&#x27;s risks, is 10%. In applying the capital asset pricing model (CAPM), the result is a 12% rate of return.<\/p><p>For her analysis of the returns of Devon, Inc. (Devon), a manufacturer of high-end sports apparel, Lear intends to use the Fama-French model (FFM). Devon is a small-cap growth stock that has traded at a low market-to-book value in recent years. Lear&#x27;s analysis has provided a wealth of quantitative information to consider. The return on a value-weighted market index minus the risk-free rate is 5.5%, the small-cap return premium is 3.1%, the value return premium is 2.2%, and the liquidity premium is 3.3%. The risk-free rate is 3.4%. The market, size, relative value, and liquidity betas for Devon are 0.7, –0.3, 1.4, and 1.2, respectively. In estimating the appropriate equity risk premium, Lear has chosen to use the Gordon growth model.<\/p><p>Lear&#x27;s assistant, Doug Saunders, presents her with a report on macroeconomic multifactor models that includes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Business cycle risk represents the unexpected change in the difference between the return of<\/td><\/tr><tr><td>risky corporate bonds and government bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Confidence risk represents the unexpected change in the level of real business activity.<\/td><\/tr><\/table><\/div><p>Lear is also attempting to determine the most appropriate method for determining the required return for Densmore, Inc. (Densmore), a closely held company that is considering a debt issue within the next year. The company has not previously issued debt securities to the public, relying instead on bank financing. She realizes that there are a number of models to consider, including the CAPM, multifactor models, and build-up models.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the FFM, the estimate of the required return for Devon is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 39, "q": "Lear's choice of the Gordon growth model is an example of which of the following types of estimates of the equity risk premium?", "opts": ["Historical estimate.", "Forward-looking estimate.", "Macroeconomic model estimate."], "ans": "B", "expl": "The Gordon growth model is a popular method to generate forward-looking estimates using current information and expectations concerning economic and financial variables. A historical estimate of the equity risk premium consists of the difference between the historical mean return for a broad- based equity market index and a risk-free rate over a given time period. A macroeconomic model estimate of the equity risk premium is based on the relationships between macroeconomic variables and financial variables. For Further Reference: (Study Session 9, Module 25.1, LOS 25.b, 25.c, 25.d)", "explhtml": "<p>The Gordon growth model is a popular method to generate forward-looking estimates using current information and expectations concerning economic and financial variables.<\/p><p>A historical estimate of the equity risk premium consists of the difference between the historical mean return for a broad- based equity market index and a risk-free rate over a given time period.<\/p><p>A macroeconomic model estimate of the equity risk premium is based on the relationships between macroeconomic variables and financial variables.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 9, Module 25.1, LOS 25.b, 25.c, 25.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Amie Lear Case Scenario<\/p><p>Amie Lear, CFA, is a quantitative analyst employed by a brokerage firm. She has been assigned by her supervisor to cover a number of different equity and debt investments. One of the investments is Taylor, Inc. (Taylor), a manufacturer of a wide range of children&#x27;s toys. Based on her extensive analysis, she determines that her expected return on the stock, given Taylor&#x27;s risks, is 10%. In applying the capital asset pricing model (CAPM), the result is a 12% rate of return.<\/p><p>For her analysis of the returns of Devon, Inc. (Devon), a manufacturer of high-end sports apparel, Lear intends to use the Fama-French model (FFM). Devon is a small-cap growth stock that has traded at a low market-to-book value in recent years. Lear&#x27;s analysis has provided a wealth of quantitative information to consider. The return on a value-weighted market index minus the risk-free rate is 5.5%, the small-cap return premium is 3.1%, the value return premium is 2.2%, and the liquidity premium is 3.3%. The risk-free rate is 3.4%. The market, size, relative value, and liquidity betas for Devon are 0.7, –0.3, 1.4, and 1.2, respectively. In estimating the appropriate equity risk premium, Lear has chosen to use the Gordon growth model.<\/p><p>Lear&#x27;s assistant, Doug Saunders, presents her with a report on macroeconomic multifactor models that includes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Business cycle risk represents the unexpected change in the difference between the return of<\/td><\/tr><tr><td>risky corporate bonds and government bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Confidence risk represents the unexpected change in the level of real business activity.<\/td><\/tr><\/table><\/div><p>Lear is also attempting to determine the most appropriate method for determining the required return for Densmore, Inc. (Densmore), a closely held company that is considering a debt issue within the next year. The company has not previously issued debt securities to the public, relying instead on bank financing. She realizes that there are a number of models to consider, including the CAPM, multifactor models, and build-up models.<\/p><\/div><\/details><div class=\"qtext\"><p>Lear&#x27;s choice of the Gordon growth model is an example of which of the following types of estimates of the equity risk premium?<\/p><\/div>", "subj": "equity"}, {"n": 40, "q": "Which of the following approaches/methods is most appropriate for Lear to consider in determining the required return for Densmore?", "opts": ["Build-up method.", "Risk premium approach.", "Bond-yield plus risk premium method."], "ans": "A", "expl": "The build-up method is usually applied to closely held companies (such as Densmore) where betas are not readily obtainable. The risk premium approach requires betas for its calculations; betas are generally not readily available for closely held companies. The bond-yield plus risk premium method is appropriate only if the company has publicly traded debt. The method simply adds a risk premium to the yield to maturity of the company's long-term debt. For Further Reference: (Study Session 9, Module 25.1, LOS 25.d)", "explhtml": "<p>The build-up method is usually applied to closely held companies (such as Densmore) where betas are not readily obtainable.<\/p><p>The risk premium approach requires betas for its calculations; betas are generally not readily available for closely held companies.<\/p><p>The bond-yield plus risk premium method is appropriate only if the company has publicly traded debt. The method simply adds a risk premium to the yield to maturity of the company&#x27;s long-term debt.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 9, Module 25.1, LOS 25.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Amie Lear Case Scenario<\/p><p>Amie Lear, CFA, is a quantitative analyst employed by a brokerage firm. She has been assigned by her supervisor to cover a number of different equity and debt investments. One of the investments is Taylor, Inc. (Taylor), a manufacturer of a wide range of children&#x27;s toys. Based on her extensive analysis, she determines that her expected return on the stock, given Taylor&#x27;s risks, is 10%. In applying the capital asset pricing model (CAPM), the result is a 12% rate of return.<\/p><p>For her analysis of the returns of Devon, Inc. (Devon), a manufacturer of high-end sports apparel, Lear intends to use the Fama-French model (FFM). Devon is a small-cap growth stock that has traded at a low market-to-book value in recent years. Lear&#x27;s analysis has provided a wealth of quantitative information to consider. The return on a value-weighted market index minus the risk-free rate is 5.5%, the small-cap return premium is 3.1%, the value return premium is 2.2%, and the liquidity premium is 3.3%. The risk-free rate is 3.4%. The market, size, relative value, and liquidity betas for Devon are 0.7, –0.3, 1.4, and 1.2, respectively. In estimating the appropriate equity risk premium, Lear has chosen to use the Gordon growth model.<\/p><p>Lear&#x27;s assistant, Doug Saunders, presents her with a report on macroeconomic multifactor models that includes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Business cycle risk represents the unexpected change in the difference between the return of<\/td><\/tr><tr><td>risky corporate bonds and government bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Confidence risk represents the unexpected change in the level of real business activity.<\/td><\/tr><\/table><\/div><p>Lear is also attempting to determine the most appropriate method for determining the required return for Densmore, Inc. (Densmore), a closely held company that is considering a debt issue within the next year. The company has not previously issued debt securities to the public, relying instead on bank financing. She realizes that there are a number of models to consider, including the CAPM, multifactor models, and build-up models.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following approaches/methods is most appropriate for Lear to consider in determining the required return for Densmore?<\/p><\/div>", "subj": "equity"}, {"n": 41, "q": "Are Saunders's statements regarding the macroeconomic multifactor models correct?", "opts": ["Both statements are incorrect.", "Only Statement 1 is correct.", "Only Statement 2 is correct."], "ans": "A", "expl": dity premium is 3.3%. The risk-free rate is 3.4%. The market, size, relative value, and liquidity betas for Devon are 0.7, –0.3, 1.4, and 1.2, respectively. In estimating the appropriate equity risk premium, Lear has chosen to use the Gordon growth model.<\/p><p>Lear&#x27;s assistant, Doug Saunders, presents her with a report on macroeconomic multifactor models that includes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Business cycle risk represents the unexpected change in the difference between the return of<\/td><\/tr><tr><td>risky corporate bonds and government bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Confidence risk represents the unexpected change in the level of real business activity.<\/td><\/tr><\/table><\/div><p>Lear is also attempting to determine the most appropriate method for determining the required return for Densmore, Inc. (Densmore), a closely held company that is considering a debt issue within the next year. The company has not previously issued debt securities to the public, relying instead on bank financing. She realizes that there are a number of models to consider, including the CAPM, multifactor models, and build-up models.<\/p><\/div><\/details><div class=\"qtext\"><p>Are Saunders&#x27;s statements regarding the macroeconomic multifactor models correct?<\/p><\/div>", "subj": "equity"}, {"n": 42, "q": "Which of the following statements regarding the models used to estimate the required return is most accurate?", "opts": ["A strength of the capital asset pricing model (CAPM) is that it usually has high explanatory power.", "A strength of multifactor models is their relative simplicity and ease of calculation.", "A weakness of build-up models is that they typically use historical values as estimates that may not be relevant to current market conditions."], "ans": "C", "expl": "A weakness (not strength) of the CAPM is its low explanatory power in some cases. Multifactor models usually have higher explanatory power than the CAPM since they use more than one factor, whereas CAPM uses only one factor. A weakness (not strength) of multifactor models is that they are typically more complex to use. For Further Reference: (Study Session 9, Module 25.1, LOS 25.f)", "explhtml": "<p>A weakness (not strength) of the CAPM is its low explanatory power in some cases. Multifactor models usually have higher explanatory power than the CAPM since they use more than one factor, whereas CAPM uses only one factor. A weakness (not strength) of multifactor models is that they are typically more complex to use.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 9, Module 25.1, LOS 25.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Amie Lear Case Scenario<\/p><p>Amie Lear, CFA, is a quantitative analyst employed by a brokerage firm. She has been assigned by her supervisor to cover a number of different equity and debt investments. One of the investments is Taylor, Inc. (Taylor), a manufacturer of a wide range of children&#x27;s toys. Based on her extensive analysis, she determines that her expected return on the stock, given Taylor&#x27;s risks, is 10%. In applying the capital asset pricing model (CAPM), the result is a 12% rate of return.<\/p><p>For her analysis of the returns of Devon, Inc. (Devon), a manufacturer of high-end sports apparel, Lear intends to use the Fama-French model (FFM). Devon is a small-cap growth stock that has traded at a low market-to-book value in recent years. Lear&#x27;s analysis has provided a wealth of quantitative information to consider. The return on a value-weighted market index minus the risk-free rate is 5.5%, the small-cap return premium is 3.1%, the value return premium is 2.2%, and the liquidity premium is 3.3%. The risk-free rate is 3.4%. The market, size, relative value, and liquidity betas for Devon are 0.7, –0.3, 1.4, and 1.2, respectively. In estimating the appropriate equity risk premium, Lear has chosen to use the Gordon growth model.<\/p><p>Lear&#x27;s assistant, Doug Saunders, presents her with a report on macroeconomic multifactor models that includes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Business cycle risk represents the unexpected change in the difference between the return of<\/td><\/tr><tr><td>risky corporate bonds and government bonds.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Confidence risk represents the unexpected change in the level of real business activity.<\/td><\/tr><\/table><\/div><p>Lear is also attempting to determine the most appropriate method for determining the required return for Densmore, Inc. (Densmore), a closely held company that is considering a debt issue within the next year. The company has not previously issued debt securities to the public, relying instead on bank financing. She realizes that there are a number of models to consider, including the CAPM, multifactor models, and build-up models.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements regarding the models used to estimate the required return is most accurate?<\/p><\/div>", "subj": "equity"}, {"n": 43, "q": "Using the information in Exhibit 1, the three-year spot rate is closest to:", "opts": ["2.26%.", "2.56%.", "2.62%."], "ans": "A", "expl": "We have to bootstrap the three-year spot rate (S ) given the par curve. 3 S = par rate for a one-year bond = 1.50%. 1 Hence, (1 + S ) = 102 / 98.03 = 1.04 and S = 2.005% 2 2 2 Hence, (1+S ) = 102.25 / 95.62 = 1.0693 and S = 2.259% 3 3 3 For Further Reference: (Study Session 12, Module 32.1, LOS 32.c)", "explhtml": "<p>We have to bootstrap the three-year spot rate (S ) given the par curve. 3<\/p><p>S  = par rate for a one-year bond = 1 uestions:<\/p><div class=\"tbl\"><table><tr><td>Question 1:<\/td><td>Which bond in Exhibit 3 is most likely to exhibit negative convexity?<\/td><\/tr><tr><td>Question 2:<\/td><td>For a given decline in interest rate, which bond is most likely to have lower upside potential?<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1, the three-year spot rate is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 44, "q": "Using the information in Exhibit 1, the one-year forward rate two years from now is closest to:", "opts": ["2.25%.", "2.39%.", "2.77%."], "ans": "C", "expl": "From the earlier computations, we know that S = 2.005% and S = 2.259%. 2 3 [1+f(2,1)] = (1 + S ) / (1 + S ) 1 3 2 3 2 [1+f(2,1)] = (1.02259) / (1.02005) = 1.0277 → f(2,1) = 2.77% For Further Reference: (Study Session 12, Module 32.1, LOS 32.c)", "explhtml": "<p>From the earlier computations, we know that S  = 2.005% and S  = 2.259%.<\/p><div class=\"tbl\"><table><tr><td>2<\/td><td>3<\/td><td><\/td><td><\/td><\/tr><tr><td>[1+f(2,1)]  = (1 + S )  / (1 + S )<\/td><td>1<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>2<\/td><td><\/td><td><\/td><\/tr><tr><td>[1+f(2,1)]  = (1.02259)  / (1.02005)  = 1.0277 → f(2,1) = 2.77%<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.1, LOS 32.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 43 through 48 relate to Fixed Income.<\/p><p>Apex Bank NA Case Scenario<\/p><p>Ranjit Dhami has just joined Apex Bank NA as an intern in the bond trading department. Sue Jorgenson, Dhami&#x27;s immediate supervisor, provides him with the current par rate curve for government bonds shown in Exhibit 1.<\/p><p><b>Exhibit 1: Selected Par Rates<\/b><\/p><p>Maturity Par Rate<\/p><div class=\" n on Potential Trades<\/b><\/p><div class=\"tbl\"><table><tr><td>Characteristic<\/td><td>Bond A<\/td><td>Bond B<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><tr><td>Option<\/td><td>Callable at par at t = 1 year Putable at par at t = 1 year<\/td><td><\/td><\/tr><tr><td>Coupon<\/td><td>2%<\/td><td>1.50%<\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><\/table><\/div><p>Stamper asks Dhami the following questions:<\/p><div class=\"tbl\"><table><tr><td>Question 1:<\/td><td>Which bond in Exhibit 3 is most likely to exhibit negative convexity?<\/td><\/tr><tr><td>Question 2:<\/td><td>For a given decline in interest rate, which bond is most likely to have lower upside potential?<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The most accurate answers to Stamper&#x27;s questions are:<\/p><div class=\"tbl\"><table><tr><td>Question 1<\/td><td>Question 2<\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 48, "q": "Using the rates in Exhibit 2 and the information in Exhibit 3, the value of bond A is closest to:", "opts": ["$90.63.", "$95.68.", "$99.28."], "ans": "C", "expl": "Note that the option was never exercised. For Further Reference: (Study Session 13, Module 34.2, LOS 34.c)", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v2exam2am-002.webp\" style=\"max-width:min(100%,295px)\" alt=\"\"><p>Note that the option was never exercised.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.2, LOS 34.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 43 through 48 relate to Fixed Income.<\/p><p>Apex Bank NA Case Scenario<\/p><p>Ranjit Dhami has just joined Apex Bank NA as an intern in the bond trading department. Sue Jorgenson, Dhami&#x27;s immediate supervisor, provides him with the current par ra factors = 0.9840 + 0.9662 = 1.9502 new SFR = [(1 – 0.9662) / 1.9502] × (360/180) = 3.47% value (payer) = (0.0347 – 0.0325) × (180 / 360) × (1.9502) × ($15,000,000) = $31,639. For Further Reference: (Study Session 14, Module 37.7, LOS 37.d)", "explhtml": "<p>new 180-day discount factor = 1 / [1 + (0.0325 × 180 / 360)] = 1 / 1.01625 = 0.9840.<\/p><p>new 360-day discount factor = 1 / [1 + (0.035 × 360 / 360)] = 1 / 1.035 = 0.9662.<\/p><p>sum of the discount factors = 0.9840 + 0.9662 = 1.9502<\/p><p>new SFR = [(1 – 0.9662) / 1.9502] × (360/180) = 3.47%<\/p><p>value (payer) = (0.0347 – 0.0325) × (180 / 360) × (1.9502) × ($15,000,000) = $31,639.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.7, LOS 37.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<\/summary><div class=\"vig-body\"><p>Questions 49 through 54 relate to Derivatives.<\/p><p>Zion Investments, LLC, Case Scenario<\/p><p>Randy Carson is the chief information officer of Zion Investments, LLC, an independent investment company. Carson has asked Jane Walsinzki, a senior derivatives analyst for Zion, for information on several outstanding contract positions. Walsinzki prepares a report outlining relevant information about the various derivatives.<\/p><p>Walsinzki&#x27;s report first identifies that the firm has a payer positon in a two-year, semiannual, 3.25% fixed interest rate swap with a notional of $15 million. The second settlement just occurred. Current 180-day and 360-day LIBOR are 3.25% and 3.50%, respectively.<\/p><p>The report also identifies a two-year, semi-annual USD-for-EUR currency swap with a notional of €1 million. When the swap was initiated, the USD and EUR fixed rates were 3% and 2%, respectively. The exchange rate has changed from €/$ 0.9091 at inception to €/$ 0.8929 currently.<\/p><p>Furthermore, the report outlines that the firm holds a call option on a Eurodollar futures contract. This ment company. Carson has asked Jane Walsinzki, a senior derivatives analyst for Zion, for information on several outstanding contract positions. Walsinzki prepares a report outlining relevant information about the various derivatives.<\/p><p>Walsinzki&#x27;s report first identifies that the firm has a payer positon in a two-year, semiannual, 3.25% fixed interest rate swap with a notional of $15 million. The second settlement just occurred. Current 180-day and 360-day LIBOR are 3.25% and 3.50%, respectively.<\/p><p>The report also identifies a two-year, semi-annual USD-for-EUR currency swap with a notional of €1 million. When the swap was initiated, the USD and EUR fixed rates were 3% and 2%, respectively. The exchange rate has changed from €/$ 0.9091 at inception to €/$ 0.8929 currently.<\/p><p>Furthermore, the report outlines that the firm holds a call option on a Eurodollar futures contract. This position was established to hedge another position of the firm, but Walsinzki could not identify the position that was being hedged.<\/p><p>Finally, the report identifies a long position in a forward contract on 10,000 shares of Specialty Retail, Inc.<\/p><p>Carson and Walsinzki then discuss the mechanics of forward pricing and the possibility of arbitrage involving foreign currencies. Walsinzki uses the Hungarian forint (Ft) versus the euro (€) as an example. The spot rate is Ft/€ 325.61 while the 90-day forward price is Ft/€ 329.40. Exhibit 1 provides additional information.<\/p><p><b>Exhibit 1: Hungary and eurozone outlook over the next 90 days (rates are annualized)<\/b><\/p><p>Hungary Eurozone<\/p><div class=\"tbl\"><table><tr><td>Expected inflation<\/td><td>2.30%<\/td><td>0.25%<\/td><\/tr><tr><td>Risk-free interest rate<\/td><td>3.45%<\/td><td>1.25%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The fixed USD payment in the currency swap is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 51, "q": "The call option on Eurodollar futures is most likely being used to hedge:", "opts": ["a floating rate liability.", "a long position in a floating rate note.", "a long position in a fixed rate bond."], "ans": "B", "expl": "Eurodollar futures contracts are cash settled contracts on LIBOR. Futures prices are inversely related to LIBOR. Call options on Eurodollar futures increase in value when interest rates fall, and hence, can be used to hedge a floating rate asset. For Further Reference: (Study Session 14, Module 38.6, LOS 38.i)", "explhtml": "<p>Eurodollar futures contracts are cash settled contracts on LIBOR. Futures prices are inversely related to LIBOR. Call options on Eurodollar futures increase in value when interest rates fall, and hence, can be used to hedge a floating rate asset.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.6, LOS 38.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 49 through 54 relate to Derivatives.<\/p><p>Zion Investments, LLC, Case Scenario<\/p><p>Randy Carson is the chief information officer of Zion Investments, LLC, an independent investment company. Carson has asked Jane Walsinzki, a senior derivatives analyst for Zion, for information on several outstanding contract positions. Walsinzki prepares a report outlining relevant information about the various derivatives.<\/p><p>Walsinzki&#x27;s report first identifies that the firm has a payer positon in a two-year, semiannual, 3.25% fixed interest rate swap with a notional of $15 million. The second settlement just occurred. Current 180-day and 360-day LIBOR are 3.25% and 3.50%, respectively.<\/p><p>The report also identifies a two-year, semi-annual USD-for-EUR currency swap with a notional of €1 million. When the swap was initiated, the USD and EUR fixed rates were 3% and 2%, respectively. The exchange rate has changed from €/$ 0.9091 at inception to €/$ 0.8929 currently.<\/p><p>Furthermore, the report outlines that the firm holds a call option on a Eurodollar futures contract. This position was established to hedge another position of the firm, but Walsinzki could not identify the position that was being hedged.<\/p><p>Finally, the report identifies a long position in a forward contract on 10,000 shares of Specialty Retail, Inc.<\/p><p>Carson and Walsinzki then discuss the mechanics of forward pricing and the possibility of arbitrage involving foreign currencies. Walsinzki uses the Hungarian forint (Ft) versus the euro (€) as an example. The spot rate is Ft/€ 325.61 while the 90-day forward price is Ft/€ 329.40. Exhibit 1 provides additional information.<\/p><p><b>Exhibit 1: Hungary and eurozone outlook over the next 90 days (rates are annualized)<\/b><\/p><p>Hungary Eurozone<\/p><div class=\"tbl\"><table><tr><td>Expected inflation<\/td><td>2.30%<\/td><td>0.25%<\/td><\/tr><tr><td>Risk-free interest rate<\/td><td>3.45%<\/td><td>1.25%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The call option on Eurodollar futures is most likely being used to hedge:<\/p><\/div>", "subj": "derivatives"}, {"n": 52, "q": "Regarding the long forward position in Specialty Retail, Inc., the position is most likely to lose value as a result of:", "opts": ["an increase in the risk-free rate.", "an increase in the current stock price of Specialty Retail.", "an extra dividend payment during the contract interval."], "ans": "C", "expl": "Long forward contract positions increase in value when the forward price increases. Forward price is positively related to the spot price, time to maturity, and risk-free rate. Equity forward price is negatively related to dividend yield. An extra dividend payment during the contract interval would reduce the forward price and lead to a decline in the value of a long forward position. For Further Reference: (Study Session 14, Module 37.2, LOS 37.a, 37.b)", "expl  "derivatives"}, {"n": 54, "q": "Regarding Carson's question about mechanics of forward pricing, Walsinzki would most accurately state that forward prices are set such that:", "opts": ["the market value of the contract at inception is 0.", "the forward price is higher than the spot price by the expected return on the underlying.", "the forward price is lower than the spot price by the dividend yield on the underlying."], "ans": "A", "expl": "Forward prices are set so the market value of the contract at inception is zero. Using the cost of carry model, forward price equals spot price plus net cost of carry. For an equity forward contract, net cost of carry equals risk-free rate minus dividend yield. For Further Reference: (Study Session 14, Module 37.2, LOS 37.a)", "explhtml": "<p>Forward prices are set so the market value of the contract at inception is zero. Using the cost of carry model, forward price equals spot price plus net cost of carry. For an equity forward contract, net cost of carry equals risk-free rate minus dividend yield.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.2, LOS 37.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 49 through 54 relate to Derivatives.<\/p><p>Zion Investments, LLC, Case Scenario<\/p><p>Randy Carson is the chief information officer of Zion Investments, LLC, an independent investment company. Carson has asked Jane Walsinzki, a senior derivatives analyst for Zion, for information on several outstanding contract positions. Walsinzki prepares a report outlining relevant information about the various derivatives.<\/p><p>Walsinzki&#x27;s report first identifies that the firm has a payer positon in a two-year, semiannual, 3.25% fixed interest rate swap with a notional of $15 million. The second settlement just occurred. Current 180-day and  is 0.87, and the risk-free rate is 4%. He is considering buying two-period European style options on Arbor Industries with a strike price of $40. The delta of these options over the first period is 0.83.<\/p><p>Loper is curious about the effect of time on the value of the calls in the binomial model, so he also calculates the value of a one-period European style call option on Arbor stock with a strike price of 40.<\/p><p>Loper is also interested in using the BSM model to price European and American call and put options. He is concerned, however, whether the assumptions necessary to derive the model are realistic. The assumptions he is particularly concerned about are:<\/p><p>The volatility of the option value is known and constant. Stock returns are lognormally distributed. The continuous risk-free rate is known and constant.<\/p><p>Loper would also like to value options on Rapid Repair, Inc., common stock, but Rapid pays dividends, so Loper is uncertain what the effect will be on the value of the options. Loper uses the two-period model to value long positions in the Rapid Repair call and put options without accounting for the fact that Rapid Repair pays common dividends.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of a two-period 40 call on Arbor Industries stock is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 56, "q": "The position in calls necessary to hedge a long position in 1,000 shares of stock over the first period is closest to:", "opts": ["short 830 calls.", "short 1,150 calls.", "short 1,205 calls."], "ans": "C", "expl": "To form a delta neutral portfolio Loper needs to write = 1,204.82, or 1,205 calls. For Further Reference: (Study Session 14, Module 38.7, LOS 38.l)", "explhtml": "<div class=\"tbl\"><table><tr><td>To form a delta neutral portfolio Loper needs to write <\/td><td> = 1,204.82, or 1,205 calls.<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.7, LOS 38.l)<\/p>", "qhtml" const CFG = {"title": "Extra Full Syllabus V2 · Exam 2 — Morning (AM)", "subtitle": "CFA Level II · 60 câu · 3 giờ", "minutes": 180, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }

}

// ---- render -------------------------------------------------------------- //

  $("title").textContent = CFG.title || "Quiz";

    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");

  if(CFG.minutes>0){

      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

    .toLowerCase().replace(/[‐‑–—]/g,"-").replace(/lncome/g,"income");

  if(session===1 && Number(question.n)<=27) return "ethics";
  if(session===1 && /f-statistic|test statistic|hypothesis|regression|semideviation|probability|box and whisker|interquartile|quintile|percentile/.test(prompt)) return "quant";
  if(session===1 && /structural deficit|budget deficit|exchange rate|forward points|currency|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity/.test(prompt)) return "economics";

  if(session===2 && /alternative investment|private capital|private equity|private debt|hedge fund|real estate|infrastructure investment|natural resources|commodit(?:y|ies)|digital assets?|collectibles|venture capital|buyout|mezzanine financing|co-investing/.test(text)) return "alternatives";
  if(session===2 && /fixed-income|fixed income|bond\b|bonds\b|yield curve|yield spread|yield-to-maturity|yield to maturity|duration|convexity|mortgage-backed|asset-backed|securiti[sz]ed debt|credit analysis|credit risk|term structure of interest rates|money market instrument|repo market/.test(text)) return "fixed";
