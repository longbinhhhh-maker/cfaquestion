ely to represent:<\/p><\/div>", "subj": "quant"}, {"n": 12, "q": "Regarding Mehta's comments about machine learning:", "opts": ["both comments are accurate.", "only one comment is accurate.", "neither comment is accurate."], "ans": "C", "expl": "Both comments are inaccurate. Overfitting is an issue with supervised ML and results when a large number of features (i.e., independent variables) are included in the data sample. A learning curve plots the accuracy rate (i.e., 1 – error rate) in the validation or test sample versus the size of the training sample. For Further Reference: (Study Session 3, Module 7.1, LOS 7.b)", "explhtml": "<p>Both comments are inaccurate. Overfitting is an issue with supervised ML and results when a large number of features (i.e., independent variables) are included in the data sample. A learning curve plots the accuracy rate (i.e., 1 – error rate) in the validation or test sample versus the size of the training sample.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 3, Module 7.1, LOS 7.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Quantitative Methods.<\/p><p>Lead Equity, LLP, Case Scenario<\/p><p>Mihir Kotak, CFA, is the managing partner at Lead Equity, LLP, a private equity firm based in southern California. Kotak has decided to revise the model the firm uses to identify attractive investment opportunities by supplementing the model with big data analysis. Kotak sets up a meeting with Ketan Mehta, the lead analyst with Big Solutions, Inc., a consulting company providing solutions related to big data.<\/p><p>During the meeting, Mehta makes the following statements about the steps involved in big data analysis.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The same steps are used in big data analysis whether we are using structured or unstructured<\/td><\/tr><tr><td>data.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The data exploration step is critical; it includes exploratory data analysis, feature selection, and<\/td><\/tr><tr><td>engineering.<\/td><td><\/td><\/tr><\/table><\/div><p>Kotak states that the model is intended to identify companies that would be likely takeover targets over the subsequent 12 months. Kotak says he is concerned that while the analysis may look attractive on paper, it could be inaccurate in making predictions. Specifically, Kotak wants to avoid the scenario where the model incorrectly identifies a company as a target.<\/p><p>Mehta illustrates the type of analytics that can be performed before the model is implemented in business operations. Confusion matrixes shows an excerpt of the report that Mehta provides for illustration.<\/p><p>Confusion matrixes<\/p><div class=\"tbl\"><table><tr><td>Model A<\/td><td>Model B<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td><\/td><td><\/td><\/tr><tr><td>Takeover<\/td><td>Not<\/td><td>Takeover<\/td><td>Not<\/td><td><\/td><td><\/td><\/tr><tr><td>Target<\/td><td>Target<\/td><td>Target<\/td><td>Target<\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>takeover<\/td><td>14<\/td><td>9<\/td><td>takeover<\/td><td>13<\/td><td>4<\/td><\/tr><tr><td>target<\/td><td>target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5<\/td><td>246<\/td><td>4<\/td><td>253<\/td><td><\/td><td><\/td><\/tr><tr><td>not target<\/td><td>not target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Mehta then discusses one of the possible approaches to applying big data analysis to the task at hand as shown in Steps in Data Analysis.<\/p><p>Steps in Data Analysis<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>We start with a sample consisting of the companies in the Russell 2000 Index and then assign<\/td><\/tr><tr><td>them to 50 heterogeneous (based on financial characteristics) buckets.<\/td><td><\/td><\/tr><tr><td>Step 2:<\/td><td>We then randomly select 10 stocks from each of the buckets to assign to one of two classes:<\/td><\/tr><tr><td>takeover target and not a takeover target, based on financial, nonfinancial, and textual data.<\/td><td><\/td><\/tr><\/table><\/div><p>Upon further discussion, Mehta makes the following comments about machine learning.<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Overfitting is an issue with unsupervised ML. Overfitting results when a large number of features<\/td><\/tr><tr><td>are included in the data sample.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>A learning curve plots the error rate in the validation or test sample versus the size of the training<\/td><\/tr><tr><td>sample.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Mehta&#x27;s comments about machine learning:<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "Which of Saminder's fundamental rules is most likely to be accurate?", "opts": ["Only rule 1 is accurate.", "Only rule 2 is accurate.", "Neither rule is accurate."], "ans": "C", "expl": "Rule 1 is incorrect because riskier assets are assigned a higher weighting. Risk-free assets such as cash are typically assigned a weighting of zero, because their risk-free nature means that they do not need to be supported by capital. Riskier assets require more capital funding, hence the higher weighting and risk adjusted value. Rule 2 is also incorrect because off-balance sheet assets also require capital funding and hence should be included using the same risk weighting approach. For Further Reference: (Study Session 5, Module 16.1, LOS 16.b)", "explhtml": "<p>Rule 1 is incorrect because riskier assets are assigned a higher weighting. Risk-free assets such as cash are typically assigned a weighting of zero, because their risk-free nature means that they do not need to be supported by capital. Riskier assets require more capital funding, hence the higher weighting and risk adjusted value.<\/p><p>Rule 2 is also incorrect because off-balance sheet assets also require capital funding and hence should be included using the same risk weighting approach.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 16.1, LOS 16.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>JJK Holdings, Inc., Case Scenario<\/p><p>Ali Saminder, CFA, has recently been hired by JJK Holdings, Inc. (JJK), a U.S.-based financial services holding company. JJK has global operations in commercial and investment banking alongside a significant wealth management division, JJK BMD. Saminder is currently on a six-month rotation working in the risk management division of JJK. She is seeking to become familiar with JKK&#x27;s approach to risk management and the maintenance of an adequate capital base.<\/p><p>Saminder has reviewed an internal document outlining JJK&#x27;s approach to meeting regulatory requirements and has made a note of two fundamental rules that she believes are used to help analyze capital adequacy.<\/p><p>When assessing the tier 1 capital ratio, assets should be weighted according to their risk, with Rule 1: riskier assets assigned a lower value than risk-free assets such as cash.<\/p><p>Off-balance-sheet assets should be excluded from the asset base of the bank when assessing Rule 2: capital adequacy.<\/p><p>The document provided to Saminder outlines JJK&#x27;s approach to calculating regulatory capital. Extracts from the document are shown in Exhibit 1.<\/p><p><b>Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts)<\/b><\/p><p>Tier 1 capital is defined in accordance with global regulatory standards and is appropriately adjusted for intangible and deferred tax assets resulting from losses carried forward. Other tier 1 capital consists of irredeemable non-cumulative preferred stock with a fixed divided of 4.3%. Consistent with local regulatory standards, Tier 2 capital is comprised of $18,047m of subordinated debt maturing in five years, and a convertible bond issue convertible only at maturity at the end of 20X9 (convertible into common stock). JJK Holding has a target tier 1 ratio of 15% and total capital ratio of 20%. 20X8 year-end figures are forecast as follows:<\/p><p>20X8 ($m)<\/p><p>Regulatory capital<\/p><div class=\"tbl\"><table><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total assets<\/td><td>510,948<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><\/table><\/div><p>Saminder is particularly interested in two elements of JJK&#x27;s total capital. First, she is aware that the deferred tax asset referred to in Exhibit 1 totals $7,002m and is carried on the balance sheet without a valuation allowance. She wishes to calculate the impact on the common equity tier 1 ratio if the deferred tax asset was fully written down.<\/p><p>Secondly, Saminder notes that the convertible bond is due for conversion in 20X9. She intends to recalculate the 20X8 tier 1 ratio as if the bonds had been converted already.<\/p><p>Saminder has also reviewed an internal memo outlining some key trends over the last three years that were labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo—Three-Year Trends.<\/p><p><b>Exhibit 2: Internal Memo—Three-Year Trends<\/b><\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><td><\/td><\/tr><tr><td>Assets under management<\/td><td>1<\/td><td>139,398<\/td><td>118,957<\/td><td>108,086<\/td><\/tr><tr><td>Net outflows<\/td><td>2<\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><td><\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><td><\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><td><\/td><\/tr><tr><td>1<\/td><td> Represents client assets managed by JJK BMD Trusts<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2<\/td><td> 30-day liquidity needs in a stress scenario<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Saminder makes the following note using the data in  Exhibit 2: Internal Memo—Three-Year Trends:<\/p><p>&quot;Assets under management have decreased by a total of 22.5% over the three-year period, but these are client assets, require no capital funding, and hence are not a consideration for the risk analysis of the bank.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Saminder&#x27;s fundamental rules is most likely to be accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 14, "q": "Using the forecasted data and explicit targets given in Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts), Saminder is most likely to conclude that JJK Holdings would:", "opts": ["meet its targeted tier 1 ratio and total capital ratio.", "meet its targeted tier 1 ratio but not its targeted total capital ratio.", "fail to meet either target."], "ans": "A", "expl": "Risk-weighted assets 601,312 Common equity tier 1 capital 87,390 Additional tier 1 capital 16,401 Tier 1 capital 103,791 Tier 2 capital 25,447 Total regulatory capital 129,238 For Further Reference: (Study Session 5, Module 16.5, LOS 16.e)", "explhtml": "<div class=\"tbl\"><table><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 1 capital<\/td><td>103,791<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total regulatory capital<\/td><td>129,238<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 16.5, LOS 16.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>JJK Holdings, Inc., Case Scenario<\/p><p>Ali Saminder, CFA, has recently been hired by JJK Holdings, Inc. (JJK), a U.S.-based financial services holding company. JJK has global operations in commercial and investment banking alongside a significant wealth management division, JJK BMD. Saminder is currently on a six-month rotation working in the risk management division of JJK. She is seeking to become familiar with JKK&#x27;s approach to risk management and the maintenance of an adequate capital base.<\/p><p>Saminder has reviewed an internal document outlining JJK&#x27;s approach to meeting regulatory requirements and has made a note of two fundamental rules that she believes are used to help analyze capital adequacy.<\/p><p>When assessing the tier 1 capital ratio, assets should be weighted according to their risk, with Rule 1: riskier assets assigned a lower value than risk-free assets such as cash.<\/p><p>Off-balance-sheet assets should be excluded from the asset base of the bank when assessing Rule 2: capital adequacy.<\/p><p>The document provided to Saminder outlines JJK&#x27;s approach to calculating regulatory capital. Extracts from the document are shown in Exhibit 1.<\/p><p><b>Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts)<\/b><\/p><p>Tier 1 capital is defined in accordance with global regulatory standards and is appropriately adjusted for intangible and deferred tax assets resulting from losses carried forward. Other tier 1 capital consists of irredeemable non-cumulative preferred stock with a fixed divided of 4.3%. Consistent with local regulatory standards, Tier 2 capital is comprised of $18,047m of subordinated debt maturing in five years, and a convertible bond issue convertible only at maturity at the end of 20X9 (convertible into common stock). JJK Holding has a target tier 1 ratio of 15% and total capital ratio of 20%. 20X8 year-end figures are forecast as follows:<\/p><p>20X8 ($m)<\/p><p>Regulatory capital<\/p><div class=\"tbl\"><table><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total assets<\/td><td>510,948<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><\/table><\/div><p>Saminder is particularly interested in two elements of JJK&#x27;s total capital. First, she is aware that the deferred tax asset referred to in Exhibit 1 totals $7,002m and is carried on the balance sheet without a valuation allowance. She wishes to calculate the impact on the common equity tier 1 ratio if the deferred tax asset was fully written down.<\/p><p>Secondly, Saminder notes that the convertible bond is due for conversion in 20X9. She intends to recalculate the 20X8 tier 1 ratio as if the bonds had been converted already.<\/p><p>Saminder has also reviewed an internal memo outlining some key trends over the last three years that were labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo—Three-Year Trends.<\/p><p><b>Exhibit 2: Internal Memo—Three-Year Trends<\/b><\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><td><\/td><\/tr><tr><td>Assets under management<\/td><td>1<\/td><td>139,398<\/td><td>118,957<\/td><td>108,086<\/td><\/tr><tr><td>Net outflows<\/td><td>2<\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><td><\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><td><\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><td><\/td><\/tr><tr><td>1<\/td><td> Represents client assets managed by JJK BMD Trusts<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2<\/td><td> 30-day liquidity needs in a stress scenario<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Saminder makes the following note using the data in  Exhibit 2: Internal Memo—Three-Year Trends:<\/p><p>&quot;Assets under management have decreased by a total of 22.5% over the three-year period, but these are client assets, require no capital funding, and hence are not a consideration for the risk analysis of the bank.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Using the forecasted data and explicit targets given in  Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts), Saminder is most likely to conclude that JJK Holdings would:<\/p><\/div>", "subj": "fsa"}, {"n": 15, "q": "When Saminder makes the adjustment related to the deferred tax asset, the common equity tier 1 ratio is most likely to:", "opts": ["increase.", "decrease.", "remain unchanged."], "ans": "C", "expl": "The internal document states that tier 1 capital is calculated in accordance with global standards, meaning that a deferred tax asset resu labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo—Three-Year Trends.<\/p><p><b>Exhibit 2: Internal Memo—Three-Year Trends<\/b><\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><td><\/td><\/tr><tr><td>Assets under management<\/td><td>1<\/td><td>139,398<\/td><td>118,957<\/td><td>108,086<\/td><\/tr><tr><td>Net outflows<\/td><td>2<\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><td><\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><td><\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><td><\/td><\/tr><tr><td>1<\/td><td> Represents client assets managed by JJK BMD Trusts<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2<\/td><td> 30-day liquidity needs in a stress scenario<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Saminder makes the following note using the data in  Exhibit 2: Internal Memo—Three-Year Trends:<\/p><p>&quot;Assets under management have decreased by a total of 22.5% over the three-year period, but these are client assets, require no capital funding, and hence are not a consideration for the risk analysis of the bank.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>How are tier 1 capital and total capital most likely to change when Saminder makes her stated adjustment for the convertible bonds?<\/p><\/div>", "subj": "fsa"}, {"n": 17, "q": "Saminder's note regarding assets under management is best described as:", "opts": ["accurate.", "inaccurate, as the assets do require capital funding.", "inaccurate, as assets should be considered in the risk analysis al adequacy.<\/p><p>The document provided to Saminder outlines JJK&#x27;s approach to calculating regulatory capital. Extracts from the document are shown in Exhibit 1.<\/p><p><b>Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts)<\/b><\/p><p>Tier 1 capital is defined in accordance with global regulatory standards and is appropriately adjusted for intangible and deferred tax assets resulting from losses carried forward. Other tier 1 capital consists of irredeemable non-cumulative preferred stock with a fixed divided of 4.3%. Consistent with local regulatory standards, Tier 2 capital is comprised of $18,047m of subordinated debt maturing in five years, and a convertible bond issue convertible only at maturity at the end of 20X9 (convertible into common stock). JJK Holding has a target tier 1 ratio of 15% and total capital ratio of 20%. 20X8 year-end figures are forecast as follows:<\/p><p>20X8 ($m)<\/p><p>Regulatory capital<\/p><div class=\"tbl\"><table><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total assets<\/td><td>510,948<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><\/table><\/div><p>Saminder is particularly interested in two elements of JJK&#x27;s total capital. First, she is aware that the deferred tax asset referred to in Exhibit 1 totals $7,002m and is carried on the balance sheet without a valuation allowance. She wishes to calculate the impact on the common equity tier 1 ratio if the deferred tax asset was fully written down.<\/p><p>Secondly, Saminder notes that the convertible bond is due for conversion in 20X9. She intends to recalculate the 20X8 tier 1 ratio as if the bonds had been converted already.<\/p><p>Saminder has also reviewed an internal memo outlining some key trends over the last three years that were labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo—Three-Year Trends.<\/p><p><b>Exhibit 2: Internal Memo—Three-Year Trends<\/b><\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><td><\/td><\/tr><tr><td>Assets under management<\/td><td>1<\/td><td>139,398<\/td><td>118,957<\/td><td>108,086<\/td><\/tr><tr><td>Net outflows<\/td><td>2<\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><td><\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><td><\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><td><\/td><\/tr><tr><td>1<\/td><td> Represents client assets managed by JJK BMD Trusts<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2<\/td><td> 30-day liquidity needs in a stress scenario<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Saminder makes the following note using the data in  Exhibit 2: Internal Memo—Three-Year Trends:<\/p><p>&quot;Assets under management have decreased by a total of 22.5% over the three-year period, but these are client assets, require no capital funding, and hence are not a consideration for the risk analysis of the bank.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Saminder&#x27;s note regarding assets under management is best described as:<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "Using the data in Exhibit 2: Internal Memo—Three-Year Trends, which of the following statements is most accurate?", "opts": ["The number of days JJK can withstand a stress-level-volume of cash outflows decreased by three days from 2015 to 2017.", "The liquidity coverage ratio decreased in each of the two years.", "The trend in net stable funding ratio indicates an increase from 2015 to 2017 in highly liquid funding available, compared to the level of funding required."], "ans": "A", "expl": "2015 2016 2017 High quality liquid assets 111,432 127,352 198,393 Net outflows 100,483 112,482 196,429 Liquidity coverage ratio = 111% 113% 101% The liquidity coverage ratio actually increased from 2015 to 2016, hence choice B is incorrect. The net cash outflows are given for 30 days. An LCR ratio of 100% would mean JJK could withstand 30 days of stress- level outflows. To calculate the number of days JJK can withstand, multiply the LCR by 30. 2015 2016 2017 30 × 1.11 30 × 1.13 30 × 1.01 Number of days of stress volume of cash outflows 33.3 34.0 30.3 Hence A is correct; the number of days decreased by 3 days from 33.3 to 30.3 Available net stable funding excludes highly liquid assets, hence C is incorrect. For Further Reference: (Study Session 5, Module 16.5, LOS 16.e)", "explhtml": "<div class=\"tbl\"><table><tr><td>2015<\/td><td>2016<\/td><td>2017<\/td><td><\/td><\/tr><tr><td>High quality liquid assets<\/td><td>111,432 127,352 198,393<\/td><td><\/td><td><\/td><\/tr><tr><td>Net outflows<\/td><td>100,483<\/td><td>112,482 196,429<\/td><td><\/td><\/tr><tr><td>Liquidity coverage ratio = <\/td><td>111%<\/td><td>113%<\/td><td>101%<\/td><\/tr><\/table><\/div><p>The liquidity coverage ratio actually increased from 2015 to 2016, hence choice B is incorrect.<\/p><p>The net cash outflows are given for 30 days. An LCR ratio of 100% would mean JJK could withstand 30 days of stress- level outflows. To calculate the number of days JJK can withstand, multiply the LCR by 30.<\/p><div class=\"tbl\"><table><tr><td>2015<\/td><td>2016<\/td><td>2017<\/td><td><\/td><\/tr><tr><td>30 × 1.11 30 × 1.13 30 × 1.01<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Number of days of stress volume of cash outflows<\/td><td>33.3<\/td><td>34.0<\/td><td>30.3<\/td><\/tr><\/table><\/div><p>Hence A is correct; the number of days decreased by 3 days from 33.3 to 30.3<\/p><p>Available net stable funding excludes highly liquid assets, hence C is incorrect.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 16.5, LOS 16.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 13 through 18 relate to Financial Reporting and Analysis.<\/p><p>JJK Holdings, Inc., Case Scenario<\/p><p>Ali Saminder, CFA, has recently been hired by JJK Holdings, Inc. (JJK), a U.S.-based financial services holding company. JJK has global operations in commercial and investment banking alongside a significant wealth management division, JJK BMD. Saminder is currently on a six-month rotation working in the risk management division of JJK. She is seeking to become familiar with JKK&#x27;s approach to risk management and the maintenance of an adequate capital base.<\/p><p>Saminder has reviewed an internal document outlining JJK&#x27;s approach to meeting regulatory requirements and has made a note of two fundamental rules that she believes are used to help analyze capital adequacy.<\/p><p>When assessing the tier 1 capital ratio, assets should be weighted according to their risk, with Rule 1: riskier assets assigned a lower value than risk-free assets such as cash.<\/p><p>Off-balance-sheet assets should be excluded from the asset base of the bank when assessing Rule 2: capital adequacy.<\/p><p>The document provided to Saminder outlines JJK&#x27;s approach to calculating regulatory capital. Extracts from the document are shown in Exhibit 1.<\/p><p><b>Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts)<\/b><\/p><p>Tier 1 capital is defined in accordance with global regulatory standards and is appropriately adjusted for intangible and deferred tax assets resulting from losses carried forward. Other tier 1 capital consists of irredeemable non-cumulative preferred stock with a fixed divided of 4.3%. Consistent with local regulatory standards, Tier 2 capital is comprised of $18,047m of subordinated debt maturing in five years, and a convertible bond issue convertible only at maturity at the end of 20X9 (convertible into common stock). JJK Holding has a target tier 1 ratio of 15% and total capital ratio of 20%. 20X8 year-end figures are forecast as follows:<\/p><p>20X8 ($m)<\/p><p>Regulatory capital<\/p><div class=\"tbl\"><table><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total assets<\/td><td>510,948<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><\/table><\/div><p>Saminder is particularly interested in two elements of JJK&#x27;s total capital. First, she is aware that the deferred tax asset referred to in Exhibit 1 totals $7,002m and is carried on the balance sheet without a valuation allowance. She wishes to calculate the impact on the common equity tier 1 ratio if the deferred tax asset was fully written down.<\/p><p>Secondly, Saminder notes that the convertible bond is due for conversion in 20X9. She intends to recalculate the 20X8 tier 1 ratio as if the bonds had been converted already.<\/p><p>Saminder has also reviewed an internal memo outlining some key trends over the last three years that were labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo—Three-Year Trends.<\/p><p><b>Exhibit 2: Internal Memo—Three-Year Trends<\/b><\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><td><\/td><\/tr><tr><td>Assets under management<\/td><td>1<\/td><td>139,398<\/td><td>118,957<\/td><td>108,086<\/td><\/tr><tr><td>Net outflows<\/td><td>2<\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><td><\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><td><\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><td><\/td><\/tr><tr><td>1<\/td><td> Represents client assets managed by JJK BMD Trusts<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2<\/td><td> 30-day liquidity needs in a stress scenario<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Saminder makes the following note using the data in  Exhibit 2: Internal Memo—Three-Year Trends:<\/p><p>&quot;Assets under management have decreased by a total of 22.5% over the three-year period, but these are client assets, require no capital funding, and hence are not a consideration for the risk analysis of the bank.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in  Exhibit 2: Internal Memo—Three-Year Trends, which of the following statements is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "Which of the statements correctly reflect aspects of a carve-out?", "opts": ["Statements 1, 4, and 5 only.", "Statements 1, 3, and 4 only.", "Statements 2, 3, and 4 only."], "ans": "B", "expl": "Statement 1: Correct, although not all the shares will be offered. Statement 2: Incorrect because shares are not automatically issued to existing shareholders under a carve- out. Statement 3: Correct since the results of the business sector will be more easily identifiable once the sector represents a separate company. Statement 4: Correct for all strategies under consideration. Statement 5: Incorrect—with a carve-out the \"selling\" corporation may (usually does) maintain some control of the business that has been split out into a separate company. For Further Reference: (Study Session 8, Module 23.4, LOS 23.n)", "explhtml": "<div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Correct, although not all the shares will be offered.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Incorrect because shares are not automatically issued to existing shareholders under a carve-<\/td><\/tr><tr><td>out.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>Correct since the results of the business sector will be more easily identifiable once the sector<\/td><\/tr><tr><td>represents a separate company.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>Correct for all strategies under consideration.<\/td><\/tr><tr><td>Statement 5:<\/td><td>Incorrect—with a carve-out the &quot;selling&quot; corporation may (usually does) maintain some control of<\/td><\/tr><tr><td>the business that has been split out into a separate company.<\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.4, LOS 23.n)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Questions 19 through 24 relate to Corporate Finance.<\/p><p>Dan Andrews Case Scenario<\/p><p>Dan Andrews, CFA, is the equity analyst for a large pension fund. One of the fund&#x27;s holdings is Debian Corporation. After a period of rapid growth, Debian has underperformed its peers over the past two years. Debian&#x27;s management has announced a change in ownership structure for part of its business, or possibly a disposal of part of the business. Several options are under consideration: a spin-off, a carve-out, or an asset sale. Andrews decides to research each of these options to understand the impact on Debian&#x27;s business and their shareholders. He has read the following comments regarding the various methods:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Involves shares being issued to the general public.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Shareholders have a choice of holding onto the new shares automatically issued to them or<\/td><\/tr><tr><td>disposing of the shares on the open market.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>Shareholders will be more easily able to link executive compensation to the performance of the<\/td><\/tr><tr><td>business involved.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>The firm separates a portion of its operations from the parent company.<\/td><\/tr><tr><td>Statement 5:<\/td><td>A new independent entity will be created that is completely distinct from the parent; the parent<\/td><\/tr><tr><td>will lose all control of the business.<\/td><td><\/td><\/tr><\/table><\/div><p>Debian&#x27;s management announced in the last conference call that a potential buyer, Fedora, Inc., is interested in buying Ubuntu, one of Debian&#x27;s divisions. Fedora has offered to pay $90 million cash to buy Ubuntu. Relevant information is provided in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><div class=\"tbl\"><table><tr><td>Value of Ubuntu as a stand-alone business<\/td><td>$78 million<\/td><\/tr><tr><td>Value of Ubuntu to Debian<\/td><td>$85 million<\/td><\/tr><tr><td>Value of Fedora (5 million shares, $10 par)<\/td><td>$132 million<\/td><\/tr><\/table><\/div><p>Value of Fedora and Ubuntu as a combined entity (post cash acquisition of Ubuntu) $135 million<\/p><p>Alternatively, Fedora is prepared to offer to buy Ubuntu by directly issuing to the shareholders of Debian a total of 3 million $10 par value shares that will rank equally with its existing shares.<\/p><p>Andrews frequents continuing education seminars offered by his local CFA society. During one of these seminars, Andrews meets Jason Arnold, a corporate finance specialist. Andrews agrees with Arnold that a comprehensive equity analysis should include an analysis of payout policies. Andrews, however, is unsure of his recollection from graduate school. Arnold states that he could recall two specific principles:<\/p><div class=\"tbl\"><table><tr><td>Principle 1:<\/td><td>Stock dividends and splits do not create wealth for shareholders.<\/td><\/tr><tr><td>Principle 2:<\/td><td>Irregular cash dividends, stock splits, and stock dividends do not represent a commitment to pay<\/td><\/tr><tr><td>cash to stockholders periodically.<\/td><td><\/td><\/tr><\/table><\/div><p>Among other companies that Andrews is researching, he has identified a potential acquisition target, Mandriva, Inc. Mandriva has enjoyed good growth over the past few years and is expected to continue to do so in the near future. Andrews wants to value Mandriva using both the comparable company method and the comparable transaction approach. Andrews obtains data on recent acquisitions of similar companies.  Exhibit 2 summarizes this data.<\/p><p><b>Exhibit 2<\/b><\/p><p>The mean price-to-book ratio of comparable firms is estimated to be 2 times, and the mean price-to-earnings ratio of the same comparable firms is 25 times. The mean acquisition price-to-book ratio of recent targets is estimated to be 2.80 times, and the mean price-to- earnings ratio of the same firms is 30 times. Mandriva&#x27;s book value per share is $18, and EPS is $1.50. The mean takeover premium of recent acquisitions in the same industry as Mandriva is estimated to be 30%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements correctly reflect aspects of a carve-out?<\/p><\/div>", "subj": "corporate"}, {"n": 20, "q": "If Fedora pays $90 million cash for the purchase of Ubuntu from Debian, what will be the gain to Debian's and Fedora's shareholders? Debian's S/H Fedora's S/H", "opts": ["$5 million $3 million", "$12 million $5 million", "$12 million $7 million"], "ans": "A", "expl": "Debian s/h gain = gain = TP = P − V = $90m − $85m = $5m T T T Fedora s/h gain = gain = S − TP = 8 − 5 = $3m A Synergies are not directly given, but you are given that Fedora's value post merger (after paying the $5m takeover premium) increases by $3 million. Synergies must then be $5m + $3m = $8m. Alternatively, the change in Fedora's value post merger, ($135m − $132m) = $3m, would give the gains to the acquirer in the case of a cash merger. Note: The total gains = value of combined entity − value of both companies prior to merger ($135m + $90m) − ($85m + $132m) = $8m Note: The value of the combined entity in a stock merger must include the $90 million in cash that was paid by Fedora to Debian. For computing the total gains to merger in a cash transaction, we need to add the $90 million that would be paid out to the seller. For Further Reference: (Study Session 8, Module 23.4, LOS 23.k)", "explhtml": "<p>Debian s/h gain = gain  = TP = P  − V  = $90m − $85m = $5m<\/p><div class=\"tbl\"><table><tr><td>T<\/td><td>T<\/td><td>T<\/td><\/tr><tr><td>Fedora s/h gain = gain  = S − TP = 8 − 5 = $3m<\/td><td><\/td><td><\/td><\/tr><tr><td>A<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Synergies are not directly given, but you are given that Fedora&#x27;s value post merger (after paying the $5m takeover premium) increases by $3 million. Synergies must then be $5m + $3m = $8m.<\/p><p>Alternatively, the change in Fedora&#x27;s value post merger, ($135m − $132m) = $3m, would give the gains to the acquirer in the case of a cash merger.<\/p><p>Note: The total gains = value of combined entity − value of both companies prior to merger<\/p><p>($135m + $90m) − ($85m + $132m) = $8m<\/p><p>Note: The value of the combined entity in a stock merger must include the $90 million in cash that was paid by Fedora to Debian. For computing the total gains to merger in a cash transaction, we need to add the $90 million that would be paid out to the seller.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.4, LOS 23.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 19 through 24 relate to Corporate Finance.<\/p><p>Dan Andrews Case Scenario<\/p><p>Dan Andrews, CFA, is the equity analyst for a large pension fund. One of the fund&#x27;s holdings is Debian Corporation. After a period of rapid growth, Debian has underperformed its peers over the past two years. Debian&#x27;s management has announced a change in ownership structure for part of its business, or possibly a disposal of part of the business. Several options are under consideration: a spin-off, a carve-out, or an asset sale. Andrews decides to research each of these options to understand the impact on Debian&#x27;s business and their shareholders. He has read the following comments regarding the various methods:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Involves shares being issued to the general public.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Shareholders have a choice of holding onto the new shares automatically issued to them or<\/td><\/tr><tr><td>disposing of the shares on the open market.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>Shareholders will be more easily able to link executive compensation to the performance of the<\/td><\/tr><tr><td>business involved.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>The firm separates a portion of its operations from the parent company.<\/td><\/tr><tr><td>Statement 5:<\/td><td>A new independent entity will be created that is completely distinct from the parent; the parent<\/td><\/tr><tr><td>will lose all control of the business.<\/td><td><\/td><\/tr><\/table><\/div><p>Debian&#x27;s management announced in the last conference call that a potential buyer, Fedora, Inc., is interested in buying Ubuntu, one of Debian&#x27;s divisions. Fedora has offered to pay $90 million cash to buy Ubuntu. Relevant information is provided in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><div class=\"tbl\"><table><tr><td>Value of Ubuntu as a stand-alone business<\/td><td>$78 million<\/td><\/tr><tr><td>Value of Ubuntu to Debian<\/td><td>$85 million<\/td><\/tr><tr><td>Value of Fedora (5 million shares, $10 par)<\/td><td>$132 million<\/td><\/tr><\/table><\/div><p>Value of Fedora and Ubuntu as a combined entity (post cash acquisition of Ubuntu) $135 million<\/p><p>Alternatively, Fedora is prepared to offer to buy Ubuntu by directly issuing to the shareholders of Debian a total of 3 million $10 par value shares that will rank equally with its existing shares.<\/p><p>Andrews frequents continuing education seminars offered by his local CFA society. During one of these seminars, Andrews meets Jason Arnold, a corporate finance specialist. Andrews agrees with Arnold that a comprehensive equity analysis should include an analysis of payout policies. Andrews, however, is unsure of his recollection from graduate school. Arnold states that he could recall two specific principles:<\/p><div class=\"tbl\"><table><tr><td>Principle 1:<\/td><td>Stock dividends and splits do not create wealth for shareholders.<\/td><\/tr><tr><td>Principle 2:<\/td><td>Irregular cash dividends, stock splits, and stock dividends do not represent a commitment to pay<\/td><\/tr><tr><td>cash to stockholders periodically.<\/td><td><\/td><\/tr><\/table><\/div><p>Among other companies that Andrews is researching, he has identified a potential acquisition target, Mandriva, Inc. Mandriva has enjoyed good growth over the past few years and is expected to continue to do so in the near future. Andrews wants to value Mandriva using both the comparable company method and the comparable transaction approach. Andrews obtains data on recent acquisitions of similar companies.  Exhibit 2 summarizes this data.<\/p><p><b>Exhibit 2<\/b><\/p><p>The mean price-to-book ratio of comparable firms is estimated to be 2 times, and the mean price-to-earnings ratio of the same comparable firms is 25 times. The mean acquisition price-to-book ratio of recent targets is estimated to be 2.80 times, and the mean price-to- earnings ratio of the same firms is 30 times. Mandriva&#x27;s book value per share is $18, and EPS is $1.50. The mean takeover premium of recent acquisitions in the same industry as Mandriva is estimated to be 30%.<\/p><\/div><\/details><div class=\"qtext\"><p>If Fedora pays $90 million cash for the purchase of Ubuntu from Debian, what will be the gain to Debian&#x27;s and Fedora&#x27;s shareholders?<\/p><div class=\"tbl\"><table><tr><td>Debian&#x27;s S/H<\/td><td>Fedora&#x27;s S/H<\/td><\/tr><\/table><\/div><\/div>", "subj": "corporate"}, {"n": 21, "q": "If Debian shareholders accept the stock offer by Fedora, the economic impact on them would be closest to:", "opts": ["a gain of $630,000.", "a loss of $630,000.", "a loss of $1,612,500."], "ans": "B", "expl": "V = V + V + S – C AT A T Given V = 135 and C = 90. Hence 135 = V + V + S – 90 or V + V + S = 225. AT A T A T For a stock acquisition, C = 0. V = V + V + S – C = 225 – 0 = 225. AT A T Value of Fedora and Ubunta post cash acquisition (given) = $135 million. Value of Fedora and Ubunta post stock acquisition = $135 million + $90 million cash = $225 million. Number of shares outstanding post stock acquisition = 5 + 3 = 8 million. Value of shares received based on their likely post-acquisition price = [(225m) / 8m] × 3m = $84,375,000. Gain to Debian's shareholders is therefore $84,375,000 − $85,000,000 = –$625,000. For Further Reference: (Study Session 8, Module 23.4, LOS 23.k)", "explhtml": "<div class=\"tbl\"><table><tr><td>V<\/td><td> = V  + V  + S – C<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>AT<\/td><td>A<\/td><td>T<\/td><td><\/td><td><\/td><\/tr><tr><td>Given V<\/td><td> = 135 and C = 90. Hence 135 = V  + V  + S – 90 or V  + V  + S = 225.<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>AT<\/td><td>A<\/td><td>T<\/td><td>A<\/td><td>T<\/td><\/tr><tr><td>For a stock acquisition, C = 0. V<\/td><td> = V  + V  + S – C = 225 – 0 = 225.<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>AT<\/td><td>A<\/td><td>T<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Value of Fedora and Ubunta post cash acquisition (given) = $135 million.<\/p><p>Value of Fedora and Ubunta post stock acquisition = $135 million + $90 million cash = $225 million.<\/p><p>Number of shares outstanding post stock acquisition = 5 + 3 = 8 million.<\/p><p>Value of shares received based on their likely post-acquisition price = [(225m) / 8m] × 3m = $84,375,000.<\/p><p>Gain to Debian&#x27;s shareholders is therefore $84,375,000 − $85,000,000 = –$625,000.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.4, LOS 23.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 19 through 24 relate to Corporate Finance.<\/p><p>Dan Andrews Case Scenario<\/p><p>Dan Andrews, CFA, is the equity analyst for a large pension fund. One of the fund&#x27;s holdings is Debian Corporation. After a period of rapid growth, Debian has underperformed its peers over the past two years. Debian&#x27;s management has announced a change in ownership structure for part of its business, or possibly a disposal of part of the business. Several options are under consideration: a spin-off, a carve-out, or an asset sale. Andrews decides to research each of these options to understand the impact on Debian&#x27;s business and their shareholders. He has read the following comments regarding the various methods:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Involves shares being issued to the general public.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Shareholders have a choice of holding onto the new shares automatically issued to them or<\/td><\/tr><tr><td>disposing of the shares on the open market.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>Shareholders will be more easily able to link executive compensation to the performance of the<\/td><\/tr><tr><td>business involved.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>The firm separates a portion of its operations from the parent company.<\/td><\/tr><tr><td>Statement 5:<\/td><td>A new independent entity will be created that is completely distinct from the parent; the parent<\/td><\/tr><tr><td>will lose all control of the business.<\/td><td><\/td><\/tr><\/table><\/div><p>Debian&#x27;s management announced in the last conference call that a potential buyer, Fedora, Inc., is interested in buying Ubuntu, one of Debian&#x27;s divisions. Fedora has offered to pay $90 million cash to buy Ubuntu. Relevant information is provided in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><div class=\"tbl\"><table><tr><td>Value of Ubuntu as a stand-alone business<\/td><td>$78 million<\/td><\/tr><tr><td>Value of Ubuntu to Debian<\/td><td>$85 million<\/td><\/tr><tr><td>Value of Fedora (5 million shares, $10 par)<\/td><td>$132 million<\/td><\/tr><\/table><\/div><p>Value of Fedora and Ubuntu as a combined entity (post cash acquisition of Ubuntu) $135 million<\/p><p>Alternatively, Fedora is prepared to offer to buy Ubuntu by directly issuing to the shareholders of Debian a total of 3 million $10 par value shares that will rank equally with its existing shares.<\/p><p>Andrews frequents continuing education seminars offered by his local CFA society. During one of these seminars, Andrews meets Jason Arnold, a corporate finance specialist. Andrews agrees with Arnold that a comprehensive equity analysis should include an analysis of payout policies. Andrews, however, is unsure of his recollection from graduate school. Arnold states that he could recall two specific principles:<\/p><div class=\"tbl\"><table><tr><td>Principle 1:<\/td><td>Stock dividends and splits do not create wealth for shareholders.<\/td><\/tr><tr><td>Principle 2:<\/td><td>Irregular cash dividends, stock splits, and stock dividends do not represent a commitment to pay<\/td><\/tr><tr><td>cash to stockholders periodically.<\/td><td><\/td><\/tr><\/table><\/div><p>Among other companies that Andrews is researching, he has identified a potential acquisition target, Mandriva, Inc. Mandriva has enjoyed good growth over the past few years and is expected to continue to do so in the near future. Andrews wants to value Mandriva using both the comparable company method and the comparable transaction approach. Andrews obtains data on recent acquisitions of similar companies.  Exhibit 2 summarizes this data.<\/p><p><b>Exhibit 2<\/b><\/p><p>The mean price-to-book ratio of comparable firms is estimated to be 2 times, and the mean price-to-earnings ratio of the same comparable firms is 25 times. The mean acquisition price-to-book ratio of recent targets is estimated to be 2.80 times, and the mean price-to- earnings ratio of the same firms is 30 times. Mandriva&#x27;s book value per share is $18, and EPS is $1.50. The mean takeover premium of recent acquisitions in the same industry as Mandriva is estimated to be 30%.<\/p><\/div><\/details><div class=\"qtext\"><p>If Debian shareholders accept the stock offer by Fedora, the economic impact on them would be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 22, "q": "Under Fedora's stock offer, the economic impact on the current shareholders of Fedora is closest to:", "opts": ["a loss of $7.5 million.", "a gain of $8.6 million.", "a gain of $1.6 million."], "ans": "B", "expl": "New value of their 5m shares = ($225m / 8m) × 5m = $140,625,000 Old value of their 5m shares = $132,000,000 Gain = $8,625,000 For Further Reference: (Study Session 8, Module 23.4, LOS 23.k)", "explhtml": "<p>New value of their 5m shares = ($225m / 8m) × 5m = $140,625,000<\/p><div class=\"tbl\"><table><tr><td>Old value of their 5m shares<\/td><td>= $132,000,000<\/td><\/tr><tr><td>Gain<\/td><td>= $8,625,000<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.4, LOS 23.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vigne /b><\/p><div class=\"tbl\"><table><tr><td>Value of Ubuntu as a stand-alone business<\/td><td>$78 million<\/td><\/tr><tr><td>Value of Ubuntu to Debian<\/td><td>$85 million<\/td><\/tr><tr><td>Value of Fedora (5 million shares, $10 par)<\/td><td>$132 million<\/td><\/tr><\/table><\/div><p>Value of Fedora and Ubuntu as a combined entity (post cash acquisition of Ubuntu) $135 million<\/p><p>Alternatively, Fedora is prepared to offer to buy Ubuntu by directly issuing to the shareholders of Debian a total of 3 million $10 par value shares that will rank equally with its existing shares.<\/p><p>Andrews frequents continuing education seminars offered by his local CFA society. During one of these seminars, Andrews meets Jason Arnold, a corporate finance specialist. Andrews agrees with Arnold that a comprehensive equity analysis should include an analysis of payout policies. Andrews, however, is unsure of his recollection from graduate school. Arnold states that he could recall two specific principles:<\/p><div class=\"tbl\"><table><tr><td>Principle 1:<\/td><td>Stock dividends and splits do not create wealth for shareholders.<\/td><\/tr><tr><td>Principle 2:<\/td><td>Irregular cash dividends, stock splits, and stock dividends do not represent a commitment to pay<\/td><\/tr><tr><td>cash to stockholders periodically.<\/td><td><\/td><\/tr><\/table><\/div><p>Among other companies that Andrews is researching, he has identified a potential acquisition target, Mandriva, Inc. Mandriva has enjoyed good growth over the past few years and is expected to continue to do so in the near future. Andrews wants to value Mandriva using both the comparable company method and the comparable transaction approach. Andrews obtains data on recent acquisitions of similar companies.  Exhibit 2 summarizes this data.<\/p><p><b>Exhibit 2<\/b><\/p><p>The mean price-to-book ratio of comparable firms is estimated to be 2 times, and the mean price-to-earnings ratio of the same comparable firms is 25 times. The mean acquisition price-to-book ratio of recent targets is estimated to be 2.80 times, and the mean price-to- earnings ratio of the same firms is 30 times. Mandriva&#x27;s book value per share is $18, and EPS is $1.50. The mean takeover premium of recent acquisitions in the same industry as Mandriva is estimated to be 30%.<\/p><\/div><\/details><div class=\"qtext\"><p>Under Fedora&#x27;s stock offer, the economic impact on the current shareholders of Fedora is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 23, "q": "Are Arnold's principles 1 and 2 of corporate payout policy correct?", "opts": ["Both of these principles are incorrect.", "Only one of these principles is correct.", "Both of these principles are correct."], "ans": "C", "expl": "Stock dividends and splits merely carve stockholders' equity into smaller pieces and do not create wealth for shareholders. Only cash dividends represent a commitment to pay cash to stockholders periodically. Irregular cash dividends, stock splits, and stock dividends do not. For Further Reference: (Study Session 7, Module 21.1, LOS 21.a)", "explhtml": "<p>Stock dividends and splits merely carve stockholders&#x27; equity into smaller pieces and do not create wealth for shareholders. Only cash dividends represent a commitment to pay cash to stockholders periodically. Irregular cash dividends, stock splits, and stock dividends do not.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 21.1, LOS 21.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 19 through 24 relate to Corporate Finance.<\/p><p>Dan Andrews Case Scenario<\/p><p>Dan Andrews, CFA, is the equity analyst for a large pension fund. One of the fund&#x27;s holdings is Debian Corporation. After a period of rapid growth, Debian has underperformed its peers over the past two years. buntu by directly issuing to the shareholders of Debian a total of 3 million $10 par value shares that will rank equally with its existing shares.<\/p><p>Andrews frequents continuing education seminars offered by his local CFA society. During one of these seminars, Andrews meets Jason Arnold, a corporate finance specialist. Andrews agrees with Arnold that a comprehensive equity analysis should include an analysis of payout policies. Andrews, however, is unsure of his recollection from graduate school. Arnold states that he could recall two specific principles:<\/p><div class=\"tbl\"><table><tr><td>Principle 1:<\/td><td>Stock dividends and splits do not create wealth for shareholders.<\/td><\/tr><tr><td>Principle 2:<\/td><td>Irregular cash dividends, stock splits, and stock dividends do not represent a commitment to pay<\/td><\/tr><tr><td>cash to stockholders periodically.<\/td><td><\/td><\/tr><\/table><\/div><p>Among other companies that Andrews is researching, he has identified a potential acquisition target, Mandriva, Inc. Mandriva has enjoyed good growth over the past few years and is expected to continue to do so in the near future. Andrews wants to value Mandriva using both the comparable company method and the comparable transaction approach. Andrews obtains data on recent acquisitions of similar companies.  Exhibit 2 summarizes this data.<\/p><p><b>Exhibit 2<\/b><\/p><p>The mean price-to-book ratio of comparable firms is estimated to be 2 times, and the mean price-to-earnings ratio of the same comparable firms is 25 times. The mean acquisition price-to-book ratio of recent targets is estimated to be 2.80 times, and the mean price-to- earnings ratio of the same firms is 30 times. Mandriva&#x27;s book value per share is $18, and EPS is $1.50. The mean takeover premium of recent acquisitions in the same industry as Mandriva is estimated to be 30%.<\/p><\/div><\/details><div class=\"qtext\"><p>Are Arnold&#x27;s principles 1 and 2 of corporate payout policy correc ebian has underperformed its peers over the past two years. Debian&#x27;s management has announced a change in ownership structure for part of its business, or possibly a disposal of part of the business. Several options are under consideration: a spin-off, a carve-out, or an asset sale. Andrews decides to research each of these options to understand the impact on Debian&#x27;s business and their shareholders. He has read the following comments regarding the various methods:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Involves shares being issued to the general public.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Shareholders have a choice of holding onto the new shares automatically issued to them or<\/td><\/tr><tr><td>disposing of the shares on the open market.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>Shareholders will be more easily able to link executive compensation to the performance of the<\/td><\/tr><tr><td>business involved.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>The firm separates a portion of its operations from the parent company.<\/td><\/tr><tr><td>Statement 5:<\/td><td>A new independent entity will be created that is completely distinct from the parent; the parent<\/td><\/tr><tr><td>will lose all control of the business.<\/td><td><\/td><\/tr><\/table><\/div><p>Debian&#x27;s management announced in the last conference call that a potential buyer, Fedora, Inc., is interested in buying Ubuntu, one of Debian&#x27;s divisions. Fedora has offered to pay $90 million cash to buy Ubuntu. Relevant information is provided in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><div class=\"tbl\"><table><tr><td>Value of Ubuntu as a stand-alone business<\/td><td>$78 million<\/td><\/tr><tr><td>Value of Ubuntu to Debian<\/td><td>$85 million<\/td><\/tr><tr><td>Value of Fedora (5 million shares, $10 par)<\/td><td>$132 million<\/td><\/tr><\/table><\/div><p>Value of Fedora and Ubuntu as a combined entity (post cash acquisition of Ubuntu) $135 million<\/p><p>Alternatively, Fedora is prepared to offer to buy Ubuntu by directly issuing to the shareholders of Debian a total of 3 million $10 par value shares that will rank equally with its existing shares.<\/p><p>Andrews frequents continuing education seminars offered by his local CFA society. During one of these seminars, Andrews meets Jason Arnold, a corporate finance specialist. Andrews agrees with Arnold that a comprehensive equity analysis should include an analysis of payout policies. Andrews, however, is unsure of his recollection from graduate school. Arnold states that he could recall two specific principles:<\/p><div class=\"tbl\"><table><tr><td>Principle 1:<\/td><td>Stock dividends and splits do not create wealth for shareholders.<\/td><\/tr><tr><td>Principle 2:<\/td><td>Irregular cash dividends, stock splits, and stock dividends do not represent a commitment to pay<\/td><\/tr><tr><td>cash to stockholders periodically.<\/td><td><\/td><\/tr><\/table><\/div><p>Among other companies that Andrews is researching, he has identified a potential acquisition target, Mandriva, Inc. Mandriva has enjoyed good growth over the past few years and is expected to continue to do so in the near future. Andrews wants to value Mandriva using both the comparable company method and the comparable transaction approach. Andrews obtains data on recent acquisitions of similar companies.  Exhibit 2 summarizes this data.<\/p><p><b>Exhibit 2<\/b><\/p><p>The mean price-to-book ratio of comparable firms is estimated to be 2 times, and the mean price-to-earnings ratio of the same comparable firms is 25 times. The mean acquisition price-to-book ratio of recent targets is estimated to be 2.80 times, and the mean price-to- earnings ratio of the same firms is 30 times. Mandriva&#x27;s book value per share is $18, and EPS is $1.50. The mean takeover premium of recent acquisitions in the same industry as Mandriva is estimated to be 30%.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data collected by Andrews, the target takeover price per share of Mandriva under the comparable company analysis and under the comparable transaction analysis is closest to:<\/p><div class=\"tbl\"><table><tr><td>Comparable company<\/td><td>Comparable transaction<\/td><\/tr><\/table><\/div><\/div>", "subj": "corporate"}, {"n": 25, "q": "The 2018 free cash flow to the firm (FCFF) for Global Drug World (GDW) in dollars is closest to:", "opts": ["$87,728.", "$95,374.", "$102,378."], "ans": "A", "expl": "Free cash flow to the firm can be calculated in various ways. One approach to calculate FCFF is to start with net income: FCFF = NI + NCC + Int(1 − tax rate) − FCInv − WCInv NI = $164,497 (income statement) NCC = noncash charges = $56,293 (income statement) Int = interest = $20,265 + $5,223 = $25,488 (income statement) FCInv = fixed capital investment = $143,579 (additional information) WCInv = working capital investment = $7,325 (additional information) Putting it all together: FCFF = $164,497 + $56,293 + $25,488(1 − 0.3) − $143,579 − $7,325 = $87,728 For Further Reference: (Study Session 11, Module 28.4, LOS 28.d)", "explhtml": "<p>Free cash flow to the firm can be calculated in various ways. One approach to calculate FCFF is to start with net income:<\/p><p>FCFF = NI + NCC + Int(1 − tax rate) − FCInv − WCInv<\/p><div class=\"tbl\"><table><tr><td>NI = $164,497<\/td><td>(income statement)<\/td><\/tr><tr><td>NCC = noncash charges = $56,293<\/td><td>(income statement)<\/td><\/tr><tr><td>Int = interest = $20,265 + $5,223 = $25,488<\/td><td>(income statement)<\/td><\/tr><tr><td>FCInv = fixed capital investment = $143,579<\/td><td>(additional information)<\/td><\/tr><\/table><\/div><p>WCInv = working capital investment = $7,325 (additional information)<\/p><p>Putting it all together:<\/p><p>FCFF = $164,497 + $56,293 + $25,488(1 − 0.3) − $143,579 − $7,325 = $87,728<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.4, LOS 28.d)<\/p>", "qhtml": "<details sh. New common share offering that would increase shares outstanding by 30%. New issue of convertible bonds that are not callable for five years and would increase the level of debt by 10%.<\/p><\/div><\/details><div class=\"qtext\"><p>The 2018 free cash flow to the firm (FCFF) for Global Drug World (GDW) in dollars is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "By how much (in dollars) does GDW's FCFF exceed its free cash flow to equity (FCFE) in 2018?", "opts": ["$9,567.", "$45,251.", "$52,897."], "ans": "B", "expl": "FCFE can be expressed in terms of FCFF as follows: FCFE = FCFF − Int(1 − tax rate) + net borrowing Therefore, the amount by which FCFF exceeds FCFE can be written as: FCFF − FCFE = Int(1 − tax rate) − net borrowing Int = $25,488 Net borrowing = $5,866 − $33,275 = –$27,409 (additional information) Therefore: FCFF − FCFE = $25,488(1 − 0.3) − (–$27,409) = $45,251 For Further Reference: (Study Session 11, Module 28.4, LOS 28.d)", "explhtml": "<p>FCFE can be expressed in terms of FCFF as follows:<\/p><p>FCFE = FCFF − Int(1 − tax rate) + net borrowing<\/p><p>Therefore, the amount by which FCFF exceeds FCFE can be written as:<\/p><p>FCFF − FCFE = Int(1 − tax rate) − net borrowing<\/p><p>Int = $25,488<\/p><p>Net borrowing = $5,866 − $33,275 = –$27,409 (additional information)<\/p><p>Therefore: FCFF − FCFE = $25,488(1 − 0.3) − (–$27,409) = $45,251<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.4, LOS 28.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 25 through 30 relate to Equity Valuation.<\/p><p>Global Drug World Case Scenario<\/p><p>Carl Warner, CFA, has been asked to review the financial information of Global Drug World (GDW) in preparation for a possible takeover bid by rival competitor Consolidated Drugstores International (Consolidated) xed capital spending is expected to be $36,470. Investment in net working capital is expected to be $24,313. Moreover, Warner notes that the only noncash charge is depreciation, which he estimates will be $60,000.<\/p><p>Warner has been asked to analyze the effect each of the following corporate events, if taken during 2019, would have on GDW&#x27;s free cash flow to equity (FCFE):<\/p><p>20% increase in dividends per share. Repurchase of 25% of the firm&#x27;s outstanding shares using cash. New common share offering that would increase shares outstanding by 30%. New issue of convertible bonds that are not callable for five years and would increase the level of debt by 10%.<\/p><\/div><\/details><div class=\"qtext\"><p>The 2019 estimate of FCFF is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 29, "q": "Warner determines that on a per-share basis, the FCFE for GDW in 2018 is $0.19. Further analysis suggests that FCFE per share will grow by $0.02 in each of the next two years before leveling off to a long-term growth rate of 5%. The current value of one share of GDW's equity is closest to:", "opts": ["$4.37.", "$7.15.", "$13.49."], "ans": "A", "expl": "This is a two-stage FCFE model. The required return on equity is 10% (from previous problem), and the long-term growth rate after 2 years is 5%. Financial calculators can perform this calculation more quickly and accurately. The appropriate keystrokes are: CFO = 0; C01 = $0.21; C02 = $0.23 + $4.83 = $5.06; I = 10.0; CPT → NPV = $4.37 Notice that the second cash flow combines the FCFE for the second year with the present value of the series of constantly growing FCFE terms that begin at the end of the third year. This approach is valid since the timing of these two cash flows is the same (i.e., the end of the second year). For Further Reference: (Study Session 11, Module 28.5, LOS 28.j)", "explhtml": "<p>This is a two-stage FCFE model. The required return on equity is 10% (from previous problem), and the long-term growth rate after 2 years is 5%.<\/p><p>Financial calculators can perform this calculation more quickly and accurately. The appropriate keystrokes are:<\/p><p>CFO = 0; C01 = $0.21; C02 = $0.23 + $4.83 = $5.06; I = 10.0; CPT → NPV = $4.37<\/p><p>Notice that the second cash flow combines the FCFE for the second year with the present value of the series of constantly growing FCFE terms that begin at the end of the third year. This approach is valid since the timing of these two cash flows is the same (i.e., the end of the second year).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 28.5, LOS 28.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 25 through 30 relate to Equity Valuation.<\/p><p>Global Drug World Case Scenario<\/p><p>Carl Warner, CFA, has been asked to review the financial information of Global Drug World (GDW) in preparation for a possible takeover bid by rival competitor Consolidated Drugstores International (Consolidated). GDW has produced impressive results since going public via an initial public offering in 2008. Through a program of aggressive growth by acquisition, GDW is currently seen as a major player and a threat to Consolidated&#x27;s own plans for growth and profitability. In preparation for his analysis, Warner has gathered the following financial data from GDW&#x27;s year-end statements.<\/p><p>GDW Statement of Income for Year Ended May 31, 2018<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>4,052,173<\/td><\/tr><\/table><\/div><p>Expenses<\/p><p> Cost of goods sold, general and operating expenses 3,735,397<\/p><div class=\"tbl\"><table><tr><td> Noncash charges<\/td><td>56,293<\/td><\/tr><tr><td> Interest on long-term debt<\/td><td>20,265<\/td><\/tr><tr><td>Other interest<\/td><td>5,223<\/td><\/tr><tr><td>3,817,178<\/td><td><\/td><\/tr><tr><t
