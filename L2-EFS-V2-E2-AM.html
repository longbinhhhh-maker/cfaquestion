<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n": 1, "q": "Blackwell's most appropriate course of action to remain in compliance with the Code and Standards is to:", "opts": ["include a disclosure indicating that lower earnings estimates are available.", "follow up the first report with a second report emphasizing lower earnings projections.", "remove her name from the report if they release the report with higher earnings estimates."], "ans": "C", "expl": "Standard V(A) Diligence and Reasonable Basis requires that appropriate due diligence be performed and that recommendations be substantiated. Moreover, the Standards require that supervisory procedures must be in place to ensure compliance with the policy. If the report is released with the supervisor's revision, Blackwell should insist that her name be removed. For Further Reference: (Study Session 1, Module 2.8, LOS 2.a)", "explhtml": "<p>Standard V(A) Diligence and Reasonable Basis requires that appropriate due diligence be performed and that recommendations be substantiated. Moreover, the Standards require that supervisory procedures must be in place to ensure compliance with the policy. If the report is released with the supervisor&#x27;s revision, Blackwell should insist that her name be removed.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.8, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Blanchard Investments Case Scenario<\/p><p>Carol Blackwell, CFA, has been hired into the research department of Blanchard Investments. Blanchard&#x27;s manager, Thaddeus Baldwin, CFA, has worked in the securities business for more than 50 years. On Blackwell&#x27;s first day at the office, Baldwin gives her an incomplete research report on Tops Groceries, Inc., to finish up.<\/p><p>Upon researching Tops, information about the financial instability of Tops Groceries&#x27; largest customer surfaces. Blackwell revises the research report by lowering the earnings projections. The day the report is to be released, Blackwell learns that Baldwin has replaced the lower, revised earnings projections with his earlier estimates.<\/p><p>Baldwin realizes that many of the firm&#x27;s practices and policies would benefit from a compliance check. Baldwin wants Blackwell to ensure that the policies and procedures at the firm are in compliance.<\/p><p>While reviewing a draft research report on Patel, Inc., Blackwell notices that the research analyst responsible for authoring the report had used neural networks in forecasting revenues and earnings. Since that analyst was no longer employed at the firm, and Blackwell is not familiar with that specific quantitative tool, he deletes the segment pertaining to neural networks but otherwise does not change the report before signing off on it.<\/p><p>Blanchard&#x27;s investment banking department recently announced that they were successful in obtaining the account of Teos Toys, Inc. In light of this announcement, Baldwin wants to know whether he can continue to rate Teos&#x27; stock favorably.<\/p><p>During a local society luncheon, Blackwell is seated next to CFA candidate Lucas Walters, who has been assigned the task of creating a compliance manual for Borchard &amp; Sons, a small brokerage firm. Walters asks for her advice.<\/p><p>When Walters returns to work, he is apprised of the following situation: Borchard &amp; Sons purchased 25,000 shares of CBX Corp. for equity manager Quintux Quantitative just minutes before the money manager called back and said it meant to buy 25,000 shares of CDX Corp. Borchard then purchased CDX shares for Quintux, but not before shares of CBX Corp. declined by 1.5%. The broker is holding the CBX shares in its own inventory.<\/p><p>Borchard proposes three methods for dealing with the trading error.<\/p><div class=\"tbl\"><table><tr><td>Method 1:<\/td><td>Quintux directs additional trades to Borchard worth a dollar value equal to the amount of the<\/td><\/tr><tr><td>trading loss.<\/td><td><\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the<\/td><\/tr><tr><td>costs of the trading error.<\/td><td><\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to<\/td><\/tr><tr><td>all of its clients on a pro-rata basis.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Blackwell&#x27;s most appropriate course of action to remain in compliance with the Code and Standards is to:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "When updating the proxy-voting policy to conform to CFA Institute recommendations, which of the following recommendations is least appropriate for Blanchard to adopt?", "opts": ["Determine the economic impact of non-routine proxy votes.", "Follow the same proxy-voting procedures regardless of the nature of the proposal.", "If the proxy voter’s preference differs from the preference of a client who has delegated his voting powers, go with the client’s preference."], "ans": "B", "expl": "Standard III(A) Loyalty, Prudence, and Care. Unusual proposals, such as hostile takeovers and executive changes, may require more review than routine matters such as renewing stock-repurchase agreements. Money managers should provide a means to review complex proxies. Establishing evaluation criteria and disclosing the firm's proxy voting policies and procedures to clients are basic elements of a proxy-voting policy. Client wishes regarding proxy voting should always be followed. For Further Reference: (Study Session 1, Module 2.4, LOS 2.a)", "explhtml": "<p>Standard III(A) Loyalty, Prudence, and Care. Unusual proposals, such as hostile takeovers and executive changes, may require more review than routine matters such as renewing stock-repurchase agreements. Money managers should provide a means to review complex proxies. Establishing evaluation criteria and disclosing the firm&#x27;s proxy voting policies and procedures to clients are basic elements of a proxy-voting policy. Client wishes regarding proxy voting should always be followed.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.4, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Blanchard Investments Case Scenario<\/p><p>Carol Blackwell, CFA, has been hired into the research department of Blanchard Investments. Blanchard&#x27;s manager, Thaddeus Baldwin, CFA, has worked in the securities business for more than 50 years. On Blackwell&#x27;s first day at the office, Baldwin gives her an incomplete research report on Tops Groceries, Inc., to finish up.<\/p><p>Upon researching Tops, information about the financial instability of Tops Groceries&#x27; largest customer surfaces. Blackwell revises the research report by lowering the earnings projections. The day the report is to be released, Blackwell learns that Baldwin has replaced the lower, revised earnings projections with his earlier estimates.<\/p><p>Baldwin realizes that many of the firm&#x27;s practices and policies would benefit from a compliance check. Baldwin wants Blackwell to ensure that the policies and procedures at the firm are in compliance.<\/p><p>While reviewing a draft research report on Patel, Inc., Blackwell notices that the research analyst responsible for authoring the report had used neural networks in forecasting revenues and earnings. Since that analyst was no longer employed at the firm, and Blackwell is not familiar with that specific quantitative tool, he deletes the segment pertaining to neural networks but otherwise does not change the report before signing off on it.<\/p><p>Blanchard&#x27;s investment banking department recently announced that they were successful in obtaining the account of Teos Toys, Inc. In light of this announcement, Baldwin wants to know whether he can continue to rate Teos&#x27; stock favorably.<\/p><p>During a local society luncheon, Blackwell is seated next to CFA candidate Lucas Walters, who has been assigned the task of creating a compliance manual for Borchard &amp; Sons, a small brokerage firm. Walters asks for her advice.<\/p><p>When Walters returns to work, he is apprised of the following situation: Borchard &amp; Sons purchased 25,000 shares of CBX Corp. for equity manager Quintux Quantitative just minutes before the money manager called back and said it meant to buy 25,000 shares of CDX Corp. Borchard then purchased CDX shares for Quintux, but not before shares of CBX Corp. declined by 1.5%. The broker is holding the CBX shares in its own inventory.<\/p><p>Borchard proposes three methods for dealing with the trading error.<\/p><div class=\"tbl\"><table><tr><td>Method 1:<\/td><td>Quintux directs additional trades to Borchard worth a dollar value equal to the amount of the<\/td><\/tr><tr><td>trading loss.<\/td><td><\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the<\/td><\/tr><tr><td>costs of the trading error.<\/td><td><\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to<\/td><\/tr><tr><td>all of its clients on a pro-rata basis.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>When updating the proxy-voting policy to conform to CFA Institute recommendations, which of the following recommendations is least appropriate for Blanchard to adopt?<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "According to the Standards of Professional Conduct, Baldwin's most appropriate action regarding Teos Toys would be to:", "opts": ["refuse to have any involvement with Teos because of a conflict of interest arising from the firm’s other relationships with the company.", "complete an independent and objective analysis of Teos and issue a report disclosing the nature of business relationship with Teos Toys.", "provide a copy of the research report to analysts at reputable research outfits and ask for some input."], "ans": "B", "expl": "Analysts may undertake research related to firms with which they also have an investment banking relationship. The research must remain objective and unbiased to avoid violating the Code and Standards. Furthermore, the research report must fully disclose the nature of the investment banking relationship and any potential conflict of interest. For Further Reference: (Study Session 1, Module 2.9, LOS 2.a)", "explhtml": "<p>Analysts may undertake research related to firms with which they also have an investment banking relationship. The research must remain objective and unbiased to avoid violating the Code and Standards. Furthermore, the research report must fully disclose the nature of the investment banking relationship and any potential conflict of interest.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.9, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Blanchard Investments Case Scenario<\/p><p>Carol Blackwell, CFA, has been hired into the research department of Blanchard Investments. Blanchard&#x27;s manager, Thaddeus Baldwin, CFA, has worked in the securities business for more than 50 years. On Blackwell&#x27;s first day at the office, Baldwin gives her an incomplete research report on Tops Groceries, Inc., to finish up.<\/p><p>Upon researching Tops, information about the financial instability of Tops Groceries&#x27; largest customer surfaces. Blackwell revises the research report by lowering the earnings projections. The day the report is to be released, Blackwell learns that Baldwin has replaced the lower, revised earnings projections with his earlier estimates.<\/p><p>Baldwin realizes that many of the firm&#x27;s practices and policies would benefit from a compliance check. Baldwin wants Blackwell to ensure that the policies and procedures at the firm are in compliance.<\/p><p>While reviewing a draft research report on Patel, Inc., Blackwell notices that the research analyst responsible for authoring the report had used neural networks in forecasting revenues and earnings. Since that analyst was no longer employed at the firm, and Blackwell is not familiar with that specific quantitative tool, he deletes the segment pertaining to neural networks but otherwise does not change the report before signing off on it.<\/p><p>Blanchard&#x27;s investment banking department recently announced that they were successful in obtaining the account of Teos Toys, Inc. In light of this announcement, Baldwin wants to know whether he can continue to rate Teos&#x27; stock favorably.<\/p><p>During a local society luncheon, Blackwell is seated next to CFA candidate Lucas Walters, who has been assigned the task of creating a compliance manual for Borchard &amp; Sons, a small brokerage firm. Walters asks for her advice.<\/p><p>When Walters returns to work, he is apprised of the following situation: Borchard &amp; Sons purchased 25,000 shares of CBX Corp. for equity manager Quintux Quantitative just minutes before the money manager called back and said it meant to buy 25,000 shares of CDX Corp. Borchard then purchased CDX shares for Quintux, but not before shares of CBX Corp. declined by 1.5%. The broker is holding the CBX shares in its own inventory.<\/p><p>Borchard proposes three methods for dealing with the trading error.<\/p><div class=\"tbl\"><table><tr><td>Method 1:<\/td><td>Quintux directs additional trades to Borchard worth a dollar value equal to the amount of the<\/td><\/tr><tr><td>trading loss.<\/td><td><\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the<\/td><\/tr><tr><td>costs of the trading error.<\/td><td><\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to<\/td><\/tr><tr><td>all of its clients on a pro-rata basis.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>According to the Standards of Professional Conduct, Baldwin&#x27;s most appropriate action regarding Teos Toys would be to:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Does Blackwell violate any standard through his actions related to the research report on Patel, Inc.?", "opts": ["No.", "Yes, pertaining to diligence and reasonable basis.", "Yes, pertaining to disclosure of conflicts."], "ans": "B", "expl": "By removing the section pertaining to quantitative tools that Blackwell is not familiar with, the research report may not be grounded in adequate basis for recommendation. If Blackwell would have concluded that the output of the model did not contribute to the overall report, then he could have removed that model from analysis without violating the diligence and adequate basis standards. However, no such information is given in the case. For Further Reference: (Study Session 1, Module 2.8, LOS 2.a)", "explhtml": "<p>By removing the section pertaining to quantitative tools that Blackwell is not familiar with, the research report may not be grounded in adequate basis for recommendation. If Blackwell would have concluded that the output of the model did not contribute to the overall report, then he could have removed that model from analysis without violating the diligence and adequate basis standards. However, no such information is given in the case.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.8, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Blanchard Investments Case Scenario<\/p><p>Carol Blackwell, CFA, has been hired into the research department of Blanchard Investments. Blanchard&#x27;s manager, Thaddeus Baldwin, CFA, has worked in the securities business for more than 50 years. On Blackwell&#x27;s first day at the office, Baldwin gives her an incomplete research report on Tops Groceries, Inc., to finish up.<\/p><p>Upon researching Tops, information about the financial instability of Tops Groceries&#x27; largest customer surfaces. Blackwell revises the research report by lowering the earnings projections. The day the report is to be released, Blackwell learns that Baldwin has replaced the lower, revised earnings projections with his earlier estimates.<\/p><p>Baldwin realizes that many of the firm&#x27;s practices and policies would benefit from a compliance check. Baldwin wants Blackwell to ensure that the policies and procedures at the firm are in compliance.<\/p><p>While reviewing a draft research report on Patel, Inc., Blackwell notices that the research analyst responsible for authoring the report had used neural networks in forecasting revenues and earnings. Since that analyst was no longer employed at the firm, and Blackwell is not familiar with that specific quantitative tool, he deletes the segment pertaining to neural networks but otherwise does not change the report before signing off on it.<\/p><p>Blanchard&#x27;s investment banking department recently announced that they were successful in obtaining the account of Teos Toys, Inc. In light of this announcement, Baldwin wants to know whether he can continue to rate Teos&#x27; stock favorably.<\/p><p>During a local society luncheon, Blackwell is seated next to CFA candidate Lucas Walters, who has been assigned the task of creating a compliance manual for Borchard &amp; Sons, a small brokerage firm. Walters asks for her advice.<\/p><p>When Walters returns to work, he is apprised of the following situation: Borchard &amp; Sons purchased 25,000 shares of CBX Corp. for equity manager Quintux Quantitative just minutes before the money manager called back and said it meant to buy 25,000 shares of CDX Corp. Borchard then purchased CDX shares for Quintux, but not before shares of CBX Corp. declined by 1.5%. The broker is holding the CBX shares in its own inventory.<\/p><p>Borchard proposes three methods for dealing with the trading error.<\/p><div class=\"tbl\"><table><tr><td>Method 1:<\/td><td>Quintux directs additional trades to Borchard worth a dollar value equal to the amount of the<\/td><\/tr><tr><td>trading loss.<\/td><td><\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the<\/td><\/tr><tr><td>costs of the trading error.<\/td><td><\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to<\/td><\/tr><tr><td>all of its clients on a pro-rata basis.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Does Blackwell violate any standard through his actions related to the research report on Patel, Inc.?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "If Walters wants the manual to satisfy the requirements and recommendations of the Code and Standards, which of the following instructions is least appropriate to include in the section on fair dealing?", "opts": ["Whenever possible, disseminate investment recommendations to all clients at the same time.", "Execute all clients’ requested trades promptly and without comment, regardless of the company’s opinion on the stock being traded.", "Members of the investment-policy committee should not discuss possible changes in investment recommendations with anyone else in the firm until after an official decision has been made."], "ans": "B", "expl": "Standard III(B) Fair Dealing requires firms to notify clients of changes in investment advice before executing trades that go counter to that advice. While equal dissemination is usually impossible, it is an admirable goal. Firms should establish dissemination guidelines that are fair to all clients. Trading disclosures and confidentiality regarding investment rating changes are sensible precautions that meet the spirit of the fair dealing Standard. Maintaining client lists that detail client holdings will simplify the process of deciding how to best disseminate a change in investment recommendation. For Further Reference: (Study Session 1, Module 2.5, LOS 2.a)", "explhtml": "<p>Standard III(B) Fair Dealing requires firms to notify clients of changes in investment advice before executing trades that go counter to that advice. While equal dissemination is usually impossible, it is an admirable goal. Firms should establish dissemination guidelines that are fair to all clients. Trading disclosures and confidentiality regarding investment rating changes are sensible precautions that meet the spirit of the fair dealing Standard. Maintaining client lists that detail client holdings will simplify the process of deciding how to best disseminate a change in investment recommendation.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.5, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Blanchard Investments Case Scenario<\/p><p>Carol Blackwell, CFA, has been hired into the research department of Blanchard Investments. Blanchard&#x27;s manager, Thaddeus Baldwin, CFA, has worked in the securities business for more than 50 years. On Blackwell&#x27;s first day at the office, Baldwin gives her an incomplete research report on Tops Groceries, Inc., to finish up.<\/p><p>Upon researching Tops, information about the financial instability of Tops Groceries&#x27; largest customer surfaces. Blackwell revises the research report by lowering the earnings projections. The day the report is to be released, Blackwell learns that Baldwin has replaced the lower, revised earnings projections with his earlier estimates.<\/p><p>Baldwin realizes that many of the firm&#x27;s practices and policies would benefit from a compliance check. Baldwin wants Blackwell to ensure that the policies and procedures at the firm are in compliance.<\/p><p>While reviewing a draft research report on Patel, Inc., Blackwell notices that the research analyst responsible for authoring the report had used neural networks in forecasting revenues and earnings. Since that analyst was no longer employed at the firm, and Blackwell is not familiar with that specific quantitative tool, he deletes the segment pertaining to neural networks but otherwise does not change the report before signing off on it.<\/p><p>Blanchard&#x27;s investment banking department recently announced that they were successful in obtaining the account of Teos Toys, Inc. In light of this announcement, Baldwin wants to know whether he can continue to rate Teos&#x27; stock favorably.<\/p><p>During a local society luncheon, Blackwell is seated next to CFA candidate Lucas Walters, who has been assigned the task of creating a compliance manual for Borchard &amp; Sons, a small brokerage firm. Walters asks for her advice.<\/p><p>When Walters returns to work, he is apprised of the following situation: Borchard &amp; Sons purchased 25,000 shares of CBX Corp. for equity manager Quintux Quantitative just minutes before the money manager called back and said it meant to buy 25,000 shares of CDX Corp. Borchard then purchased CDX shares for Quintux, but not before shares of CBX Corp. declined by 1.5%. The broker is holding the CBX shares in its own inventory.<\/p><p>Borchard proposes three methods for dealing with the trading error.<\/p><div class=\"tbl\"><table><tr><td>Method 1:<\/td><td>Quintux directs additional trades to Borchard worth a dollar value equal to the amount of the<\/td><\/tr><tr><td>trading loss.<\/td><td><\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the<\/td><\/tr><tr><td>costs of the trading error.<\/td><td><\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to<\/td><\/tr><tr><td>all of its clients on a pro-rata basis.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>If Walters wants the manual to satisfy the requirements and recommendations of the Code and Standards, which of the following instructions is least appropriate to include in the section on fair dealing?<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Which method for dealing with the trading error is most consistent with the Code and Standards?", "opts": ["Method 1.", "Method 2.", "Method 3."], "ans": "B", "expl": "Method 2 is the best answer. Quintux should cover the cost of the trading error, and if Borchard is willing to accept investment research in lieu of cash, that's all the better for Quintux. If Quintux compensates Borchard with extra trades, its clients are covering the costs of the error, which may violate Standard III(A) Loyalty, Prudence, and Care if directing future trades to Borchard is not in the clients' best interest. By accepting the CBX shares it did not request and allocating the shares to all client accounts rather than paying for the error, Quintux is violating Standard III(C) Suitability, since the shares are not likely to be appropriate for all of its client accounts and may not be suitable for any accounts since the shares were obtained as a result of a trading error, not an intentional investment action. Passing on client names is a violation of Standard III(E) Preservation of Confidentiality. For Further Reference: (Study Session 1, Module 2.6, LOS 2.a)", "explhtml": "<p>Method 2 is the best answer. Quintux should cover the cost of the trading error, and if Borchard is willing to accept investment research in lieu of cash, that&#x27;s all the better for Quintux. If Quintux compensates Borchard with extra trades, its clients are covering the costs of the error, which may violate Standard III(A) Loyalty, Prudence, and Care if directing future trades to Borchard is not in the clients&#x27; best interest. By accepting the CBX shares it did not request and allocating the shares to all client accounts rather than paying for the error, Quintux is violating Standard III(C) Suitability, since the shares are not likely to be appropriate for all of its client accounts and may not be suitable for any accounts since the shares were obtained as a result of a trading error, not an intentional investment action. Passing on client names is a violation of Standard III(E) Preservation of Confidentiality.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.6, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Blanchard Investments Case Scenario<\/p><p>Carol Blackwell, CFA, has been hired into the research department of Blanchard Investments. Blanchard&#x27;s manager, Thaddeus Baldwin, CFA, has worked in the securities business for more than 50 years. On Blackwell&#x27;s first day at the office, Baldwin gives her an incomplete research report on Tops Groceries, Inc., to finish up.<\/p><p>Upon researching Tops, information about the financial instability of Tops Groceries&#x27; largest customer surfaces. Blackwell revises the research report by lowering the earnings projections. The day the report is to be released, Blackwell learns that Baldwin has replaced the lower, revised earnings projections with his earlier estimates.<\/p><p>Baldwin realizes that many of the firm&#x27;s practices and policies would benefit from a compliance check. Baldwin wants Blackwell to ensure that the policies and procedures at the firm are in compliance.<\/p><p>While reviewing a draft research report on Patel, Inc., Blackwell notices that the research analyst responsible for authoring the report had used neural networks in forecasting revenues and earnings. Since that analyst was no longer employed at the firm, and Blackwell is not familiar with that specific quantitative tool, he deletes the segment pertaining to neural networks but otherwise does not change the report before signing off on it.<\/p><p>Blanchard&#x27;s investment banking department recently announced that they were successful in obtaining the account of Teos Toys, Inc. In light of this announcement, Baldwin wants to know whether he can continue to rate Teos&#x27; stock favorably.<\/p><p>During a local society luncheon, Blackwell is seated next to CFA candidate Lucas Walters, who has been assigned the task of creating a compliance manual for Borchard &amp; Sons, a small brokerage firm. Walters asks for her advice.<\/p><p>When Walters returns to work, he is apprised of the following situation: Borchard &amp; Sons purchased 25,000 shares of CBX Corp. for equity manager Quintux Quantitative just minutes before the money manager called back and said it meant to buy 25,000 shares of CDX Corp. Borchard then purchased CDX shares for Quintux, but not before shares of CBX Corp. declined by 1.5%. The broker is holding the CBX shares in its own inventory.<\/p><p>Borchard proposes three methods for dealing with the trading error.<\/p><div class=\"tbl\"><table><tr><td>Method 1:<\/td><td>Quintux directs additional trades to Borchard worth a dollar value equal to the amount of the<\/td><\/tr><tr><td>trading loss.<\/td><td><\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the<\/td><\/tr><tr><td>costs of the trading error.<\/td><td><\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to<\/td><\/tr><tr><td>all of its clients on a pro-rata basis.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which method for dealing with the trading error is most consistent with the Code and Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Regarding Mehta's statements about steps in big data analysis:", "opts": ["only statement 1 is correct.", "only statement 2 is correct.", "both statements are correct."], "ans": "B", "expl": "Statement 1 is incorrect. The first several steps in data analysis for unstructured and structured data differ. Statement 2 is correct. Data exploration includes exploratory data analysis, feature selection, and feature engineering. For Further Reference: (Study Session 3, Module 8.1, 8.2, LOS 8.a, 8.c)", "explhtml": "<p>Statement 1 is incorrect. The first several steps in data analysis for unstructured and structured data differ. Statement 2 is correct. Data exploration includes exploratory data analysis, feature selection, and feature engineering.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 3, Module 8.1, 8.2, LOS 8.a, 8.c)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Quantitative Methods.<\/p><p>Lead Equity, LLP, Case Scenario<\/p><p>Mihir Kotak, CFA, is the managing partner at Lead Equity, LLP, a private equity firm based in southern California. Kotak has decided to revise the model the firm uses to identify attractive investment opportunities by supplementing the model with big data analysis. Kotak sets up a meeting with Ketan Mehta, the lead analyst with Big Solutions, Inc., a consulting company providing solutions related to big data.<\/p><p>During the meeting, Mehta makes the following statements about the steps involved in big data analysis.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The same steps are used in big data analysis whether we are using structured or unstructured<\/td><\/tr><tr><td>data.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The data exploration step is critical; it includes exploratory data analysis, feature selection, and<\/td><\/tr><tr><td>engineering.<\/td><td><\/td><\/tr><\/table><\/div><p>Kotak states that the model is intended to identify companies that would be likely takeover targets over the subsequent 12 months. Kotak says he is concerned that while the analysis may look attractive on paper, it could be inaccurate in making predictions. Specifically, Kotak wants to avoid the scenario where the model incorrectly identifies a company as a target.<\/p><p>Mehta illustrates the type of analytics that can be performed before the model is implemented in business operations. Confusion matrixes shows an excerpt of the report that Mehta provides for illustration.<\/p><p>Confusion matrixes<\/p><div class=\"tbl\"><table><tr><td>Model A<\/td><td>Model B<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td><\/td><td><\/td><\/tr><tr><td>Takeover<\/td><td>Not<\/td><td>Takeover<\/td><td>Not<\/td><td><\/td><td><\/td><\/tr><tr><td>Target<\/td><td>Target<\/td><td>Target<\/td><td>Target<\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>takeover<\/td><td>14<\/td><td>9<\/td><td>takeover<\/td><td>13<\/td><td>4<\/td><\/tr><tr><td>target<\/td><td>target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5<\/td><td>246<\/td><td>4<\/td><td>253<\/td><td><\/td><td><\/td><\/tr><tr><td>not target<\/td><td>not target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Mehta then discusses one of the possible approaches to applying big data analysis to the task at hand as shown in Steps in Data Analysis.<\/p><p>Steps in Data Analysis<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>We start with a sample consisting of the companies in the Russell 2000 Index and then assign<\/td><\/tr><tr><td>them to 50 heterogeneous (based on financial characteristics) buckets.<\/td><td><\/td><\/tr><tr><td>Step 2:<\/td><td>We then randomly select 10 stocks from each of the buckets to assign to one of two classes:<\/td><\/tr><tr><td>takeover target and not a takeover target, based on financial, nonfinancial, and textual data.<\/td><td><\/td><\/tr><\/table><\/div><p>Upon further discussion, Mehta makes the following comments about machine learning.<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Overfitting is an issue with unsupervised ML. Overfitting results when a large number of features<\/td><\/tr><tr><td>are included in the data sample.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>A learning curve plots the error rate in the validation or test sample versus the size of the training<\/td><\/tr><tr><td>sample.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Mehta&#x27;s statements about steps in big data analysis:<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "Based on Kotak's concerns about using the model to identify takeover targets, Kotak is most likely interested in increasing the model's:", "opts": ["accuracy score.", "F1 score.", "precision."], "ans": "C", "expl": "Kotak wants to minimize false positives (i.e., classifying companies that are not takeover targets as takeover targets), and hence, wants to minimize type I errors. An increase in a model's precision reduces its type I errors. A model's accuracy score generally minimizes overall type I and type II errors, and hence, is not the best answer choice. For Further Reference: (Study Session 3, Module 8.3, LOS 8.g)", "explhtml": "<p>Kotak wants to minimize false positives (i.e., classifying companies that are not takeover targets as takeover targets), and hence, wants to minimize type I errors. An increase in a model&#x27;s precision reduces its type I errors. A model&#x27;s accuracy score generally minimizes overall type I and type II errors, and hence, is not the best answer choice.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 3, Module 8.3, LOS 8.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Quantitative Methods.<\/p><p>Lead Equity, LLP, Case Scenario<\/p><p>Mihir Kotak, CFA, is the managing partner at Lead Equity, LLP, a private equity firm based in southern California. Kotak has decided to revise the model the firm uses to identify attractive investment opportunities by supplementing the model with big data analysis. Kotak sets up a meeting with Ketan Mehta, the lead analyst with Big Solutions, Inc., a consulting company providing solutions related to big data.<\/p><p>During the meeting, Mehta makes the following statements about the steps involved in big data analysis.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The same steps are used in big data analysis whether we are using structured or unstructured<\/td><\/tr><tr><td>data.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The data exploration step is critical; it includes exploratory data analysis, feature selection, and<\/td><\/tr><tr><td>engineering.<\/td><td><\/td><\/tr><\/table><\/div><p>Kotak states that the model is intended to identify companies that would be likely takeover targets over the subsequent 12 months. Kotak says he is concerned that while the analysis may look attractive on paper, it could be inaccurate in making predictions. Specifically, Kotak wants to avoid the scenario where the model incorrectly identifies a company as a target.<\/p><p>Mehta illustrates the type of analytics that can be performed before the model is implemented in business operations. Confusion matrixes shows an excerpt of the report that Mehta provides for illustration.<\/p><p>Confusion matrixes<\/p><div class=\"tbl\"><table><tr><td>Model A<\/td><td>Model B<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td><\/td><td><\/td><\/tr><tr><td>Takeover<\/td><td>Not<\/td><td>Takeover<\/td><td>Not<\/td><td><\/td><td><\/td><\/tr><tr><td>Target<\/td><td>Target<\/td><td>Target<\/td><td>Target<\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>takeover<\/td><td>14<\/td><td>9<\/td><td>takeover<\/td><td>13<\/td><td>4<\/td><\/tr><tr><td>target<\/td><td>target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5<\/td><td>246<\/td><td>4<\/td><td>253<\/td><td><\/td><td><\/td><\/tr><tr><td>not target<\/td><td>not target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Mehta then discusses one of the possible approaches to applying big data analysis to the task at hand as shown in Steps in Data Analysis.<\/p><p>Steps in Data Analysis<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>We start with a sample consisting of the companies in the Russell 2000 Index and then assign<\/td><\/tr><tr><td>them to 50 heterogeneous (based on financial characteristics) buckets.<\/td><td><\/td><\/tr><tr><td>Step 2:<\/td><td>We then randomly select 10 stocks from each of the buckets to assign to one of two classes:<\/td><\/tr><tr><td>takeover target and not a takeover target, based on financial, nonfinancial, and textual data.<\/td><td><\/td><\/tr><\/table><\/div><p>Upon further discussion, Mehta makes the following comments about machine learning.<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Overfitting is an issue with unsupervised ML. Overfitting results when a large number of features<\/td><\/tr><tr><td>are included in the data sample.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>A learning curve plots the error rate in the validation or test sample versus the size of the training<\/td><\/tr><tr><td>sample.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on Kotak&#x27;s concerns about using the model to identify takeover targets, Kotak is most likely interested in increasing the model&#x27;s:<\/p><\/div>", "subj": "quant"}, {"n": 9, "q": "Using information in Confusion matrixes, the model with highest precision and highest accuracy are respectively: Highest precision Highest accuracy", "opts": ["Model A Model B", "Model A Model A", "Model B Model B"], "ans": "C", "expl": "Precision (Model A) = 14 / (14 + 9) = 0.61 Precision (Model B) = 13 / (13 + 4) = 0.76 Accuracy (Model A) = (14 + 246) / (14 + 246 + 5 + 9) = 0.95 Accuracy (Model B) = (13 + 253) / (13 + 253 + 4 + 4) = 0.97 For Further Reference: (Study Session 3, Module 8.3, LOS 8.g)", "explhtml": "<p>Precision (Model A) = 14 / (14 + 9) = 0.61<\/p><p>Precision (Model B) = 13 / (13 + 4) = 0.76<\/p><p>Accuracy (Model A) = (14 + 246) / (14 + 246 + 5 + 9) = 0.95<\/p><p>Accuracy (Model B) = (13 + 253) / (13 + 253 + 4 + 4) = 0.97<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 3, Module 8.3, LOS 8.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Quantitative Methods.<\/p><p>Lead Equity, LLP, Case Scenario<\/p><p>Mihir Kotak, CFA, is the managing partner at Lead Equity, LLP, a private equity firm based in southern California. Kotak has decided to revise the model the firm uses to identify attractive investment opportunities by supplementing the model with big data analysis. Kotak sets up a meeting with Ketan Mehta, the lead analyst with Big Solutions, Inc., a consulting company providing solutions related to big data.<\/p><p>During the meeting, Mehta makes the following statements about the steps involved in big data analysis.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The same steps are used in big data analysis whether we are using structured or unstructured<\/td><\/tr><tr><td>data.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The data exploration step is critical; it includes exploratory data analysis, feature selection, and<\/td><\/tr><tr><td>engineering.<\/td><td><\/td><\/tr><\/table><\/div><p>Kotak states that the model is intended to identify companies that would be likely takeover targets over the subsequent 12 months. Kotak says he is concerned that while the analysis may look attractive on paper, it could be inaccurate in making predictions. Specifically, Kotak wants to avoid the scenario where the model incorrectly identifies a company as a target.<\/p><p>Mehta illustrates the type of analytics that can be performed before the model is implemented in business operations. Confusion matrixes shows an excerpt of the report that Mehta provides for illustration.<\/p><p>Confusion matrixes<\/p><div class=\"tbl\"><table><tr><td>Model A<\/td><td>Model B<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td><\/td><td><\/td><\/tr><tr><td>Takeover<\/td><td>Not<\/td><td>Takeover<\/td><td>Not<\/td><td><\/td><td><\/td><\/tr><tr><td>Target<\/td><td>Target<\/td><td>Target<\/td><td>Target<\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>takeover<\/td><td>14<\/td><td>9<\/td><td>takeover<\/td><td>13<\/td><td>4<\/td><\/tr><tr><td>target<\/td><td>target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5<\/td><td>246<\/td><td>4<\/td><td>253<\/td><td><\/td><td><\/td><\/tr><tr><td>not target<\/td><td>not target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Mehta then discusses one of the possible approaches to applying big data analysis to the task at hand as shown in Steps in Data Analysis.<\/p><p>Steps in Data Analysis<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>We start with a sample consisting of the companies in the Russell 2000 Index and then assign<\/td><\/tr><tr><td>them to 50 heterogeneous (based on financial characteristics) buckets.<\/td><td><\/td><\/tr><tr><td>Step 2:<\/td><td>We then randomly select 10 stocks from each of the buckets to assign to one of two classes:<\/td><\/tr><tr><td>takeover target and not a takeover target, based on financial, nonfinancial, and textual data.<\/td><td><\/td><\/tr><\/table><\/div><p>Upon further discussion, Mehta makes the following comments about machine learning.<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Overfitting is an issue with unsupervised ML. Overfitting results when a large number of features<\/td><\/tr><tr><td>are included in the data sample.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>A learning curve plots the error rate in the validation or test sample versus the size of the training<\/td><\/tr><tr><td>sample.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using information in  Confusion matrixes, the model with highest precision and highest accuracy are respectively:<\/p><div class=\"tbl\"><table><tr><td>Highest precision<\/td><td>Highest accuracy<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 10, "q": "Based on information in Exhibit 2, the value of the hyperparameter specified in Steps in Data Analysis is:", "opts": ["10.", "50.", "2,000."], "ans": "B", "expl": "The hyperparameter k in the k-means clustering algorithm refers to the number of buckets (50, in this case) used to create heterogeneous clusters of companies for analysis. For Further Reference: (Study Session 3, Module 7.3, LOS 7.d)", "explhtml": "<p>The hyperparameter k in the k-means clustering algorithm refers to the number of buckets (50, in this case) used to create heterogeneous clusters of companies for analysis.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 3, Module 7.3, LOS 7.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Quantitative Methods.<\/p><p>Lead Equity, LLP, Case Scenario<\/p><p>Mihir Kotak, CFA, is the managing partner at Lead Equity, LLP, a private equity firm based in southern California. Kotak has decided to revise the model the firm uses to identify attractive investment opportunities by supplementing the model with big data analysis. Kotak sets up a meeting with Ketan Mehta, the lead analyst with Big Solutions, Inc., a consulting company providing solutions related to big data.<\/p><p>During the meeting, Mehta makes the following statements about the steps involved in big data analysis.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>The same steps are used in big data analysis whether we are using structured or unstructured<\/td><\/tr><tr><td>data.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The data exploration step is critical; it includes exploratory data analysis, feature selection, and<\/td><\/tr><tr><td>engineering.<\/td><td><\/td><\/tr><\/table><\/div><p>Kotak states that the model is intended to identify companies that would be likely takeover targets over the subsequent 12 months. Kotak says he is concerned that while the analysis may look attractive on paper, it could be inaccurate in making predictions. Specifically, Kotak wants to avoid the scenario where the model incorrectly identifies a company as a target.<\/p><p>Mehta illustrates the type of analytics that can be performed before the model is implemented in business operations. Confusion matrixes shows an excerpt of the report that Mehta provides for illustration.<\/p><p>Confusion matrixes<\/p><div class=\"tbl\"><table><tr><td>Model A<\/td><td>Model B<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td>Actual:<\/td><td><\/td><td><\/td><\/tr><tr><td>Takeover<\/td><td>Not<\/td><td>Takeover<\/td><td>Not<\/td><td><\/td><td><\/td><\/tr><tr><td>Target<\/td><td>Target<\/td><td>Target<\/td><td>Target<\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>takeover<\/td><td>14<\/td><td>9<\/td><td>takeover<\/td><td>13<\/td><td>4<\/td><\/tr><tr><td>target<\/td><td>target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prediction:<\/td><td>Prediction:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>5<\/td><td>246<\/td><td>4<\/td><td>253<\/td><td><\/td><td><\/td><\/tr><tr><td>not target<\/td><td>not target<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Mehta then discusses one of the possible approaches to applying big data analysis to the task at hand as shown in Steps in Data Analysis.<\/p><p>Steps in Data Analysis<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>We start with a sample consisting of the companies in the Russell 2000 Index and then assign<\/td><\/tr><tr><td>them to 50 heterogeneous (based on financial characteristics) buckets.<\/td><td><\/td><\/tr><tr><td>Step 2:<\/td><td>We then randomly select 10 stocks from each of the buckets to assign to one of two classes:<\/td><\/tr><tr><td>takeover target and not a takeover target, based on financial, nonfinancial, and textual data.<\/td><td><\/td><\/tr><\/table><\/div><p>Upon further discussion, Mehta makes the following comments about machine learning.<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>Overfitting is an issue with unsupervised ML. Overfitting results when a large number of features<\/td><\/tr><tr><td>are included in the data sample.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>A learning curve plots the error rate in the validation or test sample versus the size of the training<\/td><\/tr><tr><td>sample.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on information in Exhibit 2, the value of the hyperparameter specified in  Steps in Data Analysis is:<\/p><\/div>", "subj": "quant"}, {"n": 11, "q": "The approach identified in step 2 of Exhibit 2 is most likely to represent:", "opts": ["supervised learning to predict a categorical target variable.", "unsupervised learning to predict a categorical target variable.", "supervised learning to predict a continuous target variable."], "ans": "A", "expl": "Supervised learning is appropriate when a target variable is specified. This target variable is categorical (i.e., takeover target or not a takeover target). For Further Reference: (Study Session 3, Module 7.1, LOS 7.a)", "explhtml": "<p>Supervised learning is appropriate when a target variable is specified. This target variable is categorical (i.e., takeover target or not a takeover target).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 3, Module 7.1, LOS 7.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case ·
