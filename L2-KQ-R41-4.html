<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 41.4 — Guidance for Standards III(A) · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  .back-btn{font-weight:600}

  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));

  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);

  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->

<script>
const DATA = [{"n": 1, "q": "An independent analyst has only one client. One of the client's largest holdings is a brokerage firm. Because of the large holding by his client, the brokerage firm recently began allowing the analyst to tap into the firm's computer network to use the firm's research facilities. This is allowable as long as the analyst:", "opts": ["does both of the actions listed here.", "discloses the relationship to the client.", "uses the resources to help manage the client's account."], "ans": "A", "expl": "According to Standard III(A), Loyalty, Prudence, and Care, the analyst must put the client first and inform the client of any possible conflicts of interest. The analyst must channel any benefits derived from his service to the client, back to the client, and inform the client of the benefits.", "explhtml": "<p>According to Standard III(A), Loyalty, Prudence, and Care, the analyst must put the client first and inform the client of any possible conflicts of interest. The analyst must channel any benefits derived from his service to the client, back to the client, and inform the client of the benefits.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>An independent analyst has only one client. One of the client&#x27;s largest holdings is a brokerage firm. Because of the large holding by his client, the brokerage firm recently began allowing the analyst to tap into the firm&#x27;s computer network to use the firm&#x27;s research facilities. This is allowable as long as the analyst:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Alan Cramer, CFA, practices in a country that does not regulate the investment of company retirement plans. He was retained by Bingham Companies to manage their corporate pension plan. Bingham's management has approached Cramer and requested that Cramer invest the entire plan in Bingham stock. Cramer may:", "opts": ["invest all of the retirement plan assets in Bingham Company stock according to management's request only if Cramer can document that the investment is more prudent than any other investment opportunity he finds.", "not invest any of Bingham Company's retirement plan in its own stock regardless of the stock's prospects and in spite of management's request.", "invest a portion of the retirement plan in Bingham Company stock if the investment is prudent and if he keeps the overall portfolio properly diversified."], "ans": "C", "expl": "Standard III(A), Loyalty, Prudence, and Care, requires members to comply with their fiduciary duty. Retirement plan managers owe their duty to the plan participants, not to the management of the company sponsoring the plan. The fiduciary duty includes the obligation to diversify the plan's investments, regardless of the quality of the sponsoring company's stock. Investing in the company's stock is not prohibited.", "explhtml": "<p>Standard III(A), Loyalty, Prudence, and Care, requires members to comply with their fiduciary duty. Retirement plan managers owe their duty to the plan participants, not to the management of the company sponsoring the plan. The fiduciary duty includes the obligation to diversify the plan&#x27;s investments, regardless of the quality of the sponsoring company&#x27;s stock. Investing in the company&#x27;s stock is not prohibited.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>Alan Cramer, CFA, practices in a country that does not regulate the investment of company retirement plans. He was retained by Bingham Companies to manage their corporate pension plan. Bingham&#x27;s management has approached Cramer and requested that Cramer invest the entire plan in Bingham stock.<\/p><p>Cramer may:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Jack Stevens is employed by a company to provide investment advice to participants in the firm's 401(k) plan. One of the investment options is a stable value fund run by the company. Stevens' research indicates that the fund is far riskier and less liquid than the typical stable value fund and has a fundamental asset value lower than the book value of the assets. He tells Jessica Cox, the head of employee benefits, about his research, and indicates that he will advise new employees to not invest in the fund and will advise employees who already own the fund to reduce their holdings in the fund. Cox points out that the fund is not in any current danger because there are very few redemptions requested of the fund. Cox also states that a sell recommendation may become a self fulfilling prophecy, causing investors to redeem their shares and forcing the fund to liquidate, which in turn will cause the remaining investors to receive less than their promised value. Stevens agrees with this assessment and feels his fiduciary duty is to all employees. Stevens should:", "opts": ["continue to recommend that new investors do not invest in the fund, but not advise existing investors to reduce their holdings.", "continue to recommend that new investors do not invest in the fund and existing investors reduce their holdings.", "tell investors he cannot give advice on the fund because of a conflict of interest."], "ans": "B", "expl": "The employees to whom Stevens owes fiduciary duty are the ones who are seeking his advice, even if acting on that advice hurts other employees who might eventually become clients. ", "explhtml": "<p>The employees to whom Stevens owes fiduciary duty are the ones who are seeking his advice, even if acting on that advice hurts other employees who might eventually become clients. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41.a<\/div><div class=\"qtext\"><p>Jack Stevens is employed by a company to provide investment advice to participants in the firm&#x27;s 401(k) plan. One of the investment options is a stable value fund run by the company. Stevens&#x27; research indicates that the fund is far riskier and less liquid than the typical stable value fund and has a fundamental asset value lower than the book value of the assets. He tells Jessica Cox, the head of employee benefits, about his research, and indicates that he will advise new employees to not invest in the fund and will advise employees who already own the fund to reduce their holdings in the fund. Cox points out that the fund is not in any current danger because there are very few redemptions requested of the fund. Cox also states that a sell recommendation may become a self fulfilling prophecy, causing investors to redeem their shares and forcing the fund to liquidate, which in turn will cause the remaining investors to receive less than their promised value. Stevens agrees with this assessment and feels his fiduciary duty is to all employees. Stevens should:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Perley & Sons is an investment advisor company that just signed a contract with full discretionary power for the management of assets for Bright Future, a charitable fund. Without consultation, portfolio manager Martin Brown, CFA, decides to trade the funds' assets through a brokerage firm that provides, as an additional benefit, research reports for companies in the microchip industry. These companies represent the main investment interest for most of the Perley & Sons clients. The Bright Future portfolio does not hold any equities in the microchip industry, and, because of its risk profile, is unlikely to ever do so. Which of the following activities represents a possible breach with the CFA Institute standards?", "opts": ["Exercising a selection principle that does not comply with the idea of best trade price and execution.", "Lack of action in consulting with the client before choosing the brokerage firm.", "Accepting research reports from the brokerage firm that do not benefit client portfolios."], "ans": "A", "expl": "The problem refers to the fiduciary duties of the analyst and brokerage contracts involving soft money. Trades placed with a broker that provides the firm with research are implicitly paying for the research. In a competitive marketplace, it is probable that the trades could have been as effectively placed with a broker that was able to provide research that would apply to the holdings of Bright Future. According to Standard III(A) Loyalty, Prudence, and Care, it is permissible to direct trades of the client portfolio through a broker who provides research that does not directly benefit the client portfolio, but the client should be informed about the situation.", "explhtml": "<p>The problem refers to the fiduciary duties of the analyst and brokerage contracts involving soft money. Trades placed with a broker that provides the firm with research are implicitly paying for the research. In a competitive marketplace, it is probable that the trades could have been as effectively placed with a broker that was able to provide research that would apply to the holdings of Bright Future. According to Standard III(A) Loyalty, Prudence, and Care, it is permissible to direct trades of the client portfolio through a broker who provides research that does not directly benefit the client portfolio, but the client should be informed about the situation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41.a<\/div><div class=\"qtext\"><p>Perley &amp; Sons is an investment advisor company that just signed a contract with full discretionary power for the management of assets for Bright Future, a charitable fund. Without consultation, portfolio manager Martin Brown, CFA, decides to trade the funds&#x27; assets through a brokerage firm that provides, as an additional benefit, research reports for companies in the microchip industry. These companies represent the main investment interest for most of the Perley &amp; Sons clients. The Bright Future portfolio does not hold any equities in the microchip industry, and, because of its risk profile, is unlikely to ever do so. Which of the following activities represents a possible breach with the CFA Institute standards?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "All of the following would be effective components of a formal compliance system EXCEPT:", "opts": ["the firm prohibits analysts and portfolio managers from using material nonpublic information in making investment recommendations or taking investment action.", "the investor's objectives and constraints should be maintained and reviewed periodically to reflect any changes in the client's circumstances.", "as a fiduciary under ERISA, the firm will strictly follow pension plan instructions and restrictions, which may include concentrating portfolios in a few securities or industries."], "ans": "C", "expl": "According to Standard III(A)—Loyalty, Prudence, and Care, \"members shall use particular care in determining applicable fiduciary duty.\" Under ERISA, a fiduciary has the duty to diversify the plan's investments in order to protect it from the risk of substantial loss. The firm must follow pension plan instructions and restrictions unless they conflict with ERISA or other applicable laws and regulations. Having concentrated portfolios does not constitute effective diversification. An appropriate policy statement would be: \" The firm will follow pension plan documents only to the extent that they are consistent with applicable laws and regulations. The firm will diversify plan assets to minimize the risk of loss.\"", "explhtml": "<p>According to Standard III(A)—Loyalty, Prudence, and Care, &quot;members shall use particular care in determining applicable fiduciary duty.&quot; Under ERISA, a fiduciary has the duty to diversify the plan&#x27;s investments in order to protect it from the risk of substantial loss. The firm must follow pension plan instructions and restrictions unless they conflict with ERISA or other applicable laws and regulations. Having concentrated portfolios does not constitute effective diversification. An appropriate policy statement would be: &quot; The firm will follow pension plan documents only to the extent that they are consistent with applicable laws and regulations. The firm will diversify plan assets to minimize the risk of loss.&quot;<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41.a<\/div><div class=\"qtext\"><p>All of the following would be effective components of a formal compliance system EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Which of the following would be the least important proxy issue?", "opts": ["Takeover defense and related actions.", "Compensation plans for officers.", "Election of internal auditors."], "ans": "C", "expl": "Election of internal auditors is not a major proxy issue.", "explhtml": "<p>Election of internal auditors is not a major proxy issue.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>Which of the following would be the least important proxy issue?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Sharon Pope has been asked by the Chief Investment Officer to develop a firm-wide policy for proxy voting. Which of the following would NOT be acceptable to include in the policy statement?", "opts": ["Portfolio managers of active funds must vote in all proxies; portfolio managers of index funds should vote only when they have a definitive opinion.", "Voting proxies may not be necessary in all instances.", "The value of proxy voting must be maximized."], "ans": "A", "expl": "Proxies for stocks in passively managed funds must also be voted. A cost-benefit analysis may show that voting all proxies may not benefit all clients. ", "explhtml": "<p>Proxies for stocks in passively managed funds must also be voted. A cost-benefit analysis may show that voting all proxies may not benefit all clients. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>Sharon Pope has been asked by the Chief Investment Officer to develop a firm-wide policy for proxy voting. Which of the following would NOT be acceptable to include in the policy statement?<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto. Calaveccio places a trade with Quantco Brokerage. While Calaveccio's part of the transaction was conveyed correctly to Quantco, there was a trading error made in Calaveccio's account due to a slip up within Quantco. Calaveccio realizes that the error has taken place, and informs his contact at Quantco. Calaveccio allows Quantco to cover the error, with no cost to TrustCo. This is:", "opts": ["permissible under CFA Institute Standards.", "a violation of Calaveccio's fiduciary duties.", "a violation of Calaveccio's duty to his employer."], "ans": "A", "expl": "The issue is similar to an allocation of soft dollars. Clearly, if the broker absorbs the loss, they expect to make up the difference in some way. However, since the error was on the part of Quantco Brokerage, Calaveccio is under no obligation to cover the cost of the trading error. Moreover, no reasonable observer expects that there exists any implied future allocation of trades to Quantco in return for correcting their own mistake. There is no violation of Standard III(A), Loyalty, Prudence, and Care.", "explhtml": "<p>The issue is similar to an allocation of soft dollars. Clearly, if the broker absorbs the loss, they expect to make up the difference in some way. However, since the error was on the part of Quantco Brokerage, Calaveccio is under no obligation to cover the cost of the trading error. Moreover, no reasonable observer expects that there exists any implied future allocation of trades to Quantco in return for correcting their own mistake. There is no violation of Standard III(A), Loyalty, Prudence, and Care.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto. Calaveccio places a trade with Quantco Brokerage. While Calaveccio&#x27;s part of the transaction was conveyed correctly to Quantco, there was a trading error made in Calaveccio&#x27;s account due to a slip up within Quantco. Calaveccio realizes that the error has taken place, and informs his contact at Quantco. Calaveccio allows Quantco to cover the error, with no cost to TrustCo. This is:<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto. He places trades for the fund with Canadian Brokerage. Canadian provides Calaveccio with soft dollars to purchase research. He uses these soft dollars to get research reports from Canadian's research department regarding the issues currently held in the small cap portfolio, and also for firms he is contemplating adding to the portfolio. By using soft dollars in this manner, Calaveccio has:", "opts": ["not violated the Code and Standards.", "violated the Code and Standards by acquiring research on issues contemplated for purchase but not by acquiring research on currently held issues.", "violated the Code and Standards by acquiring research on issues that the fund already holds but not by acquiring research on issues contemplated for purchase."], "ans": "A", "expl": "\"Soft dollars\" are the property of the client (in this case the holders of the shares of the Small Cap Venture Fund). Standard III(A) Loyalty, Prudence, and Care delineates the member's responsibilities. Since he is clearly using the soft dollars to obtain research that is directly applicable to his professional duties, there is no violation of the Standard.", "explhtml": "<p>&quot;Soft dollars&quot; are the property of the client (in this case the holders of the shares of the Small Cap Venture Fund). Standard III(A) Loyalty, Prudence, and Care delineates the member&#x27;s responsibilities. Since he is clearly using the soft dollars to obtain research that is directly applicable to his professional duties, there is no violation of the Standard.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto. He places trades for the fund with Canadian Brokerage. Canadian provides Calaveccio with soft dollars to purchase research. He uses these soft dollars to get research reports from Canadian&#x27;s research department regarding the issues currently held in the small cap portfolio, and also for firms he is contemplating adding to the portfolio. By using soft dollars in this manner, Calaveccio has:<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "Mohawk Asset Management buys on-the-run Treasuries at auction for its standard fee accounts. When these move off-the-run, they are placed in performance-based accounts via in-house cross-trades at prevailing market prices, and replaced in the standard fee accounts with new on-the-run issues. Which standard is violated, if any?", "opts": ["The Standard concerning Fiduciary Duty.", "No Standard is violated.", "The Standard concerning Priority of Transactions."], "ans": "A", "expl": "In addition to being a violation of the Standard concerning Fair Dealing, this constitutes a violation of Mohawk's Fiduciary Duty. Why? Because the on-the-run issues are benchmarks and trade at lower yields than the off-the-run issues. In essence, the off-the-run issues have marginally higher returns, and this will boost the returns in the performance-based fee accounts. Mohawk is allocating trades based upon compensation arrangements, and this is not permissible under the Code and Standards.", "explhtml": "<p>In addition to being a violation of the Standard concerning Fair Dealing, this constitutes a violation of Mohawk&#x27;s Fiduciary Duty. Why? Because the on-the-run issues are benchmarks and trade at lower yields than the off-the-run issues. In essence, the off-the-run issues have marginally higher returns, and this will boost the returns in the performance-based fee accounts. Mohawk is allocating trades based upon compensation arrangements, and this is not permissible under the Code and Standards.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>Mohawk Asset Management buys on-the-run Treasuries at auction for its standard fee accounts. When these move off-the-run, they are placed in performance-based accounts via in-house cross-trades at prevailing market prices, and replaced in the standard fee accounts with new on-the-run issues. Which standard is violated, if any?<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "Which of the following statements about soft dollars is least accurate?", "opts": ["Directed brokerage are soft dollars to be used for research that benefits the investment firm.", "Soft dollars are third party research arrangements.", "Soft dollars are assets of the client."], "ans": "A", "expl": "Directed brokerage are soft dollars directed by the client to the investment manager to pay for goods and services that benefits the client only and not the firm.", "explhtml": "<p>Directed brokerage are soft dollars directed by the client to the investment manager to pay for goods and services that benefits the client only and not the firm.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41.a<\/div><div class=\"qtext\"><p>Which of the following statements about soft dollars is least accurate?<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "When a firm seeks to allocate a disproportionate number of shares of a hot IPO to performance-based fee accounts this constitutes a violation of the Standard concerning:", "opts": ["priority of transactions.", "additional compensation arrangements.", "fiduciary duty."], "ans": "C", "expl": "The allocation of a disproportionate number of shares to performance-based fee accounts constitutes a violation of fiduciary duty, in addition to being a violation of the Standard concerning fair dealing.", "explhtml": "<p>The allocation of a disproportionate number of shares to performance-based fee accounts constitutes a violation of fiduciary duty, in addition to being a violation of the Standard concerning fair dealing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>When a firm seeks to allocate a disproportionate number of shares of a hot IPO to performance-based fee accounts this constitutes a violation of the Standard concerning:<\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "Brenda Simone is a money manager and the Blue Streets Pension Fund is one of her clients. The director of the pension fund calls Simone and asks her to use a particular broker so that the fund can obtain some research services with the soft dollars from that broker. Simone believes that the desired broker will provide the same price and execution as the normal broker that Simone uses. Simone does as the client wishes. Simone has:", "opts": ["not violated the Standards as long as the research provided by the broker will benefit Blue Streets.", "violated the Standards.", "not violated the Standards as long as the research provided by the broker will benefit the plan beneficiaries."], "ans": "C", "expl": "Simone must ensure that the research benefits the parties to whom she owes fiduciary duty, which are the plan participants. ", "explhtml": "<p>Simone must ensure that the research benefits the parties to whom she owes fiduciary duty, which are the plan participants. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41.b<\/div><div class=\"qtext\"><p>Brenda Simone is a money manager and the Blue Streets Pension Fund is one of her clients. The director of the pension fund calls Simone and asks her to use a particular broker so that the fund can obtain some research services with the soft dollars from that broker. Simone believes that the desired broker will provide the same price and execution as the normal broker that Simone uses. Simone does as the client wishes. Simone has:<\/p><\/div>", "subj": "ethics"}, {"n": 14, "q": "Ed Staples, CFA, manages a pension fund sponsored by Hill Corporation. The Code and Standards most likely require Staples to:", "opts": ["support the sponsor's management during proxy fights.", "act solely in the interest of the ultimate beneficiaries.", "base investment decisions on each beneficiary’s return requirements and risk tolerance."], "ans": "B", "expl": "Standard III(A) Loyalty, Prudence, and Care requires members and candidates who manage investment funds to act in the interest of the beneficiaries. However, the Standard states that fund managers' investment decisions are not required to be based on the investment needs of each fund investor, but rather should benefit the investors as a whole. In voting proxies, the beneficiaries' interest must prevail over management's interest.", "explhtml": "<p>Standard III(A) Loyalty, Prudence, and Care requires members and candidates who manage investment funds to act in the interest of the beneficiaries. However, the Standard states that fund managers&#x27; investment decisions are not required to be based on the investment needs of each fund investor, but rather should benefit the investors as a whole. In voting proxies, the beneficiaries&#x27; interest must prevail over management&#x27;s interest.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>Ed Staples, CFA, manages a pension fund sponsored by Hill Corporation. The Code and Standards most likely require Staples to:<\/p><\/div>", "subj": "ethics"}, {"n": 15, "q": "Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto. He places trades for the fund with River City Brokerage. River City provides Calaveccio with soft dollars to purchase research. River City also deals in municipal bonds, some of which Calaveccio holds in his personal portfolio. He periodically uses the soft dollars to request research reports on various small cap stocks and also on the status of the municipal bond market and issues that he holds. These actions are:", "opts": ["in violation of his fiduciary duties regarding both the small cap research and the municipal bond research.", "in violation of his fiduciary duties regarding the municipal bond research but not so regarding the research on the small cap issues.", "not in violation of the Code and Standards."], "ans": "B", "expl": "The issue at hand is the member's fiduciary responsibilities in handling \"soft dollars\" which are technically the property of the client. Standard III(A), Loyalty, Prudence, and Care, delineates the member's fiduciary responsibilities with regard to soft dollars. Since municipal bond research is clearly not relevant to the Small Cap Fund holders, he is clearly using the soft dollars to obtain research for his personal benefit and is in violation of the Standard.", "explhtml": "<p>The issue at hand is the member&#x27;s fiduciary responsibilities in handling &quot;soft dollars&quot; which are technically the property of the client. Standard III(A), Loyalty, Prudence, and Care, delineates the member&#x27;s fiduciary responsibilities with regard to soft dollars. Since municipal bond research is clearly not relevant to the Small Cap Fund holders, he is clearly using the soft dollars to obtain research for his personal benefit and is in violation of the Standard.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41: III(A)<\/div><div class=\"qtext\"><p>Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto. He places trades for the fund with River City Brokerage. River City provides Calaveccio with soft dollars to purchase research. River City also deals in municipal bonds, some of which Calaveccio holds in his personal portfolio. He periodically uses the soft dollars to request research reports on various small cap stocks and also on the status of the municipal bond market and issues that he holds. These actions are:<\/p><\/div>", "subj": "ethics"}, {"n": 16, "q": "Jordan Conomos is the new trustee for the Grant Trust, which has both current beneficiaries and remaindermen. Up until now, the trust has been entirely invested in long-term tax-free municipal bonds. Conomos decides to put 30 percent of the assets in common stocks, with the justification that taxes should be the concern of the trust beneficiaries and not the trust, and the trust needs some diversification and growth. Conomos is:", "opts": ["violating his fiduciary duty by not investing solely for the purposes of the current beneficiaries.", "violating his fiduciary duty by not considering taxes.", "not violating his fiduciary duty."], "ans": "B", "expl": "The trustee must consider tax liabilities of beneficiaries. However, he should also provide diversification and be concerned with the desires of the remaindermen. (Remaindermen refers to the group that is to receive the remainder of the trust once its term is complete. Of course, some trusts never expire so not every trust has remaindermen.)", "explhtml": "<p>The trustee must consider tax liabilities of beneficiaries. However, he should also provide diversification and be concerned with the desires of the remaindermen. (Remaindermen refers to the group that is to receive the remainder of the trust once its term is complete. Of course, some trusts never expire so not every trust has remaindermen.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.4, LOS 41.a<\/div><div class=\"qtext\"><p>Jordan Conomos is the new trustee for the Grant Trust, which has both current beneficiaries and remaindermen. Up until now, the trust has been entirely invested in long-term tax-free municipal bonds. Conomos decides to put 30 percent of the assets in common stocks, with the justification that taxes should be the concern of the trust beneficiaries and not the t const CFG = {"title": "Reading 41.4 — Guidance for Standards III(A)", "subtitle": "CFA Level II · 22 câu · Kaplan Schweser QBank 2025", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

(function(){

    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);

})();

  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
