tal liabilities &amp; equity<\/td><td>$181<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Additional Information<\/b><\/p><p>YD uses the FIFO method of inventory valuation. 2018 cash operating taxes equal $15 million. This amount includes all appropriate tax adjustments. 2018 NOPAT was estimated to be $42 million. Haas believes that YD will have a 17% ROE and a 10% long-term growth rate over the foreseeable future. Haas estimates YD&#x27;s cost of equity to be 15.0%. YD expects annual capital expenditures to remain at about $37 million. YD&#x27;s stock currently trades at $15.50 per share. YD&#x27;s bonds are currently trading at par value. YD&#x27;s total adjusted capital base was $200 million at the end of 2017.<\/p><p>Haas makes the following statements during her YD presentation to the investment committee:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Based on ROE mean reversion, YD&#x27;s continuing residual income is assumed to decline to zero<\/td><\/tr><tr><td>over time.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The residual income model states that if YD&#x27;s ROE equals its equity cost of capital, then YD&#x27;s<\/td><\/tr><tr><td>intrinsic value will equal its book value per share.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, YD&#x27;s weighted average cost of capital (WACC) is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 27, "q": "For this question only, assume a weighted average cost of capital (WACC) of 12.0%. YD's economic value added (EVA) during the year 2018 is closest to:", "opts": ["$6 million.", "$18 million.", "$24 million."], "ans": "B", "expl": "$WACC = WACC × capital = 0.12 × 200 = 24 EVA = NOPAT − $WACC = 42 − 24 = 18 For Further Reference: (Study Session 11, Module 30.1, LOS 30.a)", "explhtml": "<p>$WACC = WACC × capital = 0.12 × 200 = 24 EVA = NOPAT − $WACC = 42 − 24 = 18<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 30.1, LOS 30.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Equity Valuation.<\/p><p>Yummy Doughnuts Case Scenario<\/p><p>Yummy Doughnuts (YD) sells a variety of doughnuts and other related items through both company-owned locations and franchise locations. YD has experienced significant growth over the past five years. However, barriers to entry are low and competition is increasing.<\/p><p>Linda Haas, CFA, follows YD for Gibraltar Capital. Gibraltar Capital prides itself on its thorough fundamental analysis of investment opportunities. The company uses a bottom-up approach to the investment process. Haas&#x27;s security selection process utilizes residual income models to determine a stock&#x27;s intrinsic value. Haas obtains YD&#x27;s 2018 financial statements shown in Exhibit 1. In addition, Haas provides supporting information about YD&#x27;s financials and other related material found in Exhibit 2.<\/p><p><b>Exhibit 1: Yummy Doughnuts&#x27;s 2018 Income Statement and Balance Sheet<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions, except for per share items<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Revenue<\/td><td>$300<\/td><td><\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$205<\/td><td><\/td><\/tr><tr><td>SG&amp;A<\/td><td>$40<\/td><td><\/td><\/tr><tr><td>Depreciation expense<\/td><td>$6<\/td><td><\/td><\/tr><tr><td>Income from operations<\/td><td>$49<\/td><td><\/td><\/tr><tr><td>Interest expense<\/td><td>$1<\/td><td><\/td><\/tr><tr><td>Pretax income<\/td><td>$48<\/td><td><\/td><\/tr><tr><td>Income tax (40% tax rate)<\/td><td>$19<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>$29<\/td><td><\/td><\/tr><tr><td>Shares outstanding<\/td><td>18.6<\/td><td><\/td><\/tr><tr><td>EPS<\/td><td>$1.56<\/td><td><\/td><\/tr><tr><td>In millions<\/td><td>2018<\/td><td>2018<\/td><\/tr><tr><td>Assets<\/td><td>Liabilities and equity<\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>$15 Accounts payable<\/td><td>$12<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$27 Accrued expenses<\/td><td>$26<\/td><\/tr><tr><td>Inventory<\/td><td>$16 Current liabilities<\/td><td>$38<\/td><\/tr><tr><td>Current assets<\/td><td>$58<\/td><td><\/td><\/tr><tr><td>Property and equipment<\/td><td>$113 Total long-term debt (7% coupon, at par value)<\/td><td>$12<\/td><\/tr><tr><td>Long-term investments<\/td><td>$10 Equity<\/td><td>$131<\/td><\/tr><tr><td>Total assets<\/td><td>$181 Total liabilities &amp; equity<\/td><td>$181<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Additional Information<\/b><\/p><p>YD uses the FIFO method of inventory valuation. 2018 cash operating taxes equal $15 million. This amount includes all appropriate tax adjustments. 2018 NOPAT was estimated to be $42 million. Haas believes that YD will have a 17% ROE and a 10% long-term growth rate over the foreseeable future. Haas estimates YD&#x27;s cost of equity to be 15.0%. YD expects annual capital expenditures to remain at about $37 million. YD&#x27;s stock currently trades at $15.50 per share. YD&#x27;s bonds are currently trading at par value. YD&#x27;s total adjusted capital base was $200 million at the end of 2017.<\/p><p>Haas makes the following statements during her YD presentation to the investment committee:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Based on ROE mean reversion, YD&#x27;s continuing residual income is assumed to decline to zero<\/td><\/tr><tr><td>over time.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The residual income model states that if YD&#x27;s ROE equals its equity cost of capital, then YD&#x27;s<\/td><\/tr><tr><td>intrinsic value will equal its book value per share.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>For this question only, assume a weighted average cost of capital (WACC) of 12.0%. YD&#x27;s economic value added (EVA) during the year 2018 is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 28, "q": "Based on Exhibit 1, Exhibit 2, and the single-stage residual in come model, YD's intrinsic value is closest to:", "opts": ["$8.00 per share.", "$10.00 per share.", "$12.00 per share."], "ans": "B", "expl": "V = B + [(ROE − r) × B ] / (r − g) 0 0 0 book value = equity / total shares book value = 131 / 18.6 = 7.04 (from Exhibit 1) r = cost of equity = 0.15 (given in Exhibit 2) ROE = 0.17 (given in Exhibit 2) g = 0.10 (given in Exhibit 2) V = 7.04 + [(0.17 − 0.15) × 7.04] / (0.15 − 0.10) = 9.86 0 For Further Reference: (Study Session 11, Module 30.3, LOS 30.f)", "explhtml": "<p>V  = B  + [(ROE − r) × B ] / (r − g)<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><\/table><\/div><p>book value = equity / total shares<\/p><p>book value = 131 / 18.6 = 7.04 (from Exhibit 1)<\/p><p>r = cost of equity = 0.15 (given in Exhibit 2)<\/p><p>ROE = 0.17 (given in Exhibit 2)<\/p><p>g = 0.10 (given in Exhibit 2)<\/p><p>V  = 7.04 + [(0.17 − 0.15) × 7.04] / (0.15 − 0.10) = 9.86 0<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 30.3, LOS 30.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Equity Valuation.<\/p><p>Yummy Doughnuts Case Scenario<\/p><p>Yummy Doughnuts (YD) sells a variety of doughnuts and other related items through both company-owned locations and franchise locations. YD has experienced significant growth over the past five years. However, barriers to entry are low and competition is increasing.<\/p><p>Linda Haas, CFA, follows YD for Gibraltar Capital. Gibraltar Capital prides itself on its thorough fundamental analysis of investment opportunities. The company uses a bottom-up approach to the investment process. Haas&#x27;s security selection process utilizes residual income models to determine a stock&#x27;s intrinsic value. Haas obtains YD&#x27;s 2018 financial statements shown in Exhibit 1. In addition, Haas provides supporting information about YD&#x27;s financials and other related material found in Exhibit 2.<\/p><p><b>Exhibit 1: Yummy Doughnuts&#x27;s 2018 Income Statement and Balance Sheet<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions, except for per share items<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Revenue<\/td><td>$300<\/td><td><\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$205<\/td><td><\/td><\/tr><tr><td>SG&amp;A<\/td><td>$40<\/td><td><\/td><\/tr><tr><td>Depreciation expense<\/td><td>$6<\/td><td><\/td><\/tr><tr><td>Income from operations<\/td><td>$49<\/td><td><\/td><\/tr><tr><td>Interest expense<\/td><td>$1<\/td><td><\/td><\/tr><tr><td>Pretax income<\/td><td>$48<\/td><td><\/td><\/tr><tr><td>Income tax (40% tax rate)<\/td><td>$19<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>$29<\/td><td><\/td><\/tr><tr><td>Shares outstanding<\/td><td>18.6<\/td><td><\/td><\/tr><tr><td>EPS<\/td><td>$1.56<\/td><td><\/td><\/tr><tr><td>In millions<\/td><td>2018<\/td><td>2018<\/td><\/tr><tr><td>Assets<\/td><td>Liabilities and equity<\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>$15 Accounts payable<\/td><td>$12<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$27 Accrued expenses<\/td><td>$26<\/td><\/tr><tr><td>Inventory<\/td><td>$16 Current liabilities<\/td><td>$38<\/td><\/tr><tr><td>Current assets<\/td><td>$58<\/td><td><\/td><\/tr><tr><td>Property and equipment<\/td><td>$113 Total long-term debt (7% coupon, at par value)<\/td><td>$12<\/td><\/tr><tr><td>Long-term investments<\/td><td>$10 Equity<\/td><td>$131<\/td><\/tr><tr><td>Total assets<\/td><td>$181 Total liabilities &amp; equity<\/td><td>$181<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Additional Information<\/b><\/p><p>YD uses the FIFO method of inventory valuation. 2018 cash operating taxes equal $15 million. This amount includes all appropriate tax adjustments. 2018 NOPAT was estimated to be $42 million. Haas believes that YD will have a 17% ROE and a 10% long-term growth rate over the foreseeable future. Haas estimates YD&#x27;s cost of equity to be 15.0%. YD expects annual capital expenditures to remain at about $37 million. YD&#x27;s stock currently trades at $15.50 per share. YD&#x27;s bonds are currently trading at par value. YD&#x27;s total adjusted capital base was $200 million at the end of 2017.<\/p><p>Haas makes the following statements during her YD presentation to the investment committee:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Based on ROE mean reversion, YD&#x27;s continuing residual income is assumed to decline to zero<\/td><\/tr><tr><td>over time.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The residual income model states that if YD&#x27;s ROE equals its equity cost of capital, then YD&#x27;s<\/td><\/tr><tr><td>intrinsic value will equal its book value per share.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Exhibit 2, and the single-stage residual in come model, YD&#x27;s intrinsic value is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 29, "q": "Haas notes that the multi-stage residual equity income model captures more detail in calculating YD's intrinsic value. An assumption of the model is that ROE fades to the cost of equity over time, which is known as a persistence factor (varying from 0 to 1). Identify which characteristic indicates a higher persistence of abnormal earnings.", "opts": ["Low dividend payout.", "Low price-to-earnings ratio.", "High dividend yield."], "ans": "A", "expl": "It is difficult for a company to maintain a high ROE because of competition. The persistence factor will be lower for those companies. A company that has a low dividend payout has greater growth opportunities than a company with a high dividend payout. The greater growth opportunities should support a higher persistence factor. For Further Reference: (Study Session 11, Module 30.4, LOS 30.h)", "explhtml": "<p>It is difficult for a company to maintain a high ROE because of competition. The persistence factor will be lower for those companies. A company that has a low dividend payout has greater growth opportunities than a company with a high dividend payout. The greater growth opportunities should support a higher persistence factor.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 30.4, LOS 30.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Equity Valuation.<\/p><p>Yummy Doughnuts Case Scenario<\/p><p>Yummy Doughnuts (YD) sells a variety of doughnuts and other related items through both company-owned locations and franchise locations. YD has experienced significant growth over the past five years. However, barriers to entry are low and competition is increasing.<\/p><p>Linda Haas, CFA, follows YD for Gibraltar Capital. Gibraltar Capital prides itself on its thorough fundamental analysis of investment opportunities. The company uses a bottom-up approach to the investment process. Haas&#x27;s security selection process utilizes residual income models to determine a stock&#x27;s intrinsic value. Haas obtains YD&#x27;s 2018 financial statements shown in Exhibit 1. In addition, Haas provides supporting information about YD&#x27;s financials and other related material found in Exhibit 2.<\/p><p><b>Exhibit 1: Yummy Doughnuts&#x27;s 2018 Income Statement and Balance Sheet<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions, except for per share items<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Revenue<\/td><td>$300<\/td><td><\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$205<\/td><td><\/td><\/tr><tr><td>SG&amp;A<\/td><td>$40<\/td><td><\/td><\/tr><tr><td>Depreciation expense<\/td><td>$6<\/td><td><\/td><\/tr><tr><td>Income from operations<\/td><td>$49<\/td><td><\/td><\/tr><tr><td>Interest expense<\/td><td>$1<\/td><td><\/td><\/tr><tr><td>Pretax income<\/td><td>$48<\/td><td><\/td><\/tr><tr><td>Income tax (40% tax rate)<\/td><td>$19<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>$29<\/td><td><\/td><\/tr><tr><td>Shares outstanding<\/td><td>18.6<\/td><td><\/td><\/tr><tr><td>EPS<\/td><td>$1.56<\/td><td><\/td><\/tr><tr><td>In millions<\/td><td>2018<\/td><td>2018<\/td><\/tr><tr><td>Assets<\/td><td>Liabilities and equity<\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>$15 Accounts payable<\/td><td>$12<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$27 Accrued expenses<\/td><td>$26<\/td><\/tr><tr><td>Inventory<\/td><td>$16 Current liabilities<\/td><td>$38<\/td><\/tr><tr><td>Current assets<\/td><td>$58<\/td><td><\/td><\/tr><tr><td>Property and equipment<\/td><td>$113 Total long-term debt (7% coupon, at par value)<\/td><td>$12<\/td><\/tr><tr><td>Long-term investments<\/td><td>$10 Equity<\/td><td>$131<\/td><\/tr><tr><td>Total assets<\/td><td>$181 Total liabilities &amp; equity<\/td><td>$181<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Additional Information<\/b><\/p><p>YD uses the FIFO method of inventory valuation. 2018 cash operating taxes equal $15 million. This amount includes all appropriate tax adjustments. 2018 NOPAT was estimated to be $42 million. Haas believes that YD will have a 17% ROE and a 10% long-term growth rate over the foreseeable future. Haas estimates YD&#x27;s cost of equity to be 15.0%. YD expects annual capital expenditures to remain at about $37 million. YD&#x27;s stock currently trades at $15.50 per share. YD&#x27;s bonds are currently trading at par value. YD&#x27;s total adjusted capital base was $200 million at the end of 2017.<\/p><p>Haas makes the following statements during her YD presentation to the investment committee:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Based on ROE mean reversion, YD&#x27;s continuing residual income is assumed to decline to zero<\/td><\/tr><tr><td>over time.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The residual income model states that if YD&#x27;s ROE equals its equity cost of capital, then YD&#x27;s<\/td><\/tr><tr><td>intrinsic value will equal its book value per share.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Haas notes that the multi-stage residual equity income model captures more detail in calculating YD&#x27;s intrinsic value. An assumption of the model is that ROE fades to the cost of equity over time, which is known as a persistence factor (varying from 0 to 1). Identify which characteristic indicates a higher persistence of abnormal earnings.<\/p><\/div>", "subj": "equity"}, {"n": 30, "q": "Haas makes a statement about an assumption concerning residual income (Statement 1) and the residual income model (Statement 2). Which of the statements is correct?", "opts": ["Only Statement 1 is correct.", "Only Statement 2 is correct.", "Both Statements 1 and 2 are correct."], "ans": "C", "expl": "Statement 1 is correct. The multistage residual income model uses continuing residual income to denote the long-run residual income. Based on reversion to the mean, and increasing competition for YD, continuing residual income would be expected to decline to zero over time. Statement 2 is correct. Based on the residual income model formula, V = B + 0 0 (ROE − r) × B / (r − g). If ROE = r, then V = B . 0 0 0 For Further Reference: (Study Session 11, Module 30.2, LOS 30.d, 30.j)", "explhtml": "<p>Statement 1 is correct. The multistage residual income model uses continuing residual income to denote the long-run residual income. Based on reversion to the mean, and increasing competition for YD, continuing residual income would be expected to decline to zero over time. Statement 2 is correct. Based on the residual income model formula, V  = B  +<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>0<\/td><\/tr><\/table><\/div><p>(ROE − r) × B  / (r − g). If ROE = r, then V  = B .<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 30.2, LOS 30.d, 30.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Equity Valuation.<\/p><p>Yummy Doughnuts Case Scenario<\/p><p>Yummy Doughnuts (YD) sells a variety of doughnuts and other related items through both company-owned locations and franchise locations. YD has experienced significant growth over the past five years. However, barriers to entry are low and competition is increasing.<\/p><p>Linda Haas, CFA, follows YD for Gibraltar Capital. Gibraltar Capital prides itself on its thorough fundamental analysis of investment opportunities. The company uses a bottom-up approach to the investment process. Haas&#x27;s security selection process utilizes residual income models to determine a stock&#x27;s intrinsic value. Haas obtains YD&#x27;s 2018 financial statements shown in Exhibit 1. In addition, Haas provides supporting information about YD&#x27;s financials and other related material found in Exhibit 2.<\/p><p><b>Exhibit 1: Yummy Doughnuts&#x27;s 2018 Income Statement and Balance Sheet<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions, except for per share items<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Revenue<\/td><td>$300<\/td><td><\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$205<\/td><td><\/td><\/tr><tr><td>SG&amp;A<\/td><td>$40<\/td><td><\/td><\/tr><tr><td>Depreciation expense<\/td><td>$6<\/td><td><\/td><\/tr><tr><td>Income from operations<\/td><td>$49<\/td><td><\/td><\/tr><tr><td>Interest expense<\/td><td>$1<\/td><td><\/td><\/tr><tr><td>Pretax income<\/td><td>$48<\/td><td><\/td><\/tr><tr><td>Income tax (40% tax rate)<\/td><td>$19<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>$29<\/td><td><\/td><\/tr><tr><td>Shares outstanding<\/td><td>18.6<\/td><td><\/td><\/tr><tr><td>EPS<\/td><td>$1.56<\/td><td><\/td><\/tr><tr><td>In millions<\/td><td>2018<\/td><td>2018<\/td><\/tr><tr><td>Assets<\/td><td>Liabilities and equity<\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>$15 Accounts payable<\/td><td>$12<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$27 Accrued expenses<\/td><td>$26<\/td><\/tr><tr><td>Inventory<\/td><td>$16 Current liabilities<\/td><td>$38<\/td><\/tr><tr><td>Current assets<\/td><td>$58<\/td><td><\/td><\/tr><tr><td>Property and equipment<\/td><td>$113 Total long-term debt (7% coupon, at par value)<\/td><td>$12<\/td><\/tr><tr><td>Long-term investments<\/td><td>$10 Equity<\/td><td>$131<\/td><\/tr><tr><td>Total assets<\/td><td>$181 Total liabilities &amp; equity<\/td><td>$181<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Additional Information<\/b><\/p><p>YD uses the FIFO method of inventory valuation. 2018 cash operating taxes equal $15 million. This amount includes all appropriate tax adjustments. 2018 NOPAT was estimated to be $42 million. Haas believes that YD will have a 17% ROE and a 10% long-term growth rate over the foreseeable future. Haas estimates YD&#x27;s cost of equity to be 15.0%. YD expects annual capital expenditures to remain at about $37 million. YD&#x27;s stock currently trades at $15.50 per share. YD&#x27;s bonds are currently trading at par value. YD&#x27;s total adjusted capital base was $200 million at the end of 2017.<\/p><p>Haas makes the following statements during her YD presentation to the investment committee:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Based on ROE mean reversion, YD&#x27;s continuing residual income is assumed to decline to zero<\/td><\/tr><tr><td>over time.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The residual income model states that if YD&#x27;s ROE equals its equity cost of capital, then YD&#x27;s<\/td><\/tr><tr><td>intrinsic value will equal its book value per share.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Haas makes a statement about an assumption concerning residual income (Statement 1) and the residual income model (Statement 2). Which of the statements is correct?<\/p><\/div>", "subj": "equity"}, {"n": 31, "q": "Reese's statement about credit valuation adjustment is most likely:", "opts": ["correct.", "incorrect about the use of risk-neutral probability of default.", "incorrect about the sum of expected losses."], "ans": "C", "expl": "Credit valuation adjustment (CVA) is the sum of the present value of the expected loss for each period (and not simply just the sum of the expected losses). For Further Reference: (Study Session 13, Module 35.1, LOS 35.a)", "explhtml": "<p>Credit valuation adjustment (CVA) is the sum of the present value of the expected loss for each period (and not simply just the sum of the expected losses).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.1, LOS 35.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Fixed Income<\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Fixed Income.<\/p><p>TFC Investments Case Scenario<\/p><p>Michael Thomas, CFA, is a fixed-income portfolio manager for TFC Investments. As part of his portfolio strategy for the Prosperity Fund, Thomas seeks out bonds that he expects to be upgraded or downgraded. Potential upgrades that Thomas identifies are added to the portfolio (or, if already in the portfolio, are increased in proportion to other holdings). Potential downgrades are sold from the portfolio. Thomas&#x27;s portfolio&#x27;s current holdings include several bonds issued by companies in the oil and gas exploration and refining industries. Year-end rating updates are expected to occur in a few days, and Thomas is preparing to adjust his portfolio in advance of expected changes in credit ratings.<\/p><p>Thomas has been discussing his fixed-income strategies with fellow portfolio manager Shawna Reese. Reese suggests that while Thomas&#x27;s general approach is suitable, the overall credit-analysis strategy could be improved. Reese recommends using the credit valuation adjustment as a metric in credit analysis.<\/p><p>Reese makes the following statement to Thomas:<\/p><div class=\"tbl\"><table><tr><td>Reese&#x27;s statement:<\/td><td>&quot;Credit valuation adjustment is the sum of the expected loss for each period based on the risk-<\/td><\/tr><tr><td>neutral probability of default.&quot;<\/td><td><\/td><\/tr><\/table><\/div><p>Reese provides information about 4% Pistar, Inc., bonds, which are currently rated AA with a negative outlook. The bonds have a modified duration of 7.8, and the credit spread on the bonds is expected to be the same as the average for that rating category. Reese wants to calculate the impact of a downgrade on Pistar, Inc.&#x27;s bonds given the information in Exhibit 1.<\/p><p><b>Exhibit 1: Average Credit Spreads by Ratings Category<\/b><\/p><div class=\"tbl\"><table><tr><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC<\/td><\/tr><\/table><\/div><p>0.24% 0.29% 0.39% 0.58% 0.89% 1.12% 1.78%<\/p><p>As part of his portfolio analysis, Thomas also compares ABS to corporate bonds and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Securitization allows for higher leverage and lower cost to the issuer.<\/td><\/tr><tr><td>Statement 2:<\/td><td>A highly granular pool would have hundreds of clearly defined loans, allowing for use of<\/td><\/tr><tr><td>summary statistics as opposed to investigating each borrower.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>ABS investors earn a lower risk premium relative to similarly rated general obligation bonds.<\/td><\/tr><\/table><\/div><p>Thomas concludes his analysis by comparing the swap rate curve to a government bond yield curve.<\/p><\/div><\/details><div class=\"qtext\"><p>Reese&#x27;s statement about credit valuation adjustment is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 32, "q": "Under the option analogy of the structural model, owning a company's debt is economically equivalent to owning a riskless bond and simultaneously:", "opts": ["buying an American put option on the assets of the company.", "selling a European put option on the assets of the company.", "buying a European put option on the assets of the company."], "ans": "B", "expl": "Under the structural model's debt option analogy, owning a company's debt is economically equivalent to owning a riskless bond that pays K dollars at time T, plus simultaneously selling a European put option on the assets of the company with maturity T and strike price K. For Further Reference: (Study Session 13, Module 35.4, LOS 35.d)", "explhtml": "<p>Under the structural model&#x27;s debt option analogy, owning a company&#x27;s debt is economically equivalent to owning a riskless bond that pays K dollars at time T, plus simultaneously selling a European put option on the assets of the company with maturity T and strike price K.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.4, LOS 35.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Fixed Income.<\/p><p>TFC Investments Case Scenario<\/p><p>Michael Thomas, CFA, is a fixed-income portfolio manager for TFC Investments. As part of his portfolio strategy for the Prosperity Fund, Thomas seeks out bonds that he expects to be upgraded or downgraded. Potential upgrades that Thomas identifies are added to the portfolio (or, if already in the portfolio, are increased in proportion to other holdings). Potential downgrades are sold from the portfolio. Thomas&#x27;s portfolio&#x27;s current holdings include several bonds issued by companies in the oil and gas exploration and refining industries. Year-end rating updates are expected to occur in a few days, and Thomas is preparing to adjust his portfolio in advance of expected changes in credit ratings.<\/p><p>Thomas has been discussing his fixed-income strategies with fellow portfolio manager Shawna Reese. Reese suggests that while Thomas&#x27;s general approach is suitable, the overall credit-analysis strategy could be improved. Reese recommends using the credit valuation adjustment as a metric in credit analysis.<\/p><p>Reese makes the following statement to Thomas:<\/p><div class=\"tbl\"><table><tr><td>Reese&#x27;s statement:<\/td><td>&quot;Credit valuation adjustment is the sum of the expected loss for each period based on the risk-<\/td><\/tr><tr><td>neutral probability of default.&quot;<\/td><td><\/td><\/tr><\/table><\/div><p>Reese provides information about 4% Pistar, Inc., bonds, which are currently rated AA with a negative outlook. The bonds have a modified duration of 7.8, and the credit spread on the bonds is expected to be the same as the average for that rating category. Reese wants to calculate the impact of a downgrade on Pistar, Inc.&#x27;s bonds given the information in Exhibit 1.<\/p><p><b>Exhibit 1: Average Credit Spreads by Ratings Category<\/b><\/p><div class=\"tbl\"><table><tr><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC<\/td><\/tr><\/table><\/div><p>0.24% 0.29% 0.39% 0.58% 0.89% 1.12% 1.78%<\/p><p>As part of his portfolio analysis, Thomas also compares ABS to corporate bonds and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Securitization allows for higher leverage and lower cost to the issuer.<\/td><\/tr><tr><td>Statement 2:<\/td><td>A highly granular pool would have hundreds of clearly defined loans, allowing for use of<\/td><\/tr><tr><td>summary statistics as opposed to investigating each borrower.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>ABS investors earn a lower risk premium relative to similarly rated general obligation bonds.<\/td><\/tr><\/table><\/div><p>Thomas concludes his analysis by comparing the swap rate curve to a government bond yield curve.<\/p><\/div><\/details><div class=\"qtext\"><p>Under the option analogy of the structural model, owning a company&#x27;s debt is economically equivalent to owning a riskless bond and simultaneously:<\/p><\/div>", "subj": "fixed"}, {"n": 33, "q": "If Reese uses the risk-neutral probabilities of default to value the Pistar, Inc., bonds, she is most likely to conclude that the bond is:", "opts": ["fairly valued.", "overvalued.", "undervalued."], "ans": "A", "expl": "Risk neutral probability of default is the probability of default implied in the current market price. If CVA is calculated using risk-neutral probability, the value of risky bond will be estimated to be equal to its market price. For Further Reference: (Study Session 13, Module 35.1, LOS 35.a)", "explhtml": "<p>Risk neutral probability of default is the probability of default implied in the current market price. If CVA is calculated using risk-neutral probability, the value of risky bond will be estimated to be equal to its market price.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.1, LOS 35.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Fixed Income.<\/p><p>TFC Investments Case Scenario<\/p><p>Michael Thomas, CFA, is a fixed-income portfolio manager for TFC Investments. As part of his portfolio strategy for the Prosperity Fund, Thomas seeks out bonds that he expects to be upgraded or downgraded. Potential upgrades that Thomas identifies are added to the portfolio (or, if already in the portfolio, are increased in proportion to other holdings). Potential downgrades are sold from the portfolio. Thomas&#x27;s portfolio&#x27;s current holdings include several bonds issued by companies in the oil and gas exploration and refining industries. Year-end rating updates are expected to occur in a few days, and Thomas is preparing to adjust his portfolio in advance of expected changes in credit ratings.<\/p><p>Thomas has been discussing his fixed-income strategies with fellow portfolio manager Shawna Reese. Reese suggests that while Thomas&#x27;s general approach is suitable, the overall credit-analysis strategy could be improved. Reese recommends using the credit valuation adjustment as a metric in credit analysis.<\/p><p>Reese makes the following statement to Thomas:<\/p><div class=\"tbl\"><table><tr><td>Reese&#x27;s statement:<\/td><td>&quot;Credit valuation adjustment is the sum of the expected loss for each period based on the risk-<\/td><\/tr><tr><td>neutral probability of default.&quot;<\/td><td><\/td><\/tr><\/table><\/div><p>Reese provides information about 4% Pistar, Inc., bonds, which are currently rated AA with a negative outlook. The bonds have a modified duration of 7.8, and the credit spread on the bonds is expected to be the same as the average for that rating category. Reese wants to calculate the impact of a downgrade on Pistar, Inc.&#x27;s bonds given the information in Exhibit 1.<\/p><p><b>Exhibit 1: Average Credit Spreads by Ratings Category<\/b><\/p><div class=\"tbl\"><table><tr><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC<\/td><\/tr><\/table><\/div><p>0.24% 0.29% 0.39% 0.58% 0.89% 1.12% 1.78%<\/p><p>As part of his portfolio analysis, Thomas also compares ABS to corporate bonds and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Securitization allows for higher leverage and lower cost to the issuer.<\/td><\/tr><tr><td>Statement 2:<\/td><td>A highly granular pool would have hundreds of clearly defined loans, allowing for use of<\/td><\/tr><tr><td>summary statistics as opposed to investigating each borrower.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>ABS investors earn a lower risk premium relative to similarly rated general obligation bonds.<\/td><\/tr><\/table><\/div><p>Thomas concludes his analysis by comparing the swap rate curve to a government bond yield curve.<\/p><\/div><\/details><div class=\"qtext\"><p>If Reese uses the risk-neutral probabilities of default to value the Pistar, Inc., bonds, she is most likely to conclude that the bond is:<\/p><\/div>", "subj": "fixed"}, {"n": 34, "q": "What is the expected change in price of Pistar, Inc., bonds on account of credit migration?", "opts": ["–0.29%.", "–0.39%.", "–0.78%."], "ans": "C", "expl": "Δ%P = – (modified duration of the bond) × (Δ spread). = – (7.8) × (0.0039 – 0.0029) = –0.0078 or –0.78%. For Further Reference: (Study Session 13, Module 35.3, LOS 35.c)", "explhtml": "<p>Δ%P = – (modified duration of the bond) × (Δ spread).<\/p><p>= – (7.8) × (0.0039 – 0.0029) = –0.0078 or –0.78%.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.3, LOS 35.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Fixed Income.<\/p><p>TFC Investments Case Scenario<\/p><p>Michael Thomas, CFA, is a fixed-income portfolio manager for TFC Investments. As part of his portfolio strategy for the Prosperity Fund, Thomas seeks out bonds that he expects to be upgraded or downgraded. Potential upgrades that Thomas identifies are added to the portfolio (or, if already in the portfolio, are increased in proportion to other holdings). Potential downgrades are sold from the portfolio. Thomas&#x27;s portfolio&#x27;s current holdings include several bonds issued by companies in the oil and gas exploration and refining industries. Year-end rating updates are expected to occur in a few days, and Thomas is preparing to adjust his portfolio in advance of expected changes in credit ratings.<\/p><p>Thomas has been discussing his fixed-income strategies with fellow portfolio manager Shawna Reese. Reese suggests that while Thomas&#x27;s general approach is suitable, the overall credit-analysis strategy could be improved. Reese recommends using the credit valuation adjustment as a metric in credit analysis.<\/p><p>Reese makes the following statement to Thomas:<\/p><div class=\"tbl\"><table><tr><td>Reese&#x27;s statement:<\/td><td>&quot;Credit valuation adjustment is the sum of the expected loss for each period based on the risk-<\/td><\/tr><tr><td>neutral probability of default.&quot;<\/td><td><\/td><\/tr><\/table><\/div><p>Reese provides information about 4% Pistar, Inc., bonds, which are currently rated AA with a negative outlook. The bonds have a modified duration of 7.8, and the credit spread on the bonds is expected to be the same as the average for that rating category. Reese wants to calculate the impact of a downgrade on Pistar, Inc.&#x27;s bonds given the information in Exhibit 1.<\/p><p><b>Exhibit 1: Average Credit Spreads by Ratings Category<\/b><\/p><div class=\"tbl\"><table><tr><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC<\/td><\/tr><\/table><\/div><p>0.24% 0.29% 0.39% 0.58% 0.89% 1.12% 1.78%<\/p><p>As part of his portfolio analysis, Thomas also compares ABS to corporate bonds and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Securitization allows for higher leverage and lower cost to the issuer.<\/td><\/tr><tr><td>Statement 2:<\/td><td>A highly granular pool would have hundreds of clearly defined loans, allowing for use of<\/td><\/tr><tr><td>summary statistics as opposed to investigating each borrower.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>ABS investors earn a lower risk premium relative to similarly rated general obligation bonds.<\/td><\/tr><\/table><\/div><p>Thomas concludes his analysis by comparing the swap rate curve to a government bond yield curve.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the expected change in price of Pistar, Inc., bonds on account of credit migration?<\/p><\/div>", "subj": "fixed"}, {"n": 35, "q": "Regarding Thomas's statements about ABS, which statement is least accurate?", "opts": ["Statement 1.", "Statement 2.", "Statement 3."], "ans": "C", "expl": "Statement 3 is inaccurate. Due to the higher complexity of collateralized debt, ABS investors earn a higher risk premium relative to similarly rated general obligation bonds. For Further Reference: (Study Session 13, Module 35.7, LOS 35.h)", "explhtml": "<p>Statement 3 is inaccurate. Due to the higher complexity of collateralized debt, ABS investors earn a higher risk premium relative to similarly rated general obligation bonds.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.7, LOS 35.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Fixed Income.<\/p><p>TFC Investments Case Scenario<\/p><p>Michael Thomas, CFA, is a fixed-income portfolio manager for TFC Investments. As part of his portfolio strategy for the Prosperity Fund, Thomas seeks out bonds that he expects to be upgraded or downgraded. Potential upgrades that Thomas identifies are added to the portfolio (or, if already in the portfolio, are increased in proportion to other holdings). Potential downgrades are sold from the portfolio. Thomas&#x27;s portfolio&#x27;s current holdings include several bonds issued by companies in the oil and gas exploration and refining industries. Year-end rating updates are expected to occur in a few days, and Thomas is preparing to adjust his portfolio in advance of expected changes in credit ratings.<\/p><p>Thomas has been discussing his fixed-income strategies with fellow portfolio manager Shawna Reese. Reese suggests that while Thomas&#x27;s general approach is suitable, the overall credit-analysis strategy could be improved. Reese recommends using the credit valuation adjustment as a metric in credit analysis.<\/p><p>Reese makes the following statement to Thomas:<\/p><div class=\"tbl\"><table><tr><td>Reese&#x27;s statement:<\/td><td>&quot;Credit valuation adjustment is the sum of the expected loss for each period based on the risk-<\/td><\/tr><tr><td>neutral probability of default.&quot;<\/td><td><\/td><\/tr><\/table><\/div><p>Reese provides information about 4% Pistar, Inc., bonds, which are currently rated AA with a negative outlook. The bonds have a modified duration of 7.8, and the credit spread on the bonds is expected to be the same as the average for that rating category. Reese wants to calculate the impact of a downgrade on Pistar, Inc.&#x27;s bonds given the information in Exhibit 1.<\/p><p><b>Exhibit 1: Average Credit Spreads by Ratings Category<\/b><\/p><div class=\"tbl\"><table><tr><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC<\/td><\/tr><\/table><\/div><p>0.24% 0.29% 0.39% 0.58% 0.89% 1.12% 1.78%<\/p><p>As part of his portfolio analysis, Thomas also compares ABS to corporate bonds and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Securitization allows for higher leverage and lower cost to the issuer.<\/td><\/tr><tr><td>Statement 2:<\/td><td>A highly granular pool would have hundreds of clearly defined loans, allowing for use of<\/td><\/tr><tr><td>summary statistics as opposed to investigating each borrower.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>ABS investors earn a lower risk premium relative to similarly rated general obligation bonds.<\/td><\/tr><\/table><\/div><p>Thomas concludes his analysis by comparing the swap rate curve to a government bond yield curve.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Thomas&#x27;s statements about ABS, which statement is least accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 36, "q": "Which of the following statements regarding the choice between government bond yield curves and swap-rate curves as a benchmark interest rate curve is most accurate?", "opts": ["The swap-rate curve is preferred because swap curves are comparable across countries since they reflect similar levels of credit risk.", "Government bond yield curves are preferred because they are based on a more complete set of market yields.", "Government bond yield curves are preferred because the lack of a liquid secondary market can distort swap yields compared with government bond yields."], "ans": "A", "expl": "Market participants typically prefer to use the swap-rate curve as a benchmark (rather than a government bond yield curve) for the following reasons: The availability of swaps and the equilibrium pricing are driven only by the interaction of supply and demand. It is not affected by technical market factors that can affect government bond yields. The swap market is not regulated by any government, which makes swap rates across different countries more comparable. Swap curves across countries are also more comparable than sovereign bond yield curves because swap curves reflect similar levels of credit risk, while sovereign bond yield curves also reflect credit risk unique to each country's government bonds. The swap curve typically has yield quotes at 11 maturities between 2 and 30 years. The U.S. government bond yield curve typically only has on-the-run issues trading at four maturities between 2 and 30 years. For Further Reference: (Study Session 12, Module 32.3, LOS 32.f)", "explhtml": "<p>Market participants typically prefer to use the swap-rate curve as a benchmark (rather than a government bond yield curve) for the following reasons:<\/p><p>The availability of swaps and the equilibrium pricing are driven only by the interaction of supply and demand. It is not affected by technical market factors that can affect government bond yields. The swap market is not regulated by any government, which makes swap rates across different countries more comparable. Swap curves across countries are also more comparable than sovereign bond yield curves because swap curves reflect similar levels of credit risk, while sovereign bond yield curves also reflect credit risk unique to each country&#x27;s government bonds. The swap curve typically has yield quotes at 11 maturities between 2 and 30 years. The U.S. government bond yield curve typically only has on-the-run issues trading at four maturities between 2 and 30 years.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.3, LOS 32.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Fixed Income.<\/p><p>TFC Investments Case Scenario<\/p><p>Michael Thomas, CFA, is a fixed-income portfolio manager for TFC Investments. As part of his portfolio strategy for the Prosperity Fund, Thomas seeks out bonds that he expects to be upgraded or downgraded. Potential upgrades that Thomas identifies are added to the portfolio (or, if already in the portfolio, are increased in proportion to other holdings). Potential downgrades are sold from the portfolio. Thomas&#x27;s portfolio&#x27;s current holdings include several bonds issued by companies in the oil and gas exploration and refining industries. Year-end rating updates are expected to occur in a few days, and Thomas is preparing to adjust his portfolio in advance of expected changes in credit ratings.<\/p><p>Thomas has been discussing his fixed-income strategies with fellow portfolio manager Shawna Reese. Reese suggests that while Thomas&#x27;s general approach is suitable, the overall credit-analysis strategy could be improved. Reese recommends using the credit valuation adjustment as a metric in credit analysis.<\/p><p>Reese makes the following statement to Thomas:<\/p><div class=\"tbl\"><table><tr><td>Reese&#x27;s statement:<\/td><td>&quot;Credit valuation adjustment is the sum of the expected loss for each period based on the risk-<\/td><\/tr><tr><td>neutral probability of default.&quot;<\/td><td><\/td><\/tr><\/table><\/div><p>Reese provides information about 4% Pistar, Inc., bonds, which are currently rated AA with a negative outlook. The bonds have a modified duration of 7.8, and the credit spread on the bonds is expected to be the same as the average for that rating category. Reese wants to calculate the impact of a downgrade on Pistar, Inc.&#x27;s bonds given the information in Exhibit 1.<\/p><p><b>Exhibit 1: Average Credit Spreads by Ratings Category<\/b><\/p><div class=\"tbl\"><table><tr><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC<\/td><\/tr><\/table><\/div><p>0.24% 0.29% 0.39% 0.58% 0.89% 1.12% 1.78%<\/p><p>As part of his portfolio analysis, Thomas also compares ABS to corporate bonds and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Securitization allows for higher leverage and lower cost to the issuer.<\/td><\/tr><tr><td>Statement 2:<\/td><td>A highly granular pool would have hundreds of clearly defined loans, allowing for use of<\/td><\/tr><tr><td>summary statistics as opposed to investigating each borrower.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>ABS investors earn a lower risk premium relative to similarly rated general obligation bonds.<\/td><\/tr><\/table><\/div><p>Thomas concludes his analysis by comparing the swap rate curve to a government bond yield curve.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements regarding the choice between government bond yield curves and swap-rate curves as a benchmark interest rate curve is most accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 37, "q": "Calculate the market conversion premium per share for MediSoft's convertible bonds.", "opts": ["$2.61.", "$2.95.", "$5.56."], "ans": "A", "expl": "First, calculate the conversion ratio: Now, calculate market conversion price: Finally, calculate the market conversion premium per share as the difference between the market conversion price and the market price of the stock: market conversion premium = 52.61 − 50.00 = 2.61 For Further Reference: (Study Session 13, Module 34.8, LOS 34.o)", "explhtml": "<p>First, calculate the conversion ratio:<\/p><p>Now, calculate market conversion price: Finally, calculate the market conversion premium per share as the difference between the market conversion price and the market price of the stock:<\/p><p>market conversion premium = 52.61 − 50.00 = 2.61<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.8, LOS 34.o)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<\/summary><div class=\"vig-body\"><p>Questions 97 through 102 relate to Fixed Income.<\/p><p>MediSoft, Inc., Case Scenario<\/p><p>MediSoft, Inc., develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm&#x27;s software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception 10 years ago, averaging 25% growth in sales over the past decade. Twelve months after its IPO, MediSoft made two bond offerings, the first of which was a convertible bond.<\/p><p>At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and 10 years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. The putable bond has a European-style option exercisable 10 years after issuance at par. The bonds were issued three years ago.<\/p><p>MediSoft&#x27;s convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company&#x27;s putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft&#x27;s common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comments were made by various portfolio managers and analysts at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><p>&quot;Decreasing volatility in the price of MediSoft&#x27;s common stock as well as increasing volatility in the level of interest rates are expected in the near future. The combined effects of these changes in volatility will be a decrease in the price of MediSoft&#x27;s putable bonds and an increase in the price of the convertible bonds. Therefore, only the convertible bonds would be a suitable purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Calculate the market conversion premium per share for MediSoft&#x27;s convertible bonds.<\/p><\/div>", "subj": "fixed"}, {"n": 38, "q": "The minimum value of the convertible bond today is closest to:", "opts": ["$900.", "$917.", "$947."], "ans": "B", "expl": "Minimum value of a convertible = Max (straight value, conversion value) Straight value = $917 (given) Conversion value = 18 × $50 = $900 Minimum value of the convertible = $917 For Further Reference: (Study Session 13, Module 34.8, LOS 34.o)", "explhtml": "<p>Minimum value of a convertible = Max (straight value, conversion value)<\/p><p>Straight value = $917 (given)<\/p><p>Conversion value = 18 × $50 = $900<\/p><p>Minimum value of the convertible = $917<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.8, LOS 34.o)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 97 through 102 relate to Fixed Income.<\/p><p>MediSoft, Inc., Case Scenario<\/p><p>MediSoft, Inc., develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm&#x27;s software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception 10 years ago, averaging 25% growth in sales over the past decade. Twelve months after its IPO, MediSoft made two bond offerings, the first of which was a convertible bond.<\/p><p>At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and 10 years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. The putable bond has a European-style option exercisable 10 years after issuance at par. The bonds were issued three years ago.<\/p><p>MediSoft&#x27;s convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company&#x27;s putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft&#x27;s common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comments were made by various portfolio managers and analysts at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><p>&quot;Decreasing volatility in the price of MediSoft&#x27;s common stock as well as increasing volatility in the level of interest rates are expected in the near future. The combined effects of these changes in volatility will be a decrease in the price of MediSoft&#x27;s putable bonds and an increase in the price of the convertible bonds. Therefore, only the convertible bonds would be a suitable purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The minimum value of the convertible bond today is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 39, "q": "Suppose that MediSoft wants to issue new bonds but wants to issue the bonds at-or-above par value. Which of the following bonds would most closely match their criteria?", "opts": ["7-year, 7.25% convertible bond with a conversion price of $56.", "7-year, 7.25% callable bond, callable in two years at 102% of par.", "7-year, 8% coupon bond extendible for five years at the same coupon rate."], "ans": "C", "expl": "The 7-year, 7.25% convertible bond has a market price of $947 (given) and, therefore, does not qualify (as it is below par). A similar option-free bond would be worth less (given in the case as $917). A similar callable bond would be worth even less. This value is not given but would be below $917 and, therefore, below par. A 7-year bond extendible by five years would be valued the same as an equivalent 12-year putable bond with an European put option that is exercisable in seven years. The value of the putable bond is given as $1,052; this bond meets the criteria. For Further Reference: (Study Session 13, Module 34.1, LOS 34.a)", "explhtml": "<p>The 7-year, 7.25% convertible bond has a market price of $947 (given) and, therefore, does not qualify (as it is below par). A similar option-free bond would be worth less (given in the case as $917). A similar callable bond would be worth even less. This value is not given but would be below $917 and, therefore, below par. A 7-year bond extendible by five years would be valued the same as an equivalent 12-year putable bond with an European put option that is exercisable in seven years. The value of the putable bond is given as $1,052; this bond meets the criteria.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.1, LOS 34.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 97 through 102 relate to Fixed Income.<\/p><p>MediSoft, Inc., Case Scenario<\/p><p>MediSoft, Inc., develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm&#x27;s software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception 10 years ago, averaging 25% growth in sales over the past decade. Twelve months after its IPO, MediSoft made two bond offerings, the first of which was a convertible bond.<\/p><p>At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and 10 years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. The putable bond has a European-style option exercisable 10 years after issuance at par. The bonds were issued three years ago.<\/p><p>MediSoft&#x27;s convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company&#x27;s putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft&#x27;s common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comments were made by various portfolio managers and analysts at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><p>&quot;Decreasing volatility in the price of MediSoft&#x27;s common stock as well as increasing volatility in the level of interest rates are expected in the near future. The combined effects of these changes in volatility will be a decrease in the price of MediSoft&#x27;s putable bonds and an increase in the price of the convertible bonds. Therefore, only the convertible bonds would be a suitable purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose that MediSoft wants to issue new bonds but wants to issue the bonds at-or-above par value. Which of the following bonds would most closely match their criteria?<\/p><\/div>", "subj": "fixed"}, {"n": 40, "q": "Under what circumstances will the analyst's comments regarding the limited downside risk of MediSoft's convertible bonds be accurate?", "opts": ["Short-term and long-term interest rates are expected to remain the same.", "The Federal Reserve Bank decides to pursue a restrictive monetary policy.", "The convertible bond is trading in the market as a common stock equivalent."], "ans": "A", "expl": "If interest rates are not expected to change then the straight value of the bond will not change (ignoring the change in value resulting from the passage of time). If the straight value does not change, then downside risk is indeed limited to the difference between the price paid for the bond and the straight value. If, however, interest rates rise as the price of the common stock falls, the conversion value will fall and the straight value will fall, exposing the holder of the convertible bond to more downside risk. For Further Reference: (Study Session 13, Module 34.8, LOS 34.q)", "explhtml": "<p>If interest rates are not expected to change then the straight value of the bond will not change (ignoring the change in value resulting from the passage of time). If the straight value does not change, then downside risk is indeed limited to the difference between the price paid for the bond and the straight value. If, however, interest rates rise as the price of the common stock falls, the conversion value will fall and the straight value will f Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comments were made by various portfolio managers and analysts at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><p>&quot;Decreasing volatility in the price of MediSoft&#x27;s common stock as well as increasing volatility in the level of interest rates are expected in the near future. The combined effects of these changes in volatility will be a decrease in the price of MediSoft&#x27;s putable bonds and an increase in the price of the convertible bonds. Therefore, only the convertible bonds would be a suitable purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Under what circumstances will the analyst&#x27;s comments regarding the limited downside risk of MediSoft&#x27;s convertible bonds be accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 41, "q": "If the OAS on MediSoft's straight bond was estimated to be 48bps, which of the following statements is most accurate?", "opts": ["The OAS of callable bond will be greater than 48bps, and the OAS of the convertible bond will be less than 48bps.", "The OAS of the convertible bond will be less than 48bps, while the OAS of the putable bond will be greater than 48bps.", "The OAS of the callable, putable and convertible bond should be equal to 48bps."], "ans": "C", "expl": "OAS, or option-adjusted spread, is the constant spread that is added to each node in an interest rate tree to force the model value to equal the market price of the bond. OAS might be more appropriately called the \"option-removed spread\" (i.e., the spread added after the option feature is removed). Because the option feature is removed via adjustment to cash flows, bonds with similar credit and liquidity risk should have similar OAS. For Further Reference: (Study Session 13, Module 34.4, LOS 34.g)", "explhtml": "<p>OAS, or option-adjusted spread, is the constant spread that is added to each node in an interest rate tree to force the model value to equal the market price of the bond. OAS might be more appropriately called the &quot;option-removed spread&quot; (i.e., the spread added after the option feature is removed). Because the option feature is removed via adjustment to cash flows, bonds with similar credit and liquidity risk should have similar OAS.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.4, LOS 34.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 97 through 102 relate to Fixed Income.<\/p><p>MediSoft, Inc., Case Scenario<\/p><p>MediSoft, Inc., develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm&#x27;s software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception 10 years ago, averaging 25% growth in sales over the past decade. Twelve months after its IPO, MediSoft made two bond offerings, the first of which was a convertible bond.<\/p><p>At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and 10 years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. The putable bond has a European-style option exercisable 10 years after issuance at par. The bonds were issued three years ago.<\/p><p>MediSoft&#x27;s convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company&#x27;s putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft&#x27;s common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comments were made by various portfolio managers and analysts at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><p>&quot;Decreasing volatility in the price of MediSoft&#x27;s common stock as well as increasing volatility in the level of interest rates are expected in the near future. The combined effects of these changes in volatility will be a decrease in the price of MediSoft&#x27;s putable bonds and an increase in the price of the convertible bonds. Therefore, only the convertible bonds would be a suitable purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>If the OAS on MediSoft&#x27;s straight bond was estimated to be 48bps, which of the following statements is most accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 42, "q": "Evaluate the portfolio managers' comments regarding the changes in the values of MediSoft's bonds resulting from changes in the volatility of the company's common stock and the volatility of interest rates. The managers were:", "opts": ["correct only with regard to the convertible bonds.", "correct only with regard to the putable bonds.", "incorrect with regard to both securities."], "ans": "C", "expl": "Decreasing volatility of common stock prices would devalue any options related to the stock. The convertible bond contains an embedded call option on the stock, which would experience a decrease in value. Increasing interest rate volatility would increase the value of options related to interest rates. MediSoft's convertible bond is also callable and the value of the call on the bond would increase. The total value of the convertible bond is as follows: convertible bond value = straight value + call on stock – call on bond. The combined effect of the changes in the values of the options is a decrease in the value of the convertible bond. Thus the statement regarding the volatility effects on MediSoft's convertible bonds is incorrect. The value of the putable bond can be summarized as follows: putable bond value = option-free value + put on bond. The increase in put option value resulting from the increase in interest rate volatility would increase the value of the putable bond. Therefore, the statement regarding the volatility effects on MediSoft's putable bonds is also incorrect. For Further Reference: (Study Session 13, Module 34.8, LOS 34.p)", "explhtml": "<p>Decreasing volatility of common stock prices would devalue any options related to the stock. The convertible bond contains an embedded call option on the stock, which would experience a decrease in value. Increasing interest rate volatility would increase the value of options related to interest rates. MediSoft&#x27;s convertible bond is also callable and the value of the call on the bond would increase. The total value of the convertible bond is as follows: convertible bond value = straight value + call on stock – call on bond. The combined effect of the changes in the values of the options is a decrease in the value of the convertible bond. Thus the statement regarding the volatility effects on MediSoft&#x27;s convertible bonds is incorrect. The value of the putable bond can be summarized as follows: putable bond value = option-free value + put on bond. The increase in put option value resulting from the increase in interest rate volatility would increase the value of the putable bond. Therefore, the statement regarding the volatility effects on MediSoft&#x27;s putable bonds is also incorrect.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.8, LOS 34.p)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vigne  following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comments were made by various portfolio managers and analysts at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><p>&quot;Decreasing volatility in the price of MediSoft&#x27;s common stock as well as increasing volatility in the level of interest rates are expected in the near future. The combined effects of these changes in volatility will be a decrease in the price of MediSoft&#x27;s putable bonds and an increase in the price of the convertible bonds. Therefore, only the convertible bonds would be a suitable purchase.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Evaluate the portfolio managers&#x27; comments regarding the changes in the values of MediSoft&#x27;s bonds resulting from changes in the volatility of the company&#x27;s common stock and the volatility of interest rates. The managers were:<\/p><\/div>", "subj": "fixed"}, {"n": 43, "q": "Given data in Exhibit 1, which of the following was closest to the price of the FRA on the date of the contract's inception?", "opts": ["4.7%.", "6.8%.", "7.2%."], "ans": "B", "expl": "Walker is entering into a 6 × 8 forward rate agreement (FRA), which represents a 2-month (60-day) loan that will begin six months (180 days) from now. The relevant LIBOR rates for this contract are 180-day and 240-day LIBOR. To calculate the contract rate on the 6 × 8 FRA, first un-annualize the 180- and 240-day rates as follows: R180=0.0452(180360)=0.0226R240=0.0511(240360)=0.0341 Next, calculate the rate on the 6 × 8 FRA as follows (note we are using the 180-day and 240-day LIBOR rates to find the 60-day rate that lies between them): The 0.0112 or 1.12% rate represents a 60-day rate. Annualizing the rate will yield the following: For Further Reference: (Study Session 14, Module 37.4, LOS 37.a)", "explhtml": "<p>Walker is entering into a 6 × 8 forward rate agreement (FRA), which represents a 2-month (60-day) loan that will begin six months (180 days) from now. The relevant LIBOR rates for this contract are 180-day and 240-day LIBOR. To calculate the contract rate on the 6 × 8 FRA, first un-annualize the 180- and 240-day rates as follows:<\/p><p>R180=0.0452(180360)=0.0226R240=0.0511(240360)=0.0341<\/p><p>Next, calculate the rate on the 6 × 8 FRA as follows (note we are using the 180-day and 240-day LIBOR rates to find the 60-day rate that lies between them):<\/p><p>The 0.0112 or 1.12% rate represents a 60-day rate. Annualizing the rate will yield the following:<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.4, LOS 37.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<\/summary><div class=\"vig-body\"><p>Questions 103 through 108 relate to Derivatives.<\/p><p>Lothar Corporation Case Scenario<\/p><p>James Walker is the chief financial officer for Lothar Corporation, a U.S. mining company that specializes in worldwide exploration for and excavation of precious metals. Lothar Corporation generally tries to maintain a debt-to-capital ratio of approximately 45% and has successfully done so for the past seven years. Due to the time lag between the discovery of an extractable vein of metal and the eventual sale of the excavated material, the company frequently must issue short- term debt to fund its operations. Issuing these one- to six-month notes sometimes pushes Lothar&#x27;s debt-to-capital ratio above its long-term target, but the cash provided from the short-term financing is necessary to complete the majority of the company&#x27;s mining projects.<\/p><p>Walker has estimated that extraction of silver deposits in southern Australia has eight months until project completion. However, funding for the project will run out in approximately six months. In order to cover the funding gap, Walker will have to issue short-term notes with a principal value of $1,275,000 at an unknown future interest rate. To mitigate the interest rate uncertainty, Walker has decided to enter into a forward rate agreement (FRA) based on LIBOR which currently has a term structure as shown in Exhibit 1.<\/p><div class=\"tbl\"><table><tr><td>Exhibit 1<\/td><td>Exhibit 2<\/td><td><\/td><td><\/td><\/tr><tr><td>LIBOR Rates (t =<\/td><td>LIBOR Rates (t =<\/td><td><\/td><td><\/td><\/tr><tr><td>0)<\/td><td>90)<\/td><td><\/td><td><\/td><\/tr><tr><td>LIBOR<\/td><td>LIBOR<\/td><td><\/td><td><\/td><\/tr><tr><td>90-day<\/td><td>4.28%<\/td><td>90-day<\/td><td>5.12%<\/td><\/tr><tr><td>180-<\/td><td>150-<\/td><td><\/td><td><\/td><\/tr><tr><td>4.52%<\/td><td>5.96%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><tr><td>240-<\/td><td>210-<\/td><td><\/td><td><\/td><\/tr><tr><td>5.11%<\/td><td>6.03%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><tr><td>360-<\/td><td>300-<\/td><td><\/td><td><\/td><\/tr><tr><td>5.92%<\/td><td>6.41%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Three months after establishing the position in the forward rate agreement, LIBOR interest rates have shifted, causing the valu
