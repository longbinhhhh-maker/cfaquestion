>5.12%<\/td><\/tr><tr><td>180-<\/td><td>150-<\/td><td><\/td><td><\/td><\/tr><tr><td>4.52%<\/td><td>5.96%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><tr><td>240-<\/td><td>210-<\/td><td><\/td><td><\/td><\/tr><tr><td>5.11%<\/td><td>6.03%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><tr><td>360-<\/td><td>300-<\/td><td><\/td><td><\/td><\/tr><tr><td>5.92%<\/td><td>6.41%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Three months after establishing the position in the forward rate agreement, LIBOR interest rates have shifted, causing the value of Lothar&#x27;s FRA position to change as well. The new LIBOR term structure is shown in Exhibit 2.<\/p><p>While Walker is estimating the change in the value of the original FRA position, he receives a memo from the chief operating officer of Lothar, Maria Steiner, informing him of a major delay in one of the company&#x27;s South African mining projects. In the memo, Steiner states the following:<\/p><p>&quot;As usual, the project delay will require a short-term loan to cover the funding shortage that will accompany the extra time until project completion. I have estimated that in 210 days, we will require a 90-day project loan in the amount of $2,350,000. I would like you to establish another FRA position, this time with a contract rate of 6.95%.&quot;<\/p><p>Walker discusses some of these strategies with Pete Barka, partner at the brokerage firm that clears derivatives trades for Lothar. Barka suggests options on the Nasdaq 100 index futures as a use for Lothar&#x27;s excess cash. September futures price on the Nasdaq 100 index is currently at 4243. Three-month calls and puts with a strike price of 4200 are available. Exhibit 3 shows information about the options.<\/p><p><b>Exhibit 3: Three-Month Options on Nasdaq 100<\/b><\/p><div class=\"tbl\"><table><tr><td>Strike price (for both calls and puts)<\/td><td>$4200<\/td><\/tr><tr><td>Call premium<\/td><td>$243<\/td><\/tr><tr><td>Put premium<\/td><td>$196<\/td><\/tr><tr><td>Implied volatility<\/td><td>26%<\/td><\/tr><tr><td>Continuously compounded risk-free rate<\/td><td>0.35%<\/td><\/tr><tr><td>N(d )<\/td><td>0.5597<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>N(d )<\/td><td>0.5080<\/td><\/tr><\/table><\/div><p>2<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the most accurate way to replicate a payer swap?<\/p><\/div>", "subj": "derivatives"}, {"n": 48, "q": "Which of the following transactions should Walker initiate in order to comply with Steiner's request regarding the funding shortage at the South African gold mine? Establish:", "opts": ["a long position in an off-market FRA by making a payment to the short position.", "a short position in an off-market FRA by receiving a payment from the long position.", "a long position in an off-market FRA by receiving a payment from the short position."], "ans": "A", "expl": "In answering this question, you must first compute the contract rate for a zero value (arbitrage free) 7 × 10 FRA (i.e., the FRA expires in 210 days and the underlying loan expires in 300 days). The contract rate for the 7 × 10 FRA is computed as follows: Since the contract rate on an arbitrage free is higher than the desired rate of 6.95%, Walker must establish a position in an off-market FRA. He will need a long position because he will be borrowing at the contract rate, not lending. Since having a contract rate that is lower than the market rate (6.95% < 7.04%) is valuable to the long, Walker will have to make a payment to the short position at the contract inception. For Further Reference: (Study Session 14, Module 37.5, LOS 37.b)", "explhtml": "<p>In answering this question, you must first compute the contract rate for a zero value (arbitrage free) 7 × 10 FRA (i.e., the FRA expires in 210 days and the underlying loan expires in 300 days). The contract rate for the 7 × 10 FRA is computed as follows: Since the contract rate on an arbitrage free is higher than the desired rate of 6.95%, Walker must establish a position in an off-market FRA. He will need a long position because he will be borrowing at the contract rate, not lending. Since having a contract rate that is lower than the market rate (6.95% &lt; 7.04%) is valuable to the long, Walker will have to make a payment to the short position at the contract inception.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.5, LOS 37.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 103 through 108 relate to Derivatives.<\/p><p>Lothar Corporation Case Scenario<\/p><p>James Walker is the chief financial officer for Lothar Corporation, a U.S. mining company that specializes in worldwide exploration for and excavation of precious metals. Lothar Corporation generally tries to maintain a debt-to-capital ratio of approximately 45% and has successfully done so for the past seven years. Due to the time lag between the discovery of an extractable vein of metal and the eventual sale of the excavated material, the company frequently must issue short- term debt to fund its operations. Issuing these one- to six-month notes sometimes pushes Lothar&#x27;s debt-to-capital ratio above its long-term target, but the cash provided from the short-term financing is necessary to complete the majority of the company&#x27;s mining projects.<\/p><p>Walker has estimated that extraction of silver deposits in southern Australia has eight months until project completion. However, funding for the project will run out in approximately six months. In order to cover the funding gap, Walker will have to issue short-term notes with a principal value of $1,275,000 at an unknown future interest rate. To mitigate the interest rate uncertainty, Walker has decided to enter into a forward rate agreement (FRA) based on LIBOR which currently has a term structure as shown in Exhibit 1.<\/p><div class=\"tbl\"><table><tr><td>Exhibit 1<\/td><td>Exhibit 2<\/td><td><\/td><td><\/td><\/tr><tr><td>LIBOR Rates (t =<\/td><td>LIBOR Rates (t =<\/td><td><\/td><td><\/td><\/tr><tr><td>0)<\/td><td>90)<\/td><td><\/td><td><\/td><\/tr><tr><td>LIBOR<\/td><td>LIBOR<\/td><td><\/td><td><\/td><\/tr><tr><td>90-day<\/td><td>4.28%<\/td><td>90-day<\/td><td>5.12%<\/td><\/tr><tr><td>180-<\/td><td>150-<\/td><td><\/td><td><\/td><\/tr><tr><td>4.52%<\/td><td>5.96%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><tr><td>240-<\/td><td>210-<\/td><td><\/td><td><\/td><\/tr><tr><td>5.11%<\/td><td>6.03%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><tr><td>360-<\/td><td>300-<\/td><td><\/td><td><\/td><\/tr><tr><td>5.92%<\/td><td>6.41%<\/td><td><\/td><td><\/td><\/tr><tr><td>day<\/td><td>day<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Three months after establishing the position in the forward rate agreement, LIBOR interest rates have shifted, causing the value of Lothar&#x27;s FRA position to change as well. The new LIBOR term structure is shown in Exhibit 2.<\/p><p>While Walker is estimating the change in the value of the original FRA position, he receives a memo from the chief operating officer of Lothar, Maria Steiner, informing him of a major delay in one of the company&#x27;s South African mining projects. In the memo, Steiner states the following:<\/p><p>&quot;As usual, the project delay will require a short-term loan to cover the funding shortage that will accompany the extra time until project completion. I have estimated that in 210 days, we will require a 90-day project loan in the amount of $2,350,000. I would like you to establish another FRA position, this time with a contract rate of 6.95%.&quot;<\/p><p>Walker discusses some of these strategies with Pete Barka, partner at the brokerage firm that clears derivatives trades for Lothar. Barka suggests options on the Nasdaq 100 index futures as a use for Lothar&#x27;s excess cash. September futures price on the Nasdaq 100 index is currently at 4243. Three-month calls and puts with a strike price of 4200 are available. Exhibit 3 shows information about the options.<\/p><p><b>Exhibit 3: Three-Month Options on Nasdaq 100<\/b><\/p><div class=\"tbl\"><table><tr><td>Strike price (for both calls and puts)<\/td><td>$4200<\/td><\/tr><tr><td>Call premium<\/td><td>$243<\/td><\/tr><tr><td>Put premium<\/td><td>$196<\/td><\/tr><tr><td>Implied volatility<\/td><td>26%<\/td><\/tr><tr><td>Continuously compounded risk-free rate<\/td><td>0.35%<\/td><\/tr><tr><td>N(d )<\/td><td>0.5597<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>N(d )<\/td><td>0.5080<\/td><\/tr><\/table><\/div><p>2<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following transactions should Walker initiate in order to comply with Steiner&#x27;s request regarding the funding shortage at the South African gold mine? Establish:<\/p><\/div>", "subj": "derivatives"}, {"n": 49, "q": "To address the client's concerns about extreme stress events on the portfolio value, Yeung is most likely to communicate the portfolio's:", "opts": ["VaR.", "relative VaR.", "conditional VaR."], "ans": "C", "expl": "Yeung should present the portfolio's conditional VaR, which is the expected loss in the tail (given that VaR is exceeded). VaR just communicates the maximum loss a certain percentage of the time. Relative VaR is appropriate only for clients concerned about performance relative to a benchmark. For Further Reference: (Study Session 16, Module 45.2, LOS 45.e)", "explhtml": "<p>Yeung should present the portfolio&#x27;s conditional VaR, which is the expected loss in the tail (given that VaR is exceeded). VaR just communicates the maximum loss a certain percentage of the time. Relative VaR is appropriate only for clients concerned about performance relative to a benchmark.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 45.2, LOS 45.e)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Questions 109 through 114 relate to Portfolio Management.<\/p><p>Pearl Asset Management Case Scenario<\/p><p>Hong Zhou, Jianguo Yeung, and Jm Leor Joeng work for Pearl Asset Management, a large private wealth advisory firm. During lunch they discuss various unique client situations they face and how they plan to resolve them.<\/p><p>Yeung mentions that yesterday, he met one of his clients who was very concerned about current market volatility and its impact on his portfolio. Specifically, the client is concerned about the impact of extreme stress events.<\/p><p>Zhou, Yeung, and Joeng are all developing multifactor models to attempt to explain asset price returns. Zhou has built his model based on standardized sensitivities of asset returns to intrinsic valuation model inputs. When Zhou asks Yeung about factors that his model uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><p>Lincoln Fund Russell 2000<\/p><div class=\"tbl\"><table><tr><td>Expected annual return<\/td><td>7.6%<\/td><td>6.5%<\/td><\/tr><tr><td>Return standard deviation<\/td><td>19.0%<\/td><td>11.0%<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><p>Joeng asks Zhou about risk premium on an asset. Specifically, Joeng wants to know the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. Joeng also wants to know the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><\/div><\/details><div class=\"qtext\"><p>To address the client&#x27;s concerns about extreme stress events on the portfolio value, Yeung is most likely to communicate the portfolio&#x27;s:<\/p><\/div>", "subj": "portfolio"}, {"n": 50, "q": "Regarding the use of multifactor models, which of the following statements is most likely to be correct?", "opts": ["Zhou is using a macroeconomic model, Yeung is using a fundamental factor model, and Joeng is using principal component analysis.", "Zhou is using a fundamental factor model, Yeung is using principal component analysis, and Joeng is using a macroeconomic model.", "Zhou is using principal component analysis, Yeung is using a macroeconomic model, and Joeng is using a fundamental factor model."], "ans": "B", "expl": "Macroeconomic models are based on surprises in macroeconomic data. Principal component analysis is used to identify the factors of a statistical factor model, which cannot necessarily be described using conventional economic variables. Fundamental factor models use firm-specific valuation metrics such as PE with standardized sensitivities. For Further Reference: (Study Session 16, Module 44.2, LOS 44.d)", "explhtml": "<p>Macroeconomic models are based on surprises in macroeconomic data. Principal component analysis is used to identify the factors of a statistical factor model, which cannot necessarily be described using conventional economic variables. Fundamental factor models use firm-specific valuation metrics such as PE with standardized sensitivities.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.2, LOS 44.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 109 through 114 relate to Portfolio Management.<\/p><p>Pearl Asset Management Case Scenario<\/p><p>Hong Zhou, Jianguo Yeung, and Jm Leor Joeng work for Pearl Asset Management, a large private wealth advisory firm. During lunch they discuss various unique client situations they face and how they plan to resolve them.<\/p><p>Yeung mentions that yesterday, he met one of his clients who was very concerned about current market volatility and its impact on his portfolio. Specifically, the client is concerned about the impact of extreme stress events.<\/p><p>Zhou, Yeung, and Joeng are all developing multifactor models to attempt to explain asset price returns. Zhou has built his model based on standardized sensitivities of asset returns to intrinsic valuation model inputs. When Zhou asks Yeung about factors that his model uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><p>Lincoln Fund Russell 2000<\/p><div class=\"tbl\"><table><tr><td>Expected annual return<\/td><td> td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><p>Joeng asks Zhou about risk premium on an asset. Specifically, Joeng wants to know the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. Joeng also wants to know the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><\/div><\/details><div class=\"qtext\"><p>To achieve the optimal level of active risk, what proportion of funds would Zhou allocate to the Lincoln fund?<\/p><\/div>", "subj": "portfolio"}, {"n": 52, "q": "The highest Sharpe ratio that Zhou can achieve by combining the Lincoln fund and the Russell 2000 is closest to:", "opts": ["0.39.", "0.42.", "1.12."], "ans": "A", "expl": "The highest Sharpe ratio can be calculated using the relation SR P2 = SR B2 + IR : 2 Thus, the highest Sharpe ratio that can be achieved by combining the active and passive portfolios is approximately 0.39. For Further Reference: (Study Session 17, Module 47.3, LOS 47.d)", "explhtml": "<div class=\"tbl\"><table><tr><td>The highest Sharpe ratio can be calculated using the relation SR<\/td><td>P2<\/td><td> = SR<\/td><td>B2<\/td><td> + IR :<\/td><td>2<\/td><\/tr><\/table><\/div><p>Thus, the highest Sharpe ratio that can be achieved by combining the active and passive portfolios is approximately 0.39.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 47.3, LOS 47.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 109 through 114 relate to Portfolio Management.<\/p><p>Pearl Asset Management Case Scenario<\/p><p>Hong Zhou, Jianguo Yeung, and Jm Leor Joeng work for Pearl Asset Management, a large private wealth advisory firm. During lunch they discuss various unique client situations they face and how they plan to resolve them.<\/p><p>Yeung mentions that yesterday, he met one of his clients who was very concerned about current market volatility and its impact on his portfolio. Specifically, the client is concerned about the impact of extreme stress events.<\/p><p>Zhou, Yeung, and Joeng are all developing multifactor models to attempt to explain asset price returns. Zhou has built his model based on standardized sensitivities of asset returns to intrinsic valuation model inputs. When Zhou asks Yeung about factors that his model uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><p>Lincoln Fund Russell 2000<\/p><div class=\"tbl\"><table><tr><td>Expected annual return<\/td><td>7.6%<\/td><td>6.5%<\/td><\/tr><tr><td>Return standard deviation<\/td><td>19.0%<\/td><td>11.0%<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><p>Joeng asks Zhou about risk premium on an asset. Specifically, Joeng wants to know the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. Joeng also wants to know the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><\/div><\/details><div class=\"qtext\"><p>The highest Sharpe ratio that Zhou can achieve by combining the Lincoln fund and the Russell 2000 is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 53, "q": "With regard to Joeng's question, Zhou would most appropriately reply that the risk premium would be:", "opts": ["lower.", "higher.", "unaffected by the correlation."], "ans": "B", "expl": "An asset whose value is negatively correlated to the investor's utility from future consumption provides a poor hedge against bad consumption outcomes. That is, the asset pays off more when the investor's utility is low. Such assets would command a higher risk premium. For Further Reference: (Study Session 17, Module 46.1, LOS 46.c)", "explhtml": "<p>An asset whose value is negatively correlated to the investor&#x27;s utility from future consumption provides a poor hedge against bad consumption outcomes. That is, the asset pays off more when the investor&#x27;s utility is low. Such assets would command a higher risk premium.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 46.1, LOS 46.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 109 through 114 relate to Portfolio Management.<\/p><p>Pearl Asset Management Case Scenario<\/p><p>Hong Zhou, Jianguo Yeung, and Jm Leor Joeng work for Pearl Asset Management, a large private wealth advisory firm. During lunch they discuss various unique client situations they face and how they plan to resolve them.<\/p><p>Yeung mentions that yesterday, he met one of his clients who was very concerned about current market volatility and its impact on his portfolio. Specifically, the client is concerned about the impact of extreme stress events.<\/p><p>Zhou, Yeung, and Joeng are all developing multifactor models to attempt to explain asset price returns. Zhou has built his model based on standardized sensitivities of asset returns to intrinsic valuation model inputs. When Zhou asks Yeung about factors that his model uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><p>Lincoln Fund Russell 2000<\/p><div class=\"tbl\"><table><tr><td>Expected annual return<\/td><td>7.6%<\/td><td>6.5%<\/td><\/tr><tr><td>Return standard deviation<\/td><td>19.0%<\/td><td>11.0%<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><p>Joeng asks Zhou about risk premium on an asset. Specifically, Joeng wants to know the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. Joeng also wants to know the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to Joeng&#x27;s question, Zhou would most appropriately reply that the risk premium would be:<\/p><\/div>", "subj": "portfolio"}, {"n": 54, "q": "For countries with high expected economic growth, it is least likely that:", "opts": ["real risk-free rates will be high.", "inter-temporal rate of substitution will be high.", "investors will save less."], "ans": "B", "expl": "For countries with high expected economic growth rates, real rates will be high. Investors will be less concerned about the future, and the inter-temporal rate of substitution will be low. Also, investors will want to increase current consumption and, hence, will borrow more and save less. For Further Reference: (Study Session 17, Module 46.1, LOS 46.c)", "explhtml": "<p>For countries with high expected economic growth rates, real rates will be high. Investors will be less concerned about the future, and the inter-temporal rate of substitution will be low. Also, investors will want to increase current consumption and, hence, will borrow more and save less.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 46.1, LOS 46.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 109 through 114 relate to Portfolio Management.<\/p><p>Pearl Asset Management Case Scenario<\/p><p>Hong Zhou, Jianguo Yeung, and Jm Leor Joeng work for Pearl Asset Management, a large private wealth advisory firm. During lunch they discuss various unique client situations they face and how they plan to resolve them.<\/p><p>Yeung mentions that yesterday, he met one of his clients who was very concerned about current market volatility and its impact on his portfolio. Specifically, the client is concerned about the impact of extreme stress events.<\/p><p>Zhou, Yeung, and Joeng are all developing multifactor models to attempt to explain asset price returns. Zhou has built his model based on standardized sensitivities of asset returns to intrinsic valuation model inputs. When Zhou asks Yeung about factors that his model uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><p>Lincoln Fund Russell 2000<\/p><div class=\"tbl\"><table><tr><td>Expected annual return<\/td><td>7.6%<\/td><td>6.5%<\/td><\/tr><tr><td>Return standard deviation<\/td><td>19.0%<\/td><td>11.0%<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><p>Joeng asks Zhou about risk premium on an asset. Specifically, Joeng wants to know the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. Joeng also wants to know the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><\/div><\/details><div class=\"qtext\"><p>For countries with high expected economic growth, it is least likely that:<\/p><\/div>", "subj": "portfolio"}, {"n": 55, "q": "Using the information in Exhibit 1, the expected return on the portfolio is closest to:", "opts": ["8.4%.", "9.2%.", "9.7%."], "ans": "C", "expl": "E(R ) = 0.6E(R ) + 0.4E(R ) = 0.6(9%) + 0.4(10.8%) = 9.72% P WMB REL For Further Reference: (Study Session 16, Module 44.2, LOS 44.d)", "explhtml": "<div class=\"tbl\"><table><tr><td>E(R ) = 0.6E(R<\/td><td>) + 0.4E(R<\/td><td>) = 0.6(9%) + 0.4(10.8%) = 9.72%<\/td><\/tr><tr><td>P<\/td><td>WMB<\/td><td>REL<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.2, LOS 44.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Questions 115 through 120 relate to Portfolio Management.<\/p><p>Millennium Investments Case Scenario<\/p><p>Millennium Investments (MI), an investment advisory firm, provides asset allocation recommendations for its clients. Richie Shepard, senior analyst at MI, is using a two-factor macroeconomic model to evaluate a portfolio of two stocks: WMB and REL. The two factors in the model are surprises in inflation and in real GDP growth rate (both given in percentages). The portfolio is invested 60% in WMB. Factor sensitivity and other information for the two stocks are shown in Exhibit 1.<\/p><p><b>Exhibit 1: WMB and REL<\/b><\/p><div class=\"tbl\"><table><tr><td>Stock<\/td><td>E(R)<\/td><td>Inflation GDP Growth Rate<\/td><td><\/td><\/tr><tr><td>WMB<\/td><td>9%<\/td><td>–2.2<\/td><td>+3.0<\/td><\/tr><tr><td>REL<\/td><td>10.8%<\/td><td>–1.0<\/td><td>+3.3<\/td><\/tr><\/table><\/div><p>Another stock (not in the portfolio), PSL, has a factor sensitivity of –0.9 to inflation and +1.2 to GDP growth rate.<\/p><p>Shepard is also looking at evaluating three portfolios using a single-factor model. Information about the three portfolios is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Portfolio Factor Sensitivity and Expected Return<\/b><\/p><p>Portfolio Expected Return Factor Sensitivity<\/p><div class=\"tbl\"><table><tr><td>X<\/td><td>0.10<\/td><td>1.00<\/td><\/tr><tr><td>Y<\/td><td>0.12<\/td><td>1.25<\/td><\/tr><tr><td>Z<\/td><td>0.15<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>Shepard is meeting with a client to discuss inclusion of actively managed funds in that client&#x27;s portfolio. To prepare for the meeting, Shepard prepares a presentation to illustrate the merits and risks of this change. Shepard cannot recall the term that is used to capture the sum of active factor risk and active specific risk.<\/p><p>Shepard feels that the economy is finally out of recession and poised for robust growth over the next three to five years.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1, the expected return on the portfolio is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 56, "q": "Using information in Exhibit 1, the portfolio's sensitivity to inflation is closest to:", "opts": ["–1.1.", "–1.7.", "–2.2."], "ans": "B", "expl": "β = 0.6β + 0.4β = 0.6(–2.2) + 0.4(–1.0) = –1.72 P,INF WMB,INF REL,INF For Further Reference: (Study Session 16, Module 44.2, LOS 44.d)", "explhtml": "<div class=\"tbl\"><table><tr><td>β<\/td><td> = 0.6β<\/td><td> + 0.4β<\/td><td> = 0.6(–2.2) + 0.4(–1.0) = –1.72<\/td><\/tr><tr><td>P,INF<\/td><td>WMB,INF<\/td><td>REL,INF<\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.2, LOS 44.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 115 through 120 relate to Portfolio Management.<\/p><p>Millennium Investments Case Scenario<\/p><p>Millennium Investments (MI), an investment advisory firm, provides asset allocation recommendations for its clients. Richie Shepard, senior analyst at MI, is using a two-factor macroeconomic model to evaluate a portfolio of two stocks: WMB and REL. The two factors in the model are surprises in inflation and in real GDP growth rate (both given in percentages). The portfolio is invested 60% in WMB. Factor sensitivity and other information for the two stocks are shown in Exhibit 1.<\/p><p><b>Exhibit 1: WMB and REL<\/b><\/p><div class=\"tbl\"><table><tr><td>Stock<\/td><td>E(R)<\/td><td>Inflation GDP Growth Rate<\/td><td><\/td><\/tr><tr><td>WMB<\/td><td>9%<\/td><td>–2.2<\/td><td>+3.0<\/td><\/tr><tr><td>REL<\/td><td>10.8%<\/td><td>–1.0<\/td><td>+3.3<\/td><\/tr><\/table><\/div><p>Another stock (not in the portfolio), PSL, has a factor sensitivity of –0.9 to inflation and +1.2 to GDP growth rate.<\/p><p>Shepard is also looking at evaluating three portfolios using a single-factor model. Information about the three portfolios is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Portfolio Factor Sensitivity and Expected Return<\/b><\/p><p>Portfolio Expected Return Factor Sensitivity<\/p><div class=\"tbl\"><table><tr><td>X<\/td><td>0.10<\/td><td>1.00<\/td><\/tr><tr><td>Y<\/td><td>0.12<\/td><td>1.25<\/td><\/tr><tr><td>Z<\/td><td>0.15<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>Shepard is meeting with a client to discuss inclusion of actively managed funds in that client&#x27;s portfolio. To prepare for the meeting, Shepard prepares a presentation to illustrate the merits and risks of this change. Shepard cannot recall the term that is used to capture the sum of active factor risk and active specific risk.<\/p><p>Shepard feels that the economy is finally out of recession and poised for robust growth over the next three to five years.<\/p><\/div><\/details><div class=\"qtext\"><p>Using information in Exhibit 1, the portfolio&#x27;s sensitivity to inflation is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 57, "q": "Last year, PSL's actual return was 8% (0.5% unexplained by the model). Inflation surprise, as well as GDP growth rate surprise, was +0.5%. PSL's expected return was closest to:", "opts": ["7.35%.", "7.50%.", "8.50%."], "ans": "A", "expl": "8 = E(R) + (–0.9 × 0.5) + (1.2 × 0.5) + (0.5) E(R) = 7.35% For Further Reference: (Study Session 16, Module 44.2, LOS 44.d)", "explhtml": "<p>8 = E(R) + (–0.9 × 0.5) + (1.2 × 0.5) + (0.5)<\/p><p>E(R) = 7.35%<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.2, LOS 44.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 115 through 120 relate to Portfolio Management.<\/p><p>Millennium Investments Case Scenario<\/p><p>Millennium Investments (MI), an investment advisory firm, provides asset allocation recommendations for its clients. Richie Shepard, senior analyst at MI, is using a two-factor macroeconomic model to evaluate a portfolio of two stocks: WMB and REL. The two factors in the model are surprises in inflation and in real GDP growth rate (both given in percentages). The portfolio is invested 60% in WMB. Factor sensitivity and other information for the two stocks are shown in Exhibit 1.<\/p><p><b>Exhibit 1: WMB and REL<\/b><\/p><div class=\"tbl\"><table><tr><td>Stock<\/td><td>E(R)<\/td><td>Inflation GDP Growth Rate<\/td><td><\/td><\/tr><tr><td>WMB<\/td><td>9%<\/td><td>–2.2<\/td><td>+3.0<\/td><\/tr><tr><td>REL<\/td><td>10.8%<\/td><td>–1.0<\/td><td>+3.3<\/td><\/tr><\/table><\/div><p>Another stock (not in the portfolio), PSL, has a factor sensitivity of –0.9 to inflation and +1.2 to GDP growth rate.<\/p><p>Shepard is also looking at evaluating three portfolios using a single-factor model. Information about the three portfolios is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Portfolio Factor Sensitivity and Expected Return<\/b><\/p><p>Portfolio Expected Return Factor Sensitivity<\/p><div class=\"tbl\"><table><tr><td>X<\/td><td>0.10<\/td><td>1.00<\/td><\/tr><tr><td>Y<\/td><td>0.12<\/td><td>1.25<\/td><\/tr><tr><td>Z<\/td><td>0.15<\/td><td>1.50<\/td><\/tr><\/table><\/div><p>Shepard is meeting with a client to discuss inclusion of actively managed funds in that client&#x27;s portfolio. To prepare for the meeting, Shepard prepares a presentation to illustrate the merits and risks of this change. Shepard cannot recall the term that is used to capture the sum of active factor risk and active specific risk.<\/p><p>Shepard feels that the economy is finally out of recession and poised for robust growth over the next three to five years.<\/p><\/div><\/details><div class=\"qtext\"><p>Last year, PSL&#x27;s actual return was 8% (0.5% unexplained by the model). Inflation surprise, as well as GDP growth rate surprise, was +0.5%. PSL&#x27;s expected return was closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 58, "q": "Using information in Exhibit 2, taking advantage of an arbitrage opportunity would most likely require shorting:", "opts": ["portfolio X.", "portfolio Y.", "portfolio Z."], "ans": "B", "expl": "Consider portfolio A comprising 50% portfolio X and 50% portfolio Z. Portfolio A will have an expected return of 12.5% and a factor sensitivity of 1.25. A long position in portfolio A and short position in portfolio Y will have an expected return of 0.5% with zero factor sensitivity. For Further Reference: (Study Session 16, Module 44.1, LOS 44.b)", "explhtml": "<p>Consider portfolio A comprising 50% portfolio X and 50% portfolio Z. Portfolio A will have an expected return of 12.5% and a factor sensitivity of 1.25. A long position in portfolio A and short position in portfolio Y will have an expected return of 0.5% with zero factor sensitivity.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 44.1, LOS 44.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 115 through 120 relate to Portfolio Management.<\/p><p>Millennium Investments Case Scenario<\/p><p>Millennium Investments (MI), an investment advisory firm, provides asset allocation recommendations for its clients. Richie Shepard, senior analyst at MI, is using a two-factor macroeconomic model to evaluate a portfolio of two stocks: WMB and REL. The two factors in the model are surprises in inflation and in real GDP growth rate (both given in percentages). The portfolio is invested 60% in WMB. Factor sensitivity and other information for the two stocks are shown in Exhibit 1.<\/p><p><b>Exhibit 1: WMB and REL<\/b><\/p><div class=\"tbl\"><table><tr><td>Stock<\/td><td>E(R)<\/td><td>Inflation GDP Growth Rate<\/td><td><\/td><\/tr><tr><td>WMB<\/td><td>9%<\/td><td>–2.2<\/td><td>+3.0<\/td><\/tr><tr><td>REL<\/td><td>10.8%<\/td><td>–1.0<\/td><td>+3.3<\/td><\/tr><\/table><\/div><p>Another stock (not in the portfolio), PSL, has a factor const CFG = {"title": "Extra Full Syllabus V2 · Exam 1 — Afternoon (PM)", "subtitle": "CFA Level II · 60 câu · 3 giờ", "minutes": 180, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;

      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }

    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);

  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");

  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;

  if(!label){
    label=document.createElement("span"); label.className="question-subject";

  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;

}

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;

        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

<style id="qnav-note-css">
  #navGrid .cell.noted::before{content:"\1F4DD";position:absolute;top:-4px;left:-3px;font-size:10px;line-height:1}
</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
