 is expected to depreciate relative to the U.S. dollar over the next few years. Local currency prices are forecasted to remain stable, however.<\/p><p>One of the managers at WMC asks Smith to analyze a third subsidiary located in India. The manager has explained that real interest rates in India over the past three years have been 2.00%, 2.50%, and 3.00%, respectively, while nominal interest rates have been 34.64%, 29.15%, and 25.66%, respectively. Smith requests more time to analyze the Indian subsidiary.<\/p><\/div><\/details><div class=\"qtext\"><p>For the period 2014–2016, WMC&#x27;s annual USD revenue growth rate attributable to its Australian subsidiary is most likely:<\/p><\/div>", "subj": "fsa"}, {"n": 17, "q": "Which of the following statements regarding the consolidation of WMC's Ukrainian subsidiary for the next year is least likely correct? Compared to the temporal method, the Ukrainian subsidiary's translated:", "opts": ["net income before translation gains or losses would be higher using the current rate method.", "debt-to-equity ratio would be higher using the current rate method.", "gross profit margin would be lower using the current rate method."], "ans": "C", "expl": "Under both the current rate and temporal methods, the revenues for the Ukrainian subsidiary would be translated using the average rate. Cost of goods sold (COGS) would be translated using the historical rate for the temporal method and the average rate for the current rate method. Note that because local currency prices are expected to be constant in Ukraine, there will be no difference between LIFO and FIFO since all beginning, purchased, sold, and ending inventory will have the same cost. When a currency is depreciating, the COGS based on historical cost (temporal method) will be higher than COGS translated at the average rate (current rate method) since the average rate will incorporate the historical exchange rate and the most recent (depreciated) exchange rate, decreasing the COGS. For instance, if COGS in the local currency is 10 and the historical and average exchange rates are 1 and 1.5 (local currency per reporting currency), then COGS under the temporal method will be 10 and under the current rate method will be 6.67. Since translated sales are the same under both methods, gross profit and the gross profit margin will be higher under the current rate method. For Further Reference: (Study Session 5, Module 15.6, LOS 15.f)", "explhtml": "<p>Under both the current rate and temporal methods, the revenues for the Ukrainian subsidiary would be translated using the average rate. Cost of goods sold (COGS) would be translated using the historical rate for the temporal method and the average rate for the current rate method. Note that because local currency prices are expected to be constant in Ukraine, there will be no difference between LIFO and FIFO since all beginning, purchased, sold, and ending inventory will have the same cost. When a currency is depreciating, the COGS based on historical cost (temporal method) will be higher than COGS translated at the average rate (current rate method) since the average rate will incorporate the historical exchange rate and the most recent (depreciated) exchange rate, decreasing the COGS. For instance, if COGS in the local currency is 10 and the historical and average exchange rates are 1 and 1.5 (local currency per reporting currency), then COGS under the temporal method will be 10 and under the current rate method will be 6.67. Since translated sales are the same under both methods, gross profit and the gross profit margin will be higher under the current rate method.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.6, LOS 15.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Financial Reporting and Analysis.<\/p><p>Whitmore Corporation Case Scenario<\/p><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><p>Income Statement (AUD millions) 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Interest expense<\/td><td>18<\/td><td>17<\/td><td>16<\/td><\/tr><tr><td>Income before tax<\/td><td>42<\/td><td>50<\/td><td>24<\/td><\/tr><tr><td>Taxes<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><tr><td>Net income<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><\/table><\/div><p>Balance Sheet (AUD millions)<\/p><div class=\"tbl\"><table><tr><td>2014 2015 2016<\/td><td>2014 2015 2016<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>22<\/td><td>25<\/td><td>20 Current liabilities<\/td><td>616<\/td><td>593<\/td><td>584<\/td><\/tr><tr><td>Accounts receivable<\/td><td>400<\/td><td>422<\/td><td>460 Long-term debt<\/td><td>180<\/td><td>170<\/td><td>160<\/td><\/tr><tr><td>Inventories<\/td><td>20<\/td><td>25<\/td><td>30<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prepaid expenses<\/td><td>8<\/td><td>20<\/td><td>25 Common stock<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Net fixed assets<\/td><td>500<\/td><td>450<\/td><td>400 Retained earnings<\/td><td>104<\/td><td>129<\/td><td>141<\/td><\/tr><tr><td>Total assets<\/td><td>950<\/td><td>942<\/td><td>935 Total liabilities &amp; equity<\/td><td>950<\/td><td>942<\/td><td>935<\/td><\/tr><\/table><\/div><p>Exchange rates (AUD / USD) 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average exchange rate<\/td><td>1.40<\/td><td>1.30<\/td><td>1.45<\/td><\/tr><tr><td>Year-end exchange rate<\/td><td>1.20<\/td><td>1.40<\/td><td>1.50<\/td><\/tr><tr><td>Historical exchange rate<\/td><td>1.20<\/td><td>1.20<\/td><td>1.20<\/td><\/tr><\/table><\/div><p>Smith has discovered that WMC has a small subsidiary in Ukraine. The subsidiary follows IAS accounting rules and uses FIFO inventory accounting. The Ukrainian subsidiary was acquired 10 years ago and has been fully integrated into WMC&#x27;s operations. WMC obtains funding for the subsidiary whenever the company finds profitable investments within Ukraine or surrounding countries. According to forecasts from economists, the Ukrainian currency is expected to depreciate relative to the U.S. dollar over the next few years. Local currency prices are forecasted to remain stable, however.<\/p><p>One of the managers at WMC asks Smith to analyze a third subsidiary located in India. The manager has explained that real interest rates in India over the past three years have been 2.00%, 2.50%, and 3.00%, respectively, while nominal interest rates have been 34.64%, 29.15%, and 25.66%, respectively. Smith requests more time to analyze the Indian subsidiary.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements regarding the consolidation of WMC&#x27;s Ukrainian subsidiary for the next year is least likely correct? Compared to the temporal method, the Ukrainian subsidiary&#x27;s translated:<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "Which of the following statements related to the consolidation of WMC's Indian subsidiary is least likely correct?", "opts": ["The Indian economic environment meets the criteria to be classified as a hyperinflationary economy.", "IFRS would allow WMC to translate the inflation-indexed value of nonmonetary assets of the Indian subsidiary at the current exchange rate.", "WMC can reduce potential translation losses from the Indian subsidiary by issuing debt denominated in U.S. currency and purchasing fixed assets for the subsidiary."], "ans": "C", "expl": "U.S. accounting standards define a hyperinflationary economy as one in which the 3-year cumulative inflation rate exceeds 100%. The Indian economy can be characterized as hyperinflationary. The inflation rate over the past three years can be calculated as follows: year 1 inflation = [(1 + 0.3464) / (1 + 0.020)] − 1 = 32% year 2 inflation = [(1 + 0.2915) / (1 + 0.025)] − 1 = 26% year 3 inflation = [(1 + 0.2566) / (1 + 0.030)] − 1 = 22% cumulative 3-year inflation = (1.32)(1.26)(1.22) − 1 = 103% U.S. accounting standards allow the use of the temporal method, with the functional currency being the parent's reporting currency, when a foreign subsidiary is operating in a hyperinflationary environment. IFRS accounting standards allow the parent to translate an inflation-adjusted value of the nonmonetary assets and liabilities of the foreign subsidiary at the current inflation rate, removing most of the effects of high inflation on the value of the nonmonetary assets and liabilities in the reporting currency. In a hyperinflationary environment, the parent company can reduce translation losses by reducing its net monetary assets or increasing its net monetary liabilities. In order to do this, the parent should issue debt denominated in the subsidiary's local currency and invest the proceeds in fixed assets for the subsidiary to use in its operations. For Further Reference: (Study Session 5, Module 15.7, LOS 15.g)", "explhtml": "<p>U.S. accounting standards define a hyperinflationary economy as one in which the 3-year cumulative inflation rate exceeds 100%. The Indian economy can be characterized as hyperinflationary. The inflation rate over the past three years can be calculated as follows:<\/p><p>year 1 inflation = [(1 + 0.3464) / (1 + 0.020)] − 1 = 32%<\/p><p>year 2 inflation = [(1 + 0.2915) / (1 + 0.025)] − 1 = 26%<\/p><p>year 3 inflation = [(1 + 0.2566) / (1 + 0.030)] − 1 = 22%<\/p><p>cumulative 3-year inflation = (1.32)(1.26)(1.22) − 1 = 103%<\/p><p>U.S. accounting standards allow the use of the temporal method, with the functional currency being the parent&#x27;s reporting currency, when a foreign subsidiary is operating in a hyperinflationary environment. IFRS accounting standards allow the parent to translate an inflation-adjusted value of the nonmonetary assets and liabilities of the foreign subsidiary at the current inflation rate, removing most of the effects of high inflation on the value of the nonmonetary assets and liabilities in the reporting currency. In a hyperinflationary environment, the parent company can reduce translation losses by reducing its net monetary assets or increasing its net monetary liabilities. In order to do this, the parent should issue debt denominated in the subsidiary&#x27;s local currency and invest the proceeds in fixed assets for the subsidiary to use in its operations.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.7, LOS 15.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Financial Reporting and Analysis.<\/p><p>Whitmore Corporation Case Scenario<\/p><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><p>Income Statement (AUD millions) 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Interest expense<\/td><td>18<\/td><td>17<\/td><td>16<\/td><\/tr><tr><td>Income before tax<\/td><td>42<\/td><td>50<\/td><td>24<\/td><\/tr><tr><td>Taxes<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><tr><td>Net income<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><\/table><\/div><p>Balance Sheet (AUD millions)<\/p><div class=\"tbl\"><table><tr><td>2014 2015 2016<\/td><td>2014 2015 2016<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>22<\/td><td>25<\/td><td>20 Current liabilities<\/td><td>616<\/td><td>593<\/td><td>584<\/td><\/tr><tr><td>Accounts receivable<\/td><td>400<\/td><td>422<\/td><td>460 Long-term debt<\/td><td>180<\/td><td>170<\/td><td>160<\/td><\/tr><tr><td>Inventories<\/td><td>20<\/td><td>25<\/td><td>30<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prepaid expenses<\/td><td>8<\/td><td>20<\/td><td>25 Common stock<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Net fixed assets<\/td><td>500<\/td><td>450<\/td><td>400 Retained earnings<\/td><td>104<\/td><td>129<\/td><td>141<\/td><\/tr><tr><td>Total assets<\/td><td>950<\/td><td>942<\/td><td>935 Total liabilities &amp; equity<\/td><td>950<\/td><td>942<\/td><td>935<\/td><\/tr><\/table><\/div><p>Exchange rates (AUD / USD) 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average exchange rate<\/td><td>1.40<\/td><td>1.30<\/td><td>1.45<\/td><\/tr><tr><td>Year-end exchange rate<\/td><td>1.20<\/td><td>1.40<\/td><td>1.50<\/td><\/tr><tr><td>Historical exchange rate<\/td><td>1.20<\/td><td>1.20<\/td><td>1.20<\/td><\/tr><\/table><\/div><p>Smith has discovered that WMC has a small subsidiary in Ukraine. The subsidiary follows IAS accounting rules and uses FIFO inventory accounting. The Ukrainian subsidiary was acquired 10 years ago and has been fully integrated into WMC&#x27;s operations. WMC obtains funding for the subsidiary whenever the company finds profitable investments within Ukraine or surrounding countries. According to forecasts from economists, the Ukrainian currency is expected to depreciate relative to the U.S. dollar over the next few years. Local currency prices are forecasted to remain stable, however.<\/p><p>One of the managers at WMC asks Smith to analyze a third subsidiary located in India. The manager has explained that real interest rates in India over the past three years have been 2.00%, 2.50%, and 3.00%, respectively, while nominal interest rates have been 34.64%, 29.15%, and 25.66%, respectively. Smith requests more time to analyze the Indian subsidiary.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements related to the consolidation of WMC&#x27;s Indian subsidiary is least likely correct?<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "Voyager used the pooling of interests method when accounting for the 2000 acquisition of Dragon, rather than the acquisition method it would use today. Which of the following is least likely a feature of the pooling of interests method?", "opts": ["Operating results for prior periods are restated as though the two firms were always combined.", "The pooling of interests method combines historic book values and fair values.", "The pooling of interests method combines historic book values."], "ans": "B", "expl": "Historically, two accounting methods have been used for business combinations: (1) the purchase method and (2) the pooling-of-interests method. However, over the last few years, the pooling method has been eliminated from U.S. GAAP and IFRS. Now, the acquisition method is required. The pooling-of-interests method, also known as uniting-of-interests method under IFRS, combined the ownership interests of the two firms and viewed the participants as equals—neither firm acquired the other. The assets and liabilities of the two firms were simply combined. Key attributes of the pooling method include the following: The two firms are combined using historical book values. Operating results for prior periods are restated as though the two firms were always combined. Ownership interests continue, and former accounting bases are maintained. Note that fair values played no role in accounting for a business combination using the pooling method—the actual price paid was suppressed from the balance sheet and income statement. For Further Reference: (Study Session 5, Module 13.4, LOS 13.c)", "explhtml": "<p>Historically, two accounting methods have been used for business combinations: (1) the purchase method and (2) the pooling-of-interests method. However, over the last few years, the pooling method has been eliminated from U.S. GAAP and IFRS. Now, the acquisition method is required.<\/p><p>The pooling-of-interests method, also known as uniting-of-interests method under IFRS, combined the ownership interests of the two firms and viewed the participants as equals—neither firm acquired the other. The assets and liabilities of the two firms were simply combined. Key attributes of the pooling method include the following:<\/p><p>The two firms are combined using historical book values. Operating results for prior periods are restated as though the two firms were always combined. Ownership interests continue, and former accounting bases are maintained.<\/p><p>Note that fair values played no role in accounting for a business combination using the pooling method—the actual price paid was suppressed from the balance sheet and income statement.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.4, LOS 13.c)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Corporate Finance.<\/p><p>Voyager, Inc., Case Scenario<\/p><p>Voyager, Inc., a primarily internet-based media company, is buying The Daily, a media company with exposure to newspapers, television, and the internet.<\/p><p>Company Descriptions Voyager, Inc., is organized into two segments: internet and newspaper publishing. The internet segment operates websites that offer news, entertainment, and advertising content in text and video format. The internet segment represents 75% of the company&#x27;s total revenues. The newspaper publishing segment publishes 10 daily newspapers. The newspaper publishing segment represents 25% of the company&#x27;s total revenues.<\/p><p>The Daily is organized into three segments: newspaper publishing (60% of revenues), broadcasting (35% of revenues), and internet (5% of revenues). The newspaper publishing segment publishes 101 daily newspapers. The broadcasting segment owns and operates 25 television stations. The internet segment consists of an internet advertising service. The Daily&#x27;s newspaper publishing and broadcasting segments cover the 20 largest markets in the United States.<\/p><p>Voyager&#x27;s acquisition of The Daily is the company&#x27;s second major acquisition in its history. The previous acquisition was at the height of the merger boom in the year 2000. Voyager purchased the Dragon Company at a premium-to-net-asset value, thereby doubling the company&#x27;s size. Voyager used the pooling method to account for the acquisition of Dragon; however, because of FASB changes to the Business Combination Standard, Voyager will use the acquisition method to account for the Daily acquisition.<\/p><p>(in millions, except per share data) Voyager, Inc. (before merger) The Daily (before merger)<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>$1,800<\/td><td>$7,600<\/td><\/tr><tr><td>Operating income<\/td><td>$415<\/td><td>$998<\/td><\/tr><tr><td>Earnings<\/td><td>$200<\/td><td>$650<\/td><\/tr><tr><td>Assets<\/td><td>$1,900<\/td><td>$14,700<\/td><\/tr><tr><td>Debt<\/td><td>$200<\/td><td>$2,500<\/td><\/tr><tr><td>Equity<\/td><td>$1,100<\/td><td>$7,600<\/td><\/tr><tr><td>Number of shares<\/td><td>117.6 million<\/td><td>213.1 million<\/td><\/tr><tr><td>Stock price per share<\/td><td>$68<\/td><td>$35<\/td><\/tr><tr><td>Earnings per share<\/td><td>$1.70<\/td><td>$3.05<\/td><\/tr><tr><td>PE ratio<\/td><td>40.0x<\/td><td>11.5x<\/td><\/tr><\/table><\/div><p>Voyager has made an all-cash offer of $45 per share to acquire The Daily. Wall Street is skeptical about the merger. While Voyager has been growing its revenues by 40% per year, The Daily&#x27;s revenue growth has been less than 2% per year. Michael Renner, the CFO of Voyager, defends the acquisition by stating that The Daily has accumulated a large amount of tax losses and that the combined company can benefit by immediately increasing net income after the merger. In addition, Renner states that the new Voyager will eliminate the inefficiencies of its internet operations and thereby boost future earnings. Renner believes that the merged companies will have a value of $17.5 billion.<\/p><p>In the past, The Daily&#x27;s management has publicly stated its opposition to merging with any company, a position management still maintains. As a result of this situation, Voyager submitted its merger proposal directly to The Daily&#x27;s board of directors, while the firm&#x27;s CEO was on vacation. Upon returning from vacation, The Daily&#x27;s CEO issued a public statement claiming that the proposed merger was unacceptable under any circumstances.<\/p><\/div><\/details><div class=\"qtext\"><p>Voyager used the pooling of interests method when accounting for the 2000 acquisition of Dragon, rather than the acquisition method it would use today. Which of the following is least likely a feature of the pooling of interests method?<\/p><\/div>", "subj": "corporate"}, {"n": 20, "q": "Based on Renner's comments defending Voyager's acquisition of The Daily, indicate whether his comments about net income and elimination of inefficiencies are most likely correct.", "opts": ["Only Renner’s comment that unused tax losses will immediately translate into higher net income is correct.", "Only Renner’s comment that the elimination of inefficiencies within the internet operations will create additional value is correct.", "Both comments are correct."], "ans": "A", "expl": "If the target of a merger has unused tax losses accumulated, the merged company can use the tax losses to immediately lower its tax liability, thus increasing its net income (Correct). The internet operation of The Daily is insignificant compared to the overall merger value. Any improvement in the cost structure of the internet operation will not have a significant impact on overall earnings. In addition, the high-growth characteristics of the internet segment would not warrant a cost restructuring of the operations (Incorrect). For Further Reference: (Study Session 8, Module 23.1, LOS 23.b)", "explhtml": "<p>If the target of a merger has unused tax losses accumulated, the merged company can use the tax losses to immediately lower its tax liability, thus increasing its net income (Correct). The internet operation of The Daily is insignificant compared to the overall merger value. Any improvement in the cost structure of the internet operation will not have a significant impact on overall earnings. In addition, the high-growth characteristics of the internet segment would not warrant a cost restructuring of the operations (Incorrect).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.1, LOS 23.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Corporate Finance.<\/p><p>Voyager, Inc., Case Scenario<\/p><p>Voyager, Inc., a primarily internet-based media company, is buying The Daily, a media company with exposure to newspapers, television, and the internet.<\/p><p>Company Descriptions Voyager, Inc., is organized into two segments: internet and newspaper publishing. The internet segment operates websites that offer news, entertainment, and advertising content in text and video format. The internet segment represents 75% of the company&#x27;s total revenues. The newspaper publishing segment publishes 10 daily newspapers. The newspaper publishing segment represents 25% of the company&#x27;s total revenues.<\/p><p>The Daily is organized into three segments: newspaper publishing (60% of revenues), broadcasting (35% of revenues), and internet (5% of revenues). The newspaper publishing segment publishes 101 daily newspapers. The broadcasting segment owns and operates 25 television stations. The internet segment consists of an internet advertising service. The Daily&#x27;s newspaper publishing and broadcasting segments cover the 20 largest markets in the United States.<\/p><p>Voyager&#x27;s acquisition of The Daily is the company&#x27;s second major acquisition in its history. The previous acquisition was at the height of the merger boom in the year 2000. Voyager purchased the Dragon Company at a premium-to-net-asset value, thereby doubling the company&#x27;s size. Voyager used the pooling method to account for the acquisition of Dragon; however, because of FASB changes to the Business Combination Standard, Voyager will use the acquisition method to account for the Daily acquisition.<\/p><p>(in millions, except per share data) Voyager, Inc. (before merger) The Daily (before merger)<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>$1,800<\/td><td>$7,600<\/td><\/tr><tr><td>Operating income<\/td><td>$415<\/td><td>$998<\/td><\/tr><tr><td>Earnings<\/td><td>$200<\/td><td>$650<\/td><\/tr><tr><td>Assets<\/td><td>$1,900<\/td><td>$14,700<\/td><\/tr><tr><td>Debt<\/td><td>$200<\/td><td>$2,500<\/td><\/tr><tr><td>Equity<\/td><td>$1,100<\/td><td>$7,600<\/td><\/tr><tr><td>Number of shares<\/td><td>117.6 million<\/td><td>213.1 million<\/td><\/tr><tr><td>Stock price per share<\/td><td>$68<\/td><td>$35<\/td><\/tr><tr><td>Earnings per share<\/td><td>$1.70<\/td><td>$3.05<\/td><\/tr><tr><td>PE ratio<\/td><td>40.0x<\/td><td>11.5x<\/td><\/tr><\/table><\/div><p>Voyager has made an all-cash offer of $45 per share to acquire The Daily. Wall Street is skeptical about the merger. While Voyager has been growing its revenues by 40% per year, The Daily&#x27;s revenue growth has been less than 2% per year. Michael Renner, the CFO of Voyager, defends the acquisition by stating that The Daily has accumulated a large amount of tax losses and that the combined company can benefit by immediately increasing net income after the merger. In addition, Renner states that the new Voyager will eliminate the inefficiencies of its internet operations and thereby boost future earnings. Renner believes that the merged companies will have a value of $17.5 billion.<\/p><p>In the past, The Daily&#x27;s management has publicly stated its opposition to merging with any company, a position management still maintains. As a result of this situation, Voyager submitted its merger proposal directly to The Daily&#x27;s board of directors, while the firm&#x27;s CEO was on vacation. Upon returning from vacation, The Daily&#x27;s CEO issued a public statement claiming that the proposed merger was unacceptable under any circumstances.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Renner&#x27;s comments defending Voyager&#x27;s acquisition of The Daily, indicate whether his comments about net income and elimination of inefficiencies are most likely correct.<\/p><\/div>", "subj": "corporate"}, {"n": 21, "q": "Assuming that Renner's estimate of the value of the merged companies is correct, calculate the acquirer's gain from the merger.", "opts": ["$7,910.5 million.", "$9,503.2 million.", "$11,634.2 million."], "ans": "B", "expl": "First, we must separate the synergistic value from the combined value of the firm as follows: V = V + V + S − C AT A T where: V = the combined value of the firm AT V = the value of the acquirer before the merger A V = the value of the target before the merger T S = the synergistic value from the merger C = the cash paid to the target Rearranging the formula, the synergistic value can be isolated as follows: Next, calculate the acquirer's gain as follows: acquirer's gain = S − (P − V ) T T where: S = the synergistic value from the merger P = the price paid for the target T V = the value of the target before the merger T For Further Reference: (Study Session 8, Module 23.4, LOS 23.k)", "explhtml": "<p>First, we must separate the synergistic value from the combined value of the firm as follows:<\/p><div class=\"tbl\"><table><tr><td>V<\/td><td> = V  + V  + S − C<\/td><td><\/td><\/tr><tr><td>AT<\/td><td>A<\/td><td>T<\/td><\/tr><tr><td>where:<\/td><td><\/td><td><\/td><\/tr><tr><td>V<\/td><td> = the combined value of the firm<\/td><td><\/td><\/tr><tr><td>AT<\/td><td><\/td><td><\/td><\/tr><tr><td>V  = the value of the acquirer before the merger<\/td><td><\/td><td><\/td><\/tr><tr><td>A<\/td><td><\/td><td><\/td><\/tr><tr><td>V  = the value of the target before the merger<\/td><td><\/td><td><\/td><\/tr><tr><td>T<\/td><td><\/td><td><\/td><\/tr><tr><td>S = the synergistic value from the merger<\/td><td><\/td><td><\/td><\/tr><tr><td>C = the cash paid to the target<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Rearranging the formula, the synergistic value can be isolated as follows:<\/p><p>Next, calculate the acquirer&#x27;s gain as follows:<\/p><p>acquirer&#x27;s gain = S − (P  − V )<\/p><div class=\"tbl\"><table><tr><td>T<\/td><td>T<\/td><\/tr><tr><td>where:<\/td><td><\/td><\/tr><tr><td>S = the synergistic value from the merger<\/td><td><\/td><\/tr><tr><td>P  = the price paid for the target<\/td><td><\/td><\/tr><tr><td>T<\/td><td><\/td><\/tr><tr><td>V  = the value of the target before the merger<\/td><td><\/td><\/tr><tr><td>T<\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.4, LOS 23.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Corporate Finance.<\/p><p>Voyager, Inc., Case Scenario<\/p><p>Voyager, Inc., a primarily internet-based media company, is buying The Daily, a media company with exposure to newspapers, television, and the internet.<\/p><p>Company Descriptions Voyager, Inc., is organized into two segments: internet and newspaper publishing. The internet segment operates websites that offer news, entertainment, and advertising content in text and video format. The internet segment represents 75% of the company&#x27;s total revenues. The newspaper publishing segment publishes 10 daily newspapers. The newspaper publishing segment represents 25% of the company&#x27;s total revenues.<\/p><p>The Daily is organized into three segments: newspaper publishing (60% of revenues), broadcasting (35% of revenues), and internet (5% of revenues). The newspaper publishing segment publishes 101 daily newspapers. The broadcasting segment owns and operates 25 television stations. The internet segment consists of an internet advertising service. The Daily&#x27;s newspaper publishing and broadcasting segments cover the 20 largest markets in the United States.<\/p><p>Voyager 10% of The Daily stock."], "ans": "B", "expl": "The legal action based on antitrust is the only choice given that is a post-offer defense. Staggered boards, restricted voting rights, and poison puts are all pre-offer defenses that would not be possible after the tender offer has been made. For Further Reference: (Study Session 8, Module 23.2, LOS 23.f)", "explhtml": "<p>The legal action based on antitrust is the only choice given that is a post-offer defense. Staggered boards, restricted voting rights, and poison puts are all pre-offer defenses that would not be possible after the tender offer has been made.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.2, LOS 23.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Corporate Finance.<\/p><p>Voyager, Inc., Case Scenario<\/p><p>Voyager, Inc., a primarily internet-based media company, is buying The Daily, a media company with exposure to newspapers, television, and the internet.<\/p><p>Company Descriptions Voyager, Inc., is organized into two segments: internet and newspaper publishing. The internet segment operates websites that offer news, entertainment, and advertising content in text and video format. The internet segment represents 75% of the company&#x27;s total revenues. The newspaper publishing segment publishes 10 daily newspapers. The newspaper publishing segment represents 25% of the company&#x27;s total revenues.<\/p><p>The Daily is organized into three segments: newspaper publishing (60% of revenues), broadcasting (35% of revenues), and internet (5% of revenues). The newspaper publishing segment publishes 101 daily newspapers. The broadcasting segment owns and operates 25 television stations. The internet segment consists of an internet advertising service. The Daily&#x27;s newspaper publishing and broadcasting segments cover the 20 largest markets in the United States.<\/p><p>Voyager&#x27;s acquisition of The Daily is the company&#x27;s second major acquisition in its history. The previous acquisition was at the height of the merger boom in the year 2000. Voyager purchased the Dragon Company at a premium-to-net-asset value, thereby doubling the company&#x27;s size. Voyager used the pooling method to account for the acquisition of Dragon; however, because of FASB changes to the Business Combination Standard, Voyager will use the acquisition method to account for the Daily acquisition.<\/p><p>(in millions, except per share data) Voyager, Inc. (before merger) The Daily (before merger)<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>$1,800<\/td><td>$7,600<\/td><\/tr><tr><td>Operating income<\/td><td>$415<\/td><td>$998<\/td><\/tr><tr><td>Earnings<\/td><td>$200<\/td><td>$650<\/td><\/tr><tr><td>Assets<\/td><td>$1,900<\/td><td>$14,700<\/td><\/tr><tr><td>Debt<\/td><td>$200<\/td><td>$2,500<\/td><\/tr><tr><td>Equity<\/td><td>$1,100<\/td><td>$7,600<\/td><\/tr><tr><td>Number of shares<\/td><td>117.6 million<\/td><td>213.1 million<\/td><\/tr><tr><td>Stock price per share<\/td><td>$68<\/td><td>$35<\/td><\/tr><tr><td>Earnings per share<\/td><td>$1.70<\/td><td>$3.05<\/td><\/tr><tr><td>PE ratio<\/td><td>40.0x<\/td><td>11.5x<\/td><\/tr><\/table><\/div><p>Voyager has made an all-cash offer of $45 per share to acquire The Daily. Wall Street is skeptical about the merger. While Voyager has been growing its revenues by 40% per year, The Daily&#x27;s revenue growth has been less than 2% per year. Michael Renner, the CFO of Voyager, defends the acquisition by stating that The Daily has accumulated a large amount of tax losses and that the combined company can benefit by immediately increasing net income after the merger. In addition, Renner states that the new Voyager will eliminate the inefficiencies of its internet operations and thereby boost future earnings. Renner believes that the merged companies will have a value of $17.5 billion.<\/p><p>In the past, The Daily&#x27;s management has publicly stated its opposition to merging with any company, a position management still maintains. As a result of this situation, Voyager submitted its merger proposal directly to The Daily&#x27;s board of directors, while the firm&#x27;s CEO was on vacation. Upon returning from vacation, The Daily&#x27;s CEO issued a public statement claiming that the proposed merger was unacceptable under any circumstances.<\/p><\/div><\/details><div class=\"qtext\"><p>The management of The Daily is not pleased with the $45 per share offering price. Which of the following is the most likely takeover defense The Daily would consider in an effort to stop the acquisition?<\/p><\/div>", "subj": "corporate"}, {"n": 24, "q": "Which of the following best characterizes Voyager's proposal to merge with The Daily?", "opts": ["Bear hug.", "Proxy fight.", "White knight."], "ans": "A", "expl": "A hostile merger occurs when the management of a merger target is opposed to the proposed merger. In such a situation, the acquiring company may initiate a bear hug in which the merger proposal is delivered directly to the board of directors of the target company. Voyager has initiated a bear hug in the hopes of gaining board support for the proposed merger before management can react to the proposal. If the bear hug is unsuccessful, the acquirer may appeal directly to the target's shareholders through a tender offer in which the acquirer offers to buy shares directly from shareholders or through a proxy fight in which a proxy solicitation is used to convince shareholders to elect a board of directors chosen by the acquirer. The board of directors would then replace the target's management and allow the merger to move forward. A white knight is a takeover defense, not a type of merger. For Further Reference: (Study Session 8, Module 23.2, LOS 23.e)", "explhtml": "<p>A hostile merger occurs when the management of a merger target is opposed to the proposed merger. In such a situation, the acquiring company may initiate a bear hug in which the merger proposal is delivered directly to the board of directors of the target company. Voyager has initiated a bear hug in the hopes of gaining board support for the proposed merger before management can react to the proposal. If the bear hug is unsuccessful, the acquirer may appeal directly to the target&#x27;s shareholders through a tender offer in which the acquirer offers to buy shares directly from shareholders or through a proxy fight in which a proxy solicitation is used to convince shareholders to elect a board of directors chosen by the acquirer. The board of directors would then replace the target&#x27;s management and allow the merger to move forward. A white knight is a takeover defense, not a type of merger.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.2, LOS 23.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Corporate Finance.<\/p><p>Voyager, Inc., Case Scenario<\/p><p>Voyager, Inc., a primarily internet-based media company, is buying The Daily, a media company with exposure to newspapers, television, and the internet.<\/p><p>Company Descriptions Voyager, Inc., is organized into two segments: internet and newspaper publishing. The internet segment operates websites that offer news, entertainment, and advertising content in text and video format. The internet segment represents 75% of the company&#x27;s total revenues. The newspaper publishing segment publishes 10 daily newspapers. The newspaper publishing segment represents 25% of the company&#x27;s total revenues.<\/p><p>The Daily is organized into three segments: newspaper publishing (60% of revenues), broadcasting (35% of revenues), and internet (5% of revenues). The newspaper publishing segment publishes 101 daily newspapers. The broadcasting segment owns and operates 25 television stations. The internet segment consists of an internet advertising service. The Daily&#x27;s newspaper publishing and broadcasting segments cover the 20 largest markets in the United States.<\/p><p>Voyager&#x27;s acquisition of The Daily is the company&#x27;s second major acquisition in its history. The previous acquisition was at the height of the merger boom in the year 2000. Voyager purchased the Dragon Company at a premium-to-net-asset value, thereby doubling the company&#x27;s size. Voyager used the pooling method to account for the acquisition of Dragon; however, because of FASB changes to the Business Combination Standard, Voyager will use the acquisition method to account for the Daily acquisition.<\/p><p>(in millions, except per share data) Voyager, Inc. (before merger) The Daily (before merger)<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>$1,800<\/td><td>$7,600<\/td><\/tr><tr><td>Operating income<\/td><td>$415<\/td><td>$998<\/td><\/tr><tr><td>Earnings<\/td><td>$200<\/td><td>$650<\/td><\/tr><tr><td>Assets<\/td><td>$1,900<\/td><td>$14,700<\/td><\/tr><tr><td>Debt<\/td><td>$200<\/td><td>$2,500<\/td><\/tr><tr><td>Equity<\/td><td>$1,100<\/td><td>$7,600<\/td><\/tr><tr><td>Number of shares<\/td><td>117.6 million<\/td><td>213.1 million<\/td><\/tr><tr><td>Stock price per share<\/td><td>$68<\/td><td>$35<\/td><\/tr><tr><td>Earnings per share<\/td><td>$1.70<\/td><td>$3.05<\/td><\/tr><tr><td>PE ratio<\/td><td>40.0x<\/td><td>11.5x<\/td><\/tr><\/table><\/div><p>Voyager has made an all-cash offer of $45 per share to acquire The Daily. Wall Street is skeptical about the merger. While Voyager has been growing its revenues by 40% per year, The Daily&#x27;s revenue growth has been less than 2% per year. Michael Renner, the CFO of Voyager, defends the acquisition by stating that The Daily has accumulated a large amount of tax losses and that the combined company can benefit by immediately increasing net income after the merger. In addition, Renner states that the new Voyager will eliminate the inefficiencies of its internet operations and thereby boost future earnings. Renner believes that the merged companies will have a value of $17.5 billion.<\/p><p>In the past, The Daily&#x27;s management has publicly stated its opposition to merging with any company, a position management still maintains. As a result of this situation, Voyager submitted its merger proposal directly to The Daily&#x27;s board of directors, while the firm&#x27;s CEO was on vacation. Upon returning from vacation, The Daily&#x27;s CEO issued a public statement claiming that the proposed merger was unacceptable under any circumstances.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best characterizes Voyager&#x27;s proposal to merge with The Daily?<\/p><\/div>", "subj": "corporate"}, {"n": 25, "q": "For this question only, a careful evaluation of YD's financial statement reveals that the decrease in value of available-for- sale securities has been reported in the other comprehensive income (OCI) section of stockholder's equity. The most likely impact on the computation of residual income due to accounting for available-for-sale securities would be:", "opts": ["a reduction in residual income due to lower ROE.", "a reduction in residual income due to lower ROE and book value.", "an increase in residual income due to higher ROE."], "ans": "C", "expl": "A decrease in the value of available-for-sale securities that bypasses the income statement would artificially increase net income and, consequently, ROE. Book value is unaffected as the decrease is accounted for in the OCI section of shareholders' equity. For Further Reference: (Study Session 11, Module 30.5, LOS 30.k)", "explhtml": "<p>A decrease in the value of available-for-sale securities that bypasses the income statement would artificially increase net income and, consequently, ROE. Book value is unaffected as the decrease is accounted for in the OCI section of shareholders&#x27; equity.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 30.5, LOS 30.k)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Equity Valuation.<\/p><p>Yummy Doughnuts Case Scenario<\/p><p>Yummy Doughnuts (YD) sells a variety of doughnuts and other related items through both company-owned locations and franchise locations. YD has experienced significant growth over the past five years. However, barriers to entry are low and competition is increasing.<\/p><p>Linda Haas, CFA, follows YD for Gibraltar Capital. Gibraltar Capital prides itself on its thorough fundamental analysis of investment opportunities. The company uses a bottom-up approach to the investment process. Haas&#x27;s security selection process utilizes residual income models to determine a stock&#x27;s intrinsic value. Haas obtains YD&#x27;s 2018 financial statements shown in Exhibit 1. In addition, Haas provides supporting information about YD&#x27;s financials and other related material found in Exhibit 2.<\/p><p><b>Exhibit 1: Yummy Doughnuts&#x27;s 2018 Income Statement and Balance Sheet<\/b><\/p><div class=\"tbl\"><table><tr><td>In millions, except for per share items<\/td><td>2018<\/td><td><\/td><\/tr><tr><td>Revenue<\/td><td>$300<\/td><td><\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$205<\/td><td><\/td><\/tr><tr><td>SG&amp;A<\/td><td>$40<\/td><td><\/td><\/tr><tr><td>Depreciation expense<\/td><td>$6<\/td><td><\/td><\/tr><tr><td>Income from operations<\/td><td>$49<\/td><td><\/td><\/tr><tr><td>Interest expense<\/td><td>$1<\/td><td><\/td><\/tr><tr><td>Pretax income<\/td><td>$48<\/td><td><\/td><\/tr><tr><td>Income tax (40% tax rate)<\/td><td>$19<\/td><td><\/td><\/tr><tr>
