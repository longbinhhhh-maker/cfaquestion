<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

 permission to use Xeta fund&#x27;s past performance when seeking new employment opportunities. Vakil included the performance of the fund to demonstrate his success but did not give any indication of a team approach. Vakil also did not mention to Natschavin or the personnel manager that he was still in possession of the company-issued laptop. Vakil had stored several models the team had developed in pursuing investment strategies on that laptop&#x27;s hard disk.<\/p><p>Within a few months, Vakil joined the equity research department of Patarsby and Singly, a brokerage firm. Vakil, with the help of a quant specialist at Patarsby, improved the models and started using them in his new role. Things turned out very well for Vakil at Patarsby, and clients waited eagerly for release of his monthly recommendations. During a society event, Vakil ran into Alia Dutt, CFA, one of the other team managers of Xeta fund. Dutt congratulated Vakil. Later in the evening, Vakil spoke to Dutt about one of the companies he is following—Sandhirst, Inc. Vakil stated that his preliminary research indicates that the short-term outlook for Sandhirst is very promising. Dutt also met Neil Savin, Frapco, Inc.&#x27;s controller at the event. Frapco is a national grocery chain and a long-time client of Blue Lotus. Savin informed Dutt that the new layout in the stores has been a hit, and that he expects revenues and earnings for the current quarter to be well above consensus forecast.<\/p><p>The next day, Dutt placed a large order for Sandhirst stock for the Xeta fund. Dutt also placed a large order for a retail ETF. Dutt is a member of an online forum where she discusses investments under a pseudonym. Dutt has formed a very loyal following over time as others realized that her posts were very articulate and, therefore, the work of a professional. Dutt recommended Frapco stock in the forum but attributed the recommendation to a general uptick in grocery store margins nationwide—a known fact based ail ETF. Dutt is a member of an online forum where she discusses investments under a pseudonym. Dutt has formed a very loyal following over time as others realized that her posts were very articulate and, therefore, the work of a professional. Dutt recommended Frapco stock in the forum but attributed the recommendation to a general uptick in grocery store margins nationwide—a known fact based on recent earnings announcements of other grocers.<\/p><p>The following week at a charity golf tournament, Vakil met with Bob Snead, his college roommate. Snead was a very successful hedge fund manager. Both of the funds run by Smead were currently closed to new investment, though Snead was considering reopening the investments in the near future. At Vakil&#x27;s insistence, Snead agreed to allow new investments into the two funds using a newly started intermediary fund as long as Vakil is the fund&#x27;s manager. Vakil quickly convinced his bosses at Patarsby to open an intermediary fund and marketed the fund to existing Patarsby clients as a way into Snead hedge funds. Not knowing how long the deal with Snead would hold up, and wanting to quickly ramp up assets under management, Vakil accepted deposits from all Patarsby clients, even some that were relatively new accounts.<\/p><\/div><\/details><div class=\"qtext\"><p>Dutt&#x27;s recommendation of Frapco stock in the online forum is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Vakil's conduct regarding the intermediary fund to channel investments into Snead funds is most likely a violation under:", "opts": ["Standard II(B) Integrity of Capital Markets: Market Manipulation.", "Standard III(D) Duties to Clients: Suitability.", "Standard III(D) Duties to Clients: Fair Dealing."], "ans": "B", "expl": "Because the Snead hedge funds may not be suitable for all clients, Vakil violated Standard III(D) Duties to Clients: Suitability. No clients were treated unfairly and there was no market manipulation. For Further Reference: (Study Session 1, Module 2.6, LOS 2.a, 2.b)", "explhtml": "<p>Because the Snead hedge funds may not be suitable for all clients, Vakil violated Standard III(D) Duties to Clients: Suitability. No clients were treated unfairly and there was no market manipulation.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.6, LOS 2.a, 2.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 61 through 66 relate to Ethical and Professional Standards.<\/p><p>Blue Lotus LP Case Scenario<\/p><p>Mikale Natschavin, CFA, is the managing director of Blue Lotus LP, a boutique investment bank specializing in M&amp;A consulting in the professional services arena. Blue Lotus also manages a fund (Xeta fund) for several institutional clients. The fund was run by a team of four managers. During the recent downturn, commensurate with the decline in the size of the fund, Blue Lotus downsized the firm.<\/p><p>Paul Vakil, CFA, one of the managers of Xeta, was laid off by Blue Lotus. During his exit interview Natschavin wished Vakil well and, on behalf of the firm, gave him permission to use Xeta fund&#x27;s past performance when seeking new employment opportunities. Vakil included the performance of the fund to demonstrate his success but did not give any indication of a team approach. Vakil also did not mention to Natschavin or the personnel manager that he was still in possession of the company-issued laptop. Vakil had stored several models the team had developed in pursuing investment strategies on that laptop&#x27;s hard disk.<\/p><p>Within a few months, Vakil joined the equity research department of Patarsby and Singly, a brokerage firm. Vakil, with the help of a quant specialist at Patarsby, improved the models and started using them in his new role. Things turned out very well for Vakil at Patarsby, and clients waited eagerly for release of his monthly recommendations. During a society event, Vakil ran into Alia Dutt, CFA, one of the other team managers of Xeta fund. Dutt congratulated Vakil. Later in the evening, Vakil spoke to Dutt about one of the companies he is following—Sandhirst, Inc. Vakil stated that his preliminary research indicates that the short-term outlook for Sandhirst is very promising. Dutt also met Neil Savin, Frapco, Inc.&#x27;s controller at the event. Frapco is a national grocery chain and a long-time client of Blue Lotus. Savin informed Dutt that the new layout in the stores has been a hit, and that he expects revenues and earnings for the current quarter to be well above consensus forecast.<\/p><p>The next day, Dutt placed a large order for Sandhirst stock for the Xeta fund. Dutt also placed a large order for a retail ETF. Dutt is a member of an online forum where she discusses investments under a pseudonym. Dutt has formed a very loyal following over time as others realized that her posts were very articulate and, therefore, the work of a professional. Dutt recommended Frapco stock in the forum but attributed the recommendation to a general uptick in grocery store margins nationwide—a known fact based on recent earnings announcements of other grocers.<\/p><p>The following week at a charity golf tournament, Vakil met with Bob Snead, his college roommate. Snead was a very successful hedge fund manager. Both of the funds run by Smead were currently closed to new investment, though Snead was considering reopening the investments in the near future. At Vakil&#x27;s insistence, Snead agreed to allow new investments into the two funds using a newly started intermediary fund as long as Vakil is the fund&#x27;s manager. Vakil quickly convinced his bosses at Patarsby to open an intermediary fund and marketed the fund to existing Patarsby clients as a way into Snead hedge funds. Not knowing how long the deal with Snead would hold up, and wanting to quickly ramp up assets under management, Vakil accepted deposits from all Patarsby clients, even some that were relatively new accounts.<\/p><\/div><\/details><div class=\"qtext\"><p>Vakil&#x27;s conduct regarding the intermediary fund to channel investments into Snead funds is most likely a violation under:<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Of the slopes for the two independent variables, R and VMG, determine which are statistically significant at the 0.05 M level?", "opts": ["Both slopes are statistically significant.", "Only the slope for R  is statistically significant. M", "Only the slope for VMG is statistically significant."], "ans": "B", "expl": "The p-value is the probability that the null hypothesis, H : slope = zero, is true. The decision rule is to reject the null 0 hypothesis if the p-value is less than the significance level (i.e., there is only a very small chance that the null hypothesis is correct). The p-value for the R slope is less than the significance level, and the p-value for the VMG slope is greater M than the significance level. Therefore, the R slope is statistically significant (reject the null hypothesis that the R slope M M equals zero) and the VMG slope is not statistically significant (cannot reject the null hypothesis that the VMG slope equals zero). For Further Reference: (Study Session 2, Module 5.1, LOS 5.a)", "explhtml": "<p>The p-value is the probability that the null hypothesis, H : slope = zero, is true. The decision rule is to reject the null 0 hypothesis if the p-value is less than the significance level (i.e., there is only a very small chance that the null hypothesis is correct). The p-value for the R  slope is less than the significance level, and the p-value for the VMG slope is greater M than the significance level. Therefore, the R  slope is statistically significant (reject the null hypothesis that the R  slope<\/p><div class=\"tbl\"><table><tr><td>M<\/td><td>M<\/td><\/tr><\/table><\/div><p>equals zero) and the VMG slope is not statistically significant (cannot reject the null hypothesis that the VMG slope equals zero).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.1, LOS 5.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Kate Sawyer Case Scenario<\/p><p>Research associate Kate Sawyer is responsible for identifying the determinants of performance for her firm&#x27;s Progressive Fund (PF). All tests performed at Sawyer&#x27;s firm are examined at the 0.05 level of significance. Sawyer examines the following regressions using monthly data observed for a 36 month period:<\/p><div class=\"tbl\"><table><tr><td>(1) R<\/td><td>= b  + b R<\/td><td> + b VMG  + e<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>PF,t<\/td><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><\/tr><tr><td>(2)<\/td><td>= a  + a R<\/td><td> + a VMG  + u<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><td><\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Progressive Fund in month t<\/td><\/tr><\/table><\/div><p>PF,t<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Wilshire 5000 stock market index in month t<\/td><\/tr><\/table><\/div><p>M,t<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>= the return on value stocks minus the return on growth stocks in month t<\/td><\/tr><tr><td>t<\/td><td><\/td><\/tr><tr><td>= the estimated squared regression errors derived from (1)<\/td><td><\/td><\/tr><\/table><\/div><p><b>Exhibit 1: Equation (1) Regression Results<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient p-values<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>–0.005<\/td><td>0.030<\/td><\/tr><tr><td>R<\/td><td>1.250<\/td><td>0.001<\/td><\/tr><\/table><\/div><p>M<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>0.200<\/td><td>0.980<\/td><\/tr><tr><td>The R  from equation (1) equals 0.80. A colleague, Jack Lockhart, makes two recommendations to Sawyer:<\/td><td>2<\/td><td><\/td><\/tr><tr><td>Recommendation 1:<\/td><td>My research indicates that inflation-rate changes are highly correlated with the Wilshire 5000<\/td><td><\/td><\/tr><tr><td>stock index returns. Therefore, I recommend adding the inflation change variable to your<\/td><td><\/td><td><\/td><\/tr><tr><td>regression.<\/td><td><\/td><td><\/td><\/tr><tr><td>Recommendation 2:<\/td><td>My research indicates that the slope coefficients of your regression changed significantly after<\/td><td><\/td><\/tr><tr><td>the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year<\/td><td><\/td><td><\/td><\/tr><tr><td>sample period. Your regression pools across two distinct sample periods. Therefore, I<\/td><td><\/td><td><\/td><\/tr><tr><td>recommend correcting your current regression equation for model misspecification.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Of the slopes for the two independent variables, R  and VMG, determine which are statistically significant at the 0.05 M level?<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "The R derived for equation (1) indicates which of the following for equation (1)? 2", "opts": ["Regression sum of squares exceeds the error sum of squares.", "Regression sum of squares exceeds the total sum of squares.", "Mean regression sum of squares is less than the mean total sum of squares."], "ans": "A", "expl": "The equation for the R equals the regression sum of squares divided by the total sum of squares. The total sum of squares equals the regression sum of squares plus the error sum of squares. Therefore, the R equals: 2 The problem states that the R equals 0.80. Because the R exceeds 50%, the regression sum of squares must exceed 2 2 the error sum of squares. For Further Reference: (Study Session 2, Module 5.3, LOS 5.g)", "explhtml": "<p>The equation for the R  equals the regression sum of squares divided by the total sum of squares. The total sum of<\/p><div class=\"tbl\"><table><tr><td>squares equals the regression sum of squares plus the error sum of squares. Therefore, the R  equals:<\/td><td>2<\/td><td><\/td><\/tr><tr><td>The problem states that the R  equals 0.80. Because the R  exceeds 50%, the regression sum of squares must exceed<\/td><td>2<\/td><td>2<\/td><\/tr><\/table><\/div><p>the error sum of squares.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.3, LOS 5.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Kate Sawyer Case Scenario<\/p><p>Research associate Kate Sawyer is responsible for identifying the determinants of performance for her firm&#x27;s Progressive Fund (PF). All tests performed at Sawyer&#x27;s firm are examined at the 0.05 level of significance. Sawyer examines the following regressions using monthly data observed for a 36 month period:<\/p><div class=\"tbl\"><table><tr><td>(1) R<\/td><td>= b  + b R<\/td><td> + b VMG  + e<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>PF,t<\/td><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><\/tr><tr><td>(2)<\/td><td>= a  + a R<\/td><td> + a VMG  + u<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><td><\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Progressive Fund in month t<\/td><\/tr><\/table><\/div><p>PF,t<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Wilshire 5000 stock market index in month t<\/td><\/tr><\/table><\/div><p>M,t<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>= the return on value stocks minus the return on growth stocks in month t<\/td><\/tr><tr><td>t<\/td><td><\/td><\/tr><tr><td>= the estimated squared regression errors derived from (1)<\/td><td><\/td><\/tr><\/table><\/div><p><b>Exhibit 1: Equation (1) Regression Results<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient p-values<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>–0.005<\/td><td>0.030<\/td><\/tr><tr><td>R<\/td><td>1.250<\/td><td>0.001<\/td><\/tr><\/table><\/div><p>M<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>0.200<\/td><td>0.980<\/td><\/tr><tr><td>The R  from equation (1) equals 0.80. A colleague, Jack Lockhart, makes two recommendations to Sawyer:<\/td><td>2<\/td><td><\/td><\/tr><tr><td>Recommendation 1:<\/td><td>My research indicates that inflation-rate changes are highly correlated with the Wilshire 5000<\/td><td><\/td><\/tr><tr><td>stock index returns. Therefore, I recommend adding the inflation change variable to your<\/td><td><\/td><td><\/td><\/tr><tr><td>regression.<\/td><td><\/td><td><\/td><\/tr><tr><td>Recommendation 2:<\/td><td>My research indicates that the slope coefficients of your regression changed significantly after<\/td><td><\/td><\/tr><tr><td>the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year<\/td><td><\/td><td><\/td><\/tr><tr><td>sample period. Your regression pools across two distinct sample periods. Therefore, I<\/td><td><\/td><td><\/td><\/tr><tr><td>recommend correcting your current regression equation for model misspecification.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><div class=\"tbl\"><table><tr><td>The R  derived for equation (1) indicates which of the following for equation (1)?<\/td><td>2<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 9, "q": "Sawyer decides to test regression equation (1) for the existence of conditional heteroskedasticity. Sawyer is likely to conclude that her regression does not exhibit conditional heteroskedasticity if the R from equation (2) is: 2", "opts": ["close to 0.", "close to 1.", "close to 0.80."], "ans": "A", "expl": "Conditional heteroskedasticity refers to regression errors whose variance is not constant. If there is conditional heteroskedasticity, the variance changes as function of the independent variables. The squared residual (i.e., residual is the estimated error) is used to proxy the error variance. A low R in equation (2) indicates that the slopes in equation (2) 2 are very close to zero, indicating that the error variance is unaffected by the independent variables. For instance, if all the slopes in equation (2) equal zero, then the error variance equals the intercept (a , which is constant over time). 0 For Further Reference: (Study Session 2, Module 5.6, LOS 5.k)", "explhtml": "<p>Conditional heteroskedasticity refers to regression errors whose variance is not constant. If there is conditional heteroskedasticity, the variance changes as function of the independent variables. The squared residual (i.e., residual is<\/p><div class=\"tbl\"><table><tr><td>the estimated error) is used to proxy the error variance. A low R  in equation (2) indicates that the slopes in equation (2)<\/td><td>2<\/td><\/tr><\/table><\/div><p>are very close to zero, indicating that the error variance is unaffected by the independent variables. For instance, if all the slopes in equation (2) equal zero, then the error variance equals the intercept (a , which is constant over time). 0<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.6, LOS 5.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Kate Sawyer Case Scenario<\/p><p>Research associate Kate Sawyer is responsible for identifying the determinants of performance for her firm&#x27;s Progressive Fund (PF). All tests performed at Sawyer&#x27;s firm are examined at the 0.05 level of significance. Sawyer examines the following regressions using monthly data observed for a 36 month period:<\/p><div class=\"tbl\"><table><tr><td>(1) R<\/td><td>= b  + b R<\/td><td> + b VMG  + e<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>PF,t<\/td><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><\/tr><tr><td>(2)<\/td><td>= a  + a R<\/td><td> + a VMG  + u<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><td><\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Progressive Fund in month t<\/td><\/tr><\/table><\/div><p>PF,t<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Wilshire 5000 stock market index in month t<\/td><\/tr><\/table><\/div><p>M,t<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>= the return on value stocks minus the return on growth stocks in month t<\/td><\/tr><tr><td>t<\/td><td><\/td><\/tr><tr><td>= the estimated squared regression errors derived from (1)<\/td><td><\/td><\/tr><\/table><\/div><p><b>Exhibit 1: Equation (1) Regression Results<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient p-values<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>–0.005<\/td><td>0.030<\/td><\/tr><tr><td>R<\/td><td>1.250<\/td><td>0.001<\/td><\/tr><\/table><\/div><p>M<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>0.200<\/td><td>0.980<\/td><\/tr><tr><td>The R  from equation (1) equals 0.80. A colleague, Jack Lockhart, makes two recommendations to Sawyer:<\/td><td>2<\/td><td><\/td><\/tr><tr><td>Recommendation 1:<\/td><td>My research indicates that inflation-rate changes are highly correlated with the Wilshire 5000<\/td><td><\/td><\/tr><tr><td>stock index returns. Therefore, I recommend adding the inflation change variable to your<\/td><td><\/td><td><\/td><\/tr><tr><td>regression.<\/td><td><\/td><td><\/td><\/tr><tr><td>Recommendation 2:<\/td><td>My research indicates that the slope coefficients of your regression changed significantly after<\/td><td><\/td><\/tr><tr><td>the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year<\/td><td><\/td><td><\/td><\/tr><tr><td>sample period. Your regression pools across two distinct sample periods. Therefore, I<\/td><td><\/td><td><\/td><\/tr><tr><td>recommend correcting your current regression equation for model misspecification.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Sawyer decides to test regression equation (1) for the existence of conditional heteroskedasticity. Sawyer is likely to<\/p><div class=\"tbl\"><table><tr><td>conclude that her regression does not exhibit conditional heteroskedasticity if the R  from equation (2) is:<\/td><td>2<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 10, "q": "Regarding Lockhart's Recommendation 1, the econometric problem that is most likely to be introduced by including the inflation change variable in regression equation (1) is:", "opts": ["model misspecification.", "serial correlation.", "multicollinearity."], "ans": "C", "expl": "According to Recommendation 1 provided by Lockhart, the inflation change variable is highly correlated with the Wilshire index returns (one of the independent variables). If Sawyer includes the inflation change variable along with the Wilshire index returns, the regression will be plagued by multicollinearity (the inclusion of correlated independent variables). Multicollinearity causes the standard errors for the regression parameter estimates to be biased upward, which, in turn, causes the t-statistics to be biased downward (deflated). For Further Reference: (Study Session 2, Module 5.8, LOS 5.l)", "explhtml": "<p>According to Recommendation 1 provided by Lockhart, the inflation change variable is highly correlated with the Wilshire index returns (one of the independent variables). If Sawyer includes the inflation change variable along with the Wilshire index returns, the regression will be plagued by multicollinearity (the inclusion of correlated independent variables). Multicollinearity causes the standard errors for the regression parameter estimates to be biased upward, which, in turn, causes the t-statistics to be biased downward (deflated).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.8, LOS 5.l)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Kate Sawyer Case Scenario<\/p><p>Research associate Kate Sawyer is responsible for identifying the determinants of performance for her firm&#x27;s Progressive Fund (PF). All tests performed at Sawyer&#x27;s firm are examined at the 0.05 level of significance. Sawyer examines the following regressions using monthly data observed for a 36 month period:<\/p><div class=\"tbl\"><table><tr><td>(1) R<\/td><td>= b  + b R<\/td><td> + b VMG  + e<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>PF,t<\/td><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><\/tr><tr><td>(2)<\/td><td>= a  + a R<\/td><td> + a VMG  + u<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><td><\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Progressive Fund in month t<\/td><\/tr><\/table><\/div><p>PF,t<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Wilshire 5000 stock market index in month t<\/td><\/tr><\/table><\/div><p>M,t<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>= the return on value stocks minus the return on growth stocks in month t<\/td><\/tr><tr><td>t<\/td><td><\/td><\/tr><tr><td>= the estimated squared regression errors derived from (1)<\/td><td><\/td><\/tr><\/table><\/div><p><b>Exhibit 1: Equation (1) Regression Results<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient p-values<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>–0.005<\/td><td>0.030<\/td><\/tr><tr><td>R<\/td><td>1.250<\/td><td>0.001<\/td><\/tr><\/table><\/div><p>M<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>0.200<\/td><td>0.980<\/td><\/tr><tr><td>The R  from equation (1) equals 0.80. A colleague, Jack Lockhart, makes two recommendations to Sawyer:<\/td><td>2<\/td><td><\/td><\/tr><tr><td>Recommendation 1:<\/td><td>My research indicates that inflation-rate changes are highly correlated with the Wilshire 5000<\/td><td><\/td><\/tr><tr><td>stock index returns. Therefore, I recommend adding the inflation change variable to your<\/td><td><\/td><td><\/td><\/tr><tr><td>regression.<\/td><td><\/td><td><\/td><\/tr><tr><td>Recommendation 2:<\/td><td>My research indicates that the slope coefficients of your regression changed significantly after<\/td><td><\/td><\/tr><tr><td>the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year<\/td><td><\/td><td><\/td><\/tr><tr><td>sample period. Your regression pools across two distinct sample periods. Therefore, I<\/td><td><\/td><td><\/td><\/tr><tr><td>recommend correcting your current regression equation for model misspecification.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Lockhart&#x27;s Recommendation 1, the econometric problem that is most likely to be introduced by including the inflation change variable in regression equation (1) is:<\/p><\/div>", "subj": "quant"}, {"n": 11, "q": "Regarding Lockhart's Recommendation 2, the most likely form of model misspecification to which he refers is:", "opts": ["stationarity model misspecification.", "time-series model misspecification.", "functional form model misspecification."], "ans": "C", "expl": "According to Recommendation 2, the data should not be pooled across all 36 months. The sample clearly is split into two parts: pre-Reg FD and post-Reg FD. Sawyer should run separate regressions for each subperiod, or should employ dummy variables to control for the structural shift related to the passage of Reg FD. In either case, by pooling across the two very different sample periods, Sawyer's regression is an example of a misspecified functional form. For Further Reference: (Study Session 2, Module 5.9, LOS 5.m)", "explhtml": "<p>According to Recommendation 2, the data should not be pooled across all 36 months. The sample clearly is split into two parts: pre-Reg FD and post-Reg FD. Sawyer should run separate regressions for each subperiod, or should employ dummy variables to control for the structural shift related to the passage of Reg FD. In either case, by pooling across the two very different sample periods, Sawyer&#x27;s regression is an example of a misspecified functional form.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.9, LOS 5.m)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Kate Sawyer Case Scenario<\/p><p>Research associate Kate Sawyer is responsible for identifying the determinants of performance for her firm&#x27;s Progressive Fund (PF). All tests performed at Sawyer&#x27;s firm are examined at the 0.05 level of significance. Sawyer examines the following regressions using monthly data observed for a 36 month period:<\/p><div class=\"tbl\"><table><tr><td>(1) R<\/td><td>= b  + b R<\/td><td> + b VMG  + e<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>PF,t<\/td><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><\/tr><tr><td>(2)<\/td><td>= a  + a R<\/td><td> + a VMG  + u<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><td><\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Progressive Fund in month t<\/td><\/tr><\/table><\/div><p>PF,t<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Wilshire 5000 stock market index in month t<\/td><\/tr><\/table><\/div><p>M,t<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>= the return on value stocks minus the return on growth stocks in month t<\/td><\/tr><tr><td>t<\/td><td><\/td><\/tr><tr><td>= the estimated squared regression errors derived from (1)<\/td><td><\/td><\/tr><\/table><\/div><p><b>Exhibit 1: Equation (1) Regression Results<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient p-values<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>–0.005<\/td><td>0.030<\/td><\/tr><tr><td>R<\/td><td>1.250<\/td><td>0.001<\/td><\/tr><\/table><\/div><p>M<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>0.200<\/td><td>0.980<\/td><\/tr><tr><td>The R  from equation (1) equals 0.80. A colleague, Jack Lockhart, makes two recommendations to Sawyer:<\/td><td>2<\/td><td><\/td><\/tr><tr><td>Recommendation 1:<\/td><td>My research indicates that inflation-rate changes are highly correlated with the Wilshire 5000<\/td><td><\/td><\/tr><tr><td>stock index returns. Therefore, I recommend adding the inflation change variable to your<\/td><td><\/td><td><\/td><\/tr><tr><td>regression.<\/td><td><\/td><td><\/td><\/tr><tr><td>Recommendation 2:<\/td><td>My research indicates that the slope coefficients of your regression changed significantly after<\/td><td><\/td><\/tr><tr><td>the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year<\/td><td><\/td><td><\/td><\/tr><tr><td>sample period. Your regression pools across two distinct sample periods. Therefore, I<\/td><td><\/td><td><\/td><\/tr><tr><td>recommend correcting your current regression equation for model misspecification.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Lockhart&#x27;s Recommendation 2, the most likely form of model misspecification to which he refers is:<\/p><\/div>", "subj": "quant"}, {"n": 12, "q": "Regarding Claim 1 and Claim 2 made by Sawyer about the effects of omitted variables, which claims are correct?", "opts": ["Claim 1 only.", "Claim 2 only.", "Both Claim 1 and Claim 2."], "ans": "B", "expl": "Sawyer is incorrect with respect to Claim 1 and is correct with respect to Claim 2. If the omitted variables are correlated with the included variables, then the omitted variable regression parameter estimates [i.e., from equation (1)] will be biased and inconsistent. Desirable properties, on the other hand, are unbiasedness and consistency. An estimator is unbiased if the expected value of the estimate equals the true population value. An estimator is consistent if the estimate approaches the true population value as the sample size increases. The existence of omitted variables (that are correlated with the included variables) destroys both of these desirable properties. For Further Reference: (Study Session 2, Module 5.9, LOS 5.m)", "explhtml": "<p>Sawyer is incorrect with respect to Claim 1 and is correct with respect to Claim 2. If the omitted variables are correlated with the included variables, then the omitted variable regression parameter estimates [i.e., from equation (1)] will be biased and inconsistent. Desirable properties, on the other hand, are unbiasedness and consistency. An estimator is unbiased if the expected value of the estimate equals the true population value. An estimator is consistent if the estimate approaches the true population value as the sample size increases. The existence of omitted variables (that are correlated with the included variables) destroys both of these desirable properties.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.9, LOS 5.m)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Kate Sawyer Case Scenario<\/p><p>Research associate Kate Sawyer is responsible for identifying the determinants of performance for her firm&#x27;s Progressive Fund (PF). All tests performed at Sawyer&#x27;s firm are examined at the 0.05 level of significance. Sawyer examines the following regressions using monthly data observed for a 36 month period:<\/p><div class=\"tbl\"><table><tr><td>(1) R<\/td><td>= b  + b R<\/td><td> + b VMG  + e<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>PF,t<\/td><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><\/tr><tr><td>(2)<\/td><td>= a  + a R<\/td><td> + a VMG  + u<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>M,t<\/td><td>2<\/td><td>t<\/td><td>PF,t<\/td><td><\/td><\/tr><\/table><\/div><p>where:<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Progressive Fund in month t<\/td><\/tr><\/table><\/div><p>PF,t<\/p><div class=\"tbl\"><table><tr><td>R<\/td><td>= the return on the Wilshire 5000 stock market index in month t<\/td><\/tr><\/table><\/div><p>M,t<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>= the return on value stocks minus the return on growth stocks in month t<\/td><\/tr><tr><td>t<\/td><td><\/td><\/tr><tr><td>= the estimated squared regression errors derived from (1)<\/td><td><\/td><\/tr><\/table><\/div><p><b>Exhibit 1: Equation (1) Regression Results<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient p-values<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>–0.005<\/td><td>0.030<\/td><\/tr><tr><td>R<\/td><td>1.250<\/td><td>0.001<\/td><\/tr><\/table><\/div><p>M<\/p><div class=\"tbl\"><table><tr><td>VMG<\/td><td>0.200<\/td><td>0.980<\/td><\/tr><tr><td>The R  from equation (1) equals 0.80. A colleague, Jack Lockhart, makes two recommendations to Sawyer:<\/td><td>2<\/td><td><\/td><\/tr><tr><td>Recommendation 1:<\/td><td>My research indicates that inflation-rate changes are highly correlated with the Wilshire 5000<\/td><td><\/td><\/tr><tr><td>stock index returns. Therefore, I recommend adding the inflation change variable to your<\/td><td><\/td><td><\/td><\/tr><tr><td>regression.<\/td><td><\/td><td><\/td><\/tr><tr><td>Recommendation 2:<\/td><td>My research indicates that the slope coefficients of your regression changed significantly after<\/td><td><\/td><\/tr><tr><td>the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year<\/td><td><\/td><td><\/td><\/tr><tr><td>sample period. Your regression pools across two distinct sample periods. Therefore, I<\/td><td><\/td><td><\/td><\/tr><tr><td>recommend correcting your current regression equation for model misspecification.<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Claim 1 and Claim 2 made by Sawyer about the effects of omitted variables, which claims are correct?<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "Calculate the percent change in YTC net income shown on the WMC financial statements from 2015 to 2016.", "opts": ["–52.0%.", "–55.2%.", "–56.9%."], "ans": "C", "expl": "Because YTC operates independently and makes its own financing decisions, the local currency (AUD) should be the functional currency. When the local currency is the functional currency, the subsidiary's financial statements are consolidated with the parent's financial statements using the current rate method. Under the current rate method, all of the income statement items are translated using the average rate for the year. To calculate the percent change in net income, we must translate these items for 2016 and 2015 and then calculate the rate of change. 2015 translated net income = 25 / 1.30 = 19.23 2016 translated net income = 12 / 1.45 = 8.28 growth in net income = (8.28 / 19.23) − 1 = –56.94% For Further Reference: (Study Session 5, Module 15.4, LOS 15.d)", "explhtml": "<p>Because YTC operates independently and makes its own financing decisions, the local currency (AUD) should be the functional currency. When the local currency is the functional currency, the subsidiary&#x27;s financial statements are consolidated with the parent&#x27;s financial statements using the current rate method. Under the current rate method, all of the income statement items are translated using the average rate for the year. To calculate the percent change in net income, we must translate these items for 2016 and 2015 and then calculate the rate of change.<\/p><p>2015 translated net income = 25 / 1.30 = 19.23<\/p><p>2016 translated net income = 12 / 1.45 = 8.28<\/p><p>growth in net income = (8.28 / 19.23) − 1 = –56.94%<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.4, LOS 15.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Financial Reporting and Analysis.<\/p><p>Whitmore Corporation Case Scenario<\/p><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><p>Income Statement (AUD millions) 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Interest expense<\/td><td>18<\/td><td>17<\/td><td>16<\/td><\/tr><tr><td>Income before tax<\/td><td>42<\/td><td>50<\/td><td>24<\/td><\/tr><tr><td>Taxes<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><tr><td>Net income<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><\/table><\/div><p>Balance Sheet (AUD millions)<\/p><div class=\"tbl\"><table><tr><td>2014 2015 2016<\/td><td>2014 2015 2016<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>22<\/td><td>25<\/td><td>20 Current liabilities<\/td><td>616<\/td><td>593<\/td><td>584<\/td><\/tr><tr><td>Accounts receivable<\/td><td>400<\/td><td>422<\/td><td>460 Long-term debt<\/td><td>180<\/td><td>170<\/td><td>160<\/td><\/tr><tr><td>Inventories<\/td><td>20<\/td><td>25<\/td><td>30<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prepaid expenses<\/td><td>8<\/td><td>20<\/td><td>25 Common stock<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Net fixed assets<\/td><td>500<\/td><td>450<\/td><td>400 Retained earnings<\/td><td>104<\/td><td>129<\/td><td>141<\/td><\/tr><tr><td>Total assets<\/td><td>950<\/td><td>942<\/td><td>935 Total liabilities &amp; equity<\/td><td>950<\/td><td>942<\/td><td>935<\/td><\/tr><\/table><\/div><p>Exchange rates (AUD / USD) 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Average exchange rate<\/td><td>1.40<\/td><td>1.30<\/td><td>1.45<\/td><\/tr><tr><td>Year-end exchange rate<\/td><td>1.20<\/td><td>1.40<\/td><td>1.50<\/td><\/tr><tr><td>Historical exchange rate<\/td><td>1.20<\/td><td>1.20<\/td><td>1.20<\/td><\/tr><\/table><\/div><p>Smith has discovered that WMC has a small subsidiary in Ukraine. The subsidiary follows IAS accounting rules and uses FIFO inventory accounting. The Ukrainian subsidiary was acquired 10 years ago and has been fully integrated into WMC&#x27;s operations. WMC obtains funding for the subsidiary whenever the company finds profitable investments within Ukraine or surrounding countries. According to forecasts from economists, the Ukrainian currency is expected to depreciate relative to the U.S. dollar over the next few years. Local currency prices are forecasted to remain stable, however.<\/p><p>One of the managers at WMC asks Smith to analyze a third subsidiary located in India. The manager has explained that real interest rates in India over the past three years have been 2.00%, 2.50%, and 3.00%, respectively, while nominal interest rates have been 34.64%, 29.15%, and 25.66%, respectively. Smith requests more time to analyze the Indian subsidiary.<\/p><\/div><\/details><div class=\"qtext\"><p>Calculate the percent change in YTC net income shown on the WMC financial statements from 2015 to 2016.<\/p><\/div>", "subj": "fsa"}, {"n": 14, "q": "If WMC uses the temporal method, YTC's net monetary liabilities leave WMC exposed to loss in the event of:", "opts": ["currency (AUD) depreciation.", "currency (AUD) appreciation.", "either currency depreciation or currency appreciation."], "ans": "B", "expl": "Under the temporal method, the nonmonetary assets and liabilities are remeasured at historical rates. Thus, only the monetary assets and liabilities are exposed to changing exchange rates. Therefore, under the temporal method, exposure is defined as the subsidiary's net monetary asset or net monetary liability position. A firm has net monetary assets if its monetary assets exceed its monetary liabilities. If the monetary liabilities exceed the monetary assets, the firm has a net monetary liability exposure. Since very few assets are considered to be monetary (mainly cash and receivables), most firms have net monetary liability exposures. If the parent has a net monetary liability exposure when the foreign currency (AUD) is appreciating, the result is a loss. Conversely, a net monetary liability exposure coupled with a depreciating currency will result in a gain. For Further Reference: (Study Session 5, Module 15.3, LOS 15.d)", "explhtml": "<p>Under the temporal method, the nonmonetary assets and liabilities are remeasured at historical rates. Thus, only the monetary assets and liabilities are exposed to changing exchange rates. Therefore, under the temporal method, exposure is defined as the subsidiary&#x27;s net monetary asset or net monetary liability position. A firm has net monetary assets if its monetary assets exceed its monetary liabilities. If the monetary liabilities exceed the monetary assets, the firm has a net monetary liability exposure. Since very few assets are considered to be monetary (mainly cash and receivables), most firms have net monetary liability exposures. If the parent has a net monetary liability exposure when the foreign currency (AUD) is appreciating, the result is a loss. Conversely, a net monetary liability exposure coupled with a depreciating currency will result in a gain.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.3, LOS 15.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Financial Reporting and Analysis.<\/p><p>Whitmore Corporation Case Scenario<\/p><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><p>Income Statement (AUD millions) 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Interest expense<\/td><td>18<\/td><td>17<\/td><td>16<\/td><\/tr><tr><td>Income before tax<\/td><td>42<\/td><td>50<\/td><td>24<\/td><\/tr><tr><td>Taxes<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><tr><td>Net income<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><\/table><\/div><p>Balance Sheet (AUD millions)<\/p><div class=\"tbl\"><table><tr><td>2014 2015 2016<\/td><td>2014 2015 2016<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>22<\/td><td>25<\/td><td>20 Current liabilities<\/td><td>616<\/td><td>593<\/td><td>584<\/td><\/tr><tr><td>Accounts receivable<\/td><td>400<\/td><td>422<\/td><td>460 Long-term debt<\/td><td>180<\/td><td>170<\/td><td>160<\/td><\/tr><tr><td>Inventories<\/td><td>20<\/td><td>25<\/td><td>30<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prepaid expenses<\/td><td>8<\/td><td>20<\/td><td>25 Common stock<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Net fixed assets<\/td><td>500<\/td><td>450<\/td><td>400 Retained earnings<\/td><td>104<\/td><td>129<\/td><td>141<\/td><\/tr><tr><td>Total assets<\/td><td>950<\/td><td>942<\/td><td>935 Total li  For Further Reference: (Study Session 5, Module 15.8, LOS 15.i)", "explhtml": "<div class=\"tbl\"><table><tr><td>AUD revenue growth rate = (870 / 765)<\/td><td>1/2<\/td><td> − 1 = 6.64%<\/td><\/tr><\/table><\/div><p>Revenues are translated at average rate:<\/p><p>2014 USD revenues = 765 / 1.40 = 546.43; 2016 USD revenues = 870 / 1.45 = 600<\/p><div class=\"tbl\"><table><tr><td>USD revenue growth rate = (600 / 546.43)<\/td><td>1/2<\/td><td> − 1 = 4.79%<\/td><\/tr><\/table><\/div><p>The USD revenue growth rate is 1.85% lower than the local currency (AUD) revenue growth rate.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 15.8, LOS 15.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Financial Reporting and Analysis.<\/p><p>Whitmore Corporation Case Scenario<\/p><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><p>Income Statement (AUD millions) 2014 2015 2016<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>
