ucive environment for economic<\/p><p>growth by investing in education, fostering political stability, and opening its markets to<\/p><p>international trade. Meanwhile, CH, with its abundant natural resources and larger population,<\/p><p>has adopted inward-oriented policies and has been less inclined to invest in human capital or<\/p><p>establish strong legal systems to protect property rights.<\/p><p>At the start of the 21st century, IF and CH had similar per capita GDPs, but IF&#x27;s government<\/p><p>decided to undertake a series of ambitious reforms aimed at accelerating economic growth.<\/p><p>These reforms included investing heavily in technology and education (at both primary and<\/p><p>higher levels), reducing trade barriers, and offering attractive incentives for foreign direct<\/p><p>investment (FDI). Simultaneously, IF&#x27;s legal framework was fortified to protect intellectual<\/p><p>property rights and enforce contracts more effectively. IF&#x27;s goal was to transition from an<\/p><p>economy based on agriculture and tourism to becoming a regional hub for financial services and<\/p><p>high-tech industries.<\/p><p>CH, abounding with oil and mineral wealth, continued with state-controlled economic policies,<\/p><p>restricting foreign investment and maintaining high tariffs on imports to protect domestic<\/p><p>industries. Public investments were primarily directed toward infrastructure projects, with less<\/p><p>emphasis on education and healthcare. Capital controls and a lack of effective financial<\/p><p>intermediation stifled the development of local businesses and entrepreneurship.<\/p><p>By 2025, IF had achieved significant growth, buoyed by a rapid expansion of its service sector<\/p><p>and a notable increase in labor productivity. The country&#x27;s education reforms bore fruit, with a<\/p><p>substantial increase in the skilled labor force. In contrast, CH’s growth had begun to falter. The<\/p><p>country&#x27;s reliance on natural resource exports made it vulnerable to commodity price volatility,<\/p><p>and despite the abundance of resources, the lack of investment in human capital and technology<\/p><p>hindered growth.<\/p><p>Recent economic reports provide the following data for both countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0089.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit 1: Economic Reports Metrics Island Continental Federation Harmony (IF) (CH) GDP Growth Rate 6% 2% Investment/GDP 25% 15% Education Spending/GDP 7% 2% FDI Inflows/GDP 3% 0.5% Export Growth Rate 10% 3% Inflation Rate 2% 5% Population Growth Rate 1% 1.5% Labor Productivity Growth 3% 0.5%\"><p>Analysts have forecasted future economic prospects for both nations, with IF likely to maintain<\/p><p>or increase its current growth trajectory, and CH’s outlook appearing uncertain unless the<\/p><p>country reforms its economic policies.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the most likely result of IF’s investment in technology and education on its per capita GDP in the long term?<\/p><\/div>", "subj": "economics"}, {"n": 47, "q": "Considering the economic data provided, what is the most probable impact of IF's economic policies on its inflation rate?", "opts": ["Increase due to higher import costs", "Decrease as a result of improved productivity and trade balances", "No change since it's primarily driven by population growth rates"], "ans": "B", "expl": "IF's economic policies that improve productivity and trade balances can contribute to a decrease in inflation. Increased productivity puts downward pressure on costs, which can reduce inflation, and improved trade balances can strengthen the currency, making imports less expensive. A is incorrect. Higher import costs would potentially increase inflation, but there is no indication that IF’s policies are leading to higher import costs. C is incorrect. While population growth rates can affect inflation, the policies of IF are likely to have a more direct impact on its inflation rate through productivity and trade.", "explhtml": "<p>IF&#x27;s economic policies that improve productivity and trade balances can contribute to a decrease in inflation. Increased productivity puts downward pressure on costs, which can reduce inflation, and improved trade balances can strengthen the currency, making imports less expensive.<\/p><p><b>A is incorrect.<\/b> Higher import costs would potentially increase inflation, but there is no indication that IF’s policies are leading to higher import costs.<\/p><p><b>C is incorrect.<\/b> While population growth rates can affect inflation, the policies of IF are likely to have a more direct impact on its inflation rate through productivity and trade.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(a): Describe the relation between the long-run rate of stock market appreciation and the sustainable growth rate of the economy<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · The Island Federation (IF) and Continental Harmony (CH)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Island Federation (IF) and Continental Harmony (CH) are neighboring countries with a<\/p><p>history of economic interdependence and starkly differing policies. For decades, IF, an island<\/p><p>nation with a small population, has focused on creating a conducive environment for economic<\/p><p>growth by investing in education, fostering political stability, and opening its markets to<\/p><p>international trade. Meanwhile, CH, with its abundant natural resources and larger population,<\/p><p>has adopted inward-oriented policies and has been less inclined to invest in human capital or<\/p><p>establish strong legal systems to protect property rights.<\/p><p>At the start of the 21st century, IF and CH had similar per capita GDPs, but IF&#x27;s government<\/p><p>decided to undertake a series of ambitious reforms aimed at accelerating economic growth.<\/p><p>These reforms included investing heavily in technology and education (at both primary and<\/p><p>higher levels), reducing trade barriers, and offering attractive incentives for foreign direct<\/p><p>investment (FDI). Simultaneously, IF&#x27;s legal framework was fortified to protect intellectual<\/p><p>property rights and enforce contracts more effectively. IF&#x27;s goal was to transition from an<\/p><p>economy based on agriculture and tourism to becoming a regional hub for financial services and<\/p><p>high-tech industries.<\/p><p>CH, abounding with oil and mineral wealth, continued with state-controlled economic policies,<\/p><p>restricting foreign investment and maintaining high tariffs on imports to protect domestic<\/p><p>industries. Public investments were primarily directed toward infrastructure projects, with less<\/p><p>emphasis on education and healthcare. Capital controls and a lack of effective financial<\/p><p>intermediation stifled the development of local businesses and entrepreneurship.<\/p><p>By 2025, IF had achieved significant growth, buoyed by a rapid expansion of its service sector<\/p><p>and a notable increase in labor productivity. The country&#x27;s education reforms bore fruit, with a<\/p><p>substantial increase in the skilled labor force. In contrast, CH’s growth had begun to falter. The<\/p><p>country&#x27;s reliance on natural resource exports made it vulnerable to commodity price volatility,<\/p><p>and despite the abundance of resources, the lack of investment in human capital and technology<\/p><p>hindered growth.<\/p><p>Recent economic reports provide the following data for both countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0089.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit 1: Economic Reports Metrics Island Continental Federation Harmony (IF) (CH) GDP Growth Rate 6% 2% Investment/GDP 25% 15% Education Spending/GDP 7% 2% FDI Inflows/GDP 3% 0.5% Export Growth Rate 10% 3% Inflation Rate 2% 5% Population Growth Rate 1% 1.5% Labor Productivity Growth 3% 0.5%\"><p>Analysts have forecasted future economic prospects for both nations, with IF likely to maintain<\/p><p>or increase its current growth trajectory, and CH’s outlook appearing uncertain unless the<\/p><p>country reforms its economic policies.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering the economic data provided, what is the most probable impact of IF&#x27;s economic policies on its inflation rate?<\/p><\/div>", "subj": "economics"}, {"n": 48, "q": "What could be the primary reason for the disparity in the performance of CH despite its abundant natural resources?", "opts": ["Failure to invest in human capital and technological development", "High tariffs limiting the import of consumer goods", "Over-reliance on agriculture and tourism sectors"], "ans": "A", "expl": "CH's primary reason for its underperformance, despite abundant natural resources, is likely its failure to invest in human capital and technological development. Such investments are crucial for long-term sustainable economic growth and the lack thereof can leave a country vulnerable to commodity price shocks and limit its ability to diversify its economy. B is incorrect. While high tariffs can negatively affect economic performance, they are not the primary reason given CH's other policy shortcomings. C is incorrect. CH’s primary issue is its economic policies, not an over-reliance on any particular sector.", "explhtml": "<p>CH&#x27;s primary reason for its underperformance, despite abundant natural resources, is likely its failure to invest in human capital and technological development. Such investments are crucial for long-term sustainable economic growth and the lack thereof can leave a country vulnerable to commodity price shocks and limit its ability to diversify its economy.<\/p><p><b>B is incorrect.<\/b> While high tariffs can negatively affect economic performance, they are not the primary reason given CH&#x27;s other policy shortcomings.<\/p><p><b>C is incorrect.<\/b> CH’s primary issue is its economic policies, not an over-reliance on any particular sector.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (h): Explain how investment in physical capital, human capital, and technological development affects economic growth<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · The Island Federation (IF) and Continental Harmony (CH)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Island Federation (IF) and Continental Harmony (CH) are neighboring countries with a<\/p><p>history of economic interdependence and starkly differing policies. For decades, IF, an island<\/p><p>nation with a small population, has focused on creating a conducive environment for economic<\/p><p>growth by investing in education, fostering political stability, and opening its markets to<\/p><p>international trade. Meanwhile, CH, with its abundant natural resources and larger population,<\/p><p>has adopted inward-oriented policies and has been less inclined to invest in human capital or<\/p><p>establish strong legal systems to protect property rights.<\/p><p>At the start of the 21st century, IF and CH had similar per capita GDPs, but IF&#x27;s government<\/p><p>decided to undertake a series of ambitious reforms aimed at accelerating economic growth.<\/p><p>These reforms included investing heavily in technology and education (at both primary and<\/p><p>higher levels), reducing trade barriers, and offering attractive incentives for foreign direct<\/p><p>investment (FDI). Simultaneously, IF&#x27;s legal framework was fortified to protect intellectual<\/p><p>property rights and enforce contracts more effectively. IF&#x27;s goal was to transition from an<\/p><p>economy based on agriculture and tourism to becoming a regional hub for financial services and<\/p><p>high-tech industries.<\/p><p>CH, abounding with oil and mineral wealth, continued with state-controlled economic policies,<\/p><p>restricting foreign investment and maintaining high tariffs on imports to protect domestic<\/p><p>industries. Public investments were primarily directed toward infrastructure projects, with less<\/p><p>emphasis on education and healthcare. Capital controls and a lack of effective financial<\/p><p>intermediation stifled the development of local businesses and entrepreneurship.<\/p><p>By 2025, IF had achieved significant growth, buoyed by a rapid expansion of its service sector<\/p><p>and a notable increase in labor productivity. The country&#x27;s education reforms bore fruit, with a<\/p><p>substantial increase in the skilled labor force. In contrast, CH’s growth had begun to falter. The<\/p><p>country&#x27;s reliance on natural resource exports made it vulnerable to commodity price volatility,<\/p><p>and despite the abundance of resources, the lack of investment in human capital and technology<\/p><p>hindered growth.<\/p><p>Recent economic reports provide the following data for both countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0089.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit 1: Economic Reports Metrics Island Continental Federation Harmony (IF) (CH) GDP Growth Rate 6% 2% Investment/GDP 25% 15% Education Spending/GDP 7% 2% FDI Inflows/GDP 3% 0.5% Export Growth Rate 10% 3% Inflation Rate 2% 5% Population Growth Rate 1% 1.5% Labor Productivity Growth 3% 0.5%\"><p>Analysts have forecasted future economic prospects for both nations, with IF likely to maintain<\/p><p>or increase its current growth trajectory, and CH’s outlook appearing uncertain unless the<\/p><p>country reforms its economic policies.<\/p><\/div><\/details><div class=\"qtext\"><p>What could be the primary reason for the disparity in the performance of CH despite its abundant natural resources?<\/p><\/div>", "subj": "economics"}, {"n": 49, "q": "According to the Purchasing Power Parity (PPP) theory, what should be the expected spot exchange rate for NLD relative to OLE in one year, assuming that PPP holds true?", "opts": ["1 NLD = 0.73 OLE", "1 NLD = 0.77 OLE", "1 NLD = 0.78 OLE"], "ans": "A", "expl": "The PPP theory states that the exchange rate will adjust to offset inflation differential between two countries. We can calculate the expected spot exchange rate in one year using the formula: where S1 is the expected future spot rate, S0 is the current spot rate, id is the domestic inflation rate, and if is the foreign inflation rate. B is incorrect. This option does not accurately reflect the calculation based on the provided inflation rates. C is incorrect. This option suggests an incorrect application of the PPP theory to the given rates.", "explhtml": "<p>The PPP theory states that the exchange rate will adjust to offset inflation differential between two countries. We can calculate the expected spot exchange rate in one year using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0090.webp\" style=\"max-width:min(100%,143px)\" alt=\"(1 + if) S1 = S0 × (1 + id)\"><p>where S<sub>1<\/sub> is the expected future spot rate, S<sub>0<\/sub> is the current spot rate,<\/p><p>i<sub>d<\/sub> is the domestic inflation rate, and<\/p><p>i<sub>f<\/sub> is the foreign inflation rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0091.webp\" style=\"max-width:min(100%,217px)\" alt=\"1 + 0.02 S1 = 0.75 × 1 + 0.05 = 0.73\"><p><b>B is incorrect.<\/b> This option does not accurately reflect the calculation based on the provided inflation rates.<\/p><p><b>C is incorrect. <\/b>This option suggests an incorrect application of the PPP theory to the given rates.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Newland<\/summary><div class=\"vig-body\"><p>The fictitious country of Newland has been experiencing significant economic changes over the<\/p><p>past few years. Newland&#x27;s currency, the Newland Dollar (NLD), has been volatile due to domestic<\/p><p>inflation rates that differ from its major trading partner, Oldland, whose currency is the Oldland<\/p><p>Euro (OLE). The current spot exchange rate is 1 NLD = 0.75 OLE. The 1-year forward rate is 1<\/p><p>NLD = 0.72 OLE.<\/p><p>Newland’s central bank is considering various monetary and fiscal policy measures to stabilize<\/p><p>the NLD and promote economic growth. The inflation rate in Newland is currently at 5% per<\/p><p>annum, while Oldland&#x27;s inflation rate remains at a steady 2% per annum. The central bank of<\/p><p>Newland offers an annual interest rate of 6% on its government bonds, while Oldland’s<\/p><p>equivalent rate is 3%.<\/p><p>Newland has also seen an increase in its current account deficit due to a surge in imports over<\/p><p>exports, while its capital account has shown an influx of foreign direct investment (FDI) as<\/p><p>investors seek to capitalize on Newland&#x27;s potential for economic growth.<\/p><p>Recently, economic analysts have identified several potential warning signs of a currency crisis<\/p><p>in Newland, including rapid credit growth, an overheated real estate market, and worsening<\/p><p>terms of trade. The central bank is contemplating the implementation of capital controls as a<\/p><p>measure to prevent speculative attacks on the NLD.<\/p><p>Several international hedge funds have identified an opportunity for a carry trade by borrowing<\/p><p>in OLE and investing in NLD-denominated assets due to the interest rate differential. They<\/p><p>expect to gain from the interest rate spread as well as any potential appreciation of the NLD if<\/p><p>Newland’s economic conditions improve as forecasted.<\/p><p>The Newland government, stimulated by the risk of a currency crisis, is reviewing its monetary<\/p><p>and fiscal policy options. The fiscal policies currently under discussion aim to reduce the budget<\/p><p>deficit and slow down the economy’s overheating. On the other hand, the central bank is<\/p><p>evaluating a possible intervention in the currency market to prevent further depreciation of the<\/p><p>NLD. Measures range from direct market involvement (buying NLD and selling foreign<\/p><p>currencies) to indirect tools such as adjusting interest rates.<\/p><p>Considering the interest rate differential and expected depreciation of the NLD, economists in<\/p><p>Newland are debating whether the uncovered interest parity (UIP) holds, which could potentially<\/p><p>impact the decision-making of carry traders.<\/p><p>As the debate continues, several indicators are being monitored closely for potential early<\/p><p>warning signs of a currency crisis, which could prompt aggressive actions from the central bank<\/p><p>and government to stabilize the NLD and prevent a broader economic downturn.<\/p><p>The relationship between the balance of payments and exchange rate movements is becoming a<\/p><p>focal point of discussion among Newland’s policymakers. The persistent current account deficit<\/p><p>is raising concerns that it may be leading to downward pressure on the NLD, while the capital<\/p><p>account surplus is not considered stable enough to offset this pressure in the long term.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the Purchasing Power Parity (PPP) theory, what should be the expected spot exchange rate for NLD relative to OLE in one year, assuming that PPP holds true?<\/p><\/div>", "subj": "economics"}, {"n": 50, "q": "What is the expected profit from a carry trade for an investor who borrows 1 million OLE at the current interest rate and invests in NLD government bonds for one year, assuming the forward rate accurately predicts the future spot rate?", "opts": ["-17,222 NLD", "33,000 NLD", "39,000 NLD"], "ans": "A", "expl": "Borrow 1M in OLE: Amount borrowed: 1,000,000 Interest paid in 1 year: 1, 000, 000 × 30% = 300, 000 The total amount repaid in 1 year: 1, 000, 000 + 30,000 = 1, 030, 000 OLE Invest in NLD: Amount borrowed in NLD: 1,000.705,000= 1, 333, 333 Interest earned in 1 year: 1, 333, 333 × 0.06 = 79, 999 Total amount in 1 year: 1,413,332 NLD Convert NLD to OLE: 1, 413, 332 × 0.72 = 1,017, 600 Profit/Loss in OLE: 1,017,600 − 1,030,000 = (12, 400) OLE Convert to find profit in NLD: −01.27,2400= −17,222N LD B is incorrect. It underestimates the interest differential between the two currencies. C is incorrect. It overestimates the profit and does not match the calculations based on the given interest rates and exchange rates.", "explhtml": "<p>Borrow 1M in OLE:<\/p><p>Amount borrowed: 1,000,000<\/p><p>Interest paid in 1 year: 1, 000, 000 × 30% = 300, 000<\/p><p>The total amount repaid in 1 year: 1, 000, 000 + 30,000 = 1, 030, 000 OLE<\/p><p>Invest in NLD:<\/p><p>Amount borrowed in NLD: <sup>1,0<\/sup><sub>0<\/sub><sup>0<\/sup><sub>.7<\/sub><sup>0<\/sup><sub>5<\/sub><sup>,000<\/sup>= 1, 333, 333<\/p><p>Interest earned in 1 year: 1, 333, 333 × 0.06 = 79, 999<\/p><p>Total amount in 1 year: 1,413,332 NLD<\/p><p>Convert NLD to OLE: 1, 413, 332 × 0.72 = 1,017, 600<\/p><p>Profit/Loss in OLE: 1,017,600 − 1,030,000 = (12, 400) OLE<\/p><p>Convert to find profit in NLD: <sup>−<\/sup><sub>0<\/sub><sup>1<\/sup><sub>.<\/sub><sup>2<\/sup><sub>7<\/sub><sup>,<\/sup><sub>2<\/sub><sup>400<\/sup>= −17,222N LD<\/p><p><b>B is incorrect.<\/b> It underestimates the interest differential between the two currencies.<\/p><p><b>C is incorrect.<\/b> It overestimates the profit and does not match the calculations based on the given interest rates and exchange rates.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (i) Describe the carry trade and its relation to uncovered interest rate parity and calculate the profit from a carry trade.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Newland<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The fictitious country of Newland has been experiencing significant economic changes over the<\/p><p>past few years. Newland&#x27;s currency, the Newland Dollar (NLD), has been volatile due to domestic<\/p><p>inflation rates that differ from its major trading partner, Oldland, whose currency is the Oldland<\/p><p>Euro (OLE). The current spot exchange rate is 1 NLD = 0.75 OLE. The 1-year forward rate is 1<\/p><p>NLD = 0.72 OLE.<\/p><p>Newland’s central bank is considering various monetary and fiscal policy measures to stabilize<\/p><p>the NLD and promote economic growth. The inflation rate in Newland is currently at 5% per<\/p><p>annum, while Oldland&#x27;s inflation rate remains at a steady 2% per annum. The central bank of<\/p><p>Newland offers an annual interest rate of 6% on its government bonds, while Oldland’s<\/p><p>equivalent rate is 3%.<\/p><p>Newland has also seen an increase in its current account deficit due to a surge in imports over<\/p><p>exports, while its capital account has shown an influx of foreign direct investment (FDI) as<\/p><p>investors seek to capitalize on Newland&#x27;s potential for economic growth.<\/p><p>Recently, economic analysts have identified several potential warning signs of a currency crisis<\/p><p>in Newland, including rapid credit growth, an overheated real estate market, and worsening<\/p><p>terms of trade. The central bank is contemplating the implementation of capital controls as a<\/p><p>measure to prevent speculative attacks on the NLD.<\/p><p>Several international hedge funds have identified an opportunity for a carry trade by borrowing<\/p><p>in OLE and investing in NLD-denominated assets due to the interest rate differential. They<\/p><p>expect to gain from the interest rate spread as well as any potential appreciation of the NLD if<\/p><p>Newland’s economic conditions improve as forecasted.<\/p><p>The Newland government, stimulated by the risk of a currency crisis, is reviewing its monetary<\/p><p>and fiscal policy options. The fiscal policies currently under discussion aim to reduce the budget<\/p><p>deficit and slow down the economy’s overheating. On the other hand, the central bank is<\/p><p>evaluating a possible intervention in the currency market to prevent further depreciation of the<\/p><p>NLD. Measures range from direct market involvement (buying NLD and selling foreign<\/p><p>currencies) to indirect tools such as adjusting interest rates.<\/p><p>Considering the interest rate differential and expected depreciation of the NLD, economists in<\/p><p>Newland are debating whether the uncovered interest parity (UIP) holds, which could potentially<\/p><p>impact the decision-making of carry traders.<\/p><p>As the debate continues, several indicators are being monitored closely for potential early<\/p><p>warning signs of a currency crisis, which could prompt aggressive actions from the central bank<\/p><p>and government to stabilize the NLD and prevent a broader economic downturn.<\/p><p>The relationship between the balance of payments and exchange rate movements is becoming a<\/p><p>focal point of discussion among Newland’s policymakers. The persistent current account deficit<\/p><p>is raising concerns that it may be leading to downward pressure on the NLD, while the capital<\/p><p>account surplus is not considered stable enough to offset this pressure in the long term.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the expected profit from a carry trade for an investor who borrows 1 million OLE at the current interest rate and invests in NLD government bonds for one year, assuming the forward rate accurately predicts the future spot rate?<\/p><\/div>", "subj": "economics"}, {"n": 51, "q": "How would Newland's current account deficit most likely affect the value of the NLD?", "opts": ["Increase the value of NLD due to higher demand for domestic currency", "Decrease the value of NLD because it indicates excess domestic consumption.", "Not affect the value of NLD due to offsetting capital account transactions."], "ans": "B", "expl": "A current account deficit often results from a country importing more goods and services than it exports, which means it must buy foreign currency to pay for these imports, thereby increasing the supply of its own currency and putting downward pressure on its value. Therefore, a current account deficit would most likely decrease the value of the NLD. A is incorrect. A current account deficit typically does not lead to an increase in the value of a country's currency due to higher demand. In fact, it usually leads to the opposite effect because the country needs to obtain foreign currency to pay for imports, not its domestic currency. C is incorrect. While capital account transactions may sometimes offset the current account transactions in the balance of payments, this is not always the case. Additionally, capital account transactions often comprise more volatile financial flows that can change rapidly, unlike the more stable trade-related current account transactions.", "explhtml": "<p>A current account deficit often results from a country importing more goods and services than it exports, which means it must buy foreign currency to pay for these imports, thereby increasing the supply of its own currency and putting downward pressure on its value. Therefore, a current account deficit would most likely decrease the value of the NLD.<\/p><p><b>A is incorrect.<\/b> A current account deficit typically does not lead to an increase in the value of a country&#x27;s currency due to higher demand. In fact, it usually leads to the opposite effect because the country needs to obtain foreign currency to pay for imports, not its domestic currency.<\/p><p><b>C is incorrect.<\/b> While capital account transactions may sometimes offset the current account transactions in the balance of payments, this is not always the case. Additionally, capital account transactions often comprise more volatile financial flows that can change rapidly, unlike the more stable trade-related current account transactions.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (j) Explain how flows in the balance of payment accounts affect currency exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Newland<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The fictitious country of Newland has been experiencing significant economic changes over the<\/p><p>past few years. Newland&#x27;s currency, the Newland Dollar (NLD), has been volatile due to domestic<\/p><p>inflation rates that differ from its major trading partner, Oldland, whose currency is the Oldland<\/p><p>Euro (OLE). The current spot exchange rate is 1 NLD = 0.75 OLE. The 1-year forward rate is 1<\/p><p>NLD = 0.72 OLE.<\/p><p>Newland’s central bank is considering various monetary and fiscal policy measures to stabilize<\/p><p>the NLD and promote economic growth. The inflation rate in Newland is currently at 5% per<\/p><p>annum, while Oldland&#x27;s inflation rate remains at a steady 2% per annum. The central bank of<\/p><p>Newland offers an annual interest rate of 6% on its government bonds, while Oldland’s<\/p><p>equivalent rate is 3%.<\/p><p>Newland has also seen an increase in its current account deficit due to a surge in imports over<\/p><p>exports, while its capital account has shown an influx of foreign direct investment (FDI) as<\/p><p>investors seek to capitalize on Newland&#x27;s potential for economic growth.<\/p><p>Recently, economic analysts have identified several potential warning signs of a currency crisis<\/p><p>in Newland, including rapid credit growth, an overheated real estate market, and worsening<\/p><p>terms of trade. The central bank is contemplating the implementation of capital controls as a<\/p><p>measure to prevent speculative attacks on the NLD.<\/p><p>Several international hedge funds have identified an opportunity for a carry trade by borrowing<\/p><p>in OLE and investing in NLD-denominated assets due to the interest rate differential. They<\/p><p>expect to gain from the interest rate spread as well as any potential appreciation of the NLD if<\/p><p>Newland’s economic conditions improve as forecasted.<\/p><p>The Newland government, stimulated by the risk of a currency crisis, is reviewing its monetary<\/p><p>and fiscal policy options. The fiscal policies currently under discussion aim to reduce the budget<\/p><p>deficit and slow down the economy’s overheating. On the other hand, the central bank is<\/p><p>evaluating a possible intervention in the currency market to prevent further depreciation of the<\/p><p>NLD. Measures range from direct market involvement (buying NLD and selling foreign<\/p><p>currencies) to indirect tools such as adjusting interest rates.<\/p><p>Considering the interest rate differential and expected depreciation of the NLD, economists in<\/p><p>Newland are debating whether the uncovered interest parity (UIP) holds, which could potentially<\/p><p>impact the decision-making of carry traders.<\/p><p>As the debate continues, several indicators are being monitored closely for potential early<\/p><p>warning signs of a currency crisis, which could prompt aggressive actions from the central bank<\/p><p>and government to stabilize the NLD and prevent a broader economic downturn.<\/p><p>The relationship between the balance of payments and exchange rate movements is becoming a<\/p><p>focal point of discussion among Newland’s policymakers. The persistent current account deficit<\/p><p>is raising concerns that it may be leading to downward pressure on the NLD, while the capital<\/p><p>account surplus is not considered stable enough to offset this pressure in the long term.<\/p><\/div><\/details><div class=\"qtext\"><p>How would Newland&#x27;s current account deficit most likely affect the value of the NLD?<\/p><\/div>", "subj": "economics"}, {"n": 52, "q": "Assuming the interest rate parity conditions hold, what can best describe the market's expectation of the NLD over the next year?", "opts": ["The market expects no change in the value of NLD.", "The market expects the NLD to appreciate.", "The market expects the NLD to depreciate."], "ans": "C", "expl": "The forward rate indicates what the market expects the future spot rate to be in the absence of arbitrage opportunities. Given that the 1-year forward rate (1 NLD = 0.72 OLE) is below the current spot rate (1 NLD = 0.75 OLE), the market is expecting the NLD to depreciate. A is incorrect. If the market expected no change in the value of the NLD, the forward rate would be equal to the spot rate, which is not the case given the information. B is incorrect. If the market expected the NLD to appreciate, the forward rate would be higher than the spot rate.", "explhtml": "<p>The forward rate indicates what the market expects the future spot rate to be in the absence of arbitrage opportunities. Given that the 1-year forward rate (1 NLD = 0.72 OLE) is below the current spot rate (1 NLD = 0.75 OLE), the market is expecting the NLD to depreciate.<\/p><p><b>A is incorrect.<\/b> If the market expected no change in the value of the NLD, the forward rate would be equal to the spot rate, which is not the case given the information.<\/p><p><b>B is incorrect.<\/b> If the market expected the NLD to appreciate, the forward rate would be higher than the spot rate.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Newland<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The fictitious country of Newland has been experiencing significant economic changes over the<\/p><p>past few years. Newland&#x27;s currency, the Newland Dollar (NLD), has been volatile due to domestic<\/p><p>inflation rates that differ from its major trading partner, Oldland, whose currency is the Oldland<\/p><p>Euro (OLE). The current spot exchange rate is 1 NLD = 0.75 OLE. The 1-year forward rate is 1<\/p><p>NLD = 0.72 OLE.<\/p><p>Newland’s central bank is considering various monetary and fiscal policy measures to stabilize<\/p><p>the NLD and promote economic growth. The inflation rate in Newland is currently at 5% per<\/p><p>annum, while Oldland&#x27;s inflation rate remains at a steady 2% per annum. The central bank of<\/p><p>Newland offers an annual interest rate of 6% on its government bonds, while Oldland’s<\/p><p>equivalent rate is 3%.<\/p><p>Newland has also seen an increase in its current account deficit due to a surge in imports over<\/p><p>exports, while its capital account has shown an influx of foreign direct investment (FDI) as<\/p><p>investors seek to capitalize on Newland&#x27;s potential for economic growth.<\/p><p>Recently, economic analysts have identified several potential warning signs of a currency crisis<\/p><p>in Newland, including rapid credit growth, an overheated real estate market, and worsening<\/p><p>terms of trade. The central bank is contemplating the implementation of capital controls as a<\/p><p>measure to prevent speculative attacks on the NLD.<\/p><p>Several international hedge funds have identified an opportunity for a carry trade by borrowing<\/p><p>in OLE and investing in NLD-denominated assets due to the interest rate differential. They<\/p><p>expect to gain from the interest rate spread as well as any potential appreciation of the NLD if<\/p><p>Newland’s economic conditions improve as forecasted.<\/p><p>The Newland government, stimulated by the risk of a currency crisis, is reviewing its monetary<\/p><p>and fiscal policy options. The fiscal policies currently under discussion aim to reduce the budget<\/p><p>deficit and slow down the economy’s overheating. On the other hand, the central bank is<\/p><p>evaluating a possible intervention in the currency market to prevent further depreciation of the<\/p><p>NLD. Measures range from direct market involvement (buying NLD and selling foreign<\/p><p>currencies) to indirect tools such as adjusting interest rates.<\/p><p>Considering the interest rate differential and expected depreciation of the NLD, economists in<\/p><p>Newland are debating whether the uncovered interest parity (UIP) holds, which could potentially<\/p><p>impact the decision-making of carry traders.<\/p><p>As the debate continues, several indicators are being monitored closely for potential early<\/p><p>warning signs of a currency crisis, which could prompt aggressive actions from the central bank<\/p><p>and government to stabilize the NLD and prevent a broader economic downturn.<\/p><p>The relationship between the balance of payments and exchange rate movements is becoming a<\/p><p>focal point of discussion among Newland’s policymakers. The persistent current account deficit<\/p><p>is raising concerns that it may be leading to downward pressure on the NLD, while the capital<\/p><p>account surplus is not considered stable enough to offset this pressure in the long term.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming the interest rate parity conditions hold, what can best describe the market&#x27;s expectation of the NLD over the next year?<\/p><\/div>", "subj": "economics"}, {"n": 53, "q": "What is the most likely immediate effect of InnovTech's investment in Maravilla's R&D center on the country's potential GDP?", "opts": ["Decrease due to an oversupply of IT professionals", "Increase due to capital deepening and improved TFP", "No change as foreign investment has minimal impact on potential GDP"], "ans": "B", "expl": "The investment by InnovTech is expected to increase Maravilla's potential GDP due to deepening capital and improving total factor productivity. Capital deepening occurs as more capital becomes available per worker, enhancing labor productivity and technological progress, reflecting higher TFP, which is assumed to be the R&D center contributing to the generation of new technologies and innovations within the country. A is incorrect. An investment in an R&D center suggests a demand rather than an oversupply of IT professionals. C is incorrect. Foreign investment in an R&D center is likely to significantly impact potential GDP by increasing capital and contributing to technological progress.", "explhtml": "<p>The investment by InnovTech is expected to increase Maravilla&#x27;s potential GDP due to deepening capital and improving total factor productivity. Capital deepening occurs as more capital becomes available per worker, enhancing labor productivity and technological progress, reflecting higher TFP, which is assumed to be the R&amp;D center contributing to the generation of new technologies and innovations within the country.<\/p><p><b>A is incorrect.<\/b> An investment in an R&amp;D center suggests a demand rather than an oversupply of IT professionals.<\/p><p><b>C is incorrect.<\/b> Foreign investment in an R&amp;D center is likely to significantly impact potential GDP by increasing capital and contributing to technological progress.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(h): Explain how investment in physical capital, human capital, and technological development affects economic growth.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Maravilla<\/summary><div class=\"vig-body\"><p>Maravilla is a fictional developing country characterized by modest but stable economic growth,<\/p><p>minimal inflation, and increasing interest in foreign investment. Maravilla&#x27;s economy has long<\/p><p>depended on agricultural exports, but in recent years, the government has focused on<\/p><p>diversifying its economic activities. The government has been pushing for an information<\/p><p>technology (IT) boom, aspiring to create a &quot;Silicon Valley&quot; in Maravilla. Significant efforts have<\/p><p>been made to improve the country&#x27;s educational system, especially in STEM (Science,<\/p><p>Technology, Engineering, and Mathematics) disciplines, and to introduce policies that attract<\/p><p>foreign direct investment in the technology sector.<\/p><p>However, Maravilla faces challenges typical of a developing economy. Its infrastructure outside<\/p><p>major urban centers is underdeveloped, the legal system is perceived to be less efficient and<\/p><p>more corrupt than those in developed economies, and there are concerns about political stability.<\/p><p>Another challenge is the declining growth of its working-age population due to lower birth rates<\/p><p>and minimal net immigration.<\/p><p>Maravilla&#x27;s central bank has implemented an expansionary monetary policy to stimulate growth.<\/p><p>Moreover, the government has increased investment in public infrastructure and healthcare to<\/p><p>improve the quality of life and support economic growth.<\/p><p>One technologically advanced company from a developed country, InnovTech, has expressed<\/p><p>interest in setting up a research and development (R&amp;D) center in Maravilla, attracted by the<\/p><p>highly skilled yet relatively inexpensive local workforce. The Maravilla government sees this as<\/p><p>an opportunity to jumpstart the growth of its technology sector. The government is considering<\/p><p>providing tax incentives and subsidies to support this endeavor.<\/p><p>Economic analysts predict this could significantly increase the country&#x27;s potential GDP due to<\/p><p>capital deepening and an upward shift in technological progress, or total factor productivity<\/p><p>(TFP). However, there are also concerns that the influx of investment could exacerbate the<\/p><p>existing urban-rural divide and lead to potential &quot;Dutch Disease,&quot; wherein the IT sector booms at<\/p><p>the expense of other sectors, such as agriculture.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the most likely immediate effect of InnovTech&#x27;s investment in Maravilla&#x27;s R&amp;D center on the country&#x27;s potential GDP?<\/p><\/div>", "subj": "economics"}, {"n": 54, "q": "If Maravilla experiences \"Dutch Disease\" due to its growing IT sector, which of the following is most likely to occur in the agricultural sector?", "opts": ["Increased competitiveness in the global market", "Stagnation due to shifting resources to the IT sector", "Improved agricultural yields due to technology transfer from the IT sector"], "ans": "B", "expl": "If Maravilla experiences \"Dutch Disease,\" it is likely to see stagnation in the agricultural sector due to resources, including labor and capital, shifting towards the booming IT sector. This shift could lead to the agricultural sector becoming relatively less competitive as more focus is given to the IT industry. A is incorrect. \"Dutch Disease\" typically leads to decreased competitiveness in non-booming sectors. C is incorrect. While technology transfer could theoretically improve yields, \"Dutch Disease\" typically results in neglect of sectors like agriculture, lessening the potential for such benefits.", "explhtml": "<p>If Maravilla experiences &quot;Dutch Disease,&quot; it is likely to see stagnation in the agricultural sector due to resources, including labor and capital, shifting towards the booming IT sector. This shift could lead to the agricultural sector becoming relatively less competitive as more focus is given to the IT industry.<\/p><p><b>A is incorrect.<\/b> &quot;Dutch Disease&quot; typically leads to decreased competitiveness in non-booming sectors.<\/p><p><b>C is incorrect.<\/b> While technology transfer could theoretically improve yields, &quot;Dutch Disease&quot; typically results in neglect of sectors like agriculture, lessening the potential for such benefits.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(f): Explain how natural resources affect economic growth and evaluate the argument that limited availability of natural resources constrains economic growth.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Maravilla<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maravilla is a fictional developing country characterized by modest but stable economic growth,<\/p><p>minimal inflation, and increasing interest in foreign investment. Maravilla&#x27;s economy has long<\/p><p>depended on agricultural exports, but in recent years, the government has focused on<\/p><p>diversifying its economic activities. The government has been pushing for an information<\/p><p>technology (IT) boom, aspiring to create a &quot;Silicon Valley&quot; in Maravilla. Significant efforts have<\/p><p>been made to improve the country&#x27;s educational system, especially in STEM (Science,<\/p><p>Technology, Engineering, and Mathematics) disciplines, and to introduce policies that attract<\/p><p>foreign direct investment in the technology sector.<\/p><p>However, Maravilla faces challenges typical of a developing economy. Its infrastructure outside<\/p><p>major urban centers is underdeveloped, the legal system is perceived to be less efficient and<\/p><p>more corrupt than those in developed economies, and there are concerns about political stability.<\/p><p>Another challenge is the declining growth of its working-age population due to lower birth rates<\/p><p>and minimal net immigration.<\/p><p>Maravilla&#x27;s central bank has implemented an expansionary monetary policy to stimulate growth.<\/p><p>Moreover, the government has increased investment in public infrastructure and healthcare to<\/p><p>improve the quality of life and support economic growth.<\/p><p>One technologically advanced company from a developed country, InnovTech, has expressed<\/p><p>interest in setting up a research and development (R&amp;D) center in Maravilla, attracted by the<\/p><p>highly skilled yet relatively inexpensive local workforce. The Maravilla government sees this as<\/p><p>an opportunity to jumpstart the growth of its technology sector. The government is considering<\/p><p>providing tax incentives and subsidies to support this endeavor.<\/p><p>Economic analysts predict this could significantly increase the country&#x27;s potential GDP due to<\/p><p>capital deepening and an upward shift in technological progress, or total factor productivity<\/p><p>(TFP). However, there are also concerns that the influx of investment could exacerbate the<\/p><p>existing urban-rural divide and lead to potential &quot;Dutch Disease,&quot; wherein the IT sector booms at<\/p><p>the expense of other sectors, such as agriculture.<\/p><\/div><\/details><div class=\"qtext\"><p>If Maravilla experiences &quot;Dutch Disease&quot; due to its growing IT sector, which of the following is most likely to occur in the agricultural sector?<\/p><\/div>", "subj": "economics"}, {"n": 55, "q": "Assuming the central bank's expansionary monetary policy results in a modest decrease in Maravilla's exchange rate, how would foreign investors most likely perceive this change in the context of investing in the country's IT sector?", "opts": ["As unfavorable since it reflects economic instability", "As neutral, given the long-term focus on investments", "As favorable since it reduces the local cost of investment"], "ans": "C", "expl": "A modest decrease in Maravilla's exchange rate can be perceived as favorable by foreign investors as it reduces the local investment cost, making it more attractive for companies like InnovTech to invest in the country's IT sector. A is incorrect. A modest and controlled decrease in the exchange rate is not inherently a sign of economic instability, mainly if it results from deliberate policy actions. B is incorrect. Exchange rate movements can have immediate financial implications for investors, affecting their investment decisions.", "explhtml": "<p>A modest decrease in Maravilla&#x27;s exchange rate can be perceived as favorable by foreign investors as it reduces the local investment cost, making it more attractive for companies like InnovTech to invest in the country&#x27;s IT sector.<\/p><p><b>A is incorrect.<\/b> A modest and controlled decrease in the exchange rate is not inherently a sign of economic instability, mainly if it results from deliberate policy actions.<\/p><p><b>B is incorrect.<\/b> Exchange rate movements can have immediate financial implications for investors, affecting their investment decisions.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(a): Compare factors favoring and limiting economic growth in developed and developing economies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Maravilla<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maravilla is a fictional developing country characterized by modest but stable economic growth,<\/p><p>minimal inflation, and increasing interest in foreign investment. Maravilla&#x27;s economy has long<\/p><p>depended on agricultural exports, but in recent years, the government has focused on<\/p><p>diversifying its economic activities. The government has been pushing for an information<\/p><p>technology (IT) boom, aspiring to create a &quot;Silicon Valley&quot; in Maravilla. Significant efforts have<\/p><p>been made to improve the country&#x27;s educational system, especially in STEM (Science,<\/p><p>Technology, Engineering, and Mathematics) disciplines, and to introduce policies that attract<\/p><p>foreign direct investment in the technology sector.<\/p><p>However, Maravilla faces challenges typical of a developing economy. Its infrastructure outside<\/p><p>major urban centers is underdeveloped, the legal system is perceived to be less efficient and<\/p><p>more corrupt than those in developed economies, and there are concerns about political stability.<\/p><p>Another challenge is the declining growth of its working-age population due to lower birth rates<\/p><p>and minimal net immigration.<\/p><p>Maravilla&#x27;s central bank has implemented an expansionary monetary policy to stimulate growth.<\/p><p>Moreover, the government has increased investment in public infrastructure and healthcare to<\/p><p>improve the quality of life and support economic growth.<\/p><p>One technologically advanced company from a developed country, InnovTech, has expressed<\/p><p>interest in setting up a research and development (R&amp;D) center in Maravilla, attracted by the<\/p><p>highly skilled yet relatively inexpensive local workforce. The Maravilla government sees this as<\/p><p>an opportunity to jumpstart the growth of its technology sector. The government is considering<\/p><p>providing tax incentives and subsidies to support this endeavor.<\/p><p>Economic analysts predict this could significantly increase the country&#x27;s potential GDP due to<\/p><p>capital deepening and an upward shift in technological progress, or total factor productivity<\/p><p>(TFP). However, there are also concerns that the influx of investment could exacerbate the<\/p><p>existing urban-rural divide and lead to potential &quot;Dutch Disease,&quot; wherein the IT sector booms at<\/p><p>the expense of other sectors, such as agriculture.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming the central bank&#x27;s expansionary monetary policy results in a modest decrease in Maravilla&#x27;s exchange rate, how would foreign investors most likely perceive this change in the context of investing in the country&#x27;s IT sector?<\/p><\/div>", "subj": "economics"}, {"n": 56, "q": "What impact would the central bank's expansionary monetary policy most likely have on Maravilla's inflation in the short term, assuming the economy is below its full employment level?", "opts": ["Increase due to higher aggregate demand", "No change due to the liquidity trap", "Decrease as a result of greater money supply"], "ans": "A", "expl": "In the short term, the central bank's expansionary monetary policy would most likely increase inflation by stimulating higher aggregate demand. B is incorrect. The liquidity trap happens when interest rates are already at or near zero and cannot be lowered further, which was not specified in the scenario. C is incorrect. While an increase in the money supply is associated with expansionary policy, it typically leads to higher inflation, not a decrease.", "explhtml": "<p>In the short term, the central bank&#x27;s expansionary monetary policy would most likely increase inflation by stimulating higher aggregate demand.<\/p><p><b>B is incorrect.<\/b> The liquidity trap happens when interest rates are already at or near zero and cannot be lowered further, which was not specified in the scenario.<\/p><p><b>C is incorrect.<\/b> While an increase in the money supply is associated with expansionary policy, it typically leads to higher inflation, not a decrease.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(l): Describe the expected impact of removing trade barriers on capital investment and profits, employment and wages, and growth in the economies involved.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Maravilla<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maravilla is a fictional developing country characterized by modest but stable economic growth,<\/p><p>minimal inflation, and increasing interest in foreign investment. Maravilla&#x27;s economy has long<\/p><p>depended on agricultural exports, but in recent years, the government has focused on<\/p><p>diversifying its economic activities. The government has been pushing for an information<\/p><p>technology (IT) boom, aspiring to create a &quot;Silicon Valley&quot; in Maravilla. Significant efforts have<\/p><p>been made to improve the country&#x27;s educational system, especially in STEM (Science,<\/p><p>Technology, Engineering, and Mathematics) disciplines, and to introduce policies that attract<\/p><p>foreign direct investment in the technology sector.<\/p><p>However, Maravilla faces challenges typical of a developing economy. Its infrastructure outside<\/p><p>major urban centers is underdeveloped, the legal system is perceived to be less efficient and<\/p><p>more corrupt than those in developed economies, and there are concerns about political stability.<\/p><p>Another challenge is the declining growth of its working-age population due to lower birth rates<\/p><p>and minimal net immigration.<\/p><p>Maravilla&#x27;s central bank has implemented an expansionary monetary policy to stimulate growth.<\/p><p>Moreover, the government has increased investment in public infrastructure and healthcare to<\/p><p>improve the quality of life and support economic growth.<\/p><p>One technologically advanced company from a developed country, InnovTech, has expressed<\/p><p>interest in setting up a research and development (R&amp;D) center in Maravilla, attracted by the<\/p><p>highly skilled yet relatively inexpensive local workforce. The Maravilla government sees this as<\/p><p>an opportunity to jumpstart the growth of its technology sector. The government is considering<\/p><p>providing tax incentives and subsidies to support this endeavor.<\/p><p>Economic analysts predict this could significantly increase the country&#x27;s potential GDP due to<\/p><p>capital deepening and an upward shift in technological progress, or total factor productivity<\/p><p>(TFP). However, there are also concerns that the influx of investment could exacerbate the<\/p><p>existing urban-rural divide and lead to potential &quot;Dutch Disease,&quot; wherein the IT sector booms at<\/p><p>the expense of other sectors, such as agriculture.<\/p><\/div><\/details><div class=\"qtext\"><p>What impact would the central bank&#x27;s expansionary monetary policy most likely have on Maravilla&#x27;s inflation in the short term, assuming the economy is below its full employment level?<\/p><\/div>", "subj": "economics"}, {"n": 57, "q": "Statement 1 most likely refers to?", "opts": ["Covered interest rate parity.", "Uncovered interest rate parity.", "International Fisher effect."], "ans": "B", "expl": "The carry trade strategy relies on the premise that uncovered interest rate parity does not hold in the short to medium term. If it did hold, investors would achieve equivalent returns from either an unhedged foreign currency investment or a domestic currency investment, as the appreciation or depreciation of the exchange rate would offset the yield differential. A is incorrect. This condition involves using forward contracts to hedge against exchange rate risk, ensuring that the returns on domestic and foreign investments are equivalent after accounting for the forward rate. It is irrelevant to the carry trade strategy, which relies on the absence of hedging. C is incorrect. This theory suggests that the difference in nominal interest rates between two countries is equal to the expected change in their exchange rates. If this effect held, the difference in returns between high-yield and low-yield currencies would be offset by changes in exchange rates, negating the basis for the carry trade strategy.", "explhtml": "<p>The carry trade strategy relies on the premise that uncovered interest rate parity does not hold in the short to medium term. If it did hold, investors would achieve equivalent returns from either an unhedged foreign currency investment or a domestic currency investment, as the appreciation or depreciation of the exchange rate would offset the yield differential.<\/p><p><b>A is incorrect.<\/b> This condition involves using forward contracts to hedge against exchange rate risk, ensuring that the returns on domestic and foreign investments are equivalent after accounting for the forward rate. It is irrelevant to the carry trade strategy, which relies on the absence of hedging.<\/p><p><b>C is incorrect.<\/b> This theory suggests that the difference in nominal interest rates between two countries is equal to the expected change in their exchange rates. If this effect held, the difference in returns between high-yield and low-yield currencies would be offset by changes in exchange rates, negating the basis for the carry trade strategy.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Jennifer Gallagher<\/summary><div class=\"vig-body\"><p>Jennifer Gallagher is a student at University College Dublin (UDC). She prepared a presentation<\/p><p>on foreign exchange rates for her business course assignment. Since her knowledge on the topic<\/p><p>is limited, she would like a financial practitioner&#x27;s perspective on the subject, so she arranged a<\/p><p>meeting with Michael O&#x27;Brien, a currency trader with a local bank. Gallager asks O’Brien,” What<\/p><p>drives exchange rates? I’d like to know why the European debt crisis of 2011 affected the New<\/p><p>Zealand dollar and if any factors are at play.”<\/p><p>In response, O’Brien starts by describing exchange rates. He mentions how international parity<\/p><p>conditions describe the link between exchange rates and future spot rates, forward exchange<\/p><p>rates, interest rate differences and expected inflation. O’Brien makes the following statements:<\/p><p>Statement 1: “Luckily, the key international parity condition affecting foreign exchange carry<\/p><p>trades doesn&#x27;t consistently hold. Foreign exchange carry traders invest in high-yield currencies<\/p><p>by buying them and finance their positions by borrowing in low-yield currencies. Unfortunately,<\/p><p>sudden drops in currency values can lead to financial crises as traders rush to close their<\/p><p>positions.”<\/p><p>Statement 2: “Monetary models of exchange rate determination emphasize the impacts of<\/p><p>inflation, price level fluctuations, and risk premium adjustments. Here is some pertinent<\/p><p>literature regarding the models I mentioned, along with a few questions for your consideration.”<\/p><p>Question 1: Consider an emerging market country that enforces relaxed monetary and fiscal<\/p><p>policies under conditions of high capital mobility. Are these policies expected to result in<\/p><p>currency depreciation and appreciation or have no impact?<\/p><p>Statement 3: I noted that capital inflows have the potential to trigger a currency crisis, resulting<\/p><p>in considerable losses for fund managers. In the lead-up to such a crisis, I anticipate that the<\/p><p>affected country would experience:<\/p><p>Prediction 1: a decrease in foreign exchange reserves.<\/p><p>Prediction 2: decline in broad money supply.<\/p><p>Prediction 3: a significantly elevated exchange rate compared to its average level during stable periods.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Statement 1 most likely refers to?<\/p><\/div>", "subj": "economics"}, {"n": 58, "q": "The factor that is least suitable for describing the type of models mentioned in Statement 2 is:", "opts": ["Risk premium adjustments.", "Inflation.", "Interest rates."], "ans": "A", "expl": "While monetary models of exchange rate determination consider various factors, risk premium adjustments are generally more associated with asset pricing models than monetary models. They play a lesser role in the core components of monetary models. B is incorrect. This is a crucial factor in monetary models of exchange rate determination. These models often emphasize how inflation impacts exchange rates through changes in the price levels of goods and services. C is incorrect. Interest rates are a fundamental component of monetary models, as they directly influence currency values by affecting investment flows and economic activity.", "explhtml": "<p>While monetary models of exchange rate determination consider various factors, risk premium adjustments are generally more associated with asset pricing models than monetary models. They play a lesser role in the core components of monetary models.<\/p><p><b>B is incorrect.<\/b> This is a crucial factor in monetary models of exchange rate determination. These models often emphasize how inflation impacts exchange rates through changes in the price levels of goods and services.<\/p><p><b>C is incorrect.<\/b> Interest rates are a fundamental component of monetary models, as they directly influence currency values by affecting investment flows and economic activity.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Jennifer Gallagher<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jennifer Gallagher is a student at University College Dublin (UDC). She prepared a presentation<\/p><p>on foreign exchange rates for her business course assignment. Since her knowledge on the topic<\/p><p>is limited, she would like a financial practitioner&#x27;s perspective on the subject, so she arranged a<\/p><p>meeting with Michael O&#x27;Brien, a currency trader with a local bank. Gallager asks O’Brien,” What<\/p><p>drives exchange rates? I’d like to know why the European debt crisis of 2011 affected the New<\/p><p>Zealand dollar and if any factors are at play.”<\/p><p>In response, O’Brien starts by describing exchange rates. He mentions how international parity<\/p><p>conditions describe the link between exchange rates and future spot rates, forward exchange<\/p><p>rates, interest rate differences and expected inflation. O’Brien makes the following statements:<\/p><p>Statement 1: “Luckily, the key international parity condition affecting foreign exchange carry<\/p><p>trades doesn&#x27;t consistently hold. Foreign exchange carry traders invest in high-yield currencies<\/p><p>by buying them and finance their positions by borrowing in low-yield currencies. Unfortunately,<\/p><p>sudden drops in currency values can lead to financial crises as traders rush to close their<\/p><p>positions.”<\/p><p>Statement 2: “Monetary models of exchange rate determination emphasize the impacts of<\/p><p>inflation, price level fluctuations, and risk premium adjustments. Here is some pertinent<\/p><p>literature regarding the models I mentioned, along with a few questions for your consideration.”<\/p><p>Question 1: Consider an emerging market country that enforces relaxed monetary and fiscal<\/p><p>policies under conditions of high capital mobility. Are these policies expected to result in<\/p><p>currency depreciation and appreciation or have no impact?<\/p><p>Statement 3: I noted that capital inflows have the potential to trigger a currency crisis, resulting<\/p><p>in considerable losses for fund managers. In the lead-up to such a crisis, I anticipate that the<\/p><p>affected country would experience:<\/p><p>Prediction 1: a decrease in foreign exchange reserves.<\/p><p>Prediction 2: decline in broad money supply.<\/p><p>Prediction 3: a significantly elevated exchange rate compared to its average level during stable periods.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The factor that is least suitable for describing the type of models mentioned in Statement 2 is:<\/p><\/div>", "subj": "economics"}, {"n": 59, "q": "The correct response to Question 1 is:", "opts": ["A currency appreciation will occur.", "A currency depreciation will occur.", "Nothing will happen."], "ans": "B", "expl": "Relaxed monetary and fiscal policies generally increase the money supply and lower interest rates. Under conditions of high capital mobility, this scenario makes the currency less attractive to foreign investors, resulting in capital outflows and an increased supply of the currency in the market, which leads to currency depreciation. A is incorrect. This is unlikely in the scenario described. Relaxed policies typically reduce interest rates and increase money supply, making the currency less attractive and leading to depreciation rather than appreciation. C is incorrect. It is improbable that relaxed monetary and fiscal policies under high capital mobility would not impact the currency. Such policies usually influence the currency value, making this option incorrect.", "explhtml": "<p>Relaxed monetary and fiscal policies generally increase the money supply and lower interest rates. Under conditions of high capital mobility, this scenario makes the currency less attractive to foreign investors, resulting in capital outflows and an increased supply of the currency in the market, which leads to currency depreciation.<\/p><p><b>A is incorrect.<\/b> This is unlikely in the scenario described. Relaxed policies typically reduce interest rates and increase money supply, making the currency less attractive and leading to depreciation rather than appreciation.<\/p><p><b>C is incorrect.<\/b> It is improbable that relaxed monetary and fiscal policies under high capital mobility would not impact the currency. Such policies usually influence the currency value, making this option incorrect.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Jennifer Gallagher<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jennifer Gallagher is a student at University College Dublin (UDC). She prepared a presentation<\/p><p>on foreign exchange rates for her business course assignment. Since her knowledge on the topic<\/p><p>is limited, she would like a financial practitioner&#x27;s perspective on the subject, so she arranged a<\/p><p>meeting with Michael O&#x27;Brien, a currency trader with a local bank. Gallager asks O’Brien,” What<\/p><p>drives exchange rates? I’d like to know why the European debt crisis of 2011 affected the New<\/p><p>Zealand dollar and if any factors are at play.”<\/p><p>In response, O’Brien starts by describing exchange rates. He mentions how international parity<\/p><p>conditions describe the link between exchange rates and future spot rates, forward exchange<\/p><p>rates, interest rate differences and expected inflation. O’Brien makes the following statements:<\/p><p>Statement 1: “Luckily, the key international parity condition affecting foreign exchange carry<\/p><p>trades doesn&#x27;t consistently hold. Foreign exchange carry traders invest in high-yield currencies<\/p><p>by buying them and finance their positions by borrowing in low-yield currencies. Unfortunately,<\/p><p>sudden drops in currency values can lead to financial crises as traders rush to close their<\/p><p>positions.”<\/p><p>Statement 2: “Monetary models of exchange rate determination emphasize the impacts of<\/p><p>inflation, price level fluctuations, and risk premium adjustments. Here is some pertinent<\/p><p>literature regarding the models I mentioned, along with a few questions for your consideration.”<\/p><p>Question 1: Consider an emerging market country that enforces relaxed monetary and fiscal<\/p><p>policies under conditions of high capital mobility. Are these policies expected to result in<\/p><p>currency depreciation and appreciation or have no impact?<\/p><p>Statement 3: I noted that capital inflows have the potential to trigger a currency crisis, resulting<\/p><p>in considerable losses for fund managers. In the lead-up to such a crisis, I anticipate that the<\/p><p>affected country would experience:<\/p><p>Prediction 1: a decrease in foreign exchange reserves.<\/p><p>Prediction 2: decline in broad money supply.<\/p><p>Prediction 3: a significantly elevated exchange rate compared to its average level during stable periods.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The correct response to Question 1 is:<\/p><\/div>", "subj": "economics"}, {"n": 60, "q": "Which of O'Brien's predictions in Statement 3 is least likely to be accurate?", "opts": ["Prediction1.", "Prediction 2.", "Prediction 3."], "ans": "B", "expl": "It is unlikely that the broad money supply would decline in the lead-up to a currency crisis triggered by capital inflows. Capital inflows generally increase the money supply as foreign capital enters the economy. A is incorrect. This is a plausible prediction because central banks might intervene to support the currency by selling foreign exchange reserves. Such interventions are common in the lead-up to a currency crisis. C is incorrect. This prediction is also likely, as capital inflows can lead to an overvaluation of the currency, driving the exchange rate higher than its mean level during stable periods.", "explhtml": "<p>It is unlikely that the broad money supply would decline in the lead-up to a currency crisis triggered by capital inflows. Capital inflows generally increase the money supply as foreign capital enters the economy.<\/p><p><b>A is incorrect.<\/b> This is a plausible prediction because central banks might intervene to support the currency by selling foreign exchange reserves. Such interventions are common in the lead-up to a currency crisis.<\/p><p><b>C is incorrect.<\/b> This prediction is also likely, as capital inflows can lead to an overvaluation of the currency, driving the exchange rate higher than its mean level during stable periods.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Jennifer Gallagher<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jennifer Gallagher is a student at University College Dublin (UDC). She prepared a presentation<\/p><p>on foreign exchange rates for her business course assignment. Since her knowledge on the topic<\/p><p>is limited, she would like a financial practitioner&#x27;s perspective on the subject, so she arranged a<\/p><p>meeting with Michael O&#x27;Brien, a currency trader with a local bank. Gallager asks O’Brien,” What<\/p><p>drives exchange rates? I’d like to know why the European debt crisis of 2011 affected the New<\/p><p>Zealand dollar and if any factors are at play.”<\/p><p>In response, O’Brien starts by describing exchange rates. He mentions how international parity<\/p><p>conditions describe the link between exchange rates and future spot rates, forward exchange<\/p><p>rates, interest rate differences and expected inflation. O’Brien makes the following statements:<\/p><p>Statement 1: “Luckily, the key international parity condition affecting foreign exchange carry<\/p><p>trades doesn&#x27;t consistently hold. Foreign exchange carry traders invest in high-yield currencies<\/p><p>by buying them and finance their positions by borrowing in low-yield currencies. Unfortunately,<\/p><p>sudden drops in currency values can lead to financial crises as traders rush to close their<\/p><p>positions.”<\/p><p>Statement 2: “Monetary models of exchange rate determination emphasize the impacts of<\/p><p>inflation, price level fluctuations, and risk premium adjustments. Here is some pertinent<\/p><p>literature regarding the models I mentioned, along with a few questions for your consideration.”<\/p><p>Question 1: Consider an emerging market country that enforces relaxed monetary and fiscal<\/p><p>policies under conditions of high capital mobility. Are these policies expected to result in<\/p><p>currency depreciation and appreciation or have no impact?<\/p><p>Statement 3: I noted that capital inflows have the potential to trigger a currency crisis, resulting<\/p><p>in considerable losses for fund managers. In the lead-up to such a crisis, I anticipate that the<\/p><p>affected country would experience:<\/p><p>Prediction 1: a decrease in foreign exchange reserves.<\/p><p>Prediction 2: decline in broad money supply.<\/p><p>Prediction 3: a significantly elevated exchange rate compared to its average level during stable periods.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of O&#x27;Brien&#x27;s predictions in Statement 3 is least likely to be accurate?<\/p><\/div>", "subj": "economics"}, {"n": 61, "q": "Using Exhibit 1, what is the forward discount (premium) for a 180-day AUD /EUR the closest to?", "opts": ["0.0178", "0.00911", "0.0588"], "ans": "B", "expl": "To calculate the forward discount (premium) is: A is incorrect. This is the forward premium for a 360-day ( annual )forward. C is incorrect. This is the 180-day AUD MRR.", "explhtml": "<p>To calculate the forward discount (premium) is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0094.webp\" style=\"max-width:min(100%,415px)\" alt=\"⎛ [ Actual 360 ] ⎞ Ff/d −Sf/d = Sf/d ⎜⎜ ⎝ 1 + id [ Actual 360 ] ⎟⎟ ⎠ (if −id) ⎛ [ 180 360 ] ⎞ Ff/d −Sf/d = 1.666 ⎜⎜ ⎟⎟ (0.0588 −0.0476) ⎝1 + 0.0476[138600⎠] 0.5 Ff/d −Sf/d = 1.666( 1.0238 ) (0.0112) = 0.00911\"><p><b>A is incorrect.<\/b> This is the forward premium for a 360-day ( annual )forward.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0095.webp\" style=\"max-width:min(100%,496px)\" alt=\"⎛ [ 360 360 ] ⎞ Ff/d −Sf/d = 1.666 ⎜⎜ ⎟⎟ (0.0588 −0.0476) = 0.0178 ⎝(1 + 0.0476 [336600⎠]\"><p><b>C is incorrect.<\/b> This is the 180-day AUD MRR.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (i): Explain spot and forward rates and calculate the forward premium/discount for a given currency<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Frank Paolini<\/summary><div class=\"vig-body\"><p>Frank Paolini is an FX trading associate at Everyday FX Ltd (EFL). He works under the<\/p><p>mentorship and supervision of Marco Zampolini, CFA, the firm&#x27;s senior FX trader. Zampolini<\/p><p>mentions that an Australian corporate client is about to close a sale in Germany within the next<\/p><p>year. The client wants to hedge the sale against foreign exchange exposure and requested EFL<\/p><p>estimate the potential hedging cost. Paolini has been tasked with establishing the<\/p><p>discount/premium for a 180-day forward contract based on the exchange rate data presented in<\/p><p>Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0092.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit 1: Currency Data for EUR and AUD Spot (AUD/EUR) 1.666 180-day MRR EUR 4.76% 180-day MRR AUD 5.88%\"><p>Zamopolini suggests two trades that can be initiated to determine their profit potential.<\/p><p>Trade 1: A possible triangular arbitrage using the USD, Sterling Pound, and Polish Zloty. The<\/p><p>trade will be executed using a dealer’s bid/offer rate quote of 4.105/4.108 in PLN/USD and the<\/p><p>interbank spot rate quotes presented in Exhibit 2.<\/p><p>Trade 2: A carry trade involving the Swedish Krona and the USD. Zampolini expects a higher<\/p><p>return from the carry trade than from purchasing a one-year domestic note. This is mainly due to<\/p><p>low interest rates in the US. Paolini generates a one-year forecast and selected data from the<\/p><p>market to help with the carry trade presented in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0093.webp\" style=\"max-width:min(100%,520px)\" alt=\"Exhibit 2: Interbank Quotes Currency Pair Bid/Offer PLN/GBP 5.082/5.088 USD/GBP 1.242/1.250 Exhibit 3: Interest Rates and Spot Rates for Proposed Carry Trade Currency Today’s One-Year Today’s One-Year MRR pair (P/B) Spot Rate Projected Spot Rate JPY/SEK 14.062 14.056 SEK 0.72% USD/JPY 0.0064 0.0065 \"><p>Once done Paolini makes the following statements regarding purchasing power parity.<\/p><p>Statement 1: According to the theory and empirical evidence of purchasing power parity (PPP),<\/p><p>high-inflation countries should not see their currencies appreciate over time.<\/p><p>Statement 2: The absolute version of purchasing power parity (PPP) failure can be best explained<\/p><p>by the existence of trade barriers and the consumption of different product mixes across<\/p><p>countries.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, what is the forward discount (premium) for a 180-day AUD /EUR the closest to?<\/p><\/div>", "subj": "economics"}, {"n": 62, "q": "Based on Exhibit 2, the most accurate recommendation rega
