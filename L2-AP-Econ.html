tion and healthcare. Evans asks, “What is the primary obstacle to Marakanda’s<\/p><p>economic growth?”<\/p><p>Solari, a low-income country, has a population where 40% are under age 20. Its labor force is<\/p><p>expanding by 3.5% annually, but only 30% of workers have completed secondary education. Due<\/p><p>to government childcare subsidies, the female labour force participation rate has risen from 25%<\/p><p>to 45% in the last decade. However, Solari’s infrastructure is underdeveloped, with frequent<\/p><p>power outages. Evans asks, “How will Solari’s demographics impact its potential GDP growth?”<\/p><p>Finally, a mid-sized economy, Ventura recently abolished tariffs and attracted $30 billion in<\/p><p>foreign direct investment (FDI). FDI has funded high-tech manufacturing plants and R&amp;D<\/p><p>centres, with exports now accounting for 45% of GDP. Ventura’s GDP growth has accelerated<\/p><p>from 2% to 7% annually, and local firms are adopting advanced technologies from foreign<\/p><p>partners. Evans asks, “Which economic growth theory best explains Ventura’s transformation?”<\/p><\/div><\/details><div class=\"qtext\"><p>Solari’s potential GDP growth will most likely.<\/p><\/div>", "subj": "economics"}, {"n": 80, "q": "Ventura’s growth trajectory is best explained by:", "opts": ["Neoclassical growth theory’s focus on capital accumulation", "Endogenous growth theory’s emphasis on innovation spillovers", "Classical theory’s reliance on population growth"], "ans": "B", "expl": "Endogenous growth theory highlights innovation/R&D spillovers from FDI and technology adoption, which align with Ventura’s tech-driven export growth. A is incorrect. Neoclassical theory predicts only temporary growth from capital accumulation, not sustained 7% growth. C is incorrect. Ventura’s growth is tied to trade/FDI, not population changes.", "explhtml": "<p>Endogenous growth theory highlights innovation/R&amp;D spillovers from FDI and technology adoption, which align with Ventura’s tech-driven export growth.<\/p><p><b>A is incorrect.<\/b> Neoclassical theory predicts only temporary growth from capital accumulation, not sustained 7% growth.<\/p><p><b>C is incorrect.<\/b> Ventura’s growth is tied to trade/FDI, not population changes.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (i): Compare classical growth theory, neoclassical growth theory, and endogenous growth theory.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Clara Evans<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Evans, the CFO of Summit Global Investments (SGI), is assessing economic growth<\/p><p>prospects for four countries to allocate a $800 million fund. Jordan Lee, an economist, assists<\/p><p>him. Their discussion focuses on key growth drivers outlined in internal reports.<\/p><p>Evans reviews a report on Terranova, a developed economy with a capital stock of $150,000 per<\/p><p>worker. Over the past decade, Terranova’s GDP growth has slowed to 1.2% annually, despite<\/p><p>heavy investment in automation and robotics. Total factor productivity (TFP) growth has<\/p><p>stagnated at 0.3%, while the working-age population is shrinking by 0.5% annually. Jordan notes<\/p><p>that Terranova’s capital-to-labor ratio is among the highest globally. Evans asks, “Why hasn’t<\/p><p>increased capital investment boosted Terranova’s growth?”<\/p><p>Next, they analyze Marakanda, a developing nation with vast oil reserves. Marakanda’s GDP<\/p><p>growth averages 0.8% annually, far below neighbouring countries. The report highlights frequent<\/p><p>changes in government, widespread corruption, and a lack of enforceable property rights.<\/p><p>Additionally, Marakanda’s currency has appreciated by 25% over five years due to oil exports,<\/p><p>crippling its manufacturing sector. Jordan mentions that Marakanda spends only 2% of its GDP<\/p><p>on education and healthcare. Evans asks, “What is the primary obstacle to Marakanda’s<\/p><p>economic growth?”<\/p><p>Solari, a low-income country, has a population where 40% are under age 20. Its labor force is<\/p><p>expanding by 3.5% annually, but only 30% of workers have completed secondary education. Due<\/p><p>to government childcare subsidies, the female labour force participation rate has risen from 25%<\/p><p>to 45% in the last decade. However, Solari’s infrastructure is underdeveloped, with frequent<\/p><p>power outages. Evans asks, “How will Solari’s demographics impact its potential GDP growth?”<\/p><p>Finally, a mid-sized economy, Ventura recently abolished tariffs and attracted $30 billion in<\/p><p>foreign direct investment (FDI). FDI has funded high-tech manufacturing plants and R&amp;D<\/p><p>centres, with exports now accounting for 45% of GDP. Ventura’s GDP growth has accelerated<\/p><p>from 2% to 7% annually, and local firms are adopting advanced technologies from foreign<\/p><p>partners. Evans asks, “Which economic growth theory best explains Ventura’s transformation?”<\/p><\/div><\/details><div class=\"qtext\"><p>Ventura’s growth trajectory is best explained by:<\/p><\/div>", "subj": "economics"}, {"n": 81, "q": "Concordia’s disappointing growth despite capital deepening is most likely due to:", "opts": ["Low TFP growth", "Infrastructure bottlenecks", "Rapid labor-force growth"], "ans": "A", "expl": "In the growth-accounting identity, total factor productivity (TFP) captures the impact of technological progress and efficiency gains. Concordia’s capital per worker is extremely high ($200 k), so further capital investment faces diminishing returns. With TFP growth at only 0.2%, productivity gains are too small to sustain more than 0.8% GDP growth. B is incorrect. Infrastructure constraints can slow growth, but nothing in the profile indicates a breakdown in transport or power. The primary issue is the failure of automation investment to increase productivity (i.e., low Total Factor Productivity, TFP). C is incorrect. A declining working-age population (–0.4%) cannot depress growth further via “too much labor.” Rapid labor-force growth would boost potential output, not reduce it.", "explhtml": "<p>In the growth-accounting identity, total factor productivity (TFP) captures the impact of technological progress and efficiency gains. Concordia’s capital per worker is extremely high ($200 k), so further capital investment faces diminishing returns. With TFP growth at only 0.2%, productivity gains are too small to sustain more than 0.8% GDP growth.<\/p><p><b>B is incorrect.<\/b> Infrastructure constraints can slow growth, but nothing in the profile indicates a breakdown in transport or power. The primary issue is the failure of automation investment to increase productivity (i.e., low Total Factor Productivity, TFP).<\/p><p><b>C is incorrect.<\/b> A declining working-age population (–0.4%) cannot depress growth further via “too much labor.” Rapid labor-force growth would boost potential output, not reduce it.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Emily Grant<\/summary><div class=\"vig-body\"><p>Emily Grant, CFA, is a portfolio manager at Atlas Capital Group. Grant requests her assistant,<\/p><p>Daniel Park, to evaluate four countries, Concordia, Emeraldia, Freeland, and Novaterra, as part<\/p><p>of the company’s ambitious plans to invest in new markets. Park comes up with the following<\/p><p>report.<\/p><p>Concordia boasts $200,000 of capital per worker, yet its annual GDP growth has decelerated to<\/p><p>0.8% over the past decade. Total factor productivity (TFP) growth is 0.2%, while its working-age<\/p><p>cohort shrinks by 0.4% annually. Despite significant investment in AI and machine-learning<\/p><p>automation, output gains have been negligible. Grant asks, “Why hasn’t Concordia’s capital-<\/p><p>intensive push reignited growth?””<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0110.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 1: Country Concordia’s Key Metrics Metric Value Capital per worker $200, 000 TFP growth (annual) 0.2% Working-age population −0.4% (decline) GDP growth 0.8%\"><p>Emeraldia’s gold exports account for 70% of its exports, yet its growth stalls at 0.6% per annum.<\/p><p>Frequent civil unrest, expropriation risk, and a 40% currency appreciation (five years) have<\/p><p>crippled its textile industry. Public spending on health and education is only 2% of GDP. Grant<\/p><p>wonders, “Which institutional weakness most undermines Emeraldia’s expansion?”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0111.webp\" style=\"max-width:min(100%,386px)\" alt=\"Exhibit 2: Country Emeraldia’s Key Metrics Metric Value Natural resource exports 70% of total exports Education spending 2.0% of GDP Currency appreciation 40% (5 years) GDP growth 0.6%\"><p>Freeland’s labor force surges at 5% p.a., fueled by a baby-boom generation; only 20% of workers<\/p><p>hold a tertiary education. Childcare subsidies have lifted female participation from 30% to 50%<\/p><p>in ten years. However, roads and ports are underbuilt, causing costly supply delays. Grant asks,<\/p><p>“How will Freeland’s demographic dividend shape its potential GDP growth?”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0112.webp\" style=\"max-width:min(100%,439px)\" alt=\"Exhibit 3: Country Freeland’s Key Metrics  Metric Value Labor force growth 5.0% (annual) Female labour participation 50% (up from 30%) Workers with vocational training 20%\"><p>After tariff elimination, Novaterra attracted $20 billion in FDI, which funded biotech parks and<\/p><p>human capital training. Exports now account for 55% of GDP, and domestic research and<\/p><p>development spending rose by 4% of GDP. Its growth jumped from 1.5% to 9% annually.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0113.webp\" style=\"max-width:min(100%,358px)\" alt=\"Exhibit 4: Country Novaterra’s Key Metrics Metric Value FDI inflows (5 years) $20 billion Export-to-GDP ratio 55% R&amp;D Spending 4.0% GDP growth 9.0% (up from 1.5%)\"><\/div><\/details><div class=\"qtext\"><p>Concordia’s disappointing growth despite capital deepening is most likely due to:<\/p><\/div>", "subj": "economics"}, {"n": 82, "q": "In Emeraldia’s profile, which policy intervention would most directly alleviate its binding growth constraint under a growth-identification framework?", "opts": ["Increase public spending on health and education", "Institute capital controls to stabilize the currency", "Expand output in the gold sector"], "ans": "A", "expl": "Emeraldia’s extremely low 2% spending on human-capital formation has likely produced a weak workforce. Growth-identification tools prioritize the binding constraint, here, skill and health deficits. Raising social investment directly enhances labor productivity and promotes long-term growth. B is incorrect. Currency volatility and expropriation risk hurt investor confidence, but stabilizing the exchange rate does not directly boost productivity. It addresses macro risk rather than the most critical factor, human capital. C is incorrect. Further extraction of gold risks entrenching a resource-dependent economy (Dutch disease) and does nothing to diversify skills or manufacturing capabilities.", "explhtml": "<p>Emeraldia’s extremely low 2% spending on human-capital formation has likely produced a weak workforce. Growth-identification tools prioritize the binding constraint, here, skill and health deficits. Raising social investment directly enhances labor productivity and promotes long-term growth.<\/p><p><b>B is incorrect.<\/b> Currency volatility and expropriation risk hurt investor confidence, but stabilizing the exchange rate does not directly boost productivity. It addresses macro risk rather than the most critical factor, human capital.<\/p><p><b>C is incorrect.<\/b> Further extraction of gold risks entrenching a resource-dependent economy (Dutch disease) and does nothing to diversify skills or manufacturing capabilities.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Emily Grant<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily Grant, CFA, is a portfolio manager at Atlas Capital Group. Grant requests her assistant,<\/p><p>Daniel Park, to evaluate four countries, Concordia, Emeraldia, Freeland, and Novaterra, as part<\/p><p>of the company’s ambitious plans to invest in new markets. Park comes up with the following<\/p><p>report.<\/p><p>Concordia boasts $200,000 of capital per worker, yet its annual GDP growth has decelerated to<\/p><p>0.8% over the past decade. Total factor productivity (TFP) growth is 0.2%, while its working-age<\/p><p>cohort shrinks by 0.4% annually. Despite significant investment in AI and machine-learning<\/p><p>automation, output gains have been negligible. Grant asks, “Why hasn’t Concordia’s capital-<\/p><p>intensive push reignited growth?””<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0110.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 1: Country Concordia’s Key Metrics Metric Value Capital per worker $200, 000 TFP growth (annual) 0.2% Working-age population −0.4% (decline) GDP growth 0.8%\"><p>Emeraldia’s gold exports account for 70% of its exports, yet its growth stalls at 0.6% per annum.<\/p><p>Frequent civil unrest, expropriation risk, and a 40% currency appreciation (five years) have<\/p><p>crippled its textile industry. Public spending on health and education is only 2% of GDP. Grant<\/p><p>wonders, “Which institutional weakness most undermines Emeraldia’s expansion?”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0111.webp\" style=\"max-width:min(100%,386px)\" alt=\"Exhibit 2: Country Emeraldia’s Key Metrics Metric Value Natural resource exports 70% of total exports Education spending 2.0% of GDP Currency appreciation 40% (5 years) GDP growth 0.6%\"><p>Freeland’s labor force surges at 5% p.a., fueled by a baby-boom generation; only 20% of workers<\/p><p>hold a tertiary education. Childcare subsidies have lifted female participation from 30% to 50%<\/p><p>in ten years. However, roads and ports are underbuilt, causing costly supply delays. Grant asks,<\/p><p>“How will Freeland’s demographic dividend shape its potential GDP growth?”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0112.webp\" style=\"max-width:min(100%,439px)\" alt=\"Exhibit 3: Country Freeland’s Key Metrics  Metric Value Labor force growth 5.0% (annual) Female labour participation 50% (up from 30%) Workers with vocational training 20%\"><p>After tariff elimination, Novaterra attracted $20 billion in FDI, which funded biotech parks and<\/p><p>human capital training. Exports now account for 55% of GDP, and domestic research and<\/p><p>development spending rose by 4% of GDP. Its growth jumped from 1.5% to 9% annually.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0113.webp\" style=\"max-width:min(100%,358px)\" alt=\"Exhibit 4: Country Novaterra’s Key Metrics Metric Value FDI inflows (5 years) $20 billion Export-to-GDP ratio 55% R&amp;D Spending 4.0% GDP growth 9.0% (up from 1.5%)\"><\/div><\/details><div class=\"qtext\"><p>In Emeraldia’s profile, which policy intervention would most directly alleviate its binding growth constraint under a growth-identification framework?<\/p><\/div>", "subj": "economics"}, {"n": 83, "q": "In Freeland’s profile, applying a growth-identification framework, the most binding constraint on its medium-term growth is:", "opts": ["Educational attainment among workers", "Infrastructure deficiencies causing supply bottlenecks", "Rapid pace of labor-force expansion"], "ans": "B", "expl": "A growth-identification analysis seeks the single most binding constraint. Freeland’s 5% labor-force growth and rising female participation provide an abundant workforce, while childcare subsidies have boosted participation. Low tertiary education (20%) is a concern, but can be addressed over time. However, underbuilt roads and ports immediately choke distribution and dampen returns on new investment, making infrastructure the binding constraint on translating labor inputs into output. A is incorrect. Improving education raises human capital but represents a long-term adjustment bottlenecks in transport and logistics will continue to throttle growth until fixed capital is upgraded. C is incorrect. Rapid labor-force expansion is not a constraint; it is a growth driver. More workers increase potential output, so labor growth in itself is not binding.", "explhtml": "<p>A growth-identification analysis seeks the single most binding constraint. Freeland’s 5% labor-force growth and rising female participation provide an abundant workforce, while childcare subsidies have boosted participation. Low tertiary education (20%) is a concern, but can be addressed over time. However, underbuilt roads and ports immediately choke distribution and dampen returns on new investment, making infrastructure the binding constraint on translating labor inputs into output.<\/p><p><b>A is incorrect.<\/b> Improving education raises human capital but represents a long-term adjustment bottlenecks in transport and logistics will continue to throttle growth until fixed capital is upgraded.<\/p><p><b>C is incorrect.<\/b> Rapid labor-force expansion is not a constraint; it is a growth driver. More workers increase potential output, so labor growth in itself is not binding.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (c): Explain why potential GDP and its growth rate matter for equity and fixed-income investors.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Emily Grant<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily Grant, CFA, is a portfolio manager at Atlas Capital Group. Grant requests her assistant,<\/p><p>Daniel Park, to evaluate four countries, Concordia, Emeraldia, Freeland, and Novaterra, as part<\/p><p>of the company’s ambitious plans to invest in new markets. Park comes up with the following<\/p><p>report.<\/p><p>Concordia boasts $200,000 of capital per worker, yet its annual GDP growth has decelerated to<\/p><p>0.8% over the past decade. Total factor productivity (TFP) growth is 0.2%, while its working-age<\/p><p>cohort shrinks by 0.4% annually. Despite significant investment in AI and machine-learning<\/p><p>automation, output gains have been negligible. Grant asks, “Why hasn’t Concordia’s capital-<\/p><p>intensive push reignited growth?””<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0110.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 1: Country Concordia’s Key Metrics Metric Value Capital per worker $200, 000 TFP growth (annual) 0.2% Working-age population −0.4% (decline) GDP growth 0.8%\"><p>Emeraldia’s gold exports account for 70% of its exports, yet its growth stalls at 0.6% per annum.<\/p><p>Frequent civil unrest, expropriation risk, and a 40% currency appreciation (five years) have<\/p><p>crippled its textile industry. Public spending on health and education is only 2% of GDP. Grant<\/p><p>wonders, “Which institutional weakness most undermines Emeraldia’s expansion?”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0111.webp\" style=\"max-width:min(100%,386px)\" alt=\"Exhibit 2: Country Emeraldia’s Key Metrics Metric Value Natural resource exports 70% of total exports Education spending 2.0% of GDP Currency appreciation 40% (5 years) GDP growth 0.6%\"><p>Freeland’s labor force surges at 5% p.a., fueled by a baby-boom generation; only 20% of workers<\/p><p>hold a tertiary education. Childcare subsidies have lifted female participation from 30% to 50%<\/p><p>in ten years. However, roads and ports are underbuilt, causing costly supply delays. Grant asks,<\/p><p>“How will Freeland’s demographic dividend shape its potential GDP growth?”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0112.webp\" style=\"max-width:min(100%,439px)\" alt=\"Exhibit 3: Country Freeland’s Key Metrics  Metric Value Labor force growth 5.0% (annual) Female labour participation 50% (up from 30%) Workers with vocational training 20%\"><p>After tariff elimination, Novaterra attracted $20 billion in FDI, which funded biotech parks and<\/p><p>human capital training. Exports now account for 55% of GDP, and domestic research and<\/p><p>development spending rose by 4% of GDP. Its growth jumped from 1.5% to 9% annually.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0113.webp\" style=\"max-width:min(100%,358px)\" alt=\"Exhibit 4: Country Novaterra’s Key Metrics Metric Value FDI inflows (5 years) $20 billion Export-to-GDP ratio 55% R&amp;D Spending 4.0% GDP growth 9.0% (up from 1.5%)\"><\/div><\/details><div class=\"qtext\"><p>In Freeland’s profile, applying a growth-identification framework, the most binding constraint on its medium-term growth is:<\/p><\/div>", "subj": "economics"}, {"n": 84, "q": "Which metric from Novaterra’s profile best exemplifies an endogenous driver of its sustained 9% growth?", "opts": ["FDI inflows of $20 billion", "Exports equal to 55% of GDP", "R&D spending at 4% of GDP"], "ans": "C", "expl": "Endogenous growth theory posits that knowledge creation and spillovers, proxied by R&D intensity, drive perpetual growth without diminishing returns. A high 4% R&D/GDP ratio signals investments in innovation that perpetuate productivity gains. A is incorrect. Foreign direct investment contributes to capital accumulation (the neoclassical channel), but unless it builds domestic innovation capacity, it does not, by itself, generate sustained, self-reinforcing growth. B is incorrect. High export intensity improves resource allocation and scale economies, but aligns more closely with open-economy neoclassical growth mechanics than the internal knowledge externalities central to endogenous growth theory.", "explhtml": "<p>Endogenous growth theory posits that knowledge creation and spillovers, proxied by R&amp;D intensity, drive perpetual growth without diminishing returns. A high 4% R&amp;D/GDP ratio signals investments in innovation that perpetuate productivity gains.<\/p><p><b>A is incorrect.<\/b> Foreign direct investment contributes to capital accumulation (the neoclassical channel), but unless it builds domestic innovation capacity, it does not, by itself, generate sustained, self-reinforcing growth.<\/p><p><b>B is incorrect.<\/b> High export intensity improves resource allocation and scale economies, but aligns more closely with open-economy neoclassical growth mechanics than the internal knowledge externalities central to endogenous growth theory.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (i): Compare classical growth theory, neoclassical growth theory, and endogenous growth theory.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Emily Grant<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily Grant, CFA, is a portfolio manager at Atlas Capital Group. Grant requests her assistant,<\/p><p>Daniel Park, to evaluate four countries, Concordia, Emeraldia, Freeland, and Novaterra, as part<\/p><p>of the company’s ambitious plans to invest in new markets. Park comes up with the following<\/p><p>report.<\/p><p>Concordia boasts $200,000 of capital per worker, yet its annual GDP growth has decelerated to<\/p><p>0.8% over the past decade. Total factor productivity (TFP) growth is 0.2%, while its working-age<\/p><p>cohort shrinks by 0.4% annually. Despite significant investment in AI and machine-learning<\/p><p>automation, output gains have been negligible. Grant asks, “Why hasn’t Concordia’s capital-<\/p><p>intensive push reignited growth?””<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0110.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 1: Country Concordia’s Key Metrics Metric Value Capital per worker $200, 000 TFP growth (annual) 0.2% Working-age population −0.4% (decline) GDP growth 0.8%\"><p>Emeraldia’s gold exports account for 70% of its exports, yet its growth stalls at 0.6% per annum.<\/p><p>Frequent civil unrest, expropriation risk, and a 40% currency appreciation (five years) have<\/p><p>crippled its textile industry. Public spending on health and education is only 2% of GDP. Grant<\/p><p>wonders, “Which institutional weakness most undermines Emeraldia’s expansion?”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0111.webp\" style=\"max-width:min(100%,386px)\" alt=\"Exhibit 2: Country Emeraldia’s Key Metrics Metric Value Natural resource exports 70% of total exports Education spending 2.0% of GDP Currency appreciation 40% (5 years) GDP growth 0.6%\"><p>Freeland’s labor force surges at 5% p.a., fueled by a baby-boom generation; only 20% of workers<\/p><p>hold a tertiary education. Childcare subsidies have lifted female participation from 30% to 50%<\/p><p>in ten years. However, roads and ports are underbuilt, causing costly supply delays. Grant asks,<\/p><p>“How will Freeland’s demographic dividend shape its potential GDP growth?”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0112.webp\" style=\"max-width:min(100%,439px)\" alt=\"Exhibit 3: Country Freeland’s Key Metrics  Metric Value Labor force growth 5.0% (annual) Female labour participation 50% (up from 30%) Workers with vocational training 20%\"><p>After tariff elimination, Novaterra attracted $20 billion in FDI, which funded biotech parks and<\/p><p>human capital training. Exports now account for 55% of GDP, and domestic research and<\/p><p>development spending rose by 4% of GDP. Its growth jumped from 1.5% to 9% annually.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0113.webp\" style=\"max-width:min(100%,358px)\" alt=\"Exhibit 4: Country Novaterra’s Key Metrics Metric Value FDI inflows (5 years) $20 billion Export-to-GDP ratio 55% R&amp;D Spending 4.0% GDP growth 9.0% (up from 1.5%)\"><\/div><\/details><div class=\"qtext\"><p>Which metric from Novaterra’s profile best exemplifies an endogenous driver of its sustained 9% growth?<\/p><\/div>", "subj": "economics"}, {"n": 85, "q": "Concerning Opportunity 1 and assuming that the hedge was done with forward contracts, would the profitability of the investment most likely be eroded?", "opts": ["If covered interest parity holds.", "If uncovered interest parity holds.", "If ex-ante Purchasing Power Parity (PPP) and Fisher effect do not hold."], "ans": "A", "expl": "If CIP holds, the higher interest rate on the New Zealand deposit would be exactly offset by the forward contract, eroding the investment's profitability. The forward rate would have been adjusted to account for the interest rate differential, leading to no arbitrage profit. B is incorrect. Uncovered Interest Parity (UIP) is related to the expected future spot exchange rates rather than forward contracts. UIP does not guarantee that the forward contract will offset the interest rate differential, and it involves exchange rate risk. Thus, UIP holding does not directly impact the profitability of a hedged investment with forward contracts. C is incorrect. Ex-ante PPP and the Fisher effect relate to expected inflation rates and nominal interest rates, respectively. Their non-holding does not necessarily impact the effectiveness of a hedged investment with forward contracts, as the hedge aims to eliminate exchange rate risk regardless of these factors.", "explhtml": "<p>If CIP holds, the higher interest rate on the New Zealand deposit would be exactly offset by the forward contract, eroding the investment&#x27;s profitability. The forward rate would have been adjusted to account for the interest rate differential, leading to no arbitrage profit.<\/p><p><b>B is incorrect.<\/b> Uncovered Interest Parity (UIP) is related to the expected future spot exchange rates rather than forward contracts. UIP does not guarantee that the forward contract will offset the interest rate differential, and it involves exchange rate risk. Thus, UIP holding does not directly impact the profitability of a hedged investment with forward contracts.<\/p><p><b>C is incorrect.<\/b> Ex-ante PPP and the Fisher effect relate to expected inflation rates and nominal interest rates, respectively. Their non-holding does not necessarily impact the effectiveness of a hedged investment with forward contracts, as the hedge aims to eliminate exchange rate risk regardless of these factors.<\/p><p class=\"los\">Economics, Learning Module 2: Currency Exchange Rates: Understanding Equilibrium Value. LOS 2 (g): Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · Isobel Williams<\/summary><div class=\"vig-body\"><p>Isobel Williams is a portfolio manager at Stables Group, a UK-based Investment bank. Williams<\/p><p>works closely with Clive Whitman, a seasoned foreign exchange trader and financial analyst at<\/p><p>Stables Group. Williams and Whitman meet to discuss investment opportunities Stables is<\/p><p>interested in pursuing. Whitman presents the following investment opportunities:<\/p><p>Opportunity 1: “Investing money in New Zealand fixed income will prove profitable. The one-year<\/p><p>New Zealand deposit rate is 7.6%, and the UK deposit rate is 4.5%, which suggests a higher<\/p><p>yield can be captured. The profitability of the investment can be supported by the fact that the<\/p><p>NZD is expected to depreciate by 1.2%.”<\/p><p>Opportunity 2: “I recommend entering into a carry-trade position by borrowing the Japanese Yen<\/p><p>and investing in the Swedish Krona. To support my decision, I have gathered the following<\/p><p>information presented in Exhibit 1.”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0114.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit 1: Carry Trade Information Currency One-year Currency Pair Spot Rate at T0 Spot Rate at T1 MRR rate at T0 JPY 3.65% JPY/GBP 189.91 189.62 SEK 7.32% GBP/SEK 0.074 0.078\"><p>After the meeting was over, Whitman was approached by Alex Wang, a currency overlay manager<\/p><p>at Stables Group, to discuss foreign exchange carry trades in detail. Wang stated that he had<\/p><p>entered into a carry trade with the US as the funding currency. He added that the inflation rate<\/p><p>in the U.K. was 3.2% greater than the inflation rate in the USA area. Wang expressed his<\/p><p>concerns over the profitability of his trade, given the high risks embedded in such strategies.<\/p><p>Whitman, in response, made the following comment:<\/p><p>“I believe you should exit your strategy if the Sterling Pound starts to depreciate by less than<\/p><p>1.0% relative to the USD or when the USD starts to appreciate relative to the Sterling Pound by<\/p><p>more than 1.0%.”<\/p><p>Wang then asked Whitman to elucidate the influence of current account trends on exchange<\/p><p>rates over time. Whitman made the following comments:<\/p><p>Statement 1: “If a country imported more goods than it exported, its currency would adjust to<\/p><p>this current account deficit, causing it to depreciate.”<\/p><p>Statement 2: “Due to the debt sustainability channel, if a country runs a large and persistent<\/p><p>current account deficit, not only will its currency depreciate, but the currency’s real long-run<\/p><p>equilibrium value would also be revised downward.”<\/p><p>Statement 3: “If Country X has a larger current account deficit relative to Country Z, X will most likely experience a build-up of Z’s assets in its coffers, resulting in the depreciation of Country X’s currency relative to Country Z’s currency.”<\/p><\/div><\/details><div class=\"qtext\"><p>Concerning Opportunity 1 and assuming that the hedge was done with forward contracts, would the profitability of the investment most likely be eroded?<\/p><\/div>", "subj": "economics"}, {"n": 86, "q": "Based on opportunity 2, the all-in JPY return is closest to?", "opts": ["12.97%", "9.32%", "7.32%"], "ans": "B", "expl": "To calculate the all-in return of the carry trade in JPY terms, we first need to determine the cross rate between JPY and SEK at the beginning and end of the year. Initially, the cross rate is calculated by multiplying the JPY/GBP rate by the GBP/SEK rate: After one year, the cross rate is: The next step is to calculate the unhedged return on the Swedish deposit. This is done by converting the initial investment from JPY to SEK, applying the 7.32% interest rate, and then converting it back to JPY: This return of 12.97% must then be adjusted for the cost of borrowing in GBP, which is the one-year JPY MRR rate of 3.65%. Therefore, the net return on the carry trade is: A is incorrect. This value represents the unhedged return on the Swedish deposit. C is incorrect. This is the interest rate on the Swedish deposit (SEK). It does not consider the exchange rate changes and the borrowing costs in JPY.", "explhtml": "<p>To calculate the all-in return of the carry trade in JPY terms, we first need to determine the cross rate between JPY and SEK at the beginning and end of the year. Initially, the cross rate is calculated by multiplying the JPY/GBP rate by the GBP/SEK rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0115.webp\" style=\"max-width:min(100%,289px)\" alt=\"JPY SEK  at T0 = 189.91 × 0.074 = 14.05\"><p>After one year, the cross rate is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0116.webp\" style=\"max-width:min(100%,289px)\" alt=\"JPY SEK  at T1 = 189.62 × 0.078 = 14.79\"><p>The next step is to calculate the unhedged return on the Swedish deposit. This is done by converting the initial investment from JPY to SEK, applying the 7.32% interest rate, and then converting it back to JPY:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0117.webp\" style=\"max-width:min(100%,565px)\" alt=\"1 Unhedged Return = × (1 + 0.0732) × 14.79 −1 = 0.1297 = 12.97% 14.05\"><p>This return of 12.97% must then be adjusted for the cost of borrowing in GBP, which is the one-year JPY MRR rate of 3.65%. Therefore, the net return on the carry trade is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0118.webp\" style=\"max-width:min(100%,313px)\" alt=\"Net Return = 12.97% −3.65% = 9.32%\"><p><b>A is incorrect.<\/b> This value represents the unhedged return on the Swedish deposit.<\/p><p><b>C is incorrect.<\/b> This is the interest rate on the Swedish deposit (SEK). It does not consider the exchange rate changes and the borrowing costs in JPY.<\/p><p class=\"los\">Economics, Learning Module 2: Currency Exchange Rates: Understanding Equilibrium Value. LOS 2(i): Describe the carry trade and its relation to uncovered interest rate parity and calculate the profit from a carry trade<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · Isobel Williams<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Isobel Williams is a portfolio manager at Stables Group, a UK-based Investment bank. Williams<\/p><p>works closely with Clive Whitman, a seasoned foreign exchange trader and financial analyst at<\/p><p>Stables Group. Williams and Whitman meet to discuss investment opportunities Stables is<\/p><p>interested in pursuing. Whitman presents the following investment opportunities:<\/p><p>Opportunity 1: “Investing money in New Zealand fixed income will prove profitable. The one-year<\/p><p>New Zealand deposit rate is 7.6%, and the UK deposit rate is 4.5%, which suggests a higher<\/p><p>yield can be captured. The profitability of the investment can be supported by the fact that the<\/p><p>NZD is expected to depreciate by 1.2%.”<\/p><p>Opportunity 2: “I recommend entering into a carry-trade position by borrowing the Japanese Yen<\/p><p>and investing in the Swedish Krona. To support my decision, I have gathered the following<\/p><p>information presented in Exhibit 1.”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0114.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit 1: Carry Trade Information Currency One-year Currency Pair Spot Rate at T0 Spot Rate at T1 MRR rate at T0 JPY 3.65% JPY/GBP 189.91 189.62 SEK 7.32% GBP/SEK 0.074 0.078\"><p>After the meeting was over, Whitman was approached by Alex Wang, a currency overlay manager<\/p><p>at Stables Group, to discuss foreign exchange carry trades in detail. Wang stated that he had<\/p><p>entered into a carry trade with the US as the funding currency. He added that the inflation rate<\/p><p>in the U.K. was 3.2% greater than the inflation rate in the USA area. Wang expressed his<\/p><p>concerns over the profitability of his trade, given the high risks embedded in such strategies.<\/p><p>Whitman, in response, made the following comment:<\/p><p>“I believe you should exit your strategy if the Sterling Pound starts to depreciate by less than<\/p><p>1.0% relative to the USD or when the USD starts to appreciate relative to the Sterling Pound by<\/p><p>more than 1.0%.”<\/p><p>Wang then asked Whitman to elucidate the influence of current account trends on exchange<\/p><p>rates over time. Whitman made the following comments:<\/p><p>Statement 1: “If a country imported more goods than it exported, its currency would adjust to<\/p><p>this current account deficit, causing it to depreciate.”<\/p><p>Statement 2: “Due to the debt sustainability channel, if a country runs a large and persistent<\/p><p>current account deficit, not only will its currency depreciate, but the currency’s real long-run<\/p><p>equilibrium value would also be revised downward.”<\/p><p>Statement 3: “If Country X has a larger current account deficit relative to Country Z, X will most likely experience a build-up of Z’s assets in its coffers, resulting in the depreciation of Country X’s currency relative to Country Z’s currency.”<\/p><\/div><\/details><div class=\"qtext\"><p>Based on opportunity 2, the all-in JPY return is closest to?<\/p><\/div>", "subj": "economics"}, {"n": 87, "q": "Is Whitman’s second statement most likely correct, and with regards to the first statement, what will most likely cause the country’s currency to depreciate less to correct the trade balance:", "opts": ["Yes, and export demand being more price elastic than import demand will cause the currency to depreciate less.", "No, and import prices rising by more than the decrease in export prices will cause the currency to depreciate less.", "No, and a smaller initial gap between exports and imports will cause the currency to depreciate less."], "ans": "A", "expl": "Whitman's second statement is indeed correct. When a country experiences a large and persistent current account deficit, it implies that the country is importing more than it is exporting, leading to an outflow of domestic currency to foreign markets. Over time, this imbalance can lead to an increased supply of domestic currency in the global market, which typically results in depreciation. Furthermore, persistent current account deficits contribute to rising levels of external debt. As the debt levels increase, confidence in the country's economic stability may wane, leading to a downward revision of the currency's real long-run equilibrium value. This depreciation is a corrective mechanism to make domestic goods and services more competitively priced on the global market, helping narrow the current account deficit. B is incorrect. The statement that import prices rise more than the decrease in export prices will cause the currency to depreciate less is incorrect. If import prices rise significantly while export prices decrease, it could exacerbate the current account deficit because the value of imports would increase relative to exports. This scenario would likely lead to a greater need for the currency to depreciate to correct the trade imbalance, not less. C is incorrect. While a smaller initial gap between exports and imports might imply a lesser need for significant currency adjustments, it does not directly influence the degree of currency depreciation needed to correct the trade balance. The key factor is the price elasticity of exports relative to imports, as explained in the reasoning for why option A is correct. A smaller initial trade gap does not necessarily affect the elasticity of demand for exports and imports, which is the primary determinant of how much the currency needs to depreciate to restore balance.", "explhtml": "<p>Whitman&#x27;s second statement is indeed correct. When a country experiences a large and persistent current account deficit, it implies that the country is importing more than it is exporting, leading to an outflow of domestic currency to foreign markets. Over time, this imbalance can lead to an increased supply of domestic currency in the global market, which typically results in depreciation. Furthermore, persistent current account deficits contribute to rising levels of external debt. As the debt levels increase, confidence in the country&#x27;s economic stability may wane, leading to a downward revision of the currency&#x27;s real long-run equilibrium value. This depreciation is a corrective mechanism to make domestic goods and services more competitively priced on the global market, helping narrow the current account deficit.<\/p><p><b>B is incorrect.<\/b> The statement that import prices rise more than the decrease in export prices will cause the currency to depreciate less is incorrect. If import prices rise significantly while export prices decrease, it could exacerbate the current account deficit because the value of imports would increase relative to exports. This scenario would likely lead to a greater need for the currency to depreciate to correct the trade imbalance, not less.<\/p><p><b>C is incorrect.<\/b> While a smaller initial gap between exports and imports might imply a lesser need for significant currency adjustments, it does not directly influence the degree of currency depreciation needed to correct the trade balance. The key factor is the price elasticity of exports relative to imports, as explained in the reasoning for why option A is correct. A smaller initial trade gap does not necessarily affect the elasticity of demand for exports and imports, which is the primary determinant of how much the currency needs to depreciate to restore balance.<\/p><p class=\"los\">Economics, Learning Module 2: Currency Exchange Rates: Understanding Equilibrium Value. LOS 2 (j): Explain how flows in the balance of payment accounts affect currency exchange rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · Isobel Williams<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Isobel Williams is a portfolio manager at Stables Group, a UK-based Investment bank. Williams<\/p><p>works closely with Clive Whitman, a seasoned foreign exchange trader and financial analyst at<\/p><p>Stables Group. Williams and Whitman meet to discuss investment opportunities Stables is<\/p><p>interested in pursuing. Whitman presents the following investment opportunities:<\/p><p>Opportunity 1: “Investing money in New Zealand fixed income will prove profitable. The one-year<\/p><p>New Zealand deposit rate is 7.6%, and the UK deposit rate is 4.5%, which suggests a higher<\/p><p>yield can be captured. The profitability of the investment can be supported by the fact that the<\/p><p>NZD is expected to depreciate by 1.2%.”<\/p><p>Opportunity 2: “I recommend entering into a carry-trade position by borrowing the Japanese Yen<\/p><p>and investing in the Swedish Krona. To support my decision, I have gathered the following<\/p><p>information presented in Exhibit 1.”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0114.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit 1: Carry Trade Information Currency One-year Currency Pair Spot Rate at T0 Spot Rate at T1 MRR rate at T0 JPY 3.65% JPY/GBP 189.91 189.62 SEK 7.32% GBP/SEK 0.074 0.078\"><p>After the meeting was over, Whitman was approached by Alex Wang, a currency overlay manager<\/p><p>at Stables Group, to discuss foreign exchange carry trades in detail. Wang stated that he had<\/p><p>entered into a carry trade with the US as the funding currency. He added that the inflation rate<\/p><p>in the U.K. was 3.2% greater than the inflation rate in the USA area. Wang expressed his<\/p><p>concerns over the profitability of his trade, given the high risks embedded in such strategies.<\/p><p>Whitman, in response, made the following comment:<\/p><p>“I believe you should exit your strategy if the Sterling Pound starts to depreciate by less than<\/p><p>1.0% relative to the USD or when the USD starts to appreciate relative to the Sterling Pound by<\/p><p>more than 1.0%.”<\/p><p>Wang then asked Whitman to elucidate the influence of current account trends on exchange<\/p><p>rates over time. Whitman made the following comments:<\/p><p>Statement 1: “If a country imported more goods than it exported, its currency would adjust to<\/p><p>this current account deficit, causing it to depreciate.”<\/p><p>Statement 2: “Due to the debt sustainability channel, if a country runs a large and persistent<\/p><p>current account deficit, not only will its currency depreciate, but the currency’s real long-run<\/p><p>equilibrium value would also be revised downward.”<\/p><p>Statement 3: “If Country X has a larger current account deficit relative to Country Z, X will most likely experience a build-up of Z’s assets in its coffers, resulting in the depreciation of Country X’s currency relative to Country Z’s currency.”<\/p><\/div><\/details><div class=\"qtext\"><p>Is Whitman’s second statement most likely correct, and with regards to the first statement, what will most likely cause the country’s currency to depreciate less to correct the trade balance:<\/p><\/div>", "subj": "economics"}, {"n": 88, "q": "Concerning statement 3, what mechanism of exchange rate correction is Whitman most likely referring to, and is his statement correct:", "opts": ["The debt sustainability channel and the statement are correct.", "The portfolio balance channel and the statement are incorrect.", "The portfolio balance channel and the statement are correct."], "ans": "B", "expl": "Whitman refers to the portfolio balance channel, a mechanism where shifts influence the exchange rates in the supply and demand for assets denominated in different currencies. This channel suggests that if Country X has a more significant current account deficit relative to Country Z, Country X will accumulate more of Country Z's assets. This accumulation occurs because Country X is importing more than it is exporting. Thus, it needs to pay for these imports, typically in the exporting country's currency, leading to a demand for Country Z's currency. Over time, this can lead to a depreciation of Country X's currency due to increased supply in the foreign exchange market. However, Whitman's statement is incorrect because he suggests that Country X's currency would depreciate due to a buildup of Country Z's assets in its coffers, which is a misunderstanding of how the portfolio balance channel operates. In reality, the country's currency with the current account surplus (Country Z in this case) appreciates, not depreciates, as others are accumulating their assets. A is incorrect. The option incorrectly states that Whitman's statement is incorrect. While Whitman correctly identifies the portfolio balance channel as the mechanism, his interpretation of its impact on currency valuation is flawed. He suggests that the country's currency with a larger current account deficit would depreciate due to the surplus country's asset accumulation. However, the portfolio balance channel would lead to an appreciation of the surplus country's currency, not a depreciation. This misunderstanding leads to the incorrect conclusion in option B. C is incorrect. This option incorrectly agrees with Whitman's statement. While correctly identifying the portfolio balance channel as the mechanism involved, it fails to recognise the error in Whitman's explanation of the currency movements. The portfolio balance channel indeed affects exchange rates by altering currencies' demand and supply dynamics based on asset accumulation. However, Whitman's specific claim that the currency of a country with a larger current account deficit would depreciate due to asset accumulation is incorrect. Instead, the currency of the country accumulating assets (the country with a current account surplus) is likely to appreciate.", "explhtml": "<p>Whitman refers to the portfolio balance channel, a mechanism where shifts influence the exchange rates in the supply and demand for assets denominated in different currencies. This channel suggests that if Country X has a more significant current account deficit relative to Country Z, Country X will accumulate more of Country Z&#x27;s assets. This accumulation occurs because Country X is importing more than it is exporting. Thus, it needs to pay for these imports, typically in the exporting country&#x27;s currency, leading to a demand for Country Z&#x27;s currency. Over time, this can lead to a depreciation of Country X&#x27;s currency due to increased supply in the foreign exchange market. However, Whitman&#x27;s statement is incorrect because he suggests that Country X&#x27;s currency would depreciate due to a buildup of Country Z&#x27;s assets in its coffers, which is a misunderstanding of how the portfolio balance channel operates. In reality, the country&#x27;s currency with the current account surplus (Country Z in this case) appreciates, not depreciates, as others are accumulating their assets.<\/p><p><b>A is incorrect.<\/b> The option incorrectly states that Whitman&#x27;s statement is incorrect. While Whitman correctly identifies the portfolio balance channel as the mechanism, his interpretation of its impact on currency valuation is flawed. He suggests that the country&#x27;s currency with a larger current account deficit would depreciate due to the surplus country&#x27;s asset accumulation. However, the portfolio balance channel would lead to an appreciation of the surplus country&#x27;s currency, not a depreciation. This misunderstanding leads to the incorrect conclusion in option B.<\/p><p><b>C is incorrect.<\/b> This option incorrectly agrees with Whitman&#x27;s statement. While correctly identifying the portfolio balance channel as the mechanism involved, it fails to recognise the error in Whitman&#x27;s explanation of the currency movements. The portfolio balance channel indeed affects exchange rates by altering currencies&#x27; demand and supply dynamics based on asset accumulation. However, Whitman&#x27;s specific claim that the currency of a country with a larger current account deficit would depreciate due to asset accumulation is incorrect. Instead, the currency of the country accumulating assets (the country with a current account surplus) is likely to appreciate.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (j): Explain how flows in the balance of payment accounts affect currency exchange rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · Isobel Williams<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Isobel Williams is a portfolio manager at Stables Group, a UK-based Investment bank. Williams<\/p><p>works closely with Clive Whitman, a seasoned foreign exchange trader and financial analyst at<\/p><p>Stables Group. Williams and Whitman meet to discuss investment opportunities Stables is<\/p><p>interested in pursuing. Whitman presents the following investment opportunities:<\/p><p>Opportunity 1: “Investing money in New Zealand fixed income will prove profitable. The one-year<\/p><p>New Zealand deposit rate is 7.6%, and the UK deposit rate is 4.5%, which suggests a higher<\/p><p>yield can be captured. The profitability of the investment can be supported by the fact that the<\/p><p>NZD is expected to depreciate by 1.2%.”<\/p><p>Opportunity 2: “I recommend entering into a carry-trade position by borrowing the Japanese Yen<\/p><p>and investing in the Swedish Krona. To support my decision, I have gathered the following<\/p><p>information presented in Exhibit 1.”<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0114.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit 1: Carry Trade Information Currency One-year Currency Pair Spot Rate at T0 Spot Rate at T1 MRR rate at T0 JPY 3.65% JPY/GBP 189.91 189.62 SEK 7.32% GBP/SEK 0.074 0.078\"><p>After the meeting was over, Whitman was approached by Alex Wang, a currency overlay manager<\/p><p>at Stables Group, to discuss foreign exchange carry trades in detail. Wang stated that he had<\/p><p>entered into a carry trade with the US as the funding currency. He added that the inflation rate<\/p><p>in the U.K. was 3.2% greater than the inflation rate in the USA area. Wang expressed his<\/p><p>concerns over the profitability of his trade, given the high risks embedded in such strategies.<\/p><p>Whitman, in response, made the following comment:<\/p><p>“I believe you should exit your strategy if the Sterling Pound starts to depreciate by less than<\/p><p>1.0% relative to the USD or when the USD starts to appreciate relative to the Sterling Pound by<\/p><p>more than 1.0%.”<\/p><p>Wang then asked Whitman to elucidate the influence of current account trends on exchange<\/p><p>rates over time. Whitman made the following comments:<\/p><p>Statement 1: “If a country imported more goods than it exported, its currency would adjust to<\/p><p>this current account deficit, causing it to depreciate.”<\/p><p>Statement 2: “Due to the debt sustainability channel, if a country runs a large and persistent<\/p><p>current account deficit, not only will its currency depreciate, but the currency’s real long-run<\/p><p>equilibrium value would also be revised downward.”<\/p><p>Statement 3: “If Country X has a larger current account deficit relative to Country Z, X will most likely experience a build-up of Z’s assets in its coffers, resulting in the depreciation of Country X’s currency relative to Country Z’s currency.”<\/p><\/div><\/details><div class=\"qtext\"><p>Concerning statement 3, what mechanism of exchange rate correction is Whitman most likely referring to, and is his statement correct:<\/p><\/div>", "subj": "economics"}];
const CFG = {"title": "AnalystPrep — Economics", "subtitle": "CFA Level II · 88 câu · 22 item sets · AnalystPrep 2026", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
