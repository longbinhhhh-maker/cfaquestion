rding trade 1 is to:", "opts": ["Execute the trade, purchase the USD from the dealer and sell USD in the interbank market.", "Decline the trade.", "Execute the trade, purchase USD from the interbank market and sell USD to the dealer."], "ans": "C", "expl": "The dealer is offering to buy USD at an inflated bid rate. This overvaluation is identified by calculating the interbank implied cross rate for PLN/USD using an intuitive equation-based method. Or By inverting the USD/GBP quotes in Exhibit 2, we obtain the GBP/USD bid-offer rates of 0.8/0.805. The bid rate of 0.8 is derived from the inverse of the USD/GBP offer rate (1/1.250), and the offer rate of 0.805 comes from the inverse of the USD/GBP bid rate (1/1.242). Subsequently, multiplying the PLN/GBP and GBP/USD bid-offer rates results in the interbank implied PLN/USD cross rate. Bid: 5.082 × 0.8 = 4.066 Offer: 5.088 × 0.805 = 4.096 An arbitrage opportunity exists because the dealer is willing to buy USD at a rate of 4.105 while USD can be acquired from the interbank market at a rate of 4.096. One can purchase USD in the interbank market and sell it to the dealer, making a profit of 0.009 PLN (4.105 - 4.096) per BRL transacted. A is incorrect. This option is not profitable. The dealer's bid rate for USD is higher than the interbank market rate. Purchasing USD from the dealer would involve buying at a higher rate (4.105) and selling at a lower interbank rate (4.096), leading to a loss instead of a profit. B is incorrect. This option ignores the opportunity to capitalize on the arbitrage opportunity. Since there is a chance to buy USD at a lower rate in the interbank market and sell it to the dealer at a higher rate, declining the trade would mean missing out on a potential profit of 0.009 PLN per BRL transacted.", "explhtml": "<p>The dealer is offering to buy USD at an inflated bid rate. This overvaluation is identified by calculating the interbank implied cross rate for PLN/USD using an intuitive equation-based method.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0096.webp\" style=\"max-width:min(100%,260px)\" alt=\"PLN USD = PLN/GBP × (USD/GBP)−1\"><p>Or<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0097.webp\" style=\"max-width:min(100%,234px)\" alt=\"PLN USD = PLN/GBP × GBP/USD\"><p>By inverting the USD/GBP quotes in Exhibit 2, we obtain the GBP/USD bid-offer rates of 0.8/0.805. The bid rate of 0.8 is derived from the inverse of the USD/GBP offer rate (1/1.250), and the offer rate of 0.805 comes from the inverse of the USD/GBP bid rate (1/1.242). Subsequently, multiplying the PLN/GBP and GBP/USD bid-offer rates results in the interbank implied PLN/USD cross rate.<\/p><p>Bid: 5.082 × 0.8 = 4.066<\/p><p>Offer: 5.088 × 0.805 = 4.096<\/p><p>An arbitrage opportunity exists because the dealer is willing to buy USD at a rate of 4.105 while USD can be acquired from the interbank market at a rate of 4.096. One can purchase USD in the interbank market and sell it to the dealer, making a profit of 0.009 PLN (4.105 - 4.096) per BRL transacted.<\/p><p><b>A is incorrect.<\/b> This option is not profitable. The dealer&#x27;s bid rate for USD is higher than the interbank market rate. Purchasing USD from the dealer would involve buying at a higher rate (4.105) and selling at a lower interbank rate (4.096), leading to a loss instead of a profit.<\/p><p><b>B is incorrect.<\/b> This option ignores the opportunity to capitalize on the arbitrage opportunity. Since there is a chance to buy USD at a lower rate in the interbank market and sell it to the dealer at a higher rate, declining the trade would mean missing out on a potential profit of 0.009 PLN per BRL transacted.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(b): Identify a triangular arbitrage opportunity and calculate its profit, given the bid–offer quotations for three currencies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Frank Paolini<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frank Paolini is an FX trading associate at Everyday FX Ltd (EFL). He works under the<\/p><p>mentorship and supervision of Marco Zampolini, CFA, the firm&#x27;s senior FX trader. Zampolini<\/p><p>mentions that an Australian corporate client is about to close a sale in Germany within the next<\/p><p>year. The client wants to hedge the sale against foreign exchange exposure and requested EFL<\/p><p>estimate the potential hedging cost. Paolini has been tasked with establishing the<\/p><p>discount/premium for a 180-day forward contract based on the exchange rate data presented in<\/p><p>Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0092.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit 1: Currency Data for EUR and AUD Spot (AUD/EUR) 1.666 180-day MRR EUR 4.76% 180-day MRR AUD 5.88%\"><p>Zamopolini suggests two trades that can be initiated to determine their profit potential.<\/p><p>Trade 1: A possible triangular arbitrage using the USD, Sterling Pound, and Polish Zloty. The<\/p><p>trade will be executed using a dealer’s bid/offer rate quote of 4.105/4.108 in PLN/USD and the<\/p><p>interbank spot rate quotes presented in Exhibit 2.<\/p><p>Trade 2: A carry trade involving the Swedish Krona and the USD. Zampolini expects a higher<\/p><p>return from the carry trade than from purchasing a one-year domestic note. This is mainly due to<\/p><p>low interest rates in the US. Paolini generates a one-year forecast and selected data from the<\/p><p>market to help with the carry trade presented in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0093.webp\" style=\"max-width:min(100%,520px)\" alt=\"Exhibit 2: Interbank Quotes Currency Pair Bid/Offer PLN/GBP 5.082/5.088 USD/GBP 1.242/1.250 Exhibit 3: Interest Rates and Spot Rates for Proposed Carry Trade Currency Today’s One-Year Today’s One-Year MRR pair (P/B) Spot Rate Projected Spot Rate JPY/SEK 14.062 14.056 SEK 0.72% USD/JPY 0.0064 0.0065 \"><p>Once done Paolini makes the following statements regarding purchasing power parity.<\/p><p>Statement 1: According to the theory and empirical evidence of purchasing power parity (PPP),<\/p><p>high-inflation countries should not see their currencies appreciate over time.<\/p><p>Statement 2: The absolute version of purchasing power parity (PPP) failure can be best explained<\/p><p>by the existence of trade barriers and the consumption of different product mixes across<\/p><p>countries.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the most accurate recommendation regarding trade 1 is to:<\/p><\/div>", "subj": "economics"}, {"n": 63, "q": "Using Exhibit 3, the all-in Swedish Krona return on trade 2 is closest to:", "opts": ["0.253%", "0.973%", "0.720%"], "ans": "A", "expl": "A carry trade strategy involves borrowing in a lower-yielding currency to invest in a higher-yielding one, aiming to net a profit after accounting for borrowing costs and exchange rate fluctuations. In this case, the trade involves borrowing SEK and lending in USD. To calculate the all-in SEK return from a one-year USD MRR deposit, one must first determine the current and projected SEK/USD exchange rates. Today, one SEK buys JPY 14.062, and one JPY buys USD 14.062 × 0.0064 = 0.08999. The projected rate one year later is 14.056 × 0.0065 = 0.09136. Therefore, when measured in dollars, the investment return for the unhedged USD MRR deposit is equal to However, the borrowing costs must be deducted from the gross return to finance the carry trade investment (with the one-year SEK MRR at 0.72%). As a result, the net return on the carry trade is 0.973% − 0.72% = 0.253% B is incorrect. This answer represents the gross return on the USD MRR deposit before accounting for the borrowing costs. While the gross return calculation is correct, it does not consider the borrowing costs associated with the carry trade. Therefore, it is not the all-in Swedish Krona return, as borrowing costs need to be deducted to arrive at the net return. C is incorrect. This answer represents the one-year SEK MRR, which is the borrowing cost for the carry trade. However, it does not account for the gross return earned from the USD MRR deposit. The all-in return must consider the gross and borrowing costs to provide an accurate net return.", "explhtml": "<p>A carry trade strategy involves borrowing in a lower-yielding currency to invest in a higher-yielding one, aiming to net a profit after accounting for borrowing costs and exchange rate fluctuations. In this case, the trade involves borrowing SEK and lending in USD. To calculate the all-in SEK return from a one-year USD MRR deposit, one must first determine the current and projected SEK/USD exchange rates. Today, one SEK buys JPY 14.062, and one JPY buys USD<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0098.webp\" style=\"max-width:min(100%,756px)\" alt=\"0.0064,  making  today&#x27;s  USD/SEK  rate  the  product  of  these  two  values: \"><p>14.062 × 0.0064 = 0.08999. The projected rate one year later is 14.056 × 0.0065 = 0.09136. Therefore, when measured in dollars, the investment return for the unhedged USD MRR deposit is equal to<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0099.webp\" style=\"max-width:min(100%,464px)\" alt=\"(14.062 × 0.0064) × (1 + 0.0251) × [ 1 ] −1 14.056 × 0.0065 0.08999 × (1.0251) × ( 1 ) −1 = 1.00973 −1 = 0.973% 0.09136\"><p>However, the borrowing costs must be deducted from the gross return to finance the carry trade investment (with the one-year SEK MRR at 0.72%). As a result, the net return on the carry trade is 0.973% − 0.72% = 0.253%<\/p><p><b>B is incorrect.<\/b> This answer represents the gross return on the USD MRR deposit before accounting for the borrowing costs. While the gross return calculation is correct, it does not consider the borrowing costs associated with the carry trade. Therefore, it is not the all-in Swedish Krona return, as borrowing costs need to be deducted to arrive at the net return.<\/p><p><b>C is incorrect.<\/b> This answer represents the one-year SEK MRR, which is the borrowing cost for the carry trade. However, it does not account for the gross return earned from the USD MRR deposit. The all-in return must consider the gross and borrowing costs to provide an accurate net return.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(h): Describe the carry trade and its relation to uncovered interest rate parity and calculate the profit from a carry trade<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Frank Paolini<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frank Paolini is an FX trading associate at Everyday FX Ltd (EFL). He works under the<\/p><p>mentorship and supervision of Marco Zampolini, CFA, the firm&#x27;s senior FX trader. Zampolini<\/p><p>mentions that an Australian corporate client is about to close a sale in Germany within the next<\/p><p>year. The client wants to hedge the sale against foreign exchange exposure and requested EFL<\/p><p>estimate the potential hedging cost. Paolini has been tasked with establishing the<\/p><p>discount/premium for a 180-day forward contract based on the exchange rate data presented in<\/p><p>Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0092.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit 1: Currency Data for EUR and AUD Spot (AUD/EUR) 1.666 180-day MRR EUR 4.76% 180-day MRR AUD 5.88%\"><p>Zamopolini suggests two trades that can be initiated to determine their profit potential.<\/p><p>Trade 1: A possible triangular arbitrage using the USD, Sterling Pound, and Polish Zloty. The<\/p><p>trade will be executed using a dealer’s bid/offer rate quote of 4.105/4.108 in PLN/USD and the<\/p><p>interbank spot rate quotes presented in Exhibit 2.<\/p><p>Trade 2: A carry trade involving the Swedish Krona and the USD. Zampolini expects a higher<\/p><p>return from the carry trade than from purchasing a one-year domestic note. This is mainly due to<\/p><p>low interest rates in the US. Paolini generates a one-year forecast and selected data from the<\/p><p>market to help with the carry trade presented in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0093.webp\" style=\"max-width:min(100%,520px)\" alt=\"Exhibit 2: Interbank Quotes Currency Pair Bid/Offer PLN/GBP 5.082/5.088 USD/GBP 1.242/1.250 Exhibit 3: Interest Rates and Spot Rates for Proposed Carry Trade Currency Today’s One-Year Today’s One-Year MRR pair (P/B) Spot Rate Projected Spot Rate JPY/SEK 14.062 14.056 SEK 0.72% USD/JPY 0.0064 0.0065 \"><p>Once done Paolini makes the following statements regarding purchasing power parity.<\/p><p>Statement 1: According to the theory and empirical evidence of purchasing power parity (PPP),<\/p><p>high-inflation countries should not see their currencies appreciate over time.<\/p><p>Statement 2: The absolute version of purchasing power parity (PPP) failure can be best explained<\/p><p>by the existence of trade barriers and the consumption of different product mixes across<\/p><p>countries.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 3, the all-in Swedish Krona return on trade 2 is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 64, "q": "Paolini is most likely correct regarding the statement:", "opts": ["Statement 1", "Statement 2", "Both Statements 1 and 2"], "ans": "C", "expl": "Both statements provided by Paolini are accurate reflections of the theory and empirical evidence surrounding PPP. High-inflation countries tend to see currency depreciation over time (Statement 1), and the absolute version of PPP fails due to trade barriers and differing product mixes across countries (Statement 2). Hence, Paolini is correct regarding both statements. A and B are incorrect. Both statements are correct.", "explhtml": "<p>Both statements provided by Paolini are accurate reflections of the theory and empirical evidence surrounding PPP. High-inflation countries tend to see currency depreciation over time (Statement 1), and the absolute version of PPP fails due to trade barriers and differing product mixes across countries (Statement 2). Hence, Paolini is correct regarding both statements.<\/p><p><b>A and B are incorrect.<\/b> Both statements are correct.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Frank Paolini<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frank Paolini is an FX trading associate at Everyday FX Ltd (EFL). He works under the<\/p><p>mentorship and supervision of Marco Zampolini, CFA, the firm&#x27;s senior FX trader. Zampolini<\/p><p>mentions that an Australian corporate client is about to close a sale in Germany within the next<\/p><p>year. The client wants to hedge the sale against foreign exchange exposure and requested EFL<\/p><p>estimate the potential hedging cost. Paolini has been tasked with establishing the<\/p><p>discount/premium for a 180-day forward contract based on the exchange rate data presented in<\/p><p>Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0092.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit 1: Currency Data for EUR and AUD Spot (AUD/EUR) 1.666 180-day MRR EUR 4.76% 180-day MRR AUD 5.88%\"><p>Zamopolini suggests two trades that can be initiated to determine their profit potential.<\/p><p>Trade 1: A possible triangular arbitrage using the USD, Sterling Pound, and Polish Zloty. The<\/p><p>trade will be executed using a dealer’s bid/offer rate quote of 4.105/4.108 in PLN/USD and the<\/p><p>interbank spot rate quotes presented in Exhibit 2.<\/p><p>Trade 2: A carry trade involving the Swedish Krona and the USD. Zampolini expects a higher<\/p><p>return from the carry trade than from purchasing a one-year domestic note. This is mainly due to<\/p><p>low interest rates in the US. Paolini generates a one-year forecast and selected data from the<\/p><p>market to help with the carry trade presented in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0093.webp\" style=\"max-width:min(100%,520px)\" alt=\"Exhibit 2: Interbank Quotes Currency Pair Bid/Offer PLN/GBP 5.082/5.088 USD/GBP 1.242/1.250 Exhibit 3: Interest Rates and Spot Rates for Proposed Carry Trade Currency Today’s One-Year Today’s One-Year MRR pair (P/B) Spot Rate Projected Spot Rate JPY/SEK 14.062 14.056 SEK 0.72% USD/JPY 0.0064 0.0065 \"><p>Once done Paolini makes the following statements regarding purchasing power parity.<\/p><p>Statement 1: According to the theory and empirical evidence of purchasing power parity (PPP),<\/p><p>high-inflation countries should not see their currencies appreciate over time.<\/p><p>Statement 2: The absolute version of purchasing power parity (PPP) failure can be best explained<\/p><p>by the existence of trade barriers and the consumption of different product mixes across<\/p><p>countries.<\/p><\/div><\/details><div class=\"qtext\"><p>Paolini is most likely correct regarding the statement:<\/p><\/div>", "subj": "economics"}, {"n": 65, "q": "Based on the quotes presented in Exhibit 1, the amount Dubois received after converting SEK 365,000,000 is closest to?", "opts": ["AUD 53,284,672", "AUD 53,129,549", "AUD 52,975,327"], "ans": "C", "expl": "A is incorrect. Uses the bid rate instead of the offer price. B is incorrect. Uses the midpoint instead of the offer price.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0101.webp\" style=\"max-width:min(100%,286px)\" alt=\"SEK 365, 000, 000 = AUD 52, 975, 327 6.89 SEK/AUD\"><p><b>A is incorrect.<\/b> Uses the bid rate instead of the offer price.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0102.webp\" style=\"max-width:min(100%,285px)\" alt=\"SEK 365, 000, 000 = AUD 53, 284, 672 6.85 SEK/AUD\"><p><b>B is incorrect.<\/b> Uses the midpoint instead of the offer price.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0103.webp\" style=\"max-width:min(100%,286px)\" alt=\"SEK 365, 000, 000 = AUD 53, 129, 549 6.87 SEK/AUD\"><p class=\"los\">Economics, Learning Module1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(b): Identify a triangular arbitrage opportunity and calculate its profit, given the bid–offer quotations for three currencies<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Marie Dubois<\/summary><div class=\"vig-body\"><p>Marie Dubois is the finance manager at Kenston Chemicals Ltd (KCL), a chemical manufacturer<\/p><p>based in Germany. Her responsibilities include currency and commodity market risk<\/p><p>management. Dubois is creating her quarterly reports and settling transactions. Micheal Dupont,<\/p><p>a junior analyst at the firm, assists with reports and transactions. KCL uses forward contracts to<\/p><p>hedge input costs priced in BRL and GBP.<\/p><p>Products are packaged for sale through licensing deals with companies in international markets.<\/p><p>Dubois anticipates receiving a customer payment of SEK 365,000,000 (Swedish Krona), which<\/p><p>she plans to convert to Australian Dollars (AUD). Dupont collects the exchange rates from Dealer<\/p><p>Z in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0100.webp\" style=\"max-width:min(100%,365px)\" alt=\"Exhibit 1: Spot Exchange Rates from Dealer Z Currency Pair Bid Offer Midpoint SEK/AUD 6.85 6.89 6.87 BRL/GBP 7.22 7.26 7.24 AUD/USD 1.60 1.64 1.62 GBP/USD 0.80 0.86 0.83 GBP/EUR 0.83 0.88 0.855\"><p>The firm needs to acquire USD to pay a major supplier. Dubois contacts Dealer Z, providing<\/p><p>specific transaction details and requesting verification of the GBP/EUR quote. Dealer Z later<\/p><p>responds with an updated GBP/EUR bid-offer quote of 0.821/0.891.<\/p><p>Dubois needs to buy BRL 62,250,000 to settle an invoice at the end of the quarter. In addition to<\/p><p>quotes from Dealer Z, Dupont reaches out to Dealer X, who supplies a bid-offer price of EUR/BRL<\/p><p>0.1672/0.1681. To determine if the dealer quotes reflect an efficient market, Dupont assesses<\/p><p>whether the prices permit an arbitrage profit.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the quotes presented in Exhibit 1, the amount Dubois received after converting SEK 365,000,000 is closest to?<\/p><\/div>", "subj": "economics"}, {"n": 66, "q": "Based on Exhibit 1, the most likely reason why the dealer revised the GBP/EUR quote of 0.821/0.891.", "opts": ["The dealer received a request for a larger transaction.", "The dealer received a request to trade when the Frankfurt and London trading center are both open.", "An increase in volatility in the US market."], "ans": "A", "expl": "A larger transaction size often results in less favorable quotes due to the higher risk and potential market impact. When a dealer receives a request for a significant amount, they may widen the bid-offer spread to account for this increased risk. In the exhibit, the original GBP/EUR quote was 0.83/0.88. After the request for a specific transaction, the dealer revises the quote to 0.821/0.891, widening the spread. This change suggests that the transaction size is likely larger, necessitating this adjustment to manage the dealer's risk. B is incorrect. Trading hours of major financial centers like Frankfurt and London overlapping typically lead to narrower spreads due to higher liquidity and market activity. If this were the case, we would expect the spread to narrow or remain stable, not widen as shown in the revised quote. C is incorrect. Changes in volatility in the US market are unlikely to directly affect the GBP/EUR quote. The GBP/EUR exchange rate is primarily influenced by factors affecting the British pound and the euro. Increased volatility in the US market might affect USD-related pairs, but it wouldn't specifically cause a significant change in the GBP/EUR spread as seen here.", "explhtml": "<p>A larger transaction size often results in less favorable quotes due to the higher risk and potential market impact. When a dealer receives a request for a significant amount, they may widen the bid-offer spread to account for this increased risk. In the exhibit, the original GBP/EUR quote was 0.83/0.88. After the request for a specific transaction, the dealer revises the quote to 0.821/0.891, widening the spread. This change suggests that the transaction size is likely larger, necessitating this adjustment to manage the dealer&#x27;s risk.<\/p><p><b>B is incorrect.<\/b> Trading hours of major financial centers like Frankfurt and London overlapping typically lead to narrower spreads due to higher liquidity and market activity. If this were the case, we would expect the spread to narrow or remain stable, not widen as shown in the revised quote.<\/p><p><b>C is incorrect.<\/b> Changes in volatility in the US market are unlikely to directly affect the GBP/EUR quote. The GBP/EUR exchange rate is primarily influenced by factors affecting the British pound and the euro. Increased volatility in the US market might affect USD-related pairs, but it wouldn&#x27;t specifically cause a significant change in the GBP/EUR spread as seen here.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(b): Identify a triangular arbitrage opportunity and calculate its profit, given the bid–offer quotations for three currencies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Marie Dubois<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie Dubois is the finance manager at Kenston Chemicals Ltd (KCL), a chemical manufacturer<\/p><p>based in Germany. Her responsibilities include currency and commodity market risk<\/p><p>management. Dubois is creating her quarterly reports and settling transactions. Micheal Dupont,<\/p><p>a junior analyst at the firm, assists with reports and transactions. KCL uses forward contracts to<\/p><p>hedge input costs priced in BRL and GBP.<\/p><p>Products are packaged for sale through licensing deals with companies in international markets.<\/p><p>Dubois anticipates receiving a customer payment of SEK 365,000,000 (Swedish Krona), which<\/p><p>she plans to convert to Australian Dollars (AUD). Dupont collects the exchange rates from Dealer<\/p><p>Z in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0100.webp\" style=\"max-width:min(100%,365px)\" alt=\"Exhibit 1: Spot Exchange Rates from Dealer Z Currency Pair Bid Offer Midpoint SEK/AUD 6.85 6.89 6.87 BRL/GBP 7.22 7.26 7.24 AUD/USD 1.60 1.64 1.62 GBP/USD 0.80 0.86 0.83 GBP/EUR 0.83 0.88 0.855\"><p>The firm needs to acquire USD to pay a major supplier. Dubois contacts Dealer Z, providing<\/p><p>specific transaction details and requesting verification of the GBP/EUR quote. Dealer Z later<\/p><p>responds with an updated GBP/EUR bid-offer quote of 0.821/0.891.<\/p><p>Dubois needs to buy BRL 62,250,000 to settle an invoice at the end of the quarter. In addition to<\/p><p>quotes from Dealer Z, Dupont reaches out to Dealer X, who supplies a bid-offer price of EUR/BRL<\/p><p>0.1672/0.1681. To determine if the dealer quotes reflect an efficient market, Dupont assesses<\/p><p>whether the prices permit an arbitrage profit.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the most likely reason why the dealer revised the GBP/EUR quote of 0.821/0.891.<\/p><\/div>", "subj": "economics"}, {"n": 67, "q": "Based on the quotes provided by Dealer Z and Dealer X, the approximate triangular arbitrage profit from a transaction involving BRL 62,250,000 would be:", "opts": ["EUR 0", "EUR 18,675", "EUR 647,400"], "ans": "B", "expl": "Using Dealer Z’s Quote Dealer Z’s bid Dealer Z’s offer To compare with Dealer X's quote, she must use the inverse of BRL/EUR, which gives her an Dealer Z at EUR 0.1565 (compared to EUR 0.1681 from Dealer X) and resell them to Dealer X at EUR 0.1672. This results in a profit of EUR 0.0003 from triangular arbitrage (0.1672 − 0.1669). The arbitrage profit per unit would be: 0.1672 − 0.1669 = EUR 0.0003. The arbitrage profit for BRL 62,250,000 would be: 0.0003 × 62, 250,000 = EUR 18,675. A is incorrect. If there were no opportunity for triangular arbitrage profit, the difference between the buying and selling rates would be zero. However, by analyzing the quotes provided by Dealers Z and X, we can see there is a clear profit to be made by exploiting the discrepancies in their rates. C is incorrect. It incorrectly calculates the arbitrage profit as follows: This results in a profit of EUR 0.0104 from triangular arbitrage (0.1669 − 0.1565). The arbitrage profit for BRL 62,250,000 would be: 0.0104 × 62, 250,000 = EUR 647, 400.", "explhtml": "<p>Using Dealer Z’s Quote<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0104.webp\" style=\"max-width:min(100%,169px)\" alt=\"BRL BRL GBP EUR = GBP × EUR\"><p>Dealer Z’s bid<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0105.webp\" style=\"max-width:min(100%,231px)\" alt=\"BRL = 7.22 × 0.83 = 5.9926 EUR\"><p>Dealer Z’s offer<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0106.webp\" style=\"max-width:min(100%,231px)\" alt=\"BRL = 7.26 × 0.88 = 6.3888 EUR\"><p>To compare with Dealer X&#x27;s quote, she must use the inverse of BRL/EUR, which gives her an<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0107.webp\" style=\"max-width:min(100%,757px)\" alt=\"offer to sell BRL at a rate of  6.3888 1 = EUR 0.1565 . Dealer Z effectively quotes  5.9926 1 = EUR 0.1669 EUR BRL  at   and a bid to buy BRL at a rate of  0.1669 0.1565 . She can buy BRL more cheaply from\"><p>Dealer Z at EUR 0.1565 (compared to EUR 0.1681 from Dealer X) and resell them to Dealer X at EUR 0.1672. This results in a profit of EUR 0.0003 from triangular arbitrage (0.1672 − 0.1669).<\/p><p>The arbitrage profit per unit would be: 0.1672 − 0.1669 = EUR 0.0003.<\/p><p>The arbitrage profit for BRL 62,250,000 would be: 0.0003 × 62, 250,000 = EUR 18,675.<\/p><p><b>A is incorrect.<\/b> If there were no opportunity for triangular arbitrage profit, the difference between the buying and selling rates would be zero. However, by analyzing the quotes provided by Dealers Z and X, we can see there is a clear profit to be made by exploiting the discrepancies in their rates.<\/p><p><b>C is incorrect.<\/b> It incorrectly calculates the arbitrage profit as follows:<\/p><p>This results in a profit of EUR 0.0104 from triangular arbitrage (0.1669 − 0.1565).<\/p><p>The arbitrage profit for BRL 62,250,000 would be: 0.0104 × 62, 250,000 = EUR 647, 400.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(b): Identify a triangular arbitrage opportunity and calculate its profit, given the bid–offer quotations for three currencies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Marie Dubois<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie Dubois is the finance manager at Kenston Chemicals Ltd (KCL), a chemical manufacturer<\/p><p>based in Germany. Her responsibilities include currency and commodity market risk<\/p><p>management. Dubois is creating her quarterly reports and settling transactions. Micheal Dupont,<\/p><p>a junior analyst at the firm, assists with reports and transactions. KCL uses forward contracts to<\/p><p>hedge input costs priced in BRL and GBP.<\/p><p>Products are packaged for sale through licensing deals with companies in international markets.<\/p><p>Dubois anticipates receiving a customer payment of SEK 365,000,000 (Swedish Krona), which<\/p><p>she plans to convert to Australian Dollars (AUD). Dupont collects the exchange rates from Dealer<\/p><p>Z in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0100.webp\" style=\"max-width:min(100%,365px)\" alt=\"Exhibit 1: Spot Exchange Rates from Dealer Z Currency Pair Bid Offer Midpoint SEK/AUD 6.85 6.89 6.87 BRL/GBP 7.22 7.26 7.24 AUD/USD 1.60 1.64 1.62 GBP/USD 0.80 0.86 0.83 GBP/EUR 0.83 0.88 0.855\"><p>The firm needs to acquire USD to pay a major supplier. Dubois contacts Dealer Z, providing<\/p><p>specific transaction details and requesting verification of the GBP/EUR quote. Dealer Z later<\/p><p>responds with an updated GBP/EUR bid-offer quote of 0.821/0.891.<\/p><p>Dubois needs to buy BRL 62,250,000 to settle an invoice at the end of the quarter. In addition to<\/p><p>quotes from Dealer Z, Dupont reaches out to Dealer X, who supplies a bid-offer price of EUR/BRL<\/p><p>0.1672/0.1681. To determine if the dealer quotes reflect an efficient market, Dupont assesses<\/p><p>whether the prices permit an arbitrage profit.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the quotes provided by Dealer Z and Dealer X, the approximate triangular arbitrage profit from a transaction involving BRL 62,250,000 would be:<\/p><\/div>", "subj": "economics"}, {"n": 68, "q": "The international parity condition in conjunction with the 90day MRR, that Dubois will most likely use to estimate the future SEK/AUD spot rate is:", "opts": ["Absolute purchasing power parity.", "Covered interest rate parity.", "Uncovered interest rate parity."], "ans": "C", "expl": "Uncovered interest rate parity (UIP) is a theory stating that the difference in interest rates between two countries is equal to the expected change in exchange rates between the countries' currencies. Dubois will likely use UIP in conjunction with the 90-day money market rate (MRR) to estimate the future SEK/AUD spot rate. This approach allows Dubois to predict the future exchange rate by considering the interest rate differential between Sweden (SEK) and Australia (AUD). A is incorrect. Absolute purchasing power parity (PPP) states that in the absence of transportation costs and trade barriers, identical goods should sell for the same price in different countries when expressed in a common currency. While PPP can be useful for long-term exchange rate predictions, it is not typically used for short-term estimates like those involving a 90-day MRR. Therefore, PPP is not the most appropriate tool for Dubois to use in this context. B is incorrect. Covered interest rate parity (CIP) involves using forward contracts to hedge against exchange rate risk and ensures that arbitrage opportunities do not exist in the foreign exchange market. Since Dubois is looking to estimate the future spot rate of SEK/AUD without using forward contracts or other hedging instruments, CIP is not the appropriate condition to use. Instead, UIP is the relevant parity condition for estimating future exchange rates based on interest rate differentials.", "explhtml": "<p>Uncovered interest rate parity (UIP) is a theory stating that the difference in interest rates between two countries is equal to the expected change in exchange rates between the countries&#x27; currencies. Dubois will likely use UIP in conjunction with the 90-day money market rate (MRR) to estimate the future SEK/AUD spot rate. This approach allows Dubois to predict the future exchange rate by considering the interest rate differential between Sweden (SEK) and Australia (AUD).<\/p><p><b>A is incorrect.<\/b> Absolute purchasing power parity (PPP) states that in the absence of transportation costs and trade barriers, identical goods should sell for the same price in different countries when expressed in a common currency. While PPP can be useful for long-term exchange rate predictions, it is not typically used for short-term estimates like those involving a 90-day MRR. Therefore, PPP is not the most appropriate tool for Dubois to use in this context.<\/p><p><b>B is incorrect.<\/b> Covered interest rate parity (CIP) involves using forward contracts to hedge against exchange rate risk and ensures that arbitrage opportunities do not exist in the foreign exchange market. Since Dubois is looking to estimate the future spot rate of SEK/AUD without using forward contracts or other hedging instruments, CIP is not the appropriate condition to use. Instead, UIP is the relevant parity condition for estimating future exchange rates based on interest rate differentials.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Marie Dubois<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie Dubois is the finance manager at Kenston Chemicals Ltd (KCL), a chemical manufacturer<\/p><p>based in Germany. Her responsibilities include currency and commodity market risk<\/p><p>management. Dubois is creating her quarterly reports and settling transactions. Micheal Dupont,<\/p><p>a junior analyst at the firm, assists with reports and transactions. KCL uses forward contracts to<\/p><p>hedge input costs priced in BRL and GBP.<\/p><p>Products are packaged for sale through licensing deals with companies in international markets.<\/p><p>Dubois anticipates receiving a customer payment of SEK 365,000,000 (Swedish Krona), which<\/p><p>she plans to convert to Australian Dollars (AUD). Dupont collects the exchange rates from Dealer<\/p><p>Z in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0100.webp\" style=\"max-width:min(100%,365px)\" alt=\"Exhibit 1: Spot Exchange Rates from Dealer Z Currency Pair Bid Offer Midpoint SEK/AUD 6.85 6.89 6.87 BRL/GBP 7.22 7.26 7.24 AUD/USD 1.60 1.64 1.62 GBP/USD 0.80 0.86 0.83 GBP/EUR 0.83 0.88 0.855\"><p>The firm needs to acquire USD to pay a major supplier. Dubois contacts Dealer Z, providing<\/p><p>specific transaction details and requesting verification of the GBP/EUR quote. Dealer Z later<\/p><p>responds with an updated GBP/EUR bid-offer quote of 0.821/0.891.<\/p><p>Dubois needs to buy BRL 62,250,000 to settle an invoice at the end of the quarter. In addition to<\/p><p>quotes from Dealer Z, Dupont reaches out to Dealer X, who supplies a bid-offer price of EUR/BRL<\/p><p>0.1672/0.1681. To determine if the dealer quotes reflect an efficient market, Dupont assesses<\/p><p>whether the prices permit an arbitrage profit.<\/p><\/div><\/details><div class=\"qtext\"><p>The international parity condition in conjunction with the 90day MRR, that Dubois will most likely use to estimate the future SEK/AUD spot rate is:<\/p><\/div>", "subj": "economics"}, {"n": 69, "q": "Using Exhibit 1county factor information, the least developed country is:", "opts": ["X", "Y", "Z"], "ans": "C", "expl": "Country Z is the least developed country due to the following reasons: Low literacy levels: Education is a crucial factor in economic development, and low literacy rates indicate a lack of skilled labour, hindering economic growth. Poor health care impacts labour productivity and overall quality of life, further limiting the country's development. Political instability: Political instability creates an uncertain environment for investment and economic activities, which can deter growth. A is incorrect. Despite not having natural resources, Country X has high investment and savings levels, low import tariffs, and high education levels. These factors contribute to strong economic development, making it a more developed country than Z. B is incorrect. Country Y has numerous natural resources, moderate savings and investment levels, and developed financial markets. These factors support economic growth, making it more developed than Z despite its lower GDP growth rate.", "explhtml": "<p>Country Z is the least developed country due to the following reasons:<\/p><p><b>Low literacy levels:<\/b> Education is a crucial factor in economic development, and low literacy rates indicate a lack of skilled labour, hindering economic growth.<\/p><p>Poor health care impacts labour productivity and overall quality of life, further limiting the country&#x27;s development.<\/p><p><b>Political instability:<\/b> Political instability creates an uncertain environment for investment and economic activities, which can deter growth.<\/p><p><b>A is incorrect.<\/b> Despite not having natural resources, Country X has high investment and savings levels, low import tariffs, and high education levels. These factors contribute to strong economic development, making it a more developed country than Z.<\/p><p><b>B is incorrect.<\/b> Country Y has numerous natural resources, moderate savings and investment levels, and developed financial markets. These factors support economic growth, making it more developed than Z despite its lower GDP growth rate.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (a): Compare factors favoring and limiting economic growth in developed and developing economies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Michele Kowalski<\/summary><div class=\"vig-body\"><p>Michele Kowalski, the CFO at Johnson Consulting (JC), is reviewing three countries and their<\/p><p>GDP growth. With the help of her associate Candice Daniels, Kowalski forecasts the long-term<\/p><p>stock market value change for the three countries. The results of the forecast are presented in<\/p><p>Exhibit 1.<\/p><p>Exhibit 1: Select Historical Economic and Country Factor Information 2013-2023<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0108.webp\" style=\"max-width:min(100%,666px)\" alt=\"Country GDP Labor TFP Growth Country Growth Productivity Growth in work Factors Growth hours X 4.3% 3.3% 1.02% 1.2% ∙No natural resources. ∙High investment and savings level. ∙Low import tariffs. ∙High education levels. Y 2.5% 2.1% 1.4% −0.5% ∙Has numerous natural resources. ∙Moderate savings and in\"><p>Kowalski makes the following statements regarding the forecasted change in stock market<\/p><p>values in countries X, Y, and Z.<\/p><p>Statement 1: “In the short term, factors such as the capital deepening, percentage changes in<\/p><p>GDP, and the P/E ratio play significant roles in describing the relationship between economic<\/p><p>growth and stock prices. Nevertheless, my focus is on long-term stock market forecasting.&quot;<\/p><p>Kowalski is evaluating the company’s long-term growth strategy. In a discussion with her<\/p><p>associate Daniels, she contrasts two approaches: one that focuses solely on boosting capital<\/p><p>investment and another that integrates technological innovation alongside increased capital.<\/p><p>After considering industry trends and growth theory, she concludes:<\/p><p>Statement 2: “If we rely only on ramping up capital investment, we risk running into diminishing<\/p><p>returns. For Johnson Consulting to sustain growth over the long term, we must also invest in<\/p><p>technology to continuously enhance productivity.”<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1county factor information, the least developed country is:<\/p><\/div>", "subj": "economics"}, {"n": 70, "q": "Based on Exhibit 1, technology as a growth source is most relevant.", "opts": ["Country X", "Country Y", "Country Z"], "ans": "A", "expl": "Country X is the most relevant to technology as a growth source due to the following reasons: High labour productivity growth (3.3%) indicates that technological advancements significantly improve labour efficiency. Total Factor Productivity (TFP) growth (1.02%): TFP growth measures how efficiently and intensely inputs are utilised in production, often reflecting technological progress. High education levels: A well-educated workforce is more likely to adopt and innovate with new technologies. B is incorrect. Despite having developed financial markets and numerous natural resources, Country Y's labour productivity growth (2.1%) and TFP growth (1.4%) are lower than Country X's, indicating that technology is less of a growth driver. C is incorrect. Country Z has negative TFP growth (-0.7%) and relatively low labour productivity growth (1.2%), suggesting that technological advancements are not significantly contributing to its economic growth. Low literacy levels and poor health care also limit the potential for technology-driven growth.", "explhtml": "<p>Country X is the most relevant to technology as a growth source due to the following reasons:<\/p><p>High labour productivity growth (3.3%) indicates that technological advancements significantly improve labour efficiency. Total Factor Productivity (TFP) growth (1.02%): TFP growth measures how efficiently and intensely inputs are utilised in production, often reflecting technological progress. High education levels: A well-educated workforce is more likely to adopt and innovate with new technologies.<\/p><p><b>B is incorrect.<\/b> Despite having developed financial markets and numerous natural resources, Country Y&#x27;s labour productivity growth (2.1%) and TFP growth (1.4%) are lower than Country X&#x27;s, indicating that technology is less of a growth driver.<\/p><p><b>C is incorrect.<\/b> Country Z has negative TFP growth (-0.7%) and relatively low labour productivity growth (1.2%), suggesting that technological advancements are not significantly contributing to its economic growth. Low literacy levels and poor health care also limit the potential for technology-driven growth.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Michele Kowalski<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michele Kowalski, the CFO at Johnson Consulting (JC), is reviewing three countries and their<\/p><p>GDP growth. With the help of her associate Candice Daniels, Kowalski forecasts the long-term<\/p><p>stock market value change for the three countries. The results of the forecast are presented in<\/p><p>Exhibit 1.<\/p><p>Exhibit 1: Select Historical Economic and Country Factor Information 2013-2023<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0108.webp\" style=\"max-width:min(100%,666px)\" alt=\"Country GDP Labor TFP Growth Country Growth Productivity Growth in work Factors Growth hours X 4.3% 3.3% 1.02% 1.2% ∙No natural resources. ∙High investment and savings level. ∙Low import tariffs. ∙High education levels. Y 2.5% 2.1% 1.4% −0.5% ∙Has numerous natural resources. ∙Moderate savings and in\"><p>Kowalski makes the following statements regarding the forecasted change in stock market<\/p><p>values in countries X, Y, and Z.<\/p><p>Statement 1: “In the short term, factors such as the capital deepening, percentage changes in<\/p><p>GDP, and the P/E ratio play significant roles in describing the relationship between economic<\/p><p>growth and stock prices. Nevertheless, my focus is on long-term stock market forecasting.&quot;<\/p><p>Kowalski is evaluating the company’s long-term growth strategy. In a discussion with her<\/p><p>associate Daniels, she contrasts two approaches: one that focuses solely on boosting capital<\/p><p>investment and another that integrates technological innovation alongside increased capital.<\/p><p>After considering industry trends and growth theory, she concludes:<\/p><p>Statement 2: “If we rely only on ramping up capital investment, we risk running into diminishing<\/p><p>returns. For Johnson Consulting to sustain growth over the long term, we must also invest in<\/p><p>technology to continuously enhance productivity.”<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, technology as a growth source is most relevant.<\/p><\/div>", "subj": "economics"}, {"n": 71, "q": "According to Statement 1, within the specified forecast period, the primary driver of stock market performance will least likely be the percentage change.", "opts": ["GDP", "Capital deepening", "P/E ratio"], "ans": "B", "expl": "Capital deepening refers to increased capital per worker and is more significant for long-term growth than short-term stock market performance. It involves investments in infrastructure, machinery, and technology that enhance productivity over an extended period. A is incorrect. Investors closely monitor percentage changes in GDP as they directly reflect a country's economic health and growth, which can immediately affect stock prices. C is incorrect. The price-to-earnings (P/E) ratio is a critical metric investors use to assess the relative valuation of stocks. It is highly relevant in the short term as it influences investment decisions and market sentiment.", "explhtml": "<p>Capital deepening refers to increased capital per worker and is more significant for long-term growth than short-term stock market performance. It involves investments in infrastructure, machinery, and technology that enhance productivity over an extended period.<\/p><p><b>A is incorrect.<\/b> Investors closely monitor percentage changes in GDP as they directly reflect a country&#x27;s economic health and growth, which can immediately affect stock prices.<\/p><p><b>C is incorrect.<\/b> The price-to-earnings (P/E) ratio is a critical metric investors use to assess the relative valuation of stocks. It is highly relevant in the short term as it influences investment decisions and market sentiment.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Michele Kowalski<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michele Kowalski, the CFO at Johnson Consulting (JC), is reviewing three countries and their<\/p><p>GDP growth. With the help of her associate Candice Daniels, Kowalski forecasts the long-term<\/p><p>stock market value change for the three countries. The results of the forecast are presented in<\/p><p>Exhibit 1.<\/p><p>Exhibit 1: Select Historical Economic and Country Factor Information 2013-2023<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0108.webp\" style=\"max-width:min(100%,666px)\" alt=\"Country GDP Labor TFP Growth Country Growth Productivity Growth in work Factors Growth hours X 4.3% 3.3% 1.02% 1.2% ∙No natural resources. ∙High investment and savings level. ∙Low import tariffs. ∙High education levels. Y 2.5% 2.1% 1.4% −0.5% ∙Has numerous natural resources. ∙Moderate savings and in\"><p>Kowalski makes the following statements regarding the forecasted change in stock market<\/p><p>values in countries X, Y, and Z.<\/p><p>Statement 1: “In the short term, factors such as the capital deepening, percentage changes in<\/p><p>GDP, and the P/E ratio play significant roles in describing the relationship between economic<\/p><p>growth and stock prices. Nevertheless, my focus is on long-term stock market forecasting.&quot;<\/p><p>Kowalski is evaluating the company’s long-term growth strategy. In a discussion with her<\/p><p>associate Daniels, she contrasts two approaches: one that focuses solely on boosting capital<\/p><p>investment and another that integrates technological innovation alongside increased capital.<\/p><p>After considering industry trends and growth theory, she concludes:<\/p><p>Statement 2: “If we rely only on ramping up capital investment, we risk running into diminishing<\/p><p>returns. For Johnson Consulting to sustain growth over the long term, we must also invest in<\/p><p>technology to continuously enhance productivity.”<\/p><\/div><\/details><div class=\"qtext\"><p>According to Statement 1, within the specified forecast period, the primary driver of stock market performance will least likely be the percentage change.<\/p><\/div>", "subj": "economics"}, {"n": 72, "q": "The approach described in Statement 2 is best characterized by:", "opts": ["Pure capital accumulation", "A balanced growth strategy", "Technology-driven growth"], "ans": "B", "expl": "A balanced growth strategy recognizes that while increasing the capital-to-labor ratio (capital deepening) can boost output, its effectiveness diminishes over time due to diminishing marginal returns. Therefore, sustainable long-term growth requires coupling additional capital with investments in technological innovation. This balanced approach ensures that the company not only adds more capital but also improves efficiency and productivity. A is incorrect. Relying exclusively on capital accumulation will eventually yield only marginal gains. C is incorrect. It overlooks the benefits derived from increased capital investment.", "explhtml": "<p>A balanced growth strategy recognizes that while increasing the capital-to-labor ratio (capital deepening) can boost output, its effectiveness diminishes over time due to diminishing marginal returns. Therefore, sustainable long-term growth requires coupling additional capital with investments in technological innovation. This balanced approach ensures that the company not only adds more capital but also improves efficiency and productivity.<\/p><p><b>A is incorrect.<\/b> Relying exclusively on capital accumulation will eventually yield only marginal gains.<\/p><p><b>C is incorrect.<\/b> It overlooks the benefits derived from increased capital investment.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (j): Explain and evaluate convergence hypotheses<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Michele Kowalski<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michele Kowalski, the CFO at Johnson Consulting (JC), is reviewing three countries and their<\/p><p>GDP growth. With the help of her associate Candice Daniels, Kowalski forecasts the long-term<\/p><p>stock market value change for the three countries. The results of the forecast are presented in<\/p><p>Exhibit 1.<\/p><p>Exhibit 1: Select Historical Economic and Country Factor Information 2013-2023<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0108.webp\" style=\"max-width:min(100%,666px)\" alt=\"Country GDP Labor TFP Growth Country Growth Productivity Growth in work Factors Growth hours X 4.3% 3.3% 1.02% 1.2% ∙No natural resources. ∙High investment and savings level. ∙Low import tariffs. ∙High education levels. Y 2.5% 2.1% 1.4% −0.5% ∙Has numerous natural resources. ∙Moderate savings and in\"><p>Kowalski makes the following statements regarding the forecasted change in stock market<\/p><p>values in countries X, Y, and Z.<\/p><p>Statement 1: “In the short term, factors such as the capital deepening, percentage changes in<\/p><p>GDP, and the P/E ratio play significant roles in describing the relationship between economic<\/p><p>growth and stock prices. Nevertheless, my focus is on long-term stock market forecasting.&quot;<\/p><p>Kowalski is evaluating the company’s long-term growth strategy. In a discussion with her<\/p><p>associate Daniels, she contrasts two approaches: one that focuses solely on boosting capital<\/p><p>investment and another that integrates technological innovation alongside increased capital.<\/p><p>After considering industry trends and growth theory, she concludes:<\/p><p>Statement 2: “If we rely only on ramping up capital investment, we risk running into diminishing<\/p><p>returns. For Johnson Consulting to sustain growth over the long term, we must also invest in<\/p><p>technology to continuously enhance productivity.”<\/p><\/div><\/details><div class=\"qtext\"><p>The approach described in Statement 2 is best characterized by:<\/p><\/div>", "subj": "economics"}, {"n": 73, "q": "Why is Country X’s capital deepening unlikely to boost productivity?", "opts": ["Diminishing returns to capital", "High TFP growth offsets capital gains", "Labor force growth exceeds capital accumulation"], "ans": "A", "expl": "Country X operates at a high capital-to-labor ratio (Exhibit 1), where additional capital faces diminishing marginal returns. Capital deepening (moving along the production function) yields minimal productivity gains. Diminishing returns limit growth from capital deepening in developed economies. B is incorrect. TFP growth is stagnant, per the report. C is incorrect. Labor force growth is not mentioned as a factor here.", "explhtml": "<p>Country X operates at a high capital-to-labor ratio (Exhibit 1), where additional capital faces diminishing marginal returns. Capital deepening (moving along the production function) yields minimal productivity gains. Diminishing returns limit growth from capital deepening in developed economies.<\/p><p><b>B is incorrect.<\/b> TFP growth is stagnant, per the report.<\/p><p><b>C is incorrect.<\/b> Labor force growth is not mentioned as a factor here.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Alex Morgan<\/summary><div class=\"vig-body\"><p>Alex Morgan, CFO of Global Growth Investments, is assessing economic growth prospects for<\/p><p>four countries to allocate a $500 million fund. Jamie Lee, an investment analyst, assists him.<\/p><p>Their discussion focuses on key growth drivers outlined in internal reports.<\/p><p>Morgan reviews Country X, a developed economy with high capital per worker. The report<\/p><p>highlights stagnant TFP growth but notes significant ICT investments. Lee points to Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0109.webp\" style=\"max-width:min(100%,512px)\" alt=\"Exhibit 1: Capital Deepening vs. Technological Progress Country Capital-to-Labour Ratio Total Factor Productivity (TFP) Growth Country X High Stagnant Country Y Moderate Weak Country Z Low Low Country W Moderate High\"><p>Showing Country X’s position at a high capital-to-labor ratio. Morgan asks, “Why hasn’t recent<\/p><p>capital investment boosted productivity?”<\/p><p>Next, they analyze Country Y, rich in oil reserves but with GDP growth below its peers. The<\/p><p>report cites weak institutions and a declining manufacturing sector. Lee mentions the “resource<\/p><p>curse” and notes that Country Y’s currency has appreciated due to oil exports. Morgan questions<\/p><p>the primary cause of its sluggish growth.<\/p><p>Country Z, a developing nation, has a young population and rising labor force participation.<\/p><p>Projections indicate that the working-age population is expected to grow by 2% annually, but<\/p><p>educational levels are lagging behind. Lee suggests this demographic could accelerate growth.<\/p><p>Morgan asks how these factors affect potential GDP.<\/p><p>Finally, they evaluate Country W, which recently liberalized trade and attracted FDI. The report<\/p><p>shows FDI surged from $1B to $15B in five years, funding infrastructure and technology. Morgan<\/p><p>wonders how this impacts long-term growth under endogenous growth theory.<\/p><\/div><\/details><div class=\"qtext\"><p>Why is Country X’s capital deepening unlikely to boost productivity?<\/p><\/div>", "subj": "economics"}, {"n": 74, "q": "Which factor is least likely to explain Country Y’s slow growth?", "opts": ["Dutch disease from oil exports", "Weak property rights enforcement", "High investment in human capital"], "ans": "C", "expl": "Country Y’s sluggish growth is tied to resource curse dynamics (e.g., Dutch disease, weak institutions). High human capital investment would support growth, but the report notes poor education/health systems. A is incorrect. Currency appreciation harming manufacturing aligns with Dutch disease. B is incorrect. Weak institutions are explicitly cited as a growth barrier.", "explhtml": "<p>Country Y’s sluggish growth is tied to resource curse dynamics (e.g., Dutch disease, weak institutions). High human capital investment would support growth, but the report notes poor education/health systems.<\/p><p><b>A is incorrect.<\/b> Currency appreciation harming manufacturing aligns with Dutch disease.<\/p><p><b>B is incorrect.<\/b> Weak institutions are explicitly cited as a growth barrier.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (a): Compare factors favoring and limiting economic growth in developed and developing economies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Alex Morgan<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alex Morgan, CFO of Global Growth Investments, is assessing economic growth prospects for<\/p><p>four countries to allocate a $500 million fund. Jamie Lee, an investment analyst, assists him.<\/p><p>Their discussion focuses on key growth drivers outlined in internal reports.<\/p><p>Morgan reviews Country X, a developed economy with high capital per worker. The report<\/p><p>highlights stagnant TFP growth but notes significant ICT investments. Lee points to Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0109.webp\" style=\"max-width:min(100%,512px)\" alt=\"Exhibit 1: Capital Deepening vs. Technological Progress Country Capital-to-Labour Ratio Total Factor Productivity (TFP) Growth Country X High Stagnant Country Y Moderate Weak Country Z Low Low Country W Moderate High\"><p>Showing Country X’s position at a high capital-to-labor ratio. Morgan asks, “Why hasn’t recent<\/p><p>capital investment boosted productivity?”<\/p><p>Next, they analyze Country Y, rich in oil reserves but with GDP growth below its peers. The<\/p><p>report cites weak institutions and a declining manufacturing sector. Lee mentions the “resource<\/p><p>curse” and notes that Country Y’s currency has appreciated due to oil exports. Morgan questions<\/p><p>the primary cause of its sluggish growth.<\/p><p>Country Z, a developing nation, has a young population and rising labor force participation.<\/p><p>Projections indicate that the working-age population is expected to grow by 2% annually, but<\/p><p>educational levels are lagging behind. Lee suggests this demographic could accelerate growth.<\/p><p>Morgan asks how these factors affect potential GDP.<\/p><p>Finally, they evaluate Country W, which recently liberalized trade and attracted FDI. The report<\/p><p>shows FDI surged from $1B to $15B in five years, funding infrastructure and technology. Morgan<\/p><p>wonders how this impacts long-term growth under endogenous growth theory.<\/p><\/div><\/details><div class=\"qtext\"><p>Which factor is least likely to explain Country Y’s slow growth?<\/p><\/div>", "subj": "economics"}, {"n": 75, "q": "The growth rate of Country Z’s potential GDP will most likely:", "opts": ["Decrease due to low labor quality", "Increase due to rising labor quantity", "Remain stable as TFP offsets demographic changes"], "ans": "B", "expl": "Potential GDP growth = Labor force growth + Labor productivity growth. A 2% rise in the working-age population increases labor input, boosting potential GDP despite low education (which affects productivity, not quantity). Labor force expansion directly raises potential GDP. A is incorrect. Low labor quality affects productivity, not the immediate labor quantity contribution. C is incorrect. TFP is not mentioned as offsetting demographic changes.", "explhtml": "<p>Potential GDP growth = Labor force growth + Labor productivity growth. A 2% rise in the working-age population increases labor input, boosting potential GDP despite low education (which affects productivity, not quantity). Labor force expansion directly raises potential GDP.<\/p><p><b>A is incorrect.<\/b> Low labor quality affects productivity, not the immediate labor quantity contribution.<\/p><p><b>C is incorrect.<\/b> TFP is not mentioned as offsetting demographic changes.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (a): Compare factors favoring and limiting economic growth in developed and developing economies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Alex Morgan<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alex Morgan, CFO of Global Growth Investments, is assessing economic growth prospects for<\/p><p>four countries to allocate a $500 million fund. Jamie Lee, an investment analyst, assists him.<\/p><p>Their discussion focuses on key growth drivers outlined in internal reports.<\/p><p>Morgan reviews Country X, a developed economy with high capital per worker. The report<\/p><p>highlights stagnant TFP growth but notes significant ICT investments. Lee points to Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0109.webp\" style=\"max-width:min(100%,512px)\" alt=\"Exhibit 1: Capital Deepening vs. Technological Progress Country Capital-to-Labour Ratio Total Factor Productivity (TFP) Growth Country X High Stagnant Country Y Moderate Weak Country Z Low Low Country W Moderate High\"><p>Showing Country X’s position at a high capital-to-labor ratio. Morgan asks, “Why hasn’t recent<\/p><p>capital investment boosted productivity?”<\/p><p>Next, they analyze Country Y, rich in oil reserves but with GDP growth below its peers. The<\/p><p>report cites weak institutions and a declining manufacturing sector. Lee mentions the “resource<\/p><p>curse” and notes that Country Y’s currency has appreciated due to oil exports. Morgan questions<\/p><p>the primary cause of its sluggish growth.<\/p><p>Country Z, a developing nation, has a young population and rising labor force participation.<\/p><p>Projections indicate that the working-age population is expected to grow by 2% annually, but<\/p><p>educational levels are lagging behind. Lee suggests this demographic could accelerate growth.<\/p><p>Morgan asks how these factors affect potential GDP.<\/p><p>Finally, they evaluate Country W, which recently liberalized trade and attracted FDI. The report<\/p><p>shows FDI surged from $1B to $15B in five years, funding infrastructure and technology. Morgan<\/p><p>wonders how this impacts long-term growth under endogenous growth theory.<\/p><\/div><\/details><div class=\"qtext\"><p>The growth rate of Country Z’s potential GDP will most likely:<\/p><\/div>", "subj": "economics"}, {"n": 76, "q": "Country W’s FDI-driven growth is best explained by:", "opts": ["Neoclassical model’s focus on capital accumulation", "Endogenous growth theory’s emphasis on knowledge spillovers", "Classical model’s prediction of population-driven growth"], "ans": "B", "expl": "Endogenous growth theory posits that FDI in technology and infrastructure creates knowledge spillovers and innovation, enabling sustained growth. The surge in FDI aligns with this model. Endogenous growth highlights technology/externalities from investment. A is incorrect. The neoclassical model predicts only temporary growth from capital accumulation. C is incorrect. The classical theory focuses on population/resource limits, which are irrelevant here.", "explhtml": "<p>Endogenous growth theory posits that FDI in technology and infrastructure creates knowledge spillovers and innovation, enabling sustained growth. The surge in FDI aligns with this model. Endogenous growth highlights technology/externalities from investment.<\/p><p><b>A is incorrect.<\/b> The neoclassical model predicts only temporary growth from capital accumulation.<\/p><p><b>C is incorrect.<\/b> The classical theory focuses on population/resource limits, which are irrelevant here.<\/p><p class=\"los\">Study Session 3, Learning Module 9: Economic Growth. LOS 9(d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Alex Morgan<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alex Morgan, CFO of Global Growth Investments, is assessing economic growth prospects for<\/p><p>four countries to allocate a $500 million fund. Jamie Lee, an investment analyst, assists him.<\/p><p>Their discussion focuses on key growth drivers outlined in internal reports.<\/p><p>Morgan reviews Country X, a developed economy with high capital per worker. The report<\/p><p>highlights stagnant TFP growth but notes significant ICT investments. Lee points to Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0109.webp\" style=\"max-width:min(100%,512px)\" alt=\"Exhibit 1: Capital Deepening vs. Technological Progress Country Capital-to-Labour Ratio Total Factor Productivity (TFP) Growth Country X High Stagnant Country Y Moderate Weak Country Z Low Low Country W Moderate High\"><p>Showing Country X’s position at a high capital-to-labor ratio. Morgan asks, “Why hasn’t recent<\/p><p>capital investment boosted productivity?”<\/p><p>Next, they analyze Country Y, rich in oil reserves but with GDP growth below its peers. The<\/p><p>report cites weak institutions and a declining manufacturing sector. Lee mentions the “resource<\/p><p>curse” and notes that Country Y’s currency has appreciated due to oil exports. Morgan questions<\/p><p>the primary cause of its sluggish growth.<\/p><p>Country Z, a developing nation, has a young population and rising labor force participation.<\/p><p>Projections indicate that the working-age population is expected to grow by 2% annually, but<\/p><p>educational levels are lagging behind. Lee suggests this demographic could accelerate growth.<\/p><p>Morgan asks how these factors affect potential GDP.<\/p><p>Finally, they evaluate Country W, which recently liberalized trade and attracted FDI. The report<\/p><p>shows FDI surged from $1B to $15B in five years, funding infrastructure and technology. Morgan<\/p><p>wonders how this impacts long-term growth under endogenous growth theory.<\/p><\/div><\/details><div class=\"qtext\"><p>Country W’s FDI-driven growth is best explained by:<\/p><\/div>", "subj": "economics"}, {"n": 77, "q": "Terranova’s stagnant growth is most likely due to:", "opts": ["Declining ICT investment", "Diminishing marginal returns to capital", "Rapid population growth"], "ans": "B", "expl": "At high capital-to-labor ratios ($150,000 per worker), additional capital faces diminishing marginal returns. Stagnant TFP growth (0.3%) prevents productivity gains. A is incorrect. Terranova’s heavy automation/robotics investments rule out declining ICT spending. C is incorrect. The working-age population is shrinking, not growing.", "explhtml": "<p>At high capital-to-labor ratios ($150,000 per worker), additional capital faces diminishing marginal returns. Stagnant TFP growth (0.3%) prevents productivity gains.<\/p><p><b>A is incorrect.<\/b> Terranova’s heavy automation/robotics investments rule out declining ICT spending.<\/p><p><b>C is incorrect.<\/b> The working-age population is shrinking, not growing.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Clara Evans<\/summary><div class=\"vig-body\"><p>Clara Evans, the CFO of Summit Global Investments (SGI), is assessing economic growth<\/p><p>prospects for four countries to allocate a $800 million fund. Jordan Lee, an economist, assists<\/p><p>him. Their discussion focuses on key growth drivers outlined in internal reports.<\/p><p>Evans reviews a report on Terranova, a developed economy with a capital stock of $150,000 per<\/p><p>worker. Over the past decade, Terranova’s GDP growth has slowed to 1.2% annually, despite<\/p><p>heavy investment in automation and robotics. Total factor productivity (TFP) growth has<\/p><p>stagnated at 0.3%, while the working-age population is shrinking by 0.5% annually. Jordan notes<\/p><p>that Terranova’s capital-to-labor ratio is among the highest globally. Evans asks, “Why hasn’t<\/p><p>increased capital investment boosted Terranova’s growth?”<\/p><p>Next, they analyze Marakanda, a developing nation with vast oil reserves. Marakanda’s GDP<\/p><p>growth averages 0.8% annually, far below neighbouring countries. The report highlights frequent<\/p><p>changes in government, widespread corruption, and a lack of enforceable property rights.<\/p><p>Additionally, Marakanda’s currency has appreciated by 25% over five years due to oil exports,<\/p><p>crippling its manufacturing sector. Jordan mentions that Marakanda spends only 2% of its GDP<\/p><p>on education and healthcare. Evans asks, “What is the primary obstacle to Marakanda’s<\/p><p>economic growth?”<\/p><p>Solari, a low-income country, has a population where 40% are under age 20. Its labor force is<\/p><p>expanding by 3.5% annually, but only 30% of workers have completed secondary education. Due<\/p><p>to government childcare subsidies, the female labour force participation rate has risen from 25%<\/p><p>to 45% in the last decade. However, Solari’s infrastructure is underdeveloped, with frequent<\/p><p>power outages. Evans asks, “How will Solari’s demographics impact its potential GDP growth?”<\/p><p>Finally, a mid-sized economy, Ventura recently abolished tariffs and attracted $30 billion in<\/p><p>foreign direct investment (FDI). FDI has funded high-tech manufacturing plants and R&amp;D<\/p><p>centres, with exports now accounting for 45% of GDP. Ventura’s GDP growth has accelerated<\/p><p>from 2% to 7% annually, and local firms are adopting advanced technologies from foreign<\/p><p>partners. Evans asks, “Which economic growth theory best explains Ventura’s transformation?”<\/p><\/div><\/details><div class=\"qtext\"><p>Terranova’s stagnant growth is most likely due to:<\/p><\/div>", "subj": "economics"}, {"n": 78, "q": "Which factor is least likely to explain Marakanda’s slow growth?", "opts": ["Dutch disease from oil exports", "Weak enforcement of property rights", "High spending on education and healthcare"], "ans": "C", "expl": "Marakanda spends only 2% of GDP on education/healthcare (stated in the case). High spending would support growth, but it is absent here. A is incorrect. Currency appreciation (25%) harming manufacturing aligns with Dutch disease. B is incorrect. Corruption and weak property rights are explicitly cited as barriers.", "explhtml": "<p>Marakanda spends only 2% of GDP on education/healthcare (stated in the case). High spending would support growth, but it is absent here.<\/p><p><b>A is incorrect.<\/b> Currency appreciation (25%) harming manufacturing aligns with Dutch disease.<\/p><p><b>B is incorrect.<\/b> Corruption and weak property rights are explicitly cited as barriers.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Clara Evans<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Evans, the CFO of Summit Global Investments (SGI), is assessing economic growth<\/p><p>prospects for four countries to allocate a $800 million fund. Jordan Lee, an economist, assists<\/p><p>him. Their discussion focuses on key growth drivers outlined in internal reports.<\/p><p>Evans reviews a report on Terranova, a developed economy with a capital stock of $150,000 per<\/p><p>worker. Over the past decade, Terranova’s GDP growth has slowed to 1.2% annually, despite<\/p><p>heavy investment in automation and robotics. Total factor productivity (TFP) growth has<\/p><p>stagnated at 0.3%, while the working-age population is shrinking by 0.5% annually. Jordan notes<\/p><p>that Terranova’s capital-to-labor ratio is among the highest globally. Evans asks, “Why hasn’t<\/p><p>increased capital investment boosted Terranova’s growth?”<\/p><p>Next, they analyze Marakanda, a developing nation with vast oil reserves. Marakanda’s GDP<\/p><p>growth averages 0.8% annually, far below neighbouring countries. The report highlights frequent<\/p><p>changes in government, widespread corruption, and a lack of enforceable property rights.<\/p><p>Additionally, Marakanda’s currency has appreciated by 25% over five years due to oil exports,<\/p><p>crippling its manufacturing sector. Jordan mentions that Marakanda spends only 2% of its GDP<\/p><p>on education and healthcare. Evans asks, “What is the primary obstacle to Marakanda’s<\/p><p>economic growth?”<\/p><p>Solari, a low-income country, has a population where 40% are under age 20. Its labor force is<\/p><p>expanding by 3.5% annually, but only 30% of workers have completed secondary education. Due<\/p><p>to government childcare subsidies, the female labour force participation rate has risen from 25%<\/p><p>to 45% in the last decade. However, Solari’s infrastructure is underdeveloped, with frequent<\/p><p>power outages. Evans asks, “How will Solari’s demographics impact its potential GDP growth?”<\/p><p>Finally, a mid-sized economy, Ventura recently abolished tariffs and attracted $30 billion in<\/p><p>foreign direct investment (FDI). FDI has funded high-tech manufacturing plants and R&amp;D<\/p><p>centres, with exports now accounting for 45% of GDP. Ventura’s GDP growth has accelerated<\/p><p>from 2% to 7% annually, and local firms are adopting advanced technologies from foreign<\/p><p>partners. Evans asks, “Which economic growth theory best explains Ventura’s transformation?”<\/p><\/div><\/details><div class=\"qtext\"><p>Which factor is least likely to explain Marakanda’s slow growth?<\/p><\/div>", "subj": "economics"}, {"n": 79, "q": "Solari’s potential GDP growth will most likely.", "opts": ["Decline due to low labor quality", "Increase due to rising labor force participation", "Remain unchanged as infrastructure offsets demographics"], "ans": "B", "expl": "Potential GDP growth = Labor force growth + Labor productivity. A 3.5% labor force expansion (driven by demographics and rising female participation) directly boosts growth. Low education affects productivity but not the contribution of labor quantity. A is incorrect. Low education impacts productivity, not the immediate labor input increase. C is incorrect. Infrastructure challenges (e.g., power outages) are mentioned but not resolved.", "explhtml": "<p>Potential GDP growth = Labor force growth + Labor productivity. A 3.5% labor force expansion (driven by demographics and rising female participation) directly boosts growth. Low education affects productivity but not the contribution of labor quantity.<\/p><p><b>A is incorrect.<\/b> Low education impacts productivity, not the immediate labor input increase.<\/p><p><b>C is incorrect.<\/b> Infrastructure challenges (e.g., power outages) are mentioned but not resolved.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (c): Explain why potential GDP and its growth rate matter for equity and fixed income investors.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Clara Evans<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Evans, the CFO of Summit Global Investments (SGI), is assessing economic growth<\/p><p>prospects for four countries to allocate a $800 million fund. Jordan Lee, an economist, assists<\/p><p>him. Their discussion focuses on key growth drivers outlined in internal reports.<\/p><p>Evans reviews a report on Terranova, a developed economy with a capital stock of $150,000 per<\/p><p>worker. Over the past decade, Terranova’s GDP growth has slowed to 1.2% annually, despite<\/p><p>heavy investment in automation and robotics. Total factor productivity (TFP) growth has<\/p><p>stagnated at 0.3%, while the working-age population is shrinking by 0.5% annually. Jordan notes<\/p><p>that Terranova’s capital-to-labor ratio is among the highest globally. Evans asks, “Why hasn’t<\/p><p>increased capital investment boosted Terranova’s growth?”<\/p><p>Next, they analyze Marakanda, a developing nation with vast oil reserves. Marakanda’s GDP<\/p><p>growth averages 0.8% annually, far below neighbouring countries. The report highlights frequent<\/p><p>changes in government, widespread corruption, and a lack of enforceable property rights.<\/p><p>Additionally, Marakanda’s currency has appreciated by 25% over five years due to oil exports,<\/p><p>crippling its manufacturing sector. Jordan mentions that Marakanda spends only 2% of its GDP<\/p><p>on educa
