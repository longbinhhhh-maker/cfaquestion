<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalystPrep — Economics</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}

  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;

  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
  .expl-html .los{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
  .expl-html b{color:var(--txt)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

<script>
const DATA = [{"n": 1, "q": "Is Franco most likely correct with respect to his comments about the conversion of GDP and stock market value:", "opts": ["Only with respect to stock market value.", "Both with respect to stock market value and conversion of GDP.", "Neither with respect to stock market value nor conversion of GDP."], "ans": "A", "expl": "Franco's statement regarding the stock market value is grounded in the economic principle that over long horizons, the stock market's growth tends to align with the growth of GDP. This alignment occurs because the proportion of earnings relative to GDP and the variations in the price-earnings ratio stabilize and converge towards zero over extended periods. This long-term perspective assumes that as an economy expands, its corporate sector's earnings, which are reflected in stock prices, will grow at a similar rate. This theoretical framework is supported by historical economic data which often shows a correlation between GDP growth and long-term stock market performance. Hence, Franco's comment about stock market value is likely correct as it aligns with established economic theories and empirical evidence. B is incorrect. Franco's preference for using current market exchange rates over PPP for GDP conversion in cross-country comparisons is less advisable. Market exchange rates can fluctuate significantly due to short-term factors like speculative flows, interest rate changes, and political instability, which do not necessarily reflect the underlying economic fundamentals of countries. In contrast, PPP adjusts for the differences in price levels between countries and provides a more stable and realistic measure of economic output and living standards. PPP is particularly useful for long-term economic analysis and investment decisions, as it accounts for the economic purchasing power of different currencies. By ignoring PPP, Franco overlooks these aspects, making his approach to GDP conversion potentially less accurate for comparative economic analysis. C is incorrect. Franco's comments on both the stock market value and GDP conversion contain inaccuracies, but his perspective on stock market value aligns more closely with economic theory and historical evidence. While his view on the equivalence of GDP growth and stock market growth over the long term is supported, his method for GDP conversion using market exchange rates is flawed due to the volatility and short-term nature of these rates. Therefore, stating that he is incorrect in both respects does not accurately reflect the validity of his views on long-term stock market behavior, which is indeed likely correct based on economic principles. ", "explhtml": "<p>Franco&#x27;s statement regarding the stock market value is grounded in the economic principle that over long horizons, the stock market&#x27;s growth tends to align with the growth of GDP. This alignment occurs because the proportion of earnings relative to GDP and the variations in the price-earnings ratio stabilize and converge towards zero over extended periods. This long-term perspective assumes that as an economy expands, its corporate sector&#x27;s earnings, which are reflected in stock prices, will grow at a similar rate. This theoretical framework is supported by historical economic data which often shows a correlation between GDP growth and long-term stock market performance. Hence, Franco&#x27;s comment about stock market value is likely correct as it aligns with established economic theories and empirical evidence.<\/p><p><b>B is incorrect<\/b>. Franco&#x27;s preference for using current market exchange rates over PPP for GDP conversion in cross-country comparisons is less advisable. Market exchange rates can fluctuate significantly due to short-term factors like speculative flows, interest rate changes, and political instability, which do not necessarily reflect the underlying economic fundamentals of countries. In contrast, PPP adjusts for the differences in price levels between countries and provides a more stable and realistic measure of economic output and living standards. PPP is particularly useful for long-term economic analysis and investment decisions, as it accounts for the economic purchasing power of different currencies. By ignoring PPP, Franco overlooks these aspects, making his approach to GDP conversion potentially less accurate for comparative economic analysis.<\/p><p><b>C is incorrect<\/b>. Franco&#x27;s comments on both the stock market value and GDP conversion contain inaccuracies, but his perspective on stock market value aligns more closely with economic theory and historical evidence. While his view on the equivalence of GDP growth and stock market growth over the long term is supported, his method for GDP conversion using market exchange rates is flawed due to the volatility and short-term nature of these rates. Therefore, stating that he is incorrect in both respects does not accurately reflect the validity of his views on long-term stock market behavior, which is indeed likely correct based on economic principles. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(h): Explain approaches to assessing the long-run fair value of an exchange rate<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Allan Associates<\/summary><div class=\"vig-body\"><p>Armando Franco is a freelance economist who formerly worked as a full-time employee at Allan Associates (ALASS) - an investment advisory firm in Massachusetts. His work at ALASS was highly recognized. The firm&#x27;s research department would often call upon him to assist with ongoing projects. Presently, Franco is working with the research team at ALASS to determine global macroeconomic forecasts for their international investments. As a first step, Franco performed cross-country comparisons of the GDP growth rate. Since each country presented data in its own currency, Franco would convert the data into U.S. dollars to ensure accuracy in comparison. One of the company’s analysts – Mike Derry -- sought to know more about the conversion. Franco made the following comment:<\/p><p>“The conversion can be made using either current market exchange rates or the exchange rates implied by purchasing power parity (PPP). I prefer using the market exchange rates because they account for a wide range of goods and services, and express market expectations. On the other hand, PPP rarely holds in the short-term, and is only applicable over significantly long investment horizons.”<\/p><p>As a second step, Franco used his estimated economic growth figures to determine stock prices and stock market growth. He made the following comment:<\/p><p>“Over long horizons, the percentage change in stock market value will equal the percentage change in GDP, because the share of profits in GDP and the change in the price-earnings multiple over the long-term will be approximately zero.”<\/p><p>At one point, Derry inquired about the determinants of a country’s long-run economic growth. Franco stated that several theoretical explanations existed to explain the relationship between a country’s output and inputs. Talking about the Cobb-Douglas production function, Franco made the following comment:<\/p><p>“When the share of GDP paid out to suppliers of capital is close to zero, diminishing marginal returns to labor will be quite significant.”<\/p><p>Continuing with the discussion, Derry made the following comment:<\/p><p>“I believe that if the share of GDP paid out to suppliers of capital is close to one, the capital elasticity of output would be high.”<\/p><p>Franco used macroeconomic forecasts provided by the research department at ALASS to decompose the GDP growth of Germany into its constituents. Exhibit 1 displays the data provided by the firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0007.webp\" style=\"max-width:min(100%,340px)\" alt=\"Exhibit 1 Macroeconomic forecasts for Germany\"><p>Expected growth rate of capital 1.5%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0008.webp\" style=\"max-width:min(100%,302px)\" alt=\"Expected growth rate of labor 2.3% α 0.6 Potential GDP growth rate 6.7%\"><p>After making his conclusions about the growth rate of Germany and possible potential investments in the country, Franco asked Derry to obtain labor workforce information in Brazil and Mexico, two developing economies. Exhibit 2 displays the data assembled.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0009.webp\" style=\"max-width:min(100%,500px)\" alt=\"Exhibit 2 Labor Input Data in Brazil and Mexico (2011) Brazil Mexico Population 50.5 million 54.5 million\"><p>Immigration (2005-2011) 6.758 million 2.198 million<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0010.webp\" style=\"max-width:min(100%,392px)\" alt=\"% of population under 15 22 17 % of population over 60 12 18 Male participation rate 70% 90% Female participation rate 90% 70% Unemployment rate 23% 32% Income tax rate 35% 20%\"><\/div><\/details><div class=\"qtext\"><p>Is Franco most likely correct with respect to his comments about the conversion of GDP and stock market value:<\/p><\/div>", "subj": "economics"}, {"n": 2, "q": "With respect to the Cobb-Douglas production function, are Franco and Derry most likely correct:", "opts": ["Only Franco is correct.", "Only Derry is correct.", "Neither Franco nor Derry is correct."], "ans": "B", "expl": "The Cobb-Douglas production function is expressed as where Y is the total production (the real value of all goods produced in a year), K is capital input, L is labor input, A represents total factor productivity, and α is the output elasticity of capital. This function is crucial in understanding how different inputs contribute to the output in an economy. Derry's statement aligns correctly with the principles of the Cobb-Douglas production function. He states that if the share of GDP paid to suppliers of capital is close to one, the capital elasticity of output would be high. This is accurate because a high α value indicates that capital input has a substantial impact on output. In this scenario, the output elasticity with respect to capital is high, meaning that increases in capital investment will lead to significant increases in output. This understanding correctly reflects the mechanics of the Cobb-Douglas production function where the parameter α directly measures the responsiveness of output to changes in the capital input. A is incorrect. Franco's statement that \"When the share of GDP paid out to suppliers of capital is close to zero, diminishing marginal returns to labor will be quite significant\" misinterprets the dynamics of the production function. In the Cobb-Douglas function, a low α (share of output paid to capital) implies that capital has less influence on output, not labor. Therefore, if α is close to zero, it suggests that diminishing marginal returns to capital are significant, not to labor. This misunderstanding of the roles of capital and labor in the production function leads to the incorrectness of Franco's statement. C is incorrect. As explained above, Derry's interpretation and application of the Cobb-Douglas production function are accurate. His understanding that a high α results in high capital elasticity of output is a correct application of economic theory to practical scenarios. Therefore, stating that neither is correct overlooks the accuracy of Derry's analysis. ", "explhtml": "<p>The Cobb-Douglas production function is expressed as<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0011.webp\" style=\"max-width:min(100%,136px)\" alt=\"Y = A ⋅Kα ⋅L1−α\"><p>where Y is the total production (the real value of all goods produced in a year), K is capital input, L is labor input, A represents total factor productivity, and α is the output elasticity of capital. This function is crucial in understanding how different inputs contribute to the output in an economy.<\/p><p>Derry&#x27;s statement aligns correctly with the principles of the Cobb-Douglas production function. He states that if the share of GDP paid to suppliers of capital is close to one, the capital elasticity of output would be high. This is accurate because a high α value indicates that capital input has a substantial impact on output. In this scenario, the output elasticity with respect to capital is high, meaning that increases in capital investment will lead to significant increases in output. This understanding correctly reflects the mechanics of the Cobb-Douglas production function where the parameter α directly measures the responsiveness of output to changes in the capital input.<\/p><p><b>A is incorrect<\/b>. Franco&#x27;s statement that &quot;When the share of GDP paid out to suppliers of capital is close to zero, diminishing marginal returns to labor will be quite significant&quot; misinterprets the dynamics of the production function. In the Cobb-Douglas function, a low α (share of output paid to capital) implies that capital has less influence on output, not labor. Therefore, if α is close to zero, it suggests that diminishing marginal returns to capital are significant, not to labor. This misunderstanding of the roles of capital and labor in the production function leads to the incorrectness of Franco&#x27;s statement.<\/p><p><b>C is incorrect<\/b>. As explained above, Derry&#x27;s interpretation and application of the Cobb-Douglas production function are accurate. His understanding that a high α results in high capital elasticity of output is a correct application of economic theory to practical scenarios. Therefore, stating that neither is correct overlooks the accuracy of Derry&#x27;s analysis. <\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(h): Explain how investment in physical capital, human capital, and technological development affects economic growth<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Allan Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Armando Franco is a freelance economist who formerly worked as a full-time employee at Allan Associates (ALASS) - an investment advisory firm in Massachusetts. His work at ALASS was highly recognized. The firm&#x27;s research department would often call upon him to assist with ongoing projects. Presently, Franco is working with the research team at ALASS to determine global macroeconomic forecasts for their international investments. As a first step, Franco performed cross-country comparisons of the GDP growth rate. Since each country presented data in its own currency, Franco would convert the data into U.S. dollars to ensure accuracy in comparison. One of the company’s analysts – Mike Derry -- sought to know more about the conversion. Franco made the following comment:<\/p><p>“The conversion can be made using either current market exchange rates or the exchange rates implied by purchasing power parity (PPP). I prefer using the market exchange rates because they account for a wide range of goods and services, and express market expectations. On the other hand, PPP rarely holds in the short-term, and is only applicable over significantly long investment horizons.”<\/p><p>As a second step, Franco used his estimated economic growth figures to determine stock prices and stock market growth. He made the following comment:<\/p><p>“Over long horizons, the percentage change in stock market value will equal the percentage change in GDP, because the share of profits in GDP and the change in the price-earnings multiple over the long-term will be approximately zero.”<\/p><p>At one point, Derry inquired about the determinants of a country’s long-run economic growth. Franco stated that several theoretical explanations existed to explain the relationship between a country’s output and inputs. Talking about the Cobb-Douglas production function, Franco made the following comment:<\/p><p>“When the share of GDP paid out to suppliers of capital is close to zero, diminishing marginal returns to labor will be quite significant.”<\/p><p>Continuing with the discussion, Derry made the following comment:<\/p><p>“I believe that if the share of GDP paid out to suppliers of capital is close to one, the capital elasticity of output would be high.”<\/p><p>Franco used macroeconomic forecasts provided by the research department at ALASS to decompose the GDP growth of Germany into its constituents. Exhibit 1 displays the data provided by the firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0007.webp\" style=\"max-width:min(100%,340px)\" alt=\"Exhibit 1 Macroeconomic forecasts for Germany\"><p>Expected growth rate of capital 1.5%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0008.webp\" style=\"max-width:min(100%,302px)\" alt=\"Expected growth rate of labor 2.3% α 0.6 Potential GDP growth rate 6.7%\"><p>After making his conclusions about the growth rate of Germany and possible potential investments in the country, Franco asked Derry to obtain labor workforce information in Brazil and Mexico, two developing economies. Exhibit 2 displays the data assembled.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0009.webp\" style=\"max-width:min(100%,500px)\" alt=\"Exhibit 2 Labor Input Data in Brazil and Mexico (2011) Brazil Mexico Population 50.5 million 54.5 million\"><p>Immigration (2005-2011) 6.758 million 2.198 million<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0010.webp\" style=\"max-width:min(100%,392px)\" alt=\"% of population under 15 22 17 % of population over 60 12 18 Male participation rate 70% 90% Female participation rate 90% 70% Unemployment rate 23% 32% Income tax rate 35% 20%\"><\/div><\/details><div class=\"qtext\"><p>With respect to the Cobb-Douglas production function, are Franco and Derry most likely correct:<\/p><\/div>", "subj": "economics"}, {"n": 3, "q": "With respect to Germany, the expected total factor productivity growth is closest to:", "opts": ["4.88%, and an increase in TFP will not affect the relative productivity of the other inputs.", "4.72%, and an increase in TFP boosts the relative productivity of the other inputs.", "2.90%, and a permanent increase in TFP increases the level of potential GDP."], "ans": "A", "expl": "Total factor productivity (TFP) growth is a crucial component in understanding the overall productivity of an economy. It represents the efficiency with which both capital and labor are used together to produce output, beyond what can be explained by the amount of inputs used in production. In the case of Germany, the potential GDP growth rate is given as 6.7%. Using the Cobb-Douglas production function, where the output elasticity of capital ($\\alpha$) is 0.6, we can decompose this growth rate into contributions from capital, labor, and TFP. The expected growth rates of capital and labor are 1.5% and 2.3% respectively. Plugging these values into the production function, we get: Solving for TFP growth, we find: This calculation shows that the TFP growth for Germany is approximately 4.88%. Furthermore, an increase in TFP does not directly affect the relative productivity of other inputs like capital and labor, but rather enhances the overall level of output achievable with the given inputs. B is incorrect. The correct TFP growth, as calculated, is 4.88%. Additionally, the statement in option B that an increase in TFP boosts the relative productivity of the other inputs is misleading. While TFP increases the overall efficiency of using inputs, it does not change the inherent productivity of the inputs themselves. The productivity of capital and labor relative to each other remains determined by their respective elasticities in the production function and not by changes in TFP. C is incorrect. The TFP growth rate suggested in option C is 2.90%, which is significantly lower than the correct calculation. This discrepancy arises from an incorrect interpretation or calculation of the data provided. Moreover, while it is true that a permanent increase in TFP can raise the level of potential GDP, the primary error in this option is the incorrect TFP growth rate, which is foundational to assessing the impact on potential GDP. The focus should be on accurately determining the TFP growth rate first before considering its implications on potential GDP. ", "explhtml": "<p>Total factor productivity (TFP) growth is a crucial component in understanding the overall productivity of an economy. It represents the efficiency with which both capital and labor are used together to produce output, beyond what can be explained by the amount of inputs used in production. In the case of Germany, the potential GDP growth rate is given as 6.7%. Using the Cobb-Douglas production function, where the output elasticity of capital ($\\alpha$) is 0.6, we can decompose this growth rate into contributions from capital, labor, and TFP. The expected growth rates of capital and labor are 1.5% and 2.3% respectively. Plugging these values into the production function, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0012.webp\" style=\"max-width:min(100%,362px)\" alt=\"6.7% = 0.6 × 1.5% + 0.4 × 2.3% + TFP growth\"><p>Solving for TFP growth, we find:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0013.webp\" style=\"max-width:min(100%,286px)\" alt=\"6.7% = 0.9% + 0.92% + TFP growth TFP growth = 4.88%\"><p>This calculation shows that the TFP growth for Germany is approximately 4.88%. Furthermore, an increase in TFP does not directly affect the relative productivity of other inputs like capital and labor, but rather enhances the overall level of output achievable with the given inputs.<\/p><p><b>B is incorrect<\/b>. The correct TFP growth, as calculated, is 4.88%. Additionally, the statement in option B that an increase in TFP boosts the relative productivity of the other inputs is misleading. While TFP increases the overall efficiency of using inputs, it does not change the inherent productivity of the inputs themselves. The productivity of capital and labor relative to each other remains determined by their respective elasticities in the production function and not by changes in TFP.<\/p><p><b>C is incorrect<\/b>. The TFP growth rate suggested in option C is 2.90%, which is significantly lower than the correct calculation. This discrepancy arises from an incorrect interpretation or calculation of the data provided. Moreover, while it is true that a permanent increase in TFP can raise the level of potential GDP, the primary error in this option is the incorrect TFP growth rate, which is foundational to assessing the impact on potential GDP. The focus should be on accurately determining the TFP growth rate first before considering its implications on potential GDP. <\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (d): Contrast capital deepening investment and technological progress and explain how each affects economic growth and labor productivity<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Allan Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Armando Franco is a freelance economist who formerly worked as a full-time employee at Allan Associates (ALASS) - an investment advisory firm in Massachusetts. His work at ALASS was highly recognized. The firm&#x27;s research department would often call upon him to assist with ongoing projects. Presently, Franco is working with the research team at ALASS to determine global macroeconomic forecasts for their international investments. As a first step, Franco performed cross-country comparisons of the GDP growth rate. Since each country presented data in its own currency, Franco would convert the data into U.S. dollars to ensure accuracy in comparison. One of the company’s analysts – Mike Derry -- sought to know more about the conversion. Franco made the following comment:<\/p><p>“The conversion can be made using either current market exchange rates or the exchange rates implied by purchasing power parity (PPP). I prefer using the market exchange rates because they account for a wide range of goods and services, and express market expectations. On the other hand, PPP rarely holds in the short-term, and is only applicable over significantly long investment horizons.”<\/p><p>As a second step, Franco used his estimated economic growth figures to determine stock prices and stock market growth. He made the following comment:<\/p><p>“Over long horizons, the percentage change in stock market value will equal the percentage change in GDP, because the share of profits in GDP and the change in the price-earnings multiple over the long-term will be approximately zero.”<\/p><p>At one point, Derry inquired about the determinants of a country’s long-run economic growth. Franco stated that several theoretical explanations existed to explain the relationship between a country’s output and inputs. Talking about the Cobb-Douglas production function, Franco made the following comment:<\/p><p>“When the share of GDP paid out to suppliers of capital is close to zero, diminishing marginal returns to labor will be quite significant.”<\/p><p>Continuing with the discussion, Derry made the following comment:<\/p><p>“I believe that if the share of GDP paid out to suppliers of capital is close to one, the capital elasticity of output would be high.”<\/p><p>Franco used macroeconomic forecasts provided by the research department at ALASS to decompose the GDP growth of Germany into its constituents. Exhibit 1 displays the data provided by the firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0007.webp\" style=\"max-width:min(100%,340px)\" alt=\"Exhibit 1 Macroeconomic forecasts for Germany\"><p>Expected growth rate of capital 1.5%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0008.webp\" style=\"max-width:min(100%,302px)\" alt=\"Expected growth rate of labor 2.3% α 0.6 Potential GDP growth rate 6.7%\"><p>After making his conclusions about the growth rate of Germany and possible potential investments in the country, Franco asked Derry to obtain labor workforce information in Brazil and Mexico, two developing economies. Exhibit 2 displays the data assembled.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0009.webp\" style=\"max-width:min(100%,500px)\" alt=\"Exhibit 2 Labor Input Data in Brazil and Mexico (2011) Brazil Mexico Population 50.5 million 54.5 million\"><p>Immigration (2005-2011) 6.758 million 2.198 million<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0010.webp\" style=\"max-width:min(100%,392px)\" alt=\"% of population under 15 22 17 % of population over 60 12 18 Male participation rate 70% 90% Female participation rate 90% 70% Unemployment rate 23% 32% Income tax rate 35% 20%\"><\/div><\/details><div class=\"qtext\"><p>With respect to Germany, the expected total factor productivity growth is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 4, "q": "Which one of the following comparative statements is most consistent with the data given for the Brazilian and Mexican economies:", "opts": ["The contribution of number of average hours worked to output will be greater for Mexico than for Brazil.", "Future growth in GDP is likely to be higher for Brazil than for Mexico.", "The growth rate in labor force will differ more from the population growth for Mexico than for Brazil."], "ans": "A", "expl": "The statement that the contribution of the number of average hours worked to output will be greater for Mexico than for Brazil is supported by several factors. Firstly, the male participation rate in Mexico is significantly higher at 90% compared to Brazil's 70%. Typically, male workers in many economies tend to work longer hours on average compared to female workers, who might be more likely to engage in part-time work or have career interruptions due to family care responsibilities. Additionally, the lower income tax rate in Mexico at 20% compared to Brazil's 35% potentially provides greater net income from work, which can be an incentive for increased labor participation and longer working hours. B is incorrect. The statement that future growth in GDP is likely to be higher for Brazil than for Mexico might seem plausible considering Brazil's higher immigration rates, which could boost the labor force. However, high immigration rates alone do not guarantee higher GDP growth if the incoming population does not integrate effectively into the labor market or if other economic conditions are not favorable. Moreover, the high unemployment rate and the high income tax rate in Brazil could deter economic growth. These factors can discourage business investment and labor market participation, potentially leading to less efficient economic output and slower GDP growth compared to Mexico, where lower taxes and a higher male labor participation rate might stimulate economic activity more effectively. C is incorrect. The statement that the growth rate in the labor force will differ more from the population growth for Mexico than for Brazil is not strongly supported by the data. Both countries have high participation rates, but the demographic profiles and immigration patterns do not significantly suggest a greater disparity in Mexico than in Brazil. In fact, Brazil's higher rate of immigration could contribute to a more rapidly changing labor force compared to its population growth. However, without specific data on the age and employment status of the immigrants, and the overall demographic changes in both countries, it is difficult to conclusively say that the disparity in labor force growth relative to population growth will be significantly different between the two countries. ", "explhtml": "<p>The statement that the contribution of the number of average hours worked to output will be greater for Mexico than for Brazil is supported by several factors. Firstly, the male participation rate in Mexico is significantly higher at 90% compared to Brazil&#x27;s 70%. Typically, male workers in many economies tend to work longer hours on average compared to female workers, who might be more likely to engage in part-time work or have career interruptions due to family care responsibilities. Additionally, the lower income tax rate in Mexico at 20% compared to Brazil&#x27;s 35% potentially provides greater net income from work, which can be an incentive for increased labor participation and longer working hours.<\/p><p><b>B is incorrect<\/b>. The statement that future growth in GDP is likely to be higher for Brazil than for Mexico might seem plausible considering Brazil&#x27;s higher immigration rates, which could boost the labor force. However, high immigration rates alone do not guarantee higher GDP growth if the incoming population does not integrate effectively into the labor market or if other economic conditions are not favorable. Moreover, the high unemployment rate and the high income tax rate in Brazil could deter economic growth. These factors can discourage business investment and labor market participation, potentially leading to less efficient economic output and slower GDP growth compared to Mexico, where lower taxes and a higher male labor participation rate might stimulate economic activity more effectively.<\/p><p><b>C is incorrect<\/b>. The statement that the growth rate in the labor force will differ more from the population growth for Mexico than for Brazil is not strongly supported by the data. Both countries have high participation rates, but the demographic profiles and immigration patterns do not significantly suggest a greater disparity in Mexico than in Brazil. In fact, Brazil&#x27;s higher rate of immigration could contribute to a more rapidly changing labor force compared to its population growth. However, without specific data on the age and employment status of the immigrants, and the overall demographic changes in both countries, it is difficult to conclusively say that the disparity in labor force growth relative to population growth will be significantly different between the two countries. <\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth, LOS 2(g): Explain how demographics, immigration, and labor force participation affect the rate and sustainability of economic growth<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Allan Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Armando Franco is a freelance economist who formerly worked as a full-time employee at Allan Associates (ALASS) - an investment advisory firm in Massachusetts. His work at ALASS was highly recognized. The firm&#x27;s research department would often call upon him to assist with ongoing projects. Presently, Franco is working with the research team at ALASS to determine global macroeconomic forecasts for their international investments. As a first step, Franco performed cross-country comparisons of the GDP growth rate. Since each country presented data in its own currency, Franco would convert the data into U.S. dollars to ensure accuracy in comparison. One of the company’s analysts – Mike Derry -- sought to know more about the conversion. Franco made the following comment:<\/p><p>“The conversion can be made using either current market exchange rates or the exchange rates implied by purchasing power parity (PPP). I prefer using the market exchange rates because they account for a wide range of goods and services, and express market expectations. On the other hand, PPP rarely holds in the short-term, and is only applicable over significantly long investment horizons.”<\/p><p>As a second step, Franco used his estimated economic growth figures to determine stock prices and stock market growth. He made the following comment:<\/p><p>“Over long horizons, the percentage change in stock market value will equal the percentage change in GDP, because the share of profits in GDP and the change in the price-earnings multiple over the long-term will be approximately zero.”<\/p><p>At one point, Derry inquired about the determinants of a country’s long-run economic growth. Franco stated that several theoretical explanations existed to explain the relationship between a country’s output and inputs. Talking about the Cobb-Douglas production function, Franco made the following comment:<\/p><p>“When the share of GDP paid out to suppliers of capital is close to zero, diminishing marginal returns to labor will be quite significant.”<\/p><p>Continuing with the discussion, Derry made the following comment:<\/p><p>“I believe that if the share of GDP paid out to suppliers of capital is close to one, the capital elasticity of output would be high.”<\/p><p>Franco used macroeconomic forecasts provided by the research department at ALASS to decompose the GDP growth of Germany into its constituents. Exhibit 1 displays the data provided by the firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0007.webp\" style=\"max-width:min(100%,340px)\" alt=\"Exhibit 1 Macroeconomic forecasts for Germany\"><p>Expected growth rate of capital 1.5%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0008.webp\" style=\"max-width:min(100%,302px)\" alt=\"Expected growth rate of labor 2.3% α 0.6 Potential GDP growth rate 6.7%\"><p>After making his conclusions about the growth rate of Germany and possible potential investments in the country, Franco asked Derry to obtain labor workforce information in Brazil and Mexico, two developing economies. Exhibit 2 displays the data assembled.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0009.webp\" style=\"max-width:min(100%,500px)\" alt=\"Exhibit 2 Labor Input Data in Brazil and Mexico (2011) Brazil Mexico Population 50.5 million 54.5 million\"><p>Immigration (2005-2011) 6.758 million 2.198 million<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0010.webp\" style=\"max-width:min(100%,392px)\" alt=\"% of population under 15 22 17 % of population over 60 12 18 Male participation rate 70% 90% Female participation rate 90% 70% Unemployment rate 23% 32% Income tax rate 35% 20%\"><\/div><\/details><div class=\"qtext\"><p>Which one of the following comparative statements is most consistent with the data given for the Brazilian and Mexican economies:<\/p><\/div>", "subj": "economics"}, {"n": 5, "q": "The forward premium for a 1-year forward contract for C$/U.S$ would be closest to:", "opts": ["-3.090%", "-2.347%", "-3.009%"], "ans": "B", "expl": "The calculation of the forward premium or discount for a currency pair involves the interest rate differential between the two currencies. In this case, we are considering the C$/U.S.$ currency pair. The formula to calculate the forward premium or discount is given by: Applying the given interest rates for the Canadian dollar (foreign) and the U.S. dollar (domestic), we have: A is incorrect. It suggests a forward premium/discount of -3.09%, which is not supported by the calculation. The error in this option likely arises from a misunderstanding or incorrect application of the interest rates or the formula itself. The calculated forward discount of approximately -2.347% , indicating that option A overestimates the magnitude of the discount. C is incorrect. Option C, which suggests a forward premium/discount of -3.009%, also does not align with the calculated value. This option, like option A, appears to overestimate the forward discount. The discrepancy might stem from an incorrect interpretation of the interest rate differential or a miscalculation in applying the formula. The correct calculation, as shown, yields a result that is nearest to option B, making option C an inaccurate choice. ", "explhtml": "<p>The calculation of the forward premium or discount for a currency pair involves the interest rate differential between the two currencies. In this case, we are considering the C$/U.S.$ currency pair. The formula to calculate the forward premium or discount is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0014.webp\" style=\"max-width:min(100%,527px)\" alt=\"(1 + Foreign Interest Rate) Forward Premium/Discount = ( −1) × 100 (1 + Domestic Interest Rate)\"><p>Applying the given interest rates for the Canadian dollar (foreign) and the U.S. dollar (domestic), we have:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0015.webp\" style=\"max-width:min(100%,758px)\" alt=\"(1 + 0.04) 1.04 Forward Premium/Discount = ( −1) × 100 = ( −1) × 100 = (0.9765 −1) × 100 = −2 (1 + 0.065) 1.065\"><p><b>A is incorrect<\/b>. It suggests a forward premium/discount of -3.09%, which is not supported by the calculation. The error in this option likely arises from a misunderstanding or incorrect application of the interest rates or the formula itself. The calculated forward discount of approximately -2.347% , indicating that option A overestimates the magnitude of the discount.<\/p><p><b>C is incorrect<\/b>. Option C, which suggests a forward premium/discount of -3.009%, also does not align with the calculated value. This option, like option A, appears to overestimate the forward discount. The discrepancy might stem from an incorrect interpretation of the interest rate differential or a miscalculation in applying the formula. The correct calculation, as shown, yields a result that is nearest to option B, making option C an inaccurate choice. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (c): explain spot and forward rates and calculate the forward premium/discount for a given currency<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Black-Rock Investments<\/summary><div class=\"vig-body\"><p>Carlos Ford, a portfolio manager and exchange rate specialist, has worked with Black-Rock Investments (BRON) - a capital management firm - for the past 15 years. Ford resigned from BRON last year and now works as a currency manager and consultant for several investment firms. Last week, Ford was invited by Michael Wagle - a friend and a financial analyst - to advise him on an investment made in Canadian dollars. Wagle presented him with the following information:<\/p><p>C$/U.S.$ spot rate (mid-market): 0.856<\/p><p>One-year Canadian deposit rate: 4.00%<\/p><p>One-year U.S. deposit rate: 6.50%<\/p><p>Wagle added:<\/p><p>“I am not sure how the C$/US$ exchange rate will change in the future, but I would like to generate an almost riskless profit on my one-year investment in Canadian dollars. Would that be possible?”<\/p><p>After reviewing the data presented before him, Ford made the following comments:<\/p><p>Comment 1: “I expect the Canadian dollar to appreciate against the U.S. dollar over the coming year.”<\/p><p>Comment 2: “Going by the current one-year forward points and my analysis, I believe that the U.S. dollar will sell at a forward discount”<\/p><p>In the course of their discussion on exchange rates and the effects of various factors on their future movements, Ford made the following statements:<\/p><p>Statement 1: “For an emerging economy with low capital mobility, a uniformly expansionary fiscal/monetary policy mix will be bearish for its currency, and a uniformly restrictive fiscal/monetary policy mix will be bullish.”<\/p><p>Statement 2: “For countries following an expansionary monetary policy along with a fixed exchange rate policy, the actions taken by the central bank to maintain the level of the exchange rate will offset the effects of the policy. However, in cases where countries are following an expansionary fiscal policy, steps taken to maintain a fixed exchange rate will reinforce the impact of the expansionary fiscal policy.”<\/p><p>Ford then talked about the Taylor Rule, used by central banks to determine the appropriate policy rate as a function of their neutral rate, inflation and output targets, and the observed deviations from those targets.<\/p><\/div><\/details><div class=\"qtext\"><p>The forward premium for a 1-year forward contract for C$/U.S$ would be closest to:<\/p><\/div>", "subj": "economics"}, {"n": 6, "q": "Assuming uncovered interest parity holds, over the next year, the expected change in the C$/U.S$ is closest to:", "opts": ["4%", "2%", "-2.50%"], "ans": "C", "expl": "The expected change in the C$/U.S.$ exchange rate can be calculated using the concept of uncovered interest parity (UIP), which states that the expected depreciation or appreciation of a currency is equal to the difference in interest rates between two countries. In this scenario, the one-year Canadian deposit rate is 4.00%, and the one-year U.S. deposit rate is 6.50%. Therefore, the expected appreciation of the Canadian dollar relative to the U.S. dollar is calculated as the difference between these two rates: Expected change in C/U. S. = Canadian interest rate −U.S. interest rate = 4.00% −6.50% = −2.50 This calculation shows that the Canadian dollar is expected to depreciate by 2.5% relative to the U.S. dollar over the next year, assuming that no other market forces interfere and that UIP holds. This supports the selection of option C as the correct answer. A is incorrect. It suggests an appreciation of 4%, which contradicts the calculation based on the interest rate differential. The Canadian interest rate is lower than the U.S. rate, which, according to UIP, should result in the Canadian dollar depreciating, not appreciating. The 4% figure does not align with the calculated -2.5% change, and thus, option A is not supported by the interest rate data provided. B is incorrect.It suggests a 2% change, also does not align with the UIP calculation. The correct calculation of the expected change in the exchange rate, as derived from the difference in interest rates (4.00% - 6.50%), results in -2.5%. The 2% figure is not only incorrect in terms of its magnitude but also in its direction, as it does not reflect the depreciation indicated by the negative result of the calculation. Therefore, option B is not a valid choice based on the given financial data. ", "explhtml": "<p>The expected change in the C$/U.S.$ exchange rate can be calculated using the concept of uncovered interest parity (UIP), which states that the expected depreciation or appreciation of a currency is equal to the difference in interest rates between two countries. In this scenario, the one-year Canadian deposit rate is 4.00%, and the one-year U.S. deposit rate is 6.50%. Therefore, the expected appreciation of the Canadian dollar relative to the U.S. dollar is calculated as the difference between these two rates:<\/p><p>Expected change in C/U. S. = Canadian interest rate −U.S. interest rate = 4.00% −6.50% = −2.50<\/p><p>This calculation shows that the Canadian dollar is expected to depreciate by 2.5% relative to the U.S. dollar over the next year, assuming that no other market forces interfere and that UIP holds. This supports the selection of option C as the correct answer.<\/p><p><b>A is incorrect<\/b>. It suggests an appreciation of 4%, which contradicts the calculation based on the interest rate differential. The Canadian interest rate is lower than the U.S. rate, which, according to UIP, should result in the Canadian dollar depreciating, not appreciating. The 4% figure does not align with the calculated -2.5% change, and thus, option A is not supported by the interest rate data provided.<\/p><p><b>B is incorrect<\/b>.It suggests a 2% change, also does not align with the UIP calculation. The correct calculation of the expected change in the exchange rate, as derived from the difference in interest rates (4.00% - 6.50%), results in -2.5%. The 2% figure is not only incorrect in terms of its magnitude but also in its direction, as it does not reflect the depreciation indicated by the negative result of the calculation. Therefore, option B is not a valid choice based on the given financial data. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(g): Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Black-Rock Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carlos Ford, a portfolio manager and exchange rate specialist, has worked with Black-Rock Investments (BRON) - a capital management firm - for the past 15 years. Ford resigned from BRON last year and now works as a currency manager and consultant for several investment firms. Last week, Ford was invited by Michael Wagle - a friend and a financial analyst - to advise him on an investment made in Canadian dollars. Wagle presented him with the following information:<\/p><p>C$/U.S.$ spot rate (mid-market): 0.856<\/p><p>One-year Canadian deposit rate: 4.00%<\/p><p>One-year U.S. deposit rate: 6.50%<\/p><p>Wagle added:<\/p><p>“I am not sure how the C$/US$ exchange rate will change in the future, but I would like to generate an almost riskless profit on my one-year investment in Canadian dollars. Would that be possible?”<\/p><p>After reviewing the data presented before him, Ford made the following comments:<\/p><p>Comment 1: “I expect the Canadian dollar to appreciate against the U.S. dollar over the coming year.”<\/p><p>Comment 2: “Going by the current one-year forward points and my analysis, I believe that the U.S. dollar will sell at a forward discount”<\/p><p>In the course of their discussion on exchange rates and the effects of various factors on their future movements, Ford made the following statements:<\/p><p>Statement 1: “For an emerging economy with low capital mobility, a uniformly expansionary fiscal/monetary policy mix will be bearish for its currency, and a uniformly restrictive fiscal/monetary policy mix will be bullish.”<\/p><p>Statement 2: “For countries following an expansionary monetary policy along with a fixed exchange rate policy, the actions taken by the central bank to maintain the level of the exchange rate will offset the effects of the policy. However, in cases where countries are following an expansionary fiscal policy, steps taken to maintain a fixed exchange rate will reinforce the impact of the expansionary fiscal policy.”<\/p><p>Ford then talked about the Taylor Rule, used by central banks to determine the appropriate policy rate as a function of their neutral rate, inflation and output targets, and the observed deviations from those targets.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming uncovered interest parity holds, over the next year, the expected change in the C$/U.S$ is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 7, "q": "In equilibrium, if the forward exchange rate is an unbiased predictor of the spot exchange rate then, in one year:", "opts": ["The covered interest rate parity will hold.", "The percentage change in the C$/US$ spot exchange rate will be -2.5%, and the US$ will trade at a forward discount of 2.5%.", "The US$ will trade at a forward discount of 2.5%, but the percentage change in the spot exchange rate will depend on the number of risk-neutral investors in the market."], "ans": "B", "expl": "When considering the forward exchange rate as an unbiased predictor of the future spot exchange rate, it implies that the expected future spot rate equals the forward rate. This is a fundamental concept in foreign exchange markets, often referred to as the unbiased forward rate hypothesis. In this scenario, the forward rate should reflect all available information about future exchange rates, and thus, the expected change in the spot rate should align with the forward rate differential. In this case, the interest rate differential between the Canadian and U.S. deposit rates is -2.50% (4.00% - 6.50%). If the forward rate is an unbiased predictor, the expected change in the spot rate should also be -2.50%. This aligns with the forward discount of the U.S. dollar against the Canadian dollar, indicating that the U.S. dollar is expected to weaken relative to the Canadian dollar by 2.5% over the year. This scenario supports the concept of uncovered interest rate parity, where the expected depreciation or appreciation of a currency is offset by the interest rate differential. A is incorrect. The statement that covered interest rate parity will hold does not directly answer the question regarding the unbiased nature of the forward rate as a predictor of the future spot rate. Covered interest rate parity (CIP) focuses on the relationship between the forward rates, spot rates, and interest rates to prevent arbitrage opportunities, but it does not provide information on the expected future spot rates. CIP ensures no arbitrage based on the interest rate differential and the forward premium or discount, but it does not imply that the forward rate predicts the future spot rate accurately. C is incorrect. This option introduces an additional variable - the number of risk-neutral investors in the market - which complicates the straightforward relationship implied by the unbiased forward rate hypothesis. The presence of risk-neutral investors affects market dynamics and pricing, but the fundamental relationship in this question revolves around the interest rate differential and its direct impact on the forward and expected future spot rates. The hypothesis that the forward rate predicts the future spot rate does not inherently depend on the composition of market participants but rather on the assumption that the market incorporates all available information into the forward rate. ", "explhtml": "<p>When considering the forward exchange rate as an unbiased predictor of the future spot exchange rate, it implies that the expected future spot rate equals the forward rate. This is a fundamental concept in foreign exchange markets, often referred to as the unbiased forward rate hypothesis. In this scenario, the forward rate should reflect all available information about future exchange rates, and thus, the expected change in the spot rate should align with the forward rate differential.<\/p><p>In this case, the interest rate differential between the Canadian and U.S. deposit rates is -2.50% (4.00% - 6.50%). If the forward rate is an unbiased predictor, the expected change in the spot rate should also be -2.50%. This aligns with the forward discount of the U.S. dollar against the Canadian dollar, indicating that the U.S. dollar is expected to weaken relative to the Canadian dollar by 2.5% over the year. This scenario supports the concept of uncovered interest rate parity, where the expected depreciation or appreciation of a currency is offset by the interest rate differential.<\/p><p><b>A is incorrect.<\/b> The statement that covered interest rate parity will hold does not directly answer the question regarding the unbiased nature of the forward rate as a predictor of the future spot rate. Covered interest rate parity (CIP) focuses on the relationship between the forward rates, spot rates, and interest rates to prevent arbitrage opportunities, but it does not provide information on the expected future spot rates. CIP ensures no arbitrage based on the interest rate differential and the forward premium or discount, but it does not imply that the forward rate predicts the future spot rate accurately.<\/p><p><b>C is incorrect.<\/b> This option introduces an additional variable - the number of risk-neutral investors in the market - which complicates the straightforward relationship implied by the unbiased forward rate hypothesis. The presence of risk-neutral investors affects market dynamics and pricing, but the fundamental relationship in this question revolves around the interest rate differential and its direct impact on the forward and expected future spot rates. The hypothesis that the forward rate predicts the future spot rate does not inherently depend on the composition of market participants but rather on the assumption that the market incorporates all available information into the forward rate. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g): Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Black-Rock Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carlos Ford, a portfolio manager and exchange rate specialist, has worked with Black-Rock Investments (BRON) - a capital management firm - for the past 15 years. Ford resigned from BRON last year and now works as a currency manager and consultant for several investment firms. Last week, Ford was invited by Michael Wagle - a friend and a financial analyst - to advise him on an investment made in Canadian dollars. Wagle presented him with the following information:<\/p><p>C$/U.S.$ spot rate (mid-market): 0.856<\/p><p>One-year Canadian deposit rate: 4.00%<\/p><p>One-year U.S. deposit rate: 6.50%<\/p><p>Wagle added:<\/p><p>“I am not sure how the C$/US$ exchange rate will change in the future, but I would like to generate an almost riskless profit on my one-year investment in Canadian dollars. Would that be possible?”<\/p><p>After reviewing the data presented before him, Ford made the following comments:<\/p><p>Comment 1: “I expect the Canadian dollar to appreciate against the U.S. dollar over the coming year.”<\/p><p>Comment 2: “Going by the current one-year forward points and my analysis, I believe that the U.S. dollar will sell at a forward discount”<\/p><p>In the course of their discussion on exchange rates and the effects of various factors on their future movements, Ford made the following statements:<\/p><p>Statement 1: “For an emerging economy with low capital mobility, a uniformly expansionary fiscal/monetary policy mix will be bearish for its currency, and a uniformly restrictive fiscal/monetary policy mix will be bullish.”<\/p><p>Statement 2: “For countries following an expansionary monetary policy along with a fixed exchange rate policy, the actions taken by the central bank to maintain the level of the exchange rate will offset the effects of the policy. However, in cases where countries are following an expansionary fiscal policy, steps taken to maintain a fixed exchange rate will reinforce the impact of the expansionary fiscal policy.”<\/p><p>Ford then talked about the Taylor Rule, used by central banks to determine the appropriate policy rate as a function of their neutral rate, inflation and output targets, and the observed deviations from those targets.<\/p><\/div><\/details><div class=\"qtext\"><p>In equilibrium, if the forward exchange rate is an unbiased predictor of the spot exchange rate then, in one year:<\/p><\/div>", "subj": "economics"}, {"n": 8, "q": "Ford is most accurate with respect to:", "opts": ["Statement 1 only.", "Both statements 1 and 2.", "Neither Statement 1 nor Statement 2."], "ans": "A", "expl": "Ford's accuracy in his statements can be analyzed as follows: Statement 1 states that for an emerging economy, a uniformly expansionary fiscal/monetary policy mix will be bearish for its currency, while a uniformly restrictive fiscal/monetary policy mix will be bullish. This statement is accurate because expansionary policies typically lead to lower interest rates, which reduce the attractiveness of holding assets denominated in that currency, thereby depreciating the currency. Conversely, restrictive policies lead to higher interest rates, attracting foreign capital and appreciating the currency. This understanding aligns with basic economic principles of supply and demand in currency markets, where the interest rate differential plays a crucial role in determining the flow of capital and consequently, the exchange rate movements. B is incorrect. The statement that both statements are accurate is incorrect because the second statement contains inaccuracies. While the first part of statement 2 correctly identifies that expansionary monetary policy, when paired with a fixed exchange rate, requires intervention to maintain the exchange rate, the second part inaccurately describes the effects of an expansionary fiscal policy under a fixed exchange rate regime. In reality, expansionary fiscal policy under a fixed exchange rate can lead to increased domestic demand, which typically results in higher imports. To maintain the fixed exchange rate, the central bank must intervene, often by selling foreign reserves to buy domestic currency, which can lead to a depletion of reserves and potential financial instability if not managed carefully. This complexity and potential for negative outcomes are not acknowledged in Ford's overly simplistic explanation. C is incorrect. The option stating that neither statement is accurate is incorrect because statement 1 is indeed accurate. It correctly reflects the impact of fiscal and monetary policies on an emerging economy's currency as influenced by global capital flows and interest rate differentials. The understanding of these dynamics is crucial for currency valuation and exchange rate predictions, making statement 1 a valid and insightful observation about economic policy impacts on currency markets. "
