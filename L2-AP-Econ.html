e starts with EUR 1 million is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 29, "q": "According to the growth accounting equation, the two countries’ potential GDP growth rate will be closest to:", "opts": ["Petronia: 6.50%; Coaldovia: 4.30%", "Petronia: 6.00%&sem; Coaldovia: 4.30%", "Petronia: 6.00%; Coaldovia: 3.25%"], "ans": "B", "expl": "According to the growth accounting equation, the potential GDP growth rate can be calculated using the formula: Potential GDP growth rate = Rate of technological progress + (Share of capital in GDP)(Growth ra For Petronia, the calculation is as follows: Potential GDP growth rate for Petronia = 2.75% + (0.3)(2.50%) + (0.7)(3.50%) = 2.75% + 0.75% + For Coaldovia, the calculation is: Potential GDP growth rate for Coaldovia = 3.00% + (0.55)(1.50%) + (0.45)(1.00%) = 3.00% + 0.82 These calculations show that the potential GDP growth rates for Petronia and Coaldovia are approximately 5.95% and 4.275%, respectively. Option B, which states Petronia: 6.00% and Coaldovia: 4.30%, is the closest to these calculated values, making it the correct answer. A is incorrect. It suggests potential GDP growth rates of Petronia: 6.50% and Coaldovia: 4.30%. The calculation for Petronia, however, yields a growth rate closer to 6.00%, not 6.50%. The overestimation of Petronia in option A makes it incorrect, as the precise calculation based on the growth accounting equation provides a more accurate estimate closer to 6.00%. C is incorrect. It proposes potential GDP growth rates of Petronia: 6.00% and Coaldovia: 3.25%. While the rate for Petronia aligns closely with the calculated 5.95%, the rate for Coaldovia in this option is significantly underestimated. The calculated growth rate for Coaldovia is approximately 4.275%, making the 3.25% in option C too low. This discrepancy in the Coaldovia growth rate renders option C incorrect. ", "explhtml": "<p>According to the growth accounting equation, the potential GDP growth rate can be calculated using the formula:<\/p><p>Potential GDP growth rate = Rate of technological progress + (Share of capital in GDP)(Growth ra<\/p><p>For Petronia, the calculation is as follows:<\/p><p>Potential GDP growth rate for Petronia = 2.75% + (0.3)(2.50%) + (0.7)(3.50%) = 2.75% + 0.75% +<\/p><p>For Coaldovia, the calculation is:<\/p><p>Potential GDP growth rate for Coaldovia = 3.00% + (0.55)(1.50%) + (0.45)(1.00%) = 3.00% + 0.82<\/p><p>These calculations show that the potential GDP growth rates for Petronia and Coaldovia are approximately 5.95% and 4.275%, respectively. Option B, which states Petronia: 6.00% and Coaldovia: 4.30%, is the closest to these calculated values, making it the correct answer.<\/p><p><b>A is incorrect<\/b>. It suggests potential GDP growth rates of Petronia: 6.50% and Coaldovia: 4.30%. The calculation for Petronia, however, yields a growth rate closer to 6.00%, not 6.50%. The overestimation of Petronia in option A makes it incorrect, as the precise calculation based on the growth accounting equation provides a more accurate estimate closer to 6.00%.<\/p><p><b>C is incorrect<\/b>. It proposes potential GDP growth rates of Petronia: 6.00% and Coaldovia: 3.25%. While the rate for Petronia aligns closely with the calculated 5.95%, the rate for Coaldovia in this option is significantly underestimated. The calculated growth rate for Coaldovia is approximately 4.275%, making the 3.25% in option C too low. This discrepancy in the Coaldovia growth rate renders option C incorrect. <\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (e): Demonstrate forecasting potential GDP based on growth accounting relations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Mark Weber<\/summary><div class=\"vig-body\"><p>Mark Weber, CFA is a junior analyst with Pearl River Investment Research &amp; Advisors (PRIRA) based in Dallas, Texas. Pearl River Investment, which serves mostly institutional investors, is well-known for providing emerging and frontier market focused investment research. Texas Public Workers’ Retirement Fund (TPWRF), a large institutional investor, has approached PRIRA before investing in two emerging economies – Petronia and Coaldovia. TPWRF believes that long-term stock market returns are directly correlated with a country’s GDP growth rate. TPWRF seeks advice from PRIRA about potential GDP growth rates, interest rate changes, exchange rate fluctuations, and fiscal policies for both countries.<\/p><p>Weber searches government websites, industry associations, central banks, and reputable political and economic newspapers to prepare a snapshot of both economies&#x27; political and economic conditions. Based on these readings, Weber has prepared a brief profile, a part of which is given below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0053.webp\" style=\"max-width:min(100%,581px)\" alt=\"Exhibit 1: Political and Economic Conditions Petronia Coaldovia The growth rate of technological progress 2.75% 3.00% Share of capital in GDP 0.3 0.55 The growth rate of capital 2.50% 1.50% The growth rate of labor 3.50% 1.00% Long-term growth rate in labor productivity 3.00% 2.25%\"><p>In addition to this quantitative data, some nuggets of qualitative information about politico-economic development in Petronia and Coaldovia also draw Weber’s attention.<\/p><p>Petronia<\/p><p>Petronia’s government has failed to get the national parliament’s approval for<\/p><p>legislation to reform the labor market.<\/p><p>The government plans to continue economic policies of import substitution for the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0054.webp\" style=\"max-width:min(100%,158px)\" alt=\"foreseeable future.\"><p>The government plans to subsidize technical education.<\/p><p>Coaldovia<\/p><p>Coaldovia’s government plans to create a national monopoly to explore, extract, and<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0055.webp\" style=\"max-width:min(100%,158px)\" alt=\"export natural gas.\"><p>Economic decision makers believe trade and exports will be the key drivers of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0056.webp\" style=\"max-width:min(100%,149px)\" alt=\"economic growth.\"><p>The average age for the working population is 42 years.<\/p><p>Capital Ride Hedge Fund (CHF) is another client of PRIRA. CHF has significant investment exposure in Petronia. Three months earlier, it sold 16.5 million Petronian Dollars (PED) through a 9-month forward contract at an exchange rate of 8.2550 per US Dollar. CHF has approached PRIRA to mark its forward position to market. Weber gathers the following information to determine this.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0057.webp\" style=\"max-width:min(100%,541px)\" alt=\"Exhibit 2: Petronian Dollars (PED) Spot rate – (PED/USD) 8.3050 – 8.3250 Six months forward points -250/-300 Six months interest rate on PED (annualized) 6.50% Six months interest rate on USD (annualized) 3.00%\"><p>CHF is also planning to enter into a carry trade, borrowing 1,000 in Japanese Yen (JPY) and investing in Coaldovian Dollars (COD). However, CHF’s fund manager wants to know the likely returns from this carry trade and the warning signs of any Coaldovian Dollar crisis in the next year. Interest rates and exchange rates for both currencies are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0058.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 3: Coaldovian Dollar (COD and Japanese Yen (JPY) Today’s One-Year Spot Rate Expected Spot Rate Currency Pair Interest Rates Today One Year Later COD  12% COD/USD 20.75 21.25 JPY  1.5% JPY/USD 101.50 100.75\"><p>Addressing the fund manager’s concern about a potential currency crisis, Weber lists the following as warning signs that precede a currency crisis and suggests that they be regularly monitored.<\/p><p>Significant deterioration in trade<\/p><p>P oviding emerging and frontier market focused investment research. Texas Public Workers’ Retirement Fund (TPWRF), a large institutional investor, has approached PRIRA before investing in two emerging economies – Petronia and Coaldovia. TPWRF believes that long-term stock market returns are directly correlated with a country’s GDP growth rate. TPWRF seeks advice from PRIRA about potential GDP growth rates, interest rate changes, exchange rate fluctuations, and fiscal policies for both countries.<\/p><p>Weber searches government websites, industry associations, central banks, and reputable political and economic newspapers to prepare a snapshot of both economies&#x27; political and economic conditions. Based on these readings, Weber has prepared a brief profile, a part of which is given below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0053.webp\" style=\"max-width:min(100%,581px)\" alt=\"Exhibit 1: Political and Economic Conditions Petronia Coaldovia The growth rate of technological progress 2.75% 3.00% Share of capital in GDP 0.3 0.55 The growth rate of capital 2.50% 1.50% The growth rate of labor 3.50% 1.00% Long-term growth rate in labor productivity 3.00% 2.25%\"><p>In addition to this quantitative data, some nuggets of qualitative information about politico-economic development in Petronia and Coaldovia also draw Weber’s attention.<\/p><p>Petronia<\/p><p>Petronia’s government has failed to get the national parliament’s approval for<\/p><p>legislation to reform the labor market.<\/p><p>The government plans to continue economic policies of import substitution for the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0054.webp\" style=\"max-width:min(100%,158px)\" alt=\"foreseeable future.\"><p>The government plans to subsidize technical education.<\/p><p>Coaldovia<\/p><p>Coaldovia’s government plans to create a national monopoly to explore, extract, and<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0055.webp\" style=\"max-width:min(100%,158px)\" alt=\"export natural gas.\"><p>Economic decision makers believe trade and exports will be the key drivers of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0056.webp\" style=\"max-width:min(100%,149px)\" alt=\"economic growth.\"><p>The average age for the working population is 42 years.<\/p><p>Capital Ride Hedge Fund (CHF) is another client of PRIRA. CHF has significant investment exposure in Petronia. Three months earlier, it sold 16.5 million Petronian Dollars (PED) through a 9-month forward contract at an exchange rate of 8.2550 per US Dollar. CHF has approached PRIRA to mark its forward position to market. Weber gathers the following information to determine this.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0057.webp\" style=\"max-width:min(100%,541px)\" alt=\"Exhibit 2: Petronian Dollars (PED) Spot rate – (PED/USD) 8.3050 – 8.3250 Six months forward points -250/-300 Six months interest rate on PED (annualized) 6.50% Six months interest rate on USD (annualized) 3.00%\"><p>CHF is also planning to enter into a carry trade, borrowing 1,000 in Japanese Yen (JPY) and investing in Coaldovian Dollars (COD). However, CHF’s fund manager wants to know the likely returns from this carry trade and the warning signs of any Coaldovian Dollar crisis in the next year. Interest rates and exchange rates for both currencies are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0058.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit 3: Coaldovian Dollar (COD and Japanese Yen (JPY) Today’s One-Year Spot Rate Expected Spot Rate Currency Pair Interest Rates Today One Year Later COD  12% COD/USD 20.75 21.25 JPY  1.5% JPY/USD 101.50 100.75\"><p>Addressing the fund manager’s concern about a potential currency crisis, Weber lists the following as warning signs that precede a currency crisis and suggests that they be regularly monitored.<\/p><p>Significant deterioration in trade<\/p><p>Precipitous drop in foreign exchange reserves Sharp rise in government debt growth<\/p><\/div><\/details><div class=\"qtext\"><p>The one-year all-in expected profit from the carry trade for COD in JPY will be closest to:<\/p><\/div>", "subj": "economics"}, {"n": 31, "q": "Applying Robert Solow’s neoclassical theory of growth, steady state GDP growth rate for Coaldovia exceeds Petronia’s by:", "opts": ["0.25%", "0.24%", "1.25%"], "ans": "B", "expl": "Applying Robert Solow's neoclassical theory of growth, the steady state GDP growth rate for a country can be calculated using the formula: For Petronia, the total factor productivity (TFP) growth rate is 2.75%, and the share of capital in GDP is 0.3. Therefore, the steady state GDP growth rate for Petronia is calculated as follows: For Coaldovia, the TFP growth rate is 3.00%, and the share of capital in GDP is 0.55. Thus, the steady state GDP growth rate for Coaldovia is: The difference in the steady state GDP growth rates between Coaldovia and Petronia is: This calculation shows that the steady state GDP growth rate for Coaldovia does exceeds that of Petronia; instead, it is higher by 0.24%. A is incorrect. The initial calculation provided in the question incorrectly suggests that Coaldovia's steady state GDP growth rate exceeds that of Petronia by 0.238%, which corresponds to 0.25% when rounded. However, the detailed recalculation using the correct formula and inputs from the provided data shows that Coaldovia's growth rate is actually higher than Petronia's by 0.24%. This discrepancy highlights the importance of accurate calculations and understanding the impact of the share of capital in GDP and labor force growth rate on the overall GDP growth rate. C is incorrect. Claiming a difference of 1.25% in the steady state GDP growth rates between Coaldovia and Petronia is incorrect and not supported by the data or the calculations based on Solow's model. This option exaggerates the difference even more than the other options and is not grounded in the economic realities presented by the data. The recalculated figures clearly show a decrease rather than such a significant increase, underscoring the critical nature of precise and methodical economic analysis in professional financial contexts. ", "explhtml": "<p>Applying Robert Solow&#x27;s neoclassical theory of growth, the steady state GDP growth rate for a country can be calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0062.webp\" style=\"max-width:min(100%,667px)\" alt=\"TFP Growth rate Steady state GDP growth rate = ( ) + Labor force growth rate. 1 −Share of capital in GDP\"><p>For Petronia, the total factor productivity (TFP) growth rate is 2.75%, and the share of capital in GDP is 0.3. Therefore, the steady state GDP growth rate for Petronia is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0063.webp\" style=\"max-width:min(100%,695px)\" alt=\"2.75% Steady state GDP growth rate for Petronia = ( 1 −0.3 ) + 3.50% = 3.93% + 3.50% = 7.43%.\"><p>For Coaldovia, the TFP growth rate is 3.00%, and the share of capital in GDP is 0.55. Thus, the steady state GDP growth rate for Coaldovia is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0064.webp\" style=\"max-width:min(100%,713px)\" alt=\"3.00% Steady state GDP growth rate for Coaldovia = ( 1 −0.55 ) + 1.00% = 6.67% + 1.00% = 7.67%.\"><p>The difference in the steady state GDP growth rates between Coaldovia and Petronia is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0065.webp\" style=\"max-width:min(100%,200px)\" alt=\"7.67% −7.43% = 0.24%.\"><p>This calculation shows that the steady state GDP growth rate for Coaldovia does exceeds that of Petronia; instead, it is higher by 0.24%.<\/p><p><b>A is incorrect<\/b>. The initial calculation provided in the question incorrectly suggests that Coaldovia&#x27;s steady state GDP growth rate exceeds that of Petronia by 0.238%, which corresponds to 0.25% when rounded. However, the detailed recalculation using the correct formula and inputs from the provided data shows that Coaldovia&#x27;s growth rate is actually higher than Petronia&#x27;s by 0.24%. This discrepancy highlights the importance of accurate calculations and understanding the impact of the share of capital in GDP and labor force growth rate on the overall GDP growth rate.<\/p><p><b>C is incorrect<\/b>. Claiming a difference of 1.25% in the steady state GDP growth rates between Coaldovia and Petronia is incorrect and not supported by the data or the calculations based on Solow&#x27;s model. This option exaggerates the difference even more than the other options and is not grounded in the economic realities presented by the data. The recalculated figures clearly show a decrease rather than such a significant increase, underscoring the critical nature of precise and methodical economic analysis in professional financial contexts. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (e): demonstrate forecasting potential GDP based on growth accounting relations.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Mark Weber<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mark Weber, CFA is a junior analyst with Pearl River Investment Research &amp; Advisors (PRIRA) based in Dallas, Texas. Pearl River Investment, which serves mostly institutional investors, is well-known for providing emerging and frontier market focused investment research. Texas Public Workers’ Retirement Fund (TPWRF), a large institutional investor, has approached PRIRA before investing in two emerging economies – Petronia and Coaldovia. TPWRF believes that long-term stock market returns are directly correlated with a country’s GDP growth rate. TPWRF seeks advice from PRIRA about potential GDP growth rates, interest rate changes, exchange rate fluctuations, an is a premium or discount.", "explhtml": "<p>The forward premium or discount can be calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0072.webp\" style=\"max-width:min(100%,485px)\" alt=\"Forward Rate −Spot Rate Forward Premium/Discount = ( ) × 100 Spot Rate\"><p>Substituting the given values:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0073.webp\" style=\"max-width:min(100%,481px)\" alt=\"112.00 −110.00 Forward Premium/Discount = ( ) × 100 ≈1.81% 110.00\"><p>Since the result is positive, it implies a premium for the USD versus the JPY.<\/p><p><b>B is incorrect.<\/b> The calculation results in a positive number, indicating a premium, not a discount.<\/p><p><b>C is incorrect.<\/b> There is a difference between the forward rate and the spot rate, which means there is a premium or discount.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value, LOS 1 (c) Explain spot and forward rates and calculate the forward premium/ discount for a given currency.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Global Trade Corp (GTC)<\/summary><div class=\"vig-body\"><p>Global Trade Corp (GTC) is a multinational corporation that engages in international trade, with<\/p><p>significant exposure to currency fluctuations between the U.S. dollar (USD) and the Japanese yen<\/p><p>(JPY). The company&#x27;s CFO, Alex Mercer, is analyzing the company&#x27;s risk exposure and<\/p><p>considering future strategic moves in light of macroeconomic forecasts and potential regulatory<\/p><p>changes.<\/p><p>Alex has gathered the following data:<\/p><p><b>Currency Exchange Rates and Equilibrium Data:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0070.webp\" style=\"max-width:min(100%,449px)\" alt=\"Current USD/JPY spot exchange rate: 110.00 Forward exchange rate for USD/JPY (1 year): 112.00 U.S. annual interest rate: 1.75% Japanese annual interest rate: 0.10% U.S. expected inflation rate: 2.50% Japanese expected inflation rate: 0.50%\"><p><b>Economic Growth Projections:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0071.webp\" style=\"max-width:min(100%,718px)\" alt=\"U.S. projected real GDP growth for the next year: 2.50% Japanese projected real GDP growth for the next year: 1.00% Regulatory Factors: Forecasted monetary policy tightening by the U.S. Federal Reserve Proposals for increased trade barriers by the U.S. against certain Japanese imports\"><p>GTC is concerned about how these factors might affect their cash flows from international<\/p><p>operations. Alex needs to report to the board on the potential impact of these factors on USD/JPY<\/p><p>exchange rates and make a recommendation on whether GTC should hedge its currency risk.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the given data, what is the forward premium or discount for the USD/JPY currency pair?<\/p><\/div>", "subj": "economics"}, {"n": 34, "q": "What is the expected change in the USD/JPY spot rate one year from now based on the Relative Purchasing Power Parity (RPPP)?", "opts": ["USD is expected to depreciate.", "JPY is expected to depreciate.", "No change in the USD/JPY spot rate is expected."], "ans": "A", "expl": "According to the RPPP: Expected Change in Exchange Rate = Domestic Inflation Rate −Foreign Inflation Rate Given the U.S. expected inflation rate is higher than the Japanese rate: An exchange rate adjustment will occur where the currency of the country with a higher inflation rate is expected to depreciate. However, since the domestic currency is the JPY, a higher USD inflation rate would mean the USD depreciates against the JPY. B is incorrect. RPPP suggests the opposite due to the U.S. having a higher inflation rate. C is incorrect. RPPP suggests there will be a change due to differing inflation rates.", "explhtml": "<p>According to the RPPP:<\/p><p>Expected Change in Exchange Rate = Domestic Inflation Rate −Foreign Inflation Rate<\/p><p>Given the U.S. expected inflation rate is higher than the Japanese rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0074.webp\" style=\"max-width:min(100%,195px)\" alt=\"2.50% −0.50% = 2.00%\"><p>An exchange rate adjustment will occur where the currency of the country with a higher inflation rate is expected to depreciate. However, since the domestic currency is the JPY, a higher USD inflation rate would mean the USD depreciates against the JPY.<\/p><p><b>B is incorrect.<\/b> RPPP suggests the opposite due to the U.S. having a higher inflation rate.<\/p><p><b>C is incorrect.<\/b> RPPP suggests there will be a change due to differing inflation rates.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value, LOS 1 (e) explain international parity conditions (covered and uncovered interest rate parity, forward rate parity, purchasing power parity, and the international Fisher effect).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Global Trade Corp (GTC)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Global Trade Corp (GTC) is a multinational corporation that engages in international trade, with<\/p><p>significant exposure to currency fluctuations between the U.S. dollar (USD) and the Japanese yen<\/p><p>(JPY). The company&#x27;s CFO, Alex Mercer, is analyzing the company&#x27;s risk exposure and<\/p><p>considering future strategic moves in light of macroeconomic forecasts and potential regulatory<\/p><p>changes.<\/p><p>Alex has gathered the following data:<\/p><p><b>Currency Exchange Rates and Equilibrium Data:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0070.webp\" style=\"max-width:min(100%,449px)\" alt=\"Current USD/JPY spot exchange rate: 110.00 Forward exchange rate for USD/JPY (1 year): 112.00 U.S. annual interest rate: 1.75% Japanese annual interest rate: 0.10% U.S. expected inflation rate: 2.50% Japanese expected inflation rate: 0.50%\"><p><b>Economic Growth Projections:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0071.webp\" style=\"max-width:min(100%,718px)\" alt=\"U.S. projected real GDP growth for the next year: 2.50% Japanese projected real GDP growth for the next year: 1.00% Regulatory Factors: Forecasted monetary policy tightening by the U.S. Federal Reserve Proposals for increased trade barriers by the U.S. against certain Japanese imports\"><p>GTC is concerned about how these factors might affect their cash flows from international<\/p><p>operations. Alex needs to report to the board on the potential impact of these factors on USD/JPY<\/p><p>exchange rates and make a recommendation on whether GTC should hedge its currency risk.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the expected change in the USD/JPY spot rate one year from now based on the Relative Purchasing Power Parity (RPPP)?<\/p><\/div>", "subj": "economics"}, {"n": 35, "q": "Given the projected real GDP growth rates for the U.S. and Japan, which currency is most likely to experience appreciation due to differential economic growth rates?", "opts": ["USD", "JPY", "Neither, as GDP growth rates have no impact on currency exchange rates"], "ans": "A", "expl": "Higher economic growth rates theoretically lead to a stronger currency, as it may result in higher interest rates to control inflation, increased foreign investment inflows, and a higher demand for the currency to facilitate growing trade. With the U.S. having a higher projected real GDP growth rate (2.50%) compared to Japan (1.00%), it is more likely that the USD will appreciate against the JPY. B is incorrect. Given Japan's lower growth projection, the JPY is less likely to appreciate against the USD. C is incorrect. GDP growth rates do influence currency exchange rates by indicating economic strength and potential central bank policies.", "explhtml": "<p>Higher economic growth rates theoretically lead to a stronger currency, as it may result in higher interest rates to control inflation, increased foreign investment inflows, and a higher demand for the currency to facilitate growing trade. With the U.S. having a higher projected real GDP growth rate (2.50%) compared to Japan (1.00%), it is more likely that the USD will appreciate against the JPY.<\/p><p><b>B is incorrect.<\/b> Given Japan&#x27;s lower growth projection, the JPY is less likely to appreciate against the USD.<\/p><p><b>C is incorrect.<\/b> GDP growth rates do influence currency exchange rates by indicating economic strength and potential central bank policies.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value, LOS (j) Explain how flows in the balance of payment accounts affect currency exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Global Trade Corp (GTC)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Global Trade Corp (GTC) is a multinational corporation that engages in international trade, with<\/p><p>significant exposure to currency fluctuations between the U.S. dollar (USD) and the Japanese yen<\/p><p>(JPY). The company&#x27;s CFO, Alex Mercer, is analyzing the company&#x27;s risk exposure and<\/p><p>considering future strategic moves in light of macroeconomic forecasts and potential regulatory<\/p><p>changes.<\/p><p>Alex has gathered the following data:<\/p><p><b>Currency Exchange Rates and Equilibrium Data:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0070.webp\" style=\"max-width:min(100%,449px)\" alt=\"Current USD/JPY spot exchange rate: 110.00 Forward exchange rate for USD/JPY (1 year): 112.00 U.S. annual interest rate: 1.75% Japanese annual interest rate: 0.10% U.S. expected inflation rate: 2.50% Japanese expected inflation rate: 0.50%\"><p><b>Economic Growth Projections:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0071.webp\" style=\"max-width:min(100%,718px)\" alt=\"U.S. projected real GDP growth for the next year: 2.50% Japanese projected real GDP growth for the next year: 1.00% Regulatory Factors: Forecasted monetary policy tightening by the U.S. Federal Reserve Proposals for increased trade barriers by the U.S. against certain Japanese imports\"><p>GTC is concerned about how these factors might affect their cash flows from international<\/p><p>operations. Alex needs to report to the board on the potential impact of these factors on USD/JPY<\/p><p>exchange rates and make a recommendation on whether GTC should hedge its currency risk.<\/p><\/div><\/details><div class=\"qtext\"><p>Given the projected real GDP growth rates for the U.S. and Japan, which currency is most likely to experience appreciation due to differential economic growth rates?<\/p><\/div>", "subj": "economics"}, {"n": 36, "q": "If the U.S. Federal Reserve enacts a forecasted monetary policy tightening, what is the most likely impact on the USD/JPY exchange rate?", "opts": ["USD appreciation", "USD depreciation", "No impact on the exchange rate"], "ans": "A", "expl": "Tightening monetary policy typically involves raising interest rates to control inflation, which can lead to an appreciation of the currency due to greater demand for higher-yielding assets. Thus, if the Federal Reserve tightens monetary policy, it is likely that the USD will appreciate against the JPY. B is incorrect. Tightening monetary policy generally supports currency appreciation, not depreciation. C is incorrect. Monetary policy changes, especially those from major central banks like the Federal Reserve, typically have a significant impact on exchange rates.", "explhtml": "<p>Tightening monetary policy typically involves raising interest rates to control inflation, which can lead to an appreciation of the currency due to greater demand for higher-yielding assets. Thus, if the Federal Reserve tightens monetary policy, it is likely that the USD will appreciate against the JPY.<\/p><p><b>B is incorrect.<\/b> Tightening monetary policy generally supports currency appreciation, not depreciation.<\/p><p><b>C is incorrect.<\/b> Monetary policy changes, especially those from major central banks like the Federal Reserve, typically have a significant impact on exchange rates.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value, LOS (k) Explain the potential effects of monetary and fiscal policy on exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Global Trade Corp (GTC)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Global Trade Corp (GTC) is a multinational corporation that engages in international trade, with<\/p><p>significant exposure to currency fluctuations between the U.S. dollar (USD) and the Japanese yen<\/p><p>(JPY). The company&#x27;s CFO, Alex Mercer, is analyzing the company&#x27;s risk exposure and<\/p><p>considering future strategic moves in light of macroeconomic forecasts and potential regulatory<\/p><p>changes.<\/p><p>Alex has gathered the following data:<\/p><p><b>Currency Exchange Rates and Equilibrium Data:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0070.webp\" style=\"max-width:min(100%,449px)\" alt=\"Current USD/JPY spot exchange rate: 110.00 Forward exchange rate for USD/JPY (1 year): 112.00 U.S. annual interest rate: 1.75% Japanese annual interest rate: 0.10% U.S. expected inflation rate: 2.50% Japanese expected inflation rate: 0.50%\"><p><b>Economic Growth Projections:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0071.webp\" style=\"max-width:min(100%,718px)\" alt=\"U.S. projected real GDP growth for the next year: 2.50% Japanese projected real GDP growth for the next year: 1.00% Regulatory Factors: Forecasted monetary policy tightening by the U.S. Federal Reserve Proposals for increased trade barriers by the U.S. against certain Japanese imports\"><p>GTC is concerned about how these factors might affect their cash flows from international<\/p><p>operations. Alex needs to report to the board on the potential impact of these factors on USD/JPY<\/p><p>exchange rates and make a recommendation on whether GTC should hedge its currency risk.<\/p><\/div><\/details><div class=\"qtext\"><p>If the U.S. Federal Reserve enacts a forecasted monetary policy tightening, what is the most likely impact on the USD/JPY exchange rate?<\/p><\/div>", "subj": "economics"}, {"n": 37, "q": "Based on the quotes in Exhibit 1, the amount Atkins would receive from converting CHF 325,000,000 to Euro is closest to:", "opts": ["EUR 351,922,035.7", "EUR 325,000,000", "EUR 352,074,532"], "ans": "A", "expl": "Because the Atkins is purchasing the base currency, he must pay the offer price of CHF 0.9325 per EUR. B is incorrect. It implies that the conversion rate between CHF and EUR is 1:1. This does not take into account the actual exchange rate given in Exhibit 1. When converting between currencies, one must apply the appropriate conversion rate, which in this case is 0.9325 CHF per EUR. C is incorrect. It uses the bid rate instead of the offer rate.", "explhtml": "<p>Because the Atkins is purchasing the base currency, he must pay the offer price of CHF 0.9325 per EUR.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0078.webp\" style=\"max-width:min(100%,310px)\" alt=\"CHF 325, 000, 000 = EUR 351, 922, 035.7 0.9235 CHF/EUR\"><p><b>B is incorrect.<\/b> It implies that the conversion rate between CHF and EUR is 1:1. This does not take into account the actual exchange rate given in Exhibit 1. When converting between currencies, one must apply the appropriate conversion rate, which in this case is 0.9325 CHF per EUR.<\/p><p><b>C is incorrect.<\/b> It uses the bid rate instead of the offer rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0079.webp\" style=\"max-width:min(100%,297px)\" alt=\"CHF 325, 000, 000 = EUR 352, 074, 532 0.9231 CHF/EUR\"><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(a): calculate and interpret the bid–offer spread on a spot or forward currency quotation and describe the factors that affect the bid–offer spread<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Sully Atkins<\/summary><div class=\"vig-body\"><p>Sully Atkins is the director of finance of a firm headquartered in Germany. He is responsible for<\/p><p>overseeing exposure to price risk in both the commodity and currency markets. Atkins is settling<\/p><p>his end-of-quarter transactions and creating reports. Frank Kruger, a trainee at the firm, assists<\/p><p>him in this process. The firm hedges input costs using forward contracts priced in both US<\/p><p>dollars (USD) and Brazilian reals (BRL). Atkins will receive a customer payment of CHF<\/p><p>325,000,000 (Swiss francs) that he wants to convert to euros (EUR). Kruger gathers the<\/p><p>exchange rates from Dealer A in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0075.webp\" style=\"max-width:min(100%,349px)\" alt=\"Exhibit 1: Spot Exchange Rates by Dealer A Currency Pair Bid Offer Average CHF/EUR 0.9231 0.9235 0.9233 BRL/USD 5.330 5.340 5.335 EUR/JPY 129.65 129.69 129.67 USD/JPY 112.76 112.80 112.78 USD/EUR 0.8586 0.8590 0.8588\"><p>Sea Breeze Ltd, a major supplier, will be paid at the end of the month. Atkins will need to<\/p><p>purchase GBP to settle the arrears. Dealer A has quoted USD/EUR at 0.8576/0.8593. Kruger is<\/p><p>working on another transaction that would involve purchasing BRL 45,000,000 to settle a<\/p><p>pending invoice. He contacts dealer C who quotes EUR/BRL 0.2172/0.2165.<\/p><p>Atkins requests Kruger to ascertain the current 30-day MRRs for three currencies detailed in<\/p><p>Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0076.webp\" style=\"max-width:min(100%,238px)\" alt=\"Exhibit 2: 30-day MRR Annualized Rate Currency 0.351% GBP 0.552% BRL 0.075% EUR\"><p>Atkins anticipates that one of their major Brazilian customers will settle an invoice of BRL<\/p><p>6,500,000 in one month. Three months prior, the firm sold BRL 6,500,000 against the EUR using<\/p><p>a six-month all-in forward price of BRL/USD 5.45. Atkins requests Kruger to collect BRL/USD<\/p><p>forward rates in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0077.webp\" style=\"max-width:min(100%,281px)\" alt=\"Exhibit 3: BRL/USD Forward Rates Maturity Forward Points 1 Month 3.2/3.56 3 Month 12.5/14.2 6 Month 28.0/29.6\"><\/div><\/details><div class=\"qtext\"><p>Based on the quotes in Exhibit 1, the amount Atkins would receive from converting CHF 325,000,000 to Euro is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 38, "q": "Using the quotes from dealer A and the second dealer, the triangular arbitrage profit on the BRL 45,000,000 transaction would be closet to:", "opts": ["EUR 0.0027", "EUR 0", "EUR 90,000"], "ans": "C", "expl": "Using Dealer A’s quote, He can find The bid for BRL/EUR from Dealer A is The offer from Dealer A is To compare with the Dealer C’s quotes he must take the inverse of BRL/EUR for an offer to sell BRL at a rate of And a bid to buy BRL at a rate of Dealer A is effectively quoting EUR/BRL 0.2185/0.2180. An arbitrage opportunity exists. Atkins can purchase BRL from dealer C for EUR 0.2165 and sell it to dealer A for EUR 0.2185. The arbitrage profit is EUR 0.002(0.2185-0.2165). For BRL 45,000,000 A is incorrect. It represents the profit per unit of currency rather than the total profit. The correct calculation of the total arbitrage profit should reflect the full transaction amount, which is more substantial than the per-unit difference. B is incorrect. It suggests no arbitrage opportunity exists. However, the calculations show that there is indeed a profitable arbitrage opportunity between the quotes from Dealer A and the second dealer.", "explhtml": "<p>Using Dealer A’s quote, He can find<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0080.webp\" style=\"max-width:min(100%,168px)\" alt=\"BRL BRL USD EUR = USD × EUR\"><p>The bid for BRL/EUR from Dealer A is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0081.webp\" style=\"max-width:min(100%,428px)\" alt=\"BRL BRL USD EUR bid = USD bid × EUR bid = 5.330 × 0.8586 = 4.5763\"><p>The offer from Dealer A is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0082.webp\" style=\"max-width:min(100%,285px)\" alt=\"BRL = BRL × USD EUR offer USD offer EUR offer = 5.340 × 0.8590 = 4.5870\"><p>To compare with the Dealer C’s quotes he must take the inverse of BRL/EUR for an offer to sell BRL at a rate of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0083.webp\" style=\"max-width:min(100%,165px)\" alt=\"1 = Eur 0.2185 4.5763\"><p>And a bid to buy BRL at a rate of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0084.webp\" style=\"max-width:min(100%,165px)\" alt=\"1 = Eur 0.2180 4.5870\"><p>Dealer A is effectively quoting EUR/BRL 0.2185/0.2180. An arbitrage opportunity exists. Atkins can purchase BRL from dealer C for EUR 0.2165 and sell it to dealer A for EUR 0.2185. The arbitrage profit is EUR 0.002(0.2185-0.2165).<\/p><p>For BRL 45,000,000<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0085.webp\" style=\"max-width:min(100%,281px)\" alt=\"45, 000, 000 × 0.002 = EUR 90, 000\"><p><b>A is incorrect.<\/b> It represents the profit per unit of currency rather than the total profit. The correct calculation of the total arbitrage profit should reflect the full transaction amount, which is more substantial than the per-unit difference.<\/p><p><b>B is incorrect.<\/b> It suggests no arbitrage opportunity exists. However, the calculations show that there is indeed a profitable arbitrage opportunity between the quotes from Dealer A and the second dealer.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(b): Identify a triangular arbitrage opportunity and calculate its profit, given the bid–offer quotations for three currencies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Sully Atkins<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sully Atkins is the director of finance of a firm headquartered in Germany. He is responsible for<\/p><p>overseeing exposure to price risk in both the commodity and currency markets. Atkins is settling<\/p><p>his end-of-quarter transactions and creating reports. Frank Kruger, a trainee at the firm, assists<\/p><p>him in this process. The firm hedges input costs using forward contracts priced in both US<\/p><p>dollars (USD) and Brazilian reals (BRL). Atkins will receive a customer payment of CHF<\/p><p>325,000,000 (Swiss francs) that he wants to convert to euros (EUR). Kruger gathers the<\/p><p>exchange rates from Dealer A in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0075.webp\" style=\"max-width:min(100%,349px)\" alt=\"Exhibit 1: Spot Exchange Rates by Dealer A Currency Pair Bid Offer Average CHF/EUR 0.9231 0.9235 0.9233 BRL/USD 5.330 5.340 5.335 EUR/JPY 129.65 129.69 129.67 USD/JPY 112.76 112.80 112.78 USD/EUR 0.8586 0.8590 0.8588\"><p>Sea Breeze Ltd, a major supplier, will be paid at the end of the month. Atkins will need to<\/p><p>purchase GBP to settle the arrears. Dealer A has quoted USD/EUR at 0.8576/0.8593. Kruger is<\/p><p>working on another transaction that would involve purchasing BRL 45,000,000 to settle a<\/p><p>pending invoice. He contacts dealer C who quotes EUR/BRL 0.2172/0.2165.<\/p><p>Atkins requests Kruger to ascertain the current 30-day MRRs for three currencies detailed in<\/p><p>Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0076.webp\" style=\"max-width:min(100%,238px)\" alt=\"Exhibit 2: 30-day MRR Annualized Rate Currency 0.351% GBP 0.552% BRL 0.075% EUR\"><p>Atkins anticipates that one of their major Brazilian customers will settle an invoice of BRL<\/p><p>6,500,000 in one month. Three months prior, the firm sold BRL 6,500,000 against the EUR using<\/p><p>a six-month all-in forward price of BRL/USD 5.45. Atkins requests Kruger to collect BRL/USD<\/p><p>forward rates in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0077.webp\" style=\"max-width:min(100%,281px)\" alt=\"Exhibit 3: BRL/USD Forward Rates Maturity Forward Points 1 Month 3.2/3.56 3 Month 12.5/14.2 6 Month 28.0/29.6\"><\/div><\/details><div class=\"qtext\"><p>Using the quotes from dealer A and the second dealer, the triangular arbitrage profit on the BRL 45,000,000 transaction would be closet to:<\/p><\/div>", "subj": "economics"}, {"n": 39, "q": "Using Exhibit 3, Kruger is most likely to conclude that one-month USD MRR is:", "opts": ["Above one-month BRL MRR", "Below one-month BRL MRR", "Equal to one-month BRL MRR"], "ans": "B", "expl": "The positive forward points for the BRL/USD pair in Exhibit 2 indicate that the USD is trading at a forward premium across all maturities, including three months. According to covered interest rate parity, a forward rate higher than the spot rate occurs when the foreign risk-free rate (BRL MRR) exceeds the domestic risk-free rate (USD MRR). If covered interest rate parity is breached, traders can seize arbitrage opportunities by exploiting this discrepancy. A is incorrect. If the USD MRR were higher, the forward rate would likely be lower than the spot rate, not higher. This would contradict the forward premium observed. C is incorrect. If the USD MRR were equal to the BRL MRR, the forward rate would likely be close to the spot rate, not showing the premium that is observed in the exhibit.", "explhtml": "<p>The positive forward points for the BRL/USD pair in Exhibit 2 indicate that the USD is trading at a forward premium across all maturities, including three months. According to covered interest rate parity, a forward rate higher than the spot rate occurs when the foreign risk-free rate (BRL MRR) exceeds the domestic risk-free rate (USD MRR). If covered interest rate parity is breached, traders can seize arbitrage opportunities by exploiting this discrepancy.<\/p><p><b>A is incorrect.<\/b> If the USD MRR were higher, the forward rate would likely be lower than the spot rate, not higher. This would contradict the forward premium observed.<\/p><p><b>C is incorrect.<\/b> If the USD MRR were equal to the BRL MRR, the forward rate would likely be close to the spot rate, not showing the premium that is observed in the exhibit.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Sully Atkins<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sully Atkins is the director of finance of a firm headquartered in Germany. He is responsible for<\/p><p>overseeing exposure to price risk in both the commodity and currency markets. Atkins is settling<\/p><p>his end-of-quarter transactions and creating reports. Frank Kruger, a trainee at the firm, assists<\/p><p>him in this process. The firm hedges input costs using forward contracts priced in both US<\/p><p>dollars (USD) and Brazilian reals (BRL). Atkins will receive a customer payment of CHF<\/p><p>325,000,000 (Swiss francs) that he wants to convert to euros (EUR). Kruger gathers the<\/p><p>exchange rates from Dealer A in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0075.webp\" style=\"max-width:min(100%,349px)\" alt=\"Exhibit 1: Spot Exchange Rates by Dealer A Currency Pair Bid Offer Average CHF/EUR 0.9231 0.9235 0.9233 BRL/USD 5.330 5.340 5.335 EUR/JPY 129.65 129.69 129.67 USD/JPY 112.76 112.80 112.78 USD/EUR 0.8586 0.8590 0.8588\"><p>Sea Breeze Ltd, a major supplier, will be paid at the end of the month. Atkins will need to<\/p><p>purchase GBP to settle the arrears. Dealer A has quoted USD/EUR at 0.8576/0.8593. Kruger is<\/p><p>working on another transaction that would involve purchasing BRL 45,000,000 to settle a<\/p><p>pending invoice. He contacts dealer C who quotes EUR/BRL 0.2172/0.2165.<\/p><p>Atkins requests Kruger to ascertain the current 30-day MRRs for three currencies detailed in<\/p><p>Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0076.webp\" style=\"max-width:min(100%,238px)\" alt=\"Exhibit 2: 30-day MRR Annualized Rate Currency 0.351% GBP 0.552% BRL 0.075% EUR\"><p>Atkins anticipates that one of their major Brazilian customers will settle an invoice of BRL<\/p><p>6,500,000 in one month. Three months prior, the firm sold BRL 6,500,000 against the EUR using<\/p><p>a six-month all-in forward price of BRL/USD 5.45. Atkins requests Kruger to collect BRL/USD<\/p><p>forward rates in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0077.webp\" style=\"max-width:min(100%,281px)\" alt=\"Exhibit 3: BRL/USD Forward Rates Maturity Forward Points 1 Month 3.2/3.56 3 Month 12.5/14.2 6 Month 28.0/29.6\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 3, Kruger is most likely to conclude that one-month USD MRR is:<\/p><\/div>", "subj": "economics"}, {"n": 40, "q": "Based on Exhibit 1,2, and 3, to calculate the USD MRR Atkins would most likely use the:", "opts": ["Purchasing power parity", "Uncovered interest rate parity", "Covered interest rate parity"], "ans": "C", "expl": "Covered interest rate parity establishes the forward exchange rate that must exist to prevent arbitrage, given the current spot rate and the risk-free interest rates of two countries. When the forward rate, spot rate, and one country's risk-free rate are known, the other country's risk-free rate can be determined using this relationship. A is incorrect. Purchasing Power Parity is an economic theory that compares different countries' currencies through a \"basket of goods\" approach. According to PPP, in the absence of transportation and other transaction costs, identical goods should have the same price when expressed in a common currency. PPP is typically used to predict longer-term exchange rate movements based on relative price level changes between two countries rather than for determining forward exchange rates derived from interest rates and spot rates. Therefore, PPP is not the most appropriate method for calculating the USD MRR in this context. B is incorrect. Uncovered Interest Rate Parity suggests that the difference in interest rates between two countries is equal to the expected change in exchange rates between the countries' currencies. Unlike Covered Interest Rate Parity, it does not involve a forward contract to lock in the future exchange rate, thus exposing the currency conversion to exchange rate risk. Since the problem requires preventing arbitrage and typically involves forward rates, UIRP is not suitable for this scenario.", "explhtml": "<p>Covered interest rate parity establishes the forward exchange rate that must exist to prevent arbitrage, given the current spot rate and the risk-free interest rates of two countries. When the forward rate, spot rate, and one country&#x27;s risk-free rate are known, the other country&#x27;s risk-free rate can be determined using this relationship.<\/p><p><b>A is incorrect.<\/b> Purchasing Power Parity is an economic theory that compares different countries&#x27; currencies through a &quot;basket of goods&quot; approach. According to PPP, in the absence of transportation and other transaction costs, identical goods should have the same price when expressed in a common currency. PPP is typically used to predict longer-term exchange rate movements based on relative price level changes between two countries rather than for determining forward exchange rates derived from interest rates and spot rates. Therefore, PPP is not the most appropriate method for calculating the USD MRR in this context.<\/p><p><b>B is incorrect.<\/b> Uncovered Interest Rate Parity suggests that the difference in interest rates between two countries is equal to the expected change in exchange rates between the countries&#x27; currencies. Unlike Covered Interest Rate Parity, it does not involve a forward contract to lock in the future exchange rate, thus exposing the currency conversion to exchange rate risk. Since the problem requires preventing arbitrage and typically involves forward rates, UIRP is not suitable for this scenario.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (g) Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Sully Atkins<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sully Atkins is the director of finance of a firm headquartered in Germany. He is responsible for<\/p><p>overseeing exposure to price risk in both the commodity and currency markets. Atkins is settling<\/p><p>his end-of-quarter transactions and creating reports. Frank Kruger, a trainee at the firm, assists<\/p><p>him in this process. The firm hedges input costs using forward contracts priced in both US<\/p><p>dollars (USD) and Brazilian reals (BRL). Atkins will receive a customer payment of CHF<\/p><p>325,000,000 (Swiss francs) that he wants to convert to euros (EUR). Kruger gathers the<\/p><p>exchange rates from Dealer A in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0075.webp\" style=\"max-width:min(100%,349px)\" alt=\"Exhibit 1: Spot Exchange Rates by Dealer A Currency Pair Bid Offer Average CHF/EUR 0.9231 0.9235 0.9233 BRL/USD 5.330 5.340 5.335 EUR/JPY 129.65 129.69 129.67 USD/JPY 112.76 112.80 112.78 USD/EUR 0.8586 0.8590 0.8588\"><p>Sea Breeze Ltd, a major supplier, will be paid at the end of the month. Atkins will need to<\/p><p>purchase GBP to settle the arrears. Dealer A has quoted USD/EUR at 0.8576/0.8593. Kruger is<\/p><p>working on another transaction that would involve purchasing BRL 45,000,000 to settle a<\/p><p>pending invoice. He contacts dealer C who quotes EUR/BRL 0.2172/0.2165.<\/p><p>Atkins requests Kruger to ascertain the current 30-day MRRs for three currencies detailed in<\/p><p>Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0076.webp\" style=\"max-width:min(100%,238px)\" alt=\"Exhibit 2: 30-day MRR Annualized Rate Currency 0.351% GBP 0.552% BRL 0.075% EUR\"><p>Atkins anticipates that one of their major Brazilian customers will settle an invoice of BRL<\/p><p>6,500,000 in one month. Three months prior, the firm sold BRL 6,500,000 against the EUR using<\/p><p>a six-month all-in forward price of BRL/USD 5.45. Atkins requests Kruger to collect BRL/USD<\/p><p>forward rates in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0077.webp\" style=\"max-width:min(100%,281px)\" alt=\"Exhibit 3: BRL/USD Forward Rates Maturity Forward Points 1 Month 3.2/3.56 3 Month 12.5/14.2 6 Month 28.0/29.6\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1,2, and 3, to calculate the USD MRR Atkins would most likely use the:<\/p><\/div>", "subj": "economics"}, {"n": 41, "q": "Given Progresia's recent investment in infrastructure, the long-term impact on the country's economic growth, assuming no change in other growth-contributing factors, is most likely:", "opts": ["A temporary increase in growth due to immediate spending.", "An increase in the growth rate of potential GDP via higher productivity.", "No significant impact due to insufficient human capital development."], "ans": "B", "expl": "Investing in infrastructure is expected to raise the economy's productivity over the long run by improving the efficiency of transportation, communication, and the overall functioning of markets. As a result, it will positively impact the growth rate of potential GDP, not just temporarily but sustainably, assuming other factors remain constant. This impact is part of capital deepening, which can enhance economic growth by increasing the capital-to-labor ratio and boosting the labor force's productivity. A is incorrect. Although infrastructure spending can create a short-term boost to growth due to the immediate fiscal stimulus, the question focuses on the long-term impact, where improved infrastructure's benefits are expected to increase productivity sustainably. C is incorrect. While human capital development is crucial for economic growth, the question specifies that the reform in question pertains to infrastructure investment. Even if human capital remains unchanged, improved infrastructure can enhance productivity and potential GDP growth.", "explhtml": "<p>Investing in infrastructure is expected to raise the economy&#x27;s productivity over the long run by improving the efficiency of transportation, communication, and the overall functioning of markets. As a result, it will positively impact the growth rate of potential GDP, not just temporarily but sustainably, assuming other factors remain constant. This impact is part of capital deepening, which can enhance economic growth by increasing the capital-to-labor ratio and boosting the labor force&#x27;s productivity.<\/p><p><b>A is incorrect.<\/b> Although infrastructure spending can create a short-term boost to growth due to the immediate fiscal stimulus, the question focuses on the long-term impact, where improved infrastructure&#x27;s benefits are expected to increase productivity sustainably.<\/p><p><b>C is incorrect.<\/b> While human capital development is crucial for economic growth, the question specifies that the reform in question pertains to infrastructure investment. Even if human capital remains unchanged, improved infrastructure can enhance productivity and potential GDP growth.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(h): Explain how investment in physical capital, human capital, and technological development affects economic growth<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · The Republic of Progresia<\/summary><div class=\"vig-body\"><p>The Republic of Progresia, a small island nation, has been experiencing stagnant economic<\/p><p>growth for the past decade. Despite a well-educated population, significant natural resources,<\/p><p>and a strategic location for trade, the annual GDP growth rate has averaged just 1.2%. Inflation<\/p><p>has remained low, at around 2%, but unemployment levels have risen to a concerning 9%. The<\/p><p>country&#x27;s currency, the Progresian Dollar (PD), has been stable relative to the currencies of its<\/p><p>main trading partners.<\/p><p>Recently, the government of Progresia announced a series of economic reforms aimed at<\/p><p>boosting growth. These reforms include investing in infrastructure, providing tax breaks to<\/p><p>technology companies, and implementing regulatory changes to attract foreign direct investment<\/p><p>(FDI). Economists in Progresia have varying views on the potential impact of these reforms.<\/p><p>Some believe the reforms will increase potential output without affecting short-term output,<\/p><p>while others forecast that they will stimulate both potential and short-term output. Additionally,<\/p><p>there is debate over how these initiatives might influence the Progresian Dollar&#x27;s short- and long-<\/p><p>term value.<\/p><p>Progresia&#x27;s government has also outlined an education policy that focuses on vocational courses<\/p><p>to meet the immediate needs of the local industries, aiming to reduce unemployment and match<\/p><p>skills to jobs. However, some critics argue that this could limit long-term innovation and<\/p><p>discourage higher education, which has traditionally fueled long-term economic growth.<\/p><p>Progresia has entered into trade agreements with neighboring countries to incentivize trade,<\/p><p>boosting expectations for export growth. The central bank is optimistic that this will increase the<\/p><p>demand for PD, potentially leading to an appreciation in the short run. If these trends persist, the<\/p><p>current account is expected to show a surplus within the next two years.<\/p><p>Use the data provided in the table below to answer the subsequent questions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0086.webp\" style=\"max-width:min(100%,606px)\" alt=\"Exhibit 1 Year Nominal GDP Real Unemployment Gross GDP Deflator GDP Rate (%) National  (in Billion PD) (Index: Growth Investment Current Rate (%) (%) Year =100) 1 500 100 1.2 9 20 2 520 102 2.0 8.5 22 3 546 104 2.3 8.0 24\"><\/div><\/details><div class=\"qtext\"><p>Given Progresia&#x27;s recent investment in infrastructure, the long-term impact on the country&#x27;s economic growth, assuming no change in other growth-contributing factors, is most likely:<\/p><\/div>", "subj": "economics"}, {"n": 42, "q": "Given the government's focus on vocational education to address unemployment, in the long run, the country's human capital is most likely to:", "opts": ["Increase substantially, improving economic growth prospects.", "Shift towards specialized industries, potentially limiting diversification.", "Result in high levels of technological innovation and productivity growth."], "ans": "B", "expl": "Focusing on vocational education may lead to increased human capital suited to existing industries, which can shift the workforce's skill set towards these specialized areas. While this may reduce unemployment in the short term, it could limit the economy's diversification and adaptability in the long run by not encouraging a broader educational foundation needed for innovation. A is incorrect. While vocational training can improve prospects within specific industries, it may not substantially increase human capital in a way that supports broad-based economic growth. C is incorrect. Vocational education typically prepares individuals for specific trades and does not inherently lead to high levels of technological innovation or productivity across the economy.", "explhtml": "<p>Focusing on vocational education may lead to increased human capital suited to existing industries, which can shift the workforce&#x27;s skill set towards these specialized areas. While this may reduce unemployment in the short term, it could limit the economy&#x27;s diversification and adaptability in the long run by not encouraging a broader educational foundation needed for innovation.<\/p><p><b>A is incorrect.<\/b> While vocational training can improve prospects within specific industries, it may not substantially increase human capital in a way that supports broad-based economic growth.<\/p><p><b>C is incorrect.<\/b> Vocational education typically prepares individuals for specific trades and does not inherently lead to high levels of technological innovation or productivity across the economy.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(h): Explain how investment in physical capital, human capital, and technological development affects economic growth<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · The Republic of Progresia<span class=\"vig-hint\">bấm t run. If these trends persist, the<\/p><p>current account is expected to show a surplus within the next two years.<\/p><p>Use the data provided in the table below to answer the subsequent questions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0086.webp\" style=\"max-width:min(100%,606px)\" alt=\"Exhibit 1 Year Nominal GDP Real Unemployment Gross GDP Deflator GDP Rate (%) National  (in Billion PD) (Index: Growth Investment Current Rate (%) (%) Year =100) 1 500 100 1.2 9 20 2 520 102 2.0 8.5 22 3 546 104 2.3 8.0 24\"><\/div><\/details><div class=\"qtext\"><p>Given the government&#x27;s focus on vocational education to address unemployment, in the long run, the country&#x27;s human capital is most likely to:<\/p><\/div>", "subj": "economics"}, {"n": 43, "q": "Based on the table, how much has Progresia's nominal GDP increased in percentage terms from Year 1 to Year 3?", "opts": ["9.2%", "9.6%", "9.3%"], "ans": "A", "expl": "To calculate the percentage increase in nominal GDP from Year 1 to Year 3, we use the formula: Thus, from Year 1 to Year 3: B is incorrect. This option would have been correct if the calculation was mistakenly based on simple addition rather than percentage change. C is incorrect. This option is just a distractor and does not represent the correct calculation for percentage change.", "explhtml": "<p>To calculate the percentage increase in nominal GDP from Year 1 to Year 3, we use the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0087.webp\" style=\"max-width:min(100%,413px)\" alt=\"Final Value−Intial Value Percentage Increase = × 100 Intial Value\"><p>Thus, from Year 1 to Year 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0088.webp\" style=\"max-width:min(100%,367px)\" alt=\"546 −500 Percentage Increase = × 100 = 9.2% 500\"><p><b>B is incorrect.<\/b> This option would have been correct if the calculation was mistakenly based on simple addition rather than percentage change.<\/p><p><b>C is incorrect.<\/b> This option is just a distractor and does not represent the correct calculation for percentage change.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(e): Demonstrate forecasting potential GDP based on growth accounting relations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · The Republic of Progresia<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Republic of Progresia, a small island nation, has been experiencing stagnant economic<\/p><p>growth for the past decade. Despite a well-educated population, significant natural resources,<\/p><p>and a strategic location for trade, the annual GDP growth rate has averaged just 1.2%. Inflation<\/p><p>has remained low, at around 2%, but unemployment levels have risen to a concerning 9%. The<\/p><p>country&#x27;s currency, the Progresian Dollar (PD), has been stable relative to the currencies of its<\/p><p>main trading partners.<\/p><p>Recently, the government of Progresia announced a series of economic reforms aimed at<\/p><p>boosting growth. These reforms include investing in infrastructure, providing tax breaks to<\/p><p>technology companies, and implementing regulatory changes to attract foreign direct investment<\/p><p>(FDI). Economists in Progresia have varying views on the potential impact of these reforms.<\/p><p>Some believe the reforms will increase potential output without affecting short-term output,<\/p><p>while others forecast that they will stimulate both potential and short-term output. Additionally,<\/p><p>there is debate over how these initiatives might influence the Progresian Dollar&#x27;s short- and long-<\/p><p>term value.<\/p><p>Progresia&#x27;s government has also outlined an education policy that focuses on vocational courses<\/p><p>to meet the immediate needs of the local industries, aiming to reduce unemployment and match<\/p><p>skills to jobs. However, some critics argue that this could limit long-term innovation and<\/p><p>discourage higher education, which has traditionally fueled long-term economic growth.<\/p><p>Progresia has entered into trade agreements with neighboring countries to incentivize trade,<\/p><p>boosting expectations for export growth. The central bank is optimistic that this will increase the<\/p><p>demand for PD, potentially leading to an appreciation in the short run. If these trends persist, the<\/p><p>current account is expected to show a surplus within the next two years.<\/p><p>Use the data provided in the table below to answer the subsequent questions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0086.webp\" style=\"max-width:min(100%,606px)\" alt=\"Exhibit 1 Year Nominal GDP Real Unemployment Gross GDP Deflator GDP Rate (%) National  (in Billion PD) (Index: Growth Investment Current Rate (%) (%) Year =100) 1 500 100 1.2 9 20 2 520 102 2.0 8.5 22 3 546 104 2.3 8.0 24\"><\/div><\/details><div class=\"qtext\"><p>Based on the table, how much has Progresia&#x27;s nominal GDP increased in percentage terms from Year 1 to Year 3?<\/p><\/div>", "subj": "economics"}, {"n": 44, "q": "As per the Solow growth model, if Progresia is currently in a steady state and receives an influx of foreign direct investment focused on capital deepening without any technological advancement, what is most likely to occur in the long run?", "opts": ["Economic growth will accelerate indefinitely.", "A temporary increase in growth followed by a return to the original steady-state growth rate.", "A permanent increase in growth as the capital injection outweighs labor growth."], "ans": "B", "expl": "According to the Solow growth model, an economy in a steady state will experience a temporary increase in economic growth from an influx of capital investment (capital deepening). However, because of the law of diminishing returns, the growth rate will eventually return to the original steady-state growth rate as the additional capital becomes less productive over time. A is incorrect. The Solow growth model does not support the indefinite acceleration of economic growth from capital deepening due to diminishing marginal returns. C is incorrect. A permanent increase in the growth rate would require technological advancement (shift in the production function), not just capital deepening. The additional capital will become less productive over time as the diminishing marginal returns set in.", "explhtml": "<p>According to the Solow growth model, an economy in a steady state will experience a temporary increase in economic growth from an influx of capital investment (capital deepening). However, because of the law of diminishing returns, the growth rate will eventually return to the original steady-state growth rate as the additional capital becomes less productive over time.<\/p><p><b>A is incorrect.<\/b> The Solow growth model does not support the indefinite acceleration of economic growth from capital deepening due to diminishing marginal returns.<\/p><p><b>C is incorrect.<\/b> A permanent increase in the growth rate would require technological advancement (shift in the production function), not just capital deepening. The additional capital will become less productive over time as the diminishing marginal returns set in.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(e): Demonstrate forecasting potential GDP based on growth accounting relations<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · The Republic of Progresia<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Republic of Progresia, a small island nation, has been experiencing stagnant economic<\/p><p>growth for the past decade. Despite a well-educated population, significant natural resources,<\/p><p>and a strategic location for trade, the annual GDP growth rate has averaged just 1.2%. Inflation<\/p><p>has remained low, at around 2%, but unemployment levels have risen to a concerning 9%. The<\/p><p>country&#x27;s currency, the Progresian Dollar (PD), has been stable relative to the currencies of its<\/p><p>main trading partners.<\/p><p>Recently, the government of Progresia announced a series of economic reforms aimed at<\/p><p>boosting growth. These reforms include investing in infrastructure, providing tax breaks to<\/p><p>technology companies, and implementing regulatory changes to attract foreign direct investment<\/p><p>(FDI). Economists in Progresia have varying views on the potential impact of these reforms.<\/p><p>Some believe the reforms will increase potential output without affecting short-term output,<\/p><p>while others forecast that they will stimulate both potential and short-term output. Additionally,<\/p><p>there is debate over how these initiatives might influence the Progresian Dollar&#x27;s short- and long-<\/p><p>term value.<\/p><p>Progresia&#x27;s government has also outlined an education policy that focuses on vocational courses<\/p><p>to meet the immediate needs of the local industries, aiming to reduce unemployment and match<\/p><p>skills to jobs. However, some critics argue that this could limit long-term innovation and<\/p><p>discourage higher education, which has traditionally fueled long-term economic growth.<\/p><p>Progresia has entered into trade agreements with neighboring countries to incentivize trade,<\/p><p>boosting expectations for export growth. The central bank is optimistic that this will increase the<\/p><p>demand for PD, potentially leading to an appreciation in the short run. If these trends persist, the<\/p><p>current account is expected to show a surplus within the next two years.<\/p><p>Use the data provided in the table below to answer the subsequent questions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0086.webp\" style=\"max-width:min(100%,606px)\" alt=\"Exhibit 1 Year Nominal GDP Real Unemployment Gross GDP Deflator GDP Rate (%) National  (in Billion PD) (Index: Growth Investment Current Rate (%) (%) Year =100) 1 500 100 1.2 9 20 2 520 102 2.0 8.5 22 3 546 104 2.3 8.0 24\"><\/div><\/details><div class=\"qtext\"><p>As per the Solow growth model, if Progresia is currently in a steady state and receives an influx of foreign direct investment focused on capital deepening without any technological advancement, what is most likely to occur in the long run?<\/p><\/div>", "subj": "economics"}, {"n": 45, "q": "If IF continues its policy of openness and trade liberalization, which economic theory is it most closely following?", "opts": ["Neoclassical growth theory", "Classical growth theory", "Endogenous growth theory"], "ans": "C", "expl": "IF's policies of investing in education and technology, as well as providing an environment conducive to innovation, align with endogenous growth theory. This theory emphasizes the role of knowledge, innovation, and human capital as drivers of growth, all of which are fostered through government policies. A is incorrect. Neoclassical growth theory largely considers technological progress as an exogenous factor. B is incorrect. Classical growth theory focuses on the role of capital accumulation and population growth, with less emphasis on government intervention.", "explhtml": "<p>IF&#x27;s policies of investing in education and technology, as well as providing an environment conducive to innovation, align with endogenous growth theory. This theory emphasizes the role of knowledge, innovation, and human capital as drivers of growth, all of which are fostered through government policies.<\/p><p><b>A is incorrect.<\/b> Neoclassical growth theory largely considers technological progress as an exogenous factor.<\/p><p><b>B is incorrect.<\/b> Classical growth theory focuses on the role of capital accumulation and population growth, with less emphasis on government intervention.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2 (i): Compare classical growth theory, neoclassical growth theory, and endogenous growth theory<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · The Island Federation (IF) and Continental Harmony (CH)<\/summary><div class=\"vig-body\"><p>The Island Federation (IF) and Continental Harmony (CH) are neighboring countries with a<\/p><p>history of economic interdependence and starkly differing policies. For decades, IF, an island<\/p><p>nation with a small population, has focused on creating a conducive environment for economic<\/p><p>growth by investing in education, fostering political stability, and opening its markets to<\/p><p>international trade. Meanwhile, CH, with its abundant natural resources and larger population,<\/p><p>has adopted inward-oriented policies and has been less inclined to invest in human capital or<\/p><p>establish strong legal systems to protect property rights.<\/p><p>At the start of the 21st century, IF and CH had similar per capita GDPs, but IF&#x27;s government<\/p><p>decided to undertake a series of ambitious reforms aimed at accelerating economic growth.<\/p><p>These reforms included investing heavily in technology and education (at both primary and<\/p><p>higher levels), reducing trade barriers, and offering attractive incentives for foreign direct<\/p><p>investment (FDI). Simultaneously, IF&#x27;s legal framework was fortified to protect intellectual<\/p><p>property rights and enforce contracts more effectively. IF&#x27;s goal was to transition from an<\/p><p>economy based on agriculture and tourism to becoming a regional hub for financial services and<\/p><p>high-tech industries.<\/p><p>CH, abounding with oil and mineral wealth, continued with state-controlled economic policies,<\/p><p>restricting foreign investment and maintaining high tariffs on imports to protect domestic<\/p><p>industries. Public investments were primarily directed toward infrastructure projects, with less<\/p><p>emphasis on education and healthcare. Capital controls and a lack of effective financial<\/p><p>intermediation stifled the development of local businesses and entrepreneurship.<\/p><p>By 2025, IF had achieved significant growth, buoyed by a rapid expansion of its service sector<\/p><p>and a notable increase in labor productivity. The country&#x27;s education reforms bore fruit, with a<\/p><p>substantial increase in the skilled labor force. In contrast, CH’s growth had begun to falter. The<\/p><p>country&#x27;s reliance on natural resource exports made it vulnerable to commodity price volatility,<\/p><p>and despite the abundance of resources, the lack of investment in human capital and technology<\/p><p>hindered growth.<\/p><p>Recent economic reports provide the following data for both countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0089.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit 1: Economic Reports Metrics Island Continental Federation Harmony (IF) (CH) GDP Growth Rate 6% 2% Investment/GDP 25% 15% Education Spending/GDP 7% 2% FDI Inflows/GDP 3% 0.5% Export Growth Rate 10% 3% Inflation Rate 2% 5% Population Growth Rate 1% 1.5% Labor Productivity Growth 3% 0.5%\"><p>Analysts have forecasted future economic prospects for both nations, with IF likely to maintain<\/p><p>or increase its current growth trajectory, and CH’s outlook appearing uncertain unless the<\/p><p>country reforms its economic policies.<\/p><\/div><\/details><div class=\"qtext\"><p>If IF continues its policy of openness and trade liberalization, which economic theory is it most closely following?<\/p><\/div>", "subj": "economics"}, {"n": 46, "q": "What is the most likely result of IF’s investment in technology and education on its per capita GDP in the long term?", "opts": ["Increase due to higher labor productivity", "Decrease due to capital dilution", "No change as human capital has minimal impact on per capita GDP"], "ans": "A", "expl": "IF’s investment in technology and education is likely to lead to an increase in per capita GDP in the long term. This is because such investments typically yield higher levels of human capital and technological progression, which are strong determinants of labor productivity and hence per capita GDP . B is incorrect. Capital dilution typically refers to the impact of capital increase on the value of existing shares, which is not relevant to per capita GDP in this case. C is incorrect. The human capital approach posits that education and skills are crucial to enhancing labor productivity and thereby per capita GDP.", "explhtml": "<p>IF’s investment in technology and education is likely to lead to an increase in per capita GDP in the long term. This is because such investments typically yield higher levels of human capital and technological progression, which are strong determinants of labor productivity and hence per capita GDP .<\/p><p><b>B is incorrect.<\/b> Capital dilution typically refers to the impact of capital increase on the value of existing shares, which is not relevant to per capita GDP in this case.<\/p><p><b>C is incorrect.<\/b> The human capital approach posits that education and skills are crucial to enhancing labor productivity and thereby per capita GDP.<\/p><p class=\"los\">Economics, Learning Module 2: Economic Growth. LOS 2(h): Explain how investment in physical capital, human capital, and technological development affects economic growth<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · The Island Federation (IF) and Continental Harmony (CH)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Island Federation (IF) and Continental Harmony (CH) are neighboring countries with a<\/p><p>history of economic interdependence and starkly differing policies. For decades, IF, an island<\/p><p>nation with a small population, has focused on creating a cond
