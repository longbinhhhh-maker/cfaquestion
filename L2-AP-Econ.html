y liquid fixed income and equity markets. Though they share the same ethnic background, the average age in Estonia is 48 years, significantly higher than that of Latvia and Lithuania. Policymakers in Estonia believe that it will lack the knowledge in technology necessary to improve production methods.<\/p><p>Economic policymakers debate measures to increase each country&#x27;s long-term potential GDP growth rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the Cobb-Douglas growth accounting equation, the greatest estimated long-term growth rate of potential GDP is that of:<\/p><\/div>", "subj": "economics"}, {"n": 18, "q": "If uncovered interest parity holds, between today and one year from now, the expected changes in the USD/EUR and JPY/EUR exchange rates are closest to:", "opts": ["USD/EUR: − 0.75%; JPY/EUR: + 1.25%", "USD/EUR: 0%; JPY/EUR: 0%", "USD/EUR: + 0.75%; JPY/EUR: − 1.25%"], "ans": "C", "expl": "Uncovered interest rate parity (UIP) is a fundamental concept in international finance that states the expected change in the exchange rate between two currencies is equal to the difference in their interest rates. According to UIP, if the interest rate in the domestic country is higher than in the foreign country, the domestic currency is expected to depreciate against the foreign currency, and vice versa. In this scenario, the one-year LIBOR rates for the US and the European Union are 2.25% and 1.50%, respectively. The interest rate differential is . According to UIP, this implies that the USD is expected to appreciate relative to the EUR by 0.75% over the next year. Similarly, the one-year LIBOR rates for Japan and the European Union are 0.25% and 1.50%, respectively. The differential here is . This suggests that the JPY is expected to depreciate relative to the EUR by 1.25% over the same period. Therefore, the correct answer is that the USD/EUR exchange rate is expected to increase by 0.75%, and the JPY/EUR exchange rate is expected to decrease by 1.25%. A is incorrect. It suggests that the USD/EUR exchange rate will decrease by 0.75% and the JPY/EUR will increase by 1.25%. This contradicts the UIP theory, which predicts that the currency of a country with a higher interest rate (in this case, the US) will appreciate, not depreciate. Furthermore, the JPY, with a lower interest rate compared to the EUR, is expected to depreciate, not appreciate. This misalignment with the UIP principles leads to the incorrectness of option A. B is incorrect. It suggests no change in the exchange rates (USD/EUR: 0%; JPY/EUR: 0%). This is inconsistent with the UIP theory, which predicts changes in exchange rates based on interest rate differentials. Given the positive differential for the USD/EUR and the negative differential for the JPY/EUR, a zero change in both exchange rates is not supported by the given interest rate data. This option fails to reflect the expected adjustments in currency values based on the prevailing interest rates, rendering it incorrect. ", "explhtml": "<p>Uncovered interest rate parity (UIP) is a fundamental concept in international finance that states the expected change in the exchange rate between two currencies is equal to the difference in their interest rates. According to UIP, if the interest rate in the domestic country is higher than in the foreign country, the domestic currency is expected to depreciate against the foreign currency, and vice versa.<\/p><p>In this scenario, the one-year LIBOR rates for the US and the European Union are 2.25% and 1.50%, respectively. The interest rate differential is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0033.webp\" style=\"max-width:min(100%,195px)\" alt=\"2.25% −1.50% = 0.75%\"><p>. According to UIP, this implies that the USD is expected to appreciate relative to the EUR by 0.75% over the next year. Similarly, the one-year LIBOR rates for Japan and the European Union are 0.25% and 1.50%, respectively. The differential here is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0034.webp\" style=\"max-width:min(100%,209px)\" alt=\"0.25% −1.50% = −1.25%\"><p>. This suggests that the JPY is expected to depreciate relative to the EUR by 1.25% over the same period. Therefore, the correct answer is that the USD/EUR exchange rate is expected to increase by 0.75%, and the JPY/EUR exchange rate is expected to decrease by 1.25%.<\/p><p><b>A is incorrect<\/b>. It suggests that the USD/EUR exchange rate will decrease by 0.75% and the JPY/EUR will increase by 1.25%. This contradicts the UIP theory, which predicts that the currency of a country with a higher interest rate (in this case, the US) will appreciate, not depreciate. Furthermore, the JPY, with a lower interest rate compared to the EUR, is expected to depreciate, not appreciate. This misalignment with the UIP principles leads to the incorrectness of option A.<\/p><p><b>B is incorrect<\/b>. It suggests no change in the exchange rates (USD/EUR: 0%; JPY/EUR: 0%). This is inconsistent with the UIP theory, which predicts changes in exchange rates based on interest rate differentials. Given the positive differential for the USD/EUR and the negative differential for the JPY/EUR, a zero change in both exchange rates is not supported by the given interest rate data. This option fails to reflect the expected adjustments in currency values based on the prevailing interest rates, rendering it incorrect. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(e): Explain international parity conditions (covered and uncovered interest rate parity, forward rate parity, purchasing power parity, and the international Fisher effect)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Caroline Taylor<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Caroline Taylor, CFA has recently joined North Pacific National Bank (NPNB) in New York as an analyst in its currency trading department. Taylor has a master&#x27;s degree in finance from a reputable business school. Working with a team of analysts, she must identify and execute profitable trading opportunities in the foreign exchange market and advise clients on foreign exchange risk management. Taylor saw the following information on the Bloomberg terminal about nominal and real interest rates, inflation rates, country risk premiums, and exchange rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0030.webp\" style=\"max-width:min(100%,612px)\" alt=\"Exhibit 1: Currency Information European Japan US Union One Year LIBOR 0.25% 2.25% 1.50% (nominal) One Year LIBOR 0.25% 1.50% 1.00% (real) JPY JPY Exchange rate USD 1.1000/EUR 105.5500/USD 116.1050/EUR Real Long-run Equilibrium JPY 102.50/USD USD 1.2250/EUR JPY 125.60/EUR Exchange Rate Risk Premium \"><p>Taylor also received the minutes of the European Central Bank&#x27;s Monetary Policy Committee and the Federal Reserve Board meeting. After reading these minutes, Taylor surmises that the European Central Bank is likely to pursue an expansionary monetary policy. In contrast, the Federal Reserve is expected to follow a hawkish (restrictive) monetary policy. Various European governments are expected to reduce their respective budget deficits, while the US government is likely to increase its budget deficit next year. Capital has been highly mobile between the US and European countries for more than a century now.<\/p><p>NPNB’s international equity investment analysis team regularly produces country risk assessment reports for internal use by various departments. The following are excerpts from the latest report:<\/p><p>The long-run real equilibrium JPY/USD exchange rate is likely to remain unchanged.<\/p><p>Real interest rates in the US are expected to decline relative to real interest rates in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0031.webp\" style=\"max-width:min(100%,63px)\" alt=\"Japan.\"><p>The US risk premium is expected to increase relative to Japan’s risk premium.<\/p><p>Hudson Asset Management Company, an NPNB client, specializes in international equity investments. Hudson’s portfolio manager approaches Taylor for advice on investments in three Baltic countries – Estonia, Latvia, and Lithuania. The portfolio manager wants to estimate these countries’ potential GDP growth rates and understand possible monetary policy directions. The table below provides economic and demographic information for the three Baltic countries.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0032.webp\" style=\"max-width:min(100%,583px)\" alt=\"Exhibit 2: Economic and Demographic Information Estonia Latvia Lithuania Labor force participation 71.20% 65.50% 64.50% Share of capital in total GDP 40% 35% 30% Sovereign rating AA- A+ A- Long-term growth rate of TFP 2.20% 1.80% 1.50% Long-term growth rate of capital 4.25% 3.75% 3.50% Long-term gro\"><p>All three countries have relatively independent central banks with inflation targeting as the primary goal. The countries also have well-established, high-volume, and highly liquid fixed income and equity markets. Though they share the same ethnic background, the average age in Estonia is 48 years, significantly higher than that of Latvia and Lithuania. Policymakers in Estonia believe that it will lack the knowledge in technology necessary to improve production methods.<\/p><p>Economic policymakers debate measures to increase each country&#x27;s long-term potential GDP growth rate.<\/p><\/div><\/details><div class=\"qtext\"><p>If uncovered interest parity holds, between today and one year from now, the expected changes in the USD/EUR and JPY/EUR exchange rates are closest to:<\/p><\/div>", "subj": "economics"}, {"n": 19, "q": "According to the Mundell-Fleming model, the USD/EUR exchange rate is most likely to:", "opts": ["Remain unchanged", "Increase", "Decrease"], "ans": "C", "expl": "According to the Mundell-Fleming model, which is a standard economic model that describes the relationship between exchange rates and macroeconomic variables in an open economy, the USD/EUR exchange rate is influenced by monetary and fiscal policies. In this scenario, the European Central Bank (ECB) is expected to adopt an expansionary monetary policy, which typically involves lowering interest rates or increasing the money supply. This action tends to decrease the value of the Euro relative to other currencies because lower interest rates make a currency less attractive to investors seeking higher returns. Conversely, the Federal Reserve in the U.S. is expected to implement a restrictive monetary policy, which usually involves raising interest rates or reducing the money supply, making the U.S. Dollar more attractive due to higher returns on investments denominated in USD. A is incorrect. The option suggesting that the USD/EUR exchange rate will remain unchanged does not align with the expected divergent monetary policies of the ECB and the Federal Reserve. The ECB's expansionary policy is likely to devalue the Euro, while the Fed's restrictive policy should appreciate the Dollar. These actions are not conducive to a stable exchange rate but rather suggest movement. B is incorrect. An increase in the USD/EUR exchange rate implies a strengthening of the Euro relative to the Dollar, which contradicts the expected outcomes of the ECB's expansionary monetary policy and the Fed's restrictive approach. Expansionary policy in the EU should theoretically weaken the Euro, not strengthen it, when compared to the Dollar, which is being bolstered by higher interest rates and reduced money supply. ", "explhtml": "<p>According to the Mundell-Fleming model, which is a standard economic model that describes the relationship between exchange rates and macroeconomic variables in an open economy, the USD/EUR exchange rate is influenced by monetary and fiscal policies. In this scenario, the European Central Bank (ECB) is expected to adopt an expansionary monetary policy, which typically involves lowering interest rates or increasing the money supply. This action tends to decrease the value of the Euro relative to other currencies because lower interest rates make a currency less attractive to investors seeking higher returns. Conversely, the Federal Reserve in the U.S. is expected to implement a restrictive monetary policy, which usually involves raising interest rates or reducing the money supply, making the U.S. Dollar more attractive due to higher returns on investments denominated in USD.<\/p><p><b>A is incorrect<\/b>. The option suggesting that the USD/EUR exchange rate will remain unchanged does not align with the expected divergent monetary policies of the ECB and the Federal Reserve. The ECB&#x27;s expansionary policy is likely to devalue the Euro, while the Fed&#x27;s restrictive policy should appreciate the Dollar. These actions are not conducive to a stable exchange rate but rather suggest movement.<\/p><p><b>B is incorrect<\/b>. An increase in the USD/EUR exchange rate implies a strengthening of the Euro relative to the Dollar, which contradicts the expected outcomes of the ECB&#x27;s expansionary monetary policy and the Fed&#x27;s restrictive approach. Expansionary policy in the EU should theoretically weaken the Euro, not strengthen it, when compared to the Dollar, which is being bolstered by higher interest rates and reduced money supply. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(k): Explain the potential effects of monetary and fiscal policy on exchange rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Caroline Taylor<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Caroline Taylor, CFA has recently joined North Pacific National Bank (NPNB) in New York as an analyst in its currency trading department. Taylor has a master&#x27;s degree in finance from a reputable business school. Working with a team of analysts, she must identify and execute profitable trading opportunities in the foreign exchange market and advise clients on foreign exchange risk management. Taylor saw the following information on the Bloomberg terminal about nominal and real interest rates, inflation rates, country risk premiums, and exchange rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0030.webp\" style=\"max-width:min(100%,612px)\" alt=\"Exhibit 1: Currency Information European Japan US Union One Year LIBOR 0.25% 2.25% 1.50% (nominal) One Year LIBOR 0.25% 1.50% 1.00% (real) JPY JPY Exchange rate USD 1.1000/EUR 105.5500/USD 116.1050/EUR Real Long-run Equilibrium JPY 102.50/USD USD 1.2250/EUR JPY 125.60/EUR Exchange Rate Risk Premium \"><p>Taylor also received the minutes of the European Central Bank&#x27;s Monetary Policy Committee and the Federal Reserve Board meeting. After reading these minutes, Taylor surmises that the European Central Bank is likely to pursue an expansionary monetary policy. In contrast, the Federal Reserve is expected to follow a hawkish (restrictive) monetary policy. Various European governments are expected to reduce their respective budget deficits, while the US government is likely to increase its budget deficit next year. Capital has been highly mobile between the US and European countries for more than a century now.<\/p><p>NPNB’s international equity investment analysis team regularly produces country risk assessment reports for internal use by various departments. The following are excerpts from the latest report:<\/p><p>The long-run real equilibrium JPY/USD exchange rate is likely to remain unchanged.<\/p><p>Real interest rates in the US are expected to decline relative to real interest rates in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0031.webp\" style=\"max-width:min(100%,63px)\" alt=\"Japan.\"><p>The US risk premium is expected to increase relative to Japan’s risk premium.<\/p><p>Hudson Asset Management Company, an NPNB client, specializes in international equity investments. Hudson’s portfolio manager approaches Taylor for advice on investments in three Baltic countries – Estonia, Latvia, and Lithuania. The portfolio manager wants to estimate these countries’ potential GDP growth rates and understand possible monetary policy directions. The table below provides economic and demographic information for the three Baltic countries.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0032.webp\" style=\"max-width:min(100%,583px)\" alt=\"Exhibit 2: Economic and Demographic Information Estonia Latvia Lithuania Labor force participation 71.20% 65.50% 64.50% Share of capital in total GDP 40% 35% 30% Sovereign rating AA- A+ A- Long-term growth rate of TFP 2.20% 1.80% 1.50% Long-term growth rate of capital 4.25% 3.75% 3.50% Long-term gro\"><p>All three countries have relatively independent central banks with inflation targeting as the primary goal. The countries also have well-established, high-volume, and highly liquid fixed income and equity markets. Though they share the same ethnic background, the average age in Estonia is 48 years, significantly higher than that of Latvia and Lithuania. Policymakers in Estonia believe that it will lack the knowledge in technology necessary to improve production methods.<\/p><p>Economic policymakers debate measures to increase each country&#x27;s long-term potential GDP growth rate.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the Mundell-Fleming model, the USD/EUR exchange rate is most likely to:<\/p><\/div>", "subj": "economics"}, {"n": 20, "q": "Using the excerpts from the country risk assessment reports, the long-run real JPY/USD exchange rate is expected to:", "opts": ["Remain unchanged", "Increase", "Decrease"], "ans": "C", "expl": "The long-run real exchange rate between two currencies is influenced by several factors including the real long-run equilibrium exchange rate, the real interest rate differential, and the relative risk premium. In the scenario provided, the real interest rates in the US are expected to decline relative to those in Japan. This differential shift in real interest rates affects the attractiveness of investments in these countries. Higher real interest rates in Japan make investments there more appealing, likely leading to an appreciation of the yen due to increased demand. Conversely, lower real interest rates in the US make it less attractive for investment, potentially leading to a depreciation of the dollar. Given the expected decline in US real interest rates relative to those in Japan and the anticipated increase in the US risk premium relative to Japan's, the USD is likely to depreciate relative to the JPY. This depreciation translates into a decrease in the JPY/USD exchange rate, meaning fewer yen would be needed to buy a dollar, reflecting the stronger relative value of the yen. This scenario aligns with the economic indicators and the principles of currency valuation based on interest rate differentials and risk perceptions. A is incorrect. The statement that the long-run real JPY/USD exchange rate will remain unchanged contradicts the expected changes in real interest rates and risk premiums between the US and Japan. Given that real interest rates in the US are expected to decline relative to those in Japan, and the US risk premium is expected to increase relative to Japan's, these factors contribute to a dynamic shift in the exchange rate, rather than a static one. The unchanged scenario would only hold if these economic indicators remained stable, which they are not expected to. B is incorrect. An increase in the JPY/USD exchange rate would imply that the yen is depreciating relative to the dollar, which is contrary to the expected economic conditions. With Japan's real interest rates rising relative to the US and a lower risk premium compared to the US, the yen is more likely to appreciate rather than depreciate. The increase in the JPY/USD exchange rate would suggest a movement opposite to the economic indicators provided, making this option incorrect. ", "explhtml": "<p>The long-run real exchange rate between two currencies is influenced by several factors including the real long-run equilibrium exchange rate, the real interest rate differential, and the relative risk premium. In the scenario provided, the real interest rates in the US are expected to decline relative to those in Japan. This differential shift in real interest rates affects the attractiveness of investments in these countries. Higher real interest rates in Japan make investments there more appealing, likely leading to an appreciation of the yen due to increased demand. Conversely, lower real interest rates in the US make it less attractive for investment, potentially leading to a depreciation of the dollar.<\/p><p>Given the expected decline in US real interest rates relative to those in Japan and the anticipated increase in the US risk premium relative to Japan&#x27;s, the USD is likely to depreciate relative to the JPY. This depreciation translates into a decrease in the JPY/USD exchange rate, meaning fewer yen would be needed to buy a dollar, reflecting the stronger relative value of the yen. This scenario aligns with the economic indicators and the principles of currency valuation based on interest rate differentials and risk perceptions.<\/p><p><b>A is incorrect<\/b>. The statement that the long-run real JPY/USD exchange rate will remain unchanged contradicts the expected changes in real interest rates and risk premiums between the US and Japan. Given that real interest rates in the US are expected to decline relative to those in Japan, and the US risk premium is expected to increase relative to Japan&#x27;s, these factors contribute to a dynamic shift in the exchange rate, rather than a static one. The unchanged scenario would only hold if these economic indicators remained stable, which they are not expected to.<\/p><p><b>B is incorrect<\/b>. An increase in the JPY/USD exchange rate would imply that the yen is depreciating relative to the dollar, which is contrary to the expected economic conditions. With Japan&#x27;s real interest rates rising relative to the US and a lower risk premium compared to the US, the yen is more likely to appreciate rather than depreciate. The increase in the JPY/USD exchange rate would suggest a movement opposite to the economic indicators provided, making this option incorrect. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (h): Explain approaches to assessing the long-run fair value of an exchange rate<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Caroline Taylor<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Caroline Taylor, CFA has recently joined North Pacific National Bank (NPNB) in New York as an analyst in its currency trading department. Taylor has a master&#x27;s degree in finance from a reputable business school. Working with a team of analysts, she must identify and execute profitable trading opportunities in the foreign exchange market and advise clients on foreign exchange risk management. Taylor saw the following information on the Bloomberg terminal about nominal and real interest rates, inflation rates, country risk premiums, and exchange rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0030.webp\" style=\"max-width:min(100%,612px)\" alt=\"Exhibit 1: Currency Information European Japan US Union One Year LIBOR 0.25% 2.25% 1.50% (nominal) One Year LIBOR 0.25% 1.50% 1.00% (real) JPY JPY Exchange rate USD 1.1000/EUR 105.5500/USD 116.1050/EUR Real Long-run Equilibrium JPY 102.50/USD USD 1.2250/EUR JPY 125.60/EUR Exchan nverse of the CAD/AUD offer rate), the result would still not match 1.26179. The correct method involves using the inverse of the CAD/AUD offer rate to find the AUD/CAD bid rate and then multiplying it by the CAD/CHF bid rate, as detailed in the correct answer explanation.<\/p><p><b>C is incorrect<\/b>. It lists the AUD/CHF bid rate as 1.39573, which is very close to the correct answer but still incorrect. This value likely results from using the AUD/CAD offer rate instead of the bid rate in the calculation. The slight difference between 1.39568 (correct answer) and 1.39573 indicates a small error in the rate used, emphasizing the importance of selecting the correct bid and offer rates when performing currency conversions through triangular arbitrage. The precision in selecting the correct bid or offer rate is crucial in financial calculations to ensure accuracy. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(a): Calculate and interpret the bid–offer spread on a spot or forward currency quotation and describe the factors that affect the bid–offer spread<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Gillian LeBlanc<\/summary><div class=\"vig-body\"><p>Gillian LeBlanc is a currency trader with Doncliffe Associates. On Tuesday evenings, she teaches a course on foreign exchange markets at a local university. In preparing for her next class, LeBlanc gathers the following spot rate quotes from the interbank market:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0035.webp\" style=\"max-width:min(100%,467px)\" alt=\"Exhibit 1: Spot interbank market exchange rates Bid Offer CAD/AUD 0.95081 0.95084 CAD/CHF 1.32707 1.32712 JPY/USD 83.9480 83.9720\"><p>Because she also wishes to cover the topic of forward exchange rates, LeBlanc gathers the following data on interest rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0036.webp\" style=\"max-width:min(100%,441px)\" alt=\"Exhibit 2: Selected Libor rates (annualized) USD JPY 10-month Libor 1.64% 3.42% 12-month Libor 1.82% 3.65%\"><p>During class the following Tuesday, LeBlanc is asked by one of her students about the factors that determine the size of bid-offer spreads in spot and forward markets. LeBlanc responds, “In both spot and forward markets, bid-offer spreads are narrower for heavily-traded currency pairs than quoted spreads for currency pairs that trade less frequently. Also, traders will quote clients narrower spreads for smaller order sizes – regardless of whether it is for a spot or forward trade. For trades that are otherwise equivalent with respect to size, currency pair, time of day, etc., spreads will be wider in the forward market than the spot market due to greater credit risk and interest rate risk.”<\/p><p>LeBlanc asks her class to discuss the relationship between currency exchange rates and a country’s balance of payments. One of her students, Thomas Marsh, makes the following comment: “In the short-term, investment flows influence exchange rates because real prices for goods and services respond to market signals more quickly than the exchange rate.”<\/p><p>The class then discusses the case of Zambidia – a country that has experienced rapid economic growth in recent years. Zambidia&#x27;s economy was predominantly agricultural for most of its history, but it has transformed significantly as it&#x27;s government enacted a series of liberalizing reforms over the past decade.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information provided in Exhibit 1, the interbank AUD/CHF bid rate is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 22, "q": "Assuming that covered interest rate parity holds, the 300-day JPY/USD forward rate is closest to:", "opts": ["85.1886.", "85.4304.", "85.4690."], "ans": "A", "expl": "To find the 300-day JPY/USD forward rate, we start by calculating the mid-market spo  style=\"max-width:min(100%,223px)\" alt=\"83.9480 + 83.9720 = 83.9600. 2\"><p>Next, we use the formula for covered interest rate parity, which states that the forward rate is determined by the spot rate adjusted for the interest rate differentials between the two currencies. The formula is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0040.webp\" style=\"max-width:min(100%,218px)\" alt=\"days (1 + iforeign × 360 ) F = S × days , (1 + idomestic × 360 )\"><p>where F is the forward rate, S is the spot rate, i<sub>foreign<\/sub> and i<sub>domestic<\/sub> are the foreign and domestic interest rates respectively, and days is the number of days to maturity. Plugging in the values, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0041.webp\" style=\"max-width:min(100%,341px)\" alt=\"(1 + 0.0342 × 330600) F = 83.9600 × (1 + 0.0164 × 300 360 = 85.1886. )\"><p>This calculation shows that the forward rate is closest to 85.1886, which corresponds to option A.<\/p><p><b>B is incorrect<\/b>. This value might result from incorrect application of the interest rates or incorrect adjustment of the number of days in the calculation. The correct method involves using the 10-month Libor rates for both currencies and adjusting for the exact number of days (300 days), not a full year. The calculation provided in the correct answer clearly shows that using the correct parameters and formula leads to a result of 85.1886, not 85.4304.<\/p><p><b>C is incorrect<\/b>. It suggests a forward rate of 85.4690. This value could be the result of using the 12-month Libor rates instead of the 10-month rates. The 12-month rates are slightly higher, which would result in a slightly higher forward rate when calculated incorrectly using these rates for a 300-day period. However, the correct approach uses the 10-month rates, as the forward contract&#x27;s term is closer to 10 months (300 days) than to 12 months (360 days). The correct calculation using the 10-month rates results in a forward rate of 85.1886, not 85.4690. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(c): Contrast spot and forward rates and calculate the forward premium/discount for a given currency<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Gillian LeBlanc<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gillian LeBlanc is a currency trader with Doncliffe Associates. On Tuesday evenings, she teaches a course on foreign exchange markets at a local university. In preparing for her next class, LeBlanc gathers the following spot rate quotes from the interbank market:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0035.webp\" style=\"max-width:min(100%,467px)\" alt=\"Exhibit 1: Spot interbank market exchange rates Bid Offer CAD/AUD 0.95081 0.95084 CAD/CHF 1.32707 1.32712 JPY/USD 83.9480 83.9720\"><p>Because she also wishes to cover the topic of forward exchange rates, LeBlanc gathers the following data on interest rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0036.webp\" style=\"max-width:min(100%,441px)\" alt=\"Exhibit 2: Selected Libor rates (annualized) USD JPY 10-month Libor 1.64% 3.42% 12-month Libor 1.82% 3.65%\"><p>During class the following Tuesday, LeBlanc is asked by one of her students about the factors that determine the size of bid-offer spreads in spot and forward markets. LeBlanc responds, “In both spot and forward markets, bid-offer spreads are narrower for heavily-traded currency pairs than quoted spreads for currency pairs that trade less frequently. Also, traders will quote clients narrower spreads for smaller order sizes – regardless of whether it is for a spot or forward trade. For trades that are otherwise equivalent with respect to size, currency pair, time of day, etc., spreads will be wider in the forward market than the spot market due to greater credit risk and interest rate risk.”<\/p><p>LeBlanc asks her class to discuss the relationship between currency exchange rates and a country’s balance of payments. One of her students, Thomas Marsh, makes the following comment: “In the short-term, investment flows influence exchange rates because real prices for goods and services respond to market signals more quickly than the exchange rate.”<\/p><p>The class then discusses the case of Zambidia – a country that has experienced rapid economic growth in recent years. Zambidia&#x27;s economy was predominantly agricultural for most of its history, but it has transformed significantly as it&#x27;s government enacted a series of liberalizing reforms over the past decade.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming that covered interest rate parity holds, the 300-day JPY/USD forward rate is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 23, "q": "LeBlanc’s statement about bid-offer spreads in spot and forward markets is most likely:", "opts": ["Correct.", "Incorrect with respect to order size.", "Incorrect with respect to credit risk and interest rate risk."], "ans": "A", "expl": "LeBlanc's statement regarding the factors influencing bid-offer spreads in both spot and forward markets is accurate for several reasons. Firstly, in the context of heavily-traded currency pairs, these pairs exhibit lower bid-offer spreads due to higher liquidity. Liquidity refers to the ease with which assets can be bought or sold in the market without affecting the asset's price. More frequently traded currencies, such as the USD or EUR, typically have more market participants and thus, more liquidity. This increased liquidity reduces the market impact of trades, allowing for tighter spreads between the buying and selling prices. B is incorrect. LeBlanc's statement that traders quote narrower spreads for smaller order sizes is grounded in market mechanics. Smaller order sizes pose less risk to a trader’s position, as they are easier to offset in the market without large price concessions. When a trader has to execute a large order, they might have to accept a less favorable price to complete the trade quickly, leading to a wider spread. Conversely, smaller orders can be matched more easily with existing orders, maintaining tighter spreads. This principle holds true regardless of the market being spot or forward, as the underlying concern is the impact of the order size on the market. C is incorrect. The statement that bid-offer spreads are wider in the forward market than in the spot market due to increased credit risk and interest rate risk is also correct. In forward markets, the settlement of the trade occurs at a future date. The longer the duration until settlement, the greater the uncertainty and the higher the risk of changes in credit conditions of the counterparty or fluctuations in interest rates. These risks are less pronounced in the spot market where trades are settled quickly (typically within two days). The increased risks in forward markets necessitate wider spreads to compensate traders for the additional risks assumed over the longer duration. Overall, LeBlanc’s explanations reflect well-established financial principles regarding the dynamics of bid-offer spreads in currency markets, influenced by liquidity, order size, and the specific risks associated with the timing of trade settlement. ", "explhtml": "<p>LeBlanc&#x27;s statement regarding the factors influencing bid-offer spreads in both spot and forward markets is accurate for several reasons. Firstly, in the context of heavily-traded currency pairs, these pairs exhibit lower bid-offer spreads due to higher liquidity. Liquidity refers to the ease with which assets can be bought or sold in the market without affecting the asset&#x27;s price. More frequently traded currencies, such as the USD or EUR, typically have more market participants and thus, more liquidity. This increased liquidity reduces the market impact of trades, allowing for tighter spreads between the buying and selling prices.<\/p><p><b>B is incorrect<\/b>. LeBlanc&#x27;s statement that traders quote narrower spreads for smaller order sizes is grounded in market mechanics. Smaller order sizes pose less risk to a trader’s position, as they are easier to offset in the market without large price concessions. When a trader has to execute a large order, they might have to accept a less favorable price to complete the trade quickly, leading to a wider spread. Conversely, smaller orders can be matched more easily with existing orders, maintaining tighter spreads. This principle holds true regardless of the market being spot or forward, as the underlying concern is the impact of the order size on the market.<\/p><p><b>C is incorrect<\/b>. The statement that bid-offer spreads are wider in the forward market than in the spot market due to increased credit risk and interest rate risk is also correct. In forward markets, the settlement of the trade occurs at a future date. The longer the duration until settlement, the greater the uncertainty and the higher the risk of changes in credit conditions of the counterparty or fluctuations in interest rates. These risks are less pronounced in the spot market where trades are settled quickly (typically within two days). The increased risks in forward markets necessitate wider spreads to compensate traders for the additional risks assumed over the longer duration.<\/p><p>Overall, LeBlanc’s explanations reflect well-established financial principles regarding the dynamics of bid-offer spreads in currency markets, influenced by liquidity, order size, and the specific risks associated with the timing of trade settlement. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(a): Calculate and interpret the bid–offer spread on a spot or forward currency quotation and describe the factors that affect the bid–offer spread<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Gillian LeBlanc<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gillian LeBlanc is a currency trader with Doncliffe Associates. On Tuesday evenings, she teaches a course on foreign exchange markets at a local university. In preparing for her next class, LeBlanc gathers the following spot rate quotes from the interbank market:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0035.webp\" style=\"max-width:min(100%,467px)\" alt=\"Exhibit 1: Spot interbank market exchange rates Bid Offer CAD/AUD 0.95081 0.95084 CAD/CHF 1.32707 1.32712 JPY/USD 83.9480 83.9720\"><p>Because she also wishes to cover the topic of forward exchange rates, LeBlanc gathers the following data on interest rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0036.webp\" style=\"max-width:min(100%,441px)\" alt=\"Exhibit 2: Selected Libor rates (annualized) USD JPY 10-month Libor 1.64% 3.42% 12-month Libor 1.82% 3.65%\"><p>During class the following Tuesday, LeBlanc is asked by one of her students about the factors that determine the size of bid-offer spreads in spot and forward markets. LeBlanc responds, “In both spot and forward markets, bid-offer spreads are narrower for heavily-traded currency pairs than quoted spreads for currency pairs that trade less frequently. Also, traders will quote clients narrower spreads for smaller order sizes – regardless of whether it is for a spot or forward trade. For trades that are otherwise equivalent with respect to size, currency pair, time of day, etc., spreads will be wider in the forward market than the spot market due to greater credit risk and interest rate risk.”<\/p><p>LeBlanc asks her class to discuss the relationship between currency exchange rates and a country’s balance of payments. One of her students, Thomas Marsh, makes the following comment: “In the short-term, investment flows influence exchange rates because real prices for goods and services respond to market signals more quickly than the exchange rate.”<\/p><p>The class then discusses the case of Zambidia – a country that has experienced rapid economic growth in recent years. Zambidia&#x27;s economy was predominantly agricultural for most of its history, but it has transformed significantly as it&#x27;s government enacted a series of liberalizing reforms over the past decade.<\/p><\/div><\/details><div class=\"qtext\"><p>LeBlanc’s statement about bid-offer spreads in spot and forward markets is most likely:<\/p><\/div>", "subj": "economics"}, {"n": 24, "q": "Is Marsh’s comment about the relationship between investment flows and exchange rates most likely correct:", "opts": ["Yes", "No, because exchange rates react more quickly to economic signals than real prices", "No, because trade flows have more influence over exchange rates than investment flows in the short-term"], "ans": "B", "expl": "Thomas Marsh's comment regarding the relationship between investment flows and exchange rates is not entirely accurate. While it is true that investment flows can significantly influence exchange rates in the short term, Marsh's statement that real prices for goods and services respond more quickly to market signals than exchange rates is incorrect. In reality, exchange rates are highly sensitive and react more swiftly to economic signals compared to real prices. Exchange rates can adjust almost instantaneously to news and market sentiments due to the high liquidity and continuous trading in the forex markets. This rapid response is facilitated by the electronic trading platforms and global nature of currency markets, which operate nearly 24/7. In contrast, real prices often involve physical goods and services, whose prices adjust more slowly due to factors like production costs, logistical considerations, and less frequent transactions. A is incorrect. It suggests that Marsh's comment is correct, which is not the case. Marsh's underlying assumption that real prices respond more quickly than exchange rates is flawed. As explained, exchange rates are among the most sensitive financial indicators to economic signals, reacting almost instantaneously to new information. This immediate response is due to the electronic and global nature of the forex markets, unlike the markets for goods and services, which are constrained by physical and operational limitations that delay price adjustments. C is incorrect. Although trade flows do influence exchange rates, particularly in the long term, Marsh's statement specifically addresses the short-term dynamics where investment flows are indeed a more dominant factor. In the short term, financial capital moves more quickly and in larger volumes compared to trade flows, thereby exerting a more immediate impact on exchange rates. However, the reason provided by Marsh for this influence is incorrect, as discussed earlier, making option C an incorrect choice despite partially acknowledging the role of trade flows. ", "explhtml": "<p>Thomas Marsh&#x27;s comment regarding the relationship between investment flows and exchange rates is not entirely accurate. While it is true that investment flows can significantly influence exchange rates in the short term, Marsh&#x27;s statement that real prices for goods and services respond more quickly to market signals than exchange rates is incorrect. In reality, exchange rates are highly sensitive and react more swiftly to economic signals compared to real prices. Exchange rates can adjust almost instantaneously to news and market sentiments due to the high liquidity and continuous trading in the forex markets. This rapid response is facilitated by the electronic trading platforms and global nature of currency markets, which operate nearly 24/7. In contrast, real prices often involve physical goods and services, whose prices adjust more slowly due to factors like production costs, logistical considerations, and less frequent transactions.<\/p><p><b>A is incorrect<\/b>. It suggests that Marsh&#x27;s comment is correct, which is not the case. Marsh&#x27;s underlying assumption that real prices respond more quickly than exchange rates is flawed. As explained, exchange rates are among the most sensitive financial indicators to economic signals, reacting almost instantaneously to new information. This immediate response is due to the electronic and global nature of the forex markets, unlike the markets for goods and services, which are constrained by physical and operational limitations that delay price adjustments.<\/p><p><b>C is incorrect<\/b>. Although trade flows do influence exchange rates, particularly in the long term, Marsh&#x27;s statement specifically addresses the short-term dynamics where investment flows are indeed a more dominant factor. In the short term, financial capital moves more quickly and in larger volumes compared to trade flows, thereby exerting a more immediate impact on exchange rates. However, the reason provided by Marsh for this influence is incorrect, as discussed earlier, making option C an incorrect choice despite partially acknowledging the role of trade flows. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(a): Calculate and interpret the bid–offer spread on a spot or forward currency quotation and describe the factors that affect the bid–offer spread<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Gillian LeBlanc<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gillian LeBlanc is a currency trader with Doncliffe Associates. On Tuesday evenings, she teaches a course on foreign exchange markets at a local university. In preparing for her next class, LeBlanc gathers the following spot rate quotes from the interbank market:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0035.webp\" style=\"max-width:min(100%,467px)\" alt=\"Exhibit 1: Spot interbank market exchange rates Bid Offer CAD/AUD 0.95081 0.95084 CAD/CHF 1.32707 1.32712 JPY/USD 83.9480 83.9720\"><p>Because she also wishes to cover the topic of forward exchange rates, LeBlanc gathers the following data on interest rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0036.webp\" style=\"max-width:min(100%,441px)\" alt=\"Exhibit 2: Selected Libor rates (annualized) USD JPY 10-month Libor 1.64% 3.42% 12-month Libor 1.82% 3.65%\"><p>During class the following Tuesday, LeBlanc is asked by one of her students about the factors that determine the size of bid-offer spreads in spot and forward markets. LeBlanc responds, “In both spot and forward markets, bid-offer spreads are narrower for heavily-traded currency pairs than quoted spreads for currency pairs that trade less frequently. Also, traders will quote clients narrower spreads for smaller order sizes – regardless of whether it is for a spot or forward trade. For trades that are otherwise equivalent with respect to size, currency pair, time of day, etc., spreads will be wider in the forward market than the spot market due to greater credit risk and interest rate risk.”<\/p><p>LeBlanc asks her class to discuss the relationship between currency exchange rates and a country’s balance of payments. One of her students, Thomas Marsh, makes the following comment: “In the short-term, investment flows influence exchange rates because real prices for goods and services respond to market signals more quickly than the exchange rate.”<\/p><p>The class then discusses the case of Zambidia – a country that has experienced rapid economic growth in recent years. Zambidia&#x27;s economy was predominantly agricultural for most of its history, but it has transformed significantly as it&#x27;s government enacted a series of liberalizing reforms over the past decade.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Marsh’s comment about the relationship between investment flows and exchange rates most likely correct:<\/p><\/div>", "subj": "economics"}, {"n": 25, "q": "One of the factors affecting foreign exchange spreads quoted by dealers is the relationship between dealer and client. Hamid’s dealer gives him favorable quotes for the ongoing business relationship he has with him. Which of the following is least likely a factor that affects foreign exchange spreads:", "opts": ["Market volatility", "Transaction size", "Investor sentiment"], "ans": "C", "expl": "Market volatility is a significant factor affecting foreign exchange spreads. When volatility is high, the uncertainty in currency value fluctuations increases. Dealers, to mitigate the risk of potential losses during these fluctuations, widen the spreads. This compensatory widening is crucial as it protects the dealer's financial interests by providing a buffer against unpredictable market movements. For instance, in a volatile market, a dealer might increase the spread from 1.2512/1.2536 to 1.3455/1.3480, as seen in the CAD/USD rates quoted for Hamid. This change reflects the dealer's need to manage increased risk. While investor sentiment can influence market prices and exchange rates, it is less likely to have a direct impact on the spreads quoted by dealers. Spreads are primarily affected by factors that influence the risk and liquidity associated with a currency transaction, such as market volatility and transaction size. Investor sentiment might indirectly affect spreads through its impact on market conditions and volatility, but it does not directly dictate the bid-ask spread set by dealers. Therefore, compared to market volatility and transaction size, investor sentiment is the least likely factor to affect foreign exchange spreads directly. A is incorrect. Market volatility directly impacts the spreads quoted by dealers. In periods of high volatility, the risk of currency fluctuations increases, and dealers widen spreads to compensate. This is evident in the CAD/USD rates provided to Hamid, which widen as market conditions change. The direct correlation between market volatility and spread adjustments is well-documented in currency markets, making it a critical factor in determining foreign exchange spreads. B is incorrect. The size of the transaction significantly influences the spreads dealers quote. Larger transactions demand more liquidity and pose a higher risk to the dealer. To offset this risk, dealers often quote wider spreads for larger transactions. This is because large transactions can affect the currency's market price due to the substantial volume being traded. Therefore, by widening the spread, dealers ensure they have a safety margin to accommodate the potential market impact of large trades. This practice is common in the foreign exchange market to maintain dealer stability and market integrity. ", "explhtml": "<p>Market volatility is a significant factor affecting foreign exchange spreads. When volatility is high, the uncertainty in currency value fluctuations increases. Dealers, to mitigate the risk of potential losses during these fluctuations, widen the spreads. This compensatory widening is crucial as it protects the dealer&#x27;s financial interests by providing a buffer against unpredictable market movements. For instance, in a volatile market, a dealer might increase the spread from 1.2512/1.2536 to 1.3455/1.3480, as seen in the CAD/USD rates quoted for Hamid. This change reflects the dealer&#x27;s need to manage increased risk.<\/p><p>While investor sentiment can influence market prices and exchange rates, it is less likely to have a direct impact on the spreads quoted by dealers. Spreads are primarily affected by factors that influence the risk and liquidity associated with a currency transaction, such as market volatility and transaction size. Investor sentiment might indirectly affect spreads through its impact on market conditions and volatility, but it does not directly dictate the bid-ask spread set by dealers. Therefore, compared to market volatility and transaction size, investor sentiment is the least likely factor to affect foreign exchange spreads directly.<\/p><p><b>A is incorrect<\/b>. Market volatility directly impacts the spreads quoted by dealers. In periods of high volatility, the risk of currency fluctuations increases, and dealers widen spreads to compensate. This is evident in the CAD/USD rates provided to Hamid, which widen as market conditions change. The direct correlation between market volatility and spread adjustments is well-documented in currency markets, making it a critical factor in determining foreign exchange spreads.<\/p><p><b>B is incorrect<\/b>. The size of the transaction significantly influences the spreads dealers quote. Larger transactions demand more liquidity and pose a higher risk to the dealer. To offset this risk, dealers often quote wider spreads for larger transactions. This is because large transactions can affect the currency&#x27;s market price due to the substantial volume being traded. Therefore, by widening the spread, dealers ensure they have a safety margin to accommodate the potential market impact of large trades. This practice is common in the foreign exchange market to maintain dealer stability and market integrity. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (a): Calculate and interpret the bid–offer spread on a spot or forward currency quotation and describe the factors that affect the bid–offer spread<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Hamid<\/summary><div class=\"vig-body\"><p>Hamid has been investing in the foreign exchange market for more than 10 years. He has an ongoing business relationship with his dealer, who gives him favorable currency exchange rates. Hamid’s dealer quotes the following rates today:<\/p><p>SGD/EUR 1.4514 – 1.5122<\/p><p>SGD/MYR 0.3428 – 0.3890<\/p><p>EUR/MYR 0.2824 – 0.3755<\/p><p>Hamid did a few quick calculations and was surprised to discover triangular arbitrage was possible based on his dealer’s quotes. Hamid has some EUR that he could use to take advantage of this rare arbitrage opportunity. In addition, Hamid speculates that the USD will strengthen relative to the CAD in the coming months. He decides to enter into a 90-day forward contract to buy USD 1 million with CAD.<\/p><p>His dealer quotes the following CAD/USD forward premiums today (t=0):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0042.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.2512/1.2536 30-day +4.6/+5.3 90-day +18.1/+21.3\"><p>Sixty days later (t=60), the dealer quotes the following CAD/USD forward premiums:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0043.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.3455/1.3480 30-day +4.9/+5.4 90-day +19.0/+21.6\"><p>Ninety days later (t=90), the dealer quotes the following CAD/USD forward premiums: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0044.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.3771/1.3800 30-day +5.0/+5.5 90-day +19.8/+21.9\"><p>The following information is available (at t=60) for CAD interest rates (annualized):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0045.webp\" style=\"max-width:min(100%,192px)\" alt=\"30-day rate: 1.53% 90-day rate: 1.71%\"><\/div><\/details><div class=\"qtext\"><p>One of the factors affecting foreign exchange spreads quoted by dealers is the relationship between dealer and client. Hamid’s dealer gives him favorable quotes for the ongoing business relationship he has with him. Which of the following is least likely a factor that affects foreign exchange spreads:<\/p><\/div>", "subj": "economics"}, {"n": 26, "q": "Today’s bid and offers rates for a 90-day CAD/USD forward contract are closest to:", "opts": ["CAD/USD 1.2530 - 1.2557", "CAD/USD 1.2693 - 1.2749", "CAD/USD 1.3771 - 1.3800"], "ans": "A", "expl": "The correct answer is option A because it most accurately reflects the calculation of the 90-day forward rate based on the given spot rate and forward premium. Initially, the spot bid rate for CAD/USD is 1.2512 and the spot ask rate is 1.2536. The forward premium for the 90-day contract is quoted as +18.1 for the bid and +21.3 for the ask. These premiums are expressed in points, where one point is equivalent to 0.0001 in the exchange rate. Therefore, the calculation for the 90-day forward bid rate is: Similarly, the calculation for the 90-day forward ask rate is: These calculations show that the 90-day forward rates are approximately 1.2530 for the bid and 1.2557 for the ask, which aligns closely with option A. B is incorrect. It suggests a forward rate of CAD/USD 1.2693 - 1.2749, which does not align with the calculated forward rates based on the given data. The discrepancy arises because the forward premiums added to the spot rates in option B are significantly higher than those provided. The forward premium for the bid in option B would imply an addition of about 0.0181 (181 points), and for the ask, about 0.0213 (213 points), which are not supported by the data provided. This miscalculation leads to a forward rate that is too high compared to the correct calculation. C is incorrect. It suggests a forward rate of CAD/USD 1.3771 - 1.3800, which is actually the spot rate quoted at t=90 days, not the forward rate at t=0 for a 90-day contract. This option confuses the spot rate at a future date with the forward rate calculated from the initial spot rate and the forward premium. Forward rates are predictive and locked in at the contract's initiation based on the spot rate at that time plus the forward premium, not based on future spot rates. ", "explhtml": "<p>The correct answer is option A because it most accurately reflects the calculation of the 90-day forward rate based on the given spot rate and forward premium. Initially, the spot bid rate for CAD/USD is 1.2512 and the spot ask rate is 1.2536. The forward premium for the 90-day contract is quoted as +18.1 for the bid and +21.3 for the ask. These premiums are expressed in points, where one point is equivalent to 0.0001 in the exchange rate. Therefore, the calculation for the 90-day forward bid rate is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0046.webp\" style=\"max-width:min(100%,437px)\" alt=\"1.2512 + (0.0001 × 18.1) = 1.2512 + 0.00181 = 1.25301\"><p>Similarly, the calculation for the 90-day forward ask rate is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0047.webp\" style=\"max-width:min(100%,438px)\" alt=\"1.2536 + (0.0001 × 21.3) = 1.2536 + 0.00213 = 1.25573\"><p>These calculations show that the 90-day forward rates are approximately 1.2530 for the bid and 1.2557 for the ask, which aligns closely with option A.<\/p><p><b>B is incorrect<\/b>. It suggests a forward rate of CAD/USD 1.2693 - 1.2749, which does not align with the calculated forward rates based on the given data. The discrepancy arises because the forward premiums added to the spot rates in option B are significantly higher than those provided. The forward premium for the bid in option B would imply an addition of about 0.0181 (181 points), and for the ask, about 0.0213 (213 points), which are not supported by the data provided. This miscalculation leads to a forward rate that is too high compared to the correct calculation.<\/p><p><b>C is incorrect<\/b>. It suggests a forward rate of CAD/USD 1.3771 - 1.3800, which is actually the spot rate quoted at t=90 days, not the forward rate at t=0 for a 90-day contract. This option confuses the spot rate at a future date with the forward rate calculated from the initial spot rate and the forward premium. Forward rates are predictive and locked in at the contract&#x27;s initiation based on the spot rate at that time plus the forward premium, not based on future spot rates. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (c): Contrast spot and forward rates and calculate the forward premium/discount for a given currency<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Hamid<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hamid has been investing in the foreign exchange market for more than 10 years. He has an ongoing business relationship with his dealer, who gives him favorable currency exchange rates. Hamid’s dealer quotes the following rates today:<\/p><p>SGD/EUR 1.4514 – 1.5122<\/p><p>SGD/MYR 0.3428 – 0.3890<\/p><p>EUR/MYR 0.2824 – 0.3755<\/p><p>Hamid did a few quick calculations and was surprised to discover triangular arbitrage was possible based on his dealer’s quotes. Hamid has some EUR that he could use to take advantage of this rare arbitrage opportunity. In addition, Hamid speculates that the USD will strengthen relative to the CAD in the coming months. He decides to enter into a 90-day forward contract to buy USD 1 million with CAD.<\/p><p>His dealer quotes the following CAD/USD forward premiums today (t=0):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0042.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.2512/1.2536 30-day +4.6/+5.3 90-day +18.1/+21.3\"><p>Sixty days later (t=60), the dealer quotes the following CAD/USD forward premiums:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0043.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.3455/1.3480 30-day +4.9/+5.4 90-day +19.0/+21.6\"><p>Ninety days later (t=90), the dealer quotes the following CAD/USD forward premiums: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0044.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.3771/1.3800 30-day +5.0/+5.5 90-day +19.8/+21.9\"><p>The following information is available (at t=60) for CAD interest rates (annualized):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0045.webp\" style=\"max-width:min(100%,192px)\" alt=\"30-day rate: 1.53% 90-day rate: 1.71%\"><\/div><\/details><div class=\"qtext\"><p>Today’s bid and offers rates for a 90-day CAD/USD forward contract are closest to:<\/p><\/div>", "subj": "economics"}, {"n": 27, "q": "The EUR/MYR bid and offer cross rates offered by an individual dealer that will make triangular arbitrage impossible are closest to: A. B. C.", "opts": ["Bid Offer 0.2267 0.2680", "Bid Offer 0.2680 0.4975", "Bid Offer 0.4975 0.5882"], "ans": "A", "expl": "To determine the bid and offer cross rates that would make triangular arbitrage impossible, we need to calculate the implied cross rates using the given bid and offer rates for SGD/EUR and SGD/MYR. Triangular arbitrage is not possible when the calculated cross rates match the quoted cross rates for EUR/MYR. The bid rate for EUR/MYR can be calculated by taking the reciprocal of the offer rate for SGD/EUR and multiplying it by the bid rate for SGD/MYR. Mathematically, this is represented as: The offer rate for EUR/MYR is calculated by taking the reciprocal of the bid rate for SGD/EUR and multiplying it by the offer rate for SGD/MYR. This is given by: B is incorrect. The bid and offer rates provided in option B are 0.2680 and 0.4975, respectively. These rates do not match the calculated rates of 0.2267 (bid) and 0.2680 (offer). The significant difference between these rates suggests that triangular arbitrage could be possible, as traders could exploit the discrepancy between the market's quoted rates and the calculated cross rates to make a profit. C is incorrect. The rates given in option C are 0.4975 (bid) and 0.5882 (offer). These rates are far from the calculated rates of 0.2267 and 0.2680. The large gap between these rates further indicates the possibility of triangular arbitrage, as the market's quoted rates significantly deviate from the rates derived from other currency pairs, allowing for potential profit through arbitrage strategies. ", "explhtml": "<p>To determine the bid and offer cross rates that would make triangular arbitrage impossible, we need to calculate the implied cross rates using the given bid and offer rates for SGD/EUR and SGD/MYR. Triangular arbitrage is not possible when the calculated cross rates match the quoted cross rates for EUR/MYR.<\/p><p>The bid rate for EUR/MYR can be calculated by taking the reciprocal of the offer rate for SGD/EUR and multiplying it by the bid rate for SGD/MYR. Mathematically, this is represented as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0051.webp\" style=\"max-width:min(100%,622px)\" alt=\"1 1 EUR/MYR (bid) = × SGD/MYR (bid) = × 0.3428 = 0.2267 SGD/EUR (offer) 1.5122\"><p>The offer rate for EUR/MYR is calculated by taking the reciprocal of the bid rate for SGD/EUR and multiplying it by the offer rate for SGD/MYR. This is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0052.webp\" style=\"max-width:min(100%,640px)\" alt=\"1 1 EUR/MYR (offer) = × SGD/MYR (offer) = × 0.3890 = 0.2680 SGD/EUR (bid) 1.4514\"><p><b>B is incorrect<\/b>. The bid and offer rates provided in option B are 0.2680 and 0.4975, respectively. These rates do not match the calculated rates of 0.2267 (bid) and 0.2680 (offer). The significant difference between these rates suggests that triangular arbitrage could be possible, as traders could exploit the discrepancy between the market&#x27;s quoted rates and the calculated cross rates to make a profit.<\/p><p><b>C is incorrect<\/b>. The rates given in option C are 0.4975 (bid) and 0.5882 (offer). These rates are far from the calculated rates of 0.2267 and 0.2680. The large gap between these rates further indicates the possibility of triangular arbitrage, as the market&#x27;s quoted rates significantly deviate from the rates derived from other currency pairs, allowing for potential profit through arbitrage strategies. <\/p><p class=\"los\">Study Session 3, Learning Module 8: Currency Exchange Rates: Understanding Equilibrium Value. LOS 8 (b): Identify a triangular arbitrage opportunity and calculate its profit, given the bid–offer quotations for three currencies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Hamid<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hamid has been investing in the foreign exchange market for more than 10 years. He has an ongoing business relationship with his dealer, who gives him favorable currency exchange rates. Hamid’s dealer quotes the following rates today:<\/p><p>SGD/EUR 1.4514 – 1.5122<\/p><p>SGD/MYR 0.3428 – 0.3890<\/p><p>EUR/MYR 0.2824 – 0.3755<\/p><p>Hamid did a few quick calculations and was surprised to discover triangular arbitrage was possible based on his dealer’s quotes. Hamid has some EUR that he could use to take advantage of this rare arbitrage opportunity. In addition, Hamid speculates that the USD will strengthen relative to the CAD in the coming months. He decides to enter into a 90-day forward contract to buy USD 1 million with CAD.<\/p><p>His dealer quotes the following CAD/USD forward premiums today (t=0):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0042.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.2512/1.2536 30-day +4.6/+5.3 90-day +18.1/+21.3\"><p>Sixty days later (t=60), the dealer quotes the following CAD/USD forward premiums:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0043.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.3455/1.3480 30-day +4.9/+5.4 90-day +19.0/+21.6\"><p>Ninety days later (t=90), the dealer quotes the following CAD/USD forward premiums: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0044.webp\" style=\"max-width:min(100%,288px)\" alt=\"Maturity Rate Spot 1.3771/1.3800 30-day +5.0/+5.5 90-day +19.8/+21.9\"><p>The following information is available (at t=60) for CAD interest rates (annualized):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0045.webp\" style=\"max-width:min(100%,192px)\" alt=\"30-day rate: 1.53% 90-day rate: 1.71%\"><\/div><\/details><div class=\"qtext\"><p>The EUR/MYR bid and offer cross rates offered by an individual dealer that will make triangular arbitrage impossible are closest to:<\/p><p>A.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0048.webp\" style=\"max-width:min(100%,133px)\" alt=\"Bid Offer 0.2267 0.2680\"><p>B.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0049.webp\" style=\"max-width:min(100%,133px)\" alt=\"Bid Offer 0.2680 0.4975\"><p>C.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0050.webp\" style=\"max-width:min(100%,133px)\" alt=\"Bid Offer 0.4975 0.5882\"><\/div>", "subj": "economics"}, {"n": 28, "q": "Hamid’s triangular arbitrage profit in EUR if he starts with EUR 1 million is closest to:", "opts": ["EUR 53,700", "EUR 97,800", "EUR 195,700"], "ans": "A", "expl": "To determine the profit from triangular arbitrage, we need to follow the steps of currency conversion based on the dealer's quotes and calculate the resultant amount after completing the triangular cycle. Starting with EUR 1 million, the steps are as follows: 1. Convert EUR to SGD: Since we are selling EUR to buy SGD, we use the bid rate of the EUR/SGD pair. The bid rate is 1.4514, so by converting EUR 1 million at this rate, we receive SGD 1,451,400 (EUR 1,000,000 * 1.4514). 2. Convert SGD to MYR: Next, we convert the SGD to MYR. Here, we are buying MYR, so we use the ask rate of the SGD/MYR pair, which is 0.3890. The amount of MYR received is calculated by dividing the SGD amount by the ask rate: MYR 3,731,105 (SGD 1,451,400 / 0.3890). 3. Convert MYR back to EUR: Finally, we convert MYR back to EUR. Since we are selling MYR to buy EUR, we use the bid rate of the EUR/MYR pair, which is 0.2824. The final amount in EUR is 1,053,700 (MYR 3,731,105 * 0.2824). The profit from this triangular arbitrage is the difference between the final amount in EUR and the initial amount, which is EUR 53,700 (EUR 1,053,700 - EUR 1,000,000). B is incorrect. The calculation for option B might suggest a different sequence or misinterpretation of bid and ask rates. If we mistakenly use incorrect rates for buying or selling, the resultant calculations will lead to an inaccurate profit estimation. For instance, using the ask rate instead of the bid rate when selling a currency, or vice versa, would significantly alter the outcome. The correct use of bid and ask rates as per the market direction (buying or selling) is crucial in arbitrage calculations to reflect the true potential profit or loss. C is incorrect. This option likely results from further incorrect application of rates or an exaggerated interpretation of market movements. Triangular arbitrage profits are generally modest, as they exploit small differences in currency conversion rates. A profit as high as EUR 195,700 suggests a gross miscalculation or an unrealistic assumption about the disparity between the quoted rates. Such a high profit is unlikely unless there is an extreme inefficiency in the market, which is not indicated by the given data. ", "explhtml": "<p>To determine the profit from triangular arbitrage, we need to follow the steps of currency conversion based on the dealer&#x27;s quotes and calculate the resultant amount after completing the triangular cycle. Starting with EUR 1 million, the steps are as follows:<\/p><p>1. Convert EUR to SGD: Since we are selling EUR to buy SGD, we use the bid rate of the EUR/SGD pair. The bid rate is 1.4514, so by converting EUR 1 million at this rate, we receive SGD 1,451,400 (EUR 1,000,000 * 1.4514).<\/p><p>2. Convert SGD to MYR: Next, we convert the SGD to MYR. Here, we are buying MYR, so we use the ask rate of the SGD/MYR pair, which is 0.3890. The amount of MYR received is calculated by dividing the SGD amount by the ask rate: MYR 3,731,105 (SGD 1,451,400 / 0.3890).<\/p><p>3. Convert MYR back to EUR: Finally, we convert MYR back to EUR. Since we are selling MYR to buy EUR, we use the bid rate of the EUR/MYR pair, which is 0.2824. The final amount in EUR is 1,053,700 (MYR 3,731,105 * 0.2824).<\/p><p>The profit from this triangular arbitrage is the difference between the final amount in EUR and the initial amount, which is EUR 53,700 (EUR 1,053,700 - EUR 1,000,000).<\/p><p><b>B is incorrect<\/b>. The calculation for option B might suggest a different sequence or misinterpretation of bid and ask rates. If we mistakenly use incorrect rates for buying or selling, the resultant calculations will lead to an inaccurate profit estimation. For instance, using the ask rate instead of the bid rate when selling a currency, or vice versa, would significantly alter the outcome. The correct use of bid and ask rates as per the market direction (buying or selling) is crucial in arbitrage calculations to reflect the true potential profit or loss.<\/p><p><b>C is incorrect<\/b>. This option likely results from further incorrect application of rates or an exaggerated interpretation of market movements. Triangular arbitrage profits are generally modest, as they exploit small differences in currency conversion rates. A profit as high as EUR 195,700 suggests a gross miscalculation or an unrealistic assumption about the disparity between the quoted rates. Such a high profit is unlikely unless there is an extreme inefficiency in the market, which is not indicated by the given data. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (b): Identify a triangular arbitrage opportunity and calculate its profit, given the bid–offer quotations for three currencies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">
