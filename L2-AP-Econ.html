, "explhtml": "<p>Ford&#x27;s accuracy in his statements can be analyzed as follows:<\/p><p>Statement 1 states that for an emerging economy, a uniformly expansionary fiscal/monetary policy mix will be bearish for its currency, while a uniformly restrictive fiscal/monetary policy mix will be bullish. This statement is accurate because expansionary policies typically lead to lower interest rates, which reduce the attractiveness of holding assets denominated in that currency, thereby depreciating the currency. Conversely, restrictive policies lead to higher interest rates, attracting foreign capital and appreciating the currency. This understanding aligns with basic economic principles of supply and demand in currency markets, where the interest rate differential plays a crucial role in determining the flow of capital and consequently, the exchange rate movements.<\/p><p><b>B is incorrect<\/b>. The statement that both statements are accurate is incorrect because the second statement contains inaccuracies. While the first part of statement 2 correctly identifies that expansionary monetary policy, when paired with a fixed exchange rate, requires intervention to maintain the exchange rate, the second part inaccurately describes the effects of an expansionary fiscal policy under a fixed exchange rate regime. In reality, expansionary fiscal policy under a fixed exchange rate can lead to increased domestic demand, which typically results in higher imports. To maintain the fixed exchange rate, the central bank must intervene, often by selling foreign reserves to buy domestic currency, which can lead to a depletion of reserves and potential financial instability if not managed carefully. This complexity and potential for negative outcomes are not acknowledged in Ford&#x27;s overly simplistic explanation.<\/p><p><b>C is incorrect<\/b>. The option stating that neither statement is accurate is incorrect because statement 1 is indeed accurate. It correctly reflects the impact of fiscal and monetary policies on an emerging economy&#x27;s currency as influenced by global capital flows and interest rate differentials. The understanding of these dynamics is crucial for currency valuation and exchange rate predictions, making statement 1 a valid and insightful observation about economic policy impacts on currency markets. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(k): Explain the potential effects of monetary and fiscal policy on exchange rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Black-Rock Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carlos Ford, a portfolio manager and exchange rate specialist, has worked with Black-Rock Investments (BRON) - a capital management firm - for the past 15 years. Ford resigned from BRON last year and now works as a currency manager and consultant for several investment firms. Last week, Ford was invited by Michael Wagle - a friend and a financial analyst - to advise him on an investment made in Canadian dollars. Wagle presented him with the following information:<\/p><p>C$/U.S.$ spot rate (mid-market): 0.856<\/p><p>One-year Canadian deposit rate: 4.00%<\/p><p>One-year U.S. deposit rate: 6.50%<\/p><p>Wagle added:<\/p><p>“I am not sure how the C$/US$ exchange rate will change in the future, but I would like to generate an almost riskless profit on my one-year investment in Canadian dollars. Would that be possible?”<\/p><p>After reviewing the data presented before him, Ford made the following comments:<\/p><p>Comment 1: “I expect the Canadian dollar to appreciate against the U.S. dollar over the coming year.”<\/p><p>Comment 2: “Going by the current one-year forward points and my analysis, I believe that the U.S. dollar will sell at a forward discount”<\/p><p>In the course of their discussion on exchange rates and the effects of various factors on their future movements, Ford made the following statements:<\/p><p>Statement 1: “For an emerging economy with low capital mobility, a uniformly expansionary fiscal/monetary policy mix will be bearish for its currency, and a uniformly restrictive fiscal/monetary policy mix will be bullish.”<\/p><p>Statement 2: “For countries following an expansionary monetary policy along with a fixed exchange rate policy, the actions taken by the central bank to maintain the level of the exchange rate will offset the effects of the policy. However, in cases where countries are following an expansionary fiscal policy, steps taken to maintain a fixed exchange rate will reinforce the impact of the expansionary fiscal policy.”<\/p><p>Ford then talked about the Taylor Rule, used by central banks to determine the appropriate policy rate as a function of their neutral rate, inflation and output targets, and the observed deviations from those targets.<\/p><\/div><\/details><div class=\"qtext\"><p>Ford is most accurate with respect to:<\/p><\/div>", "subj": "economics"}, {"n": 9, "q": "Assuming that hedging has been done with forward contracts and with respect to Opportunity 1, in which of the following cases would the profitability of the investment least likely be eroded:", "opts": ["If ex ante PPP and the Fisher effect hold", "If covered interest rate parity holds", "If uncovered interest rate parity holds"], "ans": "B", "expl": "It involves the concept of covered interest rate parity, which states that the forward exchange rate should incorporate the interest rate differentials between two countries. In this scenario, the Australian one-year deposit rate is 6%, while the U.S. rate is 3.5%, resulting in a differential of 2.5%. If covered interest rate parity holds, the forward rate between the Australian Dollar (AUD) and the U.S. Dollar (USD) would adjust so that no arbitrage opportunities exist due to interest rate differentials. Therefore, the expected depreciation of the AUD by 1.0% is less significant as the forward contract would lock in the exchange rate, mitigating the risk of currency depreciation and preserving the profitability derived from the higher Australian interest rate. A is incorrect. If ex ante Purchasing Power Parity (PPP) and the Fisher effect hold, the scenario becomes less favorable for maintaining profitability in Australian fixed-income investments. Ex ante PPP suggests that the exchange rate will adjust to offset differences in inflation between two countries. In contrast, the Fisher effect implies that real interest rates are equalized by adjusting nominal rates for expected inflation. In this case, if these two conditions hold, any nominal interest rate advantage in Australia could be offset by adjustments in the exchange rate due to inflation differentials, potentially eroding the investment's profitability. This would make the investment less attractive, as the expected yield differential could be nullified by currency depreciation exceeding the nominal interest rate differential. C is incorrect. Uncovered interest rate parity (UIP) posits that the expected change in exchange rates between two currencies is equal to the difference in their interest rates, without the use of forward contracts to hedge against exchange rate fluctuations. In the context of Opportunity 1, where the Australian interest rate is 2.5% higher than the U.S. rate and the AUD is expected to depreciate by 1.0%, if UIP holds, the AUD would actually depreciate more closely to the full extent of the interest rate differential, eliminating any arbitrage opportunity. This greater depreciation of the AUD would erode the additional yield gained from the higher Australian interest rate, thereby negatively impacting the investment's profitability. ", "explhtml": "<p>It involves the concept of covered interest rate parity, which states that the forward exchange rate should incorporate the interest rate differentials between two countries. In this scenario, the Australian one-year deposit rate is 6%, while the U.S. rate is 3.5%, resulting in a differential of 2.5%. If covered interest rate parity holds, the forward rate between the Australian Dollar (AUD) and the U.S. Dollar (USD) would adjust so that no arbitrage opportunities exist due to interest rate differentials. Therefore, the expected depreciation of the AUD by 1.0% is less significant as the forward contract would lock in the exchange rate, mitigating the risk of currency depreciation and preserving the profitability derived from the higher Australian interest rate.<\/p><p><b>A is incorrect<\/b>. If ex ante Purchasing Power Parity (PPP) and the Fisher effect hold, the scenario becomes less favorable for maintaining profitability in Australian fixed-income investments. Ex ante PPP suggests that the exchange rate will adjust to offset differences in inflation between two countries. In contrast, the Fisher effect implies that real interest rates are equalized by adjusting nominal rates for expected inflation. In this case, if these two conditions hold, any nominal interest rate advantage in Australia could be offset by adjustments in the exchange rate due to inflation differentials, potentially eroding the investment&#x27;s profitability. This would make the investment less attractive, as the expected yield differential could be nullified by currency depreciation exceeding the nominal interest rate differential.<\/p><p><b>C is incorrect<\/b>. Uncovered interest rate parity (UIP) posits that the expected change in exchange rates between two currencies is equal to the difference in their interest rates, without the use of forward contracts to hedge against exchange rate fluctuations. In the context of Opportunity 1, where the Australian interest rate is 2.5% higher than the U.S. rate and the AUD is expected to depreciate by 1.0%, if UIP holds, the AUD would actually depreciate more closely to the full extent of the interest rate differential, eliminating any arbitrage opportunity. This greater depreciation of the AUD would erode the additional yield gained from the higher Australian interest rate, thereby negatively impacting the investment&#x27;s profitability. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(g): Evaluate the use of the current spot rate, the forward rate, purchasing power parity, and uncovered interest parity to forecast future spot exchange rates<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Sapphire Financial Strategists<\/summary><div class=\"vig-body\"><p>Sapphire Financial Strategists (SFS) – a U.S. based capital management firm – has been the subject of considerable critical acclaim from several financial journals and capital analysts. Rebecca Stephan - portfolio manager and CEO - has played a pivotal role in the firm&#x27;s success. Stephan launched the SFS Global Fund to further the company&#x27;s achievements - an investment vehicle for investors with the desire to invest in international stocks and bonds. Stephan appointed Jeffery Harnish -- a financial analyst and exchange rate specialist – as the head of the fund’s portfolio management team. During the team’s initial meeting, Harnish presented the following investment opportunities:<\/p><p>Opportunity 1: “Investing money in Australian fixed-income will prove profitable. This is because Australia’s one-year deposit rate is 6% whereas that of the U.S. is 3.5% and thus a higher yield can be captured. The fact that the AUD is expected to depreciate by 1.0% over the investment horizon supports the profitability of this investment.”<\/p><p>Opportunity 2: “I have been pondering whether to invest in Canadian or Japanese fixed-income. Based on my analysis, the nominal interest rates in Canada and Japan are 6.0% and 8.0% respectively. Also, the annual inflation rate in Japan is 5.0%. Assuming the Fisher effect holds, I believe that inflation in Canada will be almost 3.0%. The Japanese Yen will depreciate by 2.0% relative to the CAD over our investment horizon.”<\/p><p>Opportunity 3: “I strongly recommend entering into a carry-trade position by borrowing the British pound and investing in the Australian dollar. I have gathered the following information to support my decision.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0016.webp\" style=\"max-width:min(100%,655px)\" alt=\"Exhibit 1 One-year Currency Spot Rate at Spot Rate at Currency LIBOR rate pair T0 T1 at T0 GBP 2.75% GBP/USD 0.817 0.804 AUD 6.00% USD/AUD 0.975 0.978\"><p>This will ensure that we earn a positive return on our trade.”<\/p><p>After the meeting was over, Harnish was approached by Tammy Lee, a currency overlay manager at SFS, to discuss foreign exchange carry trades in detail. Lee stated that he had entered into a carry trade with the Euro as the funding currency. He added that the inflation rate in the U.S. was 2.5% greater than the inflation rate in the euro area. Lee expressed his concerns over the profitability of his trade, given the high risks embedded in such strategies. Harnish, in response, made the following comment:<\/p><p>“I believe you should exit your strategy if the U.S. dollar starts to depreciate by less than 2.0% relative to the Euro, or when the Euro starts to appreciate in value relative to the dollar by more than 2.0%.”<\/p><p>Lee then asked Harnish to elucidate the influence of current account trends on exchange rates over time. Harnish made the following comments:<\/p><p>Statement 1: “If a country imported more goods than it exported, its currency would adjust to this current account deficit, causing it to depreciate.”<\/p><p>Statement 2: “Due to the debt sustainability channel, if a country runs a large and persistent current account deficit, not only will its currency depreciate, but the currency’s real long-run equilibrium value would also be revised downward.”<\/p><p>Statement 3: “If Country A has a larger current account deficit relative to Country B, A will most likely experience a build-up of B’s assets in its coffers, resulting in the depreciation of Country A’s currency relative to Country B’s currency.”<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming that hedging has been done with forward contracts and with respect to Opportunity 1, in which of the following cases would the profitability of the investment least likely be eroded:<\/p><\/div>", "subj": "economics"}, {"n": 10, "q": "With respect to Opportunity 2, is Harnish’s analysis most likely accurate:", "opts": ["Yes, because the Fisher effect captures the relationship between interest rates and inflation, and ultimately explains their effect on exchange rate movements.", "No, because the relationship explained by Harnish is the ex ante purchasing power parity, not the Fisher effect.", "No, because Harnish has overlooked a major assumption underlying the Fisher effect which will affect his calculations."], "ans": "C", "expl": "Harnish's analysis in Opportunity 2 is flawed because it incorrectly applies the Fisher effect without considering the essential assumption of real interest rate parity. The Fisher effect states that the nominal interest rate is approximately the sum of the real interest rate and the expected inflation rate. However, a critical assumption for applying the Fisher effect accurately across different countries is that the real interest rates are equalized internationally, which is known as the real interest rate parity condition. This condition implies that any difference in nominal interest rates between two countries should be solely due to differences in inflation expectations. Harnish's analysis does not confirm whether the real interest rates in Canada and Japan are equal or not. Without this confirmation, assuming that the nominal interest rate differences are indicative of inflation expectations could lead to incorrect conclusions about the expected changes in exchange rates. A is incorrect. The option suggests that Harnish's analysis is accurate because the Fisher effect captures the relationship between interest rates and inflation, and their effect on exchange rate movements. However, this interpretation is overly simplistic and misleading. While the Fisher effect does relate nominal interest rates to inflation, it does not directly address exchange rate movements. Exchange rates can be influenced by a variety of factors beyond inflation and nominal interest rates, such as political stability, economic performance, and differences in interest rates that are not related to inflation. Therefore, stating that the Fisher effect alone justifies the accuracy of Harnish's analysis is incorrect. B is incorrect. This option claims that Harnish's analysis is incorrect because it confuses the Fisher effect with ex ante purchasing power parity (PPP). While it is true that Harnish's analysis might be confusing these concepts, the primary issue with his analysis is not just a potential confusion between Fisher effect and PPP. The main problem lies in the assumption of real interest rate parity, which is crucial for correctly applying the Fisher effect in an international context. Ex ante PPP deals with the rate at which the currencies of two countries are expected to equalize the purchasing power of goods and services, which is a related but distinct concept from what is being incorrectly applied in Harnish's analysis. ", "explhtml": "<p>Harnish&#x27;s analysis in Opportunity 2 is flawed because it incorrectly applies the Fisher effect without considering the essential assumption of real interest rate parity. The Fisher effect states that the nominal interest rate is approximately the sum of the real interest rate and the expected inflation rate. However, a critical assumption for applying the Fisher effect accurately across different countries is that the real interest rates are equalized internationally, which is known as the real interest rate parity condition. This condition implies that any difference in nominal interest rates between two countries should be solely due to differences in inflation expectations. Harnish&#x27;s analysis does not confirm whether the real interest rates in Canada and Japan are equal or not. Without this confirmation, assuming that the nominal interest rate differences are indicative of inflation expectations could lead to incorrect conclusions about the expected changes in exchange rates.<\/p><p><b>A is incorrect<\/b>. The option suggests that Harnish&#x27;s analysis is accurate because the Fisher effect captures the relationship between interest rates and inflation, and their effect on exchange rate movements. However, this interpretation is overly simplistic and misleading. While the Fisher effect does relate nominal interest rates to inflation, it does not directly address exchange rate movements. Exchange rates can be influenced by a variety of factors beyond inflation and nominal interest rates, such as political stability, economic performance, and differences in interest rates that are not related to inflation. Therefore, stating that the Fisher effect alone justifies the accuracy of Harnish&#x27;s analysis is incorrect.<\/p><p><b>B is incorrect<\/b>. This option claims that Harnish&#x27;s analysis is incorrect because it confuses the Fisher effect with ex ante purchasing power parity (PPP). While it is true that Harnish&#x27;s analysis might be confusing these concepts, the primary issue with his analysis is not just a potential confusion between Fisher effect and PPP. The main problem lies in the assumption of real interest rate parity, which is crucial for correctly applying the Fisher effect in an international context. Ex ante PPP deals with the rate at which the currencies of two countries are expected to equalize the purchasing power of goods and services, which is a related but distinct concept from what is being incorrectly applied in Harnish&#x27;s analysis. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(e): Explain international parity conditions (covered and uncovered interest rate parity, forward rate parity, purchasing power parity, and the international Fisher effect)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Sapphire Financial Strategists<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sapphire Financial Strategists (SFS) – a U.S. based capital management firm – has been the subject of considerable critical acclaim from several financial journals and capital analysts. Rebecca Stephan - portfolio manager and CEO - has played a pivotal role in the firm&#x27;s success. Stephan launched the SFS Global Fund to further the company&#x27;s achievements - an investment vehicle for investors with the desire to invest in international stocks and bonds. Stephan appointed Jeffery Harnish -- a financial analyst and exchange rate specialist – as the head of the fund’s portfolio management team. During the team’s initial meeting, Harnish presented the following investment opportunities:<\/p><p>Opportunity 1: “Investing money in Australian fixed-income will prove profitable. This is because Australia’s one-year deposit rate is 6% whereas that of the U.S. is 3.5% and thus a higher yield can be captured. The fact that the AUD is expected to depreciate by 1.0% over the investment horizon supports the profitability of this investment.”<\/p><p>Opportunity 2: “I have been pondering whether to invest in Canadian or Japanese fixed-income. Based on my analysis, the nominal interest rates in Canada and Japan are 6.0% and 8.0% respectively. Also, the annual inflation rate in Japan is 5.0%. Assuming the Fisher effect holds, I believe that inflation in Canada will be almost 3.0%. The Japanese Yen will depreciate by 2.0% relative to the CAD over our investment horizon.”<\/p><p>Opportunity 3: “I strongly recommend entering into a carry-trade position by borrowing the British pound and investing in the Australian dollar. I have gathered the following information to support my decision.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0016.webp\" style=\"max-width:min(100%,655px)\" alt=\"Exhibit 1 One-year Currency Spot Rate at Spot Rate at Currency LIBOR rate pair T0 T1 at T0 GBP 2.75% GBP/USD 0.817 0.804 AUD 6.00% USD/AUD 0.975 0.978\"><p>This will ensure that we earn a positive return on our trade.”<\/p><p>After the meeting was over, Harnish was approached by Tammy Lee, a currency overlay manager at SFS, to discuss foreign exchange carry trades in detail. Lee stated that he had entered into a carry trade with the Euro as the funding currency. He added that the inflation rate in the U.S. was 2.5% greater than the inflation rate in the euro area. Lee expressed his concerns over the profitability of his trade, given the high risks embedded in such strategies. Harnish, in response, made the following comment:<\/p><p>“I believe you should exit your strategy if the U.S. dollar starts to depreciate by less than 2.0% relative to the Euro, or when the Euro starts to appreciate in value relative to the dollar by more than 2.0%.”<\/p><p>Lee then asked Harnish to elucidate the influence of current account trends on exchange rates over time. Harnish made the following comments:<\/p><p>Statement 1: “If a country imported more goods than it exported, its currency would adjust to this current account deficit, causing it to depreciate.”<\/p><p>Statement 2: “Due to the debt sustainability channel, if a country runs a large and persistent current account deficit, not only will its currency depreciate, but the currency’s real long-run equilibrium value would also be revised downward.”<\/p><p>Statement 3: “If Country A has a larger current account deficit relative to Country B, A will most likely experience a build-up of B’s assets in its coffers, resulting in the depreciation of Country A’s currency relative to Country B’s currency.”<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to Opportunity 2, is Harnish’s analysis most likely accurate:<\/p><\/div>", "subj": "economics"}, {"n": 11, "q": "With regards to Opportunity 3, the all-in return to the trade, measured in GBP terms, would be closest to:", "opts": ["1.89%", "3.99%", "4.64%"], "ans": "A", "expl": "To calculate the all-in return of the carry trade in GBP terms, we first need to determine the cross rate between GBP and AUD at the beginning and end of the year. Initially, the cross rate is calculated by multiplying the GBP/USD rate by the USD/AUD rate: After one year, the cross rate is: The next step is to calculate the unhedged return on the Australian deposit. This is done by converting the initial investment from GBP to AUD, applying the 6.00% interest rate, and then converting it back to GBP: This return of 4.634% must then be adjusted for the cost of borrowing in GBP, which is the one-year GBP LIBOR rate of 2.75%. Therefore, the net return on the carry trade is: Thus, the all-in return to the trade, measured in GBP terms, is closest to 1.89%. B is incorrect. The calculation of 3.99% does not align with the correct method for determining the net return on the carry trade. The error in this option likely arises from incorrect handling of the interest rates or the currency conversion rates. To arrive at the correct answer, one must accurately calculate both the initial and final cross rates, apply the interest rate to the Australian deposit, and then adjust for the borrowing cost in GBP. The precise calculations as shown above yield a net return of 1.894%, not 3.99%. C is incorrect. The option suggesting a return of 4.64% considers only the gross return from the Australian deposit without subtracting the borrowing costs associated with the GBP. This oversight results in an inflated figure that does not represent the net, or all-in, return of the carry trade. The correct approach, as detailed, requires the subtraction of the GBP borrowing cost from the gross return to reflect the true profitability of the trade, leading to the correct answer of approximately 1.89%. ", "explhtml": "<p>To calculate the all-in return of the carry trade in GBP terms, we first need to determine the cross rate between GBP and AUD at the beginning and end of the year. Initially, the cross rate is calculated by multiplying the GBP/USD rate by the USD/AUD rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0017.webp\" style=\"max-width:min(100%,347px)\" alt=\"GBP/AUD at T0 = 0.817× 0.975 = 0.796575\"><p>After one year, the cross rate is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0018.webp\" style=\"max-width:min(100%,347px)\" alt=\"GBP/AUD at T1 = 0.804× 0.978 = 0.786312\"><p>The next step is to calculate the unhedged return on the Australian deposit. This is done by converting the initial investment from GBP to AUD, applying the 6.00% interest rate, and then converting it back to GBP:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0019.webp\" style=\"max-width:min(100%,730px)\" alt=\"1 Unhedged return = ( ) × (1 + 0.06) × 0.786312 −1 = 1.04634 −1 = 0.04634 or 4.634% 0.796575\"><p>This return of 4.634% must then be adjusted for the cost of borrowing in GBP, which is the one-year GBP LIBOR rate of 2.75%. Therefore, the net return on the carry trade is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0020.webp\" style=\"max-width:min(100%,317px)\" alt=\"Net return = 4.634% −2.75% = 1.884%\"><p>Thus, the all-in return to the trade, measured in GBP terms, is closest to 1.89%.<\/p><p><b>B is incorrect<\/b>. The calculation of 3.99% does not align with the correct method for determining the net return on the carry trade. The error in this option likely arises from incorrect handling of the interest rates or the currency conversion rates. To arrive at the correct answer, one must accurately calculate both the initial and final cross rates, apply the interest rate to the Australian deposit, and then adjust for the borrowing cost in GBP. The precise calculations as shown above yield a net return of 1.894%, not 3.99%.<\/p><p><b>C is incorrect<\/b>. The option suggesting a return of 4.64% considers only the gross return from the Australian deposit without subtracting the borrowing costs associated with the GBP. This oversight results in an inflated figure that does not represent the net, or all-in, return of the carry trade. The correct approach, as detailed, requires the subtraction of the GBP borrowing cost from the gross return to reflect the true profitability of the trade, leading to the correct answer of approximately 1.89%. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(i): Describe the carry trade and its relation to uncovered interest rate parity and calculate the profit from a carry trade<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Sapphire Financial Strategists<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sapphire Financial Strategists (SFS) – a U.S. based capital management firm – has been the subject of considerable critical acclaim from several financial journals and capital analysts. Rebecca Stephan - portfolio manager and CEO - has played a pivotal role in the firm&#x27;s success. Stephan launched the SFS Global Fund to further the company&#x27;s achievements - an investment vehicle for investors with the desire to invest in international stocks and bonds. Stephan appointed Jeffery Harnish -- a financial analyst and exchange rate specialist – as the head of the fund’s portfolio management team. During the team’s initial meeting, Harnish presented the following investment opportunities:<\/p><p>Opportunity 1: “Investing money in Australian fixed-income will prove profitable. This is because Australia’s one-year deposit rate is 6% whereas that of the U.S. is 3.5% and thus a higher yield can be captured. The fact that the AUD is expected to depreciate by 1.0% over the investment horizon supports the profitability of this investment.”<\/p><p>Opportunity 2: “I have been pondering whether to invest in Canadian or Japanese fixed-income. Based on my analysis, the nominal interest rates in Canada and Japan are 6.0% and 8.0% respectively. Also, the annual inflation rate in Japan is 5.0%. Assuming the Fisher effect holds, I believe that inflation in Canada will be almost 3.0%. The Japanese Yen will depreciate by 2.0% relative to the CAD over our investment horizon.”<\/p><p>Opportunity 3: “I strongly recommend entering into a carry-trade position by borrowing the British pound and investing in the Australian dollar. I have gathered the following information to support my decision.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0016.webp\" style=\"max-width:min(100%,655px)\" alt=\"Exhibit 1 One-year Currency Spot Rate at Spot Rate at Currency LIBOR rate pair T0 T1 at T0 GBP 2.75% GBP/USD 0.817 0.804 AUD 6.00% USD/AUD 0.975 0.978\"><p>This will ensure that we earn a positive return on our trade.”<\/p><p>After the meeting was over, Harnish was approached by Tammy Lee, a currency overlay manager at SFS, to discuss foreign exchange carry trades in detail. Lee stated that he had entered into a carry trade with the Euro as the funding currency. He added that the inflation rate in the U.S. was 2.5% greater than the inflation rate in the euro area. Lee expressed his concerns over the profitability of his trade, given the high risks embedded in such strategies. Harnish, in response, made the following comment:<\/p><p>“I believe you should exit your strategy if the U.S. dollar starts to depreciate by less than 2.0% relative to the Euro, or when the Euro starts to appreciate in value relative to the dollar by more than 2.0%.”<\/p><p>Lee then asked Harnish to elucidate the influence of current account trends on exchange rates over time. Harnish made the following comments:<\/p><p>Statement 1: “If a country imported more goods than it exported, its currency would adjust to this current account deficit, causing it to depreciate.”<\/p><p>Statement 2: “Due to the debt sustainability channel, if a country runs a large and persistent current account deficit, not only will its currency depreciate, but the currency’s real long-run equilibrium value would also be revised downward.”<\/p><p>Statement 3: “If Country A has a larger current account deficit relative to Country B, A will most likely experience a build-up of B’s assets in its coffers, resulting in the depreciation of Country A’s currency relative to Country B’s currency.”<\/p><\/div><\/details><div class=\"qtext\"><p>With regards to Opportunity 3, the all-in return to the trade, measured in GBP terms, would be closest to:<\/p><\/div>", "subj": "economics"}, {"n": 12, "q": "With regards to his response to Lee, Harnish is most likely advising on managing crash risk by using:", "opts": ["Purchasing power parity benchmarks, but he is incorrect as to when to exit the strategy.", "Uncovered interest rate parity as a benchmark, and he is correct as to when to exit the strategy.", "PPP benchmarks, and he is correct as to when to exit the strategy."], "ans": "C", "expl": "Harnish's advice to Lee regarding the exit strategy for the carry trade is based on the principles of Purchasing Power Parity (PPP). PPP suggests that in the long run, exchange rates should adjust to equalize the price of identical goods and services in different countries. This concept is crucial in determining the appropriate time to exit a carry trade to manage crash risk effectively. Harnish recommends exiting the trade if the U.S. dollar starts to depreciate by less than 2.0% relative to the Euro, or if the Euro appreciates by more than 2.0% relative to the dollar. These thresholds likely represent the PPP adjustment bands, where significant deviations from these levels could indicate an impending correction in currency values. By setting these specific thresholds, Harnish is effectively using PPP as a benchmark to safeguard the investment from potential losses due to sudden shifts in currency values, which aligns with the principles of managing crash risk in currency trades. A is incorrect. The option suggests that Harnish is using Purchasing Power Parity (PPP) benchmarks, which is correct. However, it incorrectly states that he is wrong about when to exit the strategy. Harnish's advice on the exit points is actually aligned with the PPP benchmarks, where he sets specific thresholds for currency depreciation and appreciation to manage the risk effectively. This strategy is intended to prevent losses by exiting the trade before potential adverse shifts in currency values, which could erode the profits from the carry trade. Therefore, the statement that he is incorrect in his exit strategy is unfounded. B is incorrect. This option incorrectly identifies the benchmark used by Harnish as the Uncovered Interest Rate Parity (UIRP) instead of PPP. UIRP suggests that the difference in interest rates between two countries will equal the expected change in their exchange rates. While interest rates and expectations of currency movements are indeed considerations in carry trades, Harnish's specific advice about exit points based on percentage thresholds of currency value changes aligns more closely with PPP considerations. The UIRP would not typically involve setting such specific thresholds for currency appreciation or depreciation as a signal to exit a trade. ", "explhtml": "<p>Harnish&#x27;s advice to Lee regarding the exit strategy for the carry trade is based on the principles of Purchasing Power Parity (PPP). PPP suggests that in the long run, exchange rates should adjust to equalize the price of identical goods and services in different countries. This concept is crucial in determining the appropriate time to exit a carry trade to manage crash risk effectively. Harnish recommends exiting the trade if the U.S. dollar starts to depreciate by less than 2.0% relative to the Euro, or if the Euro appreciates by more than 2.0% relative to the dollar. These thresholds likely represent the PPP adjustment bands, where significant deviations from these levels could indicate an impending correction in currency values. By setting these specific thresholds, Harnish is effectively using PPP as a benchmark to safeguard the investment from potential losses due to sudden shifts in currency values, which aligns with the principles of managing crash risk in currency trades.<\/p><p><b>A is incorrect<\/b>. The option suggests that Harnish is using Purchasing Power Parity (PPP) benchmarks, which is correct. However, it incorrectly states that he is wrong about when to exit the strategy. Harnish&#x27;s advice on the exit points is actually aligned with the PPP benchmarks, where he sets specific thresholds for currency depreciation and appreciation to manage the risk effectively. This strategy is intended to prevent losses by exiting the trade before potential adverse shifts in currency values, which could erode the profits from the carry trade. Therefore, the statement that he is incorrect in his exit strategy is unfounded.<\/p><p><b>B is incorrect<\/b>. This option incorrectly identifies the benchmark used by Harnish as the Uncovered Interest Rate Parity (UIRP) instead of PPP. UIRP suggests that the difference in interest rates between two countries will equal the expected change in their exchange rates. While interest rates and expectations of currency movements are indeed considerations in carry trades, Harnish&#x27;s specific advice about exit points based on percentage thresholds of currency value changes aligns more closely with PPP considerations. The UIRP would not typically involve setting such specific thresholds for currency appreciation or depreciation as a signal to exit a trade. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(e): Explain international parity conditions (covered and uncovered interest rate parity, forward rate parity, purchasing power parity, and the international Fisher effect)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Sapphire Financial Strategists<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sapphire Financial Strategists (SFS) – a U.S. based capital management firm – has been the subject of considerable critical acclaim from several financial journals and capital analysts. Rebecca Stephan - portfolio manager and CEO - has played a pivotal role in the firm&#x27;s success. Stephan launched the SFS Global Fund to further the company&#x27;s achievements - an investment vehicle for investors with the desire to invest in international stocks and bonds. Stephan appointed Jeffery Harnish -- a financial analyst and exchange rate specialist – as the head of the fund’s portfolio management team. During the team’s initial meeting, Harnish presented the following investment opportunities:<\/p><p>Opportunity 1: “Investing money in Australian fixed-income will prove profitable. This is because Australia’s one-year deposit rate is 6% whereas that of the U.S. is 3.5% and thus a higher yield can be captured. The fact that the AUD is expected to depreciate by 1.0% over the investment horizon supports the profitability of this investment.”<\/p><p>Opportunity 2: “I have been pondering whether to invest in Canadian or Japanese fixed-income. Based on my analysis, the nominal interest rates in Canada and Japan are 6.0% and 8.0% respectively. Also, the annual inflation rate in Japan is 5.0%. Assuming the Fisher effect holds, I believe that inflation in Canada will be almost 3.0%. The Japanese Yen will depreciate by 2.0% relative to the CAD over our investment horizon.”<\/p><p>Opportunity 3: “I strongly recommend entering into a carry-trade position by borrowing the British pound and investing in the Australian dollar. I have gathered the following information to support my decision.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0016.webp\" style=\"max-width:min(100%,655px)\" alt=\"Exhibit 1 One-year Currency Spot Rate at Spot Rate at Currency LIBOR rate pair T0 T1 at T0 GBP 2.75% GBP/USD 0.817 0.804 AUD 6.00% USD/AUD 0.975 0.978\"><p>This will ensure that we earn a positive return on our trade.”<\/p><p>After the meeting was over, Harnish was approached by Tammy Lee, a currency overlay manager at SFS, to discuss foreign exchange carry trades in detail. Lee stated that he had entered into a carry trade with the Euro as the funding currency. He added that the inflation rate in the U.S. was 2.5% greater than the inflation rate in the euro area. Lee expressed his concerns over the profitability of his trade, given the high risks embedded in such strategies. Harnish, in response, made the following comment:<\/p><p>“I believe you should exit your strategy if the U.S. dollar starts to depreciate by less than 2.0% relative to the Euro, or when the Euro starts to appreciate in value relative to the dollar by more than 2.0%.”<\/p><p>Lee then asked Harnish to elucidate the influence of current account trends on exchange rates over time. Harnish made the following comments:<\/p><p>Statement 1: “If a country imported more goods than it exported, its currency would adjust to this current account deficit, causing it to depreciate.”<\/p><p>Statement 2: “Due to the debt sustainability channel, if a country runs a large and persistent current account deficit, not only will its currency depreciate, but the currency’s real long-run equilibrium value would also be revised downward.”<\/p><p>Statement 3: “If Country A has a larger current account deficit relative to Country B, A will most likely experience a build-up of B’s assets in its coffers, resulting in the depreciation of Country A’s currency relative to Country B’s currency.”<\/p><\/div><\/details><div class=\"qtext\"><p>With regards to his response to Lee, Harnish is most likely advising on managing crash risk by using:<\/p><\/div>", "subj": "economics"}, {"n": 13, "q": "Regarding Meadows and Fawn’s discussion of international parity relationships, whose remarks are most likely accurate:", "opts": ["Meadows’s but not Fawn’s", "Fawn’s but not Meadows’s", "Neither Meadows’s nor Fawn’s"], "ans": "C", "expl": "Jack Meadows and Adam Fawn discuss the application of international parity conditions, specifically focusing on whether forward exchange rates are unbiased predictors of future spot exchange rates. Meadows argues that while covered interest rate parity can be enforced through arbitrage, uncovered interest rate parity cannot. This distinction is crucial because if uncovered interest rate parity were enforceable by arbitrage, it would eliminate the possibility of profits from foreign exchange carry trades, which rely on the exploitation of interest rate differentials between countries. Meadows' point highlights that the lack of enforceability of uncovered interest rate parity allows for potential profits in currency trading, contradicting the notion that forward rates always predict future spot rates accurately. A is incorrect. Meadows' statement that uncovered interest rate parity cannot be enforced through arbitrage is accurate; however, his implication that this allows for significant profits in foreign exchange trading oversimplifies the complexities involved. While it is true that arbitrage opportunities exist due to the non-enforceability of uncovered interest rate parity, these opportunities are not as straightforward or as profitable as Meadows suggests. The foreign exchange market is highly efficient, and the opportunities for arbitrage are typically short-lived and require sophisticated strategies to exploit. Therefore, Meadows' view is partially correct but lacks a comprehensive understanding of the market dynamics. B is incorrect. Fawn's statement that forward exchange rates should regularly be an unbiased predictor of future spot exchange rates due to the enforcement of covered and uncovered interest rate parity is incorrect. While covered interest rate parity does hold under arbitrage conditions, uncovered interest rate parity does not, as Meadows correctly points out. Uncovered interest rate parity involves speculation about future interest rates and exchange rates, which cannot be guaranteed. Therefore, Fawn's belief in the regular predictive accuracy of forward rates based on these parities is misguided and overlooks the inherent uncertainties and speculative elements in currency markets. ", "explhtml": "<p>Jack Meadows and Adam Fawn discuss the application of international parity conditions, specifically focusing on whether forward exchange rates are unbiased predictors of future spot exchange rates. Meadows argues that while covered interest rate parity can be enforced through arbitrage, uncovered interest rate parity cannot. This distinction is crucial because if uncovered interest rate parity were enforceable by arbitrage, it would eliminate the possibility of profits from foreign exchange carry trades, which rely on the exploitation of interest rate differentials between countries. Meadows&#x27; point highlights that the lack of enforceability of uncovered interest rate parity allows for potential profits in currency trading, contradicting the notion that forward rates always predict future spot rates accurately.<\/p><p><b>A is incorrect<\/b>. Meadows&#x27; statement that uncovered interest rate parity cannot be enforced through arbitrage is accurate; however, his implication that this allows for significant profits in foreign exchange trading oversimplifies the complexities involved. While it is true that arbitrage opportunities exist due to the non-enforceability of uncovered interest rate parity, these opportunities are not as straightforward or as profitable as Meadows suggests. The foreign exchange market is highly efficient, and the opportunities for arbitrage are typically short-lived and require sophisticated strategies to exploit. Therefore, Meadows&#x27; view is partially correct but lacks a comprehensive understanding of the market dynamics.<\/p><p><b>B is incorrect<\/b>. Fawn&#x27;s statement that forward exchange rates should regularly be an unbiased predictor of future spot exchange rates due to the enforcement of covered and uncovered interest rate parity is incorrect. While covered interest rate parity does hold under arbitrage conditions, uncovered interest rate parity does not, as Meadows correctly points out. Uncovered interest rate parity involves speculation about future interest rates and exchange rates, which cannot be guaranteed. Therefore, Fawn&#x27;s belief in the regular predictive accuracy of forward rates based on these parities is misguided and overlooks the inherent uncertainties and speculative elements in currency markets. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(f): Describe relations among the international parity conditions<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Jack Meadows<\/summary><div class=\"vig-body\"><p>Jack Meadows, CFA is a currency trader for a large money-management firm in the United States. He has been granted significant autonomy, performing trades for company clients, and proprietary trades for the firm itself. Meadows believes he has identified an arbitrage opportunity involving various currencies and wants to execute a trade to capture an immediate profit. The three currencies he has identified, and the available dealer quotes, are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0021.webp\" style=\"max-width:min(100%,311px)\" alt=\"Bid Ask USD/EUR 1.0634 1.0646 EUR/JPY 0.0082 0.0083\"><p>Adam Fawn, a relatively new colleague of Meadows’, has been very curious on the job, frequently asking Meadows questions about currency markets. In their discussions, Fawn asks Meadows about scenarios in which currency dealer bid-offer spreads are wider or narrower. Meadows explains that long-standing client relationships, large transaction sizes, and narrow interbank bid-offer spreads will encourage market participants to maintain narrow dealer bid-offer spreads.<\/p><p>Additionally, Fawn picks Meadows’s brain regarding international parity relations. Specifically, Fawn wants to know Meadows’s take on whether forward exchange rates are unbiased predictors of future spot exchange rates. Fawn says, “Given the arbitrage enforcement of covered and uncovered interest rate parity, forward exchange rates should regularly be an unbiased predictor of future spot exchange rates.” Meadows replies, “I disagree. While covered interest rate parity is enforceable by arbitrage, uncovered interest rate parity is not. If both were enforceable through arbitrage, our foreign exchange would yield significantly higher trade profits.”<\/p><p>Meadows decides to examine foreign and domestic interest rates to determine whether an arbitrage opportunity exists. He focuses on Swedish markets, noting a spot rate of 9.7842 SEK/USD, a one-year interest rate of 3.1% for the USD, and a one-year interest rate of 4.8% for the SEK.<\/p><p>After examining Swedish markets more closely, Meadows decided to broadly predict the direction of the Swedish currency (SEK) based on the country’s current monetary and fiscal policy. He notes Sweden has high capital mobility, restrictive monetary policy, and expansionary fiscal policy.<\/p><p>Three months ago, Meadows entered into a long six-month contract to purchase EUR 1,000,000 against USD at an exchange rate of 1.1566 USD/EUR. Today, the spot exchange rate for these two currencies is 1.1768 USD/EUR, the three-month forward points are 21, and the annualized rate for three-month USD risk-free security is 2.4%.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Meadows and Fawn’s discussion of international parity relationships, whose remarks are most likely accurate:<\/p><\/div>", "subj": "economics"}, {"n": 14, "q": "The one-year SEK/USD forward rate based on covered interest rate parity is closest to:", "opts": ["6.3190 SEK/USD.", "9.6255 SEK/USD.", "9.9455 SEK/USD."], "ans": "C", "expl": "The correct answer is option C, which calculates the one-year SEK/USD forward rate based on covered interest rate parity. Covered interest rate parity (CIRP) states that the forward exchange rate should be set so that an investor has no arbitrage opportunity from discrepancies between interest rates in two different economies. The formula for CIRP is given by: Here, the spot rate is 9.7842 SEK/USD, the foreign interest rate (Sweden) is 4.8% or 0.048, and the domestic interest rate (USA) is 3.1% or 0.031, with t being 1 year. Plugging these values into the formula, we get: This calculation shows that the forward rate aligns with option C, confirming it as the correct answer. A is incorrect. Option A suggests a forward rate of 6.3190 SEK/USD, which significantly deviates from the calculation based on covered interest rate parity. Using the CIRP formula, there is no plausible adjustment of interest rates or spot rate that would yield such a low forward rate. This value underestimates the impact of the higher Swedish interest rate relative to the U.S. rate, which should result in a forward rate higher than the spot rate, not significantly lower. B is incorrect. Option B proposes a forward rate of 9.6255 SEK/USD. This value is closer to the correct calculation than option A but still incorrect. It appears to slightly underestimate the effect of the interest rate differential. The correct application of the CIRP formula, as shown, results in a forward rate of 9.9455 SEK/USD. The calculation for option B likely involves a minor miscalculation or rounding error in applying the interest rates or the compounding effect over the one-year period. ", "explhtml": "<p>The correct answer is option C, which calculates the one-year SEK/USD forward rate based on covered interest rate parity. Covered interest rate parity (CIRP) states that the forward exchange rate should be set so that an investor has no arbitrage opportunity from discrepancies between interest rates in two different economies. The formula for CIRP is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0022.webp\" style=\"max-width:min(100%,445px)\" alt=\"1 + Foreign Interest Ratet Forward Rate = Spot Rate × ( ) 1 + Domestic Interest Rate\"><p>Here, the spot rate is 9.7842 SEK/USD, the foreign interest rate (Sweden) is 4.8% or 0.048, and the domestic interest rate (USA) is 3.1% or 0.031, with t being 1 year. Plugging these values into the formula, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0023.webp\" style=\"max-width:min(100%,592px)\" alt=\"1 + 0.048 1 1.048 Forward Rate = 9.7842 × ( 1 + 0.031 ) = 9.7842 × ( 1.031 ) = 9.9455 SEK/USD\"><p>This calculation shows that the forward rate aligns with option C, confirming it as the correct answer.<\/p><p><b>A is incorrect<\/b>. Option A suggests a forward rate of 6.3190 SEK/USD, which significantly deviates from the calculation based on covered interest rate parity. Using the CIRP formula, there is no plausible adjustment of interest rates or spot rate that would yield such a low forward rate. This value underestimates the impact of the higher Swedish interest rate relative to the U.S. rate, which should result in a forward rate higher than the spot rate, not significantly lower.<\/p><p><b>B is incorrect<\/b>. Option B proposes a forward rate of 9.6255 SEK/USD. This value is closer to the correct calculation than option A but still incorrect. It appears to slightly underestimate the effect of the interest rate differential. The correct application of the CIRP formula, as shown, results in a forward rate of 9.9455 SEK/USD. The calculation for option B likely involves a minor miscalculation or rounding error in applying the interest rates or the compounding effect over the one-year period. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1(e): Explain international parity conditions (covered and uncovered interest rate parity, forward rate parity, purchasing power parity, and the international Fisher effect)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Jack Meadows<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jack Meadows, CFA is a currency trader for a large money-management firm in the United States. He has been granted significant autonomy, performing trades for company clients, and proprietary trades for the firm itself. Meadows believes he has identified an arbitrage opportunity involving various currencies and wants to execute a trade to capture an immediate profit. The three currencies he has identified, and the available dealer quotes, are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0021.webp\" style=\"max-width:min(100%,311px)\" alt=\"Bid Ask USD/EUR 1.0634 1.0646 EUR/JPY 0.0082 0.0083\"><p>Adam Fawn, a relatively new colleague of Meadows’, has been very curious on the job, frequently asking Meadows questions about currency markets. In their discussions, Fawn asks Meadows about scenarios in which currency dealer bid-offer spreads are wider or narrower. Meadows explains that long-standing client relationships, large transaction sizes, and narrow interbank bid-offer spreads will encourage market participants to maintain narrow dealer bid-offer spreads.<\/p><p>Additionally, Fawn picks Meadows’s brain regarding international parity relations. Specifically, Fawn wants to know Meadows’s take on whether forward exchange rates are unbiased predictors of future spot exchange rates. Fawn says, “Given the arbitrage enforcement of covered and uncovered interest rate parity, forward exchange rates should regularly be an unbiased predictor of future spot exchange rates.” Meadows replies, “I disagree. While covered interest rate parity is enforceable by arbitrage, uncovered interest rate parity is not. If both were enforceable through arbitrage, our foreign exchange would yield significantly higher trade profits.”<\/p><p>Meadows decides to examine foreign and domestic interest rates to determine whether an arbitrage opportunity exists. He focuses on Swedish markets, noting a spot rate of 9.7842 SEK/USD, a one-year interest rate of 3.1% for the USD, and a one-year interest rate of 4.8% for the SEK.<\/p><p>After examining Swedish markets more closely, Meadows decided to broadly predict the direction of the Swedish currency (SEK) based on the country’s current monetary and fiscal policy. He notes Sweden has high capital mobility, restrictive monetary policy, and expansionary fiscal policy.<\/p><p>Three months ago, Meadows entered into a long six-month contract to purchase EUR 1,000,000 against USD at an exchange rate of 1.1566 USD/EUR. Today, the spot exchange rate for these two currencies is 1.1768 USD/EUR, the three-month forward points are 21, and the annualized rate for three-month USD risk-free security is 2.4%.<\/p><\/div><\/details><div class=\"qtext\"><p>The one-year SEK/USD forward rate based on covered interest rate parity is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 15, "q": "Three months after contract initiation, the mark-to-market value of the six-month forward contract is closest to:", "opts": ["USD 20,080.", "USD 22,167.", "USD 22,300."], "ans": "B", "expl": "To determine the mark-to-market value of the forward contract, we use the formula for calculating the present value of the future cash flows from the contract. The formula is: [(Closeout Price + Forward Points −Contract Price) × Quantity of Currency Purchased] In this scenario, the closeout price is 1.1768 USD/EUR, the forward points are 0.0021, and the contract price at initiation was 1.1566 USD/EUR. The quantity of currency purchased is 1,000,000 EUR. The discount rate, representing the annualized rate for a three-month risk-free security, is 2.4%. The time period t is 90 days since it's a three-month period. Plugging these values into the formula gives: This calculation shows that the present value of the future cash flows from the forward contract, considering the time value of money over the remaining three months, is approximately USD 22,167. A is incorrect. The value USD 20,080 does not correctly account for the forward points adjustment and the time value of money. The forward points of 0.0021 need to be added to the spot rate at the time of the closeout to reflect the expected future spot rate under the forward contract terms. Additionally, the discounting of the future value to its present value using the formula provided is necessary to account for the interest that could have been earned over the period. Ignoring these aspects leads to an undervaluation of the contract, resulting in the incorrect figure of USD 20,080. C is incorrect. The value USD 22,300 slightly overestimates the correct mark-to-market value. This discrepancy can occur if there is a rounding error in the calculation or a slight misestimation in the forward points or the discount rate applied. The precise calculation using the correct values and formula as shown leads to the value of USD 22,167, indicating that any value significantly different (such as USD 22,300) does not accurately reflect the correct computation of the present value of the forward contract's future cash flows. ", "explhtml": "<p>To determine the mark-to-market value of the forward contract, we use the formula for calculating the present value of the future cash flows from the contract. The formula is:<\/p><p>[(Closeout Price + Forward Points −Contract Price) × Quantity of Currency Purchased]<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0024.webp\" style=\"max-width:min(100%,596px)\" alt=\"[1 + (Discount Rate × 3t60)]\"><p>In this scenario, the closeout price is 1.1768 USD/EUR, the forward points are 0.0021, and the contract price at initiation was 1.1566 USD/EUR. The quantity of currency purchased is 1,000,000 EUR. The discount rate, representing the annualized rate for a three-month risk-free security, is 2.4%. The time period t is 90 days since it&#x27;s a three-month period. Plugging these values into the formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0025.webp\" style=\"max-width:min(100%,361px)\" alt=\"[(1.1768 + 0.0021 −1.1566) × 1, 000, 000] [1 + (0.024 × 360 90 )] = 22, 167\"><p>This calculation shows that the present value of the future cash flows from the forward contract, considering the time value of money over the remaining three months, is approximately USD 22,167.<\/p><p><b>A is incorrect<\/b>. The value USD 20,080 does not correctly account for the forward points adjustment and the time value of money. The forward points of 0.0021 need to be added to the spot rate at the time of the closeout to reflect the expected future spot rate under the forward contract terms. Additionally, the discounting of the future value to its present value using the formula provided is necessary to account for the interest that could have been earned over the period. Ignoring these aspects leads to an undervaluation of the contract, resulting in the incorrect figure of USD 20,080.<\/p><p><b>C is incorrect<\/b>. The value USD 22,300 slightly overestimates the correct mark-to-market value. This discrepancy can occur if there is a rounding error in the calculation or a slight misestimation in the forward points or the discount rate applied. The precise calculation using the correct values and formula as shown leads to the value of USD 22,167, indicating that any value significantly different (such as USD 22,300) does not accurately reflect the correct computation of the present value of the forward contract&#x27;s future cash flows. <\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (c): Contrast spot and forward rates and calculate the forward premium/discount for a given currency<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Jack Meadows<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jack Meadows, CFA is a currency trader for a large money-management firm in the United States. He has been granted significant autonomy, performing trades for company clients, and proprietary trades for the firm itself. Meadows believes he has identified an arbitrage opportunity involving various currencies and wants to execute a trade to capture an immediate profit. The three currencies he has identified, and the available dealer quotes, are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0021.webp\" style=\"max-width:min(100%,311px)\" alt=\"Bid Ask USD/EUR 1.0634 1.0646 EUR/JPY 0.0082 0.0083\"><p>Adam Fawn, a relatively new colleague of Meadows’, has been very curious on the job, frequently asking Meadows questions about currency markets. In their discussions, Fawn asks Meadows about scenarios in which currency dealer bid-offer spreads are wider or narrower. Meadows explains that long-standing client relationships, large transaction sizes, and narrow interbank bid-offer spreads will encourage market participants to maintain narrow dealer bid-offer spreads.<\/p><p>Additionally, Fawn picks Meadows’s brain regarding international parity relations. Specifically, Fawn wants to know Meadows’s take on whether forward exchange rates are unbiased predictors of future spot exchange rates. Fawn says, “Given the arbitrage enforcement of covered and uncovered interest rate parity, forward exchange rates should regularly be an unbiased predictor of future spot exchange rates.” Meadows replies, “I disagree. While covered interest rate parity is enforceable by arbitrage, uncovered interest rate parity is not. If both were enforceable through arbitrage, our foreign exchange would yield significantly higher trade profits.”<\/p><p>Meadows decides to examine foreign and domestic interest rates to determine whether an arbitrage opportunity exists. He focuses on Swedish markets, noting a spot rate of 9.7842 SEK/USD, a one-year interest rate of 3.1% for the USD, and a one-year interest rate of 4.8% for the SEK.<\/p><p>After examining Swedish markets more closely, Meadows decided to broadly predict the direction of the Swedish currency (SEK) based on the country’s current monetary and fiscal policy. He notes Sweden has high capital mobility, restrictive monetary policy, and expansionary fiscal policy.<\/p><p>Three months ago, Meadows entered into a long six-month contract to purchase EUR 1,000,000 against USD at an exchange rate of 1.1566 USD/EUR. Today, the spot exchange rate for these two currencies is 1.1768 USD/EUR, the three-month forward points are 21, and the annualized rate for three-month USD risk-free security is 2.4%.<\/p><\/div><\/details><div class=\"qtext\"><p>Three months after contract initiation, the mark-to-market value of the six-month forward contract is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 16, "q": "Based on the information provided in the table, the USD/JPY no-arbitrage bid-offer spread (in JPY) is closest to:", "opts": ["JPY 0.0001.", "JPY 1.4200.", "JPY 1.2524."], "ans": "C", "expl": "To determine the no-arbitrage bid-offer spread for USD/JPY, we first need to calculate the implied USD/JPY rates using the cross rates from USD/EUR and EUR/JPY. The calculation involves converting USD to EUR and then EUR to JPY. The bid rate for USD/EUR is 1.0634 and the ask rate for EUR/JPY is 0.0083. Multiplying these gives the ask rate for USD/JPY: Similarly, the ask rate for USD/EUR is 1.0646 and the bid rate for EUR/JPY is 0.0082. Multiplying these gives the bid rate for USD/JPY: To find the USD/JPY rates, we take the reciprocal of these products, as we are converting from JPY to USD: The bid-offer spread is the difference between the ask and the bid rate: A is incorrect. JPY 0.0001 is significantly lower than the calculated spread of JPY 1.2524. This option would suggest an extremely liquid market with almost no transaction cost, which is not realistic given the provided currency quotes. Such a narrow spread is typically not seen in the market, especially in cross-currency calculations where multiple conversions and market factors influence the spread. B is incorrect. JPY 1.4200, although closer to the calculated spread, still does not match the precise calculation of JPY 1.2524. Choosing this option would indicate a misunderstanding of the correct method to calculate the cross rate and its resulting spread. It is essential to accurately perform these calculations to avoid potential losses in currency trading due to mispriced spreads.", "explhtml": "<p>To determine the no-arbitrage bid-offer spread for USD/JPY, we first need to calculate the implied USD/JPY rates using the cross rates from USD/EUR and EUR/JPY. The calculation involves converting USD to EUR and then EUR to JPY. The bid rate for USD/EUR is 1.0634 and the ask rate for EUR/JPY is 0.0083. Multiplying these gives the ask rate for USD/JPY:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0026.webp\" style=\"max-width:min(100%,248px)\" alt=\"1.0634 × 0.0083 = 0.00882622\"><p>Similarly, the ask rate for USD/EUR is 1.0646 and the bid rate for EUR/JPY is 0.0082. Multiplying these gives the bid rate for USD/JPY:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0027.webp\" style=\"max-width:min(100%,248px)\" alt=\"1.0646 × 0.0082 = 0.00872972\"><p>To find the USD/JPY rates, we take the reciprocal of these products, as we are converting from JPY to USD:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0028.webp\" style=\"max-width:min(100%,437px)\" alt=\"1 Bid rate for USD/JPY = ≈113.2988 JPY/USD 0.00882622 1 Ask rate for USD/JPY = ≈114.5512 JPY/USD 0.00872972\"><p>The bid-offer spread is the difference between the ask and the bid rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0029.webp\" style=\"max-width:min(100%,280px)\" alt=\"114.5512 −113.2988 = 1.2524 JPY\"><p><b>A is incorrect<\/b>. JPY 0.0001 is significantly lower than the calculated spread of JPY 1.2524. This option would suggest an extremely liquid market with almost no transaction cost, which is not realistic given the provided currency quotes. Such a narrow spread is typically not seen in the market, especially in cross-currency calculations where multiple conversions and market factors influence the spread.<\/p><p><b>B is incorrect<\/b>. JPY 1.4200, although closer to the calculated spread, still does not match the precise calculation of JPY 1.2524. Choosing this option would indicate a misunderstanding of the correct method to calculate the cross rate and its resulting spread. It is essential to accurately perform these calculations to avoid potential losses in currency trading due to mispriced spreads.<\/p><p class=\"los\">Economics, Learning Module 1: Currency Exchange Rates: Understanding Equilibrium Value. LOS 1 (a): Calculate and interpret the bid–offer spread on a spot or forward currency quotation and describe the factors that affect the bid–offer spread<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Jack Meadows<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jack Meadows, CFA is a currency trader for a large money-management firm in the United States. He has been granted significant autonomy, performing trades for company clients, and proprietary trades for the firm itself. Meadows believes he has identified an arbitrage opportunity involving various currencies and wants to execute a trade to capture an immediate profit. The three currencies he has identified, and the available dealer quotes, are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0021.webp\" style=\"max-width:min(100%,311px)\" alt=\"Bid Ask USD/EUR 1.0634 1.0646 EUR/JPY 0.0082 0.0083\"><p>Adam Fawn, a relatively new colleague of Meadows’, has been very curious on the job, frequently asking Meadows questions about currency markets. In their discussions, Fawn asks Meadows about scenarios in which currency dealer bid-offer spreads are wider or narrower. Meadows explains that long-standing client relationships, large transaction sizes, and narrow interbank bid-offer spreads will encourage market participants to maintain narrow dealer bid-offer spreads.<\/p><p>Additionally, Fawn picks Meadows’s brain regarding international parity relations. Specifically, Fawn wants to know Meadows’s take on whether forward exchange rates are unbiased predictors of future spot exchange rates. Fawn says, “Given the arbitrage enforcement of covered and uncovered interest rate parity, forward exchange rates should regularly be an unbiased predictor of future spot exchange rates.” Meadows replies, “I disagree. While covered interest rate parity is enforceable by arbitrage, uncovered interest rate parity is not. If both were enforceable through arbitrage, our foreign exchange would yield significantly higher trade profits.”<\/p><p>Meadows decides to examine foreign and domestic interest rates to determine whether an arbitrage opportunity exists. He focuses on Swedish markets, noting a spot rate of 9.7842 SEK/USD, a one-year interest rate of 3.1% for the USD, and a one-year interest rate of 4.8% for the SEK.<\/p><p>After examining Swedish markets more closely, Meadows decided to broadly predict the direction of the Swedish currency (SEK) based on the country’s current monetary and fiscal policy. He notes Sweden has high capital mobility, restrictive monetary policy, and expansionary fiscal policy.<\/p><p>Three months ago, Meadows entered into a long six-month contract to purchase EUR 1,000,000 against USD at an exchange rate of 1.1566 USD/EUR. Today, the spot exchange rate for these two currencies is 1.1768 USD/EUR, the three-month forward points are 21, and the annualized rate for three-month USD risk-free security is 2.4%.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information provided in the table, the USD/JPY no-arbitrage bid-offer spread (in JPY) is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 17, "q": "Based on the Cobb-Douglas growth accounting equation, the greatest estimated long-term growth rate of potential GDP is that of:", "opts": ["Estonia", "Latvia", "Lithuania"], "ans": "A", "expl": "According to the Cobb-Douglas growth accounting equation, the long-term growth rate of potential GDP can be calculated using the formula: Long-term growth rate of potential GDP = Growth rate of TFP + (Share of capital in GDP) × (Grow For Estonia, the calculation is as follows: Long-term growth rate of potential GDP for Estonia = 2.20% + (0.40 × 4.25%) + (0.60 × 1.50%) = This calculation shows that Estonia has a higher long-term growth rate of potential GDP compared to Latvia and Lithuania. The higher share of capital in GDP and the substantial growth rate of capital significantly contribute to Estonia's potential GDP growth. B is incorrect. For Latvia, the calculation of the long-term growth rate of potential GDP is: Long-term growth rate of potential GDP for Latvia = 1.80% + (0.35 × 3.75%) + (0.65 × 1.90%) = 1 Although Latvia has a decent growth rate in both capital and labor, its lower TFP growth rate and slightly lower share of capital in GDP compared to Estonia result in a lower overall potential GDP growth rate. This makes Latvia's growth rate less than that of Estonia, thus making option B incorrect. C is incorrect. For Lithuania, the calculation of the long-term growth rate of potential GDP is: Long-term growth rate of potential GDP for Lithuania = 1.50% + (0.30 × 3.50%) + (0.70 × 2.10%) Lithuania's lower TFP growth rate and the smallest share of capital in GDP among the three countries contribute to its lowest potential GDP growth rate. Despite having the highest labor growth rate, it does not compensate enough to surpass the growth rates of Estonia or Latvia, making option C incorrect. ", "explhtml": "<p>According to the Cobb-Douglas growth accounting equation, the long-term growth rate of potential GDP can be calculated using the formula:<\/p><p>Long-term growth rate of potential GDP = Growth rate of TFP + (Share of capital in GDP) × (Grow<\/p><p>For Estonia, the calculation is as follows:<\/p><p>Long-term growth rate of potential GDP for Estonia = 2.20% + (0.40 × 4.25%) + (0.60 × 1.50%) =<\/p><p>This calculation shows that Estonia has a higher long-term growth rate of potential GDP compared to Latvia and Lithuania. The higher share of capital in GDP and the substantial growth rate of capital significantly contribute to Estonia&#x27;s potential GDP growth.<\/p><p><b>B is incorrect<\/b>. For Latvia, the calculation of the long-term growth rate of potential GDP is:<\/p><p>Long-term growth rate of potential GDP for Latvia = 1.80% + (0.35 × 3.75%) + (0.65 × 1.90%) = 1<\/p><p>Although Latvia has a decent growth rate in both capital and labor, its lower TFP growth rate and slightly lower share of capital in GDP compared to Estonia result in a lower overall potential GDP growth rate. This makes Latvia&#x27;s growth rate less than that of Estonia, thus making option B incorrect.<\/p><p><b>C is incorrect<\/b>. For Lithuania, the calculation of the long-term growth rate of potential GDP is:<\/p><p>Long-term growth rate of potential GDP for Lithuania = 1.50% + (0.30 × 3.50%) + (0.70 × 2.10%)<\/p><p>Lithuania&#x27;s lower TFP growth rate and the smallest share of capital in GDP among the three countries contribute to its lowest potential GDP growth rate. Despite having the highest labor growth rate, it does not compensate enough to surpass the growth rates of Estonia or Latvia, making option C incorrect. <\/p><p class=\"los\">Economics, Learning Module 1: Economic Growth. LOS 1(e): Demonstrate forecasting potential GDP based on growth accounting relations<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Caroline Taylor<\/summary><div class=\"vig-body\"><p>Caroline Taylor, CFA has recently joined North Pacific National Bank (NPNB) in New York as an analyst in its currency trading department. Taylor has a master&#x27;s degree in finance from a reputable business school. Working with a team of analysts, she must identify and execute profitable trading opportunities in the foreign exchange market and advise clients on foreign exchange risk management. Taylor saw the following information on the Bloomberg terminal about nominal and real interest rates, inflation rates, country risk premiums, and exchange rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0030.webp\" style=\"max-width:min(100%,612px)\" alt=\"Exhibit 1: Currency Information European Japan US Union One Year LIBOR 0.25% 2.25% 1.50% (nominal) One Year LIBOR 0.25% 1.50% 1.00% (real) JPY JPY Exchange rate USD 1.1000/EUR 105.5500/USD 116.1050/EUR Real Long-run Equilibrium JPY 102.50/USD USD 1.2250/EUR JPY 125.60/EUR Exchange Rate Risk Premium \"><p>Taylor also received the minutes of the European Central Bank&#x27;s Monetary Policy Committee and the Federal Reserve Board meeting. After reading these minutes, Taylor surmises that the European Central Bank is likely to pursue an expansionary monetary policy. In contrast, the Federal Reserve is expected to follow a hawkish (restrictive) monetary policy. Various European governments are expected to reduce their respective budget deficits, while the US government is likely to increase its budget deficit next year. Capital has been highly mobile between the US and European countries for more than a century now.<\/p><p>NPNB’s international equity investment analysis team regularly produces country risk assessment reports for internal use by various departments. The following are excerpts from the latest report:<\/p><p>The long-run real equilibrium JPY/USD exchange rate is likely to remain unchanged.<\/p><p>Real interest rates in the US are expected to decline relative to real interest rates in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0031.webp\" style=\"max-width:min(100%,63px)\" alt=\"Japan.\"><p>The US risk premium is expected to increase relative to Japan’s risk premium.<\/p><p>Hudson Asset Management Company, an NPNB client, specializes in international equity investments. Hudson’s portfolio manager approaches Taylor for advice on investments in three Baltic countries – Estonia, Latvia, and Lithuania. The portfolio manager wants to estimate these countries’ potential GDP growth rates and understand possible monetary policy directions. The table below provides economic and demographic information for the three Baltic countries.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap02/f0032.webp\" style=\"max-width:min(100%,583px)\" alt=\"Exhibit 2: Economic and Demographic Information Estonia Latvia Lithuania Labor force participation 71.20% 65.50% 64.50% Share of capital in total GDP 40% 35% 30% Sovereign rating AA- A+ A- Long-term growth rate of TFP 2.20% 1.80% 1.50% Long-term growth rate of capital 4.25% 3.75% 3.50% Long-term gro\"><p>All three countries have relatively independent central banks with inflation targeting as the primary goal. The countries also have well-established, high-volume, and highl
