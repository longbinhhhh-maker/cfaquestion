<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 15 — Cost of Capital - Advanced Topics · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;

  }
  html[data-theme="light"]{

    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;

  body{
    background:

    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";

isk Premiums.<\/p><p>Factor Betas and Risk Premiums<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r15/v001.webp\" style=\"max-width:min(100%,358px)\" alt=\"Factor Factor Beta Risk Premium 1.40 Market (ERP) 3.5% 0.85 1.8% Size (SMB) 1.5% Value (HML) 0.65 1.6% 0.15 Profitability (RMW) 0.60 2.1% Investment (CMA)\"><p>Johansen decides to use the government 20-year benchmark interest rate of 3.4% as the risk- free rate.<\/p><p>Johansen's manager also asks her to estimate Helsevesen's cost of equity using the bond yield plus risk premium (BYPRP) method. For this estimate, Johansen assumes a historical risk premium of 5.4% earned by equity investors over long-term corporate bond yields. Further, she calculates an estimated cost of debt of 4.9% using matrix valuation.<\/p><p>Finally, Johansen is asked to estimate the ERP for the country of Yukon. Selected data is given in Yukon Selected Data Yukon Selected Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r15/v002.webp\" style=\"max-width:min(100%,459px)\" alt=\"Per Year\"><p>Estimated earnings growth rate for public companies 5.00%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r15/v003.webp\" style=\"max-width:min(100%,659px)\" alt=\"1.20% Forecasted market P/E growth 2.50% Real GDP growth rate forecast 0.60% Estimated aggregate dividend yield 3.50% Current level of inflation 3.00% ST government yield 3.50% LT government yield 1.35% Growth in shares outstanding\"><p>Yukon's central bank, with a tight monetary policy, is expected to bring inflation down to 2.50% per year.<\/p><\/div><\/details><div class=\"pp-topic\">Module 15.1, LOS 15.e<\/div><div class=\"qtext\"><p>Helsevesen&#x27;s cost of common equity using the Fama-French five-factor model is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 4, "q": "Helsevesen's cost of common equity using the bond yield plus risk premium (BYPRP) model is closest to:", "opts": ["8.3%.", "12.3%.", "10.3%."], "ans": "C", "expl": "Helsevesen's estimat P) method. For this estimate, Johansen assumes a historical risk premium of 5.4% earned by equity investors over long-term corporate bond yields. Further, she calculates an estimated cost of debt of 4.9% using matrix valuation.<\/p><p>Finally, Johansen is asked to estimate the ERP for the country of Yukon. Selected data is given in Yukon Selected Data Yukon Selected Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r15/v002.webp\" style=\"max-width:min(100%,459px)\" alt=\"Per Year\"><p>Estimated earnings growth rate for public companies 5.00%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r15/v003.webp\" style=\"max-width:min(100%,659px)\" alt=\"1.20% Forecasted market P/E growth 2.50% Real GDP growth rate forecast 0.60% Estimated aggregate dividend yield 3.50% Current level of inflation 3.00% ST government yield 3.50% LT government yield 1.35% Growth in shares outstanding\"><p>Yukon's central bank, with a tight monetary policy, is expected to bring inflation down to 2.50% per year.<\/p><\/div><\/details><div class=\"pp-topic\">Module 15.1, LOS 15.e<\/div><div class=\"qtext\"><p>Helsevesen&#x27;s cost of common equity using the bond yield plus risk premium (BYPRP) model is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 5, "q": "Using the Grinold-Kroner model, the estimated ERP for Yukon is closest to:", "opts": ["3.15%.", "7.65%.", "1.95%."], "ans": "C", "expl": "i = 2.50% (long-term estimate after central bank's action) G = 2.50% (real GDP growth rate) ΔP/E = 1.20% DY = 0.60% ΔS = 1.35% Rf = 3.50% (LT government rate) ERP = [DY + i + G + ΔP/E - ΔS] – Rf = [0.60 + 2.50 + 2.50 + 1.20 - 1.35] – 3.50 = 1.95%.", "explhtml": "<p>i = 2.50% (long-term estimate after central bank&#x27;s action)<\/p><p>G = 2.50% (real GDP growth rate)<\/p><p>ΔP/E = 1.20%<\/p><p>DY = 0.60%<\/p><p>ΔS = 1.35%<\/p><p>Rf = 3.50% (LT government rate)<\/p><p>ERP = [DY + i + G + ΔP/E - ΔS] – Rf = [0.60 + 2.50 + 2.50 + 1.20 - 1.35] – 3.50 = 1.95%.<\/p>", "qhtml": "<details  0.60% Estimated aggregate dividend yield 3.50% Current level of inflation 3.00% ST government yield 3.50% LT government yield 1.35% Growth in shares outstanding\"><p>Yukon's central bank, with a tight monetary policy, is expected to bring inflation down to 2.50% per year.<\/p><\/div><\/details><div class=\"pp-topic\">Module 15.2, LOS 15.c<\/div><div class=\"qtext\"><p>Using the Grinold-Kroner model, the estimated ERP for Yukon is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 6, "q": "Candace Elwince is attempting to calculate the required return of Skeun Inc., a machine-tool manufacturer in a small Eastern European country. Elwince has solid data from the German market but is not sure how to account for the exchange-rate risk Skeun investors would face. Her best choice for creating a risk premium is the:", "opts": ["Gordon Growth model.", "difference between the inflation rates of both markets.", "difference between the bond yields of both markets."], "ans": "C", "expl": "The country spread model suggests an analyst can approximate the risk premium between a developed market and an emerging market by subtracting the bond yields in the developed market from yields in the emerging market.", "explhtml": "<p>The country spread model suggests an analyst can approximate the risk premium between a developed market and an emerging market by subtracting the bond yields in the developed market from yields in the emerging market.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.d<\/div><div class=\"qtext\"><p>Candace Elwince is attempting to calculate the required return of Skeun Inc., a machine-tool manufacturer in a small Eastern European country. Elwince has solid data from the German market but is not sure how to account for the exchange-rate risk Skeun investors would face. Her best choice for creating a risk premium is the:<\/p><\/div>", "subj": "corporate"}, {"n": 7, "q": "The equity risk premium is the difference between:", "opts": ["the estimated equity return and the risk-free return.", "the required equity return and the risk-free return.", "estimated equity returns and estimated bond returns."], "ans": "B", "expl": "The equity risk premium reflects the return in excess of the risk-free rate that investors require for holding stocks. It is derived by subtracting the risk-free return from the required return.", "explhtml": "<p>The equity risk premium reflects the return in excess of the risk-free rate that investors require for holding stocks. It is derived by subtracting the risk-free return from the required return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.1, LOS 15.a<\/div><div class=\"qtext\"><p>The equity risk premium is the difference between:<\/p><\/div>", "subj": "corporate"}, {"n": 8, "q": "Types of estimates of the equity risk premium are least likely to include:", "opts": ["ex-ante estimates.", "extemporized estimates.", "macroeconomic model estimates."], "ans": "B", "expl": "There are four types of estimates of the equity risk premium: historical estimates, forward-looking (ex-ante) estimates, macroeconomic model estimates, and survey estimates.", "explhtml": "<p>There are four types of estimates of the equity risk premium: historical estimates, forward-looking (ex-ante) estimates, macroeconomic model estimates, and survey estimates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.c<\/div><div class=\"qtext\"><p>Types of estimates of the equity risk premium are least likely to include:<\/p><\/div>", "subj": "corporate"}, {"n": 9, "q": "In the process of estimating beta for a private company, unlevering the beta calculated for the publicly traded comparable company accomplishes what goal?", "opts": ["Establishing a baseline level of leverage.", "Improving the accuracy of the estimate in the event that the private company’s debt is of low quality.", "Isolating market risk."], "ans": "C", "expl": "Market risk, also known as systematic risk, is the risk common to all assets within a certain class. Deleveraging the beta strips out the company-specific risk related to the target company's leverage, thereby isolating market risk. Beta calculations do not require a baseline level of leverage. The equation for calculating beta for private companies assumes the company in question has high-grade debt. The deleveraging process will not help if the assumption is incorrect.", "explhtml": "<p>Market risk, also known as systematic risk, is the risk common to all assets within a certain class. Deleveraging the beta strips out the company-specific risk related to the target company&#x27;s leverage, thereby isolating market risk. Beta calculations do not require a baseline level of leverage. The equation for calculating beta for private companies assumes the company in question has high-grade debt. The deleveraging process will not help if the assumption is incorrect.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.d<\/div><div class=\"qtext\"><p>In the process of estimating beta for a private company, unlevering the beta calculated for the publicly traded comparable company accomplishes what goal?<\/p><\/div>", "subj": "corporate"}, {"n": 10, "q": "When attempting to build a risk premium into the required returns of stocks in a developing country, an analyst should use the:", "opts": ["country spread model.", "modified Gordon Growth model.", "country’s weighted average cost of capital."], "ans": "A", "expl": "The country spread model uses data from a developed market, then adjusts it using the difference between the bond yields for the emerging and developed markets. Neither a modified Gordon Growth model nor a weighted average cost of capital will do this job.", "explhtml": "<p>The country spread model uses data from a developed market, then adjusts it using the difference between the bond yields for the emerging and developed markets. Neither a modified Gordon Growth model nor a weighted average cost of capital will do this job.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.d<\/div><div class=\"qtext\"><p>When attempting to build a risk premium into the required returns of stocks in a developing country, an analyst should use the:<\/p><\/div>", "subj": "corporate"}, {"n": 11, "q": "Ben Jacobs, CFA, is attempting to calculate a historical equity risk premium. His first estimate uses geometric mean equity returns and long-term bond yields. His second estimate uses arithmetic mean returns and short-term bond yields. The effect of the changes in methodology in the second estimate, relative to the first, will:", "opts": ["both decrease the size of the risk premium.", "both increase the size of the risk premium.", "have offsetting effects."], "ans": "B", "expl": "Switching from a geometric mean to an arithmetic mean will increase the mean equity return. All else being equal, that will increase the estimated risk premium. When the yield curve slopes upward, short-term bonds yield less than long-term bonds. Thus, the equity risk premium estimate will be larger when short-term bond rates are used.", "explhtml": "<p>Switching from a geometric mean to an arithmetic mean will increase the mean equity return. All else being equal, that will increase the estimated risk premium. When the yield curve slopes upward, short-term bonds yield less than long-term bonds. Thus, the equity risk premium estimate will be larger when short-term bond rates are used.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.c<\/div><div class=\"qtext\"><p>Ben Jacobs, CFA, is attempting to calculate a historical equity risk premium. His first estimate uses geometric mean equity returns and long-term bond yields. His second estimate uses arithmetic mean returns and short-term bond yields. The effect of the changes in methodology in the second estimate, relative to the first, will:<\/p><\/div>", "subj": "corporate"}, {"n": 12, "q": "The country risk rating model:", "opts": ["determines a risk premium for an emerging market.", "depends on forecasts of exchange rates.", "determines a risk premium for any foreign market."], "ans": "A", "expl": "The country risk rating model begins with a model from a developed country, then modifies that model with inputs from an emerging market to derive a risk premium for the emerging market. Forecasts of exchange rates may well be part of the model, but they are not a requirement.", "explhtml": "<p>The country risk rating model begins with a model from a developed country, then modifies that model with inputs from an emerging market to derive a risk premium for the emerging market. Forecasts of exchange rates may well be part of the model, but they are not a requirement.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.d<\/div><div class=\"qtext\"><p>The country risk rating model:<\/p><\/div>", "subj": "corporate"}, {"n": 13, "q": "If a company's debt is publicly traded, the most appropriate estimate of its cost of debt can be derived from:", "opts": ["an inferred credit rating on the debt based on the financial ratios of the company.", "the yield to maturity for the firm’s longest-maturity straight debt outstanding.", "matrix pricing, based on the yields on traded securities with the same maturity and credit ratings."], "ans": "B", "expl": "If a company's debt is publicly traded, the yield to maturity for the firm's longest-maturity straight debt outstanding is our best estimate of its cost of debt. If a company's debt is not traded (or is thinly traded), we can use matrix pricing, based on the yields on traded securities with the same maturity and credit ratings. If the debt is not credit rated, we can use financial ratios of the company such as interest coverage or financial leverage to infer a credit rating on the debt.", "explhtml": "<p>If a company&#x27;s debt is publicly traded, the yield to maturity for the firm&#x27;s longest-maturity straight debt outstanding is our best estimate of its cost of debt. If a company&#x27;s debt is not traded (or is thinly traded), we can use matrix pricing, based on the yields on traded securities with the same maturity and credit ratings. If the debt is not credit rated, we can use financial ratios of the company such as interest coverage or financial leverage to infer a credit rating on the debt.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.1, LOS 15.b<\/div><div class=\"qtext\"><p>If a company&#x27;s debt is publicly traded, the most appropriate estimate of its cost of debt can be derived from:<\/p><\/div>", "subj": "corporate"}, {"n": 14, "q": "An analyst attempting to derive the equity risk premium for a stock starting from the required return for that stock would find which of the following statistics least useful?", "opts": ["The stock’s estimated return.", "The stock’s beta.", "Historical 10-year Treasury bond rates."], "ans": "A", "expl": "The required return for a stock is equal to the risk-free return plus beta times the equity risk premium. An analyst starting from the required return would need beta and a risk-free rate. Historical 10-year T-bond rates can be used as an estimate of the risk-free rate. Since the analyst is starting with the required return, estimated returns are not needed.", "explhtml": "<p>The required return for a stock is equal to the risk-free return plus beta times the equity risk premium. An analyst starting from the required return would need beta and a risk-free rate. Historical 10-year T-bond rates can be used as an estimate of the risk-free rate. Since the analyst is starting with the required return, estimated returns are not needed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.c<\/div><div class=\"qtext\"><p>An analyst attempting to derive the equity risk premium for a stock starting from the required return for that stock would find which of the following statistics least useful?<\/p><\/div>", "subj": "corporate"}, {"n": 15, "q": "Currently the market index stands at 1,190.45. Firms erived under each method. The difference between the required returns is closest to:", "opts": ["9.29%.", "5.89%.", "5.30%."], "ans": "A", "expl": "The capital asset pricing model uses the following equation: Required return = risk-free rate + beta × equity risk premium To calculate the required return under CAPM, use the Russell 2000 index return, the beta, and the risk-free rate. Required return = 3.4% + 2.1 × (12.3% − 3.4%) = 22.09%. The bond-yield model uses the following equation: Required return = yield to maturity on long-term bonds + risk premium. Required return = 7.9% + 4.9% = 12.8%. The difference between the two estimated required returns is 9.29%.", "explhtml": "<p>The capital asset pricing model uses the following equation:<\/p><p>Required return = risk-free rate + beta × equity risk premium<\/p><p>To calculate the required return under CAPM, use the Russell 2000 index return, the beta, and the risk-free rate.<\/p><p>Required return = 3.4% + 2.1 × (12.3% − 3.4%) = 22.09%.<\/p><p>The bond-yield model uses the following equation:<\/p><p>Required return = yield to maturity on long-term bonds + risk premium.<\/p><p>Required return = 7.9% + 4.9% = 12.8%.<\/p><p>The difference between the two estimated required returns is 9.29%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.d<\/div><div class=\"qtext\"><p>Equity analyst Yasmine Cordova of Substantial Securities is trying to determine the investment appeal of shares of Maxwell Mincemeat, a small food company. Cordova has assembled the following data about the company:<\/p><p>Internal rate of return: 9.4%. Maxwell&#x27;s 20-year bond yield to maturity: 7.9%. Maxwell&#x27;s two-year bond yield to maturity: 6.1%. Treasury bill yield: 3.4%. Maxwell&#x27;s estimated beta: 2.1. Maxwell&#x27;s 20-year bonds are priced at $102.65. Maxwell&#x27;s two-year bonds are priced at $101.47. Estimated return of Russell 2000 Index: 12.3%. Substantial&#x27;s credit analyst estimates that Maxwell&#x27;s equity warrants a premium of 4.9% over its bonds.<\/p><p>Cordova wants to make sure her estimates are accurate, so she decides to calculate the estimated required return in two ways. She opts for the bond-yield plus risk premium method and the capital asset pricing model. To check her work, she wants to compare the estimates derived under each method. The difference between the required returns is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 17, "q": "Estimates of historical ERP resulting from backfilling of index data is most likely to:", "opts": ["result in an unbiased estimate.", "bias the estimate downward.", "bias the estimate upward."], "ans": "C", "expl": "Backfilling (going back in historical time to obtain data after index constituents are identified) would most likely result in survivorship bias—and, therefore, bias the estimate of ERP upward.", "explhtml": "<p>Backfilling (going back in historical time to obtain data after index constituents are identified) would most likely result in survivorship bias—and, therefore, bias the estimate of ERP upward.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.c<\/div><div class=\"qtext\"><p>Estimates of historical ERP resulting from backfilling of index data is most likely to:<\/p><\/div>", "subj": "corporate"}, {"n": 18, "q": "A company is most likely to have a high cost of capital if the firm has a low:", "opts": ["total debt-to-EBITDA ratio.", "interest coverage (IC) ratio.", "debt-to-equity (D/E) ratio."], "ans": "B", "expl": "Low interest coverage (IC) suggests that a firm has a reduced ability to service additional debt. Holding business risk constant, companies with higher proportions of debt in their capital structure are likely to face higher costs of capital.", "explhtml": "<p>Low interest coverage (IC) suggests that a firm has a reduced ability to service additional debt. Holding business risk constant, companies with higher proportions of debt in their capital structure are likely to face high const CFG = {"title": "Reading 15 — Cost of Capital - Advanced Topics", "subtitle": "CFA Level II · 19 câu · Kaplan Schweser QBank 2025 (15 câu đơn · 4 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };

  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

function setSubmitButtonMode(showResults){

  DATA.forEach((q,i)=>{

    showQuestionSubject(card,q);

const CFA_SESSION_SUBJECT_RANGES = {

};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,

  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,

  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>

    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
