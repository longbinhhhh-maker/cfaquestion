<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

or introducing new products or entering new markets.\nDescribe the elements that should be covered in a thorough company research report", "qhtml": null, "explfigs": null}, {"n": 2, "q": "A company is developing a product for planned launch in 20X8. An analyst collects the company's 20X7 actual financial data and creates 20X8 forecasts for two scenarios: 20X8 20X8 (in € millions) 20X7 Product launches Product does not launch Sales 1,000 1,500 1,200 Operating income 100 200 140 The company's degree of operating leverage in 20X8 will most likely be:", "opts": ["greater if the new product launches in 20X8.", "the same regardless of whether the new product launches.", "greater if the new product does not launch in 20X8."], "ans": "B", "expl": "Operating leverage refers to the level of fixed costs in a company's cost structure. Increasing fixed costs relative to variable costs increases\noperating leverage. The degree of operating leverage (DOL) measures the rate at which operating profit increases (decreases) relative to the\nrate at which sales increase (decrease). The greater (smaller) a company's operating leverage, the more (less) operating income will change\ngiven a change in sales.\nA company's DOL may differ from its peers' depending on its cost structure, and a single company's DOL can change over time. In this scenario,\nthe company's DOL must be calculated and compared for two separate scenarios:\nIf the company launches a new product\nIf the company does not launch a new product\nThe company's DOL under each scenario can be calculated as:\nIn both scenarios, the percentage change in operating income is twice the percentage change in sales, so the company's DOL is the same\n(Choices A and C). Note, however, that this may not always be the case, such as if the new product had a greater or lesser contribution margin\nor fixed cost requirements than the overall company, all else equal.\nThings to remember:\nMore fixed costs in a company's cost structure in relat t\nsignificantly lowering sales volume (ie, demand is less elastic).\nPricing pressure is typically lower in perfectly competitive markets and higher in other industry structures. Industries in which companies have\npricing power are often marked by one or more of the following:\nProduct differentiation\nHigh barriers to entry\nFew economical substitutes\nHigh switching costs for customers\nHigh customer loyalty and retention\nCompanies with strong brand names typically have higher customer loyalty and can therefore increase prices without a significant impact on\nvolumes. Thus, a consumer goods producer with a popular brand name (eg, Coca-Cola) is most likely to have pricing power.\n(Choice A) A low-cost producer has lower costs than some competitors and therefore can earn an accounting profit even in a perfectly\ncompetitive market. Still, a company in such a market would not be able to increase prices without losing a significant portion of its customer\nbase. Therefore, a low-cost producer in the competitive textile market would not likely have pricing power.\n(Choice C) Commoditization occurs when an original product is no longer unique due to competitors entering the market with similar products.\nFor instance, the market for personal computer accessories is a commoditized market with many competitors and little product differentiation, so a\nlow-cost global producer in that market would not have pricing power.\nThings to remember:\nPricing power is a company's ability to set prices without significantly affecting its sales volume. Industries where companies have pricing power\nare often marked by product differentiation, high barriers to entry, few economical substitutes, high switching costs for customers, or high customer\nloyalty and retention.\nEvaluate a company’s revenue and revenue drivers, including pricing power", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAn4AAAJ2CAIAAABO4RhaAABGDklEQVR42u3dfWyU57Xv/R+PrYzB4MFD4hcIDhi ing for company analysis?", "opts": ["A more complex model leads to more accurate analysis.", "A complex model can lead to a false sense of confidence.", "A standardized model should be applied to all companies."], "ans": "B", "expl": "Spreadsheet modeling has become a nearly universal tool in financial statement analysis. A complex model can lead to a false sense of\nconfidence in the precision of the model output.\nComplex spreadsheet models are highly dependent on numerous forecasts and assumptions. Therefore, the risk of error is high, and such errors\ncan quickly compound, creating increasingly inaccurate outputs. At the same time, the model's complexity can encourage overconfidence in its\nprecision. Once a model is complete, a reality check should be performed by testing for reasonableness. Only a handful of critical drivers should\nmaterially impact the bottom-line results.\n(Choice A) Increasingly complex models do not necessarily produce better outputs and often lead to a false sense of confidence in the precision\nof the model's output.\n(Choice C) Spreadsheet models should closely match the financial reporting and disclosures of the company being analyzed. This allows for\ndirect comparisons between the model and what was reported by the company. While a standardized model may have some benefits regarding\nconsistency, the comparability of forecasts and assumptions for each individual company could be negatively impacted.\nThings to remember:\nFinancial modeling outputs are highly dependent on numerous forecasts and assumptions. A complex model can lead to a false sense of\nconfidence in the precision of the model output.\nDescribe the elements that should be covered in a thorough company research report", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAa4AAAFoCAIAAACAJohkAABA70lEQVR42u2dS3LbSJPHU265PR2eDsGemIVnY8g+gMATEDwBwRMQPAHFE5A8AckTEPQFBJ6A4AkIbXorcDlfzFjQwvGN+7Nbs/iHM6oLBF96WI//b6GQIKDeSGRWVlUeXF9fCyGEPG9esAkIIYSikBBCK BBCUUgIIVvy/3zaOMpYGRRJAAAAAElFTkSuQmCC"]}, {"n": 6, "q": "Which of the following is most likely a source of capital for a company?", "opts": ["Asset disposal", "Cash and investments", "Positive net working capital"], "ans": "A", "expl": "Sources and uses of capital\nSources Uses\nCash flows from operations Cash and investments\nNet working capital (negative) Net working capital (positive)\nDebt issuance Capital expenditures\nEquity issuance Intangible asset purchases\nAsset disposal Acquisitions\nDebt paydown\nDividends\nShare repurchases\nCompany research typically involves identifying and analyzing sources and uses of capital. Evaluating trends over time and comparing company\ndata with peers can help analysts identify strengths and weaknesses or competitive advantages and disadvantages.\nSources of capital are any activities that generate capital to fund operating, investing, and financing activities.\nUses of capital are activities that invest in operations, including capital expenditures, or that return capital to stakeholders.\nA company's capital is commonly sourced from operations (ie, cash flow from operations) and from third parties (eg, issuance of equity or debt).\nHowever, sources of capital also include one-time infusions, such as asset disposals or sales.\n(Choices B and C) Cash and investments and positive net working capital are uses of capital. Cash and investments are used to maintain\nliquidity for business operations, interest payments, or other items. Positive net working capital is used to support operations.\nThings to remember:\nSources of capital are generally any activities that generate capital to fund a company's operations. Uses of capital are activities the company\nspends its capital on to operate its business or return capital to stakeholders. Sources of capital include one-time infusions such as asset sales.\nEvaluate a company’s capital investments and capital structure", "qhtml": null, "explfigs": null}, {"n": 7, "q": "A nonbank company increases the amount of debt in its capital structure. All else equal, this will most likely affect the company's:", "opts": ["contribution margin.", "degree of financial leverage.", "degree of operating leverage."], "ans": "B", "expl": "In addition to measuring operating risks, analysts typically evaluate a company's risks related to its capital structure (ie, financial risk). Larger\namounts of debt in a company's capital structure will increase the company's obligated principal and interest payments, and therefore its financial\nrisk. The degree of financial leverage (DFL), which is the rate of change in a company's net income compared with the change in its\noperating income, measures this risk.\nA company's DFL is directly affected by interest expense. Interest expense is a nonoperating cost and therefore affects net income, but not\noperating income. Larger interest payments result in a larger DFL, thus making net income more sensitive to changes in operating income since\nthe company has a riskier capital structure that relies more on debt financing. A DFL close to 1 indicates there is little interest expense as the\ncompany largely uses equity financing.\n(Choice A) Contribution margin is the difference between a product's unit price and unit variable costs. For a nonbank company, contribution\nmargin would be unaffected by increases in the amount of debt in a company's capital structure.\n(Choice C) Degree of operating leverage (DOL) measures the rate that operating profit increases (decreases) in relation to sales increases\n(decreases). For nonbank companies, DOL is affected by the company's operating cost structure (ie, fixed versus variable costs) but would not be\nimpacted by changes in interest rates.\nThings to remember:\nThe degree of financial leverage (DFL) measures the rate of change in a company's net income compared with the change in its operating\nincome. DFL is one option to evaluate financial risk and is directly affected by interest expense. A larger DFL suggests a company has significant\ninterest payments and a riskier capital structure with more reliance on debt financing.\nEvaluate a company’s capital investments and capital structure", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA/sAAAClCAIAAACMdnp3AAA5JUlEQVR42u2db2xU15n/H//iCEMIzDipcH5OgxlnIW0aZDpelq2UxGjHEpFICpHGSlKlCdFqpm9ISlLV8woKr2ZWW5M/bzpXUUkapYk8UmATJCJ5VjiJlCWsp1hk0xIaX0yKt0YFxiGEEJWI34sv8/wO5869vh7/AZvv5wUy1/eec+45Z8bPec73eU7dpUuXhBBCCCGEEDJH+T/sAkIIIYQQQmjxE0IIIYQQQmjxE0IIIYQQQmjxE0IIIYQQQmjxE0IIIYQQQmjxE0IIIYQQQmjxE0IIIYQQQoufEEIIIYQQQoufEEIIIYQQQoufEEIIIYQQQoufEEIIIYQQQoufEEIIIYQQQoufEEIIIYQQQoufEEIIIYQQWvyEEEIIIYQQWvyEEEIIIYQQWvyEEEIIIYQQWvyEEEIIIYQQWvyEEEIIIYQQWvyEEEIIIYQQWvyEEEIIIYTQ4ieEEEIIIYTQ4ieEEEIIIYTQ4ieEEEIIIYTQ4ieEEEIIIYTQ4ieEEEIIIYTQ4ieEEEIIIYTQ4ieEEEIIIYQWPyGEEEIIIYQWPyGEEEIIIYQWPyGEEEIIIYQWPyHkMo7jOI5TNx6ZTMZ1Xdd12WNTS6lUKpVKnZ2dVofjesCDuVwul8uZj3R1dXV1dVmjWSwW52rXtba2tra21tXVdXZ2dnZ21lYIZrV2F3o1zKfG7OE53MmEEBKeenYBIbOdXC7nOI6I9PX1xeNxdshUkU6nYfdP6KlCoZDJZNh7hBBChD5+QgghhBBCiNDHTwgJQ7lcFpGurq6hoSH2xtT2qohg52RgYGBCT4lIb2+viCSTSb2SSqWuh67jPCSEEKGPnxBSA319fX19fZcMent7e3t7Vcnjui6k/+LRQ0NHrvpmyKy9d4qhFDIV5+3t7ZBEq6i9tbVVrtRt43pnZ6elYreE1I7jNDY2NjY26g3pdNovDgHXq7Y8oPF+hni5XM5kMpYoP51OowF6J960rq5OWwXhvr6gXxXQrEMLBLTbUaafjh/VAbwa+lB7qbGx0e+V0Tazi6whs+43X7xQKBQKhfb2dissJDg+wRy79vb29vZ2b8MCdPxaqVUv+moGwlHCzEAdONzpLSSTyZhzyXwWI2WW7zfJtZeCPziYt96pO+6sMENQUII50zDZwnSO9QEhhNDiJ4QQQgghhFxjXCKEXKvk8/l8Pi/+Pn5gKiiSyWQymTR/NTQ0FI1G/b4BUqlUKpUyS+vu7u7u7va7PxaL6Q/mU3rdW9fAwMC4JUej0Wg0OjAwoDej8bge0PiQPTk0NBSLxbSRVRugtaOf/e5MJBJ+tSQSiUQiIf77M+Zo4iIeNKsLbmc+n/cObkAXeaeNdyjDzArMq4BastlsNps15wPKR5+Yu1LBf5Ki0eiZM2fOnDmjL+hXRcCnxu/dw89A7J6Joc6yatEXjMfj8XjcrCLg1VCFt5DgD8644fhWtwTMCmvQzekU/MH3fjwJIbMLWvyEzHqL37Q1YUN4r8MuGRoawnUYT17T0zSw8IiaX5bN52fxiwhMB7XYvDa0mm64QQ0ayzpU6xktR1Helvv1idU/pvUGAw4WjNpG6Dq8bLDZWrPFGcbitxppzQFzOQe7XIfDz1DW4bAsfvNXVlfgB79ma2neR7T3/LpO54m1NDWr0HefQot/ojMQnalGs7n+QV95i/JWYS7MzCqqWvx tly growing revenue"], "ans": "B", "expl": "Pricing power\nAttributes that affect pricing power Indicators of pricing power\nProduct differentiation\nBarriers to entry\nLack of substitutes Rising margins and profitability\nSwitching costs\nCustomer loyalty\nPrice is a key component of a company's revenue. Pricing power is a company's ability to increase prices without causing sales volume to\ndecline significantly. A company with greater (less) pricing power can (cannot) raise prices without meaningfully affecting demand. A company's\npricing power is largely determined by both the industry structure and the company's competitive positioning within the market.\nOne indicator of pricing power is the ability to pass on cost increases to customers by increasing price. Analysts can evaluate a company's\npricing power by comparing its pricing trends to its cost trends: if prices cannot keep pace with costs—in other words, if profit margins (eg,\noperating margin, net margin) are shrinking—then the company has little pricing power.\nExpanding profit margins indicate that a company has significant pricing power: it can raise prices faster than costs rise, without fear of\nsubstitutes or competitors taking market share with lower prices.\n(Choice A) Gaining market share does not demonstrate pricing power. For instance, the company could be lowering prices to increase volume,\nwhich is not an example of pricing power and may not be sustainable.\n(Choice C) Consistently growing revenue alone does not demonstrate pricing power since costs may be growing even faster than revenue.\nThings to remember:\nPricing power is determined by a company's ability to increase prices without causing sales volume to decline significantly. Analysts can evaluate\na company's pricing power by comparing its pricing trends to its costs or to the pricing trends of competitors. Expanding margins demonstrate\npricing power since the company can pass rising costs to customers, without the risk of substitutes or competitors taking market share with lower\nprices.\nDescribe the elements that should be covered in a thorough company research report", "qhtml": null, "explfigs": null}, {"n": 9, "q": "A consumer bank expands its offerings to include brokerage and asset management services. As these offerings expand, the bank's profit margin improves. This is best described as:", "opts": ["economies of scale.", "economies of scope.", "degrees of financial leverage."], "ans": "B", "expl": "Companies can often improve their cost structure over time by increasing the size of their business or adding related business lines.\nEconomies of scope occur when companies reduce their average cost per unit by increasing the number of business lines or\nproducts offered. Efficiencies typically result from cost-sharing between businesses (eg, financial service firms sharing back-office\nfunctions and cross-selling services) or an ability to use fixed costs for multiple functions (eg, passenger airplanes carrying freight cargo).\nEconomies of scale occur when companies reduce their average cost per unit by increasing the quantity produced. Some reasons why\ncompanies might experience economies of scale include:\nGreater bargaining power with suppliers\nAbility to spread fixed costs over more units\nAvailability of new efficiencies (eg, in marketing)\nLower cost of capital\nAs average cost per unit declines, profit margins typically expand, assuming prices remain stable. In this scenario, the bank's profit margins\nexpand as it adds new product offerings. This describes economies of scope.\n(Choice A) The bank's margins are expanding due to new business lines, not greater quantity (ie, scale of output) for its traditional products or\nservices.\n(Choice C) Degree of financial leverage (DFL) is the rate at which net income changes compared with changes in operating income. DFL is\ndirectly affected by interest expense and is not related to a company's expanding operating margins due to scale or scope.\nThings to remember:\nEconomies of scope occur when companies reduce their average cost per unit by increasing the number of business lines or products offered.\nEconomies of scale occur when companies reduce their average cost per unit by increasing the quantity produced.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6AAAAHOCAIAAAAJxvPlAABU50lEQVR42u3df2yc9Znv/csP0SaEpvE4KQTSQ9wxhBYOkO64tDrlLEGydYKaQujWFoXVJkg8M3t2nwoqqvU8f4X8N7MqJTzVVusREmH18EOeigbIqhzZj2r20BWknq0hC4WApwlqIAFiO/xMKlCePz742i/3PTMZ/8zY8379gczknvv+zj32Nddc318tp0+fNgAAAGCp+D+4BQAAACDBBQAAAEhwAQAAABJcAAAAgAQXAAAAJLgAAAAACS4AAABAggsAAACQ4AIAAAAkuAAAACDBBQAAAEhwAQAAABJcAAAAgAQXAAAAIMEFAAAACS4AAABAggsAAACQ4AIAAAAkuAAAAAAJLgAAAEhwAQAAABJcAAAAgAQXAAAAIMEFAAAASHABAABAggsAAACQ4AIAAAAkuAAAAAAJLgAAAECCCwAAABJcALNXKpWy2Ww2m235vM7OzkKhUCgUGqSRjdOYRSeTyYTv7Fm5vaVSqbu7u7u7O2xJqVQqlUo6IJ/PR34De3t71Sp/ZGhoaGhoaMY3IbwPi+6N49cYIMEFAAAAGsgybgGwMFSxy2QyVqXkpn8qFouDg4NnvZG5XI63bPHe3kwm48XaiGKxaGbZbJa3A8AS1nL69GnuAjDfisVib29vnQcr++nr6zsLEWGqc/YstmEpB9yFur0dHR3lctnMUqnUyMhIjS9aAwMDPT09vDUAjCEKAAAAQOM6DWD+JZNJ/6NLp9PpdHp8fHx8fNwPSKfTfkAikUgkEvGTDAwMDAwMpFIpPzKZTCaTyf7+/v7+/vjxY2Njulbkrz6VSkWeUmNQRLWTu66urq6uLm/M4OBgKpUKG9nX19fX11ft6fHju7q6BgcHBwcHI0eGL0QHWFDzzuVytRtZLe7pBcZfb+QS/f39ukoikQjfpvjNidzw+KmmdXv9rRwbGwtLrf7Wh3eyxvvYNaXaAYODg5FbEX8X4r+Bug/x+x/5xYu/Iv1WWKzvosYvmF71yMjIyMhIeCt6enp6enrGxsYq3jo1OGyz3rj4tWo3WG2ON7jaL57+KXJ8xXsFYD5QwQUAAIAxyQyA1b9gk5lpQKTKt2GRLKzkhRWp+AH5fD4+MUin1XjKUqnkJ5mYmDCz7u5uv27FCW0TExNzOAzULxpvuS4aqS9qtlN8aLKvTtXf3x8vP0v9A5rnSj6fj9xMvV4fzFqtqbOki3Z2dvoVI2+9fsEq/lLN+R2oODVtYmJCj5dKpYGBgXpO1dnZWXEOXDab1W/F4OCgV8oj19IvWHgr9JRSqTQ2Nhb/xYu3Wc/NZrNqQz1t1v2Pt1kn94mh3ube3l61avb3CoAxRAFoQJFu35GRkemeIdL13NXV5cMbIh3B3vsZ6R4dGBjQqfRE766ND4Sov9O/Yg9ypHmRsQHeHa8D1FPsXcx+Qs/vE4lEeKrwlarT2U8VGe8xH0MUdBt1JyNPibQ/PkRhrm5vKpXSWIX4WxwZS+BDYrq6umr/QoZPrDZEQReNv8WRX6fwKdWGKHiz9e771fVETxDD the rate of change in its net income compared with a change in operating income. All else equal, increasing\ninterest expense, which is a nonoperating cost driven by debt, will reduce net income but not affect operating income. Therefore, when net income\nis positive, greater interest expense causes net income to change at a faster rate than operating income, causing the DFL to increase.\nIn this scenario, the company's operating income and net income in each period must be calculated before the DFL:\nThe company's DFL is approximately 1.67.\n(Choice A) 0.50 is the company's degree of operating leverage, which is driven by fixed operating costs.\n(Choice B) 0.83 is the company's degree of total leverage, which is driven by both fixed operating costs and financing costs.\nThings to remember:\nThe degree of financial leverage (DFL) measures the rate of change in a company's net income compared with its operating income. All else\nequal, increasing interest expense will reduce net income but not affect operating income, thus causing DFL to increase.\nEvaluate a company’s capital investments and capital structure", "qhtml": "<p>An analyst collects the following data for a company:<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAc8AAAFZCAIAAABxJTMiAAAS2ElEQVR42u3d27KrqBoGUE3l/V85+2JVz8qOij/gAXCMq+65PKJ+IqCZP5/PBMDJXooAQNoCSFsApC2AtAWQtgBIWwBpC4C0BXhC2s7zPM+z4gYeaz7qzd2/MF0u8Dtnr39ReHXDKv/Y0PGb52a3jeX5/y1x1FZnSV9Z8WmWkwVX95DSSExfWSYH122XR/Fnc1VyrzyDuf24JA7N1j8l/r57oCNnwk9lomZ1g5VGHy0Jq3tVULIU394UaY+3wOU0WQmymxTp6l7ZFo5aGhfE1OvKipUHXkhcPgWXd/BhWWm08Lz4PqkZ4eees3rXuiZ8K9fS0R3isiKl4FoteArZmiV4oLMqtrl13sFK45o71nu66cm3oINr6/xIt2RXdnPtzp7VNp/ekbLm/NWbGVOTDT6J45U4iOlDvPzX1QD6+cup8dpdaVzzcPA+byjC2U1giebza6p46Xb9eDovN7hsybQZrxcsYTVi6p9KH1gay5rQgQXyuuBsG7LmVdYfGul4rSkulVwDSIrTarWX/+xbe7Olcca+v3sZHLrbbnBj0GTdWuITb1V4l3VhjQkDtOfWn4QFQ1nv7bRorTTOfjPgdf0NpLKrcWuxVz5fJ47KgZX65X3lj9gStb2/AtpaaVzwEtbr1KeArWg46hB2lzu5Gzx/kVYaEG5Z9Rlb3lppXLM972si5sYRYI2H7+odPnFC not profiting from its marginal output.", "shortening its cash conversion cycle.", "relying on suppliers as a source of financing."], "ans": "C", "expl": "Working capital management\nNet working capital Sources of financing\nNegative Current liabilities > Current assets Assets plus external, including suppliers\nPositive Current liabilities < Current assets Assets\nAlong with fixed capital, working capitalrequirements determine the amount of investment a company requires to maintain its operations.\nGreater working capital requirements mean less funds are available for other uses, such as distributions to shareholders or debt retirement.\nIf working capital is positive, current assets exceed current liabilities, and the company can meet current obligations.\nIf working capital is negative, the company's current assets are less than (and therefore cannot support) its current liabilities; in essence,\nthe company is using its suppliers as a source of short-term financing.\n(Choice A) The profit or loss from marginal output is determined by its contribution margin (= Price – Variable cost) and is not directly affected by\nworking capital.\n(Choice B) A report of positive or negative working capital does not provide any detail as to whether a company is shortening or lengthening its\ncash conversion cycle, which is reflected in activity ratios.\nThings to remember:\nAlong with fixed capital, working capital requirements determine the amount of investment required to maintain operations. If working capital is\npositive, current assets exceed, and thus can support, current liabilities. If working capital is negative, the company must rely on alternative,\nexternal financing, often from its own suppliers.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null, "explfigs": null}, {"n": 12, "q": "When conducting a company analysis, which of the following factors is least useful for analyzing supply?", "opts": ["Product differentiation across the industry", "Anticipated expansion of industry capacity", "Price competition among resource providers"], "ans": "A", "expl": "Analysis of company products and services\nMarket size\nProduct differentiation\nDemand\nEconomic and demographic factors\nOpportunities\nInput sources\nCapacity\nSupply\nImport/export considerations\nProprietary products\nPart of a thorough company analysis is an analysis of the company's ability to supply product to customers. This ability is influenced by\ncompetition for resources and production capacity within the industry. Factors in supply analysis include:\nInput sources—Competition or concentration in industries that supply inputs, and availability of substitute resources\nIndustry capacity—Current capacity and anticipated expansions, and the ease or difficulty of adding capacity\nFirm capacity—Output potential and cost structure\nInternational factors—Potential impact of import competition on supply and prices in the product market; impact on input prices from exports\nto foreign competitors\nProprietary products and trademarks—Possibility of restraining output below capacity to maintain the value of products and trademarks\nProduct differentiation across the industry indicates the degree of competition for the company's product. It is a factor in analyzing demand for\nthe product, not supply.\n(Choice B) An anticipated expansion of industry capacity affects the industry's ability to offer products to customers and is a factor in analyzing\ncompany supply.\n(Choice C) Price competition between resource suppliers affects a company's cost structure and is a factor in analyzing company supply.\nThings to remember:\nPart of a thorough company analysis is an analysis of the company's ability to supply product to customers. This ability is influenced by\ncompetition for resources and production capacity within the industry. Factors to consider include sources of inputs, industry capacity and\nanticipated expansions, firm capacity and cost structure, international factors, and proprietary products and trademarks.\nDescribe the elements that should be covered in a thorough company research report", "qhtml": null, "explfigs": null}, {"n": 13, "q": "Which of the following best approximates contribution margin?", "opts": ["Gross margin", "EBITDA margin", "Operating margin"], "ans": "A", "expl": "A company's contribution margin is the difference between its unit price and unit variable costs and measures the approximate contribution to\nprofit from each incremental unit sold. When price exceeds variable costs, each marginal unit produced will create additional profit for the\ncompany. When the company produces a great enough quantity, the contribution profit will exceed fixed operating costs and operating profit will\nbecome positive.\nFor most companies, a significant portion of costs of goods sold (COGS) incurred during a period is variable (eg, material, freight, and storage\ncosts). A significant portion of total COGS varies with the number of units produced or sold. Therefore, COGS tends to be a suitable\napproximation of a company's total variable costs. Gross margin is the difference between revenue and COGS; therefore, it is a suitable\napproximation of contribution margin.\n(Choices B and C) Costs that go into a company's operating and EBITDA margins, but not in gross margin, include sales & marketing, general &\nadministrative (G&A), and research & development (R&D). These (eg, salaries, marketing, rent) tend to be more fixed in nature and therefore\noperating and EBITDA margins would not make good approximations for contribution margin.\nThings to remember:\nA company's contribution margin is the difference between its unit price and unit variable costs. For most companies, a significant portion of costs\nof goods sold (COGS) is variable while sales, G&A, and R&D costs are mostly fixed. This theoretically makes COGS a suitable measure of a\ncompany's variable costs and gross margin a suitable measure of contribution margin.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAa0AAACjCAIAAAC2SdakAAAQ8ElEQVR42u2d25WrOrNG1WesBOgQcAg4BBwCDgFCMCFACCYEE4IJwYRgQjAh9P/wjVVHW2Dadt97zfmwx2rMRSqVPlVJgv308vLiAAD+Yf4PEwAAOggAgA4CAKCDAADoIAAAOggAgA4CAKCDAADoIAAAOggAgA4CAKCDAADoIAAAOggAgA4CAKCDAADoIAAAOggAgA4CAKCDAADoIAAAOggAgA4CAKCDAADoIAAAOggAgA4CAKCDAADoIAAAOggAgA7+LPq+7/u+LMun/7Jer9frddM036qcTdPcWyRdYvXqum72+OfU1GoRHC+KoigKKww98HPA7OggAAA66FzTNIr76rqejVyKothsNpvN5puUcxzHcRx/urV/bhUAHQQA+Id4enl5+d01bNvWObfdbm88v6qq3W73Ze3xd+6mqirn3LuURJN0RVHoz/1+n+f5p9XiC40JcCsvv504juM4tvrmeX65XC6Xi52Q57mvC1EUzd7ncDgkSZIkiZ0Zx/F+v9/v99OT/cfleT69drfb7XY7O/94PF5rID3ifD77Sl1VVZqmaZqqwFEUXS4XnWmnHY9H3Tw4vt/v9XQ7orLZ+YbuP+sq03sej8flWsxa+0Y7y9Sz7eKb+nA46PJrdl7Gr5FuFYh4mqbnv2RZlmWZ/ZRlWeBX4nK5BNY2N5s6j/mqGlcNPW3Qy+USmFGF8Z1EJ1xzcjvu3985dzqdpr6hlv3dKkFeDAD/On/cr94o45wbhsFGSAUm01DF/9Mf5IWWVsqyDI4Pw6Bks+/76W2FNq9Mt4/onuM4XrtwAbs2iC9uvLwsy+BaGWqz2ZxOJ4UAX9JeC3ZWXq9yLph6wc4LF7orG02mRu66zlbSzK9s+kUnB0HxZrNRsQPGcbRHTKNFXWI7n4Imnt5Tkz+zD7qL7XYb1Kvve1VZwaafWqGDP0kH/Uxh4eTZTiJHtJ6pPPFwOMgji6JQx2uaRv4xdWh51W63UwJiiqM+07atnpumqVK8a/ODvnfq2sPhINUOHPdVxnFUX03TVBW0vq2eKTW8FxlnWosb5we7rpvaWZ1fpbINlXEcz95zGAYdr6pqaud7dVBNfDqd1LLr9VrNJ2vHcSxdiKJIPw3DIGPqiVEUqbTmhKfTyR9gVquVbtW27bQ6uolVxx4a3NOGdp1w+yT4AjYWmtl9qf2ts73kxQBAXvx7eThzdP9dabXLLUKxEFIhwDAMOnM6WiqasNloRQRpmmp0fWx7nW5i+fu9qcput7MFEP1Dxa7rWoFG3/efnxqbqWftrIBRUU/TNLNRSRzH72hnhVpmW1nbD8SCn2xfqsWDuoNlIcMw6JxgumahbFZNe5ZlyjKORbg6Yb/fKzh9mN1uZ02vkn+f96zQwS/Dn6BJkmSqpNYH5NaWvwQ6OJtzBd3mXh18mOnlQSGHYfh8HTRTz9pZppaODMMwtfOsqYP7jON4u52XLeD/GtwzKFvbtrNTjcvo8mlpTYhni2eme3j7um/DqfUc+6gBAIgHf1ua/C6XvBpfvJq0PhAPvpHps4JCfsnI/zmm/kw7TzfwK21XKFfXdbAc/HDgNrXSu8SDb+8+xIMAAMSD34DgdQjN+F7bPFGWpWZ2/PcEXh1d374U876D9mORV7Dz5kv2iEVRtBxx+L9+Zlj3xnjQSns+n/1iT7/3cVcTXNssxYct0EE3O5ktl7IlXUtPzCm1bc38sm3by+WiE6Sktkl1msOar1+b2HbfcvEn2CsedCqbg5/my1bBd+9vtrY7a+f AdBAAAB0EAPiX+B9QZRkcDNdyOQAAAABJRU5ErkJggg=="]}, {"n": 14, "q": "An analyst collects the following information on a company and its industry peers: Company Peer average Net margin 4% 6% Asset turnover 1.2 1.4 Equity multiplier 2.5 1.5 Degree of operating leverage 1.2 1.4 Degree of financial leverage 2 1.2 Required return on equity 9% 7% Cost of debt 6% 5% Based only on this information, the most appropriate conclusion is that the company:", "opts": ["has a better credit rating than peers.", "maintains a conservative capital structure.", "generates returns that exceed equity investors' requirements."], "ans": "C", "expl": "Return on equity (ROE) measures how much profit a company generates relative to its equity. ROE is often compared with investors' required\nrate of return (r) to determine whether the company is generating profit in excess of the return required by its equity investors. When ROE is\ngreater (less) than r, the company is generating a profit that exceeds (falls short of) what is required by investors.\nDuPont analysis decomposes ROE into measures of profitability, efficiency, and leverage. ROE is the product of the company's profit margin,\nasset turnover, and leverage ratio (ie, equity multiplier). In this scenario, using the three ratios, the company's ROE can be calculated as 0.04 ×\n1.2 × 2.5 = 0.12 = 12%, which exceeds the required return on equity of 9%.\n(Choice A) The company and its peers are in the same industry, yet its cost of debt (6%) exceeds the industry average of 5%. Although a credit\nrating is based on many factors, this greater cost of debt suggests that the company would have a worse credit rating than its industry peers.\n(Choice B) The company has an equity multiplier of 2.5 and degree of financial leverage of 2, suggesting a significant amount of debt in its capital\nstructure and therefore higher financial risk. It would not be appropriate to assume that the company has a conservative capital structure.\nThings to remember:\  segment manufactures and designs clothes that it sells directly to retailers, who\nresell the clothes to consumers. The company also has a merchant segment that manufactures clothes for designers in exchange for\ncommissions paid when the designers sell the clothes to retailers.\nFor the retail segment, the customers are retailers. For the merchant segment, the customers are designers, who receive the company's\nmanufacturing services and pay commissions when they sell the clothes to retailers; through the commissions, the designers purchase directly\nfrom the company.\n(Choice B) Retailers are the designers' customer base, not the merchant segment's.\n(Choice C) Clothing consumers are the retailers' customer base, not the merchant segment's.\nThings to remember:\nBusiness model analysis provides a basis for determining the drivers of a company's financials. Elements of a business model analysis include\nidentifying the customer and key customer groups. A company sells its products or services directly to its customers; thus, customers are the\nparty that directly purchases from the company.\nDetermine a company’s business model", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAsMAAAKrCAIAAACbSRciAABkwklEQVR42u3dbWyU97nv+989fgQMtgtKUy3LYOtkSXtzcGPoQatRvM9hUYHKNpGIqAA5VALJ1RQUpPIC17zwC17Awi8ciQqWVUtGSmKRqKhIxTsVUViWlqu0igpOzc46Oo2ODd6s07SC2iY8+GnmPi+u8T834wf8OL5n5vtRhMgwnhnPwz3XfV3X//p7vu8LAABgQSI8BQAAgEgCAAAQSQAAACIJAABAJAEAAEAkAQAAiCQAAACRBAAAIJIAAAAgkgAAAEQSAACASAIAABBJAACArJLLUwBgJvHJrYIjHk8GAJGTAAAAIicBYFFGY/54XJLivsYm0w6jsYXcVEFO4i/5Ec/yFnkRFeSQwQCyiOf7Ps8CoAytTYzEfIsSxuO+JAsgUiMvYqGGZ9GGCzUAiOoGAACAyEkAGSbmS9KzCf/pRKozEJpzlmJ1rrcq15NEDQQgkgCgMKytsBLG43E/bKGDXtRjsTrXk1SY44nlIYCobgAAAJGTAKD0qGI8Hk9UMeJp/iG2bMTqXK8oj6oHQCQBYJkDiEdjiQAiU63O9dblE1IAVDcAAIDISQAQqQitVHKiOJ9mTEDkJAAAgMhJAEi1R2O+pCcZ0Va5mGbMNbmeJGueAEAkAUAv3BdD0uCoH+PTqecGW1mxg309AKobAABA5CQALL3hMf/xOJ/K2azN86h0AEQSAJ4zHtfgaDyEm2UorJUOSesLIxQ6AFHdAAAAIicBYGFGJvsr43wW57+yo7T firm with fixed costs to be profitable, its contribution margin (= P − VC) must remain positive and greater than its fixed costs, so that\noperating profit (= Q(P − VC) − FC) is positive:\nIf FC > 0, then P − VC > 0 and P − VC > FC, and as a result, Q(P − VC) − FC > 0.\nP = Price per unit\nVC = Variable cost per unit\nFC = Fixed cost\nQ = Quantity sold\nOperating leverage refers to the proportion of fixed costs in a company's cost structure. Holding other factors constant, a company that\nincreases fixed costs as a percentage of total costs will increase the rate at which operating profit changes. When the proportion of fixed\ncosts increases and:\ncontribution margin is positive, operating income will increase (decrease) faster as quantity increases (decreases).\ncontribution margin is negative, operating income will decrease (increase) faster as quantity increases (decreases).\nThe degree of operating leverage (DOL) measures the rate that operating profit increases (decreases) relative to increases (decreases) in\nsales. Since a greater proportion of fixed costs will increase the rate that operating profit changes for a given change in quantity, it will also\nincrease the DOL, all else equal. Therefore, a firm that reduces a variable cost such as temporary labor while increasing a fixed cost such as\nequipment, all else equal, will report an increase to its DOL (Choices A and B).\nThings to remember:\nHolding other factors constant, a company that increases fixed costs as a percentage of total costs will increase its degree of operating leverage\n(DOL), that is, the rate at which operating profit changes given a change in sales quantity. Greater proportions of fixed costs will increase DOL, all\nelse equal.\nEvaluate a company’s operating profitability and working capital using key measures", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbUAAACnCAIAAAAZoVWuAAAUYklEQVR42u2d25WbzBJGW2f9CaAQUAgoBAgBhSCFACFACBCCCGEUgghBhCCFMOfhW67Vbi66zIw ping), and\nthe emergence of substitute or competing products (eg, electric vehicles in competition with traditional cars).\nA growing or shrinking market can affect a company's future sales.\n(Choice A) How well the company implements its business model, compared with peers, determines its market share in the industry. However,\nmarket share itself is not part of the business model; rather, the model includes an operating strategy to help the company achieve or expand its\ntarget market share.\n(Choice B) Potential losses from lawsuits against the company are not included in the business model analysis as they are largely out of the\ncompany's control and therefore not generally planned for in its operating strategy.\nThings to remember:\nResearch reports often include an analysis of the company's business model. Determining the company's addressable or target market is an\nimportant part of the business model analysis. The analyst should consider potential changes to that market based on factors such as\ndemographics, consumer behavior, and the emergence of substitutes.\nDetermine a company’s business model", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAsMAAAKrCAIAAACbSRciAABkwklEQVR42u3dbWyU97nv+989fgQMtgtKUy3LYOtkSXtzcGPoQatRvM9hUYHKNpGIqAA5VALJ1RQUpPIC17zwC17Awi8ciQqWVUtGSmKRqKhIxTsVUViWlqu0igpOzc46Oo2ODd6s07SC2iY8+GnmPi+u8T834wf8OL5n5vtRhMgwnhnPwz3XfV3X//p7vu8LAABgQSI8BQAAgEgCAAAQSQAAACIJAABAJAEAAEAkAQAAiCQAAACRBAAAIJIAAAAgkgAAAEQSAACASAIAABBJAACArJLLUwBgJvHJrYIjHk8GAJGTAAAAIicBYFFGY/54XJLivsYm0w6jsYXcVEFO4i/5Ec/yFnkRFeSQwQCyiOf7Ps8CoAytTYzEfIsSxuO+JAsgUiMvYqGGZ9GGCzUAiOoGAACAyEkAGSbmS9KzCf/pRKozEJpzlmJ1rrcq15NEDQQgkgCgMKytsBLG43E/bKGDXtRjsTrXk1SY44nlIYCobgAAAJGTAKD0qGI8Hk9UMeJp/iG2bMTqXK8oj6oHQCQBYJkDiEdjiQAiU63O9dblE1IAVDcAAIDISQAQqQitVHKiOJ9mTEDkJAAAgMhJAEi1R2O+pCcZ0Va5mGbMNbmeJGueAEAkAUAv3BdD0uCoH+PTqecGW1mxg309AKobAABA5CQALL3hMf/xOJ/K2azN86h0AEQSAJ4zHtfgaDyEm2UorJUOSesLIxQ6AFHdAAAAIicBYGFGJvsr43wW57+yo7Tgmz3AABBJAMrCdZ5f0xUh ins and profitability\nSwitching costs\nCustomer loyalty\nPrice is a key component of a company's revenue. Pricing power is a company's ability to increase prices without causing sales volume to\ndecline significantly. A company with greater (less) pricing power can (cannot) raise prices without meaningfully affecting demand. A company's\npricing power is largely determined by both the industry structure and the company's competitive positioning within the market.\nOne indicator of pricing power is the ability to pass on cost increases to customers by increasing price. Analysts can evaluate a company's\npricing power by comparing its pricing trends to its cost trends: if prices cannot keep pace with costs—in other words, if profit margins (eg,\noperating margin, net margin) are shrinking—then the company has little pricing power.\nExpanding profit margins indicate that a company has significant pricing power: it can raise prices faster than costs rise, without fear of\nsubstitutes or competitors taking market share with lower prices.\n(Choice A) Gaining market share does not demonstrate pricing power. For instance, the company could be lowering prices to increase volume,\nwhich is not an example of pricing power and may not be sustainable.\n(Choice C) Consistently growing revenue alone does not demonstrate pricing power since costs may be growing even faster than revenue.\nThings to remember:\nPricing power is determined by a company's ability to increase prices without causing sales volume to decline significantly. Analysts can evaluate\na company's pricing power by comparing its pricing trends to its costs or to the pricing trends of competitors. Expanding margins demonstrate\npricing power since the company can pass along rising costs to customers by raising prices, without the risk of substitutes or competitors taking\nmarket share with lower prices.\nEvaluate a company’s revenue and revenue drivers, including pricing power", "qhtml": null, "explfigs": null}];

function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
