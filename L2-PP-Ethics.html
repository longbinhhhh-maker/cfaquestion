tment objections. Therefore, Harmon should disclose the methodology to all existing clients.","explhtml":"<p>B is Correct because, according to Standard V(B), Communication with Clients and Prospective Clients, any changes to the fee calculation method that are different from the process agreed to by the clients must be disclosed. Only by thoroughly understanding the nature of the investment product or service can a client determine whether changes to that product or service could materially affect his or her investment objections. Therefore, Harmon should disclose the methodology to all existing clients.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Anya Harmon, CFA, is an account manager at a wealth management firm. The client fees are calculated based on the average daily balance of assets in each client&#x27;s account. The firm is switching to a new fee calculation method using end-of-billing-cycle balances, thus reducing fees for most clients. Harmon discloses the new method only to new clients. According to the Standards, is Harmon required to disclose the new fee calculation method to existing clients?<\/p><\/div>","subj":"ethics"},{"n":27,"q":"Bala Park, CFA, is an investment adviser at Cristallo Wealth. The firm's clients have the option to invest in both internally managed mutual funds as well as third-party funds. Park invests client assets in the internally managed funds when they align with client needs. Recently, Cristallo Wealth raised the sales commission rates paid to advisers for recommending the internally managed funds. For some of these funds, the rates exceed the industry average. To comply with the Standards, Park must:","opts":["disclose to all clients the increase in commission rate.","refrain from investing in the internally managed funds.","invest for clients in funds with the lowest commission rates."],"ans":"A","expl":"A is Correct because according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity. Members and candidates must maintain their objectivity when rendering investment advice or taking investment action. Requiring members and candidates to disclose all matters that reasonably could be expected to impair the member's or candidate's objectivity allows clients and prospective clients to judge motives and possible biases for themselves. Because some of the internally managed funds will now incur a higher commission rate to advisers, Park is required to disclose this potential conflict of interest to his clients.","explhtml":"<p>A is Correct because according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity. Members and candidates must maintain their objectivity when rendering investment advice or taking investment action. Requiring members and candidates to disclose all matters that reasonably could be expected to impair the member&#x27;s or candidate&#x27;s objectivity allows clients and prospective clients to judge motives and possible biases for themselves. Because some of the internally managed funds will now incur a higher commission rate to advisers, Park is required to disclose this potential conflict of interest to his clients.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Bala Park, CFA, is an investment adviser at Cristallo Wealth. The firm&#x27;s clients have the option to invest in both internally managed mutual funds as well as third-party funds. Park invests client assets in the internally managed funds when they align with client needs. Recently, Cristallo Wealth raised the sales commission rates paid to advisers for recommending the internally managed funds. For some of these funds, the rates exceed the industry average. To comply with the Standards, Park must:<\/p><\/div>","subj":"ethics"},{"n":28,"q":"Beatrix Kang, CFA, is the new chief compliance officer at CV Investments (CVI), a large investment firm. Kang reviews the firm's compliance procedures and believes they are adequate. She does identify the need to update the electronic signature section in these procedures. She assigns Ben Lee, CFA, to review all staff electronic signatures. After Lee's review, Kang provides clear, written guidelines for acceptable electronic signature usage and integrates the updated section into CVI's Code of Ethics. According to the Standards, Kang should have:","opts":["declined in writing to accept supervisory responsibility.","separated the updated section from the Code of Ethics.","avoided delegating the review of the electronic signatures to Lee."],"ans":"B","expl":"B is Correct because, according to the recommended procedures of Standard IV(C), Responsibilities of Supervisors, stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. Mingling compliance procedures in the firm's code of ethics goes against the goal of reinforcing the ethical obligations of employees. Therefore, the updated compliance procedure section should not have been incorporated into the Code of Ethics.","explhtml":"<p>B is Correct because, according to the recommended procedures of Standard IV(C), Responsibilities of Supervisors, stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts. They should be unencumbered by numerous detailed procedures. Mingling compliance procedures in the firm&#x27;s code of ethics goes against the goal of reinforcing the ethical obligations of employees. Therefore, the updated compliance procedure section should not have been incorporated into the Code of Ethics.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Beatrix Kang, CFA, is the new chief compliance officer at CV Investments (CVI), a large investment firm. Kang reviews the firm&#x27;s compliance procedures and believes they are adequate. She does identify the need to update the electronic signature section in these procedures. She assigns Ben Lee, CFA, to review all staff electronic signatures. After Lee&#x27;s review, Kang provides clear, written guidelines for acceptable electronic signature usage and integrates the updated section into CVI&#x27;s Code of Ethics. According to the Standards, Kang should have:<\/p><\/div>","subj":"ethics"},{"n":29,"q":"Benjie Lobo, CFA, a fund manager, plans to issue a report on Neustift Cheese. Lobo visits the manufacturing plant of Neustift and meets with the company's CEO, who discusses a recent news release about the acquisition of production facilities due to forecast increase in orders. The CEO mentions that he is more optimistic than the analysis in the news release. He says that he estimates a 10% reduction in the firm's costs next year. He adds that the company is also considering international expansion through the acquisition of a major competitor, and it will be announced once finalized. According to the Standards, which information is Lobo permitted to use in his report Neustift Cheese?","opts":["The order increase forecast","The estimated reduction in costs","The planned international expansion"],"ans":"A","expl":"A is Correct because, according to Standard II(A), Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information. The news release is public information once the information is disseminated to the market, it is public information that is no longer covered by this standard. Therefore Lobo is allowed to use the information in his report.","explhtml":"<p>A is Correct because, according to Standard II(A), Material Nonpublic Information, members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information. The news release is public information once the information is disseminated to the market, it is public information that is no longer covered by this standard. Therefore Lobo is allowed to use the information in his report.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Benjie Lobo, CFA, a fund manager, plans to issue a report on Neustift Cheese. Lobo visits the manufacturing plant of Neustift and meets with the company&#x27;s CEO, who discusses a recent news release about the acquisition of production facilities due to forecast increase in orders. The CEO mentions that he is more optimistic than the analysis in the news release. He says that he estimates a 10% reduction in the firm&#x27;s costs next year. He adds that the company is also considering international expansion through the acquisition of a major competitor, and it will be announced once finalized. According to the Standards, which information is Lobo permitted to use in his report Neustift Cheese?<\/p><\/div>","subj":"ethics"},{"n":30,"q":"Bettina Chu, CFA, an investment advisor, recently joined the board of directors of Rabbat Music, an online music platform. As a board member, she is compensated by receiving free access to Rabbat's music library. She recommends Rabbat's stock to her clients when appropriate and she discloses the board position and compensation to the clients. According to the Standards, Chu must:","opts":["decline the music library access.","exclude Rabbat from her investment universe.","obtain written consent from her employer regarding the music library access."],"ans":"C","expl":"C is Correct because, according to Standard IV(B), Additional Compensation Arrangements, members and candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved.","explhtml":"<p>C is Correct because, according to Standard IV(B), Additional Compensation Arrangements, members and candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer&#x27;s interest unless they obtain written consent from all parties involved.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Bettina Chu, CFA, an investment advisor, recently joined the board of directors of Rabbat Music, an online music platform. As a board member, she is compensated by receiving free access to Rabbat&#x27;s music library. She recommends Rabbat&#x27;s stock to her clients when appropriate and she discloses the board position and compensation to the clients. According to the Standards, Chu must:<\/p><\/div>","subj":"ethics"},{"n":31,"q":"Biju Kassem, CFA, an analyst at a bank, is asked to write a research report on Karajan Coffee. Kassem's best friend works as a coffee taster at Karajan and shares his professional opinion with Kassem about the company's coffee. Kassem's grandmother, who owns €500,000 worth of Karajan stock, tells Kassem that she named him as the beneficiary of the portfolio in her will. Kassem's uncle is a minor Karajan shareholder and a regular fee-paying client of the bank. According to the Standards, in his report, Kassem must disclose:","opts":["his uncle's investment account at the bank.","that he is the beneficiary of his grandmother's portfolio.","his best friend's professional opinion about Karajan's coffee."],"ans":"B","expl":"B is Correct because, according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonable be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients and employer. Although Kassem does not currently own Karajan stock, he currently has beneficiary ownership of the company's stock through his grandmother's will and should disclose this fact. Sell-side members and candidates should disclose any materially beneficial ownership interest in a security or other investment that the member or candidate is recommending.","explhtml":"<p>B is Correct because, according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonable be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients and employer. Although Kassem does not currently own Karajan stock, he currently has beneficiary ownership of the company&#x27;s stock through his grandmother&#x27;s will and should disclose this fact. Sell-side members and candidates should disclose any materially beneficial ownership interest in a security or other investment that the member or candidate is recommending.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Biju Kassem, CFA, an analyst at a bank, is asked to write a research report on Karajan Coffee. Kassem&#x27;s best friend works as a coffee taster at Karajan and shares his professional opinion with Kassem about the company&#x27;s coffee. Kassem&#x27;s grandmother, who owns €500,000 worth of Karajan stock, tells Kassem that she named him as the beneficiary of the portfolio in her will. Kassem&#x27;s uncle is a minor Karajan shareholder and a regular fee-paying client of the bank. According to the Standards, in his report, Kassem must disclose:<\/p><\/div>","subj":"ethics"},{"n":32,"q":"Barrett White, CFA, leaves his equity analyst job at Barrow Investments (BI) to launch an online investment portal, where he recommends a list of stocks to buy. Last month, while still employed at BI, White issued a buy recommendation for DaBacon Co. based on his expectation that the company's market share would double over the next year. After leaving BI, White recalls his buy recommendation for DaBacon. Because White is confident that his analysis was sound, and no further analysis is required, he decides to include DaBacon in his buy recommendation list on his online investment portal. Did White's actions violate the Standards?","opts":["No","Yes, because he issued the buy recommendation without supporting documentation","Yes, because he recommends the same stock he recommended at his previous employer"],"ans":"B","expl":"B is Correct because, according to Standard V(C), Record Retention, the member or candidate cannot use historical recommendations or research reports created at the previous firm because the supporting documentation is unavailable. For future use, the member or candidate must re-create the supporting records at the new firm with information gathered through public sources or directly from the covered company and not from memory or sources obtained at the previous employer. Therefore, White cannot issue the buy recommendation unless he re-creates the documentation supporting the recommendation.","explhtml":"<p>B is Correct because, according to Standard V(C), Record Retention, the member or candidate cannot use historical recommendations or research reports created at the previous firm because the supporting documentation is unavailable. For future use, the member or candidate must re-create the supporting records at the new firm with information gathered through public sources or directly from the covered company and not from memory or sources obtained at the previous employer. Therefore, White cannot issue the buy recommendation unless he re-creates the documentation supporting the recommendation.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Barrett White, CFA, leaves his equity analyst job at Barrow Investments (BI) to launch an online investment portal, where he recommends a list of stocks to buy. Last month, while still employed at BI, White issued a buy recommendation for DaBacon Co. based on his expectation that the company&#x27;s market share would double over the next year. After leaving BI, White recalls his buy recommendation for DaBacon. Because White is confident that his analysis was sound, and no further analysis is required, he decides to include DaBacon in his buy recommendation list on his online investment portal. Did White&#x27;s actions violate the Standards?<\/p><\/div>","subj":"ethics"},{"n":33,"q":"Jean Dirac, CFA, resides in country MS, where securities laws are more strict than the Code and Standards. Dirac does business with Charles Pauli in country LS, where securities laws are less strict than the Code and Standards. Pauli is a citizen of country LS. The law of country MS applies to their business, but country MS's law states that the client's home country law governs. Dirac must adhere to the:","opts":["laws of country LS.","laws of country MS.","Code and Standards."],"ans":"C","expl":"C is Correct because the client's home country is country LS, whose law governs Dirac's business, and its law is less strict than the Code and Standards. If applicable law is stricter than the requirements of the Code and Standards, members and candidates must adhere to applicable law; otherwise, they must adhere to the Code and Standards. Therefore, Dirac must adhere to the Code and Standards.","explhtml":"<p>C is Correct because the client&#x27;s home country is country LS, whose law governs Dirac&#x27;s business, and its law is less strict than the Code and Standards. If applicable law is stricter than the requirements of the Code and Standards, members and candidates must adhere to applicable law; otherwise, they must adhere to the Code and Standards. Therefore, Dirac must adhere to the Code and Standards.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Jean Dirac, CFA, resides in country MS, where securities laws are more strict than the Code and Standards. Dirac does business with Charles Pauli in country LS, where securities laws are less strict than the Code and Standards. Pauli is a citizen of country LS. The law of country MS applies to their business, but country MS&#x27;s law states that the client&#x27;s home country law governs. Dirac must adhere to the:<\/p><\/div>","subj":"ethics"},{"n":34,"q":"Hans Bohr, CFA, resides in country MS, where securities laws are more strict than the Code and Standards. Bohr does business with Ted Feynman in country LS, where securities laws are less strict than the Code and Standards. Feynman is a citizen of country MS. The law of country MS applies to their business, but country MS's law states that the client's home country law governs. Bohr must adhere to the:","opts":["laws of Country LS.","laws of Country MS.","Code and Standards."],"ans":"B","expl":"B is Correct because country MS's law states that the law of the client's home country governs, which is country MS. Since country MS's laws are more strict than the Code and Standards, Bohr must adhere to country MS's laws. If applicable law is stricter than the requirements of the Code and Standards, members and candidates must adhere to applicable law; otherwise, they must adhere to the Code and Standards. Therefore, Bohr must adhere to the law of Country MS.","explhtml":"<p>B is Correct because country MS&#x27;s law states that the law of the client&#x27;s home country governs, which is country MS. Since country MS&#x27;s laws are more strict than the Code and Standards, Bohr must adhere to country MS&#x27;s laws. If applicable law is stricter than the requirements of the Code and Standards, members and candidates must adhere to applicable law; otherwise, they must adhere to the Code and Standards. Therefore, Bohr must adhere to the law of Country MS.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Hans Bohr, CFA, resides in country MS, where securities laws are more strict than the Code and Standards. Bohr does business with Ted Feynman in country LS, where securities laws are less strict than the Code and Standards. Feynman is a citizen of country MS. The law of country MS applies to their business, but country MS&#x27;s law states that the client&#x27;s home country law governs. Bohr must adhere to the:<\/p><\/div>","subj":"ethics"},{"n":35,"q":"Suzanne Blair, CFA, is an equity analyst. She is currently working on a research report about a new corporate client's stock. Based on her thorough and professional research, she intends to issue a sell recommendation on the stock. However, her firm is unwilling to permit dissemination of the adverse opinion. To be consistent with the Standards, Blair should:","opts":["communicate her opinion to clients despite the firm's reluctance.","encourage her firm to disseminate only factual information about the company.","discourage her firm from removing the controversial company from the research universe."],"ans":"B","expl":"B is Correct because Standard I(B), Independence and Objectivity, states that if the firm is unwilling to permit dissemination of adverse opinions about a corporate client, members and candidates should encourage the firm to remove the controversial company from the research universe and put it on a restricted list so that the firm disseminates only factual information about the company.","explhtml":"<p>B is Correct because Standard I(B), Independence and Objectivity, states that if the firm is unwilling to permit dissemination of adverse opinions about a corporate client, members and candidates should encourage the firm to remove the controversial company from the research universe and put it on a restricted list so that the firm disseminates only factual information about the company.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Suzanne Blair, CFA, is an equity analyst. She is currently working on a research report about a new corporate client&#x27;s stock. Based on her thorough and professional research, she intends to issue a sell recommendation on the stock. However, her firm is unwilling to permit dissemination of the adverse opinion. To be consistent with the Standards, Blair should:<\/p><\/div>","subj":"ethics"},{"n":36,"q":"Jacquie Clemens, CFA, is a securities analyst. Her manager, Samuel Kerouac, currently has a \"buy\" recommendation on Atlas Semiconductors. Kerouac asks Clemens to take over coverage of Atlas, instructing Clemens that under no circumstances should she change the existing buy recommendation. Clemens believes her manager's instructions have compromised her ability to cover Atlas objectively. The action for Clemens that would be most consistent with the Standards is:","opts":["telling her manager she cannot cover the company under these constraints.","escalating her concerns to other supervisors in the firm before performing her own analysis.","perform her own independent, unbiased analysis and issue her opinion without considering her manager's recommendation."],"ans":"A","expl":"A is Correct because, according to Standard I(B), Independence and Objectivity, if she believes that her boss’s instructions have compromised her, she has two options: She can tell her boss that she cannot cover the company under these constraints, or she can take over coverage of the company, reach her own independent conclusions, and if they conflict with her boss’s opinion, share the conclusions with her boss or other supervisors in the firm so that they can make appropriate recommendations.","explhtml":"<p>A is Correct because, according to Standard I(B), Independence and Objectivity, if she believes that her boss’s instructions have compromised her, she has two options: She can tell her boss that she cannot cover the company under these constraints, or she can take over coverage of the company, reach her own independent conclusions, and if they conflict with her boss’s opinion, share the conclusions with her boss or other supervisors in the firm so that they can make appropriate recommendations.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Jacquie Clemens, CFA, is a securities analyst. Her manager, Samuel Kerouac, currently has a &quot;buy&quot; recommendation on Atlas Semiconductors. Kerouac asks Clemens to take over coverage of Atlas, instructing Clemens that under no circumstances should she change the existing buy recommendation. Clemens believes her manager&#x27;s instructions have compromised her ability to cover Atlas objectively. The action for Clemens that would be most consistent with the Standards is:<\/p><\/div>","subj":"ethics"},{"n":37,"q":"Which of the following actions violates the Standard relating to misconduct? A portfolio manager who is a member:","opts":["declares personal bankruptcy due to medical expenses.","trespasses while protesting a company accused of environmental damage and is arrested.","relies solely on another member's due diligence to understand risks of an investment before making an investment recommendation."],"ans":"C","expl":"C is Correct because the absence of appropriate conduct or the lack of sufficient effort may be a violation of Standard I(D), Misconduct.. A member or candidate—whether an investment banker, rating or research analyst, or portfolio manager—is expected to conduct the necessary due diligence to properly understand the nature and risks of an investment before making an investment recommendation. By not taking these steps and, instead, relying on someone else in the process to perform them, members or candidates may violate the trust their clients have placed in them.","explhtml":"<p>C is Correct because the absence of appropriate conduct or the lack of sufficient effort may be a violation of Standard I(D), Misconduct.. A member or candidate—whether an investment banker, rating or research analyst, or portfolio manager—is expected to conduct the necessary due diligence to properly understand the nature and risks of an investment before making an investment recommendation. By not taking these steps and, instead, relying on someone else in the process to perform them, members or candidates may violate the trust their clients have placed in them.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Which of the following actions violates the Standard relating to misconduct? A portfolio manager who is a member:<\/p><\/div>","subj":"ethics"},{"n":38,"q":"Amanda Jones, CFA, is a portfolio manager for a fund dedicated to socially responsible investing. She is also an environmental activist. Jones relies solely on her colleague's due diligence, without doing her own due diligence, to understand the risks of an ESG bond before recommending an investment in the bond. Jones later participates in a nonviolent protest. She trespasses on the property of a petroleum producer accused of damaging the environment and is arrested. Jones violates the Standard relating to misconduct:","opts":["only by trespassing and being arrested.","only by relying on her colleague's due diligence to understand the risks of an ESG bond.","both by trespassing and being arrested and by relying on her colleague' s due diligence to understand the risks of an ESG bond."],"ans":"B","expl":"B is Correct because the absence of appropriate conduct or the lack of sufficient effort may be a violation of Standard I(D), Misconduct. A member or candidate—whether an investment banker, rating or research analyst, or portfolio manager—is expected to conduct the necessary due diligence to properly understand the nature and risks of an investment before making an investment recommendation. By not taking these steps and, instead, relying on someone else in the process to perform them, members or candidates may violate the trust their clients have placed in them.","explhtml":"<p>B is Correct because the absence of appropriate conduct or the lack of sufficient effort may be a violation of Standard I(D), Misconduct. A member or candidate—whether an investment banker, rating or research analyst, or portfolio manager—is expected to conduct the necessary due diligence to properly understand the nature and risks of an investment before making an investment recommendation. By not taking these steps and, instead, relying on someone else in the process to perform them, members or candidates may violate the trust their clients have placed in them.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Amanda Jones, CFA, is a portfolio manager for a fund dedicated to socially responsible investing. She is also an environmental activist. Jones relies solely on her colleague&#x27;s due diligence, without doing her own due diligence, to understand the risks of an ESG bond before recommending an investment in the bond. Jones later participates in a nonviolent protest. She trespasses on the property of a petroleum producer accused of damaging the environment and is arrested. Jones violates the Standard relating to misconduct:<\/p><\/div>","subj":"ethics"},{"n":39,"q":"Sam Patterson, CFA, hosts a conference call about the auto industry on behalf of his investment firm. The call is held for a small number of clients. Aditya Rao, the CFO of L2 Motors (L2M), an electric car manufacturer, is a featured guest. In response to a question during the call, Rao mentions a recent major advance in L2M's battery technology not previously disclosed to the public. Patterson determines the information is material. According to the Standards, Patterson should:","opts":["encourage L2M to disseminate information about the new technology to the public.","promptly issue a press release on behalf of his firm to make the information about the new technology publicly available.","immediately have conference attendees sign a nondisclosure agreement to preserve confidentiality of the information."],"ans":"A","expl":"A is Correct because, according to Standard II(A), Material Nonpublic Information, if a member or candidate determines that information is material, the member or candidate should make reasonable efforts to achieve public dissemination of the information. These efforts usually entail encouraging the issuing company to make the information public.","explhtml":"<p>A is Correct because, according to Standard II(A), Material Nonpublic Information, if a member or candidate determines that information is material, the member or candidate should make reasonable efforts to achieve public dissemination of the information. These efforts usually entail encouraging the issuing company to make the information public.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Sam Patterson, CFA, hosts a conference call about the auto industry on behalf of his investment firm. The call is held for a small number of clients. Aditya Rao, the CFO of L2 Motors (L2M), an electric car manufacturer, is a featured guest. In response to a question during the call, Rao mentions a recent major advance in L2M&#x27;s battery technology not previously disclosed to the public. Patterson determines the information is material. According to the Standards, Patterson should:<\/p><\/div>","subj":"ethics"},{"n":40,"q":"Terence Salk, CFA, is an equity analyst at TriGamma Securities. TriGamma has no policy governing outside work arrangements of its employees. Salk intends to work a few hours on weekends to supplement his income, teaching English as a second language as an independent contractor for Lightspeed Languages, a firm in his neighborhood. To be consistent with the Standard relating to additional compensation arrangements, Salk:","opts":["does not need to inform TriGramma of his employment arrangement with Lightspeed.","must provide written notice to TriGramma before entering into an employment arrangement with Lightspeed.","is required to obtain written consent from both TriGramma and Lightspeed before entering into an employment arrangement with Lightspeed."],"ans":"A","expl":"A is Correct because Standard IV(B). Additional Compensation Arrangements. states that members must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved. Since there is no conflict of interest with TriGamma's interest in this case, and there is no company policy governing outside work, Salk does not need to obtain consent from either party.","explhtml":"<p>A is Correct because Standard IV(B). Additional Compensation Arrangements. states that members must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved. Since there is no conflict of interest with TriGamma&#x27;s interest in this case, and there is no company policy governing outside work, Salk does not need to obtain consent from either party.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Terence Salk, CFA, is an equity analyst at TriGamma Securities. TriGamma has no policy governing outside work arrangements of its employees. Salk intends to work a few hours on weekends to supplement his income, teaching English as a second language as an independent contractor for Lightspeed Languages, a firm in his neighborhood. To be consistent with the Standard relating to additional compensation arrangements, Salk:<\/p><\/div>","subj":"ethics"},{"n":41,"q":"Ralph Schmidt, CFA, is an equity analyst at TriAlpha Securities. Schmidt intends to work several hours on weekends to supplement his income, providing equity analysis consulting services to a client of TriAlpha. To comply with the Standard relating to additional compensation arrangements, Schmidt must:","opts":["provide written notice only to TriAlpha before entering into a consulting arrangement with the client.","obtain written consent only from TriAlpha before entering into a consulting arrangement with the client.","obtain written consent from both TriAlpha and the client before entering into a consulting arrangement with the client."],"ans":"C","expl":"C is Correct because Standard IV(B), Additional Compensation Arrangements, states that members must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved. Since Schmidt's paid consulting arrangement with TriAlpha's client will likely create a conflict of interest with TriAlpha's interest, Schmidt must obtain consent from all parties involved.","explhtml":"<p>C is Correct because Standard IV(B), Additional Compensation Arrangements, states that members must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer’s interest unless they obtain written consent from all parties involved. Since Schmidt&#x27;s paid consulting arrangement with TriAlpha&#x27;s client will likely create a conflict of interest with TriAlpha&#x27;s interest, Schmidt must obtain consent from all parties involved.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Ralph Schmidt, CFA, is an equity analyst at TriAlpha Securities. Schmidt intends to work several hours on weekends to supplement his income, providing equity analysis consulting services to a client of TriAlpha. To comply with the Standard relating to additional compensation arrangements, Schmidt must:<\/p><\/div>","subj":"ethics"},{"n":42,"q":"Hiroshi Kato, CFA, is a supervisor at an investment management firm. Kato learns one of his employees may have violated the Standards. Kato promptly initiates an investigation to determine the extent of the potential wrongdoing and concludes that the employee violated the Standards. Kato then reports the misconduct up the chain of command and warns the employee to cease the activity. While waiting for the outcome of the investigation, Kato takes no further steps to prevent repeated violations. Are Kato's actions consistent with the Standard relating to responsibilities of supervisors?","opts":["Yes","No, because Kato should take steps to ensure the violation is not repeated","No, because Kato should report the violation to the Professional Conduct Program"],"ans":"B","expl":"B is Correct because according to Standard IV(C), Responsibilities of Supervisors, reporting the misconduct up the chain of command and warning the employee to cease the activity are also not enough. Pending the outcome of the investigation, a supervisor should take steps to ensure that the violation will not be repeated, such as placing limits on the employee’s activities or increasing the monitoring of the employee’s activities.","explhtml":"<p>B is Correct because according to Standard IV(C), Responsibilities of Supervisors, reporting the misconduct up the chain of command and warning the employee to cease the activity are also not enough. Pending the outcome of the investigation, a supervisor should take steps to ensure that the violation will not be repeated, such as placing limits on the employee’s activities or increasing the monitoring of the employee’s activities.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Hiroshi Kato, CFA, is a supervisor at an investment management firm. Kato learns one of his employees may have violated the Standards. Kato promptly initiates an investigation to determine the extent of the potential wrongdoing and concludes that the employee violated the Standards. Kato then reports the misconduct up the chain of command and warns the employee to cease the activity. While waiting for the outcome of the investigation, Kato takes no further steps to prevent repeated violations. Are Kato&#x27;s actions consistent with the Standard relating to responsibilities of supervisors?<\/p><\/div>","subj":"ethics"},{"n":43,"q":"Hiroshi Mariana Parra, CFA, is an investment analyst. After consulting industry specialists, Parra believes oil prices will become less volatile over the coming months. Parra's colleague, Jeremy Fallon, constructs a statistical model of oil prices, including extremely positive and negative scenarios. Para understands the model well and relies on it for her analysis. Parra then recommends an options strategy to clients to take advantage of expected lower volatility. Within a month, clients who followed the recommendation suffer large losses due to an unforeseen event. Did Parra's actions violate the Standards?","opts":["No","Yes, by relying on Fallon's model for her analysis","Yes by issuing a recommendation resulting in large losses for her clients"],"ans":"A","expl":"A is Correct because Parra understands the model well, Fallon's analysis includes factors likely to have a substantial influence on the investment value with extremely positive and negative scenarios, and Parra is not required to predict investment outcomes. According to Standard V(A), Diligence and Reasonable Basis, members must understand the statistical significance of the results of the models they recommend and must be able to explain them to clients. Standard V(A) also states that members should ensure that their analyses incorporate a broad range of assumptions sufficient to capture the underlying characteristics of investments. The possible scenarios for analysis should include factors that are likely to have a substantial influence on the investment value and may include extremely positive and negative scenarios. Finally, regarding performance, Standard V(A) requires only that members exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions and have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action.","explhtml":"<p>A is Correct because Parra understands the model well, Fallon&#x27;s analysis includes factors likely to have a substantial influence on the investment value with extremely positive and negative scenarios, and Parra is not required to predict investment outcomes. According to Standard V(A), Diligence and Reasonable Basis, members must understand the statistical significance of the results of the models they recommend and must be able to explain them to clients. Standard V(A) also states that members should ensure that their analyses incorporate a broad range of assumptions sufficient to capture the underlying characteristics of investments. The possible scenarios for analysis should include factors that are likely to have a substantial influence on the investment value and may include extremely positive and negative scenarios. Finally, regarding performance, Standard V(A) requires only that members exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and taking investment actions and have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Hiroshi Mariana Parra, CFA, is an investment analyst. After consulting industry specialists, Parra believes oil prices will become less volatile over the coming months. Parra&#x27;s colleague, Jeremy Fallon, constructs a statistical model of oil prices, including extremely positive and negative scenarios. Para understands the model well and relies on it for her analysis. Parra then recommends an options strategy to clients to take advantage of expected lower volatility. Within a month, clients who followed the recommendation suffer large losses due to an unforeseen event. Did Parra&#x27;s actions violate the Standards?<\/p><\/div>","subj":"ethics"},{"n":44,"q":"Geoff Carlson, CFA, is responsible for selecting external investment advisors for his asset management firm. Carlson designs a manager selection policy for his firm that specifies a standardized set of criteria for evaluating the adequacy of external advisors. The policy specifies that fund allocations to external advisors should be reviewed every two years. Is Carlson's policy consistent with the Standard relating to diligence and reasonable basis?","opts":["Yes","No, because the policy should specify custom criteria for each advisor type","No, because the policy should specify that allocations of funds to advisers be reviewed at least annually"],"ans":"A","expl":"A is Correct because Standard V(A), Diligence and Reasonable Basis, states that members should encourage their firms to consider adopting a standardized set of criteria for evaluating the adequacy of external advisers. The policy should include how often and on what basis the allocation of funds to the adviser will be reviewed. Carlson does this and thus is consistent with the Standards.","explhtml":"<p>A is Correct because Standard V(A), Diligence and Reasonable Basis, states that members should encourage their firms to consider adopting a standardized set of criteria for evaluating the adequacy of external advisers. The policy should include how often and on what basis the allocation of funds to the adviser will be reviewed. Carlson does this and thus is consistent with the Standards.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Geoff Carlson, CFA, is responsible for selecting external investment advisors for his asset management firm. Carlson designs a manager selection policy for his firm that specifies a standardized set of criteria for evaluating the adequacy of external advisors. The policy specifies that fund allocations to external advisors should be reviewed every two years. Is Carlson&#x27;s policy consistent with the Standard relating to diligence and reasonable basis?<\/p><\/div>","subj":"ethics"},{"n":45,"q":"Taro Sato, CFA, an analyst, recently finished his report on Accel Automotive, a small electric car manufacturer operating one factory. For the last three months, Sato has counted the number of vehicles shipped from Accel's factory every Friday. From these observations, he forms an opinion on estimated total shipments for the last quarter. Sato limits the scope of his report by omitting details not relevant to production activity. He concludes in his report: \"Based on the fact the company shipped 50,000 vehicles last quarter, I recommend a strong BUY.\" Did Sato violate the Standard relating to communication with clients and prospective clients?","opts":["No","Yes, because Sato states opinion as fact","Yes, because Sato limits the scope of his report"],"ans":"B","expl":"B is Correct because Sato's statement of Secant's quarterly auto shipments based on once per week observations is a quantitative opinion, not a fact. Opinion must be distinguished from fact in research reports. Standard V(B), Communication with Clients and Prospective Clients, states in the case of complex quantitative analyses, members and candidates must clearly separate fact from statistical conjecture and should identify the known limitations of an analysis. Members and candidates may violate Standard V(B) by failing to identify the limits of statistically developed projections because such omission leaves readers unaware of the limits of the published projections.","explhtml":"<p>B is Correct because Sato&#x27;s statement of Secant&#x27;s quarterly auto shipments based on once per week observations is a quantitative opinion, not a fact. Opinion must be distinguished from fact in research reports. Standard V(B), Communication with Clients and Prospective Clients, states in the case of complex quantitative analyses, members and candidates must clearly separate fact from statistical conjecture and should identify the known limitations of an analysis. Members and candidates may violate Standard V(B) by failing to identify the limits of statistically developed projections because such omission leaves readers unaware of the limits of the published projections.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Taro Sato, CFA, an analyst, recently finished his report on Accel Automotive, a small electric car manufacturer operating one factory. For the last three months, Sato has counted the number of vehicles shipped from Accel&#x27;s factory every Friday. From these observations, he forms an opinion on estimated total shipments for the last quarter. Sato limits the scope of his report by omitting details not relevant to production activity. He concludes in his report: &quot;Based on the fact the company shipped 50,000 vehicles last quarter, I recommend a strong BUY.&quot; Did Sato violate the Standard relating to communication with clients and prospective clients?<\/p><\/div>","subj":"ethics"},{"n":46,"q":"Greg Romo, CFA, an analyst, recently completed a report on Poweron Automotive, a small electric car manufacturer operating one factory. Over the last three months, Romo has counted the number of vehicles shipped from Poweron's factory every Wednesday. From his one day per week observations, he forms an opinion on estimated total shipments for the last quarter. Romo limits the scope of his report by omitting details not relevant to production activity. Romo concludes in his research report: &\"Based on the fact that I observed an average of 830 vehicles shipped every Wednesday last quarter, I recommend a strong BUY.&\" Did Romo violate the Standard relating to communication with clients and prospective clients?","opts":["No","Yes, because Romo states opinion as a fact","Yes, because Romo limits the scope of his report"],"ans":"A","expl":"A is Correct because Romo has not stated opinion as fact, and he is permitted to limit the scope of the report.","explhtml":"<p>A is Correct because Romo has not stated opinion as fact, and he is permitted to limit the scope of the report.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Greg Romo, CFA, an analyst, recently completed a report on Poweron Automotive, a small electric car manufacturer operating one factory. Over the last three months, Romo has counted the number of vehicles shipped from Poweron&#x27;s factory every Wednesday. From his one day per week observations, he forms an opinion on estimated total shipments for the last quarter. Romo limits the scope of his report by omitting details not relevant to production activity. Romo concludes in his research report: &amp;&quot;Based on the fact that I observed an average of 830 vehicles shipped every Wednesday last quarter, I recommend a strong BUY.&amp;&quot; Did Romo violate the Standard relating to communication with clients and prospective clients?<\/p><\/div>","subj":"ethics"},{"n":47,"q":"Jorge Rodrigo, CFA, is a portfolio manager for Ephesus Securities. Rodrigo maintains records that support his decisions to buy or sell a security. He also maintains records on reviews undertaken which do not lead to a change in his investment positions. Rodrigo maintains all records only in hard copy, for a period of five years. With regard to record retention, Ephesus has no relevant policy and there is no applicable law. Are Rodrigo's actions consistent with the Standard relating to record retention?","opts":["Yes","No, because Rodrigo must also maintain records in electronic form","No, because Rodrigo should maintain records for at least seven years"],"ans":"C","expl":"C is Correct because, according to Standard V(C), Record Retention, in the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years.","explhtml":"<p>C is Correct because, according to Standard V(C), Record Retention, in the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Jorge Rodrigo, CFA, is a portfolio manager for Ephesus Securities. Rodrigo maintains records that support his decisions to buy or sell a security. He also maintains records on reviews undertaken which do not lead to a change in his investment positions. Rodrigo maintains all records only in hard copy, for a period of five years. With regard to record retention, Ephesus has no relevant policy and there is no applicable law. Are Rodrigo&#x27;s actions consistent with the Standard relating to record retention?<\/p><\/div>","subj":"ethics"},{"n":48,"q":"Felix Johnson, CFA, is a portfolio manager for Claros Securities. Johnson maintains all records only in hard copy for a period of three years. He maintains all records that support decisions to buy or sell securities. He also maintains records on reviews undertaken which do not lead to a change in investment positions. Claros Securities has no policy regarding record retention. In contrast, regulatory guidance states that firms must maintain records for at least three years. Are Johnson's actions consistent with the Standard relating to record retention?","opts":["Yes","No, because Johnson must also maintain records in electronic form","No, because Johnson should maintain records for at least seven years"],"ans":"A","expl":"A is Correct because Johnson's actions fulfill the requirements of Standard V(C), Record Retention, which states that in the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years. Since Claros' regulator stipulates a record retention period of three years, this is the applicable requirement. Johnson maintains records for three years and thus satisfies the requirement. The Standard also states that records may be maintained either in hard copy or electronic form. Thus, records in only hard copy are acceptable.","explhtml":"<p>A is Correct because Johnson&#x27;s actions fulfill the requirements of Standard V(C), Record Retention, which states that in the absence of regulatory guidance or firm policies, CFA Institute recommends maintaining records for at least seven years. Since Claros&#x27; regulator stipulates a record retention period of three years, this is the applicable requirement. Johnson maintains records for three years and thus satisfies the requirement. The Standard also states that records may be maintained either in hard copy or electronic form. Thus, records in only hard copy are acceptable.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Felix Johnson, CFA, is a portfolio manager for Claros Securities. Johnson maintains all records only in hard copy for a period of three years. He maintains all records that support decisions to buy or sell securities. He also maintains records on reviews undertaken which do not lead to a change in investment positions. Claros Securities has no policy regarding record retention. In contrast, regulatory guidance states that firms must maintain records for at least three years. Are Johnson&#x27;s actions consistent with the Standard relating to record retention?<\/p><\/div>","subj":"ethics"},{"n":49,"q":"Christina Tam, CFA, and Peter Wolf, CFA, are employed at Hamilton Investments. Tam develops an equity research model and uses it to issue a report on Iron Mining Corp. She also begins a report on Copper Core Inc. Shortly thereafter, Tam leaves the firm and Wolf uses Tam's model to issue a report on Zinc Drilling Ltd. without providing attribution to Tam. Wolf also finishes Tam's work on Copper Core and issues a report solely under his own name without providing attribution to Tam. Wolf later reissues Tam's report on Iron Mining, again solely under his own name. Which of Wolf's actions violates the Standards?","opts":["Using Tam's model without providing attribution to her","Reissuing Tam's report on Iron Mining solely under his own name","Finishing Tam's work on Copper Core and issuing a report solely under his own name without providing attribution to Tam"],"ans":"B","expl":"B is Correct because, according to Standard I(C), Misrepresentation, in some situations members may use research conducted by others within the same firm without committing a violation. The most common example relates to the situation in which one of the original analysts is no longer with the firm. Research developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member has left the organization. The firm may issue future reports without providing attribution to the prior analysts. A member or candidate cannot, however, reissue a previously released report solely under his or her name.\" Since a report on Iron Mining was previously released, Wolf may not reissue this report solely under his own name.","explhtml":"<p>B is Correct because, according to Standard I(C), Misrepresentation, in some situations members may use research conducted by others within the same firm without committing a violation. The most common example relates to the situation in which one of the original analysts is no longer with the firm. Research developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member has left the organization. The firm may issue future reports without providing attribution to the prior analysts. A member or candidate cannot, however, reissue a previously released report solely under his or her name.&quot; Since a report on Iron Mining was previously released, Wolf may not reissue this report solely under his own name.<\/p>","qhtml":"<div class=\"pp-topic\">Code of Ethics and Standards of Professional Conduct<\/div><div class=\"qtext\"><p>Christina Tam, CFA, and Peter Wolf, CFA, are employed at Hamilton Investments. Tam develops an equity research model and uses it to issue a report on Iron Mining Corp. She also begins a report on Copper Core Inc. Shortly thereafter, Tam leaves the firm and Wolf uses Tam&#x27;s model to issue a report on Zinc Drilling Ltd. without providing attribution to Tam. Wolf also finishes Tam&#x27;s work on Copper Core and issues a report solely under his own name without providing attribution to Tam. Wolf later reissues Tam&#x27;s report on Iron Mining, again solely under his own name. Which of Wolf&#x27;s actions violates the Standards?<\/p><\/div>","subj":"ethics"},{"n":50,"q":"Mei Li, CFA, is excited to receive her CFA charter and updates her professional social media profile to add her achievement. Li violates the Standards if she posts which of the following statements on her social media profile?","opts":["\"The CFA Program enhanced my portfolio management skills\"","\"CFA charterholders achieve better investment performance results\"","\"I passed all three CFA Program examinations in three consecutive years\""],"ans":"B","expl":"B is Correct because this is not a proper reference and violates Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program. According to Standard VII(B), statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard.","explhtml":"<p>B is Correct because this is not a proper reference and violates Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program. According to Standard VII(B), statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard.<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Mei Li, CFA, is excited to receive her CFA charter and updates her professional social media profile to add her achievement. Li violates the Standards if she posts which of the following statements on her social media profile?<\/p><\/div>","subj":"ethics"},{"n":51,"q":"Vivienne Mercier posts the following three statements on social media immediately after sitting for the CFA exam: Statement 1: \"I only trade fixed income, so most of the other CFA Program content is not relevant for me.\" Statement 2: \"I was so disappointed they did not test the binomial option valuation model on the exam because I studied this difficult topic extensively.\" Statement 3: \"I should have spent less time memorizing, because I had a hard time solving the quantitative questions.\" Which of Mercier's statements violates the Standard relating to conduct as participants in CFA Institute Programs?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"B is Correct because Statement 2 violates Standard VII(A), Conduct as Participants in CFA Institute Programs, by disclosing content-specific information and subject matter. According to Standard VII (A), members and candidates must not engage in any conduct that compromises the reputation or integrity of CFA Institute or the CFA designation or the integrity, validity, or security of CFA Institute programs. Specifically, when expressing a personal opinion, a candidate is prohibited from disclosing content-specific information, including any actual exam question and the information as to subject matter covered or not covered in the exam.","explhtml":"<p>B is Correct because Statement 2 violates Standard VII(A), Conduct as Participants in CFA Institute Programs, by disclosing content-specific information and subject matter. According to Standard VII (A), members and candidates must not engage in any conduct that compromises the reputation or integrity of CFA Institute or the CFA designation or the integrity, validity, or security of CFA Institute programs. Specifically, when expressing a personal opinion, a candidate is prohibited from disclosing content-specific information, including any actual exam question and the information as to subject matter covered or not covered in the exam.<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Vivienne Mercier posts the following three statements on social media immediately after sitting for the CFA exam: Statement 1: &quot;I only trade fixed income, so most of the other CFA Program content is not relevant for me.&quot; Statement 2: &quot;I was so disappointed they did not test the binomial option valuation model on the exam because I studied this difficult topic extensively.&quot; Statement 3: &quot;I should have spent less time memorizing, because I had a hard time solving the quantitative questions.&quot; Which of Mercier&#x27;s statements violates the Standard relating to conduct as participants in CFA Institute Programs?<\/p><\/div>","subj":"ethics"},{"n":52,"q":"Derek Buckley, CFA, is a portfolio manager. When allocating oversubscribed IPO shares, Buckley initially allocates shares to his firm’s proprietary account based on his loyalty to his employer. He then allocates shares to his father’s standard fee-paying account at the same time as other clients’ fee-paying accounts. Do Buckley's actions violate the Standard related to priority of transactions?","opts":["No","Yes, by initially allocating IPO shares to the firm’s proprietary account","Yes, by allocating shares to his father’s account at the same time as other clients’ accounts"],"ans":"B","expl":"B is Correct because Standard VI(B) states that, investment transactions for clients and employers must have priority over investment transactions in which a member or candidate is the beneficial owner. Also, client transactions must take precedence over transactions made on behalf of the member’s or candidate’s firm or personal transactions. Buckley thus violates Standard VI (B) by initially allocating to the firm’s proprietary account before allocating to client accounts.","explhtml":"<p>B is Correct because Standard VI(B) states that, investment transactions for clients and employers must have priority over investment transactions in which a member or candidate is the beneficial owner. Also, client transactions must take precedence over transactions made on behalf of the member’s or candidate’s firm or personal transactions. Buckley thus violates Standard VI (B) by initially allocating to the firm’s proprietary account before allocating to client accounts.<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Derek Buckley, CFA, is a portfolio manager. When allocating oversubscribed IPO shares, Buckley initially allocates shares to his firm’s proprietary account based on his loyalty to his employer. He then allocates shares to his father’s standard fee-paying account at the same time as other clients’ fee-paying accounts. Do Buckley&#x27;s actions violate the Standard related to priority of transactions?<\/p><\/div>","subj":"ethics"},{"n":53,"q":"Jerry Mack, CFA, an investment advisor, leaves his employer (Firm 1) to start at a competing firm (Firm 2). Mack does not have a noncompete agreement with Firm 1. Before leaving Firm 1, he calls his long-term client to describe Firm 2's product offerings so he can help the client reach his financial goals. After joining Firm 2, he opens a new social media account. From memory, he finds all his former clients on the social media platform and solicits business from them. Did Mack's actions violate the Standard relating to loyalty?","opts":["No","Yes, by calling his long-term client","Yes, by soliciting business from former clients using the new social media account"],"ans":"B","expl":"B is Correct because Mack's call to his long-term client before leaving Firm 1 violated Standard VI(A), Loyalty. This Standard prohibits solicitation before leaving the former employer. A member or candidate who is contemplating seeking other employment must not contact existing clients or potential clients prior to leaving his or her employer for purposes of soliciting their business for the new employer. Therefore, Mack violated Standard VI(A) by calling his long- term client.","explhtml":"<p>B is Correct because Mack&#x27;s call to his long-term client before leaving Firm 1 violated Standard VI(A), Loyalty. This Standard prohibits solicitation before leaving the former employer. A member or candidate who is contemplating seeking other employment must not contact existing clients or potential clients prior to leaving his or her employer for purposes of soliciting their business for the new employer. Therefore, Mack violated Standard VI(A) by calling his long- term client.<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Jerry Mack, CFA, an investment advisor, leaves his employer (Firm 1) to start at a competing firm (Firm 2). Mack does not have a noncompete agreement with Firm 1. Before leaving Firm 1, he calls his long-term client to describe Firm 2&#x27;s product offerings so he can help the client reach his financial goals. After joining Firm 2, he opens a new social media account. From memory, he finds all his former clients on the social media platform and solicits business from them. Did Mack&#x27;s actions violate the Standard relating to loyalty?<\/p><\/div>","subj":"ethics"},{"n":54,"q":"Karen McQueen, CFA, leaves her former employer without a noncompete agreement. She then starts a new job at a competitor firm, where she creates a new LinkedIn account. She recalls her former clients' names from memory and finds several of them on LinkedIn. She sends invitations on LinkedIn to connect to those clients to solicit business. Did McQueen's actions violate the Standards?","opts":["No","Yes, by soliciting former clients using LinkedIn","Yes, by failing to notify her former employer that she contacts former clients"],"ans":"A","expl":"A is Correct because McQueen did not have a noncompete agreement and solicited former clients only after joining the new firm. Standard IV(A), Loyalty, states that, in matters related to their employment, members and candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Also, the standard does not prohibit former employees from contacting clients of their previous firm as long as the contact information does not come from the records of the former employer or violate an applicable “noncompete agreement.” Based on her actions, McQueen did not violate Standard IV(A), Loyalty.","explhtml":"<p>A is Correct because McQueen did not have a noncompete agreement and solicited former clients only after joining the new firm. Standard IV(A), Loyalty, states that, in matters related to their employment, members and candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. Also, the standard does not prohibit former employees from contacting clients of their previous firm as long as the contact information does not come from the records of the former employer or violate an applicable “noncompete agreement.” Based on her actions, McQueen did not violate Standard IV(A), Loyalty.<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Karen McQueen, CFA, leaves her former employer without a noncompete agreement. She then starts a new job at a competitor firm, where she creates a new LinkedIn account. She recalls her former clients&#x27; names from memory and finds several of them on LinkedIn. She sends invitations on LinkedIn to connect to those clients to solicit business. Did McQueen&#x27;s actions violate the Standards?<\/p><\/div>","subj":"ethics"},{"n":55,"q":"Grant Bradley, CFA, is an investment advisor for private clients in a country without applicable laws on information confidentiality. Bradley discovers that Client 1 engages in tax evasion and that Client 2 engages in money laundering activities. After consulting his firm’s legal counsel, he reports Client 1 to the tax authorities. Afterwards, Bradley reports Client 2 to the financial regulator. His reports include confidential client information relevant to the illegal activities. Did Bradley's actions violate the Standard relating to preservation of confidentiality?","opts":["No","Yes, by reporting Client 1 to the tax authorities","Yes, by reporting Client 2 to the financial regulator"],"ans":"A","expl":"A is Correct because reporting tax evasion and money laundering activities does not violate Standard III(E), Preservation of Confidentiality, as both are illegal activities on the part of the client. According to Standard III(E), members and candidates must keep information about current, former, and prospective clients confidential unless: 1. The information concerns illegal activities on the part of the client; 2. Disclosure is required by law; or 3. The client or prospective client permits disclosure of the information.","explhtml":"<p>A is Correct because reporting tax evasion and money laundering activities does not violate Standard III(E), Preservation of Confidentiality, as both are illegal activities on the part of the client. According to Standard III(E), members and candidates must keep information about current, former, and prospective clients confidential unless: 1. The information concerns illegal activities on the part of the client; 2. Disclosure is required by law; or 3. The client or prospective client permits disclosure of the information.<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Grant Bradley, CFA, is an investment advisor for private clients in a country without applicable laws on information confidentiality. Bradley discovers that Client 1 engages in tax evasion and that Client 2 engages in money laundering activities. After consulting his firm’s legal counsel, he reports Client 1 to the tax authorities. Afterwards, Bradley reports Client 2 to the financial regulator. His reports include confidential client information relevant to the illegal activities. Did Bradley&#x27;s actions violate the Standard relating to preservation of confidentiality?<\/p><\/div>","subj":"ethics"},{"n":56,"q":"Flora Valentina, CFA, advises private clients at Blue Sky Wealth (BSW). She also volunteers for Care-4-Pups (C4P), a charity that rescues abandoned dogs. One of Valentina's clients, Alan Mitchell, likes to support animal charities. Valentina invites Mitchell as her guest to the C4P fundraising dinner with the intention to ask Mitchell for a donation to the charity. She also adds Mitchell’s email address, which is located in BSW's records, to the charity's donor database. However, she forget to tell Mitchell about adding him to the donor database. Did Valentina's actions violate the Standard relating to preservation of confidentiality?","opts":["No","Yes, by inviting Mitchell to the fundraising dinner","Yes, by adding Mitchell’s email address to the to the donor database"],"ans":"C","expl":"C is Correct because Valentina adding Mitchell’s email address to the donor database violates Standard III(E), Preservation of Confidentiality. According to this Standard, members and candidates must keep information about current, former, and prospective clients confidential unless: 1. The information concerns illegal activities on the part of the client; 2. Disclosure is required by law; or 3. The client or prospective client permits disclosure of the information. None of these three conditions occurred in this case, so Valentina adding Mitchell’s email address violated Standard III(E).","explhtml":"<p>C is Correct because Valentina adding Mitchell’s email address to the donor database violates Standard III(E), Preservation of Confidentiality. According to this Standard, members and candidates must keep information about current, former, and prospective clients confidential unless: 1. The information concerns illegal activities on the part of the client; 2. Disclosure is required by law; or 3. The client or prospective client permits disclosure of the information. None of these three conditions occurred in this case, so Valentina adding Mitchell’s email address violated Standard III(E).<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Flora Valentina, CFA, advises private clients at Blue Sky Wealth (BSW). She also volunteers for Care-4-Pups (C4P), a charity that rescues abandoned dogs. One of Valentina&#x27;s clients, Alan Mitchell, likes to support animal charities. Valentina invites Mitchell as her guest to the C4P fundraising dinner with the intention to ask Mitchell for a donation to the charity. She also adds Mitchell’s email address, which is located in BSW&#x27;s records, to the charity&#x27;s donor database. However, she forget to tell Mitchell about adding him to the donor database. Did Valentina&#x27;s actions violate the Standard relating to preservation of confidentiality?<\/p><\/div>","subj":"ethics"},{"n":57,"q":"Adam Dempsey, CFA, manages a fund-of-funds that invests in three asset classes. Since the fund’s inception three years ago, he has used the same model to determine his asset allocation. For the fund's marketing brochure, he applies his model retroactively for the seven years prior to the fund's inception to produce simulated performance results over a 10-year period. In the brochure, Dempsey does not indicate that the fund's 10-year results are partially simulated because he consistently uses the same model and methodology. Did Dempsey's actions violate the Standard regarding performance presentation?","opts":["No","Yes, because he uses simulated performance results in the brochure","Yes, because he does not indicate that performance results are partially simulated"],"ans":"C","expl":"C is Correct because Dempsey's failure to indicate that the results are partially simulated is a violation of Standard III(D), Performance Presentation. According to Standard III(D), when communicating investment performance information, members and candidates must make reasonable efforts to ensure that it is fair, accurate, and complete. Furthermore, use of simulated results should be accompanied by full disclosure as to the source of the performance data, including the fact that the results were the result of applying the model retroactively to that time period.","explhtml":"<p>C is Correct because Dempsey&#x27;s failure to indicate that the results are partially simulated is a violation of Standard III(D), Performance Presentation. According to Standard III(D), when communicating investment performance information, members and candidates must make reasonable efforts to ensure that it is fair, accurate, and complete. Furthermore, use of simulated results should be accompanied by full disclosure as to the source of the performance data, including the fact that the results were the result of applying the model retroactively to that time period.<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Adam Dempsey, CFA, manages a fund-of-funds that invests in three asset classes. Since the fund’s inception three years ago, he has used the same model to determine his asset allocation. For the fund&#x27;s marketing brochure, he applies his model retroactively for the seven years prior to the fund&#x27;s inception to produce simulated performance results over a 10-year period. In the brochure, Dempsey does not indicate that the fund&#x27;s 10-year results are partially simulated because he consistently uses the same model and methodology. Did Dempsey&#x27;s actions violate the Standard regarding performance presentation?<\/p><\/div>","subj":"ethics"},{"n":58,"q":"Larry Petrov, CFA, manages a mutual fund with a mandate to invest in the Canadian large-cap financial services sector. The fund's mandate also requires the fund to be fully invested in long positions only. His analysis indicates Canadian bank stocks are generally overvalued. Due to the lack of other suitable stocks within his investment universe, he buys the Canadian bank stock that he believes to be the least overvalued. After thorough analysis, he also buys a Japanese bank stock for the fund due to its attractive dividend yield and expected currency appreciation. Did Petrov's actions violate the Standard relating to suitability?","opts":["No","Yes, by buying the Japanese bank stock","Yes, by buying the Canadian bank stock"],"ans":"B","expl":"B is Correct because buying the Japanese bank stock goes against the mutual fund's mandate and thus is a violation Standard III(C), Suitability. According to the Standard, when members and candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must make only investment recommendations or take only investment actions that are consistent with the stated objectives and constraints of the portfolio. Buying the Japanese bank stock is inconsistent with the mandate of the Canadian large-cap financial services mutual fund. Therefore, Petrov violated Standard III(C).","explhtml":"<p>B is Correct because buying the Japanese bank stock goes against the mutual fund&#x27;s mandate and thus is a violation Standard III(C), Suitability. According to the Standard, when members and candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must make only investment recommendations or take only investment actions that are consistent with the stated objectives and constraints of the portfolio. Buying the Japanese bank stock is inconsistent with the mandate of the Canadian large-cap financial services mutual fund. Therefore, Petrov violated Standard III(C).<\/p>","qhtml":"<div class=\"pp-topic\">Application of the Code and Standards: Level II<\/div><div class=\"qtext\"><p>Larry Petrov, CFA, manages a mutual fund with a mandate to invest in the Canadian large-cap financial services sector. The fund&#x27;s mandate also requires the fund to be fully invested in long positions only. His analysis indicates Canadian bank stocks are generally overvalued. Due to the lack
