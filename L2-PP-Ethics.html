<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n":1,"q":"Peter Jonas, CFA, works as an analyst on an investment team. Jonas accepts an assignment to collaborate with a colleague to publish an investment recommendation for distribution to clients. During this collaboration, Jonas observes an unethical activity by his colleague. Jonas contacts his supervisor to report the matter but the supervisor says she is unable to investigate due to a lack of firm resources. To comply with the Standards, Jonas must:","opts":["disassociate from the activity.","notify CFA Institute of his colleague's activity.","continue to work with the colleague to avoid delays in distributing the recommendation to clients."],"ans":"A","expl":"A is Correct because Standard I(A), Knowledge of the Law, states if a member or candidate has reasonable grounds to believe that imminent or ongoing client or employer activities are illegal or unethical, the member or candidate must dissociate, or separate, from the activity.","explhtml":"<p>A is Correct because Standard I(A), Knowledge of the Law, states if a member or candidate has reasonable grounds to believe that imminent or ongoing client or employer activities are illegal or unethical, the member or candidate must dissociate, or separate, from the activity.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Peter Jonas, CFA, works as an analyst on an investment team. Jonas accepts an assignment to collaborate with a colleague to publish an investment recommendation for distribution to clients. During this collaboration, Jonas observes an unethical activity by his colleague. Jonas contacts his supervisor to report the matter but the supervisor says she is unable to investigate due to a lack of firm resources. To comply with the Standards, Jonas must:<\/p><\/div>","subj":"ethics"},{"n":2,"q":"Lisa Fourier, CFA, works at an investment firm where she is responsible for hiring outside fund managers. During an overseas visit at the office of a potential fund manager, she is offered expensive tickets to a sporting event as a gift from the fund manager. Fourier knows that offering and accepting gifts is an accepted business practice in the fund manager's country. As required by her firm’s policy, she obtains written approval from all parties involved after accepting the tickets. Are Fourier's actions consistent with the Standards?","opts":["Yes","No, because she accepts a gift from a potential manager","No, because she fails to obtain approval before accepting the tickets"],"ans":"B","expl":"B is Correct because according to Standard I (B), Independence and Objectivity, members and candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity. Further, when serving in a hiring capacity, members and candidates should not solicit gifts, contributions, or other compensation that may affect their independence and objectivity, and should refuse gifts, donations, and other offered compensation that may be perceived to influence their decision-making process. Therefore, Fourier's acceptance of the tickets is not consistent with the Standards because the expensive tickets could reasonably be expected to compromise her independence and objectivity when selecting managers.","explhtml":"<p>B is Correct because according to Standard I (B), Independence and Objectivity, members and candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another’s independence and objectivity. Further, when serving in a hiring capacity, members and candidates should not solicit gifts, contributions, or other compensation that may affect their independence and objectivity, and should refuse gifts, donations, and other offered compensation that may be perceived to influence their decision-making process. Therefore, Fourier&#x27;s acceptance of the tickets is not consistent with the Standards because the expensive tickets could reasonably be expected to compromise her independence and objectivity when selecting managers.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Lisa Fourier, CFA, works at an investment firm where she is responsible for hiring outside fund managers. During an overseas visit at the office of a potential fund manager, she is offered expensive tickets to a sporting event as a gift from the fund manager. Fourier knows that offering and accepting gifts is an accepted business practice in the fund manager&#x27;s country. As required by her firm’s policy, she obtains written approval from all parties involved after accepting the tickets. Are Fourier&#x27;s actions consistent with the Standards?<\/p><\/div>","subj":"ethics"},{"n":3,"q":"Johanna Mentu, CFA, is an analyst at an investment firm. She prepares a research report for clients and adds the forecast of a central bank economist, as well as the latest statistics from a recognized statistical reporting service, to her report. Mentu also adds a summary of the findings of a third-party newsletter. In her final report sent to clients, Mentu only acknowledges the economist as a source for her report. Did Mentu violate the Standard relating to misrepresentation?","opts":["No","Yes, by failing to acknowledge the third-party newsletter as a source in her report","Yes, by failing to acknowledge the recognized statistical reporting service as a source in her report"],"ans":"B","expl":"B is Correct because Standard I(C), Misrepresentation, states that a violation of this standard is the preparation of research reports based on multiple sources of information without acknowledging the sources. Further, the recommended procedures clarify that to avoid plagiarism in preparing research reports or conclusions of analysis, members and candidates should attribute to their sources any paraphrases or summaries of material prepared by others. Therefore, Mentu must acknowledge the third-party newsletter in the summary of her findings in the report.","explhtml":"<p>B is Correct because Standard I(C), Misrepresentation, states that a violation of this standard is the preparation of research reports based on multiple sources of information without acknowledging the sources. Further, the recommended procedures clarify that to avoid plagiarism in preparing research reports or conclusions of analysis, members and candidates should attribute to their sources any paraphrases or summaries of material prepared by others. Therefore, Mentu must acknowledge the third-party newsletter in the summary of her findings in the report.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Johanna Mentu, CFA, is an analyst at an investment firm. She prepares a research report for clients and adds the forecast of a central bank economist, as well as the latest statistics from a recognized statistical reporting service, to her report. Mentu also adds a summary of the findings of a third-party newsletter. In her final report sent to clients, Mentu only acknowledges the economist as a source for her report. Did Mentu violate the Standard relating to misrepresentation?<\/p><\/div>","subj":"ethics"},{"n":4,"q":"Margaret Belle, CFA, owns an investment firm. She is found guilty of deceitful business conduct, the circumstances of which lead directly to her personal bankruptcy. Belle is also an activist for climate action. On one particular weekend, Belle attends a public, nonviolent protest as part of a permitted demonstration in her country. After the protest she is arrested by the police for trespassing on a company's property. Belle has violated the Standard relating to misconduct by:","opts":["attending a public protest.","filing for personal bankruptcy.","trespassing on the property of a company."],"ans":"B","expl":"B is Correct because because according to Standard I (D), Misconduct, filing for personal bankruptcy does not always violate the Standards. However, if the circumstances of the bankruptcy involve fraudulent or deceitful business conduct, the bankruptcy may be a violation of this standard. In this case, Belle's bankruptcy circumstances involve deceitful business conduct which represents a violation of this Standard.","explhtml":"<p>B is Correct because because according to Standard I (D), Misconduct, filing for personal bankruptcy does not always violate the Standards. However, if the circumstances of the bankruptcy involve fraudulent or deceitful business conduct, the bankruptcy may be a violation of this standard. In this case, Belle&#x27;s bankruptcy circumstances involve deceitful business conduct which represents a violation of this Standard.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Margaret Belle, CFA, owns an investment firm. She is found guilty of deceitful business conduct, the circumstances of which lead directly to her personal bankruptcy. Belle is also an activist for climate action. On one particular weekend, Belle attends a public, nonviolent protest as part of a permitted demonstration in her country. After the protest she is arrested by the police for trespassing on a company&#x27;s property. Belle has violated the Standard relating to misconduct by:<\/p><\/div>","subj":"ethics"},{"n":5,"q":"Petra Maybolk, CFA, works for a large investment firm where she oversees a team of market makers. Maybolk's firm has just taken a small issuer public and is a market maker in the issuer's stock. After receiving material nonpublic information about the small issuer, Maybolk instructs her subordinates to continue market-making activities for the small issuer and to take only the contra side of unsolicited customer trades in the stock. Did Maybolk's actions violate the Standards?","opts":["No","Yes, because Maybolk instructs her subordinates to continue market-making activities for the small issuer","Yes, because Maybolk instructs her firm's market maker to only take the contra side of unsolicited customer trades in the small issuer's stock"],"ans":"A","expl":"A is Correct because according to Standard II(A), Material Nonpublic Information, firms that continue market-making activity while in the possession of material nonpublic information should, however, instruct their market makers to remain passive with respect to the market—that is, to take only the contra side of unsolicited customer trades. Otherwise, and for the case of a firm that has taken a small issuer public with the understanding that the firm will continue to be a market maker in the stock, a withdrawal by the firm from market- making activities would be a clear tip to outsiders.","explhtml":"<p>A is Correct because according to Standard II(A), Material Nonpublic Information, firms that continue market-making activity while in the possession of material nonpublic information should, however, instruct their market makers to remain passive with respect to the market—that is, to take only the contra side of unsolicited customer trades. Otherwise, and for the case of a firm that has taken a small issuer public with the understanding that the firm will continue to be a market maker in the stock, a withdrawal by the firm from market- making activities would be a clear tip to outsiders.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Petra Maybolk, CFA, works for a large investment firm where she oversees a team of market makers. Maybolk&#x27;s firm has just taken a small issuer public and is a market maker in the issuer&#x27;s stock. After receiving material nonpublic information about the small issuer, Maybolk instructs her subordinates to continue market-making activities for the small issuer and to take only the contra side of unsolicited customer trades in the stock. Did Maybolk&#x27;s actions violate the Standards?<\/p><\/div>","subj":"ethics"},{"n":6,"q":"Julia Anderson, CFA, a trader, notices a decline in liquidity of Stock 1. She starts buying and selling Stock 1 to incentivize market activity in the stock. Anderson also notices that Stock 2 trades at different prices in two different exchanges, and starts buying and selling Stock 2 to exploit the price difference. Anderson has violated the Standard(s) by trading:","opts":["Stock 1 only.","Stock 2 only.","both Stock 1 and Stock 2."],"ans":"A","expl":"A is Correct because according to Standard II (B), Market Manipulation, transaction-based manipulation involves transactions that artificially affect prices or volume to give the impression of activity or price movement in a financial instrument. Therefore, trading Stock 1 violates this Standard. Legitimately exploiting price differences in Stock 2 is not a violation of this Standard.","explhtml":"<p>A is Correct because according to Standard II (B), Market Manipulation, transaction-based manipulation involves transactions that artificially affect prices or volume to give the impression of activity or price movement in a financial instrument. Therefore, trading Stock 1 violates this Standard. Legitimately exploiting price differences in Stock 2 is not a violation of this Standard.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Julia Anderson, CFA, a trader, notices a decline in liquidity of Stock 1. She starts buying and selling Stock 1 to incentivize market activity in the stock. Anderson also notices that Stock 2 trades at different prices in two different exchanges, and starts buying and selling Stock 2 to exploit the price difference. Anderson has violated the Standard(s) by trading:<\/p><\/div>","subj":"ethics"},{"n":7,"q":"John Keen, CFA, concludes through his analysis that Stock 1 is significantly undervalued and buys a large amount of the stock. As a result, Stock 1's price increases significantly. A few days later, Keen sells Stock 1 at a profit. One week later, Keen notices that Stock 2 is trading at different prices in two different exchanges. Keen buys and sells Stock 2 to exploit the difference in prices and makes a profit. Has Keen violated the Standard relating to market manipulation?","opts":["No","Yes, by trading Stock 1","Yes, by trading Stock 2"],"ans":"A","expl":"A is Correct because Standard II (B), Market Manipulation, is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Keen used his analysis in trading Stock 1, and an arbitrage opportunity in Stock 2, thus not violating this Standard.","explhtml":"<p>A is Correct because Standard II (B), Market Manipulation, is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Keen used his analysis in trading Stock 1, and an arbitrage opportunity in Stock 2, thus not violating this Standard.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>John Keen, CFA, concludes through his analysis that Stock 1 is significantly undervalued and buys a large amount of the stock. As a result, Stock 1&#x27;s price increases significantly. A few days later, Keen sells Stock 1 at a profit. One week later, Keen notices that Stock 2 is trading at different prices in two different exchanges. Keen buys and sells Stock 2 to exploit the difference in prices and makes a profit. Has Keen violated the Standard relating to market manipulation?<\/p><\/div>","subj":"ethics"},{"n":8,"q":"The president of a university hires Rose Jay, CFA, to manage the employee pension plan. Jay owes her duty of loyalty to the:","opts":["university.","beneficiaries of the fund.","president of the university."],"ans":"B","expl":"B is Correct because according to Standard III(A): Loyalty, Prudence, and Care, when the manager is responsible for the portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but, rather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries.","explhtml":"<p>B is Correct because according to Standard III(A): Loyalty, Prudence, and Care, when the manager is responsible for the portfolios of pension plans or trusts, however, the client is not the person or entity who hires the manager but, rather, the beneficiaries of the plan or trust. The duty of loyalty is owed to the ultimate beneficiaries.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>The president of a university hires Rose Jay, CFA, to manage the employee pension plan. Jay owes her duty of loyalty to the:<\/p><\/div>","subj":"ethics"},{"n":9,"q":"Becky Wilkins, CFA, an analyst, prepares a buy recommendation for a stock. The recommendation is also suitable for her sister, a standard fee-paying client. To avoid a conflict of interest, Wilkins sends the recommendation to her sister one day after sending it to all of her other suitable clients. Wilkins then calls all of her premium fee-paying clients to provide further details about the recommendation. Has Becky violated the Standard relating to fair dealing?","opts":["No","Yes, by providing further details about the recommendation to her premium fee-paying clients","Yes, by sending the recommendation to her sister one day after sending it to her other clients"],"ans":"C","expl":"C is Correct because according to Standard III(B), Fair Dealing, members and candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Her sister is a standard fee- paying client also, so she should treat her equitably with other clients.","explhtml":"<p>C is Correct because according to Standard III(B), Fair Dealing, members and candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Her sister is a standard fee- paying client also, so she should treat her equitably with other clients.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Becky Wilkins, CFA, an analyst, prepares a buy recommendation for a stock. The recommendation is also suitable for her sister, a standard fee-paying client. To avoid a conflict of interest, Wilkins sends the recommendation to her sister one day after sending it to all of her other suitable clients. Wilkins then calls all of her premium fee-paying clients to provide further details about the recommendation. Has Becky violated the Standard relating to fair dealing?<\/p><\/div>","subj":"ethics"},{"n":10,"q":"Thomas Li, CFA, was recently hired to manage an equity fund. Li reads the following company policies regarding the dissemination of investment recommendations: •Policy 1: An analyst should limit the number of people who are privy to the fact that a recommendation is going to be disseminated. •Policy 2: An analyst should limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated. To be consistent with the the Standard relating to fair dealing, Li should follow:","opts":["Policy 1 only.","Policy 2 only.","both Policy 1 and Policy 2."],"ans":"C","expl":"C is Correct because according to the recommended procedures for Standard III(B), Fair Dealing, members should limit the number of people involved and make reasonable efforts to limit the number of people who are privy to the fact that a recommendation is going to be disseminated. Additionally, members and candidates should make reasonable efforts to limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated.","explhtml":"<p>C is Correct because according to the recommended procedures for Standard III(B), Fair Dealing, members should limit the number of people involved and make reasonable efforts to limit the number of people who are privy to the fact that a recommendation is going to be disseminated. Additionally, members and candidates should make reasonable efforts to limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Thomas Li, CFA, was recently hired to manage an equity fund. Li reads the following company policies regarding the dissemination of investment recommendations: •Policy 1: An analyst should limit the number of people who are privy to the fact that a recommendation is going to be disseminated. •Policy 2: An analyst should limit the amount of time that elapses between the decision to make an investment recommendation and the time the actual recommendation is disseminated. To be consistent with the the Standard relating to fair dealing, Li should follow:<\/p><\/div>","subj":"ethics"},{"n":11,"q":"Jo Atkins, CFA, a portfolio manager, is meeting with a new client, Jay Sanderson. In preparing Sanderson's IPS, Sanderson refuses to fully disclose his holdings to Atkins. As a result, Atkins completes Sanderson's suitability analysis based on limited information. Sanderson has a high tolerance for risk. Having done careful research, Atkins recommends a portfolio of information technology stocks. One of the technology stocks is significantly affected by unexpected changes in market sentiment, which results in a large loss for Sanderson in the first year. Has Atkins violated the Standard(s)?","opts":["No","Yes, by failing to prevent a large loss for Sanderson","Yes, by completing Sanderson's suitability analysis based on limited information"],"ans":"A","expl":"A is Correct because according to Standard III(C), Suitability, if clients withhold information about their financial portfolios, the suitability analysis conducted by members and candidates cannot be expected to be complete; it must be based on the information provided. In addition, an appropriate suitability determination will not prevent some investments or investment actions from losing value. Finally, according to Standard III(A), Loyalty, Prudence, and Care, members and candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. In this case, despite having limited client information, Atkins performed appropriate suitability determination about Sanderson's risk profile and careful research into information technology stocks that were appropriate for this risk profile. The loss on Sanderson's investments is thus not a violation of the Standards.","explhtml":"<p>A is Correct because according to Standard III(C), Suitability, if clients withhold information about their financial portfolios, the suitability analysis conducted by members and candidates cannot be expected to be complete; it must be based on the information provided. In addition, an appropriate suitability determination will not prevent some investments or investment actions from losing value. Finally, according to Standard III(A), Loyalty, Prudence, and Care, members and candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. In this case, despite having limited client information, Atkins performed appropriate suitability determination about Sanderson&#x27;s risk profile and careful research into information technology stocks that were appropriate for this risk profile. The loss on Sanderson&#x27;s investments is thus not a violation of the Standards.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Jo Atkins, CFA, a portfolio manager, is meeting with a new client, Jay Sanderson. In preparing Sanderson&#x27;s IPS, Sanderson refuses to fully disclose his holdings to Atkins. As a result, Atkins completes Sanderson&#x27;s suitability analysis based on limited information. Sanderson has a high tolerance for risk. Having done careful research, Atkins recommends a portfolio of information technology stocks. One of the technology stocks is significantly affected by unexpected changes in market sentiment, which results in a large loss for Sanderson in the first year. Has Atkins violated the Standard(s)?<\/p><\/div>","subj":"ethics"},{"n":12,"q":"Jeremy Bay, CFA, is a wealth manager. His client, Laura Nam, requests that Bay buy a risky stock for her. The risk level of the stock is not consistent with Nam's risk tolerance as documented in her IPS. Bay discusses with Nam his concerns about adding the stock to her portfolio. Nam acknowledges the discussion and insists on the stock purchase regardless. Bay purchases the stock for Nam. One week later, the stock decreases significantly in value. Has Bay violated the Standard relating to suitability?","opts":["No","Yes, because the stock's risk level is not appropriate for Nam","Yes, because Nam suffers a significant loss from the stock purchase"],"ans":"A","expl":"A is Correct because Bay appropriately discussed suitability concerns with the client, who accepted the risk and insisted on the stock purchase regardless. This was not a violation of the Standard relating to suitability despite the fact that the investment lost money. According to Standard III(C), Suitability, an appropriate suitability determination will not prevent some investments or investment actions from losing value. Also, in cases of unsolicited trade requests that a member or candidate knows are unsuitable for a client, the member or candidate should refrain from making the trade until he or she discusses the concerns with the client, who should acknowledge the discussion and accept the conditions that make the recommendation unsuitable.","explhtml":"<p>A is Correct because Bay appropriately discussed suitability concerns with the client, who accepted the risk and insisted on the stock purchase regardless. This was not a violation of the Standard relating to suitability despite the fact that the investment lost money. According to Standard III(C), Suitability, an appropriate suitability determination will not prevent some investments or investment actions from losing value. Also, in cases of unsolicited trade requests that a member or candidate knows are unsuitable for a client, the member or candidate should refrain from making the trade until he or she discusses the concerns with the client, who should acknowledge the discussion and accept the conditions that make the recommendation unsuitable.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Jeremy Bay, CFA, is a wealth manager. His client, Laura Nam, requests that Bay buy a risky stock for her. The risk level of the stock is not consistent with Nam&#x27;s risk tolerance as documented in her IPS. Bay discusses with Nam his concerns about adding the stock to her portfolio. Nam acknowledges the discussion and insists on the stock purchase regardless. Bay purchases the stock for Nam. One week later, the stock decreases significantly in value. Has Bay violated the Standard relating to suitability?<\/p><\/div>","subj":"ethics"},{"n":13,"q":"Amy Watson, CFA, prepares a presentation about her investment fund. The fund has consistently delivered a return above 6% for the past five years, with volatility of less than 10% in each year. In her presentation she writes: Statement 1: \"The fund's past performance indicates a return of at least 5% in the next few years.\" Statement 2: \"Monetary policy changes may increase the fund volatility to above 10% in the next few years.\" Which of the statements violates the Standard relating to performance presentation?","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"ans":"A","expl":"A is Correct because according to Standard III(D), Performance Presentation, members and candidates should not state or imply that clients will obtain or benefit from a rate of return that was generated in the past. In this case, a 6% past return is not a guarantee of any return in the future.","explhtml":"<p>A is Correct because according to Standard III(D), Performance Presentation, members and candidates should not state or imply that clients will obtain or benefit from a rate of return that was generated in the past. In this case, a 6% past return is not a guarantee of any return in the future.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Amy Watson, CFA, prepares a presentation about her investment fund. The fund has consistently delivered a return above 6% for the past five years, with volatility of less than 10% in each year. In her presentation she writes: Statement 1: &quot;The fund&#x27;s past performance indicates a return of at least 5% in the next few years.&quot; Statement 2: &quot;Monetary policy changes may increase the fund volatility to above 10% in the next few years.&quot; Which of the statements violates the Standard relating to performance presentation?<\/p><\/div>","subj":"ethics"},{"n":14,"q":"Julian Johnson, CFA, receives an inquiry from the country's securities regulator about one of his clients, Samantha Smith, who is suspected of illegal market activities. Johnson shares all requested information about Smith with the securities regulator. The next day, Johnson receives a call from Smith asking not to disclose any information if Johnson gets contacted by anyone. Later that same day, Johnson receives a call from the local tax authority, which is investigating Smith for tax fraud. Johnson sends the requested information to the tax authority. Has Johnson violated the Standard relating to preservation of confidentiality?","opts":["No","Yes, by sharing Smith's information with the tax authority","Yes, by sharing Smith's information with the securities regulator"],"ans":"A","expl":"A is Correct because according to Standard III(E), Preservation of Confidentiality, members and candidates must keep information about current, former, and prospective clients confidential unless certain conditions exist, including the information concerns illegal activities on the part of the client. In this case, Johnson shared information with both the securities regulator and the tax authority regarding suspected illegal activities, and thus is not a violation.","explhtml":"<p>A is Correct because according to Standard III(E), Preservation of Confidentiality, members and candidates must keep information about current, former, and prospective clients confidential unless certain conditions exist, including the information concerns illegal activities on the part of the client. In this case, Johnson shared information with both the securities regulator and the tax authority regarding suspected illegal activities, and thus is not a violation.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Julian Johnson, CFA, receives an inquiry from the country&#x27;s securities regulator about one of his clients, Samantha Smith, who is suspected of illegal market activities. Johnson shares all requested information about Smith with the securities regulator. The next day, Johnson receives a call from Smith asking not to disclose any information if Johnson gets contacted by anyone. Later that same day, Johnson receives a call from the local tax authority, which is investigating Smith for tax fraud. Johnson sends the requested information to the tax authority. Has Johnson violated the Standard relating to preservation of confidentiality?<\/p><\/div>","subj":"ethics"},{"n":15,"q":"Julia Stevens, CFA, works for TBL Investments (TBLI). The firm has no employee trading policy. Stevens observes that her colleague bought and sold GLT stock to exploit the difference in prices in different exchanges. Stevens fails to inform her firm's compliance department about her colleague's trading activity. Separately, for all client trades, TBLI requests that Stevens pay higher brokerage fees than she believes is justified to maintain good relationship with their primary broker. Due to a lack of sufficient benefit to clients, Stevens refuses to comply with her employer's request. Has Stevens violated the Standard relating to loyalty?","opts":["No","Yes, by failing to comply with her employer's request to pay higher brokerage fees","Yes, by failing to inform her firm's compliance department about her colleague's activity"],"ans":"A","expl":"A is Correct because according to Standard IV(A): Loyalty, \"Members and candidates must always place the interests of clients above the interests of their employer but should also consider the effects of their conduct on the sustainability and integrity of the employer firm\" Also, \"circumstances may arise (e.g., when an employer is engaged in illegal or unethical activity) in which members and candidates must act contrary to their employer’s interests in order to comply with their duties to the market and clients.\" In this case, higher brokerage fees were not justified and thus Stevens did not violate the Standard relating to loyalty. \"A member or candidate who pays a higher brokerage commission than he or she would normally pay to allow for the purchase of goods or services, without corresponding benefit to the client, violates the duty of loyalty to the client.\" Also, according to Standard II(B): Market Manipulation, \"is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard.\" Thus, failing to inform the compliance about a legitimate strategy is not a violation.","explhtml":"<p>A is Correct because according to Standard IV(A): Loyalty, &quot;Members and candidates must always place the interests of clients above the interests of their employer but should also consider the effects of their conduct on the sustainability and integrity of the employer firm&quot; Also, &quot;circumstances may arise (e.g., when an employer is engaged in illegal or unethical activity) in which members and candidates must act contrary to their employer’s interests in order to comply with their duties to the market and clients.&quot; In this case, higher brokerage fees were not justified and thus Stevens did not violate the Standard relating to loyalty. &quot;A member or candidate who pays a higher brokerage commission than he or she would normally pay to allow for the purchase of goods or services, without corresponding benefit to the client, violates the duty of loyalty to the client.&quot; Also, according to Standard II(B): Market Manipulation, &quot;is not intended to preclude transactions undertaken on legitimate trading strategies based on perceived market inefficiencies. The intent of the action is critical to determining whether it is a violation of this standard.&quot; Thus, failing to inform the compliance about a legitimate strategy is not a violation.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Julia Stevens, CFA, works for TBL Investments (TBLI). The firm has no employee trading policy. Stevens observes that her colleague bought and sold GLT stock to exploit the difference in prices in different exchanges. Stevens fails to inform her firm&#x27;s compliance department about her colleague&#x27;s trading activity. Separately, for all client trades, TBLI requests that Stevens pay higher brokerage fees than she believes is justified to maintain good relationship with their primary broker. Due to a lack of sufficient benefit to clients, Stevens refuses to comply with her employer&#x27;s request. Has Stevens violated the Standard relating to loyalty?<\/p><\/div>","subj":"ethics"},{"n":16,"q":"Jeremy Seagate, CFA, a portfolio manager, has investments in Company 1 and Company 2 for his clients' portfolios. Seagate has a personal relationship with the CEO of Company 1. He discloses this relationship to his employer. Seagate's sister, a standard fee-paying client of his firm, requests to buy a large position in Company 2. The company, as well as the size of the requested investment, are suitable for Seagate's sister. Seagate buys the requested position in Company 2's stock for her and notifies his employer. Did Seagate violate the Standard relating to avoid or disclose conflicts?","opts":["No","Yes, by trading the stock of Company 1","Yes, by trading the stock of Company 2"],"ans":"A","expl":"A is Correct because according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. In this case, because Seagate disclosed his relationship with the CEO of Company 1 and his sister is a standard fee-paying client (of which his firm is aware), he did not violate the Standard relating to avoid or disclose conflicts.","explhtml":"<p>A is Correct because according to Standard VI(A), Avoid or Disclose Conflicts, members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. In this case, because Seagate disclosed his relationship with the CEO of Company 1 and his sister is a standard fee-paying client (of which his firm is aware), he did not violate the Standard relating to avoid or disclose conflicts.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Jeremy Seagate, CFA, a portfolio manager, has investments in Company 1 and Company 2 for his clients&#x27; portfolios. Seagate has a personal relationship with the CEO of Company 1. He discloses this relationship to his employer. Seagate&#x27;s sister, a standard fee-paying client of his firm, requests to buy a large position in Company 2. The company, as well as the size of the requested investment, are suitable for Seagate&#x27;s sister. Seagate buys the requested position in Company 2&#x27;s stock for her and notifies his employer. Did Seagate violate the Standard relating to avoid or disclose conflicts?<\/p><\/div>","subj":"ethics"},{"n":17,"q":"Alina Sokolova, CFA, has been an advisor at BT Investments (BTI) for the past seven years. She has disclosed her private holdings twice since she joined BTI. Sokolova allocates shares of a highly anticipated IPO to her clients on a pro-rata order basis. One of these clients is her sister, who is a regular fee-paying client of BTI. Are Sokolova's actions consistent with the Standard relating to priority of transactions?","opts":["Yes","No, because she allocated the IPO to her sister","No, because she has disclosed her private holdings only twice since she joined the firm"],"ans":"C","expl":"C is Correct because according to the recommended procedures for compliance with Standard VI(B), Priority of Transactions, disclosure by investment personnel to the firm should be made upon commencement of the employment relationship and at least annually thereafter. Because she has disclosed her private holdings only two times in seven years, her actions are not consistent with the Standards.","explhtml":"<p>C is Correct because according to the recommended procedures for compliance with Standard VI(B), Priority of Transactions, disclosure by investment personnel to the firm should be made upon commencement of the employment relationship and at least annually thereafter. Because she has disclosed her private holdings only two times in seven years, her actions are not consistent with the Standards.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Alina Sokolova, CFA, has been an advisor at BT Investments (BTI) for the past seven years. She has disclosed her private holdings twice since she joined BTI. Sokolova allocates shares of a highly anticipated IPO to her clients on a pro-rata order basis. One of these clients is her sister, who is a regular fee-paying client of BTI. Are Sokolova&#x27;s actions consistent with the Standard relating to priority of transactions?<\/p><\/div>","subj":"ethics"},{"n":18,"q":"Lisa Peterson, CFA, is a portfolio manager at GHI Investments (GHI). Peterson uses the software of AIQ, an external vendor. She recommends AIQ's software to her clients and receives a referral fee from AIQ when clients subscribe to the software. Peterson informs her employer and all clients about the arrangement with AIQ. Separately, GHI gives existing clients a small discount on the firm's service fees after referring new clients to GHI. Peterson informs all referred clients about this arrangement immediately after they sign GHI's service agreement. Did Peterson's actions violate the Standard relating to referral fees?","opts":["No","Yes, by accepting referral fees from AIQ","Yes, by informing all referred clients about the referral arrangement immediately after they sign GHI's service agreement"],"ans":"C","expl":"C is Correct because according to Standard VI(C), Referral Fees, members have responsibility to inform their employer, clients, and prospective clients of any benefit received for referrals of customers and clients. Furthermore, appropriate disclosure means that members and candidates must advise the client or prospective client, before entry into any formal agreement for services, of any benefit given or received for the recommendation of any services provided by the member or candidate. Referred clients must be informed about the arrangement before entering into an agreement and thus is a violation of the Standards.","explhtml":"<p>C is Correct because according to Standard VI(C), Referral Fees, members have responsibility to inform their employer, clients, and prospective clients of any benefit received for referrals of customers and clients. Furthermore, appropriate disclosure means that members and candidates must advise the client or prospective client, before entry into any formal agreement for services, of any benefit given or received for the recommendation of any services provided by the member or candidate. Referred clients must be informed about the arrangement before entering into an agreement and thus is a violation of the Standards.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Lisa Peterson, CFA, is a portfolio manager at GHI Investments (GHI). Peterson uses the software of AIQ, an external vendor. She recommends AIQ&#x27;s software to her clients and receives a referral fee from AIQ when clients subscribe to the software. Peterson informs her employer and all clients about the arrangement with AIQ. Separately, GHI gives existing clients a small discount on the firm&#x27;s service fees after referring new clients to GHI. Peterson informs all referred clients about this arrangement immediately after they sign GHI&#x27;s service agreement. Did Peterson&#x27;s actions violate the Standard relating to referral fees?<\/p><\/div>","subj":"ethics"},{"n":19,"q":"Jenny Lew sits for the Level III exam of the CFA Program. After the exam, she speaks to her friend, Tom Gerkin, who intends to take the Level III exam the next year. Lew does not reveal any exam content, only that fixed income concepts were not tested. Gerkin sets up a study group for the following year's Level III exam. In the group, Gerkin discusses exam questions from a Level III mock exam in detail. Have the Standards been violated?","opts":["No","Yes, by Lew","Yes, by Gerkin"],"ans":"B","expl":"B is Correct because according to Standard VII(A), Conduct as Participants in CFA Institute Programs, CFA Institute program rules, regulations, and policies prohibit candidates from disclosing confidential material gained during the exam process. Specifically, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to broad topical areas and formulas tested or not tested on the exam. In this case, Lew revealed that fixed income concepts were not tested, and thus violated the Standards.","explhtml":"<p>B is Correct because according to Standard VII(A), Conduct as Participants in CFA Institute Programs, CFA Institute program rules, regulations, and policies prohibit candidates from disclosing confidential material gained during the exam process. Specifically, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to broad topical areas and formulas tested or not tested on the exam. In this case, Lew revealed that fixed income concepts were not tested, and thus violated the Standards.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Jenny Lew sits for the Level III exam of the CFA Program. After the exam, she speaks to her friend, Tom Gerkin, who intends to take the Level III exam the next year. Lew does not reveal any exam content, only that fixed income concepts were not tested. Gerkin sets up a study group for the following year&#x27;s Level III exam. In the group, Gerkin discusses exam questions from a Level III mock exam in detail. Have the Standards been violated?<\/p><\/div>","subj":"ethics"},{"n":20,"q":"John Teff and Julia Pinson recently took the CFA Level III exam and discussed it afterwards. Teff thinks the exam is too difficult and posts on his LinkedIn page: &\"The CFA Institute sets the pass rate too low.&\" After the exam, Pinson shares with Teff that she solicited past exam questions from her colleague. However, the exam questions provided to Pinson by her colleague did not help her during the Level III exam. Have the Standard(s) been violated?","opts":["No","Yes, by Teff","Yes, by Pinson"],"ans":"C","expl":"C is Correct because Standard VII(A), Conduct as Participants in CFA Institute Programs, prohibits members from disclosing and/or soliciting confidential material gained prior to or during the exam and grading processes with those outside the CFA exam development process. Pinson has violated this Standard by soliciting and by receiving exam questions from her colleague.","explhtml":"<p>C is Correct because Standard VII(A), Conduct as Participants in CFA Institute Programs, prohibits members from disclosing and/or soliciting confidential material gained prior to or during the exam and grading processes with those outside the CFA exam development process. Pinson has violated this Standard by soliciting and by receiving exam questions from her colleague.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>John Teff and Julia Pinson recently took the CFA Level III exam and discussed it afterwards. Teff thinks the exam is too difficult and posts on his LinkedIn page: &amp;&quot;The CFA Institute sets the pass rate too low.&amp;&quot; After the exam, Pinson shares with Teff that she solicited past exam questions from her colleague. However, the exam questions provided to Pinson by her colleague did not help her during the Level III exam. Have the Standard(s) been violated?<\/p><\/div>","subj":"ethics"},{"n":21,"q":"James Witt, CFA, chats with his colleague Elsa Otkins, CFA, in a LinkedIn forum about professional credentials. Witt writes to Otkins: \"Passing the CFA exams has given me an edge to deliver superior investment performance compared to others.\" Witt does not make this statement when talking to his clients. Otkins writes: \"I definitely have enhanced my knowledge in economics by studying the CFA curriculum.\" She adds the same sentence to her resume. Have the Standards been violated?","opts":["No","Yes, by Witt","Yes, by Otkins"],"ans":"B","expl":"B is Correct because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, individuals must not exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program. Furthermore, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard. Witt's statement implies his superiority based on passing CFA exams, and thus is a violation.","explhtml":"<p>B is Correct because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, individuals must not exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program. Furthermore, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard. Witt&#x27;s statement implies his superiority based on passing CFA exams, and thus is a violation.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>James Witt, CFA, chats with his colleague Elsa Otkins, CFA, in a LinkedIn forum about professional credentials. Witt writes to Otkins: &quot;Passing the CFA exams has given me an edge to deliver superior investment performance compared to others.&quot; Witt does not make this statement when talking to his clients. Otkins writes: &quot;I definitely have enhanced my knowledge in economics by studying the CFA curriculum.&quot; She adds the same sentence to her resume. Have the Standards been violated?<\/p><\/div>","subj":"ethics"},{"n":22,"q":"On his LinkedIn profile page, Jeremy Bo, CFA, writes: \"I passed the CFA exam in three consecutive years.\" He also adds: \"I enrolled in the CFA Program to obtain the highest set of credentials in the global investment management industry.” Did Bo violate the Standards?","opts":["No","Yes, by stating that he passed the CFA Program exam in three consecutive years","Yes, by stating that he took the CFA exam to obtain highest set of credentials in the global investment management industry"],"ans":"A","expl":"A is Correct because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, if a candidate passes each level of the exam in consecutive years and wants to state that he or she did so, that is not a violation of Standard VII(B) because it is a statement of fact. Also, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard. Bo thus did not violate the Standards based on his statements that he passed the CFA exam in three consecutive years as well as enrolled in the CFA Program to obtain the highest set of credentials in the global investment management industry.","explhtml":"<p>A is Correct because according to Standard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, if a candidate passes each level of the exam in consecutive years and wants to state that he or she did so, that is not a violation of Standard VII(B) because it is a statement of fact. Also, statements referring to CFA Institute, the CFA designation, or the CFA Program that overstate the competency of an individual or imply, either directly or indirectly, that superior performance can be expected from someone with the CFA designation are not allowed under the standard. Bo thus did not violate the Standards based on his statements that he passed the CFA exam in three consecutive years as well as enrolled in the CFA Program to obtain the highest set of credentials in the global investment management industry.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>On his LinkedIn profile page, Jeremy Bo, CFA, writes: &quot;I passed the CFA exam in three consecutive years.&quot; He also adds: &quot;I enrolled in the CFA Program to obtain the highest set of credentials in the global investment management industry.” Did Bo violate the Standards?<\/p><\/div>","subj":"ethics"},{"n":23,"q":"Han-seo Kwak, CFA, head of research at an equity fund, assigns Mi-ri Kim, CFA, a new junior analyst, to forecast the growth rate of KLE, a small-cap company. Kim performs a thorough analysis using the firm's model. After a quick review of Kim's analysis, Kwak concludes that KLE is overvalued. Based on Kwak's conclusion, the fund does not invest in KLE. After KLE's stock price rises following positive recommendations from other funds, Kwak performs a more in-depth review and identifies two assumptions in Kim's forecast that caused an overly pessimistic valuation. Have the Standards been violated?","opts":["No","Yes, only by Kwak","Yes, both by Kwak and by Kim"],"ans":"B","expl":"B is Correct because Kwak violates Standard V(A), Diligence and Reasonable Basis, by doing only a quick review of Kim's work. According to Standard V(A), members and candidates must have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. If members and candidates rely on secondary or third-party research, they must make reasonable and diligent efforts to determine such research is sound. As Kim is a new junior analyst, Kwak fails to thoroughly review her forecast before providing a conclusion.","explhtml":"<p>B is Correct because Kwak violates Standard V(A), Diligence and Reasonable Basis, by doing only a quick review of Kim&#x27;s work. According to Standard V(A), members and candidates must have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis, recommendation, or action. If members and candidates rely on secondary or third-party research, they must make reasonable and diligent efforts to determine such research is sound. As Kim is a new junior analyst, Kwak fails to thoroughly review her forecast before providing a conclusion.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Han-seo Kwak, CFA, head of research at an equity fund, assigns Mi-ri Kim, CFA, a new junior analyst, to forecast the growth rate of KLE, a small-cap company. Kim performs a thorough analysis using the firm&#x27;s model. After a quick review of Kim&#x27;s analysis, Kwak concludes that KLE is overvalued. Based on Kwak&#x27;s conclusion, the fund does not invest in KLE. After KLE&#x27;s stock price rises following positive recommendations from other funds, Kwak performs a more in-depth review and identifies two assumptions in Kim&#x27;s forecast that caused an overly pessimistic valuation. Have the Standards been violated?<\/p><\/div>","subj":"ethics"},{"n":24,"q":"Barbara Eng, CFA, is an equity research analyst at Minute Research. Eng solely authors an annual automotive sector report. After Minute Research issues the report, Eng leaves Minute Research to become an independent research analyst. Eng intends to reissue the report for distribution to her new clients. According to the Standards, who has the right to re-issue the report?","opts":["Eng only","Minute Research only","Both Eng and Minute Research"],"ans":"B","expl":"B is Correct because, according to Standard I(C), Misrepresentation, the firm retains the right to continue using the work completed after a member or candidate has left the organization. The firm may issue future reports without providing attribution to the prior analysts.","explhtml":"<p>B is Correct because, according to Standard I(C), Misrepresentation, the firm retains the right to continue using the work completed after a member or candidate has left the organization. The firm may issue future reports without providing attribution to the prior analysts.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Barbara Eng, CFA, is an equity research analyst at Minute Research. Eng solely authors an annual automotive sector report. After Minute Research issues the report, Eng leaves Minute Research to become an independent research analyst. Eng intends to reissue the report for distribution to her new clients. According to the Standards, who has the right to re-issue the report?<\/p><\/div>","subj":"ethics"},{"n":25,"q":"Lilian Gosh, CFA, a portfolio manager, is preparing a year-end performance review report with a colleague. He makes the following statements to his colleague: Statement 1: \"We can exclude terminated accounts from performance history.\" Statement 2: \"We can present performance using a weighted composite of similar portfolios.\" Which of the statements is consistent with the Standard relating to performance presentation?","opts":["Statement 1 only","Statement 2 only","both Statement 1 and Statement 2"],"ans":"B","expl":"B is Correct because according to Standard III(D), Performance Presentation, members can meet their obligations by presenting the performance of the weighted composite of similar portfolios rather than using a single representative account.","explhtml":"<p>B is Correct because according to Standard III(D), Performance Presentation, members can meet their obligations by presenting the performance of the weighted composite of similar portfolios rather than using a single representative account.<\/p>","qhtml":"<div class=\"pp-topic\">Guidance for Standards I–VII<\/div><div class=\"qtext\"><p>Lilian Gosh, CFA, a portfolio manager, is preparing a year-end performance review report with a colleague. He makes the following statements to his colleague: Statement 1: &quot;We can exclude terminated accounts from performance history.&quot; Statement 2: &quot;We can present performance using a weighted composite of similar portfolios.&quot; Which of the statements is consistent with the Standard relating to performance presentation?<\/p><\/div>","subj":"ethics"},{"n":26,"q":"Anya Harmon, CFA, is an account manager at a wealth management firm. The client fees are calculated based on the average daily balance of assets in each client's account. The firm is switching to a new fee calculation method using end-of-billing-cycle balances, thus reducing fees for most clients. Harmon discloses the new method only to new clients. According to the Standards, is Harmon required to disclose the new fee calculation method to existing clients?","opts":["No","Yes, to all existing clients","Yes, but only to existing clients incurring a higher fee"],"ans":"B","expl":"B is Correct because, according to Standard V(B), Communication with Clients and Prospective Clients, any changes to the fee calculation method that are different from the process agreed to by the clients must be disclosed. Only by thoroughly understanding the nature of the investment product or service can a client determine whether changes to that product or service could materially affect his or her inves
