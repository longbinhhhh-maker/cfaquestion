<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Which of the following statements about pension plans is most accurate?","opts":["Defined benefit plans typically have a low risk tolerance.","Defined contribution plans typically have a low risk tolerance.","The sponsor of a defined benefit plan specifies the obligation owed to participants."],"ans":"C","expl":"A. Không chính xác vì khả năng chấp nhận rủi ro đối với các chương trình hưu trí phúc lợi xác định sẽ thay đổi theo\nthời gian đáo hạn của chương trình, nhưng thường khá cao.\nB. Không chính xác vì các kế hoạch lương hưu đóng góp xác định được quản lý cho các nhà đầu tư\ncá nhân, do đó mức độ chấp nhận rủi ro của mỗi kế hoạch thay đổi tùy theo từng cá nhân. Một số\ncá nhân sẽ đầu tư để tăng trưởng và do đó sẽ tìm kiếm những tài sản có tiềm năng\nđể tăng vốn. Những người khác, chẳng hạn như những người về hưu, có thể cần thu nhập từ tài sản của họ\nvà do đó có thể chọn đầu tư nhiều hơn vào cổ phiếu có thu nhập cố định và trả cổ tức. Nhu cầu đầu tư\ncủa các cá nhân sẽ phụ thuộc một phần vào tình hình tài chính rộng hơn của họ,\nchẳng hạn như triển vọng việc làm và việc họ có sở hữu nơi ở riêng hay không.\nHọ cũng có thể cần xem xét các vấn đề như xây dựng quỹ dự trữ tiền mặt và mua\ncác chính sách bảo hiểm phù hợp trước khi thực hiện đầu tư dài hạn. Mức độ chấp nhận rủi ro\ncủa một nhà đầu tư cá nhân khác nhau tùy theo từng cá nhân.\nC. Đúng vì các kế hoạch lương hưu phúc lợi xác định (kế hoạch DB) là các kế hoạch do công ty tài trợ\ncung cấp cho nhân viên một lợi ích xác định trước khi nghỉ hưu. Lợi ích trong tương lai được xác định\nvì kế hoạch DB yêu cầu nhà tài trợ kế hoạch chỉ định nghĩa vụ được nêu trong điều khoản\ncác khoản phúc lợi thu nhập hưu trí mà người tham gia phải trả.\nQuản lý danh mục đầu tư: mô tả các khoản đóng góp xác định và các kế hoạch lương hưu phúc lợi xác định","qhtml":null},{"n":2,"q":"The process of risk management is best described as the set of decisions that maximizes a\ncompany's value while:","opts":["minimizing the risk taken.","bearing a tolerable level of risk.","predicting the potential risk correctly."],"ans":"B","expl":"A. Không chính xác vì quản lý rủi ro không phải là giảm thiểu rủi ro; đó là việc tích cực\nhiểu biết và chấp nhận những rủi ro đó để cân bằng tốt nhất việc đạt được mục tiêu với\nkhả năng thất bại có thể chấp nhận được, định lượng mức độ phơi nhiễm cũng như liên tục theo dõi và\nsửa đổi nó.\nB. Đúng vì quản lý rủi ro là quá trình một tổ chức hoặc cá nhân\nxác định mức độ rủi ro phải đối mặt, đo lường mức độ rủi ro gặp phải và điều chỉnh\ntheo hướng cũ, với mục tiêu tối đa hóa giá trị của công ty hoặc danh mục đầu tư...\nNói cách khác, quản lý rủi ro bao gồm tất cả các quyết định và hành động cần thiết để\nđạt được các mục tiêu của tổ chức hoặc cá nhân một cách tốt nhất trong khi vẫn phải gánh chịu rủi ro mức độ rủi ro có thể chấp nhận được.\nC. Không chính xác vì quản lý rủi ro thậm chí không phải là dự đoán rủi ro. Học thuyết về Không có\nBất ngờ' là câu thần chú quan trọng của nhiều nhà quản lý rủi ro, nhưng điều đó không có nghĩa là họ\ncần dự đoán điều gì sẽ xảy ra.\nQuản lý danh mục đầu tư: xác định quản lý rủi ro","qhtml":null},{"n":3,"q":"Which of the following is least consistent with effective risk governance?","opts":["Taking an enterprise-wide view","Defining the enterprise's risk tolerance","Following a bottom-up process to direct risk management activities"],"ans":"C","expl":"A. Không chính xác vì để đạt được kết quả tốt nhất cho một tổ chức, quản trị rủi ro phải\ncó góc nhìn toàn doanh nghiệp.\nB. Không chính xác vì quản trị tốt phải bao gồm việc xác định mức độ chấp nhận rủi ro\ncủa tổ chức và đưa ra biện pháp giám sát rủi ro.\nC. Đúng vì quản trị rủi ro là quy trình và hướng dẫn từ trên xuống [không phải từ dưới lên]\nchỉ đạo các hoạt động quản lý rủi ro phù hợp và hỗ trợ tổng thể doanh nghiệp.\nQuản lý danh mục đầu tư: xác định quản trị rủi ro và mô tả các yếu tố rủi ro hiệu quả\nquản trị","qhtml":null},{"n":4,"q":"With regard to an investment policy statement, which of the following statements about\nreturn objectives is most accurate?","opts":["A return objective cannot be a required rate of return.","Return objectives must be set independent of risk objectives.","When setting a relative return objective, a good benchmark should be investable."],"ans":"C","expl":"A. Không chính xác vì mục tiêu lợi nhuận có thể là tỷ lệ lợi nhuận bắt buộc. Mục tiêu lợi nhuận\ncó thể là lợi nhuận bắt buộc- tức là số tiền mà nhà đầu tư cần kiếm được để đáp ứng một\nmục tiêu cụ thể trong tương lai-chẳng hạn như một mức thu nhập hưu trí nhất định.\nC. Đúng vì điểm chuẩn được sử dụng làm mục tiêu lợi nhuận tương đối và điểm chuẩn tốt\nnên có thể đầu tư được.\nB. Không chính xác vì mục tiêu lợi nhuận phải nhất quán với mục tiêu rủi ro của khách hàng\n(khó có thể đạt được lợi nhuận kỳ vọng cao nếu không có mức độ rủi ro cao)\nQuản lý danh mục đầu tư: mô tả các mục tiêu rủi ro và lợi nhuận cũng như cách chúng có thể được phát triển\ncho khách hàng","qhtml":null},{"n":5,"q":"The correlation between the risk-free asset and the optimal risky portfolio is expected to\nbe:","opts":["negative.","zero.","positive."],"ans":"B","expl":"A. Không chính xác vì sự kết hợp giữa tài sản phi rủi ro và tài sản rủi ro có thể mang lại\nsự đánh đổi lợi nhuận-rủi ro tốt hơn so với việc đầu tư vào chỉ một loại tài sản vì tài sản phi rủi ro\nkhông có mối tương quan với tài sản rủi ro. Danh mục đầu tư rủi ro tối ưu là tài sản\nrủi ro và do đó không có mối tương quan với tài sản không rủi ro.\nB. Đúng vì sự kết hợp giữa tài sản phi rủi ro và tài sản rủi ro có thể mang lại\nsự đánh đổi lợi nhuận-rủi ro tốt hơn so với đầu tư vào chỉ một loại tài sản vì tài sản phi rủi ro\nkhông có mối tương quan với tài sản rủi ro. Danh mục đầu tư rủi ro tối ưu là tài sản\nrủi ro và do đó không có mối tương quan với tài sản không rủi ro.\nC. Không chính xác vì sự kết hợp giữa tài sản phi rủi ro và tài sản rủi ro có thể mang lại\nsự đánh đổi lợi nhuận-rủi ro tốt hơn so với việc đầu tư vào chỉ một loại tài sản vì tài sản phi rủi ro\nkhông có mối tương quan với tài sản rủi ro. Phần rủi ro tối ưu là tài sản\nrủi ro và do đó không có mối tương quan với tài sản không rủi ro.\nQuản lý danh mục đầu tư: mô tả ý nghĩa của việc kết hợp tài sản không rủi ro với một\ndanh mục tài sản rủi ro","qhtml":null},{"n":6,"q":"An investor who can lend and borrow at the risk-free rate builds a portfolio using the risk-\nfree asset and the market portfolio. The risk-free rate is 3% and the expected market return is\n15%. If the expected portfolio return is 18%, the investor's portfolio is:","opts":["a lending portfolio.","a leveraged portfolio.","the optimal risky portfolio."],"ans":"B","expl":"A. Không chính xác vì danh mục cho vay là danh mục có khoản đầu tư dương vào\ntài sản không rủi ro.\nLợi nhuận kỳ vọng của danh mục đầu tư, E(𝑅 ), được tính như sau: E(𝑅 ) = w R + (1 - w₁)E(R ), trong đó w₁ là\n𝑝 𝑝 1 f m\ntỷ lệ đầu tư vào tài sản phi rủi ro, trả lại R và E(𝑅 ) là lợi nhuận kỳ vọng\nf 𝑚\ntrong danh mục thị trường.\nDo đó, 0,18 = w x 0,03 + (1 - w₁) x 0,15\n0,18 - 0,15W = w x (0,03 - 0,15)\n0,03 = w x (-0,12)\nw₁ = 0,03/(-0,12)\nW₁ = -0,25\nTỷ lệ âm được đầu tư vào lãi suất phi rủi ro ngụ ý có đòn bẩy, không phải là cho vay,\ndanh mục đầu tư.\nB. Đúng vì danh mục đầu tư có đòn bẩy là danh mục đầu tư có khoản đầu tư âm vào\ntài sản không rủi ro.\nLợi nhuận kỳ vọng của danh mục đầu tư, E(R), được tính như sau: E(R) = w₁R,+ (1 - w₁)E(R), trong đó w, là\ntỷ lệ đầu tư vào tài sản không rủi ro, trả về R và E(R) là lợi nhuận kỳ vọng trên\ndanh mục thị trường.\nDo đó, 0,18 = w x 0,03 + (1 - w₁) x 0,15\n0,18 - 0,15 = w (0,03 - 0,15)\n0,03 = w x (-0,12)\nw₁ = 0,03/(-0,12)\nW₁ =-0,25\nTỷ lệ âm được đầu tư vào lãi suất phi rủi ro hàm ý một danh mục đầu tư có đòn bẩy.\nC. Không chính xác vì lợi nhuận kỳ vọng của thị trường là 15%, trong khi lợi nhuận kỳ vọng của danh mục đầu tư\nlà 18%. Vì hai lợi nhuận khác nhau nên danh mục đầu tư của nhà đầu tư khác với\ndanh mục đầu tư (thị trường) rủi ro tối ưu.\nQuản lý danh mục đầu tư: giải thích đường phân bổ vốn (CAL) và đường thị trường vốn\n(CML)","qhtml":null},{"n":7,"q":"An analyst gathers the following information about a company:\nPayables turnover 8\nInventory turnover 2\nReceivables turnover 10\nIf all purchases and sales were made on credit, the cash conversion cycle (based on a 360-day\nyear) is:","opts":["less than the utility generated for a risk-averse investor.","equal to the utility generated for a risk-averse investor.","greater than the utility generated for a risk-averse investor."],"ans":"B","expl":"A. Không chính xác vì một tài sản phi rủi ro (𝜎2 = 0) tạo ra cùng một tiện ích cho tất cả các cá nhân\nB. Đúng vì tài sản phi rủi ro (𝜎2 = 0) tạo ra mức hữu dụng như nhau cho tất cả các cá nhân. Nếu\n𝜎2 = 0 thì U = E(r) - 1/2(A)( 𝜎2) = E(r) cho tất cả các cá nhân\nC. Không chính xác vì một tài sản phi rủi ro (𝜎2 = 0) tạo ra cùng một tiện ích cho tất cả các cá nhân.\nQuản lý danh mục đầu tư: giải thích tâm lý lo ngại rủi ro và ý nghĩa của nó đối với việc lựa chọn danh mục đầu tư","qhtml":null},{"n":8,"q":"A risk-neutral investor most likely seeks to maximize:","opts":["both risk and return.","return irrespective of risk.","return for a given level of risk."],"ans":"B","expl":"A. Không chính xác vì nhà đầu tư tìm kiếm rủi ro sẽ tối đa hóa cả rủi ro và lợi nhuận. Nhà đầu tư trung lập với rủi ro\nsẽ tối đa hóa lợi nhuận bất kể rủi ro. Nghĩa là, một nhà đầu tư trung lập với rủi ro\ncố tình tìm cách tối đa hóa lợi nhuận chứ không phải rủi ro. Có thể một nhà đầu tư trung lập với rủi ro\ncó thể tối đa hóa rủi ro bằng cách tối đa hóa lợi nhuận, nhưng anh ta chỉ tìm cách tối đa hóa lợi nhuận\nvà rủi ro không phải là điều đáng cân nhắc\nB. Đúng vì nhà đầu tư trung lập với rủi ro sẽ tối đa hóa lợi nhuận bất kể rủi ro. Đây là\nvì nhà đầu tư như vậy chỉ quan tâm đến lợi nhuận chứ không quan tâm đến rủi ro, do đó, các khoản đầu tư mang lại lợi nhuận cao hơn\nsẽ được mong muốn hơn ngay cả khi chúng có rủi ro cao hơn.\nC. Không chính xác vì chỉ những nhà đầu tư không thích rủi ro mới muốn giảm thiểu rủi ro để có được cùng một lượng lợi nhuận\n và tối đa hóa lợi nhuận của họ với cùng một lượng rủi ro. Nhà đầu tư\ntrung lập với rủi ro tìm cách tối đa hóa lợi nhuận bất kể rủi ro, không phải ở một mức độ rủi ro nhất định.\nQuản lý danh mục đầu tư: giải thích mức độ tránh rủi ro và ý nghĩa của nó đối với việc lựa chọn danh mục đầu tư","qhtml":null},{"n":9,"q":"An analyst gathers the following information (in € millions) about a company before any\nrevaluations.\nAverage total assets 20\nAverage total liabilities 8\nAverage total equity 12\nAn initial revaluation increases the carrying value of the asset valued under the revaluation\nmodel. Ignoring taxes, the financial leverage ratio most likely","opts":["3.6%.","5.6%.","11.6%"],"ans":"A","expl":"A. Đúng vì Đúng vì cung cấp thước đo lợi nhuận của danh mục đầu tư được điều chỉnh theo tổng rủi ro của\ndanh mục đầu tư và được tính là𝑀2 = [E(𝑅 ) - R(𝜎 ∕𝜎 ) + 𝑅 = SR x 𝜎 + 𝑅 , trong đó SR =\n𝑝 𝑚 𝑝 𝑡 𝑚 𝑡\nTỷ lệ Sharpe, 𝜎 = độ lệch chuẩn thị trường của lợi nhuận và R,= lãi suất phi rủi ro. Do đó, 𝑀2 =\n𝑚\n0,8 x 0,12 + 0,02 0,116. Sự khác biệt giữa hiệu suất được điều chỉnh theo rủi ro của danh mục đầu tư\n và hiệu suất của thị trường thường được gọi là 𝑀2 alpha. Do đó,\n𝑀2alpha = 0,116 -0,08 -0,0363,6%.\nB. Không chính xác vì nó tính M2 = 0,02+0,8 x 0,12 = 0,116. M² alpha bị tính sai\nlà 0,116 - (0,08 - 0,02) = 0,056 ≈ 5,6%.\nC. Không chính xác vì nó tính M2 thay vì M2 alpha, đây là bước trung gian trong\nphép tính đúng: M² = 0,02 + 0,8 x 0,12 = 0,116 ≈ 11,6%.\nQuản lý danh mục đầu tư: tính toán và diễn giải tỷ lệ Sharpe, tỷ lệ Treynor, M 2 và\nJensen's alpha","qhtml":null},{"n":10,"q":"Which of the following is most likely a consequence of overconfidence bias? Investors:","opts":["holding poorly diversified portfolios.","continuing to hold classes of assets with which they are familiar.","holding investments in a loss position longer than justified, in the hope that they will return to breakeven."],"ans":"A","expl":"A. Đúng vì thành kiến quá tự tin là thành kiến trong đó mọi người thể hiện những điều không chính đáng\nniềm tin vào khả năng của chính mình. Do thành kiến quá tự tin, FMP (thị trường tài chính\nngười tham gia] có thể nắm giữ danh mục đầu tư kém đa dạng, điều này có thể dẫn đến nhược điểm đáng kể\nrủi ro.\nB. Không chính xác vì đây là hậu quả tiềm ẩn của sự thiên vị về nguồn lực chứ không phải sự tự tin thái quá\nthiên vị. Thành kiến về nguồn lực là thành kiến về mặt cảm xúc trong đó mọi người đánh giá cao một tài sản hơn khi họ\nsở hữu nó hơn là khi họ không sở hữu nó. Sự thiên vị về nguồn tài trợ có thể dẫn đến FMP (thị trường tài chính\nngười tham gia] tiếp tục nắm giữ các loại tài sản mà họ quen thuộc. FMP có thể\ntin rằng họ hiểu đặc điểm của khoản đầu tư mà họ đã sở hữu và có thể\nmiễn cưỡng mua những tài sản mà họ có ít kinh nghiệm hơn.\nngười sở hữu nhận thức được giá trị của một chứng khoán.\nC. Không chính xác vì đây là hậu quả tiềm tàng của thành kiến không thích mất mát, không phải\nquá tự tin. Do thành kiến không thích thua lỗ, FMP (những người tham gia thị trường tài chính) có thể\ngiữ các khoản đầu tư ở trạng thái thua lỗ lâu hơn thời gian được chứng minh bằng phân tích cơ bản, với hy vọng\nrằng họ sẽ trở lại mức hòa vốn\nQuản lý danh mục đầu tư: thảo luận về những thành kiến hành vi thường được công nhận và chúng\ný nghĩa đối với việc ra quyết định tài chính","qhtml":null},{"n":11,"q":"Failing to act in pursuit of long-term goals in favor of short-term satisfaction best\ndescribes which of the following emotional biases?","opts":["Self-control bias","Endowment bias","Loss-aversion bias"],"ans":"A","expl":"A. Đúng vì thành kiến tự kiểm soát là thành kiến mà mọi người mắc phải để hành động nhằm theo đuổi\ncác mục tiêu tổng thể, dài hạn nhằm đạt được sự hài lòng ngắn hạn.\nB. Không chính xác vì thiên kiến thiên về tài sản là thành kiến về mặt cảm xúc trong đó mọi người đánh giá cao một tài sản\nkhi họ sở hữu nó hơn là khi họ không sở hữu nó và không phải là hành động ủng hộ sự hài lòng ngắn hạn\nchi phí cho các mục tiêu dài hạn.\nC. Không chính xác vì thành kiến không thích thua lỗ đề cập đến xu hướng đặc biệt thích tránh\nthua lỗ để đạt được lợi ích chứ không phải hành động có lợi cho sự hài lòng ngắn hạn với\nchi phí cho các mục tiêu dài hạn.\nQuản lý danh mục đầu tư: thảo luận về những thành kiến hành vi thường được công nhận và\ný nghĩa của chúng đối với việc ra quyết định tài chính","qhtml":null},{"n":12,"q":"When creating a long-only portfolio, which of the following correlation coefficients\nbetween assets would be most effective at reducing portfolio risk?","opts":["- 0.5.","0.","0.5."],"ans":"A","expl":"A. Đúng vì -05 là mối tương quan nhỏ nhất trong ba mối tương quan và hệ số tương quan\n càng gần với -1. thì rủi ro danh mục đầu tư càng giảm đi. Hệ số tương quan\ngiữa hai tài sản xác định mức độ ảnh hưởng đến rủi ro danh mục đầu tư khi hai tài sản\nđược kết hợp. Bạn sẽ thấy rằng rủi ro danh mục đầu tư không bị ảnh hưởng khi hai tài sản\ntương quan hoàn hảo (p₁₂ = +1). Nói cách khác, độ lệch chuẩn của danh mục đầu tư chỉ đơn giản là\ntrung bình có trọng số của độ lệch chuẩn của hai tài sản và do đó rủi ro của danh mục đầu tư\nkhông thay đổi khi bổ sung các tài sản có cùng thông số rủi ro. Tuy nhiên, rủi ro của danh mục đầu tư sẽ giảm\nkhi hai tài sản không có mối tương quan hoàn hảo (p₁₂) <+1) Các giá trị đủ thấp\ncủa hệ số tương quan có thể làm cho danh mục đầu tư không có rủi ro trong một số điều kiện nhất định. Đối với một\ntrường hợp cực đoan trong đó p₁₂ = -1 (nghĩa là lợi nhuận của hai tài sản di chuyển ngược chiều nhau),\ndanh mục đầu tư có thể không có rủi ro Về mặt phân tích, rủi ro độ lệch chuẩn của hai danh mục đầu tư tài sản\nđược tính bằng căn bậc hai của phương sai của danh mục đầu tư: 𝜎 =(𝑤2𝜎2 +𝑤2𝜎2 +\n𝑃 1 1 1 1\n2𝑤 𝑤 𝑝 𝜎 𝜎 ) 1/2 là hàm tăng nghiêm ngặt của p₁₂ Do đó, -0,5, nhỏ nhất trong\n1 2 12 1 2\nba mối tương quan, có rủi ro thấp nhất.\nB. Không chính xác vì hệ số tương quan không phải là thấp nhất trong ba phương án.\nhệ số tương quan càng gần -1 thì rủi ro danh mục đầu tư\nrủi ro danh mục càng giảm khi hai tài sản không tương quan hoàn hảo (𝑝 <+1). Các giá trị đủ thấp của\n12\nhệ số tương quan có thể làm cho danh mục đầu tư không gặp rủi ro trong một số điều kiện nhất định. Đối với\ntrường hợp cực đoan trong đó p₁₂ = -1 (nghĩa là lợi nhuận của hai tài sản di chuyển theo hướng ngược nhau),\ndanh mục đầu tư có thể không có rủi ro.\nC. Không chính xác vì hệ số tương quan không phải là thấp nhất trong ba phương án.\nhệ số tương quan càng gần -1. mức giảm rủi ro danh mục đầu tư càng lớn \"Rủi ro danh mục đầu tư\ngiảm khi hai tài sản không tương quan hoàn hảo (𝑝 < +1). Các giá trị đủ thấp\n12\ncủa hệ số tương quan có thể làm cho danh mục đầu tư không có rủi ro trong một số điều kiện nhất định. Đối với một\ntrường hợp cực đoan trong đó 𝑝 = -1 (nghĩa là lợi nhuận của hai tài sản di chuyển ngược chiều nhau hướng dẫn),\n12\ndanh mục đầu tư có thể không có rủi ro.\nQuản lý danh mục đầu tư: mô tả tác động lên rủi ro của danh mục đầu tư khi đầu tư vào những tài sản\ncó ít mối tương quan hoàn hảo","qhtml":null},{"n":13,"q":"Which of the following can best be explained by overconfidence when predicting\ncompanies' earnings growth rates?","opts":["Base-rate neglect","The value anomaly","The disposition effect"],"ans":"B","expl":"A. Không chính xác vì bởi vì, khi bỏ qua tỷ lệ cơ sở, tỷ lệ xảy ra của một hiện tượng trong một nhóm dân số\nlớn hơn-tỷ lệ cơ sở của nó - bị bỏ qua để ủng hộ thông tin cụ thể. Thông tin\ncụ thể, riêng lẻ có thể gây hiểu nhầm so với lãi suất cơ bản hoặc thông tin chung\nphù hợp hơn. Việc bỏ qua tỷ lệ cơ sở có liên quan đến xu hướng đại diện chứ không phải\nsự tự tin quá mức, cũng như không liên quan đến tốc độ tăng trưởng thu nhập\nB. Đúng vì một số nghiên cứu khác đã đưa ra những lời giải thích mang tính hành vi đối với những bất thường về giá trị\ncho thấy những bất thường này là do định giá sai thay vì bù đắp cho\nrủi ro gia tăng. Những nghiên cứu này nhận ra các yếu tố cảm xúc liên quan đến việc đánh giá cổ phiếu.\nSự tự tin quá mức cũng có thể liên quan đến việc dự đoán tốc độ tăng trưởng, có khả năng khiến cổ phiếu tăng trưởng\nđược định giá quá cao, dẫn đến giá trị bất thường\nC. Không chính xác vì một khái niệm quan trọng được đưa vào phần trình bày tiện ích này là điều\nđược gọi là hiệu ứng xử lý việc nắm giữ các khoản đầu tư đã chịu\nthua lỗ quá lâu và việc bán các khoản đầu tư có lợi nhuận quá nhanh (tức là\ngiữ cho những người thua cuộc và bán những người thắng cuộc). Hiệu ứng điều chỉnh không liên quan đến lỗi dự đoán\n, không liên quan đến tốc độ tăng trưởng thu nhập.\nQuản lý danh mục đầu tư: mô tả những thành kiến về hành vi của nhà đầu tư có thể dẫn đến các đặc điểm\nthị trường mà tài chính truyền thống có thể không giải thích được","qhtml":null},{"n":14,"q":"Which of the following is most likely developed by combining a client's investment\nobjectives and constraints with long-term capital market expectations?","opts":["Risk budget","Strategic asset allocation","Investment policy statement"],"ans":"B","expl":"A. Không chính xác vì việc lập ngân sách rủi ro là quá trình quyết định mức độ rủi ro\ncó thể gánh chịu trong một danh mục đầu tư (ngân sách rủi ro tổng thể) và chia nhỏ rủi ro đó theo các nguồn lợi tức đầu tư\n(ví dụ: phân bổ tài sản chiến lược, phân bổ tài sản chiến thuật và lựa chọn bảo mật\n). Vì quyết định về mức độ rủi ro phải chấp nhận được đưa ra khi\nxây dựng IPS nên ở giai đoạn này, chúng tôi lo ngại về việc phân chia rủi ro đó.\nB. Đúng vì việc phân bổ tài sản chiến lược là kết quả của việc kết hợp các ràng buộc và\nmục tiêu được nêu rõ trong IPS [tuyên bố chính sách đầu tư] và các kỳ vọng của thị trường vốn dài hạn\nliên quan đến các loại tài sản.\nC. Không chính xác vì kỳ vọng dài hạn của thị trường vốn không được nêu phổ biến trong\nIPS, ngoài Mục tiêu đầu tư và Ràng buộc đầu tư thường\nbao gồm các phần sau: Giới thiệu, Tuyên bố mục đích, Tuyên bố nghĩa vụ\nvà Trách nhiệm, Thủ tục, Nguyên tắc đầu tư, Đánh giá và Đánh giá,\nPhụ lục. Do đó, việc kết hợp các mục tiêu đầu tư và các ràng buộc với kỳ vọng dài hạn\nthị trường vốn không mang lại IPS của khách hàng.\nQuản lý danh mục đầu tư mô tả các nguyên tắc xây dựng danh mục đầu tư và vai trò của việc phân bổ tài sản\nliên quan đến IPS","qhtml":null},{"n":15,"q":"The diversification ratio of a portfolio is best described as the ratio of the:","opts":["standard deviation of the equally weighted portfolio's returns to the average standard deviation of the individual securities' returns.","standard deviation of the market-capitalization-weighted portfolio's returns to the standard deviation of the equally weighted portfolio's returns.","average standard deviation of the individual securities' returns to the standard deviation of the market-capitalization- weighted portfolio's returns."],"ans":"A","expl":"A. Đúng vì thước đo đơn giản về giá trị đa dạng hóa được tính bằng tỷ lệ\nđộ lệch chuẩn của danh mục đầu tư có trọng số bằng nhau với độ lệch chuẩn của chứng khoán được chọn ngẫu nhiên\n. Tỷ lệ này có thể được gọi là tỷ lệ đa dạng hóa. Trong\nví dụ về danh mục đầu tư 5 cổ phiếu đã cho, độ lệch chuẩn của danh mục đầu tư có trọng số bằng nhau là\nxấp xỉ 71% độ lệch chuẩn trung bình của 5 cổ phiếu (24,9%); tức là,\nmẫu số là độ lệch chuẩn trung bình của tất cả chứng khoán riêng lẻ trong danh mục đầu tư\nvà tử số là độ lệch chuẩn của danh mục đầu tư có trọng số bằng nhau.\nB. Không chính xác vì độ lệch chuẩn của danh mục đầu tư có trọng số bằng nhau phải là\ntử số (không phải mẫu số) và mẫu số phải là độ lệch chuẩn\ntrung bình của tất cả chứng khoán riêng lẻ trong danh mục đầu tư.\nC. Không chính xác vì độ lệch chuẩn trung bình của tất cả chứng khoán riêng lẻ trong\ndanh mục đầu tư phải là mẫu số (không phải tử số) và tử số phải là\nđộ lệch chuẩn của danh mục đầu tư có trọng số bằng nhau.\nQuản lý danh mục đầu tư: mô tả cách tiếp cận danh mục đầu tư","qhtml":null},{"n":16,"q":"In regard to the asset allocation process, a top-down analysis most likely begins with an\nexamination of","opts":["macroeconomic growth.","a company's board of directors.","the expected growth of a company's competitors."],"ans":"A","expl":"A. Đúng vì phân tích từ trên xuống bắt đầu bằng việc xem xét các điều kiện\nkinh tế vĩ mô. Dựa trên môi trường kinh tế hiện tại và dự báo, các nhà phân tích đánh giá\nthị trường và ngành với mục đích đầu tư vào những ngành được kỳ vọng sẽ hoạt động tốt\n. Cuối cùng, các công ty cụ thể trong các ngành này sẽ được xem xét đầu tư.\nB. Không chính xác vì phân tích từ trên xuống bắt đầu bằng việc xem xét các điều kiện\nkinh tế vĩ mô. Phân tích từ dưới lên tập trung vào chi tiết cụ thể của công ty. Thay vì nhấn mạnh\nchu kỳ kinh tế hoặc phân tích ngành, phân tích từ dưới lên tập trung vào các trường hợp\ncụ thể của công ty, chẳng hạn như chất lượng quản lý và triển vọng kinh doanh\nC. Không chính xác vì phân tích từ trên xuống bắt đầu bằng việc xem xét các điều kiện\nkinh tế vĩ mô. Phân tích từ dưới lên tập trung vào chi tiết cụ thể của công ty. Thay vì nhấn mạnh\nchu kỳ kinh tế hoặc phân tích ngành, phân tích từ dưới lên tập trung vào\nhoàn cảnh cụ thể của công ty, chẳng hạn như chất lượng quản lý và triển vọng kinh doanh.\nQuản lý danh mục đầu tư: mô tả các bước trong quy trình Quản lý danh mục đầu tư","qhtml":null},{"n":17,"q":"Which of the following is most likely a consequence of the illusion of control bias?","opts":["An investor's portfolio turnover is too low.","The investor's portfolio contains concentrated positions in companies.","An investor uses a simple forecasting model for portfolio construction."],"ans":"B","expl":"A. Không chính xác vì do ảo tưởng về thành kiến kiểm soát, FMPS (những người tham gia thị trường tài chính\ncó thể giao dịch nhiều hơn mức cần thiết. Các nhà nghiên cứu đã phát hiện ra rằng doanh thu danh mục đầu tư\ncó mối tương quan nghịch với lợi nhuận đầu tư\nB. Đúng vì do ảo tưởng về thành kiến kiểm soát, FMPS [những người tham gia thị trường tài chính]\ncó thể đa dạng hóa danh mục đầu tư một cách không thỏa đáng. Nghiên cứu đã phát hiện ra rằng một số nhà đầu tư thích để\nđầu tư vào các công ty mà họ cảm thấy có quyền kiểm soát, chẳng hạn như các công ty mà họ làm việc\n, khiến họ nắm giữ các vị thế tập trung.\nC. Không chính xác vì do ảo tưởng về sự thiên vị kiểm soát, FMPS (những người tham gia thị trường tài chính\ncó thể xây dựng các mô hình và dự báo tài chính quá chi tiết. FMP\ncó thể yêu cầu các mô hình chi tiết trước đó đưa ra quyết định đầu tư, tin rằng các dự báo\ntừ các mô hình này sẽ kiểm soát sự không chắc chắn. Mặc dù hiểu rõ hơn về một khoản đầu tư,\nnhà phát hành hoặc ngành thường hữu ích, nhưng độ phức tạp của mô hình ngày càng tăng không kiểm soát được rủi ro\ncố hữu và sự không chắc chắn của kết quả đầu tư.\nQuản lý danh mục đầu tư: thảo luận về những thành kiến hành vi thường được thừa nhận và\ný nghĩa của chúng đối với việc ra quyết định tài chính","qhtml":null},{"n":18,"q":"Which of the following is best classified as a non-financial risk?","opts":["Credit risk","Liquidity risk","Accounting risk"],"ans":"C","expl":"A. Không chính xác vì rủi ro tài chính cơ bản thứ hai là rủi ro tín dụng. Rủi ro tín dụng là rủi ro mất\nnếu một bên không thanh toán số tiền còn nợ theo nghĩa vụ, chẳng hạn như trái phiếu, khoản vay hoặc\nphái sinh cho bên khác.\nB. Không chính xác vì rủi ro thanh khoản là rủi ro tài chính và được định nghĩa là rủi ro điều chỉnh giảm giá trị\nkhi bán một tài sản tài chính.\nC. Đúng vì mặc dù hầu hết các rủi ro đều gây hậu quả về mặt tiền tệ, nhưng có một số\nrủi ro thường được phân loại là phi tài chính về bản chất. Những rủi ro này phát sinh từ nhiều nguồn\nchẳng hạn như mối quan hệ giữa đơn vị và các đối tác, cơ quan quản lý,\nchính phủ, môi trường, nhà cung cấp, khách hàng và nhân viên. Ba\nrủi ro phi tài chính sau đây có liên quan: rủi ro pháp lý, rủi ro kế toán và rủi ro thuế. Chúng thậm chí có thể được gọi chung\nlà rủi ro tuân thủ vì chúng đều giải quyết vấn đề\ntuân thủ các chính sách, luật, quy tắc và quy định do chính phủ và\ncác cơ quan có thẩm quyền, chẳng hạn như ban quản lý kế toán, chẳng hạn như ban quản lý kế toán đặt ra.\nQuản lý danh mục đầu tư: xác định các nguồn rủi ro tài chính và phi tài chính và mô tả cách\nchúng có thể xảy ra như thế nào tương tác","qhtml":null},{"n":19,"q":"Portfolio rebalancing is best described as a process aimed at:","opts":["generating alpha.","aligning portfolio weights with the tactical asset allocation decision.","restoring the portfolio's original exposures to systematic risk factors."],"ans":"C","expl":"A. Không chính xác vì định kỳ hoặc khi có một ngưỡng sai lệch nhất định so với chính sách\ntrọng số (băng thông) đã bị vi phạm, danh mục đầu tư cần được cân bằng lại về mức\ntrọng số chính sách Hồ sơ rủi ro-lợi nhuận của việc phân bổ tài sản chiến lược phụ thuộc vào\nlợi nhuận kỳ vọng và rủi ro của từng loại tài sản riêng lẻ, cũng như mối tương quan giữa\ncác loại tài sản đó. Mặt khác, lựa chọn bảo mật là một nỗ lực để tạo ra mức độ cao hơn\nlợi nhuận cao hơn so với tiêu chuẩn loại tài sản bằng cách chọn chứng khoán có kỳ vọng cao hơn\ntrở lại. \"Quy trình alpha là một quá trình gia tăng giá trị thông qua đầu tư tích cực.\nB. Không chính xác vì định kỳ hoặc khi có một ngưỡng sai lệch nhất định so với chính sách\ntrọng số (băng thông) đã bị vi phạm, danh mục đầu tư cần được cân bằng lại về mức\ntrọng số chính sách Mặt khác, phân bổ tài sản mang tính chiến thuật là quyết định cố ý\nđi chệch khỏi mức độ rủi ro của chính sách đối với các yếu tố rủi ro hệ thống (tức là trọng số chính sách của tài sản\ncác loại) với mục đích tăng thêm giá trị dựa trên dự báo về lợi nhuận ngắn hạn của những\ncác lớp tài sản.\nC. Đúng vì khi danh mục đầu tư được xây dựng và giá trị của nó thay đổi theo lợi nhuận của\ncác loại tài sản và chứng khoán mà nó được đầu tư, trọng số của các loại tài sản sẽ\ndần đi chệch khỏi trọng số chính sách trong việc phân bổ tài sản chiến lược. Quá trình này là\ngọi là trôi dạt. Định kỳ hoặc khi có một ngưỡng sai lệch nhất định so với chính sách\ntrọng số (băng thông) đã bị vi phạm, danh mục đầu tư cần được cân bằng lại về mức\ntrọng số chính sách Bộ quy tắc hướng dẫn quá trình khôi phục danh mục ban đầu\ntiếp xúc với các yếu tố rủi ro hệ thống được gọi là chính sách tái cân bằng.\nQuản lý danh mục đầu tư: mô tả các nguyên tắc xây dựng danh mục đầu tư và vai trò của\nphân bổ tài sản liên quan đến IPS","qhtml":null},{"n":20,"q":"The risk-return trade-off of a portfolio of only risky assets most likely improves when a\nrisk-free asset is added to the portfolio because:","opts":["the risk-free asset is uncorrelated with the other assets in the portfolio.","the lower return on the risk-free asset provides a diversification effect","the correlations among the risky assets decrease, providing a diversification effect."],"ans":"A","expl":"A. Đúng vì danh mục đầu tư của nhà đầu tư sẽ được cải thiện nếu một tài sản không có rủi ro được thêm vào hỗn hợp. Nói cách khác, sự kết hợp giữa tài sản phi rủi ro và tài sản rủi ro có thể mang lại sự đánh đổi lợi nhuận-\nrủi ro tốt hơn so với đầu tư vào chỉ một loại tài sản vì tài sản phi rủi ro\nkhông có mối tương quan với tài sản rủi ro.\nB. Không chính xác vì sự đánh đổi giữa rủi ro và lợi nhuận được cải thiện nhờ rủi ro thấp hơn chứ không phải lợi nhuận thấp hơn. Đó\nlà mối tương quan bằng 0 giữa tài sản phi rủi ro với tài sản rủi ro trong danh mục đầu tư làm giảm\nmức rủi ro.\nC. Không chính xác vì mối tương quan giữa các tài sản rủi ro không bị ảnh hưởng bởi việc bổ sung\ntài sản phi rủi ro vào danh mục đầu tư. Sự đánh đổi giữa rủi ro và lợi nhuận được cải thiện nhờ mối tương quan bằng 0\ncủa tài sản phi rủi ro với tài sản rủi ro trong danh mục đầu tư, chứ không phải sự thay đổi trong\nmối tương quan giữa các tài sản rủi ro.\nQuản lý danh mục đầu tư: mô tả ý nghĩa của việc kết hợp tài sản không rủi ro với\ndanh mục đầu tư tài sản rủi ro","qhtml":null},{"n":21,"q":"Which of the following best describes a potential consequence of the regret-aversion bias\nfor financial market participants?","opts":["Engaging in herding behaviour","Borrowing excessively to finance present consumption","Misidentifying risk tolerances because of how questions about risk tolerance were framed"],"ans":"A","expl":"A. Đúng vì do thành kiến ​​ác cảm hối tiếc, FMPS [những người tham gia thị trường tài chính]\ncó thể tham gia vào hành vi bầy đàn. FMP có thể cảm thấy an toàn hơn trong các khoản đầu tư phổ biến để\nhạn chế những hối tiếc tiềm ẩn trong tương lai. Thành kiến ​​ác cảm hối hận là thành kiến ​​cảm xúc trong đó mọi người có xu hướng\ntránh đưa ra quyết định vì sợ rằng quyết định đó sẽ trở nên tồi tệ\nB. Không chính xác vì đây có thể là hậu quả của thành kiến ​​tự kiểm soát chứ không phải thành kiến ​​ác cảm hối tiếc-\n. Do thành kiến tự kiểm soát, các FMP (những người tham gia thị trường tài chính) có thể\nvay mượn quá mức để tài trợ cho tiêu dùng hiện tại\nC. Không chính xác vì nó có thể là hậu quả của thành kiến đóng khung chứ không phải thành kiến ác cảm-\ndo hối hận. Do kết quả của thành kiến đóng khung, FMP [những người tham gia thị trường tài chính] có thể\nxác định sai mức độ chấp nhận rủi ro bởi vì về cách các câu hỏi về khả năng chấp nhận rủi ro được đóng khung,\ntrở nên ngại rủi ro hơn khi được trình bày với hệ quy chiếu lợi nhuận và tìm kiếm rủi ro nhiều hơn\n khi được trình bày với hệ quy chiếu thua lỗ.\nQuản lý danh mục đầu tư: thảo luận về những thành kiến hành vi thường được công nhận và\ný nghĩa của chúng đối với việc ra quyết định tài chính","qhtml":null},{"n":22,"q":"Cognitive errors:","opts":["stem from impulses and intuition.","result in the same decision as assumed by traditional finance theory.","can often be corrected or eliminated through better information, education, and advice."],"ans":"C","expl":"A. Không chính xác vì những thành kiến về mặt cảm xúc [không phải lỗi nhận thức], mặt khác, khó hơn\nphải sửa chữa vì chúng xuất phát từ sự thôi thúc và trực giác.\nB. Không chính xác vì cả hai dạng thành kiến [nhận thức và cảm xúc], bất kể chúng\nnguồn, có thể khiến các quyết định đi chệch khỏi những gì được giả định bởi lý thuyết tài chính truyền thống.\nC. Đúng vì lỗi nhận thức thường có thể được sửa chữa hoặc loại bỏ thông qua\nthông tin, giáo dục và tư vấn.\nQuản lý danh mục đầu tư: so sánh và đối chiếu các lỗi nhận thức và thành kiến ​​cảm xúc","qhtml":null},{"n":23,"q":"Exchange-traded funds (ETFs):","opts":["are priced once a trading day.","usually pay out dividends to shareholders.","are generally structured as closed-end funds."],"ans":"B","expl":"A. Không chính xác vì ETFS có thể được giao dịch (và được định giá) trong ngày.\nB. Đúng vì cổ tức trên ETFS được trả cho các cổ đông trong khi lẫn nhau\nthường tái đầu tư cổ tức.\nC. Không chính xác vì các quỹ giao dịch trao đổi (ETF) thường được cấu trúc dưới dạng quỹ mở\n.\nQuản lý danh mục đầu tư: mô tả các quỹ tương hỗ và so sánh chúng với\nsản phẩm đầu tư gộp khác","qhtml":null},{"n":24,"q":"Two assets have the following characteristics:\nVariance of returns for Asset 1 0.05\nVariance of returns for Asset 2 0.06\nCorrelation of returns between Asset 1 and Asset 2 0.75\nThe variance of returns for an equally weighted portfolio of the two assets is closest to:","opts":["0.038.","0.048.","0.055."],"ans":"B","expl":"A. Không chính xác vì số hạng cuối cùng đã được nhân đôi, dẫn đến\n𝜎2=(0,5)2(0,05) + (0,5)2 (0,06) + (0,5)(0,5) (0,75) (0,05)0,5 (0,06)0,5= 0,0125\n𝑝\n+0,015+0,0102698 = 0,03777≈0,038.\nB. Đúng vì đối với danh mục đầu tư hai tài sản, biểu thức cho phương sai danh mục đầu tư đơn giản hóa\nthành như sau bằng cách sử dụng tương quan:\n𝜎2=𝑤2𝜎2 +𝑤2𝜎2 +2𝑤 𝑤 𝜌 𝜎 𝜎 trong đó 𝑤 , là trọng số của tài sản / trong danh mục đầu tư, 𝜎2 là\n𝑝 1 1 2 2 1 2 12 1 2 𝑖 𝑖\nphương sai của tài sản và pij là mối tương quan giữa lợi nhuận của tài sản / và j. Ở đây,\n𝜎2=(0,5)2(0,05) + (0,5)2 (0,06) + 2(0,5)(0,5) (0,75) (0,05)0,5 (0,06)0,5= 0,0125 +0,015\n𝑝\n+0,0205396 = 0,04804≈0,048.\nC. Không chính xác vì đây là giá trị trung bình có trọng số của các phương sai nội dung: (0,5)(0,05) +\n(0,5)(0,06) = 0,025 + 0,03 = 0,055. Tuy nhiên, phép tính bình quân gia quyền chỉ\nphù hợp với độ lệch chuẩn danh mục đầu tư (không phải phương sai) khi mối tương quan giữa\ntài sản là 1\nQuản lý danh mục đầu tư: tính toán và giải thích độ lệch chuẩn danh mục đầu tư","qhtml":null},{"n":25,"q":"With respect to return-generating models, statistical factor models:","opts":["only include factors that have economic meaning.","Identify factors that explain the covariance in observed returns.","only include factors that have a fundamental connection to returns."],"ans":"B","expl":"A. Không chính xác vì trong các mô hình nhân tố thống kê, tuy nhiên, các nhân tố thống kê có thể\ncó hoặc không có mối liên hệ kinh tế hoặc cơ bản với lợi nhuận. Hơn nữa, trong thống kê\nmô hình nhân tố, việc khai thác dữ liệu có thể tạo ra nhiều yếu tố giả không có bất kỳ\ný nghĩa kinh tế nào.\nB. Đúng vì trong mô hình nhân tố thống kê, dữ liệu lợi nhuận lịch sử và dữ liệu cắt ngang được\nphân tích để xác định các yếu tố giải thích phương sai hoặc hiệp phương sai trong lợi nhuận quan sát được.\nC. Không chính xác vì trong các mô hình nhân tố thống kê, tuy nhiên, các nhân tố thống kê có thể\ncó hoặc không có mối liên hệ kinh tế hoặc cơ bản với lợi nhuận. Hơn nữa, trong\nmô hình nhân tố thống kê, việc khai thác dữ liệu có thể tạo ra nhiều yếu tố giả không có bất kỳ\ný nghĩa kinh tế nào.\nQuản lý danh mục đầu tư: giải thích các mô hình tạo ra lợi nhuận (bao gồm cả mô hình thị trường) và\ncách sử dụng chúng","qhtml":null},{"n":26,"q":"Which of the following statements about asset allocation is most accurate?","opts":["Investors should diversify their wealth between asset classes in order to eliminate systematic risk.","Investors with a below-average risk tolerance should have an above-average weight in alternative investments.","Adding asset classes with a low correlation to existing asset classes improves an investor's risk-return trade-off."],"ans":"C","expl":"A. Không chính xác vì rủi ro hệ thống là rủi ro liên quan đến hệ thống kinh tế (ví dụ: rủi ro liên quan\nđến chu kỳ kinh doanh) không thể loại bỏ được bằng cách nắm giữ một danh mục đầu tư đa dạng.\nDo đó, việc phân chia tài sản giữa các loại tài sản không thể có rủi ro hệ thống.\nB. Không chính xác vì các nhà đầu tư có mức độ chấp nhận rủi ro dưới mức trung bình nên có tỷ trọng\ndưới mức trung bình trong các khoản đầu tư thay thế Thông thường, việc phân bổ tài sản chiến lược cho các nhà đầu tư không thích rủi ro\nsẽ có tỷ trọng lớn trong trái phiếu chính phủ và tiền mặt, trong khi những người có\nsẵn sàng và có khả năng chấp nhận rủi ro hơn sẽ có nhiều tài sản của họ hơn trong các loại tài sản rủi ro, chẳng hạn như\nnhư cổ phiếu và nhiều loại tài sản thay thế đầu tư\nC. Đúng vì nói chung, việc thêm các loại tài sản có độ tương quan thấp sẽ cải thiện sự đánh đổi lợi nhuận-\n(lợi nhuận cao hơn cho rủi ro tương tự).\nQuản lý danh mục đầu tư: giải thích đặc điểm kỹ thuật của các loại tài sản liên quan đến tài sản\nphân bổ","qhtml":null},{"n":27,"q":"An analyst gathers the following information about a portfolio and the market:\nPortfolio return 7.0%\nMarket return 5.0%\nRisk-free return 1.0%\nPortfolio beta 1.2\nJensen's alpha for the portfolio is:","opts":["0.0%.","1.2%.>","2.2%."],"ans":"B","expl":"A. Không chính xác vì lợi nhuận thị trường được sử dụng thay cho phần bù rủi ro thị trường.\nDo đó, alpha của Jensen = R - [R + (𝛽 * R )] = 7% - (1% + 1,2 x 5% ) = 0,0%.\np f p m\nB. Đúng vì hệ số alpha của Jensen được định nghĩa là lợi nhuận của danh mục đầu tư ít hơn (lãi suất phi rủi ro\ncộng với số lần beta của danh mục đầu tư (lợi nhuận thị trường trừ đi lãi suất phi rủi ro)). Do đó,\nalpha R của Jensen - [R + 𝛽 (R - R)] = 7% — (1% + 1,2 x (5% -1%)) = 7,0% - 5,8% =1,2%\np f p m f\nC. Không chính xác vì điều này bỏ qua lãi suất phi rủi ro ban đầu trong phương trình. Do đó,\nalpha = R - 𝛽 [R - R] = 7% - (1,2 x (5% - 1%)) = 7,0% - 4,8% = 2,2%\np p m f\nQuản lý danh mục đầu tư: tính toán và giải thích tỷ lệ Sharpe, tỷ lệ Treynor, M 2 và\nalpha của Jensen","qhtml":null},{"n":28,"q":"Which of the following behavioral biases is most likely the hardest to correct?","opts":["Hindsight bias","Loss-aversion bias","Representativeness bias"],"ans":"B","expl":"A. Không chính xác vì thành kiến ​​nhận thức muộn là một lỗi nhận thức và các lỗi nhận thức thường có thể được sửa chữa hoặc loại bỏ thông qua thông tin, giáo dục và lời khuyên tốt hơn. Mặt khác, những thành kiến\nvề cảm xúc khó sửa chữa hơn vì chúng xuất phát từ sự thôi thúc và\ntrực giác. Do đó, thường chỉ có thể nhận ra thành kiến ​​cảm xúc và thích nghi với nó.\nThành kiến ​​muộn màng đề cập đến việc tin rằng các sự kiện trong quá khứ là có thể dự đoán được và hợp lý để\nmong đợi. Hành vi này xuất phát từ một thực tế hiển nhiên là những kết quả đã xảy ra\nrõ ràng hơn những kết quả không xảy ra\nB. Đúng vì thành kiến ​​không thích mất mát là thành kiến ​​về mặt cảm xúc, trái ngược với lỗi nhận thức,\nvà các lỗi nhận thức thường có thể được sửa chữa hoặc loại bỏ thông qua thông tin,\ngiáo dục và lời khuyên tốt hơn. Mặt khác, những thành kiến ​​về cảm xúc khó sửa chữa hơn vì\nchúng xuất phát từ sự thôi thúc và trực giác. Vì vậy, thường chỉ có thể nhận ra một thành kiến ​​cảm xúc\nvà thích ứng với nó. Thành kiến ​​không thích thua lỗ đề cập đến xu hướng đặc biệt thích\ntránh thua lỗ hơn là đạt được lợi ích.\nC. Không chính xác vì thành kiến ​​về tính đại diện là một lỗi nhận thức và các lỗi nhận thức thường có thể\nđược sửa chữa hoặc loại bỏ thông qua thông tin, giáo dục và lời khuyên tốt hơn.\nMặt khác, những thành kiến ​​về cảm xúc khó sửa hơn vì chúng xuất phát từ sự thôi thúc\nvà trực giác. Do đó, thường chỉ có thể nhận ra thành kiến cảm xúc và thích nghi với nó.\nThành kiến mang tính đại diện đề cập đến xu hướng phân loại thông tin mới dựa trên\nkinh nghiệm và phân loại trong quá khứ.\nQuản lý danh mục đầu tư: so sánh và đối chiếu các lỗi nhận thức và thành kiến cảm xúc","qhtml":null},{"n":29,"q":"Momentum, defined as relative past stock returns, is most likely a factor in:","opts":["fundamental factor models.","the Carhart four-factor model.","the Fama-French three-factor model."],"ans":"B","expl":"A. Không chính xác vì các mô hình nhân tố cơ bản phân tích và sử dụng mối quan hệ giữa\nlợi nhuận chứng khoán và các nguyên tắc cơ bản cơ bản của công ty, chẳng hạn như thu nhập,\ntăng trưởng thu nhập, tạo dòng tiền, đầu tư vào nghiên cứu, quảng cáo và số lượng\nbằng sáng chế.\nB. Đúng vì Mark Carhart (1997) đã mở rộng mô hình Fama và French bằng cách thêm\nmột yếu tố khác. động lượng, được định nghĩa là lợi nhuận chứng khoán tương đối trong quá khứ. Ví dụ điển hình nhất về ... mô hình a\n[thực tế] là mô hình bốn yếu tố được đề xuất bởi Fama và French (1992) và Carhart\n(1997).\nC. Không chính xác vì Fama và French (1992) đã đề xuất rằng ba yếu tố dường như giải thích\nlợi nhuận tài sản tốt hơn chỉ là rủi ro hệ thống. Ba yếu tố đó là quy mô tương đối,\ngiá trị sổ sách trên thị trường tương đối và phiên bản beta của nội dung. Mark Carhart (1997) đã mở rộng mô hình Fama và\nPháp bằng cách thêm một yếu tố khác, động lượng, được định nghĩa là lợi nhuận chứng khoán tương đối trong quá khứ.\nQuản lý danh mục đầu tư: giải thích các mô hình tạo ra lợi nhuận (bao gồm cả mô hình thị trường) và\ncách sử dụng chúng","qhtml":null},{"n":30,"q":"Which of the following measures uses only systematic risk to evaluate portfolio\nperformance?","opts":["M²","Sharpe ratio","Jensen's alpha"],"ans":"C","expl":"A. Không chính xác vì M² cung cấp thước đo lợi nhuận của danh mục đầu tư được điều chỉnh theo tổng rủi ro\ncủa danh mục đầu tư so với rủi ro của một số tiêu chuẩn\nB. Không chính xác vì thước đo tỷ lệ Sharpe dựa trên tổng rủi ro. Tổng rủi ro có liên quan đến\nnhà đầu tư khi họ nắm giữ một danh mục đầu tư không được đa dạng hóa hoàn toàn, đó không phải là một\ndanh mục đầu tư mong muốn. Trong những trường hợp như vậy, tỷ lệ Sharpe và M² là các thước đo hiệu suất thích hợp\n.\nC. Đúng vì hệ số alpha của Jensen dựa trên rủi ro hệ thống. Sự khác biệt giữa\nlợi nhuận thực tế của danh mục đầu tư và lợi nhuận được điều chỉnh theo rủi ro được tính toán là thước đo hiệu suất\ncủa danh mục đầu tư so với danh mục thị trường và được gọi là Jensen's alpha.\nQuản lý danh mục đầu tư: tính toán và diễn giải tỷ lệ Sharpe, tỷ lệ Treynor, M 2 và\nJensen's alpha","qhtml":null},{"n":31,"q":"When evaluating the return distribution of an asset class, the probability of extreme\nreturns is best assessed by the\ndistribution's:","opts":["kurtosis.","variance.","skewness."],"ans":"A","expl":"A. Đúng vì khi đánh giá các khoản đầu tư chỉ sử dụng giá trị trung bình (lợi nhuận kỳ vọng) và\nphương sai (rủi ro), chúng tôi đang ngầm đưa ra hai giả định quan trọng: 1) rằng lợi nhuận\nđược phân phối bình thường và có thể được mô tả đầy đủ bằng phương tiện và phương sai của chúng và 2) rằng\nthị trường không chỉ hiệu quả về mặt thông tin mà còn hiệu quả về mặt vận hành.\nTrong phạm vi những giả định này bị vi phạm, chúng tôi cần xem xét các đặc điểm đầu tư\nbổ sung. Một trong số đó là kurtosis. Kurtosis đề cập đến những cái đuôi béo hoặc xác suất\nbình thường cao hơn để mang lại lợi nhuận cực cao và có tác dụng làm tăng rủi ro của một tài sản mà\nkhông được nắm bắt trong khuôn khổ phương sai trung bình. Điều này áp dụng cho lợi nhuận tài sản vì một số\nngười tham gia thị trường lưu ý rằng xác suất và mức độ nghiêm trọng của các sự kiện cực đoan\nbị đánh giá thấp và là yếu tố chính góp phần gây ra cuộc khủng hoảng tài chính năm 2008.\nB. Không chính xác vì chỉ sử dụng giá trị trung bình và phương sai sẽ phù hợp để đánh giá các khoản đầu tư\nnếu lợi nhuận được phân phối bình thường. Tuy nhiên, lợi nhuận thường không được phân phối\nvì xác suất xảy ra các sự kiện cực đoan lớn hơn đáng kể so với phân phối chuẩn\ncho thấy. Độ lệch sau được gọi là độ nhọn.\nC. Không chính xác vì độ lệch đề cập đến sự bất đối xứng của phân phối lợi nhuận, nghĩa là\nkết quả trả về không đối xứng xung quanh giá trị trung bình. Độ lệch không đề cập cụ thể đến\nxác suất của các sự kiện cực đoan (và không đo lường nó) mặc dù phân phối\nbị lệch tiêu cực sẽ có phần đuôi bên trái dài hơn so với phân phối thông thường\nQuản lý danh mục đầu tư: mô tả các đặc điểm của các loại tài sản chính mà các nhà đầu tư\nxem xét khi hình thành danh mục đầu tư","qhtml":null},{"n":32,"q":"Robo-advisers most likely","opts":["face high barriers to entry.","cater to the demand from investors with lower levels of investable assets.","prefer actively managed funds to index funds when constructing client portfolios"],"ans":"B","expl":"A. Không chính xác vì phản ánh rào cản gia nhập thấp, các công ty quản lý tài sản lớn đã giới thiệu các giải pháp cố vấn robot để phục vụ một số phân khúc khách hàng nhất định và thu hút một\nthế hệ nhà đầu tư mới\nB. Đúng vì sự tăng trưởng nhanh chóng của tài sản tư vấn robot dựa trên một số xu hướng trong ngành\nbao gồm nhu cầu ngày càng tăng từ 'các nhà đầu tư trẻ và giàu có hơn'. Lời khuyên đầu tư\ntruyền thống thường không đáp ứng được nhu cầu của các nhà đầu tư trẻ và đại chúng giàu có với\nmức tài sản có thể đầu tư tương đối thấp hơn.\nC. Không chính xác vì cố vấn robo thường dựa vào các tùy chọn đầu tư cơ bản vào danh mục đầu tư có mức phí thấp hơn\nchẳng hạn như quỹ chỉ số hoặc quỹ ETF khi xây dựng danh mục đầu tư cho khách hàng\nQuản lý danh mục đầu tư: mô tả các khía cạnh của ngành quản lý tài sản","qhtml":null},{"n":33,"q":"Which of the following is most closely associated with representativeness bias?","opts":["Momentum","The halo effect","Bubbles and crashes"],"ans":"B","expl":"A. Không chính xác vì thành kiến về tính đại diện liên quan đến việc bỏ qua kích thước mẫu, trong đó một\nmẫu nhỏ được cho là đại diện cho một tổng thể, hoặc bỏ qua tỷ lệ cơ sở, trong đó\nThông tin cụ thể được coi là thay thế một xu hướng đã được thiết lập. các thành kiến về tính sẵn có, nhận thức muộn màng và ác cảm mất mát\nB. Đúng vì thành kiến ​​về tính đại diện quy một đặc điểm tích cực là\nđại diện cho một khoản đầu tư tích cực tổng thể. Hiệu ứng hào quang mở rộng sự đánh giá thuận lợi\ncủa một số đặc điểm này sang các đặc điểm khác. Một công ty có thành tích tăng trưởng tốt\nvà hiệu suất giá cổ phiếu tốt trước đó có thể được coi là một khoản đầu tư tốt,\nvới lợi nhuận kỳ vọng cao hơn đặc điểm rủi ro của công ty đó. Chế độ xem này là một dạng\ntính đại diện có thể khiến Nhà đầu tư ngoại suy hiệu quả hoạt động gần đây trong quá khứ thành\nlợi nhuận kỳ vọng\nC. Không chính xác vì bong bóng và sự cố được xác định chặt chẽ về chi phí với sự tự tin thái quá chứ không phải\nthiên vị mang tính đại diện, trong các gói, các nhà đầu tư thường biểu hiện các triệu chứng của sự tự tin quá mức,\ngiao dịch quá mức, đánh giá thấp rủi ro do không đa dạng và bác bỏ\nthông tin mâu thuẫn. Sự tự tin quá mức và giao dịch quá mức góp phần tạo ra bong bóng\ncó liên quan đến thành kiến xác nhận và thành kiến tự quy kết\nQuản lý danh mục đầu tư: mô tả cách mà những thành kiến về hành vi của nhà đầu tư có thể dẫn đến các đặc điểm\nthị trường mà tài chính truyền thống không thể giải thích được","qhtml":null},{"n":34,"q":"Which of the following statements about different types of investors is most accurate?","opts":["For banks, the liquidity of their investments is a paramount concern.","For endowments, investment horizons are short due to their short-term spending needs.","For insurance companies, the risk tolerance of their general and surplus accounts is typically the same."],"ans":"A","expl":"A. Đúng vì tính thanh khoản là mối quan tâm hàng đầu đối với các ngân hàng sẵn sàng đáp ứng\nyêu cầu rút tiền của người gửi tiền.\nB. Không chính xác vì hầu hết các quỹ và tài trợ đều được thành lập với mục đích\ncó được cuộc sống vĩnh viễn. Việc phân bổ lớn cho các khoản đầu tư thay thế chủ yếu phản ánh\nkhoảng thời gian dài của các nguồn tài trợ và quỹ.\nC. Không chính xác vì tài khoản chung của công ty bảo hiểm thường được đầu tư\nmột cách thận trọng vào việc phân bổ đa dạng chứng khoán có thu nhập cố định, trong khi tài khoản thặng dư\ncủa công ty bảo hiểm thường nhắm mục tiêu lợi nhuận cao hơn tài khoản chung và do đó thường đầu tư vào\ncác loại tài sản ít bảo thủ hơn.\nQuản lý danh mục đầu tư: mô tả các loại nhà đầu tư, đặc điểm và nhu cầu đặc biệt\ncủa mỗi","qhtml":null},{"n":35,"q":"Which of the following is most likely undertaken during the risk budgeting process?","opts":["Assessing risk appetite","Setting a limit for value at risk (VAR)","Establishing a reserve to cover potential future losses"],"ans":"B","expl":"A. Không chính xác vì nó mô tả mức độ chấp nhận rủi ro, không phải lập ngân sách rủi ro Mức độ chấp nhận rủi ro Xác định\nmức độ mà tổ chức sẵn sàng chịu tổn thất hoặc chi phí cơ hội và\nkhông đạt được mục tiêu của mình. Trong khi khả năng chấp nhận rủi ro tập trung vào việc chấp nhận rủi ro và\nđiều gì được và không được chấp nhận, thì việc lập ngân sách cho rủi ro lại tập trung cụ thể hơn vào cách xử lý\nrủi ro đó.\nB. Đúng vì việc lập ngân sách rủi ro định lượng và phân bổ rủi ro có thể chấp nhận được bằng các số liệu\ncụ thể. Bốn thước đo đơn chiều nổi tiếng thường được sử dụng là độ lệch\nchuẩn, beta, giá trị rủi ro (VaR) và tổn thất kịch bản\nC. Không chính xác vì nó mô tả hoạt động tự bảo hiểm, một ví dụ về chấp nhận rủi ro chứ không phải việc lập ngân sách\nrủi ro. Tự bảo hiểm là khái niệm chịu rủi ro được coi là không mong muốn nhưng\nquá tốn kém để loại bỏ bằng các biện pháp bên ngoài. Nó có thể liên quan đến việc thành lập một khoản dự trữ để\nbù đắp tổn thất.\nQuản lý danh mục đầu tư: mô tả việc lập ngân sách rủi ro và vai trò của nó trong quản trị rủi ro","qhtml":null},{"n":36,"q":"The portfolio approach to investing most likely.","opts":["prevents portfolio losses during market downturns.","reduces the systematic risk of individual assets in a portfolio.","helps avoid disastrous investment outcomes during normal market conditions."],"ans":"C","expl":"A. Không chính xác vì mặc dù cách tiếp cận danh mục đầu tư giúp tránh được thảm họa bằng cách\nđa dạng hóa, nó không nhất thiết cung cấp sự bảo vệ giảm giá (ngăn ngừa thua lỗ) trong quá trình\nsự suy thoái của thị trường. Lý do chính khiến danh mục đầu tư có thể giảm thiểu rủi ro một cách hiệu quả là\nkết hợp các chứng khoán có lợi nhuận không biến động cùng nhau sẽ mang lại sự đa dạng hóa.\nTuy nhiên, một vấn đề quan trọng là mô hình cùng chuyển động hoặc tương quan của\nLợi nhuận chứng khoán trong danh mục đầu tư có thể thay đổi theo hướng bất lợi cho nhà đầu tư.\nMặc dù đa dạng hóa, danh mục đầu tư khó có thể bảo toàn giá trị trong thời kỳ thị trường suy thoái\nB. Không chính xác vì rủi ro của một tài sản cần được đo lường trong mối tương quan với phần còn lại\nrủi ro hệ thống hoặc rủi ro không thể đa dạng hóa, đây là rủi ro duy nhất ảnh hưởng đến giá trị của tài sản.\ngiá cả. Rủi ro hệ thống là rủi ro không thể tránh khỏi và vốn có của thị trường nói chung. Nó\nkhông thể đa dạng hóa được vì nó bao gồm các yếu tố rủi ro vốn có trong thị trường và\nảnh hưởng đến toàn bộ thị trường. Vì vậy, đa dạng hóa danh mục đầu tư không làm giảm\nrủi ro hệ thống của từng tài sản trong danh mục đầu tư.\nC. Đúng vì đa dạng hóa danh mục đầu tư giúp nhà đầu tư tránh được khoản đầu tư tai hại\nkết quả. Nguyên lý chính của phương pháp đầu tư danh mục đầu tư là đa dạng hóa. Một thảm họa\nkết quả có thể là kết quả của việc 'bỏ hết trứng vào một giỏ' hoặc đầu tư mọi thứ vào\nmột cổ phiếu có giá trị sau đó có thể về 0. Danh mục đầu tư đa dạng bao gồm nhiều chứng khoán\ncó lẽ sẽ tránh được kết quả này. Mặc dù đa dạng hóa có thể không ngăn chặn được tổn thất trong quá trình\nthị trường suy thoái, nó giúp tránh được những kết quả đầu tư tai hại trong thời gian bình thường.\nđiều kiện thị trường.\nQuản lý danh mục đầu tư: mô tả cách tiếp cận danh mục đầu tư","qhtml":null},{"n":37,"q":"A client's time horizon is most\nappropriately used by an investment adviser to determine the client's:","opts":["risk attitude.","ability to take risk.","willingness to take risk."],"ans":"B","expl":"A. Không chính xác vì sự sẵn sàng chấp nhận rủi ro hoặc thái độ rủi ro là một yếu tố chủ quan hơn\ndựa trên tâm lý của khách hàng và có lẽ cả hoàn cảnh hiện tại của họ.\nB. Đúng vì khả năng chịu rủi ro được đo lường chủ yếu dựa trên các yếu tố khách quan,\nchẳng hạn như khoảng thời gian, thu nhập dự kiến ​​và mức độ giàu có so với nợ phải trả.\nC. Không chính xác vì sự sẵn sàng chấp nhận rủi ro hoặc thái độ rủi ro là một yếu tố chủ quan hơn\ndựa trên tâm lý của khách hàng và có lẽ cả hoàn cảnh hiện tại của họ.\nQuản lý danh mục đầu tư: giải thích sự khác biệt giữa sự sẵn lòng và khả năng\n(năng lực) chấp nhận rủi ro trong việc phân tích mức độ chấp nhận rủi ro tài chính của nhà đầu tư","qhtml":null},{"n":38,"q":"Which of the following sections of an investment policy statement most likely provides\nguidance on obtaining feedback on investment results?","opts":["Investment Guidelines","Evaluation and Review","Statement of Duties and Responsibilities"],"ans":"B","expl":"A. Không chính xác vì phần Nguyên tắc đầu tư cung cấp thông tin về cách thực thi chính sách\n(ví dụ: về việc sử dụng đòn bẩy và công cụ phái sinh được phép) và về\ncác loại tài sản cụ thể được loại trừ khỏi đầu tư, nếu có.\nB. Đúng vì phần Đánh giá và Đánh giá cung cấp hướng dẫn về cách thu thập\nphản hồi về kết quả đầu tư.\nC. Không chính xác vì Tuyên bố về Nhiệm vụ và Trách nhiệm nêu chi tiết các nhiệm vụ và\ncủa khách hàng, người giám sát tài sản của khách hàng và người quản lý\nđầu tư.\nQuản lý danh mục đầu tư: mô tả các thành phần chính của IPS","qhtml":null},{"n":39,"q":"The security market line plots the expected return of a portfolio against a measure of the\nportfolio's:","opts":["total risk.","systematic risk.","unsystematic risk."],"ans":"B","expl":"A. Không chính xác vì đường thị trường chứng khoán (SML) là biểu diễn đồ họa của\nmô hình định giá tài sản vốn với phiên bản beta, phản ánh rủi ro hệ thống (không phải rủi ro tổng thể), trên trục x\nvà lợi nhuận kỳ vọng trên trục y. Đường thị trường bảo mật áp dụng cho mọi bảo mật, dù\ncó hiệu quả hay không. Tổng rủi ro và rủi ro hệ thống chỉ bằng nhau đối với các danh mục đầu tư hiệu quả vì những danh mục đầu tư\nđó không còn lại rủi ro có thể đa dạng hóa.\nB. Đúng vì đường thị trường chứng khoán (SML) là biểu diễn bằng đồ họa của mô hình định giá tài sản vốn\nvới phiên bản beta, phản ánh rủi ro hệ thống, trên trục x và lợi nhuận kỳ vọng\ntrên trục y.\nC. Không chính xác vì đường thị trường chứng khoán (SML) là biểu diễn bằng đồ họa của\nmô hình định giá tài sản vốn với phiên bản beta, phản ánh rủi ro hệ thống (không phải rủi ro phi hệ thống), trên\ntrục x và lợi nhuận kỳ vọng trên trục y.\nQuản lý danh mục đầu tư: giải thích mô hình định giá tài sản vốn (CAPM), bao gồm\ngiả định và đường thị trường chứng khoán (SML)","qhtml":null},{"n":40,"q":"An analyst estimates the standard deviation of returns for the market portfolio to be 15%\nand the standard deviation of returns for a stock to be 25%. If the correlation of returns\nbetween the stock and the market portfolio is 0.6, the stock has:","opts":["less systematic risk than the market portfolio.","the same systematic risk as the market portfolio.","more systematic risk than the market portfolio."],"ans":"B","expl":"A. Không chính xác vì công ty có hệ số beta bằng 1, giống với hệ số beta của\ndanh mục đầu tư thị trường.\nB. Đúng vì mức độ rủi ro hệ thống của một công ty được đo bằng\nbeta của cổ phiếu. 𝛽 = 𝜌 ∗ 𝜎 / 𝜎 = 0,60 x 0,25/0,15 = 0,15/0,15 = 1. Vì beta\n𝑖,𝑚 𝑖 𝑚\ncủa công ty bằng với beta của danh mục thị trường (beta của danh mục thị trường với chính nó bằng 1), công ty\ncó cùng mức độ rủi ro hệ thống như danh mục đầu tư thị trường.\nC. Không chính xác vì công ty có hệ số beta bằng 1, giống với hệ số beta của\ndanh mục đầu tư thị trường.\nQuản lý danh mục đầu tư: tính toán và giải thích hệ số beta","qhtml":null},{"n":41,"q":"Risk-averse investors make investment decisions that maximize:","opts":["both return and risk.","return irrespective of risk.","return for the same amount of risk."],"ans":"C","expl":"A. Không chính xác vì nhà đầu tư tìm kiếm rủi ro sẽ tối đa hóa cả rủi ro và lợi nhuận.\nB. Không chính xác vì nhà đầu tư trung lập với rủi ro sẽ tối đa hóa lợi nhuận bất kể rủi ro.\nC. Đúng vì các nhà đầu tư không thích rủi ro đưa ra quyết định đầu tư dựa trên sự đánh đổi giữa rủi ro-lợi nhuận\n, tối đa hóa lợi nhuận cho cùng một rủi ro và giảm thiểu rủi ro cho cùng một lợi nhuận.\nQuản lý danh mục đầu tư: giải thích mức độ tránh rủi ro và ý nghĩa của nó đối với việc lựa chọn danh mục đầu tư","qhtml":null},{"n":42,"q":"Sovereign wealth funds are best described as investment funds:","opts":["owned by governments.","traded as closed-end country funds.","restricted from investing in foreign securities"],"ans":"A","expl":"A. Đúng vì các quỹ tài sản có chủ quyền (SWF) là các quỹ đầu tư thuộc sở hữu của chính phủ\n.\nB. Không chính xác vì các quỹ tài sản có chủ quyền (SWF) là các quỹ đầu tư\nthuộc sở hữu của chính phủ. Quỹ đóng là quỹ tương hỗ trong đó không có khoản tiền đầu tư mới nào được chấp nhận\nvào quỹ. Các nhà đầu tư mới đầu tư bằng cách mua cổ phiếu hiện có và các nhà đầu tư trong quỹ\nthanh lý bằng cách bán cổ phiếu của họ cho các nhà đầu tư khác. Quỹ tương hỗ là một quỹ đầu tư hỗn hợp\ntrong đó mỗi nhà đầu tư trong quỹ đều có quyền yêu cầu theo tỷ lệ về thu nhập và giá trị của\nquỹ. SWF không gộp tiền đầu tư từ các nhà đầu tư và tổ chức cá nhân,\nvà chúng không được giao dịch.\nC. Không chính xác vì các quỹ tài sản có chủ quyền (SWFS) là các quỹ đầu tư\nthuộc sở hữu của chính phủ hoặc các tổ chức đầu tư vào tài sản tài chính hoặc tài sản thực. Để đáp ứng các mục tiêu lợi nhuận\ndài hạn, SWFS đầu tư vào nhiều loại tài sản thực và tài chính hoặc vào các khoản đầu tư\nthay thế. Tên quỹ tài sản \"có chủ quyền\" đề cập đến quyền sở hữu của quỹ chứ không phải\ncác khoản đầu tư được phép của họ.\nQuản lý danh mục đầu tư: mô tả các loại nhà đầu tư cũng như các đặc điểm và nhu cầu đặc biệt\ncủa từng loại","qhtml":null},{"n":43,"q":"Which of the following lines is plotted on a graph with the excess return of a security on\nthe y-axis and the excess return of the market on the x-axis?","opts":["Capital market line","Security market line","Security characteristic line"],"ans":"C","expl":"A. Không chính xác vì đường thị trường vốn là trường hợp đặc biệt của đường phân bổ vốn,\ntrong đó danh mục rủi ro là danh mục thị trường. Đường thị trường vốn được hiển thị trong Phụ lục\n3, trong đó độ lệch chuẩn (𝜎 ), hay tổng rủi ro, nằm trên trục x và danh mục đầu tư dự kiến\n𝑝\nreturn, E(𝑅 ), nằm trên trục y.\n𝑝\nB. Không chính xác vì đường thị trường chứng khoán biểu thị biểu đồ của mô hình định giá tài sản vốn\n. Đường thị trường chứng khoán (SML) là biểu diễn bằng đồ họa của mô hình định giá tài sản vốn\nvới phiên bản beta, phản ánh rủi ro hệ thống, trên trục x và lợi nhuận kỳ vọng trên trục\ny. Sử dụng khái niệm tương tự như đường thị trường vốn, SML cắt trục y tại\ntỷ suất lợi nhuận phi rủi ro và độ dốc của đường này là phần bù rủi ro thị trường, R - R\nm f\nC. Đúng vì tương tự như SML (đường thị trường chứng khoán), chúng ta có thể vẽ một đường đặc tính chứng khoán\n(SCL) cho một chứng khoán. SCL là biểu đồ về lợi nhuận vượt mức của chứng khoán\ntrên lợi nhuận vượt mức của thị trường. Đường đặc tính chứng khoán cũng có thể được ước tính bằng cách\nhồi quy lợi nhuận chứng khoán vượt quá, R - R, trên lợi nhuận thị trường vượt quá, R - R\ni f m f\nQuản lý danh mục đầu tư: mô tả và chứng minh các ứng dụng của CAPM và SML","qhtml":null},{"n":44,"q":"According to capital market theory, the only type of risk that is priced is:","opts":["systematic risk.","diversifiable risk.","idiosyncratic
