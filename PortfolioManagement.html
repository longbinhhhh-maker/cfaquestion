<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following statements about pension plans is most accurate?", "opts": ["Defined benefit plans typically have a low risk tolerance.", "Defined contribution plans typically have a low risk tolerance.", "The sponsor of a defined benefit plan specifies the obligation owed to participants."], "ans": "C", "expl": "A. Incorrect because the risk tolerance for defined benefit pension plans will vary with the\nmaturity of the plan, but is typically quite high.\nB. Incorrect because defined contribution pension plans are managed for individual\ninvestors, therefore the risk tolerance of each plan varies with the individual. Some\nindividuals will be investing for growth and will therefore seek assets that have the potential\nfor capital gains. Others, such as retirees, may need to draw an income from their assets\nand may therefore choose to invest more in fixed-income and dividend-paying shares. The\ninvestment needs of individuals will depend in part on their broader financial circumstances,\nsuch as their employment prospects and whether or not they own their own residence.\nThey may also need to consider such issues as building up a cash reserve and the purchase\nof appropriate insurance policies before undertaking longer-term investments. The risk\ntolerance of an individual investor varies by individual.\nC. Correct because defined benefit pension plans (DB plans) are company-sponsored plans\nthat offer employees a predefined benefit on retirement. The future benefit is defined\nbecause the DB plan requires the plan sponsor to specify the obligation stated in terms of\nthe retirement income benefits owed to participants.\nPortfolio Management: describe defined contribution and defined benefit pension plans", "qhtml": null}, {"n": 2, "q": "The process of risk management is best described as the set of decisions that maximizes a\ncompany's value while:", "opts": ["minimizing the risk taken.", "bearing a tolerable level of risk.", "predicting the potential risk correctly."], "ans": "B", "expl": "A. Incorrect because risk management is not about minimizing risk; it is about actively\nunderstanding and embracing those risks that best balance the achievement of goals with\nan acceptable chance of failure, quantifying the exposure, and continually monitoring and\nmodifying it.\nB. Correct because risk management is the process by which an organization or individual\ndefines the level of risk to be taken, measures the level of risk being taken, and adjusts the\nlatter toward the former, with the goal of maximizing the company's or portfolio's value...\nSaid differently, risk management comprises all the decisions and actions needed to best\nachieve organizational or personal objectives while bearing a tolerable level of risk.\nC. Incorrect because risk management is not even about predicting risks. The Doctrine of No\nSurprises' is a key mantra among many risk managers, but it does not mean they are\nexpected to predict what will happen.\nPortfolio Management: define risk management", "qhtml": null}, {"n": 3, "q": "Which of the following is least consistent with effective risk governance?", "opts": ["Taking an enterprise-wide view", "Defining the enterprise's risk tolerance", "Following a bottom-up process to direct risk management activities"], "ans": "C", "expl": "A. Incorrect because to achieve the best results for an organization, risk governance should\ntake an enterprise-wide view.\nB. Incorrect because good governance should include defining an organization's risk\ntolerance and providing risk oversight.\nC. Correct because risk governance is the top-down [not bottom-up] process and guidance\nthat directs risk management activities to align with and support the overall enterprise.\nPortfolio Management: define risk governance and describe elements of effective risk\ngovernance", "qhtml": null}, {"n": 4, "q": "With regard to an investment policy statement, which of the following statements about\nreturn objectives is most accurate?", "opts": ["A return objective cannot be a required rate of return.", "Return objectives must be set independent of risk objectives.", "When setting a relative return objective, a good benchmark should be investable."], "ans": "C", "expl": "A. Incorrect because a return objective can be a required rate of return. The return objective\ncould be a required return- that is, the amount the investor needs to earn to meet a\nparticular future goal-such as a certain level of retirement income.\nC. Correct because a benchmark is used as a relative return objective and a good benchmark\nshould be investable.\nB. Incorrect because the return objective must be consistent with the client's risk objective\n(high expected returns are unlikely to be possible without high levels of risk)\nPortfolio Management: describe risk and return objectives and how they may be developed\nfor a client", "qhtml": null}, {"n": 5, "q": "The correlation between the risk-free asset and the optimal risky portfolio is expected to\nbe:", "opts": ["negative.", "zero.", "positive."], "ans": "B", "expl": "A. Incorrect because a combination of the risk-free asset and a risky asset can result in a\nbetter risk-return trade-off than an investment in only one type of asset because the risk-\nfree asset has zero correlation with the risky asset. The optimal risky portfolio is a risky\nasset, and thus has zero correlation with the risk-free asset.\nB. Correct because a combination of the risk-free asset and a risky asset can result in a\nbetter risk-return trade-off than an investment in only one type of asset because the risk-\nfree asset has zero correlation with the risky asset. The optimal risky portfolio is a risky\nasset, and thus has zero correlation with the risk-free asset.\nC. Incorrect because a combination of the risk-free asset and a risky asset can result in a\nbetter risk-return trade-off than an investment in only one type of asset because the risk-\nfree asset has zero correlation with the risky asset. The optimal risky portionio is a risky\nasset and thus has zero correlation with the risk-free asset.\nPortfolio Management: describe the implications of combining a risk-free asset with a\nportfolio of risky assets", "qhtml": null}, {"n": 6, "q": "An investor who can lend and borrow at the risk-free rate builds a portfolio using the risk-\nfree asset and the market portfolio. The risk-free rate is 3% and the expected market return is\n15%. If the expected portfolio return is 18%, the investor's portfolio is:", "opts": ["a lending portfolio.", "a leveraged portfolio.", "the optimal risky portfolio."], "ans": "B", "expl": "A. Incorrect because a lending portfolio is a portfolio that has a positive investment in the\nrisk-free asset.\nA portfolio's expected return, E(𝑅 ), is calculated as: E(𝑅 ) = w R + (1 - w₁)E(R ), where w₁ is\n𝑝 𝑝 1 f m\nthe proportion invested in the risk-free asset, returning R, and E(𝑅 ) is the expected return\nf 𝑚\non the market portfolio.\nThus, 0.18 = w x 0.03 + (1 - w₁) x 0.15\n1\n0.18 - 0.15W = w x (0.03 - 0.15)\n1\n0.03 = w x (-0.12)\n1\nw₁ = 0.03/(-0.12)\nW₁ = -0.25\nA negative proportion invested in the risk-free rate implies a leveraged, not a lending,\nportfolio.\nB. Correct because a leveraged portfolio is a portfolio that has a negative investment in the\nrisk-free asset.\nA portfolio's expected return, E(R), is calculated as: E(R) = w₁R,+ (1 - w₁)E(R), where w, is the\nproportion invested in the risk-free asset, returning R,, and E(R) is the expected return on\nthe market portfolio.\nThus, 0.18 = w x 0.03 + (1 - w₁) x 0.15\n1\n0.18 - 0.15 = w (0.03 - 0.15)\n1\n0.03 = w x (-0.12)\n1\nw₁ = 0.03/(-0.12)\nW₁ =-0.25\nA negative proportion invested in the risk-free rate implies a leveraged portfolio.\nC. Incorrect because the expected market return is 15%, while the expected portfolio return\nis 18%. Since the two returns are different, the investor's portfolio is different from the\noptimal risky (market) portfolio.\nPortfolio Management: explain the capital allocation line (CAL) and the capital market line\n(CML)", "qhtml": null}, {"n": 7, "q": "An analyst gathers the following information about a company:\nPayables turnover 8\nInventory turnover 2\nReceivables turnover 10\nIf all purchases and sales were made on credit, the cash conversion cycle (based on a 360-day\nyear) is:", "opts": ["less than the utility generated for a risk-averse investor.", "equal to the utility generated for a risk-averse investor.", "greater than the utility generated for a risk-averse investor."], "ans": "B", "expl": "A. Incorrect because a risk-free asset (𝜎2 = 0) generates the same utility for all individuals\nB. Correct because a risk-free asset (𝜎2 = 0) generates the same utility for all individuals. If\n𝜎2 = 0, then U = E(r) - 1/2(A)( 𝜎2) = E(r) for all individuals\nC. Incorrect because a risk-free asset (𝜎2 = 0) generates the same utility for all individuals.\nPortfolio Management: explain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 8, "q": "A risk-neutral investor most likely seeks to maximize:", "opts": ["both risk and return.", "return irrespective of risk.", "return for a given level of risk."], "ans": "B", "expl": "A. Incorrect because a risk-seeking investor would maximize both risk and return. A risk-\nneutral investor maximizes return irrespective of risk. That is, a risk-neutral investor\ndeliberately seeks to maximize only return, not risk. It is possible that a risk-neutral investor\ncould end up maximizing risk by maximizing return, but he only seeks to maximize return\nand risk is not a consideration\nB. Correct because A risk-neutral investor would maximize return irrespective of risk. This is\nbecause such an investor cares only about return and not about risk, so higher return\ninvestments are more desirable even if they come with higher risk.\nC. Incorrect because only risk-averse investors want to minimize their risk for the same\namount of return, and maximize their return for the same amount of risk. A risk-neutral\ninvestor seeks to maximize return irrespective of risk, not for a given level of risk.\nPortfolio Management: explain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 9, "q": "An analyst gathers the following information (in € millions) about a company before any\nrevaluations.\nAverage total assets 20\nAverage total liabilities 8\nAverage total equity 12\nAn initial revaluation increases the carrying value of the asset valued under the revaluation\nmodel. Ignoring taxes, the financial leverage ratio most likely", "opts": ["3.6%.", "5.6%.", "11.6%"], "ans": "A", "expl": "A. Correct\nCorrect because provides a measure of portfolio return that is adjusted for the total risk of\nthe portfolio and is computed as𝑀2 = [E(𝑅 ) - R(𝜎 ∕𝜎 ) + 𝑅 = SR x 𝜎 + 𝑅 , where SR =\n𝑝 𝑚 𝑝 𝑡 𝑚 𝑡\nSharpe ratio, 𝜎 = market standard deviation of returns, and R,= risk-free rate. Thus, 𝑀2 =\n𝑚\n0.8 x 0.12 + 0.02 0.116. The difference between the risk- adjusted performance of the\nportfolio and the performance of the market is frequently referred to as 𝑀2 alpha. Thus,\n𝑀2alpha = 0.116 -0.08 -0.0363.6%.\nB. Incorrect because it computes M² = 0.02+0.8 x 0.12 = 0.116. M² alpha is wrongly\ncalculated as 0.116 - (0.08 - 0.02) = 0.056 ≈ 5.6%.\nC. Incorrect because it computes M² instead of M² alpha, which is an intermediate step in\nthe correct calculation: M² = 0.02 + 0.8 x 0.12 = 0.116 ≈ 11.6%.\nPortfolio Management: calculate and interpret the Sharpe ratio, Treynor ratio, M 2, and\nJensen's alpha", "qhtml": null}, {"n": 10, "q": "Which of the following is most likely a consequence of overconfidence bias? Investors:", "opts": ["holding poorly diversified portfolios.", "continuing to hold classes of assets with which they are familiar.", "holding investments in a loss position longer than justified, in the hope that they will return to breakeven."], "ans": "A", "expl": "A. Correct because overconfidence bias is a bias in which people demonstrate unwarranted\nfaith in their own abilities. As a result of overconfidence bias, FMPs (financial market\nparticipants] may hold poorly diversified portfolios, which may result in significant downside\nrisk.\nB. Incorrect because this is a potential consequence of endowment bias, not overconfidence\nbias. Endowment bias is an emotional bias in which people value an asset more when they\nown it than when they do not. Endowment bias may lead FMPs (financial market\nparticipants] to continue to hold classes of assets with which they are familiar. FMPs may\nbelieve they understand the characteristics of the investments they already own and may\nbe reluctant to purchase assets with which they have less experience Familiarity adds to\nowners perceived value of a security.\nC. Incorrect because this is a potential consequence of loss-aversion bias, not\noverconfidence. As a result of loss- aversion bias, FMPs (financial market participants] may\nhold investments in a loss position longer than justified by fundamental analysis, in the hope\nthat they will return to breakeven\nPortfolio Management: discuss commonly recognized behavioral biases and their\nimplications for financial decision making", "qhtml": null}, {"n": 11, "q": "Failing to act in pursuit of long-term goals in favor of short-term satisfaction best\ndescribes which of the following emotional biases?", "opts": ["Self-control bias", "Endowment bias", "Loss-aversion bias"], "ans": "A", "expl": "A. Correct because self-control bias is a bias in which people fall to act in pursuit of their\nlong-term, overarching goals in favor of short-term satisfaction.\nB. Incorrect because endowment bias is an emotional bias in which people value an asset\nmore when they own it than when they do not, and is not about acting in favor of short-\nterm satisfaction the cost of long-term goals.\nC. Incorrect because loss-aversion bias refers to the tendency to strongly prefer avoiding\nlosses to achieving gains, and is not about acting in favor of short-term satisfaction at the\ncost of long-term goals.\nPortfolio Management: discuss commonly recognized behavioral biases and their\nimplications for financial decision making", "qhtml": null}, {"n": 12, "q": "When creating a long-only portfolio, which of the following correlation coefficients\nbetween assets would be most effective at reducing portfolio risk?", "opts": ["- 0.5.", "0.", "0.5."], "ans": "A", "expl": "A. Correct because -05 is the smallest of the three correlations and the closer the\ncorrelation coefficient is to -1. the greater the reduction in portfolio risk. The correlation\ncoefficient between two assets determines the effect on portfolio risk when the two assets\nare combined. You will find that portfolio risk is unaffected when the two assets are\nperfectly correlated (p₁₂ = +1). In other words, the portfolio's standard deviation is simply a\nweighted average of the standard deviations of the two assets and as such a portfolio's risk\nis unchanged with the addition of assets with the same risk parameters. Portfoho risk falls,\nhowever, when the two assets are not perfectly correlated (p₁₂) <+1) Sufficiently low values\nof the correlation coefficient can make the portfolio riskless under certain conditions. For an\nextreme case in which p₁₂ = -1 (that is, the two asset returns move in opposite directions),\nthe portfolio can be made risk free Analytically, the standard deviation risk of a two asset\nportfolio is given by the square root of the portfolio's variance: 𝜎 =(𝑤2𝜎2 +𝑤2𝜎2 +\n𝑃 1 1 1 1\n2𝑤 𝑤 𝑝 𝜎 𝜎 ) 1/2 which is a strictly increasing function of p₁₂ Hence, -0.5, the smallest of\n1 2 12 1 2\nthe three correlations, has the lowest risk.\nB. Incorrect because the correlation coefficient is not the lowest of the three options. The\ncloser the correlation coefficient is to -1, the greater the reduction in portfolio risk Portfolio\nrisk falls when the two assets are not perfectly correlated (𝑝 <+1). Sufficiently low values of\n12\nthe correlation coefficient can make the portfolio riskless under certain conditions. For an\nextreme case in which p₁₂ = -1 (that is, the two asset returns move in opposite directions),\nthe portfolio can be made risk free.\nC. Incorrect because the correlation coefficient is not the lowest of the three options. The\ncloser the correlation coefficient is to -1. the greater the reduction in portfolio risk \"Portfolio\nrisk falls when the two assets are not perfectly correlated (𝑝 < +1). Sufficiently low values\n12\nof the correlation coefficient can make the portfolio riskless under certain conditions. For an\nextreme case in which 𝑝 = -1 (that is, the two asset returns move in opposite directions),\n12\nthe portfolio can be made risk free.\nPortfolio Management: describe the effect on a portfolio's risk of investing in assets that\nare less than perfectly correlated", "qhtml": null}, {"n": 13, "q": "Which of the following can best be explained by overconfidence when predicting\ncompanies' earnings growth rates?", "opts": ["Base-rate neglect", "The value anomaly", "The disposition effect"], "ans": "B", "expl": "A. Incorrect because, in base-rate neglect, a phenomenon's rate of incidence in a larger\npopulation-its base rate -is neglected in favor of specific information. The specific, individual\ninformation may be misleading relative to the more appropriate base rate or general\ninformation. Base-rate neglect is connected to representativeness bias and not\noverconfidence, nor does it relate to earnings growth rates\nB. Correct because a number of other studies have offered behavioral explanations for\nvalue anomalies presenting the anomalies as mispricing rather than compensation for\nincreased risk. These studies recognize the emotional factors involved in appraising stocks.\nOverconfidence can also be involved in predicting growth rates, potentially leading growth\nstocks to be overvalued, leading to the value anomaly\nC. Incorrect because an important concept embedded in this utility representation is what\nhas been termed the disposition effect the holding of investments that have experienced\nlosses too long, and the selling of investments that have experienced gains too quickly (ie,\nholding on to losers and selling winners). The disposition effect does not relate to prediction\nerrors, not to earnings growth rates.\nPortfolio Management: describe how behavioral biases of investors can lead to market\ncharacteristics that may not be explained by traditional finance", "qhtml": null}, {"n": 14, "q": "Which of the following is most likely developed by combining a client's investment\nobjectives and constraints with long-term capital market expectations?", "opts": ["Risk budget", "Strategic asset allocation", "Investment policy statement"], "ans": "B", "expl": "A. Incorrect because risk budgeting is the process of deciding on the amount of risk to\nassume in a portfolio (the overall risk budget), and subdividing that risk over the sources of\ninvestment return (e.g.. strategic asset allocation, tactical asset allocation, and security\nselection). Because the decision about the amount of risk to be taken is made in\nconstructing the IPS, at this stage we are concerned about the subdivision of that risk.\nB. Correct because a strategic asset allocation results from combining the constraints and\nobjectives articulated in the IPS [investment policy statement] and long-term capital market\nexpectations regarding the asset classes.\nC. Incorrect because long-term capital market expectations are not commonly stated in the\nIPS, which in addition to Investment Objectives and Investment Constraints typically\nincludes the following sections: Introduction, Statement of Purpose, Statement of Duties\nand Responsibilities, Procedures, Investment Guidelines, Evaluation and Review,\nAppendices. Therefore, combining investment objectives and constraints with long-term\ncapital market expectations does not result in a client's IPS.\nPortfolio Management describe the principles of portfolio construction and the role of asset\nallocation in relation to the IPS", "qhtml": null}, {"n": 15, "q": "The diversification ratio of a portfolio is best described as the ratio of the:", "opts": ["standard deviation of the equally weighted portfolio's returns to the average standard deviation of the individual securities' returns.", "standard deviation of the market-capitalization-weighted portfolio's returns to the standard deviation of the equally weighted portfolio's returns.", "average standard deviation of the individual securities' returns to the standard deviation of the market-capitalization- weighted portfolio's returns."], "ans": "A", "expl": "A. Correct because a simple measure of the value of diversification is calculated as the ratio\nof the standard deviation of the equally weighted portfolio to the standard deviation of the\nrandomly selected security. This ratio may be referred to as the diversification ratio. In the\nexample of the 5-stock portfolio given, the equally weighted portfolio's standard deviation is\napproximately 71 percent of the average standard deviation of the 5 stocks (24.9%); ie., the\ndenominator is the average standard deviation of all individual securities in the portfolio\nand the numerator is the standard deviation of the equally weighted portfolio.\nB. Incorrect because the standard deviation of the equally weighted portfolio should be the\nnumerator (not the denominator) and the denominator should be the average standard\ndeviation of all individual securities in the portfolio.\nC. Incorrect because the average standard deviation of all individual securities in the\nportfolio should be the denominator (not the numerator) and the numerator should be the\nstandard deviation of the equally weighted portfolio.\nPortfolio Management: describe the portfolio approach to investing", "qhtml": null}, {"n": 16, "q": "In regard to the asset allocation process, a top-down analysis most likely begins with an\nexamination of", "opts": ["macroeconomic growth.", "a company's board of directors.", "the expected growth of a company's competitors."], "ans": "A", "expl": "A. Correct because a top-down analysis begins with consideration of macroeconomic\nconditions. Based on the current and forecasted economic environment, analysts evaluate\nmarkets and industries with the purpose of investing in those that are expected to perform\nwell. Finally specific companies within these industries are considered for investment.\nB. Incorrect because a top-down analysis begins with consideration of macroeconomic\nconditions. Bottom-up analysis focuses on company specifics. Rather than emphasizing\neconomic cycles or industry analysis, a bottom-up analysis focuses on company-specific\ncircumstances, such as management quality and business prospects\nC. Incorrect because a top-down analysis begins with consideration of macroeconomic\nconditions. Bottom-up analysis focuses on company specifics. Rather than emphasizing\neconomic cycles or industry analysis, a bottom-up analysis focuses on company-specific\ncircumstances, such as management quality and business prospects.\nPortfolio Management: describe the steps in the Portfolio Management: process", "qhtml": null}, {"n": 17, "q": "Which of the following is most likely a consequence of the illusion of control bias?", "opts": ["An investor's portfolio turnover is too low.", "The investor's portfolio contains concentrated positions in companies.", "An investor uses a simple forecasting model for portfolio construction."], "ans": "B", "expl": "A. Incorrect because as a result of illusion of control bias, FMPS (financial market\nparticipants] may trade more than is prudent. Researchers have found that portfolio\nturnover is negatively correlated with investment returns\nB. Correct because as a result of illusion of control bias, FMPS [financial market participants]\nmay inadequately diversify portfolios. Research has found that some investors prefer to\ninvest in companies that they feel they have control over, such as the companies they work\nfor, leading them to hold concentrated positions.\nC. Incorrect because as a result of illusion of control bias, FMPS (financial market\nparticipants] may construct financial models and forecasts that are overly detailed. FMPs\nmay require detailed models before making an investment decision, believing that forecasts\nfrom these models control uncertainty. Although a greater understanding of an investment,\nissuer, or industry is often useful, increased model complexity does not control the inherent\nrisk and uncertainty of investment outcomes.\nPortfolio Management: discuss commonly recognized behavioral biases and their\nimplications for financial decision making", "qhtml": null}, {"n": 18, "q": "Which of the following is best classified as a non-financial risk?", "opts": ["Credit risk", "Liquidity risk", "Accounting risk"], "ans": "C", "expl": "A. Incorrect because the second primary financial risk is credit risk. Credit risk is the risk of\nloss if one party fails to pay an amount owed on an obligation, such as a bond, loan, or\nderivative to another party.\nB. Incorrect because liquidity risk is a financial risk and defined as the risk of a significant\ndownward valuation adjustment when selling a financial asset.\nC. Correct because although most risks have monetary consequences, there are a number of\nrisks that are typically classified as non-financial in nature. These risks arise from a variety of\nsources, such as the relationship between the entity and counterparties, regulators,\ngovernments, the environment, suppliers, customers, and employees The following three\nnon-financial risks are related: regulatory risk, accounting risk, and tax risk. They could even\nbe collectively referred to as compliance risk because they all deal with the matter of\nconforming to policies, laws, rules, and regulations as set forth by governments and\nauthoritative bodies, such as accounting governing boards.\nPortfolio Management: identify financial and non-financial sources of risk and describe how\nthey may interact", "qhtml": null}, {"n": 19, "q": "Portfolio rebalancing is best described as a process aimed at:", "opts": ["generating alpha.", "aligning portfolio weights with the tactical asset allocation decision.", "restoring the portfolio's original exposures to systematic risk factors."], "ans": "C", "expl": "A. Incorrect because periodically, or when a certain threshold deviation from the policy\nweight (the bandwidth) has been breached, the portfolio should be rebalanced back to the\npolicy weights. The risk-return profile of the strategic asset allocation depends on the\nexpected returns and risks of the individual asset classes, as well as the correlation between\nthose asset classes. On the other hand, security selection is an attempt to generate higher\nreturns than the asset class benchmark by selecting securities with a higher expected\nreturn. An \"alpha process is a process for adding value through active investing.\nB. Incorrect because periodically, or when a certain threshold deviation from the policy\nweight (the bandwidth) has been breached, the portfolio should be rebalanced back to the\npolicy weights. On the other hand, tactical asset allocation is the decision to deliberately\ndeviate from the policy exposures to systematic risk factors (l.e., the policy weights of asset\nclasses) with the intent to add value based on forecasts of the near-term returns of those\nasset classes.\nC. Correct because as the portfolio is constructed and its value changes with the returns of\nthe asset classes and securities in which it is invested, the weights of the asset classes will\ngradually deviate from the policy weights in the strategic asset allocation. This process is\nreferred to as drift. Periodically, or when a certain threshold deviation from the policy\nweight (the bandwidth) has been breached, the portfolio should be rebalanced back to the\npolicy weights. The set of rules that guide the process of restoring the portfolio's original\nexposures to systematic risk factors is known as the rebalancing policy.\nPortfolio Management: describe the principles of portfolio construction and the role of\nasset allocation in relation to the IPS", "qhtml": null}, {"n": 20, "q": "The risk-return trade-off of a portfolio of only risky assets most likely improves when a\nrisk-free asset is added to the portfolio because:", "opts": ["the risk-free asset is uncorrelated with the other assets in the portfolio.", "the lower return on the risk-free asset provides a diversification effect", "the correlations among the risky assets decrease, providing a diversification effect."], "ans": "A", "expl": "A. Correct because an investor's portfolio improves if a risk-free asset is added to the mix. In\nother words, a combination of the risk-free asset and a risky asset can result in a better risk-\nreturn trade-off than an investment in only one type of asset because the risk-free asset has\nzero correlation with the risky asset.\nB. Incorrect because the risk-return trade-off is improved by lower risk not a lower return. It\nis the zero correlation of the risk-free asset with the risky assets in the portfolio that lowers\nthe risk level.\nC. Incorrect because the correlations among the risky assets are unaffected by the addition\nof a risk-free asset to the portfolio. The risk-return trade-off is improved by the zero\ncorrelation of the risk-free asset with the risky assets in the portfolio, not a change in\ncorrelations among the risky assets.\nPortfolio Management: describe the implications of combining a risk-free asset with a\nportfolio of risky assets", "qhtml": null}, {"n": 21, "q": "Which of the following best describes a potential consequence of the regret-aversion bias\nfor financial market participants?", "opts": ["Engaging in herding behaviour", "Borrowing excessively to finance present consumption", "Misidentifying risk tolerances because of how questions about risk tolerance were framed"], "ans": "A", "expl": "A. Correct because as a result of regret-aversion bias, FMPS [financial market participants]\nmay engage in herding behavior. FMPs may feel safer in popular investments in order to\nlimit potential future regret. Regret-aversion bias is an emotional bias in which people tend\nto avoid making decisions out of fear that the decision will turn out poorly\nB. Incorrect because it is a likely consequence of the self-control bias, and not the regret-\naversion bias. As a result of self-control bias, FMPs (financial market participants] may\nborrow excessively to finance present consumption\nC. Incorrect because it is a likely consequence of the framing bias, and not the regret-\naversion bias. As a result of framing bias, FMPs [financial market participants] may\nmisidentify risk tolerances because of how questions about risk tolerance were framed,\nbecoming more risk-averse when presented with a gain frame of reference and more risk-\nseeking when presented with a loss frame of reference.\nPortfolio Management: discuss commonly recognized behavioral biases and their\nimplications for financial decision making", "qhtml": null}, {"n": 22, "q": "Cognitive errors:", "opts": ["stem from impulses and intuition.", "result in the same decision as assumed by traditional finance theory.", "can often be corrected or eliminated through better information, education, and advice."], "ans": "C", "expl": "A. Incorrect because emotional biases [not cognitive errors], on the other hand, are harder\nto correct because they stem from impulses and intuitions.\nB. Incorrect because both forms of bias [cognitive and emotional], regardless of their\nsource, may cause decisions to deviate from what is assumed by traditional finance theory\nC. Correct because cognitive errors can often be corrected or eliminated through better\ninformation, education, and advice.\nPortfolio Management: compare and contrast cognitive errors and emotional biases", "qhtml": null}, {"n": 23, "q": "Exchange-traded funds (ETFs):", "opts": ["are priced once a trading day.", "usually pay out dividends to shareholders.", "are generally structured as closed-end funds."], "ans": "B", "expl": "A. Incorrect because ETFS can be transacted (and are priced) intraday.\nB. Correct because dividends on ETFS are paid out to the shareholders whereas mutual\nfunds usually reinvest the dividends.\nC. Incorrect because exchange-traded funds (ETFs) are generally structured as open-end\nfunds.\nPortfolio Management: describe mutual funds and compare them with other pooled\ninvestment products", "qhtml": null}, {"n": 24, "q": "Two assets have the following characteristics:\nVariance of returns for Asset 1 0.05\nVariance of returns for Asset 2 0.06\nCorrelation of returns between Asset 1 and Asset 2 0.75\nThe variance of returns for an equally weighted portfolio of the two assets is closest to:", "opts": ["0.038.", "0.048.", "0.055."], "ans": "B", "expl": "A. Incorrect because the last term has been doubled, leading to\n𝜎2=(0.5)2(0.05) + (0.5)2 (0.06) + (0.5)(0.5) (0.75) (0.05)0.5 (0.06)0.5= 0.0125\n𝑝\n+0.015+0.0102698 = 0.03777≈0.038.\nB. Correct because for a two asset portfolio, the expression for portfolio variance simplifies\nto the following using correlation:\n𝜎2=𝑤2𝜎2 +𝑤2𝜎2 +2𝑤 𝑤 𝜌 𝜎 𝜎 where 𝑤 , is the weight of asset / in the portfolio, 𝜎2 is\n𝑝 1 1 2 2 1 2 12 1 2 𝑖 𝑖\nthe variance of asset, and pij is the correlation between the returns of assets / and j. Here,\n𝜎2=(0.5)2(0.05) + (0.5)2 (0.06) + 2(0.5)(0.5) (0.75) (0.05)0.5 (0.06)0.5= 0.0125 +0.015\n𝑝\n+0.0205396 = 0.04804≈0.048.\nC. Incorrect because it is the weighted average of the asset variances: (0.5)(0.05) +\n(0.5)(0.06) = 0.025 + 0.03 = 0.055. However, a weighted average calculation is only\nappropriate for the portfolio standard deviation (not variance) when the correlation among\nassets is 1\nPortfolio Management: calculate and interpret portfolio standard deviation", "qhtml": null}, {"n": 25, "q": "With respect to return-generating models, statistical factor models:", "opts": ["only include factors that have economic meaning.", "Identify factors that explain the covariance in observed returns.", "only include factors that have a fundamental connection to returns."], "ans": "B", "expl": "A. Incorrect because in statistical factor models, the statistical factors, however, may or may\nnot have an economic or fundamental connection to returns. Furthermore, in statistical\nfactor models data mining may generate many spurious factors that are devoid of any\neconomic meaning.\nB. Correct because in a statistical factor model, historical and cross-sectional return data are\nanalyzed to identify factors that explain variance or covariance in observed returns.\nC. Incorrect because in statistical factor models, the statistical factors, however, may or may\nnot have an economic or fundamental connection to returns. Furthermore, in statistical\nfactor models data mining may generate many spurious factors that are devoid of any\neconomic meaning.\nPortfolio Management: explain return generating models (including the market model) and\ntheir uses", "qhtml": null}, {"n": 26, "q": "Which of the following statements about asset allocation is most accurate?", "opts": ["Investors should diversify their wealth between asset classes in order to eliminate systematic risk.", "Investors with a below-average risk tolerance should have an above-average weight in alternative investments.", "Adding asset classes with a low correlation to existing asset classes improves an investor's risk-return trade-off."], "ans": "C", "expl": "A. Incorrect because systematic risk is risk related to the economic system (e.g., risk related\nto business cycle) that cannot be eliminate the eliminated by holding a diversified portfolio.\nThus, dividing wealth between asset classes cannot systematic risk.\nB. Incorrect because investors with below-average risk tolerance should have below-average\nweights in alternative investments Typically, the strategic asset allocation for risk-averse\ninvestors will have a large weight in government bonds and cash, whereas those with more\nwillingness and ability to take risk will have more of their assets in risky asset classes, such\nas equities and many types of alternative investments\nC. Correct because in general, adding assets classes with low correlation improves the risk-\nreturn trade-off (more return for similar risk).\nPortfolio Management: explain the specification of asset classes in relation to asset\nallocation", "qhtml": null}, {"n": 27, "q": "An analyst gathers the following information about a portfolio and the market:\nPortfolio return 7.0%\nMarket return 5.0%\nRisk-free return 1.0%\nPortfolio beta 1.2\nJensen's alpha for the portfolio is:", "opts": ["0.0%.", "1.2%.>", "2.2%."], "ans": "B", "expl": "A. Incorrect because the market return is used instead of the market risk premium.\nTherefore, Jensen's alpha = R - [R + (𝛽 * R )] = 7% - (1% + 1.2 x 5% ) = 0.0%.\np f p m\nB. Correct because Jensen's alpha is defined as the portfolio return less (the risk-free rate\nplus the portfolio beta times (the market return minus the risk-free rate)). Therefore,\nJensen's alpha R - [R + 𝛽 (R - R)] = 7% — (1% + 1.2 x (5% -1%)) = 7.0% - 5.8% =1.2%\np f p m f\nC. Incorrect because this omits the initial risk-free rate in the equation. Therefore, Jensen's\nalpha = R - 𝛽 [R - R] = 7% - (1.2 x (5% - 1%)) = 7.0% - 4.8% = 2.2%\np p m f\nPortfolio Management: calculate and interpret the Sharpe ratio, Treynor ratio, M 2, and\nJensen's alpha", "qhtml": null}, {"n": 28, "q": "Which of the following behavioral biases is most likely the hardest to correct?", "opts": ["Hindsight bias", "Loss-aversion bias", "Representativeness bias"], "ans": "B", "expl": "A. Incorrect because hindsight bias is a cognitive error and cognitive errors can often be\ncorrected or eliminated through better information, education, and advice. Emotional\nbiases, on the other hand, are harder to correct because they stem from impulses and\nintuitions. Thus, It is often possible only to recognize an emotional bias and adapt to it.\nHindsight bias refers to believing past events as having been predictable and reasonable to\nexpect. This behavior results from the obvious fact that outcomes that did occur are more\nreadily evident than outcomes that did not\nB. Correct because loss-aversion bias is an emotional bias, as opposed to a cognitive error,\nand cognitive errors can often be corrected or eliminated through better information,\neducation, and advice. Emotional biases, on the other hand, are harder to Correct because\nthey stem from Impulses and intuitions. Thus, it is often possible only to recognize an\nemotional bias and adapt to it. Loss-aversion bias refers to the tendency to strongly prefer\navoiding losses to achieving gains.\nC. Incorrect because representativeness bias is a cognitive error and cognitive errors can\noften be corrected or eliminated through better information, education, and advice.\nEmotional biases, on the other hand, are harder to correct because they stem from impulses\nand intuitions. Thus, it is often possible only to recognize an emotional bias and adapt to it.\nRepresentativeness bias refers to the tendency to classify new information based on past\nexperiences and classifications.\nPortfolio Management: compare and contrast cognitive errors and emotional biases", "qhtml": null}, {"n": 29, "q": "Momentum, defined as relative past stock returns, is most likely a factor in:", "opts": ["fundamental factor models.", "the Carhart four-factor model.", "the Fama-French three-factor model."], "ans": "B", "expl": "A. Incorrect because fundamental factor models analyze and use relationships between\nsecurity returns and the company's underlying fundamentals, such as, for example, earnings,\nearnings growth, cash flow generation, investment in research, advertising, and number of\npatents.\nB. Correct because Mark Carhart (1997) extended the Fama and French model by adding\nanother factor. momentum, defined as relative past stock returns. The best example of ... a\n[practical] model is the four-factor model proposed by Fama and French (1992) and Carhart\n(1997).\nC. Incorrect because Fama and French (1992) proposed that three factors seem to explain\nasset returns better than just systematic risk. Those three factors are relative size, relative\nbook-to-market value, and beta of the asset. Mark Carhart (1997) extended the Fama and\nFrench model by adding another factor, momentum, defined as relative past stock returns.\nPortfolio Management: explain return generating models (including the market model) and\ntheir uses", "qhtml": null}, {"n": 30, "q": "Which of the following measures uses only systematic risk to evaluate portfolio\nperformance?", "opts": ["M²", "Sharpe ratio", "Jensen's alpha"], "ans": "C", "expl": "A. Incorrect because M² provides a measure of portfolio return that is adjusted for the total\nrisk of the portfolio relative to that of some benchmark\nB. Incorrect because the Sharpe ratio measure is based on total risk. Total risk is relevant for\nan investor when he or she holds a portfolio that is not fully diversified, which is not a\ndesirable portfolio. In such cases, the Sharpe ratio and M² are appropriate performance\nmeasures.\nC. Correct because Jensen's alpha is based on systematic risk. The difference between the\nactual portfolio return and the calculated risk-adjusted return is a measure of the portfolio's\nperformance relative to the market portfolio and is called Jensen's alpha.\nPortfolio Management: calculate and interpret the Sharpe ratio, Treynor ratio, M 2, and\nJensen's alpha", "qhtml": null}, {"n": 31, "q": "When evaluating the return distribution of an asset class, the probability of extreme\nreturns is best assessed by the\ndistribution's:", "opts": ["kurtosis.", "variance.", "skewness."], "ans": "A", "expl": "A. Correct because in evaluating investments using only the mean (expected return) and\nvariance (risk), we are implicitly making two important assumptions: 1) that the returns are\nnormally distributed and can be fully characterized by their means and variances and 2) that\nmarkets are not only informationally efficient but that they are also operationally efficient.\nTo the extent that these assumptions are violated, we need to consider additional\ninvestment characteristics. One of them is kurtosis. Kurtosis refers to fat tails or higher than\nnormal probabilities for extreme returns and has the effect of increasing an asset's risk that\nis not captured in a mean- variance framework. This applies to asset returns as several\nmarket participants note that the probability and the magnitude of extreme events is\nunderappreciated and was a primary contributing factor to the financial crisis of 2008.\nB. Incorrect because using only mean and variance would be appropriate to evaluate\ninvestments if returns were distributed normally. Returns, however, are not normally\ndistributed because the probability of extreme events is significantly greater than what a\nnormal distribution would suggest. The latter deviation is referred to as kurtosis.\nC. Incorrect because skewness refers to asymmetry of the return distribution, that is,\nreturns are not symmetric around the mean. Skewness does not refer specifically to the\nprobability of extreme events (and does not measure it) even though a negatively skewed\ndistribution would have a longer left tail relative to the normal distribution\nPortfolio Management: describe characteristics of the major asset classes that investors\nconsider in forming portfolios", "qhtml": null}, {"n": 32, "q": "Robo-advisers most likely", "opts": ["face high barriers to entry.", "cater to the demand from investors with lower levels of investable assets.", "prefer actively managed funds to index funds when constructing client portfolios"], "ans": "B", "expl": "A. Incorrect because reflecting low barriers to entry, large wealth management firms have\nintroduced robo-adviser solutions to service certain customer segments and appeal to a\nnew generation of investors\nB. Correct because rapid growth in robo-advisory assets is based on several industry trends\nincluding growing demand from 'mass affluent and younger investors. Traditional\ninvestment advice has often underserved younger and 'mass affluent investors with lower\nrelative levels of investable assets.\nC. Incorrect because robo-advisers often rely on lower fee underlying portfolio investment\noptions, such as index funds or ETFs, when constructing portfolios for clients\nPortfolio Management: describe aspects of the asset management industry", "qhtml": null}, {"n": 33, "q": "Which of the following is most closely associated with representativeness bias?", "opts": ["Momentum", "The halo effect", "Bubbles and crashes"], "ans": "B", "expl": "A. Incorrect because representativeness bias pertains to sample-size neglect, where a small\nsample is believed to represent a population, or base-rate neglect, where specific\nInformation is seen to supersede an established trend Momentum is attributable to the fear\nof missing out or recent trends in the market, not a specific piece of information.\nMomentum can be partly explained by availability, hindsight, and loss aversion biases\nB. Correct because representativeness bias attributes one positive trait as being\nrepresentative of an overall positive investment. The halo effect extends a favorable\nevaluation of some characteristics to other characteristics. A company with a good growth\nrecord and good previous share price performance might be seen as a good investment,\nwith higher expected returns than its risk characteristics ment. This view is a form of\nrepresentativeness that can lead Investors to extrapolate recent past performance into\nexpected returns\nC. Incorrect because bubbles and crashes are cost closely identified with overconfidence not\nrepresentativeness bias, in bundles, investors often exhibit symptoms of overconfidence,\novertrading underestimation of risks failure to diversity, and rejection of contradictory\nInformation. The overconfidence and excessive trading that contribute to a bubble are\nlinked to confirmation bias and self-attribution bias\nPortfolio Management: describe how behavioral biases of investors can lead to market\ncharacteristics that may not be explained by traditional finance", "qhtml": null}, {"n": 34, "q": "Which of the following statements about different types of investors is most accurate?", "opts": ["For banks, the liquidity of their investments is a paramount concern.", "For endowments, investment horizons are short due to their short-term spending needs.", "For insurance companies, the risk tolerance of their general and surplus accounts is typically the same."], "ans": "A", "expl": "A. Correct because liquidity is a paramount concern for banks that stand ready to meet\ndepositor requests for withdrawals.\nB. Incorrect because most foundations and endowments are established with the intent of\nhaving perpetual lives. The large allocation to alternative investments primarily reflects the\ntypically long time horizon of endowments and foundations.\nC. Incorrect because an insurance company's general account is typically invested\nconservatively in a diverse allocation of fixed-income securities, while an insurer's surplus\naccount typically targets a higher return than the general account and thus often invests in\nless-conservative asset classes.\nPortfolio Management: describe types of investors and distinctive characteristics and needs\nof each", "qhtml": null}, {"n": 35, "q": "Which of the following is most likely undertaken during the risk budgeting process?", "opts": ["Assessing risk appetite", "Setting a limit for value at risk (VAR)", "Establishing a reserve to cover potential future losses"], "ans": "B", "expl": "A. Incorrect because it describes risk tolerance, not risk budgeting Risk tolerance Identifies\nthe extent to which the organization is willing to experience losses or opportunity costs and\nto fail in meeting its objectives. Whereas risk tolerance focuses on the appetite for risk and\nwhat is and is not acceptable, risk budgeting has a more specific focus on how that risk is\ntaken.\nB. Correct because risk budgeting quantifies and allocates the tolerable risk by specific\nmetrics. Four well-known single-dimension measures that are often used are standard\ndeviation, beta, value at risk (VaR), and scenario loss\nC. Incorrect because it describes self-insurance, an example of risk acceptance, not risk\nbudgeting. Self-insurance is the notion of bearing a risk that is considered undesirable but\ntoo costly to eliminate by external means. It may involve the establishment of a reserve to\ncover losses.\nPortfolio Management: describe risk budgeting and its role in risk governance", "qhtml": null}, {"n": 36, "q": "The portfolio approach to investing most likely.", "opts": ["prevents portfolio losses during market downturns.", "reduces the systematic risk of individual assets in a portfolio.", "helps avoid disastrous investment outcomes during normal market conditions."], "ans": "C", "expl": "A. Incorrect because, although the portfolio approach helps avoid disasters by way of\ndiversification, it does not necessarily provide downside protection (prevent losses) during\nmarket downturns. A major reason that portfolios can effectively reduce risk is that\ncombining securities whose returns do not move together provides diversification.\nHowever, an important issue is that the co-movement or correlation pattern of the\nsecurities returns in the portfolio can change in a manner unfavorable to the investor.\nDespite diversification, a portfolio is unlikely to preserve its value during market downturns\nB. Incorrect because an asset's risk should be measured in relation to the remaining\nsystematic or non-diversifiable risk, which should be the only risk that affects the asset's\nprice. Systematic risk is risk that cannot be avoided and is inherent in the overall market. It\nis non-diversifiable because it includes risk factors that are innate within the market and\naffect the market as a whole. Therefore, portfolio diversification does not reduce the\nsystematic risk of individual assets in a portfolio.\nC. Correct because portfolio diversification helps investors avoid disastrous investment\noutcomes. A main tenet of the portfolio approach to investing is diversification. A disastrous\noutcome can result from 'putting all your eggs into one basket’ or investing everything into\none stock whose value could then go to zero. A diversified portfolio holding many securities\nis likely to avoid this outcome. Although diversification may not prevent losses during\nmarket downturns, it does help avoid disastrous investment outcomes during normal\nmarket conditions.\nPortfolio Management: describe the portfolio approach to investing", "qhtml": null}, {"n": 37, "q": "A client's time horizon is most\nappropriately used by an investment adviser to determine the client's:", "opts": ["risk attitude.", "ability to take risk.", "willingness to take risk."], "ans": "B", "expl": "A. Incorrect because the willingness to take risk, or risk attitude, is a more subjective factor\nbased on the client's psychology and perhaps also his or her current circumstances.\nB. Correct because the ability to bear risk is measured mainly in terms of objective factors,\nsuch as time horizon, expected income, and the level of wealth relative to liabilities.\nC. Incorrect because the willingness to take risk, or risk attitude, is a more subjective factor\nbased on the client's psychology and perhaps also his or her current circumstances.\nPortfolio Management: explain the difference between the willingness and the ability\n(capacity) to take risk in analyzing an investor's financial risk tolerance", "qhtml": null}, {"n": 38, "q": "Which of the following sections of an investment policy statement most likely provides\nguidance on obtaining feedback on investment results?", "opts": ["Investment Guidelines", "Evaluation and Review", "Statement of Duties and Responsibilities"], "ans": "B", "expl": "A. Incorrect because the Investment Guidelines section provides information about how\npolicy should be executed (e.g., on the permissible use of leverage and derivatives) and on\nspecific types of assets excluded from investment, if any.\nB. Correct because the Evaluation and Review section provides guidance on obtaining\nfeedback on investment results.\nC. Incorrect because the Statement of Duties and Responsibilities details the duties and\nresponsibilities of the client, the custodian of the client's assets, and the investment\nmanagers.\nPortfolio Management: describe the major components of an IPS", "qhtml": null}, {"n": 39, "q": "The security market line plots the expected return of a portfolio against a measure of the\nportfolio's:", "opts": ["total risk.", "systematic risk.", "unsystematic risk."], "ans": "B", "expl": "A. Incorrect because the security market line (SML) is a graphical representation of the\ncapital asset pricing model with beta, reflecting systematic risk (not total risk), on the x-axis\nand expected return on the y-axis. The security market line applies to any security, efficient\nor not. Total risk and systematic risk are equal only for efficient portfolios because those\nportfolios have no diversifiable risk remaining.\nB. Correct because the security market line (SML) is a graphical representation of the capital\nasset pricing model with beta, reflecting systematic risk, on the x-axis and expected return\non the y-axis.\nC. Incorrect because the security market line (SML) is a graphical representation of the\ncapital asset pricing model with beta, reflecting systematic risk (not unsystematic risk), on\nthe x-axis and expected return on the y-axis.\nPortfolio Management: explain the capital asset pricing model (CAPM), including its\nassumptions, and the security market line (SML)", "qhtml": null}, {"n": 40, "q": "An analyst estimates the standard deviation of returns for the market portfolio to be 15%\nand the standard deviation of returns for a stock to be 25%. If the correlation of returns\nbetween the stock and the market portfolio is 0.6, the stock has:", "opts": ["less systematic risk than the market portfolio.", "the same systematic risk as the market portfolio.", "more systematic risk than the market portfolio."], "ans": "B", "expl": "A. Incorrect because the company has a beta equal to one, which is the same as the beta of\nthe market portfolio.\nB. Correct because the amount of systematic risk for a company is measured by the stock's\nbeta. 𝛽 = 𝜌 ∗ 𝜎 / 𝜎 = 0.60 x 0.25/0.15 = 0.15/0.15 = 1. Since the company's beta\n𝑖,𝑚 𝑖 𝑚\nequals the market portfolio's beta (the market portfolio's beta with itself equals 1), the\ncompany has the same level of systematic risk as the market portfolio.\nC. Incorrect because the company has a beta equal to one, which is the same as the beta of\nthe market portfolio.\nPortfolio Management: calculate and interpret beta", "qhtml": null}, {"n": 41, "q": "Risk-averse investors make investment decisions that maximize:", "opts": ["both return and risk.", "return irrespective of risk.", "return for the same amount of risk."], "ans": "C", "expl": "A. Incorrect because a risk-seeking investor would maximize both risk and return.\nB. Incorrect because a risk-neutral investor would maximize return irrespective of risk.\nC. Correct because risk-averse investors make investment decisions based on the risk-return\ntrade-off, maximizing return for the same risk, and minimizing risk for the same return.\nPortfolio Management: explain risk aversion and its implications for portfolio selection", "qhtml": null}, {"n": 42, "q": "Sovereign wealth funds are best described as investment funds:", "opts": ["owned by governments.", "traded as closed-end country funds.", "restricted from investing in foreign securities"], "ans": "A", "expl": "A. Correct because sovereign wealth funds (SWFs) are government-owned investment\nfunds.\nB. Incorrect because sovereign wealth funds (SWFs) are government-owned investment\nfunds. Closed-end funds are mutual funds in which no new investment money is accepted\ninto the fund. New investors invest by buying existing shares, and investors in the fund\nliquidate by selling their shares to other investors. A mutual fund is a commingled investment\npool in which investors in the fund each have a pro-rata claim on the income and value of\nthe fund. SWFs do not pool investment money from individual investors and institutions,\nand they are not traded.\nC. Incorrect because sovereign wealth funds (SWFS) are government-owned investment\nfunds or entities that invest in financial or real assets. In order to meet their long-term\nreturn objectives, SWFS invest in a wide range of real and financial assets or in alternative\ninvestments. The name \"sovereign\" wealth funds refers to the funds' ownership rather than\ntheir permitted investments.\nPortfolio Management: describe types of investors and distinctive characteristics and needs\nof each", "qhtml": null}, {"n": 43, "q": "Which of the following lines is plotted on a graph with the excess return of a security on\nthe y-axis and the excess return of the market on the x-axis?", "opts": ["Capital market line", "Security market line", "Security characteristic line"], "ans": "C", "expl": "A. Incorrect because the capital market line is a special case of the capital allocation line,\nwhere the risky portfolio is the market portfolio. The capital market line is shown in Exhibit\n3, where the standard deviation (𝜎 ), or total risk, is on the x-axis and expected portfolio\n𝑝\nreturn, E(𝑅 ), is on the y-axis.\n𝑝\nB. Incorrect because the security market line represents a graph of the capital asset pricing\nmodel. The security market line (SML) is a graphical representation of the capital asset\npricing model with beta, reflecting systematic risk, on the x-axis and expected return on the\ny-axis. Using the same concept as the capital market line, the SML intersects the y-axis at\nthe risk-free rate of return, and the slope of this line is the market risk premium, R - R\nm f\nC. Correct because similar to the SML (security market line), we can draw a security\ncharacteristic line (SCL) for a security. The SCL is a plot of the excess return of the security\non the excess return of the market. The security characteristic line can also be estimated by\nregressing the excess security return, R - R, on the excess market return, R - R\ni f m f\nPortfolio Management: describe and demonstrate applications of the CAPM and the SML", "qhtml": null}, {"n": 44, "q": "According to capital market theory, the only type of risk that is priced is:", "opts": ["systematic risk.", "diversifiable risk.", "idiosyncratic risk."], "ans": "A", "expl": "A. Correct because systematic or non-diversifiable risk is priced and investors are\ncompensated for holding assets or portfolios based only on that investment's systematic\nrisk. Investors do not receive any return for accepting nonsystematic or diversifiable risk.\nPricing or valuing an asset is equivalent to estimating its expected rate of return.\nB. Incorrect because systematic or non-diversifiable risk is priced and investors are\ncompensated for holding assets or portfolios based only on that investment's systematic\nrisk. Investors do not receive any return for accepting nonsystematic or diversifiable risk.\nC. Incorrect because systematic or non-diversifiable risk is priced and investors are\ncompensated for holding assets or portfolios based only on that investment's systematic\nrisk. Investors do not receive any return for accepting nonsystematic or diversifiable risk.\nNonsystematic risk is the risk that pertains to a single company or industry and is also\nknown as company-specific, industry-specific, diversifiable, or idiosyncratic risk.\nPortfolio Management: explain systematic and nonsystematic risk, including why an\ninvestor should not expect to receive additional return for bearing nonsystematic risk", "qhtml": null}, {"n": 45, "q": "Which of the following is most accurate regarding an investment policy statement (IPS)?", "opts": ["Policies on sustainable investing require a separate IPS.", "Investment constraints can be determined by the client or by the law.", "Clients can specify different spending goals, but each goal must have the same risk tolerance and return objective."], "ans": "B", "expl": "A. Incorrect because although the IPS is sometimes complemented by a document outlining\npolicy on sustainable investing policies on sustainable investing may also be integrated\nwithin the IPS itself. In the remainder of this reading, the integration of sustainable investing\nwithin the IPS will be our working assumption.\nB. Correct because the constraints may be internal (ie., set by the client), or external (ie., set\nby law or regulation).\nC. Incorrect because as part of their financial planning, clients may specify specific spending\ngoals, each of which could have different risk tolerance and return objectives.\nPortfolio Management: describe the reasons for a written investment policy statement (IPS)", "qhtml": null}, {"n": 46, "q": "An investor's ability to take risk:", "opts": ["is a function of risk tolerance.", "is typically assessed by a psychometric questionnaire.", "increases with the length of the investment horizon, all else being equal."], "ans": "C", "expl": "A. Incorrect because a client's overall risk tolerance is a function of the client's ability to bear\n(accept) risk and his or her 'risk attitude,' which might be considered as the client's\nwillingness to take risk,\" not the other way around.\nB. Incorrect because a willingness [not ability] to take risk may be gauged by discussing risk\nwith the client or by asking the client to complete a psychometric questionnaire.\nC. Correct because the ability to bear risk is measured mainly in terms of objective factors,\nsuch as time horizon, expected income , and the level of wealth relative to liabilities. For\nexample, an investor with a 20-year time horizon can be considered to have a greater ability\nto bear risk, other things being equal, than an investor with a 2-year horizon. This difference\nis because over 20 years there is more scope for losses to be recovered or other\nadjustments to circumstances to be made than there is over two years.\nPortfolio Management: explain the difference between the willingness and the ability\n(capacity) to take risk in analyzing an investor's financial risk tolerance", "qhtml": null}, {"n": 47, "q": "The capital market line most likely consists of portfolios that:", "opts": ["are fully diversified.", "have zero systematic risk.", "have nonsystematic risk equal to beta."], "ans": "A", "expl": "A. Correct because the capital market line (CML) does not apply to all securities or assets\nbut only to portfolios on the efficient frontier. The efficient frontier gives optimal\ncombinations of expected return and total risk. Total risk and systematic risk are equal only\nfor efficient portfolios because those portfolios have no diversifiable risk remaining. Thus,\nthe CML holds only for well-diversified portfolios.\nB. Incorrect because the nonsystematic risk of the market portfolio is zero, but not its\nsystematic risk. Because nonsystematic risk is zero for well-diversified portfolios, such as the\nmarket portfolio, the total risk of a market portfolio and other similar portfolios is only\nsystematic risk, whi
