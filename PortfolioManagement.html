ch is 𝛽 𝜎 .Therefore, portfolios on the CML have zero nonsystematic\n𝑖 𝑚\n(not systematic) risk.\nC. Incorrect because the total risk of a market portfolio and other similar portfolios is only\nsystematic risk, which is 𝛽 𝜎 . Therefore, portfolios on the CML have nonsystematic risk\n𝑖 𝑚\nequal to zero, not beta.\nPortfolio Management: explain the capital allocation line (CAL) and the capital market line\n(CML)", "qhtml": null}, {"n": 48, "q": "The Markowitz efficient frontier is best described as a curve that:", "opts": ["lies above and to the left of the minimum-variance frontier.", "connects the minimum-variance portfolios for all possible returns.", "contains all portfolios of risky assets that rational, risk-averse investors will choose."], "ans": "C", "expl": "A. Incorrect because the curve that lies above and to the right of the global minimum-\nvariance portfolio is referred to as the Markowitz efficient frontier because it contains all\nportfolios of risky assets that rational, risk-averse investors will choose. The efficient frontier\nis the upper part of the minimum-variance frontier, it does not lie above and to the left of it\nB. Incorrect because the entire collection of minimum-variance portfolios for all possible\nreturns is referred to as the minimum-variance frontier, not the efficient frontier (which is\nonly the upper arm of the minimum-variance frontier). Compared to the investment\nopportunity set, the minimum-variance frontier defines the smaller set of portfatios in\nwhich investors would want to invest. Note that no risk-averse investor will choose to invest\nin a portfolio to the night of the minimum-variance frontier because a portfolio on the\nminimum-variance frontier can give the same return but at a lower risk.\nC. Correct because the Markowitz efficient frontier contains all portfolios of risky assets that\nrational, risk-averse investors will choose.\nPortfolio Management: describe and interpret the minimum-variance and efficient frontiers\nof risky assets and the global minimum- variance portfolio", "qhtml": null}, {"n": 49, "q": "Which of the following most likely affects a client's ability to take risk? The client's:", "opts": ["utility function", "degree of risk aversion", "level of wealth relative to liabilities"], "ans": "C", "expl": "A. Incorrect because the client's utility function affects their willingness, not ability, to take\nrisk. Utility is a measure of relative satisfaction from consumption of various goods and\nservices or in the case of investments, the satisfaction that an investor derives from\ndifferent portfolios.\nB. Incorrect because the client's degree of risk aversion affects their willingness, not ability,\nto take risk. Risk attitude, or willingness to take risk, is a more subjective factor based on the\nclient's psychology.\nC. Correct because the ability to bear risk is measured mainly in terms of objective factors,\nsuch as time horizon, expected income, and the level of wealth relative to liabilities.\nPortfolio Management: explain the difference between the willingness and the ability\n(capacity) to take risk in analyzing an investor's financial risk tolerance", "qhtml": null}, {"n": 50, "q": "The expected return for a security is equal to the market's risk premium. If the risk-free\nrate is positive and the CAPM holds, the beta of the security is:", "opts": ["less than 1.", "equal to 1.", "greater than 1."], "ans": "A", "expl": "A. Correct because the CAPM equation is E(R) = R +𝛽[E(R ) - R. Therefore, the beta of the\ni f m f\nsecurity has to be less than 1 in order for the security's return to be the same as the market\nrisk premium, given that the risk-free rate is positive.\nB. Incorrect because the CAPM equation is E(R) = R +𝛽[E(R ) - R. Therefore, if beta is equal\ni f m f\nto 1, the security's return will be higher than the market risk premium.\nC. Incorrect because the CAPM equation is E(R) = R +𝛽[E(R ) - R. Therefore, if beta is\ni f m f\ngreater than 1, the security's return will be higher than the market risk premium.\nPortfolio Management: calculate and interpret the expected return of an asset using the\nCAPM", "qhtml": null}, {"n": 51, "q": "Which of the following characteristics is most likely used to determine an investor's\nability to take risk? The investor's:", "opts": ["risk attitude.", "self-confidence.", "years until retirement."], "ans": "C", "expl": "A. Incorrect because risk attitude, or willingness to take risk, is a more subjective factor\nbased on the client's psychology and perhaps also his or her current circumstances. Risk\nattitude is an investor's willingness to take risk, not the investor's ability to take risk.\nB. Incorrect because risk attitude, or willingness to take risk, is a more subjective factor\nbased on the client's psychology and perhaps also his or her current circumstances.\nAlthough the list of factors that are related to an individual's risk attitude remains open to\ndebate, it is believed that some psychological factors, such as personality type, self-esteem,\nand inclination to independent thinking, are correlated with risk attitude. Self- confidence is\ntherefore associated with an investor's willingness to take risk, not the investor's ability to\ntake risk.\nC. Correct because the ability to bear risk is measured mainly in terms of objective factors,\nsuch as time horizon, For example, an investor with a 20-year time horizon can be\nconsidered to have a greater ability to bear risk, other things being equal, than an investor\nwith a 2-year horizon.\nPortfolio Management: describe risk and return objectives and how they may be developed\nfor a client", "qhtml": null}, {"n": 52, "q": "An analyst gathers the following information:\nRisk-free rate 2%\nExpected return of the market portfolio 10%\nStandard deviation of the market portfolio 20%\nStandard deviation of the security 35%\nCorrelation between the security and the market 0.8\nAccording to the CAPM, the expected return of the security is closest to:", "opts": ["5.7%.", "13.2%.", "16.0%."], "ans": "B", "expl": "A. Incorrect because the security beta is wrongly calculated due to the reversal of the\nstandard deviations of the security and the market portfolio. Therefore, the beta is\ncalculated as 𝛽 = (0.8 x 20%)/35% = 0.457. Next, using the CAPM equation, E(R) = R\ni f\n+𝛽[E(R ) - R], the expected return of the security is calculated as E(R) = 2% + 0.457 x (10% -\nm f i\n2% ) = 5.66% ≈ 5.7%.\nB. Correct because the expected return of the security can be calculated using the CAPM\nequation: E(R) = R +𝛽[E(R ) - R]. The beta of the security can be calculated using the\ni f m f\nequation 𝛽 = (P x 𝜎 )/ 𝜎 . Therefore, 𝛽 = (0.8 x 35% )/20% = 1.4. Beta is the product of the\ni,m 𝑖 𝑚\nasset's correlation with the market with a ratio of standard deviations of return (ie., the\nratio of the asset's standard deviation to the market's). Therefore, using the CAPM\nequation: E(R) = 2% +1.4 x (10% - 2% ) = 13.2%.\ni\nC. Incorrect because the risk-free rate is not included in the calculation of the market risk\npremium. Beta is calculated as 𝛽 = (0.8 x 35% ) / 20% = 1.4. Therefore, using the CAPM\nequation: E(R) = 2% +1.4 x (10%) = 16.0%.\ni\nPortfolio Management: calculate and interpret the expected return of an asset using the\nCAPM", "qhtml": null}, {"n": 53, "q": "The correlation of returns between two securities with equal standard deviation of\nreturns is 0.75. If the covariance of returns is 5.5%², the standard deviation of returns for each\nsecurity is closest to:", "opts": ["2.7%.", "3.7%.", "7.3%."], "ans": "A", "expl": "A. Correct because the correlation between the returns of the two securities is\n𝐶𝑜𝑣 5.5\n𝑖𝑗\n𝑟 = => 𝜎𝜎 = = 7.3\n𝑖𝑗 𝜎 𝜎 𝑖 𝑗 0.71\n𝑖 𝑗\n. Since the two securities have equal risk, 𝜎 = 𝜎\n𝑖 𝑗\n𝜎 2 = 7.3 => 𝜎 = 2.7%\n𝑖 𝑖\nB. Incorrect because it is a miscalculation and mistakes 𝜎 𝜎, as 2 x 𝜎 ,\n𝑖 𝑗 𝑖\n5.5\n𝜎 𝜎 = = 7.3\n𝑖 𝑗 0.71\n2 x 𝜎 = 7.3% ; 𝜎 = 3.67% ≈ 3.7%\n𝑖 𝑖\nC. Incorrect because it is an intermediate step in the correct calculation;\n5.5\n𝜎 𝜎 = = 7.3%\n𝑖 𝑗 0.71\nPortfolio Management: calculate and interpret the mean, variance, and covariance (or\ncorrelation) of asset returns based on historical data", "qhtml": null}, {"n": 54, "q": "An analyst gathers the following information about an asset and the market:\nRisk-free rate 1%\nMarket risk premium 5%\nAsset's expected return 5%\nBased on the CAPM, the asset's beta is closest to:", "opts": ["0.80.", "1.00.", "1.25."], "ans": "A", "expl": "A. Correct because the expected return of an asset is E(R) = R +𝛽[E(R ) – R], where R, R ,\ni f i m f f m\nand R, denote the return on the asset, the market, and the risk-free asset, respectively, B, is\ni\nthe asset's beta, and [E(R ) – R] is the market risk premium.\nm f\nThus, 𝛽 = [E(𝑅 )-𝑅 ]/[E(𝑅 )-𝑅 ] = [5% - 1% ] / 5% = 4%/5% = 0.8.\n𝑖 𝑖 𝑓 𝑚 𝑓\nB. Incorrect\nIncorrect because it does not subtract the risk-free rate in the numerator and calculates 𝛽 =\n𝑖\nE(𝑅 )/[E(𝑅 )-𝑅 ] = 5%/5% = 1.0. It is also the answer if the market risk premium is confused\n𝑖 𝑚 𝑓\nwith the market return, thus 𝛽 = [𝐸 > (𝑅 )−𝑅 ]/[market risk premium - 𝑅 = [5% - 1% ] /\n𝑖 𝑖 𝑓 𝑓\n[5% - 1% ] = 4%/4% = 1.0.\nC. Incorrect\nIncorrect because it is the inverse of beta, 1/𝛽 = [E(𝑅 )-𝑅 ]/[E(𝑅 )-𝑅 ] = market risk\n𝑖> 𝑚 𝑓 𝑚 𝑓\npremium [𝐸(𝑅 )−𝑅 ]= 5% /[5%-1% ] = 5%/4% = 1.25. It is also the answer if two mistakes\n𝑖 𝑓\nare made: The risk-free rate is not subtracted from the expected return in the numerator\nand the market risk premium is confused with the market return. Thus, 𝛽 = 𝐸(𝑅 )/ [market\n𝑖 𝑖\nrisk premium - R = 5% / [5% -1% ] = 5%/4% = 1.25.\nPortfolio Management: calculate and interpret beta", "qhtml": null}, {"n": 55, "q": "Long-term historical data on the risk-return trade-off of securities show that investors are\nmost likely", "opts": ["risk averse.", "risk neutral.", "risk seeking."], "ans": "A", "expl": "A. Correct because the expression 'risk-return trade-off refers to the positive relationship\nbetween expected risk and return. In other words, a higher return is not possible to attain in\nefficient markets and over long periods of time without accepting higher risk. Expected\nreturns should be greater for assets with greater risk. Over long periods of time, we observe\nthat higher risk does result in higher mean returns. Thus, it is reasonable to claim that, over\nthe long term, market prices reward higher risk with higher returns, which is a characteristic\nof a risk- averse investor.\nB. Incorrect because long-term historical data on securities suggest that investors are risk\naverse, not risk neutral.\nC. Incorrect because because long-term historical data on securities suggest that investors\nare risk averse, not risk seeking.\nPortfolio Management: describe characteristics of the major asset classes that investors\nconsider in forming portfolios", "qhtml": null}, {"n": 56, "q": "Information regarding the permissible use of derivatives in a portfolio is most likely found\nin which of the following sections of an investment policy statement?", "opts": ["Procedures", "Investment Guidelines", "Statement of Duties and Responsibilities"], "ans": "B", "expl": "A. Incorrect because the Procedures section of an Investment Policy Statement (IPS)\nexplains the steps to take to keep the IPS current and the procedures to follow to respond\nto various contingencies. Information regarding the permissible use of derivatives is\nincluded under Investment Guidelines.\nB. Correct because the Investment Guidelines section of an Investment Policy Statement\n(IPS) provides information about how policy should be executed (e.g., on the permissible\nuse of leverage and derivatives) and on specific types of assets excluded from investment, if\nany.\nC. Incorrect because the Statement of Duties and Responsibilities section of an Investment\nPolicy Statement (IPS) details the duties and responsibilities of the client, the custodian of\nthe client's assets, and the investment managers. Information regarding the permissible use\nof derivatives is included under Investment Guidelines.\nPortfolio Management: describe the major components of an IPS", "qhtml": null}, {"n": 57, "q": "In the portfolio management process, the feedback step most likely involves:", "opts": ["rebalancing the portfolio.", "deciding on an asset allocation.", "understanding the client's constraints."], "ans": "A", "expl": "A. Correct because the feedback step assists the portfolio manager in rebalancing the\nportfolio due to a change in. for example, market conditions or the circumstances of the\nclient.\nB. Incorrect because it is part of the execution step, not the feedback step. The portfolio\nexecution step consists of first deciding on a target asset allocation, which determines the\nweighting of asset classes to be included in the portfolio.\nC. Incorrect because it is part of the planning step, not the feedback step. The first step [the\nplanning step] in the investment process is to understand the client's needs (objectives and\nconstraints) and develop an investment policy statement (IPS).\nPortfolio Management: describe the steps in the Portfolio Management: process", "qhtml": null}, {"n": 58, "q": "Which of the following investment principles best explains the use of strategic asset\nallocation in portfolio construction?", "opts": ["Returns on similar assets reflect exposures to certain sets of systematic factors.", "Nonsystematic risk accounts for most of the change in portfolio value over the long term.", "Deviating from policy exposures to systematic risk factors may add value to the portfolio."], "ans": "A", "expl": "A. Correct because the focus on the SAA [strategic asset allocation] is the result of a number\nof important investment principles. One such principle is that the returns to groups of\nsimilar assets (e g.. long-term debt claims) predictably reflect exposures to certain sets of\nsystematic factors (e.g., for the debt claims, unexpected changes in the inflation rate).\nB. Incorrect because the focus on the SAA [strategic asset allocation] is the result of a\nnumber of important investment principles. One principle is that a portfolio's systematic risk\naccounts for most of its change in value over the long term.\nC. Incorrect because the decision to deliberately deviate from the policy exposures to\nsystematic risk factors (i.e.. the policy weights of asset classes) with the intent to add value\nbased on forecasts of the near-term returns of those asset classes is called tactical asset\nallocation. It is not one of the investment principles which strategic asset allocation is based\nupon.\nPortfolio Management: describe the principles of portfolio construction and the role of\nasset allocation in relation to the IPS", "qhtml": null}, {"n": 59, "q": "In the investment policy statement of a pension fund, a countrywide limit on the\nproportion of high-risk assets that can be held in long-term pension portfolios is most likely a:", "opts": ["liquidity constraint.", "legal and regulatory constraint.", "time horizon constraint."], "ans": "B", "expl": "A. Incorrect because the countrywide constraint for pension funds that limits the proportion\nof high-risk assets in the portfolio is a regulatory constraint. The fact that the constraint is\nformulated as a limit to invest in high-risk assets does not indicate it is a liquidity constraint.\nLiquidity constraints state what the likely requirements are to withdraw funds from the\nportfolio.\nB. Correct because the IPS should state any legal and regulatory restrictions that constrain\nhow the portfolio is invested. In some countries, such institutional investors as pension\nfunds are subject to restrictions on the composition of the portfolio. For example, there may\nbe a limit on the proportion of equities or other risky assets in the portfolio, or on the\nproportion of the portfolio that may be invested overseas.\nC. Incorrect because the countrywide constraint for pension funds that limits the proportion\nof high-risk assets in the portfolio is a regulatory constraint. The constraint does not change\nthe broad investment time horizon of the pension fund and is therefore not a time horizon\nconstraint. Time horizon constraints state the time horizon over which the investor is\ninvesting.\nPortfolio Management: describe the investment constraints of liquidity, time horizon, tax\nconcerns, legal and regulatory factors, and unique circumstances and their implications for\nthe choice of portfolio assets", "qhtml": null}, {"n": 60, "q": "The global minimum-variance portfolio is a portfolio that lies:", "opts": ["anywhere along the minimum-variance frontier.", "at the left-most point of the minimum-variance frontier.", "at the upper right-most point of the minimum-variance frontier."], "ans": "B", "expl": "A. Incorrect because the entire collection of these minimum-variance portfolios is referred\nto as the minimum- variance frontier. This describes the minimum variance portfolio, but\nnot the global minimum-variance portfolio.\nB. Correct because the left-most point on the minimum-variance frontier is the portfolio\nwith the minimum variance among all portfolios of risky assets, and is referred to as the\nglobal minimum-variance portfolio.\nC. Incorrect because the upper right-most point of the minimum-variance frontier is the\nopposite position of the global minimum-variance portfolio, it is actually the maximum\nvariance on the curve of risky portfolios.\nPortfolio Management: describe and interpret the minimum-variance and efficient frontiers\nof risky assets and the global minimum- variance portfolio", "qhtml": null}, {"n": 61, "q": "Which of the following principles best explains the focus on a strategic asset allocation\nwhen constructing a client's IPS?", "opts": ["Adding assets with high correlation improves the risk-return trade-off.", "Nonsystematic risk accounts for most of a portfolio's change in value over the long term.", "The returns to groups of similar assets predictably reflect exposures to certain systematic factors."], "ans": "C", "expl": "A. Incorrect because this is not one of the two principles which resulted in the focus on a\nstrategic asset allocation in portfolio construction. Furthermore, in general, adding assets\nclasses with low (not high) correlation improves the risk-return trade-off (more return for\nsimilar risk).\nB. Incorrect because a portfolio's systematic (not nonsystematic) risk accounts for most of\nits change in value over the long term.\nC. Correct because the focus on the SAA (strategic asset allocation) is the result of a number\nof important investment principles. A second principle is that the returns to groups of\nsimilar assets (eg, long-term debt claims) predictably reflect exposures to certain sets of\nsystematic factors (e.g., for the debt claims, unexpected changes in the interest rate).\nPortfolio Management: describe the principles of portfolio construction and the role of\nasset allocation in relation to the IPS", "qhtml": null}, {"n": 62, "q": "Which of the following sections of an investment policy statement (IPS) most likely\nexplains how and when the IPS should be reviewed?", "opts": ["Procedures", "Investment Guidelines", "Statement of Duties and Responsibilities"], "ans": "A", "expl": "A. Correct because the IPS should be reviewed on a regular basis to ensure that it remains\nconsistent with the client's circumstances and requirements. The IPS should also be\nreviewed if the manager becomes aware of a material change in the client's circumstances,\nor on the initiative of the client when his or her objectives, time horizon, or liquidity needs\nchange. The major components of an IPS include the following section: Procedures This\nsection explains the steps to take to keep the IPS current and ne padethares to follow to\nrespond ja venous contingencies\nB. Incorrect because the Investment Guidelines section of the investment policy statement\n(IPS) provides Information about how policy should be executed (e.g., on the permissible\nuse of leverage and derivatives) and on specific types of assets excluded from investment if\nany information about how and when the IPS stious be reviewed can be found in the\nProcedures section.\nC. Incorrect because the Statement of Duties and Responsibilities section of the investment\npolicy statement (IPS) details the duties and responsibilities of the client, the custodian of\nthe client's assets, and the investment managers. While this section may outline who is\nresponsible for reviewing the IPS, information about how and when the IPS should be\nreviewed is more likely to be found in the Procedures section.\nPortfolio Management: describe the major components of an IPS", "qhtml": null}, {"n": 63, "q": "Which of the following best describes a characteristic of defined contribution pension\nplans?", "opts": ["The employee accepts the investment and inflation risk.", "The employer is responsible for adequately funding the plan.", "Defined contribution plans typically have a higher cost to the company than defined benefit plans."], "ans": "A", "expl": "A. Correct because the key to a (DC defined contribution) plan is that the employee accepts\nthe investment and inflation risk and is responsible for ensuring that there are enough\nassets in the plan to meet their needs upon retirement.\nB. Incorrect because this applies for defined benefit (DB) plans, as generally, employers are\nresponsible for the contributions made to a DB plan and bear the risk associated with\nadequately funding the benefits offered to employees.\nC. Incorrect because DC (defined contribution) plans typically have lower costs/risk to the\ncompany.\nPortfolio Management: describe defined contribution and defined benefit pension plans", "qhtml": null}, {"n": 64, "q": "The market model is most likely used to predict:", "opts": ["market returns in a future period.", "economic growth in a future period.", "company-specific returns in a future period."], "ans": "C", "expl": "A. Incorrect because the intercept, 𝛼 , and slope coefficient, 𝛽 , of the market model can be\n𝑗 𝑗\nestimated by using historical security and market returns. These parameter estimates are\nthen used to predict company-specific returns that a security may earn in a future period.\nB. Incorrect because the market model is a return generating model which can be used to\npredict company-specific returns based on market returns. Macroeconomic factor models\n(not the market model) use economic factors that are correlated with security returns.\nThese factors may include economic growth.\nC. Correct because the intercept, 𝛼 , and slope coefficient, 𝛽 , of the market model can be\n𝑗 𝑗\nestimated by using historical security and market returns. These parameter estimates are\nthen used to predict company-specific returns that a security may earn in a future period.\nPortfolio Management: explain return generating models (including the market model) and\ntheir uses", "qhtml": null}, {"n": 65, "q": "Open-end mutual funds typically:", "opts": ["are priced intraday.", "have a fixed number of shares outstanding.", "have a larger required minimum investment than ETFs."], "ans": "C", "expl": "A. Incorrect because it is an ETF that is priced intraday, not a mutual fund. The value of a\nmutual fund is referred to as the 'net asset value'. It is computed daily based on the closing\nprice of the securities in the portfolio. Because they are traded on exchanges. ETFs can be\ntransacted (and are priced) intraday. In contrast, mutual funds typically can be purchased or\nsold only once a day.\nB. Incorrect because closed-end, not open-end, mutual funds have a fixed number of shares\noutstanding. An alternative to setting the fund up as an open-end fund would be to create a\nclosed-end fund in which no new investment money is accepted into the fund. New\ninvestors invest by buying existing shares, and investors in the fund liquidate by selling their\nshares to other investors. Hence, the number of outstanding shares does not change. One\nconsequence of this fixed share base is that, unlike open-end funds in which new shares are\ncreated and sold at the current net asset value per share, closed-end funds can sell for a\npremium or discount to net asset value depending on the demand for the shares.\nC. Correct because the minimum required investment in ETFS is usually smaller than that of\nmutual funds.\nPortfolio Management: describe mutual funds and compare them with other pooled\ninvestment products", "qhtml": null}, {"n": 66, "q": "A portfolio consists of two securities with the following characteristics:\nExpected Return Standard Deviation of Returns\nSecurity 1 17% 24%\nSecurity 2 6% 12%\nIf the portfolio has an expected return of 12.6% and the returns of the two securities are\nuncorrelated, the portfolio's standard deviation is closest to:", "opts": ["13.4%.", "15.2%.", "19.2%."], "ans": "B", "expl": "A. Incorrect because it uses an equally weighted portfolio of securities instead of deriving\nthe securities' weights from the portfolio's expected return. Given that the two securities'\nreturns are uncorrelated, it follows that the correlation between the two securities' returns\nis 0. Thus, portfolio standard deviation is calculated as:\n𝜎 2 = 0,52 ∗0,242 +0,52 ∗0,122 <=> 𝜎 2 = 0.0144+0.0036 = 0.018\n𝜌 𝜌\n=> 𝜎 = √0.018 = 0.1342 ≈ 13.4%\n𝜌\nB. Correct because the portfolio's weights are calculated by setting the portfolio return\nequal to 12.6%. The portrolio return of a two-security portforlio is:\n𝑅 = 𝑤 𝑅 +𝑤 𝑅\n𝜌 1 1 2 2\n𝑅 = 𝑤 𝑅 +(1−𝑤 )𝑅\n𝜌 1 1 1 2\n12.6% = 𝑤 ∗17%+(1−𝑤 )∗6%\n1 1\n𝑤 = 0.6 and 𝑤 = 1−0.6 = 0.4\n1 2\nSince the two securities' returns are uncorrelated, it follows that CovR,, R) = 0, such that:\n𝜎 2 = (0,62 ∗0,242 +0,42 ∗0,122)\n𝜌\n𝜎 2 = (0.0207+0.0023)\n𝜌\n=> 𝜎 = √0.023 = 0.1518 ≈ 15.2%\n𝜌\nC. Incorrect because it assumes that, since the securities' returns are uncorrelated, the\nportfolio standard deviation is the weighted mean of the individual securities' standard\ndeviations.\nThe portfolio's weights are calculated by setting the portfolio return equal to 12.6%. The\nportfolio return of a two- security portfolio is:\n𝑅 = 𝑤 𝑅 +(1−𝑤 )𝑅\n𝜌 1 1 1 2\n12.6% = 𝑤 x 17% + (1 - W₁) x 6%\n1\n𝑤 = 0.6 and 𝑤 = 1−0.6 = 0.4\n1 2\nThen, 𝜎 , is incorrectly calculated as:\n𝜌\n𝜎 =0.6 * 24 + 0.4 × 0.12\n𝜌\n𝜎 = 0.192=19.2%. This would be the correct portfolio standard deviation if the correlation\n𝜌\nwas equal to 1.\nPortfolio Management: calculate and interpret portfolio standard deviation", "qhtml": "<p>A portfolio consists of two securities with the following characteristics:</p><table class=\"qtable\"><thead><tr><th></th><th>Expected Return</th><th>Standard Deviation of Returns</th></tr></thead><tbody><tr><td>Security 1</td><td>17%</td><td>24%</td></tr><tr><td>Security 2</td><td>6%</td><td>12%</td></tr></tbody></table><p>If the portfolio has an expected return of 12.6% and the returns of the two securities are uncorrelated, the portfolio's standard deviation is closest to:</p>"}, {"n": 67, "q": "An equally weighted portfolio is composed of two risky assets. If the correlation of asset\nreturns is equal to zero, the portfolio standard deviation is:", "opts": ["equal to zero,", "equal to the weighted average of the assets' standard deviations.", "less than the weighted average of the assets' standard deviations."], "ans": "C", "expl": "A. Incorrect because the portfolio risk is less than the weighted average of risks when the\ncorrelation of asset returns is less than one. For an equally weighted portfolio, the standard\ndeviation can only be equal to zero when the two assets are perfectly negatively correlated\n(p = -1) and the two assets have the same standard deviation. For an extreme case in which\nP₁₂ =-1 (that is, the two asset returns move in opposite directions), the portfolio can be\nmade risk free.\nB. Incorrect because the portfolio's standard deviation is simply a weighted average of the\nstandard deviations of the two assets when the correlation of asset returns is equal to one.\nC. Correct because the portfolio risk is less than the weighted average of risks when the\ncorrelation of asset returns is less than one.\nPortfolio Management: describe the effect on a portfolio's risk of investing in assets that\nare less than perfectly correlated", "qhtml": null}, {"n": 68, "q": "If all investors have homogeneous expectations, the total risk and expected return of\nportfolios consisting of the risk-free asset and the optimal risky portfolio are plotted on the:", "opts": ["capital market line.", "security market line.", "security characteristic line."], "ans": "A", "expl": "A. Correct because the risk-free asset could be combined with a risky portfolio to create a\ncapital allocation line [CAL] A specific CAL that uses the market portfolio as the optimal risky\nportfolio is known as the capital market line. When assuming homogeneous expectations,\nonly one optimal portfolio exists. The capital market line is shown in Exhibit 3, where the\nstandard deviation (𝜎 ), or total risk is on the x-axis and expected portfolio return. E(R ), is\n𝑝 p\non the y-axis.\nB. Incorrect because the security market line (SML) is a graphical representation of the\ncapital asset pricing model with beta, reflecting systematic risk, on the x-axis and expected\nreturn on the y-axis. Using the same concept as the capital market line, the SML intersects\nthe y-axis at the risk-free rate of return, and the slope of this line is the market risk\npremium, R -R\nm f\nC. Incorrect because a security characteristic line (SCL) for a security is a plot of the excess\nreturn of the security on the excess return of the market.\nPortfolio Management: explain the capital allocation line (CAL) and the capital market line\n(CML)", "qhtml": null}, {"n": 69, "q": "The risk-return profile of a portfolio's strategic asset allocation is most likely determined\nby the expected returns and risks of the individual asset classes and the:", "opts": ["correlations between those asset classes.", "use of security selection for each of those asset classes.", "allowable deviation of portfolio weights from policy weights for those asset classes."], "ans": "A", "expl": "A. Correct because the risk-retum profile of the strategic asset allocation depends on the\nexpected returns and risks of the individual asset classes, as well as the correlation between\nthose asset classes\nB. Incorrect because the risk-retum profile of the strategic asset allocation depends on the\nexpected returns and risks of the individual asset classes, as well as the correlation between\nthose asset classes Deciding to deviate from policy weights or to select securities aiming to\nbeat the benchmark creates additional uncertainty about returns. This risk is over and above\nthe risk inherent in the policy portfolio. Hence, an investment policy should ser risk limits\nand desired payoffs for each of these activities Risk budgeting implies that the portfolio\nmanager has to choose. for every asset class, whether to deploy security selection as a\nreturn generator. Although security selection could impact the returns of a portfolio, the\nrisk-return profile of a portfolio's strategic asset allocation is based on expected returns for\nthe asset classes and the correlation between those asset classes rather than the additional\nrisk associated with the use of security selection.\nC. Incorrect because the risk-return profile of the strategic asset allocation depends on the\nexpected returns and risks of the individual asset classes, as well as the correlation between\nthose asset classes. As the portfolio is constructed and its value changes with the returns of\nthe asset classes and securities in which it is invested, the weights of the asset classes will\ngradually deviate from the policy weights in the strategic asset allocation. This process is\nreferred to as drift. Periodically, or when a certain threshold deviation from the policy\nweight (the bandwidth) has been breached, the portfolio should be rebalanced back to the\npolicy weights. The set of rules that guide the process of restoring the portfolio's original\nexposures to systematic risk factors is known as the rebalancing policy. Deciding to deviate\nfrom policy weights or to select securities aiming to beat the benchmark creates additional\nuncertainty about returns. This risk is over and above the risk inherent in the policy\nportfolio. Although the weights of asset classes will deviate over time, the risk-return profile\nof a portfolio's strategic asset allocation is not determined by the rebalancing policy.\nPortfolio Management: explain the specification of asset classes in relation to asset\nallocation", "qhtml": null}, {"n": 70, "q": "A portfolio has an annual return of 15.2% and a standard deviation of returns of 11.7%. If\nthe risk-free rate is 3.1%, the portfolio's Sharpe ratio is closest to:", "opts": ["1.03.", "1.30.", "1.56."], "ans": "A", "expl": "A. Correct because the Sharpe ratio is defined as the portfolio's risk premium divided by its\nrisk. Hence, the Sharpe ratio= (R -R)/ 𝜎 = (15.2% - 3.1%) / 11.7% = 12.1% / 11.7% = 1.0342\np f 𝑝\n≈ 1.03.\nB. Incorrect because it omits the risk-free rate when determining the portfolio's risk\npremium. Hence, the Sharpe ratio= Mean Annual Return/Standard Deviation of Return =\n15.2% / 11.7% = 1.2991 ≈ 1.30.\nC. Incorrect because the risk-free rate is added to (not subtracted from) the portfolio's\nreturn to determine the risk premium. Hence, the Sharpe ratio = (R -R)/ 𝜎 = (15.2% +3.1%)\np f 𝑝\n/ 11.7% = 18.3% / 11.7% = 1.5641 ≈ 1.56.\nPortfolio Management: calculate and interpret the Sharpe ratio, Treynor ratio, M 2, and\nJensen's alpha", "qhtml": null}, {"n": 71, "q": "Which of the following is best classified as a financial risk?", "opts": ["Tax risk", "Credit risk", "Accounting risk"], "ans": "B", "expl": "A. Incorrect because tax risk is a non-financial risk as the following three non-financial risks\nare related: regulatory risk, accounting risk, and tax risk.\nB. Correct because the risk management industry has come to classify three types of risks as\nprimarily financial in nature and the second primary financial risk is credit risk.\nC. Incorrect because accounting risk is a non-financial risk as the following three non-\nfinancial risks are related: regulatory risk, accounting risk, and tax risk.\nPortfolio Management: identify financial and non-financial sources of risk and describe how\nthey may interact", "qhtml": null}, {"n": 72, "q": "The risk management measure that captures the sensitivity of a derivative's delta to a\nchange in the value of the underlying best describes:", "opts": ["rho.", "vega.", "gamma."], "ans": "C", "expl": "A. Incorrect because derivatives are also sensitive to changes in interest rates, which are\nreflected in a measure called rho\nB. Incorrect because vega is a first-order measure of the change in the derivative price for a\nchange in the volatility of the underlying.\nC. Correct because the sensitivity of the derivative price to a small change in the value of the\nunderlying asset is called the delta. Large changes are captured by the concept of gamma.\nWhereas delta is a first-order risk, gamma is considered a second-order risk because it\nreflects the risk of changes in delta. Gamma is a numerical measure of how sensitive an\noption's delta is to a change in the value of the underlying.\nPortfolio Management: describe methods for measuring and modifying risk exposures and\nfactors to consider in choosing among the methods", "qhtml": null}, {"n": 73, "q": "The intercept on the y-axis of the security characteristic line is:", "opts": ["beta.", "Jensen's alpha.", "the risk-free rate of return."], "ans": "B", "expl": "A. Incorrect because beta is the slope of the security characteristic line (SCL), not the\nintercept.\nB. Correct because the SCL is a plot of the excess return of the security on the excess return\nof the market. Jensen's alpha is the intercept and the beta is the slope\nC. Incorrect because the risk-free rate of return is the intercept on the y-axis of the security\nmarket line, whereas Jensen's alpha is the intercept on the y-axis of the security\ncharacteristic line.\nPortfolio Management: describe and demonstrate applications of the CAPM and the SML", "qhtml": null}, {"n": 74, "q": "With respect to an investment policy statement, which of the following is most closely\nlinked to the client's distinctive needs?", "opts": ["The evaluation and review section", "The objectives and constraints sections", "The statement of duties and responsibilities"], "ans": "B", "expl": "A. Incorrect because the Evaluation and Review section provides guidance on obtaining\nfeedback on investment results.\nB. Correct because the sections that are most closely linked to the client's distinctive needs,\nand probably the most important from a planning perspective, are those dealing with\ninvestment objectives and constraints. An IPS [investment policy statement] focusing on\nthese two elements has been called an IPS in an 'objectives and constraints' format.\nC. Incorrect because the Statement of Duties and Responsibilities details the duties and\nresponsibilities of the client, the custodian of the client's assets, and the investment\nmanagers.\nPortfolio Management: describe the major components of an IPS", "qhtml": null}, {"n": 75, "q": "The slope of the security market line is most likely the:", "opts": ["security's beta.", "market risk premium.", "market risk premium divided by the market standard deviation."], "ans": "B", "expl": "A. Incorrect because the security's beta is the slope of the security characteristic line (SCL),\nnot the security market line. The SCL is a plot of the excess return of the security on the\nexcess return of the market. The beta is the slope.\nB. Correct because the security market line (SML) is a graphical representation of the capital\nasset pricing model with beta, reflecting systematic risk, on the x-axis and expected return\non the y-axis. The slope of this line is the market risk premium, R -R.\nm f\nC. Incorrect because it is the slope of the capital market line (CML). E(R )- R/𝜎 not the\nm f 𝑚\nsecurity market line. Since the market standard deviation is unlikely to be 1, the slope of the\nCML is most likely not the slope of the SML\nPortfolio Management: explain the capital asset pricing model (CAPM), including its\nassumptions, and the security market line (SML)", "qhtml": null}, {"n": 76, "q": "Which of the following performance measures is equal to the slope of the capital\nallocation line?", "opts": ["M²", "Sharpe ratio", "Treynor ratio"], "ans": "B", "expl": "A. Incorrect because M² provides a measure of portfolio return that is adjusted for the total\nrisk of the portfolio relative to that of some benchmark. While M² is related to the Sharpe\nratio, it is calculated in a different way and is measured in different units, therefore it does\nnot represent the slope of the capital allocation line.\nB. Correct because the Sharpe ratio, also called the reward-to-variability ratio, is simply the\nslope of the capital allocation line.\nC. Incorrect because the Treynor ratio corresponds to the slope of the security market line,\nnot the capital allocation line. The Treynor ratio is a simple extension of the Sharpe ratio and\nresolves the Sharpe ratio's first limitation by substituting beta (systematic risk) for total risk.\nPortfolio Management: calculate and interpret the Sharpe ratio, Treynor ratio, M 2, and\nJensen's alpha", "qhtml": null}, {"n": 77, "q": "Which of the following sections of an investment policy statement for a pension plan\nmost likely specifies the discretion that portfolio managers have with respect to executing the\ninvestment strategy?", "opts": ["Procedures", "Investment Constraints", "Statement of Duties and Responsibilities"], "ans": "C", "expl": "A. Incorrect because the Procedures section explains the steps to take to keep the IPS\ncurrent and the procedures to follow to respond to various contingencies.\nB. Incorrect because the Investment Constraints section presents the factors that constrain\nthe client in seeking to achieve the investment objectives. The constraints section covers\nfactors that need to be taken into account when constructing a portfolio for the client that\nmeets the objectives. The typical categories are liquidity requirements, time horizon,\nregulatory requirements, tax status, and unique needs. The constraints may be internal (l.e.,\nset by the client), or external (i.e., set by law or regulation).\nC. Correct because the Statement of Duties and Responsibilities section details the duties\nand responsibilities of the client, the custodian of the client's assets, and the investment\nmanagers. In the case of an institution, such as a pension plan or university endowment, the\nIPS may set out the governance arrangements that apply to the investment funds. For\nexample, this information could cover the investment committee's approach to appointing\nand reviewing investment managers for the portfolio, and the discretion that those\nmanagers have.\nPortfolio Management: describe the major components of an IPS", "qhtml": null}, {"n": 78, "q": "Which of the following measures is most appropriate to evaluate the performance of a\nportfolio that is not fully diversified?", "opts": ["Sharpe ratio", "Treynor ratio", "Jensen's alpha"], "ans": "A", "expl": "A. Correct because total risk is relevant for an investor when he or she holds a portfolio that\nis not fully diversified, which is not a desirable portfolio. In such cases, the Sharpe ratio and\nM² are appropriate performance measures. The Sharpe ratio uses total risk as a measure of\nrisk.\nB. Incorrect because performance measures relative to beta risk-Treynor ratio and Jensen's\nalpha-are relevant when the investor holds a well-diversified portfolio with negligible\ndiversifiable risk.\nC. Incorrect because performance measures relative to beta risk-Treynor ratio and Jensen's\nalpha-are relevant when the investor holds a well-diversified portfolio with negligible\ndiversifiable risk.\nPortfolio Management: calculate and interpret the Sharpe ratio, Treynor ratio, M 2, and\nJensen's alpha", "qhtml": null}, {"n": 79, "q": "An analyst gathers the following information about three stocks:\nBeta Standard Deviation of Returns\nStock 1 0.9 17%\nStock 2 1.1 18%\nStock 3 1.2 16%\nIf the standard deviation of market returns is equal to 10%, the stock with the highest\nnonsystematic risk is:", "opts": ["Stock 1.", "Stock 2.", "Stock 3."], "ans": "A", "expl": "A. Correct because Total variance = Systematic variance + Nonsystematic variance, which\ncan be written as 𝜎 ² = 𝛽 ² 𝜎 ² + 𝜎 ² . Thus, 𝜎 ² = 𝜎 ² -𝛽 ² 𝜎 ² . Thus, nonsystematic variance\n𝑖 𝑖 𝑚 𝑒 𝑒 𝑖 𝑖 𝑚\nfor Stock 1 is equal to (0.17)2 - (0.9)2(0.1)² = 0.0208. For Stock 2, this is equal to (0.18)2-\n(1.1)2(0.1)² = 0.0203. For Stock 3, this is equal to (0.16)² - (1.2)2(0.1)²= 0.0112. Therefore,\nStock 1 has the highest nonsystematic variance and the highest idiosyncratic risk.\nNonsystematic risk is the risk that pertains to a single company or industry and is also\nknown as company- specific, industry-specific, diversifiable, or idiosyncratic risk.\nB. Incorrect because Stock 2 has the highest total risk, not the highest nonsystematic risk.\nTotal risk is calculated as the square root of total variance.\nC. Incorrect because Stock 3 has the highest beta and thus highest systematic risk, not the\nhighest nonsystematic risk. Systematic risk is calculated as 𝛽 𝜎\n𝑖 𝑚\nPortfolio Management: explain systematic and nonsystematic risk, including why an\ninvestor should not expect to receive additional return for bearing nonsystematic risk", "qhtml": null}, {"n": 80, "q": "Which of the following metrics is most appropriate to estimate a bond's average extreme\nloss?", "opts": ["VaR of loss", "Standard deviation of loss", "Expected loss given default"], "ans": "C", "expl": "A. Incorrect because in a VaR measure, there is no ultimate maximum that one can state.\nVaR is thus a minimum extreme loss metric. Thus, the average loss cannot be provided by\nthe VaR.\nB. Incorrect because a standard deviation may not exist for return distributions with fat tails.\nThus, the use of is not appropriate when estimating extreme losses.\nC. Correct because the statistics used to estimate VaR can be used to gauge average\nextreme losses. Conditional standard deviation VaR or CVaR is a common tail loss measure,\ndefined as the weighted average of all loss outcomes in the statistical distribution that\nexceed the VaR loss. Another tail risk metric in the credit risk space that is analogous to\nCVAR is expected loss given default, which answers the question for a debt security, If the\nunderlying company or asset defaults, how much do we lose on average?\nPortfolio Management: describe methods for measuring and modifying risk exposures and\nfactors to consider in choosing among the methods", "qhtml": null}, {"n": 81, "q": "An analyst gathers the following information about the security market line (SML) and a\nstock:\nIntercept of the SML 2%\nSlope of the SML 5%\nStock's beta 1.3\nAccording to capital market theory, if the analyst believes the stock will have a return of 7%,\nthe stock is:", "opts": ["undervalued.", "properly valued.", "overvalued."], "ans": "C", "expl": "A. Incorrect because the analyst forecasts the return of the asset to be 7%, which is lower\nthan the expected return of 8.5% according to the CAPM. Thus, the security plots below the\nSML and should be considered overvalued. This response would be chosen if the expected\nreturn of the asset was wrongly computed as 0.02 + 1.3 x (0.05 - 0.02) = 0.059 = 5.9%, which\nwould imply that the asset plots above the SML.\nB. Incorrect because the analyst forecasts the return of the asset to be 7%, which is lower\nthan the expected return of 8.5% according to the CAPM. Thus, the security does not plot\non the SML and it is not properly valued according to the CAPM. This response would be\nchosen if beta was omitted in the CAPM equation and the expected return of the asset was\nwrongly computed as 0.02 + 𝛽 ² 𝜎 ² 0.05 = 0.07 = 7.0%, which would imply that the asset\n𝑖 𝑚\nplots on the SML.\nC. Correct because the security market line (SML) is a graphical representation of the capital\nasset pricing model with beta, reflecting systematic risk, on the x-axis and expected return\non the y-axis. Using the same concept as the capital market line, the SML intersects the y-\naxis at the risk-free rate of return, and the slope of this line is the market risk premium, R -\nm\nR. Potential investors can plot a security's expected return and beta against the SML and\nf\nuse this relationship to decide whether the security is overvalued or undervalued in the\nmarket. All securities that reflect the consensus market view are points directly on the SML\n(Le properly valued). If a point representing the estimated return of an asset is above the\nSML, the asset has a low level of risk relative to the amount of expected return and would\nbe a good choice for investment In contrast, if the point representing a particular asset is\nbelow the SML the stock is considered overvalued. The asset will be on the SML if the\nforecasted return equals the expected return of 0.02 + 1.3 x 0.05 = 0.085 = 8.5%. Since the\nanalyst forecasts the return of the asset to be 7%, which is lower than the expected return\naccording to the CAPM, the security plots below the SML and should be considered\novervalued.\nPortfolio Management: describe and demonstrate applications of the CAPM and the SML", "qhtml": null}, {"n": 82, "q": "Relative to passive market-cap-weighted strategies, smart beta strategies typically have:", "opts": ["lower management fees and higher portfolio turnover.", "higher management fees and lower portfolio turnover.", "higher management fees and higher portfolio turnover."], "ans": "C", "expl": "A. Incorrect because typically, smart beta strategies feature somewhat higher [not lower]\nmanagement fees and higher portfolio turnover relative to passive market-cap weighted\nstrategies.\nB. Incorrect because typically, smart beta strategies feature somewhat higher management\nfees and higher [not lower] portfolio turnover relative to passive market-cap weighted\nstrategies.\nC. Correct because typically, smart beta strategies feature somewhat higher management\nfees and higher portfolio turnover relative to passive market-cap weighted strategies.\nPortfolio Management: describe aspects of the asset management industry", "qhtml": null}, {"n": 83, "q": "When defining asset classes for a strategic asset allocation, which of the following\npairwise correlations between asset class returns is most preferable?", "opts": ["0.0", "0.5", "1.0"], "ans": "A", "expl": "A. Correct because when defining asset classes, a number of criteria apply. Intuitively, an\nasset class should contain relatively homogeneous assets while providing diversification\nrelative to other asset classes. In statistical terms, risk and return expectations should be\nsimilar and paired correlations of assets should be relatively high within an asset class but\nshould be lower versus assets in other asset classes. A between asset class correlation of\nzero would indicate better defined asset classes than higher correlations would.\nB. Incorrect because when defining asset classes, a number of criteria apply. Intuitively, an\nasset class should contain relatively homogeneous assets while providing diversification\nrelative to other asset classes. In statistical terms, risk and return expectations should be\nsimilar and paired correlations of assets should be relatively high within an asset class but\nshould be lower versus assets in other asset classes. A between asset class correlation of 0.5\nwould indicate less well defined asset classes than a zero correlation would.\nC. Incorrect because when defining asset classes, a number of criteria apply. Intuitively, an\nasset class should contain relatively homogeneous assets while providing diversification\nrelative to other asset classes. In statistical terms, risk and return expectations should be\nsimilar and paired correlations of assets should be relatively high within an asset class but\nshould be lower versus assets in other asset classes. A between asset class correlation of 1.0\nwould indicate less well defined asset classes than a zero correlation would. A candidate\nmay choose this response if they confuse the criteria for correlation across asset classes\nwith the criteria for correlation within each asset class (which should be high).\nPortfolio Management: explain the specification of asset classes in relation to asset\nallocation", "qhtml": null}, {"n": 84, "q": "According to capital market theory, an efficient market does not reward investors for\ntaking on:", "opts": ["market risk.", "systematic risk.", "idiosyncratic risk."], "ans": "C", "expl": "A. Incorrect because systematic risk, also known as non-diversifiable or market risk, is the\nrisk that affects the entire market or economy. Systematic or non-diversifiable risk is priced\nand investors are compensated for holding assets or portfolios based only on that\ninvestment's systematic risk. Investors do not receive any return for accepting\nnonsystematic or diversifiable risk.\nB. Incorrect because systematic risk, also known as non-diversifiable or market risk, is the\nrisk that affects the entire market or economy. Systematic or non-diversifiable risk is priced\nand investors are compensated for holding assets or portfolios based only on that\ninvestment's systematic risk. Investors do not receive any return for accepting\nnonsystematic or diversifiable risk.\nC. Correct because we can assume that in an efficient market, no incremental reward can be\nearned for taking on diversifiable risk. Nonsystematic risk is the risk that pertains to a single\ncompany or industry and is also known as company-specific, industry-specific, diversifiable,\nor idiosyncratic risk.\nPortfolio Management: explain systematic and nonsystematic risk, including why an\ninvestor should not expect to receive additional return for bearing nonsystematic risk", "qhtml": null}, {"n": 85, "q": "Which of the following is most likely a legal and regulatory constraint in an investment\npolicy statement?", "opts": ["A pension fund's decision to limit investments in real estate", "A taxable investor's requirement to avoid investments in securities generating interest income", "A public company director's restriction on trading the company's stock shortly before the publication of financial results"], "ans": "C", "expl": "A. Incorrect because there is no indication that the pension fund's decision to constrain\ninvestments in real estate is driven by legal and regulatory factors. Moreover, the word\n'decision' highlights that it is not an external requirement, which would be the case if it was\nrequired by law or regulation\nB. Incorrect because this constraint is driven by economic considerations of the client and\nthus would be reflected in the tax concerns section of the IFS and not in the legal and\nregulatory constraints. In many cases, the portfolio should reflect the tax status of the\nclient. For example a taxable investor may wish to hold a portfolio that emphasizes capital\ngains and receives little income\nC. Correct because when an individual has access to material nonpublic information about a\nparticular security this situation may also form a (legal and regulatory] constraint For\nexample, the directors of a public company may need to refrain from trading the company's\nstock at certain points of the year before financial results are published. The IPS should note\nthis constraint so that the portfono manager does not inadvertently trade the stock Do the\nclient's behalf\nPortfolio Management: describe the investment constraints of liquidity, time horizon, tax\nconcerns, legal and regulatory factors and unique circumstances and their implications for\nthe choice of portfolio assets", "qhtml": null}, {"n": 86, "q": "When defining asset classes, the paired correlations of assets within an asset class should\nbe:", "opts": ["negative.", "zero.", "positive."], "ans": "C", "expl": "A. Incorrect because when defining asset classes paired correlations of assets should be\nrelatively high within an asset class.\nB. Incorrect because when defining asset classes paired correlations of assets should be\nrelatively high within an asset class.\nC. Correct because when defining asset classes an asset class should contain relatively\nhomogeneous assets and paired correlations of assets should be relatively high within an\nasset class.\nPortfolio Management: explain the specification of asset classes in relation to asset\nallocation", "qhtml": null}, {"n": 87, "q": "An investor gathers the following information about a security and the market:\nSecurity's beta 0.35\nStandard deviation of the security's returns 12%\nStandard deviation of market returns 18%\nThe correlation between the security's returns and the market's returns is closest to:", "opts": ["0.2.", "0.5.", "0.8."], "ans": "B", "expl": "A. Incorrect because it confuses 𝜎 , and 𝜎 and calculates 𝜌 = 𝛽 x 𝜎 /𝜎 = 0.35 x\n𝑖 𝑚 𝑖,𝑚 𝑖 𝑖 𝑚\n0.12/0.18 = 0.233 ≈ 0.2. This answer is also obtained if, as an additional mistake, variances\nare used 𝜌 = 𝛽 x 𝜎 2/𝜎 2= 0.35 x (0.12)2/(0.18)2 = 0.156 ≈ 0.2.\n𝑖,𝑚 𝑖 𝑖 𝑚\nB. Correct because 𝛽 = 𝜌 x 𝜎 /𝜎 where 𝜌 denotes the correlation between the asset\n𝑖 𝑖,𝑚 𝑖 𝑚 𝑖,𝑚\nreturns and the market returns, and σ, and σ denote the standard deviation of the asset\nreturns and the market returns, respectively. Thus, correlation 𝜌 = 𝛽 x 𝜎 /𝜎 = 0.35 x\n𝑖,𝑚 𝑖 𝑚 𝑖\n0.18/0.12 = 0.525 ≈ 0.5.\nC. Incorrect because it uses variances instead of standard deviations in the correct formula;\n𝜌 = 𝛽 x 𝜎 2/𝜎 2 = 0.35 * (0.18)2/(0.12)²= 0.788 ≈ 0.8.\n𝑖,𝑚 𝑖 𝑚 𝑖\nPortfolio Management: calculate and interpret beta", "qhtml": null}, {"n": 88, "q": "A bank determines that its value at risk (VAR) is £5 million at 5% for one day. The bank is\nexpecting a minimum loss of £5 million once every:", "opts": ["5 business days.", "13 business days.", "20 business days."], "ans": "C", "expl": "A. Incorrect because with a probability of 5% and a measurement period of one day, we can\ninterpret the bank's VaR as expecting a minimum loss of £5 million once every 20 business\ndays.\nB. Incorrect because with a probability of 5% and a measurement period of one day, we can\ninterpret the bank's VaR as expecting a minimum loss of £5 million once every 20 business\ndays. Based on a year with 250 to 260 business days, this should occur 12.5 to 13 times per\nyear (roughly once per month).\nC. Correct because with a probability of 5% and a measurement period of one day, we can\ninterpret the bank's VaR as expecting a minimum loss of £5 million once every 20 business\ndays.\nPortfolio Management: describe methods for measuring and modifying risk exposures and\nfactors to consider in choosing among the methods", "qhtml": null}, {"n": 89, "q": "A good risk management process should:", "opts": ["predict when a crisis will occur.", "consider the balance between expected returns and losses.", "only consider losses occurring from events that have a high likelihood."], "ans": "B", "expl": "A. Incorrect because risk management is not even about predicting risks. The Doctrine of No\nSurprises' is a key mantra among many risk managers, but it does not mean they are\nexpected to predict what will happen. For example, a risk manager of a bank would not have\nbeen expected to know that a real estate crisis was going to occur and cause significant\ndefaults on the bank's real estate securities.\nB. Correct because a good risk management process would include a deep discussion at the\ngovernance level about the balance between the likely returns and the unlikely-but sizable-\nlosses and whether such losses are tolerable.\nC. Incorrect because a poor risk management process would have ignored the possibility,\nthough small, of such a significant market event and not quantified the potential loss.\nPortfolio Management: define risk management", "qhtml": null}, {"n": 90, "q": "A portfolio consisting of two securities has the following characteristics:\nSecurity Portfolio Weight Standard Deviation\n1 40% 15%\n2 60% 18%\nIf the correlation of returns between the two securities is 0.20, the portfolio's standard\ndeviation of returns is closest to:", "opts": ["1.8%.", "9.1%.", "13.4%."], "ans": "C", "expl": "A. Incorrect because it is portfolio variance instead of standard deviation:\n𝜎2=𝑤2𝜎2 +𝑤2𝜎2 +2𝑤 𝑤 𝜌 𝜎 𝜎\n𝑝 1 1 2 2 1 2 12 1 2\n=(0.4)2(0.15)2(+(0.6)2 (0.18)2(+2(0.4) (0.6)(0.2)(0.15)(0.18)\n=(0.16) (0.0225) + (0.36) (0.0324) + (0.002592)=0.017856 1.8%.\nB. Incorrect because it uses standard deviations instead of variances in the formula for the\nportfolio standard deviation:\n𝜎2=𝑤2𝜎 +𝑤2𝜎 +2𝑤 𝑤 𝜎 𝜎 𝜌\n𝑝 1 1 2 2 1 2 1 2 12\n(0.4)2 (0.15) + (0.6)2 (0.18) +2(0.4)(0.6) (0.20)(0.15)(0.18)\n(0.024)+(0.0648)+(0.002592)\n=0.091392≈9.1%.&\nC. Correct because 𝜎 =\n𝑝𝑜𝑟𝑡\n√𝑤2𝜎2 +𝑤2𝜎2 +2𝑤 𝑤 𝜌 𝜎 𝜎\n1 1 2 2 1 2 1,2 1 2\n√(0.4)2 (0.15)2 +(0.6)2 (0.18)2 +2(0.4)(0.6)(0.2)(0.15)(0.18)\n(0.16) (0.0225)+(0.36) (0.0324)+0.002592\n=√0.017856\n= 0.133626≈13.4%.\nPortfolio Management: calculate and interpret portfolio standard deviation", "qhtml": "<p>A portfolio consisting of two securities has the following characteristics:</p><table class=\"qtable\"><thead><tr><th>Security</th><th>Portfolio Weight</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>1</td><td>40%</td><td>15%</td></tr><tr><td>2</td><td>60%</td><td>18%</td></tr></tbody></table><p>If the correlation of returns between the two securities is 0.20, the portfolio's standard deviation of returns is closest to:</p>"}, {"n": 91, "q": "An investor has a 15-year time horizon but needs to withdraw funds from her portfolio in\none year's time to pay for tuition fees. Which of the following investments is most suitable to\ncover the investor's liquidity requirement due to the tuition fees?", "opts": ["Commercial paper", "Private equity securities", "Large-capitalization stocks"], "ans": "A", "expl": "A. Correct because, although the investor has a time horizon of 15 years, she has liquidity\nneeds in one year When the client does have such a requirement, the manager should\nallocate part of the portfolio to cover the liability This part of the portfolio will be invested in\nassets that are liquid-that is, easily converted to cash-and low risk at the point in time the\nliquidity neee is actually present (eg a bond maturing at the Ume whee private education\nexpenses will be incurred), so that their value is known with reasonable certainty\nCommercial paper is a short- term. negotiable, unsecured promissory nere that represents a\ndebt obligation of the issuer Thus commercial paper being a short-term investment. It is\nmore suitable compared to private equity and large capitalization stocks to be included in\nthe portion of the investor's porono that has the short-term liquidity need\nB. Incorrect because, although the investor has a time horizon of 15 years, she has liquidity\nneeds in one year. When the client does have such a requirement, the manager should\nallocate part of the portfolio to cover the liability. This part of the portfolio will be invested\nin assets that are liquid-that is, easily converted to cash-and low risk at the point in time the\nliquidity need is actually present (eg., a bond maturing at the time when private education\nexpenses will be incurred), so that their value is known with reasonable certainty. Private\nequity securities are not listed on public exchanges and have no active secondary market.\nThey are issued primarily to institutional investors via non-public offerings, such as private\nplacements. Being illiquid, they are not suitable to be included in the portion of the client's\nportfolio that has the short-term liquidity need.\nC. Incorrect because, although the investor has a time horizon of 15 years, she has liquidity\nneeds in one year When the client does have such a requirement, the manager should\nallocate part of the portfolio to cover the liability. This part of the portfolio will be invested\nin assets that are liquid-that is, easily converted to cash-and low risk at the point in time the\nliquidity need is actually present (e.g., a bond maturing at the time when private education\nexpenses will be incurred), so that their value is known with reasonable certainty Thus,\nlarge- capitalization stocks, being a more volatile investment than commercial paper, would\nbe less suitable to be included in the portion of the investor's portfolio that has the short-\nterm liquidity need.\nPortfolio Management: describe the investment constraints of liquidity, time horizon, tax\nconcerns, legal and regulatory factors, and unique circumstances and their implications for\nthe choice of portfolio assets", "qhtml": null}, {"n": 92, "q": "With respect to capital market theory, which of the following statements is most\naccurate?", "opts": ["The optimal risky portfolio is dependent on the risk-free rate.", "The optimal risky portfolio is dependent on the investor's risk profile.", "The investor's optimal portfolio must lie on the Markowitz efficient frontier."], "ans": "A", "expl": "A. Correct because, for a given Markowitz efficient frontier, a different risk-free rate will\nresult in a different tangent to the frontier, hence a different optimal risky portfolio CAL(P)\nis the optimal capital allocation line and Portfolio P is the optimal risky portfolio. Thus, with\nthe addition of the risk-free asset, we are able to narrow our selection of risky portfolios to\na single optimal risky portfoilo, P which is at the tangent of CAL(P) and the efficient frontier\nof risky assets.\nB. Incorrect because the optimal risky portfolio is selected from numerous risky portfolios\nwithout considering the investor's preferences.\nC. Incorrect because all investors regardless of taste, risk preferences, and initial wealth will\nhold a combination of two portfolios or funds. a risk-free asset and an optimal portfolio of\nrisky assets. The investor's optimal portfolio thus lies on the capital allocation line (CAL), not\non the Markowitz efficient frontier. If it is optimal for an investor to allocate no wealth to\nthe risk-free asset, the investor's optimal portfolio will lie on the Markowitz efficient frontier\nHowever, this is not 'always' the case.\nPortfolio Management: explain the selection of an optimal portfolio, given an investor's\nutility (or risk aversion) and the capital allocation line", "qhtml": null}, {"n": 93, "q": "An analyst gathers the following information:\nStandard Deviation of Returns Beta\nAsset 70% 1.8\nMarket portfolio 35% 1.0\nThe covariance between the returns of the asset and the market is closest to:", "opts": ["0.22.", "0.40.", "0.90."], "ans": "A", "expl": "A. Correct because, given the beta of an asset (𝛽 ), the covariance between the asset\n𝑖\nreturns (𝑅 ) and the market portfolio returns (𝑅 ) is given by: Cov(𝑅 𝑅 ) = 𝛽 x 𝜎2 = 1.8 ×\n𝑖 𝑚 𝑖 𝑚 𝑖 𝑚\n0.35² = 0.22\nB. Incorrect because it is the systematic variance of the portfolio; 𝛽 2 x 𝜎2 =1.82 x 0.352 =\n𝑖 𝑚\n0.40.\nC. Incorrect because it is the correlation coefficient, not the covariance, between the asset\nreturns and the market portfolio returns, 𝜌 = 𝛽 ∗ 𝜎 /𝜎 = 1.8 x 0.35/0.70 = 0.90. It is\n𝑖,𝑚 𝑖 𝑚 𝑖\nalso the closest answer if the asset return variance is used in the correct formula instead of\nthe market return variance; 1.8 x 0.70² = 0.88.\nPortfolio Management: calculate and interpret beta", "qhtml": "<p>An analyst gathers the following information:</p><table class=\"qtable\"><thead><tr><th></th><th>Standard Deviation of Returns</th><th>Beta</th></tr></thead><tbody><tr><td>Asset</td><td>70%</td><td>1.8</td></tr><tr><td>Market portfolio</td><td>35%</td><td>1.0</td></tr></tbody></table><p>The covariance between the returns of the asset and the market is closest to:</p>"}, {"n": 94, "q": "A security with a beta of 1.5 has an expected return of 11% according to the CAPM. If the\nrisk-free rate is 2%, the market risk premium is closest to:", "opts": ["4.0%.", "6.0%.", "7.3%."], "ans": "B", "expl": "A. Incorrect\nIncorrect because it uses an incorrect CAPM equation to calculate the expected return of a\nsecurity as E(𝑅 ) = 𝑅 +𝛽 x E(𝑅 ), such that E(𝑅 ) = [E(𝑅 )- 𝑅 /𝛽 ; = (0.11 -0.02)/1.5=\n𝑖 𝑓 𝑖 𝑚 𝑚 𝑖 𝑓 𝑖\n0.066%. Since the market risk premium is 𝑅 −𝑅 , it follows that the market risk premium\n𝑚 𝑓\nis calculated as 6% - 2% = 4%.\nB. Correct Correct because, according to the CAPM, the expected return of a security is\nE(𝑅 ) = 𝑅 +𝛽 x [E(𝑅 )−𝑅 ], such that [E(𝑅 ) - 𝑅 = E(𝑅 )/ 𝛽 ; = (0.11 -0.02)/1.5 0.06 = 6%.\n𝑖 𝑓 𝑖 𝑚 𝑓 𝑚 𝑓 𝑖 𝑖\nThe market risk premium is E(𝑅 )- 𝑅 =6%.\n𝑚 𝑡\nC. Incorrect because it uses an incorrect CAPM equation to calculate the expected return of\na security as E(𝑅 ) = 𝛽 x E(𝑅 )-𝑅 ,such that [E(𝑅 ) - 𝑅 = E(𝑅 )/ 𝛽 ; = 0.11/1.5= 0.07337.3%.\n𝑖 𝑖 𝑚 𝑓 𝑚 𝑓 𝑖 𝑖\nThe market risk premium is incorrectly calculated as 7.3%.\nThis is also closest to the market return of 8% calculated according to the CAPM equation;\n0.11 = 0.02 + 1.5x [E(𝑅 )-0.02]: E(𝑅 ) = 0.08 = 8%.\n𝑚 𝑚\nPortfolio Management: calculate and interpret the expected return of an asset using the\nCAPM", "qhtml": null}, {"n": 95, "q": "An analyst gathers the following information about a portfolio and the market:\nPortfolio's Sharpe ratio 0.8\nVolatility of portfolio returns 19%\nVolatility of market returns 10%\nCorrelation between portfolio returns and market returns 0.7\nThe portfolio's Treynor ratio is closest to:", "opts": ["0.060.", "0.114.", "0.413."], "ans": "B", "expl": "A. Incorrect because\n0.060 = SR * (𝜎\n𝑝∕𝛽𝑝 ′\n) = 0.8 x (0.19/2.527),\nwhere\nβ ’ = incorrectly calculated portfolio beta = ρ (𝜎2 ∕𝜎2)=0.7 x (0.192/0.12) = 2.527.\np pm 𝑝 𝑚\nB. Correct because\n𝑇𝑅 = (𝑅 −𝑅 )∕𝛽 = [(𝑅 −𝑅 )∕𝜎 ]𝑥(𝜎𝑝∕ < 𝐵 )= 0.8 x (0.19/1.33)=0.114,\n𝑝 𝑓 𝑝 𝑝 𝑓 𝑝 𝑝\nwhere\nσ = standard deviation of market returns = 0.10 (given);\nσ = standard deviation of portfolio returns = 0.19 (given)\nPpm-correlation between market and portfolio = 0.7 (given);\n𝛽 -portfolio beta = Pp.m(𝜎 ∕𝜎 )=0.7 x (0.19/0.1) 1.33 (per𝛽 = Pim(𝜎 ∕𝜎 ));\n𝜑 𝑝 𝑚 𝜑 𝑝 𝑚\n𝑅 = portfolio's return;\n𝑝\n𝑅 = risk-free rate of interest;\n𝑓\nTR=Treynor ratio;\nSR = Sharpe ratio, where SR = (𝑅 −𝑅 )∕𝜎\n𝑝 𝑓 𝑝\nC. Incorrect because\n0.413 SR x (𝜎 ∕𝛽∗)= 0.8 x (0.19/0.368),\n𝑝 𝑝\nwhere\n𝛽 ∗= incorrectly calculated portfolio beta = Ppm (𝜎 ∕𝜎 ) = 0.7 × (0.1/0.19) = 0.368.\n𝑝 𝑚 𝑝\nPortfolio Management: calculate and interpret the Sharpe ratio, Treynor ratio, M 2, and\nJensen's alpha", "qhtml": null}, {"n": 96, "q": "For an equally weighted portfolio, an increase in the correlations between asset returns\nmost likely decreases the:", "opts": ["portfolio's expected return.", "portfolio's standard deviation of returns.", "level of risk reduction provided by the portfolio."], "ans": "C", "expl": "A. Incorrect because the equally weighted portfolio's return is the same as the return on the\nrandomly selected security. Thus, a portfolio's expected return is not influenced by the\ncorrelations between assets. The portfolio return varies with weights but is unaffected by\nthe correlation coefficient.\nB. Incorrect because the standard deviation of an equally weighted portfolio is not simply\nthe average of the standard deviations of the individual shares. Such a portfolio offers a\nlower standard deviation of return than the average of its individual components due to the\ncorrelations or interactions between the individual securities, Thus, a portfolio's standard\ndeviation of returns is influenced by the correlations between assets.\nFor example, the standard deviation of a two-asset portfolio simplifies to the following\n𝜎 = √𝑤2𝜎2 +𝑤2𝜎2 +2𝑤 𝑤 𝜌 𝜎 𝜎\n𝑝 1 1 2 2 1 2 1,2 1 2\nIt follows that an increase in the correlation among assets will result in an increase in the\nportfolio's standard deviation, not a decrease.\nC. Correct because, as the correlations between asset returns increase, the diversification\nbenefit provided by portfolios decreases. A major reason that portfolios can effectively\nreduce risk is that combining securities whose returns do not move together provides\ndiversification. However, an important issue is that the co-movement or correlation pattern\nof the securities' returns in the portfolio can change in a manner unfavorable to the\ninvestor. When we examine the returns of a set of global equity indexes over the last 15\nyears, we observe a reduction in the diversification benefit due to a change in the pattern of\nco-movements of returns. The degree to which these global equity indexes move together\nhas increased over time.\nThe lesson is that although portfolio diversification generally does reduce risk, it does not\nnecessarily provide the same level of risk reduction during times of severe market turmoil as\nit does when the economy and markets are operating 'normally’.\nPortfolio Management: describe the portfolio approach to investing", "qhtml": null}, {"n": 97, "q": "An adviser gathers the following information about a client's retirement income needs:\n• The current balance of the client's retirement fund is $150,000.\n• The client plans to retire in 15 years' time.\n• $500,000 in today's money is needed to fund retirement.\n• No further retirement fund contributions will be made.\nInflation is expected to average 2% per year over the next 15 years. Based only on the above\ninformation and ignoring taxes, the minimum annual rate of return required to meet the\nclient's retirement income objective is closest to:", "opts": ["6.2%.", "8.4%.", "10.5%."], "ans": "C", "expl": "A. Incorrect because it adjusts for inflation in the wrong direction, ie. it assumes that, in\norder to reach $500,000 in 15 years' time, we must equate $500,000 to $150,000 x 1.0215 x\n(1+r)15, which yields: r = [$500,000/($150,000 * 1.0215)11/15-1=0.062 = 6.2%. Alternatively,\nafter calculating the nominal return via $150,000(1+r)15 = X $500,000, it then adjusts for\ninflation by subtracting, rather than adding, the expected inflation rate from the nominal\nrate, [$500,000/$150,000]1/15-1-0.02 = 8.4% - 2.0% = 6.4%, which is closest to this response.\nB. Incorrect because it does not take into account the effect of inflation on the individual's\nretirement income needs. In other words, it assumes that the portfolio needs to grow to at\nleast $500,000 in 15 years' time, rather than to this amount adjusted upward for inflation.\nHence, the minimum required rate of return, r, satisfies $150,000(1 + r)15 = $500,000, giving\nr = [$500,000/$150,000]1/15 – 1 = 0.084 = 8.4%. Calculator solution: N = 15; PV = - 150,000;\nFV 500,000; compute I/Y = 8.4%.\nC. Correct because, at 2% annual inflation, $500,000 in today's money equates to\n$500.00(1.02)15 = $672.934 in 15 years' time. Since no further contributions to the\nretirement fund will be made, the current savings of $150,000 must grow to at least\n$672,934 in 15 years' time to meet the individual's retirement income objective. Hence, the\nminimum required rate of return, r, satisfies $150,000(1+r)15= $672,934, giving r =\n[$672,934/$150,000]1/15 – 1 = 0.105 = 10.5% Calculator solution: (1) N = 15; I/Y = 2%, PV=-\n500,000; compute FV = 672,934. (2) N = 15; PV =-150,000; FV = 672,934; compute I/Y =\n10.5%.\nAlternatively, a candidate could compute the nominal required rate of return via\n$150,000(1+r)15 = $500,000, giving r = [$500,000/$150,000]1/15 – 1 = 0.084 = 8.4%, and then\nadjust for inflation as follows: (1+0.084) x (1 + 0.02) - 1 = 0.105 = 10.5%. If a candidate\nadjusted for inflation by adding the expected inflation rate, they would also arrive at\n(approximately) the Correct answer: 8.4% +2.0% 10.4%.\nPortfolio Management: describe risk and return objectives and how they may be developed\nfor a client", "qhtml": null}, {"n": 98, "q": "As the number of assets in an equally weighted portfolio becomes large, the portfolio's\nvariance of returns most likely approaches:", "opts": ["zero.", "the average variance of the individual assets' returns.", "the average covariance between the individual assets' returns."], "ans": "C", "expl": "A. Incorrect because for portfolios with a large number of assets, covariance among the\nassets accounts for almost all of the portfolio's risk. A candidate may select this answer\nchoice if they extrapolate the fact that portfolio variance is reduced when more assets are\nadded to a portfolio. This argument however fails to acknowledge the limits of\ndiversification.\nB. Incorrect because the contribution of the average variance of the individual assets to the\ntotal portfolio variance becomes negligible as the number of assets becomes large.\nFurthermore, for portfolios with a large number of assets, covariance among the assets\naccounts for almost all of the portfolio's risk.\nC. Correct because, given equal weights and average variance/covariance [denoted o² and\nCov, respectively], we can rewrite the portfolio variance as𝜎2 = 𝜎 2 +[(𝑁−1)∕𝑁]𝐶𝑜𝑣\n𝑝\n𝑁\nThe equation shows that as / becomes large, the first term on the right side with the\ndenominator of N becomes smaller and smaller, implying that the contribution of one\nasset's variance to portfolio variance gradually becomes negligible. The second term,\nhowever, approaches the average covariance as N increases. It is reasonable to say that for\nportfolios with a large number of assets, covariance among the assets accounts for almost\nall of the portfolio's risk.\nPortfolio Management: describe the effect on a portfolio's risk of investing in assets that\nare less than perfectly correlated", "qhtml": null}, {"n": 99, "q": "In risk management, which of the following should be taken into account when\ndetermining an enterprise's risk tolerance?", "opts": ["Management compensation", "The enterprise's value at risk (VaR)", "The government and regulatory landscape"], "ans": "C", "expl": "A. Incorrect because, in the context of risk management, certain factors should not\ndetermine risk tolerance, but in many cases they do. Personal motivations, beliefs, and\nagendas of board members (the agency problem); company size, whether the market\nenvironment seems stable, short-term pressures, and management compensation often\naffect risk tolerance in ways that might not be in line with the owners best interests.\nB. Incorrect because, in the context at risk management. risk budgeting picks up where risk\ntolerance leaves off Whereas risk tolerance focuses on the appetite for risk and what is and\nis not acceptable, risk budgeting has a more specific focus on now that risk is taken. Risk\nbudgeting quantifies and allocates the tolerable risk by specific metrics, it extends and\nguides implementation of the risk tolerance decision,\nC. Correct because, in the context of risk management, factors such as a company's goals, its\nexpertise in certain areas, and its strategies will help a board determine which risks the\ncompany may pursue and with how much intensity. The government and regulatory\nlandscape is important too, both in their ex ante demands on how companies approach risk\nand in the likely ex post reaction in the event of disasters.\nPortfolio Management: explain how risk tolerance affects risk management", "qhtml": null}, {"n": 100, "q": "Two investors have indifference curves that are tangent to the same capital allocation\nline (CAL). If Investor 1 is more risk averse than Investor 2, Investor 1's optimal portfolio is:", "opts": ["to the left of Investor 2's optimal portfolio on the CAL.", "at the same point on the CAL as Investor 2's optimal portfolio.", "to the right of Investor 2's optimal portfolio on the CAL."], "ans": "A", "expl": "A. Correct because the optimal portfolio maximizes the return per unit of risk (as it is on the\ncapital allocation line), and it simultaneously supplies the investor with the most satisfaction\n(utility).\nB. Incorrect because, as the investors have different degrees of risk aversion, they will not\nhave the same optimal portfolio. The optimal portfolio maximizes the return per unit of risk\n(as it is on the capital allocation line), and it simultaneously supplies the investor with the\nmost satisfaction (utility).\nC. Incorrect because the less risk-averse investor is willing to accept the additional risk.\nTherefore, the more risk-averse Investor 1 will have an optimal portfolio with less risk and a\nlower expected return than Investor 2. The optimal portfolio maximizes the return per unit\nof risk (as it is on the capital allocation line), and it simultaneously supplies the investor with\nthe most satisfaction (utility).\nPortfolio Management: explain the selection of an optimal portfolio, given an investor's\nutility (or risk aversion) and the capital allocation line", "qhtml": null}];
const CFG = {"title": "Portfolio Management", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 200, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);
