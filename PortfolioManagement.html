 risk."],"ans":"A","expl":"A. Đúng vì rủi ro hệ thống hoặc không thể đa dạng hóa được định giá và các nhà đầu tư\nđược đền bù khi nắm giữ tài sản hoặc danh mục đầu tư chỉ dựa trên rủi ro\nhệ thống của khoản đầu tư đó. Các nhà đầu tư không nhận được bất kỳ lợi nhuận nào khi chấp nhận rủi ro phi hệ thống hoặc có thể đa dạng hóa.\nĐịnh giá hoặc định giá một tài sản tương đương với việc ước tính tỷ lệ lợi nhuận kỳ vọng của nó.\nB. Không chính xác vì rủi ro hệ thống hoặc không thể đa dạng hóa được định giá và các nhà đầu tư\nđược đền bù khi nắm giữ tài sản hoặc danh mục đầu tư chỉ dựa trên rủi ro\nhệ thống của khoản đầu tư đó. Các nhà đầu tư không nhận được bất kỳ lợi nhuận nào khi chấp nhận rủi ro phi hệ thống hoặc có thể đa dạng hóa.\nC. Không chính xác vì rủi ro hệ thống hoặc không thể đa dạng hóa được định giá và các nhà đầu tư\nđược đền bù khi nắm giữ tài sản hoặc danh mục đầu tư chỉ dựa trên rủi ro\nhệ thống của khoản đầu tư đó. Các nhà đầu tư không nhận được bất kỳ lợi nhuận nào khi chấp nhận rủi ro phi hệ thống hoặc có thể đa dạng hóa.\nRủi ro phi hệ thống là rủi ro liên quan đến một công ty hoặc một ngành và còn được\nđược gọi là rủi ro dành riêng cho công ty, ngành cụ thể, có thể đa dạng hóa hoặc đặc ứng.\nQuản lý danh mục đầu tư: giải thích rủi ro hệ thống và phi hệ thống, bao gồm cả lý do tại sao một\nnhà đầu tư không nên mong đợi nhận được lợi nhuận bổ sung khi chịu rủi ro phi hệ thống","qhtml":null},{"n":45,"q":"Which of the following is most accurate regarding an investment policy statement (IPS)?","opts":["Policies on sustainable investing require a separate IPS.","Investment constraints can be determined by the client or by the law.","Clients can specify different spending goals, but each goal must have the same risk tolerance and return objective."],"ans":"B","expl":"A. Không chính xác vì mặc dù IPS đôi khi được bổ sung bằng một tài liệu phác thảo\nchính sách về các chính sách đầu tư bền vững về đầu tư bền vững cũng có thể được tích hợp\ntrong chính IPS. Trong phần còn lại của bài viết này, việc tích hợp đầu tư bền vững\ntrong IPS sẽ là giả định thực tế của chúng tôi.\nB. Đúng vì các ràng buộc có thể là nội bộ (tức là do khách hàng đặt) hoặc bên ngoài (tức là được đặt\ntheo luật hoặc quy định).\nC. Không chính xác vì là một phần trong kế hoạch tài chính của họ, khách hàng có thể chỉ định các mục tiêu chi tiêu cụ thể\n, mỗi mục tiêu trong số đó có thể có các mục tiêu về mức độ chấp nhận rủi ro và lợi nhuận khác nhau.\nQuản lý danh mục đầu tư: mô tả lý do đưa ra tuyên bố chính sách đầu tư bằng văn bản (IPS)","qhtml":null},{"n":46,"q":"An investor's ability to take risk:","opts":["is a function of risk tolerance.","is typically assessed by a psychometric questionnaire.","increases with the length of the investment horizon, all else being equal."],"ans":"C","expl":"A. Không chính xác vì mức độ chấp nhận rủi ro tổng thể của khách hàng là hàm số của khả năng chịu đựng\n(chấp nhận) rủi ro của khách hàng và 'thái độ rủi ro' của họ, có thể được coi là\nsẵn sàng chấp nhận rủi ro\" của khách hàng\", chứ không phải ngược lại.\nB. Không chính xác vì mức độ sẵn sàng [không có khả năng] chấp nhận rủi ro có thể được đánh giá bằng cách thảo luận rủi ro\nvới khách hàng hoặc bằng cách yêu cầu khách hàng hoàn thành bảng câu hỏi tâm lý.\nC. Đúng vì khả năng chịu rủi ro được đo lường chủ yếu dựa trên các yếu tố khách quan,\nchẳng hạn như khoảng thời gian, thu nhập dự kiến và mức độ giàu có so với nợ phải trả. Ví dụ: một nhà đầu tư có tầm nhìn 20 năm có thể được coi là có khả năng\nchịu rủi ro cao hơn, những yếu tố khác không đổi, so với một nhà đầu tư. với thời hạn 2 năm. Sự khác biệt này\nlà do trong hơn 20 năm, có nhiều phạm vi để phục hồi các khoản lỗ hoặc\nđiều chỉnh theo hoàn cảnh khác hơn là trong hơn hai năm.\nQuản lý danh mục đầu tư: giải thích sự khác biệt giữa mức độ sẵn sàng và khả năng\n(năng lực) chấp nhận rủi ro trong việc phân tích mức độ chấp nhận rủi ro tài chính của nhà đầu tư","qhtml":null},{"n":47,"q":"The capital market line most likely consists of portfolios that:","opts":["are fully diversified.","have zero systematic risk.","have nonsystematic risk equal to beta."],"ans":"A","expl":"A. Đúng vì đường thị trường vốn (CML) không áp dụng cho tất cả chứng khoán hoặc tài sản\nmà chỉ đối với các danh mục đầu tư trên đường biên hiệu quả. Đường biên hiệu quả mang lại kết quả tối ưu\nsự kết hợp giữa lợi nhuận kỳ vọng và tổng rủi ro. Rủi ro tổng thể và rủi ro hệ thống chỉ bằng nhau\ncho danh mục đầu tư hiệu quả vì những danh mục đầu tư đó không còn rủi ro có thể đa dạng hóa. Như vậy,\nCML chỉ áp dụng cho danh mục đầu tư được đa dạng hóa tốt.\nB. Không chính xác vì rủi ro phi hệ thống của danh mục thị trường bằng 0, nhưng không phải là\nrủi ro hệ thống. Bởi vì rủi ro phi hệ thống bằng 0 đối với các danh mục đầu tư được đa dạng hóa tốt, chẳng hạn như\ndanh mục thị trường, tổng rủi ro của danh mục thị trường và các danh mục tương tự khác chỉ\nrủi ro hệ thống, đó là 𝛽 𝜎 .Do đó, danh mục đầu tư trên CML không có rủi ro phi hệ thống\n𝑖 𝑚\n(không có hệ thống) rủi ro.\nC. Không chính xác vì tổng rủi ro của danh mục thị trường và các danh mục tương tự khác chỉ bằng\nrủi ro hệ thống, đó là 𝛽 𝜎 . Do đó, danh mục đầu tư trên CML có rủi ro phi hệ thống\n𝑖 𝑚\nbằng 0, không phải beta.\nQuản lý danh mục đầu tư: giải thích đường phân bổ vốn (CAL) và đường thị trường vốn\n(CML)","qhtml":null},{"n":48,"q":"The Markowitz efficient frontier is best described as a curve that:","opts":["lies above and to the left of the minimum-variance frontier.","connects the minimum-variance portfolios for all possible returns.","contains all portfolios of risky assets that rational, risk-averse investors will choose."],"ans":"C","expl":"A. Không chính xác vì đường cong nằm phía trên và bên phải của danh mục đầu tư phương sai-\ntối thiểu toàn cầu được gọi là đường biên hiệu quả Markowitz vì nó chứa tất cả\ndanh mục đầu tư tài sản rủi ro mà các nhà đầu tư hợp lý, không thích rủi ro sẽ lựa chọn. Đường biên hiệu quả\nlà phần trên của đường biên phương sai tối thiểu, nó không nằm phía trên và bên trái của đường biên đó\nB. Không chính xác vì toàn bộ tập hợp danh mục đầu tư có phương sai tối thiểu cho tất cả các kết quả trả về\ncó thể được gọi là biên giới phương sai tối thiểu, chứ không phải biên giới hiệu quả (là\nchỉ là phần trên của biên giới phương sai tối thiểu). So với tập hợp cơ hội đầu tư\n, biên giới phương sai tối thiểu xác định tập hợp nhỏ hơn các khoản đầu tư trong\nmà các nhà đầu tư muốn đầu tư. Lưu ý rằng không có nhà đầu tư sợ rủi ro nào sẽ chọn đầu tư\nvào một danh mục đầu tư vào đêm có biên độ chênh lệch tối thiểu vì danh mục đầu tư trên\nđường biên chênh lệch tối thiểu có thể mang lại lợi nhuận tương tự nhưng có rủi ro thấp hơn.\nC. Đúng vì đường biên hiệu quả Markowitz chứa tất cả danh mục đầu tư tài sản rủi ro mà\ncác nhà đầu tư hợp lý, không thích rủi ro sẽ chọn.\nQuản lý danh mục đầu tư: mô tả và giải thích đường biên hiệu quả và phương sai tối thiểu\ncủa tài sản rủi ro và danh mục đầu tư phương sai tối thiểu toàn cầu","qhtml":null},{"n":49,"q":"Which of the following most likely affects a client's ability to take risk? The client's:","opts":["utility function","degree of risk aversion","level of wealth relative to liabilities"],"ans":"C","expl":"A. Không chính xác vì chức năng tiện ích của khách hàng ảnh hưởng đến sự sẵn lòng chứ không phải khả năng của họ trong việc chấp nhận rủi ro\n. Tiện ích là thước đo mức độ hài lòng tương đối từ việc tiêu dùng nhiều hàng hóa và\ndịch vụ khác nhau hoặc trong trường hợp đầu tư, mức độ hài lòng mà nhà đầu tư có được từ\ndanh mục đầu tư khác nhau.\nB. Không chính xác vì mức độ ngại rủi ro của khách hàng ảnh hưởng đến sự sẵn lòng chứ không phải khả năng\nchấp nhận rủi ro của họ. Thái độ rủi ro hoặc sự sẵn lòng chấp nhận rủi ro là một yếu tố chủ quan hơn dựa trên\ntâm lý của khách hàng.\nC. Đúng vì khả năng chịu rủi ro được đo lường chủ yếu dựa trên các yếu tố khách quan,\nchẳng hạn như khoảng thời gian, thu nhập dự kiến và mức độ giàu có so với nợ phải trả.\nQuản lý danh mục đầu tư: giải thích sự khác biệt giữa mức độ sẵn sàng và khả năng\n(năng lực) chấp nhận rủi ro khi phân tích mức độ chấp nhận rủi ro tài chính của nhà đầu tư","qhtml":null},{"n":50,"q":"The expected return for a security is equal to the market's risk premium. If the risk-free\nrate is positive and the CAPM holds, the beta of the security is:","opts":["less than 1.","equal to 1.","greater than 1."],"ans":"A","expl":"A. Đúng vì phương trình CAPM là E(R) = R +𝛽[E(R ) - R. Do đó, beta của\ni f m f\nbảo mật phải nhỏ hơn 1 để lợi nhuận của chứng khoán bằng với phần bù rủi ro thị trường\nvới điều kiện lãi suất phi rủi ro là dương.\nB. Không chính xác vì phương trình CAPM là E(R) = R +𝛽[E(R ) - R. Do đó, nếu beta bằng\ni f m f\nđến 1, lợi nhuận của chứng khoán sẽ cao hơn phần bù rủi ro thị trường.\nC. Không chính xác vì phương trình CAPM là E(R) = R +𝛽[E(R ) - R. Do đó, nếu beta\ni f m f\nlớn hơn 1 thì lợi nhuận của chứng khoán sẽ cao hơn phí bảo hiểm rủi ro thị trường.\nQuản lý danh mục đầu tư: tính toán và diễn giải lợi nhuận kỳ vọng của một tài sản bằng cách sử dụng\nCAPM","qhtml":null},{"n":51,"q":"Which of the following characteristics is most likely used to determine an investor's\nability to take risk? The investor's:","opts":["risk attitude.","self-confidence.","years until retirement."],"ans":"C","expl":"A. Không chính xác vì thái độ rủi ro hoặc sự sẵn lòng chấp nhận rủi ro là yếu tố chủ quan hơn\ndựa trên tâm lý của khách hàng và có lẽ cả hoàn cảnh hiện tại của họ. Rủi ro\nthái độ là sự sẵn sàng chấp nhận rủi ro của nhà đầu tư chứ không phải khả năng chấp nhận rủi ro của nhà đầu tư.\nB. Không chính xác vì thái độ rủi ro hoặc sự sẵn sàng chấp nhận rủi ro là một yếu tố chủ quan hơn\ndựa trên tâm lý của khách hàng và có lẽ cả hoàn cảnh hiện tại của họ.\nMặc dù danh sách các yếu tố liên quan đến thái độ rủi ro của một cá nhân vẫn còn để tranh luận\n, người ta tin rằng một số yếu tố tâm lý, chẳng hạn như loại tính cách, lòng tự trọng,\nvà khuynh hướng suy nghĩ độc lập, là tương quan với thái độ rủi ro. Do đó, sự tự tin là\nliên quan đến việc nhà đầu tư sẵn sàng chấp nhận rủi ro chứ không phải khả năng\nchấp nhận rủi ro của nhà đầu tư.\nC. Đúng vì khả năng chịu rủi ro được đo lường chủ yếu dựa trên các yếu tố khách quan,\nchẳng hạn như khoảng thời gian, Ví dụ: một nhà đầu tư có tầm nhìn 20 năm có thể được\ncoi là có khả năng chịu rủi ro cao hơn, các yếu tố khác không đổi, so với một nhà đầu tư\nvới tầm nhìn 2 năm.\nQuản lý danh mục đầu tư: mô tả các mục tiêu rủi ro và lợi nhuận cũng như cách chúng có thể đạt được đã phát triển\ncho khách hàng","qhtml":null},{"n":52,"q":"An analyst gathers the following information:\nRisk-free rate 2%\nExpected return of the market portfolio 10%\nStandard deviation of the market portfolio 20%\nStandard deviation of the security 35%\nCorrelation between the security and the market 0.8\nAccording to the CAPM, the expected return of the security is closest to:","opts":["5.7%.","13.2%.","16.0%."],"ans":"B","expl":"A. Không chính xác vì beta bảo mật được tính toán sai do sự đảo ngược độ lệch chuẩn\ncủa chứng khoán và danh mục thị trường. Do đó, hệ số beta\nđược tính là 𝛽 = (0,8 x 20%)/35% = 0,457. Tiếp theo, bằng cách sử dụng phương trình CAPM, E(R) = R\ni f\n+𝛽[E(R ) - R], lợi nhuận kỳ vọng của chứng khoán được tính như E(R) = 2% + 0,457 x (10% -\nm f i\n2% ) = 5,66% ≈ 5,7%.\nB. Đúng vì lợi nhuận kỳ vọng của chứng khoán có thể được tính bằng phương trình CAPM\n: E(R) = R +𝛽[E(R ) - R]. Beta của chứng khoán có thể được tính bằng cách sử dụng\ni f m f\nphương trình 𝛽 = (P x 𝜎 )/ 𝜎 . Do đó, 𝛽 = (0,8 x 35%)/20% = 1,4. Beta là sản phẩm của mối tương quan giữa\ni,m 𝑖 𝑚\ncủa tài sản với thị trường với tỷ lệ độ lệch chuẩn của lợi nhuận (tức là tỷ lệ\ncủa độ lệch chuẩn của tài sản so với thị trường). Do đó, sử dụng phương trình CAPM\n: E(R) = 2% +1,4 x (10% - 2% ) = 13,2%.\nC. Không chính xác vì lãi suất phi rủi ro không được tính vào phí bảo hiểm rủi ro thị trường\n. Beta được tính như sau 𝛽 = (0,8 x 35%) / 20% = 1,4. Do đó, sử dụng phương trình CAPM\n: E(R) = 2% +1,4 x (10%) = 16,0%.\nQuản lý danh mục đầu tư: tính toán và diễn giải lợi nhuận kỳ vọng của một tài sản bằng cách sử dụng\nCAPM","qhtml":null},{"n":53,"q":"The correlation of returns between two securities with equal standard deviation of\nreturns is 0.75. If the covariance of returns is 5.5%², the standard deviation of returns for each\nsecurity is closest to:","opts":["2.7%.","3.7%.","7.3%."],"ans":"A","expl":"A. Đúng vì mối tương quan giữa lợi nhuận của hai chứng khoán là\n𝐶𝑜𝑣 5.5\n𝑖𝑗\n𝑟 = => 𝜎𝜎 = = 7.3\n𝑖𝑗 𝜎 𝜎 𝑖 𝑗 0,71\n𝑖 𝑗\n. Vì hai chứng khoán có rủi ro như nhau nên 𝜎 = 𝜎\n𝑖 𝑗\n𝜎 2 = 7,3 => 𝜎 = 2,7%\n𝑖 𝑖\nB. Không chính xác vì là tính toán sai và nhầm lẫn 𝜎 𝜎, như 2 x 𝜎 ,\n𝑖 𝑗 𝑖\n5.5\n𝜎 𝜎 = = 7.3\n𝑖 𝑗 0.71\n2 x 𝜎 = 7,3% ; 𝜎 = 3,67% ≈ 3,7%\n𝑖 𝑖\nC. Không chính xác vì đây là bước trung gian trong phép tính đúng;\n5,5\n𝜎 𝜎 = = 7,3%\n𝑖 𝑗 0,71\nQuản lý danh mục đầu tư: tính toán và giải thích giá trị trung bình, phương sai và hiệp phương sai (hoặc\ntương quan) của lợi nhuận tài sản dựa trên dữ liệu lịch sử","qhtml":null},{"n":54,"q":"An analyst gathers the following information about an asset and the market:\nRisk-free rate 1%\nMarket risk premium 5%\nAsset's expected return 5%\nBased on the CAPM, the asset's beta is closest to:","opts":["0.80.","1.00.","1.25."],"ans":"A","expl":"A. Đúng vì lợi nhuận kỳ vọng của một tài sản là E(R) = R +𝛽[E(R ) – R], trong đó R, R ,\ni f i m f f m\nvà R, lần lượt biểu thị lợi nhuận của tài sản, thị trường và tài sản phi rủi ro B, là\nbeta của tài sản và [E(R ) – R] là rủi ro thị trường premium.\nm f\nDo đó, 𝛽 = [E(𝑅 )-𝑅 ]/[E(𝑅 )-𝑅 ] = [5% - 1% ] / 5% = 4%/5% = 0,8.\n𝑖 𝑖 𝑓 𝑚 𝑓\nB. Không chính xác vì Không chính xác vì nó không trừ lãi suất phi rủi ro trong tử số và tính 𝛽 =\n𝑖\nE(𝑅 )/[E(𝑅 )-𝑅 ] = 5%/5% = 1,0. Đó cũng là câu trả lời nếu phần bù rủi ro thị trường bị nhầm lẫn\n𝑖 𝑚 𝑓\nvới lợi nhuận thị trường, do đó 𝛽 = [𝐸 > (𝑅 )−𝑅 ]/[phần bù rủi ro thị trường - 𝑅 = [5% - 1% ] /\n𝑖 𝑖 𝑓 𝑓\n[5% - 1% ] = 4%/4% = 1,0.\nC. Không chính xác vì Không chính xác vì nó là nghịch đảo của beta, 1/𝛽 = [E(𝑅 )-𝑅 ]/[E(𝑅 )-𝑅 ] = rủi ro thị trường\n𝑖> 𝑚 𝑓 𝑚 𝑓\npremium [𝐸(𝑅 )−𝑅 ]= 5% /[5%-1% ] = 5%/4% = 1,25. Đó cũng là câu trả lời nếu mắc phải hai sai lầm\n𝑖 𝑓\n: Lãi suất phi rủi ro không được trừ khỏi lợi nhuận kỳ vọng trong tử số\nvà phần bù rủi ro thị trường bị nhầm lẫn với lợi nhuận thị trường. Do đó, 𝛽 = 𝐸(𝑅 )/ [market\n𝑖 𝑖\nphần bù rủi ro - R = 5% / [5% -1% ] = 5%/4% = 1,25.\nQuản lý danh mục đầu tư: tính toán và diễn giải beta","qhtml":null},{"n":55,"q":"Long-term historical data on the risk-return trade-off of securities show that investors are\nmost likely","opts":["risk averse.","risk neutral.","risk seeking."],"ans":"A","expl":"A. Đúng vì biểu thức 'sự đánh đổi giữa rủi ro và lợi nhuận đề cập đến mối quan hệ tích cực\ngiữa rủi ro kỳ vọng và lợi nhuận. Nói cách khác, không thể đạt được lợi nhuận cao hơn để đạt được các thị trường hiệu quả trong\nvà trong thời gian dài nếu không chấp nhận rủi ro cao hơn. Lợi nhuận\ndự kiến ​​sẽ lớn hơn đối với những tài sản có rủi ro cao hơn. Trong thời gian dài, chúng tôi nhận thấy\nrằng rủi ro cao hơn sẽ mang lại lợi nhuận trung bình cao hơn. Vì vậy, thật hợp lý khi khẳng định rằng, trong thời gian dài\n, giá thị trường mang lại rủi ro cao hơn với lợi nhuận cao hơn, đây là đặc điểm\ncủa một nhà đầu tư không thích rủi ro.\nB. Không chính xác vì dữ liệu lịch sử dài hạn về chứng khoán cho thấy rằng các nhà đầu tư không thích rủi ro\n chứ không trung lập với rủi ro.\nC. Không chính xác vì dữ liệu lịch sử dài hạn về chứng khoán cho thấy rằng các nhà đầu tư\nkhông thích rủi ro chứ không tìm kiếm rủi ro.\nQuản lý danh mục đầu tư: mô tả đặc điểm của các loại tài sản chính mà các nhà đầu tư\nxem xét khi hình thành danh mục đầu tư","qhtml":null},{"n":56,"q":"Information regarding the permissible use of derivatives in a portfolio is most likely found\nin which of the following sections of an investment policy statement?","opts":["Procedures","Investment Guidelines","Statement of Duties and Responsibilities"],"ans":"B","expl":"A. Không chính xác vì phần Thủ tục trong Tuyên bố Chính sách Đầu tư (IPS)\ngiải thích các bước cần thực hiện để duy trì IPS hiện hành và các thủ tục cần tuân theo để ứng phó\nvới nhiều tình huống bất ngờ khác nhau. Thông tin liên quan đến việc được phép sử dụng các công cụ phái sinh được\nbao gồm trong Nguyên tắc đầu tư.\nB. Đúng vì phần Nguyên tắc đầu tư của Tuyên bố chính sách đầu tư\n(IPS) cung cấp thông tin về cách thực thi chính sách (ví dụ: về việc\nsử dụng đòn bẩy và công cụ phái sinh được phép) và về các loại tài sản cụ thể được loại trừ khỏi đầu tư, if\nany.\nC. Không chính xác vì phần Tuyên bố về Nhiệm vụ và Trách nhiệm của Tuyên bố Chính sách Đầu tư\n(IPS) nêu chi tiết các nhiệm vụ và trách nhiệm của khách hàng, người giám sát\ntài sản của khách hàng và người quản lý đầu tư. Thông tin liên quan đến việc sử dụng được phép\ncác công cụ phái sinh được bao gồm trong Nguyên tắc đầu tư.\nQuản lý danh mục đầu tư: mô tả các thành phần chính của IPS","qhtml":null},{"n":57,"q":"In the portfolio management process, the feedback step most likely involves:","opts":["rebalancing the portfolio.","deciding on an asset allocation.","understanding the client's constraints."],"ans":"A","expl":"A. Đúng vì bước phản hồi hỗ trợ người quản lý danh mục đầu tư cân bằng lại danh mục\ndo sự thay đổi, chẳng hạn như điều kiện thị trường hoặc hoàn cảnh của khách hàng\n.\nB. Không chính xác vì đây là một phần của bước thực hiện chứ không phải bước phản hồi. Bước thực hiện danh mục đầu tư\nbao gồm việc quyết định đầu tiên về phân bổ tài sản mục tiêu, xác định\ntrọng số của các loại tài sản sẽ được đưa vào danh mục đầu tư.\nC. Không chính xác vì đây là một phần của bước lập kế hoạch chứ không phải bước phản hồi. Bước đầu tiên [\nbước lập kế hoạch] trong quy trình đầu tư là tìm hiểu nhu cầu của khách hàng (mục tiêu và\nràng buộc) và phát triển tuyên bố chính sách đầu tư (IPS).\nQuản lý danh mục đầu tư: mô tả các bước trong quy trình Quản lý danh mục đầu tư:","qhtml":null},{"n":58,"q":"Which of the following investment principles best explains the use of strategic asset\nallocation in portfolio construction?","opts":["Returns on similar assets reflect exposures to certain sets of systematic factors.","Nonsystematic risk accounts for most of the change in portfolio value over the long term.","Deviating from policy exposures to systematic risk factors may add value to the portfolio."],"ans":"A","expl":"A. Đúng vì việc tập trung vào SAA [phân bổ tài sản chiến lược] là kết quả của một số\nnguyên tắc đầu tư quan trọng. Một nguyên tắc như vậy là lợi nhuận của các nhóm tài sản tương tự\n(ví dụ: các khoản nợ dài hạn) phản ánh một cách có thể dự đoán được mức độ rủi ro đối với một số nhóm\nyếu tố mang tính hệ thống (ví dụ: đối với các khoản nợ, những thay đổi bất ngờ về tỷ lệ lạm phát).\nB. Không chính xác vì việc tập trung vào SAA [phân bổ tài sản chiến lược] là kết quả của một số nguyên tắc đầu tư quan trọng. Một nguyên tắc là rủi ro hệ thống của danh mục đầu tư\nlà nguyên nhân gây ra phần lớn sự thay đổi về giá trị của danh mục đầu tư trong dài hạn.\nC. Không chính xác vì quyết định cố tình đi chệch khỏi mức độ rủi ro của chính sách đối với\ncác yếu tố rủi ro hệ thống (tức là trọng số chính sách của các loại tài sản) với mục đích tăng thêm giá trị\ndựa trên dự báo về lợi nhuận ngắn hạn của các loại tài sản đó được gọi là phân bổ tài sản chiến thuật\n. Đây không phải là một trong những nguyên tắc đầu tư mà việc phân bổ tài sản chiến lược dựa trên\n.\nQuản lý danh mục đầu tư: mô tả các nguyên tắc xây dựng danh mục đầu tư và vai trò của\nphân bổ tài sản liên quan đến IPS","qhtml":null},{"n":59,"q":"In the investment policy statement of a pension fund, a countrywide limit on the\nproportion of high-risk assets that can be held in long-term pension portfolios is most likely a:","opts":["liquidity constraint.","legal and regulatory constraint.","time horizon constraint."],"ans":"B","expl":"A. Không chính xác vì hạn chế trên toàn quốc đối với các quỹ hưu trí giới hạn tỷ lệ\ncủa tài sản có rủi ro cao trong danh mục đầu tư là hạn chế về quy định. Thực tế là hạn chế được\nđược xây dựng dưới dạng giới hạn đầu tư vào các tài sản có rủi ro cao không cho thấy đó là hạn chế về thanh khoản.\nRàng buộc về thanh khoản nêu rõ những yêu cầu có thể xảy ra là rút tiền từ danh mục\ndanh mục đầu tư.\nB. Đúng vì IPS phải nêu rõ mọi hạn chế pháp lý và quy định hạn chế\ncách đầu tư danh mục đầu tư. Ở một số quốc gia, các nhà đầu tư tổ chức như quỹ hưu trí\nphải chịu những hạn chế về thành phần danh mục đầu tư. Ví dụ: có thể\ncó giới hạn về tỷ lệ cổ phiếu hoặc tài sản rủi ro khác trong danh mục đầu tư hoặc về\ntỷ lệ danh mục đầu tư có thể được đầu tư ở nước ngoài.\nC. Không chính xác vì hạn chế trên toàn quốc đối với các quỹ hưu trí giới hạn tỷ lệ\ncủa tài sản có rủi ro cao trong danh mục đầu tư là hạn chế về quy định. Ràng buộc không thay đổi\nkhoảng thời gian đầu tư rộng rãi của quỹ hưu trí và do đó không phải là ràng buộc về khoảng thời gian\n. Các ràng buộc về thời gian cho biết khoảng thời gian mà nhà đầu tư\nđầu tư.\nQuản lý danh mục đầu tư: mô tả các hạn chế đầu tư về tính thanh khoản, khoảng thời gian, các mối lo ngại về thuế\n, các yếu tố pháp lý và quy định cũng như các trường hợp đặc biệt và ý nghĩa của chúng đối với\nviệc lựa chọn tài sản danh mục đầu tư","qhtml":null},{"n":60,"q":"The global minimum-variance portfolio is a portfolio that lies:","opts":["anywhere along the minimum-variance frontier.","at the left-most point of the minimum-variance frontier.","at the upper right-most point of the minimum-variance frontier."],"ans":"B","expl":"A. Không chính xác vì toàn bộ tập hợp các danh mục đầu tư có phương sai tối thiểu này được gọi\nlà biên giới phương sai tối thiểu. Phần này mô tả danh mục phương sai tối thiểu, nhưng\nkhông phải danh mục phương sai tối thiểu toàn cầu.\nB. Đúng vì điểm ngoài cùng bên trái trên biên giới phương sai tối thiểu là danh mục đầu tư\ncó phương sai tối thiểu trong số tất cả các danh mục đầu tư tài sản rủi ro và được gọi là\ndanh mục đầu tư có phương sai tối thiểu toàn cầu.\nC. Không chính xác vì điểm ngoài cùng bên phải phía trên của đường biên phương sai tối thiểu là\nvị trí đối diện của danh mục phương sai tối thiểu toàn cầu, nó thực sự là\nphương sai tối đa trên đường cong của các danh mục đầu tư rủi ro.\nQuản lý danh mục đầu tư: mô tả và giải thích các đường biên giới hiệu quả và phương sai tối thiểu\ncủa tài sản rủi ro và danh mục đầu tư phương sai tối thiểu toàn cầu","qhtml":null},{"n":61,"q":"Which of the following principles best explains the focus on a strategic asset allocation\nwhen constructing a client's IPS?","opts":["Adding assets with high correlation improves the risk-return trade-off.","Nonsystematic risk accounts for most of a portfolio's change in value over the long term.","The returns to groups of similar assets predictably reflect exposures to certain systematic factors."],"ans":"C","expl":"A. Không chính xác vì đây không phải là một trong hai nguyên tắc dẫn đến việc tập trung vào\nphân bổ tài sản chiến lược trong xây dựng danh mục đầu tư. Hơn nữa, nói chung, việc thêm các loại tài sản\ncó mối tương quan thấp (không cao) sẽ cải thiện sự đánh đổi giữa rủi ro và lợi nhuận (nhiều lợi nhuận hơn cho\nrủi ro tương tự).\nB. Không chính xác vì rủi ro hệ thống (không phải phi hệ thống) của danh mục đầu tư chiếm phần lớn\nsự thay đổi giá trị của nó trong dài hạn.\nC. Đúng vì việc tập trung vào SAA (phân bổ tài sản chiến lược) là kết quả của một số nguyên tắc đầu tư quan trọng\n. Nguyên tắc thứ hai là lợi nhuận của các nhóm tài sản tương tự\n(ví dụ: các khoản nợ dài hạn) phản ánh một cách có thể dự đoán được mức độ rủi ro đối với một số nhóm\nyếu tố hệ thống nhất định (ví dụ: đối với các khoản nợ, những thay đổi bất ngờ về lãi suất).\nQuản lý danh mục đầu tư: mô tả các nguyên tắc xây dựng danh mục đầu tư và vai trò của\nphân bổ tài sản liên quan đến IPS","qhtml":null},{"n":62,"q":"Which of the following sections of an investment policy statement (IPS) most likely\nexplains how and when the IPS should be reviewed?","opts":["Procedures","Investment Guidelines","Statement of Duties and Responsibilities"],"ans":"A","expl":"A. Đúng vì IPS cần được xem xét thường xuyên để đảm bảo rằng nó vẫn được duy trì\nphù hợp với hoàn cảnh và yêu cầu của khách hàng. IPS cũng nên được\nđược xem xét lại nếu người quản lý nhận thấy có sự thay đổi quan trọng trong hoàn cảnh của khách hàng,\nhoặc theo sáng kiến của khách hàng khi mục tiêu, thời gian hoặc nhu cầu thanh khoản của họ\nthay đổi. Các thành phần chính của IPS bao gồm các phần sau: Thủ tục.\nphần này giải thích các bước cần thực hiện để duy trì IPS hiện hành và các bước cần tuân theo để\nứng phó với tình huống tĩnh mạch\nB. Không chính xác vì phần Hướng dẫn đầu tư trong tuyên bố chính sách đầu tư\n(IPS) cung cấp Thông tin về cách thực hiện chính sách (ví dụ: trên phạm vi cho phép\nsử dụng đòn bẩy và các công cụ phái sinh) và đối với các loại tài sản cụ thể bị loại khỏi đầu tư nếu\nbất kỳ thông tin nào về cách thức và thời điểm đánh giá bài viết IPS có thể được tìm thấy trong\nPhần thủ tục.\nC. Không chính xác vì phần Tuyên bố về Trách nhiệm và Trách nhiệm của khoản đầu tư\ntuyên bố chính sách (IPS) nêu chi tiết các nhiệm vụ và trách nhiệm của khách hàng, người giám hộ\ntài sản của khách hàng và người quản lý đầu tư. Mặc dù phần này có thể phác thảo ai là\nchịu trách nhiệm xem xét IPS, thông tin về cách thức và thời điểm IPS nên được thực hiện\nđược xem xét có nhiều khả năng được tìm thấy trong phần Thủ tục hơn.\nQuản lý danh mục đầu tư: mô tả các thành phần chính của IPS","qhtml":null},{"n":63,"q":"Which of the following best describes a characteristic of defined contribution pension\nplans?","opts":["The employee accepts the investment and inflation risk.","The employer is responsible for adequately funding the plan.","Defined contribution plans typically have a higher cost to the company than defined benefit plans."],"ans":"A","expl":"A. Đúng vì mấu chốt của kế hoạch (đóng góp do DC xác định) là nhân viên chấp nhận\nrủi ro đầu tư và lạm phát, đồng thời chịu trách nhiệm đảm bảo rằng có đủ tài sản\ntrong kế hoạch để đáp ứng nhu cầu của họ khi nghỉ hưu.\nB. Không chính xác vì điều này áp dụng cho các kế hoạch phúc lợi xác định (DB), vì nhìn chung, người sử dụng lao động\nchịu trách nhiệm về những đóng góp cho kế hoạch DB và chịu rủi ro liên quan đến\ntài trợ đầy đủ cho các phúc lợi được cung cấp cho nhân viên.\nC. Không chính xác vì các kế hoạch DC (đóng góp xác định) thường có chi phí/rủi ro thấp hơn đối với\ncông ty.\nQuản lý danh mục đầu tư: mô tả các kế hoạch lương hưu đóng góp xác định và phúc lợi xác định","qhtml":null},{"n":64,"q":"The market model is most likely used to predict:","opts":["market returns in a future period.","economic growth in a future period.","company-specific returns in a future period."],"ans":"C","expl":"A. Không chính xác vì hệ số chặn, 𝛼 và hệ số độ dốc, 𝛽 của mô hình thị trường có thể\n𝑗 𝑗\nđược ước tính bằng cách sử dụng chứng khoán lịch sử và lợi nhuận thị trường. Các ước tính tham số này\nsau đó được sử dụng để dự đoán lợi nhuận cụ thể của công ty mà chứng khoán có thể kiếm được trong một khoảng thời gian trong tương lai.\nB. Không chính xác vì mô hình thị trường là mô hình tạo ra lợi nhuận có thể được sử dụng để\ndự đoán lợi nhuận cụ thể của công ty dựa trên lợi nhuận của thị trường. Các mô hình yếu tố kinh tế vĩ mô\n(không phải mô hình thị trường) sử dụng các yếu tố kinh tế có tương quan với lợi nhuận chứng khoán.\nNhững yếu tố này có thể bao gồm tăng trưởng kinh tế.\nC. Đúng vì hệ số chặn, 𝛼 , và hệ số độ dốc, 𝛽 , của mô hình thị trường có thể\n𝑗 𝑗\nđược ước tính bằng cách sử dụng chứng khoán lịch sử và lợi nhuận thị trường. Các tham số ước tính này\nsau đó được dùng để dự đoán lợi nhuận cụ thể của công ty mà chứng khoán có thể kiếm được trong tương lai.\nQuản lý danh mục đầu tư: giải thích các mô hình tạo ra lợi nhuận (bao gồm cả mô hình thị trường) và\ncách sử dụng chúng","qhtml":null},{"n":65,"q":"Open-end mutual funds typically:","opts":["are priced intraday.","have a fixed number of shares outstanding.","have a larger required minimum investment than ETFs."],"ans":"C","expl":"A. Không chính xác vì đây là quỹ ETF được định giá trong ngày chứ không phải quỹ tương hỗ. Giá trị của một\nquỹ tương hỗ được gọi là 'giá trị tài sản ròng'. Nó được tính hàng ngày dựa trên giá đóng cửa\ncủa chứng khoán trong danh mục đầu tư. Bởi vì chúng được giao dịch trên các sàn giao dịch. ETF có thể được\ngiao dịch (và được định giá) trong ngày. Ngược lại, các quỹ tương hỗ thường có thể được mua hoặc\nchỉ được bán một lần một ngày.\nB. Không chính xác vì quỹ tương hỗ đóng, không phải quỹ mở, có số lượng cổ phiếu cố định\nđang lưu hành. Một giải pháp thay thế cho việc thành lập quỹ dưới dạng quỹ mở là tạo một\nquỹ đóng trong đó không có khoản tiền đầu tư mới nào được chấp nhận vào quỹ. Các nhà đầu tư\nmới đầu tư bằng cách mua cổ phiếu hiện có và các nhà đầu tư trong quỹ thanh lý bằng cách bán\ncổ phiếu của họ cho các nhà đầu tư khác. Do đó, số lượng cổ phiếu đang lưu hành không thay đổi. Một\nhậu quả của cơ sở cổ phiếu cố định này là, không giống như các quỹ mở trong đó cổ phiếu mới được tạo ra và bán với giá trị tài sản ròng hiện tại trên mỗi cổ phiếu, các quỹ đóng có thể bán với giá\ncao hơn hoặc chiết khấu so với giá trị tài sản ròng tùy thuộc vào nhu cầu về cổ phiếu.\nC. Đúng vì khoản đầu tư bắt buộc tối thiểu vào ETFS thường nhỏ hơn khoản đầu tư của\nquỹ tương hỗ.\nQuản lý danh mục đầu tư: mô tả các quỹ tương hỗ và so sánh chúng với\nsản phẩm đầu tư gộp khác","qhtml":null},{"n":66,"q":"A portfolio consists of two securities with the following characteristics:\nExpected Return Standard Deviation of Returns\nSecurity 1 17% 24%\nSecurity 2 6% 12%\nIf the portfolio has an expected return of 12.6% and the returns of the two securities are\nuncorrelated, the portfolio's standard deviation is closest to:","opts":["13.4%.","15.2%.","19.2%."],"ans":"B","expl":"A. Không chính xác vì nó sử dụng danh mục chứng khoán có trọng số ngang nhau thay vì lấy\ntrọng số của chứng khoán từ lợi nhuận kỳ vọng của danh mục đầu tư. Do lợi nhuận của hai chứng khoán\nkhông tương quan với nhau, nên mối tương quan giữa lợi nhuận của hai chứng khoán\nlà 0. Do đó, độ lệch chuẩn của danh mục đầu tư được tính như sau:\n𝜎 2 = 0,52 ∗0,242 +0,52 ∗0,122 <=> 𝜎 2 = 0,0144+0,0036 = 0,018\n𝜌 𝜌\n=> 𝜎 = √0,018 = 0,1342 ≈ 13,4%\n𝜌\nB. Đúng vì trọng số của danh mục đầu tư được tính bằng cách đặt lợi nhuận danh mục đầu tư\nbằng 12,6%. Kết quả trả về portrolio của một cổng hai bảo mật là:\n𝑅 = 𝑤 𝑅 +𝑤 𝑅\n𝜌 1 1 2 2\n𝑅 = 𝑤 𝑅 +(1−𝑤 )𝑅\n𝜌 1 1 1 2\n12,6% = 𝑤 ∗17%+(1−𝑤 )∗6%\n1 1\n𝑤 = 0,6 và 𝑤 = 1−0,6 = 0,4\n1 2\nVì lợi nhuận của hai chứng khoán không tương quan với nhau nên CovR,, R) = 0, sao cho:\n𝜎 2 = (0,62 ∗0,242 +0,42 ∗0,122)\n𝜌\n𝜎 2 = (0,0207+0,0023)\n𝜌\n=> 𝜎 = √0,023 = 0,1518 ≈ 15,2%\n𝜌\nC. Không chính xác vì nó giả định rằng, vì lợi nhuận của chứng khoán không tương quan nên\nđộ lệch chuẩn danh mục đầu tư là giá trị trung bình có trọng số của độ lệch chuẩn\ncủa từng chứng khoán.\nTrọng số của danh mục đầu tư được tính bằng cách đặt lợi nhuận danh mục đầu tư bằng 12,6%. Lợi nhuận\ndanh mục đầu tư của danh mục đầu tư hai chứng khoán là:\n𝑅 = 𝑤 𝑅 +(1−𝑤 )𝑅\n𝜌 1 1 1 2\n12,6% = 𝑤 x 17% + (1 - W₁) x 6%\n𝑤 = 0,6 và 𝑤 = 1−0,6 = 0,4\n1 2\nKhi đó, 𝜎 , được tính sai là:\n𝜌\n𝜎 =0,6 * 24 + 0,4 × 0,12\n𝜌\n𝜎 = 0,192=19,2%. Đây sẽ là độ lệch chuẩn danh mục đầu tư chính xác nếu mối tương quan\n𝜌\nbằng 1.\nQuản lý danh mục đầu tư: tính toán và giải thích độ lệch chuẩn danh mục đầu tư","qhtml":"<p>A portfolio consists of two securities with the following characteristics:</p><table class=\"qtable\"><thead><tr><th></th><th>Expected Return</th><th>Standard Deviation of Returns</th></tr></thead><tbody><tr><td>Security 1</td><td>17%</td><td>24%</td></tr><tr><td>Security 2</td><td>6%</td><td>12%</td></tr></tbody></table><p>If the portfolio has an expected return of 12.6% and the returns of the two securities are uncorrelated, the portfolio's standard deviation is closest to:</p>"},{"n":67,"q":"An equally weighted portfolio is composed of two risky assets. If the correlation of asset\nreturns is equal to zero, the portfolio standard deviation is:","opts":["equal to zero,","equal to the weighted average of the assets' standard deviations.","less than the weighted average of the assets' standard deviations."],"ans":"C","expl":"A. Không chính xác vì rủi ro danh mục đầu tư nhỏ hơn mức trung bình có trọng số của rủi ro khi mối tương quan\ncủa lợi nhuận tài sản nhỏ hơn một. Đối với một danh mục đầu tư có trọng số bằng nhau, độ lệch chuẩn\nchỉ có thể bằng 0 khi hai tài sản có mối tương quan nghịch hoàn toàn\n(p = -1) và hai tài sản có cùng độ lệch chuẩn. Đối với một trường hợp cực đoan trong đó\nP₁₂ =-1 (nghĩa là lợi nhuận của hai tài sản di chuyển theo hướng ngược nhau), danh mục đầu tư có thể\nkhông có rủi ro.\nB. Không chính xác vì độ lệch chuẩn của danh mục đầu tư chỉ đơn giản là mức trung bình có trọng số của\nđộ lệch chuẩn của hai tài sản khi mối tương quan giữa lợi nhuận tài sản bằng 1.\nC. Đúng vì rủi ro danh mục đầu tư nhỏ hơn mức rủi ro trung bình có trọng số khi\nmối tương quan giữa lợi nhuận tài sản nhỏ hơn một.\nQuản lý danh mục đầu tư: mô tả tác động lên rủi ro của danh mục đầu tư vào những tài sản\nít tương quan hoàn hảo","qhtml":null},{"n":68,"q":"If all investors have homogeneous expectations, the total risk and expected return of\nportfolios consisting of the risk-free asset and the optimal risky portfolio are plotted on the:","opts":["capital market line.","security market line.","security characteristic line."],"ans":"A","expl":"A. Đúng vì tài sản không có rủi ro có thể được kết hợp với danh mục đầu tư rủi ro để tạo ra\nđường phân bổ vốn [CAL] Một CAL cụ thể sử dụng danh mục đầu tư thị trường làm danh mục đầu tư\nrủi ro tối ưu được gọi là đường thị trường vốn. Khi giả định các kỳ vọng đồng nhất,\nchỉ tồn tại một danh mục đầu tư tối ưu. Đường thị trường vốn được hiển thị trong Hình 3, trong đó\nđộ lệch chuẩn (𝜎 ), hay tổng rủi ro nằm trên trục x và lợi nhuận kỳ vọng của danh mục đầu tư. E(R ), là\n𝑝 p\ntrên trục y.\nB. Không chính xác vì đường thị trường chứng khoán (SML) là biểu diễn đồ họa của\nmô hình định giá tài sản vốn với phiên bản beta, phản ánh rủi ro hệ thống, trên trục x và lợi nhuận\nkỳ vọng trên trục y. Sử dụng khái niệm tương tự như đường thị trường vốn, SML cắt\ntrục y ở tỷ suất lợi nhuận phi rủi ro và độ dốc của đường này là rủi ro thị trường\npremium, R -R\nm f\nC. Không chính xác vì đường đặc tính chứng khoán (SCL) cho một chứng khoán là biểu đồ của\nlợi nhuận vượt mức của chứng khoán trên lợi nhuận vượt quá của thị trường.\nQuản lý danh mục đầu tư: giải thích đường phân bổ vốn (CAL) và đường thị trường vốn\n(CML)","qhtml":null},{"n":69,"q":"The risk-return profile of a portfolio's strategic asset allocation is most likely determined\nby the expected returns and risks of the individual asset classes and the:","opts":["correlations between those asset classes.","use of security selection for each of those asset classes.","allowable deviation of portfolio weights from policy weights for those asset classes."],"ans":"A","expl":"A. Đúng vì hồ sơ rủi ro-lợi nhuận của việc phân bổ tài sản chiến lược phụ thuộc vào\nlợi nhuận và rủi ro dự kiến ​​của các loại tài sản riêng lẻ, cũng như mối tương quan giữa\ncác loại tài sản đó\nB. Không chính xác vì hồ sơ rủi ro-lợi nhuận của việc phân bổ tài sản chiến lược phụ thuộc vào\nlợi nhuận và rủi ro dự kiến ​​của các loại tài sản riêng lẻ, cũng như mối tương quan giữa\ncác loại tài sản đó. Quyết định đi chệch khỏi trọng số chính sách hoặc chọn chứng khoán nhằm mục đích\nđánh bại tiêu chuẩn sẽ tạo thêm sự không chắc chắn về lợi nhuận. Rủi ro này cao hơn\nrủi ro vốn có trong danh mục chính sách. Do đó, chính sách đầu tư phải đưa ra các giới hạn rủi ro\nvà kết quả mong muốn cho mỗi hoạt động này Việc lập ngân sách rủi ro ngụ ý rằng người quản lý danh mục đầu tư\nphải lựa chọn. đối với mọi loại nội dung, có triển khai lựa chọn bảo mật dưới dạng trình tạo lợi nhuận\n hay không. Mặc dù lựa chọn chứng khoán có thể ảnh hưởng đến lợi nhuận của danh mục đầu tư,\nhồ sơ rủi ro-lợi nhuận của việc phân bổ tài sản chiến lược của danh mục đầu tư dựa trên lợi nhuận kỳ vọng cho\ncác loại tài sản và mối tương quan giữa các loại tài sản đó thay vì rủi ro\nbổ sung liên quan đến việc sử dụng lựa chọn chứng khoán.\nC. Không chính xác vì hồ sơ rủi ro-lợi nhuận của việc phân bổ tài sản chiến lược phụ thuộc vào\nlợi nhuận và rủi ro dự kiến ​​của các loại tài sản riêng lẻ, cũng như mối tương quan giữa\ncác loại tài sản đó. Khi danh mục đầu tư được xây dựng và giá trị của nó thay đổi theo lợi nhuận của\ncác loại tài sản và chứng khoán mà nó được đầu tư, trọng số của các loại tài sản sẽ\ndần dần lệch khỏi trọng số chính sách trong phân bổ tài sản chiến lược. Quá trình này\nđược gọi là trôi dạt. Định kỳ hoặc khi một độ lệch ngưỡng nhất định so với trọng số chính sách\n(băng thông) bị vi phạm, danh mục đầu tư sẽ được cân bằng lại về trọng số chính sách\n. Bộ quy tắc hướng dẫn quá trình khôi phục nguy cơ\nban đầu của danh mục đầu tư trước các yếu tố rủi ro hệ thống được gọi là chính sách tái cân bằng. Quyết định đi chệch\nso với trọng số chính sách hoặc chọn chứng khoán nhằm mục đích vượt qua mức chuẩn sẽ tạo thêm\nsự không chắc chắn về lợi nhuận. Rủi ro này vượt quá rủi ro vốn có trong danh mục chính sách\n. Mặc dù trọng số của các loại tài sản sẽ thay đổi theo thời gian, nhưng hồ sơ lợi nhuận-rủi ro\ncủa việc phân bổ tài sản chiến lược của danh mục đầu tư không được xác định bởi chính sách tái cân bằng.\nQuản lý danh mục đầu tư: giải thích đặc điểm kỹ thuật của các loại tài sản liên quan đến tài sản\nphân bổ","qhtml":null},{"n":70,"q":"A portfolio has an annual return of 15.2% and a standard deviation of returns of 11.7%. If\nthe risk-free rate is 3.1%, the portfolio's Sharpe ratio is closest to:","opts":["1.03.","1.30.","1.56."],"ans":"A","expl":"A. Đúng vì tỷ lệ Sharpe được xác định bằng phần bù rủi ro của danh mục đầu tư chia cho rủi ro\ncủa nó. Do đó, tỷ lệ Sharpe= (R -R)/ 𝜎 = (15,2% - 3,1%) / 11,7% = 12,1% / 11,7% = 1,0342\np f 𝑝\n≈ 1,03.\nB. Không chính xác vì nó bỏ qua lãi suất phi rủi ro khi xác định phần bù rủi ro\ncủa danh mục đầu tư. Do đó, tỷ lệ Sharpe= Lợi nhuận trung bình hàng năm/Độ lệch chuẩn của lợi nhuận =\n15,2% / 11,7% = 1,2991 ≈ 1,30.\nC. Không chính xác vì lãi suất phi rủi ro được thêm vào (không bị trừ khỏi) lợi nhuận\ncủa danh mục đầu tư để xác định phần bù rủi ro. Do đó, tỷ lệ Sharpe = (R -R)/ 𝜎 = (15,2% +3,1%)\np f 𝑝\n/ 11,7% = 18,3% / 11,7% = 1,5641 ≈ 1,56.\nQuản lý danh mục đầu tư: tính toán và diễn giải tỷ lệ Sharpe, Tỷ lệ Treynor, M 2 và\nalpha của Jensen","qhtml":null},{"n":71,"q":"Which of the following is best classified as a financial risk?","opts":["Tax risk","Credit risk","Accounting risk"],"ans":"B","expl":"A. Không chính xác vì rủi ro thuế là rủi ro phi tài chính vì ba rủi ro phi tài chính sau\ncó liên quan với nhau: rủi ro pháp lý, rủi ro kế toán và rủi ro thuế.\nB. Đúng vì ngành quản lý rủi ro đã phân loại ba loại rủi ro là\nvề bản chất chủ yếu là tài chính và rủi ro tài chính cơ bản thứ hai là rủi ro tín dụng.\nC. Không chính xác vì rủi ro kế toán là rủi ro phi tài chính vì ba rủi ro phi tài chính sau đây có liên quan với nhau: rủi ro pháp lý, rủi ro kế toán và rủi ro thuế.\nQuản lý danh mục đầu tư: xác định các nguồn rủi ro tài chính và phi tài chính và mô tả cách\nchúng có thể tương tác","qhtml":null},{"n":72,"q":"The risk management measure that captures the sensitivity of a derivative's delta to a\nchange in the value of the underlying best describes:","opts":["rho.","vega.","gamma."],"ans":"C","expl":"A. Không chính xác vì các công cụ phái sinh cũng nhạy cảm với những thay đổi về lãi suất, được\nphản ánh trong thước đo gọi là rho\nB. Không chính xác vì vega là thước đo bậc nhất về sự thay đổi trong giá phái sinh đối với một\nsự thay đổi về độ biến động của tài sản cơ sở.\nC. Đúng vì độ nhạy của giá phái sinh đối với một thay đổi nhỏ trong giá trị của tài sản cơ bản\nđược gọi là delta. Những thay đổi lớn được nắm bắt bởi khái niệm gamma.\nTrong khi delta là rủi ro cấp một thì gamma được coi là rủi ro cấp hai vì nó\nphản ánh rủi ro thay đổi ở delta. Gamma là thước đo bằng số về mức độ nhạy cảm của\nquyền chọn delta đối với sự thay đổi giá trị của tài sản cơ sở.\nQuản lý danh mục đầu tư: mô tả các phương pháp đo lường và sửa đổi mức độ rủi ro và\ncác yếu tố cần cân nhắc khi lựa chọn trong số các phương pháp","qhtml":null},{"n":73,"q":"The intercept on the y-axis of the security characteristic line is:","opts":["beta.","Jensen's alpha.","the risk-free rate of return."],"ans":"B","expl":"A. Không chính xác vì beta là độ dốc của đường đặc tính bảo mật (SCL), không phải là đường chặn\n.\nB. Đúng vì SCL là biểu đồ về lợi nhuận vượt mức của chứng khoán trên lợi nhuận vượt quá\ncủa thị trường. Alpha của Jensen là phần đánh chặn và beta là độ dốc\nC. Không chính xác vì tỷ suất lợi nhuận phi rủi ro là điểm chặn trên trục y của đường thị trường chứng khoán\n, trong khi alpha của Jensen là điểm chặn trên trục y của đường đặc tính chứng khoán\n.\nQuản lý danh mục đầu tư: mô tả và chứng minh các ứng dụng của CAPM và SML","qhtml":null},{"n":74,"q":"With respect to an investment policy statement, which of the following is most closely\nlinked to the client's distinctive needs?","opts":["The evaluation and review section","The objectives and constraints sections","The statement of duties and responsibilities"],"ans":"B","expl":"A. Không chính xác vì phần Đánh giá và Đánh giá cung cấp hướng dẫn về cách thu thập\nphản hồi về kết quả đầu tư.\nB. Đúng vì các phần được liên kết chặt chẽ nhất với nhu cầu đặc biệt của khách hàng,\nvà có lẽ là quan trọng nhất từ ​​góc độ lập kế hoạch, là những phần liên quan đến\nmục tiêu và hạn chế đầu tư. IPS [tuyên bố chính sách đầu tư] tập trung vào\nhai yếu tố này đã được gọi là IPS theo định dạng 'mục tiêu và ràng buộc'.\nC. Không chính xác vì Tuyên bố về Nhiệm vụ và Trách nhiệm nêu chi tiết các nhiệm vụ và\ncủa khách hàng, người giám sát tài sản của khách hàng và người quản lý\nđầu tư.\nQuản lý danh mục đầu tư: mô tả các thành phần chính của IPS","qhtml":null},{"n":75,"q":"The slope of the security market line is most likely the:","opts":["security's beta.","market risk premium.","market risk premium divided by the market standard deviation."],"ans":"B","expl":"A. Không chính xác vì hệ số beta của chứng khoán là độ dốc của đường đặc tính chứng khoán (SCL),\nkhông phải đường thị trường chứng khoán. SCL là biểu đồ về lợi nhuận vượt mức của chứng khoán trên lợi nhuận vượt quá\ncủa thị trường. Beta là độ dốc.\nB. Đúng vì đường thị trường chứng khoán (SML) là biểu diễn đồ họa của mô hình định giá tài sản vốn\nvới phiên bản beta, phản ánh rủi ro hệ thống, trên trục x và lợi nhuận kỳ vọng\ntrên trục y. Độ dốc của đường này là phần bù rủi ro thị trường, R -R.\nm f\nC. Không chính xác vì đó là độ dốc của đường thị trường vốn (CML). E(R )- R/𝜎 không phải\nm f 𝑚\ndòng thị trường bảo mật. Vì độ lệch chuẩn của thị trường khó có thể bằng 1 nên độ dốc của\nCML rất có thể không phải là độ dốc của Quản lý danh mục đầu tư SML\n: giải thích mô hình định giá tài sản vốn (CAPM), bao gồm\ngiả định và đường thị trường chứng khoán (SML)","qhtml":null},{"n":76,"q":"Which of the following performance measures is equal to the slope of the capital\nallocation line?","opts":["M²","Sharpe ratio","Treynor ratio"],"ans":"B","expl":"A. Không chính xác vì M² cung cấp thước đo lợi nhuận của danh mục đầu tư được điều chỉnh theo tổng rủi ro\ncủa danh mục đầu tư so với rủi ro của một số điểm chuẩn. Mặc dù M² có liên quan đến tỷ lệ Sharpe\nnhưng nó được tính theo một cách khác và được đo bằng các đơn vị khác nhau, do đó, nó\nkhông thể hiện độ dốc của đường phân bổ vốn.\nB. Đúng vì tỷ lệ Sharpe, còn được gọi là tỷ lệ phần thưởng trên biến đổi, chỉ đơn giản là độ dốc\ncủa đường phân bổ vốn.\nC. Không chính xác vì tỷ lệ Treynor tương ứng với độ dốc của đường thị trường chứng khoán,\nkhông phải đường phân bổ vốn. Tỷ lệ Treynor là phần mở rộng đơn giản của tỷ lệ Sharpe và\ngiải quyết hạn chế đầu tiên của tỷ lệ Sharpe bằng cách thay thế beta (rủi ro hệ thống) cho tổng rủi ro.\nQuản lý danh mục đầu tư: tính toán và giải thích tỷ lệ Sharpe, tỷ lệ Treynor, M 2 và\nJensen's alpha","qhtml":null},{"n":77,"q":"Which of the following sections of an investment policy statement for a pension plan\nmost likely specifies the discretion that portfolio managers have with respect to executing the\ninvestment strategy?","opts":["Procedures","Investment Constraints","Statement of Duties and Responsibilities"],"ans":"C","expl":"A. Không chính xác vì phần Quy trình giải thích các bước cần thực hiện để cập nhật IPS\n và các quy trình cần tuân theo để ứng phó với các tình huống bất ngờ khác nhau.\nB. Không chính xác vì phần Ràng buộc đầu tư trình bày các yếu tố hạn chế\nkhách hàng trong việc tìm cách đạt được mục tiêu đầu tư. Phần ràng buộc bao gồm\ncác yếu tố cần được tính đến khi xây dựng danh mục đầu tư cho khách hàng\nđáp ứng các mục tiêu. Các danh mục điển hình là yêu cầu về tính thanh khoản, khoảng thời gian,\nyêu cầu pháp lý, tình trạng thuế và các nhu cầu riêng. Các ràng buộc có thể là nội bộ (l.e.\ndo khách hàng đặt) hoặc bên ngoài (tức là do luật pháp hoặc quy định đặt ra).\nC. Đúng vì phần Tuyên bố về Nhiệm vụ và Trách nhiệm nêu chi tiết các nghĩa vụ\nvà trách nhiệm của khách hàng, người giám sát tài sản của khách hàng và người quản lý đầu tư\n. Trong trường hợp là một tổ chức, chẳng hạn như kế hoạch lương hưu hoặc tài trợ của trường đại học,\nIPS có thể đưa ra các thỏa thuận quản trị áp dụng cho các quỹ đầu tư. Ví dụ\n, thông tin này có thể bao gồm cách tiếp cận của ủy ban đầu tư trong việc bổ nhiệm\nvà xem xét các nhà quản lý đầu tư cho danh mục đầu tư cũng như quyền quyết định của những người quản lý\n đó.\nQuản lý danh mục đầu tư: mô tả các thành phần chính của IPS","qhtml":null},{"n":78,"q":"Which of the following measures is most appropriate to evaluate the performance of a\nportfolio that is not fully diversified?","opts":["Sharpe ratio","Treynor ratio","Jensen's alpha"],"ans":"A","expl":"A. Đúng vì tổng rủi ro có liên quan đến nhà đầu tư khi họ nắm giữ một danh mục đầu tư\nkhông được đa dạng hóa hoàn toàn, đây không phải là một danh mục đầu tư mong muốn. Trong những trường hợp như vậy, tỷ lệ Sharpe và\nM² là thước đo hiệu suất thích hợp. Tỷ lệ Sharpe sử dụng tổng rủi ro làm thước đo\nrủi ro.\nB. Không chính xác vì các thước đo hiệu suất liên quan đến tỷ lệ rủi ro beta-Treynor và\nalpha-alpha-của Jensen có liên quan khi nhà đầu tư nắm giữ một danh mục đầu tư được đa dạng hóa tốt với\nrủi ro có thể đa dạng hóa không đáng kể.\nC. Không chính xác vì các thước đo hiệu suất liên quan đến tỷ lệ rủi ro beta-Treynor và\nalpha-alpha-của Jensen có liên quan khi nhà đầu tư nắm giữ một danh mục đầu tư được đa dạng hóa tốt với\nrủi ro có thể đa dạng hóa không đáng kể.\nQuản lý danh mục đầu tư: tính toán và giải thích tỷ lệ Sharpe, tỷ lệ Treynor, M 2 và\nJensen's alpha","qhtml":null},{"n":79,"q":"An analyst gathers the following information about three stocks:\nBeta Standard Deviation of Returns\nStock 1 0.9 17%\nStock 2 1.1 18%\nStock 3 1.2 16%\nIf the standard deviation of market returns is equal to 10%, the stock with the highest\nnonsystematic risk is:","opts":["Stock 1.","Stock 2.","Stock 3."],"ans":"A","expl":"A. Đúng vì Phương sai tổng = Phương sai hệ thống + Phương sai phi hệ thống,\ncó thể được viết là 𝜎 ² = 𝛽 ² 𝜎 ² + 𝜎 ² . Do đó, 𝜎 2 = 𝜎 2 -𝛽 2 𝜎 2 . Do đó, phương sai phi hệ thống\n𝑖 𝑖 𝑚 𝑒 𝑒 𝑖 𝑖 𝑚\nđối với Cổ phiếu 1 bằng (0,17)2 - (0,9)2(0,1)² = 0,0208. Đối với Cổ phiếu 2, giá trị này bằng (0,18)2-\n(1.1)2(0,1)² = 0,0203. Đối với Cổ phiếu 3, giá trị này bằng (0,16)² - (1,2)2(0,1)²= 0,0112. Do đó,\nCổ phiếu 1 có phương sai phi hệ thống cao nhất và rủi ro đặc ứng cao nhất.\nRủi ro phi hệ thống là rủi ro liên quan đến một công ty hoặc ngành duy nhất và còn được gọi là\nlà rủi ro dành riêng cho công ty, dành riêng cho ngành, có thể đa dạng hóa hoặc đặc thù.\nB. Không chính xác vì Cổ phiếu 2 có tổng rủi ro cao nhất chứ không phải rủi ro phi hệ thống cao nhất.\nTổng rủi ro được tính bằng căn bậc hai của tổng phương sai.\nC. Không chính xác vì Cổ phiếu 3 có hệ số beta cao nhất và do đó rủi ro hệ thống cao nhất, chứ không phải\nrủi ro phi hệ thống cao nhất. Rủi ro hệ thống được tính bằng 𝛽 𝜎\n𝑖 𝑚\nQuản lý danh mục đầu tư: giải thích rủi ro hệ thống và phi hệ thống, bao gồm lý do tại sao\nnhà đầu tư không nên kỳ vọng nhận được lợi nhuận bổ sung khi chịu rủi ro phi hệ thống","qhtml":null},{"n":80,"q":"Which of the following metrics is most appropriate to estimate a bond's average extreme\nloss?","opts":["VaR of loss","Standard deviation of loss","Expected loss given default"],"ans":"C","expl":"A. Không chính xác vì trong thước đo VaR, không có mức tối đa cuối cùng mà người ta có thể nêu.\nVaR do đó là thước đo tổn thất cực trị tối thiểu. Do đó, tổn thất trung bình không thể được cung cấp bởi\nVAR.\nB. Không chính xác vì độ lệch chuẩn có thể không tồn tại đối với phân phối lợi nhuận có đuôi béo.\nDo đó, việc sử dụng không phù hợp khi ước tính tổn thất cực lớn.\nC. Đúng vì số liệu thống kê được sử dụng để ước tính VaR có thể được sử dụng để đánh giá những tổn thất cực đại\ntrung bình. Độ lệch chuẩn có điều kiện VaR hoặc CVaR là thước đo tổn thất đuôi phổ biến,\nđược định nghĩa là trung bình có trọng số của tất cả các kết quả tổn thất trong phân phối thống kê\nvượt quá tổn thất VaR. Một thước đo rủi ro đuôi khác trong không gian rủi ro tín dụng tương tự như\nCVAR là tổn thất dự kiến ​​khi vỡ nợ, trả lời câu hỏi về chứng khoán nợ. Nếu\ncông ty hoặc tài sản cơ bản vỡ nợ, chúng ta sẽ mất trung bình bao nhiêu?\nQuản lý danh mục đầu tư: mô tả các phương pháp đo lường và sửa đổi mức độ rủi ro và\ncác yếu tố cần cân nhắc khi lựa chọn trong số các phương pháp","qhtml":null},{"n":81,"q":"An analyst gathers the following information about the security market line (SML) and a\nstock:\nIntercept of the SML 2%\nSlope of the SML 5%\nStock's beta 1.3\nAccording to capital market theory, if the analyst believes the stock will have a return of 7%,\nthe stock is:","opts":["undervalued.","properly valued.","overvalued."],"ans":"C","expl":"A. Không chính xác vì nhà phân tích dự báo lợi nhuận của tài sản là 7%, thấp hơn\nso với lợi nhuận kỳ vọng là 8,5% theo CAPM. Do đó, các biểu đồ bảo mật bên dưới\nSML và nên được coi là được định giá quá cao. Phản hồi này sẽ được chọn nếu lợi nhuận dự kiến\ncủa nội dung bị tính sai là 0,02 + 1,3 x (0,05 - 0,02) = 0,059 = 5,9%, điều này\nsẽ ngụ ý rằng nội dung nằm trên SML.\nB. Không chính xác vì nhà phân tích dự báo lợi nhuận của tài sản là 7%, thấp hơn\nso với lợi nhuận kỳ vọng là 8,5% theo CAPM. Do đó, bảo mật không biểu đồ\ntrên SML và nó không có giá trị phù hợp theo CAPM. Phản hồi này sẽ được\nchọn nếu beta bị bỏ qua trong phương trình CAPM và lợi nhuận kỳ vọng của nội dung\nbị tính sai là 0,02 + 𝛽 ² 𝜎 ² 0,05 = 0,07 = 7,0%, điều này có nghĩa là nội dung\n𝑖 𝑚\nsơ đồ trên SML.\nC. Đúng vì đường thị trường chứng khoán (SML) là biểu diễn đồ họa của mô hình định giá tài sản vốn\nvới phiên bản beta, phản ánh rủi ro hệ thống, trên trục x và lợi nhuận kỳ vọng\ntrên trục y. Sử dụng khái niệm tương tự như đường thị trường vốn, SML cắt trục y-\nở tỷ suất lợi nhuận phi rủi ro và độ dốc của đường này là phần bù rủi ro thị trường, R -\nm\nR. Các nhà đầu tư tiềm năng có thể vẽ biểu đồ lợi nhuận kỳ vọng và beta của chứng khoán so với SML và\nf\nsử dụng mối quan hệ này để quyết định xem chứng khoán đó được định giá quá cao hay bị định giá thấp trên thị trường\n. Tất cả các chứng khoán phản ánh quan điểm thị trường đồng thuận đều được ghi điểm trực tiếp trên SML\n(Le được định giá hợp lý). Nếu điểm đại diện cho lợi nhuận ước tính của một tài sản cao hơn\nSML thì tài sản đó có mức độ rủi ro thấp so với mức lợi nhuận kỳ vọng và sẽ\nlà một lựa chọn tốt để đầu tư Ngược lại, nếu điểm đại diện cho một tài sản cụ thể\nthấp hơn SML thì cổ phiếu được coi là được định giá quá cao. Nội dung sẽ nằm trên SML nếu\nlợi nhuận dự báo bằng lợi nhuận kỳ vọng là 0,02 + 1,3 x 0,05 = 0,085 = 8,5%. Vì\nnhà phân tích dự báo lợi nhuận của tài sản là 7%, thấp hơn lợi nhuận dự kiến\ntheo CAPM, nên mức độ bảo mật nằm dưới SML và nên được coi là\nđược định giá quá cao.\nQuản lý danh mục đầu tư: mô tả và chứng minh các ứng dụng của CAPM và SML","qhtml":null},{"n":82,"q":"Relative to passive market-cap-weighted strategies, smart beta strategies typically have:","opts":["lower management fees and higher portfolio turnover.","higher management fees and lower portfolio turnover.","higher management fees and higher portfolio turnover."],"ans":"C","expl":"A. Không chính xác vì thông thường, các chiến lược beta thông minh có phí quản lý\ncao hơn một chút và doanh thu danh mục đầu tư cao hơn so với các chiến lược\ncó trọng số vốn hóa thị trường thụ động.\nB. Không chính xác vì thông thường, các chiến lược beta thông minh có phí quản lý\ncao hơn một chút và doanh thu danh mục đầu tư [không thấp hơn] cao hơn so với các chiến lược\ncó trọng số vốn hóa thị trường thụ động.\nC. Đúng vì thông thường, các chiến lược beta thông minh có phí quản lý\ncao hơn một chút và doanh thu danh mục đầu tư cao hơn so với các chiến lược tính trọng số vốn hóa thị trường thụ động.\nQuản lý danh mục đầu tư: mô tả các khía cạnh của ngành quản lý tài sản","qhtml":null},{"n":83,"q":"When defining asset classes for a strategic asset allocation, which of the following\npairwise correlations between asset class returns is most preferable?","opts":["0.0","0.5","1.0"],"ans":"A","expl":"A. Đúng vì khi xác định loại tài sản, một số tiêu chí sẽ được áp dụng. Theo trực quan, một\nloại tài sản phải chứa các tài sản tương đối đồng nhất trong khi vẫn mang lại sự đa dạng hóa\nso với các loại tài sản khác. Theo thuật ngữ thống kê, rủi ro và lợi nhuận kỳ vọng phải\ntương tự nhau và mối tương quan theo cặp của tài sản phải tương đối cao trong một loại tài sản nhưng\nphải thấp hơn so với tài sản trong các loại tài sản khác. Mối tương quan giữa các loại nội dung\n0 sẽ cho biết các loại nội dung được xác định rõ ràng hơn so với các mối tương quan cao hơn.\nB. Không chính xác vì khi xác định loại tài sản, một số tiêu chí sẽ được áp dụng. Theo trực quan, một\nloại tài sản phải chứa các tài sản tương đối đồng nhất trong khi vẫn mang lại sự đa dạng hóa\nso với các loại tài sản khác. Theo thuật ngữ thống kê, rủi ro và lợi nhuận kỳ vọng phải\ntương tự nhau và mối tương quan theo cặp của tài sản phải tương đối cao trong một loại tài sản nhưng\nphải thấp hơn so với tài sản trong các loại tài sản khác. Mối tương quan giữa các loại nội dung là 0,5\nsẽ cho thấy các loại nội dung được xác định ít rõ ràng hơn so với mức tương quan bằng 0.\nC. Không chính xác vì khi xác định loại tài sản, một số tiêu chí sẽ được áp dụng. Theo trực quan, một\nloại tài sản phải chứa các tài sản tương đối đồng nhất trong khi vẫn mang lại sự đa dạng hóa\nso với các loại tài sản khác. Theo thuật ngữ thống kê, rủi ro và lợi nhuận kỳ vọng phải\ntương tự nhau và mối tương quan theo cặp của tài sản phải tương đối cao trong một loại tài sản nhưng\nphải thấp hơn so với tài sản trong các loại tài sản khác. Mối tương quan giữa các loại tài sản là 1,0\nsẽ cho thấy các loại tài sản được xác định ít rõ ràng hơn so với mối tương quan bằng 0. Ứng viên\ncó thể chọn phản hồi này nếu họ nhầm lẫn giữa tiêu chí về mối tương quan giữa các loại tài sản\nvới tiêu chí về mối tương quan trong từng loại tài sản (phải cao).\nQuản lý danh mục đầu tư: giải thích đặc điểm kỹ thuật của các loại tài sản liên quan đến việc phân bổ tài sản","qhtml":null},{"n":84,"q":"According to capital market theory, an efficient market does not reward investors for\ntaking on:","opts":["market risk.","systematic risk.","idiosyncratic risk."],"ans":"C","expl":"A. Không chính xác vì rủi ro hệ thống, còn được gọi là rủi ro không thể đa dạng hóa hoặc rủi ro thị trường, là\nrủi ro ảnh hưởng đến toàn bộ thị trường hoặc nền kinh tế. Rủi ro hệ thống hoặc không thể đa dạng hóa được định giá\nvà các nhà đầu tư được bồi thường khi nắm giữ tài sản hoặc danh mục đầu tư chỉ dựa trên rủi ro hệ thống\ncủa khoản đầu tư đó. Các nhà đầu tư không nhận được bất kỳ lợi nhuận nào khi chấp nhận\nrủi ro phi hệ thống hoặc có thể đa dạng hóa.\nB. Không chính xác vì rủi ro hệ thống, còn được gọi là rủi ro không thể đa dạng hóa hoặc rủi ro thị trường, là\nrủi ro ảnh hưởng đến toàn bộ thị trường hoặc nền kinh tế. Rủi ro hệ thống hoặc không thể đa dạng hóa được định giá\nvà các nhà đầu tư được bồi thường khi nắm giữ tài sản hoặc danh mục đầu tư chỉ dựa trên rủi ro hệ thống\ncủa khoản đầu tư đó. Các nhà đầu tư không nhận được bất kỳ lợi nhuận nào khi chấp nhận\nrủi ro phi hệ thống hoặc có thể đa dạng hóa.\nC. Đúng vì chúng ta có thể giả định rằng trong một thị trường hiệu quả,\nkhông thể kiếm được phần thưởng gia tăng nào khi chấp nhận rủi ro có thể đa dạng hóa. Rủi ro phi hệ thống là rủi ro liên quan đến một\ncông ty hoặc một ngành và còn được gọi là rủi ro cụ thể của công ty, ngành cụ thể, có thể đa dạng hóa,\nhoặc rủi ro đặc thù.\nQuản lý danh mục đầu tư: giải thích rủi ro hệ thống và phi hệ thống, bao gồm cả lý do tại sao\nnhà đầu tư không nên kỳ vọng nhận được lợi nhuận bổ sung khi chịu rủi ro phi hệ thống","qhtml":null},{"n":85,"q":"Which of the following is most likely a legal and regulatory constraint in an investment\npolicy statement?","opts":["A pension fund's decision to limit investments in real estate","A taxable investor's requirement to avoid investments in securities generating interest income","A public company director's restriction on trading the company's stock shortly before the publication of financial results"],"ans":"C","expl":"A. Không chính xác vì không có dấu hiệu nào cho thấy quyết định hạn chế\nđầu tư vào bất động sản của quỹ hưu trí được thúc đẩy bởi các yếu tố pháp lý và quy định. Hơn nữa, từ\n'quyết định' nhấn mạnh rằng đó không phải là một yêu cầu bên ngoài, điều này sẽ xảy ra nếu nó\nđược yêu cầu bởi luật pháp hoặc quy định\nB. Không chính xác vì ràng buộc này được thúc đẩy bởi những cân nhắc về mặt kinh tế của khách hàng và\ndo đó sẽ được phản ánh trong phần các vấn đề về thuế của IFS chứ không phải trong các ràng buộc pháp lý và\nquy định. Trong nhiều trường hợp, danh mục đầu tư phải phản ánh tình trạng thuế của khách hàng\n. Ví dụ: một nhà đầu tư chịu thuế có thể muốn nắm giữ một danh mục đầu tư tập trung vào lợi nhuận\nvà nhận được ít thu nhập\nC. Đúng vì khi một cá nhân có quyền truy cập vào thông tin quan trọng không công khai về một\nbảo mật cụ thể thì tình huống này cũng có thể hình thành một ràng buộc (pháp lý và quy định). Ví dụ:\n, các giám đốc của một công ty đại chúng có thể cần phải hạn chế giao dịch cổ phiếu\ncủa công ty vào một số thời điểm nhất định trong năm trước khi kết quả tài chính được công bố. IPS cần lưu ý\nràng buộc này để người quản lý danh mục đầu tư không làm như vậy vô tình giao dịch cổ phiếu Thực hiện\nthay mặt khách hàng\nQuản lý danh mục đầu tư: mô tả các hạn chế đầu tư về tính thanh khoản, thời gian, mối lo ngại về thuế\n, các yếu tố pháp lý và quy định cũng như các trường hợp đặc biệt và ý nghĩa của chúng đối với\nviệc lựa chọn tài sản danh mục đầu tư","qhtml":null},{"n":86,"q":"When defining asset classes, the paired correlations of assets within an asset class should\nbe:","opts":["negative.","zero.","positive."],"ans":"C","expl":"A. Không chính xác vì khi xác định các loại nội dung được ghép nối, mối tương quan của các nội dung phải\ntương đối cao trong một loại nội dung.\nB. Không chính xác vì khi xác định các loại nội dung được ghép nối. mối tương quan của các tài sản phải\ntương đối cao trong một loại tài sản.\nC. Đúng vì khi xác định các loại tài sản, một loại tài sản phải chứa\ncác tài sản đồng nhất tương đối và mối tương quan theo cặp của các tài sản phải tương đối cao trong một\nlớp tài sản.\nQuản lý danh mục đầu tư: giải thích đặc điểm kỹ thuật của các loại tài sản liên quan đến tài sản\nphân bổ","qhtml":null},{"n":87,"q":"An investor gathers the following information about a security and the market:\nSecurity's beta 0.35\nStandard deviation of the security's returns 12%\nStandard deviation of market returns 18%\nThe correlation between the security's returns and the market's returns is closest to:","opts":["0.2.","0.5.","0.8."],"ans":"B","expl":"A. Không chính xác vì nó nhầm lẫn giữa 𝜎 , và 𝜎 và tính 𝜌 = 𝛽 x 𝜎 /𝜎 = 0,35 x\n𝑖 𝑚 𝑖,𝑚 𝑖 𝑖 𝑚\n0,12/0,18 = 0,233 ≈ 0,2. Câu trả lời này cũng có được nếu, như một lỗi bổ sung, phương sai\nđược sử dụng 𝜌 = 𝛽 x 𝜎 2/𝜎 2= 0,35 x (0,12)2/(0,18)2 = 0,156 ≈ 0,2.\n𝑖,𝑚 𝑖 𝑖 𝑚\nB. Đúng vì 𝛽 = 𝜌 x 𝜎 /𝜎 trong đó 𝜌 biểu thị mối tương quan giữa tài sản\n𝑖 𝑖,𝑚 𝑖 𝑚 𝑖,𝑚\nlợi nhuận và lợi nhuận thị trường, và σ, và σ biểu thị độ lệch chuẩn của tài sản\nlợi nhuận và lợi nhuận thị trường tương ứng. Do đó, hệ số tương quan 𝜌 = 𝛽 x 𝜎 /𝜎 = 0,35 x\n𝑖,𝑚 𝑖 𝑚 𝑖\n0,18/0,12 = 0,525 ≈ 0,5.\nC. Không chính xác vì nó sử dụng phương sai thay vì độ lệch chuẩn trong công thức đúng;\n𝜌 = 𝛽 x 𝜎 2/𝜎 2 = 0,35 * (0,18)2/(0,12)²= 0,788 ≈ 0,8.\n𝑖,𝑚 𝑖 𝑚 𝑖\nQuản lý danh mục đầu tư: tính toán và giải thích hệ số beta","qhtml":null},{"n":88,"q":"A bank determines that its value at risk (VAR) is £5 million at 5% for one day. The bank is\nexpecting a minimum loss of £5 million once every:","opts":["5 business days.","13 business days.","20 business days."],"ans":"C","expl":"A. Không chính xác vì với xác suất 5% và thời gian đo là một ngày, chúng tôi có thể\nhiểu VaR của ngân hàng là dự kiến ​​khoản lỗ tối thiểu là 5 triệu bảng Anh cứ sau 20 ngày kinh doanh\n.\nB. Không chính xác vì với xác suất 5% và thời gian đo là một ngày, chúng tôi có thể\nhiểu VaR của ngân hàng là dự kiến ​​khoản lỗ tối thiểu là 5 triệu bảng Anh cứ sau 20 ngày làm việc\n. Dựa trên một năm có 250 đến 260 ngày làm việc, điều này sẽ xảy ra 12,5 đến 13 lần mỗi\nnăm (khoảng một lần mỗi tháng).\nC. Đúng vì với xác suất 5% và thời gian đo là một ngày, chúng tôi có thể\nhiểu VaR của ngân hàng là dự kiến khoản lỗ tối thiểu là 5 triệu bảng Anh cứ sau 20 ngày làm việc\n.\nQuản lý danh mục đầu tư: mô tả các phương pháp đo lường và sửa đổi mức độ rủi ro và\ncác yếu tố cần cân nhắc khi lựa chọn trong số các phương pháp","qhtml":null},{"n":89,"q":"A good risk management process should:","opts":["predict when a crisis will occur.","consider the balance between expected returns and losses.","only consider losses occurring from events that have a high likelihood."],"ans":"B","expl":"A. Không chính xác vì quản lý rủi ro thậm chí không phải là dự đoán rủi ro. Học thuyết Không có\nBất ngờ' là câu thần chú quan trọng của nhiều nhà quản lý rủi ro, nhưng điều đó không có nghĩa là họ\nđược mong đợi dự đoán điều gì sẽ xảy ra. Ví dụ: người quản lý rủi ro của một ngân hàng sẽ không\nbiết rằng một cuộc khủng hoảng bất động sản sắp xảy ra và gây ra\nvỡ nợ đáng kể đối với chứng khoán bất động sản của ngân hàng.\nB. Đúng vì một quy trình quản lý rủi ro tốt sẽ bao gồm một cuộc thảo luận sâu sắc ở cấp độ quản trị\nvề sự cân bằng giữa lợi nhuận có thể có và những tổn thất không thể xảy ra nhưng khá lớn-\nvà liệu những tổn thất đó có thể chấp nhận được hay không.\nC. Không chính xác vì quy trình quản lý rủi ro kém sẽ bỏ qua khả năng xảy ra một sự kiện thị trường quan trọng như vậy,\ndù nhỏ và không lượng hóa được khoản lỗ tiềm ẩn.\nQuản lý danh mục đầu tư: xác định quản lý rủi ro","qhtml":null},{"n":90,"q":"A portfolio consisting of two securities has the following characteristics:\nSecurity Portfolio Weight Standard Deviation\n1 40% 15%\n2 60% 18%\nIf the correlation of returns between the two securities is 0.20, the portfolio's standard\ndeviation of returns is closest to:","opts":["1.8%.","9.1%.","13.4%."],"ans":"C","expl":"A. Không chính xác vì đây là phương sai danh mục đầu tư thay vì độ lệch chuẩn:\n𝜎2=𝑤2𝜎2 +𝑤2𝜎2 +2𝑤 𝑤 𝜌 𝜎 𝜎\n𝑝 1 1 2 2 1 2 12 1 2\n=(0.4)2(0.15)2(+(0.6)2 (0.18)2(+2(0.4) (0.6)(0.2)(0.15)(0.18)\n=(0.16) (0.0225) + (0.36) (0.0324) + (0,002592)=0,017856 1,8%.\nB. Không chính xác vì nó sử dụng độ lệch chuẩn thay vì phương sai trong công thức cho\nđộ lệch chuẩn danh mục đầu tư:\n𝜎2=𝑤2𝜎 +𝑤2𝜎 +2𝑤 𝑤 𝜎 𝜎 𝜌\n𝑝 1 1 2 2 1 2 1 2 12\n(0.4)2 (0.15) + (0.6)2 (0.18) +2(0.4)(0.6) (0.20)(0.15)(0.18)\n(0,024)+(0,0648)+(0,002592)\n=0,091392≈9,1%.&\nC. Đúng vì 𝜎 =\n𝑝𝑜𝑟𝑡\n√𝑤2𝜎2 +𝑤2𝜎2 +2𝑤 𝑤 𝜌 𝜎 𝜎\n1 1 2 2 1 2 1,2 1 2\n√(0.4)2 (0.15)2 +(0.6)2 (0,18)2 +2(0,4)(0,6)(0,2)(0,15)(0,18)\n(0,16) (0,0225)+(0,36) (0,0324)+0,002592\n=√0,017856\n= 0,133626≈13,4%.\nQuản lý danh mục đầu tư: tính toán và giải thích độ lệch chuẩn của danh mục đầu tư","qhtml":"<p>A portfolio consisting of two securities has the following characteristics:</p><table class=\"qtable\"><thead><tr><th>Security</th><th>Portfolio Weight</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>1</td><td>40%</td><td>15%</td></tr><tr><td>2</td><td>60%</td><td>18%</td></tr></tbody></table><p>If the correlation of returns between the two securities is 0.20, the portfolio's standard deviation of returns is closest to:</p>"},{"n":91,"q":"An investor has a 15-year time horizon but needs to withdraw funds from her portfolio in\none year's time to pay for tuition fees. Which of the following investments is most suitable to\ncover the investor's liquidity requirement due to the tuition fees?","opts":["Commercial paper","Private equity securities","Large-capitalization stocks"],"ans":"A","expl":"A. Đúng vì vì, mặc dù nhà đầu tư có thời hạn 15 năm, nhưng cô ấy có nhu cầu thanh khoản\ntrong một năm. Khi khách hàng có yêu cầu như vậy, người quản lý nên\nphân bổ một phần danh mục đầu tư để trang trải trách nhiệm pháp lý Phần này của danh mục đầu tư sẽ được đầu tư vào\ntài sản có tính thanh khoản-nghĩa là dễ dàng chuyển đổi thành tiền mặt-và rủi ro thấp tại thời điểm\nthanh khoản thực sự hiện diện (ví dụ: một trái phiếu đáo hạn tại trường tư thục Ume whee\nsẽ phát sinh chi phí), do đó giá trị của chúng được biết đến một cách chắc chắn\nGiấy tờ thương mại là giấy tờ có giá ngắn hạn. có thể thương lượng, kỳ phiếu không có bảo đảm thể hiện nghĩa vụ nợ\ncủa người phát hành. Vì vậy, thương phiếu là một khoản đầu tư ngắn hạn. Sẽ phù hợp hơn\nso với vốn cổ phần tư nhân và cổ phiếu vốn hóa lớn khi được đưa vào\nphần porono của nhà đầu tư có nhu cầu thanh khoản ngắn hạn\nB. Không chính xác vì mặc dù nhà đầu tư có thời hạn 15 năm nhưng cô ấy có nhu cầu thanh khoản\ntrong một năm. Khi khách hàng có yêu cầu như vậy, người quản lý nên\nphân bổ một phần danh mục đầu tư để trang trải trách nhiệm pháp lý. Phần này của danh mục đầu tư sẽ được đầu tư\nvào các tài sản có tính thanh khoản-nghĩa là dễ dàng chuyển đổi thành tiền mặt-và có rủi ro thấp tại thời điểm\nnhu cầu thanh khoản thực sự xuất hiện (ví dụ: trái phiếu đáo hạn vào thời điểm phát sinh chi phí cho giáo dục tư nhân\n), do đó giá trị của chúng được xác định một cách chắc chắn hợp lý. Chứng khoán vốn cổ phần tư nhân\nkhông được niêm yết trên các sàn giao dịch đại chúng và không có thị trường thứ cấp đang hoạt động.\nChúng được phát hành chủ yếu cho các nhà đầu tư tổ chức thông qua các đợt chào bán không công khai, chẳng hạn như các đợt phát hành\nriêng tư. Vì có tính thanh khoản kém nên chúng không phù hợp để đưa vào danh mục\ncủa khách hàng có nhu cầu thanh khoản ngắn hạn.\nC. Không chính xác vì bởi vì, mặc dù nhà đầu tư có thời hạn 15 năm, nhưng cô ấy có nhu cầu thanh khoản\ntrong một năm. Khi khách hàng có yêu cầu như vậy, người quản lý nên\nphân bổ một phần danh mục đầu tư để trang trải trách nhiệm pháp lý. Phần này của danh mục đầu tư sẽ được đầu tư\nvào các tài sản có tính thanh khoản-nghĩa là dễ dàng chuyển đổi thành tiền mặt- và có rủi ro thấp tại thời điểm\nnhu cầu thanh khoản thực sự hiện hữu (ví dụ: một trái phiếu đáo hạn vào thời điểm phát sinh chi phí giáo dục tư nhân\n), do đó giá trị của chúng được xác định một cách chắc chắn hợp lý. khoản đầu tư dễ biến động hơn so với thương phiếu, sẽ\nít phù hợp hơn để được đưa vào phần danh mục đầu tư của nhà đầu tư có nhu cầu thanh khoản ngắn hạn\n.\nQuản lý danh mục đầu tư: mô tả các hạn chế đầu tư về tính thanh khoản, khoảng thời gian, mối lo ngại về thuế\n, các yếu tố pháp lý và quy định cũng như các trường hợp đặc biệt và ý nghĩa của chúng đối với\nviệc lựa chọn tài sản danh mục đầu tư","qhtml":null},{"n":92,"q":"With respect to capital market theory, which of the following statements is most\naccurate?","opts":["The optimal risky portfolio is dependent on the risk-free rate.","The optimal risky portfolio is dependent on the investor's risk profile.","The investor's optimal portfolio must lie on the Markowitz efficient frontier."],"ans":"A","expl":"A. Đúng vì vì, đối với một đường biên hiệu quả Markowitz nhất định, một lãi suất phi rủi ro khác sẽ\ndẫn đến một tiếp tuyến khác với đường biên, do đó một danh mục đầu tư rủi ro tối ưu khác CAL(P)\nlà đường phân bổ vốn tối ưu và Danh mục P là danh mục đầu tư rủi ro tối ưu. Do đó, với\nviệc bổ sung tài sản phi rủi ro, chúng tôi có thể thu hẹp lựa chọn danh mục đầu tư rủi ro của mình thành\nmột danh mục đầu tư rủi ro tối ưu duy nhất, P nằm ở tiếp tuyến của CAL(P) và biên giới hiệu quả\ncủa tài sản rủi ro.\nB. Không chính xác vì danh mục đầu tư rủi ro tối ưu được chọn từ nhiều danh mục đầu tư rủi ro\nmà không xem xét sở thích của nhà đầu tư.\nC. Không chính xác vì tất cả các nhà đầu tư bất kể sở thích, sở thích rủi ro và mức tài sản ban đầu sẽ\nnắm giữ sự kết hợp của hai danh mục đầu tư hoặc quỹ. một tài sản không có rủi ro và một danh mục tối ưu gồm\ntài sản rủi ro. Do đó, danh mục đầu tư tối ưu của nhà đầu tư nằm trên đường phân bổ vốn (CAL), chứ không phải\ntrên đường biên hiệu quả Markowitz. Nếu nhà đầu tư không phân bổ tài sản vào\ntài sản không rủi ro là điều tối ưu thì danh mục đầu tư tối ưu của nhà đầu tư sẽ nằm trên đường biên hiệu quả Markowitz\nTuy nhiên, điều này không phải \"luôn luôn\" như vậy.\nQuản lý danh mục đầu tư: giải thích việc lựa chọn danh mục đầu tư tối ưu, dựa trên\ntiện ích (hoặc ác cảm rủi ro) và đường phân bổ vốn của nhà đầu tư","qhtml":null},{"n":93,"q":"An analyst gathers the following information:\nStandard Deviation of Returns Beta\nAsset 70% 1.8\nMarket portfolio 35% 1.0\nThe covariance between the returns of the asset and the market is closest to:","opts":["0.22.","0.40.","0.90."],"ans":"A","expl":"A. Đúng vì vì, với phiên bản beta của một nội dung (𝛽 ), hiệp phương sai giữa lợi nhuận của nội dung\n𝑖\n(𝑅 ) và lợi nhuận của danh mục đầu tư thị trường (𝑅 ) được tính bởi: Cov(𝑅 𝑅 ) = 𝛽 x 𝜎2 = 1,8 ×\n𝑖 𝑚 𝑖 𝑚 𝑖 𝑚\n0,352 = 0,22\nB. Không chính xác vì đây là phương sai hệ thống của danh mục đầu tư; 𝛽 2 x 𝜎2 =1,82 x 0,352 =\n𝑖 𝑚\n0,40.\nC. Không chính xác vì đây là hệ số tương quan, không phải hiệp phương sai, giữa lợi nhuận\ncủa tài sản và lợi nhuận của danh mục đầu tư thị trường, 𝜌 = 𝛽 ∗ 𝜎 /𝜎 = 1,8 x 0,35/0,70 = 0,90. Đó\n𝑖,𝑚 𝑖 𝑚 𝑖\ncũng là câu trả lời gần nhất nếu phương sai lợi nhuận của tài sản được sử dụng theo đúng công thức thay vì\nphương sai lợi nhuận thị trường; 1,8 x 0,70² = 0,88.\nQuản lý danh mục đầu tư: tính toán và diễn giải beta","qhtml":"<p>An analyst gathers the following information:</p><table class=\"qtable\"><thead><tr><th></th><th>Standard Deviation of Returns</th><th>Beta</th></tr></thead><tbody><tr><td>Asset</td><td>70%</td><td>1.8</td></tr><tr><td>Market portfolio</td><td>35%</td><td>1.0</td></tr></tbody></table><p>The covariance between the returns of the asset and the market is closest to:</p>"},{"n":94,"q":"A security with a beta of 1.5 has an expected return of 11% according to the CAPM. If the\nrisk-free rate is 2%, the market risk premium is closest to:","opts":["4.0%.","6.0%.","7.3%."],"ans":"B","expl":"A. Không chính xác vì Không chính xác vì nó sử dụng phương trình CAPM không chính xác để tính toán lợi nhuận kỳ vọng của chứng khoán\nlà E(𝑅 ) = 𝑅 +𝛽 x E(𝑅 ), sao cho E(𝑅 ) = [E(𝑅 )- 𝑅 /𝛽 ; = (0,11
