<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

tes that the nominal yield spread between two markets is determined solely by their expected inflation differential.<\/p><p><b>Statement 3<\/b> Relative purchasing power parity states that the notional exchange rate between two markets is the ratio of their broad price indexes.<\/p><p>Gómez asks Reyes what international parity conditions mean for expected spot exchange rates. Reyes explains that if all key international parity conditions held, the expected spot exchange rate would track several measures between two countries. He continues that if certain parity conditions held, there would be no difference between the real interest rates of the two countries.<\/p><p>Reyes notes that uncovered interest rate parity between Mexico and the United States has held in recent years. He provides Gómez with the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex001.webp\" style=\"max-width:min(100%,529px)\" alt=\"Exhibit\"><p>Reyes mentions that international parity conditions do not always hold, especially over the short term. This allows Cuadrado to exploit certain trades, such as the carry trade. He notes that a good carry trade opportunity is to borrow with EUR to purchase BRL. Gómez compiles the following information and expectations on the currencies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex002.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><p>Gómez asks Reyes if there is anything she should know about the distribution of returns for carry trades.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the returns for carry trades over time?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":7,"q":"Regarding Saleem's inquiry about technological advances, Al-Qahtani's most appropriate response is that they result in:","opts":["only a shift upward of the per capita production function.","only a movement to the right along the per capita production function.","both a shift upward and movement to the right along the per capita production function."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Economics<\/summary><div class=\"vig-body\"><p>Rana Al-Qahtani, a senior economist for Tigris Bank, is discussing the prospects for several foreign markets with Amin Saleem, a newly hired junior economist. Al-Qahtani explains to Saleem the difference between capital deepening and technological advances in an economy, in the context of neoclassical theory. Saleem asks how technological advances affect the per capita production function, which leads to a discussion of economic growth models.<\/p><p>Al-Qahtani and Saleem then discuss Country 1, a developed country with a large amount of capital per worker compared with its neighbors. Country 1 plans to continue investing in capital projects to improve its growth. It has identified three areas of investment focus:<\/p><p>Investment 1:Highways and transportation equipment<\/p><p>Investment 2:Machinery and nonresidential construction<\/p><p>Investment 3:Computers and telecommunications equipment<\/p><p>Country 2 is a developing country whose growth rate has slowed during the last two years. Al-Qahtani asks Saleem to calculate the potential GDP growth rate for Country 2. Saleem compiles the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex003.webp\" style=\"max-width:min(100%,443px)\" alt=\"Exhibit\"><p>Saleem notes that Country 2&#x27;s GDP is growing faster than Country 1&#x27;s GDP, a trend that is consistent with convergence theory. However, he asks Al-Qahtani why Country 3, another developing country, is growing slower than Country 1 although it has characteristics similar to Country 2. Al-Qahtani replies that Country 3, although similar overall to Country 2, does not enforce property rights and will catch up with richer countries only when it does so.<\/p><p>Saleem then asks Al-Qahtani about how different economic models affect convergence and other topics. Al-Qahtani makes the following statements:<\/p><p><b>Statement 1:<\/b> The endogenous theory asserts that all countries&#x27; per capita GDPs should converge, but the neoclassical model suggests that divergences can persist indefinitely.<\/p><p><b>Statement 2:<\/b> Unlike the other models, the classical model predicts that an increase in a country&#x27;s savings rate will result in a greater permanent rate of per capita GDP growth.<\/p><p><b>Statement 3:<\/b> The neoclassical model assumes diminishing returns on capital; the endogenous growth model assumes a straight-line production function.<\/p><p>Al-Qahtani also notes that two main criticisms of the neoclassical model by economists have resulted in expansions of the model, as well as new theories.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Saleem&#x27;s inquiry about technological advances, Al-Qahtani&#x27;s most appropriate response is that they result in:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":8,"q":"Based on the endogenous growth theory, which of Country 1's areas of planned investment are most likely to create externalities that will support growth?","opts":["Investment 1","Investment 2","Investment 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eim  at the following conclusions:<\/p><p><b>Conclusion 1<\/b> Actual GDP growth relative to a country&#x27;s potential GDP growth rate is an important factor in central bank decision-making and the likelihood of changes to the central bank&#x27;s policies.<\/p><p><b>Conclusion 2<\/b> A decrease in a country&#x27;s potential GDP growth rate increases the likelihood that the credit ratings on its sovereign debt will be downgraded.<\/p><\/div><\/details><div class=\"qtext\"><p>Saito wishes to identify how capital deepening will affect each country&#x27;s per capita output growth. Based on the neoclassical model, which of the following factors is most appropriate for Saito to consider?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":26,"q":"Based on Exhibit 1 and the growth-accounting equation, Country 1's potential GDP is closest to:","opts":["2.9%","3.5%","4.9%"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a026.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a026.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 25–30 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Botan Saito is a portfolio manager for Spire Financial. Spire&#x27;s investments are largely domestic, and Saito plans to diversify Spire&#x27;s holdings by adding investments in international markets. Saito identifies three countries that he will research further. He collects the following economic data for each country, using average year-on-year growth rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex007.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>During his research, Saito realizes that numbers are not fully explaining the economic differences in these countries. He further researches institutional economic information, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex008.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>Country 2 is planning to implement new policies that create a more open trade policy. Saito expects that this will result in a higher permanent steady-state GDP growth rate.<\/p><p>Saito is interested in how economic factors will ultimately impact each country&#x27;s stock market. He notes that Country 3&#x27;s:<\/p><p>GDP growth is slightly above the country&#x27;s steady-state GDP growth rate in 20X4;<\/p><p>earnings-to-GDP ratio was above the country&#x27;s historical average in 20X4; and<\/p><p>price-to-earnings ratio of the country&#x27;s publicly traded stocks was below its historical average in 20X4.<\/p><p>Saito is also interested in how potential GDP will affect each country&#x27;s bonds. He arrives at the following conclusions:<\/p><p><b>Conclusion 1<\/b> Actual GDP growth relative to a country&#x27;s potential GDP growth rate is an important factor in central bank decision-making and the likelihood of changes to the central bank&#x27;s policies.<\/p><p><b>Conclusion 2<\/b> A decrease in a country&#x27;s potential GDP growth rate increases the likelihood that the credit ratings on its sovereign debt will be downgraded.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and the growth-accounting equation, Country 1&#x27;s potential GDP is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q026.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":27,"q":"Based on Exhibits 1 and 2, all else equal, which country will most likely realize the greatest percentage increase in potential GDP from investments in health care?","opts":["Country 1","Country 2","Country 3"], h:min(100%,645px)\" alt=\"Exhibit\"><p>During his research, Saito realizes that numbers are not fully explaining the economic differences in these countries. He further researches institutional economic information, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex008.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>Country 2 is planning to implement new policies that create a more open trade policy. Saito expects that this will result in a higher permanent steady-state GDP growth rate.<\/p><p>Saito is interested in how economic factors will ultimately impact each country&#x27;s stock market. He notes that Country 3&#x27;s:<\/p><p>GDP growth is slightly above the country&#x27;s steady-state GDP growth rate in 20X4;<\/p><p>earnings-to-GDP ratio was above the country&#x27;s historical average in 20X4; and<\/p><p>price-to-earnings ratio of the country&#x27;s publicly traded stocks was below its historical average in 20X4.<\/p><p>Saito is also interested in how potential GDP will affect each country&#x27;s bonds. He arrives at the following conclusions:<\/p><p><b>Conclusion 1<\/b> Actual GDP growth relative to a country&#x27;s potential GDP growth rate is an important factor in central bank decision-making and the likelihood of changes to the central bank&#x27;s policies.<\/p><p><b>Conclusion 2<\/b> A decrease in a country&#x27;s potential GDP growth rate increases the likelihood that the credit ratings on its sovereign debt will be downgraded.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Saito&#x27;s conclusions about how potential GDP will affect a country&#x27;s bonds is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q030.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":31,"q":"In the short term, which balance of payments account will least likely affect a country's exchange rate?","opts":["Capital account","Current account","Financial account"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a031.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a031.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Economics<\/summary><div class=\"vig-body\"><p>Ishita Rani is a currency trader at Inspire Bank discussing exchange rates with a newly hired junior trader, Raj Pawar. Rani asks Pawar about the balance of payment accounts and its impact on exchange rates. Pawar replies that the accounts can have different effects in the short term and long term. He elaborates by stating that over the long term, the current account affects exchange rates through three channels:<\/p><p>Channel 1:A current account deficit will result in decreased relative demand for that country&#x27;s currency, leading to currency depreciation.<\/p><p>Channel 2:Countries with current account surpluses may rebalance their unbalanced foreign currency portfolios, positively impacting the foreign currencies.<\/p><p>Channel 3:Investors in countries running persistent current account deficits will revise their exchange rate expectations upward until the country stabilizes its debt-to-GDP ratio.<\/p><p>Rani also wants to gauge Pawar&#x27;s knowledge of how monetary and fiscal policies can affect exchange rates. She tells Pawar that Country X, an emerging market, has recently instituted more expansionary monetary and fiscal policies. She adds that Country X has had high capital mobility in recent years.<\/p><p>Pawar remembers reading about a currency crisis that happened several years ago in Country X. Rani states that although not all currency crises show all the expected warning signs, the crisis in Country X did in fact show some warning signs that investors ignored at the time.<\/p><p>Pawar notes that some governments have taken steps to control their exchange rates. He asks Rani if countries can actually influence their exchange rates, and if so, whether countries with developed or developing economies would be more effective in doing so.<\/p><p>Rani also wants to test Pawar&#x27;s skills at valuing currency-based transactions. She tells Pawar that 3 months ago, Inspire initiated a forward contract to purchase NOK 7.5 million in 6 months. At the initiation of the contract, the 6-month forward exchange rate was INR/NOK 8.0000. She gives Pawar the current exchange rate information for the two currencies and asks him to mark the contract to market:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex009.webp\" style=\"max-width:min(100%,613px)\" alt=\"Exhibit\"><p>Rani notes that the INR risk-free rate is 2.5% and that Inspire uses a 360-day count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>In the short term, which balance of payments account will least likely affect a country&#x27;s exchange rate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":32,"q":"Regarding the current account's effect on exchange rates, which of the channels identified by Pawar is correctly described?","opts":["Channel 1","Channel 2","Channel 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a032.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a032.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ishita Rani is a currency trader at Inspire Bank discussing exchange rates with a newly hired junior trader, Raj Pawar. Ra hat investors ignored at the time.<\/p><p>Pawar notes that some governments have taken steps to control their exchange rates. He asks Rani if countries can actually influence their exchange rates, and if so, whether countries with developed or developing economies would be more effective in doing so.<\/p><p>Rani also wants to test Pawar&#x27;s skills at valuing currency-based transactions. She tells Pawar that 3 months ago, Inspire initiated a forward contract to purchase NOK 7.5 million in 6 months. At the initiation of the contract, the 6-month forward exchange rate was INR/NOK 8.0000. She gives Pawar the current exchange rate information for the two currencies and asks him to mark the contract to market:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex009.webp\" style=\"max-width:min(100%,613px)\" alt=\"Exhibit\"><p>Rani notes that the INR risk-free rate is 2.5% and that Inspire uses a 360-day count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, which type of economy should have a relative advantage in strengthening the level of its exchange rates through central bank intervention?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":36,"q":"Based on Exhibit 1, the mark-to-market value of Inspire Bank's forward contract (in INR) is closest to:","opts":["5,218,491","6,896,441","7,442,683"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a036.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a036.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ishita Rani is a currency trader at Inspire Bank discussing exchange rates with a newly hired junior trader, Raj Pawar. Rani asks Pawar about the balance of payment accounts and its impact on exchange rates. Pawar replies that the accounts can have different effects in the short term and long term. He elaborates by stating that over the long term, the current account affects exchange rates through three channels:<\/p><p>Channel 1:A current account deficit will result in decreased relative demand for that country&#x27;s currency, leading to currency depreciation.<\/p><p>Channel 2:Countries with current account surpluses may rebalance their unbalanced foreign currency portfolios, positively impacting the foreign currencies.<\/p><p>Channel 3:Investors in countries running persistent current account deficits will revise their exchange rate expectations upward until the country stabilizes its debt-to-GDP ratio.<\/p><p>Rani also wants to gauge Pawar&#x27;s knowledge of how monetary and fiscal policies can affect exchange rates. She tells Pawar that Country X, an emerging market, has recently instituted more expansionary monetary and fiscal policies. She adds that Country X has had high capital mobility in recent years.<\/p><p>Pawar remembers reading about a currency crisis that happened several years ago in Country X. Rani states that although not all currency crises show all the expected warning signs, the crisis in Country X did in fact show some warning signs that investors ignored at the time.<\/p><p>Pawar notes that some governments have taken steps to control their exchange rates. He asks Rani if countries can actually influence their exchange rates, and if so, whether countries with developed or developing economies would be more effective in doing so.<\/p><p>Rani also wants to test Pawar&#x27;s skills at valuing currency-based transactions. She tells Pawar that 3 months ago, Inspire initiated a forward contract to purchase NOK 7.5 million in 6 months. At the initiation of the contract, the 6-month forward exchange rate was INR/NOK 8.0000. She gives Pawar the current exchange rate information for the two currencies and asks him to mark the contract to market:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex009.webp\" style=\"max-width:min(100%,613px)\" alt=\"Exhibit\"><p>Rani notes that the INR risk-free rate is 2.5% and that Inspire uses a 360-day count convention.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the mark-to-market value of Inspire Bank&#x27;s forward contract (in INR) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q036.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":37,"q":"Which of the following government policies would most likely strengthen the legal environment to protect the long-term investments of international mining companies?","opts":["A framework governing bankruptcy processes","Introduction of blackout periods for trading stocks","Subsidized loans for acquiring new and more efficient equipment"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a037.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a037.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Economics<\/summary><div class=\"vig-body\"><p>The chief investment officer (CIO) of New Horizon Global Investments (New Horizon) wants to understand how existing and new regulations may affect potential investments in a country covered by New Horizon&#x27;s equity research team. The CIO is particularly interested in the mining and financial sectors and meets with Olivier Bodin and Sofia Esposito, equity analysts at New Horizon.<\/p><p>Bodin explains that several international mining companies intend to invest in the country but have expressed concern regarding the legal protection of the substantial long-term investments required. Local government is planning new laws and enforcement procedures to improve its legal environment, encouraging companies to commit to such investments.<\/p><p>Bodin adds that the local regulator, a government agency, is concerned about the pollution generated by iron ore processing activities. The agency proposed a new regulation, imposing a limit on industry pollution, distributing tradable emission rights to mining companies. The agency is currently investigating the costs and possible unintended consequences of the proposed regulation as part of its cost-benefit analysis. The CIO requests more information about this process, and Bodin explains that:<\/p><p><b>Statement 1:<\/b> Implementation costs relate to changes in economic decisions and behaviors.<\/p><p><b>Statement 2:<\/b> Unintended consequences may influence both implementation costs and indirect costs.<\/p><p><b>Statement 3:<\/b> The cost-benefit analysis is limited to the firms and industries directly affected by the proposed regulation.<\/p><p>Afterward, Esposito speaks about the country&#x27;s financial sector. She explains that its main regulatory body, the Financial Oversight Authority (FOA), was created by statute as an autonomous agency with rulemaking and enforcement powers but is not funded by the government. In addition, the Association of Commercial Banks (ACB), a private organization, establishes and enforces rules and standards in the financial industry. ACB does not derive its authority from legislation or from a government body, but exclusively from its members, who include most of the country&#x27;s financial institutions.<\/p><p>She adds that the financial industry is highly concentrated, with three major banks holding more than 70% of the assets of the financial system. In the previous year, a small bank suffered a bank run after considerable trading losses, and FOA intervened by forcing creditors and depositors to cancel their claims in exchange for shares of the bank.<\/p><p>As a result, FOA is proposing stricter regulation of short sales and leveraged trading. FOA&#x27;s regulators must decide the best approach to conduct a cost-benefit analysis: an after-the-fact analysis or a regulatory sandbox approach.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following government policies would most likely strengthen the legal environment to protect the long-term investments of international mining companies?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":38,"q":"Based on the information provided by Bodin, the new proposed regulation on pollution is a regulatory tool best described as a:","opts":["price mechanism.","regulatory capture.","restriction on behaviors."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The chief investment officer (CIO) of New Horizon Global Investments (New Horizon) wants to understand how existing and new regulations may affect potential investments in a country covered by New Horizon&#x27;s equity research team. The CIO is particularly interested in the mining and financial sectors and meets with Olivier Bodin and Sofia Esposito, equity analysts at New Horizon.<\/p><p>Bodin explains that several international mining companies intend to invest in the country but have expressed concern regarding the legal protection of the substantial long-term investments required. Local government is planning new laws and enforcement procedures to improve its legal environment, encouraging companies to commit to such investments.<\/p><p>Bodin adds that the local regulator, a government agency, is concerned about the pollution generated by iron ore processing activities. The agency proposed a new regulation, imposing a limit on industry pollution, distributing tradable emission rights to mining companies. The agency is currently investigating the costs and possible unintended consequences of the proposed regulation as part of its cost-benefit analysis. The CIO requests more information about this process, and Bodin explains that:<\/p><p><b>Statement 1:<\/b> Implementation costs relate to changes in economic decisions and behaviors.<\/p><p><b>Statement 2:<\/b> Unintended consequences may influence both implementation costs and indirect costs.<\/p><p><b>Statement 3:<\/b> The cost-benefit analysis is limited to the firms and industries directly affected by the proposed regulation.<\/p><p>Afterward, Esposito speaks about the country&#x27;s financial sector. She explains that its main regulatory body, the Financial Oversight Authority (FOA), was created by statute as an autonomous agency with rulemaking and enforcement powers but is not funded by the government. In addition, the Association of Commercial Banks (ACB), a private organization, establishes and enforces rules and standards in the financial industry. ACB does not derive its authority from legislation or from a government body, but exclusively from its members, who include most of the country&#x27;s financial institutions.<\/p><p>She adds that the financial industry is highly concentrated, with three major banks holding more than 70% of the assets of the financial system. In the previous year, a small bank suffered a bank run after considerable trading losses, and FOA intervened by forcing creditors and depositors to cancel their claims in exchange for shares of the bank.<\/p><p>As a resul ysis. The CIO requests more information about this process, and Bodin explains that:<\/p><p><b>Statement 1:<\/b> Implementation costs relate to changes in economic decisions and behaviors.<\/p><p><b>Statement 2:<\/b> Unintended consequences may influence both implementation costs and indirect costs.<\/p><p><b>Statement 3:<\/b> The cost-benefit analysis is limited to the firms and industries directly affected by the proposed regulation.<\/p><p>Afterward, Esposito speaks about the country&#x27;s financial sector. She explains that its main regulatory body, the Financial Oversight Authority (FOA), was created by statute as an autonomous agency with rulemaking and enforcement powers but is not funded by the government. In addition, the Association of Commercial Banks (ACB), a private organization, establishes and enforces rules and standards in the financial industry. ACB does not derive its authority from legislation or from a government body, but exclusively from its members, who include most of the country&#x27;s financial institutions.<\/p><p>She adds that the financial industry is highly concentrated, with three major banks holding more than 70% of the assets of the financial system. In the previous year, a small bank suffered a bank run after considerable trading losses, and FOA intervened by forcing creditors and depositors to cancel their claims in exchange for shares of the bank.<\/p><p>As a result, FOA is proposing stricter regulation of short sales and leveraged trading. FOA&#x27;s regulators must decide the best approach to conduct a cost-benefit analysis: an after-the-fact analysis or a regulatory sandbox approach.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is most likely an advantage of an after-the-fact analysis compared with a regulatory sandbox approach? The after-the-fact analysis:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q042.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":43,"q":"Based on Exhibit 1, relative to EUR, JPY is most likely:","opts":["trading at a forward premium.","quoted at negative forward points.","worth less in the forward market than in the spot market."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a043.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a043.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Economics<\/summary><div class=\"vig-body\"><p>Jerczy Walinski is a senior economist working for an international bank. He is responsible for analyzing currency markets to support the bank&#x27;s proprietary currency trading and the advisory services provided to bank clients. Sonya Sanchez is a newly hired junior economist assigned to assist Walinski.<\/p><p>Walinski asks Sanchez to assess the forward value of JPY compared with EUR using the exchange rate and interest rate data presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex010.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>The two economists discuss the implications of the international parity relationships and their use in forecasting future exchange rates. Walinski asks Sanchez to summarize the key aspects of the international Fisher relationship. In response, Sanchez notes two important implications of the international Fisher effect regarding the behavior of key economic variables across countries:<\/p><p><b>Implication 1:<\/b> Real interest rates should converge on the same level.<\/p><p><b>Implication 2:<\/b> Nominal interest rates should converge with expected inflation rates.<\/p><p>Walinski then asks Sanchez to evaluate the usefulness of the interest rate parity relationships regarding exchange rates. Sanchez makes two observations regarding currency market participants&#x27; views on the theories:<\/p><p>Observation 1:Covered interest rate parity accurately describes the relationship of the spot and forward exchange rates between two currencies and the interest rates in those currencies. Its validity is proven by the arbitrage trading that occurs anytime the spot/forward difference is inconsistent with interest rate difference.<\/p><p>Observation 2:Uncovered interest rate parity does not accurately capture the relationship of interest rate differences between currencies and expected changes in spot exchange rates. This is borne out by the frequent use of carry trades to earn higher returns by taking unhedged positions in high interest rate currencies.<\/p><p>Walinski and Sanchez analyze the economic outlook for two countries and their currency values relative to a global reserve currency. One of the countries is a large developed market (DM), the other a small emerging market (EM). Both countries have recently begun pursuing expansionary monetary policies to spur economic recoveries during a period of stagnant growth following a recent global slowdown. Both countries are also raising taxes and cutting government spending to prevent expansion of budget deficits. However, Walinski notes that capital mobility and other economic policies differ between the countries:<\/p><p>DM has well-developed financial markets and places no restriction on foreign ownership of domestic assets nor any restrictions on capital inflows or outflows. The country&#x27;s trade balance is usually at a small deficit relative to GDP. DM uses a free-floating-rate currency regime, its currency is fully convertible, and the central bank generally does not intervene in currency markets.<\/p><p>EM has much less developed financial markets, places restrictions on foreign ownership of domestic assets, and restricts both inflows and outflows of capital. The country usually has a sizeable trade surplus, though the size of the surplus has been very sensitive to the exchange value of its currency. DM is both the largest market for EM&#x27;s exports andthe largest source of its imports. Until recently, EM had a fixed-exchange-rate regime, maintaining a specified parity to DM&#x27;s currency. EM has recently introduced a crawling peg intending to manage the value of its currency relative to DM&#x27;s in line with any difference in inflation between the two currencies. DM is also considering easing restrictions on capital inflows to enable increased foreign investment as a tool to spur domestic growth.<\/p><p>Walinski asks Sanchez to identify factors that may indicate an increased possibility of a currency crisis for EM.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, relative to EUR, JPY is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q043.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":44,"q":"Which of the implications cited by Sanchez is (are) correctly attributed to the international Fisher effect?","opts":["Implication 1 only","Implication 2 only","Both Implication 1 and Implication 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a044.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a044.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jerczy Walinski is a senior economist working for an international bank. He is responsible for analyzing currency markets to support the bank&#x27;s proprietary currency trading and the advisory services provided to bank clients. Sonya Sanchez is a newly hired junior economist assigned to assist Walinski.<\/p><p>Walinski asks Sanchez to a sionary monetary policies to spur economic recoveries during a period of stagnant growth following a recent global slowdown. Both countries are also raising taxes and cutting government spending to prevent expansion of budget deficits. However, Walinski notes that capital mobility and other economic policies differ between the countries:<\/p><p>DM has well-developed financial markets and places no restriction on foreign ownership of domestic assets nor any restrictions on capital inflows or outflows. The country&#x27;s trade balance is usually at a small deficit relative to GDP. DM uses a free-floating-rate currency regime, its currency is fully convertible, and the central bank generally does not intervene in currency markets.<\/p><p>EM has much less developed financial markets, places restrictions on foreign ownership of domestic assets, and restricts both inflows and outflows of capital. The country usually has a sizeable trade surplus, though the size of the surplus has been very sensitive to the exchange value of its currency. DM is both the largest market for EM&#x27;s exports andthe largest source of its imports. Until recently, EM had a fixed-exchange-rate regime, maintaining a specified parity to DM&#x27;s currency. EM has recently introduced a crawling peg intending to manage the value of its currency relative to DM&#x27;s in line with any difference in inflation between the two currencies. DM is also considering easing restrictions on capital inflows to enable increased foreign investment as a tool to spur domestic growth.<\/p><p>Walinski asks Sanchez to identify factors that may indicate an increased possibility of a currency crisis for EM.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the implications cited by Sanchez is (are) correctly attributed to the international Fisher effect?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q044.webp\" alt=\"Câu hỏi gốc\"><\/details>","s z makes two observations regarding currency market participants&#x27; views on the theories:<\/p><p>Observation 1:Covered interest rate parity accurately describes the relationship of the spot and forward exchange rates between two currencies and the interest rates in those currencies. Its validity is proven by the arbitrage trading that occurs anytime the spot/forward difference is inconsistent with interest rate difference.<\/p><p>Observation 2:Uncovered interest rate parity does not accurately capture the relationship of interest rate differences between currencies and expected changes in spot exchange rates. This is borne out by the frequent use of carry trades to earn higher returns by taking unhedged positions in high interest rate currencies.<\/p><p>Walinski and Sanchez analyze the economic outlook for two countries and their currency values relative to a global reserve currency. One of the countries is a large developed market (DM), the other a small emerging market (EM). Both countries have recently begun pursuing expansionary monetary policies to spur economic recoveries during a period of stagnant growth following a recent global slowdown. Both countries are also raising taxes and cutting government spending to prevent expansion of budget deficits. However, Walinski notes that capital mobility and other economic policies differ between the countries:<\/p><p>DM has well-developed financial markets and places no restriction on foreign ownership of domestic assets nor any restrictions on capital inflows or outflows. The country&#x27;s trade balance is usually at a small deficit relative to GDP. DM uses a free-floating-rate currency regime, its currency is fully convertible, and the central bank generally does not intervene in currency markets.<\/p><p>EM has much less developed financial markets, places restrictions on foreign ownership of domestic assets, and restricts both inflows and outflows of capital. The country usually has a sizeable trade surplus, though the size of the surplus has been very sensitive to the exchange value of its currency. DM is both the largest market for EM&#x27;s exports andthe largest source of its imports. Until recently, EM had a fixed-exchange-rate regime, maintaining a specified parity to DM&#x27;s currency. EM has recently introduced a crawling peg intending to manage the value of its currency relative to DM&#x27;s in line with any difference in inflation between the two currencies. DM is also considering easing restrictions on capital inflows to enable increased foreign investment as a tool to spur domestic growth.<\/p><p>Walinski asks Sanchez to identify factors that may indicate an increased possibility of a currency crisis for EM.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the observations made by Sanchez regarding covered and uncovered interest rate party is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q045.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":46,"q":"Based on the Mundell-Fleming model, relative to a global reserve currency, which currency(ies) will most likely depreciate?","opts":["DM's currency only","EM's currency only","Both DM's currency and EM's currency"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a046.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a046.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jerczy Walinski is a senior economist working for an international bank. He is responsible for analyzing currency markets to support the bank&#x27;s proprietary currency trading and the advisory services provided to bank clients. Sonya S rictions on foreign ownership of domestic assets, and restricts both inflows and outflows of capital. The country usually has a sizeable trade surplus, though the size of the surplus has been very sensitive to the exchange value of its currency. DM is both the largest market for EM&#x27;s exports andthe largest source of its imports. Until recently, EM had a fixed-exchange-rate regime, maintaining a specified parity to DM&#x27;s currency. EM has recently introduced a crawling peg intending to manage the value of its currency relative to DM&#x27;s in line with any difference in inflation between the two currencies. DM is also considering easing restrictions on capital inflows to enable increased foreign investment as a tool to spur domestic growth.<\/p><p>Walinski asks Sanchez to identify factors that may indicate an increased possibility of a currency crisis for EM.<\/p><\/div><\/details><div class=\"qtext\"><p>If EM policymakers reduce the restrictions on capital inflows, which of the following could become a disadvantage?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q047.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":48,"q":"If EM policymakers maintain restrictions on capital inflows, which of the following factors should Sanchez most appropriately identify as increasing the probability of a currency crisis for EM?","opts":["Having a persistent trade imbalance","Failing to liberalize restrictions on capital flows","Establishing a floating peg against DM's currency"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a048.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a048.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Economics<span class=\"vig-hint\">bấm để x nt use of carry trades to earn higher returns by taking unhedged positions in high interest rate currencies.<\/p><p>Walinski and Sanchez analyze the economic outlook for two countries and their currency values relative to a global reserve currency. One of the countries is a large developed market (DM), the other a small emerging market (EM). Both countries have recently begun pursuing expansionary monetary policies to spur economic recoveries during a period of stagnant growth following a recent global slowdown. Both countries are also raising taxes and cutting government spending to prevent expansion of budget deficits. However, Walinski notes that capital mobility and other economic policies differ between the countries:<\/p><p>DM has well-developed financial markets and places no restriction on foreign ownership of domestic assets nor any restrictions on capital inflows or outflows. The country&#x27;s trade balance is usually at a small deficit relative to GDP. DM uses a free-floating-rate currency regime, its currency is fully convertible, and the central bank generally does not intervene in currency markets.<\/p><p>EM has much less developed financial markets, places restrictions on foreign ownership of domestic assets, and restricts both inflows and outflows of capital. The country usually has a sizeable trade surplus, though the size of the surplus has been very sensitive to the exchange value of its currency. DM is both the largest market for EM&#x27;s exports andthe largest source of its imports. Until recently, EM had a fixed-exchange-rate regime, maintaining a specified parity to DM&#x27;s currency. EM has recently introduced a crawling peg intending to manage the value of its currency relative to DM&#x27;s in line with any difference in inflation between the two currencies. DM is also considering easing restrictions on capital inflows to enable increased foreign investment as a tool to spur domestic growth.<\/p><p>Walinski asks Sanchez to identify factors that may indicate an increased possibility of a currency crisis for EM.<\/p><\/div><\/details><div class=\"qtext\"><p>If EM policymakers maintain restrictions on capital inflows, which of the following factors should Sanchez most appropriately identify as increasing the probability of a currency crisis for EM?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q048.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":49,"q":"Based on Exhibit 1, the 180-day forward discount or premium on MN relative to INR is closest to:","opts":["-0.0281","-0.0019","0.0019"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a049.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a049.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 49–54 · Economics<\/summary><div class=\"vig-body\"><p>Sylvia Yang manages a team of currency analysts for an international bank. Abe Kim is applying for a position as a junior analyst on Yang&#x27;s team. During an interview, Yang asks Kim to discuss arbitrage pricing relationships and the international parity relationships that influence currency values.<\/p><p>To assess Kim&#x27;s familiarity with the relationship between spot and forward exchange rates, Yang asks Kim to determine the forward discount or premium of MXN relative to INR based on the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex011.webp\" style=\"max-width:min(100%,472px)\" alt=\"Exhibit\"><p>Yang then asks Kim to interpret the implications reflected in the spot and forward rate quotes for CHF/EUR shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex012.webp\" style=\"max-width:min(100%,611px)\" alt=\"Exhibit\"><p>Yang follows up by asking Kim to describe and evaluate international parity relationships. During the discussion, Kim makes the following statements regarding different versions of purchasing power parity (PPP):<\/p><p><b>Statement 1:<\/b> In the long run, currency exchange rates tend to move toward values implied by absolute PPP.<\/p><p><b>Statement 2:<\/b> Under relative PPP, spot exchange rate changes are completely determined by differences in actual inflation, whereas under ex-ante PPP, expected spot exchange rate changes are based on differences in expected inflation.<\/p><p>Yang wants to assess Kim&#x27;s understanding of arbitrage pricing. She shows him Currency Dealer Z&#x27;s quotes (Exhibit 3) and asks him to determine the potential arbitrage profit from investing EUR 1 million if Dealer X quotes NOK/EUR at 9.6200/9.6530.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex013.webp\" style=\"max-width:min(100%,455px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the 180-day forward discount or premium on MN relative to INR is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q049.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":50,"q":"Based on the forward point quotes in Exhibit 2, Kim's most appropriate conclusion is that CHF:","opts":["interest rates are negative.","is expected to depreciate relative to EUR.","is trading at a forward premium relative to EUR."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a050.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a050.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 49–54 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sylvia Y l inflation, whereas under ex-ante PPP, expected spot exchange rate changes are based on differences in expected inflation.<\/p><p>Yang wants to assess Kim&#x27;s understanding of arbitrage pricing. She shows him Currency Dealer Z&#x27;s quotes (Exhibit 3) and asks him to determine the potential arbitrage profit from investing EUR 1 million if Dealer X quotes NOK/EUR at 9.6200/9.6530.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex013.webp\" style=\"max-width:min(100%,455px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>If traders can earn an arbitrage profit, which of the following parity relationships has most likely been violated?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q053.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":54,"q":"Based on Exhibit 3 and Dealer X's quote, the profit from investing EUR 1 million in a triangular arbitrage is closest to:","opts":["EUR 627","EUR 1,093","EUR 5,549"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a054.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a054.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 49–54 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sylvia Yang manages a team of currency analysts for an international bank. Abe Kim is applying for a position as a junior analyst on Yang&#x27;s team. During an interview, Yang asks Kim to discuss arbitrage pricing relationships and the international parity relationships that influence currency values.<\/p><p>To assess Kim&#x27;s familiarity with the relationship between spot and forward exchange rates, Yang asks Kim to determine the forward discount or premium of MXN relative to INR based on tml":"<a href=\"l2img/uw-econ/a055.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a055.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–60 · Economics<\/summary><div class=\"vig-body\"><p>Lucas Evans is an independent economic consultant. Two economic ministers from different developing countries have asked to meet with him to discuss their countries&#x27; economic growth prospects. Evans first meets with Lena Kowalczyk of Country 1.<\/p><p>Country 1 has significant natural resources. Despite an increase in exports of its natural resources and the installation of economic institutions necessary for growth, Country 1&#x27;s GDP growth has been sluggish. After reviewing data about Country 1&#x27;s economy, Evans suggests the slow growth stems from the Dutch disease, since that would explain the following factors demonstrated by Country 1&#x27;s economy:<\/p><p><b>Factor 1:<\/b> Persistently strong currency growth leading to a weakening manufacturing sector<\/p><p><b>Factor 2:<\/b> Additional regulations to disincentivize the entrance of new domestic competitors<\/p><p><b>Factor 3:<\/b> Accelerating population growth as per capita income rises above subsistence income, causing labor productivity to fall<\/p><p>Kowalczyk explains that Country 1&#x27;s government is planning additional reforms to improve growth and asks Evans to review the options:<\/p><p><b>Option 1:<\/b> Encourage lenders to improve screening of those seeking investment funding<\/p><p><b>Option 2:<\/b> Limit foreign investment so domestic investors receive capital gains<\/p><p><b>Option 3:<\/b> Promote greater domestic consumption in lieu of saving<\/p><p>After reviewing the options, Evans points out that Country 1&#x27;s R&amp;D spending is below that of its peers. He suggests providing subsidies and tax breaks for private companies to fund R&amp;D investment.<\/p><p>Evans then meets with Alejandro Guerrero of Country 2, which is a developing country with a low capital-per-worker ratio. Guerrero presents the following data about Country 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-econ/ex014.webp\" style=\"max-width:min(100%,419px)\" alt=\"Exhibit\"><p>Country 2 is planning to close its borders and restrict immigration to improve the employment rate for its citizens. The country also plans to subsidize part-time labor for companies to encourage the hiring of more workers who do not have time for full-time work.<\/p><p>Evans notes that Country 2 can also improve growth by adjusting its trade policies with other countries.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming it can be explained by the Dutch disease, and based on Evans&#x27;s comments, Country 1&#x27;s sluggish GDP growth is best explained by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-econ/q055.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":56,"q":"To improve Country 1's growth, which of the following reforms will most likely be effective?","opts":["Option 1","Option 2","Option 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-econ/a056.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-econ/a056.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–60 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lucas Evans is an independent economic consultant. Two economic ministers from different developing countries have asked to meet with him to discuss their countries&#x27; economic growth prospects. Evans first meets with Lena Kowalczyk of Country 1.<\/p><p>Country 1 has significant natural const CFG = {"title": "UWorld — Economics", "subtitle": "CFA Level II · 60 câu · UWorld item sets", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);

}
