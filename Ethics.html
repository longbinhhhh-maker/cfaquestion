<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Which of the following statements most likely reflects one of the six components of the\nCFA Code of Ethics? Candidates must:","opts":["place the integrity of the investment profession above their own interests.","promote the viability of the global capital markets for their employer's benefit.","ignore unprofessional conduct displayed by others within the profession."],"ans":"A","expl":"A. Đúng vì Các chủ sở hữu và ứng viên CFA phải đặt tính chính trực của nghề đầu tư\nvà lợi ích của khách hàng lên trên lợi ích cá nhân của chính họ.\nB. Không chính xác vì Các chủ sở hữu và ứng viên CFA phải thúc đẩy tính toàn vẹn và khả năng tồn tại của\nthị trường vốn toàn cầu vì lợi ích cuối cùng của xã hội.\nC. Không chính xác vì Các chủ sở hữu và ứng viên phải thực hành và khuyến khích những người khác tham gia một\nmột cách chuyên nghiệp và có đạo đức để phản ánh uy tín của bản thân và nghề nghiệp. Bằng cách\nbỏ qua hành vi thiếu chuyên nghiệp của người khác, một thành viên hoặc ứng viên không khuyến khích người khác\ncư xử theo cách phản ánh tốt về nghề nghiệp\nTiêu chuẩn đạo đức và nghề nghiệp: xác định sáu thành phần của Quy tắc đạo đức và bảy\nTiêu chuẩn ứng xử chuyên nghiệp","qhtml":null},{"n":2,"q":"A profession is most likely described as a group of people that:","opts":["has a common level of basic knowledge about a particular subject.","monitors its members based on an agreed-oncode of ethics.","puts the interests of its members first."],"ans":"B","expl":"A. Không chính xác vì Nghề nghiệp dựa trên kiến ​​thức và kỹ năng chuyên môn chứ không phải kiến ​​thức cơ bản.\nB. Đúng vì Một nghề được thực hiện bởi các thành viên chia sẻ và đồng ý tuân theo một quy tắc đạo đức chung\nvà nghề này dựa trên kiến ​​thức, kỹ năng chuyên môn và dịch vụ dành cho người khác.\nC. Không chính xác vì Một nghề nghiệp dựa trên sự phục vụ cho những người khác, điều đó có thể không nhất thiết có nghĩa là lợi ích\ncủa các thành viên là ưu tiên hàng đầu.\nTiêu chuẩn đạo đức và nghề nghiệp: mô tả vai trò của quy tắc đạo đức trong việc xác định nghề nghiệp","qhtml":null},{"n":3,"q":"Most societies would least likely consider ethical principles to include:","opts":["justice.","duplicity.","diligence."],"ans":"B","expl":"A. Không chính xác vì Công lý thường được coi là nguyên tắc đạo đức trong hầu hết các xã hội.\nB. Đúng vì Hầu hết các xã hội đều thừa nhận các nguyên tắc đạo đức về sự trung thực, công bằng hoặc công lý,\nsự siêng năng và tôn trọng quyền của người khác. Sự trùng lặp hoặc lừa dối sẽ vi phạm hầu hết\nnguyên tắc đạo đức\nC. Không chính xác vì Dingence thường được coi là một nguyên tắc đạo đức trong hầu hết các xã hội\nTiêu chuẩn đạo đức và nghề nghiệp: giải thích đạo đức","qhtml":null},{"n":4,"q":"Tibor Figeczky, CFA, is an equity trader at Global Investment Bank (GB). Figeczky traded the\nbank's investment portfolio profitably for the past three years and earned significant bonuses\nfor his efforts. Subsequently, internal auditors of GB formally accused Figeczky of exceeding\nhis trading authority and engaging in unauthorized trades. According to the CFA Institute\nCode of Ethics and Standards of Professional Conduct, Figeczky should most likely","opts":["disclose the complaint to CFA Institute.","refuse further bonuses until the issue is resolved.","request a temporary suspension of his CFA Institute membership."],"ans":"A","expl":"A. Đúng vì là các thành viên và ứng viên phải tự tiết lộ trong Tuyên bố về Ứng xử Chuyên nghiệp hàng năm\ntất cả các vấn đề liên quan đến hành vi chuyên môn của họ, chẳng hạn như liên quan đến kiện tụng dân sự\nhoặc điều tra hình sự hoặc là đối tượng của đơn khiếu nại bằng văn bản\nB. Không chính xác vì Quy tắc và Tiêu chuẩn không cấm thành viên nhận tiền thưởng trong khi\nđiều tra về hành vi nghề nghiệp của thành viên đó được tiến hành. Trong trường hợp này, hành động của thành viên\nđã bị nghi vấn nhưng anh ta vẫn chưa có cơ hội để bảo vệ hành vi của mình và trên thực tế có thể\nđã hành động trong thẩm quyền của mình và nhận được khoản bồi thường khá công bằng\nC. Không chính xác vì Bộ quy tắc không yêu cầu thành viên yêu cầu đình chỉ tư cách thành viên\ntrong khi khiếu nại đang được điều tra.\nTiêu chuẩn đạo đức và nghề nghiệp: giải thích trách nhiệm đạo đức mà Bộ quy tắc và\nTiêu chuẩn yêu cầu, bao gồm các phần phụ của mỗi Tiêu chuẩn","qhtml":null},{"n":5,"q":"Lisa Hajak, CFA, specialized in research on real estate companies at Cornerstone Country\nBank for the past twenty years. Hajak recently started her own investment research firm,\nHajak Investment Advisory. One of her former clients at Cornerstone asks Hajak to update a\nresearch report she wrote on a real estate company when she was at Cornerstone. Hajak\nupdates the report, which she had copied to her personal computer without the bank's\nknowledge, and replaces references to the bank with her new firm, Hajak Investment\nAdvisory. Hajak also incorporates the conclusions of a real estate study conducted by the\nRealtors Association that appeared in the Wall Street Journal. She references the Journal as\nher source in her report. She provides the revised report free of charge along with a cover\nletter for the bank's client to become a client of her firm. Concerning the reissued research\nreport, Hajak least likely violated the CFA Institute Standards of Professional Conduct because\nshe:","opts":["solicited the bank's client.","did not obtain consent to use the bank report.","did not cite the actual source of the real estate study."],"ans":"A","expl":"A. Đúng vì là việc gạ gẫm khách hàng của ngân hàng không vi phạm Tiêu chuẩn IV(A)-Lòng trung thành vì người quản lý\nkhông còn là nhân viên của ngân hàng và không có dấu hiệu nào cho thấy cô ấy đã lấy được thông tin khách hàng\ntừ các nguồn ngân hàng. Tuy nhiên, thành viên này đã vi phạm Tiêu chuẩn V(C)-Lưu giữ hồ sơ, bởi vì\nkhi cô ấy rời ngân hàng, cô ấy đã lấy tài sản của ngân hàng mà không có sự cho phép rõ ràng để làm như vậy. Ngoài ra,\n, nhà phân tích đã vi phạm Tiêu chuẩn (C)- Trình bày sai bằng cách tạo tài liệu nghiên cứu\nmà không ghi công. Điều này được chứng minh khi người quản lý thêm vào báo cáo mới một nghiên cứu về bất động sản\nmà cô ấy thấy trên Wall Street Journal, chỉ tham khảo Tạp chí. Trong mọi trường hợp, thành viên hoặc\nứng viên phải trích dẫn nguồn thông tin thực tế. Nếu cô ấy không nhận được báo cáo và\nxem xét thông tin, người quản lý có nguy cơ dựa vào thông tin cũ và có thể\nsai sự thật. Cách tốt nhất là lấy nghiên cứu hoàn chỉnh từ tác giả ban đầu\nvà chỉ trích dẫn tác giả đó hoặc sử dụng thông tin do bên trung gian cung cấp và trích dẫn cả hai\nnguồn.\nB. Không chính xác vì theo Tiêu chuẩn V(C)-Lưu giữ hồ sơ, khi một thành viên hoặc ứng viên\nrời công ty để tìm việc làm khác, thành viên hoặc ứng viên đó không thể mang tài sản của\ncông ty, bao gồm bản gốc hoặc bản sao hồ sơ hỗ trợ về công việc của thành viên hoặc ứng viên cho nhà tuyển dụng\nmới mà không có sự đồng ý rõ ràng của nhà tuyển dụng trước đó.\nC. Không chính xác vì nhà phân tích đã vi phạm Tiêu chuẩn I(C)-Trình bày sai bằng cách tạo tài liệu nghiên cứu\nmà không ghi công, điều này được chứng minh khi người quản lý thêm vào báo cáo mới một\nnghiên cứu bất động sản mà cô ấy thấy trên Wall Street Journal, chỉ tham khảo Tạp chí. Trong mọi trường hợp,\nthành viên hoặc ứng viên phải trích dẫn nguồn thông tin thực tế. Nếu cô ấy không nhận được\nbáo cáo và xem xét thông tin, người quản lý có nguy cơ dựa vào thông tin cũ\ncó thể đưa ra thông tin sai sự thật: Cách tốt nhất là lấy nghiên cứu đầy đủ từ tác giả\nban đầu và chỉ trích dẫn tác giả đó hoặc sử dụng thông tin do bên trung gian cung cấp và trích dẫn\ncả hai nguồn.\nĐạo đức và chuyên nghiệp Tiêu chuẩn: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":6,"q":"Dennis Kim, CFA, works at Century Growth Partners (CGP) where he manages an\ninvestment account for his client Amelia Frost. Frost tells Kim to invest one percent of her\nportfolio in biotech stocks. Kim believes such an investment is inconsistent with Frost's\ninvestment policy statement. CGP has no policy regarding execution of unsolicited trading\nrequests. Kim discusses his concerns with Frost, but she does not change her instruction.\nWithout amending Frost's investment policy statement, Kim executes the trade afterward.\nHas Kim violated the Standards?","opts":["No","Yes, because Kim executes an unsuitable trade for Frost","Yes , because Kim does not change Frost's investment policy statement before executing the trade"],"ans":"A","expl":"A. Đúng vì (1) Kim thảo luận về mối quan ngại của mình với Frost trước khi thực hiện giao dịch, (2) Frost\nthừa nhận cuộc thảo luận này và chấp nhận các điều kiện không phù hợp. (3) Công ty của Kim không\nyêu cầu phê duyệt đối với các giao dịch không phù hợp vì công ty không có chính sách về chủ đề này và (4) yêu cầu này\nkhông có tác động đáng kể đến danh mục đầu tư của Frost vì nó chỉ chiếm 1% giá trị của nó,\ndo đó không cần sửa đổi IPS. Theo Tiêu chuẩn III(C), Tính phù hợp, trong trường hợp\nyêu cầu giao dịch không được yêu cầu mà thành viên hoặc ứng viên biết là không phù hợp với khách hàng,\nthành viên hoặc ứng viên không nên thực hiện giao dịch cho đến khi họ thảo luận\ncác mối quan ngại với khách hàng. Sau cuộc thảo luận, thành viên hoặc ứng viên có thể tuân theo các chính sách của công ty mình hoặc\nliên quan đến sự chấp thuận cần thiết của khách hàng để thực hiện các giao dịch không phù hợp. Ở mức tối thiểu\n, khách hàng phải thừa nhận cuộc thảo luận và chấp nhận các điều kiện khiến cho\nđề xuất không phù hợp. Nếu dự kiến ​​yêu cầu không được yêu cầu sẽ có tác động sai trái\nđến danh mục đầu tư, thành viên hoặc ứng viên nên tận dụng cơ hội này để cập nhật tuyên bố chính sách đầu tư\n.\nB. Không chính xác vì theo Tiêu chuẩn III(C), Tính phù hợp, các thành viên có thể thực hiện\ngiao dịch gian lận tổng cộng trong một số điều kiện nhất định mà Kim đáp ứng, như được mô tả trong cơ sở phản hồi\nđể có câu trả lời đúng.\nC. Không chính xác vì theo Tiêu chuẩn III(C) Tính phù hợp, Kim không bắt buộc phải cập nhật IPS của Frost\nvì quy mô giao dịch là không quan trọng, như được mô tả trong phần cơ sở phản hồi cho câu trả lời đúng\nTiêu chuẩn đạo đức và nghề nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":7,"q":"Which of the following and care? Members should: is a recommended procedure for\ncompliance with the Standard relating to loyalty, prudence,","opts":["eliminate all actual and potential conflicts of interest.","make their clients aware of all forms of manager compensation.","submit to each client, at least annually, an itemized statement showing the funds and securities in custody."],"ans":"B","expl":"A. Không chính xác vì quy trình được đề xuất cho Tiêu chuẩn III (A). Lòng trung thành, Thận trọng và Cẩn trọng là\ncác thành viên và ứng viên phải tiết lộ tất cả các xung đột lợi ích thực tế và tiềm ẩn để khách hàng\ncó thể đánh giá những xung đột đó. Họ không cần phải loại bỏ tất cả các xung đột thực tế và tiềm ẩn về\nlợi ích.\nB. Đúng vì quy trình được đề xuất cho Tiêu chuẩn III (A), Lòng trung thành, Sự thận trọng và Sự quan tâm là\ncác thành viên và ứng viên nên thông báo cho khách hàng của mình biết về tất cả các hình thức thù lao của người quản lý.\nC. Không chính xác vì quy trình được đề xuất cho Tiêu chuẩn III (A), Lòng trung thành, Thận trọng và Cẩn trọng là\nthành viên và ứng viên có quyền kiểm soát tài sản của khách hàng (1) phải gửi cho mỗi khách hàng, ít nhất\nhàng quý, một bản kê khai từng khoản cho thấy số tiền và chứng khoán đang được lưu giữ.\nthủ tục được khuyến nghị là gửi báo cáo từng khoản ít nhất hàng quý, không phải hàng năm cho khách hàng.\nTiêu chuẩn đạo đức và chuyên nghiệp: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":8,"q":"According to the Standards, a member who is asked to produce an issuer-paid research\nreport is required to:","opts":["avoid cash compensation.","disclose the nature of their compensation in the report.","decline to write the report if the member's firm provides investment banking services to the issuer."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn I (B), Tính độc lập và khách quan, tác giả của nghiên cứu được trả tiền của nhà phát hành-\ncó thể chấp nhận bồi thường bằng tiền mặt nhưng cần tránh khoản bồi thường có thể ảnh hưởng đến\nnghiên cứu của mình, chẳng hạn như vốn chủ sở hữu. Các nhà phân tích độc lập cũng phải hạn chế nghiêm ngặt loại thù lao\nmà họ chấp nhận khi thực hiện nghiên cứu do nhà phát hành trả tiền. Nếu không, nội dung và kết luận của các báo cáo\ncó thể được xác định hoặc bị ảnh hưởng bởi khoản bồi thường từ các công ty tài trợ\n. Khoản bồi thường có thể ảnh hưởng đến báo cáo nghiên cứu có thể là trực tiếp, chẳng hạn như\nthanh toán dựa trên kết luận của báo cáo hoặc gián tiếp, chẳng hạn như chứng quyền chứng khoán hoặc các công cụ vốn chủ sở hữu\ncó thể tăng giá trị trên cơ sở đưa tin tích cực trong báo cáo.\nB. Đúng vì theo Tiêu chuẩn I (B), Độc lập và Khách quan, các thành viên được yêu cầu\ntiết lộ khoản thù lao của mình. Các thành viên và ứng viên phải tuân thủ các tiêu chuẩn ứng xử nghiêm ngặt\nchi phối cách thức tiến hành nghiên cứu và những thông tin phải tiết lộ trong báo cáo.\nCác nhà phân tích phải tham gia phân tích kỹ lưỡng, độc lập và không thiên vị, đồng thời phải tiết lộ đầy đủ\ncác xung đột lợi ích tiềm ẩn, bao gồm cả bản chất của khoản thù lao của họ.\nC. Không chính xác vì theo Tiêu chuẩn I (B), Độc lập và Khách quan, các thành viên không bắt buộc\ntừ chối viết báo cáo nếu công ty của họ cung cấp dịch vụ ngân hàng đầu tư cho công ty\n. Các thành viên và ứng cử viên phải tuân thủ các tiêu chuẩn ứng xử nghiêm ngặt chi phối cách thức tiến hành nghiên cứu\n và những thông tin nào phải được tiết lộ trong báo cáo. Các nhà phân tích phải tham gia\nvào quá trình phân tích kỹ lưỡng, độc lập và không thiên vị, đồng thời phải tiết lộ đầy đủ những xung đột lợi ích tiềm ẩn\n. Vì vậy, các thành viên không cần phải từ chối viết báo cáo nếu có xung đột lợi ích tiềm ẩn\n(chẳng hạn như công ty của họ cung cấp dịch vụ ngân hàng đầu tư), mặc dù họ cần tiết lộ\ncác xung đột đó.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":9,"q":"Ann Jules, CFA, discovered that her employer, Plutus Investments Inc. (PII), inflates\ninvestment performance in PII's marketing brochure. In accordance with firm policy, Jules\nuses PII's marketing brochure to present to prospective clients. In addition, Jules emails stock\nrecommendations to her clients in capsule form and offers additional information only upon\nrequest. Jules has most likely violated the Standards:","opts":["by emailing stock recommendations to her clients in capsule form.","only by using Pil's marketing brochure to present to prospective clients.","both by emailing stock recommendations to her clients in capsule form and by using PII's marketing brochure to present to prospective clients."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn V(B), Giao tiếp với Khách hàng và Khách hàng\nTiềm năng, nếu đề xuất được chứa ở dạng viên nang (chẳng hạn như danh sách cổ phiếu được đề xuất),\ncác thành viên và ứng viên phải thông báo cho khách hàng rằng thông tin và phân tích bổ sung có sẵn\ntừ nhà sản xuất báo cáo. Julies đã không vi phạm Tiêu chuẩn bằng cách gửi email các đề xuất về kho\ncho khách hàng của cô ấy ở dạng viên nang vì anh ấy cung cấp thông tin bổ sung theo\nyêu cầu\nB. Đúng vì theo Tiêu chuẩn I(C). Các thành viên và Ứng viên trình bày sai không được\ncố ý đưa ra bất kỳ thông tin sai lệch nào liên quan đến các khuyến nghị, hành động phân tích đầu tư,\nhoặc các hoạt động nghề nghiệp khác. Bằng cách sử dụng tài liệu tiếp thị của Pil nhằm nâng cao hiệu suất để\nhiển thị cho khách hàng tiềm năng, Jules đã vi phạm Tiêu chuẩn I(C).\nC. Không chính xác vì theo Tiêu chuẩn V(B), Giao tiếp với Khách hàng và Khách hàng\nTiềm năng, nếu đề xuất được chứa ở dạng viên nang (chẳng hạn như danh sách cổ phiếu được đề xuất),\ncác thành viên và ứng viên phải thông báo cho khách hàng rằng thông tin và phân tích bổ sung có sẵn\ntừ nhà sản xuất báo cáo. Julies đã không vi phạm Tiêu chuẩn bằng cách gửi email\ncác khuyến nghị về hàng hóa cho khách hàng của cô ấy dưới dạng viên nang vì anh ấy cung cấp thông tin bổ sung theo\nyêu cầu.\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn.","qhtml":null},{"n":10,"q":"Maria Jennings, CFA, overhears the CEO of United Retail saying that the quarterly report\nto be released next week will miss analysts' expectations. Jennings immediately calls her\nbrother who owns the stock to tell him what she overheard. One week later, Jennings writes\na report on another company, KTD retail. She uses public and nonmaterial nonpublic\ninformation for her analysis to issue a \"buy\" recommendation. Has Jennings most likely\nviolated the Standards?","opts":["No","Yes, by calling her brother to tell him what she overheard","Yes, by using public and nonmaterial nonpublic information for her analysis to issue a \"buy\" recommendation"],"ans":"B","expl":"A. Không chính xác vì Jennings đã vi phạm Tiêu chuẩn II (A), Thông tin quan trọng không công khai, bằng cách chia sẻ\nnhững gì cô ấy tình cờ nghe được từ Giám đốc điều hành United Retail với chị gái mình, như được mô tả trong phần cơ sở phản hồi\nđể có câu trả lời đúng.\nB. Đúng vì theo Tiêu chuẩn II (A), Thông tin quan trọng không công khai, Thành viên và\nỨng viên sở hữu thông tin quan trọng không công khai có thể ảnh hưởng đến giá trị của khoản đầu tư\nkhông được hành động hoặc khiến người khác hành động dựa trên thông tin đó. Ngoài ra, la hình thành là \"vật chất\" nếu nó\nviệc tiết lộ có thể có tác động đến giá chứng khoán hoặc nếu các nhà đầu tư hợp lý sẽ\nmuốn biết thông tin trước khi đưa ra quyết định đầu tư chẳng hạn như kết quả của một\nbáo cáo hàng quý sắp tới từ một nguồn đáng tin cậy (Giám đốc điều hành), Jennings đã thúc giục em gái mình hành động\ndo đó nó đã vi phạm Tiêu chuẩn.\nC. Không chính xác vì theo Tiêu chuẩn II (A) Thông tin quan trọng không công khai. Nhà phân tích có thể\nsử dụng các kết luận quan trọng rút ra từ việc phân tích các tài liệu công và phi vật chất, phi công\nThông tin làm cơ sở cho các khuyến nghị và quyết định đầu tư ngay cả khi những kết luận đó\nsẽ là thông tin nội bộ quan trọng nếu chúng được truyền đạt trực tiếp tới nhà phân tích bởi\nmột công ty. Theo \"lý thuyết khảm\", các nhà phân tích tài chính được tự do hành động trên bộ sưu tập này, hoặc khảm,\nthông tin mà không có nguy cơ vi phạm. Trong trường hợp này, Jennings sử dụng công khai và vật chất không công khai\nthông tin để đạt được khuyến nghị của cô ấy, không vi phạm.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":11,"q":"According to the Standards, which of the following is most likely considered material\nnonpublic information?","opts":["The recent execution of a large buy order from a hedge fund.","Significant legal challenges revealed at an internal meeting of the company's management.","Recent increases in a company's board remuneration discussed at the annual general meeting."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn II(A) Thông tin quan trọng không công khai, thông tin\nliên quan đến các lệnh trước khi thực hiện có thể là quan trọng nhưng không phải sau khi thực hiện. Thông tin quan trọng\ncó thể bao gồm nhưng không giới hạn ở thông tin sau: lệnh cho các giao dịch lớn trước khi chúng\nđược thực thi.\nB. Đúng vì theo Tiêu chuẩn II(A) Thông tin quan trọng không công khai, thông tin quan trọng\ncó thể bao gồm nhưng không giới hạn ở thông tin về những vấn đề sau: tranh chấp pháp lý quan trọng.\nC. Không chính xác vì theo Tiêu chuẩn II(A) Thông tin quan trọng không công khai, thông tin\nđược thảo luận tại cuộc họp chung thường niên không phải là không công khai vì thông tin được phổ biến rộng rãi.\nThông tin là 'không công khai' cho đến khi nó được phổ biến hoặc có sẵn trên thị trường nói chung\n(ngược lại với một nhóm nhà đầu tư được chọn).\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc của Đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":12,"q":"According to the Standard relating to fair dealing, when members disseminate\ninvestment recommendations, they are most likely required to make every effort to treat\nindividual clients in a(n):","opts":["fair and equal manner.","fair and impartial manner.","equal and impartial manner."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn III (B), Giao dịch công bằng, thành viên phải đối xử với tất cả\nkhách hàng một cách công bằng và vô tư, không nhất thiết phải theo cách bình đẳng, như được mô tả trong phản hồi\ncăn cứ để có câu trả lời đúng.\nB. Đúng vì Sửa tất cả vì theo Tiêu chuẩn III (B), Giao dịch công bằng, các thành viên và ứng viên phải\nnỗ lực hết sức để đối xử với tất cả các khách hàng cá nhân và tổ chức một cách công bằng và vô tư.\nNgoài ra, thuật ngữ 'công bằng' ngụ ý rằng thành viên hoặc ứng cử viên phải cẩn thận để không\nphân biệt đối xử với bất kỳ khách hàng nào khi phổ biến các khuyến nghị đầu tư hoặc thực hiện\nhành động đầu tư. Tiêu chuẩn III(B) không quy định 'bình đẳng' vì các thành viên và ứng viên có thể\nkhông thể tiếp cận tất cả khách hàng cùng một lúc..\nC. Không chính xác vì theo Tiêu chuẩn III (B), Giao dịch công bằng, thành viên phải đối xử với tất cả\nkhách hàng một cách công bằng và vô tư, không nhất thiết phải theo cách bình đẳng, như được mô tả trong phản hồi\ncăn cứ để có câu trả lời đúng.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":13,"q":"According to the recommended procedure for compliance with the Standard relating to\nfair dealing, a member who works in a large firm should:","opts":["offer different levels of service to clients selectively based on the clients' investment needs.","disclose to clients and prospective clients how she selects accounts to participate in an order.","inform all firm staff of the content of upcoming investment recommendations to assure that all clients' investment needs are met."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn III (B), Giao dịch công bằng, các Thành viên và ứng viên phải\ntiết lộ cho tất cả khách hàng xem tổ chức có cung cấp các cấp độ dịch vụ khác nhau cho khách hàng với cùng một mức phí hay các mức phí khác nhau hay không. Không nên cung cấp các cấp độ dịch vụ khác nhau cho khách hàng một cách có chọn lọc.\nB. Đúng vì theo Tiêu chuẩn III (B), Giao dịch công bằng, Thành viên và ứng viên phải\ntiết lộ cho khách hàng và khách hàng tiềm năng cách họ chọn tài khoản để tham gia đặt hàng.\nC. Không chính xác vì các Thành viên và ứng viên nên thực hiện những nỗ lực hợp lý để hạn chế số lượng\nnhững người được biết thông tin về việc một khuyến nghị sắp được phổ biến. Tất cả nhân viên\nkhông nên được thông báo để tránh nguy cơ rò rỉ các khuyến nghị trước khi phổ biến.\nTiêu chuẩn đạo đức và chuyên nghiệp: khuyến nghị các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":14,"q":"Which of the following statements is accurate according to the Standards?\nStatement 1: A member, prior to leaving his current employer, may contact potential clients outside of normal working hours for purposes of soliciting their business for their new employer.\nStatement 2: A member, while still employed, is free to make arrangements to apply for a license with the local regulator to set up a competing business.","opts":["Statement 1 only.","Statement 2 only.","Both Statement 1 and Statement 2."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn IV(A), Lòng trung thành, một thành viên hoặc ứng viên đang\ndự định tìm việc làm khác không được liên hệ với khách hàng hiện tại hoặc khách hàng tiềm năng trước\nrời khỏi công ty của mình vì mục đích mời chào công việc kinh doanh của họ cho công ty mới.\nDo đó, Tuyên bố 1 không chính xác.\nB. Đúng vì theo Tiêu chuẩn IV(A), Lòng trung thành, nhân viên rời đi thường được tự do\nsắp xếp hoặc chuẩn bị để tham gia vào một doanh nghiệp cạnh tranh trước khi chấm dứt\nmối quan hệ với người sử dụng lao động của mình miễn là việc chuẩn bị đó không vi phạm nghĩa vụ trung thành\ncủa nhân viên. Ngoài ra, việc chuẩn bị của Allen [thành viên] cho công việc kinh doanh mới bằng cách đăng ký với\ncác cơ quan quản lý không xung đột với công việc của người chủ của cô ấy nếu việc chuẩn bị\nđược thực hiện trong thời gian riêng của Allen [thành viên] bên ngoài văn phòng và nếu Allen [thành viên] sẽ không\ngợi cầu khách hàng cho doanh nghiệp hoặc điều hành công ty mới cho đến khi cô ấy rời khỏi cô ấy\nchủ nhân hiện tại. Do đó, Tuyên bố 2 là chính xác.\nC. Không chính xác vì vì, như được mô tả trong phần giải thích cho câu trả lời đúng, chỉ Câu 2 là\nchính xác. Thành viên hoặc ứng viên đang dự định tìm kiếm công việc khác không được liên hệ với\nkhách hàng hiện tại hoặc khách hàng tiềm năng trước khi rời khỏi công ty của mình vì mục đích thu hút\nkinh doanh của họ cho công ty mới. Do đó, Tuyên bố 1 không chính xác.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":"<p>Which of the following statements is accurate according to the Standards?</p><p><strong>Statement 1:</strong> A member, prior to leaving his current employer, may contact potential clients outside of normal working hours for purposes of soliciting their business for their new employer.</p><p><strong>Statement 2:</strong> A member, while still employed, is free to make arrangements to apply for a license with the local regulator to set up a competing business.</p>"},{"n":15,"q":"According to the Standard relating to disclosure of conflicts, buy-side members should\ndisclose to clients their:","opts":["beneficial ownership in any security.","firm's procedures for reporting requirements for personal transactions.","firm's policies on blackout periods during which the member cannot trade for clients."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn VI(A), Tiết lộ xung đột, các thành viên bên mua và\nứng cử viên phải tiết lộ quy trình báo cáo các yêu cầu đối với giao dịch cá nhân của họ.\nDo đó, việc tiết lộ quyền sở hữu có lợi đối với bất kỳ chứng khoán nào không phải là một yêu cầu bắt buộc.\nB. Đúng vì theo Tiêu chuẩn VI(A), Tiết lộ xung đột, các thành viên bên mua và\nứng cử viên phải tiết lộ thủ tục báo cáo các yêu cầu đối với giao dịch cá nhân.\nXung đột phát sinh từ đầu tư cá nhân được thảo luận đầy đủ hơn trong hướng dẫn cho Tiêu chuẩn VI(B).\nDo đó, không tiết lộ thủ tục dành cho thành viên bên mua là vi phạm.\nC. Không chính xác vì theo Tiêu chuẩn VI(B), Mức độ ưu tiên của giao dịch, nhân viên đầu tư\ntham gia vào quá trình ra quyết định đầu tư phải thiết lập khoảng thời gian tạm dừng trước khi giao dịch\ncho khách hàng để người quản lý không thể tận dụng kiến thức của họ về hoạt động của khách hàng bằng cách \"chạy trước\" các giao dịch của khách hàng (giao dịch cho tài khoản cá nhân của một người trước khi giao dịch cho tài khoản khách hàng).\nDo đó, thời gian tạm dừng không phải để hạn chế hoạt động giao dịch của khách hàng.\nTiêu chuẩn đạo đức và chuyên nghiệp: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử chuyên nghiệp","qhtml":null},{"n":16,"q":"Michael Mak, CFA, is a portfolio manager at an investment firm. After comprehensive\nresearch, Mak buys Advance One Tech's (AOT) stock for all his clients for whom the\ninvestment is suitable. He then buys AOT shares for his brother's fee-paying account, in which\nMak has beneficial ownership. AOT's stock price declines significantly after a month, resulting\nin substantial losses for all his clients. Are Mak's actions consistent with the Standards?","opts":["Yes","No, Mak's actions are not consistent with the Standard relating to priority of transactions","No, Mak's actions are not consistent with the Standard relating to diligence and reasonable basis"],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn VI(B). Mức độ ưu tiên của Giao dịch, tài khoản gia đình là\ntài khoản khách hàng phải được đối xử giống như bất kỳ tài khoản công ty nào khác và không được đối xử\nđặc biệt cũng như không bị thiệt thòi vì mối quan hệ gia đình. Tuy nhiên, nếu một thành viên hoặc ứng viên có\nquyền sở hữu có lợi trong tài khoản thì thành viên hoặc ứng viên đó có thể phải tuân theo\ncác yêu cầu báo cáo hoặc thông quan trước của nhà tuyển dụng hoặc luật hiện hành. Mak nên đối xử với tài khoản thanh toán phí của anh trai mình\nnhư bất kỳ tài khoản công ty nào khác và không bị thiệt thòi.\nDo đó, hành động của Mak không nhất quán với Tiêu chuẩn liên quan đến mức độ ưu tiên của giao dịch.\nB. Đúng vì theo Mức độ ưu tiên giao dịch của Tiêu chuẩn VI(B), tài khoản gia đình là\ntài khoản khách hàng phải được đối xử giống như bất kỳ tài khoản công ty nào khác và không được đối xử\nđặc biệt cũng như không bị thiệt thòi vì mối quan hệ gia đình. Tuy nhiên, nếu một thành viên hoặc ứng viên có\nquyền sở hữu có lợi trong tài khoản thì thành viên hoặc ứng viên đó có thể phải tuân theo\ncác yêu cầu báo cáo hoặc thông quan trước của nhà tuyển dụng hoặc luật hiện hành. Mak nên đối xử với tài khoản thanh toán phí của\nanh trai mình giống như bất kỳ tài khoản tinm nào khác và không nên bị thiệt thòi.\nDo đó. Hành động của Mak không phù hợp với Tiêu chuẩn liên quan đến mức độ ưu tiên của giao dịch\nC. Không chính xác vì theo Tiêu chuẩn V(A), Sự siêng năng và Cơ sở hợp lý, các Thành viên và\nỨng viên phải 1. Thực hiện sự siêng năng, độc lập và kỹ lưỡng trong việc phân tích các khoản đầu tư,\nđưa ra các khuyến nghị đầu tư và thực hiện các hành động đầu tư. 2. Có cơ sở hợp lý và\nđầy đủ, được hỗ trợ bởi nghiên cứu và điều tra phù hợp, cho bất kỳ phân tích đầu tư,\nđề xuất hoặc hành động nào. Mak đã hoàn thành nghiên cứu toàn diện trước khi mua cổ phiếu\nAOT cho khách hàng của mình. Do đó, hành động của Mak phù hợp với Tiêu chuẩn liên quan đến sự siêng năng\nvà cơ sở hợp lý\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":17,"q":"With respect to the GIPS standards, which of the following statements is most accurate?\nVerification:","opts":["of GIPS compliance is mandatory if the firm claims GIPS compliance.","is performed by the firm when self-regulating and certifying its claim of compliance.","tests whether the firm's processes are designed to present performance results in compliance with the GIPS standards."],"ans":"C","expl":"A. Không chính xác vì sau khi một công ty tuyên bố tuân thủ Tiêu chuẩn, họ có thể tự nguyện thuê một\nbên thứ ba độc lập để thực hiện xác minh nhằm tăng độ tin cậy vào tuyên bố\ntuân thủ của công ty. Do đó, việc xác minh là tự nguyện, không bắt buộc.\nB. Không chính xác vì các công ty tự điều chỉnh yêu cầu tuân thủ của mình và khi một công ty tuyên bố tuân thủ\nCác Tiêu chuẩn, họ có thể tự nguyện thuê một bên thứ ba độc lập để thực hiện xác minh\nnhằm tăng độ tin cậy vào tuyên bố tuân thủ của công ty. Do đó, một công ty không thể chứng nhận\ntuyên bố tuân thủ của chính mình.\nC. Đúng vì theo GIPS, Xác minh là một quá trình trong đó một công ty xác minh\n(người xác minh) độc lập tiến hành kiểm tra một công ty trên cơ sở toàn công ty theo các thủ tục xác minh\nbắt buộc của các tiêu chuẩn GIPS. Việc xác minh mang lại sự đảm bảo về việc liệu các chính sách và thủ tục\ncủa công ty liên quan đến việc duy trì quỹ tổng hợp và quỹ gộp, cũng như việc\ntính toán, trình bày và phân bổ hiệu quả hoạt động có được thiết kế tuân thủ\ncác tiêu chuẩn GIPS và đã được triển khai trên cơ sở toàn công ty hay không\nTiêu chuẩn đạo đức và chuyên nghiệp: mô tả khái niệm xác minh độc lập","qhtml":null},{"n":18,"q":"Which of the following is a violation of the Standard relating to conduct as participants in\nCFA Institute Programs? A candidate:","opts":["discusses broad topic areas covered in the curriculum in an online forum.","tells her brother, after taking the exam, how glad she was that no questions about the binomial model were asked.","publishes on a social media website her disappointment about what she thinks is an overly academic CFA Program."],"ans":"B","expl":"A. Không chính xác vì Tiêu chuẩn VII (A), Ứng xử với tư cách là Người tham gia các Chương trình của Viện CFA, không\ncấm thí sinh thảo luận về thông tin không bí mật hoặc tài liệu chương trình giảng dạy với người khác\nhoặc trong các nhóm học tập để chuẩn bị cho kỳ thi. Do đó, ứng viên không vi phạm Tiêu chuẩn\nVII (A) bằng cách thảo luận về các lĩnh vực chủ đề rộng được đề cập trong chương trình giảng dạy trên một diễn đàn trực tuyến..\nB. Đúng vì theo Tiêu chuẩn VII (A) Ứng xử với tư cách là Người tham gia các Chương trình của Viện CFA,\ncác quy tắc, quy định và chính sách của chương trình Viện CFA cấm thí sinh tiết lộ tài liệu bí mật\ncó được trong quá trình thi. Ví dụ về thông tin mà\nthí sinh dự thi không thể tiết lộ bao gồm nhưng không giới hạn ở các lĩnh vực chuyên đề rộng lớn và các công thức đã được kiểm tra\nhoặc không được kiểm tra trong kỳ thi. Do đó, ứng viên đã vi phạm Tiêu chuẩn VII (A) khi nói với\nanh trai của cô ấy rằng cô ấy rất vui khi không có câu hỏi nào về mô hình nhị thức được hỏi.\nC. Không chính xác vì Tiêu chuẩn VII (A), Hành vi với tư cách là Người tham gia trong các Chương trình của Viện CFA, không\nbao gồm việc bày tỏ ý kiến ​​về Viện CFA, Chương trình CFA hoặc các chương trình khác của Viện CFA\n. Các thành viên và ứng viên có quyền không đồng ý và bày tỏ sự không đồng ý với Viện CFA\nvề các chính sách, thủ tục hoặc bất kỳ quan điểm vận động nào của tổ chức. Khi\nbày tỏ quan điểm cá nhân, thí sinh bị cấm tiết lộ thông tin\ntheo nội dung cụ thể, bao gồm mọi câu hỏi thi thực tế và thông tin về chủ đề được đề cập hoặc\nkhông được đề cập trong kỳ thi. Do đó, ứng viên không vi phạm Tiêu chuẩn VII (A) khi đăng lên\nmột trang web truyền thông xã hội sự thất vọng của cô về những gì cô cho là một chương trình CFA mang tính hàn lâm quá mức\n.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":19,"q":"Johny Lumunon, CFA, shows prospective clients the investment performance of an\naccount with \"balanced\" investment objectives and highlights how account has\noutperformed the benchmark in the last 10 years. He does not disclose that this is the best\nperforming account, and that half of the accounts with \"balanced\" investment objectives\nmanaged by his firm underperformed the benchmark during the same period. Lumunon has\nmost likely violated the Standard(s) relating to:","opts":["only misrepresentation.","only performance presentation.","both misrepresentation and performance presentation."],"ans":"C","expl":"A. Không chính xác vì Lumunon đã vi phạm không chỉ Tiêu chuẩn I (C), Trình bày sai mà còn vi phạm\nTiêu chuẩn III (D), Trình bày hiệu suất, như được mô tả trong phần lý do cho câu trả lời đúng\nB. Không chính xác vì Lumunon đã vi phạm không chỉ Tiêu chuẩn III (D), Trình bày hiệu suất mà còn\ncả Tiêu chuẩn I (C), Trình bày sai, như được mô tả trong phần lý do cho câu trả lời đúng.\nC. Đúng vì theo Tiêu chuẩn I (C), Trình bày sai, một thành viên hoặc ứng cử viên không được\ncố ý bỏ sót hoặc trình bày sai thông tin hoặc gây ấn tượng sai về một công ty, tổ chức hoặc\nsự bảo mật trong các lời trình bày bằng lời nói của thành viên hoặc ứng viên, quảng cáo (cho dù trên báo chí hay\nthông qua tài liệu quảng cáo), thông tin liên lạc điện tử hoặc tài liệu bằng văn bản (dù được phổ biến công khai\nhoặc không). Bằng cách chỉ hiển thị kết quả đầu tư của một tài khoản \"cân bằng\" và không tiết lộ\nrằng đây là tài khoản hoạt động tốt nhất và một nửa số tài khoản cân bằng hoạt động kém hơn\nđiểm chuẩn, Lumunon đã vi phạm Tiêu chuẩn I (C). Tiêu chuẩn III (D), Trình bày\n, yêu cầu các thành viên và ứng viên tránh trình bày sai kết quả hoạt động hoặc gây hiểu lầm\nkhách hàng và khách hàng tiềm năng về hiệu suất đầu tư của các thành viên hoặc ứng viên hoặc\ncông ty của họ. Tiêu chuẩn này khuyến khích tiết lộ đầy đủ dữ liệu về hiệu quả đầu tư cho khách hàng và\nkhách hàng tiềm năng. Do đó, Lumunon cũng đã vi phạm Tiêu chuẩn III (D).\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":20,"q":"Jordan Kope, CFA, is an analyst with a hedge fund and works closely with Deepa Bose\nwho earned her CFA designation 15 years ago. Kope becomes aware that Bose uses her CFA\ndesignation even though she no longer pays her membership dues. During several meetings\nthat Bose and Kope have with the firm's clients, Bose emphasizes that all her team members,\nincluding herself, are CFA charterholders. To be consistent with the Standards, Kope should:","opts":["only dissociate himself from activities involving Bose.","only report Bose's conduct to the fund's compliance department.","dissociate himself from activities involving Bose and report Bose's conduct to the fund's compliance department."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn I(A), Kiến thức pháp luật. Các Thành viên và Ứng viên\nkhông được cố ý tham gia hoặc hỗ trợ và phải tách khỏi mọi hành vi vi phạm luật, quy tắc,\nhoặc quy định đó. Trong trường hợp này, bằng cách giữ im lặng trong một cuộc họp với khách hàng mà anh ta biết rằng Thông tin sai lệch\nđang được cung cấp cho một nhà đầu tư tiềm năng có thể gây hại cho nhà đầu tư đó, Kope sẽ được coi là\nhỗ trợ Bose cung cấp thông tin sai lệch đó, mặc dù Kope không tích cực tham gia vào\nhành vi sai trái đó. Kope nên báo cáo hành vi của mình với bộ phận tuân thủ của quỹ để\ngiải quyết và nên tự tách mình ra khỏi các hoạt động có liên quan đến Bose và báo cáo hành vi của Bose cho bộ phận tuân thủ của quỹ\n.\nB. Không chính xác vì theo Tiêu chuẩn (A). Hiểu biết về Pháp luật, các Thành viên và Ứng viên\nkhông được tham gia hoặc hỗ trợ và phải phân tích bất kỳ sự phân tích nào về các luật, quy tắc,\nhoặc quy định đó trong trường hợp này. Kope nên báo cáo hành vi của Bose cho bộ phận tuân thủ của quỹ\nđể giải quyết và nên báo cáo hành vi của Bose cho bộ phận tuân thủ của quỹ và\ntự tách mình ra khỏi các hoạt động liên quan đến Bose.\nC. Đúng vì theo Tiêu chuẩn I(A), Kiến thức về Luật, các Thành viên và Ứng viên\nkhông được cố ý tham gia hoặc hỗ trợ và phải tách khỏi mọi hành vi vi phạm luật, quy tắc\nhoặc quy định đó. Trong trường hợp này, bằng cách giữ im lặng trong cuộc họp khách hàng mà anh ta biết thông tin sai lệch là\nđược cung cấp cho một nhà đầu tư tiềm năng có thể gây hại cho mat insetta Kope sẽ bị coi là\nhỗ trợ Bose cung cấp thông tin sai lệch đó, mặc dù Kope không tích cực tham gia vào\nhành vi sai trái. Kope nên báo cáo hành vi của mình với bộ phận tuân thủ của quỹ để gửi\nđịa chỉ và nên phân tách các hoạt động của namell liên quan đến Bose và báo cáo hành vi của Bose cho\nbộ phận tuân thủ của quỹ\nĐạo đức và Chuyên nghiệp Tiêu chuẩn: giải thích cách thực hành, chính sách và cách ứng xử\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp của Viện CFA","qhtml":null},{"n":21,"q":"According to the recommended procedures for compliance with the Standard relating to\nresponsibilities of supervisors, a firm's code of ethics should:","opts":["only be written in plain language.","only be integrated in the firm's compliance procedures.","both be be written in plain language and be integrated in the firm's compliance procedures."],"ans":"A","expl":"A. Đúng vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn IV (C),\nTrách nhiệm của Người giám sát, các quy tắc đạo đức độc lập phải được viết bằng ngôn ngữ dễ hiểu và\nphải đề cập đến các khái niệm ủy thác chung.\nB. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn IV (C),\nTrách nhiệm của Người giám sát, Việc trộn lẫn các quy trình tuân thủ trong quy tắc đạo đức của công ty là đi ngược lại\nđi ngược lại mục tiêu củng cố nghĩa vụ đạo đức của nhân viên.\nC. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn IV (C),\nTrách nhiệm của Giám sát viên, Thành viên và ứng viên nên khuyến khích người sử dụng lao động của họ\ncung cấp quy tắc đạo đức của họ cho khách hàng.\nTiêu chuẩn đạo đức và chuyên nghiệp: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":22,"q":"According to the Standard relating to diligence and reasonable basis, a member is\nrequired to:","opts":["exercise diligence, independence, and thoroughness in analyzing investments.","become an expert in the technical aspects of the models used for investment recommendations.","dissociate and remove her name from a company group report if the report does not reflect her opinion."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn V(A) Phân tích, Khuyến nghị và Hành động Đầu tư\n– Siêng năng và Cơ sở Hợp lý, các Thành viên và Ứng viên phải: Thực hiện sự siêng năng, độc lập,\nvà kỹ lưỡng trong việc phân tích đầu tư, đưa ra khuyến nghị đầu tư và thực hiện\ncác hành động đầu tư.\nB. Không chính xác vì hướng dẫn về Cơ sở hợp lý và siêng năng trong Tiêu chuẩn V(A) nêu rõ rằng\nmặc dù họ không bắt buộc phải trở thành chuyên gia ở mọi khía cạnh kỹ thuật của mô hình nhưng họ phải\nhiểu các giả định và hạn chế cố hữu trong bất kỳ mô hình nào cũng như cách sử dụng kết quả trong\nquá trình ra quyết định.\nC. Không chính xác vì hướng dẫn về Cơ sở Hợp lý và Siêng năng Tiêu chuẩn V(A) nêu rõ rằng trong\nmột số trường hợp, một thành viên hoặc ứng viên sẽ không đồng ý với quan điểm của nhóm. Tuy nhiên, nếu\nthành viên hoặc ứng cử viên tin rằng ý kiến ​​đồng thuận có cơ sở hợp lý và đầy đủ và\nlà độc lập và khách quan thì thành viên hoặc ứng cử viên đó không cần phải từ chối xác định danh tính trong báo cáo\n. Nếu thành viên hoặc ứng cử viên tin tưởng vào quy trình này, thì thành viên hoặc ứng viên đó không\ncần tách khỏi báo cáo ngay cả khi nó không phản ánh quan điểm của họ.\nTiêu chuẩn đạo đức và chuyên môn: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":23,"q":"After completing Level II of the CFA exam, Aashi Banerjee posts several comments on an\nonline chatroom for CFA program candidates. Which of the following comments violate the\nStandard relating to conduct as participants in CFA Institute programs?\nComment 1 CFA Institute must revise the topic area weights on the exam.\nComment 2 There were no questions on GIPS standards.","opts":["Comment 1 only","Comment 2 only","Both Comment 1 and Comment 2"],"ans":"B","expl":"A. Không chính xác vì Tiêu chuẩn VII(A) không bao gồm việc bày tỏ quan điểm về Viện CFA,\nChương trình CFA hoặc các chương trình khác của Viện CFA. Các thành viên và ứng viên có quyền không đồng ý và\nbày tỏ sự không đồng ý với Viện CFA về các chính sách, thủ tục hoặc bất kỳ quan điểm ủng hộ\n nào mà tổ chức đưa ra. Vì vậy, Nhận xét 1 không vi phạm Tiêu chuẩn vì nó phản ánh\ný kiến ​​của Banerjee\nB. Đúng vì theo Tiêu chuẩn VII(A), khi bày tỏ quan điểm cá nhân, thí sinh\nbị cấm tiết lộ thông tin cụ thể về nội dung, bao gồm mọi câu hỏi thi thực tế và\nthông tin về chủ đề được đề cập hoặc không được đề cập trong kỳ thi. Khi đưa ra Nhận xét 2,\nBanerjee có thể đã cung cấp thông tin về chủ đề được đề cập trong bài kiểm tra và do đó\nđã vi phạm Tiêu chuẩn\nC. Không chính xác vì Tiêu chuẩn VII(A) không bao gồm việc bày tỏ quan điểm về Viện CFA,\nChương trình CFA hoặc các chương trình khác của Viện CFA. Các thành viên và ứng viên có quyền không đồng ý và\nbày tỏ sự không đồng ý với Viện CFA về các chính sách, thủ tục hoặc bất kỳ quan điểm ủng hộ\n nào mà tổ chức đưa ra. Vì vậy, Nhận xét 1 không vi phạm Tiêu chuẩn vì nó phản ánh\ný kiến ​​của Banerjee. Tuy nhiên, khi đưa ra Nhận xét 2, Banerjee có thể đã cung cấp thông tin về\nchủ đề được đề cập trong bài kiểm tra và do đó đã vi phạm Tiêu chuẩn.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":24,"q":"Which of the following activities violates the Standard relating to market manipulation?\nActivity 1: A member secures a dominant position in futures contracts to influence the price of the underlying. The transaction results in large losses for the member.\nActivity 2: A member frequently trades a stock in multiple client accounts with an intent to increase the volume of the stock. The transactions result in large gains for the clients.","opts":["Activity 1 only","Activity 2 only","Both Activity 1 and Activity 2"],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn II(B), Thao túng thị trường, thao tác\ndựa trên giao dịch bao gồm nhưng không giới hạn ở những điều sau: các giao dịch ảnh hưởng giả tạo đến giá\nhoặc khối lượng nhằm tạo ấn tượng về hoạt động hoặc chuyển động giá trong một công cụ tài chính, mà\nthể hiện sự chệch hướng so với kỳ vọng về một thị trường công bằng và hiệu quả và đảm bảo vị trí thống trị\ntrong một công cụ tài chính công cụ tài chính để khai thác và thao túng giá của một sản phẩm phái sinh\ncó liên quan và/hoặc tài sản cơ bản. Ngoài ra, mục đích của hành động là rất quan trọng để xác định\nliệu hành động đó có vi phạm tiêu chuẩn này hay không. Mặc dù thua lỗ, Hoạt động 1 vi phạm Tiêu chuẩn II(B)\nvì mục đích là tác động đến giá của Hoạt động cơ bản 2 cũng vi phạm vì\nmục đích là tăng khối lượng cổ phiếu.\nB. Không chính xác vì theo Tiêu chuẩn II(B), Thao túng thị trường, thao tác\ndựa trên giao dịch bao gồm nhưng không giới hạn ở những điều sau: các giao dịch ảnh hưởng giả tạo đến giá\nhoặc khối lượng nhằm tạo ấn tượng về hoạt động hoặc chuyển động giá trong một công cụ tài chính, mà\nthể hiện sự chệch hướng so với kỳ vọng về một thị trường công bằng và hiệu quả và đảm bảo vị trí thống trị\ntrong một công cụ tài chính công cụ tài chính để khai thác và thao túng giá của một sản phẩm phái sinh\ncó liên quan và/hoặc tài sản cơ bản. Ngoài ra, mục đích của hành động là rất quan trọng để xác định\nliệu hành động đó có vi phạm tiêu chuẩn này hay không. Hoạt động 2 là vi phạm vì mục đích là tăng\nkhối lượng tồn kho. Mặc dù thua lỗ, Hoạt động 1 cũng vi phạm Tiêu chuẩn II(B) vì\ncó mục đích gây ảnh hưởng đến giá của tài sản cơ sở.\nC. Đúng vì theo Tiêu chuẩn II(B), Thao túng thị trường, thao túng\ndựa trên giao dịch bao gồm, nhưng không giới hạn ở những điều sau: các giao dịch ảnh hưởng giả tạo đến giá\nhoặc khối lượng nhằm tạo ấn tượng về hoạt động hoặc biến động giá trong một công cụ tài chính, mà\nthể hiện sự chệch hướng so với kỳ vọng về một thị trường công bằng và hiệu quả và đảm bảo vị trí thống trị\ntrong thị trường tài chính công cụ để khai thác và thao túng giá của một sản phẩm phái sinh\ncó liên quan và/hoặc tài sản cơ bản. Ngoài ra, mục đích của hành động này rất quan trọng trong việc xác định\nliệu hành động đó có vi phạm tiêu chuẩn này hay không.\" Mặc dù thua lỗ, Hoạt động 1 vẫn vi phạm Tiêu chuẩn II(B)\nvì mục đích là gây ảnh hưởng đến giá của tài sản cơ sở. Hoạt động 2 cũng vi phạm vì\nmục đích là tăng khối lượng cổ phiếu.\nTiêu chuẩn đạo đức và chuyên nghiệp: xác định hành vi đó tuân thủ Quy tắc và Tiêu chuẩn cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":"<p>Which of the following activities violates the Standard relating to market manipulation?</p><p><strong>Activity 1:</strong> A member secures a dominant position in futures contracts to influence the price of the underlying. The transaction results in large losses for the member.</p><p><strong>Activity 2:</strong> A member frequently trades a stock in multiple client accounts with an intent to increase the volume of the stock. The transactions result in large gains for the clients.</p>"},{"n":25,"q":"Which of the following statements regarding the GIPS standards is accurate?","opts":["All fee-paying client portfolios must be included in at least one composite.","All portfolios with the same investment mandate are aggregated into a composite.","Aggregation of portfolios into composites is based on the actual performance of the portfolios every year."],"ans":"B","expl":"A. Không chính xác vì theo tiêu chuẩn GIPS, yêu cầu tuân thủ yêu cầu tất cả các tài khoản tùy ý thanh toán phí\ndo công ty quản lý phải được đưa vào ít nhất một tổ hợp. Các danh mục đầu tư không\ntùy ý không được đưa vào danh mục tổng hợp của công ty. Không cần phải bao gồm các danh mục đầu tư\ntrả phí không tùy ý.\nB. Đúng vì theo tiêu chuẩn GIPS. Tổ hợp là sự tổng hợp của một hoặc nhiều\ndanh mục đầu tư được quản lý theo nhiệm vụ, mục tiêu hoặc chiến lược đầu tư tương tự\nC. Không chính xác vì theo tiêu chuẩn GIPS, việc xác định danh mục nào sẽ\nbao gồm trong Tổng hợp phải được thực hiện theo các tiêu chí đã thiết lập trước (tức là trên cơ sở dữ liệu trước\n), không phải sau khi thực tế. Dựa trên hiệu suất thực tế sẽ yêu cầu việc tổng hợp được thực hiện\nsau khi thực tế không chính xác.\nTiêu chuẩn đạo đức và chuyên nghiệp: giải thích mục đích của sự tổng hợp trong báo cáo hiệu suất","qhtml":null},{"n":26,"q":"Claus Holm, CFA, directs most of his clients' trades to RRT Company (RRT), despite RRT's\nhigher-than-average commissions. In return, RRT refers individual clients to Holm for asset\nmanagement services. Holm does not disclose the arrangement to his clients or prospective\nclients. Holm has most likely violated the Standard(s) relating:","opts":["only to referral fees.","only to loyalty, prudence, and care.","both to referral fees and to loyalty, prudence, and care."],"ans":"C","expl":"A. Không chính xác vì Holm đã vi phạm cả Tiêu chuẩn III (A) và VI (C), như được mô tả trong Phản hồi\nB. Không chính xác vì Holm đã vi phạm cả Tiêu chuẩn III (A) và VI (C), như được mô tả trong Phản hồi\nC. Đúng vì theo Tiêu chuẩn III(A) Trung thành, Thận trọng và Cẩn trọng. Xung đột có thể nảy sinh\nkhi người quản lý đầu tư sử dụng môi giới khách hàng để mua dịch vụ nghiên cứu, một thông lệ\nthường được gọi là 'đô la mềm' hoặc 'hoa hồng mềm. Một thành viên hoặc ứng viên trả hoa hồng môi giới\ncao hơn mức họ thường trả để cho phép mua hàng hóa hoặc\ndịch vụ mà không mang lại lợi ích tương ứng cho khách hàng, vi phạm nghĩa vụ trung thành với khách hàng. Việc trả\nphí cao hơn để đổi lấy lượt giới thiệu không mang lại lợi ích tương ứng cho khách hàng của Holm.\nDo đó, thỏa thuận này vi phạm nghĩa vụ trung thành với khách hàng của anh ấy. Ngoài ra, Holm đã vi phạm\nTiêu chuẩn VI (C), Phí giới thiệu, trong đó nêu trách nhiệm của các thành viên và ứng viên là phải thông báo\nchủ lao động, khách hàng và khách hàng tiềm năng của họ về bất kỳ lợi ích nào nhận được từ việc giới thiệu khách hàng và\nkhách hàng.\nTiêu chuẩn đạo đức và chuyên nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":27,"q":"Emma Fischer, CFA, is an analyst covering the banking sector. She has declared\nbankruptcy due to large unpaid personal medical bills. On weekends, she participates in\npublic protests for climate protection. She was recently arrested for trespassing during a\nprotest, which is an act of civil disobedience in her country. Has Fischer violated the\nStandards?","opts":["No","Yes, she has violated the Standard relating to misconduct","Yes, she has violated the Standard relating to loyalty, prudence and care"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn I (D), Hành vi sai trái, phá sản cá nhân có thể không phản ánh\ntính chính trực hoặc đáng tin cậy của người tuyên bố phá sản, nhưng nếu các trường hợp\nphá sản liên quan đến hành vi kinh doanh gian lận hoặc lừa dối thì việc phá sản có thể vi phạm\ntiêu chuẩn này. Ngoài ra, nói chung, Tiêu chuẩn I(D) không nhằm mục đích bao gồm các hành vi vi phạm pháp luật do\nhành động bất tuân dân sự nhằm ủng hộ niềm tin cá nhân vì hành vi đó không phản ánh kém\ndanh tiếng, tính liêm chính hoặc năng lực chuyên môn của thành viên hoặc ứng viên. Vì vậy,\nFischer không vi phạm Tiêu chuẩn I (D). Hơn nữa, Tiêu chuẩn III (A). Lòng trung thành, Thận trọng và Cẩn trọng tuyên bố\nrằng các Thành viên và Ứng viên có nghĩa vụ trung thành với khách hàng của mình và phải hành động với sự quan tâm\nhợp lý cũng như đưa ra phán đoán thận trọng. Các Thành viên và Ứng viên phải hành động vì lợi ích của\nkhách hàng của mình và đặt lợi ích của khách hàng lên trên lợi ích của chủ lao động hoặc của chính họ. Cả việc\nFischer phá sản hay hành động xâm phạm trong một cuộc biểu tình đều không áp đặt nghĩa vụ trung thành của cô ấy với\nkhách hàng của mình. Cô ấy không vi phạm Tiêu chuẩn III (A).\nB. Không chính xác vì theo Tiêu chuẩn I (D), Hành vi sai trái, phá sản cá nhân có thể không phản ánh\ntính chính trực hoặc độ tin cậy của người tuyên bố phá sản, nhưng nếu các trường hợp\nphá sản liên quan đến hành vi kinh doanh gian lận hoặc lừa dối thì việc phá sản có thể vi phạm\ntiêu chuẩn này. Ngoài ra, nói chung, Tiêu chuẩn I(D) không nhằm mục đích bao gồm các hành vi vi phạm pháp luật phát sinh từ\nhành vi bất tuân dân sự nhằm ủng hộ niềm tin cá nhân vì hành vi đó không phản ánh\nkém về danh tiếng, tính liêm chính hoặc năng lực chuyên môn của thành viên hoặc ứng viên. Do đó,\nFischer không vi phạm Tiêu chuẩn I (D).\nC. Không chính xác vì theo Tiêu chuẩn III (A), Lòng trung thành, Thận trọng và Cẩn trọng, các Thành viên và\nỨng viên có nghĩa vụ trung thành với khách hàng của mình và phải hành động một cách thận trọng và thực hiện\nsự phán đoán thận trọng. Các Thành viên và Ứng viên phải hành động vì lợi ích của khách hàng và đặt\nlợi ích của khách hàng lên trên lợi ích của chủ lao động hoặc lợi ích của chính họ. Cả việc Fischer phá sản lẫn\nhành vi xâm phạm trong một cuộc biểu tình đều không áp đặt nghĩa vụ trung thành của cô ấy với khách hàng của mình. Cô ấy không\nvi phạm Tiêu chuẩn III (A).\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":28,"q":"Which of the following is a recommended procedure for compliance with the Standard\nrelating to independence and objectivity? Members should encourage their firms to:","opts":["prohibit any employee participation in equity-related IPOS.","remove a corporate client company from the research universe and put it on a restricted list if the firm is unwilling to disseminate adverse opinions about the company.","provide every client with the procedures and policies for reporting potentially unethical behaviour, violations of regulations, or other activities that may harm the firm's reputation."],"ans":"B","expl":"A. Không chính xác vì theo quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I (B).\nTính độc lập và khách quan. Các thành viên và ứng cử viên nên khuyến khích các công ty đầu tư của họ\nphát triển các chính sách chính thức liên quan đến việc nhân viên mua cổ phần hoặc tPOS liên quan đến vốn cổ phần. Các công ty nên\nyêu cầu có sự chấp thuận trước để nhân viên tham gia IPO và tiết lộ nhanh chóng các hành động đầu tư\nđược thực hiện sau đợt chào bán. Vì vậy, khuyến nghị là nên có quy định về IPO: nhưng\nkhông đề xướng chúng một cách rõ ràng\nB. Đúng vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I (B),\nĐộc lập và khách quan, Tạo một danh sách hạn chế nếu công ty không sẵn lòng cho phép phổ biến\ný kiến bất lợi về một khách hàng doanh nghiệp, các thành viên và ứng viên nên khuyến khích công ty\nloại bỏ công ty gây tranh cãi khỏi phạm vi nghiên cứu và đưa nó vào danh sách hạn chế để\ncông ty chỉ phổ biến thông tin thực tế về công ty.\nC. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I (B),\nTính độc lập và khách quan, Công ty nên cung cấp cho mọi nhân viên các quy trình và\nchính sách để báo cáo hành vi có khả năng phi đạo đức, vi phạm quy định hoặc các hoạt động khác\ncó thể gây tổn hại đến danh tiếng của công ty. Vì vậy, nên cung cấp cho mọi công ty nên cung cấp cho mọi nhân viên,\nkhông phải mọi khách hàng.\nTiêu chuẩn đạo đức và chuyên nghiệp: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":29,"q":"According to the recommended procedure for compliance with the Standard relating to\nmisconduct, members should encourage their firms to disseminate a list of potential\nviolations and associated disciplinary sanctions to:","opts":["all clients only.","all employees only.","both all clients and all employees."],"ans":"B","expl":"A. Không chính xác vì theo quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I(D),\nhành vi sai trái, các thành viên và ứng viên nên khuyến khích công ty của mình áp dụng các chính sách sau\nvà các thủ tục hỗ trợ các nguyên tắc của Tiêu chuẩn I(D). Danh sách vi phạm: Phổ biến đến tất cả mọi người\nnhân viên một danh sách các hành vi vi phạm tiềm ẩn và các hình thức xử phạt kỷ luật liên quan, lên đến và bao gồm\nsa thải khỏi công ty. Phổ biến cho khách hàng không nằm trong số thủ tục được khuyến nghị\nB. Đúng vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I(D),\nhành vi sai trái, các thành viên và ứng viên nên khuyến khích công ty của mình áp dụng các chính sách sau\nvà các thủ tục hỗ trợ các nguyên tắc của Tiêu chuẩn I(D):\nDanh sách vi phạm: Phổ biến cho toàn thể nhân viên danh sách các vi phạm tiềm ẩn và các biện pháp liên quan.\nkỷ luật, lên đến và bao gồm cả việc sa thải khỏi công ty.\nC. Không chính xác vì theo quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I(D),\nhành vi sai trái, các thành viên và ứng viên nên khuyến khích công ty của mình áp dụng các chính sách sau\nvà thủ tục hỗ trợ các nguyên tắc của Tiêu chuẩn I(D): Danh sách vi phạm: Phổ biến tới tất cả mọi người\nnhân viên một danh sách các hành vi vi phạm tiềm ẩn và các hình thức xử phạt kỷ luật liên quan, lên đến và bao gồm\nsa thải khỏi công ty. Phổ biến cho khách hàng không nằm trong số các thủ tục được khuyến nghị.\nTiêu chuẩn đạo đức và nghề nghiệp: khuyến nghị các thực hành và quy trình được thiết kế để ngăn ngừa\nvi phạm Quy tắc đạo đức và Chuẩn mực ứng xử nghề nghiệp","qhtml":null},{"n":30,"q":"According to the recommended procedures for compliance with the Standard relating to\nmisconduct, members should encourage their firms to:","opts":["conduct background checks of all employees at least annually.","develop and adopt a code of ethics to which every employee must subscribe.","check references of potential clients to ensure that they are of good character."],"ans":"B","expl":"A. Không chính xác vì tuân theo các quy trình được đề xuất để tuân thủ Tiêu chuẩn 1\n(D). Hành vi sai trái, các thành viên nên khuyến khích công ty của mình kiểm tra thông tin giới thiệu của các nhân viên tiềm năng\nđể đảm bảo rằng họ có tư cách tốt và không đủ điều kiện để làm việc trong ngành đầu tư\ndo vi phạm pháp luật trong quá khứ. Tuy nh
