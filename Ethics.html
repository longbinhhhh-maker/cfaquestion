c sản phẩm mới hoặc tài trợ thứ cấp, các thành viên và ứng viên nên phân phối số phát hành cho tất cả\nkhách hàng mà khoản đầu tư phù hợp theo cách phù hợp với chính sách của công ty\ntrong việc phân bổ khối cổ phiếu. Ngoài ra, nếu số phát hành được đăng ký vượt mức, các thành viên và\nứng viên nên từ bỏ mọi giao dịch bán hàng cho bản thân hoặc gia đình trực hệ của họ để giải phóng\ncổ phiếu bổ sung cho khách hàng. Nếu tài khoản gia đình của chuyên gia đầu tư được quản lý\ntương tự như tài khoản của các khách hàng khác của công ty, tuy nhiên, tài khoản thành viên gia đình\nkhông bị loại trừ khỏi việc mua cổ phiếu đó trong trường hợp này. Anh trai của Lee có tài khoản\ntrả phí tiêu chuẩn, đợt IPO là phù hợp, vì vậy Lee nên đưa anh trai mình vào phân bổ theo tỷ lệ của IPO\ncổ phiếu\nB. Không chính xác vì Tiêu chuẩn III (B), Giao dịch công bằng, tuyên bố rằng Lee lẽ ra phải đưa tài khoản\ncủa anh trai mình vào phân bổ IPO, như được mô tả trong phần cơ bản cho câu trả lời đúng\nC. Không chính xác vì Tiêu chuẩn III (C), Tính phù hợp, yêu cầu các thành viên và ứng viên có mối quan hệ tư vấn đầu tư\nvới khách hàng xem xét cẩn thận nhu cầu, hoàn cảnh và\nmục tiêu của khách hàng khi xác định tính phù hợp và phù hợp của một khoản đầu tư nhất định\nhoặc quá trình hành động đầu tư. Lee đăng ký IPO cho những khách hàng mà anh ấy đánh giá\nlà phù hợp chứ không phải cho khách hàng mà khoản đầu tư không phù hợp. Do đó, anh ấy không\nvi phạm Tiêu chuẩn.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":111,"q":"Which of the following most likely violates\nthe Standard relating to preservation of confidentiality?","opts":["Recommending a former client as a potential donor for a local charity","Disclosing details of client activity to the CFA Institute Professional Conduct Program","Providing confidential information about a prospective client when permitted by the prospective client"],"ans":"A","expl":"A. Đúng vì Tiêu chuẩn III (E), Bảo mật bí mật, yêu cầu Thành viên và\nỨng viên phải giữ bí mật thông tin về khách hàng hiện tại, trước đây và tương lai. Ngoài ra,\ntiêu chuẩn này bảo vệ tính bảo mật của thông tin khách hàng ngay cả khi cá nhân hoặc tổ chức đó không còn\nlà khách hàng của thành viên hoặc ứng viên nữa.\nB. Không chính xác vì các yêu cầu của Tiêu chuẩn III (E) không nhằm mục đích ngăn cản các thành viên và\nứng viên hợp tác với cuộc điều tra của Chương trình Ứng xử Chuyên nghiệp của Viện CFA\n(PCP)\nC. Không chính xác vì Thành viên và Ứng viên phải giữ bí mật thông tin về khách hàng hiện tại, trước đây và\ntiềm năng trừ khi khách hàng hoặc khách hàng tiềm năng cho phép tiết lộ\nthông tin.\nTiêu chuẩn đạo đức và nghề nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và tiêu chuẩn\nỨng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":112,"q":"Linda Barr, CFA, a portfolio manager, receives an unsolicited stock order from a client.\nShe discusses the order with her firm's analysts to determine how it will impact that client's\nportfolio. The analysts determine the stock to be highly undervalued and suitable for many of\nBarr's clients. Barr calls clients for whom the stock is suitable to recommend the stock. She\nthen executes a single block trade for the original client as well as other clients for whom the\nstock is suitable. Barr most likely violated the Standards:","opts":["only by executing the single block trade.","only by discussing unsolicited client orders with her analysts.","both by executing the single block trade and by discussing unsolicited client orders with her analysts."],"ans":"A","expl":"A. Đúng vì Tiêu chuẩn III (E), Bảo vệ bí mật, yêu cầu các thành viên và\nứng viên bảo mật thông tin mà khách hàng\nkhách hàng tiềm năng và khách hàng cũ truyền đạt cho họ. Hơn nữa, khách hàng hoặc khách hàng cũ xác thực rõ ràng\nmumbents, ứng viên tiết lộ thông tin, tuy nhiên, thành viên hoặc ứng viên có thể tuân theo\ncác điều khoản của ủy quyền và cung cấp thông tin: Việc kiểm tra cổ phiếu không được yêu cầu từ thánh ca\nlà bí mật Vì vậy Berr phải có được sự tôn trọng của khách hàng ban đầu trước khi giới thiệu cổ phiếu cho\ncác khách hàng khác Do đó, Barr đã vi phạm Tiêu chuẩn 11 (E) bằng cách thực hiện mà không có khách hàng của oeminal\nxác thực một giao dịch khối duy nhất cho khách hàng ban đầu cũng như các khách hàng khác có cổ phiếu 15\nThích hợp\nB. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn III (E),\nBảo mật, cách đơn giản nhất, thận trọng nhất và hiệu quả nhất để tuân thủ\nTiêu chuẩn III (E) là tránh tiết lộ bất kỳ thông tin nào nhận được từ khách hàng ngoại trừ cho các nhân viên được ủy quyền\ncũng đang làm việc cho khách hàng. Barr thảo luận về đơn đặt hàng với\ncác nhà phân tích của công ty cô để xác định xem đơn đặt hàng cổ phiếu không được yêu cầu sẽ tác động như thế nào đến danh mục đầu tư của khách hàng. Khi các nhà phân tích\nlàm việc cho khách hàng, Barr đã không vi phạm Tiêu chuẩn III (E) bằng cách thảo luận về các đơn đặt hàng không được yêu cầu của khách hàng với\ncác nhà phân tích của cô ấy\nC. Không chính xác vì Barr đã vi phạm Tiêu chuẩn III (E), Bảo vệ bí mật, chỉ bằng cách\nthực hiện một giao dịch khối duy nhất cho khách hàng ban đầu cũng như những khách hàng khác có cổ phiếu\nphù hợp, như được mô tả trong phần lý do phản hồi cho câu trả lời đúng.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":113,"q":"A member works for a large investment firm. CFA Institute contacts the member to\nrequest support for a professional conduct investigation. In his response, the member\ndiscloses the requested information regarding client activities. Applicable law requires to\nmaintain client confidentiality. Has the member most likely violated the Standards?","opts":["No.","Yes, the Standard relating to fair dealing.","Yes, the Standard relating to knowledge of the law."],"ans":"C","expl":"A. Không chính xác vì thành viên vi phạm Tiêu chuẩn I (A), như được mô tả trong cơ sở phản hồi cho\ncâu trả lời đúng.\nB. Không chính xác vì Tiêu chuẩn III (B), Giao dịch công bằng, quy định rằng các Thành viên và Ứng viên phải giao dịch\nmột cách công bằng và khách quan với tất cả khách hàng khi cung cấp phân tích đầu tư, đưa ra các đề xuất đầu tư\n, thực hiện hành động đầu tư hoặc tham gia vào các hoạt động chuyên môn khác. Tuy nhiên,\ntrường hợp này không phải về sự công bằng liên quan đến phân tích đầu tư, đưa ra khuyến nghị đầu tư,\nthực hiện hành động đầu tư thay mặt cho khách hàng. Thay vào đó, thành viên vi phạm Tiêu chuẩn I (A),\nKiến thức về Pháp luật, như được mô tả trong phần cơ sở phản hồi cho câu trả lời đúng\nC. Đúng vì Tiêu chuẩn 1 (A), Kiến thức về Pháp luật, quy định rằng Thành viên và Ứng viên phải\nhiểu và tuân thủ tất cả các luật, quy tắc và quy định hiện hành. Trong khi Tiêu chuẩn III (E),\nBảo vệ bí mật quy định rằng Khi được luật hiện hành cho phép, các thành viên và\nứng viên sẽ coi PCP là một phần mở rộng của chính họ khi được yêu cầu cung cấp\nthông tin về khách hàng để hỗ trợ PCP điều tra hành vi của chính họ, trường hợp này rõ ràng\ntuyên bố rằng luật hiện hành không cho phép tiết lộ. Do đó, thành viên vi phạm Tiêu chuẩn I\n(A) bằng cách tiết lộ thông tin khách hàng.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":114,"q":"Iris Hadid, CFA, works as an investment banking analyst. She builds a financial model to\nvalue Ski Mountain Lodge (SML). Hadid's friend, Peter Jackson, CFA, works for a different\nadvisory firm. Hadid shares with Jackson details about her analysis to receive his feedback on\nher valuation of SML. Based on this information, Jackson buys call options on SML. Who has\nviolated the Standards?","opts":["Hadid only","Jackson only","Both Hadid and Jackson"],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn II(A), Thông tin quan trọng không công khai, đã bị cả\nHadid và Jackson vi phạm như được mô tả trong cơ sở phản hồi của câu trả lời đúng\nB. Không chính xác vì Tiêu chuẩn II(A), Thông tin quan trọng không công khai, đã bị cả\nHadid và Jackson vi phạm như được mô tả trong phần cơ sở phản hồi của câu trả lời đúng.\nC. Đúng vì Tiêu chuẩn II(A), Thông tin quan trọng không công khai, tuyên bố rằng các Thành viên và\nỨng cử viên sở hữu thông tin quan trọng không công khai có thể ảnh hưởng đến giá trị của khoản đầu tư\nkhông được hành động hoặc khiến người khác hành động dựa trên thông tin đó. Ngoài ra, các Thành viên và ứng cử viên không được sử dụng\nthông tin quan trọng không công khai để gây ảnh hưởng đến hành động đầu tư của họ liên quan đến phái sinh. Hadid\nkhiến Jackson hành động bằng cách nói với Jackson về công việc của cô ấy trên SML Jackson hành động dựa trên thông tin và\nmua quyền chọn mua trên SML. Do đó, cả Hadid và Jackson đều vi phạm Tiêu chuẩn II(A).\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":115,"q":"Which statement regarding market manipulation is consistent with the Standards?\nMembers must refrain from:","opts":["inducing trading by disseminating verifiable information.","engaging in practices which exploit perceived market inefficiencies.","securing a dominant position in a financial instrument to exploit the price of the underlying asset."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn II(B), Thao túng thị trường, các thành viên bị cấm\nphổ biến thông tin sai lệch, không thể kiểm chứng để xúi giục người khác giao dịch. Thao túng thị trường\nbao gồm phổ biến thông tin sai lệch hoặc gây hiểu lầm và thao túng\ndựa trên thông tin bao gồm lan truyền tin đồn sai sự thật để khuyến khích người khác giao dịch.\nB. Không chính xác vì Thao túng thị trường Tiêu chuẩn II(B) cho phép các chiến lược giao dịch dựa trên\nsự kém hiệu quả được nhận thấy của thị trường. Tiêu chuẩn II(B) không nhằm mục đích ngăn cản các giao dịch được thực hiện\nvề các chiến lược giao dịch hợp pháp dựa trên nhận thức về sự kém hiệu quả của thị trường.\nC. Đúng vì Tiêu chuẩn II(B), Thao túng thị trường, nghiêm cấm hoạt động đó. Thao túng\ndựa trên giao dịch bao gồm, nhưng không giới hạn ở việc đảm bảo vị trí thống trị, kiểm soát trong một công cụ tài chính\nđể khai thác giá của tài sản cơ bản.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":116,"q":"To comply with the Standards, if applicable law requires members to maintain\nconfidentiality of client information, confidentiality must be maintained unless:","opts":["the client has died.","the client's information involves illegal activities.","the client permits the disclosure of the information."],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn III (E), Bảo vệ bí mật, nêu rõ rằng tiêu chuẩn\nbảo vệ tính bảo mật của thông tin khách hàng ngay cả khi cá nhân hoặc tổ chức đó không còn là khách hàng của\nthành viên hoặc ứng viên.\nB. Không chính xác vì Tiêu chuẩn III (E), Bảo vệ bí mật, quy định rằng nếu luật hiện hành\nyêu cầu thành viên ngay cả khi thông tin liên quan đến các hoạt động bất hợp pháp từ phía khách hàng,\ncác thành viên và ứng viên không được tiết lộ thông tin đó\nC. Đúng vì Tiêu chuẩn III (E), Bảo vệ bí mật, tuyên bố rằng các thành viên phải giữ bí mật\nthông tin về khách hàng hiện tại, trước đây và tiềm năng trừ khi khách hàng hoặc\nkhách hàng tiềm năng cho phép tiết lộ thông tin\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":117,"q":"Grace Lee, CFA, is an investment advisor. The investment policy statement of one of her\nclients specifies an equal- weighted portfolio of consumer durables, clean energy, and\ntechnology stocks. Over time, the portfolio has become significantly over-weighted toward\ntechnology stocks due to their superior performance. Lee expects technology stocks to\noutperform for another year and decides not to rebalance the portfolio. Has Lee violated the\nStandards?","opts":["No.","Yes, only the Standard relating to suitability.","Yes, both the Standard relating to suitability and the Standard relating to loyalty, prudence, and care."],"ans":"C","expl":"A. Không chính xác vì vì, như được mô tả trong phần căn cứ cho câu trả lời đúng, Lee đã vi phạm cả\nTiêu chuẩn III(A) và Tiêu chuẩn III(C).\nB. Không chính xác vì vì, như được mô tả trong phần căn cứ cho câu trả lời đúng, Lee đã vi phạm cả\nTiêu chuẩn III(A) và Tiêu chuẩn III(C)\nC. Đúng vì Tiêu chuẩn III(C), Tính phù hợp, Khi Thành viên và Ứng viên có mối quan hệ tư vấn\nvới khách hàng, họ phải xác định rằng khoản đầu tư phù hợp với tình hình tài chính\ncủa khách hàng và nhất quán với mục tiêu, nhiệm vụ và ràng buộc bằng văn bản của khách hàng trước khi\nđưa ra khuyến nghị đầu tư hoặc thực hiện hành động đầu tư. Ngoài ra, việc xác định sự phù hợp của các chuyên gia đầu tư\nchỉ nên phản ánh các khuyến nghị đầu tư hoặc\nhành động mà người thận trọng sẽ sẵn sàng thực hiện. Không phải mọi cơ hội đầu tư đều sẽ\nphù hợp với mọi cổng, bất kể lợi nhuận tiềm năng được cung cấp. Lee đã ichmated bar\nclionis ủy nhiệm của một portfolin eqoanweignæd và nằm trong phần phụ của điều này. Hơn nữa, theo\ntheo Tiêu chuẩn II(Sự thận trọng và các Thành viên cốt lõi và Ứng viên có nghĩa vụ trung thành với\nkhách hàng của họ và phải đưa ra quyết định hợp lý và đưa ra phán đoán thận trọng. Ngoài ra, các thành viên và\ncác ứng cử viên vi phạm follha bất kỳ hướng dẫn nào do kiến của họ đưa ra cho lermanedamot of tads jissels Lea 6\nquyết định không thực hiện, việc cải tổ truyền thống là vi phạm Tiêu chuẩn này. Vì vậy, Lee đã vi phạm cả Tiêu chuẩn\nIII(C) và Tiêu chuẩn III(A).\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc này. Đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":118,"q":"According to the Standards, members are required to obtain permission from their\nemployer before accepting additional compensation from:","opts":["clients only.","third parties only.","both clients and third parties."],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung, các thành viên yêu cầu\nvà các ứng viên phải xin phép chủ lao động của họ trước khi chấp nhận thù lao hoặc các lợi ích\n khác từ bên thứ ba đối với các dịch vụ được cung cấp cho chủ lao động hoặc cho bất kỳ dịch vụ nào có thể\ngây xung đột với lợi ích của chủ lao động. Bồi thường và lợi ích bao gồm\nthù lao trực tiếp của khách hàng và mọi khoản thù lao gián tiếp hoặc các lợi ích khác nhận được từ các bên thứ ba\n.\nB. Không chính xác vì Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung, yêu cầu các thành viên\nvà ứng viên phải xin phép người sử dụng lao động của họ trước khi chấp nhận khoản thù lao hoặc các lợi ích\nkhác từ bên thứ ba đối với các dịch vụ được cung cấp cho người sử dụng lao động hoặc cho bất kỳ dịch vụ nào có thể\ngây xung đột với lợi ích của người sử dụng lao động của họ. Bồi thường và lợi ích bao gồm khoản bồi thường trực tiếp\ncủa khách hàng và bất kỳ khoản thù lao gián tiếp nào khác các lợi ích nhận được từ\ncác bên thứ ba\nC. Đúng vì Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung, yêu cầu các thành viên và\nứng viên phải xin phép người sử dụng lao động của họ trước khi chấp nhận khoản thù lao hoặc các lợi ích\nkhác từ bên thứ ba đối với các dịch vụ được cung cấp cho người sử dụng lao động hoặc cho bất kỳ dịch vụ nào có thể\ntạo ra xung đột với lợi ích của người sử dụng lao động của họ. Bồi thường và lợi ích bao gồm trực tiếp\ntiền bồi thường của khách hàng và mọi khoản bồi thường gián tiếp hoặc lợi ích khác nhận được từ bên thứ ba\n.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":119,"q":"Frank Taylor, CFA, manages a portfolio for a football club. The club's chairman is pleased\nwith Taylor's work and offers him a front-row ticket to an upcoming, sold-out match. Taylor\naccepts the ticket without informing his employer. The chairman also provides Taylor with a\nperformance-based cash incentive for which he receives permission from his employer to\naccept. Has Taylor most likely violated the Standards?","opts":["No.","Yes, the Standard relating to loyalty, prudence, and care.","Yes, the Standard relating to additional compensation arrangements."],"ans":"C","expl":"A. Không chính xác vì Taylor đã vi phạm Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung. các\ntiêu chuẩn quy định rằng các Thành viên và Ứng viên không được nhận quà tặng, lợi ích, thù lao hoặc\nsự xem xét cạnh tranh hoặc có thể được cho là sẽ tạo ra xung đột lợi ích\nvới lợi ích của người sử dụng lao động trừ khi họ nhận được sự đồng ý của tất cả các bên liên quan. Taylor phải\nthông báo cho người chủ của mình và nhận được sự đồng ý để nhận vé ở hàng ghế đầu cho một vé đã bán hết sắp tới\ntrận đấu.\nB. Không chính xác vì Tiêu chuẩn III (A), Trung thành, Thận trọng và Quan tâm, nêu rõ rằng các Thành viên và\nCác ứng viên có nghĩa vụ trung thành với khách hàng của mình và phải hành động một cách thận trọng và thực hiện hợp lý.\nsự phán xét thận trọng. Vi phạm được mô tả trong câu hỏi này về việc nhận bồi thường bổ sung\nkhông có sự đồng ý của người sử dụng lao động thì không liên quan đến Tiêu chuẩn III(A)\nC. Đúng vì Tiêu chuẩn IV (B), Các thỏa thuận đền bù bổ sung. tuyên bố rằng các Thành viên\nvà Ứng viên không được nhận quà tặng, lợi ích, thù lao hoặc sự cân nhắc cạnh tranh với\nhoặc có thể được cho là sẽ tạo ra xung đột lợi ích với lợi ích của người sử dụng lao động trừ khi\nhọ nhận được sự đồng ý của tất cả các bên liên quan. Taylor phải thông báo cho người chủ của mình và nhận được sự đồng ý\nvì đã nhận vé ngồi hàng đầu cho trận đấu bán hết vé sắp tới. Vì vậy, anh ta đã vi phạm điều này\nTiêu chuẩn\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":120,"q":"Applying standardized criteria for the selection of external managers is a requirement of\nthe Standard relating to:","opts":["suitability.","independence and objectivity.","diligence and reasonable basis."],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn V (A), Sự siêng năng và Cơ sở hợp lý nêu rõ các thành viên và ứng viên\ncó liên quan trực tiếp đến việc sử dụng cố vấn bên ngoài cần đảm bảo rằng công ty của họ có\ntiêu chí tiêu chuẩn hóa để xem xét các cố vấn và nhà quản lý bên ngoài được lựa chọn này. Đây không phải là yêu cầu\ncủa Tiêu chuẩn III (C), Tính phù hợp\nB. Không chính xác vì Tiêu chuẩn V (A), Cơ sở siêng năng và hợp lý nêu rõ các thành viên và ứng viên\ncó liên quan trực tiếp đến việc sử dụng cố vấn bên ngoài cần đảm bảo rằng công ty của họ có\ntiêu chí tiêu chuẩn hóa để xem xét các cố vấn và nhà quản lý bên ngoài được lựa chọn này. Đây không phải là\nyêu cầu của Tiêu chuẩn I (B), Tính độc lập và khách quan.\nC. Đúng vì Tiêu chuẩn V (A), Sự siêng năng và Cơ sở hợp lý nêu rõ các thành viên và ứng viên\ncó liên quan trực tiếp đến việc sử dụng cố vấn bên ngoài cần đảm bảo rằng công ty của họ có\ntiêu chí tiêu chuẩn hóa để xem xét các cố vấn và nhà quản lý bên ngoài được lựa chọn này. Những tiêu chí như vậy\nsẽ bao gồm nhưng không giới hạn ở những điều sau:\nxem xét quy tắc đạo đức đã được thiết lập của cố vấn, hiểu sự tuân thủ của cố vấn và\nthủ tục kiểm soát nội bộ, đánh giá chất lượng thông tin trả lại được công bố và xem xét\nquy trình đầu tư của cố vấn và sự tuân thủ chiến lược đã nêu của cố vấn\nHiểu các thủ tục tuân thủ của người quản lý là một tiêu chí để lựa chọn người quản lý bên ngoài.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":121,"q":"The Standard relating to disclosure of conflicts requires a member to","opts":["avoid all actual and potential conflicts of interest.","treat all clients equally when disseminating investment recommendations or taking investment action.","provide clients and prospective clients with information needed to evaluate the objectivity of investment advice given by the member."],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn VI(A), Tiết lộ xung đột yêu cầu các thành viên và ứng viên\ntiết lộ đầy đủ và công bằng tất cả các vấn đề có thể được cho là làm suy giảm\nsự độc lập và khách quan của họ hoặc can thiệp vào các nghĩa vụ tương ứng đối với khách hàng, khách hàng tiềm năng\nvà nhà tuyển dụng của họ, đồng thời bảo vệ các nhà đầu tư và nhà tuyển dụng bằng cách yêu cầu các thành viên và ứng viên tiết lộ đầy đủ\ncho khách hàng, khách hàng tiềm năng và nhà tuyển dụng tất cả những gì thực tế và tiềm năng xung đột lợi ích. Khi\nmột thành viên hoặc ứng viên đã tiết lộ đầy đủ, khách hàng là chủ lao động của thành viên hoặc ứng viên đó và\nkhách hàng tiềm năng sẽ có thông tin cần thiết để đánh giá tính khách quan của lời khuyên hoặc hành động đầu tư\nđược thực hiện thay mặt họ.\nB. Không chính xác vì Tiêu chuẩn VI(A), Tiết lộ xung đột, không đưa ra yêu cầu hoặc\nkhuyến nghị nào liên quan đến giao dịch công bằng giữa các khách hàng. Theo Tiêu chuẩn\nIII(B), Giao dịch công bằng, Thành viên và Ứng viên phải đối xử công bằng và khách quan với tất cả khách hàng khi\ncung cấp phân tích đầu tư, đưa ra khuyến nghị đầu tư, thực hiện hành động đầu tư hoặc\ntham gia vào các hoạt động chuyên môn khác\nC. Đúng vì Tiêu chuẩn VI(A), Tiết lộ xung đột yêu cầu các thành viên và ứng viên tiết lộ\ntiết lộ đầy đủ và công bằng tất cả các vấn đề có thể được cho là làm suy giảm tính độc lập\nvà tính khách quan của họ hoặc can thiệp vào các nghĩa vụ tương ứng đối với khách hàng, khách hàng tiềm năng và nhà tuyển dụng\nvà bảo vệ các nhà đầu tư và nhà tuyển dụng bằng cách yêu cầu các thành viên và ứng viên tiết lộ đầy đủ cho\nkhách hàng, khách hàng tiềm năng và nhà tuyển dụng tất cả các xung đột thực tế và tiềm ẩn về tiền lãi. Sau khi thành viên\nhoặc ứng viên đã tiết lộ đầy đủ, chủ lao động, khách hàng của thành viên hoặc ứng viên đó và\nkhách hàng tiềm năng sẽ có thông tin cần thiết để đánh giá tính khách quan của lời khuyên hoặc hành động đầu tư\nđược thực hiện thay mặt họ.\nTiêu chuẩn đạo đức và chuyên nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn và\ntiến hành hành động đó vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":122,"q":"A member uses his firm's composite to show performance to a prospective client. The\nmember states \"Our composite shows that we have outperformed the benchmark over the\nlast five years, gross of fees.\" Has the member most likely violated the Standards?","opts":["No.","Yes, the Standard relating to misrepresentation.","Yes, the Standard relating to performance presentation"],"ans":"A","expl":"A. Đúng vì thành viên không vi phạm một trong các Tiêu chuẩn. Tiêu chuẩn 1 (C),\nTrình bày sai, cấm các thành viên và ứng viên đảm bảo cho khách hàng bất kỳ lợi tức cụ thể nào\nđối với các khoản đầu tư không ổn định. Thành viên không đưa ra đảm bảo về việc ngụ ý lợi nhuận trong tương lai cho\nkhách hàng tiềm năng và do đó không vi phạm Tiêu chuẩn này. Tiêu chuẩn III (D), Trình bày\n, quy định một thành viên hoặc ứng cử viên phải trình bày một cách công bằng và đầy đủ\nthông tin về hiệu quả hoạt động cho dù truyền đạt dữ liệu liên quan đến lịch sử hoạt động của\ntổ hợp hoặc nhóm tài khoản cá nhân hay tổ hợp\nkết quả hoạt động của nhà phân tích hoặc công ty. Hơn nữa, các thành viên và ứng viên không được tuyên bố hoặc ngụ ý rằng khách hàng\nsẽ nhận được hoặc hưởng lợi từ tỷ suất lợi nhuận đã được tạo ra trong quá khứ. Thành viên nêu rõ\nthực tế là tổ hợp cho thấy hiệu suất vượt trội; tổng phí và không ngụ ý lợi nhuận trong tương lai và\ndo đó không vi phạm Tiêu chuẩn này.\nB. Không chính xác vì thành viên không đảm bảo tỷ lệ lợi nhuận trong tương lai và do đó không vi phạm\nTiêu chuẩn I (C), Trình bày sai, như được mô tả trong phần lý do cho câu trả lời đúng\nC. Không chính xác vì thành viên đã sử dụng hợp lý lợi nhuận tổng hợp để thể hiện\nkết quả hoạt động trong quá khứ và không đảm bảo tỷ lệ lợi nhuận trong tương lai nên không vi phạm Tiêu chuẩn III (D),\nTrình bày về hiệu suất, như được mô tả trong cơ sở lý luận cho câu trả lời đúng\nTiêu chuẩn đạo đức và chuyên nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề chuyên môn tính toàn vẹn","qhtml":null},{"n":123,"q":"Belen Zapata, CFA, is the owner of Kawah Investments. Kawah promises investors\nreturns of up to 12% per year and claims to achieve this by investing in non-investment-grade\nbonds and other fixed-income instruments. Over the next 12 months, bond market yields\nreach unprecedented lows, and Zapata finds it impossible to achieve the returns she\nexpected. No investments are ever made by Kawah, and clients are completely paid back all\nof their original investment. Zapata most likely violated the CFA Institute Standards of\nProfessional Conduct because of the:","opts":["return of capital.","promised returns.","investment mandate."],"ans":"B","expl":"A. Không chính xác vì thành viên đã hoàn trả vốn của nhà đầu tư, điều này không vi phạm Quy tắc\nvà Tiêu chuẩn. Tuy nhiên, thành viên này đã vi phạm Tiêu chuẩn I(C), nghiêm cấm các thành viên và\nứng viên đảm bảo cho khách hàng bất kỳ lợi tức cụ thể nào từ các khoản đầu tư không ổn định. Với việc hoàn trả\nvốn của mình, các nhà đầu tư không bị mất khoản đầu tư ban đầu nhưng họ đã phải chịu tổn thất về mặt kinh tế\ncơ hội.\nB. Đúng vì thành viên đã trình bày sai về lợi nhuận mà cô ấy có thể đạt được trên thực tế cho\nkhách hàng của mình, vi phạm Tiêu chuẩn I(C), cấm các thành viên và ứng viên đảm bảo cho khách hàng\nbất kỳ lợi tức cụ thể nào từ các khoản đầu tư không ổn định.\nC. Không chính xác vì ủy quyền đầu tư không vi phạm Quy tắc và Tiêu chuẩn. Nhiệm vụ\nđược xác định rất rộng và mặc dù nó có thể phù hợp hoặc không, nhưng không có đủ thông tin\ntrong họa tiết để đưa ra quyết định này. Kết quả đã hứa nhưng chưa đạt được là\nvi phạm có thể được xác định rõ ràng.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":124,"q":"The GIPS standards:","opts":["allow the use of a representative account to present the firm's overall investment results.","require firms to present performance history that only includes accounts remaining at the firm.","establish a standardized approach to presenting historical investment results to prospective clients."],"ans":"C","expl":"A. Không chính xác vì theo tiêu chuẩn GIPS, các hành vi sai lệch bao gồm Tài khoản\nđại diện: Chọn danh mục đầu tư có hiệu suất cao nhất để thể hiện kết quả đầu tư tổng thể của công ty cho\nmột nhiệm vụ cụ thể. Do đó, tiêu chuẩn GIPS không cho phép sử dụng tài khoản\nđại diện để trình bày kết quả đầu tư tổng thể của công ty.\nB. Không chính xác vì việc trình bày lịch sử hiệu suất 'trung bình' loại trừ các danh mục đầu tư có\nhiệu suất kém đủ yếu để dẫn đến việc chấm dứt công ty được gọi là thành kiến\nsống sót và là một hành vi gây hiểu lầm khi trình bày dữ liệu hiệu suất đầu tư. Do đó,\ntrình bày lịch sử hoạt động chỉ bao gồm các tài khoản còn lại tại công ty (và loại trừ\ncác tài khoản đã rời khỏi công ty) là không chính xác\nC. Đúng vì tiêu chuẩn GIPS là một bộ nguyên tắc đạo đức do người thực hành định hướng\nthiết lập một cách tiếp cận được chuẩn hóa, toàn ngành để các công ty đầu tư tuân theo trong việc tính toán và\ntrình bày kết quả đầu tư lịch sử của họ cho khách hàng tiềm năng. Do đó, tiêu chuẩn GIPS\nthiết lập một cách tiếp cận tiêu chuẩn hóa đối với kết quả đầu tư để trình bày với các khách hàng tiềm năng trong quá khứ\nvà câu trả lời này là Định nghĩa đúng về công ty và\nCác tiêu chuẩn đạo đức và chuyên môn: mô tả các nguyên tắc cơ bản về tuân thủ, bao gồm\ncác khuyến nghị của tiêu chuẩn GIPS đối với định nghĩa về công ty và\nđịnh nghĩa của công ty tùy ý","qhtml":null},{"n":125,"q":"The GIPS standards were created to:","opts":["promote fair, global competition among investment firms.","eliminate the need for costly in-depth due diligence by investors.","serve as a mandatory performance standard for asset management firms in countries without investment performance regulation."],"ans":"A","expl":"A. Đúng vì mục tiêu của tiêu chuẩn GIPS như sau: Thúc đẩy sự cạnh tranh công bằng, toàn cầu\ngiữa các công ty đầu tư.\nB. Không chính xác vì các tiêu chuẩn GIPS chắc chắn không loại bỏ sự cần thiết phải có\nsự siêng năng chuyên sâu từ phía khách hàng hoặc nhà đầu tư, nhưng việc tuân thủ các Tiêu chuẩn sẽ nâng cao\nđộ tin cậy của các công ty quản lý đầu tư đã chọn thực hiện trách nhiệm này.\nC. Không chính xác vì việc tuân thủ các tiêu chuẩn GIPS là tự nguyện. Các cơ quan pháp luật hoặc quản lý thường không yêu cầu tuân thủ các tiêu chuẩn GIPS\n. Ngoài ra, lời mở đầu của tiêu chuẩn GIPS\nnói rằng bằng cách tuân thủ tiêu chuẩn toàn cầu, các công ty ở các quốc gia có tiêu chuẩn hiệu suất đầu tư tối thiểu hoặc không có\ncó thể cạnh tranh kinh doanh trên cơ sở bình đẳng với các công ty từ\ncác quốc gia có tiêu chuẩn phát triển hơn.\nDo đó, rõ ràng là các tiêu chuẩn GIPS không được tạo ra để phục vụ như một hiệu suất bắt buộc\ntiêu chuẩn dành cho các công ty quản lý tài sản ở các quốc gia không có quy định về hiệu suất đầu tư.\nTiêu chuẩn đạo đức và chuyên nghiệp: giải thích lý do tại sao các tiêu chuẩn GIPS được tạo ra, ai có thể yêu cầu\ntuân thủ và ai được hưởng lợi từ việc tuân thủ","qhtml":null},{"n":126,"q":"Jan Loots, CFA, quit his job as a portfolio manager at an investment firm with which he\nhad a non-solicitation agreement he signed several years ago. Loots received permission to\ntake his investment performance history with him and also took a copy of the firm's\nsoftware-trading platform. Subsequently, Loots sent out messages on social media sites\nannouncing he was looking for clients for his new investment management firm. Access to\nLoots' social media sites is restricted to friends, family, and former clients. Loots least likely\nviolated the CFA Institute Standards of Professional Conduct concerning his:","opts":["trading software.","non-solicitation agreement.","investment performance history."],"ans":"C","expl":"A. Không chính xác vì người quản lý danh mục đầu tư đã lấy tài sản của người chủ cũ, phần mềm giao dịch\nđộc quyền và vi phạm Tiêu chuẩn IV(A)-Loyalty. Mặc dù người quản lý đã tự tạo ra phần mềm\nnhưng đó là trong một khoảng thời gian mà người quản lý tài sản lớn đã thuê anh ta và\nphần mềm không phải là tài sản của anh ta.\nB. Không chính xác vì thành viên đã vi phạm Tiêu chuẩn IV(A)-Lòng trung thành vì anh ta không hành động vì lợi ích của\nchủ cũ của mình. Trong trường hợp này, thành viên này có thể gây tổn hại cho chủ cũ của mình nếu\ntin nhắn cuối tuần của anh ta khiến khách hàng chuyển sang cơ sở kinh doanh mới của anh ta.\nC. Đúng vì người quản lý danh mục đầu tư đã nhận được sự cho phép sử dụng lịch sử hiệu quả đầu tư\ntừ người chủ trước của mình. Thành viên này đã vi phạm thỏa thuận không chào mời của mình khi cho biết\nsự sẵn sàng của anh ấy với khách hàng mới trên một số trang truyền thông xã hội mà khách hàng của\nchủ cũ của anh ấy có thể truy cập. Đây là hành vi vi phạm Tiêu chuẩn IV(A)- Lòng trung thành vì anh ta đã không hành động vì lợi ích của\nngười chủ cũ của mình. Trong trường hợp này, thành viên có thể gây tổn hại cho chủ cũ của mình nếu tin nhắn\ncuối tuần của anh ta dẫn đến việc khách hàng chuyển từ chủ cũ sang hoạt động kinh doanh mới. Thành viên này cũng\nđã vi phạm tiêu chuẩn này bằng cách lấy tài sản, phần mềm giao dịch của chủ lao động\nTiêu chuẩn đạo đức và chuyên nghiệp: khuyến nghị các biện pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":127,"q":"Which of the following is a recommended procedure for compliance with the Standard\nrelating to help prevent misrepresentation by: misrepresentation? Firms can","opts":["specifically designating which employees are authorized to speak on behalf of the firm.","performing quarterly competence reviews of employees who deliver firm presentations to clients.","ensuring that each employee develops procedures for verifying information of third-party firms provided to clients."],"ans":"A","expl":"A. Đúng vì các quy trình được đề xuất để tuân thủ Tiêu chuẩn I (C),\nTrình bày sai, nêu rõ rằng cũng có thể giúp ngăn chặn hành vi xuyên tạc bằng cách chỉ định cụ thể\nnhân viên nào được phép phát biểu thay mặt cho công ty.\nB. Không chính xác vì các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I (C),\nTrình bày sai, nêu rõ các công ty mà các công ty có thể hỗ trợ các thành viên bằng cách xem xét định kỳ\ncác bản trình bày tương ứng của nhân viên về trình độ chuyên môn của cá nhân hoặc công ty. Việc thực hiện đánh giá năng lực\nhàng quý của những nhân viên thuyết trình công ty trước khách hàng không phải là quy trình\nđược khuyến nghị.\nC. Không chính xác vì các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I (C),\nTrình bày sai, nêu rõ rằng các thành viên và ứng viên nên khuyến khích người sử dụng lao động của họ\nphát triển các quy trình xác minh thông tin của các công ty bên thứ ba. Do đó, các công ty không nên\nthủ tục để đảm bảo mỗi nhân viên phát triển các quy trình xác minh\nthông tin của các công ty bên thứ ba cung cấp cho khách hàng.\nTiêu chuẩn đạo đức và chuyên nghiệp: khuyến nghị các thực tiễn và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":128,"q":"Which of the following is a recommended procedure for compliance with the Standard\nrelating to priority of transactions? Investment personnel should:","opts":["examine all personal trades for possible conflicts immediately after execution of the trades.","direct their brokers to supply their firms with duplicate confirmations of all their personal securities transactions.","make a one-time disclosure of holdings in which they have a beneficial interest to their firm upon commencement of the employment relationship."],"ans":"B","expl":"A. Không chính xác vì các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn VI (B), Mức độ ưu tiên\ngiao dịch, khuyến nghị nhân viên đầu tư nên kiểm tra tất cả các giao dịch cá nhân theo kế hoạch để\nxác định các xung đột có thể xảy ra trước khi thực hiện giao dịch. Do đó, một quy trình được đề xuất\nđể tuân thủ Tiêu chuẩn là kiểm tra tất cả các giao dịch cá nhân được thực hiện trước [không\nngay sau khi] thực hiện giao dịch\nB. Đúng vì các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn VI (B), Mức độ ưu tiên của\nCác giao dịch được kiểm tra rằng nhân viên đầu tư phải được yêu cầu chỉ đạo các nhà môi giới của họ\ncung cấp cho các công ty bản sao hoặc xác nhận của tất cả các giao dịch chứng khoán cá nhân của họ và\nbản sao báo cáo định kỳ cho tất cả các tài khoản chứng khoán\nC. Không chính xác vì các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn VI (B), Mức độ ưu tiên\ngiao dịch, khuyến nghị rằng việc tiết lộ thông tin của nhân viên đầu tư cho công ty phải được thực hiện khi\nbắt đầu mối quan hệ việc làm và ít nhất hàng năm sau đó & Do đó,\nthủ tục được khuyến nghị để tuân thủ Tiêu chuẩn là tiết lộ khi bắt đầu\nmối quan hệ việc làm và ít nhất hàng năm sau đó [không phải tiết lộ một lần về\nchỉ bắt đầu làm việc]\nTiêu chuẩn đạo đức và nghề nghiệp: khuyến nghị các thực hành và quy trình được thiết kế để ngăn ngừa\nvi phạm Quy tắc đạo đức và Chuẩn mực ứng xử nghề nghiệp","qhtml":null},{"n":129,"q":"Which of the following is a recommended procedure for compliance with the Standard\nrelating to suitability?\nProcedure 1: An investor's objectives and constraints should be reviewed annually unless\nthere is a reason that dictates more frequent review.\nProcedure 2: A member in an investment advisory relationship with clients should take into\nconsideration performance measurement benchmarks in formulating an investment policy\nstatement.","opts":["Procedure 1 only.","Procedure 2 only.","Both Procedure 1 and Procedure 2."],"ans":"C","expl":"A. Không chính xác vì vì, như được mô tả trong phần giải thích cho câu trả lời đúng, cả Quy trình 1 và\nQuy trình 2 đều là các quy trình được khuyến nghị\nB. Không chính xác vì vì, như được mô tả trong phần cơ bản cho câu trả lời đúng, cả Quy trình 2 và\nQuy trình 1 đều là các quy trình được đề xuất.\nC. Đúng vì các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn III(C), Sự phù hợp,\n nêu rõ rằng các mục tiêu và ràng buộc của nhà đầu tư cần được duy trì và xem xét định kỳ để\nphản ánh bất kỳ thay đổi nào trong hoàn cảnh của chent. Việc đánh giá hàng năm là hợp lý trừ khi lý do kinh doanh hoặc\nchẳng hạn như sự thay đổi lớn trong điều kiện thị trường, yêu cầu phải xem xét thường xuyên hơn. Ngoài ra, khi xây dựng chính sách đầu tư cho khách hàng, thành viên của ứng viên nên xem xét\nthông tin sau đây xem xét các tiêu chuẩn đo lường hiệu suất. Do đó, cả hai pcccddures đều được\nnên tuân thủ Tiêu chuẩn III(C)\nTiêu chuẩn đạo đức và nghề nghiệp: đề xuất các phương pháp và quy trình.designad để ngăn chặn\ncác phiếu bầu về Quy tắc dân tộc và các tiêu chuẩn về hành vi chuyên nghiệp","qhtml":null},{"n":130,"q":"According to the Standard related to independence and objectivity, a member must:","opts":["refuse all business-related gifts.","adhere to strict standards of conduct that govern how issuer-paid research is conducted.","pay for transportation, hotel and meal expenses when attending meetings at an issuer's headquarters."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn I(B), Tính độc lập và khách quan, các thành viên\nđược phép nhận quà tặng liên quan đến hoạt động kinh doanh bằng token. Theo Tiêu chuẩn, các thành viên và ứng viên phải\nhạn chế việc nhận tiền thưởng và/hoặc quà tặng đối với các vật phẩm mang tính biểu tượng. Các công ty nên xem xét giới hạn giá trị nghiêm ngặt\nđối với quà tặng được chấp nhận dựa trên phong tục địa phương hoặc khu vực và nên giải quyết xem\ngiới hạn này là cho mỗi món quà hay giá trị tổng hợp hàng năm.\nB. Đúng vì đây là yêu cầu của Tiêu chuẩn I(B), Tính độc lập và khách quan. Tuy nhiên, nghiên cứu\ndo nhà phát hành thanh toán được thực hiện bởi các nhà phân tích độc lập có nhiều xung đột tiềm ẩn. Các thành viên\nphải tuân thủ các tiêu chuẩn ứng xử nghiêm ngặt chi phối cách tiến hành nghiên cứu và\nnhững thông tin nào phải được tiết lộ trong báo cáo. Các nhà phân tích phải tham gia vào quá trình phân tích kỹ lưỡng, độc lập và\nkhông thiên vị, đồng thời phải tiết lộ đầy đủ các xung đột lợi ích tiềm ẩn, bao gồm cả bản chất của\nthù lao của họ.\nC. Không chính xác vì theo Tiêu chuẩn I(B), Độc lập và Khách quan, khuyến nghị\n(không bắt buộc) các thành viên phải thanh toán chi phí đi lại thương mại và khách sạn, chứ không phải tiền ăn, khi\ntham dự các cuộc họp tại trụ sở của tổ chức phát hành.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề chuyên môn tính toàn vẹn","qhtml":null},{"n":131,"q":"A member most likely violates the Standard relating to knowledge of the law if she fails to:","opts":["dissociate from unethical conduct.","report illegal activity to the appropriate regulatory organization.","have detailed knowledge of all the laws potentially governing her professional activities."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn I(A), Kiến thức về Pháp luật, các thành viên và ứng viên có\ntrách nhiệm từ bỏ và tách khỏi hoạt động [phi đạo đức]. Việc không hành động kết hợp với\ntiếp tục liên kết với những người liên quan đến hành vi bất hợp pháp hoặc phi đạo đức có thể được hiểu là\ntham gia hoặc hỗ trợ vào hành vi bất hợp pháp hoặc phi đạo đức\nB. Không chính xác vì theo Tiêu chuẩn I(A), Kiến thức về Luật, việc không báo cáo ít có khả năng bị\ncoi là vi phạm hơn là không tách khỏi hành vi phi đạo đức, tác động của việc không hoạt động\nđến tính liêm chính của thị trường vốn có thể là đáng kể. Mặc dù Quy tắc và Tiêu chuẩn không bắt buộc\nthành viên và ứng viên báo cáo hành vi vi phạm cho các tổ chức chính phủ hoặc cơ quan quản lý của họ...,\nviệc tiết lộ như vậy có thể thận trọng trong một số trường hợp nhất định.\nC. Không chính xác vì theo Tiêu chuẩn I(A), Kiến thức về Pháp luật, trong khi các thành viên và ứng viên\nphải hiểu luật và quy định hiện hành của các quốc gia và khu vực pháp lý nơi họ\ntham gia vào các hoạt động nghề nghiệp, thì các thành viên và ứng viên không bắt buộc phải có kiến thức\nchi tiết hoặc phải là chuyên gia về tất cả các luật có khả năng chi phối hoạt động của họ.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc của Đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":132,"q":"Recommended procedures for compliance with the Standard relating to responsibilities\nof supervisors include:","opts":["encouraging employers to provide a copy of the firm's code of ethics to clients.","requiring firms to adopt the CFA Code of Ethics and Standards of Professional Conduct.","consolidating a code of ethics and specific policies and procedures to ensure compliance."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn IV(C), Trách nhiệm của Kiểm soát viên, thành viên và ứng viên\nnên khuyến khích người sử dụng lao động cung cấp quy tắc của họ cho khách hàng... quy tắc đạo đức sẽ được\nhiệu quả trong việc truyền đạt rằng công ty cam kết tiến hành kinh doanh một cách có đạo đức và\nlợi ích tốt nhất của khách hàng.\nB. Không chính xác vì theo Tiêu chuẩn IV(C), Trách nhiệm của Kiểm soát viên, thành viên và ứng viên\nđược khuyến khích đề nghị [không yêu cầu] người sử dụng lao động của họ áp dụng quy tắc đạo đức. Nhận con nuôi\nquy tắc đạo đức là rất quan trọng để thiết lập nền tảng đạo đức vững chắc cho các công ty tư vấn đầu tư\nvà nhân viên của họ.\nC. Không chính xác vì Ngôn ngữ riêng biệt không chính xác vì theo Tiêu chuẩn IV(C), Trách nhiệm của Người giám sát,\ncác thành viên được khuyến khích áp dụng quy tắc đạo đức từ các thủ tục tuân thủ. Mã độc lập\nđạo đức phải được viết rõ ràng và đề cập đến các khái niệm chung về ủy thác. Họ nên\nkhông bị cản trở bởi nhiều thủ tục chi tiết\nTiêu chuẩn đạo đức và nghề nghiệp: khuyến nghị các thực hành và quy trình được thiết kế để ngăn ngừa\nvi phạm Quy tắc đạo đức và Chuẩn mực ứng xử nghề nghiệp","qhtml":null},{"n":133,"q":"According to the GIPS standards, verification must be performed:","opts":["with respect to an entire firm.","on specific composites of a firm.","by a firm's compliance department."],"ans":"A","expl":"A. Đúng vì việc xác minh được thực hiện đối với toàn bộ công ty chứ không phải trên các tổ hợp\ncụ thể hoặc quỹ gộp.\nB. Không chính xác vì việc xác minh được thực hiện đối với toàn bộ công ty, không phải trên các tổ hợp\ncụ thể hoặc quỹ gộp\nC. Không chính xác vì việc xác minh phải được thực hiện bởi bên thứ ba độc lập. Một công ty không thể\ntự thực hiện việc xác minh của mình.\nTiêu chuẩn đạo đức và chuyên nghiệp: mô tả khái niệm xác minh độc lập","qhtml":null},{"n":134,"q":"A member leaves her employer to start at a new firm. According to the Standards, at her\nnew firm, the member is permitted to recreate supporting records of her work at her\nprevious employer from:","opts":["memory.","sources obtained at the previous employer.","information provided directly by the covered company."],"ans":"C","expl":"A. Không chính xác vì điều này không được phép theo Tiêu chuẩn V(C), Lưu giữ Bản ghi. Để sử dụng trong tương lai,\nthành viên hoặc ứng viên phải tạo lại các hồ sơ hỗ trợ tại công ty mới với thông tin\nđược thu thập thông qua các nguồn công cộng hoặc trực tiếp từ công ty được liên kết chứ không phải từ bộ nhớ hoặc\ncác nguồn thu được từ nhà tuyển dụng trước đó.\nB. Không chính xác vì điều này không được phép theo Tiêu chuẩn V(C), Lưu giữ Bản ghi. Để sử dụng trong tương lai,\nthành viên hoặc ứng viên phải tạo lại các hồ sơ hỗ trợ tại công ty mới với thông tin\nđược thu thập thông qua các nguồn công khai hoặc trực tiếp từ công ty được liên kết chứ không phải từ bộ nhớ hoặc\ncác nguồn thu được từ nhà tuyển dụng trước đó.\nC. Đúng vì điều này phù hợp với Tiêu chuẩn V(C), Lưu giữ bản ghi. Để sử dụng trong tương lai,\nthành viên hoặc ứng viên phải tạo lại hồ sơ hỗ trợ tại công ty mới với thông tin\nđược thu thập thông qua các nguồn công cộng hoặc trực tiếp từ công ty được liên kết chứ không phải từ bộ nhớ hoặc\ncác nguồn thu được từ nhà tuyển dụng trước đó.\nTiêu chuẩn đạo đức và chuyên nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":135,"q":"According to the GIPS standards, verification:","opts":["is performed on a firm-wide basis.","must be performed by a firm's compliance department.","ensures the accuracy of specific composite presentations."],"ans":"A","expl":"A. Đúng vì việc xác minh được thực hiện đối với toàn bộ công ty chứ không phải trên các tổ hợp\ncụ thể.\nB. Không chính xác vì việc xác minh các tiêu chuẩn GIPS phải được thực hiện bởi bên thứ ba chứ không phải chính công ty\n. việc xác minh phải được thực hiện bởi bên thứ ba độc lập. Một công ty không thể thực hiện\nxác minh của riêng mình.\nC. Không chính xác vì việc xác minh không đảm bảo tính chính xác của bất kỳ bản trình bày\ntổng hợp cụ thể nào.\nTiêu chuẩn đạo đức và nghề nghiệp: mô tả khái niệm xác minh độc lập","qhtml":null},{"n":136,"q":"Verification provides assurance that which of the following have been designed in\ncompliance with the GIPS standards? and pooled fund maintenance.","opts":["Only the calculation and presentation of the firm's performance.","Only the firm's policies related to composite and pooled fund maintenance.","Both the calculation and presentation of the firm's performance"],"ans":"C","expl":"A. Không chính xác vì thiết kế của cả tính toán hiệu quả hoạt động và các chính sách của công ty liên quan đến việc duy trì quỹ gộp\nđược đảm bảo bởi người xác minh GIPS: việc xác minh cung cấp sự đảm bảo về việc liệu các chính sách và thủ tục của công ty\nliên quan đến việc duy trì quỹ tổng hợp và quỹ gộp, cũng như\nviệc tính toán, trình bày và phân phối hiệu suất có được thiết kế tuân thủ\ncác tiêu chuẩn GIPS và đã được triển khai trên toàn công ty hay không cơ sở\nB. Không chính xác vì thiết kế của cả tính toán hiệu quả hoạt động và các chính sách của công ty liên quan đến việc duy trì quỹ gộp\nđược đảm bảo bởi người xác minh GIPS: việc xác minh cung cấp sự đảm bảo về việc liệu các chính sách và thủ tục của công ty\nliên quan đến việc duy trì quỹ tổng hợp và quỹ gộp, cũng như\nviệc tính toán, trình bày và phân phối hiệu suất có được thiết kế tuân thủ\ncác tiêu chuẩn GIPS và đã được triển khai trên toàn công ty hay không cơ sở.\nC. Đúng vì việc xác minh mang lại sự đảm bảo về việc liệu các chính sách và thủ tục của công ty\nliên quan đến việc duy trì quỹ tổng hợp và quỹ gộp, cũng như việc tính toán, trình bày và\nphân phối hiệu quả hoạt động có được thiết kế tuân thủ các tiêu chuẩn GIPS và\nđược triển khai trên cơ sở toàn công ty\nTiêu chuẩn đạo đức và chuyên nghiệp: mô tả khái niệm xác minh độc lập","qhtml":null},{"n":137,"q":"Sue Yong, CFA, is an analyst at a large investment firm. After thorough research, she\nissues a \"buy\" rating on a company and submits her report to her firm's investment\ncommittee for review. The committee disagrees with Yong's assumptions in the report. As a\nresult, the report is changed to a \"neutral\" rating. The final report is issued and Yong agrees\nto leave her name on the report. Has Yong violated the Standards?","opts":["No.","Yes, the Standard relating to loyalty, prudence, and care.","Yes, the Standard relating to diligence and reasonable basis."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn V (A), Sự siêng năng và Cơ sở hợp lý, các Thành viên và\nỨng viên phải\n1. Thực hiện sự siêng năng, độc lập và kỹ lưỡng trong việc phân tích các khoản đầu tư, đưa ra các khuyến nghị\nđầu tư và thực hiện các hành động đầu tư\n2. Có cơ sở hợp lý và đầy đủ, được hỗ trợ bởi nghiên cứu và điều tra phù hợp, cho\nbất kỳ phân tích, khuyến nghị hoặc hành động đầu tư nào.\nNgoài ra, kết quả nghiên cứu không phải lúc nào cũng rõ ràng và những người khác nhau có thể có\ný kiến ​​khác nhau dựa trên cùng một bằng chứng thực tế. Trong trường hợp này, ủy ban có thể có lý do chính đáng để\nđưa ra một báo cáo khác với nghiên cứu ban đầu của nhà phân tích. Công ty có thể phát hành một báo cáo\nkhác với báo cáo ban đầu của nhà phân tích miễn là có cơ sở hợp lý và đầy đủ\ncho kết luận của mình\nNói chung, các nhà phân tích phải viết báo cáo nghiên cứu phản ánh quan điểm của riêng họ và có thể yêu cầu công ty\nkhông nêu tên họ trên các báo cáo cuối cùng khác với quan điểm đó. Tuy nhiên, khi công việc là nỗ lực của nhóm\n, không phải tất cả các thành viên trong nhóm đều có thể đồng ý với tất cả các khía cạnh của báo cáo. Cuối cùng,\ncác thành viên và ứng cử viên có thể yêu cầu xóa tên khỏi báo cáo, nhưng nếu họ\nhài lòng rằng quy trình đã đưa ra kết quả hoặc kết luận có cơ sở\nhợp lý và đầy đủ, thì các thành viên và ứng viên không cần phải tách khỏi báo cáo ngay cả khi họ không\nđồng ý với nội dung của nó.\nYong đã rất kỹ lưỡng trong nghiên cứu của cô ấy và Không có bằng chứng nào cho thấy rằng cô ấy không có cơ sở hợp lý và đầy đủ cho khuyến nghị của mình. Ngoài ra, không có hành vi vi phạm tiêu chuẩn\nliên quan đến lòng trung thành, sự thận trọng và cẩn thận.\nB. Không chính xác vì theo Tiêu chuẩn III (A), các Thành viên Trung thành, Thận trọng và Chăm sóc và\ncác Ứng viên có nghĩa vụ trung thành với khách hàng của mình và phải hành động một cách thận trọng và thực hiện\nsự phán đoán thận trọng. Các Thành viên và Ứng viên phải hành động vì lợi ích của khách hàng và đặt\nlợi ích của khách hàng lên trên lợi ích của chủ lao động hoặc lợi ích của chính họ. Ngược lại, trường hợp này là về\nliệu Yong có phân tích kỹ lưỡng hay không. Trường hợp này không thuộc Tiêu chuẩn III (A). Vì vậy,\nTiêu chuẩn III (A) không bị vi phạm.\nC. Không chính xác vì Yong đã không vi phạm Tiêu chuẩn này như được mô tả trong cơ sở lý luận cho câu trả lời\nđúng.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":138,"q":"According to the Standard relating to independence and objectivity, which of the\nfollowing is accurate?\nStatement A member should encourage her firm to remove a covered company from a\nrestricted list if the firm is unwilling to permit dissemination of an adverse opinion about the\ncompany.\nStatement A member is prohibited from accepting benefits from corporate issuers in the form\nof allocation of shares in oversubscribed IPOS suitable for firm's clients.","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"ans":"B","expl":"A. Không chính xác vì theo các quy trình được đề xuất để tuân thủ Tiêu chuẩn I (B),\nTính độc lập và khách quan, nếu công ty không sẵn lòng cho phép phổ biến các ý kiến ​​bất lợi\nvề một khách hàng doanh nghiệp, các thành viên và ứng viên nên khuyến khích công ty loại bỏ\ncông ty gây tranh cãi khỏi phạm vi nghiên cứu và đưa nó vào danh sách hạn chế để công ty\nchỉ phổ biến thông tin thực tế về công ty. Do đó, thành viên nên khuyến khích\ncông ty của mình đưa một công ty vào (không loại bỏ công ty khỏi) danh sách hạn chế nếu công ty đó không sẵn lòng\ncho phép phổ biến quan điểm bất lợi về công ty. Vì vậy, Tuyên bố 1 là không chính xác.\nB. Đúng vì theo Tiêu chuẩn I (B), Tính độc lập và khách quan, một loại lợi ích là\nviệc phân bổ cổ phần trong các đợt IPO được đăng ký vượt mức cho các nhà quản lý đầu tư đối với tài khoản cá nhân của họ.\nThực tiễn này mang lại cho các nhà quản lý cơ hội kiếm được lợi nhuận nhanh chóng mà\nkhách hàng của họ có thể không có được. Hành vi như vậy bị cấm theo Tiêu chuẩn I (B) Do đó, một thành viên bị cấm\nnhận lợi ích từ các tổ chức phát hành doanh nghiệp dưới hình thức phân bổ cổ phiếu trong các đợt IPO được đăng ký vượt mức\n phù hợp với khách hàng của công ty. Vì vậy, Tuyên bố 2 là chính xác\nC. Không chính xác vì theo các quy trình được đề xuất để tuân thủ Tiêu chuẩn I (B),\nTính độc lập và khách quan, nếu công ty không sẵn lòng cho phép phổ biến các ý kiến ​​bất lợi\nvề một khách hàng doanh nghiệp, các thành viên và ứng viên nên khuyến khích công ty loại bỏ\ncông ty gây tranh cãi khỏi phạm vi nghiên cứu và đưa nó vào danh sách hạn chế để công ty\nchỉ phổ biến thông tin thực tế về công ty. Do đó, một thành viên nên khuyến khích\ncông ty của mình đưa một công ty vào (không loại bỏ công ty khỏi) danh sách hạn chế nếu công ty đó không sẵn lòng\ncho phép phổ biến quan điểm bất lợi về công ty. Vì vậy, Tuyên bố 1 không chính xác.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":139,"q":"Rita Melmo, CFA, is an analyst at a Greensky Investment (GI). On weekends, she works\nas a paid employee of a local charity where she negotiates purchase agreements. Melmo\ndoes not disclose the charity employment to GI. Melmo is asked to purchase a new truck for\nthe charity and she negotiates a purchase agreement with a local truck dealership. In the\npurchase agreement, the charity is charged $500 more than the truck's normal sale price. In\nreturn, Melmo receives retail vouchers worth $500 from the dealership for her private use.\nMelmo has most likely violated the Standards:","opts":["only by failing to disclose the charity employment to Gl.","only by negotiating a purchase agreement in which the charity is charged more than the truck's normal sale price.","both by failing to disclose the charity employment to Gl and by negotiating a purchase agreement in which the charity is charged more than the truck's normal sale price."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn IV (A), Lòng trung thành, trong các vấn đề liên quan đến việc làm của họ,\nCác Thành viên và Ứng viên phải hành động vì lợi ích của người sử dụng lao động và không tước đoạt quyền lợi của người sử dụng lao động của họ\nlợi thế về kỹ năng và khả năng của họ, tiết lộ thông tin bí mật hoặc gây ra\ngây tổn hại cho chủ nhân của họ. Làm việc vào cuối tuần cho một tổ chức từ thiện để thực hiện những nhiệm vụ không mang tính cạnh tranh\nngười sử dụng lao động có vai trò đầu tư của cô ấy không vi phạm Tiêu chuẩn này\nB. Đúng vì theo Tiêu chuẩn I (D), Hành vi sai trái, Thành viên và Ứng viên không được\ntham gia vào bất kỳ hành vi chuyên môn nào liên quan đến sự không trung thực, gian lận hoặc lừa dối hoặc thực hiện bất kỳ hành động nào\nphản ánh tiêu cực đến danh tiếng nghề nghiệp, tính chính trực hoặc năng lực của họ. Sạc quá mức\ntừ thiện bằng bất kỳ số tiền nào đều là gian lận và phản ánh tiêu cực đến Melmo với tư cách là một chuyên gia đầu tư và\ncó thể ảnh hưởng đến người sử dụng lao động của cô ấy và nghề đầu tư.\nC. Không chính xác vì theo Tiêu chuẩn I (D), Hành vi sai trái, Thành viên và Ứng viên không được\ntham gia vào bất kỳ hành vi chuyên môn nào liên quan đến sự không trung thực, gian lận hoặc lừa dối hoặc thực hiện bất kỳ hành động nào\nphản ánh tiêu cực đến danh tiếng nghề nghiệp, tính chính trực hoặc năng lực của họ. Hơn nữa, và theo\ntheo Tiêu chuẩn IV (A), Lòng trung thành, trong các vấn đề liên quan đến việc làm của mình, các Thành viên và Ứng viên phải\nhành động vì lợi ích của người sử dụng lao động và không tước đi lợi thế về kỹ năng của họ\nvà khả năng, tiết lộ thông tin bí mật hoặc gây tổn hại cho người sử dụng lao động của họ. Đang làm việc\nvào cuối tuần để làm từ thiện cũng không vi phạm Tiêu chuẩn. Tuy nhiên, việc thu phí từ thiện quá cao là\ngian lận và phản ánh bất lợi về Melmo với tư cách là một chuyên gia đầu tư và có khả năng về cô ấy\nngười sử dụng lao động và về nghề đầu tư.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":140,"q":"According to the Standard relating to disclosure of conflicts, a member should:","opts":["reject a board position in a company on which the member's firm is planning to initiate a research report.","ensure that her firm discloses to clients any rebates received from the service fee some classes of mutual funds charge to investors.","place a company on a restricted list and issue factual information about the company if the member's firm holds options on the company's shares."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn VI(A), Tiết lộ xung đột, khi các thành viên hoặc\ncung cấp dịch vụ đầu tư cũng đóng vai trò là giám đốc, họ phải được tách biệt khỏi những người\nđưa ra quyết định đầu tư bằng cách sử dụng tường lửa hoặc các hạn chế tương tự. Tiêu chuẩn VI(A) bảo vệ\nnhà đầu tư và người sử dụng lao động bằng cách cho phép các thành viên và ứng viên tiết lộ đầy đủ cho khách hàng, khách hàng\ntiềm năng và người sử dụng lao động tất cả các thông tin thực tế và xung đột lợi ích tiềm ẩn. Khi một thành viên hoặc ứng viên đã\ntiết lộ đầy đủ thông tin về chủ lao động, khách hàng của thành viên hoặc ứng viên đó. và các khách hàng tiềm năng sẽ có\nthông tin được cung cấp để đánh giá hành động tạm ứng đầu tư hoàn toàn được thực hiện thay mặt cho họ\n. Vì vậy, với việc tiết lộ chấp nhận vị trí tích trữ là acceplebie\nB. Đúng vì theo Tiêu chuẩn VI(A), Tiết lộ xung đột, điều quan trọng không kém là việc\ntiết lộ các thỏa thuận trong đó công ty được hưởng lợi trực tiếp từ các khuyến nghị đầu tư.\nXung đột lợi ích rõ ràng là việc giảm một phần phí dịch vụ mà một số loại quỹ tương hỗ\ntính cho các nhà đầu tư. Các thành viên và ứng viên phải đảm bảo rằng công ty của họ tiết lộ những mối quan hệ\nnhư vậy để khách hàng có thể hiểu đầy đủ chi phí đầu tư của họ và những lợi ích mà người sử dụng lao động của người quản lý đầu tư của họ nhận được\nC. Không chính xác vì theo quy trình được khuyến nghị để tuân thủ Tiêu chuẩn VI(A),\nTiết lộ xung đột, nếu một thành viên, một ứng cử viên hoặc công ty của một thành viên hoặc công ty của ứng viên có\nquyền chọn đại lý để mua cổ phiếu như một phần của gói thù lao cho các hoạt động tài chính doanh nghiệp,\nsố tiền và ngày hết hạn của các quyền chọn này phải được tiết lộ dưới dạng chú thích cuối trang cho bất kỳ báo cáo nghiên cứu\ndo công bố công ty của thành viên hoặc ứng viên. Do đó, thành viên không cần đưa\ncông ty vào danh sách hạn chế và cung cấp thông tin thực tế về công ty nếu công ty của thành viên\nnắm giữ quyền chọn cổ phiếu của công ty\nTiêu chuẩn đạo đức và nghề nghiệp: khuyến nghị các thực hành và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":141,"q":"Which of the following is a recommended procedure for compliance with the Standard\nrelating to priority of transactions?\nProcedure 1: Members should disclose personal transactions relating to shares in their firm's\nresearch universe to clients upon request.\nProcedure 2: Members should establish blackout periods prior to trades for clients.\nProcedure 3: Members should treat fee-paying family accounts in which they have beneficial\nownership in the same manner as they would treat their personal accounts.","opts":["Procedure 1","Procedure 2","Procedure 3"],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn VI(B), Mức độ ưu tiên của giao dịch, các thành viên và ứng viên\nphải tiết lộ đầy đủ cho nhà đầu tư các chính sách của công ty họ về đầu tư cá nhân. Thông tin\nvề các chính sách và hoạt động đầu tư cá nhân của nhân viên sẽ thúc đẩy bầu không khí công bố đầy đủ và\nđầy đủ, đồng thời xoa dịu những lo ngại chính đáng của công chúng về xung đột lợi ích\ndo giao dịch cá nhân của nhân viên đầu tư gây ra.\nB. Đúng vì theo Tiêu chuẩn VI(B), Mức độ ưu tiên của giao dịch, nhân viên đầu tư\ntham gia vào quá trình ra quyết định đầu tư phải thiết lập khoảng thời gian tạm dừng trước khi giao dịch\ncho khách hàng để người quản lý không thể tận dụng kiến ​​thức của họ về hoạt động của khách hàng bằng cách \"chạy trước\" các giao dịch của khách hàng (giao dịch cho tài khoản cá nhân của một người trước khi giao dịch cho tài khoản khách hàng)\nC. Không chính xác vì theo Tiêu chuẩn VI(B ), Mức độ ưu tiên của giao dịch, các thành viên hoặc ứng viên\ncó thể thực hiện các giao dịch trong tài khoản mà họ là chủ sở hữu hưởng lợi chỉ sau khi khách hàng\nvà người sử dụng lao động của họ có đủ cơ hội để hành động theo khuyến nghị. Các tài khoản gia đình\nlà tài khoản khách hàng phải được đối xử giống như bất kỳ tài khoản công ty nào khác và không được đối xử\nđặc biệt cũng như không bị thiệt thòi vì mối quan hệ gia đình.\nTiêu chuẩn đạo đức và nghề nghiệp: khuyến nghị các thực hành và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":142,"q":"Susana Garcia, CFA, is a widely respected analyst covering the transportation sector. She\ncompletes a new recommendation for a company. The next morning, she emails the\nrecommendation to her firm's largest client. After lunch, she emails the recommendation to\nall other firm clients. One hour later, she calls the largest client to discuss the\nrecommendation in detail. Garcia has violated the Standard relating to fair dealing:","opts":["only by calling the largest client to discuss the recommendation in detail.","only by emailing the recommendation to the largest client prior to sending it to all other clients.","both by calling the largest client to discuss the recommendation in detail and by emailing the recommendation to the largest client prior to sending it to all other clients."],"ans":"B","expl":"A. Không chính xác vì Garcia đã không vi phạm Tiêu chuẩn III (B), Giao dịch công bằng, khi gọi điện cho khách hàng lớn nhất của mình,\nvì cô ấy đã phổ biến rộng rãi đề xuất và cung cấp thông tin cho tất cả khách hàng của mình\ntrước khi thảo luận về vấn đề đó với khách hàng lớn nhất của mình. Các thành viên và ứng viên nên thiết lập các thủ tục\nvề thời điểm phổ biến các khuyến nghị đầu tư để tất cả khách hàng đều được đối xử công bằng-\nnghĩa là được thông báo gần như cùng một lúc. Sau khi việc phân phối này diễn ra,\nthành viên hoặc ứng viên có thể theo dõi riêng với từng khách hàng, nhưng các thành viên và ứng viên\nkhông nên cung cấp trước thông tin cho khách hàng ưu tiên khi thông báo trước đó có thể\ngây bất lợi cho các khách hàng khác.\nB. Đúng vì Garcia đã vi phạm Tiêu chuẩn III (B), Giao dịch công bằng, bằng cách phổ biến đề xuất bán\ncho khách hàng lớn nhất của cô ấy trước khi đề xuất được gửi đến tất cả khách hàng. Mỗi thành viên\nhoặc ứng viên có nghĩa vụ đảm bảo rằng thông tin được phổ biến theo cách mà tất cả khách hàng\ncó cơ hội công bằng để thực hiện mọi đề xuất. Garcia đã không vi phạm Tiêu chuẩn III (B) khi\ngọi điện cho khách hàng lớn nhất của mình, vì cô đã phổ biến rộng rãi đề xuất và cung cấp\nthông tin cho tất cả khách hàng của mình trước khi thảo luận với khách hàng lớn nhất của mình. Các thành viên và ứng viên\nnên thiết lập các quy trình về thời gian phổ biến các khuyến nghị đầu tư để\ntất cả khách hàng đều được đối xử công bằng - nghĩa là được thông báo gần như cùng một lúc. Sau khi việc phân phối\nnày diễn ra, thành viên hoặc ứng viên có thể theo dõi riêng với từng khách hàng,\nnhưng các thành viên và ứng viên không được cung cấp thông tin trước cho khách hàng ưu tiên khi thông báo trước đó\ncó thể gây bất lợi cho các khách hàng khác.\nC. Không chính xác vì Garcia đã không vi phạm Tiêu chuẩn III (B), Giao dịch công bằng, khi gọi điện cho khách hàng lớn nhất của mình,\nvì cô ấy đã phổ biến rộng rãi đề xuất và cung cấp thông tin cho tất cả khách hàng của mình\ntrước khi thảo luận về vấn đề đó với khách hàng lớn nhất của mình. Các thành viên và ứng viên nên thiết lập các thủ tục\nvề thời điểm phổ biến các khuyến nghị đầu tư để tất cả khách hàng đều được đối xử công bằng-\nnghĩa là được thông báo gần như cùng một lúc. Sau khi việc phân phối này diễn ra,\nthành viên hoặc ứng viên có thể theo dõi riêng với từng khách hàng, nhưng các thành viên và ứng viên\nkhông nên cung cấp trước thông tin cho những khách hàng được ưu ái khi thông báo trước đó có thể\ngây bất lợi cho các khách hàng khác\nTiêu chuẩn đạo đức và chuyên môn: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề chuyên môn tính toàn vẹn","qhtml":null},{"n":143,"q":"In the absence of regulatory guidance or firm policies, CFA Institute recommends\nmaintaining records for at least:","opts":["three years.","five years.","seven years."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn V (C), Phân tích đầu tư, Khuyến nghị và\nHành động - Lưu giữ hồ sơ, Cơ quan quản lý địa phương thường áp đặt các yêu cầu phải tuân thủ đối với các thành viên, ứng viên,\nvà công ty của họ liên quan đến việc lưu giữ hồ sơ. Các công ty cũng có thể triển khai các chính sách\nchi tiết về khung thời gian áp dụng để lưu giữ hồ sơ nghiên cứu và liên lạc với khách hàng.\nViệc đáp ứng các yêu cầu pháp lý và công ty như vậy đáp ứng các yêu cầu của Tiêu chuẩn V(C). Do\nthiếu hướng dẫn quy định hoặc chính sách công ty, Viện CFA khuyến nghị duy trì hồ sơ về\nít nhất bảy năm\nB. Không chính xác vì Không chính xác vì theo Tiêu chuẩn V (C), Phân tích Đầu tư,\nKhuyến nghị và Hành động - Lưu giữ Hồ sơ. Các cơ quan quản lý địa phương thường áp đặt các yêu cầu phải tuân thủ\nthành viên, ứng viên và công ty của họ liên quan đến việc lưu giữ thẻ. Các công ty\ncũng có thể triển khai các chính sách không tuân thủ khung thời gian áp dụng để lưu giữ hồ sơ liên lạc của nghiên cứu và khách hàng\n. Việc đáp ứng các yêu cầu pháp lý và công ty như vậy đáp ứng các yêu cầu\ncủa Tiêu chuẩn V(C). Trong trường hợp không có hướng dẫn pháp lý hoặc chính sách của công ty, Viện CFA khuyến nghị\nduy trì hồ sơ trong ít nhất bảy năm\nC. Đúng vì theo Tiêu chuẩn V (C), Phân tích đầu tư, Khuyến nghị và Hành động\n- Lưu giữ hồ sơ, Cơ quan quản lý địa phương thường áp đặt các yêu cầu phải tuân thủ đối với các thành viên, ứng cử viên và\ncông ty của họ liên quan đến việc lưu giữ hồ sơ. Các công ty cũng có thể triển khai các chính sách nêu chi tiết\nkhung thời gian áp dụng để lưu giữ hồ sơ nghiên cứu và liên lạc với khách hàng. Việc đáp ứng\ncác yêu cầu pháp lý và vững chắc như vậy đáp ứng các yêu cầu của Tiêu chuẩn V(C). Trong trường hợp không có\nhướng dẫn quản lý hoặc chính sách của công ty, Viện CFA khuyến nghị duy trì hồ sơ trong ít nhất\nbảy năm\nTiêu chuẩn đạo đức và nghề nghiệp: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":144,"q":"The Standards require a member to inform which of the following parties of any benefit\nreceived for referrals of clients?","opts":["Only his employer.","Only his potential clients.","Both his employer and his potential clients."],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn VI (C), Phí giới thiệu, quy định trách nhiệm của các thành viên và\ntrong việc thông báo cho chủ lao động, khách hàng và khách hàng tiềm năng của họ về bất kỳ lợi ích nào nhận được từ\ngiới thiệu của khách hàng và khách hàng. Do đó, thành viên phải thông báo cho chủ lao động của mình và các khách hàng\ntiềm năng của mình.\nB. Không chính xác vì Tiêu chuẩn VI (C), Phí giới thiệu, quy định trách nhiệm của các thành viên và\ntrong việc thông báo cho chủ lao động, khách hàng và khách hàng tiềm năng của họ về bất kỳ lợi ích nào nhận được từ\ngiới thiệu của khách hàng và khách hàng.\nDo đó, thành viên phải thông báo cho chủ lao động và khách hàng tiềm năng của mình.\nC. Đúng vì Tiêu chuẩn VI (C), Phí giới thiệu, quy định trách nhiệm của các thành viên và\ntrong việc thông báo cho chủ lao động, khách hàng và khách hàng tiềm năng của họ về bất kỳ lợi ích nào nhận được từ\ngiới thiệu của khách hàng và khách hàng\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":145,"q":"Asset managers are most likely required to do which of the following as part of their\nadherence to the GIPS standards?","opts":["Adhere to certain calculation methodologies","Only follow the minimum GIPS requirements at the time of composite creation","Include all non-discretionary funds in at least one composite reflecting the investment mandate"],"ans":"A","expl":"A. Đúng vì tiêu chuẩn GIPS dựa vào tính toàn vẹn của dữ liệu đầu vào, chất lượng của dữ liệu này\nrất quan trọng để tạo ra các bản trình bày hiệu suất chính xác. Định giá cơ bản của danh mục đầu tư\nnắm giữ sẽ thúc đẩy hiệu quả hoạt động. Điều cần thiết là những thông tin đầu vào này và các thông tin đầu vào khác phải chính xác. Tiêu chuẩn GIPS\nyêu cầu các công ty tuân thủ các phương pháp tính toán nhất định để cho phép khả năng so sánh\ngiữa các công ty.\nB. Không chính xác vì việc đáp ứng các mục tiêu về đại diện công bằng và tiết lộ đầy đủ có thể\nyêu cầu nhiều hơn là chỉ đơn giản tuân thủ các yêu cầu tối thiểu của tiêu chuẩn GIPS. Các công ty\ncũng nên tuân thủ các khuyến nghị để đạt được phương pháp thực hành tốt nhất trong việc tính toán và\ntrình bày hiệu quả hoạt động. Ngoài ra, các tiêu chuẩn GIPS sẽ tiếp tục phát triển theo thời gian để\ngiải quyết các lĩnh vực bổ sung về hiệu quả đầu tư và các công ty sẽ phải tuân thủ\ncác tiêu chuẩn cập nhật.\nC. Không chính xác vì tiêu chuẩn GIPS yêu cầu các công ty tạo và duy trì các kết hợp tổng hợp cho tất cả\nchiến lược mà công ty quản lý các tài khoản hoặc thị trường riêng biệt cho các tài khoản tách biệt. Các công ty\nphải bao gồm tất cả các tài khoản thực tế, trả phí, tách biệt tùy ý trong ít nhất một tài khoản tổng hợp\nđược xác định theo nhiệm vụ, mục tiêu hoặc chiến lược đầu tư. Các tài khoản không tùy ý không được\nđược đưa vào tổng hợp.\nTiêu chuẩn đạo đức và chuyên nghiệp: mô tả các khái niệm chính của Tiêu chuẩn GIPS dành cho công ty","qhtml":null},{"n":146,"q":"A member employed by an investment firm carries out research at the request of a\nclient. The records of that research are the property of the:","opts":["client.","member.","investment firm."],"ans":"C","expl":"A. Không chính xác vì vì, theo Tiêu chuẩn V (C), Lưu giữ hồ sơ, các hồ sơ được tạo như một phần trong hoạt động nghề nghiệp của một\nthành viên hoặc ứng viên thay mặt cho người sử dụng lao động của họ là tài sản của\ncông ty chứ không phải của khách hàng.\nB. Không chính xác vì vì, theo Tiêu chuẩn V (C), Lưu giữ hồ sơ, các hồ sơ được tạo như một phần trong hoạt động nghề nghiệp của một\nthành viên hoặc ứng viên thay mặt cho người sử dụng lao động của họ là tài sản của\ncông ty chứ không phải của thành viên.\nC. Đúng vì vì, theo Tiêu chuẩn V (C), Lưu giữ hồ sơ, các hồ sơ được tạo như một phần trong hoạt động nghề nghiệp của một\nthành viên hoặc ứng viên thay mặt cho người sử dụng lao động của họ là tài sản của\ncông ty.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":147,"q":"Ann Macharia, CFA, is an independent consultant hired by MK Investment (MKI) to\nreview its proposal to manage a large pension fund. While reviewing a draft of the document,\nMacharia notices a large section of material has been added to the proposal by MKI's CIO.\nThe additional material looks exactly like what Macharai wrote for a previous client,\ndescribing the client's proprietary investment process. Macharia is most likely required to:","opts":["remove the added material and report her suspicions to MKI.","wait to say anything until the proposal is submitted to meet the conditions of her consulting contract.","confirm her client uses the same thorough investment process as described in the added material, and make a few minor changes."],"ans":"A","expl":"A. Đúng vì tài liệu giống hệt được phản ánh trong đề xuất của khách hàng trước đây thuộc về khách hàng\n đó, mặc dù cô ấy đã viết nó thay mặt họ với tư cách là nhà tư vấn của họ. Sử dụng nó ở định dạng giống hệt nhau\nsẽ bị coi là đạo văn. Ngoài ra, phần mô tả cũng xác định một quy trình độc quyền và\ndo đó không thể áp dụng cho quy trình đầu tư của khách hàng hiện tại của cô ấy. Do đó, để ngăn chặn\nvi phạm Tiêu chuẩn I(C) Trình bày sai, tài liệu này phải bị loại bỏ. Tiêu chuẩn nêu rõ\nCác Thành viên và Ứng viên không được cố ý đưa ra bất kỳ thông tin sai lệch nào liên quan đến các khuyến nghị, hành động phân tích đầu tư\nhoặc các hoạt động chuyên môn khác. Tiêu chuẩn ((C) Misreptesamatieri\nnghiêm cấm việc chuẩn bị tài liệu để phân phối cho các khách hàng liên kết của chủ lao động\ncác khách hàng tiềm năng heton gauerat public Macharia cũng nên hỗ trợ lại việc sử dụng tài liệu đạo văn vào clip\nhọ có thể thực hiện hành động để ngăn chặn sự kiện được lặp lại trong tương lai (Staticierd IA,\nNgười biết luật Cho phép sử dụng tài liệu đạo văn phản ánh kém về một báo cáo và có thể làm tổn hại\nhair tedutaben Bằng cách báo cáo và thông báo cho Machana cũng là bảo vệ lợi ích của khách hàng của cô ấy\n(Tiêu chuẩn A) Sự trung thành. Thận trọng và Quan tâm)\nB. Không chính xác vì Tiêu chuẩn I(A) Kiến thức về Luật nêu rõ nếu một thành viên có cơ sở hợp lý để\ntin rằng các hoạt động đang diễn ra trong một công ty là bất hợp pháp hoặc phi đạo đức, thì thành viên hoặc ứng viên đó phải\ntách rời hoặc tách khỏi hoạt động đó. lợi ích của\nkhách hàng của mình (Tiêu chuẩn III(A) Lòng trung thành, Sự thận trọng và Sự quan tâm) bằng cách giúp họ tránh đạo văn và\ntrình bày sai về quy trình đầu tư của họ (Tiêu chuẩn I(C) Trình bày sai về điều này, bước đầu tiên là cố gắng ngăn chặn hành vi đó bằng cách thu hút sự chú ý của\nnhà tuyển dụng). (hoặc khách hàng trong trường hợp này) thông qua người giám sát hoặc bộ phận tuân thủ của công ty\nC. Không chính xác vì thực hiện một vài thay đổi ở đây và sẽ không đủ để tránh tuyên bố\nbị coi là đạo văn hoặc xuyên tạc quy trình đầu tư của công ty bằng cách\nsử dụng mô tả về quy trình đầu tư độc quyền của khách hàng trước đó. Macharia có nghĩa vụ\nthực hiện hành động cần thiết để ngăn chặn. hành vi phi đạo đức này sẽ khiến cô ấy\nvi phạm Tiêu chuẩn I(A) Kiến thức về Luật và Tiêu chuẩn I(C) Trình bày sai về Tiêu chuẩn I(A)\nKiến thức về Luật nêu rõ nếu một thành viên có cơ sở hợp lý để tin rằng các hoạt động đang diễn ra\ntrong một công ty là bất hợp pháp hoặc phi đạo đức, thì thành viên hoặc ứng viên đó phải tách ra hoặc tách khỏi\nhoạt động. Khi thảo luận trực tiếp với người vi phạm không thành công, bước\nđầu tiên phải là cố gắng ngăn chặn hành vi đó bằng cách thông báo cho nhà tuyển dụng\nthông qua người giám sát hoặc bộ phận tuân thủ của công ty. Tiêu chuẩn I(C) trình bày sai\nCác Thành viên và Ứng viên không được cố ý đưa ra bất kỳ thông tin sai lệch nào liên quan đến đầu tư\nphân tích, khuyến nghị, hành động hoặc các hoạt động chuyên môn khác\nTiêu chuẩn đạo đức và chuyên môn: đánh giá các thực tiễn, chính sách và hành vi liên quan đến CFA\nQuy tắc đạo đức và tiêu chuẩn ứng xử nghề nghiệp của Viện","qhtml":null},{"n":148,"q":"Which of the following statements describe the key concepts of the GIPS standards?\nStatement 1: The GIPS standards are ethical standards to ensure full disclosure of investment\nperformance.\nStatement 2: The GIPS standards require firms to maintain composites for all strategies for\nwhich the firm manages discretionary and nondiscretionary accounts.\nStatement 3: The GIPS standards address all aspects of performance measurement.","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"A. Đúng vì Tiêu chuẩn GIPS là tiêu chuẩn đạo đức trong việc trình bày hiệu quả đầu tư nhằm đảm bảo\ntrình bày công bằng và tiết lộ đầy đủ về hiệu quả đầu tư. Vì vậy, Tuyên bố 1 là khái niệm chính\ncủa tiêu chuẩn GIPS.\nB. Không chính xác vì tiêu chuẩn GIPS yêu cầu các công ty tạo và duy trì các kết hợp tổng hợp cho tất cả các chiến lược\nmà công ty quản lý các tài khoản hoặc thị trường cho các tài khoản tách biệt. Các công ty phải\nbao gồm tất cả các tài khoản tách biệt thực tế, trả phí, tùy ý trong ít nhất một\ntổng hợp được xác định theo nhiệm vụ, mục tiêu hoặc chiến lược đầu tư. Vì vậy, Tuyên bố 2 không phải là khái niệm chính\ncủa tiêu chuẩn GIPS.\nC. Không chính xác vì tiêu chuẩn GIPS không giải quyết mọi khía cạnh của việc đo lường hiệu suất\nvà sẽ tiếp tục phát triển theo thời gian để giải quyết các lĩnh vực bổ sung về hiệu suất đầu tư. Vì vậy,\nTuyên bố 3 không phải là khái niệm chính của tiêu chuẩn GIPS.\nTiêu chuẩn đạo đức và nghề nghiệp: mô tả các khái niệm chính của Tiêu chuẩn GIPS dành cho doanh nghiệp","qhtml":null}];
