iên, Tiêu chuẩn không khuyến nghị tiến hành\nkiểm tra lý lịch của tất cả nhân viên hiện tại (trái ngược với tiềm năng) mỗi năm một lần.\nB. Đúng vì theo các quy trình được đề xuất để tuân thủ Tiêu chuẩn I\n(D), các thành viên nên khuyến khích công ty của mình phát triển và/hoặc áp dụng quy tắc đạo đức mà mọi\nnhân viên phải tuân theo.\nC. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I\n(D), Hành vi sai trái, các thành viên nên khuyến khích công ty của họ kiểm tra thông tin giới thiệu của các nhân viên tiềm năng\nđể đảm bảo rằng họ có tư cách tốt và không đủ điều kiện để làm việc trong ngành đầu tư\ndo những vi phạm pháp luật trong quá khứ. Do đó, khuyến nghị là nên kiểm tra tài liệu tham khảo của\nnhân viên tiềm năng chứ không phải khách hàng.\nTiêu chuẩn đạo đức và chuyên nghiệp: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":31,"q":"According to the guidance for the Standard relating to loyalty, prudence, and care, which\nof the following statements is most accurate?","opts":["Voting proxies is necessary in all instances.","Members must maximize the economic value of proxies for clients.","Consistent application of proxy policies includes voting with management on all nonroutine governance matters."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn III (A), Lòng trung thành, Sự thận trọng và Cẩn trọng, phân tích chi phí-lợi ích\ncó thể cho thấy rằng việc bỏ phiếu cho tất cả các proxy có thể không mang lại lợi ích cho khách hàng, do đó, các proxy bỏ phiếu có thể không\ncần thiết trong mọi trường hợp.\nB. Đúng vì theo Tiêu chuẩn III (A), Lòng trung thành, Sự thận trọng và Quan tâm, người được ủy quyền có giá trị\nkinh tế đối với khách hàng, đồng thời các thành viên và ứng viên phải đảm bảo rằng họ bảo vệ đúng cách và\ntối đa hóa giá trị này.\nC. Không chính xác vì theo Tiêu chuẩn III (A), Lòng trung thành, Thận trọng và Cẩn trọng, một người quản lý đầu tư\nkhông bỏ phiếu, bỏ phiếu mà không xem xét tác động của câu hỏi hoặc bỏ phiếu\nmột cách mù quáng với ban quản lý về các vấn đề quản trị không thường xuyên (ví dụ: thay đổi cách viết hoa\ncủa công ty) có thể vi phạm tiêu chuẩn này. Do đó, tuyên bố rằng việc áp dụng nhất quán\nchính sách ủy quyền bao gồm việc bỏ phiếu cùng ban quản lý đối với tất cả các vấn đề quản trị không thường xuyên là không\nchính xác.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":32,"q":"According to the guidance for the Standards, which of the following statements are\naccurate?\n● Statement 1: Employees must place employer interests ahead of personal interests in\nall matters.\n● Statement 2: Senior management of a member's firm should create financial\ncompensation structures that do not 2 drive unethical behavior.","opts":["Statement 1 only.","Statement 2 only.","Both Statement 1 and Statement 2."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn IV (A), Lòng trung thành, người sử dụng lao động phải thừa nhận các nghĩa vụ và\nmà họ có trách nhiệm với nhân viên của mình nếu họ mong muốn nhân viên\ncó nội dung và năng suất. Hơn nữa, tiêu chuẩn này không phải là một yêu cầu chung nhằm đặt lợi ích\ncủa người sử dụng lao động lên trên lợi ích cá nhân trong mọi vấn đề. Do đó, Tuyên bố 1 - nhân viên phải đặt\nlợi ích của người sử dụng lao động lên trên lợi ích cá nhân trong mọi vấn đề – là không chính xác.\nB. Đúng vì theo Tiêu chuẩn IV (A), Lòng trung thành, người sử dụng lao động chịu trách nhiệm về một môi trường làm việc\ntích cực, trong đó bao gồm một nơi làm việc có đạo đức. Ban quản lý cấp cao có thêm\ntrách nhiệm trong việc đưa ra các cơ cấu lương thưởng và thỏa thuận khuyến khích không khuyến khích\nhành vi phi đạo đức. Do đó, Tuyên bố 2 là chính xác.\nC. Không chính xác vì theo Tiêu chuẩn IV (A), Lòng trung thành, người sử dụng lao động phải thừa nhận các nghĩa vụ và\nmà họ có trách nhiệm với nhân viên của mình nếu họ mong muốn nhân viên\ncó nội dung và năng suất. Hơn nữa, tiêu chuẩn này không phải là một yêu cầu chung nhằm đặt lợi ích\ncủa người sử dụng lao động lên trên lợi ích cá nhân trong mọi vấn đề. Do đó, Tuyên bố 1 - nhân viên phải đặt\nlợi ích của người sử dụng lao động lên trên lợi ích cá nhân trong mọi vấn đề - không chính xác\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":33,"q":"A member himself from believes a colleague is participating in unethical activities at\nwork. The member does not disassociate the activities of his colleague. The member has most\nlikely violated:","opts":["only the Standard relating to knowledge of the law.","only the Standard relating to disclosure of conflicts.","both the Standard relating to knowledge of the law and the Standard relating to disclosure of conflicts."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn I(A) Kiến thức về Luật, nếu một thành viên hoặc ứng viên có\ncó căn cứ hợp lý để tin rằng các hoạt động sắp xảy ra hoặc đang diễn ra với khách hàng hoặc chủ lao động là bất hợp pháp hoặc\nphi đạo đức, thì thành viên hoặc ứng viên đó phải tách rời hoặc tách khỏi hoạt động đó. Việc không hành động\nkết hợp với việc tiếp tục liên kết với những người liên quan đến hành vi bất hợp pháp hoặc phi đạo đức có thể được coi là\nđược coi là tham gia hoặc hỗ trợ vào hành vi bất hợp pháp hoặc phi đạo đức đó.\nB. Không chính xác vì theo Tiêu chuẩn VI(A), Tiết lộ xung đột, các Thành viên và Ứng viên\nphải tiết lộ đầy đủ và công bằng tất cả các vấn đề có thể được cho là sẽ làm giảm\nsự độc lập và khách quan của họ hoặc can thiệp vào các nghĩa vụ tương ứng đối với khách hàng, khách hàng tiềm năng\nvà chủ lao động của họ. Các Thành viên và Ứng viên phải đảm bảo rằng những thông tin tiết lộ đó được hiển thị rõ ràng,\nđược cung cấp bằng ngôn ngữ đơn giản và truyền đạt thông tin liên quan một cách hiệu quả. Tiêu chuẩn\nkhông áp dụng để hướng dẫn hành vi của thành viên trong trường hợp thành viên đó tin rằng một\nđồng nghiệp tham gia vào hành vi phi đạo đức. Ở đây, thành viên chưa vi phạm Tiêu chuẩn VI (A).\nC. Không chính xác vì theo Tiêu chuẩn VI(A), Tiết lộ xung đột, các Thành viên và Ứng viên\nphải tiết lộ đầy đủ và công bằng tất cả các vấn đề có thể được cho là sẽ làm giảm\nsự độc lập và khách quan của họ hoặc can thiệp vào các nghĩa vụ tương ứng đối với khách hàng, khách hàng tiềm năng\nvà chủ lao động của họ. Các Thành viên và Ứng viên phải đảm bảo rằng những thông tin tiết lộ đó được hiển thị rõ ràng,\nđược cung cấp bằng ngôn ngữ đơn giản và truyền đạt thông tin liên quan một cách hiệu quả. Tiêu chuẩn\nkhông áp dụng để hướng dẫn hành vi của thành viên trong trường hợp thành viên đó tin rằng một\nđồng nghiệp tham gia vào hành vi phi đạo đức. Ở đây, thành viên không vi phạm Tiêu chuẩn VI (A).\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":34,"q":"According to the Standard relating to loyalty, members must:","opts":["place their employer's interest above their personal interests in all matters.","notify their employer before engaging in an independent practice while still employed.","never act against their employer's interests when complying with their duties to clients."],"ans":"B","expl":"A. Không chính xác vì theo Tiêu chuẩn IV (A), Lòng trung thành, tiêu chuẩn này không phải là một yêu cầu chung\nđặt lợi ích của người sử dụng lao động lên trên lợi ích cá nhân trong mọi vấn đề. Tiêu chuẩn\nkhông yêu cầu các thành viên và ứng viên phải tuân theo các nghĩa vụ quan trọng của cá nhân và gia đình\ntrong một tuần.\nB. Đúng vì mặc dù Mức độ trung thành của Tiêu chuẩn IV (A) không ngăn cản các thành viên của cendinates\ngia nhập các tổ chức của người phụ thuộc khi vẫn còn làm việc, các thành viên và ứng viên dự định\ntham gia hành nghề độc lập để được trả thù lao phải thông báo cho người sử dụng lao động của họ và hủy bỏ các loại\ndịch vụ mà họ sẽ cung cấp cho khách hàng tiềm năng cho khách hàng độc lập, thời gian dự kiến của dịch vụ,\nvà các dịch vụ pampasan fer ine Các thành viên và ứng viên không được thuê dịch vụ qua đường hậu môn họ\nnhận được sự đồng ý từ người sử dụng lao động của họ đối với tất cả các điều khoản của thỏa thuận\nC. Không chính xác vì theo Tiêu chuẩn IV (A), Lòng trung thành, các trường hợp có thể phát sinh (ví dụ: khi một\nchủ lao động tham gia vào hoạt động bất hợp pháp hoặc phi đạo đức), trong đó các thành viên và ứng viên phải hành động\ntrái với lợi ích của chủ lao động để tuân thủ nghĩa vụ của họ đối với thị trường và khách hàng.\nTrong những trường hợp như vậy, các hoạt động thường vi phạm nghĩa vụ của thành viên hoặc ứng viên đối với họ\nchủ lao động (chẳng hạn như mâu thuẫn với Hướng dẫn của chủ lao động, vi phạm một số chính sách và thủ tục nhất định hoặc\nlưu giữ hồ sơ bằng cách sao chép hồ sơ của chủ lao động) có thể được biện minh.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":35,"q":"Andrew Milton, CFA, is an advisor working with individual clients. Milton is careful to\nrecommend investments for his clients that are consistent with their overall objectives and\nrisk tolerance. His firm gives its advisors a bonus for recommending the firm's proprietary\nproducts. If all other variables are equal in an investment choice, Milton uses the proprietary\nproducts Milton does not inform the clients of this bonus. Has Milton most likely violated the\nStandards?","opts":["No.","Yes, the Standard relating to suitability.","Yes, the Standard relating to loyalty, prudence, and care."],"ans":"C","expl":"A. Không chính xác vì Milton phải tiết lộ rằng anh ta nhận được tiền thưởng khi sử dụng quỹ\nđộc quyền của công ty cho khách hàng, vì vậy anh ta đã vi phạm Tiêu chuẩn III (A), Lòng trung thành, Sự thận trọng và Cẩn trọng, như được mô tả\ntrong phần căn cứ cho câu trả lời đúng.\nB. Không chính xác vì Tiêu chuẩn III (C), Tính phù hợp, yêu cầu các thành viên và ứng viên có mối quan hệ tư vấn đầu tư\nvới khách hàng xem xét cẩn thận nhu cầu, hoàn cảnh và\nmục tiêu của khách hàng khi xác định tính phù hợp và phù hợp của một khoản đầu tư nhất định\nhoặc quá trình hành động đầu tư. Milton đang đưa ra quyết định đầu tư cho khách hàng của mình dựa trên\nmục tiêu cũng như khả năng chấp nhận rủi ro cũng như sự phù hợp của họ và do đó không vi phạm Tiêu chuẩn này.\nC. Đúng vì theo Tiêu chuẩn III (A). Lòng trung thành, sự thận trọng và sự quan tâm. Phải đặc biệt cẩn thận\nđể phát hiện xem mục tiêu của Người quản lý đầu tư hoặc công ty trong việc tiến hành kinh doanh\nbán sản phẩm và thực hiện các giao dịch bảo mật có khả năng xung đột với lợi ích tốt nhất và\nmục tiêu của khách hàng hay không. Khi các thành viên và ứng viên không thể tránh khỏi những xung đột tiềm ẩn giữa\nlợi ích của công ty và khách hàng, họ phải cung cấp thông tin tiết lộ rõ ​​ràng và thực tế về các tình huống\ncho khách hàng. Milton phải tiết lộ rằng anh ta nhận được tiền thưởng khi sử dụng quỹ độc quyền của công ty cho\nkhách hàng và vi phạm Tiêu chuẩn này.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":36,"q":"Which of the following are among the recommended procedures for compliance with the\nStandard relating to independence and objectivity?\nProcedure 1: Impose limits on investment personnel acquiring securities in private\nplacements.\nProcedure 2: Prohibit employees from receiving reimbursement from corporate issuers for air\ntransportation when attending meetings at the issuers' headquarters.\nProcedure 3: Remove a company from the restricted list if the firm is unwilling to permit\ndissemination of adverse opinions about the company.","opts":["Procedure 1 and Procedure 2","Procedure 1 and Procedure 3","Procedure 2 and Procedure 3"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn I(B), Tính độc lập và khách quan, các thành viên và\nỨng viên phải thận trọng và phán đoán hợp lý để đạt được và duy trì tính độc lập cũng như\ntính khách quan trong các hoạt động nghề nghiệp của mình.\nĐối với Quy trình 1, hạn chế đầu tư: Các thành viên và ứng viên nên khuyến khích\ncông ty đầu tư của họ phát triển các chính sách chính thức phê duyệt cho nhân viên liên quan đến việc nhân viên mua\ncổ phần hoặc IPO liên quan đến vốn cổ phần. Các công ty nên yêu cầu tham gia trước vào IPO, đồng thời tiết lộ\nnhanh chóng về các hoạt động đầu tư được thực hiện sau đó đối với nhân viên đầu tư\nmua chứng khoán ở các đợt phát hành riêng lẻ.\nchào bán. Các giới hạn nghiêm ngặt\nĐối với Quy trình 2, hãy hạn chế các thỏa thuận chi phí đặc biệt: Khi tham dự các cuộc họp tại trụ sở chính\ncủa tổ chức phát hành, các thành viên và ứng viên phải trả phí vận chuyển thương mại và phí khách sạn\n. Không tổ chức phát hành doanh nghiệp nào được hoàn trả chi phí vận chuyển hàng không cho thành viên hoặc ứng viên.\nB. Không chính xác vì Quy trình 1 nằm trong số các quy trình được khuyến nghị để tuân thủ\nTiêu chuẩn liên quan đến tính độc lập và khách quan, nhưng Quy trình 3 thì không.\nĐối với Quy trình 3, hãy tạo một danh sách hạn chế. Nếu công ty không sẵn lòng cho phép phổ biến\ný kiến ​​bất lợi về một khách hàng doanh nghiệp, các thành viên và ứng viên nên khuyến khích công ty loại bỏ\ncông ty gây tranh cãi khỏi phạm vi nghiên cứu và đưa nó vào danh sách hạn chế để công ty\nchỉ phổ biến thông tin thực tế về công ty. Vì vậy, việc đưa công ty vào\ndanh sách hạn chế là một trong những thủ tục được khuyến nghị.\nC. Không chính xác vì Quy trình 2 nằm trong số các quy trình được đề xuất để tuân thủ\nTiêu chuẩn liên quan đến tính độc lập và khách quan, nhưng Quy trình 3 thì không.\nTiêu chuẩn đạo đức và nghề nghiệp: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":37,"q":"Vinod Shah, CFA, is a fund manager for the employee pension plan of Jupiter\nCorporation, a publicly traded company. Shah owes a primary duty of loyalty, prudence, and\ncare to the:","opts":["shareholders of Jupiter.","management of Jupiter.","beneficiaries of the pension fund."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn III (A), Lòng trung thành, Thận trọng và Cẩn trọng, các cổ đông\nkhông phải là người thụ hưởng quỹ của mình. Tuy nhiên, khi người quản lý chịu trách nhiệm về danh mục các quỹ hưu trí\nhoặc quỹ tín thác, khách hàng không phải là cá nhân hoặc tổ chức thuê người quản lý mà đúng hơn là những người thụ hưởng\ncủa quỹ hưu trí hoặc quỹ tín thác. Nghĩa vụ trung thành thuộc về những người hưởng lợi cuối cùng.\nB. Không chính xác vì theo Tiêu chuẩn III (A), Lòng trung thành, Thận trọng và Cẩn trọng, các cổ đông\nkhông phải là người thụ hưởng quỹ của mình. Tuy nhiên, khi người quản lý chịu trách nhiệm về danh mục các quỹ hưu trí\nhoặc quỹ tín thác, khách hàng không phải là cá nhân hoặc tổ chức thuê người quản lý mà đúng hơn là những người thụ hưởng\ncủa quỹ hưu trí hoặc quỹ tín thác. Nghĩa vụ trung thành thuộc về những người hưởng lợi cuối cùng.\nC. Đúng vì theo Tiêu chuẩn III (A), Trung thành, Thận trọng và Cẩn trọng, các cổ đông\nkhông phải là người thụ hưởng quỹ của mình. Tuy nhiên, khi người quản lý chịu trách nhiệm về danh mục các chương trình hưu trí\nhoặc quỹ tín thác, khách hàng không phải là cá nhân hoặc tổ chức thuê người quản lý mà đúng hơn là\nnhững người thụ hưởng chương trình hoặc quỹ tín thác. Nghĩa vụ trung thành thuộc về những người hưởng lợi cuối cùng.\nTiêu chuẩn đạo đức và chuyên nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":38,"q":"Min Joon, CFA, works in the client services department at an investment firm. Joon has\nbeen short-selling stocks on his personal account in anticipation of a significant decline in the\nmarket. His transactions do not disadvantage his firm's clients. Following a dramatic rise in\nthe markets, Joon is unable to cover his short positions and is forced to declare personal\nbankruptcy. Has Joon violated the Standards?","opts":["No","Yes, the Standard relating to misconduct","Yes, the Standard relating to loyalty, prudence, and care"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn I(D), Hành vi sai trái, các Thành viên và Ứng viên không được\ntham gia vào bất kỳ hành vi chuyên môn nào liên quan đến không trung thực, gian lận hoặc lừa dối hoặc thực hiện bất kỳ hành động nào\nphản ánh bất lợi đến danh tiếng nghề nghiệp, Tính chính trực hoặc năng lực của họ. Hành động của Joon không\ndo hành vi kinh doanh gian lận hoặc lừa dối và việc phá sản cá nhân có thể không phản ánh tính chính trực hoặc đáng tin cậy của người tuyên bố phá sản. Ngoài ra, theo Tiêu chuẩn III(A),\nTrung thành, Thận trọng và Quan tâm, các Thành viên và Ứng viên phải hành động vì lợi ích của khách hàng và\nđặt lợi ích của khách hàng lên trên lợi ích của chủ lao động hoặc của chính họ. Ở đây không có gì để\ncho thấy rằng Joon đã không hành động vì lợi ích của khách hàng của mình.\nB. Không chính xác vì theo Tiêu chuẩn I(D), Hành vi sai trái, các Thành viên và Ứng viên không được\ntham gia vào bất kỳ hành vi chuyên môn nào liên quan đến sự không trung thực, gian lận hoặc lừa dối hoặc thực hiện bất kỳ hành động nào\nphản ánh bất lợi đến danh tiếng, tính chính trực hoặc năng lực nghề nghiệp của họ. Hành động của Joon không\ndo hành vi kinh doanh gian lận hoặc lừa dối và việc phá sản cá nhân có thể không phản ánh tính chính trực hoặc đáng tin cậy của người tuyên bố phá sản. Vì vậy, Joon không vi phạm\nTiêu chuẩn này.\nC. Không chính xác vì theo Tiêu chuẩn III(A), Lòng trung thành, Thận trọng và Quan tâm, các Thành viên và\nỨng viên phải hành động vì lợi ích của khách hàng và đặt lợi ích của khách hàng lên trên\ncủa chủ lao động hoặc lợi ích của chính họ. Ở đây không có gì cho thấy rằng Joon đã không hành động vì lợi ích\ncủa khách hàng của mình. Vì vậy, Joon không vi phạm Tiêu chuẩn này.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":39,"q":"A member secures a controlling, dominant position in an option on a stock in order to\nbenefit from trading the stock. The option trades are reported by the exchange and the\nincreased option trading volume leads other traders to take positions in the option and in the\nunderlying stock. The member has violated the Standards:","opts":["by engaging in transaction-based manipulation only.","by engaging in information-based manipulation only.","by engaging in both transaction-based manipulation and information-based manipulation."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn II (B), Thao túng thị trường, thao túng\ndựa trên giao dịch liên quan đến các trường hợp trong đó một thành viên hoặc ứng viên biết hoặc lẽ ra phải biết rằng\nhoặc hành động của cô ấy có thể ảnh hưởng đến việc định giá chứng khoán. Kiểu thao túng này bao gồm nhưng không giới hạn\nviệc sau đây đảm bảo vị trí kiểm soát, thống trị trong một công cụ tài chính để khai thác\nvà thao túng giá của một công cụ phái sinh liên quan và/hoặc tài sản cơ bản.\nB. Không chính xác vì theo Tiêu chuẩn II (B), Thao túng thị trường, thao túng\ndựa trên thông tin bao gồm nhưng không giới hạn ở việc phát tán tin đồn thất thiệt để lôi kéo người khác giao dịch.\nỞ đây, thành viên không tham gia vào việc lan truyền tin đồn hoặc hành động tương tự, hành động của thành viên không phải là\nví dụ về thao túng dựa trên thông tin\nC. Không chính xác vì thành viên đã vi phạm Tiêu chuẩn II (B), Thao túng thị trường, bằng cách tham gia\nthao túng dựa trên giao dịch, như được mô tả trong phần cơ sở phản hồi cho câu trả lời đúng.\nTrong khi đó, thao túng dựa trên thông tin bao gồm nhưng không giới hạn ở việc phát tán tin đồn thất thiệt\nđể xúi giục người khác giao dịch.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":40,"q":"Which of the following is a recommended procedure for compliance with the Standard\nrelating to performance presentation? When presenting performance, members should:","opts":["exclude terminated accounts.","use a single representative account for each investment mandate.","disclose that investment results are simulated when model results are used."],"ans":"A","expl":"A. Đúng vì đầu tư hàng hóa có thể liên quan đến việc đầu tư vào hàng hóa vật chất thực tế hoặc\nvào nhà sản xuất hàng hóa. Hàng hóa được coi là 'cứng' (những hàng hóa được khai thác, chẳng hạn như\nđồng hoặc được chiết xuất, chẳng hạn như dầu) hoặc 'mềm' (những mặt hàng được trồng trong một khoảng thời gian, chẳng hạn như vật nuôi,\nngũ cốc và cây trồng thương mại, chẳng hạn như cà phê).\nB. Không chính xác vì đất rừng là một thành phần riêng biệt của tài nguyên thiên nhiên bao gồm hàng hóa\n(cứng và mềm), nông nghiệp mô tả đặc điểm của hàng hóa và đặc điểm đầu tư của chúng\nC. Không chính xác vì theo Tiêu chuẩn III (D), Trình bày hiệu suất, \"[m]than hồng và\nứng viên cũng có thể đáp ứng nghĩa vụ của họ theo Tiêu chuẩn III (D) [liên quan đến\ntrình bày] bởi...■ bao gồm các tiết lộ giải thích đầy đủ về kết quả hiệu suất được báo cáo\n(ví dụ: nêu rõ, khi thích hợp, kết quả đó được mô phỏng khi sử dụng kết quả mô hình,\nrõ ràng cho biết khi nào hồ sơ hoạt động là của một thực thể trước đó hoặc tiết lộ liệu\nkết quả hoạt động là tổng phí, sau thuế hay sau thuế)...\" Do đó, việc sử dụng kết quả mô phỏng phải\nđược tiết lộ.\nTiêu chuẩn đạo đức và nghề nghiệp: khuyến nghị các thực hành và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":41,"q":"Mary Rein, CFA, makes a brief presentation about her firm's performance to a group of\ncurrent and prospective clients. According to the Standard relating to performance\npresentation, is Rein required to make available the detailed information supporting her\npresentation to clients upon request?","opts":["No.","Yes, only to current clients.","Yes, both to current clients and to prospective clients."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn III (D), Trình bày Hiệu suất, thông tin phải được\ncó sẵn cho cả khách hàng và khách hàng tiềm năng theo yêu cầu, như được mô tả trong cơ sở phản hồi cho\ncâu trả lời đúng.\nB. Không chính xác vì theo Tiêu chuẩn III (D), Trình bày Hiệu suất, thông tin phải được cung cấp\ncho cả khách hàng và khách hàng tiềm năng theo yêu cầu, như được mô tả trong cơ sở phản hồi cho\ncâu trả lời đúng.\nC. Đúng vì theo Tiêu chuẩn III (D), Trình bày Hiệu suất, nếu bài trình bày ngắn gọn\n, thành viên hoặc ứng viên phải cung cấp cho khách hàng và khách hàng tiềm năng, theo yêu cầu,\nthông tin chi tiết hỗ trợ cho cuộc giao tiếp đó. Phương pháp hay nhất quy định rằng các bài thuyết trình ngắn gọn\nbao gồm tham chiếu đến tính chất hạn chế của thông tin được cung cấp.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":42,"q":"According to the Standard relating to suitability, a member who manages a mutual fund is required:","opts":["only to invest in a manner consistent with the fund's stated mandate.","only to determine the suitability of the fund for investors who may be purchasing shares in the fund.","both to invest in a manner consistent with the fund's stated mandate and to determine the suitability of the fund for investors who may be purchasing shares in the fund."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn III (C), Phù hợp, Một số thành viên và ứng viên không\nquản lý tiền cho cá nhân nhưng chịu trách nhiệm quản lý quỹ theo chỉ số hoặc nhiệm vụ dự kiến\n. Trách nhiệm của các thành viên và ứng cử viên này là đầu tư một cách nhất quán\nvới nhiệm vụ đã nêu.\nB. Không chính xác vì theo Tiêu chuẩn III (C), Tính phù hợp, Các Thành viên và ứng viên quản lý\ntài sản gộp theo một nhiệm vụ cụ thể không chịu trách nhiệm xác định tính phù hợp của quỹ như\nmột khoản đầu tư cho các nhà đầu tư có thể mua cổ phiếu trong quỹ. Trách nhiệm\nxác định tính phù hợp của khoản đầu tư cho khách hàng chỉ có thể được giao cho các thành viên và\nứng viên có mối quan hệ tư vấn với khách hàng. Do đó, các thành viên quản lý quỹ tương hỗ\ntheo ủy quyền không bắt buộc phải xác định sự phù hợp của quỹ đối với các nhà đầu tư có thể\nmua cổ phần trong quỹ.\nC. Không chính xác vì theo Tiêu chuẩn III (C), Tính phù hợp, Các Thành viên và ứng viên quản lý\ntài sản gộp theo một nhiệm vụ cụ thể không chịu trách nhiệm xác định tính phù hợp của quỹ như\nmột khoản đầu tư cho các nhà đầu tư có thể mua cổ phiếu trong quỹ. Trách nhiệm\nxác định tính phù hợp của khoản đầu tư cho khách hàng chỉ có thể được giao cho các thành viên và\nứng viên có mối quan hệ tư vấn với khách hàng. Do đó, các thành viên quản lý quỹ tương hỗ\nkhông bắt buộc phải xác định sự phù hợp của quỹ đối với các nhà đầu tư có thể\nmua cổ phần trong quỹ.\nTiêu chuẩn đạo đức và chuyên môn: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":43,"q":"Richard Hicks, CFA, is an investment advisor. A friend asks Hicks to share client contacts\nin order to solicit charitable donations. Hicks responds that he is unable to share current\nclients' contact details and instead provides e- mail addresses of several former clients. The\nnext day, Hicks finds out that one of his colleagues, Claudia Moll, a Level III candidate in the\nCFA Program, has failed to inform her supervisor about her personal bankruptcy resulting\nfrom large medical bills. Have the Standards most likely been violated?","opts":["No.","Yes, by Moll.","Yes, by Hicks."],"ans":"C","expl":"A. Không chính xác vì Hicks đã vi phạm Tiêu chuẩn III (E), Bảo vệ bí mật, bằng cách cung cấp e-\nthư điện tử của khách hàng cũ cho bạn bè của anh ấy, như được mô tả trong cơ sở phản hồi cho câu trả lời\nchính xác.\nB. Không chính xác vì theo Tiêu chuẩn I (D), Hành vi sai trái, Phá sản cá nhân có thể không phản ánh\nvề tính chính trực hoặc độ tin cậy của người tuyên bố phá sản, nhưng nếu các trường hợp\nphá sản liên quan đến hành vi kinh doanh gian lận hoặc lừa dối thì việc phá sản có thể vi phạm\ntiêu chuẩn này. Trong trường hợp này, việc Moll phá sản là do hóa đơn y tế, do đó là vấn đề cá nhân chứ không phải là vấn đề chuyên môn, do đó không vi phạm.\nC. Đúng vì theo Tiêu chuẩn III (E), Bảo mật bí mật. Tiêu chuẩn\nbảo vệ tính bảo mật của thông tin khách hàng ngay cả khi cá nhân hoặc tổ chức đó không còn là khách hàng của\nthành viên hoặc ứng viên. Do đó, các thành viên và Quy tắc ứng viên phải tiếp tục duy trì\ntính bảo mật của hồ sơ khách hàng ngay cả sau khi mối quan hệ với khách hàng đã kết thúc. Do đó, việc tiết lộ e-\nmail của khách hàng cũ là vi phạm\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Đạo đức và Tiêu chuẩn của\nỨng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":44,"q":"Tom Dixon, CFA, provides a brief summary of his investment performance to his clients.\nHe indicates that further information is available upon request. He tells his clients they can\nexpect a return of 5% in the next three years based on his strong track record. Has Dixon\nmost likely violated the Standards?","opts":["No.","Yes, by indicating that further information is available upon request.","Yes, by telling his clients they can expect a return of 5% in the next three years."],"ans":"C","expl":"A. Không chính xác vì Dixon vi phạm Tiêu chuẩn III(D), Trình bày Hiệu suất, bằng cách nói với khách hàng của mình\nhọ có thể mong đợi lợi nhuận 5% trong ba năm tới như được mô tả trong cơ sở phản hồi của\ncâu trả lời đúng.\nB. Không chính xác vì Dixon vi phạm Tiêu chuẩn III(D), Trình bày Hiệu suất, bằng cách nói với khách hàng của mình\nhọ có thể mong đợi lợi nhuận 5% trong ba năm tới như được mô tả trong cơ sở phản hồi của\ncâu trả lời đúng.\nC. Đúng vì theo Tiêu chuẩn III(D), Trình bày Hiệu suất, các thành viên và ứng viên\nkhông được tuyên bố hoặc ngụ ý rằng khách hàng sẽ nhận được hoặc được hưởng lợi từ tỷ suất lợi nhuận đã được tạo ra\ntrong quá khứ. Ngoài ra, nếu phần trình bày ngắn gọn, thành viên hoặc ứng viên phải cung cấp cho khách hàng\nvà khách hàng tiềm năng, theo yêu cầu, thông tin chi tiết hỗ trợ cho việc giao tiếp đó.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":45,"q":"According to the Standard relating to additional compensation arrangements, a member\nwho is offered additional compensation from a third party for services that conflict with his\nemployer's interest","opts":["is prohibited from accepting the additional compensation in all cases.","is required to notify his employer about compensation from the third party immediately after receiving it.","must obtain written consent from his employer and the third party offering fees to the member before accepting the compensation."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung,\nbồi thường và lợi ích bao gồm bồi thường trực tiếp của khách hàng và mọi khoản bồi thường gián tiếp\nhoặc các lợi ích khác nhận được từ bên thứ ba. Do đó, thành viên có thể chấp nhận khoản bồi thường từ cả\nkhách hàng hiện tại và các bên thứ ba khác nhưng phải có sự đồng ý bằng văn bản của cả hai bên trước khi\nchấp nhận khoản bồi thường.\nB. Không chính xác vì theo Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung, các thành viên\nphải xin phép chủ lao động trước khi nhận thù lao hoặc các lợi ích khác từ\ncác bên thứ ba đối với các dịch vụ được cung cấp cho chủ lao động hoặc cho bất kỳ dịch vụ nào có thể tạo ra\nxung đột với pinterest chủ lao động của họ\nC. Đúng vì theo Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung, các Thành viên\nvà Ứng viên không được nhận, lợi ích, bồi thường hoặc cotiskistatxin có liên quan đến hoặc\ncó thể được cho là sẽ tạo ra xung đột lợi ích với lợi ích của chủ lao động trừ khi\nhọ nhận được sự đồng ý bằng văn bản từ tất cả các bên liên quan. Ngoài ra, Tiêu chuẩn IV (B) yêu cầu các thành viên và\nứng viên phải xin phép chủ lao động của họ trước khi chấp nhận khoản thù lao hoặc ntiler\nđây là bên thứ ba của phụ nữ đối với các dịch vụ được cung cấp để chủ lao động hoặc bất kỳ dịch vụ nào foat có thể\ntạo ra một nội dung có lợi cho chủ lao động Cần phải có sự đồng ý bằng văn bản cả hai quần lót\ntrước khi chấp nhận khoản thù lao\nTiêu chuẩn đạo đức và chuyên nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":46,"q":"John Run, CFA, manages client accounts for an investment firm. A client says to Run: \"For\nevery year my portfolio beats the benchmark by 5%, you can use my beach home for a\nweek.\" Run also serves on the board of Core Air Ltd. (Core). He does not receive cash\npayments from Core for board services but Core sends Run a family voucher for a flight. Run\naccepts both offers and does not inform his firm about the beach home offer or the flight\nvoucher. Has Run most likely violated the Standard relating to additional compensation\narrangements?","opts":["No.","Yes, only because Run accepts the beach home offer without informing his employer.","Yes, both because Run accepts the beach home offer and the family flight voucher without informing his employer."],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung, yêu cầu Run phải có\nsự đồng ý bằng văn bản từ người chủ của mình trước khi chấp nhận cả lời đề nghị về ngôi nhà trên bãi biển và phiếu giảm giá chuyến bay dành cho gia đình\n. Do không nhận được sự đồng ý của chủ lao động, Run đã vi phạm Tiêu chuẩn IV (B), như được mô tả trong\ncơ sở phản hồi cho câu trả lời đúng.\nB. Không chính xác vì Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung, yêu cầu Run phải có\nsự đồng ý bằng văn bản từ người chủ của mình trước khi chấp nhận không chỉ lời đề nghị về ngôi nhà trên bãi biển mà còn cả phiếu chuyến bay dành cho gia đình\n. Do đó, như được mô tả trong phần cơ sở phản hồi cho câu trả lời đúng, Run\nđã vi phạm Tiêu chuẩn IV (B) khi chấp nhận cả lời đề nghị về nhà ở bãi biển và phiếu chuyến bay cho gia đình\nmà không thông báo cho chủ nhân của mình.\nC. Đúng vì theo Tiêu chuẩn IV (B), Thỏa thuận bồi thường bổ sung, các Thành viên\nvà Ứng viên không được nhận quà tặng, lợi ích, thù lao hoặc sự cân nhắc cạnh tranh với\nhoặc có thể được cho là sẽ tạo ra xung đột lợi ích với lợi ích của chủ lao động trừ khi\nhọ nhận được sự đồng ý bằng văn bản của tất cả các bên liên quan. Ngoài ra, Tiêu chuẩn IV (B) nêu rõ: Khoản bồi thường\nvà các lợi ích bao gồm khoản bồi thường trực tiếp từ khách hàng và mọi khoản bồi thường gián tiếp hoặc các lợi ích\nkhác nhận được từ bên thứ ba. Do đó, Run phải có được sự đồng ý bằng văn bản từ người chủ của mình\ntrước khi chấp nhận lời đề nghị về nhà ở bãi biển và phiếu chuyến bay dành cho gia đình. Bằng cách không làm như vậy, Run đã\nvi phạm Tiêu chuẩn IV (B).\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":47,"q":"Johanna Ayers, CFA, is a portfolio manager. She has a new client and develops an\ninvestment policy statement (IPS) that addresses the client's risk and return objectives and\nconstraints. The client does not disclose assets managed by other firms and Ayers agrees to\nonly manage the portion of the client's assets disclosed to her. In a separate document, Ayers\ndevelops an investment program and strategic asset allocation for the portion of client assets\nshe manages. Has Ayers most likely violated the Standard relating to suitability?","opts":["No.","Yes, by keeping the investment program and strategic asset allocation in a document that is separate from the IPS.","Yes, by agreeing to manage a portion of the client's assets without knowledge of the client's assets managed by other firms."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn III (C). Sự phù hợp, việc xem xét sự phù hợp có thể được thực hiện nhất\nmột cách hiệu quả khi khách hàng tiết lộ đầy đủ danh mục đầu tư tài chính hoàn chỉnh của mình, bao gồm cả những danh mục đó\ncác phần không được quản lý bởi thành viên hoặc ứng cử viên. Nếu khách hàng giấu thông tin về\ndanh mục đầu tư tài chính, việc phân tích mức độ phù hợp do các thành viên và ứng viên thực hiện không thể\ndự kiến sẽ hoàn thành; nó phải dựa trên thông tin được cung cấp. Ayers có thể phát triển một\nchương trình đầu tư phù hợp với khách hàng mà không cần biết về các tài sản khác của họ, thậm chí\nmặc dù thông tin chưa đầy đủ. Ngoài ra, Tiêu chuẩn III (C) cũng nêu rõ sau khi xây dựng lâu dài-\nkỳ vọng của thị trường vốn, các thành viên và ứng viên có thể hỗ trợ phát triển một chiến lược phù hợp\nchương trình đầu tư và phân bổ tài sản chiến lược cho khách hàng, cho dù những điều này có được trình bày trong\ncác tài liệu riêng biệt hoặc được đưa vào IPS hoặc trong các phụ lục của IPS, Ayers có thể giữ những tài liệu này\nghi vào một tài liệu riêng.\nB. Không chính xác vì Tiêu chuẩn cho phép sử dụng hồ sơ riêng cho chương trình đầu tư\nIII(C). Sự phù hợp, như đã nêu trong phần lý do cho câu trả lời đúng.\nC. Không chính xác vì các thành viên được phép theo Tiêu chuẩn III (C), Sự phù hợp để phát triển một khoản đầu tư\nchương trình tốt nhất có thể, họ có thể cung cấp thông tin không đầy đủ về tất cả tài sản của khách hàng, như đã nêu trong\nlý do đưa ra câu trả lời đúng.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":48,"q":"A member most likely violates the Standard relating to responsibilities of supervisors if\nshe:","opts":["accepts supervisory duties before ensuring the firm has adopted a codes of ethics.","delegates supervisory duties to subordinates who have no prior compliance experience.","relies on a subordinate's statements without initiating an assessment about the extent of a potential violation of the Standards."],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn IV (C) Trách nhiệm của Người giám sát khuyến khích các thành viên và\nứng viên khuyến nghị người sử dụng lao động của họ áp dụng quy tắc đạo đức, nhưng không yêu cầu\nthành viên từ chối trách nhiệm giám sát nếu không có quy tắc đạo đức. Một thành viên hoặc ứng viên\ncó trách nhiệm giám sát nên thông báo cho\ncác nhà quản lý cấp cao của công ty về hệ thống tuân thủ không đầy đủ và đề xuất hành động khắc phục. Nếu thành viên hoặc ứng viên rõ ràng\nkhông thể thực hiện trách nhiệm giám sát do thiếu hệ thống tuân thủ của\ndo hệ thống tuân thủ không đầy đủ, thì thành viên hoặc ứng viên đó nên từ chối\nchấp nhận trách nhiệm giám sát cho đến khi công ty áp dụng các thủ tục hợp lý để cho phép\nthực hiện đầy đủ trách nhiệm siêu cao.\nB. Không chính xác vì theo Tiêu chuẩn IV(C) Trách nhiệm của Giám sát viên. Các thành viên và\nỨng viên có thể giao nhiệm vụ giám sát cho cấp dưới trực tiếp giám sát các nhân viên\nkhác.\nC. Đúng vì theo Tiêu chuẩn IV (C) Trách nhiệm của Người giám sát, khi người giám sát\nbiết rằng nhân viên sri đã vi phạm hoặc có thể đã vi phạm luật pháp hoặc Quy tắc và Tiêu chuẩn, người giám sát\nsẽ nhanh chóng đưa ra đánh giá để xác định mức độ của hành vi sai trái. Dựa\nvào tuyên bố của nhân viên về mức độ vi phạm để đảm bảo rằng hành vi sai trái\nsẽ không tái diễn là chưa đủ.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":49,"q":"According to the Standard relating to loyalty, in the absence of a noncompete agreement and without employer consent, a member is permitted to:","opts":["email himself a list of his clients when leaving his employer.","enter into an independent competitive business while still employed.","contact clients from his previous employer using public information to solicit business at his new firm."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn IV(A). Lòng trung thành, trong các vấn đề liên quan đến việc làm của họ,\nCác Thành viên và Ứng viên phải hành động vì lợi ích của người sử dụng lao động và không tước đi lợi thế của người sử dụng lao động\ncủa họ về các kỹ năng và khả năng của họ, tiết lộ thông tin bí mật hoặc gây hại\ncho người sử dụng lao động của họ. Các hoạt động có thể cấu thành hành vi vi phạm, đặc biệt là khi kết hợp,\nbao gồm các hoạt động sau: chiếm dụng khách hàng hoặc danh sách khách hàng. Do đó, việc gửi email cho chính mình danh sách\nkhách hàng của mình khi rời khỏi công ty là không được phép theo Tiêu chuẩn IV(A).\nB. Không chính xác vì theo Tiêu chuẩn IV(A), Lòng trung thành, Bao gồm trong Tiêu chuẩn IV(A) là\nyêu cầu các thành viên và ứng viên phải kiêng các hoạt động cạnh tranh độc lập có thể\nxung đột với lợi ích của người sử dụng lao động của họ. Mặc dù Tiêu chuẩn IV(A) không ngăn cản các thành viên hoặc\ntham gia kinh doanh độc lập khi vẫn đang làm việc, nhưng các thành viên và\nứng viên dự định tham gia hành nghề độc lập để nhận thù lao phải thông báo cho\nchủ lao động của họ và mô tả loại dịch vụ họ sẽ cung cấp cho khách hàng độc lập tiềm năng,\nthời gian dự kiến ​​của dịch vụ và thù lao cho dịch vụ. Các thành viên và ứng viên\nkhông được cung cấp dịch vụ cạnh tranh cho đến khi họ nhận được sự đồng ý từ chủ lao động của mình đối với tất cả\nđiều khoản của thỏa thuận.\nC. Đúng vì theo Tiêu chuẩn IV(A). Lòng trung thành, tiêu chuẩn không cấm\nnhân viên cũ liên hệ với khách hàng của công ty trước của họ miễn là thông tin liên hệ không\nđến từ hồ sơ của người sử dụng lao động cũ hoặc vi phạm 'thỏa thuận không cạnh tranh hiện hành.\nCác thành viên và ứng viên có quyền sử dụng thông tin công khai sau khi rời đi để liên hệ với khách hàng cũ\nmà không vi phạm Tiêu chuẩn IV(A) miễn là không có thỏa thuận cụ thể không làm như vậy.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":50,"q":"To use a quantitative model in her investment research, a member is required by the\nStandards to:","opts":["have developed or co-developed the model.","become an expert in every technical aspect of the model developed by others.","understand the assumptions and limitations inherent in the model developed by others."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn V (A), Sự siêng năng và Cơ sở hợp lý, để sử dụng các mô hình định lượng\ntrong nghiên cứu đầu tư của mình, một thành viên không bắt buộc phải đích thân phát triển hoặc cùng phát triển\nmô hình. Tiêu chuẩn yêu cầu thành viên hiểu các giả định và hạn chế vốn có\ntrong mô hình do những người khác phát triển, như được mô tả trong cơ sở phản hồi cho câu trả lời đúng.\nB. Không chính xác vì theo Tiêu chuẩn V(A), Siêng năng và Cơ sở hợp lý. Mặc dù họ\n[thành viên] không bắt buộc phải trở thành chuyên gia về mọi khía cạnh kỹ thuật của mô hình, nhưng họ phải\nhiểu các giả định và hạn chế cố hữu trong bất kỳ mô hình nào cũng như cách sử dụng kết quả trong\nquá trình ra quyết định. Do đó, để sử dụng các mô hình định lượng trong nghiên cứu đầu tư của mình, thành viên\nchỉ cần hiểu các giả định và hạn chế vốn có trong mô hình\ndo người khác phát triển, như được mô tả trong cơ sở phản hồi cho câu trả lời đúng.\nC. Đúng vì theo Tiêu chuẩn V (A), Sự siêng năng và Cơ sở hợp lý, các Thành viên và\nứng viên cần hiểu biết về các tham số được sử dụng trong các mô hình và nghiên cứu định lượng\nđược đưa vào khuyến nghị đầu tư của họ. Mặc dù họ không bắt buộc\ntrở thành chuyên gia về mọi khía cạnh kỹ thuật của mô hình, nhưng họ phải hiểu\ncác giả định và hạn chế cố hữu trong bất kỳ mô hình nào cũng như cách sử dụng kết quả trong quá trình ra quyết định-\n. Do đó, để sử dụng các mô hình định lượng trong nghiên cứu đầu tư của mình, một thành viên\ncần phải hiểu các giả định và hạn chế vốn có trong mô hình do những người khác phát triển.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":51,"q":"Tim Newman, CFA, is an investment manager. One of his clients directs Newman to use\nMercer brokerage to execute trades. Newman believes Mercer does not offer best execution,\nbut uses the brokerage commissions to purchase research services for his client. Newman\ninforms the client that he may not be getting best execution. Are Newman's actions\nconsistent with the Standard relating to loyalty, prudence, and care?","opts":["Yes.","No, because he used commissions to purchase research.","No, because he failed to achieve best execution for the client."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn III(A) Loyalty Prudence and Care, đôi khi, một\nkhách hàng sẽ chỉ đạo người quản lý sử dụng công ty môi giới của khách hàng để mua hàng hóa hoặc dịch vụ cho khách hàng,\nmột thông lệ thường được gọi là \"môi giới theo chỉ đạo \"Bởi vì hoa hồng môi giới là tài sản\ncủa khách hàng và được sử dụng để mang lại lợi ích cho khách hàng đó chứ không phải người quản lý nên hành vi đó không vi phạm bất kỳ\nnghĩa vụ trung thành. Ngoài ra, thành viên hoặc ứng viên phải tiết lộ với khách hàng rằng khách hàng có thể không\nnhận được sự khớp lệnh tốt nhất từ ​​nhà môi giới được chỉ đạo. Ngoài ra, xung đột có thể nảy sinh khi người quản lý đầu tư\nsử dụng môi giới khách hàng để mua dịch vụ nghiên cứu, một thông lệ thường\nđược gọi là \"đô la mềm\" hoặc \"hoa hồng mềm\". Một thành viên hoặc ứng viên trả hoa hồng môi giới\ncao hơn ne hoặc cô ấy thường trả để cho phép mua hàng hóa hoặc dịch vụ,\nmà không mang lại lợi ích tương ứng cho khách hàng, đánh giá cao nghĩa vụ trung thành với khách hàng trong trường hợp này\nnghiên cứu có chất lượng cao và mang lại lợi ích cho khách hàng, vì vậy Newman không vi phạm Tiêu chuẩn\nB. Không chính xác vì theo Tiêu chuẩn III(A) Lòng trung thành, Thận trọng và Cẩn trọng, xung đột có thể phát sinh\nkhi người quản lý đầu tư sử dụng môi giới khách hàng để mua dịch vụ nghiên cứu, một thông lệ\nthường được gọi là \"đô la mềm\" hoặc \"hoa hồng mềm\". Một thành viên hoặc ứng viên trả hoa hồng môi giới\ncao hơn mức họ thường trả để cho phép mua hàng hóa hoặc\ndịch vụ mà không mang lại lợi ích tương ứng cho khách hàng, vi phạm nghĩa vụ trung thành với khách hàng. Trong trường hợp\nnày, nghiên cứu có chất lượng cao và mang lại lợi ích cho khách hàng, vì vậy Newman không vi phạm\nTiêu chuẩn.\nC. Không chính xác vì theo Tiêu chuẩn III(A) Lòng trung thành, Thận trọng và Cẩn trọng, đôi khi, một\nkhách hàng sẽ chỉ đạo người quản lý sử dụng công ty môi giới của khách hàng để mua hàng hóa hoặc dịch vụ cho khách hàng,\nmột thông lệ thường được gọi là \"môi giới được chỉ định\". Vì hoa hồng môi giới là tài sản\ncủa khách hàng và được sử dụng để mang lại lợi ích cho khách hàng đó chứ không phải người quản lý, nên hành vi đó không vi phạm bất kỳ\nnghĩa vụ trung thành nào.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":52,"q":"After thorough analysis, Algiris Vasilis, CFA, prepares a \"buy\" recommendation on a\ncompany's stock. In the report he writes: \"The company will beat analysts' earnings\nprojections next month.\" Vasilis first shares the recommendation with all clients by email. He\nthen calls each of his clients by phone to present the recommendation. Has Vasilis violated\nthe Standards?","opts":["No","Yes, by calling each of his clients by phone to present the recommendation","Yes, by writing in the report, \"The company will beat analysts' earnings projections next month\""],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn V (B), Giao tiếp với Khách hàng và Khách hàng\nTiềm năng, dữ kiện phải được tách biệt khỏi ý kiến, như được mô tả trong cơ sở lý luận phản hồi cho câu trả lời\nchính xác.\nB. Không chính xác vì theo Tiêu chuẩn III (B), Giao dịch công bằng, Thành viên và Ứng viên phải giao dịch\nmột cách công bằng và khách quan với tất cả khách hàng khi cung cấp phân tích đầu tư, đưa ra khuyến nghị\nđầu tư, thực hiện hành động đầu tư hoặc tham gia vào các hoạt động chuyên môn khác. Ngoài ra,\nTiêu chuẩn III(B) không quy định như nhau vì các thành viên và ứng viên không thể tiếp cận tất cả\nkhách hàng vào cùng một thời điểm chính xác - cho dù bằng thư in, điện thoại (bao gồm cả tin nhắn văn bản),\nmáy tính (bao gồm cập nhật internet và phân phối e-mail). fax (fax), hoặc điện tín. Mỗi khách hàng đều có\nnhu cầu, tiêu chí đầu tư và mục tiêu đầu tư riêng biệt, vì vậy không phải mọi cơ hội đầu tư\nđều phù hợp với mọi khách hàng. Trong trường hợp này, email được gửi đến tất cả khách hàng và sau đó khách hàng nhận được cuộc gọi, vì vậy\ntất cả họ đều nhận được đề xuất một cách công bằng.\nNgoài ra, Tiêu chuẩn V (B). Giao tiếp với Khách hàng và Khách hàng tiềm năng gợi ý:\ngiao tiếp không chỉ giới hạn ở loại báo cáo bằng văn bản do nhà phân tích\nnghiên cứu về chứng khoán, công ty hoặc ngành tạo ra theo cách truyền thống. Việc trình bày thông tin có thể được thực hiện thông qua bất kỳ\nphương tiện liên lạc nào, bao gồm đề xuất hoặc mô tả trực tiếp, cuộc trò chuyện qua điện thoại\n, phương tiện truyền thông hoặc truyền qua máy tính (ví dụ: trên internet).\nC. Đúng vì theo Tiêu chuẩn V (B), Giao tiếp với khách hàng và khách hàng tiềm năng,\ný kiến ​​phải được tách biệt khỏi thực tế. Vi phạm thường xảy ra khi các báo cáo không tách biệt quá khứ khỏi\ntương lai bằng cách không chỉ ra rằng ước tính thu nhập, những thay đổi trong triển vọng cổ tức hoặc thông tin giá thị trường\ntương lai là những ý kiến ​​tùy thuộc vào hoàn cảnh trong tương lai. Trong trường hợp này, tuyên bố\nđề cập đến kết quả trong tương lai có thể đúng hoặc không đúng, do đó là vi phạm.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":53,"q":"Melissa Kon, CFA, is an equity analyst. She recently left her job at Hamm Capital (HC) to\njoin Eagle Investments (EI). Kon obtains the express consent of HC to take one of her\nhistorical research reports with her. At El, she diligently updates and publishes the report.\nAfterwards, she re-creates supporting records from memory for record keeping purposes. Has\nKon violated the Standards?","opts":["No.","Yes, by publishing the updated research report.","Yes, by re-creating supporting records from memory."],"ans":"C","expl":"A. Không chính xác vì Kon đã vi phạm Tiêu chuẩn V(C). Lưu giữ bản ghi, bằng cách tạo lại các bản ghi\nhỗ trợ từ bộ nhớ như được mô tả trong cơ sở phản hồi chính xác.\nB. Không chính xác vì theo Tiêu chuẩn V (C), Lưu giữ hồ sơ, Kon-không vi phạm\nTiêu chuẩn bằng cách xuất bản báo cáo nghiên cứu cập nhật vì cô ấy đã nhận được sự đồng ý rõ ràng của\nchủ cũ của mình. Tiêu chuẩn V(C), Lưu giữ hồ sơ, nêu rõ Khi một thành viên hoặc ứng viên rời công ty\nđể tìm việc làm khác, thành viên hoặc ứng viên đó không được phép mang tài sản của công ty,\nbao gồm các biểu mẫu gốc hoặc bản sao hồ sơ hỗ trợ về công việc của thành viên hoặc ứng viên, cho\nnhà tuyển dụng mới mà không có sự đồng ý rõ ràng của nhà tuyển dụng trước đó.\nC. Đúng vì theo Tiêu chuẩn V (C), Lưu giữ bản ghi, thành viên không được tạo lại\nbản ghi hỗ trợ từ bộ nhớ. Tiêu chuẩn V(C), Lưu giữ hồ sơ, nêu rõ Thành viên hoặc ứng viên\nkhông thể sử dụng các đề xuất lịch sử hoặc báo cáo nghiên cứu được tạo tại công ty trước đó vì\ntài liệu hỗ trợ không có sẵn. Để sử dụng trong tương lai, thành viên hoặc ứng viên phải tạo lại\nhồ sơ hỗ trợ tại công ty mới bằng thông tin được thu thập thông qua các nguồn công khai hoặc trực tiếp\ntừ công ty được liên kết chứ không phải từ bộ nhớ hoặc các nguồn có được từ chủ lao động trước đó.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":54,"q":"Amy Joy, CFA, works at Parklane Investments Ltd. (PIL). When presenting to PIL's\nprospective clients, Joy uses a brief investment performance summary and makes available\ndetailed supporting information only upon client request. Has Joy violated the Standards?","opts":["No.","Yes, the Standard relating to fair dealing.","Yes, the Standard relating to performance presentation."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn III(D), Trình bày Hiệu suất, nếu bài trình bày ngắn gọn\n, thành viên hoặc ứng viên phải cung cấp cho khách hàng và khách hàng tiềm năng, theo yêu cầu,\nthông tin chi tiết hỗ trợ thông tin liên lạc đó. Bằng cách cung cấp thông tin hỗ trợ chi tiết\ntheo yêu cầu, Joy không vi phạm Tiêu chuẩn III(D). Ngoài ra, Joy không vi phạm\nTiêu chuẩn III(B), Giao dịch công bằng, quy định rằng các thành viên và Ứng viên phải đối xử công bằng và\nkhách quan với tất cả khách hàng khi cung cấp phân tích đầu tư, đưa ra các khuyến nghị\nđầu tư, thực hiện hành động đầu tư hoặc tham gia vào các hoạt động chuyên môn khác.\nB. Không chính xác vì Tiêu chuẩn III(B), Xử lý công bằng, chưa bị vi phạm như được mô tả trong câu trả lời\ncơ sở lý luận của câu trả lời đúng\nC. Không chính xác vì Tiêu chuẩn III(D), Trình bày hiệu suất, chưa bị vi phạm như được mô tả\ntrong cơ sở phản hồi của câu trả lời đúng.\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":55,"q":"Hannah Hostettler, CFA, is a portfolio manager at a wealth management firm. Hostettler\nhas an arrangement with a lawyer, whereby she refers clients who need legal advice to the\nlawyer, who in turn refers clients to Hostettler. Because no referral fees are involved,\nHostettler does not disclose this arrangement to her existing or prospective clients. Has\nHostettler most likely violated the Standards?","opts":["No.","Yes, both by failing to disclose the arrangement to existing clients.","Yes, only by failing to disclose the arrangement to existing clients and to prospective clients."],"ans":"C","expl":"A. Không chính xác vì Hostettler đã vi phạm Tiêu chuẩn như được mô tả trong phần giải thích cho câu trả lời\nđúng.\nB. Không chính xác vì Hostettler sẽ cần tiết lộ thỏa thuận giới thiệu cho cả khách hàng hiện tại và\ntương lai như được mô tả trong phần giải thích cho câu trả lời đúng.\nC. Đúng vì theo Tiêu chuẩn VI (C), Phí giới thiệu, các thành viên phải tiết lộ cho khách hàng và\nkhách hàng tiềm năng mọi thỏa thuận giới thiệu và phải tiết lộ tất cả những cân nhắc. \"Việc xem xét\nbao gồm tất cả các khoản phí, cho dù được thanh toán bằng tiền mặt, đô la mềm hay bằng hiện vật.\" Do đó, Hostettler cần phải\ntiết lộ đầy đủ thỏa thuận giới thiệu song phương đầy đủ cho cả khách hàng và khách hàng tiềm năng.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":56,"q":"Thomas Huang, CFA, is an investment advisor for Newline Partners (NP). NP has an\nagreement with brokerage firm Ridge Capital (RC). Huang refers clients to RC in exchange for\ncompensation. RC pays a cash fee to NP for referrals. Before entering into formal agreements\nfor services. Huang makes the following disclosure to NP's clients: \"Please note that Newline\nPartners receives an annual cash percentage fee from Ridge Capital for the referral of\nclients.\" Huang omits disclosure of the estimated dollar value of the referrals. Has Huang\nviolated the Standards?","opts":["No.","Yes, by accepting a cash fee for referral of clients.","Yes, by not disclosing the estimated dollar value of the fee."],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn VI(C), Phí giới thiệu, Huang phải tiết lộ\ngiá trị đô la ước tính của khoản phí như được mô tả trong cơ sở phản hồi chính xác.\nB. Không chính xác vì Tiêu chuẩn VI(C), Phí giới thiệu, cho phép các thành viên chấp nhận phí giới thiệu khách hàng\ntheo các điều kiện nhất định như được mô tả trong cơ sở phản hồi chính xác.\nC. Đúng vì theo Tiêu chuẩn VI(C), Phí giới thiệu, các thành viên phải tiết lộ cả\nbản chất của việc xem xét và giá trị đồng đô la ước tính. Việc tiết lộ phù hợp có nghĩa là\ncác thành viên và ứng viên phải thông báo cho khách hàng hoặc khách hàng tiềm năng, trước khi ký kết bất kỳ\nthỏa thuận chính thức nào về dịch vụ, về bất kỳ lợi ích nào được cung cấp hoặc nhận được từ việc giới thiệu bất kỳ dịch vụ nào\ndo thành viên hoặc ứng viên cung cấp. Ngoài ra, thành viên hoặc ứng cử viên phải tiết lộ\nbản chất của việc xem xét hoặc lợi ích-ví dụ: cơ sở phí cố định hoặc tỷ lệ phần trăm. lợi ích một lần hoặc\nliên tục, dựa trên hiệu suất, lợi ích dưới hình thức cung cấp nghiên cứu hoặc\nlợi ích không dùng tiền mặt khác-cùng với giá trị đồng đô la ước tính. Việc xem xét bao gồm tất cả các khoản phí, cho dù\nđược thanh toán bằng tiền mặt. bằng đô la mềm hoặc hiện vật.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":57,"q":"Which of the following is a recommended procedure for compliance with the Standard\nrelating to preservation of confidentiality?\nProcedure 1: Members should convey to clients that not all firm-sponsored communication\nmethods may be suitable for transmitting confidential information.\nProcedure 2: Members should encourage their firms to provide periodic training on\nconfidentiality procedures to all clients.\nProcedure 3: Members should become experts in information technology security in order to\nprotect client confidentiality.","opts":["Procedure 1","Procedure 2","Procedure 3"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn III(E) liên quan đến việc bảo mật, các thành viên\nvà ứng viên nên truyền đạt cho khách hàng rằng không phải tất cả các nguồn lực do công ty tài trợ đều có thể phù hợp\ncho những thông tin liên lạc như vậy.\nB. Không chính xác vì theo Tiêu chuẩn III(E) liên quan đến việc bảo mật, các thành viên\nvà các ứng viên nên khuyến khích công ty của họ tiến hành đào tạo định kỳ thường xuyên về các quy trình bảo mật\ncho tất cả nhân viên của công ty, bao gồm cả cộng tác viên danh mục đầu tư, nhân viên lễ tân và những nhân viên không thuộc\nđầu tư có liên hệ trực tiếp thường xuyên với khách hàng và hồ sơ của họ. Việc đào tạo\nnên dành cho nhân viên của công ty chứ không phải cho khách hàng.\nC. Không chính xác vì Tiêu chuẩn III(E) liên quan đến bảo mật, không yêu cầu\nthành viên hoặc ứng viên trở thành chuyên gia về công nghệ bảo mật thông tin, nhưng họ phải có\nhiểu biết thấu đáo về chính sách của người sử dụng lao động của họ.\nTiêu chuẩn đạo đức và nghề nghiệp: đề xuất các phương pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":58,"q":"Marianne Lynn is registered for the CFA Level I exam. A few weeks after registration, she\nrealizes that she is unable to prepare for the exam due to work commitments, so she informs\nCFA Institute that she declines to sit for the exam. Afterwards, shortly before the exam date,\nshe posts on social media that she is a CFA candidate. Separately, Thomas Petrov, CFA, posts\nhis investment views anonymously on social media and tags his post using \"#CFA charter.\"\nWho has violated the Standards?","opts":["Lynn only","Petrov only","Both Lynn and Petrov"],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn VII(B), Tham khảo Viện CFA, Chỉ định CFA\nvà Chương trình CFA, cả hai đều vi phạm Tiêu chuẩn, như được mô tả trong cơ sở phản hồi của\ncâu trả lời đúng\nB. Không chính xác vì theo Tiêu chuẩn VII(B), Tham khảo Viện CFA, Chỉ định CFA\nvà Chương trình CFA, cả hai đều vi phạm Tiêu chuẩn, như được mô tả trong cơ sở phản hồi của\ncâu trả lời đúng.\nC. Đúng vì theo Tiêu chuẩn VII(B), Tham chiếu đến Viện CFA, Chỉ định CFA và\nChương trình CFA, Petrov vi phạm Tiêu chuẩn VII(B) vì khi các cá nhân có thể ẩn danh\nbày tỏ ý kiến, bút danh hoặc tên hồ sơ trực tuyến được tạo để che giấu danh tính của một thành viên\nkhông nên được gắn thẻ chỉ định CFA. Lynn vi phạm Tiêu chuẩn VII(B) vì nếu một cá nhân\nđược đăng ký Chương trình CFA nhưng từ chối tham gia kỳ thi hoặc không đáp ứng\nđịnh nghĩa về ứng viên như được mô tả trong Nội quy của Viện CFA, thì cá nhân đó không còn\nđược coi là ứng viên tích cực\nTiêu chuẩn đạo đức và nghề nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":59,"q":"Melinda Jacobs, CFA, is a portfolio manager with SFM Asset Managers (SFM). Jacobs\nteaches an investment course at a business school on weekends for a fee. Jacobs is planning\nto leave SFM and has begun to develop marketing materials for a new business that will\ncompete with SFM. Has Jacobs most likely violated the Standards?","opts":["No","Yes, by accepting a fee from the business school","Yes, by developing marketing materials for her new business that will compete with SFM"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn IV (A), Lòng trung thành, có yêu cầu các thành viên và\nứng viên phải kiêng các hoạt động cạnh tranh độc lập có thể xung đột với lợi ích của\nngười sử dụng lao động của họ. Nhiệm vụ giảng dạy của Jacobs tại một trường kinh doanh vào cuối tuần dường như không mâu thuẫn với vai trò là người quản lý danh mục đầu tư của cô. Ngoài ra, đối với Tiêu chuẩn IV (B), các Thỏa thuận đền bù\nbổ sung. Thành viên và Ứng viên không được nhận quà tặng, lợi ích,\nbồi thường hoặc sự cân nhắc cạnh tranh hoặc có thể được cho là sẽ tạo ra\nxung đột lợi ích với lợi ích của chủ lao động của họ trừ khi họ nhận được sự đồng ý bằng văn bản của tất cả các bên\nliên quan. Bởi vì hoạt động giảng dạy của cô ấy không cạnh tranh và cũng không được cho là sẽ tạo ra\nxung đột lợi ích với người sử dụng lao động của mình nên cô ấy không vi phạm các Tiêu chuẩn liên quan đến công việc giảng dạy\ncủa mình. Jacobs cũng không vi phạm các Tiêu chuẩn liên quan đến hành động\nthu xếp để bắt đầu một doanh nghiệp cạnh tranh bởi vì một nhân viên rời đi thường được tự do\nsắp xếp hoặc chuẩn bị để tham gia vào một doanh nghiệp cạnh tranh trước khi chấm dứt\nmối quan hệ với người chủ của mình miễn là việc chuẩn bị đó không vi phạm nghĩa vụ trung thành\ncủa nhân viên. trường hợp.\nB. Không chính xác vì nhiệm vụ giảng dạy cuối tuần của Jacob cũng như hành động của cô ấy trong việc sắp xếp\nđể tham gia vào hoạt động kinh doanh cạnh tranh trước khi chấm dứt mối quan hệ với người chủ của mình\nđều vi phạm Tiêu chuẩn, như được mô tả trong phần giải thích cho câu trả lời đúng.\nC. Không chính xác vì nhiệm vụ giảng dạy cuối tuần của Jacob cũng như hành động của cô ấy trong việc sắp xếp\nđể tham gia vào hoạt động kinh doanh cạnh tranh trước khi chấm dứt mối quan hệ với người chủ của mình\nđều vi phạm Tiêu chuẩn, như được mô tả trong phần giải thích cho câu trả lời đúng.\nTiêu chuẩn đạo đức và nghề nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến các vấn đề về liêm chính nghề nghiệp","qhtml":null},{"n":60,"q":"Which of the following individuals can refer to themselves as a candidate in the CFA\nProgram?\nIndividual 1: Has passed Level II and expects to register for Level III in a couple of months\nIndividual 2: Has failed Level I and expects to retake the exam in its next administration\nIndividual 3: Is awaiting results of the Level III exam","opts":["Individual 1","Individual 2","Individual 3"],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn VII(B), Tham chiếu đến Viện CFA, Chỉ định CFA,\nvà Chương trình CFA, một người là ứng viên trong Chương trình CFA nếu đơn đăng ký\ntrong Chương trình CFA của người đó đã được Viện CFA chấp nhận, bằng chứng là bằng việc ban hành một\nthông báo chấp nhận và người đó được đăng ký tham gia một kỳ thi cụ thể. Vì cá nhân\nchưa đăng ký kỳ thi Cấp III nên cá nhân không thể tự nhận mình là ứng viên CFA\n.\nB. Không chính xác vì theo Tiêu chuẩn VII(B), Tham chiếu đến Viện CFA, Chỉ định CFA,\nvà Chương trình CFA, một người là ứng viên trong Chương trình CFA nếu đơn đăng ký\ntrong Chương trình CFA của người đó đã được Viện CFA chấp nhận, bằng chứng là bằng việc ban hành một\nthông báo chấp nhận và người đó được đăng ký tham gia một kỳ thi cụ thể. Vì cá nhân\nchưa đăng ký kỳ thi Cấp III nên cá nhân không thể tự nhận mình là ứng viên CFA\n.\nC. Đúng vì theo Tiêu chuẩn VII(B), Tham chiếu đến Viện CFA, Chỉ định CFA,\nvà Chương trình CFA, một người là ứng viên trong Chương trình CFA nếu người đã đăng ký đã tham dự\nmột kỳ thi cụ thể nhưng chưa nhận được kết quả thi.\nTiêu chuẩn đạo đức và chuyên nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn và\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":61,"q":"Kelvin Lee, CFA, is a portfolio manager at an investment firm. His social media profile\nreads: \"Kelvin Lee passed all three CFA examinations in three consecutive years. As a CFA\ncharterholder, Lee achieves better investment performance results.\" Has Lee violated the\nStandards?","opts":["No","Yes, by stating that he passed all three CFA Program examinations in three consecutive years","Yes, by stating that he achieves better investment performance results as a CFA charterholder"],"ans":"C","expl":"A. Không chính xác vì theo Tiêu chuẩn VII(B), Tham khảo Viện CFA, Chỉ định CFA,\nvà Chương trình CFA, những người đã có quyền sử dụng Công cụ phân tích tài chính Chartered\nchỉ định được khuyến khích làm như vậy nhưng chỉ theo cách không xuyên tạc hoặc phóng đại\nNgoài ra, ý nghĩa hoặc hàm ý của việc chỉ định, nếu sau đó ứng viên tiếp tục tuyên bố hoặc\nngụ ý khả năng vượt trội bằng cách đạt được danh hiệu chỉ trong ba năm, tuy nhiên, người đó đang ở\nvi phạm Tiêu chuẩn VII(B). Lee nói rằng với tư cách là người sở hữu hợp đồng CFA, anh ấy đạt được mức đầu tư tốt hơn\nkết quả thực hiện. Vì vậy, anh ta đã vi phạm Tiêu chuẩn VII(B).\nB. Không chính xác vì theo Tiêu chuẩn VII(B), Tham khảo Viện CFA, Chỉ định CFA,\nvà Chương trình CFA, nếu thí sinh vượt qua từng cấp độ của kỳ thi trong những năm liên tiếp và muốn\ntuyên bố rằng họ đã làm như vậy thì điều đó không vi phạm Tiêu chuẩn VII(B) vì đó là sự trình bày sự thật.\nLee chỉ nêu thực tế là anh đã vượt qua cả ba kỳ thi của Chương trình CFA trong ba kỳ thi liên tiếp.\nnăm. Vì vậy, ông không vi phạm Tiêu chuẩn VII(B).\nC. Đúng vì theo Tiêu chuẩn VII(B), Tham khảo Viện CFA, Chỉ định CFA,\nvà Chương trình CFA, những người đã có quyền sử dụng Công cụ phân tích tài chính Chartered\nchỉ định được khuyến khích làm như vậy nhưng chỉ theo cách không xuyên tạc hoặc phóng đại\ný nghĩa hoặc ý nghĩa của việc chỉ định. Ngoài ra, nếu sau đó ứng viên tiếp tục khiếu nại hoặc\nngụ ý khả năng vượt trội bằng cách đạt được danh hiệu chỉ trong ba năm, tuy nhiên, người đó đang ở\nvi phạm Tiêu chuẩn VII(B). Lee nói rằng với tư cách là người sở hữu hợp đồng CFA, anh ấy đạt được mức đầu tư tốt hơn\nkết quả thực hiện. Vì vậy, anh ta đã vi phạm Tiêu chuẩn VII(B).\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn và\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":62,"q":"According to the Standards, which of the following statements relating to a member in a\nsupervisory position is accurate?\nStatement 1: The member must make reasonable efforts to ensure that anyone subject to her\nsupervision complies with the Code and Standards.\nStatement 2: The member must adopt the CFA Institute Code of Ethics to substitute for lack\nof compliance procedures until the firm adopts reasonable procedures to allow adequate\nexercise of supervisory responsibility.","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn IV(C), Trách nhiệm của Người giám sát, Thành viên và\nỨng viên phải nỗ lực hợp lý để đảm bảo rằng bất kỳ ai chịu sự giám sát của họ hoặc\nxác thực đều tuân thủ các luật, quy tắc, quy định hiện hành cũng như Quy tắc và Tiêu chuẩn. Do đó,\nTuyên bố 1 là chính xác:\nB. Không chính xác vì theo Tiêu chuẩn IV(C), Trách nhiệm của Người giám sát, nếu thành viên hoặc\ncleany không thể thực hiện trách nhiệm giám sát do thiếu hệ thống tuân thủ\nhoặc do hệ thống tuân thủ không đầy đủ, thì thành viên hoặc ứng viên\nnên từ chối bằng văn bản chấp nhận trách nhiệm giám sát cho đến khi công ty áp dụng\nthủ tục hợp lý để cho phép thực hiện đầy đủ trách nhiệm giám sát. Do đó, Tuyên bố 2 không\nchính xác\nC. Không chính xác vì theo Tiêu chuẩn IV(C) Trách nhiệm của Người giám sát, nếu thành viên hoặc\nứng viên Rõ ràng không thể thực hiện trách nhiệm giám sát do thiếu hệ thống tuân thủ\nhoặc do hệ thống tuân thủ không đầy đủ, thì thành viên hoặc ứng viên\nnên từ chối bằng văn bản chấp nhận trách nhiệm giám sát cho đến khi công ty áp dụng\nthủ tục hợp lý để cho phép thực hiện đầy đủ trách nhiệm giám sát 2 không\nchính xác.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":63,"q":"Emma Berkstein, CFA, uses third-party data to prepare a report on a company. Berkstein\ndoes not check the validity of this data herself, but instead relies on her senior colleagues to\nconduct due diligence. Another analyst at the same firm, Jimmy Brooks, CFA, prepares an\nindustry report with a group of colleagues. After thorough research, the group agrees to issue\na report with a positive outlook for the industry. Brooks disagrees with this conclusion, but\nleaves his name in the report. Has the Standard relating to diligence and reasonable basis\nmost likely been violated?","opts":["No.","Yes, by Brooks.","Yes, by Berkstein."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn V(A), Sự siêng năng và Cơ sở hợp lý, Thành viên A hoặc\nứng viên có thể dựa vào những người khác trong công ty của mình để xác định liệu bên thứ cấp hay bên thứ ba có\nnghiên cứu là đúng đắn và sử dụng Thông tin một cách thiện chí trừ khi thành viên hoặc ứng viên có lý do\nđặt câu hỏi về tính hợp lệ của nó hoặc các quy trình và thủ tục được sử dụng bởi những người chịu trách nhiệm nghiên cứu.\nBerkstein đã dựa vào sự thẩm định của đồng nghiệp cấp cao của cô ấy và không có gì trong trường hợp này để gợi ý\ncô ấy có lý do để đặt câu hỏi, do đó không vi phạm. Brooks cũng không vi phạm Tiêu chuẩn khi để lại\ntên trên báo cáo nhóm: Các kết luận hoặc khuyến nghị của báo cáo nhóm thể hiện\nsự đồng thuận của nhóm và không nhất thiết phải là quan điểm của thành viên hoặc ứng viên, mặc dù\ntên của thành viên hoặc ứng cử viên được đưa vào báo cáo. Trong một số trường hợp, một thành viên hoặc\nứng viên sẽ không đồng ý với quan điểm của nhóm. Tuy nhiên, nếu thành viên hoặc ứng cử viên đó tin rằng\nrằng ý kiến đồng thuận có cơ sở hợp lý, đầy đủ, độc lập và khách quan,\nthành viên hoặc ứng cử viên không cần phải từ chối xác định danh tính của mình trong báo cáo nếu thành viên hoặc ứng cử viên đó\nứng viên tự tin vào quá trình này, thành viên hoặc ứng viên không cần phải tách khỏi\nbáo cáo ngay cả khi nó không phản ánh quan điểm của họ.\nB. Không chính xác vì theo Tiêu chuẩn V(A). Cần cù và có cơ sở hợp lý, Brooks có thể ra đi\ntên của anh ấy trong báo cáo ngay cả khi anh ấy không đồng ý với kết luận, như được mô tả trong phản hồi\ncăn cứ để có câu trả lời đúng.\nC. Không chính xác vì theo Tiêu chuẩn V(A), Sự siêng năng và Cơ sở hợp lý Berkstein có thể tin cậy\nyêu cầu các đồng nghiệp của cô ấy thực hiện thẩm định, như được mô tả trong phần lý do phản hồi cho câu trả lời đúng\ncâu trả lời\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":64,"q":"Tania Watt, CFA, issues \"buy\" recommendations for several bonds to her clients without\nproviding further details. She notifies the clients that additional information is available upon\nrequest. One week later, the prices of all recommended bonds decline because of an\nunexpected increase in interest rates. Watt's clients suffer large losses as a result, Has Watt\nmost likely violated the Standards?","opts":["No","Yes, by issuing recommendations which result in large losses for her clients","Yes, by issuing \"buy\" recommendations for several bonds to her clients without providing further details."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn V (B), Giao tiếp với khách hàng và khách hàng tiềm năng\nNếu đề xuất được chứa ở dạng viên nang (chẳng hạn như danh sách cổ phiếu được đề xuất), các thành viên\nvà ứng viên phải thông báo cho khách hàng rằng thông tin và phân tích bổ sung có sẵn từ\nngười tạo báo cáo. Ngoài ra, các Thành viên và ứng cử viên phải tiết lộ những rủi ro đáng kể mà họ biết\ntại thời điểm tiết lộ. Các Thành viên và ứng viên không thể tiết lộ những rủi ro mà họ\nkhông biết tại thời điểm đưa ra khuyến nghị hoặc hành động đầu tư. Trong trường hợp này, hành động của ngân hàng\ntrung ương đã xảy ra sau khi khuyến nghị được gửi đi và đó là một động thái bất ngờ, vì vậy\nWatt không thể đổ lỗi cho việc không cảnh báo khách hàng và gây ra tổn thất danh mục đầu tư.\nB. Không chính xác vì Watt không vi phạm Tiêu chuẩn V (B), Giao tiếp với Khách hàng và Khách hàng tiềm năng\n, như được mô tả trong phần lý do phản hồi cho câu trả lời đúng.\nC. Không chính xác vì Watt không vi phạm Tiêu chuẩn V (B), Giao tiếp với Khách hàng và Khách hàng tiềm năng\n, như được mô tả trong phần cơ sở phản hồi cho câu trả lời đúng\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":65,"q":"According to the GIPS standards, a firm:","opts":["must include non-discretionary portfolios in the firm's composites.","may refer to its performance calculation methodology as being \"in accordance with the GIPS standards.\"","may determine a portfolio is non-discretionary if client imposed restrictions interfere with the implementation of the intended strategy."],"ans":"C","expl":"A. Không chính xác vì theo nguyên tắc cơ bản của việc tuân thủ các tiêu chuẩn GIPS, Không\nDanh mục đầu tư tùy ý không được đưa vào danh mục tổng hợp của công ty\nB. Không chính xác vì theo nguyên tắc cơ bản của việc tuân thủ các tiêu chuẩn GIPS, Tuyên bố\nđề cập đến phương pháp tính toán là 'phù hợp', 'phù hợp với' hoặc 'phù hợp với\nTiêu chuẩn Hiệu suất Đầu tư Toàn cầu hoặc các tuyên bố tương tự đều bị cấm.\nC. Đúng vì theo nguyên tắc cơ bản về tuân thủ các tiêu chuẩn GIPS, Nếu\ncác hạn chế do khách hàng áp đặt đã được ghi thành tài liệu cản trở việc thực hiện chiến lược dự định\ntrong trường hợp danh mục đầu tư không còn mang tính đại diện cho chiến lược, công ty có thể xác định\nrằng danh mục đầu tư là không tùy ý.\nTiêu chuẩn đạo đức và nghề nghiệp: mô tả các nguyên tắc cơ bản của việc tuân thủ, bao gồm\nkhuyến nghị của tiêu chuẩn GIPS liên quan đến định nghĩa về công ty và mục tiêu của công ty.\nđịnh nghĩa về quyền quyết định","qhtml":null},{"n":66,"q":"Which of the following is not a key concept of the GIPS standards? The GIPS standards for\nfirms:","opts":["require the use of composites.","rely on the integrity of input data.","address every aspect of performance measurement."],"ans":"C","expl":"A. Không chính xác vì theo tiêu chuẩn GIPS, một trong những khái niệm chính của tiêu chuẩn là\nviệc sử dụng vật liệu tổng hợp bắt buộc. Tổng hợp là sự tổng hợp của một hoặc nhiều danh mục đầu tư được quản lý\ntheo nhiệm vụ, mục tiêu hoặc chiến lược đầu tư tương tự. Do đó, khái niệm chính là\ntiêu chuẩn GIPS yêu cầu tổng hợp một hoặc nhiều danh mục đầu tư được quản lý theo các chiến lược đầu tư\ntương tự trong một tổ hợp.\nB. Không chính xác vì theo tiêu chuẩn GIPS, tiêu chuẩn GIPS dựa vào tính toàn vẹn của\ndữ liệu đầu vào, chất lượng của dữ liệu này rất quan trọng để tạo ra bản trình bày hiệu suất chính xác. Do đó,\nviệc dựa vào tính toàn vẹn của dữ liệu đầu vào là một khái niệm quan trọng.\nC. Đúng vì theo tiêu chuẩn GIPS, tiêu chuẩn GIPS không đề cập đến mọi khía cạnh\ncủa việc đo lường hiệu suất. Do đó, khái niệm chính của tiêu chuẩn GIPS không phải là đề cập đến\nmọi khía cạnh của đo lường hiệu suất.\nTiêu chuẩn đạo đức và chuyên nghiệp: mô tả các khái niệm chính của Tiêu chuẩn GIPS dành cho doanh nghiệp","qhtml":null},{"n":67,"q":"Jayson Kite, CFA, a senior analyst, is preparing a research report on a shipping company.\nKite concludes that the stock of a company is a good investment and decides to put a \"buy\"\nrecommendation on the stock. According to the recommended procedures for compliance,\nKite should communicate the recommendation:","opts":["within the firm first and then to customers.","to customers first and then within the firm.","simultaneously within the firm and to customers."],"ans":"C","expl":"A. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn III (B),\nXử lý công bằng, một thông lệ phổ biến để đảm bảo giao dịch công bằng là truyền đạt các khuyến nghị\nđồng thời trong công ty và tới khách hàng.\nB. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn III (B),\nXử lý công bằng, một thông lệ phổ biến để đảm bảo giao dịch công bằng là truyền đạt các khuyến nghị\nđồng thời trong công ty và tới Khách hàng\nC. Đúng vì theo các thủ tục được khuyến nghị để tuân thủ Tiêu chuẩn III (B).\nXử lý công bằng, một thông lệ phổ biến để đảm bảo giao dịch công bằng là truyền đạt các khuyến nghị\nđồng thời trong công ty và tới khách hàng. Các thành viên và ứng viên nên khuyến khích các công ty\nxây dựng các nguyên tắc cấm nhân sự có kiến ​​thức trước về một đề xuất đầu tư\nthảo luận hoặc thực hiện bất kỳ hành động nào đối với đề xuất đang chờ xử lý. Các thành viên\nvà các ứng cử viên nên khuyến khích các công ty xây dựng các nguyên tắc ngăn cấm những nhân sự có\nbiết trước về đề xuất đầu tư thảo luận hoặc thực hiện bất kỳ hành động nào đối với\nđề xuất đang chờ xử lý.\nTiêu chuẩn đạo đức và nghề nghiệp: đánh giá các thực tiễn, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn ứng xử nghề nghiệp của CFA","qhtml":null},{"n":68,"q":"Hugh Matthew, CFA, covers several companies within a sector. After thorough analysis of\neach company, he issues \"buy\" recommendations for each company. In each report, Matthew\ndiscloses the assumptions, methodology and risk factors used in his research. Two weeks\nlater, an unexpected event occurs that negatively impacts the sector. As a result, all the\ncompanies Matthew covers experience significant losses. Has Matthew most likely violated\nthe Standards?","opts":["No","Yes, the Standard relating to diligence and reasonable basis","Yes, the Standard relating to communication with clients and prospective clients"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn V (B), Phân tích đầu tư, Khuyến nghị và Hành động\n- Giao tiếp với Khách hàng và Khách hàng tiềm năng, các Thành viên và ứng viên không thể mong đợi\ntiết lộ những rủi ro mà họ không biết tại thời điểm đưa ra khuyến nghị hoặc hành động đầu tư.\nKhi đánh giá việc tuân thủ Tiêu chuẩn V(B), điều quan trọng là phải thiết lập kiến ​​thức về\nrủi ro hoặc hạn chế đáng kể có mục đích. Khoản lỗ đầu tư một lần xảy ra sau khi tiết lộ không\nkhông phải là yếu tố thích hợp để đánh giá liệu các rủi ro và hạn chế đáng kể có được tiết lộ đúng\n hay không. Việc không biết về rủi ro hoặc hạn chế dẫn đến thua lỗ có thể cho thấy\nsự thiếu sót trong tính siêng năng và cơ sở hợp lý trong nghiên cứu của thành viên hoặc ứng viên nhưng có thể\nkhông tiết lộ hành vi vi phạm Tiêu chuẩn V(B).\nB. Không chính xác vì hành vi được mô tả không vi phạm Cơ sở\nhợp lý và siêng năng của Tiêu chuẩn V(A), các Thành viên và Ứng viên phải: 1. Thực hiện sự siêng năng, độc lập và kỹ lưỡng trong\nphân tích đầu tư, đưa ra khuyến nghị đầu tư và thực hiện các hành động đầu tư. 2.Có\ncơ sở hợp lý và đầy đủ, được hỗ trợ bởi nghiên cứu và điều tra thích hợp, cho bất kỳ\nphân tích, đề xuất hoặc hành động đầu tư nào.\nC. Không chính xác vì theo Tiêu chuẩn V (B), Giao tiếp với Khách hàng và Khách hàng tiềm năng\n, Sự phù hợp của việc tiết lộ rủi ro phải được đánh giá dựa trên những gì đã biết tại\nthời điểm thực hiện hành động đầu tư (thường được gọi là cơ sở trước). Các thành viên và ứng viên\nphải tiết lộ những rủi ro đáng kể mà họ biết tại thời điểm tiết lộ. Các thành viên và ứng viên\nkhông được phép tiết lộ những rủi ro mà họ không biết tại thời điểm thực hiện các khuyến nghị hoặc\nhành động đầu tư. Khi đánh giá sự tuân thủ Tiêu chuẩn V(B), điều quan trọng là phải thiết lập\nkiến thức về rủi ro hoặc hạn chế đáng kể được cho là có mục đích. Khoản lỗ đầu tư một lần xảy ra sau khi\ntiết lộ không phải là yếu tố thích hợp để đánh giá liệu các rủi ro đáng kể và\
