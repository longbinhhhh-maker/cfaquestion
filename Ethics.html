<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following statements most likely reflects one of the six components of the\nCFA Code of Ethics? Candidates must:", "opts": ["place the integrity of the investment profession above their own interests.", "promote the viability of the global capital markets for their employer's benefit.", "ignore unprofessional conduct displayed by others within the profession."], "ans": "A", "expl": "A. Correct. CFA charterholders and candidates must place the integrity of the investment profession\nand the interests of clients above their own personal interests.\nB. Incorrect. CFA charterholders and candidates must promote the integrity and viability of the\nglobal capital markets for the ultimate benefit of society.\nC. Incorrect. Charterholders and candidates must practice and encourage others to participate in a\nprofessional and ethical manner that will reflect credit on themselves and the profession. By\nignoring unprofessional conduct of others, a member or candidate is not encouraging others to\nbehave in a manner that reflects well on the profession\nEthical and Professional Standards: identify the six components of the Code of Ethics and the seven\nStandards of Professional Conduct", "qhtml": null}, {"n": 2, "q": "A profession is most likely described as a group of people that:", "opts": ["has a common level of basic knowledge about a particular subject.", "monitors its members based on an agreed-oncode of ethics.", "puts the interests of its members first."], "ans": "B", "expl": "A. Incorrect. A profession is based on a specialized knowledge and skills, not basic knowledge.\nB. Correct. A profession is practiced by members who share and agree to adhere to a common code\nof ethics, and a profession is based on a specialized knowledge and skills and service to others.\nC. Incorrect. A profession is based on service to others that may not necessarily mean the interests\nof its members come first.\nEthical and Professional Standards: describe the role of a code of ethics in defining a profession", "qhtml": null}, {"n": 3, "q": "Most societies would least likely consider ethical principles to include:", "opts": ["justice.", "duplicity.", "diligence."], "ans": "B", "expl": "A. Incorrect. Justice is often considered an ethical principle in most societies.\nB. Correct. Most societies acknowledge the ethical principles of honesty, fairness or justice,\ndiligence, and respect for the rights of others. Duplicity or deception would be in violation of most\nethical principles\nC. incorrect. Dingence is often considered an ethical principle in most societies\nEthical and Professional Standards: explain ethics", "qhtml": null}, {"n": 4, "q": "Tibor Figeczky, CFA, is an equity trader at Global Investment Bank (GB). Figeczky traded the\nbank's investment portfolio profitably for the past three years and earned significant bonuses\nfor his efforts. Subsequently, internal auditors of GB formally accused Figeczky of exceeding\nhis trading authority and engaging in unauthorized trades. According to the CFA Institute\nCode of Ethics and Standards of Professional Conduct, Figeczky should most likely", "opts": ["disclose the complaint to CFA Institute.", "refuse further bonuses until the issue is resolved.", "request a temporary suspension of his CFA Institute membership."], "ans": "A", "expl": "A. Correct as members and candidates must self-disclose on the annual Professional Conduct\nStatement all matters that question their professional conduct, such as involvement in civil litigation\nor a criminal investigation or being the subject of a written complaint\nB. Incorrect as the Code and Standards do not prohibit a member from accepting a bonus while an\ninvestigation into his professional behavior is conducted. In this case, the member's actions have\nbeen questioned but he has not yet had an opportunity to defend his behavior and may in fact have\nacted within his authority and earned the compensation fairly\nC. Incorrect as the Code does not require a member to request a suspension of their membership\nwhile a complaint is being investigated.\nEthical and Professional Standards: explain the ethical responsibilities required by the Code and\nStandards, including the sub-sections of each Standard", "qhtml": null}, {"n": 5, "q": "Lisa Hajak, CFA, specialized in research on real estate companies at Cornerstone Country\nBank for the past twenty years. Hajak recently started her own investment research firm,\nHajak Investment Advisory. One of her former clients at Cornerstone asks Hajak to update a\nresearch report she wrote on a real estate company when she was at Cornerstone. Hajak\nupdates the report, which she had copied to her personal computer without the bank's\nknowledge, and replaces references to the bank with her new firm, Hajak Investment\nAdvisory. Hajak also incorporates the conclusions of a real estate study conducted by the\nRealtors Association that appeared in the Wall Street Journal. She references the Journal as\nher source in her report. She provides the revised report free of charge along with a cover\nletter for the bank's client to become a client of her firm. Concerning the reissued research\nreport, Hajak least likely violated the CFA Institute Standards of Professional Conduct because\nshe:", "opts": ["solicited the bank's client.", "did not obtain consent to use the bank report.", "did not cite the actual source of the real estate study."], "ans": "A", "expl": "A. Correct as soliciting the bank's client did not violate Standard IV(A)-Loyalty because the manager\nis no longer an employee of the bank and there is no indication she obtained the client information\nfrom bank sources. The member, however, has violated Standard V(C)-Record Retention, because\nwhen she left the bank she took the property of the bank without express permission to do so. In\naddition, the analyst violated Standard (C)- Misrepresentation by creating research materials\nwithout attribution which is demonstrated when the manager adds to the new report a real estate\nstudy she saw in the Wall Street Journal, referencing the Journal only. In all instances, a member or\ncandidate must cite the actual source of the information. If she does not obtain the report and\nreview the information, the manager runs the risk of relying on second-hand information that may\nmisstate facts. Best practice would be either to obtain the complete study from its original author\nand cite only that author or to use the information provided by the intermediary and cite both\nsources.\nB. Incorrect because according to Standard V(C)-Record Retention, when a member or candidate\nleaves a firm to seek other employment, the member or candidate cannot take the property of the\nfirm, including originals or copies of supporting records of the member's or candidate's work to the\nnew employer without the express consent of the previous employer.\nC. Incorrect because the analyst violated Standard I(C)-Misrepresentation by creating research\nmaterials without attribution, which is demonstrated when the manager adds to the new report a\nreal estate study she saw in the Wall Street Journal, referencing the Journal only. In all instances, a\nmember or candidate must cite the actual source of the information. If she does not obtain the\nreport and review the information, the manager runs the risk of relying on second-hand information\nthat may misstate facts: Best practice would be to either obtain the complete study from its original\nauthor and cite only that author or to use the information provided by the intermediary and cite\nboth sources.\nEthical and Professional Standards: recommend practices and procedures designed to prevent\nviolations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 6, "q": "Dennis Kim, CFA, works at Century Growth Partners (CGP) where he manages an\ninvestment account for his client Amelia Frost. Frost tells Kim to invest one percent of her\nportfolio in biotech stocks. Kim believes such an investment is inconsistent with Frost's\ninvestment policy statement. CGP has no policy regarding execution of unsolicited trading\nrequests. Kim discusses his concerns with Frost, but she does not change her instruction.\nWithout amending Frost's investment policy statement, Kim executes the trade afterward.\nHas Kim violated the Standards?", "opts": ["No", "Yes, because Kim executes an unsuitable trade for Frost", "Yes , because Kim does not change Frost's investment policy statement before executing the trade"], "ans": "A", "expl": "A. Correct because (1) Kim discusses his concerns with Frost before executing the trade, (2) Frost\nacknowledges this discussion and accepts the conditions of unsuitability. (3) Kim's firm does not\nrequire approval for unsuitable trades since it has no policy on the subject, and (4) the request does\nnot have a material impact on Frost's portfolio since it represents only one percent of its value,\nhence no modification of the IPS is required. According to Standard III(C), Suitability, in cases of\nunsolicited trade requests that a member or candidate knows are unsuitable for a client, the\nmember or candidate should refrain from making the trade until he or she discusses\nthe concerns with the client. Following the discussion, the member or candidate may follow his or\nher firm's policies regarding the necessary client approval for executing unsuitable trades. At a\nminimum, the client should acknowledge the discussion and accept the conditions that make the\nrecommendation unsuitable Should the unsolicited request be expected to have a malertat impact\non the portfolio, the member or candidate should use this opportunity to update the investment\npolicy statement.\nB. Incorrect because according to Standard III(C), Suitability, members may execute unsuitable\ntrades tot cheats under certain conditions, which Kim fulfills, as described in the response rationale\nfor the correct answer.\nC.Incorrect because according to Standard III(C) Suitability, Kim is not required to update Frost's IPS\nsince the trade size is immaterial, as described in the response rationale for the correct answer\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 7, "q": "Which of the following and care? Members should: is a recommended procedure for\ncompliance with the Standard relating to loyalty, prudence,", "opts": ["eliminate all actual and potential conflicts of interest.", "make their clients aware of all forms of manager compensation.", "submit to each client, at least annually, an itemized statement showing the funds and securities in custody."], "ans": "B", "expl": "A. Incorrect because a recommended procedure for Standard III (A). Loyalty, Prudence, and Care is\nmembers and candidates must disclose all actual and potential conflicts of interest so that clients\ncan evaluate those conflicts. They do not need to eliminate all actual and potential conflicts of\ninterest.\nB. Correct because a recommended procedure for Standard III (A), Loyalty, Prudence, and Care is\nmembers and candidates should make their clients aware of all forms of manager compensation.\nC. Incorrect because a recommended procedure for Standard III (A), Loyalty, Prudence, and Care is\nmembers and candidates with control of client assets (1) should submit to each client, at least\nquarterly, an itemized statement showing the funds and securities in the custody. It is a\nrecommended procedure to submit at least quarterly, not annually, itemized statements to clients.\nEthical and Professional Standards: recommend practices and procedures designed to prevent\nviolations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 8, "q": "According to the Standards, a member who is asked to produce an issuer-paid research\nreport is required to:", "opts": ["avoid cash compensation.", "disclose the nature of their compensation in the report.", "decline to write the report if the member's firm provides investment banking services to the issuer."], "ans": "B", "expl": "A. Incorrect because according to Standard I (B), Independence and Objectivity, authors of issuer-\npaid research can accept cash compensation but need to avoid compensation that could influence\nits research, such as equity. Independent analysts must also strictly limit the type of compensation\nthat they accept for conducting issuer-paid research. Otherwise, the content and conclusions of the\nreports could reasonably be expected to be determined or affected by compensation from the\nsponsoring companies. Compensation that might influence the research report could be direct, such\nas payment based on the conclusions of the report, or indirect, such as stock warrants or other\nequity instruments that could increase in value on the basis of positive coverage in the report.\nB. Correct because according to Standard I (B), Independence and Objectivity, members are required\nto disclose their compensation. Members and candidates must adhere to strict standards of conduct\nthat govern how the research is to be conducted and what disclosures must be made in the report.\nAnalysts must engage in thorough, independent, and unbiased analysis and must fully disclose\npotential conflicts of interest, including the nature of their compensation.\nC. Incorrect because according to Standard I (B), Independence and Objectivity, members are not\nrequired to decline to write the report if their firm provides investment banking services to the\ncompany. Members and candidates must adhere to strict standards of conduct that govern how the\nresearch is to be conducted and what disclosures must be made in the report. Analysts must engage\nin thorough, independent, and unbiased analysis and must fully disclose potential conflicts of\ninterest. So, members need not decline to write the report if a potential conflict of interest exists\n(such as their firm providing investment banking services), although they do need to disclose such\nconflicts.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 9, "q": "Ann Jules, CFA, discovered that her employer, Plutus Investments Inc. (PII), inflates\ninvestment performance in PII's marketing brochure. In accordance with firm policy, Jules\nuses PII's marketing brochure to present to prospective clients. In addition, Jules emails stock\nrecommendations to her clients in capsule form and offers additional information only upon\nrequest. Jules has most likely violated the Standards:", "opts": ["by emailing stock recommendations to her clients in capsule form.", "only by using Pil's marketing brochure to present to prospective clients.", "both by emailing stock recommendations to her clients in capsule form and by using PII's marketing brochure to present to prospective clients."], "ans": "B", "expl": "A. Incorrect because according to Standard V(B), Communication with Clients and Prospective\nClients, if recommendations are contained in capsule form (such as a recommended stock list),\nmembers and candidates should notify clients that additional information and analyses are available\nfrom the producer of the report. Julies has not violated the Standards by emailing stock\nrecommendations to her clients in capsule form because he offers additional information upon\nrequest\nB. Correct because according to Standard I(C). Misrepresentation members and Candidates must not\nknowingly make any misrepresentations relating to investment analysis recommendations, actions,\nor other professional activities. By using Pil's marketing brochure that inflates performance to\npresent to prospective clients, Jules has violated Standard I(C).\nC. Incorrect because according to Standard V(B), Communication with Clients and Prospective\nClients, if recommendations are contained in capsule form (such as a recommended stock list),\nmembers and candidates should notify clients that additional information and analyses are available\nfrom the producer of the report. Julies has not violated the Standards by emailing stock\nrecommendations to her clients in capsule form because he offers additional information upon\nrequest.\nEthical and Professional Standards: identify conduct that conforms to the Code and Standards and\nconduct that violates the Code and Standards.", "qhtml": null}, {"n": 10, "q": "Maria Jennings, CFA, overhears the CEO of United Retail saying that the quarterly report\nto be released next week will miss analysts' expectations. Jennings immediately calls her\nbrother who owns the stock to tell him what she overheard. One week later, Jennings writes\na report on another company, KTD retail. She uses public and nonmaterial nonpublic\ninformation for her analysis to issue a \"buy\" recommendation. Has Jennings most likely\nviolated the Standards?", "opts": ["No", "Yes, by calling her brother to tell him what she overheard", "Yes, by using public and nonmaterial nonpublic information for her analysis to issue a \"buy\" recommendation"], "ans": "B", "expl": "A. Incorrect because Jennings violated Standard II (A), Material Nonpublic Information, by sharing\nwhat she overheard from United Retail CEO with her sister, as described in the response rationale\nfor the correct answer.\nB. Correct because according to Standard II (A), Material Nonpublic Information, Members and\nCandidates who possess material nonpublic information that could affect the value of an investment\nmust not act or cause others to act on the information. Also, la formation is \"material\" if its\ndisclosure would probably have an impact on the price of a security or if reasonable investors would\nwant to know the information before making an investment decision such as the results of an\nupcoming quarterly report from a reliable source (the CEO), Jennings prompted her sister to act on\nit, hence, violated the Standard.\nC. Incorrect because according to Standard II (A) Material Nonpublic Information. The analyst may\nuse significant conclusions derived from the analysis of public and non material nonpublic\nInformation as the basis for investment recommendations and decisions even if those conclusions\nwould have been material inside information had they been communicated directly to the analyst by\na company. Under the \"mosaic theory, financial analysts are free to act on this collection, or mosaic,\nof information without risking violation. In this case, Jennings uses public and material nonpublic\ninformation to arrive at her recommendation, nence no violation.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 11, "q": "According to the Standards, which of the following is most likely considered material\nnonpublic information?", "opts": ["The recent execution of a large buy order from a hedge fund.", "Significant legal challenges revealed at an internal meeting of the company's management.", "Recent increases in a company's board remuneration discussed at the annual general meeting."], "ans": "B", "expl": "A. Incorrect because according to Standard II(A) Material Nonpublic Information, information\nregarding orders before execution may be material, but not after execution. Material information\nmay include, but is not limited to, information on the following: orders for large trades before they\nare executed.\nB. Correct because according to Standard II(A) Material Nonpublic Information, material information\nmay include, but is not limited to, information on the following: significant legal disputes.\nC. Incorrect because according to Standard II(A) Material Nonpublic Information, information\ndiscussed at an annual general meeting is not nonpublic since the information is widely available.\nInformation is 'nonpublic' until it has been disseminated or is available to the marketplace in general\n(as opposed to a select group of investors).\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 12, "q": "According to the Standard relating to fair dealing, when members disseminate\ninvestment recommendations, they are most likely required to make every effort to treat\nindividual clients in a(n):", "opts": ["fair and equal manner.", "fair and impartial manner.", "equal and impartial manner."], "ans": "B", "expl": "A. Incorrect because according to Standard III (B), Fair Dealing, the member is required to treat all\nclients in a fair and impartial manner,not necessarily an equal manner, as described in the response\nrationale for the correct answer.\nB. Correct all because according to Standard III (B), Fair Dealing, members and candidates must\nmake every effort to treat all individual and institutional clients in a fair and impartial manner.\nAdditionally, the term 'fairly' implies that the member or candidate must take care not to\ndiscriminate against any clients when disseminating investment recommendations or taking\ninvestment action. Standard III(B) does not state 'equally' because members and candidates could\nnot possibly reach all clients at exactly the same time..\nC. Incorrect because according to Standard III (B), Fair Dealing, the member is required to treat all\nclients in a fair and impartial manner, not necessarily an equal manner, as described in the response\nrationale for the correct answer.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 13, "q": "According to the recommended procedure for compliance with the Standard relating to\nfair dealing, a member who works in a large firm should:", "opts": ["offer different levels of service to clients selectively based on the clients' investment needs.", "disclose to clients and prospective clients how she selects accounts to participate in an order.", "inform all firm staff of the content of upcoming investment recommendations to assure that all clients' investment needs are met."], "ans": "B", "expl": "A. Incorrect because according to Standard III (B), Fair Dealing, Members and candidates should\ndisclose to all clients whether the organization offers different levels of service to clients for the\nsame fee or different fees. Different levels of service should not be offered to clients selectively.\nB. Correct because according to Standard III (B), Fair Dealing, Members and candidates should\ndisclose to clients and prospective clients how they select accounts to participate in an order.\nC. Incorrect because Members and candidates should make reasonable efforts to limit the number\nof people who are privy to the fact that a recommendation is going to be disseminated. All staff\nshould not be informed to avoid risk of leakage of recommendations before dissemination.\nEthical and Professional Standards: recommend practices and procedures designed to prevent\nviolations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 14, "q": "Which of the following statements is accurate according to the Standards?\n● Statement 1 :A member, prior to leaving his current employer, may contact potential\nclients for purposes of soliciting their business for their new employer. outside of\nnormal working hours to\n● Statement 2: A member, while still employed, is free to make arrangements apply for\na license with the local regulator to set up a competing business.", "opts": ["Statement 1 only.", "Statement 2 only.", "Both Statement 1 and Statement 2."], "ans": "B", "expl": "A. Incorrect because according to Standard IV(A), Loyalty, a member or candidate who is\ncontemplating seeking other employment must not contact existing clients or potential clients prior\nto leaving his or her employer for purposes of soliciting their business for the new employer.\nTherefore, Statement 1 is not accurate.\nB. Correct because according to Standard IV(A), Loyalty, a departing employee is generally free to\nmake arrangements or preparations to go into a competitive business before terminating the\nrelationship with his or her employer as long as such preparations do not breach the employee's\nduty of loyalty. Also, Allen's [the member's] preparation for the new business by registering with the\nregulatory authorities does not conflict with the work for her employer if the preparations have\nbeen done on Allen's [the member's] own time outside the office and if Allen [the member] will not\nbe soliciting clients for the business or otherwise operating the new company until she has left her\ncurrent employer. Therefore, Statement 2 is accurate.\nC. Incorrect because, as described in the rationale for the correct answer, only Statement 2 is\naccurate. A member or candidate who is contemplating seeking other employment must not contact\nexisting clients or potential clients prior to leaving his or her employer for purposes of soliciting their\nbusiness for the new employer. Therefore, Statement 1 is in not accurate.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 15, "q": "According to the Standard relating to disclosure of conflicts, buy-side members should\ndisclose to clients their:", "opts": ["beneficial ownership in any security.", "firm's procedures for reporting requirements for personal transactions.", "firm's policies on blackout periods during which the member cannot trade for clients."], "ans": "B", "expl": "A. Incorrect because according to Standard VI(A), Disclosure of Conflicts, buy-side members and\ncandidates should disclose their procedures for reporting requirements for personal transactions.\nTherefore, disclosing a beneficial ownership in any security is not a requirement.\nB. Correct because according to Standard VI(A), Disclosure of Conflicts, buy-side members and\ncandidates should disclose their procedures for reporting requirements for personal transactions.\nConflicts arising from personal investing are discussed more fully in the guidance for Standard VI(B).\nTherefore, not disclosing the procedure for a buy-side member is a violation.\nC. Incorrect because according to Standard VI(B), Priority of Transactions, investment personnel\ninvolved in the investment decision-making process should establish blackout periods prior to trades\nfor clients so that managers cannot take advantage of their knowledge of client activity by \"front-\nrunning\" client trades (trading for one's personal account before trading for client accounts).\nTherefore, blackout period is not to restrict trading for clients.\nEthical and Professional Standards: recommend practices and procedures designed to prevent\nviolations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 16, "q": "Michael Mak, CFA, is a portfolio manager at an investment firm. After comprehensive\nresearch, Mak buys Advance One Tech's (AOT) stock for all his clients for whom the\ninvestment is suitable. He then buys AOT shares for his brother's fee-paying account, in which\nMak has beneficial ownership. AOT's stock price declines significantly after a month, resulting\nin substantial losses for all his clients. Are Mak's actions consistent with the Standards?", "opts": ["Yes", "No, Mak's actions are not consistent with the Standard relating to priority of transactions", "No, Mak's actions are not consistent with the Standard relating to diligence and reasonable basis"], "ans": "B", "expl": "A. Incorrect because according to Standard VI(B). Priority of Transactions, family accounts that are\nclient accounts should be treated like any other firm account and should neither be given special\ntreatment nor be disadvantaged because of the family relationship. If a member or candidate has a\nbeneficial ownership in the account, however, the member or candidate may be subject to\npreclearance or reporting requirements of the employer or applicable law. Mak should treat his\nbrother's fee paying account like any other firm account and should not be disadvantaged.\nTherefore, Mak's actions are not consistent with the Standard relating to priority of transactions.\nB. Correct because according to Standard VI(B) Priority of Transactions, family accounts that are\nclient accounts should be treated like any other firm account and should neither be given special\ntreatment nor be disadvantaged because of the family relationship. If a member or candidate has a\nbeneficial ownership in the account, however, the member or candidate may be subject to\npreclearance or reporting requirements of the employer or applicable law. Mak should treat his\nbrother's fee paying account like any other tinm account and should not be disadvantaged.\nTherefore. Mak's actions are not consistent with the Standard relating to priority of transactions\nC. Incorrect because according to Standard V(A), Diligence and Reasonable Basis, Members and\nCandidates must 1. Exercise diligence, independence, and thoroughness in analyzing investments,\nmaking investment recommendations, and taking investment actions. 2. Have a reasonable and\nadequate basis, supported by appropriate research and investigation, for any investment analysis,\nrecommendation, or action. Mak has completed a comprehensive research before buying AOT's\nstock for his clients. Therefore, Mak's actions are consistent with the Standard relating to diligence\nand reasonable basis\nEthical and Professional Standards: identify conduct that conforms to the Code and Standards and\nconduct that violates the Code and Standards", "qhtml": null}, {"n": 17, "q": "With respect to the GIPS standards, which of the following statements is most accurate?\nVerification:", "opts": ["of GIPS compliance is mandatory if the firm claims GIPS compliance.", "is performed by the firm when self-regulating and certifying its claim of compliance.", "tests whether the firm's processes are designed to present performance results in compliance with the GIPS standards."], "ans": "C", "expl": "A. Incorrect because once a firm claims compliance with the Standards, they may voluntarily hire an\nindependent third party to perform a verification in order to increase confidence in the firm's claim\nof compliance. Therefore, verification is voluntary, not mandatory.\nB. Incorrect because firms self-regulate their claim of compliance and once a firm claims compliance\nwith the Standards, they may voluntarily hire an independent third party to perform a verification in\norder to increase confidence in the firm's claim of compliance. Therefore, a firm cannot certify its\nown claim of compliance.\nC. Correct because according to GIPS, Verification is a process by which an independent verification\nfirm (verifier) conducts testing of a firm on a firm-wide basis in accordance with the required\nverification procedures of the GIPS standards. Verification provides assurance on whether the firm's\npolicies and procedures related to composite and pooled fund maintenance, as well as the\ncalculation, presentation, and distribution of performance, have been designed in compliance with\nthe GIPS standards and have been implemented on a firm-wide basis\nEthical and Professional Standards: describe the concept of independent verification", "qhtml": null}, {"n": 18, "q": "Which of the following is a violation of the Standard relating to conduct as participants in\nCFA Institute Programs? A candidate:", "opts": ["discusses broad topic areas covered in the curriculum in an online forum.", "tells her brother, after taking the exam, how glad she was that no questions about the binomial model were asked.", "publishes on a social media website her disappointment about what she thinks is an overly academic CFA Program."], "ans": "B", "expl": "A. Incorrect because Standard VII (A), Conduct as Participants in CFA Institute Programs, does not\nprohibit candidates from discussing nonconfidential information or curriculum material with others\nor in study groups in preparation for the exam. Therefore, the candidate has not violated Standard\nVII (A) by discussing broad topic areas covered in the curriculum in an online forum..\nB. Correct because according to Standard VII (A) Conduct as Participants in CFA Institute Programs,\nCFA Institute program rules, regulations, and policies prohibit candidates from disclosing confidential\nmaterial gained during the exam process. Examples of information that cannot be disclosed by\ncandidates sitting for an exam include but are not limited to broad topical areas and formulas tested\nor not tested on the exam. Therefore, the candidate has violated Standard VII (A) by telling her\nbrother how glad she was that no questions aboal the binomial model were asked.\nC. Incorrect because Standard VII (A), Conduct as Participants in CFA Institute Programs, does not\ncover expressing opinions regarding CFA Institute, the CFA Program, or other CFA Institute\nprograms. Members and candidates are free to disagree and express their disagreement with CFA\nInstitute on its policies, its procedures, or any advocacy positions taken by the organization. When\nexpressing a personal opinion, a candidate is prohibited from disclosing content-specific\ninformation, including any actual exam question and the information as to subject matter covered or\nnot covered in the exam. Therefore, the candidate has not violated Standard VII (A) by publishing on\na social media website her disappointment about what she thinks is an overly academic CFA\nProgram.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 19, "q": "Johny Lumunon, CFA, shows prospective clients the investment performance of an\naccount with \"balanced\" investment objectives and highlights how account has\noutperformed the benchmark in the last 10 years. He does not disclose that this is the best\nperforming account, and that half of the accounts with \"balanced\" investment objectives\nmanaged by his firm underperformed the benchmark during the same period. Lumunon has\nmost likely violated the Standard(s) relating to:", "opts": ["only misrepresentation.", "only performance presentation.", "both misrepresentation and performance presentation."], "ans": "C", "expl": "A. Incorrect because Lumunon has violated not only Standard I (C), Misrepresentation, but also\nStandard III (D), Performance Presentation, as described in the rationale for the correct answer\nB. Incorrect because Lumunon has violated not only Standard III (D), Performance Presentation, but\nalso Standard I (C), Misrepresentation, as described in the rationale for the correct answer.\nC. Correct because according to Standard I (C), Misrepresentation, a member or candidate must not\nknowingly omit or misrepresent information or give a false impression of a firm, organization, or\nsecurity in the member's or candidate's oral representations, advertising (whether in the press or\nthrough brochures), electronic communications, or written materials (whether publicly disseminated\nor not). By showing investment results of only one \"balanced\" account, and failing to disclose that\nthat this is the best-performing account and that half of the balanced accounts underperformed the\nbenchmark, Lumunon has violated Standard I (C). Further Standard III (D), Performance\nPresentation, requires members and candidates to avoid misstating performance or misleading\nclients and prospective clients about the investment performance of members or candidates or their\nfirms. This standard encourages full disclosure of investment performance data to clients and\nprospective clients. Thus, Lumunon has also violated Standard III (D).\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 20, "q": "Jordan Kope, CFA, is an analyst with a hedge fund and works closely with Deepa Bose\nwho earned her CFA designation 15 years ago. Kope becomes aware that Bose uses her CFA\ndesignation even though she no longer pays her membership dues. During several meetings\nthat Bose and Kope have with the firm's clients, Bose emphasizes that all her team members,\nincluding herself, are CFA charterholders. To be consistent with the Standards, Kope should:", "opts": ["only dissociate himself from activities involving Bose.", "only report Bose's conduct to the fund's compliance department.", "dissociate himself from activities involving Bose and report Bose's conduct to the fund's compliance department."], "ans": "C", "expl": "A. Incorrect because according to Standard I(A), Knowledge of the Law. Members and Candidates\nmust not knowingly participate or assist in and must dissociate from any violation of such laws, rules,\nor regulations. In this case, by staying silent in a client meeting in which he knows false Information\nis being given to a potential investor that could cause harm to that investor, Kope would be seen as\nassisting Bose in providing that false information, even though Kope is not actively engaging in the\nmisconduct himself Kope should report her conduct to the fund's compliance department for it to\naddress and should dissociate himself from activities Involving Bose and report Bose's conduct to the\nfund's compliance department.\nB. Incorrect because according to Standard (A). Knowledge of the Law, Members and Candidates\nmust not Imevtogly participate or assist in and must dissectate from any olation of such laws, rules,\nor regulations in this case. Kope should report Bose's conduct to the fund's compliance department\nfor it to address and should report Bose's conduct to the fund's compliance department and\ndissociate himself from activities involving Bose.\nC. Correct because according to Standard I(A), Knowledge of the Law, Members and Candidates\nmust not knowingly participate or assist in and must dissociate from any violation of such laws, rules\nor regulations In this case, by staying silent in a client meeting in which he knows false information is\nbeing given to a potential investor that could cause harm to mat insesta Kope would be seen as\nassisting Bose in providing that false information, even though Kope is not actively engaging in the\nmisconduct himself Kope should report her conduct to the fund's compliance department forff to\naddress and should dissociate namsell frors activities involving Bose and report Bose's conduct to\nthe fund's compliance deperpent\nEthical and Professional Standards: explain how the practices, policies, and conduct do or do not\nviolate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 21, "q": "According to the recommended procedures for compliance with the Standard relating to\nresponsibilities of supervisors, a firm's code of ethics should:", "opts": ["only be written in plain language.", "only be integrated in the firm's compliance procedures.", "both be be written in plain language and be integrated in the firm's compliance procedures."], "ans": "A", "expl": "A. Correct because according to recommended procedures for compliance with Standard IV (C),\nResponsibilities of Supervisors, Stand-alone codes of ethics should be written in plain language and\nshould address general fiduciary concepts.\nB. Incorrect because according to recommended procedures for compliance with Standard IV (C),\nResponsibilities of Supervisors, Mingling compliance procedures in the firm's code of the ethics goes\nagainst the goal of reinforcing ethical obligations of employees.\nC. Incorrect because according to recommended procedures for compliance with Standard IV (C),\nResponsibilities of Supervisors, Members and candidates should encourage their employers to\nprovide their codes of ethics to clients.\nEthical and Professional Standards: recommend practices and procedures designed to prevent\nviolations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 22, "q": "According to the Standard relating to diligence and reasonable basis, a member is\nrequired to:", "opts": ["exercise diligence, independence, and thoroughness in analyzing investments.", "become an expert in the technical aspects of the models used for investment recommendations.", "dissociate and remove her name from a company group report if the report does not reflect her opinion."], "ans": "A", "expl": "A. Correct because according to Standard V(A) Investment Analysis, Recommendations, and Actions\n– Diligence and Reasonable Basis, Members and Candidates must: Exercise diligence, independence,\nand thoroughness in analyzing investments, making investment recommendations, and taking\ninvestment actions.\nB. Incorrect because the guidance for Standard V(A) Diligence and Reasonable Basis states that\nalthough they are not required to become experts in every technical aspect of the models, they must\nunderstand the assumptions and limitations inherent in any model and how the results were used in\nthe decision-making process.\nC. Incorrect because the guidance for Standard V(A) Diligence and Reasonable Basis states that in\nsome instances, a member or candidate will not agree with the view of the group. If, however, the\nmember or candidate believes that the consensus opinion has a reasonable and adequate basis and\nis independent and objective, the member or candidate need not decline to be identified with the\nreport. If the member or candidate is confident in the process, the member or candidate does not\nneed to dissociate from the report even if it does not reflect his or her opinion.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 23, "q": "After completing Level II of the CFA exam, Aashi Banerjee posts several comments on an\nonline chatroom for CFA program candidates. Which of the following comments violate the\nStandard relating to conduct as participants in CFA Institute programs?\nComment 1 CFA Institute must revise the topic area weights on the exam.\nComment 2 There were no questions on GIPS standards.", "opts": ["Comment 1 only", "Comment 2 only", "Both Comment 1 and Comment 2"], "ans": "B", "expl": "A. Incorrect because Standard VII(A) does not cover expressing opinions regarding CFA Institute, the\nCFA Program, or other CFA Institute programs. Members and candidates are free to disagree and\nexpress their disagreement with CFA Institute on its policies, its procedures, or any advocacy\npositions taken by the organization. So, Comment 1 does not violate the Standard as it reflects\nBanerjee's opinion\nB. Correct because according to Standard VII(A), when expressing a personal opinion, a candidate is\nprohibited from disclosing content-specific information, including any actual exam question and the\ninformation as to subject matter covered or not covered in the exam. By making Comment 2,\nBanerjee may have provided information on the subject matter covered on the exam and hence\nviolated the Standard\nC. Incorrect because Standard VII(A) does not cover expressing opinions regarding CFA Institute, the\nCFA Program, or other CFA Institute programs. Members and candidates are free to disagree and\nexpress their disagreement with CFA Institute on its policies, its procedures, or any advocacy\npositions taken by the organization. So, Comment 1 does not violate the Standard as it reflects\nBanerjee's opinion. However, in making Comment 2, Banerjee may have provided information on\nthe subject matter covered on the exam and hence violated the Standard.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 24, "q": "Which of the following activities violates the Standard relating to market manipulation?\nActivity 1: A member secures a dominant position in futures contracts to influence the price\nof the underlying. The results in large losses for the member. transaction\nActivity 2: A member frequently trades a stock in multiple client stock. The transactions\nresult in large gains for the clients. accounts with an intent to increase the volume of the", "opts": ["Activity 1 only", "Activity 2 only", "Both Activity 1 and Activity 2"], "ans": "C", "expl": "A. Incorrect because according to Standard II(B), Market Manipulation, transaction-based\nmanipulation includes, but is not limited to, the following: transactions that artificially affect prices\nor volume to give the impression of activity or price movement in a financial instrument, which\nrepresent a diversion from the expectations of a fair and efficient market, and securing a controlling,\ndominant position in a financial instrument to exploit and manipulate the price of a related\nderivative and/or the underlying asset. Also, the intent of the action is critical to determining\nwhether it is a violation of this standard. Despite the losses Activity 1 is a violation of Standard II(B)\nbecause the intent was to influence the price of the underlying Activity 2 is also a violation as the\nintent was to increase the volume of the stock.\nB. Incorrect because according to Standard II(B), Market Manipulation, transaction-based\nmanipulation includes, but is not limited to, the following: transactions that artificially affect prices\nor volume to give the impression of activity or price movement in a financial instrument, which\nrepresent a diversion from the expectations of a fair and efficient market, and securing a controlling,\ndominant position in a financial instrument to exploit and manipulate the price of a related\nderivative and/or the underlying asset. Also, the intent of the action is critical to determining\nwhether it is a violation of this standard. Activity 2 is a violation as the intent was to increase the\nvolume of the stock. Despite the losses, Activity 1 is also a violation of Standard II(B) because the\nintent was to influence the price of the underlying.\nC. Correct because according to Standard II(B), Market Manipulation, transaction-based\nmanipulation includes, but is not limited to, the following: transactions that artificially affect prices\nor volume to give the impression of activity or price movement in a financial instrument, which\nrepresent a diversion from the expectations of a fair and efficient market, and securing a controlling,\ndominant position in a financial instrument to exploit and manipulate the price of a related\nderivative and/or the underlying asset. Also, the intent of the action is critical to determining\nwhether it is a violation of this standard.\" Despite the losses, Activity 1 is a violation of Standard II(B)\nbecause the intent was to influence the price of the underlying. Activity 2 is also a violation as the\nintent was to increase the volume of the stock.\nEthical and Professional Standards: identify conduct that conforms to the Code and Standards and\nconduct that violates the Code and Standards", "qhtml": null}, {"n": 25, "q": "Which of the following statements regarding the GIPS standards is accurate?", "opts": ["All fee-paying client portfolios must be included in at least one composite.", "All portfolios with the same investment mandate are aggregated into a composite.", "Aggregation of portfolios into composites is based on the actual performance of the portfolios every year."], "ans": "B", "expl": "A. Incorrect because according to the GIPS standards, a claim of compliance requires that all fee-\npaying discretionary accounts managed by the firm be included in at least one composite. Non-\ndiscretionary portfolios must not be included in a firm's composites. Fee-paying non-discretionary\nportfolios do not have to be included.\nB. Correct because according to the GIPS standards. A composite is an aggregation of one or more\nportfolios managed according to a similar investment mandate, objective, or strategy\nC. Incorrect because according to the GIPS standards, the determination of which portfolios to\ninclude in the Composite should be done according to pre-established criteria (i.e., on an ex-ante\nbasis), not after the fact. Basing it on actual performance would require the aggregation to be done\nafter the fact which is incorrect.\nEthical and Professional Standards: explain the purpose of composites in performance reporting", "qhtml": null}, {"n": 26, "q": "Claus Holm, CFA, directs most of his clients' trades to RRT Company (RRT), despite RRT's\nhigher-than-average commissions. In return, RRT refers individual clients to Holm for asset\nmanagement services. Holm does not disclose the arrangement to his clients or prospective\nclients. Holm has most likely violated the Standard(s) relating:", "opts": ["only to referral fees.", "only to loyalty, prudence, and care.", "both to referral fees and to loyalty, prudence, and care."], "ans": "C", "expl": "A. Incorrect because Holm violated both Standards III (A) and VI (C), as described in the Response\nRationale for the correct answer\nB. Incorrect because Holm violated both Standards III (A) and VI (C), as described in the Response\nRationale for the correct answer\nC. Correct because according to Standard III (A), Loyalty, Prudence and Care. Conflicts may arise\nwhen an investment manager uses client brokerage to purchase research services, a practice\ncommonly called 'soft dollars' or 'soft commissions. A member or candidate who pays a higher\nbrokerage commission than he or she would normally pay to allow for the purchase of goods or\nservices, without corresponding benefit to the client, violates the duty of loyalty to the client. Paying\nhigher fees in return for referrals does not represent a corresponding benefit to Holm's clients.\nTherefore, this arrangement violates the duty of loyalty to his clients. In addition, Holm has violated\nStandard VI (C), Referral Fees, which states the responsibility of members and candidates to inform\ntheir employer, clients, and prospective clients of any benefit received for referrals of customers and\nclients.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 27, "q": "Emma Fischer, CFA, is an analyst covering the banking sector. She has declared\nbankruptcy due to large unpaid personal medical bills. On weekends, she participates in\npublic protests for climate protection. She was recently arrested for trespassing during a\nprotest, which is an act of civil disobedience in her country. Has Fischer violated the\nStandards?", "opts": ["No", "Yes, she has violated the Standard relating to misconduct", "Yes, she has violated the Standard relating to loyalty, prudence and care"], "ans": "A", "expl": "A. Correct because according to Standard I (D), Misconduct, personal bankruptcy may not reflect on\nthe integrity or trustworthiness of the person declaring bankruptcy, but if the circumstances of the\nbankruptcy involve fraudulent or deceitful business conduct, the bankruptcy may be a violation of\nthis standard. Also, generally, Standard I(D) is not meant to cover legal transgressions resulting from\nacts of civil disobedience in support of personal beliefs because such conduct does not reflect poorly\non the member's or candidate's professional reputation, integrity, or competence. Therefore,\nFischer has not violated Standard I (D). Further, Standard III (A). Loyalty, Prudence, and Care, states\nthat Members and Candidates have a duty of loyalty to their clients and must act with reasonable\ncare and exercise prudent judgment. Members and Candidates must act for the benefit of their\nclients and place their clients' interests before their employer's or their own interests. Neither\nFischer's bankruptcy no nor the act of trespassing during a protest imposes on her duty of loyalty to\nher clients. She has not violated Standard III (A).\nB. Incorrect because according to Standard I (D), Misconduct, personal bankruptcy may not reflect\non the integrity or trustworthiness of the person declaring bankruptcy, but if the circumstances of\nthe bankruptcy involve fraudulent or deceitful business conduct, the bankruptcy may be a violation\nof this standard. Also, generally, Standard I(D) is not meant to cover legal transgressions resulting\nfrom acts of civil disobedience in support of personal beliefs because such conduct does not reflect\npoorly on the member's or candidate's professional reputation, integrity, or competence. Therefore,\nFischer has not violated Standard I (D).\nC. Incorrect because according to Standard III (A), Loyalty, Prudence, and Care, Members and\nCandidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their\nclients' interests before their employer's or their own interests. Neither Fischer's bankruptcy no nor\nthe act of trespassing during a protest imposes on her duty of loyalty to her clients. She has not\nviolated Standard III (A).\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 28, "q": "Which of the following is a recommended procedure for compliance with the Standard\nrelating to independence and objectivity? Members should encourage their firms to:", "opts": ["prohibit any employee participation in equity-related IPOS.", "remove a corporate client company from the research universe and put it on a restricted list if the firm is unwilling to disseminate adverse opinions about the company.", "provide every client with the procedures and policies for reporting potentially unethical behaviour, violations of regulations, or other activities that may harm the firm's reputation."], "ans": "B", "expl": "A. Incorrect because according to the recommended procedures for compliance with Standard I (B).\nIndependence and Objectivity. Members and candidates should encourage their investment firms to\ndevelop formal policies related to employee purchases of equity or equity related tPOS Firms should\nrequire prior approval for employee participation to IPOS with prompt disclosure of investment\nactions taken following the offering. So, the recommendation is to have regulation around IPOs: but\nnot explicitly pronins them\nB. Correct because according to the recommended procedures for compliance with Standard I (B),\nIndependence and Objectivity, Create a restricted list if the firm is unwilling to permit dissemination\nof adverse opinions about a corporate client, members and candidates should encourage the firm to\nremove the controversial company from the research universe and put it on a restricted list so that\nthe firm disseminates only factual information about the company.\nC. Incorrect because according to the recommended procedures for compliance with Standard I (B),\nIndependence and Objectivity, Firms should provide every employee with the procedures and\npolicies for reporting potentially unethical behavior, violations of regulations, or other activities that\nmay harm the firm's reputation. So, should provide to every firms should provide to every employee,\nnot every client.\nEthical and Professional Standards: recommend practices and procedures designed to prevent\nviolations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 29, "q": "According to the recommended procedure for compliance with the Standard relating to\nmisconduct, members should encourage their firms to disseminate a list of potential\nviolations and associated disciplinary sanctions to:", "opts": ["all clients only.", "all employees only.", "both all clients and all employees."], "ans": "B", "expl": "A. Incorrect because according to the recommended procedures for compliance with Standard I(D),\nmisconduct, members and candidates should encourage their firms to adopt the following policies\nand procedures to support the principles of Standard I(D). List of violations: Disseminate to all\nemployees a list of potential violations and associated disciplinary sanctions, up to and including\ndismissal from the firm. Dissemination to clients is not among the recommended procedures\nB. Correct because according to the recommended procedures for compliance with Standard I(D),\nmisconduct, members and candidates should encourage their firms to adopt the following policies\nand procedures to support the principles of Standard I(D):\nList of violations: Disseminate to all employees a list of potential violations and associated\ndisciplinary sanctions, up to and including dismissal from the firm.\nC. Incorrect because according to the recommended procedures for compliance with Standard I(D),\nmisconduct, members and candidates should encourage their firms to adopt the following policies\nand procedures to support the principles of Standard I(D): List of violations: Disseminate to all\nemployees a list of potential violations and associated disciplinary sanctions, up to and including\ndismissal from the firm. Dissemination to clients is not among the recommended procedures.\nEthical and Professional Standards: recommend practices and procedures designed to prevent\nviolations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 30, "q": "According to the recommended procedures for compliance with the Standard relating to\nmisconduct, members should encourage their firms to:", "opts": ["conduct background checks of all employees at least annually.", "develop and adopt a code of ethics to which every employee must subscribe.", "check references of potential clients to ensure that they are of good character."], "ans": "B", "expl": "A. Incorrect because according to the recommended procedures for compliance with the Standard 1\n(D). Misconduct, members should encourage their firms to check references of potential employees\nto ensure that they are of good character and not ineligible to work in the investment industry\nbecause of past infractions of the law. However, the Standard does not recommend to conduct\nbackground checks of all current (as opposed to potential) employees once per year.\nB. Correct because according to the recommended procedures for compliance with the Standard I\n(D), members should encourage their firms to develop and/or adopt a code of ethics to which every\nemployee must subscribe.\nC. Incorrect because according to the recommended procedures for compliance with the Standard I\n(D), Misconduct, members should encourage their firms to check references of potential employees\nto ensure that they are of good character and not ineligible to work in the investment industry\nbecause of past infractions of the law. Therefore, the recommendation is to check references of\npotential employees, not clients.\nEthical and Professional Standards: recommend practices and procedures designed to prevent\nviolations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 31, "q": "According to the guidance for the Standard relating to loyalty, prudence, and care, which\nof the following statements is most accurate?", "opts": ["Voting proxies is necessary in all instances.", "Members must maximize the economic value of proxies for clients.", "Consistent application of proxy policies includes voting with management on all nonroutine governance matters."], "ans": "B", "expl": "A. Incorrect because according to Standard III (A), Loyalty, Prudence, and Care, a cost-benefit\nanalysis may show that voting all proxies may not benefit the client, so voting proxies may not be\nnecessary in all instances.\nB. Correct because according to Standard III (A), Loyalty, Prudence, and Care, proxies have economic\nvalue to a client, and members and candidates must ensure that they properly safeguard and\nmaximize this value.\nC. Incorrect because according to Standard III (A), Loyalty, Prudence, and Care, an investment\nmanager who fails to vote, casts a vote without considering the impact of the question, or votes\nblindly with management on nonroutine governance issues (e.g., a change in company\ncapitalization) may violate this standard. Therefore, the statement that consistent application of\nproxy policies includes voting with management on all nonroutine governance matters is not\naccurate.\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 32, "q": "According to the guidance for the Standards, which of the following statements are\naccurate?\n● Statement 1: Employees must place employer interests ahead of personal interests in\nall matters.\n● Statement 2: Senior management of a member's firm should create financial\ncompensation structures that do not 2 drive unethical behavior.", "opts": ["Statement 1 only.", "Statement 2 only.", "Both Statement 1 and Statement 2."], "ans": "B", "expl": "A. Incorrect because according to Standard IV (A), Loyalty, employers must recognize the duties and\nresponsibilities that they owe to their employees if they expect to have content and productive\nemployees. Further, this standard is not meant to be a blanket requirement to place employer\ninterests ahead of personal interests in all matters. Therefore, Statement 1 - employees must place\nemployer interests ahead of personal interests in all matters – is not accurate.\nB. Correct because according to Standard IV (A), Loyalty, the employer is responsible for a positive\nworking environment, which includes an ethical workplace. Senior management has the additional\nresponsibility to devise compensation structures and incentive arrangements that do not encourage\nunethical behavior. Therefore, Statement 2 is accurate.\nC. Incorrect because according to Standard IV (A), Loyalty, employers must recognize the duties and\nresponsibilities that they owe to their employees if they expect to have content and productive\nemployees. Further, this standard is not meant to be a blanket requirement to place employer\ninterests ahead of personal interests in all matters. Therefore, Statement 1 - employees must place\nemployer interests ahead of personal interests in all matters - is not accurate\nEthical and Professional Standards: demonstrate the application of the Code of Ethics and\nStandards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 33, "q": "A member himself from believes a colleague is participating in unethical activities at\nwork. The member does not disassociate the activities of his colleague. The member has most\nlikely violated:", "opts": ["only th
