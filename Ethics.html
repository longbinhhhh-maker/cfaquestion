nhạn chế có được tiết lộ đúng cách hay không.\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":69,"q":"According to the recommended procedures for compliance with the Standard relating to\ndiligence and reasonable basis, members should encourage their firms to:","opts":["evaluate the adequacy of external advisors by customizing the evaluation criteria for each advisor.","establish maximum levels of scenario testing of all computer-based models used in evaluating financial instruments.","appoint a supervisory analyst to determine whether research reports have a reasonable and adequate basis prior to external circulation."],"ans":"C","expl":"A. Không chính xác vì theo các quy trình được đề xuất để tuân thủ Tiêu chuẩn V (A),\nSự siêng năng và Cơ sở hợp lý, các thành viên và ứng viên nên khuyến khích công ty của họ áp dụng một\nbộ tiêu chí được tiêu chuẩn hóa để đánh giá mức độ phù hợp của các cố vấn bên ngoài. Do đó, việc tùy chỉnh\ntiêu chí đánh giá cho từng cố vấn bên ngoài không phải là quy trình được đề xuất để tuân thủ\ntiêu chuẩn V (A).\nB. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn V (A).\nSự siêng năng và Cơ sở hợp lý, các thành viên và ứng viên nên khuyến khích công ty của họ phát triển\nhướng dẫn bằng văn bản trật tự nhằm thiết lập mức độ thử nghiệm kịch bản tối thiểu của tất cả các mô hình\ndựa trên máy tính được sử dụng để phát triển xếp hạng và đánh giá các tổ chức tài chính. Do đó, việc thiết lập\nmức thử nghiệm chi tiêu tối đa là không chính xác\nC. Đúng vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn V (A),\nSự siêng năng và Cơ sở hợp lý, các thành viên và ứng viên nên khuyến khích công ty của họ thiết lập một\nchính sách yêu cầu các báo cáo nghiên cứu, xếp hạng tín dụng và khuyến nghị đầu tư phải có cơ sở\ncó thể được chứng minh là hợp lý và đầy đủ. Một cá nhân nhân viên (nhà phân tích\ngiám sát) hoặc một nhóm nhân viên (ủy ban đánh giá) phải được chỉ định để xem xét và phê duyệt\ncác mục đó trước khi lưu hành bên ngoài để xác định xem các tiêu chí được thiết lập trong chính sách\n có được đáp ứng hay không. Do đó, việc chỉ định một nhà phân tích giám sát để xác định xem các báo cáo nghiên cứu\ncó cơ sở hợp lý và đầy đủ hay không, trước khi lưu hành báo cáo ra bên ngoài, có phải là\nthủ tục được khuyến nghị để tuân thủ Tiêu chuẩn V (A).\nTiêu chuẩn đạo đức và chuyên môn: khuyến nghị các thực tiễn và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":70,"q":"A member works for an investment firm. There are no applicable laws relating to record\nretention. The firm's policy requires staff to retain records for five years. A local investment\nassociation recommends retaining records for eight years. At a recent client briefing, some of\nthe firm's largest clients expressed a preference for the firm to retain records for at least ten\nyears. To be consistent with the Standards, records should be retained for:","opts":["5 years.","8 years.","10 years."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn V (C) Lưu giữ hồ sơ, các cơ quan quản lý địa phương thường áp đặt\ncác yêu cầu đối với các thành viên, ứng viên và công ty của họ liên quan đến việc lưu giữ hồ sơ phải tuân theo\n. Các công ty cũng có thể triển khai các chính sách nêu chi tiết khung thời gian áp dụng để lưu giữ\nhồ sơ nghiên cứu và liên lạc với khách hàng. Việc thực hiện các yêu cầu pháp lý và chắc chắn như vậy đáp ứng\ncác nội dung sửa đổi của Tiêu chuẩn V(C) Trong trường hợp không có hướng dẫn về cách xử lý hoặc các pallet công ty, Viện CFA\nkhuyến nghị tổng cộng các hồ sơ ceanteteing ít nhất bảy năm Ở đây, không có jay nào có thể chấp nhận được Ngoài ra\npicasicoeimentative của ngành công nghiệp baital andy tedd count các sở thích ace không liên quan Lasteart,\ncác thành viên phải tuân thủ chính sách của công ty là lưu giữ hồ sơ trong ít nhất 5 năm.\nB. Không chính xác vì theo Tiêu chuẩn:V (C) Reed Retentions, các cơ quan quản lý địa phương quy định\nyapose.reqethente đối với các thành viên, ứng viên và các công ty liên quan đến việc lưu giữ hồ sơ phải được\ntuân theo. Các công ty ngay lập tức thực hiện các chính sách thuyết phục Baibe hiện hành phải giữ lại nghiên cứu\nvà gian lận hồ sơ biên soạn. Việc đáp ứng các yêu cầu pháp lý và cánh tay như vậy đáp ứng các yêu cầu\ncủa Tiêu chuẩn VIC) trong phần hướng dẫn đăng ký hoặc chính sách của công ty. CFA rostitme\nnên duy trì hồ sơ trong ít nhất bảy năm, riese (ở đây không có luật áp dụng Ngoài ra,\nkhuyến nghị của cơ quan công nghiệp địa phương và ưu tiên của khách hàng là không có! ngay lập tức có liên quan:\nthành viên phải tuân thủ chính sách của công ty đối với hồ sơ matatato trong ít nhất 5 năm\nC. Không chính xác vì theo Tiêu chuẩn V (C), Lưu giữ hồ sơ. Các cơ quan quản lý địa phương thường áp đặt\ncác yêu cầu đối với các thành viên, ứng viên và sau đó là các công ty liên quan đến lưu giữ hồ sơ phải tuân theo\n Fenis cũng có thể triển khai các chính sách nêu chi tiết khung thời gian áp dụng để lưu giữ\nhồ sơ nghiên cứu và liên lạc với khách hàng. do thiếu hướng dẫn pháp lý hoặc chính sách của công ty, CFA\nInstiane khuyến nghị duy trì hồ sơ trong ít nhất bảy năm Ở đây không có luật áp dụng\nNgoài ra, khuyến nghị của cơ quan ngành địa phương và sở thích của khách hàng là không liên quan\nthay vào đó thành viên phải tuân thủ chính sách của công ty là lưu giữ hồ sơ trong ít nhất 5 năm.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn về các vấn đề liêm chính nghề nghiệp Ứng xử chuyên nghiệp trong các tình huống liên quan","qhtml":null},{"n":71,"q":"According to the recommended procedures for compliance with the Standard relating to\npriority of transactions, members should:","opts":["discourage clients from trading during blackout periods.","supply copies of their personal securities transactions to clients upon request.","preclear their participation in IPOS even if there is no conflict of interest between their participation in an IPO and the client's interests."],"ans":"C","expl":"A. Không chính xác vì Tiêu chuẩn VI(B), Mức độ ưu tiên của các giao dịch, khuyến nghị cấm/hạn chế\nthời kỳ cấm các thành viên giao dịch cá nhân sớm (\"chạy trước\"), không làm nản lòng khách hàng\ntừ giao dịch. Theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn VI(B),\nnhân viên đầu tư tham gia vào quá trình ra quyết định đầu tư nên thiết lập biện pháp ngăn chặn\ngiai đoạn trước khi giao dịch cho khách hàng để các nhà quản lý không thể tận dụng kiến thức của họ về\nhoạt động của khách hàng bằng các giao dịch khách hàng \"chạy trước\" (giao dịch bằng tài khoản cá nhân của một người trước khi giao dịch với\ntài khoản khách hàng)\nB. Không chính xác vì Tiêu chuẩn VI(B), Mức độ ưu tiên của các giao dịch, không đưa ra khuyến nghị nào với\nđối với thành viên cung cấp cho khách hàng bản sao giao dịch chứng khoán cá nhân. Theo\ncác thủ tục được khuyến nghị để tuân thủ Tiêu chuẩn VI(B), nhân viên đầu tư phải\nđược yêu cầu chỉ đạo các nhà môi giới của họ cung cấp cho các công ty bản sao hoặc xác nhận của tất cả\ngiao dịch chứng khoán cá nhân và bản sao kê định kỳ của tất cả các tài khoản chứng khoán.\nC. Đúng vì theo quy trình được khuyến nghị để tuân thủ Tiêu chuẩn VI(B),\nƯu tiên của Giao dịch, các thành viên và ứng viên nên làm rõ trước việc tham gia IPO, ngay cả trong\ncác tình huống không có bất kỳ xung đột lợi ích nào giữa việc tham gia IPO của thành viên hoặc ứng viên\nvà sự quan tâm của khách hàng\nTiêu chuẩn đạo đức và nghề nghiệp: khuyến nghị các thực hành và quy trình được thiết kế để ngăn ngừa\nvi phạm Quy tắc đạo đức và Chuẩn mực ứng xử nghề nghiệp","qhtml":null},{"n":72,"q":"A member keeps all records supporting his decisions to buy or sell securities, but discards\nthe records not leading to changes in positions. The member keeps some records in hard copy\nbut others in electronic form. The member has most likely violated the Standard relating to\nrecord retention:","opts":["only by discarding the records not leading to changes in positions.","only by keeping some records in hard copy but others in electronic form.","both by discarding the records not leading to changes in positions and by keeping some records in hard copy but others in electronic form."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn V (C), Lưu giữ hồ sơ, Yêu cầu lưu giữ\náp dụng cho các quyết định mua hoặc bán chứng khoán cũng như các đánh giá được thực hiện không dẫn đến\nthay đổi quan điểm.\nB. Không chính xác vì theo Tiêu chuẩn V (C), Lưu giữ hồ sơ, Hồ sơ có thể được duy trì\nở dạng bản cứng hoặc dạng điện tử.\nC. Không chính xác vì thành viên chỉ vi phạm Tiêu chuẩn V (C), Lưu giữ hồ sơ, bằng cách loại bỏ\ncác hồ sơ không dẫn đến thay đổi vị trí, như được mô tả trong cơ sở phản hồi cho\ncâu trả lời đúng.\nTiêu chuẩn đạo đức và nghề nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề chuyên môn tính toàn vẹn","qhtml":null},{"n":73,"q":"Mary Lorraine, CFA, is a portfolio manager. She adds new factors to her stock selection\nprocess which affects all existing clients. She omits providing her clients with a written\nupdate regarding this change. Instead, Lorraine explains the change to her clients over the\nphone. Has Lorraine violated the Standards?","opts":["No","Yes, because she adds new factors to her stock selection process which affects all existing clients","Yes, because she fails to provide her clients with a written update about adding new factors to her stock selection process"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn V(B), Giao tiếp với khách hàng và khách hàng tiềm năng,\nThành viên hoặc ứng viên phải thông báo cho khách hàng và các bên quan tâm khác trên cơ sở\nliên tục về những thay đổi trong quá trình đầu tư. Ngoài ra, vì mục đích của Tiêu chuẩn V(B), việc liên lạc\nkhông bị giới hạn trong báo cáo bằng văn bản. Việc trình bày thông tin có thể được thực hiện thông qua bất kỳ phương tiện liên lạc\n nào, bao gồm mô tả đề xuất trực tiếp, trò chuyện qua điện thoại.\nDo đó, Lorraine không vi phạm Tiêu chuẩn V(B) vì việc thay đổi quy trình đầu tư không bị cấm\nvà việc giao tiếp bằng lời nói qua điện thoại về thay đổi này được cho phép.\nB. Không chính xác vì Lorraine chưa vi phạm Tiêu chuẩn V(B), Giao tiếp với khách hàng và\nKhách hàng tiềm năng, như được mô tả trong phản hồi cho câu trả lời đúng.\nC. Không chính xác vì Lorraine chưa vi phạm Tiêu chuẩn V(B), Giao tiếp với khách hàng và\nKhách hàng tiềm năng, như được mô tả trong câu trả lời cho câu trả lời đúng.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":74,"q":"A member claims a professional designation she has not earned. This action most likely\nviolates the Standard(s) relating to:","opts":["loyalty only.","misconduct only.","both loyalty and misconduct."],"ans":"C","expl":"A. Không chính xác vì các hành động liên quan đến các chỉ định chưa được xác nhận không chỉ vi phạm Tiêu chuẩn IV (A),\nLòng trung thành nhưng cũng có Tiêu chuẩn I (D), Hành vi sai trái. Tiêu chuẩn liên quan đến lòng trung thành giải quyết các vấn đề\nliên quan đến việc làm Các thành viên phải hành động vì lợi ích của người sử dụng lao động và không tước đoạt quyền lợi của họ\nngười sử dụng lao động lợi dụng kỹ năng và khả năng của họ, tiết lộ thông tin bí mật, hoặc nói cách khác\ngây tổn hại cho người sử dụng lao động của họ. Các hành động liên quan đến các chức danh không được đào tạo có khả năng gây hại cho\nchủ lao động\nB. Không chính xác vì các hành động liên quan đến các chỉ định chưa được xác định không chỉ là Tiêu chuẩn IV (A),\nLòng trung thành nhưng cũng có Tiêu chuẩn I (D), Hành vi sai trái. Tiêu chuẩn liên quan đến hành vi sai trái yêu cầu, các Thành viên\nkhông được tham gia vào bất kỳ hành vi chuyên môn nào liên quan đến gian lận không trung thực về hành vi sai trái hoặc hành vi bất kỳ v.v.\nphản ánh bất lợi về uy tín nghề nghiệp, tính chính trực hoặc năng lực của họ.\nnhững chỉ định không được xác nhận là một hành vi gian lận và lừa dối và sẽ phản ánh bất lợi về\nuy tín nghề nghiệp, tính chính trực và đối thủ cạnh tranh của một người\nC. Đúng vì các hành động liên quan đến việc không được chỉ định là vi phạm Tiêu chuẩn IV (A), Lòng trung thành\nmà còn cả Tiêu chuẩn I (D), Hành vi sai trái. Tiêu chuẩn liên quan đến lòng trung thành giải quyết các vấn đề liên quan đến\nviệc làm, các Thành viên và Ứng viên phải hành động vì lợi ích của người sử dụng lao động của mình và không tước đoạt\nngười sử dụng lao động của họ về lợi thế về kỹ năng và khả năng của họ, tiết lộ thông tin bí mật, hoặc\nnếu không sẽ gây tổn hại cho người sử dụng lao động của họ. Các hành động liên quan đến các chỉ định chưa được xác nhận có khả năng\ncó hại cho người sử dụng lao động. Tiêu chuẩn liên quan đến hành vi sai trái yêu cầu, các Thành viên và Ứng viên\nkhông được tham gia vào bất kỳ hành vi chuyên môn nào liên quan đến sự không trung thực, gian lận hoặc lừa dối hoặc thực hiện bất kỳ hành vi nào\nhành động phản ánh bất lợi đến danh tiếng nghề nghiệp, tính chính trực hoặc năng lực của họ. hành động\nliên quan đến các chỉ định không được xác nhận là không trung thực, một hành vi gian lận và lừa dối và sẽ phản ánh\ngây bất lợi cho danh tiếng nghề nghiệp, tính chính trực và năng lực của một người\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":75,"q":"Sharon Chan, CFA, is an analyst at an investment firm. Chan issues a \"buy\" rating on a\ncompany in which her brother holds shares. Chan does not disclose her brother's holdings in\nher report as she has no beneficial ownership in her brother's account. Has Chan violated the\nStandards?","opts":["No","Yes, the Standard relating to disclosure of conflicts","Yes, the Standard relating to communication with clients and prospective clients"],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn VI(A), Tiết lộ xung đột Các Thành viên và Ứng viên\nphải tiết lộ đầy đủ và công bằng tất cả các vấn đề có thể được cho là sẽ làm suy giảm\nsự độc lập và khách quan của họ hoặc can thiệp vào các nghĩa vụ tương ứng đối với khách hàng, khách hàng tiềm năng\nvà chủ lao động của họ. Ngoài ra, các thành viên bên bán và ứng viên nên tiết lộ bất kỳ\nlợi ích sở hữu có lợi đáng kể nào đối với chứng khoán hoặc nhà đầu tư khác mà thành viên hoặc ứng viên\nđề xuất Chan có quyền sở hữu có lợi trong tài khoản của người thân của cô ấy nên cô ấy buộc phải tiết lộ thông tin đó. Do đó: Chan đã không vi phạm Tiêu chuẩn VI(A)\nNgoài ra, Tiêu chuẩn V(B), Giao tiếp với Khách hàng và Khách hàng tiềm năng nêu rõ rằng người quản lý\nvà các ứng viên nên giao tiếp theo một phương pháp điều chỉnh lại các yếu tố đã được hướng dẫn trong\nkhi đưa ra đề xuất đầu tư Phần nghe của phần ghi chú này là để phân biệt rõ ràng\ngiữa các ý kiến và dữ kiện khi chuẩn bị báo cáo nghiên cứu, thành viên hoặc ứng viên phải trình bày\ncác đặc điểm cơ bản của chứng khoán đang được phân tích, điều này sẽ cho phép người đọc đánh giá\nbáo cáo và kết hợp thông tin mà người đọc cho là có liên quan đến quá trình ra quyết định đầu tư-\ncủa mình. Tiêu chuẩn V(B) đang giải quyết vấn đề liên lạc trong quá trình đầu tư với khách hàng.\nChan không vi phạm Tiêu chuẩn V(B)\nB. Không chính xác vì theo Tiêu chuẩn VI(A), việc tiết lộ xung đột Các thành viên và ứng viên\nphải tiết lộ đầy đủ và công bằng tất cả các vấn đề có thể được cho là sẽ làm giảm\nsự độc lập và khách quan của họ hoặc can thiệp vào các nghĩa vụ tương ứng đối với khách hàng, khách hàng tiềm năng\nvà tuyển dụng của họ. hoặc khoản đầu tư khác mà thành viên hoặc ứng viên\nđề xuất Chan không có quyền sở hữu hưởng lợi trong tài khoản của anh trai cô ấy nên cô ấy không bắt buộc phải\ntiết lộ thông tin đó. Vì vậy, Chan không vi phạm Tiêu chuẩn VI(A)\nC. Không chính xác vì Tiêu chuẩn V(B), Giao tiếp với khách hàng và khách hàng tiềm năng, quy định rằng\ncác thành viên và ứng viên nên trao đổi trong một đề xuất về các yếu tố\ncó công cụ trong việc đưa ra đề xuất đầu tư. Một phần quan trọng của yêu cầu này là\nphân biệt rõ ràng giữa ý kiến ​​và sự thật. Khi chuẩn bị một báo cáo nghiên cứu, thành viên hoặc\nứng viên phải trình bày các đặc điểm cơ bản của (các) chứng khoán đang được phân tích, điều này sẽ cho phép\nngười đọc đánh giá báo cáo và kết hợp thông tin mà người đọc cho là có liên quan đến\nquá trình ra quyết định đầu tư của mình. Tiêu chuẩn V(B) đang giải quyết quá trình đầu tư\ngiao tiếp với khách hàng. Chan không vi phạm Tiêu chuẩn V(B)\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":76,"q":"Jane Macmara, CFA, has just passed Level III of the CFA exam. In her blog, Macmara\nshares her views: \"CFA exams are outrageously difficult,\" and \"Thankfully, the CAPM was not\ntested.\" Macmara has most likely violated the\nStandards:","opts":["only by writing \"Thankfully, the CAPM was not tested.\"","only by writing \"CFA exams are outrageously difficult.\"","by writing both \"Thankfully, the CAPM was not tested\" and \"CFA exams are outrageously difficult.\""],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn VII (A), Ứng xử với tư cách là Người tham gia Chương trình của Viện CFA,\ncác quy tắc, quy định và chính sách của chương trình Viện CFA nghiêm cấm thí sinh tiết lộ\ntài liệu bí mật thu được trong quá trình thi. Ví dụ về thông tin không được tiết lộ bởi\nthí sinh dự thi bao gồm nhưng không giới hạn ở các lĩnh vực chuyên đề rộng lớn và các công thức đã được kiểm tra\nhoặc không được kiểm tra trong kỳ thi. Hơn nữa Tất cả các khía cạnh của kỳ thi, bao gồm các câu hỏi, các lĩnh vực logic rộng,\nvà các công thức được kiểm tra hoặc không được kiểm tra, đều được coi là bí mật khi Viện CFA chọn\nđể luân chuyển chúng một cách công khai. Không có bằng chứng nào cho thấy Viện CFA thiên vị đã tiết lộ thông tin chi tiết về kỳ thi\n. Do đó, Macmara đã vi phạm Tiêu chuẩn VII (A) bằng cách nhìn chằm chằm Rất may, diễn đàn CAPM\nkhông bị xâm phạm\nB. Không chính xác vì Tiêu chuẩn VII (A) Ứng xử với tư cách là Người tham gia trong các Chương trình của Viện CFA, không\nbao gồm việc bày tỏ quan điểm về Viện CFA, Chương trình CFA hoặc các chương trình khác của Viện CFA\nCác thành viên và ứng viên có quyền không đồng ý và bày tỏ sự bất đồng của họ với Viện CFA về\ncác chính sách, thủ tục của Viện. hoặc bất kỳ quan điểm vận động nào của tổ chức. Khi bày tỏ\ný kiến ​​cá nhân, thí sinh bị cấm tiết lộ thông tin cụ thể về nội dung, bao gồm\nbất kỳ câu hỏi thi thực tế nào và thông tin về chủ đề được đề cập hoặc không được đề cập trong kỳ thi\nMacraana không tiết lộ thông tin cụ thể về nội dung mà chỉ bày tỏ quan điểm\nvề kỳ thi CFA. Vì vậy, Macmara đã không vi phạm Tiêu chuẩn VII (A) khi cho rằng các kỳ thi CFA\nrất khó\nC. Không chính xác vì theo Tiêu chuẩn VII (A), Ứng xử với tư cách là Người tham gia các Chương trình của Viện CFA,\nMacmara đã vi phạm Tiêu chuẩn VII (A) chỉ khi viết \"Rất may, công thức CAPM chưa được\nkiểm tra\". Các quy tắc, quy định và chính sách của chương trình Viện CFA nghiêm cấm thí sinh tiết lộ\ntài liệu bí mật thu được trong quá trình thi. Ví dụ về thông tin mà thí sinh dự thi không được\ntiết lộ bao gồm nhưng không giới hạn ở: các lĩnh vực chuyên đề rộng lớn và\ncác công thức được kiểm tra hoặc không được kiểm tra trong kỳ thi. Hơn nữa, Tất cả các khía cạnh của kỳ thi, bao gồm các câu hỏi,\nlĩnh vực chủ đề rộng và các công thức, dù đã được kiểm tra hay chưa được kiểm tra, đều được coi là bí mật cho đến khi\nkhi Viện CFA quyết định công bố chúng một cách công khai. Không có dấu hiệu nào cho thấy Viện CFA đã công bố\nthông tin chi tiết về kỳ thi.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":77,"q":"Donovan Jones, CFA, works at Grae Investments (GI). Gl's main product invests in liquid\nand illiquid assets. Prices for its illiquid holdings are determined by an independent valuation\nfirm. Jones markets performance of the GI product without providing a comparison\nbenchmark. Jones also switches to a different independent valuation firm because of the\nfirm's reputation for giving illiquid assets higher valuations. Jones has most likely violated the\nStandard relating to misrepresentation:","opts":["only by switching valuation firms","only by marketing performance without abenchmark.","both by switching valuation firms and by marketing performance without a benchmark."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn I (C), việc trình bày sai, việc thay đổi nhà cung cấp giá không được\nchỉ dựa trên lý do biện minh rằng nhà cung cấp mới báo cáo giá trị hiện tại cao hơn của a\nsecurity\nB. Không chính xác vì Tiêu chuẩn I(C) [Trình bày sai) không yêu cầu phải luôn cung cấp điểm chuẩn\nđể tuân thủ Một số chiến lược đầu tư có thể không hiển thị điểm chuẩn phù hợp\nvì tính phức tạp hoặc đa dạng của các khoản đầu tư bao gồm. Quyền sở hữu\ncủa Grae đối với một số loại tài sản thanh khoản và thanh khoản kém thể hiện sự đa dạng trong các khoản đầu tư\nC. Không chính xác vì Tiêu chuẩn ((C) [Trình bày sai] không yêu cầu phải luôn cung cấp điểm chuẩn\nđể tuân thủ. Một số chiến lược đầu tư có thể không hiển thị điểm chuẩn phù hợp\nvì tính phức tạp hoặc đa dạng của các khoản đầu tư bao gồm. Quyền sở hữu\ncủa Grae đối với chứng khoán thanh khoản và thanh khoản kém cho thấy sự đa dạng của các khoản đầu tư, do đó hiệu suất tiếp thị\nkhông có điểm chuẩn không vi phạm Tiêu chuẩn\nTiêu chuẩn đạo đức và nghề nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":78,"q":"Which of the following can claim compliance with the GIPS standards?","opts":["Consultants who advise investment firms that manage discretionary client assets.","Asset owners that do not compete for business but report their performance to oversight bodies.","Vendors that provide software to assist investment firms in claiming compliance with the GIPS standards."],"ans":"B","expl":"A. Không chính xác vì nhà tư vấn không thể đưa ra tuyên bố tuân thủ trừ khi họ thực sự quản lý\ntài sản mà họ đang yêu cầu tuân thủ. Họ có thể yêu cầu xác nhận GIPS\ntiêu chuẩn và/hoặc yêu cầu các nhà quản lý đầu tư của họ tuân thủ các tiêu chuẩn GIPS.\nB. Đúng vì chủ sở hữu tài sản có thể tuân thủ các tiêu chuẩn GIPS giống như các doanh nghiệp nếu\nhọ cạnh tranh để kinh doanh. Nếu họ không cạnh tranh kinh doanh nhưng báo cáo kết quả hoạt động của mình cho\ncơ quan giám sát, chủ sở hữu tài sản có thể chọn tuân thủ Tiêu chuẩn GIPS dành cho chủ sở hữu tài sản.\nC. Không chính xác vì chỉ có công ty quản lý tài sản mới có thể yêu cầu tuân thủ. Tương tự, phần mềm (và\nnhà cung cấp phần mềm) không thể 'tuân thủ'. Phần mềm có thể hỗ trợ các công ty đạt được\ntuân thủ các tiêu chuẩn GIPS (ví dụ: bằng cách tính toán hiệu suất theo cách phù hợp với\nyêu cầu tính toán của tiêu chuẩn GIPS), nhưng chỉ doanh nghiệp quản lý tài sản mới có thể yêu cầu\ntuân thủ khi công ty đã đáp ứng tất cả các yêu cầu hiện hành của tiêu chuẩn GIPS.\nTiêu chuẩn đạo đức và nghề nghiệp: giải thích lý do tại sao các tiêu chuẩn GIPS được tạo ra, ai có thể yêu cầu bồi thường\ntuân thủ và ai được hưởng lợi từ việc tuân thủ","qhtml":null},{"n":79,"q":"Which of the following statements is most accurate? In countries where regulations\nconflict with, or contradict, the GIPS standards, firms that claim compliance are required to\ncomply with:","opts":["local regulations with full disclosure of the conflict.","the stricter of local regulations or the GIPS standards.","local regulations with optional disclosure of the conflict."],"ans":"A","expl":"A. Đúng vì theo tiêu chuẩn GIPS, trong trường hợp luật và/hoặc quy định\nxung đột với tiêu chuẩn GIPS, các công ty bắt buộc phải tuân thủ luật pháp và quy định và\ntiết lộ đầy đủ xung đột trong Báo cáo GIPS.\nB. Không chính xác vì vì, như đã giải thích trong phần giải thích cho câu trả lời đúng, các công ty bắt buộc phải\ntuân thủ luật pháp và các quy định và công bố đầy đủ về xung đột trong Báo cáo GIPS\nC. Không chính xác vì vì, như đã giải thích trong phần giải thích cho câu trả lời đúng, các công ty bắt buộc phải\ntuân thủ. với luật pháp và quy định, đồng thời công bố đầy đủ xung đột trong báo cáo GIPS.\nTiêu chuẩn đạo đức và nghề nghiệp: mô tả các nguyên tắc cơ bản về tuân thủ, bao gồm\ncác khuyến nghị của tiêu chuẩn GIPS liên quan đến định nghĩa của công ty và\nđịnh nghĩa về quyền tự quyết định","qhtml":null},{"n":80,"q":"According to the GIPS standards, a firm must include a terminated composite on the\nfirm's list of composite descriptions for at least:","opts":["5 years after the composite termination date.","7 years after the composite termination date.","10 years after the composite termination date."],"ans":"A","expl":"A. Đúng vì theo tiêu chuẩn GIPS, CÔNG TY PHẢI bao gồm\nCOMPOSITE đã chấm dứt trong danh sách này ít nhất 5 năm sau NGÀY CHẤM DỨT COMPOSITE\nB. Không chính xác vì các công ty phải đưa các thông tin tổng hợp đã chấm dứt vào danh sách mô tả tổng hợp\ncủa công ty trong ít nhất 5 năm sau ngày chấm dứt tổng hợp, như được mô tả trong\ncơ sở phản hồi cho câu trả lời đúng và không phải trong 7 năm.\nC. Không chính xác vì các công ty phải đưa các thông tin tổng hợp đã chấm dứt vào danh sách mô tả tổng hợp\ncủa công ty trong ít nhất 5 năm sau ngày chấm dứt tổng hợp, như được mô tả trong\ncơ sở phản hồi cho câu trả lời đúng và không phải trong 10 năm.\nTiêu chuẩn đạo đức và chuyên nghiệp: mô tả các nguyên tắc cơ bản về tuân thủ, bao gồm\ncác đề xuất của tiêu chuẩn GIPS với tôn trọng định nghĩa của công ty và\nđịnh nghĩa về quyền quyết định","qhtml":null},{"n":81,"q":"According to the GIPS standards, verification is:","opts":["performed with respect to an entire firm.","performed by a firm's compliance department.","mandatory for firms that claim compliance with the GIPS standards."],"ans":"A","expl":"A. Đúng vì theo tiêu chuẩn GIPS, việc xác minh được thực hiện đối với\ntoàn bộ công ty chứ không phải trên các tổ hợp cụ thể hoặc quỹ gộp.\nB. Không chính xác vì theo tiêu chuẩn GIPS, Xác minh là một quy trình trong đó một\ncông ty xác minh độc lập (người xác minh) tiến hành kiểm tra một công ty trên cơ sở toàn công ty theo\nvới các thủ tục xác minh bắt buộc của tiêu chuẩn GIPS\nC. Không chính xác vì theo tiêu chuẩn GIPS. Khi một công ty tuyên bố tuân thủ các tiêu chuẩn GIPS\n, công ty đó có thể tự nguyện thuê một bên thứ ba độc lập thực hiện xác minh nhằm\ntăng độ tin cậy vào tuyên bố tuân thủ của công ty\nCác tiêu chuẩn đạo đức và nghề nghiệp: mô tả khái niệm xác minh độc lập","qhtml":null},{"n":82,"q":"Which of the following is a recommended procedure for complying with the Standard\nrelating to preservation of confidentiality?\nProcedure 1: Disclose to authorized fellow employees only information that will improve\nservice to the client\nProcedure 2: Encourage the adoption of standard confidentiality procedures utilized by\nleading firms in the industry","opts":["Procedure 1 only","Procedure 2 only","Both Procedure 1 and Procedure 2"],"ans":"A","expl":"A. Đúng vì theo quy trình được đề xuất để tuân thủ Tiêu chuẩn II (E),\nBảo toàn bí mật, tránh tiết lộ bất kỳ thông tin nào nhận được từ khách hàng ngoại trừ\nnhân viên đồng nghiệp được ủy quyền cũng đang làm việc cho khách hàng. Thông tin nền\ntài liệu, nếu được tiết lộ, có cho phép thành viên hoặc ứng viên cải thiện dịch vụ cho khách hàng không?\nB. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn II (E),\nBảo đảm bí mật, các thành viên nên khuyến khích phát triển các quy trình\nphản ánh phù hợp quy mô và hoạt động kinh doanh của công ty chứ không chỉ các mô hình\ntiêu chuẩn của công ty lớn.\nC. Không chính xác vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn II (E),\nBảo đảm bí mật, các thành viên nên khuyến khích phát triển các quy trình\nphản ánh phù hợp quy mô và hoạt động kinh doanh của công ty chứ không chỉ các mô hình\nchuẩn mực của công ty lớn.\nTiêu chuẩn đạo đức và chuyên nghiệp: khuyến nghị các thực tiễn và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Chuẩn mực ứng xử nghề nghiệp","qhtml":null},{"n":83,"q":"According to recommended procedures for compliance with the Standard relating to\nmaterial nonpublic information,\nfirms should:","opts":["review employee trading through the maintenance of watch lists.","prohibit all types of proprietary activity when a firm comes into possession of material nonpublic information.","permit regular interdepartmental communication of nonpublic information between the corporate finance and equity research departments of a firm."],"ans":"A","expl":"A. Đúng vì theo các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn II(A)\nThông tin quan trọng không công khai thì việc sử dụng danh sách theo dõi là thành phần tối thiểu của hệ thống như vậy. Các\ncác yếu tố tối thiểu bao gồm, nhưng không giới hạn, việc xem xét giao dịch của nhân viên thông qua\nduy trì danh sách \"theo dõi\" tin đồn\".\nB. Không chính xác vì theo quy trình được khuyến nghị để tuân thủ Tiêu chuẩn II(A)\nMaterial Nonpublic\nchẳng hạn như một hệ thống \"bị hạn chế\" và \" Thông tin, cấm tất cả các loại hoạt động độc quyền khi một công ty\n sở hữu thông tin quan trọng không công khai là không phù hợp. Ví dụ: khi\nmột công ty đóng vai trò là nhà tạo lập thị trường, việc cấm giao dịch độc quyền có thể phản tác dụng đối với\nmục tiêu duy trì tính bảo mật của thông tin và tính thanh khoản của thị trường\nC. Không chính xác vì theo quy trình được đề xuất để tuân thủ Tiêu chuẩn 11(A)\nThông tin quan trọng không công khai, thông tin liên lạc giữa các bộ phận giữa các bộ phận đó và\nnhân viên của họ nói chung phải được giảm thiểu để hạn chế luồng có thể có đối với thông tin quan trọng không công khai\nHướng dẫn lưu ý rằng Các yếu tố tối thiểu của hệ thống như vậy bao gồm nhưng không\nsự kiểm soát đáng kể của các bộ phận liên quan tốt nhất là liên lạc thông qua\nmột khu vực có thẩm quyền với công ty trong cơ quan tuân thủ hoặc cơ quan pháp lý\nTiêu chuẩn đạo đức và chuyên nghiệp: đề xuất các biện pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":84,"q":"Q . Tim Howley, CFA, \"pumps up\" the price of a security by spreading misleading\ninformation and later \"dumps\" the security after the price reaches an artificially high level.\nHowley has most likely violated the Standard relating to:","opts":["market manipulation.","independence and objectivity.","material nonpublic information."],"ans":"A","expl":"A. Đúng vì theo Tiêu chuẩn II(B), thao túng thị trường bao gồm (1) việc\nphổ biến thông tin sai lệch hoặc gây hiểu lầm. Ngoài ra, thao túng dựa trên thông tin bao gồm, nhưng\nkhông giới hạn ở việc phát tán tin đồn thất thiệt để lôi kéo người khác giao dịch. Ví dụ: các thành viên và\nứng cử viên phải hạn chế \"tăng giá của một khoản đầu tư bằng cách đưa ra thông tin\ntích cực gây hiểu lầm hoặc những dự đoán lạc quan quá mức về giá trị của chứng khoán chỉ để sau đó \"đổ\" khoản đầu tư\n(tôi bán nó) khi giá, được thúc đẩy bởi tác động của thông tin sai lệch lên những người tham gia thị trường khác\n, đạt đến mức cao giả tạo cấp độ.\nB. Không chính xác vì theo Tiêu chuẩn ((B), tính độc lập và khách quan. Thành viên và\nỨng viên phải thận trọng và phán đoán hợp lý để đạt được và duy trì tính độc lập và\ntính khách quan trong hoạt động nghề nghiệp của mình. sự độc lập và khách quan của người khác.\nC. Không chính xác vì theo Tiêu chuẩn II(A), thông tin quan trọng không công khai Các thành viên và\nỨng cử viên sở hữu thông tin quan trọng không công khai có thể ảnh hưởng đến giá trị của khoản đầu tư\nkhông được hành động hoặc khiến người khác hành động dựa trên thông tin đó.\nTiêu chuẩn đạo đức và chuyên nghiệp: đánh giá các thông lệ, chính sách và hành vi liên quan đến CFA\nQuy tắc đạo đức và tiêu chuẩn ứng xử nghề nghiệp của Viện","qhtml":null},{"n":85,"q":"Which of the following entities can claim compliance with the GIPS standards?","opts":["A pension fund that manages investments for its beneficiaries","An investment consulting firm that focuses on enabling clients to self-manage their investments","A vendor that offers software products designed to help firms achieve compliance with the GIPS standards"],"ans":"A","expl":"A. Đúng vì theo tiêu chuẩn GIPS, chỉ công ty quản lý tài sản mới có thể yêu cầu\ntuân thủ sau khi công ty đó đã đáp ứng tất cả các yêu cầu hiện hành của tiêu chuẩn GIPS. Hơn nữa,\nchủ sở hữu tài sản có thể tuân thủ các tiêu chuẩn GIPS giống như các công ty nếu họ cạnh tranh để kinh doanh\n. Nếu họ không cạnh tranh kinh doanh nhưng báo cáo hiệu quả hoạt động của mình cho cơ quan giám sát,\nchủ sở hữu tài sản có thể chọn tuân thủ Tiêu chuẩn GIPS dành cho chủ sở hữu tài sản. Do đó, quỹ hưu trí\nquản lý các khoản đầu tư cho người thụ hưởng có thể yêu cầu tuân thủ các tiêu chuẩn GIPS\nB. Không chính xác vì theo tiêu chuẩn GIPS, các nhà tư vấn không thể đưa ra tuyên bố tuân thủ\ntrừ khi họ thực sự quản lý tài sản mà họ đưa ra tuyên bố tuân thủ.\nDo đó, một công ty tư vấn đầu tư tập trung vào việc cho phép khách hàng tự quản lý các khoản đầu tư\ncủa họ không thể tuyên bố tuân thủ các tiêu chuẩn GIPS.\nC. Không chính xác vì theo tiêu chuẩn GIPS, phần mềm (và nhà cung cấp phần mềm\n) không thể \"tuân thủ\". Phần mềm có thể hỗ trợ các công ty đạt được sự tuân thủ các tiêu chuẩn GIPS\n(ví dụ: bằng cách tính toán hiệu suất theo cách phù hợp với các yêu cầu tính toán\ncủa các tiêu chuẩn GIPS), nhưng chỉ công ty quản lý tài sản mới có thể yêu cầu tuân thủ khi công ty đã\nthỏa mãn tất cả các yêu cầu áp dụng của tiêu chuẩn GIPS.\nTiêu chuẩn đạo đức và chuyên nghiệp: giải thích lý do tại sao các tiêu chuẩn GIPS được tạo ra , ai có thể yêu cầu\ntuân thủ và ai được hưởng lợi từ việc tuân thủ","qhtml":null},{"n":86,"q":"Timothy Charles, CFA, applies for a role as an investment analyst. In his resume he states,\n\"CFA charterholders achieve better performance results.\" He adds, \"As a CFA charterholder, I\nam the most qualified to manage client investments.\" Charles has most likely violated the\nStandards:","opts":["only by stating, \"CFA charterholders achieve better performance results.\"","only by stating, \"As a CFA charterholder, I am the most qualified to manage client investments.\"","both by stating, \"CFA charterholders achieve better performance results\" and by stating, \"As a CFA charterholder, I am the most qualified to manage client investments.\""],"ans":"C","expl":"A. Không chính xác vì cả hai tuyên bố đều vi phạm Tiêu chuẩn VII(B), Tham chiếu đến Viện CFA, Chỉ định CFA\n và Chương trình CFA như được mô tả trong cơ sở phản hồi đúng.\nB. Không chính xác vì cả hai tuyên bố đều vi phạm Tiêu chuẩn VII(B), Tham chiếu đến Viện CFA, Chỉ định CFA\n và Chương trình CFA như được mô tả trong cơ sở phản hồi đúng\nC. Đúng vì cả hai tuyên bố đều vi phạm Tiêu chuẩn VII(B), Tham chiếu đến Viện CFA, Chỉ định CFA\n và Chương trình CFA bằng cách ngụ ý rằng có thể mong đợi hiệu suất vượt trội từ một người có\nchỉ định CFA. Những tuyên bố đề cập đến Viện CFA, chức danh CFA hoặc\nChương trình CFA phóng đại năng lực của một cá nhân hoặc ngụ ý, trực tiếp hoặc gián tiếp,\nrằng người có chức danh CFA có thể đạt được hiệu suất vượt trội đều không được phép\ntheo tiêu chuẩn. Tài liệu tham khảo không phù hợp... 'Các chủ sở hữu CFA đạt được hiệu suất tốt hơn\nkết quả'... 'Là một chủ sở hữu CFA, tôi là người có trình độ cao nhất để quản lý các khoản đầu tư của khách hàng.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":87,"q":"David Bravoria, CFA, is an independent financial advisor for a high-net-worth client with\nwhom he had not had contact in more than two years. During a recent brief telephone\nconversation, the client states that he wants to increase his risk exposure. Bravoria\nsubsequently recommends and invests in several high-risk venture capital funds on behalf of\nthe client. Bravoría continues, as he has done in the past, to send to his client monthly,\ndetailed, itemized investment statements. Did Bravoria most likely violate any CFA\nStandards?","opts":["No.","Yes, with regard to investment statements.","Yes, with regard to purchasing venture capital funds."],"ans":"C","expl":"A. Không chính xác vì Bravoria đã vi phạm Tiêu chuẩn III(A)-Trung thành, Thận trọng và Cẩn trọng\nB. Không chính xác vì Bravoria đã cung cấp cho khách hàng của mình báo cáo đầu tư thường xuyên hơn\nyêu cầu, tức là hàng quý.\nC. Đúng vì Bravoria đã vi phạm Tiêu chuẩn III(A)-Trung thành, Thận trọng và Cẩn trọng vì anh ta đã không\ncập nhật hồ sơ khách hàng của mình trong hơn hai năm và do đó lẽ ra không nên thực hiện thêm\nđầu tư, đặc biệt là trong các khoản đầu tư có rủi ro cao, cho đến khi anh ta cập nhật rủi ro của khách hàng và\nmục tiêu lợi nhuận, hạn chế tài chính và tình hình tài chính. Bravoria cung cấp cho khách hàng của mình\nbáo cáo đầu tư thường xuyên hơn yêu cầu, tức là hàng quý, do đó\nvi phạm thông tin tài khoản thông thường\nTiêu chuẩn đạo đức và chuyên nghiệp: khuyến nghị các thực hành và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":88,"q":"Which of the following is most accurate? GIPS compliance:","opts":["eliminates investors' need for in-depth due diligence of the GIPS-compliant firm only.","enables the GIPS-compliant firm to participate in competitive bids against other GIPS- compliant firms only.","both eliminates investors' need for in-depth due diligence of the GIPS-compliant firm and enables the GIPS- compliant firm to participate in competitive bids against other GIPS- compliant firms."],"ans":"B","expl":"A. Không chính xác vì các tiêu chuẩn GIPS chắc chắn không loại bỏ nhu cầu thẩm định chuyên sâu\ntừ phía nhà đầu tư.\nB. Đúng vì việc tuân thủ cho phép công ty tuân thủ GIPS tham gia đấu thầu cạnh tranh\nvới các công ty tuân thủ khác trên toàn thế giới.\nC. Không chính xác vì như được mô tả trong cơ sở phản hồi cho việc tuân thủ câu trả lời đúng\ncho phép công ty tuân thủ GIPS tham gia đấu thầu cạnh tranh với các công ty tuân thủ khác\ntrên toàn thế giới nhưng các tiêu chuẩn GIPS chắc chắn không loại bỏ nhu cầu về sự siêng năng chuyên sâu\ncủa nhà đầu tư.\nTiêu chuẩn đạo đức và chuyên nghiệp: mô tả các nguyên tắc cơ bản của việc tuân thủ, bao gồm\nkhuyến nghị của tiêu chuẩn GIPS liên quan đến định nghĩa về công ty và\nđịnh nghĩa về quyền tự quyết định của công ty","qhtml":null},{"n":89,"q":"Which of the following statements is most accurate? Compliance with the GIPS\nstandards:","opts":["by firms eliminates the need for in-depth due diligence by investors.","enables firms to participate in competitive bids against other GIPS-compliant firms.","is mandatory for firms conducting business in countries that do not have regulations relating to investment performance presentation."],"ans":"B","expl":"A. Không chính xác vì các tiêu chuẩn GIPS chắc chắn không loại bỏ sự cần thiết phải có\nsự siêng năng chuyên sâu từ phía khách hàng hoặc nhà đầu tư, nhưng việc tuân thủ các Tiêu chuẩn sẽ nâng cao\nđộ tin cậy của các công ty quản lý đầu tư đã chọn thực hiện trách nhiệm này.\nB. Đúng vì việc tuân thủ cho phép công ty tuân thủ GIPS tham gia đấu thầu cạnh tranh\nvới các công ty tuân thủ khác trên toàn thế giới.\nC. Không chính xác vì việc tuân thủ các tiêu chuẩn GIPS là tự nguyện. Các cơ quan pháp luật hoặc quản lý thường không yêu cầu tuân thủ các tiêu chuẩn GIPS\n.\nTiêu chuẩn đạo đức và nghề nghiệp: giải thích lý do tại sao các tiêu chuẩn GIPS được tạo ra, ai có thể yêu cầu\ntuân thủ và ai được hưởng lợi từ việc tuân thủ","qhtml":null},{"n":90,"q":"A firm claiming compliance with GIPS standards is required to:","opts":["perform verification of the firm's claim of compliance.","maintain its compliance even after the firm has been verified by an independent third party.","determine selection criteria regarding which existing portfolios to include in a composite at the end of the reporting period."],"ans":"B","expl":"A. Không chính xác vì khi một công ty tuyên bố tuân thủ Tiêu chuẩn, họ có thể tự nguyện thuê một\nbên thứ ba độc lập thực hiện xác minh nhằm tăng độ tin cậy vào tuyên bố tuân thủ\ncủa công ty. Do đó, công ty không bắt buộc nhưng có thể chọn một bên thứ ba độc lập để\nthực hiện xác minh tuyên bố tuân thủ của công ty\nB. Đúng vì các công ty tuyên bố tuân thủ các tiêu chuẩn GIPS phải chịu trách nhiệm về\ntuyên bố tuân thủ của họ và duy trì sự tuân thủ đó. Đó là các công ty tự điều chỉnh tuyên bố của họ về việc tuân thủ\n. Do đó, kể cả khi việc tuân thủ được xác minh bởi bên thứ ba độc lập, công ty\nluôn chịu trách nhiệm duy trì sự tuân thủ đó\nC. Không chính xác vì việc xác định danh mục đầu tư nào sẽ được đưa vào Tổng hợp phải được\nthực hiện theo các tiêu chí được thiết lập trước (tức là trên cơ sở trước đó), chứ không phải sau khi thực tế.\nTiêu chuẩn đạo đức và chuyên nghiệp: giải thích mục đích của tổng hợp trong báo cáo hiệu suất","qhtml":null},{"n":91,"q":"Anita Delgado is a candidate in the CFA Program. After taking the Level II examination,\nDelgado posts on a social networking website that she found the exam to be very difficult and\nthat in her opinion, the CFA Program and CFA Institute were losing credibility with the public.\nHas Delgado most likely violated the Standards?","opts":["No","Yes, by posting information about the exam on a public website","Yes, by compromising the reputation or integrity of CFA Institute"],"ans":"A","expl":"A. Đúng vì Delgado không vi phạm Tiêu chuẩn VII (A), Trách nhiệm với tư cách là Viện CFA\nThành viên của Ứng viên CFA. Thí sinh bị cấm tiết lộ tài liệu bí mật thu được\ntrong quá trình thi nhưng được tự do thảo luận về bài thi một cách chung chung, chẳng hạn như việc\nthực tế là cô ấy thấy bài thi khó. Về quan điểm của cô ấy về Viện CFA, một thành viên không được\nkhông tham gia vào bất kỳ hành vi nào làm tổn hại đến danh tiếng hoặc tính chính trực của CFA Imititute Tuy nhiên\nSisudeti VI (A) fack mat shear thể hiện các biểu tượng liên quan đến Chương trình CFA hoặc Viện CFA.\nVì vậy, việc Delgado lên tiếng berapinima không phải là một hành vi làm tổn hại danh tiếng hay\ntính toàn vẹn của Viện CFA\nB. Không chính xác vì Delgado không vi phạm Tiêu chuẩn khi đăng thông tin về bài kiểm tra\ntrên một trang web công cộng, như được mô tả trong Cơ sở lý luận của câu trả lời cho đáp án\nC. Không chính xác vì Delgado không vi phạm Tiêu chuẩn khi bày tỏ quan điểm của mình rằng Chương trình CFA\nvà Viện CFA đang mất uy tín với công chúng, như được mô tả trong Phản hồi\nCơ sở lý luận cho câu trả lời chính\nTiêu chuẩn đạo đức và nghề nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp đối với các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":92,"q":"A member manages two fee-paying family accounts at her firm. The member has the\npower to vote on the shares held in Account 1 and the discretion to sell shares held in\nAccount 2. According to the Standards, is the member considered a beneficial owner of the\nshares held in her family accounts?","opts":["No","Yes, for Account 1 only","Yes, for both Account 1 and Account 2"],"ans":"C","expl":"A. Không chính xác vì theo mục đích của Tiêu chuẩn VI(A), Tiết lộ xung đột, các thành viên và\nsở hữu chứng khoán hoặc các khoản đầu tư khác một cách có lợi nếu họ có\nlợi ích tiền tệ trực tiếp hoặc gián tiếp trong chứng khoán, có quyền bỏ phiếu hoặc chỉ đạo việc bỏ phiếu đối với cổ phiếu của\nchứng khoán hoặc khoản đầu tư hoặc có quyền xử lý việc xử lý chứng khoán hoặc\nđầu tư. Do đó, thành viên có thể trở thành chủ sở hữu hưởng lợi đối với cổ phần nắm giữ trong cả Tài khoản\n1 và Tài khoản 2.\nB. Không chính xác vì theo mục đích của Tiêu chuẩn VI(A) Tiết lộ xung đột, người mua lại và\nứng cử viên sở hữu chứng khoán hoặc các khoản đầu tư khác một cách có lợi nếu họ có lợi tức trực tiếp hoặc gián tiếp\ntrong chứng khoán có quyền biểu quyết hoặc chỉ đạo việc biểu quyết cổ phần của chứng khoán hoặc\ncác khoản đầu tư, hoặc có quyền định đoạt quyền định đoạt chứng khoán hoặc đầu tư.\nDo đó, thành viên được coi là chủ sở hữu thừa kế đối với cổ phần nắm giữ trong cả Tài khoản 1 và\nTài khoản 2\nC. Đúng vì vì mục đích của Tiêu chuẩn VI(A) Tiết lộ xung đột, các thành viên và\nsở hữu lợi ích chứng khoán hoặc các khoản đầu tư khác nếu họ có lợi ích trực tiếp hoặc gián tiếp\ntiền trong chứng khoán, có quyền bỏ phiếu hoặc chỉ đạo việc biểu quyết cổ phiếu của\nchứng khoán hoặc khoản đầu tư hoặc có quyền định đoạt hoặc chỉ đạo việc xử lý chứng khoán hoặc\nđầu tư. Do đó, thành viên được coi là chủ sở hữu hưởng lợi đối với các cổ phần nắm giữ trong cả Tài khoản\n1 và Tài khoản 2\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi tuân thủ Quy tắc và Chuẩn mực cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":93,"q":"Which of the following comments concerning composites meeting the requirements of\nthe GIPS standards is correct?","opts":["A firm's claim of compliance requires all fee-paying accounts managed by the firm be included in at least one composite.","The requirement to create, use and maintain composites is designed to prevent firms using the best-performing accounts to represent an investment strategy.","A composite must include all actual, fee-paying, discretionary and non-discretionary portfolios managed in accordance with the same investment mandate, objective, or strategy."],"ans":"B","expl":"A. Không chính xác vì khiếu nại về tuân thủ yêu cầu tất cả các tài khoản tùy ý trả phí phải\nđược bao gồm trong ít nhất một tổ hợp. Nó không bao gồm tất cả các tài khoản có thể bao gồm các tài khoản không phải\ntùy ý.\nB. Đúng vì một trong những khái niệm chính của tiêu chuẩn là yêu cầu sử dụng vật liệu tổng hợp.\ntổng hợp là sự tổng hợp của một hoặc nhiều danh mục đầu tư được quản lý theo nhiệm vụ, mục tiêu hoặc chiến lược đầu tư\ntương tự. Yêu cầu tạo, sử dụng và duy trì các kết hợp được\nđược thiết kế để ngăn các công ty chọn những tài khoản hoạt động tốt nhất để thể hiện\nhiệu suất của một chiến lược đầu tư.\nC. Không chính xác vì tổng hợp phải bao gồm tất cả các danh mục đầu tư thực tế, có trả phí, tùy ý\nđược quản lý theo cùng một nhiệm vụ, mục tiêu hoặc chiến lược đầu tư. Nó không\nbao gồm các tài khoản không tùy ý.\nTiêu chuẩn đạo đức và chuyên nghiệp: giải thích mục đích của các yếu tố tổng hợp trong báo cáo hiệu suất","qhtml":null},{"n":94,"q":"A member most likely violates the Standard relating to market manipulation if he:","opts":["secures a dominant position in a stock to win a proxy vote.","exploits market inefficiencies in a thinly traded penny stock.","places both buy and sell orders of a stock at the same price to increase trading volume."],"ans":"C","expl":"A. Không chính xác vì đảm bảo vị trí thống trị, kiểm soát trong một công cụ tài chính để khai thác\nvà thao túng giá của một công cụ phái sinh có liên quan và/hoặc tài sản cơ bản là thao túng\ndựa trên giao dịch, tuy nhiên, Tiêu chuẩn II(B) không nhằm mục đích loại trừ các giao dịch được thực hiện trên\ncác chiến lược giao dịch hợp pháp. Giành được một cuộc bỏ phiếu ủy nhiệm là một chiến lược hợp pháp.\nB. Không chính xác vì Tiêu chuẩn II(B) không nhằm mục đích ngăn cản các giao dịch được thực hiện dựa trên chiến lược giao dịch hợp pháp\ndựa trên sự thiếu hiệu quả của thị trường. Mục đích của hành động này\nrất quan trọng trong việc xác định liệu hành động đó có vi phạm tiêu chuẩn này hay không. Vì vậy, thành viên không\nvi phạm Tiêu chuẩn\nC. Đúng vì Thành viên và Ứng viên không được tham gia vào các hành vi bóp méo giá cả hoặc\nlàm tăng khối lượng giao dịch một cách giả tạo nhằm mục đích đánh lừa những người tham gia thị trường. Các giao dịch\nảnh hưởng giả tạo đến giá cả hoặc khối lượng ấn tượng về hoạt động hoặc biến động giá trong một công cụ tài chính\n, thể hiện sự chệch hướng so với kỳ vọng về một thị trường công bằng và hiệu quả.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":95,"q":"The objectives of the GIPS standards include:","opts":["promoting financial regulators' interests.","promoting industry self-regulation on a global basis.","obtaining acceptance of multiple local standards for accurate performance presentation."],"ans":"B","expl":"A. Không chính xác vì một trong những mục tiêu của tiêu chuẩn GIPS là thúc đẩy lợi ích của nhà đầu tư và\nxây dựng niềm tin cho nhà đầu tư chứ không phải thúc đẩy lợi ích của cơ quan quản lý tài chính\nB. Đúng vì một trong những mục tiêu của tiêu chuẩn GIPS là thúc đẩy khả năng tự điều chỉnh của ngành\ntrên cơ sở toàn cầu.\nC. Không chính xác vì một trong những mục tiêu của tiêu chuẩn GIPS là đạt được sự chấp nhận trên toàn thế giới đối với một\ntiêu chuẩn duy nhất [không phải tiêu chuẩn đa dạng] để tính toán và trình bày hiệu suất.\nTiêu chuẩn đạo đức và chuyên nghiệp: giải thích lý do tại sao tiêu chuẩn GIPS được tạo ra, ai có thể yêu cầu\ntuân thủ và ai được hưởng lợi từ việc tuân thủ","qhtml":null},{"n":96,"q":"Which of the following is a recommended procedure for compliance with the Standard\nrelating to knowledge of the law? Members should encourage their firms to:","opts":["distribute summaries of applicable security laws to clients at least annually.","provide written protocols for reporting suspected legal or regulatory violations.","seek the advice of a regulatory agency when in doubt about which action to take regarding potential violations."],"ans":"B","expl":"A. Không chính xác vì các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I (A), Kiến thức về\nLuật, nêu rõ rằng thông tin thích hợp nêu bật các luật và quy định hiện hành có thể được\nphân phối cho nhân viên hoặc được cung cấp ở một vị trí trung tâm. Do đó, quy trình được đề xuất\nlà cung cấp thông tin đó cho nhân viên chứ không phải cho khách hàng.\nB. Đúng vì các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn I (A), Kiến thức về\nLuật, tiểu bang Thiết lập các quy trình báo cáo vi phạm: Các công ty có thể cung cấp các quy trình bằng văn bản để\nbáo cáo các hành vi nghi ngờ vi phạm luật pháp, quy định hoặc chính sách của công ty.\nC. Không chính xác vì các quy trình được đề xuất để tuân thủ Tiêu chuẩn I (A) Kiến thức về\nLuật nêu rõ rằng khi nghi ngờ về hành động thích hợp cần thực hiện, thì\nthành viên hoặc ứng viên nên tìm kiếm lời khuyên của nhân viên tuân thủ hoặc cố vấn pháp lý liên quan đến các yêu cầu pháp lý\nNếu một đồng nghiệp có khả năng vi phạm. cũng có thể\nthận trọng khi thành viên hoặc ứng viên tìm kiếm lời khuyên từ bộ phận tuân thủ của công ty hoặc\ncố vấn pháp lý. Các quy trình được đề xuất để tuân thủ Tiêu chuẩn I (A) không đề xuất\ntìm kiếm lời khuyên của nhân viên cơ quan quản lý\nTiêu chuẩn đạo đức và nghề nghiệp: đề xuất các biện pháp và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":97,"q":"Stella Murphy, CFA, a portfolio manager, meets with a client who is concerned about a\nsecurity recently added to the portfolio. Murphy reviews with the client the decision for\nbuying the security and the risks associated with the company and stock. The following week,\nthe company announces it is buying a company in a non-related industry and the stock falls\nsharply. The client accuses Murphy of not disclosing all the risks associated with holding the\nsecurity. Murphy explains the company's acquisition was unexpected and not factored into\nthe forecast. Has Murphy most likely violated the Standards?","opts":["No","Yes, the Standard relating to communication with clients","Yes, the Standard relating to diligence and reasonable basis"],"ans":"A","expl":"A. Đúng vì Murphy chưa vi phạm bất kỳ Tiêu chuẩn nào. Tiêu chuẩn V(B), Giao tiếp với\nKhách hàng và Khách hàng tiềm năng, yêu cầu các thành viên sử dụng phán đoán hợp lý để xác định\nyếu tố nào quan trọng đối với các phân tích, đề xuất hoặc hành động đầu tư của họ và đưa những\nyếu tố đó vào giao tiếp với khách hàng và khách hàng tiềm năng. Murphy đã làm điều này khi cô\nxem xét lý do đầu tư đằng sau việc mua chứng khoán và những rủi ro đầu tư tiềm ẩn.\nTính phù hợp của việc công bố rủi ro phải được đánh giá dựa trên những gì đã biết tại\nthời điểm thực hiện hành động đầu tư (thường được gọi là cơ sở trước đó)","qhtml":null},{"n":98,"q":"Which of the following member actions most likely violates the Standard relating to\nmarket manipulation?","opts":["Selling one security and buying another to minimize tax liability","Writing misleading posts on social media about the development of a new product","Dividing a large block order into a series of smaller orders to achieve better execution"],"ans":"B","expl":"A. Không chính xác vì Tiêu chuẩn II(B), Thao túng thị trường, yêu cầu các thành viên duy trì tính toàn vẹn của thị trường\nbằng cách cấm thao túng thị trường. Thao túng thị trường bao gồm các hành vi bóp méo\ngiá chứng khoán hoặc khối lượng giao dịch nhằm mục đích đánh lừa những người hoặc tổ chức dựa vào\nthông tin trên thị trường. Mục đích ở đây là giảm thiểu trách nhiệm pháp lý về thuế và không lừa dối\nB. Đúng vì Tiêu chuẩn II(B), Thao túng thị trường, yêu cầu các thành viên duy trì tính toàn vẹn của thị trường\nbằng cách cấm thao túng thị trường. Thao túng thị trường bao gồm các hành vi bóp méo\ngiá chứng khoán hoặc khối lượng giao dịch nhằm mục đích đánh lừa những người hoặc tổ chức dựa vào\nthông tin trên thị trường. Đây là một ví dụ về thao túng cơ sở thông tin vì thông tin\ngiả gây hiểu lầm ảnh hưởng đến những người tham gia thị trường khác.\nC. Không chính xác vì Tiêu chuẩn II(B), Thao túng thị trường yêu cầu các thành viên duy trì tính toàn vẹn của thị trường\nbằng cách cấm thao túng thị trường. Thao túng thị trường bao gồm các hành vi bóp méo\ngiá chứng khoán hoặc khối lượng giao dịch với mục đích\nđể đánh lừa những cá nhân hoặc tổ chức dựa vào thông tin trên thị trường. Việc phân chia lệnh là\nhợp pháp để thực hiện giao dịch tối ưu.\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":99,"q":"Elana Paralova, a Level I CFA candidate working at an asset management firm, wants to\nmake a good impression on a prospective client. She tells the prospect: \"Getting the CFA\nCharter will show I am serious about protecting the interests of my clients and it will boost\nmy reputation. Once I get the Charter, I also hope to make more money by getting\npromoted!\" Her colleague, Jacob Klemmer, CFA, tells Paralova: \"Study all subjects for each\nexam, you never know what will be included. The three exams will be the most difficult\nexams you will ever take. Any promotion and pay raise will reflect your enhanced skills.\" Did\neither Paralova or Klemmer violate the Standards?","opts":["No.","Only Paralova violates the Standards.","Only Klemmer violates the Standards."],"ans":"A","expl":"A. Đúng vì cả Paralova và Klemmer đều không vi phạm Tiêu chuẩn CFA qua tuyên bố của họ.\nParalova không vi phạm Tiêu chuẩn VII(B) Tham chiếu đến Viện CFA về Chỉ định CFA và CFA\nProgram khi cô ấy đưa ra nhận xét của mình về việc nhận được Điều lệ sẽ phản ánh điều gì và hy vọng về\ntăng phí tiêu chuẩn nêu rõ Khi trở thành thành viên của Viện CFA Viện CFA, CFA\nchỉ định hoặc ứng cử vào các Thành viên và Ứng viên CEA Prodam không được xuyên tạc hoặc\nphóng đại ý nghĩa hoặc hàm ý tốt đẹp của việc trở thành thành viên của Viện CFA, giữ chức danh CFA\nhoặc ứng cử vào chương trình CFA, Klemmer không vi phạm Tiêu chuẩn VII (B) Refdanse đối với Viện CFA,\nCFA Desiggetion và Chương trình CFA khi ông bày tỏ quan điểm của mình rằng tiềm năng của Paralova\nviệc tăng lương sẽ phản ánh kỹ năng được nâng cao của cô ấy. Klammer diso tuân thủ Tiêu chuẩn VII(A)\nTrách nhiệm với tư cách là Thành viên Viện CFA hoặc Ứng viên CFA, Ứng xử với tư cách là Người tham gia Viện CFA\nCác chương trình đưa ra nhận định về độ khó của bài thi mà không tiết lộ bất kỳ thông tin cụ thể nào\nchi tiết hoặc nhu cầu học tất cả các môn học. Tiêu chuẩn quy định rằng thí sinh phải tham gia vào bất kỳ môn học nào.\nhành vi làm tổn hại đến giá trị toàn vẹn hoặc tính bảo mật của các chương trình của Viện CFA\nB. Không chính xác vì Paralova không vi phạm Tiêu chuẩn VII (B) Tham khảo Viện CFA, CFA\nChỉ định và Chương trình CFA khi cô đưa ra nhận xét của mình về những gì nhận được Điều lệ\nsẽ phản ánh và hy vọng được tăng lương. Tiêu chuẩn nêu rõ, Khi đề cập đến Viện CFA, CFA\nTư cách thành viên của Viện, chỉ định CFA hoặc ứng cử viên trong Chương trình CFA, Thành viên và\nThí sinh không được xuyên tạc hoặc phóng đại ý nghĩa hoặc hàm ý của tư cách thành viên CFA\nViện, có chứng chỉ CFA hoặc ứng cử vào chương trình CFA\nC. Không chính xác vì Klemmer không vi phạm Tiêu chuẩn VII (B) Tham khảo Viện CFA, CFA\nSự chỉ định và Chương trình CFA khi anh ấy bày tỏ ý kiến ​​của mình rằng khả năng tăng lương của Paralova\nsẽ phản ánh những kỹ năng nâng cao của cô ấy Klemmer cũng tuân thủ các Trách nhiệm Tiêu chuẩn VII(A) với tư cách là một CFA\nThành viên Viện CFA hoặc Ứng viên CFA, Thực hiện với tư cách là Người tham gia các Chương trình của Viện CFA khi nêu rõ\nmột ý kiến về độ khó của bài thi mà không tiết lộ bất kỳ chi tiết cụ thể nào hoặc sự cần thiết phải\nhọc tất cả các môn. Tiêu chuẩn quy định rằng ứng viên không được tham gia vào bất kỳ hành vi nào\nxâm phạm…tính toàn vẹn, hiệu lực hoặc tính bảo mật của các chương trình của Viện CFA.\nTiêu chuẩn đạo đức và nghề nghiệp: giải thích cách thức\ncác thực tiễn, chính sách và hành vi có vi phạm hoặc không vi phạm Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nvề Ứng xử Chuyên nghiệp","qhtml":null},{"n":100,"q":"Amanda Covington, CFA, works for McJan Investment Management. McJan employees\nmust receive prior clearance of their personal investments in accordance with McJan's\ncompliance procedures. To obtain prior clearance, McJan employees must provide a written\nrequest identifying the security, the quantity of the security to be purchased, and the name\nof the broker through which the transaction will be made. Pre-cleared transactions are\napproved only for that trading day. As indicated below, Covington received prior clearance,\nSecurity Quantity Broker Prior Clearance\nA 100 Easy Trade Yes\nB 150 Easy Trade Yes\nTwo days after she received prior clearance, the price of Stock B had decreased, so Covington\ndecided to purchase 250 shares of Stock B only. In her decision to purchase 250 shares of\nStock B only, did Covington violate any CFA Institute Standards of Professional Conduct?","opts":["No.","Yes, relating to diligence and reasonable basis.","Yes, relating to her employer's compliance procedures."],"ans":"C","expl":"A. Không chính xác vì Covington đã vi phạm Tiêu chuẩn ở chỗ cô ấy không tuân theo\nquy trình tuân thủ của chủ lao động, Tiêu chuẩn VI(B).\nB. Không chính xác vì không có gì cho thấy cô ấy đã vi phạm Tiêu chuẩn V(A)-Siêng năng và hợp lý\nCơ sở.\nC. Đúng vì các quy trình phê duyệt trước sẽ ngăn chặn các xung đột lợi ích thực tế và tiềm ẩn,\ncác thành viên phải tuân thủ các thủ tục tuân thủ của chủ lao động, Tiêu chuẩn VI(B).\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":"<p>Amanda Covington, CFA, works for McJan Investment Management. McJan employees must receive prior clearance of their personal investments in accordance with McJan's compliance procedures. To obtain prior clearance, McJan employees must provide a written request identifying the security, the quantity of the security to be purchased, and the name of the broker through which the transaction will be made. Pre-cleared transactions are approved only for that trading day. As indicated below, Covington received prior clearance,</p><table class=\"qtable\"><thead><tr><th>Security</th><th>Quantity</th><th>Broker</th><th>Prior Clearance</th></tr></thead><tbody><tr><td>A</td><td>100</td><td>Easy Trade</td><td>Yes</td></tr><tr><td>B</td><td>150</td><td>Easy Trade</td><td>Yes</td></tr></tbody></table><p>Two days after she received prior clearance, the price of Stock B had decreased, so Covington decided to purchase 250 shares of Stock B only. In her decision to purchase 250 shares of Stock B only, did Covington violate any CFA Institute Standards of Professional Conduct?</p>"},{"n":101,"q":"Cecilia Foster, CFA, starts a job as director of research for Sisyphus Investments (SI). In\nher new job, Foster oversees a small team analysts. Foster discovers the compliance system\nat SI is not up to her expectations and tells her supervisor the system needs improvement.\nThe supervisor tells Foster that the firm will consider compliance system improvements in\nfour months, at the start of the next fiscal year. To comply with the Standards, Foster most\nlikely should initially:","opts":["resign her new position.","decline in writing to accept supervisory responsibility.","establish departmental procedures to ensure fellow Charterholders comply with applicable regulations."],"ans":"B","expl":"A. Không chính xác vì Tiêu chuẩn IV (C), Trách nhiệm của Giám sát viên, quy định rằng nếu một thành viên không thể\nthiết lập một hệ thống tuân thủ đầy đủ, thành viên hoặc ứng cử viên nên từ chối bằng văn bản\nchấp nhận trách nhiệm giám sát cho đến khi công ty áp dụng các thủ tục hợp lý.... Chuẩn mực này thực hiện\nkhông chỉ ra rằng thành viên nên từ chức do hệ thống tuân thủ không đầy đủ\nTiêu chuẩn I (A) Kiến thức về Pháp luật, quy định các thành viên nên từ chức trong một số trường hợp\nliên quan đến hành vi vi phạm pháp luật của đồng nghiệp hoặc công ty của họ chứ không phải do sai sót trong hệ thống tuân thủ.\nB. Đúng vì Tiêu chuẩn IV (C), Trách nhiệm của Giám sát viên, nêu rõ nếu thành viên hoặc ứng viên\nrõ ràng không thể thực hiện trách nhiệm giám sát vì thiếu hệ thống tuân thủ\nhoặc do hệ thống tuân thủ không đầy đủ, thành viên hoặc ứng viên nên từ chối bằng văn bản\nchấp nhận trách nhiệm giám sát cho đến khi công ty áp dụng các thủ tục hợp lý để cho phép\nthực hiện trách nhiệm giám sát\nC. Không chính xác vì Tiêu chuẩn IV (C), Trách nhiệm của Giám sát viên, các bang thành viên và ứng cử viên\nphải thúc đẩy hành động của tất cả nhân viên dưới sự giám sát và quyền hạn của họ để tuân thủ\nluật pháp hiện hành, quy định, quy tắc và chính sách của công ty cũng như Quy tắc và Chuẩn mực Đảm bảo tuân thủ\nchỉ bởi Người sở hữu đặc quyền sẽ không tuân thủ Tiêu chuẩn.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":102,"q":"Wang Dazong, CFA, is a sole proprietor investment advisor. Dazong believes in putting\nhis money at risk along with his clients and trades the same securities as his clients. In order\nto ensure fair treatment of all accounts, he rotates trade allocations so that each account has\nan equal likelihood of receiving a fill on their orders. This allocation procedure also applies to\nDazong's own account. According to the CFA CFA Institute Code of Ethics and Standards of\nProfessional Conduct, the allocation procedure used by Dazong:","opts":["complies with the Standards.","requires revision to ensure client trades take precedence.","should be disclosed and written approval received from clients."],"ans":"B","expl":"A. Không chính xác vì quy trình phân bổ giao dịch không đáp ứng các yêu cầu của Tiêu chuẩn\nVI(B), yêu cầu các giao dịch của khách hàng phải được ưu tiên hơn các giao dịch được thực hiện thay mặt cho\ncông ty hoặc giao dịch cá nhân của thành viên hoặc ứng viên.\nB. Đúng vì Tiêu chuẩn VI(B)-yêu cầu các giao dịch của khách hàng được ưu tiên hơn các giao dịch\nđược thực hiện thay mặt cho công ty hoặc giao dịch cá nhân của thành viên hoặc ứng viên. Bởi vì\ncố vấn giao dịch cùng với chen của mình và phân bổ giao dịch trên cơ sở luân phiên, nên đôi khi\ncác giao dịch của cố vấn sẽ được ưu tiên hơn các khách hàng của mình vì vi phạm Quy tắc và Tiêu chuẩn. Một\nthành viên hoặc ứng viên có cùng vị trí đầu tư hoặc được đồng đầu tư với khách hàng\nkhông phải lúc nào cũng tạo ra xung đột. Tuy nhiên, một số khách hàng trong một số trường hợp đầu tư nhất định yêu cầu thành viên hoặc\nứng viên phải có lợi ích phù hợp. Vị trí đầu tư cá nhân hoặc giao dịch của thành viên hoặc\nứng cử viên hoặc hôn phu của họ không bao giờ được gây bất lợi cho Đầu tư của khách hàng\nC. Không chính xác vì mặc dù các thủ tục liên kết thương mại phải được tiết lộ cho khách hàng trong trường hợp\nnày nhưng thủ tục này không đáp ứng được yêu cầu của Tiêu chuẩn Code Artd nên việc tiết lộ là không\nđầy đủ và các thủ tục cần được sửa đổi\nTiêu chuẩn đạo đức và nghề nghiệp: khuyến nghị các thực tiễn và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":103,"q":"Ken Kawasaki, CFA, shares a building with a number of other professionals who are also\ninvolved in the investment management business. Kawasaki makes arrangements with\nseveral of these professionals, including accountants and lawyers, to refer clients to each\nother. An informal score is kept on the expectation the referrals will equal out over time,\neliminating the need for any cash payments. Kawasaki never mentions this arrangement to\nclients or prospective clients. Does Kawasaki's agreement with the other building occupants\nmost likely violate any CFA Institute Standards of Professional Conduct?","opts":["No.","Yes, related to referral fees.","Yes, related to communication with clients."],"ans":"B","expl":"A. Không chính xác vì Kawasaki đã vi phạm Tiêu chuẩn.\nB. Đúng vì Tiêu chuẩn VI(C) yêu cầu tiết lộ mọi khoản bồi thường, cân nhắc hoặc lợi ích\nnhận được từ hoặc trả cho người khác để giới thiệu sản phẩm hoặc dịch vụ. Ngay cả khi không có sự trao đổi bằng tiền mặt\nthỏa thuận này vẫn mang lại sự giới thiệu có qua có lại cho khách hàng và phải được\ntiết lộ.\nC. Không chính xác vì Tiêu chuẩn này không bị vi phạm vì nó liên quan đến việc tiết lộ cho khách hàng những\nnguyên tắc chung của quy trình đầu tư được sử dụng và không tiết lộ bất kỳ khoản bồi thường,\ncân nhắc hoặc lợi ích nhận được từ hoặc được trả cho người khác để giới thiệu sản phẩm hoặc\ndịch vụ như Tiêu chuẩn VI(C) yêu cầu\nTiêu chuẩn đạo đức và chuyên nghiệp: khuyến nghị các thực tiễn và quy trình được thiết kế để ngăn chặn\nvi phạm Quy tắc đạo đức và tiêu chuẩn ứng xử nghề nghiệp","qhtml":null},{"n":104,"q":"François Bernod, CFA, wrote questions for the Level I CFA exam for several years. After\nleaving the exam writing team, Bernod issues new marketing material for his investment\nfirm, in which he states: \"As someone who helped write CFA exams, I have learned unique\ninsights into portfolio management that will be valuable for my firm's clients.\" However, in\nhis public blog, Bernod makes several negative statements about certain policies of CFA\nInstitute. Bernod has most likely violated the Standards:","opts":["only by expressing negative opinions regarding CFA Institute policies.","only by using an association with CFA Institute to further professional goals","both by expressing negative opinions regarding CFA Institute policies and by using an association with CFA Institute to further professional goals."],"ans":"B","expl":"A. Không chính xác vì vì, theo Tiêu chuẩn VII (A), các Thành viên và ứng viên có quyền không đồng ý\nvà bày tỏ sự không đồng ý với Viện CFA về các chính sách, thủ tục của Viện hoặc bất kỳ quan điểm vận động nào\ncủa tổ chức. Khi bày tỏ quan điểm cá nhân, thí sinh bị cấm\ntiết lộ thông tin có nội dung cụ thể, bao gồm mọi câu hỏi thi thực tế và\nthông tin về chủ đề được đề cập hoặc không được đề cập trong kỳ thi. Bernod có quyền không đồng ý với\ncác chính sách của Viện CFA.\nB. Đúng vì Tiêu chuẩn VII (A), Hành vi với tư cách là Người tham gia Chương trình của Viện CFA, nêu rõ\nTiêu chuẩn VII (A) bao gồm hành vi của các thành viên Viện CFA và các ứng viên tham gia vào Chương trình CFA\nvà nghiêm cấm mọi hành vi làm xói mòn niềm tin của công chúng rằng điều lệ CFA\nthể hiện sự phân quyền thành tích dựa trên trí tuệ và hành vi đạo đức. Hành vi được đề cập bao gồm\nanh ta bị buộc tội sử dụng trái phép hợp tác với Viện CFA để tiếp tục hỗ trợ cá nhân hoặc\ndê chuyên nghiệp Borced đã vi phạm Tiêu chuẩn khi tuyên bố rằng việc anh ta tham gia vào việc chờ thi\nđã mang lại cho anh ta những hiểu biết sâu sắc về đầu tư độc đáo sẽ có giá trị đối với các khách hàng của công ty anh ta\nC. Không chính xác vì theo Tiêu chuẩn VII (A), các Thành viên và ứng viên có quyền không đồng ý và\nbày tỏ sự không đồng tình với Viện CFA về các chính sách, thủ tục của Viện hoặc bất kỳ quan điểm vận động nào\ncủa tổ chức. Khi bày tỏ quan điểm cá nhân, thí sinh bị cấm\ntiết lộ thông tin cụ thể về nội dung, bao gồm mọi câu hỏi thi thực tế và\nthông tin về chủ đề được đề cập hoặc không được đề cập trong bài kiểm tra. Bernod có quyền không đồng ý với\ncác chính sách của Viện CFA, nhưng ông đã vi phạm VII (A), như được mô tả trong phần giải thích cho câu trả lời đúng.\nTiêu chuẩn đạo đức và nghề nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":105,"q":"Disclosure of confidential CFA exam information will most likely be detected by the\nProfessional Conduct staff through:","opts":["monitoring online and social media.","analysis of Proctor Reports.","annual Professional Conduct Statements."],"ans":"A","expl":"A. Đúng vì các yêu cầu về Hành vi Chuyên nghiệp đến từ nhiều nguồn bao gồm\ngiám sát trên mạng xã hội và trực tuyến để phát hiện việc tiết lộ thông tin bí mật về kỳ thi.\nB. Không chính xác vì hành vi của thí sinh bị giám thị giám sát, những người này đã hoàn thành báo cáo về\nthí sinh bị nghi ngờ đã vi phạm các quy tắc kiểm tra trong kỳ thi và tại trung tâm thi.\nC. Không chính xác vì các thành viên và ứng viên phải tự tiết lộ trong Tuyên bố về Ứng xử Chuyên nghiệp hàng năm\ntất cả các vấn đề liên quan đến hành vi chuyên môn của họ, chẳng hạn như liên quan đến kiện tụng dân sự\nhoặc điều tra hình sự hoặc là đối tượng của đơn khiếu nại bằng văn bản. Việc tiết lộ thông tin bí mật về kỳ thi\nsẽ không được tìm thấy trong báo cáo thường niên.\nTiêu chuẩn đạo đức và nghề nghiệp: mô tả cấu trúc của Chương trình ứng xử chuyên nghiệp của Viện CFA\nvà quy trình thực thi Quy tắc và Tiêu chuẩn","qhtml":null},{"n":106,"q":"According to the Standard relating to independence and objectivity.","opts":["a gift from a client could be considered supplementary compensation.","compensation arrangements should link analyst remuneration to investment banking assignments.","portfolio managers may report sell-side analysts to covered companies if analysts' changes in recommendation adversely affect client portfolios."],"ans":"A","expl":"A. Đúng vì việc nhận quà tặng, lợi ích hoặc sự cân nhắc từ khách hàng có thể được phân biệt với\nquà tặng được trao bởi các thực thể đang tìm cách gây ảnh hưởng đến một thành viên hoặc ứng viên nhằm gây bất lợi cho các khách hàng khác.\nTrong mối quan hệ khách hàng, khách hàng đã ký một số loại thỏa thuận thù lao với\nthành viên, ứng viên hoặc công ty của họ. Một món quà từ khách hàng có thể được coi là khoản bồi thường bổ sung\n.\nB. Không chính xác vì thỏa thuận thù lao không được liên kết trực tiếp thù lao của nhà phân tích với\nnhiệm vụ ngân hàng đầu tư mà nhà phân tích có thể tham gia với tư cách là thành viên nhóm.\nC. Không chính xác vì các nhà quản lý danh mục đầu tư có trách nhiệm tôn trọng và thúc đẩy sự trung thực về mặt trí tuệ\ntrong nghiên cứu của bên bán. Do đó, việc các nhà quản lý danh mục đầu tư đe dọa hoặc tham gia\nvào các hành vi trả đũa, chẳng hạn như báo cáo các nhà phân tích bên bán cho công ty được bảo hiểm nhằm\nxúi giục các phản ứng tiêu cực của công ty là không phù hợp.\nTiêu chuẩn đạo đức và chuyên nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":107,"q":"Shirin Regali, CFA, is a well-respected, sell-side analyst covering the biotech sector.\nWhile researching the market prospects for a drug being trialed by BioHeal Inc., Regali\ninterviews industry experts who are not affiliated with the trials or BioHeal. These experts\nexpress confidence that the drug will pass the trials and be a market success. After thorough\nanalysis and based on these experts' insights, Regali issues a \"buy\" recommendation for\nBioHeal and distributes it to her clients and not to the public. Has Regali most likely violated\nthe Standard relating to material nonpublic information?","opts":["No","Yes, by distributing the recommendation to her clients and not to the public","Yes, by issuing a \"buy\" recommendation for BioHeal based on insights from industry experts"],"ans":"A","expl":"A. Đúng vì Regali không vi phạm Tiêu chuẩn II (A), Thông tin quan trọng không công khai\nCác tiêu chuẩn cho phép sử dụng các chuyên gia trong ngành. Các thành viên và ứng viên có thể bồi thường\ncho các cá nhân [chuyên gia trong ngành] vì những hiểu biết sâu sắc của họ mà không vi phạm tiêu chuẩn này. Trong trường hợp này,\ncác chuyên gia trong ngành không liên quan đến các thử nghiệm và do đó không có quyền truy cập vào sự can thiệp nội bộ của\ncác thử nghiệm để những hiểu biết sâu sắc của họ có thể được sử dụng để đưa ra quyết định đầu tư. Các Tiêu chuẩn cũng cho phép các nhà phân tích\nbên bán chỉ phân phối thông tin quan trọng cho khách hàng. Đơn giản là vì các nhà nghiên cứu trong\nchung sẽ nhận thấy các kết luận có chất liệu dnes không yêu cầu nhà phân tích công bố công việc của mình\ncông khai\nB. Không chính xác vì việc phân phối báo cáo chỉ cho khách hàng của cô ấy (và không công khai) không phải là vi phạm Tiêu chuẩn II (A), Thông tin Tài liệu Không công khai. Tiêu chuẩn cho phép các nhà phân tích\nbên bán chỉ phân phối thông tin quan trọng cho khách hàng. Đơn giản là vì công chúng nói chung\nsẽ thấy tài liệu kết luận không yêu cầu nhà phân tích công bố công trình của mình\nC. Không chính xác vì Regali không vi phạm Tiêu chuẩn II (A), Thông tin quan trọng không công khai\nCác tiêu chuẩn cho phép sử dụng các chuyên gia trong ngành. Các ứng cử viên cuối cùng của thành viên có thể bồi thường\ncho các cá nhân [chuyên gia trong ngành] vì những hiểu biết sâu sắc của họ mà không vi phạm tiêu chuẩn này. Trong trường hợp này,\ncác chuyên gia trong ngành không liên quan đến các thử nghiệm và do đó không có quyền truy cập vào thông tin nội bộ về\ncác thử nghiệm, vì vậy ý kiến của họ có thể được sử dụng để đưa ra quyết định đầu tư\nTiêu chuẩn đạo đức và chuyên nghiệp: thể hiện việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến vấn đề liêm chính nghề nghiệp","qhtml":null},{"n":108,"q":"Which of the following member actions most likely violates the Standard relating to\nmaterial nonpublic information?\nAction 1: An analyst buys call options on a stock after learning from the company's CEO that\nthe company will report earnings exceeding analyst expectations\nAction An analyst buys an oil company stock after speaking to a well-known industry expert\nwho believes oil prices will rise due to geopolitical risk.","opts":["Action 1 only","Action 2 only","both Action 1 and Action 2"],"ans":"A","expl":"A. Đúng vì Tiêu chuẩn II(A), Thông tin quan trọng không công khai, tuyên bố rằng các Thành viên và\nỨng viên sở hữu thông tin quan trọng không công khai có thể ảnh hưởng đến giá trị của khoản đầu tư\nkhông được hành động hoặc khiến người khác hành động dựa trên thông tin đó. Ngoài ra, các Thành viên và ứng viên không được sử dụng\nthông tin quan trọng không công khai để tác động đến hành động đầu tư của họ liên quan đến phái sinh.\nDo đó, một nhà phân tích thành viên mua quyền chọn mua cổ phiếu công ty sau khi biết được từ Giám đốc điều hành của mình rằng\ncông ty sẽ báo cáo thu nhập vượt quá kỳ vọng của nhà phân tích là vi phạm Tiêu chuẩn II(A). Ngược lại, một nhà phân tích thành viên mua cổ phiếu của một công ty dầu mỏ sau khi nói chuyện với một chuyên gia nổi tiếng trong ngành\n, người tin rằng giá dầu sẽ tăng do rủi ro địa chính trị không phải là vi phạm Tiêu chuẩn II(A) Điều này\nlà do quan điểm của một chuyên gia nổi tiếng trong ngành khó có thể là thông tin không công khai. Do đó,\nchỉ Hành động 1 vi phạm Tiêu chuẩn II(A).\nB. Không chính xác vì chỉ Hành động 1 vi phạm Tiêu chuẩn II(A), Thông tin quan trọng không công khai như\nđược mô tả trong cơ sở phản hồi của câu trả lời đúng.\nC. Không chính xác vì chỉ Hành động 1 vi phạm Tiêu chuẩn II(A), Thông tin quan trọng không công khai như\nđược mô tả trong cơ sở phản hồi của câu trả lời đúng.\nTiêu chuẩn đạo đức và nghề nghiệp: xác định hành vi tuân thủ Quy tắc và Tiêu chuẩn cũng như\nhành vi vi phạm Quy tắc và Tiêu chuẩn","qhtml":null},{"n":109,"q":"David Andrews, CFA, is an investment manager with Aldona Investments. Aldona\nsecures a block of stock in an oversubscribed initial public offering. Andrews decides to\nprorate the issue to all fee-paying accounts for which it is appropriate, including the fee-\npaying accounts of his immediate family members. Has Andrews violated the Standard\nrelating to fair dealing?","opts":["No.","Yes, by prorating the issue to all subscribers.","Yes, by including immediate family members in the transaction."],"ans":"A","expl":"A. Đúng vì Tiêu chuẩn III (B), Xử lý công bằng, quy định rằng nếu vấn đề được đăng ký quá mức thì\nvấn đề đó sẽ được chia theo tỷ lệ cho tất cả người đăng ký. Ngoài ra, nếu tài khoản thành viên gia đình\ncủa chuyên gia đầu tư được quản lý tương tự như tài khoản của các khách hàng khác của công ty thì không nên loại trừ\ntài khoản thành viên gia đình khỏi việc mua những cổ phiếu đó.\nB. Không chính xác vì Tiêu chuẩn III (B), Xử lý công bằng, quy định rằng nếu vấn đề được đăng ký quá mức thì\nvấn đề đó sẽ được chia theo tỷ lệ cho tất cả người đăng ký.\nC. Không chính xác vì Tiêu chuẩn III (B), Giao dịch công bằng, quy định rằng nếu tài khoản thành viên gia đình\ncủa chuyên gia đầu tư được quản lý tương tự như tài khoản của các khách hàng khác của công ty thì tuy nhiên,\ntài khoản thành viên gia đình không nên bị loại trừ khỏi việc mua cổ phiếu đó.\nTiêu chuẩn đạo đức và nghề nghiệp: chứng minh việc áp dụng Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp trong các tình huống liên quan đến các vấn đề về liêm chính nghề nghiệp","qhtml":null},{"n":110,"q":"John Lee, CFA, manages portfolios for several individuals, including his brother. All of\nLee's clients are standard fee-paying clients. Lee subscribes to an IPO for only those clients for\nwhom the IPO is suitable, which includes his brother. Lee does not receive the number of\nshares requested by his clients and allocates shares of the IPO pro-rata to those clients,\nincluding his brother. Are Lee's actions most likely consistent with the Standards?","opts":["Yes","No, because he allocates the IPO shares to his brother","No, because he fails to allocate the IPO shares to all of his clients"],"ans":"A","expl":"A. Đúng vì Tiêu chuẩn III (B), Giao dịch công bằng, nêu rõ. Ví dụ: khi đầu tư vào\ncá
