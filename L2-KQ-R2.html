<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 2 — Time-Series Analysis · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;

    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));

  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}

  }
</style>

<style id="l2-css">

  .pp-topic.set{color:#a855f7;background:color-mix(in srgb,#a855f7 12%,transparent)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->

<script>
const DATA = [{"n": 1, "q": "Alexis Popov, CFA, is analyzing monthly data. Popov has estimated the model xₜ = b₀ + b₁ × xₜ₋₁ + b₂ × xₜ₋₂ + eₜ. The researcher finds that the residuals have a significant ARCH process. The best solution to this is to:", "opts": ["re-estimate the model with generalized least squares.", "re-estimate the model using a seasonal lag.", "re-estimate the model using only an AR(1) specification."], "ans": "A", "expl": "If the residuals have an ARCH process, then the correct remedy is generalized least squares which will allow Popov to better interpret the results.", "explhtml": "<p>If the residuals have an ARCH process, then the correct remedy is generalized least squares which will allow Popov to better interpret the results.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.o<\/div><div class=\"qtext\"><p>Alexis Popov, CFA, is analyzing monthly data. Popov has estimated the model x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub> × x<sub>t-1<\/sub><\/p><p>+ b<sub>2<\/sub> × x<sub>t-2<\/sub> + e<sub>t<\/sub>. The researcher finds that the residuals have a significant ARCH process. The<\/p><p>best solution to this is to:<\/p><\/div>", "subj": "quant"}, {"n": 2, "q": "Barry Phillips, CFA, has the following time series observations from earliest to latest: (5, 6, 5, 7, 6, 6, 8, 8, 9, 11). Phillips transforms the series so that he will estimate an autoregressive process on the following data (1, -1, 2, -1, 0, 2, 0, 1, 2). The transformation Phillips employed is called:", "opts": ["first differencing.", "moving average.", "beta drift."], "ans": "A", "expl": "Phillips obviously first differenced the data because the 1=6-5, -1=5-6, .... 1 = 9 - 8, 2 = 11 - 9.", "explhtml": "<p>Phillips obviously first differenced the data because the 1=6-5, -1=5-6, .... 1 = 9 - 8, 2 = 11 - 9.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.j<\/div><div class=\"qtext\"><p>Barry Phillips, CFA, has the following time series observations from earliest to latest: (5, 6, 5, 7, 6, 6, 8, 8, 9, 11). Phillips transforms the series so that he will estimate an autoregressive process on the following data (1, -1, 2, -1, 0, 2, 0, 1, 2). The transformation Phillips employed is called:<\/p><\/div>", "subj": "quant"}, {"n": 3, "q": "The regression results from fitting an AR(1) to a monthly time series are presented below. What is the mean-reverting level for the model? Model: ΔExpt = b0 + b1ΔExpt–1 + ε t      Coefficients Standard Error t-Statistic p-value Intercept 1.3304 0.0089 112.2849 < 0.0001 Lag-1 0.1817 0.0061 30.0125 < 0.0001", "opts": ["0.6151.", "1.6258.", "7.3220."], "ans": "B", "expl": "The mean-reverting level is b₀ / (1 − b₁) = 1.3304 / (1 − 0.1817) = 1.6258.", "explhtml": "<p>The mean-reverting level is b<sub>0<\/sub> / (1 − b<sub>1<\/sub>) = 1.3304 / (1 − 0.1817) = 1.6258.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.f<\/div><div class=\"qtext\"><p>The regression results from fitting an AR(1) to a monthly time series are presented below. What is the mean-reverting level for the model?<\/p><div class=\"tbl\"><table><tr><td colspan=5>Model: ΔExpt = b0 + b1ΔExpt–1 + ε t<\/td><\/tr><tr><td><\/td><td>Coefficients<\/td><td>Standard Error<\/td><td>t-Statistic<\/td><td>p-value<\/td><\/tr><tr><td>Intercept<\/td><td>1.3304<\/td><td>0.0089<\/td><td>112.2849<\/td><td>&lt; 0.0001<\/td><\/tr><tr><td>Lag-1<\/td><td>0.1817<\/td><td>0.0061<\/td><td>30.0125<\/td><td>&lt; 0.0001<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 4, "q": "The preceding table will be used by Johnson to forecast values using:", "opts": ["an autoregressive model with a seasonal lag.", "a log-linear trend model with a seasonal lag.", "a serially correlated model with a seasonal lag."], "ans": "A", "expl": "Johnson will use the table to forecast values using an autoregressive model for periods in succession since each successive forecast relies on the forecast for the preceding period. The seasonal lag is introduced to account for seasonal variations in the observed data.", "explhtml": "<p>Johnson will use the table to forecast values using an autoregressive model for periods in succession since each successive forecast relies on the forecast for the preceding period. The seasonal lag is introduced to account for seasonal variations in the observed data.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–9<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"kq-note\">Câu thuộc item set (câu 4–9). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The preceding table will be used by Johnson to forecast values using:<\/p><\/div>", "subj": "quant"}, {"n": 5, "q": "The value that Johnson should enter in the table in place of \"w\" is:", "opts": ["−115.", "−48.", "164."], "ans": "C", "expl": "The seasonal lagged change in sales shows the change in sales from the period 4 quarters before the current period. Sales in the year 2013 quarter 4 increased $164 million over the prior period.", "explhtml": "<p>The seasonal lagged change in sales shows the change in sales from the period 4 quarters before the current period. Sales in the year 2013 quarter 4 increased $164 million over the prior period.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–9<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>The value that Johnson should enter in the table in place of &quot;w&quot; is:<\/p><\/div>", "subj": "quant"}, {"n": 6, "q": "Imagine that Johnson prepares a change-in-sales regression analysis model with seasonality, which includes the following:  Coefficients Intercept −6.032 Lag 1 0.017 Lag 4 0.983 Based on the model, expected sales in the first quarter of 2015 will be closest to:", "opts": ["155.", "210.", "190."], "ans": "B", "expl": "Substituting the 1-period lagged data from 2014.4 and the 4-period lagged data from 2014.1 into the model formula, change in sales is predicted to be −6.032 + (0.017 × 170) + (0.983 × −48) = −50.326. Expected sales are 260 + (−50.326) = 209.674.", "explhtml": "<p>Substituting the 1-period lagged data from 2014.4 and the 4-period lagged data from 2014.1 into the model formula, change in sales is predicted to be −6.032 + (0.017 × 170) + (0.983 × −48) = −50.326. Expected sales are 260 + (−50.326) = 209.674.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–9<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>Imagine that Johnson prepares a change-in-sales regression analysis model with seasonality, which includes the following:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Coefficients<\/td><\/tr><tr><td>Intercept<\/td><td>−6.032<\/td><\/tr><tr><td>Lag 1<\/td><td>0.017<\/td><\/tr><tr><td>Lag 4<\/td><td>0.983<\/td><\/tr><\/table><\/div><p>Based on the model, expected sales in the first quarter of 2015 will be closest to:<\/p><\/div>", "subj": "quant"}, {"n": 7, "q": "Johnson's model was most likely designed to correct for:", "opts": ["nonstationarity in time series data.", "cointegration in the time series.", "heteroskedasticity of model residuals."], "ans": "A", "expl": "Johnson's model transforms raw sales data by first differencing it and then modeling change in sales. This is most likely an adjustment to make the data stationary for use in an AR model.", "explhtml": "<p>Johnson&#x27;s model transforms raw sales data by first differencing it and then modeling change in sales. This is most likely an adjustment to make the data stationary for use in an AR model.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–9<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>Johnson&#x27;s model was most likely designed to correct for:<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "To test for covariance-stationarity in the data, Johnson would most likely use a:", "opts": ["Dickey-Fuller test.", "t-test.", "Durbin-Watson test."], "ans": "A", "expl": "The Dickey-Fuller test for unit roots could be used to test whether the data is covariance non-stationarity. The Durbin-Watson test is used for detecting serial correlation in the residuals of trend models but cannot be used in AR models. A t-test is used to test for residual autocorrelation in AR models.", "explhtml": "<p>The Dickey-Fuller test for unit roots could be used to test whether the data is covariance non-stationarity. The Durbin-Watson test is used for detecting serial correlation in the residuals of trend models but cannot be used in AR models. A t-test is used to test for residual autocorrelation in AR models.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–9<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>To test for covariance-stationarity in the data, Johnson would most likely use a:<\/p><\/div>", "subj": "quant"}, {"n": 9, "q": "The presence of conditional heteroskedasticity of residuals in Johnson's model is would most likely to lead to:", "opts": ["invalid estimates of regression coefficients, but the standard errors will still be valid.", "invalid standard errors of regression coefficients and invalid statistical tests.", "invalid standard errors of regression coefficients, but statistical tests will still be valid."], "ans": "B", "expl": "The presence of conditional heteroskedasticity may leads to incorrect estimates of standard errors of regression coefficients and hence invalid tests of significance of the coefficients.", "explhtml": "<p>The presence of conditional heteroskedasticity may leads to incorrect estimates of standard errors of regression coefficients and hence invalid tests of significance of the coefficients.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–9<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>The presence of conditional heteroskedasticity of residuals in Johnson&#x27;s model is would most likely to lead to:<\/p><\/div>", "subj": "quant"}, {"n": 10, "q": "Consider the estimated model xₜ = −6.0 + 1.1 xt − 1 + 0.3 xt − 2 + εₜ that is estimated over 50 periods. The value of the time series for the 49th observation is 20 and the value of the time series for the 50th observation is 22. What is the forecast for the 52nd observation?", "opts": ["27.22.", "24.2.", "42."], "ans": "A", "expl": "Using the chain-rule of forecasting, Forecasted x₅₁ = −6.0 + 1.1(22) + 0.3(20) = 24.2. Forecasted x₅₂ = −6.0 + 1.1(24.2) + 0.3(22) = 27.22.", "explhtml": "<p>Using the chain-rule of forecasting,<\/p><p>Forecasted x<sub>51<\/sub> = −6.0 + 1.1(22) + 0.3(20) = 24.2.<\/p><p>Forecasted x<sub>52<\/sub> = −6.0 + 1.1(24.2) + 0.3(22) = 27.22.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>Consider the estimated model x<sub>t<\/sub> = −6.0 + 1.1 x<sub>t − 1<\/sub> + 0.3 x<sub>t − 2<\/sub> + ε<sub>t<\/sub> that is estimated over 50<\/p><p>periods. The value of the time series for the 49<sup>th<\/sup> observation is 20 and the value of the time series for the 50<sup>th<\/sup> observation is 22. What is the forecast for the 52<sup>nd<\/sup> observation?<\/p><\/div>", "subj": "quant"}, {"n": 11, "q": "Trend models can be useful tools in the evaluation of a time series of data. However, there are limitations to their usage. Trend models are not appropriate when which of the following violations of the linear regression assumptions is present?", "opts": ["Heteroskedasticity.", "Model misspecification.", "Serial correlation."], "ans": "C", "expl": "One of the primary assumptions of linear regression is that the residual terms are not correlated with each other. If serial correlation, also called autocorrelation, is present, then trend models are not an appropriate analysis tool.", "explhtml": "<p>One of the primary assumptions of linear regression is that the residual terms are not correlated with each other. If serial correlation, also called autocorrelation, is present, then trend models are not an appropriate analysis tool.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.1, LOS 2.b<\/div><div class=\"qtext\"><p>Trend models can be useful tools in the evaluation of a time series of data. However, there are limitations to their usage. Trend models are not appropriate when which of the following violations of the linear regression assumptions is present?<\/p><\/div>", "subj": "quant"}, {"n": 12, "q": "Which of the following statements regarding unit roots in a time series is least accurate?", "opts": ["A time series that is a random walk has a unit root.", "A time series with a unit root is not covariance stationary.", "Even if a time series has a unit root, the predictions from the estimated model are valid."], "ans": "C", "expl": "The presence of a unit root means that the least squares regression procedure that we have been using to estimate an AR(1) model cannot be used without transforming the data first. A time series with a unit root will follow a random walk process. Since a time series that follows a random walk is not covariance stationary, modeling such a time series in an AR model can lead to incorrect statistical conclusions, and decisions made on the basis of these conclusions may be wrong. Unit roots are most likely to occur in time series that trend over time or have a seasonal element.", "explhtml": "<p>The presence of a unit root means that the least squares regression procedure that we have been using to estimate an AR(1) model cannot be used without transforming the data first.<\/p><p>A time series with a unit root will follow a random walk process. Since a time series that follows a random walk is not covariance stationary, modeling such a time series in an AR model can lead to incorrect statistical conclusions, and decisions made on the basis of these conclusions may be wrong. Unit roots are most likely to occur in time series that trend over time or have a seasonal element.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>Which of the following statements regarding unit roots in a time series is least accurate?<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "William Zox, an analyst for Opal Mountain Capital Management, uses two different models to forecast changes in the inflation rate in the United Kingdom. Both models were constructed using U.K. inflation data from 1988-2002. In order to compare the forecasting accuracy of the models, Zox collected actual U.K. inflation data from 2004-2005, and compared the actual data to what each model predicted. The first model is an AR(1) model that was found to have an average squared error of 10.429 over the 12 month period. The second model is an AR(2) model that was found to have an average squared error of 11.642 over the 12 month period. Zox then computed the root mean squared error for each model to use as a basis of comparison. Based on the results of his analysis, which model should Zox conclude is the most accurate?", "opts": ["Model 2 because it has an RMSE of 3.41.", "Model 1 because it has an RMSE of 5.21.", "Model 1 because it has an RMSE of 3.23."], "ans": "C", "expl": "The root mean squared error (RMSE) criterion is used to compare the accuracy of autoregressive models in forecasting out-of-sample values. To determine which model will more accurately forecast future values, we calculate the square root of the mean squared error. The model with the smallest RMSE is the preferred model. The RMSE for Model 1 is √10.429 = 3.23, while the RMSE for Model 2 is √11.642 = 3.41. Since Model 1 has the lowest RMSE, that is the one Zox should conclude is the most accurate.", "explhtml": "<p>The root mean squared error (RMSE) criterion is used to compare the accuracy of autoregressive models in forecasting out-of-sample values. To determine which model will more accurately forecast future values, we calculate the square root of the mean squared error. The model with the smallest RMSE is the preferred model. The RMSE for Model 1 is √10.429 = 3.23, while the RMSE for Model 2 is √11.642 = 3.41. Since Model 1 has the lowest RMSE, that is the one Zox should conclude is the most accurate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.g<\/div><div class=\"qtext\"><p>William Zox, an analyst for Opal Mountain Capital Management, uses two different models to forecast changes in the inflation rate in the United Kingdom. Both models were constructed using U.K. inflation data from 1988-2002. In order to compare the forecasting accuracy of the models, Zox collected actual U.K. inflation data from 2004-2005, and compared the actual data to what each model predicted. The first model is an AR(1) model that was found to have an average squared error of 10.429 over the 12 month period. The second model is an AR(2) model that was found to have an average squared error of 11.642 over the 12 month period. Zox then computed the root mean squared error for each model to use as a basis of comparison. Based on the results of his analysis, which model should Zox conclude is the most accurate?<\/p><\/div>", "subj": "quant"}, {"n": 14, "q": "Are either of the slope coefficients statistically significant?", "opts": ["The simple trend regression is not, but the log-linear trend regression is.", "Yes, both are significant.", "The simple trend regression is, but not the log-linear trend regression."], "ans": "B", "expl": "The respective t-statistics are 6.7400 / 0.6803 = 9.9074 and 0.1371 / 0.0140 = 9.7929. For 10 degrees of freedom, the critical t-value for a two-tailed test at a 5% level of significance is 2.228, so both slope coefficients are statistically significant.", "explhtml": "<p>The respective t-statistics are 6.7400 / 0.6803 = 9.9074 and 0.1371 / 0.0140 = 9.7929. For 10 degrees of freedom, the critical t-value for a two-tailed test at a 5% level of significance is 2.228, so both slope coefficients are statistically significant.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 14–17<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 14–17). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Are either of the slope coefficients statistically significant?<\/p><\/div>", "subj": "quant"}, {"n": 15, "q": "With respect to the possible problems of autocorrelation and nonstationarity, using the log-linear transformation appears to have:", "opts": ["not improved the results for either possible problems.", "improved the results for nonstationarity but not autocorrelation.", "improved the results for autocorrelation but not nonstationarity."], "ans": "A", "expl": "The fact that there is a significant trend for both equations indicates that the data is not stationary in either case. As for autocorrelation, the analyst really cannot test it using the Durbin-Watson test because there are fewer than 15 observations, which is the lower limit of the DW table. Looking at the first-order autocorrelation coefficient, however, we see that it increased (in absolute value terms) for the log-linear equation. If anything, therefore, the problem became more severe.", "explhtml": "<p>The fact that there is a significant trend for both equations indicates that the data is not stationary in either case. As for autocorrelation, the analyst really cannot test it using the Durbin-Watson test because there are fewer than 15 observations, which is the lower limit of the DW table. Looking at the first-order autocorrelation coefficient, however, we see that it increased (in absolute value terms) for the log-linear equation. If anything, therefore, the problem became more severe.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 14–17<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>With respect to the possible problems of autocorrelation and nonstationarity, using the log-linear transformation appears to have:<\/p><\/div>", "subj": "quant"}, {"n": 16, "q": "Using the simple linear trend model, the forecast of sales for Very Vegan for the first out-of-sample period is:", "opts": ["$97.6 million.", "$113.0 million.", "$123.0 million."], "ans": "A", "expl": "The forecast is 10.0015 + (13 × 6.7400) = 97.62.", "explhtml": "<p>The forecast is 10.0015 + (13 × 6.7400) = 97.62.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 14–17<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>Using the simple linear trend model, the forecast of sales for Very Vegan for the first out-of-sample period is:<\/p><\/div>", "subj": "quant"}, {"n": 17, "q": "Using the log-linear trend model, the forecast of sales for Very Vegan for the first out-of-sample period is:", "opts": ["$109.4 million.", "$117.0 million.", "$121.2 million."], "ans": "B", "expl": "The forecast is e2.9803 + (13 × 0.1371) = 117.01.", "explhtml": "<p>The forecast is e2.9803 + (13 × 0.1371) = 117.01.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 14–17<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>Using the log-linear trend model, the forecast of sales for Very Vegan for the first out-of-sample period is:<\/p><\/div>", "subj": "quant"}, {"n": 18, "q": "Which of the following is least likely a consequence of a model containing ARCH(1) errors? The:", "opts": ["model's specification can be corrected by adding an additional lag variable.", "regression parameters will be incorrect.", "variance of the errors can be predicted."], "ans": "A", "expl": "The presence of autoregressive conditional heteroskedasticity (ARCH) indicates that the variance of the error terms is not constant. This is a violation of the regression assumptions upon which time series models are based. The addition of another lag variable to a model is not a means for correcting for ARCH (1) errors.", "explhtml": "<p>The presence of autoregressive conditional heteroskedasticity (ARCH) indicates that the variance of the error terms is not constant. This is a violation of the regression assumptions upon which time series models are based. The addition of another lag variable to a model is not a means for correcting for ARCH (1) errors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.m<\/div><div class=\"qtext\"><p>Which of the following is least likely a consequence of a model containing ARCH(1) errors? The:<\/p><\/div>", "subj": "quant"}, {"n": 19, "q": "Barry Phillips, CFA, has estimated an AR(1) relationship (xₜ = b₀ + b₁ × xₜ₋₁ + eₜ) and got the following result: xₜ₊₁ = 0.5 + 1.0xₜ + eₜ. Phillips should:", "opts": ["first difference the data because b₁ = 1.", "not first difference the data because b₁ − b₀ = 1.0 − 0.5 = 0.5 < 1.", "not first difference the data because b₀ = 0.5 < 1."], "ans": "A", "expl": "The condition b₁ = 1 means that the series has a unit root and is not stationary. The correct way to transform the data in such an instance is to first difference the data.", "explhtml": "<p>The condition b<sub>1<\/sub> = 1 means that the series has a unit root and is not stationary. The correct way to transform the data in such an instance is to first difference the data.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.j<\/div><div class=\"qtext\"><p>Barry Phillips, CFA, has estimated an AR(1) relationship (x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub> × x<sub>t-1<\/sub> + e<sub>t<\/sub>) and got the<\/p><p>following result: x<sub>t+1<\/sub> = 0.5 + 1.0x<sub>t<\/sub> + e<sub>t<\/sub>. Phillips should:<\/p><\/div>", "subj": "quant"}, {"n": 20, "q": "Suppose you estimate the following model of residuals from an autoregressive model: ² = 0.4 + 0.80εₜ₋₁  ² + µₜ, where ε = ε^ εₜ If the residual at time t is 2.0, the forecasted variance for time t+1 is:", "opts": ["3.2.", "2.0.", "3.6."], "ans": "C", "expl": "The variance at t=t+1 is 0.4 + [0.80 (4.0)] = 0.4 + 3.2. = 3.6.", "explhtml": "<p>The variance at t=t+1 is 0.4 + [0.80 (4.0)] = 0.4 + 3.2. = 3.6.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.m<\/div><div class=\"qtext\"><p>Suppose you estimate the following model of residuals from an autoregressive model: <sup>2<\/sup> = 0.4 + 0.80ε<sub>t-1<\/sub> &nbsp; <sup>2<\/sup> + µ<sub>t<\/sub>, where ε = ε<sup>^<\/sup><\/p><p>ε<sub>t<\/sub><\/p><p>If the residual at time t is 2.0, the forecasted variance for time t+1 is:<\/p><\/div>", "subj": "quant"}, {"n": 21, "q": "Le can conclude that the model is:", "opts": ["properly specified because the Durbin-Watson statistic is not significant.", "properly specified because there is no evidence of autocorrelation in the residuals.", "not properly specified because there is evidence of autocorrelation in the residuals and the Durbin-Watson statistic is not significant."], "ans": "B", "expl": "The Durbin-Watson test is not an appropriate test statistic in an AR model, so we cannot use it to test for autocorrelation in the residuals. However, we can test whether each of the four lagged residuals autocorrelations is statistically significant. The t-test to accomplish this is equal to the autocorrelation divided by the standard error with 62 degrees of freedom (64 - 2). The critical t-value for a significance level of 5% is about 2.000 from the table. The appropriate t-statistics are: Lag 1 = 0.015/0.129 = 0.116 Lag 2 = -0.101/0.129 = -0.783 Lag 3 = -0.007/0.129 = -0.054 Lag 4 = 0.095/0.129 = 0.736 None of these are statically significant, so we can conclude that there is no evidence of autocorrelation in the residuals, and therefore the AR model is properly specified.", "explhtml": "<p>The Durbin-Watson test is not an appropriate test statistic in an AR model, so we cannot use it to test for autocorrelation in the residuals. However, we can test whether each of the four lagged residuals autocorrelations is statistically significant. The t-test to accomplish this is equal to the autocorrelation divided by the standard error with 62 degrees of freedom (64 - 2). The critical t-value for a significance level of 5% is about 2.000 from the table. The appropriate t-statistics are:<\/p><p>Lag 1 = 0.015/0.129 = 0.116 Lag 2 = -0.101/0.129 = -0.783 Lag 3 = -0.007/0.129 = -0.054 Lag 4 = 0.095/0.129 = 0.736<\/p><p>None of these are statically significant, so we can conclude that there is no evidence of autocorrelation in the residuals, and therefore the AR model is properly specified.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 21–24). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Le can conclude that the model is:<\/p><\/div>", "subj": "quant"}, {"n": 22, "q": "What is the forecast for the gross margin in the first quarter of 2004?", "opts": ["0.246.", "0.250.", "0.256."], "ans": "C", "expl": "The forecast for the following quarter is 0.155 + 0.240(0.240) + 0.168(0.260) = 0.256.", "explhtml": "<p>The forecast for the following quarter is 0.155 + 0.240(0.240) + 0.168(0.260) = 0.256.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>What is the forecast for the gross margin in the first quarter of 2004?<\/p><\/div>", "subj": "quant"}, {"n": 23, "q": "With respect to heteroskedasticity in the model, we can definitively say:", "opts": ["nothing.", "an ARCH process exists because the autocorrelation coefficients of the residuals have different signs.", "heteroskedasticity is not a problem because the DW statistic is not significant."], "ans": "A", "expl": "None of the information in the problem provides information concerning heteroskedasticity. Note that heteroskedasticity occurs when the variance of the error terms is not constant. When heteroskedasticity is present in a time series, the residuals appear to come from different distributions (model seems to fit better in some time periods than others).", "explhtml": "<p>None of the information in the problem provides information concerning heteroskedasticity. Note that heteroskedasticity occurs when the variance of the error terms is not constant. When heteroskedasticity is present in a time series, the residuals appear to come from different distributions (model seems to fit better in some time periods than others).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>With respect to heteroskedasticity in the model, we can definitively say:<\/p><\/div>", "subj": "quant"}, {"n": 24, "q": "Supposing the time series is actually a random walk, which of the following approaches would be appropriate prior to using an autoregressive model?", "opts": ["First differencing the time series.", "ARCH.", "Convert the time series by taking a natural log of the series."], "ans": "A", "expl": "First differencing often transforms a random walk into a covariance stationary time series which can then be fitted using autoregressive models. ARCH is a type of AR model where the residuals exhibit conditional heteroskedasticity and is not an approach to convert a random walk into a covariance stationary time series. Taking natural log is recommended for a time series with an exponential growth prior to fitting a trend model.", "explhtml": "<p>First differencing often transforms a random walk into a covariance stationary time series which can then be fitted using autoregressive models. ARCH is a type of AR model where the residuals exhibit conditional heteroskedasticity and is not an approach to convert a random walk into a covariance stationary time series. Taking natural log is recommended for a time series with an exponential growth prior to fitting a trend model.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>Supposing the time series is actually a random walk, which of the following approaches would be appropriate prior to using an autoregressive model?<\/p><\/div>", "subj": "quant"}, {"n": 25, "q": "Consider the following estimated model: (Salesₜ - Sales ₜ₋₁) = 30 + 1.25 (Sales ₜ₋₁ - Sales ₜ₋₂) + 1.1 (Sales ₜ₋₄ - Sales ₜ₋₅) t=1,2,.. T and Sales for the periods 1999.1 through 2000.2: t Period Sales T 2000.2 $2,000 T-1 2000.1 $1,800 T-2 1999.4 $1,500 T-3 1999.3 $1,400 T-4 1999.2 $1,900 T-5 1999.1 $1,700 The forecasted Sales amount for 2000.3 is closest to:", "opts": ["$2,270.00.", "$2,625.00.", "$1,730.00."], "ans": "C", "expl": "Note that since we are forecasting 2000.3, the numbering of the \"t\" column has changed. Change in sales = $30 + 1.25 ($2,000-1,800) + 1.1 ($1,400-1,900) Change in sales = $30 + 250 - 550 = -$270 Sales = $2,000 – 270 = $1,730", "explhtml": "<p>Note that since we are forecasting 2000.3, the numbering of the &quot;t&quot; column has changed.<\/p><p>Change in sales = $30 + 1.25 ($2,000-1,800) + 1.1 ($1,400-1,900)<\/p><p>Change in sales = $30 + 250 - 550 = -$270<\/p><p>Sales = $2,000 – 270 = $1,730<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.n<\/div><div class=\"qtext\"><p>Consider the following estimated model:<\/p><p>(Sales<sub>t <\/sub>- Sales <sub>t-1<\/sub>) = 30 + 1.25 (Sales <sub>t-1<\/sub> - Sales <sub>t-2<\/sub>) + 1.1 (Sales <sub>t-4<\/sub> - Sales <sub>t-5<\/sub>) t=1,2,.. T<\/p><p>and Sales for the periods 1999.1 through 2000.2:<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>Period<\/td><td>Sales<\/td><\/tr><tr><td>T<\/td><td>2000.2<\/td><td>$2,000<\/td><\/tr><tr><td>T-1<\/td><td>2000.1<\/td><td>$1,800<\/td><\/tr><tr><td>T-2<\/td><td>1999.4<\/td><td>$1,500<\/td><\/tr><tr><td>T-3<\/td><td>1999.3<\/td><td>$1,400<\/td><\/tr><tr><td>T-4<\/td><td>1999.2<\/td><td>$1,900<\/td><\/tr><tr><td>T-5<\/td><td>1999.1<\/td><td>$1,700<\/td><\/tr><\/table><\/div><p>The forecasted Sales amount for 2000.3 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 26, "q": "The model xₜ = b₀ + b₁ xₜ₋₁ + b₂ xₜ₋₂ + b₃ xₜ₋₃ + b₄ xₜ₋₄ + εₜ is:", "opts": ["an autoregressive conditional heteroskedastic model, ARCH.", "a moving average model, MA(4).", "an autoregressive model, AR(4)."], "ans": "C", "expl": "This is an autoregressive model (i.e., lagged dependent variable as independent variables) of order p=4 (that is, 4 lags).", "explhtml": "<p>This is an autoregressive model (i.e., lagged dependent variable as independent variables) of order p=4 (that is, 4 lags).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>The model x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub> x<sub>t-1<\/sub> + b<sub>2<\/sub> x<sub>t-2 <\/sub>+ b<sub>3<\/sub> x<sub>t-3<\/sub> + b<sub>4<\/sub> x<sub>t-4<\/sub> + ε<sub>t<\/sub> is:<\/p><\/div>", "subj": "quant"}, {"n": 27, "q": "David Wellington, CFA, has estimated the following log-linear trend model: LN(xₜ) = b₀ + b₁t + εₜ. Using six years of quarterly observations, 2001:I to 2006:IV, Wellington gets the following estimated equation: LN(xₜ) = 1.4 + 0.02t. The first out-of-sample forecast of xₜ for 2007:I is closest to:", "opts": ["4.14.", "1.88.", "6.69."], "ans": "C", "expl": "Wellington's out-of-sample forecast of LN(xₜ) is 1.9 = 1.4 + 0.02 × 25, and e1.9 = 6.69. (Six years of quarterly observations, at 4 per year, takes us up to t = 24. The first time period after that is t = 25.)", "explhtml": "<p>Wellington&#x27;s out-of-sample forecast of LN(x<sub>t<\/sub>) is 1.9 = 1.4 + 0.02 × 25, and e<sup>1.9<\/sup> = 6.69. (Six years of quarterly observations, at 4 per year, takes us up to t = 24. The first time period after that is t = 25.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>David Wellington, CFA, has estimated the following log-linear trend model: LN(x<sub>t<\/sub>) = b<sub>0<\/sub> + b<sub>1<\/sub>t + ε<sub>t<\/sub>.<\/p><p>Using six years of quarterly observations, 2001:I to 2006:IV, Wellington gets the following estimated equation: LN(x<sub>t<\/sub>) = 1.4 + 0.02t. The first out-of-sample forecast of x<sub>t<\/sub> for 2007:I is<\/p><p>closest to:<\/p><\/div>", "subj": "quant"}, {"n": 28, "q": "Suppose you estimate the following model of residuals from an autoregressive model: ² = 0.25 + 0.6ε²  ₜ₋₁ + µₜ, where ε = ε^ εₜ If the residual at time t is 0.9, the forecasted variance for time t+1 is:", "opts": ["0.790.", "0.850.", "0.736."], "ans": "C", "expl": "The variance at t = t + 1 is 0.25 + [0.60 (0.9)²] = 0.25 + 0.486 = 0.736. See also, ARCH models.", "explhtml": "<p>The variance at t = t + 1 is 0.25 + [0.60 (0.9)<sup>2<\/sup>] = 0.25 + 0.486 = 0.736. See also, ARCH models.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.m<\/div><div class=\"qtext\"><p>Suppose you estimate the following model of residuals from an autoregressive model: <sup>2<\/sup> = 0.25 + 0.6ε<sup>2<\/sup> &nbsp; <sub>t-1<\/sub> + µ<sub>t<\/sub>, where ε = ε<sup>^<\/sup><\/p><p>ε<sub>t<\/sub><\/p><p>If the residual at time t is 0.9, the forecasted variance for time t+1 is:<\/p><\/div>", "subj": "quant"}, {"n": 29, "q": "The main reason why financial and time series intrinsically exhibit some form of nonstationarity is that:", "opts": ["serial correlation, a contributing factor to nonstationarity, is always present to a certain degree in most financial and time series.", "most financial and economic relationships are dynamic and the estimated regression coefficients can vary greatly between periods.", "most financial and time series have a natural tendency to revert toward their means."], "ans": "B", "expl": "Because all financial and time series relationships are dynamic, regression coefficients can vary widely from period to period. Therefore, financial and time series will always exhibit some amount of instability or nonstationarity.", "explhtml": "<p>Because all financial and time series relationships are dynamic, regression coefficients can vary widely from period to period. Therefore, financial and time series will always exhibit some amount of instability or nonstationarity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.h<\/div><div class=\"qtext\"><p>The main reason why financial and time series intrinsically exhibit some form of nonstationarity is that:<\/p><\/div>", "subj": "quant"}, {"n": 30, "q": "Modeling the trend in a time series of a variable that grows at a constant rate with continuous compounding is best done with:", "opts": ["a moving average model.", "a log-linear transformation of the time series.", "simple linear regression."], "ans": "B", "expl": "The log-linear transformation of a series that grows at a constant rate with continuous compounding (exponential growth) will cause the transformed series to be linear.", "explhtml": "<p>The log-linear transformation of a series that grows at a constant rate with continuous compounding (exponential growth) will cause the transformed series to be linear.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>Modeling the trend in a time series of a variable that grows at a constant rate with continuous compounding is best done with:<\/p><\/div>", "subj": "quant"}, {"n": 31, "q": "An analyst wants to model quarterly sales data using an autoregressive model. She has found that an AR(1) model with a seasonal lag has significant slope coefficients. She also finds that when a second and third seasonal lag are added to the model, all slope coefficients are significant too. Based on this, the best model to use would most likely be an:", "opts": ["AR(1) model with no seasonal lags.", "AR(1) model with 3 seasonal lags.", "ARCH(1)."], "ans": "B", "expl": "She has found that all the slope coefficients are significant in the model xₜ = b₀ + b₁xt– 1 + b₂xt– 4 + eₜ. She then finds that all the slope coefficients are significant in the model xₜ = b₀ + b₁xt– 1 + b₂xt– 2 + b₃xt– 3 + b₄xt– 4 + eₜ. Thus, the final model should be used rather than any other model that uses a subset of the regressors.", "explhtml": "<p>She has found that all the slope coefficients are significant in the model x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>x<sub>t– 1<\/sub> + b<sub>2<\/sub>x<sub>t– 4<\/sub> + e<sub>t<\/sub>. She then finds that all the slope coefficients are significant in the model x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>x<sub>t– 1<\/sub> + b<sub>2<\/sub>x<sub>t– 2<\/sub> + b<sub>3<\/sub>x<sub>t– 3<\/sub> + b<sub>4<\/sub>x<sub>t– 4<\/sub> + e<sub>t<\/sub>. Thus, the final model should be used rather than any other model that uses a subset of the regressors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>An analyst wants to model quarterly sales data using an autoregressive model. She has found that an AR(1) model with a seasonal lag has significant slope coefficients. She also finds that when a second and third seasonal lag are added to the model, all slope coefficients are significant too. Based on this, the best model to use would most likely be an:<\/p><\/div>", "subj": "quant"}, {"n": 32, "q": "Suppose that the time series designated as Y is mean reverting. If Yₜ₊₁ = 0.2 + 0.6 Yₜ, the best prediction of Yₜ₊₁ is:", "opts": ["0.5.", "0.3.", "0.8."], "ans": "A", "expl": "The prediction is Yₜ₊₁ = b₀ / (1-b₁) = 0.2 / (1-0.6) = 0.5", "explhtml": "<p>The prediction is Y<sub>t+1<\/sub> = b<sub>0<\/sub> / (1-b<sub>1<\/sub>) = 0.2 / (1-0.6) = 0.5<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.f<\/div><div class=\"qtext\"><p>Suppose that the time series designated as Y is mean reverting. If Y<sub>t+1<\/sub> = 0.2 + 0.6 Y<sub>t<\/sub>, the best prediction of Y<sub>t+1<\/sub> is:<\/p><\/div>", "subj": "quant"}, {"n": 33, "q": "Which of the following statements regarding time series analysis is least accurate?", "opts": ["If a time series is a random walk, first differencing will result in covariance stationarity.", "We cannot use an AR(1) model on a time series that consists of a random walk.", "An autoregressive model with two lags is equivalent to a moving-average model with two lags."], "ans": "C", "expl": "An autoregression model regresses a dependent variable against one or more lagged values of itself whereas a moving average is an average of successive observations in a time series. A moving average model can have lagged terms but these are lagged values of the residual.", "explhtml": "<p>An autoregression model regresses a dependent variable against one or more lagged values of itself whereas a moving average is an average of successive observations in a time series. A moving average model can have lagged terms but these are lagged values of the residual.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.i<\/div><div class=\"qtext\"><p>Which of the following statements regarding time series analysis is least accurate?<\/p><\/div>", "subj": "quant"}, {"n": 34, "q": "Dianne Hart, CFA, is considering the purchase of an equity position in Book World, Inc, a leading seller of books in the United States. Hart has obtained monthly sales data for the past seven years, and has plotted the data points on a graph. Hart notices that the revenues are growing at approximately 4.5% per year. Which of the following statements regarding Hart's analysis of the data time series of Book World's sales is most accurate? Hart should utilize a:", "opts": ["mean-reverting model to analyze the data because the time series pattern is covariance stationary.", "linear model to analyze the data because the mean appears to be constant.", "log-linear model to analyze the data because it is likely to exhibit a compound growth trend."], "ans": "C", "expl": "A log-linear model is more appropriate when analyzing data that is growing at a compound rate. Sales are a classic example of a type of data series that normally exhibits compound growth.", "explhtml": "<p>A log-linear model is more appropriate when analyzing data that is growing at a compound rate. Sales are a classic example of a type of data series that normally exhibits compound growth.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.1, LOS 2.b<\/div><div class=\"qtext\"><p>Dianne Hart, CFA, is considering the purchase of an equity position in Book World, Inc, a leading seller of books in the United States. Hart has obtained monthly sales data for the past seven years, and has plotted the data points on a graph. Hart notices that the revenues are growing at approximately 4.5% per year. Which of the following statements regarding Hart&#x27;s analysis of the data time series of Book World&#x27;s sales is most accurate? Hart should utilize a:<\/p><\/div>", "subj": "quant"}, {"n": 35, "q": "Rhonda Wilson, CFA, is analyzing sales data for the TUV Corp, a current equity holding in her portfolio. She observes that sales for TUV Corp. have grown at a steadily increasing rate over the past ten years due to the successful introduction of some new products. Wilson anticipates that TUV will continue this pattern of success. Which of the following models is most appropriate in her analysis of sales for TUV Corp?", "opts": ["A log-linear trend model, because the data series can be graphed using a straight, upward-sloping line.", "A log-linear trend model, because the data series exhibits a predictable, exponential growth trend.", "A linear trend model, because the data series is equally distributed above and below the line and the mean is constant."], "ans": "B", "expl": "The log-linear trend model is the preferred method for a data series that exhibits a trend or for which the residuals are predictable. In this example, sales grew at an exponential, or increasing rate, rather than a steady rate.", "explhtml": "<p>The log-linear trend model is the preferred method for a data series that exhibits a trend or for which the residuals are predictable. In this example, sales grew at an exponential, or increasing rate, rather than a steady rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.1, LOS 2.b<\/div><div class=\"qtext\"><p>Rhonda Wilson, CFA, is analyzing sales data for the TUV Corp, a current equity holding in her portfolio. She observes that sales for TUV Corp. have grown at a steadily increasing rate over the past ten years due to the successful introduction of some new products. Wilson anticipates that TUV will continue this pattern of success. Which of the following models is most appropriate in her analysis of sales for TUV Corp?<\/p><\/div>", "subj": "quant"}, {"n": 36, "q": "The primary concern when deciding upon a time series sample period is which of the following factors?", "opts": ["Current underlying economic and market conditions.", "The total number of observations.", "The length of the sample time period."], "ans": "A", "expl": "There will always be a tradeoff between the increase statistical reliability of a longer time period and the increased stability of estimated regression coefficients with shorter time periods. Therefore, the underlying economic environment should be the deciding factor when selecting a time series sample period.", "explhtml": "<p>There will always be a tradeoff between the increase statistical reliability of a longer time period and the increased stability of estimated regression coefficients with shorter time periods. Therefore, the underlying economic environment should be the deciding factor when selecting a time series sample period.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.h<\/div><div class=\"qtext\"><p>The primary concern when deciding upon a time series sample period is which of the following factors?<\/p><\/div>", "subj": "quant"}, {"n": 37, "q": "A time series that has a unit root can be transformed into a time series without a unit root through:", "opts": ["mean reversion.", "calculating moving average of the residuals.", "first differencing."], "ans": "C", "expl": "First differencing a series that has a unit root creates a time series that does not have a unit root.", "explhtml": "<p>First differencing a series that has a unit root creates a time series that does not have a unit root.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.j<\/div><div class=\"qtext\"><p>A time series that has a unit root can be transformed into a time series without a unit root through:<\/p><\/div>", "subj": "quant"}, {"n": 38, "q": "Which of the following is NOT a requirement for a series to be covariance stationary? The:", "opts": ["time series must have a positive trend.", "expected value of the time series is constant over time.", "covariance of the time series with itself (lead or lag) must be constant."], "ans": "A", "expl": "For a time series to be covariance stationary: 1) the series must have an expected value that is constant and finite in all periods, 2) the series must have a variance that is constant and finite in all periods, and 3) the covariance of the time series with itself for a fixed number of periods in the past or future must be constant and finite in all periods.", "explhtml": "<p>For a time series to be covariance stationary: 1) the series must have an expected value that is constant and finite in all periods, 2) the series must have a variance that is constant and finite in all periods, and 3) the covariance of the time series with itself for a fixed number of periods in the past or future must be constant and finite in all periods.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.c<\/div><div class=\"qtext\"><p>Which of the following is NOT a requirement for a series to be covariance stationary? The:<\/p><\/div>", "subj": "quant"}, {"n": 39, "q": "Frank Batchelder and Miriam Yenkin are analysts for Bishop Econometrics. Batchelder and Yenkin are discussing the models they use to forecast changes in China's GDP and how they can compare the forecasting accuracy of each model. Batchelder states, \"The root mean squared error (RMSE) criterion is typically used to evaluate the in-sample forecast accuracy of autoregressive models.\" Yenkin replies, \"If we use the RMSE criterion, the model with the largest RMSE is the one we should judge as the most accurate.\" With regard to their statements about using the RMSE criterion:", "opts": ["Batchelder is correct; Yenkin is incorrect.", "Batchelder is incorrect; Yenkin is correct.", "Batchelder is incorrect; Yenkin is incorrect."], "ans": "C", "expl": "The root mean squared error (RMSE) criterion is used to compare the accuracy of autoregressive models in forecasting out-of-sample values (not in-sample values). Batchelder is incorrect. Out-of-sample forecast accuracy is important because the future is always out of sample, and therefore out-of-sample performance of a model is critical for evaluating real world performance. Yenkin is also incorrect. The RMSE criterion takes the square root of the average squared errors from each model. The model with the smallest RMSE is judged the most accurate.", "explhtml": "<p>The root mean squared error (RMSE) criterion is used to compare the accuracy of autoregressive models in forecasting out-of-sample values (not in-sample values). Batchelder is incorrect. Out-of-sample forecast accuracy is important because the future is always out of sample, and therefore out-of-sample performance of a model is critical for evaluating real world performance.<\/p><p>Yenkin is also incorrect. The RMSE criterion takes the square root of the average squared errors from each model. The model with the smallest RMSE is judged the most accurate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.g<\/div><div class=\"qtext\"><p>Frank Batchelder and Miriam Yenkin are analysts for Bishop Econometrics. Batchelder and Yenkin are discussing the models they use to forecast changes in China&#x27;s GDP and how they can compare the forecasting accuracy of each model. Batchelder states, &quot;The root mean squared error (RMSE) criterion is typically used to evaluate the in-sample forecast accuracy of autoregressive models.&quot; Yenkin replies, &quot;If we use the RMSE criterion, the model with the largest RMSE is the one we should judge as the most accurate.&quot;<\/p><p>With regard to their statements about using the RMSE criterion:<\/p><\/div>", "subj": "quant"}, {"n": 40, "q": "Which of the following statements regarding seasonality is least accurate?", "opts": ["A time series that is first differenced can be adjusted for seasonality by incorporating the first-differenced value for the previous year's corresponding period.", "Not correcting for seasonality when, in fact, seasonality exists in the time series results in a violation of an assumption of linear regression.", "The presence of seasonality makes it impossible to forecast using a time-series model."], "ans": "C", "expl": "The goal of a time series model is to identify factors that can be predicted. Seasonality in a time series refers to patterns that repeat at regular intervals. When a time series exhibits seasonality, seasonal lags should be included in the model in order to increase its predictive ability.", "explhtml": "<p>The goal of a time series model is to identify factors that can be predicted. Seasonality in a time series refers to patterns that repeat at regular intervals. When a time series exhibits seasonality, seasonal lags should be included in the model in order to increase its predictive ability.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.4, LOS 2.l<\/div><div class=\"qtext\"><p>Which of the following statements regarding seasonality is least accurate?<\/p><\/div>", "subj": "quant"}, {"n": 41, "q": "Alexis Popov, CFA, has estimated the following specification: xₜ = b₀ + b₁ × xₜ₋₁ + eₜ. Which of the following would most likely lead Popov to want to change the model's specification?", "opts": ["Correlation(eₜ, eₜ₋₁) is not significantly different from zero.", "Correlation(eₜ, eₜ₋₂) is significantly different from zero.", "b₀ < 0."], "ans": "B", "expl": "If correlation(eₜ, eₜ₋₂) is not zero, then the model suffers from 2nd order serial correlation. Popov may wish to try an AR(2) model. Both of the other conditions are acceptable in an AR(1) model.", "explhtml": "<p>If correlation(e<sub>t<\/sub>, e<sub>t-2<\/sub>) is not zero, then the model suffers from 2<sup>nd<\/sup> order serial correlation. Popov may wish to try an AR(2) model. Both of the other conditions are acceptable in an AR(1) model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.o<\/div><div class=\"qtext\"><p>Alexis Popov, CFA, has estimated the following specification: x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub> × x<sub>t-1<\/sub> + e<sub>t<\/sub>. Which of the following would most likely lead Popov to want to change the model&#x27;s specification?<\/p><\/div>", "subj": "quant"}, {"n": 42, "q": "The table below shows the autocorrelations of the lagged residuals for quarterly theater ticket sales that were estimated using the AR(1) model: ln(salesₜ) = b₀ + b₁(ln salest − 1) + eₜ. Assuming the critical t-statistic at 5% significance is 2.0, which of the following is the most likely conclusion about the appropriateness of the model? The time series: Lagged Autocorrelations of the Log of Quarterly Theater Ticket Sales    Lag Autocorrelation Standard Error t-Statistic 1 −0.0738 0.1667 −0.44271 2 −0.1047 0.1667 −0.62807 3 −0.0252 0.1667 −0.15117 4 0.5528 0.1667 3.31614", "opts": ["contains ARCH (1) errors.", "contains seasonality.", "would be more appropriately described with an MA(4) model."], "ans": "B", "expl": "The time series contains seasonality as indicated by the strong and significant autocorrelation of the lag-4 residual.", "explhtml": "<p>The time series contains seasonality as indicated by the strong and significant autocorrelation of the lag-4 residual.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.4, LOS 2.l<\/div><div class=\"qtext\"><p>The table below shows the autocorrelations of the lagged residuals for quarterly theater ticket sales that were estimated using the AR(1) model: ln(sales<sub>t<\/sub>) = b<sub>0<\/sub> + b<sub>1<\/sub>(ln sales<sub>t − 1<\/sub>) + e<sub>t<\/sub>. Assuming<\/p><p>the critical t-statistic at 5% significance is 2.0, which of the following is the most likely conclusion about the appropriateness of the model? The time series:<\/p><div class=\"tbl\"><table><tr><td colspan=4>Lagged Autocorrelations of the Log of Quarterly Theater Ticket Sales<\/td><\/tr><tr><td>Lag<\/td><td>Autocorrelation<\/td><td>Standard Error<\/td><td>t-Statistic<\/td><\/tr><tr><td>1<\/td><td>−0.0738<\/td><td>0.1667<\/td><td>−0.44271<\/td><\/tr><tr><td>2<\/td><td>−0.1047<\/td><td>0.1667<\/td><td>−0.62807<\/td><\/tr><tr><td>3<\/td><td>−0.0252<\/td><td>0.1667<\/td><td>−0.15117<\/td><\/tr><tr><td>4<\/td><td>0.5528<\/td><td>0.1667<\/td><td>3.31614<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 43, "q": "After discussing the above matter with a colleague, Cranwell finally decides to use an autoregressive model of order one i.e. AR(1) for the above data. Below is a summary of the findings of the model: b\n0 0.4563 b\n1 0.6874 Standard error 0.3745 R-squared 0.7548 Durbin Watson 1.23 F 12.63 Observations 180 Calculate the mean reverting level of the series.", "opts": ["1.26.", "1.46.", "1.66."], "ans": "B", "expl": "The formula for the mean reverting level is b₀/(1-b₁) = 0.4563/(1-0.6874)=1.46", "explhtml": "<p>The formula for the mean reverting level is b<sub>0<\/sub>/(1-b<sub>1<\/sub>) = 0.4563/(1-0.6874)=1.46<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 43–46<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 43–46). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>After discussing the above matter with a colleague, Cranwell finally decides to use an autoregressive model of order one i.e. AR(1) for the above data. Below is a summary of the findings of the model:<\/p><div class=\"tbl\"><table><tr><td>b<br>0<\/td><td>0.4563<\/td><\/tr><tr><td>b<br>1<\/td><td>0.6874<\/td><\/tr><tr><td>Standard error<\/td><td>0.3745<\/td><\/tr><tr><td>R-squared<\/td><td>0.7548<\/td><\/tr><tr><td>Durbin Watson<\/td><td>1.23<\/td><\/tr><tr><td>F<\/td><td>12.63<\/td><\/tr><tr><td>Observations<\/td><td>180<\/td><\/tr><\/table><\/div><p>Calculate the mean reverting level of the series.<\/p><\/div>", "subj": "quant"}, {"n": 44, "q": "Cranwell is aware that the Dickey Fuller test can be used to discover whether a model has a unit root. He is also aware that the test would use a revised set of critical t-values. What would it mean to reject the null of the Dickey Fuller test (Hₒ: g = 0) ?", "opts": ["There is no unit root.", "There is a unit root and the model cannot be used in its current form.", "There is a unit root but the model can be used if covariance-stationary."], "ans": "A", "expl": "The null hypothesis of g = 0 actually means that b₁ – 1 = 0 , meaning that b₁ = 1. Since we have rejected the null, we can conclude that the model has no unit root.", "explhtml": "<p>The null hypothesis of g = 0 actually means that b<sub>1<\/sub> – 1 = 0 , meaning that b<sub>1<\/sub> = 1. Since we have rejected the null, we can conclude that the model has no unit root.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 43–46<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.b<\/div><div class=\"qtext\"><p>Cranwell is aware that the Dickey Fuller test can be used to discover whether a model has a unit root. He is also aware that the test would use a revised set of critical t-values. What would it mean to reject the null of the Dickey Fuller test (H<sub>o<\/sub>: g = 0) ?<\/p><\/div>", "subj": "quant"}, {"n": 45, "q": "Cranwell would also like to test for serial correlation in his AR(1) model. To do this, Cranwell should:", "opts": ["use the provided Durbin Watson statistic and compare it to a critical value.", "use a t-test on the residual autocorrelations over several lags.", "determine if the series has a finite and constant covariance between leading and lagged terms of itself."], "ans": "B", "expl": "To test for serial correlation in an AR model, test for the significance of residual autocorrelations over different lags. The goal is for all t-statistics to lack statistical significance. The Durbin-Watson test is used with trend models; it is not appropriate for testing for serial correlation of the error terms in an autoregressive model. Constant and finite unconditional variance is not an indicator of serial correlation but rather is one of the requirements of covariance stationarity.", "explhtml": "<p>To test for serial correlation in an AR model, test for the significance of residual autocorrelations over different lags. The goal is for all t-statistics to lack statistical significance. The Durbin-Watson test is used with trend models; it is not appropriate for testing for serial correlation of the error terms in an autoregressive model. Constant and finite unconditional variance is not an indicator of serial correlation but rather is one of the requirements of covariance stationarity.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 43–46<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.b<\/div><div class=\"qtext\"><p>Cranwell would also like to test for serial correlation in his AR(1) model. To do this, Cranwell should:<\/p><\/div>", "subj": "quant"}, {"n": 46, "q": "When using the root mean squared error (RMSE) criterion to evaluate the predictive power of the model, which of the following is the most appropriate statement?", "opts": ["Use the model with the highest RMSE calculated using the in-sample data.", "Use the model with the lowest RMSE calculated using the out-of-sample data.", "Use the model with the lowest RMSE calculated using the in-sample data."], "ans": "B", "expl": "RMSE is a measure of error hence the lower the better. It should be calculated on the out-of-sample data i.e. the data not directly used in the development of the model. This measure thus indicates the predictive power of our model.", "explhtml": "<p>RMSE is a measure of error hence the lower the better. It should be calculated on the out-of-sample data i.e. the data not directly used in the development of the model. This measure thus indicates the predictive power of our model.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 43–46<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.b<\/div><div class=\"qtext\"><p>When using the root mean squared error (RMSE) criterion to evaluate the predictive power of the model, which of the following is the most appropriate statement?<\/p><\/div>", "subj": "quant"}, {"n": 47, "q": "Which of the following statements regarding the instability of time-series models is most accurate? Models estimated with:", "opts": ["a greater number of independent variables are usually more stable than those with a smaller number.", "longer time series are usually more stable than those with shorter time series.", "shorter time series are usually more stable than those with longer time series."], "ans": "C", "expl": "Those models with a shorter time series are usually more stable because there is less opportunity for variance in the estimated regression coefficients between the different time periods.", "explhtml": "<p>Those models with a shorter time series are usually more stable because there is less opportunity for variance in the estimated regression coefficients between the different time periods.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.h<\/div><div class=\"qtext\"><p>Which of the following statements regarding the instability of time-series models is most accurate? Models estimated with:<\/p><\/div>", "subj": "quant"}, {"n": 48, "q": "An AR(1) autoregressive time series model:", "opts": ["can be used to test for a unit root, which exists if the slope coefficient is less than one.", "cannot be used to test for a unit root.", "can be used to test for a unit root, which exists if the slope coefficient equals one."], "ans": "C", "expl": "If you estimate the following model xₜ = b₀ + b₁ × xₜ₋₁ + eₜ and get b₁ = 1, then the process has a unit root and is nonstationary.", "explhtml": "<p>If you estimate the following model x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub> × x<sub>t-1<\/sub> + e<sub>t<\/sub> and get b<sub>1<\/sub> = 1, then the process has a unit root and is nonstationary.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>An AR(1) autoregressive time series model:<\/p><\/div>", "subj": "quant"}, {"n": 49, "q": "Which of the following statements regarding covariance stationarity is CORRECT?", "opts": ["The estimation results of an AR model involving a time series that is not covariance stationary are meaningless.", "A time series that is covariance stationary may have residuals whose mean changes over time.", "A time series may be both covariance stationary and heteroskedastic."], "ans": "A", "expl": "Covariance stationarity requires that the expected value and the variance of the time series be constant over time.", "explhtml": "<p>Covariance stationarity requires that the expected value and the variance of the time series be constant over time.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.c<\/div><div class=\"qtext\"><p>Which of the following statements regarding covariance stationarity is CORRECT?<\/p><\/div>", "subj": "quant"}, {"n": 50, "q": "A time series x that is a random walk with a drift is best described as:", "opts": ["xt = xt − 1 + εt.", "xt = b0 + b1 xt − 1.", "xt = b0 + b1xt − 1 + εt."], "ans": "C", "expl": "The best estimate of random walk for period t is the value
