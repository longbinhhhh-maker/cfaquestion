 of the series at (t − 1). If the random walk has a drift component, this drift is added to the previous period's value of the time series to produce the forecast.", "explhtml": "<p>The best estimate of random walk for period t is the value of the series at (t − 1). If the random walk has a drift component, this drift is added to the previous period&#x27;s value of the time series to produce the forecast.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.i<\/div><div class=\"qtext\"><p>A time series x that is a random walk with a drift is best described as:<\/p><\/div>", "subj": "quant"}, {"n": 51, "q": "The data below yields the following AR(1) specification: xₜ = 0.9 – 0.55xₜ₋₁ + Eₜ , and the indicated fitted values and residuals. Time xt fitted values residuals 1 1 - - 2 -1 0.35 -1.35 3 2 1.45 0.55 4 -1 -0.2 -0.8 5 0 1.45 -1.45 6 2 0.9 1.1 7 0 -0.2 0.2 8 1 0.9 0.1 9 2 0.35 1.65 The following sets of data are ordered from earliest to latest. To test for ARCH, the researcher should regress:", "opts": ["(-1.35, 0.55, -0.8, -1.45, 1.1, 0.2, 0.1, 1.65) on (0.35, 1.45, -0.2, 1.45, 0.9, -0.2, 0.9, 0.35).", "(1.8225, 0.3025, 0.64, 2.1025, 1.21, 0.04, 0.01) on (0.3025, 0.64, 2.1025, 1.21, 0.04, 0.01, 2.7225).", "(1, 4, 1, 0, 4, 0, 1, 4) on (1, 1, 4, 1, 0, 4, 0, 1)."], "ans": "B", "expl": "The test for ARCH is based on a regression of the squared residuals on their lagged values. The squared residuals are (1.8225, 0.3025, 0.64, 2.1025, 1.21, 0.04, 0.01, 2.7225). So, (1.8225, 0.3025, 0.64, 2.1025, 1.21, 0.04, 0.01) is regressed on (0.3025, 0.64, 2.1025, 1.21, 0.04, 0.01, 2.7225). If coefficient a₁ in: ˆε² ₜ = a₀ + a₁ˆε² t-1 + μt is statistically different from zero, the time series exhibits ARCH(1).", "explhtml": "<p>The test for ARCH is based on a regression of the squared residuals on their lagged values. The squared residuals are (1.8225, 0.3025, 0.64, 2.1025, 1.21, 0.04, 0.01, 2.7225). So, (1.8225, 0.3025, 0.64, 2.1025, 1.21, 0.04, 0.01) is regressed on (0.3025, 0.64, 2.1025, 1.21, 0.04, 0.01, 2.7225). If coefficient a<sub>1<\/sub> in:<\/p><p>ˆε<sup>2<\/sup> <sub>t<\/sub> = a<sub>0<\/sub> + a<sub>1<\/sub>ˆε<sup>2<\/sup><\/p><p>t-1 + μt<\/p><p>is statistically different from zero, the time series exhibits ARCH(1).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.m<\/div><div class=\"qtext\"><p>The data below yields the following AR(1) specification: x<sub>t<\/sub> = 0.9 – 0.55x<sub>t-1<\/sub> + E<sub>t<\/sub> , and the indicated<\/p><p>fitted values and residuals.<\/p><div class=\"tbl\"><table><tr><td>Time<\/td><td>xt<\/td><td>fitted values<\/td><td>residuals<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>2<\/td><td>-1<\/td><td>0.35<\/td><td>-1.35<\/td><\/tr><tr><td>3<\/td><td>2<\/td><td>1.45<\/td><td>0.55<\/td><\/tr><tr><td>4<\/td><td>-1<\/td><td>-0.2<\/td><td>-0.8<\/td><\/tr><tr><td>5<\/td><td>0<\/td><td>1.45<\/td><td>-1.45<\/td><\/tr><tr><td>6<\/td><td>2<\/td><td>0.9<\/td><td>1.1<\/td><\/tr><tr><td>7<\/td><td>0<\/td><td>-0.2<\/td><td>0.2<\/td><\/tr><tr><td>8<\/td><td>1<\/td><td>0.9<\/td><td>0.1<\/td><\/tr><tr><td>9<\/td><td>2<\/td><td>0.35<\/td><td>1.65<\/td><\/tr><\/table><\/div><p>The following sets of data are ordered from earliest to latest. To test for ARCH, the researcher should regress:<\/p><\/div>", "subj": "quant"}, {"n": 52, "q": "Consider the following estimated model: (Salesₜ - Sales ₜ₋₁)= 100 - 1.5 (Sales ₜ₋₁ - Sales ₜ₋₂) + 1.2 (Sales ₜ₋₄ - Sales ₜ₋₅) t=1,2,.. T and Sales for the periods 1999.1 through 2000.2: t Period Sales T 2000.2 $1,000 T-1 2000.1 $900 T-2 1999.4 $1,200 T-3 1999.3 $1,400 T-4 1999.2 $1,000 T-5 1999.1 $800 The forecasted Sales amount for 2000.3 is closest to:", "opts": ["$730.00.", "$1,430.00.", "$1,730.00."], "ans": "B", "expl": "Change in sales = $100 - 1.5 ($1,000-900) + 1.2 ($1,400-1,000) Change in sales = $100 - 150 + 480 =$430 Sales = $1,000 + 430 = $1,430", "explhtml": "<p>Change in sales = $100 - 1.5 ($1,000-900) + 1.2 ($1,400-1,000)<\/p><p>Change in sales = $100 - 150 + 480 =$430<\/p><p>Sales = $1,000 + 430 = $1,430<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.n<\/div><div class=\"qtext\"><p>Consider the following estimated model:<\/p><p>(Sales<sub>t <\/sub>- Sales <sub>t-1<\/sub>)= 100 - 1.5 (Sales <sub>t-1<\/sub> - Sales <sub>t-2<\/sub>) + 1.2 (Sales <sub>t-4<\/sub> - Sales <sub>t-5<\/sub>) t=1,2,.. T<\/p><p>and Sales for the periods 1999.1 through 2000.2:<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>Period<\/td><td>Sales<\/td><\/tr><tr><td>T<\/td><td>2000.2<\/td><td>$1,000<\/td><\/tr><tr><td>T-1<\/td><td>2000.1<\/td><td>$900<\/td><\/tr><tr><td>T-2<\/td><td>1999.4<\/td><td>$1,200<\/td><\/tr><tr><td>T-3<\/td><td>1999.3<\/td><td>$1,400<\/td><\/tr><tr><td>T-4<\/td><td>1999.2<\/td><td>$1,000<\/td><\/tr><tr><td>T-5<\/td><td>1999.1<\/td><td>$800<\/td><\/tr><\/table><\/div><p>The forecasted Sales amount for 2000.3 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 53, "q": "Barry Phillips, CFA, is analyzing quarterly data. He has estimated an AR(1) relationship (xₜ = b₀ + b₁ × xₜ₋₁ + eₜ) and wants to test for seasonality. To do this he would want to see if which of the following statistics is significantly different from zero?", "opts": ["Correlation(eₜ, eₜ₋₄).", "Correlation(eₜ, eₜ₋₁).", "Correlation(eₜ, eₜ₋₅)."], "ans": "A", "expl": "Although seasonality can make the other correlations significant, the focus should be on correlation(eₜ, eₜ₋₄) because the 4th lag is the value that corresponds to the same season as the predicted variable in the analysis of quarterly data.", "explhtml": "<p>Although seasonality can make the other correlations significant, the focus should be on correlation(e<sub>t<\/sub>, e<sub>t-4<\/sub>) because the 4<sup>th<\/sup> lag is the value that corresponds to the same season as the predicted variable in the analysis of quarterly data.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.4, LOS 2.l<\/div><div class=\"qtext\"><p>Barry Phillips, CFA, is analyzing quarterly data. He has estimated an AR(1) relationship (x<sub>t<\/sub> = b<sub>0<\/sub> +<\/p><p>b<sub>1<\/sub> × x<sub>t-1<\/sub> + e<sub>t<\/sub>) and wants to test for seasonality. To do this he would want to see if which of the following statistics is significantly different from zero?<\/p><\/div>", "subj": "quant"}, {"n": 54, "q": "The regression results from fitting an AR(1) model to the first-differences in enrollment growth rates at a large university includes a Durbin-Watson statistic of 1.58. The number of quarterly observations in the time series is 60. At 5% significance, the critical values for the Durbin-Watson statistic are dₗ = 1.55 and dᵤ = 1.62. Which of the following is the most accurate interpretation of the DW statistic for the model?", "opts": ["The Durbin-Watson statistic cannot be used with AR(1) models.", "Since DW > dₗ, the null hypothesis of no serial correlation is rejected.", "Since dₗ < DW < du, the results of the DW test are inconclusive."], "ans": "A", "expl": "The Durbin-Watson statistic is not useful when testing for serial correlation in an autoregressive model where one of the independent variables is a lagged value of the dependent variable. The existence of serial correlation in an AR model is determined by examining the autocorrelations of the residuals.", "explhtml": "<p>The Durbin-Watson statistic is not useful when testing for serial correlation in an autoregressive model where one of the independent variables is a lagged value of the dependent variable. The existence of serial correlation in an AR model is determined by examining the autocorrelations of the residuals.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.e<\/div><div class=\"qtext\"><p>The regression results from fitting an AR(1) model to the first-differences in enrollment growth rates at a large university includes a Durbin-Watson statistic of 1.58. The number of quarterly observations in the time series is 60. At 5% significance, the critical values for the Durbin-Watson statistic are d<sub>l<\/sub> = 1.55 and d<sub>u<\/sub> = 1.62. Which of the following is the most accurate interpretation of the DW statistic for the model?<\/p><\/div>", "subj": "quant"}, {"n": 55, "q": "Collier's supervisors would probably not want to use the results from the trend model for all of the following reasons EXCEPT:", "opts": ["the model is a linear trend model and log-linear models are always superior.", "the slope coefficient is not significant.", "it does not give insights into the underlying dynamics of the movement of the dependent variable."], "ans": "A", "expl": "Linear trend models are not always inferior to log-linear models. To determine which specification is better would require more analysis such as a graph of the data over time. As for the other possible answers, Collier can see that the slope coefficient is not significant because the t-statistic is 1.37=2.7/1.97. Also, regressing a variable on a simple time trend only describes the movement over time, and does not address the underlying dynamics of the dependent variable.", "explhtml": "<p>Linear trend models are not always inferior to log-linear models. To determine which specification is better would require more analysis such as a graph of the data over time. As for the other possible answers, Collier can see that the slope coefficient is not significant because the t-statistic is 1.37=2.7/1.97. Also, regressing a variable on a simple time trend only describes the movement over time, and does not address the underlying dynamics of the dependent variable.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 55–58<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"kq-note\">Câu thuộc item set (câu 55–58). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Collier&#x27;s supervisors would probably not want to use the results from the trend model for all of the following reasons EXCEPT:<\/p><\/div>", "subj": "quant"}, {"n": 56, "q": "For this question only, assume that Winston also ran an AR(1) model with the following results: yₜ = −0.9 − 0.23* yt −1 + eₜ R-squared = 78.3% (0.823) (0.0222) The mean reverting level of this model is closest to:", "opts": ["1.16.", "−0.73.", "0.77."], "ans": "B", "expl": "The mean reverting level is X₁ = bₒ/(1 − b₁) X₁ = −0.9/[1 − (−0.23)] = −0.73", "explhtml": "<p>The mean reverting level is X<sub>1<\/sub> = b<sub>o<\/sub>/(1 − b<sub>1<\/sub>)<\/p><p>X<sub>1<\/sub> = −0.9/[1 − (−0.23)] = −0.73<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 55–58<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>For this question only, assume that Winston also ran an AR(1) model with the following results:<\/p><p>y<sub>t<\/sub> = −0.9 − 0.23* y<sub>t −1<\/sub> + e<sub>t<\/sub><\/p><p>R-squared = 78.3%<\/p><p>(0.823) (0.0222)<\/p><p>The mean reverting level of this model is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 57, "q": "Based on the autoregressive model, expected warranty expense in the first quarter of 2005 will be closest to:", "opts": ["$51 million.", "$60 million.", "$65 million."], "ans": "C", "expl": "Substituting the 1-period lagged data from 2004.4 and the 4-period lagged data from 2004.1 into the model formula, change in warranty expense is predicted to be higher than 2004.4. 11.73 = –0.7 – 0.07*24 + 0.83*17. The expected warranty expense is (53 + 11.73) = $64.73 million.", "explhtml": "<p>Substituting the 1-period lagged data from 2004.4 and the 4-period lagged data from 2004.1 into the model formula, change in warranty expense is predicted to be higher than 2004.4.<\/p><p>11.73 = –0.7 – 0.07*24 + 0.83*17.<\/p><p>The expected warranty expense is (53 + 11.73) = $64.73 million.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 55–58<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>Based on the autoregressive model, expected warranty expense in the first quarter of 2005 will be closest to:<\/p><\/div>", "subj": "quant"}, {"n": 58, "q": "Based on the results, is there a seasonality component in the data?", "opts": ["Yes, because the coefficient on yt–4 is large compared to its standard error.", "Yes, because the coefficient on yₜ is small compared to its standard error.", "No, because the slope coefficients in the autoregressive model have opposite signs."], "ans": "A", "expl": "The coefficient on the 4th lag tests the seasonality component. The t-statistic is equal to 0.83/0.0186 = 44.62, which is greater than the critical t-value (5% LOS, 2-tailed, dof = 4) = 2.78", "explhtml": "<p>The coefficient on the 4<sup>th<\/sup> lag tests the seasonality component.<\/p><p>The t-statistic is equal to 0.83/0.0186 = 44.62, which is greater than the critical t-value (5% LOS, 2-tailed, dof = 4) = 2.78<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 55–58<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>Based on the results, is there a seasonality component in the data?<\/p><\/div>", "subj": "quant"}, {"n": 59, "q": "The value for WPM this period is 544 billion. Using the results of the model, the forecast Wireless Phone Minutes three periods in the future is:", "opts": ["691.30.", "586.35.", "683.18."], "ans": "C", "expl": "The one-period forecast is −8.023 + (1.0926 × 544) = 586.35. The two-period forecast is then −8.023 + (1.0926 × 586.35) = 632.62. Finally, the three-period forecast is −8.023 + (1.0926 × 632.62) = 683.18.", "explhtml": "<p>The one-period forecast is −8.023 + (1.0926 × 544) = 586.35.<\/p><p>The two-period forecast is then −8.023 + (1.0926 × 586.35) = 632.62.<\/p><p>Finally, the three-period forecast is −8.023 + (1.0926 × 632.62) = 683.18.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 59–62<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 59–62). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The value for WPM this period is 544 billion. Using the results of the model, the forecast Wireless Phone Minutes three periods in the future is:<\/p><\/div>", "subj": "quant"}, {"n": 60, "q": "The WPM model was specified as a(n):", "opts": ["Moving Average (MA) Model.", "Autoregressive (AR) Model.", "Autoregressive (AR) Model with a seasonal lag."], "ans": "B", "expl": "The model is specified as an AR Model, but there is no seasonal lag. No moving averages are employed in the estimation of the model.", "explhtml": "<p>The model is specified as an AR Model, but there is no seasonal lag. No moving averages are employed in the estimation of the model.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 59–62<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>The WPM model was specified as a(n):<\/p><\/div>", "subj": "quant"}, {"n": 61, "q": "The mean reverting level of monthly sales is closest to:", "opts": ["381.29 million.", "8.83 million.", "43.2 million."], "ans": "A", "expl": "b₀  43.2 | MRL =    =    = 381.29 million 1 − 0.8867 1 − b₁", "explhtml": "<div class=\"tbl\"><table><tr><td>b<sub>0<\/sub><\/td><td>43.2<\/td><\/tr><tr><td>MRL = <\/td><td> = <\/td><td> = 381.29 million<\/td><\/tr><\/table><\/div><p>1 − 0.8867<\/p><p>1 − b<sub>1<\/sub><\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 59–62<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>The mean reverting level of monthly sales is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 62, "q": "Morris concludes that the current price of Car-tel stock is consistent with single stage constant growth model (with g=3%). Based on this information, the sales model is most likely:", "opts": ["Incorrectly specified and first differencing the data would be an appropriate remedy.", "Correctly specified.", "Incorrectly specified and first differencing the natural log of the data would be an appropriate remedy."], "ans": "C", "expl": "If constant growth rate is an appropriate model for Car-tel, its dividends (as well as earnings and revenues) will grow at a constant rate. In such a case, the time series needs to be adjusted by taking the natural log of the time series. Taking the natural log of the time series would lead to a series that exhibits a constant amount of growth (and still not stationary). The final step would be to first difference the transformed series to make it covariance stationary. First differencing would remove the trending component of a covariance non-stationary time series but would not be appropriate for transforming an exponentially growing time series.", "explhtml": "<p>If constant growth rate is an appropriate model for Car-tel, its dividends (as well as earnings and revenues) will grow at a constant rate. In such a case, the time series needs to be adjusted by taking the natural log of the time series. Taking the natural log of the time series would lead to a series that exhibits a constant amount of growth (and still not stationary). The final step would be to first difference the transformed series to make it covariance stationary. First differencing would remove the trending component of a covariance non-stationary time series but would not be appropriate for transforming an exponentially growing time series.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 59–62<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>Morris concludes that the current price of Car-tel stock is consistent with single stage constant growth model (with g=3%). Based on this information, the sales model is most likely:<\/p><\/div>", "subj": "quant"}, {"n": 63, "q": "The procedure for determining the structure of an autoregressive model is:", "opts": ["test autocorrelations of the residuals for a simple trend model, and specify the number of significant lags.", "estimate an autoregressive model (for example, an AR(1) model), calculate the autocorrelations for the model's residuals, test whether the autocorrelations are different from zero, and add an AR lag for each significant autocorrelation.", "estimate an autoregressive model (e.g., an AR(1) model), calculate the autocorrelations for the model's residuals, test whether the autocorrelations are different from zero, and revise the model if there are significant autocorrelations."], "ans": "C", "expl": "The procedure is iterative: continually test for autocorrelations in the residuals and stop adding lags when the autocorrelations of the residuals are eliminated. Even if several of the residuals exhibit autocorrelation, the lags should be added one at a time.", "explhtml": "<p>The procedure is iterative: continually test for autocorrelations in the residuals and stop adding lags when the autocorrelations of the residuals are eliminated. Even if several of the residuals exhibit autocorrelation, the lags should be added one at a time.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.e<\/div><div class=\"qtext\"><p>The procedure for determining the structure of an autoregressive model is:<\/p><\/div>", "subj": "quant"}, {"n": 64, "q": "David Brice, CFA, has used an AR(1) model to forecast the next period's interest rate to be 0.08. The AR(1) has a positive slope coefficient. If the interest rate is a mean reverting process with an unconditional mean, a.k.a., mean reverting level, equal to 0.09, then which of the following could be his forecast for two periods ahead?", "opts": ["0.113.", "0.072.", "0.081."], "ans": "C", "expl": "As Brice makes more distant forecasts, each forecast will be closer to the unconditional mean. So, the two period forecast would be between 0.08 and 0.09, and 0.081 is the only possible answer.", "explhtml": "<p>As Brice makes more distant forecasts, each forecast will be closer to the unconditional mean. So, the two period forecast would be between 0.08 and 0.09, and 0.081 is the only possible answer.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.f<\/div><div class=\"qtext\"><p>David Brice, CFA, has used an AR(1) model to forecast the next period&#x27;s interest rate to be 0.08. The AR(1) has a positive slope coefficient. If the interest rate is a mean reverting process with an unconditional mean, a.k.a., mean reverting level, equal to 0.09, then which of the following could be his forecast for two periods ahead?<\/p><\/div>", "subj": "quant"}, {"n": 65, "q": "Consider the estimated AR(2) model, xₜ = 2.5 + 3.0 xₜ₋₁ + 1.5 xₜ₋₂ + εₜ t=1,2,...50. Making a prediction for values of x for 1 ≤ t ≤ 50 is referred to as:", "opts": ["an out-of-sample forecast.", "an in-sample forecast.", "requires more information to answer the question."], "ans": "B", "expl": "An in-sample (a.k.a. within-sample) forecast is made within the bounds of the data used to estimate the model. An out-of-sample forecast is for values of the independent variable that are outside of those used to estimate the model.", "explhtml": "<p>An in-sample (a.k.a. within-sample) forecast is made within the bounds of the data used to estimate the model. An out-of-sample forecast is for values of the independent variable that are outside of those used to estimate the model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.g<\/div><div class=\"qtext\"><p>Consider the estimated AR(2) model, x<sub>t<\/sub> = 2.5 + 3.0 x<sub>t-1<\/sub> + 1.5 x<sub>t-2<\/sub> + ε<sub>t<\/sub> t=1,2,...50. Making a<\/p><p>prediction for values of x for 1 ≤ t ≤ 50 is referred to as:<\/p><\/div>", "subj": "quant"}, {"n": 66, "q": "Which of the following is a seasonally adjusted model?", "opts": ["(Salesₜ - Sales ₜ₋₁)= b₀ + b₁ (Sales ₜ₋₁ - Sales ₜ₋₂) + b₂ (Sales ₜ₋₄ - Sales ₜ₋₅) + εₜ.", "Salesₜ = b₁ Sales ₜ₋₁+ εₜ.", "Salesₜ = b₀ + b₁ Sales ₜ₋₁ + b₂ Sales ₜ₋₂ + εₜ."], "ans": "A", "expl": "This model is a seasonal AR with first differencing.", "explhtml": "<p>This model is a seasonal AR with first differencing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.4, LOS 2.l<\/div><div class=\"qtext\"><p>Which of the following is a seasonally adjusted model?<\/p><\/div>", "subj": "quant"}, {"n": 67, "q": "Consider the estimated model xₜ = -6.0 + 1.1 xₜ₋₁ + 0.3 xₜ₋₂ + εₜ that is estimated over 50 periods. The value of the time series for the 49th observation is 20 and the value of the time series for the 50th observation is 22. What is the forecast for the 51st observation?", "opts": ["30.2.", "23.", "24.2."], "ans": "C", "expl": "Forecasted x₅₁ = -6.0 + 1.1 (22) + 0.3 (20) = 24.2.", "explhtml": "<p>Forecasted x<sub>51<\/sub> = -6.0 + 1.1 (22) + 0.3 (20) = 24.2.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>Consider the estimated model x<sub>t<\/sub> = -6.0 + 1.1 x<sub>t-1<\/sub> + 0.3 x<sub>t-2<\/sub> + ε<sub>t<\/sub> that is estimated over 50 periods.<\/p><p>The value of the time series for the 49<sup>th<\/sup> observation is 20 and the value of the time series for the 50<sup>th<\/sup> observation is 22. What is the forecast for the 51<sup>st<\/sup> observation?<\/p><\/div>", "subj": "quant"}, {"n": 68, "q": "To qualify as a covariance stationary process, which of the following does not have to be true?", "opts": ["Covariance(xₜ, xₜ₋₁) = Covariance(xₜ, xₜ₋₂).", "Covariance(xₜ, xₜ₋₂) = Covariance(xₜ, xₜ₊₂).", "E[xₜ] = E[xₜ₊₁]."], "ans": "A", "expl": "If a series is covariance stationary then the unconditional mean is constant across periods. The unconditional mean or expected value is the same from period to period: E[xₜ] = E[xₜ₊₁]. The covariance between any two observations equal distance apart will be equal, e.g., the t and t-2 observations with the t and t+2 observations. The one relationship that does not have to be true is the covariance between the t and t-1 observations equaling that of the t and t-2 observations.", "explhtml": "<p>If a series is covariance stationary then the unconditional mean is constant across periods. The unconditional mean or expected value is the same from period to period: E[x<sub>t<\/sub>] = E[x<sub>t+1<\/sub>]. The covariance between any two observations equal distance apart will be equal, e.g., the t and t-2 observations with the t and t+2 observations. The one relationship that does not have to be true is the covariance between the t and t-1 observations equaling that of the t and t-2 observations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.c<\/div><div class=\"qtext\"><p>To qualify as a covariance stationary process, which of the following does not have to be true?<\/p><\/div>", "subj": "quant"}, {"n": 69, "q": "Alexis Popov, CFA, wants to estimate how sales have grown from one quarter to the next on average. The most direct way for Popov to estimate this would be:", "opts": ["a linear trend model.", "an AR(1) model.", "an AR(1) model with a seasonal lag."], "ans": "A", "expl": "If the goal is to simply estimate the dollar change from one period to the next, the most direct way is to estimate xₜ = b₀ + b₁ × (Trend) + eₜ, where Trend is simply 1, 2, 3, ....T. The model predicts a change by the value b₁ from one period to the next.", "explhtml": "<p>If the goal is to simply estimate the dollar change from one period to the next, the most direct way is to estimate x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub> × (Trend) + e<sub>t<\/sub>, where Trend is simply 1, 2, 3, ....T. The model predicts a change by the value b<sub>1<\/sub> from one period to the next.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.5, LOS 2.o<\/div><div class=\"qtext\"><p>Alexis Popov, CFA, wants to estimate how sales have grown from one quarter to the next on average. The most direct way for Popov to estimate this would be:<\/p><\/div>", "subj": "quant"}, {"n": 70, "q": "In the time series model: yₜ=b₀ + b₁ t + εₜ, t=1,2,...,T, the:", "opts": ["change in the dependent variable per time period is b₁.", "disturbance term is mean-reverting.", "disturbance terms are autocorrelated."], "ans": "A", "expl": "The slope is the change in the dependent variable per unit of time. The intercept is the estimate of the value of the dependent variable before the time series begins. The disturbance term should be independent and identically distributed. There is no reason to expect the disturbance term to be mean-reverting, and if the residuals are autocorrelated, the research should correct for that problem.", "explhtml": "<p>The slope is the change in the dependent variable per unit of time. The intercept is the estimate of the value of the dependent variable before the time series begins. The disturbance term should be independent and identically distributed. There is no reason to expect the disturbance term to be mean-reverting, and if the residuals are autocorrelated, the research should correct for that problem.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.1, LOS 2.a<\/div><div class=\"qtext\"><p>In the time series model: y<sub>t<\/sub>=b<sub>0<\/sub> + b<sub>1<\/sub> t + ε<sub>t<\/sub>, t=1,2,...,T, the:<\/p><\/div>", "subj": "quant"}, {"n": 71, "q": "The table below includes the first eight residual autocorrelations from fitting the first differenced time series of the absenteeism rates (ABS) at a manufacturing firm with the model ΔABSₜ = b₀ + b₁ΔABSₜ₋₁ + εₜ. Based on the results in the table, which of the following statements most accurately describes the appropriateness of the specification of the model, ΔABSₜ = b₀ + b₁ΔABSₜ₋₁ + εₜ? Lagged Autocorrelations of the Residuals of the First Differences in Absenteeism Rates    Lag Autocorrelation Standard Error t-Statistic 1 −0.0738 0.1667 −0.44271 2 −0.1047 0.1667 −0.62807 3 −0.0252 0.1667 −0.15117 4 −0.0157 0.1667 −0.09418 5 −0.1262 0.1667 −0.75705 6 0.0768 0.1667 0.46071 7 0.0038 0.1667 0.02280 8 −0.0188 0.1667 −0.11278", "opts": ["The Durbin-Watson statistic is needed to determine the presence of significant correlation of the residuals.", "The negative values for the autocorrelations indicate that the model does not fit the time series.", "The low values for the t-statistics indicate that the model fits the time series."], "ans": "C", "expl": "The t-statistics are all very small, indicating that none of the autocorrelations are significantly different than zero. Based on these results, the model appears to be appropriately specified. The error terms, however, should still be checked for heteroskedasticity.", "explhtml": "<p>The t-statistics are all very small, indicating that none of the autocorrelations are significantly different than zero. Based on these results, the model appears to be appropriately specified. The error terms, however, should still be checked for heteroskedasticity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.e<\/div><div class=\"qtext\"><p>The table below includes the first eight residual autocorrelations from fitting the first differenced time series of the absenteeism rates (ABS) at a manufacturing firm with the model ΔABS<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>ΔABS<sub>t-1<\/sub> + ε<sub>t<\/sub>. Based on the results in the table, which of the following statements<\/p><p>most accurately describes the appropriateness of the specification of the model, ΔABS<sub>t<\/sub> = b<sub>0<\/sub> +<\/p><p>b<sub>1<\/sub>ΔABS<sub>t-1<\/sub> + ε<sub>t<\/sub>?<\/p><div class=\"tbl\"><table><tr><td colspan=4>Lagged Autocorrelations of the Residuals of the First Differences in Absenteeism Rates<\/td><\/tr><tr><td>Lag<\/td><td>Autocorrelation<\/td><td>Standard Error<\/td><td>t-Statistic<\/td><\/tr><tr><td>1<\/td><td>−0.0738<\/td><td>0.1667<\/td><td>−0.44271<\/td><\/tr><tr><td>2<\/td><td>−0.1047<\/td><td>0.1667<\/td><td>−0.62807<\/td><\/tr><tr><td>3<\/td><td>−0.0252<\/td><td>0.1667<\/td><td>−0.15117<\/td><\/tr><tr><td>4<\/td><td>−0.0157<\/td><td>0.1667<\/td><td>−0.09418<\/td><\/tr><tr><td>5<\/td><td>−0.1262<\/td><td>0.1667<\/td><td>−0.75705<\/td><\/tr><tr><td>6<\/td><td>0.0768<\/td><td>0.1667<\/td><td>0.46071<\/td><\/tr><tr><td>7<\/td><td>0.0038<\/td><td>0.1667<\/td><td>0.02280<\/td><\/tr><tr><td>8<\/td><td>−0.0188<\/td><td>0.1667<\/td><td>−0.11278<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 72, "q": "Troy Dillard, CFA, has estimated the following equation using quarterly data: xₜ = 93 - 0.5×xt– 1 + 0.1×xt– 4 + eₜ. Given the data in the table below, what is Dillard's best estimate of the first quarter of 2007? Time Value 2005: I 62 2005: II 62 2005: III 66 2005: IV 66 2006: I 72 2006: II 70 2006: III 64 2006: IV 66", "opts": ["67.20.", "66.40.", "66.60."], "ans": "A", "expl": "To get the answer, Dillard will use the data for 2006: IV and 2006: I, xt– 1 = 66 and xt– 4 = 72 respectively: E[x2007:I] = 93– 0.5×xt– 1 + 0.1×xt– 4 E[x2007:I] = 93– 0.5×66 + 0.1×72 E[x2007:I] = 67.20", "explhtml": "<p>To get the answer, Dillard will use the data for 2006: IV and 2006: I, x<sub>t– 1<\/sub> = 66 and x<sub>t– 4<\/sub> = 72 respectively:<\/p><p>E[x2007:I] = 93– 0.5×x<sub>t– 1<\/sub> + 0.1×x<sub>t– 4<\/sub><\/p><p>E[x2007:I] = 93– 0.5×66 + 0.1×72<\/p><p>E[x2007:I] = 67.20<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>Troy Dillard, CFA, has estimated the following equation using quarterly data: x<sub>t<\/sub> = 93 - 0.5×x<sub>t– 1<\/sub> +<\/p><p>0.1×x<sub>t– 4<\/sub> + e<sub>t<\/sub>. Given the data in the table below, what is Dillard&#x27;s best estimate of the first<\/p><p>quarter of 2007?<\/p><div class=\"tbl\"><table><tr><td>Time<\/td><td>Value<\/td><\/tr><tr><td>2005: I<\/td><td>62<\/td><\/tr><tr><td>2005: II<\/td><td>62<\/td><\/tr><tr><td>2005: III<\/td><td>66<\/td><\/tr><tr><td>2005: IV<\/td><td>66<\/td><\/tr><tr><td>2006: I<\/td><td>72<\/td><\/tr><tr><td>2006: II<\/td><td>70<\/td><\/tr><tr><td>2006: III<\/td><td>64<\/td><\/tr><tr><td>2006: IV<\/td><td>66<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 73, "q": "Which of the following statements regarding an out-of-sample forecast is least accurate?", "opts": ["There is more error associated with out-of-sample forecasts, as compared to insample forecasts.", "Out-of-sample forecasts are of more importance than in-sample forecasts to the analyst using an estimated time-series model.", "Forecasting is not possible for autoregressive models with more than two lags."], "ans": "C", "expl": "Forecasts in autoregressive models are made using the chain-rule, such that the earlier forecasts are made first. Each later forecast depends on these earlier forecasts.", "explhtml": "<p>Forecasts in autoregressive models are made using the chain-rule, such that the earlier forecasts are made first. Each later forecast depends on these earlier forecasts.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.g<\/div><div class=\"qtext\"><p>Which of the following statements regarding an out-of-sample forecast is least accurate?<\/p><\/div>", "subj": "quant"}, {"n": 74, "q": "The model xₜ = b₀ + b₁ xt − 1 + b₂ xt − 2 + b₃ xt −12 + εₜ is an autoregressive model of type:", "opts": ["AR(2).", "AR(1).", "AR(12)."], "ans": "A", "expl": "The b₁xt − 1 and b₂xt − 2 lag terms make this an autoregressive model of order p = 2 with a seasonal lag. The b₃xt −12 term is a seasonal term which does not transform the model to AR(12).", "explhtml": "<p>The b<sub>1<\/sub>x<sub>t − 1<\/sub> and b<sub>2<\/sub>x<sub>t − 2<\/sub> lag terms make this an autoregressive model of order p = 2 with a seasonal lag. The b<sub>3<\/sub>x<sub>t −12<\/sub> term is a seasonal term which does not transform the model to AR(12).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>The model x<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub> x<sub>t − 1<\/sub> + b<sub>2<\/sub> x<sub>t − 2<\/sub> + b<sub>3<\/sub> x<sub>t −12<\/sub> + ε<sub>t<\/sub> is an autoregressive model of type:<\/p><\/div>", "subj": "quant"}, {"n": 75, "q": "The most appropriate interpretation from the foreclosure share regression equation model is:", "opts": ["Multiple-R of the model is 0.87.", "Variable STIM explains 37.5% of the variation in foreclosure share.", "Multiple-R of the model is 0.75."], "ans": "A", "expl": "R² = RSS/SST = 15/20 = 0.75 Multiple-R = (0.75)0.50 = 0.87. Correct interpretation of the coefficient of determination is that all the independent variables (ΔINT, STIM, CRISIS) collectively help explain 75% of the variation in the independent variable (Foreclosure Share).", "explhtml": "<p>R<sup>2<\/sup> = RSS/SST = 15/20 = 0.75<\/p><p>Multiple-R = (0.75)<sup>0.50<\/sup> = 0.87.<\/p><p>Correct interpretation of the coefficient of determination is that all the independent variables (ΔINT, STIM, CRISIS) collectively help explain 75% of the variation in the independent variable (Foreclosure Share).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 75–79<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 75–79). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The most appropriate interpretation from the foreclosure share regression equation model is:<\/p><\/div>", "subj": "quant"}, {"n": 76, "q": "Based on her regression results in Exhibit 2, using a 5% level of significance, Smith should conclude that:", "opts": ["stimulus packages do not have significant effects on foreclosure percentages, but housing crises do have significant effects on foreclosure percentages.", "both stimulus packages and housing crises have significant effects on foreclosure percentages.", "stimulus packages have significant effects on foreclosure percentages, but housing crises do not have significant effects on foreclosure percentages."], "ans": "A", "expl": "The appropriate test statistic for tests of significance on individual slope coefficient estimates is the t-statistic, which is provided in Exhibit 2 for each regression coefficient estimate. The reported t-statistic equals -2.10 for the STIM slope estimate and equals 2.35 for the CRISIS slope estimate. The critical t-statistic for the 5% significance level equals 2.12 (16 degrees of freedom, 5% level of significance). Therefore, the slope estimate for STIM is not statistically significant (the reported t-statistic, -2.10, is not large enough). In contrast, the slope estimate for CRISIS is statistically significant (the reported t-statistic, 2.35, exceeds the 5% significance level critical value).", "explhtml": "<p>The appropriate test statistic for tests of significance on individual slope coefficient estimates is the t-statistic, which is provided in Exhibit 2 for each regression coefficient estimate. The reported t-statistic equals -2.10 for the STIM slope estimate and equals 2.35 for the CRISIS slope estimate. The critical t-statistic for the 5% significance level equals 2.12 (16 degrees of freedom, 5% level of significance).<\/p><p>Therefore, the slope estimate for STIM is not statistically significant (the reported t-statistic, -2.10, is not large enough). In contrast, the slope estimate for CRISIS is statistically significant (the reported t-statistic, 2.35, exceeds the 5% significance level critical value).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 75–79<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>Based on her regression results in Exhibit 2, using a 5% level of significance, Smith should conclude that:<\/p><\/div>", "subj": "quant"}, {"n": 77, "q": "Is Smith correct or incorrect regarding Concerns 1 and 2?", "opts": ["Only correct on one concern and incorrect on the other.", "Correct on both Concerns.", "Incorrect on both Concerns."], "ans": "C", "expl": "Smith's Concern 1 is incorrect. Heteroskedasticity is a violation of a regression assumption, and refers to regression error variance that is not constant over all observations in the regression. Conditional heteroskedasticity is a case in which the error variance is related to the magnitudes of the independent variables (the error variance is \"conditional\" on the independent variables). The consequence of conditional heteroskedasticity is that the standard errors will be too low, which, in turn, causes the t-statistics to be too high. Smith's Concern 2 also is not correct. Multicollinearity refers to independent variables that are correlated with each other. Multicollinearity causes standard errors for the regression coefficients to be too high, which, in turn, causes the t-statistics to be too low. However, contrary to Smith's concern, multicollinearity has no effect on the F-statistic.", "explhtml": "<p>Smith&#x27;s Concern 1 is incorrect. Heteroskedasticity is a violation of a regression assumption, and refers to regression error variance that is not constant over all observations in the regression. Conditional heteroskedasticity is a case in which the error variance is related to the magnitudes of the independent variables (the error variance is &quot;conditional&quot; on the independent variables). The consequence of conditional heteroskedasticity is that the standard errors will be too low, which, in turn, causes the t-statistics to be too high. Smith&#x27;s Concern 2 also is not correct. Multicollinearity refers to independent variables that are correlated with each other. Multicollinearity causes standard errors for the regression coefficients to be too high, which, in turn, causes the t-statistics to be too low. However, contrary to Smith&#x27;s concern, multicollinearity has no effect on the F-statistic.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 75–79<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>Is Smith correct or incorrect regarding Concerns 1 and 2?<\/p><\/div>", "subj": "quant"}, {"n": 78, "q": "The most recent change in foreclosure share was +1 percent. Smith decides to base her analysis on the data and methods provided in Exhibit 4 and Exhibit 5, and determines that the two-step ahead forecast for the change in foreclosure share (in percent) is 0.125, and that the mean reverting value for the change in foreclosure share (in percent) is 0.071. Is Smith correct?", "opts": ["Smith is correct on the two-step ahead forecast for change in foreclosure share only.", "Smith is correct on the mean-reverting level for forecast of change in foreclosure share only.", "Smith is correct on both the forecast and the mean reverting level."], "ans": "A", "expl": "Forecasts are derived by substituting the appropriate value for the period t-1 lagged value. ΔForeclosure Shareₜ = 0.05 + 0.25(ΔForeclosure Shareₜ₋₁) = 0.05 + 0.25(1) = 0.30 So, the one-step ahead forecast equals 0.30%. The two-step ahead (%) forecast is derived by substituting 0.30 into the equation. ΔForeclosure Shareₜ₊₁ = 0.05 + 0.25(0.30) = 0.125 Therefore, the two-step ahead forecast equals 0.125%. b₀  0.05 | mean reverting level =    =    = 0.067 (1 - 0.25) (1 - b₁)", "explhtml": "<p>Forecasts are derived by substituting the appropriate value for the period t-1 lagged value.<\/p><p>ΔForeclosure Share<sub>t<\/sub> = 0.05 + 0.25(ΔForeclosure Share<sub>t-1<\/sub>)<\/p><p>= 0.05 + 0.25(1) = 0.30<\/p><p>So, the one-step ahead forecast equals 0.30%. The two-step ahead (%) forecast is derived by substituting 0.30 into the equation.<\/p><p>ΔForeclosure Share<sub>t+1<\/sub> = 0.05 + 0.25(0.30) = 0.125<\/p><p>Therefore, the two-step ahead forecast equals 0.125%.<\/p><div class=\"tbl\"><table><tr><td>b<sub>0<\/sub><\/td><td>0.05<\/td><\/tr><tr><td>mean reverting level = <\/td><td> = <\/td><td> = 0.067<\/td><\/tr><\/table><\/div><p>(1 - 0.25)<\/p><p>(1 - b<sub>1<\/sub>)<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 75–79<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>The most recent change in foreclosure share was +1 percent. Smith decides to base her analysis on the data and methods provided in Exhibit 4 and Exhibit 5, and determines that the two-step ahead forecast for the change in foreclosure share (in percent) is 0.125, and that the mean reverting value for the change in foreclosure share (in percent) is 0.071. Is Smith correct?<\/p><\/div>", "subj": "quant"}, {"n": 79, "q": "Assume for this question that Smith finds that the foreclosure share series has a unit root. Under these conditions, she can most reliably regress foreclosure share against the change in interest rates (ΔINT) if:", "opts": ["ΔINT has unit root and is not cointegrated with foreclosure share.", "ΔINT does not have unit root.", "ΔINT has unit root and is cointegrated with foreclosure share."], "ans": "C", "expl": "The error terms in the regressions for choices A, B, and C will be nonstationary. Therefore, some of the regression assumptions will be violated and the regression results are unreliable. If, however, both series are nonstationary (which will happen if each has unit root), but cointegrated, then the error term will be covariance stationary and the regression results are reliable.", "explhtml": "<p>The error terms in the regressions for choices A, B, and C will be nonstationary. Therefore, some of the regression assumptions will be violated and the regression results are unreliable. If, however, both series are nonstationary (which will happen if each has unit root), but cointegrated, then the error term will be covariance stationary and the regression results are reliable.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 75–79<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.k<\/div><div class=\"qtext\"><p>Assume for this question that Smith finds that the foreclosure share series has a unit root. Under these conditions, she can most reliably regress foreclosure share against the change in interest rates (ΔINT) if:<\/p><\/div>", "subj": "quant"}, {"n": 80, "q": "Suppose that the following time-series model is found to have a unit root: Salesₜ = b₀ + b₁ Sales ₜ₋₁+ εₜ What is the specification of the model if first differences are used?", "opts": ["Salesₜ = b₀ + b₁ Sales ₜ₋₁ + b₂ Sales ₜ₋₂ + εₜ.", "Salesₜ = b₁ Sales ₜ₋₁+ εₜ.", "(Salesₜ - Salesₜ₋₁)= b₀ + b₁ (Sales ₜ₋₁ - Sales ₜ₋₂) + εₜ."], "ans": "C", "expl": "Estimation with first differences requires calculating the change in the variable from period to period.", "explhtml": "<p>Estimation with first differences requires calculating the change in the variable from period to period.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.j<\/div><div class=\"qtext\"><p>Suppose that the following time-series model is found to have a unit root:<\/p><p>Sales<sub>t<\/sub> = b<sub>0<\/sub> + b<sub>1 <\/sub>Sales <sub>t-1<\/sub>+ ε<sub>t<\/sub><\/p><p>What is the specification of the model if first differences are used?<\/p><\/div>", "subj": "quant"}, {"n": 81, "q": "A monthly time series of changes in maintenance expenses (ΔExp) for an equipment rental company was fit to an AR(1) model over 100 months. The results of the regression and the first twelve lagged residual autocorrelations are shown in the tables below. Based on the information in these tables, does the model appear to be appropriately specified? (Assume a 5% level of significance.) Regression Results for Maintenance Expense Changes     Model: DExpt = b0 + b1DExpt–1 + et      Coefficients Standard Error t-Statistic p-value Intercept 1.3304 0.0089 112.2849 < 0.0001 Lag-1 0.1817 0.0061 30.0125 < 0.0001 Lagged Residual Autocorrelations for Maintenance Expense Changes      Lag Autocorrelation t-Statistic Lag Autocorrelation t-Statistic 1 −0.239 −2.39 7 −0.018 −0.18 2 −0.278 −2.78 8 −0.033 −0.33 3 −0.045 −0.45 9 0.261 2.61 4 −0.033 −0.33 10 −0.060 −0.60 5 −0.180 −1.80 11 0.212 2.12 6 −0.110 −1.10 12 0.022 0.22", "opts": ["No, because several of the residual autocorrelations are significant.", "Yes, because the intercept and the lag coefficient are significant.", "Yes, because most of the residual autocorrelations are negative."], "ans": "A", "expl": "At a 5% level of significance, the critical t-value is 1.98. Since the absolute values of several of the residual autocorrelation's t-statistics exceed 1.98, it can be concluded that significant serial correlation exists and the model should be respecified. The next logical step is to estimate an AR(2) model, then test the associated residuals for autocorrelation. If no serial correlation is detected, seasonality and ARCH behavior should be tested.", "explhtml": "<p>At a 5% level of significance, the critical t-value is 1.98. Since the absolute values of several of the residual autocorrelation&#x27;s t-statistics exceed 1.98, it can be concluded that significant serial correlation exists and the model should be respecified. The next logical step is to estimate an AR(2) model, then test the associated residuals for autocorrelation. If no serial correlation is detected, seasonality and ARCH behavior should be tested.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.e<\/div><div class=\"qtext\"><p>A monthly time series of changes in maintenance expenses (ΔExp) for an equipment rental company was fit to an AR(1) model over 100 months. The results of the regression and the first twelve lagged residual autocorrelations are shown in the tables below. Based on the information in these tables, does the model appear to be appropriately specified? (Assume a 5% level of significance.)<\/p><div class=\"tbl\"><table><tr><td colspan=5>Regression Results for Maintenance Expense Changes<\/td><\/tr><tr><td colspan=5>Model: DExpt = b0 + b1DExpt–1 + et<\/td><\/tr><tr><td><\/td><td>Coefficients<\/td><td>Standard Error<\/td><td>t-Statistic<\/td><td>p-value<\/td><\/tr><tr><td>Intercept<\/td><td>1.3304<\/td><td>0.0089<\/td><td>112.2849<\/td><td>&lt; 0.0001<\/td><\/tr><tr><td>Lag-1<\/td><td>0.1817<\/td><td>0.0061<\/td><td>30.0125<\/td><td>&lt; 0.0001<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td colspan=6>Lagged Residual Autocorrelations for Maintenance Expense Changes<\/td><\/tr><tr><td>Lag<\/td><td>Autocorrelation<\/td><td>t-Statistic<\/td><td>Lag<\/td><td>Autocorrelation<\/td><td>t-Statistic<\/td><\/tr><tr><td>1<\/td><td>−0.239<\/td><td>−2.39<\/td><td>7<\/td><td>−0.018<\/td><td>−0.18<\/td><\/tr><tr><td>2<\/td><td>−0.278<\/td><td>−2.78<\/td><td>8<\/td><td>−0.033<\/td><td>−0.33<\/td><\/tr><tr><td>3<\/td><td>−0.045<\/td><td>−0.45<\/td><td>9<\/td><td>0.261<\/td><td>2.61<\/td><\/tr><tr><td>4<\/td><td>−0.033<\/td><td>−0.33<\/td><td>10<\/td><td>−0.060<\/td><td>−0.60<\/td><\/tr><tr><td>5<\/td><td>−0.180<\/td><td>−1.80<\/td><td>11<\/td><td>0.212<\/td><td>2.12<\/td><\/tr><tr><td>6<\/td><td>−0.110<\/td><td>−1.10<\/td><td>12<\/td><td>0.022<\/td><td>0.22<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 82, "q": "An analyst modeled the time series of annual earnings per share in the specialty department store industry as an AR(3) process. Upon examination of the residuals from this model, she found that there is a significant autocorrelation for the residuals of this model. This indicates that she needs to:", "opts": ["switch models to a moving average model.", "revise the model to include at least another lag of the dependent variable.", "alter the model to an ARCH model."], "ans": "B", "expl": "She should estimate an AR(4) model, and then re-examine the autocorrelations of the residuals.", "explhtml": "<p>She should estimate an AR(4) model, and then re-examine the autocorrelations of the residuals.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.e<\/div><div class=\"qtext\"><p>An analyst modeled the time series of annual earnings per share in the specialty department store industry as an AR(3) process. Upon examination of the residuals from this model, she found that there is a significant autocorrelation for the residuals of this model. This indicates that she needs to:<\/p><\/div>", "subj": "quant"}, {"n": 83, "q": "The table below shows the autocorrelations of the lagged residuals for the first differences of the natural logarithm of quarterly motorcycle sales that were fit to the AR(1) model: (ln salesₜ − ln salest − 1) = b₀ + b₁(ln salest − 1 − ln salest − 2) + εₜ. The critical t-statistic at 5% significance is 2.0, which means that there is significant autocorrelation for the lag-4 residual, indicating the presence of seasonality. Assuming the time series is covariance stationary, which of the following models is most likely to CORRECT for this apparent seasonality? Lagged Autocorrelations of First Differences in the Log of Motorcycle Sales    Lag Autocorrelation Standard Error t-Statistic 1 −0.0738 0.1667 −0.44271 2 −0.1047 0.1667 −0.62807 3 −0.0252 0.1667 −0.15117 4 0.5528 0.1667 3.31614", "opts": ["ln salesₜ = b₀ + b₁(ln salest − 1) − b₂(ln salest − 4) + εₜ.", "(ln salesₜ − ln salest − 1) = b₀ + b₁(ln salest − 1 − ln salest − 2) + b₂(ln salest − 4 − ln salest − 5) + εₜ.", "(ln salesₜ − ln salest − 4) = b₀ + b₁(ln salest − 1 − ln salest − 2) + εₜ."], "ans": "B", "expl": "Seasonality is taken into account in an autoregressive model by adding a seasonal lag variable that corresponds to the seasonality. In the case of a first-differenced quarterly time series, the seasonal lag variable is the first difference for the fourth time period. Recognizing that the model is fit to the first differences of the natural logarithm of the time series, the seasonal adjustment variable is (ln salest − 4 − ln salest − 5).", "explhtml": "<p>Seasonality is taken into account in an autoregressive model by adding a seasonal lag variable that corresponds to the seasonality. In the case of a first-differenced quarterly time series, the seasonal lag variable is the first difference for the fourth time period. Recognizing that the model is fit to the first differences of the natural logarithm of the time series, the seasonal adjustment variable is (ln sales<sub>t − 4<\/sub> − ln sales<sub>t − 5<\/sub>).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.4, LOS 2.l<\/div><div class=\"qtext\"><p>The table below shows the autocorrelations of the lagged residuals for the first differences of the natural logarithm of quarterly motorcycle sales that were fit to the AR(1) model: (ln sales<sub>t<\/sub> − ln sales<sub>t − 1<\/sub>) = b<sub>0<\/sub> + b<sub>1<\/sub>(ln sales<sub>t − 1<\/sub> − ln sales<sub>t − 2<\/sub>) + ε<sub>t<\/sub>. The critical t-statistic at 5% significance is<\/p><p>2.0, which means that there is significant autocorrelation for the lag-4 residual, indicating the presence of seasonality. Assuming the time series is covariance stationary, which of the following models is most likely to CORRECT for this apparent seasonality?<\/p><div class=\"tbl\"><table><tr><td colspan=4>Lagged Autocorrelations of First Differences in the Log of Motorcycle Sales<\/td><\/tr><tr><td>Lag<\/td><td>Autocorrelation<\/td><td>Standard Error<\/td><td>t-Statistic<\/td><\/tr><tr><td>1<\/td><td>−0.0738<\/td><td>0.1667<\/td><td>−0.44271<\/td><\/tr><tr><td>2<\/td><td>−0.1047<\/td><td>0.1667<\/td><td>−0.62807<\/td><\/tr><tr><td>3<\/td><td>−0.0252<\/td><td>0.1667<\/td><td>−0.15117<\/td><\/tr><tr><td>4<\/td><td>0.5528<\/td><td>0.1667<\/td><td>3.31614<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 84, "q": "David Brice, CFA, has tried to use an AR(1) model to predict a given exchange rate. Brice has concluded the exchange rate follows a random walk without a drift. The current value of the exchange rate is 2.2. Under these conditions, which of the following would be least likely?", "opts": ["The residuals of the forecasting model are autocorrelated.", "The process is not covariance stationary.", "The forecast for next period is 2.2."], "ans": "A", "expl": "The one-period forecast of a random walk model without drift is E(xₜ₊₁) = E(xₜ ₊ ₑₜ ) = xₜ + 0, so the forecast is simply xₜ = 2.2. For a random walk process, the variance changes with the value of the observation. However, the error term eₜ = xₜ - xₜ₋₁ is not autocorrelated.", "explhtml": "<p>The one-period forecast of a random walk model without drift is E(x<sub>t+1<\/sub>) = E(x<sub>t + et<\/sub> ) = x<sub>t<\/sub> + 0, so the forecast is simply x<sub>t<\/sub> = 2.2. For a random walk process, the variance changes with the value of the observation. However, the error term e<sub>t<\/sub> = x<sub>t<\/sub> - x<sub>t-1<\/sub> is not autocorrelated.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.i<\/div><div class=\"qtext\"><p>David Brice, CFA, has tried to use an AR(1) model to predict a given exchange rate. Brice has concluded the exchange rate follows a random walk without a drift. The current value of the exchange rate is 2.2. Under these conditions, which of the following would be least likely?<\/p><\/div>", "subj": "quant"}, {"n": 85, "q": "Troy Dillard, CFA, has estimated the following equation using semiannual data: xₜ = 44 + 0.1×xt– ₁ – 0.25×xt– 2 - 0.15×xt– 3 + eₜ. Given the data in the table below, what is Dillard's best forecast of the second half of 2007? Time Value 2003: I 31 2003: II 31 2004: I 33 2004: II 33 2005: I 36 2005: II 35 2006: I 32 2006: II 33", "opts": ["33.74.", "34.05.", "34.36."], "ans": "C", "expl": "To get the answer, Dillard must first make the forecast for 2007:I E[x2007:I]= 44 + 0.1 × xt– 1 - 0.25 × xt– 2 - 0.15 × xt– 3 E[x2007:I] = 44 + 0.1×33 - 0.25×32 - 0.15×35 E[x2007:I] = 34.05 Then, use this forecast in the equation for the first lag: E[x2007:II] = 44 + 0.1×34.05 - 0.25×33 - 0.15×32 E[x2007:II] = 34.36", "explhtml": "<p>To get the answer, Dillard must first make the forecast for 2007:I<\/p><p>E[x2007:I]= 44 + 0.1 × x<sub>t– 1<\/sub> - 0.25 × x<sub>t– 2<\/sub> - 0.15 × x<sub>t– 3<\/sub><\/p><p>E[x2007:I] = 44 + 0.1×33 - 0.25×32 - 0.15×35<\/p><p>E[x2007:I] = 34.05<\/p><p>Then, use this forecast in the equation for the first lag:<\/p><p>E[x2007:II] = 44 + 0.1×34.05 - 0.25×33 - 0.15×32<\/p><p>E[x2007:II] = 34.36<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.2, LOS 2.d<\/div><div class=\"qtext\"><p>Troy Dillard, CFA, has estimated the following equation using semiannual data: x<sub>t<\/sub> = 44 + 0.1×x<sub>t–<\/sub><\/p><p><sub>1<\/sub> – 0.25×x<sub>t– 2<\/sub> - 0.15×x<sub>t– 3<\/sub> + e<sub>t<\/sub>. Given the data in the table below, what is Dillard&#x27;s best forecast of the second half of 2007?<\/p><div class=\"tbl\"><table><tr><td>Time<\/td><td>Value<\/td><\/tr><tr><td>2003: I<\/td><td>31<\/td><\/tr><tr><td>2003: II<\/td><td>31<\/td><\/tr><tr><td>2004: I<\/td><td>33<\/td><\/tr><tr><td>2004: II<\/td><td>33<\/td><\/tr><tr><td>2005: I<\/td><td>36<\/td><\/tr><tr><td>2005: II<\/td><td>35<\/td><\/tr><tr><td>2006: I<\/td><td>32<\/td><\/tr><tr><td>2006: II<\/td><td>33<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 86, "q": "Given an AR(1) process represented by xₜ₊₁ = b₀ + b₁×xₜ + eₜ, the process would not be a random walk if:", "opts": ["E(eₜ)=0.", "the long run mean is b₀ / (1-b₁).", "b₁ = 1."], "ans": "B", "expl": "For a random walk, the long-run mean is undefined. The slope coefficient is one, b₁=1, and that is what makes the long-run mean undefined: mean = b₀/(1-b₁).", "explhtml": "<p>For a random walk, the long-run mean is undefined. The slope coefficient is one, b<sub>1<\/sub>=1, and that is what makes the long-run mean undefined: mean = b<sub>0<\/sub>/(1-b<sub>1<\/sub>).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 2.3, LOS 2.i<\/div><div class=\"qtext\"><p>Given an AR(1) process represented by x<sub>t+1<\/sub> = b<sub>0<\/sub> + b<sub>1<\/sub>×x<sub>t<\/sub> + e<sub>t<\/sub>, the process would not be a<\/p><p>random walk if:<\/p><\/div>", "subj": "quant"}, {"n": 87, "q": "If his assumption about a constant is correct, which of the following models is most appropriate for modeling these data?", "opts": ["LuxCarSalest = b₀ + b₁LuxCarSales₍ₜ₋₁₎ + eₜ.", "LuxCarSales = b₀ + b₁(t) + eₜ.", "ln(LuxCarSales) = b₀ + b₁(t) + eₜ."], "ans": "C", "expl": "Whenever the rate of change is constant over time, the appropriate model is a log- linear trend model. The other two answer choices are a linear trend model, and an autoregressive model.", "explhtml": "<p>Whenever the rate of change is constant over time, the appropriate model is a log- linear trend model. The other two answer choices are a linear trend model, and an autoregressive model.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–92<\/div> <div class=\"pp-topic\">Module 2.1, LOS 2.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 87–92). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>If his assumption about a constant is correct, which of the following models is most appropriate for modeling these data?<\/p><\/div>", "subj": "quant"}, {"n": 88, "q": "After discussing the above matter with a colleague, Bert finally decides to use an annual autoregressive model of Order One [i.e., AR(1)]. Using the data in Exhibit 1, calculate the mean reverting level of the series.", "opts": ["1.46.", "1.26.", "1.66."], "ans": "A", "expl": "The formula for the mean reverting level is: b₀  0.4563 | =  = 1.46 | (1−b₁)  (1−0.6874)", "explhtml": "<p>The formula for the mean reverting level is:<\/p><div class=\"tbl\"><table><tr><td>b<sub>0<\/sub><\/td><td>0.4563<\/td><\/tr><tr><td>=<\/td><td>= 1.46<\/td><\/tr><tr><td>(1−b<sub>1<\/sub>)<\/td><td>(1−0.6874)<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–92<\/div> <div class=\"pp-topic\">Module 2.2, LOS 2.f<\/div><div class=\"qtext\"><p>After discussing the above matter with a colleague, Bert finally decides to use an annual autoregressive model of Order One [i.e., AR(1)]. Using the data in Exhibit 1, calculate the mean reverting level of the series.<\/p><\/div>", "subj": "quant"}, {"n": 89, "q": "Bert is aware that the Dickey Fuller test can be used to discover whether a model has a unit root. He is also aware that the test would use a revised set of critical t-values. What would it mean to Bert to reject the null of the Dickey Fuller test (Hₒ: g = 0)?", "opts": ["There is no unit root.", "There is a unit root but the model can be used if covariance-stationary.", "There is a unit root and the model cannot be used in its current form."], "ans": "A", "expl": "The null hypothesis of g = 0 actually means that b₁ – 1 = 0, this will be the case if b₁ = 1. Since we have rejected the null, we can conclude that the model has no unit root.", "explhtml": "<p>The null hypothesis of g = 0 actually means that b<sub>1<\/sub> – 1 = 0, this will be the case if b<sub>1<\/sub> = 1. Since we have rejected the null, we can conclude that the model has no unit root.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–92<\/div> <div class=\"pp-topic\">Module 2.3, LOS 2.j<\/div><div class=\"qtext\"><p>Bert is aware that the Dickey Fuller test can be used to discover whether a model has a unit root. He is also aware that the test would use a revised set of critical t-values. What would it mean to Bert to reject the null of the Dickey Fuller test (H<sub>o<\/sub>: g = 0)?<\/p><\/div>", "subj": "quant"}, {"n": 90, "q": "Bert would also like to test for serial correlation in his AR(1) model. How could this be done?", "opts": ["use the provided Durbin-Watson statistic and compare it to a critical value.", "use a t-test on the residual autocorrelations over several lags.", "determine if the series has a finite and constant covariance between leading and lagged terms of itself."], "ans": "B", "expl": "To test for serial correlation in an AR model, test for the significance of residual autocorrelations over different lags. The goal is for all t-statistics to lack statistical significance. The Durbin-Watson statistic is only used for trend models. Finite and constant covariance is one of the requirements of covariance stationarity.", "explhtml": "<p>To test for serial correlation in an AR model, test for the significance of residual autocorrelations over different lags. The goal is for all t-statistics to lack statistical significance. The Durbin-Watson statistic is only used for trend models. Finite and constant covariance is one of the requirements of covariance stationarity.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–92<\/div> <div class=\"pp-topic\">Module 2.2, LOS 2.e<\/div><div class=\"qtext\"><p>Bert would also like to test for serial correlation in his AR(1) model. How could this be done?<\/p><\/div>", "subj": "quant"}, {"n": 91, "q": "When using the root mean squared error (RMSE) criterion to evaluate the predictive power of the model, which of the following is the most appropriate statement?", "opts": ["Use the model with the lowest RMSE calculated using the out-of-sample data.", "Use the model with the lowest RMSE calculated using the in-sample data.", "Use the model with the highest RMSE calculated using the in-sample data."], "ans": "A", "expl": "RMSE, or root of the mean squared error, is a measure similar to the SEE from multiple regression. The lower, the better. It should be calculated on the out-of-sample data (i.e., the data not directly used in the development of the model) as this will be a better test of the relevance and predictive power of the model going forward. This measure thus indicates the predictive power of our model.", "explhtml": "<p>RMSE, or root of the mean squared error, is a measure similar to the SEE from multiple regression. The lower, the better. It should be calculated on the out-of-sample data (i.e., the data not directly used in the development of the model) as this will be a better test of the relevance and predictive power of the model going forward. This measure thus indicates the predictive power of our model.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–92<\/div> <div class=\"pp-topic\">Module 2.2, LOS 2.g<\/div><div class=\"qtext\"><p>Wh
