<script>
const DATA = [{"n":1,"q":"The protection seller in a credit default swap (CDS) most likely:","opts":["is long credit risk exposure.","receives a one-time upfront payment for the life of the contract.","pays the notional value of the the security in the event of default."],"ans":"A","expl":"A is Correct because the protection seller is long the credit risk exposure and must pay in the event of default. In a CDS contract there are two counterparties, the credit protection buyer and the credit protection seller. The buyer agrees to make a series of periodic payments to the seller over the life of the contract (which are determined and fixed at contract initiation) and receives in return a promise that if default occurs, the protection seller will compensate the protection buyer.","explhtml":"<p>A is Correct because the protection seller is long the credit risk exposure and must pay in the event of default. In a CDS contract there are two counterparties, the credit protection buyer and the credit protection seller. The buyer agrees to make a series of periodic payments to the seller over the life of the contract (which are determined and fixed at contract initiation) and receives in return a promise that if default occurs, the protection seller will compensate the protection buyer.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>The protection seller in a credit default swap (CDS) most likely:<\/p><\/div>","subj":"fixed"},{"n":2,"q":"With respect to CDS:","opts":["the protection buyer assumes counterparty risk with respect to the protection seller.","the protection buyer makes a series of periodic, variable payments to the protection seller.","the change in value of the CDS contract fully offsets the change in the value of the underlying."],"ans":"A","expl":"A is Correct because in addition, the credit protection buyer assumes counterparty risk with respect to the credit protection seller. Under CDS agreements, the credit protection buyer relies on payment from the seller in the event of the underlying entity's default.","explhtml":"<p>A is Correct because in addition, the credit protection buyer assumes counterparty risk with respect to the credit protection seller. Under CDS agreements, the credit protection buyer relies on payment from the seller in the event of the underlying entity&#x27;s default.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>With respect to CDS:<\/p><\/div>","subj":"fixed"},{"n":3,"q":"In the event of default, the payout amount for a credit default swap (CDS) is equal to the notional principal multiplied by:","opts":["the recovery rate.","the loss given default.","the probability of default."],"ans":"B","expl":"B is Correct because the payout amount is determined as the loss given default multiplied by the notional.","explhtml":"<p>B is Correct because the payout amount is determined as the loss given default multiplied by the notional.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>In the event of default, the payout amount for a credit default swap (CDS) is equal to the notional principal multiplied by:<\/p><\/div>","subj":"fixed"},{"n":4,"q":"Which of the following statements is most accurate with respect to the settlement of CDS?","opts":["Cash settlement is more common than physical settlement","The actual recovery rate is typically determined close to the payoff date of the CDS","Settlement typically occurs the business day following the declaration of a credit event"],"ans":"A","expl":"A is Correct because CDS can be settled by physical settlement or by cash settlement. The former is less common and involves actual delivery of the debt instrument in exchange for a payment by the credit protection seller of the notional amount of the contract.","explhtml":"<p>A is Correct because CDS can be settled by physical settlement or by cash settlement. The former is less common and involves actual delivery of the debt instrument in exchange for a payment by the credit protection seller of the notional amount of the contract.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>Which of the following statements is most accurate with respect to the settlement of CDS?<\/p><\/div>","subj":"fixed"},{"n":5,"q":"An increase in which of the following factors reduces the value of a CDS?","opts":["Recovery rate","Expected exposure","Present value of expected loss"],"ans":"A","expl":"A is Correct because the recovery rate is the percentage of loss recovered from a bond in default. CVA = Σ (PV of Expected Loss (EL)) EL = Loss given default (LGD) × Probability of default (PD) LGD = Expected exposure × (1 – Recovery rate) The higher the recovery rate, the lower the loss given default, the lower the expected loss and the lower the CVA.","explhtml":"<p>A is Correct because the recovery rate is the percentage of loss recovered from a bond in default. CVA = Σ (PV of Expected Loss (EL)) EL = Loss given default (LGD) × Probability of default (PD) LGD = Expected exposure × (1 – Recovery rate) The higher the recovery rate, the lower the loss given default, the lower the expected loss and the lower the CVA.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>An increase in which of the following factors reduces the value of a CDS?<\/p><\/div>","subj":"fixed"},{"n":6,"q":"In a CDS position on a company whose credit spread has widened, the protection seller:","opts":["is long credit exposure and would monetize a gain upon unwinding the position.","is long credit exposure and would monetize a loss upon unwinding the position.","is short credit exposure and would monetize a loss upon unwinding the position."],"ans":"B","expl":"B is Correct because the protection seller is effectively long the reference entity. Thus, the credit protection seller is more or less long the company’s bonds and going back to the example where the credit quality of the reference entity improved. The implied upfront premium on a new CDS that matches the terms of the original CDS with adjusted maturity is now the market value of the original CDS. The premium on the new CDS is smaller than that on the original CDS. The protection seller in the original transaction could offset his position by entering into a new CDS as a protection buyer. He would pay an upfront premium that is less than what he originally received. The original protection buyer monetizes a loss, and the seller monetizes a gain. Conversely, if credit spreads widen, the protection seller would monetize a loss.","explhtml":"<p>B is Correct because the protection seller is effectively long the reference entity. Thus, the credit protection seller is more or less long the company’s bonds and going back to the example where the credit quality of the reference entity improved. The implied upfront premium on a new CDS that matches the terms of the original CDS with adjusted maturity is now the market value of the original CDS. The premium on the new CDS is smaller than that on the original CDS. The protection seller in the original transaction could offset his position by entering into a new CDS as a protection buyer. He would pay an upfront premium that is less than what he originally received. The original protection buyer monetizes a loss, and the seller monetizes a gain. Conversely, if credit spreads widen, the protection seller would monetize a loss.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>In a CDS position on a company whose credit spread has widened, the protection seller:<\/p><\/div>","subj":"fixed"},{"n":7,"q":"Which of the following participants would most likely be buyers of protection using CDS?","opts":["A lender looking to increase exposure to a borrower","A trader who believes that the underlying is undervalued relative to the CDS","An investor who wants exposure only to the interest rate risk of a company's debt"],"ans":"C","expl":"C is Correct because the investor can reduce the credit risk by buying a CDS. Consider that any bondholder is a buyer of credit and interest rate risk. If the bondholder wants only credit risk, it can obtain it by selling protection.","explhtml":"<p>C is Correct because the investor can reduce the credit risk by buying a CDS. Consider that any bondholder is a buyer of credit and interest rate risk. If the bondholder wants only credit risk, it can obtain it by selling protection.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>Which of the following participants would most likely be buyers of protection using CDS?<\/p><\/div>","subj":"fixed"},{"n":8,"q":"Compared to a bond purchase, a sale of CDS protection on the bond's issuer most likely:","opts":["incurs higher transaction costs.","establishes a less liquid position.","mitigates exposure to interest rate risk."],"ans":"C","expl":"C is Correct because any bondholder is a buyer of credit and interest rate risk. If the bondholder wants only credit risk, it can obtain it by selling protection.","explhtml":"<p>C is Correct because any bondholder is a buyer of credit and interest rate risk. If the bondholder wants only credit risk, it can obtain it by selling protection.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>Compared to a bond purchase, a sale of CDS protection on the bond&#x27;s issuer most likely:<\/p><\/div>","subj":"fixed"},{"n":9,"q":"A basis trade strategy is based on the difference between a company's CDS spread and the:","opts":["company's bond yield.","market reference rate.","excess of the company's bond yield over the market reference rate."],"ans":"C","expl":"C is Correct because the basis trade strategy is based on the difference between the company's bond credit spread and the CDS spread. A difference in the credit spreads in these two markets is the foundation of a strategy known as a basis trade. To determine the profit potential of such a trade, it is necessary to decompose the bond yield into the risk-free rate plus the funding spread plus the credit spread. The risk-free rate plus the funding spread is essentially the market reference rate. The credit spread is then the excess of the yield over the market reference rate and can be compared with the credit spread in the CDS market.","explhtml":"<p>C is Correct because the basis trade strategy is based on the difference between the company&#x27;s bond credit spread and the CDS spread. A difference in the credit spreads in these two markets is the foundation of a strategy known as a basis trade. To determine the profit potential of such a trade, it is necessary to decompose the bond yield into the risk-free rate plus the funding spread plus the credit spread. The risk-free rate plus the funding spread is essentially the market reference rate. The credit spread is then the excess of the yield over the market reference rate and can be compared with the credit spread in the CDS market.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>A basis trade strategy is based on the difference between a company&#x27;s CDS spread and the:<\/p><\/div>","subj":"fixed"},{"n":10,"q":"The current price of a company's 3-year bond implies a credit spread of 5%. A comparable 3-year CDS contract has a credit spread of 4%. To best exploit the mispricing, an investor can engage in:","opts":["a positive basis trade by selling the bond and selling protection through the CDS.","a negative basis trade by buying the bond and buying protection through the CDS.","a negative basis trade by buying the bond and selling protection through the CDS."],"ans":"B","expl":"B is Correct because this would be a negative basis trade. If the spread is higher in the bond market than in the CDS market, it is said to be a negative basis. From the perspective of the CDS, its risk premium is too low relative to the bond credit risk premium. From the perspective of the bond, its risk premium is too high relative to the CDS market, which means its price is too low. The investor would buy the bond at a price that appears to overestimate its credit risk and, at the same time, buy credit protection at what appears to be an unjustifiably low premium.","explhtml":"<p>B is Correct because this would be a negative basis trade. If the spread is higher in the bond market than in the CDS market, it is said to be a negative basis. From the perspective of the CDS, its risk premium is too low relative to the bond credit risk premium. From the perspective of the bond, its risk premium is too high relative to the CDS market, which means its price is too low. The investor would buy the bond at a price that appears to overestimate its credit risk and, at the same time, buy credit protection at what appears to be an unjustifiably low premium.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Default Swaps<\/div><div class=\"qtext\"><p>The current price of a company&#x27;s 3-year bond implies a credit spread of 5%. A comparable 3-year CDS contract has a credit spread of 4%. To best exploit the mispricing, an investor can engage in:<\/p><\/div>","subj":"fixed"},{"n":11,"q":"When the spot rate curve is downward sloping, the forward rate curve:","opts":["is below the spot rate curve.","fluctuates below and above the spot rate curve.","is above the spot rate curve."],"ans":"A","expl":"A is Correct because the forward rates are above spot rates when the spot curve is upward sloping and below spot rates when the spot curve slopes downward.","explhtml":"<p>A is Correct because the forward rates are above spot rates when the spot curve is upward sloping and below spot rates when the spot curve slopes downward.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>When the spot rate curve is downward sloping, the forward rate curve:<\/p><\/div>","subj":"fixed"},{"n":12,"q":"The spot rate for a security with a maturity of T can be expressed as:","opts":["a geometric mean of a series of T ‒ 1 spot rates and the one-period forward rate at T.","a geometric mean of the spot rate for a security with a maturity of T = 1 and a series of T ‒ 1 forward rates.","an arithmetic mean of the spot rate for a security with a maturity of T = 1 and a series of T ‒ 1 forward rates."],"ans":"B","expl":"B is Correct because the spot rate for a security with a maturity of T > 1 can be expressed as a geometric mean of the spot rate for a security with a maturity of T = 1 and a series of T ‒ 1 forward rates as per the equation below. zT = { (1 + z1)(1 + f1,1)(1 + f2,1)(1 + f3,1)...(1 + fT–1,1)}1/T ‒ 1","explhtml":"<p>B is Correct because the spot rate for a security with a maturity of T &gt; 1 can be expressed as a geometric mean of the spot rate for a security with a maturity of T = 1 and a series of T ‒ 1 forward rates as per the equation below. zT = { (1 + z1)(1 + f1,1)(1 + f2,1)(1 + f3,1)...(1 + fT–1,1)}1/T ‒ 1<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>The spot rate for a security with a maturity of T can be expressed as:<\/p><\/div>","subj":"fixed"},{"n":13,"q":"The process of bootstrapping is most likely used to:","opts":["derive the forward rate curve using the spot rate curve.","adjust for the shape of the par curve when deriving the spot rate curve.","derive zero-coupon rates using the par yields of coupon-paying government bonds."],"ans":"C","expl":"C is Correct because zero-coupon rates are determined by using the par yields and solving for the zero-coupon rates one by one, from the shortest to longest maturities using a forward substitution process known as bootstrapping. The par curve represents the yields to maturity on coupon-paying government bonds, priced at par, over a range of maturities.","explhtml":"<p>C is Correct because zero-coupon rates are determined by using the par yields and solving for the zero-coupon rates one by one, from the shortest to longest maturities using a forward substitution process known as bootstrapping. The par curve represents the yields to maturity on coupon-paying government bonds, priced at par, over a range of maturities.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>The process of bootstrapping is most likely used to:<\/p><\/div>","subj":"fixed"},{"n":14,"q":"The par curve for US Treasuries paying annual coupons is presented below: The 2-year zero-coupon rate is closest to:","opts":["4.70%.","5.25%.","5.28%."],"ans":"C","expl":"C is Correct because to get to the spot rate z2 the following equation needs to be solved: 1 = [0.0525/(1 + 0.0415)] + [1.0525/(1 + z2)2] [1.0525/(1 + z2)2] =1 – [0.0525/(1 + 0.0415)]= 1 – 0.050408 = 0.949592 (1+ z2)2 = 1.0525/0.949592 = 1.108371 gives z2 = 5.2792%","explhtml":"<p>C is Correct because to get to the spot rate z2 the following equation needs to be solved: 1 = [0.0525/(1 + 0.0415)] + [1.0525/(1 + z2)2] [1.0525/(1 + z2)2] =1 – [0.0525/(1 + 0.0415)]= 1 – 0.050408 = 0.949592 (1+ z2)2 = 1.0525/0.949592 = 1.108371 gives z2 = 5.2792%<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>The par curve for US Treasuries paying annual coupons is presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp135.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The 2-year zero-coupon rate is closest to:<\/p><\/div>","subj":"fixed"},{"n":15,"q":"If an investor believes that future spot rates will be below the rates predicted by the existing forward rates, the investor should:","opts":["sell a forward contract.","buy a forward contract.","neither buy nor sell a forward contract because the forward price will not change."],"ans":"B","expl":"B is Correct because if a trader expects the future spot rate to be below what is predicted by the prevailing forward rate, the forward contract value is expected to increase and the trader would buy the forward contract.","explhtml":"<p>B is Correct because if a trader expects the future spot rate to be below what is predicted by the prevailing forward rate, the forward contract value is expected to increase and the trader would buy the forward contract.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>If an investor believes that future spot rates will be below the rates predicted by the existing forward rates, the investor should:<\/p><\/div>","subj":"fixed"},{"n":16,"q":"The YTM of a bond provides a good estimate for expected return if the spot rate curve is:","opts":["downward sloping.","flat.","upward sloping."],"ans":"B","expl":"B is Correct because the YTM is generally a realistic estimate of expected return only if the yield curve is flat.","explhtml":"<p>B is Correct because the YTM is generally a realistic estimate of expected return only if the yield curve is flat.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>The YTM of a bond provides a good estimate for expected return if the spot rate curve is:<\/p><\/div>","subj":"fixed"},{"n":17,"q":"All else being equal, the strategy of rolling down the yield curve delivers the highest relative returns when the curve is:","opts":["downward sloping.","relatively flat.","upward sloping."],"ans":"C","expl":"C is Correct because when the yield curve slopes upward, as a bond approaches maturity or 'rolls down the yield curve,' it is valued at successively lower yields and higher prices. Using this strategy, a bond can be held for a period of time as it appreciates in price and then sold before maturity to realize a higher return. As long as interest rates remain stable and the yield curve retains an upward slope, this strategy can continuously add to the total return of a bond portfolio.","explhtml":"<p>C is Correct because when the yield curve slopes upward, as a bond approaches maturity or &#x27;rolls down the yield curve,&#x27; it is valued at successively lower yields and higher prices. Using this strategy, a bond can be held for a period of time as it appreciates in price and then sold before maturity to realize a higher return. As long as interest rates remain stable and the yield curve retains an upward slope, this strategy can continuously add to the total return of a bond portfolio.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>All else being equal, the strategy of rolling down the yield curve delivers the highest relative returns when the curve is:<\/p><\/div>","subj":"fixed"},{"n":18,"q":"For an investor expecting future spot rates to be below the current forward rates, the expected return of a bond over a 1-year period will be:","opts":["less than the 1-year risk-free rate.","equal to the 1-year risk-free rate.","greater than the 1-year risk-free rate."],"ans":"C","expl":"C is Correct because if a portfolio manager's projected spot curve is above (below) the forward curve and his expectation turns out to be true, the return will be less (more) than the one-period risk-free interest rate.","explhtml":"<p>C is Correct because if a portfolio manager&#x27;s projected spot curve is above (below) the forward curve and his expectation turns out to be true, the return will be less (more) than the one-period risk-free interest rate.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>For an investor expecting future spot rates to be below the current forward rates, the expected return of a bond over a 1-year period will be:<\/p><\/div>","subj":"fixed"},{"n":19,"q":"Which of the following statements regarding the swap rate curve is most accurate?","opts":["It is a type of a spot curve","It is derived from default-risk-free rates","It is used as a market benchmark when the government bond market is illiquid"],"ans":"C","expl":"C is Correct because many countries do not have a liquid government bond market with maturities longer than one year. The swap curve is a necessary market benchmark for interest rates in these countries.","explhtml":"<p>C is Correct because many countries do not have a liquid government bond market with maturities longer than one year. The swap curve is a necessary market benchmark for interest rates in these countries.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>Which of the following statements regarding the swap rate curve is most accurate?<\/p><\/div>","subj":"fixed"},{"n":20,"q":"An analyst computes the following discount factors using a government spot curve: Based on this information, the 3-year swap rate is closest to:","opts":["7.8%.","8.0%.","9.0%."],"ans":"A","expl":"A is Correct because the three-year swap rate can be determined from spot rates solving the equation; s3 /(1 + z1 )1 + s3 /(1 + z2 )2 + s3 /(1 + z3 )3 + 1 /(1 + z3 )3 = 1. Here, it should be noted that each discount factor, DFN = 1 /(1 + zN )N. Therefore, the equation above is equivalent to: s3 × DF1 + s3 × DF2 + s3 × DF3 + DF3 = 1. Using the values provided in this case: 0.9709 × s3 + 0.8653 × s3 + 0.7938 × s3 + 0.7938 = 1. 2.6300 × s3 = 0.2062. s3 = 0.0784 ≈ 7.8%.","explhtml":"<p>A is Correct because the three-year swap rate can be determined from spot rates solving the equation; s3 /(1 + z1 )1 + s3 /(1 + z2 )2 + s3 /(1 + z3 )3 + 1 /(1 + z3 )3 = 1. Here, it should be noted that each discount factor, DFN = 1 /(1 + zN )N. Therefore, the equation above is equivalent to: s3 × DF1 + s3 × DF2 + s3 × DF3 + DF3 = 1. Using the values provided in this case: 0.9709 × s3 + 0.8653 × s3 + 0.7938 × s3 + 0.7938 = 1. 2.6300 × s3 = 0.2062. s3 = 0.0784 ≈ 7.8%.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>An analyst computes the following discount factors using a government spot curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp136.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Based on this information, the 3-year swap rate is closest to:<\/p><\/div>","subj":"fixed"},{"n":21,"q":"A German manufacturing company has an outstanding bond maturing in five years and trading with a YTM of 3.90%. If the 5-year Bund is yielding 2.65% and the fixed rate of a 5-year, fixed-for-float MRR swap is 3.20%, the swap spread is:","opts":["55 bps.","70 bps.","125 bps."],"ans":"A","expl":"A is Correct because a swap spread is an excess yield of swap rates over the yields on government bonds, and we use the terms I-spread, ISPRD, or interpolated spread to refer to bond yields net of the swap rates of the same maturities. Swap spread = 3.20% – 2.65% = 0.55% = 55 bps.","explhtml":"<p>A is Correct because a swap spread is an excess yield of swap rates over the yields on government bonds, and we use the terms I-spread, ISPRD, or interpolated spread to refer to bond yields net of the swap rates of the same maturities. Swap spread = 3.20% – 2.65% = 0.55% = 55 bps.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>A German manufacturing company has an outstanding bond maturing in five years and trading with a YTM of 3.90%. If the 5-year Bund is yielding 2.65% and the fixed rate of a 5-year, fixed-for-float MRR swap is 3.20%, the swap spread is:<\/p><\/div>","subj":"fixed"},{"n":22,"q":"An analyst gathers the following fixed-income market information for a given maturity: Based on this information, the rate paid by the fixed payer in a fixed-for-floating interest rate swap should be:","opts":["4.9%.","5.9%.","6.0%."],"ans":"B","expl":"B is Correct because the swap spread is defined as the spread paid by the fixed- rate payer of an interest rate swap over the rate of the 'on-the-run' (most recently issued) government security with the same maturity as the swap. Therefore, the fixed leg of a fixed-for-floating swap will be equal to the on-the- run Treasury yield plus the swap spread: 5.4% + 0.5% = 5.9%.","explhtml":"<p>B is Correct because the swap spread is defined as the spread paid by the fixed- rate payer of an interest rate swap over the rate of the &#x27;on-the-run&#x27; (most recently issued) government security with the same maturity as the swap. Therefore, the fixed leg of a fixed-for-floating swap will be equal to the on-the- run Treasury yield plus the swap spread: 5.4% + 0.5% = 5.9%.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>An analyst gathers the following fixed-income market information for a given maturity:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp137.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Based on this information, the rate paid by the fixed payer in a fixed-for-floating interest rate swap should be:<\/p><\/div>","subj":"fixed"},{"n":23,"q":"The TED spread is the difference between the:","opts":["US T-bill rate and the overnight indexed swap rate.","MRR-based Eurodollar futures contract rate and the US T-bill rate.","MRR-based Eurodollar futures contract rate and the overnight indexed swap rate."],"ans":"B","expl":"B is Correct because \"the difference between MRR and the yield on a Treasury bill of the same maturity, or TED spread, has historically been a key indicator of perceived credit and liquidity risk. TED is an acronym formed from an abbreviation for the US T-bill (T) and the ticker symbol for the MRR-based Eurodollar futures contract (ED).\"","explhtml":"<p>B is Correct because &quot;the difference between MRR and the yield on a Treasury bill of the same maturity, or TED spread, has historically been a key indicator of perceived credit and liquidity risk. TED is an acronym formed from an abbreviation for the US T-bill (T) and the ticker symbol for the MRR-based Eurodollar futures contract (ED).&quot;<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>The TED spread is the difference between the:<\/p><\/div>","subj":"fixed"},{"n":24,"q":"In contrast to the preferred habitat theory of the term structure of interest rates, the segmented market theory assumes that:","opts":["borrowers and lenders have strong preferences for particular maturities.","investors will accept additional risk in return for additional expected returns.","yields are determined entirely by the supply and demand for funds of a particular maturity."],"ans":"C","expl":"C is Correct because this is a characteristic of the segmented markets theory. In summary, the segmented markets theory assumes that market participants are either unwilling or unable to invest in anything other than securities of their preferred maturity. It follows that the yield of securities of a particular maturity is determined entirely by the supply and demand for funds of that particular maturity.","explhtml":"<p>C is Correct because this is a characteristic of the segmented markets theory. In summary, the segmented markets theory assumes that market participants are either unwilling or unable to invest in anything other than securities of their preferred maturity. It follows that the yield of securities of a particular maturity is determined entirely by the supply and demand for funds of that particular maturity.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>In contrast to the preferred habitat theory of the term structure of interest rates, the segmented market theory assumes that:<\/p><\/div>","subj":"fixed"},{"n":25,"q":"Which of the following theories of the term structure of interest rates is best represented by both lender and borrower preferences influencing the shape of the yield curve?","opts":["Local expectations theory","Liquidity preference theory","Segmented markets theory"],"ans":"C","expl":"C is Correct because unlike expectations theory and liquidity preference theory, segmented markets theory allows for lender and borrower preferences to influence the shape of the yield curve. The result is that yields are not a reflection of expected spot rates or liquidity premiums. Rather, they are solely a function of the supply and demand for funds of a particular maturity. That is, each maturity sector can be thought of as a segmented market in which yield is determined independently from the yields that prevail in other maturity segments.","explhtml":"<p>C is Correct because unlike expectations theory and liquidity preference theory, segmented markets theory allows for lender and borrower preferences to influence the shape of the yield curve. The result is that yields are not a reflection of expected spot rates or liquidity premiums. Rather, they are solely a function of the supply and demand for funds of a particular maturity. That is, each maturity sector can be thought of as a segmented market in which yield is determined independently from the yields that prevail in other maturity segments.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>Which of the following theories of the term structure of interest rates is best represented by both lender and borrower preferences influencing the shape of the yield curve?<\/p><\/div>","subj":"fixed"},{"n":26,"q":"Short-term yields moving in the opposite direction of long-term yields primarily represents a change in the:","opts":["level of the curve.","curvature of the curve.","steepness of the curve."],"ans":"C","expl":"C is Correct because the steepness movement refers to a non-parallel shift in the yield curve when either short-term rates change more than long-term rates or long-term rates change more than short-term rates.","explhtml":"<p>C is Correct because the steepness movement refers to a non-parallel shift in the yield curve when either short-term rates change more than long-term rates or long-term rates change more than short-term rates.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>Short-term yields moving in the opposite direction of long-term yields primarily represents a change in the:<\/p><\/div>","subj":"fixed"},{"n":27,"q":"Which yield curve factor typically has the smallest impact in explaining the total variance in interest rates?","opts":["Level","Curvature","Steepness"],"ans":"B","expl":"B is Correct because curvature, tends to have a negative impact on intermediate yields and a positive impact on short- and long-term yields. This variable explaining the “twist” in the yield curve has the smallest impact of the three.","explhtml":"<p>B is Correct because curvature, tends to have a negative impact on intermediate yields and a positive impact on short- and long-term yields. This variable explaining the “twist” in the yield curve has the smallest impact of the three.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>Which yield curve factor typically has the smallest impact in explaining the total variance in interest rates?<\/p><\/div>","subj":"fixed"},{"n":28,"q":"Long-term rates are typically:","opts":["less volatile than short-term rates.","similarly volatile as short-term rates.","more volatile than short-term rates."],"ans":"A","expl":"A is Correct because the volatility term structure typically shows that short- term rates are more volatile than long-term rates","explhtml":"<p>A is Correct because the volatility term structure typically shows that short- term rates are more volatile than long-term rates<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>Long-term rates are typically:<\/p><\/div>","subj":"fixed"},{"n":29,"q":"Which of the following statements is most accurate with respect to the term structure of interest rates and volatility?","opts":["Short-term rates are more volatile than long-term rates, and short-term bond prices are more volatile than long-term bond prices","Short-term rates are more volatile than long-term rates, and long-term bond prices are more volatile than short-term bond prices","Long-term rates are more volatile than short-term rates, and long-term bond prices are more volatile than short-term bond prices"],"ans":"B","expl":"B is Correct because the volatility term structure typically shows that short-term rates are more volatile than long-term rates. That said, long-term bond prices tend to vary more than short-term bond prices given the impact of duration.","explhtml":"<p>B is Correct because the volatility term structure typically shows that short-term rates are more volatile than long-term rates. That said, long-term bond prices tend to vary more than short-term bond prices given the impact of duration.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>Which of the following statements is most accurate with respect to the term structure of interest rates and volatility?<\/p><\/div>","subj":"fixed"},{"n":30,"q":"In a period of economic expansion, when monetary authorities increase benchmark rates to control inflation, the yield curve will most likely reflect a:","opts":["bullish flattening.","bearish flattening.","bearish steepening."],"ans":"B","expl":"B is Correct because during economic expansions, monetary authorities raise benchmark rates to help control inflation. This action is often consistent with bearish flattening, or short-term bond yields rising more than long-term bond yields, resulting in a flatter yield curve.","explhtml":"<p>B is Correct because during economic expansions, monetary authorities raise benchmark rates to help control inflation. This action is often consistent with bearish flattening, or short-term bond yields rising more than long-term bond yields, resulting in a flatter yield curve.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>In a period of economic expansion, when monetary authorities increase benchmark rates to control inflation, the yield curve will most likely reflect a:<\/p><\/div>","subj":"fixed"},{"n":31,"q":"Which of the following yield curve changes would most likely result from a flight to quality?","opts":["Bullish flattening","Bearish flattening","Bullish steepening"],"ans":"A","expl":"A is Correct because bullish flattening typically occurs as a result of investor demand. During highly uncertain market periods, investors flock to government bonds in what is termed a flight to quality. This term refers to investors’ selling off higher-risk asset classes such as stocks and commodities in favor of default- risk-free government bonds. A flight to quality is often associated with bullish flattening, in which the yield curve flattens as long-term rates fall by more than short-term rates.","explhtml":"<p>A is Correct because bullish flattening typically occurs as a result of investor demand. During highly uncertain market periods, investors flock to government bonds in what is termed a flight to quality. This term refers to investors’ selling off higher-risk asset classes such as stocks and commodities in favor of default- risk-free government bonds. A flight to quality is often associated with bullish flattening, in which the yield curve flattens as long-term rates fall by more than short-term rates.<\/p>","qhtml":"<div class=\"pp-topic\">The Term Structure and Interest Rate Dynamics<\/div><div class=\"qtext\"><p>Which of the following yield curve changes would most likely result from a flight to quality?<\/p><\/div>","subj":"fixed"},{"n":32,"q":"In the arbitrage-free valuation framework for a bond with embedded options, the sum of the arbitrage-free value of the option-free bond and the arbitrage-free value of each of the options is:","opts":["less than the value of the option-embedded bond.","equal to the value of the option-embedded bond.","greater than the value of the option-embedded bond"],"ans":"B","expl":"B is Correct because a bond with embedded options can be valued in parts as the sum of the arbitrage-free bond without options (that is, a bond with no embedded options) and the arbitrage-free value of each of the options","explhtml":"<p>B is Correct because a bond with embedded options can be valued in parts as the sum of the arbitrage-free bond without options (that is, a bond with no embedded options) and the arbitrage-free value of each of the options<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>In the arbitrage-free valuation framework for a bond with embedded options, the sum of the arbitrage-free value of the option-free bond and the arbitrage-free value of each of the options is:<\/p><\/div>","subj":"fixed"},{"n":33,"q":"The arbitrage-free valuation of an option-free corporate bond is equal to the present value of bond's expected cash flows discounted using the:","opts":["spot curve.","forward curve.","bond's yield to maturity."],"ans":"A","expl":"A is Correct because the traditional approach to valuing bonds is to discount all cash flows with the same discount rate as if the yield curve were flat. However, a bond is properly thought of as a package or portfolio of zero-coupon bonds, also referred to as zeros or discount instruments. Each zero-coupon bond in such a package can be valued separately at a discount rate that depends on the shape of the yield curve and when its single cash flow is delivered in time. The term structure of these discount rates is referred to as the spot curve. Bond values derived by summing the present values of the individual zeros (cash flows) determined by such a procedure can be shown to be arbitrage free.","explhtml":"<p>A is Correct because the traditional approach to valuing bonds is to discount all cash flows with the same discount rate as if the yield curve were flat. However, a bond is properly thought of as a package or portfolio of zero-coupon bonds, also referred to as zeros or discount instruments. Each zero-coupon bond in such a package can be valued separately at a discount rate that depends on the shape of the yield curve and when its single cash flow is delivered in time. The term structure of these discount rates is referred to as the spot curve. Bond values derived by summing the present values of the individual zeros (cash flows) determined by such a procedure can be shown to be arbitrage free.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>The arbitrage-free valuation of an option-free corporate bond is equal to the present value of bond&#x27;s expected cash flows discounted using the:<\/p><\/div>","subj":"fixed"},{"n":34,"q":"An analyst gathers the following information about two annual coupon benchmark bonds: The arbitrage-free value of an option-free, 2-year, 6% annual coupon bond with the same risk and liquidity as the benchmark bonds is closest to:","opts":["101.57.","101.88.","101.97."],"ans":"B","expl":"B is Correct because for bonds that are option-free, the arbitrage-free value [is] the sum of the present values of expected future values using the benchmark spot rates. The spot rates may be determined using bootstrapping. The one-year spot rate, z1, is 3%, which is the same as the one-year par rate. Two-year spot rate, z2, is solved using: 1 = Par rate / ( 1 + z1 ) + (Par rate + 1) / ( 1 + z2 )2 , Using the provided values: 1 = 0.05 / ( 1 + 0.03 ) + (0.05 + 1) / ( 1 + z2 )2 , ( 1 + z2 )2 = 1.103571 z2 = (1.103571)1/2 – 1 = 0.05051 ≈ 5.051% The arbitrage-free value of the bond is: P0 = 6/1.03 + 106/(1.05051)2 = 101.877 ≈ 101.88","explhtml":"<p>B is Correct because for bonds that are option-free, the arbitrage-free value [is] the sum of the present values of expected future values using the benchmark spot rates. The spot rates may be determined using bootstrapping. The one-year spot rate, z1, is 3%, which is the same as the one-year par rate. Two-year spot rate, z2, is solved using: 1 = Par rate / ( 1 + z1 ) + (Par rate + 1) / ( 1 + z2 )2 , Using the provided values: 1 = 0.05 / ( 1 + 0.03 ) + (0.05 + 1) / ( 1 + z2 )2 , ( 1 + z2 )2 = 1.103571 z2 = (1.103571)1/2 – 1 = 0.05051 ≈ 5.051% The arbitrage-free value of the bond is: P0 = 6/1.03 + 106/(1.05051)2 = 101.877 ≈ 101.88<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>An analyst gathers the following information about two annual coupon benchmark bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp138.webp\" style=\"max-width:min(100%,547px)\" alt=\"\"><p>The arbitrage-free value of an option-free, 2-year, 6% annual coupon bond with the same risk and liquidity as the benchmark bonds is closest to:<\/p><\/div>","subj":"fixed"},{"n":35,"q":"An analyst gathers the following information about spot rates: •1-year spot rate: 1.50% •2-year spot rate: 2.00% •3-year spot rate: 4.25% A 3-year, 5% annual coupon bond with similar risk as the benchmark is trading at a yield-to-maturity of 4.25%. Compared to the arbitrage-free price, the bond is currently:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"A","expl":"A is Correct because the arbitrage-free price is above the current market price. To be arbitrage free, each cash flow of a bond must be discounted by the spot rate for zero-coupon bonds maturing on the same date as the cash flow. Current price is P = (5 /(1 + 0.0425)) + (5/(1 + 0.0425)2) + (105/(1 + 0.0425)3) P = 102.0715 ≈ 102.1 Arbitrage-free price = (5/(1 + 0.015)) + (5/(1 + 0.02)2) + (105/(1 + 0.0425)3) Arbitrage-free price = 102.40664 ≈ 102.4 > 102.1 The answer can be deduced by the fact that the 3-year spot rate is equal to the yield to maturity and the other spot rates are lower than the yield to maturity.","explhtml":"<p>A is Correct because the arbitrage-free price is above the current market price. To be arbitrage free, each cash flow of a bond must be discounted by the spot rate for zero-coupon bonds maturing on the same date as the cash flow. Current price is P = (5 /(1 + 0.0425)) + (5/(1 + 0.0425)2) + (105/(1 + 0.0425)3) P = 102.0715 ≈ 102.1 Arbitrage-free price = (5/(1 + 0.015)) + (5/(1 + 0.02)2) + (105/(1 + 0.0425)3) Arbitrage-free price = 102.40664 ≈ 102.4 &gt; 102.1 The answer can be deduced by the fact that the 3-year spot rate is equal to the yield to maturity and the other spot rates are lower than the yield to maturity.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>An analyst gathers the following information about spot rates: •1-year spot rate: 1.50% •2-year spot rate: 2.00% •3-year spot rate: 4.25% A 3-year, 5% annual coupon bond with similar risk as the benchmark is trading at a yield-to-maturity of 4.25%. Compared to the arbitrage-free price, the bond is currently:<\/p><\/div>","subj":"fixed"},{"n":36,"q":"The creation of a binominal interest rate tree requires the assumption of:","opts":["an interest rate model only.","the volatility of interest rates only.","both an interest rate model and the volatility of interest rates."],"ans":"C","expl":"C is Correct because on a binomial lattice, to obtain the two possible values for the one-year interest rate one year from today two assumptions are required: an interest rate model and a volatility of interest rates.","explhtml":"<p>C is Correct because on a binomial lattice, to obtain the two possible values for the one-year interest rate one year from today two assumptions are required: an interest rate model and a volatility of interest rates.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>The creation of a binominal interest rate tree requires the assumption of:<\/p><\/div>","subj":"fixed"},{"n":37,"q":"In the binomial interest rate tree framework, under the assumption of lognormal distribution, the probabilities for the rate going up or down are:","opts":["equal.","functions of the forward rates.","dependent on interest rate volatility."],"ans":"A","expl":"A is Correct because in the lognormal model the probabilities for the rate going up or down are equal.","explhtml":"<p>A is Correct because in the lognormal model the probabilities for the rate going up or down are equal.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>In the binomial interest rate tree framework, under the assumption of lognormal distribution, the probabilities for the rate going up or down are:<\/p><\/div>","subj":"fixed"},{"n":38,"q":"Which of the following statements regarding the calibration of a binomial interest rate tree to the term structure is most accurate?","opts":["The interest rate model used in the process is based on the normal distribution","The volatility assumption used in the binomial tree impacts the valuation of an option-free bond","The interest rate tree is fit to the current yield curve so that the model produces the benchmark bond values"],"ans":"C","expl":"C is Correct because the first step [in constructing a binomial interest tree] is to describe the calibration of a binomial interest rate tree to match a specific term structure. We do this to ensure that the model is arbitrage free. We fit the interest rate tree to the current yield curve by choosing interest rates such that the model produces the benchmark bond values. Also, finding the rates in the tree is an iterative process, and the interest rates are found numerically.","explhtml":"<p>C is Correct because the first step [in constructing a binomial interest tree] is to describe the calibration of a binomial interest rate tree to match a specific term structure. We do this to ensure that the model is arbitrage free. We fit the interest rate tree to the current yield curve by choosing interest rates such that the model produces the benchmark bond values. Also, finding the rates in the tree is an iterative process, and the interest rates are found numerically.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>Which of the following statements regarding the calibration of a binomial interest rate tree to the term structure is most accurate?<\/p><\/div>","subj":"fixed"},{"n":39,"q":"A correctly calibrated binomial interest rate tree most likely spreads out around the:","opts":["spot rate curve.","forward rate curve.","benchmark rate curve."],"ans":"B","expl":"B is Correct because the binomial tree spreads out around the forward rate curve. The average is slightly higher than the implied forward rate because of the assumption of lognormality.","explhtml":"<p>B is Correct because the binomial tree spreads out around the forward rate curve. The average is slightly higher than the implied forward rate because of the assumption of lognormality.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>A correctly calibrated binomial interest rate tree most likely spreads out around the:<\/p><\/div>","subj":"fixed"},{"n":40,"q":"An analyst gathers the following data about a binomial interest rate tree for an option-free, annual coupon bond maturing in two years. If the current 1-year spot rate is 1.5% and the bond pays a coupon of 2.0%, the current value of the bond using the backward induction methodology is closest to:","opts":["98.50.","99.96.","100.47."],"ans":"C","expl":"C is Correct because both bond values at time 1 have to be discounted by the spot rate, including the coupon. Value = ((99.715 × 0.5) + (100.247 × 0.5) + (100 × 0.02)) / (1 + 0.015) Value = 100.4739 ≈ 100.47","explhtml":"<p>C is Correct because both bond values at time 1 have to be discounted by the spot rate, including the coupon. Value = ((99.715 × 0.5) + (100.247 × 0.5) + (100 × 0.02)) / (1 + 0.015) Value = 100.4739 ≈ 100.47<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>An analyst gathers the following data about a binomial interest rate tree for an option-free, annual coupon bond maturing in two years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp139.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>If the current 1-year spot rate is 1.5% and the bond pays a coupon of 2.0%, the current value of the bond using the backward induction methodology is closest to:<\/p><\/div>","subj":"fixed"},{"n":41,"q":"Using the following binomial interest rate tree, the value of a 3-year, 5% annual coupon bond is closest to:","opts":["81.75.","91.29.","100.83"],"ans":"C","expl":"C is Correct, the calculations for the value of the bond at time 0 using backward induction can be found below.","explhtml":"<p>C is Correct, the calculations for the value of the bond at time 0 using backward induction can be found below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp158.webp\" style=\"max-width:min(100%,721px)\" alt=\"\">","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>Using the following binomial interest rate tree, the value of a 3-year, 5% annual coupon bond is closest to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp140.webp\" style=\"max-width:min(100%,579px)\" alt=\"\"><\/div>","subj":"fixed"},{"n":42,"q":"Pricing an option-free bond using either an arbitrage-free binomial lattice or the zero-coupon yield curve will result in the same price because:","opts":["both methods use the bond coupon as the discount rate.","the application of interest rate volatility is the same for both.","the binomial tree is calibrated to the zero-coupon yield curve."],"ans":"C","expl":"C is Correct because the tree was calibrated to the same par curve (and spot curve) that was used to price this option-free bond using spot rates only, the tree gives the same price as the spot rate pricing.","explhtml":"<p>C is Correct because the tree was calibrated to the same par curve (and spot curve) that was used to price this option-free bond using spot rates only, the tree gives the same price as the spot rate pricing.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>Pricing an option-free bond using either an arbitrage-free binomial lattice or the zero-coupon yield curve will result in the same price because:<\/p><\/div>","subj":"fixed"},{"n":43,"q":"The value of an option-free bond obtained when discounting cash flows with spot rates will most likely differ from the value obtained by using a binomial interest rate tree when:","opts":["interest rate volatility is assumed to be zero.","the binomial interest rate tree is not properly calibrated to the spot curve.","interest rates are simulated using an insufficient number of potential paths."],"ans":"B","expl":"B is Correct because the binomial interest rate tree should produce the same value as when discounting the cash flows with the spot rates. An option-free bond that is valued by using the binomial interest rate tree should have the same value as when discounting by the spot rates, which is true because the binomial interest rate tree is arbitrage free. If the binomial interest rate tree is not calibrated to the current spot curve, then it is not arbitrage-free and would not produce the same value as when discounting the cash flows with the spot rates.","explhtml":"<p>B is Correct because the binomial interest rate tree should produce the same value as when discounting the cash flows with the spot rates. An option-free bond that is valued by using the binomial interest rate tree should have the same value as when discounting by the spot rates, which is true because the binomial interest rate tree is arbitrage free. If the binomial interest rate tree is not calibrated to the current spot curve, then it is not arbitrage-free and would not produce the same value as when discounting the cash flows with the spot rates.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>The value of an option-free bond obtained when discounting cash flows with spot rates will most likely differ from the value obtained by using a binomial interest rate tree when:<\/p><\/div>","subj":"fixed"},{"n":44,"q":"When valuing a 4-year zero-coupon bond using pathwise valuation, the total number of possible paths is:","opts":["4.","8.","16."],"ans":"B","expl":"B is Correct because for a four-year zero-coupon bond, there would be eight possible paths to arrive at year 4. HHH HHT HTH THH HTT THT TTH TTT.","explhtml":"<p>B is Correct because for a four-year zero-coupon bond, there would be eight possible paths to arrive at year 4. HHH HHT HTH THH HTT THT TTH TTT.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>When valuing a 4-year zero-coupon bond using pathwise valuation, the total number of possible paths is:<\/p><\/div>","subj":"fixed"},{"n":45,"q":"Based on the following binomial interest rate tree and forward rates and using pathwise valuation, the present value of a 3-year, 4% annual coupon bond's cash flows following the path of lowest rates is closest to:","opts":["91.96.","97.60.","99.55"],"ans":"C","expl":"C is Correct because the path of lowest rates is Path 4 below and the present value is calculated as 4/(1 + 0.03) + 4/[(1 + 0.03) × (1 + 0.046572)] + 104/[(1 + 0.03) × (1 + 0.046572) × (1 + 0.049127)] = 3.8835 + 3.7107 + 91.9600 = 99.5542 ≈ 99.55","explhtml":"<p>C is Correct because the path of lowest rates is Path 4 below and the present value is calculated as 4/(1 + 0.03) + 4/[(1 + 0.03) × (1 + 0.046572)] + 104/[(1 + 0.03) × (1 + 0.046572) × (1 + 0.049127)] = 3.8835 + 3.7107 + 91.9600 = 99.5542 ≈ 99.55<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp159.webp\" style=\"max-width:min(100%,721px)\" alt=\"\">","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>Based on the following binomial interest rate tree and forward rates and using pathwise valuation, the present value of a 3-year, 4% annual coupon bond&#x27;s cash flows following the path of lowest rates is closest to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp141.webp\" style=\"max-width:min(100%,667px)\" alt=\"\"><\/div>","subj":"fixed"},{"n":46,"q":"Which of the following statements regarding the Monte Carlo method to value bonds is most accurate?","opts":["It is not appropriate for securities whose cash flows are path dependent","The greater the number of paths, the closer the model is to the security's fundamental value","A probability distribution and a volatility assumption are needed to generate interest rate paths"],"ans":"C","expl":"C is Correct because interest rate paths are generated on the basis of some probability distribution and a volatility assumption, and the model is fit to the current benchmark term structure of interest rates.","explhtml":"<p>C is Correct because interest rate paths are generated on the basis of some probability distribution and a volatility assumption, and the model is fit to the current benchmark term structure of interest rates.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>Which of the following statements regarding the Monte Carlo method to value bonds is most accurate?<\/p><\/div>","subj":"fixed"},{"n":47,"q":"Which of the following term structure models is arbitrage-free and uses a binomial lattice approach?","opts":["The Vasicek model","The Ho–Lee model","The Cox–Ingersoll–Ross model"],"ans":"B","expl":"B is Correct because the first arbitrage-free model was introduced by Ho and Lee (1986). The model is calibrated to market data and uses a binomial lattice approach to generate a distribution of possible future interest rates.","explhtml":"<p>B is Correct because the first arbitrage-free model was introduced by Ho and Lee (1986). The model is calibrated to market data and uses a binomial lattice approach to generate a distribution of possible future interest rates.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>Which of the following term structure models is arbitrage-free and uses a binomial lattice approach?<\/p><\/div>","subj":"fixed"},{"n":48,"q":"Which of the following term structure models includes a varying short-rate volatility?","opts":["The Vasicek model","The Ho–Lee model","The Cox–Ingersoll–Ross model"],"ans":"C","expl":"C is Correct because another important feature of the CIR model is that the random component varies as rates change. In other words, the short-rate volatility is a function of the short rate. Importantly, at low rates, rt, the term becomes small, which prevents rates from turning negative.","explhtml":"<p>C is Correct because another important feature of the CIR model is that the random component varies as rates change. In other words, the short-rate volatility is a function of the short rate. Importantly, at low rates, rt, the term becomes small, which prevents rates from turning negative.<\/p>","qhtml":"<div class=\"pp-topic\">The Arbitrage-Free Valuation Framework<\/div><div class=\"qtext\"><p>Which of the following term structure models includes a varying short-rate volatility?<\/p><\/div>","subj":"fixed"},{"n":49,"q":"Which of the following bonds has an embedded option that is an investor option?","opts":["A putable bond","A callable bond","A sinking fund bond"],"ans":"A","expl":"A is Correct because a putable bond is a bond that includes an embedded put option. The put option is an investor option; that is, the right to exercise the option is at the discretion of the bondholder. The put provision allows the bondholders to put back the bonds to the issuer prior to maturity.","explhtml":"<p>A is Correct because a putable bond is a bond that includes an embedded put option. The put option is an investor option; that is, the right to exercise the option is at the discretion of the bondholder. The put provision allows the bondholders to put back the bonds to the issuer prior to maturity.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>Which of the following bonds has an embedded option that is an investor option?<\/p><\/div>","subj":"fixed"},{"n":50,"q":"Which of the following type of bond benefits the issuer if interest rates decline?","opts":["Putable bond","Callable bond","Extendible bond"],"ans":"B","expl":"B is Correct because a callable bond is a bond that includes an embedded call option. The call provision allows the issuer to redeem the bond issue prior to maturity. Early redemption usually happens when the issuer has the opportunity to replace a high-coupon bond with another bond that has more favorable terms, typically when interest rates have fallen.","explhtml":"<p>B is Correct because a callable bond is a bond that includes an embedded call option. The call provision allows the issuer to redeem the bond issue prior to maturity. Early redemption usually happens when the issuer has the opportunity to replace a high-coupon bond with another bond that has more favorable terms, typically when interest rates have fallen.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>Which of the following type of bond benefits the issuer if interest rates decline?<\/p><\/div>","subj":"fixed"},{"n":51,"q":"A company that has issued both a callable bond and a putable bond is:","opts":["long the put option and short the call option.","short the put option and short the call option.","short the put option and long the call option."],"ans":"C","expl":"C is Correct because for a callable bond, the decision to exercise the call option is made by the issuer. Thus, the investor is long the bond but short the call option and the issuer is long the call option. For a putable bond, the decision to exercise the put option is made by the investor. Thus, the investor has a long position in both the bond and the put option and the issuer is short the put option.","explhtml":"<p>C is Correct because for a callable bond, the decision to exercise the call option is made by the issuer. Thus, the investor is long the bond but short the call option and the issuer is long the call option. For a putable bond, the decision to exercise the put option is made by the investor. Thus, the investor has a long position in both the bond and the put option and the issuer is short the put option.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>A company that has issued both a callable bond and a putable bond is:<\/p><\/div>","subj":"fixed"},{"n":52,"q":"When comparing bonds with embedded options to option-free bonds, which of the following statements is most accurate? All else being equal, from an investor's perspective:","opts":["the value of a callable bond is higher than the value of a putable bond.","the value of an option-free bond is higher than the value of a putable bond.","the value of an option-free bond is higher than the value of a callable bond."],"ans":"C","expl":"C is Correct because for a callable bond, the decision to exercise the call option is made by the issuer. Thus, the investor is long the bond but short the call option. From the investor’s perspective, therefore, the value of the call option decreases the value of the callable bond relative to the value of the straight bond.","explhtml":"<p>C is Correct because for a callable bond, the decision to exercise the call option is made by the issuer. Thus, the investor is long the bond but short the call option. From the investor’s perspective, therefore, the value of the call option decreases the value of the callable bond relative to the value of the straight bond.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>When comparing bonds with embedded options to option-free bonds, which of the following statements is most accurate? All else being equal, from an investor&#x27;s perspective:<\/p><\/div>","subj":"fixed"},{"n":53,"q":"In an arbitrage-free framework, the price of an option-free bond is 103.60 and the price of an otherwise identical bond with an embedded option is 102.80. An investor in the bond with an embedded option is:","opts":["long a put worth 0.80.","short a put worth 0.80.","short a call worth 0.80."],"ans":"C","expl":"C is Correct because the relationships between the value of a callable bond, straight bond, and call option that the investor is long the bond and short the call option. Thus, the value of the call option decreases the value of the callable bond relative to that of an otherwise identical option-free bond.","explhtml":"<p>C is Correct because the relationships between the value of a callable bond, straight bond, and call option that the investor is long the bond and short the call option. Thus, the value of the call option decreases the value of the callable bond relative to that of an otherwise identical option-free bond.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>In an arbitrage-free framework, the price of an option-free bond is 103.60 and the price of an otherwise identical bond with an embedded option is 102.80. An investor in the bond with an embedded option is:<\/p><\/div>","subj":"fixed"},{"n":54,"q":"In a zero volatility environment with an upward sloping yield curve, the risk of a callable bond valued near par being called most likely:","opts":["decreases over time.","remains the same over time.","increases over time."],"ans":"A","expl":"A is Correct because with an upward sloping yield curve, forward rates increase faster than spot and par rates. As forward rates rise, the discount rate used to value the bond also rises and reduces the bonds value, and consequently, call risk. When the yield curve is upward sloping, the one-period forward rates on the interest rate tree are high and opportunities for the issuer to call the bond are fewer. When the yield curve flattens or inverts, many nodes on the tree have lower forward rates that increase the opportunities to call.","explhtml":"<p>A is Correct because with an upward sloping yield curve, forward rates increase faster than spot and par rates. As forward rates rise, the discount rate used to value the bond also rises and reduces the bonds value, and consequently, call risk. When the yield curve is upward sloping, the one-period forward rates on the interest rate tree are high and opportunities for the issuer to call the bond are fewer. When the yield curve flattens or inverts, many nodes on the tree have lower forward rates that increase the opportunities to call.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>In a zero volatility environment with an upward sloping yield curve, the risk of a callable bond valued near par being called most likely:<\/p><\/div>","subj":"fixed"},{"n":55,"q":"All else being equal, an increase in interest rate volatility increases the value of:","opts":["a putable bond only.","a callable bond only.","both a putable bond and a callable bond."],"ans":"A","expl":"A is Correct because as interest rate volatility increases, the value of the putable bond increases.","explhtml":"<p>A is Correct because as interest rate volatility increases, the value of the putable bond increases.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>All else being equal, an increase in interest rate volatility increases the value of:<\/p><\/div>","subj":"fixed"},{"n":56,"q":"An investor examines the price sensitivity of a callable bond and a putable bond and concludes that both bond prices will rise with an increase in interest rate volatility. Is the investor's conclusion accurate?","opts":["Yes","No, because the price of the putable bond will decrease","No, because the price of the callable bond will decrease"],"ans":"C","expl":"C is Correct because all else being equal, the call option increases in value with interest rate volatility. Thus, as interest rate volatility increases, the value of the callable bond decreases.","explhtml":"<p>C is Correct because all else being equal, the call option increases in value with interest rate volatility. Thus, as interest rate volatility increases, the value of the callable bond decreases.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>An investor examines the price sensitivity of a callable bond and a putable bond and concludes that both bond prices will rise with an increase in interest rate volatility. Is the investor&#x27;s conclusion accurate?<\/p><\/div>","subj":"fixed"},{"n":57,"q":"A portfolio manager expects the current upward sloping yield curve to flatten due to a decrease in long-term rates. The manager is considering the following bonds, all with a 5% coupon rate and ten years left to maturity: All else being equal, the strategy that would benefit the most from the manager's expectation is to:","opts":["buy Bond A and sell Bond B.","buy Bond C and sell Bond B.","buy Bond A and sell Bond C."],"ans":"B","expl":"B is Correct because this position is net long a call, which will benefit if the yield curve flattens. Position C – B = straight bond – (straight bond – call option) = call option. All else being equal, the value of the call option increases as the yield curve flattens.","explhtml":"<p>B is Correct because this position is net long a call, which will benefit if the yield curve flattens. Position C – B = straight bond – (straight bond – call option) = call option. All else being equal, the value of the call option increases as the yield curve flattens.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>A portfolio manager expects the current upward sloping yield curve to flatten due to a decrease in long-term rates. The manager is considering the following bonds, all with a 5% coupon rate and ten years left to maturity:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp142.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>All else being equal, the strategy that would benefit the most from the manager&#x27;s expectation is to:<\/p><\/div>","subj":"fixed"},{"n":58,"q":"A portfolio manager expects the yield curve to steepen due to an increase in long-term rates. A strategy that would benefit the most from this expectation is to go:","opts":["long a putable bond and short an otherwise similar straight bond.","long a straight bond and short an otherwise similar callable bond.","short a callable bond and long an otherwise similar putable bond."],"ans":"A","expl":"A is Correct because this position is net long a put, which benefits from a steepening yield curve. Position = (straight bond + put option) – straight bond = put option. When the yield curve is upward sloping, the one-period forward rates in the interest rate tree are high, which creates more opportunities for the investor to put the bond.","explhtml":"<p>A is Correct because this position is net long a put, which benefits from a steepening yield curve. Position = (straight bond + put option) – straight bond = put option. When the yield curve is upward sloping, the one-period forward rates in the interest rate tree are high, which creates more opportunities for the investor to put the bond.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>A portfolio manager expects the yield curve to steepen due to an increase in long-term rates. A strategy that would benefit the most from this expectation is to go:<\/p><\/div>","subj":"fixed"},{"n":59,"q":"A default-free corporate bond with a 3.60% annual coupon rate and two years left to maturity is putable at par one year from now. The interest rate tree based on an estimated interest rate volatility is as follows: The price per 100 of par value of the putable bond is closest to:","opts":["100.95.","101.15.","101.28."],"ans":"C","expl":"C is Correct because the bond value at Year 1 when the interest rate is 3.8695% is (100 + 3.60)/(1 + 3.8695%) ≈ 99.741, in which case the investor will put the bond at 100. The bond value at Year 1 when the interest rate is 3.1681% is (100 + 3.60)/(1 + 3.1681%) ≈ 100.419, Discounting the coupon payment and the values in Year 1 to Year 0 to get the price of the bond: (3.60 + 0.5 × 100 + 0.5 × 100.419)/(1 + 2.5000%) ≈ 101.28.","explhtml":"<p>C is Correct because the bond value at Year 1 when the interest rate is 3.8695% is (100 + 3.60)/(1 + 3.8695%) ≈ 99.741, in which case the investor will put the bond at 100. The bond value at Year 1 when the interest rate is 3.1681% is (100 + 3.60)/(1 + 3.1681%) ≈ 100.419, Discounting the coupon payment and the values in Year 1 to Year 0 to get the price of the bond: (3.60 + 0.5 × 100 + 0.5 × 100.419)/(1 + 2.5000%) ≈ 101.28.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>A default-free corporate bond with a 3.60% an
