d callable in one year at par, with a current price of 99.6345: If she estimates the price of the bond to be 98.9323 if the benchmark yield curve increases by 50bps, the effective duration of the bond is closest to:","opts":["0.9344.","1.0716.","1.4186."],"ans":"C","expl":"C is Correct and found by first calculating the value for a 50bps downward shift in rates and then applying the formula EffDur = [(PV–) – (PV+)/[2 × (ΔCurve) × (PV0)]. The value for a downward shift is: Time 0 price = [4 + (0.5 × 99.7156 + 0.5 × 100)]/(1.035) = 100.3457. EffDur = (100.3457 – 98.9323)/(2 × 0.005 × 99.6345) = 1.4186.","explhtml":"<p>C is Correct and found by first calculating the value for a 50bps downward shift in rates and then applying the formula EffDur = [(PV–) – (PV+)/[2 × (ΔCurve) × (PV0)]. The value for a downward shift is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp160.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Time 0 price = [4 + (0.5 × 99.7156 + 0.5 × 100)]/(1.035) = 100.3457. EffDur = (100.3457 – 98.9323)/(2 × 0.005 × 99.6345) = 1.4186.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>An analyst uses the following binomial interest rate tree to examine the interest rate sensitivity of a 2-year, 4% annual coupon bond callable in one year at par, with a current price of 99.6345:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp145.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>If she estimates the price of the bond to be 98.9323 if the benchmark yield curve increases by 50bps, the effective duration of the bond is closest to:<\/p><\/div>","subj":"fixed"},{"n":65,"q":"If the effective duration of a bond decreases significantly when interest rates fall, the bond is most likely a(n):","opts":["putable bond.","callable bond.","option-free bond."],"ans":"B","expl":"B is Correct because the effective duration of the callable bond shortens when interest rates fall, which is when the call option moves into the money and thus limits the price appreciation of the callable bond.","explhtml":"<p>B is Correct because the effective duration of the callable bond shortens when interest rates fall, which is when the call option moves into the money and thus limits the price appreciation of the callable bond.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>If the effective duration of a bond decreases significantly when interest rates fall, the bond is most likely a(n):<\/p><\/div>","subj":"fixed"},{"n":66,"q":"The effective duration of a putable bond is similar to that of an otherwise identical option-free bond, and is not sensitive to a small yield shift. An analyst should conclude that the embedded put option is:","opts":["in the money.","at the money.","out of the money."],"ans":"C","expl":"C is Correct because when interest rates are low relative to the bond’s coupon, the put option is out of the money so the bond is unlikely to be put. Thus, the effective duration of the putable bond is in this case very similar to that of an otherwise identical option-free bond.","explhtml":"<p>C is Correct because when interest rates are low relative to the bond’s coupon, the put option is out of the money so the bond is unlikely to be put. Thus, the effective duration of the putable bond is in this case very similar to that of an otherwise identical option-free bond.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>The effective duration of a putable bond is similar to that of an otherwise identical option-free bond, and is not sensitive to a small yield shift. An analyst should conclude that the embedded put option is:<\/p><\/div>","subj":"fixed"},{"n":67,"q":"A 10-year bond is priced at 100 and is currently callable at par. Compared to its one-sided down-duration, this bond's one-sided up-duration is most likely:","opts":["lower.","the same.","higher."],"ans":"C","expl":"C is Correct because the bond is more sensitive to interest rate increases than interest rate decreases because of the call feature. The one-sided up-duration is higher than the one-sided down-duration confirms that the callable bond is more sensitive to interest rate rises than to interest rate declines.","explhtml":"<p>C is Correct because the bond is more sensitive to interest rate increases than interest rate decreases because of the call feature. The one-sided up-duration is higher than the one-sided down-duration confirms that the callable bond is more sensitive to interest rate rises than to interest rate declines.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>A 10-year bond is priced at 100 and is currently callable at par. Compared to its one-sided down-duration, this bond&#x27;s one-sided up-duration is most likely:<\/p><\/div>","subj":"fixed"},{"n":68,"q":"If an investor believes that the yield curve will steepen significantly over the near term, which of the following duration measures is most appropriate for analyzing the risk of fixed- income securities?","opts":["Key rate duration","Effective duration","One-sided duration"],"ans":"A","expl":"A is Correct because using key rate durations (also known as partial durations), which reflect the sensitivity of the bond’s price to changes in specific maturities on the benchmark yield curve. Thus, key rate durations help portfolio managers and risk managers identify the \"shaping risk\" for bonds—that is, the bond’s sensitivity to changes in the shape of the yield curve (e.g., steepening and flattening).","explhtml":"<p>A is Correct because using key rate durations (also known as partial durations), which reflect the sensitivity of the bond’s price to changes in specific maturities on the benchmark yield curve. Thus, key rate durations help portfolio managers and risk managers identify the &quot;shaping risk&quot; for bonds—that is, the bond’s sensitivity to changes in the shape of the yield curve (e.g., steepening and flattening).<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>If an investor believes that the yield curve will steepen significantly over the near term, which of the following duration measures is most appropriate for analyzing the risk of fixed- income securities?<\/p><\/div>","subj":"fixed"},{"n":69,"q":"Which of the following bonds is most likely to exhibit negative convexity?","opts":["A putable bond","A callable bond","An option-free bond"],"ans":"B","expl":"B is Correct because the effective convexity of the callable bond turns negative when the call option is near the money.","explhtml":"<p>B is Correct because the effective convexity of the callable bond turns negative when the call option is near the money.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>Which of the following bonds is most likely to exhibit negative convexity?<\/p><\/div>","subj":"fixed"},{"n":70,"q":"Compared to a putable bond, an otherwise identical callable bond:","opts":["has less downside risk when interest rates rise.","has more upside potential when interest rates decline.","has lower convexity when the call option is near the money."],"ans":"C","expl":"C is Correct because the effective convexity of the callable bond turns negative when the call option is near the money, while putable bonds always have positive convexity.","explhtml":"<p>C is Correct because the effective convexity of the callable bond turns negative when the call option is near the money, while putable bonds always have positive convexity.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>Compared to a putable bond, an otherwise identical callable bond:<\/p><\/div>","subj":"fixed"},{"n":71,"q":"A 2-year floating rate bond pays annual coupons of the 1-year reference rate (set in arrears) and is capped at 5%. Reference rates based on an assumed volatility are given in the binomial interest rate tree below. The value of the capped floater (as a % of par) is closest to:","opts":["95.24.","99.55.","100.00."],"ans":"B","expl":"B is Correct because the calculation is as follows: Value = [4.5 + (0.5 × 99.0566 + 0.5 × 100)]/(1 + 4.5%) = 99.5486 ≈ 99.55","explhtml":"<p>B is Correct because the calculation is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp161.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Value = [4.5 + (0.5 × 99.0566 + 0.5 × 100)]/(1 + 4.5%) = 99.5486 ≈ 99.55<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>A 2-year floating rate bond pays annual coupons of the 1-year reference rate (set in arrears) and is capped at 5%. Reference rates based on an assumed volatility are given in the binomial interest rate tree below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp146.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>The value of the capped floater (as a % of par) is closest to:<\/p><\/div>","subj":"fixed"},{"n":72,"q":"A 2-year floating rate bond pays annual coupons of the 1-year reference rate (in arrears) and has a floor of 4%. Reference rates based on an assumed volatility are given in the binomial interest rate tree below: The value of the floored floating rate bond (as a % of par) is closest to:","opts":["100.99.","101.19.","101.67."],"ans":"C","expl":"C is Correct because it is calculated as follows: Value = [4.0 + (0.5 × 100 + 0.5 × 102.4631)]/(1 + 3.5%) = 101.6730 ≈ 101.67.","explhtml":"<p>C is Correct because it is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp162.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Value = [4.0 + (0.5 × 100 + 0.5 × 102.4631)]/(1 + 3.5%) = 101.6730 ≈ 101.67.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>A 2-year floating rate bond pays annual coupons of the 1-year reference rate (in arrears) and has a floor of 4%. Reference rates based on an assumed volatility are given in the binomial interest rate tree below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp147.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The value of the floored floating rate bond (as a % of par) is closest to:<\/p><\/div>","subj":"fixed"},{"n":73,"q":"When the issuer of a convertible bond announces a stock split, an analyst adjusts the conversion price down and the conversion ratio up accordingly. Are these adjustments correct?","opts":["Yes","No, because the conversion ratio does not need to be adjusted","No, because the conversion price does not need to be adjusted"],"ans":"A","expl":"A is Correct because the conversion price and conversion ratio need to be adjusted when the issuer splits stocks. Corporate actions—such as stock splits, bonus share issuances, and rights or warrants issuances—affect a company’s share price and may reduce the benefit of conversion for the convertible bondholders. Thus, the terms of issuance of the convertible bond contain detailed information defining how the conversion price and conversion ratio are adjusted should such a corporate action occur during the life of the bond. For example, suppose an issuer performs a 2-for-1 stock split. The conversion price would need to be adjusted down (to half) and the conversion ratio would need to be adjusted up (to double).","explhtml":"<p>A is Correct because the conversion price and conversion ratio need to be adjusted when the issuer splits stocks. Corporate actions—such as stock splits, bonus share issuances, and rights or warrants issuances—affect a company’s share price and may reduce the benefit of conversion for the convertible bondholders. Thus, the terms of issuance of the convertible bond contain detailed information defining how the conversion price and conversion ratio are adjusted should such a corporate action occur during the life of the bond. For example, suppose an issuer performs a 2-for-1 stock split. The conversion price would need to be adjusted down (to half) and the conversion ratio would need to be adjusted up (to double).<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>When the issuer of a convertible bond announces a stock split, an analyst adjusts the conversion price down and the conversion ratio up accordingly. Are these adjustments correct?<\/p><\/div>","subj":"fixed"},{"n":74,"q":"A convertible bond with a conversion rate of 25 is selling for $948.72. The price of the issuer's otherwise identical option-free bond is $952.65 and the underlying share price is $37.20. The convertible bond is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"A","expl":"A is Correct because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond. The conversion value = $37.20 × 25 = $930.00. Minimum value of the convertible bond = Maximum ($930.00; $952.65) = $952.65. Since the price of the bond is $948.72, the bond is undervalued in the market.","explhtml":"<p>A is Correct because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond. The conversion value = $37.20 × 25 = $930.00. Minimum value of the convertible bond = Maximum ($930.00; $952.65) = $952.65. Since the price of the bond is $948.72, the bond is undervalued in the market.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>A convertible bond with a conversion rate of 25 is selling for $948.72. The price of the issuer&#x27;s otherwise identical option-free bond is $952.65 and the underlying share price is $37.20. The convertible bond is:<\/p><\/div>","subj":"fixed"},{"n":75,"q":"An analyst gathers the following information about a convertible bond issue: If the value of an otherwise identical option-free bond by the same issuer is $650, the minimum value of this convertible bond is:","opts":["$650.","$660.","$720."],"ans":"B","expl":"B is Correct because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond. The conversion value = underlying share price × the conversion ratio = 55 × 12 = 660. This is greater than the value of the equivalent option-free bond which is 650.","explhtml":"<p>B is Correct because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond. The conversion value = underlying share price × the conversion ratio = 55 × 12 = 660. This is greater than the value of the equivalent option-free bond which is 650.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a convertible bond issue:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp148.webp\" style=\"max-width:min(100%,561px)\" alt=\"\"><p>If the value of an otherwise identical option-free bond by the same issuer is $650, the minimum value of this convertible bond is:<\/p><\/div>","subj":"fixed"},{"n":76,"q":"The value of a callable convertible bond equals the value of the straight bond:","opts":["plus the value of the call option on the issuer’s stock plus the value of the issuer call option.","plus the value of the call option on the issuer’s stock minus the value of the issuer call option.","minus the value of the call option on the issuer’s stock minus the value of the issuer call optio on price is par value/conversion ratio = $1,000/25 = $40, which is significantly less than the $50 underlying share price.","explhtml":"<p>B is Correct because when the underlying share price is above the conversion price, a convertible bond exhibits mostly stock risk–return characteristics. Here the conversion price is par value/conversion ratio = $1,000/25 = $40, which is significantly less than the $50 underlying share price.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a $1,000 par value convertible bond and the underlying common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp149.webp\" style=\"max-width:min(100%,560px)\" alt=\"\"><p>The bond has risk-return characteristics most similar to:<\/p><\/div>","subj":"fixed"},{"n":79,"q":"An analyst gathers information about the following $1,000 par value, 10-year maturity bonds issued by the same company whose stock currently has a price of $70: If the share price increases, which bond is likely to increase in value the most?","opts":["Bond A","Bond B","Bond C"],"ans":"A","expl":"A is Correct because the current share price of $70 is significantly above the conversion price of $1,000/18 = $55.56 so that the conversion option is in the money and the bond is more equity-like. In contrast, when the underlying share price is above the conversion price, a convertible bond exhibits mostly stock risk– return characteristics. Thus, the bond will move up in value nearly proportional to the increase in share price.","explhtml":"<p>A is Correct because the current share price of $70 is significantly above the conversion price of $1,000/18 = $55.56 so that the conversion option is in the money and the bond is more equity-like. In contrast, when the underlying share price is above the conversion price, a convertible bond exhibits mostly stock risk– return characteristics. Thus, the bond will move up in value nearly proportional to the increase in share price.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation and Analysis of Bonds with Embedded Options<\/div><div class=\"qtext\"><p>An analyst gathers information about the following $1,000 par value, 10-year maturity bonds issued by the same company whose stock currently has a price of $70:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp150.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>If the share price increases, which bond is likely to increase in value the most?<\/p><\/div>","subj":"fixed"},{"n":80,"q":"An analyst notes that a bond's loss given default estimates have increased. This is most likely due to an increase in the:","opts":["recovery rate.","expected exposure.","probability of default."],"ans":"B","expl":"B is Correct because the loss given default is equal to the expected exposure times (1 – recovery rate). The expected exposure to default loss is the projected amount of money the investor could lose if an event of default occurs, before factoring in possible recovery. When the expected exposure increases, the loss given default increases.","explhtml":"<p>B is Correct because the loss given default is equal to the expected exposure times (1 – recovery rate). The expected exposure to default loss is the projected amount of money the investor could lose if an event of default occurs, before factoring in possible recovery. When the expected exposure increases, the loss given default increases.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An analyst notes that a bond&#x27;s loss given default estimates have increased. This is most likely due to an increase in the:<\/p><\/div>","subj":"fixed"},{"n":81,"q":"An analyst gathers the following information about a bond to calculate a credit valuation adjustment: If the risk-free rate is 3% for this period, the present value of the expected loss is closest to:","opts":["0.616.","0.635.","0.925."],"ans":"A","expl":"A is Correct because the present value of the expected loss is estimated as loss given default (LGD) × Probability of default. The LGD = the exposure × (1 – recovery rate); = 105.80 × (1 – 60%) = 42.32. The expected loss = LGD × probability of default; = 42.32 × 1.5% ≈ 0.6348. The present value of the expected loss = 0.635/1.03 ≈ 0.616.","explhtml":"<p>A is Correct because the present value of the expected loss is estimated as loss given default (LGD) × Probability of default. The LGD = the exposure × (1 – recovery rate); = 105.80 × (1 – 60%) = 42.32. The expected loss = LGD × probability of default; = 42.32 × 1.5% ≈ 0.6348. The present value of the expected loss = 0.635/1.03 ≈ 0.616.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a bond to calculate a credit valuation adjustment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp151.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>If the risk-free rate is 3% for this period, the present value of the expected loss is closest to:<\/p><\/div>","subj":"fixed"},{"n":82,"q":"Which of the following factors carries the highest weight in the FICO score?","opts":["Payment history","Type of credit used","Number of hard credit inquiries"],"ans":"A","expl":"A is Correct because of the five primary factors that are included in the proprietary algorithm used to get the FICO score, the largest weight, at 35%, is given to the payment history: This includes the presence or lack of such information as delinquency, bankruptcy, court judgments, repossessions, and foreclosures.","explhtml":"<p>A is Correct because of the five primary factors that are included in the proprietary algorithm used to get the FICO score, the largest weight, at 35%, is given to the payment history: This includes the presence or lack of such information as delinquency, bankruptcy, court judgments, repossessions, and foreclosures.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>Which of the following factors carries the highest weight in the FICO score?<\/p><\/div>","subj":"fixed"},{"n":83,"q":"Notching adjustments are typically made to an issuer's credit ratings based on its:","opts":["subordinated debt.","senior secured debt.","senior unsecured debt."],"ans":"C","expl":"C is Correct because the credit rating agencies consider the expected loss given default by means of notching, which is a rating adjustment methodology to reflect the priority of claim for specific debt issues of that issuer and to reflect any subordination. The issuer rating is typically for senior unsecured debt.","explhtml":"<p>C is Correct because the credit rating agencies consider the expected loss given default by means of notching, which is a rating adjustment methodology to reflect the priority of claim for specific debt issues of that issuer and to reflect any subordination. The issuer rating is typically for senior unsecured debt.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>Notching adjustments are typically made to an issuer&#x27;s credit ratings based on its:<\/p><\/div>","subj":"fixed"},{"n":84,"q":"An analyst gathers the following information on the following partial 1-year transition matrix for BB rated bonds and credit spread data: Assuming no default, the 1-year expected return on a BB rated bond with a YTM of 4.25% and a modified duration of 6.52 is closest to:","opts":["3.17%.","4.25%.","5.33%."],"ans":"A","expl":"A is Correct because the expected return on the BB-rated bond over the next year is its YTM plus the expected percentage price change in the bond over the next year. In the following table, for each possible transition, the expected percentage price change is the product of the bond’s modified duration of 6.52 multiplied by –1, and the change in the spread, weighted by the given probability: Expected percentage price change = (0.0266 × 14.344%) + (0.420 × 11.736%) + (0.8524 × 0.00%) + (0.0790 × –24.776%) = –1.08%. The expected return on BB rated bond is its YTM plus the expected percentage price change due to credit migration: Expected return = 4.25% – 1.08% = 3.17%.","explhtml":"<p>A is Correct because the expected return on the BB-rated bond over the next year is its YTM plus the expected percentage price change in the bond over the next year. In the following table, for each possible transition, the expected percentage price change is the product of the bond’s modified duration of 6.52 multiplied by –1, and the change in the spread, weighted by the given probability:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp163.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Expected percentage price change = (0.0266 × 14.344%) + (0.420 × 11.736%) + (0.8524 × 0.00%) + (0.0790 × –24.776%) = –1.08%. The expected return on BB rated bond is its YTM plus the expected percentage price change due to credit migration: Expected return = 4.25% – 1.08% = 3.17%.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An analyst gathers the following information on the following partial 1-year transition matrix for BB rated bonds and credit spread data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp152.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>Assuming no default, the 1-year expected return on a BB rated bond with a YTM of 4.25% and a modified duration of 6.52 is closest to:<\/p><\/div>","subj":"fixed"},{"n":85,"q":"An analyst gathers the following 1-year transition matrix and credit spread data: Assuming no default, the 1-year expected return on an A rated bond with a YTM of 4.45% and modified duration of 3.50 is closest to:","opts":["4.30%.","4.40%.","4.60%."],"ans":"A","expl":"A is Correct because for each possible transition, the expected percentage price change, computed as the product of the modified duration multiplied by –1 and the change in the spread is calculated as follows: From A to AA: –3.50 × (0.50% – 1.00%) = +1.75%. From A to BBB: –3.50 × (1.40% – 1.00%) = –1.40%. From A to BB: –3.50 × (3.25% – 1.00%) = –7.88%. The expected percentage change in the value of the A rated bond is computed by multiplying each expected percentage price change for a possible credit transition by its respective transition probability and summing the products: (0.0250 × 1.75%) + (0.8700 × 0.00%) + (0.0975 × –1.40%) + (0.0075 × –7.88%) = – 0.1518%. Therefore, the expected return on the bond over the next year is its YTM minus 0.1518% ≈ 0.15%, assuming no default, which equals 4.45% – 0.15% = 4.30%.","explhtml":"<p>A is Correct because for each possible transition, the expected percentage price change, computed as the product of the modified duration multiplied by –1 and the change in the spread is calculated as follows: From A to AA: –3.50 × (0.50% – 1.00%) = +1.75%. From A to BBB: –3.50 × (1.40% – 1.00%) = –1.40%. From A to BB: –3.50 × (3.25% – 1.00%) = –7.88%. The expected percentage change in the value of the A rated bond is computed by multiplying each expected percentage price change for a possible credit transition by its respective transition probability and summing the products: (0.0250 × 1.75%) + (0.8700 × 0.00%) + (0.0975 × –1.40%) + (0.0075 × –7.88%) = – 0.1518%. Therefore, the expected return on the bond over the next year is its YTM minus 0.1518% ≈ 0.15%, assuming no default, which equals 4.45% – 0.15% = 4.30%.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An analyst gathers the following 1-year transition matrix and credit spread data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp153.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>Assuming no default, the 1-year expected return on an A rated bond with a YTM of 4.45% and modified duration of 3.50 is closest to:<\/p><\/div>","subj":"fixed"},{"n":86,"q":"An analyst estimates the following partial 1-year transition matrix: The expected price change for an AAA rated bond with a duration of 3.7, when downgraded to an A rating, is closest to:","opts":["–6.48%.","–3.70%.","–0.07%."],"ans":"B","expl":"B is Correct because the expected percentage price change is the product of the negative of the modified duration and the difference between the credit spread in the new rating and the old rating: Expected percentage price change = –3.7 × (0.0175 – 0.0075) = –0.0370, or –3.70%.","explhtml":"<p>B is Correct because the expected percentage price change is the product of the negative of the modified duration and the difference between the credit spread in the new rating and the old rating: Expected percentage price change = –3.7 × (0.0175 – 0.0075) = –0.0370, or –3.70%.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An analyst estimates the following partial 1-year transition matrix:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp154.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>The expected price change for an AAA rated bond with a duration of 3.7, when downgraded to an A rating, is closest to:<\/p><\/div>","subj":"fixed"},{"n":87,"q":"A structural form model of corporate credit risk:","opts":["treats default as an exogenous variable.","can explain the economic reason for default.","does not require an estimate of the company's volatility to implement."],"ans":"B","expl":"B is Correct because structural models explain the economic reasons for default while reduced-form models do not.","explhtml":"<p>B is Correct because structural models explain the economic reasons for default while reduced-form models do not.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>A structural form model of corporate credit risk:<\/p><\/div>","subj":"fixed"},{"n":88,"q":"A reduced-form model of credit risk:","opts":["can explain the economic reason for default.","assumes default is a surprise and can occur at any time.","requires a measure of the company's asset volatility to implement."],"ans":"B","expl":"B is Correct because reduced-form models assume that default comes as a surprise and can occur at any time.","explhtml":"<p>B is Correct because reduced-form models assume that default comes as a surprise and can occur at any time.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>A reduced-form model of credit risk:<\/p><\/div>","subj":"fixed"},{"n":89,"q":"Which of the following is the most appropriate interpretation of debt and equity in terms of options in a structural model of credit risk?","opts":["Equity is a purchased call option on the assets","Debt is short a risk-free bond and long a put option on the assets","Debt is short the assets and long a call option sold by the shareholders"],"ans":"A","expl":"A is Correct because E(T) = max[A(T) – K, 0], where A(T) is the random asset value as of time T and K is the face value of the bonds, and this equation indicates that equity is essentially a purchased call option on the assets of the company whereby the strike price is the face value of the debt.","explhtml":"<p>A is Correct because E(T) = max[A(T) – K, 0], where A(T) is the random asset value as of time T and K is the face value of the bonds, and this equation indicates that equity is essentially a purchased call option on the assets of the company whereby the strike price is the face value of the debt.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>Which of the following is the most appropriate interpretation of debt and equity in terms of options in a structural model of credit risk?<\/p><\/div>","subj":"fixed"},{"n":90,"q":"A 10-year corporate bond with an annual coupon rate of 4.56% is priced at 98.2% of par. The yield on a 10-year government bond is 3.50%. The credit spread of the corporate bond is closest to:","opts":["0.98%.","1.06%.","1.29%."],"ans":"C","expl":"C is Correct because the yield to maturity of the corporate bond is 4.79%, subtracting the 10-year government bond yield of 3.50% to get a credit spread of 1.29%. The difference between the yields to maturity on a corporate bond and a government bond with the same maturity is the most commonly used measure of credit risk. It is called the credit spread and is also known in practice as the G- spread. For the corporate bond, N = 10, PMT = 4.56, PV = –98.2, FV = 100, solve for I/Y to get a yield to maturity of 4.79%. The credit spread is thus 4.79% – 3.50% = 1.29%.","explhtml":"<p>C is Correct because the yield to maturity of the corporate bond is 4.79%, subtracting the 10-year government bond yield of 3.50% to get a credit spread of 1.29%. The difference between the yields to maturity on a corporate bond and a government bond with the same maturity is the most commonly used measure of credit risk. It is called the credit spread and is also known in practice as the G- spread. For the corporate bond, N = 10, PMT = 4.56, PV = –98.2, FV = 100, solve for I/Y to get a yield to maturity of 4.79%. The credit spread is thus 4.79% – 3.50% = 1.29%.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>A 10-year corporate bond with an annual coupon rate of 4.56% is priced at 98.2% of par. The yield on a 10-year government bond is 3.50%. The credit spread of the corporate bond is closest to:<\/p><\/div>","subj":"fixed"},{"n":91,"q":"An analyst calculates the value of a corporate bond with an annual coupon rate of 3.25% and three years left to maturity. The analyst constructs the binomial interest rate tree as follows: The discount factors for years 1, 2, and 3 are 0.9709, 0.9206, and 0.8623, respectively. Assuming the recovery rate is 40% and the annual probability of default is 1.50%, the credit valuation adjustment to the value of the bond is closest to:","opts":["0.8567.","2.4499.","2.6701."],"ans":"B","expl":"B is Correct because the credit valuation adjustment is 2.4499. The value of the bond at each interest rate node assuming no default can be calculated using the interest rate tree. The value of the bond at maturity (Year 3) is 100 + 100 × 3.25% = 103.25 At Year 2, the values are: 103.25/(1 + 8.1823%) ≈ 95.4408 103.25/(1 + 6.6991%) ≈ 96.7675 103.25/(1 + 5.4848%) ≈ 97.8814 At Year 1, the values are: (100 × 3.25% + 0.5 × 95.4408 + 0.5 × 96.7675)/(1 + 6.0139%) ≈ 93.7180 (100 × 3.25% + 0.5 × 96.7675 + 0.5 × 97.8814)/(1 + 4.9238%) ≈ 95.8547 The value of bond assuming no default (VND) at year 0 is: (100 × 3.25% + 0.5 × 93.7180 + 0.5 × 95.8547)/(1 + 3.0000%) ≈ 95.1809 The expected exposure, loss given default, probability of default, expected losses, discount factor, and credit valuation adjustment (CVA) each year can be calculated as follows: For Year 1: The expected exposure is 100 × 3.25% + 0.5 × 93.7180 + 0.5 × 95.8547 ≈ 98.0364 The Loss given default is 98.0364 × (1 – 40%) = 58.8218 The probability of default is equal to the annual probability of default of 1.50%. The expected loss is 58.8218 × 1.50% = 0.8823 Discounting the expected loss by one period to get the CVA for Year 1, 0.8823 × 0.9709 ≈ 0.8567. For Year 2: The expected exposure is 100 × 3.25% + 0.25 × 95.4408 + 0.5 × 96.7675 + 0.25 × 99.8814 ≈ 99.9643 The loss given default is 99.9643 × (1 – 40%) ≈ 59.9786 The probability of default is 1.50% × (1 – 1.50%) = 1.4755%. The expected loss is 59.9786 × 1.4755% ≈ 0.8862, The CVA for Year 2 is 0.8862 × 0.9206 ≈ 0.8158. For Year 3: The expected exposure is 100 + 100 × 3.25% = 103.25, The loss given default is 103.25 × (1 – 40%) = 61.9500, The probability of default is 1.50% × (1 – 1.50%)2 ≈ 1.4553%. The expected loss is 61.9500 × 1.4553% = 0.9016, The CVA for Year 3 is 0.9016 × 0.8623 ≈ 0.7774. The results are summarized in the following table: The credit valuation adjustment is the sum of CVA each year = 0.8567 + 0.8158 + 0.7774 = 2.4499.","explhtml":"<p>B is Correct because the credit valuation adjustment is 2.4499. The value of the bond at each interest rate node assuming no default can be calculated using the interest rate tree.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp164.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>The value of the bond at maturity (Year 3) is 100 + 100 × 3.25% = 103.25 At Year 2, the values are: 103.25/(1 + 8.1823%) ≈ 95.4408 103.25/(1 + 6.6991%) ≈ 96.7675 103.25/(1 + 5.4848%) ≈ 97.8814 At Year 1, the values are: (100 × 3.25% + 0.5 × 95.4408 + 0.5 × 96.7675)/(1 + 6.0139%) ≈ 93.7180 (100 × 3.25% + 0.5 × 96.7675 + 0.5 × 97.8814)/(1 + 4.9238%) ≈ 95.8547 The value of bond assuming no default (VND) at year 0 is: (100 × 3.25% + 0.5 × 93.7180 + 0.5 × 95.8547)/(1 + 3.0000%) ≈ 95.1809 The expected exposure, loss given default, probability of default, expected losses, discount factor, and credit valuation adjustment (CVA) each year can be calculated as follows: For Year 1: The expected exposure is 100 × 3.25% + 0.5 × 93.7180 + 0.5 × 95.8547 ≈ 98.0364 The Loss given default is 98.0364 × (1 – 40%) = 58.8218 The probability of default is equal to the annual probability of default of 1.50%. The expected loss is 58.8218 × 1.50% = 0.8823 Discounting the expected loss by one period to get the CVA for Year 1, 0.8823 × 0.9709 ≈ 0.8567. For Year 2: The expected exposure is 100 × 3.25% + 0.25 × 95.4408 + 0.5 × 96.7675 + 0.25 × 99.8814 ≈ 99.9643 The loss given default is 99.9643 × (1 – 40%) ≈ 59.9786 The probability of default is 1.50% × (1 – 1.50%) = 1.4755%. The expected loss is 59.9786 × 1.4755% ≈ 0.8862, The CVA for Year 2 is 0.8862 × 0.9206 ≈ 0.8158. For Year 3: The expected exposure is 100 + 100 × 3.25% = 103.25, The loss given default is 103.25 × (1 – 40%) = 61.9500, The probability of default is 1.50% × (1 – 1.50%)2 ≈ 1.4553%. The expected loss is 61.9500 × 1.4553% = 0.9016, The CVA for Year 3 is 0.9016 × 0.8623 ≈ 0.7774. The results are summarized in the following table:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp165.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>The credit valuation adjustment is the sum of CVA each year = 0.8567 + 0.8158 + 0.7774 = 2.4499.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An analyst calculates the value of a corporate bond with an annual coupon rate of 3.25% and three years left to maturity. The analyst constructs the binomial interest rate tree as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp155.webp\" style=\"max-width:min(100%,560px)\" alt=\"\"><p>The discount factors for years 1, 2, and 3 are 0.9709, 0.9206, and 0.8623, respectively. Assuming the recovery rate is 40% and the annual probability of default is 1.50%, the credit valuation adjustment to the value of the bond is closest to:<\/p><\/div>","subj":"fixed"},{"n":92,"q":"An analyst calculates the value of a corporate bond with an annual coupon rate of 3.25% and three years left to maturity. The analyst constructs the binomial interest rate tree as follows: The discount factors for years 1, 2, and 3 are 0.9709, 0.9206, and 0.8623, respectively. Assuming the recovery rate is 40% and the annual probability of default is 1.50%, the fair value of the bond is closest to:","opts":["92.731.","95.181.","97.631."],"ans":"A","expl":"A is Correct because the fair value of the bond equals the value assuming no default (VND) minus credit valuation adjustment (CVA). The value of the bond at each interest rate node assuming no default can be calculated using the interest rate tree. The value of the bond at maturity (Year 3) is 100 + 100 × 3.25% = 103.25 At Year 2, the values are: 103.25/(1 + 8.1823%) ≈ 95.4408 103.25/(1 + 6.6991%) ≈ 96.7675 103.25/(1 + 5.4848%) ≈ 97.8814 At Year 1, the values are: (100 × 3.25% + 0.5 × 95.4408 + 0.5 × 96.7675)/(1 + 6.0139%) ≈ 93.7180 (100 × 3.25% + 0.5 × 96.7675 + 0.5 × 97.8814)/(1 + 4.9238%) ≈ 95.8547 The value of bond assuming no default (VND) at year 0 is: (100 × 3.25% + 0.5 × 93.7180 + 0.5 × 95.8547)/(1 + 3.0000%) ≈ 95.1809 The expected exposure, loss given default, probability of default, expected losses, discount factor, and credit valuation adjustment (CVA) each year can be calculated as follows: For Year 1: The expected exposure is 100 × 3.25% + 0.5 × 93.7180 + 0.5 × 95.8547 ≈ 98.0364 The Loss given default is 98.0364 × (1 – 40%) = 58.8218 The probability of default is equal to the annual probability of default of 1.50%. The expected loss is 58.8218 × 1.50% = 0.8823 Discounting the expected loss by one period to get the CVA for Year 1, 0.8823 × 0.9709 ≈ 0.8567. For Year 2: The expected exposure is 100 × 3.25% + 0.25 × 95.4408 + 0.5 × 96.7675 + 0.25 × 99.8814 ≈ 99.9643 The loss given default is 99.9643 × (1 – 40%) ≈ 59.9786 The probability of default is 1.50% × (1 – 1.50%) = 1.4755%. The expected loss is 59.9786 × 1.4755% ≈ 0.8862, The CVA for Year 2 is 0.8862 × 0.9206 ≈ 0.8158. For Year 3: The expected exposure is 100 + 100 × 3.25% = 103.25, The loss given default is 103.25 × (1 – 40%) = 61.9500, The probability of default is 1.50% × (1 – 1.50%)2 ≈ 1.4553%. The expected loss is 61.9500 × 1.4553% = 0.9016, The CVA for Year 3 is 0.9016 × 0.8623 ≈ 0.7774. The results are summarized in the following table: The credit valuation adjustment is the sum of CVA each year = 0.8567 + 0.8158 + 0.7774 = 2.4499. The fair value of the bond = VND – CVA = 95.1809 – 2.4499 ≈ 92.731.","explhtml":"<p>A is Correct because the fair value of the bond equals the value assuming no default (VND) minus credit valuation adjustment (CVA). The value of the bond at each interest rate node assuming no default can be calculated using the interest rate tree.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp166.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>The value of the bond at maturity (Year 3) is 100 + 100 × 3.25% = 103.25 At Year 2, the values are: 103.25/(1 + 8.1823%) ≈ 95.4  annual coupon rate of 3.25% and three years left to maturity. The analyst constructs the binomial interest rate tree as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp156.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>The discount factors for years 1, 2, and 3 are 0.9709, 0.9206, and 0.8623, respectively. Assuming the recovery rate is 40% and the annual probability of default is 1.50%, the fair value of the bond is closest to:<\/p><\/div>","subj":"fixed"},{"n":93,"q":"An increase in which of the following will lead to a decrease in the credit spread of a security?","opts":["Credit rating","Annual default probability","Cumulative default probability"],"ans":"A","expl":"A is Correct because an increase in the credit rating of a security is negatively correlated with the credit spread of that security. A higher credit spread implies more credit risk and a lower credit rating.","explhtml":"<p>A is Correct because an increase in the credit rating of a security is negatively correlated with the credit spread of that security. A higher credit spread implies more credit risk and a lower credit rating.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An increase in which of the following will lead to a decrease in the credit spread of a security?<\/p><\/div>","subj":"fixed"},{"n":94,"q":"All else being equal, as the credit valuation adjustment increases, there is a decrease in the bond's:","opts":["YTM.","price.","credit risk."],"ans":"B","expl":"B is Correct because the credit valuation adjustment (CVA) is subtracted from the (hypothetical) value of the bond, if it were default risk free, to get the bond’s fair value given its credit risk. A higher CVA implies a lower fair value of a bond, given its credit risk.","explhtml":"<p>B is Correct because the credit valuation adjustment (CVA) is subtracted from the (hypothetical) value of the bond, if it were default risk free, to get the bond’s fair value given its credit risk. A higher CVA implies a lower fair value of a bond, given its credit risk.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>All else being equal, as the credit valuation adjustment increases, there is a decrease in the bond&#x27;s:<\/p><\/div>","subj":"fixed"},{"n":95,"q":"An analyst gathers the following information about a 4- year bond with an annual pay coupon of 5.5%: If the credit valuation adjustment increases to 3.45, the change in the credit spread is closest to:","opts":["0.32%.","0.94%.","1.59%."],"ans":"A","expl":"A is Correct because the credit spread with the credit valuation adjustment (CVA) is estimated by first finding the yield to maturity of the bond when adjusting the default-free bond value by the CVA; Bond's new price = 105.45 – 3.45 = 102. The yield-to-maturity of a four-year bond with an annual coupon rate of 5.5% and a price of 102 is 4.937% ≈ 4.94% (PV = –102, Pmt = 5.5, FV = 100, n = 4; cpt I/Y = 4.937%). The resulting credit spread is 4.94% – 4.00% = 0.94%. The change in the credit spread = 0.94% – 0.62% = 0.32%.","explhtml":"<p>A is Correct because the credit spread with the credit valuation adjustment (CVA) is estimated by first finding the yield to maturity of the bond when adjusting the default-free bond value by the CVA; Bond&#x27;s new price = 105.45 – 3.45 = 102. The yield-to-maturity of a four-year bond with an annual coupon rate of 5.5% and a price of 102 is 4.937% ≈ 4.94% (PV = –102, Pmt = 5.5, FV = 100, n = 4; cpt I/Y = 4.937%). The resulting credit spread is 4.94% – 4.00% = 0.94%. The change in the credit spread = 0.94% – 0.62% = 0.32%.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a 4- year bond with an annual pay coupon of 5.5%:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp157.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>If the credit valuation adjustment increases to 3.45, the change in the credit spread is closest to:<\/p><\/div>","subj":"fixed"},{"n":96,"q":"An upward sloping credit spread term structure for a company's bonds is best explained by:","opts":["a company with high-yield bonds facing imminent default.","a cyclical company in an economy coming out of a recession.","a company with investment-grade bonds operating in a stable industry."],"ans":"C","expl":"C is Correct because positive-sloped credit spread curves are likely when a high- quality issuer with a strong competitive position in a stable industry has low leverage, strong cash flow, and a high profit margin. This type of issuer tends to exhibit very low short-term credit spreads rising with increasing maturity given greater uncertainty due to the macroeconomic environment, potential adverse changes in the competitive landscape, technological change, or other factors that drive a higher implied probability of default over time.","explhtml":"<p>C is Correct because positive-sloped credit spread curves are likely when a high- quality issuer with a strong competitive position in a stable industry has low leverage, strong cash flow, and a high profit margin. This type of issuer tends to exhibit very low short-term credit spreads rising with increasing maturity given greater uncertainty due to the macroeconomic environment, potential adverse changes in the competitive landscape, technological change, or other factors that drive a higher implied probability of default over time.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>An upward sloping credit spread term structure for a company&#x27;s bonds is best explained by:<\/p><\/div>","subj":"fixed"},{"n":97,"q":"Which of the following most likely results in a steeper credit spread curve for a specific credit rating?","opts":["An increase in equity volatility","An improved overall economic climate","The issuance of fewer long-term bonds with the same rating"],"ans":"A","expl":"A is Correct because greater equity volatility leads to a steeper credit spread curve. Holding other factors constant, any microeconomic factor that increases the implied default probability, such as greater equity volatility, will tend to drive a steeper credit spread curve, and the reverse is true with a decline in equity volatility.","explhtml":"<p>A is Correct because greater equity volatility leads to a steeper credit spread curve. Holding other factors constant, any microeconomic factor that increases the implied default probability, such as greater equity volatility, will tend to drive a steeper credit spread curve, and the reverse is true with a decline in equity volatility.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>Which of the following most likely results in a steeper credit spread curve for a specific credit rating?<\/p><\/div>","subj":"fixed"},{"n":98,"q":"For which of the following structured finance asset types is a statistics-based approach the most appropriate credit analysis approach?","opts":["Auto asset-backed securities","Asset-backed commercial paper","Consumer asset-backed securities"],"ans":"B","expl":"B is Correct because asset-backed commercial paper has granular and homogenous commercial discount credits or credit advances as underlying collateral with a short-term risk horizon. Short-term structured finance vehicles with granular, homogeneous assets tend to be evaluated using a statistics-based approach to the existing book of loans.","explhtml":"<p>B is Correct because asset-backed commercial paper has granular and homogenous commercial discount credits or credit advances as underlying collateral with a short-term risk horizon. Short-term structured finance vehicles with granular, homogeneous assets tend to be evaluated using a statistics-based approach to the existing book of loans.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>For which of the following structured finance asset types is a statistics-based approach the most appropriate credit analysis approach?<\/p><\/div>","subj":"fixed"},{"n":99,"q":"A credit analyst uses a portfolio approach to evaluate a securitized pool comprised of numerous underlying assets that have widely varying debt characteristics and a short-term risk horizon. Which of the pool's characteristics best supports the analyst's approach for credit evaluation?","opts":["Risk horizon","Number of assets","Variability of debt characteristics"],"ans":"B","expl":"B is Correct because a highly granular portfolio may have hundreds of underlying debtors, suggesting it is appropriate to draw conclusions about creditworthiness based on portfolio summary statistics rather than investigating each borrower. Alternatively, an asset pool with fewer more-discrete or non-granular investments would warrant analysis of each individual obligation.","explhtml":"<p>B is Correct because a highly granular portfolio may have hundreds of underlying debtors, suggesting it is appropriate to draw conclusions about creditworthiness based on portfolio summary statistics rather than investigating each borrower. Alternatively, an asset pool with fewer more-discrete or non-granular investments would warrant analysis of each individual obligation.<\/p>","qhtml":"<div class=\"pp-topic\">Credit Analysis Models<\/div><div class=\"qtext\"><p>A credit analyst uses a portfolio approach to evaluate a securitized pool comprised of numerous underlying assets that have widely varying debt characteristics and a short-term risk horizon. Which of the pool&#x27;s characteristics best supports the analyst&#x27;s approach for credit evaluation?<\/p><\/div>","subj":"fixed"}];
const CFG = {"title": "Fixed Income — Practice Pack", "subtitle": "CFA Level II · 99 câu · EdZeb", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter

function setSubmitButtonMode(showResults){

  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);

function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"

}

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,

  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<style id="qnav-note-css">
