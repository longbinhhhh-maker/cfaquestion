ncial figures from the Balanced Metals CFO, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will equal depreciation plus approximately 4% of the firm&#x27;s incremental revenues. McDonnell wants to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>Lutge is valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years. However, given its size and private status, Lutge does not expect that Jensen can be easily sold. To obtain the appropriate price multiple for the Jensen valuation, he has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Lutge estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Lutge uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Lutge obtains a size premium using the smallest-firm-size decile of the database. McDonnell examines Lutge&#x27;s cost of capital calculations and makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>I am concerned about the use of this database. The estimate of the size premium may result in<\/td><\/tr><tr><td>an undervaluation of the Jensen equity interest.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The use of betas and the CAPM from the database may be inappropriate. If so, Lutge should<\/td><\/tr><tr><td>consider using the build-up method whereby an industry risk premium is used instead of beta.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is closest to the total adjustment for control and marketability that would be applied to the Jensen valuation?<\/p><\/div>", "subj": "equity"}, {"n": 42, "q": "Regarding the statements made by McDonnell on Lutge's cost of capital calculations for Jensen, are both statements correct?", "opts": ["Yes.", "No, both statements are incorrect.", "No, one statement is correct, but the other statement is incorrect."], "ans": "A", "expl": "Statement 1: McDonnell is correct. Using data from the smallest cap segment of public equity to get the size premium may include a distress premium that is not applicable to a healthy private firm such as Jensen. If so, the estimated size premium will be too large, resulting in a discount rate that is too high and an undervaluation of the Jensen equity interest. Statement 2: McDonnell is correct. Using the CAPM and estimating beta from public firm data may not be appropriate for private firms that have little probability of going public or being acquired by a public firm. In the build-up method, an industry risk premium is added to the risk-free rate along with an equity risk premium, the small stock premium, and a company-specific risk premium. For Further Reference: (Study Session 11, Module 31.2, LOS 31.g, 31.k)", "explhtml": "<p>Statement 1: McDonnell is correct. Using data from the smallest cap segment of public equity to get the size premium may include a distress premium that is not applicable to a healthy private firm such as Jensen. If so, the estimated size premium will be too large, resulting in a discount rate that is too high and an undervaluation of the Jensen equity interest.<\/p><p>Statement 2: McDonnell is correct. Using the CAPM and estimating beta from public firm data may not be appropriate for private firms that have little probability of going public or being acquired by a public firm. In the build-up method, an industry risk premium is added to the risk-free rate along with an equity risk premium, the small stock premium, and a company-specific risk premium.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 31.2, LOS 31.g, 31.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Thorngate Ventures Case Scenario<\/p><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in and subsequently actively manages its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms because<\/td><\/tr><tr><td>private firms are usually smaller and thus thought to be riskier. Furthermore, the lack of access to<\/td><td><\/td><\/tr><tr><td>liquid public equity markets can limit a private firm&#x27;s growth.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants<\/td><\/tr><tr><td>for top positions as public firms. Due to the higher risk, the managers they do attract tend to have<\/td><td><\/td><\/tr><tr><td>a shorter-term view of the firm and their tenure at the firm, compared to public firm managers. As<\/td><td><\/td><\/tr><tr><td>a result, the private firm may neglect profitable long-term projects.<\/td><td><\/td><\/tr><\/table><\/div><p>Due to its considerable success, Thorngate has recently attracted a substantial inflow of capital from investors. To deploy that capital, McDonnell and Lutge are considering the purchase of Albion Biotechnology. Albion is using advances in biotechnology for application in the pharmaceutical field. The analysts are primarily interested in Albion because the firm&#x27;s research team is developing a drug that Thorngate&#x27;s current pharmaceutical firm is also working on. McDonnell estimates that combining research teams would result in advances that no pharmaceutical competitor could match for at least two years. The firm is currently owned by its founders, who are familiar to Lutge through previous social contacts. Lutge hopes to avoid a competitive bidding process for the firm, because its founders have not publicly advertised the firm&#x27;s sale.<\/p><p>McDonnell is also examining the prospects of Balanced Metals, a metal fabrication firm. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide needed exposure. The growth in sales at Balanced has been impressive recently, but it is expected to slow considerably in the years ahead due to increased competition from overseas firms. The firm&#x27;s most valuable assets are its equipment and factory, located in a prime industrial area.<\/p><p>Balanced was previously considered for possible purchase by a competitor in the metal fabrication industry. Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained the following financial figures from the Balanced Metals CFO, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will equal depreciation plus approximately 4% of the firm&#x27;s incremental revenues. McDonnell wants to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>Lutge is valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years. However, given its size and private status, Lutge does not expect that Jensen can be easily sold. To obtain the appropriate price multiple for the Jensen valuation, he has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Lutge estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Lutge uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Lutge obtains a size premium using the smallest-firm-size decile of the database. McDonnell examines Lutge&#x27;s cost of capital calculations and makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>I am concerned about the use of this database. The estimate of the size premium may result in<\/td><\/tr><tr><td>an undervaluation of the Jensen equity interest.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The use of betas and the CAPM from the database may be inappropriate. If so, Lutge should<\/td><\/tr><tr><td>consider using the build-up method whereby an industry risk premium is used instead of beta.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding the statements made by McDonnell on Lutge&#x27;s cost of capital calculations for Jensen, are both statements correct?<\/p><\/div>", "subj": "equity"}, {"n": 43, "q": "Based on information in Exhibit 1, which of the following statements is least accurate?", "opts": ["Any U.S. Treasuries’ forward curve will be upward sloping.", "Any U.S. Treasuries’ forward curve will lie below the spot curve.", "A U.S. Treasuries’ forward curve can be implied from the spot curve."], "ans": "B", "expl": "If the spot curve is upward sloping, the forward curve will be upward sloping and lie above the spot curve. For Further Reference: (Study Session 12, Module 32.1, LOS 32.a)", "explhtml": "<p>If the spot curve is upward sloping, the forward curve will be upward sloping and lie above the spot curve.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.1, LOS 32.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<\/summary><div class=\"vig-body\"><p>Questions 43 through 48 relate to Fixed Income.<\/p><p>Solsbury Peak Case Scenario<\/p><p>Youri Wabush, CFA, works as an analyst for Solsbury Peak, a small investment house based in the United States. Wabush focuses primarily on fixed-income investment opportunities in the United States.<\/p><p>Every Monday, Wabush attends a morning briefing along with John Rafita, the firm&#x27;s leading economist. Rafita presents his macroeconomic forecasts with a heavy focus on likely interest rate moves. Of particular interest to Wabush is Rafita&#x27;s update on forward rates, which he provides on the first Monday of every month. Rafita provides an interpolated U.S. Treasuries spot rate curve along with current forward rate curves and a commentary on whether or not he believes the curves will remain stable in the short, medium, and long term.<\/p><p>The most recent U.S. Treasuries spot curve presented by Rafita is shown in Exhibit 1.<\/p><p><b>Exhibit 1: U.S. Treasuries Spot Curve<\/b><\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot rate (%)<\/td><td>0.13<\/td><td>0.29<\/td><td>0.65<\/td><td>1.29<\/td><td>2.05<\/td><td>2.70<\/td><td>3.42<\/td><td>3.76<\/td><\/tr><\/table><\/div><p>Rafita also presents his view on the likely progression of the spot rate curve over the next year and a description of fixed- income strategies that should be successful if these changes are realized. His notes are presented in Exhibit 2.<\/p><p><b>Exhibit 2: Rafita Yield Curve Notes<\/b><\/p><p>U.S. Treasury Spot Curve Progression<\/p><p>The central bank has announced its intention to keep target rates constant for at least the next 15 months. This unprecedented level of transparency should allow fixed-income managers to forecast rates with a high degree of accuracy for the next year. As a result, I anticipate that the spot curve at this time next year will be almost identical to the no-arbitrage forward curve we&#x27;re seeing now.<\/p><p>Minority Strategy<\/p><p>My estimate is that there is a sizeable minority, perhaps 20–25%, of fixed income portfolio managers who will continue to ride the yield curve as they have since 2008. With an upward-sloping curve such as the one we currently face, managers have historically been slow to move away from these strategies.<\/p><p>Wabush is not convinced that the central bank will follow through on their commitment to keep rates constant. He has heard rumors that the bank will announce next month that the policy will be reviewed, with the potential for almost immediate changes in target rates. Wabush is concerned that this will introduce significant volatility into the term structure of interest rates.<\/p><p>Wabush intends to test the impact on one of his fixed-income portfolios of the three theoretical yield curve shifts shown in Exhibit 3.<\/p><p><b>Exhibit 3: Theoretical Yield Curve Shifts<\/b><\/p><p>Theoretical Shift A<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>+70bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +0bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+50bps<\/td><\/tr><\/table><\/div><p>Theoretical Shift B<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>+30bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +30bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+30bps<\/td><\/tr><\/table><\/div><p>Theoretical Shift C<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>–10bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +40bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+50bps<\/td><\/tr><\/table><\/div><p>Wabush has estimated that the key rate durations of his portfolio are as shown in Exhibit 4.<\/p><p><b>Exhibit 4: Key Rate Durations<\/b><\/p><p>Maturity Key Rate Duration<\/p><div class=\"tbl\"><table><tr><td>2 year<\/td><td>0.50<\/td><\/tr><tr><td>5 year<\/td><td>1.20<\/td><\/tr><tr><td>15 year<\/td><td>0.80<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on information in Exhibit 1, which of the following statements is least accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 44, "q": "Using the spot rate curve given in Exhibit 1, the one-year forward rate one year from today is closest to:", "opts": ["0.27%.", "0.35%.", "0.45%."], "ans": "C", "expl": "f(1,1) = [(1.0029) /(1.0013)] − 1 = 0.00450 or 0.45%. 2 For Further Reference: (Study Session 12, Module 32.1, LOS 32.b)", "explhtml": "<div class=\"tbl\"><table><tr><td>f(1,1) = [(1.0029) /(1.0013)] − 1 = 0.00450 or 0.45%.<\/td><td>2<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.1, LOS 32.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 43 through 48 relate to Fixed Income.<\/p><p>Solsbury Peak Case Scenario<\/p><p>Youri Wabush, CFA, works as an analyst for Solsbury Peak, a small investment house based in the United States. Wabush focuses primarily on fixed-income investment opportunities in the United States.<\/p><p>Every Monday, Wabush attends a morning briefing along with John Rafita, the firm&#x27;s leading economist. Rafita presents his macroeconomic forecasts with a heavy focus on likely interest rate moves. Of particular interest to Wabush is Rafita&#x27;s update on forward rates, which he provides on the first Monday of every month. Rafita provides an interpolated U.S. Treasuries spot rate curve along with current forward rate curves and a commentary on whether or not he believes the curves will remain stable in the short, medium, and long term.<\/p><p>The most recent U.S. Treasuries spot curve presented by Rafita is shown in Exhibit 1.<\/p><p><b>Exhibit 1: U.S. Treasuries Spot Curve<\/b><\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot rate (%)<\/td><td>0.13<\/td><td>0.29<\/td><td>0.65<\/td><td>1.29<\/td><td>2.05<\/td><td>2.70<\/td><td>3.42<\/td><td>3.76<\/td><\/tr><\/table><\/div><p>Rafita also presents his view on the likely progression of the spot rate curve over the next year and a description of fixed- income strategies that should be successful if these changes are realized. His notes are presented in Exhibit 2.<\/p><p><b>Exhibit 2: Rafita Yield Curve Notes<\/b><\/p><p>U.S. Treasury Spot Curve Progression<\/p><p>The central bank has announced its intention to keep target rates constant for at least the next 15 months. This unprecedented level of transparency should allow fixed-income managers to forecast rates with a high degree of accuracy for the next year. As a result, I anticipate that the spot curve at this time next year will be almost identical to the no-arbitrage forward curve we&#x27;re seeing now.<\/p><p>Minority Strategy<\/p><p>My estimate is that there is a sizeable minority, perhaps 20–25%, of fixed income portfolio managers who will continue to ride the yield curve as they have since 2008. With an upward-sloping curve such as the one we currently face, managers have historically been slow to move away from these strategies.<\/p><p>Wabush is not convinced that the central bank will follow through on their commitment to keep rates constant. He has heard rumors that the bank will announce next month that the policy will be reviewed, with the potential for almost immediate changes in target rates. Wabush is concerned that this will introduce significant volatility into the term structure of interest rates.<\/p><p>Wabush intends to test the impact on one of his fixed-income portfolios of the three theoretical yield curve shifts shown in Exhibit 3.<\/p><p><b>Exhibit 3: Theoretical Yield Curve Shifts<\/b><\/p><p>Theoretical Shift A<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>+70bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +0bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+50bps<\/td><\/tr><\/table><\/div><p>Theoretical Shift B<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>+30bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +30bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+30bps<\/td><\/tr><\/table><\/div><p>Theoretical Shift C<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>–10bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +40bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+50bps<\/td><\/tr><\/table><\/div><p>Wabush has estimated that the key rate durations of his portfolio are as shown in Exhibit 4.<\/p><p><b>Exhibit 4: Key Rate Durations<\/b><\/p><p>Maturity Key Rate Duration<\/p><div class=\"tbl\"><table><tr><td>2 year<\/td><td>0.50<\/td><\/tr><tr><td>5 year<\/td><td>1.20<\/td><\/tr><tr><td>15 year<\/td><td>0.80<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the spot rate curve given in Exhibit 1, the one-year forward rate one year from today is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 45, "q": "If Rafita's comments on the U.S. Treasury spot curve progression in Exhibit 2 prove to be correct, it is most likely that:", "opts": ["the one-year holding period return on a two-year, zero-coupon U.S. Treasury starting today would be 0.13%.", "the one-year holding period return on a two-year, zero-coupon U.S. Treasury starting today would be 0.16%.", "the one-year holding period return on a two-year, zero-coupon U.S. Treasury starting today would be 0.29%."], "ans": "A", "expl": "If the spot rate curve after one year has passed is the same as the one-year forward curve from one year ago, the total return on a bond of any maturity over that year will be the one-year spot rate. In other words, the return on a bond over one year is always equal to the one-year spot rate if spot rates evolve as predicted by today's forward curve. For Further Reference: (Study Session 12, Module 32.1, LOS 32.c)", "explhtml": "<p>If the spot rate curve after one year has passed is the same as the one-year forward curve from one year ago, the total return on a bond of any maturity over that year will be the one-year spot rate. In other words, the return on a bond over one year is always equal to the one-year spot rate if spot rates evolve as predicted by today&#x27;s forward curve.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.1, LOS 32.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 43 through 48 relate to Fixed Income.<\/p><p>Solsbury Peak Case Scenario<\/p><p>Youri Wabush, CFA, works as an analyst for Solsbury Peak, a small investment house based in the United States. Wabush focuses primarily on fixed-income investment opportunities in the United States.<\/p><p>Every Monday, Wabush attends a morning briefing along with John Rafita, the firm&#x27;s leading economist. Rafita presents his macroeconomic forecasts with a heavy focus on likely interest rate moves. Of particular interest to Wabush is Rafita&#x27;s update on forward rates, which he provides on the first Monday of every month. Rafita provides an interpolated U.S. Treasuries spot rate curve along with current forward rate curves and a commentary on whether or not he believes the curves will remain stable in the short, medium, and long term.<\/p><p>The most recent U.S. Treasuries spot curve presented by Rafita is shown in Exhibit 1.<\/p><p><b>Exhibit 1: U.S. Treasuries Spot Curve<\/b><\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot rate (%)<\/td><td>0.13<\/td><td>0.29<\/td><td>0.65<\/td><td>1.29<\/td><td>2.05<\/td><td>2.70<\/td><td>3.42<\/td><td>3.76<\/td><\/tr><\/table><\/div><p>Rafita also presents his view on the likely progression of the spot rate curve over the next year and a description of fixed- income strategies that should be successful if these changes are realized. His notes are presented in Exhibit 2.<\/p><p><b>Exhibit 2: Rafita Yield Curve Notes<\/b><\/p><p>U.S. Treasury Spot Curve Progression<\/p><p>The central bank has announced its intention to keep target rates constant for at least the next 15 months. This unprecedented level of transparency should allow fixed-income managers to forecast rates with a high degree of accuracy for the next year. As a result, I anticipate that the spot curve at this time next year will be almost identical to the no-arbitrage forward curve we&#x27;re seeing now.<\/p><p>Minority Strategy<\/p><p>My estimate is that there is a sizeable minority, perhaps 20–25%, of fixed income portfolio managers who will continue to ride the yield curve as they have since 2008. With an upward-sloping curve such as the one we currently face, managers have historically been slow to move away from these strategies.<\/p><p>Wabush is not convinced that the central bank will follow through on their commitment to keep rates constant. He has heard rumors that the bank will announce next month that the policy will be reviewed, with the potential for almost immediate changes in target rates. Wabush is concerned that this will introduce significant volatility into the term structure of interest rates.<\/p><p>Wabush intends to test the impact on one of his fixed-income portfolios of the three theoretical yield curve shifts shown in Exhibit 3.<\/p><p><b>Exhibit 3: Theoretical Yield Curve Shifts<\/b><\/p><p>Theoretical Shift A<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>+70bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +0bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+50bps<\/td><\/tr><\/table><\/div><p>Theoretical Shift B<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>+30bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +30bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+30bps<\/td><\/tr><\/table><\/div><p>Theoretical Shift C<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>–10bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +40bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+50bps<\/td><\/tr><\/table><\/div><p>Wabush has estimated that the key rate durations of his portfolio are as shown in Exhibit 4.<\/p><p><b>Exhibit 4: Key Rate Durations<\/b><\/p><p>Maturity Key Rate Duration<\/p><div class=\"tbl\"><table><tr><td>2 year<\/td><td>0.50<\/td><\/tr><tr><td>5 year<\/td><td>1.20<\/td><\/tr><tr><td>15 year<\/td><td>0.80<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>If Rafita&#x27;s comments on the U.S. Treasury spot curve progression in Exhibit 2 prove to be correct, it is most likely that:<\/p><\/div>", "subj": "fixed"}, {"n": 46, "q": "Fixed-income managers using the minority strategy described by Rafita in Exhibit 2 are most likely to:", "opts": ["invest in bonds with a maturity longer than their investment horizon.", "match the maturity of the bond portfolio with their investment horizon.", "invest in bonds with a maturity shorter than their investment horizon."], "ans": "A", "expl": "In a \"riding the yield curve\" strategy, given an upward-sloping yield curve, investors purchase bonds with maturities longer than their investment horizon. As the bond approaches maturity, its price will increase, generating superior returns for the investor. For Further Reference: (Study Session 12, Module 32.2, LOS 32.d)", "explhtml": "<p>In a &quot;riding the yield curve&quot; strategy, given an upward-sloping yield curve, investors purchase bonds with maturities longer than their investment horizon. As the bond approaches maturity, its price will increase, generating superior returns for the investor.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 12, Module 32.2, LOS 32.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 43 through 48 relate to Fixed Income.<\/p><p>Solsbury Peak Case ansparency should allow fixed-income managers to forecast rates with a high degree of accuracy for the next year. As a result, I anticipate that the spot curve at this time next year will be almost identical to the no-arbitrage forward curve we&#x27;re seeing now.<\/p><p>Minority Strategy<\/p><p>My estimate is that there is a sizeable minority, perhaps 20–25%, of fixed income portfolio managers who will continue to ride the yield curve as they have since 2008. With an upward-sloping curve such as the one we currently face, managers have historically been slow to move away from these strategies.<\/p><p>Wabush is not convinced that the central bank will follow through on their commitment to keep rates constant. He has heard rumors that the bank will announce next month that the policy will be reviewed, with the potential for almost immediate changes in target rates. Wabush is concerned that this will introduce significant volatility into the term structure of interest rates.<\/p><p>Wabush intends to test the impact on one of his fixed-income portfolios of the three theoretical yield curve shifts shown in Exhibit 3.<\/p><p><b>Exhibit 3: Theoretical Yield Curve Shifts<\/b><\/p><p>Theoretical Shift A<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>+70bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +0bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+50bps<\/td><\/tr><\/table><\/div><p>Theoretical Shift B<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>+30bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +30bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+30bps<\/td><\/tr><\/table><\/div><p>Theoretical Shift C<\/p><div class=\"tbl\"><table><tr><td>Short term (2 yr.)<\/td><td>–10bps<\/td><\/tr><\/table><\/div><p>Medium term (5 yr.) +40bps<\/p><div class=\"tbl\"><table><tr><td>Long term (15 yr.)<\/td><td>+50bps<\/td><\/tr><\/table><\/div><p>Wabush has estimated that the key rate durations of his portfolio are as shown in Exhibit 4.<\/p><p><b>Exhibit 4: Key Rate Durations<\/b><\/p><p>Maturity Key Rate Duration<\/p><div class=\"tbl\"><table><tr><td>2 year<\/td><td>0.50<\/td><\/tr><tr><td>5 year<\/td><td>1.20<\/td><\/tr><tr><td>15 year<\/td><td>0.80<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Given the information in Exhibit 3 and Exhibit 4, which of the theoretical yield curve movements is most likely to result in a large percentage change in the value of Wabush&#x27;s portfolio?<\/p><\/div>", "subj": "fixed"}, {"n": 49, "q": "Which of the following strategies would be most appropriate given Jacobs's situation and desire to offset the equity exposure of the ELFS position in her portfolio? Establish an equity swap as:", "opts": ["the floating-rate payer and S&P 500 Index return receiver.", "the fixed-rate receiver and S&P 500 Index return payer.", "the fixed-rate payer and S&P 500 Index return receiver."], "ans": "B", "expl": "Jacobs needs to offset the returns on the S&P 500 Index. She is currently receiving the returns on the index (which means if there is a negative return on the Index, Jacobs must make a payment), so she will need to enter into a swap in which she pays the index and receives a fixed rate. For Further Reference: (Study Session 14, Module 37.9, LOS 37.c)", "explhtml": "<p>Jacobs needs to offset the returns on the S&amp;P 500 Index. She is currently receiving the returns on the index (which means if there is a negative return on the Index, Jacobs must make a payment), so she will need to enter into a swap in which she pays the index and receives a fixed rate.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.9, LOS 37.c)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<\/summary><div class=\"vig-body\"><p>Questions 49 through 54 relate to Derivatives.<\/p><p>Newton Capital Partners Case Scenario<\/p><p>Paul Durham, CFA, is a senior manager in the structured bond department within Newton Capital Partners (NCP), an investment banking firm located in the United States. Durham has just returned from an international marketing campaign for NCP&#x27;s latest structured note offering, a series of equity-linked fixed-income securities or ELFS. The bonds will offer a 4.5% coupon paid annually along with the annual return on the S&amp;P 500 Index and will have a maturity of five years. The total face value of the ELFS series is expected to be $200 million.<\/p><p>Susan Jacobs, a fixed-income portfolio manager and principal with Smith &amp; Associates, has decided to include $10 million worth of ELFS in her fixed-income portfolio. At the end of the first year, however, the S&amp;P 500 Index value is 1,054, significantly lower than the initial value of 1,112 set by NCP at the time of the ELFS offering. Jacobs is concerned that the four remaining years of the ELFS life could have similar results and is considering her alternatives to offset the equity exposure of the ELFS position without selling the bonds. Jacobs decides to offset her portfolio&#x27;s exposure to the ELFS by entering into an equity-swap contract. The LIBOR term structure is shown in Exhibit 1.<\/p><p><b>Exhibit 1: LIBOR Term Structure<\/b><\/p><p>LIBOR Discount Factor<\/p><div class=\"tbl\"><table><tr><td>1-year<\/td><td>3.2%<\/td><td>0.9690<\/td><\/tr><tr><td>2-year<\/td><td>4.1%<\/td><td>0.9242<\/td><\/tr><tr><td>3-year<\/td><td>4.9%<\/td><td>0.8718<\/td><\/tr><tr><td>4-year<\/td><td>5.3%<\/td><td>0.8251<\/td><\/tr><\/table><\/div><p>To gain further understanding of different derivative contracts, Jacobs met with Jonathan Widby, senior analyst with Smith and Associates. Widby made the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>N(d ) in the BSM is interpreted as the risk-neutral probability that a put option will expire in the<\/td><\/tr><tr><td>2<\/td><td><\/td><\/tr><tr><td>money.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>A call option on a dividend-paying stock can be valued using the BSM if we reduce the current<\/td><\/tr><tr><td>stock price by the present value of dividends expected over the life of the option.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>For options on currencies, the carry benefit is not a dividend but rather interest earned on a<\/td><\/tr><tr><td>deposit of the foreign currency.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>Under the Black model, a call option on futures is modeled as a portfolio containing a long bond<\/td><\/tr><tr><td>position and a short futures position.<\/td><td><\/td><\/tr><\/table><\/div><p>To offset any credit risk associated with the equity swap, Widby recommends using an index trade strategy by entering into a credit default swap (CDS) as a protection buyer. Widby&#x27;s strategy would involve purchasing credit protection on an index comprising largely the same issuers (companies) included in the equity index underlying the swap. Widby suggests the CDS should have a maturity equal to that of the swap to provide maximum credit protection.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following strategies would be most appropriate given Jacobs&#x27;s situation and desire to offset the equity exposure of the ELFS position in her portfolio? Establish an equity swap as:<\/p><\/div>", "subj": "derivatives"}, {"n": 50, "q": "Based on the strategy appropriate for Jacobs's portfolio, determine the contract rate on the swap strategy.", "opts": ["4.5%.", "3.6%.", "4.9%."], "ans": "C", "expl": "Calculate the contract rate on a fixed-rate receiver equity swap using the following formula: Note that this is the same formula for determining the fixed interest rate on an interest rate swap. The discount (Z) factors are given in Exhibit 1. Therefore, the contract rate is: For Further Reference: (Study Session 14, Module 37.9, LOS 37.c)", "explhtml": "<p>Calculate the co actor<\/p><div class=\"tbl\"><table><tr><td>1-year<\/td><td>3.2%<\/td><td>0.9690<\/td><\/tr><tr><td>2-year<\/td><td>4.1%<\/td><td>0.9242<\/td><\/tr><tr><td>3-year<\/td><td>4.9%<\/td><td>0.8718<\/td><\/tr><tr><td>4-year<\/td><td>5.3%<\/td><td>0.8251<\/td><\/tr><\/table><\/div><p>To gain further understanding of different derivative contracts, Jacobs met with Jonathan Widby, senior analyst with Smith and Associates. Widby made the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>N(d ) in the BSM is interpreted as the risk-neutral probability that a put option will expire in the<\/td><\/tr><tr><td>2<\/td><td><\/td><\/tr><tr><td>money.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>A call option on a dividend-paying stock can be valued using the BSM if we reduce the current<\/td><\/tr><tr><td>stock price by the present value of dividends expected over the life of the option.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>For options on currencies, the carry benefit is not a dividend but rather interest earned on a<\/td><\/tr><tr><td>deposit of the foreign currency.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>Under the Black model, a call option on futures is modeled as a portfolio containing a long bond<\/td><\/tr><tr><td>position and a short futures position.<\/td><td><\/td><\/tr><\/table><\/div><p>To offset any credit risk associated with the equity swap, Widby recommends using an index trade strategy by entering into a credit default swap (CDS) as a protection buyer. Widby&#x27;s strategy would involve purchasing credit protection on an index comprising largely the same issuers (companies) included in the equity index underlying the swap. Widby suggests the CDS should have a maturity equal to that of the swap to provide maximum credit protection.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the strategy appropriate for Jacobs&#x27;s portfolio, determine the contract rate on the swap strategy.<\/p><\/div>", "subj": "derivatives"}, {"n": 51, "q": "If Jacobs enters into a $10 million 4-year 4.50% annual-pay fixed-rate equity swap as the equity return payer, what is the value to Jacob of the swap after one year (immediately after settlement) if the index has increased from 1,054 to 1,103, the LIBOR term structure is as given below, and the 3-year annual-pay swap fixed rate is currently 5.0%? LIBOR 1-year: 4.10% 2-year: 4.70% 3-year: 5.29%", "opts": ["–$136,885", "–$464,982", "–$602,555"], "ans": "A", "expl": "Value to payer Since Jacob is a fixed rate receiver, value to Jacob = $–136,885. Note: The value of equity side is not relevant because the valuation is immediately after settlement. Hence the change in index value net of fixed rate payment was already settled. Discount factors are as calculated below: Term (yr) LIBOR DF 4.10% 0.9606 2 4.70% 0.9141 3 5.29% 0.8630 Sum 2.7377 Note that LIBOR discount factors are calculated as follows: Year 3 DF = 1 / [1 + (0.0529 × 1080 / 360)] = 0.8630 Alternatively, value to fixed rate receiver = value of fixed rate bond – value of equity = [(2.7377 × 450,000) + (0.8630 × 10,000,000)] – 10,000,000 = 9,861,965 – 10,000,000 = –138,035 (difference due to rounding). For Further Reference: (Study Session 14, Module 37.9, LOS 37.d)", "explhtml": "<p>Value to payer<\/p><p>Since Jacob is a fixed rate receiver, value to Jacob = $–136,885.<\/p><p>Note: The value of equity side is not relevant because the valuation is immediately after settlement. Hence the change in index value net of fixed rate payment was already settled. Discount factors are as calculated below:<\/p><div class=\"tbl\"><table><tr><td>Term (yr) LIBOR<\/td><td>DF<\/td><td><\/td><\/tr><tr><td>4.10%<\/td><td>0.9606<\/td><td><\/td><\/tr><tr><td>2<\/td><td>4.70%<\/td><td>0.9141<\/td><\/tr><tr><td>3<\/td><td>5.29%<\/td><td>0.8630<\/td><\/tr><tr><td>Sum<\/td><td>2.7377<\/td><td><\/td><\/tr><\/table><\/div><p>Note that LIBOR discount factors are calculated as follows:<\/p><p>Year 3 DF = 1 / [1 + (0.0529 × 1080 / 360)] = 0.8630<\/p><p>Alternatively, value to fixed rate receiver = value of fixed rate bond – value of equity = [(2.7377 × 450,000) + (0.8630 × 10,000,000)] – 10,000,000 = 9,861,965 – 10,000,000 = –138,035 (difference due to rounding).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.9, LOS 37.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 49 through 54 relate to Derivatives.<\/p><p>Newton Capital Partners Case Scenario<\/p><p>Paul Durham, CFA, is a senior manager in the structured bond department within Newton Capital Partners (NCP), an investment banking firm located in the United States. Durham has just returned from an international marketing campaign for NCP&#x27;s latest structured note offering, a series of equity-linked fixed-income securities or ELFS. The bonds will offer a 4.5% coupon paid annually along with the annual return on the S&amp;P 500 Index and will have a maturity of five years. The total face value of the ELFS series is expected to be $200 million.<\/p><p>Susan Jacobs, a fixed-income portfolio manager and principal with Smith &amp; Associates, has decided to include $10 million worth of ELFS in her fixed-income portfolio. At the end of the first year, however, the S&amp;P 500 Index value is 1,054, significantly lower than the initial value of 1,112 set by NCP at the time of the ELFS offering. Jacobs is concerned that the four remaining years of the ELFS life could have similar results and is considering her alternatives to offset the equity exposure of the ELFS position without selling the bonds. Jacobs decides to offset her portfolio&#x27;s exposure to the ELFS by entering into an equity-swap contract. The LIBOR term structure is shown in Exhibit 1.<\/p><p><b>Exhibit 1: LIBOR Term Structure<\/b><\/p><p>LIBOR Discount Facto tock can be valued using the BSM if we reduce the current<\/td><\/tr><tr><td>stock price by the present value of dividends expected over the life of the option.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>For options on currencies, the carry benefit is not a dividend but rather interest earned on a<\/td><\/tr><tr><td>deposit of the foreign currency.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>Under the Black model, a call option on futures is modeled as a portfolio containing a long bond<\/td><\/tr><tr><td>position and a short futures position.<\/td><td><\/td><\/tr><\/table><\/div><p>To offset any credit risk associated with the equity swap, Widby recommends using an index trade strategy by entering into a credit default swap (CDS) as a protection buyer. Widby&#x27;s strategy would involve purchasing credit protection on an index comprising largely the same issuers (companies) included in the equity index underlying the swap. Widby suggests the CDS should have a maturity equal to that of the swap to provide maximum credit protection.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding statements 3 and 4 made by Widby:<\/p><\/div>", "subj": "derivatives"}, {"n": 54, "q": "Which of the following best evaluates Widby's suggested use of credit default swaps to offset the credit risk of the equity swap? Widby's recommended strategy is:", "opts": ["correct.", "incorrect, because the maturity of the CDS is not properly specified.", "incorrect, because the CDS does not reference the proper credit risk."], "ans": "C", "expl": "The credit risk underlying the equity swap is associated with the swap counterparty, not the companies in the equity index. This credit risk arises from the possibility that the counterparty to the swap will be unable or unwilling to make payments to Jacobs if the equity return is less than the fixed rate on the swap (i.e., the counterparty owes a payment to Jacobs). For Further Reference: (Study Session 13, Module 36.1, LOS 36.a)", "explhtml": "<p>The credit risk underlying the equity swap is associated with the swap counterparty, not the companies in the equity index. This credit risk arises from the possibility that the counterparty to the swap will be unable or unwilling to make payments to Jacobs if the equity return is less than the fixed rate on the swap (i.e., the counterparty owes a payment to Jacobs).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 36.1, LOS 36.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 49 through 54 relate to Derivatives.<\/p><p>Newton Capital Partners Case Scenario<\/p><p>Paul Durham, CFA, is a senior manager in the structured bond department within Newton Capital Partners (NCP), an investment banking firm located in the United States. Durham has just returned from an international marketing campaign for NCP&#x27;s latest structured note offering, a series of equity-linked fixed-income securities or ELFS. The bonds will offer a 4.5% coupon paid annually along with the annual return on the S&amp;P 500 Index and will have a maturity of five years. The total face value of the ELFS series is expected to be $200 million.<\/p><p>Susan Jacobs, a fixed-income portfolio manager and principal with Smith &amp; Associates, has decided to include $10 million worth of ELFS in her fixed-income portfolio. At the end of the first year, however, the S&amp;P 500 Index value is 1,054, significantly lower than the initial value of 1,112 set by NCP at the time of the ELFS offering. Jacobs is concerned that the four remaining years of the ELFS life could have similar results and is considering her alternatives to offset the equity exposure of the ELFS position without selling the bonds. Jacobs decides to offset her portfolio&#x27;s exposure to the ELFS by entering into an equity-swap contract. The LIBOR term structure is shown in Exhibit 1.<\/p><p><b>Exhibit 1: LIBOR Term Structure<\/b><\/p><p>LIBOR Discount Factor<\/p><div class=\"tbl\"><table><tr><td>1-year<\/td><td>3.2%<\/td><td>0.9690<\/td><\/tr><tr><td>2-year<\/td><td>4.1%<\/td><td>0.9242<\/td><\/tr><tr><td>3-year<\/td><td>4.9%<\/td><td>0.8718<\/td><\/tr><tr><td>4-year<\/td><td>5.3%<\/td><td>0.8251<\/td><\/tr><\/table><\/div><p>To gain further understanding of different derivative contracts, Jacobs met with Jonathan Widby, senior analyst with Smith and Associates. Widby made the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>N(d ) in the BSM is interpreted as the risk-neutral probability that a put option will expire in the<\/td><\/tr><tr><td>2<\/td><td><\/td><\/tr><tr><td>money.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>A call option on a dividend-paying stock can be valued using the BSM if we reduce the current<\/td><\/tr><tr><td>stock price by the present value of dividends expected over the life of the option.<\/td><td><\/td><\/tr><tr><td>Statement 3:<\/td><td>For options on currencies, the carry benefit is not a dividend but rather interest earned on a<\/td><\/tr><tr><td>deposit of the foreign currency.<\/td><td><\/td><\/tr><tr><td>Statement 4:<\/td><td>Under the Black model, a call option on futures is modeled as a portfolio containing a long bond<\/td><\/tr><tr><td>position and a short futures position.<\/td><td><\/td><\/tr><\/table><\/div><p>To offset any credit risk associated with the equity swap, Widby recommends using an index trade strategy by entering into a credit default swap (CDS) as a protection buyer. Widby&#x27;s strategy would involve purchasing credit protection on an index comprising largely the same issuers (companies) included in the equity index underlying the swap. Widby suggests the CDS should have a maturity equal to that of the swap to provide maximum credit protection.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best evaluates Widby&#x27;s suggested use of credit default swaps to offset the credit risk of the equity swap? Widby&#x27;s recommended strategy is:<\/p><\/div>", "subj": "derivatives"}, {"n": 55, "q": "Which property valuations are most likely to be heavily affected by their unique characteristics?", "opts": ["Property #1 and Property #2.", "Property #1 and Property #3.", "Property #2 and Property #3."], "ans": "C", "expl": "While almost any private equity real estate investment will be unique (if for no other reason than that they must be in different locations), residential properties tend to have the fewest unique characteristics. Transactions-based indices tend to be more useful for residential commercial property benchmarking than for nonresidential commercial properties due to the large amount of data required for many properties and the unique features of many nonresidential commercial properties. For Further Reference: (Study Session 15, Module 39.1, LOS 39.b)", "explhtml": "<p>While almost any private equity real estate investment will be unique (if for no other reason than that they must be in different locations), residential properties tend to have the fewest unique characteristics. Transactions-based indices tend to be more useful for residential commercial property benchmarking than for nonresidential commercial properties due to the large amount of data required for many properties and the unique features of many nonresidential commercial properties.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 39.1, LOS 39.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Questions 55 through 60 relate to Alternative Investments.<\/p><p>AI Partners Case Scenario<\/p><p>Julian Fuentes, CFA, analyzes real estate investments for AI Partners (AIP), a private equity real estate investment firm. Although AIP has primarily invested in nonresidential commercial property, they are considering a multi-family residential investment along with nonresidential commercial properties. Fuentes has been asked to prepare selected data on three potential investment properties. Fuentes&#x27;s results are presented in Exhibit 1.<\/p><p><b>Exhibit 1: Selected Property Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Property #1<\/td><td>Property #2<\/td><td>Property #3<\/td><td><\/td><\/tr><tr><td>Property type<\/td><td>Multi-Family Office Building Retail Center<\/td><td><\/td><td><\/td><\/tr><tr><td>Occupancy<\/td><td>93%<\/td><td>92%<\/td><td>95%<\/td><\/tr><tr><td>Square feet or #units<\/td><td>325 (u)<\/td><td>125,000 (sf)<\/td><td>315,000 (sf)<\/td><\/tr><tr><td>Gross potential rent<\/td><td>$3,900,000<\/td><td>$4,312,500<\/td><td>$2,765,850<\/td><\/tr><tr><td>Other income<\/td><td>$25,000<\/td><td>$440,000<\/td><td>$780,000<\/td><\/tr><tr><td>Potential gross income<\/td><td>$3,925,000<\/td><td>$4,752,500<\/td><td>$3,545,850<\/td><\/tr><tr><td>Vacancy loss<\/td><td>$273,000<\/td><td>$425,000<\/td><td>$138,293<\/td><\/tr><tr><td>Effective gross income<\/td><td>$3,652,000<\/td><td>$4,327,500<\/td><td>$3,407,557<\/td><\/tr><tr><td>Property management fees<\/td><td>$145,000<\/td><td>$172,500<\/td><td>$138,288<\/td><\/tr><tr><td>Other operating expenses<\/td><td>$1,800,500<\/td><td>$2,163,750<\/td><td>$1,703,800<\/td><\/tr><tr><td>Net operating income (NOI)<\/td><td>$1,706,500<\/td><td>$1,991,250<\/td><td>$1,565,469<\/td><\/tr><\/table><\/div><p>Other information:<\/p><p>1. Each property except Property #3 is located in an active market. 2. Property #2 is an older office building with architectural features characteristic of the period in which it was constructed. 3. Property #2 is located in an area that is undergoing extensive renovation.<\/p><p>Radna Margulies, AIP&#x27;s Chief Investment Officer, asks Fuentes to focus on the multi-family opportunity presented as Property #1. This request is based on her forecast of pent-up demand in the housing market. Fuentes forecasts net operating income for Property #1 for the first five years as presented in Exhibit 2. A list of discounted cash flow valuation assumptions for an equity-only transaction is presented in Exhibit 3.<\/p><p><b>Exhibit 2: Property #1—Net Operating Income Forecast<\/b><\/p><div class=\"tbl\"><table><tr><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><td>Year 5<\/td><td><\/td><\/tr><tr><td>NOI<\/td><td>$1,706,500<\/td><td>$1,774,760<\/td><td>$1,845,750<\/td><td>$1,919,580<\/td><td>$1,996,364<\/td><\/tr><\/table><\/div><p><b>Exhibit 3: Property #1—DCF Assumptions<\/b><\/p><div class=\"tbl\"><table><tr><td>Investment holding period<\/td><td>5 years<\/td><\/tr><\/table><\/div><p>Going-in capitalization rate 8.25%<\/p><p>Terminal capitalization rate 7.50%<\/p><div class=\"tbl\"><table><tr><td>Discount rate<\/td><td>9.50%<\/td><\/tr><tr><td>Income/value growth rate<\/td><td>Constant<\/td><\/tr><\/table><\/div><p>After reviewing valuation data for the three properties, Margulies requests that Fuentes discuss funding terms with Amiable Life Insurance Company (ALIC) for Property #1. Fuentes is offered a rate of 5.5%, interest only, on a 5-year term loan. ALIC stipulates a maximum loan-to-value (LTV) of 70% and minimum debt service coverage ratio of 1.5x.<\/p><p>Fuentes receives an appraisal of $30 million for the value for Property #1.<\/p><\/div><\/details><div class=\"qtext\"><p>Which property valuations are most likely to be heavily affected by their unique characteristics?<\/p><\/div>", "subj": "alternatives"}, {"n": 56, "q": "Which property is likely to have the greatest operational risk resulting from management expenses?", "opts": ["Property #1.", "Property #2.", "Property #3."], "ans": "C", "expl": "Commercial uses with higher management involvement, such as restaurants, hotels, shopping centers, also have higher operational risks. One way to check this given the specifics in this case is to look at management fees as a percentage of effective gross income for the three properties. Property #1 3.97% = ($145,000 / $3,652,000) Property #2 3.99% = ($172,500 / $4,327,500) Property #3 4.06% = ($138,288 / $3,407,557) Therefore, Property #3 would be expected to have greater operational risk. For Further Reference: (Study Session 15, Module 39.1, LOS 39.d)", "explhtml": "<p>Commercial uses with higher management involvement, such as restaurants, hotels, shopping centers, also have higher operational risks. One way to check this given the specifics in this case is to look at management fees as a percentage of effective gross income for the three properties.<\/p><p>Property #1 3.97% = ($145,000 / $3,652,000)<\/p><p>Property #2 3.99% = ($172,500 / $4,327,500)<\/p><p>Property #3 4.06% = ($138,288 / $3,407,557)<\/p><p>Therefore, Property #3 would be expected to have greater operational risk.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 39.1, LOS 39.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 55 through 60 relate to Alternative Investments.<\/p><p>AI Partners Case Scenario<\/p><p>Julian Fuentes, CFA, analyzes real estate investments for AI Partners (AIP), a private equity real estate investment firm. Although AIP has primarily invested in nonresidential commercial property, they are considering a multi-family residential investment along with nonresidential commercial properties. Fuentes has been asked to prepare selected data on three potential investment properties. Fuentes&#x27;s results are presented in Exhibit 1.<\/p><p><b>Exhibit 1: Selected Property Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Property #1<\/td><td>Property #2<\/td><td>Property #3<\/td><td><\/td><\/tr><tr><td>Property type<\/td><td>Multi-Family Office Building Retail Center<\/td><td><\/td><td><\/td><\/tr><tr><td>Occupancy<\/td><td>93%<\/td><td>92%<\/td><td>95%<\/td><\/tr><tr><td>Square feet or #units<\/td><td>325 (u)<\/td><td>125,000 (sf)<\/td><td>315,000 (sf)<\/td><\/tr><tr><td>Gross potential rent<\/td><td>$3,900,000<\/td><td>$4,312,500<\/td><td>$2,765,850<\/td><\/tr><tr><td>Other income<\/td><td>$25,000<\/td><td>$440,000<\/td><td>$780,000<\/td><\/tr><tr><td>Potential gross income<\/td><td>$3,925,000<\/td><td>$4,752,500<\/td><td>$3,545,850<\/td><\/tr><tr><td>Vacancy loss<\/td><td>$273,000<\/td><td>$425,000<\/td><td>$138,293<\/td><\/tr><tr><td>Effective gross income<\/td><td>$3,652,000<\/td><td>$4,327,500<\/td><td>$3,407,557<\/td><\/tr><tr><td>Property management fees<\/td><td>$145,000<\/td><td>$172,500<\/td><td>$138,288<\/td><\/tr><tr><td>Other operating expenses<\/td><td>$1,800,500<\/td><td>$2,163,750<\/td><td>$1,703,800<\/td><\/tr><tr><td>Net operating income (NOI)<\/td><td>$1,706,500<\/td><td>$1,991,250<\/td><td>$1,565,469<\/td><\/tr><\/table><\/div><p>Other information:<\/p><p>1. Each property except Property #3 is located in an active market. 2. Property #2 is an older office building with architectural features characteristic of the period in which it was constructed. 3. Property #2 is located in an area that is undergoing extensive renovation.<\/p><p>Radna Margulies, AIP&#x27;s Chief Investment Officer, asks Fuentes to focus on the multi-family opportunity presented as Property #1. This request is based on her forecast of pent-up demand in the housing market. Fuentes forecasts net operating income for Property #1 for the first five years as presented in Exhibit 2. A list of discounted cash flow valuation assumptions for an equity-only transaction is presented in Exhibit 3.<\/p><p><b>Exhibit 2: Property #1—Net Operating Income Forecast<\/b><\/p><div class=\"tbl\"><table><tr><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><td>Year 5<\/td><td><\/td><\/tr><tr><td>NOI<\/td><td>$1,706,500<\/td><td>$1,774,760<\/td><td>$1,845,750<\/td><td>$1,919,580<\/td><td>$1,996,364<\/td><\/tr><\/table><\/div><p><b>Exhibit 3: Property #1—DCF Assumptions<\/b><\/p><div class=\"tbl\"><table><tr><td>Investment holding period<\/td><td>5 years<\/td><\/tr><\/table><\/div><p>Going-in capitalization rate 8.25%<\/p><p>Terminal capitalization rate 7.50%<\/p><div class=\"tbl\"><table><tr><td>Discount rate<\/td><td>9.50%<\/td><\/tr><tr><td>Income/value growth rate<\/td><td>Constant<\/td><\/tr><\/table><\/div><p>After reviewing valuation data for the three properties, Margulies requests that Fuentes discuss funding terms with Amiable Life Insurance Company (ALIC) for Property #1. Fuentes is offered a rate of 5.5%, interest only, on a 5-year term loan. ALIC stipulates a maximum loan-to-value (LTV) of 70% and minimum debt service coverage ratio of 1.5x.<\/p><p>Fuentes receives an appraisal of $30 million for the value for Property #1.<\/p><\/div><\/details><div class=\"qtext\"><p>Which property is likely to have the greatest operational risk resulting from management expenses?<\/p><\/div>", "subj": "alternatives"}, {"n": 57, "q": "Which approach would an appraiser most likely use for valuing Property #2?", "opts": ["Cost approach.", "Income approach.", "Sales comparison approach."], "ans": "B", "expl": "Property #2 is an older office building with unique characteristics that could not be easily reproduced using current architectural designs and materials. Therefore, the cost approach would be less appropriate than the income approach as a basis for appraisal. The sales comparison approach would also be less suitable as the property is relatively unique. For Further Reference: (Study Session 15, Module 39.2, LOS 39.e)", "explhtml": "<p>Property #2 is an older office building with unique characteristics that could not be easily reproduced using current architectural designs and materials. Therefore, the cost approach would be less appropriate than the income approach as a basis for appraisal. The sales comparison approach would also be less suitable as the property is relatively unique.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 39.2, LOS 39.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 55 through 60 relate to Alternative Investments.<\/p><p>AI Partners Case Scenario<\/p><p>Julian Fuentes, CFA, analyzes real estate investments for AI Partners (AIP), a private equity real estate investment firm. Although AIP has primarily invested in nonresidential commercial property, they are considering a multi-family residential investment along with nonresidential commercial properties. Fuentes has been asked to prepare selected data on three potential investment properties. Fuentes&#x27;s results are presented in Exhibit 1.<\/p><p><b>Exhibit 1: Selected Property Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Property #1<\/td><td>Property #2<\/td><td>Property #3<\/td><td><\/td><\/tr><tr><td>Property type<\/td><td>Multi-Family Office Building Retail Center<\/td><td><\/td><td><\/td><\/tr><tr><td>Occupancy<\/td><td>93%<\/td><td>92%<\/td><td>95%<\/td><\/tr><tr><td>Square feet or #units<\/td><td>325 (u)<\/td><td>125,000 (sf)<\/td><td>315,000 (sf)<\/td><\/tr><tr><td>Gross potential rent<\/td><td>$3,900,000<\/td><td>$4,312,500<\/td><td>$2,765,850<\/td><\/tr><tr><td>Other income<\/td><td>$25,000<\/td><td>$440,000<\/td><td>$780,000<\/td><\/tr><tr><td>Potential gross income<\/td><td>$3,925,000<\/td><td>$4,752,500<\/td><td>$3,545,850<\/td><\/tr><tr><td>Vacancy loss<\/td><td>$273,000<\/td><td>$425,000<\/td><td>$138,293<\/td><\/tr><tr><td>Effective gross income<\/td><td>$3,652,000<\/td><td>$4,327,500<\/td><td>$3,407,557<\/td><\/tr><tr><td>Property management fees<\/td><td>$145,000<\/td><td>$172,500<\/td><td>$138,288<\/td><\/tr><tr><td>Other operating expenses<\/td><td>$1,800,500<\/td><td>$2,163,750<\/td><td>$1,703,800<\/td><\/tr><tr><td>Net operating income (NOI)<\/td><td>$1,706,500<\/td><td>$1,991,250<\/td><td>$1,565,469<\/td><\/tr><\/table><\/div><p>Other information:<\/p><p>1. Each property except Property #3 is located in an active market. 2. Property #2 is an older office building with architectural features characteristic of the period in which it was constructed. 3. Property #2 is located in an area that is undergoing extensive renovation.<\/p><p>Radna Margulies, AIP&#x27;s Chief Investment Officer, asks Fuentes to focus on the multi-family opportunity presented as Property #1. This request is based on her forecast of pent-up demand in the housing market. Fuentes forecasts net operating income for Property #1 for the first five years as presented in Exhibit 2. A list of discounted cash flow valuation assumptions for an equity-only transaction is presented in Exhibit 3.<\/p><p><b>Exhibit 2: Property #1—Net Operating Income Forecast<\/b><\/p><div class=\"tbl\"><table><tr><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><td>Year 5<\/td><td><\/td><\/tr><tr><td>NOI<\/td><td>$1,706,500<\/td><td>$1,774,760<\/td><td>$1,845,750<\/td><td>$1,919,580<\/td><td>$1,996,364<\/td><\/tr><\/table><\/div><p><b>Exhibit 3: Property #1—DCF Assumptions<\/b><\/p><div class=\"tbl\"><table><tr><td>Investment holding period<\/td><td>5 years<\/td><\/tr><\/table><\/div><p>Going-in capitalization rate 8.25%<\/p><p>Terminal capitalization rate 7.50%<\/p><div class=\"tbl\"><table><tr><td>Discount rate<\/td><td>9.50%<\/td><\/tr><tr><td>Income/value growth rate<\/td><td>Constant<\/td><\/tr><\/table><\/div><p>After reviewing valuation data for the three properties, Margulies requests that Fuentes discuss funding terms with Amiable Life Insurance Company (ALIC) for Property #1. Fuentes is offered a rate of 5.5%, interest only, on a 5-year term loan. ALIC stipulates a maximum loan-to-value (LTV) of 70% and minimum debt service coverage ratio of 1.5x.<\/p><p>Fuentes receives an appraisal of $30 million for the value for Property #1.<\/p><\/div><\/details><div class=\"qtext\"><p>Which approach would an appraiser most likely use for valuing Property #2?<\/p><\/div>", "subj": "alternatives"}, {"n": 58, "q": "Based on Exhibit 2 and Exhibit 3, the valuation for Property #1 based on the discounted cash flow approach will be closest to:", "opts": ["$22,798,000.", "$24,295,000.", "$24,633,000."], "ans": "B", "expl": "DCF valuation based on a required return of 9.5% is: NOI Present Value Year 1 $1,706,500 $1,558,447.49 Year 2 $1,774,760 $1,480,169.30 Year 3 $1,845,750 $1,405,822.60 Year 4 $1,919,580 $1,335,210.50 Year 5 $1,996,364 $1,268,145.64 Terminal value $27,150,550 $17,246,780.74 Property #1 value $24,294,576.27 Selected Calculation: Terminal value is computed by applying the terminal cap rate to NOI in year 6. To estimate NOI for year 6, we need a growth rate estimate. We are not given the growth rate directly, but given the discount rate of 9.5% and the terminal cap rate of 7.5%, we can estimate the growth rate to be 2%. Note: Make sure that you use the uneven cash flow function to compute NPV using your financial calculator. For Further Reference: (Study Session 15, Module 39.3, LOS 39.g)", "explhtml": "<p>DCF valuation based on a required return of 9.5% is:<\/p><div class=\"tbl\"><table><tr><td>NOI<\/td><td>Present Value<\/td><td><\/td><\/tr><tr><td>Year 1<\/td><td>$1,706,500<\/td><td>$1,558,447.49<\/td><\/tr><tr><td>Year 2<\/td><td>$1,774,760<\/td><td>$1,480,169.30<\/td><\/tr><tr><td>Year 3<\/td><td>$1,845,750<\/td><td>$1,405,822.60<\/td><\/tr><tr><td>Year 4<\/td><td>$1,919,580<\/td><td>$1,335,210.50<\/td><\/tr><tr><td>Year 5<\/td><td>$1,996,364<\/td><td>$1,268,145.64<\/td><\/tr><tr><td>Terminal value<\/td><td>$27,150,550 $17,246,780.74<\/td><td><\/td><\/tr><tr><td>Property #1 value<\/td><td>$24,294,576.27<\/td><td><\/td><\/tr><\/table><\/div><p>Selected Calculation:<\/p><p>Terminal value is computed by applying the terminal cap rate to NOI in year 6. To estimate NOI for year 6, we need a growth rate estimate. We are not given the growth rate directly, but given the discount rate of 9.5% and the terminal cap rate of 7.5%, we can estimate the growth rate to be 2%.<\/p><p>Note: Make sure that you use the uneven cash flow function to compute NPV using your financial calculator.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 39.3, LOS 39.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 55 through 60 relate to Alternative Investments.<\/p><p>AI Partners Case Scenario<\/p><p>Julian Fuentes, CFA, analyzes real estate investments for AI Partners (AIP), a private equity real estate investment firm. Although AIP has primarily invested in nonresidential commercial property, they are considering a multi-family residential investment along with nonresidential commercial properties. Fuentes has been asked to prepare selected data on three potential investment properties. Fuentes&#x27;s results are presented in Exhibit 1.<\/p><p><b>Exhibit 1: Selected Property Data<\/b><\/p><div class=\"tbl\"><table><tr><td>Property #1<\/td><td>Property #2<\/td><td>Property #3<\/td><td><\/td><\/tr><tr><td>Property type<\/td><td>Multi-Family Office Building Retail Center<\/td><td><\/td><td><\/td><\/tr><tr><td>Occupancy<\/td><td>93%<\/td><td>92%<\/td><td>95%<\/td><\/tr><tr><td>Square feet or #units<\/td><td>325 (u)<\/td><td>125,000 (sf)<\/td><td>315,000 (sf)<\/td><\/tr><tr><td>Gross potential rent<\/td><td>$3,900,000<\/td><td>$4,312,500<\/td><td>$2,765,850<\/td><\/tr><tr><td>Other income<\/td><td>$25,000<\/td><td>$440,000<\/td><td>$780,000<\/td><\/tr><tr><td>Potential gross income<\/td><td>$3,925,000<\/td><td>$4,752,500<\/td><td>$3,545,850<\/td><\/tr><tr><td>Vacancy loss<\/td><td>$273,000<\/td><td>$425
