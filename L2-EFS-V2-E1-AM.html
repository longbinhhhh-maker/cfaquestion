<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n": 1, "q": "According to CFA Institute Standards of Professional Conduct, Gillis may accept the invitation to attend the conference in Binaria without violating the Standards:", "opts": ["so long as she pays her own travel expenses and refuses the gift of emeralds.", "so long as she refuses the gift of emeralds.", "because she would be the guest of a sovereign government."], "ans": "B", "expl": "Standard I(B). Attending the conference would be appropriate, but Gillis must avoid any situation that would affect her independence in order to properly comply with Standard I(B) Professionalism – Independence and Objectivity. Since Binaria is remotely located, it is reasonable for the government to pay her travel expenses. However, the gift of emeralds must be refused. The fact that the host is a sovereign government does not matter—the obvious objective is to give the analysts a favorable bias toward the currency and the proposed reforms. For Further Reference: (Study Session 1, Module 2.1, LOS 2.a)", "explhtml": "<p>Standard I(B). Attending the conference would be appropriate, but Gillis must avoid any situation that would affect her independence in order to properly comply with Standard I(B) Professionalism – Independence and Objectivity. Since Binaria is remotely located, it is reasonable for the government to pay her travel expenses. However, the gift of emeralds must be refused. The fact that the host is a sovereign government does not matter—the obvious objective is to give the analysts a favorable bias toward the currency and the proposed reforms.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.1, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Trent, LLC Case Scenario<\/p><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will help support Binaria&#x27;s weakening currency. He is asking currency specialists from several of the largest foreign exchange banks to visit Binaria for a conference on the planned reforms. Because of its remote location, Binaria will pay all travel expenses of the attendees, as well as lodging in government-owned facilities in the capital city. As a further inducement, attendees will also receive small bags of uncut emeralds (because emeralds are a principal export of Binaria), with an estimated market value of $500.<\/p><p>Gillis has approximately 25 clients that she deals with regularly, most of whom are large financial institutions interested in trading currencies. One of the services Gillis provides to these clients is a weekly summary of important trends in the emerging market currencies she follows. Gillis talks to local government officials and reads research reports prepared by local analysts, which are paid for by Trent. These inputs, along with Gillis&#x27;s interpretation, form the basis of most of Gillis&#x27;s weekly reports.<\/p><p>Gillis decided to attend the conference in Binaria. In anticipation of a favorable reception for the proposed reforms, Gillis purchased a long Binaria currency position in her personal account before leaving on the trip. After hearing the finance minister&#x27;s proposals in person, however, she decides that the reforms are poorly timed and likely to cause the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gillis&#x27;s supervisor, Steve Howlett, CFA, has been reviewing Gillis&#x27;s personal trading. Howlett has not seen any details of the Binaria currency trade but has found two other instances in the past year where he believes Gillis has violated Trent&#x27;s written policies regarding trading in personal accounts.<\/p><p>One of the currency trading strategies employed by Trent is based on interest rate parity. Trent monitors spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Trent places trades to take advantage of the riskless arbitrage opportunity. Because Trent is such a large player in the exchange markets, its transactions costs are very low, and Trent is often able to take advantage of mispricings that are too small for others to capitalize on. In describing these trading opportunities to clients, Trent suggests that &quot;clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, Gillis may accept the invitation to attend the conference in Binaria without violating the Standards:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Given that Gillis's weekly reports to clients are market summaries rather than specific investment recommendations, what are her record-keeping obligations according to CFA Institute Standards of Professional Conduct? Gillis must:", "opts": ["maintain records of her conversations with local government officials and also keep copies of the research reports prepared by local analysts.", "only maintain records of her conversations with local government officials and her own summaries of the research reports prepared by local analysts.", "keep her own summaries of the research reports prepared by local analysts, but she has no obligation to maintain records of her conversations with local government officials."], "ans": "A", "expl": "Standard V(C). Gillis's reports may not be specific investment recommendations, but because they are client communications, she should keep either electronic or hard copy records of her conversations with the government officials and copies of the research reports she used in developing her weekly summary reports, in order to comply with Standard V(C ) Investment Analysis, Recommendations, and Actions – Record Retention. For Further Reference: (Study Session 1, Module 2.8, LOS 2.a)", "explhtml": "<p>Standard V(C). Gillis&#x27;s reports may not be specific investment recommendations, but because they are client communications, she should keep either electronic or hard copy records of her conversations with the government officials and copies of the research reports she used in developing her weekly summary reports, in order to comply with Standard V(C ) Investment Analysis, Recommendations, and Actions – Record Retention.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.8, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Trent, LLC Case Scenario<\/p><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will gies employed by Trent is based on interest rate parity. Trent monitors spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Trent places trades to take advantage of the riskless arbitrage opportunity. Because Trent is such a large player in the exchange markets, its transactions costs are very low, and Trent is often able to take advantage of mispricings that are too small for others to capitalize on. In describing these trading opportunities to clients, Trent suggests that &quot;clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Given that Gillis&#x27;s weekly reports to clients are market summaries rather than specific investment recommendations, what are her record-keeping obligations according to CFA Institute Standards of Professional Conduct? Gillis must:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Regarding Gillis's transactions in the Binaria currency, she has violated the Standards by:", "opts": ["taking the long position and by selling the position before issuing a recommendation to clients.", "selling the position before issuing the recommendation to clients, although taking the long position was not a violation.", "not disclosing the trades in her report because the trades are acceptable as long as they are disclosed."], "ans": "A", "expl": "Standard VI(B). Gillis is attempting to trade ahead of her employer and her clients in violation of the Standards. She was wrong to take the long position in anticipation of a positive recommendation and wrong to sell the position before issuing her negative recommendation. These trades were wrong regardless of whether they were disclosed. In accordance with Standard VI(B) Conflicts of Interest – Priority of Transactions, client interests must take precedence over personal interests. For Further Reference: (Study Session 1, Module 2.9, LOS 2.a)", "explhtml": "<p>Standard VI(B). Gillis is attempting to trade ahead of her employer and her clients in violation of the Standards. She was wrong to take the long position in anticipation of a positive recommendation and wrong to sell the position before issuing her negative recommendation. These trades were wrong regardless of whether they were disclosed. In accordance with Standard VI(B) Conflicts of Interest – Priority of Transactions, client interests must take precedence over personal interests.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.9, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Trent, LLC Case Scenario<\/p><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will help support Binaria&#x27;s weakening currency. He is asking currency specialists from several of the largest foreign exchange banks to visit Binaria for a conference on the planned reforms. Because of its remote location, Binaria will pay all travel expenses of the attendees, as well as lodging in government-owned facilities in the capital city. As a further inducement, attendees will also receive small bags of uncut emeralds (because emeralds are a principal export of Binaria), with an estimated market value of $500.<\/p><p>Gillis has approximately 25 clients that she deals with regularly, most of whom are large financial institutions interested in trading currencies. One of the services Gillis provides to these clients is a weekly summary of important trends in the emerging market currencies she follows. Gillis talks to local government officials and reads research reports prepared by local analysts, which are paid for by Trent. These inputs, along with Gillis&#x27;s interpretation, form the basis of most of Gillis&#x27;s weekly reports.<\/p><p>Gillis decided to attend the conference in Binaria. In anticipation of a favorable reception for the proposed reforms, Gillis purchased a long Binaria currency position in her personal account before leaving on the trip. After hearing the finance minister&#x27;s proposals in person, however, she decides that the reforms are poorly timed and likely to cause the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gillis&#x27;s supervisor, Steve Howlett, CFA, has been reviewing Gillis&#x27;s personal trading. Howlett has not seen any details of the Binaria currency trade but has found two other instances in the past year where he believes Gillis has violated Trent&#x27;s written policies regarding trading in personal accounts.<\/p><p>One of the currency trading strategies employed by Trent is based on interest rate parity. Trent monitors spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Trent places trades to take advantage of the riskless arbitrage opportunity. Because Trent is such a large player in the exchange markets, its transactions costs are very low, and Trent is often able to take advantage of mispricings that are too small for others to capitalize on. In describing these trading opportunities to clients, Trent suggests that &quot;clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Gillis&#x27;s transactions in the Binaria currency, she has violated the Standards by:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "According to CFA Institute Standards of Professional Conduct, Howlett's best course of action with regard to the suspected violations by Gillis would be to:", "opts": ["meet with Gillis in person, explain the nature of the violations, and seek assurances that such violations will not recur.", "warn Gillis to cease the trading activities and report the violation to Howlett’s supervisor immediately.", "place limits on Gillis’s personal trading and increase monitoring of Gillis’s personal trades."], "ans": "C", "expl": "Standard I(A). Warning Gillis and/or reporting the violation up Trout's management structure are inadequate solutions. Limiting the trading activity and increased monitoring to prevent future violations are more appropriate initial responses, in accordance with Standard I(A) Professionalism – Knowledge of the Law. For Further Reference: (Study Session 1, Module 2.1, LOS 2.a)", "explhtml": "<p>Standard I(A). Warning Gillis and/or reporting the violation up Trout&#x27;s management structure are inadequate solutions. Limiting the trading activity and increased monitoring to prevent future violations are more appropriate initial responses, in accordance with Standard I(A) Professionalism – Knowledge of the Law.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.1, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questi e the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gillis&#x27;s supervisor, Steve Howlett, CFA, has been reviewing Gillis&#x27;s personal trading. Howlett has not seen any details of the Binaria currency trade but has found two other instances in the past year where he believes Gillis has violated Trent&#x27;s written policies regarding trading in personal accounts.<\/p><p>One of the currency trading strategies employed by Trent is based on interest rate parity. Trent monitors spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Trent places trades to take advantage of the riskless arbitrage opportunity. Because Trent is such a large player in the exchange markets, its transactions costs are very low, and Trent is often able to take advantage of mispricings that are too small for others to capitalize on. In describing these trading opportunities to clients, Trent suggests that &quot;clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, Howlett&#x27;s best course of action with regard to the suspected violations by Gillis would be to:<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Based on the information given, and according to CFA Institute Standards, which of the following statements best describes Trent's compliance procedures relating to personal trading in foreign currencies? The compliance procedures:", "opts": ["appear adequate because Howlett was able to identify potential violations.", "appear adequate, but Howlett’s monitoring of Gillis’s trades indicates poor supervisory responsibility.", "should include both duplicate confirmations of transactions and preclearance procedures for personal trades."], "ans": "C", "expl": "Standard VI(B). The main problem in this case appears to be that there is no system to identify potential front-running violations before they occur. Standard VI(B) Conflicts of Interest – Priority of Transactions recommends both preclearance of trades and duplicate trade confirmations as procedures for compliance. For Further Reference: (Study Session 1, Module 2.9, LOS 2.a)", "explhtml": "<p>Standard VI(B). The main problem in this case appears to be that there is no system to identify potential front-running violations before they occur. Standard VI(B) Conflicts of Interest – Priority of Transactions recommends both preclearance of trades and duplicate trade confirmations as procedures for compliance.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.9, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Trent, LLC Case Scenario<\/p><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will help support Binaria&#x27;s weakening currency. He is asking currency specialists from several of the largest foreign exchange banks to visit Binaria for a conference on the planned reforms. Because of its remote location, Binaria will pay all travel expenses of the attendees, as well as lodging in government-owned facilities in the capital city. As a further inducement, attendees will also receive small bags of uncut emeralds (because emeralds are a principal export of Binaria), with an estimated market value of $500.<\/p><p>Gillis has approximately 25 clients that she deals with regularly, most of whom are large financial institutions interested in trading currencies. One of the services Gillis provides to these clients is a weekly summary of important trends in the emerging market currencies she follows. Gillis talks to local government officials and reads research reports prepared by local analysts, which are paid for by Trent. These inputs, along with Gillis&#x27;s interpretation, form the basis of most of Gillis&#x27;s weekly reports.<\/p><p>Gillis decided to attend the conference in Binaria. In anticipation of a favorable reception for the proposed reforms, Gillis purchased a long Binaria currency position in her personal account before leaving on the trip. After hearing the finance minister&#x27;s proposals in person, however, she decides that the reforms are poorly timed and likely to cause the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gillis&#x27;s supervisor, Steve Howlett, CFA, has been reviewing Gillis&#x27;s personal trading. Howlett has not seen any details of the Binaria currency trade but has found two other instances in the past year where he believes Gillis has violated Trent&#x27;s written policies regarding trading in personal accounts.<\/p><p>One of the currency trading strategies employed by Trent is based on interest rate parity. Trent monitors spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Trent places trades to take advantage of the riskless arbitrage opportunity. Because Trent is such a large player in the exchange markets, its transactions costs are very low, and Trent is often able to take advantage of mispricings that are too small for others to capitalize on. In describing these trading opportunities to clients, Trent suggests that &quot;clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information given, and according to CFA Institute Standards, which of the following statements best describes Trent&#x27;s compliance procedures relating to personal trading in foreign currencies? The compliance procedures:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Trent's arbitrage trading based on interest rate parity is successful mostly due to Trent's large size, which provides it with an advantage relative to smaller, competing currency trading firms. Has Trent violated CFA Institute Standards of Professional Conduct with respect to its trading strategy or its guarantee of results?", "opts": ["The trading strategy and guarantee of results are both violations of CFA Institute Standards.", "The trading strategy is legitimate and does not violate CFA Institute Standards, but the guarantee of investment return is a violation of Standards.", "Both the trading strategy and guarantee statement comply with CFA Institute Standards."], "ans": "C", "expl": "Standards II(B) and V(B). The strategy based on interest rate parity would provide riskless profits until the prices moved into equilibrium and the forward rates accurately reflected the interest rate differentials. Trout's guarantee is therefore accurate. The low transaction costs available to Trout are a competitive advantage that can be exploited without violating Standard II(B). For Further Reference: (Study Session 1, Module 2.3, LOS 2.a)", "explhtml": "<p>Standards II(B) and V(B). The strategy based on interest rate parity would provide riskless profits until the prices moved into equilibrium and the forward rates accurately reflected the interest rate differentials. Trout&#x27;s guarantee is therefore accurate. The low transaction costs available to Trout are a competitive advantage that can be exploited without violating Standard II(B).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.3, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 1 through 6 relate to Ethical and Professional Standards.<\/p><p>Trent, LLC Case Scenario<\/p><p>Martha Gillis, CFA, trades currencies for Trent, LLC. Trent is one of the largest investment firms in the world, and its foreign currency department trades more currency on a daily basis than any other firm. Gillis specializes in currencies of emerging nations.<\/p><p>Gillis received an invitation from the new finance minister of Binaria, one of the emerging nations included in Gillis&#x27;s portfolio. The minister has proposed a number of fiscal reforms that he hopes will help support Binaria&#x27;s weakening currency. He is asking currency specialists from several of the largest foreign exchange banks to visit Binaria for a conference on the planned reforms. Because of its remote location, Binaria will pay all travel expenses of the attendees, as well as lodging in government-owned facilities in the capital city. As a further inducement, attendees will also receive small bags of uncut emeralds (because emeralds are a principal export of Binaria), with an estimated market value of $500.<\/p><p>Gillis has approximately 25 clients that she deals with regularly, most of whom are large financial institutions interested in trading currencies. One of the services Gillis provides to these clients is a weekly summary of important trends in the emerging market currencies she follows. Gillis talks to local government officials and reads research reports prepared by local analysts, which are paid for by Trent. These inputs, along with Gillis&#x27;s interpretation, form the basis of most of Gillis&#x27;s weekly reports.<\/p><p>Gillis decided to attend the conference in Binaria. In anticipation of a favorable reception for the proposed reforms, Gillis purchased a long Binaria currency position in her personal account before leaving on the trip. After hearing the finance minister&#x27;s proposals in person, however, she decides that the reforms are poorly timed and likely to cause the currency to depreciate. She issues a negative recommendation upon her return. Before issuing the recommendation, she liquidates the long position in her personal account but does not take a short position.<\/p><p>Gillis&#x27;s supervisor, Steve Howlett, CFA, has been reviewing Gillis&#x27;s personal trading. Howlett has not seen any details of the Binaria currency trade but has found two other instances in the past year where he believes Gillis has violated Trent&#x27;s written policies regarding trading in personal accounts.<\/p><p>One of the currency trading strategies employed by Trent is based on interest rate parity. Trent monitors spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Trent places trades to take advantage of the riskless arbitrage opportunity. Because Trent is such a large player in the exchange markets, its transactions costs are very low, and Trent is often able to take advantage of mispricings that are too small for others to capitalize on. In describing these trading opportunities to clients, Trent suggests that &quot;clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Trent&#x27;s arbitrage trading based on interest rate parity is successful mostly due to Trent&#x27;s large size, which provides it with an advantage relative to smaller, competing currency trading firms. Has Trent violated CFA Institute Standards of Professional Conduct with respect to its trading strategy or its guarantee of results?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "The yen cost to Carr of buying NT$10 million is closest to:", "opts": ["¥3,077,000.", "¥32,453,000.", "¥32,490,000."], "ans": "C", "expl": "We want to convert ¥ to NT$ (via USD). Since we are not given the starting ¥ position, we start with a hypothetical ¥1,000 contract size. The quotes given are $/¥ and $/NT$. To convert ¥ to $ (i.e., going \"up the quote\") use the bid price (and multiply). To convert from $ to NT$ we use the offer price (and divide). Step 1: Convert 1,000 yen to USD at $0.008852 to obtain 1,000 × 0.008852 = $8.852. Step 2: Convert $8.852 to NT$ at $0.02876 to get 8.852 / 0.02876 = NT$ 307.7886. Now, we want NT$ 10 million or 10,000,000 / 307.7886 = 32,489.8323 ¥ contracts or ¥32,489,832. Alternatively, we can calculate the NT$/Yen cross rate as 0.307789-0.308142. To convert Yen to NT$ (going up the quote, use bid price and multiply): Yen × 0.307789 = NT$ 10,000,000 Yen = 10,000,000 / 0.307789 = 32,489,790. For Further Reference: (Study Session 4, Module 10.1, LOS 10.b)", "explhtml": "<p>We want to convert ¥ to NT$ (via USD). Since we are not given the starting ¥ position, we start with a hypothetical ¥1,000 contract size. The quotes given are $/¥ and $/NT$. To convert ¥ to $ (i.e., going &quot;up the quote&quot;) use the bid price (and multiply). To convert from $ to NT$ we use the offer price (and divide).<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Convert 1,000 yen to USD at $0.008852 to obtain 1,000 × 0.008852 = $8.852.<\/td><\/tr><tr><td>Step 2:<\/td><td>Convert $8.852 to NT$ at $0.02876 to get 8.852 / 0.02876 = NT$ 307.7886.<\/td><\/tr><\/table><\/div><p>Now, we want NT$ 10 million or 10,000,000 / 307.7886 = 32,489.8323 ¥ contracts or ¥32,489,832.<\/p><p>Alternatively, we can calculate the NT$/Yen cross rate as 0.307789-0.308142.<\/p><p>To convert Yen to NT$ (going up the quote, use bid price and multiply):<\/p><p>Yen × 0.307789 = NT$ 10,000,000<\/p><p>Yen = 10,000,000 / 0.307789 = 32,489,790.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.1, LOS 10.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Economics.<\/p><p>Summit Consulting Case Scenario Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852-56 for the yen and $0.02874-6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><p>Another of Summit&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming initial capital of $1 million. He asks Surratt to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Surratt has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><\/table><\/div><p>Three-month interest rate for U.S. dollars (annualized) 18.0%<\/p><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Surrat about the impact of such a deficit on the value of the Bun. Surrat states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor 1:<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><tr><td>Factor 2:<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><tr><td>Factor 3:<\/td><td>The response of import and export demand to changes in import and export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The yen cost to Carr of buying NT$10 million is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 8, "q": "Are Surratt and Castillo correct with regard to their statements concerning the currency bid-ask spreads?", "opts": ["Only Surratt is correct.", "Only Castillo is correct.", "Both Surratt and Castillo are correct."], "ans": "A", "expl": "Surratt is correct. Market conditions affect currency spreads such that the bid-ask spread on foreign currency quotations increases as exchange rate volatility (uncertainty) increases. In this example, an economic crisis in the Asian markets would create uncertainty, thereby impacting the $/¥ and $/NT$ exchange rates and increasing the bid-ask spread. Castillo is incorrect. Bank and other currency dealer positions are not considered to directly impact the size of foreign currency spreads. In this example, it is true that the dealer would likely reduce her yen ask (selling price) if she wanted to unload an excess inventory of yen. However, the dealer would also probably reduce her bid (buying price) so that she did not buy any additional yen. The result would be that the spread would remain relatively unchanged. For Further Reference: (Study Session 4, Module 10.1, LOS 10.a)", "explhtml": "<p>Surratt is correct. Market conditions affect currency spreads such that the bid-ask spread on foreign currency quotations increases as exchange rate volatility (uncertainty) increases. In this example, an economic crisis in the Asian markets would create uncertainty, thereby impacting the $/¥ and $/NT$ exchange rates and increasing the bid-ask spread.<\/p><p>Castillo is incorrect. Bank and other currency dealer positions are not considered to directly impact the size of foreign currency spreads.<\/p><p>In this example, it is true that the dealer would likely reduce her yen ask (selling price) if she wanted to unload an excess inventory of yen. However, the dealer would also probably reduce her bid (buying price) so that she did not buy any additional yen. The result would be that the spread would remain relatively unchanged.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.1, LOS 10.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Economics.<\/p><p>Summit Consulting Case Scenario Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852-56 for the yen and $0.02874-6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><p>Another of Summit&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming initial capital of $1 million. He asks Surratt to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Surratt has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%<\/td><\/tr><tr><td>Three-month inflation rate in the U.S. (annualized)<\/td><td>6.0%<\/td><\/tr><tr><td>Three-month interest rate for SF (annualized)<\/td><td>12.0%<\/td><\/tr><\/table><\/div><p>Three-month interest rate for U.S. dollars (annualized) 18.0%<\/p><p>Ponder has a carry trade open involving the Bun (the currency of Bundovia). Ponder notices that Bundovia has a current account deficit and asks Surrat about the impact of such a deficit on the value of the Bun. Surrat states that the impact on the Bun depends on three factors:<\/p><div class=\"tbl\"><table><tr><td>Factor 1:<\/td><td>The expected size of the current account deficit in the future.<\/td><\/tr><tr><td>Factor 2:<\/td><td>The influence of exchange rates on domestic prices.<\/td><\/tr><tr><td>Factor 3:<\/td><td>The response of import and export demand to changes in import and export prices.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Are Surratt and Castillo correct with regard to their statements concerning the currency bid-ask spreads?<\/p><\/div>", "subj": "economics"}, {"n": 9, "q": "Evaluate Surratt's statements concerning the impact of monetary policy on currency values. Surratt is:", "opts": ["correct.", "incorrect, because restrictive monetary policy in the United States would lead to a lower value of the dollar.", "incorrect, because restrictive U.S. monetary policy would be matched by foreign governments."], "ans": "A", "expl": "Surratt is correct. Under the Mundell-Fleming model, restrictive monetary policy reduces the growth rate of the money supply and will lead to appreciation of a country's currency. Restrictive monetary policy will increase the interest rate and, consequently, the demand for domestic physical and financial assets. This increase in financial inflows (increase in the financial account) increases the demand for the domestic currency for investment purposes leading to its appreciation. Choice C is incorrect because we are given in the vignette that the foreign interest rates remain constant. For Further Reference: (Study Session 4, Module 10.3, LOS 10.k)", "explhtml": "<p>Surratt is correct. Under the Mundell-Fleming model, restrictive monetary policy reduces the growth rate of the money supply and will lead to appreciation of a country&#x27;s currency. Restrictive monetary policy will increase the interest rate and, consequently, the demand for domestic physical and financial assets. This increase in financial inflows (increase in the financial account) increases the demand for the domestic currency for investment purposes leading to its appreciation. Choice C is incorrect because we are given in the vignette that the foreign interest rates remain constant.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.3, LOS 10.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 7 through 12 relate to Economics.<\/p><p>Summit Consulting Case Scenario Jill Surratt, CFA, and Elizabeth Castillo, CFA, are analysts for Summit Consulting. Summit provides investment advice to hedge funds and actively managed investment funds throughout the United States and Canada.<\/p><p>Surratt and Castillo have a client, Tom Carr, who is interested in increasing his returns from foreign currency positions. Carr currently has a position in Japanese yen (¥) that he wishes to convert to Taiwanese dollars (NT$) because he thinks the Taiwanese currency will appreciate in the near term. He does not have a quote for yen in terms of the NT$ but has received quotes for both currencies in terms of the U.S. dollar. The quotes are $0.008852-56 for the yen and $0.02874-6 for the Taiwanese dollar. He would like to purchase NT$10 million.<\/p><p>In discussing these quotes, Surratt notes that the bid-ask spread is affected by many factors. She states that if an economic crisis were expected in the Asian markets, then the bid-ask spread of the currency quotes should widen. Castillo states that if a dealer wished to unload an excess inventory of yen, the typical response would be to lower her ask for the yen, thereby narrowing the bid-ask spread.<\/p><p>In regards to changes in currency values, Surratt states that under the Mundell-Fleming model, if the U.S. Federal Reserve restricts the growth of the money supply and foreign interest rates remain constant, then the interest rate differential (U.S. interest rate minus counter currency interest rate) should increase, thereby increasing the value of the dollar.<\/p><p>In addition to using monetary policy, Summit Consulting uses anticipated changes in fiscal policy to forecast exchange rates and the balance of payments for Canada. Castillo states that, under the Mundell-Fleming model, if the Canadian government were to unexpectedly reduce the budget deficit, then this should have a positive impact on the value of the Canadian dollar in the short run because foreigners would have more confidence in the Canadian economy.<\/p><p>Another of Summit&#x27;s clients is Jack Ponder. Ponder would like to investigate the possibility of using covered interest arbitrage to earn risk-free profits over the next three months, assuming initial capital of $1 million. He asks Surratt to gather information on the inflation rates, interest rates, spot rates, and forward rates for the U.S. dollar and the Swiss franc (SF). Surratt has also used technical analysis to obtain a projection of the future spot rate for the two countries&#x27; currencies. The information is presented as follows.<\/p><div class=\"tbl\"><table><tr><td>Spot rate<\/td><td>$0.85 / SF<\/td><\/tr><tr><td>Three-month forward rate (as of today) for SF<\/td><td>$0.80 / SF<\/td><\/tr><tr><td>Expected spot rate three months from now<\/td><td>$0.60 / SF<\/td><\/tr><tr><td>Three-month inflation rate in Switzerland (annualized)<\/td><td>2.0%
