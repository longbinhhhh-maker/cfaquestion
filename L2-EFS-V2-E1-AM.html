Study Session 7, Module 21.1, LOS 21.d)", "explhtml": "<div class=\"tbl\"><table><tr><td>ΔP = D(1 − T ) / (1 − T<\/td><td>) = 2.25(1 − 0.15) / (1 − 0.396) = 3.17<\/td><\/tr><tr><td>D<\/td><td>CG<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 21.1, LOS 21.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 25 through 30 relate to Corporate Finance.<\/p><p>MavsHD Case Scenario<\/p><p>Donnie Nelson, CFA, has just taken over as chief financial officer of MavsHD, a high-tech company that delivers high- definition technology to a broad-based group of sports enthusiasts. MavsHD has 40% debt and 60% equity in its capital structure. For the year just ended, net income and dividends for MavsHD were $145 million and $21.75 million, respectively. The consensus estimate for net income at the end of the current year is $153 million. The company&#x27;s current book value is $550 million. MavsHD&#x27;s stock is currently trading on the NYSE for a price of $50 per share and has been steadily decreasing for the past 12 months.<\/p><p>MavsHD has gone through its pioneer and growth phases and is now settling in to the early stages of maturity. The business model is starting to shift from relying almost exclusively on new customers to retaining and satisfying existing customers. The previously experienced very high growth rate has slowed considerably. Nelson believes that shareholder composition has changed over time as well, favoring shareholders who have a greater interest in dividend stability than in explosive growth. In the past, however, the firm has favored a low dividend rate due to the availability of attractive internal investment opportunities.<\/p><p>Nelson wants to develop an optimal dividend policy for MavsHD that will create the most value for the shareholders and at the same time protect corporate assets. He is concerned, however, that there is sometimes a disconnect between an optimal dividend policy and how actual dividend rates are perceived in the marketplace. Nelson is preparing a recommendation to senior management and the board of directors regarding the firm&#x27;s dividend policy going forward. Nelson is considering recommending that MavsHD engage in a stock repurchase plan and repurchase 1.5 million shares of the 12.75 million shares outstanding. This repurchase would eliminate any need to increase the cash dividend payout. Other managers at the firm, besides Nelson, believe MavsHD should increase its dividend and gravitate toward what they perceive to be the target payout ratio over the next eight years. Thus, at the end of the current year, the firm would increase the dividend payment by $250,000 over the dividend in the prior year.<\/p><p>During the board meeting, two of the directors raised concerns over Nelson&#x27;s proposed repurchase plan. The directors&#x27; comments follow:<\/p><div class=\"tbl\"><table><tr><td>Director 1:<\/td><td>I support the repurchase plan, especially relative to varying our dividend. Firms should not vary<\/td><\/tr><tr><td>dividends—this lowers investors&#x27; confidence and can adversely impact the firm&#x27;s cost of equity<\/td><td><\/td><\/tr><tr><td>and its share price.<\/td><td><\/td><\/tr><tr><td>Director 2:<\/td><td>A share repurchase does not take away the uncertainty associated with future stock value.<\/td><\/tr><tr><td>According to the bird-in-the-hand theory, investors prefer higher dividends because capital gains<\/td><td><\/td><\/tr><tr><td>are uncertain. The theory states that if we increase our dividend payout, the value of MavsHD<\/td><td><\/td><\/tr><tr><td>equity will increase. Thus, I propose a dividend increase rather than a repurchase.<\/td><td><\/td><\/tr><\/table><\/div><p>One of the board members, Jason Neely, proposed an alternative dividend policy plan one week after the meeting at which Nelson presented his plan. Neely&#x27;s proposal involves utilizing a residual dividend model. Neely rationalizes his plan by claiming that relative to a stable dividend policy, his proposal would increase the volatility of dollar dividends paid to shareholders but would simultaneously increase the firm&#x27;s ability to exploit value additive investment projects using internally generated funds. Because of this enhanced access to value additive projects, MavsHD&#x27;s cost of equity capital will experience a marginal decrease, which will further increase the overall value of the firm.<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that MavsHD&#x27;s marginal investor is in a 39.6% tax bracket for capital gains and a 15% tax bracket for dividends. If MavsHD declares a dividend of $2.25 per share, the change in MavsHD&#x27;s stock price when the stock goes ex-dividend will be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 28, "q": "In light of the fact that several different groups of investors hold shares in MavsHD, evaluate the directors' comments regarding Nelson's proposed stock repurchase plan.", "opts": ["Only Director 1 is correct.", "Only Director 2 is correct.", "Both Director 1 and Director 2 are correct."], "ans": "C", "expl": "Investors do not like instability in the dividends paid by a company. Any volatility in dividends is seen as a negative sign by investors, and the company's stock price would be punished as a result of varying dividends. According to the bird-in-the- hand theory, investors prefer the assurance of receiving a higher dividend today rather than waiting for returns in the form of capital appreciation. Because of the uncertainty associated with capital appreciation and the relative certainty of dividends, the bird-in-the-hand theory predicts that investors will reward dividend paying companies with a lower cost of equity and, thus, a higher equity value. A repurchase does not provide the same type of assurance since it is an unpredictable and possibly one-time event. For Further Reference: (Study Session 7, Module 21.1, LOS 21.b, 21.c, 21.g)", "explhtml": "<p>Investors do not like instability in the dividends paid by a company. Any volatility in dividends is seen as a negative sign by investors, and the company&#x27;s stock price would be punished as a result of varying dividends. According to the bird-in-the- hand theory, investors prefer the assurance of receiving a higher dividend today rather than waiting for returns in the form of capital appreciation. Because of the uncertainty associated with capital appreciation and the relative certainty of dividends, the bird-in-the-hand theory predicts that investors will reward dividend paying companies with a lower cost of equity and, thus, a higher equity value. A repurchase does not provide the same type of assurance since it is an unpredictable and possibly one-time event.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 21.1, LOS 21.b, 21.c, 21.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 25 through 30 relate to Corporate Finance.<\/p><p>MavsHD Case Scenario<\/p><p>Donnie Nelson, CFA, has just taken over as chief financial officer of MavsHD, a high-tech company that delivers high- definition technology to a broad-based group of sports enthusiasts. MavsHD has 40% debt and 60% equity in its capital structure. For the year just ended, net income and dividends for MavsHD were $145 million and $21.75 million, respectively. The consensus estimate for net income at the end of the current year is $153 million. The company&#x27;s current book value is $550 million. MavsHD&#x27;s stock is currently trading on the NYSE for a price of $50 per share and has been steadily decreasing for the past 12 months.<\/p><p>MavsHD has gone through its pioneer and growth phases and is now settling in to the early stages of maturity. The business model is starting to shift from relying almost exclusively on new customers to retaining and satisfying existing customers. The previously experienced very high growth rate has slowed considerably. Nelson believes that shareholder composition has changed over time as well, favoring shareholders who have a greater interest in dividend stability than in explosive growth. In the past, however, the firm has favored a low dividend rate due to the availability of attractive internal investment opportunities.<\/p><p>Nelson wants to develop an optimal dividend policy for MavsHD that will create the most value for the shareholders and at the same time protect corporate assets. He is concerned, however, that there is sometimes a disconnect between an optimal dividend policy and how actual dividend rates are perceived in the marketplace. Nelson is preparing a recommendation to senior management and the board of directors regarding the firm&#x27;s dividend policy going forward. Nelson is considering recommending that MavsHD engage in a stock repurchase plan and repurchase 1.5 million shares of the 12.75 million shares outstanding. This repurchase would eliminate any need to increase the cash dividend payout. Other managers at the firm, besides Nelson, believe MavsHD should increase its dividend and gravitate toward what they perceive to be the target payout ratio over the next eight years. Thus, at the end of the current year, the firm would increase the dividend payment by $250,000 over the dividend in the prior year.<\/p><p>During the board meeting, two of the directors raised concerns over Nelson&#x27;s proposed repurchase plan. The directors&#x27; comments follow:<\/p><div class=\"tbl\"><table><tr><td>Director 1:<\/td><td>I support the repurchase plan, especially relative to varying our dividend. Firms should not vary<\/td><\/tr><tr><td>dividends—this lowers investors&#x27; confidence and can adversely impact the firm&#x27;s cost of equity<\/td><td><\/td><\/tr><tr><td>and its share price.<\/td><td><\/td><\/tr><tr><td>Director 2:<\/td><td>A share repurchase does not take away the uncertainty associated with future stock value.<\/td><\/tr><tr><td>According to the bird-in-the-hand theory, investors prefer higher dividends because capital gains<\/td><td><\/td><\/tr><tr><td>are uncertain. The theory states that if we increase our dividend payout, the value of MavsHD<\/td><td><\/td><\/tr><tr><td>equity will increase. Thus, I propose a dividend increase rather than a repurchase.<\/td><td><\/td><\/tr><\/table><\/div><p>One of the board members, Jason Neely, proposed an alternative dividend policy plan one week after the meeting at which Nelson presented his plan. Neely&#x27;s proposal involves utilizing a residual dividend model. Neely rationalizes his plan by claiming that relative to a stable dividend policy, his proposal would increase the volatility of dollar dividends paid to shareholders but would simultaneously increase the firm&#x27;s ability to exploit value additive investment projects using internally generated funds. Because of this enhanced access to value additive projects, MavsHD&#x27;s cost of equity capital will experience a marginal decrease, which will further increase the overall value of the firm.<\/p><\/div><\/details><div class=\"qtext\"><p>In light of the fact that several different groups of investors hold shares in MavsHD, evaluate the directors&#x27; comments regarding Nelson&#x27;s proposed stock repurchase plan.<\/p><\/div>", "subj": "corporate"}, {"n": 29, "q": "If MavsHD plans to make $160 million in net investments in the current year, what will be the company's dividend payout ratio using the residual dividend model?", "opts": ["37.3%.", "58.2%.", "62.8%."], "ans": "A", "expl": "If the company plans on spending $160 million on net investments, then only 60% of the funds need to come from retained earnings. Therefore, MavsHD needs 0.6 × 160 = $96 million in retained earnings. Net income is projected to be $153 million, leaving $57 million (153 − 96) available to pay dividends. Thus, the dividend payout ratio would equal 57 / 153 = 37.3%. For Further Reference: (Study Session 7, Module 21.2, LOS 21.g)", "explhtml": "<p>If the company plans on spending $160 million on net investments, then only 60% of the funds need to come from retained earnings. Therefore, MavsHD needs 0.6 × 160 = $96 million in retained earnings. Net income is projected to be $153 million, leaving $57 million (153 − 96) available to pay dividends. Thus, the dividend payout ratio would equal 57 / 153 = 37.3%.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 21.2, LOS 21.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 25 through 30 relate to Corporate Finance.<\/p><p>MavsHD Case Scenario<\/p><p>Donnie Nelson, CFA, has just taken over as chief financial officer of MavsHD, a high-tech company that delivers high- definition technology to a broad-based group of sports enthusiasts. MavsHD has 40% debt and 60% equity in its capital structure. For the year just ended, net income and dividends for MavsHD were $145 million and $21.75 million, respectively. The consensus estimate for net income at the end of the current year is $153 million. The company&#x27;s current book value is $550 million. MavsHD&#x27;s stock is currently trading on the NYSE for a price of $50 per share and has been steadily decreasing for the past 12 months.<\/p><p>MavsHD has gone through its pioneer and growth phases and is now settling in to the early stages of maturity. The business model is starting to shift from relying almost exclusively on new customers to retaining and satisfying existing customers. The previously experienced very high growth rate has slowed considerably. Nelson believes that shareholder composition has changed over time as well, favoring shareholders who have a greater interest in dividend stability than in explosive growth. In the past, however, the firm has favored a low dividend rate due to the availability of attractive internal investment opportunities.<\/p><p>Nelson wants to develop an optimal dividend policy for MavsHD that will create the most value for the shareholders and at the same time protect corporate assets. He is concerned, however, that there is sometimes a disconnect between an optimal dividend policy and how actual dividend rates are perceived in the marketplace. Nelson is preparing a recommendation to senior management and the board of directors regarding the firm&#x27;s dividend policy going forward. Nelson is considering recommending that MavsHD engage in a stock repurchase plan and repurchase 1.5 million shares of the 12.75 million shares outstanding. This repurchase would eliminate any need to increase the cash dividend payout. Other managers at the firm, besides Nelson, believe MavsHD should increase its dividend and gravitate toward what they perceive to be the target payout ratio over the next eight years. Thus, at the end of the current year, the firm would increase the dividend payment by $250,000 over the dividend in the prior year.<\/p><p>During the board meeting, two of the directors raised concerns over Nelson&#x27;s proposed repurchase plan. The directors&#x27; comments follow:<\/p><div class=\"tbl\"><table><tr><td>Director 1:<\/td><td>I support the repurchase plan, especially relative to varying our dividend. Firms should not vary<\/td><\/tr><tr><td>dividends—this lowers investors&#x27; confidence and can adversely impact the firm&#x27;s cost of equity<\/td><td><\/td><\/tr><tr><td>and its share price.<\/td><td><\/td><\/tr><tr><td>Director 2:<\/td><td>A share repurchase does not take away the uncertainty associated with future stock value.<\/td><\/tr><tr><td>According to the bird-in-the-hand theory, investors prefer higher dividends because capital gains<\/td><td><\/td><\/tr><tr><td>are uncertain. The theory states that if we increase our dividend payout, the value of MavsHD<\/td><td><\/td><\/tr><tr><td>equity will increase. Thus, I propose a dividend increase rather than a repurchase.<\/td><td><\/td><\/tr><\/table><\/div><p>One of the board members, Jason Neely, proposed an alternative dividend policy plan one week after the meeting at which Nelson presented his plan. Neely&#x27;s proposal involves utilizing a residual dividend model. Neely rationalizes his plan by claiming that relative to a stable dividend policy, his proposal would increase the volatility of dollar dividends paid to shareholders but would simultaneously increase the firm&#x27;s ability to exploit value additive investment projects using internally generated funds. Because of this enhanced access to value additive projects, MavsHD&#x27;s cost of equity capital will experience a marginal decrease, which will further increase the overall value of the firm.<\/p><\/div><\/details><div class=\"qtext\"><p>If MavsHD plans to make $160 million in net investments in the current year, what will be the company&#x27;s dividend payout ratio using the residual dividend model?<\/p><\/div>", "subj": "corporate"}, {"n": 30, "q": "Evaluate Neely's comments about his proposed residual dividend plan. Neely's comments are:", "opts": ["correct.", "incorrect, because the equity cost of capital would not decrease under the proposed plan.", "incorrect, because the firm would not have greater access to internal funds for investment."], "ans": "B", "expl": "Under a residual dividend policy, a firm determines the optimal capital budget and then uses retained earnings to fund the optimal capital budget, paying out what is left over to shareholders. Because the amount of distributable earnings is not known in advance and is determined as a function of the capital budget, the dollar dividend paid to shareholders will fluctuate widely from year to year. However, the firm will be able to use internally generated funds to a greater extent when deciding how to fund the optimal capital budget. It is not true, however, that the residual dividend policy will reduce the firm's cost of capital. Investors do not like unpredictable dividends and will penalize the company in the form of a higher required return on equity to compensate for the additional uncertainty related to dividend payments. For Further Reference: (Study Session 7, Module 21.2, LOS 21.g)", "explhtml": "<p>Under a residual dividend policy, a firm determines the optimal capital budget and then uses retained earnings to fund the optimal capital budget, paying out what is left over to shareholders. Because the amount of distributable earnings is not known in advance and is determined as a function of the capital budget, the dollar dividend paid to shareholders will fluctuate widely from year to year. However, the firm will be able to use internally generated funds to a greater extent when deciding how to fund the optimal capital budget. It is not true, however, that the residual dividend policy will reduce the firm&#x27;s cost of capital. Investors do not like unpredictable dividends and will penalize the company in the form of a higher required return on equity to compensate for the additional uncertainty related to dividend payments.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 21.2, LOS 21.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 25 through 30 relate to Corporate Finance.<\/p><p>MavsHD Case Scenario<\/p><p>Donnie Nelson, CFA, has just taken over as chief financial officer of MavsHD, a high-tech company that delivers high- definition technology to a broad-based group of sports enthusiasts. MavsHD has 40% debt and 60% equity in its capital structure. For the year just ended, net income and dividends for MavsHD were $145 million and $21.75 million, respectively. The consensus estimate for net income at the end of the current year is $153 million. The company&#x27;s current book value is $550 million. MavsHD&#x27;s stock is currently trading on the NYSE for a price of $50 per share and has been steadily decreasing for the past 12 months.<\/p><p>MavsHD has gone through its pioneer and growth phases and is now settling in to the early stages of maturity. The business model is starting to shift from relying almost exclusively on new customers to retaining and satisfying existing customers. The previously experienced very high growth rate has slowed considerably. Nelson believes that shareholder composition has changed over time as well, favoring shareholders who have a greater interest in dividend stability than in explosive growth. In the past, however, the firm has favored a low dividend rate due to the availability of attractive internal investment opportunities.<\/p><p>Nelson wants to develop an optimal dividend policy for MavsHD that will create the most value for the shareholders and at the same time protect corporate assets. He is concerned, however, that there is sometimes a disconnect between an optimal dividend policy and how actual dividend rates are perceived in the marketplace. Nelson is preparing a recommendation to senior management and the board of directors regarding the firm&#x27;s dividend policy going forward. Nelson is considering recommending that MavsHD engage in a stock repurchase plan and repurchase 1.5 million shares of the 12.75 million shares outstanding. This repurchase would eliminate any need to increase the cash dividend payout. Other managers at the firm, besides Nelson, believe MavsHD should increase its dividend and gravitate toward what they perceive to be the target payout ratio over the next eight years. Thus, at the end of the current year, the firm would increase the dividend payment by $250,000 over the dividend in the prior year.<\/p><p>During the board meeting, two of the directors raised concerns over Nelson&#x27;s proposed repurchase plan. The directors&#x27; comments follow:<\/p><div class=\"tbl\"><table><tr><td>Director 1:<\/td><td>I support the repurchase plan, especially relative to varying our dividend. Firms should not vary<\/td><\/tr><tr><td>dividends—this lowers investors&#x27; confidence and can adversely impact the firm&#x27;s cost of equity<\/td><td><\/td><\/tr><tr><td>and its share price.<\/td><td><\/td><\/tr><tr><td>Director 2:<\/td><td>A share repurchase does not take away the uncertainty associated with future stock value.<\/td><\/tr><tr><td>According to the bird-in-the-hand theory, investors prefer higher dividends because capital gains<\/td><td><\/td><\/tr><tr><td>are uncertain. The theory states that if we increase our dividend payout, the value of MavsHD<\/td><td><\/td><\/tr><tr><td>equity will increase. Thus, I propose a dividend increase rather than a repurchase.<\/td><td><\/td><\/tr><\/table><\/div><p>One of the board members, Jason Neely, proposed an alternative dividend policy plan one week after the meeting at which Nelson presented his plan. Neely&#x27;s proposal involves utilizing a residual dividend model. Neely rationalizes his plan by claiming that relative to a stable dividend policy, his proposal would increase the volatility of dollar dividends paid to shareholders but would simultaneously increase the firm&#x27;s ability to exploit value additive investment projects using internally generated funds. Because of this enhanced access to value additive projects, MavsHD&#x27;s cost of equity capital will experience a marginal decrease, which will further increase the overall value of the firm.<\/p><\/div><\/details><div class=\"qtext\"><p>Evaluate Neely&#x27;s comments about his proposed residual dividend plan. Neely&#x27;s comments are:<\/p><\/div>", "subj": "corporate"}, {"n": 31, "q": "Using the information in Exhibit 1, estimate the P/E ratio for Flavia Stores using EPS estimated with the method of historical average EPS. The P/E ratio is closest to:", "opts": ["18.4.", "20.6.", "27.9."], "ans": "B", "expl": "Normalizing EPS using the method of average EPS is accomplished by averaging the EPS over the six-year period from 2010–2015: EPS(normalized) = (1.90 + 1.65 + 0.99 + 1.35 + 0.77 + 1.04) / 6 = 1.283. The P/E ratio based on this normalized EPS is 26.5 / 1.283 = 20.649. For Further Reference: (Study Session 11, Module 29.1, LOS 29.e)", "explhtml": "<p>Normalizing EPS using the method of average EPS is accomplished by averaging the EPS over the six-year period from 2010–2015:<\/p><p>EPS(normalized) = (1.90 + 1.65 + 0.99 + 1.35 + 0.77 + 1.04) / 6 = 1.283. The P/E ratio based on this normalized EPS is 26.5 / 1.283 = 20.649.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.1, LOS 29.e)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Questions 31 through 36 relate to Equity Valuation.<\/p><p>Arnaud Aims Case Scenario<\/p><p>Arnaud Aims is assisting with the analysis of several firms in the retail department store industry. Because one of the industry members, Flavia Stores, has negative earnings for the current year, Aims wishes to normalize earnings to establish more meaningful P/E ratios. For the current year (2016) and six previous years, selected financial data are given below. All data are in euros.<\/p><p><b>Exhibit 1: Selected Financial Data for Flavia Stores, 2010–2016<\/b><\/p><div class=\"tbl\"><table><tr><td>2016<\/td><td>2015<\/td><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td>2010<\/td><td><\/td><\/tr><tr><td>Earnings per share<\/td><td>(1.05)<\/td><td>1.90<\/td><td>1.65<\/td><td>0.99<\/td><td>1.35<\/td><td>0.77<\/td><td>1.04<\/td><\/tr><tr><td>Book value per share<\/td><td>9.11<\/td><td>10.66<\/td><td>9.26<\/td><td>8.11<\/td><td>7.62<\/td><td>6.77<\/td><td>6.50<\/td><\/tr><tr><td>Return on equity<\/td><td>(0.115) 0.178 0.178 0.122 0.177 0.114 0.160<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Aims wishes to estimate normalized EPS for 2016 using two different methods, the method of historical average EPS and the method of average rate of return on equity. He will leave 2016 EPS and ROI out of his estimates. Based on his normalized EPS estimates, he will compute a trailing P/E for 2016. The stock price for Flavia Stores is €26.50.<\/p><p>Aims is also looking at price-to-book ratios as an alternative to price-to-earnings ratios. Three of the advantages of P/B ratios that Aims recalls are as follows:<\/p><div class=\"tbl\"><table><tr><td>Advantage 1:<\/td><td>Because book value is a cumulative balance sheet account encompassing several years, book<\/td><\/tr><tr><td>value is more likely than EPS to be positive.<\/td><td><\/td><\/tr><tr><td>Advantage 2:<\/td><td>For many companies, especially service companies, human capital is more important than<\/td><\/tr><tr><td>physical capital as an operating asset.<\/td><td><\/td><\/tr><tr><td>Advantage 3:<\/td><td>Book value represents the historical purchase cost of assets, as well as accumulated accounting<\/td><\/tr><tr><td>depreciation expenses. Inflation and technological changes can drive a wedge between the book<\/td><td><\/td><\/tr><tr><td>value and market value of assets.<\/td><td><\/td><\/tr><\/table><\/div><p>Aims used a constant growth DDM to establish a justified P/E ratio based on forecasted fundamentals. One of his associates asked Aims whether he could easily establish a justified price-to-sales (P/S) ratio and price-to-book (P/B) ratio from his justified P/E ratio.<\/p><p>Aims replied, &quot;I could do this fairly easily. If I multiply the trailing P/E ratio times the net profit margin, the ratio of net income to sales, the result will be the P/S ratio. If I multiply the leading P/E ratio times the return on equity, the ratio of net income to beginning book value of equity, the result will be the P/B ratio.&quot;<\/p><p>Aims&#x27;s associate likes to use the price-earnings-to-growth (PEG) ratio because it appears to address the effect of growth on the P/E ratio. For example, if a firm&#x27;s P/E ratio is 20 and its forecasted 5-year growth rate is 10%, the PEG ratio is 2.0. The associate likes to invest in firms that have an above-industry-average PEG ratio. The associate also says that he likes to invest in firms whose leading P/E is greater than its trailing P/E. Aims tells the associate that he would like to further investigate these two investment criteria.<\/p><p>Finally, Aims makes two comments to his associate about valuation ratios based on EBITDA and on dividends.<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>EBITDA is a pre-interest-expense figure, so I prefer a ratio of total equity value to EBITDA over a<\/td><\/tr><tr><td>ratio of enterprise value to EBITDA.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>Dividend yields are useful information because they are one component of total return. However,<\/td><\/tr><tr><td>they can be an incomplete measure of return, because investors trade off future earnings growth<\/td><td><\/td><\/tr><tr><td>to receive higher current dividends.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1, estimate the P/E ratio for Flavia Stores using EPS estimated with the method of historical average EPS. The P/E ratio is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "Using the information in Exhibit 1, estimate the P/E ratio for Flavia Stores using EPS estimated with the method of average return on equity. The P/E ratio is closest to:", "opts": ["16.0.", "18.8.", "25.0." }, {"n": 35, "q": "When Aims further investigates the two investment criteria (the PEG ratio and the comparison between the trailing and leading P/E ratio), should he find his colleague's use of them to be appropriate?", "opts": ["No.", "The PEG ratio criterion is appropriate, but the P/E ratio criterion is not.", "The P/E ratio criterion is appropriate, but the PEG ratio criterion is not."], "ans": "A", "expl": "Both criteria are poorly applied by the associate. Generally, a lower PEG ratio is considered desirable, not a higher one. The difference in the trailing and leading P/E ratios could be due to transitory elements in the current year's income in the denominator of the trailing P/E. In a constant growth model (admittedly a strong assumption), the leading P/E will naturally be smaller than the trailing P/E because earnings are growing by g. For Further Reference: (Study Session 11, Module 29.1, LOS 29.e, 29.r)", "explhtml": "<p>Both criteria are poorly applied by the associate. Generally, a lower PEG ratio is considered desirable, not a higher one. The difference in the trailing and leading P/E ratios could be due to transitory elements in the current year&#x27;s income in the denominator of the trailing P/E. In a constant growth model (admittedly a strong assumption), the leading P/E will naturally be smaller than the trailing P/E because earnings are growing by g.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.1, LOS 29.e, 29.r)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 31 through 36 relate to Equity Valuation.<\/p><p>Arnaud Aims Case Scenario<\/p><p>Arnaud Aims is assisting with the analysis of several firms in the retail department store industry. Because one of the industry members, Flavia Stores, has negative earnings for the current year, Aims wishes to normalize earnings to establish more meaningful P/E ratios. For the current year (2016) and six previous years, selected financial data are given below. All data are in euros.<\/p><p><b>Exhibit 1: Selected Financial Data for Flavia Stores, 2010–2016<\/b><\/p><div class=\"tbl\"><table><tr><td>2016<\/td><td>2015<\/td><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td>2010<\/td><td><\/td><\/tr><tr><td>Earnings per share<\/td><td>(1.05)<\/td><td>1.90<\/td><td>1.65<\/td><td>0.99<\/td><td>1.35<\/td><td>0.77<\/td><td>1.04<\/td><\/tr><tr><td>Book value per share<\/td><td>9.11<\/td><td>10.66<\/td><td>9.26<\/td><td>8.11<\/td><td>7.62<\/td><td>6.77<\/td><td>6.50<\/td><\/tr><tr><td>Return on equity<\/td><td>(0.115) 0.178 0.178 0.122 0.177 0.114 0.160<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Aims wishes to estimate normalized EPS for 2016 using two different methods, the method of historical average EPS and the method of average rate of return on equity. He will leave 2016 EPS and ROI out of his estimates. Based on his normalized EPS estimates, he will compute a trailing P/E for 2016. The stock price for Flavia Stores is €26.50.<\/p><p>Aims is also looking at price-to-book ratios as an alternative to price-to-earnings ratios. Three of the advantages of P/B ratios that Aims recalls are as follows:<\/p><div class=\"tbl\"><table><tr><td>Advantage 1:<\/td><td>Because book value is a cumulative balance sheet account encompassing several years, book<\/td><\/tr><tr><td>value is more likely than EPS to be positive.<\/td><td><\/td><\/tr><tr><td>Advantage 2:<\/td><td>For many companies, especially service companies, human capital is more important than<\/td><\/tr><tr><td>physical capital as an operating asset.<\/td><td><\/td><\/tr><tr><td>Advantage 3:<\/td><td>Book value represents the historical purchase cost of assets, as well as accumulated accounting<\/td><\/tr><tr><td>depreciation expenses. Inflation and technological changes can drive a wedge between the book<\/td><td><\/td><\/tr><tr><td>value and market value of assets.<\/td><td><\/td><\/tr><\/table><\/div><p>Aims used a constant growth DDM to establish a justified P/E ratio based on forecasted fundamentals. One of his associates asked Aims whether he could easily establish a justified price-to-sales (P/S) ratio and price-to-book (P/B) ratio from his justified P/E ratio.<\/p><p>Aims replied, &quot;I could do this fairly easily. If I multiply the trailing P/E ratio times the net profit margin, the ratio of net income to sales, the result will be the P/S ratio. If I multiply the leading P/E ratio times the return on equity, the ratio of net income to beginning book value of equity, the result will be the P/B ratio.&quot;<\/p><p>Aims&#x27;s associate likes to use the price-earnings-to-growth (PEG) ratio because it appears to address the effect of growth on the P/E ratio. For example, if a firm&#x27;s P/E ratio is 20 and its forecasted 5-year growth rate is 10%, the PEG ratio is 2.0. The associate likes to invest in firms that have an above-industry-average PEG ratio. The associate also says that he likes to invest in firms whose leading P/E is greater than its trailing P/E. Aims tells the associate that he would like to further investigate these two investment criteria.<\/p><p>Finally, Aims makes two comments to his associate about valuation ratios based on EBITDA and on dividends.<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>EBITDA is a pre-interest-expense figure, so I prefer a ratio of total equity value to EBITDA over a<\/td><\/tr><tr><td>ratio of enterprise value to EBITDA.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>Dividend yields are useful information because they are one component of total return. However,<\/td><\/tr><tr><td>they can be an incomplete measure of return, because investors trade off future earnings growth<\/td><td><\/td><\/tr><tr><td>to receive higher current dividends.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>When Aims further investigates the two investment criteria (the PEG ratio and the comparison between the trailing and leading P/E ratio), should he find his colleague&#x27;s use of them to be appropriate?<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "Are Aims's two comments about the dividend yield and EBITDA ratios correct?", "opts": ["Yes.", "No. The comment about EBITDA ratios is correct, but the comment about dividend yields is incorrect.", "No. The comment about dividend yields is correct, but the comment about EBITDA ratios is incorrect."], "ans": "C", "expl": "Comment 1 about EBITDA ratios is incorrect. EBITDA is a pre-interest variable, so it is a flow available to all suppliers of capital, not just common shareholders. The comment about dividend yields is reasonable. For Further Reference: (Study Session 11, Module 29.4, LOS 29.m, 29.n)", "explhtml": "<p>Comment 1 about EBITDA ratios is incorrect. EBITDA is a pre-interest variable, so it is a flow available to all suppliers of capital, not just common shareholders. The comment about dividend yields is reasonable.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 29.4, LOS 29.m, 29.n)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 31 through 36 relate to Equity Valuation.<\/p><p>Arnaud Aims Case Scenario<\/p><p>Arnaud Aims is assisting with the analysis of several firms in the retail department store industry. Because one of the industry members, Flavia Stores, has negative earnings for the current year, Aims wishes to normalize earnings to establish more meaningful P/E ratios. For the current year (2016) and six previous years, selected financial data are given below. All data are in euros.<\/p><p><b>Exhibit 1: Selected Financial Data for Flavia Stores, 2010–2016<\/b><\/p><div class=\"tbl\"><table><tr><td>2016<\/td><td>2015<\/td><td>2014<\/td><td>2013<\/td><td>2012<\/td><td>2011<\/td><td>2010<\/td><td><\/td><\/tr><tr><td>Earnings per share<\/td><td>(1.05)<\/td><td>1.90<\/td><td>1.65<\/td><td>0.99<\/td><td>1.35<\/td><td>0.77<\/td><td>1.04<\/td><\/tr><tr><td>Book value per share<\/td><td>9.11<\/td><td>10.66<\/td><td>9.26<\/td><td>8.11<\/td><td>7.62<\/td><td>6.77<\/td><td>6.50<\/td><\/tr><tr><td>Return on equity<\/td><td>(0.115) 0.178 0.178 0.122 0.177 0.114 0.160<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Aims wishes to estimate normalized EPS for 2016 using two different methods, the method of historical average EPS and the method of average rate of return on equity. He will leave 2016 EPS and ROI out of his estimates. Based on his normalized EPS estimates, he will compute a trailing P/E for 2016. The stock price for Flavia Stores is €26.50.<\/p><p>Aims is also looking at price-to-book ratios as an alternative to price-to-earnings ratios. Three of the advantages of P/B ratios that Aims recalls are as follows:<\/p><div class=\"tbl\"><table><tr><td>Advantage 1:<\/td><td>Because book value is a cumulative balance sheet account encompassing several years, book<\/td><\/tr><tr><td>value is more likely than EPS to be positive.<\/td><td><\/td><\/tr><tr><td>Advantage 2:<\/td><td>For many companies, especially service companies, human capital is more important than<\/td><\/tr><tr><td>physical capital as an operating asset.<\/td><td><\/td><\/tr><tr><td>Advantage 3:<\/td><td>Book value represents the historical purchase cost of assets, as well as accumulated accounting<\/td><\/tr><tr><td>depreciation expenses. Inflation and technological changes can drive a wedge between the book<\/td><td><\/td><\/tr><tr><td>value and market value of assets.<\/td><td><\/td><\/tr><\/table><\/div><p>Aims used a constant growth DDM to establish a justified P/E ratio based on forecasted fundamentals. One of his associates asked Aims whether he could easily establish a justified price-to-sales (P/S) ratio and price-to-book (P/B) ratio from his justified P/E ratio.<\/p><p>Aims replied, &quot;I could do this fairly easily. If I multiply the trailing P/E ratio times the net profit margin, the ratio of net income to sales, the result will be the P/S ratio. If I multiply the leading P/E ratio times the return on equity, the ratio of net income to beginning book value of equity, the result will be the P/B ratio.&quot;<\/p><p>Aims&#x27;s associate likes to use the price-earnings-to-growth (PEG) ratio because it appears to address the effect of growth on the P/E ratio. For example, if a firm&#x27;s P/E ratio is 20 and its forecasted 5-year growth rate is 10%, the PEG ratio is 2.0. The associate likes to invest in firms that have an above-industry-average PEG ratio. The associate also says that he likes to invest in firms whose leading P/E is greater than its trailing P/E. Aims tells the associate that he would like to further investigate these two investment criteria.<\/p><p>Finally, Aims makes two comments to his associate about valuation ratios based on EBITDA and on dividends.<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>EBITDA is a pre-interest-expense figure, so I prefer a ratio of total equity value to EBITDA over a<\/td><\/tr><tr><td>ratio of enterprise value to EBITDA.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>Dividend yields are useful information because they are one component of total return. However,<\/td><\/tr><tr><td>they can be an incomplete measure of return, because investors trade off future earnings growth<\/td><td><\/td><\/tr><tr><td>to receive higher current dividends.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Are Aims&#x27;s two comments about the dividend yield and EBITDA ratios correct?<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Regarding the statements made by McDonnell on the comparison of private firms and public firms, are both statements correct?", "opts": ["Yes.", "No, both statements are incorrect.", "No, one statement is correct, but the other statement is incorrect."], "ans": "C", "expl": "Statement 1: McDonnell is correct. Private firms are usually smaller than public firms and, thus, thought to be riskier. Accordingly, private firms are usually assigned higher risk premiums and required returns than public firms. The lack of access to liquid public equity markets can also limit a private firm's growth. Statement 2: McDonnell is correct that small private firms may not be able to attract as many qualified applicants for top positions as public firms. This may reduce the depth of management, slow growth, and increase risk at private firms. She is, however, incorrect that private firm managers and investors have a shorter-term view. Public firm shareholders often focus on short-term measures such as quarterly earnings and the consistency of such. Public management may therefore take a shorter-term view than they otherwise would. So it is private firms that should be able to take a longer-term view. Furthermore, in most private firms, management has substantial equity ownership. In this case, external shareholders cannot exert as much control, and the firm may be able to take a longer-term perspective. For Further Reference: (Study Session 11, Module 31.1, LOS 31.a)", "explhtml": "<p>Statement 1: McDonnell is correct. Private firms are usually smaller than public firms and, thus, thought to be riskier. Accordingly, private firms are usually assigned higher risk premiums and required returns than public firms. The lack of access to liquid public equity markets can also limit a private firm&#x27;s growth.<\/p><p>Statement 2: McDonnell is correct that small private firms may not be able to attract as many qualified applicants for top positions as public firms. This may reduce the depth of management, slow growth, and increase risk at private firms. She is, however, incorrect that private firm managers and investors have a shorter-term view. Public firm shareholders often focus on short-term measures such as quarterly earnings and the consistency of such. Public management may therefore take a shorter-term view than they otherwise would. So it is private firms that should be able to take a longer-term view.<\/p><p>Furthermore, in most private firms, management has substantial equity ownership. In this case, external shareholders cannot exert as much control, and the firm may be able to take a longer-term perspective.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 31.1, LOS 31.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Thorngate Ventures Case Scenario<\/p><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in and subsequently actively manages its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms because<\/td><\/tr><tr><td>private firms are usually smaller and thus thought to be riskier. Furthermore, the lack of access to<\/td><td><\/td><\/tr><tr><td>liquid public equity markets can limit a private firm&#x27;s growth.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants<\/td><\/tr><tr><td>for top positions as public firms. Due to the higher risk, the managers they do attract tend to have<\/td><td><\/td><\/tr><tr><td>a shorter-term view of the firm and their tenure at the firm, compared to public firm managers. As<\/td><td><\/td><\/tr><tr><td>a result, the private firm may neglect profitable long-term projects.<\/td><td><\/td><\/tr><\/table><\/div><p>Due to its considerable success, Thorngate has recently attracted a substantial inflow of capital from investors. To deploy that capital, McDonnell and Lutge are considering the purchase of Albion Biotechnology. Albion is using advances in biotechnology for application in the pharmaceutical field. The analysts are primarily interested in Albion because the firm&#x27;s research team is developing a drug that Thorngate&#x27;s current pharmaceutical firm is also working on. McDonnell estimates that combining research teams would result in advances that no pharmaceutical competitor could match for at least two years. The firm is currently owned by its founders, who are familiar to Lutge through previous social contacts. Lutge hopes to avoid a competitive bidding process for the firm, because its founders have not publicly advertised the firm&#x27;s sale.<\/p><p>McDonnell is also examining the prospects of Balanced Metals, a metal fabrication firm. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide needed exposure. The growth in sales at Balanced has been impressive recently, but it is expected to slow considerably in the years ahead due to increased competition from overseas firms. The firm&#x27;s most valuable assets are its equipment and factory, located in a prime industrial area.<\/p><p>Balanced was previously considered for possible purchase by a competitor in the metal fabrication industry. Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained the following financial figures from the Balanced Metals CFO, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will equal depreciation plus approximately 4% of the firm&#x27;s incremental revenues. McDonnell wants to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>Lutge is valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years. However, given its size and private status, Lutge does not expect that Jensen can be easily sold. To obtain the appropriate price multiple for the Jensen valuation, he has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Lutge estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Lutge uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Lutge obtains a size premium using the smallest-firm-size decile of the database. McDonnell examines Lutge&#x27;s cost of capital calculations and makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>I am concerned about the use of this database. The estimate of the size premium may result in<\/td><\/tr><tr><td>an undervaluation of the Jensen equity interest.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The use of betas and the CAPM from the database may be inappropriate. If so, Lutge should<\/td><\/tr><tr><td>consider using the build-up method whereby an industry risk premium is used instead of beta.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding the statements made by McDonnell on the comparison of private firms and public firms, are both statements correct?<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "Which of the following best describes the standard of value that McDonnell and Lutge will apply to Albion Biotechnology?", "opts": ["Market value.", "Intrinsic value.", "Investment value."], "ans": "C", "expl": "McDonnell and Lutge will use the investment value of Albion Biotechnology to determine what the firm is worth to Thorngate. Investment value is the value to a specific buyer and may be different for each investor due to different cash flow estimates, perceived firm risk, discount rates, financing costs, and synergies that lead to decreased costs. Market value is frequently used in real estate and other real asset appraisals where the purchase will be levered. Intrinsic value is the value that should be the market value once other investors arrive at this \"true\" value. McDonnell and Lutge are determining the firm's value to Thorngate. The firm is not publicly traded so there is no market for its shares at the present time. Furthermore, combining Albion with Thorngate's current pharmaceutical firm would result in advances that no pharmaceutical competitor could match. The synergies appear to be unavailable to other potential buyers (i.e., the value that McDonnell and Lutge will determine is specific to Thorngate and is not a value determined in a market of many buyers and sellers). For Further Reference: (Study Session 11, Module 31.1, LOS 31.c)", "explhtml": "<p>McDonnell and Lutge will use the investment value of Albion Biotechnology to determine what the firm is worth to Thorngate. Investment value is the value to a specific buyer and may be different for each investor due to different cash flow estimates, perceived firm risk, discount rates, financing costs, and synergies that lead to decreased costs.<\/p><p>Market value is frequently used in real estate and other real asset appraisals where the purchase will be levered. Intrinsic value is the value that should be the market value once other investors arrive at this &quot;true&quot; value.<\/p><p>McDonnell and Lutge are determining the firm&#x27;s value to Thorngate. The firm is not publicly traded so there is no market for its shares at the present time.<\/p><p>Furthermore, combining Albion with Thorngate&#x27;s current pharmaceutical firm would result in advances that no pharmaceutical competitor could match. The synergies appear to be unavailable to other potential buyers (i.e., the value that McDonnell and Lutge will determine is specific to Thorngate and is not a value determined in a market of many buyers and sellers).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 31.1, LOS 31.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Thorngate Ventures Case Scenario<\/p><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in and subsequently actively manages its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms because<\/td><\/tr><tr><td>private firms are usually smaller and thus thought to be riskier. Furthermore, the lack of access to<\/td><td><\/td><\/tr><tr><td>liquid public equity markets can limit a private firm&#x27;s growth.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants<\/td><\/tr><tr><td>for top positions as public firms. Due to the higher risk, the managers they do attract tend to have<\/td><td><\/td><\/tr><tr><td>a shorter-term view of the firm and their tenure at the firm, compared to public firm managers. As<\/td><td><\/td><\/tr><tr><td>a result, the private firm may neglect profitable long-term projects.<\/td><td><\/td><\/tr><\/table><\/div><p>Due to its considerable success, Thorngate has recently attracted a substantial inflow of capital from investors. To deploy that capital, McDonnell and Lutge are considering the purchase of Albion Biotechnology. Albion is using advances in biotechnology for application in the pharmaceutical field. The analysts are primarily interested in Albion because the firm&#x27;s research team is developing a drug that Thorngate&#x27;s current pharmaceutical firm is also working on. McDonnell estimates that combining research teams would result in advances that no pharmaceutical competitor could match for at least two years. The firm is currently owned by its founders, who are familiar to Lutge through previous social contacts. Lutge hopes to avoid a competitive bidding process for the firm, because its founders have not publicly advertised the firm&#x27;s sale.<\/p><p>McDonnell is also examining the prospects of Balanced Metals, a metal fabrication firm. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide needed exposure. The growth in sales at Balanced has been impressive recently, but it is expected to slow considerably in the years ahead due to increased competition from overseas firms. The firm&#x27;s most valuable assets are its equipment and factory, located in a prime industrial area.<\/p><p>Balanced was previously considered for possible purchase by a competitor in the metal fabrication industry. Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained the following financial figures from the Balanced Metals CFO, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will equal depreciation plus approximately 4% of the firm&#x27;s incremental revenues. McDonnell wants to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>Lutge is valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years. However, given its size and private status, Lutge does not expect that Jensen can be easily sold. To obtain the appropriate price multiple for the Jensen valuation, he has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Lutge estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Lutge uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Lutge obtains a size premium using the smallest-firm-size decile of the database. McDonnell examines Lutge&#x27;s cost of capital calculations and makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>I am concerned about the use of this database. The estimate of the size premium may result in<\/td><\/tr><tr><td>an undervaluation of the Jensen equity interest.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The use of betas and the CAPM from the database may be inappropriate. If so, Lutge should<\/td><\/tr><tr><td>consider using the build-up method whereby an industry risk premium is used instead of beta.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the standard of value that McDonnell and Lutge will apply to Albion Biotechnology?<\/p><\/div>", "subj": "equity"}, {"n": 39, "q": "Which of the following is closest to the FCFF that McDonnell should estimate for Balanced Metals?", "opts": ["–$117,800.", "$344,120.", "$722,120."], "ans": "A", "expl": "In a strategic transaction, a firm is acquired based in part on the synergies it brings to the acquirer. A financial transaction occurs when there are no synergies. The previous suitor of Balanced, a competitor in the same industry, was a strategic buyer and could realize the synergistic cost savings of $1,200,000. Thorngate currently does not own a manufacturing firm, so it would be a financial buyer. Thorngate will not be able to realize any synergistic cost savings, so t ergies. The previous suitor of Balanced, a competitor in the same industry, was a strategic buyer and could realize the synergistic cost savings of $1,200,000.<\/p><p>Thorngate currently does not own a manufacturing firm, so it would be a financial buyer. Thorngate will not be able to realize any synergistic cost savings, so these are not included in the free cash flow to the firm (FCFF) estimates in the following tables.<\/p><p>The calculations are as follows. Pro Forma Income Statement<\/p><div class=\"tbl\"><table><tr><td>Revenues<\/td><td>$23,540,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$17,655,000<\/td><\/tr><tr><td>Gross profit<\/td><td>$5,885,000<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Pro forma EBITDA<\/td><td>$485,000<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>$235,400<\/td><\/tr><tr><td>Pro forma EBIT<\/td><td>$249,600<\/td><\/tr><tr><td>Pro forma taxes on EBIT<\/td><td>$74,880<\/td><\/tr><tr><td>Operating income after tax<\/td><td>$174,720<\/td><\/tr><\/table><\/div><p>Adjustments to Obtain FCFF<\/p><div class=\"tbl\"><table><tr><td>Plus: Depreciation and amortization<\/td><td>$235,400<\/td><\/tr><tr><td>Minus: Capital expenditures<\/td><td>$297,000<\/td><\/tr><tr><td>Minus: Increase in working capital<\/td><td>$231,000<\/td><\/tr><tr><td>FCFF<\/td><td>–$117,880<\/td><\/tr><\/table><\/div><p>The following provides a line-by-line explanation for the previous calculations.<\/p><div class=\"tbl\"><table><tr><td>Pro Forma Income Statement<\/td><td>Explanation<\/td><\/tr><tr><td>Current revenues times the growth rate:<\/td><td><\/td><\/tr><\/table><\/div><p>Revenues $22,000,000 × (1.07)<\/p><p>Revenues times one minus the gross profit margin: Cost of goods sold $23,540,000 × (1 − 0.25)<\/p><p>Revenues times the gross profit margin: Gross profit $23,540,000 × 0.25<\/p><div class=\"tbl\"><table><tr><td>SG&amp;A expenses<\/td><td>Given in the question<\/td><\/tr><tr><td>Gross profit minus SG&amp;A expenses:<\/td><td><\/td><\/tr><\/table><\/div><p>Pro forma EBITDA $5,885,000 − $5,400,000<\/p><p>Revenues times the given depreciation expense: Depreciation and amortization $23,540,000 × 0.01<\/p><div class=\"tbl\"><table><tr><td>Pro forma EBIT<\/td><td>EBITDA minus depreciation and amortization:<\/td><\/tr><tr><td>$485,000 − $235,400<\/td><td><\/td><\/tr><tr><td>Pro forma taxes on EBIT<\/td><td>EBIT times tax rate: $249,600 × 0.30<\/td><\/tr><tr><td>Operating income after tax<\/td><td>EBIT minus taxes: $249,600 − $74,880<\/td><\/tr><\/table><\/div><p>Adjustments to Obtain FCFF<\/p><p>Plus: Depreciation and Add back noncash charges from above amortization<\/p><p>Expenditures cover depreciation and increase with revenues: Minus: Capital expenditures $235,400 + 0.04 × ($23,540,000 − $22,000,000)<\/p><div class=\"tbl\"><table><tr><td>Minus: Increase in working<\/td><td>The working capital will increase as revenues increase 0.15 × ($23,540,000 −<\/td><\/tr><tr><td>capital<\/td><td>$22,000,000)<\/td><\/tr><tr><td>FCFF<\/td><td>Operating income net of the adjustments above<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 31.2, LOS 31.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Thorngate Ventures Case Scenario<\/p><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in and subsequently actively manages its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms because<\/td><\/tr><tr><td>private firms are usually smaller and thus thought to be riskier. Furthermore, the lack of access to<\/td><td><\/td><\/tr><tr><td>liquid public equity markets can limit a private firm&#x27;s growth.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants<\/td><\/tr><tr><td>for top positions as public firms. Due to the higher risk, the managers they do attract tend to have<\/td><td><\/td><\/tr><tr><td>a shorter-term view of the firm and their tenure at the firm, compared to public firm managers. As<\/td><td><\/td><\/tr><tr><td>a result, the private firm may neglect profitable long-term projects.<\/td><td><\/td><\/tr><\/table><\/div><p>Due to its considerable success, Thorngate has recently attracted a substantial inflow of capital from investors. To deploy that capital, McDonnell and Lutge are considering the purchase of Albion Biotechnology. Albion is using advances in biotechnology for application in the pharmaceutical field. The analysts are primarily interested in Albion because the firm&#x27;s research team is developing a drug that Thorngate&#x27;s current pharmaceutical firm is also working on. McDonnell estimates that combining research teams would result in advances that no pharmaceutical competitor could match for at least two years. The firm is currently owned by its founders, who are familiar to Lutge through previous social contacts. Lutge hopes to avoid a competitive bidding process for the firm, because its founders have not publicly advertised the firm&#x27;s sale.<\/p><p>McDonnell is also examining the prospects of Balanced Metals, a metal fabrication firm. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide needed exposure. The growth in sales at Balanced has been impressive recently, but it is expected to slow considerably in the years ahead due to increased competition from overseas firms. The firm&#x27;s most valuable assets are its equipment and factory, located in a prime industrial area.<\/p><p>Balanced was previously considered for possible purchase by a competitor in the metal fabrication industry. Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained the following financial figures from the Balanced Metals CFO, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will equal depreciation plus approximately 4% of the firm&#x27;s incremental revenues. McDonnell wants to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>Lutge is valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years. However, given its size and private status, Lutge does not expect that Jensen can be easily sold. To obtain the appropriate price multiple for the Jensen valuation, he has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Lutge estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Lutge uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Lutge obtains a size premium using the smallest-firm-size decile of the database. McDonnell examines Lutge&#x27;s cost of capital calculations and makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>I am concerned about the use of this database. The estimate of the size premium may result in<\/td><\/tr><tr><td>an undervaluation of the Jensen equity interest.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The use of betas and the CAPM from the database may be inappropriate. If so, Lutge should<\/td><\/tr><tr><td>consider using the build-up method whereby an industry risk premium is used instead of beta.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is closest to the FCFF that McDonnell should estimate for Balanced Metals?<\/p><\/div>", "subj": "equity"}, {"n": 40, "q": "Which of the following income approaches would be most appropriate for valuing Balanced Metals?", "opts": ["The free cash flow method.", "The excess earnings method.", "The capitalized cash flow method."], "ans": "A", "expl": "The free cash flow method can accommodate multiple stage growth assumptions and is the most appropriate. The firm's growth is expected to slow considerably in the years ahead, so the constant growth assumption of the capitalized cash flow method would be inappropriate. The capitalized cash flow method is a single-stage model. The excess earnings method is useful when there are intangible assets to value, but that does not appear to be a concern in the valuation of Balanced. The firm's assets appear to be largely tangible (consisting of equipment and the factory). For Further Reference: (Study Session 11, Module 31.2, LOS 31.f)", "explhtml": "<p>The free cash flow method can accommodate multiple stage growth assumptions and is the most appropriate. The firm&#x27;s growth is expected to slow considerably in the years ahead, so the constant growth assumption of the capitalized cash flow method would be inappropriate. The capitalized cash flow method is a single-stage model.<\/p><p>The excess earnings method is useful when there are intangible assets to value, but that does not appear to be a concern in the valuation of Balanced. The firm&#x27;s assets appear to be largely tangible (consisting of equipment and the factory).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 31.2, LOS 31.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Thorngate Ventures Case Scenario<\/p><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in and subsequently actively manages its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms because<\/td><\/tr><tr><td>private firms are usually smaller and thus thought to be riskier. Furthermore, the lack of access to<\/td><td><\/td><\/tr><tr><td>liquid public equity markets can limit a private firm&#x27;s growth.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants<\/td><\/tr><tr><td>for top positions as public firms. Due to the higher risk, the managers they do attract tend to have<\/td><td><\/td><\/tr><tr><td>a shorter-term view of the firm and their tenure at the firm, compared to public firm managers. As<\/td><td><\/td><\/tr><tr><td>a result, the private firm may neglect profitable long-term projects.<\/td><td><\/td><\/tr><\/table><\/div><p>Due to its considerable success, Thorngate has recently attracted a substantial inflow of capital from investors. To deploy that capital, McDonnell and Lutge are considering the purchase of Albion Biotechnology. Albion is using advances in biotechnology for application in the pharmaceutical field. The analysts are primarily interested in Albion because the firm&#x27;s research team is developing a drug that Thorngate&#x27;s current pharmaceutical firm is also working on. McDonnell estimates that combining research teams would result in advances that no pharmaceutical competitor could match for at least two years. The firm is currently owned by its founders, who are familiar to Lutge through previous social contacts. Lutge hopes to avoid a competitive bidding process for the firm, because its founders have not publicly advertised the firm&#x27;s sale.<\/p><p>McDonnell is also examining the prospects of Balanced Metals, a metal fabrication firm. Thorngate currently does not have any manufacturing firms in its portfolio, and Balanced would provide needed exposure. The growth in sales at Balanced has been impressive recently, but it is expected to slow considerably in the years ahead due to increased competition from overseas firms. The firm&#x27;s most valuable assets are its equipment and factory, located in a prime industrial area.<\/p><p>Balanced was previously considered for possible purchase by a competitor in the metal fabrication industry. Although the sale was not consummated, McDonnell has learned that the firm estimated that costs could be reduced at Balanced by eliminating redundant overhead expenses. McDonnell has obtained the following financial figures from the Balanced Metals CFO, as well as the previously estimated synergistic savings from cost reductions. Capital expenditures will equal depreciation plus approximately 4% of the firm&#x27;s incremental revenues. McDonnell wants to forecast Balanced&#x27;s free cash flow to the firm (FCFF) for the next year.<\/p><div class=\"tbl\"><table><tr><td>Current revenues<\/td><td>$22,000,000<\/td><\/tr><tr><td>Revenue growth<\/td><td>7%<\/td><\/tr><tr><td>Gross profit margin<\/td><td>25%<\/td><\/tr><tr><td>Depreciation expense as a percent of sales<\/td><td>1%<\/td><\/tr><tr><td>Working capital as a percent of sales<\/td><td>15%<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>$5,400,000<\/td><\/tr><tr><td>Synergistic cost savings<\/td><td>$1,200,000<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>Lutge is valuing a noncontrolling equity interest in Jensen Gear, a small outdoors equipment retailer. Jensen has experienced healthy growth in earnings over the past three years. However, given its size and private status, Lutge does not expect that Jensen can be easily sold. To obtain the appropriate price multiple for the Jensen valuation, he has prepared a database of price multiples from the sale of entire public and private companies over the past 10 years, organized by industry classification. Using historical data, Lutge estimates a control premium of 18.7% and discount for lack of marketability of 24%.<\/p><p>To obtain the cost of capital for Jensen, Lutge uses a cost of capital database that includes public company betas, cost of equity, weighted average cost of capital, and other financial statistics by industry. Given Jensen&#x27;s small size, Lutge obtains a size premium using the smallest-firm-size decile of the database. McDonnell examines Lutge&#x27;s cost of capital calculations and makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>I am concerned about the use of this database. The estimate of the size premium may result in<\/td><\/tr><tr><td>an undervaluation of the Jensen equity interest.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>The use of betas and the CAPM from the database may be inappropriate. If so, Lutge should<\/td><\/tr><tr><td>consider using the build-up method whereby an industry risk premium is used instead of beta.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following income approaches would be most appropriate for valuing Balanced Metals?<\/p><\/div>", "subj": "equity"}, {"n": 41, "q": "Which of the following is closest to the total adjustment for control and marketability that would be applied to the Jensen valuation?", "opts": ["A discount of 5.3% would be applied.", "A discount of 36.0% would be applied.", "A discount of 42.7% would be applied."], "ans": "B", "expl": "Lutge is using the guideline transactions method (GTM) because his database uses the price multiples from the sale of entire public and private companies. The interest in Jensen is a noncontrolling equity interest, so a discount for lack of control (DLOC) will be applied to its valuation. A discount for lack of marketability (DLOM) will also be applied because the Jensen interest cannot be easily sold. The DLOC is backed out of the control premium. The total discount includes the discount for lack of marketability (DLOM). total discount = 1 − [(1 − DLOC)(1 − DLOM)] total discount = 1 − [(1 − 0.1575)(1 − 0.24)] = 36.0% For Further Reference: (Study Session 11, Module 31.4, LOS 31.i, 31.k)", "explhtml": "<p>Lutge is using the guideline transactions method (GTM) because his database uses the price multiples from the sale of entire public and private companies. The interest in Jensen is a noncontrolling equity interest, so a discount for lack of control (DLOC) will be applied to its valuation. A discount for lack of marketability (DLOM) will also be applied because the Jensen interest cannot be easily sold.<\/p><p>The DLOC is backed out of the control premium.<\/p><p>The total discount includes the discount for lack of marketability (DLOM).<\/p><p>total discount = 1 − [(1 − DLOC)(1 − DLOM)]<\/p><p>total discount = 1 − [(1 − 0.1575)(1 − 0.24)] = 36.0%<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 31.4, LOS 31.i, 31.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 37 through 42 relate to Equity Valuation.<\/p><p>Thorngate Ventures Case Scenario<\/p><p>Marsha McDonnell and Frank Lutge are analysts for the private equity firm Thorngate Ventures. Their primary responsibility is to value the equity of private firms in developed global economies. Thorngate&#x27;s clients consist of wealthy individuals and institutional investors. The firm invests in and subsequently actively manages its portfolio of private firms.<\/p><p>During a discussion with junior analysts at the firm, McDonnell compares the characteristics of private firms with those of public firms and makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Private firms typically have higher risk premiums and required returns than public firms because<\/td><\/tr><tr><td>private firms are usually smaller and thus thought to be riskier. Furthermore, the lack of access to<\/td><td><\/td><\/tr><tr><td>liquid public equity markets can limit a private firm&#x27;s growth.<\/td><td><\/td><\/tr><tr><td>Statement 2:<\/td><td>Because of their higher risk, private firms may not be able to attract as many qualified applicants<\/td><\/tr><tr><td>for top positions as public firms. Due to the
